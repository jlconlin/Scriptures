chapter: 30
claims:
  - where: 'when'
    claim: 'Aaron died in the fortieth year after the Exodus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/33?lang=eng'
    quote: 'died there, in the fortieth year after the children of Israel were come out of the land of Egypt'
  - where: 'when'
    claim: 'The laws of the book''s last chapters were given on the plains of Moab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/36?lang=eng'
    quote: 'These are the commandments and the judgments, which the Lord commanded by the hand of Moses unto the children of Israel in the plains of Moab by Jordan near Jericho.'
  - where: 'setting'
    claim: 'Leviticus already gave the rules for what could be vowed; this chapter is about the force of vows, placed beside the sacrifices because vows mostly concerned sacrifices'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/30.htm'
    quote: 'has been already laid down in Lev; but the chapter before us contains instructions with reference to the force of vows and renunciations. These are so far in place in connection with the general rules of sacrifice, that vows related for the most part to the presentation of sacrifices'
  - where: 'setting'
    claim: 'Deuteronomy 23 and Matthew 5:33 return to the keeping of vows'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/30.htm'
    quote: 'The importance of keeping vows is emphasized in Deuteronomy 23:21 ff., Ecclesiastes 5:4 f.; cf. Matthew 5:33.'
  - where: 'setting'
    claim: 'The Bible Dictionary sets Jer. 44:19 beside Num. 30 on the vows of dependent women'
    key: bd-vows
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/vows?lang=eng'
    quote: 'The vows of dependent women (wives or daughters) did not stand unless ratified explicitly or implicitly by the husband or father (Num. 30:3–16; see also Jer. 44:19).'
  - where: 'thread'
    claim: 'The four cases of a woman''s vow'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/30.htm'
    quote: 'Numbers 30:3-15 contain the rules relating to positive and negative vows made by a woman, and four different examples are given.'
  - where: 'section 3 plain'
    claim: 'Verses 6–8 concern a vow made before marriage and brought into it, and a rash utterance'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers+30&version=NRSVUE'
    quote: 'If she marries, while obligated by her vows or any thoughtless utterance of her lips by which she has bound herself'
  - where: 'section 4 plain'
    claim: 'Verse 13: to afflict herself, or to fast'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers+30&version=NRSVUE'
    quote: '30.13 Or to fast'
  - where: 'note 30:1 “Why the heads of the tribes”'
    claim: 'The law was given to the heads of the tribes because it touched family life (one older reading)'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/30.htm'
    quote: 'The instructions in question were addressed (Numbers 30:1) to "the heads of the tribes," because they entered into the sphere of civil rights, namely, into that of family life.'
  - where: 'note 30:2 “A vow and a bond”'
    claim: 'Two kinds of vows: dedication and abstinence'
    key: bd-vows
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/vows?lang=eng'
    quote: 'These were of two kinds: (a) dedication—some person or thing was given to the Lord (Lev. 27:1–24); (b) abstinence—a promise made to abstain from some lawful act or enjoyment (Num. 6:3).'
  - where: 'note 30:2 “A vow and a bond”'
    claim: 'Neder is a positive vow; issar a vow of abstinence, probably mostly fasting'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/30.htm'
    quote: 'נדר is a positive vow, or promise to give or sanctify any part of one''s property to the Lord. אסּר, from אסר, to bind or fetter, the negative vow, or vow of abstinence.'
  - where: 'note 30:2 “A vow and a bond”'
    claim: 'The abstinence probably consisted chiefly in fasting'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/30.htm'
    quote: 'in all probability it consisted chiefly in fasting and other similar abstinence from lawful things.'
  - where: 'note 30:2 “A vow and a bond”'
    claim: 'An obligation is a pledge of abstinence, e.g. from wine (Nazarite) or food'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/30.htm'
    quote: 'An obligation is a prohibition laid upon oneself, a pledge of abstinence; e.g from wine, as in the case of a Nazirite (ch. 6), or from food (1 Samuel 14:24, Acts 23:21)'
  - where: 'note 30:2 “A vow and a bond”'
    claim: '“To afflict the soul” in verse 13 may be rendered “to fast”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers+30&version=NRSVUE'
    quote: '30.13 Or to fast'
  - where: 'note 30:2 “Not to profane a spoken word”'
    claim: 'The verb means to violate one''s word'
    key: bdb
    url: 'https://biblehub.com/hebrew/2490.htm'
    quote: 'לֹא יַחֵל דְּבָרוֺ he shall not violate his word Numbers 30:3 (P).'
  - where: 'note 30:2 “Not to profane a spoken word”'
    claim: 'The same root, in the Piel, is used of violating a covenant'
    key: bdb
    url: 'https://biblehub.com/hebrew/2490.htm'
    quote: '3 violate a covenant Psalm 55:21; Psalm 89:35; Malachi 2:10'
  - where: 'note 30:2 “Not to profane a spoken word”'
    claim: 'The root behind “break” means pollute, defile, profane'
    key: bdb
    url: 'https://biblehub.com/hebrew/2490.htm'
    quote: 'III. [חָלַל] verb pollute, defile, profane;'
  - where: 'note 30:2 “Not to profane a spoken word”'
    claim: 'Breaking a solemn promise is a profanation; a vow is not a vow until spoken'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/30.htm'
    quote: 'he shall not profane his word] To break a solemn promise is an act of profanation.'
  - where: 'note 30:2 “Not to profane a spoken word”'
    claim: 'A vow is not a vow until expressed in words'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/30.htm'
    quote: 'A vow is not a vow until it has been expressed in words'
  - where: 'note 30:5 “Why “the LORD shall forgive her””'
    claim: 'Obedience to a father stood higher than a self-imposed religious service; the LORD forgives because of the father''s refusal (one older reading)'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/30.htm'
    quote: 'Jehovah would forgive her because of her father''s refusal. Obedience to a father stood higher than a self-imposed religious service.'
  - where: 'note 30:5 “Why “the LORD shall forgive her””'
    claim: '“Disallow” is literally “oppose”; “heareth” means comes to hear of it'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/30.htm'
    quote: 'disallow her] lit. ‘oppose her,’ express disapproval.'
  - where: 'note 30:5 “Why “the LORD shall forgive her””'
    claim: 'The father need not be present when the vow is spoken'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/30.htm'
    quote: 'heareth her vow] i.e. comes to hear of it; Numbers 30:7-8 shew that it does not necessarily mean that he is present when she actually utters her vow.'
  - where: 'note 30:5 “Why “the LORD shall forgive her””'
    claim: 'A modern translation reads “overrules her”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers+30&version=NRSVUE'
    quote: 'But if her father overrules her at the time that he hears of it'
  - where: 'note 30:6 “A vow brought into a marriage”'
    claim: 'Verses 6–8 concern a vow made before marriage and brought into it; the Hebrew says the vows are “upon herself”'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/30.htm'
    quote: 'The second case (Numbers 30:6-8) was that of a vow of performance or abstinence, made by a woman before her marriage, and brought along with her (עליה, "upon herself") into her marriage.'
  - where: 'note 30:6 “A vow brought into a marriage”'
    claim: 'The phrase behind “uttered ought out of her lips” means something said thoughtlessly'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/30.htm'
    quote: 'gossip of her lips, that which is uttered thoughtlessly or without reflection (cf. Leviticus 5:4).'
  - where: 'note 30:6 “A vow brought into a marriage”'
    claim: 'Cambridge reads verse 6 as a vow still binding at marriage, taken with the father''s approval'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/30.htm'
    quote: 'while her vows are upon her] If at the time of her marriage she was still bound by some vow or pledge of abstinence, which she had previously taken with her father’s approval.'
  - where: 'note 30:6 “A vow brought into a marriage”'
    claim: 'A modern translation renders the verse as a marriage while obligated by vows or a thoughtless utterance'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers+30&version=NRSVUE'
    quote: 'If she marries, while obligated by her vows or any thoughtless utterance of her lips by which she has bound herself'
  - where: 'note 30:6 “A vow brought into a marriage”'
    claim: 'The husband decides on a vow brought into marriage as the father did'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/30.htm'
    quote: 'In such a case the husband had to decide as to its validity, in the same way as the father before her marriage.'
  - where: 'thread'
    claim: 'The father or husband must act on the day he hears of the vow'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/30.htm'
    quote: 'In the day when he heard of it he could hold back his wife, i.e., dissolve her vow; but if he did not do this at once, he could not hinder its fulfilment afterwards.'
  - where: 'note 30:9 “The widow answers for herself”'
    claim: 'A widow''s or divorced woman''s vow had full force because she was not dependent on a husband (one older reading)'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/30.htm'
    quote: 'The third case (Numbers 30:9) was that of a vow made by a widow or divorced woman. Such a vow had full force, because the woman was not dependent upon a husband.'
  - where: 'note 30:9 “The widow answers for herself”'
    claim: 'A modern translation: “shall be binding upon her”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers+30&version=NRSVUE'
    quote: 'But every vow of a widow or of a divorced woman, by which she has bound herself, shall be binding upon her.'
  - where: 'note 30:9 “The widow answers for herself”'
    claim: 'The Bible Dictionary speaks of the vows of dependent women'
    key: bd-vows
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/vows?lang=eng'
    quote: 'The vows of dependent women (wives or daughters) did not stand unless ratified explicitly or implicitly by the husband or father'
  - where: 'note 30:15 “Who bears the guilt of a broken vow”'
    claim: 'If the husband consents and later compels her to break it, the iniquity rests on him, not on her'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/30.htm'
    quote: 'If, after tacitly consenting at the time that he heard of the vow, he compels her at a later time to break it, then Jehovah will not (as in the foregoing cases) forgive, but the iniquity will rest upon the husband and not upon the woman.'
  - where: 'note 30:15 “Who bears the guilt of a broken vow”'
    claim: 'Her iniquity is the sin she would have borne had she broken the vow herself: a sin offering, or the punishment God suspended over it'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/30.htm'
    quote: 'the sin which the wife would have had to bear if she had broken the vow of her own accord. This consisted either in a sin-offering to expiate her sin (Leviticus 5:4.); or if this was omitted, in the punishment which God suspended over the sin'
  - where: 'christ'
    claim: 'Jesus'' teaching on oaths (Matt. 5:33) takes up the law of keeping vows'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/30.htm'
    quote: 'The importance of keeping vows is emphasized in Deuteronomy 23:21 ff., Ecclesiastes 5:4 f.; cf. Matthew 5:33.'
  - where: 'christ'
    claim: 'The Sermon on the Mount''s teachings replace and transcend aspects of the law of Moses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/5?lang=eng'
    quote: 'Jesus preaches the Sermon on the Mount—Its teachings replace and transcend some aspects of the law of Moses'
  - where: 'christ'
    claim: 'Baptismal covenants are renewed at the sacrament'
    key: rawlins-covenants
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/covenants-sacraments-vows-active-pathway-mercy'
    quote: 'the Lord has provided the sacrament for regular renewal of our covenants; weekly renewal keeps them fresh and lively.'
  - where: 'parallels'
    claim: 'Leviticus 27 gave the rules for what could be vowed'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/30.htm'
    quote: 'The rules by which vows were to be legally regulated, so far as their objects and their discharge were concerned, has been already laid down in Lev'
  - where: 'parallels'
    claim: 'Deut. 23:21 and Matt. 5:33 on keeping vows'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/30.htm'
    quote: 'The importance of keeping vows is emphasized in Deuteronomy 23:21 ff., Ecclesiastes 5:4 f.; cf. Matthew 5:33.'
  - where: 'note 30:2 “Not to profane a spoken word”'
    claim: 'Moses: not to vow is no sin'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/23?lang=eng'
    quote: 'But if thou shalt forbear to vow, it shall be no sin in thee.'
  - where: 'note 30:5 “Why “the LORD shall forgive her””'
    claim: 'The words of forgiveness for the daughter (and again for the wife, vv. 8, 12)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/30?lang=eng'
    quote: 'and the Lord shall forgive her, because her father disallowed her.'
  - where: 'christ'
    claim: 'Jesus asks for a plain yea or nay'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/5?lang=eng'
    quote: 'But let your communication be, Yea, yea; Nay, nay: for whatsoever is more than these cometh of evil.'
  - where: 'christ'
    claim: 'Vows offered up on all days and at all times'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/59?lang=eng'
    quote: 'Nevertheless thy vows shall be offered up in righteousness on all days and at all times;'
  - where: 'christ'
    claim: 'At baptism a disciple makes promises to God, vows to remember Christ and keep his commandments'
    key: rawlins-covenants
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/covenants-sacraments-vows-active-pathway-mercy'
    quote: 'Baptism and confirmation are observable events, during which we make general and universal promises to always remember Christ, to keep his commandments, and to serve him to the end. … our promises—vows made long ago'
