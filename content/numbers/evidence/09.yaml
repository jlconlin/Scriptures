chapter: 9
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'The chapter opens at Sinai in the first month of the second year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/9?lang=eng'
    quote: 'And the LORD spake unto Moses in the wilderness of Sinai, in the first month of the second year after they were come out of the land of Egypt, saying,'
  - where: 'setting'
    claim: 'This is the first Passover after the Exodus'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/9.htm'
    quote: 'Provision is here made for the celebration of the Passover a month later for persons who were unavoidably prevented from observing it on the right day. It is the first Passover after the Exodus.'
  - where: 'setting'
    claim: 'After Sinai Israel began its final journey to the promised land with a Passover (Num. 9), as it had left Egypt with one'
    key: sc-knowhy-668
    url: 'https://scripturecentral.org/knowhy/how-does-john-portray-jesus-as-the-way-of-the-temple'
    quote: 'Likewise, after the events that took place on Mount Sinai, the house of Israel began its final journey to the promised land with a second Passover (see Numbers 9).'
  - where: 'setting'
    claim: 'Verse 15 resumes the day the tabernacle was set up (Ex. 40:34–38) and describes more fully what Ex. 40:36–37 alluded to'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/9.htm'
    quote: 'In Numbers 9:15 the historian refers to this fact, and then describes more fully what had been already briefly alluded to in Exodus 40:36-37, namely, that when the cloud rose up from the dwelling of the tabernacle it was a sign for removing'
  - where: 'thread'
    claim: 'The repetitions of 9:15–23 bring out Israel’s dependence on the LORD’s guidance and His care'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/9.htm'
    quote: 'The elaboration of the account (Numbers 9:15-23), which abounds with repetitions, is intended to bring out the importance of the fact, and to awaken the consciousness not only of the absolute dependence of Israel upon the guidance of Jehovah, but also of the gracious care of their God'

  # ---------- note 9:1 ----------
  - where: 'note 9:1 “A month before the census”'
    claim: 'The census began on the first day of the second month'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/1?lang=eng'
    quote: 'And the Lord spake unto Moses in the wilderness of Sinai, in the tabernacle of the congregation, on the first day of the second month, in the second year'
  - where: 'note 9:1 “A month before the census”'
    claim: 'The first month is the month before the census'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/9.htm'
    quote: '1. in the first month] The month preceding the census (Numbers 1:1).'
  - where: 'note 9:1 “A month before the census”'
    claim: 'The tabernacle was reared on the first day of the first month of the second year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'And it came to pass in the first month in the second year, on the first day of the month, that the tabernacle was reared up.'
  - where: 'note 9:1 “A month before the census”'
    claim: 'The command was renewed immediately after the tabernacle was set up, to keep the Passover at Sinai rather than wait for Canaan'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/9.htm'
    quote: 'In the first month of the second year after the exodus, that is to say, immediately after the erection of the tabernacle (Exodus 40:2, Exodus 40:17), this command was renewed … not to postpone it … until they came to Canaan, but to keep it there at Sinai.'
  - where: 'note 9:1 “A month before the census”'
    claim: 'If the text is correct something has been lost before verse 2, perhaps because the section was moved from its original position; the Septuagint reads “speak and let”'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/9.htm'
    quote: 'If the text is correct some previous command or portion of the sentence has been lost. This may have been due to the transposition of the section from its original position. LXX. reads εἰπὸν καὶ κ.τ.λ., ‘speak and let the children of Israel keep.’'

  # ---------- note 9:7 ----------
  - where: 'note 9:7 “Unclean on the appointed day”'
    claim: 'Touching a dead body made a person unclean seven days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/19?lang=eng'
    quote: 'He that toucheth the dead body of any man shall be unclean seven days.'
  - where: 'note 9:7 “Unclean on the appointed day”'
    claim: 'Eating a sacrifice with uncleanness upon one meant being cut off'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/7?lang=eng'
    quote: 'But the soul that eateth of the flesh of the sacrifice of peace offerings, that pertain unto the Lord, having his uncleanness upon him, even that soul shall be cut off from his people.'
  - where: 'note 9:11 “The second Passover”'
    claim: 'Hezekiah and the congregation decided to keep the Passover in the second month'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/30?lang=eng'
    quote: 'For the king had taken counsel, and his princes, and all the congregation in Jerusalem, to keep the passover in the second month.'
  - where: 'note 9:11 “The second Passover”'
    claim: 'The reason: the priests had not sanctified themselves and the people had not gathered'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/30?lang=eng'
    quote: 'For they could not keep it at that time, because the priests had not sanctified themselves sufficiently, neither had the people gathered themselves together to Jerusalem.'
  - where: 'note 9:11 “The second Passover”'
    claim: 'Many ate uncleansed; Hezekiah prayed for them and the LORD healed the people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/30?lang=eng'
    quote: 'had not cleansed themselves, yet did they eat the passover otherwise than it was written. But Hezekiah prayed for them, saying, The good Lord pardon every one'

  # ---------- note 9:13 ----------
  - where: 'note 9:13 “No excuse for indifference”'
    claim: 'The threat of verse 13 guards the permission from being turned into an excuse for postponing from indifference'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/9.htm'
    quote: 'But lest any one should pervert this permission, to celebrate the Passover a month later in case of insuperable difficulties … into an excuse for postponing it without any necessity and merely from indifference'
  - where: 'note 9:13 “No excuse for indifference”'
    claim: 'The stranger was first required to be circumcised (Ex. 12:48–49)'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/9.htm'
    quote: 'cf. Exodus 12:48-49, according to which the stranger was required first of all to let himself be circumcised.'
  - where: 'note 9:13 “No excuse for indifference”'
    claim: 'Exodus 12:48 sets circumcision as the condition for the stranger'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/12?lang=eng'
    quote: 'And when a stranger shall sojourn with thee, and will keep the passover to the Lord, let all his males be circumcised, and then let him come near and keep it'

  # ---------- note 9:18 ----------
  - where: 'note 9:18 “At the mouth of the LORD”'
    claim: 'The Hebrew reads “at the mouth of Jehovah”; the cloud a visible sign of God’s presence, so Israel learned to follow the Lord literally'
    key: ot-manual-numbers-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-1-12-wilderness-wanderings-part-1?lang=eng'
    quote: 'Since the cloud of smoke and fire was a visible sign of God’s presence, Israel learned to literally follow the Lord. They made camp, broke camp, traveled, and performed their services at the command of the Lord—the Hebrew reads, “at the mouth of Jehovah” (see v. 18).'
  - where: 'note 9:18 “At the mouth of the LORD”'
    claim: 'The Hebrew of 9:18 is ʿal-pî YHWH'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'פִּ֣י'
  - where: 'note 9:18 “At the mouth of the LORD”'
    claim: 'peh means mouth'
    key: bdb
    url: 'https://biblehub.com/hebrew/6310.htm'
    quote: 'Strong''s Hebrew: 6310. פֶּה (peh) -- Mouth'

  # ---------- note 9:19 ----------
  - where: 'note 9:19 “Keeping the charge by staying put”'
    claim: 'mishmeret: a guard, watch, charge, function'
    key: bdb
    url: 'https://biblehub.com/hebrew/4931.htm'
    quote: 'a guard, watch, charge, function'
  - where: 'note 9:19 “Keeping the charge by staying put”'
    claim: 'BDB places Num. 9:19, 23 under the charge or injunction of the LORD, specific injunctions'
    key: bdb
    url: 'https://biblehub.com/hebrew/4931.htm'
    quote: '3 charge, injunction of ׳י, with שָׁמַר, in General Deuteronomy 11:1 … of specific injunctions Leviticus 18:30; Numbers 9:19,23.'
  - where: 'christ'
    claim: 'The Passover gave Israel a type and reminder of the Only Begotten, whose blood saves spiritually'
    key: ot-manual-numbers-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-1-12-wilderness-wanderings-part-1?lang=eng'
    quote: 'The crucial concept taught by the Passover feast was that Israel, through an exacting ceremony, had a type and a reminder of the Only Begotten Son of God, whose blood would save man spiritually as the blood on the door posts in Egypt had saved them physically.'
  - where: 'christ'
    claim: 'Paul: the fathers under the cloud; that Rock was Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/10?lang=eng'
    quote: 'Moreover, brethren, I would not that ye should be ignorant, how that all our fathers were under the cloud, and all passed through the sea;'
  - where: 'christ'
    claim: 'Israel was schooled by the cloud to follow Jehovah, who has ever directed His church and kingdom; the physical sign had a more important spiritual corollary'
    key: ot-manual-numbers-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-1-12-wilderness-wanderings-part-1?lang=eng'
    quote: 'In very deed they were schooled to follow Jehovah, who has ever directed His church and kingdom, and yet many of them did not transfer the meaning from this miraculous physical demonstration to its more important spiritual corollary.'
