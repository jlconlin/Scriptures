chapter: 11
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'Israel left Sinai in the second month of the second year and went three days’ journey'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/10?lang=eng'
    quote: 'And they departed from the mount of the LORD three days’ journey: and the ark of the covenant of the LORD went before them in the three days’ journey, to search out a resting place for them.'
  - where: 'setting'
    claim: 'Numbers 11 is the first of many murmurings in Numbers'
    key: scripture-helps-num
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng'
    quote: 'This is the first of many instances of murmuring recorded in Numbers.'
  - where: 'setting'
    claim: 'Numbers 11–25 portray murmuring, rebellion and apostasy; consequences understood in the context of the Sinai covenants'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'most accounts narrated in Numbers 11–25 are painful in their portrayal of murmuring (chapters 11, 21), rebellion against Moses’s leadership (chapters 12, 14, 16), and apostasy (chapter 25)'
  - where: 'setting'
    claim: 'Sinai covenants did not ensure obedience; consequences understood in the covenant context'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Their spiritual experiences and covenants at Mount Sinai did not automatically ensure their faith and obedience as they moved toward Canaan.[12] The consequences meted out by the Lord in the tragic accounts in Numbers can only be understood in the context of the covenant commitments the Israelites had made at Mount Sinai'
  - where: 'setting'
    claim: 'The list of camps goes from Sinai to Kibroth-hattaavah and Hazeroth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/33?lang=eng'
    quote: 'And they removed from the desert of Sinai, and pitched at Kibroth-hattaavah. And they departed from Kibroth-hattaavah, and encamped at Hazeroth.'
  - where: 'setting'
    claim: 'The center of Numbers concerns prophetic leadership and true prophets; the seventy are an instance'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'The last major theme that will be mentioned here deals with the nature of prophetic leadership and what constitutes a true prophet. The center portion of Numbers, in particular, highlights these related issues. In Numbers 11:14–15, Jehovah provided spiritual powers to seventy Israelite men'
  - where: 'thread'
    claim: 'The people’s complaints are not prayers toward heaven'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'This can be deduced by the phrase “the people complained” later followed by “and the Lord heard it.” Therefore, the people’s complaints are not prayers toward heaven.'
  - where: 'thread'
    claim: 'Moses’ complaint is addressed to God for help; unbelief complains and does not pray'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/11.htm'
    quote: 'that it is addressed to God, for the purpose of entreating help and deliverance from Him; whereas unbelief complains of the ways of God, but while complaining of its troubles, does not pray to the Lord its God.'
  - where: 'thread'
    claim: 'The LORD relieved Moses without blaming his words'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/11.htm'
    quote: 'Jehovah therefore relieved him in the distress of which he complained, without blaming the words of His servant, which bordered on despair.'

  # ---------- sections ----------
  - where: 'section 1 plain'
    claim: 'The fire consumed the outlying parts of the camp'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers+11&version=NRSVUE'
    quote: 'Then the fire of the Lord burned against them and consumed some outlying parts of the camp.'
  - where: 'section 2 plain'
    claim: '“Mixed multitude” as the crowd that came with them; “soul dried away” as wasting'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers+11&version=NRSVUE'
    quote: 'The camp followers with them had a strong craving, and the Israelites also wept again and said, “If only we had meat to eat! … but now our strength is dried up, and there is nothing at all but this manna to look at.”'
  - where: 'section 3 plain'
    claim: 'The nursing father as a nurse carrying a baby'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers+11&version=NRSVUE'
    quote: '‘Carry them in your bosom as a wet nurse carries a nursing child, to the land that you promised on oath to their ancestors’?'
  - where: 'section 6 plain'
    claim: 'Kibroth-hattaavah means the graves of lust'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/11?lang=eng'
    quote: 'IE The graves of lust.'

  # ---------- note 11:1 ----------
  - where: 'note 11:1 “Fire at the edge of the camp”'
    claim: 'The Hebrew has no word for “them”; the text does not say what was consumed'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'Yet, the text does not say what was consumed. Note that in the King James Version, the word “them” is included, but the Hebrew equivalent does not appear in the original.'
  - where: 'note 11:1 “Fire at the edge of the camp”'
    claim: 'The Hebrew reads “and it consumed in the end of the camp” (watto’kal biqtseh hammachaneh), no object'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'וַתֹּ֖אכַל בִּקְצֵ֥ה הַֽמַּחֲנֶֽה'
  - where: 'note 11:1 “Fire at the edge of the camp”'
    claim: 'A modern translation: consumed some outlying parts of the camp'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers+11&version=NRSVUE'
    quote: 'Then the fire of the Lord burned against them and consumed some outlying parts of the camp.'
  - where: 'note 11:1 “Fire at the edge of the camp”'
    claim: 'The fire was quenched when Moses prayed; the place named Taberah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/11?lang=eng'
    quote: 'And the people cried unto Moses; and when Moses prayed unto the LORD, the fire was quenched.'
  - where: 'note 11:4 “The rabble and the craving”'
    claim: 'Ex. 12:38 has ʿereb rab'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'עֵ֥רֶב רַ֖ב'
  - where: 'note 11:4 “The rabble and the craving”'
    claim: 'Num. 11:4 has ha’sapsup'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'וְהָֽאסַפְסֻף֙'
  - where: 'note 11:4 “The rabble and the craving”'
    claim: 'ʾasapsup: collection, rabble, only here, of the camp-followers'
    key: bdb
    url: 'https://biblehub.com/hebrew/628.htm'
    quote: '[אֲסַפְסֻף] noun [masculine] collection, rabble, only הָאסַפְסֻף Numbers 11:4 of the camp-followers attending Hebrews at the Exodus.'
  - where: 'note 11:4 “The rabble and the craving”'
    claim: 'taʾawah: desire, of longing for the dainties of Egypt, as a cognate accusative; names Kibroth-hattaavah'
    key: bdb
    url: 'https://biblehub.com/hebrew/8378.htm'
    quote: 'particularly of longing for dainties of Egypt Numbers 11:4; Psalm 106:14 (both accusative of cognate meaning) … proper name given to place where it occurred קִבְרוֺת הַתַּאֲוָה (q. v.) Numbers 11:34,35'
  - where: 'note 11:4 “The rabble and the craving”'
    claim: 'A modern translation: the camp followers had a strong craving'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers+11&version=NRSVUE'
    quote: 'The camp followers with them had a strong craving, and the Israelites also wept again'
  - where: 'note 11:4 “The rabble and the craving”'
    claim: 'They had herds; the craving was weariness of a monotonous diet'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'They had left Egypt with “flocks, and herds, even very much cattle” (Exodus 12:38). Red meat was not what they were craving. … Although manna was a blessing, they have become tired of eating the same thing over and over again'
  - where: 'note 11:4 “The rabble and the craving”'
    claim: 'Kibroth-hattaavah: the graves of lust (footnote)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/11?lang=eng'
    quote: 'IE The graves of lust.'

  # ---------- note 11:7 ----------
  - where: 'note 11:7 “The manna described again”'
    claim: 'Moses describes the manna again to point out the perversion of the murmurers'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/11.htm'
    quote: 'To point out this inward perversion on the part of the murmuring people, Moses once more described the nature, form, and taste of the manna, and its mode of preparation, as a pleasant food which God sent down to His people with the dew of heaven'

  - where: 'note 11:7 “The manna described again”'
    claim: 'Exodus gives the taste as wafers made with honey'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/16?lang=eng'
    quote: 'and it was like coriander seed, white; and the taste of it was like wafers made with honey.'

  # ---------- note 11:12 ----------
  - where: 'note 11:12 “A nursing father”'
    claim: 'ʾomen, participle of ʾaman: support, nourish'
    key: bdb
    url: 'https://biblehub.com/hebrew/539.htm'
    quote: 'Qal Participle אֹמֵן — … 1 as verb support, nourish 2 Kings 10:1,5; Esther 2:7,'
  - where: 'note 11:12 “A nursing father”'
    claim: 'A modern translation: as a wet nurse carries a nursing child'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers+11&version=NRSVUE'
    quote: '‘Carry them in your bosom as a wet nurse carries a nursing child, to the land that you promised on oath to their ancestors’?'
  - where: 'note 11:12 “A nursing father”'
    claim: 'Moses pleads that the duty of carrying Israel rests with God, Israel’s Creator and Father'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/11.htm'
    quote: 'He does not intend by these words to throw off entirely all care for the people, but simply to plead with God that the duty of carrying and providing for Israel rests with Him, the Creator and Father of Israel (Exodus 4:22; Isaiah 63:16).'

  # ---------- note 11:16 ----------
  - where: 'note 11:16 “Seventy elders to share the burden”'
    claim: 'shoter: apparently subordinate officer, judicial, civil or military; with elders in Num. 11:16'
    key: bdb
    url: 'https://biblehub.com/hebrew/7860.htm'
    quote: 'apparently subordinate officer, judicial, civil or military (compare DrDeuteronomy 1. 15 GrayNumbers 11:16)'
  - where: 'note 11:16 “Seventy elders to share the burden”'
    claim: '“Whom thou knowest” implies an existing relationship'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'The Lord instructs Moses to gather seventy elders “whom thou knowest.” This implies that Moses would have already developed a relationship with them in order to know whom to call.'
  - where: 'note 11:16 “Seventy elders to share the burden”'
    claim: 'The Church’s footnote at 11:14 points to Ex. 18:18'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/11?lang=eng'
    quote: '“heavy”: Ex. 18:18.'
  - where: 'note 11:16 “Seventy elders to share the burden”'
    claim: 'Possible to see an Old Testament precedent for the office of Seventy in Num. 11:16'
    key: sc-knowhy-813
    url: 'https://scripturecentral.org/knowhy/why-is-the-church-of-jesus-christ-of-latter-day-saints-organized-according-to-ancient-patterns'
    quote: 'It is also possible to see in the Old Testament precedents for the priesthood office of the Seventy, as Moses was instructed to call seventy elders of Israel who stood with him in God’s presence (Exodus 24:1; Numbers 11:16).'
  - where: 'note 11:16 “Seventy elders to share the burden”'
    claim: 'D&C 107:25 on the Seventy as especial witnesses'
    key: sc-knowhy-813
    url: 'https://scripturecentral.org/knowhy/why-is-the-church-of-jesus-christ-of-latter-day-saints-organized-according-to-ancient-patterns'
    quote: 'According to this revelation, “The Seventy are also called to preach the gospel, and to be especial witnesses unto the Gentiles and in all the world—thus differing from other officers in the church in the duties of their calling” (verse 25).'
  - where: 'note 11:16 “Seventy elders to share the burden”'
    claim: 'The same KnoWhy sets beside them the seventy of Luke 10:1'
    key: sc-knowhy-813
    url: 'https://scripturecentral.org/knowhy/why-is-the-church-of-jesus-christ-of-latter-day-saints-organized-according-to-ancient-patterns'
    quote: 'Likewise, in the New Testament Luke records that “the Lord appointed other seventy also, and sent them two and two before his face into every city and place, whither he himself would come” (Luke 10:1).'

  # ---------- note 11:17 ----------
  - where: 'note 11:17 “Moses’ spirit on the seventy”'
    claim: 'The seventy were endowed with some of Moses’ authority and spiritual gifts'
    key: ot-manual-numbers-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-1-12-wilderness-wanderings-part-1?lang=eng'
    quote: 'seventy men were chosen and endowed with the ‘spirit that was upon him’ (i.e., upon Moses; it means they were endowed with some of the same authority and spiritual gifts) so that they were able also to ‘prophesy.’'
  - where: 'note 11:17 “Moses’ spirit on the seventy”'
    claim: 'The spirit as Moses’ inspiration, leadership, perhaps authority; delegation'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'This should be understood as Moses’s inspiration, that gift of leadership that he has, and perhaps his authority. Moses would be delegating his priesthood responsibilities.'
  - where: 'note 11:25 “Did not cease, or did not do it again”'
    claim: 'The Hebrew is welo yasaphu'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'וְלֹ֥א יָסָֽפוּ'
  - where: 'note 11:25 “Did not cease, or did not do it again”'
    claim: 'yasaph: add'
    key: bdb
    url: 'https://biblehub.com/hebrew/3254.htm'
    quote: 'יָסַף214 verb add'
  - where: 'note 11:25 “Did not cease, or did not do it again”'
    claim: 'Septuagint: they prophesied and ceased'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/numbers/11.htm'
    quote: 'and when the spirit rested upon them, they prophesied and ceased.'
  - where: 'note 11:25 “Did not cease, or did not do it again”'
    claim: 'A modern translation: they did not do so again'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers+11&version=NRSVUE'
    quote: 'and when the spirit rested upon them, they prophesied. But they did not do so again.'
  - where: 'note 11:25 “Did not cease, or did not do it again”'
    claim: '“Did not add” = did not repeat; Vulgate and Onkelos “ceased not” is incorrect'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/11.htm'
    quote: '"they prophesied, and did not add;" i.e., they did not repeat the prophesyings any further. … the rendering supported by the Vulgate and Onkelos, nec ultro cessaverunt ("and ceased not"), is incorrect.'
  - where: 'note 11:25 “Did not cease, or did not do it again”'
    claim: 'A convincing proof to Moses and the elders'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/11.htm'
    quote: 'In any case, however, it must have been effected in such a way, that Moses and the elders received a convincing proof of the reality of the affair.'
  - where: 'note 11:25 “Did not cease, or did not do it again”'
    claim: 'Prophesy means to declare or speak forth; the seventy may have borne testimony'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'The Hebrew word translated both as “prophet” and “prophesy” means “to declare or speak forth.” These seventy may have been bearing testimony of the experience they had just had at the cloud.'

  # ---------- note 11:29 ----------
  - where: 'note 11:29 “Jealous for Moses”'
    claim: 'qanaʾ: be jealous, zealous; participle in Num. 11:29'
    key: bdb
    url: 'https://biblehub.com/hebrew/7065.htm'
    quote: 'קָנָא verb denominative Pi`el be jealous, zealous (Gerber131); … Participle מְקַנֵּא Numbers 11:29'
  - where: 'note 11:29 “Jealous for Moses”'
    claim: 'Joshua expressed concern for Moses’ position; “Are you jealous for my sake?”; an indicator of a true prophet'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'This prompted Joshua to express concern for Moses’s position, to which Moses replied, “Are you jealous for my sake?'
  - where: 'note 11:29 “Jealous for Moses”'
    claim: 'One indicator of a true prophet, by biblical standards'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Thus, one indicator of a true prophet, by biblical standards, is having access to the spiritual gifts necessary to communicate and help bring about divine will.'
  - where: 'note 11:29 “Jealous for Moses”'
    claim: 'Septuagint: of the number of them that were enrolled'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/numbers/11.htm'
    quote: 'and these were of the number of them that were enrolled, but they did not come to the tabernacle; and they prophesied in the camp.'
  - where: 'note 11:29 “Jealous for Moses”'
    claim: 'The elders met in the tent outside the camp (Ex. 33:7)'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'Eldad and Medad had not gone “out unto the tabernacle” but had “remained . . . in the camp.” Apparently, the other non-Levite elders of the people had met Moses in the other tent, outside of camp.'
  - where: 'note 11:29 “Jealous for Moses”'
    claim: 'Compares Mark 9:38–40'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'In the New Testament, John said something quite similar: “Master, we saw one casting out devils in thy name, and he followeth not us: and we forbad him, because he followeth not us” (Mark 9:38).'
  - where: 'note 11:29 “Jealous for Moses”'
    claim: 'The tent pitched without the camp'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/33?lang=eng'
    quote: 'And Moses took the tabernacle, and pitched it without the camp, afar off from the camp, and called it the Tabernacle of the congregation.'

  # ---------- note 11:31 ----------
  - where: 'note 11:31 “Quails two cubits deep”'
    claim: 'A modern translation: two cubits deep on the ground'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers+11&version=NRSVUE'
    quote: 'all around the camp, about two cubits deep on the ground.'
  - where: 'note 11:31 “Quails two cubits deep”'
    claim: 'Quails stay low, tired from the trek'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'According to their seasonal migrations, quails fly over Sinai. They are known to stay low to the ground because they become tired from the long trek.'
  - where: 'note 11:31 “Quails two cubits deep”'
    claim: 'In Exodus the reader is not told what happened to the quails'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'Exodus 16:13, a similar quail account, describes an aftermath much different from the one relayed here. In Exodus, the reader had not been told what happened to the quails.'
  - where: 'note 11:31 “Quails two cubits deep”'
    claim: 'The smallest catch about one hundred bushels'
    key: ot-manual-numbers-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-1-12-wilderness-wanderings-part-1?lang=eng'
    quote: 'The smallest catch equaled about one hundred bushels, far beyond normal need.'
  - where: 'note 11:31 “Quails two cubits deep”'
    claim: 'Quails in Exodus 16:13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/16?lang=eng'
    quote: 'And it came to pass, that at even the quails came up, and covered the camp'

  # ---------- note 11:33 ----------
  - where: 'note 11:33 “Why the meat ended in graves”'
    claim: 'Ps. 106:15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/106?lang=eng'
    quote: 'And he gave them their request; but sent leanness into their soul.'

  # ---------- christ ----------
  - where: 'christ'
    claim: 'In this dispensation all baptized members receive the gift of the Holy Ghost and may have the gift of prophecy'
    key: ot-manual-numbers-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-1-12-wilderness-wanderings-part-1?lang=eng'
    quote: 'Note that we live in a dispensation when all members of the congregation of the Lord may have the gift of prophecy, and other gifts, by virtue of the fact that all who are baptized are given the ‘Gift of the Holy Ghost.’'
  - where: 'christ'
    claim: 'Jesus on the manna and the true bread'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/6?lang=eng'
    quote: 'Then Jesus said unto them, Verily, verily, I say unto you, Moses gave you not that bread from heaven; but my Father giveth you the true bread from heaven.'

  - where: 'note 11:17 “Moses’ spirit on the seventy”'
    claim: 'The seventy bear the burden; the LORD came down in a cloud'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/11?lang=eng'
    quote: 'And the LORD came down in a cloud, and spake unto him, and took of the spirit that was upon him, and gave it unto the seventy elders'
  - where: 'note 11:1 “Fire at the edge of the camp”'
    claim: 'Taberah comes from a root meaning to burn'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'Moses names the place Taberah, which comes from a root that means “to burn,” perhaps a reminder that our actions have either positive or negative outcomes.'
  - where: 'section 1 plain'
    claim: 'Taberah from a root meaning to burn'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'Moses names the place Taberah, which comes from a root that means “to burn,”'
  - where: 'note 11:31 “Quails two cubits deep”'
    claim: 'Cured them in the sun'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'Not knowing how long the birds would stay, the Israelites “spread them all abroad,” curing them in the sun, making them into a sort of jerky.'
