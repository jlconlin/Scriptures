chapter: 2
claims:
  # ---------- setting ----------
  - where: setting
    claim: 'Numbers is named from its two censuses, and its first part, 1:1–10:10, is the preparation for leaving Sinai'
    key: bd-numbers
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/numbers?lang=eng'
    quote: 'so called from the double numbering or census of the people (Num. 1–4; 26). … (1) 1:1–10:10, preparation for departure from Sinai.'
  - where: setting
    claim: 'Numbers 1:1–10:11 tells of the final weeks at Sinai, where Israel had made covenant and built the tabernacle by divine design, including the census of fighting men'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'where the Israelites had entered into a covenant relationship with him, and where they had then constructed the tabernacle according to divine design (Exodus 18–40). Numbers 1:1–10:11 relates events during the Israelites’ final weeks at Mount Sinai, including the numbering of Israelite fighting men'
  - where: setting
    claim: 'The total of verse 32 is 603,550 men, not including the Levites'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/2.htm'
    quote: 'In Numbers 2:32 we have the whole number given, 603,550 men, not including the Levites (Numbers 2:33, see at Numbers 1:49)'
  - where: setting
    claim: 'The order is used when Israel leaves Sinai (Judah first, Dan the rearward), and Balaam sees Israel by tribes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/2?lang=eng'
    quote: '2a “father’s”: Num. 24:2. … 9a “Judah”: Num. 10:14.'

  # ---------- thread ----------
  - where: thread
    claim: 'Three tribes on each side of the tabernacle under one banner, forming four camps'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/2.htm'
    quote: 'on every side of the tabernacle three tribes were encamped side by side and united under one banner, so that the twelve tribes formed four large camps or divisions of an army.'
  - where: thread
    claim: 'The leading tribe of each group is named first and the numbers of the three are reckoned under its name'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/2.htm'
    quote: 'The most important tribe in each group of three is mentioned first, and the numbers of all the three together are reckoned under its name (Numbers 2:9; Numbers 2:16; Numbers 2:24; Numbers 2:31).'
  - where: thread
    claim: 'Judah camps with Issachar and Zebulun, descendants of Leah'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/2.htm'
    quote: 'by its side the tribes of Issachar and Zebulun, the descendants of Leah, under the command and banner of Judah'
  - where: thread
    claim: 'Reuben camps with Simeon and Gad, descendants of Leah and Zilpah'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/2.htm'
    quote: 'On the south side was the standard of Reuben, with which Simeon and Gad, descendants of Leah and her maid Zilpah, were associated'
  - where: thread
    claim: 'Ephraim camps with Manasseh and Benjamin, all the descendants of Rachel'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/2.htm'
    quote: 'On the west the standard of Ephraim, with the tribes of Manasseh and Benjamin, that is to say, the whole of the descendants of Rachel'
  - where: thread
    claim: 'The northern camp, with Asher and Naphtali, are the descendants of the maids, the rear on the march'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/2.htm'
    quote: 'with Asher and Naphtali, the descendants of the maids Bilhah and Zilpah, 157,600 men, who were to be the last to break up, and formed the rear on the march.'
  - where: christ
    claim: 'God’s house is a house of order, and the camp of Israel symbolically represented it'
    key: ot-manual-numbers-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-1-12-wilderness-wanderings-part-1?lang=eng'
    quote: 'God’s house is a house of order (see D&C 132:8). In symbolic representation thereof, so was the camp of Israel. Order was maintained in both their encampments and marches.'

  # ---------- notes ----------
  - where: 'note 2:2 “Standards and ensigns”'
    claim: 'The degel is the large field sign of each three-tribe division, and also the army under it; the signs are smaller flags of tribes and fathers’ houses'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/2.htm'
    quote: 'denotes primarily the larger field sign, possessed by every division composed of three tribes, which was also the banner of the tribe at the head of each division; and secondarily, in a derivative signification, it denotes the army united under one standard'
  - where: 'note 2:2 “Standards and ensigns”'
    claim: 'The ensigns were the smaller flags carried at the head of tribes and fathers’ houses'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/2.htm'
    quote: 'the signs (ensigns), were the smaller flags or banners which were carried at the head of the different tribes and subdivisions of the tribes (the fathers'' houses).'
  - where: 'note 2:2 “Standards and ensigns”'
    claim: 'The Old Testament never describes the standards; rabbinic tradition assigned a lion, man, ox and eagle'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/2.htm'
    quote: 'Neither the Mosaic law, nor the Old Testament generally, gives us any intimation as to the form or character of the standard (degel). According to rabbinical tradition, the standard of Judah bore the figure of a lion, that of Reuben the likeness of a man … Ephraim the figure of an ox, and that of Dan the figure of an eagle'
  - where: 'note 2:2 “Standards and ensigns”'
    claim: 'The Septuagint reads “the order of the camp of Juda” in verse 3'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/numbers/2.htm'
    quote: 'And they that encamp first toward the east shall be the order of the camp of Juda with their host'

  - where: 'note 2:2 “At a distance, with the Levites between”'
    claim: 'The Hebrew phrase in Numbers 2:2 means at a distance'
    key: bdb
    url: 'https://biblehub.com/hebrew/5048.htm'
    quote: '= some way off, from or at a distance, Numbers 2:2'
  - where: 'note 2:2 “At a distance, with the Levites between”'
    claim: 'The Church’s footnote gives “facing the tent of meeting on all sides” as another rendering of “far”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/2?lang=eng'
    quote: '2b “far”: OR facing the tent of meeting on all sides.'
  - where: 'note 2:2 “At a distance, with the Levites between”'
    claim: 'The Levites camp round the tabernacle that there be no wrath on the congregation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/1?lang=eng'
    quote: 'But the Levites shall pitch round about the tabernacle of testimony, that there be no wrath upon the congregation of the children of Israel'

  - where: 'note 2:3 “Judah in front”'
    claim: 'Judah camped directly east of the tabernacle entrance; Judah and Ephraim held the places of honor'
    key: ot-manual-numbers-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-1-12-wilderness-wanderings-part-1?lang=eng'
    quote: 'The places of honor, at the head of the hosts and immediately following the tabernacle, were held by Judah and Ephraim, respectively. Judah camped directly east of the tabernacle entrance.'
  - where: 'note 2:3 “Judah in front”'
    claim: 'Judah led the way as champion of his brethren, with Genesis 49:10'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/2.htm'
    quote: 'which was to march out first when the camp was broken up (Numbers 2:9), so that Judah led the way as the champion of his brethren (Genesis 49:10).'
  - where: 'note 2:3 “Judah in front”'
    claim: 'Judah was a natural leader and the tribe took the lead in Canaan'
    key: bd-judah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judah?lang=eng'
    quote: 'he was a natural leader among the sons of Jacob, and the tribe descended from him took the lead after the settlement in Canaan, its chief rival being Ephraim.'
  - where: 'note 2:3 “Judah in front”'
    claim: 'Nahshon is called prince of the children of Judah in the genealogy leading to Boaz and David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/2?lang=eng'
    quote: 'And Ram begat Amminadab; and Amminadab begat Nahshon, prince of the children of Judah; And Nahshon begat Salma, and Salma begat Boaz,'

  - where: 'note 2:10 “The firstborn in the second place”'
    claim: 'Reuben lost his birthright because of transgression'
    key: bd-reuben
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/reuben?lang=eng'
    quote: 'Although Reuben was the firstborn of Jacob and Leah, he lost his birthright because of transgression (Gen. 35:22; 49:3–4).'
  - where: 'note 2:10 “The firstborn in the second place”'
    claim: 'Chronicles: Reuben’s birthright given to Joseph’s sons; Judah prevailed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/5?lang=eng'
    quote: 'his birthright was given unto the sons of Joseph the son of Israel … For Judah prevailed above his brethren, and of him came the chief ruler; but the birthright was Joseph’s:)'
  - where: 'note 2:17 “The tabernacle in the middle of the march”'
    claim: 'In chapter 10 the Gershonites and Merarites go with the tabernacle after Judah, the Kohathites with the sanctuary after Reuben'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/10?lang=eng'
    quote: 'And the tabernacle was taken down; and the sons of Gershon and the sons of Merari set forward, bearing the tabernacle. … And the Kohathites set forward, bearing the sanctuary: and the other did set up the tabernacle against they came.'

  - where: 'note 2:18 “Rachel’s sons, with Ephraim first”'
    claim: 'Ephraim was given the birthright'
    key: bd-ephraim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ephraim?lang=eng'
    quote: 'Ephraim was given the birthright in Israel (1 Chr. 5:1–2; Jer. 31:9)'
  - where: 'note 2:18 “Rachel’s sons, with Ephraim first”'
    claim: 'Jacob set Ephraim before Manasseh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/48?lang=eng'
    quote: 'but truly his younger brother shall be greater than he … and he set Ephraim before Manasseh.'

  - where: christ
    claim: 'The Lord told elders on a journey to do like the children of Israel, pitching tents by the way'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/61?lang=eng'
    quote: 'Behold, I, the Lord, have appointed a way for the journeying of my saints … And they shall do like unto the children of Israel, pitching their tents by the way.'
  - where: christ
    claim: 'The Church’s footnote on “pitched” in Numbers 2:34 points to D&C 61:25'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/2?lang=eng'
    quote: '34a “pitched”: D&C 61:25 (24–25).'

  - where: 'note 2:2 “Standards and ensigns”'
    claim: 'degel means standard, banner, with Numbers 2:3 cited'
    key: bdb
    url: 'https://biblehub.com/hebrew/1714.htm'
    quote: 'noun masculineNumbers 10:14 standard, banner'
  - where: 'note 2:2 “At a distance, with the Levites between”'
    claim: 'The Gershonites camp west, Kohathites south, Merarites north, Moses and Aaron east'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/3?lang=eng'
    quote: 'The families of the Gershonites shall pitch behind the tabernacle westward. … shall pitch on the side of the tabernacle southward. … these shall pitch on the side of the tabernacle northward.'
  - where: 'note 2:18 “Rachel’s sons, with Ephraim first”'
    claim: 'Jacob adopts Ephraim and Manasseh as his own, as Reuben and Simeon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/48?lang=eng'
    quote: 'thy two sons, Ephraim and Manasseh, which were born unto thee in the land of Egypt before I came unto thee into Egypt, are mine; as Reuben and Simeon, they shall be mine.'

  # ---------- christ ----------
  - where: christ
    claim: 'John 1:14 tells of the Lord in the same image, dwelling in His own tent among His people'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'the original Greek meaning, in essence, that He “tabernacled among us.” … In essence, the Lord showed that He too dwelt in His own tent among His people.'
  - where: christ
    claim: 'Nahshon is in Matthew’s genealogy of Jesus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/1?lang=eng'
    quote: 'And Aram begat Aminadab; and Aminadab begat Naasson; and Naasson begat Salmon;'
  - where: christ
    claim: 'The Lord’s house is a house of order'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/132?lang=eng'
    quote: 'Behold, mine house is a house of order, saith the Lord God, and not a house of confusion.'
