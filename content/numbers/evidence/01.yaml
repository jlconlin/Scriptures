chapter: 1
claims:
  - where: setting
    claim: 'Numbers is named from its two countings of the people (1–4; 26)'
    key: bd-numbers
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/numbers?lang=eng'
    quote: 'The book that bears this name is so called from the double numbering or census of the people (Num. 1–4; 26).'
  - where: setting
    claim: 'The English name comes through the Septuagint; the traditional Hebrew title is bĕmidbar, “In the Wilderness,” from 1:1'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'The name of the fourth book of the Old Testament, “Numbers,”[2] is derived from the Septuagint and is based on the theme of numbering.[3] … The traditional Hebrew title of the book is bĕmidbar (“In the Wilderness”), which is based on the opening verse'
  - where: setting
    claim: 'The Pentateuch was written by Moses'
    key: bd-pentateuch
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pentateuch?lang=eng'
    quote: 'The Pentateuch was written by Moses, although it is evident that he used several documentary sources'
  - where: setting
    claim: 'Scribes and copyists have left their traces on the Pentateuch'
    key: bd-pentateuch
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pentateuch?lang=eng'
    quote: 'It is also evident that scribes and copyists have left their traces upon the Pentateuch as we have it today'
  - where: setting
    claim: 'The census is dated one month after the tabernacle was set up'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'And it came to pass in the first month in the second year, on the first day of the month, that the tabernacle was reared up.'
  - where: setting
    claim: 'Numbers is set in three main places: Mount Sinai, Kadesh, the plains of Moab'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'The book of Numbers focuses on Israelite activities in three main locations: at Mount Sinai, near Kadesh, and at the plains of Moab.'
  - where: setting
    claim: 'The first part of the book, 1:1–10:10, is the preparation for departure from Sinai'
    key: bd-numbers
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/numbers?lang=eng'
    quote: '(1) 1:1–10:10, preparation for departure from Sinai.'
  - where: thread
    claim: 'Numbers 1–10 tells the final weeks at Sinai, including the numbering of the fighting men'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Numbers 1:1–10:11 relates events during the Israelites’ final weeks at Mount Sinai, including the numbering of Israelite fighting men “from twenty years old and upward” (Numbers 1:3)'
  - where: thread
    claim: 'The chapter heading: count, total, the Levites appointed to the tabernacle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/1?lang=eng'
    quote: 'Moses and the princes in Israel count from each tribe (except Levi) those males twenty years of age and older—They total 603,550—The Levites are appointed to attend the tabernacle.'
  - where: thread
    claim: 'The second census says none of those numbered at Sinai remained but Caleb and Joshua'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/26?lang=eng'
    quote: 'But among these there was not a man of them whom Moses and Aaron the priest numbered, when they numbered the children of Israel in the wilderness of Sinai.'

  - where: 'note 1:3 “A muster of the army”'
    claim: 'The census counted the fighting men, in the final weeks at Sinai'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Numbers 1:1–10:11 relates events during the Israelites’ final weeks at Mount Sinai, including the numbering of Israelite fighting men'
  - where: 'note 1:3 “A muster of the army”'
    claim: 'Twenty appears to have been the age of obligation to military service in Israel'
    key: sc-knowhy-161
    url: 'https://scripturecentral.org/knowhy/how-old-were-the-stripling-warriors'
    quote: 'In ancient Israel, “twenty appears to have been the age at which Israelite males became obligated to serve in the military” (see, e.g., Numbers 1:3).'
  - where: 'note 1:3 “A muster of the army”'
    claim: 'The Levites were counted from a month old'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/3?lang=eng'
    quote: 'Number the children of Levi after the house of their fathers, by their families: every male from a month old and upward shalt thou number them.'

  - where: 'note 1:18 “Registered by descent”'
    claim: 'The verb is the Hithpael of yalad, formed from tôlĕdôt, “declared their pedigree”'
    key: bdb
    url: 'https://biblehub.com/hebrew/3205.htm'
    quote: 'Hithpa`el Imperfect וַיִּתְיִלְּדוּ Numbers 1:18 denominative from תולדת declared their pedigree'
  - where: 'note 1:18 “Registered by descent”'
    claim: 'Tôlĕdôt means generations, an account of a man and his descendants; it is the word of Genesis 2:4'
    key: bdb
    url: 'https://biblehub.com/hebrew/8435.htm'
    quote: 'noun feminine plural generations, especially in Genealogies = account of a man and his descendants; — construct תּוֺלְדוֺת Genesis 2:4'
  - where: 'note 1:18 “Registered by descent”'
    claim: '“By their generations” in 1:20 is tôlĕdôt'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'תּוֹלְדֹתָ֥ם'

  - where: 'note 1:46 “Six hundred and three thousand men”'
    claim: 'The total excluded the Levites, women, older men, boys and those unable to bear arms'
    key: ot-manual-numbers-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-1-12-wilderness-wanderings-part-1?lang=eng'
    quote: 'This included none of the Levites (see v. 47) who numbered 22,000 (see Numbers 3:39). It also excluded all females, old men, boys under twenty years of age, and men unable to bear arms.'
  - where: 'note 1:46 “Six hundred and three thousand men”'
    claim: 'The number highlights the fulfillment of the promise of posterity to Abraham, though its literal accuracy can be questioned'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'There are reasons to question the literal accuracy of this extremely large number,[11] however, it functions in part to highlight the ongoing fulfillment of Jehovah’s promise to Abraham and Sarah'
  - where: 'note 1:46 “Six hundred and three thousand men”'
    claim: 'Seventy souls of Jacob went into Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/1?lang=eng'
    quote: 'And all the souls that came out of the loins of Jacob were seventy souls: for Joseph was in Egypt already.'
  - where: 'note 1:46 “Six hundred and three thousand men”'
    claim: 'Ephraim outnumbering Manasseh read as the fulfillment of Jacob’s blessing'
    key: ot-manual-numbers-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-1-12-wilderness-wanderings-part-1?lang=eng'
    quote: 'The blessing of Ephraim was here fulfilled in having thousands more sons able for war than had his older brother, Manasseh (see Genesis 48:19–20).'
  - where: 'note 1:46 “Six hundred and three thousand men”'
    claim: 'At the second census Manasseh numbers 52,700 and Ephraim 32,500'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/26?lang=eng'
    quote: 'These are the families of Manasseh, and those that were numbered of them, fifty and two thousand and seven hundred.'
  - where: 'note 1:46 “Six hundred and three thousand men”'
    claim: 'The second census totals 601,730'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/26?lang=eng'
    quote: 'These were the numbered of the children of Israel, six hundred thousand and a thousand seven hundred and thirty.'
  - where: 'note 1:46 “Six hundred and three thousand men”'
    claim: 'The same figure counts the men who paid the half shekel in Exodus 38:26'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/38?lang=eng'
    quote: 'for six hundred thousand and three thousand and five hundred and fifty men.'

  - where: 'note 1:49 “Why Levi was not counted”'
    claim: 'Joseph counted as two tribes; Levi, with no inheritance in the land, not counted, so the tribes are twelve'
    key: sc-knowhy-319
    url: 'https://scripturecentral.org/knowhy/why-did-lehi-divide-his-people-into-seven-tribes'
    quote: 'Jacob’s twelve tribes were increased to thirteen when Joseph’s inheritance and blessing was divided between his two sons, Ephraim and Manasseh. Yet because the priestly tribe of Levi did not inherit a portion of the promised land, they were not counted as one of Israel’s tribes'
  - where: 'note 1:49 “Why Levi was not counted”'
    claim: 'The Levites taken instead of the firstborn'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/3?lang=eng'
    quote: 'And I, behold, I have taken the Levites from among the children of Israel instead of all the firstborn'
  - where: 'note 1:49 “Why Levi was not counted”'
    claim: 'The second census says the Levites were not numbered because no inheritance was given them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/26?lang=eng'
    quote: 'for they were not numbered among the children of Israel, because there was no inheritance given them among the children of Israel.'

  - where: 'note 1:53 “A guard around the tabernacle”'
    claim: 'The “stranger” (zār) of 1:51 is one not belonging to the tribe of Levi'
    key: bdb
    url: 'https://biblehub.com/hebrew/2114.htm'
    quote: 'not belonging to the tribe of Levi, Numbers 1:51; Numbers 18:4 (P).'
  - where: 'note 1:53 “A guard around the tabernacle”'
    claim: 'One older reading: the wrath is the LORD’s judgment on those who approach His sanctuary against His command; the Levites’ camp kept it from the congregation'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/1.htm'
    quote: 'that wrath might not come upon the congregation, viz., through the approach of a stranger. קצף, the wrath of Jehovah, breaking in judgment upon the unholy who approached His sanctuary in opposition to His command'
  - where: 'note 1:53 “A guard around the tabernacle”'
    claim: 'Later chapters give the same purpose for the Levites’ and priests’ service'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/8?lang=eng'
    quote: 'that there be no plague among the children of Israel, when the children of Israel come nigh unto the sanctuary.'

  - where: christ
    claim: 'The covenants at Sinai did not automatically ensure Israel’s faith and obedience'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Their spiritual experiences and covenants at Mount Sinai did not automatically ensure their faith and obedience as they moved toward Canaan.'
  - where: christ
    claim: 'The Church’s footnote joins Nahshon of 1:7 to Matthew 1:4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/1?lang=eng'
    quote: '7a “Nahshon”: Matt. 1:4.'
