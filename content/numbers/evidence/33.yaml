chapter: 33
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'The LORD speaks to Moses on the plains of Moab; Aaron died in the fortieth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/33?lang=eng'
    quote: 'And the LORD spake unto Moses in the plains of Moab by Jordan near Jericho'
  - where: 'setting'
    claim: 'With Israel on the plains of Moab and the land beyond Jordan portioned out (ch. 32), the history of the desert wandering closes with a list of stations'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/33.htm'
    quote: 'as they began to take possession when the conquered land beyond Jordan was portioned out (ch. 32), the history of the desert wandering closes with a list of the stations which they had left behind them.'
  - where: 'setting'
    claim: 'Moses wrote the list by the commandment of the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/33?lang=eng'
    quote: 'And Moses wrote their goings out according to their journeys by the commandment of the LORD'
  - where: 'setting'
    claim: 'The list falls into three sections; the first, 5–15, from Raamses to Sinai'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/33.htm'
    quote: 'The itinerary may be divided into three sections. The first section (Numbers 33:5-15) contains the journey from Raamses in Egypt to the Wilderness of Sinai, which is related in Exodus 12:37 to Exodus 19:2'
  - where: 'setting'
    claim: 'The second section, 16–36, is probably a summary of the forty years'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/33.htm'
    quote: 'The second section (Numbers 33:16-36) consists of places visited between the Wilderness of Sinai and the Wilderness of Ẓin (= Ḳadesh), via Ezion-geber … This is probably a summary of the forty years’ wanderings.'
  - where: 'setting'
    claim: 'The third section, 37–49, the march after the forty years to the borders of Moab'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/33.htm'
    quote: 'The third section (Numbers 33:37-49) contains the march, after the forty years were expired, straight to the borders of Moab'
  - where: 'setting'
    claim: 'Kadesh was the second area, after Sinai, where Israel spent considerable time'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Kadesh (also called Kadesh-barnea) was the second geographic area, after Mount Sinai, in which the Israelites spent considerable time (Numbers 13:26–20:22).'
  - where: 'thread'
    claim: 'Moses wrote the list at the LORD’s command as a permanent memorial; every station a memorial of the grace and faithfulness with which the Lord led His people'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/33.htm'
    quote: 'This list was written out by Moses "at the command of Jehovah" (Numbers 33:2), as a permanent memorial for after ages, as every station which Israel left behind … was a memorial of the grace and faithfulness with which the Lord led His people'
  - where: 'thread'
    claim: 'The closing threat: Jehovah would do to Israel what He intended for the Canaanites, drive them out and destroy them'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/33.htm'
    quote: 'Jehovah would also do the very same things to the Israelites that He had intended to do to the Canaanites, i.e., drive them out of the land and destroy them.'
  - where: 'section 1 plain'
    claim: 'A modern translation renders “went out with an high hand” as “went out boldly” (as the site’s note at Ex. 14:8 explains the phrase)'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers%2033&version=NRSVUE'
    quote: 'on the day after the Passover the Israelites went out boldly in the sight of all the Egyptians'
  - where: 'section 5 plain'
    claim: 'The word rendered “pictures” denotes carved figures and symbols of Canaanite worship'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/33.htm'
    quote: 'their figured stones] The literal meaning of the word seems to be ‘something to be looked at.’ It denotes the carved figures and symbols used in Canaanite idolatrous worship.'

  # ---------- notes ----------
  - where: 'note 33:2 “A list of departures, written at the LORD’s command”'
    claim: 'Moses wrote the list at the command of Jehovah as a permanent memorial'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/33.htm'
    quote: 'This list was written out by Moses "at the command of Jehovah" (Numbers 33:2), as a permanent memorial for after ages'
  - where: 'note 33:2 “A list of departures, written at the LORD’s command”'
    claim: 'The word for “journeys” means the breaking up of a camp, a march; the list is by departure points, hence the constant “and they broke up”'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/33.htm'
    quote: 'מסּע does not mean a station, but the breaking up of a camp, and then a train, or march … The march of the people is not described by the stations, or places of encampment, but by the particular spots from which they set out. Hence the constant repetition of the word ויּסעוּ, "and they broke up."'
  - where: 'note 33:2 “A list of departures, written at the LORD’s command”'
    claim: 'The first part of the list agrees with Exodus, except that the Red Sea camp, Dophkah and Alush are not mentioned there'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/33.htm'
    quote: 'The places of encampment from Succoth to the desert of Sinai (Numbers 33:5-15) agree with those in the historical account, except that the stations at the Red Sea (Numbers 33:10) and those at Dophkah and Alush (Numbers 33:13 and Numbers 33:14) are passed over there.'

  - where: 'note 33:18 “The camps of the silent years”'
    claim: 'Verses 16–36 are probably a summary of the forty years’ wanderings'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/33.htm'
    quote: 'The second section (Numbers 33:16-36) consists of places visited between the Wilderness of Sinai and the Wilderness of Ẓin (= Ḳadesh), via Ezion-geber … This is probably a summary of the forty years’ wanderings.'
  - where: 'note 33:18 “The camps of the silent years”'
    claim: 'Twenty-one names in 16–36, from Sinai to Kadesh, include the camps of the second year and those of the thirty-eight years'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/33.htm'
    quote: 'Consequently the twenty-one names in vv. 16-36 contain not only the places of encampment at which the Israelites encamped in the second year of their march from Sinai to the desert of Paran at Kadesh … but also those in which they encamped for a longer period during the thirty-eight years of punishment'
  - where: 'note 33:18 “The camps of the silent years”'
    claim: 'Rithmah is probably the camp at Kadesh from which the spies were sent'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/33.htm'
    quote: 'it is as natural as it well can be to seek for this place of encampment in the desert of Paran or Zin at Kadesh under the name of Rithmah, which follows Hazeroth in the present list (Numbers 33:18).'
  - where: 'note 33:18 “The camps of the silent years”'
    claim: 'Kadesh in verse 36 is the second arrival, after the thirty-eight years'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/33.htm'
    quote: 'the encampment in the wilderness of Zin, i.e., Kadesh (Numbers 33:36), is to be understood as referring to the second arrival in Kadesh after the expiration of the thirty-eight years of wandering in the desert'
  - where: 'note 33:18 “The camps of the silent years”'
    claim: 'The small number of stations shows Israel was not constantly wandering but may have stayed even years at some'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/33.htm'
    quote: 'This number of stations, which is very small for thirty-seven years … is a sufficient proof that the congregation of Israel was not constantly wandering about during the whole of that time, but may have remained in many of the places of encampment … not only for weeks and months, but even for years'
  - where: 'note 33:18 “The camps of the silent years”'
    claim: 'The names are not day’s marches; at some places they must have settled for years'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/33.htm'
    quote: 'the names do not represent successive stages of one day’s march each, but are the names of places, all comparatively near to one another, at which the Israelites encamped for a longer or shorter time. At some of them they must have settled for years.'
  - where: 'note 33:18 “The camps of the silent years”'
    claim: 'The location of many sites is uncertain; Israel did not break camp every day'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'There is uncertainty about the location of many of the sites listed in chapter 33, and there is some confusion in the biblical account about where and for how long Israelites stayed “in the wilderness.” They did not “break camp” every day.'
  - where: 'note 33:18 “The camps of the silent years”'
    claim: 'Of the seventeen places none is known with certainty except Ezion-geber'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/33.htm'
    quote: 'Of all the seventeen places not a single one is known, or can be pointed out with certainty, except Eziongeber.'
  - where: 'note 33:18 “The camps of the silent years”'
    claim: 'Ezion-geber was the port at the head of the gulf where Solomon built a fleet'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/33.htm'
    quote: 'the well-known port at the northern extremity of the Elanitic Gulf, where the Israelites in the time of Solomon and Jehoshaphat built a fleet to sail to Ophir (1 Kings 9:26; 1 Kings 22:49). It was not far from Elath (i.e., Akaba)'

  - where: 'note 33:30 “The same four places in Deuteronomy”'
    claim: 'Moseroth, Bene-jaakan, Hor-hagidgad and Jotbathah appear again in Deut. 10:6–7'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/33.htm'
    quote: 'Only the four mentioned in Numbers 33:30-33, Moseroth, Bene-Jaakan, Hor-hagidgad, and Jotbathah, are referred to again, viz., in Deuteronomy 10:6-7'
  - where: 'note 33:30 “The same four places in Deuteronomy”'
    claim: 'Bene-jaakan abbreviates Beeroth-bene-jaakan, wells of the children of Jaakan'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/33.htm'
    quote: 'Bene Jaakan is simply an abbreviation of Beeroth-bene-Jaakan, wells of the children of Jaakan.'
  - where: 'note 33:30 “The same four places in Deuteronomy”'
    claim: 'Gudgodah = Hor-hagidgad; Moseroth plural of Mosera; but the two passages relate to different journeys; Deut. 10 is the fortieth-year march, Mosera near Mount Hor'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/33.htm'
    quote: 'Moseroth is simply the plural form of Mosera. But notwithstanding the identity of these four places, the two passages relate to different journeys. Deuteronomy 10:6 and Deuteronomy 10:7 refers to the march in the fortieth year'
  - where: 'note 33:30 “The same four places in Deuteronomy”'
    claim: 'In the fortieth year they camped at Mosera, where Aaron died upon Mount Hor in the neighbourhood'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/33.htm'
    quote: 'and then at Mosera, where Aaron died upon Mount Hor, which was in the neighbourhood'
  - where: 'note 33:30 “The same four places in Deuteronomy”'
    claim: 'Israel had camped at the very same places once before, during the thirty-seven years'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/33.htm'
    quote: 'But the Israelites had encamped at the very same places once before, namely, during their thirty-seven years of wandering'
  - where: 'note 33:30 “The same four places in Deuteronomy”'
    claim: 'Deuteronomy’s order and its placing of Aaron’s death at Mosera'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/33?lang=eng'
    quote: 'And they departed from Hashmonah, and encamped at Moseroth. And they departed from Moseroth, and pitched in Bene-jaakan.'
  - where: 'note 33:30 “The same four places in Deuteronomy”'
    claim: 'Deuteronomy goes from Beeroth of the children of Jaakan to Mosera, where Aaron died, then Gudgodah and Jotbath'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/10?lang=eng'
    quote: 'And the children of Israel took their journey from Beeroth of the children of Jaakan to Mosera: there Aaron died, and there he was buried'
  - where: 'note 33:30 “The same four places in Deuteronomy”'
    claim: 'Gudgodah is Hor-hagidgad (one older reading)'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/33.htm'
    quote: 'Gudgodah is only a slightly altered and abbreviated form of Hor-hagidgad, the cave of Gidgad or Gudgodah'

  - where: 'note 33:38 “The one death the list dates”'
    claim: 'Aaron’s death dated to the fortieth year, first day of the fifth month; aged 123'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/33?lang=eng'
    quote: 'in the fortieth year after the children of Israel were come out of the land of Egypt, in the first day of the fifth month. And Aaron was an hundred and twenty and three years old'
  - where: 'note 33:38 “The one death the list dates”'
    claim: 'Aaron’s age is his age at the Exodus plus forty'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/33.htm'
    quote: '39. Aaron’s age is calculated by adding forty years to his age at the Exodus (Exodus 7:7).'
  - where: 'note 33:38 “The one death the list dates”'
    claim: 'Chapter 20 opens in the first month of an unnamed year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/20?lang=eng'
    quote: 'Then came the children of Israel, even the whole congregation, into the desert of Zin in the first month: and the people abode in Kadesh'
  - where: 'note 33:38 “The one death the list dates”'
    claim: 'Aaron was eighty-three when he and Moses spoke to Pharaoh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/7?lang=eng'
    quote: 'And Moses was fourscore years old, and Aaron fourscore and three years old, when they spake unto Pharaoh.'
  - where: 'note 33:40 “Arad in the middle of the list”'
    claim: 'In Num. 21:1 the same report leads to an attack'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/21?lang=eng'
    quote: 'And when king Arad the Canaanite, which dwelt in the south, heard tell that Israel came by the way of the spies; then he fought against Israel'

  - where: 'note 33:40 “Arad in the middle of the list”'
    claim: 'One older reading: a fragmentary statement, perhaps first a scribe’s marginal note'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/33.htm'
    quote: '40. A fragmentary statement strangely inserted, perhaps originally as a marginal note by a scribe. See on Numbers 21:1-3.'

  - where: 'note 33:52 “Images and high places”'
    claim: 'The word for “pictures”: literally something to be looked at; carved figures and symbols of Canaanite worship'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/33.htm'
    quote: 'The literal meaning of the word seems to be ‘something to be looked at.’ It denotes the carved figures and symbols used in Canaanite idolatrous worship.'
  - where: 'note 33:52 “Images and high places”'
    claim: 'High places here cannot be hills, since they are to be demolished; the word came to mean any sanctuaries'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/33.htm'
    quote: 'the word seems to have acquired a more general force, and to have been used for any sanctuaries, even in valleys and by the gates of cities … In the present passage the word cannot refer to hills, for the Israelites are bidden to ‘demolish them.’'
  - where: 'note 33:52 “Images and high places”'
    claim: 'Bible Dictionary: heathen altars on hills were ordered destroyed (Num. 33:52); altars to Jehovah also at high places; idolatry; Hezekiah and Josiah removed them'
    key: bd-high-places
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/high-places?lang=eng'
    quote: 'After the settlement in Canaan heathen altars were found set up on various hills and were ordered to be destroyed (Num. 33:52; Deut. 12:2–3). Altars to Jehovah were built at several high places'
  - where: 'note 33:52 “Images and high places”'
    claim: 'Bible Dictionary: when idolatry came in, altars desecrated; reformers Hezekiah and Josiah removed high places'
    key: bd-high-places
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/high-places?lang=eng'
    quote: 'When idolatry came in, many of these altars were desecrated and used for heathen worship. Religious reformers like Hezekiah and Josiah tried therefore to centralize the worship more and more in Jerusalem'

  - where: 'note 33:56 “The same judgment for Israel”'
    claim: '“Pricks” and “thorns”: painful injuries and war; Jehovah would drive out and destroy Israel; Joshua repeats the threat'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/33.htm'
    quote: 'not only would such as were left become "thorns in their eyes and stings in their sides," i.e., inflict the most painful injuries upon them, and make war upon them in the land; but Jehovah would also do the very same things to the Israelites … This threat is repeated by Joshua in his last address to the assembled congregation (Joshua 23:13).'
  - where: 'note 33:56 “The same judgment for Israel”'
    claim: 'Compare Josh. 23:13, Ezek. 28:24 and perhaps Judg. 2:3'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/33.htm'
    quote: '55. as pricks in your eyes, and as thorns in your sides] Cf. Joshua 23:13, Ezekiel 28:24, and perhaps Jdg 2:3.'

  # ---------- christ ----------
  - where: 'christ'
    claim: 'Nephi retells the journey: the Lord their Redeemer going before them; by His word He led them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/17?lang=eng'
    quote: 'And notwithstanding they being led, the Lord their God, their Redeemer, going before them, leading them by day and giving light unto them by night'
  - where: 'christ'
    claim: 'According to his word he did lead them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/17?lang=eng'
    quote: 'and according to his word he did lead them'
  - where: 'christ'
    claim: 'Moses: remember all the way the LORD led thee forty years, to humble and prove thee'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/8?lang=eng'
    quote: 'And thou shalt remember all the way which the LORD thy God led thee these forty years in the wilderness, to humble thee, and to prove thee'
  - where: 'christ'
    claim: 'The wandering became part of the people; through the Atonement such experiences can become redemptive'
    key: sc-knowhy-851
    url: 'https://scripturecentral.org/knowhy/why-are-early-israelite-settlements-similar-to-those-where-they-wandered-for-forty-years'
    quote: 'They had wandered for so many years that their period of wandering became a part of them'
  - where: 'christ'
    claim: 'Difficult experiences shape who people become, in ancient times and today'
    key: sc-knowhy-851
    url: 'https://scripturecentral.org/knowhy/why-are-early-israelite-settlements-similar-to-those-where-they-wandered-for-forty-years'
    quote: 'In ancient times as well as today, difficult experiences can shape who people become'
  - where: 'christ'
    claim: 'Through the Atonement of Jesus Christ, hard experiences can become redemptive rather than limiting'
    key: sc-knowhy-851
    url: 'https://scripturecentral.org/knowhy/why-are-early-israelite-settlements-similar-to-those-where-they-wandered-for-forty-years'
    quote: 'However, through the Atonement of Jesus Christ, these experiences can become redemptive rather than limiting.'
