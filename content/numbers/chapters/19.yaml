chapter: 19
title: The Red Heifer and the Water of Separation
tagline: The ashes of a red heifer, burned outside the camp, are kept and mixed with living water to cleanse anyone the dead have made unclean.
when: 'In the wilderness after the refusal at Kadesh; the text gives no year'

setting: |
  Chapter 19 is law set between the stories of Korah's rebellion and the priests' charge (16–18) and the arrival at Kadesh (20). The text gives it no occasion beyond “the LORD spake unto Moses and unto Aaron” (verse 1). One older reading ties it to the plague that followed Korah ([[Num. 16:49]]): the LORD gave it so that “a consciousness of the continuance of the covenant relation might be kept alive during the dying out of the race that had fallen under the judgment of God.” Another older reading finds the chapter “having no connexion” with the stories on either side.

  The subject is the uncleanness that came from the dead. Like the other uncleanness of the law, it was ritual: it “should not be taken to mean that the touching of a dead body … was morally evil” (see the setting of [[Lev. 11]]). But “so long as a person was unclean he was cut off from the congregation,” and this chapter gives the remedy. The water is used again after the war on Midian ([[Num. 31:19–24]]), and Hebrews sets “the ashes of an heifer” beside the blood of Christ ([[Heb. 9:13–14]]).

thread: |
  One older reading divides the chapter in two: “the preparation of a sprinkling water … (Numbers 19:1-10); and then, secondly, the use of this purifying water.” The first half makes something to keep; the second says when to use it.

  In one older reading, the ashes were needed because the uncleanness of death was the strongest the law knew: “fresh water alone was not sufficient to remove it,” so the water was strengthened “by the ashes of a sin-offering.” A heifer is killed and burned whole outside the camp, with cedar, hyssop and scarlet thrown into the fire; the ashes are laid up in a clean place (verses 2–9). Whoever has touched a body, a bone or a grave, or has been in a tent where someone died, is unclean seven days, and is sprinkled with the ashes in water on the third and the seventh day (11–19). The rule binds the stranger as well as Israel (verse 10).

  Two things run through it. Everyone who prepares or handles the water is made unclean by it (verses 7, 8, 10, 21), while it makes the unclean clean. And the man who will not be sprinkled “defileth the tabernacle of the LORD” and is cut off (verses 13, 20).

sections:
  - range: 1-10
    heading: Preparing the ashes
    plain: |
      The LORD told Moses and Aaron: This is a statute of the law. Tell the Israelites to bring you a red heifer with no defect and no blemish, one that has never worn a yoke. Give her to Eleazar the priest; he is to take her outside the camp, and someone is to slaughter her in front of him. Eleazar is to take some of her blood on his finger and sprinkle it seven times toward the front of the tent of meeting. Then the heifer is to be burned in his sight, her skin, flesh and blood, with her dung. The priest is to take cedar wood, hyssop and scarlet and throw them into the fire where the heifer is burning.

      Then the priest is to wash his clothes and bathe his body in water, and afterward he may come into the camp, but he will be unclean until evening. The man who burned her is to do the same and is unclean until evening. A man who is clean is to gather the heifer's ashes and put them in a clean place outside the camp, where they are to be kept for the Israelites for the water that removes impurity; it is a purification for sin. The man who gathered the ashes is to wash his clothes and is unclean until evening. This is a statute for ever, for the Israelites and for the foreigner who lives among them.
  - range: 11-22
    heading: Cleansing those defiled by the dead
    plain: |
      Anyone who touches a dead person is unclean seven days. He must purify himself with the water on the third day and on the seventh day, and then he will be clean; if he does not, he will not be clean. Whoever touches a dead body and does not purify himself defiles the LORD's tabernacle and is to be cut off from Israel: the water was not sprinkled on him, so he stays unclean.

      This is the law when someone dies in a tent: everyone who enters the tent and everyone in it is unclean seven days, and every open container without a lid tied on it is unclean. Anyone in the open country who touches someone killed by the sword, or anyone who has died, or a human bone, or a grave, is unclean seven days.

      For the unclean person, some of the ashes of the burned heifer of purification are to be taken, and fresh (literally “living”) water put over them in a vessel. A clean person is to take hyssop, dip it in the water, and sprinkle the tent, all its containers and the people who were there, and whoever touched the bone, the slain, the dead or the grave. The clean person sprinkles the unclean on the third day and the seventh; on the seventh day the unclean person purifies himself, washes his clothes, bathes in water, and is clean at evening. But whoever is unclean and does not purify himself is to be cut off from the congregation, because he has defiled the LORD's sanctuary; the water was not sprinkled on him, and he is unclean.

      This is a permanent statute: the one who sprinkles the water must wash his clothes, and whoever touches the water is unclean until evening. Whatever the unclean person touches becomes unclean, and anyone who touches it is unclean until evening.

notes:
  - ref: 2
    phrase: a red heifer without spot, wherein is no blemish, and upon which never came yoke
    kind: symbol
    title: Why a red heifer, never yoked
    body: |
      The text gives no reason for the heifer's color, sex or unused strength. Two older readings offer guesses. One links the red animal and the scarlet of verse 6 to blood, which “may both, perhaps, have had reference to blood as an instrument of purification.” The second reads every detail as a sign of life set against death. The congregation's sin offering was otherwise a bull ([[Lev. 4:14]]), but here it is a female, “because the female sex is the bearer of life”; red “as the colour of the most ‘intensive life’”; never yoked, so that her “vital energy had not yet been crippled by labour under the yoke.” The same reading takes the cedar, the hyssop and the scarlet thrown into the fire (verse 6) as signs of life that does not decay, of cleansing, and of strength.

      Cedar, hyssop and scarlet are also what the leper's cleansing uses ([[Lev. 14:4–6]]), “but with a different purpose”: there they sprinkle blood, here they are burned into the ashes. Hyssop is explained at [[Ps. 51:7]].
    sources: [cambridge-numbers, keil-numbers]

  - ref: 7
    phrase: the priest shall be unclean until the even
    kind: history
    title: The cleansers made unclean
    body: |
      The ashes that make the unclean clean make unclean everyone who prepares them: the priest (verse 7), the man who burns the heifer (verse 8), the man who gathers the ashes (verse 10), and later the man who sprinkles or touches the water (verse 21). The text does not explain it. In one older reading the preparers were defiled not because they served unclean people, but “through the uncleanness of sin and death, which had passed over to the sin-offering,” as the man who led away the scapegoat had to wash before he came back into the camp ([[Lev. 16:26]]). Yet the ashes themselves were gathered by a clean man and kept in a clean place, for “they were to be treated as clean.”

      Another older reading, on the man who sprinkles the water (verse 21), ties it to holiness: “A close connexion existed in the Semitic mind between ‘uncleanness’ and ‘holiness.’” That uncleanness was slight: it “lasts until the evening and can be removed by simply washing the clothes.”
    sources: [keil-numbers, cambridge-numbers]

  - ref: 9
    phrase: 'for a water of separation: it is a purification for sin'
    kind: words
    title: Water for impurity, a purification for sin
    body: |
      “Water of separation” is the Hebrew *mê niddâ*, literally “water of impurity,” meaning water to remove impurity. *Niddâ* is a word for impurity; besides this chapter it is used of the water only in [[Num. 31:23]].

      “A purification for sin” translates *ḥaṭṭāʾt*, the Hebrew word that elsewhere means the “sin-offering.” One lexicon takes it here as “purification from sins of ceremonial uncleanness,” and notes against the Revised Version's “sin-offering” in verse 17 that “there was no offering made, only water of purification was used.” Either way it does not make touching the dead a sin (see the setting above).
    sources: [oshb-wlc, bdb]

  - ref: 10
    phrase: unto the stranger that sojourneth among them
    kind: history
    title: The stranger too
    body: |
      The foreigner living in Israel was bound by this statute, and he may even have been one of those who prepared it. Three people take part: the priest, and “at least two others were mentioned: (1) ‘he that burneth,’ … and (2) the one who gathers up the ashes.” From verse 10, one Latter-day Saint reading concludes that a stranger could be one of those two: “not only was a stranger to be held to the same standard of purification, it was also possible that they could participate directly in an ordinance that benefited the entire community.”
    sources: [belnap-outcasts]

  - ref: 13
    phrase: defileth the tabernacle of the LORD; and that soul shall be cut off from Israel
    kind: history
    title: Defiling the tabernacle from a distance
    body: |
      The man who would not be cleansed did harm beyond himself: he defiled the LORD's dwelling, though nothing says he went near it. Later rabbis read such verses “on the assumption that impurity came into direct contact with the holy,” that the unclean man entered the sanctuary or ate holy food. Another reading takes the text at its word: impurity, left alone, “assaults the sacred realm even from afar” (his view of impurity is given at the setting of [[Lev. 11]]). The penalty is for the man who “purifieth not himself” (verse 13; again verse 20), not for having touched the dead. On “cut off,” see [[Num. 15:30]].
    sources: [milgrom-temple, lds-scriptures]

  - ref: 15
    phrase: every open vessel, which hath no covering bound upon it, is unclean
    kind: scripture
    title: The open vessel
    body: |
      A death in a tent made every open container in it unclean, without anyone touching it; a lid tied down kept it clean. A Latter-day Saint study of the law of vessels infers from the verse that “no contact with an open vessel was required,” and that “corpse contamination of the outside of a covered vessel did not render the pot impure.”

      The same study reads Captain Moroni's letter in the light of these laws. He wrote that “God has said that the inward vessel shall be cleansed first, and then shall the outer vessel be cleansed also” ([[Alma 60:23]]), and the study finds that the agreement between him and Jesus, who spoke of cleaning first “that which is within the cup and platter” ([[Matt. 23:26]]), strongly suggests that they “were drawing upon these laws from Leviticus and Numbers.” Moroni turned the image to “the crucial need for inner purity and sanctification.”
    sources: [sc-knowhy-169]

  - ref: 16
    phrase: one that is slain with a sword in the open fields
    kind: scripture
    title: The Nephites and the week of uncleanness
    body: |
      The law reached the battlefield: anyone who touched the slain, “including those burying the dead,” was unclean seven days. A Latter-day Saint study finds a trace of this week in the Book of Mormon. After a great battle the Nephites “had buried their dead, and also after the days of fasting, and mourning, and prayer,” and then “were strict in observing the ordinances of God, according to the law of Moses” ([[Alma 30:2–3]]). In that reading, “this may have been the week of uncleanness mentioned in Numbers.” The mention of the law of Moses suggests that the Nephites kept the rite, “although possibly in a slightly modified form, as red heifers may have been hard to get in the Americas.” The Book of Mormon does not name the rite.
    sources: [sc-knowhy-424, lds-scriptures]

  - ref: 17
    phrase: running water
    kind: words
    title: Living water
    body: |
      “Running water” is the Hebrew *mayim ḥayyîm*, literally “living water”: flowing water, such as a spring's. In one Latter-day Saint reading, “living waters” are “the sweet, flowing waters that come to the surface as springs,” and such water “was allowed for many ritual observances under the Mosaic law, such as the ritual of the red heifer.”

      The same reading joins the phrase to the Lord as “the fountain of living waters” ([[Jer. 2:13]]) and to the Savior's words at the well: “It is this idea that underlies the Savior's statement to the Samaritan woman,” “he would have given thee living water” ([[John 4:10]]).
    sources: [oshb-wlc, lundquist-temple-isaiah]

christ: |
  The LORD who gave this law is Jehovah, “the premortal Jesus Christ” (see [[Ex. 3:14]]), and Hebrews sets the rite beside His own cleansing: “For if the blood of bulls and of goats, and the ashes of an heifer sprinkling the unclean, sanctifieth to the purifying of the flesh: How much more shall the blood of Christ, who through the eternal Spirit offered himself without spot to God, purge your conscience from dead works to serve the living God?” ([[Heb. 9:13–14]]). The heifer was “without spot” (verse 2); the ashes made the flesh clean after contact with death; Christ's blood cleanses the conscience from works that are dead. The death of the red heifer is read as a symbol of “Christ's Atonement.” Faith in that Atonement, with repentance, baptism, the Holy Ghost and obedience, is how one recovers from spiritual death. One study carries the comparison further, setting the red heifer beside the Savior who bled “from every pore” ([[Mosiah 3:7]]), the hyssop and the scarlet beside the hyssop and the scarlet robe of His Passion ([[John 19:29]]; [[Matt. 27:28]]), and the heifer slain outside the camp beside Jesus, who “suffered without the gate” ([[Heb. 13:11–12]]).

  The ashes were laid up in advance and “kept for the congregation” (verse 9); the cleansing kept ready for a disciple is the Savior's, for “the blood of Jesus Christ his Son cleanseth us from all sin” ([[1 Jn. 1:7]]). The comparison with the red heifer teaches “that no matter what we have been through, Christ can make us clean again.”

