chapter: 30
title: He Shall Not Break His Word
tagline: A vow spoken to the LORD must be kept; a daughter's or a wife's vow stands unless her father or husband sets it aside on the day he hears it, and a widow answers for her own.
when: 'On the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Numbers 30 is one of the laws given on the plains of Moab, among “the commandments and the judgments, which the LORD commanded by the hand of Moses” there ([[Num. 36:13]]), in the fortieth year after the Exodus ([[Num. 33:38]]). It follows the calendar of offerings in chapters 28–29, which ends with the offerings Israel brought at the feasts “beside your vows, and your freewill offerings” ([[Num. 29:39]]). Leviticus had already laid down what could be vowed and how a vow was redeemed (see [[Lev. 27:2]]); this chapter is about the force of a vow once it is spoken. In one older reading it stands beside the offerings because “vows related for the most part to the presentation of sacrifices.”

  Later scripture returns to its rule. Moses repeats it on the plains ([[Deut. 23:21–23]]; see the note on verse 2). The women of Judah in Egypt, who vowed to burn incense to the queen of heaven ([[Jer. 44:25]]), answer Jeremiah that they did not do it “without our men” ([[Jer. 44:19]]), a passage cited beside this chapter on the vows of wives.

thread: |
  Numbers 30 holds **one rule and four cases.** The rule is in verse 2: a man who vows to the LORD, or binds himself by an oath, “shall not break his word.” What he has said, he does.

  The four cases are about a woman's vow, and each asks who in her household is answerable for it: a daughter living in her father's house (verses 3–5); a woman who marries with a vow still on her (verses 6–8); a widow or a divorced woman (verse 9); a wife who vows in her husband's house (verses 10–12), with verses 13–15 giving her husband the same choice over every vow and binding oath of hers. For the daughter and the wife, the vow stands unless the father or husband sets it aside “in the day that he heareth” it, and if he does, “the LORD shall forgive her.” His silence confirms the vow, and he cannot undo it later without taking her guilt on himself (verse 15). The widow and the divorced woman answer for their own vows.

  The laws hang together on the weight of a spoken word. A vow once said to the LORD had to be kept, and each case names who answers for it: the one who vowed, or the father or husband who heard it and said no in time.

sections:
  - range: 1-2
    heading: A vow must be kept
    plain: |
      Moses spoke to the heads of Israel's tribes: This is what the LORD has commanded. When a man makes a vow to the LORD, or swears an oath that binds him to a pledge, he must not break his word. He must do everything he has said.
  - range: 3-5
    heading: A daughter in her father's house
    plain: |
      When a young woman still living in her father's house makes a vow to the LORD, or binds herself by a pledge, and her father hears of it and says nothing to her, all her vows and pledges stand. But if her father objects on the day he hears of it, none of her vows or pledges stands, and the LORD will forgive her, because her father overruled her.
  - range: 6-9
    heading: A vow brought into marriage; the widow
    plain: |
      If she marries while still bound by a vow, or by some rash word from her lips that bound her, and her husband hears of it and says nothing to her that day, her vows and pledges stand. But if her husband objects on the day he hears of it, he cancels the vow she was under and the rash word that bound her, and the LORD will forgive her. Every vow of a widow or of a divorced woman, though, stands; she is bound by it.
  - range: 10-16
    heading: A wife's vow in her husband's house
    plain: |
      If a woman vows in her husband's house, or binds herself by a pledge with an oath, and her husband hears it and says nothing and does not object, all her vows and pledges stand. But if her husband cancels them on the day he hears them, nothing she said in her vows or pledges stands; her husband has cancelled them, and the LORD will forgive her. Any vow, and any sworn pledge to deny herself, her husband may confirm or cancel. If he says nothing to her from one day to the next, he confirms every vow and pledge she is under, because he said nothing on the day he heard them. But if he cancels them some time after he has heard them, he bears her guilt. These are the statutes the LORD gave Moses for a husband and his wife, and for a father and his daughter while she is young and lives in his house.

notes:
  - ref: 1
    phrase: the heads of the tribes
    kind: history
    title: Why the heads of the tribes
    body: |
      This law goes “unto the heads of the tribes,” in one older reading because it governs households: its rules “entered into the sphere of civil rights, namely, into that of family life.” The offerings of chapter 28, by contrast, are commanded to “the children of Israel” ([[Num. 28:2]]). A daughter's vow, a wife's vow, and who may set them aside are questions about the order of a household.
    sources: [keil-numbers]

  - ref: 2
    phrase: to bind his soul with a bond
    kind: words
    title: A vow and a bond
    body: |
      The verse names two kinds of promise to God: a vow to give something to God, and a “bond,” a pledge to keep from something. Vows were of two kinds, “dedication,” in which “some person or thing was given to the Lord,” and “abstinence,” “a promise made to abstain from some lawful act or enjoyment.” In one older reading, the Hebrew word for “vow” is “a positive vow, or promise to give or sanctify any part of one's property to the Lord,” and the word for “bond,” from the verb “to bind,” is “the negative vow, or vow of abstinence.”

      The chapter does not say what a person vowed to abstain from. Another older reading gives as examples abstinence “from wine, as in the case of a Nazirite (ch. 6), or from food”; the first older reading says that “in all probability it consisted chiefly in fasting and other similar abstinence from lawful things.” The chapter itself points that way: verse 13 speaks of a “binding oath to afflict the soul,” and a modern translation notes that the phrase may mean “to fast” (on “afflict the soul,” see [[Lev. 16:29]]).
    sources: [bd-vows, keil-numbers, cambridge-numbers, nrsvue]

  - ref: 2
    phrase: he shall not break his word
    kind: scripture
    title: Not to profane a spoken word
    body: |
      A vow was free to make and binding once it was spoken, and Moses says both on the plains: “if thou shalt forbear to vow, it shall be no sin in thee” ([[Deut. 23:22]]), but a vow left unpaid “would be sin in thee” ([[Deut. 23:21]]). What binds is the word itself, “all that proceedeth out of his mouth”: in one older reading, a vow “is not a vow until it has been expressed in words.”

      The verb behind “break” comes from a root meaning “pollute, defile, profane.” Here it means “he shall not violate his word,” and the same root, in another form, is used of those who “violate a covenant.” In the same older reading, “To break a solemn promise is an act of profanation.”
    sources: [bdb, cambridge-numbers, lds-scriptures]

  - ref: 5
    phrase: the LORD shall forgive her, because her father disallowed her
    kind: history
    title: Why “the LORD shall forgive her”
    body: |
      The LORD forgives a daughter who does not keep her vow for the reason the verse gives: “because her father disallowed her.” The father must act “in the day that he heareth,” the day he hears of the vow, whether or not he was there when she made it, for verses 7–8 “shew that it does not necessarily mean that he is present when she actually utters her vow.” “Disallow” is literally “oppose her,” and a modern translation reads “overrules her.”

      The text does not explain why her father has that authority. In one older reading, “Obedience to a father stood higher than a self-imposed religious service,” and so “Jehovah would forgive her because of her father's refusal.” The same words of forgiveness return for a wife (verses 8, 12). What else the law of Moses provided for women is gathered in the volume guide [Women and Marriage](/old-testament/guides/women-and-marriage/#the-law).
    sources: [keil-numbers, cambridge-numbers, nrsvue, lds-scriptures]

  - ref: 6
    phrase: if she had at all an husband, when she vowed
    kind: words
    title: A vow brought into a marriage
    body: |
      Verses 6–8 concern a vow a woman made before she married and was still under on her wedding day, though the King James “when she vowed” can be read as a vow made after marriage. In one older reading, this is a vow “made by a woman before her marriage, and brought along with her (… ‘upon herself’) into her marriage”; another takes it as a vow “which she had previously taken with her father's approval” and was still bound by. A modern translation reads: “If she marries, while obligated by her vows or any thoughtless utterance of her lips by which she has bound herself.”

      The words behind “uttered ought out of her lips” mean a rash promise, in the first older reading “that which is uttered thoughtlessly or without reflection.” The new husband decides on such a vow “in the same way as the father before her marriage.”
    sources: [keil-numbers, cambridge-numbers, nrsvue]

  - ref: 9
    phrase: every vow of a widow, and of her that is divorced
    kind: history
    title: The widow answers for herself
    body: |
      A widow or a divorced woman answers for her own vow, since the assent the other cases require was needed for “the vows of dependent women (wives or daughters).” In one older reading, “Such a vow had full force, because the woman was not dependent upon a husband.” “Shall stand against her” means, as a modern translation has it, that the vow “shall be binding upon her”: she answers for it herself, as a man does in verse 2.
    sources: [bd-vows, keil-numbers, nrsvue]

  - ref: 15
    phrase: then he shall bear her iniquity
    kind: history
    title: Who bears the guilt of a broken vow
    body: |
      A husband who let his wife's vow stand and later cancelled it takes her guilt on himself. Verse 14 sets the limit: if he “hold his peace at her from day to day,” his silence confirms the vow. If he cancels it later, then, in one older reading, the LORD “will not (as in the foregoing cases) forgive, but the iniquity will rest upon the husband and not upon the woman.”

      In another older reading, the iniquity is “the sin which the wife would have had to bear if she had broken the vow of her own accord”: either “a sin-offering to expiate her sin (Leviticus 5:4.); or if this was omitted, in the punishment which God suspended over the sin.”
    sources: [keil-numbers, cambridge-numbers]

christ: |
  The rule of this chapter, that one who vows to the LORD “shall not break his word,” is one Jesus took up and carried further. In the Sermon on the Mount, whose teachings “replace and transcend some aspects of the law of Moses,” He quoted the old law, “Thou shalt not forswear thyself, but shalt perform unto the Lord thine oaths” ([[Matt. 5:33]]), and asked more: “let your communication be, Yea, yea; Nay, nay” ([[Matt. 5:37]]). The risen Lord gave the Nephites the same words on oaths ([[3 Ne. 12:33–37]]).

  A disciple's promises to God are now the covenants of baptism, and “the Lord has provided the sacrament for regular renewal of our covenants.” Those promises are not kept on one day only: “thy vows shall be offered up in righteousness on all days and at all times” ([[D&C 59:11]]).

explore: |
  - **The law of vows.** [[Lev. 27:1–34]], on what could be vowed and how a vow was redeemed; [[Deut. 23:21–23]].
  - **Vows in the stories.** Jacob at Beth-el ([[Gen. 28:20–22]]); Jephthah ([[Judg. 11:30–40]]); Hannah ([[1 Sam. 1:11]]).

parallels:
