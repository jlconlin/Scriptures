chapter: 18
title: The Priests' Charge and the Levites' Tithe
tagline: After the people cry that whoever comes near the tabernacle will die, the LORD speaks to Aaron. The priests and Levites will guard the sanctuary and answer for it; they will live on Israel's holy gifts and tithes; and in place of land, the LORD Himself is their inheritance.
when: 'In the wilderness after the refusal at Kadesh; the text gives no year'

setting: |
  Chapter 18 follows the rebellion of Korah (16) and the budding of Aaron's rod (17). Those chapters end with the people's cry, “Behold, we die, we perish, we all perish,” and their fear that “whosoever cometh any thing near unto the tabernacle of the LORD shall die” ([[Num. 17:12–13]]). In the chapter that follows, the Levites guard the tent so that no one else perishes by approaching it, as Korah and his company had tried to do. In one older reading the chapter comes here because the LORD had just confirmed Aaron's priesthood, and the laws given so far, “although they contain many isolated stipulations, have not laid down any complete and comprehensive arrangement.”

  The LORD speaks to Aaron directly (verses 1, 8, 20). Only the law of the Levites' own tithe is given to Moses (verse 25), in that reading “as the head of all Israel.” The three Levite clans and their charges are in chapters 3–4; the Levites' place in the priesthood beside Aaron's sons, and what the restored Aaronic Priesthood has to do with it, are at [[Lev. 8:12]] and [[Mal. 3:3]].

thread: |
  The chapter answers the people's fear in two halves: the duties of the priests and Levites (verses 1–7), then what they receive for their service (8–32). The priests and Levites stand between the people and the sanctuary and answer for what goes wrong there, “that there be no wrath any more upon the children of Israel” (verse 5). Because they serve, they are fed from what Israel gives the LORD.

  The priests receive the parts of the offerings not burned on the altar, the best of the oil, wine and grain, the first ripe fruits, the devoted things and the firstborn (8–19). The firstborn sons are bought back at five shekels (verse 16; see [[Ex. 13:2]]), and the whole grant is sealed as “a covenant of salt” (verse 19; see [[Lev. 2:13]]). The Levites receive the tithe (21–24), and from it they give a tenth to the priests (25–32). Through all of it runs one exchange: no land for Aaron or Levi, because “I am thy part and thine inheritance” (verse 20).

sections:
  - range: 1-7
    heading: Guarding the sanctuary
    plain: |
      The LORD said to Aaron: You, your sons and your father's house with you will answer for any wrong done at the sanctuary, and you and your sons will answer for any wrong in your priesthood. Bring your brothers of the tribe of Levi, your father's tribe, to join you and assist you, while you and your sons serve before the tent of the testimony. They are to keep your charge and the charge of the whole tent, but they must not come near the holy vessels or the altar, or both they and you will die. They are to join you and take care of the tent of meeting and all its work, and no outsider is to come near you.

      You are to keep the charge of the sanctuary and of the altar, so that wrath does not come on the Israelites again. I myself have taken your brothers the Levites from among the Israelites; they are given to you as a gift, dedicated to the LORD, to do the work of the tent of meeting. So you and your sons are to keep your priesthood in everything at the altar and inside the veil, and you are to serve. I give you your priesthood as a service that is a gift; any outsider who comes near is to be put to death.
  - range: 8-19
    heading: The priests' portions
    plain: |
      The LORD said to Aaron: I have put you in charge of the offerings lifted up to me, all the holy gifts of the Israelites. I have given them to you and your sons as your portion, by a lasting ordinance. Of the most holy things, what is kept back from the fire is yours: every grain offering, sin offering and trespass offering they bring me is most holy, for you and your sons. You are to eat it in a most holy place; every male may eat it; it is holy to you.

      This is yours too: the lifted portion of their gifts, with all their wave offerings. I give them to you, your sons and your daughters as a lasting statute; everyone in your house who is clean may eat them. I give you all the best of the oil, the new wine and the grain, the firstfruits they give the LORD. The first ripe produce of the land that they bring to the LORD is yours; everyone clean in your house may eat it. Everything devoted in Israel is yours.

      Every firstborn, human or animal, that they bring to the LORD is yours; but you must redeem the firstborn of people and the firstborn of unclean animals. Redeem them from a month old, at your valuation, for five shekels by the sanctuary shekel, which is twenty gerahs. But the firstborn of a cow, a sheep or a goat you must not redeem; they are holy. Sprinkle their blood on the altar and burn their fat as an offering by fire, a pleasing aroma to the LORD. Their meat is yours, like the breast that is waved and the right shoulder. All the holy offerings the Israelites lift up to the LORD I give to you and your sons and daughters as a lasting statute: it is a covenant of salt for ever before the LORD, for you and your descendants.
  - range: 20-24
    heading: No land, and the tithe for Levi
    plain: |
      The LORD said to Aaron: You will have no inheritance in their land and no share among them; I am your share and your inheritance among the Israelites. To the Levites I have given every tithe in Israel as their inheritance, in return for the work they do at the tent of meeting. From now on the Israelites must not come near the tent of meeting, or they will incur guilt and die. The Levites are to do the work of the tent of meeting and answer for any wrong there; it is a lasting statute for all generations. They will have no inheritance among the Israelites, because I have given them as their inheritance the tithe the Israelites lift up to the LORD. That is why I said they would have no inheritance among the Israelites.
  - range: 25-32
    heading: The tithe of the tithe
    plain: |
      The LORD said to Moses: Tell the Levites: When you receive from the Israelites the tithe I have given you as your inheritance, you are to lift up from it an offering to the LORD, a tenth of the tithe. It will be counted to you as if it were grain from your own threshing floor and wine from your own press. So you too will give an offering to the LORD from all the tithes you receive from the Israelites, and give the LORD's portion to Aaron the priest. Out of everything given to you, set aside the LORD's portion, the best and holiest part of it.

      Tell them: When you have lifted out the best, the rest will be counted to you like the produce of a threshing floor or a winepress. You and your households may eat it anywhere; it is your wages for your work at the tent of meeting. Once you have given the best of it, you will incur no guilt by it; but you must not profane the holy gifts of the Israelites, or you will die.

notes:
  - ref: 1
    phrase: shall bear the iniquity of the sanctuary
    kind: history
    title: Answering for the sanctuary
    body: |
      Aaron's house is made answerable for wrongs done at the sanctuary, so that the people need no longer come near the tent “lest they bear sin, and die” (verse 22); the Levites “shall bear their iniquity” (verse 23). In one older reading “the iniquity of the sanctuary” is “the defilement of it by the sin of those who drew near to the sanctuary; not only of the priests and Levites, but of the whole people,” guilt which the priests were “to take upon themselves and expunge.” In that reading “thy father's house” is the Kohathite family of Levi, who had charge of the holy vessels ([[Num. 4:4]]); another older reading takes it as the whole tribe of Levi apart from the priests, and the phrase as bearing “the consequences of the iniquity of allowing your priesthood, or the sanctuary committed to your charge, to be profaned.”

      Verse 5 gives the purpose: “that there be no wrath any more upon the children of Israel.” The reading that makes the guilt the whole people's names the wrath it means, the kind that came “through such illegal acts as Nadab and Abihu (Leviticus 10:2), and the company of Korah (Numbers 16:35), had committed.” The Levites help the priests but may not touch the vessels or the altar (verse 3), and “the stranger that cometh nigh shall be put to death” (verse 7). What “bear iniquity” means in the law's idiom is at [[Ex. 28:38]].
    sources: [keil-numbers, cambridge-numbers]

  - ref: 7
    phrase: I have given your priest’s office unto you as a service of gift
    kind: words
    title: The priesthood as a gift
    body: |
      The LORD calls the priests' office a gift, given to them and not earned. In one older reading the office “brought them into the closest fellowship with the Lord” and “was a favour accorded to them by the grace of God,” and the phrase means “a service with which I present you.” Another older reading agrees that “the priests had done nothing to deserve these privileges; they were a free gift,” though it allows that the Hebrew here may not be sound: the Septuagint reads the line a little differently, “but the meaning is substantially the same.” It sets beside the phrase Paul's teaching on Christian privileges: “what hast thou that thou didst not receive?” ([[1 Cor. 4:7]]).

      The Levites are a gift as well: they are “given as a gift for the LORD” to the priests (verse 6).
    sources: [keil-numbers, cambridge-numbers]

  - ref: 10
    phrase: every male shall eat it
    kind: history
    title: Most holy for the priests, holy for their households
    body: |
      The priests' portions came in two grades, and the grade decided who could eat them and where. The most holy things, the parts of the meal, sin and trespass offerings not burned on the altar (verse 9), could be eaten only by the males of the priestly families and only in a most holy place (verse 10). The burnt offering is not in the list, in one older reading, “because the whole of the flesh of these was burned upon the altar.” What “most holy” meant for the priests' bread is at [[Lev. 2:3]].

      The heave and wave offerings, the best of the oil, wine and grain, and the first ripe fruits could be eaten by the priest's “sons” and “daughters” and by “every one that is clean in thy house” (verses 11–13). In another older reading, “the fact that females might eat it implies that it might be eaten anywhere outside the sacred precincts, into which no female was admitted.” Who counted as the priest's household is at [[Lev. 22:10]].
    sources: [cambridge-numbers, keil-numbers]

  - ref: 20
    phrase: I am thy part and thine inheritance
    kind: history
    title: No land, because the LORD is their share
    body: |
      Aaron and his house received no tribal land; the LORD Himself was to be their share. What is said to Aaron here holds for the whole tribe of Levi, as verses 23–24 show. Joshua puts it another way: “the priesthood of the LORD is their inheritance” ([[Josh. 18:7]]). The Levites were not given land as the other tribes were, because their “inheritance was the priesthood instead,” and the forty-eight cities of [[Num. 35:1–8]] gave them homes among the tribes.

      Verses 21 and 24 also call the tithe Levi's inheritance. One older reading keeps the two apart: the possession of the priests and Levites “did not consist in the revenues assigned to them by God, but in the possession of Jehovah,” and as Levi was the LORD's own possession out of Israel, so the LORD was Levi's. The same reading sees in the arrangement a lesson for all Israel, “to seek the highest of all good in the possession of the Lord, as its portion and inheritance.” In one reading of Psalm 16, its speaker takes the Levites' share as his own ([[Ps. 16:5]]).
    sources: [ot-manual-numbers-13-36, lds-scriptures, keil-numbers, delitzsch-psalms]

  - ref: 26
    phrase: even a tenth part of the tithe
    kind: history
    title: The Levites tithe the tithe
    body: |
      The Levites, who lived on the tithe, paid a tithe of it to the priests, so that what was given to them was first given back to the LORD. Verse 27 counts their offering “as though it were the corn of the threshingfloor”: in one older reading, “as corn and wine which they had reaped themselves.” Another older reading draws the consequence: the tithe was so fully theirs that it was “a source of property from which they in turn must pay a tithe to the priests,” and once the best was given, the remaining nine-tenths “shall be for your own use, just as the rest of Israel use their corn and wine after contributing a tithe of it to you.” They give “the best thereof” (verse 29), may eat the rest “in every place” (verse 31), and “bear no sin by reason of it” (verse 32).

      In the reading that takes the offering as their own harvest, the gifts run all the way up. The nation acknowledged by its tithes that its land came from the LORD, and the Levites, by their tenth to the priests, and the priests, by a portion on the altar, “were to make a practical confession that they had received all their revenues from the Lord their God.” After the exile the Levites again “bring up the tithe of the tithes unto the house of our God” ([[Neh. 10:38]]).
    sources: [keil-numbers, cambridge-numbers, lds-scriptures]

christ: |
  The LORD who gives Aaron the priesthood as a gift and Himself as Levi's inheritance is Jehovah, “the premortal Jesus Christ” (see [[Ex. 3:14]]). Hebrews sets the Levites' tithes beside Him: the sons of Levi “have a commandment to take tithes of the people according to the law” ([[Heb. 7:5]]), but the Lord “sprang out of Juda; of which tribe Moses spake nothing concerning priesthood” ([[Heb. 7:14]]), and He is a priest “not after the law of a carnal commandment, but after the power of an endless life” ([[Heb. 7:16]]).

  The law of the tithe that fed the Levites is one latter-day revelation emphasizes again ([[D&C 119]]). A disciple's tithe is “a duty and a test of faithfulness,” and its honest payment “sanctifies both the individual and the land on which he lives.”

