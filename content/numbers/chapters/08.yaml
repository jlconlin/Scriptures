chapter: 8
title: Offered Before the LORD
tagline: Aaron sets the seven lamps to shine across the holy place. Then the Levites are cleansed, the people lay their hands on them, and Aaron presents the whole tribe to the LORD as Israel's offering, to serve at the tabernacle in place of the firstborn.
when: 'At Sinai, in the second year after the Exodus ([[Num. 1:1]]; [[Num. 10:11]]).'

setting: |
  Numbers 8 is one of the last preparations at Sinai before the camp moves out ([[Num. 10:11]]). The tribe of Levi was left out of the census and given the tabernacle instead ([[Num. 1:47–53]]); chapters 3 and 4 named its clans and their duties, and chapter 7 told of the gifts the princes of the tribes brought for the dedication of the altar. Before the Levites began their work they still had to be consecrated to it and handed over to the priests. This chapter tells how, going over [[Num. 3:5–13]] again and adding the rite that purified them.

  The Levites were taken in place of Israel's firstborn; why, and how the firstborn who had no Levite to stand for them were redeemed, is explained at [[Num. 3:12]] and [[Ex. 13:2]]. Aaron and his sons were the priests (see [[Ex. 28:1]]), consecrated in Leviticus 8, and “the work of the Levites was to assist the priests.” The note on verse 7 sets the two rites side by side.

  Four verses on the lampstand come first; why they stand here is taken up in the note on verse 2.

thread: |
  The chapter is about one group standing in for another. The LORD claimed Israel's firstborn on the night He struck the firstborn of Egypt (verse 17), and He takes the Levites in their place (verse 18). Two layings on of hands mark the exchange: the whole congregation is gathered and the people lay their hands on the Levites (verse 10), and the Levites lay theirs on the two bullocks (verse 12). Aaron presents the Levites to the LORD as Israel's offering (verse 11), and the LORD gives them back as a gift to Aaron, to do Israel's service in the tabernacle (verse 19).

  The chapter tells it twice, as command (verses 5–19) and as deed (verses 20–22), and closes with how long a Levite served (verses 23–26).

sections:
  - range: 1-4
    heading: The seven lamps
    plain: |
      The LORD said to Moses, “Tell Aaron: when you set up the lamps, the seven lamps are to give their light in front of the lampstand.” Aaron did so. He set up its lamps to shine in front of the lampstand, as the LORD had commanded Moses. The lampstand was hammered gold, from its base to its flowers; Moses made it after the pattern the LORD had shown him.
  - range: 5-13
    heading: Cleansing the Levites
    plain: |
      The LORD said to Moses, “Take the Levites from among the children of Israel and cleanse them. This is how: sprinkle the water of purification on them, have them pass a razor over their whole body and wash their clothes, and so they will be clean. Then let them take a young bull with its grain offering of fine flour mixed with oil, and you take another young bull for a sin offering.

      “Bring the Levites before the tabernacle and gather the whole congregation of Israel. When you bring the Levites before the LORD, the children of Israel shall lay their hands on them. Aaron shall present the Levites before the LORD as a wave offering from the children of Israel, so that they may do the LORD's service. The Levites shall lay their hands on the heads of the bulls, and you shall offer one as a sin offering and the other as a burnt offering to the LORD, to make atonement for the Levites. Stand the Levites before Aaron and his sons, and present them as an offering to the LORD.
  - range: 14-19
    heading: In place of the firstborn
    plain: |
      “In this way you shall set the Levites apart from the rest of Israel, and the Levites shall be mine. After that they shall go in to serve at the tabernacle, once you have cleansed them and presented them as an offering. They are wholly given to me from among Israel; I have taken them in place of every firstborn, the first child of every mother in Israel. For every firstborn in Israel, man and beast, is mine: on the day I struck every firstborn in Egypt I set them apart for myself. I have taken the Levites in place of all the firstborn. And I have given the Levites as a gift to Aaron and his sons, from among Israel, to do Israel's service at the tabernacle and to make atonement for the children of Israel, so that no plague strikes them when they come near the sanctuary.”
  - range: 20-22
    heading: It was done
    plain: |
      Moses, Aaron and the whole congregation did to the Levites all that the LORD had commanded Moses concerning them. The Levites purified themselves and washed their clothes; Aaron presented them as an offering before the LORD and made atonement for them to cleanse them. After that the Levites went in to do their work at the tabernacle under Aaron and his sons. As the LORD had commanded Moses concerning the Levites, so they did.
  - range: 23-26
    heading: Twenty-five to fifty
    plain: |
      The LORD said to Moses, “This is the rule for the Levites: from twenty-five years old and up they shall come to serve in the work of the tabernacle. At fifty they shall leave that work and labor no more. They may still help their brothers at the tabernacle in keeping its charge, but they shall do no labor. This is how you shall arrange the Levites' duties.”

notes:
  - ref: 2
    phrase: the seven lamps shall give light over against the candlestick
    kind: history
    title: Seven lamps that shine forward
    body: |
      Aaron was to set the lamps so that their light fell forward, in front of the lampstand. A modern translation reads “give light in front of the lampstand.” In one older reading the light fell “towards the opposite (north) side, where the table of the Presence-bread stood,” and the verb, better rendered “when thou settest up,” “describes Aaron as reaching up to put them in their place after the wicks have been lighted.” The lampstand itself, and what it may have stood for, are explained at [[Ex. 25:31]].

      The text does not say why these verses come here. Another older reading answers that they are “not a mere repetition, but also a more precise definition” of the command that the lamps “give light over against it” ([[Ex. 25:37]]), and that they give the lighting to Aaron himself, “for this had not been done before.” On that reading the seven lamps showed “Israel … represented perpetually before the Lord as a people causing its light to shine in the darkness of this world,” and the verses stand “quite appropriately” between the princes' gifts for the altar and “the solemn inauguration of the Levites.”
    sources: [nrsvue, cambridge-numbers, keil-numbers, lds-scriptures]

  - ref: 7
    phrase: Sprinkle water of purifying upon them
    kind: words
    title: Cleansed, not made holy
    body: |
      The Levites are cleansed, not consecrated as the priests were. Their rite is called cleansing (verses 6, 7, 15 and 21), where the priests were hallowed ([[Ex. 29:1]]). In one older reading the Levites are “merely cleansed from the ceremonial pollution of ordinary life” and the priests are given holiness, meaning “not moral excellence, but separation, exclusiveness.”

      Each step of the rite shows the difference. The priests were washed all over ([[Lev. 8:6]]); the Levites are only sprinkled. The priests were dressed in new robes ([[Lev. 8:13]]); the Levites wash the clothes they have ([[Ex. 19:14]]), “as ordinary laymen would do” for ceremonial cleansing. The “water of purifying” is literally “water of sin,” “a unique expression denoting ‘water that washes away sin.’” What it was the text does not say, and in one older reading it “cannot be determined with any certainty.” That reading rules out both the water made with the red heifer's ashes (see [[Num. 19:9]]) and plain water, and takes it as the water of the laver; another takes it as “simple pure water.”

      “Shave all their flesh” is literally “cause a razor to pass over all their flesh.” One older reading gives the reason simply as “for the purpose of cleanliness”; another distinguishes the phrase from the leper's shaving of his hair “entirely off” ([[Lev. 14:9]]).
    sources: [oshb-wlc, keil-numbers, cambridge-numbers, lds-scriptures]

  - ref: 10
    phrase: the children of Israel shall put their hands upon the Levites
    kind: symbol
    title: The people’s hands on the Levites
    body: |
      When the people lay their hands on the Levites, the Levites become Israel's own offering and its representatives: the one on whom Israel laid its hands “took upon himself their identity; that is, he became their representative before the Lord.” One older reading compares the worshipper's hand on his burnt offering ([[Lev. 1:4]]): the people laid their hands on “through their representatives,” “to indicate that the whole community offered the Levites as their gift.” Another sees in the act the handing on of a debt: the people transferred to the Levites “the obligation resting upon the whole nation to serve the Lord in the persons of its first-born sons.”

      Two verses later the Levites do the same to the two bullocks (verse 12), and by that act, in that last reading, “presented their own bodies to the Lord as a living sacrifice well-pleasing to Him.”
    sources: [cambridge-numbers, keil-numbers, ot-manual-numbers-1-12, lds-scriptures]

  - ref: 11
    phrase: Aaron shall offer the Levites before the LORD for an offering of the children of Israel
    kind: words
    title: Waved before the LORD
    body: |
      Where the King James has Aaron “offer the Levites … for an offering,” the Hebrew has him wave them as a wave offering, *tenûpâ*, and the plain-words section above says so. The word is a technical term, “originally of priest's share of sacrifice,” used “even of Levites” here; the King James “offer” stands for it again in verses 13, 15 and 21. (The wave offering itself is explained at [[Lev. 7:30]].)

      Waved before the LORD, the Levites “became God's peculiar property, given to Him in place of the firstborn,” and He gave them on to the priests: “I have given the Levites as a gift to Aaron” (verse 19), where “as a gift” is literally “given [persons].” How a whole tribe was waved the text does not say. One older reading supposes that Aaron led the Levites “solemnly up to the altar, and then back again.” Another holds that “the literal significance of the term … is here lost, but the underlying thought remains that, having been given to Jehovah, the Levites were given back by Him for ritual service to the priests and the congregation.” The Septuagint, the early Greek translation, renders verse 11 without the waving: “Aaron shall separate the Levites for a gift before the Lord.”
    sources: [oshb-wlc, bdb, cambridge-numbers, keil-numbers, lxx-rahlfs, bd-levites]

  - ref: 19
    phrase: that there be no plague among the children of Israel, when the children of Israel come nigh unto the sanctuary
    kind: history
    title: An atonement that keeps the plague away
    body: |
      The Levites “make an atonement” for Israel, in one older reading, by standing between the people and the sanctuary, not by a sacrifice for past sins. On that reading the word here means “the averting of God's anger by preventing sin from being committed”: the sin of leaving the worship undone, and “the too near approach of the laity to the holy things.” The Levites “are both substitutes for the laity, and at the same time a cordon to keep them at a distance.”

      Both older readings tie the verse to [[Num. 1:53]], where the Levites pitch around the tabernacle “that there be no wrath upon the congregation.” One takes that wrath as the LORD's, breaking “in judgment upon the unholy who approached His sanctuary in opposition to His command.” The Levites' place in the priesthood beside Aaron's sons, and what the restored Aaronic Priesthood has to do with it, are at [[Lev. 8:12]] and [[Mal. 3:3]].
    sources: [cambridge-numbers, keil-numbers, lds-scriptures]

  - ref: 24
    phrase: from twenty and five years old and upward
    kind: history
    title: Twenty-five here, thirty in chapter 4
    body: |
      Chapter 4 numbers the Levites “from thirty years old and upward even until fifty years old” ([[Num. 4:3]]), and this verse starts their service at twenty-five; the text does not reconcile the two. They are read as different work: the Levites who served at the standing tabernacle “were allowed to begin such service five years earlier than those who transported the tabernacle.” One older reading gives the reason: carrying the tabernacle through the wilderness “required the strength of a full-grown man,” while “the duties connected with the tabernacle when standing were of a lighter description, and could easily be performed from the twenty-fifth year.”

      The age changed again when the carrying ended. In David's last days the Levites were counted “from twenty years old and above,” because “they shall no more carry the tabernacle” ([[1 Chr. 23:26–27]]).
    sources: [keil-numbers, ot-manual-numbers-1-12, lds-scriptures]

  - ref: 26
    phrase: to keep the charge, and shall do no service
    kind: history
    title: Keeping the charge after fifty
    body: |
      At fifty a Levite left the heavy work but not the tabernacle. The verse sets two words apart, “the charge” and “service.” In one older reading the charge was “the oversight of all the furniture of the tabernacle,” and the service “laborious service”: taking down and setting up the tent and cleaning it, “carrying wood and water for the sacrificial worship, slaying the animals for the daily and festal sacrifices.” Another reads “shall do no service” as “no necessary responsible service. They may assist their younger fellow-Levites as voluntary helpers.”
    sources: [keil-numbers, cambridge-numbers]

christ: |
  The LORD who says of every firstborn in Israel, “on the day that I smote every firstborn in the land of Egypt I sanctified them for myself” (verse 17), is Jehovah, the premortal Christ (see [[Ex. 3:14]]). The firstborn for whom the Levites stand are followed to Him at [[Ex. 13:2]] and in [The Firstborn](/exodus/themes/the-firstborn/): “I was in the beginning with the Father, and am the Firstborn” ([[D&C 93:21]]).

  The Levites were given to do Israel's service in His house (verse 19). John the Baptist conferred the Aaronic Priesthood “until the sons of Levi do offer again an offering unto the Lord in righteousness” ([[D&C 13:1]]; on who they are, see [[Mal. 3:3]]), and those who are faithful in “the magnifying their calling, are sanctified by the Spirit unto the renewing of their bodies” ([[D&C 84:33]]). Service in the Lord's house is still given on behalf of others, and He still sanctifies those who give it faithfully.

