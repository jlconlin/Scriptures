chapter: 28
title: Morning and Evening, Sabbath and New Moon
tagline: On the plains of Moab the LORD sets out what Israel is to offer Him at every appointed time, from the lamb of each morning and evening to the feasts of the spring.
when: 'On the plains of Moab, in the fortieth year after the Exodus ([[Num. 36:13]]; [[Deut. 1:3]])'

setting: |
  Numbers 28 opens a single law that runs through chapter 29. It is set on the plains of Moab, where Israel spent its last months before the crossing of the Jordan. The new generation has just been counted ([[Num. 26]]) and Joshua appointed to lead it ([[Num. 27:18–23]]). Now, on one older reading, with Israel “prepared for the conquest of the promised land,” the LORD fixes “the sacrifices through which it was to maintain its fellowship with its God from day to day.” Nothing in the chapter is wholly new. The daily lamb was commanded at Sinai ([[Ex. 29:38–42]]) and the feasts in [[Lev. 23]]; here the earlier sacrificial and festal laws are “completed and arranged into a united and well-ordered whole.”

  The two chapters go through the public offerings season by season: every morning and evening, the Sabbath, the first day of each month, the Passover and the seven days of unleavened bread, and the feast of weeks, then the feasts of the seventh month (chapter 29). What each feast was and what it remembered is explained at [[Lev. 23]] and in [The Law and the Covenant](/old-testament/guides/law-and-covenant/#feasts); the measures of flour, oil and wine that go with each animal are at [[Num. 15:4]].

  The offerings are called the LORD's “bread” (verse 2), explained at [[Lev. 3:11]].

thread: |
  Numbers 28 is **a calendar built on the daily lamb.** The chapter begins with the continual burnt offering, a lamb in the morning and a lamb at evening (verses 3–8), and every offering after it is added “beside the continual burnt offering” (verses 10, 15, 23, 24, 31). On one older reading the order rises in steps: in the daily offering Israel “was to sanctify its life, body, soul, and spirit, to the Lord its God,” and on the LORD's feast days it gave “expression to this sanctification in an intensified form.” On the Sabbath the daily offering is doubled (verses 9–10). At each new moon, on each of the seven days of unleavened bread, and on the day of the firstfruits, the feast of weeks (fifty days after the first sheaf; see [[Lev. 23:16]]), the same larger offering is added: two bullocks, a ram and seven lambs, with their flour, oil and wine (verses 11–14, 19–21, 27–29). With it, each of these days has a goat for a sin offering (verses 15, 22, 30), “to make an atonement for you” (verses 22, 30).

  So the law asks for something every day and something more at each larger turn of time, the week, the month, the year. The Passover alone is named with no offering added (verse 16), and the seventh month, with the largest offerings of all (thirteen bullocks on the first day of Tabernacles, [[Num. 29:13]]), follows in chapter 29.

sections:
  - range: 1-8
    heading: The lamb of every morning and evening
    plain: |
      The LORD said to Moses: Command the Israelites and tell them: Be careful to offer Me at its appointed time My offering, the food for My offerings made by fire, a pleasing aroma to Me. Tell them: This is the offering made by fire that you shall offer to the LORD: two lambs a year old without blemish, every day, as a regular burnt offering. Offer one lamb in the morning and the other at evening, with a tenth of an ephah of fine flour for a grain offering, mixed with a quarter of a hin of beaten oil. It is the regular burnt offering that was ordained at Mount Sinai, a pleasing aroma, an offering made by fire to the LORD. Its drink offering shall be a quarter of a hin for each lamb; in the holy place pour out strong drink as a drink offering to the LORD. Offer the second lamb at evening, with the same grain offering and drink offering as in the morning, an offering made by fire, a pleasing aroma to the LORD.
  - range: 9-10
    heading: The Sabbath
    plain: |
      On the Sabbath day offer two lambs a year old without blemish, with two tenths of an ephah of fine flour mixed with oil for a grain offering, and its drink offering. This is the burnt offering for every Sabbath, in addition to the regular burnt offering and its drink offering.
  - range: 11-15
    heading: The beginning of each month
    plain: |
      At the beginning of each month offer a burnt offering to the LORD: two young bulls, one ram, and seven lambs a year old without blemish. With each bull, three tenths of an ephah of fine flour mixed with oil for a grain offering; with the ram, two tenths; and with each lamb, one tenth, for a burnt offering of pleasing aroma, an offering made by fire to the LORD. Their drink offerings shall be half a hin of wine for a bull, a third of a hin for the ram, and a quarter of a hin for a lamb. This is the burnt offering of every month, through all the months of the year. And one goat shall be offered to the LORD as a sin offering, in addition to the regular burnt offering and its drink offering.
  - range: 16-25
    heading: Passover and unleavened bread
    plain: |
      On the fourteenth day of the first month is the LORD's Passover. On the fifteenth day of that month is a feast; for seven days unleavened bread shall be eaten. On the first day hold a sacred assembly and do no ordinary work. Offer as an offering made by fire, a burnt offering to the LORD, two young bulls, one ram, and seven lambs a year old; see that they are without blemish. Their grain offering shall be fine flour mixed with oil: three tenths of an ephah for a bull, two tenths for the ram, and one tenth for each of the seven lambs; and one goat as a sin offering, to make atonement for you. Offer these in addition to the morning burnt offering, which is the regular burnt offering. In the same way offer each day for seven days the food of the offering made by fire, a pleasing aroma to the LORD; it shall be offered in addition to the regular burnt offering and its drink offering. On the seventh day hold a sacred assembly and do no ordinary work.
  - range: 26-31
    heading: The day of the firstfruits
    plain: |
      On the day of the firstfruits, when you bring a new grain offering to the LORD at the close of your feast of weeks, hold a sacred assembly and do no ordinary work. Offer a burnt offering of pleasing aroma to the LORD: two young bulls, one ram, and seven lambs a year old, with their grain offering of fine flour mixed with oil, three tenths of an ephah for each bull, two tenths for the ram, and one tenth for each of the seven lambs, and one goat to make atonement for you. Offer them in addition to the regular burnt offering and its grain offering (see that they are without blemish), with their drink offerings.

notes:
  - ref: 6
    phrase: which was ordained in mount Sinai
    kind: history
    title: The daily offering under all the rest
    body: |
      The lamb of morning and evening is given again here because every other offering in the calendar stands on it. What the continual burnt offering was and why it was offered twice a day is explained at [[Ex. 29:38]]; this chapter adds its place in the year. On one older reading it is repeated “not merely for the sake of completeness,” but because “the daily sacrifice was also to be offered on the Sabbaths and feast-days, to accompany the general and special festal sacrifices, and to form the common substratum for the whole of these.”

      The chapter's refrain, “beside the continual burnt offering,” says the same. At the yearly feasts the same reading counts three layers: “(a) the daily morning and evening sacrifice; (b) the general sacrifices that were offered on every feast-day; and (c) the festal sacrifices that were peculiar to each particular feast,” the last given in Leviticus 23. Verse 23 sets the order within a feast day: the festal offerings come after the morning lamb, “offered every day after the morning sacrifice.” No holy day, however great, replaced the lamb of the ordinary day.
    sources: [keil-numbers]

  - ref: 7
    phrase: in the holy place shalt thou cause the strong wine to be poured unto the LORD
    kind: words
    title: Strong drink poured out for the LORD
    body: |
      The “strong wine” of this verse is *shekar*, “intoxicating drink, strong drink,” the word for what a priest was “forbidden” to drink “on duty” (“Do not drink wine nor strong drink,” [[Lev. 10:9]]). Here *shekar* stands where verse 14, giving the same drink offerings, says “wine.” One older reading takes the word in this verse not as “intoxicating drink” but as “strong drink, in distinction from water as simple drink,” and holds that “the drink-offering consisted of wine only.” On that reading the drink poured out was wine.

      “In the holy place” means, on the same reading, “round about the altar,” as Josephus paraphrases it, not “with (in) holy vessels,” as some ancient interpreters took it.
    sources: [bdb, keil-numbers]

  - ref: 9
    phrase: And on the sabbath day two lambs of the first year without spot
    kind: scripture
    title: Priests at work on the Sabbath
    body: |
      On the day of rest the priests' work at the altar doubled. Israel had been commanded to keep the Sabbath since Sinai, but on one older reading its offering “is appointed here for the first time; whereas the sabbatical feast had already been instituted at Exodus 20:8-11 and Leviticus 23:3.” The Sabbath offering did not replace the daily one; it was added “beside the continual burnt offering” (verse 10), so that “On the Sabbaths the daily sacrifice was doubled.”

      The Church's footnote to this verse points to Jesus' answer to the Pharisees who accused His disciples of breaking the Sabbath by plucking grain: “have ye not read in the law, how that on the sabbath days the priests in the temple profane the sabbath, and are blameless? But I say unto you, That in this place is one greater than the temple” ([[Matt. 12:5–6]]). The tie between the two passages is the footnote's; Jesus does not name the verse.
    sources: [keil-numbers, lds-scriptures]

  - ref: 15
    phrase: one kid of the goats for a sin offering unto the LORD
    kind: history
    title: A sin offering at every new moon
    body: |
      The new moon had the bullocks, ram, lambs and goat of the great feasts, but the text gives it no rest and no holy assembly. “The law appointed that at the new moon special sacrifices should be offered,” and “As the days for all Jewish feasts were reckoned by the moon, the exact time of the appearance of the new moon was of great importance.” Yet the day was not, on one older reading, “strictly speaking,” a festal day “with sabbatical rest and a holy meeting”: verses 11–15 say nothing of a convocation or of work, unlike verses 18, 25 and 26.

      Why a sin offering here, when the Sabbath has none? The text gives no reason. The same older reading suggests that the month, as a larger span than the day, called for it: “in consideration of the sins that had been committed in the course of the past month, and had remained without expiation, a special sin-offering should be offered.” The trumpets blown over these offerings are at [[Num. 10:10]]. In later times, on the same reading, “the new moon grew more and more into a feast-day”: trade was suspended on it, and the faithful sought out a prophet. The two passages are [[Amos 8:5]] and [[2 Kgs. 4:23]]. The new moon of the psalm's feast is at [[Ps. 81:3]].
    sources: [bd-new-moon, keil-numbers]

  - ref: 16
    phrase: the passover of the LORD
    kind: christ
    title: The Passover, with nothing added
    body: |
      The Passover is the one appointed day in the chapter named with no offering: “the Passover is mentioned … but no offering is commanded.” Every other day in the calendar has its lambs at least; the fourteenth day of the month has a single sentence. On one older reading there was “no general festal offering on the day of the Passover, or the 14th of the month”; the day's own sacrifice is the one given in [[Ex. 12:3–14]]: the lamb each household killed “in the evening” ([[Ex. 12:6]]), “the sacrifice of the LORD's passover, who passed over the houses of the children of Israel in Egypt” ([[Ex. 12:27]]). The offerings of this chapter begin on the fifteenth, with the seven days of unleavened bread (verses 17–25).

      Paul names that lamb's fulfillment: “Purge out therefore the old leaven, that ye may be a new lump, as ye are unleavened. For even Christ our passover is sacrificed for us” ([[1 Cor. 5:7]]).
    sources: [cambridge-numbers, keil-numbers, lds-scriptures]

christ: |
  The lambs of this chapter, two each day, “without spot,” are the image Peter used of Jesus Christ: the Saints are redeemed “with the precious blood of Christ, as of a lamb without blemish and without spot” ([[1 Pet. 1:19]]). Hebrews sets the daily altar beside Him: “every priest standeth daily ministering and offering oftentimes the same sacrifices, which can never take away sins: But this man, after he had offered one sacrifice for sins for ever, sat down on the right hand of God” ([[Heb. 10:11–12]]). Both kinds of offering in this calendar, the burnt offering and the goat for sin, have been read of Him: “He dies in our place as in the burnt offering. His blood cleanses us to allow us to dwell in the presence of God as in the sin offering.” Amulek gives the meaning of the whole calendar: “this is the whole meaning of the law, every whit pointing to that great and last sacrifice” ([[Alma 34:14]]).

  When that sacrifice was made, the risen Lord ended the burnt offerings and named what He asks in their place: “ye shall offer for a sacrifice unto me a broken heart and a contrite spirit” ([[3 Ne. 9:19–20]]). The offering a disciple brings is no longer a lamb but that heart, and He promises that whoever comes to Him with it He will baptize “with fire and with the Holy Ghost” ([[3 Ne. 9:20]]).

explore: |
  - **The daily offering at Sinai.** [[Ex. 29:38–46]], where the LORD promises to meet Israel at the door of the tabernacle.
  - **The feasts themselves.** Leviticus 23, and the seventh month in [[Num. 29]].
  - **Ezekiel's temple offerings.** [[Ezek. 45:17–46:15]], which differ from these.
  - **The one sacrifice.** [[Heb. 10:1–14]]; [[Alma 34:9–16]]; [[3 Ne. 9:17–20]].

parallels:
  - ref: Ex. 29:38–42
    note: The continual burnt offering first commanded at Sinai.
  - ref: Lev. 23:4–22
    note: The Passover, unleavened bread, the first sheaf and the feast of weeks, with their own offerings.
  - ref: Num. 15:1–12
    note: The flour, oil and wine that go with each animal.
  - ref: Ezek. 46:4–15
    note: The Sabbath, new moon and daily offerings of Ezekiel's temple vision, in other amounts.
  - ref: Heb. 10:11–12
    note: The daily offering set beside Christ's one sacrifice.

