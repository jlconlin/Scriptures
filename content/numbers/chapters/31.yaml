    note: The five kings of Midian and Balaam, slain with the sword, named again in the account of the land east of Jordan.
  - ref: Num. 25:16–18
    note: The command to vex and smite the Midianites that this chapter carries out.
  - ref: 1 Sam. 30:24–25
    note: David's rule that those who stay with the baggage share equally with those who fight.

