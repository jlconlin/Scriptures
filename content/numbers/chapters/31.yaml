chapter: 31
title: Avenge the LORD of Midian
tagline: Before Moses is gathered to his people, Israel fights the Midianites of Peor; Balaam dies, the captives are judged, the warriors are cleansed, the spoil is shared, and the officers bring gold because not one man was lost.
when: 'On the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Numbers 31 carries out the command given after the sin at Peor, “Vex the Midianites, and smite them” ([[Num. 25:17]]). The LORD had already told Moses that he would see the land and then “be gathered unto thy people” ([[Num. 27:13]]); now the war comes first, and “afterward” his death (verse 2). Between Peor and this chapter stand the new census, the daughters of Zelophehad, the setting apart of Joshua, and the laws of offerings and vows (chapters 26–30).

  The Midianites were Abraham's descendants through Keturah ([[Gen. 25:1–2]]); why they appear beside Moab at Peor, and Moses' own ties to Midian, are explained at [[Num. 25:6]]. Joshua later names the same five kings ([[Josh. 13:21–22]]); what later scripture makes of Balaam, who dies among them (verse 8), is at verse 16.

thread: |
  Numbers 31 is **the answer to Peor, fought as a holy war.** The LORD's command is to avenge Israel of the Midianites (verse 2), and Moses gives it to the people as vengeance for the LORD (verse 3), carrying out the command given after Peor ([[Num. 25:16–18]]). A thousand come from every tribe; Phinehas the priest goes with the holy trumpets (verses 4–6). One older reading calls it “a holy war of the congregation against the enemies of themselves and their God.”

  The soldiers kill the men and the kings, and Balaam with them, and bring back the women and children (verses 7–12). The chapter then moves from the battle to the camp. Moses is angry that the women who led Israel into sin at Peor were spared, and he gives the command of verses 17–18 (verses 13–18). The warriors, the captives, and the plunder must be purified before they come into the camp (verses 19–24). The spoil is divided, and the LORD's share is set apart (verses 25–47). Last, the officers find that not one soldier is missing and bring their gold to the tabernacle as a memorial (verses 48–54).

sections:
  - range: 1-12
    heading: The war against Midian
    plain: |
      The LORD said to Moses: Take vengeance for the Israelites on the Midianites; afterward you will be gathered to your people. So Moses told the people: Arm some of your men for war, and let them go against Midian to carry out the LORD's vengeance on Midian. Send a thousand from each tribe of Israel to the war. So twelve thousand men armed for war were supplied from the clans of Israel, a thousand from each tribe. Moses sent them to war, a thousand from each tribe, with Phinehas the son of Eleazar the priest, who had in his hand the holy instruments and the trumpets for sounding the alarm. They fought against Midian as the LORD had commanded Moses and killed every male. Besides the others they killed, they killed the five kings of Midian, Evi, Rekem, Zur, Hur and Reba, and they killed Balaam the son of Beor with the sword. The Israelites took the women of Midian and their children captive, and took all their cattle, their flocks and their goods as plunder. They burned all the towns where the Midianites lived and all their encampments. They took all the plunder and all the spoil, people and animals, and brought the captives, the spoil and the plunder to Moses, to Eleazar the priest, and to the congregation of Israel at the camp on the plains of Moab by the Jordan, across from Jericho.
  - range: 13-18
    heading: Moses and the captives
    plain: |
      Moses, Eleazar the priest, and all the leaders of the congregation went out of the camp to meet them. Moses was angry with the officers of the army, the commanders of thousands and of hundreds, who had come back from the battle. He said to them: Have you let all the women live? These are the very women who, on Balaam's advice, led the Israelites to be unfaithful to the LORD in the affair of Peor, so that the plague struck the LORD's congregation. Now kill every male among the children, and kill every woman who has lain with a man. But keep alive for yourselves all the young girls who have not lain with a man.
  - range: 19-24
    heading: The cleansing of the warriors
    plain: |
      Stay outside the camp seven days. Whoever has killed anyone, and whoever has touched anyone slain, must purify himself and his captives on the third day and on the seventh day. Purify every garment, everything made of leather, everything made of goats' hair, and everything made of wood. Then Eleazar the priest said to the soldiers who had gone into battle: This is the statute of the law the LORD commanded Moses. Gold, silver, bronze, iron, tin and lead, everything that can stand fire, you must pass through the fire, and it will be clean; even so, it must also be purified with the water for impurity. Whatever cannot stand fire you must pass through the water. Wash your clothes on the seventh day and you will be clean; after that you may come into the camp.
  - range: 25-47
    heading: The dividing of the spoil
    plain: |
      The LORD said to Moses: You, Eleazar the priest, and the heads of the families of the congregation, count everything that was taken, people and animals. Divide it into two halves, one for the soldiers who went out to battle and one for the whole congregation. From the soldiers' half set aside a share for the LORD, one out of every five hundred, of the people, the cattle, the donkeys and the sheep, and give it to Eleazar the priest as the LORD's contribution. From the Israelites' half take one out of every fifty, of the people, the cattle, the donkeys, the flocks and every kind of animal, and give them to the Levites, who keep the charge of the LORD's tabernacle. Moses and Eleazar did as the LORD had commanded Moses. The plunder that remained of what the soldiers had taken was 675,000 sheep, 72,000 cattle, 61,000 donkeys, and 32,000 people in all, young women who had not lain with a man. The soldiers' half was 337,500 sheep, of which the LORD's share was 675; 36,000 cattle, of which the LORD's share was 72; 30,500 donkeys, of which the LORD's share was 61; and 16,000 people, of which the LORD's share was 32. Moses gave the share, the LORD's contribution, to Eleazar the priest, as the LORD had commanded Moses. From the Israelites' half, which Moses had separated from the soldiers' (the congregation's half was 337,500 sheep, 36,000 cattle, 30,500 donkeys, and 16,000 people), Moses took one out of every fifty, of people and animals, and gave them to the Levites who kept the charge of the LORD's tabernacle, as the LORD had commanded Moses.
  - range: 48-54
    heading: Gold for a memorial
    plain: |
      Then the officers over the units of the army, the commanders of thousands and of hundreds, came to Moses and said: Your servants have counted the soldiers under our command, and not one of us is missing. So we have brought an offering to the LORD, the gold ornaments each of us found: armlets, bracelets, rings, earrings and necklaces, to make atonement for ourselves before the LORD. Moses and Eleazar the priest received the gold from them, all of it worked ornaments. All the gold the commanders of thousands and of hundreds offered to the LORD weighed 16,750 shekels. (The soldiers had each taken plunder for themselves.) Moses and Eleazar the priest took the gold from the commanders and brought it into the tabernacle of the congregation as a memorial for the Israelites before the LORD.

notes:
  - ref: 2
    phrase: Avenge the children of Israel of the Midianites
    kind: history
    title: Why Midian, and not Moab
    body: |
      The war falls on Midian alone, though Moab's daughters began the sin at Peor ([[Num. 25:1]]); the text gives no reason for leaving Moab alone, and one older reading supplies one. Moab's women took part “at the instigation of the Midianites, and not of their own accord, and therefore the Midianites only were to atone for the wickedness.” What Midian did there is named in verse 16 (see the note there).

      The LORD calls the war vengeance for Israel (verse 2), and Moses calls it vengeance for the LORD (verse 3). The same reading holds that both are true of one act: it was the LORD's vengeance “because the seduction had violated the divinity and honour of Jehovah.”
    sources: [keil-numbers]

  - ref: 6
    phrase: with the holy instruments, and the trumpets to blow in his hand
    kind: history
    title: Phinehas and the trumpets
    body: |
      A priest went with the army because the war was the LORD's, and he carried the trumpets the law had given for war. The trumpets were to be blown when Israel went to war against an oppressor, and the promise was “ye shall be remembered before the LORD your God, and ye shall be saved from your enemies” ([[Num. 10:9]]; see the note there). On one older reading the “holy instruments” are those trumpets themselves: they cannot be the ark, for the word is plural, nor the Urim and Thummim, “because Phinehas was not yet high priest.” Another older reading allows that the writer may have had in mind the ephod with the Urim and Thummim, so that Phinehas could ask God how to fight, as the high priest did by the Urim ([[Num. 27:21]]), but judges it “doubtful whether that right would be ascribed to any but the high priest.”

      The text names no commander, and it does not say why Phinehas went rather than his father Eleazar, who stays to meet the army at the camp (verse 13). The reading that allows the ephod has the soldiers “apparently led not by Moses or Joshua but by Phinehas the priest,” who had shown his zeal against Midian at Peor ([[Num. 25:7–8]]). The reading that takes the instruments to be the trumpets holds that he went “not as the leader of the soldiers,” but as the priest with the trumpets, chosen because no other priest could equal that zeal.
    sources: [keil-numbers, cambridge-numbers]

  - ref: 7
    phrase: they slew all the males
    kind: history
    title: The five kings, and Midian afterward
    body: |
      The war killed the men of the Midianite tribes east of Moab and their chiefs, and it did not end Midian. One older reading takes the five kings of verse 8 to be “chiefs of the larger or more powerful of the Midianitish tribes”: Zur, the father of Cozbi, was “head over a people” ([[Num. 25:15]]), and Joshua calls the five “dukes of Sihon,” the Amorite king of Heshbon ([[Josh. 13:21]]). The same reading takes “all the males” to mean “all the adult males, as the sequel shows,” since the boys are still alive when Moses speaks (verse 17).

      Midian survived: in Gideon's day the LORD delivered Israel “into the hand of Midian seven years” ([[Judg. 6:1]]). Another older reading, noting that not long afterward Midian was “one of Israel's most troublesome neighbours,” takes verse 7 as “an imaginative description of success” rather than a count. How many of Midian's clans this war touched, the text does not say.
    sources: [keil-numbers, cambridge-numbers, lds-scriptures]

  - ref: 16
    phrase: through the counsel of Balaam
    kind: history
    title: Balaam’s two portraits
    body: |
      This verse gives Balaam a second portrait. In chapters 22–24 he would speak only the word God put in his mouth ([[Num. 22:38]]) and blessed Israel three times; here his counsel is what led Israel into sin at Peor, and in verse 8 he dies by the sword among the kings of Midian. Numbers 25 tells the sin at Peor without naming him. The charge in this verse is “a major factor” in reversing the “generally positive depiction” of Balaam in chapters 22–24 (the episode of the ass aside). Later scripture follows the second portrait: Joshua calls him “the soothsayer” ([[Josh. 13:22]]), Peter says he “loved the wages of unrighteousness” ([[2 Pet. 2:15]]), and Revelation says he “taught Balac to cast a stumblingblock before the children of Israel” ([[Rev. 2:14]]).

      Why one book holds both portraits is not settled. One explanation is the documentary hypothesis, which holds that an editor combined older sources into the books of Moses but “kept much of the source material intact, including contradictions”; that would explain “why some parts of Numbers are positive about Balaam and some are negative.” It is offered as one explanation, not a result: no ancient document from one of those sources has been found, and “the final form of the text can be read as a unity.” Another reading starts from what chapters 22–24 are for: there Balaam serves “primarily as a foil to Balak and as the mouthpiece for Jehovah's will,” and his character is “incidental to the story,” so those chapters never set out to judge him. Later texts made his picture darker, and “there is currently no good evidence for the origins of these varied traditions.” What Latter-day Saint writers have made of Balaam as a man is at [[Num. 22:18]].
    sources: [pike-balaam, sc-knowhy-850, lds-scriptures]

  - ref: 17
    phrase: kill every male among the little ones
    kind: history
    title: The command concerning the captives
    body: |
      Moses ordered that the captive boys and the women who had been with men be killed, and that the girls be kept alive. For the women the text gives its reason in the verse before: they had drawn Israel, through Balaam's counsel, into the sin at Peor that brought the plague. For the boys it gives none. One older reading takes the killing of the boys as meant “to exterminate the whole nation, as it could not be perpetuated in the women,” and the killing of the women as aimed at those who “might possibly have been engaged in the licentious worship of Peor,” so as “to preserve the congregation from all contamination from that abominable idolatry.” The girls who were spared are counted with the spoil, thirty-two thousand (verse 35), and thirty-two of them are given to Eleazar as the LORD's share (verses 40–41). The text says nothing more of them.

      The Old Testament's accounts of violence, this one among them, generally tell what did happen, in a time more violent than many people now can comprehend. Knowing that excuses no wrong, but it lets a reader come to such accounts with humility and charity. Commanded war was the exception in the Old Testament, and above all the Lord stressed that His people “seek peace and avoid violence.” The commanded destruction of the nations of Canaan is treated at [[Deut. 7:2]].
    sources: [lds-scriptures, keil-numbers, scripture-helps-violence]

  - ref: 19
    phrase: abide without the camp seven days
    kind: history
    title: Unclean after a commanded war
    body: |
      Soldiers who had fought at the LORD's command were still unclean from the dead and had to be cleansed before they came back into the camp. The rule is the law of chapter 19 applied to war: anyone who “toucheth the dead body of any man” is unclean seven days and is purified “on the third day, and on the seventh day” ([[Num. 19:11–12]]; on the water of separation, see [[Num. 19:9]]). One older reading calls this “the legal purification of such persons and things as had been rendered unclean through contact with dead bodies,” and it applied to the captives too (verse 19).

      What Eleazar adds (verses 21–23) is the treatment of things. The same reading says he gave “fuller instructions … in accordance with the law in ch. 19”: metal, which can bear fire, “was to be drawn through the fire, that it might become clean, and was then to be sprinkled with water of purification”; everything else “was to be drawn through water.”
    sources: [lds-scriptures, keil-numbers]

  - ref: 27
    phrase: divide the prey into two parts
    kind: history
    title: Half to the soldiers, half to the congregation
    body: |
      The spoil was split evenly between the twelve thousand who fought and the whole congregation who did not, and each half paid a share to the LORD. One older reading calls the equal split “an ancient custom, which was traced to the action of David” (“as his part is that goeth down to the battle, so shall his part be that tarrieth by the stuff,” [[1 Sam. 30:24]]). The soldiers gave one in five hundred, which went to Eleazar the priest (verses 28–29); the congregation gave one in fifty, which went to the Levites (verse 30). The same reading notes that “such a tax is not mentioned elsewhere in the O.T.,” though it may, like the even split, have had an old custom behind it.

      Another older reading takes the priests' share to be “in all probability for the maintenance of the priests, in the same manner as the tithes.” The figures (verses 32–47) are worked out to the head: 675 sheep for the LORD from 337,500, and 6,750 for the Levites from the same number. The large numbers in Numbers are discussed at [[Ex. 12:37]].
    sources: [cambridge-numbers, keil-numbers, lds-scriptures]

  - ref: 50
    phrase: to make an atonement for our souls before the LORD
    kind: history
    title: Gold for not one man lost
    body: |
      The officers brought their gold because they had counted the army and found that “there lacketh not one man of us” (verse 49). The text does not say what they were atoning for. One older reading takes the gift as thanks: they “felt constrained to give a practical expression to their gratitude for this miraculous preservation of the whole of the men,” and offered it “with the feeling that they were not worthy of any such grace.” The same reading calls the safe return of every man “a striking proof of the protection of God.”

      The gold went into the tabernacle “for a memorial for the children of Israel before the LORD” (verse 54), and the same reading compares the census ransom ([[Ex. 30:16]]); how gold and silver could “make an atonement” without blood is explained at [[Ex. 30:12]].
    sources: [keil-numbers, lds-scriptures]

christ: |
  The LORD who commanded this war is Jehovah, the premortal Christ (see [[Ex. 3:14]]), who has always been perfectly just and merciful, even where what He commanded is hard to understand.

  The war on Midian gives a disciple no warrant for violence today. Where a passage like this is not yet understood, God can still be trusted, for all He does is meant to bless His children and bring them back to Him.

