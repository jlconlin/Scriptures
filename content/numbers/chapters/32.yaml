chapter: 32
title: Shall Ye Sit Here?
tagline: Reuben and Gad ask for the cattle country east of the Jordan; Moses hears the refusal at Kadesh again, and the land is given on a promise to fight beside their brethren.
when: 'On the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Numbers 32 comes after the war on Midian (chapter 31) and before the crossing of the Jordan. The land the two tribes ask for is the country Israel had just taken from the Amorite kings Sihon and Og ([[Num. 21:21–35]]), “the country which the LORD smote before the congregation of Israel” (verse 4). It is one of the closing arrangements of the months Israel spent on the plains, after Balaam, Baal-peor, the second census and Joshua's appointment.

  Gilead, the heart of the request, is “a highland district east of the Jordan,” “well wooded and crossed by deep glens that descend toward Jordan.” Moses retells the agreement before his death, in [[Deut. 3:12–20]], and the book of Joshua tells how it was kept: the eastern tribes crossed armed before their brethren ([[Josh. 4:12]]), and when the land was won Joshua sent them home ([[Josh. 22:1–6]]).

thread: |
  Numbers 32 is **the refusal at Kadesh almost repeated, and this time averted.** Two tribes look at good land and ask not to cross the Jordan (verses 1–5). Moses hears in their words what the spies did a generation before: they “discouraged the heart of the children of Israel” (verse 9), and the LORD swore that the men of that generation would not see the land, “Save Caleb the son of Jephunneh the Kenezite, and Joshua the son of Nun: for they have wholly followed the LORD” (verse 12; the story is told at [[Num. 13:2]] and in chapter 14). The new generation has just been counted to replace the one that died ([[Num. 26:64–65]]), and Moses warns that it could undo the work again: “ye shall destroy all this people” (verse 15).

  The danger passes because the tribes change their request into a promise. They will build folds and cities for their families and then go armed ahead of their brethren until every tribe has its inheritance (verses 16–19). Moses accepts on terms, with blessing and warning, and binds the leaders who will divide the land after him to hold them to it (verses 20–32). The chapter ends with the land given and settled: the towns built and renamed, and the clans of Manasseh taking Gilead and its towns (verses 33–42).

sections:
  - range: 1-5
    heading: The request of Reuben and Gad
    plain: |
      The Reubenites and the Gadites had very large herds of cattle, and they saw that the land of Jazer and the land of Gilead was good country for cattle. So the Gadites and the Reubenites came to Moses, to Eleazar the priest, and to the leaders of the congregation and said: Ataroth, Dibon, Jazer, Nimrah, Heshbon, Elealeh, Shebam, Nebo and Beon, the country the LORD struck down before the congregation of Israel, is cattle country, and your servants have cattle. If we have found favor with you, they said, let this land be given to your servants as our possession, and do not take us across the Jordan.
  - range: 6-15
    heading: Moses remembers Kadesh
    plain: |
      Moses said to the Gadites and the Reubenites: Shall your brothers go to war while you sit here? Why would you discourage the Israelites from crossing into the land the LORD has given them? That is what your fathers did when I sent them from Kadesh-barnea to look at the land. They went up as far as the valley of Eshcol and saw the land, and then they discouraged the Israelites from entering the land the LORD had given them. The LORD's anger burned that day, and He swore: Not one of the men who came up out of Egypt, twenty years old and upward, will see the land I swore to give Abraham, Isaac and Jacob, because they have not followed Me wholeheartedly; none except Caleb son of Jephunneh the Kenezite and Joshua son of Nun, for they have followed the LORD wholeheartedly. The LORD's anger burned against Israel, and He made them wander in the wilderness forty years, until the whole generation that had done evil in His sight was gone. And now here you are, risen up in your fathers' place, a brood of sinners, to add still more to the LORD's fierce anger against Israel. If you turn away from following Him, He will leave this people in the wilderness again, and you will bring about the destruction of them all.
  - range: 16-27
    heading: The promise and the terms
    plain: |
      They came up to him and said: We will build sheepfolds here for our flocks and towns for our children. But we ourselves will arm and go at the head of the Israelites until we have brought them to their place, while our children live in fortified towns, safe from the people of the land. We will not come back to our homes until every Israelite has received his inheritance. We will not take an inheritance with them across the Jordan and beyond, because our inheritance has come to us here, on the east side of the Jordan. Moses said to them: If you will do this, if you will arm yourselves before the LORD for war, and all of you who are armed cross the Jordan before the LORD until He has driven His enemies out before Him, and the land is subdued before the LORD, then afterward you may come back, free of guilt before the LORD and before Israel, and this land will be your possession before the LORD. But if you will not do so, you have sinned against the LORD, and you may be sure that your sin will find you out. Build towns for your children and folds for your sheep, and do what you have promised. The Gadites and the Reubenites said to Moses: Your servants will do as my lord commands. Our children, our wives, our flocks and all our cattle will stay here in the towns of Gilead, but your servants, every man armed for war, will cross over before the LORD to battle, as my lord says.
  - range: 28-32
    heading: Moses binds the leaders to the agreement
    plain: |
      So Moses gave orders about them to Eleazar the priest, to Joshua son of Nun, and to the heads of the tribal families of Israel. Moses said to them: If the Gadites and the Reubenites, every man armed for battle, cross the Jordan with you before the LORD, and the land is subdued before you, then give them the land of Gilead as their possession. But if they will not cross over with you armed, they shall receive their possessions among you in the land of Canaan. The Gadites and the Reubenites answered: What the LORD has said to your servants, we will do. We will cross over armed before the LORD into the land of Canaan, so that the inheritance we possess will be on this side of the Jordan.
  - range: 33-42
    heading: The land given and settled
    plain: |
      So Moses gave to the Gadites, the Reubenites and the half tribe of Manasseh son of Joseph the kingdom of Sihon king of the Amorites and the kingdom of Og king of Bashan: the land with its towns and their territories, the towns of the whole country around. The Gadites built up Dibon, Ataroth, Aroer, Atroth-shophan, Jazer, Jogbehah, Beth-nimrah and Beth-haran as fortified towns, and folds for sheep. The Reubenites built up Heshbon, Elealeh, Kirjathaim, Nebo and Baal-meon (their names were changed) and Shibmah, and they gave new names to the towns they built. The descendants of Machir son of Manasseh went to Gilead, captured it, and dispossessed the Amorites who lived there. So Moses gave Gilead to Machir son of Manasseh, and he settled there. Jair son of Manasseh went and captured their villages and called them Havoth-jair. And Nobah went and captured Kenath and its villages, and called it Nobah, after his own name.

notes:
  - ref: 1
    phrase: the place was a place for cattle
    kind: history
    title: Why they wanted Gilead
    body: |
      The two tribes wanted the land because it suited what they owned: “a very great multitude of cattle.” Gilead, the highland east of the Jordan, is “well wooded and crossed by deep glens”; one older reading notes that the tribes name Jazer first, “probably because this district was especially rich in excellent pasture land,” and that ancient Gilead “still shows numerous traces of great fertility.” The land had also just been won: Sihon's fall is told in [[Num. 21:23–26]], and the same reading takes “the country which the LORD smote” (verse 4) to describe a land left “without a ruler,” which “could easily be taken possession of.” Moses grants the land in the end (verses 22, 29); his answer in verse 6 is to the last clause of the request, “bring us not over Jordan” (verse 5).
    sources: [bd-gilead, keil-numbers]

  - ref: 6
    phrase: Shall your brethren go to war, and shall ye sit here?
    kind: history
    title: Settling first while the others fight
    body: |
      Moses asks whether two tribes will settle in peace while their brethren fight for the rest of the land. “Bring us not over Jordan” could mean only that they wanted their inheritance on the east side, but Moses heard it as a wish to settle at once and leave the other tribes to conquer Canaan alone. One older reading thinks Moses heard it rightly, since “when Moses reproved them, the speakers did not reply that they had not cherished the intention attributed to them,” but only promised to help. Moses' first charge is their “want of brotherly feeling”; his second is that their example would take the heart out of the others (verse 7).

      The tribes' answer (verses 16–19) became the agreement: the men would go armed ahead of Israel and not return “until the children of Israel have inherited every man his inheritance” (verse 18). If they failed, the same reading notes, they were to lose the eastern land and be settled in Canaan with everyone else, “for the purpose of preventing a schism of the nation” (verse 30). Moses repeats the charge on the eve of the crossing ([[Deut. 3:18–20]]), and the book of Joshua records that it was kept: the eastern tribes “passed over armed before the children of Israel, as Moses spake unto them” ([[Josh. 4:12]]), and at the end Joshua told them, “Ye have not left your brethren these many days unto this day” ([[Josh. 22:3]]).
    sources: [keil-numbers, lds-scriptures]

  - ref: 14
    phrase: an increase of sinful men
    kind: words
    title: A brood in their fathers' place
    body: |
      “An increase of sinful men” calls the sons a new crop of sinners, grown up “in your fathers' stead.” The Hebrew word behind “increase,” *tarbût*, is “equivalent to a brood,” on one older reading. Moses has just told the story of Kadesh (verses 8–13), and the point is that the sons are about to do what their fathers did. His warning in verse 15 is that the cost would fall on the whole people: if they turn back from following the LORD, “He will leave it (Israel) still longer in the desert, and ye prepare destruction for all this nation.” The sentence on the fathers, which fell on those twenty and upward, is at [[Num. 14:29]].
    sources: [keil-numbers]

  - ref: 20
    phrase: if ye will go armed before the LORD to war
    kind: history
    title: Before Israel, or before the LORD
    body: |
      Moses changes one phrase in the tribes' offer, and they take up his wording. They had offered to go armed “before the children of Israel” (verse 17); Moses answers with “before the LORD” five times in three verses (verses 20–22). One older reading explains the phrase from Israel's wars: in a war fought at God's command “the Israelites were the army of Jehovah, with Jehovah in the midst,” and the ark went with them, as it had not when the people pressed into Canaan on their own after Kadesh ([[Num. 14:44]]). On that reading the tribes had promised only to help their brethren. They take up Moses' words in verse 27 (“before the LORD to battle”) and again in verse 32, where, the same reading notes, they “adopt the expression, after hearing it from the mouth of Moses.” The land too is to be theirs “before the LORD” (verse 22), which the same reading takes to mean “according to the judgment of Jehovah, with divine approval.”
    sources: [keil-numbers]

  - ref: 23
    phrase: be sure your sin will find you out
    kind: words
    title: Your sin will find you
    body: |
      The line that became a proverb is, in context, a warning about a broken promise: “if ye will not do so,” that is, if the tribes did not cross and fight, they would have sinned against the LORD. The Hebrew reads literally “know your sin, that it will find you,” and the rendering “has passed, as a proverbial expression, into our current language.” One older reading explains the image as sin with “an individual existence,” like a curse: “The sinner cannot escape its consequences; it will search and find him wherever he may hide himself,” as at Genesis 4:7, “sin lieth at the door” ([[Gen. 4:7]]). Another older reading takes “find” to mean that the sin will “overtake” or “smite” them, so that they “will have to make atonement for” it. In the chapter the sin would be the failure to do “that which hath proceeded out of your mouth” (verse 24).
    sources: [cambridge-numbers, keil-numbers]

  - ref: 34
    phrase: the children of Gad built Dibon, and Ataroth
    kind: history
    title: Ataroth and the Moabite Stone
    body: |
      Ataroth, one of the towns the Gadites built up, appears again in an inscription from Israel's neighbor Moab. The stela of Mesha, king of Moab, “also known as the Moabite Stone (ninth century BC),” records his war against the northern kingdom of Israel ([[2 Kgs. 3:4–5]]). In it Mesha says: “The people of Gad had settled in Ataroth from of old, and the king of Israel built up Ataroth for him,” and then that he took the city and killed its people. Verse 34's report of Gad building Ataroth may offer “an additional Israelite connection to the story of Mesha.” The site, modern Ataruz, “has been equated with the biblical city of Ataroth, built by the tribe of Gad.”
    sources: [calabro-herem, schade-ataruz]

  - ref: 38
    phrase: (their names being changed,)
    kind: history
    title: Why the names were changed
    body: |
      The text says the Reubenites renamed the towns but does not say why. One older reading reports the view that the parenthesis is a marginal note telling the reader to say the names otherwise than they are written. It refers to Nebo and Baal-meon, and “Both Nebo and Baal suggested pagan worship”: Nebo was also the name of a “Babylonian god of wisdom,” the Nebo of [[Isa. 46:1]], and names with Baal in them were “frequently altered,” as Ish-bosheth and Mephi-bosheth stand for Ish-baal and Merib-baal. Another older reading takes the phrase as the text's report of what the builders did: “they built the towns with an alteration of their names.” The text gives neither the reason nor the new names, and both explanations are proposals.
    sources: [cambridge-numbers, bd-nebo, keil-numbers]

  - ref: 39
    phrase: the children of Machir the son of Manasseh went to Gilead
    kind: history
    title: Half of Manasseh, and the towns of Jair
    body: |
      Half the tribe of Manasseh enters the chapter only at verse 33, without having made a request; verses 39–42 then tell what its clans had taken. Machir's descendants took Gilead from the Amorites, Jair took villages and called them Havoth-jair, and Nobah took Kenath. One older reading joins the gift to the conquest: “Moses gave the Manassites the land which was conquered by them,” the kingdom of Bashan and the northern half of Gilead. The text itself gives no other reason.

      *Havoth-jair* means “tent-villages of Jair,” *ḥawwōt* being a “tent-village.” A later Jair of Gilead judged Israel, and his thirty sons had thirty cities “which are called Havoth-jair unto this day” ([[Judg. 10:3–4]]); one older reading takes this later Jair to be of the same clan. Moses' retelling places Jair's conquest in Argob of Bashan ([[Deut. 3:14]]), a region of cities “fenced with high walls” ([[Deut. 3:4–5]]); one older reading finds a region of walled cities “not in agreement” with a clan that “dwelt in tent villages.”
    sources: [keil-numbers, cambridge-numbers, bdb, lds-scriptures]

christ: |
  The LORD whose oath Moses recalls (verses 10–12) is Jehovah, the premortal Christ (see [[Ex. 3:14]]); Paul says of the wilderness generation that “they drank of that spiritual Rock that followed them: and that Rock was Christ” ([[1 Cor. 10:4]]). The two men He excepted from the sentence, Caleb and Joshua, had “wholly followed the LORD” (verse 12), and the eastern tribes received their land on condition that they go over “before the LORD” until their brethren had their inheritance too.

  Those who come into the fold of God now covenant to be “willing to bear one another's burdens, that they may be light” ([[Mosiah 18:8]]). That covenant binds a disciple whose own inheritance is secure to the brethren whose burdens remain.

explore: |
  - **The agreement kept.** Joshua's charge to the eastern tribes before the crossing, [[Josh. 1:12–18]], and the altar of witness they built on the way home, [[Josh. 22:10–34]].
  - **The refusal Moses remembers.** [[Num. 13:25–33]]; [[Num. 14:20–35]].

parallels:
  - ref: Deut. 3:12–20
    note: Moses retells the gift of the eastern land and repeats the charge to cross armed before their brethren.
  - ref: Josh. 13:8–32
    note: The inheritance of Reuben, Gad and half Manasseh east of the Jordan, town by town.
  - ref: Josh. 22:1–6
    note: Joshua dismisses the eastern tribes with a blessing, their promise kept.

