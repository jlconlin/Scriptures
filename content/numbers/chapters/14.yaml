chapter: 14
title: The Refusal at Kadesh
tagline: The people weep through the night and talk of choosing a captain to lead them back to Egypt. Moses pleads for them, and the LORD pardons, but He swears that the generation that would not go up will die in the wilderness. The next morning the people go up anyway, without the ark, and are beaten back to Hormah.
when: 'At Kadesh in the wilderness of Paran, in the second year after the Exodus ([[Num. 10:11–12]]; [[Num. 13:26]]).'

setting: |
  The chapter is the people's answer to the spies' report of chapter 13, given in the same camp at Kadesh. After Mount Sinai, Kadesh, or Kadesh-barnea, was the next place where Israel stayed for a long time. The years near Kadesh became a “spiritual incubator” in which a new generation could grow up, and in those years most of the adults who had left Egypt died. The sentence that makes that happen is spoken in verses 26–35, and the second census, on the plains of Moab, records that it was carried out ([[Num. 26:64–65]]).

  Later scripture keeps coming back to this day. Moses retells it to the next generation ([[Deut. 1:26–46]]). Psalms 95 and 106 sing it as a warning ([[Ps. 95:8–11]]; [[Ps. 106:24–27]]), and Hebrews preaches from Psalm 95 that “they could not enter in because of unbelief” ([[Heb. 3:19]]). Jacob and Alma use it in the Book of Mormon ([[Jacob 1:7–8]]; [[Alma 12:36–37]]). It is one of the wilderness “provocations”: at Kadesh, as at Massah and Meribah, Israel “refused the grace of the Lord.”

thread: |
  Again and again the chapter gives the people their own words back. On the first night they say, “would God we had died in this wilderness!” and they fear that their “wives and … children should be a prey” (verses 2–3). The LORD's sentence answers both. “As ye have spoken in mine ears, so will I do to you” (verse 28): their carcases will fall in this wilderness, and the little ones “which ye said should be a prey” will be the ones brought in (verse 31).

  Between the complaint and the sentence stands Moses. The LORD offers him what He offered after the golden calf, a new nation from Moses in place of this one (verse 12), and Moses refuses it again. He pleads instead the LORD's honour among the nations and the name He proclaimed at Sinai (verses 13–19). The answer has two halves: “I have pardoned according to thy word: But as truly as I live” (verses 20–21). Israel is not destroyed, but the generation that refused will not see the land; only Caleb and Joshua are excepted.

  The last scene turns the refusal inside out. The people who would not go up when commanded now go up when forbidden, without the ark and without Moses, and are routed (verses 40–45).

sections:
  - range: 1-4
    heading: A night of weeping
    plain: |
      The whole congregation cried out aloud, and the people wept that night. All the Israelites complained against Moses and Aaron. “If only we had died in Egypt,” the whole congregation said to them, “or in this wilderness! Why is the LORD bringing us into this land to die by the sword? Our wives and our children will be taken as plunder. Wouldn't it be better for us to go back to Egypt?” And they said to one another, “Let's choose a leader and go back to Egypt.”
  - range: 5-10
    heading: Joshua and Caleb plead
    plain: |
      Moses and Aaron fell face down before the whole assembly of Israel. Joshua son of Nun and Caleb son of Jephunneh, two of the men who had explored the land, tore their clothes and said to all the Israelites, “The land we passed through and explored is an exceedingly good land. If the LORD is pleased with us, He will bring us into it and give it to us, a land flowing with milk and honey. Only do not rebel against the LORD, and do not be afraid of the people of the land. We will devour them like bread. Their protection has left them, and the LORD is with us. Do not be afraid of them.”

      But the whole congregation said they should be stoned. Then the glory of the LORD appeared at the tabernacle of the congregation to all the Israelites.
  - range: 11-12
    heading: The LORD's offer
    plain: |
      The LORD said to Moses, “How long will this people keep provoking Me? How long will they refuse to believe Me, after all the signs I have done among them? I will strike them with a plague and disinherit them, and I will make you into a nation greater and stronger than they are.”
  - range: 13-19
    heading: Moses pleads for the people
    plain: |
      Moses said to the LORD, “Then the Egyptians will hear of it, for You brought this people up out of their land by Your power, and they will tell the people who live in this land. They have heard that You, LORD, are among this people, that You, LORD, are seen face to face, that Your cloud stands over them, and that You go before them in a pillar of cloud by day and a pillar of fire by night. If You kill this whole people at one stroke, the nations who have heard of Your fame will say, ‘The LORD was not able to bring this people into the land He swore to give them, so He killed them in the wilderness.’

      “Now, I pray You, let the power of my Lord be shown to be great, as You have said: ‘The LORD is slow to anger and abounding in mercy, forgiving iniquity and transgression, yet by no means clearing the guilty, visiting the iniquity of the fathers on the children to the third and fourth generation.’ Pardon the iniquity of this people, I pray You, according to the greatness of Your mercy, as You have forgiven this people from Egypt until now.”
  - range: 20-25
    heading: Pardoned, but sworn out of the land
    plain: |
      The LORD said, “I have pardoned them, as you asked. But as surely as I live, all the earth will be filled with the glory of the LORD; and not one of the men who have seen My glory and the miracles I did in Egypt and in the wilderness, and who have tested Me these ten times and have not listened to My voice, will see the land I swore to give their fathers. None of those who provoked Me will see it. But My servant Caleb, because he has a different spirit and has followed Me completely, I will bring into the land he went to, and his descendants will possess it. (The Amalekites and the Canaanites live in the valley.) Tomorrow turn back and set out into the wilderness by the road to the Red Sea.”
  - range: 26-35
    heading: The sentence
    plain: |
      The LORD said to Moses and Aaron, “How long must I put up with this wicked congregation that complains against Me? I have heard the complaints the Israelites make against Me. Tell them, ‘As surely as I live, says the LORD, I will do to you exactly what I heard you say. Your dead bodies will fall in this wilderness, every one of you who was counted in the census from twenty years old and up, who has complained against Me. Not one of you will enter the land I swore to settle you in, except Caleb son of Jephunneh and Joshua son of Nun. But your little ones, who you said would be plunder, I will bring in, and they will know the land you have rejected. As for you, your dead bodies will fall in this wilderness. Your children will be shepherds in the wilderness for forty years and will bear the consequences of your unfaithfulness, until the last of your bodies lies in the wilderness. You explored the land for forty days; for each day you will bear your iniquity a year, forty years, and you will know what it is to have Me against you.’ I, the LORD, have spoken. I will surely do this to all this wicked congregation that has gathered together against Me. In this wilderness they will come to their end, and there they will die.”
  - range: 36-38
    heading: The ten die
    plain: |
      The men Moses had sent to explore the land came back and made the whole congregation complain against him by spreading a slander about the land. Those men, who brought the evil report, died of a plague before the LORD. Of the men who went to explore the land, only Joshua son of Nun and Caleb son of Jephunneh survived.
  - range: 39-45
    heading: Too late
    plain: |
      When Moses told all the Israelites these words, the people mourned greatly. Early the next morning they went up toward the top of the mountain, saying, “Here we are. We will go up to the place the LORD promised, for we have sinned.”

      But Moses said, “Why are you disobeying the LORD's command? It will not succeed. Do not go up, because the LORD is not among you, and you will be struck down by your enemies. The Amalekites and the Canaanites are there ahead of you, and you will fall by the sword. Because you have turned away from following the LORD, the LORD will not be with you.”

      Still they presumed to go up to the hilltop, though neither the ark of the covenant of the LORD nor Moses left the camp. Then the Amalekites and the Canaanites who lived in that hill country came down, struck them, and beat them back as far as Hormah.

notes:
  - ref: 4
    phrase: Let us make a captain, and let us return into Egypt
    kind: history
    title: A head of their own
    body: |
      The people propose to replace the leader the LORD gave them with one of their own choosing. “Captain” is the Hebrew *rōʾš*, “head,” the word for the “heads of the children of Israel” whom Moses sent as spies at the LORD's command ([[Num. 13:3]]). On one Latter-day Saint reading the people are imitating the prophet: Moses had been told to choose heads, and “the people have taken it upon themselves to choose one person to be their head.”
    sources: [oshb-wlc, ot-minute-num]

  - ref: 9
    phrase: 'they are bread for us: their defence is departed from them'
    kind: words
    title: Bread for us, and their shade gone
    body: |
      Joshua and Caleb say that Israel will overcome the people of the land as easily as eating bread. A modern translation has “they are no more than bread for us.”

      “Defence” is in Hebrew *ṣēl*, “shadow, shade,” used of shade “as protection (from sun)” and so of “protection, defence.” Here the protection is the LORD's, as in “shall abide under the shadow of the Almighty” ([[Ps. 91:1]]). A modern translation has “their protection is removed from them.” The sentence turns on two clauses: their shade is gone from them, “and the LORD is with us.”
    sources: [nrsvue, bdb]

  - ref: 13
    phrase: Then the Egyptians shall hear it
    kind: scripture
    title: What Moses pleads this time
    body: |
      Moses refuses again the offer he refused after the golden calf, a new nation from him (the note at [[Ex. 32:10]]). What is new in his prayer this time, on one older reading, is that he pleaded “the honour of God among the heathen, and the glorious revelation of the divine nature” given at Sinai.

      Moses' first argument is the report that has gone out: Egypt and the peoples of Canaan have heard that the LORD is among Israel and “seen face to face,” literally “eye to eye,” that is, “in the closest proximity” (the phrase is also discussed at [[Isa. 52:8]]). If Israel died in the wilderness, they would say the LORD “was not able” (verse 16). On that reading God “would be regarded by the heathen as powerless,” and the same concern for His name later kept Israel from perishing in exile ([[Ezek. 36:22]]).

      His second argument is the name proclaimed to Moses on the mountain, which he quotes back in part, calling on the LORD's mercy “as their intercessor” (verses 17–18; the name itself is explained at [[Ex. 34:6]]). “Let the power of my Lord be great” then asks for power of a particular kind. On the same reading the words mean “show Thyself mighty by verifying Thy word,” and they go with what follows: Moses asks the LORD to show His power by keeping that word of mercy and forgiving the people.
    sources: [keil-numbers, ot-minute-num, lds-scriptures]

  - ref: 20
    phrase: I have pardoned according to thy word
    kind: scripture
    title: Pardoned, and still sworn out of the land
    body: |
      The LORD grants what Moses asked and still swears that the generation will not enter the land, and the two halves are joined by “But” (verse 21). The people are not destroyed, but “neither shall any of them that provoked me see it” ([[Num. 14:23]]). Pardon “does not come without consequences,” and the name Moses quoted had said so itself: forgiving iniquity, “and by no means clearing the guilty” (verse 18; on that line see [[Ex. 34:7]]). On one older reading the forgiveness here is “the preservation of the nation, but not the remission of the well-merited punishment.”

      The oath “as truly as I live, all the earth shall be filled with the glory of the LORD” (verse 21) does not threaten the world. On the same older reading the LORD swears that He lives by what His glory will do: “notwithstanding the sin and opposition of these men, He would still carry out His work of salvation to a glorious victory.” On the “ten times” of verse 22, see [[Gen. 31:7]].
    sources: [ot-minute-num, keil-numbers, scripture-helps-num, lds-scriptures]

  - ref: 28
    phrase: as ye have spoken in mine ears, so will I do to you
    kind: history
    title: Taken at their word
    body: |
      The sentence is built from what the people had said: a modern translation renders the verse “I will do to you the very things I heard you say,” and the thread above sets the two wishes beside their answers (verses 2–3, 29, 31). They “had said that it would be better to die in the wilderness than to attempt such a difficult task of conquering the land,” and the Lord “took them at their word.” On another Latter-day Saint reading this is what makes the judgment just. It “was not a whimsical act of God to keep the Israelites in the desert”; it was “the fulfillment of their own words.” Moses' retelling gives the reversal about the children again ([[Deut. 1:39]]; see the note at [[Deut. 1:27]]).
    sources: [nrsvue, wilcox-spies, ot-minute-num]

  - ref: 33
    phrase: your children shall wander in the wilderness forty years
    kind: history
    title: Forty years, a year for each day
    body: |
      The sentence falls on the men counted at Sinai, those twenty years old and upward (verse 29), the age at which they were numbered for war ([[Num. 1:3]]). Only Caleb and Joshua are excepted (verse 30), and when the people are counted again on the plains of Moab, not a man of the first count is left but those two ([[Num. 26:64–65]]).

      “Wander” translates a Hebrew participle, *rōʿîm*, from the verb for tending flocks, and a modern translation has “your children shall be shepherds in the wilderness for forty years.” The same translation renders “bear your whoredoms” as “suffer for your faithlessness.” On one Latter-day Saint reading the children are innocent, the little ones of verse 31, “kept safe but would not escape the memory or residual effects of the sins of their parents.”

      The forty years are measured by the spies' journey, “each day for a year” (verse 34). Moses later counts thirty-eight years from Kadesh-barnea to the brook Zered (see the note at [[Deut. 2:14]]). Ezekiel's sign of bearing iniquity uses the same words, “each day for a year” ([[Ezek. 4:6]]; see the note at [[Ezek. 4:4]]).
    sources: [ot-minute-num, oshb-wlc, nrsvue, lds-scriptures]

  - ref: 34
    phrase: ye shall know my breach of promise
    kind: words
    title: Not a broken promise but God's opposition
    body: |
      The King James phrase “breach of promise” does not mean that the LORD broke His word. The Hebrew noun *tĕnûʾâ* means “opposition,” and here it is “my opposition,” the LORD's.

      The promise of the land itself stands, for the children will enter it (verse 31). What this generation will know in the wilderness is the LORD's opposition.
    sources: [bdb]

  - ref: 44
    phrase: But they presumed to go up unto the hill top
    kind: history
    title: Too late, and without the ark
    body: |
      The next morning the people confess, “we have sinned,” and go up anyway, against the LORD's word. The attempt fails because the LORD does not go with them. On one Latter-day Saint reading they climb the mountain Moses had sent the spies into ([[Num. 13:17]]): “They acknowledge their sin; nevertheless, it is too late.” The command to go up had been replaced by the command to turn back (verse 25), and Moses warns them that this is now the transgression (verses 41–43). The ark of the covenant and Moses stay in the camp (verse 44), as Moses had warned, “the LORD is not among you” (verse 42; see the note at [[Deut. 1:42]]).

      One older reading finds the same unbelief on both days. First they refused “through their unbelief in the might of the promise of God,” and now, “through unbelief in the severity of the judgment of God,” they go up by their own power. The same reading explains the parenthesis of verse 25: the Amalekites ranged the valley and the Negeb, “whilst the Canaanites really dwelt upon the mountains.” In verse 45 the two peoples come down on Israel together and drive it back to Hormah (the name is discussed at [[Num. 21:3]]).
    sources: [ot-minute-num, keil-numbers, lds-scriptures]

christ: |
  The LORD whose glory appears at the tabernacle and who swears “as truly as I live” is Jehovah, the premortal Christ (see [[Ex. 3:14]]). Moses, who stands between Him and a people ready to stone their faithful witnesses, pleads here “in his role as a mediator, and as a similitude of the Savior,” and his intercession is like “Jesus Christ's intercession for us.” Hebrews says of Christ that “he ever liveth to make intercession for them” ([[Heb. 7:25]]); the steps of Moses' mediation are traced in [Moses the Mediator](/exodus/themes/moses-the-mediator/).

  The rest that this generation refused is the rest Jacob labored to persuade his people to enter: to “come unto Christ, and partake of the goodness of God, that they might enter into his rest” ([[Jacob 1:7]]); what that rest is, in modern revelation, is the note at [[Ps. 95:11]]. Hebrews makes the warning present to every disciple: the invitation is “To day” ([[Heb. 3:15]]). The people at Kadesh refused the invitation on the day it was given, and could not take it up the next morning on their own terms (verses 40–45).

explore: |
  - **Moses' retelling.** [[Deut. 1:26–46]], beside verses 1–45.
  - **The day sung and preached.** [[Ps. 95:7–11]], [[Ps. 106:24–27]], [[Heb. 3:7–19]] and [[Heb. 4:1–11]].
  - **The Book of Mormon's use of it.** [[Jacob 1:7–8]] and [[Alma 12:33–37]].
  - **The provocations together.** [“The Provocation in the Wilderness and the Rejection of Grace”](https://rsc.byu.edu/sperry-symposium-classics-old-testament/provocation-wilderness-rejection-grace), reads Kadesh beside Sinai and Meribah.

parallels:
  - ref: Deut. 1:29–46
    note: Moses retells the people's refusal, the LORD's oath, and the defeat at Hormah.

sources: [lds-scriptures, pike-balaam, thomas-provocation, keil-numbers, wilcox-spies, oshb-wlc, ot-minute-num, nrsvue, bdb, scripture-helps-num]
