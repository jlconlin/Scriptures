chapter: 24
title: A Star out of Jacob
tagline: Balaam stops looking for omens, the Spirit of God comes upon him, and the man hired to curse Israel blesses it a third time, then sees a Star and a Sceptre rise out of Jacob.
when: 'On the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Israel is camped on the plains of Moab, across the Jordan from Jericho ([[Num. 22:1]]). Balak, king of Moab, has hired Balaam to curse the people, and twice already the curse has come out of Balaam's mouth as a blessing (chapter 23). Who Balaam was, and how the story of him and his ass begins, is told at [[Num. 22:5]]. Now Balak takes him to a third height, Peor, and the altars and offerings are made once more ([[Num. 23:27–30]]); the Balaam story is full of threes.

  This chapter holds the last two of Balaam's oracles and three short sayings after the fourth. They are old poetry, written in Archaic Biblical Hebrew, the oldest stage of the language, and likely dating “from 1000 BC at the latest.” Later scripture remembers the outcome more than the man: the LORD “would not hearken unto Balaam” but “turned the curse into a blessing” ([[Deut. 23:5]]; [[Josh. 24:9–10]]; [[Neh. 13:2]]), and Micah asks Israel to remember what Balaam answered Balak ([[Micah 6:5]]). The New Testament remembers his greed and his counsel ([[2 Pet. 2:15]]; [[Jude 1:11]]; [[Rev. 2:14]]).

thread: |
  **What the LORD has blessed, no one can curse,** and this chapter says so twice more than chapter 23 did. Balaam stops looking for omens; the Spirit of God comes upon him, and he blesses Israel a third time (verses 1–9). In one reading this third oracle is “the climactic one”: in the first, God alone decides blessing and curse ([[Num. 23:8]]); in the second ([[Num. 23:20]]), that His blessing “cannot be revoked”; in the third, those who bless or curse Israel “will themselves be blessed or cursed” (verse 9).

  Balak strikes his hands together and sends Balaam home without the honor he had promised him (verses 10–11). Balaam answers with a fourth oracle, and the man hired to curse Israel ends by cursing Balak's own people: a Star and a Sceptre will rise out of Israel and smite Moab (verses 15–19). Three short sayings follow, on Amalek, on the Kenites, and on Asshur and the ships of Chittim; one older reading counts this last prophecy as four, each opening “he took up his parable” (verses 15, 20, 21, 23), the first on Moab and Edom. The chapter ends quietly: Balaam “returned to his place” (verse 25). He did not stay there. He is next heard of among the Midianites, giving the counsel that led Israel into sin at Peor, and he died by the sword ([[Num. 31:8]]; [[Num. 31:16]]); his two portraits are set side by side at [[Num. 31:16]].

sections:
  - range: 1-9
    heading: The third blessing
    plain: |
      When Balaam saw that it pleased the LORD to bless Israel, he did not go, as the other times, to look for omens, but he turned his face toward the wilderness. Balaam looked up and saw Israel camped tribe by tribe, and the Spirit of God came upon him. He spoke his oracle: This is the word of Balaam son of Beor, the word of the man whose eye is opened, the word of one who hears the words of God and sees the vision of the Almighty, falling into a trance, but with his eyes open: How fair are your tents, O Jacob, your encampments, O Israel! They spread out like valleys, like gardens beside a river, like aloes the LORD has planted, like cedars beside the waters. Water will flow from his buckets, and his seed will be by many waters. His king will be higher than Agag, and his kingdom will be exalted. God brought him out of Egypt; he has strength like a wild ox's (the King James “unicorn”). He will devour the nations that are his enemies, break their bones, and pierce them with his arrows. He crouched and lay down like a lion, like a great lion: who dares rouse him? Blessed is everyone who blesses you, and cursed is everyone who curses you.
  - range: 10-14
    heading: Balak's anger
    plain: |
      Balak was furious with Balaam, and he struck his hands together. He said to Balaam: I called you to curse my enemies, and look, you have done nothing but bless them, these three times. Now get back to your own place. I meant to reward you with great honor, but the LORD has kept you from honor. Balaam answered Balak: Did I not tell your messengers, If Balak gave me his house full of silver and gold, I could not go beyond the LORD's command, to do good or bad of my own will; what the LORD says, that is what I will say? Now I am going back to my people. Come, I will tell you what this people will do to your people in the days to come.
  - range: 15-19
    heading: The Star and the Sceptre
    plain: |
      He spoke his oracle: This is the word of Balaam son of Beor, the word of the man whose eye is opened, the word of one who hears the words of God and knows the knowledge of the Most High, who sees the vision of the Almighty, falling into a trance, but with his eyes open: I see him, but not now; I behold him, but not near. A Star will come out of Jacob, and a Sceptre will rise out of Israel. It will crush the borderlands of Moab and destroy all the sons of Sheth. Edom will be taken as a possession, Seir too will be taken by its enemies, while Israel does valiantly. One out of Jacob will rule, and he will destroy the survivors of the city.
  - range: 20-25
    heading: Amalek, the Kenites, and Asshur
    plain: |
      Then he looked at Amalek and spoke his oracle: Amalek was first among the nations, but his end will be destruction forever. He looked at the Kenites and spoke his oracle: Your dwelling place is strong; your nest is set in the rock. Yet the Kenite will be laid waste, until Asshur carries you away captive. Then he spoke his oracle: Alas, who will live when God does this? Ships will come from the coast of Chittim; they will afflict Asshur and afflict Eber, and he too will perish forever. Then Balaam got up and went back to his place, and Balak also went his way.

notes:
  - ref: 2
    phrase: the spirit of God came upon him
    kind: history
    title: The Spirit instead of omens
    body: |
      Balaam's third oracle comes in a new way: he gives up the diviner's methods, and the Spirit of God comes upon him. Until now he had worked as diviners did. The altars and sacrifices Balak provided, the climb to high places, and the search for omens (“enchantments,” verse 1) “can all be interpreted as part of his divinatory activities.” Balak wanted more than a forecast. “Cursing is different from just divining the future; cursing involves manipulating the future against an adversary.” Seeing that the LORD meant to bless Israel, Balaam stops trying.

      The text marks the change. Of the first two oracles it said “the LORD put a word in Balaam's mouth” ([[Num. 23:5]]; [[Num. 23:16]]); of this one, that “the spirit of God came upon him.” Numbers never calls Balaam a prophet; what he was is taken up at [[Num. 22:18]]. Readers who do call him one rest the title in part on this verse. Latter-day Saints have a reason not to be surprised that the LORD would speak through a man from outside Israel: Moses received the priesthood from Jethro, his Midianite father-in-law ([[D&C 84:6]]), and so Latter-day Saints “are open to understanding how Jehovah had worked through other non-Israelites.”
    sources: [pike-balaam]

  - ref: 3
    phrase: the man whose eyes are open
    kind: words
    title: Eyes open, or eyes closed?
    body: |
      The Hebrew word *shetum*, which the King James renders “open,” is found only here and in verse 15, and its meaning is uncertain: it may mean the eye is opened or that it is closed. The verb is “dubious”; some read “the man opened of [mental] eye,” others “closed of [bodily] eye.” With “closed,” the picture is “eyes closed in a trance”; with “opened,” it is “the eyes of the mind opened to receive the vision.” One older reading holds both at once: the outer eye shut while the inner one opens.

      Either way, the line is the language of seership, and it comes after the seer could not see the angel his ass saw ([[Num. 22:28]]): in this story “prophetic pronouncements come via divine not human inclination.”
    sources: [bdb, cambridge-numbers, keil-numbers, pike-balaam]

  - ref: 7
    phrase: his king shall be higher than Agag
    kind: history
    title: Higher than Agag
    body: |
      Agag is the name of the Amalekite king Saul later captured ([[1 Sam. 15:8]]), and how Balaam could name him is not settled. One older reading takes Agag as the title of every Amalekite king, “just as all the Egyptian kings had the common name of Pharaoh.” Another older reading notes the plain alternative: “If Agag is the man who was captured by Saul, the present poem must be at least as late as the monarchy.” The Greek translation known as the Septuagint and the Samaritan text read “Gog” instead, and the same commentary concludes that “the passage is at present an unsolved problem.” The line's sense does not depend on the answer: Israel's king will be greater than the king of the people who first made war on Israel (see the note at verse 20).
    sources: [keil-numbers, cambridge-numbers, lds-scriptures]

  - ref: 9
    phrase: Blessed is he that blesseth thee, and cursed is he that curseth thee
    kind: scripture
    title: The promise to Abraham, in a stranger’s mouth
    body: |
      The third oracle ends with the promise God made to Abraham, spoken now by the man hired to curse his children. The LORD had told Abraham, “I will bless them that bless thee, and curse him that curseth thee” ([[Gen. 12:3]]), and the oracle closes “with language reminiscent of the Abrahamic covenant.” That promise is why the curse could not be laid. “Based on the promise in Genesis 12:2–3, the Israelites' God did not permit others to curse them collectively (although he obviously allowed them to bring curses upon themselves).”

      The lion of the lines just before returns from the second oracle, where its words from Jacob's blessing of Judah are treated ([[Num. 23:24]]).
    sources: [pike-balaam]

  - ref: 11
    phrase: the LORD hath kept thee back from honour
    kind: prophets
    title: Kept back from honour
    body: |
      Balak's taunt is the line of this story a modern apostle has taught from in general conference, as a lesson about the honors of the world. Balak had promised Balaam great honor for a curse ([[Num. 22:17]]); he now says the LORD has cost him that reward, and Balaam can only repeat what he told the messengers at the start, that silver and gold could not move him beyond the LORD's command (verse 13; [[Num. 22:18]]). In October 2000 Elder Neal A. Maxwell took the verse in a direction Balak did not intend: “Actually, discipleship may keep the honors of the world from us,” and he added, “The rouge of recognition is so easily smeared anyway.”
    sources: [maxwell-tugs, pike-balaam, ot-minute-num]

  - ref: 17
    phrase: there shall come a Star out of Jacob, and a Sceptre shall rise out of Israel
    kind: christ
    title: A Star out of Jacob
    body: |
      This verse is a prophecy of the Messiah, and Elder Bruce R. McConkie called it Balaam's “great Messianic prophecy,” given “while the Spirit still rested upon him.” The star and the sceptre are both images of a ruler: one older reading calls the star “so natural an image and symbol of imperial greatness” that the parallel sceptre removes any doubt, and the sceptre is the emblem of rule from Jacob's blessing of Judah ([[Gen. 49:10]]). What the King James calls “the latter days” in verse 14 is the Hebrew phrase of [[Gen. 49:1]], explained there.

      The oracle has a nearer horizon as well: it prophesies Israel's rule over Moab and Edom (verses 17–18), and in one older reading its fulfillment “commenced with the subjugation of the Edomites by David.” David struck Moab and put garrisons in Edom ([[2 Sam. 8:2]]; [[2 Sam. 8:14]]). Some Jews read the verse as messianic as early as the last centuries BC. At Qumran, the community of the Dead Sea Scrolls took the star as a priestly messiah and the sceptre as a royal one; in the second century AD the leader of the second Jewish revolt against Rome was called Bar Kokhba, “son of the star.” Christians have read David as a partial fulfillment and Jesus Christ as the full one, the priestly and royal Messiah of [[Rev. 22:16]]. One older reading agrees that the prophecy “cannot have received its complete fulfilment in the victories of David” and waits for “the future overthrow of all the enemies of the kingdom of God.” Jeremiah's use of this verse against Moab is treated at [[Jer. 48:45]].

      The theme page [Seek Not after Your Own Eyes](/numbers/themes/seek-not-after-your-own-eyes/) sets Balaam's opened eyes among the sights the LORD gives in Numbers.
    sources: [lds-scriptures, mcconkie-balaam, keil-numbers, pike-balaam]

  - ref: 17
    phrase: destroy all the children of Sheth
    kind: words
    title: The children of Sheth
    body: |
      In one older reading “the children of Sheth” are Moab under another name, not the descendants of Adam's son Seth. That reading points out that the human race “is never called by the name of Seth,” and that a ruler who destroyed all mankind would make no sense here. It takes *sheth* as a form of a word for tumult, so that “all the sons of confusion” stands beside Moab the way Israel stands beside Jacob and Seir beside Edom; and it notes that Jeremiah, quoting this verse, has “the tumultuous ones” ([[Jer. 48:45]]). A modern translation simply keeps the name: “the territory of all the Shethites.” On that reading the line is parallel to “the corners of Moab” and names the same enemy.
    sources: [keil-numbers, pike-balaam, lds-scriptures]

  - ref: 20
    phrase: Amalek was the first of the nations
    kind: history
    title: Amalek, the Kenites, and the ships of Chittim
    body: |
      The last sayings move outward from Moab to Israel's other neighbors and then to empires. In one older reading Amalek is “the first of the nations” not for its size but as “the first heathen nation which opened the conflict … against Israel” at Rephidim ([[Ex. 17:8]]; the sentence passed on Amalek there is treated at [[Ex. 17:14]]); its end is destruction. The Kenites “were friends and relatives of Moses”; Judges names their forebear “the Kenite, Moses' father in law” ([[Judg. 1:16]]). Saul later spared them for the kindness they showed Israel ([[1 Sam. 15:6]]); yet their nest set in the rock will not save them from Asshur. Last, “Chittim is the island of Cyprus,” whose ships will afflict Asshur and Eber; who Eber is “has been debated.” One older reading holds that this last overthrow of the world's powers, of which Daniel later received revelation ([[Dan. 11:30]]), belongs to the end of days.
    sources: [keil-numbers, ot-minute-num, lds-scriptures]

christ: |
  The LORD who would not let Israel be cursed is Jehovah, the premortal Christ (see [[Ex. 3:14]]), and the Star Balaam saw “not now” is Jesus Christ, who says of Himself, “I am the root and the offspring of David, and the bright and morning star” ([[Rev. 22:16]]).

  The promise to Abraham that Balaam could not reverse ([[Gen. 12:3]]) reaches those who are Christ's: “if ye be Christ's, then are ye Abraham's seed, and heirs according to the promise” ([[Gal. 3:29]]). On the plains of Moab God “did not permit others to curse them collectively,” though He allowed them “to bring curses upon themselves”; the heirs of the promise hold a blessing no one else can reverse, and only their own choices can forfeit it.

explore: |
  - **The curse turned.** [[Deut. 23:4–5]]; [[Josh. 24:9–10]]; [[Neh. 13:2]]; [[Micah 6:5]]; and Deuteronomy's theme *He Turned the Curse into a Blessing*.
  - **The lion, the sceptre and the star.** [[Gen. 49:9–10]] beside verses 9 and 17; [[Rev. 22:16]].
  - **Balaam in full.** “Balaam in the Book of Numbers” (*From Creation to Sinai*, 2021) treats Balaam's roles, the oracles, the Star, and Balaam elsewhere in scripture.

sources: [lds-scriptures, bd-balaam, pike-balaam, sc-knowhy-853, keil-numbers, bdb, cambridge-numbers, maxwell-tugs, ot-minute-num, mcconkie-balaam]
