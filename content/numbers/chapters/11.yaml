chapter: 11
title: Flesh to Eat, and the Spirit Shared
tagline: On the way from Sinai the people complain, and fire burns at the edge of the camp. Then they weep for the food of Egypt, and Moses tells the LORD the burden is too heavy. The LORD puts Moses' spirit on seventy elders and sends quails until the people sicken of them.
when: 'On the way from Sinai, in the second year after the Exodus ([[Num. 10:11–12]]; [[Num. 10:33]]).'

setting: |
  Israel left Sinai on the twentieth day of the second month of the second year ([[Num. 10:11–12]]), and the ark went before them “three days’ journey” to find a resting place ([[Num. 10:33]]). This chapter tells what happened on that road. It is “the first of many instances of murmuring recorded in Numbers” (what murmuring is: [[Ex. 15:24]]). Most of the accounts in Numbers 11–25 are “painful in their portrayal of murmuring (chapters 11, 21), rebellion against Moses’s leadership (chapters 12, 14, 16), and apostasy (chapter 25).” The covenants made at Sinai “did not automatically ensure their faith and obedience,” and the judgments that follow “can only be understood in the context of the covenant commitments the Israelites had made at Mount Sinai.”

  The chapter names two places, Taberah and Kibroth-hattaavah; Moses later names both among Israel's rebellions ([[Deut. 9:22]]). The list of camps in Numbers 33 goes from the wilderness of Sinai to Kibroth-hattaavah and on to Hazeroth ([[Num. 33:16–17]]) and does not name Taberah. With the seventy elders the chapter opens another concern of the book, “the nature of prophetic leadership and what constitutes a true prophet,” and the next chapter carries it on.

thread: |
  The chapter tells of two kinds of complaint and how the LORD answered each. The people complain twice, first at Taberah, where the text does not say what about (verse 1), and then of the manna (verses 4–6). One reading notes that their complaints “are not prayers toward heaven”: the people speak and “the LORD heard it” (verse 1), and they cry to Moses (verse 2). Moses complains too, and bitterly (verses 11–15), but he says it to the LORD. One older reading sets his words apart from the murmuring of unbelief: his complaint “is addressed to God, for the purpose of entreating help and deliverance from Him,” while unbelief “complains of the ways of God” and “does not pray to the Lord its God.”

  To Moses the LORD gives help, seventy elders who receive the spirit that was on him and “bear the burden of the people with thee” (verse 17); the same older reading says the LORD relieved him “without blaming the words of His servant.” To the people He gives what they asked for, meat for a month “until it come out at your nostrils,” and gives the reason: “ye have despised the LORD which is among you” (verse 20). The chapter ends with the meat still between their teeth and a place named for the graves of those who craved it.

sections:
  - range: 1-3
    heading: Fire at Taberah
    plain: |
      The people complained, and it displeased the LORD. The LORD heard it and His anger burned, and the fire of the LORD burned among them and consumed the outer edge of the camp. The people cried to Moses; Moses prayed to the LORD, and the fire died down. He named the place Taberah, “burning,” because the fire of the LORD had burned among them.
  - range: 4-9
    heading: Weeping for the food of Egypt
    plain: |
      The mixed crowd that had come with them began to crave, and the Israelites wept again too and said, “Who will give us meat to eat? We remember the fish we ate in Egypt for nothing, and the cucumbers, the melons, the leeks, the onions and the garlic. But now we are wasting away: there is nothing at all to look at but this manna.”

      The manna was like coriander seed, and its color was like the color of bdellium. The people went about and gathered it, ground it in mills or pounded it in a mortar, cooked it in pans and made cakes of it, and it tasted like fresh oil. When the dew fell on the camp at night, the manna fell with it.
  - range: 10-15
    heading: Moses, “too heavy for me”
    plain: |
      Moses heard the people weeping, family by family, each man at the door of his tent. The LORD was very angry, and Moses too was displeased. Moses said to the LORD, “Why have You treated Your servant so hard? Why have I not found favor with You, that You lay the burden of all this people on me? Did I conceive all this people? Did I give birth to them, that You should tell me, ‘Carry them in your arms, as a nurse carries a baby,’ to the land You promised their fathers with an oath? Where am I to get meat for all this people? They weep to me and say, ‘Give us meat to eat.’ I cannot carry all this people by myself; it is too heavy for me. If this is how You will treat me, kill me now, if I have found favor with You, and do not let me see my misery.”
  - range: 16-23
    heading: Seventy elders, and a month of meat
    plain: |
      The LORD said to Moses, “Gather to Me seventy of the elders of Israel, men you know to be elders and officers of the people, and bring them to the tabernacle of the congregation to stand there with you. I will come down and speak with you there, and I will take some of the spirit that is on you and put it on them, and they will carry the burden of the people with you, so that you do not carry it alone.

      “And say to the people, ‘Sanctify yourselves for tomorrow, and you will eat meat. You have wept in the hearing of the LORD, saying, Who will give us meat to eat? We were well off in Egypt. So the LORD will give you meat, and you will eat it, not for one day, or two, or five, or ten, or twenty, but for a whole month, until it comes out of your nostrils and you loathe it, because you have rejected the LORD who is among you and wept before Him, saying, Why did we ever leave Egypt?’”

      Moses said, “The people I am among are six hundred thousand men on foot, and You say, ‘I will give them meat to eat for a whole month.’ Would flocks and herds be enough if they were slaughtered for them? Would all the fish of the sea be enough if they were caught for them?” The LORD said to Moses, “Is the LORD's power too short? Now you will see whether My word comes true for you or not.”
  - range: 24-30
    heading: The spirit on the elders
    plain: |
      Moses went out and told the people the LORD's words. He gathered seventy of the elders and set them around the tabernacle. The LORD came down in a cloud and spoke to him, took some of the spirit that was on him and put it on the seventy elders, and when the spirit rested on them they prophesied, and did not cease.

      Two of the men remained in the camp, one named Eldad and the other Medad. They were among those listed, but they had not gone out to the tabernacle, and the spirit rested on them and they prophesied in the camp. A young man ran and told Moses, “Eldad and Medad are prophesying in the camp.” Joshua son of Nun, Moses' assistant, one of his young men, said, “My lord Moses, stop them.” Moses answered him, “Are you jealous for my sake? I wish that all the LORD's people were prophets, and that the LORD would put His spirit on them!” Then Moses went into the camp, he and the elders of Israel.
  - range: 31-35
    heading: The quails and the graves
    plain: |
      A wind went out from the LORD and brought quails from the sea and let them fall around the camp, about a day's journey on one side and a day's journey on the other, all around the camp, about two cubits high upon the ground. The people rose and gathered quails all that day, all that night and all the next day; whoever gathered least gathered ten homers, and they spread them out for themselves all around the camp.

      While the meat was still between their teeth, before it was chewed, the LORD's anger burned against the people, and the LORD struck them with a very great plague. So the place was named Kibroth-hattaavah, “the graves of lust,” because there they buried the people who had craved. From Kibroth-hattaavah the people traveled on to Hazeroth and stayed there.

notes:
  - ref: 1
    phrase: the fire of the LORD burnt among them, and consumed them that were in the uttermost parts of the camp
    kind: history
    title: Fire at the edge of the camp
    body: |
      The fire was a judgment that broke out at the edge of the camp and went out when Moses prayed (verse 2), and the text says neither what the complaint was about nor what the fire was. The Hebrew says only that the fire consumed at the end of the camp, with no word for the King James “them”; a modern translation reads “consumed some outlying parts of the camp.” So, one reading notes, “the text does not say what was consumed.”

      The place was named Taberah, a name that “comes from a root that means ‘to burn’” (verse 3), for the fire and not for the complaint.

      The theme page [Pray unto the LORD](/numbers/themes/pray-unto-the-lord/#quenched) follows Moses' pleas for Israel from this fire to the serpents of chapter 21.
    sources: [ot-minute-num, oshb-wlc, nrsvue, lds-scriptures]

  - ref: 4
    phrase: the mixed multitude that was among them fell a lusting
    kind: words
    title: The rabble and the craving
    body: |
      The “mixed multitude” here is a different Hebrew word from the one at the Exodus, and the craving began with them. In [[Ex. 12:38]] the phrase is *ʿēreb rab* (see the note there); here it is *ʾăsapsup*, found only in this verse, meaning “collection, rabble” and used “of the camp-followers attending Hebrews at the Exodus.” A modern translation reads, “The camp followers with them had a strong craving.”

      “Fell a lusting” is a verb followed by its own noun. The noun, *taʾăwāh*, “desire,” is used of appetite and “particularly of longing for dainties of Egypt,” and verse 34 names the place for it: Kibroth-hattaavah, “the graves of lust.” On one reading, what they missed was not meat as such: Israel had left Egypt with “flocks, and herds, even very much cattle” ([[Ex. 12:38]]). They name the fish and the vegetables of Egypt (verse 5), and the complaint is weariness with “eating the same thing over and over again.”
    sources: [bdb, oshb-wlc, nrsvue, ot-minute-num, lds-scriptures]

  - ref: 7
    phrase: And the manna was as coriander seed
    kind: history
    title: The manna described again
    body: |
      Between the people's complaint and Moses' prayer, the text stops to describe the manna, and one older reading takes the description as a rebuke of the complaint. To show how perverse the craving was, Moses “once more described the nature, form, and taste of the manna, and its mode of preparation, as a pleasant food which God sent down to His people with the dew of heaven.”

      What manna was is discussed at [[Ex. 16:31]]. Two details are Numbers' own: the people ground it in mills or beat it in a mortar and baked it into cakes (verse 8), and its taste was “as the taste of fresh oil,” where Exodus says “like wafers made with honey” ([[Ex. 16:31]]).
    sources: [keil-numbers, lds-scriptures]

  - ref: 12
    phrase: Carry them in thy bosom, as a nursing father beareth the sucking child
    kind: symbol
    title: A nursing father
    body: |
      Moses pictures himself told to carry Israel like a nurse carrying a baby, and his questions say whose child Israel is. The “nursing father” is *ʾōmēn*, from a verb meaning “support, nourish”; a modern translation reads, “as a wet nurse carries a nursing child.” On one older reading, Moses is not casting off the people when he asks, “Have I conceived all this people? have I begotten them?”: he pleads “with God that the duty of carrying and providing for Israel rests with Him, the Creator and Father of Israel,” who had called Israel “my son, even my firstborn” ([[Ex. 4:22]]).
    sources: [bdb, nrsvue, keil-numbers]

  - ref: 16
    phrase: Gather unto me seventy men of the elders of Israel
    kind: history
    title: Seventy elders to share the burden
    body: |
      The seventy were men already known as leaders, called to share the weight Moses could not carry. The LORD asks for men “whom thou knowest to be the elders of the people, and officers over them”; the “officers,” *shoṭerim*, were “apparently subordinate officer, judicial, civil or military.” Seventy elders had gone up Sinai with Moses ([[Ex. 24:1]]); the note there gives the Latter-day Saint reading of both companies as ordained elders and a precedent for the priesthood office of the Seventy.

      Moses' words in verse 14, “I am not able to bear all this people alone, because it is too heavy for me,” are close to Jethro's, and the Church's footnote points to them: “this thing is too heavy for thee; thou art not able to perform it thyself alone” ([[Ex. 18:18]]). There the answer was judges for the small matters ([[Ex. 18:22]]); Moses retells that in [[Deut. 1:9–18]] (see the note at [[Deut. 1:9]]). Here it is men who receive Moses' spirit and “bear the burden of the people with thee” (verse 17).

      The same reading sets beside these men the Seventy of the restored Church, who “are also called to preach the gospel, and to be especial witnesses unto the Gentiles and in all the world” ([[D&C 107:25]]), and the seventy of the New Testament: “the Lord appointed other seventy also” ([[Luke 10:1]]).
    sources: [bdb, sc-knowhy-813, lds-scriptures]

  - ref: 17
    phrase: I will take of the spirit which is upon thee, and will put it upon them
    kind: history
    title: Moses' spirit on the seventy
    body: |
      The seventy received a share of the spirit already on Moses, not a new gift: they “were endowed with some of the same authority and spiritual gifts” as he had. Another reading takes “the spirit which is upon thee” as “Moses’s inspiration, that gift of leadership that he has, and perhaps his authority,” so that Moses “would be delegating his priesthood responsibilities.”

      How the spirit passed to them the text does not describe; it says only that the LORD “came down in a cloud” and gave it (verse 25).
    sources: [ot-manual-numbers-1-12, ot-minute-num, lds-scriptures]

  - ref: 25
    phrase: they prophesied, and did not cease
    kind: words
    title: Did not cease, or did not do it again
    body: |
      The Hebrew can mean that the elders prophesied once and did not do so again, and translations divide over it. The words are *wəlōʾ yāsāpû*, “and did not add,” from the verb *yāsap*, “add.” The Septuagint, the early Greek translation, reads “they prophesied and ceased,” and a modern translation, “they prophesied. But they did not do so again.” One older reading takes the Hebrew the same way, “they did not repeat the prophesyings any further,” and adds that however the spirit was given, “Moses and the elders received a convincing proof of the reality of the affair.”

      What the prophesying was, the text does not describe. The Hebrew word for prophesy means “to declare or speak forth,” and one reading suggests the seventy “may have been bearing testimony of the experience they had just had at the cloud.”
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue, keil-numbers, ot-minute-num]

  - ref: 29
    phrase: Enviest thou for my sake?
    kind: scripture
    title: Jealous for Moses
    body: |
      Joshua spoke to guard Moses' standing, and Moses refused. “Enviest thou” is a form of *qānāʾ*, “be jealous, zealous”; a Latter-day Saint study renders the question, “Are you jealous for my sake?” Eldad and Medad were “of them that were written,” that is, on the list, and the spirit came on them where they were, in the camp (verse 26). Why they stayed behind the text does not say. One reading takes the tabernacle the others “went out” to as, apparently, the tent Moses had pitched “without the camp” ([[Ex. 33:7]]). It compares the disciples who forbade a man casting out devils “because he followeth not us,” and the Savior's answer, “Forbid him not” ([[Mark 9:38–39]]).

      For the Latter-day Saint study that renders Joshua's question, the episode shows that “one indicator of a true prophet, by biblical standards, is having access to the spiritual gifts necessary to communicate and help bring about divine will.” The next chapter marks a limit to the wish: there the LORD sets Moses above those to whom He speaks in visions and dreams ([[Num. 12:6–8]]). The note at [[Joel 2:29]] reads Joel's promise that the LORD would “pour out my spirit upon all flesh” ([[Joel 2:28]]) as the answer to Moses' wish.
    sources: [bdb, pike-balaam, ot-minute-num, lds-scriptures]

  - ref: 31
    phrase: as it were two cubits high upon the face of the earth
    kind: history
    title: Quails two cubits deep
    body: |
      The verse says the quails lay “two cubits high” on the ground around the camp, as far as a day's journey on every side, and a modern translation reads “about two cubits deep on the ground.” As for where they came from, “according to their seasonal migrations, quails fly over Sinai,” and they “are known to stay low to the ground because they become tired from the long trek.” The people “spread them all abroad” (verse 32), on one reading “curing them in the sun.”

      The quantity was beyond use. The least anyone gathered was ten homers (verse 32), “about one hundred bushels, far beyond normal need.” Quails had come once before, in the wilderness of Sin ([[Ex. 16:13]]), and there “the reader had not been told what happened to the quails.”
    sources: [nrsvue, ot-minute-num, ot-manual-numbers-1-12, lds-scriptures]

  - ref: 33
    phrase: the LORD smote the people with a very great plague
    kind: history
    title: Why the meat ended in graves
    body: |
      The text gives the reason before the meat arrives: “because that ye have despised the LORD which is among you, and have wept before him, saying, Why came we forth out of Egypt?” (verse 20). The verse gives the plague to the LORD's wrath and names no sickness. Nor does it say how many died.

      The place was named for the dead, “because there they buried the people that lusted” (verse 34). Two psalms retell the scene. One says “he gave them their own desire” and that the wrath came “while their meat was yet in their mouths” ([[Ps. 78:29–31]]; see the note at [[Ps. 78:19]]); the other, “he gave them their request; but sent leanness into their soul” ([[Ps. 106:15]]; see the note there). Paul counts it among Israel's examples, “to the intent we should not lust after evil things, as they also lusted” ([[1 Cor. 10:6]]).
    sources: [lds-scriptures]

christ: |
  The LORD whom the people despised was “among” them (verse 20): Jehovah, the premortal Christ (see [[Ex. 3:14]]). When a crowd later reminded Jesus that “our fathers did eat manna in the desert,” He answered, “Moses gave you not that bread from heaven; but my Father giveth you the true bread from heaven” ([[John 6:31–32]]), and “I am the bread of life: he that cometh to me shall never hunger” ([[John 6:35]]). Of the manna He said, “Your fathers did eat manna in the wilderness, and are dead” ([[John 6:49]]).

  The bread that leaves no one hungry is Christ Himself ([[John 6:35]]). And Moses' wish is open to a disciple now: “all members of the congregation of the Lord may have the gift of prophecy, and other gifts, by virtue of the fact that all who are baptized are given the ‘Gift of the Holy Ghost.’”

explore: |
  - **The next complaint.** [[Num. 12:1–16]], where Miriam and Aaron speak against Moses and the LORD sets him apart from other prophets.
  - **The manna and the quails.** [[Ex. 16:1–36]], [[Ps. 78:17–31]] and [[Ps. 106:13–15]].
  - **The true bread.** [[John 6:26–58]].
  - **The Spirit poured out.** [[Joel 2:28–29]], [[Acts 2:1–18]] and [[1 Cor. 12:4–11]].
  - **The Seventy.** [[Luke 10:1–20]], [[D&C 107:25–26]] and [[D&C 107:93–97]].

parallels:
  - ref: Ps. 78:17–31
    note: The psalm retells the craving for meat, the quails and the plague.
  - ref: Ps. 106:13–15
    note: The psalm sums up the craving and its cost in three verses.

sources: [lds-scriptures, scripture-helps-num, pike-balaam, keil-numbers, ot-minute-num, oshb-wlc, nrsvue, bdb, lxx-rahlfs, sc-knowhy-813, ot-manual-numbers-1-12]
