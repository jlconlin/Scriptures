chapter: 2
title: Every Man in His Place
tagline: The men counted in chapter 1 are given their places. Twelve tribes camp in four groups of three, one group on each side of the tabernacle, with the Levites between, and they march in the same order in which they camp.
when: 'At Sinai, in the second year after the Exodus ([[Num. 1:1]]); the order is first used when Israel sets out ([[Num. 10:11–28]]).'

setting: |
  Numbers takes its name “from the double numbering or census of the people,” and its first part, 1:1–10:10, is the “preparation for departure from Sinai.” These are Israel's final weeks at the mountain, where the people had entered into covenant with the LORD and built the tabernacle “according to divine design.” Chapter 1 counted the men able to go to war, tribe by tribe; this chapter takes the same figures and turns the count into a camp. The total at the end (verse 32) is the total of the census, 603,550 (on who was counted and how large the number is, see [[Num. 1:46]] and [[Ex. 12:37]]).

  The order given here is used when the cloud lifts and Israel leaves Sinai: Judah's camp goes “in the first place,” and Dan's is “the rearward of all the camps” ([[Num. 10:14]]; [[Num. 10:25]]). Near the journey's end, on the plains of Moab ([[Num. 22:1]]), Balaam looks down on the camp and sees “Israel abiding in his tents according to their tribes” ([[Num. 24:2]]).

thread: |
  The chapter puts the LORD's tent at the center and everyone else in a place around it. On each side of the tabernacle three tribes camp side by side under one banner, “so that the twelve tribes formed four large camps or divisions of an army,” with the Levites between them and the tent (verse 17). In each group the leading tribe is named first and gives the group its name: the numbers of all three “are reckoned under its name” (verses 9, 16, 24, 31).

  The groups follow the families of Jacob's sons. Judah camps with Issachar and Zebulun, “the descendants of Leah”; Reuben with Simeon and Gad, “descendants of Leah and her maid Zilpah”; Ephraim with Manasseh and Benjamin, “the whole of the descendants of Rachel”; and Dan with Asher and Naphtali, “the descendants of the maids Bilhah and Zilpah.”

  The line that holds it together is verse 17: “as they encamp, so shall they set forward, every man in his place.” The camp at rest and the column on the move keep the same order. The chapter ends with the people doing it: “according to all that the LORD commanded Moses” (verse 34).

sections:
  - range: 1-2
    heading: The order given
    plain: |
      The LORD spoke to Moses and Aaron: “The Israelites are to camp each man under the banner of his camp, with the signs of his ancestral house. They are to camp around the tent of meeting, facing it, at some distance from it.”
  - range: 3-9
    heading: East, Judah
    plain: |
      On the east side, toward the sunrise, the camp under Judah's banner is to pitch by its divisions. Nahshon son of Amminadab is the leader of the tribe of Judah, and his division numbers 74,600. Next to Judah camps the tribe of Issachar, led by Nethaneel son of Zuar, with 54,400; then the tribe of Zebulun, led by Eliab son of Helon, with 57,400. The camp of Judah numbers 186,400 in all, by their divisions. They are to set out first.
  - range: 10-16
    heading: South, Reuben
    plain: |
      On the south side is the banner of the camp of Reuben, by its divisions. Elizur son of Shedeur is the leader of Reuben, with 46,500. Next to him camps the tribe of Simeon, led by Shelumiel son of Zurishaddai, with 59,300; then the tribe of Gad, led by Eliasaph son of Reuel, with 45,650. The camp of Reuben numbers 151,450 in all. They are to set out second.
  - range: 17-17
    heading: The tabernacle in the middle
    plain: |
      Then the tent of meeting is to set out, with the camp of the Levites, in the middle of the camps. They are to march in the same order in which they camp, each man in his place under his banner.
  - range: 18-24
    heading: West, Ephraim
    plain: |
      On the west side is the banner of the camp of Ephraim, by its divisions. Elishama son of Ammihud is the leader of Ephraim, with 40,500. Next to him is the tribe of Manasseh, led by Gamaliel son of Pedahzur, with 32,200; then the tribe of Benjamin, led by Abidan son of Gideoni, with 35,400. The camp of Ephraim numbers 108,100 in all. They are to set out third.
  - range: 25-31
    heading: North, Dan
    plain: |
      On the north side is the banner of the camp of Dan, by its divisions. Ahiezer son of Ammishaddai is the leader of Dan, with 62,700. Next to him camps the tribe of Asher, led by Pagiel son of Ocran, with 41,500; then the tribe of Naphtali, led by Ahira son of Enan, with 53,400. The camp of Dan numbers 157,600 in all. They are to set out last, under their banners.
  - range: 32-34
    heading: The whole camp
    plain: |
      These are the Israelites counted by their ancestral houses: all the men of the camps, by their divisions, numbered 603,550. But the Levites were not counted among the Israelites, as the LORD had commanded Moses. The Israelites did everything the LORD commanded Moses: they camped under their banners, and they set out in the same way, each by his clan and his ancestral house.

notes:
  - ref: 2
    phrase: by his own standard, with the ensign of their father’s house
    kind: words
    title: Standards and ensigns
    body: |
      The verse distinguishes a camp's standard from the signs of its tribes and families. The “standard,” Hebrew *degel*, “standard, banner,” is “primarily the larger field sign, possessed by every division composed of three tribes,” and also the banner of the tribe that led it; the “ensigns,” literally “signs,” were “the smaller flags or banners which were carried at the head of the different tribes and subdivisions of the tribes.”

      The word *degel* can also mean the troop that gathers under the banner, “the army united under one standard,” and that is how the chapter often uses it (verses 17, 31, 34). The Septuagint, the early Greek translation, reads verse 3 in that sense: “the order of the camp of Juda.”

      What the standards looked like the text never says: “Neither the Mosaic law, nor the Old Testament generally, gives us any intimation as to the form or character of the standard.” Later rabbinic tradition gave Judah's standard a lion, Reuben's a man, Ephraim's an ox and Dan's an eagle; the Bible gives none of them.
    sources: [bdb, keil-numbers, lxx-rahlfs]

  - ref: 2
    phrase: far off about the tabernacle of the congregation
    kind: history
    title: At a distance, with the Levites between
    body: |
      The tribes camped round the tabernacle, facing it but some way off from it, and the space between was filled by the Levites, set apart to serve it. Here “far off” means “some way off, from or at a distance”; the phrase may also be rendered “facing the tent of meeting on all sides,” and the paraphrase above keeps both.

      Between the four camps and the tabernacle the three clans of the Levites camped on three sides, the Gershonites “behind the tabernacle westward,” the Kohathites “southward,” and the Merarites “northward,” and on the east, “before the tabernacle,” camped Moses, Aaron and his sons ([[Num. 3:23–38]]). The previous chapter gives the reason: “the Levites shall pitch round about the tabernacle of testimony, that there be no wrath upon the congregation of the children of Israel” ([[Num. 1:53]]). Who the Levites were and why they stood in the place of the firstborn is the subject of [[Num. 3:12]].
    sources: [bdb, lds-scriptures]

  - ref: 3
    phrase: on the east side toward the rising of the sun
    kind: history
    title: Judah in front
    body: |
      Judah's camp lay at the front, on the east, and led the march. The east was the side of the tabernacle's entrance, where Moses and Aaron camped “before the tabernacle toward the east” ([[Num. 3:38]]), and “Judah camped directly east of the tabernacle entrance.” When the camp moved, Judah's three tribes went first (verse 9; [[Num. 10:14]]), “so that Judah led the way as the champion of his brethren,” in one older reading, which points to Jacob's blessing, “The sceptre shall not depart from Judah” ([[Gen. 49:10]]).

      The places of honor, “at the head of the hosts and immediately following the tabernacle, were held by Judah and Ephraim.” Judah was “a natural leader among the sons of Jacob,” and the tribe “took the lead after the settlement in Canaan.” Its captain here, Nahshon son of Amminadab, is called “prince of the children of Judah” in the genealogy that leads from him through Boaz to David ([[1 Chr. 2:10–15]]; [[Ruth 4:20–22]]).
    sources: [ot-manual-numbers-1-12, keil-numbers, bd-judah, lds-scriptures]

  - ref: 10
    phrase: On the south side shall be the standard of the camp of Reuben
    kind: scripture
    title: The firstborn in the second place
    body: |
      Reuben, Jacob's firstborn, leads the second camp, and the chapter does not say why. What other scripture says of Reuben's standing can be set beside it. Genesis tells of his transgression and of Jacob's words over it ([[Gen. 35:22]]; [[Gen. 49:3–4]]): “Although Reuben was the firstborn of Jacob and Leah, he lost his birthright because of transgression.” Chronicles says that “his birthright was given unto the sons of Joseph,” and adds, “For Judah prevailed above his brethren, and of him came the chief ruler; but the birthright was Joseph's” ([[1 Chr. 5:1–2]]).

      Chronicles does not mention the camp, and Numbers does not mention the birthright: the passages stand side by side, and neither explains the other.
    sources: [bd-reuben, lds-scriptures]

  - ref: 17
    phrase: the tabernacle of the congregation shall set forward with the camp of the Levites in the midst of the camp
    kind: history
    title: The tabernacle in the middle of the march
    body: |
      Chapter 10 fills in how the tabernacle travelled in the middle of the march. Here the eastern and southern camps set out first and second (verses 9, 16), then the tabernacle with the Levites, then the western and northern camps (verses 24, 31): “as they encamp, so shall they set forward.”

      When Israel sets out, the tabernacle does not travel in one piece. The Gershonites and Merarites, “bearing the tabernacle,” go after Judah's camp, and the Kohathites, “bearing the sanctuary,” go after Reuben's, “and the other did set up the tabernacle against they came” ([[Num. 10:17–21]]). The text sets the two side by side without comment.
    sources: [lds-scriptures]

  - ref: 18
    phrase: On the west side shall be the standard of the camp of Ephraim
    kind: scripture
    title: Rachel's sons, with Ephraim first
    body: |
      The western camp is Rachel's: her son Benjamin and the two sons of her son Joseph, “the sons of Rachel; Joseph, and Benjamin” ([[Gen. 35:24]]; on these three as a group in later scripture, see the note at [[Ps. 80:1]]). Joseph is counted as two tribes because Jacob adopted his sons: “Ephraim and Manasseh … as Reuben and Simeon, they shall be mine” ([[Gen. 48:5]]). With Levi set apart (verse 33), the camps still hold twelve.

      Joseph's younger son, Ephraim, leads the elder, Manasseh. Jacob had foretold that Manasseh's “younger brother shall be greater than he,” and “he set Ephraim before Manasseh” ([[Gen. 48:19–20]]). Here Ephraim's banner leads the camp, and Manasseh camps “by him” (verse 20). On the witness of Chronicles and Jeremiah ([[1 Chr. 5:1–2]]; [[Jer. 31:9]]), Ephraim is the tribe that “was given the birthright in Israel.”
    sources: [bd-ephraim, lds-scriptures]

christ: |
  The center of the camp was the tent of Jehovah, the premortal Christ (see [[Ex. 3:14]]), who had asked for it “that I may dwell among them” ([[Ex. 25:8]]). John tells of His coming in the flesh in the same image: the Word “dwelt among us” ([[John 1:14]]; on the Greek word, see the note at [[Ex. 25:8]]). The captain who led the march, Nahshon of Judah, stands in Matthew's line of the Savior: “Aminadab begat Naasson; and Naasson begat Salmon” ([[Matt. 1:4]]).

  The Lord's house “is a house of order … and not a house of confusion” ([[D&C 132:8]]), and “in symbolic representation thereof, so was the camp of Israel.” In this dispensation He told elders on a journey to “do like unto the children of Israel, pitching their tents by the way” ([[D&C 61:25]]), the verse to which the Church's footnote on “pitched” in verse 34 points. The order of His Church is His, given by revelation as the camp's was given to Moses, and a disciple keeps a place in it as Israel did, by doing “according to all that the LORD commanded” (verse 34).

explore: |
  - **The camp on the march.** [[Num. 10:11–28]], and the Levites' places around the tabernacle, [[Num. 3:23–38]].
  - **The camp seen from outside.** Balaam's view of Israel “abiding in his tents according to their tribes,” [[Num. 24:2–6]].
  - **Judah and Ephraim.** [[Gen. 48:13–20]], [[Gen. 49:8–12]], [[1 Chr. 5:1–2]] and [[Isa. 11:12–13]].

