chapter: 13
title: Grapes and Giants
tagline: From the wilderness of Paran Moses sends a ruler from each tribe to search Canaan. After forty days they return to Kadesh with a cluster of grapes so large that two men carry it, and all twelve agree the land is good. Ten say it cannot be taken; Caleb says, “Let us go up at once.”
when: 'In the wilderness of Paran, at Kadesh, in the second year after the Exodus ([[Num. 10:11–12]]; [[Num. 12:16]]; [[Num. 13:26]]).'

setting: |
  Israel left Sinai in the second month of the second year after the Exodus ([[Num. 10:11–12]]) and, after the complaints of chapters 11 and 12, camped in the wilderness of Paran ([[Num. 12:16]]). Numbers is set in three main places: Mount Sinai, Kadesh, and the plains of Moab. Kadesh, also called Kadesh-barnea, is the second; the twelve came back there (verse 26). It was “a well-watered and fruitful spot in the wilderness of Zin,” in the southwest corner of the land, and the spies were sent from there “two years after leaving Egypt.” Numbers places it both in the wilderness of Paran (verse 26) and in “the wilderness of Zin, which is Kadesh” ([[Num. 33:36]]).

  This chapter and the next are the hinge of the book. The adults' “lack of faith in Jehovah's power to deliver them into the promised land” brought the sentence that they would die in the wilderness (chapter 14), and the years at Kadesh became the time in which a new generation grew up. Moses retells the story in [[Deut. 1:19–46]].

  Later scripture makes the episode a warning. Hebrews calls it “the provocation, in the day of temptation in the wilderness” ([[Heb. 3:8]]). Jacob and Alma use the episode to call their people to repent before it is too late ([[Jacob 1:7–8]]; [[Alma 12:36–37]]).

thread: |
  The chapter sets two reports side by side, and they begin from the same fruit. Moses sent the twelve with a list of questions: are the people strong or weak, is the land good or bad, are the cities tents or strongholds (verses 18–20). All twelve answer the question of the land the same way: “surely it floweth with milk and honey; and this is the fruit of it” (verse 27). The ten add that the people are strong and the cities walled (verse 28). What divides them is the conclusion. Caleb says, “we are well able to overcome it” (verse 30); the ten say, “We be not able” (verse 31).

  The faithful spies “confirmed the fruitfulness of the land but disagreed that it could not be conquered.” The ten then go further: the land itself, they say, “eateth up the inhabitants thereof” (verse 32). The chapter is a choice “between two basic but opposing approaches—faith versus fear,” and chapter 14 tells which one the people chose.

sections:
  - range: 1-16
    heading: A ruler from every tribe
    plain: |
      The LORD said to Moses, “Send men to explore the land of Canaan, which I am giving to the children of Israel. Send one man from each ancestral tribe, every one a leader among them.” So Moses, as the LORD commanded, sent them from the wilderness of Paran, all of them heads of the children of Israel.

      These were their names: from Reuben, Shammua son of Zaccur; from Simeon, Shaphat son of Hori; from Judah, Caleb son of Jephunneh; from Issachar, Igal son of Joseph; from Ephraim, Oshea son of Nun; from Benjamin, Palti son of Raphu; from Zebulun, Gaddiel son of Sodi; from Joseph, that is, from Manasseh, Gaddi son of Susi; from Dan, Ammiel son of Gemalli; from Asher, Sethur son of Michael; from Naphtali, Nahbi son of Vophsi; from Gad, Geuel son of Machi. These are the names of the men Moses sent to explore the land. And Moses called Oshea son of Nun Jehoshua, that is, Joshua.
  - range: 17-20
    heading: What to look for
    plain: |
      Moses sent them to explore Canaan and said, “Go up this way through the Negev, the dry south, and up into the hill country. See what the land is like, and whether the people who live there are strong or weak, few or many. See whether the land they live in is good or bad, and whether their towns are open camps or fortified. See whether the soil is rich or poor, and whether there are trees in it. Be courageous, and bring back some of the fruit of the land.” It was the season of the first ripe grapes.
  - range: 21-25
    heading: Forty days in the land
    plain: |
      So they went up and explored the land from the wilderness of Zin to Rehob, on the way to Hamath. They went up through the Negev and came to Hebron, where Ahiman, Sheshai and Talmai, the descendants of Anak, lived. (Hebron was built seven years before Zoan in Egypt.)

      They came to the valley of Eshcol and cut off a branch with a single cluster of grapes, and two of them carried it on a pole; they also brought pomegranates and figs. The place was called the valley of Eshcol, “cluster,” because of the cluster the Israelites cut there. After forty days they came back from exploring the land.
  - range: 26-29
    heading: The report at Kadesh
    plain: |
      They came back to Moses, Aaron and the whole congregation at Kadesh in the wilderness of Paran, gave their report, and showed them the fruit of the land. They told Moses, “We went into the land you sent us to, and it truly flows with milk and honey; here is its fruit. But the people who live there are strong, and the cities are walled and very large. We even saw the descendants of Anak there. The Amalekites live in the Negev; the Hittites, Jebusites and Amorites live in the hill country; and the Canaanites live by the sea and along the Jordan.”
  - range: 30-33
    heading: Caleb, and the evil report
    plain: |
      Caleb quieted the people before Moses and said, “Let us go up at once and take possession of it, for we are well able to overcome it.” But the other men who had gone up with him said, “We cannot go up against these people; they are stronger than we are.”

      So they spread a slanderous report about the land among the Israelites. They said, “The land we went through to explore devours those who live in it, and all the people we saw there are men of great size. We saw the giants there, the sons of Anak, who come from the giants. We seemed like grasshoppers in our own eyes, and so we seemed to them.”

notes:
  - ref: 2
    phrase: every one a ruler among them
    kind: history
    title: Twelve rulers, not the twelve princes
    body: |
      The twelve were tribal leaders, but not the princes named in the census. Each tribe sends “a ruler,” and verse 3 calls them “heads of the children of Israel,” yet none of the names in verses 4–15 is among the princes listed in [[Num. 1:5–15]]. The list follows the census in leaving out Levi, which was not numbered among the tribes ([[Num. 1:47–49]]), and in counting Joseph as two tribes, Ephraim and Manasseh (verses 8 and 11).

      Why send leaders rather than scouts the text does not say. One reading sees it as preparation: “Leaders would return with the experience to lead their people into the promised land.” Here the mission is the LORD's command; in Moses' retelling the people asked for it and the plan “pleased” him ([[Deut. 1:22–23]]). The note at [[Deut. 1:22]] sets the two accounts side by side.
    sources: [lds-scriptures, ot-minute-num]

  - ref: 16
    phrase: And Moses called Oshea the son of Nun Jehoshua
    kind: words
    title: Why he is already Joshua in Exodus
    body: |
      Joshua already bears his new name in [[Ex. 17:9]] and [[Num. 11:28]], and this verse, which records the change from Oshea, “salvation,” to Joshua, “Jehovah is salvation,” does not say that Moses made it at this moment.

      One older reading uses that silence to explain why the earlier passages already call him Joshua. Moses probably gave him the name “either before or after the defeat of the Amalekites,” or when he took him into his service, and since none of the earlier passages is a genealogy, “the name Joshua, by which Hosea had become best known in history, could be used proleptically in them all,” that is, ahead of time. On that reading the list in verses 4–15 gives each man as he stood in his tribe's record, so Oshea appears under his own name, and the verse explains the name by which Israel knew him.
    sources: [scripture-helps-num, keil-numbers]

  - ref: 21
    phrase: from the wilderness of Zin unto Rehob, as men come to Hamath
    kind: history
    title: The length of the land in forty days
    body: |
      Verse 21 gives a route the length of the land, from the wilderness of Zin, on the southern border ([[Num. 34:3]]), toward Hamath in the north. Hamath was a city of Syria in the valley of the Orontes, and the “entering in of Hamath” “was the northern limit of the Promised Land.” Read that way, the spies searched the land “from the south to the north and back again, a distance of about 250 miles each way, for 40 days.”

      Another reading has them go no farther than Hebron. The verses that follow tell only of Hebron and the valley of Eshcol, in the south (verses 22–24), and on that reading “their report on Canaan was only a report on Hebron fashioned as a report on all the land.” The text gives the route of verse 21 and names no place north of Hebron.

      The forty days (verse 25) may not be an exact count: in the Bible “forty” can mean “a completed space of time, not necessarily an exact number.” In the next chapter the number becomes the sentence: “each day for a year, shall ye bear your iniquities, even forty years” ([[Num. 14:34]]).
    sources: [bd-hamath, wilcox-spies, ot-minute-num, lds-scriptures]

  - ref: 22
    phrase: (Now Hebron was built seven years before Zoan in Egypt.)
    kind: history
    title: Older than Zoan
    body: |
      The aside dates Hebron by Zoan, a city in Egypt. A psalm sets the LORD's wonders before the Exodus in Zoan's “field” ([[Ps. 78:12]]; on Zoan, see the note at [[Isa. 19:11]]). The text says neither why it gives the date nor when Zoan was built, so the verse fixes Hebron's age only against Zoan's.

      Hebron was “an ancient city,” known also as Kirjath-arba, where Abraham had bought a grave for Sarah, and “the burying place of Abraham and his family” (see the note at [[Gen. 23:2]]). Here the spies found the “children of Anak” (who they were: [[Deut. 1:28]]). The same three names, Sheshai, Ahiman and Talmai, return when Caleb takes the city ([[Josh. 15:14]]).
    sources: [bd-hebron, lds-scriptures]

  - ref: 23
    phrase: they bare it between two upon a staff
    kind: history
    title: A cluster carried by two men
    body: |
      Two men carried a single cluster on a pole, and its size was the point: it was “an indication of the goodness of the land.” The valley of Eshcol is the “valley of a cluster,” in the region of Hebron, and verse 24 explains its name by this cluster.

      The fruit answered one of Moses' questions, whether the land was “good or bad” (verse 19). Even the ten began their report with it: “surely it floweth with milk and honey; and this is the fruit of it” (verse 27).
    sources: [wilcox-spies, bdb, lds-scriptures]

  - ref: 30
    phrase: And Caleb stilled the people before Moses
    kind: scripture
    title: Caleb, and the mountain he later asked for
    body: |
      In this chapter only Caleb of Judah answers the ten; Joshua joins him in the next ([[Num. 14:6–9]]). He and Joshua “alone brought back a true report,” and of all who left Egypt they were the only ones to survive the forty years. The LORD's verdict on him comes in chapter 14: “my servant Caleb, because he had another spirit with him, and hath followed me fully, him will I bring into the land whereinto he went” ([[Num. 14:24]]).

      The book of Joshua gives Caleb's own memory of this day, forty-five years later: “Forty years old was I when Moses the servant of the Lord sent me from Kadesh-barnea to espy out the land; and I brought him word again as it was in mine heart” ([[Josh. 14:7]]). At eighty-five ([[Josh. 14:10]]) he asked for the very hill country whose people had frightened the ten: “give me this mountain … for thou heardest in that day how the Anakims were there, and that the cities were great and fenced” ([[Josh. 14:12]]). He received Hebron ([[Josh. 14:13–14]]).
    sources: [bd-caleb, kimball-mountain, lds-scriptures]

  - ref: 32
    phrase: an evil report of the land
    kind: words
    title: An evil report is a slander
    body: |
      The “evil report” is a slander on the land. The Hebrew *dibbāh* means “whispering, defamation, evil report,” and the next chapter calls the same report “a slander upon the land” ([[Num. 14:36]]). The Septuagint, the early Greek translation, has the spies bring “a horror of that land.”

      In verse 27 the same men had called it a land that “floweth with milk and honey”; now it “eateth up the inhabitants thereof.” The text does not explain the phrase. One older reading takes it to mean that the land was fought over for its riches, so that “its inhabitants wasted away,” with the spies “exaggerating the difficulties of the conquest in their unbelieving despair.” The men who spread the report “died by the plague before the LORD” ([[Num. 14:37]]).
    sources: [bdb, lxx-rahlfs, keil-numbers, lds-scriptures]

  - ref: 33
    phrase: we were in our own sight as grasshoppers, and so we were in their sight
    kind: symbol
    title: As grasshoppers
    body: |
      The simile is the ten's, the last words of the “frightening report” they spread (verse 32): beside the people of the land they felt as small as grasshoppers, and, they say, so they looked to them. The word translated “giants” is *nephilim*, found elsewhere only in [[Gen. 6:4]] (its meaning is discussed in the note there); who the Anakim were is the subject of the note at [[Deut. 1:28]].

      So the words that make the Anakim descendants of the Nephilim, “the sons of Anak, which come of the giants,” are found only here, in the ten's report. They are not in the Septuagint, the early Greek translation, which reads only, “there we saw the giants; and we were before them as locusts.” They are in the Samaritan text of the Pentateuch and in the Latin Vulgate, and whether they are a doubled phrase added to the Hebrew is uncertain.

      The theme page [Seek Not after Your Own Eyes](/numbers/themes/seek-not-after-your-own-eyes/) follows what Israel is told to look at, from the spies to the land Moses is shown.
    sources: [wilcox-spies, bdb, lxx-rahlfs, lds-scriptures]

christ: |
  The LORD who sends the spies into “the land of Canaan, which I give” (verse 2) is Jehovah, the premortal Christ (see [[Ex. 3:14]]). The man to whom Moses gives the name Joshua bears it, in its Greek form, as Jesus ([[Acts 7:45]]; [[Heb. 4:8]]), the name the angel gave the Son of Mary: “thou shalt call his name Jesus: for he shall save his people from their sins” ([[Matt. 1:21]]). Hebrews, warning against “the provocation” in the wilderness, says of the generation that turned back here, “they could not enter in because of unbelief” ([[Heb. 3:19]]).

  The walls and the Anakim were real; Caleb still remembered them forty-five years later ([[Josh. 14:12]]). What he would not do was let the report end in “we be not able.” President Kimball took Caleb's “give me this mountain” as his own word for the challenges before the Church, pledging to “go forward, with faith in the God of Israel, knowing that he will guide and direct us.” A disciple whose way forward looks walled and too strong has the same assurance, because the Lord who gave the land is the One who “goeth before you” ([[Deut. 1:30]]).

