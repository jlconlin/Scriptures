  - **The episode as a warning.** [[Ps. 95:8–11]], [[Heb. 3:7–19]], [[Heb. 4:1–11]], [[Jacob 1:7–8]] and [[Alma 12:36–37]].
  - **Caleb as an example.** President Spencer W. Kimball, [“Give Me This Mountain”](https://www.churchofjesuschrist.org/study/general-conference/1979/10/give-me-this-mountain?lang=eng) (October 1979).

