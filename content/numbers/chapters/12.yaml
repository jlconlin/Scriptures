chapter: 12
title: My Servant Moses
tagline: Miriam and Aaron speak against Moses and claim that the LORD speaks by them too. The LORD calls the three to the tabernacle, sets Moses above every prophet of visions and dreams, and Miriam is struck with leprosy. Moses prays for her, and the camp waits seven days until she comes back.
when: 'At Hazeroth, in the wilderness after Sinai, in the second year after the Exodus ([[Num. 10:11–12]]; [[Num. 11:35]]; [[Num. 12:16]]).'

setting: |
  Israel has left Sinai ([[Num. 10:11–12]]) and come by way of Kibroth-hattaavah to Hazeroth ([[Num. 11:35]]). Chapter 11 has just told how the LORD put His spirit on seventy elders and how Moses answered Joshua's jealousy with “would God that all the LORD's people were prophets” (see [[Num. 11:29]]). This chapter follows at once, and the challenge now comes from inside Moses' own family.

  Numbers 11–25 is a run of murmuring, “rebellion against Moses's leadership (chapters 12, 14, 16), and apostasy,” and the challenges to his “prophetic leadership” begin here, with “Miriam and Aaron (Moses's older siblings).” Miriam has been a prophetess since the song at the sea (see [[Ex. 15:20]]); Aaron holds the priest's office ([[Ex. 28:1]]). Both had real gifts.

  Scripture did not forget the episode. Moses' law of leprosy tells Israel, “Remember what the LORD thy God did unto Miriam by the way, after that ye were come forth out of Egypt” ([[Deut. 24:9]]). Micah still names her among the three the LORD sent before Israel ([[Micah 6:4]]). Her death comes at Kadesh, in [[Num. 20:1]].

thread: |
  The chapter turns on one question, the siblings' own: “Hath the LORD indeed spoken only by Moses? hath he not spoken also by us?” (verse 2). The marriage of verse 1 is the occasion, and the text drops it at once. The LORD's answer is about Moses' calling.

  Moses says nothing in his own defense; the text calls him very meek (verse 3), and the LORD Himself takes up his case. The answer of verses 6–8 does not deny that the LORD speaks to others. It distinguishes the person who prophesies, as the seventy had and perhaps Miriam and Aaron, from the prophet the LORD has set over His house. That limits Moses' wish in the chapter before ([[Num. 11:29]]): it was “an invitation to speak the words of Jehovah but not an invitation to speak for Jehovah,” and Numbers 12 shows the difference.

  At the end the brother who was spoken against cries to the LORD for the sister who spoke (verse 13), and the whole camp waits seven days for her before it moves (verse 15).

sections:
  - range: 1-3
    heading: Miriam and Aaron speak against Moses
    plain: |
      Miriam and Aaron spoke against Moses because of the Cushite woman he had married, for he had married a Cushite woman. They said, “Has the LORD spoken only through Moses? Has he not spoken through us as well?” And the LORD heard it. (Now the man Moses was very meek, more than anyone else on the face of the earth.)
  - range: 4-9
    heading: Not so my servant Moses
    plain: |
      At once the LORD said to Moses, Aaron and Miriam, “Come out, you three, to the tabernacle of the congregation.” The three of them came out. The LORD came down in the pillar of cloud, stood at the door of the tabernacle, and called Aaron and Miriam, and they both stepped forward.

      He said, “Hear my words. When there is a prophet among you, I the LORD make myself known to him in a vision and speak to him in a dream. My servant Moses is not like that: he is faithful in all my house. With him I speak mouth to mouth, openly and not in riddles, and he sees the form of the LORD. Why then were you not afraid to speak against my servant Moses?” The LORD's anger burned against them, and he left.
  - range: 10-13
    heading: Miriam is struck, and Moses prays
    plain: |
      When the cloud lifted from the tabernacle, Miriam was leprous, white as snow. Aaron looked at Miriam and saw that she was leprous. Aaron said to Moses, “Please, my lord, do not hold against us the sin we have so foolishly committed. Do not let her be like one dead, whose flesh is half wasted away when it comes out of its mother's womb.” And Moses cried to the LORD, “O God, heal her, I pray.”
  - range: 14-16
    heading: Seven days outside the camp
    plain: |
      The LORD answered Moses, “If her father had only spat in her face, would she not be ashamed seven days? Let her be shut out of the camp for seven days, and afterward she may be brought back.” So Miriam was shut out of the camp seven days, and the people did not set out until she had been brought back. After that the people moved on from Hazeroth and camped in the wilderness of Paran.

notes:
  - ref: 1
    phrase: because of the Ethiopian woman whom he had married
    kind: history
    title: The Cushite wife
    body: |
      The text does not name the woman or say what Miriam and Aaron objected to in the marriage. It says only that she was a Cushite, and says it twice. Cush, the King James “Ethiopia,” lay south of Egypt, extending “from Syene on the frontier of Egypt southward to the neighborhood of Khartoum, at the junction of the Blue and White Nile.”

      Whether she is Zipporah, the Midianite whom Moses married in his exile ([[Ex. 2:21]]), is not settled. Midian lay east of the Sinai Peninsula and Cush far to the south along the Nile; some identify the two women, but they are “most likely different individuals.” Nothing earlier in the Bible tells of this marriage.

      A reader may ask whether the objection was to a foreign or an African wife. The text itself does not say (for the Church manual's reading, see the note at verse 2), and the LORD's answer in verses 6–8 is about Moses' calling, not his marriage. On the wider question the Church “disavows the theories advanced in the past that black skin is a sign of divine disfavor or curse … that mixed-race marriages are a sin.”
    sources: [bd-ethiopia, ot-minute-num, gte-race-priesthood, lds-scriptures]

  - ref: 2
    phrase: Hath the LORD indeed spoken only by Moses?
    kind: history
    title: The complaint behind the complaint
    body: |
      The siblings' words in verse 2 say nothing about the wife; they are a claim to share Moses' place. On the surface the grievance was that she was a Cushite, not an Israelite; “the real reason for the complaint, however, seems to have been jealousy motivated by Moses' position as spiritual leader and prophet of Israel.” Their argument rested on experience they really had: they held that they could speak against Moses “because in the past the Lord had also spoken through them.”

      Miriam was a prophetess (see the note at [[Ex. 15:20]]), and Aaron had been Moses' spokesman from the beginning ([[Ex. 4:16]]). What they did with the gift is the chapter's subject. After “And the LORD heard it,” it is the LORD who answers them (verses 4–9), not Moses.
    sources: [ot-manual-numbers-1-12, ot-minute-num, lds-scriptures]

  - ref: 3
    phrase: Now the man Moses was very meek
    kind: words
    title: Very meek, and who says so
    body: |
      To be meek is to be “Godfearing, righteous, humble, teachable, and patient under suffering,” and the chapter shows Moses that way rather than only saying it. He does not answer his siblings. When the LORD has spoken for him and Miriam is struck, he cries out for her healing (verse 13), “without any hint of reproach.” His learning and standing “could have caused him to be prideful. Instead, the attribute and spiritual gift of meekness with which he was blessed attenuated arrogance in his life and magnified Moses as an instrument to accomplish God's purposes.” The Hebrew word and its range are discussed at [[Ps. 25:13]].

      Readers ask how Moses could write this of himself. The King James sets the verse in parentheses. The Pentateuch “was written by Moses,” and yet “scribes and copyists have left their traces upon the Pentateuch as we have it today.” Neither source says which this verse is.
    sources: [gs-meek-meekness, ot-minute-num, bednar-meek, bd-pentateuch, lds-scriptures]

  - ref: 6
    phrase: I the LORD will make myself known unto him in a vision, and will speak unto him in a dream
    kind: scripture
    title: Visions and dreams are real revelation
    body: |
      The LORD's rebuke begins by affirming the gift that Miriam and Aaron claimed: visions and dreams are how He makes Himself known to a prophet. “In other words, the inspiration that Aaron and Miriam had experienced was in fact real and valid.” Their error was not in claiming to have heard the LORD but in setting that experience against the calling of the one He had set over Israel (verse 7).

      The verse also bears on the Book of Mormon's “visionary man.” Laman and Lemuel murmured against Lehi “because he was a visionary man” ([[1 Ne. 2:11]]). Some in Jerusalem then used “visionary” as a slur, but against that use “Numbers 12:6 unequivocally declares” that a prophet is one to whom the LORD comes in vision and dream; Lehi “dreamed dreams and saw visions.”
    sources: [ot-minute-num, sc-knowhy-469]

  - ref: 7
    phrase: who is faithful in all mine house
    kind: scripture
    title: Faithful in all mine house
    body: |
      The LORD's word for Moses here is “my servant” (verses 7 and 8), a title the Old Testament gives its prophets: it “directly links the prophet with Jehovah as a slave, property, or an indentured servant of Jehovah,” and such a servant does not take the glory that belongs to his Master.

      Hebrews uses the same words. Jesus “was faithful to him that appointed him, as also Moses was faithful in all his house” ([[Heb. 3:2]]); then the contrast: “Moses verily was faithful in all his house, as a servant, for a testimony of those things which were to be spoken after” ([[Heb. 3:5]]), but Christ is “a son over his own house” ([[Heb. 3:6]]). The servant faithful in the house is set beside the Son over it.

      One reading takes the line as answering verse 1 as well: by calling Moses “faithful in all mine house,” the LORD “may be acknowledging Moses's marriage to the Ethiopian woman.” The text itself does not make the link.
    sources: [richardson-prophet-leader, lds-scriptures, ot-minute-num]

  - ref: 8
    phrase: mouth to mouth, even apparently, and not in dark speeches
    kind: words
    title: Mouth to mouth, not in riddles
    body: |
      Verse 8 sets plain speech against the vision and dream of verse 6. “Apparently” has its older sense, “openly; evidently,” not “seemingly.” The “dark speeches” are *ḥîdôt*, riddles, a “dark, obscure utterance” that has to be interpreted. And “the similitude of the LORD” is His *temûnâ*, the “form, semblance” of the LORD, which Moses beholds.

      The contrast is not more visions but a different kind of meeting, which the rest of scripture also gives Moses: “the LORD spake unto Moses face to face, as a man speaketh unto his friend” (see the note at [[Ex. 33:11]]), and “he saw God face to face, and he talked with him” ([[Moses 1:2]]). How that stands beside “there shall no man see me, and live” is taken up at [[Ex. 33:20]].
    sources: [webster-1828, bdb]

  - ref: 10
    phrase: Miriam became leprous, white as snow
    kind: history
    title: Why Miriam alone
    body: |
      Both siblings spoke, but only Miriam was struck, and the text does not say why. Her disease was a skin disease, “most likely not today's leprosy, or Hansen's disease” (on the word, see the note at [[Lev. 13:2]]).

      One older reading takes Miriam to have led the complaint: her name stands first, and the verb of verse 1, “spake,” is feminine singular in Hebrew, so that “Miriam was the instigator of the open rebellion.” A Latter-day Saint reading agrees that she “may have been leading this action against Moses's leadership,” and adds that “the punishment was not as severe as can be interpreted”: Moses had once seen his own hand made leprous and restored ([[Ex. 4:6–7]]), so “Moses knew Miriam could be healed.” The text itself places Aaron with her in the sin: “lay not the sin upon us” (verse 11).
    sources: [oshb-wlc, keil-numbers, ot-minute-num, lds-scriptures]

  - ref: 12
    phrase: of whom the flesh is half consumed when he cometh out of his mother’s womb
    kind: symbol
    title: Aaron's plea
    body: |
      Aaron's image is a stillborn child. Asking that Miriam not be “as one dead,” he compares her to a child that comes from the womb already wasting, “like a still-born child, which comes into the world half decomposed,” because the disease seemed to eat away the living body.

      Aaron, the high priest, calls his brother “my lord” and confesses for them both, “we have done foolishly” (verse 11). He does not pray to the LORD himself; he asks Moses to, and Moses does (verse 13).
    sources: [keil-numbers, lds-scriptures]

  - ref: 14
    phrase: If her father had but spit in her face, should she not be ashamed seven days?
    kind: history
    title: Seven days outside, and a camp that waited
    body: |
      The LORD answers Moses' prayer, but not by sparing Miriam the disgrace. The comparison is with a daughter whose father has spat in her face, who would “be ashamed seven days”; one older reading takes the shame to mean she would “keep herself hidden from Me out of pure shame.” The seven days match the law of the skin disease, under which the priest shut up a suspected case “seven days” ([[Lev. 13:4]]), and she would “remain outside of the camp for the prescribed seven days.”

      Verse 15 adds that “the people journeyed not till Miriam was brought in again.” The cost fell on the whole camp: “The group punishment was that everyone would have to wait those seven days for Miriam to be restored to the group.” Deuteronomy later recalls the episode with the law of leprosy (see the setting, and [[Deut. 24:8–9]]).

      The theme page [Pray unto the LORD](/numbers/themes/pray-unto-the-lord/#another-shape) sets this answer beside Moses' other pleas for Israel.
    sources: [keil-numbers, ot-minute-num, lds-scriptures]

christ: |
  The LORD who came down in the cloud to defend His servant is Jehovah, the premortal Christ (see [[Ex. 3:14]]), and the Church's footnote to “the similitude of the LORD shall he behold” (verse 8) points to the Topical Guide's “Jesus Christ, Appearances, Antemortal.” Hebrews takes up verse 7's words to set Moses, faithful in the house as a servant, beside Christ, the Son over it, “whose house are we” ([[Heb. 3:6]]; see the note at verse 7).

  Miriam's and Aaron's gifts were real (verse 6), and they still should not have spoken against the LORD's anointed; a disciple's gifts of the Spirit are no more a protection against resenting another's calling. Elder Bednar taught that meekness is “the principal protection from the prideful blindness that often arises from prominence, position, power, wealth, and adulation.” Moses' meekness showed when he asked healing for the sister who had spoken against him (verse 13).

