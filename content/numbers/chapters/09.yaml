chapter: 9
title: At the Commandment of the LORD
tagline: At Sinai Israel keeps the Passover, and men made unclean by a death ask why they must be left out; the LORD answers with a second Passover a month later. Then the cloud on the tabernacle sets the camp's every move.
when: 'At Sinai, in the first month of the second year after the Exodus ([[Num. 9:1]]).'

setting: |
  Numbers 9 belongs to the book's first part, the people counted and ordered at Sinai (chapters 1–10). It steps back a month from where the book began: the census opened in the second month, and this chapter opens in the first, just after the tabernacle was raised (see the note on verse 1). The Passover of verses 1–5 is the first Passover after the Exodus ([[Ex. 12]]).

  It also stands at a threshold. Israel had left Egypt with a Passover, and in one Latter-day Saint reading it began “its final journey to the promised land” after Sinai with this one. The march itself begins in the next chapter ([[Num. 10:11–12]]).

  The second half of the chapter returns to the day the tabernacle was set up, when the cloud covered it ([[Ex. 40:34–38]]), and spells out what Exodus said briefly: when the cloud rose the camp moved, and when it settled the camp stayed. What the pillar of cloud and fire was is the subject of the note at [[Ex. 13:21]]; this chapter is about living by it.

thread: |
  The chapter's two halves are both about keeping what the LORD appointed. In the first, the word is “appointed season” (verses 2, 3, 7, 13): the Passover was to be kept on its day, “according to all the rites of it” (verse 3), and the people did it “according to all that the LORD commanded Moses” (verse 5). Then a real case tests the rule. Men who could not keep the day ask not to be left out, Moses waits for the LORD's answer, and the answer becomes law for every generation: a second Passover a month later for the unclean and the far away, and no such grace for the man who simply does not come (verses 6–14).

  In the second half the phrase is “at the commandment of the LORD,” which comes seven times in verses 18–23. A night, two days, a month, a long stay: the text walks through the cases one by one, and the repetition is the point. In one older reading it is meant to show both Israel's “absolute dependence” on the LORD's guidance and “the gracious care of their God.” The chapter ends where the first half began, with obedience “by the hand of Moses” (verse 23).

sections:
  - range: 1-5
    heading: The Passover at Sinai
    plain: |
      In the first month of the second year after Israel came out of Egypt, the LORD spoke to Moses in the wilderness of Sinai: “Let the children of Israel keep the Passover at its appointed time. Keep it at its appointed time, at evening on the fourteenth day of this month, following all its statutes and rules.” Moses told the people to keep the Passover, and they kept it at evening on the fourteenth day of the first month in the wilderness of Sinai. The children of Israel did everything just as the LORD had commanded Moses.
  - range: 6-14
    heading: The men who could not keep it
    plain: |
      But some men had become unclean by touching a dead body, so they could not keep the Passover that day. They came to Moses and Aaron that same day and said, “We are unclean because of a dead body. Why should we be kept from bringing the LORD's offering at its appointed time with the rest of Israel?” Moses said, “Wait here, and I will hear what the LORD commands about you.”

      The LORD told Moses: “Tell the children of Israel: if any of you, now or in later generations, is unclean because of a dead body, or is far away on a journey, he shall still keep the Passover to the LORD. He shall keep it at evening on the fourteenth day of the second month, eating it with unleavened bread and bitter herbs. He shall leave none of it until morning or break any of its bones, and he shall keep it by all the rules of the Passover. But the man who is clean and is not on a journey, and still does not keep the Passover, shall be cut off from his people, because he did not bring the LORD's offering at its appointed time. He will bear the guilt of his sin. And if a foreigner living among you wants to keep the Passover to the LORD, he shall keep it by the same statute and rules. You shall have one law for the foreigner and for the native-born.”
  - range: 15-23
    heading: By the cloud
    plain: |
      On the day the tabernacle was set up, the cloud covered it, the tent of the testimony, and from evening until morning there was something like fire over it. So it was always: the cloud covered it by day, and the look of fire by night.

      Whenever the cloud lifted from the tent, the children of Israel set out, and wherever the cloud settled, there they camped. At the LORD's command they set out, and at the LORD's command they camped; as long as the cloud stayed on the tabernacle, they stayed in camp. When the cloud remained for many days, they kept the LORD's charge and did not move. Sometimes it was there only a few days; still they camped at the LORD's command and set out at the LORD's command. Sometimes it stayed only from evening until morning, and when it lifted in the morning they set out; whether by day or by night, when the cloud lifted, they went. Whether it was two days, a month, or a longer time, as long as the cloud stayed on the tabernacle they camped and did not move, but when it lifted they set out. At the LORD's command they camped, and at the LORD's command they set out; they kept the LORD's charge, as He commanded through Moses.

notes:
  - ref: 1
    phrase: in the first month of the second year
    kind: history
    title: A month before the census
    body: |
      This chapter is dated a month before the book's first chapter. The census began “on the first day of the second month, in the second year” ([[Num. 1:1]]); the Passover command came in the first month, the month before. The tabernacle had been raised on the first day of that first month ([[Ex. 40:17]]), so the feast on the fourteenth came, in one older reading's words, “immediately after the erection of the tabernacle.” The same reading takes the command to mean that Israel was not to wait for Canaan but “to keep it there at Sinai.”

      Why the episode is told here, after the census and the camp, the text does not say. One older reading notes that verse 2 begins abruptly, “Let the children of Israel also keep,” as if something had been lost before it, and suggests the section may have been moved “from its original position”; the Septuagint, the early Greek translation, reads “speak and let the children of Israel keep.” That reading is a guess about how the book was put together, and it is offered as one.
    sources: [lds-scriptures, keil-numbers, cambridge-numbers]

  - ref: 7
    phrase: wherefore are we kept back
    kind: history
    title: Unclean on the appointed day
    body: |
      The men were kept back because they had touched a dead body, and the law kept the unclean from holy food. Touching a corpse made a person “unclean seven days” ([[Num. 19:11]]; the water that cleansed it is the subject of [[Num. 19:9]]), and anyone who ate of a sacrifice “having his uncleanness upon him” was to be “cut off from his people” ([[Lev. 7:20]]). The text does not name the men or say whose body it was. What it gives is their complaint: they call the Passover “an offering of the LORD,” and they ask why they should miss it “among the children of Israel.”

      Moses had no ruling ready. He told them, “Stand still,” and went to hear “what the LORD will command concerning you” (verse 8). The answer reaches past the men standing there to “any man of you or of your posterity,” and to a case they had not raised, a man “in a journey afar off” (verse 10). Leviticus tells another case settled the same way, by waiting for the LORD's word (see the note at [[Lev. 24:12]]).
    sources: [lds-scriptures]

  - ref: 11
    phrase: The fourteenth day of the second month at even they shall keep it
    kind: scripture
    title: The second Passover
    body: |
      The second Passover gave the unclean and the traveler a month's grace, and nothing else was relaxed: verses 11–12 hold them to the rules of Exodus 12, unleavened bread and bitter herbs, nothing left till morning, and no bone broken (on the bone, see the note at [[Ex. 12:46]]).

      Chronicles tells of a whole nation keeping this date. King Hezekiah and “all the congregation in Jerusalem” kept the Passover “in the second month,” because “the priests had not sanctified themselves sufficiently, neither had the people gathered themselves together to Jerusalem” ([[2 Chr. 30:2–3]]). Even then many who had not been cleansed ate “otherwise than it was written”; Hezekiah prayed that the LORD would pardon every one “That prepareth his heart to seek God,” and the LORD “healed the people” ([[2 Chr. 30:18–20]]).
    sources: [lds-scriptures]

  - ref: 13
    phrase: that man shall bear his sin
    kind: history
    title: No excuse for indifference
    body: |
      The grace had a limit: a man who was clean and at home, and simply let the day pass, was to be cut off. One older reading explains the warning as a guard on the new permission. The month's delay was for “insuperable difficulties,” and the threat was held out lest anyone turn it “into an excuse for postponing it without any necessity and merely from indifference.” What being cut off meant is discussed at [[Num. 15:30]].

      Verse 14 opens the feast to the stranger on the same terms, “one ordinance” for him and for the native-born. The first Passover law had already set his condition: “let all his males be circumcised, and then let him come near and keep it” ([[Ex. 12:48]]).
    sources: [keil-numbers, lds-scriptures]

  - ref: 18
    phrase: At the commandment of the LORD the children of Israel journeyed
    kind: symbol
    title: At the mouth of the LORD
    body: |
      The cloud's rising and settling was itself the LORD's command to march or to camp. The Hebrew of “at the commandment of the LORD” is *ʿal-pî YHWH*, literally “at the mouth of Jehovah,” *peh* being the ordinary word for mouth. Because the cloud “was a visible sign of God's presence, Israel learned to literally follow the Lord.” They “made camp, broke camp, traveled” by it.
    sources: [ot-manual-numbers-1-12, oshb-wlc, bdb, lds-scriptures]

  - ref: 19
    phrase: kept the charge of the LORD
    kind: words
    title: Keeping the charge by staying put
    body: |
      When the cloud stayed, staying was obedience. The Hebrew *mishmeret* is “a guard, watch, charge, function,” and in verses 19 and 23 it means a specific charge laid on Israel by the LORD. The verse uses it of a camp that “journeyed not”: in these verses the charge is kept by staying put as surely as by setting out (verse 23), however long the cloud “tarried” (verse 22).
    sources: [bdb]

christ: |
  The Passover kept at Sinai gave Israel, in the Church's reading, “a type and a reminder of the Only Begotten Son of God, whose blood would save man spiritually,” and Paul names Him: “Christ our passover is sacrificed for us” ([[1 Cor. 5:7]]). The rule repeated in verse 12, that no bone be broken, John saw fulfilled at the cross (see the note at [[Ex. 12:46]]). The LORD in the cloud is Jehovah, the premortal Christ (see [[Ex. 3:14]]), and Paul says the fathers who “were under the cloud” drank of “that spiritual Rock that followed them: and that Rock was Christ” ([[1 Cor. 10:1–4]]).

  By the cloud Israel was schooled “to follow Jehovah, who has ever directed His church and kingdom,” moving and resting “at the commandment of the LORD by the hand of Moses” (verse 23), and the camp's lesson was meant to reach past the cloud to a following that is spiritual. For a disciple, obedience to the Lord's direction includes waiting as well as going: staying while He has not said move is keeping His charge (verses 19–22). And the law for the men kept back (verses 10–13) makes room for one who wants to come to the Lord's ordinance and cannot, and none for one who could come and does not.

