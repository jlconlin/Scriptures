chapter: 17
title: 'Bloomed Blossoms, and Yielded Almonds'
tagline: After Korah's rebellion and the plague, the LORD settles who may come near Him with a sign that harms no one. Twelve princes' rods lie overnight before the testimony, and the one with Aaron's name buds, blossoms and bears almonds. It is kept as a warning to the rebellious, and the people cry out that anyone who comes near the tabernacle will die.
when: 'In the wilderness after the refusal at Kadesh; the text gives no year.'

setting: |
  Chapter 17 finishes the story of Korah's rebellion ([[Num. 16:1–50]]). Korah, a Levite, with Dathan and Abiram of Reuben and two hundred and fifty princes, had risen against Moses and Aaron: “Ye take too much upon you, seeing all the congregation are holy” ([[Num. 16:3]]). The rebels perished ([[Num. 16:31–35]]), and when the whole congregation murmured the next day, a plague began, which Aaron stopped with his censer, standing “between the dead and the living” ([[Num. 16:48]]).

  On one older reading, the incense that stopped the plague had already given “a practical proof to the people, that Aaron was the high priest appointed by Him,” and the budding rod was “a still further confirmation of His priesthood,” a miracle “well adapted to put to silence all the murmuring of the congregation.” In the Hebrew Bible these thirteen verses are numbered 17:16–28. The text gives no date for the chapter; it falls in the years in the wilderness after the refusal at Kadesh.

thread: |
  Chapter 16 asked who may come near the LORD, and chapter 17 answers it again, this time without a death. Moses had told Korah that the LORD would show “who is holy” and bring near “him whom he hath chosen” ([[Num. 16:5]]); the earth, the fire and the plague showed it in judgment. Now twelve princes' staves, each with a name written on it, lie overnight before the testimony, and the one with Aaron's name buds, blossoms and bears ripe almonds. The LORD states the purpose at the beginning and the end: to quiet the murmuring (verse 5), “that they die not” (verse 10).

  The people take the lesson, but as fear rather than trust: “we die, we perish, we all perish” (verse 12). Their question, how anyone can come near the tabernacle of the LORD and live, is the one chapter 18 answers.

sections:
  - range: 1-5
    heading: A rod for each tribe
    plain: |
      The LORD said to Moses, “Speak to the children of Israel and take from them a rod for each ancestral house, one from each of their princes, twelve rods in all, and write each man's name on his rod. Write Aaron's name on the rod of Levi, for each head of an ancestral house is to have one rod. Lay them in the tabernacle in front of the testimony, where I meet with you. The rod of the man I choose will blossom, and so I will put an end to the murmurings the children of Israel keep making against you, which come up to me.”
  - range: 6-9
    heading: The rod that blossomed
    plain: |
      Moses spoke to the children of Israel, and each of their princes gave him a rod, one for each prince by their ancestral houses, twelve rods; and Aaron's rod was among them. Moses laid the rods before the LORD in the tabernacle of witness.

      The next day Moses went into the tabernacle of witness, and Aaron's rod, the rod for the house of Levi, had sprouted: it had put out buds, opened into blossoms and borne ripe almonds. Moses brought all the rods out from before the LORD to the children of Israel. They looked, and each man took back his own rod.
  - range: 10-13
    heading: A token, and the people's fear
    plain: |
      The LORD said to Moses, “Put Aaron's rod back in front of the testimony, to be kept as a sign to the rebellious. So you will put a complete end to their murmurings against me, so that they do not die.” Moses did exactly as the LORD commanded him.

      Then the children of Israel said to Moses, “We are dying! We perish, all of us perish! Anyone who comes near the tabernacle of the LORD dies. Are we all to die?”

notes:
  - ref: 2
    phrase: take of every one of them a rod
    kind: words
    title: A rod for each tribe
    body: |
      Each rod stood for a tribe, and in Hebrew one word names both. *Matteh* is “a staff, rod, shaft, branch, a tribe”; as a word for a tribe it meant “originally company led by chief with staff,” and in this chapter it is the “staff as badge of leader or ruler.” On one older reading, “with a prince the rod becomes a sceptre, the insignia of rule,” so each prince who hands over his *matteh* with his name written on it (verses 2, 6) hands over the badge of his rule. (The other Hebrew word that means both rod and tribe, *shevet*, is explained at [[Gen. 49:10]].)

      A staff was a fitting way to ask the LORD's will. Aaron's rod, “among other staffs, was used as an appropriate means of determining God's will,” and the Liahona's “spindles” or “directors” seem to have worked in a similar way for Lehi's family, as “a means by which the Lord could communicate with His people.”
    sources: [bdb, keil-numbers, sc-knowhy-405]

  - ref: 3
    phrase: thou shalt write Aaron’s name upon the rod of Levi
    kind: history
    title: Aaron's name on Levi's rod
    body: |
      Levi's rod carried Aaron's name, not the name of a Levite clan, and the man who had challenged Aaron was himself a Levite. Korah was “the son of Izhar, the son of Kohath, the son of Levi” ([[Num. 16:1]]), and Moses had answered him, “ye take too much upon you, ye sons of Levi” ([[Num. 16:7]]).

      Each rod was to stand for the head of a tribe, and in Levi, on one older reading, “the tribe-head was Aaron.” Another takes “one rod shall be for the head of the house of their fathers” as apparently referring to Levi's three clans, the Gershonites, Kohathites and Merarites: they “were to have only one representative, i.e. Aaron.”
    sources: [keil-numbers, cambridge-numbers, lds-scriptures]

  - ref: 5
    phrase: I will make to cease from me the murmurings of the children of Israel
    kind: history
    title: A sign to end the murmuring
    body: |
      The sign was meant to end the murmuring so that no more would die. The day after Korah's fall the whole congregation had murmured, “Ye have killed the people of the LORD” ([[Num. 16:41]]), and 14,700 died in the plague that followed ([[Num. 16:49]]). The verb behind “make to cease” means, on one older reading, “to quiet in such a way that it will not rise again,” and the LORD repeats the purpose when the test is over: “thou shalt quite take away their murmurings from me, that they die not” (verse 10). (Murmuring in the wilderness is explained at [[Ex. 15:24]].)

      The rods also keep the promise Moses made to Korah at the start, “even him whom he hath chosen will he cause to come near unto him” ([[Num. 16:5]]). The same older reading sees the blossoming as that word fulfilled, “in a way which could not fail to accredit him before the whole congregation as sent of God.”
    sources: [keil-numbers, lds-scriptures]

  - ref: 6
    phrase: the rod of Aaron was among their rods
    kind: history
    title: Twelve rods or thirteen?
    body: |
      The text counts twelve rods, with Aaron's “among their rods,” but the camp could be counted as thirteen tribes, and older readings reckon the rods differently. One keeps twelve with Levi among them; then “Ephraim and Manasseh must have been reckoned as the one tribe of Joseph, as in Deuteronomy 27:12.” Another counts Ephraim and Manasseh as two tribes, and so thirteen tribes and thirteen staves, perhaps “stuck into the ground and standing erect, Aaron's staff being the middle one.” On either count Aaron's rod was laid among the princes' rods, as one of them.
    sources: [keil-numbers, cambridge-numbers]

  - ref: 8
    phrase: was budded, and brought forth buds, and bloomed blossoms, and yielded almonds
    kind: symbol
    title: Buds, blossoms and ripe almonds in a night
    body: |
      The rod passed through a whole season of growth in one night, from bud to ripe fruit. “Yielded” renders a verb that here means to “ripen, bear ripe (almonds)”: the rod did not only flower, it brought its fruit to ripeness. Some have explained it naturally, as freshly cut almond rods laid down to see which would flower best; one older reading answers that “a rod even freshly cut off, when laid in a dry place, would not bear ripe fruit in a single night.”

      On the same reading, the miracle is “a significant symbol of the nature and meaning of the priesthood.” Aaron had no natural advantage over the other princes, and “the priesthood was founded not upon natural qualifications and gifts, but upon the power of the Spirit, which God communicates according to the choice of His wisdom.” The ripe almonds, on that reading, showed that Aaron was not only chosen but “bore the fruit expected of him.”

      The text does not say why the rod bore almonds; on the same older reading, the almond rod was “especially adapted” to the sign, since the almond tree “flowers and bears fruit the earliest of all the trees,” and its Hebrew name, *shaqed*, means “awake”; the wordplay on that name in Jeremiah's call is explained at [[Jer. 1:11]].
    sources: [bdb, keil-numbers, ot-manual-numbers-13-36]

  - ref: 10
    phrase: to be kept for a token against the rebels
    kind: history
    title: Kept before the testimony
    body: |
      The rod went back into the tabernacle to stay, as a standing warning to the rebellious. The Hebrew calls them “the sons of rebellion,” an idiom for people marked by a quality.

      It was laid “before the testimony,” that is, before the ark of the covenant. Hebrews counts it among the things in the ark ([[Heb. 9:4]]), while the ark in Solomon's temple held only the two tables of stone ([[1 Kgs. 8:9]]). The note at [[Ex. 16:34]] sets these two passages side by side for the pot of manna. One older reading takes the keeping of the rod as “a pledge to Aaron of the continuance of his election,” and adds that there is no need to suppose “the staff continued green and blossoming.”
    sources: [cambridge-numbers, keil-numbers, lds-scriptures]

  - ref: 12
    phrase: Behold, we die, we perish, we all perish
    kind: history
    title: The cry chapter 18 answers
    body: |
      The people's cry is the question the next chapter answers. The budding rod frightened them rather than reassured them: they conclude that anyone who comes near the tabernacle dies (verse 13). One older reading calls it “a salutary terror”: “Even if this fear of death was no fruit of faith,” it would keep the generation already sentenced in the wilderness from rebelling again. Another reads these two verses as “a transition to ch. 18, in which the Levites guard the Tent, lest any layman should perish by approaching it.”

      In chapter 18 the LORD lays the danger on Aaron's house: “Thou and thy sons and thy father's house with thee shall bear the iniquity of the sanctuary” ([[Num. 18:1]]). The Levites keep the charge of the tabernacle so that “a stranger shall not come nigh unto you” ([[Num. 18:4]]), and the purpose is “that there be no wrath any more upon the children of Israel” ([[Num. 18:5]]).
    sources: [keil-numbers, cambridge-numbers, lds-scriptures]

christ: |
  Hebrews takes Aaron's calling as the pattern for priesthood and for Christ Himself: “no man taketh this honour unto himself, but he that is called of God, as was Aaron. So also Christ glorified not himself to be made an high priest” ([[Heb. 5:4–5]]). The same epistle remembers Aaron's rod among the things kept in the ark ([[Heb. 9:4]]), in the chapter where the ordinances of the tabernacle point to Christ's ministry.

  In the restored Church, too, authority to act in God's name comes by His call: “a man must be called of God, by prophecy, and by the laying on of hands by those who are in authority” ([[A of F 1:5]]). As with Aaron, no one takes it to himself.

