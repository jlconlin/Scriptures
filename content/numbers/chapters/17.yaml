  - **The charge given to Aaron and the Levites.** [[Num. 18:1–7]].
  - **Called as was Aaron.** [[Heb. 5:1–10]], and the tabernacle's furnishings remembered in [[Heb. 9:1–14]].
  - **The almond rod in Jeremiah's call.** [[Jer. 1:11–12]].

