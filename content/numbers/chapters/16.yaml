chapter: 16
title: Who Is Holy
tagline: Korah, a Levite, and three Reubenites lead two hundred and fifty princes against Moses and Aaron, saying that all the congregation is holy. The earth swallows the households of the rebels, fire consumes the men with censers, and when the people murmur again Aaron runs among them with incense and stands between the dead and the living.
when: 'In the wilderness after the refusal at Kadesh; the text gives no year and no place.'

setting: |
  Chapter 16 falls in the years between the refusal at Kadesh (chapter 14) and Israel's return there at the end of the wandering (chapter 20). Its time and place are not recorded, and one older reading calls the rebellion “the only important occurrence recorded” of those years. Between Korah's rebellion and the request to pass through Edom, “thirty-eight years of wandering had transpired.”

  Numbers 11–25 tell of murmuring, of “rebellion against Moses's leadership (chapters 12, 14, 16),” and of apostasy. The people's “spiritual experiences and covenants at Mount Sinai did not automatically ensure their faith and obedience as they moved toward Canaan.” Its leaders were men of standing: Korah was a Levite, “one who held the holy priesthood,” of the clan that carried the most holy things, and princes of the congregation stood with him.

  The rebellion is told in this chapter and answered again in the next, where Aaron's rod buds ([[Num. 17:8]]); chapter 18 then gives Aaron and his sons the charge to “bear the iniquity of your priesthood” ([[Num. 18:1]]). Later scripture remembers the story: the psalm that recalls how they “envied Moses also in the camp, and Aaron the saint of the LORD” ([[Ps. 106:16]]), Moses' retelling of “what he did unto Dathan and Abiram” ([[Deut. 11:6]]), and Jude's warning of those who “perished in the gainsaying of Core” ([[Jude 1:11]]).

thread: |
  The rebels' charge and Moses' answer use the same words, “Ye take too much upon you” (verses 3 and 7), and the chapter turns on the question between them: who is holy, and whom the LORD will “cause … to come near unto him” (verse 5). Korah held that the LORD's presence among the people made every one of them holy. Moses answered that the LORD would show it by His own choosing.

  The LORD answers with judgment and with a memorial. The earth opens under the tents of Dathan, Abiram and Korah's men (verses 31–33); fire consumes the two hundred and fifty who offered incense (verse 35); and their censers are beaten into a covering for the altar, “a memorial … that no stranger, which is not of the seed of Aaron, come near to offer incense before the LORD” (verse 40). The next day the whole congregation blames Moses and Aaron for the dead, and a plague begins. The chapter ends with incense once more, now in Aaron's censer, as he runs into the camp, makes atonement, and stands “between the dead and the living” (verse 48).

  In the book's frame this is one more rebellion of the wilderness years, this time “a direct challenge to Moses' and Aaron's leadership” by men the LORD had already brought near (verse 9).

sections:
  - range: 1-3
    heading: The rebellion
    plain: |
      Korah son of Izhar, son of Kohath, son of Levi, together with Dathan and Abiram, sons of Eliab, and On son of Peleth, all of the tribe of Reuben, gathered men and rose up against Moses. With them were two hundred and fifty Israelites, leaders of the assembly, well known in the congregation, men of reputation. They gathered against Moses and Aaron and said to them, “You have gone too far! The whole congregation is holy, every one of them, and the LORD is among them. Why then do you set yourselves above the LORD's congregation?”
  - range: 4-11
    heading: Moses answers Korah
    plain: |
      When Moses heard this, he fell on his face. Then he said to Korah and all his company, “Tomorrow the LORD will show who belongs to Him and who is holy, and He will bring that one near to Himself; the one He chooses He will bring near. Do this, Korah and all your company: take censers, put fire in them and lay incense on them before the LORD tomorrow. The man the LORD chooses will be the holy one. It is you who have gone too far, you sons of Levi!”

      Moses said to Korah, “Listen, you sons of Levi. Is it too small a thing for you that the God of Israel has set you apart from the congregation of Israel, to bring you near to Himself, to do the work of the LORD's tabernacle, and to stand before the congregation and serve them? He has brought you near, and all your brothers the Levites with you; and now do you seek the priesthood too? It is against the LORD that you and your company have gathered. Who is Aaron, that you murmur against him?”
  - range: 12-15
    heading: Dathan and Abiram will not come
    plain: |
      Moses sent for Dathan and Abiram, the sons of Eliab, but they said, “We will not come up. Is it not enough that you brought us out of a land flowing with milk and honey to kill us in the wilderness, that you must also lord it over us? You have not brought us into a land flowing with milk and honey, nor given us fields and vineyards to inherit. Will you blind these men? We will not come up.”

      Moses was very angry, and he said to the LORD, “Do not accept their offering. I have not taken one donkey from them, nor have I harmed one of them.”
  - range: 16-22
    heading: The censers at the tabernacle door
    plain: |
      Moses said to Korah, “Tomorrow you and all your company are to be before the LORD, you and they and Aaron. Each man is to take his censer and put incense in it, two hundred and fifty censers, and bring it before the LORD; you and Aaron too, each with his censer.” So every man took his censer, put fire in it and laid incense on it, and stood at the door of the tabernacle of the congregation with Moses and Aaron. Korah gathered the whole congregation against them at the door of the tabernacle, and the glory of the LORD appeared to all the congregation.

      The LORD said to Moses and Aaron, “Separate yourselves from this congregation, so that I may consume them in a moment.” They fell on their faces and said, “O God, the God of the spirits of all flesh, shall one man sin, and will You be angry with the whole congregation?”
  - range: 23-35
    heading: The earth and the fire
    plain: |
      The LORD said to Moses, “Tell the congregation, ‘Move away from around the dwellings of Korah, Dathan and Abiram.’” Moses got up and went to Dathan and Abiram, and the elders of Israel followed him. He said to the congregation, “Get away, I beg you, from the tents of these wicked men, and touch nothing of theirs, or you will be swept away in all their sins.” So the people moved away on every side, and Dathan and Abiram came out and stood at the doors of their tents with their wives, their sons and their little children.

      Moses said, “By this you will know that the LORD has sent me to do all these works, and that they are not my own idea. If these men die the common death of all men, or suffer only what happens to everyone, then the LORD has not sent me. But if the LORD does something new, and the ground opens its mouth and swallows them and all that is theirs, and they go down alive into the pit, then you will know that these men have provoked the LORD.”

      As soon as he finished speaking, the ground under them split apart. The earth opened its mouth and swallowed them, their households, all the men who belonged to Korah, and all their goods. They and all that was theirs went down alive into the pit; the earth closed over them, and they perished from among the congregation. All Israel around them fled at their cry, saying, “The earth may swallow us too!” And fire came out from the LORD and consumed the two hundred and fifty men who were offering incense.
  - range: 36-40
    heading: The censers made a covering for the altar
    plain: |
      The LORD said to Moses, “Tell Eleazar son of Aaron the priest to take the censers out of the burning and scatter the coals far away, for the censers are holy. The censers of these men who sinned at the cost of their lives are to be hammered into broad plates to cover the altar. Because they were offered before the LORD, they are holy, and they will be a sign to the children of Israel.” So Eleazar the priest took the bronze censers that the burned men had offered, and they were hammered into a covering for the altar. It was to remind the Israelites that no outsider, no one who is not a descendant of Aaron, should come near to burn incense before the LORD, or he would become like Korah and his company, as the LORD had said to him through Moses.
  - range: 41-50
    heading: Aaron between the dead and the living
    plain: |
      The very next day the whole congregation of Israel murmured against Moses and Aaron, saying, “You have killed the LORD's people.” As the congregation gathered against Moses and Aaron, they turned toward the tabernacle, and the cloud covered it and the glory of the LORD appeared. Moses and Aaron came before the tabernacle, and the LORD said to Moses, “Get away from this congregation, so that I may consume them in a moment.” And they fell on their faces.

      Moses said to Aaron, “Take a censer, put fire in it from the altar, lay incense on it, and go quickly to the congregation and make atonement for them, for wrath has gone out from the LORD; the plague has begun.” Aaron did as Moses said and ran into the midst of the congregation, and the plague had already begun among the people. He put on the incense and made atonement for the people. He stood between the dead and the living, and the plague was stopped. Fourteen thousand seven hundred died in the plague, besides those who died because of Korah. Then Aaron went back to Moses at the door of the tabernacle of the congregation, for the plague had stopped.

notes:
  - ref: 1
    phrase: Now Korah, the son of Izhar, the son of Kohath, the son of Levi
    kind: history
    title: A Levite and three Reubenites
    body: |
      The rebellion joined a Levite and three men of Reuben, and Moses answers them apart: Korah's claim to the priesthood in verses 8–11, then Dathan and Abiram, whose complaint is about his rule (verses 12–14). Korah, a great-grandson of Levi through Kohath and Izhar, was “the leader of the rebellion against Moses and Aaron.” He belonged to the clan whose service was “about the most holy things” ([[Num. 4:4]]). Dathan, Abiram and On were of Reuben, Jacob's firstborn.

      One older reading gives each group a motive behind the words. Korah “laid claim to the high-priesthood, or at least to an equality with Aaron”; the Reubenites “no doubt, were unable to get over the fact that the birthright had been taken away from their ancestor, and with it the headship of the house of Israel.” On the same reading the two hundred and fifty princes came from the other tribes, which a later verse implies when Zelophehad's daughters say their father “was not in the company of them that gathered themselves together against the LORD in the company of Korah” ([[Num. 27:3]]). On is not named again, and the text does not say why.
    sources: [bd-korah, keil-numbers, lds-scriptures]

  - ref: 3
    phrase: seeing all the congregation are holy, every one of them, and the LORD is among them
    kind: words
    title: Holy, but not by claim
    body: |
      Korah's argument starts from something true and draws the wrong conclusion. The LORD had called all Israel to be “an holy nation” ([[Ex. 19:6]]) and dwelt among them, and the word Korah uses, *qādôš*, “holy,” is the word of the LORD's charge to Israel: “ye shall be holy unto me” ([[Lev. 20:26]]). Korah argued, in one Latter-day Saint reading, “that the presence of the Lord qualified every member of the congregation to be qadōš.” Moses' answer “showed that being qadōš is not something that was automatic”: “the man whom the LORD doth choose, he shall be holy” (verse 7). “Even the Levites who held the priesthood were not automatically qadōš.” The LORD did hope that all His people would become holy, but holiness came by His choosing, not by their claim.

      Korah's claim is like that of the Zoramites, who thanked God that they were His “holy children” ([[Alma 31:16]]). The psalm that remembers the rebellion calls Aaron “the saint of the LORD,” the holy one the rebels disputed (see the note at [[Ps. 106:16]]).
    sources: [strathearn-holiness-lord, ot-manual-numbers-13-36, lds-scriptures]

  - ref: 6
    phrase: Take you censers, Korah, and all his company
    kind: history
    title: Why the test was incense
    body: |
      Moses made the test the offering of incense, the priest's own work at the tabernacle. Burning incense twice a day was the high priest's duty ([[Ex. 30:7–8]]), with live coals “brought from the brazen altar of burnt offering.” One older reading gives the reason for the choice: incense “was the holiest function of the priestly service, which brought the priest into the immediate presence of God,” and the LORD had already shown in it “how He sanctified Himself, by a penal judgment on those who took this office upon themselves without a divine call.” That judgment had fallen on Aaron's own sons, who offered “strange fire before the LORD, which he commanded them not” ([[Lev. 10:1]]; see the note there). Incense was also, in one reading, “a symbol of prayer (see Revelation 5:8; 8:3–4; Psalm 141:2), suggesting that God can only be approached in holy supplication.”

      What became of the censers is the chapter's own sign. Because they had been offered before the LORD, “therefore they are hallowed” (verse 38), and Eleazar had them hammered into plates to cover the altar, the memorial of verse 40. Who “the stranger” is: see [[Num. 3:10]].
    sources: [bd-incense, keil-numbers, ot-manual-numbers-13-36, lds-scriptures]

  - ref: 10
    phrase: seek ye the priesthood also?
    kind: scripture
    title: “The high priesthood”
    body: |
      Joseph Smith's translation reads “seek ye the high priesthood also?”, which would answer a puzzle in the King James. Korah already had the service Moses lists in verse 9, the work of the tabernacle; interpreters have “puzzled over this statement because the Levites in the group already held the Levitical Priesthood.” In one Latter-day Saint reading, the Joseph Smith Translation makes the verse “a direct reference to the fact they were seeking the higher or Melchizedek Priesthood,” a reading that “would also accommodate the non-Levites who were part of the group.” The same study recalls that the higher priesthood had been “taken from the people generally” at the time of the second tablets. Restoration scripture says of Israel in Moses' day that the LORD “took Moses out of their midst, and the Holy Priesthood also,” and “the lesser priesthood continued” ([[D&C 84:25–26]]).

      Whichever priesthood Korah sought, the New Testament states the principle from Aaron's call: “no man taketh this honour unto himself, but he that is called of God, as was Aaron” ([[Heb. 5:4]]). What the Aaronic and Levitical priesthood has to do with the priesthood restored in the latter days is the subject of the note at [[Lev. 8:12]].
    sources: [horton-jst-pentateuch, lds-scriptures]

  - ref: 13
    phrase: a land that floweth with milk and honey
    kind: history
    title: Egypt called the land of milk and honey
    body: |
      Dathan and Abiram turn the LORD's words for the promised land onto Egypt. “A land flowing with milk and honey” was how the LORD described Canaan at the burning bush ([[Ex. 3:8]]), and the spies had used it of the land itself ([[Num. 13:27]]). Here it describes the land of their bondage, which one older reading takes as “bitter irony.” In the next breath they say Moses has “not brought us into a land that floweth with milk and honey” (verse 14), which on the same reading means “thou hast not kept thy promise.”

      Their last question, “wilt thou put out the eyes of these men?”, the same reading takes as a figure, not a threat of blinding: “wilt thou blind them as to thy doings and designs?” Their reply to his summons, “We will not come up,” begins and ends their answer (verses 12 and 14).
    sources: [keil-numbers, lds-scriptures]

  - ref: 22
    phrase: O God, the God of the spirits of all flesh
    kind: scripture
    title: The God of the spirits of all flesh
    body: |
      Moses and Aaron plead for the very congregation that Korah had gathered against them, and they address God by a title that one Latter-day Saint reading takes as a witness that He is the Father of every spirit. Moses uses it once more when he asks for a leader to follow him ([[Num. 27:16]]). In the book of Moses the Lord says, “I made the world, and men before they were in the flesh” ([[Moses 6:51]]), and on that reading the revelation “likewise reflects the implication in Numbers 16:22 that God is the Father of all, and hence he is ‘the God of the spirits of all flesh.’”

      The prayer itself asks that all not be punished for the sin of one: “shall one man sin, and wilt thou be wroth with all the congregation?” The LORD answers by separating the people from the tents of the rebels (verses 24–26) rather than consuming them.
    sources: [brown-premortal-life, lds-scriptures]

  - ref: 30
    phrase: But if the LORD make a new thing
    kind: words
    title: A new creation as the sign
    body: |
      Moses staked his calling on a sign only the LORD could give. If the rebels died “the common death of all men” (verse 29), the LORD had not sent him; if they went down alive, He had. The Hebrew of “make a new thing” reads literally “create a creation,” with the verb *bārāʾ* of “In the beginning God created” ([[Gen. 1:1]]). The ground opening “her mouth” was to be something without precedent, and Moses named it before it happened. “Quick into the pit” means alive into Sheol, the world of the dead (see the note at [[Ps. 55:15]]).

      The purpose was to show “that the LORD hath sent me to do all these works; for I have not done them of mine own mind” (verse 28). In one Latter-day Saint reading, the sign answered Dathan and Abiram's scorn, “Is it a small thing” (verse 13): “in vindicating His prophet,” the LORD showed “that what Moses had done was not a small thing.”
    sources: [oshb-wlc, sc-knowhy-797, lds-scriptures]

  - ref: 32
    phrase: all the men that appertained unto Korah
    kind: scripture
    title: Korah's sons did not die
    body: |
      The earth took Korah's men and goods, but not his sons. Dathan and Abiram stood at their tent doors with “their wives, and their sons, and their little children” (verse 27), and the earth swallowed “them up, and their houses” (verse 32). Of Korah's family the chapter names no one. The later census says that the earth swallowed Dathan and Abiram “together with Korah,” and then: “Notwithstanding the children of Korah died not” ([[Num. 26:10–11]]). Korah's descendants, the Korahites, “formed a guild of musicians” and served as doorkeepers of the temple; psalms carry their name in their titles (see the note at [[Ps. 42:1]]).
    sources: [bd-korah, lds-scriptures]

  - ref: 48
    phrase: And he stood between the dead and the living
    kind: history
    title: Aaron between the dead and the living
    body: |
      Aaron ends the chapter running into the plague with a censer, and this time incense brings atonement, not judgment. The day after the judgment the whole congregation accused Moses and Aaron, “Ye have killed the people of the LORD” (verse 41), and the LORD again said He would consume them (verse 45). Moses sent Aaron with fire “from off the altar” and incense to “make an atonement for them” (verse 46). Aaron did what verse 40 reserves for the seed of Aaron, offering incense before the LORD: he “made an atonement for the people,” stood “between the dead and the living,” “and the plague was stayed.”

      The cost is still counted: fourteen thousand seven hundred died, “beside them that died about the matter of Korah” (verse 49).
    sources: [lds-scriptures]

christ: |
  The LORD who shows “who is holy” (verse 5) is Jehovah, the premortal Christ (see [[Ex. 3:14]]). Hebrews, having said that Aaron was “called of God” (see the note at verse 10), makes his call the pattern for Christ's own: “So also Christ glorified not himself to be made an high priest” ([[Heb. 5:5]]).

  For a disciple now, a call to serve comes the same way: one “must be called of God, by prophecy, and by the laying on of hands by those who are in authority” ([[A of F 1:5]]). And the holiness the LORD wants for all His people, that they “become as he is,” is not a standing to claim, as Korah claimed it: it is not automatic, and it is the LORD who shows “who is holy” (verse 5).

explore: |
  - **The answer continued.** [[Num. 17:1–13]], Aaron's rod that budded, and [[Num. 18:1–7]], the charge of the priests and Levites.
  - **Called as was Aaron.** [[Heb. 5:1–5]], [[D&C 84:18–27]] and [[D&C 107:13–20]].

parallels:
  - ref: Ps. 106:16–18
    note: The psalm recalls the envy of Moses and Aaron, the earth that swallowed Dathan and Abiram, and the fire.
  - ref: Deut. 11:6
    note: Moses recalls what the LORD did to Dathan and Abiram.

