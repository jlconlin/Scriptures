chapter: 1
title: Every Man by Name
tagline: At Sinai the LORD has Moses and Aaron, with a prince from every tribe, count the men of Israel who can go to war. They number 603,550. Levi is not counted with them, for Levi is given the tabernacle to carry and to guard.
when: 'At Sinai, on the first day of the second month of the second year after the Exodus ([[Num. 1:1]])'

setting: |
  Numbers takes its English name, through the Greek translation, from its two countings of the people, in chapters 1–4 and 26; its traditional Hebrew title is *bĕmidbar*, “In the Wilderness,” from the first verse. Like the rest of the Pentateuch it “was written by Moses,” though “scribes and copyists have left their traces” on it; the question is treated with Genesis (see [[Gen. 1:1]]).

  The chapter opens on “the first day of the second month, in the second year” after the Exodus, one month after the tabernacle was set up ([[Ex. 40:17]]), and Israel is still at Sinai. The book follows the people from Mount Sinai to Kadesh, then to the plains of Moab, and its first part, to [[Num. 10:10]], is the “preparation for departure from Sinai.” This census, with the ordering of the camp and of the Levites in chapters 2–4, belongs to that preparation: a people about to march is counted and set in order around the tabernacle.

thread: |
  Numbers 1 is **a muster for the march.** The LORD commands a count of every man “from twenty years old and upward, all that are able to go forth to war in Israel,” numbered “by their armies” (verse 3), with a prince from each tribe to stand with Moses and Aaron (verses 4–16). The count follows in one formula repeated twelve times, tribe by tribe (verses 20–43), then the total (verses 44–46). Then comes the exception: Levi is not numbered, because Levi has the tabernacle to carry, set up and guard (verses 47–53). The count begins and ends with obedience: “As the LORD commanded Moses, so he numbered them” (verse 19), and “the children of Israel did according to all that the LORD commanded Moses, so did they” (verse 54).

  The count looks ahead to Canaan, and in the book's larger story it comes back as a verdict. The men numbered here are the generation that refused the land at Kadesh. The sentence passed there falls on “all that were numbered of you, according to your whole number, from twenty years old and upward” ([[Num. 14:29]]), and when the people are counted again on the plains of Moab, “there was not a man of them whom Moses and Aaron the priest numbered,” save Caleb and Joshua ([[Num. 26:64–65]]).

sections:
  - range: 1-4
    heading: The command to count
    plain: |
      The LORD spoke to Moses in the tent of meeting, in the wilderness of Sinai, on the first day of the second month of the second year after Israel came out of Egypt. He said: Take a census of the whole community of Israel by clans and by fathers' houses, listing every male by name, one by one. You and Aaron are to count, company by company, every man in Israel twenty years old or more who is able to serve in the army. A man from each tribe, the head of his father's house, is to be with you.
  - range: 5-16
    heading: The princes of the tribes
    plain: |
      These are the names of the men who are to stand with you: from Reuben, Elizur son of Shedeur; from Simeon, Shelumiel son of Zurishaddai; from Judah, Nahshon son of Amminadab; from Issachar, Nethaneel son of Zuar; from Zebulun, Eliab son of Helon; from the sons of Joseph, from Ephraim, Elishama son of Ammihud, and from Manasseh, Gamaliel son of Pedahzur; from Benjamin, Abidan son of Gideoni; from Dan, Ahiezer son of Ammishaddai; from Asher, Pagiel son of Ocran; from Gad, Eliasaph son of Deuel; from Naphtali, Ahira son of Enan. These were the men called from the community, the leaders of their ancestral tribes, the heads of Israel's thousands.
  - range: 17-19
    heading: The people registered
    plain: |
      Moses and Aaron took these men who had been named, and on the first day of the second month they gathered the whole community. The people registered their descent by clans and by fathers' houses, and the men twenty years old and up were listed by name, one by one. As the LORD had commanded him, Moses counted them in the wilderness of Sinai.
  - range: 20-46
    heading: Twelve tribes counted
    plain: |
      The descendants of Reuben, Israel's firstborn, were listed by their lines of descent, by clans and fathers' houses, by name and head by head: every male twenty years old and up who could serve in the army. Reuben numbered 46,500. The same was done for each tribe in turn: Simeon, 59,300; Gad, 45,650; Judah, 74,600; Issachar, 54,400; Zebulun, 57,400; of Joseph's sons, Ephraim, 40,500, and Manasseh, 32,200; Benjamin, 35,400; Dan, 62,700; Asher, 41,500; Naphtali, 53,400.

      These are the men whom Moses and Aaron counted with the twelve leaders of Israel, each representing his father's house. All the Israelites twenty years old and up who could serve in Israel's army, counted by fathers' houses, numbered 603,550.
  - range: 47-54
    heading: Levi and the tabernacle
    plain: |
      But the Levites were not counted with them by their ancestral tribe, for the LORD had told Moses: Do not count the tribe of Levi or include them in the census of the Israelites. Instead, put the Levites in charge of the tabernacle of the testimony, all its furnishings and everything that belongs to it. They are to carry the tabernacle and its furnishings, serve in it, and camp around it. When the tabernacle is to move, the Levites shall take it down, and when it is to be pitched, the Levites shall set it up; any outsider who comes near shall be put to death. The Israelites are to camp each in his own camp and by his own banner, company by company. But the Levites are to camp around the tabernacle of the testimony, so that wrath does not fall on the community of Israel; the Levites are to keep guard over the tabernacle of the testimony.

      The Israelites did all that the LORD had commanded Moses.

notes:
  - ref: 3
    phrase: all that are able to go forth to war in Israel
    kind: history
    title: A muster of the army
    body: |
      The census counts an army, not a population. Only men were counted, from twenty years old and upward, “all that are able to go forth to war,” and they were numbered “by their armies” (verse 3): it is a numbering of “fighting men,” taken in Israel's last weeks at Sinai before the march toward Canaan. Twenty appears to have been the age at which an Israelite man became obliged to serve. The Levites, who were not counted for war, were numbered in another way, every male “from a month old and upward” ([[Num. 3:15]]).

      Why a census of these men called for a half-shekel ransom for each man counted is taken up at [[Ex. 30:12]].
    sources: [pike-balaam, sc-knowhy-161, lds-scriptures]

  - ref: 18
    phrase: they declared their pedigrees
    kind: words
    title: Registered by descent
    body: |
      Each man was entered by his line of descent. In Hebrew the phrase is a single verb, “declared their pedigree,” made from the noun *tôlĕdôt*, “generations,” an “account of a man and his descendants.” The same noun is rendered “by their generations” in verse 20, and the word that opens Genesis's family records, “These are the generations” ([[Gen. 2:4]]).

      So the count was more than a tally of heads. Every man was placed by name in his family, his father's house and his tribe (verse 2).
    sources: [bdb, oshb-wlc]

  - ref: 46
    phrase: six hundred thousand and three thousand and five hundred and fifty
    kind: history
    title: Six hundred and three thousand men
    body: |
      The total, 603,550, is the number the text gives; whether such large numbers have come down as first written is taken up at [[Ex. 12:37]]. It leaves out the Levites (verse 47), and also “all females, old men, boys under twenty years of age, and men unable to bear arms.” The same figure counts the men who paid the half shekel for the tabernacle's silver in [[Ex. 38:26]], and the note there takes up how the two counts relate.

      The census total has also been read as a promise being kept. Seventy souls had gone down into Egypt ([[Ex. 1:5]]); now Israel counted more than six hundred thousand men of fighting age. There are “reasons to question the literal accuracy of this extremely large number,” but it “functions in part to highlight the ongoing fulfillment of Jehovah's promise to Abraham and Sarah,” to make his seed “as the stars of the heaven” ([[Gen. 22:17]]).

      Within the total, Judah is the largest tribe, at 74,600 (verse 27). Ephraim, the younger of Joseph's sons, outnumbers Manasseh, 40,500 to 32,200 (verses 33, 35), which has been read as Jacob's blessing fulfilled: “his younger brother shall be greater than he” ([[Gen. 48:19]]). The second census, on the plains of Moab, reverses the two, Manasseh 52,700 and Ephraim 32,500 ([[Num. 26:34]], [[Num. 26:37]]), and gives a total of 601,730 ([[Num. 26:51]]), so the reading rests on the count at Sinai alone.
    sources: [ot-manual-numbers-1-12, pike-balaam, lds-scriptures]

  - ref: 49
    phrase: Only thou shalt not number the tribe of Levi
    kind: history
    title: Why Levi was not counted
    body: |
      Levi was left out of a count of fighting men because its charge was the tabernacle. The text gives that charge at once: instead of being numbered for the army, the Levites are appointed “over the tabernacle of testimony,” to carry it, take it down and set it up, and to camp around it (verses 50–51). They are counted separately in chapter 3, because the LORD took them “instead of all the firstborn”; that exchange is explained at [[Num. 3:12]].

      Leaving Levi out does not leave eleven tribes. Joseph is counted as two, Ephraim and Manasseh (verses 10, 32–35), and because Levi “did not inherit a portion of the promised land,” it was not counted among the tribes, so that their number came back to twelve. The second census gives that reason in so many words: the Levites “were not numbered among the children of Israel, because there was no inheritance given them” ([[Num. 26:62]]).
    sources: [sc-knowhy-319, lds-scriptures]

  - ref: 53
    phrase: that there be no wrath upon the congregation of the children of Israel
    kind: history
    title: A guard around the tabernacle
    body: |
      The Levites camped around the tabernacle so that wrath would not fall on the congregation (verse 53). Here, at the camp's boundary, the “stranger” of verse 51 is anyone outside the tribe, Israelite or not: the Hebrew *zār* there means one “not belonging to the tribe of Levi.” Such a person who came near the tabernacle was to die. The other tribes pitched “far off about the tabernacle” ([[Num. 2:2]]), and the Levites camped close around it, between the sanctuary and the rest of the camp (verses 52–53). The narrower boundary around the priest's office is the note on [[Num. 3:10]].

      Later chapters give the same purpose in other words. The Levites serve “that there be no plague among the children of Israel, when the children of Israel come nigh unto the sanctuary” ([[Num. 8:19]]), and the priests keep the charge of the sanctuary “that there be no wrath any more upon the children of Israel” ([[Num. 18:5]]). One older reading takes the wrath to be the LORD's, “breaking in judgment upon the unholy who approached His sanctuary in opposition to His command,” so that the Levites' charge kept it from falling “upon the congregation, viz., through the approach of a stranger.”
    sources: [bdb, keil-numbers, lds-scriptures]

christ: |
  The LORD who speaks to Moses “in the tabernacle of the congregation” (verse 1) is Jehovah, the premortal Christ (see [[Ex. 3:14]]), and the camp this chapter begins to order is built around His dwelling: the Levites pitch “round about the tabernacle” (verse 53), and the tribes around them ([[Num. 2:2]]). Paul says of this people in this wilderness that “they drank of that spiritual Rock that followed them: and that Rock was Christ” ([[1 Cor. 10:4]]). Among the princes is Nahshon of Judah (verse 7), whom the Church's footnote joins to Matthew's list of the fathers of Jesus, “Aminadab begat Naasson” ([[Matt. 1:4]]).

  Paul goes on, “with many of them God was not well pleased: for they were overthrown in the wilderness” ([[1 Cor. 10:5]]), and these things “are written for our admonition” ([[1 Cor. 10:11]]). The men counted at Sinai were numbered among the Lord's people, and their “spiritual experiences and covenants at Mount Sinai did not automatically ensure their faith and obedience”; of them only Caleb and Joshua entered the land ([[Num. 26:65]]). Being numbered with the Lord's people is a beginning, and Hebrews, speaking of the same generation ([[Heb. 3:16–19]]), draws the lesson for those who follow Christ: “we are made partakers of Christ, if we hold the beginning of our confidence steadfast unto the end” ([[Heb. 3:14]]).

