chapter: 25
title: Joined unto Baal-peor
tagline: At Shittim Israel is drawn into Moab's feasts and Moab's god; a plague falls, Phinehas stays it, and the LORD gives him a covenant of peace.
when: 'On the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Numbers 25 happens at Shittim, “acacias,” the district east of the Jordan across from Jericho where Israel camped before crossing into the land. The people have reached the plains of Moab ([[Num. 22:1]]), and the chapter follows directly on Balaam's oracles: Balaam “returned to his place” ([[Num. 24:25]]), and the next thing told is that Israel “began to commit whoredom with the daughters of Moab.”

  The chapter does not say how it began. Moses says later that the women did it “through the counsel of Balaam” ([[Num. 31:16]]), and Revelation remembers Balaam as the one who taught Balak “to cast a stumblingblock before the children of Israel” ([[Rev. 2:14]]), a passage that draws on this chapter and on 31:16. Moabites and Midianites both appear in the story, for reasons the note on verse 6 gives.

  The next chapter opens “after the plague” with a new count of the people ([[Num. 26:1]]), and among them was not one of the men counted at Sinai except Caleb and Joshua ([[Num. 26:64–65]]). Later scripture returns to Peor often: Moses uses it as a warning ([[Deut. 4:3–4]]), Psalm 106 sings Phinehas's deed ([[Ps. 106:28–31]]), Hosea names the place ([[Hos. 9:10]]), and Paul counts the fallen ([[1 Cor. 10:8]]).

thread: |
  Numbers 25 is **the curse Israel brought on itself.** For three chapters Balak tried to have Israel cursed, and Balaam could only bless. Now, by the claim of [[Num. 31:16]], Balaam had suggested that Moab could “defeat” Israel “by getting them to sin and thus curse themselves.”

  The chapter moves quickly from there. Israel goes after Moab's women, then to Moab's feasts, then bows to Moab's god, and the LORD's anger burns (verses 1–3). Orders are given against the guilty (verses 4–5). While the congregation weeps at the tabernacle, an Israelite prince brings a Midianite woman into the camp before them all, and Phinehas, Aaron's grandson, kills them both; the plague stops, after twenty-four thousand deaths (verses 6–9). The LORD answers with a covenant: Phinehas was zealous with the LORD's own zeal, and the priesthood will stay in his line (verses 10–13). Then the guilty are named, and Midian is marked as an enemy, a command carried out in chapter 31 (verses 14–18). Moses' own telling of the curse turned to blessing is at [[Deut. 23:5]].

sections:
  - range: 1-5
    heading: Israel joined to Baal-peor
    plain: |
      While Israel was camped at Shittim, the people began to commit sexual immorality with the women of Moab. The women invited the people to the sacrifices of their gods, and the people ate and bowed down to those gods. So Israel joined itself to the Baal of Peor, and the LORD's anger burned against Israel. The LORD said to Moses: Take all the chiefs of the people and hang them up before the LORD in the sun, so that the LORD's fierce anger may turn away from Israel. And Moses said to the judges of Israel: Each of you kill those of your men who joined themselves to Baal-peor.
  - range: 6-9
    heading: Phinehas stays the plague
    plain: |
      Just then an Israelite came, bringing a Midianite woman to his kinsmen, in plain sight of Moses and of the whole congregation of Israel as they wept at the door of the tabernacle. When Phinehas, the son of Eleazar, the son of Aaron the priest, saw it, he rose from among the congregation and took a spear in his hand. He went after the Israelite into the tent and drove it through both of them, the man and the woman through her belly. So the plague on the Israelites was stopped. Those who died in the plague numbered twenty-four thousand.
  - range: 10-13
    heading: A covenant of peace
    plain: |
      The LORD said to Moses: Phinehas, the son of Eleazar, the son of Aaron the priest, has turned My wrath away from the Israelites, because he was zealous on My behalf among them, so that I did not consume the Israelites in My jealousy. So tell him: I give him My covenant of peace. It will belong to him and to his descendants after him, a covenant of a priesthood that lasts forever, because he was zealous for his God and made atonement for the Israelites.
  - range: 14-18
    heading: Zimri, Cozbi and Midian
    plain: |
      The Israelite who was killed with the Midianite woman was Zimri, the son of Salu, the head of a family among the Simeonites. The Midianite woman who was killed was Cozbi, the daughter of Zur, who was the head of a people, of a family in Midian. The LORD said to Moses: Treat the Midianites as enemies and strike them, for they have treated you as enemies with their tricks, deceiving you in the affair of Peor and in the affair of Cozbi, the daughter of a Midianite leader, their kinswoman, who was killed on the day of the plague that came because of Peor.

notes:
  - ref: 3
    phrase: Israel joined himself unto Baal-peor
    kind: history
    title: Joined to Baal-peor
    body: |
      At Peor the people's sin ran from Moab's women to Moab's god, and the text gives the steps in order: they “began to commit whoredom,” they were called “unto the sacrifices of their gods,” they ate, they “bowed down,” and Israel “joined himself unto Baal-peor” (verses 1–3). The two sins came together: one Latter-day Saint study judges that the Midianite woman of verse 6 was involved in “probably cultic activity rather than merely sexual misconduct.”

      The verb behind “joined himself” means to “join, attach, oneself to” Baal-peor, that is, to “adopt his worship”; a modern translation has “Israel yoked itself to the Baal of Peor,” and Psalm 106 uses the same verb of the same event ([[Ps. 106:28]]). Who Baal-peor was, and how Moses and Hosea remember the place, is at [[Deut. 4:3]] and [[Hos. 9:10]].
    sources: [pike-balaam, bdb, nrsvue]

  - ref: 4
    phrase: hang them up before the LORD against the sun
    kind: history
    title: Hanged before the LORD in the sun
    body: |
      The verb translated “hang them up” names a public execution whose exact form is uncertain. It is used “of some solemn form of execution, but meaning uncertain,” and the ancient translations differ: Aquila's Greek has “impale,” the Septuagint and the Syriac “expose,” the Targum and the Vulgate “crucify.” A modern translation reads, “Take all the chiefs of the people and impale them in the sun before the Lord.”

      Who was to be hanged is also unclear. In the King James and in that modern translation alike, “them” follows “all the heads of the people.” One older reading takes the heads to be assembled to judge, and “the men who had joined themselves to Baal-Peor” to be the ones hanged: the guilty, “upon whom the heads of the nation were to pronounce sentence,” were “first of all put to death, and then impaled upon a stake.” In verse 5 Moses gives his order to “the judges.” The same reading holds that Moses' order “was not carried out, however, because the matter took a different turn” in verse 6. The text itself does not say.
    sources: [bdb, nrsvue, keil-numbers]

  - ref: 6
    phrase: brought unto his brethren a Midianitish woman
    kind: history
    title: Moabites and Midianites
    body: |
      The story begins with “the daughters of Moab” (verse 1) and goes on with a Midianite woman (verse 6), most likely because some Midianites lived among the Moabites. Midian descended from Abraham through Keturah ([[Gen. 25:1–2]]), and its people lived mostly in northwestern Arabia, but “there were various Midianite clans, some of which lived in areas east and north of the Dead Sea.” Midian's elders came with Moab's to fetch Balaam ([[Num. 22:4]]; [[Num. 22:7]]), and though more than one textual tradition could be proposed behind the alternation, “enough biblical passages place some Midianites in Moabite territory to accept that some mixing of peoples lies behind these variations.” Moses' father-in-law Jethro was also a Midianite, one “who Latter-day Saints believe held the Melchizedek Priesthood” that he conferred on Moses (see [[D&C 84:6]]).

      The man acted “in the sight of Moses, and in the sight of all the congregation,” as they wept at the tabernacle door. Neither offender was a common person: Zimri was “a prince of a chief house among the Simeonites,” and Cozbi's father Zur was “head over a people” (verses 14–15), named again among the kings of Midian in [[Num. 31:8]].
    sources: [pike-balaam]

  - ref: 9
    phrase: those that died in the plague were twenty and four thousand
    kind: scripture
    title: Twenty-four thousand, or twenty-three
    body: |
      Numbers counts twenty-four thousand dead; Paul, recalling this plague, says “three and twenty thousand” ([[1 Cor. 10:8]]). No Latter-day Saint source read explains the difference. One older reading offers that Paul “probably” followed “a traditional interpretation of the schools of the scribes,” in which “a thousand were deducted from the twenty-four thousand who perished, as being the number of those who were hanged by the judges.” Paul's use of the story is a warning: “all these things happened unto them for ensamples: and they are written for our admonition” ([[1 Cor. 10:11]]).
    sources: [lds-scriptures, keil-numbers]

  - ref: 11
    phrase: while he was zealous for my sake among them
    kind: words
    title: Zealous with the LORD’s jealousy
    body: |
      Phinehas's zeal and the LORD's jealousy come from one Hebrew root. The verb *qānāʾ*, “be jealous, zealous,” stands in verse 11 with the noun the King James renders “jealousy” as its object, and the noun comes again at the end of the verse. A modern translation keeps them together: Phinehas turned back the LORD's wrath “by manifesting such zeal among them on my behalf that in my jealousy I did not consume the Israelites.” In scripture “jealous” can mean “to be fervent and to have sensitive and deep feelings about someone or something,” and the verse gives the word to Phinehas and to the LORD alike.

      The LORD approves the deed (verses 11–13), and Psalm 106 says it “was counted unto him for righteousness unto all generations for evermore” ([[Ps. 106:31]]; see the note there). No example of violence in the Old Testament, this one included, is a justification for violence today.
    sources: [bdb, nrsvue, gs-jealous, lds-scriptures, scripture-helps-violence]

  - ref: 13
    phrase: the covenant of an everlasting priesthood
    kind: history
    title: A priesthood kept in Phinehas’s line
    body: |
      What the covenant promised was that the priesthood would stay with Phinehas's descendants. Aaron's sons had already been anointed to “an everlasting priesthood throughout their generations” ([[Ex. 40:15]]); here the promise is made to one of Aaron's grandsons and “his seed after him.” One older reading puts it as “the eternal possession of the priesthood” secured to him, “not for himself alone, but for his descendants also.”

      Phinehas is next seen as the priest who “stood before” the ark and asked the LORD in Israel's war with Benjamin ([[Judg. 20:28]]), and his line is traced in the lists ([[1 Chr. 6:4]]; [[Ezra 7:5]]). The same older reading holds that the high priesthood “continued in his family, with the exception of a brief interruption in Eli's days,” until the Jewish state dissolved under Herod and his successors. Malachi calls the LORD's covenant with Levi one “of life and peace” ([[Mal. 2:5]]); the note at [[Mal. 2:4]] reads it beside this verse. The priesthood of Aaron itself is at [[Lev. 8:12]].
    sources: [keil-numbers, bd-phinehas, lds-scriptures]

  - ref: 13
    phrase: made an atonement for the children of Israel
    kind: words
    title: How a priest’s deed made atonement
    body: |
      Here “made an atonement” is said of a deed, not a sacrifice. The verb is *kipper*, which the law uses for what a priest did “by the blood upon the altar” and “through the blood of the sin-offering.” Other passages use it of a man who will “cover over, atone for sin, without sacrifice”: David asks how he can cover the bloodguilt of Saul's house ([[2 Sam. 21:3]]), and the answer is “a death penalty of seven sons of the guilty house”; Moses goes up to atone “by intercession” ([[Ex. 32:30]]); Aaron atones “by incense” while a plague spreads ([[Num. 16:46–47]]); and Phinehas atones by killing the offenders. In Aaron's case and in this one the plague was stayed ([[Num. 16:48]]; verse 8).
    sources: [bdb]

  - ref: 17
    phrase: Vex the Midianites, and smite them
    kind: history
    title: Vex the Midianites
    body: |
      The LORD's command answers Midian in its own word: “Vex” in verse 17 and “they vex you” in verse 18 are the same Hebrew verb, to “shew hostility toward, treat with enmity, vex, harass.” A modern translation has “Harass the Midianites … for they have harassed you.” The reason given is Midian's “wiles,” in the matter of Peor and in the matter of Cozbi (verse 18).

      The command is carried out in chapter 31, where the LORD says “Avenge the children of Israel of the Midianites” ([[Num. 31:2]]) and Moses names the counsel of Balaam ([[Num. 31:16]]); the war, and what it did to Midian's women and children, is treated there.
    sources: [bdb, nrsvue, lds-scriptures]

christ: |
  The LORD whose anger burned at Peor and who stayed the plague is Jehovah, the premortal Christ (see [[Ex. 3:14]]); the heading of the chapter in which Paul counts Peor's dead says that “Christ is the God of Israel and the spiritual Rock that guided them.” Verse 13 calls what Phinehas did an atonement, and the scriptures teach that no law, ordinance or sacrifice would be satisfactory without the Atonement of Jesus Christ.

  Paul wrote Peor down “for our admonition” ([[1 Cor. 10:11]]), with the promise that God “will with the temptation also make a way to escape, that ye may be able to bear it” ([[1 Cor. 10:13]]). The idolatry of Peor has a modern form, for whatever a person sets heart and trust in most is that person's god.

