  - **The wilderness as warning.** [[1 Cor. 10:1–13]].
  - **The priest's covenant.** [[Mal. 2:4–7]].

parallels:
  - ref: Deut. 4:3–4
    note: Moses reminds the survivors of what the LORD did because of Baal-peor.
  - ref: Ps. 106:28–31
    note: The psalm tells the sin at Peor and Phinehas's deed, “counted unto him for righteousness.”
  - ref: Hos. 9:10
    note: The LORD recalls that Israel went to Baal-peor and “separated themselves unto that shame.”
  - ref: Num. 31:16
    note: Moses names Balaam's counsel behind the matter of Peor.
  - ref: 1 Cor. 10:8
    note: Paul counts the fallen as twenty-three thousand and makes the plague a warning.
  - ref: Rev. 2:14
    note: Balaam taught Balak to put a stumblingblock before Israel, to eat things sacrificed to idols and to commit fornication.

