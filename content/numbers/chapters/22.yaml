chapter: 22
title: The Word That God Putteth in My Mouth
tagline: Balak king of Moab sends for Balaam to curse Israel. The LORD says no, then lets him go on one condition, and on the road an angel with a drawn sword stands in the way, seen by the ass and not by the seer.
when: 'On the plains of Moab, in the last year of the forty in the wilderness'

setting: |
  After the victories over Sihon and Og ([[Num. 21:21–35]]), Israel camps in “the plains of Moab,” the region just northeast of the Dead Sea, across the Jordan from Jericho (verse 1). Here begins the last part of the book, chapters 22–36, all on the plains just outside the promised land. It opens with the story of Balaam (22–24), Israel's sin with the Moabites at Peor (25), and a second census once the Exodus generation had died (26). Israel had not attacked Moab, but the fall of the two Amorite kings gave Balak “ample reason for concern.”

  Chapter 22 is the first of three chapters on Balaam. It tells how he was hired and how he came; his oracles follow in chapters 23 and 24. Later scripture remembers the story often: the curse turned to blessing ([[Deut. 23:4–5]]; [[Josh. 24:9–10]]; [[Neh. 13:2]]), Balaam's counsel that led Israel into sin and his death ([[Num. 31:8]]; [[Num. 31:16]]), and the New Testament's warnings ([[2 Pet. 2:15]]; [[Jude 1:11]]; [[Rev. 2:14]]). Later writings grow more and more negative about him; Micah is the exception, remembering Balaam as one who helped overturn Balak's plan ([[Micah 6:5]]). Moses' own account of the hiring is at [[Deut. 23:3–5]].

thread: |
  Again and again in the chapter Balaam is bound to the word the LORD gives. He tells the first messengers he will answer “as the LORD shall speak unto me” (verse 8); he tells the second that a house full of silver and gold could not take him “beyond the word of the LORD my God” (verse 18); God lets him go on the condition “the word which I shall say unto thee, that shalt thou do” (verse 20); the angel sets the same condition (verse 35); and Balaam tells Balak, “the word that God putteth in my mouth, that shall I speak” (verse 38).

  Between these comes the road, where the man hired for his sight cannot see the angel his ass sees three times (the note at verse 28). In these chapters Balaam is above all “the mouthpiece for Jehovah's will for the Israelites,” and that Jehovah chose a foreign diviner to speak it is part of the irony.

sections:
  - range: 1-4
    heading: Moab afraid
    plain: |
      The Israelites set out and camped on the plains of Moab, across the Jordan from Jericho. Balak son of Zippor saw everything Israel had done to the Amorites, and Moab was terrified of the people because there were so many of them; Moab dreaded the Israelites. Moab said to the elders of Midian, “This horde will lick up everything around us, the way an ox licks up the grass of the field.” Balak son of Zippor was king of Moab at that time.
  - range: 5-14
    heading: The first messengers
    plain: |
      He sent messengers to Balaam son of Beor at Pethor, by the river, in the land of his people, to summon him: “A people has come out of Egypt; they cover the face of the earth, and they have settled next to me. Come now and curse this people for me, for they are too strong for me. Perhaps then I can defeat them and drive them out of the land, for I know that whoever you bless is blessed, and whoever you curse is cursed.”

      The elders of Moab and of Midian set out with the fees for divination in hand, came to Balaam, and gave him Balak's message. He said to them, “Stay here tonight, and I will bring back to you whatever the LORD tells me.” So the leaders of Moab stayed with Balaam. God came to Balaam and asked, “Who are these men with you?” Balaam said to God, “Balak son of Zippor, king of Moab, has sent to me: ‘A people has come out of Egypt and covers the face of the earth. Come now and curse them for me; perhaps I can fight them and drive them out.’” God said to Balaam, “Do not go with them. You must not curse the people, for they are blessed.” In the morning Balaam got up and said to Balak's leaders, “Go back to your own land, for the LORD has refused to let me go with you.” So the leaders of Moab went back to Balak and said, “Balaam refuses to come with us.”
  - range: 15-21
    heading: The second messengers
    plain: |
      Balak sent leaders again, more of them and more distinguished than the first. They came to Balaam and said, “This is what Balak son of Zippor says: Let nothing keep you from coming to me, for I will reward you richly and do whatever you tell me. Come and curse this people for me.” Balaam answered Balak's servants, “Even if Balak gave me his house full of silver and gold, I could not go beyond the word of the LORD my God to do anything, small or great. Now stay here tonight as the others did, so that I may learn what more the LORD will say to me.” That night God came to Balaam and said, “If the men have come to summon you, get up and go with them; but do only what I tell you.” So Balaam got up in the morning, saddled his donkey, and went with the leaders of Moab.
  - range: 22-35
    heading: The ass and the angel
    plain: |
      But God was angry that he went, and the angel of the LORD took his stand in the road to oppose him. Balaam was riding his donkey, with his two servants beside him. When the donkey saw the angel of the LORD standing in the road with a drawn sword in his hand, she turned off the road into a field, and Balaam beat her to turn her back onto the road. Then the angel of the LORD stood in a narrow path between the vineyards, with a wall on either side. When the donkey saw the angel, she pressed against the wall and crushed Balaam's foot against it, and he beat her again. The angel of the LORD went on ahead and stood in a narrow place where there was no room to turn either right or left. When the donkey saw the angel, she lay down under Balaam, and Balaam, furious, beat her with his staff.

      Then the LORD opened the donkey's mouth, and she said to Balaam, “What have I done to you, that you have beaten me these three times?” Balaam said, “Because you have made a fool of me. If I had a sword in my hand, I would kill you right now.” The donkey said to Balaam, “Am I not your donkey, that you have ridden all your life to this day? Have I ever been in the habit of doing this to you?” He said, “No.”

      Then the LORD opened Balaam's eyes, and he saw the angel of the LORD standing in the road with his drawn sword in his hand, and he bowed his head and fell face down. The angel of the LORD said to him, “Why have you beaten your donkey these three times? I came out to oppose you, because your way is perverse before me. The donkey saw me and turned away from me three times. If she had not turned away, I would surely have killed you by now and spared her.” Balaam said to the angel of the LORD, “I have sinned. I did not know that you were standing in the road to oppose me. Now, if it displeases you, I will go back home.” The angel of the LORD said to Balaam, “Go with the men, but speak only the word I tell you.” So Balaam went on with Balak's leaders.
  - range: 36-41
    heading: Balak meets Balaam
    plain: |
      When Balak heard that Balaam had come, he went out to meet him at a city of Moab on the Arnon, at the very edge of his territory. Balak said to Balaam, “Did I not send urgently to summon you? Why did you not come to me? Am I not able to reward you richly?” Balaam said to Balak, “Well, I have come to you now. But do I have any power to say anything at all? I will speak only the word that God puts in my mouth.” Then Balaam went with Balak, and they came to Kirjath-huzoth. Balak sacrificed cattle and sheep, and sent portions to Balaam and to the leaders who were with him. The next morning Balak took Balaam up to the high places of Baal, and from there he could see the edge of the people's camp.

notes:
  - ref: 4
    phrase: And Moab said unto the elders of Midian
    kind: history
    title: Midian beside Moab
    body: |
      Midianites stand beside Moab here because Midianite clans lived in the region east and north of the Dead Sea. The Bible ([[Gen. 25:1–2]]) makes them “the descendants of Midian, the fourth son of Abraham and his concubine Keturah”; they lived mostly in northwestern Arabia, but “biblical accounts occasionally mention them in Moab.” Moses had married into a Midianite family ([[Ex. 2:15–21]]), and by his day there were “various Midianite clans, some of which lived in areas east and north of the Dead Sea.”

      The detail matters for what follows. The elders of Midian go with Moab's elders to Balaam (verse 7), and Midianites return in chapters 25 and 31, where Balaam dies among them ([[Num. 31:8]]).
    sources: [pike-balaam, lds-scriptures]

  - ref: 5
    phrase: Balaam the son of Beor to Pethor, which is by the river of the land of the children of his people
    kind: history
    title: Where Balaam lived
    body: |
      Where Balaam lived is not settled. Pethor is often linked with Pitru, a town on the upper Euphrates named in an Assyrian source, though the site itself “has not been convincingly identified.” A modern translation takes “the river” as the Euphrates and reads “at Pethor, which is on the Euphrates, in the land of Amaw,” and the Bible Dictionary places him at “Pethor by the Euphrates.” Balaam himself says he came “from Aram” ([[Num. 23:7]]), and Moses calls him “Balaam the son of Beor of Pethor of Mesopotamia” ([[Deut. 23:4]]). That would have been a journey of some 350 miles.

      The rest of the verse points closer to home. “The land of the children of his people” reads, in the Samaritan Pentateuch, the Syriac and the Latin Vulgate, “the land of the Ammonites,” Moab's neighbor. The question “remains unresolved, but a location closer to Moab seems more likely in the context of the story as we have it.”

      An inscription supports a home nearer Moab. At Deir ʿAlla, in the Jordan valley about a mile north of where the Jabbok flows into the Jordan, archaeologists found a text in ink on plaster, dated to about 800 BC, that names “Balaam son of Beor” as a “seer of the gods.” It shows that “Balaam traditions existed in that region for quite some time.” In it Balaam receives messages from gods other than Jehovah, which bears on the question of who he was (the note at verse 18).
    sources: [pike-balaam, bd-balaam, lds-scriptures]

  - ref: 6
    phrase: he whom thou blessest is blessed, and he whom thou cursest is cursed
    kind: scripture
    title: He whom thou cursest
    body: |
      Balak was not asking for a forecast; he wanted the future changed. “Cursing is different from just divining the future; cursing involves manipulating the future against an adversary.” Balak sends for Balaam because of his reputation, and the king's own words show what he believes: whom Balaam curses is cursed.

      What Balak could not have was set by the LORD's promise to Abraham: “I will bless them that bless thee, and curse him that curseth thee” ([[Gen. 12:3]]). Because of that promise, “the Israelites' God did not permit others to curse them collectively (although he obviously allowed them to bring curses upon themselves).” The LORD's first answer to Balaam is short: “for they are blessed” (verse 12). Moses later gives the reason: “the LORD thy God turned the curse into a blessing unto thee, because the LORD thy God loved thee” ([[Deut. 23:5]]).
    sources: [pike-balaam, lds-scriptures]

  - ref: 7
    phrase: the rewards of divination in their hand
    kind: history
    title: Fees for divination
    body: |
      The “rewards of divination” are *qĕsāmîm*, the fees paid to a diviner, and they tell the reader what Balak took Balaam to be. Joshua calls him “the soothsayer” (*qōsēm*, [[Josh. 13:22]]). Divination is “the attempt to discern divine will—typically by utilizing ritual activity—and to thus read the future through various manifestations in the natural world.” The law forbade it in Israel in the same words: “that useth divination” ([[Deut. 18:10]]) is *qōsēm qĕsāmîm*.

      Much of what Balaam does in the next two chapters looks like a diviner's work: the altars and sacrifices, the climb to high places from which to see Israel, and the going “to seek for enchantments” ([[Num. 24:1]]).
    sources: [pike-balaam, oshb-wlc, lds-scriptures]

  - ref: 18
    phrase: I cannot go beyond the word of the LORD my God, to do less or more
    kind: history
    title: Was Balaam a prophet of the LORD?
    body: |
      Balaam calls the LORD his God, yet Numbers never calls him a prophet, and faithful readers differ about what he was. The LORD puts His word in Balaam's mouth ([[Num. 23:5]]; [[Num. 23:16]]), “a figure of speech that is associated with prophecy.” In these chapters Balaam is “never called a prophet,” yet he acts “as a prophet for the Lord,” though there are signs that his “intentions were not always good,” and in the end he betrayed Israel at Peor ([[Num. 31:16]]; [[Rev. 2:14]]), having “succumbed to Balak's pressure.” The text gives him overlapping roles: “diviner, prophet, and seer.”

      He has been read as “a prophet … bribed by Balak.” Elder Bruce R. McConkie took him for a true prophet who fell: on the second night, “still anxious to receive the riches and honors offered by the king,” he “importuned the Lord for permission to go,” and in the end he “lost his soul … because he set his heart on the things of this world rather than the riches of eternity.” One Latter-day Saint study judges it “probably better” to take him for “a non-Israelite diviner for hire” who “worshipped Jehovah when it served his purposes,” but did not worship Him alone.

      The New Testament remembers him for his greed: Balaam “loved the wages of unrighteousness” ([[2 Pet. 2:15]]), and some “ran greedily after the error of Balaam for reward” ([[Jude 1:11]]). Both passages point to him to describe those who stray from God “because they love the gain of the world.”
    sources: [scripture-helps-num, pike-balaam, bd-balaam, mcconkie-balaam, lds-scriptures]

  - ref: 20
    phrase: rise up, and go with them
    kind: scripture
    title: If thou wilt
    body: |
      Joseph Smith's revision of the Bible changes God's command in this verse. The King James text has God tell Balaam to go (verse 20) and then be angry “because he went” (verse 22), as if God had changed His mind. The manuscript of the Joseph Smith Translation reads: “if the men come to call thee, rise up, if thou wilt go with them; but yet, the word which I shall say unto thee, shalt thou speak.” It is the only entry the manuscript has for this chapter, and after it the manuscript adds, “The remainder of the Chapters in this book are all correct.”

      The revision makes the going Balaam's choice: it “places responsibility on Balaam to choose whether he would go and to consider his reasons for meeting with Balak.” Whether it restores the original text or clarifies a hard passage cannot be known. Other answers have been given: that Balaam set out without waiting for the men to call him, or that verses 22–35 were once a separate story. Even so, there is “no explicit and compelling answer” to why God was angry. The angel, after stopping him, says the same thing God had said: go, but speak only the word given (verse 35).
    sources: [jsp-ot2, horton-jst-pentateuch, pike-balaam]

  - ref: 22
    phrase: for an adversary against him
    kind: words
    title: The angel as a satan
    body: |
      The angel of the LORD stands in the road *lĕśāṭān*, as a satan, that is, as an opponent. The same noun is in the angel's own words in verse 32, where the King James has “I went out to withstand thee” and a modern translation “I have come out as an adversary.” Here the adversary is the LORD's own messenger, blocking a man's way. In Numbers 22, as in Job 1–2 and Zechariah 3, “the satan” appears, and readers debate “whether this figure is necessarily an evil entity opposed to God.”
    sources: [oshb-wlc, nrsvue, sc-knowhy-43]

  - ref: 28
    phrase: And the LORD opened the mouth of the ass
    kind: symbol
    title: The seer who could not see
    body: |
      Whether the ass really spoke is read more than one way. The text gives her speech to the LORD and tells it plainly; readings “range from the literal (Jehovah had power to cause a donkey to speak, so the donkey really spoke, just as the text claims) to the figurative.” Whichever way it is read, the point is the irony: “the man who was hired because of his reputation for sorcery and ‘seeing’ divine intent could not see God's angel.” The ass sees the angel three times and saves her master's life (verse 33).

      The order of the miracles sharpens the irony. The LORD opens the ass's mouth (verse 28), then Balaam's eyes (verse 31), and in the next chapters He puts His word in Balaam's mouth. Only then does Balaam call himself the man “which saw the vision of the Almighty … having his eyes open” ([[Num. 24:4]]), a claim that comes after he could not see the angel in front of him. In this reading the LORD speaks “through whatever and whomever he chose, whether through a donkey, a non-Israelite diviner, Moses (12:6–8), or potentially all of the covenant people.” Peter puts it bluntly: “the dumb ass speaking with man's voice forbad the madness of the prophet” ([[2 Pet. 2:16]]).

      The theme page [Seek Not after Your Own Eyes](/numbers/themes/seek-not-after-your-own-eyes/) sets Balaam's opened eyes among the sights the LORD gives in Numbers.
    sources: [pike-balaam, lds-scriptures]

  - ref: 32
    phrase: thy way is perverse before me
    kind: words
    title: A headlong way
    body: |
      The Hebrew verb behind “perverse,” *yāraṭ*, is rare and uncertain; it seems to mean “be precipitate,” rushing headlong. The line can be taken two ways: “the way is precipitate, (RVm headlong) before me,” or, with a small change to the verb, “thou hast precipitated the journey in front of me, i.e. rushed recklessly in front of me.” A modern translation keeps “your way is perverse before me.” Balaam does not argue; he answers, “I have sinned” (verse 34).
    sources: [bdb, oshb-wlc, nrsvue]

  - ref: 41
    phrase: the high places of Baal
    kind: history
    title: The heights of Baal
    body: |
      Balak takes Balaam up to a height so that he can see the people he is to curse. One older reading takes “the high places of Baal” as a place name, Bamoth-baal (compare Bamoth in [[Num. 21:19]]). On that reading the site was chosen “not because it was consecrated to Baal, but because it was the first height on the way to the steppes of Moab, from which they could see the camp of Israel.” The climb itself fits a diviner's work (the note at verse 7). The verse says Balaam saw only “the utmost part of the people,” the edge of the camp; Balak will try two more heights ([[Num. 23:13–14]]; [[Num. 23:27–28]]).
    sources: [keil-numbers, lds-scriptures]

christ: |
  The LORD who will not let Israel be cursed is Jehovah, the premortal Christ: “Christ is the God of Israel” (heading to [[1 Cor. 10]]; see [[Ex. 3:14]]). He keeps the promise He made to Abraham ([[Gen. 12:3]]), and He turned the curse into a blessing because He loved His people ([[Deut. 23:5]]).

  Balaam had his answer the first night and asked again, and Elder McConkie, telling his story, applied to him the revelation on why many are called and few chosen: “their hearts are set so much upon the things of this world, and aspire to the honors of men” ([[D&C 121:35]]). The same danger reaches a disciple who has the Lord's direction and goes on pleading for the world's rewards beside it.

explore: |
  - **The oracles.** [[Num. 23:1–24:25]], where the word put in Balaam's mouth is spoken.
  - **Moses' account and the curse turned.** [[Deut. 23:3–5]], and Deuteronomy's theme [He Turned the Curse into a Blessing](/deuteronomy/themes/curse-into-blessing/).
  - **A full Latter-day Saint study.** [“Balaam in the Book of Numbers”](https://rsc.byu.edu/creation-sinai/balaam-book-numbers) (Religious Studies Center, 2021), on Balaam's roles, God's anger, the ass, Pethor and Deir ʿAlla.

parallels:
  - ref: Deut. 23:3–5
    note: Moses gives the hiring of Balaam as a reason Moab may not enter the congregation, and says the LORD turned the curse into a blessing.
  - ref: Josh. 24:9–10
    note: Joshua recalls Balak and Balaam in his farewell.
  - ref: Neh. 13:2
    note: The hiring of Balaam remembered after the exile.
  - ref: Micah 6:5
    note: The LORD asks Israel to remember what Balaam answered Balak.
  - ref: 2 Pet. 2:15–16
    note: Balaam who loved the wages of unrighteousness, rebuked by the ass.

