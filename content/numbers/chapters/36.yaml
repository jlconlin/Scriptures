chapter: 36
title: Within the Tribe of Their Father
tagline: The men of Zelophehad's clan ask what becomes of the daughters' land if they marry into another tribe. The LORD answers that both sides speak right, and the daughters marry within Manasseh.
when: 'On the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Numbers 36 is the last chapter of the book, and it is set where the book has been since [[Num. 22:1]], “in the plains of Moab by Jordan near Jericho” (verse 13), in the fortieth year after the Exodus ([[Num. 33:38]]; [[Deut. 1:3]]). Since [[Num. 33:50]] the LORD has been giving the laws for that land: it is to be divided “by lot for an inheritance among your families” ([[Num. 33:54]]), within the borders of chapter 34, with cities for the Levites and six cities of refuge (chapter 35).

  The chapter returns to the daughters of Zelophehad, whose request for their father's inheritance was granted in [[Num. 27:1–11]]. Their family belonged to Gilead, a clan of Manasseh ([[Num. 26:29–33]]). The answer Moses gives their kinsmen is the last law in Numbers. The daughters receive their land in Joshua's day, among the portions of Manasseh ([[Josh. 17:3–6]]).

thread: |
  Numbers 36 is a second ruling on a case already decided, and **the LORD keeps both rulings**. In chapter 27 the LORD said the daughters of Zelophehad spoke right in asking for their father's land. Now the heads of their clan point out what that answer makes possible: if the daughters marry outside Manasseh, the land goes with them, and the tribe's lot shrinks for good (verses 1–4). Their appeal rests on the LORD's own command that the land be divided by lot among the tribes, which one older reading takes them to have understood as a portion that was “to continue unchanged to all generations.”

  The LORD's answer gives the men of Gilead what they asked without taking anything from the daughters: they keep the land and may marry whom they choose, within their father's tribe (verses 5–9). The law says it twice: the inheritance shall not “remove from tribe to tribe” (verse 7), nor “from one tribe to another tribe” (verse 9). The daughters do as the LORD commanded, and the book closes with its last law kept by them (verses 10–13).

sections:
  - range: 1-4
    heading: The clan of Gilead asks about the land
    plain: |
      The heads of the ancestral houses of the clan of Gilead, son of Machir, son of Manasseh, of the families descended from Joseph, came and spoke before Moses and the leaders, the heads of the Israelite families. They said: The LORD commanded my lord to give the land to the Israelites as an inheritance, by lot, and my lord was commanded by the LORD to give the inheritance of our brother Zelophehad to his daughters. But if they marry men of another Israelite tribe, their inheritance will be taken from the inheritance of our fathers and added to the inheritance of the tribe they marry into; so it will be taken from the share our lot gave us. And when Israel's year of jubilee comes, their inheritance will be added to the inheritance of the tribe they married into, and taken away from the inheritance of our fathers' tribe.
  - range: 5-9
    heading: The LORD's answer
    plain: |
      So Moses gave the Israelites a command at the word of the LORD: The tribe of Joseph's descendants is right. This is what the LORD commands about the daughters of Zelophehad: They may marry whomever they please, as long as they marry within a family of their father's tribe. No inheritance in Israel is to pass from one tribe to another; every Israelite is to hold on to the inheritance of his fathers' tribe. Every daughter who inherits land in any tribe of Israel must marry a man from a family of her father's tribe, so that every Israelite keeps the inheritance of his fathers. No inheritance is to pass from one tribe to another; each tribe of Israel is to hold on to its own inheritance.
  - range: 10-12
    heading: The daughters marry within Manasseh
    plain: |
      The daughters of Zelophehad did as the LORD had commanded Moses. Mahlah, Tirzah, Hoglah, Milcah and Noah married their cousins, the sons of their father's brothers. They married into the families of Manasseh the son of Joseph, and their inheritance stayed in the tribe of their father's family.
  - range: 13-13
    heading: The end of the laws given in Moab
    plain: |
      These are the commandments and the judgments that the LORD gave the Israelites through Moses on the plains of Moab, by the Jordan near Jericho.

notes:
  - ref: 1
    phrase: the chief fathers of the families of the children of Gilead
    kind: history
    title: Zelophehad's own clan asks
    body: |
      The question comes from Zelophehad's own kin. Gilead, the son of Machir, founded “the family of the Gileadites” in Manasseh, and Zelophehad was his grandson ([[Num. 26:29–33]]; [[Num. 27:1]]). The speakers are the heads of the fathers' houses of that clan. When they call him “Zelophehad our brother” (verse 2), one older reading takes “brother” in the wide sense of “their tribe-mate.”

      They do not question the daughters' right, which they restate as the LORD's command (verse 2). Their concern is the tribe's land: the same reading puts it that “the tribe-territory assigned to the Manassites would be diminished if they should marry into another tribe.” They bring the case to Moses and the princes, as the daughters had brought theirs to the door of the tabernacle ([[Num. 27:2]]).
    sources: [keil-numbers, lds-scriptures]

  - ref: 4
    phrase: And when the jubilee of the children of Israel shall be
    kind: history
    title: Why the jubilee would make the loss permanent
    body: |
      The men of Gilead expect the jubilee to seal the loss, not to undo it. The law of [[Lev. 25:10]] provided that every fiftieth year “land that had changed hands … reverted to the family to which it had belonged at the original settlement,” for the land was not to be “sold for ever” ([[Lev. 25:23]]). On one older reading, that law reached land that had been bought, but “would not affect the cases in which land was inherited by persons of another tribe”: the land would go to Zelophehad's descendants “in the female line” and still be “permanently severed from the tribe of Manasseh.”

      Another older reading explains why the jubilee is named at all. The land would pass to the husband's tribe at the marriage, but until the jubilee it might still come back to Manasseh, “either through the marriage being childless, or through the purchase of the inheritance.” At the jubilee, alienated land returned “to its original proprietor or his heir,” and the heir was now of another tribe: “in this way the transfer of an inheritance from one tribe to another, which took place in consequence of a marriage, would be established in perpetuity.”
    sources: [bd-jubilee-year-of, cambridge-numbers, keil-numbers, lds-scriptures]

  - ref: 5
    phrase: The tribe of the sons of Joseph hath said well
    kind: words
    title: “Said well” and “speak right”
    body: |
      The answer to the men of Gilead upholds them in the same words with which the LORD upheld the daughters. Moses gives it “according to the word of the LORD,” as he had taken the first case “before the LORD” ([[Num. 27:5]]), and “The tribe of the sons of Joseph hath said well” and “The daughters of Zelophehad speak right” ([[Num. 27:7]]) are the same expression in Hebrew: *kēn*, “right,” with the verb “to speak.”
    sources: [oshb-wlc, bdb, lds-scriptures]

  - ref: 6
    phrase: Let them marry to whom they think best
    kind: history
    title: Free to choose, within the tribe
    body: |
      The command leaves the daughters free to choose their husbands and sets one limit. On one older reading, they “might marry whoever pleased them,” but the husband “must belong to the family of their father's tribe, that is to say, must be a Manassite.”

      The limit closes a gap the first law left. Chapter 27 gave the daughters the land, “but it was realised that that law might, after all, be annulled if they were married to persons of other tribes.” If an heiress married into another tribe, her land “would become the joint property of her husband,” and so pass to his tribe. Verses 8–9 then make the ruling for five sisters into what the first older reading calls “a general law for every heiress in Israel.”
    sources: [keil-numbers, cambridge-numbers, ot-manual-numbers-13-36]

  - ref: 11
    phrase: were married unto their father’s brothers’ sons
    kind: history
    title: Married to their cousins
    body: |
      The five married first cousins, “the sons of their paternal uncles,” and so kept the land not only in Manasseh but among their father's own kin (verse 12). The text presents it as obedience: “Even as the LORD commanded Moses, so did the daughters of Zelophehad” (verse 10). The names here come in a different order from [[Num. 26:33]] and [[Num. 27:1]], where Tirzah is last; the text gives no reason.
    sources: [cambridge-numbers, lds-scriptures]

  - ref: 13
    phrase: These are the commandments and the judgments
    kind: scripture
    title: The close of the laws given in Moab
    body: |
      Verse 13 closes the laws given on the plains of Moab, and with them the book. One older reading takes it to cover not only the laws for the land since [[Num. 33:50]] but the other laws given there (chapters 25–30), so that it “places the lawgiving in the steppes of Moab by the side of the lawgiving at Mount Sinai.” Leviticus ends the same way: “These are the commandments, which the LORD commanded Moses for the children of Israel in mount Sinai” ([[Lev. 27:34]]).

      The book ends, but the journey does not. Israel is still east of the Jordan, and the real end of the journey comes only after Moses' farewell in Deuteronomy and Joshua's leading the people into Canaan. In Deuteronomy Moses speaks from the same side of the river: “On this side Jordan, in the land of Moab, began Moses to declare this law” ([[Deut. 1:5]]).
    sources: [keil-numbers, pike-balaam, lds-scriptures]

christ: |
  The LORD who answers the men of Gilead is Jehovah, the premortal Christ (see [[Ex. 3:14]]), who had said of Israel's land, “the land is mine; for ye are strangers and sojourners with me” ([[Lev. 25:23]]). He gave each family a portion and made a law so that no family's share would be lost.

  The chapter also shows the LORD answering a question His own earlier answer had raised. Moses brought the daughters' cause before Him ([[Num. 27:5]]), and when that ruling raised a new question, Moses answered it “according to the word of the LORD” too. The Lord still gives His word that way, “line upon line, precept upon precept,” and “unto him that receiveth I will give more” ([[2 Ne. 28:30]]). A disciple who has acted on one answer can bring the next question to Him, as the daughters and their kinsmen did, and receive more.

explore: |
  - **The jubilee and the redemption of land.** [[Lev. 25:8–34]].
  - **A dead man's name kept on his inheritance.** [[Ruth 4:1–10]].

parallels:
  - ref: Num. 27:1–11
    note: The daughters of Zelophehad receive their father's inheritance.
  - ref: Josh. 17:3–6
    note: The daughters receive their inheritance among the portions of Manasseh.

