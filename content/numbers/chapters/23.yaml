chapter: 23
title: How Shall I Curse, Whom God Hath Not Cursed?
tagline: Balak builds altars on one height after another and waits for a curse; twice the LORD puts a word in Balaam's mouth, and twice it is a blessing that cannot be reversed.
when: 'On the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Numbers 23 is the middle of the Balaam story (chapters 22–24). Israel is camped “in the plains of Moab on this side Jordan by Jericho” ([[Num. 22:1]]), on the northeast shoulder of the Dead Sea, in the last year or so of the forty years. Balak king of Moab has hired Balaam the son of Beor to curse them ([[Num. 22:5–6]]); who Balaam was, and how the scriptures judge him, is taken up at [[Num. 22:18]]. Balak had first taken him up to “the high places of Baal,” where he could see “the utmost part of the people” ([[Num. 22:41]]).

  The chapter moves between three heights: that first one; “the field of Zophim,” a lookout point on the top of Pisgah; and the top of Peor, nearer the camp. At each, altars are built and Balaam goes aside to meet the LORD.

thread: |
  Balak's request rests on a claim about Balaam: “he whom thou blessest is blessed, and he whom thou cursest is cursed” ([[Num. 22:6]], where its echo of the LORD's promise to Abraham is taken up). Numbers 23 is the test of that claim. Twice the same procedure is followed, altars, offerings, Balaam going aside, a word from the LORD, and a third attempt is set up at the end; twice the answer is blessing. Balaam's own refrain is the chapter's answer: “Must I not take heed to speak that which the LORD hath put in my mouth?” (verse 12; compare verse 26).

  On one reading the oracles climb: in the first only God decides blessing and curse (“How shall I curse, whom God hath not cursed?” verse 8); in the second His blessing cannot be taken back (“he hath blessed; and I cannot reverse it,” verse 20); the third goes further ([[Num. 24:9]]; chapter 24's thread sets out the whole sequence). No enchantment can touch Israel from outside (verse 23). God would not let Balaam curse Israel, but the story does not end with the blessings: two chapters later Israel sins at Baal-peor “through the counsel of Balaam” ([[Num. 25:1–3]]; [[Num. 31:16]]).

sections:
  - range: 1-6
    heading: Seven altars
    plain: |
      Balaam said to Balak, “Build me seven altars here, and get seven bulls and seven rams ready for me.” Balak did as Balaam said, and on each altar Balak and Balaam offered a bull and a ram. Then Balaam said to Balak, “Stand by your burnt offering, and I will go off. Perhaps the LORD will come to meet me, and whatever He shows me I will tell you.” And he went to a bare hill.

      God met Balaam, and Balaam said to Him, “I have prepared seven altars and offered a bull and a ram on each altar.” The LORD put a word in Balaam's mouth and said, “Go back to Balak and speak this.” So he went back, and there Balak was, standing by his burnt offering with all the princes of Moab.
  - range: 7-10
    heading: The first oracle
    plain: |
      Then Balaam took up his pronouncement and said: “Balak king of Moab has brought me from Aram, from the mountains of the east: ‘Come, curse Jacob for me; come, denounce Israel.’ How can I curse those whom God has not cursed? How can I denounce those whom the LORD has not denounced? From the top of the rocks I see him; from the hills I watch him. Here is a people that lives apart and does not count itself among the nations. Who can count the dust of Jacob, or number a fourth part of Israel? Let me die the death of the righteous, and let my end be like his!”
  - range: 11-17
    heading: To the field of Zophim
    plain: |
      Balak said to Balaam, “What have you done to me? I brought you to curse my enemies, and look, you have done nothing but bless them!” Balaam answered, “Must I not be careful to speak what the LORD puts in my mouth?”

      Balak said, “Please come with me to another place, where you can see them. You will see only the edge of them, not all of them; curse them for me from there.” He took him to the field of Zophim, a lookout point on the top of Pisgah, built seven altars, and offered a bull and a ram on each altar. Balaam said to Balak, “Stand here by your burnt offering while I go to meet the LORD over there.” The LORD met Balaam, put a word in his mouth, and said, “Go back to Balak and speak this.” When he came to him, Balak was standing by his burnt offering with the princes of Moab. Balak asked him, “What has the LORD said?”
  - range: 18-24
    heading: The second oracle
    plain: |
      Balaam took up his pronouncement and said: “Rise, Balak, and hear; listen to me, son of Zippor. God is not a man, that He should lie, nor a human being, that He should repent. Has He said it, and will He not do it? Has He spoken, and will He not carry it out? I have been commanded to bless; He has blessed, and I cannot reverse it. He has not seen iniquity in Jacob or perverseness in Israel. The LORD his God is with him, and the shout of a king is among them. God brought them out of Egypt; they have the strength of a wild ox (the King James “unicorn”). There is no enchantment against Jacob and no divination against Israel; it will be said of Jacob and Israel, ‘What God has done!’ Look, the people rises like a great lion and lifts itself up like a young lion; it will not lie down until it has eaten the prey and drunk the blood of the slain.”
  - range: 25-30
    heading: To the top of Peor
    plain: |
      Balak said to Balaam, “Then neither curse them at all nor bless them at all!” Balaam answered, “Did I not tell you that I must do everything the LORD says?” Balak said, “Come, please, I will take you to another place; perhaps it will please God to let you curse them for me from there.” So Balak took Balaam to the top of Peor, which looks toward Jeshimon. Balaam said to Balak, “Build me seven altars here, and get seven bulls and seven rams ready for me.” Balak did as Balaam said, and offered a bull and a ram on each altar.

notes:
  - ref: 1
    phrase: Build me here seven altars, and prepare me here seven oxen and seven rams
    kind: history
    title: Seven altars, and whose offering
    body: |
      The text does not say what Balaam meant by the seven altars and their offerings, and readers differ. Balak built the altars, both men offered “on every altar a bullock and a ram” (verse 2), and when God met Balaam, Balaam's first words were about them: “I have prepared seven altars” (verse 4).

      - **A plea.** Elder Bruce R. McConkie read the scene as entreaty: Balaam sacrificed, “obviously pleading with the Lord for permission to curse Israel and receive the honors offered by the king of the Moabites.”
      - **A diviner's method.** A Latter-day Saint study reads the altars and sacrifices, with the climbs to high places and the search for omens ([[Num. 24:1]]), as part of a diviner's work (see [[Num. 22:7]]).
      - **Offerings to the LORD.** One older reading holds that the burnt offerings “were offered by themselves to Jehovah, whom Balaam acknowledged as his God,” and explains the seven from the sacredness the number had “through the creation of the world in seven days.”
    sources: [pike-balaam, mcconkie-balaam, keil-numbers]

  - ref: 5
    phrase: the LORD put a word in Balaam’s mouth
    kind: scripture
    title: A word put in the mouth
    body: |
      Balaam went aside hoping the LORD would “meet” him (verse 3), and what he was given was a word to speak, in a figure of speech the Bible associates with prophecy. The LORD uses it of the prophet like Moses, “I will … put my words in his mouth” ([[Deut. 18:18]]), and of Jeremiah: “Behold, I have put my words in thy mouth” ([[Jer. 1:9]]). The next chapter says what Balaam's going aside had been: at the third altar “he went not, as at other times, to seek for enchantments” ([[Num. 24:1]]). Twice here (verses 5 and 16) he came back with words instead of an omen, and he says he can speak no others (verses 12 and 26; [[Num. 22:38]]).

      Whether the figure makes Balaam a prophet, and why later scripture condemns him, is taken up at [[Num. 22:18]]; the change at the third oracle, when “the spirit of God came upon him,” at [[Num. 24:2]].
    sources: [pike-balaam, lds-scriptures]

  - ref: 7
    phrase: he took up his parable
    kind: words
    title: “Took up his parable”
    body: |
      To “take up” a “parable” (Hebrew *māšāl*) is to pronounce an oracle, not to tell a story. The noun can mean a “proverb” or “wise saying,” and modern translations sometimes render it “oracle”; but “several prophetic passages combine the verb nāśāʾ (‘to lift, raise, carry’) and the noun māšāl to convey the sense of a mocking or taunting prophetic pronouncement against someone,” as when Isaiah is told to “take up this proverb against the king of Babylon” ([[Isa. 14:4]]). The words that could introduce a pronouncement against an enemy, the kind Balak had sent for, here introduce a blessing.

      All of Balaam's pronouncements are poetry set inside the prose of the story, and their “poetic form serves to portray their divine origin and to accentuate their significant content.”
    sources: [pike-balaam, lds-scriptures]

  - ref: 10
    phrase: Who can count the dust of Jacob, and the number of the fourth part of Israel?
    kind: scripture
    title: The dust of Jacob
    body: |
      Balaam's question takes up the LORD's promise to Abraham: “I will make thy seed as the dust of the earth: so that if a man can number the dust of the earth, then shall thy seed also be numbered” ([[Gen. 13:16]]). One older reading makes the link and adds that the beginning of the fulfilment “was already before their eyes.” Balak had complained that Israel “cover the face of the earth” ([[Num. 22:5]]), and one Latter-day Saint study finds that description reminiscent of the census at the start of Numbers, “which hearkens back to the promises made to the Patriarchs and Matriarchs in Genesis.”

      The same older reading explains “the fourth part” from the four camps of chapter 2, “of which he could see only one from his point of view” (see [[Num. 22:41]]). A modern translation reads the line differently: “or number the dust cloud of Israel?”
    sources: [keil-numbers, pike-balaam, nrsvue, lds-scriptures]

  - ref: 10
    phrase: Let me die the death of the righteous
    kind: history
    title: The death of the upright
    body: |
      Balaam wishes for himself the end of the people he was hired to curse. “The righteous” are “the upright” in a modern translation. One older reading takes the word as Israel's by “its divine calling,” and the wish as the thought “that the death of a pious Israelite was a desirable good.”

      Numbers later tells how Balaam died: “Balaam also the son of Beor they slew with the sword” among the kings of Midian ([[Num. 31:8]]). The report is “surprising,” since he had been shown “pronouncing blessings on the Israelites”; how the two portraits of Balaam stand together is taken up at [[Num. 31:16]].
    sources: [nrsvue, keil-numbers, pike-balaam, lds-scriptures]

  - ref: 19
    phrase: God is not a man, that he should lie; neither the son of man, that he should repent
    kind: scripture
    title: God is not a man, that he should repent
    body: |
      Balaam's answer to Balak's hope of a better result is that God does not take back what He has spoken; “repent” here means to change His mind, as a modern translation renders it: “or a mortal, that he should change his mind.” Yet elsewhere the King James says that the LORD “repented,” as at [[Ex. 32:14]], where the Joseph Smith Translation makes the repentance the people's (see the note there).

      One older reading draws a similar line: “With regard to His own counsels, God repents of nothing,” and the Bible's language of God's repenting is a human way of speaking of “the pain experienced by the love of God.” Samuel later refused Saul in nearly the same words: “the Strength of Israel will not lie nor repent: for he is not a man, that he should repent” ([[1 Sam. 15:29]]).
    sources: [lds-scriptures, jst-ex-32, keil-numbers, nrsvue]

  - ref: 21
    phrase: He hath not beheld iniquity in Jacob
    kind: words
    title: No iniquity in Jacob?
    body: |
      The line's two nouns can mean trouble and misery as well as wickedness, so it need not deny that Israel sinned. *ʾĀwen* is “trouble, sorrow, wickedness,” and the line can be rendered “he doth not behold trouble in Jacob,” with *ʿāmāl*, “misery,” in the parallel line; a modern translation has “He has not beheld misfortune in Jacob, nor has he seen trouble in Israel.” One older reading keeps the moral sense but limits it: God “discovers no reason for cursing the nation,” and “there is no denial of the sin of individuals.”

      “The shout of a king” is the LORD acclaimed as king, “acclaimed as a king among them” in a modern translation. In the older reading it is Israel rejoicing “that Jehovah dwells and rules as King in the midst of it”; He “had manifested Himself as King, by leading them out of Egypt” (verse 22).
    sources: [oshb-wlc, bdb, nrsvue, keil-numbers]

  - ref: 23
    phrase: Surely there is no enchantment against Jacob
    kind: history
    title: No enchantment against Jacob
    body: |
      The verse names the two arts Balaam was hired for, enchantment and divination, and says neither has power over Israel. Balak's messengers had come “with the rewards of divination in their hand” ([[Num. 22:7]]), and what he wanted was a curse that would change Israel's future (see [[Num. 22:6]]). Read with “against,” as the King James and a Latter-day Saint study have it, the line says that no such art succeeds against Israel.

      One older reading has “in” instead: “there is no augury in Jacob, and no divination in Israel.” On that reading Israel did not need them, because “God revealed His acts, His counsel, and His will to Israel in His word, which He had spoken at first to the patriarchs, and afterwards through Moses and the prophets.” Moses would later set the prophet the LORD would raise up against the diviners of the nations ([[Deut. 18:14–19]]).
    sources: [pike-balaam, keil-numbers, lds-scriptures]

  - ref: 24
    phrase: the people shall rise up as a great lion
    kind: symbol
    title: A lion that will not lie down
    body: |
      The oracle ends with an image of fierce strength that Jacob had once given to one tribe. He had said of Judah, “Judah is a lion's whelp … he stooped down, he couched as a lion, and as an old lion; who shall rouse him up?” ([[Gen. 49:9]]). One older reading notes that Balaam “here transfers to the whole nation” what was said of Judah, “to put to shame all the hopes indulged by the Moabitish king of the conquest and destruction of Israel.” Lions in the Bible are “primarily mentioned as biblical metaphors for terrifying fierceness”; Balak had hired a curse so that he might “smite them” ([[Num. 22:6]]), and the oracle answers with Israel as the lion. Balaam's third oracle returns to the lion ([[Num. 24:9]]).
    sources: [keil-numbers, sc-knowhy-757, lds-scriptures]

  - ref: 27
    phrase: peradventure it will please God that thou mayest curse me them from thence
    kind: history
    title: Another place, another try
    body: |
      Balak keeps moving Balaam because he hopes a different place, and a different view, will bring a different answer. From the first height Balaam saw “the utmost part of the people” ([[Num. 22:41]], where why Balak wanted Israel in sight is taken up); for the second Balak promised, “thou shalt see but the utmost part of them, and shalt not see them all” (verse 13); from Peor Balaam “saw Israel abiding in his tents according to their tribes” ([[Num. 24:2]]).
    sources: [lds-scriptures]

christ: |
  The LORD who would not curse Israel is Jehovah, the premortal Christ (see [[Ex. 3:14]]). Moses later gave the reason the curse failed: “the LORD thy God turned the curse into a blessing unto thee, because the LORD thy God loved thee” ([[Deut. 23:5]]). Paul speaks of another curse, the law's, and of how the blessing of Abraham reaches the nations: “Christ hath redeemed us from the curse of the law, being made a curse for us … That the blessing of Abraham might come on the Gentiles through Jesus Christ” ([[Gal. 3:13–14]]). The theme page [He Turned the Curse into a Blessing](/deuteronomy/themes/curse-into-blessing/) sets the two curses side by side.

  The blessing the Lord has spoken over His covenant people is not undone by anyone outside it: “God is not a man, that he should lie” (verse 19), and “the works, and the designs, and the purposes of God cannot be frustrated, neither can they come to naught” ([[D&C 3:1]]). The same revelation says what can fail: “it is not the work of God that is frustrated, but the work of men” ([[D&C 3:3]]). A disciple's blessing is not at the mercy of what others speak against it; it is kept or lost by the disciple's own faithfulness.

explore: |
  - **The rest of the oracles.** [[Num. 24:3–9]], the third, and [[Num. 24:15–19]], the star out of Jacob.
  - **How later scripture remembers it.** [[Deut. 23:4–5]]; [[Josh. 24:9–10]]; [[Neh. 13:2]]; [[Micah 6:5]].
  - **God's word that does not change.** [[1 Sam. 15:29]]; [[D&C 3:1–3]].

parallels:
  - ref: Deut. 23:4–5
    note: Moses gives Balaam's hiring as a reason Moab is barred, and says the LORD turned the curse into a blessing.
  - ref: Josh. 24:9–10
    note: Joshua recalls that the LORD would not hearken unto Balaam, and he blessed Israel still.
  - ref: Neh. 13:2
    note: Nehemiah reads the law of Deut. 23 and recalls the curse turned to blessing.
  - ref: Micah 6:5
    note: Micah calls Israel to remember what Balak consulted and what Balaam answered.

sources: [lds-scriptures, pike-balaam, mcconkie-balaam, keil-numbers, sc-knowhy-757, bdb, oshb-wlc, nrsvue, jst-ex-32, bd-balaam]
