chapter: 7
title: Gifts for the Altar
tagline: On the day the tabernacle is set up and anointed, the twelve princes of Israel bring wagons and oxen to carry it, and then, one a day for twelve days, the same gifts for the dedication of the altar. When Moses goes in to speak with the LORD, he hears the voice from above the mercy seat.
when: 'At Sinai, in the second year after the Exodus, from the day the tabernacle was set up ([[Ex. 40:17]]; [[Num. 7:1]])'

setting: |
  Numbers opens at Sinai, one of the book's “three main locations,” on the first day of the second month of the second year after Egypt ([[Num. 1:1]]). This chapter steps back. It begins “on the day that Moses had fully set up the tabernacle, and had anointed it” (verse 1), and the tabernacle was set up on the first day of the first month, a month earlier ([[Ex. 40:17]]); its anointing is told in [[Lev. 8:10–11]]. Yet verse 2 already speaks of princes who were “over them that were numbered,” the census of chapter 1.

  The text does not explain the order. One older reading holds that the gifts belong in time just after Leviticus 8:10 and are told here so as not to interrupt the laws given at Sinai, and because the wagons were needed for the march that was about to begin ([[Num. 10:11]]). Another takes “on the day” loosely, as “at the time when,” and points to verse 88, which closes the account “after that it was anointed.”

  The princes are the twelve tribal leaders named in [[Num. 1:5–15]]. The tabernacle and its furnishings are described at [[Ex. 25:8]], and the Levite families who carry it are given their charges in chapters 3 and 4.

thread: |
  The chapter tells of two gifts and an answer. The first gift is practical: six wagons and twelve oxen, which the LORD tells Moses to give the Levites for the service of the tabernacle (verses 1–9). The second is worship: on twelve successive days each prince brings the same silver dish and bowl full of flour and oil, the same golden pan of incense, and the same animals for burnt, sin and peace offerings (verses 10–83). The account is repeated in full for every tribe, then totaled (verses 84–88).

  The answer is verse 89. When Moses goes into the tent to speak with the LORD, the LORD speaks to him from above the mercy seat, as He had promised He would ([[Ex. 25:22]]). One older reading takes the voice as “Jehovah's reply to the joyfulness and readiness with which the princes of Israel responded to Him,” and finds in that “the reason for connecting” verse 89 “with the account of the dedicatory gifts.”

sections:
  - range: 1-3
    heading: Wagons from the princes
    plain: |
      On the day Moses finished setting up the tabernacle, and anointed and consecrated it with all its furnishings, the altar and all its vessels, the leaders of Israel brought an offering. They were the heads of their fathers' houses, the leaders of the tribes who had been in charge of the count. They brought their offering before the LORD: six covered wagons and twelve oxen, a wagon for every two leaders and an ox for each one.
  - range: 4-9
    heading: Given to the Levites by their work
    plain: |
      The LORD said to Moses, “Accept these from them, to be used in the work of the tent of meeting, and give them to the Levites, to each group as its work requires.” So Moses took the wagons and the oxen and gave them to the Levites. He gave two wagons and four oxen to the Gershonites, as their work required, and four wagons and eight oxen to the Merarites, as their work required, under the direction of Ithamar son of Aaron the priest. But he gave none to the Kohathites, because they were in charge of the holy things, which had to be carried on their shoulders.
  - range: 10-17
    heading: The first day, Judah
    plain: |
      The leaders also brought offerings for the dedication of the altar on the day it was anointed, and they presented them before the altar. The LORD said to Moses, “Let them present their offerings for the dedication of the altar one leader each day.”

      The one who brought his offering on the first day was Nahshon son of Amminadab, of the tribe of Judah. His offering was one silver dish weighing a hundred and thirty shekels and one silver bowl of seventy shekels, by the sanctuary's standard weight, both full of fine flour mixed with oil for a grain offering; one gold pan of ten shekels, full of incense; one young bull, one ram and one year-old lamb for a burnt offering; one goat for a sin offering; and for the peace offerings two oxen, five rams, five male goats and five year-old lambs. This was the offering of Nahshon son of Amminadab.
  - range: 18-83
    heading: Eleven more days, the same gift
    plain: |
      On each of the next eleven days another leader brought exactly the same offering: the silver dish and bowl full of flour and oil, the gold pan of incense, the animals for the burnt offering, the goat for the sin offering, and the oxen, rams, goats and lambs for the peace offerings.

      On the second day it was Nethaneel son of Zuar, leader of Issachar; on the third, Eliab son of Helon, of Zebulun; on the fourth, Elizur son of Shedeur, of Reuben; on the fifth, Shelumiel son of Zurishaddai, of Simeon; on the sixth, Eliasaph son of Deuel, of Gad; on the seventh, Elishama son of Ammihud, of Ephraim; on the eighth, Gamaliel son of Pedahzur, of Manasseh; on the ninth, Abidan son of Gideoni, of Benjamin; on the tenth, Ahiezer son of Ammishaddai, of Dan; on the eleventh, Pagiel son of Ocran, of Asher; and on the twelfth, Ahira son of Enan, of Naphtali.
  - range: 84-88
    heading: The sum of the dedication
    plain: |
      This was the dedication offering for the altar from the leaders of Israel when it was anointed: twelve silver dishes, twelve silver bowls and twelve gold pans. Each dish weighed a hundred and thirty shekels and each bowl seventy, so that all the silver came to two thousand four hundred shekels by the sanctuary's weight. The twelve gold pans full of incense weighed ten shekels each, a hundred and twenty shekels of gold in all. For the burnt offerings there were twelve bulls, twelve rams and twelve year-old lambs, with their grain offerings, and twelve goats for the sin offering. For the peace offerings there were twenty-four bulls, sixty rams, sixty male goats and sixty year-old lambs. This was the dedication offering for the altar after it was anointed.
  - range: 89
    heading: The voice from the mercy seat
    plain: |
      When Moses went into the tent of meeting to speak with the LORD, he heard the voice speaking to him from above the mercy seat on the ark of the testimony, from between the two cherubim. And the LORD spoke to him.

notes:
  - ref: 9
    phrase: they should bear upon their shoulders
    kind: history
    title: Why the sons of Kohath got no wagons
    body: |
      The Kohathites received no wagons because they carried the holy things themselves. When the camp moved, Aaron and his sons first covered “the sanctuary, and all the vessels of the sanctuary”; then “the sons of Kohath shall come to bear it: but they shall not touch any holy thing, lest they die” ([[Num. 4:15]]). The wagons went to the two families that carried the tabernacle's fabric and frame: Gershon, who bore “the curtains of the tabernacle” and its coverings and hangings, and Merari, with twice Gershon's share, who bore “the boards of the tabernacle, and the bars thereof, and the pillars thereof” (verses 7–8; [[Num. 4:25–26]]; [[Num. 4:31–32]]). Kohath's charge is the subject of the note on [[Num. 3:31]]; what happened when David later set the ark on a cart is told in the note on [[Num. 4:15]].
    sources: [lds-scriptures]

  - ref: 11
    phrase: each prince on his day
    kind: history
    title: Twelve days, twelve identical gifts
    body: |
      The LORD set one prince to each day, and the text then gives each prince's offering in full, word for word the same, twelve times over. The text gives no reason for either. One older reading finds a practical one for the twelve days: the gifts were for immediate sacrifice, and the court of the tabernacle could not have received, slaughtered and prepared 252 animals in a day, nor could the altar have burned 36 whole animals and the fat of 216 more. Another older reading takes the repetition as deliberate: what sounds monotonous “to modern ears” let the writer “emphasize by this means the liberality of the princes.”

      The order of the days is not random. It is the order of the camp in chapter 2, beginning with Judah, camped on the east toward the sunrise and the first to set out on the march, and ending with Naphtali ([[Num. 2:3]]; [[Num. 10:14]]; [[Num. 2:29]]). For scale, the silver dish of 130 shekels weighed, on one older estimate, “about 4 1/2 lbs.” Verses 84–88 add it all up: 2,400 shekels of silver, 120 of gold, and 252 animals.
    sources: [keil-numbers, cambridge-numbers, lds-scriptures]

  - ref: 89
    phrase: he heard the voice of one speaking unto him from off the mercy seat
    kind: scripture
    title: The LORD answers from the mercy seat
    body: |
      The LORD speaks once His house is dedicated. With the tabernacle set up and the altar dedicated, He speaks to Moses from above the mercy seat, keeping the promise of [[Ex. 25:22]] (on the mercy seat itself, see the note on [[Ex. 25:17]]).

      That order follows a pattern of ancient temple-building: once a temple was finished, the people offered sacrifices, and “after the temple is dedicated, God comes to His new house in glory,” and “blessings of power and authority are bestowed on the prophet or king who built it.” The tabernacle fits it. The cloud filled it when it was finished ([[Ex. 40:34]]), as it later filled Solomon's temple ([[1 Kgs. 8:10–11]]), and here “Moses heard the voice of God speaking from the mercy seat.”
    sources: [sc-knowhy-806, lds-scriptures]

christ: |
  The LORD who speaks to Moses from above the mercy seat is Jehovah, the premortal Christ (see [[Ex. 3:14]]), and the place He spoke from was the lid on which the high priest sprinkled the blood of the sin offering on the Day of Atonement ([[Lev. 16:14–15]]). Hebrews names “the cherubims of glory shadowing the mercyseat” among the furnishings of that first sanctuary ([[Heb. 9:5]]) and calls such holy places “the figures of the true,” for Christ has entered “into heaven itself, now to appear in the presence of God for us” ([[Heb. 9:24]]).

  The same Lord appeared in the temple at Kirtland in 1836 and said, “I have accepted this house, and my name shall be here; and I will manifest myself to my people in mercy in this house” ([[D&C 110:7]]). Temples in this dispensation are still built “through the sacrifice and consecration of the people,” and each, when it is dedicated, “is accepted as a house of the Lord.” The Lord who told Moses to take the princes' gifts (verse 5) accepts what His people consecrate to His house.

explore: |
  - **The Levites' burdens.** [[Num. 4:1–33]], the charges of Kohath, Gershon and Merari.
  - **The ark carried rightly.** [[2 Sam. 6:1–15]] and [[1 Chr. 15:1–15]].
  - **The mercy seat.** [[Ex. 25:17–22]] and [[Lev. 16:2]], [[Lev. 16:14–15]].
  - **Other dedications.** Solomon's temple, [[1 Kgs. 8:1–11]], [[1 Kgs. 8:62–64]]; the Kirtland Temple, [[D&C 109:1–5]] and [[D&C 110:1–10]].

