chapter: 4
title: The Burden of the Sons of Levi
tagline: Before the camp moves, Aaron and his sons wrap each holy thing of the tabernacle; then the three families of Levi carry it, each its own load. Moses counts the men from thirty to fifty who can bear it, 8,580 of them.
when: 'At Sinai, in the second year after the Exodus ([[Num. 1:1]]).'

setting: |
  Numbers opens in Israel's last weeks at Mount Sinai, where the people had made their covenant with the Lord and built the tabernacle “according to divine design.” The book's English name comes from its countings: the fighting men in chapters 1 and 26, and the Levites in chapters 3–4 and 26. Chapter 3 counted every Levite male “from a month old and upward,” twenty-two thousand of them ([[Num. 3:39]]), because the LORD took the Levites in place of Israel's firstborn (see the note at [[Num. 3:12]]). Chapter 4 counts them again for another purpose: only the men from thirty to fifty, who could do the work of moving the sanctuary.

  The tabernacle and its furniture are described in Exodus (see [[Ex. 25:8]], and [[Ex. 25:5]] for the “badgers' skins”). This chapter tells how that dwelling was taken down and carried. Kohath was Levi's second son ([[Num. 3:17]]), but he comes first here, probably because his grandsons were Moses and Aaron, sons of his son Amram ([[Ex. 6:18–20]]), and because his descendants carried the sacred furniture. When Israel left Sinai, the Levites set out carrying their burdens as this chapter orders them ([[Num. 10:17]]; [[Num. 10:21]]).

thread: |
  The chapter is a set of instructions for moving holy things without anyone dying, and it works from the center outward. First the priests: when the camp sets forward, Aaron and his sons go into the tabernacle, take down the veil that separated the holy place from the most holy, wrap the ark in it, and then wrap each piece of the holy furniture in its own coverings (verses 5–14). Only then may the Kohathites come in and carry, and they carry on their shoulders (verse 15; [[Num. 7:9]]). One older reading pictures their finished load as “six large packages,” of which only the ark wore a colored cloth on the outside, the blue of verse 6, which made it “a conspicuous object on the march.” The Gershonites carry the fabrics: the curtains, the coverings and the hangings of the court (verses 24–26). The Merarites carry the frame: boards, bars, pillars, sockets, pins and cords, each item assigned “by name” (verses 31–32). These two families had wagons ([[Num. 7:7–8]]).

  The order follows the tabernacle's own grades of holiness, for holiness was not “a one-dimensional state”: there were “levels of holiness.” The nearer a thing stood to the ark, the more carefully it was handled. The priests wrapped it; the Kohathites bore it but might not touch it or look on it (verses 15, 20); Gershon and Merari handled the outer structure. Oversight runs the same way. Eleazar the priest kept the oil, the incense, the daily offering and the anointing oil, and the oversight of the whole sanctuary (verse 16); his brother Ithamar directed Gershon and Merari (verses 28, 33).

  The chapter ends with the count: 2,750 Kohathites, 2,630 Gershonites and 3,200 Merarites, 8,580 men fit to bear the burden (verses 36–48), each one “numbered … according to his service, and according to his burden” (verse 49).

sections:
  - range: 1-16
    heading: What the sons of Kohath carry
    plain: |
      The LORD said to Moses and Aaron, “Count the sons of Kohath among the Levites, by their clans and their fathers' houses, every man from thirty to fifty years old who enters the service, to do the work in the tabernacle of the congregation. This is the work of the sons of Kohath there: the most holy things.

      “When the camp is about to move, Aaron and his sons shall go in, take down the screening veil, and cover the ark of the testimony with it. Over that they shall put a covering of leather, spread over all a cloth entirely of blue, and put the carrying poles in place. On the table of the bread of the presence they shall spread a blue cloth and set on it the dishes, the spoons, the bowls and the covers, with the bread that is always there; over these they shall spread a scarlet cloth, cover that with leather, and put in its poles. They shall take a blue cloth and cover the lampstand with its lamps, its tongs, its trays and all the oil vessels used in tending it, wrap it all in leather, and set it on a carrying pole. On the golden altar they shall spread a blue cloth, cover it with leather, and put in its poles. All the other utensils of the sanctuary they shall wrap in blue, cover with leather, and set on a carrying pole. They shall clear the ashes from the altar of burnt offering and spread a purple cloth over it, set on it all its utensils, the firepans, the forks, the shovels and the basins, cover it with leather, and put in its poles.

      “When Aaron and his sons have finished covering the sanctuary and all its furnishings, and the camp is ready to set out, then the sons of Kohath shall come and carry it. But they must not touch the holy things, or they will die. This is what the sons of Kohath carry. Eleazar, the son of Aaron the priest, shall have charge of the oil for the light, the sweet incense, the daily grain offering and the anointing oil, and the oversight of the whole tabernacle and everything in it, the sanctuary and its furnishings.”
  - range: 17-20
    heading: That they may live
    plain: |
      The LORD said to Moses and Aaron, “Do not let the clans of the Kohathites be destroyed from among the Levites. Do this for them, so that they may live and not die when they come near the most holy things: Aaron and his sons shall go in and assign each man his task and his load. But the Kohathites must not go in to look at the holy things, not even for a moment, or they will die.”
  - range: 21-28
    heading: What the sons of Gershon carry
    plain: |
      The LORD said to Moses, “Count the sons of Gershon too, by their fathers' houses and their clans, every man from thirty to fifty years old who enters the service, to do the work in the tabernacle of the congregation. This is the work of the Gershonite clans, their service and their loads. They shall carry the curtains of the tabernacle, the tent with its covering and the leather covering over it, the screen for the door of the tabernacle, the hangings of the court, the screen for the gate of the court that surrounds the tabernacle and the altar, their cords, and all the equipment for their use. All their work and all their loads shall be as Aaron and his sons direct; you shall assign to them what they are to carry. This is the service of the Gershonite clans in the tabernacle, under the direction of Ithamar, the son of Aaron the priest.”
  - range: 29-33
    heading: What the sons of Merari carry
    plain: |
      “Count the sons of Merari by their clans and their fathers' houses, every man from thirty to fifty years old who enters the service, to do the work of the tabernacle. This is what they are charged to carry: the boards of the tabernacle, its bars, its pillars and its bases, and the pillars of the court all around with their bases, pegs and cords, and all their equipment. You shall assign by name the items each man is to carry. This is the service of the Merarite clans in the tabernacle, under the direction of Ithamar, the son of Aaron the priest.”
  - range: 34-49
    heading: The count
    plain: |
      So Moses, Aaron and the leaders of the congregation counted the Kohathites by their clans and fathers' houses, every man from thirty to fifty who entered the service of the tabernacle: there were 2,750. Moses and Aaron counted them as the LORD had commanded through Moses. The sons of Gershon, counted in the same way, were 2,630, and the sons of Merari 3,200. All the Levites whom Moses, Aaron and the leaders of Israel counted, every man from thirty to fifty who came to do the work of serving and of carrying in the tabernacle, were 8,580. As the LORD commanded through Moses, each was counted by his own task and his own load.

notes:
  - ref: 3
    phrase: From thirty years old and upward even until fifty years old
    kind: history
    title: Thirty here, twenty-five and twenty elsewhere
    body: |
      The Levites' age of service differs from passage to passage, and scripture gives a reason only for the last change. Here they serve from thirty to fifty; in [[Num. 8:24–26]] they begin at twenty-five and at fifty move to a lighter charge. David first counted them “from the age of thirty years and upward” ([[1 Chr. 23:3]]), and later “from twenty years old and above” ([[1 Chr. 23:27]]), giving his reason: the Levites “shall no more carry the tabernacle, nor any vessels of it for the service thereof” ([[1 Chr. 23:26]]).

      For the difference within Numbers there are two older readings. One takes David's line: carrying the tabernacle “required the strength of a full-grown man, and therefore the more advanced age of thirty years,” while the duties at the tabernacle once it was standing were lighter and “could easily be performed from the twenty-fifth year.” The other takes the ages instead as “the customs that were current at three different periods.” Either way, this chapter counts the men for “the service of the burden” (verse 47). The word the King James renders “host” in this verse generally means warfare or an army; used of the Levites' work it is unusual, found only here and in [[Num. 8:24–25]], and it may imply that the Levites were an organized body “under the command of superior officials, as were the rest of Israel who were numbered for war” (compare [[Num. 1:3]]).
    sources: [lds-scriptures, keil-numbers, cambridge-numbers]

  - ref: 15
    phrase: they shall not touch any holy thing, lest they die
    kind: history
    title: Carried but never touched
    body: |
      The Kohathites carried the most holy things but could not touch them, and the only reason the verse gives is “lest they die.” The Church's footnote reads “any holy thing” as the things “of the sanctuary (more particularly the ark).” So the priests did all the wrapping first (verses 5–14), and the Kohathites took up loads already covered (verses 15, 19–20).

      Scripture records what happened when the rule was not kept, and the Church's footnote to this verse points there. When David first brought the ark toward Jerusalem it rode “in a new cart,” and when the oxen stumbled “Uzza put forth his hand to hold the ark,” and the LORD smote him ([[1 Chr. 13:7–10]]). At the second attempt David said, “None ought to carry the ark of God but the Levites” ([[1 Chr. 15:2]]), and he explained the first failure: “we sought him not after the due order” ([[1 Chr. 15:13]]). The order he returned to is this chapter's: the Levites “bare the ark of God upon their shoulders with the staves thereon, as Moses commanded” ([[1 Chr. 15:15]]).
    sources: [lds-scriptures]

  - ref: 20
    phrase: to see when the holy things are covered
    kind: words
    title: Not even for a moment
    body: |
      The King James “when the holy things are covered” renders a Hebrew expression that means the Kohathites must not look on the holy things even for an instant. The Hebrew *kə-ballaʿ* is literally “as a swallowing,” that is, “for an instant”: no longer than it takes to swallow. A modern translation reads, “the Kohathites must not go in to look on the holy things even for a moment, or they will die,” and the plain-words rendering above follows it.

      Verses 18–20 are spoken to Moses and Aaron, not to the Kohathites. “Cut ye not off” means, in the same modern translation, “You must not let the tribe of the clans of the Kohathites be destroyed from among the Levites.” What keeps them alive is given to the priests: Aaron and his sons go in and assign every man his task and his load (verse 19).
    sources: [bdb, nrsvue]

christ: |
  The tabernacle these men carried was the dwelling of Jehovah, the premortal Christ (see [[Ex. 3:14]]), and the service this chapter counts began at thirty, “the same age as the Savior was when He began His earthly ministry.” Luke gives Jesus' age at His baptism as “about thirty years” ([[Luke 3:23]]). Every rule in the chapter guards the line between the most holy and everyone else. Hebrews reads that tabernacle, where only the high priest entered the second room, once a year ([[Heb. 9:7]]), as the Holy Ghost “signifying, that the way into the holiest of all was not yet made manifest, while as the first tabernacle was yet standing” ([[Heb. 9:8]]), and it says that Christ has opened that way “by a new and living way, which he hath consecrated for us, through the veil, that is to say, his flesh” ([[Heb. 10:20]]).

  What the Kohathites could not look on even for a moment is, through Him, open to every disciple: Hebrews speaks of “boldness to enter into the holiest by the blood of Jesus” ([[Heb. 10:19]]), for those who come “with a true heart in full assurance of faith” ([[Heb. 10:22]]).

explore: |
  - **The tabernacle on the march.** [[Num. 10:11–28]], where the Levites set out with the burdens this chapter assigns.
  - **The way into the holiest.** [[Heb. 9:1–12]], Hebrews' account of the tabernacle and its two rooms.

