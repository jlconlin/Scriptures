chapter: 27
title: The Daughters Speak Right
tagline: Five daughters ask for their father's inheritance and the LORD gives Israel a law; Moses is told he will see the land and die, and Joshua is set apart to lead.
when: 'On the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Numbers 27 is set on the plains of Moab, just after the second census. That census, taken “in the plains of Moab by Jordan near Jericho” ([[Num. 26:63]]), found that of the men counted at Sinai not one was left “save Caleb the son of Jephunneh, and Joshua the son of Nun” ([[Num. 26:65]]). The land was to be divided among the families it counted, “according to the number of names” ([[Num. 26:53]]). Aaron has died on mount Hor, in the fortieth year after the Exodus ([[Num. 20:28]]; [[Num. 33:38]]), and Eleazar his son now stands beside Moses as priest; the two of them took the census together ([[Num. 26:63]]).

  The chapter has two scenes, and both look ahead to life in the land. Five daughters ask for the inheritance their father would have had, and Moses, told that he will see the land but not enter it, asks the LORD for a man to lead Israel after him. Both stories go on in later scripture. The daughters return in [[Num. 36]], when their kinsmen ask what happens to the land if they marry, and they receive it in Joshua's day ([[Josh. 17:3–6]]). Moses' charge to Joshua is told again at [[Deut. 31:7]], and the laying on of hands is remembered at [[Deut. 34:9]].

thread: |
  Numbers 27 asks **who will carry Israel into the land**, and both answers come from the LORD. The new census counted the men of each family, and the land was to be divided by those names ([[Num. 26:53–55]]); Zelophehad's family appears in it only as a father who “had no sons, but daughters” ([[Num. 26:33]]). His daughters ask for his share, Moses takes their question to the LORD, and the LORD answers with a law for every family in Israel that has no son (verses 1–11).

  Then the LORD tells Moses of his own end: he will see the land from the mountains of Abarim and be gathered to his people, as Aaron was, because of Meribah (verses 12–14). Moses' answer is a request for the people, not for himself: he asks for a shepherd for the congregation, and the LORD names Joshua, a man in whom is the spirit, to be set apart before Eleazar and all Israel with a share of Moses' honour (verses 15–23). The chapter that began with a family's place in the land ends with the people's leader into it.

sections:
  - range: 1-4
    heading: The daughters of Zelophehad
    plain: |
      Then the daughters of Zelophehad came forward. Zelophehad was the son of Hepher, son of Gilead, son of Machir, son of Manasseh, of the families of Manasseh the son of Joseph. His daughters were Mahlah, Noah, Hoglah, Milcah, and Tirzah. They stood before Moses, Eleazar the priest, the leaders, and the whole congregation at the entrance of the tent of meeting, and said: Our father died in the wilderness. He was not one of Korah's company, who banded together against the LORD; he died for his own sin, and he had no sons. Why should our father's name disappear from his family because he had no son? Give us a holding among our father's brothers.
  - range: 5-11
    heading: A law of inheritance
    plain: |
      Moses brought their case before the LORD, and the LORD said to Moses: The daughters of Zelophehad are right. You shall certainly give them a hereditary holding among their father's brothers, and pass their father's inheritance on to them. And tell the Israelites: If a man dies and has no son, his inheritance shall pass to his daughter. If he has no daughter, give it to his brothers. If he has no brothers, give it to his father's brothers. And if his father has no brothers, give it to the nearest relative in his family, who shall possess it. This shall be a standing law for the Israelites, as the LORD commanded Moses.
  - range: 12-14
    heading: Moses will see the land
    plain: |
      The LORD said to Moses: Go up into this mountain range of Abarim and see the land I have given to the Israelites. When you have seen it, you too shall be gathered to your people, as your brother Aaron was. For in the wilderness of Zin, when the congregation quarreled, you both rebelled against my command to show my holiness before their eyes at the water. That was the water of Meribah at Kadesh, in the wilderness of Zin.
  - range: 15-17
    heading: Moses asks for a shepherd
    plain: |
      Moses said to the LORD: Let the LORD, the God of the spirits of all flesh, appoint a man over the congregation, who will go out before them and come in before them, and lead them out and bring them in, so that the LORD's congregation will not be like sheep without a shepherd.
  - range: 18-23
    heading: Joshua set apart
    plain: |
      The LORD said to Moses: Take Joshua the son of Nun, a man in whom is the spirit, and lay your hand on him. Have him stand before Eleazar the priest and the whole congregation, and give him his charge in their sight. Give him some of your honour, so that the whole congregation of Israel will obey him. He shall stand before Eleazar the priest, who shall ask for him the judgment of the Urim before the LORD; at his word they shall go out and at his word come in, he and all the Israelites with him, the whole congregation. Moses did as the LORD commanded. He took Joshua and had him stand before Eleazar the priest and the whole congregation, laid his hands on him, and gave him his charge, as the LORD had spoken through Moses.

notes:
  - ref: 1
    phrase: Then came the daughters of Zelophehad
    kind: history
    title: Five daughters the census left out
    body: |
      The daughters came because the census had left their family without a share. The land was to be divided “according to the number of names” of those counted ([[Num. 26:53]]), and those counted were men; Zelophehad's line appears only as a father who “had no sons, but daughters,” all five named ([[Num. 26:33]]). The men were counted “as a representation of the families in Israel that qualified for an inheritance,” and, “perhaps unbeknownst to Moses, this process caused families without a living male inheritor to be overlooked.”

      So the five stand at the door of the tabernacle before Moses, Eleazar, the princes and the whole congregation (verse 2) and ask in the open. Their petition changed the law. They “were able to significantly shape the law itself to the betterment of women's prospects in the ancient world,” and they “successfully challenged the practice that only sons inherited land.” What else the law of Moses provided for women is gathered in the volume guide [Women and Marriage](/old-testament/guides/women-and-marriage/#the-law).
    sources: [langi-epilogue, sc-knowhy-639, strathearn-ruth, lds-scriptures]

  - ref: 3
    phrase: died in his own sin
    kind: words
    title: “Died in his own sin”
    body: |
      The daughters are saying that their father died as the rest of his generation died, not as a rebel. Every man counted at Sinai except Caleb and Joshua died in the wilderness, for “the LORD had said of them, They shall surely die in the wilderness” ([[Num. 26:65]]). Korah's company was a different case: they rose against Moses and Aaron and the earth swallowed them ([[Num. 16:32]]; the rebellion is explained at [[Num. 16:3]]). One older reading takes the daughters' point this way: their father had not joined Korah, a rebellion “which might have occasioned his exclusion from any participation in the promised land,” but died “on account of such a sin as every one commits, and such as all who died in the wilderness had committed as well as he.” The verse does not say what his sin was.
    sources: [keil-numbers, lds-scriptures]

  - ref: 4
    phrase: Why should the name of our father be done away from among his family
    kind: history
    title: Keeping a father's name
    body: |
      The daughters ask for land so that their father's name will not be “done away” from his family. On one older reading, land was how the name would be kept. With no inheritance, “his family would have become extinct, if his daughters had married into other families or tribes”; with one, the daughters “could then marry husbands who would enter upon their landed property, and their father's name and possession would be perpetuated through their children.” The same concern brings the family back in chapter 36, where the men of Gilead ask what will become of the land if the daughters marry into another tribe ([[Num. 36:6]] gives the answer).
    sources: [keil-numbers, lds-scriptures]

  - ref: 5
    phrase: And Moses brought their cause before the LORD
    kind: history
    title: Moses takes the case to the LORD
    body: |
      Moses did not settle the daughters' request himself, and it was “to Moses's credit” that “he took their plea before the Lord.” The LORD answered that they “speak right” (verse 7). The answer did more than settle one family's claim. It became a general law for every Israelite who died without a son (verses 8–11), “a statute of judgment” for all Israel (verse 11).

      It was carried out after Moses' death. The daughters came before Eleazar the priest, Joshua and the princes, reminded them that the LORD had commanded Moses to give them an inheritance, and received it among their father's brethren ([[Josh. 17:3–6]]).
    sources: [langi-epilogue, lds-scriptures]

  - ref: 8
    phrase: then ye shall cause his inheritance to pass unto his daughter
    kind: history
    title: The order of heirs
    body: |
      Verses 8–11 set the order in which a dead man's land passed: to his son, and if he had none to his daughter, then to his brothers, then to his father's brothers, then to his nearest kinsman. The list does not mention a widow. On one reading the brothers received the land “with the understanding that his widow would be cared for,” and an ostracon, a message written on a broken piece of pottery, from Judah in the days of Jeremiah and Lehi shows what such a widow might do. In it she pleads with an official for “the use, if not the outright ownership, of land or some other form of inheritance, presumably to (better) provide for her own needs.” The man she names was “probably her deceased husband or a close relative,” perhaps the husband's brother who had already received the wheat field, though that is asked as a question, not shown. The ostracon's authenticity has been questioned, and one of its first editors has rebutted the concerns.
    sources: [pike-inscriptions]

  - ref: 12
    phrase: Get thee up into this mount Abarim
    kind: history
    title: The mountains of Abarim
    body: |
      Abarim is a range of mountains, “the mountains from which Moses viewed the Promised Land.” When the command is repeated it names the peak: “Get thee up into this mountain Abarim, unto mount Nebo” ([[Deut. 32:49]]). The climb, and what Moses saw from the top, are at [[Deut. 34:1]].

      Moses is then to be “gathered unto thy people” as Aaron was (verse 13): the phrase is explained at [[Gen. 25:8]], and whether Moses died or was taken up is the question at [[Deut. 34:5]]. The reason given in verse 14, that Moses and Aaron rebelled at the water of Meribah, is the one given at Aaron's death ([[Num. 20:24]]); what happened there is at [[Num. 20:12]].
    sources: [bd-abarim, lds-scriptures]

  - ref: 16
    phrase: the God of the spirits of all flesh
    kind: scripture
    title: “The God of the spirits of all flesh”
    body: |
      Moses calls on the LORD by a title he and Aaron had used once before, when they fell on their faces to plead for the congregation in Korah's rebellion: “O God, the God of the spirits of all flesh” ([[Num. 16:22]]). A Latter-day Saint reading of the title at 16:22 takes it to imply “that God is the Father of all,” the God who told Moses, “I made the world, and men before they were in the flesh” ([[Moses 6:51]]). Moses asks that God to choose the man, one who will “go out” and “come in” before the people, the words of a leader's work explained at [[Deut. 31:2]].
    sources: [brown-premortal-life, lds-scriptures]

  - ref: 18
    phrase: a man in whom is the spirit, and lay thine hand upon him
    kind: prophets
    title: Joshua set apart by the laying on of hands
    body: |
      Joshua was chosen for the spirit in him and installed by Moses' hands. The Church's footnote on “the spirit” points to the Spirit of God (Topical Guide, “God, Spirit of”), and Deuteronomy joins the gift to the ordinance: “Joshua the son of Nun was full of the spirit of wisdom; for Moses had laid his hands upon him” ([[Deut. 34:9]]). It was done in public, before Eleazar and the whole congregation, with a charge given “in their sight” (verse 19; Moses' words of charge are at [[Deut. 31:7]]).

      In the Church the event is read as “the ordination and setting apart of Joshua to the priesthood held by Moses.” Elder Bruce R. McConkie, citing this passage, taught that “setting apart to positions of presidency, administration, or special responsibility” comes by the laying on of hands, as ordination to priesthood offices does. The Articles of Faith state the rule: “a man must be called of God, by prophecy, and by the laying on of hands by those who are in authority” ([[A of F 1:5]]).
    sources: [ot-manual-numbers-13-36, lds-scriptures]

  - ref: 20
    phrase: thou shalt put some of thine honour upon him
    kind: words
    title: Some of Moses' honour, not all of it
    body: |
      Joshua receives a share of Moses' authority, not the whole of it. The Hebrew word behind “honour,” *hôd*, means “splendour, majesty, vigour,” and is used of a king's majesty and of the glory God wears as king; the footnote's alternative rendering, “invest him with some of your authority,” gives its sense here. The LORD says “some of thine honour,” enough that the congregation “may be obedient.” One older reading explains the limit: Moses' authority was “bound up with his own person alone,” and Joshua received “only so much of it as he needed for the discharge of the duties of his office.”

      On the same reading, which points to [[Num. 12:6–8]], verse 21 shows the difference. The LORD spoke with Moses “mouth to mouth” ([[Num. 12:8]]); Joshua was to be “neither the lawgiver nor the absolute governor of Israel,” but was to stand before Eleazar, who would ask counsel for him “after the judgment of Urim,” the high priest's instrument of revelation explained at [[Ex. 28:30]].
    sources: [bdb, keil-numbers, lds-scriptures]

christ: |
  Moses asks the LORD, who is Jehovah, the premortal Christ (see [[Ex. 3:14]]), not to leave His congregation “as sheep which have no shepherd,” and the LORD gives them Joshua, whose name means “Jehovah is salvation” (see [[Num. 13:16]]). When Jesus saw the multitudes “as sheep having no shepherd,” He “was moved with compassion on them” ([[Matt. 9:36]]), and He said of Himself, “I am the good shepherd: the good shepherd giveth his life for the sheep” ([[John 10:11]]).

  Those who preside in His Church now are set apart as Joshua was, by the laying on of hands (see the note at verse 18), and no one is to preach His gospel or build up His church “except he be ordained by some one who has authority, and it is known to the church that he has authority” ([[D&C 42:11]]).

explore: |
  - **The daughters' inheritance carried out.** [[Num. 36:1–13]]; [[Josh. 17:3–6]].
  - **Moses' successor.** [[Deut. 3:21–28]]; [[Deut. 31:1–8]]; [[Deut. 34:9]]; [[Josh. 1:1–9]].
  - **Sheep without a shepherd, and the LORD as shepherd of His flock.** [[1 Kgs. 22:17]]; [[Ezek. 34:1–16]]; [[John 10:1–16]].

parallels:
  - ref: Num. 36:1–13
    note: The daughters' inheritance is kept within the tribe of Manasseh.
  - ref: Josh. 17:3–6
    note: The daughters receive their inheritance before Eleazar and Joshua.
  - ref: Deut. 32:48–52
    note: The LORD sends Moses up Abarim to Nebo, for the same reason given in verse 14.
  - ref: Deut. 34:9
    note: Joshua full of the spirit of wisdom, because Moses had laid his hands on him.

