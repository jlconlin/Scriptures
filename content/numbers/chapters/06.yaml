chapter: 6
title: Holy unto the LORD
tagline: Any man or woman of Israel may vow to be a Nazarite for a time, keeping from every fruit of the vine, letting the hair grow, and keeping away from the dead. Then the LORD gives Aaron and his sons the words with which to bless the people and put His name upon them.
when: 'At Sinai, in the second year after the Exodus ([[Num. 1:1]]; [[Num. 10:11]]).'

setting: |
  The first ten chapters of Numbers are the “preparation for departure from Sinai”: the people are counted, the camp is arranged and the Levites are given their charges (chapters 1–4), and on the twentieth day of the second month of the second year the cloud lifts and the march begins ([[Num. 10:11]]). Chapter 6 falls among the laws given before that day, and it holds two of them.

  The first, verses 1–21, is the law of the Nazarite, a man or woman under a vow “to abstain from wine, from any cutting of the hair, and any contact with the dead.” Numbers 6 is where the “full regulations” are given; the Nazarites of later scripture, Samson ([[Judg. 13:5]]), Samuel ([[1 Sam. 1:11]]), the Nazarites Israel gave wine to in Amos's day ([[Amos 2:11–12]]), stand on it.

  The second, verses 22–27, is the blessing Aaron and his sons were to speak over Israel. It is poetry, one of the “fragments of ancient poetry” the book preserves. Aaron had already blessed the people at the first sacrifices, when he “lifted up his hand toward the people, and blessed them” ([[Lev. 9:22]]); here the words are given. The Psalms pray them back (see the notes at [[Ps. 4:6]] and [[Ps. 67:1]]), and the risen Lord fulfilled them at Bountiful ([[3 Ne. 19:25]]).

thread: |
  The Nazarite law lets any Israelite share, for a time, in a holiness that otherwise belonged to the priests. Though “generally a layperson could not share in priestly holiness,” there were ways to become holy “even if it was for a short period of time. For example, they could participate in a Nazarite vow.” The law says it twice: “he shall be holy” (verse 5), “he is holy unto the LORD” (verse 8).

  Each of the vow's three marks can be set beside a priestly rule, and the Nazarite's consecrated life “bore some resemblance to that of the high priest.” The priests gave up wine while they served; the Nazarite gives up the vine altogether (verses 3–4; see the note on verse 4). The word for the consecration on the Nazarite's head, his uncut hair, is the word for the high priest's crown, and like the high priest he may not go near the dead, not even for his father or mother (verses 5–7; see the note on verse 7). One older reading, pointing to Israel's first calling at Sinai ([[Ex. 19:5]]), puts it so: his state was like that of the priests, “differing from the priesthood solely in the fact that it involved no official service at the sanctuary,” and was “a step towards the realization of the priestly character, which had been set before the whole nation as its goal at the time of its first calling.” The rest of the law tells what happens when the vow is broken by accident (verses 9–12) and how it ends, with sacrifices and the hair given to the fire (verses 13–21).

  The chapter then turns to a different law: the words the priests are to speak over the whole people. The text does not say why it follows the Nazarite law. The same older reading takes the blessing as the close of the ordering of Israel at Sinai, the words that “impressed the seal of perfection upon the whole order and organization of the people of God.” Its last verse says what the blessing does: the priests put the LORD's name upon Israel, and He blesses them (verse 27).

sections:
  - range: 1-8
    heading: The vow and its three marks
    plain: |
      The LORD said to Moses, “Tell the children of Israel: when a man or a woman makes the special vow of a Nazarite, to be set apart to the LORD, that person must keep away from wine and other alcoholic drink. He must not drink vinegar made from wine or from strong drink, or any grape juice, or eat grapes, fresh or dried. As long as he is set apart he must eat nothing that comes from the grapevine, from the kernels to the husk.

      “As long as his vow lasts no razor may touch his head. Until the days for which he set himself apart to the LORD are over, he is holy, and he must let the hair of his head grow long.

      “As long as he is set apart to the LORD he must not go near a dead body. He must not make himself unclean even for his father or mother, his brother or sister, when they die, because the consecration of his God is on his head. All the days he is set apart he is holy to the LORD.”
  - range: 9-12
    heading: If someone dies beside him
    plain: |
      “If someone dies suddenly beside him, and so defiles his consecrated head, he must shave his head on the day of his cleansing, the seventh day. On the eighth day he must bring two turtledoves or two young pigeons to the priest at the door of the tabernacle. The priest will offer one as a sin offering and the other as a burnt offering, and make atonement for him, because he became unclean by the dead; and that same day he will consecrate his head again. He must set himself apart to the LORD for the days of his vow once more and bring a yearling lamb as a trespass offering. The days he had already kept do not count, because his consecration was defiled.”
  - range: 13-21
    heading: When the days are fulfilled
    plain: |
      “This is the law of the Nazarite when the days of his vow are over. He is to be brought to the door of the tabernacle and present his offerings to the LORD: a yearling ram lamb without blemish for a burnt offering, a yearling ewe lamb without blemish for a sin offering, and a ram without blemish for a peace offering; a basket of unleavened bread, cakes of fine flour mixed with oil and unleavened wafers spread with oil; and the grain offerings and drink offerings that go with them. The priest will present them before the LORD, offer the sin offering and the burnt offering, then the ram as a peace offering with the basket of bread, and the grain and drink offerings.

      “At the door of the tabernacle the Nazarite will shave his consecrated head, take the hair, and put it in the fire under the peace offering. After he has shaved, the priest will take the cooked shoulder of the ram, one unleavened cake from the basket and one unleavened wafer, put them in the Nazarite's hands, and wave them as a wave offering before the LORD. It is holy, the priest's portion, along with the breast that is waved and the shoulder that is lifted up. After that the Nazarite may drink wine.

      “This is the law of the Nazarite who makes a vow, and of the offering he owes the LORD for being set apart, besides whatever else he can afford. He must do as he vowed, by the law of his consecration.”
  - range: 22-27
    heading: The blessing of Aaron and his sons
    plain: |
      The LORD said to Moses, “Tell Aaron and his sons: this is how you are to bless the children of Israel. Say to them:

      The LORD bless you and keep you.
      The LORD make His face shine on you and be gracious to you.
      The LORD lift up His countenance upon you and give you peace.

      “So they shall put My name on the children of Israel, and I will bless them.”

notes:
  - ref: 2
    phrase: to vow a vow of a Nazarite
    kind: words
    title: 'A Nazarite: one set apart to the LORD'
    body: |
      A Nazarite is one set apart to the LORD by a vow. The Hebrew *nāzîr* means one “consecrated, devoted,” and in this law it is one “dedicated to” the LORD “by vow involving abstinence from intoxicants, from touching corpse, and from cutting hair.” It comes from the verb *nāzar*, “separate,” and verse 2 has both the noun and the verb: the vow of a Nazarite, “to separate themselves” unto the LORD. “The days of his separation” through the chapter are the days of his *nēzer*, his consecration (see the note on verse 7). The first “separate” in the verse is a different verb: “shall separate themselves to vow” is the Hebrew idiom to “make a hard vow,” which also opens the vow of a person in [[Lev. 27:2]] and is discussed there.

      The law opens it to “either man or woman,” and the vow was “usually voluntary” and “for limited time.” It “might be lifelong, or for a short, definite period”; the vow in this chapter has an end, when “the days of his separation are fulfilled” (verse 13). Samson, Samuel and John the Baptist are among those who “seem to have taken such vows, or had parents who made the vows for them.” Samson's, by the angel's word to his mother ([[Judg. 13:5]]), was set “exceptionally, from birth.” Hannah promised that “there shall no razor come upon his head” ([[1 Sam. 1:11]]), and of John the angel said he “shall drink neither wine nor strong drink” ([[Luke 1:15]]).

      The word is not the same as “Nazarene.” Jesus was called a Nazarene ([[Matt. 2:23]]): the word means “belonging to Nazareth,” and “being a Nazarite had nothing to do with coming from the town of Nazareth.”
    sources: [bdb, strongs-concordance, oshb-wlc, bd-nazarite, ot-manual-numbers-1-12, bd-nazarene, lds-scriptures]

  - ref: 4
    phrase: from the kernels even to the husk
    kind: symbol
    title: The whole vine, not only the wine
    body: |
      The vow reaches past drink to every product of the grapevine, “from the kernels even to the husk”: vinegar, juice, fresh grapes and raisins (verse 3). The text gives no reason. Some of what is forbidden cannot make anyone drunk: “Vinegar, fresh and dried grapes, and food prepared from grapes and raisins, e.g., raisin-cakes, are not intoxicating.”

      The priests had a narrower rule. They were not to drink wine or strong drink “when ye go into the tabernacle of the congregation” ([[Lev. 10:9]]), so that the rule held while they served. The Nazarite gave up the whole plant for the whole time of the vow. One older reading holds that the purpose “can hardly have been, merely” to keep a clear head “like the priests when engaged in their duties”; it takes the vine as the emblem of pleasure itself: “The Nazarite was to avoid everything that proceeded from the vine, because its fruit was regarded as the sum and substance of all sensual enjoyments.” That is a reading, not the text's own explanation.

      Forcing a Nazarite to break the vow is the charge Amos brings against Israel: “ye gave the Nazarites wine to drink” ([[Amos 2:12]]).
    sources: [keil-numbers, lds-scriptures]

  - ref: 7
    phrase: the consecration of his God is upon his head
    kind: words
    title: His hair was his crown
    body: |
      The word translated “consecration” here, *nēzer*, is also the word for a crown, and on the Nazarite's head it is his uncut hair. It is the word for the high priest's holy crown, which was “made of gold” (see [[Ex. 29:6]] and [[Ex. 39:30]]). In Numbers 6 the “head of consecration” (verses 9, 18) is so called “because of unshorn hair,” and in verse 19 the word stands for the hair itself, “the hair of his consecration.” The same word is used of the high priest's anointing in [[Lev. 21:12]], whose note explains it there.

      So the uncut hair of verse 5 is the visible mark of the vow. Long hair was, “originally probably,” a “sign of consecration, as in Nazirite vow.” One older reading calls it “the diadem of his God upon his head,” “like the golden diadem upon the turban of the high priest,” and denies that it was a sign of holiness as such: it was regarded “simply as an ornament,” which the Nazarite “wore in honour of the Lord, as a sign that he ‘belonged to the Lord, and dedicated himself to His service,’ with all his vital powers.”

      It also answers why he could not bury his own parents. The high priest was forbidden the same thing ([[Lev. 21:11]]), and the Nazarite was “not even to defile himself for his parents, or his brothers and sisters, when they died, according to the law laid down for the high priest.”
    sources: [bdb, keil-numbers, lds-scriptures]

  - ref: 12
    phrase: the days that were before shall be lost
    kind: history
    title: An accident starts the count again
    body: |
      A Nazarite who was defiled, even by a death he could not prevent, lost every day he had kept and began the vow again. The case in verse 9 is a man who dies “very suddenly by him,” beside him, so that the Nazarite “involuntarily defiled his consecrated head.” He shaved on the seventh day, the day of his cleansing (the seven days of [[Num. 19:11]]), and on the eighth brought two birds, a sin offering and a burnt offering (verses 10–11).

      Then the days before “shall be lost”: “the days of consecration that had already elapsed were not to be reckoned,” and “he was therefore to commence the whole time of his consecration entirely afresh.” The lamb of verse 12 is a trespass offering, which one older reading explains as “a payment or recompense for being reinstated in the former state of consecration, from which he had fallen through his defilement.” The reason the verse gives is the defilement itself, not any fault: “because his separation was defiled.”
    sources: [keil-numbers, lds-scriptures]

  - ref: 18
    phrase: put it in the fire which is under the sacrifice of the peace offerings
    kind: symbol
    title: The hair given to the fire
    body: |
      At the end of the vow the hair that had marked the Nazarite as the LORD's was shaved and burned under the peace offering, given to the LORD with the sacrifice. One older reading puts it so: he was to “hand over and sacrifice to the Lord the hair of his head which had been worn in honour of Him.” Only after the priest had waved his portion could the Nazarite drink wine again (verse 20), “probably at the sacrificial meal, after the Lord had received His share of the sacrifice.”

      Two scenes in the New Testament “seem related to this vow.” In Jerusalem the elders asked Paul to join four men who had a vow, “and be at charges with them, that they may shave their heads” ([[Acts 21:24]]), and he entered the temple with them “to signify the accomplishment of the days of purification” ([[Acts 21:26]]). The other is Paul's shaving at Cenchrea ([[Acts 18:18]]). One older reading ties the paying of costs to a later custom: “when poor persons took the Nazarite's vow upon them, those who were better off defrayed the expenses of the sacrifices.”
    sources: [keil-numbers, ot-manual-numbers-1-12, lds-scriptures]

  - ref: 24
    phrase: The LORD bless thee, and keep thee
    kind: history
    title: An old blessing, found on silver
    body: |
      A form of this blessing survives on two silver amulets from about 600 BC. The blessing itself is three short lines, each naming the LORD and each asking two things of Him. One older reading describes its form as “a triple blessing of two members each,” in which “the second in each case contained a special application of the first,” so that the three lines unfold the blessing “step by step with ever increasing emphasis.”

      In 1979 “two small rolls of inscribed silver foil were discovered” in a burial repository at Ketef Hinnom, just west of ancient Jerusalem. They “date to about 600 BC,” and their wear suggests they had been worn on a cord, perhaps around someone's neck, as amulets. Unrolled, the text is “remarkably similar to the Aaronic priestly blessing contained in Numbers 6:24–26, although not completely rendered”; the smaller reads, “May YHWH bless you and keep you. … May YHWH make his face shine [upon] you and give you peace.” They are “the oldest known attestation of a form of a biblical passage in its original language.” They also show a blessing first “pronounced by the priests over the congregation of Israel” worn by one person, “in an apparent effort to invoke divine protection against evil influences.”

      The blessing addresses Israel in the singular, “thee”; on that form of address, see [[Ps. 134:3]].
    sources: [keil-numbers, bd-numbers, pike-inscriptions]

  - ref: 25
    phrase: The LORD make his face shine upon thee
    kind: christ
    title: 'A face that shines: the Lord at Bountiful'
    body: |
      A shining face and a lifted countenance (verse 26) can be understood as God's approval turned toward His people, and the risen Lord gave both at Bountiful. Both expressions “can be understood to mean that God would show His divine approval towards His covenant people, or that He would ‘smile’ upon them,” and “some modern translations of both clauses” render them “may the Lord smile on you.”

      When the Savior prayed with the Nephite multitude, “Jesus blessed them as they did pray unto him; and his countenance did smile upon them, and the light of his countenance did shine upon them” ([[3 Ne. 19:25]]). The Church's edition there points back to this verse. On one Latter-day Saint reading, “Jesus was acting then as the great high priest,” and He fulfilled the words of the blessing: He “was ‘gracious’ unto them, and gave them ‘peace.’” The Psalms had prayed for the same light (see the notes at [[Ps. 4:6]] and [[Ps. 67:1]]).
    sources: [sc-knowhy-212, lds-scriptures]

  - ref: 27
    phrase: they shall put my name upon the children of Israel
    kind: scripture
    title: The name put upon Israel
    body: |
      The priests put the LORD's name on Israel in the blessing itself, whose three lines each begin with it (verses 24–26), and the LORD promises to do the blessing Himself: “and I will bless them.” The priests speak the words; the LORD is the one who blesses.

      By the time of Jesus, priests in the temple could say the name aloud on only two occasions: once a year “by the High Priest in the temple on the Day of Atonement,” or “during the daily recitation of the priestly benediction described in Numbers 6:22–27.” One Latter-day Saint reading sets this verse beside the high priest, who “wore the name of the Lord on his forehead when he went in to the Holy of Holies” (the plate engraved “HOLINESS TO THE LORD” [[Ex. 28:36]]), and sets beside that the Nephites, who “took upon themselves the name of Christ when they partook of the sacrament.”

      The Church's edition points from this verse to King Benjamin's sermon ([[Mosiah 5:12]]), where Benjamin told his people, “There is no other name given whereby salvation cometh; therefore, I would that ye should take upon you the name of Christ” ([[Mosiah 5:8]]).
    sources: [sc-knowhy-674, sc-knowhy-206, lds-scriptures]

christ: |
  The LORD whose name the priests put on Israel is Jehovah, who is “the premortal Jesus Christ” (see [[Ex. 3:14]]). At Bountiful He gave the blessing Himself: His countenance smiled and shone on those who prayed to Him ([[3 Ne. 19:25]]; see the note on verse 25).

  The Church's edition points from that name to the name of Christ that a disciple takes on now ([[Mosiah 5:12]]). Benjamin's people took “the name of Christ” in covenant ([[Mosiah 5:8]]), and at the sacrament disciples witness that they “are willing to take upon them the name of thy Son, and always remember him, and keep his commandments” ([[Moro. 4:3]]). The promise at the end of the blessing stands with that name: “I will bless them” (verse 27).

explore: |
  - **Nazarites in scripture.** Samson, [[Judg. 13:2–7]] and [[Judg. 16:17]]; Samuel, [[1 Sam. 1:11]]; John the Baptist, [[Luke 1:13–17]]; the charge of [[Amos 2:11–12]]; Paul in [[Acts 21:20–26]].
  - **The blessing prayed and fulfilled.** [[Ps. 4:6–8]], [[Ps. 67:1–2]], [[Ps. 80:3]], and the Savior's blessing in [[3 Ne. 19:19–30]].
  - **Taking the name.** [[Mosiah 5:7–12]] and the sacrament prayers, [[Moro. 4:3]] and [[Moro. 5:2]].

parallels:
  - ref: 3 Ne. 19:25
    note: The risen Lord blesses the Nephites, and His countenance smiles and shines upon them.
  - ref: Acts 21:23–26
    note: Paul joins four men at the end of a vow, pays for their offerings, and enters the temple with them.

