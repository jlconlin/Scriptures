chapter: 34
title: The Land with the Coasts Thereof
tagline: Before Israel crosses the Jordan, the LORD draws the borders of the land they will inherit and names the men who will divide it.
when: 'On the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Numbers 34 is spoken on the plains of Moab, at the end of the forty years. The chapter before it closes with the LORD's command for the crossing: “When ye are passed over Jordan into the land of Canaan,” drive out its inhabitants and “divide the land by lot for an inheritance among your families” ([[Num. 33:51–54]]). This chapter says what that land is. It draws the four sides of “the land of Canaan with the coasts thereof,” sets aside the tribes already settled east of the Jordan, and names the men who will share out the rest. Chapter 35 then gives the Levites their cities among the tribes ([[Num. 35:2]]).

  The land is the one promised to Abraham's seed, “all the land of Canaan, for an everlasting possession” ([[Gen. 17:8]]). In the book of Joshua the division ordered here is carried out by lot under “Eleazar the priest, and Joshua the son of Nun, and the heads of the fathers of the tribes” ([[Josh. 14:1]]), and Judah's southern border is the same line as the southern border here ([[Josh. 15:1–4]]). Ezekiel, in his vision of the land's future borders, names several of the same places again ([[Ezek. 47:15–20]]).

thread: |
  Numbers 34 is **a map drawn before the journey's end.** Israel has not crossed the Jordan, and the land's inhabitants are still to be driven out ([[Num. 33:52]]), yet the LORD speaks of it as already apportioned: “this is the land that shall fall unto you for an inheritance” (verse 2). The borders go around it in order, south, west, north and east (verses 3–12). The east and west sides are plain, the Jordan and the “great sea,” the Mediterranean; the north and south are uncertain, since hardly any of the places named on them have been identified. The southern line runs past Kadesh-barnea, the camp from which the spies had been sent ([[Num. 32:8]]).

  Then Moses says whom the land is for: “unto the nine tribes, and to the half tribe” (verse 13), since Reuben, Gad and half of Manasseh have already received their land east of the Jordan (verses 14–15; how that came about is at [[Num. 32:6]]). Last, the LORD names the men who will divide it: Eleazar and Joshua, with a prince from each of the ten tribes that will receive land west of the Jordan (verses 16–29). One older reading notes that the princes are listed, with some exceptions, in the order of their tribes' later territories from south to north, not in the order in which the lots came out in Joshua's account.

sections:
  - range: 1-12
    heading: The borders of the land
    plain: |
      The LORD said to Moses: Command the Israelites and tell them: When you come into the land of Canaan (this is the land that will fall to you as your inheritance, the land of Canaan and all its territory), your south side shall run from the wilderness of Zin along the side of Edom. Your southern border shall start on the east from the end of the Salt Sea. It shall turn south of the ascent of Akrabbim, pass on to Zin, and run south of Kadesh-barnea; then it shall go out to Hazar-addar and on to Azmon. From Azmon the border shall turn to the river of Egypt and end at the sea.

      For your western border you shall have the Great Sea, the Mediterranean, and its coast; that shall be your western border.

      This shall be your northern border: from the Great Sea mark out a line to mount Hor, and from mount Hor mark it out to the entrance of Hamath; the border shall go out to Zedad, go on to Ziphron, and end at Hazar-enan. That shall be your northern border.

      For your eastern border mark out a line from Hazar-enan to Shepham. The border shall go down from Shepham to Riblah, on the east side of Ain, and go down and reach the slopes on the east side of the sea of Chinnereth, the Sea of Galilee. Then the border shall go down along the Jordan and end at the Salt Sea. This shall be your land, with its borders all around.
  - range: 13-15
    heading: Nine tribes and a half
    plain: |
      Moses commanded the Israelites: This is the land you are to inherit by lot, which the LORD commanded to be given to the nine tribes and the half tribe. For the tribe of Reuben by its ancestral clans, the tribe of Gad by its ancestral clans, and half the tribe of Manasseh have already received their inheritance. The two tribes and the half tribe have received their inheritance across the Jordan, east of Jericho, toward the sunrise.
  - range: 16-29
    heading: The men who will divide the land
    plain: |
      The LORD said to Moses: These are the names of the men who are to divide the land for you: Eleazar the priest and Joshua son of Nun. And take one leader from each tribe to divide the land as an inheritance. These are their names: from the tribe of Judah, Caleb son of Jephunneh; from the tribe of Simeon, Shemuel son of Ammihud; from the tribe of Benjamin, Elidad son of Chislon; from the tribe of Dan, the leader Bukki son of Jogli; from the sons of Joseph, for the tribe of Manasseh, the leader Hanniel son of Ephod, and for the tribe of Ephraim, the leader Kemuel son of Shiphtan; from the tribe of Zebulun, the leader Elizaphan son of Parnach; from the tribe of Issachar, the leader Paltiel son of Azzan; from the tribe of Asher, the leader Ahihud son of Shelomi; and from the tribe of Naphtali, the leader Pedahel son of Ammihud. These are the men the LORD commanded to divide the inheritance among the Israelites in the land of Canaan.

notes:
  - ref: 2
    phrase: this is the land that shall fall unto you for an inheritance
    kind: history
    title: Borders never fully held
    body: |
      The borders of this chapter mark out the land as the LORD gave it, and in Joshua's day Israel did not yet hold all of it. When the land was divided, the LORD told him, “Thou art old and stricken in years, and there remaineth yet very much land to be possessed” ([[Josh. 13:1]]), and the list that follows leaves the north, “all Lebanon … unto the entering into Hamath,” among the land not yet taken ([[Josh. 13:4–5]]).

      Under Solomon the north looked different. The city of Hamath “seems to have come under the dominion of Solomon,” and when he dedicated the temple, “all Israel with him” kept the feast “from the entering in of Hamath unto the river of Egypt” ([[1 Kgs. 8:65]]), the northern and southern limits named in this chapter (verses 5, 8). The western side is another matter. One older reading holds that the Hebrews “never held a single spot on the Mediterranean coast with the possible exception of Carmel, and, at certain periods, Joppa,” and on that ground thinks it “probable” that these borders, like Ezekiel's, are “ideal,” the full extent of a land “never actually possessed by Israel.” Ezekiel draws the borders again for the land's future; the two lists are compared at [[Ezek. 47:15]].
    sources: [cambridge-numbers, keil-numbers, bd-hamath, lds-scriptures]

  - ref: 5
    phrase: the river of Egypt
    kind: words
    title: Not the Nile
    body: |
      “The river of Egypt” is not the Nile but a wadi, a torrent bed, in the Sinai peninsula. The Hebrew is *naḥal*, and one older reading warns that the King James “river of Egypt” “gives the erroneous impression that the Nile is meant.” The wadi, “now called Wâdy el-‘Arîsh,” rises in the middle of the Sinai peninsula and runs north into the Mediterranean about fifty miles southwest of Gaza; there the southern border reached the sea. (The site identifies Genesis's “river of Egypt” the same way: [[Gen. 15:18]].)

      Another older reading finds the whole southern border following the lie of the land: from the Arabah below the Salt Sea to the Mediterranean it runs “along valleys which form a natural division, and constitute more or less the boundary line between the desert and the cultivated land.” On that reading the border of the inheritance runs, roughly, where the wilderness ends.
    sources: [cambridge-numbers, keil-numbers]

  - ref: 7
    phrase: mount Hor
    kind: history
    title: Another mount Hor
    body: |
      This mount Hor stands in the north, on the line drawn from the Mediterranean, and is “quite distinct” from the mount Hor near Edom where Aaron died ([[Num. 20:22–28]]; [[Num. 33:38]]). Like nearly every place on the northern line, it has not been located. The “entering in of Hamath” (verse 8) “was the northern limit of the Promised Land” (on Hamath, see [[Num. 13:21]]), but one older reading holds that the northern border as a whole “cannot be determined with certainty”: of all its places, Hamath, the city on the Orontes, “is the only one whose situation is well known,” and even it does not fix the line, since it takes “Hamath” here to mean “the kingdom of Hamath, which was named after its capital,” not the town.
    sources: [cambridge-numbers, keil-numbers, bd-hamath]

  - ref: 17
    phrase: Eleazar the priest, and Joshua the son of Nun
    kind: history
    title: The priest and the leader
    body: |
      The two men set over the division are, on one older reading, the successors of Moses and Aaron as the civil and religious heads of the nation. Eleazar is named first. One older reading takes him to stand at the head as high priest, as the LORD had appointed when Joshua was set apart: Joshua “shall stand before Eleazar the priest, who shall ask counsel for him after the judgment of Urim before the LORD” ([[Num. 27:21]]). With them was a prince from each tribe (verse 18).

      Joshua records the three, priest, leader and heads of the tribes, dividing the land “by lot in Shiloh before the Lord, at the door of the tabernacle of the congregation” ([[Josh. 19:51]]); why a lot, and what it decided, is at [[Num. 26:55]].
    sources: [cambridge-numbers, keil-numbers, lds-scriptures]

  - ref: 19
    phrase: Of the tribe of Judah, Caleb the son of Jephunneh
    kind: scripture
    title: Caleb, the one name known
    body: |
      Caleb is the one prince in the list known from elsewhere; “the others are not mentioned anywhere else.” He had been Judah's man among the twelve spies, named in the same words: “Of the tribe of Judah, Caleb the son of Jephunneh” ([[Num. 13:6]]). He and Joshua alone of the men counted at Sinai were still alive ([[Num. 26:65]]), as the LORD had promised at Kadesh: “my servant Caleb, because he had another spirit with him, and hath followed me fully, him will I bring into the land whereinto he went” ([[Num. 14:24]]). Now he is named to help divide that land.

      Joshua tells the end of it. At eighty-five Caleb came to Joshua, reminded him of “the thing that the Lord said unto Moses the man of God concerning me and thee in Kadesh-barnea,” and asked for the hill country of the Anakims ([[Josh. 14:6–12]]). “Hebron therefore became the inheritance of Caleb the son of Jephunneh the Kenezite unto this day, because that he wholly followed the Lord God of Israel” ([[Josh. 14:14]]).
    sources: [keil-numbers, lds-scriptures]

christ: |
  The LORD who drew these borders is Jehovah, the premortal Christ (see [[Ex. 3:14]]), the Rock that went with Israel through the wilderness: “that Rock was Christ” ([[1 Cor. 10:4]]). In giving the land He kept His covenant with Abraham. Hebrews reads the land of promise as pointing past itself: Abraham “sojourned in the land of promise, as in a strange country,” and those who “died in faith, not having received the promises,” “desire a better country, that is, an heavenly” ([[Heb. 11:9]]; [[Heb. 11:13]]; [[Heb. 11:16]]).

  A disciple holds the Lord's promises the same way. This land was named and divided while Israel was still east of the Jordan, and the promises made to a disciple are as sure before they are received; like Abraham, a disciple can live “persuaded of them” ([[Heb. 11:13]]).

explore: |
  - **The land divided.** Joshua 13–19, the lots and borders of the tribes west of the Jordan, the division this chapter orders.
  - **The borders in Ezekiel's vision.** [[Ezek. 47:13–23]], where the strangers living among Israel receive an inheritance too.

parallels:
  - ref: Josh. 15:1–4
    note: Judah's southern border, the same line as verses 3–5.
  - ref: Josh. 14:1–5
    note: The land divided by lot under Eleazar and Joshua.
  - ref: Ezek. 47:15–20
    note: The borders of the land in Ezekiel's vision, with several of the same names.

