chapter: 5
title: The Unclean, the Wronged, and the Suspected Wife
tagline: The camp where the LORD dwells is kept clean, a wrong to a neighbour is confessed and repaid, and a wife suspected of adultery with no witness is set before the LORD for His judgment.
when: 'At Sinai, in the second year after the Exodus'

setting: |
  Numbers opens at Sinai “on the first day of the second month, in the second year after they were come out of the land of Egypt” ([[Num. 1:1]]), and its first part, chapters 1:1–10:10, is the “preparation for departure from Sinai.” Chapters 1–4 counted the tribes, set their tents around the tabernacle and gave the Levites their charges. Chapters 5 and 6 turn to “a miscellaneous collection of regulations on a variety of matters.” In one older reading, the first of these regulations is “very suitably placed” after those arrangements, made “to preserve the sacredness of the Dwelling of Jehovah.”

  Chapter 5 gives three laws: the unclean are sent out of the camp (verses 1–4), a wrong done to another is confessed and repaid (5–10), and a wife suspected of adultery is brought before the LORD (11–31). The first two restate laws already given in Leviticus (on uncleanness, Leviticus 12–15; on restitution, [[Lev. 6:1–7]]) and add to them. The third, the law of jealousy, has no parallel in the other law codes of the five books of Moses.

thread: |
  The chapter's three laws keep the camp fit for the LORD who dwells in it. The unclean are put outside “that they defile not their camps, in the midst whereof I dwell” (verse 3). A wrong done to a neighbour is “a trespass against the LORD” (verse 6). In one older reading, no such wrong was to be left unrepaired “in the congregation of Israel, which was encamped or dwelt around the sanctuary of Jehovah,” and a husband's suspicion of his wife, whether true or false, was a danger “to the foundation of the civil commonwealth,” and “irreconcilable with the holiness of the people of God.”

  The law of jealousy is the longest and the hardest to read. One older reading calls it an *ordeal*, a rite in which “the accused is subjected to a test, the visible results of which will be a conclusive divine sentence of innocence or guilt.” Another older reading refuses the word for this law, which in its view was “no ordeal whose effects were uncertain, like the ordeals of other nations, but a judgment of God.” The rite moves step by step: the husband brings his wife and a plain offering (verse 15); the priest prepares the water (17), sets her before the LORD (18), and puts her under an oath that names her innocence first (19) and the curse after (20–21). She answers, “Amen, amen” (22). The priest writes the curses and washes them into the water (23), offers the meal and gives her the water to drink (24–26). Then the outcome is left to the LORD (27–28). No person in the chapter carries out a punishment.

sections:
  - range: 1-4
    heading: The unclean put out of the camp
    plain: |
      The LORD told Moses: Command the Israelites to send out of the camp everyone with leprosy, everyone with a discharge, and everyone made unclean by contact with the dead. Send out men and women alike; put them outside the camp, so that they do not defile the camp where I live among them. The Israelites did it: they put them outside the camp, just as the LORD had told Moses.
  - range: 5-10
    heading: Confession and restitution
    plain: |
      The LORD told Moses: Tell the Israelites that when a man or a woman commits any of the wrongs people do to one another, and so breaks faith with the LORD, and that person is guilty, they must confess the sin they have done. The guilty person must repay the wrong in full, add a fifth to it, and give it to the one he wronged. If the wronged person has no kinsman to receive the repayment, it is to be paid to the LORD, that is, to the priest, besides the ram of atonement with which the priest makes atonement for him. Every holy contribution the Israelites bring to the priest belongs to him; whatever anyone gives the priest is his.
  - range: 11-22
    heading: The wife suspected, and the oath
    plain: |
      The LORD told Moses: Tell the Israelites this. Suppose a man's wife strays and is unfaithful to him, and another man lies with her, but it is hidden from her husband and kept secret; she is defiled, but there is no witness against her and she was not caught in the act. And suppose a spirit of jealousy comes over him and he suspects his wife, and she is defiled; or he suspects her, and she is not. Then the man is to bring his wife to the priest, with an offering for her: a tenth of an ephah of barley meal, with no oil poured on it and no frankincense, because it is an offering of jealousy, an offering of remembrance that brings wrongdoing to mind.

      The priest is to bring her near and set her before the LORD. He is to take holy water in a clay vessel, and take some dust from the tabernacle floor and put it in the water. He is to set the woman before the LORD, uncover her head, and put the offering of remembrance, the jealousy offering, in her hands, while he holds the bitter water that brings the curse. Then the priest is to put her under oath and say: If no man has lain with you, and you have not strayed into uncleanness with another instead of your husband, be free of this bitter water that brings the curse. But if you have strayed to another instead of your husband and been defiled, and a man other than your husband has lain with you—here the priest puts the woman under the oath of the curse and says to her—may the LORD make you a curse and an oath among your people, when the LORD makes your thigh waste away and your belly swell; may this water that brings the curse go into your body to make your belly swell and your thigh waste away. And the woman is to say, Amen, amen.
  - range: 23-31
    heading: The water and the verdict
    plain: |
      The priest is to write these curses on a scroll and wash them off into the bitter water. He is to make the woman drink the bitter water that brings the curse, and it will go into her and become bitter. The priest is to take the jealousy offering from her hands, present it before the LORD and bring it to the altar; he is to take a handful of it as its memorial portion and burn it on the altar, and afterward make the woman drink the water. When she has drunk it, if she has defiled herself and been unfaithful to her husband, the water that brings the curse will go into her and become bitter, her belly will swell and her thigh waste away, and she will be a curse among her people. But if the woman has not defiled herself and is clean, she will be free and will conceive children.

      This is the law of jealousy, for when a wife goes aside to another instead of her husband and is defiled, or when a spirit of jealousy comes over a husband and he suspects his wife: he is to set her before the LORD, and the priest is to carry out this whole law for her. The man will be free of guilt, and the woman will bear her own guilt.

notes:
  - ref: 3
    phrase: that they defile not their camps, in the midst whereof I dwell
    kind: history
    title: Why the unclean were put out of the camp
    body: |
      The unclean were sent out because the LORD lived in the camp, and the verse says so. One older reading gives two reasons: the diseases were contagious, “and therefore there was a necessity of putting those afflicted by them apart,” and “the camp was the habitation of God, and nothing impure should be permitted to remain where he dwelt.” In another older reading, “Because of His presence the whole camp … was sacred, and all pollution must be rigorously avoided,” and Numbers later applies the same rule to the whole land: “Defile not therefore the land which ye shall inhabit, wherein I dwell” ([[Num. 35:34]]). The three kinds in verse 2 are the uncleanness of leprosy ([[Lev. 13]]), of a discharge ([[Lev. 15:2]]), and of contact with the dead ([[Num. 19:11]]). Clean and unclean are explained at the setting of [[Lev. 11]], and the leper's place outside the camp at [[Lev. 13:46]].

      Being put out did not mean being cast off. Removal from the camp “implied only a separation from the main body, not a total rejection or abandonment.” The law says “Both male and female” (verse 3): it applied to everyone alike.
    sources: [cambridge-numbers, keil-numbers, ot-manual-numbers-1-12, lds-scriptures]

  - ref: 8
    phrase: if the man have no kinsman to recompense the trespass unto
    kind: history
    title: When the wronged man has no kinsman
    body: |
      Verse 8 settles who is paid when the man who was wronged has died and left no relative to receive what he was owed. Numbers renews the law of restitution given in [[Lev. 6:1–7]] (the added fifth is explained at [[Lev. 5:16]]), with the guilty person first confessing “their sin which they have done” (verse 7), and adds this one case.

      “Kinsman” is in Hebrew “redeemer” (*gōʾēl*), the next of kin. Among his duties was to buy back what a poor relative had sold, “if any of his kin come to redeem it, then shall he redeem that which his brother sold” ([[Lev. 25:25]]), and, as here, “to receive restitution due to his deceased kinsman.” Mention of the kinsman, in one older reading, “presupposes that the injured person was no longer alive.” With no kinsman left, the debt was still not cancelled. It was paid “unto the LORD, even to the priest,” who received it “as the representative of Jehovah,” and the ram of atonement, the guilt offering of [[Lev. 6:6]], was offered besides.
    sources: [lds-scriptures, cambridge-numbers, keil-numbers]

  - ref: 14
    phrase: the spirit of jealousy come upon him, and he be jealous of his wife
    kind: history
    title: A suspicion with no witness
    body: |
      The law of jealousy is for adultery suspected but not proved. Verse 13 rules out every ordinary means of proof: the act was hidden, “kept close” (Hebrew “secret”), there was “no witness,” and she was not “taken with the manner,” which is Hebrew for “caught in the act.” Verse 14 then gives two cases side by side, the wife who is defiled and the wife who is not, and the law covers both: it is the husband's suspicion, not proof, that brings it into force.

      A Latter-day Saint study notes that the law “allows a husband to accuse a woman of adultery without fear of punishment for false accusation,” and that the woman then underwent “a sort of trial by ordeal.” The volume guide [*Women and Marriage in the Old Testament*](/old-testament/guides/women-and-marriage/#the-law) gives what else the law provided for women.
    sources: [lds-scriptures, densley-adultery]

  - ref: 15
    phrase: he shall pour no oil upon it, nor put frankincense thereon
    kind: symbol
    title: Barley meal without oil or frankincense
    body: |
      The suspected wife's offering was barley meal, in one older reading “the coarsest farinaceous food, ordinarily used by the poorer classes,” named in no other offering of these laws, where “‘fine meal’ is always prescribed.” The same reading suggests why oil and frankincense were left off: “Perhaps because symbols of joy and festivity were excluded by the grievous nature of the woman’s alleged crime.” The poor man's sin offering of fine flour is likewise brought without them: “he shall put no oil upon it, neither shall he put any frankincense thereon: for it is a sin offering” ([[Lev. 5:11]]).

      The offering's name gives its purpose: “an offering of memorial, bringing iniquity to remembrance.” It brought the matter before the LORD rather than settling it. The handful burned on the altar (verse 26) was the memorial portion, burned, in the same reading, “to bring the worshipper before God’s memory.”
    sources: [cambridge-numbers, lds-scriptures]

  - ref: 17
    phrase: holy water in an earthen vessel
    kind: symbol
    title: Holy water, dust and a clay vessel
    body: |
      The water was holy, and the dust came from the floor of the tabernacle where the LORD dwelt. The Septuagint, the Greek translation of the Old Testament, has “pure running water” in place of “holy water” (the same Greek is also rendered “pure living water”). One older reading, pointing to the laver of [[Ex. 30:18]], takes it as “probably water out of the basin before the sanctuary, which served for holy purposes.” The text explains neither the dust nor the clay vessel; what it stresses is that the dust is taken from the sanctuary floor and the woman is set “before the LORD” (verses 16, 18).
    sources: [lxx-rahlfs, sc-knowhy-658, keil-numbers]

  - ref: 18
    phrase: uncover the woman’s head
    kind: words
    title: Uncovering her head
    body: |
      The priest bared the woman's head, whether by loosening her hair or by taking off her head-covering. The verb is *pāraʿ*, “let go, let alone,” and in later Hebrew “unbind (hair), uncover.” One older reading takes it as the removal “of the female head-dress,” elsewhere a sign of mourning (as for the leper, [[Lev. 13:45]]), and here “a symbol of the loss of the proper ornament of female morality and conjugal fidelity.” Another reads it more simply: “The hair is let loose as a sign of mourning for her shame.”
    sources: [oshb-wlc, bdb, keil-numbers, cambridge-numbers]

  - ref: 21
    phrase: make thy thigh to rot, and thy belly to swell
    kind: words
    title: What the curse threatened
    body: |
      The curse appears to fall on the body's power to bear children, though its exact form is not known. The word rendered “rot” means in Hebrew to “diminish, or fall away” (the same in verses 22 and 27), and “thigh” is the Hebrew *yārēk*, “thigh, loin.” A Latter-day Saint study grants that “It is unclear exactly what is meant by this curse,” and suggests that thigh and belly “might more clearly be translated as ‘reproductive organs’ and ‘womb.’”

      Verse 28 gives the other outcome: the innocent woman “shall be free, and shall conceive seed.” In the same study's reading, “while an innocent woman would conceive, one guilty of adultery would lose the ability to procreate.”
    sources: [lds-scriptures, oshb-wlc, bdb, densley-adultery]

  - ref: 23
    phrase: write these curses in a book, and he shall blot them out with the bitter water
    kind: symbol
    title: The curse washed into the water
    body: |
      The words of the oath were written and then washed off into the water she drank, so that the curse she had accepted went into her. The “book” here is anything “which can receive writing, e.g. a strip of parchment”; “The curse is considered to be in this manner literally conveyed to the potion.” A Latter-day Saint study describes the priest writing “the words of the oath on parchment in water soluble ink.” In one older reading it was “a symbolical act, to set forth the truth, that God imparted to the water the power to act injuriously upon a guilty body, though it would do no harm to an innocent one.”
    sources: [cambridge-numbers, densley-adultery, keil-numbers]

  - ref: 31
    phrase: Then shall the man be guiltless from iniquity, and this woman shall bear her iniquity
    kind: history
    title: Judgment left to the LORD
    body: |
      The law ends with no sentence for anyone to carry out: the outcome belongs to the LORD. The priest's words are “The LORD make thee a curse” (verse 21), and the verdict comes, if at all, in the woman's own body (verses 27–28). The law of jealousy is an example of a “talionic” punishment (one that answers the offence in kind) “that was expected to be carried out by God rather than the state.”

      Leaving the verdict to the LORD protected the wife. If her husband's word alone were enough to convict her, “she would be in a terrible state indeed”; “Putting the determination of guilt or innocence into the hands of God rather than into the hands of her husband, or even other men, ensured that she could vindicate herself if she were innocent.” A Latter-day Saint study reads the husband's freedom from guilt as a condition, not only a promise: “When a husband suspects his wife of adultery, he must perform the requirements of this law in order to be guiltless from iniquity rather than set her up to be caught in flagrante delicto.”

      The chapter gives no such law for a suspected husband, and does not say why. The law did not excuse him: “adulterers of both sexes were to be stoned (see Leviticus 20:10).” One older reading adds that this law “applied to the woman only, because the man was at liberty to marry more than one wife.”
    sources: [lds-scriptures, sc-knowhy-741, ot-manual-numbers-1-12, densley-adultery, keil-numbers]

christ: |
  The LORD who dwelt in the camp and kept the judgment of the suspected wife for Himself is Jehovah, “the premortal Jesus Christ” (see [[Ex. 3:14]]). Two Latter-day Saint studies read Jesus' meetings with two women against this law. In one, the woman taken in adultery ([[John 8:3–11]]) was brought to Him in the temple, which was “the proper place for performance of the ritual ordeal known as the Sotah, or the ordeal of the bitter waters.” When He wrote on the ground, it “could serve to remind careful observers of the ritual of the bitter waters, in which the words of the law of jealousy were combined with dust of the temple floor,” though the same study grants that “this connection may have been lost on the minds of those present.” He sent her away with “Neither do I condemn thee: go, and sin no more” ([[John 8:11]]). In the other, at the well where He offered the Samaritan woman “living water” ([[John 4:10]]), He “may even have had in mind” the Greek text of Numbers 5 (see the note on verse 17), and by asking for her husband “may have been offering the woman a solemn opportunity to demonstrate her innocence or alternatively to repent and to fully partake of His Atonement.”

  The chapter's second law, confess and then repay (verse 7), is the pattern the Lord gave again in this dispensation: “By this ye may know if a man repenteth of his sins—behold, he will confess them and forsake them” ([[D&C 58:43]]). A disciple who confesses a sin, forsakes it and makes right what can be made right has the Lord's promise: “the same is forgiven, and I, the Lord, remember them no more” ([[D&C 58:42]]).

