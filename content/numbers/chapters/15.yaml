chapter: 15
title: Error, Defiance, and a Cord of Blue
tagline: After the sentence at Kadesh, the LORD speaks of worship “when ye be come into the land.” He provides forgiveness for sins done in error and none for sins done with a high hand, a man is stoned for gathering sticks on the Sabbath, and Israel is given tassels to look on and remember.
when: 'In the wilderness after the refusal at Kadesh; the text gives no year'

setting: |
  Chapter 15 comes after the sentence of chapter 14 and the failed attempt to take the land that followed it ([[Num. 14:40–45]]). The adults who refused the land were to die in the wilderness, and only their children would enter: “your little ones … them will I bring in” ([[Num. 14:31]]). The chapter opens the third part of the book, 15:1–19:22, “various laws and historical notices”; the fourth, from chapter 20, is “the history of the last year in the wilderness.”

  The laws begin, “When ye be come into the land of your habitations, which I give unto you” (verse 2): why laws for the land are given to a people just told they will not enter it is the question of the note on that verse.

  Several of the chapter's laws carry on earlier ones: the meal offering of [[Lev. 2:1]], the sin offerings of [[Lev. 4:2]], the Sabbath penalty of [[Ex. 31:14]], and the fringes that Deuteronomy commands without giving a reason ([[Deut. 22:12]]).

thread: |
  The chapter's laws turn on the difference between a people who err and a person who defies. The first half expects Israel to reach the land and worship there, and it allows for failure: when the congregation, or one person, sins “through ignorance,” the priest makes atonement, “and it shall be forgiven” (verses 25, 28). Then the line is drawn. Whoever sins “presumptuously,” with a high hand, has “despised the word of the LORD” and is cut off with his iniquity still upon him (verses 30–31).

  The story of the man gathering sticks comes next, and in one older reading it is “no doubt inserted here as a practical illustration” of sinning with a high hand (see the note at verse 32). The same reading says the last law “appears to have been occasioned by the incident just described.” The tassels are to be seen, so that Israel will “remember all the commandments of the LORD, and do them” and not follow “your own heart and your own eyes” (verse 39). All through the chapter the stranger stands under the same law as Israel: in the offerings, in the forgiveness of error, and in the penalty for defiance (verses 14–16, 26, 29, 30).

sections:
  - range: 1-16
    heading: Flour, oil and wine with every offering
    plain: |
      The LORD told Moses: Tell the Israelites that when they come into the land I am giving them to live in, and make an offering by fire to the LORD from the herd or the flock, whether a burnt offering, a sacrifice to fulfill a vow, a freewill offering, or an offering at the appointed feasts, to be a pleasing aroma to the LORD, the one who brings it must bring a grain offering with it. For a lamb, bring a tenth of an ephah of flour mixed with a quarter of a hin of oil, and prepare a quarter of a hin of wine as a drink offering. For a ram, bring two tenths of flour mixed with a third of a hin of oil, and a third of a hin of wine, a pleasing aroma to the LORD. For a bullock offered as a burnt offering, for a vow, or as peace offerings, bring three tenths of flour mixed with half a hin of oil, and half a hin of wine, an offering by fire, a pleasing aroma to the LORD. Do this for each bullock, ram, lamb or kid; however many animals you offer, do it for every one.

      Every native-born Israelite is to do these things in this way. And if a foreigner living among you, or anyone else among you in future generations, wants to make an offering by fire, a pleasing aroma to the LORD, he is to do just as you do. For the assembly there is one statute for you and for the foreigner who lives with you, a statute for ever through your generations: before the LORD the foreigner is as you are. One law and one rule apply to you and to the foreigner living with you.
  - range: 17-21
    heading: The first of the dough
    plain: |
      The LORD told Moses: Tell the Israelites that when they come into the land where I am bringing them and eat its bread, they are to set aside an offering for the LORD. From the first of your dough, offer a cake, lifted up as an offering in the same way as the offering from the threshing floor. Through all your generations give the LORD an offering from the first of your dough.
  - range: 22-31
    heading: Sins of error and sins of defiance
    plain: |
      If you go wrong and fail to keep any of these commandments the LORD gave Moses, all that the LORD has commanded you through Moses from the day He first gave them and on through your generations, then, if it was done in error without the congregation knowing it, the whole congregation is to offer a young bullock as a burnt offering, a pleasing aroma to the LORD, with its grain and drink offerings as prescribed, and a male goat as a sin offering. The priest is to make atonement for the whole congregation of Israel, and they will be forgiven, because it was an error and they have brought their offering by fire to the LORD and their sin offering before Him for their error. The whole congregation of Israel will be forgiven, and the foreigner living among them as well, since all the people were caught in the error.

      If one person sins in error, he is to bring a year-old female goat as a sin offering. The priest is to make atonement before the LORD for the one who sinned in error, and he will be forgiven. The same law applies to anyone who sins in error, native-born Israelite or foreigner.

      But anyone, native-born or foreigner, who acts defiantly, with a high hand, insults the LORD, and that person is to be cut off from his people. Because he has despised the word of the LORD and broken His commandment, he must be cut off completely; his guilt remains on him.
  - range: 32-36
    heading: The man gathering sticks
    plain: |
      While the Israelites were in the wilderness, they found a man gathering sticks on the Sabbath day. Those who found him brought him to Moses and Aaron and the whole congregation. They held him in custody, because it had not been made clear what was to be done to him. Then the LORD said to Moses, The man must be put to death; the whole congregation is to stone him outside the camp. So the whole congregation took him outside the camp and stoned him, and he died, as the LORD had commanded Moses.
  - range: 37-41
    heading: Tassels to remember
    plain: |
      The LORD told Moses: Tell the Israelites to make tassels on the corners of their garments through all their generations, and to put a cord of blue on the tassel at each corner. You will have the tassel to look at, and so remember all the LORD's commandments and keep them, and not go after your own heart and your own eyes, which lead you to be unfaithful. So you will remember and keep all My commandments and be holy to your God. I am the LORD your God, who brought you out of the land of Egypt to be your God. I am the LORD your God.

notes:
  - ref: 2
    phrase: When ye be come into the land of your habitations, which I give unto you
    kind: history
    title: A law for the land, given after the sentence
    body: |
      The chapter speaks of the land as certain soon after the people were told they would not enter it. In chapter 14 the adults were sentenced, “Your carcases shall fall in this wilderness” ([[Num. 14:29]]), and the land was kept for the next generation, “your little ones … them will I bring in” ([[Num. 14:31]]). The laws that follow are for worship in the land: “When ye be come into the land of your habitations, which I give unto you” (verse 2), and again “When ye come into the land whither I bring you” (verse 18).

      A Latter-day Saint reading sees the laws of sacrifice repeated here as a way back: “in Israel’s state of rebellion they provided the way to come back into God’s favor.” One older reading takes the timing as the point: the laws were given “for the purpose of reviving the hopes of the new generation that was growing up, and directing their minds to the promised land, during the mournful and barren time when judgment was being executed upon the race that had been condemned.”
    sources: [lds-scriptures, keil-numbers, ot-manual-numbers-13-36]

  - ref: 4
    phrase: a tenth deal of flour mingled with the fourth part of an hin of oil
    kind: history
    title: Flour, oil and wine by the size of the animal
    body: |
      Every animal offered by fire was to come with flour, oil and wine, and the amounts grew with the animal. A “tenth deal” is a tenth of an ephah. For a lamb, a tenth of an ephah of flour and a quarter of a hin each of oil and wine; for a ram, two tenths and a third of a hin; for a bullock, three tenths and half a hin (verses 4–10). With the ephah at about a bushel and the hin at about a gallon and a half, the bullock's portion was roughly a third of a bushel of flour with three quarts each of oil and wine.

      Leviticus gives the meal offering “without fixed amounts” (its place beside the animal offerings is explained at [[Lev. 2:1]]). Here, in one older reading, “the number of the appointed quantities of meat and drink-offerings was to correspond to the number of sacrificial animals” (verse 12). Another older reading notes that the offerings were ordinary food: “Men offered to their God the same food which they enjoyed at their own table.”
    sources: [cambridge-numbers, keil-numbers]

  - ref: 15
    phrase: as ye are, so shall the stranger be before the LORD
    kind: history
    title: One law for the stranger
    body: |
      The “stranger” is the foreigner living in Israel, “a man of non-Israelite birth, resident in the promised land with the permission of the Israelite authorities,” and the law gives him the same standing at the altar as the native-born. Verse 14 adds “whosoever be among you,” which in one older reading “appears to mean one who is residing in the land but has not been granted the definite status of a gêr or ‘sojourner.’” The rule is stated three ways in two verses: “One ordinance,” “as ye are, so shall the stranger be,” “One law and one manner” (verses 15–16).

      The chapter holds to it. A Latter-day Saint study notes that the language of equal justice in the courts ([[Lev. 24:22]]) is used here “regarding cultic practice—that is, temple worship,” and that the rule “is repeated a few verses later regarding sin offerings for ignorant acts, while those who perform premeditated acts, either a natural Israelite or a stranger, receive the same penalty” (verses 26, 29, 30). When the whole congregation erred, the forgiveness reached the stranger too, since, in one older reading, “the sin extended to the whole nation, in which the foreigners were also included.”
    sources: [bd-stranger, cambridge-numbers, belnap-outcasts, keil-numbers]

  - ref: 20
    phrase: a cake of the first of your dough
    kind: history
    title: The first of the dough
    body: |
      The law reaches past the harvest to the household's bread: a cake from the first of the dough was lifted up to the LORD, as the first of the threshing floor was. The word rendered “dough” is uncertain (a marginal reading is “coarse meal”); it occurs elsewhere only in [[Ezek. 44:30]] and [[Neh. 10:37]].

      One older reading takes the law as consecrating “a gift of first-fruits to the Lord, not only of the grains of corn, but also of the bread made from the corn”; another notes that “the first” may be “simply ‘the first part,’ i.e. a small fixed amount, perhaps at the getting in of each fresh supply for the household.” Like the other firstfruits, the cake went to the priests; Ezekiel's list of their portions includes it (see the note at [[Ezek. 44:28]]).
    sources: [cambridge-numbers, keil-numbers]

  - ref: 22
    phrase: And if ye have erred, and not observed all these commandments
    kind: history
    title: When the whole people errs
    body: |
      Verses 22–29 give the offering for sin done in error, first by the whole congregation and then by one person; what “through ignorance” means is explained at [[Lev. 4:2]]. Leviticus had already provided for both cases ([[Lev. 4:13–21]]; [[Lev. 4:27–31]]), and one older reading sees a difference in the first. Leviticus speaks of doing what was forbidden; this law, of having “not observed all these commandments,” is “not to sins of commission, but to sins of omission,” the congregation's failure to keep the law it had been given.

      The offering differs too. For the congregation Leviticus requires “a young bullock for the sin” ([[Lev. 4:14]]); here the bullock is a burnt offering with its meal and drink offering, and “one kid of the goats” is the sin offering (verse 24). The same reading explains the added burnt offering: it was given “that the separation of the congregation from the Lord, which had arisen from the sin of omission, might be entirely removed.” The text names no instance. Another older reading suggests such errors “might consist in some mistake or omission in ritual, or some miscarriage of justice discovered too late.”
    sources: [keil-numbers, cambridge-numbers, lds-scriptures]

  - ref: 30
    phrase: doeth ought presumptuously
    kind: words
    title: With a high hand
    body: |
      “Presumptuously” is in Hebrew “with a high hand,” as modern translations render it: deliberate, open defiance, the opposite of the error of verses 22–29. Exodus uses the phrase of Israel leaving Egypt, “the children of Israel went out with an high hand” ([[Ex. 14:8]]; [[Num. 33:3]]), of “the bold defiance with which the Israelites marched out.” Here the hand is raised against the LORD himself: in one older reading the sinner “raised his hand, as it were, against Jehovah, or acted in open rebellion against Him.”

      Such a person “reproacheth the LORD.” Another older reading renders it “Jehovah doth he revile,” and adds that “The ‘reviling’ was not necessarily in speech; actions speak louder than words.” Verse 31 states the charge in plain terms: “he hath despised the word of the LORD, and hath broken his commandment.”
    sources: [pike-sabbath-ot, cambridge-numbers, keil-numbers, lds-scriptures]

  - ref: 30
    phrase: that soul shall be cut off from among his people
    kind: history
    title: Cut off
    body: |
      To be “cut off” meant losing one's place among the covenant people, and in some cases death. Those who sinned willfully “were to be excommunicated from the camp of Israel,” and “In some cases the sin also required the death penalty”; the law teaches that such people “will be cut off from God and not be counted part of His covenant people. They will suffer spiritual death.” A Latter-day Saint study of Leviticus describes it as being “removed from Israelite society and from favor with the Lord.” The older readings take it as death: in one, “by divine agency, not by punishment inflicted at the hands of the community”; in another, the sinner “was to atone for it with his life.”

      Verse 31 adds “his iniquity shall be upon him”: he is cut off, in one older reading, “with the burden of his sin still attaching to him, and unatoned for.” The Book of Mormon uses the phrase of separation from God: “ye shall be cut off from my presence” ([[2 Ne. 4:4]]), language that the same Latter-day Saint study traces to [[Lev. 22:3]].
    sources: [ot-manual-numbers-13-36, ot-minute-lev, cambridge-numbers, keil-numbers]

  - ref: 32
    phrase: they found a man that gathered sticks upon the sabbath day
    kind: history
    title: The man gathering sticks
    body: |
      “The Old Testament contains only one example of capital punishment applied to Sabbath-day violation,” and this is it. The penalty had already been given (see the note at [[Ex. 31:14]]). Gathering wood is among the acts that appear to have counted as work, with gathering food ([[Ex. 16:23–30]]) and kindling a fire ([[Ex. 35:3]]).

      What was not yet settled is why the man was held: “it was not declared what should be done to him” (verse 34). One older reading takes it that the death penalty was known but “the mode had not yet been prescribed,” and the LORD now named stoning; another allows that the people may not have known what the punishment should be at all. Either way the case waited for the LORD's word, as the blasphemer's did ([[Lev. 24:12]]).

      Because the story comes right after the law of sins done with a high hand (verses 30–31), the stick gatherer may have been “acting defiantly as well as publicly.” The passage “does not answer most questions about the incident or its outcome.” In one Latter-day Saint reading the man became “a life-and-death object lesson to the Israelites of the realities of covenanting with a holy being,” of a kind scripture reports early in most, if not all, dispensations (it compares Ananias and Sapphira, [[Acts 5:1–11]]), and such people “can presumably repent in the spirit world, even though their mortal life was cut short through their disobedience.”
    sources: [pike-sabbath-ot, keil-numbers, cambridge-numbers, lds-scriptures]

  - ref: 38
    phrase: fringes in the borders of their garments
    kind: symbol
    title: Tassels with a cord of blue
    body: |
      The “fringes” were tassels fastened to the corners of the outer garment, and the “ribband of blue” was the cord that held each one on. The Hebrew *ṣîṣit* means a “tassel,” and the “borders” are the garment's corners, “the four quarters of thy vesture” in Deuteronomy ([[Deut. 22:12]]). The garment was, in one older reading, “a four-cornered cloth or piece of stuff, which was thrown over the body-coat,” and the blue was “a string of hyacinth-blue … to fasten the tassel to the edge of the garment.”

      The blue (*tᵉkēlet*) is “violet thread,” the colour woven through the tabernacle's hangings and used for the cords of the high priest's garments, among them the “blue lace” that held the gold plate engraved “HOLINESS TO THE LORD” on his mitre ([[Ex. 28:36–37]]). In a Latter-day Saint reading the fringes symbolized that the wearer “is clothed, or covered, with the commandments of God.” Another older reading finds a play on words between *ṣîṣit* and *ṣîṣ*, the word for that plate, and takes the tassels as “striking ornaments, which will constantly catch the wearer’s eye, and act as a religious reminder.”

      By Jesus' day the Pharisees liked to make them large, “to exhibit openly their punctilious fulfilment of the law,” in one older reading; Jesus said they “enlarge the borders of their garments” ([[Matt. 23:5]]).
    sources: [bdb, keil-numbers, cambridge-numbers, ot-manual-numbers-13-36, lds-scriptures]

  - ref: 39
    phrase: seek not after your own heart and your own eyes
    kind: words
    title: Seek not after your own heart
    body: |
      The verb rendered “seek” (*tûr*) is the one used for the spies who went to “search the land of Canaan” in chapters 13 and 14 ([[Num. 13:2]]; [[Num. 14:34]]). There it means to “spy out, explore”; here it is used figuratively, to “go about” after one's heart, and a modern translation's footnote gives it as “Hebrew *to spy out*.” Numbers does not comment on the echo.

      In one older reading the tassels kept the commandments “constantly before their eyes,” so that Israel would “not direct their heart and eyes to the things of this world, which turn away from the word of God, and lead astray to idolatry.” Another older reading calls the clause “after which ye use to go a whoring” “an obscure sentence.” Verse 40 gives the aim: “That ye may remember, and do all my commandments, and be holy unto your God.”
    sources: [bdb, oshb-wlc, esv, keil-numbers, cambridge-numbers]

christ: |
  The LORD who gives this law and forgives His people's error is Jehovah, “the premortal Jesus Christ” (see [[Ex. 3:14]]). A Latter-day Saint study sets the offering for sin “through ignorance” (verses 27–29) beside King Benjamin's words that Christ's blood “atoneth for the sins of those … who have ignorantly sinned” ([[Mosiah 3:11]]), which, it says, likely takes in both those who did not understand sin and those who knew the law but became unclean without meaning to. Benjamin goes on to the one who knowingly rebels, for whom there is still a way, though only one: “salvation cometh to none such except it be through repentance and faith on the Lord Jesus Christ” ([[Mosiah 3:12]]). In one older reading the tassels are what the New Testament refers to when the sick touched “the hem of his garment” and “were made perfectly whole” ([[Matt. 14:36]]).

  The tassels joined seeing to remembering and remembering to obeying. A Latter-day Saint reading of the fringes names the sacrament as a symbol of the same kind: its bread and water are “symbols that remind us of Jesus’ sacrifice for us and of our covenants with Him,” and it holds the same pair before a disciple each week, to “always remember him and keep his commandments” ([[D&C 20:77]]). Sin done in error and sin done in defiance both lie within the reach of His Atonement, the first by His blood and the second through repentance and faith on Him.

