chapter: 35
title: Cities for the Levites, Cities of Refuge
tagline: The tribe with no land is given forty-eight cities among the others, and six of them become places where a man who has killed without intent can live until the high priest dies.
when: 'On the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Numbers 35 is law given “in the plains of Moab by Jordan near Jericho” (verse 1), in the fortieth year after the Exodus ([[Num. 33:38]]), as Israel waits to cross. Chapter 34 has just drawn the borders of the land and named the men who would divide it; this chapter provides for the one tribe that would receive no share of it, and chapter 36 closes the book by keeping the daughters' inheritances within their tribes.

  The tribe of Levi had “no inheritance in Canaan,” but it had the tithe and “48 cities” (see the note at [[Num. 18:20]]). Six of those cities were to be refuges for the man who had killed “at unawares” (verse 11). The law of refuge had been promised at Sinai ([[Ex. 21:13]]) and is repeated by Moses at [[Deut. 19:1–13]], where the site explains what a city of refuge was and who the avenger was (the notes at [[Deut. 19:2]] and [[Deut. 19:6]]). Moses set apart the three east of the Jordan ([[Deut. 4:41–43]]), and in Joshua’s day the other three were appointed and the Levites received their forty-eight cities ([[Josh. 20]]; [[Josh. 21]]).

thread: |
  Chapter 35 joins two laws by one fact: **the cities of refuge are Levites' cities.** Verses 1–8 give the Levites, the tribe of the sanctuary, homes and pasture spread through every tribe's land; verses 9–34 make six of those homes places of safety for the man who has killed, and set the rules that tell the murderer, whom the refuge does not protect, from the man who killed by accident. The second law has its own order, in one older reading: the cities are appointed (verses 9–15), sample cases tell murder from accident (16–23), the procedure follows (24–28), and the close sets the rules that guard it all (29–34).

  The same reading finds the law changing the old custom of blood revenge at three points: it tells deliberate killing from accident, it “tacitly insists that the murderer only is to forfeit his life,” and it forbids buying off that life with money. Another older reading sees in the law of the slayer “all the rigour of the divine justice … in the most beautiful concord with His compassionate mercy”: a death no one intended had still shed blood that “demanded expiation,” yet the expiation “did not consist in the death of the offender himself, because he had not sinned wilfully,” and so he was given a city to live in until the high priest died. The chapter's own reason comes at the end: blood defiles the land, and the LORD dwells in it (verses 33–34).

sections:
  - range: 1-8
    heading: Forty-eight cities for the Levites
    plain: |
      On the plains of Moab by the Jordan, across from Jericho, the LORD told Moses: Command the Israelites to give the Levites, out of the land they will inherit, cities to live in, and give them pasture land around the cities as well. The cities will be their homes, and the pasture land will be for their cattle, their flocks and all their animals. The pasture land you give the Levites is to reach out a thousand cubits from the city wall on every side. Measure two thousand cubits outside the city on the east side, two thousand on the south, two thousand on the west and two thousand on the north, with the city in the middle; that will be the pasture land of their cities.

      Among the cities you give the Levites, six are to be cities of refuge, which you will set apart so that a man who has killed someone can flee to them; besides these, give forty-two more. In all you will give the Levites forty-eight cities with their pasture land. The cities are to come from the Israelites' own holdings: take more from a tribe that has many and fewer from a tribe that has few. Each tribe is to give some of its cities to the Levites in proportion to the inheritance it receives.
  - range: 9-15
    heading: Six cities of refuge
    plain: |
      The LORD told Moses to say to the Israelites: When you cross the Jordan into the land of Canaan, choose cities to be your cities of refuge, so that someone who kills a person unintentionally can flee there. They will be a refuge from the avenger, so that the one who has killed does not die before he stands trial before the congregation. Six of the cities you give are to be cities of refuge: three on this side of the Jordan and three in the land of Canaan. These six cities are a refuge for the Israelites and for the foreigner and the settler living among them, so that anyone who kills a person unintentionally can flee there.
  - range: 16-23
    heading: Murder and accident
    plain: |
      If someone strikes a man with an iron tool and he dies, the one who struck him is a murderer; the murderer must be put to death. So also if he strikes him with a stone in the hand that can kill, or with a wooden weapon in the hand that can kill, and the man dies: he is a murderer and must be put to death. The avenger of blood himself is to put the murderer to death; when he meets him, he is to kill him. If someone shoves a man out of hatred, or throws something at him from ambush, and he dies, or strikes him with his fist in enmity and he dies, the one who struck him must be put to death; he is a murderer, and the avenger of blood is to kill him when he meets him.

      But suppose he shoves a man suddenly, with no enmity, or throws something at him without lying in wait, or, without seeing him, throws on him a stone that can kill, and the man dies, though he was not his enemy and did not mean him harm.
  - range: 24-28
    heading: The hearing, and the death of the high priest
    plain: |
      Then the congregation is to judge between the one who killed and the avenger of blood by these rules. The congregation is to rescue the one who killed from the avenger and return him to the city of refuge he fled to, and he must live there until the death of the high priest, who was anointed with the holy oil. But if the slayer ever goes outside the bounds of his city of refuge, and the avenger of blood finds and kills him there, the avenger is not guilty of blood, because the man should have stayed in his city of refuge until the high priest died. After the high priest's death he may go back to his own land.
  - range: 29-34
    heading: No ransom, and the land kept clean
    plain: |
      These are to be rules of justice for you for all your generations, wherever you live. A murderer is to be put to death only on the testimony of witnesses; one witness is not enough to put anyone to death. Do not accept a ransom for the life of a murderer who deserves to die; he must be put to death. Nor may you accept a ransom from someone who has fled to a city of refuge, to let him go home and live on his land before the priest dies. Do not pollute the land you live in, for bloodshed pollutes the land, and the land cannot be cleansed of the blood shed in it except by the blood of the one who shed it. Do not defile the land you will live in, where I dwell, for I, the LORD, dwell among the Israelites.

notes:
  - ref: 2
    phrase: suburbs for the cities round about them
    kind: words
    title: Pasture land, not suburbs
    body: |
      The Levites' “suburbs” were common pasture that was theirs for good, while in one older reading the towns themselves were only partly theirs. The Hebrew word means literally “a place for driving cattle” (as verse 3 says, “for their cattle”), and came to be used “of common land surrounding a town, which all the inhabitants had the right to use.” Leviticus had already made the Levites' share permanent: “the field of the suburbs of their cities may not be sold; for it is their perpetual possession” ([[Lev. 25:34]]).

      The cities themselves were given differently. In one older reading the Levites did not receive “the whole of the towns as their own property, but as many houses in the towns as sufficed for the necessities of the Levites,” and the rest of each town, “together with the fields and villages,” stayed with the tribe it belonged to. Why a tribe with no land had cities at all is the note at [[Num. 18:20]].
    sources: [cambridge-numbers, keil-numbers, lds-scriptures]

  - ref: 5
    phrase: on the east side two thousand cubits
    kind: history
    title: A thousand cubits or two thousand?
    body: |
      Verse 4 gives the pasture land “a thousand cubits round about,” verse 5 “two thousand cubits” on each side, and the text does not say how the two fit. One older reading takes them as one plot measured two ways, with the town and its land as squares: the pasture reaches 1,000 cubits out from the wall in every direction, and each outer side measures 2,000 cubits “apart from the length of the city wall,” with “the city in the middle.” So if the town were itself 1,000 cubits on a side, the outer side would be 3,000. Another older reading takes each plot simply as “a square of 2,000 cubits (c. 1,000 yards),” and doubts that such squares could be found “in a hilly country like Palestine, cut with deep ravines.” Joshua records the forty-eight cities given “with their suburbs,” but not their measurements ([[Josh. 21:41]]). Neither reading is settled.
    sources: [keil-numbers, cambridge-numbers, lds-scriptures]

  - ref: 6
    phrase: there shall be six cities for refuge
    kind: history
    title: Why the refuges were Levites' cities
    body: |
      The six refuges were chosen from the Levites' cities, and the chapter does not say why. One older reading gives two reasons: “it was to the priests and Levites that they would first of all look for an administration of justice,” and these cities “were the property of Jehovah, in a higher sense than the rest of the land,” so that the slayer who reached such a city “was placed under the protection of divine grace.” What a city of refuge was, and where the six stood, is the note at [[Deut. 19:2]].

      One Latter-day Saint reading applies the law to Nephi after the death of Laban. Where a killing “wasn’t preplanned, the killer still had to flee to one of the specifically-designated cities of refuge or leave the Holy Land,” and Nephi left: “his punishment for killing Laban was voluntary exile, an exile from which Nephi would never return.” Why that killing has been read as one the law excused is the note at [[Ex. 21:13]].
    sources: [keil-numbers, sc-knowhy-256]

  - ref: 7
    phrase: forty and eight cities
    kind: history
    title: Levi scattered among the tribes
    body: |
      The forty-eight cities put the Levites in every part of the land, and Joshua records that it was done: “All the cities of the Levites within the possession of the children of Israel were forty and eight cities with their suburbs” ([[Josh. 21:41]]). Jacob had said of Levi, “I will divide them in Jacob, and scatter them in Israel” ([[Gen. 49:7]]). In one older reading the cities turned that word into a blessing, for “the curse of division and dispersion in Israel … was changed into a blessing both for the Levites themselves and also for all Israel.”

      The same reading explains the purpose: the tribe called to “teach Jacob thy judgments, and Israel thy law” ([[Deut. 33:10]]) was spread among all the tribes “by their walk as well as by their calling to remind the Israelites continually of their own divine calling,” yet gathered in towns of their own, which “preserved them from the disadvantages of standing alone.”
    sources: [lds-scriptures, keil-numbers]

  - ref: 16
    phrase: if he smite him with an instrument of iron
    kind: history
    title: Iron, stone and wood
    body: |
      Verses 16–18 judge intent by the weapon: a man who struck with iron, a stone big enough to kill, or a wooden weapon was a murderer. In one older reading the stone is “a stone which filled the hand,” the wood “a thick club,” and the reason is that the suspicion would rest on anyone who had used “an instrument, that endangered life and therefore was not generally used in striking, that he had intended to take life away.” Verses 20–23 then judge by the heart: hatred, lying in wait and enmity against “suddenly without enmity” and “seeing him not.” Moses' law drew distinctions “among what is called today premeditated murder, murder of passion, manslaughter, and self-defense.”

      One Latter-day Saint study reads the Anti-Nephi-Lehies' buried swords ([[Alma 24:17]]) in the light of these verses. The law of Moses “identified those who killed with instruments or weapons of iron, stone, and wood as ‘murderers,’” and by burying “all the weapons which were used for the shedding of man’s blood” they “assured themselves and God that they would never again commit an unlawful, intentional murder.”
    sources: [keil-numbers, ot-manual-numbers-13-36, sc-knowhy-132]

  - ref: 25
    phrase: unto the death of the high priest, which was anointed with the holy oil
    kind: christ
    title: Free at the high priest's death
    body: |
      The slayer found innocent stayed in the city until the high priest died, and then went home; the text gives no reason for the term. Joshua repeats the term: “until the death of the high priest that shall be in those days: then shall the slayer return” ([[Josh. 20:6]]). Two older readings explain it differently.

      One takes the high priest's death as an atonement. It points to the words “which was anointed with the holy oil,” which “would appear unmeaning and superfluous on any other view”: anointed to make the yearly atonement for the people, the high priest in his death “might also be regarded as a death for the sins of the people,” so that the slayer “could return cleansed to his native town.” On that reading, which draws on [[Heb. 9:14–15]], “the death of the earthly high priest became thereby a type of that of the heavenly One, who, through the eternal (holy) Spirit, offered Himself without spot to God.”

      The other reads it as a fixed point in public life. The title is literally “the great priest,” the head of the nation's worship, so that “‘until the death of the high priest’ would have almost the same force that the words ‘until the death of the reigning sovereign’ would bear to-day.” The text settles neither. Whatever the reason, the slayer could not shorten his stay with money (verse 32).
    sources: [lds-scriptures, keil-numbers, cambridge-numbers]

  - ref: 31
    phrase: ye shall take no satisfaction for the life of a murderer
    kind: history
    title: No ransom for a life
    body: |
      No payment could spare a murderer's life under this law, or shorten the slayer's years in the city. “Satisfaction” is *kōper*, the same ransom that [[Ex. 21:30]] allowed the owner of a goring ox (the note there explains the word), and here it is refused twice. A murderer could not buy his life from the dead man's family (verse 31), and the man who killed by accident could not “purchase permission to return home from the city of refuge before the death of the high priest, by the payment of a money compensation” (verse 32). In one older reading such ransom “was widely prevalent,” Israel seems to have forbidden it early except in certain cases, such as [[Ex. 21:29–30]], and this law “contains the earliest explicit prohibition”; the same reading concludes that “these prohibitions emphasize the extreme value of human life.”
    sources: [bdb, keil-numbers, cambridge-numbers]

  - ref: 33
    phrase: the land cannot be cleansed of the blood that is shed therein, but by the blood of him that shed it
    kind: words
    title: Atonement for the land
    body: |
      Shed blood, in this law, lay on the land itself, and only the death of the one who shed it could take it away. The verb behind “cleansed” is *kipper*, the word for making atonement: “for the land atonement cannot be made, in view of the blood shed in it, except by the blood of the shedder of blood.” No ransom could stand in its place (verses 31–32). In one older reading the remedy was “the execution of the murderer, by which justice would be satisfied,” and the chapter allows that execution only “by the mouth of witnesses” (verse 30).

      The reason comes last: “Defile not therefore the land which ye shall inhabit, wherein I dwell” (verse 34). Israel was not to defile it “by tolerating murderers, because Jehovah, the Holy One, dwelt in it.” Isaiah describes the whole earth “defiled under the inhabitants thereof” (see the note at [[Isa. 24:5]]).

      The theme page [Between the Dead and the Living](/numbers/themes/between-the-dead-and-the-living/) follows atonement in Numbers to this law and on to Alma 34.
    sources: [bdb, keil-numbers]

christ: |
  The LORD who says “I the LORD dwell among the children of Israel” (verse 34) is Jehovah, the premortal Christ (see [[Ex. 3:14]]). Hebrews speaks of those “who have fled for refuge to lay hold upon the hope set before us” ([[Heb. 6:18]]), words one older reading glosses “As into one of the refuge-cities of old.” Amulek reasons from the law's justice to Christ. The law would not take one man's life for another's crime: “if a man murdereth, behold will our law, which is just, take the life of his brother? I say unto you, Nay” ([[Alma 34:11]]). So “the law requireth the life of him who hath murdered; therefore there can be nothing which is short of an infinite atonement which will suffice for the sins of the world” ([[Alma 34:12]]). One older reading also sees in the high priest's death a type of His (the note at verse 25).

  The refuge is open now, and it is reached by fleeing to Christ. That hope is “an anchor of the soul, both sure and steadfast” ([[Heb. 6:19]]), and what no man's blood could atone for, “an infinite and eternal sacrifice” has ([[Alma 34:10]]).

explore: |
  - **The refuges named and the Levites' cities given.** [[Josh. 20:1–9]]; [[Josh. 21:1–42]].
  - **Moses' retelling of the law of refuge.** [[Deut. 19:1–13]], and the three cities he set apart, [[Deut. 4:41–43]].
  - **The first law of killing with and without intent.** [[Ex. 21:12–14]].
  - **Fleeing for refuge to the hope set before us.** [[Heb. 6:13–20]].
  - **Why only an infinite atonement suffices.** [[Alma 34:8–16]].

parallels:
  - ref: Deut. 19:1–13
    note: Moses repeats the law of the cities of refuge, with the axe head that flies off its handle as the example of an accident.
  - ref: Josh. 20:1–9
    note: The six cities of refuge are named, with the hearing at the city gate and the return at the high priest's death.
  - ref: Josh. 21:1–42
    note: The forty-eight cities of the Levites are given, tribe by tribe.
  - ref: Deut. 4:41–43
    note: Moses sets apart Bezer, Ramoth and Golan east of the Jordan.
  - ref: Ex. 21:12–14
    note: The LORD promises a place for the man who kills without lying in wait.

