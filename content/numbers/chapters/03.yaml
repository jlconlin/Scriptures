parallels:
  - ref: Ex. 6:16–25
    note: The sons of Levi, Gershon, Kohath and Merari, with their sons, and Aaron's sons Nadab, Abihu, Eleazar and Ithamar.
  - ref: Num. 8:14–19
    note: The Levites given to the LORD instead of the firstborn, and by Him to Aaron and his sons.
  - ref: Num. 26:57–62
    note: The Levites counted again on the plains of Moab, 23,000 males from a month old.
  - ref: 1 Chr. 23:6–23
    note: David divides the Levites into courses by the same three sons of Levi.

