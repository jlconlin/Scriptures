chapter: 3
title: Instead of All the Firstborn
tagline: Aaron's sons are named as the priests, the tribe of Levi is given to them, and the Levites are counted from a month old to stand in the place of Israel's firstborn.
when: 'At Sinai, in the second year after the Exodus'

setting: |
  Numbers 3 belongs to the first part of the book, the preparation for leaving Sinai (1:1–10:10), in the second year after the Exodus. Chapter 1 counted the men of war of twelve tribes and left Levi out by command ([[Num. 1:47–49]]); the Levites were set over the tabernacle and were to camp around it ([[Num. 1:50–53]]). Chapter 2 placed the twelve tribes in four camps on the four sides of the tabernacle, with the Levites in the middle. Now Levi is counted, and the count is of another kind. It takes in every male from a month old, because the Levites are to be exchanged for Israel's firstborn. Chapter 4 counts them again, from thirty to fifty, for the work of carrying the tabernacle, and chapter 8 tells how they were cleansed and offered.

  The families named here reappear in Chronicles, which divides the Levites by the same three sons of Levi, Gershon, Kohath and Merari ([[1 Chr. 23:6]]), and the courses of priests by the two houses of Aaron that this chapter leaves standing, Eleazar and Ithamar ([[1 Chr. 24:1–4]]).

thread: |
  Numbers 3 is **a census taken for an exchange.** The LORD had set apart every firstborn of Israel for Himself on the day He smote the firstborn of Egypt (verse 13), and here He takes the tribe of Levi in their place: “the Levites shall be mine” (verses 12, 45). The chapter centers on that exchange. The Levites are counted, like the firstborn, from a month old (verses 15, 40); their total is set against the firstborn's (verses 39, 43); and the 273 firstborn left over are bought back with silver (verses 46–51).

  The exchange also puts the Levites in their place. The chapter begins with the priests, Aaron's sons (verses 1–4) and then gives the Levites to Aaron and his sons to serve them (verses 5–10). Aaron's descendants “were designated as priests,” while the other Levites “assisted in maintaining the tabernacle and its services, but they could not actually perform the ordinances.” Then each of Levi's three clans receives a side of the tabernacle and a share of its charge: Gershon on the west, with the curtains, coverings and hangings (verses 23–26); Kohath on the south, with the ark, the table, the candlestick and the altars (verses 29–31); Merari on the north, with the boards, bars, pillars and sockets (verses 35–37). The east, before the entrance, belongs to Moses, Aaron and Aaron's sons (verse 38), “the favored position directly in front of the tabernacle entrance.” The twelve tribes camp beyond them all, so that the Levites stand between the people and the sanctuary, “that there be no wrath upon the congregation of the children of Israel” ([[Num. 1:53]]). How each clan carried its charge on the march is chapter 4.

sections:
  - range: 1-4
    heading: The sons of Aaron
    plain: |
      These are the descendants of Aaron and Moses at the time the LORD spoke with Moses on Mount Sinai. The sons of Aaron were Nadab the firstborn, Abihu, Eleazar and Ithamar. These were the anointed priests, consecrated to serve as priests. But Nadab and Abihu died before the LORD when they offered unauthorized fire before Him in the wilderness of Sinai, and they had no children. So Eleazar and Ithamar served as priests during the lifetime of Aaron their father.
  - range: 5-10
    heading: The Levites given to the priests
    plain: |
      The LORD said to Moses: Bring the tribe of Levi forward and present them to Aaron the priest, to serve him. They shall perform the service owed to him and to the whole congregation before the tabernacle, doing the work of the tabernacle. They shall look after all its furnishings and do for Israel the work of the tabernacle. Give the Levites to Aaron and his sons; they are given wholly to him from among the Israelites. Appoint Aaron and his sons to keep their priesthood, and any unauthorized person who comes near shall be put to death.
  - range: 11-13
    heading: Instead of the firstborn
    plain: |
      The LORD said to Moses: I have taken the Levites from among the Israelites in place of all the firstborn of Israel, so the Levites shall be mine. For all the firstborn are mine. On the day I struck down every firstborn in Egypt, I set apart for myself every firstborn in Israel, human and animal. They shall be mine. I am the LORD.
  - range: 14-20
    heading: The families of Levi
    plain: |
      In the wilderness of Sinai the LORD told Moses to count the Levites by their ancestral houses and families, every male a month old and older, and Moses counted them as he was commanded. The sons of Levi were Gershon, Kohath and Merari. Gershon's sons were Libni and Shimei; Kohath's were Amram, Izehar, Hebron and Uzziel; Merari's were Mahli and Mushi. These were the Levite families.
  - range: 21-39
    heading: Each clan's place and charge
    plain: |
      The Gershonites, 7,500 males from a month old, were to camp behind the tabernacle on the west, under their chief Eliasaph son of Lael. They were in charge of the tabernacle's tent and its covering, the screen for its entrance, the hangings of the courtyard and the screen for the courtyard's entrance around the tabernacle and the altar, and their cords. The Kohathites, 8,600 males, who kept the sanctuary, were to camp on the south, under Elizaphan son of Uzziel. They were in charge of the ark, the table, the lampstand, the altars, the sacred vessels used in the service, and the hanging. Eleazar son of Aaron was chief over the Levite leaders and oversaw those who kept the sanctuary. The Merarites, 6,200 males, were to camp on the north, under Zuriel son of Abihail. They were in charge of the frames of the tabernacle, its bars, pillars and bases, with all their equipment, and the pillars of the courtyard with their bases, pegs and cords. On the east, in front of the entrance, were to camp Moses, Aaron and his sons, guarding the sanctuary on Israel's behalf; any unauthorized person who came near was to be put to death. All the Levites Moses and Aaron counted, males a month old and older, came to 22,000.
  - range: 40-51
    heading: The firstborn counted and redeemed
    plain: |
      The LORD told Moses to count every firstborn male in Israel a month old and older and to list their names, and to take the Levites for Him in place of the firstborn, and the Levites' livestock in place of Israel's firstborn livestock. Moses counted them, and the firstborn came to 22,273. The LORD said: Take the Levites in place of the firstborn, and their livestock in place of yours; the Levites shall be mine. For the 273 firstborn beyond the number of the Levites, take five shekels apiece by the sanctuary shekel, which is twenty gerahs, and give the money for the excess to Aaron and his sons. So Moses collected the redemption money from the firstborn who were left over, 1,365 shekels by the sanctuary shekel, and gave it to Aaron and his sons, as the LORD had commanded.

notes:
  - ref: 1
    phrase: the generations of Aaron and Moses
    kind: history
    title: Why Aaron comes before Moses
    body: |
      Aaron is named first because the chapter goes on with his descendants, the priests, and not with Moses'. “Generations” is a heading that “marks a fresh start in the history,” and it means “an account of a man and his genealogical descendants.” Moses is usually named first, “but here Aaron has the precedence because the passage deals with his descendants only.”

      Moses' sons hold no priest's office. Chronicles says that “his sons were named of the tribe of Levi” ([[1 Chr. 23:14]]), and one older reading gives that as the reason for the order here: Aaron's “sons received the priesthood, whilst the sons of Moses, on the contrary, were classed among the rest of the Levitical families.” The same reading takes “the generations of Aaron and Moses” broadly, as the whole tribe of Levi, named after the two brothers “because they were both of them raised into the position of heads or spiritual fathers of the whole tribe.”
    sources: [cambridge-numbers, keil-numbers, lds-scriptures]

  - ref: 4
    phrase: and they had no children
    kind: history
    title: Why the verse says they had no children
    body: |
      With no sons to follow them, Nadab and Abihu left the priest's office to their brothers Eleazar and Ithamar. What the two did when they offered “strange fire” is told at [[Lev. 10:1]]. Chronicles draws the consequence in the same words: they “died before their father, and had no children: therefore Eleazar and Ithamar executed the priest's office” ([[1 Chr. 24:2]]).

      So the two served beside their father while he lived. Eleazar is named again as “chief over the chief of the Levites” (verse 32), and at Aaron's death Aaron's garments were put on him ([[Num. 20:28]]).
    sources: [lds-scriptures]

  - ref: 10
    phrase: the stranger that cometh nigh shall be put to death
    kind: words
    title: Who “the stranger” is
    body: |
      The “stranger” here is anyone not authorized for the priest's office the verse has just given to Aaron and his sons: “the unauthorized person who presumes to officiate.” The word is narrower here than in chapter 1, where the same warning kept everyone who was not a Levite away from the tabernacle ([[Num. 1:51]]). Numbers later says who may not come near to burn incense: “that no stranger, which is not of the seed of Aaron, come near to offer incense before the LORD; that he be not as Korah, and as his company” ([[Num. 16:40]]). Korah was himself a Levite who sought the priesthood ([[Num. 16:10]]).

      Numbers gives the purpose of the guard in its own words. The Levites were given to Aaron “that there be no plague among the children of Israel, when the children of Israel come nigh unto the sanctuary” ([[Num. 8:19]]). The same warning closes the description of the camp (verse 38), where Moses, Aaron and his sons keep the entrance.
    sources: [lds-scriptures]

  - ref: 12
    phrase: instead of all the firstborn that openeth the matrix
    kind: history
    title: Why the Levites took the place of the firstborn
    body: |
      Israel's firstborn belonged to the LORD because He had spared them, and the Levites took up the service that was theirs: the firstborn son of each family was at first to serve in a priestly role at the tabernacle, and the tribe of Levi came to fill that role alone. Verse 13 gives the reason for the claim: “on the day that I smote all the firstborn in the land of Egypt I hallowed unto me all the firstborn in Israel.” The law itself is at [[Ex. 13:2]]. On one older reading, the exchange gave the work of the sanctuary to one tribe, “which would and should henceforth devote itself with undivided interest to this vocation.” The same reading finds the reason the LORD chose Levi in the tribe's “firm and faithful defence of the honour of the Lord at the worship of the golden calf” ([[Ex. 32:26]]; see the note there).

      The LORD says again that “the Levites shall be mine” (verse 45), and their cattle are taken for the firstlings of Israel's cattle, “though without their being numbered and exchanged head for head.” In verse 9 the Hebrew behind “wholly given” repeats a single word, “given, given,” and chapter 8 says to whom. The Levites are “wholly given unto me from among the children of Israel; instead of such as open every womb” ([[Num. 8:16]]), and then the LORD gives them “as a gift to Aaron and to his sons” ([[Num. 8:19]]): they are “first given to Jehovah, and by Him given to the priests.”

      [The Firstborn](/exodus/themes/the-firstborn/) follows the claim from the tenth plague to the Firstborn of God.
    sources: [lds-scriptures, scripture-helps-ex-7, keil-numbers, cambridge-numbers, oshb-wlc]

  - ref: 15
    phrase: every male from a month old and upward
    kind: history
    title: Why the Levites were counted from a month old
    body: |
      The Levites were counted from a month old “to correspond with the firstborn,” who are counted the same way (verse 40). The other tribes had been counted from twenty, “all that are able to go forth to war in Israel” ([[Num. 1:3]]), and chapter 4 counts the Levites again “from thirty years old and upward even until fifty years old” for the work of the tabernacle ([[Num. 4:3]]). This count is for neither purpose. The age is the one the law of redemption sets: “those that are to be redeemed from a month old shalt thou redeem” ([[Num. 18:16]]).
    sources: [cambridge-numbers, lds-scriptures]

  - ref: 31
    phrase: their charge shall be the ark
    kind: history
    title: Kohath and the most holy things
    body: |
      Kohath's families had charge of the most holy furnishings, and Moses and Aaron were themselves of Kohath: they “were sons of Amram, a grandson of Levi through Kohath” (verse 19; [[Ex. 6:18–20]]).

      Kohath kept the ark, the table, the candlestick, the altars and “the hanging,” which one older reading takes to be “the veil before the most holy place.” Their work was “to carry the said holy things after they had been rolled up in covers by the priests,” and chapter 4 sets the limit: “they shall not touch any holy thing, lest they die” ([[Num. 4:15]]). Because their burden was the holy things, they alone received no wagons; “they should bear upon their shoulders” ([[Num. 7:9]]). They were “the only Levites whose burden (the tabernacle furniture) was so important that they were required to carry it by hand.”
    sources: [ot-manual-numbers-1-12, keil-numbers, lds-scriptures]

  - ref: 39
    phrase: were twenty and two thousand
    kind: history
    title: Twenty-two thousand, or twenty-two thousand three hundred?
    body: |
      The three clans add up to 22,300 (verses 22, 28, 34), but verse 39 gives 22,000, and the rest of the chapter works from 22,000: the firstborn exceed the Levites by 273 (verses 43, 46). The text does not explain the difference. Two older commentaries take the total as right and one clan's number as a copyist's slip. One proposes Kohath's: “This should probably be read eight thousand and three hundred,” reading “three” (*šālōš*) for “six” (*šēš*) in verse 28. The other agrees that “the total is correct” and that “there is a copyist's error in the number of one of the Levitical families.” The Hebrew text as it has come down reads “six” in verse 28, and the King James follows it.
    sources: [cambridge-numbers, keil-numbers, oshb-wlc]

  - ref: 43
    phrase: were twenty and two thousand two hundred and threescore and thirteen
    kind: history
    title: So few firstborn?
    body: |
      Twenty-two thousand firstborn sons is a small number beside 603,550 men of war ([[Num. 1:46]]), and the text does not say why; the size of Israel's numbers is taken up at [[Ex. 12:37]]. One older reading names the difficulty, that the 22,273 “bore no kind of proportion to the total number of men capable of bearing arms,” and answers it from the law. It holds that the law of the firstborn “was intended chiefly for the future,” so that the 22,273 “consisted only of the first-born sons who had been born between the time of the exodus from Egypt and the numbering of the twelve tribes, which took place thirteen months afterwards.” On that reading a people of that size might have “at least 19,000” firstborn a year, which would account for the number. The chapter itself gives the count and no more.
    sources: [keil-numbers]

  - ref: 47
    phrase: Thou shalt even take five shekels apiece by the poll
    kind: history
    title: Five shekels for each of the 273
    body: |
      The 273 firstborn for whom there was no Levite were bought back at five shekels each, 1,365 shekels in all (verse 50), and the silver went to the priests. President John Taylor read the exchange as the Lord's claim on those He had saved: “the Lord claimed those that He saved as righteously belonging to Him, and claiming them as His He demanded their services.” The Levites met that claim for most of Israel's firstborn, and for the rest “the balance had to be redeemed with money, which was given to Aaron, as the great High Priest and representative of the Aaronic Priesthood.” The other 22,000 are, in the chapter's words, “redeemed by the Levites” (verse 49).

      The price became the standing rule for every later firstborn son: “for the money of five shekels, after the shekel of the sanctuary, which is twenty gerahs” ([[Num. 18:16]]). What a shekel was in Moses' day is at [[Ex. 30:15]].
    sources: [taylor-mediation, lds-scriptures]

christ: |
  The LORD who claims the firstborn here is Jehovah, the premortal Christ (see [[Ex. 3:14]]). His claim on Israel's firstborn sons points to Jesus Christ Himself, the firstborn of the Father's spirit children (see [The Firstborn](/exodus/themes/the-firstborn/)), who said, “I came down from heaven, not to do mine own will, but the will of him that sent me” ([[John 6:38]]).

  Through Him the inheritance of the firstborn reaches the faithful. They “receive through Jesus Christ the inheritance of the firstborn” and are made members of the Church of the Firstborn, for “all those who are begotten through me are partakers of the glory of the same, and are the church of the Firstborn” ([[D&C 93:22]]).

