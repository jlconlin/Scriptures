chapter: 20
title: The Water of Meribah
tagline: Miriam dies at Kadesh; Moses strikes the rock he was told to speak to, and he and Aaron are told they will not bring Israel into the land; Edom refuses its brother passage; and on mount Hor Aaron's garments are put on Eleazar, and Aaron dies.
when: 'At Kadesh in the first month of a year the text does not name; Aaron dies on mount Hor in the fortieth year after the Exodus'

setting: |
  Numbers 20 opens after a long silence. At Kadesh the LORD had sentenced the generation that refused the land to die in the wilderness ([[Num. 14:29–35]]): the people “were condemned by God to wander for 38 years,” and the book tells almost nothing of those years. Verse 1 brings “the whole congregation” back to the wilderness of Zin and to Kadesh “in the first month,” but names no year. Aaron's death at the end of the chapter fell “in the fortieth year after the children of Israel were come out of the land of Egypt” ([[Num. 33:38]]), and one older reading takes the first month of verse 1 to be in that same year, the one in which the forty years of the sentence “came to an end.”

  During the stay near Kadesh, told of at [[Num. 14]], “most of the adult generation of the Israelites who had left Egypt died.” Miriam dies at the start of this chapter (her story is at [[Ex. 15:20]] and in [[Num. 12]]), Aaron at its end, and with Aaron's death the book's last portion begins, “the final year or so” of the forty.

  Later scripture keeps returning to Meribah. The LORD names it again when He shows Moses the land ([[Num. 27:14]]; [[Deut. 32:51]]), Moses speaks of it in his last speeches ([[Deut. 3:26]]), and Psalm 106 sings it ([[Ps. 106:32–33]]).

thread: |
  Numbers 20 **turns on the LORD's holiness at Kadesh.** His charge against Moses and Aaron is that they did not believe Him, “to sanctify me in the eyes of the children of Israel” (verse 12), and the account of the water ends, “he was sanctified in them” (verse 13), at a place whose name, *Qādēš*, means “sacred” and comes from the same root (see the note on verse 13).

  Around that center are the other events the Church's chapter heading names. Miriam dies (verse 1). The people quarrel for water and wish they had died (verses 2–5), and the book counts this quarrel among the rebellions “against Jehovah and Moses” during the years near Kadesh. Edom, Israel's brother, will not let Israel pass, and Israel turns away (verses 14–21). On mount Hor the high priest's garments pass from Aaron to his son Eleazar, and Aaron dies (verses 22–29).

sections:
  - range: 1-5
    heading: No water at Kadesh
    plain: |
      In the first month the whole congregation of Israel came into the wilderness of Zin, and the people stayed at Kadesh. Miriam died there and was buried there. There was no water for the congregation, and they gathered against Moses and Aaron. The people contended with Moses: If only we had died when our brothers died before the LORD! Why have you brought the LORD's congregation into this wilderness, for us and our cattle to die here? Why did you make us come up out of Egypt, to bring us to this evil place? It is no place to sow, and it has no figs, no vines and no pomegranates, and there is no water to drink.
  - range: 6-13
    heading: The water of Meribah
    plain: |
      Moses and Aaron left the assembly, went to the door of the tent of meeting, and fell on their faces, and the glory of the LORD appeared to them. The LORD said to Moses: Take the rod, and you and Aaron your brother gather the assembly. Speak to the rock before their eyes, and it will give out its water. So you will bring water out of the rock for them and give the congregation and their animals drink. Moses took the rod from before the LORD, as He had commanded him. Moses and Aaron gathered the congregation in front of the rock, and Moses said to them, Listen now, you rebels: must we bring you water out of this rock? Then Moses raised his hand and struck the rock twice with his rod. Water poured out, and the congregation and their animals drank. And the LORD said to Moses and Aaron: Because you did not believe Me, so as to show Me holy in the eyes of the children of Israel, you will not bring this congregation into the land I have given them. This is the water of Meribah, where the children of Israel contended with the LORD, and He showed Himself holy among them.
  - range: 14-21
    heading: Edom refuses its brother
    plain: |
      From Kadesh Moses sent messengers to the king of Edom: This is what your brother Israel says. You know all the hardship that has come upon us: how our fathers went down into Egypt, and we lived in Egypt a long time, and the Egyptians mistreated us and our fathers. When we cried to the LORD, He heard our voice, sent an angel, and brought us out of Egypt. Now we are at Kadesh, a town at the edge of your border. Please let us pass through your country. We will not go through fields or vineyards or drink water from the wells. We will keep to the king's highway and not turn to the right or the left until we have passed your borders. Edom answered: You shall not pass through my land, or I will come out against you with the sword. The Israelites said: We will keep to the highway, and if we or our cattle drink any of your water, we will pay for it. We will only pass through on foot, and do nothing else. But Edom said, You shall not pass through. And Edom came out against them with many people and a strong hand. So Edom refused to let Israel pass through its border, and Israel turned away from him.
  - range: 22-29
    heading: Aaron dies on mount Hor
    plain: |
      The whole congregation of Israel set out from Kadesh and came to Mount Hor. At Mount Hor, on the border of Edom, the LORD said to Moses and Aaron: Aaron will be gathered to his people. He will not enter the land I have given the children of Israel, because you rebelled against My word at the water of Meribah. Take Aaron and his son Eleazar and bring them up Mount Hor. Take Aaron's garments off him and put them on Eleazar his son; Aaron will be gathered to his people and will die there. Moses did as the LORD commanded. They went up Mount Hor in the sight of the whole congregation, and Moses took off Aaron's garments and put them on Eleazar his son. Aaron died there on the top of the mountain, and Moses and Eleazar came down. When the whole congregation saw that Aaron was dead, all the house of Israel mourned for him thirty days.

notes:
  - ref: 3
    phrase: Would God that we had died when our brethren died before the LORD!
    kind: history
    title: The brethren who died before the LORD
    body: |
      The people may mean the kin they had just lost or the generation dying out in the wilderness; the verse does not say which. A Latter-day Saint reading sets the wish beside the death just told: “the people wish they had died along with their lost kin,” as Moses and Aaron “had lost their sister,” and the complaint, whatever else was in it, “may have sprung from true sorrow and mourning.” One older reading takes the brethren instead to be “those who had died one by one” in the years since the sentence at Kadesh, the generation dying out in the wilderness ([[Num. 14:29]]).

      The people had made the same wish after the spies' report: “would God we had died in this wilderness!” ([[Num. 14:2]]).
    sources: [keil-numbers, ot-minute-num, lds-scriptures]

  - ref: 9
    phrase: Moses took the rod from before the LORD
    kind: history
    title: Which rod Moses took
    body: |
      The text does not say whose rod it was, only that Moses took it “from before the LORD,” and readers differ. A Latter-day Saint reading takes it to be Aaron's rod, the one “with which the Lord had shown the children of Israel that Aaron and the tribe of Levi had been chosen to serve in the tabernacle” (how it budded is told at [[Num. 17:8]]); the LORD had ordered it kept “before the testimony, to be kept for a token against the rebels” ([[Num. 17:10]]). That reading also says Moses “must have entered into the most holy place” to fetch it, and takes this to show “how Moses's priesthood surpasses Aaron's.” That is the reading's inference, not something the text says.

      One older reading takes it instead to be “the rod with which he had performed miracles in Egypt,” also “laid up in the sanctuary,” and not Aaron's. The Church's footnote to “rod” in verse 8 points to the staff Moses carried back to Egypt: “Moses took the rod of God in his hand” ([[Ex. 4:20]]).
    sources: [ot-minute-num, keil-numbers, lds-scriptures]

  - ref: 12
    phrase: Because ye believed me not, to sanctify me in the eyes of the children of Israel
    kind: history
    title: What Moses did at Meribah
    body: |
      The charge of this verse rests on the difference between what the LORD commanded in verse 8 and what Moses did in verses 10–11. The LORD said to take the rod, gather the assembly, and “speak ye unto the rock before their eyes” (verse 8). Moses took the rod and gathered the assembly, but then he spoke to the people instead, “Hear now, ye rebels; must we fetch you water out of this rock?” (verse 10), and struck the rock twice. The water came all the same. The LORD chastened Moses and Aaron “for straying from his instructions,” and in asking “must we fetch you water” they “failed to give credit to the Lord for this miracle.”

      A Latter-day Saint reading notices the order. The instructions were to take the rod, “gather the people, and speak to the rock to produce water, in that order”; Moses “takes the rod, gathers the people, speaks to the people, and then strikes the rock.” Had he spoken to the rock, “it would have obediently produced water, showing that the rock was more obedient than the people.” And because the instructions came “through direct communication with the Lord,” the prophet's punishment was the greater. One older reading starts from the verse's own word, belief: the fault was not distrust of God's power but “a momentary wavering of that immovable assurance” the two leaders owed the congregation; Moses' words were “fitted to strengthen the people in their unbelief,” and Aaron “wavered along with Moses, inasmuch as he did nothing to prevent Moses' fall.”

      The word Moses used of the people, “rebels” (*hammōrîm*, from *mārâ*, “to rebel, be disobedient”), is the verb the LORD then uses of Moses and Aaron: “ye rebelled against my word at the water of Meribah” (verse 24; again at [[Num. 27:14]]). Moses' own speeches put the cause with the people, “for your sakes” ([[Deut. 3:26]]), and Psalm 106 says “he spake unadvisedly with his lips” ([[Ps. 106:33]]). The note at [[Deut. 3:26]] sets these accounts side by side, and the theme page [Let It Suffice Thee](/deuteronomy/themes/let-it-suffice-thee/) follows Moses' plea to enter the land.
    sources: [scripture-helps-num, ot-minute-num, keil-numbers, oshb-wlc, lds-scriptures]

  - ref: 13
    phrase: he was sanctified in them
    kind: words
    title: Kadesh, where the LORD was sanctified
    body: |
      Moses and Aaron failed to show the LORD holy before the people, and the verse says He was shown holy among them all the same. “To sanctify me” in verse 12 and “was sanctified” here are forms of *qādaš*, “to consecrate, sanctify, set apart, make holy,” and the place is *Qādēš*, Kadesh, a name that means “sacred.” One older reading explains how the LORD was sanctified: He “put their unbelief to shame by the miraculous gift of water,” and He “punished Moses and Aaron for the weakness of their faith.” The same commentary conjectures that the place took the name Kadesh from the refusal of chapter 14, “or possibly” from this day.

      The name of the water, Meribah, “Strife,” had been given once before, at Rephidim, where Moses was commanded to strike the rock (see the note at [[Ex. 17:7]]). The same older reading draws the difference between the two days: at Rephidim “the murmuring of the people was stayed,” while at Kadesh “the mediators of His mercy, Moses and Aaron, sinned.”
    sources: [oshb-wlc, bdb, keil-numbers, lds-scriptures]

  - ref: 14
    phrase: Thus saith thy brother Israel
    kind: history
    title: Edom, the brother who would not let Israel pass
    body: |
      Moses appeals to kinship. Edom is the people “descended from Esau,” Jacob's brother, and “Edomites and Israelites were cousins” (see the note at [[Deut. 2:5]]). The messengers tell Israel's story as family history, down to the LORD who “sent an angel” (verse 16). They ask only for the “king's high way” (verse 17), “the public high road, which was probably made at the cost of the state, and kept up for the king and his armies to travel upon.”

      Edom refused twice and came out armed (verses 18, 20). A Latter-day Saint reading finds the refusal unsurprising: Israel promised not to touch the fields, vineyards or wells, but a people who “had complained more than once about the lack of both fruit … and water” gave the king “every reason to doubt” it. On the same reading the second offer, to pay for water but with no word about the grapes, was the messengers' own, “straying from the original instructions”: as “Moses had not followed the Lord's words exactly,” his messengers did not follow his. Moses' later speech tells the passage by Edom differently ([[Deut. 2:29]]); the note there sets the accounts side by side.
    sources: [ot-minute-num, ot-manual-numbers-13-36]

  - ref: 26
    phrase: strip Aaron of his garments, and put them upon Eleazar his son
    kind: history
    title: Aaron’s garments put on Eleazar
    body: |
      The garments carried the office, and the office passed before Aaron died. The law had provided that “the holy garments of Aaron shall be his sons' after him, to be anointed therein, and to be consecrated in them” ([[Ex. 29:29]]). On mount Hor it happens in the sight of the congregation: Moses takes the garments from Aaron and puts them on Eleazar, and then Aaron dies (verses 27–28). One older reading notes that such a transfer of office by the clothes “was called investing or investment, (clothing;) as removing a person from an office was termed divesting or unclothing.” Aaron, though, “was not retiring in dishonor or disgrace”: he gave up the garments at the LORD's command. Eleazar was Aaron's “third son.”

      A Latter-day Saint reading suggests why the change was made on a mountain, “a natural temple,” rather than at the tabernacle: “the risk of having a dying and perhaps dead body in the tabernacle.” It notes too that Aaron's death, unlike Moses', took place before the whole congregation.

      Aaron died at 123 years old ([[Num. 33:39]]), and Israel mourned him thirty days, as it would mourn Moses ([[Deut. 34:8]]). Deuteronomy names Mosera as the place of his death; see the note at [[Deut. 10:6]].
    sources: [lds-scriptures, ot-manual-numbers-13-36, bd-eleazar, ot-minute-num]

christ: |
  The LORD who gave the water at Kadesh is Jehovah, the premortal Christ (see [[Ex. 3:14]]), and Paul says of the rock that followed Israel, “that Rock was Christ” ([[1 Cor. 10:4]]; see the note at [[Ex. 17:6]]). The sentence at Meribah did not end Moses' service. “The Lord took Moses unto himself” ([[Alma 45:19]]); he stood with the Savior on the mount ([[Matt. 17:3]]); and in this dispensation he “committed unto us the keys of the gathering of Israel from the four parts of the earth” ([[D&C 110:11]]).

  At Meribah the water was the Lord's, and so was the credit for it (see the note on verse 12). In the Lord's work today the power that blesses others is still His, and so is the credit. And a real failure, even one with a lasting consequence, does not end a disciple's place in that work: Moses' actions “did not disqualify him from all future responsibilities and blessings.”

explore: |
  - **Meribah remembered.** [[Num. 27:12–14]]; [[Deut. 32:48–52]]; [[Ps. 106:32–33]]; and Moses' plea to cross at [[Deut. 3:23–27]], with the theme page [Let It Suffice Thee](/deuteronomy/themes/let-it-suffice-thee/).
  - **The first water from the rock.** [[Ex. 17:1–7]], where Moses was commanded to strike.
  - **The passage by Edom, told again.** [[Deut. 2:1–8]]; [[Judg. 11:16–18]].
  - **Moses after Meribah.** [[Alma 45:19]]; [[Matt. 17:1–8]]; [[D&C 110:11]].

parallels:
  - ref: Ex. 17:1–7
    note: Water from the rock at Rephidim, also named Meribah, where Moses was commanded to strike the rock.
  - ref: Num. 27:12–14
    note: The LORD repeats the sentence of Meribah when He shows Moses the land.
  - ref: Deut. 32:48–52
    note: The sentence repeated before Nebo, with Aaron's death on mount Hor.
  - ref: Ps. 106:32–33
    note: The psalm's verdict on the waters of strife.
  - ref: Deut. 2:1–8
    note: Moses' account of passing by the children of Esau.
  - ref: Judg. 11:16–18
    note: Jephthah recalls that the king of Edom would not hearken.
  - ref: Num. 33:37–39
    note: Aaron's death on mount Hor dated, with his age.
  - ref: Deut. 10:6
    note: Aaron's death and Eleazar's succession, placed at Mosera.

