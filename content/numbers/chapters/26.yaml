chapter: 26
title: Not a Man of Them Left
tagline: 'On the plains of Moab, Moses and Eleazar count Israel again, tribe by tribe and family by family. The total is almost what it was at Sinai, but the men are not the same: of all those counted there, only Caleb and Joshua remain.'
when: 'On the plains of Moab by Jordan near Jericho, in the fortieth year after the Exodus ([[Num. 26:3]]; [[Num. 33:38]])'

setting: |
  Numbers 26 opens the last part of the book. Israel is camped “in the plains of Moab by Jordan near Jericho” (verse 3), the last main place of the journey, where the book's remaining chapters stay: the second census, Joshua's appointment as Moses' successor, and the settling of Reuben, Gad and half of Manasseh east of the Jordan. The count is taken “after the plague” (verse 1), the one at Baal-peor that killed twenty-four thousand ([[Num. 25:9]]). Aaron has died on mount Hor in the fortieth year after the Exodus ([[Num. 20:28]]; [[Num. 33:38]]), and his garments have passed to his son Eleazar ([[Num. 20:26]]), so Moses now counts with Eleazar.

  This census is the line between the generations. The people of the Exodus are dead, and their children stand at the edge of the promised land (verses 64–65). The list is built on the first one ([[Num. 1:1–46]]): the same twelve tribes, men twenty and older “able to go to war” (verse 2), and Levi counted apart. What is new is that each tribe is counted by its families, and their names largely follow the list of Jacob's household that went down into Egypt ([[Gen. 46:8–27]]).

  Later scripture remembers the generation this count no longer finds. Hebrews asks, “with whom was he grieved forty years? was it not with them that had sinned, whose carcases fell in the wilderness?” ([[Heb. 3:17]]).

thread: |
  Numbers 26 is **the count that closes one generation and opens the next.** Thirty-eight years after Sinai the men are numbered the same way, and the totals are close, 603,550 then and 601,730 now ([[Num. 1:46]]; verse 51). What has changed is who they are. The closing verses say it plainly: of the men Moses and Aaron counted in the wilderness of Sinai, not one is left but Caleb and Joshua (verses 64–65).

  The count also looks forward. The men are again counted as those “able to go to war” (verse 2), but now the count also serves the inheritance: “Unto these the land shall be divided” (verse 53). So the list goes tribe by tribe and family by family, naming the clans that would receive land, and it names the daughters of a man who left no son (verse 33), whose claim the next chapter takes up. The Levites, 23,000 now against 22,000 at the first count ([[Num. 3:39]]), are numbered apart again, “because there was no inheritance given them” (verse 62). The children of the generation that refused the land at Kadesh are the ones counted to receive it, as the LORD had said they would be ([[Num. 14:31]]).

sections:
  - range: 1-4
    heading: Count them again
    plain: |
      After the plague, the LORD said to Moses and to Eleazar son of Aaron the priest, “Take a census of the whole community of Israel by their fathers' houses, every man twenty years old and older who is able to serve in Israel's army.” So Moses and Eleazar the priest spoke with them on the plains of Moab by the Jordan near Jericho and said, “Count the people from twenty years old and up, as the LORD commanded Moses and the Israelites who came out of the land of Egypt.”
  - range: 5-27
    heading: Reuben to Zebulun
    plain: |
      Reuben, Israel's firstborn: his descendants formed the clans of Hanoch, Pallu, Hezron and Carmi, and they numbered 43,730. Pallu's son was Eliab, and Eliab's sons were Nemuel, Dathan and Abiram. These are the Dathan and Abiram, men of note in the community, who rebelled against Moses and Aaron with Korah's company when they rebelled against the LORD. The earth opened its mouth and swallowed them with Korah when that company died and fire consumed the two hundred and fifty men, and they became a warning. But the sons of Korah did not die.

      Simeon's clans were Nemuel, Jamin, Jachin, Zerah and Shaul: 22,200. Gad's clans were Zephon, Haggi, Shuni, Ozni, Eri, Arod and Areli: 40,500. Judah's sons Er and Onan had died in Canaan; his clans were Shelah, Pharez and Zerah, with Pharez's sons Hezron and Hamul: 76,500. Issachar's clans were Tola, Pua, Jashub and Shimron: 64,300. Zebulun's clans were Sered, Elon and Jahleel: 60,500.
  - range: 28-51
    heading: Joseph to Naphtali, and the total
    plain: |
      Joseph's sons were counted by their clans as Manasseh and Ephraim. Manasseh's son Machir was the father of Gilead, and Gilead's sons founded the clans of Jeezer, Helek, Asriel, Shechem, Shemida and Hepher. Zelophehad son of Hepher had no sons, only daughters: Mahlah, Noah, Hoglah, Milcah and Tirzah. Manasseh numbered 52,700. Ephraim's clans were Shuthelah, Becher and Tahan, with Shuthelah's son Eran: 32,500. These were Joseph's descendants by their clans.

      Benjamin's clans were Bela, Ashbel, Ahiram, Shupham and Hupham, with Bela's sons Ard and Naaman: 45,600. Dan's one clan was Shuham: 64,400. Asher's clans were Jimna, Jesui and Beriah, with Beriah's sons Heber and Malchiel, and Asher's daughter was named Sarah: 53,400. Naphtali's clans were Jahzeel, Guni, Jezer and Shillem: 45,400. The total of the Israelites counted was 601,730.
  - range: 52-56
    heading: The land by size and by lot
    plain: |
      The LORD said to Moses, “The land is to be divided among these as their inheritance by the number of names. Give a larger inheritance to a large tribe and a smaller one to a small tribe; each is to receive its inheritance by the number of those counted in it. But the land is to be divided by lot; they shall inherit by the names of their ancestral tribes. Each inheritance, whether for a large tribe or a small one, is to be assigned by lot.”
  - range: 57-62
    heading: The Levites
    plain: |
      These were the Levites counted by their clans: Gershon, Kohath and Merari, and among them the clans of Libni, Hebron, Mahli, Mushi and Korah. Kohath was the father of Amram, and Amram's wife was Jochebed, a daughter of Levi born to him in Egypt; she bore Amram Aaron and Moses and their sister Miriam. Aaron's sons were Nadab, Abihu, Eleazar and Ithamar, but Nadab and Abihu died when they offered strange fire before the LORD. The Levites counted, every male a month old and older, were 23,000. They were not counted with the other Israelites, because they were given no inheritance among them.
  - range: 63-65
    heading: Only Caleb and Joshua
    plain: |
      These are the people Moses and Eleazar the priest counted on the plains of Moab by the Jordan near Jericho. Not one of them was among those Moses and Aaron the priest had counted in the wilderness of Sinai. For the LORD had said of those men, “They will surely die in the wilderness,” and not one of them was left except Caleb son of Jephunneh and Joshua son of Nun.

notes:
  - ref: 1
    phrase: after the plague
    kind: history
    title: Why count again now
    body: |
      The count is taken “after the plague” at Baal-peor ([[Num. 25:9]]; on the episode, see [[Num. 25:3]]), and by then the generation counted at Sinai is gone, as the chapter's last verses say (verses 64–65). One older reading takes the timing as the reason for the count: “with the plague the last of those who came out of Egypt, and were not to enter Canaan, had been swept away, and thus the sentence had been completely executed.”

      The same reading gives the count a second purpose besides mustering an army for the wars ahead. It was also “a preparation for their settlement in Canaan,” for the division of the land “among the tribes and families of Israel,” and that is why this list, unlike the one in chapter 1, counts each tribe by its families. The instructions for dividing the land follow the count at once (verses 52–56).
    sources: [cambridge-numbers, keil-numbers]

  - ref: 10
    phrase: they became a sign
    kind: words
    title: A sign is a warning
    body: |
      “A sign” here means a warning. The Hebrew *nēs* is a banner, standard or signal, and in this verse it has the sense “sign … = warning”; Numbers had already used the word of what was left of Korah's rebellion: the censers of the two hundred and fifty men, beaten into plates to cover the altar, were to be “a sign unto the children of Israel” ([[Num. 16:38]]), a memorial that no one outside Aaron's line should come to offer incense ([[Num. 16:40]]). There it was the censers that were the sign; here it is the men themselves.

      Verse 11 then sets one family apart from the judgment: “Notwithstanding the children of Korah died not.” Who their descendants became is the subject of the note on the title of [[Ps. 42]]; the rebellion itself is told in chapter 16 ([[Num. 16:3]]).
    sources: [bdb, cambridge-numbers]

  - ref: 33
    phrase: had no sons, but daughters
    kind: history
    title: Five daughters in a list of men
    body: |
      The five daughters are named because Zelophehad of Manasseh left no son, in a census taken so that the land could be divided by families (verses 53–54). One older reading says their names are given here “to prepare the way for the legal regulations” that this fact gave rise to. In the next chapter the daughters themselves ask, “Why should the name of our father be done away from among his family, because he hath no son? Give unto us therefore a possession” ([[Num. 27:4]]). What the LORD answered is the subject of the note at [[Num. 27:1]].
    sources: [keil-numbers]

  - ref: 34
    phrase: fifty and two thousand and seven hundred
    kind: history
    title: Manasseh and Ephraim reversed
    body: |
      The second census reverses Joseph's two sons. At Sinai the younger, Ephraim, was the larger tribe, 40,500 to Manasseh's 32,200 ([[Num. 1:33]]; [[Num. 1:35]]). Here Manasseh, the elder ([[Gen. 41:51–52]]), has 52,700 and Ephraim 32,500 (verses 34, 37). Manasseh grew by 20,500 men, more than any other tribe, and Ephraim fell by 8,000. The order of the list changes with the numbers: in chapter 1 Ephraim stands first of the two, and here Manasseh does, while the other tribes keep their places. The text gives no reason for either change.

      The reversal bears on one reading of the first count, that Ephraim's larger number there fulfilled Jacob's blessing, that the younger brother “shall be greater than he” ([[Gen. 48:19]]). The note at [[Num. 1:46]] gives that reading and what this count does to it.
    sources: [cambridge-numbers, lds-scriptures]

  - ref: 51
    phrase: six hundred thousand and a thousand seven hundred and thirty
    kind: history
    title: Almost the same total, not the same tribes
    body: |
      After thirty-eight years the total is almost what it was: 601,730 men, 1,820 fewer than the 603,550 counted at Sinai ([[Num. 1:46]]). Inside that total the tribes moved a great deal. Seven grew and five shrank, Reuben, Simeon, Gad, Ephraim and Naphtali, and Simeon fell furthest, from 59,300 to 22,200 ([[Num. 1:23]]; verse 14). Judah is still the largest tribe, at 76,500 (verse 22). The text gives no reason for any of the changes.

      One older reading sees in the small loss overall a measure of the wilderness judgments: a people would be expected to grow by births, so a count “1820 less than those reckoned at Sinai” shows “by implication, how severe the punishments had been.” Whether numbers this large have come down as first written is taken up at [[Ex. 12:37]].
    sources: [cambridge-numbers, lds-scriptures]

  - ref: 55
    phrase: the land shall be divided by lot
    kind: history
    title: By size and by lot
    body: |
      The land was to be shared out two ways at once: by size, more to a large tribe and less to a small one (verse 54), and by lot (verses 55–56). The text does not say how the two fit together. Older readings answer that a lot could not fix how much land a tribe received, only where it would be; the tribe's size then set the amount. Since the share was to be proportionate, “the purpose of the lot must only have been to decide roughly in what part of the country each tribe was to settle.”

      One of them adds why a lot was used at all: so that each tribe “might receive with gratitude the possession that fell to its lot as the inheritance assigned it by God,” since the result of a lot was widely regarded as determined by God. The same reading points to Proverbs: “The lot is cast into the lap; but the whole disposing thereof is of the LORD” ([[Prov. 16:33]]). The division was carried out that way after the conquest, under Eleazar and Joshua: “By lot was their inheritance, as the LORD commanded by the hand of Moses” ([[Josh. 14:2]]).
    sources: [cambridge-numbers, keil-numbers]

  - ref: 64
    phrase: there was not a man of them whom Moses and Aaron the priest numbered
    kind: scripture
    title: The sentence carried out
    body: |
      The chapter ends by reporting that the sentence passed at Kadesh had been carried out to the man. There the LORD had said that the men counted at Sinai, twenty years old and upward, would fall in the wilderness, all but Caleb and Joshua ([[Num. 14:29–30]]), and that their children would enter instead: “your little ones, which ye said should be a prey, them will I bring in” ([[Num. 14:31]]). The count on the plains of Moab finds exactly that.

      A reader may ask about Eleazar, who was already a priest at Sinai ([[Num. 3:2–4]]) and enters Canaan to divide the land ([[Josh. 14:1]]). One older reading answers from the first census: the tribe of Levi “was excepted from the numbering in ch. 1, and therefore Aaron's sons were not included among the persons numbered, who were sentenced to die in the wilderness.”
    sources: [lds-scriptures, keil-numbers]

christ: |
  The LORD who orders this count is Jehovah, the premortal Christ (see [[Ex. 3:14]]), and the chapter shows Him keeping both halves of His word at Kadesh: the men who refused the land are gone (verse 65), and the little ones He promised to bring in are counted to inherit it ([[Num. 14:31]]). Latter-day revelation says what that generation lost: Moses sought to sanctify his people “that they might behold the face of God,” but they hardened their hearts, and the Lord swore they should not enter His rest, “which rest is the fulness of his glory” ([[D&C 84:23–24]]).

  Hebrews reads this generation as a warning to Christians: “they could not enter in because of unbelief” ([[Heb. 3:19]]), and “we are made partakers of Christ, if we hold the beginning of our confidence steadfast unto the end” ([[Heb. 3:14]]). The promise of the Lord's rest still stands for a disciple, and it is received by holding to Christ to the end, as Caleb and Joshua “wholly followed the LORD” through the forty years ([[Num. 32:12]]).

explore: |
  - **The first census.** [[Num. 1:1–46]], and the Levites counted apart, [[Num. 3:14–39]].
  - **The daughters of Zelophehad.** [[Num. 27:1–11]] and [[Num. 36:1–12]].
  - **The land by lot.** [[Num. 33:54]]; [[Josh. 14:1–5]].
  - **The generation remembered.** [[1 Cor. 10:1–11]]; [[Heb. 3:16–19]]; [[D&C 84:19–25]].

parallels:
