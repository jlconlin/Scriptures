chapter: 29
title: The Offerings of the Seventh Month
tagline: The trumpets, the Day of Atonement and the feast of Tabernacles each get their count of bullocks, rams, lambs and goats, and at Tabernacles the bullocks fall one a day from thirteen to seven.
when: 'On the plains of Moab, in the fortieth year'

setting: |
  Numbers 29 is the second half of a single list. Israel is camped on the plains of Moab in the fortieth year after the Exodus. The generation that left Egypt has died, the new one has been counted (chapter 26), and Joshua has been appointed to lead it (chapter 27). Before they cross the Jordan, the LORD sets out the offerings the whole congregation is to bring through the year: the daily, sabbath and new-moon offerings and the spring feasts in chapter 28, and the seventh month in this chapter, whose last verse closes the list of both chapters.

  The days themselves were already named in Leviticus. The trumpets, the Day of Atonement and the booths have their notes at [[Lev. 23:24]], [[Lev. 23:27]] and [[Lev. 23:34–43]], and the high priest's rite for the Day of Atonement is [[Lev. 16]]. What Numbers adds is the count: how many animals, and how much flour, oil and wine, for each day. Numbers 28–29 is one of the law's festival calendars, and on one Latter-day Saint reading “no person could claim to keep the law of Moses and not observe these special holy days.”

thread: |
  Numbers 29 is **the fullest month of the year, written as the altar's ledger.** Three holy days fall in the seventh month: the first day, a day of blowing trumpets (verses 1–6); the tenth, the Day of Atonement (verses 7–11); and the fifteenth, which begins seven days of Tabernacles, with an eighth day of assembly after them (verses 12–38). For each day the same formula returns: a burnt offering of bullocks, rams and yearling lambs “without blemish”; a meal offering of flour mixed with oil, three tenth deals with each bullock, two with each ram, one with each lamb (verses 3–4; the measure is explained at [[Num. 15:4]]); drink offerings “according to their number”; and one goat for a sin offering. Each set is “beside,” that is, in addition to, what was already on the altar, above all the daily offering of [[Num. 28:3]].

  The first, tenth and eighth days share one small set: a bullock, a ram and seven lambs. Between them stand the seven days of Tabernacles, the feast with more burnt offerings than any other in the year, the bullocks falling one a day from thirteen to seven (see the note on verse 13). The eighth day returns to the small set and closes the season (see the note on verse 35).

  The list ends by naming what it leaves out. These are the congregation's offerings, given “beside your vows, and your freewill offerings” (verse 39), the gifts that individuals or families might bring of their own will or under a vow. Vows are the subject of the next chapter. The last verse says that Moses told Israel all of it.

sections:
  - range: 1-6
    heading: The day of trumpets
    plain: |
      On the first day of the seventh month hold a holy gathering and do no laborious work; it is a day for you to sound the trumpets. Offer as a burnt offering, a pleasing aroma to the LORD, one young bull, one ram and seven yearling lambs without defect. With them bring their grain offering of flour mixed with oil: three tenths of an ephah for the bull, two tenths for the ram, and one tenth for each of the seven lambs. Offer also one male goat as a sin offering, to make atonement for you. All this is in addition to the burnt offering of the new moon with its grain offering, and the daily burnt offering with its grain offering, and their drink offerings, as they are prescribed: a pleasing aroma, an offering by fire to the LORD.
  - range: 7-11
    heading: The Day of Atonement
    plain: |
      On the tenth day of this seventh month hold a holy gathering. Humble yourselves by fasting, and do no work at all. Offer the LORD a burnt offering, a pleasing aroma: one young bull, one ram and seven yearling lambs, all without defect, with their grain offering of flour mixed with oil, three tenths of an ephah for the bull, two tenths for the ram, and one tenth for each of the seven lambs. Offer one male goat as a sin offering. This is in addition to the sin offering of atonement, and the daily burnt offering with its grain offering, and their drink offerings.
  - range: 12-34
    heading: The seven days of Tabernacles
    plain: |
      On the fifteenth day of the seventh month hold a holy gathering and do no laborious work, and keep a feast to the LORD for seven days. On the first day offer a burnt offering, an offering by fire, a pleasing aroma to the LORD: thirteen young bulls, two rams and fourteen yearling lambs, all without defect, with their grain offering of flour mixed with oil, three tenths of an ephah for each of the thirteen bulls, two tenths for each of the two rams, and one tenth for each of the fourteen lambs, and one male goat as a sin offering, in addition to the daily burnt offering with its grain offering and drink offering.

      On each of the following days offer two rams and fourteen yearling lambs without defect, with one bull fewer each day: twelve on the second day, eleven on the third, ten on the fourth, nine on the fifth, eight on the sixth and seven on the seventh. Each day bring the grain offerings and drink offerings for the bulls, the rams and the lambs according to their number, as prescribed, and one goat as a sin offering, in addition to the daily burnt offering with its grain offering and drink offering.
  - range: 35-38
    heading: The eighth day
    plain: |
      On the eighth day hold an assembly and do no laborious work. Offer a burnt offering, an offering by fire, a pleasing aroma to the LORD: one bull, one ram and seven yearling lambs without defect, with the grain offering and drink offerings for the bull, the ram and the lambs according to their number, as prescribed, and one goat as a sin offering, in addition to the daily burnt offering with its grain offering and drink offering.
  - range: 39-40
    heading: The end of the list
    plain: |
      These are what you are to offer the LORD at your appointed feasts, in addition to your vows and your freewill offerings, whether burnt offerings, grain offerings, drink offerings or peace offerings. And Moses told the Israelites everything the LORD had commanded him.

notes:
  - ref: 6
    phrase: Beside the burnt offering of the month
    kind: history
    title: Offerings on top of offerings
    body: |
      On the first day of the seventh month the altar received three sets of offerings, because the day was also a new moon. “Beside” here means “in addition to.” On one older reading the three were: the daily lamb, morning and evening ([[Num. 28:3–4]]; first commanded at [[Ex. 29:38–42]]); in the morning, after the daily lamb, the offering required at every new moon, two bullocks, one ram and seven lambs ([[Num. 28:11]]); and this day's own offering, one bullock, one ram and seven lambs, with a goat for a sin offering (verses 2–5).

      The same “beside” closes the directions for every day in the chapter (verses 11, 16, 19, 22 and on to 38); the daily offering beneath them all is explained at [[Num. 28:3]]. What the trumpets of this day meant is at [[Lev. 23:24]].
    sources: [keil-numbers, lds-scriptures]

  - ref: 11
    phrase: beside the sin offering of atonement
    kind: scripture
    title: The sin offering of atonement
    body: |
      The “sin offering of atonement” is the rite that gave the day its name, and the verse mentions it only in passing. The high priest's offerings for that day, given in [[Lev. 16]], are assumed here; this chapter adds to them a burnt offering and a goat for a sin offering of the same size as the first day's (verses 8–11). Both older readings take the phrase as pointing to Leviticus 16: the festal offering came “in addition to the sin-offering of atonement prescribed at Leviticus 16,” and the phrase is “an incidental reference to the solemn ceremony which gave its name to the day.” The people's part, to “afflict your souls” (verse 7), was an expression for fasting; it is explained at [[Lev. 16:29]].
    sources: [cambridge-numbers, keil-numbers, lds-scriptures]

  - ref: 12
    phrase: ye shall keep a feast unto the LORD seven days
    kind: scripture
    title: Burnt offerings at King Benjamin's gathering
    body: |
      One Latter-day Saint study reads King Benjamin's gathering at the temple in Zarahemla in the light of Israel's autumn feasts, this one among them, and notes that it opens with sacrifice. Before the king spoke, the people “took of the firstlings of their flocks, that they might offer sacrifice and burnt offerings according to the law of Moses” ([[Mosiah 2:3]]). The study sets that verse beside this chapter's list for the feast, and points out how seldom the Book of Mormon mentions sacrifice at all: twice on Lehi's journey ([[1 Ne. 5:9]]; [[1 Ne. 7:22]]), and once when the Lord ends it ([[3 Ne. 9:19]]). “It is significant, then,” that sacrifices are mentioned here.

      The same study reads the gathering as a covenant renewal, as the feast was in Israel: “in both Jerusalem and Zarahemla this day was a day of covenant renewal.” The tents the people pitched facing the temple ([[Mosiah 2:6]]) are discussed at [[Lev. 23:43]]. The Book of Mormon never names the feast, as the study itself notes; the link is that study's reading.
    sources: [welch-szink-festivals, lds-scriptures]

  - ref: 13
    phrase: thirteen young bullocks
    kind: history
    title: Thirteen bullocks down to seven
    body: |
      Tabernacles had more burnt offerings than any other feast of the year, and its bullocks fell by one each day. Over the seven days the altar received 70 bullocks, 14 rams and 98 lambs, with a goat each day for a sin offering, sacrifices “greater in number than those connected with the two previous celebrations” of the month. On one older reading the rams and lambs were “double the number offered at the Passover and feast of Pentecost,” and the oxen “fivefold.”

      The text gives no reason for the falling count. The same older reading offers two, as probable rather than certain: the count was “probably” arranged “for the purpose of securing the holy number seven for this last day,” and the steady drop marked “the gradual decrease in the festal character of the seven festal days.” It explains the size of the offerings from the feast's season: Tabernacles came after the fruit and the grapes were gathered in, and so was fitted “to fill their hearts with the greatest joy and gratitude towards the Lord and Giver of them all.” The rejoicing the law commanded at this feast is at [[Lev. 23:40]].
    sources: [keil-numbers, welch-szink-festivals]

  - ref: 18
    phrase: shall be according to their number, after the manner
    kind: scripture
    title: “By number,” as it is written
    body: |
      “According to their number” ties the grain and drink offerings to the count of the animals: so much went with each bullock, each ram and each lamb. The flour is set at verses 14–15, and the oil and wine for a lamb, a ram and a bullock at [[Num. 15:4–10]]. The words return after the exile. When the Jews back from Babylon rebuilt the altar, before the foundation of the temple was laid, “They kept also the feast of tabernacles, as it is written, and offered the daily burnt offerings by number, according to the custom, as the duty of every day required” ([[Ezra 3:4]]).

      On one older reading, Ezra's “by number” means this chapter's list, “on the first day thirteen oxen, on the second twelve, etc.,” and uses the Hebrew words of this verse; on that reading the list was kept as written after the exile.
    sources: [keil-ezra, lds-scriptures]

  - ref: 35
    phrase: a solemn assembly
    kind: words
    title: The eighth day's assembly
    body: |
      The “solemn assembly” of the eighth day is in Hebrew simply an assembly, *ʿatsereth*, a “sacred assembly”; the same word names the last day of unleavened bread at [[Deut. 16:8]]. On one older reading the word “contains nothing which implies that the assembly was of a specially solemn character.” What sets the day apart is its offering. After Tabernacles' bullocks, the eighth day returns to the small set of the first and tenth days, one bullock, one ram and seven lambs (verse 36), and on another older reading that likeness marks it as “a closing feast,” which “only belonged to the feast of Tabernacles so far as the Sabbath rest and a holy meeting” were carried over to it. How the eighth day closed the festival season, and John's “last day, that great day of the feast” ([[John 7:37]]), are at [[Lev. 23:36]].
    sources: [bdb, cambridge-numbers, keil-numbers]

christ: |
  The LORD who appointed these days is Jehovah, the premortal Christ (see [[Ex. 3:14]]). The sin offering of atonement on the tenth day (verse 11) is the ceremony of [[Lev. 16]], on which Hebrews builds its account of Him: the high priest went in “once every year, not without blood” ([[Heb. 9:7]]), but Christ, “by his own blood he entered in once into the holy place, having obtained eternal redemption for us” ([[Heb. 9:12]]). Speaking from heaven after His death, Christ ended the burnt offerings Himself: “ye shall offer up unto me no more the shedding of blood” ([[3 Ne. 9:19]]).

  The atonement this chapter set on one day of the year, Christ made once: “now once in the end of the world hath he appeared to put away sin by the sacrifice of himself” ([[Heb. 9:26]]). A disciple's sins do not wait for another tenth day of the seventh month; the redemption He obtained is “eternal” ([[Heb. 9:12]]), and what He asks in place of the altar's offerings is the broken heart and contrite spirit He named when He ended them ([[3 Ne. 9:20]]; see [[Num. 28]]).

explore: |
  - **The days of the seventh month in the law.** [[Lev. 16:29–34]]; [[Lev. 23:23–43]]; [[Deut. 16:13–15]].
  - **The feast kept again.** [[Ezra 3:1–6]]; [[Neh. 8:13–18]].
  - **King Benjamin's gathering.** [[Mosiah 2:1–9]].
  - **One sacrifice for all.** [[Heb. 9:6–14]]; [[Heb. 10:1–14]].

parallels:
