chapter: 21
title: Look upon It, and Live
tagline: Bitten in the wilderness, Israel is healed by looking at a serpent of brass on a pole; then the road turns north, the old songs are sung, and the first kings fall.
when: 'In the fortieth year after the Exodus, on the way from mount Hor to the plains of Moab'

setting: |
  Numbers 21 is the last stretch of the long march. Aaron has just died on mount Hor, in the fortieth year after the Exodus ([[Num. 20:28]]; [[Num. 33:38]]), and Edom has refused Israel passage ([[Num. 20:14–21]]), so the people must go the long way around Edom's land. The chapter closes the part of the book that runs from Sinai through the refusal at Kadesh and the years of wandering (chapters 10–21); chapter 22 opens on the plains of Moab. Read another way, the chapter is already on the road to those plains: Aaron's death, the serpents, and the victories over Sihon and Og are the events of that last journey.

  The chapter holds three kinds of writing: two short stories (Arad and the serpents), a list of camps, and three of the “fragments of ancient poetry” for which Numbers is “remarkable.” Later scripture returns to it often. Jesus took the serpent on the pole as a figure of Himself ([[John 3:14–15]]); the Book of Mormon mentions the story six times, and each time likens it to Christ. Moses retells the wars with Sihon and Og at length ([[Deut. 2:24–3:11]]), and the psalms sing them ([[Ps. 135:11]]).

thread: |
  Numbers 21 is **a chapter of appeals the LORD answers.** At Arad Israel is attacked and some are taken prisoner; Israel vows a vow, and “the LORD hearkened to the voice of Israel” (verses 1–3). On the road around Edom the people speak against God and Moses in words they had used before, “Wherefore have ye brought us up out of Egypt to die in the wilderness?” (verse 5; compare [[Num. 14:2–3]]; [[Num. 20:4–5]]). The serpents come; the people say “We have sinned,” Moses prays, and the LORD answers with a remedy to look upon (verses 6–9). At Beer the LORD offers water, and this time the people answer with a song (verses 16–18). Then the kings fall: Sihon, who would not let Israel pass, and Og, of whom the LORD says “Fear him not” (verses 21–35).

  In the book's larger story the wilderness generation has been dying since the refusal at Kadesh ([[Num. 14:29–35]]), and after this chapter's complaint comes victory. On one reading the chapter's three battles, the first fought under a vow to “utterly destroy,” taught Israel “by experience” what the commands of Deuteronomy would mean before those commands were given. And they set up what comes next: the fall of Sihon and Og gave Balak of Moab “ample reason for concern,” and he sent for Balaam (chapter 22). Moses' own telling of the two wars, which adds the LORD's command to fight Sihon and the utter destruction of the cities, things Numbers does not mention, is at [[Deut. 2:24]] and [[Deut. 3:1]].

sections:
  - range: 1-3
    heading: Arad and Hormah
    plain: |
      When the Canaanite king of Arad, who lived in the Negev, heard that Israel was coming by the way of the spies, he attacked Israel and took some of them captive. Then Israel made a vow to the LORD: If you will truly give this people into my hand, I will utterly destroy their cities. The LORD listened to Israel and gave up the Canaanites, and they utterly destroyed them and their cities. So the place was named Hormah.
  - range: 4-9
    heading: The serpent of brass
    plain: |
      They set out from Mount Hor by the road toward the Red Sea, to go around the land of Edom, and the people grew deeply discouraged on the way. They spoke against God and against Moses: Why have you brought us up out of Egypt to die in the wilderness? There is no bread and no water, and we loathe this worthless bread. Then the LORD sent fiery serpents among the people; they bit the people, and many in Israel died. The people came to Moses and said: We have sinned, for we have spoken against the LORD and against you. Pray to the LORD to take the serpents away from us. And Moses prayed for the people. The LORD said to Moses: Make a fiery serpent and set it on a pole, and everyone who is bitten and looks at it shall live. So Moses made a serpent of brass and put it on a pole, and whenever a serpent bit anyone, that person looked at the serpent of brass and lived.
  - range: 10-20
    heading: The road north and the old songs
    plain: |
      The Israelites set out and camped at Oboth. From Oboth they went on and camped at Ije-abarim, in the wilderness facing Moab, toward the sunrise. From there they moved on and camped in the valley of Zared. From there they moved on and camped on the far side of the Arnon, in the wilderness that reaches out from the Amorites' territory, for the Arnon is Moab's border, between Moab and the Amorites. That is why the book of the wars of the LORD speaks of what He did at the Red Sea and in the valleys of the Arnon, and the stream of the valleys that runs down to the settlement of Ar and lies along the border of Moab. From there they went to Beer, the well where the LORD told Moses, Gather the people, and I will give them water. Then Israel sang this song: Spring up, O well! Sing to it! The well the princes dug, that the nobles of the people dug, at the lawgiver's direction, with their staffs. From the wilderness they went to Mattanah, from Mattanah to Nahaliel, from Nahaliel to Bamoth, and from Bamoth to the valley in the country of Moab, to the top of Pisgah, which looks toward Jeshimon.
  - range: 21-32
    heading: Sihon king of the Amorites
    plain: |
      Israel sent messengers to Sihon king of the Amorites: Let me pass through your land. We will not turn into the fields or the vineyards or drink the water of the wells; we will keep to the King's Highway until we are past your borders. But Sihon would not let Israel pass through his territory. He gathered all his people and came out against Israel into the wilderness; he came to Jahaz and fought Israel. Israel struck him with the sword and took his land from the Arnon to the Jabbok, as far as the Ammonites, for the Ammonites' border was strongly held. Israel took all these cities and settled in all the cities of the Amorites, in Heshbon and all its villages. For Heshbon was the city of Sihon king of the Amorites, who had fought the former king of Moab and taken all his land from him as far as the Arnon. That is why the makers of sayings say: Come to Heshbon; let the city of Sihon be built and established. For fire went out from Heshbon, a flame from the city of Sihon; it consumed Ar of Moab and the lords of the heights of the Arnon. Woe to you, Moab! You are undone, people of Chemosh! He has given his sons who escaped, and his daughters, into captivity to Sihon king of the Amorites. We shot at them; Heshbon has perished as far as Dibon, and we laid them waste as far as Nophah, which reaches to Medeba. So Israel settled in the land of the Amorites. Moses sent men to scout out Jaazer, and they took its villages and drove out the Amorites who were there.
  - range: 33-35
    heading: Og king of Bashan
    plain: |
      Then they turned and went up by the road to Bashan, and Og king of Bashan came out against them with all his people, to battle at Edrei. The LORD said to Moses: Do not fear him, for I have given him into your hand, with all his people and his land. Do to him as you did to Sihon king of the Amorites, who lived at Heshbon. So they struck him down, with his sons and all his people, until none was left alive, and they took possession of his land.

notes:
  - ref: 3
    phrase: he called the name of the place Hormah
    kind: history
    title: Hormah, the place of the ban
    body: |
      The verse names the place for the vow Israel kept there. Israel had promised, if the LORD gave victory over Arad, “I will utterly destroy their cities” (verse 2), and “utterly destroy” translates *heḥĕrîm*, the verb of the *ḥērem*, the devoting of a people to the LORD by destruction. What the *ḥērem* was, and how the Church reads the command to carry it out, is explained at [[Deut. 7:2]]. One older reading glosses the name as “banning, ban-place,” and takes “the place” to be the battlefield itself.

      A reader will notice that the name has been used already. The generation that went up against the LORD's word after Kadesh was beaten back “even unto Hormah” ([[Num. 14:45]]; [[Deut. 1:44]]). And Judges tells of Judah and Simeon destroying the Canaanite town of Zephath, after which “the name of the city was called Hormah” ([[Judg. 1:17]]). The same older reading suggests that Zephath may be called Hormah by anticipation in Joshua ([[Josh. 12:14]]; [[Josh. 19:4]]), or that the name was given more than once and held only after the town was taken for good after Joshua's death. The text does not say how the three passages fit together.
    sources: [calabro-herem, keil-numbers, lds-scriptures]

  - ref: 5
    phrase: our soul loatheth this light bread
    kind: words
    title: “This light bread”
    body: |
      “Light bread” is not airy bread but contemptible bread. The Hebrew adjective, *qĕlōqēl*, means “contemptible, worthless,” and a modern translation has “this miserable food.” The people say “there is no bread” and, in the same breath, that they loathe the bread they have. At Kibroth-hattaavah they had complained of the manna in much the same way: “there is nothing at all, beside this manna, before our eyes” ([[Num. 11:6]]; what the manna was is at [[Num. 11:7]]).
    sources: [bdb, nrsvue, lds-scriptures]

  - ref: 6
    phrase: the LORD sent fiery serpents among the people
    kind: words
    title: Fiery serpents
    body: |
      The “fiery serpents” are *seraphim*, from the verb *saraph*, “to burn”: most likely the burning pain of a venomous bite, though the word could also describe the snakes' gleaming scales. *Seraphim* is also the word for the six-winged beings of Isaiah's vision; that link, and the flying serpents Nephi adds when he retells the story ([[1 Ne. 17:41]]), are explained at [[Isa. 6:2]] and [[Isa. 14:29]]. Moses later reminds Israel of “that great and terrible wilderness, wherein were fiery serpents” ([[Deut. 8:15]]).

      Why so heavy a punishment for a complaint about food? One Latter-day Saint study answers that the murmurings were not merely “muttered complaints” but could be seen as “mocking God's plan,” or even “open rebellion” against God and His prophet: the people “spake against God, and against Moses” (verse 5). Another reading sees the serpents as the LORD's agents, “sent by Him to afflict Israel and bring them to repentance,” and takes the Hebrew of *sent* to mean that He let loose a danger He had been holding back.
    sources: [pierce-brazen-serpent, sc-knowhy-646, rappleye-serpents]

  - ref: 8
    phrase: Make thee a fiery serpent
    kind: symbol
    title: Why an image of the thing that bit them
    body: |
      The serpent carried two meanings for Israel and its neighbors, and that helps explain why the LORD heals with the likeness of the creature that was killing them. In the Bible it stands for “the Savior, mercy, salvation, and life” and also for “the adversary, justice, punishment, and death,” and in the ancient Near East serpents were pictured as gods who acted “as protectors and healers but also as arbiters and rebukers.” Both sides meet in this story. Serpents sent because of the people's unfaithfulness bring death; a serpent made at the LORD's command, after they repent, brings life.
      The Book of Mormon keeps both sides when it reads the story of Christ. Alma, comparing Christ to the serpent ([[Alma 33:19–21]]), goes on to the judgment, “that all men shall stand before him, to be judged at the last and judgment day, according to their works” ([[Alma 33:22]]). Read this way, the symbol fits the One it points to, who stands for “justice and mercy, chastisement and forgiveness, judgment and grace.”
    sources: [pierce-brazen-serpent, rappleye-serpents, lds-scriptures]

  - ref: 8
    phrase: set it upon a pole
    kind: christ
    title: Lifted up on a standard
    body: |
      The “pole” is a *nēs*, elsewhere a “standard, ensign, signal, sign”; here it is a “standard, as pole, supporting serpent of bronze.” The Hebrew of Numbers 21 does not use the verb “lift up,” but Jesus and the Book of Mormon prophets do. Jesus told Nicodemus, “As Moses lifted up the serpent in the wilderness, even so must the Son of man be lifted up” ([[John 3:14]]). The Book of Mormon prophets, who always liken the story to Christ, speak of “the serpent which he did raise up before them” ([[2 Ne. 25:20]]) and of “a type” that “was raised up in the wilderness” ([[Alma 33:19]]).

      One Latter-day Saint study suggests why Nephi used that language: he may have understood the ensign Isaiah sees raised to the nations ([[Isa. 11:10–12]]; [[2 Ne. 21:10–12]]) as serpent-like and joined it to the serpent on the pole, which would explain why he speaks of a serpent raised up though the verb is not in Numbers. Nephi had seen the Lamb of God “lifted up upon the cross and slain for the sins of the world” ([[1 Ne. 11:33]]). Nephi the son of Helaman joined the two lifts outright: “as he lifted up the brazen serpent in the wilderness, even so shall he be lifted up who should come” ([[Hel. 8:14]]).
    sources: [bdb, rappleye-serpents, pierce-brazen-serpent, lds-scriptures]

  - ref: 9
    phrase: Moses made a serpent of brass
    kind: history
    title: What became of the brass serpent
    body: |
      The serpent Moses made outlasted the wilderness by centuries, until it became an idol and was destroyed. The LORD had said “a fiery serpent,” a *saraph*; Moses made a *nĕḥaš nĕḥōšet*, a “serpent of brass” (the metal is copper or bronze), whose “fiery” look was likely the shine of the bronze. Israel kept it, on some scholars' view in the temple itself, until the reign of Hezekiah, who “brake in pieces the brasen serpent that Moses had made: for unto those days the children of Israel did burn incense to it: and he called it Nehushtan” ([[2 Kgs. 18:4]]). *Nehushtan* is probably not a proper name but a dismissal: just “a piece of bronze/copper,” unworthy of worship.

      What had been made to center Israel's faith in the promises of God had become, in the intervening centuries, “as much a graven image as the other idols.” One Latter-day Saint reading puts the difference in how it was seen: the bitten Israelites lived by looking through the serpent, not to it: “It was not the brazen serpent as object but as symbol that allowed the stricken Israelites to look and live.” In Hezekiah's day the same object had shifted from a sign of the LORD's healing power for the faithful to “an object of unfaithful idol worship that needed to be destroyed.”
    sources: [pierce-brazen-serpent, rappleye-serpents, halverson-swine, lds-scriptures]

  - ref: 14
    phrase: the book of the wars of the LORD
    kind: history
    title: A lost book of songs
    body: |
      The book of the wars of the LORD is one of the books the Bible names but no longer contains. It heads the list of the Bible's “lost books,” documents mentioned in a way that shows “they were considered authentic and valuable but that are not found in the Bible today.” Numbers quotes a fragment of it to mark the Arnon as Moab's border (verses 13–15). It is the first of three old poems in this chapter, with the song of the well (verses 17–18) and the song of Heshbon (verses 27–30), all three among the book's “fragments of ancient poetry.” One older reading takes the book to be “a collection of odes of the time of Moses himself, in celebration of the glorious acts of the Lord.”

      The lines quoted are hard to translate. The King James reads “What he did in the Red sea,” and the Hebrew behind “Red sea” is the word for the “Reed Sea” of verse 4; a modern translation instead reads “Waheb in Suphah.” The same older reading takes *Waheb* as an Amorite fortress and the word the King James renders “Red sea” as “in storm,” and notes that the fragment “has neither subject nor verb”: its first hearers knew the rest of the song. Which reading is right is not settled.
    sources: [bd-lost-books, bd-numbers, keil-numbers, nrsvue, lds-scriptures]

  - ref: 17
    phrase: Spring up, O well; sing ye unto it
    kind: history
    title: The song of the well
    body: |
      At Beer, whose name means “a well,” water comes at the LORD's word, “Gather the people together, and I will give them water” (verse 16), and Israel answers with a song. One older reading notes that this time God gave the water “not as before by a miraculous supply from a rock” (as at [[Num. 20:11]]), “but by commanding wells to be dug.” The song names the diggers: princes and nobles, “by the direction of the lawgiver, with their staves.” The Hebrew word behind “lawgiver” is the ruler's staff of [[Gen. 49:10]], and a modern translation reads the line “with the scepter, with the staff.”
    sources: [keil-numbers, nrsvue]

  - ref: 27
    phrase: they that speak in proverbs say
    kind: history
    title: The song of Heshbon
    body: |
      The song in verses 27–30 is quoted for the history in verse 26: it remembers how Sihon had taken this land from Moab. A modern translation calls “they that speak in proverbs” “the singers.” Verse 26 gives the background: Sihon “had fought against the former king of Moab, and taken all his land out of his hand.” The song is introduced by that verse (“Wherefore”), and it sings the earlier war: fire went out of Heshbon and “consumed Ar of Moab” (verse 28), and Moab's sons and daughters went into captivity “unto Sihon king of the Amorites” (verse 29).

      So the land Israel took north of the Arnon had once been Moab's but was Sihon's when Israel came (see [[Deut. 2:24]]). Jeremiah later takes up the same lines against Moab ([[Jer. 48:45]]).
    sources: [nrsvue, lds-scriptures]

christ: |
  The LORD who sent the serpents and gave the remedy is Jehovah, the premortal Christ (see [[Ex. 3:14]]), and Paul names Him in this very story: “Neither let us tempt Christ, as some of them also tempted, and were destroyed of serpents” ([[1 Cor. 10:9]]). Jesus made the serpent on the pole a figure of His own lifting up, “that whosoever believeth in him should not perish, but have eternal life” ([[John 3:15]]).

  The healing still comes the same way. As many as “look upon the Son of God with faith, having a contrite spirit, might live, even unto that life which is eternal” ([[Hel. 8:15]]), and the way is as easy now as it was then: “The way is prepared, and if we will look we may live forever” ([[Alma 37:46]]).

explore: |
  - **The serpent in the Book of Mormon.** [[1 Ne. 17:41]]; [[2 Ne. 25:20]]; [[Alma 33:18–22]]; [[Hel. 8:13–15]].
  - **The same pattern in the Liahona.** [[Alma 37:38–46]], where Alma joins the words of Christ, the Liahona and the brazen serpent: “if they would look they might live.”
  - **Moses' retelling of the wars.** [[Deut. 2:24–3:11]], with the LORD's command to fight Sihon and the utter destruction of the cities, which Numbers does not mention.
  - **Jephthah's argument from Sihon's land.** [[Judg. 11:12–28]].

parallels:
  - ref: Deut. 2:24–37
    note: Moses retells the war with Sihon, with the LORD's command to fight and the utter destruction of the cities.
  - ref: Deut. 3:1–11
    note: Moses retells the war with Og, and adds Og's iron bedstead.
  - ref: Deut. 8:15
    note: The wilderness “wherein were fiery serpents” remembered.
  - ref: John 3:14–15
    note: Jesus compares His being lifted up to the serpent Moses lifted up.
  - ref: Jer. 48:45–46
    note: The song of Heshbon (verses 28–29) turned against Moab.
  - ref: Ps. 135:10–12
    note: Sihon and Og among the kings the LORD smote before He gave Israel the land.

