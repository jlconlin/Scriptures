chapter: 33
title: Their Goings Out
tagline: 'On the plains of Moab, Moses writes down every place Israel set out from, from Rameses in Egypt to the Jordan; then the LORD tells them what to do when they cross, and what will happen if they do not.'
when: 'On the plains of Moab by Jordan near Jericho, in the fortieth year after the Exodus ([[Num. 33:38]]; [[Num. 33:50]])'

setting: |
  Numbers 33 looks back over the whole road. Israel is camped on the plains of Moab, and the land east of the Jordan has just been given to Reuben, Gad and half of Manasseh ([[Num. 32:33]]), so here, in one older reading, “the history of the desert wandering closes with a list of the stations which they had left behind them.” The list is credited to Moses, who wrote it “by the commandment of the LORD” ([[Num. 33:2]]).

  The list falls into three parts. Verses 5–15 run from Rameses to the wilderness of Sinai, the road told in [[Ex. 12:37]] to [[Ex. 19:2]]. Verses 16–36 run from Sinai to Kadesh, by way of Ezion-gaber on the gulf, and are “probably a summary of the forty years’ wanderings”; Kadesh was “the second geographic area, after Mount Sinai, in which the Israelites spent considerable time.” Verses 37–49 are the last march, “after the forty years were expired,” from Kadesh to the plains of Moab, the road of [[Num. 20:22–22:1]]. The chapter then turns from the road behind to the land ahead (verses 50–56), and the next chapter draws its borders ([[Num. 34:2]]).

thread: |
  Numbers 33 is **a record of the LORD's leading, written so that it would be remembered.** Moses wrote it at the LORD's command, and one older reading takes the list as “a permanent memorial for after ages,” since every station left behind “was a memorial of the grace and faithfulness with which the Lord led His people.” The list is kept by departures, not arrivals: line after line, “they removed,” “they departed” (see the note at verse 2). Most of the places can no longer be located (see the note at verse 18). Two lines stop the march: the night of the Exodus, when the LORD struck Egypt's firstborn and judged its gods (verses 3–4; see [[Ex. 12:12]]), and Aaron's death on mount Hor in the fortieth year (verses 38–39).

  The last verses turn the record into a charge. The God who brought Israel through the wilderness gives them the land, and tells them to drive out its peoples and pull down their places of worship (verses 52–53). If they do not, the peoples left will be “pricks in your eyes, and thorns in your sides,” and the LORD will do to Israel what He meant to do to those nations (verses 55–56): in the same older reading, “drive them out of the land and destroy them.” The road that ends at the Jordan comes with a warning: the people sent to drive out the nations can themselves be driven out.

sections:
  - range: 1-4
    heading: Written by commandment
    plain: |
      These are the stages of the journey of the Israelites when they came out of Egypt by their companies, led by Moses and Aaron. At the LORD's command Moses recorded the places they set out from, stage by stage; and these are their stages, by their starting points.

      They set out from Rameses on the fifteenth day of the first month, the day after the Passover. The Israelites went out boldly, in full view of all the Egyptians, while the Egyptians were burying their firstborn, whom the LORD had struck down among them. On their gods, too, the LORD carried out judgments.
  - range: 5-15
    heading: From Rameses to Sinai
    plain: |
      The Israelites set out from Rameses and camped at Succoth. They set out from Succoth and camped at Etham, at the edge of the wilderness. They set out from Etham, turned back to Pi-hahiroth, which faces Baal-zephon, and camped near Migdol. They set out from Pi-hahiroth, passed through the middle of the sea into the wilderness, went three days into the wilderness of Etham, and camped at Marah. They set out from Marah and came to Elim, where there were twelve springs and seventy palm trees, and camped there. From Elim they camped by the Red Sea; from the Red Sea, in the wilderness of Sin; then at Dophkah, at Alush, and at Rephidim, where there was no water for the people to drink. From Rephidim they camped in the wilderness of Sinai.
  - range: 16-36
    heading: From Sinai to Kadesh
    plain: |
      They set out from the wilderness of Sinai and camped at Kibroth-hattaavah, then at Hazeroth, Rithmah, Rimmon-parez, Libnah, Rissah, Kehelathah, Mount Shapher, Haradah, Makheloth, Tahath, Tarah, Mithcah, Hashmonah, Moseroth, Bene-jaakan, Hor-hagidgad, Jotbathah, Ebronah and Ezion-gaber, each in turn. From Ezion-gaber they camped in the wilderness of Zin, that is, Kadesh.
  - range: 37-49
    heading: From Kadesh to the Jordan
    plain: |
      They set out from Kadesh and camped at Mount Hor, on the border of Edom. At the LORD's command Aaron the priest went up Mount Hor and died there, on the first day of the fifth month of the fortieth year after the Israelites came out of Egypt. Aaron was 123 years old when he died on Mount Hor. The Canaanite king of Arad, who lived in the Negev in the land of Canaan, heard that the Israelites were coming.

      They set out from Mount Hor and camped at Zalmonah, then at Punon, at Oboth, and at Ije-abarim on the border of Moab. From Iim they camped at Dibon-gad, then at Almon-diblathaim, then in the mountains of Abarim, facing Nebo, and then on the plains of Moab by the Jordan across from Jericho. There they camped along the Jordan from Beth-jesimoth as far as Abel-shittim on the plains of Moab.
  - range: 50-56
    heading: When ye are passed over Jordan
    plain: |
      On the plains of Moab by the Jordan across from Jericho, the LORD said to Moses: Tell the Israelites, When you cross the Jordan into the land of Canaan, drive out all the people living there. Destroy all their carved figures and their cast idols, and tear down all their places of worship. Take possession of the land and live in it, for I have given you the land to possess. Divide it by lot as an inheritance among your families: a larger inheritance to a larger group and a smaller one to a smaller group. Each one's inheritance is to be where its lot falls; you will inherit by the tribes of your fathers.

      But if you do not drive out the people of the land, those you allow to remain will become like splinters in your eyes and thorns in your sides. They will trouble you in the land where you live. And then I will do to you what I planned to do to them.

notes:
  - ref: 2
    phrase: Moses wrote their goings out
    kind: history
    title: A list of departures, written at the LORD’s command
    body: |
      The list was written by Moses at the LORD's command ([[Num. 33:2]]), and it is kept by where Israel set out from, not where it arrived. The word rendered “journeys,” *massaʿ*, “does not mean a station, but the breaking up of a camp, and then a train, or march”; so “the march of the people is not described by the stations, or places of encampment, but by the particular spots from which they set out,” and so one verb, “and they broke up,” returns again and again.

      The first part of the list agrees with the story told in Exodus, except that Exodus does not mention the camp by the Red Sea, Dophkah or Alush (verses 10, 13–14).
    sources: [keil-numbers]

  - ref: 18
    phrase: pitched in Rithmah
    kind: history
    title: The camps of the silent years
    body: |
      The names in the middle of the list, verses 16–36, are probably a summary of the long wandering, the thirty-eight years that Numbers otherwise passes over almost in silence. The book's stories go from Hazeroth ([[Num. 11:35]]) to the camp at Kadesh from which the spies were sent ([[Num. 13:26]]), and then nearly straight to the return to Kadesh in chapter 20. One older reading fills the gap from this list. It takes Rithmah, the next name after Hazeroth, to be that first camp at Kadesh: “it is as natural as it well can be to seek for this place of encampment … at Kadesh under the name of Rithmah.” The Kadesh of verse 36 is then “the second arrival in Kadesh after the expiration of the thirty-eight years,” and the seventeen names between are the camps of the years of punishment.

      The list does not count days' marches: Israel “did not ‘break camp’ every day,” and “there is uncertainty about the location of many of the sites listed in chapter 33.” In the same older reading, so few names for so many years show that Israel was “not constantly wandering about” but may have stayed at some places “not only for weeks and months, but even for years”; and of the names in this stretch, “not a single one is known, or can be pointed out with certainty, except Eziongeber,” the port at the head of the gulf near Elath, where Solomon would later build a fleet ([[1 Kgs. 9:26]]).
    sources: [keil-numbers, cambridge-numbers, pike-balaam]

  - ref: 30
    phrase: encamped at Moseroth
    kind: history
    title: The same four places in Deuteronomy
    body: |
      Moseroth, Bene-jaakan, Hor-hagidgad and Jotbathah return in Deuteronomy's short list of camps ([[Deut. 10:6–7]]), but there in another order, and Deuteronomy says that at Mosera “Aaron died.” The note at [[Deut. 10:6]] sets the two records side by side.

      One older reading holds that they are the same places under slightly different names: Bene-jaakan is short for Beeroth-bene-jaakan, “wells of the children of Jaakan”; Gudgodah is Hor-hagidgad; and “Moseroth is simply the plural form of Mosera.” Its answer to the different order is that “the two passages relate to different journeys.” Numbers lists the camps of the long wandering, while Deuteronomy's lines tell the march of the fortieth year, when Israel camped “at Mosera, where Aaron died upon Mount Hor, which was in the neighbourhood”; on this reading Israel “had encamped at the very same places once before.” The text itself does not say which journey Deuteronomy means.
    sources: [keil-numbers, lds-scriptures]

  - ref: 38
    phrase: in the fortieth year after the children of Israel were come out of the land of Egypt
    kind: history
    title: The one death the list dates
    body: |
      Aaron's death is the only event in the list given a full date apart from the Exodus itself: the first day of the fifth month of the fortieth year ([[Num. 33:38]]), set against the fifteenth day of the first month on which Israel left Rameses ([[Num. 33:3]]). It also supplies a year that chapter 20 leaves out: that chapter opens “in the first month” of a year it does not name ([[Num. 20:1]]), and the death of Aaron on mount Hor at its close falls, by this verse, in the fortieth year.

      The age in verse 39 is forty years more than Aaron's age when he and Moses stood before Pharaoh ([[Ex. 7:7]]): “Aaron's age is calculated by adding forty years to his age at the Exodus.” The giving of his garments to Eleazar and his death on the mountain are told at [[Num. 20:26]].
    sources: [lds-scriptures, cambridge-numbers]

  - ref: 40
    phrase: And king Arad the Canaanite
    kind: history
    title: Arad in the middle of the list
    body: |
      Verse 40 breaks into the list with half a story: the king of Arad heard that Israel was coming, and the verse says no more. The rest of the story is in [[Num. 21:1–3]], where the same report leads to an attack, a vow, and the victory at Hormah; there, as here, it comes right after Aaron's death on mount Hor ([[Num. 20:28–29]]). One older reading calls the verse “a fragmentary statement strangely inserted, perhaps originally as a marginal note by a scribe.” The text gives no reason for it.
    sources: [cambridge-numbers, lds-scriptures]

  - ref: 52
    phrase: destroy all their pictures
    kind: words
    title: Images and high places
    body: |
      The “pictures” are not paintings but the carved figures of Canaanite worship. The word seems to mean “something to be looked at,” and it “denotes the carved figures and symbols used in Canaanite idolatrous worship.” The “high places” were sanctuaries. The word came to be used “for any sanctuaries, even in valleys and by the gates of cities,” and here it “cannot refer to hills, for the Israelites are bidden to ‘demolish them.’”

      So the command of verse 52 is aimed at the worship of the land: the heathen altars found on the hills “were ordered to be destroyed” here and in [[Deut. 12:2–3]]. What followed is a long story: “altars to Jehovah were built at several high places,” and “when idolatry came in, many of these altars were desecrated and used for heathen worship,” until reformers like Hezekiah and Josiah tried “to centralize the worship more and more in Jerusalem.” Why the peoples themselves were to be driven out is the subject of the note at [[Deut. 7:2]].
    sources: [cambridge-numbers, bd-high-places]

  - ref: 56
    phrase: I shall do unto you, as I thought to do unto them
    kind: scripture
    title: The same judgment for Israel
    body: |
      The chapter ends by putting Israel under the judgment it is about to carry out. If the peoples of the land were allowed to stay, they would be “pricks in your eyes, and thorns in your sides” ([[Num. 33:55]]), which one older reading explains as “the most painful injuries” and war in the land. Then the LORD would do to Israel what He meant to do to the Canaanites, “i.e., drive them out of the land and destroy them.” Joshua repeats the warning in his last address to the people ([[Josh. 23:13]]), and the angel at Bochim may echo its words ([[Judg. 2:3]]).
    sources: [keil-numbers, cambridge-numbers]

christ: |
  The LORD who led Israel from camp to camp is Jehovah, the premortal Christ (see [[Ex. 3:14]]). Nephi, retelling the same journey, names Him: they were led by “the Lord their God, their Redeemer, going before them, leading them by day and giving light unto them by night” ([[1 Ne. 17:30]]), and “according to his word he did lead them” ([[1 Ne. 17:31]]).

  Moses told the people at the end of this road, “thou shalt remember all the way which the LORD thy God led thee these forty years in the wilderness, to humble thee, and to prove thee” ([[Deut. 8:2]]). Those years “became a part of them.” Hard years shape whoever lives through them, and “through the Atonement of Jesus Christ, these experiences can become redemptive rather than limiting.”

explore: |
  - **The first stage told at length.** [[Ex. 12:37]] to [[Ex. 19:2]].
  - **The last march.** [[Num. 20:22–29]]; [[Num. 21:4–20]]; [[Num. 22:1]].
  - **The other record of the camps.** [[Deut. 10:6–7]].
  - **Remembering the way.** [[Deut. 8:2–4]]; [[1 Ne. 17:23–35]].
  - **The warning carried forward.** [[Josh. 23:12–13]]; [[Judg. 2:1–3]].

parallels:
