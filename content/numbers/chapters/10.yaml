chapter: 10
title: The Camp Sets Out
tagline: Two silver trumpets are made to call the people and to move the camps. Then the cloud lifts from the tabernacle, the tribes march out of Sinai in their order, Moses asks Hobab to be Israel's eyes, and the ark goes ahead to find a resting place.
when: 'At Sinai, in the second year after the Exodus; the camp sets out on the twentieth day of the second month ([[Num. 10:11]]).'

setting: |
  Numbers 10 is the hinge between the book's first two parts. Its first ten verses close the “preparation for departure from Sinai” (1:1–10:10), and verse 11 begins the “march from Sinai to borders of Canaan.” Israel had come into the wilderness of Sinai in the third month after leaving Egypt ([[Ex. 19:1]]), and there the LORD revealed His law, made His covenant with the people, and had the tabernacle built. Numbers 1–10 tells the camp's final weeks at the mountain: the fighting men counted, the tabernacle dedicated, the Passover kept a year after the first. Then, “not quite a year after arriving,” the cloud lifted (verse 11).

  The chapter has two parts. Verses 1–10 are the last instructions given at Sinai, for two silver trumpets. Verses 11–36 are the first march, in the order laid down in chapter 2. It ends with Moses' words when the ark set out and when it rested (verses 35–36), one of the “fragments of ancient poetry” for which Numbers is “remarkable.” Moses later recalls the command to leave: “Ye have dwelt long enough in this mount” ([[Deut. 1:6]]).

thread: |
  Numbers 10 is **a chapter of setting out, and it puts the LORD's leading and the camp's own means side by side.** The cloud decides when Israel moves (verse 11; see [[Num. 9:17–23]]), and the people go “according to the commandment of the LORD by the hand of Moses” (verse 13). Yet the LORD also gives Moses trumpets. In one older reading, though God “appointed the time for removal and encampment by the movement of the cloud of His presence, signals were also requisite for ordering and conducting the march of so numerous a body.” The ark goes ahead “to search out a resting place” (verse 33), and still Moses asks Hobab to come, “forasmuch as thou knowest how we are to encamp in the wilderness” (verse 31).

  The chapter ends with Moses speaking to the LORD Himself, at each setting out and each resting (verses 35–36). The march begun here runs through the complaints of chapters 11 and 12 to the spies, “the refusal to enter Canaan, and God's punishment for disobedience” at Kadesh (chapters 13–14).

sections:
  - range: 1-10
    heading: Two silver trumpets
    plain: |
      The LORD said to Moses: Make two trumpets of silver, of hammered work, to call the assembly together and to set the camps moving. When both are blown, the whole assembly shall gather to you at the door of the tabernacle of the congregation. If only one is blown, the leaders, the heads of Israel's thousands, shall gather to you. When you sound the alarm, the camps on the east side shall set out; when you sound the alarm a second time, the camps on the south side shall set out. The alarm is the signal to march. But to gather the assembly, blow the trumpets without sounding the alarm.

      The priests, Aaron's sons, shall blow the trumpets; this is a law for you for all generations. When you go to war in your own land against an enemy who oppresses you, sound the alarm on the trumpets, and you will be remembered before the LORD your God and saved from your enemies. On your days of rejoicing, at your appointed feasts, and at the beginning of each month, blow the trumpets over your burnt offerings and your peace offerings, and they will be a memorial for you before your God. I am the LORD your God.
  - range: 11-13
    heading: The cloud lifts
    plain: |
      On the twentieth day of the second month, in the second year, the cloud rose from the tabernacle of the testimony. The Israelites set out from the wilderness of Sinai, stage by stage, and the cloud came to rest in the wilderness of Paran. This was their first setting out at the LORD's command given through Moses.
  - range: 14-28
    heading: The order of march
    plain: |
      The standard of the camp of Judah went first, company by company, with Nahshon son of Amminadab over Judah's host, Nethaneel son of Zuar over Issachar's, and Eliab son of Helon over Zebulun's. Then the tabernacle was taken down, and the sons of Gershon and of Merari set out carrying it.

      Next went the standard of the camp of Reuben, with Elizur son of Shedeur over Reuben's host, Shelumiel son of Zurishaddai over Simeon's, and Eliasaph son of Deuel over Gad's. Then the Kohathites set out carrying the holy things, and the tabernacle was set up before they arrived.

      Next went the standard of the camp of Ephraim, with Elishama son of Ammihud over Ephraim's host, Gamaliel son of Pedahzur over Manasseh's, and Abidan son of Gideoni over Benjamin's. Last came the standard of the camp of Dan, the rear guard of all the camps, with Ahiezer son of Ammishaddai over Dan's host, Pagiel son of Ocran over Asher's, and Ahira son of Enan over Naphtali's. This was the order in which the Israelites marched, company by company, when they set out.
  - range: 29-32
    heading: Moses asks Hobab to come
    plain: |
      Moses said to Hobab, the son of Raguel the Midianite, Moses' father-in-law: We are setting out for the place the LORD said He would give us. Come with us and we will treat you well, for the LORD has promised good things to Israel. Hobab answered: I will not go; I will go back to my own land and my own kin. Moses said: Please do not leave us. You know where we should camp in the wilderness, and you can be our eyes. If you come with us, whatever good the LORD does for us, we will do for you.
  - range: 33-36
    heading: The ark goes before them
    plain: |
      So they set out from the mountain of the LORD and went three days' journey, and the ark of the LORD's covenant went ahead of them those three days to find them a place to rest. The cloud of the LORD was over them by day when they set out from the camp.

      Whenever the ark set out, Moses said: Rise up, LORD! Let your enemies be scattered, and let those who hate you flee before you. And whenever it came to rest, he said: Return, LORD, to the many thousands of Israel.

notes:
  - ref: 2
    phrase: Make thee two trumpets of silver
    kind: history
    title: Silver trumpets, not rams’ horns
    body: |
      The trumpets of this chapter are not the ram's-horn *shofar* but metal instruments made for the priests. The Hebrew *ḥăṣōṣĕrâ* was “a long, straight, slender metal tube, with flaring end,” distinguished from the *shofar*, which “was originally a ram's horn” and was blown “by watchmen, warriors, etc., as well as priests.” As a sacred instrument the *ḥăṣōṣĕrâ* was “especially for use by priests,” and here only “the sons of Aaron, the priests” may blow it (verse 8).

      “Of a whole piece” means beaten out of a single piece of metal. The Hebrew is probably “hammered work,” a word used only of metals, and otherwise of the tabernacle's cherubim and lampstand ([[Ex. 25:18]]; [[Ex. 25:31]]).
    sources: [bdb]

  - ref: 7
    phrase: ye shall blow, but ye shall not sound an alarm
    kind: words
    title: 'Two calls: a blast and an alarm'
    body: |
      The trumpets gave two different signals, one to gather the people and one to move the camps; the King James calls them “blow” and “blow an alarm.” The plain blowing (*tāqaʿ*) called people together: both trumpets for the whole assembly at the door of the tabernacle, one for the princes alone (verses 3–4). The alarm, *tĕrûʿâ*, is the word for a “blast for march” and for an “alarm of war, war-cry.” It set the camps moving, east first and then south (verses 5–6), and it was the call in battle (verse 9).

      How the two sounded is less certain. On one account the gathering call was “a single long blast” and the alarm “a series of quick blasts”; one older reading has nearly the reverse, the plain blowing “in short, sharp tones” and the alarm “in a continued peal.”
    sources: [bdb, keil-numbers]

  - ref: 9
    phrase: ye shall be remembered before the LORD your God
    kind: symbol
    title: Remembered before the LORD
    body: |
      The trumpets did more than give orders: in war and at the feasts their sound was to bring Israel to the LORD's remembrance. Verse 9 promises that when the alarm is sounded against an oppressor, “ye shall be remembered before the LORD your God, and ye shall be saved”; verse 10 has the trumpets blown over the offerings at the feasts and new moons “for a memorial before your God.” One older reading takes the two as one purpose: “The blast of these trumpets was to call Israel to remembrance before Jehovah in time of war and on their feast-days.” For “a memorial” it points to the high priest's breastplate, which bore the names of the tribes “for a memorial before the LORD continually” ([[Ex. 28:29]]).

      The trumpets went to war with the priests when Israel fought Midian ([[Num. 31:6]]). The feast at the new moon of the seventh month, “a memorial of blowing of trumpets,” is explained at [[Lev. 23:24]].
    sources: [keil-numbers, bdb, lds-scriptures]

  - ref: 12
    phrase: the cloud rested in the wilderness of Paran
    kind: history
    title: Paran is the goal, not the first stop
    body: |
      Verse 12 gives the whole journey in a sentence; the wilderness of Paran was not where the camp first stopped. From Sinai Israel camped at Kibroth-hattaavah and then at Hazeroth ([[Num. 33:16–17]]), and only after Hazeroth did they pitch “in the wilderness of Paran” ([[Num. 12:16]]). One older reading takes verse 12 as a heading: “the whole journey from the desert of Sinai to the desert of Paran is given summarily,” with Paran, “in the neighbourhood of Kadesh, whence the spies were sent out to Canaan,” as the goal.

      The same reading explains why Moses' talk with Hobab comes after the camp has set out (verses 29–32): it “preceded the departure in order of time; but it is placed between the setting out and the march itself.”
    sources: [keil-numbers, lds-scriptures]

  - ref: 21
    phrase: the other did set up the tabernacle against they came
    kind: history
    title: The tent goes ahead of what it holds
    body: |
      The Levites marched in two parties, and the first had the tent standing before the second arrived with the holy things: “against they came” means “before they came.” Chapter 2 had put the tabernacle and the Levites “in the midst of the camp” ([[Num. 2:17]]), and this chapter is the only place where their order of march is given in detail. The Gershonites and Merarites, “bearing the tabernacle,” went out behind Judah's camp (verse 17); the Kohathites, “bearing the sanctuary,” the holy furnishings, went behind Reuben's (verse 21). In one older reading the first party could then “set up the dwelling … against their (the Kohathites') arrival, so that they might place the holy things at once within it.”
    sources: [keil-numbers, lds-scriptures]

  - ref: 29
    phrase: Hobab, the son of Raguel the Midianite
    kind: history
    title: Hobab, and whose father-in-law
    body: |
      The verse calls Hobab the son of Raguel, and its title “Moses' father in law” can belong to either man. Raguel is “an alternate spelling of Reuel,” the man also called Jethro, who gave Moses his daughter Zipporah (on his names and on the priesthood Moses received from him, see [[Ex. 2:18]]). The word for father-in-law, *ḥōtēn*, means “wife's father.” If the title belongs to Raguel, whose name it follows, Hobab is Moses' “brother-in-law.”

      Judges, though, names “Hobab the father in law of Moses” ([[Judg. 4:11]]), and Hobab can be taken as the *ḥōtēn* in this verse too. The text does not settle which man bore the title.
    sources: [ot-manual-numbers-1-12, bd-jethro, bdb, lds-scriptures]

  - ref: 31
    phrase: thou mayest be to us instead of eyes
    kind: history
    title: Eyes for the wilderness
    body: |
      Moses asked for a guide though the cloud led the way, and the verse gives his reason: Hobab knew “how we are to encamp in the wilderness.” The cloud and a guide did different work: “Although Jehovah gave general directions, Hobab knew the area and could help locate specific trails, campsites, etc.” One older reading says the same, the cloud “giving the sign for them to break up and to encamp” and “showing generally the direction they were to take,” while Hobab, “well acquainted with the desert,” could point out “the springs, oases, and plots of pasture which are often buried quite out of sight.”

      The chapter does not say whether Hobab went. His first answer is no (verse 30), and after Moses asks again the story moves on. Later scripture has his descendants in the land: “the children of the Kenite, Moses’ father in law, went up out of the city of palm trees with the children of Judah” ([[Judg. 1:16]]), and Heber the Kenite “was of the children of Hobab” ([[Judg. 4:11]]). From these, both of the readings above conclude that he came. The Kenites were “probably a Midianite tribe,” and Moses' marriage was “a cause of the long-standing friendship between the Kenites and Israelites.”
    sources: [keil-numbers, ot-manual-numbers-1-12, bd-kenites, lds-scriptures]

  - ref: 33
    phrase: the ark of the covenant of the LORD went before them
    kind: history
    title: The ark at the head of the march
    body: |
      Verse 33 puts the ark ahead of the camp “to search out a resting place,” though the order of march had the tabernacle and its holy things in the middle (see the note on verse 21), and the chapter does not say how the two fit. One older reading holds that the ark “was carried separately from the rest of the sacred things, in front of the whole army; so that the cloud which went before them floated above the ark, leading the procession.” It takes verses 33 and 34 as “one thought” in two clauses: the ark leads, and the cloud shelters those who march.

      The same reading identifies the resting place found after the three days' journey not as Taberah ([[Num. 11:3]]) but as Kibroth-hattaavah ([[Num. 11:34]]).
    sources: [keil-numbers, lds-scriptures]

  - ref: 35
    phrase: Rise up, LORD, and let thine enemies be scattered
    kind: symbol
    title: Moses’ words at the ark
    body: |
      Verses 35–36 are the words Moses said to the LORD each time the ark set out and each time it came to rest. They are one of the “fragments of ancient poetry” in Numbers, and one of the songs in the Old Testament outside the Psalms that “arguably predate the Temple of Solomon.”

      One older reading explains them from the ark itself. Moses “saw in the ark of the covenant, as the throne of Jehovah, a material pledge of the gracious presence of the Almighty God.” “Rise up” asks the LORD to go before the people and scatter their enemies; “Return” asks Him, “after having scattered Thine enemies, turn back again to Thy people to dwell among them.” Psalm 68 opens with the same words, said about God rather than to Him (see the note at [[Ps. 68:1]]).
    sources: [bd-numbers, sc-knowhy-251, keil-numbers, lds-scriptures]

christ: |
  The LORD who lifts the cloud, goes before the camp with the ark, and is asked to “Rise up” and “Return” is Jehovah, the premortal Christ (see [[Ex. 3:14]]). Moses later remembered Him as the One “Who went in the way before you, to search you out a place to pitch your tents in, in fire by night, to shew you by what way ye should go, and in a cloud by day” ([[Deut. 1:33]]).

  The Lord makes the same kind of promise to those He sends in this dispensation: “I will go before your face. I will be on your right hand and on your left, and my Spirit shall be in your hearts, and mine angels round about you, to bear you up” ([[D&C 84:88]]). His going before does not take away the trumpets, the order of march, or the need of a friend who knows the country; a disciple goes forward with both.

explore: |
  - **Leaving the mount, remembered.** [[Deut. 1:6–8]] and [[Deut. 1:33]].
  - **The first stops.** [[Num. 11:1–35]], [[Num. 12:16]] and [[Num. 33:16–18]].
  - **Moses' words in a psalm.** [[Ps. 68:1–8]].
  - **The priests' trumpets later.** [[Num. 31:6]], [[2 Chr. 13:12–14]], [[1 Chr. 15:24]] and [[2 Chr. 5:12]].
  - **Hobab's people.** [[Judg. 1:16]], [[Judg. 4:11]], [[1 Sam. 15:6]] and, for the Rechabites of the same tribe, [[1 Chr. 2:55]] and [[Jer. 35:1–19]].

