description: A phrase-by-phrase companion to the book of Numbers, grounded in the restored gospel of Jesus Christ.
divisionsBlurb: Thirty-six chapters in five parts. Israel is counted and ordered at Sinai, then sets out and refuses the land at Kadesh. Through the wilderness years the people rebel and are rescued, and the first generation dies. On the plains of Moab, Balaam blesses the camp he was hired to curse, and a new generation is counted and readied for the land.
home:
  blurb: Israel's forty years between Sinai and the Jordan. The people are counted twice, a generation that will not enter the land is replaced by its children, and the Lord leads them by the cloud. The book holds the priestly blessing, the brass serpent the Savior compared to Himself, and Balaam's star out of Jacob.

intro: |
  Numbers takes Israel from Sinai to the edge of the promised land. Its Hebrew name is “In the wilderness,” from its first verse, “the LORD spake unto Moses in the wilderness of Sinai” ([[Num. 1:1]]). Its English name comes from the two times the people are counted, at Sinai and again forty years later on the plains of Moab. Between the two counts a whole generation dies. At Kadesh the people believed the spies who said the land could not be taken, and the Lord said of them, “They shall surely die in the wilderness” ([[Num. 26:65]]). Only Caleb and Joshua, who said “the LORD is with us: fear them not” ([[Num. 14:9]]), were spared that sentence.

  The book is full of murmuring, and of the Lord's answers to it. Manna falls every morning, the cloud lifts and settles over the tabernacle, and Moses intercedes again and again. When the people are bitten by fiery serpents, Moses lifts up a serpent of brass, so “that every one that is bitten, when he looketh upon it, shall live” ([[Num. 21:8]]). The Savior used that serpent to describe His own lifting up ([[John 3:14–15]]), and Book of Mormon prophets used it to teach faith in Him ([[Alma 33:19–22]]; [[Hel. 8:14–15]]). Numbers also holds the blessing Aaron's sons were to speak over Israel ([[Num. 6:24–26]]), Moses' wish “that all the LORD’s people were prophets” ([[Num. 11:29]]), and Balaam's “Star out of Jacob” ([[Num. 24:17]]). This companion goes through all thirty-six chapters and tries to anticipate the questions a careful reader would ask, the hard ones included: how many came out of Egypt, why Moses was barred from the land, and what is to be made of Balaam.

  For the priests and the Levites, see [The Temple and Worship](/old-testament/guides/temple-and-worship/#priests); for the land the tribes were given on both sides of the Jordan, see [The Land](/old-testament/guides/the-land/#inheritance).

# The divisions follow the Bible Dictionary (“Numbers”: 1:1–10:10; 10:11–14:45; 15–19; 20–36) and
# Scripture Helps (1–10; 10–21; 22–36): Sinai; Kadesh; the wilderness years to Sihon and Og; and the plains of Moab,
# split at chapter 26, the second census, where the new generation begins.
# Keys must not repeat another book’s (the colors are global variables).
divisions:
  - key: numsinai
    range: [1, 10]
    name: Ordered at Sinai
    blurb: The men of war are counted, the tribes are set around the tabernacle, and the Levites are taken in place of the firstborn. The princes bring their offerings, the priests are given a blessing to speak over Israel, and the cloud lifts. In the second year after Egypt, Israel sets out.
    color: '#7a5230'
    darkColor: '#e3b48a'
  - key: numkadesh
    range: [11, 14]
    name: The Refusal at Kadesh
    blurb: The people complain of the manna, and seventy elders receive the spirit that was on Moses. Miriam and Aaron speak against him, and the Lord defends His servant. Twelve men search the land, ten bring an evil report, and the people refuse to go up. The Lord pardons them, but that generation will die in the wilderness.
    color: '#a3482e'
    darkColor: '#f0a487'
  - key: numyears
    range: [15, 21]
    name: The Wilderness Years
    blurb: Laws for the land to come, a rebellion against Moses and Aaron, and Aaron's rod that budded. The ashes of a red heifer cleanse those defiled by the dead. Miriam dies, Moses strikes the rock at Meribah and is told he will not enter the land, and Aaron dies on mount Hor. The brass serpent is lifted up, and Sihon and Og fall.
    color: '#5c6e2a'
    darkColor: '#c9d98c'
  - key: nummoab
    range: [22, 25]
    name: Balaam and Baal-peor
    blurb: The king of Moab hires Balaam to curse Israel, and the Lord turns each curse into a blessing, the last of them a star out of Jacob. Then, at Baal-peor, Israel joins itself to Moab's god, and Phinehas stays the plague.
    color: '#6e3f6e'
    darkColor: '#d4a6d4'
  - key: numnewgen
    range: [26, 36]
    name: The New Generation
    blurb: A second census finds none of the first generation left but Caleb and Joshua. The daughters of Zelophehad receive their father's inheritance, and Joshua is set before the congregation. Then come the offerings for the year, the law of vows, the war on Midian, the tribes east of Jordan, the journeys, the borders, and the cities of refuge.
    color: '#28627a'
    darkColor: '#86c8e0'

