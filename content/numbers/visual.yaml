summary: >-
  Numbers is Israel's forty years in the wilderness between Sinai and the Jordan, a
  people who murmur and refuse the land, yet are kept and led onward. Its central image is the
  serpent of brass that Moses lifted up on a pole, so that everyone bitten who looked
  at it lived. Jesus Christ took that lifted serpent as the figure of His own lifting
  up. The camp is ordered around the tabernacle, the LORD dwelling in the midst of His
  people, and the book looks ahead to the Star out of Jacob.
motifs:
  - "Primary: a single serpent of polished brass, coiled around the top of one tall, straight wooden pole on a low rise outside the camp, the one brightly lit thing in the picture (Num. 21:8–9)."
  - "Supporting: the camp of Israel on the plain below, the tabernacle and its white linen court at its center and low goat-hair tents in groups on every side, with colored banners above them (Num. 2:2, 17)."
  - "Supporting: one bright star above the far hills on the right (Num. 24:17)."
composition: >-
  A wide landscape just before sunrise on the dry plain of the wilderness. The ground
  lies in cool pre-dawn shadow, with rocks and dry scrub on a low rise in the
  foreground. On the rise, right of center, stands the tall wooden pole, and the
  brass serpent coiled around its top is lit by the first light and glows bronze-gold
  against the deep blue sky. On the plain to the left lies the camp: the tabernacle,
  a long, low, dark tent inside a court of white linen hangings, in an open space at
  the center, and low dark tents in ordered groups around it on every side, with a few
  colored banners on poles. Beyond, a bare plain runs to distant blue hills under a
  band of gold and rose where the sun has not yet risen, and one bright star hangs
  above the hills on the right. No people or animals.
key:
  - '**The brass serpent on the pole** is the remedy the LORD gave when fiery serpents bit the people: “Make thee a fiery serpent, and set it upon a pole: and it shall come to pass, that every one that is bitten, when he looketh upon it, shall live” ([[Num. 21:8]]). Jesus took it as a figure of Himself: “As Moses lifted up the serpent in the wilderness, even so must the Son of man be lifted up” ([[John 3:14]]).'
  - '**The camp around the white court** is Israel camped by tribes with the tabernacle in the middle: “Every man of the children of Israel shall pitch by his own standard, with the ensign of their father’s house: far off about the tabernacle of the congregation shall they pitch” ([[Num. 2:2]]).'
  - '**The banners above the tents** are the standards by which the tribes camped and marched, “every man in his place by their standards” ([[Num. 2:17]]).'
  - '**The star over the hills** is Balaam’s prophecy: “there shall come a Star out of Jacob, and a Sceptre shall rise out of Israel” ([[Num. 24:17]]).'
