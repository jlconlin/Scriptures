description: A phrase-by-phrase companion to the book of Malachi, grounded in the restored gospel of Jesus Christ.
divisionsBlurb: Malachi is a book of questions and answers. The Lord speaks, the people ask “Wherein?”, and the Lord answers, moving from the priests’ failures to the day that is coming.
