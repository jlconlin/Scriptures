intro: |
  Malachi is the last book of the Old Testament. His name means “my messenger” in Hebrew, and he preached to the Jews in Jerusalem after they returned from the Babylonian exile. The Bible Dictionary says his prophecy was spoken about 430 B.C.; *Scripture Helps* says the timing of his ministry is uncertain. The Savior quoted all of chapters 3 and 4 to the Nephites ([[3 Ne. 24–25]]), and Moroni quoted from them to Joseph Smith ([[JS—H 1:36–39]]).

  The book is short and takes a distinctive form: a series of exchanges in which the Lord reproves the people, the people ask what they have done, and the Lord answers. This companion goes through all four chapters and tries to anticipate the questions a careful reader asks: *Who is speaking, and to whom? What had the people done? What did that word or custom mean? Where is Christ in this?*

# The large movements of the book, from the Church’s chapter headings (the Bible Dictionary’s two parts, Mal. 1:1–2:9 and 2:10–4:6,
# split chapter 2). Keys must not repeat another book’s (the colors are global variables).
divisions:
  - key: priests
    range: [1, 2]
    name: The Lord’s Love and the Priests’ Failure
    blurb: The people ask how the Lord has loved them. He answers with Jacob and Esau, then reproves the priests for polluted offerings and for forsaking the covenant of Levi, and condemns Judah for dealing treacherously with one another and with the wives of their youth.
    color: '#4a4fa8'
    darkColor: '#9fa3ec'
  - key: messenger
    range: [3, 3]
    name: The Messenger, the Tithe, and the Book of Remembrance
    blurb: The Lord’s messenger will prepare the way for the Lord, who will come to His temple and purify the sons of Levi. The people are told to return and to bring tithes and offerings, and those who feared the Lord are written in a book of remembrance.
    color: '#b83a7a'
    darkColor: '#ee92bc'
  - key: elijah
    range: [4, 4]
    name: The Day That Burns and the Return of Elijah
    blurb: The day comes that burns as an oven, and the Sun of righteousness rises with healing for those who fear the Lord’s name. Before that great and dreadful day He will send Elijah.
    color: '#c9a227'
    darkColor: '#f2d36b'

