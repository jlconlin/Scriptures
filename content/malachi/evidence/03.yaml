    claim: 'After they were written he expounded them'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/24?lang=eng'
    quote: 'And it came to pass that after they were written he expounded them.'
