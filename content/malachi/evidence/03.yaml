    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/24?lang=eng'
    quote: 'And it came to pass that he commanded them that they should write the words which the Father had given unto Malachi, which he should tell unto them.'
