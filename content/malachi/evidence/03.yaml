  - where: 'note 3:1 “Why Jesus gave this chapter to the Nephites”'
    claim: 'A likely reason: Malachi tells who will be destroyed and who will survive the Second Coming'
    key: 'sc-knowhy-218'
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-give-the-nephites-malachis-prophecies'
    quote: 'The likely reason for this is because Malachi’s words tell about those who will be destroyed in the Second Coming and those who will survive the Second Coming'
  - where: 'note 3:1 “Why Jesus gave this chapter to the Nephites”'
    claim: 'The sermon had reached the question “who may abide?”'
    key: 'sc-knowhy-218'
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-give-the-nephites-malachis-prophecies'
    quote: 'After Jesus had described the last days and the blessings that would be given to the faithful, the question remained: “who may abide the day of his coming, and who shall stand when he appeareth?”'
  - where: 'note 3:1 “Why Jesus gave this chapter to the Nephites”'
    claim: '3 Nephi 24:18 gives the positive answer'
    key: 'sc-knowhy-218'
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-give-the-nephites-malachis-prophecies'
    quote: '3 Nephi 24:18 (cf. Malachi 3:18) reveals the positive answer'
