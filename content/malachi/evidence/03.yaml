  - where: 'thread'
    claim: 'Verse 6: the Lord’s unchangeableness and Israel’s survival are why the wicked are removed by judgment'
    key: 'keil-malachi'
    url: 'https://biblehub.com/commentaries/kad/malachi/3.htm'
    quote: 'Because Jehovah is unchangeable in His purposes, and Israel as the people of God is not to perish, therefore will God exterminate the wicked out of Israel by means of judgment'
  - where: 'thread'
    claim: 'The judgment starts with the sons of Levi and becomes a judgment on all sinners'
    key: 'keil-malachi'
    url: 'https://biblehub.com/commentaries/kad/malachi/3.htm'
    quote: 'The refining which the Lord will perform at His coming will not limit itself to the priests, but become a judgment upon all sinners.'
  - where: 'thread'
    claim: 'The book of remembrance is for those who feared the Lord'
    key: 'scripture-helps-mal'
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'Malachi taught that those who “feared the Lord, and that thought upon his name” were recorded in the book of remembrance.'
  - where: 'thread'
    claim: 'Verses 7–12 explain why the blessing had been withheld'
    key: 'keil-malachi'
    url: 'https://biblehub.com/commentaries/kad/malachi/3.htm'
    quote: 'He proceeds to explain the reason why He has hitherto withheld His blessing and His salvation.'
  - where: 'thread'
    claim: 'Verse 16 sets the conduct of those who fear God against the complaint'
    key: 'keil-malachi'
    url: 'https://biblehub.com/commentaries/kad/malachi/3.htm'
    quote: 'to contrast the conduct of those who fear God, pointing to the blessing which they derive from their piety'
  - where: 'thread'
    claim: 'Verse 18 tells the murmurers that they will see the difference'
    key: 'keil-malachi'
    url: 'https://biblehub.com/commentaries/kad/malachi/3.htm'
    quote: 'they will then see the difference between the righteous who serve God, and the wicked who do not serve Him'
