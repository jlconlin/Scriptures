  # ---------- note 4:5 Great and dreadful ----------
  - where: 'note 4:5 “What “great and dreadful” means”'
    claim: 'Many Latter-day Saints take the phrase to mean great for the righteous and dreadful for the wicked'
    key: pike-great-dreadful-day
    url: 'https://byustudies.byu.edu/article/the-great-and-dreadful-day-of-the-lord-the-anatomy-of-an-expression'
    quote: 'Many Latter-day Saints interpret the phrase'
  - where: 'note 4:5 “What “great and dreadful” means”'
    claim: 'The Hebrew does not support “great for the righteous, dreadful for the wicked”'
    key: pike-great-dreadful-day
    url: 'https://byustudies.byu.edu/article/the-great-and-dreadful-day-of-the-lord-the-anatomy-of-an-expression'
    quote: 'interpreting the expression “the great and dreadful/terrible day of the Lord” to mean great for the righteous and dreadful for the wicked misrepresents the original meaning of this phrase'
  - where: 'note 4:5 “What “great and dreadful” means”'
    claim: 'nora is a Niphal participle of yare’, “to fear,” meaning fearful, to be feared or dreaded; gadol is used of many things'
    key: pike-great-dreadful-day
    url: 'https://byustudies.byu.edu/article/the-great-and-dreadful-day-of-the-lord-the-anatomy-of-an-expression'
    quote: 'is a Niph‘al (conjugation) participle of the Hebrew verb yārē’, which means “to fear.” It thus has the sense of “fearful,” something “to be feared or dreaded.”'
  - where: 'note 4:5 “What “great and dreadful” means”'
    claim: 'gadol is used of Jehovah himself'
    key: pike-great-dreadful-day
    url: 'https://byustudies.byu.edu/article/the-great-and-dreadful-day-of-the-lord-the-anatomy-of-an-expression'
    quote: 'The term gādôl is used several times in the Hebrew Bible to describe Jehovah and his accomplishments, as well as his “day.”'
  - where: 'note 4:5 “What “great and dreadful” means”'
    claim: 'The two ways to translate the phrase'
    key: pike-great-dreadful-day
    url: 'https://byustudies.byu.edu/article/the-great-and-dreadful-day-of-the-lord-the-anatomy-of-an-expression'
    quote: 'the meaning is “the supremely powerful and dreadful day of the Lord” or “the extraordinary and fearful day of the Lord.”'
  - where: 'note 4:5 “What “great and dreadful” means”'
    claim: 'The second rendering: gadol as an adverb intensifying the second modifier'
    key: pike-great-dreadful-day
    url: 'https://byustudies.byu.edu/article/the-great-and-dreadful-day-of-the-lord-the-anatomy-of-an-expression'
    quote: 'as in “the extraordinarily dreadful day of the Lord” or “the significantly fearful day of the Lord.” It is not possible to ascertain which of these two options was originally intended. However, neither rendition conveys a sense of joyful.'
  - where: 'note 4:5 “What “great and dreadful” means”'
    claim: 'Joel 2:31 has the same Hebrew wording'
    key: pike-great-dreadful-day
    url: 'https://byustudies.byu.edu/article/the-great-and-dreadful-day-of-the-lord-the-anatomy-of-an-expression'
    quote: 'this expression is worded exactly the same in both Joel 2:31 and Malachi 4:5'
  - where: 'note 4:5 “What “great and dreadful” means”'
    claim: 'BDB lists “the name (of Yahweh)” in Malachi 3:20 (King James 4:2, “you that fear my name”) under the entry for yare’ (fear)'
    key: bdb
    url: 'https://biblehub.com/hebrew/3372.htm'
    quote: 'the name (of Yahweh) Deuteronomy 28:58; Isaiah 59:19; Malachi 3:20'
  - where: 'note 4:5 “What “great and dreadful” means”'
    claim: 'BDB lists “the great and awful day” of Malachi 3:23 (King James 4:5) under the same entry'
    key: bdb
    url: 'https://biblehub.com/hebrew/3372.htm'
    quote: 'the great and awful day of Yahweh Joel 3:4; Malachi 3:23'
