chapter: 4
claims:
  # ---------- when ----------
  - where: when
    claim: 'The Bible Dictionary dates the prophecy of Malachi to about 430 B.C.'
    key: bd-malachi
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/malachi?lang=eng'
    quote: 'The prophecy of Malachi was spoken about 430 B.C.'
  - where: when
    claim: 'The exact timing of Malachi’s ministry is uncertain'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'The exact timing of Malachi’s ministry is uncertain'
  # ---------- setting ----------
  - where: setting
    claim: 'The Hebrew text of Malachi has three chapters'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: '<chapter osisID="Mal.3">'
  - where: setting
    claim: 'Hebrew 3:23 is the King James 4:5, the verse that names Elijah (the file’s own note gives the numbering)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: '<note>KJV:Mal.4.5</note>'
  - where: setting
    claim: 'Hebrew 3:19 is the King James 4:1 (and 3:24 is 4:6)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: '<note>KJV:Mal.4.1</note>'
  - where: setting
    claim: 'Hebrew 3:24 is the King James 4:6, the last verse'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: '<note>KJV:Mal.4.6</note>'
  - where: setting
    claim: 'The Bible Dictionary dates the prophecy of Malachi to about 430 B.C.'
    key: bd-malachi
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/malachi?lang=eng'
    quote: 'The prophecy of Malachi was spoken about 430 B.C.'
  - where: setting
    claim: 'The timing of Malachi’s ministry is uncertain'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'The exact timing of Malachi’s ministry is uncertain'
  - where: setting
    claim: 'Malachi preached to the Jews in Jerusalem after they returned from exile'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'Malachi was a prophet who preached to the Jews in Jerusalem after they returned from Babylonian exile.'
  - where: setting
    claim: 'Jesus commanded the Nephites to write the words the Father gave to Malachi'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/24?lang=eng'
    quote: 'he commanded them that they should write the words which the Father had given unto Malachi'
  - where: setting
    claim: 'Moroni quoted chapter 4 to Joseph Smith with a little variation from the Bible'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-h/1?lang=eng'
    quote: 'he quoted also the fourth or last chapter of the same prophecy, though with a little variation from the way it reads in our Bibles'
  - where: setting
    claim: 'Moroni’s visit, when he quoted Malachi, was on September 21, 1823'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'When the angel Moroni appeared to the 17-year-old Joseph Smith on the evening of September 21, 1823, he quoted Malachi’s prophecy'
  - where: setting
    claim: 'Elijah appeared in the Kirtland Temple on April 3, 1836'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'Twelve and a half years later, on April 3, 1836, Elijah appeared to Joseph Smith and Oliver Cowdery in the newly dedicated Kirtland Temple.'
  - where: setting
    claim: 'Elijah said in Kirtland that the time spoken of by Malachi had fully come'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/110?lang=eng'
    quote: 'Behold, the time has fully come, which was spoken of by the mouth of Malachi'
  # ---------- thread ----------
  - where: thread
    claim: 'The words of verse 1 for the proud and the wicked point back to the people’s complaint in 3:15'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/4.htm'
    quote: 'point back to Malachi 3:15'
  - where: thread
    claim: 'Roots and branches can stand for ancestors and descendants'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'Roots and branches can refer to our ancestors and descendants.'
  - where: thread
    claim: 'Elder Christofferson’s statement that without sealings we would be left with neither roots nor branches'
    key: christofferson-sealing-power
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/10/15christofferson?lang=eng'
    quote: 'we would be left in eternity with neither roots nor branches—that is, neither ancestry nor posterity'
  - where: thread
    claim: 'Elder Christofferson joins that state (the image of 4:1) to the curse of 4:6'
    key: christofferson-sealing-power
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/10/15christofferson?lang=eng'
    quote: 'Were that to become the norm, it would be tantamount to the earth being smitten with a curse or “utterly wasted” at the Lord’s coming.'
  - where: thread
    claim: 'Malachi 4:2 text (“you that fear my name”) and 4:6 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/4?lang=eng'
    quote: 'But unto you that fear my name shall the Sun of righteousness arise with healing in his wings'
  # ---------- note 4:1 The day answers the people’s complaint ----------
  - where: 'note 4:1 “The day answers the people’s complaint”'
    claim: 'zedim, “the proud,” occurs in Malachi in 3:15 (this is the form there)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'זֵדִ֑ים'
  - where: 'note 4:1 “The day answers the people’s complaint”'
    claim: 'zedim occurs again in 4:1 (Hebrew 3:19)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'זֵדִ֜ים'
  - where: 'note 4:1 “The day answers the people’s complaint”'
    claim: 'The participle of ʿasah, plural in 3:15 (followed by rishʿah, “wickedness”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'עֹשֵׂ֣י'
  - where: 'note 4:1 “The day answers the people’s complaint”'
    claim: 'The participle of ʿasah, singular in 4:1 (Hebrew 3:19), followed by rishʿah'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'עֹשֵׂ֤ה'
  - where: 'note 4:1 “The day answers the people’s complaint”'
    claim: 'Keil: the two Hebrew expressions of 4:1 point back to 3:15'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/4.htm'
    quote: 'point back to Malachi 3:15'
  - where: 'note 4:1 “The day answers the people’s complaint”'
    claim: 'Keil: those the complaining people called blessed are the ones the fire consumes'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/4.htm'
    quote: 'Those who are called blessed by the murmuring nation will be consumed by the fire, as stubble is burned up'
  - where: 'note 4:1 “The day answers the people’s complaint”'
    claim: 'Malachi 3:15 reads “they that work wickedness are set up”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/3?lang=eng'
    quote: 'yea, they that work wickedness are set up'
  - where: 'note 4:1 “The day answers the people’s complaint”'
    claim: 'Malachi 4:2 reads “unto you that fear my name”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/4?lang=eng'
    quote: 'But unto you that fear my name shall the Sun of righteousness arise'
  # ---------- note 4:1 Oven and stubble ----------
  - where: 'note 4:1 “Oven and stubble”'
    claim: 'Keil: the day will be to the ungodly like a burning furnace'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/4.htm'
    quote: 'The day of judgment will be to the ungodly like a burning furnace.'
  - where: 'note 4:1 “Oven and stubble”'
    claim: 'Keil prints the remark (which he attributes to Hengstenberg, not read) that a fire burns more fiercely in a furnace than in the open air'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/4.htm'
    quote: 'A fire burns more fiercely in a furnace than in the open air'
  - where: 'note 4:1 “Oven and stubble”'
    claim: 'What stubble is, and that farmers burn it to prepare the ground'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'Stubble refers to the short, cut stalks that remain after grain has been harvested. Farmers often burn stubble to prepare the ground for future planting.'
  - where: 'note 4:1 “Oven and stubble”'
    claim: 'The Church reads Mal. 4:1 as the earth cleansed at the Second Coming and the wicked destroyed like stubble'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'at the time of the Savior’s Second Coming, the earth would be cleansed and the wicked would be destroyed like stubble in a fire'
  - where: 'note 4:1 “Oven and stubble”'
    claim: 'D&C 133 is the revelation commanding the Saints to prepare for the Second Coming, and it quotes Mal. 4:1 in verse 64'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/133?lang=eng'
    quote: 'The Saints are commanded to prepare for the Second Coming'
  - where: 'note 4:1 “Oven and stubble”'
    claim: 'D&C 133:64 quotes Mal. 4:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/133?lang=eng'
    quote: 'And also that which was written by the prophet Malachi: For, behold, the day cometh that shall burn as an oven'
  - where: 'note 4:1 “Oven and stubble”'
    claim: 'Moroni’s wording of verse 1 as Joseph Smith recorded it: those who come do the burning; the account does not say who they are'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-h/1?lang=eng'
    quote: 'all that do wickedly shall burn as stubble; for they that come shall burn them'
  # ---------- note 4:1 Roots and branches ----------
  - where: 'note 4:1 “Roots and branches”'
    claim: 'BDB: shoresh, root, of a people under the figure of a tree, firmness, permanence'
    key: bdb
    url: 'https://biblehub.com/hebrew/8328.htm'
    quote: '1 root of people under figure of tree, involving firmness, permanence'
  - where: 'note 4:1 “Roots and branches”'
    claim: 'BDB lists Malachi 3:19 (Hebrew numbering; King James 4:1) among the uses of the same figure of a person'
    key: bdb
    url: 'https://biblehub.com/hebrew/8328.htm'
    quote: 'Isaiah 5:24; Malachi 3:19; Job 8:17'
  - where: 'note 4:1 “Roots and branches”'
    claim: 'Keil: the figure of root and branch is borrowed from a tree and denotes total destruction'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/4.htm'
    quote: 'and denotes total destruction, so that nothing will be left of them'
  - where: 'note 4:1 “Roots and branches”'
    claim: 'The Church’s reading: roots and branches as ancestors and descendants'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'Roots and branches can refer to our ancestors and descendants. To be left without either is to be cut off from the blessing of an eternal family.'
  - where: 'note 4:1 “Roots and branches”'
    claim: 'Elder Christofferson on sealings and roots and branches'
    key: christofferson-sealing-power
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/10/15christofferson?lang=eng'
    quote: 'Without the sealings that create eternal families and link generations here and hereafter, we would be left in eternity with neither roots nor branches—that is, neither ancestry nor posterity.'
  - where: 'note 4:1 “Roots and branches”'
    claim: 'Elder Christofferson carries the image to the curse of the last verse'
    key: christofferson-sealing-power
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/10/15christofferson?lang=eng'
    quote: 'Were that to become the norm, it would be tantamount to the earth being smitten with a curse or “utterly wasted” at the Lord’s coming.'
  - where: 'note 4:1 “Roots and branches”'
    claim: 'Elder Cook on a tree needing roots and branches'
    key: cook-joy-family-history
    url: 'https://www.churchofjesuschrist.org/study/ensign/2016/02/the-joy-of-family-history-work?lang=eng'
    quote: 'For a tree to live and grow, it needs both roots and branches. We likewise need to be connected to our roots—our parents, grandparents, and other ancestors—as well as to our branches—our children, grandchildren, and other descendants.'
  # ---------- note 4:2 The Sun of righteousness ----------
  - where: 'note 4:2 “The Sun of righteousness”'
    claim: 'The winged sun disk was a symbol of divine beings in Egypt and Babylon for centuries, and was used in ancient Israel in the 8th–7th centuries BC'
    key: sc-knowhy-653
    url: 'https://scripturecentral.org/knowhy/why-does-malachi-refer-to-the-sun-of-righteousness'
    quote: 'Multiple ancient civilizations, including Egypt and Babylon, employed a winged sun disk for centuries as a symbol for divine beings. Surprisingly, this symbol was also used in ancient Israel during the eighth and seventh centuries BC.'
  - where: 'note 4:2 “The Sun of righteousness”'
    claim: 'A royal seal of Hezekiah, king of Judah, bears the winged sun'
    key: sc-knowhy-653
    url: 'https://scripturecentral.org/knowhy/why-does-malachi-refer-to-the-sun-of-righteousness'
    quote: 'Perhaps the most notable example is found on a royal seal “belonging to Hezekiah [son of] Ahaz king of Judah” that was recently discovered in Jerusalem.'
  - where: 'note 4:2 “The Sun of righteousness”'
    claim: 'The KnoWhy joins Isa. 30:26 to Malachi’s image: the Lord healing His people in connection with the sun'
    key: sc-knowhy-653
    url: 'https://scripturecentral.org/knowhy/why-does-malachi-refer-to-the-sun-of-righteousness'
    quote: 'Another mention of the Lord healing His people in connection with the sun can be found in Isaiah 30:26'
  - where: 'note 4:2 “The Sun of righteousness”'
    claim: 'The image would have been familiar to Nephi from the plates of brass or his education in Jerusalem'
    key: sc-knowhy-653
    url: 'https://scripturecentral.org/knowhy/why-does-malachi-refer-to-the-sun-of-righteousness'
    quote: 'This divine forecast would have been familiar to Nephi, either from Old Testament passages on the plates of brass or from his education as a young man in Jerusalem.'
  - where: 'note 4:2 “The Sun of righteousness”'
    claim: 'Malachi and Nephi may have drawn independently on a common earlier tradition'
    key: sc-knowhy-653
    url: 'https://scripturecentral.org/knowhy/why-does-malachi-refer-to-the-sun-of-righteousness'
    quote: 'Malachi and Nephi may have been independently drawing upon a common earlier tradition when they used this symbolism in their messianic prophecies.'
  - where: 'note 4:2 “The Sun of righteousness”'
    claim: 'The KnoWhy joins D&C 88:6–7 to Malachi’s image: Christ is in the sun and is the light of the sun'
    key: sc-knowhy-653
    url: 'https://scripturecentral.org/knowhy/why-does-malachi-refer-to-the-sun-of-righteousness'
    quote: 'As described in Doctrine and Covenants 88:6–7, Jesus Christ is the “light of truth” which “is in the sun, and the light of the sun, and the power thereof by which it was made.”'
  - where: 'note 4:2 “The Sun of righteousness”'
    claim: 'BDB on Malachi 3:20: the wings may be rays, or a winged sun-disc, each marked with a question mark'
    key: bdb
    url: 'https://biblehub.com/hebrew/8121.htm'
    quote: 'with wings, i.e. rays ? Now GASm; or winged sun-disc [compare We] ?'
  - where: 'note 4:2 “The Sun of righteousness”'
    claim: 'The Hebrew word shemesh means “sun”'
    key: bdb
    url: 'https://biblehub.com/hebrew/8121.htm'
    quote: '1 sun, Genesis 37:9 (E; + moon, stars)'
  - where: 'note 4:2 “The Sun of righteousness”'
    claim: 'The word in Malachi’s verse is shemesh (Hebrew 3:20)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'שֶׁ֣מֶשׁ'
  - where: 'note 4:2 “The Sun of righteousness”'
    claim: 'The Book of Mormon text of the verse reads “Son of Righteousness”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/25?lang=eng'
    quote: 'But unto you that fear my name, shall the Son of Righteousness arise with healing in his wings; and ye shall go forth and grow up as calves in the stall.'
  - where: 'note 4:2 “The Sun of righteousness”'
    claim: 'Nephi on the Savior’s crucifixion and rising “with healing in his wings”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/25?lang=eng'
    quote: 'they will crucify him; and after he is laid in a sepulchre for the space of three days he shall rise from the dead, with healing in his wings'
  - where: 'note 4:2 “The Sun of righteousness”'
    claim: '2 Ne. 26 is about Christ’s ministry to the Nephites (chapter heading)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/26?lang=eng'
    quote: 'Christ will minister to the Nephites'
  - where: 'note 4:2 “The Sun of righteousness”'
    claim: '2 Ne. 26:9 says the Son of Righteousness shall appear to them and heal them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/26?lang=eng'
    quote: 'But the Son of Righteousness shall appear unto them; and he shall heal them'
  - where: 'note 4:2 “The Sun of righteousness”'
    claim: 'D&C 88:7 on Christ in the sun'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: 'As also he is in the sun, and the light of the sun, and the power thereof by which it was made.'
  - where: 'note 4:2 “The Sun of righteousness”'
    claim: 'Isa. 30:26 sevenfold light of the sun in the day the Lord heals'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/30?lang=eng'
    quote: 'in the day that the Lord bindeth up the breach of his people, and healeth the stroke of their wound'
  # ---------- note 4:2 Calves ----------
  - where: 'note 4:2 “Calves let out of the stall”'
    claim: 'BDB: the verb push means spring about; Malachi 3:20 and Jer. 50:11 are the simile of gambolling calves'
    key: bdb
    url: 'https://biblehub.com/hebrew/6335.htm'
    quote: 'in both, simile of gambolling calves'
  - where: 'note 4:2 “Calves let out of the stall”'
    claim: 'BDB: the verb is “spring about”'
    key: bdb
    url: 'https://biblehub.com/hebrew/6335.htm'
    quote: 'I. [מּוּשׁ] verb apparently spring about'
  - where: 'note 4:2 “Calves let out of the stall”'
    claim: 'BDB: marbeq is a stall where calves were fattened; Malachi 3:20 is a simile of prosperity'
    key: bdb
    url: 'https://biblehub.com/hebrew/4770.htm'
    quote: 'calves out of the stall (where they were fattened)'
  - where: 'note 4:2 “Calves let out of the stall”'
    claim: 'BDB on Malachi 3:20, simile of prosperity'
    key: bdb
    url: 'https://biblehub.com/hebrew/4770.htm'
    quote: 'Malachi 3:20 (simile of prosperity)'
  - where: 'note 4:2 “Calves let out of the stall”'
    claim: 'Brenton’s Septuagint 4:2 reads “bound as young calves let loose from bonds”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/malachi/4.htm'
    quote: 'ye shall go forth, and bound as young calves let loose from bonds'
  # ---------- note 4:4 The book’s last instruction ----------
  - where: 'note 4:4 “The book’s last instruction”'
    claim: 'Keil: verse 4 is a general admonition to observe the law'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/4.htm'
    quote: 'It is rather a perfectly general admonition to lay to heart and observe the law.'
  - where: 'note 4:4 “The book’s last instruction”'
    claim: 'Keil: the admonition concludes the whole book of Malachi'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/4.htm'
    quote: 'forms the conclusion not only of the last section (Malachi 3:13-4:3), but of the whole of the book of Malachi'
  - where: 'note 4:4 “The book’s last instruction”'
    claim: 'Keil: Horeb is the place where the law was given'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/4.htm'
    quote: 'also mentions Horeb as the place where the law was given'
  - where: 'note 4:4 “The book’s last instruction”'
    claim: 'Keil: the admonition is the counterpart of the rebuke that the people had left the Lord’s ordinances from the days of their fathers (the words of Mal. 3:7; the Bible Hub page prints the reference as “Malachi 4:4”)'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/4.htm'
    quote: 'The whole of the admonition forms an antithesis to the rebuke'
  - where: 'note 4:4 “The book’s last instruction”'
    claim: 'Keil: they are to keep these ordinances in mind so that the Lord does not smite the land with the ban'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/4.htm'
    quote: 'that from the days of their fathers they went away from the ordinances of Jehovah. These they are to be mindful to observe, that the Lord when He comes may not smite the land with the ban.'
  - where: 'note 4:4 “The book’s last instruction”'
    claim: 'In the Hebrew text this verse is 3:22 (the file’s note)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: '<note>KJV:Mal.4.4</note>'
  - where: 'note 4:4 “The book’s last instruction”'
    claim: 'Jesus quoted Mal. 4:4 to the Nephites'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/25?lang=eng'
    quote: 'Remember ye the law of Moses, my servant, which I commanded unto him in Horeb for all Israel, with the statutes and judgments.'
  - where: 'note 4:4 “The book’s last instruction”'
    claim: 'Moroni quoted the last chapter of Malachi to Joseph Smith'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-h/1?lang=eng'
    quote: 'he quoted also the fourth or last chapter of the same prophecy'
  - where: 'note 4:4 “The book’s last instruction”'
    claim: 'The verses symbolically stood at the end of the Hebrew prophetic collection'
    key: sc-knowhy-591
    url: 'https://scripturecentral.org/knowhy/why-did-moroni-quote-malachi-about-elijahs-coming'
    quote: 'Both Jesus and Moroni quoted the last words of Malachi because those verses symbolically stood at the end of the Hebrew collection of the prophetic texts at the conclusion of the Old Testament.'
  - where: 'note 4:4 “The book’s last instruction”'
    claim: 'The KnoWhy reads Malachi 4:4 and 4:6 as a summary of what the new covenant would do: bind generations through obedience and through hearts welded by priesthood power'
