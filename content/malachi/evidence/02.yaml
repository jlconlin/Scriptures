chapter: 2
claims:
  # ---- when ----
  - where: 'when'
    claim: 'The prophecy is dated about 430 B.C. in the Bible Dictionary'
    key: bd-malachi
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/malachi?lang=eng'
    quote: 'The prophecy of Malachi was spoken about 430 B.C.'
  - where: 'when'
    claim: 'The exact timing of Malachi’s ministry is uncertain (generally dated between 500 and 350 BC)'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'The exact timing of Malachi’s ministry is uncertain, but his book is generally dated between 500 and 350 BC.'

  # ---- setting ----
  - where: 'setting'
    claim: 'The first part of the book (1:1–2:9) is addressed to the priesthood'
    key: bd-malachi
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/malachi?lang=eng'
    quote: 'The first part (Mal. 1:1–2:9) is addressed to the priesthood, reproving them for their neglect of service to God.'
  - where: 'setting'
    claim: 'The second part (2:10–4:6) is addressed to the people: marriage outside the covenant, divorces from wives within the covenant, neglect of tithe paying'
    key: bd-malachi
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/malachi?lang=eng'
    quote: 'The second part (2:10–4:6) is addressed to the people, speaking against marriage outside the covenant, divorces from wives within the covenant, and neglect of tithe paying'
  - where: 'setting'
    claim: 'Malachi may have been a contemporary of Ezra and Nehemiah'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'meaning Malachi may have been a contemporary of Ezra and Nehemiah.'
  - where: 'setting'
    claim: 'Ezra was told that the people, priests and Levites had not separated themselves from the people of the lands'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/9?lang=eng'
    quote: 'The people of Israel, and the priests, and the Levites, have not separated themselves from the people of the lands'
  - where: 'setting'
    claim: 'Nehemiah saw Jews who had married wives of Ashdod, Ammon, and Moab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/13?lang=eng'
    quote: 'In those days also saw I Jews that had married wives of Ashdod, of Ammon, and of Moab:'
  - where: 'setting'
    claim: 'Verse 15 is uncertain in the Hebrew (NIV note)'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Malachi+2%3A10-17&version=NIV'
    quote: 'Malachi 2:15 The meaning of the Hebrew for the first part of this verse is uncertain.'
  - where: 'setting'
    claim: 'Verse 3: translators differ (NIV note, alternative reading)'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Malachi+2%3A1-9&version=NIV'
    quote: 'Malachi 2:3 Or will blight your grain'
  - where: 'setting'
    claim: 'Verse 12: the NRSVUE note says the traditional text has “arouse”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Malachi+2%3A10-17&version=NRSVUE'
    quote: '2.12 Q ms Compare Gk: MT arouse'
  - where: 'setting'
    claim: 'Verse 16: the NRSVUE has “I hate” where its note says the Hebrew has “he hates”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Malachi+2%3A10-17&version=NRSVUE'
    quote: '2.16 Cn: Heb he hates'
  - where: 'setting'
    claim: 'The Savior quoted all of Malachi 3 and 4 to the Nephites'
    key: bd-malachi
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/malachi?lang=eng'
    quote: 'All of Mal. 3 and 4 was quoted by the Savior to the Nephites, as recorded in 3 Ne. 24 and 25.'

  # ---- thread ----
  - where: 'thread'
    claim: 'The Hebrew “covenant” (berit, H1285) occurs six times in Malachi: 2:4, 5, 8, 10, 14 and 3:1 (hebrew.mjs --word H1285); verse 14 shown'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'בָּגַ֣דְתָּה בָּ֔/הּ וְ/הִ֥יא חֲבֶרְתְּ/ךָ֖ וְ/אֵ֥שֶׁת בְּרִיתֶֽ/ךָ'
  - where: 'thread'
    claim: 'The verb bagad (H898) occurs five times in Malachi, all in 2:10–16 (hebrew.mjs --word H898); verse 10 shown'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'מַדּ֗וּעַ נִבְגַּד֙ אִ֣ישׁ בְּ/אָחִ֔י/ו לְ/חַלֵּ֖ל בְּרִ֥ית אֲבֹתֵֽי/נוּ'
  - where: 'thread'
    claim: 'The book takes the form of a dialogue between the Lord and the people'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'Malachi’s writings take a distinctive literary form: a series of exchanges in a dialogue between the Lord and the people.'
  - where: 'thread'
    claim: 'The question of 2:17 is answered in 3:1: the Lord replies that He will come'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/3.htm'
    quote: 'To the question, Where is or remains the God of judgment? the Lord Himself replies that He will suddenly come to His temple'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: 'The verb the KJV renders “corrupt” in verse 3 means “rebuke”'
    key: bdb
    url: 'https://biblehub.com/hebrew/1605.htm'
    quote: 'גָּעַר verb rebuke'
  - where: 'section 5 plain'
    claim: 'Verse 15 is obscure in the Hebrew'
    key: bdb
    url: 'https://biblehub.com/hebrew/7605.htm'
    quote: 'Malachi 2:15 is obscure'

  # ---- note 2:2 ----
  - where: 'note 2:2 “The blessings that are cursed”'
    claim: 'The lexicon reads “blessings” in Mal. 2:2 as prosperity'
    key: bdb
    url: 'https://biblehub.com/hebrew/1293.htm'
    quote: 'and I will curse your prosperity Malachi 2:2.'
  - where: 'note 2:2 “The blessings that are cursed”'
    claim: 'Some read the blessings as the priests’ revenues (tithes, portions of the sacrifices); the commentary rejects that'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/2.htm'
    quote: 'blessings, are obviously not the revenues of the priests, tithes, atonement-money, and portions of the sacrifices'
  - where: 'note 2:2 “The blessings that are cursed”'
    claim: 'The other reading: the blessings the priests pronounced on the people by virtue of their office'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/2.htm'
    quote: 'but the blessings pronounced by the priests upon the people by virtue of their office.'
  - where: 'note 2:2 “The blessings that are cursed”'
    claim: 'To curse them is to make them ineffective or turn them into the opposite'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/2.htm'
    quote: 'These God will curse, i.e., He will make them ineffective, or turn them into the very opposite.'
  - where: 'note 2:2 “The blessings that are cursed”'
    claim: '“I have cursed them already” is a Hebrew perfect: the curse has already taken effect'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/2.htm'
    quote: 'is a perfect, which affirms that the curse has already taken effect.'
  - where: 'note 2:2 “The blessings that are cursed”'
    claim: 'The NIV’s cross-reference for Malachi 2:2 is Numbers 6:23–27, the priestly blessing'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Malachi+2%3A1-9&version=NIV'
    quote: 'Malachi 2:2 : Nu 6:23-27'
  - where: 'note 2:2 “The blessings that are cursed”'
    claim: 'The NIV cross-references the curse of Malachi 2:2 to Deuteronomy 28:20'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Malachi+2%3A1-9&version=NIV'
    quote: 'Malachi 2:2 : S Dt 11:26; S 28:20'
  - where: 'note 2:2 “The blessings that are cursed”'
    claim: 'The Hebrew noun for “curse” (me’erah) is listed in five places: Deut. 28:20, Mal. 2:2, 3:9, Prov. 3:33, 28:27'
    key: bdb
    url: 'https://biblehub.com/hebrew/3994.htm'
    quote: 'a curse Deuteronomy 28:20; Malachi 2:2; Malachi 3:9; construct מְאֵרַת Proverbs 3:33; plural מְאֵרוֺת Proverbs 28:27.'

  # ---- note 2:3 ----
  - where: 'note 2:3 “Seed or arm, and the dung of the feasts”'
    claim: 'The verb ga‘ar means “rebuke”'
    key: bdb
    url: 'https://biblehub.com/hebrew/1605.htm'
    quote: 'גָּעַר verb rebuke'
  - where: 'note 2:3 “Seed or arm, and the dung of the feasts”'
    claim: 'The lexicon gives the reading “seed” for Mal. 2:3 (preventing the usual harvest)'
    key: bdb
    url: 'https://biblehub.com/hebrew/1605.htm'
    quote: 'the seed (prevent the usual harvest) Malachi 2:3'
  - where: 'note 2:3 “Seed or arm, and the dung of the feasts”'
    claim: 'The same lexicon entry gives “the arm, namely, of priests, that they may not extend it to bless”'
    key: bdb
    url: 'https://biblehub.com/hebrew/1605.htm'
    quote: 'the arm, namely, of priests, that they may not extend it to bless'
  - where: 'note 2:3 “Seed or arm, and the dung of the feasts”'
    claim: 'One commentary follows the Septuagint and Vulgate and adopts the pointing “arm”'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/2.htm'
    quote: 'We must therefore follow the lxx, Aquila, Vulg., Ewald, and others, and adopt the pointing'
  - where: 'note 2:3 “Seed or arm, and the dung of the feasts”'
    claim: 'The priests did not farm, so a failed harvest would not be a punishment peculiar to them'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/2.htm'
    quote: 'since the priests did not practise agriculture, it is impossible to see how rebuking the seed, i.e., causing a failure of the corps, could be a punishment peculiar to the priests.'
  - where: 'note 2:3 “Seed or arm, and the dung of the feasts”'
    claim: 'Rebuking the arm signifies neutralizing the priests’ official duties at the altar and sanctuary'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/2.htm'
    quote: 'rebuking the arm, therefore, signifies the neutralizing of the official duties performed at the altar and in the sanctuary.'
  - where: 'note 2:3 “Seed or arm, and the dung of the feasts”'
    claim: 'The ESV has “I will rebuke your offspring”, with a note that the Hebrew has “seed”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Malachi+2%3A1-9&version=ESV'
    quote: 'Behold, (F)I will rebuke your offspring, and (G)spread dung on your faces'
  - where: 'note 2:3 “Seed or arm, and the dung of the feasts”'
    claim: 'The ESV’s note on 2:3 reads “Hebrew seed”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Malachi+2%3A1-9&version=ESV'
    quote: 'Malachi 2:3 Hebrew seed'
  - where: 'note 2:3 “Seed or arm, and the dung of the feasts”'
    claim: 'The NRSVUE has “I will rebuke your offspring” and, for the last clause, “I will put you out of my presence,” with a note comparing the Greek and Syriac'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Malachi+2%3A1-9&version=NRSVUE'
    quote: '3 I will rebuke your offspring and spread dung on your faces, the dung of your offerings, and I will put you out of my presence.'
  - where: 'note 2:3 “Seed or arm, and the dung of the feasts”'
    claim: 'NRSVUE note on 2:3'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Malachi+2%3A1-9&version=NRSVUE'
    quote: '2.3 Cn Compare Gk Syr: Heb and he shall bear you to it'
  - where: 'note 2:3 “Seed or arm, and the dung of the feasts”'
    claim: 'The NIV has “rebuke your descendants”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Malachi+2%3A1-9&version=NIV'
    quote: 'Because of you I will rebuke your descendants'
  - where: 'note 2:3 “Seed or arm, and the dung of the feasts”'
    claim: 'The NIV offers “will blight your grain” as an alternative'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Malachi+2%3A1-9&version=NIV'
    quote: 'Malachi 2:3 Or will blight your grain'
  - where: 'note 2:3 “Seed or arm, and the dung of the feasts”'
    claim: 'The NIV renders the feasts as “your festival sacrifices” and the last clause “you will be carried off with it”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Malachi+2%3A1-9&version=NIV'
    quote: 'from your festival sacrifices, and you will be carried off with it.'
  - where: 'note 2:3 “Seed or arm, and the dung of the feasts”'
    claim: '“Feasts” stands for the festal sacrifices, the animals slain at the festivals'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/2.htm'
    quote: 'feasts, is used metonymically for festal sacrifices, or the sacrificial animals slain at the festivals'
  - where: 'note 2:3 “Seed or arm, and the dung of the feasts”'
    claim: 'The priests’ festal sacrifices are described as being themselves dung'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/2.htm'
    quote: 'the festal sacrifices offered by these priests are described as being themselves dung'
  - where: 'note 2:3 “Seed or arm, and the dung of the feasts”'
    claim: 'The image repays the contempt shown by offering blind or lame animals (chapter 1)'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/2.htm'
    quote: 'the contempt of the Lord, which they show by offering blind or lame animals, or such as are blemished in other ways, He will repay to them by giving them up to the greatest ignominy.'
  - where: 'note 2:3 “Seed or arm, and the dung of the feasts”'
    claim: 'The NIV cross-references the dung of Mal. 2:3 to Leviticus 4:11'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Malachi+2%3A1-9&version=NIV'
    quote: 'Malachi 2:3 : S Ex 29:14; S Lev 4:11; S Job 9:31'
  - where: 'note 2:3 “Seed or arm, and the dung of the feasts”'
    claim: 'The dung of a sin offering was carried out with the rest of the animal outside the camp (Lev. 4:11–12)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/4?lang=eng'
    quote: 'Even the whole bullock shall he carry forth without the camp unto a clean place, where the ashes are poured out'
  - where: 'note 2:3 “Seed or arm, and the dung of the feasts”'
    claim: 'The dung of a sin offering is among the parts of the animal carried out (Lev. 4:11)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/4?lang=eng'
    quote: 'and his inwards, and his dung,'
  - where: 'note 2:3 “Seed or arm, and the dung of the feasts”'
    claim: 'Mal. 1:8 condemns offering the blind, the lame and sick'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/1?lang=eng'
    quote: 'And if ye offer the blind for sacrifice, is it not evil? and if ye offer the lame and sick, is it not evil?'

  # ---- note 2:4 ----
  - where: 'note 2:4 “The covenant with Levi”'
    claim: 'The Levites are the descendants of Levi, the tribe assigned the work of the sanctuary'
    key: bd-levites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levites?lang=eng'
    quote: 'Descendants of Levi. The work of ministering in the sanctuary was assigned to this tribe.'
  - where: 'note 2:4 “The covenant with Levi”'
    claim: 'The NIV cross-references the covenant of Mal. 2:5 to Deut. 33:9'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Malachi+2%3A1-9&version=NIV'
    quote: 'Malachi 2:5 : Dt 33:9; Ps 25:10; 103:18'
  - where: 'note 2:4 “The covenant with Levi”'
    claim: 'The NIV cross-references “life and peace” in Mal. 2:5 to Num. 25:12 (the Church’s footnote 5a does the same)'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Malachi+2%3A1-9&version=NIV'
    quote: 'Malachi 2:5 : S Nu 25:12'
  - where: 'note 2:4 “The covenant with Levi”'
    claim: 'The NIV cross-references the instruction in the priest’s mouth (Mal. 2:6) to Deut. 33:10'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Malachi+2%3A1-9&version=NIV'
    quote: 'Malachi 2:6 : S Dt 33:10'
  - where: 'note 2:4 “The covenant with Levi”'
    claim: 'NIV: “so that my covenant with Levi may continue”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Malachi+2%3A1-9&version=NIV'
    quote: 'so that my covenant with Levi(H) may continue'
  - where: 'note 2:4 “The covenant with Levi”'
    claim: 'ESV: “that my covenant with Levi may stand”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Malachi+2%3A1-9&version=ESV'
    quote: 'my covenant with Levi may stand'

  # ---- note 2:7 ----
  - where: 'note 2:7 “The priest as the Lord’s messenger”'
    claim: 'The lexicon lists Mal. 2:7 for the sense “priest” of mal’ak'
    key: bdb
    url: 'https://biblehub.com/hebrew/4397.htm'
    quote: 'c. priest Malachi 2:7, probably Ecclesiastes 5:5 (RV angel).'
  - where: 'note 2:7 “The priest as the Lord’s messenger”'
    claim: 'mal’ak (H4397) occurs three times in Malachi, in 2:7 and twice in 3:1; 2:7 shown'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'כִּ֛י מַלְאַ֥ךְ יְהוָֽה צְבָא֖וֹת הֽוּא'
  - where: 'note 2:7 “The priest as the Lord’s messenger”'
    claim: 'mal’ak twice in 3:1 (“my messenger” and “the messenger of the covenant”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'הִנְ/נִ֤י שֹׁלֵחַ֙ מַלְאָכִ֔/י וּ/פִנָּה דֶ֖רֶךְ לְ/פָנָ֑/י'
  - where: 'note 2:7 “The priest as the Lord’s messenger”'
    claim: 'The name Malachi means “my messenger” in Hebrew'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'The name Malachi means “my messenger” in Hebrew.'
  - where: 'note 2:7 “The priest as the Lord’s messenger”'
    claim: 'The Hebrew word for “law” in verse 6 is torah'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'תּוֹרַ֤ת אֱמֶת֙ הָיְתָ֣ה בְּ/פִ֔י/הוּ'
  - where: 'note 2:7 “The priest as the Lord’s messenger”'
    claim: 'NRSVUE renders it “instruction” in verses 6–8'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Malachi+2%3A1-9&version=NRSVUE'
    quote: 'True instruction was in his mouth, and no wrong was found on his lips.'
  - where: 'note 2:7 “The priest as the Lord’s messenger”'
    claim: 'NRSVUE verse 8: “by your instruction”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Malachi+2%3A1-9&version=NRSVUE'
    quote: 'you have caused many to stumble by your instruction'
  - where: 'note 2:7 “The priest as the Lord’s messenger”'
    claim: 'ESV renders it “instruction” in verses 6–8, with a note “Or law; also verses 7, 8, 9”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Malachi+2%3A1-9&version=ESV'
    quote: 'True instruction was in his mouth, and no wrong was found on his lips.'
  - where: 'note 2:7 “The priest as the Lord’s messenger”'
    claim: 'ESV note on verse 6'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Malachi+2%3A1-9&version=ESV'
    quote: 'Malachi 2:6 Or law; also verses 7, 8, 9'

  # ---- note 2:8 ----
  - where: 'note 2:8 “From turning many away to making many stumble”'
    claim: 'Verse 6 has “many” (rabbim) as the object of “turned [back]”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'וְ/רַבִּ֖ים הֵשִׁ֥יב מֵ/עָוֺֽן'
  - where: 'note 2:8 “From turning many away to making many stumble”'
    claim: 'Verse 8 has the same word “many” (rabbim) as the object of “made stumble”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'הִכְשַׁלְתֶּ֥ם רַבִּ֖ים בַּ/תּוֹרָ֑ה'
  - where: 'note 2:8 “From turning many away to making many stumble”'
    claim: 'The Lord reproved the priests for setting a poor example that caused many people to stumble'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'The Lord also reproved the priests for setting a poor example that caused many people to stumble.'
  - where: 'note 2:8 “From turning many away to making many stumble”'
    claim: 'NRSVUE: “by your instruction”; “shown partiality in your instruction”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Malachi+2%3A1-9&version=NRSVUE'
    quote: 'you have caused many to stumble by your instruction'
  - where: 'note 2:8 “From turning many away to making many stumble”'
    claim: 'NRSVUE verse 9: shown partiality'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Malachi+2%3A1-9&version=NRSVUE'
    quote: 'have shown partiality in your instruction'
  - where: 'note 2:8 “From turning many away to making many stumble”'
    claim: 'NIV: “by your teaching have caused many to stumble”; “shown partiality in matters of the law”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Malachi+2%3A1-9&version=NIV'
    quote: 'by your teaching have caused many to stumble'
  - where: 'note 2:8 “From turning many away to making many stumble”'
    claim: 'NIV verse 9: shown partiality'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Malachi+2%3A1-9&version=NIV'
