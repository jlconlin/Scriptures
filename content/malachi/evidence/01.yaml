    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/41?lang=eng'
    quote: 'and he said unto me, This is the table that is before the Lord.'
  - where: 'note 1:7 “How can bread pollute the Lord?”'
    claim: 'The bread is not the showbread but the sacrificial flesh, called the food of God in Leviticus 21'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/1.htm'
    quote: 'does not refer to the shew-bread, for that was not offered upon the altar, but is the sacrificial flesh, which is called in Leviticus 21:6, Leviticus 21:8, Leviticus 21:17, the food (lechem) of God'
  - where: 'note 1:7 “How can bread pollute the Lord?”'
    claim: 'Leviticus 21:6: priests are not to profane the name of their God; they offer the bread of their God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/21?lang=eng'
    quote: 'They shall be holy unto their God, and not profane the name of their God: for the offerings of the Lord made by fire, and the bread of their God, they do offer'
  - where: 'note 1:7 “How can bread pollute the Lord?”'
    claim: 'The Hebrew verb “profane” in Leviticus 21:6 is lemma 2490 c'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'יְחַלְּל֔וּ'
  - where: 'note 1:7 “How can bread pollute the Lord?”'
    claim: 'The Hebrew verb “profaned” in Malachi 1:12 is the same verb (lemma 2490 c)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'מְחַלְּלִ֣ים'
  - where: 'note 1:7 “How can bread pollute the Lord?”'
    claim: 'What the priests profane in 1:12 is the name of the Lord'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/1.htm'
    quote: 'the priests of Israel desecrate the name of the Lord by that contempt of His name'

  # ---------- note 1:8 “Try it on the governor” ----------
  - where: 'note 1:8 “Try it on the governor”'
    claim: 'The Hebrew for “governor” in 1:8 is pechah (lemma 6346)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'לְ/פֶחָתֶ֗/ךָ'
  - where: 'note 1:8 “Try it on the governor”'
    claim: 'The Hebrew pechah (lemma 6346) is used of Zerubbabel, governor of Judah, in Haggai 1:1'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hag.xml'
    quote: 'פַּחַ֣ת'
  - where: 'note 1:8 “Try it on the governor”'
    claim: 'Haggai 1:1: Zerubbabel, governor of Judah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hag/1?lang=eng'
    quote: 'unto Zerubbabel the son of Shealtiel, governor of Judah'
  - where: 'note 1:8 “Try it on the governor”'
    claim: 'The same word (lemma 6346) is Nehemiah’s title in Nehemiah 5:14'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Neh.xml'
    quote: 'פֶּחָ/ם֮'
  - where: 'note 1:8 “Try it on the governor”'
    claim: 'Nehemiah was appointed governor in the land of Judah under Artaxerxes and did not eat the bread of the governor'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/5?lang=eng'
    quote: 'Moreover from the time that I was appointed to be their governor in the land of Judah, from the twentieth year even unto the two and thirtieth year of Artaxerxes the king'
  - where: 'note 1:8 “Try it on the governor”'
    claim: 'Earlier governors took bread and wine from the people (Nehemiah 5:15)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/5?lang=eng'
    quote: 'But the former governors that had been before me were chargeable unto the people, and had taken of them bread and wine'
  - where: 'note 1:8 “Try it on the governor”'
    claim: 'Malachi 1:8 need not presuppose a non-Israelite governor and might apply to Nehemiah; the words may relate to gifts and not the governor’s supplies'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/1.htm'
    quote: 'does not necessarily presuppose a non-Israelitish vicegerent, but might also apply to Nehemiah, since the prophet''s words may be understood as relating to free-will gifts or presents'
  - where: 'note 1:8 “Try it on the governor”'
    claim: 'The argument runs from the governor to God'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/1.htm'
    quote: 'If the governor would not accept worthless gifts graciously, how could they expect a gracious answer to their prayers from God when they offered such gifts to Him?'
  - where: 'note 1:8 “Try it on the governor”'
    claim: 'Verse 9 is a challenge whose answer is no; such intercession would be fruitless'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/1.htm'
    quote: 'but at the same time he intimates by the question, whether God would take any notice of this, that under the existing circumstances such intercession would be fruitless'
  - where: 'note 1:8 “Try it on the governor”'
    claim: 'Verse 9 has also been read as an earnest call to repentance; the context is against it'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/1.htm'
    quote: 'The view of Jerome, Grotius, and Hitzig, that the challenge to seek the face of God is an earnest call to repentance or to penitential prayer, is at variance with the context.'

  # ---------- note 1:10 “For nought: unpaid, or in vain?” ----------
  - where: 'note 1:10 “For nought: unpaid, or in vain?”'
    claim: 'The Student Manual reads “for nought” as unpaid: no priest would kindle the altar fire unless paid'
    key: ot-manual-34
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-34?lang=eng'
    quote: 'They were selfish and worldly, and not one of them would kindle a fire on the hearth of the altar unless he were paid for it.'
  - where: 'note 1:10 “For nought: unpaid, or in vain?”'
    claim: 'The Hebrew of “for nought” in 1:10 is chinnam (lemma 2600)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'חִנָּ֑ם'
  - where: 'note 1:10 “For nought: unpaid, or in vain?”'
    claim: 'chinnam means gratis, for nothing'
    key: bdb
    url: 'https://biblehub.com/hebrew/2600.htm'
    quote: 'a. gratis, gratuitously, for nothing'
  - where: 'note 1:10 “For nought: unpaid, or in vain?”'
    claim: 'The lexicon’s example of that sense is serving for nought in Genesis 29:15'
    key: bdb
    url: 'https://biblehub.com/hebrew/2600.htm'
    quote: 'to serve for nought Genesis 29:15'
  - where: 'note 1:10 “For nought: unpaid, or in vain?”'
    claim: 'chinnam also means for no purpose, in vain, and the lexicon lists Malachi 1:10 there'
    key: bdb
    url: 'https://biblehub.com/hebrew/2600.htm'
    quote: 'b. for no purpose, in vain Proverbs 1:17; Malachi 1:10'
  - where: 'note 1:10 “For nought: unpaid, or in vain?”'
    claim: 'The Updated NRSV renders 1:10 as a wish, with “in vain”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Malachi+1&version=NRSVUE'
    quote: 'Oh, that someone among you would shut the temple doors, so that you would not kindle fire on my altar in vain!'
  - where: 'note 1:10 “For nought: unpaid, or in vain?”'
    claim: 'The Septuagint reads “even among you the doors shall be shut”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/malachi/1.htm'
    quote: '10Because even among you the doors shall be shut, and one will not kindle the fire of mine altar for nothing'

  # ---------- note 1:11 “Present or future?” ----------
  - where: 'note 1:11 “Present or future?”'
    claim: 'The first clause of 1:11 has no finite verb: gadol shemi bagoyim, with participles muqtar and muggash'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'מֻקְטָ֥ר'
  - where: 'note 1:11 “Present or future?”'
    claim: 'The second participle of 1:11 (“offered”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'מֻגָּ֛שׁ'
  - where: 'note 1:11 “Present or future?”'
    claim: 'The Church’s chapter heading reads the verse as future'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/1?lang=eng'
    quote: 'The Lord’s name will be great among the Gentiles.'
  - where: 'note 1:11 “Present or future?”'
    claim: 'The Updated NRSV reads “is great”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Malachi+1&version=NRSVUE'
    quote: 'my name is great among the nations'
  - where: 'note 1:11 “Present or future?”'
    claim: 'The Septuagint reads “has been glorified”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/malachi/1.htm'
    quote: 'my name has been glorified among the Gentiles'
  - where: 'note 1:11 “Present or future?”'
    claim: 'Both explanations are admissible on grammatical grounds'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/1.htm'
    quote: 'Both of these explanations are admissible on grammatical grounds'
  - where: 'note 1:11 “Present or future?”'
    claim: 'In Malachi’s time the Lord’s name was not great from east to west, nor incense offered in every place'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/1.htm'
    quote: 'At the time of Malachi the name of Jehovah was not great from the rising to the setting of the sun, nor were incense and sacrifice offered to Him in every place'
  - where: 'note 1:11 “Present or future?”'
    claim: 'On that argument the verse is prophetic of the spread of the kingdom of God among all nations'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/1.htm'
    quote: 'Consequently we must understand the words prophetically as relating to that spread of the kingdom of God among all nations, with which the worship of the true God would commence "in every place."'
  - where: 'note 1:11 “Present or future?”'
    claim: '“In every place” contrasts with the one place, the temple at Jerusalem, in the old covenant'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/1.htm'
    quote: 'forms an antithesis to the one place, in the temple at Jerusalem, to which the worship of God was limited during the time of the old covenant'
  - where: 'note 1:11 “Present or future?”'
    claim: '“Pure” means according to the requirements of the law, in contrast to polluted sacrifices'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/1.htm'
    quote: 'pure, i.e., according to the requirements of the law, in contrast to sacrifices polluted by faulty animals'
  - where: 'note 1:11 “Present or future?”'
    claim: 'The one Hebrew word goyim (lemma 1471 a) is “Gentiles” and “heathen” in 1:11 and “heathen” in 1:14'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'בַ/גּוֹיִֽם'

