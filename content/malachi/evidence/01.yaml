  # ---------- note 1:14 “The cheat with a male in his flock” ----------
  - where: 'note 1:14 “The cheat with a male in his flock”'
    claim: 'A vow or freewill offering brought as a burnt offering must be a male without blemish (Lev. 22:18–19)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/22?lang=eng'
    quote: 'Ye shall offer at your own will a male without blemish, of the beeves, of the sheep, or of the goats.'
  - where: 'note 1:14 “The cheat with a male in his flock”'
    claim: 'Leviticus 22:18 speaks of vows and freewill offerings offered for a burnt offering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/22?lang=eng'
    quote: 'that will offer his oblation for all his vows, and for all his freewill offerings, which they will offer unto the Lord for a burnt offering'
  - where: 'note 1:14 “The cheat with a male in his flock”'
    claim: 'For a vow an animal lacking in its parts is not accepted (Lev. 22:23)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/22?lang=eng'
    quote: 'that mayest thou offer for a freewill offering; but for a vow it shall not be accepted'
  - where: 'note 1:14 “The cheat with a male in his flock”'
    claim: 'The Hebrew nokhel means crafty, deceitful'
    key: bdb
    url: 'https://biblehub.com/hebrew/5230.htm'
    quote: 'verb be crafty, deceitful, knavish'
  - where: 'note 1:14 “The cheat with a male in his flock”'
    claim: 'The Hebrew for “deceiver” in 1:14 is a form of nakal (lemma 5230)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'נוֹכֵ֗ל'
  - where: 'note 1:14 “The cheat with a male in his flock”'
    claim: 'The Updated NRSV reads “cheat”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Malachi+1&version=NRSVUE'
    quote: 'Cursed be the cheat who has a male in the flock and vows to give it and yet sacrifices to the Lord what is blemished'

  # ---------- christ ----------
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'Animal sacrifice symbolized the atoning sacrifice of Jesus Christ; for that reason the animals had to be perfect'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'Animal sacrifice symbolized the atoning sacrifice of Jesus Christ. Because of this, the Lord commanded that all animals offered must “be perfect to be accepted; there shall be no blemish therein.”'
  - where: 'christ'
    claim: 'The Church’s footnote at 1:10 (“accept”) leads to 3 Nephi 9:19–20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/1?lang=eng'
    quote: '“accept”: Amos 5:22 (21–22); 3 Ne. 9:19 (19–20).'
  - where: 'christ'
    claim: 'The Lord says to the Nephites that they shall offer up no more the shedding of blood'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/9?lang=eng'
    quote: 'And ye shall offer up unto me no more the shedding of blood; yea, your sacrifices and your burnt offerings shall be done away'
  - where: 'christ'
    claim: 'The Church footnotes on “name” in 1:11 lead to Philippians 2:9 and D&C 18:23'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/1?lang=eng'
    quote: '“name”: Isa. 59:19; Zeph. 2:11; Philip. 2:9 (5–12); D&C 18:23 (21–25); 88:104.'
