  - where: 'note 1:7 “How can bread pollute the Lord?”'
    claim: 'Offering defiled food to God is regarded as defiling God Himself'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/1.htm'
    quote: 'In this sense they regard the offering of defiled food to God as defiling God Himself.'
  - where: 'note 1:7 “How can bread pollute the Lord?”'
    claim: 'The table of the Lord is the altar'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/1.htm'
    quote: 'The table of Jehovah is the altar, upon which the sacrifices (i.e., the food of God) were laid.'
  - where: 'note 1:7 “How can bread pollute the Lord?”'
    claim: 'The Church’s footnote on “table” at 1:12 leads to Ezekiel 41:22'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/1?lang=eng'
    quote: '“table”: Ezek. 41:22; 44:16.'
  - where: 'note 1:7 “How can bread pollute the Lord?”'
    claim: 'Ezekiel 41:22 calls an altar of wood the table before the Lord'
