chapter: 1
claims:
  # ---------- when ----------
  - where: 'when'
    claim: 'The Bible Dictionary dates the prophecy to about 430 B.C.'
    key: bd-malachi
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/malachi?lang=eng'
    quote: 'The prophecy of Malachi was spoken about 430 B.C.'
  - where: 'when'
    claim: 'The Bible Chronology places the prophecy of Malachi at 432, with Nehemiah’s second mission'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '432 | Nehemiah’s second mission to Jerusalem. Prophecy of Malachi.'
  - where: 'when'
    claim: 'Scripture Helps: timing uncertain, book generally dated 500 to 350 BC'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'The exact timing of Malachi’s ministry is uncertain, but his book is generally dated between 500 and 350 BC.'

  # ---------- setting ----------
  - where: 'setting'
    claim: 'Malachi is the last book of the Old Testament'
    key: gs-malachi
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/malachi?lang=eng'
    quote: 'The book or prophecy of Malachi is the last book in the Old Testament.'
  - where: 'setting'
    claim: 'Malachi preached to the Jews in Jerusalem after the exile'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'Malachi was a prophet who preached to the Jews in Jerusalem after they returned from Babylonian exile.'
  - where: 'setting'
    claim: 'The temple had been rebuilt and its worship restored for a considerable time'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/1.htm'
    quote: 'the temple had been rebuilt and the temple-worship had been restored for a considerable time'
  - where: 'setting'
    claim: 'Malachi addressed the spiritual decline among the Jews'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'As the Lord’s messenger, Malachi addressed the spiritual decline among the Jews.'
  - where: 'setting'
    claim: 'The book’s literary form is a dialogue of exchanges between the Lord and the people'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'Malachi’s writings take a distinctive literary form: a series of exchanges in a dialogue between the Lord and the people.'
  - where: 'setting'
    claim: 'The first part of the book (1:1–2:9) is addressed to the priesthood'
    key: bd-malachi
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/malachi?lang=eng'
    quote: 'The first part (Mal. 1:1–2:9) is addressed to the priesthood, reproving them for their neglect of service to God.'
  - where: 'setting'
    claim: 'The Savior quoted all of Malachi 3 and 4 to the Nephites'
    key: bd-malachi
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/malachi?lang=eng'
    quote: 'All of Mal. 3 and 4 was quoted by the Savior to the Nephites, as recorded in 3 Ne. 24 and 25.'
  - where: 'setting'
    claim: 'Paul quotes Malachi 1:2–3 in Romans 9:13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/9?lang=eng'
    quote: 'As it is written, Jacob have I loved, but Esau have I hated.'

  # ---------- thread ----------
  - where: 'thread'
    claim: 'In verse 6 “fear” is mora’ (H4172), from the verb yare’; in verse 14 “dreadful” is nora’, a form of the same verb'
    key: bdb
    url: 'https://biblehub.com/hebrew/4172.htm'
    quote: 'Word Origin: [from H3372 (יָרֵא - Fear)]'
  - where: 'thread'
    claim: 'Hebrew word for “fear” in 1:6 is mora’ (lemma 4172) with suffix “my”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'מוֹרָאִ֜/י'
  - where: 'thread'
    claim: 'In 1:14 “dreadful” is a form of yare’ (lemma 3372)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'נוֹרָ֥א'
  - where: 'thread'
    claim: 'The lexicon lists Malachi 1:14 under yare’, of the name of Yahweh'
    key: bdb
    url: 'https://biblehub.com/hebrew/3372.htm'
    quote: 'b. of the name of Yahweh Deuteronomy 28:58; Psalm 99:3; Psalm 111:9; Malachi 1:14.'
  - where: 'thread'
    claim: 'In 1:5 “be magnified” is a form of gadal (lemma 1431)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'יִגְדַּ֣ל'
  - where: 'thread'
    claim: 'In 1:11 and 1:14 “great” is gadol (lemma 1419 a)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'גָּד֤וֹל'
  - where: 'thread'
    claim: 'The nations’ attitude toward the name (1:11) is set as an antithesis against the priests’ desecration of the name (1:12–13)'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/1.htm'
    quote: 'the prophet appends as an antithesis in Malachi 1:12, Malachi 1:13 a repetition of the reproof, that the priests of Israel desecrate the name of the Lord by that contempt of His name'
  - where: 'thread'
    claim: 'The comparison with Esau may be meant to remind the people of their responsibility as the covenant people'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'The Lord may have used this comparison not only to reassure the people of His love for them but also to remind them of their responsibility to live faithfully as His covenant people.'
  - where: 'thread'
    claim: 'The love God showed Israel is the motive and model for Israel’s conduct toward Him'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/1.htm'
    quote: 'The love which God has shown to Israel ought to form the motive and model for the conduct of Israel towards its God.'

  # ---------- section 2 plain ----------
  - where: 'section 2 plain'
    claim: 'The Hebrew behind “dragons” in 1:3 is jackals'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/1?lang=eng'
    quote: '“dragons”: HEB jackals.'
  - where: 'section 2 plain'
    claim: 'Edom’s “impoverished” in 1:4 is “shattered” in the Updated NRSV'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Malachi+1&version=NRSVUE'
    quote: 'We are shattered but we will rebuild the ruins'

  # ---------- note 1:1 “Burden, a load and an oracle” ----------
  - where: 'note 1:1 “Burden, a load and an oracle”'
    claim: 'One word massa’ means “load, burden,” including a donkey’s and a mule’s load'
    key: bdb
    url: 'https://biblehub.com/hebrew/4853.htm'
    quote: 'load, burden of ass Exodus 23:5 (E), mules 2 Kings 5:17'
  - where: 'note 1:1 “Burden, a load and an oracle”'
    claim: 'A separately listed word massa’ (III) means a prophetic utterance or oracle'
    key: bdb
    url: 'https://biblehub.com/hebrew/4853.htm'
    quote: 'III. מַשָּׂא noun masculineIsaiah 14:28 utterance, oracle'
  - where: 'note 1:1 “Burden, a load and an oracle”'
    claim: 'The lexicon lists Zechariah 9:1, Zechariah 12:1 and Malachi 1:1 together under that word'
    key: bdb
    url: 'https://biblehub.com/hebrew/4853.htm'
    quote: 'Zechariah 9:1 (+ בארץ), Zechariah 12:1 (+ עַליִֿשְׂרָאֵל), Malachi 1:1 (+ ׳אֶליִֿשׂ)'
  - where: 'note 1:1 “Burden, a load and an oracle”'
    claim: 'The Updated NRSV prints “An oracle.” in 1:1'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Malachi+1&version=NRSVUE'
    quote: '1 An oracle. The word of the Lord to Israel by Malachi.'

  # ---------- note 1:1 “A name that means my messenger” ----------
  - where: 'note 1:1 “A name that means “my messenger””'
    claim: 'The lexicon: Malachi is “my messenger,” an Israelite prophet'
    key: bdb
    url: 'https://biblehub.com/hebrew/4401.htm'
    quote: '"my messenger," an Isr. prophet'
  - where: 'note 1:1 “A name that means “my messenger””'
    claim: 'The name in 1:1 (lemma 4401) is spelled with the same letters as “my messenger” in 3:1 (lemma 4397 with suffix)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'מַלְאָכִֽי'
  - where: 'note 1:1 “A name that means “my messenger””'
    claim: 'In 3:1 “my messenger” is H4397 with the suffix “my”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'מַלְאָכִ֔/י'
  - where: 'note 1:1 “A name that means “my messenger””'
    claim: 'Some scholars have wondered whether Malachi is a title rather than a personal name (prominence of the messenger in 3:1)'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'Because the concept of a messenger is a prominent theme in Malachi 3:1, some scholars have wondered whether Malachi is a title rather than the personal name of the prophet'
  - where: 'note 1:1 “A name that means “my messenger””'
    claim: 'The Septuagint reads “by the hand of his messenger”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/malachi/1.htm'
    quote: '1The burden of the word of the Lord to Israel by the hand of his messenger.'
  - where: 'note 1:1 “A name that means “my messenger””'
    claim: 'The Church’s study help that reports the question describes Malachi as a prophet'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'Malachi was a prophet who preached to the Jews in Jerusalem after they returned from Babylonian exile.'

  # ---------- note 1:2 “The question the book keeps asking” ----------
  - where: 'note 1:2 “The question the book keeps asking”'
    claim: 'The Hebrew of “Wherein” is the prefixed form b/4100 (bammeh) in 1:2, 1:6, 1:7, 2:17, 3:7 and 3:8'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'lemma="b/4100" morph="HR/Ti"'
  - where: 'note 1:2 “The question the book keeps asking”'
    claim: 'The Hebrew for 1:2 “Wherein hast thou loved us?” begins with the prefixed form of “what”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'בַּ/מָּ֣ה'
  - where: 'note 1:2 “The question the book keeps asking”'
    claim: 'Malachi’s writings are a series of exchanges between the Lord and the people, with rhetorical questions and the people’s responses'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'These exchanges often include rhetorical questions posed by the Lord or the people, along with responses that revealed the misunderstanding of the people.'

  # ---------- note 1:3 “Did the Lord hate Esau?” ----------
  - where: 'note 1:3 “Did the Lord hate Esau?”'
    claim: 'The word translated hate can mean “not to choose,” not contempt; that appears to be the case here'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'In the Bible, the word translated as hate can sometimes mean “not to choose” rather than being an expression of contempt. That appears to be the case in this passage.'
  - where: 'note 1:3 “Did the Lord hate Esau?”'
    claim: 'The Lord had made a covenant with Jacob’s line that He did not make with Esau’s'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'The Lord had made a covenant with Jacob and his descendants that He did not make with Esau and his descendants.'
  - where: 'note 1:3 “Did the Lord hate Esau?”'
    claim: 'The Hebrew verb in 1:3 is lemma 8130 (sane’)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'שָׂנֵ֑אתִי'
  - where: 'note 1:3 “Did the Lord hate Esau?”'
    claim: 'The same verb (lemma 8130) is used of Leah in Genesis 29:31'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'שְׂנוּאָ֣ה'
  - where: 'note 1:3 “Did the Lord hate Esau?”'
    claim: 'The same verb (lemma 8130) is used of the “hated” wife in Deuteronomy 21:15'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'וְ/הַ/שְּׂנוּאָ֑ה'
  - where: 'note 1:3 “Did the Lord hate Esau?”'
    claim: 'Genesis 29:30–31: Jacob loved Rachel more than Leah; Leah was hated'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/29?lang=eng'
    quote: 'And when the Lord saw that Leah was hated, he opened her womb'
  - where: 'note 1:3 “Did the Lord hate Esau?”'
    claim: 'Deuteronomy 21:15–17: the hated wife’s firstborn son receives the double portion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/21?lang=eng'
    quote: 'But he shall acknowledge the son of the hated for the firstborn, by giving him a double portion of all that he hath'
  - where: 'note 1:3 “Did the Lord hate Esau?”'
    claim: 'In the ancient world love and hate had to do with covenantal relationship, not emotion'
    key: sc-knowhy-186
    url: 'https://scripturecentral.org/knowhy/why-did-samuel-say-the-lord-hated-the-lamanites'
    quote: 'in the ancient world the terms “love” and “hate” had less to do with emotion and more to do with a vassal’s covenantal relationship with a lord'
  - where: 'note 1:3 “Did the Lord hate Esau?”'
    claim: 'The article’s notes say the “love” of Malachi 1:2–3 can be understood as political alliance'
    key: sc-knowhy-186
    url: 'https://scripturecentral.org/knowhy/why-did-samuel-say-the-lord-hated-the-lamanites'
    quote: 'See also Malachi 1:2–3, where the Hebrew word for “love” can be understood as referring political alliance.'
  - where: 'note 1:3 “Did the Lord hate Esau?”'
    claim: 'Esau is Edom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/36?lang=eng'
    quote: 'Now these are the generations of Esau, who is Edom.'
  - where: 'note 1:3 “Did the Lord hate Esau?”'
    claim: 'The Church’s footnote on “waste” in 1:3 leads to Ezekiel 25:13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/1?lang=eng'
    quote: '“waste”: Ezek. 25:13.'
  - where: 'note 1:3 “Did the Lord hate Esau?”'
    claim: 'Ezekiel’s oracle gives the reason for Edom’s judgment (25:12)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/25?lang=eng'
    quote: 'Because that Edom hath dealt against the house of Judah by taking vengeance, and hath greatly offended, and revenged himself upon them'
  - where: 'note 1:3 “Did the Lord hate Esau?”'
    claim: 'The oracle goes on to Edom’s desolation (25:13)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/25?lang=eng'
    quote: 'I will also stretch out mine hand upon Edom, and will cut off man and beast from it; and I will make it desolate from Teman'

  # ---------- note 1:4 “Edom’s failed rebuilding” ----------
  - where: 'note 1:4 “Edom’s failed rebuilding”'
    claim: 'The date and the agent of Edom’s devastation are disputed'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/1.htm'
    quote: 'It is a disputed point when this devastation took place, and from what people it proceeded.'
  - where: 'note 1:4 “Edom’s failed rebuilding”'
    claim: 'One inference from Jer 49:7ff with 25:9, 21 is that Edom was subjugated by Nebuchadnezzar'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/1.htm'
    quote: 'we may infer with the greatest probability from Jeremiah 49:7., as compared with Jeremiah 25:9, Jeremiah 25:21, that the Edomites were also subjugated by Nebuchadnezzar'
  - where: 'note 1:4 “Edom’s failed rebuilding”'
    claim: 'Jeremiah 25:9: Nebuchadnezzar is brought against all the nations round about'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'and will bring them against this land, and against the inhabitants thereof, and against all these nations round about'
  - where: 'note 1:4 “Edom’s failed rebuilding”'
    claim: 'Others hold the devastation was of the most recent date'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/1.htm'
    quote: 'Jahn, Hitzig, and Koehler are of opinion that it is only of the most recent date'
  - where: 'note 1:4 “Edom’s failed rebuilding”'
    claim: 'The Updated NRSV has Edom say “We are shattered”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Malachi+1&version=NRSVUE'
    quote: 'We are shattered but we will rebuild the ruins'
  - where: 'note 1:4 “Edom’s failed rebuilding”'
    claim: 'The Septuagint reads Edom’s words as “Idumea has been overthrown”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/malachi/1.htm'
    quote: '4Because one will say, Idumea has been overthrown, but let us return and rebuild the desolate places'
  - where: 'note 1:4 “Edom’s failed rebuilding”'
    claim: 'On the Babylonian reading, Jacob had recovered through the love of Jehovah while Esau’s land lay in ruins from the same blow'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/1.htm'
    quote: 'whereas Jacob had recovered, in consequence of the love of Jehovah, from the blow which had fallen upon it (through the Chaldaeans), Esau''s territory was still lying in ruins from the same blow'
  - where: 'note 1:4 “Edom’s failed rebuilding”'
    claim: '“Border” of wickedness is territory, land'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/1.htm'
    quote: 'territory, land of wickedness'
  - where: 'note 1:4 “Edom’s failed rebuilding”'
    claim: 'The name “border of wickedness”: permanent devastation read as proof of God’s wrath for Edom’s sins'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/1.htm'
    quote: 'as a practical proof that the wrath of God is resting for ever upon both people and land on account of Edom''s sins'
  - where: 'note 1:4 “Edom’s failed rebuilding”'
    claim: 'The Updated NRSV reads “beyond the borders of Israel”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Malachi+1&version=NRSVUE'
    quote: 'Great is the Lord beyond the borders of Israel!'
  - where: 'note 1:4 “Edom’s failed rebuilding”'
    claim: 'The Septuagint reads “upon the borders of Israel”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/malachi/1.htm'
    quote: 'The Lord has been magnified upon the borders of Israel.'
  - where: 'note 1:4 “Edom’s failed rebuilding”'
    claim: 'One argument: me’al does not mean “beyond” but “over, above”'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/1.htm'
    quote: 'does not mean "beyond the border of Israel" (Drus., Hitzig, Ewald, and others). מעל ל does not mean this, but simply over, above'
  - where: 'note 1:4 “Edom’s failed rebuilding”'
    claim: 'The Lord is great when He makes known His greatness by acts of power or grace'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/1.htm'
    quote: 'Jehovah is great, when He makes known His greatness to men, by His acts of power or grace.'

  # ---------- note 1:4 “Who is speaking?” ----------
  - where: 'note 1:4 “Who is speaking?”'
    claim: 'In the King James, LORD in small capitals stands for the divine name'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'In the KJV, the Jewish custom has been followed, and the name is generally denoted by Lord or God, printed in small capitals.'
  - where: 'note 1:4 “Who is speaking?”'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'

  # ---------- note 1:6 “Fear in verse 6, dreadful in verse 14” ----------
  - where: 'note 1:6 “Fear in verse 6, dreadful in verse 14”'
    claim: 'mora’ (“fear”) comes from yare’ “to fear”'
    key: bdb
    url: 'https://biblehub.com/hebrew/4172.htm'
    quote: 'Word Origin: [from H3372 (יָרֵא - Fear)]'
  - where: 'note 1:6 “Fear in verse 6, dreadful in verse 14”'
    claim: 'The lexicon gives mora’ in Malachi 1:6 the sense “reverence”'
    key: bdb
    url: 'https://biblehub.com/hebrew/4172.htm'
    quote: 'where is the reverence due to me Malachi 1:6'
  - where: 'note 1:6 “Fear in verse 6, dreadful in verse 14”'
    claim: 'The Updated NRSV reads “respect” in 1:6'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Malachi+1&version=NRSVUE'
    quote: 'where is the respect due me?'
  - where: 'note 1:6 “Fear in verse 6, dreadful in verse 14”'
    claim: 'The lexicon lists Malachi 1:14 under yare’, “of the name of Yahweh”'
    key: bdb
    url: 'https://biblehub.com/hebrew/3372.htm'
    quote: 'b. of the name of Yahweh Deuteronomy 28:58; Psalm 99:3; Psalm 111:9; Malachi 1:14.'
  - where: 'note 1:6 “Fear in verse 6, dreadful in verse 14”'
    claim: 'The Updated NRSV reads “reverenced” in 1:14'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Malachi+1&version=NRSVUE'
    quote: 'my name is reverenced among the nations'
  - where: 'note 1:6 “Fear in verse 6, dreadful in verse 14”'
    claim: 'The Hebrew of “fear” in 1:6 is mora’ with suffix “my”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'מוֹרָאִ֜/י'
  - where: 'note 1:6 “Fear in verse 6, dreadful in verse 14”'
    claim: 'The Hebrew of “dreadful” in 1:14 is nora’ (lemma 3372)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'נוֹרָ֥א'

  # ---------- note 1:7 “How can bread pollute the Lord?” ----------
  - where: 'note 1:7 “How can bread pollute the Lord?”'
    claim: '“Polluted” bread (mugal) and “polluted thee” (ga’alnukha) are the same verb, lemma 1351'
    key: oshb-wlc
