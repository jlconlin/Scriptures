  - where: 'section “An offering in righteousness”'
    claim: 'Scripture Helps gives two readings side by side: temple and family history work (Doctrine and Covenants), and Joseph Smith’s teaching of restored sacrifice'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'In the Doctrine and Covenants, this promised “offering unto the Lord” is associated with temple and family history work. Additionally, the Prophet Joseph Smith taught that animal sacrifice would be restored in some form near the time of the Savior’s Second Coming and that it would be performed in righteousness by sons of Levi.'
  - where: 'section “An offering in righteousness”'
    claim: 'Joseph Smith tied the sons of Levi’s offering to Mal. 3:3–4'
    key: jsp-history-c1-addenda-18
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-c-1-2-november-1838-31-july-1842/553'
    quote: 'then shall the Sons of Levi offer an acceptable sacrifice to the Lord. See Malachi iii 3. 4.'
  - where: 'section “An offering in righteousness”'
    claim: 'Joseph Smith: sacrifices will be restored when the temple is built and the sons of Levi are purified'
    key: jsp-history-c1-addenda-18
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-c-1-2-november-1838-31-july-1842/553'
    quote: 'when the Temple of the Lord shall be built and the Sons of Levi be purified, be fully restored'
  - where: 'section “An offering in righteousness”'
    claim: 'John’s words on conferring the Aaronic Priesthood (D&C 13:1)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/13?lang=eng'
    quote: 'this shall never be taken again from the earth, until the sons of Levi do offer again an offering unto the Lord in righteousness.'
  - where: 'section “An offering in righteousness”'
    claim: 'D&C 128:24 applies the phrase to the Saints'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/128?lang=eng'
    quote: 'Let us, therefore, as a church and a people, and as Latter-day Saints, offer unto the Lord an offering in righteousness; and let us present in his holy temple'
  - where: 'section “A later comparison”'
    claim: 'The Church edition footnote on “accept” (Mal. 1:10) points to 3 Ne. 9:19 (19–20)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/1?lang=eng'
    quote: '3 Ne. 9:19 (19–20)'
  - where: 'section “A later comparison”'
    claim: '3 Ne. 9:19–20: the Lord tells the Nephites to offer a broken heart and contrite spirit'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/9?lang=eng'
    quote: 'And ye shall offer for a sacrifice unto me a broken heart and a contrite spirit.'
  - where: 'section “A later comparison”'
    claim: 'Connection made by this page: 3 Ne. 9:19–20 set beside “an offering in righteousness” (Mal. 3:3); a comparison of quoted words, not a statement that one fulfils or explains the other'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/9?lang=eng'
    quote: 'And ye shall offer for a sacrifice unto me a broken heart and a contrite spirit.'
