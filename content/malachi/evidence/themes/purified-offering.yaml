page: purified-offering
claims:
  - where: 'opening'
    claim: 'Messenger of the covenant (Mal. 3:1) is a title of Jesus Christ; purifies the sons of Levi (3:3)'
    key: bd-christ-names
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/christ-names-of?lang=eng'
    quote: 'the Messenger of the covenant, Mal. 3:1'
  - where: 'opening'
    claim: 'Messenger of the covenant is a title of Jesus Christ'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: '“Messenger of the covenant” is a title of Jesus Christ.'
  - where: 'opening'
    claim: 'Christ is the great Refiner, with Mal. 3:2–3 cited: the one who purifies the sons of Levi is Jesus Christ'
    key: bd-refiner
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/refiner?lang=eng'
    quote: 'Christ is the great Refiner. See Isa. 1:25; 48:10; Zech. 13:9; Mal. 3:2–3.'
  - where: 'section “Refused”'
    claim: 'The Church edition footnote on “accept” (Mal. 1:10) points to 3 Ne. 9:19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/1?lang=eng'
    quote: '3 Ne. 9:19 (19–20)'
  - where: 'section “Refused”'
    claim: '3 Ne. 9:19 text the footnote points to'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/9?lang=eng'
    quote: 'And ye shall offer up unto me no more the shedding of blood'
  - where: 'section “A pure offering”'
    claim: 'One older commentary: “pure” means according to the law, in contrast to polluted sacrifices'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/1.htm'
    quote: 'The emphasis rests upon tehōrâh, pure, i.e., according to the requirements of the law, in contrast to sacrifices polluted by faulty animals'
  - where: 'section “The refiner”'
    claim: 'Messenger of the covenant is a title of Jesus Christ'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: '“Messenger of the covenant” is a title of Jesus Christ.'
  - where: 'section “The refiner”'
    claim: 'Bible Dictionary: Christ is the great Refiner, citing Mal. 3:2–3'
    key: bd-refiner
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/refiner?lang=eng'
    quote: 'Christ is the great Refiner. See Isa. 1:25; 48:10; Zech. 13:9; Mal. 3:2–3.'
  - where: 'section “The refiner”'
    claim: 'The word for “messenger” in 2:7 (priest) is the word of 3:1, which has two (“my messenger”, “the messenger of the covenant”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'מַלְאַ֥ךְ'
  - where: 'section “The refiner”'
    claim: 'Same word in 3:1: “my messenger”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'מַלְאָכִ֔'
  - where: 'section “The refiner”'
    claim: 'Same word in 3:1: “the messenger of the covenant”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'מַלְאַ֨ךְ'
  - where: 'section “The refiner”'
    claim: 'Keil: “I will send” in 3:1 prevents understanding the messenger as the priests'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/3.htm'
    quote: 'It is true that in Malachi 2:7 the priest is also called a messenger of Jehovah; but the expression הנני שׁלח (behold I send) prevents our understanding the term maleâkh as referring to the priests'
  - where: 'section “The refiner”'
    claim: 'Keil: “my messenger” of 3:1 is not the angel of Jehovah “mentioned afterwards” as the messenger of the covenant'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/3.htm'
    quote: 'who is mentioned afterwards and called maleakh habberı̄th, but an earthly messenger of the Lord'
  - where: 'section “An offering in righteousness”'
    claim: 'The Lord rebuked the sons of Levi for improper sacrifices and promised to purify them so offerings would be acceptable'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'In the days of Malachi, the Lord rebuked the sons of Levi for offering improper sacrifices. But He also promised that He would one day purify them so that their offerings would once again be acceptable to Him.'
  - where: 'section “An offering in righteousness”'
    claim: 'Hebrew “offering” (minchah) is the same word at 1:10, 1:11, 1:13, 2:12, 2:13, 3:3, 3:4: minchah at 1:10'
    key: oshb-wlc
