page: purified-offering
claims:
  - where: opening
    claim: 'Christ is the Refiner of Mal. 3:2–3'
    key: bd-refiner
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/refiner?lang=eng'
    quote: 'Christ is the great Refiner. See Isa. 1:25; 48:10; Zech. 13:9; Mal. 3:2–3.'
  - where: 'section “What the priests brought”'
    claim: 'The law required an offering without blemish to be accepted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/22?lang=eng'
    quote: 'it shall be perfect to be accepted; there shall be no blemish therein.'
  - where: 'section “What the priests brought”'
    claim: 'The animals of Mal. 1:8 were blemished animals of the kind Lev. 22:20–25 shuts out'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/1.htm'
    quote: 'the sacrificial animals were affected with blemishes (mūm), or had something corrupt (moshchâth) about them (Leviticus 22:20-25)'
  - where: 'section “What the priests brought”'
    claim: 'Sacrifice was a similitude of the sacrifice of the Only Begotten (the angel to Adam)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/5?lang=eng'
    quote: 'And then the angel spake, saying: This thing is a similitude of the sacrifice of the Only Begotten of the Father, which is full of grace and truth.'
  - where: 'section “What the priests brought”'
    claim: 'Peter: the blood of Christ, as of a lamb without blemish'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-pet/1?lang=eng'
    quote: 'But with the precious blood of Christ, as of a lamb without blemish and without spot:'
  - where: 'section “What the priests brought”'
    claim: 'Sacrifices offered with priesthood authority, until the death of Christ, were a similitude of His sacrifice'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'Thereafter, whenever there were true believers on the earth, with priesthood authority, sacrifices were offered in that manner and for that purpose. This continued until the death of Jesus Christ'
  - where: 'section “What the priests brought”'
    claim: 'The nation’s sacrifices displeased God chiefly because of the priests'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/3.htm'
    quote: 'not merely on account of the sins of the people (Malachi 2:13), but chiefly on account of the badness of the sacrificing priests (Malachi 1:10, Malachi 1:13)'
  - where: 'section “What the priests brought”'
    claim: 'Mal. 2:8: the priests corrupted the covenant of Levi'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/2?lang=eng'
    quote: 'But ye are departed out of the way; ye have caused many to stumble at the law; ye have corrupted the covenant of Levi, saith the Lord of hosts.'
  - where: 'section “The refiner begins with the sons of Levi”'
    claim: 'The messenger of the covenant (Mal. 3:1) is listed among the Old Testament names of Jesus'
    key: bd-christ-names
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/christ-names-of?lang=eng'
    quote: 'Names, titles, and concepts of the Lord Jesus in the Old Testament'
  - where: 'section “The refiner begins with the sons of Levi”'
    claim: 'The messenger of the covenant, Mal. 3:1, in the list'
    key: bd-christ-names
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/christ-names-of?lang=eng'
    quote: 'the Messenger of the covenant, Mal. 3:1'
  - where: 'section “The refiner begins with the sons of Levi”'
    claim: 'Christ is the great Refiner'
    key: bd-refiner
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/refiner?lang=eng'
    quote: 'Christ is the great Refiner. See Isa. 1:25; 48:10; Zech. 13:9; Mal. 3:2–3.'
  - where: 'section “The refiner begins with the sons of Levi”'
    claim: 'Malachi names Levi in three verses only, 2:4, 2:8 and 3:3 (node scripts/occurrences.mjs malachi Levi: 3 verses); this is the third'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/3?lang=eng'
    quote: 'and he shall purify the sons of Levi, and purge them as gold and silver, that they may offer unto the Lord an offering in righteousness.'
  - where: 'section “The refiner begins with the sons of Levi”'
    claim: 'Levi named at Mal. 2:4 (one of three verses)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/2?lang=eng'
    quote: 'that my covenant might be with Levi, saith the Lord of hosts.'
  - where: 'section “The refiner begins with the sons of Levi”'
    claim: 'Why the sons of Levi are purified first'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/3.htm'
    quote: 'Since they, the supporters and promoters of the religious life of the nation, were quite corrupt, the renovation of the national life must begin with their purification.'
  - where: 'section “An offering in righteousness”'
    claim: '“In righteousness” refers to the moral character of the offerers, not the nature of the sacrifices'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/3.htm'
    quote: 'Bitsedâqâh does not refer to the nature of the sacrifices, viz., righteous sacrifices, i.e., such as correspond to the law, but to the moral character of the offerers'
  - where: 'section “An offering in righteousness”'
    claim: '…that they will offer in a proper state of heart'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/3.htm'
    quote: 'that they will attend to the offering of sacrifice in a proper state of heart'
  - where: 'section “An offering in righteousness”'
    claim: 'Mal. 3:4: the nation’s offering is pleasant when the priests offer in righteousness again'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/3.htm'
    quote: 'Then, namely when the priests offer sacrifices in righteousness again, will the sacrificing of the whole nation be pleasant to the Lord, as was the case in the olden time.'
  - where: 'section “An offering in righteousness”'
    claim: '“Pure” in Mal. 1:11 means according to the law'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/1.htm'
    quote: 'The emphasis rests upon tehōrâh, pure, i.e., according to the requirements of the law, in contrast to sacrifices polluted by faulty animals'
  - where: 'section “An offering in righteousness”'
    claim: 'John the Baptist ordained Joseph Smith and Oliver Cowdery to the Aaronic Priesthood in 1829'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/13?lang=eng'
    quote: 'recounting the ordination of the Prophet and Oliver Cowdery to the Aaronic Priesthood near Harmony, Pennsylvania, May 15, 1829. The ordination was done by the hands of an angel who announced himself as John'
  - where: 'section “An offering in righteousness”'
    claim: 'D&C 13: the priesthood remains until the sons of Levi offer again in righteousness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/13?lang=eng'
    quote: 'and this shall never be taken again from the earth, until the sons of Levi do offer again an offering unto the Lord in righteousness.'
  - where: 'section “An offering in righteousness”'
    claim: 'D&C 84:31: sons of Moses and of Aaron shall offer an acceptable offering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'for the sons of Moses and also the sons of Aaron shall offer an acceptable offering and sacrifice in the house of the Lord, which house shall be built unto the Lord in this generation'
  - where: 'section “An offering in righteousness”'
    claim: 'D&C 84:33: the condition, faithful in obtaining the two priesthoods and magnifying the calling'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'For whoso is faithful unto the obtaining these two priesthoods of which I have spoken, and the magnifying their calling, are sanctified by the Spirit unto the renewing of their bodies.'
  - where: 'section “An offering in righteousness”'
    claim: 'D&C 84:34: they become the sons of Moses and of Aaron'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'They become the sons of Moses and of Aaron and the seed of Abraham, and the church and kingdom, and the elect of God.'
  - where: 'section “An offering in righteousness”'
    claim: 'D&C 128 is a letter of Joseph Smith to the Church, September 1842'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/128?lang=eng'
    quote: 'An epistle from Joseph Smith the Prophet to The Church of Jesus Christ of Latter-day Saints, containing further directions on baptism for the dead, dated at Nauvoo, Illinois, September 7, 1842.'
  - where: 'section “An offering in righteousness”'
    claim: 'D&C 128:24 quotes Mal. 3:2–3 after “the great day of the Lord is at hand”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/128?lang=eng'
    quote: 'Behold, the great day of the Lord is at hand; and who can abide the day of his coming, and who can stand when he appeareth? For he is like a refiner’s fire, and like fuller’s soap'
  - where: 'section “An offering in righteousness”'
    claim: 'D&C 128:24: the Saints are to offer an offering in righteousness, a book of the records of their dead'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/128?lang=eng'
    quote: 'Let us, therefore, as a church and a people, and as Latter-day Saints, offer unto the Lord an offering in righteousness; and let us present in his holy temple, when it is finished, a book containing the records of our dead, which shall be worthy of all acceptation.'
  - where: 'section “An offering in righteousness”'
    claim: 'Joseph Smith taught that all priesthood things of former times would be had again, and the sons of Levi would offer an acceptable sacrifice, citing Mal. 3:3–4'
    key: jsp-history-c1-addenda-18
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-c-1-2-november-1838-31-july-1842/553'
    quote: 'Therefore all things had under the authority of the Priesthood at any former period shall be had again, bringing to pass the restoration spoken of by the mouth of all the Holy Prophets; then shall the Sons of Levi offer an acceptable sacrifice to the Lord.'
  - where: 'section “An offering in righteousness”'
    claim: '…citing Malachi 3:3–4'
    key: jsp-history-c1-addenda-18
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-c-1-2-november-1838-31-july-1842/553'
    quote: 'then shall the Sons of Levi offer an acceptable sacrifice to the Lord. See Malachi iii 3. 4. And he shall sit as a refiner and purifier of silver, and he shall purify the Sons of Levi'
  - where: 'section “An offering in righteousness”'
    claim: 'Moroni quoted part of Malachi 3 to Joseph Smith in 1823'
    key: rsc-line-upon-line-eternal-family
    url: 'https://rsc.byu.edu/vol-20-no-1-2019/line-upon-line-joseph-smiths-growing-understanding-eternal-family'
    quote: 'on 21 September 1823, while he was praying “to Almighty God for forgiveness of all [his] sins and follies” the angel Moroni visited and taught him.'
  - where: 'section “An offering in righteousness”'
    claim: 'Moroni first quoted part of Malachi 3'
    key: rsc-line-upon-line-eternal-family
    url: 'https://rsc.byu.edu/vol-20-no-1-2019/line-upon-line-joseph-smiths-growing-understanding-eternal-family'
    quote: 'Joseph Smith said that Moroni “first quoted part of the third chapter of Malachi”'
  - where: 'section “An offering in righteousness”'
    claim: 'No indication Joseph understood the offering in 1823; by 1842 he linked it with the record of the dead'
    key: rsc-line-upon-line-eternal-family
    url: 'https://rsc.byu.edu/vol-20-no-1-2019/line-upon-line-joseph-smiths-growing-understanding-eternal-family'
    quote: 'We have no indication that Joseph understood what that offering was to be at that time. By 1842, Joseph would link this prophecy with presenting in the temple a worthy record of our dead (Doctrine and Covenants 128:17, 24).'
  - where: 'section “An offering in righteousness”'
    claim: 'A reading that differs from the teaching that sacrifice will be restored: Malachi uses the forms of Old Testament worship to depict the reverence of the new covenant, not to say that worship would continue'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/3.htm'
    quote: 'we must not infer from Malachi 3:3 and Malachi 3:4, that Malachi imagined that the Old Testament worship would be continued during the Messianic times'
  - where: 'section “An offering in righteousness”'
    claim: '…but as the prophets’ custom of using the forms of the old worship'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/3.htm'
    quote: 'his words are to be explained from the custom of the prophets, of using the forms of the Old Testament worship to depict the reverence for God which would characterize the new covenant.'
