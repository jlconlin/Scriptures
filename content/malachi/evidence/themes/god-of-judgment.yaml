    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/1?lang=eng'
    quote: 'Wherein hast thou loved us?'
  - where: 'section “The question”'
    claim: 'Exchange at 1:6: “Wherein have we despised thy name?”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/1?lang=eng'
    quote: 'Wherein have we despised thy name?'
  - where: 'section “The question”'
    claim: 'Exchange at 1:7: “Wherein have we polluted thee?”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/1?lang=eng'
    quote: 'Wherein have we polluted thee?'
  - where: 'section “The question”'
    claim: 'Exchange at 3:7: “Wherein shall we return?”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/3?lang=eng'
    quote: 'Wherein shall we return?'
  - where: 'section “The question”'
    claim: 'Exchange at 3:8: “Wherein have we robbed thee?”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/3?lang=eng'
    quote: 'Wherein have we robbed thee?'
  - where: 'section “The question”'
    claim: 'Exchange at 2:17: “Wherein have we wearied him?” (six “Wherein” replies in the King James text of Malachi: 1:2, 1:6, 1:7, 2:17, 3:7, 3:8, by occurrences.mjs)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/2?lang=eng'
    quote: 'Wherein have we wearied him?'
  - where: 'section “The question”'
    claim: 'Connection made by this page: the people’s “Where is the God of judgment?” (2:17) set beside the Lord’s questions to the priests, “where is mine honour?… where is my fear?” (1:6); what joins them is the Hebrew “where” (ʾayyēh), in Malachi only in these two verses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/1?lang=eng'
    quote: 'where is mine honour? and if I be a master, where is my fear?'
  - where: 'section “The question”'
    claim: 'The people’s question at 2:17 (the other side of the comparison with 1:6)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/2?lang=eng'
    quote: 'Where is the God of judgment?'
  - where: 'section “The question”'
    claim: 'Hebrew “where” (ʾayyēh) at 1:6 (twice)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'אַיֵּ֣ה'
  - where: 'section “The question”'
    claim: 'Hebrew “where” (ʾayyēh) at 1:6 (second)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'אַיֵּ֨ה'
  - where: 'section “The question”'
    claim: 'Hebrew “where” (ʾayyēh) at 2:17; Malachi has it in only these two verses (fresh script: 3 occurrences in 2 verses)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'אַיֵּ֖ה'
  - where: 'section “The Lord, whom ye seek, shall suddenly come”'
    claim: '3:1 is read as the answer to the question of 2:17'
    key: pike-great-dreadful-day
    url: 'https://byustudies.byu.edu/article/the-great-and-dreadful-day-of-the-lord-the-anatomy-of-an-expression'
    quote: 'Malachi depicts the people of his day asking, “Where is the God of judgment?” (2:17). The answer: “The Lord, whom ye seek, shall suddenly come to his temple” (3:1).'
  - where: 'section “The Lord, whom ye seek, shall suddenly come”'
    claim: 'Older commentary: the Lord replies to the question “Where is the God of judgment?” that He will suddenly come to His temple'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/3.htm'
    quote: 'To the question, Where is or remains the God of judgment? the Lord Himself replies that He will suddenly come to His temple'
  - where: 'section “The Lord, whom ye seek, shall suddenly come”'
    claim: 'Hebrew “delighteth” (2:17) is the verb of the root'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'חָפֵ֔ץ'
  - where: 'section “The Lord, whom ye seek, shall suddenly come”'
    claim: 'Hebrew “delight in” (3:1) is the adjective of the same root; the only two in Malachi with this root as “delight”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'חֲפֵצִים֙'
  - where: 'section “The Lord, whom ye seek, shall suddenly come”'
    claim: 'BDB lists Mal. 2:17 under the verb “delight in, have pleasure in”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2654.htm'
    quote: 'in doing evil Malachi 2:17'
  - where: 'section “The Lord, whom ye seek, shall suddenly come”'
    claim: 'BDB: the word in Mal. 3:1 is the verbal adjective of that verb, “delighting in”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2655.htm'
    quote: 'verbal adjective delighting in, having pleasure in'
  - where: 'section “The Lord, whom ye seek, shall suddenly come”'
    claim: 'BDB lists the plural at Mal. 3:1 under the verbal adjective'
    key: bdb
    url: 'https://biblehub.com/hebrew/2655.htm'
    quote: 'plural חֲפֵצִים Malachi 3:1'
  - where: 'section “I will come near to you to judgment”'
    claim: 'Hebrew “judgment” (mishpat) at 2:17'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'הַ/מִּשְׁפָּֽט'
  - where: 'section “I will come near to you to judgment”'
    claim: 'Hebrew “judgment” at 3:5'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'לַ/מִּשְׁפָּט֒'
  - where: 'section “I will come near to you to judgment”'
    claim: 'Hebrew “judgments” at 4:4; Malachi has the noun in these three verses only'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'וּ/מִשְׁפָּטִֽים'
  - where: 'section “The complaint again”'
    claim: 'The Church edition’s footnote on “judgment” in 2:17 points to Mal. 3:14 (14–15)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/2?lang=eng'
    quote: '17b “judgment”: Mal. 3:14 (14–15); 2 Ne. 28:22 (16–22).'
  - where: 'section “Those who feared the LORD”'
    claim: 'Hebrew “serve” at 3:14'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'עֲבֹ֣ד'
  - where: 'section “Those who feared the LORD”'
    claim: 'Hebrew “serveth” at 3:17 (same verb)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'הָ/עֹבֵ֥ד'
  - where: 'section “Those who feared the LORD”'
    claim: 'Hebrew “serveth” at 3:18 (same verb; four occurrences in three verses)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'עֹבֵ֣ד'
  - where: 'section “Those who feared the LORD”'
    claim: 'President Romney: some in Malachi’s day argued that it was vain to serve God (3:14–15); against this he sets the book of remembrance'
    key: romney-trust-1979
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1979/04/trust-in-the-lord?lang=eng'
    quote: 'They argued that it was unprofitable and vain to serve God because, as they saw it, the proud were made happy, the wicked set up, and they that tempted God were delivered (see Mal. 3:14–15).'
  - where: 'section “Those who feared the LORD”'
    claim: 'The same address then quotes 3:17–18 and 4:1–2 in one run'
    key: romney-trust-1979
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1979/04/trust-in-the-lord?lang=eng'
    quote: '“But,” says the Lord in a glorious promise to the righteous, “unto you that fear my name shall the Sun of righteousness arise with healing in his wings; and ye shall go forth, and grow up as calves of the stall.” (Mal. 3:17–18; 4:1–2.)'
  - where: 'section “The day”'
    claim: 'Hebrew “the proud” at 3:15; Malachi has it only in 3:15 and 4:1'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'זֵדִ֑ים'
  - where: 'section “The day”'
    claim: 'Hebrew “the proud” at 4:1'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'זֵדִ֜ים'
  - where: 'section “The day”'
    claim: 'Hebrew “they that work wickedness” at 3:15 (ʿosei rishʿah)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'עֹשֵׂ֣י'
  - where: 'section “The day”'
    claim: 'Hebrew “that do wickedly” at 4:1 (ʿoseh rishʿah), the same two words'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'עֹשֵׂ֤ה'
  - where: 'section “The day”'
    claim: 'Older commentary: the words in 4:1 point back to 3:15'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/4.htm'
    quote: 'זדים and עשׂה רשׁעה point back to Malachi 3:15.'
  - where: 'section “The Sun of righteousness”'
    claim: '“The Messenger of the covenant, Mal. 3:1” is among the names of Christ'
    key: bd-christ-names
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/christ-names-of?lang=eng'
    quote: 'the Messenger of the covenant, Mal. 3:1'
  - where: 'section “The Sun of righteousness”'
    claim: '“The Sun of righteousness” is Jesus Christ'
    key: seminary-ot-2018-160
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-material-2018/malachi/lesson-160?lang=eng'
    quote: 'Explain that “the Sun of righteousness” (verse 2) is Jesus Christ.'
  - where: 'section “The Sun of righteousness”'
    claim: '3 Ne. 25:2 reads “Son of Righteousness”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/25?lang=eng'
    quote: 'But unto you that fear my name, shall the Son of Righteousness arise with healing in his wings'
  - where: 'section “The Sun of righteousness”'
    claim: 'The Savior gave Malachi’s words to the Nephites'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/24?lang=eng'
    quote: 'And it came to pass that he commanded them that they should write the words which the Father had given unto Malachi'
  - where: 'section “The Sun of righteousness”'
    claim: '2 Ne. 26:9 reads “Son of Righteousness”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/26?lang=eng'
    quote: 'But the Son of Righteousness shall appear unto them; and he shall heal them'
  - where: 'section “The Sun of righteousness”'
    claim: 'Hebrew “sun” in Malachi 4:2 is shemesh'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'שֶׁ֣מֶשׁ'
  - where: 'section “The Sun of righteousness”'
    claim: 'Malachi 3–4 read as answering “who may abide the day of his coming?”'
    key: sc-knowhy-218
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-give-the-nephites-malachis-prophecies'
    quote: 'Malachi 3–4 (3 Nephi 24–25) provides answers to this question.'
