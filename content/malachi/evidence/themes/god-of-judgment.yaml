page: god-of-judgment
claims:
  - where: 'section “The question”'
    claim: 'On one reading, the evildoers of 2:17 are the prosperous heathen, and the question asks why God does not punish them'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/2.htm'
    quote: 'By עשׂה רע the murmurers mean, not notorious sinners in their midst, but the heathen who enjoyed undisturbed prosperity.'
  - where: 'section “The question”'
    claim: 'The question amounts to why God does not punish the heathen'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/2.htm'
    quote: 'why does not God punish the ungodly heathen?'
  - where: 'section ““The Lord, whom ye seek, shall suddenly come””'
    claim: 'The Lord Himself replies to the question of 2:17 that He will suddenly come to His temple'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/3.htm'
    quote: 'To the question, Where is or remains the God of judgment? the Lord Himself replies that He will suddenly come to His temple'
  - where: 'section ““The Lord, whom ye seek, shall suddenly come””'
    claim: 'The messenger of the covenant is among the Old Testament names of Jesus Christ'
    key: bd-christ-names
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/christ-names-of?lang=eng'
    quote: 'Names, titles, and concepts of the Lord Jesus in the Old Testament'
  - where: 'section ““The Lord, whom ye seek, shall suddenly come””'
    claim: 'The messenger of the covenant (Mal. 3:1) is listed'
    key: bd-christ-names
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/christ-names-of?lang=eng'
    quote: 'the Messenger of the covenant, Mal. 3:1'
  - where: 'section ““The Lord, whom ye seek, shall suddenly come””'
    claim: 'The judgment that comes is not on the heathen but on the godless members of the covenant nation'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/3.htm'
    quote: 'With the coming of the Lord the judgment will also begin; not the judgment upon the heathen, however, for which the ungodly nation was longing, but the judgment upon the godless members of the covenant nation.'
  - where: 'section ““The Lord, whom ye seek, shall suddenly come””'
    claim: 'The judgment of 3:5 is threatened against those who wanted judgment in 2:17'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/3.htm'
    quote: 'This judgment is threatened against those who wanted the judgment of God to come, according to Malachi 2:17.'
  - where: 'section ““The Lord, whom ye seek, shall suddenly come””'
    claim: '“Swift” answers the complaint that judgment was delayed'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/3.htm'
    quote: 'the Lord will come with unexpected rapidity, in contrast with the murmuring of the people at the delay of judgment (Malachi 2:17).'
  - where: 'section ““It is vain to serve God””'
    claim: 'The feelings of 2:17 and 3:13 were held by the great mass of the people, not by all'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/2.htm'
    quote: 'the feelings expressed in Malachi 2:17 and Malachi 3:13 were not cherished by the whole nation without exception, but only by the great mass of the people'
  - where: 'section ““It is vain to serve God””'
    claim: 'Text of Mal. 3:16–18: the book of remembrance, “they shall be mine,” and the discerning between him that serveth God and him that serveth him not'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/3?lang=eng'
    quote: 'Then shall ye return, and discern between the righteous and the wicked, between him that serveth God and him that serveth him not.'
  - where: 'section ““It is vain to serve God””'
    claim: 'The Lord shows the murmuring of 3:13–15 to be unjust, and the coming day of judgment will bring to light the distinction between the wicked and those who fear God'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/3.htm'
    quote: 'He shows them still further, that their murmuring against Him is unjust, and that the coming day of judgment will bring to light the distinction between the wicked and those who fear God.'
  - where: 'section “The day”'
    claim: 'Text of Mal. 4:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/4?lang=eng'
    quote: 'all the proud, yea, and all that do wickedly, shall be stubble: and the day that cometh shall burn them up'
  - where: 'section “The day”'
    claim: '“The proud” and “do wickedly” of 4:1 point back to 3:15, so the murmurers themselves are consumed'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/4.htm'
    quote: 'זדים and עשׂה רשׁעה point back to Malachi 3:15. Those who are called blessed by the murmuring nation will be consumed by the fire, as stubble is burned up, and indeed all who do wickedness, and therefore the murmurers themselves.'
  - where: 'section “The day”'
    claim: 'D&C 133:64 quotes Mal. 4:1 as written by Malachi'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/133?lang=eng'
    quote: 'And also that which was written by the prophet Malachi: For, behold, the day cometh that shall burn as an oven'
  - where: 'section “The day”'
    claim: 'D&C 64:24 uses the words of Mal. 4:1 of “tomorrow”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/64?lang=eng'
    quote: 'tomorrow all the proud and they that do wickedly shall be as stubble'
  - where: 'section “The day”'
    claim: 'Text of Mal. 4:2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/4?lang=eng'
    quote: 'But unto you that fear my name shall the Sun of righteousness arise with healing in his wings'
  - where: 'section “The day”'
    claim: 'When the Savior gave the verse to the Nephites it read “Son of Righteousness”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/25?lang=eng'
    quote: 'unto you that fear my name, shall the Son of Righteousness arise with healing in his wings'
  - where: 'section “The day”'
    claim: 'Nephi used the title “Son of Righteousness” of the Savior’s coming to his people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/26?lang=eng'
    quote: 'But the Son of Righteousness shall appear unto them; and he shall heal them'
  - where: 'section “The day”'
    claim: 'Mal. 4:2 is listed among the Old Testament names of Christ, with “the Lord our Righteousness”'
    key: bd-christ-names
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/christ-names-of?lang=eng'
    quote: 'the Lord our Righteousness, Jer. 23:6; 33:16; Mal. 4:2'
  - where: 'section “The day”'
    claim: 'One commentary (differing from the Book of Mormon reading) takes the sun of righteousness impersonally, though the early writers understood Christ'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/4.htm'
    quote: 'But in the verse before us the context does not sustain the personal view, but simply the idea that righteousness itself is regarded as a sun.'
  - where: 'section “The day”'
    claim: 'The early writers understood the sun of righteousness as Christ'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/4.htm'
    quote: 'By the sun of righteousness the fathers, from Justin downwards, and nearly all the earlier commentators understand Christ'
  - where: 'section “Who may abide”'
    claim: 'The risen Lord had the Nephites write Malachi’s words and expounded them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/24?lang=eng'
    quote: 'he commanded them that they should write the words which the Father had given unto Malachi, which he should tell unto them. And it came to pass that after they were written he expounded them.'
  - where: 'section “Who may abide”'
    claim: 'Malachi 3–4 (3 Nephi 24–25) answers the question of 3:2, who may abide'
    key: sc-knowhy-218
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-give-the-nephites-malachis-prophecies'
    quote: 'Malachi 3–4 (3 Nephi 24–25) provides answers to this question.'
  - where: 'section “Who may abide”'
    claim: 'One commentary reads “who may abide?” as rhetorical, “no one endures it,” spoken to the ungodly'
    key: keil-malachi
    url: 'https://biblehub.com/commentaries/kad/malachi/3.htm'
    quote: 'The question “who endures the day” has a negative meaning, like מי in Isaiah 53:1 : no one endures it (for the fact itself compare Joel 2:11). The prophet is speaking to the ungodly.'
  - where: 'section “Who may abide”'
    claim: 'Pike reads Mal. 3:2–3 as a promise that faithful Israelites may abide the day if they endure refining'
    key: pike-great-dreadful-day
    url: 'https://byustudies.byu.edu/article/the-great-and-dreadful-day-of-the-lord-the-anatomy-of-an-expression'
    quote: 'The Lord here promises faithful Israelites, including the sons of Levi, that they “may abide the day of his coming” if they successfully endure refining and purifying'
  - where: 'section “Who may abide”'
    claim: 'D&C 38:8 says who shall not abide the day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/38?lang=eng'
    quote: 'he that is not purified shall not abide the day.'
  - where: 'section “Who may abide”'
    claim: 'D&C 45:57 says who shall abide the day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'they that are wise and have received the truth, and have taken the Holy Spirit for their guide, and have not been deceived—verily I say unto you, they shall not be hewn down and cast into the fire, but shall abide the day.'
  - where: 'section “Who may abide”'
    claim: 'D&C 128:24 quotes Mal. 3:2–3 and answers with an offering in righteousness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/128?lang=eng'
    quote: 'who can abide the day of his coming, and who can stand when he appeareth? For he is like a refiner’s fire … Let us, therefore, as a church and a people, and as Latter-day Saints, offer unto the Lord an offering in righteousness'
  - where: 'section “Who may abide”'
    claim: 'Romney: a book of remembrance is written today as in Malachi’s day'
    key: romney-trust-1979
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1979/04/trust-in-the-lord?lang=eng'
    quote: 'today, as well as in the days of Malachi, a book of remembrance is written before the Lord for those that fear him and think upon his name'
  - where: 'section “Who may abide”'
    claim: 'D&C 87:8: stand in holy places until the day of the Lord come'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/87?lang=eng'
    quote: 'stand ye in holy places, and be not moved, until the day of the Lord come'
  - where: 'section “Who may abide”'
    claim: 'The Church edition cross-references “mine” in Mal. 3:17 to D&C 101:3, which gives the promise again'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng'
    quote: 'Yet I will own them, and they shall be mine in that day when I shall come to make up my jewels.'
