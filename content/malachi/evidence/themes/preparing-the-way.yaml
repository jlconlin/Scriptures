page: preparing-the-way
claims:
  - where: 'section “The priest, a messenger”'
    claim: '“Messenger” in 2:7 is glossed “teacher, tool, representative”'
    key: ot-manual-34
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-34?lang=eng'
    quote: 'He is the messenger [teacher, tool, representative] of the Lord of hosts” (v. 7).'
  - where: 'section “The priest, a messenger”'
    claim: 'The Hebrew word malʾak is the “messenger” of 2:7 (and “my messenger” of 3:1)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'מַלְאַ֥ךְ'
  - where: 'section “The priest, a messenger”'
    claim: 'Same word in 3:1: “my messenger”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'מַלְאָכִ֔'
  - where: 'section “The priest, a messenger”'
    claim: 'The name Malachi means “my messenger”'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'The name Malachi means “my messenger” in Hebrew.'
  - where: 'section “My messenger”'
    claim: '“Prepare the way” in Mal. 3:1 uses the same verb and noun as Isa. 40:3'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'פִנָּה'
  - where: 'section “My messenger”'
    claim: 'Isa. 40:3 has the same verb (panah) and noun (derek)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'פַּנּ֖וּ'
  - where: 'section “My messenger”'
    claim: 'Matthew 11:10 reads “before thy face” where Malachi has “before me”; Jesus applies it to John'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/11?lang=eng'
    quote: 'For this is he, of whom it is written, Behold, I send my messenger before thy face, which shall prepare thy way before thee.'
  - where: 'section “My messenger”'
    claim: 'John fulfilled the prophecy; Joseph Smith was sent to prepare the way for the Second Coming'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'The Savior declared that John the Baptist fulfilled this prophecy by preparing the way before Christ’s mortal ministry. In our dispensation, the Prophet Joseph Smith was sent as a messenger to prepare the way for the Savior’s Second Coming.'
  - where: 'section “The Lord Himself”'
    claim: '“Messenger of the covenant” is a title of Jesus Christ with multiple fulfillments (Kirtland, Second Coming)'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: '“Messenger of the covenant” is a title of Jesus Christ.'
  - where: 'section “The Lord Himself”'
    claim: 'The prophecy likely has multiple fulfillments, including April 3, 1836 and the Second Coming'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'likely has multiple fulfillments. For example, on April 3, 1836, the Savior suddenly appeared to Joseph Smith and Oliver Cowdery in the Kirtland Temple. It will also likely be further fulfilled as part of the events associated with the Second Coming of Jesus Christ.'
  - where: 'section “The Lord Himself”'
    claim: 'The Bible Dictionary lists the Messenger of the covenant among the names of Jesus'
    key: bd-christ-names
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/christ-names-of?lang=eng'
    quote: 'the Messenger of the covenant, Mal. 3:1'
  - where: 'section “The Lord Himself”'
    claim: 'Jesus had the Nephites write Malachi’s words, including 3:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/24?lang=eng'
    quote: 'Thus said the Father unto Malachi—Behold, I will send my messenger, and he shall prepare the way before me'
  - where: 'section “Elijah, before the day”'
    claim: 'Connection made by this page: the verb “turn” (heshiv) is the same in 2:6 (Levi) and 4:6 (Elijah); both are set beside each other'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/2?lang=eng'
    quote: 'and did turn many away from iniquity'
  - where: 'section “Elijah, before the day”'
    claim: 'Connection made by this page: Elijah “shall turn the heart of the fathers to the children”, same verb as Levi in 2:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/4?lang=eng'
    quote: 'And he shall turn the heart of the fathers to the children'
  - where: 'section “Elijah, before the day”'
    claim: 'The Hebrew verb is the same in 2:6'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'הֵשִׁ֥יב'
  - where: 'section “Elijah, before the day”'
    claim: 'The Hebrew verb is the same in 4:6'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'הֵשִׁ֤יב'
  - where: 'section “Elijah, before the day”'
    claim: '“I will send” (sholeach) is the same form in 3:1 and 4:5'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'שֹׁלֵחַ'
  - where: 'section “Elijah, before the day”'
    claim: 'Elias is a title for a forerunner; two Eliases, a preparer and a restorer'
    key: bd-elias
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elias?lang=eng'
    quote: 'anciently two Eliases were spoken of, one as a preparer and the other a restorer.'
  - where: 'section “Elijah, before the day”'
    claim: 'John served as an Elias in partial fulfillment'
    key: alford-elijah
    url: 'https://rsc.byu.edu/you-shall-have-my-word/i-will-send-you-elijah-prophet'
    quote: 'John the Baptist, serving as the forerunner of the Messiah, most certainly served as an Elias—in partial, but not complete, fulfillment of Malachi’s prophecy.'
  - where: 'section “Elijah, before the day”'
    claim: 'The site’s note at Mal. 4:5 treats Elijah, Elias and John the Baptist'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/4?lang=eng'
    quote: 'Behold, I will send you Elijah the prophet before the coming of the great and dreadful day of the LORD:'
  - where: 'section “The Lord and Elijah at Kirtland”'
    claim: 'Elijah and Moses and Elias came after the Lord appeared'
    key: gong-hosanna-hallelujah
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/04/31gong?lang=eng'
    quote: 'Following the appearance of Jesus Christ, Moses, Elias, and Elijah also came.'
  - where: 'section “The Lord and Elijah at Kirtland”'
    claim: 'Elijah’s return was fulfilled in our dispensation; the sealing power restored by Elijah seals families'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'Malachi’s prophecy that Elijah would return to the earth before the Second Coming was fulfilled in our dispensation.'
  - where: 'section “The Lord and Elijah at Kirtland”'
    claim: 'The sealing power seals families eternally '
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'President Russell M. Nelson explained that the sealing power restored by Elijah “authorized Joseph Smith—and all succeeding Presidents of the Lord’s Church—to … place a ratifying seal on priesthood ordinances and covenants, and to seal families eternally.”'
  - where: 'section “The Lord and Elijah at Kirtland”'
    claim: 'Elijah conferred the keys in preparation for the coming of the Lord'
    key: bd-elijah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elijah?lang=eng'
    quote: 'conferred the same keys upon Joseph Smith and Oliver Cowdery. All of this was in preparation for the coming of the Lord, as spoken of in Mal. 4:5–6'
