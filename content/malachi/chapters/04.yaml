    note: The Savior gives the Nephites all of Malachi 4 in the King James words, with “Son of Righteousness” and “calves in the stall” in verse 2.
    primary: true
  - ref: JS—H 1:37–39
    note: Moroni’s wording of verses 1, 5, and 6 as Joseph Smith recorded it; the same words of verses 5–6 are in [[D&C 2]].
  - ref: D&C 110:13–16
