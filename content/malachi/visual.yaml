summary: >-
  Malachi calls returned covenant people to faithful offerings, promises the Lord's
  coming to His temple, and closes with covenant hearts turning across generations.
motifs:
  - A modest offering of grain, olive oil, and firstfruits at a stone storehouse.
  - A warm, restrained refiner's fire glowing from within a small stone hearth.
  - A restored temple city on a distant hill.
  - A living orchard branch joining an old trunk to young shoots.
composition: >-
  A restored temple rises as the central focal point over a quiet valley. Faithful
  offerings and a small refiner's hearth rest low in the foreground, while a natural
  old-to-young branch frames the scene; the fire is contemplative, never a spectacle.
asset: /assets/malachi-book-art.png
alt: A temple rises over a valley while grain, fruit, coins, and a small glowing hearth rest in the foreground.
status: approved
