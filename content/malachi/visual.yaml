summary: >-
  Malachi calls returned covenant people to faithful offerings, promises the Lord's
  coming to His temple, and closes with covenant hearts turning across generations.
motifs:
  - A restored temple on a hill above Jerusalem, lit by a low sun.
  - A small refiner's fire glowing within a stone hearth.
  - A modest offering of grain, fruit, and coins on a stone wall.
composition: >-
  The temple rises as the central focal point over a quiet valley of olive trees and
  cypresses. The hearth and the offering rest low in the left foreground, and an old
  olive tree frames that side; the fire is contemplative, never a spectacle.
# “What's in this picture” under the image on the book page: one line for each thing, with the verse it shows.
key:
  - '**The temple on the hill** is the Lord’s promise: “the Lord, whom ye seek, shall suddenly come to his temple” ([[Mal. 3:1]]).'
  - '**The small fire in the stone hearth** is the refiner: “he is like a refiner’s fire,” and “he shall sit as a refiner and purifier of silver” ([[Mal. 3:2–3]]).'
  - '**The grain, fruit and coins on the wall** are the offerings the Lord asks of His people: “Bring ye all the tithes into the storehouse” ([[Mal. 3:10]]).'
