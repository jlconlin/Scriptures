    url: 'https://www.churchofjesuschrist.org/study/history/topics/martin-harriss-consultations-with-scholars?lang=eng'
    quote: 'Some accounts suggest the Lord had commanded Harris to make the trip, while others point to Joseph Smith or Harris himself as the instigator. Harris may have hoped the endorsement of scholars would satisfy his wife Lucy, who had grown skeptical'
  - where: 'note 1:61 “Martin Harris”'
    claim: 'Neither knew much of the language; Harris possibly sought scholars of American antiquities'
    key: cht-harris-scholars
    url: 'https://www.churchofjesuschrist.org/study/history/topics/martin-harriss-consultations-with-scholars?lang=eng'
    quote: 'neither Joseph Smith nor Harris appear to have known much about the language on the plates. … it is possible that Harris sought the advice of scholars with expertise in American antiquities.'
  - where: 'note 1:61 “Martin Harris”'
    claim: 'Samuel L. Mitchill, linguist and scholar of ancient America; Anthon, young professor at Columbia'
