    quote: 'perhaps it was the subsequent instruction to join no sect anywhere (“for they were all wrong”) that would have been surprising; in that case, this latter possibility was the one that had never entered into his heart.'
  - where: 'note 1:18 ““It had never entered into my heart that all were wrong””'
