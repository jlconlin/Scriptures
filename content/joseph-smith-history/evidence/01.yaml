  # ---- note 1:19 ----
  - where: 'note 1:19 ““All their creeds were an abomination””'
    claim: 'Creed from credo; New Testament has short personal testimonies, no creed like later ones'
    key: sc-knowhy-773
    url: 'https://scripturecentral.org/knowhy/why-did-christ-call-the-creeds-an-abomination'
    quote: 'the word creed comes from the Latin credo, which means “I believe.” … in the New Testament, no credal statement can be found that is fundamentally analogous to the creeds that arose in the following centuries.'
  - where: 'note 1:19 ““All their creeds were an abomination””'
    claim: 'Welch’s three stages'
    key: sc-knowhy-773
    url: 'https://scripturecentral.org/knowhy/why-did-christ-call-the-creeds-an-abomination'
    quote: 'Welch has identified a three-stage overview of creedalism … (1) Initially, the gospel was taught by Jesus in plainness, (2) over time, incorrect ideas and doctrines came to be taught, and (3) eventually, many new creeds were made and adopted that purposefully set certain congregations apart from others.'
  - where: 'note 1:19 ““All their creeds were an abomination””'
    claim: 'Early creeds largely unobjectionable'
    key: sc-knowhy-773
    url: 'https://scripturecentral.org/knowhy/why-did-christ-call-the-creeds-an-abomination'
    quote: 'the contents of these initial creeds (such as the Apostles’ Creed) “remained largely unobjectionable from a Latter-day Saint point of view.”'
  - where: 'note 1:19 ““All their creeds were an abomination””'
    claim: 'Latter-day Saints should not condemn all creeds equally'
    key: welch-creeds
    url: 'https://rsc.byu.edu/prelude-restoration/all-their-creeds-were-abomination'
    quote: 'Latter-day Saints should not condemn all creeds equally, for all creeds were not created equal. Yet even the early creeds began to sow seeds that would in time spawn more debilitating problems.'
  - where: 'note 1:19 ““All their creeds were an abomination””'
    claim: 'Joseph Smith, 15 October 1843: cannot believe in the creeds, though all have some truth'
    key: jsp-history-e1
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-e-1-1-july-1843-30-april-1844/126'
    quote: 'I cannot believe in any of the creeds of the different denominations, because they all have some things in them I cannot subscribe to, though all of them have some truth.'
  - where: 'note 1:19 ““All their creeds were an abomination””'
    claim: 'The creeds set up stakes'
    key: jsp-history-e1
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-e-1-1-july-1843-30-april-1844/127'
    quote: 'but the creeds set up stakes, and say hitherto shalt thou come, and no further; which I cannot subscribe to.'
  - where: 'note 1:19 ““All their creeds were an abomination””'
    claim: 'The verse’s quotation draws on Isaiah 29:13 and 2 Timothy 3:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-h/1?lang=eng'
    quote: '19d “draw near”: Isa. 29:13 … 19g “power”: 2 Tim. 3:5.'
  - where: 'note 1:19 ““All their creeds were an abomination””'
    claim: 'The 1832 account has the same charge'
    key: js-history-1832
    url: 'https://www.josephsmithpapers.org/paper-summary/history-circa-summer-1832/3'
    quote: 'they draw near to me with their lips while their hearts are far from me and mine anger is kindling against the inhabitants of the eart'
  - where: 'note 1:19 ““All their creeds were an abomination””'
    claim: 'The 1842 account: denominations believing incorrect doctrines'
    key: jsp-church-history-1842
    url: 'https://www.josephsmithpapers.org/paper-summary/church-history-1-march-1842/2'
    quote: 'They told me that all religious denominations were believing in incorrect doctrines, and that none of them was acknowledged of God as his church and kingdom.'

  # ---- note 1:21 ----
  - where: 'note 1:21 “The Methodist preacher”'
    claim: 'Joseph did not name him; not clear whether George Lane or a local minister'
    key: harper-three-arguments
    url: 'https://rsc.byu.edu/exploring-first-vision/evaluating-three-arguments-against-joseph-smiths-first-vision'
    quote: 'Joseph did not name the minister to whom he reported the vision. It’s not clear whether it was the Reverend George Lane … There were also local Methodist ministers to whom Joseph may have reported his experience.'
  - where: 'note 1:21 “The Methodist preacher”'
    claim: 'Methodism tending toward respectable, reasonable religion; Wesley’s “dead sect” fear'
    key: harper-three-arguments
    url: 'https://rsc.byu.edu/exploring-first-vision/evaluating-three-arguments-against-joseph-smiths-first-vision'
    quote: 'All of them were conscious that Methodism was tending away from the kind of spiritual experiences Joseph described and toward what they viewed as a more respectable, reasonable religion. John Wesley, the founder of Methodism, had worried that Methodists would multiply exponentially in number only to become “a dead sect, having the form of religion without the power.”'
  - where: 'note 1:21 “The Methodist preacher”'
    claim: 'Enthusiasm meant being thought unstable and irrational; the preacher may have reacted to the part about professors denying God’s power'
    key: harper-three-arguments
    url: 'https://rsc.byu.edu/exploring-first-vision/evaluating-three-arguments-against-joseph-smiths-first-vision'
    quote: 'he may have heard messages in Joseph’s story in ways that led him to respond negatively, especially if Joseph told him the part about learning that religious professors spoke well of God but denied his power. … It meant that one was perceived as mentally unstable and irrational.'
  - where: 'note 1:21 “The Methodist preacher”'
    claim: 'Joseph had caught a spark of Methodism, felt the power in the woods, and expected welcome news'
    key: harper-three-arguments
    url: 'https://rsc.byu.edu/exploring-first-vision/evaluating-three-arguments-against-joseph-smiths-first-vision'
    quote: 'He finally experienced that power in the woods, as so many Methodist converts, encouraged by their preachers, appeared to have done before him. So it was shocking to him when the minister reacted against what Joseph assumed would be welcome news.'

