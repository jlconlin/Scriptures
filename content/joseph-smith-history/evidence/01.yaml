    claim: 'Mormon 8:14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/morm/8?lang=eng'
    quote: 'the plates thereof are of no worth, because of the commandment of the Lord. For he truly saith that no one shall have them to get gain; but the record thereof is of great worth'

  # ---- note 1:54 ----
  - where: 'note 1:54 “Four years of instruction”'
    claim: 'The four years were not simply time to pass; he was to prove faithful'
    key: harper-probation
    url: 'https://rsc.byu.edu/coming-forth-book-mormon/probation-teenage-seer-joseph-smiths-early-experiences-moroni'
    quote: 'Joseph was not simply to pass time until he got the plates regardless of his behavior.'
  - where: 'note 1:54 “Four years of instruction”'
    claim: 'He was to prepare by keeping the commandments and gaining strength to resist temptation'
    key: harper-probation
    url: 'https://rsc.byu.edu/coming-forth-book-mormon/probation-teenage-seer-joseph-smiths-early-experiences-moroni'
    quote: 'He was to prepare himself by gaining experience in keeping the commandments of God and gaining strength to resist temptations; he was to prove himself faithful to the Lord’s instructions and get the plates because of his obedience.'
  - where: 'note 1:54 “Four years of instruction”'
    claim: 'The four years mixed visitations, opposition and family responsibilities; Moroni mentored him'
    key: harper-probation
    url: 'https://rsc.byu.edu/coming-forth-book-mormon/probation-teenage-seer-joseph-smiths-early-experiences-moroni'
    quote: 'Joseph’s four-year probation was characterized not only by divine visitations and adversarial interferences, but also by the vicissitudes of everyday family responsibilities … God, largely through the angel Moroni, mentored Joseph'
  - where: 'note 1:54 “Four years of instruction”'
    claim: 'Moroni showed him the two powers so he would know them hereafter'
    key: saints-v1-03
    url: 'https://www.churchofjesuschrist.org/study/history/saints-v1/03-plates-of-gold?lang=eng'
    quote: '“All this is shown, the good and the evil, the holy and impure, the glory of God and the power of darkness,” the angel declared, “that you may know hereafter the two powers and never be influenced or overcome by that wicked one.”'
  - where: 'note 1:54 “Four years of instruction”'
    claim: 'On a later visit he set the plates down to cover the box, and they vanished; the instruction to go straight home'
    key: saints-v1-03
    url: 'https://www.churchofjesuschrist.org/study/history/saints-v1/03-plates-of-gold?lang=eng'
    quote: '“You must take them into your hands and go straight to the house without delay,” the angel had said, “and lock them up.”'
  - where: 'note 1:54 “Four years of instruction”'
    claim: 'He set the plates down to cover the box; they were gone'
    key: saints-v1-03
    url: 'https://www.churchofjesuschrist.org/study/history/saints-v1/03-plates-of-gold?lang=eng'
    quote: 'He set the plates down and turned to cover the box. But when he returned to the plates, they were gone.'
  - where: 'note 1:54 “Four years of instruction”'
    claim: 'At twenty-one he received the plates, having overcome many temptations and repented of others'
    key: harper-probation
    url: 'https://rsc.byu.edu/coming-forth-book-mormon/probation-teenage-seer-joseph-smiths-early-experiences-moroni'
    quote: 'That night Moroni entrusted the plates to Joseph, now age twenty-one. … He had faced difficult temptations, overcoming many and repenting when he fell to others.'
  # ---- Part 3 (verses 55–75), christ, explore ----
  - where: 'note 1:56 “Alvin”'
    claim: 'Alvin, born 1798, the first child to survive infancy, labored for the family and led in building the frame home'
    key: cht-smith-family
    url: 'https://www.churchofjesuschrist.org/study/history/topics/joseph-sr-and-lucy-mack-smith-family?lang=eng'
    quote: 'The Smith family’s first child to live past infancy, Alvin, was born on February 11, 1798 … Alvin’s labor became critical to the family’s temporal support, and he led out in building a frame home on the Smith farm.'
  - where: 'note 1:56 “Alvin”'
    claim: 'Alvin believed Joseph; Moroni told Joseph to bring Alvin; calomel worsened his illness and he died within days'
    key: cht-smith-family
    url: 'https://www.churchofjesuschrist.org/study/history/topics/joseph-sr-and-lucy-mack-smith-family?lang=eng'
    quote: 'Alvin believed in Joseph’s account of the appearance of the angel Moroni and encouraged him to follow the angel’s instructions. According to a family friend, Moroni even instructed Joseph to bring Alvin with him when the time came to obtain the Book of Mormon plates.'
  - where: 'note 1:56 “Alvin”'
    claim: 'Calomel, a mercury compound many physicians considered toxic, aggravated his condition; he died within days'
    key: cht-smith-family
    url: 'https://www.churchofjesuschrist.org/study/history/topics/joseph-sr-and-lucy-mack-smith-family?lang=eng'
    quote: 'The doctor who tended to Alvin administered a compound of mercury and chlorine called “calomel,” a remedy considered toxic by many physicians at the time … The treatment aggravated Alvin’s condition, and Alvin perished within days.'
  - where: 'note 1:56 “Alvin”'
    claim: 'The funeral minister implied Alvin was in hell for want of baptism; 1836 vision; Hyrum baptized for him'
    key: cht-smith-family
    url: 'https://www.churchofjesuschrist.org/study/history/topics/joseph-sr-and-lucy-mack-smith-family?lang=eng'
    quote: 'At his funeral, a local minister upset the family by implying Alvin was consigned to hell because he had not been baptized. In 1836, Joseph experienced a vision of the celestial kingdom … his brother Hyrum was baptized for Alvin in the Mississippi River.'
  - where: 'note 1:56 “Alvin”'
    claim: 'Alvin fell ill less than two months after Moroni’s visit'
    key: saints-v1-03
    url: 'https://www.churchofjesuschrist.org/study/history/saints-v1/03-plates-of-gold?lang=eng'
    quote: 'Then one autumn morning, less than two months after Moroni’s visit, Alvin came home with an intense pain in his stomach.'
  - where: 'note 1:56 “Alvin”'
    claim: 'Alvin’s dying charge to Joseph'
    key: saints-v1-03
    url: 'https://www.churchofjesuschrist.org/study/history/saints-v1/03-plates-of-gold?lang=eng'
    quote: 'Knowing he would probably die, he called for Joseph. “Do everything that lies in your power to obtain the records,” Alvin said.'
  - where: 'note 1:56 “Alvin”'
    claim: 'The vision of D&C 137 came in the Kirtland Temple, January 1836'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/137?lang=eng'
    quote: 'A vision given to Joseph Smith the Prophet, in the temple at Kirtland, Ohio, January 21, 1836.'
  - where: 'note 1:56 “Alvin”'
    claim: 'In September 1826 Moroni asked him to bring someone; Alvin was dead'
    key: saints-v1-04
    url: 'https://www.churchofjesuschrist.org/study/history/saints-v1/04-be-watchful?lang=eng'
    quote: 'The angel also told him to bring someone with him next time. It was the same request he had made at the end of Joseph’s first visit to the hill. But since Alvin was dead, Joseph was confused.'
  - where: 'note 1:56 “Alvin”'
    claim: 'The right person was Emma'
    key: saints-v1-04
    url: 'https://www.churchofjesuschrist.org/study/history/saints-v1/04-be-watchful?lang=eng'
    quote: 'Joseph sought the Lord’s direction through his seer stone. The right person, he learned, was Emma.'
  - where: 'note 1:56 “Josiah Stowell and the money-digging story”'
    claim: 'Joseph acknowledged the charge in his official history; Stowell hired him in 1825 because he was reputed a seer'
    key: cht-treasure-seeking
    url: 'https://www.churchofjesuschrist.org/study/history/topics/treasure-seeking?lang=eng'
    quote: 'Rather than deny the charge, Joseph acknowledged in his official history that Josiah Stowell had hired him in 1825 … Stowell wanted his help because Joseph was reputed by some of his neighbors to be a “seer”—someone who could look into a special stone and find lost or hidden objects.'
  - where: 'note 1:56 “Josiah Stowell and the money-digging story”'
    claim: 'Seeing with stones was part of the culture; the family accepted these folk practices'
    key: cht-treasure-seeking
    url: 'https://www.churchofjesuschrist.org/study/history/topics/treasure-seeking?lang=eng'
    quote: '“Seeing” and “seers” were part of the culture in which Joseph Smith grew up. … Joseph Smith and his family, like many around them, accepted these familiar folk practices.'
  - where: 'note 1:56 “Josiah Stowell and the money-digging story”'
    claim: 'Stowell took Joseph’s advice to give up; Joseph was commanded to have nothing further to do with treasure seekers'
    key: cht-treasure-seeking
    url: 'https://www.churchofjesuschrist.org/study/history/topics/treasure-seeking?lang=eng'
    quote: 'Stowell trusted Joseph, sought his assistance in seeking treasure, and even took his advice to finally give up the hunt. … he was commanded to have nothing further to do with those who sought treasure and instead use his gift to translate and seek revelation.'
  - where: 'note 1:56 “Josiah Stowell and the money-digging story”'
    claim: 'God redirected the seer stone to spiritual work; translating with a stone was unheard of'
    key: cht-treasure-seeking
    url: 'https://www.churchofjesuschrist.org/study/history/topics/treasure-seeking?lang=eng'
    quote: 'using a seer stone to translate an ancient record was unheard of. God gave Joseph Smith power to translate the Book of Mormon, redirecting Joseph’s use of the seer stone toward work of a spiritual nature.'
  - where: 'note 1:56 “Josiah Stowell and the money-digging story”'
    claim: 'Legend of hidden silver; good wages and a share of the findings'
    key: saints-v1-04
    url: 'https://www.churchofjesuschrist.org/study/history/saints-v1/04-be-watchful?lang=eng'
    quote: 'Local legends claimed that a band of explorers had mined a silver deposit and hidden the treasure in the area hundreds of years earlier. Knowing Joseph had a gift for using seer stones, Josiah offered him good wages and a share of the findings'
  - where: 'note 1:56 “Josiah Stowell and the money-digging story”'
    claim: 'The 1826 hearing before a justice of the peace in Chenango County, likely for disorderly conduct, under the statute'
    key: cht-1826-trial
    url: 'https://www.churchofjesuschrist.org/study/history/topics/joseph-smiths-1826-trial?lang=eng'
    quote: 'Joseph was ordered to appear before justice of the peace Albert Neely in Chenango County, likely on charges of disorderly conduct. His arrest appears to have been based on a statute in New York state law outlawing “pretending . . . to discover where lost goods may be found.”'
  - where: 'note 1:56 “Josiah Stowell and the money-digging story”'
    claim: 'Joseph testified he had used his stone to look for lost property but had given it up; Stowell testified'
    key: cht-1826-trial
    url: 'https://www.churchofjesuschrist.org/study/history/topics/joseph-smiths-1826-trial?lang=eng'
    quote: 'In his testimony, Joseph readily agreed he had used his seer stone off and on to look for lost property, but he had given up the practice—it hurt his eyes, he said.'
  - where: 'note 1:56 “Josiah Stowell and the money-digging story”'
    claim: 'The outcome is a puzzle; Cowdery, not present, gave acquittal as the likely result'
    key: cht-1826-trial
    url: 'https://www.churchofjesuschrist.org/study/history/topics/joseph-smiths-1826-trial?lang=eng'
    quote: 'The outcome of the hearing remains a puzzle. … Oliver Cowdery, who did not attend the hearing … mentioned the most likely result in light of missing documentation, that Joseph was acquitted of being a disorderly person.'
  - where: 'note 1:56 “Josiah Stowell and the money-digging story”'
    claim: 'September 1826: “Quit the company of the money diggers”'
    key: saints-v1-04
    url: 'https://www.churchofjesuschrist.org/study/history/saints-v1/04-be-watchful?lang=eng'
    quote: 'In September 1826, Joseph returned to the hill for the plates, but Moroni said he was still not ready for them. “Quit the company of the money diggers,” the angel told him.'
  - where: 'note 1:57 “Emma Hale”'
    claim: 'Emma, born 1804, seventh of nine children of Isaac and Elizabeth Hale, on a 90-acre farm in the Susquehanna Valley'
    key: cht-emma-hale-smith
    url: 'https://www.churchofjesuschrist.org/study/history/topics/emma-hale-smith?lang=eng'
    quote: 'Born on July 10, 1804, in Willingsborough (later Harmony), Pennsylvania, Emma Hale was the seventh of nine children of Isaac and Elizabeth Lewis Hale. The wealthy family lived on a 90-acre farm in the Susquehanna River Valley'
  - where: 'note 1:57 “Emma Hale”'
    claim: 'Methodist from age seven; later taught school'
    key: cht-emma-hale-smith
    url: 'https://www.churchofjesuschrist.org/study/history/topics/emma-hale-smith?lang=eng'
    quote: 'Methodism became popular in the Susquehanna region in the early 1800s, and Emma began attending with her mother at the age of seven. … Emma most likely attended the female seminary in Great Bend Township, and she later taught school.'
  - where: 'note 1:57 “Emma Hale”'
    claim: 'Met at end of October 1825, she 21 and he 19; parents opposed his religious pursuits and his work for Stowell; eloped 18 January 1827'
    key: cht-emma-hale-smith
    url: 'https://www.churchofjesuschrist.org/study/history/topics/emma-hale-smith?lang=eng'
    quote: 'Emma was 21 years old when she met 19-year-old Joseph Smith at the end of October 1825. … Isaac and Elizabeth Hale were opposed to the relationship, disapproving of Joseph’s religious pursuits and his work for Josiah Stowell'
  - where: 'note 1:57 “Emma Hale”'
    claim: 'Her parents thought him a poor laborer from another state; Isaac was suspicious of his part in the treasure hunt'
    key: saints-v1-04
    url: 'https://www.churchofjesuschrist.org/study/history/saints-v1/04-be-watchful?lang=eng'
    quote: 'Joseph was a poor laborer from another state, and they hoped their daughter would lose interest in him … Emma’s father had also grown wary of the treasure hunt and was suspicious of Joseph’s role in it.'
  - where: 'note 1:57 “Emma Hale”'
    claim: 'Proposal at the Stowells’; the marriage was her choice'
    key: saints-v1-04
    url: 'https://www.churchofjesuschrist.org/study/history/saints-v1/04-be-watchful?lang=eng'
    quote: 'Emma considered the proposal. Marrying Joseph would disappoint her parents, but it was her choice, and she loved him.'
  - where: 'note 1:57 “Emma Hale”'
