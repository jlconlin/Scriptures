  # ---- note 1:35 ----
  - where: 'note 1:35 “The Urim and Thummim”'
    claim: 'Book of Mormon writers called the instrument “interpreters”; clear stones set in metal rims and bound by a metal bow; “spectacles”'
    key: gt-book-of-mormon-translation
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/book-of-mormon-translation?lang=eng'
    quote: 'One of these objects, which Book of Mormon writers called “interpreters,” was buried with the plates in a hill near Joseph’s home. Those who saw the interpreters described them as a pair of clear stones set in metal rims and bound together by a metal bow. Joseph sometimes called them “spectacles.”'
  - where: 'note 1:35 “The Urim and Thummim”'
    claim: 'A few years after publication Joseph and his associates began using the Old Testament term; Israelite priests’ objects for divine communications'
    key: gt-book-of-mormon-translation
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/book-of-mormon-translation?lang=eng'
    quote: 'A few years after the publication of the Book of Mormon, Joseph Smith and his associates began to use the Old Testament term “Urim and Thummim” to describe the objects Joseph Smith used as he translated the Book of Mormon. In the Bible, Urim and Thummim were sacred objects, believed to be stones, that were used by Israelite priests to receive divine communications.'
  - where: 'note 1:35 “The Urim and Thummim”'
    claim: 'Joseph later called the two seer stones the Urim and Thummim, or interpreters'
    key: saints-v1-03
    url: 'https://www.churchofjesuschrist.org/study/history/saints-v1/03-plates-of-gold?lang=eng'
    quote: 'Buried with the plates, Moroni said, were two seer stones, which Joseph later called the Urim and Thummim, or interpreters.'
  - where: 'note 1:35 “The Urim and Thummim”'
    claim: 'Mosiah 8:13: interpreters; whoever is commanded to look in them is called seer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/8?lang=eng'
    quote: 'And the things are called interpreters, and no man can look in them except he be commanded, lest he should look for that he ought not and he should perish. And whosoever is commanded to look in them, the same is called seer.'

