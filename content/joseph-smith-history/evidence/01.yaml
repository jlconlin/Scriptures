chapter: 1
claims:
  # ---- Part 1 (verses 1–26): when, setting, thread ----
  - where: 'when'
    claim: 'The history was prepared in 1838–39'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/introduction?lang=eng'
    quote: 'Excerpts from Joseph Smith’s official testimony and history, which he and his scribes prepared in 1838–39 and which was published serially in the Times and Seasons in Nauvoo, Illinois, beginning on March 15, 1842.'
  - where: 'setting'
    claim: 'Excerpts from the official history prepared 1838–39, published serially in the Times and Seasons from 15 March 1842'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/introduction?lang=eng'
    quote: 'Excerpts from Joseph Smith’s official testimony and history, which he and his scribes prepared in 1838–39 and which was published serially in the Times and Seasons in Nauvoo, Illinois, beginning on March 15, 1842.'
  - where: 'setting'
    claim: 'The Pearl of Great Price became a standard work on 10 October 1880'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/introduction?lang=eng'
    quote: 'The Pearl of Great Price received wide use and subsequently became a standard work of the Church by action of the First Presidency and the general conference in Salt Lake City on October 10, 1880.'
  - where: 'setting'
    claim: 'The family farm lay on the line between Palmyra and Manchester: the land in Manchester, the log home in Palmyra Township'
    key: cht-sacred-grove
    url: 'https://www.churchofjesuschrist.org/study/history/topics/sacred-grove-and-smith-family-farm?lang=eng'
    quote: 'the family made the first payment on a 100-acre lot of densely forested land in Manchester … The home was situated north of the farm, in Palmyra Township.'
  - where: 'setting'
    claim: 'The 1832 account is personal; the 1838 account reflects on the vision’s meaning for the Church and the world'
    key: gt-first-vision-accounts
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/first-vision-accounts?lang=eng'
    quote: 'The account is largely personal and focuses on the vision’s meaning for Joseph. When he later dictated the account now found in the Pearl of Great Price, he reflected on the vision’s meaning not only to him but to the Church and the world.'
  - where: 'setting'
    claim: 'By then Joseph Smith led a growing church'
    key: gt-first-vision-accounts
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/first-vision-accounts?lang=eng'
    quote: 'His later accounts, written after many years serving as the leader of a growing church, emphasized his quest about which church to join.'
  - where: 'setting'
    claim: 'The history was dictated between periods of intense opposition'
    key: gte-first-vision-accounts
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/first-vision-accounts?lang=eng'
    quote: 'the account was part of a longer history dictated by Joseph Smith between periods of intense opposition.'
  - where: 'setting'
    claim: 'Oliver Cowdery’s account, printed after verse 75, is from the Messenger and Advocate of October 1834'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-h/1?lang=eng'
    quote: 'I hope to adore in that day which shall never cease.”—Messenger and Advocate, vol. 1 (October 1834), pp. 14–16.'
  - where: 'thread'
    claim: 'The 1838 account presents the vision as the beginning of the rise and progress of the Church'
    key: gte-first-vision-accounts
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/first-vision-accounts?lang=eng'
    quote: 'Whereas the 1832 account emphasizes the more personal story of Joseph Smith as a young man seeking forgiveness, the 1838 account focuses on the vision as the beginning of the “rise and progress of the Church.”'

  # ---- note 1:1 ----
  - where: 'note 1:1 “Why Joseph Smith wrote this history”'
    claim: 'He kept no autobiographical record in his first 24 years; little formal education; writing was hard for him'
    key: gt-first-vision-accounts
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/first-vision-accounts?lang=eng'
    quote: 'Joseph Smith did not create any autobiographical records during the first 24 years of his life. He grew up in a family that was literate, but he received little formal education. We know he found it difficult to express himself in writing.'
  - where: 'note 1:1 “Why Joseph Smith wrote this history”'
    claim: 'Commanded to keep a history soon after the Church was organized; one of the first things recorded was the First Vision'
    key: gt-first-vision-accounts
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/first-vision-accounts?lang=eng'
    quote: 'Shortly after the Church was organized, the Lord commanded Joseph to keep a history. It is significant that soon after Joseph received this commandment, one of the first things he recorded was an account of the First Vision.'
  - where: 'note 1:1 “Why Joseph Smith wrote this history”'
    claim: 'The 1838 account opened what became a six-volume history, copied by scribes into a large bound volume'
    key: jsp-accounts-first-vision
    url: 'https://www.josephsmithpapers.org/site/accounts-of-the-first-vision'
    quote: 'This best-known account of Joseph Smith’s first vision opened what was to become a six-volume history of his life. Copied by scribes into a large bound volume, this account was later canonized'
  - where: 'note 1:1 “Why Joseph Smith wrote this history”'
    claim: 'The draft published in the Times and Seasons and the Pearl of Great Price (Draft 2) is in James Mulholland’s hand'
    key: haws-reconciling
    url: 'https://rsc.byu.edu/vol-14-no-2-2013/reconciling-joseph-smith-history-110-118-19'
    quote: 'the draft of Joseph Smith’s history (labeled Draft 2 in the handwriting of James Mulholland) that was eventually published in the Times and Seasons and then the Pearl of Great Price.'
  - where: 'note 1:1 “Why Joseph Smith wrote this history”'
    claim: 'The 1832 account is the one now known as the earliest, written in 1832'
    key: gt-first-vision-accounts
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/first-vision-accounts?lang=eng'
    quote: 'The major differences in Joseph Smith’s First Vision accounts are found in the earliest, which was written in 1832.'

  # ---- note 1:3 ----
  - where: 'note 1:3 “From Vermont to Manchester”'
    claim: 'Failed harvests and hardship from the marriage on; several moves between Vermont and New Hampshire villages'
    key: cht-smith-family
    url: 'https://www.churchofjesuschrist.org/study/history/topics/joseph-sr-and-lucy-mack-smith-family?lang=eng'
    quote: 'From the beginning of Joseph Sr. and Lucy’s marriage, the family experienced failed harvests and economic hardship. They moved several times between villages in Vermont and New Hampshire before finding more favorable prospects in the Finger Lakes region of New York.'
  - where: 'note 1:3 “From Vermont to Manchester”'
    claim: 'Moved 1816–17 after a bad harvest; rented in Palmyra village two years; day labor and a small shop'
    key: cht-palmyra-manchester
    url: 'https://www.churchofjesuschrist.org/study/history/topics/palmyra-and-manchester?lang=eng'
    quote: 'The Joseph Sr. and Lucy Mack Smith family migrated to western New York in 1816 and 1817 after a bad harvest and financial troubles upset their livelihood. They first settled in Palmyra village and rented a house for two years, living on wages earned from day labor and running a small shop.'
  - where: 'note 1:3 “From Vermont to Manchester”'
    claim: 'New Englanders drawn by fertile soil and cheap land; Baptists, Methodists, Presbyterians and Quakers competed for converts'
    key: cht-palmyra-manchester
    url: 'https://www.churchofjesuschrist.org/study/history/topics/palmyra-and-manchester?lang=eng'
    quote: 'Beginning in the late 1700s, New Englanders moved to western New York in droves, attracted by the fertile soil and cheap acreage. … Baptists, Methodists, Presbyterians, and Quakers all converged on the area and began vying for converts.'
  - where: 'note 1:3 “From Vermont to Manchester”'
    claim: '100 acres of forested land in Manchester; log home built by Joseph Sr., Alvin and Hyrum, winter 1818–19, north of the farm in Palmyra Township'
    key: cht-sacred-grove
    url: 'https://www.churchofjesuschrist.org/study/history/topics/sacred-grove-and-smith-family-farm?lang=eng'
    quote: 'During the winter of 1818 to 1819, the 10 members of the Smith family moved into a 1,000-square-foot log home built by Joseph Smith Sr. and his sons Alvin and Hyrum. The home was situated north of the farm, in Palmyra Township.'
  # ---- note 1:5 ----
  - where: 'note 1:5 “The religious excitement, and when it came”'
    claim: 'Revivals of the early 1800s, which historians call the Second Great Awakening; churches lost government support; attendance below 20 percent'
    key: cht-awakenings-revivals
    url: 'https://www.churchofjesuschrist.org/study/history/topics/awakenings-and-revivals?lang=eng'
    quote: 'ministers watched their congregations stagnate, with church attendance dwindling below 20 percent in most states. … Churches once supported by the government lost their privileged position … what historians would later call the Second Great Awakening'
  - where: 'note 1:5 “The religious excitement, and when it came”'
    claim: 'Methodists and Baptists rode circuits; rural camp meetings for days'
    key: cht-awakenings-revivals
    url: 'https://www.churchofjesuschrist.org/study/history/topics/awakenings-and-revivals?lang=eng'
    quote: 'Methodists and Baptists canvassed the countryside, holding classes and worship services. … In many rural areas, preaching featured overnight camp meetings that drew crowds for days at a time.'
  - where: 'note 1:5 “The religious excitement, and when it came”'
    claim: 'Joseph attended revival meetings as an adolescent'
    key: cht-awakenings-revivals
    url: 'https://www.churchofjesuschrist.org/study/history/topics/awakenings-and-revivals?lang=eng'
    quote: 'Joseph Smith also attended revival meetings as an adolescent, and like Nancy, he desired to “feel & shout like the Rest” but “could feel nothing.”'
  - where: 'note 1:5 “The religious excitement, and when it came”'
    claim: 'Joseph told Neibaur in 1844 that he wanted to feel and shout like the rest but could feel nothing'
    key: jsp-neibaur-1844
    url: 'https://www.josephsmithpapers.org/paper-summary/alexander-neibaur-journal-24-may-1844-extract/1'
    quote: 'Br Joseph tolt us the first call he had a Revival Meeting his Mother & Br & Sister got Religion, he wanted to get Religion too wanted to feel & shout like the Rest but could feel nothing'
  - where: 'note 1:5 “The religious excitement, and when it came”'
    claim: 'A 1967 article argued there was no revival in Palmyra in spring 1820, so the account was false'
    key: harper-three-arguments
    url: 'https://rsc.byu.edu/exploring-first-vision/evaluating-three-arguments-against-joseph-smiths-first-vision'
    quote: 'in the fall of 1967 an innovative article that asserted that there was no evidence of religious revival in Palmyra, New York, in the spring of 1820, and therefore Joseph’s claim to have been influenced by such religious fervor must be false.'
  - where: 'note 1:5 “The religious excitement, and when it came”'
    claim: 'The text claims neither Palmyra nor 1820 for the revival; the district, a Methodist term like a stake'
    key: harper-three-arguments
    url: 'https://rsc.byu.edu/exploring-first-vision/evaluating-three-arguments-against-joseph-smiths-first-vision'
    quote: 'Joseph’s accounts do not claim that the revivalism centered in Palmyra itself, as Walters argues, or that the revivalism occurred in 1820. … To nineteenth-century Methodists, a district was somewhat akin to today’s Latter-day Saint stake'
  - where: 'note 1:5 “The religious excitement, and when it came”'
    claim: 'Genesee Conference at Vienna (Phelps) within walking distance; camp meeting at Palmyra June 1820 confirmed by newspaper and diary'
    key: harper-three-arguments
    url: 'https://rsc.byu.edu/exploring-first-vision/evaluating-three-arguments-against-joseph-smiths-first-vision'
    quote: 'Methodists of the Genesee Conference assembled at Vienna (now Phelps), New York, within walking distance of the Smith farm. … A Palmyra newspaper and the diary of a Methodist minister confirm a weekend camp meeting in Palmyra in June 1820'
  - where: 'note 1:5 “The religious excitement, and when it came”'
    claim: 'The Church’s summary: 1818 revival near Palmyra, Vienna the next year, journals of 1819–20, three-day camp meeting late spring 1820, revivals 1824'
    key: gt-first-vision-accounts
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/first-vision-accounts?lang=eng'
    quote: 'such as the one held by Methodists just outside of Palmyra in 1818. Local Methodists also assembled the following year in Vienna … There was a three-day Methodist camp meeting in Palmyra in the late spring of 1820, and extensive revivals occurred several years later in 1824.'

  # ---- note 1:11 ----
  - where: 'note 1:11 “James 1:5, and why the Bible sent him to God”'
    claim: 'He had searched the Bible as if it held all the answers; now it told him to go directly to God'
    key: saints-v1-01
    url: 'https://www.churchofjesuschrist.org/study/history/saints-v1/01-ask-in-faith?lang=eng'
    quote: 'He had searched the Bible before as if it held all the answers. But now the Bible was telling him he could go directly to God for personal answers to his questions.'
  - where: 'note 1:11 “James 1:5, and why the Bible sent him to God”'
    claim: 'In one telling he heard a minister quote James 1 in a sermon'
    key: saints-v1-01
    url: 'https://www.churchofjesuschrist.org/study/history/saints-v1/01-ask-in-faith?lang=eng'
    quote: 'While attending a sermon, Joseph heard a minister quote from the first chapter of James in the New Testament.'
  - where: 'note 1:11 “James 1:5, and why the Bible sent him to God”'
    claim: 'Joseph told Neibaur he opened his Bible and the first passage that struck him was James 1:5'
    key: jsp-neibaur-1844
    url: 'https://www.josephsmithpapers.org/paper-summary/alexander-neibaur-journal-24-may-1844-extract/1'
    quote: 'opened his Bible the first Passage that struck him was if any man lack Wisdom let him ask of God who giveth to all Men liberallity & upbraidet not'
  - where: 'note 1:11 “James 1:5, and why the Bible sent him to God”'
    claim: 'He had never prayed aloud but trusted the Bible’s promise, “Ask in faith, nothing wavering”'
    key: saints-v1-01
    url: 'https://www.churchofjesuschrist.org/study/history/saints-v1/01-ask-in-faith?lang=eng'
    quote: 'Joseph decided to pray. He had never prayed out loud before, but he trusted the Bible’s promise. “Ask in faith, nothing wavering,” it taught.'
  - where: 'note 1:11 “James 1:5, and why the Bible sent him to God”'
    claim: 'James 1:6 adds the condition of faith'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/james/1?lang=eng'
    quote: 'But let him ask in faith, nothing wavering. For he that wavereth is like a wave of the sea driven with the wind and tossed.'

  # ---- note 1:14 ----
  - where: 'note 1:14 “The woods on the Smith farm”'
    claim: 'About 30 acres cleared by 1820; the vision in the still-wooded part, probably near land being cleared; old-growth trees; secluded; the Sacred Grove'
    key: cht-sacred-grove
    url: 'https://www.churchofjesuschrist.org/study/history/topics/sacred-grove-and-smith-family-farm?lang=eng'
    quote: 'The Smiths had cleared trees from about 30 acres of land by 1820, the year of Joseph Smith’s First Vision. The vision occurred somewhere on the still-wooded part of the farm, probably near an area that the Smiths were clearing for future crops.'
  - where: 'note 1:14 “The woods on the Smith farm”'
    claim: 'Old-growth trees up to 100 feet; dense forest offered a secluded place to pray'
    key: cht-sacred-grove
    url: 'https://www.churchofjesuschrist.org/study/history/topics/sacred-grove-and-smith-family-farm?lang=eng'
    quote: 'Known today as the Sacred Grove, this wooded area was likely composed of large, old-growth trees, some as tall as 100 feet … The dense forestation offered Joseph a secluded place to pray.'

  # ---- note 1:17 accounts ----
  - where: 'note 1:17 “Four accounts of the vision”'
    claim: 'Four accounts; consistent story, differing in emphasis and detail'
    key: gt-first-vision-accounts
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/first-vision-accounts?lang=eng'
    quote: 'The various accounts tell a consistent story, though naturally they differ in emphasis and detail.'
  - where: 'note 1:17 “Four accounts of the vision”'
    claim: 'Joseph Smith left four accounts'
    key: gt-first-vision-accounts
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/first-vision-accounts?lang=eng'
    quote: 'Joseph Smith left four accounts of the First Vision.'
  - where: 'note 1:17 “Four accounts of the vision”'
    claim: 'The 1832 is the earliest and most personal, the only one with his own handwriting; the 1835 told to a visitor in Kirtland and copied into the journal; the 1838 is the third'
    key: jsp-accounts-first-vision
    url: 'https://www.josephsmithpapers.org/site/accounts-of-the-first-vision'
    quote: 'This is the earliest and most personal account, and the only one that includes Joseph Smith’s own handwriting. … Joseph Smith described his early visionary experiences to a visitor at his home in Kirtland, Ohio, in November 1835.'
  - where: 'note 1:17 “Four accounts of the vision”'
    claim: 'The 1832 account: pillar of light, the Lord, sins forgiven'
    key: js-history-1832
    url: 'https://www.josephsmithpapers.org/paper-summary/history-circa-summer-1832/3'
    quote: 'a piller of light above the brightness of the sun at noon day come down from above and rested upon me … and I saw the Lord and he spake unto me saying Joseph my son thy sins are forgiven thee.'
  - where: 'note 1:17 “Four accounts of the vision”'
    claim: 'The 1832 account: “Joseph my son thy sins are forgiven thee”; “in the 16th year of my age”'
    key: js-history-1832
    url: 'https://www.josephsmithpapers.org/paper-summary/history-circa-summer-1832/3'
    quote: 'in the 16th year of my age … and he spake unto me saying Joseph my son thy sins are forgiven thee.'
  - where: 'note 1:17 “Four accounts of the vision”'
    claim: 'The 1835 account: pillar of fire, two personages, forgiveness, witness of Jesus Christ, many angels'
    key: jsp-journal-1835-1836
    url: 'https://www.josephsmithpapers.org/paper-summary/journal-1835-1836/25'
    quote: 'another personage soon appeard like unto the first, he said unto me thy sins are forgiven thee, he testifyed unto me that Jesus Christ is the son of God;70 and I saw many angels in this vision'
  - where: 'note 1:17 “Four accounts of the vision”'
    claim: 'The 1835 account: a pillar of fire above his head, a personage in the flame'
    key: jsp-journal-1835-1836
    url: 'https://www.josephsmithpapers.org/paper-summary/journal-1835-1836/25'
    quote: 'a pillar of fire appeared above my head, it presently rested down upon me , and filled me with joy unspeakable, a personage appeard in the midst, of this pillar of flame'
  - where: 'note 1:17 “Four accounts of the vision”'
    claim: 'The 1842 account: two personages exactly alike; incorrect doctrines; promise of the fulness of the gospel'
    key: jsp-church-history-1842
    url: 'https://www.josephsmithpapers.org/paper-summary/church-history-1-march-1842/2'
    quote: 'saw two glorious personages who exactly resembled each other in features, and likeness … at the same time receiving a promise that the fulness of the gospel should at some future time be made known unto me.'
  - where: 'note 1:17 “Four accounts of the vision”'
    claim: 'The 1842 account: denominations believing incorrect doctrines'
    key: jsp-church-history-1842
    url: 'https://www.josephsmithpapers.org/paper-summary/church-history-1-march-1842/2'
    quote: 'They told me that all religious denominations were believing in incorrect doctrines'
  - where: 'note 1:17 “Four accounts of the vision”'
    claim: 'The 1842 account was printed in the Times and Seasons, 1 March 1842'
    key: saints-v1-01
    url: 'https://www.churchofjesuschrist.org/study/history/saints-v1/01-ask-in-faith?lang=eng'
    quote: 'Joseph Smith, “Church History,” Times and Seasons, Mar. 1, 1842, 3:706, in JSP, H1:494.'
  - where: 'note 1:17 “Four accounts of the vision”'
    claim: 'The occasions: a private history, a visitor, an official history, an inquiry'
    key: gt-first-vision-accounts
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/first-vision-accounts?lang=eng'
    quote: 'writing a private history, recounting his experience to a visitor in his home, dictating his life story for an official history, or responding to an inquiry from a reporter.'
  - where: 'note 1:17 “Four accounts of the vision”'
    claim: 'Forgiveness in 1832, which church in later accounts; closely related; desire to be saved'
    key: gt-first-vision-accounts
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/first-vision-accounts?lang=eng'
    quote: 'In the earliest account, Joseph prayed seeking forgiveness for his sins. In the later accounts, he wanted to know which church to join. These two questions were probably very closely related in Joseph’s mind, and both reflected his desire to be saved.'
  - where: 'note 1:17 “Four accounts of the vision”'
    claim: '1832 “the Lord”; later the Father introduces the Son; in all, Christ answers'
    key: gt-first-vision-accounts
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/first-vision-accounts?lang=eng'
    quote: 'In the scriptural account, Joseph explained that the Father introduced the Son, who then proceeded to converse with Joseph. Although the 1832 account does not include this detail, all the accounts emphasize the central role of Jesus Christ in the vision. He is the one who answered Joseph’s questions.'
  - where: 'note 1:17 “Four accounts of the vision”'
    claim: 'The 1832 age was a scribe’s insertion, most likely a mistake; later accounts say 14'
    key: gt-first-vision-accounts
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/first-vision-accounts?lang=eng'
    quote: 'In the 1832 account, one of Joseph’s scribes inserted the phrase “in the 16th year of my age.” The other accounts report he was 14 years old. This was most likely the result of a scribal mistake.'

  # ---- note 1:17 Witness of Christ ----
  - where: 'note 1:17 ““This is My Beloved Son. Hear Him!””'
    claim: 'In every account Jesus Christ answers Joseph’s questions'
    key: gt-first-vision-accounts
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/first-vision-accounts?lang=eng'
    quote: 'all the accounts emphasize the central role of Jesus Christ in the vision. He is the one who answered Joseph’s questions.'
  - where: 'note 1:17 ““This is My Beloved Son. Hear Him!””'
    claim: 'The Father introduces the Son with few words: Transfiguration, Bountiful, Joseph Smith'
    key: nelson-hear-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/04/45nelson?lang=eng'
    quote: 'whenever He has introduced His Only Begotten Son to mortals upon the earth, He has done so with remarkably few words. On the Mount of Transfiguration to Peter, James, and John, God said, “This is my beloved Son: hear him.”'
  - where: 'note 1:17 ““This is My Beloved Son. Hear Him!””'
    claim: 'In the three instances the people were in fear and some desperation; Joseph in the grips of a force of darkness'
    key: nelson-hear-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/04/45nelson?lang=eng'
    quote: 'in these three instances just mentioned, just before the Father introduced the Son, the people involved were in a state of fear and, to some degree, desperation.'
  - where: 'note 1:17 ““This is My Beloved Son. Hear Him!””'
    claim: 'Apostles afraid; Nephites after destruction and darkness; Joseph in the grips of darkness; hear His Son'
    key: nelson-hear-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/04/45nelson?lang=eng'
    quote: 'Joseph Smith was in the grips of a force of darkness just before the heavens opened.'
  - where: 'note 1:17 ““This is My Beloved Son. Hear Him!””'
    claim: 'What helps most in uncertainty and fear is to hear the Son'
    key: nelson-hear-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/04/45nelson?lang=eng'
    quote: 'Our Father knows that when we are surrounded by uncertainty and fear, what will help us the very most is to hear His Son.'
  - where: 'note 1:17 ““This is My Beloved Son. Hear Him!””'
    claim: 'The Father’s words at Bountiful'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/04/45nelson?lang=eng'
    quote: 'His words to the Nephites in ancient Bountiful were “Behold my Beloved Son, in whom I am well pleased, in whom I have glorified my name—hear ye him.”'

  # ---- note 1:18 ----
  - where: 'note 1:18 ““It had never entered into my heart that all were wrong””'
    claim: 'Draft 2 has the parenthesis'
    key: jsp-history-draft2
    url: 'https://www.josephsmithpapers.org/paper-summary/history-circa-june-1839-circa-1841-draft-2/3'
    quote: 'than I asked the personages who stood above me in the light, which of all the sects was right, (for at this time it had never entered into my heart that all were wrong) and which I should join.'
  - where: 'note 1:18 ““It had never entered into my heart that all were wrong””'
    claim: 'Volume A-1 has the parenthesis'
    key: jsp-history-a1
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-a-1-23-december-1805-30-august-1834/3'
    quote: 'which of all the sects was right, (for at this time it had never entered into my heart that all were wrong) and which I should join.'
  - where: 'note 1:18 ““It had never entered into my heart that all were wrong””'
    claim: 'The 1921 edition lacks it'
    key: pgp-1921
    url: 'https://archive.org/download/pearlofgreatpric0000jose_d8d6/pearlofgreatpric0000jose_d8d6_djvu.txt'
    quote: 'than I asked the Personages who stood above me in the light, which of all the sects was right—and which I should join,'
  - where: 'note 1:18 ““It had never entered into my heart that all were wrong””'
    claim: 'The current edition has it'
