    url: 'https://www.churchofjesuschrist.org/study/history/topics/martin-harriss-consultations-with-scholars?lang=eng'
    quote: 'He then pressed on to New York City to meet with Samuel L. Mitchill, a linguist and leading scholar of ancient American culture. Harris also visited Charles Anthon, a young professor of grammar and linguistics at Columbia College'
  - where: 'note 1:62 “The interpreters and the seer stone”'
