  - where: 'note 1:40 “About to be fulfilled”'
    claim: 'Moroni quoted Isaiah, Joel, Malachi and Acts; the Lord was coming soon'
    key: saints-v1-03
    url: 'https://www.churchofjesuschrist.org/study/history/saints-v1/03-plates-of-gold?lang=eng'
    quote: 'For the rest of the visit, Moroni quoted prophecies from the biblical books of Isaiah, Joel, Malachi, and Acts. The Lord was coming soon, he explained'
  - where: 'note 1:40 “About to be fulfilled”'
    claim: 'Moroni’s “cut off” wording is that of 3 Nephi 20:23 (Gospel Library footnote)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-h/1?lang=eng'
    quote: '40c “cut off”: 3 Ne. 20:23; 21:20.'

