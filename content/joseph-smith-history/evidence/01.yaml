  # ---- note 1:53 ----
  - where: 'note 1:53 “Why he could not take the plates”'
    claim: 'The 1832 account: three attempts; “why can I not obtain them”; not kept the commandments'
    key: js-history-1832
    url: 'https://www.josephsmithpapers.org/paper-summary/history-circa-summer-1832/4'
    quote: 'straightway made three attempts to get them … therefore I cried unto the Lord in the agony of my soul why can I not obtain them23 behold the angel appeared unto me again and said unto me you have not kept the commandments of the Lord which I gave unto you'
  - where: 'note 1:53 “Why he could not take the plates”'
    claim: 'The 1832 account: tempted, sought the plates to obtain riches, chastened'
    key: js-history-1832
    url: 'https://www.josephsmithpapers.org/paper-summary/history-circa-summer-1832/5'
    quote: 'for now I had been tempted of the advisary and saught the Plates to obtain riches and kept not the commandment that I should have an eye single to the Glory of God24 therefore I was chastened'
  - where: 'note 1:53 “Why he could not take the plates”'
    claim: 'The 1835 account: under transgression'
    key: jsp-journal-1835-1836
    url: 'https://www.josephsmithpapers.org/paper-summary/journal-1835-1836/26'
    quote: 'the Angel told me that the reason why I could not obtain the plates at this time was because I was under transgression,75 but to come again in one year from that time'
  - where: 'note 1:53 “Why he could not take the plates”'
    claim: 'On the way he thought of freeing his family from poverty; shocked three times when he reached for the plates'
    key: saints-v1-03
    url: 'https://www.churchofjesuschrist.org/study/history/saints-v1/03-plates-of-gold?lang=eng'
    quote: 'Still, Joseph could not help thinking that he now knew exactly where to find enough treasure to free his family from poverty.'
  - where: 'note 1:53 “Why he could not take the plates”'
    claim: 'He reached for the plates and felt a shock each time'
    key: saints-v1-03
    url: 'https://www.churchofjesuschrist.org/study/history/saints-v1/03-plates-of-gold?lang=eng'
    quote: 'He reached for them—and felt a shock pulse through him. He jerked his hand back but then reached for the plates twice more and was shocked each time.'
  - where: 'note 1:53 “Why he could not take the plates”'
    claim: 'Moroni: not deposited for gain and wealth'
    key: saints-v1-03
    url: 'https://www.churchofjesuschrist.org/study/history/saints-v1/03-plates-of-gold?lang=eng'
    quote: '“They are not deposited here for the sake of accumulating gain and wealth for the glory of this world. They were sealed by the prayer of faith.”'
  - where: 'note 1:53 “Why he could not take the plates”'
