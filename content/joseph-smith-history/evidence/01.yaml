  # ---- note 1:32 ----
  - where: 'note 1:32 “The angel the early Saints spoke of first”'
    claim: 'Moroni’s appearance is the first of Joseph’s visions in the historical sources; an 1830 revelation describes the angel'
    key: cht-angel-moroni
    url: 'https://www.churchofjesuschrist.org/study/history/topics/angel-moroni?lang=eng'
    quote: 'The appearance of the angel was the first of Joseph Smith’s visionary experiences to appear in historical sources. An 1830 revelation declared that an angel with a “countenance [as] lightning” appeared to Joseph'
  - where: 'note 1:32 “The angel the early Saints spoke of first”'
    claim: 'Joseph’s own accounts are simple, sober and consistent; early followers spoke of Moroni’s visit as the beginning of his calling'
    key: cht-angel-moroni
    url: 'https://www.churchofjesuschrist.org/study/history/topics/angel-moroni?lang=eng'
    quote: 'Joseph Smith’s own accounts are simple, sober, and consistent. Joseph’s preparation to become a prophet began with his First Vision, but his early followers typically spoke of Moroni’s visit as marking the beginning of Joseph’s calling.'
  - where: 'note 1:32 “The angel the early Saints spoke of first”'
    claim: 'D&C 20:6: countenance as lightning, garments white'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/20?lang=eng'
    quote: 'God ministered unto him by an holy angel, whose countenance was as lightning, and whose garments were pure and white above all other whiteness;'
  - where: 'note 1:32 “The angel the early Saints spoke of first”'
    claim: 'Lucy, William and Oliver Cowdery began their accounts with Moroni'
    key: gt-first-vision-accounts
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/first-vision-accounts?lang=eng'
    quote: 'Joseph Smith’s mother, Lucy, and his brother William both left accounts that began with the angel Moroni’s visit in 1823 and did not reference the appearance of the Father and the Son. Similarly, Oliver Cowdery’s earliest published account of the Restoration begins with Moroni’s appearance.'
  - where: 'note 1:32 “The angel the early Saints spoke of first”'
    claim: 'Joseph did not emphasize the First Vision publicly for years but frequently testified of Moroni and the translation'
    key: gt-first-vision-accounts
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/first-vision-accounts?lang=eng'
    quote: 'Joseph himself did not emphasize or speak frequently about the vision in public for many years. … On the other hand, Joseph frequently testified of the visitation of Moroni and the translation of the Book of Mormon.'
  - where: 'note 1:32 “The angel the early Saints spoke of first”'
    claim: 'The 1835 account of the angel: hands and feet naked, pure and white; stood between the floors'
    key: jsp-journal-1835-1836
    url: 'https://www.josephsmithpapers.org/paper-summary/journal-1835-1836/25'
    quote: 'an angel appeared before me, his hands and feet were naked pure and white, and he stood between the floors of the room, clothed with purity inexpressible'

  # ---- note 1:33 ----
  - where: 'note 1:33 “Moroni, not Nephi”'
    claim: 'Moroni was the last ancient record keeper to write on the plates'
    key: cht-angel-moroni
    url: 'https://www.churchofjesuschrist.org/study/history/topics/angel-moroni?lang=eng'
    quote: 'Moroni, the last ancient record keeper to inscribe his teachings on the plates, appeared to Joseph on a number of occasions between 1823 and 1829'
  - where: 'note 1:33 “Moroni, not Nephi”'
    claim: 'The 1832 account: plates engraved by Moroni and his fathers'
    key: js-history-1832
    url: 'https://www.josephsmithpapers.org/paper-summary/history-circa-summer-1832/4'
    quote: 'there was plates of gold upon which there was engravings which was engraven by Maroni & his fathers the servants of the living God in ancient days'
  - where: 'note 1:33 “Moroni, not Nephi”'
    claim: 'Early accounts called the messenger “the angel”; in 1835 Joseph named him Moroni in the Doctrine and Covenants; 1842 letter'
    key: cht-angel-moroni
    url: 'https://www.churchofjesuschrist.org/study/history/topics/angel-moroni?lang=eng'
    quote: 'These and other early accounts referred to this messenger simply as “the angel.” In 1835, Joseph identified the angel as the Book of Mormon figure Moroni in a revelation published in the Doctrine and Covenants.'
  - where: 'note 1:33 “Moroni, not Nephi”'
    claim: 'Sources naming Moroni: the 1835 D&C, a July 1838 Elders’ Journal editorial; Draft 2 is the earliest to name Nephi'
    key: jsp-history-draft2
    url: 'https://www.josephsmithpapers.org/paper-summary/history-circa-june-1839-circa-1841-draft-2/5'
    quote: 'as published in the 1835 edition of the Doctrine and Covenants; and a JS editorial published in the Elders’ Journal in July 1838.b The present history is the earliest extant source to name Nephi as the messenger'
  - where: 'note 1:33 “Moroni, not Nephi”'
    claim: 'Draft 2 reads “his name was Nephi”'
    key: jsp-history-draft2
    url: 'https://www.josephsmithpapers.org/paper-summary/history-circa-june-1839-circa-1841-draft-2/5'
    quote: 'He called me by name and said unto me that he was a messenger sent from the presence of God to me and that his name was Nephi.'
  - where: 'note 1:33 “Moroni, not Nephi”'
    claim: 'The Times and Seasons of 15 April 1842 printed “Nephi”'
    key: jsp-times-seasons-1842-04-15-p753
    url: 'https://www.josephsmithpapers.org/paper-summary/times-and-seasons-15-april-1842/3'
    quote: 'He called me by name, and said unto me that he was a messenger sent from the presence of God to me, and that his name was Nephi.'
  - where: 'note 1:33 “Moroni, not Nephi”'
    claim: 'The reading likely originated with Mulholland, who worked from sources now lost, many of which did not name the angel'
    key: cht-angel-moroni
    url: 'https://www.churchofjesuschrist.org/study/history/topics/angel-moroni?lang=eng'
    quote: 'This reference likely originated with Joseph Smith’s clerk James Mulholland … Evidence suggests Mulholland did not take dictation from Joseph Smith but rather worked from sources available to him that have not survived.'
  - where: 'note 1:33 “Moroni, not Nephi”'
    claim: 'Both names appeared in the 1840s and 1860s; Brigham Young assigned historians; correction written on the manuscript; no evidence Joseph called him Nephi'
    key: cht-angel-moroni
    url: 'https://www.churchofjesuschrist.org/study/history/topics/angel-moroni?lang=eng'
    quote: 'both “Nephi” and “Moroni” appeared in publications during the 1840s and 1860s. Brigham Young suspected the history contained a clerical error and assigned Church historians to research the issue. … No evidence indicates that Joseph Smith ever called the angel “Nephi.”'
  - where: 'note 1:33 “Moroni, not Nephi”'
    claim: 'Albert Carrington, Church Historian, probably in 1871, changed Nephi to Moroni and called it a clerical error'
    key: jsp-history-draft2
    url: 'https://www.josephsmithpapers.org/paper-summary/history-circa-june-1839-circa-1841-draft-2/5'
    quote: 'A later redaction in the hand of Albert Carrington changed “Nephi” to “Moroni” and noted that the original attribution was a “clerical error.” Carrington probably made the note in 1871, at a time when he was Church Historian and Recorder.'
  - where: 'note 1:33 “Moroni, not Nephi”'
    claim: 'Volume A-1: “Nephi *Moroni. *Evidently a clerical error … Should read Moroni.”'
    key: jsp-history-a1
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-a-1-23-december-1805-30-august-1834/5'
    quote: 'his name was Nephi *Moroni. *Evidently a clerical error; … Should read Moroni.'
  - where: 'note 1:33 “Moroni, not Nephi”'
    claim: 'D&C 128:20 names Moroni and Cumorah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/128?lang=eng'
    quote: 'Glad tidings from Cumorah! Moroni, an angel from heaven, declaring the fulfilment of the prophets—the book to be revealed.'

