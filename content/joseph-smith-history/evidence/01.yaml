    key: sc-knowhy-809
    url: 'https://scripturecentral.org/knowhy/the-fulness-of-the-record-of-john'
    quote: 'In matters of great importance, the Lord has often repeated the same revelation numerous times. Peter saw a vision three times that led to the preaching of the gospel among the Gentiles. Moroni visited Joseph Smith four times in less than twenty-four hours'
  - where: 'note 1:45 “The same message four times”'
    claim: 'The 1832 account: three times in one night and once the next day'
    key: js-history-1832
    url: 'https://www.josephsmithpapers.org/paper-summary/history-circa-summer-1832/4'
    quote: 'and thus he appeared unto me three times in one night and once on the next day'
  - where: 'note 1:45 “The same message four times”'
    claim: 'The 1835 account: the same things and much more; the third time the same tidings'
    key: jsp-journal-1835-1836
    url: 'https://www.josephsmithpapers.org/paper-summary/journal-1835-1836/26'
    quote: 'the Angel appeard to me again and related the same things and much more, also the third time bearing the same tidings, and departed'
  - where: 'note 1:45 “The same message four times”'
    claim: 'Acts 10:16: done thrice'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/10?lang=eng'
    quote: 'This was done thrice: and the vessel was received up again into heaven.'

  # ---- note 1:50 ----
