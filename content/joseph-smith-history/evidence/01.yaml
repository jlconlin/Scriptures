    url: 'https://www.churchofjesuschrist.org/study/history/topics/martin-harriss-consultations-with-scholars?lang=eng'
    quote: 'In February 1828, Martin Harris traveled to New York City with a transcription of some of the characters from the Book of Mormon plates'
