    url: 'https://rsc.byu.edu/vol-14-no-2-2013/reconciling-joseph-smith-history-110-118-19'
    quote: 'James E. Talmage, under assignment to prepare the 1902 edition of the Pearl of Great Price, deleted the parenthetical phrase … The phrase was reinserted in the Church’s 1981 edition of the Pearl of Great Price.'
  - where: 'note 1:18 ““It had never entered into my heart that all were wrong””'
    claim: 'Reconciling by the word heart'
