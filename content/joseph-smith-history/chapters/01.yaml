chapter: 1
title: Hear Him
tagline: Joseph Smith’s own account of the First Vision, Moroni’s visits, the coming forth of the Book of Mormon, and the restoring of the Aaronic Priesthood.
when: 'Written 1838–39; the events of 1805–1829.'

setting: |
  Joseph Smith—History is made of excerpts from the official history that Joseph Smith and his scribes prepared in 1838–39. It ran as a serial in the *Times and Seasons* at Nauvoo, Illinois, from 15 March 1842, and it became scripture with the rest of the Pearl of Great Price when the First Presidency and a general conference made that book a standard work on 10 October 1880.

  Every passage has two times. One is the time it tells of: Joseph Smith’s birth in Vermont in 1805, the family farm on the line between Palmyra and Manchester in western New York, the vision of 1820, Moroni’s visits from 1823, and the years of the plates, the translation and the priesthood that ended in 1829, much of it in Harmony, Pennsylvania. The other is the time it was written, eighteen years after the vision, when Joseph Smith led a growing church. His first account of the vision, written in 1832, is personal and centers on what it meant to him; by 1838 he told it with its meaning for the Church and the world in view. The history was dictated between periods of intense opposition, and it opens by answering the hostile reports then in circulation (1:1).

  After verse 75 the page prints Oliver Cowdery’s own account of the restoring of the priesthood, from the *Messenger and Advocate* of October 1834.

thread: |
  The chapter turns on a question and on how to get an answer. In the middle of a revival a boy asks himself, “Who of all these parties are right; or, are they all wrong together? If any one of them be right, which is it, and how shall I know it?” (1:10). The Bible cannot settle it, because the preachers read the same passages in opposite ways (1:12), but the Bible can tell him where to ask, and James 1:5 sends him to God. The first movement closes on the result: “I had found the testimony of James to be true” (1:26).

  The second asking grows out of the first. In 1823 he prays again, “for I had full confidence in obtaining a divine manifestation, as I previously had one” (1:29), and the answer is Moroni, the plates, and in time the priesthood. The plates are not handed over that night. Moroni comes four times in a night and a day with the same message; the boy who prayed for forgiveness is told he may get the plates only “to glorify God” (1:46); and four years of meetings at the hill pass before they are given (1:53–54, 59). Through all of it runs a testimony that persecution does not change: “I had seen a vision; I knew it, and I knew that God knew it” (1:25), affirmed again in the years that follow (1:27, 58).

  The third movement puts the record in his hands in 1827 and brings the asking round once more. Translating it, Joseph and Oliver Cowdery find baptism for the remission of sins in the book and go into the woods “to pray and inquire of the Lord” (1:68); the answer is John the Baptist and the Aaronic Priesthood. The persecution follows him there too (1:58, 60–61, 74–75).

  Written in 1838, the account tells the vision as the beginning of what its first sentence calls “the rise and progress of The Church of Jesus Christ of Latter-day Saints.” The boy’s private question becomes the opening of the Restoration.

sections:
  - range: 1-2
    heading: Why the history was written
    plain: |
      Many reports have been spread by people meaning harm, all meant to damage the Church’s character and its progress. Joseph Smith writes this history to set the public right and to give anyone looking for the truth the facts as they happened, about himself and about the Church, as far as he has them. He will tell the events truly as they happened or as they now stand, in 1838, the eighth year since the Church was organized.
  - range: 3-4
    heading: The family and its moves
    plain: |
      Joseph Smith was born on 23 December 1805 in Sharon, Windsor County, Vermont. When he was about ten his father left Vermont for Palmyra, in Ontario (now Wayne) County, New York, and about four years later moved the family into Manchester, in the same county. The family had eleven members: his father, Joseph Smith Sr.; his mother, Lucy Mack Smith; his brothers Alvin (who died 19 November 1823 at twenty-five), Hyrum, Joseph himself, Samuel Harrison, William and Don Carlos; and his sisters Sophronia, Catherine and Lucy.
  - range: 5-10
    heading: The religious excitement
    plain: |
      In the second year after the move to Manchester an unusual religious excitement began. It started with the Methodists but spread to every church in the region, and great numbers joined one church or another, with some crying “Here it is!” and others “There!” Some argued for the Methodists, some for the Presbyterians, some for the Baptists. The converts had professed great love and the clergy great zeal to get everyone converted, but when the converts divided among the churches the good feeling proved more pretended than real, and it ended in quarrels of priest against priest and convert against convert.

      Joseph was fourteen. His mother, his brothers Hyrum and Samuel Harrison and his sister Sophronia joined the Presbyterians. He was deeply troubled, went to the meetings when he could, and leaned toward the Methodists, but the strife was so great that a boy his age could not decide who was right. The Presbyterians argued against the Baptists and Methodists, and they argued back. In the middle of it he kept asking himself: Which of these churches is right, or are they all wrong? If one is right, which is it, and how can I know?
  - range: 11-13
    heading: Ask of God
    plain: |
      In that distress he read James 1:5: if any of you lacks wisdom, let him ask God, who gives to everyone generously and does not scold, and it will be given him. Never, he says, did any scripture come with more power to anyone’s heart than this did to his. He thought about it again and again. If anyone needed wisdom from God, he did, and he could not get it from the Bible alone, because the teachers of the churches read the same passages so differently that no argument from scripture could settle the question. He saw that he must either stay in darkness and confusion or do as James said, and since God gives generously and does not scold, he decided to try.
  - range: 14-20
    heading: The vision in the grove
    plain: |
      On a clear morning early in the spring of 1820 he went into the woods to pray, the first time he had tried to pray aloud. As soon as he knelt, a power seized him and bound his tongue, and thick darkness gathered around him, until he felt he was about to be destroyed, not by something imagined but by a real being from the unseen world. With all his strength he called on God to deliver him, and at the moment he was ready to give up he saw a pillar of light, brighter than the sun, come down over his head until it rested on him. He was freed at once, and in the light he saw two Personages, whose brightness and glory are beyond description, standing above him in the air. One called him by name and said, pointing to the other, “This is My Beloved Son. Hear Him!”

      When he could speak he asked which church was right and which he should join. He was told to join none of them, for they were all wrong; their creeds were an abomination in the Lord’s sight, and their professors corrupt: they come near to God with their lips while their hearts are far from Him, teach human commandments as doctrine, and have the form of godliness while denying its power. He was again forbidden to join any of them and was told many other things he could not write then. He came to himself lying on his back, without strength, and went home. When his mother asked what was wrong, he said, “Never mind, all is well,” and told her he had learned for himself that Presbyterianism was not true. The adversary, he reflects, seems to have known early that he would disturb his kingdom.
  - range: 21-26
    heading: “I had actually seen a light”
    plain: |
      A few days later he told the vision to one of the Methodist preachers active in the revival, who treated it with contempt, said it was of the devil, and said there were no visions or revelations in these days; all that had ended with the apostles. His telling the story stirred prejudice among religious people and growing persecution, and men of standing joined in stirring up the public against him, though he was a poor, obscure boy of fourteen. He has often wondered why such a boy, working for a bare living, should draw the attention and the bitter hostility of the leading men of the popular churches, and it often grieved him.

      He compares himself to Paul before King Agrippa: Paul told of a light and a voice, few believed him, some called him dishonest or mad, but none of that undid the vision; Paul knew it to the end. So it was with Joseph: he had seen a light and two Personages who spoke to him, and though he was hated for saying so, it was true. He asked why he should be persecuted for telling the truth; he could not deny the vision and dared not, for God knew it too. His mind was now settled that he should join none of the churches and wait for further direction. He had found James’s promise true: one who lacks wisdom may ask God and receive, and not be scolded.
  - range: 27-29
    heading: Three years, and a prayer for forgiveness
    plain: |
      He went on with his ordinary work until 21 September 1823, persecuted the whole time by all sorts of people, religious and not, because he kept saying he had seen a vision. In those years he was forbidden to join any church, he was very young, and he was mistreated by people who should have been his friends and who, if they thought him deluded, should have tried kindly to set him right. So he was open to every kind of temptation. Mixing with all kinds of company, he often made foolish mistakes and showed a young man’s weaknesses, which he regrets, and which offended God. No one should think he committed great or malicious sins; he had no inclination to them. But he was light-minded and sometimes kept merry company, which did not fit someone God had called. Anyone who remembers how young he was, and how cheerful by nature, will not find that strange.

      He often felt condemned for his faults. On the night of 21 September, after he had gone to bed, he prayed for forgiveness of all his sins and follies, and for a manifestation that would show him where he stood with God. He was fully confident he would receive one, since he had had one before.
  - range: 30-35
    heading: Moroni and the book
    plain: |
      As he prayed, a light appeared in his room and grew until the room was brighter than noon, and a personage stood beside his bed in the air, his feet not touching the floor. He wore a loose robe of a whiteness beyond anything earthly, open at the front; his hands and arms a little above the wrists, his feet and legs a little above the ankles, and his head and neck were bare. His whole person was glorious beyond description and his face was like lightning; the room was light, but brightest close around him. Joseph was afraid at first, but the fear soon left him.

      The messenger called him by name, said he had been sent from God’s presence, and said his name was Moroni. God had a work for Joseph to do, and his name would be spoken of for good and for evil among all nations and peoples. A book written on gold plates lay buried, giving an account of the former inhabitants of this continent and where they came from, and it contained the fulness of the everlasting gospel as the Savior had given it to them. With the plates were two stones in silver bows, fastened to a breastplate, which make up what is called the Urim and Thummim. Having and using such stones was what made someone a seer in former times, and God had prepared them for translating the book.
  - range: 36-41
    heading: The prophecies Moroni quoted
    plain: |
      Then he began to quote prophecies of the Old Testament: part of Malachi 3, and Malachi 4 with some differences from the Bible’s wording. The day is coming that will burn like an oven, and the proud and the wicked will burn like stubble, burned by those who come, so that they are left neither root nor branch. “I will reveal unto you the Priesthood, by the hand of Elijah the prophet,” before the great and dreadful day of the Lord. He will plant in the hearts of the children the promises made to the fathers, and the children’s hearts will turn to their fathers; if not, the whole earth would be utterly wasted at His coming.

      He also quoted Isaiah 11 and said it was about to be fulfilled. He quoted Acts 3:22–23 exactly as the New Testament has it and said the prophet Moses spoke of was Christ, and that the day when those who would not hear Him would be cut off from the people had not yet come but soon would. He quoted Joel 2:28–32 and said it was not yet fulfilled but soon would be, and that the fulness of the Gentiles would soon come in. He quoted many other passages and gave many explanations that Joseph could not write down.
  - range: 42-49
    heading: Three visits in the night, and a fourth in the field
    plain: |
      When Joseph got the plates (the time had not yet come), he was to show them, and the breastplate with the Urim and Thummim, to no one but those he was commanded to show them to, or he would be destroyed. As Moroni spoke, Joseph saw in vision the place where the plates lay, so clearly that he knew it when he went there. Then the light drew in around the messenger until the room was dark except near him; a passage seemed to open straight up into heaven, and he rose through it and was gone.

      While Joseph lay wondering at it, the room lit again and the messenger stood by his bed. He repeated everything without the slightest change, then told of great judgments coming on the earth in this generation, famine, sword and pestilence, and ascended. Joseph, now wide awake and astonished, saw him come a third time and repeat it all, adding a warning: because his family was poor, Satan would tempt him to get the plates to become rich. He must have no aim in getting them but to glorify God and build His kingdom, or he could not get them. The messenger ascended again, the rooster crowed, and the night was gone.

      Joseph got up and went to work as usual, but he had no strength. His father, working beside him, saw something was wrong and sent him home. Climbing the fence out of the field, he collapsed and lost consciousness. He came to hearing his name: the messenger stood over him in light, repeated everything from the night before, and commanded him to tell his father of the vision and the commandments.
  - range: 50-54
    heading: The hill, and four years
    plain: |
      He obeyed. His father said it was of God and told him to do as the messenger said. Joseph went to the place, and because the vision had been so distinct he knew it the moment he arrived: a large hill near the village of Manchester, the highest in the neighborhood. On its west side, near the top, under a large stone, thick and rounded in the middle and thinner toward the edges, so that only its middle showed above the ground, lay the plates in a stone box.

      He cleared away the earth, levered up the stone, and saw the plates, the Urim and Thummim and the breastplate, as the messenger had said. The box was made of stones set in some kind of cement, with two stones laid across its bottom, and the plates and the other things lay on them. He tried to take them out, but the messenger forbade him: the time had not come, and would not for four years. He was to come back to the place in exactly a year, and to keep coming until the time came. He did, and each year he found the messenger there and was taught what the Lord was going to do and how His kingdom was to be conducted in the last days.

  - range: 55-58
    heading: Alvin, Josiah Stowell and Emma
    plain: |
      Because his father had little, the family worked with their hands, hiring out by the day and taking work where they could find it, at home and away, and by steady labor they made a comfortable living. In 1823 the family suffered a great loss when Joseph’s oldest brother, Alvin, died. In October 1825 Joseph hired on with an old man named Josiah Stoal (Stowell) of Chenango County, New York. Stowell had heard that Spaniards had once opened a silver mine in Harmony, Susquehanna County, Pennsylvania, and had been digging to find it. He took Joseph with his other hands to dig; Joseph worked at it nearly a month without success and finally persuaded the old man to stop. That is where the widespread story that he was a money-digger came from.

      While he worked there he boarded with Isaac Hale of Harmony, and there he first saw Isaac’s daughter Emma, who became his wife. Because he kept saying he had seen a vision, persecution still followed him, and Emma’s family strongly opposed the marriage. So the two went elsewhere and were married on 18 January 1827 at the house of Squire Tarbill in South Bainbridge, Chenango County, New York, while Joseph was still working for Stowell. Right after the wedding he left Stowell’s, went to his father’s, and farmed with him that season.
  - range: 59-62
    heading: The plates delivered and kept
    plain: |
      At last the time came. On 22 September 1827, when Joseph went to the place as usual at the end of another year, the same messenger gave him the plates, the Urim and Thummim and the breastplate, with a charge: he was responsible for them. If he let them go through carelessness or neglect he would be cut off; but if he did everything he could to keep them safe until the messenger called for them, they would be protected.

      He soon learned why. As soon as people knew he had them, they tried every scheme they could invent to take them, and the persecution grew more bitter than before. By God’s wisdom the plates stayed safe in his hands until he had done what was required with them; then, as arranged, the messenger called for them, and Joseph gave them back. The messenger still has them, Joseph writes, on this day, 2 May 1838.

      The excitement went on, and rumor spread countless falsehoods about him and his family. The persecution became so unbearable that he had to leave Manchester and go with Emma to Susquehanna County, Pennsylvania. They were very poor, and while they were getting ready a friend appeared: Martin Harris, a respected farmer of Palmyra township, who gave them fifty dollars for the journey. With that help Joseph reached Pennsylvania and at once began copying characters from the plates. Between December, when he arrived at his father-in-law’s house, and the following February, he copied many of them and translated some by means of the Urim and Thummim.
  - range: 63-65
    heading: Martin Harris and Professor Anthon
    plain: |
      In February Martin Harris came, took the characters Joseph had copied, and set out for New York City. Joseph gives Harris’s account as Harris told it to him after he came back. Harris showed the translated characters and their translation to Professor Charles Anthon, a man known for his learning. Anthon said the translation was correct, more so than any translation from Egyptian he had seen. Of the characters not yet translated he said they were Egyptian, Chaldaic, Assyriac and Arabic, and genuine, and he wrote a certificate saying so for the people of Palmyra.

      As Harris was leaving, Anthon called him back and asked how the young man had learned there were gold plates in that place. Harris answered that an angel of God had revealed it to him. Anthon asked for the certificate, tore it up, and said there was no such thing now as the ministering of angels; if Harris would bring him the plates, he would translate them. Harris said part of the plates were sealed and he was forbidden to bring them. Anthon replied, “I cannot read a sealed book.” Harris then went to Dr. Mitchell, who confirmed what Anthon had said about the characters and the translation.
  - range: 66-67
    heading: Oliver Cowdery
    plain: |
      On 5 April 1829 Oliver Cowdery, whom Joseph had never seen, came to his house. He had been teaching school near Joseph’s father’s home, and because the Smiths sent children to his school he boarded with them for a time. There the family told him that Joseph had received the plates, and he had come to ask Joseph about them. Two days later, on 7 April, Joseph began to translate the Book of Mormon, and Oliver began writing for him.
  - range: 68-75
    heading: The Aaronic Priesthood
    plain: |
      They went on translating, and one day in May 1829 they went into the woods to pray and ask the Lord about baptism for the remission of sins, which they had found in the record. As they prayed, a messenger from heaven came down in a cloud of light, laid his hands on them, and ordained them. He addressed them as his fellow servants and, in the name of the Messiah, conferred on them the Priesthood of Aaron, which holds the keys of the ministering of angels, of the gospel of repentance, and of baptism by immersion for the remission of sins; it would never again be taken from the earth until the sons of Levi offer the Lord an offering in righteousness.

      He said this priesthood did not have the power to lay on hands for the gift of the Holy Ghost, but that power would be given them later. He commanded them to be baptized, Joseph baptizing Oliver first and then Oliver baptizing Joseph, and then to ordain each other to the Aaronic Priesthood, and they did. The messenger said his name was John, the one the New Testament calls John the Baptist, and that he acted under the direction of Peter, James and John, who held the keys of the Melchizedek Priesthood. That priesthood would be given them in due time, and Joseph would be called the first elder of the Church and Oliver the second. The ordination and the baptisms took place on 15 May 1829.

      As they came up out of the water they received great blessings. The Holy Ghost fell on Oliver, and he stood and prophesied of things soon to happen; when Joseph had been baptized he too prophesied, about the rise of the Church, much else concerning it, and this generation. They were filled with the Holy Ghost and rejoiced in God their Savior. With their minds enlightened, they began to understand the scriptures, even their obscure passages, as they never had before. Meanwhile they kept the priesthood and their baptism secret because of a spirit of persecution already stirring in the neighborhood. Professors of religion had threatened more than once to mob them, and only the influence of Emma’s family, under God’s providence, held the mobs back: the Hales had become friendly, opposed mobs, wanted the translation to go on undisturbed, and promised to protect them from any unlawful action as far as they could.

notes:
  - ref: 1
    phrase: I have been induced to write this history
    kind: history
    title: Why Joseph Smith wrote this history
    body: |
      This history was written as a public answer, and it was not the first account Joseph Smith gave of his early life. He kept no record of his life in his first twenty-four years: he had little schooling and found it hard to express himself in writing. When the Lord commanded him to keep a history soon after the Church was organized, one of the first things he set down was an account of the First Vision, the one now known as the 1832 account.

      The history begun in 1838 was a larger undertaking. Its account of the vision opened what became a six-volume history of his life, copied by scribes into large bound volumes. The draft that was published in the *Times and Seasons* and then in the Pearl of Great Price is in the hand of the clerk James Mulholland.

      It opens with the reports “put in circulation by evil-disposed and designing persons” and promises the facts “as they have transpired”: the history is an answer to those reports, with Joseph Smith’s own testimony at its center.
    sources: [gt-first-vision-accounts, jsp-accounts-first-vision, haws-reconciling]
  - ref: 3
    phrase: moved to Palmyra, Ontario (now Wayne) county, in the State of New York
    kind: history
    title: From Vermont to Manchester
    body: |
      The Smiths came to western New York as many New England families did, after years of failed harvests. From their marriage Joseph Sr. and Lucy Mack Smith had known economic hardship, and they moved several times between villages in Vermont and New Hampshire. A bad harvest and financial troubles finally sent them west in 1816 and 1817, to a region whose fertile soil and cheap land had been drawing New Englanders since the late 1700s.

      In Palmyra village they rented a house for two years and lived on day labor and a small shop. Then they took up a hundred acres of densely forested land a few miles south, in Manchester, and in the winter of 1818–19 they moved into a log home built by Joseph Sr. and his sons Alvin and Hyrum; the house itself stood just north of the farm, over the line in Palmyra Township.

      The same settlement brought the churches. As the population grew, Baptists, Methodists, Presbyterians and Quakers all came to the area and competed for converts, which is the scene verses 5–10 describe.
    sources: [cht-smith-family, cht-palmyra-manchester, cht-sacred-grove]
  - ref: 5
    phrase: an unusual excitement on the subject of religion
    kind: history
    title: The religious excitement, and when it came
    body: |
      Joseph Smith grew up in the revivals that historians call the Second Great Awakening, and the documents show religious excitement in his district in the years he names. After the Revolution the churches lost the government support some had enjoyed, attendance fell below a fifth of the population in most states, and preachers of many churches set out after converts. Methodists and Baptists rode circuits through the countryside, and in rural areas their camp meetings drew crowds for days at a time. Joseph went to such meetings. He told a visitor in 1844 that when his mother, brother and sister “got Religion” at a revival, “he wanted to get Religion too wanted to feel & shout like the Rest but could feel nothing.”

      The date has been argued over. A critic wrote in 1967 that there was no revival in Palmyra in the spring of 1820 and so the account must be false. A Latter-day Saint historian answers that the text claims neither thing. Verse 5 puts the excitement “in the second year after our removal to Manchester,” about 1819, and not in Palmyra village but across “the whole district of country”; to Methodists a district was something like a stake today. Methodists of the Genesee Conference met in 1819 at Vienna (now Phelps), within walking distance of the Smith farm, and a newspaper and a minister’s diary confirm a camp meeting at Palmyra in June 1820.

      The documents bear this out: a Methodist revival outside Palmyra in 1818, the Vienna meeting the next year, a traveling preacher’s journals of excitement in the area in 1819 and 1820, a three-day camp meeting in Palmyra in the late spring of 1820, and wider revivals in 1824. The text itself dates only the vision, not the revival, to the spring of 1820 ([[JS—H 1:14]]).
    sources: [cht-awakenings-revivals, jsp-neibaur-1844, harper-three-arguments, gt-first-vision-accounts]
  - ref: 11
    phrase: If any of you lack wisdom, let him ask of God
    kind: scripture
    title: James 1:5, and why the Bible sent him to God
    body: |
      James 1:5 solved Joseph Smith’s problem by moving it: the Bible could not tell him which church was right, but it could tell him whom to ask. Verse 12 says why argument from scripture had failed. The teachers of the different sects “understood the same passages of scripture so differently as to destroy all confidence in settling the question by an appeal to the Bible.” He had searched the Bible before as though it held every answer; now it was telling him he could go to God himself for an answer to his own question.

      How the verse reached him is remembered in two ways. In one telling, Joseph heard a minister quote it in a sermon. Joseph himself told a visitor in 1844 that he “opened his Bible the first Passage that struck him was if any man lack Wisdom let him ask of God.”

      James’s promise goes on with a condition: “But let him ask in faith, nothing wavering” ([[James 1:6]]). Joseph had never prayed aloud, but he trusted that promise and decided to pray. The chapter comes back to the verse when the first movement closes: “I had found the testimony of James to be true—that a man who lacked wisdom might ask of God, and obtain, and not be upbraided” ([[JS—H 1:26]]).
    sources: [saints-v1-01, jsp-neibaur-1844, lds-scriptures]
  - ref: 14
    phrase: I retired to the woods to make the attempt
    kind: history
    title: The woods on the Smith farm
    body: |
      The woods were on the family’s own land. By 1820 the Smiths had cleared about thirty acres of their forested lot, and the vision came somewhere in the part still wooded, probably near ground they were clearing for future crops. The stand was most likely old-growth timber, some trees as tall as a hundred feet, and its density gave a fourteen-year-old a place to pray alone. It is known today as the Sacred Grove.
    sources: [cht-sacred-grove]
  - ref: 17
    phrase: I saw two Personages
    kind: history
    title: Four accounts of the vision
    body: |
      Joseph Smith left four accounts of the First Vision, and this one, from 1838, is the third. They tell one story, though they naturally differ in emphasis and detail, and the Joseph Smith Papers publish all of them. The other three:

      - **1832**, the earliest and most personal, partly in his own hand: “a piller of light above the brightness of the sun at noon day come down from above and rested upon me … and I saw the Lord and he spake unto me saying Joseph my son thy sins are forgiven thee.”
      - **1835**, told to a visitor in Kirtland and written into his journal: “a pillar of fire appeared above my head … a personage appeard in the midst, of this pillar of flame … another personage soon appeard like unto the first, he said unto me thy sins are forgiven thee, he testifyed unto me that Jesus Christ is the son of God; and I saw many angels in this vision.”
      - **1842**, in the *Times and Seasons*: “two glorious personages who exactly resembled each other in features, and likeness,” who told him that “all religious denominations were believing in incorrect doctrines” and promised “that the fulness of the gospel should at some future time be made known unto me.”

      Each was given on a different occasion: a private history, a conversation with a visitor, an official history, an answer to an inquiry. The largest are in 1832. There Joseph prays for forgiveness of his sins, and in the later accounts to know which church to join; the two questions were closely related for him, and both came from his desire to be saved. There he says he saw “the Lord”; in this account the Father introduces the Son, a detail the 1832 account lacks, but every account centers on Jesus Christ. A scribe added “in the 16th year of my age” to the 1832 account, but every later account gives his age as fourteen, as verses 7 and 14 do here, and the Church judges the 1832 figure most likely a scribal mistake.

      The other accounts also give some of the “many other things” that verse 20 leaves unwritten: the forgiveness of his sins, a witness that Jesus Christ is the Son of God, and the promise of the fulness of the gospel.
    sources: [gt-first-vision-accounts, jsp-accounts-first-vision, js-history-1832, jsp-journal-1835-1836, jsp-church-history-1842, saints-v1-01]
  - ref: 17
    phrase: This is My Beloved Son. Hear Him!
    kind: christ
    title: “This is My Beloved Son. Hear Him!”
    body: |
      The Father speaks one sentence in the vision, and it hands everything that follows to the Son, who answers Joseph’s questions; the words of verses 18–20 are His.

      On three occasions in scripture the Father introduces His Son in few words: on the Mount of Transfiguration, “This is my beloved Son: hear him” ([[Mark 9:7]]); at Bountiful, “Behold my Beloved Son, in whom I am well pleased, in whom I have glorified my name—hear ye him” ([[3 Ne. 11:7]]); and here. In each case, President Russell M. Nelson observed, those who heard were afraid, and to some degree desperate, just before: the apostles in the cloud, the Nephites after days of destruction and darkness, and Joseph Smith “in the grips of a force of darkness just before the heavens opened.” His conclusion: “when we are surrounded by uncertainty and fear, what will help us the very most is to hear His Son.”
    sources: [gt-first-vision-accounts, nelson-hear-him, lds-scriptures]
  - ref: 18
    phrase: and which I should join
    kind: history
    title: “It had never entered into my heart that all were wrong”
    body: |
      Both manuscripts of the history have a parenthesis in this verse that the 1921 edition, whose wording this site prints, leaves out: Joseph asked “which of all the sects was right, (for at this time it had never entered into my heart that all were wrong) and which I should join.” James E. Talmage removed it in preparing the 1902 edition, and it was put back in 1981; the edition in the Gospel Library today has it.

      The clause answers a question that verse 10 raises. There Joseph asks himself, “are they all wrong together?”; here he says the thought had never entered his heart. One way to reconcile them is the word *heart*: he had considered the possibility in his mind but had never believed it. Another reading, offered by a Latter-day Saint historian as one possibility, looks at whom “these parties” in verse 10 means. In the manuscript the question follows directly on the Presbyterians, Baptists and Methodists of verse 9, so he may have wondered whether the three churches around him were all wrong; what had never entered his heart was that he should join no church at all.
    sources: [jsp-history-draft2, jsp-history-a1, pgp-1921, lds-scriptures, haws-reconciling]
  - ref: 19
    phrase: all their creeds were an abomination in his sight
    kind: history
    title: “All their creeds were an abomination”
    body: |
      A creed is a formal statement of belief, and the verse condemns those statements and the professors who drew near to God “with their lips.” The word comes from Latin *credo*, “I believe.” The New Testament has short, personal testimonies of Christ, but nothing like the creeds of later centuries. One Latter-day Saint reading traces them in three stages: the gospel taught plainly; early creeds that were largely unobjectionable but began to add incorrect ideas; and after the Reformation, a flood of creeds written to set one church apart from another. On that reading, “Latter-day Saints should not condemn all creeds equally, for all creeds were not created equal.”

      Joseph Smith said in 1843 what he found wrong with them: “I cannot believe in any of the creeds of the different denominations, because they all have some things in them I cannot subscribe to, though all of them have some truth.” They “set up stakes, and say hitherto shalt thou come, and no further.”

      The rest of the verse gives the Lord’s reason in scripture’s own words: “they draw near to me with their lips, but their hearts are far from me” is Isaiah’s ([[Isa. 29:13]]), and “having a form of godliness, but they deny the power thereof” is Paul’s ([[2 Tim. 3:5]]). The 1832 account has the same charge, “they draw near to me with their lips while their hearts are far from me,” and the 1842 account says the churches were “believing in incorrect doctrines.”
    sources: [sc-knowhy-773, welch-creeds, jsp-history-e1, lds-scriptures, js-history-1832, jsp-church-history-1842]
  - ref: 21
    phrase: all such things had ceased with the apostles
    kind: history
    title: The Methodist preacher
    body: |
      Joseph Smith does not name the preacher, and a historian of the vision says it is not clear whether he was the visiting revivalist George Lane or one of the local Methodist ministers. What can be said is why such a man might answer as he did. Methodism had grown by taking people’s spiritual experiences seriously, but by 1820 its ministers were moving toward what they saw as a more respectable and reasonable religion, and they were wary of “enthusiasm,” a charge that meant a person was thought unstable and irrational. John Wesley, Methodism’s founder, had feared his people would become “a dead sect, having the form of religion without the power.”

      The same historian suggests the preacher may have taken Joseph’s story the harder if Joseph told him that the professors of religion denied God’s power (1:19). Joseph, who had caught the Methodists’ spirit and finally felt in the woods the power their preachers urged on converts, expected welcome news; by his account he was “greatly surprised.”
    sources: [harper-three-arguments]
  - ref: 24
    phrase: I felt much like Paul
    kind: scripture
    title: Like Paul before Agrippa
    body: |
      Joseph Smith takes Paul’s defense before King Agrippa as the pattern of his own case: a light, a voice, and hearers who would not believe. Paul tells of “a light from heaven, above the brightness of the sun” and a voice speaking to him ([[Acts 26:13–14]]); the governor Festus cries, “Paul, thou art beside thyself; much learning doth make thee mad” ([[Acts 26:24]]); and Paul answers that he “was not disobedient unto the heavenly vision” ([[Acts 26:19]]). Joseph’s pillar of light was likewise “above the brightness of the sun” (1:16).

      Paul’s vision is told three times in Acts ([[Acts 9:3–8]]; [[Acts 22:6–11]]; [[Acts 26:12–18]]), each with its own emphasis, and the Church points to those accounts as a scriptural example of why Joseph Smith’s accounts differ in emphasis and detail.
    sources: [lds-scriptures, gt-first-vision-accounts]
  - ref: 28
    phrase: I frequently fell into many foolish errors
    kind: history
    title: Foolish errors, and a prayer for forgiveness
    body: |
      Joseph Smith says plainly that the three years after the vision were not spotless, and his accounts of 1832 and 1835 also tell of his sins before the angel came. The manuscript of this history was franker than the verse as printed. Where the verse has “the foibles of human nature,” the draft in the clerk’s hand has “the corruption of human nature which I am sorry to say led me into divers temptations to the gratification of many appetites offensive in the sight of God.” Later, preparing the history for publication under Joseph Smith’s direction, Willard Richards revised the passage, taking out some words and adding the sentences that now say he was guilty of no “great or malignant sins,” only of “levity” and “jovial company.” One reading of these years sees in the struggle a nagging covetousness, sharpened by a family always near a comfortable living and never at it.

      The earlier accounts are shorter and as frank. In 1832 he wrote, “I fell into transgressions and sinned in many things which brought a wound upon my soul”; in 1835, “I was verry concious that I had not kept the commandments, and I repented hartily for all my sins and transgression.” The revelation on Church organization, recorded in 1830, puts the same sequence into scripture: after the remission of his sins he “was entangled again in the vanities of the world,” and “after repenting, and humbling himself sincerely, through faith, God ministered unto him by an holy angel” ([[D&C 20:5–6]]).

      By 1823 he could no longer feel the forgiveness and peace he had known after the First Vision. In the 1832 account the angel, before saying anything of plates, “said the Lord had forgiven me my sins.”
    sources: [jsp-history-draft2, harper-probation, js-history-1832, jsp-journal-1835-1836, saints-v1-03, lds-scriptures]
  - ref: 32
    phrase: his countenance truly like lightning
    kind: history
    title: The angel the early Saints spoke of first
    body: |
      Moroni’s visit is the first of Joseph Smith’s visions to appear in the historical record, and his early followers typically spoke of it as the beginning of his calling. A revelation of 1830 already describes the angel by the two details verses 31–32 dwell on, a holy angel “whose countenance was as lightning, and whose garments were pure and white above all other whiteness” ([[D&C 20:6]]). His mother, his brother William and Oliver Cowdery all wrote accounts of the Restoration that begin with Moroni in 1823. Joseph himself said little in public about the First Vision for many years, but he testified often of Moroni and the translation of the Book of Mormon.

      His own descriptions of the angel are “simple, sober, and consistent.” In 1835 he told a visitor what verse 31 tells here: “his hands and feet were naked pure and white, and he stood between the floors of the room, clothed with purity inexpressible.”
    sources: [cht-angel-moroni, gt-first-vision-accounts, jsp-journal-1835-1836, lds-scriptures]
  - ref: 33
    phrase: his name was Moroni
    kind: history
    title: Moroni, not Nephi
    body: |
      The messenger was Moroni, the last of the ancient record keepers to write on the plates; the 1832 account says they were “engraven by Maroni & his fathers.” For a time, though, this history called him Nephi.

      Joseph Smith’s early accounts call the messenger simply “the angel.” He named him Moroni in a revelation printed in the 1835 Doctrine and Covenants (now [[D&C 27:5]]), in an editorial of July 1838, and in a letter of 1842 ([[D&C 128:20]]). But the earliest manuscript of this history, the draft in the hand of the clerk James Mulholland, reads “his name was Nephi,” and the *Times and Seasons* printed it so on 15 April 1842. The error was most likely the clerk’s. Mulholland seems not to have taken dictation but to have worked from earlier sources that no longer survive, and many of them gave the angel no name. Publications that relied on his draft carried “Nephi” into the 1840s and 1860s.

      Brigham Young suspected a clerical error and had the Church’s historians look into it. Their correction is on the manuscripts still. In the draft Albert Carrington, the Church Historian, probably in 1871, changed “Nephi” to “Moroni” and called the original a “clerical error”; in the large manuscript volume a note reads, “Evidently a clerical error … Should read Moroni.” No evidence shows that Joseph Smith himself ever called the angel Nephi.
    sources: [cht-angel-moroni, js-history-1832, jsp-history-draft2, jsp-history-a1, jsp-times-seasons-1842-04-15-p753, lds-scriptures]
  - ref: 34
    phrase: the fulness of the everlasting Gospel
    kind: scripture
    title: The everlasting gospel, and the angel John saw
    body: |
      A later revelation uses the same words of the book when it speaks of Moroni: “Moroni, whom I have sent unto you to reveal the Book of Mormon, containing the fulness of my everlasting gospel” ([[D&C 27:5]]). The same verse of the history says whose gospel it is, “as delivered by the Savior to the ancient inhabitants”: the record tells of Jesus Christ visiting that people and teaching them the fulness of His gospel ([[3 Ne. 11]]).

      The phrase also explains why Latter-day Saints have long read Moroni’s visit as a fulfilment of John’s vision: “I saw another angel fly in the midst of heaven, having the everlasting gospel to preach unto them that dwell on the earth” ([[Rev. 14:6]]). A revelation of 1831 takes up John’s words: “I have sent forth mine angel flying through the midst of heaven, having the everlasting gospel, who hath appeared unto some and hath committed it unto man” ([[D&C 133:36]]). That revelation does not name the angel; he is presumed to be Moroni because Moroni was the guardian and revealer of the record. The prophecy may have more than one fulfilment, since other messengers, John the Baptist and Peter, James and John among them, also brought parts of the gospel to be preached to the world.
    sources: [lds-scriptures, saints-v1-03, sc-knowhy-703]
  - ref: 35
    phrase: two stones in silver bows
    kind: history
    title: The Urim and Thummim
    body: |
      The instrument Moroni described is the one the Book of Mormon calls the “interpreters,” and the name *Urim and Thummim* came to it later. Those who saw it described a pair of clear stones set in metal rims and joined by a metal bow, which Joseph sometimes called “spectacles”; Moroni adds that they were fastened to a breastplate. A few years after the Book of Mormon was published, Joseph Smith and his associates began to call the instrument by the Old Testament name, after the sacred objects the priests of Israel used to receive word from God (see the note on [[Ex. 28:30]]). So the history, written in 1838, gives Moroni’s description in the later name: “what is called the Urim and Thummim.”

      Moroni’s remark that the “possession and use of these stones were what constituted ‘seers’” matches what the Book of Mormon says of the interpreters. Ammon tells King Limhi of a man who can translate ancient records with such instruments: “the things are called interpreters,” and “whosoever is commanded to look in them, the same is called seer” ([[Mosiah 8:13]]).
    sources: [gt-book-of-mormon-translation, saints-v1-03, lds-scriptures]
  - ref: 36
    phrase: with a little variation from the way it reads in our Bibles
    kind: scripture
    title: Moroni’s Malachi
    body: |
      Moroni’s wording of Malachi 4 is taken up verse by verse in the notes on Malachi: the burning of verse 1 ([[Mal. 4:1]]), the priesthood revealed “by the hand of Elijah” ([[Mal. 4:5]]), and the promises planted in the hearts of the children ([[Mal. 4:6]]); on why Malachi 3 was given to the Nephites, see [[Mal. 3:1]]. What this chapter adds is what became of the wording and how Joseph Smith remembered the night.

      Verses 38–39 stand alone in the Doctrine and Covenants as [[D&C 2]], the angel’s words lifted out of this history. And when Joseph told the story to a visitor in 1835, the angel “explained many of the prophesies to” him, “one I will mention which is in Malachi 4.” Of everything Moroni quoted, that is the passage Joseph named.
    sources: [lds-scriptures, jsp-journal-1835-1836]
  - ref: 40
    phrase: saying that it was about to be fulfilled
    kind: scripture
    title: About to be fulfilled
    body: |
      Moroni did more than quote: to Isaiah’s, Peter’s and Joel’s prophecies he added a word about their time, and those words are what this chapter adds to the notes on the passages themselves. Isaiah 11, the shoot from the stump of Jesse and the ensign the Gentiles would seek, “was about to be fulfilled” (see the notes on [[Isa. 11:1]] and [[Isa. 11:10]]); having just told Joseph of the plates, Moroni seems to have been joining the prophecy to the coming forth of the Book of Mormon. The prophet like Moses of Acts 3:22–23 “was Christ,” but the day when those who would not hear him “should be cut off from among the people” had not yet come, “but soon would come” (see the notes on [[Deut. 18:15]] and [[Deut. 18:19]]); “cut off” is the risen Lord’s word for the same penalty ([[3 Ne. 20:23]]), where Peter has “destroyed.” Joel’s outpouring of the Spirit, which Peter had applied to Pentecost, “was not yet fulfilled, but was soon to be” (see the note on [[Joel 2:28]]). And “the fulness of the Gentiles was soon to come in” ([[JS—H 1:41]]).

      Moroni also told Joseph what the prophecies meant for him: the Lord was coming soon, the human family would not fulfill the purpose of its creation unless God’s ancient covenant was first renewed, and God had chosen Joseph to renew it.
    sources: [lds-scriptures, sc-knowhy-50, saints-v1-03]
  - ref: 45
    phrase: without the least variation
    kind: history
    title: The same message four times
    body: |
      Moroni came four times in less than a day, and Joseph Smith stresses that the message did not change: “without the least variation” on the second visit, “the same things as before” on the third ([[JS—H 1:46]]), “all that he had related to me the previous night” on the fourth, in the field ([[JS—H 1:49]]). His other accounts keep the same count: “he appeared unto me three times in one night and once on the next day” (1832); “the Angel appeard to me again and related the same things and much more, also the third time bearing the same tidings” (1835).

      The repetition marks the message as important: in matters of great importance the Lord has often given the same revelation more than once. Peter saw the vision of the sheet three times, “This was done thrice” ([[Acts 10:16]]), before the gospel went to the Gentiles. Each of Moroni’s returns also added something to the repeated message: the judgments to come “in this generation” on the second visit, the warning against seeking the plates to get rich on the third, the command to tell his father on the fourth.
    sources: [sc-knowhy-809, js-history-1832, jsp-journal-1835-1836, lds-scriptures]
  - ref: 50
    phrase: He replied to me that it was of God
    kind: history
    title: His father’s answer
    body: |
      Joseph had held back from telling his father. Moroni had urged him during the night to tell his father, promising, “He will believe every word you say,” yet in the morning Joseph said nothing, though he knew his father believed in visions and angels. When the angel stood over him by the fence and asked why, Joseph answered that he was afraid his father would not believe him. His 1835 account gives the father’s reply with a detail verse 50 leaves out: “he wept and told me that it was a vision from God to attend to it.”
    sources: [saints-v1-03, jsp-journal-1835-1836]
  - ref: 51
    phrase: a hill of considerable size
    kind: history
    title: The hill
    body: |
      The history gives the hill no name; it is simply “a hill of considerable size.” It was one of the biggest in the area, about three miles from the Smith home, and the plates lay under a large round rock on its west side, not far from the summit. In 1842 Joseph Smith used the name Cumorah when he wrote of Moroni and the book: “Glad tidings from Cumorah! Moroni, an angel from heaven, declaring the fulfilment of the prophets—the book to be revealed” ([[D&C 128:20]]).
    sources: [harper-probation, saints-v1-03, cht-angel-moroni, lds-scriptures]
  - ref: 53
    phrase: I made an attempt to take them out, but was forbidden by the messenger
    kind: history
    title: Why he could not take the plates
    body: |
      Verse 53 says only that the time had not come. Joseph Smith’s earlier accounts say more, and they say it against himself. In 1832 he wrote that he “made three attempts to get them” and cried to the Lord, “why can I not obtain them”; the angel answered, “you have not kept the commandments of the Lord which I gave unto you,” and Joseph explained: “I had been tempted of the advisary and saught the Plates to obtain riches and kept not the commandment that I should have an eye single to the Glory of God therefore I was chastened.” In 1835: “the Angel told me that the reason why I could not obtain the plates at this time was because I was under transgression.”

      It was the temptation Moroni had warned of only hours before ([[JS—H 1:46]]). On the walk to the hill Joseph could not help thinking that he now knew where to find enough treasure to free his family from poverty, and when he reached for the plates a shock went through him, three times. The angel’s lesson was that the plates “are not deposited here for the sake of accumulating gain and wealth for the glory of this world.” Moroni had written the same in his own lifetime, to the young man who would one day stand at the box: “the plates thereof are of no worth, because of the commandment of the Lord. For he truly saith that no one shall have them to get gain; but the record thereof is of great worth” ([[Morm. 8:14]]).
    sources: [js-history-1832, jsp-journal-1835-1836, saints-v1-03, harper-probation, lds-scriptures]
  - ref: 54
    phrase: received instruction and intelligence from him
    kind: history
    title: Four years of instruction
    body: |
      The four years were a schooling, not a wait. Joseph was not simply to pass the time until he got the plates: he was to gain experience in keeping the commandments and strength to resist temptation, and to prove faithful to the angel’s instructions. Those years held visitations, opposition and the ordinary work of keeping a family fed, and through them Moroni was his tutor.

      What Moroni taught at the hill is mostly unrecorded, beyond verse 54’s “what the Lord was going to do, and how and in what manner his kingdom was to be conducted in the last days.” The accounts do show some of the lessons. At the first visit he was shown “the good and the evil, the holy and impure, the glory of God and the power of darkness,” so that he would “know hereafter the two powers.” On a later visit he was allowed to take up the plates and told to “go straight to the house without delay”; he set them down to cover the box, and they were gone. When he received them at twenty-one ([[JS—H 1:59]]), he had faced hard temptations, overcome many, and repented when he fell to others.
    sources: [harper-probation, saints-v1-03]
  - ref: 56
    phrase: the death of my eldest brother, Alvin
    kind: history
    title: Alvin
    body: |
      Alvin’s death is the one family loss the history records, and it struck at Joseph’s hopes for the plates. Born in 1798, the first of the Smith children to live past infancy, Alvin carried much of the family’s support and led the building of its frame house. He believed Joseph’s account of Moroni and urged him to follow the angel’s instructions, and according to a family friend Moroni had told Joseph to bring Alvin with him when the time came to receive the plates. Less than two months after Moroni’s visit Alvin came home with severe stomach pain; a doctor gave him calomel, a mercury compound that many physicians already considered toxic. It made him worse, and he died within days. Dying, he charged Joseph: “Do everything that lies in your power to obtain the records.”

      At the funeral a minister implied that Alvin was in hell because he had not been baptized. In January 1836, in the Kirtland Temple, Joseph saw his brother in the celestial kingdom and “marveled” that he was there, since he “had not been baptized for the remission of sins”; the Lord answered that all who died without the gospel “who would have received it if they had been permitted to tarry, shall be heirs of the celestial kingdom of God” ([[D&C 137:6–7]]). When Joseph taught baptism for the dead in 1840, Hyrum was baptized for Alvin.

      Without Alvin, Joseph did not know whom to bring with him to the hill; the answer is in the note on [[JS—H 1:57]].
    sources: [cht-smith-family, saints-v1-03, saints-v1-04, lds-scriptures]
  - ref: 56
    phrase: Hence arose the very prevalent story of my having been a money-digger
    kind: history
    title: Josiah Stowell and the money-digging story
    body: |
      Joseph Smith did not deny what his critics called him; he told the story himself, in his official history. Josiah Stowell (the history spells it Stoal) hired him in 1825 because some neighbors reputed Joseph a seer, someone who could look into a special stone and find lost or hidden things, and Stowell was hunting silver that local legend said explorers had mined and hidden near Harmony. He offered good wages and a share of whatever they found. “Seeing” with stones was part of the culture Joseph grew up in, a folk practice his family accepted as many around them did. Verse 56 adds what the critics left out: after a month with nothing found, it was Joseph who persuaded Stowell to give up.

      The work led to a hearing in 1826 before a justice of the peace in Chenango County, probably on a charge of disorderly conduct under a New York law against “pretending … to discover where lost goods may be found.” Joseph testified that he had used his stone now and then to look for lost property but had given it up. The outcome is a puzzle, because the four accounts of the hearing disagree; Oliver Cowdery, who was not there, gave the most likely result as an acquittal.

      Moroni had already pointed him away from that company. In September 1826 the angel told him, “Quit the company of the money diggers,” and as he prepared to translate he was commanded to have nothing more to do with those who sought treasure. The gift itself was turned to another use (see the note on [[JS—H 1:62]]).
    sources: [cht-treasure-seeking, saints-v1-04, cht-1826-trial]
  - ref: 57
    phrase: Emma Hale
    kind: history
    title: Emma Hale
    body: |
      Emma Hale was twenty-one and Joseph nineteen when they met at the end of October 1825. She was the seventh of nine children of Isaac and Elizabeth Hale, a well-to-do family with a ninety-acre farm in the Susquehanna Valley; she had gone to Methodist meetings with her mother from the age of seven, and she had taught school. Her parents opposed the match for more reasons than verse 58 gives. Joseph was a poor laborer from another state, they disapproved of his religious pursuits, and Isaac had grown suspicious of his part in Stowell’s treasure hunt, though Joseph had tried to persuade Stowell to stop. Joseph proposed in January 1827 at the Stowells’ home. Emma knew the marriage would disappoint her parents, but it was her choice. The justice of the peace married them on 18 January, and they went to live with Joseph’s parents in Manchester.

      She was part of the work from the start. When Moroni told Joseph to bring someone to the hill and Joseph asked who, the angel said, “You will know,” and Joseph learned through his seer stone that it was Emma. She went with him the night he received the plates ([[JS—H 1:59]]), helped him copy the characters in Harmony ([[JS—H 1:62]]), and served as an early scribe; a revelation to her calls her “an elect lady” ([[D&C 25:3]]). Her parents came round as well. In 1829 they agreed to sell the couple the house they lived in and promised to help calm the neighbors’ fears.
    sources: [cht-emma-hale-smith, saints-v1-04, saints-v1-05, saints-v1-06, lds-scriptures]
  - ref: 59
    phrase: the same heavenly messenger delivered them up to me with this charge
    kind: history
    title: The night the plates were delivered
    body: |
      Joseph went for the plates expecting trouble from people as much as from himself. Local treasure seekers knew the anniversary as well as he did, and one of them had been roaming the hill; Josiah Stowell and Joseph Knight had come to Manchester to see whether the angel would trust him this time. So Joseph set out shortly after midnight, as 22 September was beginning, in Knight’s carriage, and Emma went with him and waited below while he climbed to the box.

      Moroni’s charge is told elsewhere in plainer words than verse 59: “You will have to be watchful and faithful to your trust, … or you will be overpowered by wicked men, for they will lay every plan and scheme that is possible to get them away from you.” Joseph took the warning at once. On the way down he hid the plates in a hollow log until he could get a lockbox.
    sources: [saints-v1-04]
  - ref: 60
    phrase: the most strenuous exertions were used to get them from me
    kind: history
    title: Keeping the plates, and giving them back
    body: |
      Verse 60 compresses months of danger into a sentence. The day after Joseph received the plates his father overheard men plotting to take them: “We will have the plates … in spite of Joe Smith or all the devils in hell.” Joseph went back to the log for them, and on the way home through the woods three men attacked him in turn; he reached the house with the plates and a dislocated thumb. When he and Emma moved to Harmony that winter, the plates went hidden in a barrel of beans.

      They were never his to keep. He translated from early 1828 to June 1829 and then returned the plates to the angel, the arrangement verse 60 describes, and they remained in the angel’s charge on the day Joseph dictated this verse, 2 May 1838.
    sources: [saints-v1-04, saints-v1-05, cht-gold-plates]
  - ref: 61
    phrase: we found a friend in a gentleman by the name of Martin Harris
    kind: history
    title: Martin Harris
    body: |
      Martin Harris came into the work as a man who wanted to be sure. He hefted the plates in their lockbox and told Joseph, “You must not blame me for not taking your word.” That night he prayed, promising God all he had if he could know that the work was divine, and he felt a still, small voice tell him the plates were from God. The fifty dollars of verse 61 followed. Joseph was in debt and had no money to move, and Harris handed him the money in a store, “to do the Lord’s work,” calling on everyone in the room to witness that it was a gift.

      Why Harris took the characters to New York in February 1828 is less clear. Some accounts say the Lord commanded the trip, others credit Joseph or Harris himself. Harris may have hoped that scholars’ endorsement would satisfy his wife, Lucy, who was growing skeptical, or settle his own mind before he paid for the translation, or he may have wanted their advice on translating. Neither he nor Joseph knew much yet about the language on the plates, and Harris may have sought out scholars with expertise in American antiquities: Charles Anthon, a young professor at Columbia College, and Samuel L. Mitchill, a linguist and a leading scholar of ancient American culture, on whom Harris called after leaving Anthon (the “Dr. Mitchell” of verse 65).
    sources: [saints-v1-05, cht-harris-scholars]
  - ref: 62
    phrase: by means of the Urim and Thummim I translated some of them
    kind: history
    title: The interpreters and the seer stone
    body: |
      Verse 62 names one instrument, but those who watched the translation describe two. One was the interpreters buried with the plates (see the note on [[JS—H 1:35]]). The other was a small brown stone Joseph had found in the ground some time before he received the plates, a “seer stone” of the kind many people of his day believed could find lost objects; he had used it that way himself, and as he came to understand his calling he learned to use it to translate. The two could apparently be used interchangeably and worked in much the same way, and he seems to have used both at different times. Often he found the single stone more convenient, putting it in a hat to shut out the light. The early Saints called both instruments by the Old Testament name, Urim and Thummim, and that is the name the history uses.

      Neither instrument made the work mechanical. In these first months in Harmony Joseph copied characters and spent weeks trying to translate them, and the process required him “to be humble and exercise faith as he studied the characters.” Seer stones were familiar in Joseph’s world, but using one to translate an ancient record was unheard of; God turned the gift of verse 56 to a spiritual work.
    sources: [gt-book-of-mormon-translation, saints-v1-06, saints-v1-05, cht-treasure-seeking]
  - ref: 65
    phrase: I cannot read a sealed book
    kind: history
    title: Two accounts of the visit to Anthon
    body: |
      Verses 64–65 are Martin Harris’s account, and Charles Anthon gave another. Anthon confirmed that the meeting took place, but in later statements he denied that he had authenticated the characters, insisted that he had only warned Harris not to put money into the translation and its publication, and said Harris had shown him the copied characters alone, without a translation. Both accounts survive, and some questions about the trip remain unanswered. Harris’s side, and the sealed book of Isaiah, are in the note on [[Isa. 29:11]].

      Harris came home more convinced than before, reasoned that if the most educated men in America could not translate the book then Joseph had to, and planned to come back as Joseph’s scribe. He and Joseph later spoke of the visit as a fulfilment of Isaiah’s “book that is sealed,” which the learned man cannot read ([[Isa. 29:11–12]]). The Book of Mormon has Nephi’s fuller form of the same prophecy, in which the learned man asks for the book itself and the Lord gives the words to one who is not learned ([[2 Ne. 27:15–20]]). When Joseph came to that passage in translating, he thought of Harris’s interview with Anthon.
    sources: [cht-harris-scholars, saints-v1-05, saints-v1-07, lds-scriptures]
  - ref: 66
    phrase: On the 5th day of April, 1829
    kind: history
    title: The year the history passes over
    body: |
      Between verses 65 and 66 the history passes over more than a year. Harris took over as scribe, giving Emma a chance to rest before her baby came. Then, sure that the translation would win over his wife, he begged to take the manuscript home to show her, and Joseph at last let him take it for two weeks under covenant to show it only to certain family members. It was lost: 116 pages translated from the first part of the record, the book of Lehi. In June 1828 Emma bore a son who died soon after birth, and she nearly died herself. When Joseph learned the manuscript was gone he cried, “All is lost!”

      The revelations of these months are in the Doctrine and Covenants. In July 1828 the Lord rebuked him, “Remember, remember that it is not the work of God that is frustrated, but the work of men” ([[D&C 3:3]]); he lost the gift for a time, and it was restored ([[D&C 10:1–3]]). He was told not to translate the lost part again, because wicked men had altered the pages and waited to discredit him by the discrepancies. The plates held a fuller account of the same period, and that account, the small plates of Nephi, now opens the Book of Mormon.
    sources: [saints-v1-05, cht-emma-hale-smith, lds-scriptures, saints-v1-06, saints-v1-07]
  - ref: 66
    phrase: Oliver Cowdery came to my house
    kind: history
    title: Oliver Cowdery
    body: |
      Oliver Cowdery arrived in Harmony already persuaded. Born in Vermont in 1806, a year younger than Joseph, he had studied the Bible and learned to write well as a boy, and in the fall of 1828 he began teaching school about a mile from the Smith farm. Boarding with the Smiths, he heard little at first, because the lost manuscript and local gossip had made the family wary; over the winter they told him of Joseph’s calling. Before he set out, he prayed privately to know whether it was true, and the Lord showed him the plates and Joseph’s work on them. He told no one. In Harmony a revelation through Joseph reminded him of it: “Did I not speak peace to your mind concerning the matter? What greater witness can you have than from God?” ([[D&C 6:23]]). Oliver was astonished, since no one but God could have known.

      He and Joseph then worked together weeks on end, and his own words of 1834, printed after verse 75, remember them as “days never to be forgotten.” He would receive the priesthood with Joseph, be one of the Three Witnesses of the plates, help oversee the printing of the Book of Mormon, and stand among the Church’s founding members on 6 April 1830.
    sources: [cht-oliver-cowdery, saints-v1-06, lds-scriptures]
  - ref: 68
    phrase: baptism for the remission of sins, that we found mentioned in the translation of the plates
    kind: scripture
    title: What sent them to pray
    body: |
      The question that took Joseph and Oliver into the woods came out of the book they were translating. They had reached the risen Lord’s ministry to the Nephites, where He gave chosen disciples power to baptize and told them the words and the manner of the ordinance: “Having authority given me of Jesus Christ, I baptize you in the name of the Father, and of the Son, and of the Holy Ghost” ([[3 Ne. 11:25]]), and then immersion ([[3 Ne. 11:21–26]]). In Oliver’s recollection, printed after verse 75, no one “could translate and write the directions given to the Nephites from the mouth of the Savior, of the precise manner in which men should build up His Church” without wanting to be baptized himself.

      The passage raised authority as well as baptism. The two men wondered whether the baptisms of the centuries had been performed by proper authority, and Joseph, like his brother Alvin, had never been baptized. On 15 May 1829 they walked into the woods near the Susquehanna River to ask.
    sources: [lds-scriptures, cht-aaronic-priesthood, saints-v1-07]
  - ref: 69
    phrase: in the name of Messiah
    kind: christ
    title: In the name of Messiah
    body: |
      John the Baptist came back as he had come the first time, acting for Another. In Judea he baptized with water and said that one mightier than he would “baptize you with the Holy Ghost, and with fire” ([[Matt. 3:11]]); here he confers his priesthood “in the name of Messiah,” says it lacks the power to give the Holy Ghost, and promises that power hereafter ([[JS—H 1:70]]).

      The keys he conferred are those “of the gospel of repentance, and of baptism by immersion for the remission of sins,” what the Doctrine and Covenants calls “the preparatory gospel,” which continued with the house of Aaron “until John” ([[D&C 84:26–27]]). Their meaning is found in two ordinances: “Baptism is for the remission of sins, and the sacrament is a renewal of the covenants and blessings of baptism. Both should be preceded by repentance.” Those who keep those covenants are promised His Spirit, and with it the ministering of angels, which “can also be unseen,” delivered “by a voice or merely by thoughts or feelings communicated to the mind,” because angels “speak the words of Christ” ([[2 Ne. 32:3]]).

      On the last clause, the sons of Levi and their offering in righteousness, see the note on [[Mal. 3:3]].
    sources: [lds-scriptures, cht-melchizedek-priesthood, cht-aaronic-priesthood, oaks-aaronic-1998]
  - ref: 71
    phrase: for so we were commanded
    kind: history
    title: Oliver Cowdery’s account
    body: |
      The account printed after verse 75 is the earliest detailed telling of this day, by the other man who was there. Oliver Cowdery published it in 1834, in a series of letters on the Church’s beginnings, four years before Joseph Smith dictated this history. Under Joseph’s direction, clerks later joined Cowdery’s account with what Joseph added, and the result is verses 68–72 here and [[D&C 13]].

      Cowdery’s account keeps what a participant felt. Before the angel came, “the voice of the Redeemer spake peace to us”; the angel’s voice, “though mild, pierced to the center”; and of the whole he writes, “The assurance that we were in the presence of an angel, the certainty that we heard the voice of Jesus, … is to me past description.” His wording of John’s words is his own: “I confer this Priesthood and this authority, which shall remain upon earth, that the Sons of Levi may yet offer an offering unto the Lord in righteousness.”

      The claim was public early. Within months of the Book of Mormon’s publication, a newspaper with no connection to the Church reported Cowdery’s claim to a commission from angelic visitors, though at first, as verse 74 says, he and Joseph told little of it because of persecution.
    sources: [cht-aaronic-priesthood, lds-scriptures]
  - ref: 72
    phrase: which Priesthood, he said, would in due time be conferred on us
    kind: history
    title: Peter, James and John
    body: |
      The history promises the higher priesthood here and never narrates its coming, and the date cannot be fixed. A revelation speaks of “Peter, and James, and John, whom I have sent unto you, by whom I have ordained you and confirmed you to be apostles” ([[D&C 27:12]]). Joseph Smith’s only firsthand account of the circumstances is a line in a letter of 1842: “the voice of Peter, James, and John in the wilderness between Harmony, Susquehanna county, and Colesville, Broome county, on the Susquehanna river” ([[D&C 128:20]]). A blessing Joseph gave Oliver in 1835 speaks of it, and late in life Oliver wrote of standing “in the presence of Peter, to receive the Greater” priesthood. Estimates of the date run from a few weeks after 15 May 1829 to many months later.

      The rest of John’s promise can be followed. When the Church was organized on 6 April 1830, Joseph and Oliver gave the gift of the Holy Ghost, the power John had said his priesthood lacked, and ordained each other elders as the Lord had told them to: the “first elder” and “second elder” of [[D&C 20:2–3]].
    sources: [lds-scriptures, cht-melchizedek-priesthood]

christ: |
  The chapter turns on the Father’s one sentence in the grove, “This is My Beloved Son. Hear Him!” (1:17), and after it the answers come from the Son. It is He who answers Joseph’s question (1:18–20). The record Moroni reveals holds the gospel “as delivered by the Savior” (1:34), and the prophet like Moses “was Christ” (1:40). John the Baptist, who once went before Jesus, returns to confer the priesthood “in the name of Messiah” (1:69), and Oliver Cowdery remembered that “the voice of the Redeemer spake peace” to them before the angel spoke.

  Joseph Smith’s own conclusion holds for anyone who lacks wisdom: a person may “ask of God, and obtain, and not be upbraided” (1:26; [[James 1:5]]).

explore: |
  - **The priesthood restored.** [[D&C 13]], John’s words as a section of their own; [[D&C 27:12]] and [[D&C 128:20–21]] on Peter, James and John; [[D&C 84:26–28]] on the lesser priesthood and John.
  - **The sealed book.** [[Isa. 29:11–12]] and Nephi’s fuller form of the prophecy, [[2 Ne. 27:6–23]].
  - **Alvin and those who died without the gospel.** [[D&C 137:1–10]].
  - **The lost manuscript.** [[D&C 3]] and [[D&C 10]], the rebuke and the remedy.
  - **The story told whole.** *Saints*, volume 1, chapters 1–7 (“Ask in Faith” to “Fellow Servants”), the Church’s narrative of these years, with notes to the documents behind it.

