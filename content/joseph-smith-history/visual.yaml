# “What's in this picture” under the image on the book page: one line for each thing, with the verse it shows.
key:
  - '**The light among the trees at the far left** marks the grove where Joseph Smith went to pray “on the morning of a beautiful, clear day, early in the spring of eighteen hundred and twenty” ([[JS—H 1:14]]). There, he wrote, “I saw a pillar of light exactly over my head, above the brightness of the sun, which descended gradually until it fell upon me” ([[JS—H 1:16]]). The light is shown far off, among the trunks, and no one is drawn in it.'
  - '**The rounded stone on the side of the hill** is the stone over the plates: “On the west side of this hill, not far from the top, under a stone of considerable size, lay the plates … This stone was thick and rounding in the middle on the upper side, and thinner towards the edges, so that the middle part of it was visible above the ground” ([[JS—H 1:51]]). It is shown as it lay before it was raised; the plates were kept there until “the time for bringing them forth” ([[JS—H 1:53]]).'
  - '**The river at the right** is for the baptisms of May 1829. Joseph Smith and Oliver Cowdery had gone “into the woods to pray” near the Susquehanna River ([[JS—H 1:68]]); the messenger from heaven “commanded us to go and be baptized” ([[JS—H 1:70]]), and then, “Accordingly we went and were baptized” ([[JS—H 1:71]]).'
alt: Far back at the left, light shines on the floor of a grove of bare spring trees, glimpsed between the trunks; in the middle distance the rounded top of one stone shows above the grass near the top of a hill; and at the right a calm river with a sandy bank runs across the foreground, all joined by a quiet grassy path.
