summary: >-
  Joseph Smith—History is a young man's own account of asking God and being answered:
  the Father's words, "This is My Beloved Son. Hear Him!", then the record kept until its
  time, and the authority to baptize given "in the name of Messiah." The image is three
  quiet places with open ground between them, each a place where he asked and God
  answered, and the light in the first is the center of the picture: it falls on empty
  ground, and the ground is simply lit.
motifs:
  - "Light in a grove, seen from a distance (JS—H 1:14–16): far back on the left, a dark grove of tall early-spring hardwoods, their branches bare with small buds just opening. Deep inside it, between the trunks, a warm white-gold light falls on one spot of the grove's floor. Only its lower part is seen, glimpsed through the trunks and branches, which hide most of it; it shows as a soft, steady brightness on the ground among the trees and on the near sides of the trunks around it, with the trunks dark against it. No full beam reaching to the top of the picture, no fanning rays, burst, halo, sparkle, lens flare, or sun disk. Calm and small in the frame, never a spotlight on a stage; the grove is the first place the eye goes because it holds the one unexplained light, not because the light is large."
  - "The stone on the hill, as it lay before it was moved (JS—H 1:50–52): near the top of the rounded hill, on its slope, the middle of one large stone shows above the grass: a low, smooth, gray dome, thick and rounded in the middle on its upper side, its edges all around covered with earth and grass, so that only the rounded middle can be seen. Nothing else: no box, no opening, no dug earth, no lever, no plates, no gold. It is small but clearly a single stone set in the ground."
  - "A river bank with open water (JS—H 1:68–71, the woods near the Susquehanna River in the note on 1:68): at the right, the gently sloping bank of a broad, calm, shallow river with a sandy, gravelly edge shelving down into clear water, and a few willows or sycamores along the bank. The water runs sideways across the picture, from the left of the river toward the right edge, a wide quiet sheet with a few soft ripples and the bright sky in it. The bank and the water are empty: no boat, no landing, no dock, no cabin."
composition: >-
  A wide landscape of three places along open, grassy country, read left to right in
  the order the book tells them. At the left, set well back in the distance, the grove:
  a dark mass of tall trees, smaller than the near ground, with the light glimpsed
  inside it among the trunks. In the center, also in the middle distance, a rounded hill
  with a few bare trees, and near its top the rounded middle of the one stone showing
  above the ground. At the right, in the nearest ground, the river bank and the broad
  water running across the corner of the picture, its far shore low and pale. Between
  them lies open, gently sloping meadow with short early-spring grass and a soft worn
  path running through it. Ambient daylight is soft, gold and low from the upper left,
  so shadows are short and fall to the right and slightly toward the viewer; the light
  in the grove is the one exception and lights only its own spot. The sky is clear and
  calm, with room above the hill and river. Objects are of the 1820s: earth, stone,
  trees and water only, with no buildings, fences, roads, tools, or anything modern.
  No people, no figures, no faces, no kneeling form, no angels, no hands, no text.
alt: Far back at the left, light shines on the floor of a grove of bare spring trees, glimpsed between the trunks; in the middle distance the rounded top of one stone shows above the grass near the top of a hill; and at the right a calm river with a sandy bank runs across the foreground, all joined by a quiet grassy path.
status: proposed
