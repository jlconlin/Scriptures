summary: >-
  Second Chronicles asks of every king one thing, whether he sought the LORD, and measures them
  all by the answer to Solomon: "If my people ... shall humble themselves, and pray, and seek my
  face, and turn from their wicked ways; then will I hear from heaven, and will forgive their sin,
  and will heal their land." Ahaz shuts the doors of the house of the LORD and Hezekiah opens them;
  the unprepared who come to the Passover are healed; Manasseh, the worst of the kings, is heard
  in chains; and the book ends with a word to go up and build again. Its center is a door held
  open for those who turn back. It points to Jesus Christ, through whom the way to the LORD's
  house stands open.
motifs:
  - "Primary: the house of the LORD, Solomon's temple, as the Bible describes it, its doors opened as Hezekiah 'opened the doors of the house of the LORD' (2 Chr. 29:3; shut by Ahaz, 28:24): a porch (3:4); two pillars of brass with chapiters, chains and pomegranates, one on the right hand and one on the left, Jachin and Boaz (3:15–17; 1 Kgs. 7:15–22); the doors of the house, carved with cherubims, palm trees and open flowers and overlaid with gold (4:22; 1 Kgs. 6:31–35), standing open; and through them the greater house, ceiled with fir and overlaid with fine gold, set with palm trees and chains (3:5), lit warmly from within. Drawn as Codex understood that description."
  - "Supporting: at the lower left, lying open on the stone paving, a pair of bronze fetters, two heavy rings joined by a short chain, both rings hinged open and empty, with a few small thorns beside them (2 Chr. 33:11–13)."
  - "Supporting: at the lower right, on a flat stone, a small stack of round flat cakes of unleavened bread, plain and pale, with one broken in two on top (2 Chr. 30:13, 18–20)."
composition: >-
  Early morning, the sun low and behind the viewer at the left, so that warm light rakes across
  the steps and the paving from the left and the shadows fall to the right. The temple's porch
  stands in the center at the top of a short flight of stone steps, its two brass pillars on either
  side of the open gold doors, and the gold interior of the house seen through them, the brightest
  thing in the picture. The fetters lie on the paving at the lower left and the bread on its flat
  stone at the lower right, both small and well apart from the porch. On either side a plain stone
  wall runs out to the edges of the picture, and beyond it a quiet band of clay-colored hills under
  an indigo-to-gold sky. No people, faces, cloud, fire, smoke, weapons, crowns or writing.
