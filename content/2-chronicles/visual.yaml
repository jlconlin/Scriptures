alt: The porch of Solomon's temple at the top of a short flight of stone steps, with two brass pillars hung with chains and pomegranates on either side of tall gold doors carved with winged figures, palm trees and flowers, standing open on a gold-lined interior set with palm trees and chains; at the lower left lie a pair of open bronze fetters with a few thorns, and at the lower right a small stack of flat round unleavened loaves, one broken, on a flat stone, under an indigo-to-gold morning sky.
key:
  - '**The open doors of the house of the LORD** are the turn of the book. Ahaz “shut up the doors of the house of the LORD, and he made him altars in every corner of Jerusalem” ([[2 Chr. 28:24]]); his son Hezekiah, “in the first year of his reign, in the first month, opened the doors of the house of the LORD, and repaired them” ([[2 Chr. 29:3]]). They answer the promise the LORD gave Solomon at this house: “If my people … shall humble themselves, and pray, and seek my face, and turn from their wicked ways; then will I hear from heaven” ([[2 Chr. 7:14]]). The way back to the LORD is not closed.'
  - '**The porch, the two pillars and the gold within** are the house Solomon built: “he made before the house two pillars,” with “chains” and “an hundred pomegranates” on them, “and called the name of that on the right hand Jachin, and the name of that on the left Boaz” ([[2 Chr. 3:15–17]]); “the greater house he ceiled with fir tree, which he overlaid with fine gold, and set thereon palm trees and chains” ([[2 Chr. 3:5]]). At its dedication “the glory of the LORD had filled the house of God” ([[2 Chr. 5:14]]).'
  - '**The open fetters among the thorns** are Manasseh’s, the worst of Judah’s kings. The Assyrians “took Manasseh among the thorns, and bound him with fetters, and carried him to Babylon”; there “he besought the LORD his God, and humbled himself greatly,” and the LORD “heard his supplication, and brought him again to Jerusalem” ([[2 Chr. 33:11–13]]). Only Chronicles tells it. The fetters lie empty: even Manasseh was heard.'
  - '**The broken unleavened bread** is Hezekiah’s Passover, where many “did they eat the passover otherwise than it was written,” and Hezekiah prayed, “The good LORD pardon every one that prepareth his heart to seek God … though he be not cleansed according to the purification of the sanctuary. And the LORD hearkened to Hezekiah, and healed the people” ([[2 Chr. 30:18–20]]).'
