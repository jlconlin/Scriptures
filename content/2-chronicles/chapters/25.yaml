chapter: 25
title: The LORD Is Able to Give Thee Much More Than This
tagline: Amaziah sends home the soldiers he hired from Israel at a prophet's word and defeats Edom, then sets up Edom's gods, silences the prophet sent to rebuke him, and takes counsel for a war that breaks Jerusalem's wall.
when: 'The twenty-nine years of Amaziah in Jerusalem, from the age of twenty-five (verse 1)'

setting: |
  Amaziah is the son of Joash, the king who began well under Jehoiada and ended by having Jehoiada's son stoned ([[2 Chr. 24:21]]); his own servants killed him ([[2 Chr. 24:25]]), and this chapter opens with the son punishing them. It sits in the second part of the book, the kings of Judah from the division of the kingdom to Ahaz.

  Kings tells the same reign in [[2 Kgs. 14:1–20]], and Chronicles follows it for the accession, the victory over Edom, the war with Joash of Israel and the conspiracy at the end. What Chronicles adds is the middle of the story: the army Amaziah hired from Israel and sent home at a prophet's word (verses 5–10), the raid those soldiers made on Judah's towns (verse 13), the gods of Edom and the prophet the king silenced (verses 14–16), and the reason given for the defeat (verse 20). The site's notes on 2 Kings 14 already explain Edom and Sela ([[2 Kgs. 14:7]]), the challenge to war ([[2 Kgs. 14:8]]), the fable of the thistle and the cedar ([[2 Kgs. 14:9]]) and the conspiracy ([[2 Kgs. 14:19]]); the notes here go to what is Chronicles' own.

thread: |
  The chapter tells of two prophets and a king who heard the first and not the second. Amaziah did right, “but not with a perfect heart” (verse 2), a qualifier the gods of Edom later in the chapter explain. When a man of God told him to send away the hundred thousand men he had hired from Israel, he asked about the silver he had paid, and then obeyed; he went out with Judah alone and won in the Valley of Salt. Coming back from that victory he brought home the gods of the Edomites he had beaten and bowed to them. A second prophet asked why, and the king cut him off.

  Amaziah would not have the prophet as a counsellor; the prophet answered that God had counselled his destruction; and the king “took advice” elsewhere and challenged Israel (verses 16–17). He asked to “see one another in the face,” and the narrator, with some irony, uses his phrase again for the battle at Beth-shemesh that he lost (verse 21). Chronicles says plainly that his refusal to hear “came of God” because Judah had sought the gods of Edom (verse 20), as it explains Rehoboam's refusal to hear the people and Ahaziah's fatal visit to Joram ([[2 Chr. 10:15]]; [[2 Chr. 22:7]]); and it dates the conspiracy that killed him from “the time that Amaziah did turn away from following the LORD” (verse 27), where Kings only reports it.

sections:
  - range: 1-4
    heading: Amaziah begins to reign
    plain: |
      Amaziah was twenty-five years old when he became king, and he reigned twenty-nine years in Jerusalem. His mother was Jehoaddan of Jerusalem. He did what was right in the LORD's sight, but not wholeheartedly. Once the kingdom was firmly his, he executed the servants who had killed his father the king. But he did not put their children to death; he followed what is written in the law, in the book of Moses, where the LORD commanded: “Fathers shall not die for their children, nor children for their fathers; each one shall die for his own sin.”
  - range: 5-10
    heading: The army sent home
    plain: |
      Amaziah gathered Judah and organized them by their fathers' houses under captains of thousands and captains of hundreds, all Judah and Benjamin. He counted the men from twenty years old and up and found three hundred thousand picked men, fit for war, able to handle spear and shield. He also hired a hundred thousand valiant soldiers from Israel for a hundred talents of silver.

      But a man of God came to him and said, “O king, do not let the army of Israel go with you, for the LORD is not with Israel, with any of the people of Ephraim. Even if you go and fight bravely, God will bring you down before the enemy, for God has power to help and to bring down.” Amaziah asked the man of God, “But what about the hundred talents I have paid to the army of Israel?” The man of God answered, “The LORD is able to give you much more than that.” So Amaziah dismissed the troops that had come to him from Ephraim and sent them home. They were furious with Judah and went home in a rage.
  - range: 11-13
    heading: Victory over Edom, and a raid on Judah
    plain: |
      Amaziah took courage and led out his people to the Valley of Salt, and he struck down ten thousand of the people of Seir. The men of Judah captured another ten thousand alive, took them to the top of the cliff and threw them down, and they were all dashed to pieces. The troops Amaziah had sent back, not letting them go with him to battle, raided the towns of Judah from Samaria to Beth-horon, killed three thousand people, and took a great deal of plunder.
  - range: 14-16
    heading: The gods of Edom
    plain: |
      After Amaziah came back from slaughtering the Edomites, he brought the gods of the people of Seir, set them up as his own gods, bowed down before them and burned incense to them. The LORD's anger burned against Amaziah, and He sent him a prophet, who said, “Why have you sought the gods of this people, who could not save their own people from your hand?” While he was still speaking, the king said to him, “Have we made you the king's counsellor? Stop! Why should you be struck down?” The prophet stopped, but he said, “I know that God has resolved to destroy you, because you have done this and have not listened to my counsel.”
  - range: 17-24
    heading: The war with Israel
    plain: |
      Then Amaziah king of Judah took counsel and sent word to Joash son of Jehoahaz, son of Jehu, king of Israel: “Come, let us meet face to face.” Joash king of Israel sent back to Amaziah king of Judah: “A thistle in Lebanon sent word to a cedar in Lebanon, ‘Give your daughter to my son as his wife.’ Then a wild beast of Lebanon passed by and trampled the thistle. You tell yourself that you have beaten Edom, and your heart has grown proud and boastful. Stay at home. Why provoke a disaster that will bring you down, you and Judah with you?”

      But Amaziah would not listen, for it was from God, to hand them over to their enemies because they had sought the gods of Edom. So Joash king of Israel went up, and he and Amaziah king of Judah met face to face at Beth-shemesh, which belongs to Judah. Judah was defeated by Israel, and every man fled to his home. Joash king of Israel captured Amaziah king of Judah, the son of Joash, son of Jehoahaz, at Beth-shemesh, and brought him to Jerusalem. He broke down the wall of Jerusalem for four hundred cubits, from the Ephraim Gate to the Corner Gate. He took all the gold and silver and all the vessels found in the house of God with Obed-edom, and the treasures of the king's house, and hostages too, and went back to Samaria.
  - range: 25-28
    heading: Amaziah's end
    plain: |
      Amaziah son of Joash, king of Judah, lived fifteen years after the death of Joash son of Jehoahaz, king of Israel. The rest of Amaziah's acts, from first to last, are written in the book of the kings of Judah and Israel. From the time Amaziah turned away from following the LORD, men plotted against him in Jerusalem, and he fled to Lachish; but they sent after him to Lachish and killed him there. They brought him back on horses and buried him with his fathers in the city of Judah.

notes:
  - ref: 2
    phrase: but not with a perfect heart
    kind: history
    title: Right, but not with a perfect heart
    body: |
      Chronicles' qualifier on Amaziah's goodness names a heart that was not whole toward the LORD. Kings qualifies the same verdict differently: he did right, “yet not like David his father,” and the high places stayed ([[2 Kgs. 14:3–4]]; the note at [[2 Kgs. 14:3]]). “Perfect” is *shalem*, the word explained at [[2 Chr. 16:9]].

      A heart that is not perfect in what it does is a double-minded one, “an attitude that makes bad the good things that are done.” Amaziah's instability shows in three things: the high places he left, his wish to make war with the help of soldiers hired from a kingdom the LORD was not with, and his failure to heed Joash's warning (verses 6–7, 19–20).
    sources: [ot-manual-12, oshb-wlc, lds-scriptures]

  - ref: 7
    phrase: for the LORD is not with Israel, to wit, with all the children of Ephraim
    kind: history
    title: The LORD is not with Israel
    body: |
      The man of God's objection to the hired army rests on the kingdom the soldiers came from. “Israel” here is the northern kingdom, named again as “the children of Ephraim,” and because the LORD is not with that kingdom, its soldiers cannot help Judah. The verse does not say why the LORD is not with them; the charge Chronicles has already laid against the north is Abijah's, that it kept “golden calves, which Jeroboam made you for gods” and had “cast out the priests of the LORD” ([[2 Chr. 13:8–9]]; see the note on [[2 Chr. 13:9]]).

      Verse 8 can be taken two ways. In the King James it is a warning: go with them if you will and fight bravely, and God will still make you fall. A modern translation reads it as an instruction to go without them: “go by yourself and act; be strong in battle, or God will fling you down before the enemy.” On either reading the reason the prophet gives is the same: “God hath power to help, and to cast down.”
    sources: [nrsvue, lds-scriptures]

  - ref: 14
    phrase: set them up to be his gods
    kind: history
    title: The gods of a beaten enemy
    body: |
      Amaziah came home from defeating Edom and worshipped Edom's gods, and the strangeness is the point of the prophet's question: why seek gods “which could not deliver their own people out of thine hand?” (verse 15). He set up the images of the people of Seir as gods, bowed to them and burned incense to them.

      Chronicles gives no motive. One older explanation comes from the ancient world: taking over a conquered people's gods was a policy often followed in antiquity, and behind it lay the belief that to hold a people in subjection one had to win over their gods. If that was Amaziah's reason, the prophet's question answers it from what he had seen with his own eyes: these gods had just failed to save their own worshippers from him.
    sources: [keil-chronicles, cambridge-chronicles, lds-scriptures]

  - ref: 16
    phrase: Art thou made of the king’s counsel?
    kind: words
    title: Counsel refused, counsel taken
    body: |
      One Hebrew root runs through verses 16 and 17, and the King James hides it under four renderings. The king asks whether the prophet has been made a royal counsellor (a *yôʿēṣ*). The prophet stops, but answers with the king's own word: God “hath determined” (*yāʿaṣ*, the verb to advise or counsel, and also to resolve) to destroy him, because he has not hearkened to “my counsel” (*ʿēṣâ*, a noun from the same root). Then “Amaziah king of Judah took advice” (verse 17), the same verb again. Having refused the counsel of God's messenger, the king took counsel elsewhere and sent the challenge to Joash.

      Why he would not then hear Joash's warning, Chronicles says in verse 20; the note at [[2 Kgs. 14:11]] explains it.
    sources: [oshb-wlc, strongs-concordance, lds-scriptures]

  - ref: 24
    phrase: in the house of God with Obed-edom
    kind: history
    title: Vessels in Obed-edom's keeping
    body: |
      “With Obed-edom” means in the keeping of Obed-edom's family, who kept the temple storehouse. When the gates of the house of God were assigned, it was “to Obed-edom southward; and to his sons the house of Asuppim” ([[1 Chr. 26:15]], where the note explains the storehouse). Kings says only that Joash took “all the vessels that were found in the house of the LORD” ([[2 Kgs. 14:14]]); Chronicles names the family whose charge he emptied.
    sources: [bd-obed-edom, lds-scriptures]

christ: |
  The man of God's reason for sending the hired army home is that “God hath power to help, and to cast down” (verse 8), and the God of Israel who holds that power is Jehovah, the premortal Jesus Christ. The footnote to verse 8 points to His word in this dispensation: “I, the Lord, rule in the heavens above, and among the armies of the earth” ([[D&C 60:4]]).

  The man of God's answer about the lost silver reaches a disciple now: the Lord whose word costs a disciple something to follow “is able to give thee much more than this” (verse 9). The help Amaziah bought could not decide his battle, and the gods he took from Edom could not save their own people (verse 15).

explore: |
  - **The same reign in Kings.** [[2 Kgs. 14:1–20]], with the site's notes on Edom, the challenge, the fable and the conspiracy.
  - **The charge against the northern kingdom.** Abijah's speech to Jeroboam's army, [[2 Chr. 13:4–12]].
  - **Amaziah's son.** Uzziah's strength and pride, [[2 Chr. 26]].

