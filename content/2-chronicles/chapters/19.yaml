chapter: 19
title: Ye Judge Not for Man, but for the LORD
tagline: Jehu the seer meets Jehoshaphat coming home from Ahab's war with wrath and with praise; the king goes out again among his people, sets judges in the cities and a court at Jerusalem, and charges them to judge in the fear of the LORD.
when: 'After the battle at Ramoth-gilead, in which Ahab died and Jehoshaphat came home in safety (verse 1; [[2 Chr. 18:34]])'

setting: |
  Jehoshaphat, the fourth king of Judah, has come home from Ramoth-gilead, the battle in which Ahab of Israel died ([[2 Chr. 18:34]]). Chronicles gives his reign four chapters where Kings gives a summary of ten verses ([[1 Kgs. 22:41–50]]), and this chapter is entirely its own: neither Jehu's rebuke (verses 1–3) nor the reform of the courts (verses 4–11) has a parallel in Kings. Kings says only that “Jehoshaphat made peace with the king of Israel” ([[1 Kgs. 22:44]]). Chronicles tells what a prophet said about that peace.

  The king's name, *Yehoshaphat*, joins the divine name to the verb “to judge” and means “the Lord has judged.” The prophet who meets him is Jehu the son of Hanani, whose father had rebuked Jehoshaphat's father Asa ([[2 Chr. 16:7]]). The chapter stands between Ahab's war in chapter 18 and the invasion of chapter 20, when Moab, Ammon and others with them came against Jehoshaphat and he stood in the house of the LORD and prayed.

thread: |
  The chapter turns on one word spoken to a king and then given to his judges. Jehu meets Jehoshaphat on his way home from the battle where Ahab died and says two things at once: there is wrath upon him for helping the wicked, and there are good things found in him, because he had prepared his heart to seek God (verses 2–3). The king's reply is not recorded. What follows is that he went out again among the people himself, from Beer-sheba on Judah's southern frontier to mount Ephraim on its northern one, and brought them back to the LORD God of their fathers (verse 4). On one older reading this took up again the work of the teachers he had sent out in his third year ([[2 Chr. 17:7–9]]) and completed it by putting the courts in order.

  The rest of the chapter is that reform: judges in every fenced city, charged to judge “for the LORD,” and a court at Jerusalem for the hard cases. The charge to the court comes back to the word of verse 2. The judges were to warn the people who came before them “that they trespass not against the LORD, and so wrath come upon you, and upon your brethren” (verse 10), and the word for wrath is the one Jehu had spoken to the king. The fear of the LORD (verses 7, 9) was to keep the judges themselves from unrighteousness.

sections:
  - range: 1-3
    heading: Jehu's word to the king
    plain: |
      Jehoshaphat king of Judah came home safely to his house in Jerusalem. Jehu the son of Hanani the seer went out to meet him and said to King Jehoshaphat, “Should you help the wicked and love those who hate the LORD? Because of this, wrath is upon you from the LORD. Yet there is good found in you, for you have removed the Asherah poles from the land and have set your heart to seek God.”
  - range: 4-7
    heading: Judges in the cities of Judah
    plain: |
      Jehoshaphat lived in Jerusalem, and he went out again among the people, from Beer-sheba in the south to the hill country of Ephraim in the north, and brought them back to the LORD, the God of their fathers. He appointed judges in the land, in all the fortified cities of Judah, city by city. He told the judges, “Consider what you are doing, for you do not judge for man but for the LORD, and He is with you when you give judgment. So let the fear of the LORD be upon you. Be careful in what you do, for with the LORD our God there is no injustice, no favoritism and no taking of bribes.”
  - range: 8-11
    heading: The court at Jerusalem
    plain: |
      In Jerusalem also, when they had returned there, Jehoshaphat appointed some of the Levites and priests and heads of the families of Israel to give the LORD's judgment and to settle disputes. He charged them, “This is how you must act: in the fear of the LORD, faithfully and with an undivided heart. Whenever a case comes to you from your brothers who live in their cities, whether it is a question of bloodshed or of which law, commandment, statute or ruling applies, you must warn them, so that they do not become guilty before the LORD and wrath come upon you and your brothers. Do this, and you will not be guilty. Amariah the chief priest is over you in every matter of the LORD, and Zebadiah the son of Ishmael, the leader of the house of Judah, in every matter of the king, and the Levites will serve you as officers. Be strong and do it, and may the LORD be with those who do well.”

notes:
  - ref: 2
    phrase: Shouldest thou help the ungodly, and love them that hate the LORD?
    kind: history
    title: Wrath for helping the wicked
    body: |
      Jehu's question names Jehoshaphat's fault in two verbs: he had helped Ahab in war, and in joining Ahab's house he had loved “them that hate the LORD.” The alliance had been sealed by marriage, Jehoshaphat's son taking Ahab's daughter to wife; the note at [[2 Chr. 18:1]] tells how it was made and what Ahab's house stood for.

      The messenger came from a family of such words. His father, Hanani the seer, had told Asa that relying on the king of Syria rather than on the LORD would bring him wars, and Asa put him in prison for it ([[2 Chr. 16:7–10]]). Jehu himself had pronounced the end of Baasha's house in Israel ([[1 Kgs. 16:1]], where the site's note says more of him). Two kings, Omri and Ahab, had reigned in Israel since then, so on one older reckoning Jehu was an old man when he met Jehoshaphat.

      “Therefore is wrath upon thee” does not say what the wrath was, and two older commentaries look ahead for it. One finds it in the next chapter, when Moab and Ammon came against Judah ([[2 Chr. 20:1]]). The other finds it there and in more: in the danger Jehoshaphat had just escaped at Ramoth-gilead, in the ships he later built with Ahab's son, which were broken ([[2 Chr. 20:35–37]]), and after his death in his own family. The Lord rebuked that second alliance through another prophet, Eliezer ([[2 Chr. 20:37]]), and of Jehoshaphat's son Jehoram Chronicles says that he “walked in the way of the kings of Israel, like as did the house of Ahab: for he had the daughter of Ahab to wife” ([[2 Chr. 21:6]]).
    sources: [scripture-helps-2-chronicles, cambridge-chronicles, keil-chronicles, lds-scriptures]

  - ref: 3
    phrase: Nevertheless there are good things found in thee
    kind: words
    title: Good things found beside the wrath
    body: |
      The prophet who pronounces wrath in verse 2 names in the next breath what was good in the king. Jehoshaphat had taken away the groves ([[2 Chr. 17:6]]), and he had prepared his heart to seek God. The rebuke and the praise stand side by side in one speech.

      The phrase “good things” is the one Chronicles used of Rehoboam's reign. There too wrath and good stand together: “when he humbled himself, the wrath of the LORD turned from him … and also in Judah things went well,” where “things went well” renders the same two Hebrew words ([[2 Chr. 12:12]]). And to prepare the heart to seek the LORD is exactly what Rehoboam had failed to do: “he did evil, because he prepared not his heart to seek the LORD” ([[2 Chr. 12:14]]). Jehoshaphat had done it from the beginning, when he “sought to the LORD God of his father” ([[2 Chr. 17:4]]), and Jehu, for all his rebuke, finds it in him still.
    sources: [oshb-wlc, lds-scriptures]

  - ref: 6
    phrase: ye judge not for man, but for the LORD
    kind: history
    title: Judges who judge for the LORD
    body: |
      Jehoshaphat's charge tells the judges whom they serve: not the king who appointed them, nor the parties before them, but the LORD. Judges themselves were not new. Moses had commanded “judges and officers … in all thy gates” ([[Deut. 16:18]]; see the site's note there), and on one older reading the king's work in the fenced cities, the larger towns that were centers for the country around them, was more a matter of removing bad judges and confirming good ones than of appointing the first. What he added was the charge. To judge “for the LORD” is, on one older reading, to judge “not on the appointment and according to the will of men, but in the name and according to the will of the Lord,” which was Moses' word to the first judges: “for the judgment is God's” ([[Deut. 1:17]]). The LORD “is with you in the judgment,” and another reading takes that clause as strength for judges who had to decide against the rich and powerful.

      Verse 7 then measures the judges by God Himself. With Him there is “no iniquity …, nor respect of persons, nor taking of gifts,” as Moses called Him the God “which regardeth not persons, nor taketh reward” ([[Deut. 10:17]]), and the law forbade the judges the same two things ([[Deut. 16:19]]). They were to judge “with a perfect heart” (verse 9), which meant, on the same older reading, that they could not combine the service of God with the taking of bribes.

      A Latter-day Saint study of law in the Book of Mormon, on how Israel's judges relied on inspiration in applying the law, sets Jehoshaphat beside Moses, who used revelation to settle the inheritance of Zelophehad's daughters ([[Num. 36:1–9]]): Jehoshaphat told his judges to decide whatever cause came to them “for the Lord.” The study suggests that Lehi, facing the disputes among his sons, did likewise.
    sources: [keil-chronicles, cambridge-chronicles, welch-lehi-will, lds-scriptures]

  - ref: 8
    phrase: when they returned to Jerusalem
    kind: words
    title: Who returned to Jerusalem?
    body: |
      The last clause of verse 8 is puzzling, because no one in the verse has left Jerusalem. The Hebrew says simply that they returned to Jerusalem. One older commentary takes it back to verse 4: the king and those who went out with him through the land came home, and the historian mentions their return late because he was describing the city courts and the high court together rather than in the order of time. That is the sense of the King James “when they returned.” Another older commentary thinks the words seem to be corrupt and would read *dwelt* for *returned*, so that the judges of the high court lived where the hardest cases could always be brought to them. The Septuagint, the old Greek translation, has a different clause again: the court was set up “to judge the dwellers in Jerusalem.”

      None of these readings changes what the verse establishes: a court at Jerusalem of Levites, priests and heads of the fathers' houses, beside the judges in the cities.
    sources: [oshb-wlc, keil-chronicles, cambridge-chronicles, lxx-rahlfs]

  - ref: 10
    phrase: between blood and blood, between law and commandment
    kind: history
    title: A higher court for the hard cases
    body: |
      The court at Jerusalem heard the cases the city judges could not settle, as the law of Moses had provided. Deuteronomy had said that “if there arise a matter too hard for thee in judgment, between blood and blood,” the parties should go up to the place the LORD would choose, to the priests the Levites and the judge ([[Deut. 17:8–9]]; the site's note at [[Deut. 17:9]]), and Jehoshaphat's charge uses the same phrase. On one older reading, to judge “between blood and blood” was to decide between one kind of bloodshed and another, murder and manslaughter; both older commentaries take “between law and commandment, statutes and judgments” as deciding which provision of the law applied to the case in hand. One older commentary thinks the court itself probably new, since David and Solomon had kept judgment in their own hands ([[2 Sam. 15:3]]; [[1 Kgs. 3:16]]). Another sees it as a firmer organization of the court of final appeal Moses had already ordained.

      The judges were also to “warn” those who brought their causes. The verb, on the second reading, means to teach, with a note of admonition, and it is the verb of Jethro's counsel to Moses: “thou shalt teach them ordinances and laws” ([[Ex. 18:20]]). The court was to teach those who came before it as well as decide their cases, so that they would not incur guilt before the LORD.
    sources: [cambridge-chronicles, keil-chronicles, lds-scriptures]

  - ref: 11
    phrase: Amariah the chief priest is over you in all matters of the LORD
    kind: history
    title: The LORD's matters and the king's
    body: |
      Jehoshaphat gave the court two presidents, and the division follows the law. Amariah the chief priest presided “in all matters of the LORD,” and Zebadiah, the ruler of the house of Judah, “for all the king's matters,” which an older commentary reads as the religious causes and the civil ones. The same commentary finds the pattern in Moses' provision for hard cases, which went to “the priests the Levites” and to “the judge that shall be in those days” ([[Deut. 17:9]]). Moses presupposed a high priest and a chief civil officer at the sanctuary, and Jehoshaphat's court had “the high priest and a lay president at its head.” The Levites served under them as officers, the assistants who carried out the court's work. Which Amariah this was is uncertain: one older commentary thinks he is perhaps the Amariah in the high priests' line at [[1 Chr. 6:11]], the other that he is not.

      The king's last words are a charge and a blessing. “Deal courageously” is in Hebrew *be strong and do*, that is, go to work with a good heart, and “the LORD shall be with the good” is said of whoever does the duties of the office well. One commentary hears the close as a blessing on the judges more than a promise.
    sources: [keil-chronicles, cambridge-chronicles, lds-scriptures]

christ: |
  The judges of verse 6 judged “not for man, but for the LORD,” and the LORD they served is Jehovah, who “is the premortal Jesus Christ.” In the New Testament He says that “the Father judgeth no man, but hath committed all judgment unto the Son” ([[John 5:22]]). The Judge with whom there is “no respect of persons, nor taking of gifts” (verse 7) is Christ.

  The Lord still sets judges among His people: a bishop is called “to be a judge in Israel” ([[D&C 107:72]]), “a common judge” where he is set apart to serve ([[D&C 107:74]]). And every disciple judges, under the charge Mormon gave: “see that ye do not judge wrongfully; for with that same judgment which ye judge ye shall also be judged” ([[Moro. 7:18]]).

