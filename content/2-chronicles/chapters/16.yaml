chapter: 16
title: Thou Hast Relied on the King of Syria
tagline: Asa buys Ben-hadad's help against Baasha, and it works; Hanani the seer tells him what it cost. The king who once prayed “we rest on thee” puts the seer in prison, and in his last disease he seeks not the LORD.
when: 'The last years of Asa king of Judah, from Baasha''s building of Ramah (verse 1) to Asa''s death in the forty-first year of his reign (verse 13)'

setting: |
  Chapter 16 closes the reign of Asa, the third king of Judah, whose history is told in [[1 Kgs. 15:9–24]] and in 2 Chronicles 14–16. Kings gives it a few verses; Chronicles gives it three chapters. The first two show Asa seeking the LORD in peace and in danger: he commanded Judah “to seek the LORD God of their fathers” ([[2 Chr. 14:4]]), cried to Him when Zerah's army came ([[2 Chr. 14:11]]), heard the prophet Azariah's word, “if ye seek him, he will be found of you; but if ye forsake him, he will forsake you” ([[2 Chr. 15:2]]), and led the people into a covenant to seek the LORD with all their heart ([[2 Chr. 15:12]]). This chapter tells the later years, when Asa's faith wavered.

  Verses 1–6 follow [[1 Kgs. 15:17–22]] almost word for word: Baasha fortifies Ramah on Judah's border, Asa sends silver and gold to Ben-hadad of Syria to break his league with Israel, and Baasha withdraws. The site's note at [[1 Kgs. 15:19]] explains Ramah and the bargain. Verses 7–10, Hanani's rebuke and Asa's anger, and the charge in verse 12 are Chronicles' own. Kings passes no blame on Asa. The date in verse 1, Asa's thirty-sixth year, does not fit Kings, where Baasha's son Elah began to reign in Asa's twenty-sixth ([[1 Kgs. 16:8]]); the note at [[2 Chr. 15:19]] gives the explanations that have been proposed.

thread: |
  One verb holds the chapter together, and the King James translates it two ways. When Zerah's army came, Asa prayed, “help us, O LORD our God; for we rest on thee” ([[2 Chr. 14:11]]). Against Baasha he leaned on the king of Syria instead, and Hanani tells him so in the same word: “thou hast relied on the king of Syria, and not relied on the LORD thy God” (verse 7). The bargain worked (verses 4–6). Hanani answers its success with the earlier victory, won “because thou didst rely on the LORD” (verse 8), and with the LORD's eyes that search the earth for whole hearts to strengthen (verse 9).

  The rest of the chapter shows the king's response. He put the seer in prison and oppressed some of the people (verse 10). His last years are measured by the verb of his own covenant: in his disease “he sought not to the LORD” (verse 12), the king who had led Judah to swear to seek Him ([[2 Chr. 15:12]]). Azariah had said at the start, “The LORD is with you, while ye be with him” ([[2 Chr. 15:2]]). Judah still buried him in the tomb he had made in the city of David, on a bed of spices, with a very great burning of spices for him (verse 14).

sections:
  - range: 1-6
    heading: Asa buys Ben-hadad's help
    plain: |
      In the thirty-sixth year of Asa's reign, Baasha king of Israel marched against Judah and fortified Ramah, to stop anyone from going out to Asa king of Judah or coming in to him. So Asa brought silver and gold out of the treasuries of the LORD's house and of the king's palace and sent them to Ben-hadad king of Syria, who ruled in Damascus, with this message: “There is a treaty between you and me, as there was between my father and your father. Look, I am sending you silver and gold. Go and break your treaty with Baasha king of Israel, so that he will withdraw from me.” Ben-hadad agreed with King Asa and sent his army commanders against the cities of Israel. They struck Ijon, Dan, Abel-maim, and all the store cities of Naphtali. When Baasha heard of it, he stopped fortifying Ramah and gave up the work. Then King Asa called out all Judah, and they carried away the stones and timber Baasha had been using at Ramah; with them Asa fortified Geba and Mizpah.
  - range: 7-10
    heading: Hanani's rebuke
    plain: |
      At that time Hanani the seer came to Asa king of Judah and said to him, “Because you relied on the king of Syria and did not rely on the LORD your God, the army of the king of Syria has escaped from your hand. Were not the Ethiopians and the Libyans a huge army, with a great many chariots and horsemen? Yet because you relied on the LORD, He delivered them into your hand. For the eyes of the LORD range over the whole earth, to show Himself strong on behalf of those whose hearts are whole toward Him. You have acted foolishly in this; from now on you will have wars.” Asa was angry with the seer and put him in prison (or in the stocks), for he was furious with him over this. At the same time Asa oppressed some of the people.
  - range: 11-14
    heading: Asa's disease and burial
    plain: |
      The acts of Asa, from first to last, are written in the book of the kings of Judah and Israel. In the thirty-ninth year of his reign Asa became diseased in his feet, and his disease grew very severe; yet even in his disease he did not seek the LORD, but the physicians. Asa rested with his fathers, dying in the forty-first year of his reign. They buried him in the tomb he had made for himself in the city of David, and laid him on a bed filled with sweet spices and many kinds of perfume blended by the perfumers' art, and they burned a very great fire of spices for him.

notes:
  - ref: 7
    phrase: Because thou hast relied on the king of Syria, and not relied on the LORD thy God
    kind: history
    title: Hanani's charge against a bargain that worked
    body: |
      Hanani does not say the alliance failed; it worked. Ben-hadad's raid on Israel's northern towns drew Baasha off, and Judah carried away the stones of Ramah to fortify its own border (verses 4–6). Kings tells the bargain without a word of blame (the note at [[1 Kgs. 15:19]]); Chronicles alone adds the seer, and his charge is about where the king put his weight. The verb he uses twice here and again in verse 8, to lean or support oneself and so to trust, is the verb of Asa's own prayer against Zerah, “we rest on thee”; the note at [[2 Chr. 14:11]] explains the echo. Against Zerah Asa had leaned on the LORD. Against Baasha he leaned on Damascus, and paid for it with silver and gold out of the treasures of the LORD's house (verse 2).

      The cost Hanani names is that “the host of the king of Syria escaped out of thine hand.” Syria had been Baasha's ally (verse 3), and one older reading takes the prophet to mean that if Asa had not bought Syria off with his gifts, he might have defeated Israel and Syria together. The proof Hanani offers is Asa's own history: the Ethiopians and the Lubims were “a huge host,” and “because thou didst rely on the LORD, he delivered them into thine hand” (verse 8).
    sources: [bdb, cambridge-chronicles, lds-scriptures]

  - ref: 9
    phrase: the eyes of the LORD run to and fro throughout the whole earth
    kind: words
    title: Eyes that look for a whole heart
    body: |
      Hanani's image gives the reason Asa could have leaned on the LORD: the LORD looks over the whole earth for people to strengthen. The rest of the sentence says what that search is for: “to shew himself strong in the behalf of them whose heart is perfect toward him.” “Perfect” is *shalem*, complete: a heart at peace with the LORD and keeping covenant with Him (explained at [[1 Kgs. 15:14]]). Chronicles has already used the word of Asa: “the heart of Asa was perfect all his days” ([[2 Chr. 15:17]]).

      The reproach that follows is for a king who looked elsewhere for strength: “Herein thou hast done foolishly: therefore from henceforth thou shalt have wars.” Asa had seen the LORD show Himself strong once already, when the Ethiopians and the Lubims fell before him (verse 8).
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 12
    phrase: yet in his disease he sought not to the LORD, but to the physicians
    kind: scripture
    title: Sought not to the LORD
    body: |
      The charge in this verse is that Asa did not seek the LORD, and “seek” is the verb of his whole reign. Asa commanded Judah “to seek the LORD God of their fathers” ([[2 Chr. 14:4]]) and told them, “we have sought the LORD our God” ([[2 Chr. 14:7]]). Azariah promised, “if ye seek him, he will be found of you” ([[2 Chr. 15:2]]), and the people covenanted “to seek the LORD God of their fathers with all their heart and with all their soul” ([[2 Chr. 15:12]]). The last thing Chronicles tells of Asa's life is that in a disease that grew “exceeding great” he did not. What the verse faults is the seeking he left undone. Kings says only that in his old age “he was diseased in his feet” (the note at [[1 Kgs. 15:23]]).
    sources: [oshb-wlc, lds-scriptures]

christ: |
  The LORD whose eyes “run to and fro throughout the whole earth, to shew himself strong in the behalf of them whose heart is perfect toward him” (verse 9) is Jehovah, the premortal Jesus Christ. Asa had once leaned his whole weight on Him (“we rest on thee,” [[2 Chr. 14:11]]), and Hanani's rebuke measures the king by that prayer.

  The proverb uses Hanani's verb for the same choice a disciple makes now: “Trust in the LORD with all thine heart; and lean not unto thine own understanding” ([[Prov. 3:5]]). In sickness, where Asa failed, seeking the LORD does not mean refusing the physicians: medical science “is not at odds with our prayers of faith,” and “We do all that we can for the healing of a loved one, and then we trust in the Lord for the outcome.”

explore: |
  - **Asa at his best.** His prayer and the victory over Zerah, [[2 Chr. 14:9–15]]; Azariah's word and the covenant to seek the LORD, [[2 Chr. 15:1–15]].
  - **The same years in Kings.** [[1 Kgs. 15:16–24]], with the site's notes on the league with Ben-hadad and Asa's disease.
  - **Leaning on horses.** [[Isa. 31:1]], where Isaiah uses Hanani's verb for Judah's trust in Egypt's horses, and laments that they do not “seek the LORD.”
  - **Hanani's son.** Jehu's rebuke of Jehoshaphat, [[2 Chr. 19:1–3]].

