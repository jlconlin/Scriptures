chapter: 15
title: He Was Found of Them
tagline: The prophet Azariah meets Asa coming home from battle with a promise and a warning; the king takes courage, clears the land of idols, and all Judah, with newcomers from the north, swears with shouting to seek the LORD.
when: 'The third month of the fifteenth year of Asa''s reign (verse 10), after his victory over Zerah the Ethiopian ([[2 Chr. 14:9–15]])'

setting: |
  Asa, Abijah's son, came to the throne after a time of wickedness and idolatry in Judah. He had ten quiet years ([[2 Chr. 14:1]]), and then a vast army under Zerah the Ethiopian came against him, and “the LORD smote the Ethiopians before Asa” ([[2 Chr. 14:12]]). Judah came home with much spoil, and chapter 15 follows that victory: the sacrifices of its covenant came out of the spoil (verse 11).

  Most of the chapter is Chronicles' own. Azariah's word and the covenant that followed it (verses 1–15) have no parallel in Kings. Verses 16–18 are told there too ([[1 Kgs. 15:13–15]]), and the site's notes on that chapter explain Maachah the queen mother ([[1 Kgs. 15:13]]) and what it meant for Asa's heart to be “perfect” while the high places stood ([[1 Kgs. 15:14]]). That note also takes up the reader's puzzle here: chapter 14 says Asa took the high places out of all the cities of Judah ([[2 Chr. 14:5]]), and verse 17 says they were not taken away out of Israel. The high places that remained are the subject of [[2 Chr. 20:33]]. The northerners who came over to Judah (verse 9), and what they have to do with Lehi, are explained at [[2 Chr. 11:16]].

  Chapter 16 tells the rest of Asa's reign: the war with Baasha, Asa's treaty with Syria, Hanani's rebuke, and his last illness.

thread: |
  The chapter is a promise and its keeping. Azariah's word in verse 2 has two halves: “The LORD is with you, while ye be with him; and if ye seek him, he will be found of you; but if ye forsake him, he will forsake you.” He backs it with Israel's history: whenever Israel had been without God, there was no peace, but whenever they turned in their trouble and sought Him, “he was found of them” (verses 3–6). Then he tells the king to be strong.

  Asa “took courage” (verse 8), and everything after follows from that: the idols cleared out, the altar repaired, the people gathered, a covenant sworn “with all their heart.” The chapter's own verdict uses Azariah's words: they “sought him with their whole desire; and he was found of them: and the LORD gave them rest round about” (verse 15). The promise of verse 2 has come true. Even the strangers from the north came “when they saw that the LORD his God was with him” (verse 9).

  The chapter has shown only the first half of the promise. The second half, “if ye forsake him, he will forsake you,” waits for the next chapter, when Asa relies on the king of Syria and not on the LORD ([[2 Chr. 16:7]]).

sections:
  - range: 1-7
    heading: Azariah's word to Asa
    plain: |
      The Spirit of God came on Azariah the son of Oded. He went out to meet Asa and said to him, “Listen to me, Asa, and all Judah and Benjamin. The LORD is with you as long as you are with Him. If you seek Him, He will let you find Him; but if you forsake Him, He will forsake you. For a long time Israel has been without the true God, without a priest to teach them, and without the law. But when in their distress they turned to the LORD God of Israel and sought Him, He let them find Him. In those times no one who went out or came in was safe; great troubles weighed on everyone who lived in the land. Nation was crushed by nation, and city by city, because God troubled them with every kind of distress. But you, be strong, and do not let your hands go slack, for your work will be rewarded.”
  - range: 8-15
    heading: The land cleared and the covenant sworn
    plain: |
      When Asa heard these words, the prophecy of Oded the prophet, he took courage. He removed the detestable idols from the whole land of Judah and Benjamin and from the towns he had captured in the hill country of Ephraim, and he repaired the LORD's altar that stood in front of the porch of the LORD's house. He gathered all Judah and Benjamin, and with them the people from Ephraim, Manasseh and Simeon who were living among them, for many had come over to him from Israel when they saw that the LORD his God was with him. They assembled at Jerusalem in the third month of the fifteenth year of Asa's reign. That day they sacrificed to the LORD, out of the spoil they had brought back, seven hundred oxen and seven thousand sheep. They entered into a covenant to seek the LORD, the God of their fathers, with all their heart and with all their soul, and agreed that anyone who would not seek the LORD God of Israel should be put to death, young or old, man or woman. They swore it to the LORD with a loud voice, with shouting, with trumpets and with horns. All Judah rejoiced over the oath, because they had sworn it with all their heart and had sought Him with all their desire, and He let them find Him. And the LORD gave them peace on every side.
  - range: 16-19
    heading: The queen mother, the high places, the gifts
    plain: |
      King Asa also removed Maachah, his grandmother, from her position as queen mother, because she had made an idol for Asherah. Asa cut down her idol, crushed it, and burned it at the brook Kidron. The high places, though, were not removed from Israel; even so, Asa's heart was wholly loyal all his life. He brought into the house of God the things that he and his father had dedicated: silver, gold and vessels. And there was no more war until the thirty-fifth year of Asa's reign.

notes:
  - ref: 2
    phrase: The LORD is with you, while ye be with him
    kind: scripture
    title: While ye be with him
    body: |
      Azariah's first sentence is the rule by which Chronicles measures Asa's reign. He spoke to the king after the LORD had given him the victory over Zerah, and his words reach beyond that one battle, in two halves: seek Him and He will be found; forsake Him and He will forsake you. The promise is old. Moses gave it to Israel before they entered the land, “if thou seek him with all thy heart and with all thy soul” ([[Deut. 4:29]]), and Jeremiah would give it again to the exiles: “ye shall seek me, and find me, when ye shall search for me with all your heart” ([[Jer. 29:13]]).

      In Chronicles the answer usually comes within the king's own lifetime: rewards and punishments “are not usually delayed” there, as they often are in Kings. This chapter shows the first half kept. The people sought the LORD “with their whole desire; and he was found of them” (verse 15), which is verse 2 fulfilled. The next chapter tests the second half, and the change in where Asa put his trust, from chapter 14 to chapter 16, is the story of his reign. He who had cried to the LORD against Zerah relied on the king of Syria against Baasha, and a seer told him so ([[2 Chr. 16:7]]).

      This is Chronicles' emphasis, not a promise that every reward and every judgment comes at once. Kings shows judgment delayed, and both books are needed: “Sometimes people are punished for iniquity or blessed for righteousness immediately, but sometimes they are not.”
    sources: [sc-knowhy-861, cfm-ot-2026-30, lds-scriptures]

  - ref: 3
    phrase: Now for a long season Israel hath been without the true God
    kind: history
    title: When Israel was without God
    body: |
      Azariah describes a time of anarchy without saying when it was, and the Hebrew is why the reader cannot tell. Verse 3 has no main verb. It reads, word for word, *and many days for Israel, without the God of truth, and without a teaching priest, and without law*; the King James translators supplied “hath been.” Nothing in the words fixes the time, and Azariah does not name it. His point is in verse 4: in that trouble, when Israel turned and sought the LORD, “he was found of them.”

      The three things Israel lacked belong together. The Hebrew *tôrâ*, “law,” means first “direction, instruction,” and in this verse, as in Malachi, it is the direction the priests gave about sacred things; a “teaching priest” (*kōhēn môreh*) is one who gives it. The Church's footnote on “teaching” points to Moses' blessing of Levi, “They shall teach Jacob thy judgments, and Israel thy law” ([[Deut. 33:10]]), and to the Levites Jehoshaphat would send through Judah with the book of the law ([[2 Chr. 17:9]]). Malachi says the same of the priest's office: “the priest's lips should keep knowledge, and they should seek the law at his mouth” ([[Mal. 2:7]]).
    sources: [oshb-wlc, biblehub-interlinear, bdb, lds-scriptures]

  - ref: 12
    phrase: they entered into a covenant to seek the LORD God of their fathers
    kind: history
    title: A covenant renewed, and its penalty
    body: |
      The covenant of verse 12 was not new. It was one of many times Israel renewed the covenant made at Sinai, and Judah bound itself to keep it by an oath sworn with shouting and trumpets (verse 14). Its sacrifices came out of the spoil taken from Zerah's army (verse 11; [[2 Chr. 14:13–15]]).

      The hardest clause is verse 13: whoever would not seek the LORD “should be put to death, whether small or great, whether man or woman.” The Law of Moses already set death as the penalty for a man or woman in Israel who had “gone and served other gods,” but only once the matter had been inquired into diligently and proved: “At the mouth of two witnesses, or three witnesses, shall he that is worthy of death be put to death” ([[Deut. 17:2–7]]). The text records the people's vow; it does not say that anyone was put to death under it.
    sources: [scripture-helps-2-chronicles, lds-scriptures]

  - ref: 19
    phrase: there was no more war unto the five and thirtieth year
    kind: history
    title: The thirty-fifth year
    body: |
      This verse and the date at [[2 Chr. 16:1]] do not fit easily with Kings. Kings says that “there was war between Asa and Baasha king of Israel all their days” ([[1 Kgs. 15:16]]), and Baasha was dead by Asa's twenty-sixth year, when his son Elah began to reign ([[1 Kgs. 16:8]]). Yet Chronicles has no war until Asa's thirty-fifth year, and Baasha attacking Judah in Asa's thirty-sixth ([[2 Chr. 16:1]]).

      Three explanations have been offered, and none is more than a proposal. Most older commentators counted the thirty-fifth year from the beginning of the kingdom of Judah rather than from Asa's accession, which would make it Asa's fifteenth year. One older commentary grants that this is right in substance but finds it cannot be squared with Chronicles' own words, “the six and thirtieth year of the reign of Asa” ([[2 Chr. 16:1]]), and concludes that the text has suffered: a copyist confused two Hebrew letters that look alike in the ancient script, one standing for 30 and the other for 10, so that an original 15 and 16 became 35 and 36. That would give Asa's reign a clean sequence: ten years of peace, Zerah's invasion in the eleventh, rest and the covenant in the fifteenth, and war with Baasha in the sixteenth. A third reading takes the word “war” in a different sense in each book: Kings means the lasting hostility between the two kingdoms, and Chronicles means open fighting, so that nothing serious happened until the quarrel had gone on for years. That accounts for the word, but it leaves the date as hard as before. Chapter 16 takes the war up at [[2 Chr. 16:1]].
    sources: [lds-scriptures, keil-chronicles, cambridge-chronicles]

christ: |
  The LORD whom Azariah promised would be found is Jehovah, the premortal Jesus Christ. The Church's footnote to verse 15, “he was found of them,” points to His promise in this dispensation: “Draw near unto me and I will draw near unto you; seek me diligently and ye shall find me” ([[D&C 88:63]]). The footnote to verse 12 points to the covenant King Benjamin's people made, to “enter into a covenant with our God to do his will” ([[Mosiah 5:5]]). He is still found by those who seek Him with their whole heart, and a covenant to seek Him, made in earnest, is a cause of joy, as it was for all Judah (verse 15).

