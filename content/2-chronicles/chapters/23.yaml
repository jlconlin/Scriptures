chapter: 23
title: The King's Son Shall Reign
tagline: In the seventh year Jehoiada the priest gathers the Levites, crowns the hidden son of David in the house of God, and has Athaliah put to death; the people covenant to be the LORD's, break down Baal's house, and the worship of the house is set again in David's order.
when: 'The seventh year of Athaliah''s reign, after Joash had been hidden six years in the house of God (verse 1; [[2 Chr. 22:12]])'

setting: |
  Chapter 22 ended with David's line nearly gone. Athaliah, Ahaziah's mother, had destroyed “all the seed royal of the house of Judah,” and one infant was saved: Joash, stolen from among the king's sons by Jehoshabeath, the king's daughter and the wife of Jehoiada the priest, and hidden with them in the house of God for six years while Athaliah reigned ([[2 Chr. 22:10–12]]). Athaliah, the daughter of Ahab and Jezebel, had brought the worship of Baal into Judah (see the note on [[2 Chr. 22:3]]). The chapter belongs to the second part of 2 Chronicles, the division of the kingdom and the history of the kings of Judah.

  The same events are told in [[2 Kgs. 11:4–20]], and the site's notes there explain the sabbath watch ([[2 Kgs. 11:5]]), the crown and the testimony ([[2 Kgs. 11:12]]), the covenant of king and people ([[2 Kgs. 11:17]]) and the house of Baal ([[2 Kgs. 11:18]]); they are not repeated here. What Chronicles tells differently is the subject of this chapter's notes. It names the five captains Jehoiada took into covenant, gathers the Levites and the heads of the fathers' houses from the cities of Judah, sets Levites where Kings has the royal guard, adds singers to the crowning, and ends with the priests, Levites, singers and porters set back in David's order. Even the covenant of verse 16 is worded differently. Kings has it made “between the LORD and the king and the people”; Chronicles has “between him, and between all the people, and between the king,” where “him” is Jehoiada himself, standing, on one older reading, as the LORD's representative.

thread: |
  The chapter heading sums up its end in three words: “Worship of the Lord is restored.” Each step toward that end is set on something older than Athaliah. The crowning rests on the LORD's word: “the king's son shall reign, as the LORD hath said of the sons of David” (verse 3). The boy is guarded by the tribe set apart to minister in the sanctuary, and no one but the priests and the ministering Levites goes into the house, “for they are holy” (verse 6). When the queen is dead and Baal's house broken down, the offerings are set again “as it is written in the law of Moses, with rejoicing and with singing, as it was ordained by David” (verse 18), with porters at the gates “that none which was unclean in any thing should enter in” (verse 19).

  Between the crowning and the cleansing stands the covenant “that they should be the LORD's people” (verse 16). The chapter opens with a covenant made with a hidden king in the house of God and closes with that king set on the throne of the kingdom, “and the city was quiet” (verse 21).

sections:
  - range: 1-3
    heading: A covenant in the house of God
    plain: |
      In the seventh year Jehoiada took courage and made a covenant with the commanders of hundreds: Azariah son of Jeroham, Ishmael son of Jehohanan, Azariah son of Obed, Maaseiah son of Adaiah, and Elishaphat son of Zichri. They went through Judah and gathered the Levites from all the cities of Judah and the heads of the families of Israel, and they came to Jerusalem. The whole assembly made a covenant with the king in the house of God, and Jehoiada said to them, “Here is the king's son. He shall reign, as the LORD promised concerning the descendants of David.”
  - range: 4-11
    heading: The Levites guard the crowning
    plain: |
      “This is what you are to do. A third of you priests and Levites who come on duty on the sabbath shall keep the doors. A third shall be at the king's palace, and a third at the Gate of the Foundation, and all the people shall be in the courts of the house of the LORD. Let no one come into the house of the LORD except the priests and the Levites who minister; they may go in, for they are holy. All the people shall keep the charge of the LORD. The Levites shall surround the king, every man with his weapons in his hand, and anyone else who enters the house shall be put to death. Stay with the king when he comes in and when he goes out.”

      The Levites and all Judah did everything Jehoiada the priest commanded. Each man took his men, those coming on duty on the sabbath and those going off, for Jehoiada the priest had not dismissed the divisions. Jehoiada gave the commanders of hundreds the spears and the large and small shields that had been King David's, which were in the house of God. He stationed all the people, every man with his weapon in his hand, from the right side of the temple to the left, along the altar and the temple, around the king. Then they brought out the king's son, put the crown on him, gave him the testimony, and made him king. Jehoiada and his sons anointed him and said, “Long live the king!”
  - range: 12-15
    heading: “Treason, treason”
    plain: |
      When Athaliah heard the noise of the people running and praising the king, she came to the people in the house of the LORD. She looked, and there was the king standing by his pillar at the entrance, with the officers and the trumpeters beside him. All the people of the land were rejoicing and blowing trumpets, and the singers with their instruments were leading the praise. Athaliah tore her clothes and cried, “Treason! Treason!” Jehoiada the priest brought out the commanders of hundreds who were over the army and said to them, “Take her out between the ranks, and kill with the sword anyone who follows her.” For the priest had said, “Do not kill her in the house of the LORD.” So they seized her, and when she reached the entrance of the Horse Gate by the king's palace, they killed her there.
  - range: 16-21
    heading: The LORD's people, and the order of David
    plain: |
      Jehoiada made a covenant between himself, all the people and the king, that they should be the LORD's people. Then all the people went to the house of Baal and tore it down. They smashed its altars and its images and killed Mattan the priest of Baal in front of the altars. Jehoiada put the offices of the house of the LORD under the priests, the Levites, whom David had assigned in the house of the LORD, to offer the burnt offerings of the LORD as it is written in the law of Moses, with rejoicing and singing, as David had ordained. He stationed the gatekeepers at the gates of the house of the LORD, so that no one unclean in any way could enter. He took the commanders of hundreds, the nobles, the rulers of the people and all the people of the land, and brought the king down from the house of the LORD. They went through the upper gate into the king's palace and set the king on the throne of the kingdom. All the people of the land rejoiced, and the city was quiet after Athaliah had been killed with the sword.

notes:
  - ref: 3
    phrase: the king’s son shall reign, as the LORD hath said of the sons of David
    kind: scripture
    title: The promise Jehoiada stood on
    body: |
      Jehoiada's case for crowning a seven-year-old ([[2 Chr. 24:1]]) is the LORD's promise to David, and only Chronicles puts it in his mouth. In Kings the priest makes a covenant with the captains, puts them under oath in the house of the LORD and shows them the king's son ([[2 Kgs. 11:4]]); nothing is said of why the boy should reign. Chronicles gives the reason. The assembly gathered from the cities of Judah makes its covenant with the king, and Jehoiada says, “Behold, the king's son shall reign, as the LORD hath said of the sons of David.”

      The footnote sends the reader to Nathan's oracle: “I will set up thy seed after thee, which shall proceed out of thy bowels, and I will establish his kingdom” ([[2 Sam. 7:12]]), with its sequel, “thy throne shall be established for ever” ([[2 Sam. 7:16]]). By this chapter the seed royal had come down to one hidden child ([[2 Chr. 22:10–12]]), and the priest crowned him on the strength of that word.
    sources: [lds-scriptures]

  - ref: 4
    phrase: of the priests and of the Levites
    kind: history
    title: Levites where Kings has the guard
    body: |
      Chronicles tells the crowning with Levites where Kings tells it with soldiers. In Kings, Jehoiada brings “the rulers over hundreds, with the captains and the guard” into the house of the LORD, and the men who come on and go off duty on the sabbath are the royal guard ([[2 Kgs. 11:4–9]]). In Chronicles the five named captains go through Judah and gather the Levites (verse 2), the men who come on duty on the sabbath are “of the priests and of the Levites” (verse 4), and the Levites surround the king with their weapons (verse 7). The captains themselves are not called Levites, and on one older reading they may have been officers of the royal guard, as Kings has them.

      How the two accounts fit is an old question. One older reading judges that in Chronicles Levitical temple guards “take the place of the royal guards” and thinks Kings' version the more exact. The other older reading holds that neither account is copied from the other: both are extracts that give only the main points of a fuller narrative, Kings stressing the part played by the guard and Chronicles the part played by the Levites, so that the two supplement each other and only together give the whole.

      Verse 6 says why Levites mattered here. No one was to come into the house of the LORD but the priests “and they that minister of the Levites; they shall go in, for they are holy,” while the people kept to the courts. Ministering in the sanctuary was the work given to the tribe of Levi; the Levites had been cleansed for their office and given to God in place of Israel's firstborn. On that second reading, the “house” here is the temple building itself, the holy place and the most holy, and the command keeps the crowd outside the limits the law set for the people.
    sources: [keil-chronicles, cambridge-chronicles, bd-levites, lds-scriptures]

  - ref: 18
    phrase: whom David had distributed in the house of the LORD
    kind: history
    title: The order of David set up again
    body: |
      Where Kings says only that “the priest appointed officers over the house of the LORD” ([[2 Kgs. 11:18]]), Chronicles shows Jehoiada setting the temple's service back as David had arranged it. The priests and Levites are those “whom David had distributed,” the courses into which “David divided them” ([[1 Chr. 23:6]]; the divisions run through [[1 Chr. 23–26]]). The burnt offerings are offered “as it is written in the law of Moses, with rejoicing and with singing, as it was ordained by David” (verse 18). The porters are set at the gates again (verse 19), as David had set “the divisions of the porters … to minister in the house of the LORD” ([[1 Chr. 26:12]]). The singers had already appeared at the crowning, leading the praise (verse 13), and the footnote there points to the singers of David's order, “instructed in the songs of the LORD” ([[1 Chr. 25:7]]).

      The house needed it. Athaliah had brought the worship of Baal into Judah, and the next chapter says what that meant for the temple: “the sons of Athaliah, that wicked woman, had broken up the house of God; and also all the dedicated things of the house of the LORD did they bestow upon Baalim” ([[2 Chr. 24:7]]). Jehoiada's order ends with the porters' charge, “that none which was unclean in any thing should enter in” (verse 19).
    sources: [lds-scriptures, bd-athaliah]

christ: |
  Jehoiada crowned the boy because the LORD had promised David a son on his throne (verse 3; [[2 Sam. 7:12–16]]), the covenant the Witness of Christ for [[2 Chr. 21]] shows fulfilled in Jesus Christ. The line that came down to one hidden child in this chapter is the line of the King whose throne is established for ever.

  The crowning ended in a covenant “that they should be the LORD's people” (verse 16). The same belonging is covenanted now when disciples “witness unto thee, O God, the Eternal Father, that they are willing to take upon them the name of thy Son” ([[D&C 20:77]]).

