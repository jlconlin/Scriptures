chapter: 7
title: Then Will I Hear from Heaven
tagline: Fire falls on the offerings as Solomon ends his prayer, and the people bow on the pavement. After fourteen days of feasting the people go home glad, and the LORD appears to Solomon by night with His answer, the promise “If my people … shall humble themselves,” and the terms on which the house will stand.
when: 'Solomon''s reign: the end of the dedication at the feast of the seventh month (verses 8–10), and afterward, when Solomon had finished the house of the LORD and his own house (verse 11).'

setting: |
  The chapter ends the dedication that began when the ark was carried in ([[2 Chr. 5]]) and Solomon prayed ([[2 Chr. 6]]), and then gives the LORD's answer. Kings tells the same events ([[1 Kgs. 8:54–9:9]]), and the site's notes there explain what the two accounts share: the vast numbers of oxen and sheep, which Kings gives too ([[1 Kgs. 8:63]]); the feast of the seventh month ([[1 Kgs. 8:2]]); the LORD's name, eyes and heart in the house ([[1 Kgs. 9:3]]); the condition on which the house would stand ([[1 Kgs. 9:6]]); and the house that is “high” ([[1 Kgs. 9:8]]).

  Chronicles adds three passages that Kings does not have: the fire from heaven on the offerings (verses 1–3), the priests and Levites at their stations with David's instruments (verse 6), and the promise of verses 13–15. It leaves out the blessing Solomon spoke over the congregation when he rose from prayer ([[1 Kgs. 8:55–61]]). Chronicles looks back on a house that Nebuchadnezzar's armies had since destroyed, and the question it appears to address is “Are we still God's people and does the covenant still stand?”

thread: |
  The LORD answers Solomon twice: in fire, before all the people, as soon as the prayer ends, and by word, to Solomon by night. The fire falls on the offerings, the glory rests on the house, and the people, seeing both, fall on their faces and sing the refrain of the ark's coming, “For he is good; for his mercy endureth for ever” (verse 3). The word begins, “I have heard thy prayer” (verse 12), and gives the terms.

  At the center of the answer is the promise only Chronicles has (verses 13–15). It takes up three of the prayer's cases, drought, locust and pestilence, and sets out the way back from them: if the LORD's people humble themselves, pray, seek His face and turn, He will hear, forgive and heal. Then come two roads (verses 17–22): walk as David walked and the throne stands; forsake the LORD and serve other gods, and land and house are lost. Chronicles comes back to the word of verse 14 again and again. When Rehoboam's princes humbled themselves, the LORD said, “I will not destroy them” ([[2 Chr. 12:7]]); Manasseh “humbled himself greatly” ([[2 Chr. 33:12]]); and the last king, Zedekiah, “humbled not himself” ([[2 Chr. 36:12]]).

sections:
  - range: 1-3
    heading: The fire came down from heaven
    plain: |
      When Solomon finished praying, fire came down from heaven and consumed the burnt offering and the sacrifices, and the glory of the LORD filled the house. The priests could not go into the house of the LORD, because the LORD's glory had filled it. When all the Israelites saw the fire come down and the glory of the LORD on the house, they bowed down with their faces to the ground on the pavement, worshipped, and gave thanks to the LORD, saying, “He is good; His mercy endures forever.”
  - range: 4-10
    heading: The house dedicated, and the feast
    plain: |
      Then the king and all the people offered sacrifices before the LORD. King Solomon offered twenty-two thousand oxen and a hundred and twenty thousand sheep; so the king and all the people dedicated the house of God. The priests stood at their posts, and so did the Levites with the instruments for the LORD's music that King David had made for praising the LORD, “for His mercy endures forever”; through their service David gave praise. Opposite them the priests blew trumpets, and all Israel stood. Solomon also consecrated the middle of the court in front of the house of the LORD and offered the burnt offerings and the fat of the peace offerings there, because the bronze altar he had made could not hold the burnt offerings, the grain offerings and the fat.

      At that time Solomon kept the feast for seven days, and all Israel with him, a very great assembly from the entrance of Hamath to the river of Egypt. On the eighth day they held a solemn assembly, for they had kept the dedication of the altar seven days and the feast seven days. On the twenty-third day of the seventh month he sent the people home, joyful and glad of heart for the goodness the LORD had shown to David, to Solomon and to His people Israel.
  - range: 11-16
    heading: I have heard thy prayer
    plain: |
      So Solomon finished the house of the LORD and the king's house, and he succeeded in everything he had set his heart on doing in the LORD's house and in his own. Then the LORD appeared to Solomon by night and said to him: “I have heard your prayer, and I have chosen this place for Myself as a house of sacrifice. If I shut up the heavens so that there is no rain, or command the locusts to devour the land, or send pestilence among My people, and if My people, who are called by My name, humble themselves and pray and seek My face and turn from their wicked ways, then I will hear from heaven and forgive their sin and heal their land. Now My eyes will be open and My ears attentive to the prayer offered in this place. For I have now chosen and consecrated this house, so that My name may be there forever; My eyes and My heart will be there always.
  - range: 17-22
    heading: If thou wilt walk before me
    plain: |
      “As for you, if you walk before Me as your father David walked, doing all I have commanded you and keeping My statutes and judgments, then I will establish your royal throne, as I covenanted with your father David when I said, ‘You will never lack a man to rule in Israel.’ But if you turn away and forsake the statutes and commandments I have set before you, and go and serve other gods and worship them, then I will pull Israel up by the roots out of the land I gave them, and this house that I consecrated for My name I will cast out of My sight and make a proverb and a byword among all peoples. And this house, high as it is, will astonish everyone who passes by, so that he will say, ‘Why has the LORD done this to this land and to this house?’ And they will answer, ‘Because they forsook the LORD God of their fathers, who brought them out of the land of Egypt, and took hold of other gods and worshipped and served them. That is why He has brought all this calamity on them.’”

notes:
  - ref: 1
    phrase: the fire came down from heaven, and consumed the burnt offering and the sacrifices
    kind: history
    title: Fire on the offerings, glory on the house
    body: |
      The fire is Chronicles' own: in Kings, Solomon rises from his knees and blesses the congregation ([[1 Kgs. 8:54–55]]), and no fire falls. The Church's footnote sets it beside two others. At the tabernacle's first offerings “there came a fire out from before the LORD, and consumed upon the altar the burnt offering and the fat,” and the people “fell on their faces” ([[Lev. 9:24]]), as they do here. At David's altar the LORD “answered him from heaven by fire upon the altar of burnt offering” ([[1 Chr. 21:26]]; the note there), on the threshingfloor of Ornan where this house now stood ([[2 Chr. 3:1]]).

      A reader of Chronicles has a question Kings never raises: the glory had already filled the house when the ark came in ([[2 Chr. 5:14]]), so how can it fill it again here? One older reading answers that the text never says the glory left during the prayer. The people saw “the glory of the LORD upon the house” (verse 3) as the fire came down: the glory came on the house in the fire, while the cloud filled it within, two signs of the one presence. On that reading the fire was the LORD's confirmation that He accepted the sacrifices offered on this altar, as He had at the tabernacle; Kings, having told of the cloud, passed over the confirming sign, while Chronicles, which follows the house's worship closely, could not leave it out.

      The people's response is the refrain the singers had raised when the cloud came, “For he is good; for his mercy endureth for ever” (the note at [[2 Chr. 5:13]]), and verse 6 sets the Levites to sing it again over the sacrifices.
    sources: [lds-scriptures, keil-chronicles]

  - ref: 10
    phrase: on the three and twentieth day of the seventh month he sent the people away
    kind: history
    title: Fourteen days, and home on the twenty-third
    body: |
      Chronicles counts the days more fully than Kings: seven for the altar, seven for the feast, a closing assembly, and the people sent home on the twenty-third. The Feast of Tabernacles ran from the fifteenth to the twenty-first of the seventh month, with an eighth day added, a day of holy convocation that the law calls “a solemn assembly” ([[Lev. 23:36]]), the term in verse 9. Counting back from the feast, one older reading puts the dedication of the altar from the eighth to the fourteenth of the month and the closing assembly on the twenty-second; the people left on the twenty-third. Why the feast is doubled is the note at [[1 Kgs. 8:2]].

      Kings says, “On the eighth day he sent the people away” ([[1 Kgs. 8:66]]). Taken strictly, the same reading grants, that is at variance with Chronicles; it explains the difference as loose wording about a well-known event: Solomon dismissed the people on the evening of the eighth day of the feast, and they set out the next morning, the twenty-third. Both accounts send them home glad for what the LORD had done for David, and the same reading gives the reason David is named: the finished temple fulfilled the promise made to him.
    sources: [bd-feasts, lds-scriptures, keil-kings]

  - ref: 12
    phrase: have chosen this place to myself for an house of sacrifice
    kind: scripture
    title: The place the LORD would choose
    body: |
      The LORD's first words name the house as the place Moses had promised: one place, chosen by the LORD, where Israel would bring its offerings. Where Kings says “I have hallowed this house” ([[1 Kgs. 9:3]]), Chronicles has “chosen this place … for an house of sacrifice,” and the Church's footnote on “place” sends the reader to Deuteronomy 12. There Israel was told, “Take heed to thyself that thou offer not thy burnt offerings in every place that thou seest: But in the place which the LORD shall choose in one of thy tribes, there thou shalt offer thy burnt offerings” ([[Deut. 12:13–14]]), the place “to cause his name to dwell there” ([[Deut. 12:11]]).

      The same footnote also points to Solomon's request that the LORD's eyes be open toward the house “night and day” ([[1 Kgs. 8:29]]), and the answer turns at once to prayer. Solomon had ended, “let thine ears be attent unto the prayer that is made in this place” ([[2 Chr. 6:40]]); the LORD answers in the same words, “mine ears attent unto the prayer that is made in this place” (verse 15). The house of sacrifice is also where prayer is heard. What it means that His name, eyes and heart would be there “perpetually” (verse 16) is the note at [[1 Kgs. 9:3]].
    sources: [lds-scriptures]

  - ref: 13
    phrase: If I shut up heaven that there be no rain
    kind: scripture
    title: Drought, locusts and pestilence
    body: |
      The LORD takes up the cases of Solomon's own prayer and speaks of them as His own to send: “If I shut up heaven… if I command the locusts… if I send pestilence.” Solomon had asked for drought, “When the heaven is shut up, and there is no rain, because they have sinned against thee” ([[2 Chr. 6:26]]), and for “pestilence … locusts, or caterpillers” ([[2 Chr. 6:28]]). The answer begins “I have heard thy prayer” (verse 12), and these are the calamities it names. The site's note on the same petition in Kings explains the covenant behind drought ([[1 Kgs. 8:35]]).

      The Church's footnote on “If” gives the Book of Mormon's reason why the Lord would send such things: “except the Lord doth chasten his people with many afflictions, yea, except he doth visit them with death and with terror, and with famine and with all manner of pestilence, they will not remember him” ([[Hel. 12:3]]). The calamity is meant to bring a people back, and the next verse says how they come.

      The verse does not make every drought a verdict. In Chronicles rewards and punishments “are not usually delayed,” but reading Kings and Chronicles together shows that “Sometimes people are punished for iniquity or blessed for righteousness immediately, but sometimes they are not.” The verse says what the LORD may send to turn His people; it does not say that everything that falls on a land is sent for its sins.
    sources: [lds-scriptures, sc-knowhy-861]

  - ref: 14
    phrase: If my people, which are called by my name, shall humble themselves, and pray, and seek my face, and turn from their wicked ways
    kind: scripture
    title: Four things to do, three things promised
    body: |
      The verse is a covenant in one sentence: four things the LORD's people do, humble themselves, pray, seek His face and turn, and three things He does, hear, forgive and heal. It answers Solomon's petition almost in his words. He had asked that if the people “pray toward this place, and confess thy name, and turn from their sin,” the LORD would “hear … from heaven, and forgive” and “send rain upon thy land” ([[2 Chr. 6:26–27]]). The LORD grants it, and adds two things the petition did not have: they must “humble themselves” and “seek my face.” The people are those “called by my name,” the name He had just put on the house.
    sources: [lds-scriptures]

  - ref: 20
    phrase: Then will I pluck them up by the roots out of my land
    kind: history
    title: Plucked up by the roots
    body: |
      Where Kings says “Then will I cut off Israel out of the land” ([[1 Kgs. 9:7]]), Chronicles has the LORD “pluck them up by the roots,” and the Church's footnote traces the image to Moses' warning of what the nations would say of a people who broke the covenant: “the LORD rooted them out of their land in anger, and in wrath, and in great indignation, and cast them into another land, as it is this day” ([[Deut. 29:28]]). The question and answer of the passersby that follow (verses 21–22) are the note at [[1 Kgs. 9:8]]. The “evil” the LORD brings in verse 22 is calamity, not wickedness.

      The book closes with the house burned, the wall broken down and the people carried to Babylon ([[2 Chr. 36:19–20]]), the warning of these verses fulfilled. The same answer that held out the warning had also held out the way back, in verse 14.
    sources: [lds-scriptures]

christ: |
  The LORD who answered Solomon by fire and promised to “hear from heaven, and … forgive their sin, and … heal their land” is Jehovah, the premortal Jesus Christ. In the Book of Mormon His own voice makes the same offer to those spared in the destruction before His coming: “will ye not now return unto me, and repent of your sins, and be converted, that I may heal you?” ([[3 Ne. 9:13]]).

  The Church's footnote on “seek my face” points to the Lord's word to Latter-day Saints who had been “afflicted, and persecuted, and cast out from the land of their inheritance” ([[D&C 101:1]]): “seek the face of the Lord always, that in patience ye may possess your souls, and ye shall have eternal life” ([[D&C 101:38]]). What verse 14 asked of Israel in a time of calamity, the Lord asks of His disciples always, and the promise that goes with it reaches past the land to eternal life.

