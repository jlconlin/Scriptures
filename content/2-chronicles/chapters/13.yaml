chapter: 13
title: God Himself Is with Us for Our Captain
tagline: Abijah of Judah stands on a mountain between two armies and preaches to Jeroboam's host about David's covenant and the LORD's priests. Caught in an ambush, Judah cries to the LORD, the priests sound the trumpets, and Israel is routed, because Judah relied on the LORD.
when: 'The three-year reign of Abijah over Judah, from the eighteenth year of Jeroboam king of Israel (verse 1).'

setting: |
  Kings gives Abijah eight verses, under the name Abijam: his accession in Jeroboam's eighteenth year, his mother, a verdict, the war with Jeroboam, his burial ([[1 Kgs. 15:1–8]]). The verdict is hard: “he walked in all the sins of his father … and his heart was not perfect with the LORD his God” ([[1 Kgs. 15:3]]; the note there explains the measure). Kings recounts none of his enterprises; Chronicles passes no verdict on him and tells one great war in full, with Abijah's speech before the battle, an account found only here.

  The two books ask different questions. Kings asks why the nation was destroyed; Chronicles asks, “Are we still God's people and does the covenant still stand?”, and writes to give an identity “based on worship and the ideals of the kingdom.” Abijah's speech turns on both, the house of David and the temple's service. One older reading holds that the speech and Kings' verdict can both stand: a king whose heart was divided could still rightly hold up Judah's lawful worship against the golden calves, and Kings itself mentions things Abijah had dedicated to the house of the LORD ([[1 Kgs. 15:15]]).

  Chronicles names Abijah's mother “Michaiah the daughter of Uriel of Gibeah,” where it earlier called her Maachah the daughter of Absalom ([[2 Chr. 11:20]]); the note at [[2 Chr. 11:22]] gives the older explanations.

thread: |
  The chapter is a sermon and a battle, and the sermon says beforehand why the battle will go as it does. Standing on a mountain between the armies, Abijah makes two claims for Judah. The kingdom is the LORD's, given to David and his sons for ever by a covenant of salt (verses 5, 8). And Judah still has the LORD's priests, the sons of Aaron, keeping the morning and evening service of the temple, while Israel has golden calves and priests anyone could become (verses 8–11). So “God himself is with us for our captain,” and Israel should not fight “against the LORD God of your fathers” (verse 12).

  Jeroboam answered with an ambush, and Judah found the battle before and behind. Then Judah did what the speech had described: they cried unto the LORD, the priests sounded the trumpets, the men shouted, and “God smote Jeroboam and all Israel” (verses 14–15). The narrator gives the victory one cause: Judah prevailed “because they relied upon the LORD God of their fathers” (verse 18). The chapter ends with the two kings' fortunes reversed. Jeroboam never recovered strength in Abijah's days, and the LORD struck him; Abijah grew mighty.

sections:
  - range: 1-3
    heading: Abijah reigns, and war breaks out
    plain: |
      In the eighteenth year of King Jeroboam, Abijah became king over Judah. He reigned three years in Jerusalem; his mother was Michaiah the daughter of Uriel of Gibeah. There was war between Abijah and Jeroboam. Abijah went into battle with an army of four hundred thousand chosen warriors, and Jeroboam drew up against him eight hundred thousand chosen men, mighty soldiers.
  - range: 4-12
    heading: Abijah's speech on mount Zemaraim
    plain: |
      Abijah stood on Mount Zemaraim, in the hill country of Ephraim, and called out: “Listen to me, Jeroboam and all Israel! Don't you know that the LORD God of Israel gave the kingship over Israel to David for ever, to him and his sons, by a covenant of salt? Yet Jeroboam son of Nebat, a servant of Solomon son of David, rose up and rebelled against his master. Worthless men, scoundrels, gathered around him and made themselves strong against Rehoboam son of Solomon, when Rehoboam was inexperienced and faint of heart and could not stand up to them.

      “And now you think you can stand against the kingdom of the LORD, which is in the hands of David's sons. You are a vast multitude, and you have with you the golden calves Jeroboam made to be your gods. Didn't you drive out the LORD's priests, the sons of Aaron, and the Levites, and make priests for yourselves the way the peoples of other lands do? Anyone who comes to be consecrated with a young bull and seven rams can become a priest of what are no gods.

      “But as for us, the LORD is our God, and we have not forsaken Him. Our priests who serve the LORD are sons of Aaron, and the Levites do their work. Every morning and every evening they burn burnt offerings and sweet incense to the LORD; they set out the showbread on the pure table and light the lamps of the gold lampstand every evening. We keep what the LORD our God requires, but you have forsaken Him. God Himself is with us at our head, and His priests with the trumpets to sound the battle alarm against you. People of Israel, do not fight against the LORD God of your fathers, for you will not succeed.”
  - range: 13-20
    heading: The ambush and the rout
    plain: |
      But Jeroboam had sent an ambush around to come at them from behind, so that his army was in front of Judah and the ambush behind. When Judah turned and saw that the battle was in front of them and behind them, they cried out to the LORD, and the priests blew the trumpets. Then the men of Judah raised the battle shout, and as they shouted, God struck down Jeroboam and all Israel before Abijah and Judah. The Israelites fled before Judah, and God gave them into Judah's hand. Abijah and his army struck them with a great slaughter: five hundred thousand of Israel's chosen men fell. So the Israelites were subdued at that time, and the people of Judah prevailed, because they relied on the LORD God of their fathers.

      Abijah pursued Jeroboam and took towns from him: Beth-el, Jeshanah and Ephrain, each with its villages. Jeroboam never regained his strength in Abijah's days; the LORD struck him, and he died.
  - range: 21-22
    heading: Abijah's house and his record
    plain: |
      But Abijah grew strong. He married fourteen wives and fathered twenty-two sons and sixteen daughters. The rest of Abijah's acts, his ways and his sayings, are written in the commentary of the prophet Iddo.

notes:
  - ref: 3
    phrase: four hundred thousand chosen men
    kind: history
    title: Four hundred thousand against eight hundred thousand
    body: |
      The armies are enormous, and the chapter's figures belong with the large numbers found throughout Chronicles: 400,000 for Judah, 800,000 for Israel, and 500,000 of Israel slain (verse 17). The general explanation, that numbers suffered in copying and that a word read as “thousand” may in places have stood for “captains of thousands,” is given in the note at [[2 Sam. 24:9]]. The same proposal holds that “along these lines most of the numerical problems of the later history fall into place,” and one of its examples is the next war in this book, where the Ethiopian host of [[2 Chr. 14:9]] would have “a thousand, not a million, warriors.”

      It is a proposal about how the figures were copied, not the text's own reading, and the chapter gives its numbers as they stand. Whatever their size, the text sets Judah's army at half of Israel's.
    sources: [ot-manual-large-numbers, lds-scriptures]

  - ref: 5
    phrase: by a covenant of salt
    kind: symbol
    title: A covenant of salt
    body: |
      Abijah's first argument is that the kingdom belongs to David's line by a covenant that does not lapse. The Hebrew lexicon finds the phrase “covenant of salt,” *bᵉrîṯ melaḥ*, in only two places: here, and where the LORD gives the priests their portions “by a statute for ever: it is a covenant of salt for ever before the LORD” ([[Num. 18:19]]). In both the phrase stands beside “for ever,” and Abijah joins them in the same way: the LORD “gave the kingdom over Israel to David for ever, even to him and to his sons by a covenant of salt.” Why salt should mark a lasting covenant is explained at [[Lev. 2:13]].

      From that premise Abijah draws the conclusion of verse 8. An army raised against Judah is raised against “the kingdom of the LORD in the hand of the sons of David,” and whatever its size, it is fighting against “the LORD God of your fathers” (verse 12).
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 7
    phrase: when Rehoboam was young and tenderhearted
    kind: words
    title: Young and tenderhearted
    body: |
      “Young and tenderhearted” most likely describes Rehoboam as inexperienced and weak of heart. Rehoboam was forty-one years old when he began to reign ([[2 Chr. 12:13]]), so *naʿar*, “young,” literally a child, is probably used figuratively here, of one young “in experience of government,” as Solomon called himself “but a little child” when he took the throne ([[1 Kgs. 3:7]]). “Tenderhearted” is *rak lēḇāḇ*, soft of heart, implying weakness; it can be taken as weak in understanding, or as the King James renders the same phrase in the law of war, “fainthearted,”, where the officers send home the man who is “fearful and fainthearted” ([[Deut. 20:8]]). Abijah's claim is that his father was too green and too timid to stand against Jeroboam and the “children of Belial” who gathered to him.

      That is not how Chronicles told the division. There Rehoboam “answered them roughly” and followed the young men's advice to make the yoke heavier ([[2 Chr. 10:13–14]]). One older reading notes the difference and concludes that Abijah “wishes to justify his father as much as possible in his speech,” laying the guilt of the revolt on Jeroboam and his worthless men.
    sources: [oshb-wlc, bdb, cambridge-chronicles, keil-chronicles, lds-scriptures]

  - ref: 9
    phrase: whosoever cometh to consecrate himself with a young bullock and seven rams
    kind: history
    title: A young bullock and seven rams
    body: |
      Abijah's charge is that in Israel a man became a priest far too easily. “Consecrate himself” is, in Hebrew, *to fill his hand*, the idiom for consecrating a priest: to consecrate is, “literally fill the hand.” Under the law, Aaron and his sons were consecrated with “one young bullock, and two rams without blemish,” over seven days: “seven days shalt thou consecrate them” ([[Ex. 29:1]]; [[Ex. 29:35]]). In Jeroboam's kingdom, Abijah says, anyone who came with the animals could be made a priest, and a priest only “of them that are no gods,” the golden calves of verse 8.

      Judah's answer is in verses 10–11: its priests are “the sons of Aaron,” the Levites serve beside them, and the daily offerings, the incense, the showbread and the lamps go on as the law commands. The Levites' expulsion from the north, and Jeroboam's priests taken from all the people, are told at [[2 Chr. 11:14]] and in the note at [[1 Kgs. 12:31]].
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 12
    phrase: his priests with sounding trumpets to cry alarm against you
    kind: history
    title: Trumpets to cry alarm
    body: |
      The trumpets Abijah points to are the ones the law gave the priests for war, with a promise attached. “The sons of Aaron, the priests, shall blow with the trumpets,” and “if ye go to war in your land against the enemy that oppresseth you, then ye shall blow an alarm with the trumpets; and ye shall be remembered before the LORD your God, and ye shall be saved from your enemies” ([[Num. 10:8–9]]; the note at [[Num. 10:9]] explains the remembrance). The Hebrew lexicon puts this verse's “trumpets of alarm,” *ḥăṣōṣᵉrôṯ hattᵉrûʿâ*, with the trumpets of [[Num. 10]] and with those the priest carried to war against Midian ([[Num. 31:6]]). One older reading takes Abijah to name the trumpets “as being the divinely appointed pledges that God would remember them in war, and would deliver them from their enemies.”

      Verses 14–15 tell what followed. Caught between Jeroboam's army and the ambush, Judah “cried unto the LORD, and the priests sounded with the trumpets”; the men of Judah shouted, and “God smote Jeroboam and all Israel.”
    sources: [lds-scriptures, bdb, oshb-wlc, keil-chronicles]

  - ref: 18
    phrase: because they relied upon the LORD God of their fathers
    kind: scripture
    title: Because they relied upon the LORD
    body: |
      The narrator gives Judah's victory a single cause, and the verb he uses returns in the story of the next king. “Relied” is *nišʿănû*, from *šāʿan*, to lean or support oneself, used figuratively for trusting someone. The Hebrew lexicon gathers its uses with the LORD in these chapters: here; Asa's prayer before the Ethiopian host, “help us, O LORD our God; for we rest on thee” ([[2 Chr. 14:11]]); and Hanani's rebuke of Asa years later, “Because thou hast relied on the king of Syria, and not relied on the LORD thy God, therefore is the host of the king of Syria escaped out of thine hand” ([[2 Chr. 16:7]]). The seer reminds Asa of the Ethiopians: “because thou didst rely on the LORD, he delivered them into thine hand” ([[2 Chr. 16:8]]).

      Abijah's army leaned on the LORD and prevailed against twice its number; Asa did the same against the Ethiopian host, and was rebuked when he leaned on a foreign king instead.
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 20
    phrase: the LORD struck him, and he died
    kind: history
    title: The LORD struck him
    body: |
      Chronicles puts Jeroboam's death down to the LORD's stroke; where Kings records his death, it says only that after reigning twenty-two years “he slept with his fathers” ([[1 Kgs. 14:20]]). The Church's footnote sets this verse beside the death of Nabal, “the LORD smote Nabal, that he died” ([[1 Sam. 25:38]]): a death the text puts down to the LORD's own stroke.

      The verse does not say when the stroke fell. It says that Jeroboam never regained his strength “in the days of Abijah,” and then that the LORD struck him. By Kings' count Jeroboam outlived Abijah: Asa, Abijah's son, began to reign “in the twentieth year of Jeroboam” ([[1 Kgs. 15:9]]), and Jeroboam reigned twenty-two.
    sources: [lds-scriptures]

  - ref: 22
    phrase: the story of the prophet Iddo
    kind: words
    title: The midrash of Iddo
    body: |
      The “story” of Iddo is, in Hebrew, his *midrash*, a word that appears in the Old Testament only twice, both in Chronicles: here and in “the story of the book of the kings” ([[2 Chr. 24:27]]). It means “study, exposition,” and it is a late word, common in later Hebrew “in sense of imaginative exposition or didactic story”; the two works Chronicles names this way “were probably of a didactic character,” records written to teach. Whatever its form, Iddo's record is lost. Chronicles cites his writings three times, for Solomon, Rehoboam and Abijah ([[2 Chr. 9:29]]; [[2 Chr. 12:15]]), and they are among the books scripture names in a way that shows they were “considered authentic and valuable” but that are not in the Bible today (the note at [[2 Chr. 9:29]]).
    sources: [oshb-wlc, bdb, bd-lost-books, lds-scriptures]

christ: |
  Hemmed in before and behind, Judah cried unto the LORD and prevailed “because they relied upon the LORD God of their fathers” ([[2 Chr. 13:18]]). The name the King James prints as LORD is Jehovah, and Jehovah is the premortal Jesus Christ. Leaning on Him rather than on the size of an army is still a disciple's recourse when the battle is before and behind.

explore: |
  - **The same reign in Kings.** [[1 Kgs. 15:1–8]].
  - **What Abijah was answering.** Jeroboam's calves and priests, [[1 Kgs. 12:25–33]]; the Levites who left the north, [[2 Chr. 11:13–17]].
  - **Relying on the LORD.** Asa's prayer and Hanani's rebuke, [[2 Chr. 14:11]]; [[2 Chr. 16:7–9]].

