chapter: 14
title: We Rest on Thee
tagline: Asa clears away the strange altars and commands Judah to seek the LORD, and builds in ten quiet years; when Zerah the Ethiopian comes with a vast host, Asa cries that Judah rests on the LORD, and the LORD smites the Ethiopians.
when: 'The first years of Asa king of Judah, Abijah''s son: ten years of quiet (verse 1), then the invasion of Zerah the Ethiopian (verse 9)'

setting: |
  Abijah has died, and his son Asa reigns in Jerusalem (verse 1). Kings tells Asa's forty-one years in sixteen verses ([[1 Kgs. 15:9–24]]): his reform, his bribe to the king of Syria against Baasha of Israel, and his diseased feet. Chronicles gives him three chapters and a much fuller account. Its pages give details of some kings of Judah that Kings does not record, and Asa is one of them, a king “who sought the Lord during peaceful and difficult times.”

  Chapter 14 opens the three. Its first verses run beside Kings' account of the reform ([[1 Kgs. 15:8–12]]); the battle with Zerah (verses 9–15) has no parallel in Kings. The site's notes on 1 Kings 15 explain the verdict on Asa's heart, the queen mother he deposed and the high places that remained ([[1 Kgs. 15:14]]), and are not repeated here. The next two chapters finish the story. The prophet Azariah goes out to meet Asa, points to the victory the LORD has given, and calls king and people to stay faithful, and Judah makes a covenant to seek the LORD ([[2 Chr. 15:1–15]]). Years later Hanani the seer rebukes Asa for relying on Syria, and holds up this battle against him ([[2 Chr. 16:7–9]]).

thread: |
  Two words carry Asa's first years. The first is “seek.” Asa commands Judah to seek the LORD (verse 4), and when he explains the peace the land enjoys he says it twice: “because we have sought the LORD our God, we have sought him, and he hath given us rest on every side” (verse 7). The second is rest. The land is quiet in verse 1 and again in verse 5, it has rest in verse 6, and verse 6 says whose gift the rest is: “the LORD had given him rest.” In Chronicles a reward usually comes in the reign itself, not generations later, and the chapter shows it: the seeking and the rest are told side by side.

  Then an army of a thousand thousand marches to Mareshah, and the rest is broken. Asa's prayer reaches for a different word: “we rest on thee” (verse 11), a verb that means to lean one's weight on someone. Asa sought the LORD in peace, and now he seeks Him in danger. The LORD smites the Ethiopians, Judah comes home laden with spoil, and the battle becomes the measure Asa's later reign will be judged by.

sections:
  - range: 1-5
    heading: Asa clears away the strange altars
    plain: |
      Abijah died and was buried in the city of David, and his son Asa became king in his place. In his days the land had peace for ten years. Asa did what was good and right in the eyes of the LORD his God. He removed the altars of foreign gods and the high places, smashed the sacred pillars and cut down the sacred poles of the goddess Asherah. He commanded Judah to seek the LORD, the God of their fathers, and to keep the law and the commandment. He removed the high places and the sun-pillars used in idol worship from all the cities of Judah, and the kingdom was at peace under him.
  - range: 6-8
    heading: Fortresses in the quiet years
    plain: |
      He built fortified cities in Judah, because the land was at rest. He had no war in those years, because the LORD had given him rest. He said to Judah, “Let us build these cities and put walls around them, with towers, gates and bars. The land is still ours, because we have sought the LORD our God; we have sought Him, and He has given us rest on every side.” So they built and prospered. Asa had an army of three hundred thousand men from Judah, armed with large shields and spears, and two hundred eighty thousand from Benjamin, armed with small shields and bows. All of them were valiant warriors.
  - range: 9-15
    heading: Zerah the Ethiopian
    plain: |
      Zerah the Ethiopian came out against them with an army of a thousand thousand and three hundred chariots, and he reached Mareshah. Asa went out to meet him, and they drew up for battle in the valley of Zephathah at Mareshah. Then Asa called to the LORD his God: “LORD, it is nothing for You to help, whether the many or those who have no strength. Help us, O LORD our God, for we rely on You, and in Your name we have come against this multitude. O LORD, You are our God; let no man prevail against You.” So the LORD struck down the Ethiopians before Asa and Judah, and the Ethiopians fled. Asa and his people pursued them as far as Gerar. So many Ethiopians fell that they could not recover; they were shattered before the LORD and His army. Judah carried off a great deal of plunder. They attacked all the towns around Gerar, for the terror of the LORD had fallen on them, and they plundered all those towns, for there was much plunder in them. They also attacked the camps of the herdsmen and carried off sheep and camels in great numbers. Then they returned to Jerusalem.

notes:
  - ref: 1
    phrase: In his days the land was quiet ten years
    kind: history
    title: Ten quiet years, and Kings’ war with Baasha
    body: |
      Chronicles gives Asa ten years of peace at the start of his reign, where Kings seems to leave no room for any. Kings says that Baasha became king of Israel in Asa's third year ([[1 Kgs. 15:33]]) and that “there was war between Asa and Baasha king of Israel all their days” ([[1 Kgs. 15:16]]). Chronicles, besides these ten quiet years, says that after the covenant of chapter 15 “there was no more war unto the five and thirtieth year of the reign of Asa” ([[2 Chr. 15:19]]), and it brings Baasha's march on Ramah only in the thirty-sixth year ([[2 Chr. 16:1]]).

      No Latter-day Saint source read takes up the difference, and the chapter does not settle it. What Chronicles adds is the source of the quiet. Chronicles presents the quiet not as a lull between campaigns but as something given: “the LORD had given him rest” (verse 6), and Asa himself names the reason (the note at verse 7).
    sources: [lds-scriptures]

  - ref: 3
    phrase: and the high places
    kind: scripture
    title: High places taken away, and high places that remained
    body: |
      Chronicles says twice in this chapter that Asa took away the high places (verses 3 and 5), and in the next chapter that “the high places were not taken away out of Israel” ([[2 Chr. 15:17]]), which is what Kings says ([[1 Kgs. 15:14]]). Jehoshaphat's reign shows the same apparent discrepancy: he removed the high places ([[2 Chr. 17:6]]) and yet left them standing ([[2 Chr. 20:33]]). The possible reasons, which apply to Asa as well, are discussed at [[2 Chr. 17:6]].

      Both statements stand in the text: Asa's reform was real, and high places remained. The site's note at [[1 Kgs. 15:14]] gives an older reading of why they remained, and what the high places were is explained at [[1 Kgs. 3:2]].
    sources: [scripture-helps-2-chronicles, lds-scriptures]

  - ref: 6
    phrase: And he built fenced cities in Judah
    kind: history
    title: Fortresses in the quiet years
    body: |
      Asa spent the years of peace making Judah defensible again. In Rehoboam's fifth year Shishak of Egypt “took the fenced cities which pertained to Judah, and came to Jerusalem” ([[2 Chr. 12:2–4]]). Asa undid that loss: he “raised the army to a state of efficiency, threw off the Egyptian yoke, and rebuilt the fortresses destroyed by Sheshonk,” and “after this time there was no invasion from Egypt for more than 250 years.” Kings, which tells little else of his early years, still remembers “the cities which he built” ([[1 Kgs. 15:23]]).

      Asa's own words in verse 7 tie the building to the peace that made it possible: they build “while the land is yet before us,” and the land is theirs because they have sought the LORD.
    sources: [bd-asa, lds-scriptures]

  - ref: 7
    phrase: because we have sought the LORD our God, we have sought him
    kind: scripture
    title: Rest because they sought the LORD
    body: |
      Asa names the reason for Judah's peace, and he says it twice: they have sought the LORD. The order is laid out in verses 4–7. He commanded Judah to seek the LORD and keep His law (verse 4); the kingdom was quiet (verse 5); the LORD gave rest (verse 6); and Asa joins the two, the seeking and the rest, with a “because.”

      Chronicles often tells its kings this way. Kings and Chronicles agree that blessing follows righteousness and punishment follows sin, but they differ on the timing. Kings can show a punishment falling long after the sin, “even if that punishment is delayed for a time,” while in Chronicles “rewards and punishments are not usually delayed,” and people are often rewarded for righteousness immediately. Verse 7 tells Asa's quiet years in just that way: the rest comes within his reign, and he names its cause.

      The word returns at once in Asa's story. After the battle the prophet Azariah puts it as a rule: “The LORD is with you, while ye be with him; and if ye seek him, he will be found of you” ([[2 Chr. 15:2]]). The people answer with a covenant to seek the LORD, one of many times Israel renewed the covenant made at Sinai ([[2 Chr. 15:12]]). Asa sought the Lord “during peaceful and difficult times”: here in peace, and in verse 11 in danger.
    sources: [sc-knowhy-861, scripture-helps-2-chronicles, lds-scriptures]

  - ref: 9
    phrase: Zerah the Ethiopian with an host of a thousand thousand
    kind: history
    title: Zerah the Cushite and his host
    body: |
      Who Zerah was is not known, and older readings take the figure given for his army to mean more than anyone could count. “Ethiopian” renders *hakkûšî*, “the Cushite,” a man of Cush, the land the Bible Dictionary places south of Egypt, from Syene to near Khartoum, including modern Nubia. Older commentators could not agree on more. One takes him for an Ethiopian prince rather than an Egyptian; another thinks it not improbable that he was an Arabian chief, since Chronicles places Arabians beside the Cushites ([[2 Chr. 21:16]]). No Egyptian or other record read here settles it. His host came as far as Mareshah, between Hebron and Ashdod, one of the cities Rehoboam had fortified ([[2 Chr. 11:8]]).

      The “thousand thousand,” a million, is the largest figure in the chapter, and older readings take it as a way of saying the greatest possible number: a host too great to count, not a census. Asa's own army is large too, 580,000 (verse 8). On one older reading Judah's numbers are given only to show that Asa did not set his hope on them, but on the LORD (verse 11). The site's note at [[2 Sam. 24:9]] explains the larger question of the Old Testament's very large numbers.
    sources: [oshb-wlc, bd-ethiopia, keil-chronicles, cambridge-chronicles, lds-scriptures]

  - ref: 11
    phrase: for we rest on thee
    kind: words
    title: Leaning on the LORD
    body: |
      Asa prays with the verb that Hanani will later turn against him. “We rest on thee” is *nišʿannû*, from *šāʿan*, to lean or support oneself, and figuratively to trust in a person: to put one's weight on someone. It is not the word for the “rest” the LORD gave in verses 6–7 (*nûaḥ*). The words around it make the same point: Asa goes out “in thy name,” and asks that no man “prevail against thee.”

      Years later Asa hired the king of Syria against Baasha, and Hanani the seer came to him using this same verb three times: “Because thou hast relied on the king of Syria, and not relied on the LORD thy God” ([[2 Chr. 16:7]]), and then, naming this very battle, “yet, because thou didst rely on the LORD, he delivered them into thine hand” ([[2 Chr. 16:8]]). The English “rest” and “rely” hide the echo; in Hebrew the rebuke repeats Asa's own prayer. The site's note at [[1 Kgs. 15:19]] gives the rebuke and its occasion, and its own place in Chronicles is chapter 16.
    sources: [bdb, oshb-wlc, lds-scriptures]

christ: |
  Asa won at Mareshah by leaning his whole weight on “the LORD his God” (verse 11), and the victory was the LORD's: “the LORD smote the Ethiopians” (verse 12). The LORD he leaned on is Jehovah, the premortal Jesus Christ, and Hanani later held up that day as what reliance on Him does: “because thou didst rely on the LORD, he delivered them into thine hand” ([[2 Chr. 16:8]]).

  The same reliance brings peace to a disciple now; *Come, Follow Me* draws from Asa's story that “Trusting in God will bring me peace.” The trust that endures is the kind Elder Christofferson describes, based “not on what God did or did not do in a particular circumstance or moment in time but on knowing Him as their benevolent Father and Jesus Christ as their faithful Redeemer.”

explore: |
  - **The rest of Asa's reign.** [[2 Chr. 15:1–19]], Azariah's word and the covenant to seek the LORD, and [[2 Chr. 16:1–14]], Hanani's rebuke and Asa's last years.
  - **The same reign in Kings.** [[1 Kgs. 15:9–24]], with the site's notes on it.
  - **Another king's prayer before a great multitude.** [[2 Chr. 20:3–12]], Jehoshaphat's, which *Come, Follow Me* sets beside Asa's.

