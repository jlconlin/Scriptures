chapter: 2
title: Who Is Able to Build Him an House?
tagline: Solomon writes to Huram king of Tyre for timber and a master craftsman, telling him what the house will be for and why no house can hold its God; Huram blesses the LORD and sends both, and the strangers in the land are numbered for the work.
when: 'Early in Solomon''s reign, before the building began “in the fourth year of his reign” ([[2 Chr. 3:2]]).'

setting: |
  Chapter 1 left Solomon with the wisdom he asked for at Gibeon and wealth besides. Chapter 2 turns it to the work his father had charged him with: David had gathered stone, metal, cedar and workmen and told his son to build ([[1 Chr. 22:2–16]]), and now Solomon arranges for what David could not supply. Kings tells the same negotiation with Hiram of Tyre ([[1 Kgs. 5:1–18]]) and the coming of the craftsman ([[1 Kgs. 7:13–14]]), and the Church's footnotes point there. Who Hiram was, how the logs came by sea to Joppa, the payment in grain and oil, and the levy laid on Israel are explained in the notes on that chapter, and this chapter does not repeat them.

  What Chronicles adds is mostly words. Its account of Solomon's message is much fuller than Kings', and nothing in Kings matches what Solomon says here about the temple itself (verses 4–6). Two times stand behind the chapter: the event, early in Solomon's reign, and the writing, after the exile, when the book's first readers had a rebuilt temple of their own and one reason for the book was “to legitimize their newly rebuilt temple.”

thread: |
  The chapter is a building contract, and in Chronicles it reads almost like a confession of faith. In Kings, Solomon tells Hiram why David could not build and why he now can ([[1 Kgs. 5:3–5]]). Here he recalls the cedar Huram sent David, then says what the house is for, the incense, the bread and the offerings of the law (verse 4), and why it must be great: “for great is our God above all gods” (verse 5). Then he checks himself: no house can contain a God whom the heaven of heavens cannot contain, and he builds only so that Israel may worship before Him (verse 6). On one older reading, that is the difference between the two accounts: Chronicles' Solomon announces a temple “designed for the worship of God, whom the heavens and the earth cannot contain.”

  Huram answers in kind. He blesses “the LORD God of Israel, that made heaven and earth” (verse 12), and the same older reading hears the Tyrian king “entering into Solomon's religious ideas.” Through it all runs David: the craftsmen “whom David my father did provide” (verse 7), the craftsmen of “my lord David thy father” (verse 14), and the strangers numbered “after the numbering wherewith David his father had numbered them” (verse 17). The son builds on what the father prepared.

sections:
  - range: 1-2
    heading: Solomon Determined to Build
    plain: |
      Solomon resolved to build a house for the name of the LORD, and a house for his kingdom. He counted out seventy thousand men to carry loads, eighty thousand to quarry stone in the hills, and thirty-six hundred to supervise them.
  - range: 3-10
    heading: Even So Deal with Me
    plain: |
      Solomon sent word to Huram king of Tyre: “You dealt with my father David and sent him cedar to build himself a house to live in. Do the same for me. I am about to build a house for the name of the LORD my God, to dedicate it to Him: to burn fragrant incense before Him, to set out the shewbread continually, and to offer burnt offerings morning and evening, on the sabbaths, at the new moons and at the appointed feasts of the LORD our God. This is Israel's duty forever. The house I am building will be great, for our God is greater than all gods. But who is able to build Him a house, when heaven, even the highest heaven, cannot contain Him? Who am I to build Him a house, except as a place to burn offerings before Him?

      “So send me a man skilled to work in gold, silver, bronze and iron, and in purple, crimson and blue cloth, who knows how to engrave, to work with the skilled men in Judah and Jerusalem whom my father David provided. Send me also cedar, fir and algum logs from Lebanon, for I know your men are skilled at cutting timber there. My men will work with yours to prepare timber for me in abundance, because the house I am going to build will be great and wonderful. For your men who cut the timber I will give twenty thousand measures of wheat, twenty thousand measures of barley, twenty thousand baths of wine and twenty thousand baths of oil.”
  - range: 11-16
    heading: Huram Answered in Writing
    plain: |
      Huram king of Tyre answered by a letter he sent to Solomon: “Because the LORD loves His people, He has made you king over them.” Huram also said, “Blessed be the LORD God of Israel, who made heaven and earth, who has given King David a wise son, full of discretion and understanding, to build a house for the LORD and a house for his kingdom.

      “Now I am sending you a skilled man, full of understanding, Huram, whom I call my father. His mother was from the daughters of Dan and his father was a man of Tyre. He knows how to work in gold, silver, bronze, iron, stone and timber, and in purple, blue, crimson and fine linen; he can engrave any kind of engraving and carry out any design given him, with your skilled men and those of my lord David your father. Now let my lord send his servants the wheat, barley, oil and wine he has promised. We will cut as much wood from Lebanon as you need and bring it to you in rafts by sea to Joppa, and you will carry it up to Jerusalem.”
  - range: 17-18
    heading: All the Strangers That Were in the Land
    plain: |
      Solomon took a census of all the foreigners living in the land of Israel, following the count his father David had made, and they numbered 153,600. He made seventy thousand of them carriers, eighty thousand quarrymen in the hills, and thirty-six hundred supervisors to keep the people at work.

notes:
  - ref: 4
    phrase: to burn before him sweet incense, and for the continual shewbread, and for the burnt offerings morning and evening
    kind: history
    title: What the house was for
    body: |
      Solomon tells a foreign king exactly what will happen in the house, and the list is the worship the law of Moses had set for the tabernacle. Kings' version of the letter has nothing like it ([[1 Kgs. 5:3–6]]); these words about the temple's purpose are Chronicles' own.

      Each item is a standing service, kept by day, by week and by season. The incense was burned on the golden altar every morning and every evening, “a perpetual incense before the LORD throughout your generations” ([[Ex. 30:8]]). The shewbread was twelve loaves set on a table in the holy place and renewed every Sabbath; in them the twelve tribes “were perpetually presented before God,” and since the priests ate the old loaves, the bread was “both a sacrifice and a communion.” The burnt offerings follow the calendar of [[Num. 28:1–15]]: two lambs every day, “for a continual burnt offering” ([[Num. 28:3]]), more on the sabbath, more at each new moon, and more again at the feasts of chapters 28–29.

      The word that ties the list together is “continual.” Solomon's house was to be a place where Israel's worship never stopped, and he calls it “an ordinance for ever to Israel.” The furnishings that served it, the golden altar, the tables for the shewbread and the candlesticks, are made in chapter 4 ([[2 Chr. 4:19–22]]).
    sources: [bd-shewbread, lds-scriptures]

  - ref: 6
    phrase: who am I then, that I should build him an house, save only to burn sacrifice before him
    kind: scripture
    title: A house for worship, not a dwelling
    body: |
      Solomon answers his own boast. Having said the house must be great because God is great (verse 5), he asks who could build God a house at all, “seeing the heaven and heaven of heavens cannot contain him,” and concludes that the house is not a place to hold God but a place to worship Him. The Church's footnote sets the line beside Solomon's dedicatory prayer, where he says the same of the finished house ([[1 Kgs. 8:27]]; Chronicles' account of the prayer has it at [[2 Chr. 6:18]]). The note at 1 Kings 8:27 explains how the house can be real without confining God.

      “Burn sacrifice” here and “burn … sweet incense” in verse 4 are one Hebrew verb, *lehaqṭîr*, to make an offering smoke, to send it up in smoke; the King James renders it with incense in one verse and sacrifice in the other. So the burning that verse 6 names as the house's only purpose is the same act that heads the list of services in verse 4.
    sources: [lds-scriptures, oshb-wlc, bdb]

  - ref: 8
    phrase: algum trees
    kind: words
    title: Algum trees
    body: |
      Algum is the same wood Kings calls almug: sandalwood, “probably the red sandalwood of India,” of which musical instruments are still made. Solomon brought it in for the temple, his own house and the instruments of the singers. Kings tells what was made of it, “pillars for the house of the LORD, and for the king's house, harps also and psalteries for singers” ([[1 Kgs. 10:12]]), and says it came by sea, when Hiram's navy “brought in from Ophir great plenty of almug trees” ([[1 Kgs. 10:11]]). Solomon here names it with the cedar and fir he asks for “out of Lebanon”; the text does not say how the timber from the mountains and the wood from Ophir were divided between the two kings' servants.
    sources: [bd-almug, lds-scriptures]

  - ref: 13
    phrase: of Huram my father’s
    kind: history
    title: Huram the craftsman and his title
    body: |
      The man Huram sends is the master craftsman whom Kings calls Hiram, and “my father” is a title of honor, not a family tie. Chronicles spells the king's name and the craftsman's alike as Huram, where Kings has Hiram; on one older explanation the forms vary because Phoenician was written with even fewer vowel signs than early Hebrew, which left the form of the name uncertain. The King James “of Huram my father's” reads as if the craftsman had once belonged to the king's father, but the Hebrew is simply *lĕḥûrām ʾāḇî*, “Huram my father,” and the older commentaries take *ʾāḇ* as a title of respect like “master” or “counsellor.” Joseph used the same word when he said God had made him “a father to Pharaoh” ([[Gen. 45:8]]). Chronicles uses it of the craftsman again when the work is done: “did Huram his father make to king Solomon” ([[2 Chr. 4:16]]).

      His mother is “of the daughters of Dan” here and “of the tribe of Naphtali” in Kings ([[1 Kgs. 7:14]]). One older reading joins the two: she was a Danite by birth who married into Naphtali and, widowed, married a man of Tyre. Another suggests that Chronicles' “Dan” recalls Aholiab, who was “of the tribe of Dan” and helped Bezaleel build the tabernacle ([[Ex. 31:6]]). The text does not settle which. His skills in verse 14 go beyond what Solomon asked for in verse 7: Huram adds stone, timber and fine linen to the metals, dyed cloth and engraving. The note at [[1 Kgs. 7:14]] says more about the craftsman himself.
    sources: [bd-hiram, cambridge-chronicles, oshb-wlc, keil-kings, lds-scriptures]

  - ref: 17
    phrase: Solomon numbered all the strangers that were in the land of Israel
    kind: history
    title: A hundred and fifty-three thousand strangers
    body: |
      Chronicles counts the whole labor force of verse 2 as “strangers,” foreigners living in Israel, and says Solomon counted them as David had. David had gathered these strangers to cut stone for the house ([[1 Chr. 22:2]]; the note there), and Chronicles says plainly later that “of the children of Israel did Solomon make no servants for his work” ([[2 Chr. 8:9]]). Kings adds a levy of thirty thousand Israelites sent to Lebanon in shifts ([[1 Kgs. 5:13–14]]), which the note at [[1 Kgs. 5:13]] explains.

      The overseers are 3,600 here and in verse 2, where Kings has “three thousand and three hundred” ([[1 Kgs. 5:16]]). The chapter gives its figure as it stands; how numbers like these may have shifted in copying is the note at [[2 Sam. 24:9]].
    sources: [lds-scriptures]

christ: |
  The LORD for whom Solomon built is Jehovah, the premortal Jesus Christ, and Solomon knew that no house could hold Him: he built so that his people could worship before One whom “the heaven and heaven of heavens cannot contain” (verse 6). The Church's footnote on Solomon's “I build” (verse 4) points to the Lord's word about a house built in this dispensation: “inasmuch as my people build a house unto me in the name of the Lord, and do not suffer any unclean thing to come into it, that it be not defiled, my glory shall rest upon it” ([[D&C 97:15]]). A disciple who goes to the Lord's house now goes, as Israel did, to worship before One no house can contain, and the promise that He will be found there is made to “all the pure in heart that shall come into it” ([[D&C 97:16]]).

