chapter: 35
title: Such a Passover as Josiah Kept
tagline: Josiah sets the priests and Levites in their places and gives the flocks, and Judah keeps a Passover by the book, like none since Samuel; years later he goes out against Pharaoh Necho, does not hear the word from God that Necho brings, and dies of his wounds, mourned by Jeremiah and all Judah.
when: 'The eighteenth year of Josiah king of Judah (verse 19), then his death at Megiddo at the end of his thirty-one-year reign (verse 20; [[2 Chr. 34:1]])'

setting: |
  Chapter 34 told how Josiah began to seek the God of David in the eighth year of his reign and to purge Judah in the twelfth, how the book of the law was found in the temple in his eighteenth year, how the prophetess Huldah answered him, and how he made a covenant before the LORD ([[2 Chr. 34:3]], 14–32). The Passover follows in the same year (verse 19), and on one older reading it was kept to ratify that covenant. Kings mentions it in three verses ([[2 Kgs. 23:21–23]]); Chronicles describes it in nineteen, nearly all its own. What the site says about the Passover as part of the covenant renewal is at [[2 Kgs. 23:21]].

  The second half of the chapter leaps to the end of the reign. In the spring of 609 BC, in one Latter-day Saint study's dating, Pharaoh Necho II marched north to help the last Assyrian ruler against Babylon, and Josiah went out to stop him at Megiddo. Kings gives the death in a sentence ([[2 Kgs. 23:29–30]]); Chronicles adds Necho's message, the disguise, the archers, the second chariot and Jeremiah's lament. Josiah's sons, and the end of the kingdom, follow in chapter 36.

thread: |
  The chapter sets a feast kept exactly beside a battle that should not have been fought. In the feast, every arrangement is “according to” something: the writing of David and Solomon (verse 4), the word of the LORD by Moses (verse 6), the book of Moses (verse 12), the ordinance (verse 13), the commandment of David (verse 15), the king's commandment (verses 10, 16). On one older reading, what set this Passover above every other was that it was kept in strict accordance with the book of the law.

  Then, “After all this” (verse 20), Josiah is at Megiddo. Kings had set his death after the LORD's word that the wrath kindled by Manasseh would not be turned ([[2 Kgs. 23:26]]); Chronicles leaves that out and judges the war on its own terms, as a venture against God's will. The king who ordered the feast by every written word died because he “hearkened not” to a word that came to him through Pharaoh (verse 22).

sections:
  - range: 1-6
    heading: Josiah sets the priests and Levites in their places
    plain: |
      Josiah kept a Passover to the LORD in Jerusalem; they killed the Passover lambs on the fourteenth day of the first month. He assigned the priests to their duties and encouraged them in the service of the LORD's house. He said to the Levites, who taught all Israel and were holy to the LORD, “Put the holy ark in the house that Solomon son of David, king of Israel, built. You no longer have to carry it on your shoulders. Now serve the LORD your God and His people Israel. Get yourselves ready by your fathers' families, in your divisions, as David king of Israel and his son Solomon wrote it down. Stand in the holy place in groups, so that each division of the families of the people has a part of a Levite family to serve it. Kill the Passover lambs, sanctify yourselves, and prepare your brothers, so that they can do what the LORD commanded through Moses.”
  - range: 7-9
    heading: The king and his princes give the flocks
    plain: |
      From his own herds and flocks Josiah gave the people thirty thousand lambs and young goats for the Passover offerings, for everyone who was there, and three thousand bulls. His officials gave willingly to the people, the priests and the Levites. Hilkiah, Zechariah and Jehiel, the officers in charge of the house of God, gave the priests two thousand six hundred animals from the flocks and three hundred cattle for the Passover offerings. Conaniah and his brothers Shemaiah and Nethaneel, with Hashabiah, Jeiel and Jozabad, the leaders of the Levites, gave the Levites five thousand animals from the flocks and five hundred cattle.
  - range: 10-19
    heading: The Passover kept
    plain: |
      So the service was ready. The priests stood in their places and the Levites in their divisions, as the king had commanded. They killed the Passover lambs; the priests sprinkled the blood they received from the Levites, and the Levites skinned the animals. They set aside the portions for the burnt offerings to give to each family group of the people to offer to the LORD, as the book of Moses directs, and they did the same with the cattle. They roasted the Passover lambs over the fire as the law requires, boiled the other holy offerings in pots, caldrons and pans, and carried them quickly to all the people. After that they prepared the meal for themselves and for the priests, because the priests, the sons of Aaron, were busy offering the burnt offerings and the fat until nightfall; so the Levites prepared for themselves and for the priests. The singers, the sons of Asaph, were at their posts, as David, Asaph, Heman and Jeduthun the king's seer had commanded, and the gatekeepers were at every gate. None of them had to leave their posts, because their fellow Levites prepared for them. So the whole service of the LORD was carried out that day: keeping the Passover and offering the burnt offerings on the LORD's altar, as King Josiah had commanded. The Israelites who were there kept the Passover at that time, and the Feast of Unleavened Bread for seven days. No Passover like it had been kept in Israel since the days of Samuel the prophet; none of the kings of Israel had kept such a Passover as Josiah kept with the priests, the Levites, all Judah and Israel who were there, and the people of Jerusalem. This Passover was kept in the eighteenth year of Josiah's reign.
  - range: 20-24
    heading: Necho's warning and Josiah's death
    plain: |
      After all this, when Josiah had set the temple in order, Necho king of Egypt came up to fight at Carchemish on the Euphrates, and Josiah went out to meet him. Necho sent messengers to him: “What quarrel is there between us, king of Judah? I have not come against you today, but against the house I am at war with. God has told me to hurry. Stop opposing God, who is with me, or He will destroy you.” But Josiah would not turn away from him. He disguised himself to fight him, and would not listen to Necho's words, which came from the mouth of God. He came to fight in the valley of Megiddo. Archers shot King Josiah, and he told his servants, “Take me away; I am badly wounded.” So his servants took him out of his chariot, put him in his other chariot and brought him to Jerusalem. He died and was buried in the tombs of his fathers, and all Judah and Jerusalem mourned for him.
  - range: 25-27
    heading: Jeremiah's lament
    plain: |
      Jeremiah composed a lament for Josiah, and to this day all the singing men and singing women speak of Josiah in their laments. They made this a custom in Israel, and they are written in the lamentations. The rest of Josiah's acts, his good deeds done according to what is written in the law of the LORD, and all he did from first to last, are written in the book of the kings of Israel and Judah.

notes:
  - ref: 3
    phrase: 'it shall not be a burden upon your shoulders: serve now the LORD your God, and his people Israel'
    kind: history
    title: The Levites no longer carry the ark
    body: |
      Josiah tells the Levites that the work that once defined them is finished and gives them another. The LORD had set the tribe of Levi apart “to bear the ark of the covenant of the LORD” ([[Deut. 10:8]]), and they carried it on their shoulders through the wilderness and until there was a temple to hold it. Now the ark has its house, and the Levites, whom verse 3 calls the teachers of all Israel (as under Jehoshaphat, [[2 Chr. 17:9]]), are to serve the LORD and His people another way.

      Whether the ark had been moved is not known. Many older interpreters thought that Manasseh or Amon had taken it from its place, and that Josiah ordered it brought back. One older reading answers that the chapter never mentions the ark again, and takes “Put the holy ark in the house” as a release rather than an errand: leave the ark where it is, and serve now as verses 4–6 describe.

      The new service is the Passover itself. In Exodus the whole congregation killed the lambs, a lamb for each house ([[Ex. 12:3]], 6), and the father of the family normally slew it. Here the Levites kill the lambs for everyone (verses 6, 11), skin them, carry the offerings to the people, and cook for the priests, the singers and the gatekeepers who cannot leave their posts (verses 14–15). At Hezekiah's Passover they had done it only for those who were not clean ([[2 Chr. 30:17]]). Both are among the ways the Passover changed after Moses: almost at once the feast “lost its domestic character and became a sanctuary feast,” and in later times the Levites, at least on some occasions, slew the sacrifices.
    sources: [keil-chronicles, bd-feasts, lds-scriptures]

  - ref: 13
    phrase: they roasted the passover with fire according to the ordinance
    kind: words
    title: Roasted, and the rest boiled
    body: |
      The Passover lambs were cooked as the law commands and the other offerings were boiled, though the Hebrew uses one verb for both. “Roasted” and “sod” (boiled) both translate *bāšal*, whose first sense is “boil” and whose wider sense is “cook.” With the words “with fire” it describes the roasting Exodus requires: “Eat not of it raw, nor sodden at all with water, but roast with fire” ([[Ex. 12:9]]). For the holy offerings in the second half of the verse the same verb keeps its plain sense, boiling; how the lexicon sorts the two, and the same verb in Deuteronomy's Passover law, is explained at [[Deut. 16:7]].

      So “according to the ordinance” claims that the lamb was prepared exactly as the law said, and the law's rule was for the lamb. The “other holy offerings” were sacrifices of another kind, boiled in pots, caldrons and pans and carried quickly to the people. This verse is one of the traces in the history of the voluntary peace offerings that came to be offered beside the Passover lamb.
    sources: [oshb-wlc, bdb, bd-feasts, lds-scriptures]

  - ref: 18
    phrase: there was no passover like to that kept in Israel from the days of Samuel the prophet
    kind: history
    title: No Passover like it since Samuel
    body: |
      Kings and Chronicles make the same claim for Josiah's Passover in different words. Kings says there was none like it “from the days of the judges that judged Israel” ([[2 Kgs. 23:22]]). Chronicles names Samuel, who “judged Israel all the days of his life” ([[1 Sam. 7:15]]) and closed the period of the judges.

      The claim seems to collide with what Chronicles said of Hezekiah's Passover a century earlier: “since the time of Solomon the son of David king of Israel there was not the like in Jerusalem” ([[2 Chr. 30:26]]; the note there explains that comparison). One older reading explains what set Josiah's above every other. All the nation took part, Judah and the remnant of the northern tribes (“all Judah and Israel that were present”), and it was kept in strict accordance with the book of the law. Hezekiah's had of necessity departed from the law in several points. It was moved to the second month, and many ate it without the purification the law required ([[2 Chr. 30:2–3]], 17–20). Josiah's was kept on the day the law set, the fourteenth of the first month (verse 1; [[Ex. 12:6]]).
    sources: [keil-kings, keil-chronicles, lds-scriptures]

  - ref: 21
    phrase: 'for God commanded me to make haste: forbear thee from meddling with God, who is with me'
    kind: history
    title: Necho's warning
    body: |
      Pharaoh told Josiah that he had no quarrel with Judah and that God was sending him elsewhere. Necho “disclaimed enmity”: his war was with another “house,” the Babylonians, against whom he was marching to help Assyria (the background is in the setting, and the note at [[2 Kgs. 23:29]] explains Kings' wording). Josiah went out to block him anyway. Scripture does not say why. He may have hoped to cut off Assyria's help and make sure of its defeat; the attempt has also been compared to a fly trying to stop a bull.

      The surprise is that a pharaoh speaks for God, and the Chronicler means it. Verse 22 calls Necho's message “the words of Necho from the mouth of God”: the narrator, not only Necho, says that God had spoken. A Latter-day Saint reading of the book takes it the same way: Josiah came to fight “despite being warned by God not to intervene.” The warning came from an unlikely mouth, but the text treats it as the LORD's.
    sources: [bd-josiah, tolley-imprisonment, lund-ezekiel, sc-knowhy-861, lds-scriptures]

  - ref: 22
    phrase: hearkened not unto the words of Necho from the mouth of God
    kind: history
    title: Why Josiah died
    body: |
      Chronicles gives a reason for Josiah's death that Kings does not: he did not hearken to a word from God. Kings tells the death after the LORD's word that the wrath Manasseh had provoked would not be turned away ([[2 Kgs. 23:26–27]]), and the site's note at [[2 Kgs. 23:26]] explains that judgment. Chronicles does not draw that connection. On a Latter-day Saint reading of the book, rewards and punishments in Chronicles “are not usually delayed,” and Josiah's death is “one good example”: “Because Josiah ignored God, the Egyptians killed him.” The same reading does not set the two books against each other; it holds that “Both Kings and Chronicles are necessary,” because sometimes people are punished or blessed at once, “but sometimes they are not.”

      Josiah also “disguised himself,” as Ahab had at Ramoth-gilead ([[2 Chr. 18:29]]). Both kings are listed among the Bible's disguise stories, and one reading of those stories holds that the disguise is penetrated and God's will reaches the one who hid; that reading is given at [[1 Kgs. 22:30]].

      Huldah's promise that he would go to his grave “in peace” ([[2 Chr. 34:28]]) is not taken up again here; how it was kept is explained at [[2 Kgs. 22:20]].
    sources: [sc-knowhy-861, sc-knowhy-310, lds-scriptures]

  - ref: 25
    phrase: And Jeremiah lamented for Josiah
    kind: history
    title: The lost laments for Josiah
    body: |
      Jeremiah's lament for Josiah is not known to survive under his name. On one older reading, “the lamentations” where it was written were a collection of laments that held Jeremiah's for Josiah, sung by the singing men and women as a standing custom, an “ordinance in Israel,” and not the book of Lamentations. That book is a set of dirges “over the fall of Jerusalem and the nation,” written some years after the city fell. The footnote to “lamented” points to Lamentations 4:20, the grief for “the anointed of the LORD” who “was taken in their pits”; the note at [[Lam. 4:20]] explains whom that verse means.

      Other passages of scripture are set beside Josiah's death: [[Jer. 22:10]] (the note there explains whom it means) and Zechariah's mourning at Hadadrimmon ([[Zech. 12:11]]), taken up below.
    sources: [bd-lamentations, keil-chronicles, bd-josiah, lds-scriptures]

christ: |
  The Passover Josiah kept “according to the word of the LORD by the hand of Moses” (verse 6) remembered the night the LORD passed over Israel's houses and redeemed His people from Egypt, and the New Testament names the Lamb it pointed to: “Christ our passover is sacrificed for us” ([[1 Cor. 5:7]]). Megiddo, where Josiah fell, gives Zechariah the measure of a greater grief. He sees Jerusalem look “upon me whom they have pierced” and mourn “as the mourning of Hadadrimmon in the valley of Megiddon” ([[Zech. 12:10–11]]); the note at [[Zech. 12:11]] gives the reasons for hearing in it the grief for Josiah. And in the latter days the Lord says whose wounds they are: “I am Jesus that was crucified” ([[D&C 45:52]]).

  The Savior ate His last Passover with His disciples, and at that table He gave them bread with the words “this do in remembrance of me” ([[Luke 22:15]], 19). A disciple who takes the sacrament keeps that remembrance of the Lamb who was slain and of the redemption He wrought.

