chapter: 12
title: That They May Know My Service
tagline: Rehoboam grows strong and forsakes the law, and Shishak of Egypt comes against Jerusalem. The prophet Shemaiah names the reason, the king and his princes humble themselves, and the LORD spares the city but leaves them to learn what serving another king costs.
when: 'The reign of Rehoboam over Judah: Shishak''s invasion in his fifth year (verse 2), and the end of his seventeen years (verse 13).'

setting: |
  Chronicles gives Rehoboam three chapters. Chapter 10 tells the division of the kingdom at Shechem as [[1 Kgs. 12]] tells it; chapter 11 has him building fenced cities and receiving the priests, Levites and others from the north who came to Judah and made his kingdom strong for three years ([[2 Chr. 11:5–17]]). This chapter is the end of his reign.

  Kings tells the invasion in four verses: in Rehoboam's fifth year Shishak came up against Jerusalem, took the treasures of the temple and the palace and Solomon's shields of gold, and Rehoboam made shields of brass in their place ([[1 Kgs. 14:25–28]]). Shishak was the first king of Egypt's twenty-second dynasty, and a relief of his victory over Rehoboam survives on the wall of the temple of Karnak; the site's note at [[1 Kgs. 14:25]] tells the story and what the gold shields had been.

  What Chronicles adds is the size of Shishak's army (verse 3), the reason he came (verse 2), the prophet Shemaiah's word, the humbling of the king and his princes and the LORD's answer (verses 5–8), and a verdict on Rehoboam himself (verse 14), where Kings' verdict falls on Judah ([[1 Kgs. 14:22]]). Kings has no prophet in the story; Chronicles makes the invasion a word from the LORD and an answer to it.

thread: |
  The chapter turns on what Rehoboam and his people did with their strength. Once the kingdom was established, they forsook the law of the LORD, and in the fifth year Egypt came. Shemaiah gave the reason in the LORD's own words, one verb used twice: they had forsaken Him, so He had forsaken them to Shishak.

  Then the chapter turns. The king and the princes humbled themselves and said, “The LORD is righteous,” and the LORD answered through the same prophet: He would not destroy them, and would grant them some deliverance. The deliverance was real but limited. Jerusalem was not destroyed; the treasures of the temple and the palace went to Egypt, Solomon's gold shields were replaced with brass, and Judah became Shishak's servants, so that they would know, in the LORD's words, “my service, and the service of the kingdoms of the countries” (verse 8).

  The last word is a verdict on the man and not on the war. Rehoboam had humbled himself once, under a foreign army, but he did evil, “because he prepared not his heart to seek the LORD” (verse 14).

sections:
  - range: 1-4
    heading: Rehoboam forsakes the law, and Shishak comes
    plain: |
      When Rehoboam's kingdom was firmly established and he had grown strong, he abandoned the law of the LORD, and all Israel with him. So in the fifth year of King Rehoboam, because they had been unfaithful to the LORD, Shishak king of Egypt came up against Jerusalem with twelve hundred chariots and sixty thousand horsemen, and the soldiers who came with him out of Egypt, the Libyans, the Sukkiim and the Cushites, were beyond counting. He took the fortified cities of Judah and came to Jerusalem.
  - range: 5-8
    heading: Shemaiah's word, and the princes humble themselves
    plain: |
      Then the prophet Shemaiah came to Rehoboam and to the princes of Judah, who had gathered at Jerusalem because of Shishak, and said to them, “This is what the LORD says: You have forsaken me, so I have forsaken you into the hand of Shishak.” The princes of Israel and the king humbled themselves and said, “The LORD is righteous.” When the LORD saw that they had humbled themselves, His word came to Shemaiah: “They have humbled themselves, so I will not destroy them. I will grant them some deliverance, and my wrath will not be poured out on Jerusalem by the hand of Shishak. But they will become his servants, so that they may know what it is to serve me and what it is to serve the kingdoms of the lands.”
  - range: 9-12
    heading: Gold taken, brass in its place
    plain: |
      So Shishak king of Egypt came up against Jerusalem and took away the treasures of the house of the LORD and the treasures of the king's house. He took everything, including the gold shields Solomon had made. King Rehoboam made shields of brass to replace them and entrusted them to the chief of the guard who kept the entrance of the king's house. Whenever the king went into the house of the LORD, the guard came and carried them, and then brought them back to the guardroom. Because Rehoboam humbled himself, the LORD's anger turned from him, and He did not destroy him completely. And in Judah there were still good things.
  - range: 13-16
    heading: Rehoboam's reign summed up
    plain: |
      So King Rehoboam made himself strong in Jerusalem and reigned. He was forty-one years old when he became king, and he reigned seventeen years in Jerusalem, the city the LORD had chosen out of all the tribes of Israel to put His name there. His mother was Naamah, an Ammonite woman. He did evil, because he did not set his heart to seek the LORD. Rehoboam's acts, from first to last, are written in the book of Shemaiah the prophet and of Iddo the seer, concerning the genealogies. There was war between Rehoboam and Jeroboam all the time. Rehoboam died and was buried in the city of David, and his son Abijah became king after him.

notes:
  - ref: 1
    phrase: he forsook the law of the LORD, and all Israel with him
    kind: history
    title: Strong, and then forsaking
    body: |
      Chronicles dates Judah's falling away from the moment the kingdom was secure. In chapter 11 the priests, Levites and faithful people from the north who came to Jerusalem “strengthened the kingdom of Judah, and made Rehoboam the son of Solomon strong, three years” ([[2 Chr. 11:17]]). The next thing told of his reign is that “when Rehoboam had established the kingdom, and had strengthened himself, he forsook the law of the LORD” ([[2 Chr. 12:1]]), and by the fifth year Shishak was at the gates.

      Chronicles does not name the sins. Kings' account of the same reign does, though it does not date them within the reign: Judah “provoked him to jealousy with their sins,” building “high places, and images, and groves, on every high hill, and under every green tree,” and doing “according to all the abominations of the nations which the LORD cast out before the children of Israel” ([[1 Kgs. 14:22–24]]; the site's note “Groves” at [[1 Kgs. 14:15]] explains the word).
    sources: [lds-scriptures]

  - ref: 5
    phrase: Ye have forsaken me, and therefore have I also left you in the hand of Shishak
    kind: words
    title: Forsaken, and left
    body: |
      Shemaiah's sentence uses one Hebrew verb twice, which the King James Version renders two ways. “Ye have forsaken me” is *ʿăzaḇtem*, and “have I also left you” is *ʿāzaḇtî*, from the same verb *ʿāzaḇ*, “leave, forsake.” Read with the one verb, the sentence says: you forsook me, and I have forsaken you into Shishak's hand.

      Shemaiah is the prophet who, at the start of Rehoboam's reign, told him not to fight the northern tribes, and was obeyed ([[2 Chr. 11:2–4]]; [[1 Kgs. 12:22–24]]). Here he gives the reason verse 2 has already stated, “because they had transgressed against the LORD” ([[2 Chr. 12:2]]). In Chronicles, rewards and punishments “are not usually delayed,” and so it is here: the consequence came in the reign that earned it, by its fifth year.
    sources: [oshb-wlc, bdb, sc-knowhy-861, lds-scriptures]

  - ref: 7
    phrase: I will grant them some deliverance
    kind: words
    title: Some deliverance, or deliverance soon
    body: |
      The deliverance the LORD promises is limited, and the Hebrew leaves open whether in size or in time. The phrase is *kimʿaṭ lip̄lêṭāh*, and *kimʿaṭ*, “like a little,” can measure an amount or a time. The King James Version took it as an amount, “some deliverance,” and the Church's chapter heading reads it the same way, as a partial deliverance; the Hebrew lexicon lists this verse under the sense “shortly,” deliverance soon. Either way, the promise is limited by the next verse: the people would not be destroyed, but they would be Shishak's servants ([[2 Chr. 12:8]]).

      What moved the LORD was that the king and his princes “humbled themselves” and said, “The LORD is righteous” ([[2 Chr. 12:6]]). It is the verb the LORD used in His answer to Solomon's prayer, “If my people … shall humble themselves” ([[2 Chr. 7:14]]; the note there explains the promise). “Humbled” comes three times in verses 6–7, and once more in verse 12, where it is the reason the LORD's wrath turned from Rehoboam.
    sources: [oshb-wlc, bdb, lds-scriptures]

  - ref: 8
    phrase: that they may know my service, and the service of the kingdoms of the countries
    kind: history
    title: My service, and the service of the kingdoms
    body: |
      The servitude to Egypt was meant to teach Judah a comparison. They would “know” two kinds of service, the LORD's and that of “the kingdoms of the countries,” and learn by experience the difference between the two. On one older reading the lesson was that “God's rule was not so oppressive as that of the rulers of the world.”

      The next verse shows what the other service cost. Shishak took the treasures of the house of the LORD and of the king's house: “he took all,” including Solomon's gold shields ([[2 Chr. 12:9]]). The brass shields Rehoboam made in their place, carried out and put back whenever he went to the temple (verses 10–11), are the measure of the loss; the site's note at [[1 Kgs. 14:25]] describes them.
    sources: [keil-chronicles, cambridge-chronicles, lds-scriptures]

  - ref: 12
    phrase: and also in Judah things went well
    kind: words
    title: Good things in Judah
    body: |
      The King James Version reads the end of verse 12 as a report of Judah's fortunes, but the Hebrew can as well be a reason for the LORD's mercy. Literally it reads *and also in Judah there were good things*, and the Hebrew words for “good things,” *dᵉḇārîm ṭôḇîm*, return when the seer Jehu rebukes Jehoshaphat and still finds something to commend: “Nevertheless there are good things found in thee” ([[2 Chr. 19:3]]). Two older commentaries read verse 12 by that verse: the good things are “proofs of piety and fear of God,” given as a further reason for the mercy the LORD had shown in verse 7. On that reading the verse names two reasons Judah was not destroyed altogether: the king humbled himself, and there was still some good in the land.
    sources: [oshb-wlc, keil-chronicles, cambridge-chronicles, lds-scriptures]

  - ref: 14
    phrase: because he prepared not his heart to seek the LORD
    kind: words
    title: He prepared not his heart
    body: |
      Chronicles' verdict on Rehoboam names the reason behind the evil he did: he did not set his heart on seeking the LORD. “Prepared” is *hēḵîn*, from *kûn*, “make firm”; with “heart” it is to set the heart firmly toward something. The Hebrew lexicon gathers this verse with two others that use the same phrase, to prepare the heart “to seek” God: Jehoshaphat, who “hast prepared thine heart to seek God” ([[2 Chr. 19:3]]), and the people at Hezekiah's Passover ([[2 Chr. 30:19]]); and beside them Ezra, who “had prepared his heart to seek the law of the LORD” ([[Ezra 7:10]]).
    sources: [oshb-wlc, bdb, lds-scriptures]

christ: |
  The LORD who left Judah in Shishak's hand and turned His wrath when they humbled themselves is Jehovah, the premortal Jesus Christ. The promise He gave Solomon, to hear a people who humble themselves ([[2 Chr. 7:14]]), held for Rehoboam under a foreign army: when the LORD saw that they humbled themselves, He would not destroy them, and His wrath turned away ([[2 Chr. 12:7]]; [[2 Chr. 12:12]]). Humility before Him can still turn away what would destroy a disciple, even where the consequences of a choice remain: Judah kept its life and its city, lost its gold, and learned by serving Shishak what the LORD's service had been.

explore: |
  - **The same reign in Kings.** [[1 Kgs. 12:1–24]]; [[1 Kgs. 14:21–31]].
  - **Rehoboam's strong years.** [[2 Chr. 11:5–17]], the fenced cities and the faithful who came from the north.
  - **The promise to the humble.** [[2 Chr. 7:14]]; then the other kings who humbled themselves, [[2 Chr. 32:26]]; [[2 Chr. 33:12–13]]; [[2 Chr. 34:27]].

