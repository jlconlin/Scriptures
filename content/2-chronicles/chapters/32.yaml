chapter: 32
title: With Us Is the LORD Our God
tagline: Sennacherib invades Judah; Hezekiah walls the city, stops the springs and tells the people that the LORD will fight for them, and the LORD saves Jerusalem. Healed of his sickness, the king's heart is lifted up; he humbles himself, and when envoys come from Babylon God leaves him to try him.
when: 'The reign of Hezekiah king of Judah, after his reform ([[2 Chr. 29]]–31): Sennacherib''s invasion, Hezekiah''s sickness, the envoys from Babylon, and his death'

setting: |
  Hezekiah has cleansed the temple, kept a Passover and gathered the people's tithes and offerings, and chapter 31 ends with his work done “with all his heart” ([[2 Chr. 31:21]]). Chapter 32 tells the rest of his reign. Almost all of it is told also in [[2 Kgs. 18:13]]–20:21 and in [[Isa. 36]]–39, which the site has already explained, and Chronicles gives only a short account of the war, with some additions of its own.

  The largest addition is the preparation of Jerusalem for the siege (verses 2–8), which neither Kings nor Isaiah tells. Chronicles also adds the gifts brought after the deliverance (verse 23) and the pride and humbling of Hezekiah's heart (verses 25–26), and where Kings says the envoys from Babylon came because he had been sick, Chronicles says God left him “to try him” (verse 31). It leaves out the tribute Hezekiah sent to Sennacherib at Lachish with the words “I have offended” ([[2 Kgs. 18:14–16]]).

  The invasion is Sennacherib's campaign of 701 B.C. Sennacherib reigned in Assyria from 705 to 681 B.C., and his sons slew him; verse 21 tells his end in the same breath as his retreat, though it came years later (the note at [[Isa. 37:38]]). The next chapter is the reign of Hezekiah's son Manasseh.

thread: |
  The chapter asks where Judah's trust rests, first in the face of an enemy and then in the king's own heart. Sennacherib comes against the cities, and Hezekiah walls Jerusalem and stops the springs, then gathers the people and tells them what the walls are not: the Assyrian has “an arm of flesh,” and Judah has “the LORD our God to help us, and to fight our battles” (verse 8). Sennacherib's servants ask the people the opposite question, “Whereon do ye trust?” (verse 10), and set the God of Jerusalem among gods made by men's hands (verse 19). King and prophet pray, and the LORD saves the city. On one older reading, that is why Chronicles tells the war at all: to show how the LORD helped a faithful king and humbled the presumption of an emperor who relied on his army.

  Then the test turns inward. The saved and healed king, honored by the nations, does not answer the kindness done to him; his heart is lifted up (verse 25). He humbles himself, and the wrath waits beyond his days (verse 26). The envoys from Babylon come, and God leaves him “to try him, that he might know all that was in his heart” (verse 31); on the same older reading, the trial was meant to humble him, not to ruin him.

sections:
  - range: 1-8
    heading: Hezekiah prepares Jerusalem
    plain: |
      After these things and this faithfulness, Sennacherib king of Assyria came and invaded Judah. He camped against the fortified cities, intending to take them for himself. When Hezekiah saw that Sennacherib had come and meant to attack Jerusalem, he consulted with his officials and his warriors about stopping up the springs outside the city, and they supported him. A great many people gathered and stopped up all the springs and the stream that flowed through the land. “Why should the kings of Assyria come and find plenty of water?” they said. Hezekiah set to work with resolve. He rebuilt every broken section of the wall and raised towers on it, built another wall outside it, strengthened the Millo in the city of David, and made weapons and shields in great numbers. He put military commanders over the people, gathered them to him in the square at the city gate, and encouraged them: “Be strong and courageous. Do not be afraid or dismayed because of the king of Assyria and the whole army with him, for there are more with us than with him. With him is only human strength, but with us is the LORD our God, to help us and to fight our battles.” And the people relied on the words of Hezekiah king of Judah.
  - range: 9-19
    heading: Sennacherib's servants mock the LORD
    plain: |
      After this Sennacherib king of Assyria, who was besieging Lachish with all his forces, sent his servants to Jerusalem, to Hezekiah king of Judah and to all the people of Judah who were in Jerusalem, with this message: “This is what Sennacherib king of Assyria says: What are you relying on, that you stay in Jerusalem under siege? Isn't Hezekiah misleading you, to let you die of hunger and thirst, when he tells you, ‘The LORD our God will save us from the king of Assyria’? Didn't this same Hezekiah remove the LORD's high places and altars, and command Judah and Jerusalem, ‘You must worship before one altar and burn incense on it’? Don't you know what I and my fathers have done to all the peoples of other lands? Were the gods of those nations able to save their lands from my hand? Which of all the gods of the nations my fathers destroyed could save his people from me? How then could your God save you from me? Now do not let Hezekiah deceive you or mislead you like this. Do not believe him. No god of any nation or kingdom has been able to save his people from me or from my fathers. How much less will your God save you from my hand!” Sennacherib's servants said still more against the LORD God and against His servant Hezekiah. The king also wrote letters insulting the LORD God of Israel and speaking against Him: “Just as the gods of the nations of other lands did not save their people from my hand, so the God of Hezekiah will not save His people from my hand.” His men shouted in Hebrew to the people of Jerusalem who were on the wall, to frighten and terrify them so that they could capture the city. They spoke of the God of Jerusalem as though He were like the gods of the other peoples of the earth, which are made by human hands.
  - range: 20-23
    heading: The LORD saves Jerusalem
    plain: |
      Because of this King Hezekiah and the prophet Isaiah son of Amoz prayed and cried out to heaven. And the LORD sent an angel, who destroyed all the mighty warriors, the leaders and the officers in the camp of the king of Assyria. So Sennacherib went back to his own land in disgrace. And when he went into the temple of his god, some of his own sons killed him there with the sword. So the LORD saved Hezekiah and the people of Jerusalem from the hand of Sennacherib king of Assyria and from the hand of all their enemies, and He took care of them on every side. Many brought offerings to the LORD at Jerusalem and valuable gifts to Hezekiah king of Judah, and from then on he was highly regarded by all the nations.
  - range: 24-26
    heading: Sickness, pride and humbling
    plain: |
      In those days Hezekiah became ill and was at the point of death. He prayed to the LORD, who answered him and gave him a sign. But Hezekiah did not respond to the kindness shown him, because his heart became proud; so wrath came on him and on Judah and Jerusalem. Then Hezekiah humbled himself for the pride of his heart, he and the people of Jerusalem with him, and the LORD's wrath did not come on them in Hezekiah's days.
  - range: 27-33
    heading: Riches, the envoys, and Hezekiah's death
    plain: |
      Hezekiah had very great wealth and honor. He made treasuries for his silver and gold, precious stones and spices, shields and every kind of valuable article. He also built storehouses for the harvest of grain, new wine and oil, stalls for all kinds of livestock, and pens for the flocks. He acquired towns and large numbers of flocks and herds, for God had given him very great possessions. It was this same Hezekiah who blocked the upper outlet of the Gihon spring and channeled the water down to the west side of the city of David. Hezekiah succeeded in everything he did. And so, in the matter of the envoys sent by the rulers of Babylon to ask about the wonder that had happened in the land, God left him alone to test him and to know everything that was in his heart. The rest of Hezekiah's acts and his good deeds are written in the vision of the prophet Isaiah son of Amoz, in the book of the kings of Judah and Israel. Hezekiah rested with his fathers, and they buried him in the foremost of the tombs of David's descendants. All Judah and the people of Jerusalem honored him at his death. And his son Manasseh became king in his place.

notes:
  - ref: 1
    phrase: After these things, and the establishment thereof
    kind: words
    title: After this faithfulness
    body: |
      “The establishment thereof” is Hezekiah's faithfulness. The Hebrew word is *ʾĕmet*, firmness, faithfulness, truth, and a modern translation renders the line “After these things and these acts of faithfulness.” It is the word that closed the account of his reform the verse before the chapter break: Hezekiah “wrought that which was good and right and truth before the LORD his God” ([[2 Chr. 31:20]]).

      So Chronicles marks the invasion by what came before it rather than by a year. Kings dates it “in the fourteenth year of king Hezekiah” ([[2 Kgs. 18:13]]) and goes straight on to the king's message to Lachish and the gold he stripped from the temple doors to pay Sennacherib (the note at [[2 Kgs. 18:14]]). Chronicles tells none of that. Its Hezekiah has just done what was good and right and true, and he meets the invader with walls, water and a speech about the LORD (verses 2–8).
    sources: [bdb, oshb-wlc, nrsvue, lds-scriptures]

  - ref: 5
    phrase: built up all the wall that was broken, and raised it up to the towers, and another wall without
    kind: history
    title: Hezekiah’s walls
    body: |
      Some of the wall Hezekiah built can still be seen. The kings of Judah had added to Jerusalem's defenses reign by reign (Uzziah built towers, [[2 Chr. 26:9]], and Jotham carried on the work, [[2 Chr. 27:3–4]]), and with the Assyrian army coming Hezekiah fortified the city heavily once more; remnants of his walls have been found in excavations. The best known is the “Broad Wall,” uncovered in the Jewish Quarter of the Old City and dated to the late eighth century B.C. and Hezekiah's reign: a stretch about 65 meters long and 7 meters thick, standing in places 3.3 meters high, the footing of a taller wall that has not survived. It was built to enclose the western hill and protect the people living outside the old walls of the eastern hill, and it runs straight through houses of the time, some of them filled in to carry it. The urgency that sacrificed those houses is reflected in Isaiah's rebuke of the same years: “the houses have ye broken down to fortify the wall” ([[Isa. 22:10]]).

      The water was the other half of the work. The springs outside the city were stopped so that the enemy would not “find much water” (verse 4), and the Gihon was brought inside (verse 30) by the tunnel described in the note at [[2 Kgs. 20:20]].
    sources: [seely-woods-jerusalem-destroyed, pierce-israelite-refugees, lds-scriptures]

  - ref: 8
    phrase: With him is an arm of flesh; but with us is the LORD our God to help us, and to fight our battles
    kind: scripture
    title: An arm of flesh
    body: |
      Hezekiah told the people what their walls could not do. Sennacherib's strength was “an arm of flesh,” mortal power, and Judah's help was the LORD. The Church's footnote sends the phrase to the Topical Guide's “Trust Not in the Arm of Flesh,” and the site's notes at [[Isa. 31:3]] and [[Jer. 17:5]] follow it to Nephi's “I will not put my trust in the arm of flesh” ([[2 Ne. 4:34]]).

      The walls themselves could become an arm of flesh. In those same years Isaiah rebuked Jerusalem for its breached walls, its pooled water and its broken-down houses: “but ye have not looked unto the maker thereof” ([[Isa. 22:11]]). The fault he named was a preoccupation with physical preparations instead of trust in the Lord. A century later Lehi's sons did not believe “that Jerusalem, that great city, could be destroyed” ([[1 Ne. 2:13]]). Hezekiah's walls and the water he brought inside the city would surely have added to that feeling that it could not fall, and it appears that some still trusted in their fortifications instead of in the Lord. In Chronicles the king who built the walls is the one who tells the people where their help is, and they lean on his words.
    sources: [lds-scriptures, pierce-israelite-refugees, sc-knowhy-451, seely-woods-jerusalem-destroyed]

  - ref: 20
    phrase: Hezekiah the king, and the prophet Isaiah the son of Amoz, prayed and cried to heaven
    kind: history
    title: King and prophet together
    body: |
      Chronicles names the prophet beside the king in prayer. Isaiah was Hezekiah's chief adviser, with great religious and political influence through his reign. The prayer Hezekiah offered, and the LORD's answer sent through Isaiah, are given in full at [[Isa. 37:15–35]] and explained in the notes there; the angel's blow is at [[Isa. 37:36]] and [[2 Kgs. 19:35]].

      Isaiah's part runs to the end of the chapter. For the rest of Hezekiah's acts Chronicles sends its reader to “the vision of Isaiah the prophet, the son of Amoz” (verse 32), the title Isaiah's own book bears ([[Isa. 1:1]]). The King James adds an “and” that the Hebrew does not have, so a modern translation reads a single source, “written in the vision of the prophet Isaiah son of Amoz in the Book of the Kings of Judah and Israel.” Either way, the Chronicler's record of this king rests on a prophet's.
    sources: [bd-isaiah, oshb-wlc, nrsvue, lds-scriptures]

  - ref: 25
    phrase: Hezekiah rendered not again according to the benefit done unto him; for his heart was lifted up
    kind: history
    title: A heart lifted up
    body: |
      The benefit Hezekiah did not repay was the LORD's kindness to him: his healing and the sign of verse 24. The Hebrew *gəmûl* is a dealing done to someone, here a benefit, and he “rendered not again,” gave nothing back to match it; instead his heart was lifted up, grew proud. On one older reading, he had promised in his sickness to walk humbly all his days (“I shall go softly all my years,” [[Isa. 38:15]]), and his pride showed when he displayed his treasures to the envoys from Babylon ([[2 Kgs. 20:13]]); the wrath was Isaiah's word that all of it would be carried to Babylon ([[2 Kgs. 20:17]]).

      Then he humbled himself, and the people of Jerusalem with him, and the wrath did not come in his days (verse 26). On the same reading the judgment was postponed, not cancelled, and fell in the Chaldean invasion. To humble themselves is the first thing the LORD asked of His people in His answer to Solomon ([[2 Chr. 7:14]]), and the note at [[Isa. 39:8]] weighs Hezekiah's answer to Isaiah beside this verse.
    sources: [bdb, keil-chronicles, lds-scriptures]

  - ref: 31
    phrase: God left him, to try him, that he might know all that was in his heart
    kind: scripture
    title: Left to be tried
    body: |
      Chronicles explains the envoys from Babylon as a test. They came, it says, to ask about “the wonder that was done in the land,” and the Hebrew word, *môpēt*, is the one used for the sign given at Hezekiah's healing (verse 24); Kings says only that they came because he had been sick ([[2 Kgs. 20:12]]). Chronicles adds what lay behind the visit: God left the king to himself, to try him.

      The words come from Moses, who told Israel that the LORD had led them forty years in the wilderness “to humble thee, and to prove thee, to know what was in thine heart” ([[Deut. 8:2]]); the Church's footnote points there, and the note on that verse reads the wilderness as a test as well as a punishment. The Hebrew here says only “to know,” without naming who would know. What Hezekiah showed the envoys, and what Isaiah said it would cost, is [[Isa. 39]], where the note at [[Isa. 39:2]] reads the tour as a failure of gratitude.
    sources: [oshb-wlc, lds-scriptures]

christ: |
  Hezekiah told Jerusalem that with them was “the LORD our God to help us, and to fight our battles” (verse 8), and the LORD saved the city (verse 22). That LORD is Jehovah, the premortal Jesus Christ, who says to His Saints in this dispensation, “I will fight your battles” ([[D&C 105:14]]). When the same king's heart was lifted up he humbled himself, and the LORD held back the wrath (verse 26), as He had promised to hear those who humble themselves ([[2 Chr. 7:14]]).

  A disciple's preparations are an arm of flesh when trust rests on them instead of on “the maker thereof,” who “fashioned it long ago” ([[Isa. 22:11]]). Nephi's resolve is the disciple's: “I will not put my trust in the arm of flesh” ([[2 Ne. 4:34]]).

explore: |
  - **The longer accounts.** [[2 Kgs. 18:13–20:21]] and [[Isa. 36–39]], with the site's notes on them.
  - **Isaiah's word to the builders.** [[Isa. 22:8–11]]: the walls and the water, and the Maker no one looked to.
  - **The next king who humbled himself.** [[2 Chr. 33:12–13]], Manasseh in his affliction.
  - **What the deliverance taught a later Jerusalem.** [“How Could Jerusalem, ‘That Great City,’ Be Destroyed?”](https://scripturecentral.org/archive/books/book-chapter/how-could-jerusalem-great-city-be-destroyed), on how Hezekiah's walls and his rescue became Lehi's generation's false security.

