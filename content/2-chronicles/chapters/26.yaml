chapter: 26
title: Marvellously Helped, till He Was Strong
tagline: Uzziah seeks God and prospers in war, building and farming; grown strong and proud, he goes into the temple to burn incense, is struck with leprosy at the altar, and lives out his days in a house apart.
when: 'The fifty-two years of Uzziah in Jerusalem, from the age of sixteen (verse 3); Isaiah saw the Lord “in the year that king Uzziah died” ([[Isa. 6:1]])'

setting: |
  Uzziah follows his father Amaziah, whom conspirators killed at Lachish after he turned from the LORD ([[2 Chr. 25:27]]); then “all the people of Judah” made the sixteen-year-old king ([[2 Kgs. 14:21]]). Kings calls him Azariah and gives his long reign seven verses: he did right, the high places remained, the LORD struck him with leprosy, and his son Jotham governed for him ([[2 Kgs. 15:1–7]]). The two names look alike in Hebrew consonants and mean nearly the same thing, “Jah is my strength” and “Jah hath given help.” Uzziah may have been a throne name taken when he became king, or the difference may have come about as the text was copied; the note at [[2 Kgs. 14:21]] treats them.

  Most of this chapter is found only in Chronicles: the teacher under whom Uzziah sought God, his wars against the Philistines and Arabians, his towers, cisterns and herds, his army and its weapons (verses 5–15), and the reason the LORD struck him (verses 16–20). Kings says nothing of his power, but the prophecies Isaiah gave in his and Jotham's days portray the might and greatness of Judah. Isaiah, Hosea and Amos all prophesied in Uzziah's reign ([[Isa. 1:1]]; [[Hos. 1:1]]; [[Amos 1:1]]), and Isaiah's vision of the Lord on His throne came in the year he died.

  The Church reads the chapter as a warning about pride. *Come, Follow Me* heads it “Pride leads to destruction,” and *Scripture Helps* explains why the king had no right to burn incense.

thread: |
  The chapter turns on one word repeated, “strong.” As long as Uzziah sought the LORD, God made him prosper (verse 5); God helped him against the Philistines and the Arabians (verse 7), and he was “marvellously helped, till he was strong” (verse 15). The next verse begins “But when he was strong,” the same turn Chronicles marked in Rehoboam, who forsook the law once he “had strengthened himself” ([[2 Chr. 12:1]]). The strength had been help received; in his pride Uzziah went into the holy place to do the priests' work.

  Chronicles tells the consequence at once and in the place of the sin, as it usually does: the leprosy breaks out on his forehead beside the altar of incense. The king who forced his way into the LORD's house is “cut off from the house of the LORD” (verse 21), lives apart until he dies, and is buried in the field that belonged to the kings, “for they said, He is a leper” (verse 23). A reign of seeking and success ends in a house apart, and the book's measure stands: “if ye forsake him, he will forsake you” ([[2 Chr. 15:2]]).

sections:
  - range: 1-5
    heading: A king who sought God
    plain: |
      All the people of Judah took Uzziah, who was sixteen, and made him king in place of his father Amaziah. After his father's death he rebuilt Eloth and restored it to Judah. Uzziah was sixteen when he became king, and he reigned fifty-two years in Jerusalem; his mother was Jecoliah of Jerusalem. He did what was right in the LORD's sight, as his father Amaziah had done. He set himself to seek God in the days of Zechariah, who had understanding in the visions of God (the ancient translations read “who taught him the fear of God”), and as long as he sought the LORD, God gave him success.
  - range: 6-15
    heading: Wars, towers and an army
    plain: |
      He went to war against the Philistines and broke down the walls of Gath, Jabneh and Ashdod, and built towns in the territory of Ashdod and elsewhere among the Philistines. God helped him against the Philistines, against the Arabians who lived in Gur-baal, and against the Meunites. The Ammonites paid him tribute, and his fame spread as far as the border of Egypt, for he became very strong. In Jerusalem he built towers at the Corner Gate, at the Valley Gate and at the angle of the wall, and fortified them. He built towers in the wilderness and cut many cisterns, for he had large herds in the lowland and on the plateau; and he had farmers and vinedressers in the hills and the fertile fields, for he loved the soil. Uzziah had an army ready for war, which went out in divisions according to the muster taken by Jeiel the scribe and Maaseiah the officer, under Hananiah, one of the king's commanders. The heads of families, mighty warriors, numbered 2,600, and under them was a trained army of 307,500 who fought with great power to help the king against his enemies. Uzziah supplied the whole army with shields, spears, helmets, coats of mail, bows and sling-stones. In Jerusalem he made machines designed by skilled men, set on the towers and the corners of the walls, to shoot arrows and hurl large stones. His fame spread far, for he was wonderfully helped until he became strong.
  - range: 16-21
    heading: Incense, and leprosy
    plain: |
      But when he had become strong, his heart grew proud and he acted corruptly. He was unfaithful to the LORD his God: he went into the temple of the LORD to burn incense on the altar of incense. Azariah the priest went in after him with eighty priests of the LORD, brave men. They stood up to King Uzziah and said, “It is not your place, Uzziah, to burn incense to the LORD. That belongs to the priests, the descendants of Aaron, who are consecrated to burn incense. Leave the sanctuary, for you have been unfaithful, and it will bring you no honor from the LORD God.” Uzziah, with a censer in his hand ready to burn incense, grew angry. While he raged at the priests, leprosy broke out on his forehead in front of them in the LORD's house, beside the altar of incense. When Azariah the chief priest and all the priests looked at him and saw that he was leprous on his forehead, they hurried him out; and he himself hastened to leave, because the LORD had struck him. King Uzziah was a leper until the day he died. He lived in a separate house, a leper, shut out from the LORD's house, while his son Jotham was in charge of the palace and governed the people of the land.
  - range: 22-23
    heading: Uzziah's death
    plain: |
      The rest of Uzziah's acts, from first to last, the prophet Isaiah son of Amoz wrote down. Uzziah died and was buried with his fathers, in the burial field that belonged to the kings, because they said, “He is a leper.” His son Jotham became king after him.

notes:
  - ref: 5
    phrase: who had understanding in the visions of God
    kind: words
    title: Zechariah, a teacher in the fear of God
    body: |
      The Zechariah under whom Uzziah sought God is otherwise unknown, and the verse may describe him as a teacher rather than a seer. The King James “in the visions of God” follows the Hebrew as written, *birʾot haʾelohim*, “in the seeing of God.” The Septuagint, the Targum and the Syriac read a slightly different word, *beyirʾat*, “in the fear of God”: “Zacharias, who understood the fear of the Lord.” Older commentaries correct the written Hebrew to “fear,” and the participle translated “had understanding” is used elsewhere of one who instructs, as of the “teacher” among the temple singers ([[1 Chr. 25:8]]). On that reading Zechariah taught the young king the fear of God; on the King James reading he was a man of visions. Either way the verse ties Uzziah's faithfulness to a man who guided him.

      The verse also sets the condition for everything that follows: “as long as he sought the LORD, God made him to prosper.” Seeking is the book's measure of a king, from the LORD's answer to Solomon, “seek my face” ([[2 Chr. 7:14]]), to Azariah's word to Asa, “if ye seek him, he will be found of you” ([[2 Chr. 15:2]]).
    sources: [oshb-wlc, lxx-rahlfs, keil-chronicles, cambridge-chronicles, lds-scriptures]

  - ref: 15
    phrase: engines, invented by cunning men
    kind: words
    title: Engines on the towers
    body: |
      The “engines” were machines for throwing missiles from Jerusalem's walls. The Hebrew piles up three words from one verb meaning to think or devise: *ḥishshebonot maḥashebet ḥoshev*, “contrivances … the invention of inventive men,” things thought out by skilled men. The verse itself says what they did: they stood “on the towers and upon the bulwarks” “to shoot arrows and great stones.”

      They crown Uzziah's work on Jerusalem's defenses, which began with towers at the corner gate, the valley gate and the turning of the wall (verse 9). The list of his achievements ends here, with his name spreading far “for he was marvellously helped,” and the next verse turns.
    sources: [oshb-wlc, bdb]

  - ref: 16
    phrase: his heart was lifted up to his destruction
    kind: words
    title: Helped, till he was strong
    body: |
      The verse names Uzziah's sin as pride that came with strength. Verse 15 ends “till he was strong,” and verse 16 picks the word up: “But when he was strong.” The same Hebrew phrase, “and when he was strong,” introduces Rehoboam's fall, “when Rehoboam had established the kingdom, and had strengthened himself, he forsook the law of the LORD” ([[2 Chr. 12:1]]). “To his destruction” renders a verb that, used this way, means to deal corruptly, the word used of the people under Jotham, who “did yet corruptly” ([[2 Chr. 27:2]]). “He transgressed” and the priests' “thou hast trespassed” (verse 18) are one Hebrew verb, a priestly word meaning to act unfaithfully or treacherously.

      So Chronicles does not set Uzziah's pride and his entry into the temple side by side as two faults; the second is how the first showed itself. *Scripture Helps* reads it the same way: his successes led to a proud heart and to his overstepping his authority.
    sources: [oshb-wlc, bdb, scripture-helps-2-chronicles, lds-scriptures]

  - ref: 18
    phrase: It appertaineth not unto thee, Uzziah, to burn incense unto the LORD
    kind: history
    title: Why the king could not burn incense
    body: |
      The priests stopped Uzziah because the law gave the burning of incense to Aaron's descendants alone. Aaron was to burn sweet incense on the golden altar morning and evening ([[Ex. 30:7–8]]). After Korah's company died offering incense, their censers were hammered into a covering for the altar, “that no stranger, which is not of the seed of Aaron, come near to offer incense before the LORD” ([[Num. 16:40]]), and the priests were told that “the stranger that cometh nigh shall be put to death” ([[Num. 18:7]]). Abijah had boasted of exactly this to the northern army: in Judah “the priests, which minister unto the LORD, are the sons of Aaron,” and they burn “sweet incense” every morning and evening ([[2 Chr. 13:10–11]]). *Scripture Helps* puts the rule in Latter-day Saint terms: the incense at the veil was reserved for priests of the Aaronic Priesthood.

      Why a successful king would want to do it, the text answers only with his pride (verse 16). What it dwells on is the priests' courage: Azariah the chief priest, who bore the king's other name, went in after him with eighty “valiant men,” told the king to his face to leave the sanctuary, and warned him that it would not be “for thine honour.”

      The note at [[2 Kgs. 15:5]] draws from this account the Latter-day Saint teaching that acting in the ordinances requires authority given by God.
    sources: [lds-scriptures, scripture-helps-2-chronicles]

  - ref: 19
    phrase: the leprosy even rose up in his forehead
    kind: history
    title: Struck at the altar
    body: |
      Chronicles says plainly that the leprosy was the LORD's doing: Uzziah hurried out “because the LORD had smitten him” (verse 20). It came while he stood raging at the priests with the censer in his hand, on his forehead, in front of them, beside the altar he had come to serve. What scripture calls leprosy, and why it sometimes came as a sign or a punishment, is explained at [[Lev. 13:2]].

      The swiftness is typical of Chronicles, which usually shows rewards and punishments coming at once rather than after a delay. Kings records only the result, that the LORD struck the king ([[2 Kgs. 15:5]]).
    sources: [lds-scriptures, sc-knowhy-861]

  - ref: 21
    phrase: dwelt in a several house, being a leper; for he was cut off from the house of the LORD
    kind: words
    title: A house apart
    body: |
      “Several” here means separate. The Hebrew, *bet haḥofshit* as the text is read aloud (the written form differs slightly), is probably a house of separateness, a house apart on account of his disease. The law required it: the leper “shall dwell alone; without the camp shall his habitation be” ([[Lev. 13:46]]). Chronicles adds a reason of its own: “he was cut off from the house of the LORD.” Meanwhile his son Jotham governed for him.

      The exclusion followed him to his grave. Kings says he was buried “with his fathers in the city of David” ([[2 Kgs. 15:7]]); Chronicles specifies “in the field of the burial which belonged to the kings; for they said, He is a leper” (verse 23). One older commentary takes this to mean he was buried near the royal tombs but not in them, so that his body would not defile them. The king who had pressed into the holy place ended shut out of it, alive and dead.
    sources: [bdb, lds-scriptures, keil-chronicles, cambridge-chronicles]

  - ref: 22
    phrase: did Isaiah the prophet, the son of Amoz, write
    kind: scripture
    title: Isaiah's record of Uzziah
    body: |
      Chronicles names Isaiah as the historian of Uzziah's reign, a statement Kings does not make; Kings sends the reader instead to “the book of the chronicles of the kings of Judah” ([[2 Kgs. 15:6]]). The record is not in the Bible as a separate book; “the rest of the acts of Uzziah written by Isaiah” is counted among writings that may or may not be contained in the present text under another title, and the book of Isaiah does begin in Uzziah's days ([[Isa. 1:1]]).

      Isaiah's call is dated by this king: “In the year that king Uzziah died I saw also the Lord sitting upon a throne, high and lifted up” ([[Isa. 6:1]]). The note there sets the proud king, shut out of the temple, beside the King whom Isaiah saw enthroned in it.
    sources: [bd-lost-books, lds-scriptures]

christ: |
  The God who helped Uzziah until he was strong was Jehovah, the premortal Jesus Christ. One Latter-day Saint reading sets the LORD's stroke against the proud king beside the gentleness with which He pardoned Hezekiah's unprepared people at the Passover ([[2 Chr. 30:18–20]]): God distinguishes “the pride that bends rules for self-aggrandizement” from “the humility that bends them in service of genuine return.” In that reading the stroke on Uzziah was little different from the rebukes Jesus would give the dignitaries of Jerusalem.

  The Book of Mormon names the same danger Uzziah met: “at the very time when he doth prosper his people … then is the time that they do harden their hearts, and do forget the Lord their God” ([[Hel. 12:2]]). A disciple's strength, gifts and success are help received from Christ, and the moment they seem a person's own is the moment Helaman names as the danger.

explore: |
  - **Uzziah in Kings.** [[2 Kgs. 14:21–22]] and [[2 Kgs. 15:1–7]], the same reign under the name Azariah.
  - **The same turn in another king.** Rehoboam, [[2 Chr. 12:1–14]], who forsook the law when he was strong and humbled himself when Shishak came.
  - **The incense and the censers.** [[Num. 16]], Korah's company and the memorial on the altar.
  - **The year Uzziah died.** [[Isa. 6]], Isaiah's vision in the temple.
  - **“On Bended Rules”** (*Old Testament Reflections*, Maxwell Institute, 2026), a reflection on Uzziah and Hezekiah's Passover side by side.

