chapter: 22
title: The House of Ahaziah Had No Power to Keep Still the Kingdom
tagline: Ahaziah reigns one year on his mother's counsel, goes to war beside Ahab's son and dies in Jehu's purge; Athaliah destroys the royal seed, and one infant is hidden in the house of God.
when: "The one year of Ahaziah's reign over Judah, and the six years after it in which Athaliah reigned (verses 2, 12)"

setting: |
  Jehoram king of Judah has died of his disease and “departed without being desired” ([[2 Chr. 21:19–20]]). He had married into the house of Ahab, and the LORD had spared David's house through his reign “because of the covenant that he had made with David” ([[2 Chr. 21:7]]). Chapter 22 tells what came of that marriage in the next generation: Ahab's daughter Athaliah, Jehoram's widow, outlives her son and takes the throne.

  The story is told also in Kings, at [[2 Kgs. 8:24–29]], [[2 Kgs. 9:27–28]] and [[2 Kgs. 11:1–3]], and the site's notes there explain Ahaziah's age ([[2 Kgs. 8:26]]), the two kings at Jezreel ([[2 Kgs. 8:29]]), why the king of Judah died in Jehu's purge of Ahab's house ([[2 Kgs. 9:27]]), and Athaliah and the child's rescue ([[2 Kgs. 11:1]], [[2 Kgs. 11:2]]); they are not repeated here. Kings tells Jehu's revolt at length. Chronicles tells only the part of it that fell on Judah. What it adds is its own reading of the events. It says how Ahaziah came to the throne, whose counsel he followed, that his destruction was “of God,” why he was buried, and that the princess who saved the last heir was the priest's wife. The story of the hidden child runs on into the next chapter ([[2 Chr. 23]]).

thread: |
  The chapter runs from bad counsel to a single hidden child. Ahaziah's mother “was his counsellor to do wickedly” (verse 3), and her family were his counsellors “to his destruction” (verse 4). He “walked also after their counsel” into the war beside Ahab's son (verse 5), and so he was at Jezreel when Jehu came to cut off the house of Ahab. Chronicles says that “the destruction of Ahaziah was of God by coming to Joram” (verse 7). He was buried only for his grandfather's sake, and “the house of Ahaziah had no power to keep still the kingdom” (verse 9).

  Then the king's mother finishes what the raiders and Jehu began. She destroys “all the seed royal of the house of Judah” (verse 10) and reigns. The LORD had said He “would not destroy the house of David” ([[2 Chr. 21:7]]), and at the chapter's end that promise rests on one infant. A king's daughter steals him from among the slain. She is the wife of Jehoiada the priest, and the boy lies hidden “in the house of God six years” (verses 11–12) while Ahab's daughter rules Judah.

sections:
  - range: 1-6
    heading: Ahaziah reigns on his mother's counsel
    plain: |
      The people of Jerusalem made Ahaziah, Jehoram's youngest son, king in his place, because the raiding band that came into the camp with the Arabians had killed all the older sons. So Ahaziah son of Jehoram reigned as king of Judah. He was forty-two years old when he became king (Kings gives twenty-two), and he reigned one year in Jerusalem. His mother was Athaliah, a granddaughter of Omri. He too followed the ways of Ahab's house, for his mother counseled him to do wickedly. He did evil in the LORD's sight, as the house of Ahab did, because after his father's death they were his advisers, to his ruin. He followed their advice and went with Jehoram son of Ahab, king of Israel, to fight Hazael king of Syria at Ramoth-gilead, and the Syrians wounded Joram. Joram went back to Jezreel to recover from the wounds he had received at Ramah fighting Hazael king of Syria, and Azariah son of Jehoram king of Judah went down to Jezreel to see Jehoram son of Ahab, because he was sick.
  - range: 7-9
    heading: Ahaziah dies in Jehu's purge
    plain: |
      God brought about Ahaziah's downfall through his visit to Joram. When he arrived, he went out with Jehoram to meet Jehu son of Nimshi, whom the LORD had anointed to cut off the house of Ahab. While Jehu was executing judgment on Ahab's house, he found the princes of Judah and the sons of Ahaziah's brothers, who were attending Ahaziah, and he killed them. He searched for Ahaziah, and they caught him hiding in Samaria, brought him to Jehu and put him to death. They buried him, for they said, “He is the grandson of Jehoshaphat, who sought the LORD with all his heart.” So no one was left in Ahaziah's house strong enough to hold the kingdom.
  - range: 10-12
    heading: Athaliah reigns, and a child is hidden
    plain: |
      When Athaliah, Ahaziah's mother, saw that her son was dead, she set out to destroy the whole royal family of the house of Judah. But Jehoshabeath, the king's daughter, took Joash son of Ahaziah and stole him away from among the king's sons who were being killed, and she put him and his nurse in a bedroom. So Jehoshabeath, daughter of King Jehoram and wife of Jehoiada the priest (she was Ahaziah's sister), hid him from Athaliah, and Athaliah did not kill him. He stayed hidden with them in the house of God for six years, while Athaliah ruled the land.

notes:
  - ref: 1
    phrase: the inhabitants of Jerusalem made Ahaziah his youngest son king in his stead
    kind: history
    title: The youngest son, made king by Jerusalem
    body: |
      Chronicles explains how a youngest son came to reign, where Kings says only that “Ahaziah his son reigned in his stead” ([[2 Kgs. 8:24]]). His elder brothers were dead. In Jehoram's last years Philistines and Arabians broke into Judah and carried off the king's sons, “so that there was never a son left him, save Jehoahaz, the youngest of his sons” ([[2 Chr. 21:16–17]]). Then “the inhabitants of Jerusalem made” him king. On one older reading, Chronicles says simply that a son reigned in his father's stead when he followed him without opposition, so this unusual wording marks an unusual succession, possibly an opposed one. On another, the only person left who could have contested the throne was his mother Athaliah, who took it when he died (verse 10).

      The Jehoahaz of [[2 Chr. 21:17]] is this same king, and so is the “Azariah the son of Jehoram” of verse 6. All three are names of the one king of Judah. The Hebrew of verse 6 does read *ʿAzaryāhû*, Azariah, but the Greek Septuagint has Ochozias, its spelling of Ahaziah, there as everywhere else in the chapter.
    sources: [lds-scriptures, cambridge-chronicles, keil-chronicles, bd-ahaziah, oshb-wlc, lxx-rahlfs]

  - ref: 2
    phrase: Forty and two years old was Ahaziah
    kind: scripture
    title: Forty-two or twenty-two
    body: |
      Twenty-two is the age the text can bear, and Joseph Smith's revision of the Bible gives it. The King James “forty and two” cannot stand beside Chronicles' own figures for his father, who began to reign at thirty-two and reigned eight years ([[2 Chr. 21:5]], 20), so he died at forty; the note at [[2 Kgs. 8:26]] gives the arithmetic. The Joseph Smith Translation reads “Two and twenty,” which makes the verse conform to the parallel account in Kings, and it is one of the changes Joseph Smith made “in an effort to correct contradictions in the biblical text.” The Greek Septuagint also gives a smaller figure than the Hebrew of Chronicles: in English translation it reads “twenty years old.”
    sources: [nyman-jst-historical, sc-knowhy-786, lxx-rahlfs, lds-scriptures]

  - ref: 3
    phrase: his mother was his counsellor to do wickedly
    kind: history
    title: Counsellors to his destruction
    body: |
      Chronicles names the people who led Ahaziah wrong, where Kings gives only a family tie. Kings says he walked in the way of Ahab's house “for he was the son in law of the house of Ahab” ([[2 Kgs. 8:27]]). Chronicles says his mother was his counsellor “to do wickedly,” and that the house of Ahab were his counsellors after his father's death “to his destruction” (verse 4). Verse 5 then shows where their counsel took him: “He walked also after their counsel, and went with Jehoram the son of Ahab … to war.” That war is what brought him to Jezreel when Jehu came (verses 6–7).

      His mother was Athaliah, daughter of Ahab and Jezebel, who brought the worship of Baal into Judah as her mother had brought it into Israel. Kings and Chronicles consistently give the names of the kings' mothers, and here Chronicles says what the mother counselled. Had she been “his counselor to do good,” his history might have been different; mothers “influence not just children but nations.”
    sources: [lds-scriptures, bd-athaliah, hilton-motherhood-ot]

  - ref: 7
    phrase: the destruction of Ahaziah was of God by coming to Joram
    kind: history
    title: A destruction that was of God
    body: |
      Chronicles reads Ahaziah's death as the LORD's doing. In Kings he is struck down as he flees ([[2 Kgs. 9:27]]); here his destruction is “of God,” and it comes “by coming to Joram”: he was with Ahab's son when Jehu, anointed “to cut off the house of Ahab,” came against them. Why the LORD sent Jehu against Ahab's house is explained at [[2 Kgs. 9:7]], and the note at [[2 Kgs. 9:27]] sets the two accounts of the death side by side.

      This is how Chronicles commonly tells its history. Kings and Chronicles broadly agree that righteousness is blessed and wickedness punished, but in Chronicles “rewards and punishments are not usually delayed”; people are often punished or rewarded at once. Ahaziah reigned one year, and the counsel that verse 4 calls “to his destruction” took him to Jezreel within it (verses 3–6). Kings tells the same events without that comment, and the two views stand together: “Sometimes people are punished for iniquity or blessed for righteousness immediately, but sometimes they are not.”
    sources: [lds-scriptures, sc-knowhy-861]

  - ref: 8
    phrase: the sons of the brethren of Ahaziah
    kind: history
    title: Ahaziah's nephews
    body: |
      Jehu's victims here are Ahaziah's nephews, not his brothers, because his brothers were already dead. Kings, in its account of Jehu's purge, has him slay “the brethren of Ahaziah king of Judah,” forty-two men taken on the road and slain “at the pit of the shearing house” ([[2 Kgs. 10:13–14]]). There “brethren” means kinsmen. Ahaziah's brothers in the strict sense had been carried off and killed before he became king (verse 1; [[2 Chr. 21:17]]), and Chronicles names those slain here as “the sons of the brethren of Ahaziah” and the princes of Judah who were attending him.
    sources: [lds-scriptures, cambridge-chronicles]

  - ref: 9
    phrase: he is the son of Jehoshaphat, who sought the LORD with all his heart
    kind: history
    title: Buried for his grandfather's sake
    body: |
      Ahaziah was given burial for his grandfather's sake; the reason his slayers give is Jehoshaphat's seeking, not anything Ahaziah had done. “Son” here means grandson. Chronicles had told of Jehoshaphat that he “sought to the LORD God of his father, and walked in his commandments” ([[2 Chr. 17:4]]), and Jehu the son of Hanani, even while rebuking him, had said that he had “prepared thine heart to seek God” ([[2 Chr. 19:3]]).

      Kings says that his servants carried him to Jerusalem and buried him with his fathers in the city of David ([[2 Kgs. 9:28]]). Chronicles leaves out the place and gives the reason.
    sources: [lds-scriptures]

  - ref: 11
    phrase: the wife of Jehoiada the priest
    kind: history
    title: The priest's household hides the heir
    body: |
      Chronicles adds that the princess who saved Joash was the wife of Jehoiada the priest, and has the boy hidden with them in the house of God. Kings calls her Jehosheba and says she hid the child “in the house of the LORD” ([[2 Kgs. 11:2–3]]). It does not say whom she had married, and it has the boy hidden “with her”; Chronicles says “with them” (verse 12). Jehoiada was the high priest who later overthrew Athaliah and set Joash on the throne, and for that he was buried among the kings ([[2 Chr. 24:16]]). The note at [[2 Kgs. 11:2]] tells the rescue, and the next chapter tells what the priest did in the seventh year ([[2 Chr. 23:1–11]]).
    sources: [lds-scriptures, bd-jehoiada]

christ: |
  At the end of this chapter David's line has come down to one hidden child, and on one Latter-day Saint reading that child, “in the line of David and the ancestry of Christ,” was saved from death, which preserved the royal line. The LORD had bound Himself not to destroy the house of David “because of the covenant that he had made with David” ([[2 Chr. 21:7]]), and a queen's purge did not undo it (the `christ` of [[2 Kgs. 11]] follows the boy to his crowning). The Lord's covenants with His people now rest on the same faithfulness: “The works, and the designs, and the purposes of God cannot be frustrated, neither can they come to naught” ([[D&C 3:1]]).

