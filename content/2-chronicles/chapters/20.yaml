chapter: 20
title: The Battle Is Not Yours, but God’s
tagline: Moab, Ammon and Mount Seir come against Judah; the king and people fast and pray at the temple, a Levite prophesies, singers go out before the army, and the invaders destroy one another.
when: 'In the reign of Jehoshaphat king of Judah, “after this” (verse 1): after he had set judges and Levites over the land ([[2 Chr. 19:4–11]]); verses 31–37 sum up his reign of twenty-five years'

setting: |
  Chapters 17–20 of 2 Chronicles belong to Jehoshaphat, and Chronicles gives him far more than Kings does. Chronicles has already told his alliance with Ahab at Ramoth-gilead (chapter 18) and the rebuke that followed: “Shouldest thou help the ungodly, and love them that hate the LORD?” ([[2 Chr. 19:2]]). Chapter 19 ended with judges and Levites set over Judah and told to “deal courageously” ([[2 Chr. 19:11]]). This chapter opens “after this” with an invasion from across the Dead Sea.

  Everything from the invasion to Judah's return with harps and trumpets, verses 1–30, has no parallel in Kings. Verses 31–34 are Kings' summary of the reign ([[1 Kgs. 22:41–45]]), with differences of wording, and Chronicles leaves out that Jehoshaphat made peace with the king of Israel. Verses 35–37 tell the lost ships of [[1 Kgs. 22:48–49]] quite differently.

  The Church reads the chapter as a lesson in trust. *Scripture Helps* sums up Jehoshaphat's reign with the line that when other nations attacked Judah, the Lord fought their battles. *Come, Follow Me* takes its title, “Our Eyes Are upon Thee,” from verse 12. President Gordon B. Hinckley made verse 20 the text of a general conference sermon in 1992.

thread: |
  The chapter turns on what Jehoshaphat did with his fear. He “feared, and set himself to seek the LORD” (verse 3), and proclaimed a fast, and the people came from every city “to seek the LORD” (verse 4): the seeking the LORD had asked for in His answer to Solomon, “seek my face” ([[2 Chr. 7:14]]; the note there). In the temple court he asked the LORD to honor what Solomon had prayed for at the dedication (verses 8–9), and he ended by confessing that Judah has neither strength nor a plan: “our eyes are upon thee.”

  The answer comes through a prophet standing in the congregation, and it asks Judah to trust rather than to fight: “the battle is not yours, but God's” (verse 15). The next morning the king asks the people to believe the LORD and His prophets (verse 20). Singers go out ahead of the army, and when they begin to sing the invaders turn on one another. Judah's part is to believe, to praise, to gather the spoil, and to bless the LORD in a valley that keeps the name (verse 26).

  The last verses add two qualifications to the victory. The high places stayed, because the people had not yet prepared their hearts (verse 33). And the king who had been rebuked for helping Ahab joined himself to Ahab's son and lost his ships (verses 35–37).

sections:
  - range: 1-4
    heading: An army at En-gedi
    plain: |
      Some time later the Moabites and the Ammonites, and with them some of the Meunites, came to make war on Jehoshaphat. Messengers came and told him, “A great army is coming against you from beyond the Dead Sea, from Syria. They are already at Hazazon-tamar,” that is, En-gedi. Jehoshaphat was afraid. He set himself to seek the LORD, and he proclaimed a fast throughout Judah. The people of Judah gathered to ask the LORD for help; they came from every city of Judah to seek Him.
  - range: 5-13
    heading: Jehoshaphat's prayer
    plain: |
      Jehoshaphat stood up before the assembly of Judah and Jerusalem in the LORD's house, in front of the new court, and prayed: “LORD, God of our fathers, are You not God in heaven? Do You not rule over all the kingdoms of the nations? Power and might are in Your hand, and no one can stand against You. Are You not our God, who drove out the people of this land before Your people Israel and gave it for ever to the descendants of Abraham Your friend? They have lived in it and built You a sanctuary in it for Your name, saying, ‘If disaster comes on us, sword, judgment, plague or famine, we will stand before this house and before You, for Your name is in this house, and cry to You in our distress, and You will hear and save us.’ Now here are the people of Ammon, Moab and Mount Seir. When Israel came out of Egypt You would not let them invade these peoples; Israel turned away from them and did not destroy them. See how they repay us: they are coming to drive us out of the land You gave us to inherit. Our God, will You not judge them? We have no strength against this great army that is coming against us. We do not know what to do, but our eyes are on You.” All Judah stood before the LORD, with their little ones, their wives and their children.
  - range: 14-19
    heading: Jahaziel's word
    plain: |
      Then, in the middle of the assembly, the Spirit of the LORD came on Jahaziel son of Zechariah, son of Benaiah, son of Jeiel, son of Mattaniah, a Levite of the sons of Asaph. He said, “Listen, all Judah and people of Jerusalem, and King Jehoshaphat. This is what the LORD says to you: Do not be afraid or dismayed because of this great army, for the battle is not yours but God's. Tomorrow go down against them. They will be coming up by the ascent of Ziz, and you will find them at the end of the valley, in front of the wilderness of Jeruel. You will not need to fight in this battle. Take your places, stand still, and see the deliverance the LORD will give you, Judah and Jerusalem. Do not be afraid or dismayed. Go out against them tomorrow, for the LORD is with you.” Jehoshaphat bowed with his face to the ground, and all Judah and the people of Jerusalem fell down before the LORD in worship. And Levites of the Kohathites and the Korahites stood up to praise the LORD God of Israel with a very loud voice.
  - range: 20-30
    heading: The battle of praise
    plain: |
      Early in the morning they went out into the wilderness of Tekoa. As they set out, Jehoshaphat stood and said, “Listen to me, Judah and people of Jerusalem! Believe in the LORD your God, and you will be made firm; believe His prophets, and you will succeed.” After consulting the people he appointed singers to sing to the LORD and to praise Him in holy splendor as they went out ahead of the army, saying, “Give thanks to the LORD, for His mercy endures for ever.” As soon as they began to sing and praise, the LORD set men lying in wait against the people of Ammon, Moab and Mount Seir who had come against Judah, and they were struck down. The Ammonites and Moabites turned on the people of Mount Seir to destroy them completely, and when they had finished with them, they helped to destroy one another. When Judah reached the lookout over the wilderness and looked toward the army, they saw only dead bodies lying on the ground; no one had escaped. Jehoshaphat and his people came to take the plunder and found among the bodies a great quantity of goods and precious things, more than they could carry. There was so much that it took them three days to gather it. On the fourth day they assembled in the Valley of Berachah, that is, of Blessing, because there they blessed the LORD; that is why the place is still called the Valley of Berachah. Then all the men of Judah and Jerusalem, with Jehoshaphat at their head, went back to Jerusalem rejoicing, for the LORD had given them joy over their enemies. They came into Jerusalem, to the LORD's house, with harps, lyres and trumpets. The fear of God came on all the kingdoms of those lands when they heard that the LORD had fought against Israel's enemies. So Jehoshaphat's kingdom was at peace, for his God gave him rest on every side.
  - range: 31-34
    heading: Jehoshaphat's reign
    plain: |
      Jehoshaphat reigned over Judah. He was thirty-five when he became king, and he reigned twenty-five years in Jerusalem. His mother was Azubah daughter of Shilhi. He followed the ways of his father Asa and did not turn from them, doing what was right in the LORD's sight. But the high places were not removed, and the people had not yet set their hearts on the God of their fathers. The rest of Jehoshaphat's acts, from first to last, are written in the history of Jehu son of Hanani, which was taken into the book of the kings of Israel.
  - range: 35-37
    heading: The ships at Ezion-geber
    plain: |
      Later Jehoshaphat king of Judah allied himself with Ahaziah king of Israel, who acted very wickedly. He joined with him to build ships to go to Tarshish, and they built the ships at Ezion-geber. Then Eliezer son of Dodavah of Mareshah prophesied against Jehoshaphat: “Because you have allied yourself with Ahaziah, the LORD will break up what you have made.” And the ships were wrecked and could not sail to Tarshish.

notes:
  - ref: 1
    phrase: and with them other beside the Ammonites
    kind: words
    title: Ammon’s allies, and where they came from
    body: |
      The third people in the alliance is hard to name, because the Hebrew of verse 1 says that with Moab and Ammon came some of the Ammonites, a people already named. The King James “other beside the Ammonites” smooths the repetition. The Septuagint reads “some of the Minaeans,” and older commentators read the Hebrew, with a small change, as *Meunim*, the Meunites. One places their center at Maan near Petra, on Mount Seir; another makes them an Arabian people and finds them again at [[1 Chr. 4:41]] and [[2 Chr. 26:7]]. The correction fits the rest of the chapter, which names the third member of the alliance as “mount Seir” (verses 10, 22–23), the country of the Edomites. It is a probable reading, not a certain one.

      Verse 2 has a similar puzzle. The army comes “from beyond the sea,” the Dead Sea, and the Hebrew adds “from Aram,” that is, Syria, which the Septuagint also reads. But nothing in the story brings an enemy from Syria, and two older commentaries judge the text corrupt at this point and read “from Edom” instead. Either way the danger was close. Hazazon-tamar “is En-gedi,” on the western shore of the Dead Sea, where a rugged pass climbs into the hill country of Judah.
    sources: [oshb-wlc, lxx-rahlfs, keil-chronicles, cambridge-chronicles]

  - ref: 5
    phrase: before the new court
    kind: history
    title: The new court
    body: |
      Jehoshaphat stood to pray in the temple's courts with the people facing him, but which court Chronicles means by “the new court” is not certain. One older reading takes it as the great outer court Solomon built ([[2 Chr. 4:9]]), called new probably because Asa or Jehoshaphat had restored or extended it. On that reading the king stood at the entrance to the priests' court, with the congregation opposite him. Another commentary notes that the Hebrew word for “court” here is not the one Chronicles uses for the “great court” or for the court where Solomon offered his dedicatory prayer ([[2 Chr. 6:13]]), and finds it hard to tell which court the writer had in mind. Whichever it was, king and people stood in the house where Solomon had asked the LORD to hear, and Jehoshaphat's prayer goes on to ask exactly that (verses 8–9).
    sources: [keil-chronicles, cambridge-chronicles]

  - ref: 12
    phrase: 'but our eyes are upon thee'
    kind: scripture
    title: A prayer that holds the LORD to His word
    body: |
      Jehoshaphat's prayer asks the LORD to keep promises He had already made, and then confesses that Judah has nothing else to rely on. It begins with who the LORD is, the God who rules all kingdoms and whom no one can withstand (verse 6), and with what He has done. He gave the land to “the seed of Abraham thy friend for ever” (verse 7), using the name the LORD Himself gives Abraham: “the seed of Abraham my friend” ([[Isa. 41:8]]). Then it recalls Solomon's dedicatory prayer. Solomon had asked that when Israel went out to war and prayed toward the house, the LORD would “hear thou from the heavens their prayer and their supplication, and maintain their cause” ([[2 Chr. 6:35]]), and the LORD had answered, “mine ears attent unto the prayer that is made in this place” ([[2 Chr. 7:15]]). Now, with an army at En-gedi, Jehoshaphat asks the LORD to honor the blessings Solomon had prayed for, among them protection from enemies.

      The second ground is what these neighbors were doing. Moab, Ammon and Mount Seir were peoples Israel had been forbidden to touch on the way from Egypt, because the LORD had given their lands to Esau and to Lot: “I will not give you of their land, no, not so much as a foot breadth” ([[Deut. 2:5]]; [[Deut. 2:9]]; [[Deut. 2:19]]). Israel had spared them, and now they came to drive Israel out (verses 10–11).

      The last line is the turn of the prayer: “we have no might against this great company that cometh against us; neither know we what to do: but our eyes are upon thee.” Judah had no strength and no plan of its own, and the LORD answered with a miraculous deliverance.
    sources: [lds-scriptures, scripture-helps-2-chronicles]

  - ref: 14
    phrase: a Levite of the sons of Asaph, came the Spirit of the LORD in the midst of the congregation
    kind: history
    title: A singer who prophesied
    body: |
      The LORD's answer came through a Levite of the temple's singers, and his long genealogy places him in the family David had set apart for music. He is one of “the sons of Asaph,” whom David and his captains appointed with Heman and Jeduthun “who should prophesy with harps, with psalteries, and with cymbals” ([[1 Chr. 25:1]]); the note there explains how their music was itself a kind of prophesying. On this day the Spirit of the LORD came on him “in the midst of the congregation,” while all Judah stood waiting with their wives and children (verse 13). President Hinckley calls him simply “the Levite prophet.”

      What he said shaped what followed. He told Judah it would not need to fight, and the people answered by falling down to worship while other Levites, of the Kohathites and the Korahites, stood up to praise “with a loud voice on high” (verses 18–19). The next morning singers went out ahead of the army (verse 21), and the battle was won without Judah's swords (verses 22–24).
    sources: [lds-scriptures, hinckley-believe-his-prophets-1992]

  - ref: 17
    phrase: set yourselves, stand ye still, and see the salvation of the LORD with you
    kind: scripture
    title: Stand still, and see
    body: |
      Jahaziel's promise uses the words Moses spoke at the Red Sea. With Pharaoh's army behind them, Moses told Israel, “Fear ye not, stand still, and see the salvation of the LORD, which he will shew to you to day” ([[Ex. 14:13]]). Jahaziel tells Judah to take their places, “stand ye still, and see the salvation of the LORD,” and adds that they “shall not need to fight in this battle.” “Salvation” here is deliverance from an enemy (the footnote's alternative rendering), and Judah, like Israel at the sea, was to watch it happen. His “the battle is not yours, but God's” (verse 15) recalls David before Goliath ([[1 Sam. 17:47]]), but David then went out and fought, and Judah was told it need not.
    sources: [lds-scriptures]

  - ref: 20
    phrase: Believe in the LORD your God, so shall ye be established
    kind: words
    title: Believe, and be made firm
    body: |
      “Believe” and “be established” are two forms of one Hebrew verb, *haʾaminu … teʾamenu*, so Jehoshaphat's charge is a play on words: trust the LORD, and you will be made firm. Isaiah later put the same play to King Ahaz as a warning, “If ye will not believe, surely ye shall not be established” ([[Isa. 7:9]]); the note there explains the root. Jehoshaphat speaks it as a promise, on the morning of the battle, to an army that had been told it would not need to fight. Its firmness would come from the LORD it trusted, since it had none of its own (verse 12).
    sources: [oshb-wlc, cambridge-chronicles]

  - ref: 20
    phrase: believe his prophets, so shall ye prosper
    kind: prophets
    title: Believe his prophets
    body: |
      The prophet Jehoshaphat asked Judah to believe was not a distant figure. Jahaziel had spoken the LORD's word in the temple the day before, and the king, in President Gordon B. Hinckley's words, was “relying upon the words of the prophet.” Judah went out singing instead of fighting, and found the promise kept (verses 21–24).

      President Hinckley took this verse as the text of a general conference sermon in April 1992. From it he bore testimony of Joseph Smith as a prophet called to stand as God's instrument in the Restoration, and of the prophets after him whom he had known, and he applied Jehoshaphat's words to the living prophet: “I plead for loyalty to him whom the Lord has called and anointed. I plead for steadfastness in upholding him and giving attention to his teachings.”
    sources: [hinckley-believe-his-prophets-1992]

  - ref: 21
    phrase: that should praise the beauty of holiness, as they went out before the army
    kind: history
    title: Singers before the army
    body: |
      Jehoshaphat put singers at the head of his army, the place where armed men would march, because Judah had been told it would not need to fight but only see what the LORD did (verses 15, 17). Their words were the temple's refrain, “Praise the LORD; for his mercy endureth for ever,” the words the singers sang when the cloud filled Solomon's house ([[2 Chr. 5:13]]; the note there). “The beauty of holiness” is a phrase of public worship, “holy adornment,” explained at [[Ps. 29:2]].

      Verse 22 ties the deliverance to the song: “when they began to sing and to praise, the LORD set ambushments.”
    sources: [lds-scriptures, bdb]

  - ref: 22
    phrase: the LORD set ambushments against the children of Ammon, Moab, and mount Seir
    kind: history
    title: Who lay in ambush?
    body: |
      Chronicles says the LORD set “ambushments,” men lying in wait, but it does not say who they were, and commentators have answered in three ways. Some older commentators took them to be angels. A nineteenth-century commentary doubts it, because scripture describes heavenly help in other terms ([[2 Kgs. 6:17]]; [[2 Kgs. 19:35]]) and would hardly call angels men in ambush. Another commentary takes the LORD to have prompted Jehoshaphat to lay an ambush with part of his army, as He told Joshua to “lay thee an ambush” at Ai ([[Josh. 8:2]]), and notes that the country between En-gedi and Tekoa suits a surprise attack. The first answers that the ambush cannot have been Judah's, since Judah was not to fight (verses 15, 17), and suggests raiders from Seir hungry for plunder, whose sudden attack threw the allied army into confusion. None of these can be proved.

      What the text does say is the result. The Ammonites and Moabites turned on the men of Mount Seir, and when those were destroyed, “every one helped to destroy another” (verse 23); the footnote's alternative for “they were smitten” is that they “smote one another.” It happened as it had to Midian when Gideon's three hundred blew their trumpets: “the LORD set every man's sword against his fellow” ([[Judg. 7:22]]). Judah came to the watchtower and saw only the dead (verse 24).
    sources: [keil-chronicles, cambridge-chronicles, lds-scriptures]

  - ref: 33
    phrase: for as yet the people had not prepared their hearts unto the God of their fathers
    kind: scripture
    title: Hearts not yet prepared
    body: |
      Chronicles explains why the high places remained by pointing to the people's hearts, not to the king's. Kings has its usual formula: “the people offered and burnt incense yet in the high places” ([[1 Kgs. 22:43]]). Chronicles puts in its place a remark about the people: they “had not prepared their hearts unto the God of their fathers.”

      The same words describe the king himself. When Jehu the seer rebuked Jehoshaphat, he granted that he had taken away the groves “and hast prepared thine heart to seek God” ([[2 Chr. 19:3]]). They were said in the negative of Rehoboam, who “did evil, because he prepared not his heart to seek the LORD” ([[2 Chr. 12:14]]). So the verse sets a king whose heart was prepared beside a people whose hearts were not yet ready, and the altars outside Jerusalem stayed.

      How this verse sits beside [[2 Chr. 17:6]], which says Jehoshaphat did take the high places away, is discussed at that verse; what the high places were is explained at [[1 Kgs. 3:2]].
    sources: [lds-scriptures]

  - ref: 34
    phrase: who is mentioned in the book of the kings of Israel
    kind: words
    title: A prophet’s history in the book of the kings
    body: |
      The record Chronicles cites for Jehoshaphat's reign was written by a prophet, Jehu the son of Hanani, the seer who had rebuked him ([[2 Chr. 19:2]]) and who had earlier prophesied against Baasha of Israel ([[1 Kgs. 16:1]]; the note there). “Who is mentioned” is not quite the Hebrew, which says that the record was taken up into the book of the kings, that is, inserted in it. Jehu's account of Jehoshaphat became part of that larger book, and so survived for the Chronicler to cite.

      The book of Jehu is one of the lost books of the Bible, records the Bible treats as authentic and valuable but which it does not contain. It stands in that list beside the other prophets' records Chronicles names for earlier kings, the visions of Iddo and the book of Shemaiah ([[2 Chr. 9:29]]; [[2 Chr. 12:15]]).
    sources: [lds-scriptures, oshb-wlc, bdb, bd-lost-books]

  - ref: 37
    phrase: Because thou hast joined thyself with Ahaziah, the LORD hath broken thy works
    kind: history
    title: The ships, and the second alliance
    body: |
      Eliezer says Jehoshaphat's ships were wrecked because of the partner he built them with. Ahaziah was Ahab's son ([[1 Kgs. 22:49]]), and Jehoshaphat had already been rebuked for helping Ahab: “Shouldest thou help the ungodly, and love them that hate the LORD?” ([[2 Chr. 19:2]]). *Scripture Helps* reads Eliezer's word as the Lord's second rebuke for a second alliance with a wicked king of Israel.

      Kings tells it differently. There the ships, bound for the gold of Ophir, were broken at Ezion-geber, and Ahaziah then asked to send his servants with Jehoshaphat's, “But Jehoshaphat would not” ([[1 Kgs. 22:48–49]]; the note there sets the two accounts side by side).

      Kings calls them “ships of Tharshish,” a name that came to mean ships of the largest size, built for long voyages; Chronicles says they were made “to go to Tarshish.” The Tarshish of this voyage is placed in the Indian Ocean.
    sources: [lds-scriptures, scripture-helps-2-chronicles, bd-tarshish]

christ: |
  Judah was delivered by the LORD, who told them the battle was His; Jehovah, the God of Israel, is the premortal Jesus Christ. The footnote to verse 15 points to His word to the Saints of this dispensation: “I do not require at their hands to fight the battles of Zion; … I will fight your battles” ([[D&C 105:14]]).

  A disciple who faces more than he or she can meet, and does not know what to do, has the same way to deliverance that Jehoshaphat took and the same prayer: “our eyes are upon thee” ([[2 Chr. 20:12]]).

explore: |
  - **Moses at the sea.** [[Ex. 14:10–31]], the first “stand still, and see the salvation of the LORD.”
  - **The prayer Jehoshaphat leaned on.** [[2 Chr. 6:28–39]] and the LORD's answer, [[2 Chr. 7:12–16]].
  - **Jehoshaphat's whole reign.** [[2 Chr. 17–19]], and the same king in Kings, [[1 Kgs. 22:1–50]].
  - **President Gordon B. Hinckley, “Believe His Prophets”** (general conference, April 1992), a sermon on verse 20.

