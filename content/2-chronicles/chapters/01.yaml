chapter: 1
title: Wisdom and Knowledge Is Granted unto Thee
tagline: Solomon takes all Israel to the tabernacle at Gibeon and offers a thousand burnt offerings on the altar of Moses' day. That night God asks what He should give him; Solomon asks for wisdom and knowledge to judge God's people, and is given riches and honor besides.
when: 'The beginning of Solomon''s reign, after David''s death (1 Chr. 29:28)'

setting: |
  Second Chronicles opens where the first book closed, because the two were written as one work and divided only in the Greek translation of the Bible. David has died and Solomon reigns in his place ([[1 Chr. 29:28]]), and the first verse here takes up the words said of Solomon at his second anointing: “the LORD magnified Solomon exceedingly” ([[1 Chr. 29:25]]). Chapters 1–9 are Solomon's reign, and most of them are the building and dedication of the temple (chapters 2–7).

  This chapter covers the ground of two passages in Kings: the sacrifice and the vision at Gibeon ([[1 Kgs. 3:4–15]]), and the summary of Solomon's chariots, horses and wealth that Kings keeps for the close of his reign ([[1 Kgs. 10:26–29]]). The Chronicler expects his readers to know Kings, and much of Kings' account of the reign's beginning is not here: Adonijah's attempt on the throne, David's last charge about Joab and Shimei and what came of it, the marriage to Pharaoh's daughter, and the judgment between the two mothers. Two times are in view. The events are the start of Solomon's reign; the writing came after the exile, by most scholars' reckoning possibly in the fourth century BC (the setting of [[1 Chr. 1:1]] introduces the whole book).

thread: |
  Chronicles begins Solomon's reign at the altar. Before it tells of anything Solomon built or judged, it has the king summon Israel's leaders and go with “all the congregation” to the tabernacle Moses made and the altar Bezaleel made, where king and people “sought unto it” and Solomon offered a thousand burnt offerings (verses 2–6). There God asks what He should give, and the king asks for what his office needs, “wisdom and knowledge,” to judge “this thy people, that is so great” (verse 10). God grants it and adds what Solomon did not ask: riches, wealth and honor beyond any king before or after him (verse 12).

  The chapter ends by showing the addition already given. The chariots and horsemen, the silver and gold as common as stones, and the trade in horses (verses 14–17) are words Kings uses at the close of Solomon's reign; Chronicles sets them here, right after the promise, to show that God had given him riches and possessions. The next chapter turns to the house of the LORD, and Huram blesses the LORD for giving David “a wise son, endued with prudence and understanding, that might build an house for the LORD” ([[2 Chr. 2:12]]).

sections:
  - range: 1-6
    heading: The sacrifice at Gibeon
    plain: |
      Solomon the son of David established himself firmly in his kingdom, and the LORD his God was with him and made him exceedingly great. Solomon spoke to all Israel: to the commanders of thousands and of hundreds, to the judges, and to every leader in all Israel, the heads of the fathers' houses. Then Solomon and the whole assembly with him went to the high place at Gibeon, because God's tent of meeting, which Moses the servant of the LORD had made in the wilderness, was there. (David had brought the ark of God up from Kirjath-jearim to the place he had prepared for it, for he had pitched a tent for it in Jerusalem.) The bronze altar that Bezaleel the son of Uri, the son of Hur, had made was there too, before the tabernacle of the LORD, and Solomon and the assembly sought it out in worship. Solomon went up there to the bronze altar before the LORD at the tent of meeting and offered a thousand burnt offerings on it.
  - range: 7-13
    heading: Ask what I shall give thee
    plain: |
      That night God appeared to Solomon and said to him, “Ask what I should give you.” Solomon said to God, “You showed great mercy to David my father and have made me king in his place. Now, LORD God, let Your promise to David my father be fulfilled, for You have made me king over a people as many as the dust of the earth. Give me now wisdom and knowledge, so that I can lead this people, going out and coming in before them; for who can govern this great people of Yours?”

      God said to Solomon, “Because this was in your heart, and you have not asked for riches, wealth or honor, or the lives of your enemies, or even a long life, but have asked for wisdom and knowledge so that you can govern My people, over whom I have made you king: wisdom and knowledge are given to you. And I will give you riches, wealth and honor such as no king before you has had, and none after you will have.” Then Solomon came back to Jerusalem from the high place at Gibeon, from before the tent of meeting, and reigned over Israel.
  - range: 14-17
    heading: Chariots, horses, silver and gold
    plain: |
      Solomon gathered chariots and horsemen. He had fourteen hundred chariots and twelve thousand horsemen, which he stationed in the chariot cities and with the king at Jerusalem. The king made silver and gold as common in Jerusalem as stones, and cedar as plentiful as the sycomore trees in the lowland. Solomon's horses were brought from Egypt and from Kue; the king's merchants bought them from Kue at a price. They brought up a chariot from Egypt for six hundred shekels of silver and a horse for a hundred and fifty, and in the same way, through those merchants, they brought out horses for all the kings of the Hittites and the kings of Aram.

notes:
  - ref: 3
    phrase: went to the high place that was at Gibeon
    kind: history
    title: The king's sacrifice at Gibeon
    body: |
      Chronicles tells the sacrifice at Gibeon as an act of the whole nation, made at the altar of Moses' tabernacle. Kings says only that “the king went to Gibeon to sacrifice there” ([[1 Kgs. 3:4]]). Here Solomon first speaks to the captains, the judges and the heads of the fathers' houses, and then goes with “all the congregation.” On one older reading the two accounts are independent descriptions drawn from the same sources, Kings telling the LORD's appearing more fully and Chronicles the public worship; and the sacrifice was no private devotion but the religious consecration of the new reign, with the leaders of the kingdom present.

      Verses 3–6 explain why the place was Gibeon. The tabernacle Moses made stood there, and before it the bronze altar of burnt offering that Bezaleel made ([[Ex. 38:1–2]]), while the ark was in the tent David had pitched at Jerusalem; the notes at [[1 Kgs. 3:4]] and [[1 Chr. 16:39]] tell how the two came to be parted. On the same reading, the altar made Gibeon the lawful place for a sacrifice made for the nation, and Chronicles gives these details to explain why Solomon sacrificed there and not in Jerusalem, where the LORD had answered David by fire ([[1 Chr. 21:26]]); the passage stresses that Solomon “offered his burnt-offering at the legal place of worship.” Chronicles also has nothing of Kings' qualification that Solomon loved the LORD, “only he sacrificed and burnt incense in high places” ([[1 Kgs. 3:3]]).

      One small reading changes the sense of verse 5. The King James “he put before the tabernacle” follows one pointing of a Hebrew word; most sixteenth-century printed editions and some manuscripts, with the Septuagint and the Vulgate, read “was there,” the difference being a single point. The Revised Version adopted “was there,” an older commentary judges it “unquestionably better,” and the plain words above follow it: the altar was simply standing where Bezaleel's altar belonged.
    sources: [keil-chronicles, cambridge-chronicles, lds-scriptures]

  - ref: 5
    phrase: Solomon and the congregation sought unto it
    kind: words
    title: Sought unto it
    body: |
      “Sought unto it” means that king and people came to worship, and the Church's footnote gives the object of their seeking as either the altar or “Him, i.e., the Lord.” The verb is *dāraš*, “resort to, seek,” and the lexicon places this verse under its first sense, to frequent a place with a religious purpose, together with the law's command to seek the place the LORD would choose: “even unto his habitation shall ye seek, and thither thou shalt come” ([[Deut. 12:5]]). On either reading the verse describes worship at the LORD's appointed altar.

      *Dāraš* is the verb of Chronicles' verdict on Saul, who “inquired not of the LORD” ([[1 Chr. 10:14]]; the note at [[1 Chr. 13:3]] explains it), and of the prophet's word to Asa, “if ye seek him, he will be found of you” ([[2 Chr. 15:2]]). Solomon's reign opens with the king and the congregation doing it together.
    sources: [oshb-wlc, bdb, lds-scriptures]

  - ref: 7
    phrase: In that night did God appear unto Solomon
    kind: history
    title: God appeared in a dream by night
    body: |
      Chronicles says that God “appeared” to Solomon that night; Kings, telling the same event, says that the LORD “appeared to Solomon in a dream by night,” and that Solomon awoke, “and, behold, it was a dream” ([[1 Kgs. 3:5]]; [[1 Kgs. 3:15]]). The accounts agree. Chronicles keeps the night and the appearing and leaves out the word *dream*.

      In the study of ancient dream reports, Solomon's dream at Gibeon as Kings tells it is a classic “message dream,” in which a divine being comes to the dreamer and speaks, with “no symbolic imagery requiring interpretation.” A symbolic dream, by contrast, shows images that someone usually has to interpret after the dreamer wakes. The same study cautions that ancient peoples did not draw that line sharply, and it notes that, by 2 Chr. 1:3–6, the tabernacle of Moses was then at Gibeon. In both accounts the LORD came to Solomon at Gibeon on the night of his sacrifice and spoke with him plainly: “Ask what I shall give thee.”
    sources: [lds-scriptures, pike-lehi-dreamed]

  - ref: 9
    phrase: let thy promise unto David my father be established
    kind: scripture
    title: Thy promise unto David
    body: |
      Solomon's first request is that the LORD keep His word to David, and his wording recalls the covenant of [[1 Chr. 17]]. When the LORD promised David a son who would sit on his throne and build His house, David answered, “let the thing that thou hast spoken concerning thy servant and concerning his house be established for ever” ([[1 Chr. 17:23]]); one older commentary hears Solomon's prayer in the same terms and notes that he uses them again at the dedication of the temple ([[2 Chr. 6:17]]). Another older commentary suggests a narrower promise: David's words to Solomon, “Only the LORD give thee wisdom and understanding” ([[1 Chr. 22:12]]), which may be translated, “Surely the Lord will give thee wisdom and understanding.” On that reading the promise Solomon pleads is a promise of the wisdom he asks for in the next verse. (What Chronicles changes in the covenant itself is the note at [[1 Chr. 17:11]].)

      The LORD's answer is shorter here than in Kings, and one part of Kings' answer is missing. Kings ends with a condition: “if thou wilt walk in my ways, to keep my statutes and my commandments, as thy father David did walk, then I will lengthen thy days” ([[1 Kgs. 3:14]]). Chronicles names long life only among the things Solomon did not ask (verse 11) and gives him wisdom, knowledge, riches, wealth and honor without it. One older reading holds that the conditional promise is left out because Solomon did not keep the condition, so the promise was not fulfilled; the note at [[1 Kgs. 3:14]] gives the Joseph Smith Translation of that verse.
    sources: [keil-chronicles, cambridge-chronicles, lds-scriptures]

  - ref: 10
    phrase: for who can judge this thy people, that is so great?
    kind: words
    title: To judge this thy people
    body: |
      To “judge” a people, in Solomon's Hebrew, is to govern them, and the Church's footnote gives “rule” as another rendering here and in verse 11. The verb *šāpaṭ* means to act as lawgiver, judge and governor, giving law, deciding disputes and carrying the law out, so Solomon is asking for wisdom for the whole work of a king, not only for the courtroom. Israel had asked Samuel for a king “to judge us like all the nations” ([[1 Sam. 8:5]]).

      Solomon asks for that wisdom as a gift from God, for a people he calls God's, “this thy people.” The same footnote sends the reader to King Mosiah, who reasoned that kings would be expedient only if there could always be just men to reign, men “who would establish the laws of God, and judge this people according to his commandments” ([[Mosiah 29:13]]).
    sources: [oshb-wlc, bdb, lds-scriptures]

  - ref: 16
    phrase: And Solomon had horses brought out of Egypt, and linen yarn
    kind: history
    title: Horses out of Egypt and Kue
    body: |
      “Linen yarn” is a place name. The Hebrew *miqwēʾ*, twice in this verse, is read by the standard Hebrew lexicon as “from Kuë,” a territory in Cilicia in the south of Asia Minor, both here and in the same sentence in [[1 Kgs. 10:28]]. Solomon's horses came from Egypt and from Kue, and the king's merchants bought them from Kue at a price; the plain words above follow that reading.

      The horses raise a question the law had already answered: the king “shall not multiply horses to himself, nor cause the people to return to Egypt” ([[Deut. 17:16]]). The Church's footnote to “horses” in that law points to Solomon's horses ([[1 Kgs. 4:26]]; [[2 Chr. 9:28]]). The note at [[Deut. 17:16]] gives the law's reasons, and the note at [[1 Kgs. 10:28]] how Solomon's reign answers them; Chronicles tells the trade here without comment.
    sources: [bdb, oshb-wlc, lds-scriptures]

christ: |
  The LORD's question at Gibeon, “Ask what I shall give thee,” is one the Church's footnote sets beside the risen Lord's question to His Nephite disciples, “What is it that ye desire of me, after that I am gone to the Father?” ([[3 Ne. 28:1]]), and to John, “what desirest thou?” ([[D&C 7:1]]). Solomon asked for wisdom to govern the people given him, John that he might “bring souls unto thee” ([[D&C 7:2]]), and each was given what he asked. To Peter and John the Lord said, “ye shall both have according to your desires” ([[D&C 7:8]]), and Alma, speaking of all people, knew that God “granteth unto men according to their desire” ([[Alma 29:4]]). What a disciple asks of God shows what is in the heart, as God's answer to Solomon began: “Because this was in thine heart” (verse 11).

