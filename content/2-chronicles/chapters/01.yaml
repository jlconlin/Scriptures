  - **The promise Solomon pleads.** [[1 Chr. 17:11–27]]; [[1 Chr. 22:6–13]].
  - **The law of the king.** [[Deut. 17:14–20]].
  - **The Lord asks His disciples what they desire.** [[3 Ne. 28:1–12]]; [[D&C 7:1–8]].
  - **The story goes on: Solomon writes to Huram for the temple.** [[2 Chr. 2:1–16]].

