chapter: 31
title: The LORD Hath Blessed His People
tagline: When the Passover ends, the worshipers break the idols from Judah to Manasseh; Hezekiah orders the priests' and Levites' courses and their support, the people's tithes rise in heaps from harvest to ingathering, and Levites are set over the stores to deal them out faithfully.
when: 'The reign of Hezekiah king of Judah, after the Passover of [[2 Chr. 30]]: the heaps are begun in the third month and finished in the seventh (verse 7)'

setting: |
  This chapter finishes the three that Chronicles gives to Hezekiah's reform. In [[2 Chr. 29]] the priests and Levites cleanse the house his father Ahaz had shut ([[2 Chr. 28:24]]); in [[2 Chr. 30]] all Israel keeps the Passover. Now the worshipers go home by way of the high places, and the king turns to what keeps worship going once a feast is over: priests and Levites on duty in their courses, sacrifices supplied, and the people's portion brought in to support those who serve.

  Only the first verse has a parallel in Kings, which says in one line that Hezekiah “removed the high places, and brake the images, and cut down the groves” ([[2 Kgs. 18:4]]; the note there explains why that matters in Kings). Verses 2–21, the courses, the tithes and their keepers, are told only here. The next chapter opens “After these things, and the establishment thereof” with Sennacherib's invasion ([[2 Chr. 32:1]]), told already at 2 Kings 18–19 and Isaiah 36–37.

thread: |
  The chapter moves from tearing down to building up: from the destruction of the idols and the high places (verse 1) to provision for ordering and maintaining the temple's worship and those who serve in it (verses 2–19). The turning point is a pile of food. The king gives from his own herds, the people give their firstfruits and tithes, and for four months, from the grain harvest to the vintage, the gifts are heaped up until the king and princes come to see them and bless the LORD (verses 3–8). When Hezekiah asks how there came to be so much, the high priest answers with a reason, not a figure: “the LORD hath blessed his people” (verse 10).

  What follows is administration, and the chapter takes it seriously. Storerooms are prepared, Levites are named over the stores, and their work is done “faithfully” (verse 12; the note there), as they deal out portions to every family of priests and Levites, “as well to the great as to the small” (verse 15). Then the chapter sums up the king in the book's own terms. He did what was “good and right and truth,” and everything he began he did “to seek his God … with all his heart, and prospered” (verses 20–21).

sections:
  - range: 1
    heading: The idols broken from Judah to Manasseh
    plain: |
      When all this was finished, all the Israelites who were there went out to the cities of Judah and smashed the sacred pillars, cut down the Asherah poles, and tore down the high places and altars throughout Judah and Benjamin, and in Ephraim and Manasseh as well, until they had destroyed them all. Then all the Israelites returned to their own cities, each to his own property.
  - range: 2-8
    heading: The courses set, and the heaps
    plain: |
      Hezekiah assigned the priests and Levites to their divisions, each man to his own duty, priests and Levites alike, to offer burnt offerings and peace offerings, to serve, and to give thanks and praise within the gates of the LORD's camp. He gave from his own property the king's share for the burnt offerings: the morning and evening burnt offerings, and those for the Sabbaths, the new moons and the appointed feasts, as written in the law of the LORD. He commanded the people living in Jerusalem to give the share due to the priests and Levites, so that they could devote themselves to the law of the LORD.

      As soon as the order went out, the Israelites gave generously the firstfruits of grain, wine, oil and honey and of all the produce of the field, and they brought in a tithe of everything in abundance. The Israelites and Judeans living in the cities of Judah also brought a tithe of cattle and sheep, and a tithe of the holy things dedicated to the LORD their God, and laid them in heaps. They began piling the heaps in the third month and finished in the seventh. When Hezekiah and the princes came and saw the heaps, they blessed the LORD and His people Israel.
  - range: 9-19
    heading: Storerooms and faithful stewards
    plain: |
      Hezekiah asked the priests and Levites about the heaps. Azariah the chief priest, of the house of Zadok, answered, “Since the people began bringing their offerings into the LORD's house, we have had enough to eat and plenty left over, for the LORD has blessed His people; this great store is what is left.” Hezekiah ordered storerooms prepared in the LORD's house, and they prepared them. They faithfully brought in the offerings, the tithes and the dedicated things. Cononiah the Levite was in charge of them, with his brother Shimei second, and ten Levites, Jehiel, Azaziah, Nahath, Asahel, Jerimoth, Jozabad, Eliel, Ismachiah, Mahath and Benaiah, served as overseers under them, by appointment of King Hezekiah and of Azariah the ruler of God's house.

      Kore son of Imnah, the Levite who kept the east gate, was over the freewill offerings to God, to distribute the LORD's contributions and the most holy things. Under him, in the priests' cities, Eden, Miniamin, Jeshua, Shemaiah, Amariah and Shecaniah, in their office of trust, gave portions to their fellow priests by their divisions, old and young alike. This was besides the males registered by genealogy from three years old and up who came into the LORD's house for their daily service in their divisions, the priests registered by their fathers' houses, and the Levites from twenty years old and up by their divisions. They gave to all the registered families, little ones, wives, sons and daughters, through the whole community, for in their office of trust they kept themselves holy. For the priests, Aaron's descendants, who lived in the pasture lands around their cities, men were named in every city to give portions to every male among the priests and to every Levite on the genealogical record.
  - range: 20-21
    heading: Hezekiah sought his God with all his heart
    plain: |
      This is what Hezekiah did throughout Judah. He did what was good, right and faithful before the LORD his God. In every work he undertook in the service of God's house, and in keeping the law and the commandments, he sought his God and did it with all his heart, and he prospered.

notes:
  - ref: 1
    phrase: in Ephraim also and Manasseh
    kind: history
    title: The people finish the work, north as well as south
    body: |
      Chronicles tells the removal of the high places as the act of the worshipers themselves, and it carries the work beyond Judah's border. Kings credits the king: “He removed the high places” ([[2 Kgs. 18:4]]). Here it is “all Israel that were present,” everyone who had come to the Passover, who went out when the feast ended and broke the pillars and altars before going home. They did it not only in Judah and Benjamin, Hezekiah's own kingdom ([[2 Chr. 11:1]]), but in Ephraim and Manasseh beyond its border. Whether the northern kingdom still stood when this Passover was kept is weighed in the note at [[2 Chr. 30:6]].
    sources: [lds-scriptures]

  - ref: 4
    phrase: that they might be encouraged in the law of the LORD
    kind: words
    title: Freed to give themselves to the law
    body: |
      “Encouraged” misleads the modern ear: Hezekiah is not cheering the priests up but freeing them to do their work. The verb is *yeḥezqû*, from *ḥāzaq*, “be strong”; followed by “in,” as here, the Hebrew lexicon gives its sense as “hold firmly to, devote oneself to” the law of the LORD.

      The two commands of verses 3 and 4 work together. The king supplied from his own substance the burnt offerings the law requires every morning and evening, every Sabbath, new moon and feast; the Church's footnotes on verse 3 send each of them to its place in [[Num. 28:3–31]]. The people of Jerusalem were to give the portion that belonged to the priests and Levites, so that they could hold to the duties the law laid on them, the service of the house.
    sources: [oshb-wlc, bdb, lds-scriptures]

  - ref: 5
    phrase: the tithe of all things brought they in abundantly
    kind: scripture
    title: Firstfruits and the tithe
    body: |
      The people brought the two gifts the law of Moses asked of every harvest. Firstfruits were regarded as belonging to God, offered by the nation at the great feasts and by individuals at other times, and they went to the priests ([[Num. 18:12–13]]). The tithe, a tenth, went to the Levites, and the Levites in turn gave a tenth of what they received to the priests ([[Num. 18:21–28]]).

      What the verse stresses is the response: “as soon as the commandment came abroad,” the gifts came “in abundance,” and the tithe came “abundantly.” This passage stands among the Old Testament's witnesses to the law of the tithe, which latter-day revelation gives again ([[D&C 119:4]]) and emphasizes “as a duty and a test of faithfulness.” The site's notes at [[Mal. 3:10]] take up the storehouse, the windows of heaven and the tithe in the Restoration.
    sources: [bd-firstfruits, bd-tithe, lds-scriptures]

  - ref: 7
    phrase: In the third month they began to lay the foundation of the heaps
    kind: history
    title: Heaps from harvest to ingathering
    body: |
      The heaps grew through a whole growing season. On one older reading, the third month came at the end of the grain harvest and brought the feast of Pentecost, when Israel offered two loaves of new wheat as firstfruits; the seventh month came at the end of the fruit and wine harvest and brought the Feast of Tabernacles, or Ingathering, a thanksgiving for the harvest. So the gifts were brought as each crop came in, and the piles were finished only when the last of the year's produce had been gathered.

      Verse 6 also says who brought them. The “children of Israel … that dwelt in the cities of Judah” are, on one older reading, not the people of the northern kingdom but Israelites who had left it and settled in Judah, the northerners whom Chronicles describes coming south at [[2 Chr. 11:16]] and [[2 Chr. 30:25]] (the note at [[2 Chr. 30:1]]).
    sources: [keil-chronicles, cambridge-chronicles, bd-firstfruits]

  - ref: 10
    phrase: for the LORD hath blessed his people
    kind: scripture
    title: The LORD hath blessed his people
    body: |
      Azariah answers Hezekiah's question about the heaps by naming who had filled them. The high priest's answer runs in three steps: since the offerings began, “we have had enough to eat, and have left plenty”; the reason is that “the LORD hath blessed his people”; and the proof stands in front of them, “this great store.”

      Azariah was of “the house of Zadok,” the priestly line that runs from Eleazar, Aaron's son, to Zadok ([[1 Chr. 6:3–8]]), who was priest in David's day ([[2 Sam. 8:17]]). One older reading holds that he is hardly the Azariah who had withstood Uzziah at the incense altar ([[2 Chr. 26:17]]), some forty years before.
    sources: [keil-chronicles, lds-scriptures]

  - ref: 12
    phrase: faithfully
    kind: words
    title: Faithfully, and in their trust
    body: |
      The Levites who kept the stores were trusted men, and the chapter says so three times with one Hebrew word that the King James translates two ways. The word is *ʾĕmûnâ*, “faithfulness, trust.” In verse 12 it is “faithfully,” used of faithfulness in an office; in verses 15 and 18, with “in” before it (*beʾĕmûnâ*; in verse 18 *beʾĕmûnātām*, with “their”), it is “in their set office,” that is, “in trust” over the stores.

      The trust was large. The Levites named in verses 12–14 received and stored the firstfruits, tithes and dedicated things in the chambers of the house of the LORD. Others in the priests' cities dealt out portions to their brethren by their courses, “as well to the great as to the small” (verse 15), and the lists of verses 16–18 reach the priests' and Levites' wives, sons, daughters and little ones.
    sources: [oshb-wlc, bdb]

  - ref: 21
    phrase: he did it with all his heart, and prospered
    kind: scripture
    title: With all his heart, and prospered
    body: |
      The chapter ends by tying Hezekiah's success to his seeking. Kings says of him that “the LORD was with him; and he prospered whithersoever he went forth” ([[2 Kgs. 18:7]]). Chronicles sets beside the prospering what Hezekiah did: in every work he began, he set out “to seek his God,” and he did it “with all his heart.”

      In Chronicles the reward usually follows within the reign, not generations later (the note at [[2 Chr. 14:7]] explains the pattern), and this verse puts Hezekiah's whole-hearted seeking and his prospering side by side. The next chapter's crisis begins “After these things” ([[2 Chr. 32:1]]).
    sources: [sc-knowhy-861, lds-scriptures]

christ: |
  “The LORD hath blessed his people,” Azariah said over the heaps (verse 10), and the LORD who blessed them is Jehovah, the premortal Jesus Christ. Hezekiah sought Him “with all his heart, and prospered” (verse 21), and the people's tithes, given at once and in abundance, were the means by which His house was served.

  The same law reaches a disciple now. As Elder Neil L. Andersen taught, “the sacred law of tithing is principally a matter of our faith,” and paying it honestly is “one way we show our willingness to put the Lord first in our lives.” Judah's tithes kept the priests and Levites at their service; of the tithes paid now he said, “Because of your faithful tithes, the Church is being established in faraway places you may never visit among righteous Saints you may never know.”

explore: |
  - **The reform from its start.** [[2 Chr. 29]], the cleansing of the house, and [[2 Chr. 30]], the Passover.
  - **The tithe in the law.** [[Num. 18:20–32]], the Levites' portion and the tithe of the tithe.
  - **When the portions stopped.** [[Neh. 13:10–12]], and [[Mal. 3:8–12]] with the site's notes.
  - **What came next.** [[2 Chr. 32]], Sennacherib and the king who trusted.

