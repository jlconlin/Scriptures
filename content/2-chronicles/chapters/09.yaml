chapter: 9
title: To Be King for the LORD Thy God
tagline: The queen of Sheba comes to test Solomon's wisdom and goes home blessing the LORD who set him on His throne. Then the gold, the ivory throne, the ships and the horses, and Solomon dies after forty years with nothing said of his turning.
when: 'Solomon''s reign, after the house of the LORD and his own house were built (2 Chr. 8:1), to his death after forty years (verse 30).'

setting: |
  This chapter closes Solomon's reign and the first part of 2 Chronicles. It follows [[1 Kgs. 10:1–29]] and [[1 Kgs. 11:41–43]] almost word for word, and the site's notes there explain what both share: the queen of Sheba and her hard questions ([[1 Kgs. 10:1]]), the throne set up “to do judgment and justice” ([[1 Kgs. 10:9]]), where the gold came from ([[1 Kgs. 10:14]]), and the horses out of Egypt ([[1 Kgs. 10:28]]).

  The larger difference is what Chronicles leaves out. Between the horses and the closing formula, Kings tells of Solomon's many foreign wives, his turning to their gods, the LORD's anger, the adversaries He raised, and the prophet Ahijah's word to Jeroboam that ten tribes would be torn away ([[1 Kgs. 11:1–40]]; latter-day scripture on the wives is at [[1 Kgs. 11:3]]). Chronicles passes over that whole section and goes from the horses straight to Solomon's death. It knows the story it leaves out. Its writers seem to have assumed that their readers knew Samuel and Kings, and in the next chapter it names the word the LORD “spake by the hand of Ahijah the Shilonite to Jeroboam” ([[2 Chr. 10:15]]) as something already known, though it never tells it. The book was written after the exile for a people asking “Are we still God's people and does the covenant still stand?”, to give them hope and an identity built on worship (the setting of [[1 Chr. 1]] introduces the book).

thread: |
  Chronicles ends Solomon's reign at its height, with the gift of Gibeon on display. Solomon had asked for wisdom and knowledge and been promised riches, wealth and honor besides ([[2 Chr. 1:11–12]]); at the parallel verse in Kings ([[1 Kgs. 10:23]]) the Church's footnote sends the summary of his riches back to that promise. Here a queen from far away tests his wisdom and finds that “the one half” was not told her (verse 6), and “all the kings of the earth” seek him “to hear his wisdom, that God had put in his heart” (verse 23), while gold, ivory, silver and horses pile up around him (verses 13–28). Kings counts forty thousand stalls for his horses where Chronicles has four thousand; the note at [[1 Kgs. 4:26]] gives both.

  At the center the queen says whose kingdom it is: the LORD set Solomon “on his throne, to be king for the LORD thy God” (verse 8). Then the reign closes with the prophets' records, Solomon's burial in the city of David, and Rehoboam in his place (verses 29–31), with nothing between the wealth and the death. The next chapter tells how ten tribes rebelled against Rehoboam ([[2 Chr. 10:16–19]]).

sections:
  - range: 1-12
    heading: The queen of Sheba
    plain: |
      The queen of Sheba heard of Solomon's fame and came to Jerusalem to test him with riddles. She came with a very large retinue, with camels carrying spices, a great deal of gold and precious stones, and when she came to Solomon she talked with him about everything on her mind. Solomon answered all her questions; nothing was hidden from him that he could not explain to her.

      When the queen of Sheba saw Solomon's wisdom and the house he had built, the food of his table, the seating of his officials, the service of his attendants and their clothing, his cupbearers and their clothing, and the ascent by which he went up to the house of the LORD, she was left breathless. She said to the king, “The report I heard in my own country about your deeds and your wisdom was true. I did not believe what they said until I came and saw it with my own eyes, and I was not told half the greatness of your wisdom: you surpass the report I heard. Happy are your men, and happy are these servants of yours who stand before you always and hear your wisdom. Blessed be the LORD your God, who delighted in you and set you on His throne to be king for the LORD your God. Because your God loved Israel and would establish them forever, He made you king over them, to do judgment and justice.”

      She gave the king a hundred and twenty talents of gold, a great quantity of spices and precious stones; there were never such spices as those the queen of Sheba gave King Solomon. (Huram's servants and Solomon's servants, who brought gold from Ophir, also brought algum wood and precious stones. The king made the algum wood into terraces for the house of the LORD and for the king's palace, and harps and lyres for the singers; nothing like them had been seen before in the land of Judah.) King Solomon gave the queen of Sheba everything she desired and asked for, more than she had brought to the king. Then she went back to her own country with her servants.
  - range: 13-21
    heading: Gold, ivory, and the ships
    plain: |
      The gold that came to Solomon in one year weighed six hundred and sixty-six talents, besides what the traders and merchants brought; all the kings of Arabia and the governors of the land brought gold and silver to Solomon. King Solomon made two hundred large shields of beaten gold, six hundred shekels of beaten gold to each shield, and three hundred smaller shields of beaten gold, three hundred shekels of gold to each, and the king put them in the House of the Forest of Lebanon.

      The king also made a great throne of ivory and overlaid it with pure gold. The throne had six steps and a footstool of gold, fastened to the throne, with armrests on each side of the seat and two lions standing beside the armrests. Twelve lions stood on the six steps, one at each end of every step. Nothing like it was made in any kingdom. All King Solomon's drinking vessels were gold, and all the vessels of the House of the Forest of Lebanon were pure gold; none were silver, which was thought of as nothing in Solomon's day. For the king's ships went to Tarshish with Huram's servants, and once every three years the ships of Tarshish came bringing gold and silver, ivory, apes and peacocks.
  - range: 22-28
    heading: Above all the kings of the earth
    plain: |
      So King Solomon surpassed all the kings of the earth in riches and wisdom. All the kings of the earth sought an audience with Solomon to hear the wisdom God had put in his heart, and each of them brought his gift, vessels of silver and of gold, clothing, armor, spices, horses and mules, a set amount year by year.

      Solomon had four thousand stalls for horses and chariots and twelve thousand horsemen, whom he stationed in the chariot cities and with the king at Jerusalem. He ruled over all the kings from the Euphrates to the land of the Philistines and the border of Egypt. The king made silver as common in Jerusalem as stones, and cedar as plentiful as the sycomore trees of the lowland. Horses were brought to Solomon from Egypt and from every land.
  - range: 29-31
    heading: Solomon's death
    plain: |
      The rest of Solomon's acts, from first to last, are written in the book of Nathan the prophet, in the prophecy of Ahijah the Shilonite, and in the visions of Iddo the seer concerning Jeroboam the son of Nebat. Solomon reigned in Jerusalem over all Israel forty years. Then Solomon died and was buried in the city of David his father, and Rehoboam his son reigned in his place.

notes:
  - ref: 8
    phrase: to set thee on his throne, to be king for the LORD thy God
    kind: scripture
    title: On his throne
    body: |
      In Chronicles the queen of Sheba calls Israel's throne the LORD's. Kings has her bless the LORD for setting Solomon “on the throne of Israel” ([[1 Kgs. 10:9]]); Chronicles has “on his throne, to be king for the LORD thy God.” Where Kings says the LORD made Solomon king because He “loved Israel for ever,” Chronicles gives the love a purpose, “to establish them for ever.”

      The wording is Chronicles' own way of speaking about the kingdom. David called the throne Solomon would inherit “the throne of the kingdom of the LORD” ([[1 Chr. 28:5]]), and at his crowning Solomon “sat on the throne of the LORD” ([[1 Chr. 29:23]]); the notes at [[1 Chr. 28:5]] and [[1 Chr. 29:22]] follow the phrase. On an older reading, the throne of Israel is God's, and the king who sits on it holds it only as His deputy. Here the same conviction is spoken by a foreign queen, and it ends where Kings does: the LORD made Solomon king “to do judgment and justice.”
    sources: [lds-scriptures, cambridge-chronicles]

  - ref: 21
    phrase: For the king’s ships went to Tarshish with the servants of Huram
    kind: history
    title: Ships that went to Tarshish
    body: |
      Chronicles sends Solomon's ships to Tarshish, though his fleet sailed from a port on the Red Sea, and the Church's reading is that the name belonged to a second place as well. Kings says only that the king had “a navy of Tharshish” ([[1 Kgs. 10:22]]), and the name came to describe a kind of ship, “ships of the largest size, suitable for long voyages” (the note at [[Ps. 72:10]]). The Tarshish best known from the Bible was probably Tartessus in Spain, the place Jonah tried to reach by sailing from Joppa on the Mediterranean ([[Jonah 1:3]]).

      Solomon's fleet, though, went out from Ezion-geber, “at the sea side in the land of Edom” ([[2 Chr. 8:17]]), “on the shore of the Red sea” ([[1 Kgs. 9:26]]). Chronicles uses the same words for Jehoshaphat's later fleet: he made ships “to go to Tarshish: and they made the ships in Ezion-geber” ([[2 Chr. 20:36]]), ships that Kings says were made “to go to Ophir for gold” ([[1 Kgs. 22:48]]). Besides the Tarshish in Spain there was “a Tarshish in the Indian Ocean,” and that is the one this verse, [[2 Chr. 20:36]] and [[1 Kgs. 22:48]] are read as naming.
    sources: [bd-tarshish, lds-scriptures]

  - ref: 29
    phrase: in the book of Nathan the prophet, and in the prophecy of Ahijah the Shilonite, and in the visions of Iddo the seer against Jeroboam the son of Nebat
    kind: history
    title: Nathan, Ahijah and Iddo
    body: |
      Where Kings sends its reader to “the book of the acts of Solomon” ([[1 Kgs. 11:41]]), Chronicles names the records of three prophets, and all three are lost. The book of Nathan, the prophecy of Ahijah and the visions of Iddo are among the books the Bible names in a way that shows they were “considered authentic and valuable” but that “are not found in the Bible today.”

      Nathan's book is the one Chronicles also names for David's reign (the note at [[1 Chr. 29:29]]). Ahijah the Shilonite is the prophet who met Jeroboam alone in a field, tore his new garment into twelve pieces and gave him ten, because Solomon's house had forsaken the LORD and worshipped Ashtoreth, Chemosh and Milcom ([[1 Kgs. 11:29–33]]; the note at [[1 Kgs. 11:30]]). Chronicles recalls that word in the next chapter without telling it ([[2 Chr. 10:15]]). Iddo's visions, “against Jeroboam,” are cited again for the reigns of Rehoboam and Abijah ([[2 Chr. 12:15]]; [[2 Chr. 13:22]]).
    sources: [bd-lost-books, lds-scriptures]

christ: |
  The queen blessed the LORD for setting Solomon “on his throne, to be king for the LORD thy God” (verse 8), and at the chapter's end that throne passed to Rehoboam, under whom the kingdom divided. Gabriel promised Mary a Son to whom “the Lord God shall give … the throne of his father David,” and “of his kingdom there shall be no end” ([[Luke 1:32–33]]; the `christ` of [[1 Chr. 17]]), and Jesus said of this queen's visit, “behold, a greater than Solomon is here” ([[Luke 11:31]]; the `christ` of [[1 Kgs. 10]]). The King a disciple serves now does not die and leave His throne to another: “I am he that liveth, and was dead; and, behold, I am alive for evermore” ([[Rev. 1:18]]).

explore: |
  - **The same chapter in Kings, and what follows it there.** [[1 Kgs. 10:1–29]]; [[1 Kgs. 11:1–43]].
  - **The promise at Gibeon that the chapter shows kept.** [[2 Chr. 1:7–12]].
  - **The throne of the LORD in Chronicles.** [[1 Chr. 17:14]]; [[1 Chr. 28:5]]; [[1 Chr. 29:23]].
  - **Ahijah's word, which Chronicles assumes.** [[1 Kgs. 11:29–39]]; [[2 Chr. 10:15]].
  - **The queen in Jesus' words.** [[Matt. 12:38–42]]; [[Luke 11:29–32]].

