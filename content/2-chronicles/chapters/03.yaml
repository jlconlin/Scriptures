chapter: 3
title: In Mount Moriah
tagline: Solomon begins the house of the LORD on the hill where the LORD appeared to David, measures it, covers it with gold, sets two cherubim in the most holy house and a veil before it, and raises two pillars at the door.
when: 'Solomon''s fourth year, beginning on the second day of the second month (verse 2).'

setting: |
  Chapter 2 ended with the workmen set to their tasks, burden bearers, hewers in the mountain and overseers ([[2 Chr. 2:18]]). Chapter 3 begins the building itself, and chapter 4 goes on to the altar, the sea and the vessels ([[2 Chr. 4:1]]). Kings tells the same work at greater length in 1 Kings 6–7. It dates the start from the Exodus, “in the four hundred and eightieth year” ([[1 Kgs. 6:1]]), gives the height of the house, which Chronicles leaves out, and sets in the middle of the building account a word of the LORD to Solomon: “Concerning this house which thou art in building, if thou wilt walk in my statutes …” ([[1 Kgs. 6:12]]). Chronicles keeps the fourth year and the second month, and among the details it adds are two that Kings does not have: the name of the hill, and the veil before the most holy house.

  The books of Chronicles were compiled from older records along with Samuel and Kings, the compilers choosing what suited their purpose; they “dwell with most satisfaction upon the ecclesiastical and religious aspects of the history, and the progress of temple worship in Jerusalem.” The plan of the house and its pillars are explained in the notes on Kings ([[1 Kgs. 6:2]]; [[1 Kgs. 6:16]]; [[1 Kgs. 6:27]]; [[1 Kgs. 7:21]]). The notes here are on what Chronicles says differently.

thread: |
  The chapter moves inward and then back out. It starts with the ground (verse 1), measures the house and covers it with gold (verses 3–9), goes into the most holy house with its cherubim and its veil (verses 10–14), and comes out again to the two pillars before the door (verses 15–17).

  Before a stone is laid, the place is already holy. Chronicles names it twice over: the hill “where the LORD appeared unto David his father,” and “the place that David had prepared in the threshingfloor of Ornan the Jebusite.” The rest is measurement and gold, much of it told in Kings, but two things Kings does not have frame it. The name Moriah stands at the beginning, and at the center hangs a veil made like the tabernacle's, of blue, purple, red and fine linen with cherubim worked into it.

sections:
  - range: 1-2
    heading: The place and the day
    plain: |
      Then Solomon began to build the house of the LORD in Jerusalem, on Mount Moriah, where the LORD had appeared to his father David, on the site David had prepared at the threshing floor of Ornan the Jebusite. He began on the second day of the second month, in the fourth year of his reign.
  - range: 3-9
    heading: The house and its gold
    plain: |
      These are the foundations Solomon laid for building the house of God. Measured in cubits by the old standard, it was sixty cubits long and twenty wide. The porch across the front of the house was as long as the house was wide, twenty cubits, and a hundred and twenty high, and he overlaid it inside with pure gold. He paneled the main hall with fir, overlaid it with fine gold, and worked palm trees and chains on it. He adorned the house with precious stones for beauty, and the gold was gold of Parvaim. He overlaid the house with gold, its beams, thresholds, walls and doors, and carved cherubim on the walls.

      He made the most holy house, twenty cubits long, as wide as the house, and twenty cubits wide, and overlaid it with fine gold weighing six hundred talents. The nails weighed fifty shekels of gold, and he overlaid the upper rooms with gold.
  - range: 10-14
    heading: The cherubim and the veil
    plain: |
      In the most holy house he made two cherubim of image work and overlaid them with gold. Their wings together spanned twenty cubits. Each wing was five cubits long: one wing of each cherub reached to the wall of the house, and the other met the wing of the other cherub. So the wings stretched twenty cubits; the cherubim stood on their feet, and their faces were turned inward.

      He made the veil of blue, purple and crimson yarn and fine linen, and worked cherubim into it.
  - range: 15-17
    heading: Jachin and Boaz
    plain: |
      In front of the house he made two pillars thirty-five cubits high, each with a capital of five cubits on top. He made chains like those in the inner sanctuary and put them on the tops of the pillars, and made a hundred pomegranates and hung them on the chains. He set up the pillars in front of the temple, one on the right and the other on the left, and named the one on the right Jachin and the one on the left Boaz.

notes:
  - ref: 1
    phrase: where the LORD appeared unto David his father
    kind: history
    title: The hill where the LORD was seen
    body: |
      Chronicles locates the temple by what had happened on the hill: the LORD had appeared there to David. The appearing is the story of the census and the plague, when David “saw the angel of the LORD stand between the earth and the heaven, having a drawn sword in his hand stretched out over Jerusalem” ([[1 Chr. 21:16]]), and then built an altar on Ornan's floor, where the plague was stayed ([[1 Chr. 21:26–27]]). The verse joins that appearing to a name used in only one other passage of the Bible: “mount Moriah,” the land where Abraham was sent to offer Isaac ([[Gen. 22:2]]).

      Chronicles does not name Abraham, and whether the two Moriahs are one place is a tradition, weighed in the note at [[Gen. 22:2]]; the note at [[Gen. 22:14]] follows the word “seen” from Abraham's mount to this verse, and the notes at [[2 Sam. 24:18]] and [[1 Chr. 22:1]] tell how the threshing floor became the temple's site. One Latter-day Saint reading takes the verse as the Chronicler specifically connecting the threshing floor, Isaac's arrested sacrifice and the building of the temple, so that the house stood as the embodiment of “Abraham's ‘Moriah,’ where he literally placed everything the Lord had given him … upon the altar.”
    sources: [bowen-mount-lord-provided, lds-scriptures]

  - ref: 3
    phrase: The length by cubits after the first measure
    kind: words
    title: Foundations, by the old cubit
    body: |
      Verse 3 gives the ground plan of the house, measured by an older standard of the cubit. The King James “wherein Solomon was instructed” renders a Hebrew form, *hûsad*, from the verb “to found”: the line reads literally “these are the founding of Solomon to build the house of God,” that is, “this is the foundation which Solomon laid for building.” What follows is the footprint, length and breadth, and not the height.

      “After the first measure” means the “ancient measure.” A cubit was the length from the elbow to the tip of the finger, normally about 17½ inches, but the terms for measures “varied from time to time” and “must be interpreted in the light of the period of time in which they are used.” The verse names an older standard for its figures; which cubit that was, and how it differed from the one in use when Chronicles was written, the verse does not say.
    sources: [bdb, bd-weights-and-measures, lds-scriptures]

  - ref: 14
    phrase: he made the veil of blue, and purple, and crimson, and fine linen
    kind: history
    title: A veil, as in the tabernacle
    body: |
      The veil is something Kings does not have. Kings describes the way into the most holy place as a partition: “he made a partition by the chains of gold before the oracle,” and “for the entering of the oracle he made doors of olive tree” ([[1 Kgs. 6:21]]; [[1 Kgs. 6:31]]). It names no curtain. Read beside Kings, this verse is taken to show where the veil hung: from it “we learn that a veil hung in front of the door.”

      Its materials are the tabernacle's. Moses was told, “thou shalt make a veil of blue, and purple, and scarlet, and fine twined linen of cunning work: with cherubims shall it be made” ([[Ex. 26:31]]), and Solomon's veil has the same blue and purple, a red (crimson here, scarlet there), fine linen, and the same woven cherubim. That fits the house as a whole, which “was built after the model of the tabernacle, the dimensions of each part being exactly double.” What the tabernacle's veil did, and how the New Testament reads it, are in the notes at [[Ex. 26:31]] and [[Ex. 26:33]].
    sources: [lds-scriptures, bd-temple-of-solomon]

  - ref: 15
    phrase: two pillars of thirty and five cubits high
    kind: history
    title: Thirty-five cubits, or eighteen
    body: |
      Kings makes each pillar eighteen cubits high (“he cast two pillars of brass, of eighteen cubits high apiece,” [[1 Kgs. 7:15]]), and so do the accounts of their breaking up at the fall of Jerusalem; Chronicles makes them thirty-five. Reckoned by Kings, the pillars and their capitals stood twenty-three cubits high. Verse 4 has a figure of the same kind: a porch a hundred and twenty cubits high in front of a house that Kings makes thirty cubits high. The ancient Greek translation of Chronicles has both figures as the Hebrew does, “thirty-five cubits” for the pillars and “a hundred and twenty cubits” for the porch.

      Numbers were “peculiarly difficult to transmit accurately,” and the parallel passages of Samuel, Kings and Chronicles are where that shows. The general case is explained in the note at [[2 Sam. 24:9]]. For these two figures, one older reading holds that thirty-five arose when two Hebrew letters used as numerals were confused, the pair for eighteen with the pair for thirty-five, and that a front a hundred and twenty cubits high on a house thirty high would have been not a porch but a tower; it leaves open whether the porch was twenty cubits high or thirty. The chapter gives its figures as they stand, and the notes give them as the texts have them.
    sources: [lds-scriptures, bd-temple-of-solomon, lxx-rahlfs, ot-manual-large-numbers, keil-chronicles]

  - ref: 17
    phrase: called the name of that on the right hand Jachin
    kind: words
    title: Stability and Strength
    body: |
      The pillars' names were words with meanings, and the ancient Greek translation of Chronicles shows how they were heard: it does not spell out Jachin and Boaz but translates them, calling the pillar on the right “Stability” and the one on the left “Strength.” Kings gives the same names in the same order ([[1 Kgs. 7:21]]); what the pillars were and what their names meant are explained in the note there.
    sources: [lxx-rahlfs, lds-scriptures]

christ: |
  The house of the LORD went up where the LORD had been seen and where sacrifice had stayed the destroying angel (verse 1). Abraham's offering of Isaac was at a place called Moriah, and Christ and Isaac may have been offered in the same area, “although it is impossible to know for sure.” One Latter-day Saint reading holds that the temple at Moriah was about more than the sacrifices remembered there: it was for the people to know “in what manner to look forward to his Son for redemption” ([[Alma 13:2]]), so that sacrifice itself becomes a way of seeing one's own redemption. The veil that closed the most holy house was made like the tabernacle's, and Hebrews reads that veil as His flesh: “through the veil, that is to say, his flesh” ([[Heb. 10:20]]; see the note at [[Ex. 26:33]]). The Lord's house is still the place where His people learn to look to the Son for redemption.

explore: |
  - **The same building in Kings.** [[1 Kgs. 6:1–38]]; [[1 Kgs. 7:13–22]], with the notes there on the plan, the oracle (the most holy house), the cherubim and the pillars.
  - **How the hill was chosen.** [[2 Sam. 24:15–25]]; [[1 Chr. 21:15–22:1]].
  - **The first Moriah.** [[Gen. 22:1–19]], with the notes there on where Moriah was and on “The LORD will see, and be seen.”
  - **The veil and its meaning.** [[Ex. 26:31–33]]; [[Matt. 27:51]]; [[Heb. 9:1–12]]; [[Heb. 10:19–22]].
  - **The house finished and filled.** [[2 Chr. 4:1–22]]; [[2 Chr. 5:1–14]].

