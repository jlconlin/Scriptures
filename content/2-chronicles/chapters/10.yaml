chapter: 10
title: Israel Rebelled against the House of David
tagline: The tribes ask Solomon's son for a lighter yoke; Rehoboam forsakes the old men's counsel, promises scorpions, and the north goes to its tents and the kingdom is divided.
when: 'At the death of Solomon, when Rehoboam his son came to Shechem to be made king (verse 1; [[2 Chr. 9:31]])'

setting: |
  Solomon has died and his son Rehoboam reigns in his stead ([[2 Chr. 9:31]]). Chapter 10 opens the second part of 2 Chronicles, the division of the kingdom and the history of the kings of Judah, which runs to chapter 35. From here on the book follows Judah and mentions the northern kingdom only where it touches Judah; on one older reading the Chronicler now confines himself to Judah and tells its first kings at much greater length than Kings does.

  The chapter itself is [[1 Kgs. 12:1–19]] told again, with only small differences of form. The site's notes on 1 Kings 12 explain the assembly at Shechem ([[1 Kgs. 12:1]]), the elders' counsel ([[1 Kgs. 12:7]]), the little finger and the scorpions ([[1 Kgs. 12:10]]), the turn of affairs from the LORD ([[1 Kgs. 12:15]]) and the cry against David ([[1 Kgs. 12:16]]), and they are not repeated here. Chronicles stops where Kings' verse 19 stops. It does not tell how the northern tribes then made Jeroboam king over all Israel ([[1 Kgs. 12:20]]), or how he set up calves at Bethel and Dan ([[1 Kgs. 12:28–29]]). The calves come into Chronicles later, and only as Judah meets them: when the Levites he cast off come south ([[2 Chr. 11:14–15]]), and when Abijah names them to Jeroboam's army ([[2 Chr. 13:8]]).

thread: |
  Two things are true at once in this chapter, and verse 15 says both. Rehoboam hears two counsels, takes the harsh one, and answers the people roughly; and “the cause was of God, that the LORD might perform his word” spoken by Ahijah. The text does not set the one against the other. The choice is the king's own, and the chapter says twice that he “forsook the counsel of the old men” (verses 8, 13). The outcome is the LORD's word kept.

  The tribes asked to have Solomon's yoke made lighter, and they were promised scorpions. All Israel went to their tents (verse 16), the officer over the forced labor was stoned (verse 18), and the king fled in his chariot to Jerusalem. The chapter closes on a sentence that outlasts the book: “Israel rebelled against the house of David unto this day” (verse 19). The rest of 2 Chronicles is the story of the part of the kingdom that stayed, and the next chapter opens with the LORD forbidding Rehoboam to fight for the rest, “for this thing is done of me” ([[2 Chr. 11:4]]).

sections:
  - range: 1-5
    heading: The tribes ask for a lighter yoke
    plain: |
      Rehoboam went to Shechem, because all Israel had come there to make him king. Jeroboam son of Nebat was in Egypt, where he had fled from King Solomon, and when he heard of it he came back from Egypt. The people sent for him, and Jeroboam and all Israel came and said to Rehoboam, “Your father made our yoke hard to bear. Now ease the hard service your father demanded and the heavy yoke he put on us, and we will serve you.” He told them, “Come back to me in three days.” And the people went away.
  - range: 6-15
    heading: Two counsels
    plain: |
      King Rehoboam asked the advice of the old men who had served his father Solomon while he lived: “How do you advise me to answer this people?” They said, “If you are kind to this people and please them and speak good words to them, they will be your servants for ever.” But he set aside the old men's advice and consulted the young men who had grown up with him and now served him. He asked them, “What do you advise? How should we answer this people, who have told me, ‘Ease the yoke your father put on us’?” The young men who had grown up with him said, “Tell the people who said to you, ‘Your father made our yoke heavy; make it lighter for us,’ tell them this: ‘My little finger is thicker than my father's waist. My father put a heavy yoke on you; I will add to it. My father disciplined you with whips; I will discipline you with scorpions.’” On the third day Jeroboam and all the people came back to Rehoboam, as the king had told them. The king answered them harshly. He set aside the old men's advice and spoke as the young men had advised: “My father made your yoke heavy, but I will add to it. My father disciplined you with whips; I will discipline you with scorpions.” So the king did not listen to the people, for God had brought it about, so that the LORD would fulfill the word He had spoken through Ahijah of Shiloh to Jeroboam son of Nebat.
  - range: 16-19
    heading: The north goes to its tents
    plain: |
      When all Israel saw that the king would not listen to them, they answered him, “What share do we have in David? We have no inheritance in the son of Jesse. To your tents, Israel! Now look after your own house, David!” So all Israel went home. Only the Israelites who lived in the towns of Judah stayed under Rehoboam's rule. King Rehoboam sent Hadoram, who was over the forced labor, and the Israelites stoned him to death. King Rehoboam hurried to get into his chariot and escape to Jerusalem. So Israel has been in rebellion against the house of David to this day.

notes:
  - ref: 2
    phrase: Jeroboam the son of Nebat, who was in Egypt
    kind: history
    title: Jeroboam, whom Chronicles has not introduced
    body: |
      Chronicles names Jeroboam here without having said who he was. Its account of Solomon never introduces him; his name appears there only once, as the subject of “the visions of Iddo the seer against Jeroboam the son of Nebat,” listed among the records of Solomon's reign ([[2 Chr. 9:29]]). The book appears to assume that its readers know Samuel and Kings, and Kings tells the rest ([[1 Kgs. 11:26–40]]): Solomon made Jeroboam “ruler over all the charge of the house of Joseph” ([[1 Kgs. 11:28]]), the prophet Ahijah promised him ten tribes, and when Solomon sought to kill him he fled to Egypt and stayed there until Solomon died.

      His tribe mattered. Jeroboam was of Ephraim, the tribe that led the revolt against Judah and the family of David, and Ephraim's jealousy of Judah “in great measure brought about the separation of the two kingdoms.” Rehoboam went north to Shechem to be crowned in a vain attempt to satisfy it (see the note at [[1 Kgs. 12:1]]).
    sources: [lds-scriptures, scripture-helps-2-chronicles, bd-jeroboam, bd-ephraim]

  - ref: 7
    phrase: If thou be kind to this people, and please them
    kind: scripture
    title: Kindness where Kings has service
    body: |
      The old men's counsel in Chronicles asks Rehoboam for kindness where Kings asks him to serve. In Kings they say, “If thou wilt be a servant unto this people this day, and wilt serve them” ([[1 Kgs. 12:7]]); here they say, “If thou be kind to this people, and please them.” The rest is the same: speak good words to them, and “they will be thy servants for ever.” One older reading takes the change as a softening, the Chronicler finding the plainer words of Kings too blunt for himself, as they had been for Rehoboam.

      In either wording the counsel asks the king to win the people with goodness before he asks for their service, and Rehoboam set it aside twice (verses 8 and 13). The site's note at [[1 Kgs. 12:7]] sets Kings' wording beside Jesus' teaching on greatness and service ([[Matt. 20:25–28]]).
    sources: [lds-scriptures, cambridge-chronicles]

  - ref: 15
    phrase: for the cause was of God
    kind: history
    title: The word of Ahijah, which Chronicles assumes
    body: |
      Verse 15 points back to a prophecy that Chronicles has not told. Before this verse it names Ahijah the Shilonite only as the author of a record of Solomon's acts, “the prophecy of Ahijah the Shilonite” ([[2 Chr. 9:29]]). The scene itself is in Kings: the prophet tore his new garment into twelve pieces and gave Jeroboam ten, “for thus saith the LORD, the God of Israel, Behold, I will rend the kingdom out of the hand of Solomon, and will give ten tribes to thee” ([[1 Kgs. 11:31]]). Chronicles leaves that story to Kings, as it left Jeroboam's (the note at verse 2).

      Kings also gives the reason for the sentence: “Because that they have forsaken me, and have worshipped Ashtoreth the goddess of the Zidonians” ([[1 Kgs. 11:33]]). So when Chronicles says that “the cause was of God,” the word it points to is the judgment spoken over Solomon's turning, carried out in his son's day. What the Hebrew word behind “cause” means, and how the LORD's purpose and Rehoboam's own folly meet in one event, are explained at [[1 Kgs. 12:15]].
    sources: [lds-scriptures]

  - ref: 18
    phrase: Hadoram that was over the tribute
    kind: history
    title: Hadoram, over the forced labor
    body: |
      Rehoboam answered the revolt by sending the very man who ran the service the tribes had complained of. Hadoram is the officer Kings calls Adoram ([[1 Kgs. 12:18]]), a short form of Adoniram: the officer “over the levy,” who superintended the forced labor used in public works under David, Solomon and Rehoboam. The King James “tribute” is that levy. The Hebrew word, *mas*, is the one used where “Adoniram was over the levy” in Solomon's day ([[1 Kgs. 5:14]]); the note at [[1 Kgs. 5:13]] explains what the levy was and how it became the yoke of verse 4.

      The tribes had asked for relief from “the grievous servitude” of Solomon (verse 4), and the overseer of that servitude was the king's envoy. They stoned him, and Rehoboam fled.
    sources: [bd-adoniram, oshb-wlc, lds-scriptures]

christ: |
  The chapter ends with Israel in rebellion against the house of David “unto this day” (verse 19), but that was not the LORD's last word on it. Through Ezekiel He promised to join Israel and Judah again, “and they shall be no more two nations, neither shall they be divided into two kingdoms any more at all,” under one king: “David my servant shall be king over them; and they all shall have one shepherd” ([[Ezek. 37:22]], [[Ezek. 37:24]]). Ezekiel's joined sticks represent that reunion “into one nation under a single king,” and the “David” Ezekiel names there, as in [[Ezek. 34:23]], is not the king who had died four centuries before but Jesus Christ, the Good Shepherd and David's descendant. The house of David that the tribes left is restored in Him.

  The envy between Judah and Ephraim that helped divide the kingdom is to end “through the operation of the gospel of Jesus Christ.” The same gospel joins disciples now, and the Lord's word to His people is plain: “be one; and if ye are not one ye are not mine” ([[D&C 38:27]]).

explore: |
  - **The same story in Kings.** [[1 Kgs. 12:1–24]], with the site's notes on it, and Ahijah's torn garment, [[1 Kgs. 11:29–39]].
  - **What followed in Judah.** [[2 Chr. 11:1–17]], Shemaiah's word and the Levites and faithful Israelites who came south.
  - **Judah's answer to Jeroboam.** [[2 Chr. 13:4–12]], Abijah's speech on the kingdom given to David.
  - **The two kingdoms made one.** [[Ezek. 37:15–28]].

