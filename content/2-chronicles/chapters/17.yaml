chapter: 17
title: His Heart Was Lifted Up in the Ways of the LORD
tagline: Asa's son Jehoshaphat seeks the LORD, sends princes, Levites and priests through Judah with the book of the law, and the kingdoms around him make no war.
when: 'The first years of Jehoshaphat, after Asa his father died ([[2 Chr. 16:13]]; verse 1); the teachers went out in the third year of his reign (verse 7)'

setting: |
  Jehoshaphat, son of Asa, was the fourth king of Judah. Kings sums up his twenty-five years in a few verses ([[1 Kgs. 22:41–50]]): he began to reign in the fourth year of Ahab king of Israel, “walked in all the ways of Asa his father,” and made peace with the king of Israel. Chronicles gives him four chapters (17–20), and they show a king “in close alliance with kings of Israel, but still a true worshipper of Jehovah and a religious reformer.”

  Chapter 17 is the opening portrait, and almost none of it is in Kings. The teaching mission (verses 7–9), the fear that kept the neighbors at peace (verses 10–13) and the muster of the army (verses 14–19) have no parallel there. The chapter begins where Asa's reign left Judah and Israel facing each other. Baasha of Israel had built Ramah against Asa ([[2 Chr. 16:1]]), and Asa had taken cities in mount Ephraim ([[2 Chr. 15:8]]). His son garrisons those cities and the fenced cities of Judah (verse 2). The next chapter turns from defense to alliance, when Jehoshaphat joins affinity with Ahab ([[2 Chr. 18:1]]). Chapter 19 tells of his judges, and chapter 20 of his prayer at the temple.

thread: |
  The chapter gives the reason for Jehoshaphat's success before it describes the success: “the LORD was with Jehoshaphat, because he walked in the first ways of his father David, and sought not unto Baalim; but sought to the LORD God of his father” (verses 3–4). That is the measure Azariah had set before Asa: “The LORD is with you, while ye be with him; and if ye seek him, he will be found of you” ([[2 Chr. 15:2]]). Everything after it unfolds from that seeking. The kingdom is established, gifts come in, the king's heart is lifted up “in the ways of the LORD,” and the high places come down (verses 5–6). Then, in his third year, the king sends men through every city of Judah with the book of the law (verses 7–9).

  Then the chapter turns outward. One older reading takes the fear of the LORD that fell on the surrounding kingdoms (verse 10) as the fruit of the teaching mission, a blessing on the attempt rather than a lull that happened to leave the king time for it. That reading fits the way Chronicles tells history, in which rewards and punishments “are not usually delayed”; in this chapter the gifts of Philistines and Arabians, the fortresses and store cities, and the great army follow the teaching mission. The next chapter repeats that Jehoshaphat “had riches and honour in abundance” and adds in the same breath that he “joined affinity with Ahab” ([[2 Chr. 18:1]]), the alliance a prophet would rebuke him for ([[2 Chr. 19:2]]).

sections:
  - range: 1-6
    heading: The LORD was with Jehoshaphat
    plain: |
      Jehoshaphat his son became king in Asa's place and made himself strong against Israel. He stationed troops in all the fortified cities of Judah and set garrisons in the land of Judah and in the cities of Ephraim that his father Asa had captured. The LORD was with Jehoshaphat, because he followed the earlier ways of his father David and did not seek the Baals. He sought the God of his father and kept His commandments, and did not follow the practices of Israel. So the LORD made the kingdom secure in his hand. All Judah brought him gifts, and he had great wealth and honor. His heart was encouraged in the ways of the LORD, and he removed the high places and the groves from Judah.
  - range: 7-9
    heading: Teachers in the cities of Judah
    plain: |
      In the third year of his reign he sent his officials, Ben-hail, Obadiah, Zechariah, Nethaneel and Michaiah, to teach in the cities of Judah. With them he sent the Levites Shemaiah, Nethaniah, Zebadiah, Asahel, Shemiramoth, Jehonathan, Adonijah, Tobijah and Tob-adonijah, and the priests Elishama and Jehoram. They taught in Judah with the book of the law of the LORD in their hands; they went around to every city of Judah and taught the people.
  - range: 10-13
    heading: The fear of the LORD on the kingdoms around
    plain: |
      The fear of the LORD fell on all the kingdoms of the lands around Judah, so that they made no war against Jehoshaphat. Some of the Philistines brought him gifts and silver as tribute, and the Arabians brought him flocks: seven thousand seven hundred rams and seven thousand seven hundred male goats. Jehoshaphat grew steadily greater. He built fortresses and store cities in Judah, carried out much work in the cities of Judah, and kept seasoned soldiers in Jerusalem.
  - range: 14-19
    heading: The king's army
    plain: |
      This is how they were numbered by their fathers' houses. From Judah, the commanders of thousands: Adnah the commander, with three hundred thousand valiant men; next to him Jehohanan the commander, with two hundred eighty thousand; and next to him Amasiah son of Zichri, who had volunteered himself for the LORD's service, with two hundred thousand valiant men. From Benjamin: Eliada, a valiant man, with two hundred thousand armed with bow and shield; and next to him Jehozabad, with one hundred eighty thousand equipped for war. These served the king, besides those he had stationed in the fortified cities throughout Judah.

notes:
  - ref: 3
    phrase: the first ways of his father David
    kind: words
    title: Whose first ways?
    body: |
      “First ways” implies later ways that were not as good, and the verse can be read with two different fathers in view. The Hebrew text names David, as the King James does. The Septuagint, the old Greek translation, reads only “the first ways of his father,” without David. On that shorter reading the father is Asa, which matches Kings' summary that Jehoshaphat “walked in all the ways of Asa his father” ([[1 Kgs. 22:43]]). Asa's first ways in Chronicles were good (chapters 14–15); his latter ways, in chapter 16, were not. Hanani rebuked him for relying “on the king of Syria, and not … on the LORD” ([[2 Chr. 16:7]]), and in his last disease “he sought not to the LORD, but to the physicians” ([[2 Chr. 16:12]]).

      An older commentary keeps David and reads the phrase as David's earlier years, before his sin with Bath-sheba and his numbering of the people. Either way the verse holds up a faithful beginning as the pattern the son followed.
    sources: [oshb-wlc, lxx-rahlfs, cambridge-chronicles, keil-chronicles, lds-scriptures]

  - ref: 6
    phrase: his heart was lifted up in the ways of the LORD
    kind: words
    title: A heart lifted up, for once in a good sense
    body: |
      “Lifted up” here means encouraged, not proud, although Chronicles uses the same verb for the pride of two later kings. The Hebrew verb *gāḇah*, “to be high,” is the one behind Uzziah's fall, “his heart was lifted up to his destruction” ([[2 Chr. 26:16]]), and behind Hezekiah's lapse, “his heart was lifted up: therefore there was wrath upon him” ([[2 Chr. 32:25]]). Jehoshaphat's verse stands apart from those as the one use “in a good sense, encouraged in the ways of Yahweh.”

      The difference lies in what the heart rose in. Uzziah's heart was lifted up “when he was strong” ([[2 Chr. 26:16]]), and Hezekiah's when he “rendered not again according to the benefit done unto him” ([[2 Chr. 32:25]]). Jehoshaphat's was lifted up “in the ways of the LORD,” and the verse goes straight on: “moreover he took away the high places and groves out of Judah.” The Church's *Scripture Helps* uses this phrase to describe him as “a righteous man.”
    sources: [bdb, oshb-wlc, scripture-helps-2-chronicles]

  - ref: 6
    phrase: he took away the high places and groves out of Judah
    kind: history
    title: High places taken away, and not taken away
    body: |
      This verse says Jehoshaphat removed the high places, while [[2 Chr. 20:33]] and [[1 Kgs. 22:43]] say that under him “the high places were not taken away.” *Scripture Helps* names the difference and says that “the reason for this apparent discrepancy is not explained.” It offers two possibilities: some high places may have remained “in use for legitimate worship of Jehovah,” or idolatry may have spread and persisted so that the king could not root it out. Chronicles' own later verse gives a reason on the people's side, not the king's: “as yet the people had not prepared their hearts unto the God of their fathers” ([[2 Chr. 20:33]]). That verse's note takes up the question in full; what high places were is explained at [[1 Kgs. 3:2]].
    sources: [scripture-helps-2-chronicles, lds-scriptures]

  - ref: 9
    phrase: had the book of the law of the LORD with them
    kind: history
    title: Teachers sent with the book
    body: |
      Jehoshaphat sent teachers through Judah in his third year, and they carried a book. They were five princes, nine Levites and two priests (verses 7–8), and together they “went about throughout all the cities of Judah, and taught the people.” Two passages frame the mission. One is Moses' blessing of Levi: “They shall teach Jacob thy judgments, and Israel thy law” ([[Deut. 33:10]]); teaching was the Levites' charge from the beginning. The other is Azariah's word to Asa earlier in his reign: “for a long season Israel hath been without the true God, and without a teaching priest, and without law” ([[2 Chr. 15:3]]). Jehoshaphat sent the teaching priests, and the law with them.

      The verse calls it only “the book of the law of the LORD” and says no more about its contents. The Pentateuch, the five books that contain “the Torah or law of Israel,” was written by Moses, though later scribes and copyists left their traces on it, and “latter-day revelation confirms that Moses was the author.” One of the passages that confirm it is Nephi's account of the brass plates, which held “the five books of Moses” ([[1 Ne. 5:11]]), a record kept at Jerusalem in Lehi's day.
    sources: [lds-scriptures, bd-pentateuch]

  - ref: 14
    phrase: these are the numbers of them
    kind: history
    title: An army of 1,160,000
    body: |
      Added together, the chapter's figures are very large. Judah's three commanders lead 300,000, 280,000 and 200,000 men, and Benjamin's two lead 200,000 and 180,000. That makes 780,000 from Judah and 380,000 from Benjamin, 1,160,000 in all, “beside those whom the king put in the fenced cities” (verse 19). In David's census Judah numbered 470,000 men that drew sword ([[1 Chr. 21:5]]).

      One older commentary judged these numbers “clearly too large” beside David's. It also noted that the divisions “appear duly proportioned” to one another, which made it harder for that commentator to believe the totals came from copyists' errors. The site explains one way of reading Chronicles' large figures, through a Hebrew word that could mean a thousand or a unit of armed men, at [[2 Sam. 24:9]]. The chapter gives its numbers as they stand, and so does this note.
    sources: [lds-scriptures, keil-chronicles]

  - ref: 16
    phrase: who willingly offered himself unto the LORD
    kind: words
    title: Amasiah, who volunteered
    body: |
      Of the five commanders, Amasiah is the only one the roll remembers for his devotion. The verb is the reflexive form of *nāḏaḇ*, “to volunteer” or “to offer willingly.” It is used of men who volunteered for war in Deborah's song, “the governors of Israel, that offered themselves willingly among the people” ([[Judg. 5:9]]), and Amasiah stands among volunteers “for service of other kinds,” beside the men “that willingly offered themselves to dwell at Jerusalem” ([[Neh. 11:2]]). The same verb describes David's people bringing freewill offerings for the first temple: “with perfect heart they offered willingly to the LORD” ([[1 Chr. 29:9]]).

      The text says nothing more about what Amasiah offered or when; in a roll of captains and numbers it records only that he gave himself to the LORD of his own will.
    sources: [bdb, oshb-wlc]

christ: |
  The LORD was with Jehoshaphat because he sought Him (verses 3–4), as Azariah had promised: “if ye seek him, he will be found of you” ([[2 Chr. 15:2]]). The LORD who was found is Jehovah, and “Jehovah is the premortal Jesus Christ,” who said to the Nephites, “I am he that gave the law” ([[3 Ne. 15:5]]). The teachers Jehoshaphat sent carried His law into every city of Judah.

  The Lord gives the same work to His people now: “teach one another the doctrine of the kingdom. Teach ye diligently and my grace shall attend you” ([[D&C 88:77–78]]). A disciple who teaches from the scriptures, at home or in a class, does what Jehoshaphat's Levites did, and the Lord promises grace to those who teach diligently.

