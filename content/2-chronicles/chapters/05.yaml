chapter: 5
title: The House Was Filled with a Cloud
tagline: The finished house receives David's treasures and then the ark, carried up from Zion and set under the cherubims' wings. As all the priests and the Levite singers sound together as one, praising the LORD's mercy, a cloud fills the house and the priests cannot stand to minister.
when: 'Solomon''s reign, at the feast of the seventh month, when all the work of the house was finished (verses 1 and 3).'

setting: |
  This chapter brings the ark into the finished house. It tells the same morning as [[1 Kgs. 8:1–11]], and the site's notes there explain what both share: the feast of the seventh month ([[1 Kgs. 8:2]]), the poles of the ark ([[1 Kgs. 8:8]]), the two tables of stone and nothing else in the ark ([[1 Kgs. 8:9]]), and the cloud of the LORD's glory ([[1 Kgs. 8:11]]). David had dedicated silver and gold from his wars ([[1 Chr. 18:11]]), and the Levites kept “the treasures of the dedicated things” ([[1 Chr. 26:26]]); verse 1 brings them into the house.

  What Chronicles adds is the music. Between the priests' coming out of the holy place and the cloud, it describes the part the priests and the Levite singers and musicians took (verses 11–13), a matter Kings passes over entirely. The book was compiled from the prophets' records “along with Samuel and Kings.” It was written for a people with a newly rebuilt temple, and the question it appears to address is “Are we still God's people and does the covenant still stand?”

thread: |
  The chapter moves the ark from a tent to its place, and then the LORD Himself into the house. Everything is ready: the work finished, David's gifts stored, the ark set “under the wings of the cherubims” (verse 7). Then, as Chronicles tells it, the priests of every course and the Levites of all three singing families lift their voices together, “as one,” with a single line of praise, “For he is good; for his mercy endureth for ever” (verse 13), and at that moment the cloud fills the house. The house is said to be filled twice in two verses, once with a cloud and once with “the glory of the LORD” (verses 13–14), and the priests who had just carried the ark in could no longer stand to minister in it. The same glory returns, with fire, when Solomon finishes his prayer ([[2 Chr. 7:1–3]]).

sections:
  - range: 1
    heading: The work finished
    plain: |
      So all the work Solomon did for the house of the LORD was finished. Solomon brought in the things his father David had dedicated, and he put the silver, the gold and all the vessels among the treasuries of the house of God.
  - range: 2-10
    heading: The ark brought to its place
    plain: |
      Then Solomon gathered the elders of Israel, all the heads of the tribes and the chiefs of the families of Israel, to Jerusalem, to bring the ark of the LORD's covenant up from the city of David, which is Zion. All the men of Israel gathered to the king at the feast in the seventh month. When all the elders of Israel had come, the Levites took up the ark. They brought up the ark, the tent of meeting and all the holy vessels that were in the tent; the priests and the Levites carried them. King Solomon and the whole congregation of Israel gathered with him before the ark sacrificed sheep and oxen, so many they could not be counted or recorded.

      The priests brought the ark of the LORD's covenant to its place, into the inner sanctuary of the house, the most holy place, under the wings of the cherubim. The cherubim spread their wings over the place of the ark and covered the ark and its poles from above. They drew out the poles of the ark so that their ends could be seen from in front of the inner sanctuary, though not from outside, and it is there to this day. There was nothing in the ark except the two tablets Moses put in it at Horeb, when the LORD made a covenant with the children of Israel after they came out of Egypt.
  - range: 11-14
    heading: The singers, and the cloud
    plain: |
      Then the priests came out of the holy place. Every priest who was present had sanctified himself, and they did not keep to their divisions that day. The Levite singers, all of them, Asaph, Heman and Jeduthun with their sons and kinsmen, dressed in white linen and holding cymbals, lyres and harps, stood east of the altar, and with them one hundred and twenty priests blowing trumpets.

      The trumpeters and singers joined as one, making a single sound to praise and thank the LORD. When they lifted up their voices with the trumpets, cymbals and other instruments and praised the LORD, saying, “He is good; His mercy endures forever,” the house, the house of the LORD, was filled with a cloud. The priests could not stand to do their service because of the cloud, for the glory of the LORD had filled the house of God.

notes:
  - ref: 4
    phrase: and the Levites took up the ark
    kind: history
    title: Levites or priests?
    body: |
      Chronicles says the Levites took up the ark where Kings says “the priests took up the ark” ([[1 Kgs. 8:3]]), and the two words overlap more than they compete. The priests were themselves of the tribe of Levi, and scripture sometimes speaks of the Levites as distinct from the priests and sometimes joins the two words, “the priests, the Levites”: Israel crossed the Jordan behind “the priests the Levites bearing it” ([[Josh. 3:3]]). Chronicles uses both words in the next three verses: “these did the priests and the Levites bring up” (verse 5), and it was the priests who carried the ark the last steps, “to the oracle of the house, into the most holy place” ([[2 Chr. 5:7]]).

      The word fits what Chronicles has already said. When David brought the ark to Jerusalem he ruled that “None ought to carry the ark of God but the Levites” ([[1 Chr. 15:2]]), and the note there explains the law behind the rule.
    sources: [lds-scriptures, bd-levites]

  - ref: 9
    phrase: And there it is unto this day
    kind: history
    title: “Unto this day,” after the ark was gone
    body: |
      The line appears to have been carried over from Kings into a book written after the ark was gone. Kings reads “there they are unto this day” ([[1 Kgs. 8:8]]), a line written while the temple still stood (the note there), and Chronicles was compiled from older records “along with Samuel and Kings.” On an older reading, the words in Chronicles “are taken over with the loss of one letter (which here makes the difference between singular and plural) from 1 Kings 8:8”: Kings' “they” becomes “it.” The same reading judges that “they are out of place in Chron., for when the Chronicler wrote the ark had long ago disappeared.” That much is certain: the ark “had certainly disappeared before the building of the second temple.” The last time Chronicles mentions it, Josiah orders the Levites to “put the holy ark in the house” ([[2 Chr. 35:3]]), and the house itself was later burned ([[2 Chr. 36:19]]).
    sources: [lds-scriptures, bd-chronicles, bd-ark-of-the-covenant, cambridge-chronicles]

  - ref: 12
    phrase: an hundred and twenty priests sounding with trumpets
    kind: scripture
    title: Trumpets for the priests, songs for the Levites
    body: |
      The music at the dedication was divided as the law and David had divided it: the priests blew the trumpets and the Levites sang and played. The trumpets belonged to the priests from the beginning: “the sons of Aaron, the priests, shall blow with the trumpets; and they shall be to you for an ordinance for ever” ([[Num. 10:8]]), and they were to blow them “in the day of your gladness … over your burnt offerings” as “a memorial before your God” ([[Num. 10:10]]). When the ark came to Jerusalem, David set priests to “blow with the trumpets before the ark of God” ([[1 Chr. 15:24]]) and gave the singing to the Levites (the note at [[1 Chr. 15:16]]). Here both orders stand together at the altar: the priests had sanctified themselves (verse 11), and the Levite singers were dressed in white linen (verse 12), described as “sacred temple robes of white.”

      The arrangement outlived the house. When the foundation of the second temple was laid, the builders “set the priests in their apparel with trumpets, and the Levites the sons of Asaph with cymbals, to praise the LORD, after the ordinance of David king of Israel” ([[Ezra 3:10]]; the note there).
    sources: [lds-scriptures, hopkin-psalms-sung]

  - ref: 13
    phrase: as the trumpeters and singers were as one, to make one sound to be heard in praising and thanking the LORD
    kind: history
    title: The cloud came as they sang
    body: |
      Chronicles alone puts the singing between the priests' coming out and the cloud, so that the cloud comes while the whole choir is praising. Kings has one sentence: “when the priests were come out of the holy place, that the cloud filled the house of the LORD” ([[1 Kgs. 8:10]]). Chronicles sets verses 11–12 between those two moments, and the cloud comes as the trumpeters and singers “were as one, to make one sound”: “then the house was filled with a cloud.”

      The stress falls on their unity. Every priest present had sanctified himself and none kept to his course (verse 11), and the trumpeters and singers made “one sound.” On one Latter-day Saint reading, the passage “points to the music and singing itself as the behavior that directly led to the presence of God entering into the temple.” The text ties the two together in time: the cloud came “then,” when the LORD's people were praising Him with one voice.

      Their words, “For he is good; for his mercy endureth for ever,” are the refrain of Psalm 136 ([[Ps. 136:1]]; the note there follows it). They are said again when fire fell after Solomon's prayer ([[2 Chr. 7:3]]), and in nearly the same words when the second temple's foundation was laid ([[Ezra 3:11]]).
    sources: [lds-scriptures, hopkin-psalms-sung]

christ: |
  The glory that filled the house was the LORD's, Jehovah, who is Jesus Christ: in the Kirtland Temple He came with “the voice of Jehovah” and said, “I am he who liveth, I am he who was slain” ([[D&C 110:3–4]]; the `christ` of [[1 Kgs. 8]] follows that day). In Chronicles His glory came into the house while His priests, sanctified, and His singers, as one, praised His mercy. He has made the same promise of His latter-day houses: where His people “do not suffer any unclean thing to come into it, … my glory shall rest upon it; … and my presence shall be there” ([[D&C 97:15–16]]). For a disciple now, the Lord's presence in His house is promised to a people who keep it undefiled.

