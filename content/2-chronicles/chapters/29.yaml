chapter: 29
title: The Service of the House of the LORD Was Set in Order
tagline: In the first month of his reign Hezekiah opens the doors his father shut; the Levites carry the uncleanness out to the Kidron, the priests make a sin offering for all Israel, the singers take up David's songs, and the people bring their thank offerings with a willing heart.
when: 'The first year of Hezekiah king of Judah, Ahaz''s son: the first month, from the opening of the temple doors to the sixteenth day, when the cleansing was finished (verses 3, 17), and the sacrifices that followed'

setting: |
  Ahaz has died. In his distress he had cut the temple's vessels in pieces, “shut up the doors of the house of the LORD,” and made altars in every corner of Jerusalem ([[2 Chr. 28:24]]). His son Hezekiah begins to reign at twenty-five (verse 1; on the ages Kings gives father and son, see the note at [[2 Kgs. 16:2]]). He was a great religious and political reformer who “suppressed idolatry and reconstituted the temple services,” with the prophet Isaiah beside him.

  Kings tells his reform in a few verses ([[2 Kgs. 18:1–8]]) and spends its pages on Sennacherib's invasion, which the site has explained at 2 Kings 18–19 and Isaiah 36–37. Chronicles reverses the weight. It enlarges on the purification of the temple, the restored worship and a Passover to which the king invited even the remnant of the ten tribes (chapters 29–31), and gives Sennacherib only a summary (chapter 32). Of this chapter Kings has the first two verses ([[2 Kgs. 18:1–3]]) and a summary of the reform; the cleansing and rededication are told only here.

  It opens the book's last movement. Hezekiah's was the first of the two great religious reforms of Judah's later kings, and his son Manasseh undid it ([[2 Chr. 33]]); Josiah's came later ([[2 Chr. 34–35]]).

thread: |
  The chapter is about one word, “sanctify,” and what it takes to get from a shut house to a sanctified one. Hezekiah tells the Levites to sanctify themselves and then the house (verse 5); they sanctify themselves (verse 15), sanctify the house (verse 17), and sanctify the vessels Ahaz had cast away (verse 19). Then the order of the sacrifices carries the people the rest of the way. First a sin offering to make reconciliation and atonement “for all Israel” (verses 21–24); then the burnt offering, with the Levites singing the words of David (verses 27–30); then Hezekiah's “Now ye have consecrated yourselves unto the LORD,” and the people's own thank offerings (verse 31). One older reading sees the covenant of verse 10 made in just this way: by sharing in the consecrating sacrifices the congregation consecrated itself anew to the LORD and renewed its covenant, so that only the sacrificial meal remained to complete it.

  The priests are the exception. They were too few, and the Levites were “more upright in heart to sanctify themselves” (verse 34). The chapter ends with the joy of king and people, and gives the credit away: they rejoiced “that God had prepared the people,” for it had all happened so quickly.

sections:
  - range: 1-2
    heading: Hezekiah reigns
    plain: |
      Hezekiah became king when he was twenty-five years old, and he reigned twenty-nine years in Jerusalem. His mother was Abijah, daughter of Zechariah. He did what was right in the sight of the LORD, just as his ancestor David had done.
  - range: 3-11
    heading: “Sanctify now yourselves”
    plain: |
      In the first month of the first year of his reign, he opened the doors of the house of the LORD and repaired them. He brought in the priests and the Levites, gathered them together in the street on the east side, and said to them: “Listen to me, you Levites. Sanctify yourselves now, and sanctify the house of the LORD, the God of your fathers, and carry the filth out of the holy place. Our fathers were unfaithful. They did what was evil in the eyes of the LORD our God and forsook Him; they turned their faces away from the LORD's dwelling and turned their backs on it. They even shut the doors of the porch, put out the lamps, and stopped burning incense and offering burnt offerings in the holy place to the God of Israel. That is why the LORD's wrath has fallen on Judah and Jerusalem, and He has made them an object of trouble, astonishment and hissing, as you can see with your own eyes. Our fathers have fallen by the sword, and our sons, our daughters and our wives are captives because of it. Now I have it in my heart to make a covenant with the LORD God of Israel, so that His fierce anger may turn away from us. My sons, do not be negligent now, for the LORD has chosen you to stand before Him, to serve Him, to be His ministers and to burn incense.”
  - range: 12-19
    heading: The Levites cleanse the house
    plain: |
      Then the Levites set to work: from the Kohathites, Mahath son of Amasai and Joel son of Azariah; from the Merarites, Kish son of Abdi and Azariah son of Jehalelel; from the Gershonites, Joah son of Zimmah and Eden son of Joah; from the sons of Elizaphan, Shimri and Jeiel; from the sons of Asaph, Zechariah and Mattaniah; from the sons of Heman, Jehiel and Shimei; and from the sons of Jeduthun, Shemaiah and Uzziel. They gathered their brothers, sanctified themselves, and came as the king had commanded, following the words of the LORD, to cleanse the LORD's house. The priests went inside the house of the LORD to cleanse it, and brought out into the court every unclean thing they found in the temple; the Levites took it and carried it out to the Kidron valley. They began the sanctifying on the first day of the first month, and on the eighth day they reached the porch of the LORD. They sanctified the house of the LORD in eight more days, and finished on the sixteenth day of the first month. Then they went in to King Hezekiah and said, “We have cleansed the whole house of the LORD, the altar of burnt offering with all its utensils, and the table of the showbread with all its utensils. And all the utensils that King Ahaz threw out during his reign in his unfaithfulness we have made ready and sanctified; they are there before the altar of the LORD.”
  - range: 20-24
    heading: A sin offering for all Israel
    plain: |
      Then King Hezekiah rose early, gathered the leaders of the city, and went up to the house of the LORD. They brought seven bulls, seven rams, seven lambs and seven male goats as a sin offering for the kingdom, for the sanctuary and for Judah, and the king told the priests, the descendants of Aaron, to offer them on the LORD's altar. So they slaughtered the bulls, and the priests took the blood and sprinkled it on the altar; they did the same with the rams and with the lambs. Then they brought the male goats for the sin offering before the king and the congregation, and laid their hands on them. The priests slaughtered them and made a sin offering with their blood on the altar, to make atonement for all Israel, for the king had commanded that the burnt offering and the sin offering be made for all Israel.
  - range: 25-30
    heading: The song of the LORD
    plain: |
      He stationed the Levites in the house of the LORD with cymbals, harps and lyres, as David had commanded, and Gad the king's seer, and Nathan the prophet; for the commandment came from the LORD through His prophets. The Levites stood with David's instruments, and the priests with the trumpets. Then Hezekiah gave the order to offer the burnt offering on the altar. As the burnt offering began, the song of the LORD began too, with the trumpets and the instruments of David king of Israel. The whole congregation worshipped, the singers sang and the trumpeters sounded, and all this went on until the burnt offering was finished. When the offering was done, the king and everyone with him bowed down and worshipped. King Hezekiah and the leaders told the Levites to praise the LORD with the words of David and of Asaph the seer. They sang praises with gladness, bowed their heads and worshipped.
  - range: 31-36
    heading: Thank offerings from a willing heart
    plain: |
      Then Hezekiah said, “Now you have consecrated yourselves to the LORD. Come near and bring sacrifices and thank offerings to the house of the LORD.” And the congregation brought sacrifices and thank offerings, and all who were willing brought burnt offerings. The congregation brought seventy bulls, a hundred rams and two hundred lambs, all as burnt offerings to the LORD. The animals consecrated as offerings were six hundred cattle and three thousand sheep. But there were too few priests to skin all the burnt offerings, so their brothers the Levites helped them until the work was finished and until the other priests had sanctified themselves, for the Levites had been more upright in heart to sanctify themselves than the priests. There were burnt offerings in abundance, with the fat of the peace offerings and the drink offerings for each burnt offering. So the service of the house of the LORD was restored. And Hezekiah and all the people rejoiced that God had prepared the people, because it had come about so quickly.

notes:
  - ref: 3
    phrase: opened the doors of the house of the LORD, and repaired them
    kind: history
    title: The doors Ahaz shut
    body: |
      Hezekiah's first act undoes his father's last. Ahaz had “shut up the doors of the house of the LORD” and set up his own altars in every corner of Jerusalem ([[2 Chr. 28:24]]); Hezekiah opened them in the first month of his first year. What the shut doors had stopped inside (verse 7) is told in the note at [[2 Chr. 28:24]].

      The repair is part of a story Kings tells from its other end. Kings mentions the doors only when Hezekiah, paying Sennacherib's tribute years later, “cut off the gold from the doors of the temple of the LORD, and from the pillars which Hezekiah king of Judah had overlaid” ([[2 Kgs. 18:16]]). The site's note at [[2 Kgs. 18:14]] tells that side of it.
    sources: [lds-scriptures]

  - ref: 8
    phrase: he hath delivered them to trouble, to astonishment, and to hissing
    kind: scripture
    title: The wrath they could see with their eyes
    body: |
      Hezekiah's speech names a disaster his hearers had lived through, and the previous chapter tells it. Because Ahaz and Judah had forsaken the LORD, the king of Syria carried “a great multitude of them captives” to Damascus, Pekah of Israel killed a hundred and twenty thousand in one day, Israel carried away two hundred thousand women and children, the Edomites took captives, and the Philistines seized the towns of the lowland ([[2 Chr. 28:5–8]], [[2 Chr. 28:17–18]]). Chronicles gives the reason in one line: “the LORD brought Judah low because of Ahaz” ([[2 Chr. 28:19]]). So when Hezekiah says “as ye see with your eyes” and “our sons and our daughters and our wives are in captivity for this” (verse 9), he is pointing at those losses. Of all those captives, only the ones Israel took are said to have been sent home ([[2 Chr. 28:9–15]]).

      His argument runs from the shut house to the wrath. The fathers “turned away their faces from the habitation of the LORD” and shut its doors (verses 6–7); “wherefore” the wrath came (verse 8). His remedy follows the same line backwards: open the house, sanctify it, and make a covenant “that his fierce wrath may turn away from us” (verse 10).
    sources: [lds-scriptures]

  - ref: 17
    phrase: in the sixteenth day of the first month they made an end
    kind: history
    title: Sixteen days, and the Passover missed
    body: |
      The cleansing took sixteen days, so it was still under way on the date set for the Passover. The law set it “In the fourteenth day of the first month at even” ([[Lev. 23:5]]), and the work began on the first day of that month and was not finished until the sixteenth. They reached the porch on the eighth day, and the house itself took eight days more.

      Chronicles' next chapter says why the feast was then kept a month late: “they could not keep it at that time, because the priests had not sanctified themselves sufficiently, neither had the people gathered themselves together to Jerusalem” ([[2 Chr. 30:3]]). The law already allowed a Passover “The fourteenth day of the second month” for one who was unclean or on a far journey ([[Num. 9:10–11]]). Why Hezekiah took that course, and how the LORD answered the unprepared who came, is the note at [[2 Chr. 30:2]].
    sources: [lds-scriptures]

  - ref: 24
    phrase: they made reconciliation with their blood upon the altar
    kind: words
    title: Reconciliation and atonement
    body: |
      “Made reconciliation” translates a verb built on the word for sin, and it means that they made a sin offering with the goats' blood on the altar. The Hebrew is *wayḥaṭṭəʾû*, from *ḥāṭāʾ*, “to sin”; in this form it means to “make a sin-offering,” and also to purify the altar from sin with the sin offering's blood, and this verse belongs under the first sense: “made a sin-offering with their blood on the altar.” The noun at the end of the same verse, “the sin offering” (*ḥaṭṭāʾt*), is the same root. The English “reconciliation” names the result; the Hebrew names the means.

      The next phrase, “to make an atonement for all Israel” (*ləkappēr*), says what the sin offering was for. Under the law of Moses that was its whole idea. Its fundamental idea “was atonement, expiation”: there was a sin, or an uncleanness like one, that “needed atoning for before fellowship with Jehovah could be obtained.” That fits the day. Judah's sin had shut the house, and the sin offering came first; the burnt offering and the songs followed it (verse 27).

      The laying on of hands in verse 23 belongs to the same act. In the Mosaic sacrifices it “dedicated the animal to God and made it the sacrificer's representative and substitute.” Here the king and the congregation laid their hands on the goats, so the substitute stood for them all.
    sources: [oshb-wlc, bdb, bd-sacrifices]

  - ref: 24
    phrase: for the king commanded that the burnt offering and the sin offering should be made for all Israel
    kind: history
    title: For all Israel, not Judah alone
    body: |
      The offering's scope widens by the king's own command. The goats were brought “for the kingdom, and for the sanctuary, and for Judah” (verse 21), but the atonement was made “for all Israel,” and verse 24 names “all Israel” twice, the second time as the king's own command. On one older reading “all Israel” here probably means not only the people of Judah but the twelve tribes, for whom the temple in Jerusalem was the one lawful sanctuary, and the laying on of hands by king and assembly is mentioned for that reason.

      The words had people behind them. Hezekiah reigned in the years when Samaria fell to Assyria ([[2 Kgs. 18:9–10]]), and archaeology shows Jerusalem growing in that century with refugees from the northern kingdom; on one estimate scholars give, more than half the city's population came to be Israelite refugees. The next chapter turns the atonement into an invitation: Hezekiah sent “to all Israel and Judah,” with letters to Ephraim and Manasseh, calling “the remnant of you, that are escaped out of the hand of the kings of Assyria” to keep the Passover at Jerusalem ([[2 Chr. 30:1]], [[2 Chr. 30:6]]).
    sources: [keil-chronicles, pierce-israelite-refugees, lds-scriptures]

  - ref: 27
    phrase: the song of the LORD began also with the trumpets
    kind: scripture
    title: A song timed to the sacrifice
    body: |
      The singing of verses 27–28 is part of the offering itself: it begins when the burnt offering begins and stops when the offering is finished (verses 27–28). The congregation worshipped, the singers sang and the trumpets sounded “until the burnt offering was finished,” and then the king and all with him bowed. The words were not new. Hezekiah had the Levites praise “with the words of David, and of Asaph the seer” (verse 30), on the instruments David had ordained (verse 26).

      Verse 25 says where that order came from: David's commandment, given with Gad and Nathan, “for so was the commandment of the LORD by his prophets.” The site's note at [[1 Chr. 25:6]] gives that verse in full and follows the order to Josiah's day and after the exile. At the temple's dedication the cloud filled the house while the singers praised (the note at [[2 Chr. 5:13]]); here, in a house just cleansed, the same songs return with the sacrifice.
    sources: [lds-scriptures]

  - ref: 31
    phrase: Now ye have consecrated yourselves unto the LORD
    kind: words
    title: “Ye have filled your hand”
    body: |
      “Consecrated yourselves” is literally to have filled one's hand to the LORD (*milleʾtem yedkem laYHWH*), an idiom of consecration: “consecrate (literally fill the hand).” It is the idiom Moses used to the Levites: “Consecrate yourselves to day to the LORD” ([[Ex. 32:29]]). Hezekiah says the same words to the whole congregation, which has just stood by the sin offering and the burnt offering and worshipped.

      What he asks of them next fits the order of the sacrifices. The burnt offering, burned whole, expressed a surrender that was owed to God continually, and the burning on the altar “symbolized the consecration of the worshipper to Jehovah.” Peace offerings came after, presupposing “that the sacrificer was at peace with God,” and their mark was the sacrificial meal, a feast of fellowship and joy. The thank offerings Hezekiah calls for are peace offerings of that kind ([[Lev. 7:11–12]]). The people brought them, and “as many as were of a free heart” brought burnt offerings besides; the footnote gives “free” as “willing, generous.”
    sources: [oshb-wlc, bdb, bd-sacrifices, lds-scriptures]

  - ref: 34
    phrase: the Levites were more upright in heart to sanctify themselves than the priests
    kind: history
    title: Levites more ready than priests
    body: |
      There were too few priests, and the Levites did their work for them until the other priests had sanctified themselves. Skinning the burnt offerings was not a priest's task by nature: the law gave it to the worshipper for his own offering ([[Lev. 1:6]]), and one older reading holds that at a great public sacrifice offered for the congregation it fell to the priests, and that Levites could help because the work was not specifically priestly. What held the priests back the text says plainly: not their number alone, but that the Levites were readier to sanctify themselves.

      Why that was so, the text does not say. The same older reading suggests, with a “perhaps,” that the priests had taken a greater part in Ahaz's idolatrous worship than the Levites, because they stood nearer the king's court and depended on it. The next chapter confirms the slowness from another side: the Passover had to wait because “the priests had not sanctified themselves sufficiently,” and when it came, “the priests and the Levites were ashamed, and sanctified themselves” ([[2 Chr. 30:3]], [[2 Chr. 30:15]]).
    sources: [keil-chronicles, lds-scriptures]

christ: |
  The day turned on blood on the altar, offered “to make an atonement for all Israel” (verse 24). From Adam on, sacrifices were offered “in a similitude of the sacrifice that would be made of the Only Begotten Son of God,” as the angel told Adam: “This thing is a similitude of the sacrifice of the Only Begotten of the Father” ([[Moses 5:7]]). The goats on which Judah's king and people laid their hands stood in their place (the note at verse 24), and like every sacrifice of the law they pointed to Jesus Christ.

  That shedding of blood ended with His death; the sacrament of the bread and water now stands in its place, “in remembrance of the offering of Jesus Christ.” So a disciple at the sacrament remembers the offering that Hezekiah's sin offering only foreshadowed.

