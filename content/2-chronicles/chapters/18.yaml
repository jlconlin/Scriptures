chapter: 18
title: Even What My God Saith, That Will I Speak
tagline: Jehoshaphat, rich and allied by marriage to Ahab, goes up with him to Ramoth-gilead; four hundred prophets promise victory, Micaiah tells what he saw before the LORD's throne, and in the battle Ahab dies while the LORD helps Jehoshaphat.
when: 'In Jehoshaphat''s reign over Judah, “after certain years” (verse 2); Kings sets the visit in the third year of peace with Syria, at the battle where Ahab died ([[1 Kgs. 22:1–2]])'

setting: |
  The chapter before has made Jehoshaphat a king who sought the LORD, and the LORD established his kingdom: “he had riches and honour in abundance” ([[2 Chr. 17:5]]). Chapter 18 repeats those words in its first verse and then tells how he went to war beside Ahab of Israel. Chronicles follows Judah and brings the northern kingdom in only where it touches Judah, and this is one of those places.

  From verse 4 on, the chapter is [[1 Kgs. 22:5–35]] almost word for word, and the site's notes on 1 Kings 22 explain what the two accounts share: the four hundred prophets ([[1 Kgs. 22:7]]), Micaiah's first, mocking answer ([[1 Kgs. 22:15]]), the council of the LORD he saw ([[1 Kgs. 22:19]]), and Ahab's disguise ([[1 Kgs. 22:30]]). Chronicles changes the two ends. It opens with Jehoshaphat's wealth, his marriage alliance and Ahab's feast, where Kings has a date, “in the third year,” that depends on Ahab's earlier wars. And it stops at sundown with Ahab's death. The army's flight, the burial in Samaria and the dogs licking his blood “according unto the word of the LORD” ([[1 Kgs. 22:36–38]]) belong to Ahab's story, and on one older reading they did not fit the Chronicler's plan. Between the two ends, among smaller differences of wording, Chronicles adds a clause at verse 31 that names the LORD.

thread: |
  Kings tells this as the end of Ahab. Chronicles tells it as an episode in the life of Jehoshaphat, and the frame shows it. The chapter opens with a king who had every blessing joining himself to Ahab's house (verse 1) and being talked into Ahab's war (verse 2). It closes, in the next chapter, with the seer Jehu meeting him on his way home: “Shouldest thou help the ungodly, and love them that hate the LORD?” ([[2 Chr. 19:2]]). The rebuke was for the alliance with a king who, with Jezebel, had spread the worship of Baal and Asherah.

  In the middle stands Micaiah. Jehoshaphat is the one who asks for the word of the LORD (verse 4) and for a prophet of the LORD besides the four hundred (verse 6). Micaiah, pressed by the messenger to agree with the rest, swears to speak only what his God says (verse 13), mocks the kings with the answer they want (verse 14), and then gives his real answer, Israel scattered like sheep without a shepherd (verse 16). Jehoshaphat hears it, and goes up anyway (verse 28). What saves him is not his own counsel but the LORD, when he cries out (verse 31). Ahab, who had ordered Micaiah held until he should “return in peace” (verse 26), dies at sundown, as Micaiah said.

sections:
  - range: 1-3
    heading: Jehoshaphat joins Ahab
    plain: |
      Jehoshaphat had great wealth and honor, and he made a marriage alliance with Ahab. Some years later he went down to visit Ahab in Samaria. Ahab slaughtered many sheep and oxen for him and for the people with him, and urged him to go up with him against Ramoth-gilead. Ahab king of Israel asked Jehoshaphat king of Judah, “Will you go with me to Ramoth-gilead?” He answered, “I am as you are, and my people as your people; we will be with you in the war.”
  - range: 4-11
    heading: Four hundred prophets say, Go up
    plain: |
      Jehoshaphat said to the king of Israel, “Please ask for the word of the LORD today.” So the king of Israel gathered the prophets, four hundred men, and asked them, “Shall we go to war against Ramoth-gilead, or shall I hold back?” They said, “Go up, for God will give it into the king's hand.” But Jehoshaphat asked, “Is there no other prophet of the LORD here whom we can ask?” The king of Israel answered, “There is still one man through whom we can ask the LORD, but I hate him, because he never prophesies good about me, but always evil. He is Micaiah the son of Imla.” Jehoshaphat said, “The king should not say that.” So the king of Israel called an officer and said, “Bring Micaiah the son of Imla quickly.”

      The king of Israel and Jehoshaphat king of Judah sat each on his throne, in their royal robes, in an open place at the entrance of the gate of Samaria, and all the prophets were prophesying before them. Zedekiah the son of Chenaanah had made himself horns of iron, and said, “This is what the LORD says: With these you will gore the Syrians until they are destroyed.” All the prophets said the same: “Go up to Ramoth-gilead and succeed, for the LORD will give it into the king's hand.”
  - range: 12-27
    heading: Micaiah's word
    plain: |
      The messenger who went to call Micaiah told him, “The prophets are all speaking good to the king with one voice. Please let your word be like theirs, and speak good.” Micaiah said, “As the LORD lives, whatever my God says, that is what I will speak.” When he came to the king, the king asked him, “Micaiah, shall we go to war against Ramoth-gilead, or shall I hold back?” He said, “Go up and succeed; they will be given into your hand.” The king said to him, “How many times must I put you under oath to tell me nothing but the truth in the name of the LORD?” Then Micaiah said, “I saw all Israel scattered on the mountains like sheep without a shepherd, and the LORD said, ‘These have no master. Let each of them go home in peace.’” The king of Israel said to Jehoshaphat, “Didn't I tell you he would prophesy nothing good about me, only evil?”

      Micaiah went on: “Then hear the word of the LORD. I saw the LORD sitting on His throne, with all the host of heaven standing on His right and on His left. The LORD said, ‘Who will persuade Ahab king of Israel to go up and fall at Ramoth-gilead?’ One said one thing and another said another. Then a spirit came forward, stood before the LORD, and said, ‘I will persuade him.’ The LORD asked, ‘How?’ He said, ‘I will go out and be a lying spirit in the mouth of all his prophets.’ The LORD said, ‘You will persuade him, and you will succeed. Go and do it.’ So now the LORD has put a lying spirit in the mouth of these prophets of yours, and the LORD has decreed disaster against you.”

      Then Zedekiah the son of Chenaanah came up, struck Micaiah on the cheek, and said, “Which way did the Spirit of the LORD go from me to speak to you?” Micaiah answered, “You will see, on the day you go into an inner room to hide.” The king of Israel said, “Take Micaiah back to Amon the governor of the city and to Joash the king's son, and say, ‘This is what the king says: Put this man in prison and give him nothing but scant bread and water until I come back safely.’” Micaiah said, “If you ever come back safely, the LORD has not spoken by me.” And he added, “Listen, all you people!”
  - range: 28-34
    heading: The LORD helped him
    plain: |
      So the king of Israel and Jehoshaphat king of Judah went up to Ramoth-gilead. The king of Israel said to Jehoshaphat, “I will disguise myself and go into battle, but you wear your robes.” So the king of Israel disguised himself, and they went into battle. The king of Syria had ordered his chariot commanders, “Do not fight with anyone, small or great, except the king of Israel.” When the chariot commanders saw Jehoshaphat, they said, “That is the king of Israel,” and they surrounded him to attack. But Jehoshaphat cried out, and the LORD helped him; God drew them away from him. When the commanders saw that he was not the king of Israel, they stopped chasing him. Then a man drew his bow without aiming at anyone and struck the king of Israel between the joints of his armor. The king said to his chariot driver, “Turn around and take me out of the battle, for I am wounded.” The battle grew fierce that day, and the king of Israel held himself up in his chariot facing the Syrians until evening; and about sunset he died.

notes:
  - ref: 1
    phrase: joined affinity with Ahab
    kind: history
    title: Riches, honour and a marriage alliance with Ahab
    body: |
      Chronicles opens the story by setting Jehoshaphat's blessings beside his alliance, and on one older reading the order is the point. “Riches and honour in abundance” repeats [[2 Chr. 17:5]], where they were the LORD's gift to a king who sought Him. To “join affinity” is to make an alliance by marriage: Jehoshaphat's son Jehoram “had the daughter of Ahab to wife” ([[2 Chr. 21:6]]), and the site's note at [[1 Kgs. 22:4]] tells the alliance as Kings has it. On one older reckoning the marriage was made some nine years before this visit, so verse 1 sums up a bond already in place rather than one agreed at the feast.

      The same reading takes the second mention of the riches as a hint: a king who already had wealth and power had no need of a bond with the idolatrous house of Ahab, so the Chronicler must have regarded the marriage as a mistake. The text bears out the cost. Jehoram “walked in the way of the kings of Israel, like as did the house of Ahab” ([[2 Chr. 21:6]]); Athaliah, the mother of his son Ahaziah, was that son's “counsellor to do wickedly” in “the ways of the house of Ahab” ([[2 Chr. 22:3]]), and after his death she “destroyed all the seed royal of the house of Judah” ([[2 Chr. 22:10]]).

      Verse 2 tells the visit as Ahab's work of persuasion. He killed sheep and oxen in abundance, which implies a feast, and then “persuaded him.” Jehoshaphat's answer in verse 3 goes further than his words in Kings: where Kings has “my horses as thy horses,” Chronicles has “we will be with thee in the war,” a definite promise.
    sources: [lds-scriptures, keil-chronicles, cambridge-chronicles]

  - ref: 21
    phrase: be a lying spirit in the mouth of all his prophets
    kind: scripture
    title: What Joseph Smith changed in the vision
    body: |
      Joseph Smith revised Micaiah's vision here in Chronicles, and his three changes make the lying spirit the prophets' and not the LORD's. Most of Joseph Smith's changes in 2 Chronicles are small; these three are significant, and they change what the story teaches about the LORD.

      - **Verse 20.** The spirit that comes out is named a lying spirit from the start, and it stands “before them,” not before the LORD: “Then there came out a lying spirit, and stood before them.”
      - **Verse 21.** The LORD's word to it ends with a reason: “go out, and do even so; for all these have sinned against me.”
      - **Verse 22.** “The LORD hath put a lying spirit” becomes “the Lord hath found a lying spirit in the mouth of these thy prophets.” The Gospel Library prints this verse with the heading, “The Lord does not put a lying spirit into the mouths of prophets.”

      Read together, the changes say that the lie was found among prophets who had sinned, not put into them by the LORD: He “does not send out spirits to tell lies, but does allow them to go forth among those who have sinned against him.” The question is answered at Kings, where the same words stand unrevised; the site's note at [[1 Kgs. 22:22]] gives the rest.
    sources: [nyman-jst-historical, lds-scriptures, scripture-helps-2-chronicles]

  - ref: 31
    phrase: the LORD helped him; and God moved them to depart from him
    kind: history
    title: The LORD helped him
    body: |
      Chronicles names the LORD as the one who rescued Jehoshaphat. Kings says only that “Jehoshaphat cried out” ([[1 Kgs. 22:32]]); Chronicles adds that “the LORD helped him; and God moved them to depart from him.” The added clause leaves the battle as Kings tells it, since the next verse still gives the captains' own reason for turning back, that they saw he was not the king of Israel (verse 32). What it adds is the cause behind the turning: the king of Judah cried out, and the LORD answered.

      The two kings' ends then bear out Micaiah's word. Jehoshaphat “returned to his house in peace to Jerusalem” ([[2 Chr. 19:1]]). Ahab, who had ordered Micaiah held “until I return in peace” (verse 26), died at sundown; Micaiah had staked his word on it: “If thou certainly return in peace, then hath not the LORD spoken by me” (verse 27). The help did not excuse the alliance, for the seer met Jehoshaphat on his way home with the LORD's wrath ([[2 Chr. 19:2]]).
    sources: [lds-scriptures]

christ: |
  Micaiah saw Israel “scattered upon the mountains, as sheep that have no shepherd” (verse 16). The Topical Guide lists his words under “Shepherd” with the multitudes Jesus saw as sheep without a shepherd and with His word that He is the good shepherd ([[Matt. 9:36]]; [[John 10:11]]); the connection is the Topical Guide's, and the site's chapter on [[1 Kgs. 22]] follows it in its closing section. The flock Ahab left without a master has a Shepherd in Christ.

  Micaiah stood against four hundred voices and the king's displeasure and spoke only what his God said (verse 13). The chapter teaches that a disciple can defend the truth even when it is unpopular, and Jehoshaphat's cry shows that the Lord still hears one who has walked into trouble by his own choices.

explore: |
  - **The same story in Kings.** [[1 Kgs. 22:1–40]], with the site's notes on the four hundred prophets, Micaiah's vision and Ahab's death.
  - **The prophet's rebuke.** [[2 Chr. 19:1–3]], Jehu's word to Jehoshaphat on his return.
  - **The alliance again.** [[2 Chr. 20:35–37]], Jehoshaphat's ships with Ahaziah king of Israel, and Eliezer's word on them.
  - **What the marriage brought.** [[2 Chr. 21:4–7]] and [[2 Chr. 22:10–12]].

