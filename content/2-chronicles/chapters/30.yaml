chapter: 30
title: The Good LORD Pardon Every One
tagline: Hezekiah sends letters through all Israel to keep the Passover at Jerusalem in the second month; most of the north mocks, some humble themselves and come, the king prays for those who eat unclean, and the LORD heals the people.
when: 'In the reign of Hezekiah king of Judah, after he had reopened and cleansed the house of the LORD ([[2 Chr. 29]]); the Passover is kept in the second month of a year the chapter does not name (the note at verse 6)'

setting: |
  Hezekiah's father Ahaz had shut the doors of the house of the LORD and made himself altars “in every corner of Jerusalem” ([[2 Chr. 28:24]]). In the first month of his first year Hezekiah opened the doors again, and the priests and Levites cleansed the house ([[2 Chr. 29:3]], [[2 Chr. 29:17]]). This chapter is the next step: a Passover for the whole nation, and an invitation to the north to share it. Kings sums up Hezekiah's reform in a few verses, that he “removed the high places” and broke the brasen serpent ([[2 Kgs. 18:1–8]]), and does not tell this Passover at all.

  The invitation went north at a time of ruin. Assyria took Samaria in Hezekiah's sixth year ([[2 Kgs. 18:9–10]]), and the letter speaks to a “remnant” that had escaped the kings of Assyria (verse 6). The chapter's questions are all about the Passover: why it mattered, why it came a month late, and why the unclean were allowed to eat. The book's last division, chapters 29–36, takes its title from verse 9, “If ye return unto him.”

thread: |
  The chapter is a call to return, and an account of what the LORD did for those who answered it. Hezekiah's letter plays on one Hebrew verb, *šûb*, turn and return: if Israel turns to the LORD, He will return to them (verses 6 and 9; the note at verse 9). It is the promise the LORD made to Solomon, to hear a people who “turn from their wicked ways” ([[2 Chr. 7:14]]; the note there). Most of the north laughed at the runners who carried the letter. Some “humbled themselves, and came” (verse 11), and humbling oneself is the first thing that promise asks.

  Those who came were not ready, and the law had to bend twice for them. The Passover was moved to the second month because the priests were not sanctified and the people had not yet gathered at Jerusalem (verses 2–3). Then many ate it unclean, “otherwise than it was written” (verse 18). Hezekiah did not send them away. He prayed for every one who had prepared his heart to seek God, and the LORD heard him and healed the people (verses 18–20). What followed was the fullest joy Jerusalem had known since Solomon: a feast kept seven days, then seven days more, and a blessing whose prayer reached the LORD's dwelling place in heaven.

sections:
  - range: 1-5
    heading: The king decides on a Passover for all Israel
    plain: |
      Hezekiah sent word to all Israel and Judah, and wrote letters to Ephraim and Manasseh as well, inviting them to come to the LORD's house at Jerusalem and keep the Passover to the LORD, the God of Israel. The king, his princes and the whole assembly in Jerusalem had agreed to keep it in the second month. They could not keep it at the usual time, because not enough priests had sanctified themselves, and the people had not gathered in Jerusalem. The plan pleased the king and the assembly. So they decided to send a proclamation through all Israel, from Beer-sheba to Dan, calling the people to come to Jerusalem and keep the Passover to the LORD God of Israel, for they had not kept it for a long time as it was written.
  - range: 6-12
    heading: The letters, the mockers and the humble
    plain: |
      Runners went through all Israel and Judah with letters from the king and his princes, and with the king's own message: “People of Israel, turn back to the LORD, the God of Abraham, Isaac and Israel, and He will turn back to those of you who are left, who escaped from the kings of Assyria. Don't be like your fathers and your brothers, who were unfaithful to the LORD, the God of their fathers, so that He made them a ruin, as you can see. Don't be stubborn as your fathers were. Give your hand to the LORD, come to His sanctuary, which He has made holy for ever, and serve the LORD your God, so that His fierce anger may turn away from you. If you turn back to the LORD, your brothers and your children will find mercy from those who took them captive, and will come back to this land. The LORD your God is gracious and merciful, and He will not turn His face away from you if you return to Him.”

      The runners went from city to city through Ephraim and Manasseh as far as Zebulun, but the people laughed at them and mocked them. Still, some men of Asher, Manasseh and Zebulun humbled themselves and came to Jerusalem. In Judah, too, God's hand was at work to give the people one heart to do what the king and the princes had commanded at the LORD's word.
  - range: 13-20
    heading: The Passover kept, and the unclean pardoned
    plain: |
      A great crowd gathered at Jerusalem in the second month to keep the feast of unleavened bread, a very large assembly. First they removed the altars in Jerusalem, and all the incense altars, and threw them into the Kidron valley. They killed the Passover lambs on the fourteenth day of the second month. The priests and Levites were ashamed, sanctified themselves, and brought burnt offerings into the LORD's house. They took their places as the law of Moses the man of God directed, and the priests sprinkled the blood the Levites handed them. Many in the assembly were not sanctified, so the Levites took charge of killing the Passover lambs for everyone who was not clean, to make them holy to the LORD.

      A great number of the people, many from Ephraim, Manasseh, Issachar and Zebulun, had not purified themselves, and yet they ate the Passover contrary to what was written. But Hezekiah prayed for them: “May the good LORD pardon everyone who sets his heart to seek God, the LORD God of his fathers, even if he is not purified as the sanctuary requires.” The LORD listened to Hezekiah and healed the people.
  - range: 21-27
    heading: Fourteen days of joy
    plain: |
      The Israelites who were in Jerusalem kept the feast of unleavened bread for seven days with great gladness, and the Levites and priests praised the LORD day after day, singing to Him with loud instruments. Hezekiah spoke encouragingly to all the Levites who taught the good knowledge of the LORD. For the seven days of the feast the people ate the festival meals, offered peace offerings and made confession to the LORD, the God of their fathers.

      Then the whole assembly agreed to keep the feast another seven days, and they did, with gladness. Hezekiah king of Judah had given the assembly a thousand bulls and seven thousand sheep, and the princes another thousand bulls and ten thousand sheep, and many more priests had sanctified themselves. All the assembly of Judah rejoiced, with the priests and the Levites, those who had come from Israel, and the foreigners who had come from the land of Israel or lived in Judah. There was great joy in Jerusalem; nothing like it had happened there since the days of Solomon son of David, king of Israel. Then the priests and Levites stood and blessed the people. Their voice was heard, and their prayer came up to His holy dwelling place in heaven.

notes:
  - ref: 1
    phrase: wrote letters also to Ephraim and Manasseh
    kind: history
    title: Letters to the northern tribes
    body: |
      Hezekiah invited the people of the northern kingdom to worship at Jerusalem, the first call of all Israel to one Passover since the kingdom was divided (the note at verse 26). Hezekiah reigned in Judah when Assyria conquered the north ([[2 Kgs. 18:9–12]]), so the letters went to people who had lost, or were losing, their own kingdom.

      The letters were addressed to Ephraim and Manasseh, but the runners went “even unto Zebulun” (verse 10), and those who came were from Asher, Manasseh and Zebulun (verse 11) and from Issachar (verse 18). The Passover was part of a wider effort to unite Israelites and Judahites by gathering worship at one center in Jerusalem. Hezekiah also tore down the shrines and altars elsewhere ([[2 Chr. 31:1]]), and at the feast northern Israelites, Judahites and foreigners living among them kept the Passover side by side (verse 25).

      Some northerners did more than visit. Archaeology shows Jerusalem's population surging late in the eighth century before Christ, and refugees from the north are thought to account for much of that growth, though how much is still debated. Lehi's family may belong to this movement: he was of Manasseh ([[Alma 10:3]]) yet “dwelt at Jerusalem in all his days,” and he probably descended from Manassite refugees who fled south when Assyria destroyed Israel. That is a reading of the evidence, not a statement of the text. Chronicles tells of earlier northerners who came to Judah at [[2 Chr. 11:13–17]] and [[2 Chr. 15:9]].
    sources: [scripture-helps-2-chronicles, pierce-israelite-refugees, sc-knowhy-708, lds-scriptures]

  - ref: 2
    phrase: to keep the passover in the second month
    kind: scripture
    title: A Passover a month late
    body: |
      The law of Moses itself allowed the late date. A man who was “unclean by reason of a dead body, or be in a journey afar off” was still to keep the Passover, on “The fourteenth day of the second month” ([[Num. 9:10–11]]; the note on [[Num. 9:11]] treats this second Passover). Verse 3 gives two reasons, and they match the law's two exceptions: the priests had not sanctified themselves, and the people had not yet gathered to Jerusalem. Hezekiah appears to have stretched both exceptions, meant for individuals, to cover the priests who needed time to purify themselves and the northern tribes who needed time to travel.

      The change was not the king's decision alone. He “had taken counsel, and his princes, and all the congregation” (verse 2), and “the thing pleased the king and all the congregation” (verse 4). One reading sets this beside Uzziah, who went into the temple to burn incense on his own authority ([[2 Chr. 26:16]]), and finds the difference between the two kings to be “one of disposition rather than perfectly orthodox action”: Hezekiah knew the exceptions he was making and made them “with humble consultation and prayer.”
    sources: [lds-scriptures, scripture-helps-2-chronicles, davis-bended-rules]

  - ref: 6
    phrase: the remnant of you, that are escaped out of the hand of the kings of Assyria
    kind: history
    title: Before or after Samaria fell
    body: |
      Chronicles does not say in which year this Passover was kept, and careful readers have dated it in two ways. The text sets it right after the cleansing of the temple, which began in the first month of Hezekiah's first year and ended on the sixteenth day of that month ([[2 Chr. 29:3]], [[2 Chr. 29:17]]). The shortage of sanctified priests in verse 3 recalls the shortage in [[2 Chr. 29:34]]. Kings says that Samaria was besieged in Hezekiah's fourth year and taken in his sixth ([[2 Kgs. 18:9–10]]).

      One older reading takes the Passover to be in the first year, while the northern kingdom still stood, and thinks it likely that Hezekiah ventured, in Israel's fallen state, what earlier kings of Judah would not have dared. Another older reading holds that it cannot have been the first year. On that view, a summons “from Beer-sheba even to Dan” could not be carried out and answered in the three weeks left before the second month, and Hezekiah could not have invited the subjects of a foreign king while Assyria occupied their land. So the feast came after Samaria fell, when he could treat the remnant of the ten tribes as his own people. The “kings of Assyria” of this verse would then be Tiglath-pileser and Shalmaneser, who had carried the northern Israelites away. The text leaves the year open, and so does this note.
    sources: [lds-scriptures, cambridge-chronicles, keil-chronicles]

  - ref: 8
    phrase: yield yourselves unto the LORD
    kind: words
    title: Give the hand to the LORD
    body: |
      “Yield yourselves” is literally *give the hand* (*tᵉnû yād*), a Hebrew gesture of submission and pledge. Here it means “submit to” the LORD; the fuller form of the phrase is the princes who “submitted themselves unto Solomon” ([[1 Chr. 29:24]]), that is, they acknowledged him as their lord. Giving the hand could also seal a promise: Jehu's “give me thine hand” to Jehonadab ([[2 Kgs. 10:15]]), and the men of Ezra's day who “gave their hands” to an oath ([[Ezra 10:19]]).

      In this verse the gesture stands against the stiff neck of the fathers: the people are to give their hand to the LORD, as the princes did to Solomon, and come to His sanctuary.
    sources: [oshb-wlc, bdb, lds-scriptures]

  - ref: 9
    phrase: for the LORD your God is gracious and merciful
    kind: scripture
    title: Turn, and He will return
    body: |
      The letter's promise rests on the LORD's own character. Its key verb is *šûb*, *turn, return*, and the letter uses it for both parties: Israel is to “turn again,” and the LORD “will return to the remnant” (verse 6); “if ye turn again” the captives will “come again,” and the LORD will not turn away His face “if ye return unto him” (verse 9). The LORD set the same order when He answered Solomon: if His people “turn from their wicked ways; then will I hear from heaven” ([[2 Chr. 7:14]]).

      The reason given is that the LORD is “gracious and merciful.” The words go back to His proclamation of His name to Moses, “merciful and gracious” ([[Ex. 34:6]]); here the two words stand in the reversed order of later scripture. In Hezekiah's letter that name is the reason given that the “brethren” and “children” Assyria had carried off could still “come again into this land.”
    sources: [oshb-wlc, bdb, lds-scriptures]

  - ref: 11
    phrase: humbled themselves
    kind: scripture
    title: Some humbled themselves
    body: |
      The few northerners who came did what the LORD had asked of His people at the dedication of the temple. “Humbled themselves” is the same word as the first condition of [[2 Chr. 7:14]], “If my people … shall humble themselves.” Chronicles uses the same word when other kings turn back, or refuse to: Rehoboam and his princes ([[2 Chr. 12:6–7]]), Hezekiah after his pride ([[2 Chr. 32:26]]), Manasseh in his captivity ([[2 Chr. 33:12]]), Josiah ([[2 Chr. 34:27]]), and Zedekiah, who “humbled not himself” ([[2 Chr. 36:12]]).

      Here it falls between two responses to the same letter. Most of the north “laughed them to scorn, and mocked them” (verse 10). Some from Asher, Manasseh and Zebulun humbled themselves, and humbling themselves meant making the journey to Jerusalem.
    sources: [oshb-wlc, lds-scriptures]

  - ref: 18
    phrase: The good LORD pardon every one
    kind: christ
    title: Pardon for those who came unprepared
    body: |
      Hezekiah asked the LORD to accept worshipers who were ritually unclean, and he based the request on the state of their hearts. Many of the northerners had traveled great distances and had no time for the required purifications, and they ate the Passover “otherwise than it was written.” The Levites had already done what they could, killing the lambs for everyone who was not clean (verse 17). Hezekiah did not turn them away. He prayed for “every one That prepareth his heart to seek God … though he be not cleansed according to the purification of the sanctuary” (verses 18–19), and the LORD answered (verse 20).

      The phrase “prepareth his heart to seek God” is one of Chronicles' measures of a person (the note at [[2 Chr. 12:14]]). The reading given at verse 2 applies here too. Hezekiah and his people were turning a nation back from idolatry, and the allowances they asked for served that return; Uzziah's breach of the temple's order served his own pride. The pardon rested on what the people were seeking, not on whether every rule had been kept.
    sources: [scripture-helps-2-chronicles, davis-bended-rules, lds-scriptures]

  - ref: 20
    phrase: healed the people
    kind: words
    title: The LORD healed the people
    body: |
      Verse 18 calls the people unclean, not sick, so the word “healed” needs explaining. A Latter-day Saint reading takes it as more than ritual: years of estrangement from true worship had left spiritual wounds, most of them known only to God, and in the word “healed” the Chronicler signals that more was set right than the outward preparation. The LORD met a deeper need than ritual purity.

      Older readings divide. One takes the word as prevention. The law warned that Israel must be kept from uncleanness “that they die not in their uncleanness, when they defile my tabernacle” ([[Lev. 15:31]]), and on this view the LORD allowed no plague to break out. The other rejects that view and takes sin as a sickness of the soul, so that healing means forgiveness, as in the psalmist's “heal my soul; for I have sinned” ([[Ps. 41:4]]) and the LORD's “I will heal your backslidings” ([[Jer. 3:22]]).
    sources: [davis-bended-rules, cambridge-chronicles, keil-chronicles, lds-scriptures]

  - ref: 26
    phrase: since the time of Solomon the son of David king of Israel there was not the like in Jerusalem
    kind: history
    title: Nothing like it since Solomon
    body: |
      The comparison with Solomon looks back past the division of the kingdom. Because the two kingdoms had been divided for about two centuries, the Israelites had not kept a united Passover since Solomon's day. One older reading adds that the only feast this one could be compared with was the dedication of the temple. That feast also lasted twice the usual time, “the dedication of the altar seven days, and the feast seven days” ([[2 Chr. 7:9]]), and it too was marked by a wealth of sacrifices, a vast crowd and great joy.

      Hezekiah's feast became fourteen days by the people's own choice (verse 23), once the king's and princes' gifts of cattle (verse 24) made more than enough for a second week. The reading of verse 2 and verse 18 notices this as well: the first two departures from the law came from necessity, and this third came from gratitude.
    sources: [scripture-helps-2-chronicles, keil-chronicles, davis-bended-rules, lds-scriptures]

christ: |
  Hezekiah's prayer for the unclean was heard by Jehovah, the premortal Jesus Christ, who “healed the people.” He received worshipers who arrived late and unclean because they came seeking Him, and He did not turn away His face from those who returned ([[2 Chr. 30:9]]; [[2 Chr. 30:18–20]]). A disciple who comes to Him not yet ready in many outward ways, with a heart set on seeking Him, comes to the same gracious and merciful Lord, and His healing reaches past the outward to the deeper need of the heart.

explore: |
  - **The cleansing that came first.** [[2 Chr. 29]], where the Levites prove “more upright in heart” than the priests.
  - **The law of the second Passover.** [[Num. 9:1–14]].
  - **The next great Passover.** Josiah's, at [[2 Chr. 35:1–19]] and [[2 Kgs. 23:21–23]].
  - **The feasts of the law.** [The Law and the Covenant](/old-testament/guides/law-and-covenant/#feasts).

