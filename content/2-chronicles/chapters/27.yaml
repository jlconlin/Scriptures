chapter: 27
title: He Prepared His Ways
tagline: Jotham does all that his father Uzziah did except go into the temple, builds and subdues Ammon, and grows mighty because he ordered his ways before the LORD, though the people still do corruptly.
when: 'The sixteen years of Jotham king of Judah, Uzziah''s son, who had governed the people while his father was a leper'

setting: |
  Uzziah has died a leper, cut off from the house of the LORD, and his son Jotham, who had governed the people for him in those years ([[2 Chr. 26:21]]), now reigns in his own right. The Bible Dictionary dates his reign 758–742 B.C. How his sixteen years fit Kings' “twentieth year of Jotham” is taken up in the note at [[2 Kgs. 15:30]], and this chapter does not try again.

  Kings tells the reign in seven verses ([[2 Kgs. 15:32–38]]): Jotham did right, the high places stayed, he built the higher gate of the house of the LORD, and in his days the LORD began to send Rezin of Syria and Pekah of Israel against Judah. Chronicles keeps the verdict and the gate, says nothing of the attacks from Syria and Israel until the reign of Ahaz, when the LORD delivers him “into the hand of the king of Syria” and “into the hand of the king of Israel” ([[2 Chr. 28:5]]), and adds the rest: the wall of Ophel, cities and towers in the hill country, a war with Ammon, and the reason Jotham grew strong.

  These are also the years of the writing prophets. Isaiah, Hosea and Micah each date their words by Jotham among other kings ([[Isa. 1:1]]; [[Hos. 1:1]]; [[Micah 1:1]]). The chapter is short, and it stands between a father who ended in pride and a son who “walked in the ways of the kings of Israel” ([[2 Chr. 28:2]]).

thread: |
  Chronicles tells Jotham's reign as his father's story without its ending. Uzziah “strengthened himself exceedingly” ([[2 Chr. 26:8]]), but “when he was strong, his heart was lifted up to his destruction,” and he went into the temple to burn incense ([[2 Chr. 26:16]]); his successes led to “a prideful heart and an overreach of his authority.” Jotham does all that his father did except that one thing: “he entered not into the temple of the LORD” (verse 2). He builds as his father built (verses 3–4; [[2 Chr. 26:9–10]]), he subdues a people who had brought his father gifts (verse 5), and he too becomes mighty. This time the verse gives the reason: “because he prepared his ways before the LORD his God” (verse 6). One older reading joins the two verses: Jotham walked steadfastly before the LORD and did not infringe on the rights of the priesthood, as Uzziah had.

  One line darkens the picture: “the people did yet corruptly” (verse 2). The king kept his own ways in order; the nation did not keep pace with him, and Kings says that in his days the LORD had already begun to send Rezin of Syria and Pekah of Israel against Judah ([[2 Kgs. 15:37]]).

sections:
  - range: 1-2
    heading: A good king who stayed out of the temple
    plain: |
      Jotham was twenty-five years old when he became king, and he reigned sixteen years in Jerusalem. His mother was Jerushah, the daughter of Zadok. He did what was right in the LORD's sight, just as his father Uzziah had done, except that he did not go into the temple of the LORD. But the people still acted corruptly.
  - range: 3-6
    heading: Building, victory and strength
    plain: |
      He built the upper gate of the LORD's house, and did much building on the wall of Ophel. He also built cities in the hill country of Judah, and forts and towers in the wooded areas. He fought the king of the Ammonites and defeated the Ammonites, and that year they paid him a hundred talents of silver, ten thousand measures of wheat and ten thousand of barley. They paid him the same in the second year and in the third. So Jotham grew strong, because he kept his ways in order before the LORD his God.
  - range: 7-9
    heading: The close of Jotham's reign
    plain: |
      The rest of Jotham's acts, all his wars and his ways, are written in the book of the kings of Israel and Judah. He was twenty-five when he became king, and he reigned sixteen years in Jerusalem. Jotham died and was buried in the city of David, and his son Ahaz became king in his place.

notes:
  - ref: 2
    phrase: howbeit he entered not into the temple of the LORD. And the people did yet corruptly
    kind: history
    title: Two limits on a good reign
    body: |
      Chronicles follows Jotham's verdict with two limits where Kings has one. Kings has a single “howbeit”: the high places were not removed, and the people still sacrificed and burned incense on them ([[2 Kgs. 15:35]]). Chronicles turns its “howbeit” toward Jotham's father. Jotham did according to all that Uzziah did, except that he did not go into the temple of the LORD. That is what Uzziah had done: he went in to burn incense on the altar and came out a leper ([[2 Chr. 26:16–21]]), and Chronicles tells both with the same Hebrew verb and the same phrase, “into the temple of the LORD” ([[2 Chr. 27:2]]). So the exception is to Jotham's credit: he followed his father in everything but the trespass. On one older reading the remark is missing from Kings simply because Kings never tells of Uzziah's going into the temple. Why burning incense belonged to the priests is explained at [[2 Chr. 26:18]].

      The second limit belongs to the people. “The people did yet corruptly” stands where Kings names the high places. On the same older reading it refers to that worship and hints also at the moral corruption that the prophets of the time rebuke. An older reading of Isaiah places his picture of a land “full of silver and gold,” full of horses and chariots, and also “full of idols” ([[Isa. 2:7–8]]) in the prosperity that revived under Uzziah “and was sustained through Jotham's reign of sixteen years.” The king's record and the people's are not the same, and Chronicles says so in one line.
    sources: [lds-scriptures, oshb-wlc, keil-chronicles, delitzsch]

  - ref: 5
    phrase: He fought also with the king of the Ammonites, and prevailed against them
    kind: history
    title: Ammon brought under tribute
    body: |
      Jotham's one recorded war was against the Ammonites, an old neighbor that Chronicles has met twice already. The Ammonites, descended from Lot, lived east of Gilead; David subdued them, but they regained their independence after his death and stayed “bitter enemies of Israel” until Assyria and Babylon overran them. In Chronicles they came with Moab against Jehoshaphat ([[2 Chr. 20:1]]) and brought gifts to Uzziah ([[2 Chr. 26:8]]). Jotham defeated them, and they paid him a hundred talents of silver and ten thousand measures each of wheat and barley, that year and again in the second and the third.
    sources: [bd-ammon, lds-scriptures]

  - ref: 6
    phrase: because he prepared his ways before the LORD his God
    kind: words
    title: He ordered his ways
    body: |
      Verse 6 is the chapter's verdict on Jotham, and its verb is the one Chronicles uses for the set of a life toward God. “Prepared” renders *hēkîn*, from *kûn*, which in its moral sense means to direct one's steps, to order them aright; the footnote's “ordered,” a steady course, is the same idea. Elsewhere in Chronicles the same verb is used for preparing the heart. Rehoboam “did evil, because he prepared not his heart to seek the LORD” ([[2 Chr. 12:14]]); Jehoshaphat had “prepared thine heart to seek God” ([[2 Chr. 19:3]]); the high places remained because “the people had not prepared their hearts” ([[2 Chr. 20:33]]); and Hezekiah prayed for everyone “that prepareth his heart to seek God” ([[2 Chr. 30:19]]). With Jotham the verb falls on his ways, the course of his conduct, and the verse joins it to his strength with a “because.”

      That joining is how Chronicles tells a reign: Jotham's strength comes within his own reign, and its cause is named in the same sentence (on the book's timing of reward and punishment, see the note on [[2 Chr. 36:14]]).
    sources: [oshb-wlc, bdb, lds-scriptures]

christ: |
  Jotham ordered his ways “before the LORD his God” (verse 6), and the LORD of the Old Testament is Jehovah, “the premortal Jesus Christ.” Jotham did not do the one thing that undid his father, an overreach of authority when he went into the temple to burn incense (verse 2; [[2 Chr. 26:16]]); and the verse names the cause of Jotham's strength: “because he prepared his ways before the LORD his God.”

  The psalmist's prayer, “O that my ways were directed to keep thy statutes!” ([[Ps. 119:5]]), uses the same Hebrew root in the same moral sense. A disciple's ways are ordered before Christ in that same steady, daily course; in Jotham's verse the strength follows that order, not the reach for authority that undid Uzziah.

