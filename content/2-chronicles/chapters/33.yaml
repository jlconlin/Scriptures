chapter: 33
title: He Humbled Himself Greatly
tagline: Manasseh rebuilds what Hezekiah tore down and sets his idol in the LORD's house; carried in chains to Babylon, he humbles himself and prays, and the LORD hears him and brings him home; his son Amon does not humble himself, and is killed in his own house.
when: 'The fifty-five years of Manasseh king of Judah, Hezekiah''s son, with his captivity in Babylon and his return (verses 11–13), and the two years of his son Amon'

setting: |
  Hezekiah has died, and his twelve-year-old son Manasseh reigns fifty-five years in Jerusalem (verse 1). He reversed his father's reform, and the next one waited for his grandson Josiah ([[2 Chr. 34–35]]). He reigned as a vassal of Assyria, whose kings Esarhaddon and Ashurbanipal both name him in their records.

  Kings tells the same reign ([[2 Kgs. 21:1–26]]) almost entirely as a list of sins and a sentence of judgment. Chronicles keeps the list (verses 1–9) and Amon's two years (verses 21–25). In place of the prophets' sentence and the innocent blood Manasseh shed ([[2 Kgs. 21:10–16]]) it tells what Kings does not: a captivity, a prayer, a return and a reform (verses 11–17). Unlike Kings, it shows Manasseh repenting before his death. The site's notes on 2 Kings 21 explain the high places, the host of heaven, the forbidden arts and the house where the LORD put His name ([[2 Kgs. 21:3]], [[2 Kgs. 21:6]], [[2 Kgs. 21:7]]), and are not repeated here.

thread: |
  The chapter turns on one verb. Manasseh “humbled himself greatly” (verse 12); verse 19 dates everything he built to the time “before he was humbled”; and verse 23 measures his son by it: Amon “humbled not himself before the LORD, as Manasseh his father had humbled himself.” It is the verb of the promise the LORD gave Solomon, “If my people … shall humble themselves, and pray” ([[2 Chr. 7:14]]), and Manasseh's story follows that promise step by step. He humbled himself, he prayed, and the LORD “heard his supplication” (verse 13).

  Nothing in the first nine verses prepares for it. Manasseh rebuilds what Hezekiah tore down, sets his idol in the house where the LORD put His name, and leads Judah “to do worse than the heathen” (verse 9). The LORD speaks and is not heard (verse 10). Then He brings the Assyrians, and in chains the king does what the warnings had not moved him to do. What follows is real and limited: the idols go out of the temple and the LORD's altar is rebuilt, but the people still sacrifice on the high places (verse 17). The son who did not share his father's turn takes up his father's images, and the chapter ends with a murder in the palace and a boy made king.

sections:
  - range: 1-9
    heading: Hezekiah's work undone
    plain: |
      Manasseh was twelve years old when he became king, and he reigned fifty-five years in Jerusalem. He did evil in the LORD's sight, following the detestable practices of the nations the LORD had driven out before Israel. He rebuilt the high places his father Hezekiah had torn down, set up altars to the Baals, made Asherah poles, and bowed down to all the stars of heaven and served them. He built altars in the LORD's house, of which the LORD had said, “My name shall be in Jerusalem forever,” and in both courts of the LORD's house he built altars to all the host of heaven. He made his children pass through the fire in the valley of the son of Hinnom. He practiced soothsaying, enchantments and witchcraft, and dealt with spiritualists and wizards. He did great evil in the LORD's sight and provoked Him to anger. He set the carved idol he had made in the house of God, the house of which God had said to David and to his son Solomon, “In this house, and in Jerusalem, which I have chosen out of all the tribes of Israel, I will put my name forever. I will not again remove Israel from the land I appointed for your fathers, if only they will be careful to do all I have commanded them: the whole law, the statutes and the ordinances given through Moses.” So Manasseh led Judah and the people of Jerusalem astray, until they did worse than the nations the LORD had destroyed before Israel.
  - range: 10-13
    heading: Captive in Babylon, heard by the LORD
    plain: |
      The LORD spoke to Manasseh and to his people, but they would not listen. So the LORD brought against them the commanders of the army of the king of Assyria. They took Manasseh with hooks, bound him in fetters and carried him to Babylon. In his affliction he pleaded with the LORD his God and humbled himself deeply before the God of his fathers. He prayed to Him, and the LORD let Himself be moved by his plea, heard his supplication and brought him back to Jerusalem to his kingdom. Then Manasseh knew that the LORD is God.
  - range: 14-17
    heading: The wall and the altar
    plain: |
      After this he built an outer wall for the city of David, west of Gihon in the valley, as far as the entrance at the Fish Gate; he carried it around Ophel and made it very high. He put army commanders in all the fortified cities of Judah. He took the foreign gods and the idol out of the LORD's house, and all the altars he had built on the temple mount and in Jerusalem, and threw them out of the city. He rebuilt the LORD's altar and offered peace offerings and thank offerings on it, and commanded Judah to serve the LORD, the God of Israel. Still, the people kept sacrificing at the high places, though only to the LORD their God.
  - range: 18-20
    heading: Written among the seers
    plain: |
      The rest of Manasseh's acts, his prayer to his God, and the words of the seers who spoke to him in the name of the LORD, the God of Israel, are written in the book of the kings of Israel. His prayer and how God was moved by his plea, all his sin and unfaithfulness, and the places where he built high places and set up Asherah poles and carved images before he humbled himself, are written among the sayings of the seers. Manasseh died and was buried in his own house, and his son Amon became king in his place.
  - range: 21-25
    heading: Amon, who did not humble himself
    plain: |
      Amon was twenty-two years old when he became king, and he reigned two years in Jerusalem. He did evil in the LORD's sight, as his father Manasseh had done: he sacrificed to all the carved images Manasseh had made, and served them. He did not humble himself before the LORD as his father Manasseh had humbled himself; instead Amon became more and more guilty. His servants conspired against him and killed him in his own house. But the people of the land killed all who had conspired against King Amon, and made his son Josiah king in his place.

notes:
  - ref: 6
    phrase: in the valley of the son of Hinnom
    kind: history
    title: The valley of the son of Hinnom
    body: |
      Chronicles names the place where Manasseh's children passed through the fire, a valley with a dark history before him and after. Kings says only that “he made his son pass through the fire” ([[2 Kgs. 21:6]]); Chronicles has his children, and the valley. It lay south and west of Jerusalem and was the scene of the idolatrous worship of the fire-god Moloch. Ahaz had already “burnt his children in the fire” there ([[2 Chr. 28:3]]), and Jeremiah says plainly what was done in it: they built the high places of Tophet in that valley “to burn their sons and their daughters in the fire; which I commanded them not, neither came it into my heart” ([[Jer. 7:31]]).

      Josiah defiled Topheth so that no one could use it again ([[2 Kgs. 23:10]]), and the valley became a place of refuse. By New Testament times it was called Gehenna, and the Jews took it as a symbol of the place of torment. The site's notes at [[Jer. 19:5]] and [[Jer. 19:6]] say more of Molech and of Tophet.
    sources: [bd-hinnom-valley-of, lds-scriptures]

  - ref: 11
    phrase: took Manasseh among the thorns
    kind: history
    title: Taken with hooks to Babylon
    body: |
      Chronicles alone tells of Manasseh's captivity, and it says he was taken “with hooks” rather than “among the thorns.” The Hebrew *baḥōḥîm* comes from a word that can mean either a thorn or a hook, and here it is better read “with hooks,” as the Church's footnote has it. Assyrian kings sometimes thrust a hook into the nostrils of their captives and led them about, a practice shown on Assyrian reliefs. The LORD had used the same picture of Assyria's own king in Hezekiah's day: “I will put my hook in thy nose, and my bridle in thy lips” ([[2 Kgs. 19:28]]).

      Babylon is a surprise, since Nineveh was Assyria's capital. Older commentators answered that Ashurbanipal at times lived in Babylon, so an important prisoner could have been brought to him there. Assyria's own records name Manasseh as a vassal. No Assyrian inscription known to those commentators told of his captivity, but they pointed to a great revolt against Ashurbanipal in which the west, and perhaps Manasseh, was caught up, and to Neco I of Egypt, who was put in fetters and afterwards sent back to Egypt, as a captive king restored. Chronicles gives the cause in a word: the LORD spoke to Manasseh and his people, “but they would not hearken. Wherefore the LORD brought upon them the captains of the host of the king of Assyria” (verses 10–11).
    sources: [oshb-wlc, cambridge-chronicles, tolley-imprisonment, lds-scriptures]

  - ref: 12
    phrase: humbled himself greatly before the God of his fathers
    kind: scripture
    title: Heard when he humbled himself
    body: |
      Manasseh's return is the promise of [[2 Chr. 7:14]] kept. The LORD had told Solomon, “If my people … shall humble themselves, and pray, … then will I hear from heaven.” In his affliction Manasseh “humbled himself greatly,” with the same Hebrew verb, *kānaʿ*, and “prayed unto him” (verse 13). The LORD did what He had said: He “was entreated of him, and heard his supplication.” The same verb marks other turns in Chronicles (the note at [[2 Chr. 30:11]]).

      What the LORD gave him, the text names. He brought Manasseh back to Jerusalem into his kingdom, “Then Manasseh knew that the LORD he was God.” It says nothing more about what became of his sins; verse 19 lists “all his sin, and his trespass” among the things the seers recorded, all from the time “before he was humbled.”

      Kings tells none of this. The site's note at [[2 Kgs. 21:17]] gives two older readings of why, and the note at [[2 Kgs. 21:11]] why Kings still lays Judah's fall at Manasseh's door: read in the light of Chronicles, it is possible that he created conditions in Judah that those after him could not overcome.
    sources: [oshb-wlc, lds-scriptures, sc-knowhy-861]

  - ref: 17
    phrase: yet unto the LORD their God only
    kind: history
    title: A reform that stopped at the high places
    body: |
      Manasseh's reform reached the temple, and the text marks its limits in the same breath. Back on his throne he raised Jerusalem's walls, following his father Hezekiah's example ([[2 Chr. 32:5]]). He took the foreign gods and the idol out of the LORD's house, cast the altars he had built out of the city, rebuilt the LORD's altar, offered peace and thank offerings, and commanded Judah to serve the LORD (verses 14–16). The people went on sacrificing on the high places, though now to the LORD alone. Why worship of the LORD at the high places was still a fault is explained at [[1 Kgs. 3:2]] and [[2 Chr. 20:33]].

      The text also says the altars were cast out of the city, not that they were destroyed. It was Josiah who beat down “the altars which Manasseh had made in the two courts of the house of the LORD” ([[2 Kgs. 23:12]]), and in the meantime Amon sacrificed to “all the carved images which Manasseh his father had made” (verse 22). On one older reading, the reform restored the LORD's worship in the temple without rooting idolatry out of Judah, still less out of the people's hearts, and so under Amon it came back in full.
    sources: [seely-woods-jerusalem-destroyed, lds-scriptures, keil-chronicles]

  - ref: 19
    phrase: they are written among the sayings of the seers
    kind: scripture
    title: A prayer that was not kept
    body: |
      Manasseh's prayer was written down, and the record is lost. Chronicles names two places it stood: “the book of the kings of Israel” (verse 18) and “the sayings of the seers,” one of the books the Bible mentions as authentic and valuable that are not in it today. The word rendered “the seers,” *ḥôzāy*, can also be read as a proper name, Hozai, so the record may have carried the name of a single seer.

      The Apocrypha has a Prayer of Manasses, but it is a penitential prayer built up mostly of phrases from the canonical scriptures, and “there is little reason for giving it the title that it bears.” Of the Apocrypha as a whole the Lord said that “there are many things contained therein that are true” and “many things contained therein that are not true, which are interpolations by the hands of men” ([[D&C 91:1–2]]). What Manasseh said in Babylon is not known; that he prayed, and was heard, is what Chronicles keeps.
    sources: [bd-lost-books, oshb-wlc, bd-apocrypha, lds-scriptures]

  - ref: 23
    phrase: humbled not himself before the LORD, as Manasseh his father had humbled himself
    kind: scripture
    title: The son who did not humble himself
    body: |
      Chronicles judges Amon by his father's turn as well as by his father's sins. Kings says that Amon “walked in all the way that his father walked in, and served the idols that his father served” ([[2 Kgs. 21:21]]). Chronicles adds this verse, and its measure is the verb of verse 12: Manasseh had humbled himself, and Amon did not. He sacrificed to the carved images his father had made (verse 22), and he “trespassed more and more.”

      His reign lasted two years and ended when his servants killed him in his own house. The site's note at [[2 Kgs. 21:24]] tells of the people of the land who avenged him and crowned his eight-year-old son Josiah ([[2 Chr. 34:1]]). The same words, “humbled not himself,” fall later on the last king of Judah ([[2 Chr. 36:12]]).
    sources: [lds-scriptures, oshb-wlc]

christ: |
  The LORD who heard Manasseh in Babylon is Jehovah, the premortal Jesus Christ. Chronicles shows Him keeping His word to Solomon for the worst of Judah's kings. When Manasseh humbled himself and prayed, He “heard his supplication, and brought him again to Jerusalem” (verse 13), as He had promised: “then will I hear from heaven” ([[2 Chr. 7:14]]). The text says no more of what that meant for Manasseh than that he came home and “knew that the LORD he was God.”

  It was affliction that humbled him, and humility that comes that way can still open the way back. Alma told people whom poverty had humbled that “a man sometimes, if he is compelled to be humble, seeketh repentance; and now surely, whosoever repenteth shall find mercy” ([[Alma 32:13]]). The Lord who heard a king in chains hears a disciple who turns to Him from whatever low place trouble has brought him to.

explore: |
  - **The same reign in Kings.** [[2 Kgs. 21:1–26]], with the site's notes on Manasseh's sins, the prophets' sentence and the repentance Kings leaves out.
  - **The promise Manasseh's prayer reached.** [[2 Chr. 7:12–16]], and others who humbled themselves: [[2 Chr. 12:5–12]]; [[2 Chr. 32:24–26]]; [[2 Chr. 34:26–28]].
  - **The grandson's reform.** [[2 Chr. 34:1–7]], where Josiah breaks down the high places, groves and images.

