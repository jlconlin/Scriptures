chapter: 6
title: Arise into Thy Resting Place
tagline: Solomon blesses the congregation, then kneels on a bronze platform before all Israel and prays that whenever the people pray toward the house, the LORD will hear from heaven and forgive; he ends by calling on the LORD to arise into His resting place and to remember the mercies of David.
when: 'At the dedication of the temple, at the feast of the seventh month ([[2 Chr. 5:3]])'

setting: |
  Chapter 5 brought the ark into the most holy place, and while the singers praised the LORD, the cloud of the LORD's glory filled the house, “so that the priests could not stand to minister by reason of the cloud” ([[2 Chr. 5:14]]). Chapter 6 gives what Solomon said next: a word to the LORD about the cloud, a blessing on the congregation, and the dedicatory prayer. Kings tells the same speech and prayer ([[1 Kgs. 8:12–50]]), and Chronicles reproduces them with only small changes in wording. In one place it is fuller: at verses 5–6 Solomon recalls that the LORD chose Jerusalem as well as David, words the Hebrew of Kings lacks and the ancient Greek translation of Kings has; on one older reading Chronicles here gives Solomon's words more fully, and Kings has left them out. Two things are Chronicles' own: the bronze platform on which Solomon knelt (verse 13), and an ending drawn from Psalm 132 in place of the close of the prayer in Kings (verses 40–42).

  The site's notes on 1 Kings 8 explain the prayer itself: the thick darkness ([[1 Kgs. 8:12]]), the house heaven cannot contain ([[1 Kgs. 8:27]]), praying toward the house ([[1 Kgs. 8:29]]), the stranger ([[1 Kgs. 8:41]]), the captives ([[1 Kgs. 8:47]]), and the Kirtland Temple's prayer ([[1 Kgs. 8:23]]). The notes here go to what Chronicles changes, for readers asking, it appears, whether they were still God's people and the covenant still stood.

thread: |
  Solomon begins with promises kept. The LORD “hath with his hands fulfilled that which he spake with his mouth” (verse 4); Solomon sits on David's throne and has built the house (verse 10); and he asks, “let thy word be verified” (verse 17). Then comes the question the house raises, whether God will dwell with men on the earth when the heaven of heavens cannot contain Him (verse 18), and the answer that shapes everything after it: the house is the place toward which Israel will pray, and heaven is where the LORD will hear. Case after case follows, an oath, defeat in battle, drought, plague, the stranger, war, captivity, and each closes with the same request, that the LORD hear from heaven, most often joined to “forgive.”

  Chronicles ends the prayer its own way. Solomon asks once more that the LORD's eyes be open and His ears “attent unto the prayer that is made in this place” (verse 40), and then calls on Him to arise into His resting place with the ark (verse 41). The next chapter answers both. Fire falls and the glory fills the house as soon as the prayer ends ([[2 Chr. 7:1]]), and when the LORD appears to Solomon by night He takes up Solomon's own words: “Now mine eyes shall be open, and mine ears attent unto the prayer that is made in this place” ([[2 Chr. 7:15]]).

sections:
  - range: 1-11
    heading: Solomon blesses the congregation
    plain: |
      Then Solomon said, “The LORD has said that He would dwell in the thick darkness. But I have built You a house to live in, a place for You to dwell in for ever.”

      The king turned around and blessed the whole assembly of Israel while they all stood. He said: “Blessed be the LORD God of Israel, who spoke with His own mouth to David my father and has fulfilled it with His own hands. He said, ‘Since the day I brought My people out of Egypt I have chosen no city among all the tribes of Israel in which to build a house for My name to be there, and I chose no man to be ruler over My people Israel. But now I have chosen Jerusalem, for My name to be there, and I have chosen David to be over My people Israel.’ It was in the heart of my father David to build a house for the name of the LORD God of Israel. But the LORD said to him, ‘You did well to have it in your heart to build a house for My name. Yet you will not build it; your son, who will come from your own body, will build the house for My name.’ The LORD has kept His word: I have risen up in my father David's place and sit on Israel's throne, as the LORD promised, and I have built the house for the name of the LORD God of Israel. There I have put the ark, which holds the covenant the LORD made with the people of Israel.”
  - range: 12-21
    heading: Will God dwell with men on the earth?
    plain: |
      Solomon stood before the altar of the LORD in front of the whole assembly of Israel and spread out his hands. He had made a bronze platform, five cubits long, five cubits wide and three cubits high, and set it in the middle of the court; he stood on it, then knelt down in front of the whole assembly of Israel, spread out his hands toward heaven, and said:

      “LORD God of Israel, there is no God like You in heaven or on earth, who keeps covenant and shows mercy to Your servants who walk before You with all their heart. You have kept what You promised Your servant David my father; what You said with Your mouth You have fulfilled with Your hand this day. So now, LORD God of Israel, keep also what You promised him when You said, ‘You will never lack a man in My sight to sit on Israel's throne, if only your children watch their way and walk in My law as you have walked before Me.’ Now, LORD God of Israel, let the word You spoke to Your servant David be confirmed.

      “But will God really dwell with men on the earth? Heaven, even the highest heaven, cannot contain You; how much less this house that I have built! Yet turn to the prayer and plea of Your servant, O LORD my God, and listen to the cry and the prayer Your servant prays before You. Keep Your eyes open toward this house day and night, toward the place where You said You would put Your name, so that You will hear the prayer Your servant prays toward this place. Hear the pleas of Your servant and of Your people Israel when they pray toward this place. Hear from Your dwelling place in heaven, and when You hear, forgive.
  - range: 22-39
    heading: Hear thou from heaven
    plain: |
      “If someone wrongs his neighbor and is made to swear an oath, and he comes and swears before Your altar in this house, then hear from heaven and act. Judge Your servants: repay the guilty by bringing his conduct down on his own head, and clear the innocent by rewarding him as his innocence deserves.

      “If Your people Israel are defeated by an enemy because they have sinned against You, and they turn back, confess Your name, and pray and plead before You in this house, then hear from heaven, forgive the sin of Your people Israel, and bring them back to the land You gave to them and their fathers.

      “When the heavens are shut and there is no rain because they have sinned against You, and they pray toward this place, confess Your name and turn from their sin because You have afflicted them, then hear from heaven and forgive the sin of Your servants, Your people Israel. Teach them the good way they should walk in, and send rain on Your land, which You gave Your people as an inheritance.

      “If there is famine in the land, or plague, blight or mildew, locusts or caterpillars; if enemies besiege them in the cities of their land; whatever affliction or sickness there is, then whatever prayer or plea is made by any one person or by all Your people Israel, each knowing his own affliction and his own grief and spreading out his hands toward this house, hear from heaven Your dwelling place and forgive. Give to each one according to all his ways, since You know his heart (for You alone know the hearts of all people), so that they will fear You and walk in Your ways all the days they live in the land You gave our fathers.

      “And the foreigner who is not of Your people Israel but has come from a distant country for the sake of Your great name, Your strong hand and Your outstretched arm: when they come and pray toward this house, hear from heaven Your dwelling place and do all that the foreigner asks of You, so that all the peoples of the earth may know Your name and fear You as Your people Israel do, and may know that this house I have built is called by Your name.

      “When Your people go out to battle against their enemies, wherever You send them, and they pray to You toward this city You have chosen and the house I have built for Your name, then hear their prayer and plea from heaven and uphold their cause.

      “When they sin against You (for there is no one who does not sin), and You are angry with them and give them over to their enemies, who carry them captive to a land far or near, yet if they take it to heart in the land where they are captives, and turn back, and plead with You there, saying, ‘We have sinned, we have done wrong, we have acted wickedly’; if they return to You with all their heart and all their soul in the land of their captivity, and pray toward their land, which You gave their fathers, toward the city You have chosen and the house I have built for Your name, then hear their prayer and their pleas from heaven Your dwelling place, uphold their cause, and forgive Your people who have sinned against You.
  - range: 40-42
    heading: Arise, O LORD God
    plain: |
      “Now, my God, may Your eyes be open and Your ears attentive to the prayer made in this place. And now arise, O LORD God, and come to Your resting place, You and the ark of Your strength. Let Your priests, O LORD God, be clothed with salvation, and let Your faithful ones rejoice in Your goodness. O LORD God, do not turn away the face of Your anointed; remember the mercies of David Your servant.”

notes:
  - ref: 13
    phrase: For Solomon had made a brasen scaffold
    kind: history
    title: A bronze stand shaped like a basin
    body: |
      Only Chronicles says where Solomon was while he prayed: on a bronze platform in the middle of the court, on which he knelt before the whole congregation. Kings has him stand before the altar and spread his hands toward heaven ([[1 Kgs. 8:22]]), and at the end rise “from kneeling on his knees” ([[1 Kgs. 8:54]]), without saying when he knelt. Chronicles fills in the scene. He stood on the platform, knelt on it, and spread his hands toward heaven, and the verse says it was done “before all the congregation of Israel.” What the posture and a king's praying at the altar meant is the note at [[1 Kgs. 8:22]].

      “Scaffold” is the King James word for *kiyyôr*, which everywhere else in this book means a basin: it is the word for the ten lavers Solomon set, five on the right hand and five on the left, “to wash in them” ([[2 Chr. 4:6]]; also [[2 Chr. 4:14]]). Here it names something to stand on, and the standard Hebrew lexicon reads it as a stage of bronze, “probably round, bowl-like in shape,” five cubits square and three high. Kings does not mention it, and Chronicles gives no reason for it beyond the picture it leaves: the king on his knees before all Israel.
    sources: [lds-scriptures, bdb, oshb-wlc]

  - ref: 41
    phrase: arise, O LORD God, into thy resting place, thou, and the ark of thy strength
    kind: scripture
    title: The prayer ends with Psalm 132
    body: |
      Chronicles closes Solomon's prayer with the words of a psalm about the ark, where Kings closes it with the Exodus. In Kings the last petitions rest on what the LORD did through Moses: Israel is His inheritance, which He brought “out of Egypt, from the midst of the furnace of iron” ([[1 Kgs. 8:51]]), set apart “as thou spakest by the hand of Moses thy servant” ([[1 Kgs. 8:53]]). Chronicles has none of this. After asking once more that the LORD's eyes and ears be open (verse 40), Solomon calls on Him in the words of [[Ps. 132:8–10]], a psalm long understood as commemorating David's finding the ark and bringing it to Jerusalem: “Arise, O LORD, into thy rest; thou, and the ark of thy strength” ([[Ps. 132:8]]).

      The psalm fits the day it is put into Solomon's mouth. David had wanted “to build an house of rest for the ark of the covenant of the LORD” ([[1 Chr. 28:2]]), and the ark has just been set in its place ([[2 Chr. 5:7]]); the call asks the LORD to take that rest. It has been proposed that the Chronicler knew the psalm as sung in a temple rite that reenacted the ark's procession (the note at [[Ps. 132:8]]). Chronicles also records the answer at once: “when Solomon had made an end of praying, the fire came down from heaven … and the glory of the LORD filled the house” ([[2 Chr. 7:1]]).

      The psalm's line is changed a little. Its priests are clothed “with righteousness” ([[Ps. 132:9]]); Solomon's are clothed “with salvation,” the word of the LORD's answer later in the psalm, and the word with which the Kirtland Temple's dedicatory prayer ends, in the psalm's own words: “let these, thine anointed ones, be clothed with salvation, and thy saints shout aloud for joy” ([[D&C 109:80]]; the note at [[Ps. 132:16]]).
    sources: [lds-scriptures, larsen-ascending-hill]

  - ref: 42
    phrase: remember the mercies of David thy servant
    kind: words
    title: The mercies of David
    body: |
      “The mercies of David” can mean the LORD's mercies to David or David's own faithful deeds, and the Hebrew allows both. The phrase is *ḥasdê dāwîd*, the plural of *ḥesed*. The standard lexicon lists this verse beside “the sure mercies of David” ([[Isa. 55:3]]) as mercies shown to David and promised in the covenant with him; on that reading Solomon asks the LORD to keep for David's son what He swore to David. Two older commentaries read it the other way: the plural names David's own deeds of devotion, all he did to establish and advance the public worship, as the same word does when Chronicles speaks of Hezekiah's and Josiah's “goodness” ([[2 Chr. 32:32]]; [[2 Chr. 35:26]]). On that reading Solomon asks the LORD to remember what David did and to grant his son's request for it.

      Either way the request is for Solomon, “thine anointed.” To turn away someone's face is to refuse what he asks, as when Adonijah begged Bath-sheba, “deny me not” ([[1 Kgs. 2:16]]). The psalm Solomon quotes asks the same thing, “For thy servant David’s sake turn not away the face of thine anointed” ([[Ps. 132:10]]), and it opens, “LORD, remember David, and all his afflictions” ([[Ps. 132:1]]).
    sources: [bdb, oshb-wlc, keil-chronicles, cambridge-chronicles, lds-scriptures]

christ: |
  The prayer's last words ask the LORD not to turn away “the face of thine anointed.” The Hebrew word is *māšîaḥ*: “Messiah” means “the anointed,” and “Christ” is its Greek equivalent. The standard lexicon counts this verse among those where the word names David's line “with Messianic ideals attached.” The phrase Solomon ends on, “the mercies of David,” is the one Isaiah uses when he offers “every one that thirsteth” an everlasting covenant ([[Isa. 55:1–3]]), and Paul taught that God gave those mercies in raising Jesus from the dead ([[Acts 13:34]]; the `christ` of [[1 Chr. 17]]). On the lexicon's reading of verse 42 they are the mercies Solomon asks the LORD to remember; the note at verse 42 gives the older reading.

  The promise of the chapter reaches every disciple who knows “his own sore and his own grief” (verse 29). The LORD alone knows the heart (verse 30), and His answer to this prayer is that when His people humble themselves and pray and turn, “then will I hear from heaven, and will forgive their sin” ([[2 Chr. 7:14]]).

