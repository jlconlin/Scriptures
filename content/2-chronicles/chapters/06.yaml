  - **The answer.** [[2 Chr. 7:1–3]], the fire and the glory; [[2 Chr. 7:12–16]], the LORD's words by night.
  - **The psalm Solomon quotes.** [[Ps. 132]], the ark brought to its rest and the oath to David.
  - **The Kirtland dedicatory prayer.** [[D&C 109]]; Scripture Central, “[How Did the Kirtland Temple Dedication Follow Ancient Patterns?](https://scripturecentral.org/knowhy/how-did-the-kirtland-temple-dedication-follow-ancient-patterns)”

