chapter: 4
title: All the Vessels That Were for the House of God
tagline: Solomon makes the great bronze altar, the sea on twelve oxen and the ten lavers for the court, ten lampstands and ten tables of gold for the house, and the two courts; Huram finishes the pillars and the bronze vessels, and gold furnishes the holy place to the doors of the most holy place.
when: 'Solomon''s reign: the furnishing of the house of the LORD, which he began to build in the fourth year of his reign (3:2) and finished in seven years (1 Kgs. 6:38).'

setting: |
  Chapters 2–4 of 2 Chronicles tell again how Solomon built and furnished the house of the LORD, first told in [[1 Kgs. 5]]–7: chapter 2 the agreement with Huram king of Tyre and the craftsman he sent, chapter 3 the house and its two pillars, and this chapter what stood in its courts and within it. Chapter 5 brings in the ark and the cloud fills the house.

  This chapter follows [[1 Kgs. 7:23–50]] closely, and both accounts close with the same verse ([[2 Chr. 5:1]]; [[1 Kgs. 7:51]]). The differences are in what each keeps. Kings tells of Solomon's own palace first ([[1 Kgs. 7:1–12]]); Chronicles passes over it here. Kings describes the wheeled stands for the lavers at length (1 Kgs. 7:27–37); Chronicles says only that the lavers stood on bases (verse 14), the stands being, in one older reading, mere parts of the lavers. Chronicles in turn has the making of the great altar (verse 1), what the sea and the lavers were for (verse 6), the ten tables, and the two courts (verses 7–9), which are not in Kings' list. Chronicles' compilers chose what suited their purpose, and they dwell on “the progress of temple worship in Jerusalem.”

  The site's notes on [[1 Kgs. 7]] explain the craftsman Huram ([[1 Kgs. 7:14]]), the sea's size and use ([[1 Kgs. 7:23]]), the twelve oxen and the fonts of latter-day temples ([[1 Kgs. 7:25]]), and the gold within ([[1 Kgs. 7:48]]). The notes here go to what Chronicles has of its own.

thread: |
  The chapter is an inventory, and its order follows the way into the house. It begins in the court with bronze: the altar on which the burnt offerings were burned, the sea where the priests washed, and the ten lavers where the parts of the offerings were rinsed (verses 1–6). Then it goes inside to gold: ten lampstands and ten tables in the holy place (verses 7–8). After the courts (verse 9) and a second, fuller list of Huram's bronze (verses 11–18), it ends with the golden altar, the lamps that burned “before the oracle,” and the gold of the doors of the most holy place (verses 19–22).

  That order was the order of worship. A worshipper of Solomon's day went no farther than the court: there the altar stood, there the offering was killed, and the priests took it from there; only the priests went into the house (the note on verse 9). Chronicles adds the one sentence Kings lacks, what the water in the court was for (verse 6): the sea was for the priests to wash in, as the law of the tabernacle had them wash before they went in or came near the altar. And all of it, bronze and gold, was made to a pattern the LORD revealed, which David had given Solomon “by the spirit” ([[1 Chr. 28:12]], where the note explains it). There was so much bronze that “the weight of the brass could not be found out” (verse 18), metal David had gathered in his wars ([[1 Chr. 18:8]]).

sections:
  - range: 1-6
    heading: The altar, the sea and the lavers
    plain: |
      Solomon also made a bronze altar, twenty cubits long, twenty cubits wide and ten cubits high.

      He made the sea of cast metal, ten cubits from rim to rim, round, and five cubits high; a line thirty cubits long went around it. Under it, all around, were figures of oxen, ten to a cubit, encircling the sea; there were two rows of oxen, cast together with it. It stood on twelve oxen, three facing north, three west, three south and three east; the sea rested on them, and their hindquarters were toward the center. It was a handbreadth thick, and its rim was made like the rim of a cup, like a lily blossom; it held three thousand baths.

      He made ten lavers and put five on the right and five on the left, for washing: in them they rinsed what was offered as a burnt offering. But the sea was for the priests to wash in.
  - range: 7-10
    heading: Lampstands, tables and the courts
    plain: |
      He made ten lampstands of gold as the law prescribed for them, and set them in the temple, five on the right and five on the left. He made ten tables and placed them in the temple, five on the right and five on the left. He also made a hundred basins of gold.

      He made the court of the priests and the great court, with doors for the court, and he overlaid their doors with bronze. He set the sea on the right side, at the east end, toward the south.
  - range: 11-18
    heading: Huram's work in bronze
    plain: |
      Huram made the pots, the shovels and the basins. So Huram finished the work he was to do for King Solomon on the house of God: the two pillars; the bowl-shaped capitals on top of the two pillars; the two networks covering the two bowls of the capitals on top of the pillars; the four hundred pomegranates for the two networks, two rows of pomegranates for each network, to cover the two bowls of the capitals on the pillars. He also made the bases, and the lavers on the bases; the one sea, and the twelve oxen under it; and the pots, the shovels, the forks and all their utensils. Huram, Solomon's master craftsman, made them for King Solomon for the house of the LORD, of polished bronze.

      The king cast them in the plain of the Jordan, in the clay ground between Succoth and Zeredathah. Solomon made all these vessels in such great number that the weight of the bronze was never found out.
  - range: 19-22
    heading: The vessels of gold
    plain: |
      Solomon made all the furnishings for the house of God: the golden altar; the tables on which the shewbread was set; the lampstands of pure gold with their lamps, to burn as prescribed before the inner sanctuary; the flowers, the lamps and the tongs of gold, the finest gold; and the snuffers, the basins, the spoons and the censers of pure gold. The entrance of the house, its inner doors into the most holy place and the doors of the main hall of the temple, were of gold.

notes:
  - ref: 1
    phrase: Moreover he made an altar of brass
    kind: history
    title: The great altar of the court
    body: |
      Chronicles alone describes the making of the altar where Israel's burnt offerings were burned, and it was the tabernacle's altar built on a far larger scale. Kings leaves it out of Huram's work and mentions it only in passing: at the dedication “the brasen altar that was before the LORD was too little” for that day's offerings, so Solomon hallowed the middle of the court to offer them there ([[1 Kgs. 8:64]]), and afterward Solomon offered three times a year “upon the altar which he built unto the LORD” ([[1 Kgs. 9:25]]). The altar Moses made was five cubits square and three high ([[Ex. 27:1]]); Solomon's was twenty square and ten high. It was “of the same pattern as that of the tabernacle, but enormously larger.”

      It stood in the court before the house, and it was the place where an Israelite met the law of sacrifice. The worshipper laid his hand on the head of his burnt offering, “and it shall be accepted for him to make atonement for him”; he killed it, and the priests sprinkled its blood on the altar ([[Lev. 1:4–5]]). The altar stood there until Ahaz had a new one built on the pattern of an altar he had seen at Damascus and moved Solomon's aside, to the north ([[2 Kgs. 16:10–14]]).
    sources: [lds-scriptures, bd-temple-of-solomon]

  - ref: 5
    phrase: it received and held three thousand baths
    kind: history
    title: Three thousand baths, and oxen under the brim
    body: |
      Chronicles' sea differs from Kings' in two details, and both may be slips in the copying of one text or the other. Kings says the sea “contained two thousand baths” ([[1 Kgs. 7:26]]); Chronicles has three thousand. Kings puts “knops” under the brim, in two rows ([[1 Kgs. 7:24]]): carved ornaments, perhaps gourd-shaped. Chronicles has “the similitude of oxen” there (verse 3). The two Hebrew words differ in only two letters: Chronicles has *bĕqārîm*, “oxen,” where Kings has *pĕqāʿîm*, “knops.” The Septuagint, the ancient Greek translation, agrees with Chronicles in both places, with “the likeness of calves” and “three thousand measures.”

      Commentators have weighed the two figures without settling them. One older reading takes both differences as “probably the result of orthographical errors in the Chronicle.” Another judges that the oxen under the brim “can hardly be correct” despite the Greek, but that whether the baths were miscopied in Kings or in Chronicles “cannot be determined”; it puts a bath at about 8¼ gallons. These notes leave both figures as the texts give them. The size and use of the sea are explained at [[1 Kgs. 7:23]], and why figures in Chronicles so often differ from Samuel's and Kings' at [[2 Sam. 24:9]].
    sources: [lds-scriptures, oshb-wlc, bdb, lxx-rahlfs, keil-chronicles, cambridge-chronicles]

  - ref: 6
    phrase: but the sea was for the priests to wash in
    kind: scripture
    title: Washing before coming near
    body: |
      Chronicles is the account that says what the water in the court was for, and its answer is the law of the tabernacle. Kings tells only where the ten lavers and the sea stood ([[1 Kgs. 7:38–39]]). Chronicles gives their use: the lavers were for rinsing “such things as they offered for the burnt offering,” as the law required the inwards and legs of a burnt offering to be washed before the priest burned it on the altar ([[Lev. 1:9]]); “but the sea was for the priests to wash in.”

      At the tabernacle the same work was done by a laver of brass between the altar and the door of the tent, where Aaron and his sons washed their hands and feet whenever they went in or came near the altar to minister ([[Ex. 30:18–20]]). The tabernacle's law left no room for skipping it: “they shall wash their hands and their feet, that they die not: and it shall be a statute for ever” ([[Ex. 30:21]]). Solomon's furniture was like the tabernacle's without copying it, and the great sea in the court of his house held “the water for the purification of the priests.” How the sea's form has passed to the baptismal fonts of latter-day temples is explained at [[1 Kgs. 7:25]].
    sources: [lds-scriptures, bd-tabernacle, bd-temple-of-solomon, madsen-solomons-temple]

  - ref: 7
    phrase: ten candlesticks of gold according to their form
    kind: words
    title: Ten lampstands and ten tables
    body: |
      “According to their form” means made as the law prescribed: Solomon's house had ten lampstands where the tabernacle had one, but each was made by the ordinance given for the tabernacle's. The Hebrew *kĕmišpāṭām* is “according to their ordinance,” from the word for the law given through Moses; one older reading explains it as made according to the rule for the golden candlestick of Moses' sanctuary ([[Ex. 25:31]]), which was to be made “after their pattern, which was shewed thee in the mount” ([[Ex. 25:40]]). The same word returns in verse 20, where the lamps were to burn “after the manner” before the oracle, that is, as prescribed.

      Chronicles also has ten tables (verse 8) and later speaks of “the tables whereon the shewbread was set” (verse 19), as David had weighed out gold “for the tables of shewbread” ([[1 Chr. 28:16]]). Kings names only “the table of gold, whereupon the shewbread was” ([[1 Kgs. 7:48]]), and Abijah later speaks of “the pure table” ([[2 Chr. 13:11]]). The Bible Dictionary reads all ten as tables of shewbread, five on each side, in place of the tabernacle's one.
    sources: [oshb-wlc, keil-chronicles, cambridge-chronicles, bd-temple-of-solomon, lds-scriptures]

  - ref: 9
    phrase: the court of the priests, and the great court
    kind: history
    title: Two courts
    body: |
      Chronicles names the temple's two courts, the court of the priests and the great court. Kings calls the first the “inner court,” walled with three rows of hewn stone and a row of cedar beams ([[1 Kgs. 6:36]]); as the court of the priests it was also called, from its elevation, the upper court, the “higher court” of [[Jer. 36:10]]. The outer or great court “was for the use of the people”; nothing is said of its walls, but its doors were overlaid with bronze (verse 9).

      The two courts marked how near each worshipper came. An Israelite came with his offering as far as the courtyard, took part in killing it there, and left the rest to the priests. The priests would also have kept worshippers out of the house itself, since only the high priest went into the most holy place.
    sources: [bd-temple-of-solomon, madsen-solomons-temple, lds-scriptures]

  - ref: 16
    phrase: did Huram his father make
    kind: words
    title: Father as a title for Huram
    body: |
      “His father” here is a title of honor for the master craftsman. The man is the craftsman Huram (Hiram in Kings), son of a man of Tyre ([[2 Chr. 2:14]]), whom the site's note at [[1 Kgs. 7:14]] introduces. The Hebrew *ʾāḇîw*, “his father,” uses the word as a “term of respect & honour”: servants call their master “My father” ([[2 Kgs. 5:13]]), and Joseph says God “hath made me a father to Pharaoh,” his chief counsellor ([[Gen. 45:8]]). Huram bears the title as an “artificer,” here and at [[2 Chr. 2:13]], where the king of Tyre sends him. So verse 16 says that Huram, Solomon's master of the work, made the bronze for the house of the LORD.
    sources: [oshb-wlc, bdb, lds-scriptures]

christ: |
  The altar that stands first in this chapter was where the sacrifices of the law of Moses were offered, and the book of Hebrews teaches that Christ “is the last great sacrifice and also the high priest who would offer that sacrifice”: “this he did once, when he offered up himself” ([[Heb. 7:26–27]]). In Solomon's house the worshipper stopped in the court and left the rest to the priests, but in the Lord's houses today a worshipper “may progress through all the rooms of the temple, finally entering into the symbolic presence of the Lord, a privilege denied to the ancient Israelites.”

  Disciples who come to the Lord's house now come “with their sacrifice of a broken heart and a contrite spirit,” and go on into the rooms that Israel's worshippers never entered.
