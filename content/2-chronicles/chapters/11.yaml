chapter: 11
title: Such as Set Their Hearts to Seek the LORD
tagline: Rehoboam obeys a prophet's word not to fight the northern tribes, fortifies the towns of Judah, and is strengthened by the priests, Levites and others from the north who come to Jerusalem to worship; then he sets his large household in order and names Abijah his heir.
when: 'The first years of Rehoboam''s reign, before Shishak came up “in the fifth year of king Rehoboam” ([[2 Chr. 12:2]])'

setting: |
  Chapter 10 told how the northern tribes refused Rehoboam and went home ([[1 Kgs. 12:1–19]]). Chapter 11 opens where Kings goes on: Rehoboam musters Judah and Benjamin to win the north back, and the prophet Shemaiah stops him (verses 1–4, told also at [[1 Kgs. 12:21–24]]). As chapter 10 noted, Chronicles has not told how Jeroboam was made king or how he set up the golden calves ([[2 Chr. 10]]); the calves appear in Chronicles for the first time in a clause of verse 15. Everything from verse 5 to the end of the chapter has no counterpart in Kings: the fortified towns, the priests, Levites and laymen who came south from Israel, and Rehoboam's wives and sons. Chronicles as a whole keeps its eye on Judah and generally mentions the northern kingdom only where it touched Judah.

  The site's notes on 1 Kings 12 explain the division itself: why the LORD said “this thing is from me” ([[1 Kgs. 12:15]]), the calves ([[1 Kgs. 12:28]]) and Jeroboam's priests ([[1 Kgs. 12:31]]). The notes here go to what Chronicles adds.

thread: |
  The chapter is about where Judah's strength came from. Rehoboam begins by obeying: told not to fight “your brethren,” he and his men “obeyed the words of the LORD” (verse 4). Shemaiah's word is addressed “to all Israel in Judah and Benjamin” (verse 3), and Chronicles, unlike Kings, often calls Judah “Israel,” the name of the covenant people. Then come two kinds of strengthening. In verses 5–12 Rehoboam consolidates his kingdom with walls, captains, stores and weapons, until Judah and Benjamin are his. In verses 13–17 the strength is of another kind: priests and Levites cast off by Jeroboam, and then people from every tribe of Israel who had “set their hearts to seek the LORD God of Israel,” come to Jerusalem, and “so they strengthened the kingdom of Judah … three years.”

  The last verses turn to Rehoboam's house, and the next chapter tells what happened after the three years. When Rehoboam “had established the kingdom, and had strengthened himself, he forsook the law of the LORD, and all Israel with him” ([[2 Chr. 12:1]]), and Shishak of Egypt came against the fenced cities. Chronicles' verdict on Rehoboam is that “he did evil, because he prepared not his heart to seek the LORD” ([[2 Chr. 12:14]]).

sections:
  - range: 1-4
    heading: Shemaiah stops the war
    plain: |
      When Rehoboam reached Jerusalem he gathered from Judah and Benjamin a hundred and eighty thousand picked fighting men to make war on Israel and win the kingdom back for himself. But the word of the LORD came to Shemaiah, the man of God: “Say to Rehoboam son of Solomon, king of Judah, and to all Israel in Judah and Benjamin: ‘This is what the LORD says: Do not go up and fight against your brothers. Go home, every one of you, for this has come about by Me.’” They obeyed the LORD's words and turned back from marching against Jeroboam.
  - range: 5-12
    heading: Fenced cities for Judah
    plain: |
      Rehoboam lived in Jerusalem and built up towns in Judah for defense: Bethlehem, Etam and Tekoa, Beth-zur, Shoco and Adullam, Gath, Mareshah and Ziph, Adoraim, Lachish and Azekah, Zorah, Aijalon and Hebron, fortified towns in Judah and Benjamin. He strengthened the strongholds, put commanders in them, and stocked them with food, oil and wine. In every town he stored shields and spears and made them very strong. So Judah and Benjamin were his.
  - range: 13-17
    heading: The faithful of the north come to Jerusalem
    plain: |
      The priests and Levites throughout Israel came over to him from all their territory. The Levites left their pasturelands and their property and came to Judah and Jerusalem, because Jeroboam and his sons had thrown them out of serving as priests to the LORD, and he had appointed his own priests for the high places, for the goat-idols and for the calves he had made. After them, people from every tribe of Israel who had set their hearts on seeking the LORD God of Israel came to Jerusalem to sacrifice to the LORD God of their fathers. They strengthened the kingdom of Judah and made Rehoboam son of Solomon strong for three years, for three years they walked in the way of David and Solomon.
  - range: 18-23
    heading: Rehoboam's house
    plain: |
      Rehoboam married Mahalath, daughter of Jerimoth son of David, and Abihail the daughter of Eliab son of Jesse, and she bore him sons: Jeush, Shamariah and Zaham. After her he married Maachah the daughter of Absalom, who bore him Abijah, Attai, Ziza and Shelomith. Rehoboam loved Maachah more than all his other wives and concubines; he had eighteen wives and sixty concubines, and fathered twenty-eight sons and sixty daughters. He made Abijah son of Maachah chief prince among his brothers, intending to make him king. He acted wisely, spreading his sons through all the districts of Judah and Benjamin, into every fortified town; he gave them plenty of provisions and sought many wives.

notes:
  - ref: 14
    phrase: the Levites left their suburbs and their possession
    kind: history
    title: The Levites leave their lands
    body: |
      Chronicles says what Kings leaves out: the Levites were driven from their office. Kings tells only that Jeroboam made priests from all the people, not of the sons of Levi (the note at [[1 Kgs. 12:31]]); here “Jeroboam and his sons had cast them off from executing the priest's office unto the LORD,” and Abijah will throw it in Israel's face before battle: “Have ye not cast out the priests of the LORD, the sons of Aaron, and the Levites?” ([[2 Chr. 13:9]]).

      What they left behind was all the land the Law had given them. Their tribe had no inheritance in Canaan; they had the tithe and forty-eight cities scattered among the other tribes, each with its “suburbs,” the pasture around it ([[Num. 35:2]]). To leave “their suburbs and their possession” and come to Judah was to leave home and livelihood behind.
    sources: [bd-levites, lds-scriptures]

  - ref: 16
    phrase: such as set their hearts to seek the LORD God of Israel
    kind: history
    title: Northerners who sought the LORD
    body: |
      Laymen from every tribe followed the Levites south, and Chronicles names what moved them: they had set their hearts to seek the LORD and came to Jerusalem to sacrifice to “the LORD God of their fathers.” More came later. In Asa's reign people out of Ephraim, Manasseh and Simeon “fell to him out of Israel in abundance, when they saw that the LORD his God was with him” ([[2 Chr. 15:9]]), and after Assyria conquered the northern kingdom in 722 BC another large migration followed. Archaeology bears out the later wave: Jerusalem's population grew rapidly, its walls were extended to take in the newcomers, and many of the city's seventh-century people, perhaps a majority, appear to have descended from refugees from the north.

      That bears on the Book of Mormon's first chapter. Lehi was “a descendant of Manasseh” ([[Alma 10:3]]), yet he had “dwelt at Jerusalem in all his days” ([[1 Ne. 1:4]]). His ancestors were among the northerners who at some point moved to the southern kingdom, probably, on one reading of the archaeology, as Manassite refugees who fled south when Assyria destroyed Israel in 724–722 BC. The site's note at [[1 Kgs. 12:17]] points to the same thing from Kings.
    sources: [lds-scriptures, scripture-helps-2-chronicles, sc-knowhy-708]

  - ref: 22
    phrase: made Abijah the son of Maachah the chief
    kind: history
    title: Abijah chosen to be king
    body: |
      Rehoboam chose his heir from the sons of the wife he loved most (verse 21), and the records do not agree on who she was. Abijah's mother was “Maachah the daughter of Absalom” (verse 20), and Kings likewise calls her “the daughter of Abishalom” ([[1 Kgs. 15:2]]). But Absalom had only one daughter, Tamar ([[2 Sam. 14:27]]), and Chronicles itself later names Abijah's mother “Michaiah the daughter of Uriel of Gibeah” ([[2 Chr. 13:2]]). One older reading takes “daughter” here as granddaughter, so that Maachah was the child of Tamar and of Uriel; another makes her “perhaps” Absalom's granddaughter and reads “Maachah” at 13:2 with the Greek translation. A Maachah daughter of Abishalom appears again under Asa (the note at [[1 Kgs. 15:13]]).

      Verse 23 says Rehoboam “dealt wisely” with his other sons: he spread them through the fortified towns of Judah and Benjamin and gave them generous provision. One older reading finds the wisdom in keeping them apart and content, so that none would reach for the crown he had reserved for Abijah.

      The last clause, “And he desired many wives,” uses a Hebrew verb that means to ask for or request. The older readings take the wives to be for his sons, since a father arranged his sons' marriages, and one suggests that the words “for them” have dropped out of the Hebrew text. Whether the Chronicler also has in view the law that a king should not “multiply wives to himself” ([[Deut. 17:17]]) is hard to say.
    sources: [lds-scriptures, keil-chronicles, cambridge-chronicles, bdb]

christ: |
  The God whom the Levites and the faithful of the north came to Jerusalem to worship is the God who later stood among the Nephites and said, “I am he that gave the law, and I am he who covenanted with my people Israel” ([[3 Ne. 15:5]]; see the note at [[Ex. 3:14]]). In this chapter Judah's strength came from the Levites who left their lands and from everyone who “set their hearts to seek the LORD God of Israel” (verses 14–17): “so they strengthened the kingdom of Judah.”

  Those who set their hearts to seek the Lord Jesus Christ strengthen the people of God around them, as these northerners strengthened Judah.

