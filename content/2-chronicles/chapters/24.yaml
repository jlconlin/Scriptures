chapter: 24
title: He Hath Also Forsaken You
tagline: Joash repairs the temple while Jehoiada lives; after the priest's death he listens to the princes, has Jehoiada's son Zechariah stoned in the temple court, and within the year the Syrians come and his servants kill him.
when: 'The forty years of Joash in Jerusalem, from the age of seven (verse 1)'

setting: |
  Joash is the boy who survived Athaliah. When she destroyed the royal family he was hidden in the house of God six years with Jehoiada the priest and his wife Jehoshabeath ([[2 Chr. 22:11–12]]), and in the seventh Jehoiada brought him out and made him king ([[2 Chr. 23]]). This chapter tells his reign of forty years. It sits in the second part of the book, the kings of Judah from the division of the kingdom to Ahaz.

  The reign is also told in [[2 Kgs. 12]], and the two accounts agree in all the essentials. On one older reading, each gives the most important parts of a fuller history of Joash. Chronicles supplies much that Kings leaves out: the wives Jehoiada took for him (as a father would provide a wife for his son), the priest's death at a hundred and thirty, his burial among the kings, and above all the martyrdom of Zechariah (verses 20–22), which has no parallel in Kings. The site's notes on 2 Kings 12 already explain the money for the repair ([[2 Kgs. 12:4]]), why the work stalled and what the chest changed ([[2 Kgs. 12:9]]), Hazael's attack ([[2 Kgs. 12:18]]) and the two burials ([[2 Kgs. 12:20]]), and they are not repeated here. The notes below go to what is Chronicles' own.

thread: |
  The chapter turns on one man's life. Joash did right “all the days of Jehoiada the priest” (verse 2); the offerings went up “continually all the days of Jehoiada” (verse 14); and “after the death of Jehoiada” (verse 17) everything reverses. The first half is the temple repaired: a collection proclaimed through Judah, a people who “rejoiced” to give, and the house of God set “in his state” (verses 9–13). The second half is the temple forsaken. The princes come and bow before the king, he hearkens, and Judah serves groves and idols in place of the house it had just rebuilt.

  The LORD does not leave them there: “he sent prophets to them, to bring them again unto the LORD” (verse 19). One of them is Jehoiada's own son, and the king has him stoned in the court of the very house where Jehoiada had hidden him as a child. The text does not say that Joash himself worshipped the idols; the charge it lays on him is ingratitude, that he “remembered not the kindness which Jehoiada his father had done to him, but slew his son” (verse 22). Zechariah's last words ask the LORD to see and require it, and the rest of the chapter is the answer, within a year: a small Syrian company routs Judah's army, the king's own servants kill him “for the blood of the sons of Jehoiada,” and he is denied the kings' tombs where Jehoiada, honored for the good he had done, was laid (verses 16, 25).

sections:
  - range: 1-3
    heading: The king Jehoiada raised
    plain: |
      Joash was seven years old when he became king, and he reigned forty years in Jerusalem. His mother was Zibiah of Beer-sheba. Joash did what was right in the LORD's sight all the days of Jehoiada the priest. Jehoiada took two wives for him, and he had sons and daughters.
  - range: 4-14
    heading: The temple repaired
    plain: |
      Some time later Joash decided to restore the house of the LORD. He gathered the priests and the Levites and told them, “Go out to the cities of Judah and collect money from all Israel to repair the house of your God year by year, and do it quickly.” But the Levites did not hurry. So the king called Jehoiada the chief priest and asked him, “Why have you not required the Levites to bring in from Judah and Jerusalem the tax that Moses the servant of the LORD and the congregation of Israel laid down for the tabernacle of the testimony?” For the sons of that wicked woman Athaliah had broken into the house of God and had used all its holy things for the Baals.

      At the king's command they made a chest and set it outside, at the gate of the LORD's house. A proclamation went through Judah and Jerusalem to bring the LORD the tax that Moses the servant of God had laid on Israel in the wilderness. All the leaders and all the people rejoiced, and they brought their money and dropped it into the chest until they had finished giving. Whenever the Levites brought the chest to the king's officials and they saw that there was a great deal of money, the king's scribe and the high priest's officer came, emptied it, and carried it back to its place. They did this day after day and gathered a great sum. The king and Jehoiada gave it to those in charge of the work on the LORD's house, and they hired masons and carpenters to restore it, and workers in iron and bronze to repair it. The workmen labored and the repair went forward under them; they restored the house of God to its proper form and made it strong. When they had finished, they brought the rest of the money to the king and Jehoiada, and with it were made utensils for the LORD's house, for the service and for the offerings, dishes, and vessels of gold and silver. And burnt offerings were offered in the LORD's house continually all the days of Jehoiada.
  - range: 15-16
    heading: Jehoiada's death
    plain: |
      Jehoiada grew old and full of years and died; he was a hundred and thirty years old when he died. They buried him in the city of David among the kings, because he had done good in Israel, for God and for His house.
  - range: 17-22
    heading: The prophet stoned in the temple court
    plain: |
      After Jehoiada died, the leaders of Judah came and bowed before the king, and the king listened to them. They abandoned the house of the LORD, the God of their fathers, and served the Asherah poles and the idols, and wrath came on Judah and Jerusalem for this guilt of theirs. Yet the LORD sent prophets among them to bring them back to Him, and the prophets testified against them, but they would not listen.

      Then the Spirit of God came upon Zechariah son of Jehoiada the priest. He stood up above the people and said to them, “This is what God says: Why do you break the LORD's commandments, so that you cannot prosper? Because you have forsaken the LORD, He has forsaken you.” But they plotted against him, and at the king's command they stoned him to death in the court of the LORD's house. So King Joash did not remember the kindness Jehoiada, Zechariah's father, had shown him, and he killed his son. As Zechariah was dying he said, “May the LORD see this and call you to account.”
  - range: 23-27
    heading: Judgment within the year
    plain: |
      When the year had come round, the Syrian army marched against Joash. They came into Judah and Jerusalem, killed all the leaders of the people, and sent all their plunder to the king of Damascus. The Syrian army had come with only a few men, yet the LORD delivered a very large army into their hands, because Judah had forsaken the LORD, the God of their fathers. So the Syrians carried out judgment on Joash.

      When they withdrew, they left Joash badly wounded. His own servants plotted against him because of the blood of the sons of Jehoiada the priest, and they killed him on his bed. He died, and they buried him in the city of David, but not in the tombs of the kings. These were the conspirators: Zabad son of Shimeath, an Ammonite woman, and Jehozabad son of Shimrith, a Moabite woman. The account of his sons, of the weighty burdens laid on him, and of the restoration of the house of God is written in the commentary on the book of the kings. And Amaziah his son became king in his place.

notes:
  - ref: 20
    phrase: Zechariah the son of Jehoiada the priest
    kind: scripture
    title: The Zacharias whom Jesus named
    body: |
      This Zechariah is generally taken to be the martyr Jesus named at the end of His ministry, when He told the scribes and Pharisees that all the righteous blood shed on the earth would come upon their generation, “from the blood of righteous Abel unto the blood of Zacharias son of Barachias, whom ye slew between the temple and the altar” ([[Matt. 23:35]]). Zechariah and Zacharias are equivalent forms of one name, and the Bible Dictionary sends the reader from Jesus' words to these verses. The Old Testament knows no martyr called Zacharias son of Barachias; it does tell how Zechariah son of Jehoiada was stoned in the temple court. In the Jewish order of the scriptures his is the last martyrdom recorded, so “from Abel to Zechariah” may sweep in all the martyrs from the first to the last.

      The father's name is the difficulty. Luke's form of the saying has no father at all: “From the blood of Abel unto the blood of Zacharias, which perished between the altar and the temple” ([[Luke 11:51]]). Berechiah was the father of a later prophet, “Zechariah, the son of Berechiah” ([[Zech. 1:1]]), whom the Old Testament does not number among the martyrs. That the Lord referred to “a late and probably the latest of the recorded martyrdoms is probable,” and “it is likely that a fuller account appeared in scriptures current among the Jews at the time of Christ but since lost.” Two explanations of the father's name are offered: that an author or editor confused the two Zechariahs, or that the Lord spoke of an unknown martyr who shared both names. The first is now generally accepted. Beside such a slip stands Joseph Smith's own statement: “I believe the Bible as it read when it came from the pen of the original writers. Ignorant translators, careless transcribers, or designing and corrupt priests have committed many errors.”

      Some Latter-day Saints have taught that the Zacharias slain in the temple was John the Baptist's father, and have passed the story on as a teaching of Joseph Smith. It comes from the Protevangelium of James, a second-century text outside the Bible. The martyr of the temple court is the one this chapter tells of. How Jesus' words carry Kings' theme of innocent blood is followed on the 2 Kings theme page [Innocent Blood](/2-kings/themes/innocent-blood/).
    sources: [bd-zacharias, talmage-jesus-christ-31, wilson-zacharias, lds-scriptures]

  - ref: 20
    phrase: because ye have forsaken the LORD, he hath also forsaken you
    kind: scripture
    title: Forsaken as they had forsaken
    body: |
      Zechariah's message is the rule Chronicles judges its kings by, spoken once more. He was one of the prophets of verse 19, sent “to bring them again unto the LORD,” and the Spirit of God “came upon” him; the Hebrew says the Spirit clothed itself with him, as with Gideon and Amasai (the note at [[1 Chr. 12:18]] explains the expression). He “stood above the people,” in a raised place from which to speak to them: on one older reading the higher inner court of the temple, above the people in the outer court; another compares Baruch reading from an upper chamber over the court and Ezra on his pulpit of wood ([[Jer. 36:10]]; [[Neh. 8:4]]). His question, “Why transgress ye the commandments of the LORD, that ye cannot prosper?”, assumes that faithfulness to the LORD is the condition of prospering, and his sentence repeats what earlier prophets had said to Rehoboam and to Asa. Shemaiah told Rehoboam, “Ye have forsaken me, and therefore have I also left you” ([[2 Chr. 12:5]]); Azariah, on whom the Spirit of God had also come, told Asa, “if ye forsake him, he will forsake you” ([[2 Chr. 15:2]]).

      To Asa the words came as a condition, “if ye forsake him” ([[2 Chr. 15:2]]). Zechariah speaks of what has already happened: “ye have forsaken the LORD.” They stoned him for it, and his word became a prophecy, fulfilled within the year (the notes at verses 22 and 24).
    sources: [cambridge-chronicles, keil-chronicles, lds-scriptures]

  - ref: 21
    phrase: in the court of the house of the LORD
    kind: history
    title: Stoned in the temple court
    body: |
      The place of the killing sharpens its irony, which “lies a generation earlier”: Zechariah's parents had saved the infant king and raised him in the temple. Jehoiada and his wife had kept him “hid in the house of God six years” ([[2 Chr. 22:12]]), and when he was brought out to be crowned, the guard stood “along by the altar and the temple” ([[2 Chr. 23:10]]). Now Joash ordered the son of that household stoned in its court.
    sources: [wilson-zacharias, lds-scriptures]

  - ref: 22
    phrase: The LORD look upon it, and require it
    kind: words
    title: The LORD look upon it, and require it
    body: |
      Zechariah's dying words ask the LORD to call his killers to account for his blood. “Require” is the Hebrew *dāraš*, which can mean to exact, “often with collateral idea of avenging,” the sense it has in the LORD's word to Noah: “surely your blood of your lives will I require” ([[Gen. 9:5]]).

      The end of the chapter answers the request. Within the year the Syrians “executed judgment against Joash” (verse 24), and his own servants killed him “for the blood of the sons of Jehoiada the priest” (verse 25). Jesus said of the blood of the Zacharias He named that it “shall be required of this generation” ([[Luke 11:51]]; the note at verse 20).
    sources: [bdb, lds-scriptures]

  - ref: 24
    phrase: the army of the Syrians came with a small company of men
    kind: history
    title: Judgment within the year
    body: |
      Chronicles tells the Syrian attack as the LORD's judgment, and says so outright: a small company defeated a very great army “because they had forsaken the LORD God of their fathers.” Kings tells the same campaign differently. There Hazael turns toward Jerusalem and Joash buys him off with the temple's dedicated treasures, “and he went away from Jerusalem” ([[2 Kgs. 12:18]]; the note there tells who Hazael was).

      Kings tells the invasion without naming any sin it punished ([[2 Kgs. 12:17–18]]). Chronicles names the sin and the judgment in the same verse, as it often does (see the note on [[2 Chr. 14:7]]).
    sources: [lds-scriptures]

  - ref: 26
    phrase: Zabad the son of Shimeath an Ammonitess
    kind: history
    title: Sons of an Ammonitess and a Moabitess
    body: |
      Chronicles names the conspirators' mothers and their nations, which Kings does not. Kings calls them “Jozachar the son of Shimeath, and Jehozabad the son of Shomer” ([[2 Kgs. 12:21]]); Chronicles has Zabad son of Shimeath, an Ammonite woman, and Jehozabad son of Shimrith, a Moabite woman. The Church's footnote at this verse gives Jozachar as the other form of Zabad's name.

      Why the Chronicler adds the mothers' nations, the text does not say. One older reading holds that he means to connect the sin and its punishment: the king under whom Judah turned to foreign gods died at the hands of men of foreign descent. That is a reading, not the text's own statement; the text gives the killers' motive as “the blood of the sons of Jehoiada” (verse 25).
    sources: [lds-scriptures, cambridge-chronicles]

  - ref: 27
    phrase: the greatness of the burdens laid upon him
    kind: words
    title: The burdens laid upon him
    body: |
      “The burdens laid upon him” are most likely the prophecies spoken against him, not loads or taxes. The Hebrew *maśśāʾ* means a burden, but it is also the regular word for a prophetic utterance, the “burden” of Babylon or of Moab in Isaiah, and this verse is one of its uses for a prophetic utterance. Read that way, the closing summary looks back to verse 19: the LORD sent prophets, “and they testified against them.” The record that holds them, “the story of the book of the kings,” is a *midrash*, a work of exposition (the note at [[2 Chr. 13:22]] explains the word).
    sources: [bdb, lds-scriptures]

christ: |
  The Lord who “sent prophets to them, to bring them again unto the LORD” (verse 19) is the one who later stood in Jerusalem and named Zechariah's blood. Speaking to the men of His own day, Jehovah Himself foretold that they would kill the prophets He sent among them, and grieved over the city: “how often would I have gathered thy children together, even as a hen gathereth her chickens under her wings, and ye would not!” ([[Matt. 23:37]]). The prophets of this chapter, and Zechariah who died for his testimony, were His messengers, sent to bring His people home.

  He still gathers by sending servants. What He says through them is His own word: “whether by mine own voice or by the voice of my servants, it is the same” ([[D&C 1:38]]). Joash's goodness lasted as long as Jehoiada, who “instructed him” ([[2 Kgs. 12:2]]), lived; the voice that calls a disciple back to the Lord keeps speaking after any one teacher is gone.

explore: |
  - **The same reign in Kings.** [[2 Kgs. 12]], with the site's notes on the repair, Hazael and the conspiracy, and the boy hidden in the temple in [[2 Kgs. 11]] and [[2 Chr. 22:10–23:21]].
  - **Jesus' words on the prophets' blood.** [[Matt. 23:29–39]]; [[Luke 11:47–51]]; and the 2 Kings theme page [Innocent Blood](/2-kings/themes/innocent-blood/).
  - **The prophets the LORD kept sending.** [[2 Chr. 36:15–16]], the book's last word on them.
  - **The Zechariahs sorted out.** “The Confusing Case of Zacharias,” *Religious Educator* 14, no. 2 (2013), on the martyr, the prophet and John the Baptist's father.

