chapter: 28
title: This Is That King Ahaz
tagline: Ahaz walks in the ways of the kings of Israel, and Syria and Israel defeat Judah in the field; a prophet in Samaria persuades Israel's army to send its captives home clothed and fed; Ahaz buys help from Assyria that does not help him, sacrifices to the gods of Damascus, and shuts the doors of the LORD's house.
when: 'The sixteen years of Ahaz in Jerusalem (verse 1), from the war with Syria and Israel to his burial'

setting: |
  Ahaz the son of Jotham reigned sixteen years in Jerusalem. He made an alliance with Tiglath-pileser, king of Assyria, to repel an attack from Syria and Israel, copied a heathen altar, and received a message from Isaiah. Kings tells the reign in one chapter, and the site's notes on [[2 Kgs. 16]] explain the son he passed through the fire ([[2 Kgs. 16:3]]), the silver he sent to Assyria and the altar he copied in Damascus; [[Isa. 7]] and its notes tell of the prophet sent to meet him in the war.

  Chronicles follows the same outline and adds much of its own: the defeats Judah suffered in the field (verses 5–8), the prophet Oded and the captives sent home from Samaria (verses 9–15, which Kings does not have), the raids of Edom and the Philistines (verses 17–18), the sacrifices to the gods of Damascus (verse 23) and the shutting of the temple's doors (verse 24). Ahaz was buried in Jerusalem but not in the sepulchres of the kings (verse 27), as Jehoram had been before him ([[2 Chr. 21:20]], with the note there). The next chapter opens with his son Hezekiah, who in the first month of his reign “opened the doors of the house of the LORD” ([[2 Chr. 29:3]]).

thread: |
  The word that carries the chapter is “help.” Ahaz sends to the kings of Assyria “to help him” (verse 16). Tilgath-pilneser comes and “distressed him, but strengthened him not” (verse 20), and the treasure Ahaz stripped from the house of the LORD “helped him not” (verse 21), words that answer the request of verse 16. Then Ahaz turns to the gods of Damascus, “that they may help me,” and “they were the ruin of him, and of all Israel” (verse 23). Help bought from Assyria cost him, on one Latter-day Saint reading, not only tribute but trust that belonged to Jehovah.

  The chapter gives the reason for Judah's troubles at its start and again in its middle: the men fell “because they had forsaken the LORD God of their fathers” (verse 6), and “the LORD brought Judah low because of Ahaz” (verse 19). Chronicles, as it usually does, tells the punishment within the reign. In the middle of the chapter a prophet of the LORD speaks in Samaria, the men of Ephraim do what he says, and two hundred thousand captives go home clothed and fed. The chapter ends with the doors of the LORD's house shut, and the next chapter opens them.

sections:
  - range: 1-4
    heading: In the ways of the kings of Israel
    plain: |
      Ahaz was twenty years old when he became king, and he reigned sixteen years in Jerusalem. He did not do what was right in the sight of the LORD, as his ancestor David had done. He followed the ways of the kings of Israel and even made cast images for the Baals. He burned incense in the valley of the son of Hinnom and burned his children in the fire, following the detestable practices of the nations the LORD had driven out before Israel. He sacrificed and burned incense at the high places, on the hills, and under every green tree.
  - range: 5-8
    heading: Defeated by Syria and by Israel
    plain: |
      So the LORD his God handed him over to the king of Syria. The Syrians defeated him and carried a great number of his people captive to Damascus. He was also handed over to the king of Israel, who struck him with a great slaughter: Pekah son of Remaliah killed a hundred and twenty thousand in Judah in one day, all of them valiant men, because they had forsaken the LORD God of their fathers. Zichri, a warrior of Ephraim, killed Maaseiah the king's son, Azrikam the officer over the palace, and Elkanah, who was second to the king. The Israelites carried off two hundred thousand of their own kin, women, sons and daughters, took a great deal of plunder as well, and brought it to Samaria.
  - range: 9-15
    heading: Oded, and the captives sent home
    plain: |
      But a prophet of the LORD named Oded was there. He went out to meet the army as it came to Samaria and said to them, “The LORD God of your fathers was angry with Judah, and so He handed them over to you; but you have killed them in a rage that has reached up to heaven. And now you mean to force the people of Judah and Jerusalem to be your slaves, men and women. But are you not guilty yourselves of sins against the LORD your God? Now listen to me: send back the captives you have taken from your kin, for the fierce anger of the LORD is on you.” Then some of the leaders of Ephraim, Azariah son of Johanan, Berechiah son of Meshillemoth, Jehizkiah son of Shallum and Amasa son of Hadlai, confronted those coming back from the war. “You must not bring the captives here,” they said. “We have already sinned against the LORD, and you mean to add to our sins and our guilt. Our guilt is great already, and fierce anger hangs over Israel.” So the soldiers left the captives and the plunder in front of the leaders and the whole assembly. The men named for the task took charge of the captives. From the plunder they clothed all who were naked, gave them clothes and sandals, food and drink, and anointed them; they put all who were too weak to walk on donkeys, and brought them to their kin at Jericho, the city of palm trees. Then they went back to Samaria.
  - range: 16-21
    heading: Help from Assyria that did not help
    plain: |
      At that time King Ahaz sent to the kings of Assyria for help. The Edomites had come again, defeated Judah and carried off captives. The Philistines had raided the towns of the foothills and the south of Judah and had taken Beth-shemesh, Ajalon and Gederoth, and Shocho, Timnah and Gimzo with their villages, and they settled there. The LORD brought Judah low because of Ahaz king of Israel, for he had let all restraint go in Judah and had been grievously unfaithful to the LORD. Tilgath-pilneser king of Assyria came to him, but he pressed him hard instead of strengthening him. Ahaz took a share of the treasures of the house of the LORD, of the king's palace and of the princes, and gave it to the king of Assyria, but it did him no good.
  - range: 22-27
    heading: The doors of the LORD's house shut
    plain: |
      In the time of his distress he was even more unfaithful to the LORD; that was King Ahaz. He sacrificed to the gods of Damascus, who had defeated him, saying, “The gods of the kings of Syria help them, so I will sacrifice to them, and they will help me.” But they were his ruin, and the ruin of all Israel. Ahaz gathered the vessels of the house of God and cut them in pieces. He shut the doors of the house of the LORD and made himself altars in every corner of Jerusalem. In every town of Judah he built high places to burn incense to other gods, and he provoked the LORD God of his fathers to anger. The rest of his acts and all his ways, from first to last, are written in the book of the kings of Judah and Israel. Ahaz died and was buried in the city, in Jerusalem, but they did not lay him in the tombs of the kings of Israel. His son Hezekiah became king in his place.

notes:
  - ref: 5
    phrase: delivered him into the hand of the king of Syria
    kind: history
    title: Defeated in the field, spared in Jerusalem
    body: |
      Chronicles tells the war of Syria and Israel against Judah as two defeats in the field, where Kings and Isaiah tell of a siege that failed. Kings says that Rezin and Pekah “besieged Ahaz, but could not overcome him,” and that Rezin took Elath from Judah ([[2 Kgs. 16:5]]–6), and Isaiah begins from the same failure ([[Isa. 7:1]], where the site's note gives the war's background). Chronicles adds what happened outside the walls. Syria defeated Ahaz and carried a great multitude to Damascus; Pekah slew a hundred and twenty thousand in one day, an Ephraimite warrior killed the king's son, the governor of his house and the man next to the king, and two hundred thousand women and children were carried to Samaria (verses 5–8). How figures this large may be read is explained at [[2 Sam. 24:9]] on the site.

      Chronicles also gives the reason, twice: the LORD “delivered him” (verse 5), and the men fell “because they had forsaken the LORD God of their fathers” (verse 6). In Chronicles “rewards and punishments are not usually delayed” (the note on [[2 Chr. 36:14]] compares the two books), and the defeats come in Ahaz's own reign, told right after the idolatry of verses 2–4.
    sources: [lds-scriptures, sc-knowhy-861]

  - ref: 9
    phrase: But a prophet of the LORD was there, whose name was Oded
    kind: history
    title: Oded, a prophet in Samaria
    body: |
      Oded is a prophet of the LORD in Samaria, and Chronicles gives him only this scene, in which his word turned an army back. (The name appears earlier for the father of Azariah, who prophesied to Asa, [[2 Chr. 15:1]], 8.) He went out to meet the soldiers bringing their captives home and made three points. The LORD had given them the victory: He was wroth with Judah and “hath delivered them into your hand” (verse 9). Yet they had gone further and slain “in a rage that reacheth up unto heaven.” And they were not innocent themselves: “are there not with you, even with you, sins against the LORD your God?” (verse 10). So, he said, send the captives back, “for the fierce wrath of the LORD is upon you” (verse 11).

      Four heads of Ephraim, named in verse 12, took up his words as their own. They stood against the returning army and refused to let the captives in, because this would add “to our sins and to our trespass: for our trespass is great, and there is fierce wrath against Israel” (verse 13). The soldiers gave way and left the captives and the spoil before the princes and the whole congregation (verse 14).
    sources: [lds-scriptures]

  - ref: 10
    phrase: to keep under the children of Judah and Jerusalem for bondmen and bondwomen
    kind: scripture
    title: Brethren made bondmen
    body: |
      “Keep under … for bondmen and bondwomen” means that Israel's army meant to make slaves of the people it had captured from Judah. “Keep under” is *likbōš*, from *kābaš*, “to subdue”; joined to “for bondmen,” it means “bring into bondage,” and it has that sense in two other places, both about the enslaving of fellow Israelites: in Nehemiah, where Jews were bringing their own sons and daughters into bondage to fellow Jews ([[Neh. 5:5]]), and in Jeremiah, where the men of Jerusalem freed their Hebrew servants under Zedekiah and then “brought them into subjection” again ([[Jer. 34:11]], 16).

      The chapter twice calls the captives Israel's own brethren: Israel carried away captive “of their brethren” (verse 8), and Oded tells the army to send back the captives taken “of your brethren” (verse 11). The Church's footnote to “captives” in verse 11 points to modern revelation for the principle: “it is not right that any man should be in bondage one to another” ([[D&C 101:79]]).
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 19
    phrase: for he made Judah naked
    kind: words
    title: Made Judah naked
    body: |
      “Made Judah naked” means that Ahaz let all restraint go in Judah; it is not about clothing. The verb is *hiprîaʿ*, from *pāraʿ*, “to let go, let loose,” and in this verse it means to “shew lack of restraint.” The Church's footnote points to the golden calf, where the King James translation also has “naked” for this verb: Moses saw that the people were naked, “for Aaron had made them naked unto their shame among their enemies” ([[Ex. 32:25]]). There too the verb means to “let loose people, i.e. remove restraint from them.” In both places a leader has let the people loose from the LORD's restraint, and the verse adds that Ahaz “transgressed sore against the LORD.”
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 20
    phrase: distressed him, but strengthened him not
    kind: history
    title: Help that did not help
    body: |
      Chronicles says that Assyria's help was no help, where Kings tells what that help achieved. In Kings the king of Assyria “hearkened unto him,” took Damascus and slew Rezin ([[2 Kgs. 16:9]]; the site's notes on 2 Kings 16 tell the bargain). Chronicles leaves the conquest out and gives the outcome as Judah felt it: Tilgath-pilneser “distressed him, but strengthened him not,” and the treasure Ahaz took from the house of the LORD, the palace and the princes “helped him not” (verse 21), words that answer the help Ahaz sent for in verse 16. On one older reading the two accounts do not conflict. The Assyrian campaign did end the threat from Rezin and Pekah, but Tiglath-pileser fought it to extend his own power, kept what he took, and oppressed Ahaz, as Kings itself shows when Hezekiah later “rebelled against the king of Assyria, and served him not” ([[2 Kgs. 18:7]]).

      The cost was more than silver. Ahaz was willing to enter a vassal treaty with Tiglath-pileser, with the loyalty oath that came with it (“I am thy servant and thy son,” he wrote, [[2 Kgs. 16:7]]), and “loyalty to Assyria came with a temporal price of a yearly tribute but also a spiritual price of trusting Assyria to fight their battles rather than relying on faith in Jehovah.” Isaiah had told him in this very war, “Take heed, and be quiet; fear not” ([[Isa. 7:4]]). “In the time of his distress” (verse 22) Ahaz turned to the gods of Damascus, reasoning that since they helped the kings of Syria, “therefore will I sacrifice to them, that they may help me”; and “they were the ruin of him, and of all Israel” (verse 23).
    sources: [lds-scriptures, keil-chronicles, pierce-israelite-refugees]

  - ref: 24
    phrase: shut up the doors of the house of the LORD
    kind: history
    title: The doors shut
    body: |
      Chronicles alone says that Ahaz shut the doors of the temple, and the next chapter shows what that meant. Kings tells that he stripped the bronze from the temple's stands and its sea ([[2 Kgs. 16:17]]); Chronicles says that he cut in pieces the vessels of the house of God, shut its doors, and made himself altars in every corner of Jerusalem and high places in every city of Judah (verses 24–25). In the first month of his reign Hezekiah “opened the doors of the house of the LORD, and repaired them” ([[2 Chr. 29:3]]), and he named what had stopped behind them: the fathers “have shut up the doors of the porch, and put out the lamps, and have not burned incense nor offered burnt offerings in the holy place unto the God of Israel” ([[2 Chr. 29:7]]).

      A reader of Kings may wonder how the doors could be shut when Ahaz had the morning and evening offerings burned on his new altar ([[2 Kgs. 16:15]]). One older reading answers that the doors were those of the porch, before the holy place and the most holy, so that the service inside the house stopped while sacrifice went on at the altar in the court, and that sacrifice on an altar built after a heathen pattern was not sacrifice to the God of Israel.
    sources: [lds-scriptures, keil-chronicles]

christ: |
  Ahaz looked for help to the kings of Assyria and to the gods of Damascus, and none of them helped him (verses 16, 21, 23). The help he passed over was offered to him in the same war: Isaiah told him to “fear not” ([[Isa. 7:4]]), Ahaz answered, “I will not ask” ([[Isa. 7:12]]), and the Lord gave the house of David a sign anyway, a virgin's son called Immanuel, whom Matthew names as Jesus, “God with us” ([[Isa. 7:14]]; [[Matt. 1:23]]; the site's notes on [[Isa. 7]] tell it).

  Trust placed in the world's powers instead of the Lord carries a spiritual price as well as a temporal one, as it did for Ahaz (the note at verse 20). The presence Isaiah offered Ahaz in his distress has a name in the Gospel: Jesus Christ, God with us. A disciple has Him in distress; Ahaz, in his, looked elsewhere.

explore: |
  - **Isaiah meets Ahaz.** [[Isa. 7:1–16]], the prophet's counsel in the war of verses 5–8 and the sign of Immanuel, with the site's notes.
  - **The same reign in Kings.** [[2 Kgs. 16:1–20]], the bribe to Assyria and the altar from Damascus.
  - **The doors opened.** [[2 Chr. 29:1–19]], Hezekiah's first month: the doors repaired and the house cleansed.

