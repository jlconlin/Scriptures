chapter: 36
title: Because He Had Compassion on His People
tagline: Four kings follow Josiah in quick succession, the last of them deaf to Jeremiah; the LORD's messengers are mocked, the house is burned and Judah is carried to Babylon; then Cyrus of Persia bids the LORD's people go up.
when: 'From the death of Josiah to the first year of Cyrus king of Persia: the reigns of Jehoahaz, Jehoiakim, Jehoiachin and Zedekiah, the burning of the house of God, and the exile “until the reign of the kingdom of Persia” (verse 20)'

setting: |
  The last chapter of Chronicles moves fast. Four kings follow Josiah, and the Chronicler gives each little more than his age, the length of his reign and a verdict. The fuller story is in [[2 Kgs. 23:31–25:30]] and [[Jer. 52]], where the chapter's footnotes send the reader, and the site's notes there are not repeated here. Chronicles passes over much of it: Jehoiakim's revolt, the long siege, Zedekiah's flight and blinding, Gedaliah, Jehoiachin's release from prison. In their place it sets a summary of its own (verses 14–21): priests and people polluted the house, the LORD sent His messengers again and again, the people mocked them, and the land kept the sabbaths it had been denied. Both the sins and the judgment are drawn there not in historical order but “rhetorically in its great general outlines.”

  The last two verses jump to the first year of Cyrus. They are also the opening of Ezra ([[Ezra 1:1–3]]). For readers of the Book of Mormon this is familiar ground: Lehi's call came “in the commencement of the first year of the reign of Zedekiah” ([[1 Ne. 1:4]]), the king set up in verse 10; the note at [[2 Kgs. 24:17]] takes up the date of Zedekiah's accession and the question of when Lehi left. The rulers and dates are in [Babylon and the Exile](/old-testament/guides/babylon-and-the-exile/#rulers) and, for Cyrus, [Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers).

thread: |
  The chapter turns on a word the Chronicler has watched for since Solomon: humble. The LORD had promised that if His people would “humble themselves, and pray, and seek my face, and turn from their wicked ways,” He would hear, forgive and heal ([[2 Chr. 7:14]]). Manasseh, carried to Babylon in fetters, “humbled himself greatly” and was heard ([[2 Chr. 33:12–13]]). Zedekiah “humbled not himself before Jeremiah” (verse 12), with the same Hebrew verb, and would not turn (verse 13).

  Then the chapter says what the LORD had been doing all along. He sent His messengers early and often, “because he had compassion on his people, and on his dwelling place” (verse 15). They were mocked “till there was no remedy,” no healing left (verse 16). The house the LORD had hallowed was burned, its vessels carried to Babylon, and the land lay empty and rested.

  The book does not end in the ashes. The word of Jeremiah that set seventy years for the exile also set their end, and the LORD stirred up a Persian king to send His people home and build His house again. The last words are an invitation: “let him go up.”

sections:
  - range: 1-4
    heading: Jehoahaz, deposed by Egypt
    plain: |
      The people of the land took Josiah's son Jehoahaz and made him king in Jerusalem in his father's place. Jehoahaz was twenty-three when he became king, and he reigned three months in Jerusalem. Then the king of Egypt deposed him in Jerusalem and fined the land a hundred talents of silver and a talent of gold. The king of Egypt made Jehoahaz's brother Eliakim king over Judah and Jerusalem and changed his name to Jehoiakim. Necho took Jehoahaz his brother and carried him off to Egypt.
  - range: 5-8
    heading: Jehoiakim
    plain: |
      Jehoiakim was twenty-five when he became king, and he reigned eleven years in Jerusalem. He did what was evil in the sight of the LORD his God. Nebuchadnezzar king of Babylon came up against him and bound him in bronze chains to take him to Babylon. Nebuchadnezzar also took some of the vessels of the LORD's house to Babylon and put them in his temple there. The rest of Jehoiakim's acts, the abominations he committed and what was found against him, are written in the book of the kings of Israel and Judah. His son Jehoiachin reigned in his place.
  - range: 9-10
    heading: Jehoiachin
    plain: |
      Jehoiachin was eight years old when he became king, and he reigned three months and ten days in Jerusalem. He did what was evil in the sight of the LORD. At the turn of the year King Nebuchadnezzar sent and brought him to Babylon, with the precious vessels of the LORD's house, and made his brother Zedekiah king over Judah and Jerusalem.
  - range: 11-16
    heading: Zedekiah, and the messengers mocked
    plain: |
      Zedekiah was twenty-one when he became king, and he reigned eleven years in Jerusalem. He did what was evil in the sight of the LORD his God, and he did not humble himself before Jeremiah the prophet, who spoke for the LORD. He also rebelled against King Nebuchadnezzar, who had made him swear an oath by God. He stiffened his neck and hardened his heart against turning to the LORD God of Israel. All the leaders of the priests, and the people too, were more and more unfaithful, following all the abominations of the nations, and they defiled the house of the LORD that He had made holy in Jerusalem. The LORD, the God of their fathers, sent word to them by His messengers, early and persistently, because He had compassion on His people and on His dwelling place. But they mocked God's messengers, despised His words and scoffed at His prophets, until the LORD's wrath rose against His people and there was no healing left.
  - range: 17-21
    heading: The house burned
    plain: |
      So He brought against them the king of the Chaldeans, who killed their young men with the sword in their own sanctuary and spared neither young man nor young woman, old man nor the aged. God gave them all into his hand. He carried to Babylon all the vessels of God's house, great and small, the treasures of the LORD's house and the treasures of the king and his princes. They burned God's house, broke down the wall of Jerusalem, burned all its palaces and destroyed all its precious things. Those who survived the sword he carried away to Babylon, where they served him and his sons until the kingdom of Persia came to power. So the word of the LORD through Jeremiah was fulfilled, until the land had enjoyed its sabbaths: all the time it lay desolate it kept sabbath, to complete seventy years.
  - range: 22-23
    heading: The decree of Cyrus
    plain: |
      In the first year of Cyrus king of Persia, so that the word of the LORD spoken through Jeremiah would be fulfilled, the LORD stirred the spirit of Cyrus king of Persia, and he sent a proclamation throughout his kingdom and put it in writing: “This is what Cyrus king of Persia says: The LORD, the God of heaven, has given me all the kingdoms of the earth, and He has charged me to build Him a house in Jerusalem, which is in Judah. Whoever among you belongs to His people, may the LORD his God be with him, and let him go up.”

notes:
  - ref: 6
    phrase: bound him in fetters, to carry him to Babylon
    kind: history
    title: Did Jehoiakim go to Babylon?
    body: |
      Chronicles says Nebuchadnezzar bound Jehoiakim in order “to carry him to Babylon,” and does not say he got there; the other accounts point the other way. Kings says only that Jehoiakim “slept with his fathers: and Jehoiachin his son reigned in his stead” ([[2 Kgs. 24:6]]), and Jeremiah had foretold for him “the burial of an ass, drawn and cast forth beyond the gates of Jerusalem” ([[Jer. 22:19]]).

      Two older readings explain the account differently. One takes the verse as it stands. The fetters belong to Nebuchadnezzar's first campaign against Judah, the one Daniel dates to Jehoiakim's reign ([[Dan. 1:1–2]]; the note there takes up the year). Nebuchadnezzar meant to deport the king but in the end left him on the throne as his vassal, and the Chronicler assumed as much, since verse 8 closes the reign with the formula used for every king whose son succeeded him at his death. The other holds that Jehoiakim was probably never taken to Babylon at all: he died in Judah, how is not known, during the raids that followed his revolt ([[2 Kgs. 24:1–2]]), and it was his son who was carried off three months later, so that the Chronicler “seems to foreshorten the history at this point.” The text does not settle it.
    sources: [keil-chronicles, cambridge-chronicles, lds-scriptures]

  - ref: 9
    phrase: Jehoiachin was eight years old
    kind: words
    title: Eight or eighteen
    body: |
      The Hebrew of Chronicles makes Jehoiachin eight years old, and Kings makes him eighteen ([[2 Kgs. 24:8]]); the Church's footnote gives “OR eighteen.” The ancient versions are divided. The chief manuscript of the Septuagint (Codex Vaticanus) reads eight with the Hebrew, while a few Hebrew manuscripts, the Syriac and Arabic versions and many manuscripts of the Septuagint read eighteen in Chronicles too. Eight is probably a copyist's slip for eighteen, and the odd “and ten days” in the same verse may be a stray piece of an original “eighteen years old.” Both are judgments on the text; the Hebrew as it stands reads eight.
    sources: [lds-scriptures, keil-chronicles, cambridge-chronicles]

  - ref: 10
    phrase: made Zedekiah his brother king over Judah and Jerusalem
    kind: history
    title: Brother or uncle?
    body: |
      Zedekiah was Jehoiachin's uncle, not his brother: Kings calls him “his father's brother” ([[2 Kgs. 24:17]]), and Chronicles' own list of Josiah's sons names “the third Zedekiah” ([[1 Chr. 3:15]]). He is the Zedekiah of Lehi's call ([[1 Ne. 1:4]]; see the Background above).
    sources: [lds-scriptures]

  - ref: 12
    phrase: humbled not himself before Jeremiah the prophet speaking from the mouth of the LORD
    kind: scripture
    title: The king who would not humble himself
    body: |
      Zedekiah's failure is named with the verb of the LORD's promise to Solomon. “Humbled” is the Hebrew *kanaʿ*, the verb of “If my people … shall humble themselves” ([[2 Chr. 7:14]]; the note there), and of Manasseh, who in his affliction “humbled himself greatly before the God of his fathers” and was heard ([[2 Chr. 33:12]]). Verse 13 adds that Zedekiah hardened his heart “from turning unto the LORD God of Israel,” and that verb is the “turn” of the same promise. Chronicles holds the last king of Judah to the measure it set at the dedication of the house, and he would not meet it.

      The verse names the man he would not humble himself before, and the book of Jeremiah records what Jeremiah told him. When Zedekiah sent to ask him to inquire of the LORD, the answer was that the LORD would deliver king and city into Nebuchadrezzar's hand ([[Jer. 21:1–7]], where the footnote points). In the last siege, when the king asked him in secret, Jeremiah offered a way out: “If thou wilt assuredly go forth unto the king of Babylon's princes, then thy soul shall live, and this city shall not be burned with fire” ([[Jer. 38:17]]). Zedekiah answered, “I am afraid” ([[Jer. 38:19]]). His broken oath to Nebuchadnezzar (verse 13) is explained at [[2 Kgs. 24:17]] and [[2 Kgs. 25:6]].
    sources: [oshb-wlc, lds-scriptures]

  - ref: 14
    phrase: polluted the house of the LORD which he had hallowed in Jerusalem
    kind: history
    title: Why Jerusalem fell, as Chronicles tells it
    body: |
      Chronicles lays the fall on the generation that saw it, priests and people together, where Kings traces it back to Manasseh. Kings says the LORD did not turn from His wrath “because of all the provocations that Manasseh had provoked him withal” ([[2 Kgs. 23:26]]; [[2 Kgs. 24:3]]), a punishment delayed until long after the king who earned it. Chronicles, which has told Manasseh's repentance ([[2 Chr. 33:12–13]]), names no ancestor here. It names “all the chief of the priests, and the people,” who followed the abominations of the nations and defiled the house the LORD had hallowed; the footnote sends the reader to what Lehi saw of those abominations ([[1 Ne. 1:13]]; [[1 Ne. 1:19]]).

      The difference is one of timing. In Chronicles, “rewards and punishments are not usually delayed,” and so its answer is that God punished the wicked people of Jerusalem by not protecting them from Babylon. The two books need each other, since “people are not punished for the sins of others, yet the sins of others can cause terrible things to happen in people's lives.” Kings' account and the site's notes on it stand beside this one.
    sources: [sc-knowhy-861, lds-scriptures]

  - ref: 15
    phrase: because he had compassion on his people, and on his dwelling place
    kind: scripture
    title: Prophets sent in compassion
    body: |
      Before he tells the burning, the Chronicler gives the reason for the warnings: the LORD sent His messengers because He pitied His people and His house. “Rising up betimes, and sending” means early and promptly (the footnote); it is the idiom of eagerness and persistence that Jeremiah uses of the LORD's sending (the note at [[Jer. 25:3]]).

      The messengers were prophets, and more of them than the Bible names. Nine prophets known from the Bible were active in the late seventh and early sixth centuries B.C., “a remarkably high number,” and this verse and [[Jer. 25:4]] suggest there may have been others besides. Lehi was among those who taught at Jerusalem. His experience is verse 16 in one life: “the Jews did mock him because of the things which he testified of them” ([[1 Ne. 1:19]]).
    sources: [lds-scriptures, ot-seminary-lesson-102, sc-knowhy-441]

  - ref: 16
    phrase: till there was no remedy
    kind: words
    title: No healing left
    body: |
      “No remedy” is “no healing”: the Hebrew word means healing or cure, and this verse is one of its uses for a nation's wounds, beside Jeremiah's lament, “why hast thou smitten us, and there is no healing for us?” ([[Jer. 14:19]]). The people's sickness had gone past cure.

      Verses 15 and 16 stand side by side in the text. The LORD's compassion sent messengers early and often; the people mocked them, despised His words and scoffed at His prophets, until the healing those messengers offered was no longer to be had.
    sources: [bdb, oshb-wlc]

  - ref: 21
    phrase: until the land had enjoyed her sabbaths
    kind: scripture
    title: The land’s sabbaths
    body: |
      Verse 21 gives the exile two purposes at once: it fulfilled Jeremiah's word, and it gave the land the rest Israel had withheld. Every seventh year the land, as the LORD's, was to keep a sabbath and lie unworked ([[Lev. 25:2–7]]), and the law had warned that if Israel would not keep it, exile would: “Then shall the land enjoy her sabbaths, as long as it lieth desolate, and ye be in your enemies' land” ([[Lev. 26:34]]; the note there). The law of the sabbatical year “was habitually broken by the Jews for a long period before the Babylonian exile,” and the seventy years of desolation “were regarded as making up for the unobserved Sabbaths of the land.”

      The seventy years themselves are Jeremiah's ([[Jer. 25:11–12]]; [[Jer. 29:10]]), and the notes there explain how they are counted. Verse 20 measures the same span by empires: the captives served Nebuchadnezzar and his sons “until the reign of the kingdom of Persia.”
    sources: [bd-sabbatical-year, lds-scriptures]

  - ref: 23
    phrase: let him go up
    kind: history
    title: Let him go up
    body: |
      Chronicles ends with Cyrus's decree cut off at its invitation, and the rest of the sentence is in Ezra. There it goes on, “let him go up to Jerusalem, which is in Judah, and build the house of the LORD God of Israel” ([[Ezra 1:3]]), and Ezra and Nehemiah “may be regarded as a sequel” to Chronicles. One older reading holds that the Chronicler closed “with this comforting prospect for the future” and left the full edict, and the return it began, to be told in that other book. In the Hebrew order of the books Chronicles stands last, so that these are “the last words of the Old Testament” in that order.

      The ending fits what the book was for. The Chronicler wrote after the exile “to give hope,” to build an identity on worship, and to legitimize the newly rebuilt temple; the book that began with Adam ([[1 Chr. 1:1]]) closes on a call to go up and build the house again. Why a Persian king gave the order is taken up at [[Ezra 1:1]], and Isaiah's naming of Cyrus at [[Isa. 44:28]].
    sources: [bd-chronicles, keil-chronicles, cambridge-chronicles, sc-knowhy-861]

christ: |
  Jehovah, the premortal Jesus Christ, sent His messengers early and often “because he had compassion on his people” (verse 15). His compassion came before the judgment, and after the judgment He stirred up Cyrus to send His people home and build His house again (verses 22–23).

  The Lord sends prophets today for the same reason He sent them to Jerusalem: out of compassion, to warn of the consequences of sin before they come. The promise Zedekiah would not meet still stands: those who humble themselves and turn will be heard, forgiven and healed ([[2 Chr. 7:14]]).

explore: |
  - **The same fall in Kings and Jeremiah.** [[2 Kgs. 24–25]] and [[Jer. 52]], with the details Chronicles leaves out.
  - **Lehi in Zedekiah's Jerusalem.** [[1 Ne. 1:4–20]], one of the messengers of verse 15.
  - **Jeremiah and Zedekiah.** [[Jer. 37–38]], the king who asked the prophet in secret and would not obey.
  - **The return the decree opened.** [[Ezra 1–3]].

