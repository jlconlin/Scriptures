chapter: 21
title: The LORD Would Not Destroy the House of David
tagline: Jehoram kills his brothers, marries into Ahab's house and leads Judah after its gods. A writing from Elijah names his sins and his sentence, and every line of it comes true; yet for the covenant's sake David's house is kept.
when: 'The eight-year reign of Jehoram son of Jehoshaphat in Jerusalem, after his father''s death (verses 1, 5)'

setting: |
  Jehoshaphat, the king who sought the LORD through chapters 17–20, has died, and his firstborn Jehoram reigns. The same reign is told briefly in [[2 Kgs. 8:16–24]], and verses 5–10 here follow Kings closely. The site's notes there explain what both share: the two kings named Jehoram, one in Samaria and one in Jerusalem ([[2 Kgs. 1:17]]); the light promised to David ([[2 Kgs. 8:19]]); and the loss of Edom and Libnah ([[2 Kgs. 8:20]]). The marriage that bound Judah's royal house to Ahab's is introduced at [[2 Chr. 18:1]], and Jehoram's wife, “the daughter of Ahab” (verse 6), steps forward in the next chapter as Athaliah, called there “the daughter of Omri,” Ahab's father ([[2 Chr. 22:2]]; [[2 Kgs. 8:26]]).

  The rest is Chronicles' own: the murder of Jehoram's brothers (verses 2–4), the high places and the writing from Elijah (verses 11–15), the raid of the Philistines and Arabians (verses 16–17), and the king's death and burial (verses 18–20), which Kings tells in a single verse. Chronicles calls Jehoshaphat “king of Israel” (verse 2) and Jehoram's victims “princes of Israel” (verse 4) because in this book Israel is the covenant people, Judah included; in Kings the name generally means the northern kingdom.

thread: |
  The chapter is a reign measured against a prophet's word. Jehoram began by killing his brothers and walked “in the way of the kings of Israel, like as did the house of Ahab” (verse 6). Chronicles adds what Kings leaves unsaid, that Libnah revolted “because he had forsaken the LORD God of his fathers” (verse 10).

  Then a writing came from Elijah. It names two sins, leading Judah after the gods of Ahab's house and slaying brothers “better than thyself,” and it sets out two sentences: a great plague on his people, his children, his wives and his goods, and a disease of the bowels (verses 12–15). The rest of the chapter carries out the letter clause by clause. The LORD stirred up the Philistines and Arabians, who carried off the king's goods, wives and sons (verses 16–17); then the LORD smote him with the disease, and after two years he died of it (verses 18–19). In Chronicles a king's sin and its reward often meet within his own lifetime, as they do here.

  One clause runs the other way. “Howbeit the LORD would not destroy the house of David, because of the covenant that he had made with David” (verse 7). Jehoram's house was stripped to one son (verse 17), and the next chapter opens with that son on David's throne ([[2 Chr. 22:1]]).

sections:
  - range: 1-7
    heading: Jehoram takes the throne
    plain: |
      Jehoshaphat died and was buried with his ancestors in the city of David, and his son Jehoram became king after him. Jehoram had brothers, sons of Jehoshaphat: Azariah, Jehiel, Zechariah, Azariah, Michael and Shephatiah; all these were sons of Jehoshaphat king of Israel. Their father had given them generous gifts of silver, gold and valuables, along with fortified cities in Judah, but he gave the kingdom to Jehoram because he was the firstborn. When Jehoram had taken over his father's kingdom and made himself secure, he killed all his brothers with the sword, and some of the princes of Israel as well.

      Jehoram was thirty-two years old when he became king, and he reigned eight years in Jerusalem. He followed the ways of the kings of Israel, as the house of Ahab had done, for he had married Ahab's daughter, and he did what was evil in the LORD's sight. Yet the LORD was not willing to destroy the house of David, because of the covenant He had made with David, and because He had promised to give a light to him and to his sons for ever.
  - range: 8-11
    heading: Edom and Libnah revolt
    plain: |
      In his days Edom rebelled against Judah's rule and set up a king of its own. So Jehoram crossed over with his commanders and all his chariots. He rose up at night and struck the Edomites who had surrounded him, and the commanders of their chariots. But Edom has remained in revolt against Judah to this day. Libnah also revolted at that same time, because he had forsaken the LORD, the God of his ancestors. Moreover, he built high places in the hill country of Judah, made the people of Jerusalem unfaithful to the LORD, and led Judah astray.
  - range: 12-15
    heading: A writing from Elijah
    plain: |
      Then a letter came to him from Elijah the prophet, saying: “This is what the LORD, the God of your father David, says: You have not walked in the ways of your father Jehoshaphat or in the ways of Asa king of Judah. You have walked in the way of the kings of Israel, and you have made Judah and the people of Jerusalem unfaithful, just as the house of Ahab did. You have also killed your own brothers, your father's family, men better than you. So the LORD is about to strike your people, your sons, your wives and all your possessions with a heavy blow. And you yourself will suffer a severe illness, a disease of the bowels, until your bowels come out because of the sickness, day after day.”
  - range: 16-20
    heading: The word fulfilled
    plain: |
      The LORD stirred up against Jehoram the spirit of the Philistines and of the Arabians who lived near the Ethiopians. They came up against Judah, broke into it, and carried off all the possessions found belonging to the king's house, along with his sons and his wives, so that no son was left to him except Jehoahaz, the youngest.

      After all this the LORD struck him with an incurable disease of the bowels. In the course of time, at the end of two years, his bowels came out because of the disease, and he died in great suffering. His people made no burning of spices in his honor, as they had for his ancestors. He was thirty-two years old when he became king, and he reigned eight years in Jerusalem. He departed with no one sorry to see him go. They buried him in the city of David, but not in the tombs of the kings.

notes:
  - ref: 4
    phrase: slew all his brethren with the sword
    kind: history
    title: Brothers better than himself
    body: |
      Chronicles alone tells that Jehoram secured his throne by killing his six brothers, with some of the princes of Israel besides; Kings does not mention it. Their father had given each of them silver, gold and precious things “with fenced cities in Judah,” but the kingdom to the firstborn (verse 3).

      The text gives no motive for the killings. What it gives is the LORD's judgment of them in Elijah's writing: the brothers were “better than thyself,” and their murder is named as a sin of its own, beside the idolatry (verse 13).
    sources: [lds-scriptures]

  - ref: 12
    phrase: there came a writing to him from Elijah the prophet
    kind: history
    title: A writing from Elijah
    body: |
      This is the only writing of Elijah that scripture mentions, and it is one of the details Chronicles gives that Samuel and Kings do not. It raises a question of timing that the text does not settle. Kings tells of Elijah's going up “by a whirlwind into heaven” ([[2 Kgs. 2:11]]), his translation, before it comes to Jehoram of Judah's reign ([[2 Kgs. 8:16]]), and while Jehoshaphat still lives it introduces Elisha as the one “which poured water on the hands of Elijah” ([[2 Kgs. 3:11]]), which one older commentary takes to mean that Elisha had already taken Elijah's place. How Elijah's writing reached Jehoram after Jehoshaphat's death, Chronicles does not say.

      One older reading holds that the time of Elijah's translation cannot be fixed exactly, and that he may still have been living when Jehoram killed his brothers. The same reading allows that if Elijah had already been taken, the LORD may have shown him Jehoram's wickedness beforehand and had him write the warning to be delivered when the time came; it rejects the idea of a letter sent down from heaven. No Latter-day Saint source read for this chapter takes up the question.

      What the text does make plain is whose word the writing carries. It opens “Thus saith the LORD God of David thy father” and judges Jehoram by the ways of his father Jehoshaphat and of Asa king of Judah (verse 12).
    sources: [lds-scriptures, ot-seminary-chronicles-intro, cambridge-chronicles, bd-elijah, keil-chronicles]

  - ref: 17
    phrase: save Jehoahaz, the youngest of his sons
    kind: words
    title: Jehoahaz, also called Ahaziah
    body: |
      The son who survived the raid is the king the next chapter calls Ahaziah ([[2 Chr. 22:1]]), and the Church's footnote and Bible Dictionary give that name here; the Dictionary also lists Azariah as one of his names ([[2 Chr. 22:6]]). Jehoahaz and Ahaziah are made of the same two parts in reverse order: the divine name, at the front in *Jeho*-ahaz and at the end in Ahaz-*iah*, and the verb meaning to grasp or take hold. The Hebrew lexicon gives the meaning of Jehoahaz as Jehovah “hath grasped” and sets Ahaziah beside it.

      Chronicles explains why the youngest reigned: “the band of men that came with the Arabians to the camp had slain all the eldest” ([[2 Chr. 22:1]]).
    sources: [lds-scriptures, bd-ahaziah, bdb]

  - ref: 20
    phrase: departed without being desired
    kind: history
    title: Buried without honor
    body: |
      The last verses tell Jehoram's burial as three things withheld from him. His people made “no burning for him, like the burning of his fathers” (verse 19). The burning was of spices and sweet odours: at Asa's burial they laid him in a bed “filled with sweet odours and divers kinds of spices” and “made a very great burning for him” ([[2 Chr. 16:14]]), and Jeremiah promised Zedekiah that “with the burnings of thy fathers … so shall they burn odours for thee” ([[Jer. 34:5]]). He “departed without being desired”: no one was sorry to see him go. And though he was buried in the city of David, it was “not in the sepulchres of the kings.”

      Kings says only that he “was buried with his fathers in the city of David” ([[2 Kgs. 8:24]]). Chronicles records the same refusal of the royal tombs for Joash, “for the blood of the sons of Jehoiada” ([[2 Chr. 24:25]]), and for Ahaz ([[2 Chr. 28:27]]).
    sources: [lds-scriptures]

christ: |
  Jehoram killed his brothers and led Judah in the way of Ahab's house, and still “the LORD would not destroy the house of David, because of the covenant that he had made with David” (verse 7). Psalm 89 sets out the terms of that covenant: if David's children forsake the LORD's law, “then will I visit their transgression with the rod … Nevertheless my lovingkindness will I not utterly take from him … My covenant will I not break” ([[Ps. 89:32–34]]). That covenant is fulfilled in Jesus Christ, of whom the angel said, “the Lord God shall give unto him the throne of his father David” ([[Luke 1:32]]).

  Jehoram suffered for his sins, and the covenant still held. The Lord's faithfulness to His covenants does not depend on the faithfulness of those who inherit them, and it is the ground a disciple stands on in turning back to Him.

explore: |
  - **The same reign in Kings.** [[2 Kgs. 8:16–24]], with the site's notes on the light for David and the revolt of Edom.
  - **What became of the one son.** [[2 Chr. 22:1–12]], Ahaziah's year and Athaliah's attempt to destroy the royal seed.
  - **Elijah's last days.** [[2 Kgs. 1–2]], his word to Ahaziah of Israel and his taking up.
  - **The covenant with David.** [[2 Sam. 7:12–16]] and [[Ps. 89:19–37]].

