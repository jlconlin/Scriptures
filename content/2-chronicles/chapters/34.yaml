chapter: 34
title: He Began to Seek After the God of David
tagline: Josiah seeks the LORD as a youth and clears the idols from Judah and from the ruined cities of the north; the book of the law is found as the temple is repaired, Huldah answers that the judgment will stand but the king who humbled himself is heard, and Josiah binds the people to the covenant.
when: 'The reign of Josiah king of Judah, from his eighth year, when he began to seek the LORD (verse 3), to his eighteenth, when the book of the law was found (verse 8)'

setting: |
  Josiah comes to the throne at eight (verse 1), after Manasseh's long reign and Amon's short one ([[2 Chr. 33:20–25]]). Kings tells his reign in [[2 Kgs. 22]]–23, and the site's notes there explain the boy king ([[2 Kgs. 22:1]]), what the book Hilkiah found was ([[2 Kgs. 22:8]]), who Huldah was ([[2 Kgs. 22:14]]), the tender heart ([[2 Kgs. 22:19]]), the promise that he would die “in peace” though he fell in battle ([[2 Kgs. 22:20]]), and the covenant the people stood to ([[2 Kgs. 23:3]]). Those notes are not repeated here.

  Chronicles tells the same reign in a different order. Kings sets the whole reform in the eighteenth year, around the finding of the book; Chronicles begins it ten years earlier, sums up the purge of the land in a few verses (3–7), and keeps the events apart by date, then tells Josiah's Passover at length in the next chapter, where Kings gives it three verses. Prophets were at work in these years: the word of the LORD came to Jeremiah “in the thirteenth year of his reign” ([[Jer. 1:2]]).

thread: |
  The chapter moves from seeking to hearing. Josiah begins to seek the God of David while he is still young (verse 3), before the book of the law was found and read to him, and what he does with that seeking is clear the land and then the house (verses 3–13). In the house the book is found, and what it tells him is that the land was still under the LORD's wrath: “great is the wrath of the LORD that is poured out upon us, because our fathers have not kept the word of the LORD” (verse 21).

  Huldah's answer divides the judgment from the man. The curses written in the book will come upon Jerusalem, and the wrath “shall not be quenched” (verse 25); why even this reform could not turn it is explained at [[2 Kgs. 22:17]] and [[2 Kgs. 23:26]]. But the king who humbled himself when he heard is heard in turn (verse 27), and his eyes will not see the evil. Josiah's response is to read the book to everyone, great and small, and to bind king and people to it. The last verse names both the reach of that covenant and its limit: “all his days they departed not from following the LORD.”

sections:
  - range: 1-7
    heading: A young king purges the land
    plain: |
      Josiah was eight years old when he became king, and he reigned thirty-one years in Jerusalem. He did what was right in the LORD's sight and walked in the ways of his forefather David, turning aside neither to the right nor to the left. In the eighth year of his reign, while he was still young, he began to seek the God of his forefather David, and in the twelfth year he began to cleanse Judah and Jerusalem of the high places, the sacred poles of Asherah, and the carved and cast idols. In his presence they tore down the altars of the Baals, and he cut down the sun-images that stood above them. He smashed the sacred poles and the carved and cast images, ground them to dust, and scattered the dust on the graves of those who had sacrificed to them. He burned the bones of their priests on their own altars, and so cleansed Judah and Jerusalem. He did the same in the cities of Manasseh, Ephraim and Simeon, as far as Naphtali, with their tools (or, in their ruins) all around. When he had torn down the altars and the sacred poles, beaten the carved images to powder and cut down all the idols throughout the land of Israel, he returned to Jerusalem.
  - range: 8-13
    heading: The house of the LORD repaired
    plain: |
      In the eighteenth year of his reign, when he had cleansed the land and the temple, he sent Shaphan son of Azaliah, Maaseiah the governor of the city, and Joah son of Joahaz the recorder to repair the house of the LORD his God. They came to Hilkiah the high priest and handed over the money brought into the house of God, which the Levites who kept the doors had collected from Manasseh and Ephraim, from all the rest of Israel, and from all Judah and Benjamin; then they returned to Jerusalem. They gave it to the men in charge of the work on the LORD's house, who paid the workmen repairing and restoring it: the craftsmen and builders, to buy cut stone and timber for the joists and to lay beams for the buildings the kings of Judah had destroyed. The men worked faithfully. Over them were Jahath and Obadiah, Levites of the sons of Merari, and Zechariah and Meshullam of the sons of Kohath, to direct the work, and other Levites, all who were skilled with musical instruments. They were over the porters and directed every workman in every kind of task; and some of the Levites were scribes, officers and gatekeepers.
  - range: 14-21
    heading: The book of the law found
    plain: |
      As they were bringing out the money that had been brought into the house of the LORD, Hilkiah the priest found a book of the law of the LORD given through Moses. Hilkiah said to Shaphan the scribe, “I have found the book of the law in the house of the LORD,” and gave him the book. Shaphan took the book to the king and reported, “Your servants are doing everything that was entrusted to them. They have emptied out the money found in the house of the LORD and handed it to the overseers and the workmen.” Then Shaphan the scribe told the king, “Hilkiah the priest has given me a book,” and he read it aloud to the king. When the king heard the words of the law, he tore his clothes. He commanded Hilkiah, Ahikam son of Shaphan, Abdon son of Micah, Shaphan the scribe and Asaiah the king's servant: “Go and ask the LORD for me, and for those who are left in Israel and Judah, about the words of this book that has been found. Great is the LORD's wrath that has been poured out on us, because our fathers did not keep the word of the LORD and do all that is written in this book.”
  - range: 22-28
    heading: Huldah the prophetess answers
    plain: |
      So Hilkiah and the king's men went to Huldah the prophetess, the wife of Shallum son of Tikvath, son of Hasrah, keeper of the wardrobe. She lived in Jerusalem, in the second quarter of the city, and they spoke to her about the matter. She answered: “This is what the LORD God of Israel says: Tell the man who sent you to me, This is what the LORD says: I am going to bring disaster on this place and its people, all the curses written in the book that was read before the king of Judah, because they have forsaken Me and burned incense to other gods, provoking Me to anger with everything their hands have made. My wrath will be poured out on this place and will not be put out. But to the king of Judah, who sent you to ask the LORD, say this: This is what the LORD God of Israel says about the words you heard: Because your heart was tender and you humbled yourself before God when you heard His words against this place and its people, and humbled yourself before Me, tore your clothes and wept before Me, I have heard you, says the LORD. I will gather you to your fathers, and you will be laid in your grave in peace; your eyes will not see all the disaster I will bring on this place and its people.” And they brought the king her answer.
  - range: 29-33
    heading: The covenant read and made
    plain: |
      Then the king sent and gathered all the elders of Judah and Jerusalem. He went up to the house of the LORD with all the men of Judah, the people of Jerusalem, the priests, the Levites and all the people, from the greatest to the least, and he read in their hearing all the words of the book of the covenant that had been found in the house of the LORD. The king stood in his place and made a covenant before the LORD to follow the LORD and keep His commandments, His testimonies and His statutes with all his heart and all his soul, and to carry out the words of the covenant written in this book. He had everyone present in Jerusalem and Benjamin pledge themselves to it, and the people of Jerusalem acted according to the covenant of God, the God of their fathers. Josiah removed every abomination from all the lands that belonged to the children of Israel, and he made everyone present in Israel serve the LORD their God. As long as he lived they did not turn from following the LORD, the God of their fathers.

notes:
  - ref: 3
    phrase: he began to seek after the God of David his father
    kind: history
    title: Seeking before the book was found
    body: |
      Chronicles puts Josiah's turning to the LORD years before the book of the law was found. It gives three dates: in the eighth year of his reign, when he was about sixteen, he began to seek the God of David; in the twelfth, about twenty, he began to purge Judah and Jerusalem; and in the eighteenth, in his mid-twenties, he sent men to repair the temple, where Hilkiah found the book (verses 8, 14). Kings dates the repair and the finding to the eighteenth year too ([[2 Kgs. 22:3]]), but tells the purge of the land after the book was read and the covenant made ([[2 Kgs. 23:4–20]]).

      No Church source explains the difference, and older commentators read it in two ways. One holds that Chronicles is the more exact in its chronology: Kings views the whole reform in connection with the book, while Chronicles keeps the events apart in the order they happened. Another thought the two dates of this verse arose from copyists' slips in writing “eighteenth,” and held Kings' order to be right, while granting that Josiah's early piety was probably a fact. Whichever order is right, Josiah made his reform “while still young,” under Hilkiah's guidance, and it reached even the northern tribes.

      In Chronicles' order, then, Josiah sought the LORD before the book was found, and when it was read to him he tore his clothes, because the fathers had not kept what was written in it (verses 19–21). The boy king himself is taken up at [[2 Kgs. 22:1]].
    sources: [lds-scriptures, keil-chronicles, cambridge-chronicles, bd-josiah]

  - ref: 6
    phrase: with their mattocks round about
    kind: words
    title: In their ruins round about
    body: |
      The King James “mattocks” follows one reading of an obscure Hebrew phrase, and another is possible: “in their ruins.” The consonants as written (the *ketiv*, *what is written*) divide into two words, *in the mountain* and *their houses*. The Hebrew text marks a reading to be spoken instead (the *qere*, *what is read*), *bĕḥarbōtêhem*, from *ḥereb*, the sword, which here means “with their tools,” the tools for breaking stone. That is the King James' mattocks: the implements Josiah's men used on the altars. But the same letters may perhaps be read *bĕḥorbōtêhem*, “in their ruins,” from *ḥorbâ*, a ruin or waste place. The Greek translation has neither tools nor ruins; it has “the places round about them.”

      Read as “ruins,” the phrase describes the cities themselves; read as “tools,” it describes the work. Either way the verse names where the work went: Manasseh, Ephraim and Naphtali were the land of the northern kingdom, whose people the king of Assyria had carried away ([[2 Kgs. 17:6]]). Josiah's reform reached into those cities, and the remnant of Israel still living there gave money for the repair of the temple in Jerusalem (verse 9).
    sources: [oshb-wlc, bdb, lxx-rahlfs, bd-josiah, lds-scriptures]

  - ref: 12
    phrase: all that could skill of instruments of musick
    kind: history
    title: Musicians over the workmen
    body: |
      Only Chronicles names the Levites who directed the repair, and among them are the temple's musicians. The overseers' names and the musicians (verses 12–13) have no parallel in Kings, which speaks only of “the doers of the work, that have the oversight of the house” ([[2 Kgs. 22:5]]). “Could skill of” instruments means could play them skilfully. The musicians of Josiah's day served in the office for which David had set apart Levites “for song in the house of the LORD, with cymbals, psalteries, and harps” ([[1 Chr. 25:6]]).

      Why singers should oversee masons the text does not say. On one older reading they were given the oversight because their office and their art gave them a conspicuous place among the Levites: the men already trusted with the temple's service were trusted with its rebuilding. Other Levites served as scribes, officers and gatekeepers (verse 13).
    sources: [lds-scriptures, cambridge-chronicles, keil-chronicles]

  - ref: 27
    phrase: and humbledst thyself before me
    kind: scripture
    title: Humbled, and heard
    body: |
      Chronicles says twice that Josiah humbled himself, and the LORD's answer is the one He had promised Solomon. Kings has it once: “thou hast humbled thyself before the LORD … and hast rent thy clothes, and wept before me” ([[2 Kgs. 22:19]]). Chronicles reads “thou didst humble thyself before God … and humbledst thyself before me.”

      It is the condition of the LORD's promise at the dedication of the temple: “If my people … shall humble themselves, and pray, and seek my face, and turn from their wicked ways; then will I hear from heaven” ([[2 Chr. 7:14]]). Josiah sought (verse 3), humbled himself, and is told, “I have even heard thee also.” In Huldah's answer the king is heard, but the judgment on the city stands (verses 24–25, 28). The same words fall at the end on the last king, Zedekiah, who “humbled not himself before Jeremiah the prophet” ([[2 Chr. 36:12]]). What a tender heart meant is explained at [[2 Kgs. 22:19]].
    sources: [lds-scriptures]

christ: |
  “Draw near unto me and I will draw near unto you; seek me diligently and ye shall find me” ([[D&C 88:63]]) is the promise of Jehovah, the premortal Jesus Christ, the God of David whom Josiah began to seek as a youth. Josiah sought Him before he had the book, and when the book was read he humbled himself, and the LORD said, “I have even heard thee also” (verse 27).

  The same promise stands for a disciple now. The Lord draws near to those who seek Him, and He hears the one who humbles himself at His word.

explore: |
  - **The same reign in Kings.** [[2 Kgs. 22]]–23, with the site's notes on the book, Huldah and the covenant.
  - **The rest of Josiah's reign in Chronicles.** [[2 Chr. 35:1–27]], his Passover and his death at Megiddo.
  - **The promise behind verse 27.** [[2 Chr. 7:12–22]], the LORD's answer to Solomon.

