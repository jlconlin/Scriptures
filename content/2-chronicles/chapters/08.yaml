chapter: 8
title: So the House of the LORD Was Perfected
tagline: Solomon builds and fortifies cities from Hamath to Beth-horon, sets the peoples left in the land to forced labor, moves Pharaoh's daughter away from the places where the ark had been, orders the temple's offerings and courses by the law of Moses and the command of David, and sends ships to Ophir for gold.
when: 'At the end of the twenty years in which Solomon built the house of the LORD and his own house (8:1)'

setting: |
  Chapter 7 ended with the LORD's answer to Solomon's prayer; chapter 8 gathers Solomon's other works before the queen of Sheba's visit in chapter 9. Kings gives the same notices, in the same order and in the same brief way ([[1 Kgs. 9:10–28]]): the cities Solomon built, the labor that built them, his offerings at the new altar, and his fleet to Ophir. Each book has details the other lacks, and one older reading takes the two as short extracts, each supplementing the other, from a fuller account.

  The site's notes on 1 Kings 9 explain most of what the two share: the cities in Galilee and the land of Cabul ([[1 Kgs. 9:13]]), the levy and who bore it ([[1 Kgs. 9:15]]), Pharaoh's daughter's move ([[1 Kgs. 9:24]]), the three feasts ([[1 Kgs. 9:25]]), and the gold of Ophir, where Kings counts four hundred and twenty talents against the four hundred and fifty here ([[1 Kgs. 9:28]]). The notes below go to what Chronicles has of its own: Solomon's campaign at Hamath-zobah, his reason for moving Pharaoh's daughter, a different count of officers, and five verses on the order of the temple's worship where Kings has one.

thread: |
  The chapter is a list of Solomon's works, and the list is weighted. Cities, fortresses and the labor force take ten verses of short notices, and the fleet takes two. In between, Kings' single verse about Solomon's offerings ([[1 Kgs. 9:25]]) grows into five (verses 12–16). That is where Chronicles' interest lies throughout: the religious side of Israel's history, and above all the temple's worship. Solomon offers at the new altar what the law of Moses required for each day, each sabbath, each new moon and each feast; he sets the priests, the Levites and the porters in the courses David had ordered; and they keep the king's command in every matter.

  Only then does Chronicles close the account of the house: “So the house of the LORD was perfected” (verse 16), though the building had been finished in chapter 5 ([[2 Chr. 5:1]]). One older reading takes the placing of the verse as the point: the word does not mean simply ended but set thoroughly in order, and Solomon's work on the temple was complete only when its regular worship had begun under the law of Moses and the arrangements of David (the note at verse 16 gives the word). The gold of Ophir in the last two verses leads into chapter 9's account of Solomon's wealth.

sections:
  - range: 1-6
    heading: Solomon's cities
    plain: |
      At the end of the twenty years in which Solomon built the house of the LORD and his own house, Solomon rebuilt the cities Huram had given him and settled Israelites in them. Solomon went to Hamath-zobah and overpowered it. He built Tadmor in the wilderness, and all the store cities he built in Hamath. He also built Upper Beth-horon and Lower Beth-horon as fortified cities, with walls, gates and bars, and Baalath, and all Solomon's store cities, all the cities for his chariots and for his horsemen, and whatever Solomon wished to build in Jerusalem, in Lebanon, and throughout the land he ruled.
  - range: 7-11
    heading: No servants of Israel
    plain: |
      As for all the people who were left of the Hittites, the Amorites, the Perizzites, the Hivites and the Jebusites, who were not Israelites, their descendants who remained in the land, whom the Israelites had not destroyed, Solomon conscripted them for forced labor, as they are to this day. But Solomon made no Israelites slaves for his work; they were his soldiers, his chief captains, and the commanders of his chariots and his horsemen. These were King Solomon's chief officers, two hundred and fifty of them, who ruled over the people.

      Solomon brought Pharaoh's daughter up from the city of David to the house he had built for her, for he said, “No wife of mine shall live in the house of David king of Israel, because the places where the ark of the LORD has come are holy.”
  - range: 12-16
    heading: The order of worship
    plain: |
      Then Solomon offered burnt offerings to the LORD on the altar of the LORD that he had built in front of the porch, offering what each day required by the commandment of Moses: on the sabbaths, at the new moons, and at the appointed feasts three times a year, the feast of unleavened bread, the feast of weeks and the feast of tabernacles. Following the ordinance of his father David, he appointed the divisions of the priests to their service, and the Levites to their duties, to praise and to minister beside the priests as each day required, and the gatekeepers by their divisions at every gate, for that was what David the man of God had commanded. They did not turn aside from the king's command to the priests and the Levites in any matter, or concerning the treasuries.

      So all Solomon's work was made ready, up to the day the foundation of the house of the LORD was laid, and until it was finished. The house of the LORD was complete.
  - range: 17-18
    heading: Ships to Ophir
    plain: |
      Then Solomon went to Ezion-geber and to Eloth, on the coast in the land of Edom. Huram sent him ships by his servants, with sailors who knew the sea, and they went with Solomon's servants to Ophir and brought back from there four hundred and fifty talents of gold to King Solomon.

notes:
  - ref: 2
    phrase: the cities which Huram had restored to Solomon
    kind: history
    title: Cities given, by Huram or to him
    body: |
      Chronicles has the cities passing from Huram to Solomon, where Kings has them passing from Solomon to Hiram. In Kings Solomon gave Hiram twenty cities in Galilee, and Hiram, displeased with them, called them the land of Cabul ([[1 Kgs. 9:11–13]]). Here Solomon rebuilds cities that came to him from Huram and settles Israelites in them. The Hebrew verb is the ordinary one for giving (*nāṯan*), and the Septuagint, the ancient Greek translation, reads the same: “the cities which Chiram had given to Solomon.” The King James “restored” supposes that the cities had been Solomon's to begin with, which the Hebrew does not say.

      Neither book says how its notice fits the other's. The note at [[1 Kgs. 9:13]] gives one older reading, that these are the twenty cities Hiram did not want, handed back and then rebuilt; the text leaves it there.
    sources: [lds-scriptures, oshb-wlc, lxx-rahlfs]

  - ref: 3
    phrase: Solomon went to Hamath-zobah, and prevailed against it
    kind: history
    title: Hamath-zobah and Tadmor
    body: |
      Chronicles alone says that Solomon went to war, at Hamath-zobah; the parallel list in Kings goes straight to the cities he built ([[1 Kgs. 9:17–19]]). Hamath and Zobah were two kingdoms to the north that David had dealt with: he struck Hadarezer king of Zobah “unto Hamath,” and Tou king of Hamath sent his son to congratulate him ([[1 Chr. 18:3]]; [[1 Chr. 18:9–10]]). Hamath itself was a city of Syria in the valley of the Orontes, and “the entering in of Hamath” marked the northern limit of the promised land. The city seems to have come under Solomon's rule, and this chapter, with its “store cities, which he built in Hamath” (verse 4), is part of the evidence.

      What “prevailed against it” means is a matter of reading. One older reading takes Hamath-zobah as a single name for the land of Hamath, which bordered Zobah, and the verb as a sign that kingdoms David had made tributary had rebelled or tried to; Solomon put the revolt down and held the region by fortifying Tadmor and the store cities. Kings does name an adversary from Zobah, Rezon, who “was an adversary to Israel all the days of Solomon” ([[1 Kgs. 11:23–25]]). Another older reading suggests a southern town that shared Hamath's name, which would set the campaign far from Syria, and remarks that the “man of rest” promised to David ([[1 Chr. 22:9]]) did not reign wholly without war.

      Tadmor raises a question of its own. The first reading identifies it with Palmyra, an oasis city north-east of Damascus, halfway to the Euphrates. The second doubts this: Palmyra does not appear in history until 34 B.C., and in Kings the Hebrew as written (the *ketiv*) has “Tamar,” with “Tadmor” only as the reading the scribes marked to be read aloud (the *qere*) ([[1 Kgs. 9:18]]). Since Kings lists the city with towns in or near Judah, that reading takes Solomon's city to be a Tamar in the south. The texts leave the identification open.
    sources: [lds-scriptures, bd-hamath, keil-chronicles, cambridge-chronicles, oshb-wlc]

  - ref: 10
    phrase: even two hundred and fifty
    kind: history
    title: Two hundred and fifty officers, or five hundred and fifty
    body: |
      Chronicles counts Solomon's chief officers at two hundred and fifty, where Kings has five hundred and fifty ([[1 Kgs. 9:23]]), and the two books differ in the opposite direction on the overseers under them: three thousand six hundred in Chronicles ([[2 Chr. 2:18]]), three thousand three hundred in Kings ([[1 Kgs. 5:16]]). One older reading points out that the totals agree: 3,600 and 250 in Chronicles, 3,300 and 550 in Kings, 3,850 overseers of every rank in each. Another takes Chronicles' 250 as the Israelites among the chief officers, and Kings' 550 as the Israelite and Canaanite officers together.

      Neither book says how it divided its count, so both are proposals. The note at [[2 Sam. 24:9]] considers how numbers like these could shift in copying.
    sources: [lds-scriptures, cambridge-chronicles, keil-chronicles]

  - ref: 11
    phrase: because the places are holy, whereunto the ark of the LORD hath come
    kind: history
    title: Why Pharaoh's daughter moved
    body: |
      Chronicles gives a reason for a move that Kings only dates: the places where the ark had come were holy, and Solomon would not have his wife live there. Kings records the move once the works were finished ([[1 Kgs. 9:24]]), as the notice of the marriage had said she would stay in the city of David only until then ([[1 Kgs. 3:1]]). Chronicles has not told of the marriage at all, so Pharaoh's daughter appears here for the first time, and the words given as Solomon's are found only here.

      The holiness came with the ark. David had pitched a tent for it in the city of David ([[1 Chr. 15:1]]; [[1 Chr. 16:1]]), and it stayed there until Solomon brought it up “out of the city of David, which is Zion” to the new house ([[2 Chr. 5:2]]). Solomon's words speak of “the places” in the plural, the Septuagint of “the place.” His words name the ark as the reason and say nothing more about his wife. The note at [[1 Kgs. 3:1]] takes up the marriage itself and what the text later says of it.
    sources: [lds-scriptures, lxx-rahlfs]

  - ref: 13
    phrase: Even after a certain rate every day
    kind: words
    title: As each day required
    body: |
      “After a certain rate every day” means the offering each day called for, and with it Chronicles fills Kings' “three times in a year” ([[1 Kgs. 9:25]]) with the whole calendar of the law. The Hebrew reads, word for word, *by the matter of a day in its day*: each day's portion on its own day. The same phrase stands in the next verse, of the Levites' duties, where the King James renders it “as the duty of every day required.”

      The occasions that follow are the ones the law of offerings lays down, and in the same order: the continual burnt offering “day by day” ([[Num. 28:3]]), then the sabbath ([[Num. 28:9]]), then “the beginnings of your months” ([[Num. 28:11]]), then the feasts ([[Num. 28:16–31]]; [[Num. 29:12–38]]). That is what “according to the commandment of Moses” covers here: Solomon's altar carried the full round of Israel's offerings, not only the pilgrim feasts. The note at [[1 Kgs. 9:25]] takes up the three feasts themselves.
    sources: [biblehub-interlinear, oshb-wlc, lds-scriptures]

  - ref: 14
    phrase: for so had David the man of God commanded
    kind: scripture
    title: David the man of God
    body: |
      Chronicles grounds the temple's worship on two authorities, Moses for the offerings (verse 13) and David for the service (verse 14), and gives David the title Moses bears. Scripture calls Moses “the man of God” ([[Deut. 33:1]]; [[1 Chr. 23:14]]), and the widow of Zarephath uses the same words of Elijah: “thou art a man of God, and that the word of the LORD in thy mouth is truth” ([[1 Kgs. 17:24]]).

      The courses Solomon set up are the ones Chronicles has already said David received. The pattern David gave Solomon, “the pattern of all that he had by the spirit,” included “the courses of the priests and the Levites, and … all the work of the service of the house of the LORD” ([[1 Chr. 28:12–13]]); “the LORD made me understand in writing by his hand upon me,” David said ([[1 Chr. 28:19]]; the note at [[1 Chr. 28:12]] weighs how the pattern reached him). The title stayed with the arrangement. After the return from exile the Levites still praised “according to the commandment of David the man of God” ([[Neh. 12:24]]).
    sources: [lds-scriptures]

  - ref: 16
    phrase: So the house of the LORD was perfected
    kind: words
    title: 'Perfected: complete at last'
    body: |
      “Perfected” is about where Chronicles says the house was complete. The Hebrew is the adjective *šālēm*, “complete,” used in the sense “finished” of the stones of the temple ([[1 Kgs. 6:7]]) and of the temple in this verse.

      The building itself had been finished before the dedication ([[2 Chr. 5:1]]), yet the word stands here, after the offerings are on the altar and the priests, Levites and porters are in their courses. Kings closes the same notice at the same point, “So he finished the house” ([[1 Kgs. 9:25]]), after the offerings. The thread above gives one older reading of why the word stands there.
    sources: [bdb, biblehub-interlinear, lds-scriptures]

christ: |
  Solomon's altar carried the daily offering, the offerings of sabbaths and new moons, and the feasts, all by “the commandment of Moses” (verse 13), and Amulek says of that law that it was “every whit pointing to that great and last sacrifice; and that great and last sacrifice will be the Son of God” ([[Alma 34:14]]). After His death Jesus Christ ended those offerings, “your sacrifices and your burnt offerings shall be done away,” and asked instead for “a broken heart and a contrite spirit” ([[3 Ne. 9:19–20]]). That is the offering a disciple brings now, and the Lord's promise in the same verse is that whoever comes to Him with it He will baptize “with fire and with the Holy Ghost.”

explore: |
  - **The same notices in Kings.** [[1 Kgs. 9:10–28]], with its notes.
  - **The order David gave.** The Levites' charge, [[1 Chr. 23:28–32]]; the priests' courses, [[1 Chr. 24:1–19]]; the singers, [[1 Chr. 25:1–7]]; the porters, [[1 Chr. 26:12–19]].
  - **The law of offerings.** [[Num. 28]]; [[Num. 29]].
  - **The same worship restored.** Hezekiah's courses and offerings, [[2 Chr. 31:2–3]]; the returned exiles at the altar, [[Ezra 3:1–6]]; [[Neh. 12:44–47]].
  - **Worship at the temple on the site.** [The guide to temple and worship](/old-testament/guides/temple-and-worship/#worship).

