chapter: 15
claims:
  - where: 'when'
    claim: 'The gathering was in the third month of Asa''s fifteenth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/15?lang=eng'
    quote: 'So they gathered themselves together at Jerusalem in the third month, in the fifteenth year of the reign of Asa.'
  - where: 'when'
    claim: 'The spoil offered came from the war with the Cushites (Zerah)'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/15.htm'
    quote: 'they offered of the booty, i.e., of the cattle captured in the war against the Cushites (2 Chronicles 14:14), 700 oxen and 7000 sheep.'
  - where: 'setting'
    claim: 'Ten quiet years, then the LORD smote Zerah''s army and Judah took much spoil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/14?lang=eng'
    quote: 'So the LORD smote the Ethiopians before Asa, and before Judah; and the Ethiopians fled.'
  - where: 'setting'
    claim: 'Asa''s reign followed a period of wickedness and idolatry; he responded to prophetic counsel'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'Asa’s reign followed a period of wickedness and idolatry in the kingdom of Judah. Asa responded to prophetic counsel to remove idols from his kingdom and gathered his people to Jerusalem'
  - where: 'setting'
    claim: 'Verses 1–15 have no parallel in Kings; verses 16–19 are 1 Kgs. 15:13–15'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/15.htm'
    quote: 'Ch. 2 Chronicles 15:1-15 (no parallel in Kings). The Prophecy of Azariah and its Sequel'
  - where: 'setting'
    claim: 'Verses 16–18 are also in Kings and commented on there'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/15.htm'
    quote: 'These statements are also to be found in 1 Kings 15:13-16, and are commented upon at that place.'
  - where: 'setting'
    claim: 'Kings tells Maachah''s removal and the high places in the same words'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/15?lang=eng'
    quote: 'But the high places were not removed: nevertheless Asa’s heart was perfect with the LORD all his days.'
  - where: 'setting'
    claim: 'Chapter 14 said Asa took away the high places'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/14?lang=eng'
    quote: 'Also he took away out of all the cities of Judah the high places and the images: and the kingdom was quiet before him.'
  - where: 'thread'
    claim: 'Verse 15 “he was found of them” fulfils the promise of verse 2'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/15.htm'
    quote: '15. he was found of them] A fulfilment of the promise given in 2 Chronicles 15:2.'
  - where: 'thread'
    claim: 'In chapter 16 Asa relies on the king of Syria and is rebuked'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/16?lang=eng'
    quote: 'Because thou hast relied on the king of Syria, and not relied on the LORD thy God, therefore is the host of the king of Syria escaped out of thine hand.'
  - where: 'section 2 plain'
    claim: '“Mount Ephraim” is the hill country of Ephraim'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/15.htm'
    quote: 'mount Ephraim] R.V. the hill country of Ephraim. The term describes the hilly country between the plain of Esdrelon and the territory of Benjamin.'
  - where: 'section 2 plain'
    claim: '“Renewed” the altar means repaired it'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/15.htm'
    quote: '"And he renewed the altar before the porch," i.e., the altar of burnt-offering, which might stand in need of repairs sixty years after the building of the temple.'
  - where: 'section 2 plain'
    claim: '“Cornets” are shofarim, horns'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/15?lang=eng'
    quote: '“cornets”: HEB shofarim; horns.'
  - where: 'section 3 plain'
    claim: '“Mother” here means grandmother'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/15?lang=eng'
    quote: '“mother”: IE grandmother.'
  - where: 'section 3 plain'
    claim: '“Queen” means queen mother; the “grove” stands for Asherah, the name of a goddess'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/15.htm'
    quote: 'from being queen] R.V. mg., from being queen-mother. … in a grove] R.V. mg. (rightly as representing the meaning of the Chronicler) for Asherah'
  - where: 'section 3 plain'
    claim: '“Perfect” means whole, undivided in allegiance'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/15.htm'
    quote: 'perfect] i.e. “whole, undivided in its allegiance.”'
  - where: 'note 15:2 “While ye be with him”'
    claim: 'In Chronicles rewards and punishments usually come without delay'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'rewards and punishments are not usually delayed in Chronicles, and people are often punished for sins or rewarded for righteousness immediately.'
  - where: 'note 15:2 “While ye be with him”'
    claim: 'Both Kings and Chronicles are needed; sometimes reward or punishment is immediate and sometimes not'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'Both Kings and Chronicles are necessary to form a nuanced view of the history of Israel and the destruction of Jerusalem. Sometimes people are punished for iniquity or blessed for righteousness immediately, but sometimes they are not.'
  - where: 'note 15:2 “While ye be with him”'
    claim: 'Asa''s trust changed over chapters 14–16'
    key: cfm-ot-2026-30
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/30?lang=eng'
    quote: 'As you read about the trials he faced, notice where he put his trust and how that changed over time.'
  - where: 'note 15:2 “While ye be with him”'
    claim: 'Asa had just won the victory over Zerah, given by the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/14?lang=eng'
    quote: 'So the LORD smote the Ethiopians before Asa, and before Judah; and the Ethiopians fled.'
  - where: 'note 15:2 “While ye be with him”'
    claim: 'Hanani''s rebuke for relying on Syria'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/16?lang=eng'
    quote: 'Because thou hast relied on the king of Syria, and not relied on the LORD thy God'
  - where: 'note 15:3 “When Israel was without God”'
    claim: 'Verse 3 has no verb in the Hebrew: “and many days to Israel, without the God of truth”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="c/3117" morph="HC/Ncmpa" id="14wfx">וְ/יָמִ֥ים</w> <w lemma="7227 a" n="1.0" morph="HAampa" id="14rqa">רַבִּ֖ים</w> <w lemma="l/3478" n="1" morph="HR/Np" id="14ZRa">לְ/יִשְׂרָאֵ֑ל</w>'
  - where: 'note 15:3 “When Israel was without God”'
    claim: 'The verse has no verb and may refer to past or future; the prophet left the time open because his words hold at all times'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/15.htm'
    quote: 'The verse contains no verb, so that the words may just as well refer to the past as to the future. The prophet has not stated the time definitely, because he was giving utterance to truths which have force at all times,'
  - where: 'note 15:3 “When Israel was without God”'
    claim: 'Opinions on the reference have been divided since antiquity'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/15.htm'
    quote: 'Opinions as to the reference intended in this portrayal of the dreadful results of defection from God have been from antiquity very much divided.'
  - where: 'note 15:3 “When Israel was without God”'
    claim: 'Such days came after Joshua and would come again in the Assyrian and Babylonian exile; Hosea 3:4 echoes this verse'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/15.htm'
    quote: 'Israel had already experienced in the times of defection after Joshua (cf. Judges 2:11.), but will experience them in the future still oftener and more enduringly under the idolatrous kings in the Assyrian and Babylonian exile'
  - where: 'note 15:3 “When Israel was without God”'
    claim: 'Hosea 3:4 refers to this verse'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/15.htm'
    quote: 'Hosea (Hosea 3:4) utters, with a manifest reference to 2 Chronicles 15:3 of our speech, a threat that the ten tribes will be brought into a similar condition'
  - where: 'note 15:3 “When Israel was without God”'
    claim: 'Another reading takes verses 3–6 as a look back over Israel''s past, the civil strife of the judges'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/15.htm'
    quote: 'In the civil strife of the days of the Judges Israel appeared more than once as two nations destroying one another: cp. Jdg 8:13-17; Jdg 9:26 ff; Jdg 12:1 ff; Jdg 20:12 ff.'
  - where: 'note 15:3 “When Israel was without God”'
    claim: 'Torah is properly teaching; a teaching (moreh) priest gives torah; cf. Mal. 2:7'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/15.htm'
    quote: '“Law” (Heb. torah) is properly “teaching, guidance.” A “teaching” (Heb. moreh) priest is one who gives “torah” or “guidance” on doubtful points of morality or ritual. Cp. Malachi 2:7.'
  - where: 'note 15:3 “When Israel was without God”'
    claim: 'Israel had priests but not ones who attended to their office, and so had no law despite the book of the law'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/15.htm'
    quote: 'Israel had indeed Elohim, but not the true God, and also priests, but not priests who attended to their office, who watched over the fulfilment of the law; and so they had no תּורה, notwithstanding the book of the law composed by Moses.'
  - where: 'note 15:3 “When Israel was without God”'
    claim: 'The words for teaching priest (kohen moreh) and law (torah) in the verse'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="3548" morph="HNcmsa" id="148m3">כֹּהֵ֥ן</w> <w lemma="3384 b" n="0.0" morph="HVhrmsa" id="14fBz">מוֹרֶ֖ה</w>'
  - where: 'note 15:12 “A covenant renewed, and its penalty”'
    claim: 'The covenant was one of many renewals of the covenant made at Sinai'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'This is one of many instances in which members of the house of Israel renewed the covenant that had been made at Mount Sinai.'
  - where: 'note 15:12 “A covenant renewed, and its penalty”'
    claim: 'The third month was the month of the Feast of Weeks'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/15.htm'
    quote: '10. in the third month] In this month the Feast of Weeks (i.e. of wheat harvest) was held; Deuteronomy 16:9.'
  - where: 'christ'
    claim: 'The Church''s footnote sends “covenant” to Mosiah 5:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/15?lang=eng'
    quote: '“covenant”: Mosiah 5:5 (2, 5).'
  - where: 'note 15:12 “A covenant renewed, and its penalty”'
    claim: 'The penalty is the Law''s, Deut. 17:2–7'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/15.htm'
    quote: '13. should be put to death] According to the Law; Deuteronomy 17:2-7.'
  - where: 'note 15:12 “A covenant renewed, and its penalty”'
    claim: 'Deut. 17 requires inquiry and two or three witnesses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/17?lang=eng'
    quote: 'At the mouth of two witnesses, or three witnesses, shall he that is worthy of death be put to death; but at the mouth of one witness he shall not be put to death.'
  - where: 'note 15:19 “The thirty-fifth year”'
    claim: 'Kings: war between Asa and Baasha all their days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/15?lang=eng'
    quote: 'And there was war between Asa and Baasha king of Israel all their days.'
  - where: 'note 15:19 “The thirty-fifth year”'
    claim: 'Baasha''s son began to reign in Asa''s twenty-sixth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/16?lang=eng'
    quote: 'In the twenty and sixth year of Asa king of Judah began Elah the son of Baasha to reign over Israel in Tirzah, two years.'
  - where: 'note 15:19 “The thirty-fifth year”'
    claim: 'Chronicles dates Baasha''s attack to Asa''s thirty-sixth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/16?lang=eng'
    quote: 'In the six and thirtieth year of the reign of Asa Baasha king of Israel came up against Judah, and built Ramah'
  - where: 'note 15:19 “The thirty-fifth year”'
    claim: 'Older commentators reckoned the thirty-fifth year from the beginning of the kingdom of Judah, i.e. Asa''s fifteenth/sixteenth'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/16.htm'
    quote: 'The older commentators, for the most part, accepted the conjecture that the thirty-fifth year (in 2 Chronicles 15:19) is to be reckoned from the commencement of the kingdom of Judah'
  - where: 'note 15:19 “The thirty-fifth year”'
    claim: 'Keil: a copyist interchanged the letters for 30 and 10; the original numbers were 15 and 16, which harmonize the reign'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/16.htm'
    quote: 'the letters ל (30) and י (10), which are somewhat similar in the ancient Hebrew characters, having been interchanged by a copyist; and hence the Numbers 35 and 36 have arisen out of the original 15 and 16.'
  - where: 'note 15:19 “The thirty-fifth year”'
    claim: 'On that reading: ten years of peace, Zerah in the eleventh year, covenant in the fifteenth, war with Baasha in the sixteenth'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/16.htm'
    quote: 'During the first ten years there was peace (2 Chronicles 14:1); thereafter, in the eleventh year, the inroad of the Cushites; … and rest until the fifteenth year, in which the renewal of the covenant took place'
  - where: 'note 15:19 “The thirty-fifth year”'
    claim: 'Kings'' “war” may mean latent hostility, Chronicles'' open war'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/15.htm'
    quote: 'This discrepancy is partly got rid of by taking מלחמה in the book of Kings to denote the latent hostility or inimical attitude of the two kingdoms towards each other, and in the Chronicle to denote a war openly declared.'
  - where: 'note 15:19 “The thirty-fifth year”'
    claim: 'Cambridge: reconcilable only if read broadly, nothing serious until the war had gone on several years'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/15.htm'
    quote: 'This statement can be reconciled with 1 Kings 15:16; 1 Kings 15:32 only by interpreting it broadly to mean that nothing serious occurred until the war with Baasha had been going on for several years.'
  - where: 'note 15:19 “The thirty-fifth year”'
    claim: 'Keil finds the older reckoning in substance correct but irreconcilable with “the thirty-sixth year of Asa''s kingship”'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/16.htm'
    quote: 'This is in substance correct; but the statement, "in the thirty-sixth year of Asa''s kingship," cannot re reconciled with it.'
  - where: 'note 15:19 “The thirty-fifth year”'
    claim: 'The sense of “war” removes the difficulty only in part; the date is the greater difficulty'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/15.htm'
    quote: 'The date, until the thirty-fifth year, causes a greater difficulty'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'The Church''s footnote at verse 15 “found” points to D&C 88:63'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/15?lang=eng'
    quote: '“found”: D&C 88:63.'
  - where: 'christ'
    claim: 'D&C 88:63'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: 'Draw near unto me and I will draw near unto you; seek me diligently and ye shall find me; ask, and ye shall receive; knock, and it shall be opened unto you.'
  - where: 'christ'
    claim: 'The footnote at verse 12 sends the covenant to Mosiah 5:5, the covenant to do His will'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/5?lang=eng'
    quote: 'And we are willing to enter into a covenant with our God to do his will, and to be obedient to his commandments in all things that he shall command us, all the remainder of our days'
