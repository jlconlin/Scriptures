chapter: 21
claims:
  - where: setting
    claim: Verses 5–10 agree with 2 Kings 8:17–22 apart from small differences
    key: keil-chronicles
    url: https://biblehub.com/commentaries/kad/2_chronicles/21.htm
    quote: These verses agree with 2 Kings 8:17-22, with the exception of some immaterial divergences
  - where: setting
    claim: Verses 2–4 have no parallel in Kings
    key: cambridge-chronicles
    url: https://biblehub.com/commentaries/cambridge/2_chronicles/21.htm
    quote: 2–4 (no parallel in Kings). The Names and the Fate of the other Sons of Jehoshaphat
  - where: setting
    claim: Verses 11–15, Jehoram's sins and Elijah's writing, are not in Kings
    key: cambridge-chronicles
    url: https://biblehub.com/commentaries/cambridge/2_chronicles/21.htm
    quote: 11–15 (not in Kings). Jehoram’s Sins and Elijah’s written Denunciation
  - where: setting
    claim: Verses 16–17, the invasion of the Philistines and Arabians, have no parallel in Kings
    key: cambridge-chronicles
    url: https://biblehub.com/commentaries/cambridge/2_chronicles/21.htm
    quote: 16, 17 (no parallel in Kings). The Invasion of the Philistines and Arabians
  - where: setting
    claim: Chronicles calls Judah "Israel," the covenant people, and calls Jehoshaphat "king of Israel" at 21:2
    key: cambridge-chronicles
    url: https://biblehub.com/commentaries/cambridge/2_chronicles/11.htm
    quote: Jehoshaphat and Ahaz are each called “king of Israel” (2 Chronicles 21:2; 2 Chronicles 28:19) … Israel in Chron. then = the covenant-people. In Kings on the contrary Israel generally means the Northern Kingdom.
  - where: thread
    claim: Elijah's writing names two transgressions, the idolatry of Ahab's house with the people led into it, and the murder of the brothers
    key: keil-chronicles
    url: https://biblehub.com/commentaries/kad/2_chronicles/21.htm
    quote: "Elijah's writing pointed out to Joram two great transgressions: (1) his forsaking the Lord for the idolatrous worship of the house of Ahab, and also his seducing the people into this sin; and (2) the murder of his brothers."
  - where: thread
    claim: The reason given for Libnah's revolt is not in Kings
    key: cambridge-chronicles
    url: https://biblehub.com/commentaries/cambridge/2_chronicles/21.htm
    quote: because he had forsaken, etc.] Not in Kings.
  - where: thread
    claim: In Chronicles rewards and punishments usually come without delay
    key: sc-knowhy-861
    url: https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible
    quote: rewards and punishments are not usually delayed in Chronicles, and people are often punished for sins or rewarded for righteousness immediately.
  - where: section 2 plain
    claim: '"Commit fornication" in verse 11 means to be unfaithful to the LORD; "compelled" may be rendered "seduced"'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/21?lang=eng
    quote: "“commit fornication”: IE be unfaithful to the Lord."
  - where: section 2 plain
    claim: '"Compelled" in verse 11 may be rendered "seduced"'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/21?lang=eng
    quote: "“compelled”: OR seduced."
  - where: section 4 plain
    claim: '"Departed without being desired": no one mourned him'
    key: keil-chronicles
    url: https://biblehub.com/commentaries/kad/2_chronicles/21.htm
    quote: '"And he departed, mourned by none."'
  - where: note 21:12 “A writing from Elijah”
    claim: The seminary manual names Elijah's prophecy to Jehoram as a detail Chronicles has that Samuel and Kings do not
    key: ot-seminary-chronicles-intro
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-books-of-1-and-2-chronicles?lang=eng
    quote: Various details not found in the books of Samuel and Kings are included in Chronicles, such as a prophecy of Elijah concerning the wicked king Jehoram (see 2 Chronicles 21:12–15).
  - where: note 21:12 “A writing from Elijah”
    claim: This is the only writing of Elijah mentioned in scripture
    key: cambridge-chronicles
    url: https://biblehub.com/commentaries/cambridge/2_chronicles/21.htm
    quote: 12. a writing] This is the only place in which any writing of Elijah is mentioned.
  - where: note 21:12 “A writing from Elijah”
    claim: Elijah was translated, taken up by a whirlwind into heaven
    key: bd-elijah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/elijah?lang=eng
    quote: "His life closed dramatically: “there appeared a chariot of fire, … and Elijah went up by a whirlwind into heaven,” (2 Kgs. 2:11–12) and thus was he translated."
  - where: note 21:12 “A writing from Elijah”
    claim: "One older reading: the time of Elijah's translation cannot be fixed, and he may have lived to see Jehoram's crime"
    key: keil-chronicles
    url: https://biblehub.com/commentaries/kad/2_chronicles/21.htm
    quote: we have no certain proof that Elijah was then no longer alive, but had been already received into heaven. The time of his translation cannot be exactly fixed.
  - where: note 21:12 “A writing from Elijah”
    claim: "The same reading: if Elijah was taken first, the Lord may have revealed Jehoram's wickedness to him and had him write the warning to be sent at the proper time"
    key: keil-chronicles
    url: https://biblehub.com/commentaries/kad/2_chronicles/21.htm
    quote: that the Lord had revealed to him Joram's wickedness before his translation, and had commissioned him to announce to Joram in writing the divine punishment which would follow, and to send this writing to him at the proper time.
  - where: note 21:12 “A writing from Elijah”
    claim: The same reading rejects a letter sent from heaven
    key: keil-chronicles
    url: https://biblehub.com/commentaries/kad/2_chronicles/21.htm
    quote: There are consequently no sufficient grounds for believing that the glorified Elijah either sent a letter to Joram from heaven by an angel, or commissioned any living person to write the letter.
  - where: note 21:17 “Jehoahaz, also called Ahaziah”
    claim: The Church's footnote gives Ahaziah as the other name
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/21?lang=eng
    quote: "17a “Jehoahaz”: OR Ahaziah (see 2 Chr. 22:1)."
  - where: note 21:17 “Jehoahaz, also called Ahaziah”
    claim: The Bible Dictionary gives Ahaziah of Judah the names Azariah (22:6) and Jehoahaz (21:17)
    key: bd-ahaziah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/ahaziah?lang=eng
    quote: called Azariah (2 Chr. 22:6) and Jehoahaz (2 Chr. 21:17).
  - where: christ
    claim: "The chapter's text: the LORD would not destroy the house of David because of His covenant with David"
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/21?lang=eng
    quote: Howbeit the Lord would not destroy the house of David, because of the covenant that he had made with David
  - where: setting
    claim: Ahab's daughter, Jehoram's wife, is Athaliah, called "daughter of Omri," that is, his granddaughter
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/22?lang=eng
    quote: "2c “daughter”: OR granddaughter; see 2 Kgs. 8:26–27; 2 Chr. 21:6."
  - where: thread
    claim: The two threatened punishments were fulfilled, the first in the invasion of verses 16–17
    key: keil-chronicles
    url: https://biblehub.com/commentaries/kad/2_chronicles/21.htm
    quote: These two threats of punishment were fulfilled. The fulfilment of the first is recorded in 2 Chronicles 21:16.
  - where: note 21:4 “Brothers better than himself”
    claim: Jehoshaphat gave his other sons gifts with fenced cities, and the kingdom to the firstborn
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/21?lang=eng
    quote: "with fenced cities in Judah: but the kingdom gave he to Jehoram; because he was the firstborn."
  - where: note 21:4 “Brothers better than himself”
    claim: Elijah's writing names the murder of the brothers, "better than thyself," as a sin
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/21?lang=eng
    quote: and also hast slain thy brethren of thy father’s house, which were better than thyself
  - where: note 21:12 “A writing from Elijah”
    claim: Kings tells of Elijah going up by a whirlwind into heaven
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/2?lang=eng
    quote: and Elijah went up by a whirlwind into heaven.
  - where: note 21:12 “A writing from Elijah”
    claim: In Jehoshaphat's presence Elisha is introduced as the one who poured water on Elijah's hands
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/3?lang=eng
    quote: Here is Elisha the son of Shaphat, which poured water on the hands of Elijah.
  - where: note 21:12 “A writing from Elijah”
    claim: One older commentary takes 2 Kgs. 3:11 to mean that Elisha had already taken Elijah's place
    key: cambridge-chronicles
    url: https://biblehub.com/commentaries/cambridge/2_chronicles/21.htm
    quote: (where Elisha seems already to have taken Elijah’s place)
  - where: note 21:17 “Jehoahaz, also called Ahaziah”
    claim: BDB gives Jehoahaz the meaning "[Yahweh] hath grasped" and compares Ahaziah
    key: bdb
    url: https://biblehub.com/hebrew/3059.htm
    quote: proper name, masculine (׳י hath grasped; ᵐ5 Ἰωαχας, & Ἰωαχαζ; compare also אֲהַזְיָהוּ
  - where: note 21:17 “Jehoahaz, also called Ahaziah”
    claim: Chronicles says the raiders had slain all the elder sons, so the youngest reigned as Ahaziah
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/22?lang=eng
    quote: for the band of men that came with the Arabians to the camp had slain all the eldest.
  - where: note 21:20 “Buried without honor”
    claim: At Asa's burial he was laid among spices and a great burning was made for him
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/16?lang=eng
    quote: "laid him in the bed which was filled with sweet odours and divers kinds of spices prepared by the apothecaries’ art: and they made a very great burning for him."
  - where: note 21:20 “Buried without honor”
    claim: Jeremiah promised Zedekiah the burning of odours as for the kings before him
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/34?lang=eng
    quote: and with the burnings of thy fathers, the former kings which were before thee, so shall they burn odours for thee
  - where: note 21:20 “Buried without honor”
    claim: Kings says only that he was buried with his fathers in the city of David
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/8?lang=eng
    quote: And Joram slept with his fathers, and was buried with his fathers in the city of David
  - where: note 21:20 “Buried without honor”
    claim: Joash was not buried in the sepulchres of the kings, after his servants killed him for the blood of Jehoiada's sons
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/24?lang=eng
    quote: his own servants conspired against him for the blood of the sons of Jehoiada the priest
  - where: note 21:20 “Buried without honor”
    claim: Ahaz was not brought into the sepulchres of the kings
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/28?lang=eng
    quote: but they brought him not into the sepulchres of the kings of Israel
  - where: christ
    claim: "Psalm 89: transgression visited with the rod"
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ps/89?lang=eng
    quote: Then will I visit their transgression with the rod
  - where: christ
    claim: "Psalm 89: the LORD will not take away His lovingkindness from David's line"
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ps/89?lang=eng
    quote: Nevertheless my lovingkindness will I not utterly take from him
  - where: christ
    claim: "Psalm 89: My covenant will I not break"
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ps/89?lang=eng
    quote: My covenant will I not break
  - where: christ
    claim: "The angel: the Lord God shall give Jesus the throne of his father David"
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng
    quote: the Lord God shall give unto him the throne of his father David
