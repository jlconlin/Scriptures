chapter: 16
claims:
  - where: 'when'
    claim: 'Asa died in the forty-first year of his reign'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/16?lang=eng'
    quote: 'And Asa slept with his fathers, and died in the one and fortieth year of his reign.'
  - where: 'setting'
    claim: 'Asa was the third king of Judah; his history is told in 1 Kgs. 15–16 and 2 Chr. 14–16; he allied with Ben-hadad to check Baasha'
    key: bd-asa
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/asa?lang=eng'
    quote: 'Third king of Judah; the history of his reign is told in 1 Kgs. 15–16 and 2 Chr. 14–16. … He made an alliance with Benhadad of Syria for the purpose of checking Baasha, king of Israel.'
  - where: 'setting'
    claim: 'Asa sought the Lord in peaceful and difficult times; his faith wavered later in life'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'One such king was Asa, who sought the Lord during peaceful and difficult times. … Although Asa’s faith wavered later in life'
  - where: 'setting'
    claim: 'Verses 1–6 agree with 1 Kgs. 15:17–22 almost word for word'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/16.htm'
    quote: 'The account of this war in 2 Chronicles 16:1-6 agrees with that in 1 Kings 15:17-22 almost literally'
  - where: 'setting'
    claim: 'Verses 7–10 are not in Kings; only Chronicles condemns Asa, and Kings passes no blame on him'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/16.htm'
    quote: '7–10 (not in 1 Kin.). The Intervention of Hanani The Chronicler stands alone both in recording the condemnation of Asa in this passage and in himself condemning him in 2 Chronicles 16:12. In 1 Kin. no blame is passed on Asa.'
  - where: 'setting'
    claim: 'By 1 Kgs. 16:8 Baasha was succeeded by Elah in Asa''s twenty-sixth year, so the thirty-sixth year of verse 1 does not fit'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/16.htm'
    quote: 'According to 1 Kings 16:8 Baasha was succeeded by his son Elah in the six-and-twentieth year of Asa. The number thirty-six is probably therefore wrong.'
  - where: 'thread'
    claim: 'The “burning” of verse 14 is of the spices, as incense'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/16?lang=eng'
    quote: '“burning”: IE of the spices, as incense.'
  - where: 'section 1 plain'
    claim: 'Verses 1–6 are the parallel of 1 Kgs. 15:17–22'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/16.htm'
    quote: 'Ch. 2 Chronicles 16:1-6 (= 1 Kings 15:17-22). Asa asks help of Ben-hadad'
  - where: 'section 2 plain'
    claim: '“A prison house” may be rendered “stocks”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/16?lang=eng'
    quote: '“a prison house”: OR stocks.'
  - where: 'section 2 plain'
    claim: 'The Lubims are Libyans'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/16.htm'
    quote: 'With the Cushites Hanani names also פּרשׁים, Libyans (cf. 2 Chronicles 12:3)'
  - where: 'section 2 plain'
    claim: 'A heart šālēm toward the LORD is a whole heart, keeping covenant with Him (2 Chr. 16:9)'
    key: bdb
    url: 'https://biblehub.com/hebrew/8003.htm'
    quote: 'a mind at peace with ׳י, keeping covt. relation, hence complete, perfect, 1 Kings 8:61; 1 Kings 11:4; 1 Kings 15:3,14; with אֶל2Chronicles 16:9'
  - where: 'note 16:7 “Hanani''s charge against a bargain that worked”'
    claim: 'The Hebrew verb šāʿan, Niphal, is to lean or support oneself, figuratively to trust; BDB lists it at 2 Chr. 13:18, 14:10 (KJV 14:11) and 16:7, 8'
    key: bdb
    url: 'https://biblehub.com/hebrew/8172.htm'
    quote: '[שָׁעַן] verb Niph`al lean, support oneself … lean (figurative = trust) upon, עַל person king Isaiah 10:20; Ezekiel 29:7; 2Chronicles 16:7; ׳עַליֿ Micah 3:11; Isaiah 10:20; 2Chronicles 13:18; 2 Chronicles 14:10; 2 Chronicles 16:7,8'
  - where: 'note 16:7 “Hanani''s charge against a bargain that worked”'
    claim: 'One older reading of “the host of the king of Syria escaped”: had Asa not detached Syria by his gifts, he might have defeated Israel and Syria together'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/16.htm'
    quote: 'The prophet declares that if Asa had not detached Syria by his presents, he might have smitten Israel and Syria combined.'
  - where: 'note 16:7 “Hanani''s charge against a bargain that worked”'
    claim: 'Only Chronicles records Hanani''s condemnation of Asa; Kings passes no blame'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/16.htm'
    quote: 'The Chronicler stands alone both in recording the condemnation of Asa in this passage and in himself condemning him in 2 Chronicles 16:12. In 1 Kin. no blame is passed on Asa.'
  - where: 'note 16:9 “Eyes that look for a whole heart”'
    claim: 'The verb in 16:9 is šûṭ (H7751) and the heart is šālēm (H8003)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'מְשֹׁטְט֤וֹת … לְבָבָ֥/ם שָׁלֵ֛ם'
  - where: 'note 16:9 “Eyes that look for a whole heart”'
    claim: 'A heart šālēm with the LORD is a mind at peace with Him, keeping covenant relation; BDB lists 2 Chr. 16:9 and 15:17'
    key: bdb
    url: 'https://biblehub.com/hebrew/8003.htm'
    quote: 'a mind at peace with ׳י, keeping covt. relation, hence complete, perfect, 1 Kings 8:61; 1 Kings 11:4; 1 Kings 15:3,14; with אֶל2Chronicles 16:9, אֶל omitted 2 Kings 20:3 = Isaiah 38:3 (לֵב), 1 Chronicles 12:38; 2Chronicles 15:17'
  - where: 'note 16:12 “Sought not to the LORD”'
    claim: '“Sought” in 16:12 is dāraš'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'דָרַ֣שׁ'
  - where: 'note 16:12 “Sought not to the LORD”'
    claim: '“Seek” in 14:4, 14:7, 15:2 and 15:12 is the same verb dāraš'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'לִ/דְר֕וֹשׁ … דָרַ֨שְׁנוּ֙ … תִּדְרְשֻׁ֨/הוּ֙'
  - where: 'christ'
    claim: 'Elder Oaks: the use of medical science is not at odds with prayers of faith; Brigham Young asked the sick whether they had used any remedies'
    key: oaks-2010-healing
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2010/04/healing-the-sick?lang=eng'
    quote: 'The use of medical science is not at odds with our prayers of faith and our reliance on priesthood blessings. When a person requested a priesthood blessing, Brigham Young would ask, “Have you used any remedies?”'
  - where: 'note 16:12 “Sought not to the LORD”'
    claim: 'Kings says only that Asa was diseased in his feet in his old age'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/15?lang=eng'
    quote: 'Nevertheless in the time of his old age he was diseased in his feet.'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ; LORD in the Old Testament usually means Jehovah'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary (Mosiah 3:8; 15:1; 3 Ne. 15:1–5). Usually, when the word Lord appears in the Old Testament, it means “Jehovah.”'
  - where: 'christ'
    claim: 'Prov. 3:5 “lean not” uses the same verb as Hanani''s “relied”'
    key: bdb
    url: 'https://biblehub.com/hebrew/8172.htm'
    quote: 'על with abstract noun Isaiah 30:12; Proverbs 3:5.'
  - where: 'christ'
    claim: 'Elder Oaks: we do all we can for healing and then trust in the Lord for the outcome'
    key: oaks-2010-healing
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2010/04/healing-the-sick?lang=eng'
    quote: 'We do all that we can for the healing of a loved one, and then we trust in the Lord for the outcome.'
  - where: 'explore'
    claim: 'Isa. 31:1 “stay on horses” uses the same verb šāʿan'
    key: bdb
    url: 'https://biblehub.com/hebrew/8172.htm'
    quote: 'עַלסֿוּסִים Isaiah 31:1'
