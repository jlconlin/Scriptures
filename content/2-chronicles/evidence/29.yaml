chapter: 29
claims:
  - where: 'when'
    claim: 'The doors were opened in the first month of the first year; the cleansing ended on the sixteenth day of the first month'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/29?lang=eng'
    quote: 'He in the first year of his reign, in the first month, opened the doors … in the sixteenth day of the first month they made an end.'
  - where: 'setting'
    claim: 'Ahaz cut the vessels in pieces, shut the temple doors and made altars in every corner of Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/28?lang=eng'
    quote: 'and cut in pieces the vessels of the house of God, and shut up the doors'
  - where: 'setting'
    claim: 'Hezekiah a great religious and political reformer who suppressed idolatry and reconstituted the temple services, with Isaiah''s help'
    key: bd-hezekiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hezekiah?lang=eng'
    quote: 'King of Judah, and a great religious and political reformer … He suppressed idolatry and reconstituted the temple services. In his reforms both in church and state he had the assistance of the great prophet Isaiah.'
  - where: 'setting'
    claim: 'Chronicles enlarges on the purification, the restored worship and the Passover to which the ten tribes were invited (29–31), and summarizes Sennacherib (32)'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/29.htm'
    quote: 'The author of the Chronicle, on the contrary, enlarges upon Hezekiah''s reform of the cultus, the purification of the temple from all idolatrous abominations, the restoration of the Jahve-worship, and a solemn celebration of the passover'
  - where: 'setting'
    claim: 'Verses 1–2 are paralleled in 2 Kings 18:1–3'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/29.htm'
    quote: 'Ch. 2 Chronicles 29:1-2 (= 2 Kings 18:1-3). The Reign of Hezekiah'
  - where: 'setting'
    claim: 'Hezekiah''s was the first of two major religious reforms of Judah''s later kings; Manasseh reversed it; Josiah''s came later'
    key: satterfield-divine-justification
    url: 'https://scripturecentral.org/archive/books/book-chapter/divine-justification-babylonian-destruction-jerusalem'
    quote: 'The first was initiated by Hezekiah (ca. 715–687 BC) as recorded in 2 Kings 18 and 2 Chronicles 29–31. However, Hezekiah’s son, Manasseh (ca. 687–642 BC), reversed his father’s reform policies'
  - where: 'thread'
    claim: 'One older reading: by sharing in the consecrating sacrifices the congregation consecrated itself anew and renewed the covenant of verse 10, so that only the sacrificial meal remained'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/29.htm'
    quote: 'had consecrated themselves anew to the service of the Lord as their God, and had anew made a covenant with the Lord (2 Chronicles 29:10); so that only the sacrificial meal was wanting to the completion of this celebration of the covenant'
  - where: 'thread'
    claim: 'Verse 36: it was God, not Hezekiah, who had done it'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/29.htm'
    quote: 'It was God, not Hezekiah, who had done it all.'
  - where: 'thread'
    claim: 'The Levites were more upright in heart to sanctify themselves than the priests'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/29?lang=eng'
    quote: 'for the Levites were more upright in heart to sanctify themselves than the priests.'
  - where: 'section 4 plain'
    claim: '"Made reconciliation with their blood" rendered as made a sin offering with their blood on the altar'
    key: bdb
    url: 'https://biblehub.com/hebrew/2398.htm'
    quote: '2 make a sin-offering … 2Chronicles 29:24 made a sin-offering with their blood on the altar.'
  - where: 'section 6 plain'
    claim: '"Free heart" rendered as willing'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/29?lang=eng'
    quote: 'OR willing, generous.'
  - where: 'note 29:3 “The doors Ahaz shut”'
    claim: 'Ahaz shut the doors of the house and made his own altars in every corner of Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/28?lang=eng'
    quote: 'and shut up the doors of the house of the LORD, and he made him altars in every corner of Jerusalem.'
  - where: 'note 29:3 “The doors Ahaz shut”'
    claim: 'Hezekiah later cut off the gold from the temple doors and pillars to pay Assyria'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/18?lang=eng'
    quote: 'and from the pillars which Hezekiah king of Judah had overlaid, and gave it to the king of Assyria.'
  - where: 'note 29:8 “The wrath they could see with their eyes”'
    claim: 'Syria carried a great multitude captive to Damascus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/28?lang=eng'
    quote: 'carried away a great multitude of them captives, and brought them to Damascus.'
  - where: 'note 29:8 “The wrath they could see with their eyes”'
    claim: 'Pekah slew 120,000 in one day; Israel carried away 200,000 women and children'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/28?lang=eng'
    quote: 'For Pekah the son of Remaliah slew in Judah an hundred and twenty thousand in one day … carried away captive of their brethren two hundred thousand, women, sons, and daughters'
  - where: 'note 29:8 “The wrath they could see with their eyes”'
    claim: 'The Edomites took captives and the Philistines took the lowland towns; Judah brought low because of Ahaz'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/28?lang=eng'
    quote: 'For again the Edomites had come and smitten Judah, and carried away captives. The Philistines also had invaded the cities of the low country'
  - where: 'note 29:8 “The wrath they could see with their eyes”'
    claim: 'The captives Israel took were clothed, fed and brought back to Jericho'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/28?lang=eng'
    quote: 'and brought them to Jericho, the city of palm trees, to their brethren'
  - where: 'note 29:17 “Sixteen days, and the Passover missed”'
    claim: 'The Passover was set for the fourteenth day of the first month'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/23?lang=eng'
    quote: 'In the fourteenth day of the first month at even'
  - where: 'note 29:17 “Sixteen days, and the Passover missed”'
    claim: 'The Passover was postponed because the priests had not sanctified themselves sufficiently and the people had not gathered'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/30?lang=eng'
    quote: 'because the priests had not sanctified themselves sufficiently, neither had the people gathered themselves together to Jerusalem.'
  - where: 'note 29:17 “Sixteen days, and the Passover missed”'
    claim: 'The law allowed a Passover in the second month for the unclean or those far away'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/9?lang=eng'
    quote: 'The fourteenth day of the second month at even they shall keep it'
  - where: 'note 29:24 “Reconciliation and atonement”'
    claim: '"Made reconciliation" is wayḥaṭṭəʾû (H2398, Piel); "the sin offering" at the end of the verse is ḥaṭṭāʾt (H2403); "make an atonement" is ləkappēr (H3722)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'וַֽ/יְחַטְּא֤וּ … לְ/כַפֵּ֖ר … וְ/הַ/חַטָּֽאת'
  - where: 'note 29:24 “Reconciliation and atonement”'
    claim: 'BDB lists this verse under "make a sin-offering"'
    key: bdb
    url: 'https://biblehub.com/hebrew/2398.htm'
    quote: '2 make a sin-offering … 2Chronicles 29:24 made a sin-offering with their blood on the altar.'
  - where: 'note 29:24 “Reconciliation and atonement”'
    claim: 'BDB also gives the sense of purifying the altar from sin with the blood of the sin offering'
    key: bdb
    url: 'https://biblehub.com/hebrew/2398.htm'
    quote: '3 purity from sin: the altar, by putting the blood of the sin-offering on its horns, Leviticus 8:15 (P)'
  - where: 'note 29:24 “Reconciliation and atonement”'
    claim: 'The fundamental idea of the sin offering was atonement before fellowship with Jehovah'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'The fundamental idea of the sin and trespass offerings was atonement, expiation. They implied that there was a sin, or some uncleanness akin to a sin, that needed atoning for before fellowship with Jehovah could be obtained.'
  - where: 'note 29:24 “Reconciliation and atonement”'
    claim: 'The laying on of hands made the animal the sacrificer''s representative and substitute'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'The laying on of hands (Lev. 16:21) dedicated the animal to God and made it the sacrificer’s representative and substitute (Lev. 1:4; Num. 8:10).'
  - where: 'note 29:24 “For all Israel, not Judah alone”'
    claim: 'One older reading: "all Israel" means the twelve tribes, for whom the temple was the only lawful sanctuary; the laying on of hands is mentioned because the atonement was for all Israel'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/29.htm'
    quote: '"All Israel" are probably not only all the inhabitants of the kingdom of Judah, but Israelites in general (the twelve tribes), for whom the temple in Jerusalem was the only lawful sanctuary.'
  - where: 'note 29:24 “For all Israel, not Judah alone”'
    claim: 'Samaria fell in Hezekiah''s sixth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/18?lang=eng'
    quote: 'even in the sixth year of Hezekiah, that is the ninth year of Hoshea king of Israel, Samaria was taken.'
  - where: 'note 29:24 “For all Israel, not Judah alone”'
    claim: 'Parts of Jerusalem developed in the eighth century BC with refugees from the northern kingdom'
    key: pierce-israelite-refugees
    url: 'https://rsc.byu.edu/covenant-compassion/experience-israelite-refugees'
    quote: 'Areas of Jerusalem that developed in the eighth century BC as a result of refugees from the northern kingdom of Israel, such as the Western Hill with its residential buildings, agricultural installations, and other extramural architecture, represented a sizable area of the city.'
  - where: 'note 29:24 “For all Israel, not Judah alone”'
    claim: 'Scholars estimate 53 percent of Jerusalem''s population were Israelite refugees'
    key: pierce-israelite-refugees
    url: 'https://rsc.byu.edu/covenant-compassion/experience-israelite-refugees'
    quote: 'scholars estimate that 53 percent of the population of Jerusalem and nearly half of the overall population of Judah consisted of Israelite refugees.'
  - where: 'note 29:24 “For all Israel, not Judah alone”'
    claim: 'Hezekiah wrote to Ephraim and Manasseh and called the remnant escaped from Assyria'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/30?lang=eng'
    quote: 'and wrote letters also to Ephraim and Manasseh … the remnant of you, that are escaped out of the hand of the kings of Assyria.'
  - where: 'note 29:27 “A song timed to the sacrifice”'
    claim: 'The singing went on until the burnt offering was finished'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/29?lang=eng'
    quote: 'and the singers sang, and the trumpeters sounded: and all this continued until the burnt offering was finished.'
  - where: 'note 29:31 ““Ye have filled your hand””'
    claim: 'Verse 31 reads "you have filled your hand to the LORD"'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'מִלֵּאתֶ֤ם יֶדְ/כֶם֙ לַ/יהוָ֔ה'
  - where: 'note 29:31 ““Ye have filled your hand””'
    claim: 'BDB: the phrase means consecrate, literally fill the hand, citing Exodus 32:29'
    key: bdb
    url: 'https://biblehub.com/hebrew/4390.htm'
    quote: 'consecrate מִלְאוּ יֶדְכֶם ליהוה; (literally fill the hand) Exodus 32:29'
  - where: 'note 29:31 ““Ye have filled your hand””'
    claim: 'Moses told the Levites to consecrate themselves'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/32?lang=eng'
    quote: 'For Moses had said, Consecrate yourselves to day'
  - where: 'note 29:31 ““Ye have filled your hand””'
    claim: 'The burnt offering expressed a constant obligation to surrender, and its burning symbolized the worshipper''s consecration'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'As the obligation to surrender was constant on the part of Israel … This act symbolized the consecration of the worshipper to Jehovah.'
  - where: 'note 29:31 ““Ye have filled your hand””'
    claim: 'Peace offerings presupposed peace with God; their mark was the sacrificial meal of fellowship and joy'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'Peace offerings, as the name indicates, presupposed that the sacrificer was at peace with God … The characteristic rite was the sacrificial meal. A feast symbolized fellowship and friendship among all its partakers and providers, and also a state of joy and gladness'
  - where: 'note 29:31 ““Ye have filled your hand””'
    claim: 'The thank offering is a kind of peace offering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/7?lang=eng'
    quote: 'And this is the law of the sacrifice of peace offerings … If he offer it for a thanksgiving'
  - where: 'note 29:31 ““Ye have filled your hand””'
    claim: 'The footnote gives "free" as willing, generous'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/29?lang=eng'
    quote: 'OR willing, generous.'
  - where: 'note 29:34 “Levites more ready than priests”'
    claim: 'The law gave the flaying to the worshipper'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/1?lang=eng'
    quote: 'And he shall flay the burnt offering, and cut it into his pieces.'
  - where: 'note 29:34 “Levites more ready than priests”'
    claim: 'One older reading: at public sacrifices flaying fell to the priests, and Levites could help as it was not specifically priestly'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/29.htm'
    quote: 'In the case of private burnt-offerings the flaying of the beast was the business of the sacrificer (Leviticus 1:6); while in the case of those offered on solemn occasions in the name of the congregation it was the priest''s duty, and in it, as the work was not of a specifically priestly character, the Levites might assist.'
  - where: 'note 29:34 “Levites more ready than priests”'
    claim: 'The same reading suggests, perhaps, that the priests took more part in Ahaz''s idolatry through their dependence on the court'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/29.htm'
    quote: 'Perhaps the priests had taken more part in the idolatrous worship of Ahaz than the Levites, which would be quite accounted for … by their relation to the court of the king, and their dependence upon it.'
  - where: 'note 29:34 “Levites more ready than priests”'
    claim: 'At the Passover the priests had not sanctified themselves sufficiently; priests and Levites were ashamed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/30?lang=eng'
    quote: 'and the priests and the Levites were ashamed, and sanctified themselves'
  - where: 'christ'
    claim: 'Sacrifice was given in similitude of the sacrifice of the Only Begotten; it ended with Christ''s death and the sacrament replaces it in remembrance of His offering'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'in a similitude of the sacrifice that would be made of the Only Begotten Son of God … This continued until the death of Jesus Christ, which ended the shedding of blood as a gospel ordinance. It is now replaced in the Church by the sacrament of the bread and the water, in remembrance of the offering of Jesus Christ.'
  - where: 'christ'
    claim: 'The laying on of hands made the animal the sacrificer''s representative and substitute'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'made it the sacrificer’s representative and substitute'
  - where: 'christ'
    claim: 'The angel told Adam that sacrifice is a similitude of the Only Begotten'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/5?lang=eng'
    quote: 'This thing is a similitude of the sacrifice of the Only Begotten of the Father, which is full of grace and truth.'
