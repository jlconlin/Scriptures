chapter: 9
claims:
  - where: setting
    claim: 'Kings tells Solomon''s wives and turning between the horses (10:28–29) and the closing formula (11:41); its heading summarizes the chapter'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: 'Solomon marries non-Israelite women, and his wives turn his heart to the worship of false gods—The Lord stirs up advers…'
  - where: setting
    claim: 'Chronicles passes over the section of 1 Kings 11 on Solomon''s idolatry and the troubles of his reign'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/9.htm'
    quote: 'An important section of 1 Kin. (2 Chronicles 11:1-23) giving an account of Solomon’s patronage of idolatry and of the troubles of his reign is unnoticed by the Chronicler.'
  - where: setting
    claim: 'The writers of Chronicles seem to have assumed readers knew Samuel and Kings'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'It appears that the author or authors of Chronicles assumed that readers would be familiar with the books of Samuel and Kings.'
  - where: setting
    claim: 'Chronicles 10:15 refers to Ahijah''s word, which it does not narrate, assuming it known'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/10.htm'
    quote: 'Ahijah] Cp. 1 Kings 11:29-39. The incident referred to is not narrated in Chron., being assumed to be known.'
  - where: setting
    claim: 'The text of 2 Chr. 10:15 naming the word spoken by Ahijah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/10?lang=eng'
    quote: 'that the Lord might perform his word, which he spake by the hand of Ahijah the Shilonite to Jeroboam the son of Nebat.'
  - where: setting
    claim: 'Chronicles addresses whether the covenant still stands, written to give hope and an identity based on worship'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'the question Chronicles appears to address is “Are we still God''s people and does the covenant still stand?" The Chronicler writes to give hope, to create an identity based on worship and the ideals of the kingdom'
  - where: thread
    claim: 'The Church''s footnote to "riches" in the Kings parallel (1 Kgs. 10:23) points to the promise at Gibeon (1 Kgs. 3:13)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/10?lang=eng'
    quote: '23a “riches”: 1 Kgs. 3:13.'
  - where: thread
    claim: 'Kings'' summary of Solomon''s riches, the verse the footnote is on'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/10?lang=eng'
    quote: 'So king Solomon exceeded all the kings of the earth for riches and for wisdom.'
  - where: 'note 9:8 “On his throne”'
    claim: 'Kings has "on the throne of Israel" and "loved Israel for ever"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/10?lang=eng'
    quote: 'Blessed be the Lord thy God, which delighted in thee, to set thee on the throne of Israel: because the Lord loved Israel for ever, therefore made he thee king, to do judgment and justice.'
  - where: 'note 9:8 “On his throne”'
    claim: 'Chronicles has "on his throne, to be king for the LORD thy God" and "to establish them for ever"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/9?lang=eng'
    quote: 'to set thee on his throne, to be king for the Lord thy God: because thy God loved Israel, to establish them for ever'
  - where: 'note 9:8 “On his throne”'
    claim: 'On an older reading the throne is God''s and the king occupies it as a deputy; cf. 1 Chr. 28:5; 29:23'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/9.htm'
    quote: 'on his throne] The Israelite throne is God’s; the visible king occupies it only as a deputy. Cp. 1 Chronicles 28:5 (“the throne of the kingdom of the Lord”); ibid. 1 Chronicles 29:23 (“Solomon sat on the throne of the Lord”).'
  - where: 'note 9:21 “Ships that went to Tarshish”'
    claim: '"Ships of Tarshish" came to mean the largest ships for long voyages; the main Tarshish probably Tartessus in Spain, including Jonah 1:3'
    key: bd-tarshish
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tarshish?lang=eng'
    quote: '(1) Probably Tartessus in Spain; ships of Tarshish (the name came to be used to denote ships of the largest size, suitable for long voyages) (1 Kgs. 10:22; … also Isa. 66:19; Jer. 10:9; Jonah 1:3; 4:2).'
  - where: 'note 9:21 “Ships that went to Tarshish”'
    claim: 'The Bible Dictionary lists a second Tarshish in the Indian Ocean for 1 Kgs. 22:48; 2 Chr. 9:21; 20:36'
    key: bd-tarshish
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tarshish?lang=eng'
    quote: '(2) A Tarshish in the Indian Ocean (1 Kgs. 22:48; 2 Chr. 9:21; 20:36).'
  - where: 'note 9:21 “Ships that went to Tarshish”'
    claim: 'Kings has "a navy of Tharshish"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/10?lang=eng'
    quote: 'For the king had at sea a navy of Tharshish with the navy of Hiram'
  - where: 'note 9:21 “Ships that went to Tarshish”'
    claim: 'Jehoshaphat''s ships at Ezion-geber were to go to Tarshish (Chronicles) and to Ophir (Kings)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/22?lang=eng'
    quote: 'Jehoshaphat made ships of Tharshish to go to Ophir for gold: but they went not; for the ships were broken at Ezion-geber.'
  - where: 'note 9:21 “Ships that went to Tarshish”'
    claim: 'Chronicles: ships made in Ezion-geber to go to Tarshish'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/20?lang=eng'
    quote: 'And he joined himself with him to make ships to go to Tarshish: and they made the ships in Ezion-geber.'
  - where: 'note 9:21 “Ships that went to Tarshish”'
    claim: 'Jonah sailed for Tarshish from Joppa'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jonah/1?lang=eng'
    quote: 'But Jonah rose up to flee unto Tarshish from the presence of the Lord, and went down to Joppa'
  - where: 'note 9:29 “Nathan, Ahijah and Iddo”'
    claim: 'The book of Nathan, the prophecy of Ahijah and the visions of Iddo are lost books, considered authentic and valuable'
    key: bd-lost-books
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/lost-books?lang=eng'
    quote: 'documents that are mentioned in the Bible in such a way that it is evident they were considered authentic and valuable but that are not found in the Bible today. … book of Nathan the prophet (1 Chr. 29:29; 2 Chr. 9:29); prophecy of Ahijah (2 Chr. 9:29); visions of Iddo the seer (2 Chr. 9:29; 12:15; 13:22)'
  - where: 'note 9:29 “Nathan, Ahijah and Iddo”'
    claim: 'Kings cites the book of the acts of Solomon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: 'And the rest of the acts of Solomon, and all that he did, and his wisdom, are they not written in the book of the acts of Solomon?'
  - where: christ
    claim: 'The throne passed to Rehoboam (9:31), under whom the kingdom divided (10:15–19); Luke 1:32–33; Luke 11:31; Rev. 1:18'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/10?lang=eng'
    quote: 'So the king hearkened not unto the people: for the cause was of God, that the Lord might perform his word'
