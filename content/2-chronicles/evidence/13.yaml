chapter: 13
claims:
  - where: 'setting'
    claim: 'Kings calls him Abijam and gives a hard verdict'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/15?lang=eng'
    quote: 'And he walked in all the sins of his father, which he had done before him: and his heart was not perfect with the LORD his God, as the heart of David his father.'
  - where: 'setting'
    claim: 'Abijam is the name in the Hebrew of Kings'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/13.htm'
    quote: '1. Abijah] Called Abijam in the Heb. of 1 Kin.'
  - where: 'setting'
    claim: 'Kings recounts none of his enterprises; Chronicles narrates a great war'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/13.htm'
    quote: 'but not one of his enterprises is recounted, and only his attitude towards the Lord is exactly characterized. In our chapter, on the contrary, we have a vivid and circumstantial narrative of the commencement, course, and results of a great war against Jeroboam'
  - where: 'setting'
    claim: 'The account of the war is found only in Chronicles'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/13.htm'
    quote: 'The account of this war, which is peculiar to the Chronicle'
  - where: 'setting'
    claim: 'Kings and Chronicles ask different questions; Chronicles writes to give an identity based on worship and the kingdom'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'the question Chronicles appears to address is “Are we still God''s people and does the covenant still stand?" The Chronicler writes to give hope, to create an identity based on worship and the ideals of the kingdom, and to legitimize their newly rebuilt temple.'
  - where: 'setting'
    claim: 'Kings asks why the nation was destroyed'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'The broad question that the books of Joshua through 2 Kings, often referred to as the Deuteronomistic History, appears to address is "Why did God let our nation get destroyed and our temple burned?"'
  - where: 'setting'
    claim: 'One older reading: Abijah''s speech is reconcilable with 1 Kgs. 15:3; he had promoted temple worship by gifts'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/13.htm'
    quote: 'is founded on the truth, and is also reconcilable with the statement in 1 Kings 15:3, that Abijah''s heart was not wholly devoted to the Lord, like David''s heart. Abijah had promoted the legal temple-worship even by consecratory gifts (1 Kings 15:15)'
  - where: 'section 2 plain'
    claim: 'Children of Belial: sons of worthlessness, scoundrels (the Church''s footnote)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/13?lang=eng'
    quote: '“children of Belial”: HEB sons of worthlessness; scoundrels.'
  - where: 'section 4 plain'
    claim: '"Story" is midrash, rendered commentary'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/13.htm'
    quote: '22. in the story] R.V. in the commentary, Heb. midrash.'
  - where: 'note 13:3 “Four hundred thousand against eight hundred thousand”'
    claim: 'Numbers were difficult to transmit; extra noughts added in copying'
    key: ot-manual-large-numbers
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/enrichment-section-e-the-problem-of-large-numbers-in-the-old-testament?lang=eng'
    quote: 'There is also evidence from the parallel passages in Samuel, Kings and Chronicles and (especially) in Ezra 2 and Nehemiah 7 that numbers were peculiarly difficult to transmit accurately. We have instances of extra noughts being added to a number'
  - where: 'note 13:3 “Four hundred thousand against eight hundred thousand”'
    claim: '"Thousand" used for "captains of thousands"'
    key: ot-manual-large-numbers
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/enrichment-section-e-the-problem-of-large-numbers-in-the-old-testament?lang=eng'
    quote: 'by metonymy or by abbreviation ‘thousand’ has been used for ‘captains of thousands’ and ‘hundreds’ for ‘captains of hundreds.’'
  - where: 'note 13:3 “Four hundred thousand against eight hundred thousand”'
    claim: 'Most numerical problems of the later history fall into place; the Ethiopian host a thousand'
    key: ot-manual-large-numbers
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/enrichment-section-e-the-problem-of-large-numbers-in-the-old-testament?lang=eng'
    quote: 'Along these lines most of the numerical problems of the later history fall into place. … The Ethiopian invasion had a thousand, not a million, warriors (2 Chronicles 14:9).'
  - where: 'note 13:3 “Four hundred thousand against eight hundred thousand”'
    claim: 'The figures as the text gives them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/13?lang=eng'
    quote: 'even four hundred thousand chosen men: Jeroboam also set the battle in array against him with eight hundred thousand chosen men'
  - where: 'note 13:5 “A covenant of salt”'
    claim: 'The lexicon lists "covenant of salt" at Num. 18:19 and 2 Chr. 13:5'
    key: bdb
    url: 'https://biblehub.com/hebrew/4417.htm'
    quote: 'בְּרִית מֶ֫לַח Numbers 18:19; 2Chronicles 13:5 (compare Leviticus 2:13 see Di)'
  - where: 'note 13:5 “A covenant of salt”'
    claim: 'The Hebrew of 13:5 is berit melach'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'בְּרִ֥ית מֶֽלַח'
  - where: 'note 13:5 “A covenant of salt”'
    claim: 'The Church''s footnote sends "covenant" to Num. 18:19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/13?lang=eng'
    quote: '“covenant”: Num. 18:19; 3 Ne. 12:13.'
  - where: 'note 13:7 “Young and tenderhearted”'
    claim: 'The Hebrew is naʿar and rak lebab'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'נַ֨עַר֙ וְ/רַךְ לֵבָ֔ב'
  - where: 'note 13:7 “Young and tenderhearted”'
    claim: 'rak lebab in construct at Deut. 20:8 and 2 Chr. 13:7'
    key: bdb
    url: 'https://biblehub.com/hebrew/7390.htm'
    quote: 'רַךְ adjective tender, delicate, soft; — ׳ר absolute Genesis 18:7 +, construct Deuteronomy 20:8; 2Chronicles 13:7'
  - where: 'note 13:7 “Young and tenderhearted”'
    claim: '"Young" is metaphorical, inexperienced in government, like Solomon''s "little child"; "tender hearted" may be rendered fainthearted as in Deut. 20:8'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/13.htm'
    quote: 'It is probable, however, that the word is used metaphorically to describe one who was young (as indeed his conduct shewed) in experience of government; so Solomon (1 Kings 3:7) calls himself a little child … Or we may translate the Heb. phrase as in Deuteronomy 20:8, fainthearted.'
  - where: 'note 13:7 “Young and tenderhearted”'
    claim: 'One older reading: the speech does not match chapter 10; Abijah justifies his father'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/13.htm'
    quote: 'This representation does not conform to the state of the case as narrated in 2 Chronicles 10. Rehoboam did not appear soft-hearted and compliant … But Abijah wishes to justify his father as much as possible in his speech, and shifts all the guilt of the rebellion'
  - where: 'note 13:7 “Young and tenderhearted”'
    claim: 'Rehoboam was forty-one when he began to reign'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/12?lang=eng'
    quote: 'for Rehoboam was one and forty years old when he began to reign'
  - where: 'note 13:7 “Young and tenderhearted”'
    claim: '"Young" is literally a child'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/13.htm'
    quote: 'young] Lit. a child.'
  - where: 'note 13:7 “Young and tenderhearted”'
    claim: '"Tender hearted" in Hebrew idiom may mean weak in understanding'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/13.htm'
    quote: 'tender hearted] i.e., according to Heb. phraseology, weak in understanding'
  - where: 'note 13:9 “A young bullock and seven rams”'
    claim: 'The Hebrew of 13:9 is "to fill his hand"'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'לְ/מַלֵּ֨א יָד֜/וֹ'
  - where: 'note 13:9 “A young bullock and seven rams”'
    claim: 'To fill the hand means to consecrate'
    key: bdb
    url: 'https://biblehub.com/hebrew/4390.htm'
    quote: 'consecrate מִלְאוּ יֶדְכֶם ליהוה; (literally fill the hand) Exodus 32:29'
  - where: 'note 13:9 “A young bullock and seven rams”'
    claim: 'The Church''s footnote sends "bullock" to Ex. 29:1; the law''s consecration of Aaron''s sons'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/29?lang=eng'
    quote: 'Take one young bullock, and two rams without blemish'
  - where: 'note 13:12 “Trumpets to cry alarm”'
    claim: 'The priests'' trumpets and the promise in war'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/10?lang=eng'
    quote: 'And if ye go to war in your land against the enemy that oppresseth you, then ye shall blow an alarm with the trumpets; and ye shall be remembered before the LORD your God, and ye shall be saved from your enemies.'
  - where: 'note 13:12 “Trumpets to cry alarm”'
    claim: 'The Hebrew is hatsotserot hatteruah'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'וַ/חֲצֹצְר֥וֹת הַ/תְּרוּעָ֖ה'
  - where: 'note 13:12 “Trumpets to cry alarm”'
    claim: 'The lexicon puts the trumpets of alarm of 2 Chr. 13:12 with Num. 10:5–6 and Num. 31:6'
    key: bdb
    url: 'https://biblehub.com/hebrew/8643.htm'
    quote: '2 blast for march: ׳תקע ת Numbers 10:5,6 (twice in verse) (P; with חֲצֹצְרוֺת; hence) ׳חֲצֹצְרוֺת הַתּ Numbers 31:6 (P) 2 Chronicles 13:12'
  - where: 'note 13:12 “Trumpets to cry alarm”'
    claim: 'One older reading: the trumpets as pledges that God would remember them (Num. 10:9)'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/13.htm'
    quote: 'He mentions the trumpets as being the divinely appointed pledges that God would remember them in war, and would deliver them from their enemies, Numbers 10:9.'
  - where: 'note 13:18 “Because they relied upon the LORD”'
    claim: 'The Hebrew is nishanu, from shaan'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'נִשְׁעֲנ֔וּ'
  - where: 'note 13:18 “Because they relied upon the LORD”'
    claim: 'shaan means lean, support oneself, figuratively trust; the lexicon gathers 13:18, 14:10 (KJV 14:11), 16:7–8'
    key: bdb
    url: 'https://biblehub.com/hebrew/8172.htm'
    quote: '[שָׁעַן] verb Niph`al lean, support oneself; … lean (figurative = trust) upon, עַל person king Isaiah 10:20; Ezekiel 29:7; 2Chronicles 16:7; ׳עַליֿ Micah 3:11; Isaiah 10:20; 2Chronicles 13:18; 2 Chronicles 14:10; 2 Chronicles 16:7,8'
  - where: 'note 13:18 “Because they relied upon the LORD”'
    claim: 'Hanani''s rebuke of Asa uses "relied"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/16?lang=eng'
    quote: 'Because thou hast relied on the king of Syria, and not relied on the LORD thy God, therefore is the host of the king of Syria escaped out of thine hand.'
  - where: 'note 13:20 “The LORD struck him”'
    claim: 'The Church''s footnote sets "struck" beside 1 Sam. 25:38'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/13?lang=eng'
    quote: '“struck”: 1 Sam. 25:38; Alma 30:52 (1–60).'
  - where: 'note 13:20 “The LORD struck him”'
    claim: 'By Kings'' count Jeroboam reigned 22 years and Asa began in his twentieth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/15?lang=eng'
    quote: 'And in the twentieth year of Jeroboam king of Israel reigned Asa over Judah.'
  - where: 'note 13:20 “The LORD struck him”'
    claim: 'Kings says Jeroboam reigned twenty-two years and slept with his fathers'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/14?lang=eng'
    quote: 'And the days which Jeroboam reigned were two and twenty years: and he slept with his fathers'
  - where: 'note 13:22 “The midrash of Iddo”'
    claim: 'The Hebrew is bemidrash'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'בְּ/מִדְרַ֖שׁ הַ/נָּבִ֥יא עִדּֽוֹ'
  - where: 'note 13:22 “The midrash of Iddo”'
    claim: 'midrash: study, exposition; late; only 2 Chr. 24:27 and 13:22; probably didactic'
    key: bdb
    url: 'https://biblehub.com/hebrew/4097.htm'
    quote: '[מִדְרָשׁ] noun [masculine] study, exposition, midrash, only construct מִדְרַשׁ (late; common in Late Hebrew, in sense of imaginative exposition or didactic story) … These were probably of a didactic character'
  - where: 'note 13:22 “The midrash of Iddo”'
    claim: 'Iddo''s writings are among the lost books, cited at 9:29, 12:15, 13:22'
    key: bd-lost-books
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/lost-books?lang=eng'
    quote: 'those documents that are mentioned in the Bible in such a way that it is evident they were considered authentic and valuable but that are not found in the Bible today. … visions of Iddo the seer (2 Chr. 9:29; 12:15; 13:22)'
  - where: 'note 13:22 “The midrash of Iddo”'
    claim: '"Story" in 2 Chr. 24:27 also renders midrash'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/24?lang=eng'
    quote: 'behold, they are written in the story of the book of the kings.'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'The King James prints the name Jehovah as LORD in small capitals'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'In the KJV, the Jewish custom has been followed, and the name is generally denoted by Lord or God, printed in small capitals.'
