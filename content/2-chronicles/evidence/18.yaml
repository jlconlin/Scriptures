chapter: 18
claims:
  - where: 'when'
    claim: 'Kings dates the visit to the third year of peace, at the battle where Ahab died'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/22?lang=eng'
    quote: 'And it came to pass in the third year, that Jehoshaphat the king of Judah came down to the king of Israel.'
  - where: 'setting'
    claim: 'Chronicles repeats Jehoshaphat''s riches from 17:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/17?lang=eng'
    quote: 'Therefore the LORD stablished the kingdom in his hand; and all Judah brought to Jehoshaphat presents; and he had riches and honour in abundance.'
  - where: 'setting'
    claim: '2 Chronicles mentions the northern kingdom only where it touches Judah'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'The book of 2 Chronicles primarily focuses on events in the Southern Kingdom of Judah. It generally mentions the Northern Kingdom only in the context of its interactions with Judah.'
  - where: 'setting'
    claim: 'Verses 4–34 agree almost word for word with 1 Kgs. 22:5–35; the opening differs (the feast, "after certain years" for "in the third year")'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/18.htm'
    quote: 'In the Chronicle the more exact statement, "in the third year," which is intelligible only in connection with the earlier history of Ahab, is exchanged for the indefinite שׁנים לקץ, "at the end of years;" … is in almost verbal agreement with 1 Kings 22:5-35.'
  - where: 'setting'
    claim: 'Chronicles ends the account at Ahab''s death; the return of the army and the burial in 1 Kgs. 22:36–39 did not fit its plan'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/18.htm'
    quote: 'With Ahab''s death, which took place in the evening at the time of the going down of the sun, the author of the Chronicle concludes his account of this war … In 1 Kings 22:36-39, the return of the defeated army, and the details as to Ahab''s death and burial, are recorded; but these did not fit into the plan of the Chronicle.'
  - where: 'setting'
    claim: 'Kings goes on to the dogs licking Ahab''s blood, according to the word of the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/22?lang=eng'
    quote: 'And one washed the chariot in the pool of Samaria; and the dogs licked up his blood; and they washed his armour; according unto the word of the LORD which he spake.'
  - where: 'thread'
    claim: 'Jehu rebuked Jehoshaphat for his alliance with Ahab, who promoted Baal worship'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'However, Jehoshaphat was rebuked by the prophet Jehu for his alliance with King Ahab of the Northern Kingdom. Ahab and his wife, Jezebel, promoted the worship of Baal and Asherah throughout their kingdom.'
  - where: 'thread'
    claim: 'Jehu''s rebuke after the return'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/19?lang=eng'
    quote: 'And Jehu the son of Hanani the seer went out to meet him, and said to king Jehoshaphat, Shouldest thou help the ungodly, and love them that hate the LORD? therefore is wrath upon thee from before the LORD.'
  - where: 'thread'
    claim: 'Come, Follow Me reads the chapter for Micaiah''s courage and integrity under pressure; verse 14 is sarcastic, his real answer is verse 16'
    key: cfm-ot-2026-30
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/30?lang=eng'
    quote: 'What evidence do you find of Micaiah’s courage and integrity in verses 13–27? (Note that in verse 14, Micaiah gives a sarcastic response; his real answer is in verse 16.)'

  - where: 'note 18:1 “Riches, honour and a marriage alliance with Ahab”'
    claim: 'The affinity was the marriage of Jehoram, Jehoshaphat''s son, to Ahab''s daughter'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/21?lang=eng'
    quote: 'And he walked in the way of the kings of Israel, like as did the house of Ahab: for he had the daughter of Ahab to wife'
  - where: 'note 18:1 “Riches, honour and a marriage alliance with Ahab”'
    claim: 'Keil: the marriage had preceded the visit by about nine years'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/18.htm'
    quote: 'Jehoshaphat came into connection by marriage with Ahab through his son Joram taking Athaliah, a daughter of Ahab, to wife (2 Chronicles 21:6); an event which did not take place on the visit … but which had preceded that by about nine years.'
  - where: 'note 18:1 “Riches, honour and a marriage alliance with Ahab”'
    claim: 'Keil: the Chronicler regarded the marriage as a mistake, and the repeated riches hint that Jehoshaphat had no need of it'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/18.htm'
    quote: 'we see that the author of the Chronicle can only have regarded the marriage connection between Jehoshaphat and Ahab as a mistake. By introducing this account of it by a second reference to Jehoshaphat''s riches and power, he must therefore have intended to hint that Jehoshaphat had no need to enter into this relationship'
  - where: 'note 18:1 “Riches, honour and a marriage alliance with Ahab”'
    claim: 'Athaliah destroyed the royal seed of Judah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/22?lang=eng'
    quote: 'But when Athaliah the mother of Ahaziah saw that her son was dead, she arose and destroyed all the seed royal of the house of Judah.'
  - where: 'note 18:1 “Riches, honour and a marriage alliance with Ahab”'
    claim: 'Killing sheep and oxen implies a feast'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/18.htm'
    quote: '2. killed sheep and oxen] This phrase implies a feast, for flesh is eaten in the East only on festal occasions.'
  - where: 'note 18:1 “Riches, honour and a marriage alliance with Ahab”'
    claim: 'Chronicles makes Jehoshaphat''s words a definite promise to go to war'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/18.htm'
    quote: '3. and we will be with thee in the war] In 1 Kin. the corresponding phrase is, my horses as thy horses. The Chronicler makes the words of Jehoshaphat a definite promise.'

  - where: 'note 18:21 “What Joseph Smith changed in the vision”'
    claim: 'Nyman: chapter 18 has three significant changes, historical and doctrinal'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'Chapter 18, however, has three significant changes which not only correct the story historically but doctrinally as well'
  - where: 'note 18:21 “What Joseph Smith changed in the vision”'
    claim: 'JST 18:20: a lying spirit came out and stood before them'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'Then there came out a lying spirit, and stood before them, and said, I will entice him, Wherewith?'
  - where: 'note 18:21 “What Joseph Smith changed in the vision”'
    claim: 'JST 18:21 adds: for all these have sinned against me'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/18?lang=eng'
    quote: 'JST 2 Chr. 18:21 … so; for all these have sinned against me.'
  - where: 'note 18:21 “What Joseph Smith changed in the vision”'
    claim: 'JST 18:22 reads found; the Appendix heads it: the Lord does not put a lying spirit into the mouths of prophets'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-2-chr/18?lang=eng'
    quote: 'The Lord does not put a lying spirit into the mouths of prophets. … Now therefore, behold, the Lord hath found a lying spirit in the mouth of these thy prophets, and the Lord hath spoken evil against thee.'
  - where: 'note 18:21 “What Joseph Smith changed in the vision”'
    claim: 'Nyman''s reading: the Lord does not send spirits to lie but allows them among those who have sinned'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'As noted in these verses, the Lord does not send out spirits to tell lies, but does allow them to go forth among those who have sinned against him.'
  - where: 'note 18:21 “What Joseph Smith changed in the vision”'
    claim: 'Scripture Helps on 2 Chr. 18:18–21 sends the reader to its entry on 1 Kgs. 22:22–23'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'See “1 Kings 22:22–23. Did the Lord send a lying spirit to Ahab’s prophets?”'

  - where: 'note 18:31 “The LORD helped him”'
    claim: 'Kings has only "Jehoshaphat cried out"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/22?lang=eng'
    quote: 'And they turned aside to fight against him: and Jehoshaphat cried out.'
  - where: 'note 18:31 “The LORD helped him”'
    claim: 'Jehoshaphat returned to Jerusalem in peace'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/19?lang=eng'
    quote: 'And Jehoshaphat the king of Judah returned to his house in peace to Jerusalem.'

  - where: 'christ'
    claim: 'The Topical Guide sets 2 Chr. 18:16 with Num. 27:17, Matt. 9:36 and John 10:11 under Shepherd'
    key: tg-shepherd
    url: 'https://www.churchofjesuschrist.org/study/scriptures/tg/shepherd?lang=eng'
    quote: 'be not as sheep which have no shepherd , Num. 27:17 ( 1 Kgs. 22:17 ; 2 Chr. 18:16 ). … scattered abroad, as sheep having no shepherd , Matt. 9:36 … I am the good shepherd , John 10:11'
  - where: 'christ'
    claim: 'Come, Follow Me draws from the chapter the principle of defending truth when it is unpopular'
    key: cfm-ot-2026-30
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/30?lang=eng'
    quote: '2 Chronicles 18: I can defend the truth, even when it’s unpopular.'
  - where: 'note 18:21 “What Joseph Smith changed in the vision”'
    claim: 'Nyman: most of the JST changes in 2 Chronicles are insignificant'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'The fact that most of these changes are insignificant suggests that the Prophet did not work much on this book.'
  - where: 'note 18:21 “What Joseph Smith changed in the vision”'
    claim: 'JST 18:21 ends the LORD''s word with the reason'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'go out, and do even so; for all these have sinned against me.'
