chapter: 23
claims:
  - where: 'when'
    claim: 'Joash was hidden six years in the house of God while Athaliah reigned; the chapter opens in the seventh year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/22?lang=eng'
    quote: 'And he was with them hid in the house of God six years: and Athaliah reigned over the land.'
  - where: 'setting'
    claim: 'Athaliah destroyed the seed royal; Jehoshabeath, wife of Jehoiada, hid Joash'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/22?lang=eng'
    quote: 'So Jehoshabeath, the daughter of king Jehoram, the wife of Jehoiada the priest, (for she was the sister of Ahaziah,) hid him from Athaliah, so that she slew him not.'
  - where: 'setting'
    claim: 'Athaliah was the daughter of Ahab and Jezebel and brought Baal worship into Judah as her mother had into Israel'
    key: bd-athaliah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/athaliah?lang=eng'
    quote: 'Daughter of Ahab, king of Israel, and his Phoenician wife Jezebel. … introduced Baal worship into the southern kingdom as her mother had done in the northern kingdom (2 Chr. 22:2–4; 24:7).'
  - where: 'setting'
    claim: '2 Chronicles 10–35 is the division of the kingdom and the history of the kings of Judah'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: '2 Chronicles 10–35: The division of the kingdom and the history of the kings of Judah.'
  - where: 'setting'
    claim: 'Chronicles names the five captains, which Kings does not'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/23.htm'
    quote: 'the names of the five princes over hundreds, with whose co-operation Jehoiada elaborated his plan and carried it into execution, are individually enumerated; while in 2 Kings 11 … they will be sought for in vain.'
  - where: 'setting'
    claim: 'Kings words the covenant between the LORD, the king and the people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/11?lang=eng'
    quote: 'And Jehoiada made a covenant between the Lord and the king and the people, that they should be the Lord’s people; between the king also and the people.'
  - where: 'setting'
    claim: 'One older reading: “him” in 23:16 is Jehoiada himself, as the LORD''s representative'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/23.htm'
    quote: 'בּינו, between himself, the same as between himself, the high priest, as representative of Jehovah. In 2 Kings 11:17, the matter is more clearly expressed.'
  - where: 'setting'
    claim: 'Chronicles expands Kings'' “appointed officers” into the Davidic order of priests, Levites and porters'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/23.htm'
    quote: 'the statement, "the priest set overseers over the house of Jahve," is expanded by the addition of the words, "by means of the Levitic priests whom David had distributed for the house of Jahve to offer sacrifices;...and he placed doorkeepers'
  - where: 'thread'
    claim: 'The chapter heading: worship of the Lord is restored'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/23?lang=eng'
    quote: 'Jehoiada the priest makes Joash king—Athaliah is slain—Worship of the Lord is restored, and the priest of Baal is slain.'
  - where: 'thread'
    claim: 'The tribe of Levi was assigned the ministering in the sanctuary'
    key: bd-levites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levites?lang=eng'
    quote: 'Descendants of Levi. The work of ministering in the sanctuary was assigned to this tribe.'
  - where: 'section 2 plain'
    claim: 'The testimony given the king is glossed as the divine charge'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/23?lang=eng'
    quote: '11a “testimony”: IE divine charge; see Deut. 17:14–20.'
  - where: 'section 3 plain'
    claim: '“Forth of the ranges” means out between the ranks'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/23?lang=eng'
    quote: '14a “of the ranges”: OR between the ranks.'
  - where: 'section 3 plain'
    claim: 'The singers played instruments and led the singing of praise'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/23.htm'
    quote: 'also the singers … to sing praise] R.V. the singers also played on instruments of music, and led the singing of praise.'
  - where: 'section 4 plain'
    claim: '“Between him” means between himself (Jehoiada)'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/23.htm'
    quote: '16. between him … the king] R.V. between himself, and all the people, and the king.'
  - where: 'note 23:3 “The promise Jehoiada stood on”'
    claim: 'In Kings Jehoiada makes a covenant with the captains and shows them the king''s son, without giving a reason'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/11?lang=eng'
    quote: 'made a covenant with them, and took an oath of them in the house of the Lord, and shewed them the king’s son.'
  - where: 'note 23:3 “The promise Jehoiada stood on”'
    claim: 'The footnote to “David” in 23:3 points to 2 Sam. 7:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/23?lang=eng'
    quote: '“David”: 2 Sam. 7:12.'
  - where: 'note 23:4 “Levites where Kings has the guard”'
    claim: 'Kings has the royal guard; Chronicles the Levites and heads of fathers'' houses'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/23.htm'
    quote: 'according to 2 Kings 11, the high priest would appear to have mainly availed himself of the co-operation of the royal body-guard in the execution of his plan, while according to the Chronicle it is the Levites and the heads of the fathers''-houses who are made use of.'
  - where: 'note 23:4 “Levites where Kings has the guard”'
    claim: 'The captains are not called Levites and may have been officers of the royal guard'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/23.htm'
    quote: 'are not called Levites, and may consequently have been captains of the executioners and runners, i.e., of the royal body-guard, as they are designated in 2 Kings 11:4.'
  - where: 'note 23:4 “Levites where Kings has the guard”'
    claim: 'One older commentary: Levitical guards take the place of the royal guards, less accurately than in Kings'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/23.htm'
    quote: 'The arrangements are differently (and no doubt less accurately) stated in Chron. In the first place Levitical Temple guards take the place of the royal guards'
  - where: 'note 23:4 “Levites where Kings has the guard”'
    claim: 'The other older reading: both accounts are extracts from a fuller narrative and supplement each other'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/23.htm'
    quote: 'the author of the book of Kings emphasizing the part played in the affair by the royal body-guard; the author of the Chronicle, on the other hand, emphasizing that played by the Levites: so that both accounts mutually supplement each other, and only when taken together give a full view'
  - where: 'note 23:4 “Levites where Kings has the guard”'
    claim: 'Keil: the two are extracts from a more detailed narrative, not one copied from the other'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/23.htm'
    quote: 'if, on the contrary, the two accounts be recognised to be extracts confining themselves to the main points, excerpted from a more detailed narrative of the event from different points of view, the discrepancies may be at once reconciled.'
  - where: 'note 23:4 “Levites where Kings has the guard”'
    claim: 'The “house” of verse 6 is the temple building; the people keep outside the limits the law sets'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/23.htm'
    quote: 'is the temple building, i.e., the holy place and the most holy, as distinguished from the courts … keep without the limits appointed in the law to the people in drawing near to the sanctuaries.'
  - where: 'note 23:4 “Levites where Kings has the guard”'
    claim: 'Ministering in the sanctuary belonged to Levi; the Levites were cleansed for their office and given to God in place of the firstborn'
    key: bd-levites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levites?lang=eng'
    quote: 'they thus became God’s peculiar property, given to Him in place of the firstborn (8:16). They were cleansed for their office (8:7–16).'
  - where: 'note 23:4 “Levites where Kings has the guard”'
    claim: 'In Kings the men are the rulers over hundreds, the captains and the guard'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/11?lang=eng'
    quote: 'Jehoiada sent and fetched the rulers over hundreds, with the captains and the guard, and brought them to him into the house of the Lord'
  - where: 'note 23:18 “The order of David set up again”'
    claim: 'Kings says only that the priest appointed officers over the house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/11?lang=eng'
    quote: 'And the priest appointed officers over the house of the Lord.'
  - where: 'note 23:18 “The order of David set up again”'
    claim: 'David set the divisions of the porters to minister in the house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/26?lang=eng'
    quote: 'Among these were the divisions of the porters, even among the chief men, having wards one against another, to minister in the house of the Lord.'
  - where: 'note 23:18 “The order of David set up again”'
    claim: 'The footnote at 23:13 points to 1 Chr. 25:7, the Levites instructed in the songs of the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/23?lang=eng'
    quote: '“sing”: 1 Chr. 25:7.'
  - where: 'note 23:18 “The order of David set up again”'
    claim: 'Athaliah brought Baal worship into Judah'
    key: bd-athaliah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/athaliah?lang=eng'
    quote: 'introduced Baal worship into the southern kingdom as her mother had done in the northern kingdom (2 Chr. 22:2–4; 24:7).'
  - where: 'christ'
    claim: 'Gabriel promised Mary''s son the throne of David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'He shall be great, and shall be called the Son of the Highest: and the Lord God shall give unto him the throne of his father David:'
  - where: 'christ'
    claim: 'In the sacrament disciples witness willingness to take the Son''s name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/20?lang=eng'
    quote: 'witness unto thee, O God, the Eternal Father, that they are willing to take upon them the name of thy Son, and always remember him and keep his commandments'
  - where: 'explore'
    claim: 'Other covenant renewals in Chronicles'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/23.htm'
    quote: 'that they should be the Lord’s people] Cp. 2 Chronicles 29:10, 2 Chronicles 34:31; Exodus 24:1-11; Deuteronomy 26:17-18; Nehemiah 9:36-38.'
  - where: 'note 23:3 “The promise Jehoiada stood on”'
    claim: 'Joash was seven years old when he began to reign'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/24?lang=eng'
    quote: 'Joash was seven years old when he began to reign'
  - where: 'note 23:3 “The promise Jehoiada stood on”'
    claim: 'Nathan''s oracle: the LORD will set up David''s seed and establish his kingdom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/7?lang=eng'
    quote: 'I will set up thy seed after thee, which shall proceed out of thy bowels, and I will establish his kingdom.'
  - where: 'note 23:3 “The promise Jehoiada stood on”'
    claim: 'The oracle''s sequel: David''s throne established for ever'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/7?lang=eng'
    quote: 'thy throne shall be established for ever.'
  - where: 'note 23:3 “The promise Jehoiada stood on”'
    claim: 'Athaliah destroyed the seed royal, and one child was hidden'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/22?lang=eng'
    quote: 'she arose and destroyed all the seed royal of the house of Judah.'
  - where: 'note 23:18 “The order of David set up again”'
    claim: 'David divided the Levites into courses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/23?lang=eng'
    quote: 'And David divided them into courses among the sons of Levi'
  - where: 'note 23:18 “The order of David set up again”'
    claim: 'The singers were instructed in the songs of the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/25?lang=eng'
    quote: 'with their brethren that were instructed in the songs of the LORD'
  - where: 'note 23:18 “The order of David set up again”'
    claim: 'Athaliah''s sons broke up the house of God and gave its dedicated things to Baalim'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/24?lang=eng'
    quote: 'For the sons of Athaliah, that wicked woman, had broken up the house of God; and also all the dedicated things of the house of the LORD did they bestow upon Baalim.'
