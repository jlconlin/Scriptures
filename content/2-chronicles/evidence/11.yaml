chapter: 11
claims:
  - where: 'when'
    claim: 'Shishak came up in the fifth year of Rehoboam'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/12?lang=eng'
    quote: 'in the fifth year of king Rehoboam Shishak king of Egypt came up against Jerusalem, because they had transgressed against the LORD'
  - where: 'setting'
    claim: 'Verses 1–4 parallel 1 Kgs. 12:21–24; the Chronicler omits Jeroboam''s being made king'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/11.htm'
    quote: 'Ch. 2 Chronicles 11:1-4 (= 1 Kings 12:21-24). Shemaiah forbids Civil War The Chronicler here omits the elevation of Jeroboam to be king over Israel (1 Kings 12:20).'
  - where: 'setting'
    claim: 'Verses 5–23 have no corresponding section in Kings, and Chronicles omits the setting up of the calves'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/11.htm'
    quote: 'This section has no corresponding section in 1 Kin. On the other hand the Chronicler omits three important sections of 1 Kings 12:25-33 (the setting up of the golden calves)'
  - where: 'setting'
    claim: 'The calves are not mentioned in Chronicles before 11:15'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/11.htm'
    quote: 'the calves] Not previously mentioned in Chron.; 1 Kings 12:28.'
  - where: 'setting'
    claim: 'Chronicles highlights Judah and mentions the Northern Kingdom generally only where it interacted with Judah'
    key: ot-seminary-chronicles-intro
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-books-of-1-and-2-chronicles?lang=eng'
    quote: 'the books of Chronicles highlight the Southern Kingdom of Judah and generally only mention the Northern Kingdom when describing ways that it interacted with Judah.'
  - where: 'thread'
    claim: 'Chronicles uses "Israel" for Judah, the covenant people; in Kings Israel generally means the Northern Kingdom'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/11.htm'
    quote: 'The Chronicler does not hesitate to use the term “Israel” in speaking of Judah. … Israel in Chron. then = the covenant-people. In Kings on the contrary Israel generally means the Northern Kingdom.'
  - where: 'thread'
    claim: 'Verses 5–12 tell Rehoboam''s consolidation of his power; 13–17 the inner, spiritual strengthening of Judah by the migration'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/11.htm'
    quote: '2 Chronicles 11:13-17, the account of the internal spiritual strengthening of the kingdom of Judah by the migration of the priests and Levites, and many pious worshippers of Jahve out of all the tribes, to the kingdom of Judah.'
  - where: 'thread'
    claim: 'Verses 5–12 conclude the account of what Rehoboam did to establish and consolidate his kingdom'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/11.htm'
    quote: 'forms the conclusion of the account (vv. 1-17a) of that which Rehoboam did to establish his power and consolidate his kingdom.'
  - where: 'thread'
    claim: 'After establishing and strengthening himself, Rehoboam forsook the law of the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/12?lang=eng'
    quote: 'when Rehoboam had established the kingdom, and had strengthened himself, he forsook the law of the LORD, and all Israel with him.'

  - where: 'note 11:14 “The Levites leave their lands”'
    claim: 'The Levites had no inheritance in Canaan but had the tithe and 48 cities'
    key: bd-levites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levites?lang=eng'
    quote: 'They had no inheritance in Canaan (18:23–24); but they had the tithe (18:21), 48 cities (35:6), and a claim on the alms of the people at feast times'
  - where: 'note 11:14 “The Levites leave their lands”'
    claim: 'The Levites'' cities had suburbs, pasture land around them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/35?lang=eng'
    quote: 'that they give unto the Levites of the inheritance of their possession cities to dwell in; and ye shall give also unto the Levites suburbs for the cities round about them.'
  - where: 'note 11:14 “The Levites leave their lands”'
    claim: 'Abijah charges Jeroboam with casting out the priests and Levites'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/13?lang=eng'
    quote: 'Have ye not cast out the priests of the LORD, the sons of Aaron, and the Levites, and have made you priests after the manner of the nations of other lands?'
  - where: 'note 11:16 “Northerners who sought the LORD”'
    claim: 'Many from the northern tribes moved to Judah in Asa''s reign, and another large migration followed the Assyrian conquest of 722 BC; Lehi of Manasseh had ancestors who moved south'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'during King Asa’s reign, many people from the northern tribes relocated to Judah when they saw that the Lord was with Asa and his people. Another large-scale migration took place after Assyria conquered the Northern Kingdom in 722 BC.'
  - where: 'note 11:16 “Northerners who sought the LORD”'
    claim: 'Lehi''s ancestors from the northern tribes at some point moved to the Southern Kingdom'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'The Book of Mormon prophet Lehi, a member of the tribe of Manasseh, had ancestors from the northern tribes who at some point moved to the Southern Kingdom.'
  - where: 'note 11:16 “Northerners who sought the LORD”'
    claim: 'Archaeological evidence indicates that many of Jerusalem''s seventh-century residents descended from northern refugees; the population surged and the walls were expanded'
    key: sc-knowhy-708
    url: 'https://scripturecentral.org/knowhy/why-did-lehi-live-in-jerusalem'
    quote: 'archaeological evidence has convinced most scholars that many residents of Jerusalem—perhaps even a majority of them—in the seventh century BC were descendants of refugees from Northern Israel. … the walls were expanded to accommodate this rapid population growth.'
  - where: 'note 11:16 “Northerners who sought the LORD”'
    claim: 'Lehi was probably descended from Manassite refugees who fled south when Assyria destroyed Israel'
    key: sc-knowhy-708
    url: 'https://scripturecentral.org/knowhy/why-did-lehi-live-in-jerusalem'
    quote: 'Lehi was probably a descendant of Manassite refugees who had fled south to Judah with others of the northern kingdom when the Assyrians attacked, destroyed, and deported Israel in 724–722 BC.'
  - where: 'note 11:16 “Northerners who sought the LORD”'
    claim: 'Under Asa many from Ephraim, Manasseh and Simeon fell to him out of Israel when they saw the LORD was with him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/15?lang=eng'
    quote: 'the strangers with them out of Ephraim and Manasseh, and out of Simeon: for they fell to him out of Israel in abundance, when they saw that the LORD his God was with him.'

  - where: 'thread'
    claim: 'Chronicles'' verdict: Rehoboam did evil because he prepared not his heart to seek the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/12?lang=eng'
    quote: 'And he did evil, because he prepared not his heart to seek the LORD.'
  - where: 'note 11:22 “Abijah chosen to be king”'
    claim: 'Absalom had one daughter, Tamar, and no son left to keep his name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/14?lang=eng'
    quote: 'And unto Absalom there were born three sons, and one daughter, whose name was Tamar'
  - where: 'note 11:22 “Abijah chosen to be king”'
    claim: '2 Chr. 13:2 names Abijah''s mother Michaiah daughter of Uriel of Gibeah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/13?lang=eng'
    quote: 'His mother’s name also was Michaiah the daughter of Uriel of Gibeah.'
  - where: 'note 11:22 “Abijah chosen to be king”'
    claim: 'Maachah was Absalom''s granddaughter, the daughter of Tamar and Uriel of Gibeah'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/11.htm'
    quote: 'Maachah the daughter, i.e., the granddaughter, of Absalom; for she cannot have been Absalom''s daughter, because Absalom, according to 2 Samuel 14:27, had only one daughter, Tamar by name … Maachah therefore can only be a daughter of Tamar'
  - where: 'note 11:22 “Abijah chosen to be king”'
    claim: 'Perhaps Absalom''s granddaughter; at 13:2 "Maacah" should be read with the Septuagint'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/11.htm'
    quote: 'Perhaps the grand-daughter of Absalom, since she is called the daughter of Uriel of Gibeah in 2 Chronicles 13:2 (where “Maacah” should be read with the LXX. for “Michaiah”).'
  - where: 'note 11:22 “Abijah chosen to be king”'
    claim: 'Kings names Abijam''s mother Maachah daughter of Abishalom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/15?lang=eng'
    quote: 'And his mother’s name was Maachah, the daughter of Abishalom.'
  - where: 'note 11:22 “Abijah chosen to be king”'
    claim: 'The sons were placed apart as governors of the fenced cities, provided for, and kept content so none would try for the crown reserved for Abijah; this was the wisdom of it'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/11.htm'
    quote: 'They were thus kept in a state of contentment, so that they might not make any attempt to gain the crown, which he had reserved for Abijah; and in this lay the wisdom of his conduct.'
  - where: 'note 11:22 “Abijah chosen to be king”'
    claim: 'The Hebrew of 11:23 verb of 11:23, rendered "desired," means to ask, ask for'
    key: bdb
    url: 'https://biblehub.com/hebrew/7592.htm'
    quote: '1. a. ask, ask for, accusative of thing (or person)'
  - where: 'note 11:22 “Abijah chosen to be king”'
    claim: 'The father sought wives for his sons'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/11.htm'
    quote: 'and he sought (for them) a multitude of wives. שׁאל, to ask for, for the father brought about the marriage of his sons.'
  - where: 'note 11:22 “Abijah chosen to be king”'
    claim: 'Probably a word has fallen out ("for them"); it is hard to say whether the Chronicler has Deut. 17:17 in mind'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/11.htm'
    quote: 'It is difficult to say whether or no the Chronicler has Deuteronomy 17:17 in his mind and is implicitly blaming the king. … It is however probable that a word has fallen out of the Hebrew text and that the text ran originally thus, And he sought for them'

  - where: 'christ'
    claim: 'The risen Christ declared Himself the giver of the law who covenanted with Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/15?lang=eng'
    quote: 'Behold, I am he that gave the law, and I am he who covenanted with my people Israel'
  - where: 'setting'
    claim: 'Jeroboam set the calves at Bethel and Dan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/12?lang=eng'
    quote: 'And he set the one in Beth-el, and the other put he in Dan.'
  - where: 'note 11:16 “Northerners who sought the LORD”'
    claim: 'Lehi was a descendant of Manasseh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/10?lang=eng'
    quote: 'Lehi, who came out of the land of Jerusalem, who was a descendant of Manasseh'
  - where: 'note 11:16 “Northerners who sought the LORD”'
    claim: 'Lehi had dwelt at Jerusalem all his days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/1?lang=eng'
    quote: 'my father, Lehi, having dwelt at Jerusalem in all his days'
