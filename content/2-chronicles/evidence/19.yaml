chapter: 19
claims:
  - where: 'when'
    claim: 'Ahab died at Ramoth-gilead; Jehoshaphat returned home in peace'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/18?lang=eng'
    quote: 'howbeit the king of Israel stayed himself up in his chariot against the Syrians until the even: and about the time of the sun going down he died.'
  - where: 'when'
    claim: '“In peace” means in safety'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/19.htm'
    quote: '1. in peace] i.e. in safety.'
  - where: 'setting'
    claim: 'Jehoshaphat was the fourth king of Judah'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'Jehoshaphat, the fourth king of Judah, was a righteous man'
  - where: 'setting'
    claim: 'Verses 1–3 and 4–11 have no parallel in Kings'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/19.htm'
    quote: 'Ch. 2 Chronicles 19:1-3 (no parallel in Kings). The Reproof of Jehu the Prophet … 4–11 (no parallel in Kings). Jehoshaphat’s Home Policy'
  - where: 'setting'
    claim: 'Kings summarizes Jehoshaphat''s reign in 1 Kgs. 22:41–50 and says he made peace with the king of Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/22?lang=eng'
    quote: 'And Jehoshaphat made peace with the king of Israel.'
  - where: 'setting'
    claim: 'The name Jehoshaphat means “the Lord has judged”'
    key: bowen-ominous-onomastics
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/ominous-onomastics'
    quote: 'The prophet Joel utilizes the name Jehoshaphat (yĕhô + šāpāṭ, “the Lord has judged”), a name belonging to a ninth-century king of Judah'
  - where: 'thread'
    claim: 'Beer-sheba was the southern frontier, mount Ephraim the northern frontier of Judah; “again” refers to the teaching commission of 17:7; the reform of justice completed the work'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/19.htm'
    quote: 'from Beersheba, the southern frontier (see 1 Chronicles 21:2), to Mount Ephraim, the northern frontier of the kingdom of Judah … The "again" (ישׁב) can refer only to the former provision for the instruction of the people, recorded in 2 Chronicles 17:7.'
  - where: 'thread'
    claim: 'The work of reformation was completed by ordering the administration of justice'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/19.htm'
    quote: 'Jehoshaphat now again took up his work of reformation, in order to complete the work he had begun, by ordering and improving the administration of justice.'
  - where: 'thread'
    claim: 'The wrath of verse 10 is the same word as in verse 2'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/19.htm'
    quote: 'wrath] Heb. qeçeph; see note on 2 Chronicles 19:2.'
  - where: 'section 1 plain'
    claim: 'The groves are Asherah poles (Asheroth)'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/19.htm'
    quote: 'taken away the groves] R.V. put away the Asheroth (plur. of “Asherah”)'
  - where: 'section 2 plain'
    claim: '“Who is with you in the judgment” is rendered “He is with you in giving judgment”'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/19.htm'
    quote: 'who is with you in the judgment] Render, and He is with you in giving judgment'
  - where: 'section 3 plain'
    claim: 'A perfect heart is an undivided heart; “trespass not” is “be not guilty”; “when they returned” rendered as their having returned'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/19.htm'
    quote: 'a perfect heart] i.e. a heart undivided in its allegiance'
  - where: 'section 3 plain'
    claim: '“Deal courageously” is “be strong and do”; the LORD be with the one who does his duties well'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/19.htm'
    quote: '"Be strong (courageous) and do," i.e., go to work with good heart, "and the Lord be with the good," i.e., with him who discharges the duties of his office well.'
  - where: 'note 19:2 “Wrath for helping the wicked”'
    claim: 'The alliance was a marriage alliance: Jehoshaphat''s son married Ahab''s daughter'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'This was a marriage alliance (see 2 Chronicles 18:1, footnote a). Jehoshaphat’s son married Ahab’s daughter (see 2 Chronicles 21:5–6).'
  - where: 'note 19:2 “Wrath for helping the wicked”'
    claim: 'A later alliance with a wicked king of Israel was rebuked through Eliezer'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'Later in his life, Jehoshaphat formed another alliance with a wicked king of Israel. The Lord again rebuked Jehoshaphat for his actions, this time through the prophet Eliezer.'
  - where: 'note 19:2 “Wrath for helping the wicked”'
    claim: 'Jehu must have been old, having prophesied against Baasha, with Omri and Ahab reigning since; the wrath is described in chapter 20'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/19.htm'
    quote: 'He must have been an old man at this time for he had prophesied against Baasha (1 Kings 16:1), since whose time two kings had reigned in Israel, viz., Omri (12 years) and Ahab (22 years). … The visitation is described in chap. 20.'
  - where: 'note 19:2 “Wrath for helping the wicked”'
    claim: 'Keil finds the wrath at Ramoth, in the invasion, in the ships, and after his death in his family'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/19.htm'
    quote: 'Jehoshaphat had already had experience of this wrath, when in the battle of Ramoth the enemy pressed upon him (2 Chronicles 18:31), and was at a later time to have still further experience of it, partly during his own life, when the enemy invaded his land (2 Chronicles 20), and when he attempted to re-establish the sea trade with Ophir (2 Chronicles 20:35.), partly after his death in his family'
  - where: 'note 19:2 “Wrath for helping the wicked”'
    claim: 'Hanani told Asa he would have wars and was put in prison'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/16?lang=eng'
    quote: 'Herein thou hast done foolishly: therefore from henceforth thou shalt have wars. Then Asa was wroth with the seer, and put him in a prison house'
  - where: 'note 19:3 “Good things found beside the wrath”'
    claim: '“Good things” in 19:3 and “things went well” in 12:12 are the same two Hebrew words, dĕbārîm ṭôbîm'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'טוֹבִ֖ים'
  - where: 'note 19:3 “Good things found beside the wrath”'
    claim: '2 Chr. 12:12 has the same words, dĕbārîm ṭôbîm'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'טוֹבִֽים'
  - where: 'note 19:3 “Good things found beside the wrath”'
    claim: 'Rehoboam did evil because he prepared not his heart to seek the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/12?lang=eng'
    quote: 'And he did evil, because he prepared not his heart to seek the LORD.'
  - where: 'note 19:6 “Judges who judge for the LORD”'
    claim: 'Fenced cities as centres for their neighbourhoods; judge in the name and will of the Lord; judgment belongs to God (Deut. 1:17); Deut. 16:19 and 10:17'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/19.htm'
    quote: '"Not for men are ye to judge, but for Jahve;" i.e., not on the appointment and according to the will of men, but in the name and according to the will of the Lord'
  - where: 'note 19:6 “Judges who judge for the LORD”'
    claim: 'The fenced cities were larger cities, centres for their neighbourhoods'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/19.htm'
    quote: 'they, as larger cities, being centres of communication for their respective neighbourhoods, and so best suited to be the seats of judges.'
  - where: 'note 19:6 “Judges who judge for the LORD”'
    claim: 'Respect of persons and bribes forbidden in Deut. 16:19 and 1:17; “no respect of persons” recalls Deut. 10:17'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/19.htm'
    quote: 'nor to be bribed by gifts, against which Deuteronomy 16:19 and Deuteronomy 1:17 also warns. … The clause, "With God there is no respect of persons," etc., recalls Deuteronomy 10:17.'
  - where: 'note 19:6 “Judges who judge for the LORD”'
    claim: 'The work was likely removing evil judges and confirming good ones; “God is with us” strengthens judges against the rich and powerful; a perfect heart excludes bribes'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/19.htm'
    quote: 'As to the first measure no doubt the work consisted in removing evil judges and confirming the good in their office, rather than in appointing judges for the first time.'
  - where: 'note 19:6 “Judges who judge for the LORD”'
    claim: 'Strength for judges deciding against the rich and powerful'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/19.htm'
    quote: 'The judges in deciding cases against the rich and powerful were to strengthen themselves with the thought “God is with us” (“Immanuel”).'
  - where: 'note 19:6 “Judges who judge for the LORD”'
    claim: 'The judges could not combine the service of God with the taking of bribes'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/19.htm'
    quote: 'a perfect heart] i.e. a heart undivided in its allegiance; cp. 1 Chronicles 12:38. The judges were not to attempt to combine the service of God with the taking of bribes.'
  - where: 'note 19:6 “Judges who judge for the LORD”'
    claim: 'Welch sets Jehoshaphat''s charge beside Moses'' revelation in Numbers 36 as reliance on inspiration in applying the law, and suggests Lehi did likewise'
    key: welch-lehi-will
    url: 'https://rsc.byu.edu/book-mormon-second-nephi-doctrinal-structure/lehis-last-will-testament-legal-approach'
    quote: 'Lehi and his righteous posterity relied on inspiration and revelation in deciding how to interpret and apply the law. Moses used revelation, for example, in Numbers 36 to settle an inheritance dispute … Jehoshaphat instructed his judges to judge with the fear of the Lord and to judge for the Lord … Lehi quite probably did likewise.'
  - where: 'note 19:6 “Judges who judge for the LORD”'
    claim: 'Deut. 16:18 and 10:17 texts'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/10?lang=eng'
    quote: 'For the LORD your God is God of gods, and Lord of lords, a great God, a mighty, and a terrible, which regardeth not persons, nor taketh reward:'
  - where: 'note 19:8 “Who returned to Jerusalem?”'
    claim: 'The Hebrew reads “and they returned (wayyāšubû) Jerusalem”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'וַ/יָּשֻׁ֖בוּ'
  - where: 'note 19:8 “Who returned to Jerusalem?”'
    claim: 'Keil, with Kimchi, refers the clause to verse 4 and explains its late placement'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/19.htm'
    quote: 'With Kimchi and others, we must refer the words to the previous statement in 2 Chronicles 19:4 … and understand them as a supplementary statement, that Jehoshaphat and those who had gone forth with him among the people returned to Jerusalem'
  - where: 'note 19:8 “Who returned to Jerusalem?”'
    claim: 'No one in the verse had left Jerusalem; the order of time was set aside'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/19.htm'
    quote: 'which cannot be said of the persons above named, since it is not said that they had left Jerusalem.'
  - where: 'note 19:8 “Who returned to Jerusalem?”'
    claim: 'Cambridge judges the words corrupt and reads “dwelt”'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/19.htm'
    quote: 'These words seem to be corrupt; read, and they (i.e. the judges appointed by Jehoshaphat) dwelt in Jerusalem. The most difficult cases could always be decided in Jerusalem, because the judges were always there.'
  - where: 'note 19:8 “Who returned to Jerusalem?”'
    claim: 'The Septuagint reads “to judge the dwellers in Jerusalem”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_chronicles/19.htm'
    quote: 'Moreover Josaphat appointed in Jerusalem some of the priests, and Levites, and heads of houses of Israel, for the judgment of the Lord, and to judge the dwellers in Jerusalem.'
  - where: 'note 19:10 “A higher court for the hard cases”'
    claim: 'Blood and blood = manslaughter and murder (Deut. 17:8); law and commandment = which ordinance applies; the court probably new, as David and Solomon kept judgment'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/19.htm'
    quote: 'between blood and blood] To decide between one kind of blood-shedding and another, i.e. between manslaughter and murder. Deuteronomy 17:8. between law and commandment] To decide what particular ordinance applies to a particular case.'
  - where: 'note 19:10 “A higher court for the hard cases”'
    claim: 'The second measure probably new; David and Solomon kept judgment in their own hands'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/19.htm'
    quote: 'The second measure, however, was probably altogether new; David (2 Samuel 14:4 ff; 2 Samuel 15:3) and Solomon (1 Kings 3:16) had kept judgment in their own hands.'
  - where: 'note 19:10 “A higher court for the hard cases”'
    claim: 'Keil: the court an expansion of Moses'' court of final appeal; “warn” means to teach with admonition, from Ex. 18:20'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/19.htm'
    quote: 'The establishment of this superior court was in form, indeed, the commencement of a new institution; but in reality it was only the expansion or firmer organization of a court of final appeal already provided by Moses'
  - where: 'note 19:10 “A higher court for the hard cases”'
    claim: '“Warn” means to teach, with admonition; the word is from Ex. 18:20'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/19.htm'
    quote: 'הזהיר, properly to illuminate, metaphorically to teach, with the additional idea of exhortation or warning. The word is taken from Exodus 18:20'
  - where: 'note 19:10 “A higher court for the hard cases”'
    claim: 'Deut. 17:8 uses “between blood and blood” for matters too hard'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/17?lang=eng'
    quote: 'If there arise a matter too hard for thee in judgment, between blood and blood, between plea and plea, and between stroke and stroke'
  - where: 'note 19:11 “The LORD''s matters and the king''s”'
    claim: 'Matters of the LORD are religious causes, the king''s matters civil ones'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/19.htm'
    quote: 'i.e., for all matters connected with religion and the worship and instead of קריב we have המּלך דּבר לכל, for every matter of the king, i.e., for all civil causes.'
  - where: 'note 19:11 “The LORD''s matters and the king''s”'
    claim: 'Moses presupposed a high priest and a supreme civil director; Jehoshaphat''s court had the high priest and a lay president at its head'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/19.htm'
    quote: 'he presupposes that Israel would have at all times not only a high priest … but also a supreme director of its civil affairs at the place of the central sanctuary … Jehoshaphat set up a supreme court in Jerusalem, with the high priest and a lay president at its head'
  - where: 'note 19:11 “The LORD''s matters and the king''s”'
    claim: 'Levites as assistants; “be strong and do”; the LORD with him who does his office well'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/19.htm'
    quote: 'shall the Levites be לפניכם, before you, i.e., as your assistants and servants. Jehoshaphat concludes the nomination of the judicial staff with the encouraging words, "Be strong (courageous) and do," i.e., go to work with good heart'
  - where: 'note 19:11 “The LORD''s matters and the king''s”'
    claim: 'The close is a blessing rather than a promise'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/19.htm'
    quote: 'shall be with the good] R.V. be with the good (a blessing rather than a promise).'
  - where: 'note 19:11 “The LORD''s matters and the king''s”'
    claim: 'Deut. 17:9 names the priests the Levites and the judge'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/17?lang=eng'
    quote: 'And thou shalt come unto the priests the Levites, and unto the judge that shall be in those days, and inquire'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'The bishop is a judge in Israel and a common judge'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/107?lang=eng'
    quote: 'And also to be a judge in Israel, to do the business of the church, to sit in judgment upon transgressors upon testimony as it shall be laid before him according to the laws'
  - where: 'note 19:11 “The LORD''s matters and the king''s”'
    claim: 'Cambridge: Amariah perhaps the one of 1 Chr. 6:11'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/19.htm'
    quote: 'Perhaps he who is mentioned 1 Chronicles 6:11'
  - where: 'note 19:11 “The LORD''s matters and the king''s”'
    claim: 'Keil: Amariah not the Amariah of 1 Chr. 6:11'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/19.htm'
    quote: 'who is not the same as the Amariah mentioned after Zadok as the fifth high priest (1 Chronicles 6:11)'
