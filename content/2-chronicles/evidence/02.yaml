chapter: 2
claims:
  - where: 'when'
    claim: 'The building began in the fourth year of Solomon''s reign, so these arrangements came before it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/3?lang=eng'
    quote: 'And he began to build in the second day of the second month, in the fourth year of his reign.'

  - where: 'setting'
    claim: 'Chronicles'' account of the message to Huram is much fuller than Kings'' and has no parallel in Kings to 2:4–6; the request for a craftsman is nearest 1 Kgs. 7:13'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/2.htm'
    quote: 'This passage is much fuller in Chron. than in 1 Kings, which offers no parallel to Solomon’s language with regard to the Temple; 2 Chronicles 2:4-6. Again 2 Chronicles 2:7 (the request for a “cunning man”) has no nearer parallel than 1 Kings 7:13.'
  - where: 'setting'
    claim: 'The Chronicler wrote in part to legitimize the rebuilt temple of his first readers'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'The Chronicler writes to give hope, to create an identity based on worship and the ideals of the kingdom, and to legitimize their newly rebuilt temple.'
  - where: 'setting'
    claim: 'The chapter parallels 1 Kgs. 5 and 1 Kgs. 7:13–14 (the Church''s footnotes); David gathered the strangers to hew stone (1 Chr. 22:2)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/2?lang=eng'
    quote: '3a “Huram”: OR Hiram. 1 Kgs. 5:2 (2–11). … 13a “Huram”: 1 Kgs. 7:13 (13–51).'

  - where: 'thread'
    claim: 'In Chronicles Solomon reminds Huram of his friendship to David and says the house is designed for the worship of a God the heavens cannot contain; Kings gives instead the reason David could not build'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/2.htm'
    quote: 'Solomon reminds the Tyrian king of the friendliness with which he had supplied his father David with cedar wood for his palace, and then announces to him his purpose to build a temple to the Lord, at the same time stating that it was designed for the worship of God, whom the heavens and the earth cannot contain.'
  - where: 'thread'
    claim: 'One older reading: Huram''s praise is heightened in Chronicles, entering into Solomon''s religious ideas by calling the LORD the Creator'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/2.htm'
    quote: 'The praise of God is heightened in the Chronicle by Hiram''s entering into Solomon''s religious ideas, calling Jahve the Creator of heaven and earth.'

  - where: 'section 1 plain'
    claim: 'The chapter falls into 1–2, 3–10, 11–16 and 17–18'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/2.htm'
    quote: '3–10 [2–9, Heb.] (= 1 Kings 5:2-6). Solomon’s Message to Huram … 11–16 [10–15, Heb.] (= 1 Kings 5:7-9). Huram’s Answer to Solomon … 17, 18 [16, 17, Heb.] (cp. 2). Bearers and Hewers'
  - where: 'section 1 plain'
    claim: '“To hew” means to quarry stone'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/2?lang=eng'
    quote: '2a “to hew”: IE to quarry stone.'
  - where: 'section 2 plain'
    claim: 'The measures of wheat and barley are cors'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/2.htm'
    quote: '10. measures] Hebrew, cors.'
  - where: 'section 3 plain'
    claim: '“Of Huram my father''s” is better rendered “even Huram my father”'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/2.htm'
    quote: 'of Huram my father’s) Better as R.V. mg., even Huram my father.'
  - where: 'section 3 plain'
    claim: '“To find out every device” means to execute any design'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/2?lang=eng'
    quote: '14a “to”: OR to execute any design.'

  - where: 'note 2:4 “What the house was for”'
    claim: 'The shewbread: twelve loaves on the table in the holy place, changed every Sabbath and eaten by the priests; the twelve tribes perpetually presented before God; both a sacrifice and a communion'
    key: bd-shewbread
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shewbread?lang=eng'
    quote: 'The shewbread was changed every Sabbath day and the old loaves were eaten by the priests in a holy place (Lev. 24:9). In the shewbread the 12 tribes were perpetually presented before God; yet it was wholly consumed by man; thus it provided both a sacrifice and a communion.'
  - where: 'note 2:4 “What the house was for”'
    claim: 'The law set incense morning and evening as a perpetual incense; the daily, sabbath and new-moon burnt offerings are in Num. 28'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/28?lang=eng'
    quote: 'two lambs of the first year without spot day by day, for a continual burnt offering.'

  - where: 'note 2:6 “A house for worship, not a dwelling”'
    claim: 'The Church''s footnote sends “heaven” to 1 Kgs. 8:27, the dedicatory prayer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/2?lang=eng'
    quote: '6a “heaven”: 1 Kgs. 8:27.'
  - where: 'note 2:6 “A house for worship, not a dwelling”'
    claim: '“Burn sacrifice” (v. 6) and “burn … sweet incense” (v. 4) render the same Hebrew infinitive, lehaqṭîr'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'לְ/הַקְטִ֥יר'
  - where: 'note 2:6 “A house for worship, not a dwelling”'
    claim: 'The verb in the Hiphil means to make sacrifices smoke, send them up in smoke; it is used of incense and of offerings'
    key: bdb
    url: 'https://biblehub.com/hebrew/6999.htm'
    quote: 'Hiph`il … 1 make sacrifices smoke, usually'

  - where: 'note 2:8 “Algum trees”'
    claim: 'Algum is the same as almug: sandalwood, imported from Ophir for the temple, the king''s house and musical instruments, probably red sandalwood of India'
    key: bd-almug
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/almug?lang=eng'
    quote: 'Sandalwood; imported by Solomon from Ophir for the temple, for his own house, and for musical instruments, 1 Kgs. 10:11–12; 2 Chr. 2:8; 9:10–11. The wood used was probably the red sandalwood of India, of which musical instruments are still made.'
  - where: 'note 2:8 “Algum trees”'
    claim: 'The Bible Dictionary''s entry Algum sends the reader to Almug'
    key: bd-almug
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/algum?lang=eng'
    quote: 'Same as Almug.'
  - where: 'note 2:8 “Algum trees”'
    claim: 'Kings says Hiram''s navy brought almug from Ophir, made into pillars and harps'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/10?lang=eng'
    quote: 'brought in from Ophir great plenty of almug trees'

  - where: 'note 2:13 “Huram the craftsman and his title”'
    claim: 'The Bible Dictionary: the Tyrian workman sent to Solomon is called Huram in Chronicles'
    key: bd-hiram
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hiram?lang=eng'
    quote: '(2) A Tyrian workman sent to Solomon (1 Kgs. 7:13, 40, 45); called Huram (2 Chr. 2:13; 4:11, 16).'
  - where: 'note 2:13 “Huram the craftsman and his title”'
    claim: 'Huram is another form of Hiram; Phoenician was written with few vowel signs, hence the uncertain form'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/2.htm'
    quote: '3. Huram] Another form of Hiram (1 Kings 5:1 [15, Heb.]) which is a shortened form of Ahiram … The Phœnician language is written with even fewer vowel signs than are found in ancient Hebrew; hence the uncertainty in the form of this name.'
  - where: 'note 2:13 “Huram the craftsman and his title”'
    claim: 'The Hebrew reads lĕḥûrām ʾāḇî, “Huram my father”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'לְ/חוּרָ֥ם'
  - where: 'note 2:13 “Huram the craftsman and his title”'
    claim: 'The word after the name is ʾāḇî, “my father”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'אָבִֽי'
  - where: 'note 2:13 “Huram the craftsman and his title”'
    claim: '“Huram my father” is a title of honour the king gives the craftsman; compare 4:16; in 1 Kgs. 7:13 Solomon sent and fetched him'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/2.htm'
    quote: 'Huram the king calls Huram the artificer my father as a title of honour. Cp. 2 Chronicles 4:16.'
  - where: 'note 2:13 “Huram the craftsman and his title”'
    claim: 'Father as a title of honour equivalent to master or counsellor, as in Gen. 45:8; one older harmonization of Dan and Naphtali'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/7.htm'
    quote: 'אב being a title of honour equivalent to master or counsellor, as in Genesis 45:8. … Both statements may easily be united thus: she was a Danite by birth, and married into the tribe of Naphtali.'
  - where: 'note 2:13 “Huram the craftsman and his title”'
    claim: 'One older reading: Chronicles'' “of Dan” may have arisen from Ex. 31:6, where Aholiab, a craftsman of the tabernacle, was of Dan'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/2.htm'
    quote: '14. of Dan] in 1 Kings 7:14, of Naphtali. The reading of Chron. may have arisen from Exodus 31:6 (Oholiab one of the artificers of the tabernacle was of the tribe of Dan).'

  - where: 'note 2:17 “A hundred and fifty-three thousand strangers”'
    claim: 'Kings numbers 3,300 officers over the work where Chronicles has 3,600'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/5?lang=eng'
    quote: 'Beside the chief of Solomon’s officers which were over the work, three thousand and three hundred, which ruled over the people that wrought in the work.'
  - where: 'note 2:17 “A hundred and fifty-three thousand strangers”'
    claim: 'Of the children of Israel Solomon made no servants for his work'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/8?lang=eng'
    quote: 'But of the children of Israel did Solomon make no servants for his work'

  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'The Church''s footnote at 2 Chr. 2:4 points to D&C 97:15 (13–15); the Lord''s promise for a house built in His name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/97?lang=eng'
    quote: 'And inasmuch as my people build a house unto me in the name of the Lord, and do not suffer any unclean thing to come into it, that it be not defiled, my glory shall rest upon it;'
