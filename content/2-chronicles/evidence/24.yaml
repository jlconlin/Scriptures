chapter: 24
claims:
  - where: 'setting'
    claim: 'Kings and Chronicles agree in essentials and are both extracts from a fuller history of Joash; Chronicles supplements Kings with the marriage, the children, and Jehoiada''s death at 130'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/24.htm'
    quote: 'Both accounts agree in all essential points, but are shown to be extracts containing the most important part of a more complete history of Joash'
  - where: 'setting'
    claim: 'What Chronicles adds: the marriage, the children, Jehoiada''s death and burial'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/24.htm'
    quote: 'To these latter belong the account of the marriage of Joash, and his many children, the account of the death of Jehoiada at the age of 130 years, and his honourable burial with the kings'
  - where: 'setting'
    claim: 'Zechariah''s martyrdom (20–22) has no parallel in Kings'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/24.htm'
    quote: '20–22 (no parallel in 2 Kin.). The Martyrdom of Zechariah'
  - where: 'setting'
    claim: 'Verse 3 is not in Kings; Jehoiada, standing as a father to Joash, provided his wives'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/24.htm'
    quote: 'This ver. is not in Kings. It was the duty of a Jewish father to provide his son with a wife; Jehoiada standing in loco parentis does this for Joash.'
  - where: 'setting'
    claim: 'Joash was hidden in the temple six years with Jehoiada and his wife, Jehoshabeath'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/22?lang=eng'
    quote: 'And he was with them hid in the house of God six years: and Athaliah reigned over the land.'
  - where: 'thread'
    claim: 'The charge against Joash in verse 22 is ingratitude; the text does not say he himself worshipped the idols'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/24.htm'
    quote: 'For it is not said that Joash himself worshipped the idols; and even in 2 Chronicles 24:22 it is only the base ingratitude of which Joash had been guilty, in the slaughter of the son of his benefactor, which is adduced against him.'
  - where: 'thread'
    claim: 'Jehoiada''s burial with the kings was a mark of honor'
    key: bd-jehoiada
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehoiada?lang=eng'
    quote: 'as a mark of honor he was buried with the kings of Judah'
  - where: 'section 4 plain'
    claim: '"Groves" are the Asherah, trees or poles set up as objects of worship'
    key: bd-grove
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/grove?lang=eng'
    quote: 'In Hebrew, called Asherah (of which the plural is Asherim or Asheroth), either a living tree or a tree-like pole, set up as an object of worship'
  - where: 'section 5 plain'
    claim: '"At the end of the year" means when the same time of year came round again'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/24.htm'
    quote: 'at the end of the year] Rather, in the course of a year, i.e. when the same time of year had come round again.'
  - where: 'section 5 plain'
    claim: '"In great diseases" means severely wounded'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/24?lang=eng'
    quote: '“in great diseases”: IE severely wounded.'
  - where: 'note 24:20 “The Zacharias whom Jesus named”'
    claim: 'The Bible Dictionary sends the Zacharias slain between the temple and the altar to 2 Chr. 24:20–22'
    key: bd-zacharias
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zacharias?lang=eng'
    quote: '(2) Slain between the temple and the altar (Matt. 23:35; Luke 11:51; see also 2 Chr. 24:20–22).'
  - where: 'note 24:20 “The Zacharias whom Jesus named”'
    claim: 'No martyr Zacharias son of Barachias in the Old Testament; Zechariah and Zacharias are the same name; most scholars identify him with Zechariah son of Jehoiada'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: '“Zechariah” and “Zacharias” are equivalent names. It is the opinion of most Bible scholars that the Zacharias referred to in Matthew’s record is Zechariah son of Jehoiada.'
  - where: 'note 24:20 “The Zacharias whom Jesus named”'
    claim: 'In the Jewish order of the scriptures his is the last recorded martyrdom, so Abel to Zechariah may mean all the martyrs, first to last'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'In the Jewish compilation of Old Testament scriptures, the murder of Zechariah appears as the last recorded martyrdom; and the Lord’s reference to the righteous men who had been slain, from Abel to Zechariah or Zacharias, may have been a sweeping inclusion of all the martyrs down to that time, from first to last.'
  - where: 'note 24:20 “The Zacharias whom Jesus named”'
    claim: 'Matthew''s "son of Barachias" gives Zechariah a different father; Luke does not'
    key: wilson-zacharias
    url: 'https://rsc.byu.edu/vol-14-no-2-2013/confusing-case-zacharias'
    quote: 'It appears that the Gospel of Matthew may have confused two Zechariahs. Chapter 23 mentions the ninth-century high-priestly martyr Zechariah but incorrectly assigns him a different father'
  - where: 'note 24:20 “The Zacharias whom Jesus named”'
    claim: 'The father''s name came from the minor prophet Zechariah son of Berechiah (Zech. 1:1)'
    key: wilson-zacharias
    url: 'https://rsc.byu.edu/vol-14-no-2-2013/confusing-case-zacharias'
    quote: 'An author or editor confused two famous Old Testament Zechariahs and accidentally gave the paternity of the minor prophet, “Zechariah, the son of Berechiah” (Zechariah 1:1), to the high priest “Zechariah son of Jehoiada”'
  - where: 'note 24:20 “The Zacharias whom Jesus named”'
    claim: 'Joseph Smith''s statement that the Bible has suffered from translators and transcribers'
    key: wilson-zacharias
    url: 'https://rsc.byu.edu/vol-14-no-2-2013/confusing-case-zacharias'
    quote: '“I believe the Bible as it read when it came from the pen of the original writers. Ignorant translators, careless transcribers, or designing and corrupt priests have committed many errors.”'
  - where: 'note 24:20 “The Zacharias whom Jesus named”'
    claim: 'The story that John the Baptist''s father was the Zacharias slain in the temple comes from the Protevangelium of James and spread among Latter-day Saints as a teaching of Joseph Smith; the study was written to stop it'
    key: wilson-zacharias
    url: 'https://rsc.byu.edu/vol-14-no-2-2013/confusing-case-zacharias'
    quote: 'Because the account made its way into Teachings of the Prophet Joseph Smith, Latter-day Saints have also propagated it. I wrote on this subject in order to illuminate the sources for the account and to arrest its further spread among Latter-day Saint educators as a revealed teaching of the Prophet Joseph Smith.'
  - where: 'note 24:20 “The Zacharias whom Jesus named”'
    claim: 'Luke 11:51 in the King James'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'From the blood of Abel unto the blood of Zacharias, which perished between the altar and the temple: verily I say unto you, It shall be required of this generation.'
  - where: 'note 24:20 “Forsaken as they had forsaken”'
    claim: 'The Spirit "came upon" him is in Hebrew "clothed itself with," as at Judg. 6:34 and 1 Chr. 12:18'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/24.htm'
    quote: 'came upon] Heb. “clothed itself with”; cp. Jdg 6:34; 1 Chronicles 12:18.'
  - where: 'note 24:20 “Forsaken as they had forsaken”'
    claim: 'Zechariah was one of the prophets of verse 19; he stood in the higher inner court above the people; fidelity is the condition of prosperity, and the words recall 12:5 and 15:2'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/24.htm'
    quote: 'Of these prophets, one, Zechariah the son of the high priest Jehoiada, is mentioned by name in 2 Chronicles 24:20.'
  - where: 'note 24:20 “Forsaken as they had forsaken”'
    claim: 'He stood in the inner, higher court above the people in the outer court'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/24.htm'
    quote: 'above the people, viz., as we learn from 2 Chronicles 24:21, in the inner, higher-lying court, so that he was above the people who were in the outer court.'
  - where: 'note 24:20 “Forsaken as they had forsaken”'
    claim: 'Fidelity to the LORD is the condition of prosperity; forsaking and being forsaken, as at 12:5 and 15:2'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/24.htm'
    quote: 'Fidelity to the Lord is the condition of prosperity. If Israel forsake the Lord, the Lord will also forsake it; cf. 2 Chronicles 12:5; 2 Chronicles 15:2.'
  - where: 'note 24:20 “Forsaken as they had forsaken”'
    claim: 'Azariah''s word to Asa, also spoken when the Spirit of God came upon him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/15?lang=eng'
    quote: 'And the Spirit of God came upon Azariah the son of Oded'
  - where: 'note 24:20 “Forsaken as they had forsaken”'
    claim: 'Zechariah''s word became a prophecy, fulfilled in the Syrian invasion'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/24.htm'
    quote: 'This word became a prophecy, which soon began to be fulfilled, 2 Chronicles 24:23.'
  - where: 'note 24:21 “Stoned in the temple court”'
    claim: 'The irony: Zechariah''s parents had saved the infant Joash and raised him in the temple six years, and Jehoiada made him king'
    key: wilson-zacharias
    url: 'https://rsc.byu.edu/vol-14-no-2-2013/confusing-case-zacharias'
    quote: 'The irony of Zechariah’s martyrdom lies a generation earlier. Zechariah’s parents saved the then infant King Joash from political overthrow and secretly raised him in the temple for six years.'
  - where: 'note 24:21 “Stoned in the temple court”'
    claim: 'Joash was crowned and anointed in the temple, with the guard set "along by the altar and the temple"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/23?lang=eng'
    quote: 'from the right side of the temple to the left side of the temple, along by the altar and the temple, by the king round about.'
  - where: 'note 24:20 “The Zacharias whom Jesus named”'
    claim: 'Matthew''s wording of the place, "between the temple and the altar"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/23?lang=eng'
    quote: 'from the blood of righteous Abel unto the blood of Zacharias son of Barachias, whom ye slew between the temple and the altar.'
  - where: 'note 24:22 “The LORD look upon it, and require it”'
    claim: 'BDB: darash "require," "exact, often with collateral idea of avenging," of blood at Gen. 9:5, and listing 2 Chr. 24:22'
    key: bdb
    url: 'https://biblehub.com/hebrew/1875.htm'
    quote: 'exact, often with collateral idea of avenging, מֵעִם Deuteronomy 18:19, so with מִיַּד Ezekiel 34:10, דָּרַשׁ דָּם מִיַּד Genesis 9:5 (P) Ezekiel 33:6; accusative only, דֹּרֵשׁ דמים Psalm 9:13'
  - where: 'note 24:22 “The LORD look upon it, and require it”'
    claim: 'BDB lists 2 Chr. 24:22 under that sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/1875.htm'
    quote: 'absolute Psalm 10:4; Psalm 10:13; 2Chronicles 24:22.'
  - where: 'note 24:22 “The LORD look upon it, and require it”'
    claim: 'Gen. 9:5 in the King James: "your blood of your lives will I require"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/9?lang=eng'
    quote: 'And surely your blood of your lives will I require'
  - where: 'note 24:22 “The LORD look upon it, and require it”'
    claim: 'The servants conspired for the blood of the sons of Jehoiada'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/24?lang=eng'
    quote: 'his own servants conspired against him for the blood of the sons of Jehoiada the priest'
  - where: 'note 24:24 “Judgment within the year”'
    claim: 'Kings tells the Syrian attack as Hazael bought off with the temple''s treasures'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/12?lang=eng'
    quote: 'and sent it to Hazael king of Syria: and he went away from Jerusalem.'
  - where: 'note 24:26 “Sons of an Ammonitess and a Moabitess”'
    claim: 'Kings names the killers without their mothers'' nations'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/12?lang=eng'
    quote: 'For Jozachar the son of Shimeath, and Jehozabad the son of Shomer, his servants, smote him'
  - where: 'note 24:26 “Sons of an Ammonitess and a Moabitess”'
    claim: 'One older reading: the Chronicler connects the king''s foreign worship with his murder by men of foreign descent'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/24.htm'
    quote: 'The Chronicler’s object no doubt is to trace a connexion between the apostasy of Joash and its punishment, between the king’s foreign worship and his murder by men of foreign descent.'
  - where: 'note 24:27 “The burdens laid upon him”'
    claim: 'BDB: massa as prophetic utterance, listing 2 Chr. 24:27'
    key: bdb
    url: 'https://biblehub.com/hebrew/4853.htm'
    quote: 'utterance, oracle … of prophetic utterance: 2 Kings 9:25; Isaiah 14:28; Ezekiel 12:10; 2Chronicles 24:27 (with עַל)'
  - where: 'section 5 plain'
    claim: '"The story" is a midrash, a commentary'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/24.htm'
    quote: 'the story] R.V. the commentary (Heb. midrash).'
  - where: 'note 24:20 “The Zacharias whom Jesus named”'
    claim: 'The Protevangelium of James is a noncanonical second-century text'
    key: wilson-zacharias
    url: 'https://rsc.byu.edu/vol-14-no-2-2013/confusing-case-zacharias'
    quote: 'The matter became further entangled in the second century AD, when much Christian literature came forward to satisfy the early Christians’ hunger for more details about Jesus’ early life. One of these pieces, the noncanonical Protevangelium of James'
  - where: 'note 24:26 “Sons of an Ammonitess and a Moabitess”'
    claim: 'The Church''s footnote gives Jozachar as another form of Zabad'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/24?lang=eng'
    quote: 'OR Jozachar (see 2 Kgs. 12:21).'
  - where: 'note 24:27 “The burdens laid upon him”'
    claim: 'BDB: the "burden" of Babylon and of Moab in Isaiah are prophetic utterances'
    key: bdb
    url: 'https://biblehub.com/hebrew/4853.htm'
    quote: 'בָבֶל ׳מ Isaiah 13:1, מוֺאָב ׳מ Isaiah 15:1'
  - where: 'christ'
    claim: 'The speaker of Matt. 23 is Jehovah Himself, who sends prophets'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'Jehovah Himself replied by predicting that they would dye their hands in the blood of prophets, wise men, and righteous scribes, whom He would send amongst them'
  - where: 'christ'
    claim: 'Matt. 23:37 in the King James'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/23?lang=eng'
    quote: 'how often would I have gathered thy children together, even as a hen gathereth her chickens under her wings, and ye would not!'
  - where: 'christ'
    claim: 'D&C 1:38 in the Church''s edition'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/1?lang=eng'
    quote: 'whether by mine own voice or by the voice of my servants, it is the same.'
  - where: 'explore'
    claim: 'The study traces the Zechariahs and the Protevangelium story'
    key: wilson-zacharias
    url: 'https://rsc.byu.edu/vol-14-no-2-2013/confusing-case-zacharias'
    quote: 'The biblical account of the high priest “Zechariah son of Jehoiada,” who was slain by King Joash in the temple (2 Chronicles 24:20), has fascinated biblical students for centuries.'
  - where: 'note 24:20 “The Zacharias whom Jesus named”'
    claim: 'The Old Testament does not number Zechariah son of Berechiah among the martyrs'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'The Old Testament does not number this Zechariah among the martyrs'
  - where: 'note 24:20 “The Zacharias whom Jesus named”'
    claim: 'Talmage leaves the question open: probably the latest recorded martyrdom, and a fuller account likely in scriptures since lost'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'That the Lord referred to a late and probably the latest of the recorded martyrdoms is probable; and it is equally evident that the case was well known among the Jews. It is likely that a fuller account appeared in scriptures current among the Jews at the time of Christ but since lost.'
  - where: 'note 24:20 “The Zacharias whom Jesus named”'
    claim: 'The second explanation: an unknown martyr who shared both names'
    key: wilson-zacharias
    url: 'https://rsc.byu.edu/vol-14-no-2-2013/confusing-case-zacharias'
    quote: 'The Lord introduces an unknown martyr who happened to share names—both his own name and his father’s name—with the Old Testament prophet.'
  - where: 'note 24:20 “The Zacharias whom Jesus named”'
    claim: 'The first explanation, a mistake, is now generally accepted'
    key: wilson-zacharias
    url: 'https://rsc.byu.edu/vol-14-no-2-2013/confusing-case-zacharias'
    quote: 'The former option—that someone made a mistake—is now generally accepted by biblical scholars.'
  - where: 'note 24:20 “Forsaken as they had forsaken”'
    claim: 'For "stood above the people" another older reading compares Baruch reading from an upper chamber over the court and Ezra on a pulpit of wood'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/24.htm'
    quote: 'stood above the people] Cp. Jeremiah 36:10 (Baruch reads Jeremiah’s words from the window of an upper chamber to the people assembled in the court below); Nehemiah 8:4 (Ezra reads the Law from a pulpit of wood).'
  - where: 'note 24:21 “Stoned in the temple court”'
    claim: 'Joash was hidden in the house of God six years'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/22?lang=eng'
    quote: 'he was with them hid in the house of God six years'
  - where: 'note 24:22 “The LORD look upon it, and require it”'
    claim: 'Luke 11:51: the blood of Zacharias shall be required of this generation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'It shall be required of this generation.'
  - where: 'christ'
    claim: 'Jehoiada instructed Joash (2 Kgs. 12:2)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/12?lang=eng'
    quote: 'all his days wherein Jehoiada the priest instructed him'
  - where: 'note 24:24 “Judgment within the year”'
    claim: 'Kings tells the Syrian campaign against Jerusalem without naming a sin it punished'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/12?lang=eng'
    quote: 'Hazael set his face to go up to Jerusalem.'
