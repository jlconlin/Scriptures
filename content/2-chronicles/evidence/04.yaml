chapter: 4
claims:
  - where: 'when'
    claim: 'Solomon began to build in the fourth year of his reign'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/3?lang=eng'
    quote: 'And he began to build in the second day of the second month, in the fourth year of his reign.'
  - where: 'when'
    claim: 'The house took seven years to build'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/6?lang=eng'
    quote: 'So was he seven years in building it.'

  - where: 'setting'
    claim: 'Chronicles omits the description of the lavers'' stands as subordinate parts'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/4.htm'
    quote: 'These stands, the artistic work on which is circumstantially described in 1 Kings 7:27-37, are omitted in the Chronicle, because they are merely subordinate parts of the lavers.'
  - where: 'setting'
    claim: 'Verses 7–9 are not in the parallel in 1 Kings 7; the two accounts otherwise correspond and close with the same verse'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/4.htm'
    quote: 'These three verses are not found in the parallel narrative 1 Kings 7 … not only do the whole contents of our fourth chapter correspond to the section 1 Kings 7:23-50, but both passages are rounded off by the same concluding verse'
  - where: 'setting'
    claim: 'The compilers chose what suited their purpose and dwell on temple worship'
    key: bd-chronicles
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/chronicles?lang=eng'
    quote: 'the compilers choosing such portions as suited the purpose of their composition. Though secular events are not excluded from the compilations thus formed, the writers dwell with most satisfaction upon the ecclesiastical and religious aspects of the history, and the progress of temple worship in Jerusalem.'
  - where: 'setting'
    claim: 'Kings tells the king''s house before the temple''s furnishings, and casts the sea and lavers in 7:23–39'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/7?lang=eng'
    quote: 'And he put five bases on the right side of the house, and five on the left side of the house: and he set the sea on the right side of the house eastward over against the south.'

  - where: 'setting'
    claim: 'Kings tells Solomon''s own house first in chapter 7 (1 Kgs. 7:1–12)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/7?lang=eng'
    quote: 'But Solomon was building his own house thirteen years'
  - where: 'setting'
    claim: 'In chapter 5 the ark is brought in and the cloud fills the house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/5?lang=eng'
    quote: 'for the glory of the LORD had filled the house of God'

  - where: 'thread'
    claim: 'The tabernacle law had the priests wash before coming near the altar or going in'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/30?lang=eng'
    quote: 'When they go into the tabernacle of the congregation, they shall wash with water, that they die not; or when they come near to the altar to minister'
  - where: 'thread'
    claim: 'The bronze of David''s wars went into the sea, pillars and vessels'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/18?lang=eng'
    quote: 'brought David very much brass, wherewith Solomon made the brasen sea, and the pillars, and the vessels of brass'
  - where: 'thread'
    claim: 'The chapter falls into the bronze furniture of the court and the golden furniture of the holy place'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/4.htm'
    quote: '2 Chronicles 4:1-6. The copper furniture of the court.'
  - where: 'thread'
    claim: 'The golden furniture of the holy place (verses 7–8, 19–22)'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/4.htm'
    quote: 'The golden furniture of the holy place and the gilded doors of the temple.'
  - where: 'thread'
    claim: 'The temple''s design was revealed, as recorded in 1 Chr. 28:11–12'
    key: madsen-solomons-temple
    url: 'https://rsc.byu.edu/eye-faith/solomons-temple-compared-salt-lake-temple'
    quote: 'The design for the temple, as for the Tent of Meeting, was revealed by the Lord in minute detail, as recorded in 1 Chronicles 28:11–12'
  - where: 'thread'
    claim: 'Worshippers came only as far as the courtyard; the altar outside was where the sacrifices were offered'
    key: madsen-solomons-temple
    url: 'https://rsc.byu.edu/eye-faith/solomons-temple-compared-salt-lake-temple'
    quote: 'The altar just outside of the temple was the place where sacrifices prescribed in the law of Moses were offered. Worshippers could only go as far as the courtyard.'

  - where: 'note 4:1 “The great altar of the court”'
    claim: 'Kings mentions the brasen altar in passing at the dedication, when it was too little'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'because the brasen altar that was before the LORD was too little to receive the burnt offerings'
  - where: 'note 4:1 “The great altar of the court”'
    claim: 'After the dedication Solomon offered three times a year on the altar he built'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/9?lang=eng'
    quote: 'upon the altar which he built unto the LORD'
  - where: 'note 4:1 “The great altar of the court”'
    claim: 'The tabernacle altar was five cubits square and three high'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/27?lang=eng'
    quote: 'five cubits long, and five cubits broad; the altar shall be foursquare: and the height thereof shall be three cubits.'
  - where: 'note 4:1 “The great altar of the court”'
    claim: 'The bronze altar stood in the outer court, of the tabernacle''s pattern but far larger, until Ahaz replaced it'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'In the outer court stood the brazen altar of the same pattern as that of the tabernacle, but enormously larger (2 Chr. 4:1). Ahaz superseded it with an altar of Damascus pattern (2 Kgs. 16:11–16).'
  - where: 'note 4:1 “The great altar of the court”'
    claim: 'Ahaz moved the brasen altar aside for the copy of the Damascus altar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/16?lang=eng'
    quote: 'And he brought also the brasen altar, which was before the LORD, from the forefront of the house, from between the altar and the house of the LORD, and put it on the north side of the altar.'
  - where: 'note 4:1 “The great altar of the court”'
    claim: 'The worshipper laid his hand on the burnt offering and killed it; the priests sprinkled the blood on the altar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/1?lang=eng'
    quote: 'And he shall put his hand upon the head of the burnt offering; and it shall be accepted for him to make atonement for him.'

  - where: 'note 4:5 “Three thousand baths, and oxen under the brim”'
    claim: 'Kings has knops under the brim and two thousand baths'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/7?lang=eng'
    quote: 'And under the brim of it round about there were knops compassing it, ten in a cubit'
  - where: 'note 4:5 “Three thousand baths, and oxen under the brim”'
    claim: 'Chronicles'' Hebrew has bĕqārîm, oxen, at 4:3'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'בְּקָרִים֩'
  - where: 'note 4:5 “Three thousand baths, and oxen under the brim”'
    claim: 'Kings'' Hebrew has pĕqāʿîm, knops, at 1 Kgs. 7:24'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'הַ/פְּקָעִ֔ים'
  - where: 'note 4:5 “Three thousand baths, and oxen under the brim”'
    claim: 'The knops were metal or wood ornaments, most think gourd-shaped'
    key: bdb
    url: 'https://biblehub.com/hebrew/6497.htm'
    quote: 'plural carved wood or metal ornaments, either ball-, knob-shaped (Löwp. 332 f.) of gourd-shaped (so most'
  - where: 'note 4:5 “Three thousand baths, and oxen under the brim”'
    claim: 'The Septuagint has calves beneath the sea'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_chronicles/4.htm'
    quote: 'And beneath it the likeness of calves, they compass it round about'
  - where: 'note 4:5 “Three thousand baths, and oxen under the brim”'
    claim: 'The Septuagint has three thousand measures'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_chronicles/4.htm'
    quote: 'holding three thousand measures'
  - where: 'note 4:5 “Three thousand baths, and oxen under the brim”'
    claim: 'One older reading: both differences are probably copying errors in Chronicles'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/4.htm'
    quote: 'The differences in substance, such as the occurrence of בּקרים and הבּקר, 2 Chronicles 4:3, instead of פּקעים and הפּקים, and 3000 baths instead of 2000, are probably the result of orthographical errors in the Chronicle.'
  - where: 'note 4:5 “Three thousand baths, and oxen under the brim”'
    claim: 'Another: the oxen can hardly be right, but which book has the corrupt figure cannot be determined; a bath is about 8¼ gallons'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/4.htm'
    quote: 'This reading has the support of the LXX., but can hardly be correct.'
  - where: 'note 4:5 “Three thousand baths, and oxen under the brim”'
    claim: 'Which book''s figure is corrupt cannot be determined; the bath'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/4.htm'
    quote: 'Whether the textual corruption is to be attributed to 1 Kin. or to Chron. cannot be determined. The bath was a measure for liquids equal to about 8¼ gallons.'

  - where: 'note 4:6 “Washing before coming near”'
    claim: 'Kings tells where the lavers and the sea stood, not their use'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/7?lang=eng'
    quote: 'Then made he ten lavers of brass: one laver contained forty baths: and every laver was four cubits: and upon every one of the ten bases one laver.'
  - where: 'note 4:6 “Washing before coming near”'
    claim: 'The inwards and legs of a burnt offering were washed before burning'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/1?lang=eng'
    quote: 'But his inwards and his legs shall he wash in water: and the priest shall burn all on the altar'
  - where: 'note 4:6 “Washing before coming near”'
    claim: 'The tabernacle laver stood between altar and door; the priests washed hands and feet there'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'Between the altar of burnt offering and the door of the tent stood a laver of brass on a base of brass (Ex. 30:18). In it the priests washed their hands and feet when they went into the tent for any priestly purpose'
  - where: 'note 4:6 “Washing before coming near”'
    claim: 'The law of washing: that they die not, a statute for ever'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/30?lang=eng'
    quote: 'So they shall wash their hands and their feet, that they die not: and it shall be a statute for ever to them'
  - where: 'note 4:6 “Washing before coming near”'
    claim: 'The temple''s furniture was like the tabernacle''s but not identical; the sea for the washing of the priests, the lavers for the sacrifices'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'Between the altar and the porch was the brazen sea for the washing of the priests.'
  - where: 'note 4:6 “Washing before coming near”'
    claim: 'The sea held water for the purification of the priests'
    key: madsen-solomons-temple
    url: 'https://rsc.byu.edu/eye-faith/solomons-temple-compared-salt-lake-temple'
    quote: 'a “brazen sea” to hold the water for the purification of the priests, and smaller washbasins on wheels to wash the animal sacrifices'

  - where: 'note 4:7 “Ten lampstands and ten tables”'
    claim: 'Ten candlesticks and ten tables of shewbread in place of one each'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'Instead of one golden candlestick and one table of shewbread there were ten, five on each side.'
  - where: 'note 4:7 “Ten lampstands and ten tables”'
    claim: 'The Hebrew of “according to their form” is kĕmišpāṭām'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'כְּ/מִשְׁפָּטָ֑/ם'
  - where: 'note 4:7 “Ten lampstands and ten tables”'
    claim: 'The phrase means as prescribed for the candlestick of the Mosaic sanctuary'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/4.htm'
    quote: 'according to their right, i.e., as they should be according to the prescript, or corresponding to the prescript as to the golden candlesticks in the Mosaic sanctuary (Exodus 25:31.).'
  - where: 'note 4:7 “Ten lampstands and ten tables”'
    claim: 'mišpāṭ is the law established by Moses'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/4.htm'
    quote: 'משׁפּט is the law established by the Mosaic legislation.'
  - where: 'note 4:7 “Ten lampstands and ten tables”'
    claim: 'The same word at verse 20: to light them according to the right'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/4.htm'
    quote: 'their use is emphasized: to light them, according to the right, before the most holy place'
  - where: 'note 4:7 “Ten lampstands and ten tables”'
    claim: 'The Revised Version renders it “according to the ordinance concerning them”'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/4.htm'
    quote: 'according to their form] R.V. according to the ordinance concerning them; cp. Exodus 25:31-37; Exodus 40:4.'
  - where: 'note 4:7 “Ten lampstands and ten tables”'
    claim: 'The candlestick was to be made after the pattern shown in the mount'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/25?lang=eng'
    quote: 'And look that thou make them after their pattern, which was shewed thee in the mount.'
  - where: 'note 4:7 “Ten lampstands and ten tables”'
    claim: 'Elsewhere one table of shewbread: Kings, and Abijah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/13?lang=eng'
    quote: 'the shewbread also set they in order upon the pure table'
  - where: 'note 4:7 “Ten lampstands and ten tables”'
    claim: 'David gave gold for the tables of shewbread'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/28?lang=eng'
    quote: 'And by weight he gave gold for the tables of shewbread, for every table'

  - where: 'note 4:9 “Two courts”'
    claim: 'Two courts: the inner, the court of the priests or upper court; the outer or great court for the people, entered by doors of brass'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'There were two temple courts. The inner court was surrounded by a wall consisting of three rows of hewn stone and a row of cedar beams (1 Kgs. 6:36). This was called the court of the priests, or, from its elevation, the upper court'
  - where: 'note 4:9 “Two courts”'
    claim: 'The great court was for the people, entered by brass doors'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'The outer or great court was for the use of the people. Nothing is said about its walls, but it was entered by doors of brass.'
  - where: 'note 4:9 “Two courts”'
    claim: 'Kings names the inner court and the great court'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/6?lang=eng'
    quote: 'And he built the inner court with three rows of hewed stone, and a row of cedar beams.'
  - where: 'note 4:9 “Two courts”'
    claim: 'Jeremiah''s “higher court”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/36?lang=eng'
    quote: 'in the higher court, at the entry of the new gate of the LORD’s house'
  - where: 'note 4:9 “Two courts”'
    claim: 'Worshippers went only as far as the courtyard; they killed the offering and left the rest to the priest'
    key: madsen-solomons-temple
    url: 'https://rsc.byu.edu/eye-faith/solomons-temple-compared-salt-lake-temple'
    quote: 'Worshippers could only go as far as the courtyard. They then would participate in killing the offering and would leave the rest to the priest'
  - where: 'note 4:9 “Two courts”'
    claim: 'Only the high priest entered the Holy of Holies, and the priests kept worshippers out of the temple proper'
    key: madsen-solomons-temple
    url: 'https://rsc.byu.edu/eye-faith/solomons-temple-compared-salt-lake-temple'
    quote: 'The priests would also have kept worshippers out of the temple proper, since only one man, the Aaronic high priest, was allowed to go into the Holy of Holies.'

  - where: 'note 4:16 “Father as a title for Huram”'
    claim: 'The Hebrew is ʾāḇîw, “his father”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'אָבִ֛יו'
  - where: 'note 4:16 “Father as a title for Huram”'
    claim: 'Father as a term of respect: master, priest, prophet, counsellor, king, and the artificer of 2 Chr. 2:12 (Heb.) and 4:16'
    key: bdb
    url: 'https://biblehub.com/hebrew/1.htm'
    quote: '8 term of respect & honour (Abbas, Pater, Papa, Pope); applied to master 2 Kings 5:13; priest Judges 17:10; … counsellor Genesis 45:8 … king 1 Samuel 24:12; artificer 2Chron 2:12; 2 Chronicles 4:16.'
  - where: 'note 4:16 “Father as a title for Huram”'
    claim: 'Joseph a father to Pharaoh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/45?lang=eng'
    quote: 'he hath made me a father to Pharaoh, and lord of all his house'
  - where: 'note 4:16 “Father as a title for Huram”'
    claim: 'Naaman''s servants address him as father'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/5?lang=eng'
    quote: 'And his servants came near, and spake unto him, and said, My father'
  - where: 'note 4:16 “Father as a title for Huram”'
    claim: 'Huram the craftsman was the son of a man of Tyre, sent by the king of Tyre'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/2?lang=eng'
    quote: 'The son of a woman of the daughters of Dan, and his father was a man of Tyre'

  - where: 'christ'
    claim: 'Christ is the last great sacrifice and the high priest who offered it (Heb. 7:26–27)'
    key: madsen-solomons-temple
    url: 'https://rsc.byu.edu/eye-faith/solomons-temple-compared-salt-lake-temple'
    quote: 'We learn from the book of Hebrews that Christ is the last great sacrifice and also the high priest who would offer that sacrifice'
  - where: 'christ'
    claim: 'Hebrews: he did this once, when he offered up himself'
    key: madsen-solomons-temple
    url: 'https://rsc.byu.edu/eye-faith/solomons-temple-compared-salt-lake-temple'
    quote: 'for this he did once, when he offered up himself'
  - where: 'christ'
    claim: 'A worshipper in a modern temple goes through all its rooms into the symbolic presence of the Lord, a privilege denied ancient Israelites'
    key: madsen-solomons-temple
    url: 'https://rsc.byu.edu/eye-faith/solomons-temple-compared-salt-lake-temple'
    quote: 'A worshipper may progress through all the rooms of the temple, finally entering into the symbolic presence of the Lord, a privilege denied to the ancient Israelites.'
  - where: 'christ'
    claim: 'Worshippers come with the sacrifice of a broken heart and contrite spirit to modern temples'
    key: madsen-solomons-temple
    url: 'https://rsc.byu.edu/eye-faith/solomons-temple-compared-salt-lake-temple'
    quote: 'When worshippers come with their sacrifice of a broken heart and a contrite spirit to modern temples, they receive priceless gifts'

  - where: 'explore'
    claim: 'Madsen compares Solomon''s temple with a latter-day temple'
    key: madsen-solomons-temple
    url: 'https://rsc.byu.edu/eye-faith/solomons-temple-compared-salt-lake-temple'
    quote: 'The lack of a one-to-one correlation of rooms in the temple of Solomon when compared to the Salt Lake Temple shows the distinctly different functions of the two buildings.'
