chapter: 12
claims:
  - where: 'setting'
    claim: 'In chapter 11 the northerners who came made the kingdom strong for three years'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/11?lang=eng'
    quote: 'So they strengthened the kingdom of Judah, and made Rehoboam the son of Solomon strong, three years: for three years they walked in the way of David and Solomon.'
  - where: 'setting'
    claim: 'Kings tells the invasion briefly, with no army, no reason given and no prophet'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/14?lang=eng'
    quote: 'And it came to pass in the fifth year of king Rehoboam, that Shishak king of Egypt came up against Jerusalem: And he took away the treasures of the house of the LORD, and the treasures of the king’s house'
  - where: 'setting'
    claim: 'Shishak was the first king of the 22nd dynasty; a relief of his victory over Rehoboam is at Karnak'
    key: bd-shishak
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shishak?lang=eng'
    quote: 'King of Egypt, being the first of the 22nd dynasty (1 Kgs. 11:40; 14:25–26; 2 Chr. 12:2–9). A pictorial representation of his victory over Rehoboam has been discovered on the wall of the temple of Karnak.'
  - where: 'section 1 plain'
    claim: 'Lubims are Libyans (the Church''s footnote)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/12?lang=eng'
    quote: '“Lubims”: IE Libyans. Nahum 3:9.'
  - where: 'section 1 plain'
    claim: 'The Ethiopians are Cushites (the Church''s footnote)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/12?lang=eng'
    quote: '“Ethiopians”: HEB Cushites, Nubians.'
  - where: 'section 2 plain'
    claim: '"Left you" is the same verb as "forsaken me": rendered "forsaken you"'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="5800 a" morph="HVqp1cs" id="14JGD">עָזַ֥בְתִּי</w>'
  - where: 'section 3 plain'
    claim: '"Things went well" rendered "there were good things"'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="1697" morph="HNcmpa" id="149dQ">דְּבָרִ֥ים</w> <w lemma="2896 a" n="0" morph="HAampa" id="14VAa">טוֹבִֽים</w>'
  - where: 'section 4 plain'
    claim: '"Prepared not his heart" rendered "did not set his heart"'
    key: bdb
    url: 'https://biblehub.com/hebrew/3559.htm'
    quote: 'הכין לבב ׳אֶלֿ 1 Samuel 7:3 direct the heart towards ׳י'
  - where: 'note 12:1 “Strong, and then forsaking”'
    claim: 'In chapter 11 the kingdom was strengthened for three years'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/11?lang=eng'
    quote: 'So they strengthened the kingdom of Judah, and made Rehoboam the son of Solomon strong, three years'
  - where: 'note 12:1 “Strong, and then forsaking”'
    claim: 'Kings names Judah''s sins: high places, images, groves, the abominations of the nations'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/14?lang=eng'
    quote: 'For they also built them high places, and images, and groves, on every high hill, and under every green tree.'
  - where: 'note 12:5 “Forsaken, and left”'
    claim: '"Ye have forsaken" is a form of ʿāzab'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="5800 a" morph="HVqp2mp" id="14S8J">עֲזַבְתֶּ֣ם</w>'
  - where: 'note 12:5 “Forsaken, and left”'
    claim: '"Have I also left you" is a form of the same verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="5800 a" morph="HVqp1cs" id="14JGD">עָזַ֥בְתִּי</w>'
  - where: 'note 12:5 “Forsaken, and left”'
    claim: 'The lexicon lists 2 Chr. 12:5 under God''s forsaking men'
    key: bdb
    url: 'https://biblehub.com/hebrew/5800.htm'
    quote: 'e. of God''s forsaking, abandoning men: Deuteronomy 31:17; Isaiah 42:16; Isaiah 49:14; Isaiah 54:7; 2Chronicles 12:5'
  - where: 'note 12:5 “Forsaken, and left”'
    claim: 'The verb means leave, forsake'
    key: bdb
    url: 'https://biblehub.com/hebrew/5800.htm'
    quote: 'Strong''s Hebrew: 5800. עָזַב (azab) -- To leave, forsake, abandon, let go, permit'
  - where: 'note 12:5 “Forsaken, and left”'
    claim: 'Shemaiah had earlier told Rehoboam not to fight Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/11?lang=eng'
    quote: 'But the word of the LORD came to Shemaiah the man of God, saying,'
  - where: 'note 12:5 “Forsaken, and left”'
    claim: 'In Chronicles rewards and punishments are not usually delayed'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'rewards and punishments are not usually delayed in Chronicles, and people are often punished for sins or rewarded for righteousness immediately.'
  - where: 'note 12:7 “Some deliverance, or deliverance soon”'
    claim: 'The phrase is kimʿaṭ lip̄lêṭāh'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="k/4592" n="0.1.0" morph="HR/Ncmsa" id="14Pwx">כִּ/מְעַט֙</w> <w lemma="l/6413" n="0.1" morph="HR/Ncfsa" id="14sNu">לִ/פְלֵיטָ֔ה</w>'
  - where: 'note 12:7 “Some deliverance, or deliverance soon”'
    claim: 'kimʿaṭ means "like a little"'
    key: bdb
    url: 'https://biblehub.com/hebrew/4592.htm'
    quote: '2 כִּמְעַט like a little: hence'
  - where: 'note 12:7 “Some deliverance, or deliverance soon”'
    claim: 'The lexicon lists 2 Chr. 12:7 under "shortly"'
    key: bdb
    url: 'https://biblehub.com/hebrew/4592.htm'
    quote: 'c. = shortly, 2 Chronicles 12:7.'
  - where: 'note 12:7 “Some deliverance, or deliverance soon”'
    claim: 'kimʿaṭ can also mean a small amount (a little remnant)'
    key: bdb
    url: 'https://biblehub.com/hebrew/4592.htm'
    quote: 'e. pleonastic for מְעַט, Isaiah 1:9 (accents) כִּמְעָ֑ט שָׂרִיר a little remnant'
  - where: 'note 12:7 “Some deliverance, or deliverance soon”'
    claim: '"Humbled themselves" in 12:6 is kānaʿ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="c/3665" morph="HC/VNw3mp" id="148Dn">וַ/יִּכָּנְע֥וּ</w>'
  - where: 'note 12:7 “Some deliverance, or deliverance soon”'
    claim: 'The same verb is "humble themselves" in 7:14'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="c/3665" morph="HC/VNi3mp" id="14s9p">וְ/יִכָּנְע֨וּ</w>'
  - where: 'note 12:7 “Some deliverance, or deliverance soon”'
    claim: 'The promise of 7:14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/7?lang=eng'
    quote: 'If my people, which are called by my name, shall humble themselves, and pray, and seek my face, and turn from their wicked ways; then will I hear from heaven'
  - where: 'note 12:8 “My service, and the service of the kingdoms”'
    claim: 'They would learn by experience the difference; God''s rule not so oppressive as the world''s'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/12.htm'
    quote: 'that they may learn to know by experience the difference between the rule of God and that of the heathen kings, and that God''s rule was not so oppressive as that of the rulers of the world.'
  - where: 'note 12:8 “My service, and the service of the kingdoms”'
    claim: 'They would learn the difference between the LORD''s service and other service'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/12.htm'
    quote: '8. that they may know my service, etc.] That they may learn the difference between my service and other service.'
  - where: 'note 12:8 “My service, and the service of the kingdoms”'
    claim: 'Shishak took all the treasures and the gold shields'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/12?lang=eng'
    quote: 'took away the treasures of the house of the LORD, and the treasures of the king’s house; he took all: he carried away also the shields of gold which Solomon had made.'
  - where: 'note 12:12 “Good things in Judah”'
    claim: 'The Hebrew of 12:12 is dᵉbārîm ṭôbîm, "good things"'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="1697" morph="HNcmpa" id="149dQ">דְּבָרִ֥ים</w> <w lemma="2896 a" n="0" morph="HAampa" id="14VAa">טוֹבִֽים</w>'
  - where: 'note 12:12 “Good things in Judah”'
    claim: 'The same two words at 19:3'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="1697" morph="HNcmpa" id="14nMK">דְּבָרִ֥ים</w> <w lemma="2896 a" n="1.0" morph="HAampa" id="14igt">טוֹבִ֖ים</w>'
  - where: 'note 12:12 “Good things in Judah”'
    claim: 'Good things are proofs of piety, a further motive for turning away wrath; cf. 19:3'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/12.htm'
    quote: 'And also in Judah were good things. This is the other motive which caused the Lord to turn away His wrath. Good things are proofs of piety and fear of God, cf. 2 Chronicles 19:3.'
  - where: 'note 12:12 “Good things in Judah”'
    claim: 'An additional reason for the mercy God had shown'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/12.htm'
    quote: 'R.V. and moreover in Judah were good things found; cp. 2 Chronicles 19:3. This is said as giving am additional reason for the mercy which God had shewed (2 Chronicles 12:7).'
  - where: 'note 12:12 “Good things in Judah”'
    claim: 'Jehu''s words to Jehoshaphat'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/19?lang=eng'
    quote: 'Nevertheless there are good things found in thee, in that thou hast taken away the groves out of the land, and hast prepared thine heart to seek God.'
  - where: 'note 12:14 “He prepared not his heart”'
    claim: '"Prepared" is hēkîn, from kûn'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="3559 a" n="0.1.0" morph="HVhp3ms" id="149RY">הֵכִין֙</w>'
  - where: 'note 12:14 “He prepared not his heart”'
    claim: 'kûn means establish, prepare, make firm'
    key: bdb
    url: 'https://biblehub.com/hebrew/3559.htm'
    quote: 'Strong''s Hebrew: 3559. כּוּן (kun) -- To establish, prepare, make firm, set up, fix, direct'
  - where: 'note 12:14 “He prepared not his heart”'
    claim: 'The lexicon groups 12:14 with 19:3 and 30:19, and beside them Ezra 7:10'
    key: bdb
    url: 'https://biblehub.com/hebrew/3559.htm'
    quote: '׳לֹא הֵכִין לִבּוֺ לִדְרוֺשׁ אֶתיֿ2Chronicles 12:14, so 2 Chronicles 19:3; 30:19; + ׳לִדְרוֺשׁ אֵתאתּוֺרַת י Ezra 7:10; הכין לבב ׳אֶלֿ 1 Samuel 7:3 direct the heart towards'
  - where: 'note 12:14 “He prepared not his heart”'
    claim: 'Hezekiah''s prayer for those who prepared their hearts though not cleansed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/30?lang=eng'
    quote: 'That prepareth his heart to seek God, the LORD God of his fathers, though he be not cleansed according to the purification of the sanctuary.'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'note 12:7 “Some deliverance, or deliverance soon”'
    claim: 'The Church''s chapter heading reads the deliverance as partial'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/12?lang=eng'
    quote: 'The people repent and receive partial deliverance.'
  - where: 'setting'
    claim: 'Kings'' verdict in the same passage falls on Judah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/14?lang=eng'
    quote: 'And Judah did evil in the sight of the LORD'
