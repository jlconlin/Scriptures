chapter: 22
claims:
  - where: setting
    claim: 'Jehoram died of his disease and departed without being desired'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/21?lang=eng'
    quote: 'and departed without being desired'
  - where: setting
    claim: 'The LORD spared the house of David for the covenant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/21?lang=eng'
    quote: 'Howbeit the LORD would not destroy the house of David, because of the covenant that he had made with David'
  - where: setting
    claim: 'Athaliah was the daughter of Ahab and wife of Jehoram of Judah'
    key: bd-athaliah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/athaliah?lang=eng'
    quote: 'Daughter of Ahab, king of Israel, and his Phoenician wife Jezebel. Athaliah became the wife of Jehoram, king of Judah'
  - where: setting
    claim: 'Chronicles records only the part of Jehu''s revolt that fell on Judah, the slaughter of Ahaziah and his kin'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/22.htm'
    quote: 'since it did not belong to the plan of the Chronicle to narrate the history of Israel, our historian only briefly records the slaughter of Ahaziah and his brother''s sons by Jehu as being the result of a divine dispensation'
  - where: setting
    claim: 'Kings gives Ahaziah''s accession in a short formula and tells Jehu''s purge at length'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/22.htm'
    quote: 'the account of his death is very brief in the Chronicle (2 Chronicles 22:6-9), while in 2 Kings 9 and 10 the extirpation of the Ahabic house by Jehu, in the course of which Ahaziah was slain with his relatives, is narrated at length'
  - where: thread
    claim: 'The LORD would not destroy the house of David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/21?lang=eng'
    quote: 'Howbeit the LORD would not destroy the house of David'
  - where: 'note 22:1 “The youngest son, made king by Jerusalem”'
    claim: 'Kings says only that Ahaziah his son reigned in his stead'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/8?lang=eng'
    quote: 'And Joram slept with his fathers, and was buried with his fathers in the city of David: and Ahaziah his son reigned in his stead.'
  - where: 'note 22:1 “The youngest son, made king by Jerusalem”'
    claim: 'The raiders left Jehoram no son but Jehoahaz the youngest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/21?lang=eng'
    quote: 'so that there was never a son left him, save Jehoahaz, the youngest of his sons'
  - where: 'note 22:1 “The youngest son, made king by Jerusalem”'
    claim: 'The unusual formula marks an unusual succession, possibly opposed'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/22.htm'
    quote: 'This unusual formula is no doubt intended to call attention to the fact that the succession of the youngest son was unusual, possibly there was opposition to it.'
  - where: 'note 22:1 “The youngest son, made king by Jerusalem”'
    claim: 'One older reading: Chronicles says simply that the son was king in his stead where he succeeded without opposition; the only possible rival was Athaliah'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/22.htm'
    quote: 'where the son follows the father on the throne without opposition, it is simply said in the Chronicle also, "and his son was king in his stead." But the only person who could contest the throne with Ahaziah … was his mother Athaliah, who usurped the throne after his death.'
  - where: 'note 22:1 “The youngest son, made king by Jerusalem”'
    claim: 'The king of Judah Ahaziah is also called Azariah and Jehoahaz'
    key: bd-ahaziah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ahaziah?lang=eng'
    quote: 'called Azariah (2 Chr. 22:6) and Jehoahaz (2 Chr. 21:17).'
  - where: 'note 22:1 “The youngest son, made king by Jerusalem”'
    claim: 'The Hebrew of 22:6 reads Azariah (ʿAzaryāhû)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'וַ/עֲזַרְיָ֨הוּ'
  - where: 'note 22:1 “The youngest son, made king by Jerusalem”'
    claim: 'The Septuagint reads Ochozias (Ahaziah) in verse 6'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_chronicles/22.htm'
    quote: 'And Ochozias son of Joram, king of Juda, went down to see Joram the son of Achaab at Jezrael because he was sick.'
  - where: 'note 22:2 “Forty-two or twenty-two”'
    claim: 'The JST changes forty and two to twenty and two, conforming to 2 Kgs. 8:26'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'the KJV states that Ahaziah was forty and two years when he began to reign. The JST changes this to twenty and two, which makes it conform to the parallel account of 2 Kings 8:26.'
  - where: 'note 22:2 “Forty-two or twenty-two”'
    claim: 'Joseph Smith changed 2 Chr. 22:2 to correct a contradiction'
    key: sc-knowhy-786
    url: 'https://scripturecentral.org/knowhy/did-the-joseph-smith-translation-of-the-bible-rely-on-scholarly-commentaries'
    quote: 'Similarly, Joseph made changes to 2 Chronicles 22:2 and Nehemiah 7 in an effort to correct contradictions in the biblical text. In 2 Chronicles 22:2, the age of King Ahaziah is revised to match the parallel account in 2 Kings 8:26'
  - where: 'note 22:2 “Forty-two or twenty-two”'
    claim: 'The Septuagint, in English translation, reads twenty years old'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_chronicles/22.htm'
    quote: 'Ochozias began to reign when he was twenty years old, and he reigned one year in Jerusalem'
  - where: 'note 22:2 “Forty-two or twenty-two”'
    claim: 'Jehoram began to reign at thirty-two and reigned eight years'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/21?lang=eng'
    quote: 'Jehoram was thirty and two years old when he began to reign, and he reigned eight years in Jerusalem.'
  - where: 'note 22:2 “Forty-two or twenty-two”'
    claim: 'The Church''s footnote gives the JST reading two and twenty; daughter may mean granddaughter'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/22?lang=eng'
    quote: 'JST 2 Chr. 22:2 Two and twenty'
  - where: 'note 22:3 “Counsellors to his destruction”'
    claim: 'Kings gives the family tie as the reason for Ahaziah''s evil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/8?lang=eng'
    quote: 'for he was the son in law of the house of Ahab.'
  - where: 'note 22:3 “Counsellors to his destruction”'
    claim: 'Athaliah, daughter of Ahab and Jezebel, brought Baal worship into Judah as her mother into Israel'
    key: bd-athaliah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/athaliah?lang=eng'
    quote: 'introduced Baal worship into the southern kingdom as her mother had done in the northern kingdom (2 Chr. 22:2–4; 24:7)'
  - where: 'note 22:3 “Counsellors to his destruction”'
    claim: 'Kings and Chronicles consistently record the names of the kings'' mothers'
    key: hilton-motherhood-ot
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/motherhood-old-testament'
    quote: 'While recounting the names and deeds of the various kings, the authors of these books consistently recorded the names of the kings’ mothers.'
  - where: 'note 22:3 “Counsellors to his destruction”'
    claim: 'Ahaziah followed his mother''s precepts; mothers influence nations'
    key: hilton-motherhood-ot
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/motherhood-old-testament'
    quote: 'One can only imagine how history would have been different if Ahaziah’s mother had been his counselor to do good. … From the mothers of the kings, we learn that mothers influence not just children but nations.'
  - where: 'note 22:7 “A destruction that was of God”'
    claim: 'In Kings Ahaziah is struck as he flees'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/9?lang=eng'
    quote: 'But when Ahaziah the king of Judah saw this, he fled by the way of the garden house. And Jehu followed after him, and said, Smite him also in the chariot.'
  - where: 'note 22:7 “A destruction that was of God”'
    claim: 'In Chronicles rewards and punishments are not usually delayed'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'Both Chronicles and the Deuteronomistic History are in broad agreement on the issue of blessings for righteousness and punishment for unrighteousness … rewards and punishments are not usually delayed in Chronicles, and people are often punished for sins or rewarded for righteousness immediately.'
  - where: 'note 22:8 “Ahaziah''s nephews”'
    claim: 'Kings: Jehu slew the brethren of Ahaziah, forty-two men, at the pit of the shearing house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/10?lang=eng'
    quote: 'Jehu met with the brethren of Ahaziah king of Judah … and slew them at the pit of the shearing house, even two and forty men'
  - where: 'note 22:8 “Ahaziah''s nephews”'
    claim: 'Kings'' "brethren" means kinsmen; Ahaziah''s brothers in the strict sense were already dead'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/22.htm'
    quote: 'In 2 Kings 10:13, “the brethren (i.e. kinsmen) of Ahaziah.” The brethren (in the strict sense of the word) of Ahaziah had already been killed (2 Chronicles 22:1).'
  - where: 'note 22:9 “Buried for his grandfather''s sake”'
    claim: 'Jehoshaphat sought the LORD God of his father'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/17?lang=eng'
    quote: 'But sought to the LORD God of his father, and walked in his commandments'
  - where: 'note 22:9 “Buried for his grandfather''s sake”'
    claim: 'Jehu son of Hanani said Jehoshaphat had prepared his heart to seek God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/19?lang=eng'
    quote: 'Nevertheless there are good things found in thee … and hast prepared thine heart to seek God.'
  - where: 'note 22:9 “Buried for his grandfather''s sake”'
    claim: 'Kings: his servants carried him to Jerusalem and buried him in the city of David; footnote: son means grandson'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/9?lang=eng'
    quote: 'And his servants carried him in a chariot to Jerusalem, and buried him in his sepulchre with his fathers in the city of David.'
  - where: 'note 22:11 “The priest''s household hides the heir”'
    claim: 'Kings names her Jehosheba, does not name her husband, and has the boy hid with her in the house of the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/11?lang=eng'
    quote: 'But Jehosheba, the daughter of king Joram, sister of Ahaziah, took Joash the son of Ahaziah … And he was with her hid in the house of the LORD six years.'
  - where: 'note 22:11 “The priest''s household hides the heir”'
    claim: 'Jehoiada was the high priest who overthrew Athaliah, set up Joash, and was buried with the kings'
    key: bd-jehoiada
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehoiada?lang=eng'
    quote: 'The high priest who procured the overthrow of Queen Athaliah and the establishment of Joash as king; as a mark of honor he was buried with the kings of Judah'
  - where: christ
    claim: 'One Latter-day Saint reading: Joash, in the line of David and ancestry of Christ, is saved, preserving the royal line'
    key: interpreter-cfm-2026-2-kings-2-7
    url: 'https://interpreterfoundation.org/come-follow-me/old-testament-2026/2-kings-2-7-2'
    quote: 'the child Joash/Jehoash—in the line of David and the ancestry of Christ—is saved from death, thus preserving the royal line'
  - where: christ
    claim: 'The covenant with David as the reason the house was not destroyed; D&C 3:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/3?lang=eng'
    quote: 'The works, and the designs, and the purposes of God cannot be frustrated, neither can they come to naught.'
