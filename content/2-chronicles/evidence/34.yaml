chapter: 34
claims:
  - where: 'when'
    claim: 'Josiah began to seek the LORD in his eighth year; the repair, and the finding of the book, in his eighteenth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/34?lang=eng'
    quote: 'For in the eighth year of his reign, while he was yet young, he began to seek after the God of David his father'
  - where: 'setting'
    claim: 'Kings views the whole reform in connection with the book; Chronicles keeps the events apart by date'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/34.htm'
    quote: 'In the Chronicle, on the contrary, these events are more kept apart, and described according to their order in time.'
  - where: 'setting'
    claim: 'The parallel is 2 Kgs. 22; Jeremiah was called in Josiah''s thirteenth year; Manasseh and Amon reigned before him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng'
    quote: 'To whom the word of the LORD came in the days of Josiah the son of Amon king of Judah, in the thirteenth year of his reign.'
  - where: 'thread'
    claim: 'The chapter''s movement from seeking (34:3) to the wrath poured out (34:21), Huldah''s two answers (34:25, 27) and the covenant to the limit of 34:33'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/34?lang=eng'
    quote: 'for great is the wrath of the LORD that is poured out upon us, because our fathers have not kept the word of the LORD'
  - where: 'section 1 plain'
    claim: 'The "images, that were on high above them" (34:4) may be rendered sun images'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/34?lang=eng'
    quote: '4a “images”: OR sun images. 2 Kgs. 23:6.'
  - where: 'section 1 plain'
    claim: '34:6: "with their tools," or perhaps "in their ruins"'
    key: bdb
    url: 'https://biblehub.com/hebrew/2719.htm'
    quote: '2 Chronicles 34:6 Qr בְּחַרְבֹתֵיהֶם with their tools; read perhaps בְּחָרְבֹתֵיהֶם in their ruins'
  - where: 'section 4 plain'
    claim: '"The college" is in Hebrew "the second section" (rendered "the second quarter of the city")'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/34?lang=eng'
    quote: '22a “college”: HEB second section.'
  - where: 'note 34:3 “Seeking before the book was found”'
    claim: 'Chronicles: seeking in the eighth year, purge in the twelfth, repair and book in the eighteenth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/34?lang=eng'
    quote: 'and in the twelfth year he began to purge Judah and Jerusalem from the high places'
  - where: 'note 34:3 “Seeking before the book was found”'
    claim: 'Kings dates the repair to the eighteenth year and tells the purge after the covenant (2 Kgs. 22:3; 23:3–4)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/22?lang=eng'
    quote: 'And it came to pass in the eighteenth year of king Josiah, that the king sent Shaphan'
  - where: 'note 34:3 “Seeking before the book was found”'
    claim: 'Josiah was sixteen in his eighth year; Kings views the whole reform with the book, Chronicles keeps events apart in their order in time'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/34.htm'
    quote: 'In the eighth year of his reign, while he was yet a youth, being then only sixteen years old, Josiah began to seek the God of his ancestor David'
  - where: 'note 34:3 “Seeking before the book was found”'
    claim: 'Keil: Kings views the reform in connection with the book; Chronicles in order of time'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/34.htm'
    quote: 'In the second book of Kings, the whole reform of the cultus carried out by Josiah is viewed in its connection with the discovery of the book of the law … In the Chronicle, on the contrary, these events are more kept apart, and described according to their order in time.'
  - where: 'note 34:3 “Seeking before the book was found”'
    claim: 'The Cambridge Bible: the two dates are doublets from a copyist''s error for "eighteenth"; Kings'' order right; early piety probably a fact'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/34.htm'
    quote: 'it is probable that neither reading is original, for both seem to have been derived by some transcriptional error or other from 2 Kings 22:3 … there can be little doubt that this order is right … Yet his early piety is probably a fact'
  - where: 'note 34:3 “Seeking before the book was found”'
    claim: 'While still young, under Hilkiah''s guidance, a thorough reformation extending to the northern tribes'
    key: bd-josiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/josiah?lang=eng'
    quote: 'While still young, he made, under the guidance of Hilkiah, a thorough religious reformation, which extended to the northern tribes.'
  - where: 'note 34:6 “In their ruins round about”'
    claim: 'The ketiv divides into two words, "in the mountain" and "their houses" (H2022, H1004); the qere is one word from ḥereb (H2719)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'ב/הר בתי/הם'
  - where: 'note 34:6 “In their ruins round about”'
    claim: 'BDB: the qere means "with their tools" (tools for hewing stone); perhaps read "in their ruins"'
    key: bdb
    url: 'https://biblehub.com/hebrew/2719.htm'
    quote: '3 of tools used in hewing stone … 2 Chronicles 34:6 Qr בְּחַרְבֹתֵיהֶם with their tools; read perhaps בְּחָרְבֹתֵיהֶם in their ruins'
  - where: 'note 34:6 “In their ruins round about”'
    claim: 'The Septuagint has "the places round about them"'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_chronicles/34.htm'
    quote: 'And he did so in the cities of Manasse, and Ephraim, and Symeon, and Nephthali, and the places round about them.'
  - where: 'note 34:6 “In their ruins round about”'
    claim: 'The reform extended to the northern tribes'
    key: bd-josiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/josiah?lang=eng'
    quote: 'a thorough religious reformation, which extended to the northern tribes'
  - where: 'note 34:6 “In their ruins round about”'
    claim: 'Assyria carried Israel away (2 Kgs. 17:6)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/17?lang=eng'
    quote: 'the king of Assyria took Samaria, and carried Israel away into Assyria'
  - where: 'note 34:12 “Musicians over the workmen”'
    claim: 'The rest of verse 12 and verse 13 have no parallel in Kings; "skill of instruments" means play skilfully'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/34.htm'
    quote: 'There is no parallel in 2 Kin. for the rest of this verse and for 2 Chronicles 34:13. … skill of instruments = “play skilfully upon instruments.”'
  - where: 'note 34:12 “Musicians over the workmen”'
    claim: 'The musicians were given oversight because their office and art gave them a conspicuous place among the Levites (cf. 1 Chr. 25:6)'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/34.htm'
    quote: 'the Levites, all who were skilled in instruments of song (cf. 1 Chronicles 25:6.). As men who by their office and their art occupied a conspicuous place among the Levites, the oversight of the workmen in the temple was committed to them'
  - where: 'note 34:12 “Musicians over the workmen”'
    claim: 'Kings speaks only of the doers of the work that have the oversight (2 Kgs. 22:5)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/22?lang=eng'
    quote: 'And let them deliver it into the hand of the doers of the work, that have the oversight of the house of the LORD'
  - where: 'note 34:27 “Humbled, and heard”'
    claim: 'Kings says once that Josiah humbled himself (2 Kgs. 22:19)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/22?lang=eng'
    quote: 'Because thine heart was tender, and thou hast humbled thyself before the LORD'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'The footnote to "seek" in 34:3 points to D&C 88:63, the promise to those who seek'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/34?lang=eng'
    quote: '3a “seek”: D&C 88:63 (63–67).'
  - where: 'christ'
    claim: 'D&C 88:63: draw near, seek diligently'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: 'Draw near unto me and I will draw near unto you; seek me diligently and ye shall find me'
  - where: 'note 34:27 “Humbled, and heard”'
    claim: 'The promise at the dedication: if my people humble themselves, I will hear from heaven (2 Chr. 7:14)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/7?lang=eng'
    quote: 'If my people, which are called by my name, shall humble themselves, and pray, and seek my face, and turn from their wicked ways; then will I hear from heaven'
  - where: 'setting'
    claim: 'The site''s notes on 2 Kgs. 22 explain the promise of death in peace though Josiah fell in battle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/22?lang=eng'
    quote: 'thou shalt be gathered into thy grave in peace; and thine eyes shall not see all the evil which I will bring upon this place'
  - where: 'setting'
    claim: 'Manasseh reigned fifty-five years and Amon two before Josiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/33?lang=eng'
    quote: 'he reigned fifty and five years in Jerusalem'
  - where: 'setting'
    claim: 'Kings gives Josiah''s Passover three verses (2 Kgs. 23:21–23)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng'
    quote: 'Keep the passover unto the LORD your God, as it is written in the book of this covenant.'
  - where: 'note 34:3 “Seeking before the book was found”'
    claim: 'In Kings the purge (2 Kgs. 23:4–20) follows the covenant made over the book (23:3)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng'
    quote: 'And all the people stood to the covenant. And the king commanded Hilkiah the high priest'
