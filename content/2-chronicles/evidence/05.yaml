chapter: 5
claims:
  - where: 'when'
    claim: 'The chapter falls at the feast of the seventh month, when the work of the house was finished'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/5?lang=eng'
    quote: 'Wherefore all the men of Israel assembled themselves unto the king in the feast which was in the seventh month.'
  - where: 'setting'
    claim: 'The chapter tells the same morning as 1 Kings 8:1–11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'And it came to pass, when the priests were come out of the holy place, that the cloud filled the house of the LORD,'
  - where: 'setting'
    claim: 'David dedicated silver and gold from his wars, kept among the treasures of the dedicated things'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/18?lang=eng'
    quote: 'Them also king David dedicated unto the LORD, with the silver and the gold that he brought from all these nations'
  - where: 'setting'
    claim: 'The dedicated things were kept in the treasures of the dedicated things'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/26?lang=eng'
    quote: 'over all the treasures of the dedicated things, which David the king, and the chief fathers, the captains over thousands and hundreds, and the captains of the host, had dedicated.'
  - where: 'setting'
    claim: 'Verses 11–13 describe the part of the priests, singers and musicians, which Kings passes over entirely'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/5.htm'
    quote: '2 Chronicles 5:11-13 describe the part which the priests and Levitical singers and musicians took in the solemn act of transferring the ark to the temple-a matter entirely passed over in the narrative in 1 Kings 8:11'
  - where: 'setting'
    claim: 'Chronicles was compiled from prophetic records along with Samuel and Kings'
    key: bd-chronicles
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/chronicles?lang=eng'
    quote: 'These records along with Samuel and Kings formed the material out of which our books of Chronicles were compiled … the writers dwell with most satisfaction upon the ecclesiastical and religious aspects of the history, and the progress of temple worship in Jerusalem.'
  - where: 'setting'
    claim: 'Chronicles was written for a people with a newly rebuilt temple, and appears to address whether they are still God''s people'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'the question Chronicles appears to address is “Are we still God''s people and does the covenant still stand?" The Chronicler writes to give hope, to create an identity based on worship and the ideals of the kingdom, and to legitimize their newly rebuilt temple.'
  - where: 'thread'
    claim: 'The glory returns with fire when Solomon finishes praying'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/7?lang=eng'
    quote: 'Now when Solomon had made an end of praying, the fire came down from heaven, and consumed the burnt offering and the sacrifices; and the glory of the LORD filled the house.'
  - where: 'section 3 plain'
    claim: '“Did not then wait by course”: the priests did not keep to their divisions, all of them serving at once'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/5.htm'
    quote: 'i.e., the courses of the priests (1 Chronicles 24) could not be observed. The festival was so great, that not merely the course appointed to perform the service of that week, but also all the courses had sanctified themselves and co-operated in the celebration.'
  - where: 'note 5:4 “Levites or priests?”'
    claim: 'Kings says the priests took up the ark'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'And all the elders of Israel came, and the priests took up the ark.'
  - where: 'note 5:4 “Levites or priests?”'
    claim: 'Levites are sometimes distinct from priests, sometimes spoken of as all priests, “the priests, the Levites” (Josh. 3:3)'
    key: bd-levites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levites?lang=eng'
    quote: 'The Levites are sometimes spoken of as distinct from the priests (1 Kgs. 8:4; Ezra 2:70; John 1:19); sometimes as though all Levites were also priests, “the priests, the Levites” (Deut. 18:1; Josh. 3:3).'
  - where: 'note 5:9 ““Unto this day,” after the ark was gone”'
    claim: 'Kings has the line “there they are unto this day”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'and they were not seen without: and there they are unto this day.'
  - where: 'note 5:9 ““Unto this day,” after the ark was gone”'
    claim: 'Chronicles was compiled using Samuel and Kings'
    key: bd-chronicles
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/chronicles?lang=eng'
    quote: 'These records along with Samuel and Kings formed the material out of which our books of Chronicles were compiled'
  - where: 'note 5:9 ““Unto this day,” after the ark was gone”'
    claim: 'An older reading: the words are taken over from 1 Kings 8:8 with one letter changed, singular for plural, and are out of place in Chronicles, written after the ark had disappeared'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/5.htm'
    quote: 'These words are taken over with the loss of one letter (which here makes the difference between singular and plural) from 1 Kings 8:8, but they are out of place in Chron., for when the Chronicler wrote the ark had long ago disappeared.'
  - where: 'note 5:9 ““Unto this day,” after the ark was gone”'
    claim: 'The ark had disappeared before the second temple was built; it was reinstated under Josiah (2 Chr. 35:3)'
    key: bd-ark-of-the-covenant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ark-of-the-covenant?lang=eng'
    quote: 'Apparently it was removed by Manasseh and reinstated by Josiah (2 Chr. 33; 35:3). … It had certainly disappeared before the building of the second temple.'
  - where: 'note 5:9 ““Unto this day,” after the ark was gone”'
    claim: 'The last mention of the ark in Chronicles is Josiah''s order to put it in the house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/35?lang=eng'
    quote: 'Put the holy ark in the house which Solomon the son of David king of Israel did build; it shall not be a burden upon your shoulders'
  - where: 'note 5:9 ““Unto this day,” after the ark was gone”'
    claim: 'The house was later burned'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: 'And they burnt the house of God, and brake down the wall of Jerusalem'
  - where: 'note 5:12 “Trumpets for the priests, songs for the Levites”'
    claim: 'The law gave the trumpets to the priests, to blow in days of gladness over offerings as a memorial'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/10?lang=eng'
    quote: 'And the sons of Aaron, the priests, shall blow with the trumpets; and they shall be to you for an ordinance for ever throughout your generations.'
  - where: 'note 5:12 “Trumpets for the priests, songs for the Levites”'
    claim: 'The trumpets were blown in the day of gladness over burnt offerings, as a memorial'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/10?lang=eng'
    quote: 'Also in the day of your gladness, and in your solemn days, and in the beginnings of your months, ye shall blow with the trumpets over your burnt offerings'
  - where: 'note 5:12 “Trumpets for the priests, songs for the Levites”'
    claim: 'When the ark came to Jerusalem, David set priests to blow the trumpets before it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/15?lang=eng'
    quote: 'the priests, did blow with the trumpets before the ark of God'
  - where: 'note 5:12 “Trumpets for the priests, songs for the Levites”'
    claim: 'At the second temple''s foundation, priests with trumpets and Levites of Asaph with cymbals praised “after the ordinance of David”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/3?lang=eng'
    quote: 'they set the priests in their apparel with trumpets, and the Levites the sons of Asaph with cymbals, to praise the LORD, after the ordinance of David king of Israel.'
  - where: 'note 5:12 “Trumpets for the priests, songs for the Levites”'
    claim: 'The singers'' white linen is described as “sacred temple robes of white”'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'The text makes clear that the Levites had been sanctified and were dressed in sacred temple robes of white.'
  - where: 'note 5:13 “The cloud came as they sang”'
    claim: 'Kings goes straight from the priests'' coming out to the cloud'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'And it came to pass, when the priests were come out of the holy place, that the cloud filled the house of the LORD,'
  - where: 'note 5:13 “The cloud came as they sang”'
    claim: 'A Latter-day Saint reading: the music itself led to the presence of God entering the temple'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'This passage points to the music and singing itself as the behavior that directly led to the presence of God entering into the temple.'
  - where: 'note 5:13 “The cloud came as they sang”'
    claim: 'The same refrain is said when fire falls after Solomon''s prayer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/7?lang=eng'
    quote: 'and worshipped, and praised the LORD, saying, For he is good; for his mercy endureth for ever.'
  - where: 'note 5:13 “The cloud came as they sang”'
    claim: 'The words are the refrain of Psalm 136'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/136?lang=eng'
    quote: 'O give thanks unto the LORD; for he is good: for his mercy endureth for ever.'
  - where: 'note 5:13 “The cloud came as they sang”'
    claim: 'Nearly the same words were sung when the second temple''s foundation was laid'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/3?lang=eng'
    quote: 'because he is good, for his mercy endureth for ever toward Israel'
  - where: 'christ'
    claim: 'The Lord at Kirtland spoke with the voice of Jehovah and said he was slain: Jehovah is Jesus Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/110?lang=eng'
    quote: 'even the voice of Jehovah, saying: I am the first and the last; I am he who liveth, I am he who was slain; I am your advocate with the Father.'
  - where: 'christ'
    claim: 'The Lord promises His glory and presence to a latter-day house kept undefiled'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/97?lang=eng'
    quote: 'and do not suffer any unclean thing to come into it, that it be not defiled, my glory shall rest upon it; Yea, and my presence shall be there'
