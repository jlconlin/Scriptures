chapter: 25
claims:
  - where: setting
    claim: 'Verses 5–10 are not in Kings'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/25.htm'
    quote: '5–10 (not in Kings). Amaziah prepares for War'
  - where: setting
    claim: 'Verse 13 has no parallel in Kings'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/25.htm'
    quote: '13 (no parallel in Kings). Outrages of the Ephraimite Mercenaries'
  - where: setting
    claim: 'Verses 14–16 are not in Kings; verses 17–24 = 2 Kings 14:8–14'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/25.htm'
    quote: '14–16 (not in Kings). Amaziah’s Idolatry and the Prophet’s Rebuke'
  - where: setting
    claim: 'Kings tells the reign in 2 Kings 14:1–20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/14?lang=eng'
    quote: 'In the second year of Joash son of Jehoahaz king of Israel reigned Amaziah the son of Joash king of Judah.'
  - where: thread
    claim: 'Chronicles connects the conspiracy with Amaziah''s apostasy; Kings only states it'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/25.htm'
    quote: 'The Chronicler characteristically connects the conspiracy with Amaziah’s apostasy; in Kings the fact only of the conspiracy is stated.'
  - where: thread
    claim: 'Verse 21 takes up Amaziah''s phrase of verse 17 with irony'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/25.htm'
    quote: 'The historian by a kind of irony takes up Amaziah’s phrase (2 Chronicles 25:17) and gives it a fresh application.'
  - where: 'note 25:2 “Right, but not with a perfect heart”'
    claim: 'Not with a perfect heart = double-minded; instability shown in the high places, war with help of enemies, failure to heed Joash'
    key: ot-manual-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-12?lang=eng'
    quote: 'This is a way of saying he was double-minded, an attitude that makes bad the good things that are done. His instability is shown in (1) his failure to eliminate the high places used for worship of false gods; (2) his desire to make war with the help of enemies; and (3) his failure to heed Joash’s warning.'
  - where: 'note 25:2 “Right, but not with a perfect heart”'
    claim: 'Kings: not like David; the high places not taken away'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/14?lang=eng'
    quote: 'yet not like David his father'
  - where: explore
    claim: 'The charge against the northern kingdom recalls Abijah''s speech, 2 Chr. 13:8–12'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/25.htm'
    quote: '7. the Lord is not with Israel] Cp. 2 Chronicles 13:8-12.'
  - where: 'note 25:14 “The gods of a beaten enemy”'
    claim: 'Amaziah set up the images of Seir as gods and gave them religious adoration'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/25.htm'
    quote: 'Amaziah brought the gods (images) of the sons of Seir (the inhabitants of Mount Seir) with him, and set them up as gods, giving them religious adoration.'
  - where: 'note 25:14 “The gods of a beaten enemy”'
    claim: 'Motive: the polytheist belief that to subject a people one must win over their gods; the prophet exposes the folly by their impotence'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/25.htm'
    quote: 'the belief of all polytheists, that in order to make a people subject, one must seek to win over their gods (cf. on this belief that remarks on Numbers 22:17), and exposes the folly of this belief by pointing out the impotence of the Edomite idols'
  - where: 'note 25:14 “The gods of a beaten enemy”'
    claim: 'Imperfect tenses imply it became his practice; a policy often pursued in ancient times; Solomon an instance'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/25.htm'
    quote: 'The tenses in the Heb. are imperfect and imply that this became Amaziah’s practice. The act was according to a policy frequently pursued in ancient times. Solomon affords an instance of it (1 Kings 11:7).'
  - where: 'note 25:14 “The gods of a beaten enemy”'
    claim: 'Solomon built a high place for Chemosh and Molech'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: 'Then did Solomon build an high place for Chemosh, the abomination of Moab'
  - where: 'note 25:14 “The gods of a beaten enemy”'
    claim: 'The prophet''s question: gods which could not deliver their own people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/25?lang=eng'
    quote: 'Why hast thou sought after the gods of the people, which could not deliver their own people out of thine hand?'
  - where: 'note 25:16 “Counsel refused, counsel taken”'
    claim: 'Hebrew of verse 16: "counsellor" is yôʿēṣ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="d/l/3289" morph="HTi/R/Vqrmsa" id="14LTG">הַ/לְ/יוֹעֵ֤ץ</w>'
  - where: 'note 25:16 “Counsel refused, counsel taken”'
    claim: 'Hebrew of verse 16: "hath determined" is yāʿaṣ, counselled'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="3289" morph="HVqp3ms" id="14rtp">יָעַ֤ץ</w>'
  - where: 'note 25:16 “Counsel refused, counsel taken”'
    claim: 'Hebrew of verse 16: "my counsel" is ʿēṣâ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="l/6098" n="0" morph="HR/Ncfsc/Sp1cs" id="14aWZ">לַ/עֲצָתִֽ/י</w>'
  - where: 'note 25:16 “Counsel refused, counsel taken”'
    claim: 'Hebrew of verse 17: "took advice" is the same verb, niphal'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="c/3289" n="1.1.1" morph="HC/VNw3ms" id="148CG">וַ/יִּוָּעַ֗ץ</w>'
  - where: thread
    claim: '"For it was of God" is not in Kings and is characteristic of the Chronicler (10:15; 22:7)'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/25.htm'
    quote: '20. for it was of God] Not in Kings. This turn is characteristic of the Chronicler; cp. 2 Chronicles 10:15; 2 Chronicles 22:7.'
  - where: thread
    claim: 'Text of verse 20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/25?lang=eng'
    quote: 'But Amaziah would not hear; for it came of God, that he might deliver them into the hand of their enemies, because they sought after the gods of Edom.'
  - where: 'note 25:24 “Vessels in Obed-edom''s keeping”'
    claim: 'Obed-edom''s family kept the temple storehouse (1 Chr. 26:4, 8, 15; 2 Chr. 25:24)'
    key: bd-obed-edom
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/obed-edom?lang=eng'
    quote: 'His family kept the temple storehouse (1 Chr. 26:4, 8, 15; 2 Chr. 25:24).'
  - where: 'note 25:24 “Vessels in Obed-edom''s keeping”'
    claim: 'Kings says only the vessels found in the house of the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/14?lang=eng'
    quote: 'and all the vessels that were found in the house of the LORD'
  - where: 'note 25:24 “Vessels in Obed-edom''s keeping”'
    claim: 'To Obed-edom''s sons fell the house of Asuppim'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/26?lang=eng'
    quote: 'To Obed-edom southward; and to his sons the house of Asuppim.'
  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: christ
    claim: 'The Church''s footnote at verse 8 "power" points to D&C 60:4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/25?lang=eng'
    quote: '“power”: D&C 60:4.'
  - where: christ
    claim: 'D&C 60:4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/60?lang=eng'
    quote: 'For I, the Lord, rule in the heavens above, and among the armies of the earth'
  - where: setting
    claim: 'Joash had Jehoiada''s son stoned'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/24?lang=eng'
    quote: 'stoned him with stones at the commandment of the king in the court of the house of the LORD'
  - where: 'note 25:2 “Right, but not with a perfect heart”'
    claim: 'Hebrew of verse 2: "perfect" is shalem'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="8003" n="0" morph="HAamsa" id="146iD">שָׁלֵֽם</w>'
  - where: 'note 25:7 “The LORD is not with Israel”'
    claim: 'A modern translation reads verse 8 as go by yourself'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=2+Chronicles+25&version=NRSVUE'
    quote: 'Rather, go by yourself and act; be strong in battle, or God will fling you down before the enemy, for God has power to help or to overthrow.'
  - where: thread
    claim: 'Rehoboam''s refusal to hear was of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/10?lang=eng'
    quote: 'for the cause was of God'
  - where: 'note 25:16 “Counsel refused, counsel taken”'
    claim: 'yāʿaṣ means to advise or counsel, and reflexively to deliberate or resolve; KJV renders it counsel, determine'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/3289.htm'
    quote: 'A primitive root; to advise; reflexively, to deliberate or resolve -- advertise, take advise, advise (well), consult, (give, take) counsel(-lor), determine, devise, guide, purpose.'
