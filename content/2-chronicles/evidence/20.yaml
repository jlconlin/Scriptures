chapter: 20
claims:
  - where: 'when'
    claim: 'Before this chapter Jehoshaphat had set judges and Levites over Judah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/19?lang=eng'
    quote: 'also the Levites shall be officers before you. Deal courageously, and the LORD shall be with the good.'
  - where: 'setting'
    claim: 'Jehoshaphat had been rebuked for helping Ahab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/19?lang=eng'
    quote: 'Shouldest thou help the ungodly, and love them that hate the LORD? therefore is wrath upon thee from before the LORD.'
  - where: 'setting'
    claim: 'Verses 1–4 have no parallel in Kings'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/20.htm'
    quote: 'Ch. 2 Chronicles 20:1-4 (no parallel in Kings). The Invasion of the Moabites and their Allies'
  - where: 'setting'
    claim: 'Verses 5–13 have no parallel in Kings'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/20.htm'
    quote: '5–13 (no parallel in Kings). The Prayer of Jehoshaphat'
  - where: 'setting'
    claim: 'Verses 14–19 have no parallel in Kings'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/20.htm'
    quote: '14–19 (no parallel in Kings). The Prophecy of Jahaziel'
  - where: 'setting'
    claim: 'Verses 20–25 have no parallel in Kings'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/20.htm'
    quote: '20–25 (no parallel in Kings). The Deliverance'
  - where: 'setting'
    claim: 'Verses 26–30 have no parallel in Kings'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/20.htm'
    quote: '26–30 (no parallel in Kings). The Sequel of the Deliverance'
  - where: 'setting'
    claim: 'Verses 31–34 correspond to 1 Kgs. 22:41–45; Chronicles leaves out Jehoshaphat''s peace with Israel'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/20.htm'
    quote: '31–34 (= 1 Kings 22:41-45). The Summary of Jehoshaphat’s Reign There are several variations of text between Kings and Chron. here; and in particular the Chronicler omits the statement that Jehoshaphat made peace with Israel.'
  - where: 'setting'
    claim: 'Verses 35–37 tell the ships quite differently from Kings'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/20.htm'
    quote: '35–37 (cp. 1 Kings 22:48-49). The Destruction of Jehoshaphat’s Fleet The Chronicler gives an account of this incident quite different from that given in Kings.'
  - where: 'setting'
    claim: 'Scripture Helps sums up: when other nations attacked Judah under Jehoshaphat, the Lord fought their battles'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'When other nations attacked Judah during Jehoshaphat’s rule, the Lord fought their battles.'
  - where: 'setting'
    claim: 'Come, Follow Me takes its lesson title from verse 12'
    key: cfm-ot-2026-30
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/30?lang=eng'
    quote: 'July 20–26. “Our Eyes Are upon Thee”: 2 Chronicles 14–20; 26; 30'
  - where: 'setting'
    claim: 'President Hinckley took verse 20 as the text of a general conference talk in April 1992'
    key: hinckley-believe-his-prophets-1992
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1992/04/believe-his-prophets?lang=eng'
    quote: 'These are the words of my text. I repeat them: “Believe in the Lord your God, so shall ye be established; believe his prophets, so shall ye prosper.”'
  - where: 'thread'
    claim: 'The LORD''s answer to Solomon asked His people to seek His face'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/7?lang=eng'
    quote: 'If my people, which are called by my name, shall humble themselves, and pray, and seek my face, and turn from their wicked ways'
  - where: 'thread'
    claim: 'Jehoshaphat asked the Lord to honor the blessings Solomon prayed for'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'Jehoshaphat asked the Lord to honor the blessings Solomon had prayed for.'
  - where: 'thread'
    claim: 'Ahaziah was the son of Ahab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/22?lang=eng'
    quote: 'Then said Ahaziah the son of Ahab unto Jehoshaphat, Let my servants go with thy servants in the ships. But Jehoshaphat would not.'
  - where: 'section 1 plain'
    claim: 'The sea of verse 2 is the Dead Sea'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/20.htm'
    quote: '"Against thee there cometh a great multitude from beyond the (Dead) sea."'
  - where: 'section 3 plain'
    claim: '“Cliff” is literally “ascent”; “brook” may be “valley”; “salvation” may be “deliverance”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/20?lang=eng'
    quote: '16a “cliff”: HEB ascent.'
  - where: 'section 3 plain'
    claim: '“Salvation” in verse 17 may be rendered “deliverance”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/20?lang=eng'
    quote: '“salvation”: OR deliverance.'
  - where: 'section 4 plain'
    claim: '“Praise” in the refrain may be rendered “give thanks”'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/20.htm'
    quote: 'Praise] R.V. Give thanks; cp. 1 Chronicles 16:41.'
  - where: 'section 4 plain'
    claim: 'The beauty of holiness is holy adornment, in public worship'
    key: bdb
    url: 'https://biblehub.com/hebrew/1927.htm'
    quote: 'holy adornment (ChePsalm), always in connection with public worship of ׳י 1 Chronicles 16:29; 2Chronicles 20:21'
  - where: 'section 4 plain'
    claim: 'The ambushments are liers in wait'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/20.htm'
    quote: 'מארבים denotes liers in wait, men hidden in ambush and lying in wait (Judges 9:25).'
  - where: 'section 4 plain'
    claim: 'Berachah means Blessing'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/20?lang=eng'
    quote: '26a “Berachah”: IE Blessing.'
  - where: 'section 5 plain'
    claim: '“Prepared their hearts” may be rendered “set their hearts”'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/20.htm'
    quote: 'for as yet the people had not prepared their hearts] R.V. neither as yet had the people set their hearts; cp. 2 Chronicles 12:14.'
  - where: 'section 5 plain'
    claim: '“Who is mentioned” is better “which is inserted”'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/20.htm'
    quote: 'who is mentioned] R.V. which is inserted. Chronicles of particular reigns were joined together to form one continuous Chronicle.'
  - where: 'section 6 plain'
    claim: 'Eliezer''s “hath broken” is a prophetic perfect: the LORD will break'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/20.htm'
    quote: 'The perfect פּרץ is prophetic: Jahve will rend thy work asunder.'

  - where: 'note 20:1 “Ammon’s allies, and where they came from”'
    claim: 'The Hebrew of verse 1 reads “of the Ammonites”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'מֵֽ/הָ/עַמּוֹנִ֛ים'
  - where: 'note 20:1 “Ammon’s allies, and where they came from”'
    claim: 'The Septuagint reads “some of the Minaeans”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_chronicles/20.htm'
    quote: 'And after this came the children of Moab, and the children of Ammon, and with them some of the Minaeans, against Josaphat to battle.'
  - where: 'note 20:1 “Ammon’s allies, and where they came from”'
    claim: 'The Septuagint also reads “from Syria” in verse 2'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_chronicles/20.htm'
    quote: 'There is come against thee a great multitude from Syria, from beyond the sea'
  - where: 'note 20:1 “Ammon’s allies, and where they came from”'
    claim: 'Render “some of the Meunim”, an Arabian people; compare 2 Chr. 26:7; 1 Chr. 4:41'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/20.htm'
    quote: '1. other beside the Ammonites] Render, some of the Meunim (2 Chronicles 26:7; 1 Chronicles 4:41, R.V.). In all three places LXX. has Μειναῖοι (Μιναῖοι). They were an Arabian people'
  - where: 'note 20:1 “Ammon’s allies, and where they came from”'
    claim: 'An older reading changes the word to Maonites, whose center was Maan near Petra, on Mount Seir'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/20.htm'
    quote: 'the change of מהעמונים into מהמּעוּנים, Maunites or Maonites, - a tribe whose headquarters were the city Maan in the neighbourhood of Petra, to the east of the Wady Musa'
  - where: 'note 20:1 “Ammon’s allies, and where they came from”'
    claim: 'Verses 10 and 22 name the inhabitants of Mount Seir, where the Edomites dwelt'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/20.htm'
    quote: 'inhabitants of Mount Seir are named as enemies who had invaded Judah. Now the Edomites dwelt on Mount Seir'
  - where: 'note 20:1 “Ammon’s allies, and where they came from”'
    claim: 'The Hebrew of verse 2 reads “from Aram”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'מֵ/אֲרָ֑ם'
  - where: 'note 20:1 “Ammon’s allies, and where they came from”'
    claim: '“From Syria” makes no sense in the story; read “from Edom”; En-gedi is midway along the west coast of the Dead Sea'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/20.htm'
    quote: 'מארם also has no suitable sense here, since in the whole narrative nothing is said of enemies coming out of Syria; we should read מאדם with Calmet and others.'
  - where: 'note 20:1 “Ammon’s allies, and where they came from”'
    claim: '“From Edom” is an easy correction; at En-gedi a pass leads up into Judah'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/20.htm'
    quote: 'From Edom is an easy correction.'
  - where: 'note 20:1 “Ammon’s allies, and where they came from”'
    claim: 'En-gedi lies on the west shore of the Dead Sea where a pass climbs into Judah'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/20.htm'
    quote: 'En-gedi is on the west coast of the Dead Sea at a point where a rugged pass leads up into the hill-country of Judah.'

  - where: 'note 20:5 “The new court”'
    claim: 'One reading: the outer court Solomon built, called new because restored or extended under Jehoshaphat or Asa; the king stood at the entrance to the priests'' court facing the people'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/20.htm'
    quote: 'The new court is the outer or great court of the temple, which Solomon had built (2 Chronicles 4:9). It is here called the new court, probably because it had been restored or extended under Jehoshaphat or Asa.'
  - where: 'note 20:5 “The new court”'
    claim: 'The congregation stood opposite the king'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/20.htm'
    quote: 'Jehoshaphat placed himself before it, i.e., at the entrance into the court of the priests, so that the congregation stood opposite to him.'
  - where: 'note 20:5 “The new court”'
    claim: 'Another: hard to tell which court; the Hebrew word differs from the one for the great court and for the court of Solomon''s prayer'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/20.htm'
    quote: 'it is difficult to tell of what court the Chronicler is thinking in this passage. The Heb. word for “court” here is ḥâçer, but in 2 Chronicles 4:9 (see note there) the “court (ḥâççr) of the priests” is distinguished from a court called the “great court”'
  - where: 'note 20:5 “The new court”'
    claim: 'Solomon''s prayer was offered in the court (azarah); the prayer should be compared with Solomon''s'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/20.htm'
    quote: 'Solomon’s great prayer was offered according to the Chronicler (2 Chronicles 6:13) in “the court” (Heb. Azârâh).'

  - where: 'note 20:12 “A prayer that holds the LORD to His word”'
    claim: 'The LORD calls Abraham His friend'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/41?lang=eng'
    quote: 'But thou, Israel, art my servant, Jacob whom I have chosen, the seed of Abraham my friend.'
  - where: 'note 20:12 “A prayer that holds the LORD to His word”'
    claim: 'Solomon asked that when Israel went out to war and prayed toward the house, the LORD would hear and maintain their cause'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/6?lang=eng'
    quote: 'Then hear thou from the heavens their prayer and their supplication, and maintain their cause.'
  - where: 'note 20:12 “A prayer that holds the LORD to His word”'
    claim: 'The LORD promised His ears would be attentive to prayer in that place'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/7?lang=eng'
    quote: 'Now mine eyes shall be open, and mine ears attent unto the prayer that is made in this place.'
  - where: 'note 20:12 “A prayer that holds the LORD to His word”'
    claim: 'Solomon prayed for blessings in time of need, including protection from enemies; Jehoshaphat asked the Lord to honor them'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'When Solomon dedicated the temple in Jerusalem, he prayed for the people to receive the Lord’s blessings in their times of need, including protection from their enemies.'
  - where: 'note 20:12 “A prayer that holds the LORD to His word”'
    claim: 'Israel was forbidden to take the lands of Esau and of Lot (Moab and Ammon)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/2?lang=eng'
    quote: 'Meddle not with them; for I will not give you of their land, no, not so much as a foot breadth; because I have given mount Seir unto Esau for a possession.'
  - where: 'note 20:12 “A prayer that holds the LORD to His word”'
    claim: 'The Lord answered by miraculously delivering them'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'The Lord answered the prayers of Jehoshaphat and his people, miraculously delivering them from their enemies.'
  - where: 'note 20:14 “A singer who prophesied”'
    claim: 'David set apart the sons of Asaph, Heman and Jeduthun to prophesy with instruments'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/25?lang=eng'
    quote: 'separated to the service of the sons of Asaph, and of Heman, and of Jeduthun, who should prophesy with harps, with psalteries, and with cymbals'

  - where: 'note 20:17 “Stand still, and see”'
    claim: 'Moses at the Red Sea told Israel to stand still and see the salvation of the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/14?lang=eng'
    quote: 'Fear ye not, stand still, and see the salvation of the LORD, which he will shew to you to day'
  - where: 'note 20:17 “Stand still, and see”'
    claim: 'David told Goliath the battle is the LORD''s'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/17?lang=eng'
    quote: 'the LORD saveth not with sword and spear: for the battle is the LORD’s, and he will give you into our hands.'
  - where: 'note 20:17 “Stand still, and see”'
    claim: '“Salvation” here may be rendered “deliverance”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/20?lang=eng'
    quote: '“salvation”: OR deliverance.'

  - where: 'note 20:20 “Believe, and be made firm”'
    claim: 'The two verbs are forms of one Hebrew verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'הַאֲמִ֜ינוּ'
  - where: 'note 20:20 “Believe, and be made firm”'
    claim: '“Believe” and “be established” are two voices of the same verb, a play on words, as in Isa. 7:9'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/20.htm'
    quote: 'Cp. Isaiah 7:9, “If ye will not believe, surely ye shall not be established.” In both places there is a play on the words In the Heb.; “believe” and “be established” representing two voices of the same verb.'

  - where: 'note 20:20 “Believe his prophets”'
    claim: 'The king relied on the words of the prophet'
    key: hinckley-believe-his-prophets-1992
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1992/04/believe-his-prophets?lang=eng'
    quote: 'Then the king, relying upon the words of the prophet, said to the people'
  - where: 'note 20:20 “Believe his prophets”'
    claim: 'President Hinckley took the verse as his text'
    key: hinckley-believe-his-prophets-1992
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1992/04/believe-his-prophets?lang=eng'
    quote: 'These are the words of my text.'
  - where: 'note 20:20 “Believe his prophets”'
    claim: 'He testified of Joseph Smith as the prophet of this dispensation'
    key: hinckley-believe-his-prophets-1992
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1992/04/believe-his-prophets?lang=eng'
    quote: 'he was a prophet called and ordained to stand as God’s instrument in this great work of restoration.'
  - where: 'note 20:20 “Believe his prophets”'
    claim: 'His plea for loyalty to the prophet'
    key: hinckley-believe-his-prophets-1992
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1992/04/believe-his-prophets?lang=eng'
    quote: 'I plead for loyalty to him whom the Lord has called and anointed. I plead for steadfastness in upholding him and giving attention to his teachings.'

  - where: 'note 20:21 “Singers before the army”'
    claim: 'The same refrain was sung when the cloud filled the house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/5?lang=eng'
    quote: 'For he is good; for his mercy endureth for ever'
  - where: 'note 20:21 “Singers before the army”'
    claim: 'The beauty of holiness is holy adornment, used of public worship'
    key: bdb
    url: 'https://biblehub.com/hebrew/1927.htm'
    quote: 'holy adornment (ChePsalm), always in connection with public worship of ׳י 1 Chronicles 16:29; 2Chronicles 20:21'

  - where: 'note 20:22 “Who lay in ambush?”'
    claim: 'Who the liers in wait were cannot be known; some older commentators thought angels; this commentary doubts it'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/20.htm'
    quote: 'Who are here meant cannot be ascertained with certainty. Some of the older commentators, Ew. and Berth., think it refers to powers, angels sent by God'
  - where: 'note 20:22 “Who lay in ambush?”'
    claim: 'Heavenly intervention is described differently elsewhere (2 Kgs. 6:17; 19:35)'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/20.htm'
    quote: 'But the passages where the interposition of heavenly powers is spoken of are different (cf. 2 Kings 6:17; 2 Kings 19:35), and it is not probable that heavenly powers would be called מארבים.'
  - where: 'note 20:22 “Who lay in ambush?”'
    claim: 'Another reading: the LORD suggested an ambush to Jehoshaphat, as at Ai; the country suits a surprise attack'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/20.htm'
    quote: 'All that is meant by this is that the Lord suggested to Jehoshaphat the plan of setting an ambush; cp. Joshua 8:2 (where it is said that the Lord suggested the same plan to Joshua).'
  - where: 'note 20:22 “Who lay in ambush?”'
    claim: 'The country between En-gedi and Tekoa suits a surprise attack'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/20.htm'
    quote: 'the country between En-gedi and Tekoa is well suited for attack by surprise.'
  - where: 'note 20:22 “Who lay in ambush?”'
    claim: 'The LORD told Joshua to lay an ambush at Ai'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/8?lang=eng'
    quote: 'lay thee an ambush for the city behind it.'
  - where: 'note 20:22 “Who lay in ambush?”'
    claim: 'The ambush cannot have been Judah''s; probably Seirites greedy for spoil; compare Gideon''s battle, Judg. 7:22'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/20.htm'
    quote: 'Probably it was liers in wait of the Seirites, greedy of spoil, who from an ambush made an attack upon the Ammonites and Moabites, and by the divine leading put the attacked in such fear and confusion'
  - where: 'note 20:22 “Who lay in ambush?”'
    claim: 'Keil compares the Midianites in Judg. 7:22'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/20.htm'
    quote: 'just as, in Judges 7:22., the Midianites were, under divine influence, so terrified by the unexpected attack of the small band led by Gideon, that they turned their swords against and mutually destroyed each other.'
  - where: 'note 20:22 “Who lay in ambush?”'
    claim: 'The margin gives “smote one another” for “were smitten”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/20?lang=eng'
    quote: '22a “were smitten”: OR smote one another.'
  - where: 'note 20:22 “Who lay in ambush?”'
    claim: 'At Gideon''s battle the LORD set every man''s sword against his fellow'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/7?lang=eng'
    quote: 'the LORD set every man’s sword against his fellow, even throughout all the host'

  - where: 'note 20:33 “Hearts not yet prepared”'
    claim: 'Kings says the people still sacrificed at the high places'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/22?lang=eng'
    quote: 'nevertheless the high places were not taken away; for the people offered and burnt incense yet in the high places.'
  - where: 'note 20:33 “Hearts not yet prepared”'
    claim: 'Jehu said Jehoshaphat had prepared his heart to seek God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/19?lang=eng'
    quote: 'Nevertheless there are good things found in thee, in that thou hast taken away the groves out of the land, and hast prepared thine heart to seek God.'
  - where: 'note 20:33 “Hearts not yet prepared”'
