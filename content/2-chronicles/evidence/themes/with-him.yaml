    quote: 'for they fell to him out of Israel in abundance, when they saw that the Lord his God was with him.'
  - where: 'section “While ye be with him”'
    claim: 'Most “with him/you/us” in 2 Chronicles is everyday: node scripts/occurrences.mjs 2-chronicles "with him" "with you" "with us" "with me" "with thee" prints 43 verses, 52 occurrences, mostly a congregation or troops with a king (e.g. 1:3)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/1?lang=eng'
    quote: 'So Solomon, and all the congregation with him, went to the high place that was at Gibeon'
  - where: 'section “While ye be with him”'
    claim: 'Every statement in 2 Chronicles that God or the LORD is “with” someone uses ʿim (H5973); ʾēt (H854) occurs 19 times in 15 verses and never in a statement that God is with someone; its one use of God dwelling with men is Solomon’s question at 6:18 (node scripts/occurrences.mjs 2-chronicles --hebrew H854)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'אִתָּ/ם֙'
