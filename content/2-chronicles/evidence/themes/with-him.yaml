  - where: 'section “Who is there among you of all his people?”'
    claim: 'In the Hebrew order Chronicles is last, so 36:23 is the last words of the Old Testament'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/36.htm'
    quote: 'Since Chronicles is the last book of the Old Testament (according to the Hebrew order), these words are to be reckoned the last words of the Old Testament.'
  - where: 'section “Who is there among you of all his people?”'
    claim: 'Connection made by this page: the terms of 15:2 do not end in forsaking (15:4; 21:7); the word of Jeremiah that 36:22 says was being accomplished orders the LORD’s visit and the return first (Jer. 29:10) and the calling, seeking and finding after (Jer. 29:12–14), where “I will be found of you” is Azariah’s “he will be found of you” in the LORD’s own voice; so the wish of 36:23, at the LORD’s stirring and over anyone of the people, is mercy that moves first, the same order as the sign given to Ahaz unasked, and the terms stand. The page does not say the exiles had repented or that the judgment of 36:16 was softened.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: 'the Lord stirred up the spirit of Cyrus king of Persia'
