page: with-him
claims:
  - where: 'opening'
    claim: '2 Chr. 1:1 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/1?lang=eng'
    quote: 'And Solomon the son of David was strengthened in his kingdom, and the Lord his God was with him, and magnified him exceedingly.'
  - where: 'opening'
    claim: '2 Chr. 36:23 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: 'Who is there among you of all his people? The Lord his God be with him, and let him go up.'
  - where: 'opening'
    claim: '2 Chr. 1:1 has wa-YHWH ʾĕlōhāyw ʿimmô with no verb (words 7–9; node scripts/hebrew.mjs "2 Chronicles" 1:1); 36:23 has YHWH ʾĕlōhāyw ʿimmô with no verb (words 27–29; node scripts/hebrew.mjs "2 Chronicles" 36:23): the same three words'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'עִמּ֖/וֹ'
  - where: 'opening'
    claim: 'The same three words stand at 2 Chr. 15:9, of Asa (words 18–20, kî-YHWH ʾĕlōhāyw ʿimmô; node scripts/hebrew.mjs "2 Chronicles" 15:9), seven verses after 15:2'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'עִמּֽ/וֹ'
  - where: 'opening'
    claim: 'Connection made by this page: 1:1, 15:2 (with 15:9), 32:8 and 36:23 are one line: the presence stated of David’s son, the terms on which it is kept, its confession under siege, and its return as a wish over a people who had lost it. No source found in the Church’s materials and Latter-day Saint scholarship searched joins 1:1, 15:2 and 36:23 or reads the book’s last wish as answered in Immanuel (Combs ties Hezekiah’s reign and 2 Chr. 32 to Isaiah’s Immanuel, not 36:23).'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/15?lang=eng'
    quote: 'The Lord is with you, while ye be with him'
  - where: 'opening'
    claim: 'Connection made by this page: the open wish of 36:23 is answered in Jesus Christ, Immanuel, in whom the LORD did not wait for His people to be with Him but came to be with them and save them from their sins; the terms of 15:2 stand, and what changes is who moves first.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/1?lang=eng'
    quote: 'they shall call his name Emmanuel, which being interpreted is, God with us.'
  - where: 'opening'
    claim: 'Combs: God is “with” David’s house, and the name Immanuel is appropriate to it'
    key: rsc-combs-ahaz-sign
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/king-ahazs-sign-christ-jesus'
    quote: 'The name is appropriate since the house of David is often described in terms of its special relationship with God—God is “with” David’s house'
  - where: 'opening'
    claim: 'Combs: Matthew concludes his Gospel as he began it, “God with us” (1:23) and “I am with you alway” (28:20)'
    key: rsc-combs-ahaz-sign
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/king-ahazs-sign-christ-jesus'
    quote: 'Matthew demonstrates the eternality of Jesus’s Davidic reign by concluding his Gospel the same way he began it.'
