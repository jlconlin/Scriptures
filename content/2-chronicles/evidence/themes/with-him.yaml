  - where: 'section “With us is the LORD our God”'
    claim: 'Combs: under Ahaz’s son Hezekiah Judah was invaded by Assyria (2 Chr. 32)'
    key: rsc-combs-ahaz-sign
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/king-ahazs-sign-christ-jesus'
    quote: 'And under the reign of King Ahaz’s son Hezekiah, the land of Judah was indeed invaded by Assyria (see Isaiah 36–37, 2 Kings 18–19, and 2 Chronicles 32).'
  - where: 'section “With us is the LORD our God”'
    claim: 'Combs: there are good reasons to think Isaiah’s Immanuel was Hezekiah (the sign for Ahaz and the house of David)'
    key: rsc-combs-ahaz-sign
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/king-ahazs-sign-christ-jesus'
    quote: 'There are good reasons to think that Immanuel referred to a particular son of King Ahaz, the future king, Hezekiah.'
  - where: 'section “With us is the LORD our God”'
    claim: 'Combs: 2 Kings says of Hezekiah “the Lord was with him” (18:7)'
    key: rsc-combs-ahaz-sign
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/king-ahazs-sign-christ-jesus'
    quote: 'the author of 2 Kings praises Hezekiah, King Ahaz’s son, when he ascends to the throne by writing that “the Lord was with him” (18:7).'
  - where: 'section “With us is the LORD our God”'
    claim: '2 Kgs. 18:7 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/18?lang=eng'
    quote: 'And the Lord was with him'
  - where: 'section “With us is the LORD our God”'
    claim: 'Combs: Isa. 8:8 states that the Kingdom of Judah belongs to Immanuel, and Judah was invaded under Hezekiah'
    key: rsc-combs-ahaz-sign
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/king-ahazs-sign-christ-jesus'
    quote: 'In fact, Isaiah 8:8 states explicitly that the Kingdom of Judah belongs to Immanuel.'
  - where: 'section “With us is the LORD our God”'
    claim: 'Combs: who Immanuel was in Isaiah’s day cannot be settled'
    key: rsc-combs-ahaz-sign
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/king-ahazs-sign-christ-jesus'
    quote: 'Ultimately, no definitive conclusion can be reached regarding the precise identity of Immanuel in the time of Isaiah.'
  - where: 'section “With us is the LORD our God”'
    claim: 'Connection made by this page: Hezekiah’s “with us is the LORD our God” (32:8) is the confidence of Isa. 8:8–10 on a king’s lips in the Assyrian invasion Isaiah spoke of; Hezekiah does not say the name Immanuel or quote Isaiah, and the page does not make him that child. The Immanuel sign given to Ahaz, who had not been with the LORD and would not ask (Isa. 7:12–14), shows the order later seen at 36:22–23.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/32?lang=eng'
