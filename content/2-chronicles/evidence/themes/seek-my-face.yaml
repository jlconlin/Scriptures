page: seek-my-face
claims:
  - where: 'opening'
    claim: '2 Chr. 7:14 as quoted: the promise to Solomon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/7?lang=eng'
    quote: 'If my people, which are called by my name, shall humble themselves, and pray, and seek my face, and turn from their wicked ways; then will I hear from heaven, and will forgive their sin, and will heal their land.'
  - where: 'opening'
    claim: 'The root rpʾ occurs six times in 2 Chronicles: the verb H7495 at 7:14, 16:12, 22:6, 30:20 and the noun H4832 at 21:18, 36:16 (occurrences.mjs 2-chronicles --hebrew 7495: 4 in 4 verses; --hebrew 4832: 2 in 2 verses); only at 30:20 is the LORD said to heal (7:14 is a promise)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'וַ/יִּרְפָּ֖א'
  - where: 'opening'
    claim: '2 Chr. 30:20 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/30?lang=eng'
    quote: 'And the Lord hearkened to Hezekiah, and healed the people.'
  - where: 'opening'
    claim: '2 Chr. 30:18 “The good LORD pardon” is yĕkappēr (H3722, piel), the verb of 29:24 “to make an atonement” (hebrew.mjs 2-chronicles 30:18, 29:24)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'יְכַפֵּ֥ר'
  - where: 'opening'
    claim: 'The root rpʾ (H7495 verb, H4832 noun) does not occur in 1 Chronicles (occurrences.mjs 1-chronicles --hebrew 7495 and --hebrew 4832: “Total: 0 occurrences in 0 verses”; KJV heal/healed/healing: 0); its uses are in 2 Chronicles'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'וַ/יִּרְפָּ֖א'
  - where: 'opening'
    claim: 'kipper with God as subject (2 Chr. 30:18 listed): “cover, i.e. treat as covered, view propitiously”'
    key: bdb
    url: 'https://biblehub.com/hebrew/3722.htm'
    quote: 'with God as subject, with accusative of person, cover, i.e. treat as covered, view propitiously'
  - where: 'opening'
    claim: 'With God as subject, kipper means God Himself provides an atonement or covering that men could not provide'
    key: bdb
    url: 'https://biblehub.com/hebrew/3722.htm'
    quote: 'It is conceived that God in his sovereignty may himself provide an atonement or covering for men and their sins which could not be provided by men.'
  - where: 'opening'
    claim: '2 Chr. 36:16 as quoted: “no remedy”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: 'till there was no remedy'
  - where: 'opening'
    claim: 'Connection made by this page: Hezekiah’s Passover (30:18–20), the one place in Chronicles where the LORD is said to heal, shows where the healing promised in 7:14 comes from: not from the seeking, which is asked and given, but from the LORD who provides the atonement, whom scripture names as Jesus Christ, with whose stripes we are healed (Isa. 53:5).'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/30?lang=eng'
    quote: 'The good Lord pardon every one'
  - where: 'opening'
    claim: 'Davis: the mercy shown Hezekiah and the celebrants of that Passover is of a piece with the way Jesus healed on the Sabbath'
    key: davis-bended-rules
    url: 'https://mi.byu.edu/old-testament-reflections/on-bended-rules'
    quote: 'the grace and mercy with which he treats Hezekiah and the celebrants of that unorthodox Passover is of a piece with the way Jesus healed on the Sabbath'
  - where: 'opening'
    claim: 'The Topical Guide entry “Heal, Healing” lists 2 Chr. 30:20, Isa. 53:5 and Mal. 4:2'
    key: tg-heal
    url: 'https://www.churchofjesuschrist.org/study/scriptures/tg/heal?lang=eng'
    quote: 'Lord hearkened … and healed the people, 2 Chr. 30:20.'
  - where: 'opening'
    claim: 'The Topical Guide entry lists “with his stripes we are healed”'
    key: tg-heal
    url: 'https://www.churchofjesuschrist.org/study/scriptures/tg/heal?lang=eng'
    quote: 'with his stripes we are healed, Isa. 53:5'
  - where: 'opening'
    claim: 'The Topical Guide entry lists the Sun of righteousness with healing in his wings'
    key: tg-heal
    url: 'https://www.churchofjesuschrist.org/study/scriptures/tg/heal?lang=eng'
    quote: 'Sun of righteousness arise with healing in his wings, Mal. 4:2.'
  - where: 'opening'
    claim: 'No Church or Latter-day Saint source found that reads 7:14, 30:18–20 and 36:16 as one sequence or ties them to Christ as healer (searched: Scripture Helps, Come, Follow Me 2026, seminary lesson 106, KnoWhys, RSC full text, BYU Studies and Interpreter by title, the Topical Guide; dossier “Things I looked for and did not find”). The nearest are Davis and the Topical Guide, cited.'
    key: davis-bended-rules
    url: 'https://mi.byu.edu/old-testament-reflections/on-bended-rules'
    quote: 'is of a piece with the way Jesus healed on the Sabbath'
