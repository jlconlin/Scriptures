chapter: 8
claims:
  - where: 'when'
    claim: 'The chapter is set at the end of the twenty years of building'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/8?lang=eng'
    quote: 'And it came to pass at the end of twenty years, wherein Solomon had built the house of the LORD, and his own house,'
  - where: 'setting'
    claim: 'Kings and Chronicles give these undertakings in the same order and the same brief way, each with details the other lacks; one older reading takes them as supplementary extracts from a fuller account'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/8.htm'
    quote: 'All these undertakings are recounted in the same order and in the same aphoristic way in 1 Kings 9:10-28, but with the addition of various notes, which are not found in our narrative; … we have merely short and mutually supplementary extracts from a more elaborate description'
  - where: 'setting'
    claim: 'Kings has 420 talents of gold from Ophir'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/9?lang=eng'
    quote: 'And they came to Ophir, and fetched from thence gold, four hundred and twenty talents, and brought it to king Solomon.'
  - where: 'setting'
    claim: 'Kings has one verse on Solomon''s offerings, three times a year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/9?lang=eng'
    quote: 'And three times in a year did Solomon offer burnt offerings and peace offerings upon the altar which he built unto the LORD, and he burnt incense upon the altar that was before the LORD. So he finished the house.'
  - where: 'thread'
    claim: 'Verses 12–16 are in the main an expansion of 1 Kgs. 9:25'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/8.htm'
    quote: 'This paragraph is in the main an expansion of 1 Kings 9:25.'
  - where: 'thread'
    claim: 'Chronicles dwells on the religious side of the history and the progress of temple worship'
    key: bd-chronicles
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/chronicles?lang=eng'
    quote: 'the writers dwell with most satisfaction upon the ecclesiastical and religious aspects of the history, and the progress of temple worship in Jerusalem.'
  - where: 'thread'
    claim: 'The building work was finished in chapter 5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/5?lang=eng'
    quote: 'Thus all the work that Solomon made for the house of the LORD was finished'
  - where: 'thread'
    claim: 'One older reading: the house was perfect only when regular worship under the law of Moses and David''s arrangements had begun'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/8.htm'
    quote: 'Only when the regular worship according to the law of Moses, and with the arrangements as to the service of the priests and Levites established by David, had been commenced, was Solomon''s work in connection with the temple completed'
  - where: 'section 1 plain'
    claim: 'The Hebrew of verse 2 says the cities were given, not restored'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'נָתַ֤ן'
  - where: 'section 2 plain'
    claim: '“Pay tribute” means provide labor; “My wife” is in Hebrew “No wife of mine”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/8?lang=eng'
    quote: '8a “pay tribute”: IE provide labor. … 11a “My”: HEB No wife of mine shall dwell.'
  - where: 'section 3 plain'
    claim: '“Perfected” means completed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/8?lang=eng'
    quote: '16b “perfected”: IE completed.'

  - where: 'note 8:2 “Cities given, by Huram or to him”'
    claim: 'In Kings Solomon gave Hiram cities, which did not please him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/9?lang=eng'
    quote: 'And Hiram came out from Tyre to see the cities which Solomon had given him; and they pleased him not.'
  - where: 'note 8:2 “Cities given, by Huram or to him”'
    claim: 'The Hebrew verb in 2 Chr. 8:2 is nātan, “give”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'נָתַ֤ן'
  - where: 'note 8:2 “Cities given, by Huram or to him”'
    claim: 'The Septuagint reads “given”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_chronicles/8.htm'
    quote: '2that Solomon rebuilt the cities which Chiram had given to Solomon, and caused the children of Israel to dwell in them.'

  - where: 'note 8:3 “Hamath-zobah and Tadmor”'
    claim: 'Kings'' parallel list goes straight to the cities built'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/9?lang=eng'
    quote: 'And Solomon built Gezer, and Beth-horon the nether,'
  - where: 'note 8:3 “Hamath-zobah and Tadmor”'
    claim: 'David struck Hadarezer of Zobah unto Hamath, and Tou king of Hamath sent him gifts'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/18?lang=eng'
    quote: 'And David smote Hadarezer king of Zobah unto Hamath, as he went to stablish his dominion by the river Euphrates.'
  - where: 'note 8:3 “Hamath-zobah and Tadmor”'
    claim: 'Hamath was a city of Syria on the Orontes, the northern limit of the promised land; it seems to have come under Solomon''s dominion'
    key: bd-hamath
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hamath?lang=eng'
    quote: 'An important city of Syria, in the valley of the Orontes; the “entering in of Hamath” was the northern limit of the Promised Land … The city seems to have come under the dominion of Solomon (1 Kgs. 4:21–24; 2 Chr. 8:4).'
  - where: 'note 8:3 “Hamath-zobah and Tadmor”'
    claim: 'One older reading: the campaign is omitted in Kings; Hamath-zobah is the land of Hamath bordering Zobah; the tributary kingdoms had rebelled or tried to, and Solomon fortified Tadmor (Palmyra) and the store cities to hold them; Rezon of Zobah was his enemy'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/8.htm'
    quote: 'these tributary kingdoms had either rebelled against Solomon, or at least had made attempts to do so; which Solomon suppressed, and in order to establish his dominion over them fortified Tadmor, i.e., Palmyra, and all the store cities in the land of Hamath'
  - where: 'note 8:3 “Hamath-zobah and Tadmor”'
    claim: 'Rezon of Zobah was an adversary to Israel all Solomon''s days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: 'And he was an adversary to Israel all the days of Solomon, beside the mischief that Hadad did: and he abhorred Israel, and reigned over Syria.'
  - where: 'note 8:3 “Hamath-zobah and Tadmor”'
    claim: 'Another older reading: perhaps a southern namesake of Hamath; the “man of rest” was not wholly free from war'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/8.htm'
    quote: 'Hamath-Zobah may be a southern namesake of the well-known Hamath the great (Amos 6:2). Though Solomon was a “man of rest” (1 Chronicles 22:9) his reign was not wholly free from war'
  - where: 'note 8:3 “Hamath-zobah and Tadmor”'
    claim: 'The same reading doubts Tadmor is Palmyra: history is silent on Palmyra until 34 B.C.; Kings has Tamar as written, with Tadmor as the margin; Solomon''s city was probably a Tamar in the south'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/8.htm'
    quote: 'Palmyra … a city on an oasis N.E. of Damascus half way between Damascus and the Euphrates. Apart from this passage of Chron. it first appears in history in b.c. 34 … The city built by Solomon was probably a Tamar in the south'
  - where: 'note 8:3 “Hamath-zobah and Tadmor”'
    claim: 'The written text (ketiv) of 1 Kgs. 9:18 is Tamar'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'תמר'
  - where: 'note 8:3 “Hamath-zobah and Tadmor”'
    claim: 'The reading (qere) of 1 Kgs. 9:18 is Tadmor'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'תַּדְמֹ֥ר'

  - where: 'note 8:10 “Two hundred and fifty officers, or five hundred and fifty”'
    claim: 'Kings has 550 chief officers and 3,300 overseers; Chronicles 3,600 overseers'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/9?lang=eng'
    quote: 'These were the chief of the officers that were over Solomon’s work, five hundred and fifty, which bare rule over the people that wrought in the work.'
  - where: 'note 8:10 “Two hundred and fifty officers, or five hundred and fifty”'
    claim: 'Kings counts 3,300 overseers'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/5?lang=eng'
    quote: 'Beside the chief of Solomon’s officers which were over the work, three thousand and three hundred, which ruled over the people that wrought in the work.'
  - where: 'note 8:10 “Two hundred and fifty officers, or five hundred and fifty”'
    claim: 'Chronicles counts 3,600 overseers'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/2?lang=eng'
    quote: 'three thousand and six hundred overseers to set the people a work.'
  - where: 'note 8:10 “Two hundred and fifty officers, or five hundred and fifty”'
    claim: 'One older reading: the total of overseers of all kinds is 3,850 in both books'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/8.htm'
    quote: 'the under-overseers are reckoned at three thousand six hundred in 2 Chronicles 2:18 as against three thousand three hundred in 1 Kings 5:16. The total number therefore of overseers of all kinds is given both in 1 Kin. and 2 Chr. as 3850.'
  - where: 'note 8:10 “Two hundred and fifty officers, or five hundred and fifty”'
    claim: 'Another older reading: the 250 were Israelites; the 550 of Kings include Israelite and Canaanite officers'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/8.htm'
    quote: 'These overseers were Israelites, while in the number 550 (1 Kings 9:23) the Israelite and Canaanite upper overseers are both included'

  - where: 'note 8:11 “Why Pharaoh''s daughter moved”'
    claim: 'Kings dates the move without a reason; the marriage notice said she lived in the city of David until the building was done'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/9?lang=eng'
    quote: 'But Pharaoh’s daughter came up out of the city of David unto her house which Solomon had built for her: then did he build Millo.'
  - where: 'note 8:11 “Why Pharaoh''s daughter moved”'
    claim: 'The marriage is told in 1 Kgs. 3:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/3?lang=eng'
    quote: 'took Pharaoh’s daughter, and brought her into the city of David, until he had made an end of building his own house, and the house of the LORD'
  - where: 'note 8:11 “Why Pharaoh''s daughter moved”'
    claim: 'David pitched a tent for the ark in the city of David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/15?lang=eng'
    quote: 'And David made him houses in the city of David, and prepared a place for the ark of God, and pitched for it a tent.'
  - where: 'note 8:11 “Why Pharaoh''s daughter moved”'
    claim: 'Solomon brought the ark up out of the city of David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/5?lang=eng'
    quote: 'to bring up the ark of the covenant of the LORD out of the city of David, which is Zion.'
  - where: 'note 8:11 “Why Pharaoh''s daughter moved”'
    claim: 'The Septuagint reads “the place is holy”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_chronicles/8.htm'
    quote: 'My wife shall not dwell in the city of David, the king of Israel, for the place is holy into which the ark of the Lord has entered.'

  - where: 'note 8:13 “As each day required”'
    claim: 'The Hebrew reads “by the matter of a day in its day”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/2_chronicles/8-13.htm'
    quote: 'ū·ḇiḏ·ḇar- וּבִדְבַר־ and by the matter … yō·wm י֣וֹם of a day … bə·yō·wm, בְּי֗וֹם in its day'
  - where: 'note 8:13 “As each day required”'
    claim: 'The same phrase stands in verse 14, rendered “as the duty of every day required”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'לִ/דְבַר י֣וֹם בְּ/יוֹמ֔/וֹ'
  - where: 'note 8:13 “As each day required”'
    claim: 'The law of offerings in Numbers 28 gives the daily offering, then the sabbath, then the new moons'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/28?lang=eng'
    quote: 'two lambs of the first year without spot day by day, for a continual burnt offering. … And on the sabbath day two lambs … And in the beginnings of your months ye shall offer a burnt offering unto the LORD'
  - where: 'note 8:13 “As each day required”'
    claim: 'Numbers 28–29 then gives the feasts'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/29?lang=eng'
    quote: 'And on the fifteenth day of the seventh month ye shall have an holy convocation; ye shall do no servile work, and ye shall keep a feast unto the LORD seven days:'

  - where: 'note 8:14 “David the man of God”'
    claim: 'Scripture calls Moses the man of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/33?lang=eng'
    quote: 'And this is the blessing, wherewith Moses the man of God blessed the children of Israel before his death.'
  - where: 'note 8:14 “David the man of God”'
    claim: 'Prophets are called men of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/17?lang=eng'
    quote: 'Now by this I know that thou art a man of God, and that the word of the LORD in thy mouth is truth.'
  - where: 'note 8:14 “David the man of God”'
    claim: 'The pattern David had by the spirit included the courses of the priests and Levites'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/28?lang=eng'
    quote: 'And the pattern of all that he had by the spirit … Also for the courses of the priests and the Levites, and for all the work of the service of the house of the LORD'
  - where: 'note 8:14 “David the man of God”'
    claim: 'After the return the Levites praised according to the commandment of David the man of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/12?lang=eng'
    quote: 'to praise and to give thanks, according to the commandment of David the man of God, ward over against ward.'

  - where: 'note 8:16 “Perfected: complete at last”'
    claim: 'šālēm means complete; the lexicon lists it as “finished” of the temple''s stones and of the temple in 2 Chr. 8:16'
    key: bdb
    url: 'https://biblehub.com/hebrew/8003.htm'
    quote: 'I. שָׁלֵם adjective complete, safe, at peace … b. finished: stones for temple 1 Kings 6:7; temple 2Chronicles 8:16.'
  - where: 'note 8:16 “Perfected: complete at last”'
    claim: 'The word in verse 16 is šālēm'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/2_chronicles/8-16.htm'
    quote: '8003 [e] šā·lêm שָׁלֵ֖ם'
  - where: 'note 8:16 “Perfected: complete at last”'
    claim: 'The work for the house was finished in chapter 5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/5?lang=eng'
    quote: 'Thus all the work that Solomon made for the house of the LORD was finished'
  - where: 'note 8:16 “Perfected: complete at last”'
    claim: 'Kings closes the notice “So he finished the house” after the offerings'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/9?lang=eng'
    quote: 'and he burnt incense upon the altar that was before the LORD. So he finished the house.'
  - where: 'thread'
    claim: 'One older reading: the word means set thoroughly in order, not merely ended'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/8.htm'
    quote: 'for שׁלם does not signify "ended," or to be at an end, but to be set thoroughly (perfectly) in order.'

  - where: 'christ'
    claim: 'Amulek: the law of Moses pointed in every whit to the sacrifice of the Son of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/34?lang=eng'
    quote: 'this is the whole meaning of the law, every whit pointing to that great and last sacrifice; and that great and last sacrifice will be the Son of God'
  - where: 'christ'
    claim: 'Christ ended burnt offerings and asked for a broken heart and contrite spirit, promising baptism of fire and the Holy Ghost'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/9?lang=eng'
    quote: 'And ye shall offer for a sacrifice unto me a broken heart and a contrite spirit. And whoso cometh unto me with a broken heart and a contrite spirit, him will I baptize with fire and with the Holy Ghost'

  - where: 'explore'
    claim: 'Hezekiah restored the courses and the offerings for sabbaths, new moons and feasts'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/31?lang=eng'
    quote: 'the burnt offerings for the sabbaths, and for the new moons, and for the set feasts, as it is written in the law of the LORD.'
  - where: 'explore'
    claim: 'The returned exiles offered as the duty of every day required, and kept the ward according to the commandment of David and Solomon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/3?lang=eng'
    quote: 'offered the daily burnt offerings by number, according to the custom, as the duty of every day required;'
