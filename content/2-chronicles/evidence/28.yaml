chapter: 28
claims:
  - where: 'when'
    claim: 'Ahaz reigned sixteen years in Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/28?lang=eng'
    quote: 'Ahaz was twenty years old when he began to reign, and he reigned sixteen years in Jerusalem'
  - where: 'setting'
    claim: 'Ahaz made an alliance with Tiglath-pileser to repel Syria and Israel; copied a heathen altar; Isaiah''s message to him'
    key: bd-ahaz
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ahaz?lang=eng'
    quote: 'King of Judah (2 Kgs. 16; 2 Chr. 28); makes an alliance with Tiglath-pileser, king of Assyria, in order to repel an attack from Syria and Israel; copies heathen altar (2 Kgs. 16:10); Isaiah’s message to (Isa. 7)'
  - where: 'setting'
    claim: 'Verses 8–15 (the captives sent home) are not in Kings'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/28.htm'
    quote: '8–15 (not in Kings; but cp. 2 Kings 6:21-23, a similar incident). Israel sends back the Jewish Captives'
  - where: 'setting'
    claim: 'Hezekiah opened the doors of the house of the LORD in the first month of his reign'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/29?lang=eng'
    quote: 'He in the first year of his reign, in the first month, opened the doors of the house of the Lord, and repaired them.'
  - where: 'setting'
    claim: 'Ahaz not buried in the sepulchres of the kings; the footnote points to Jehoram (21:20)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/28?lang=eng'
    quote: '27a “sepulchres”: 2 Chr. 21:20; 24:25.'
  - where: 'thread'
    claim: 'The "helped him not" of v. 21 and "strengthened him not" of v. 20 answer the "help" of v. 16'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/28.htm'
    quote: 'corresponds to the לו לעזרה ולא, 2 Chronicles 28:21, and both clauses refer back to לו לעזר, 2 Chronicles 28:16.'
  - where: 'thread'
    claim: 'Seeking Assyria''s help cost tribute and trust that belonged to Jehovah'
    key: pierce-israelite-refugees
    url: 'https://rsc.byu.edu/covenant-compassion/experience-israelite-refugees'
    quote: 'Loyalty to Assyria came with a temporal price of a yearly tribute but also a spiritual price of trusting Assyria to fight their battles rather than relying on faith in Jehovah.'
  - where: 'thread'
    claim: 'Chronicles usually tells reward and punishment within the reign'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'rewards and punishments are not usually delayed in Chronicles, and people are often punished for sins or rewarded for righteousness immediately.'
  - where: 'section 4 plain'
    claim: '"Made Judah naked": showed lack of restraint (plain words: let all restraint go)'
    key: bdb
    url: 'https://biblehub.com/hebrew/6544.htm'
    quote: '2 shew lack of restraint2Chronicles 28:19.'

  - where: 'note 28:5 “Defeated in the field, spared in Jerusalem”'
    claim: 'Kings: Rezin and Pekah besieged Ahaz but could not overcome him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/16?lang=eng'
    quote: 'Then Rezin king of Syria and Pekah son of Remaliah king of Israel came up to Jerusalem to war: and they besieged Ahaz, but could not overcome him.'
  - where: 'note 28:5 “Defeated in the field, spared in Jerusalem”'
    claim: 'Kings and Chronicles agree on blessing and punishment but differ on timing; in Chronicles rewards and punishments are not usually delayed'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'Both Chronicles and the Deuteronomistic History are in broad agreement on the issue of blessings for righteousness and punishment for unrighteousness … rewards and punishments are not usually delayed in Chronicles'

  - where: 'note 28:9 “Oded, a prophet in Samaria”'
    claim: 'Oded, a prophet of the LORD, met the army that came to Samaria'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/28?lang=eng'
    quote: 'But a prophet of the Lord was there, whose name was Oded: and he went out before the host that came to Samaria'
  - where: 'note 28:9 “Oded, a prophet in Samaria”'
    claim: 'An earlier Oded is named as the father of Azariah, who prophesied to Asa'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/15?lang=eng'
    quote: 'And the Spirit of God came upon Azariah the son of Oded:'

  - where: 'note 28:10 “Brethren made bondmen”'
    claim: 'kābaš with "for bondmen" means bring into bondage; so in Jer. 34:11, 16 and Neh. 5:5'
    key: bdb
    url: 'https://biblehub.com/hebrew/3533.htm'
    quote: '1 bring into bondage, followed by accusative + לַעֲבָדִים Jeremiah 34:11,16; 2Chronicles 28:10; Nehemiah 5:5.'
  - where: 'note 28:10 “Brethren made bondmen”'
    claim: '"To keep under" in 28:10 is likbōš, from kābaš (H3533)'
    key: oshb-wlc
    url: 'https://biblehub.com/hebrew/3533.htm'
    quote: 'Infinitive כְּבוֺשׁ2Chronicles 28:10'
  - where: 'note 28:10 “Brethren made bondmen”'
    claim: 'Neh. 5:5: Jews in bondage to their fellow Jews'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/5?lang=eng'
    quote: 'Many Jews are in bondage to their fellow Jews'
  - where: 'note 28:10 “Brethren made bondmen”'
    claim: 'Jer. 34: servants set free were brought into subjection again'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/34?lang=eng'
    quote: 'But afterward they turned, and caused the servants and the handmaids, whom they had let go free, to return, and brought them into subjection for servants and for handmaids.'
  - where: 'note 28:10 “Brethren made bondmen”'
    claim: 'The footnote to "captives" (v. 11) points to D&C 101:79, which says no man should be in bondage to another'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/28?lang=eng'
    quote: '11a “captives”: 1 Ne. 17:25; Mosiah 11:21; D&C 101:79.'

  - where: 'note 28:19 “Made Judah naked”'
    claim: 'pāraʿ: to let go, let loose; Hiphil in 2 Chr. 28:19 "shew lack of restraint"'
    key: bdb
    url: 'https://biblehub.com/hebrew/6544.htm'
    quote: 'Hiph`il Perfect3masculine singular הַפְרִיעַ2Chronicles 28:19'
  - where: 'note 28:19 “Made Judah naked”'
    claim: 'In Ex. 32:25 the verb means let loose people, remove restraint'
    key: bdb
    url: 'https://biblehub.com/hebrew/6544.htm'
    quote: '1 let go, let loose, people, i.e. remove restraint from them, Exodus 32:25 (twice in verse)'
  - where: 'note 28:19 “Made Judah naked”'
    claim: '"Made Judah naked" is hiprîaʿ, H6544, in 28:19; the same verb in Ex. 32:25'
    key: oshb-wlc
    url: 'https://biblehub.com/hebrew/6544.htm'
    quote: 'KJV: avenge, avoid, bare, go back, let, (make) naked, set at nought, perish, refuse, uncover'
  - where: 'note 28:19 “Made Judah naked”'
    claim: 'The footnote to "naked" in v. 19 points to Ex. 32:25'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/28?lang=eng'
    quote: '19a “naked”: Ex. 32:25.'

  - where: 'note 28:20 “Help that did not help”'
    claim: 'Kings: the king of Assyria hearkened, took Damascus, slew Rezin'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/16?lang=eng'
    quote: 'And the king of Assyria hearkened unto him: for the king of Assyria went up against Damascus, and took it, and carried the people of it captive to Kir, and slew Rezin.'
  - where: 'note 28:20 “Help that did not help”'
    claim: '"Strengthened him not" and "helped him not" refer back to the help sought in v. 16'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/28.htm'
    quote: 'corresponds to the לו לעזרה ולא, 2 Chronicles 28:21, and both clauses refer back to לו לעזר, 2 Chronicles 28:16.'
  - where: 'note 28:20 “Help that did not help”'
    claim: 'One older reading: no conflict with Kings; Tiglath-pileser campaigned for his own power, kept the conquests, and oppressed Ahaz; 2 Kgs. 18:7 shows it'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/28.htm'
    quote: 'Tiglath-pileser not only retained the conquered territories and cities for himself, but also undertook the whole campaign, not to strengthen Ahaz, but for the extension of his own (the Assyrian) power, and so made use of it'
  - where: 'note 28:20 “Help that did not help”'
    claim: 'The oppression is placed beyond doubt by 2 Kgs. 18:7'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/28.htm'
    quote: 'This oppression is, it is true, not expressly mentioned in 2 Kings 16, but is hinted in 2 Kings 16:18, and placed beyond doubt by 2 Kings 18:7'
  - where: 'note 28:20 “Help that did not help”'
    claim: 'Ahaz was willing to initiate a vassal treaty with its loyalty oath; its temporal and spiritual price'
    key: pierce-israelite-refugees
    url: 'https://rsc.byu.edu/covenant-compassion/experience-israelite-refugees'
    quote: 'King Ahaz of Judah and his willingness to initiate a vassal treaty with the Assyrian Tiglath-pileser III, with its accompanying loyalty oath. Loyalty to Assyria came with a temporal price of a yearly tribute but also a spiritual price'
  - where: 'note 28:20 “Help that did not help”'
    claim: 'Isaiah told Ahaz to take heed, be quiet, fear not'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/7?lang=eng'
    quote: 'And say unto him, Take heed, and be quiet; fear not, neither be fainthearted for the two tails of these smoking firebrands'

  - where: 'note 28:24 “The doors shut”'
    claim: 'Hezekiah: the fathers shut the doors of the porch, put out the lamps, offered no incense or burnt offerings in the holy place'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/29?lang=eng'
    quote: 'Also they have shut up the doors of the porch, and put out the lamps, and have not burned incense nor offered burnt offerings in the holy place unto the God of Israel.'
  - where: 'note 28:24 “The doors shut”'
    claim: 'Kings: Ahaz had the morning and evening offerings burned on the great altar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/16?lang=eng'
    quote: 'Upon the great altar burn the morning burnt offering, and the evening meat offering'
  - where: 'note 28:24 “The doors shut”'
    claim: 'One older reading: the doors were those of the porch; worship in the house ceased while the court altar continued; sacrifice on a heathen-model altar was not to the God of Israel'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/28.htm'
    quote: 'By the closing of the doors of the porch the worship of Jahve in the Holy Place and the Most Holy was indeed suspended, but the worship at the altar in the court was not thereby necessarily interfered with'
  - where: 'note 28:24 “The doors shut”'
    claim: 'Sacrificing on a heathen-model altar was not sacrificing to the God of Israel'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/28.htm'
    quote: 'Sacrificing upon an altar built after a heathen model was not sacrificing to the God of Israel.'

  - where: 'christ'
    claim: 'Loyalty to Assyria carried a spiritual price as well as the temporal tribute'
    key: pierce-israelite-refugees
    url: 'https://rsc.byu.edu/covenant-compassion/experience-israelite-refugees'
    quote: 'a spiritual price of trusting Assyria to fight their battles rather than relying on faith in Jehovah.'
  - where: 'christ'
    claim: 'Isaiah 7:14, the sign of Immanuel given in the war'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/7?lang=eng'
    quote: 'Therefore the Lord himself shall give you a sign; Behold, a virgin shall conceive, and bear a son, and shall call his name Immanuel.'
