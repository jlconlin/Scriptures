chapter: 33
claims:
  - where: 'when'
    claim: 'Manasseh reigned fifty-five years; his captivity and return; Amon reigned two years'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/33?lang=eng'
    quote: 'And prayed unto him: and he was entreated of him, and heard his supplication, and brought him again to Jerusalem into his kingdom.'
  - where: 'setting'
    claim: 'Manasseh reversed Hezekiah''s reform; Josiah later began a second reform'
    key: satterfield-divine-justification
    url: 'https://scripturecentral.org/archive/books/book-chapter/divine-justification-babylonian-destruction-jerusalem'
    quote: 'However, Hezekiah’s son, Manasseh (ca. 687–642 BC), reversed his father’s reform policies (see 2 Kings 21; 2 Chronicles 33). … Some years after Manasseh’s death, his grandson, Josiah (ca. 642–609 BC), initiated a second reform'
  - where: 'setting'
    claim: 'Assyrian records of Esarhaddon and Ashurbanipal name Manasseh as a vassal; Chronicles, unlike Kings, tells of his repentance'
    key: tolley-imprisonment
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/imprisonment-jeremiah-its-historical-context'
    quote: 'Records left behind by the Assyrian rulers Esarhaddon and Ashurbanipal both indicate that Manasseh was a vassal of Assyria … In contrast to the book of Kings, Chronicles describes King Manasseh as repenting before his death (2 Chronicles 33:11–13).'
  - where: 'setting'
    claim: 'Kings has the innocent blood Manasseh shed, which Chronicles does not tell'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/21?lang=eng'
    quote: 'Moreover Manasseh shed innocent blood very much, till he had filled Jerusalem from one end to another'
  - where: 'thread'
    claim: 'The verb “humble themselves” of 7:14'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="c/3665" morph="HC/VNi3mp" id="14s9p">וְ/יִכָּנְע֨וּ</w>'
  - where: 'thread'
    claim: 'The same verb of Manasseh, 33:12'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="c/3665" morph="HC/VNw3ms" id="1414w">וַ/יִּכָּנַ֣ע</w>'
  - where: 'thread'
    claim: 'Manasseh humbled himself, prayed and was heard'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/33?lang=eng'
    quote: 'And when he was in affliction, he besought the Lord his God, and humbled himself greatly before the God of his fathers,'
  - where: 'section 1 plain'
    claim: 'groves are Asherah; observed times is soothsaying; dealt is practiced spiritualism'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/33?lang=eng'
    quote: '6b “observed times”: IE practiced soothsaying. … 6d “dealt”: IE practiced spiritualism.'
  - where: 'section 1 plain'
    claim: '“so that they will take heed” means “if only they will observe”'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/33.htm'
    quote: 'so that they will take heed] R.V. if only they will observe (as 2 Kin.).'
  - where: 'section 2 plain'
    claim: '“among the thorns” is in Hebrew “with hooks”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/33?lang=eng'
    quote: '11a “among the thorns”: HEB with hooks.'
  - where: 'section 3 plain'
    claim: 'an outer wall; he built up (rebuilt) the altar'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/33.htm'
    quote: '14. a wall without the city] R.V. an outer wall to the city. … 16. he repaired] R.V. he built up; the Hebrew word for “build” meaning also “rebuild.”'
  - where: 'section 5 plain'
    claim: '“trespassed” means became guilty'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/33.htm'
    quote: 'trespassed] Render, became guilty (so R.V. mg.)'

  - where: 'note 33:6 “The valley of the son of Hinnom”'
    claim: 'The valley lay south and west of Jerusalem, scene of the worship of Moloch; later a place of refuse; called Gehenna in New Testament times, a symbol of torment'
    key: bd-hinnom-valley-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hinnom-valley-of?lang=eng'
    quote: 'South and west of Jerusalem, it was the scene of the idolatrous worship of the fire-god Moloch (2 Chr. 28:3; 33:6; … and was afterwards used as a place of refuse (2 Kgs. 23:10–14). In New Testament times it was called Gehenna and was regarded by the Jews as symbolic of the place of torment.'
  - where: 'note 33:6 “The valley of the son of Hinnom”'
    claim: 'Kings says only “his son” and does not name the valley; Chronicles has “children” and the valley'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/21?lang=eng'
    quote: 'And he made his son pass through the fire, and observed times, and used enchantments'
  - where: 'note 33:6 “The valley of the son of Hinnom”'
    claim: 'Chronicles: his children, in the valley of the son of Hinnom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/33?lang=eng'
    quote: 'And he caused his children to pass through the fire in the valley of the son of Hinnom'

  - where: 'note 33:11 “Taken with hooks to Babylon”'
    claim: 'The Hebrew word in “among the thorns” is ḥōḥîm'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="b/2336" n="1" morph="HRd/Ncmpa" id="14g4z">בַּ/חֹחִ֑ים</w>'
  - where: 'note 33:11 “Taken with hooks to Babylon”'
    claim: 'Better rendered “with hooks”; Assyrian kings sometimes led captives by hooks in the nostrils, shown on reliefs; cp. 2 Kgs 19:28'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/33.htm'
    quote: 'better, with hooks (as R.V. mg.); cp. 2 Kings 19:28 (= Isaiah 37:29). Assyrian kings sometimes thrust a book into the nostrils of their captives and so led them about. The practice is illustrated on many Assyrian reliefs in the British Museum.'
  - where: 'note 33:11 “Taken with hooks to Babylon”'
    claim: 'The Church''s footnote reads the Hebrew as “with hooks”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/33?lang=eng'
    quote: '11a “among the thorns”: HEB with hooks.'
  - where: 'note 33:11 “Taken with hooks to Babylon”'
    claim: 'Nineveh was the capital, but Ashurbanipal at times resided in Babylon'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/33.htm'
    quote: 'Nineveh, not Babylon, was the capital of Assyria, but as Asshur-bani-pal at times resided in Babylon, there is nothing improbable in any important prisoner of his being carried thither.'
  - where: 'note 33:11 “Taken with hooks to Babylon”'
    claim: 'No Assyrian inscription then known told of the captivity; a revolt against Ashurbanipal; Neco I fettered and sent back'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/33.htm'
    quote: 'No Assyrian inscription at present known speaks of the captivity of Manasseh, but we have monumental evidence that there was a great insurrection against Asshur-bani-pal … The restoration of Manasseh after this to his kingdom is not incredible, for Neco I. of Egypt was first put in fetters and afterwards sent back to Egypt.'
  - where: 'note 33:11 “Taken with hooks to Babylon”'
    claim: 'Chronicles, unlike Kings, tells of the captivity and repentance'
    key: tolley-imprisonment
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/imprisonment-jeremiah-its-historical-context'
    quote: 'In contrast to the book of Kings, Chronicles describes King Manasseh as repenting before his death (2 Chronicles 33:11–13).'
  - where: 'note 33:11 “Taken with hooks to Babylon”'
    claim: 'Assyrian records name Manasseh as a vassal'
    key: tolley-imprisonment
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/imprisonment-jeremiah-its-historical-context'
    quote: 'Records left behind by the Assyrian rulers Esarhaddon and Ashurbanipal both indicate that Manasseh was a vassal of Assyria'
  - where: 'note 33:11 “Taken with hooks to Babylon”'
    claim: 'The LORD spoke and was not heard; then brought the Assyrians'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/33?lang=eng'
    quote: 'Wherefore the Lord brought upon them the captains of the host of the king of Assyria, which took Manasseh among the thorns, and bound him with fetters, and carried him to Babylon.'

  - where: 'note 33:12 “Heard when he humbled himself”'
    claim: 'The promise to Solomon: humble themselves, pray, then I will hear'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/7?lang=eng'
    quote: 'If my people, which are called by my name, shall humble themselves, and pray, and seek my face, and turn from their wicked ways; then will I hear from heaven'
  - where: 'note 33:12 “Heard when he humbled himself”'
    claim: 'The verb of 7:14, “humble themselves”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="c/3665" morph="HC/VNi3mp" id="14s9p">וְ/יִכָּנְע֨וּ</w>'
  - where: 'note 33:12 “Heard when he humbled himself”'
    claim: 'The same verb in 33:12'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="c/3665" morph="HC/VNw3ms" id="1414w">וַ/יִּכָּנַ֣ע</w>'
  - where: 'note 33:12 “Heard when he humbled himself”'
    claim: 'He was heard, brought back, and knew the LORD was God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/33?lang=eng'
    quote: 'And prayed unto him: and he was entreated of him, and heard his supplication, and brought him again to Jerusalem into his kingdom. Then Manasseh knew that the Lord he was God.'
  - where: 'note 33:12 “Heard when he humbled himself”'
    claim: 'Verse 19 lists his sin and trespass before he was humbled'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/33?lang=eng'
    quote: 'and all his sin, and his trespass, and the places wherein he built high places, and set up groves and graven images, before he was humbled'
  - where: 'note 33:12 “Heard when he humbled himself”'
    claim: 'Read in light of Chronicles, it is possible that Manasseh created conditions others could not overcome'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'If read in light of Chronicles, it is possible that King Manasseh may have created conditions in society that future people were not able to overcome, leading to the people continuing to sin, and their eventual destruction.'

  - where: 'note 33:17 “A reform that stopped at the high places”'
    claim: 'Later kings followed Hezekiah''s example in updating Jerusalem''s fortifications; Manasseh built a wall'
    key: seely-woods-jerusalem-destroyed
    url: 'https://scripturecentral.org/archive/books/book-chapter/how-could-jerusalem-great-city-be-destroyed'
    quote: 'The later Judahite kings followed his example and continuously updated the fortifications of the capital city. … Later, Hezekiah’s son King Manasseh “built a wall without the city of David . . . and raised it up a very great height” (2 Chronicles 33:14).'
  - where: 'note 33:17 “A reform that stopped at the high places”'
    claim: 'He took away the idols, cast the altars out of the city, rebuilt the altar, commanded Judah; the people still sacrificed on high places'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/33?lang=eng'
    quote: 'and all the altars that he had built in the mount of the house of the Lord, and in Jerusalem, and cast them out of the city.'
  - where: 'note 33:17 “A reform that stopped at the high places”'
    claim: 'Josiah beat down the altars Manasseh made in the two courts'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng'
    quote: 'and the altars which Manasseh had made in the two courts of the house of the Lord, did the king beat down'
  - where: 'note 33:17 “A reform that stopped at the high places”'
    claim: 'Verse 15 says only that he cast them out of the city, not that he destroyed them; Josiah destroyed the altars Manasseh made'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/33.htm'
    quote: 'Josiah beat down and brake the altars which Manasseh had made in both courts of the house of Jahve … In 2 Chronicles 33:15 we only find it stated that he cast these things forth from the city'
  - where: 'note 33:17 “A reform that stopped at the high places”'
    claim: 'One older reading: the facts attest restoration of temple worship, not idolatry rooted out of Judah or the people''s hearts; no word of conversion with all his heart; under Amon idolatry returned'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/33.htm'
    quote: 'merely attest the restoration of the Jahve-worship in the temple … But the idolatry in Jerusalem and Judah was not thereby extirpated … Still less was idolatry rooted out of the hearts of the people'
  - where: 'note 33:17 “A reform that stopped at the high places”'
    claim: 'The people still sacrificed on the high places, yet to the LORD'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/33.htm'
    quote: 'But the people still sacrificed on the high places, yet unto Jahve their God.'

  - where: 'note 33:19 “A prayer that was not kept”'
    claim: 'The sayings of the seers is among the lost books, mentioned as authentic and valuable but not in the Bible today'
    key: bd-lost-books
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/lost-books?lang=eng'
    quote: 'those documents that are mentioned in the Bible in such a way that it is evident they were considered authentic and valuable but that are not found in the Bible today. … sayings of the seers (2 Chr. 33:19)'
  - where: 'note 33:19 “A prayer that was not kept”'
    claim: 'The word rendered “the seers” is tagged in the morphology of the Westminster Leningrad Codex as a proper noun (Hozai)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="2335" n="0" morph="HNp" id="14chi">חוֹזָֽי</w>'
  - where: 'note 33:19 “A prayer that was not kept”'
    claim: 'The Prayer of Manasses is built of scripture phrases; little reason for the title'
    key: bd-apocrypha
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/apocrypha?lang=eng'
    quote: 'The Prayer of Manasses, king of Judah. This is a penitential prayer built up, for the most part, of sentences and phrases taken from the canonical scriptures. There is little reason for giving it the title that it bears.'
  - where: 'note 33:19 “A prayer that was not kept”'
    claim: 'D&C 91 on the Apocrypha'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/91?lang=eng'
    quote: 'There are many things contained therein that are not true, which are interpolations by the hands of men.'

  - where: 'note 33:23 “The son who did not humble himself”'
    claim: 'Amon sacrificed to his father''s images and did not humble himself'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/33?lang=eng'
    quote: 'And humbled not himself before the Lord, as Manasseh his father had humbled himself; but Amon trespassed more and more.'
  - where: 'note 33:23 “The son who did not humble himself”'
    claim: 'The same verb in 33:23 as in 33:12'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="k/3665" n="1.0" morph="HR/VNc" id="14Rya">כְּ/הִכָּנַ֖ע</w>'

  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'Alma: one compelled to be humble sometimes seeks repentance and finds mercy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/32?lang=eng'
    quote: 'for a man sometimes, if he is compelled to be humble, seeketh repentance; and now surely, whosoever repenteth shall find mercy'
