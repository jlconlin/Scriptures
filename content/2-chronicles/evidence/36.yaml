chapter: 36
claims:
  - where: 'when'
    claim: 'The chapter runs from the kings after Josiah to the exile until Persia and the first year of Cyrus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: 'Various kings rule in Judah—Nebuchadnezzar overruns Judah and makes Zedekiah king—Zedekiah rebels, the people reject the prophets, and the Chaldeans burn the temple and destroy Jerusalem—Cyrus of Persia decrees the building of the temple.'

  - where: 'setting'
    claim: 'The footnotes send the reader to the parallels in Kings and Jeremiah and, for the decree, to Ezra'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: '“Nebuchadnezzar”: 2 Kgs. 24:1 (1–16); Dan. 1:1 (1–2). … “rebelled”: 2 Kgs. 24:20; Jer. 52:3; Ezek. 17:15. … “house”: Ezra 1:2 (1–3); Isa. 44:28.'
  - where: 'setting'
    claim: 'The sins and the judgment (verses 12–21) are told rhetorically in outline, not in historical order'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/36.htm'
    quote: 'As in 2 Chronicles 36:12-16 the transgressions of the king and people are not described according to their historical progression, but are portrayed in rhetorical gradation; so, too, in 2 Chronicles 36:17-21 the judgment … only rhetorically in its great general outlines.'
  - where: 'setting'
    claim: 'Lehi’s call came in the first year of Zedekiah, when many prophets warned Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/1?lang=eng'
    quote: 'in the commencement of the first year of the reign of Zedekiah, king of Judah, (my father, Lehi, having dwelt at Jerusalem in all his days); and in that same year there came many prophets'

  - where: 'thread'
    claim: '“Humbled” in 36:12 is the verb of 7:14 and of Manasseh’s humbling in 33:12'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'וְ/יִכָּנְע֨וּ … וַ/יִּכָּנַ֣ע … נִכְנַ֗ע'
  - where: 'thread'
    claim: '“No remedy” is the Hebrew for healing or cure'
    key: bdb
    url: 'https://biblehub.com/hebrew/4832.htm'
    quote: '1 healing, cure, of national woes, Jeremiah 8:15; Jeremiah 14:19b'

  - where: 'section 1 plain'
    claim: '“Put him down” means deposed him; “condemned” means fined'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: '3a “put him down”: OR deposed him. … 3b “condemned”: HEB fined.'
  - where: 'section 4 plain'
    claim: '“Rising up betimes” means early, promptly'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: '15c “betimes”: HEB early, promptly.'
  - where: 'section 6 plain'
    claim: 'The question of verse 23 is read as “whosoever there is among you of all his people”'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/36.htm'
    quote: 'Who is there among you of all his people? The Lord … etc.] R.V. Whosoever there is among you of all his people, the LORD … etc.'

  - where: 'note 36:6 “Did Jehoiakim go to Babylon?”'
    claim: 'One older reading: Jehoiakim was fettered in Nebuchadnezzar’s first campaign but left to reign as vassal; verse 8’s formula assumes he died on the throne'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/36.htm'
    quote: 'Nebuchadnezzar did not carry out his purpose of deporting the captured king Jehoiakim to Babylon, but allowed him to continue to reign at Jerusalem as his servant (vassal).'
  - where: 'note 36:6 “Did Jehoiakim go to Babylon?”'
    claim: 'Keil ties the fetters to the campaign of Daniel 1:1–2 and reads verse 8’s succession formula'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/36.htm'
    quote: 'This campaign, Nebuchadnezzar''s first against Judah, is spoken of also in 2 Kings 24 and Daniel 1:1-2. … He uses the same formula which he has used in the case of all the kings whom at their death their sons succeeded'
  - where: 'note 36:6 “Did Jehoiakim go to Babylon?”'
    claim: 'Another older reading: Jehoiakim was probably not carried to Babylon; he died during the raids, and his son was taken; the Chronicler foreshortens'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/36.htm'
    quote: 'it is likely moreover that Jehoiakim was not carried to Babylon. … Probably Jehoiakim’s life and reign came to an end (how we do not know; cp. Jeremiah 22:18-19) during this petty warfare … The Chronicler seems to foreshorten the history at this point.'
  - where: 'note 36:6 “Did Jehoiakim go to Babylon?”'
    claim: 'The Church’s footnotes link verse 6 to 2 Kings 24 and Daniel 1, and verse 7’s vessels to 2 Kings 24:13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: '6a “Nebuchadnezzar”: 2 Kgs. 24:1 (1–16); Dan. 1:1 (1–2). … 7a “vessels”: 2 Kgs. 24:13.'

  - where: 'note 36:9 “Eight or eighteen”'
    claim: 'The footnote gives eighteen as the alternative and points to Kings'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: '9a “eight”: OR eighteen; see 2 Kgs. 24:8, 15.'
  - where: 'note 36:9 “Eight or eighteen”'
    claim: 'Some Hebrew manuscripts, the Syriac, Arabic and many Septuagint manuscripts read eighteen in Chronicles; Keil calls eight an orthographical error'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/36.htm'
    quote: 'but a few Hebr. codd., Syr., and Arab., and many manuscripts of the lxx, have eighteen years in the Chronicle also. The number eight is clearly an orthographical error'
  - where: 'note 36:9 “Eight or eighteen”'
    claim: 'Cambridge: eight is probably corrupt for eighteen; “and ten days” may be a misplaced fragment'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/36.htm'
    quote: 'the number is probably corrupt for eighteen … It is possible that the clause “and ten days” below is a misplaced fragment of an original reading ben shĕmôneh esreh shanah, i.e. “eighteen years old.”'

  - where: 'note 36:9 “Eight or eighteen”'
    claim: 'The Vaticanus (B) text of the Septuagint reads eight in Chronicles; the Alexandrinus (A) reads eighteen'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/36.htm'
    quote: 'So LXX. (B) of Chron. and of Esd., but the number is probably corrupt for eighteen (so LXX. (A) of Chron. and of Esd.'
  - where: 'note 36:10 “Brother or uncle?”'
    claim: 'The footnote to Zedekiah points to 2 Kgs. 24:17 and 1 Nephi 1:4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: '10b “Zedekiah”: 2 Kgs. 24:17; Jer. 52:1 (1–2); 1 Ne. 1:4; Omni 1:15.'
  - where: 'note 36:12 “The king who would not humble himself”'
    claim: 'The verb “humbled” in 36:12 is the one in 7:14 and 33:12'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'וְ/יִכָּנְע֨וּ … וַ/יִּכָּנַ֣ע … נִכְנַ֗ע'
  - where: 'note 36:12 “The king who would not humble himself”'
    claim: '“Turning” in 36:13 is the verb of “turn” in 7:14'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'וְ/יָשֻׁ֖בוּ … מִ/שּׁ֕וּב'
  - where: 'note 36:12 “The king who would not humble himself”'
    claim: 'The footnote to Jeremiah in verse 12 points to Jeremiah 21:1–7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: '12b “Jeremiah”: Jer. 21:1 (1–7).'

  - where: 'note 36:14 “Why Jerusalem fell, as Chronicles tells it”'
    claim: 'Kings traces the fall to Manasseh, a delayed punishment'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'the Deuteronomistic History suggests that God had allowed Jerusalem to be destroyed because King Manasseh was so wicked that even the righteousness of King Josiah could not compensate for it'
  - where: 'note 36:14 “Why Jerusalem fell, as Chronicles tells it”'
    claim: 'In Chronicles rewards and punishments are not usually delayed'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'rewards and punishments are not usually delayed in Chronicles, and people are often punished for sins or rewarded for righteousness immediately.'
  - where: 'note 36:14 “Why Jerusalem fell, as Chronicles tells it”'
    claim: 'The Chronicler’s answer: the people of that time were wicked, and God did not protect them'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'According to the Chronicler, God punished the wicked inhabitants of Jerusalem for their sins by not protecting them from the Babylonians.'
  - where: 'note 36:14 “Why Jerusalem fell, as Chronicles tells it”'
    claim: 'Both books are needed; people are not punished for others’ sins, though others’ sins harm them'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'Both Kings and Chronicles are necessary to form a nuanced view of the history of Israel and the destruction of Jerusalem. … People are not punished for the sins of others, yet the sins of others can cause terrible things to happen in people’s lives.'
  - where: 'note 36:14 “Why Jerusalem fell, as Chronicles tells it”'
    claim: 'The footnote to “abominations” points to Lehi’s vision in 1 Nephi 1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: '14a “abominations”: 1 Ne. 1:13 (13, 19).'

  - where: 'note 36:15 “Prophets sent in compassion”'
    claim: '“Betimes” is Hebrew for early, promptly'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: '15c “betimes”: HEB early, promptly.'
  - where: 'note 36:15 “Prophets sent in compassion”'
    claim: 'The messengers were prophets, and Lehi was among those who taught at Jerusalem'
    key: ot-seminary-lesson-102
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-books-of-1-and-2-chronicles/lesson-102-1-and-2-chronicles?lang=eng'
    quote: 'Explain that the messengers referred to in these verses were prophets of the Lord. … Explain that Lehi was among the prophets who taught at Jerusalem.'
  - where: 'note 36:15 “Prophets sent in compassion”'
    claim: 'Nine biblical prophets active in the period, a high number; this verse suggests unnamed others'
    key: sc-knowhy-441
    url: 'https://scripturecentral.org/knowhy/who-were-the-many-prophets-in-jerusalem-during-lehis-time'
    quote: 'Nine prophets from the Bible were active during the late-7th/early-6th centuries bc, a remarkably high number. In addition, other unnamed prophets may have been active during this time as well (see Jeremiah 25:4; 2 Chronicles 36:15–16).'
  - where: 'note 36:15 “Prophets sent in compassion”'
    claim: 'The Jews mocked Lehi for testifying of their wickedness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/1?lang=eng'
    quote: 'And it came to pass that the Jews did mock him because of the things which he testified of them; for he truly testified of their wickedness and their abominations'

  - where: 'note 36:16 “No healing left”'
    claim: 'The Hebrew word is marpe, healing or cure, used of national woes, with this verse and Jeremiah 14:19'
    key: bdb
    url: 'https://biblehub.com/hebrew/4832.htm'
    quote: '1 healing, cure, of national woes, Jeremiah 8:15; Jeremiah 14:19b ("" שָׁלוֺם), Jeremiah 36:6 (+ אֲרֻכָה); especially ׳אֵין לָנוּ מ Jeremiah 14:19a there is no cure for us, ׳עַד לְאֵין מ2Chronicles 36:16.'
  - where: 'note 36:16 “No healing left”'
    claim: 'The verse’s last word is marpe'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'מַרְפֵּֽא'
  - where: 'note 36:21 “The land’s sabbaths”'
    claim: 'The land was to keep a sabbath every seventh year; the law was long broken; the seventy years were regarded as making up for it'
    key: bd-sabbatical-year
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sabbatical-year?lang=eng'
    quote: 'The law of the sabbatical year was habitually broken by the Jews for a long period before the Babylonian exile. The 70 years of exile and the land’s desolation were regarded as making up for the unobserved Sabbaths of the land (2 Chr. 36:21).'
  - where: 'note 36:21 “The land’s sabbaths”'
    claim: 'Every seventh year was the land’s sabbath to the Lord'
    key: bd-sabbatical-year
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sabbatical-year?lang=eng'
    quote: 'so also was every seventh year consecrated to the Lord. The land, inasmuch as it was the Lord’s, was to keep a Sabbath unto Him (Lev. 25:2–7).'
  - where: 'note 36:21 “The land’s sabbaths”'
    claim: 'The footnotes link the sabbath to the Sabbatical Year and the seventy years to Jeremiah 25:12 and Daniel 9:2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: '21a “sabbath”: TG Sabbatical Year. … 21b “threescore”: Jer. 25:12; Dan. 9:2.'

  - where: 'note 36:23 “Let him go up”'
    claim: 'Ezra–Nehemiah may be regarded as a sequel to Chronicles'
    key: bd-chronicles
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/chronicles?lang=eng'
    quote: 'The books of Ezra and Nehemiah, originally forming one book in the Hebrew canon, may be regarded as a sequel to 1 and 2 Chr.'
  - where: 'note 36:23 “Let him go up”'
    claim: 'One older reading: the Chronicler closes with this comforting prospect without the whole edict, which Ezra gives'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/36.htm'
    quote: 'With this comforting prospect for the future, the author of the Chronicle closes his consideration of the prae-exilic history of the people of God without completely communicating the contents of the royal edict of Cyrus'
  - where: 'note 36:23 “Let him go up”'
    claim: 'In the Hebrew order Chronicles is last, so these are the last words of the Old Testament'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/36.htm'
    quote: 'let him go up] i.e. to Jerusalem; cp. Ezra 1:3. Since Chronicles is the last book of the Old Testament (according to the Hebrew order), these words are to be reckoned the last words of the Old Testament.'
  - where: 'note 36:23 “Let him go up”'
    claim: 'The Chronicler writes to give hope and to legitimize the rebuilt temple'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'The Chronicler writes to give hope, to create an identity based on worship and the ideals of the kingdom, and to legitimize their newly rebuilt temple.'

  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'Because of His compassion the Lord sends prophets to warn of the consequences of sin'
    key: ot-seminary-lesson-102
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-books-of-1-and-2-chronicles/lesson-102-1-and-2-chronicles?lang=eng'
    quote: '(Because of the Lord’s compassion for us, He sends prophets to warn us of the consequences of sin.)'
