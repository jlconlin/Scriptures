chapter: 3
claims:
  - where: 'when'
    claim: 'The building began on the second day of the second month of Solomon''s fourth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/3?lang=eng'
    quote: 'Then Solomon began to build the house of the Lord at Jerusalem in mount Moriah'
  - where: 'setting'
    claim: 'Chapter 2 ends with the burden bearers, hewers and overseers set to work'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/2?lang=eng'
    quote: 'And he set threescore and ten thousand of them to be bearers of burdens, and fourscore thousand to be hewers in the mountain, and three thousand and six hundred overseers to set the people a work.'
  - where: 'setting'
    claim: 'Chapter 4 goes on to the altar and the sea'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/4?lang=eng'
    quote: 'Moreover he made an altar of brass, twenty cubits the length thereof'
  - where: 'setting'
    claim: 'Kings dates the start from the Exodus, in the fourth year and second month'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/6?lang=eng'
    quote: 'in the four hundred and eightieth year after the children of Israel were come out of the land of Egypt, in the fourth year of Solomon’s reign over Israel, in the month Zif, which is the second month'
  - where: 'setting'
    claim: 'Kings sets a word of the LORD to Solomon in the building account'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/6?lang=eng'
    quote: 'Concerning this house which thou art in building, if thou wilt walk in my statutes, and execute my judgments'
  - where: 'setting'
    claim: 'Chronicles gives length and breadth and omits the height stated in Kings'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/3.htm'
    quote: 'The measurements only of the length and breadth of the building are given; the height, which is stated in 1 Kings 6:2, is omitted here.'
  - where: 'setting'
    claim: 'Chronicles was compiled from older records with Samuel and Kings, dwelling on temple worship'
    key: bd-chronicles
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/chronicles?lang=eng'
    quote: 'the writers dwell with most satisfaction upon the ecclesiastical and religious aspects of the history, and the progress of temple worship in Jerusalem.'
  - where: 'setting'
    claim: 'The veil is learned from 2 Chr. 3:14 (Kings does not have it)'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'From 2 Chr. 3:14 we learn that a veil hung in front of the door.'
  - where: 'setting'
    claim: 'The name Moriah occurs only in Gen. 22 and 2 Chr. 3:1'
    key: bowen-mount-lord-provided
    url: 'https://interpreterfoundation.org/journal/in-the-mount-of-the-lord-it-shall-be-seen-and-provided-theophany-and-sacrifice-as-the-etiological-foundation-of-the-temple-in-israelite-and-latter-day-saint-tradit'
    quote: 'The name “Moriah” occurs only in these two passages.'
  - where: 'thread'
    claim: 'Only Chronicles names Moriah as the temple hill'
    key: bowen-mount-lord-provided
    url: 'https://interpreterfoundation.org/journal/in-the-mount-of-the-lord-it-shall-be-seen-and-provided-theophany-and-sacrifice-as-the-etiological-foundation-of-the-temple-in-israelite-and-latter-day-saint-tradit'
    quote: 'The name “Moriah” occurs only in these two passages.'
  - where: 'thread'
    claim: 'The veil, which Kings lacks, is learned from 2 Chr. 3:14'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'From 2 Chr. 3:14 we learn that a veil hung in front of the door.'
  - where: 'thread'
    claim: 'The veil has the colors and cherubim of the tabernacle''s veil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/26?lang=eng'
    quote: 'And thou shalt make a veil of blue, and purple, and scarlet, and fine twined linen of cunning work: with cherubims shall it be made:'
  - where: 'section 2 plain'
    claim: 'Verse 3 speaks of the foundation Solomon laid, not of his being instructed'
    key: bdb
    url: 'https://biblehub.com/hebrew/3245.htm'
    quote: 'this is the foundation which Solomon laid for building'
  - where: 'section 2 plain'
    claim: '“First measure” is the ancient measure'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/3?lang=eng'
    quote: 'OR ancient measure.'
  - where: 'section 4 plain'
    claim: '“Oracle” is the inner sanctuary'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/3?lang=eng'
    quote: 'OR inner sanctuary.'
  - where: 'note 3:1 “The hill where the LORD was seen”'
    claim: 'David saw the angel of the LORD over Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/21?lang=eng'
    quote: 'And David lifted up his eyes, and saw the angel of the Lord stand between the earth and the heaven, having a drawn sword in his hand stretched out over Jerusalem.'
  - where: 'note 3:1 “The hill where the LORD was seen”'
    claim: 'David built the altar there and the plague was stayed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/21?lang=eng'
    quote: 'And the Lord commanded the angel; and he put up his sword again into the sheath thereof.'
  - where: 'note 3:1 “The hill where the LORD was seen”'
    claim: 'The Chronicler connects the floor with Isaac''s sacrifice and the temple; Moriah only in these two passages'
    key: bowen-mount-lord-provided
    url: 'https://interpreterfoundation.org/journal/in-the-mount-of-the-lord-it-shall-be-seen-and-provided-theophany-and-sacrifice-as-the-etiological-foundation-of-the-temple-in-israelite-and-latter-day-saint-tradit'
    quote: 'the Chronicler specifically connects this threshing floor with the site of Isaac’s arrested sacrifice and the building of the [Page 217]temple'
  - where: 'note 3:1 “The hill where the LORD was seen”'
    claim: 'Bowen: the temple embodied Abraham''s Moriah'
    key: bowen-mount-lord-provided
    url: 'https://interpreterfoundation.org/journal/in-the-mount-of-the-lord-it-shall-be-seen-and-provided-theophany-and-sacrifice-as-the-etiological-foundation-of-the-temple-in-israelite-and-latter-day-saint-tradit'
    quote: 'The temple was the architectural embodiment of Sinai, but it was also the architectural embodiment of Abraham’s “Moriah,” where he literally placed everything the Lord had given him and everything that the Lord had promised him upon the altar.'
  - where: 'note 3:3 “Foundations, by the old cubit”'
    claim: 'hûsad is the Hophal of "found": this is the foundation Solomon laid'
    key: bdb
    url: 'https://biblehub.com/hebrew/3245.htm'
    quote: 'this is (literally these are) the founding of Solomon to build the house of God, i.e. this is the foundation which Solomon laid for building'
  - where: 'note 3:3 “Foundations, by the old cubit”'
    claim: 'The footnote reads "ancient measure"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/3?lang=eng'
    quote: 'OR ancient measure.'
  - where: 'note 3:3 “Foundations, by the old cubit”'
    claim: 'A cubit is elbow to fingertip, about 17½ inches'
    key: bd-weights-and-measures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/weights-and-measures?lang=eng'
    quote: 'Cubit. The distance from the elbow to the tip of the finger, normally about 17½ inches'
  - where: 'note 3:3 “Foundations, by the old cubit”'
    claim: 'Terms for measures varied over time and must be read in their period'
    key: bd-weights-and-measures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/weights-and-measures?lang=eng'
    quote: 'Such terms must be interpreted in the light of the period of time in which they are used.'
  - where: 'note 3:3 “Foundations, by the old cubit”'
    claim: 'The meanings of terms for measures varied from time to time'
    key: bd-weights-and-measures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/weights-and-measures?lang=eng'
    quote: 'with their relative values and ratios, varied from time to time'
  - where: 'note 3:14 “A veil, as in the tabernacle”'
    claim: 'Kings has a partition of golden chains before the oracle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/6?lang=eng'
    quote: 'he made a partition by the chains of gold before the oracle'
  - where: 'note 3:14 “A veil, as in the tabernacle”'
    claim: 'Kings has doors of olive wood for the entering of the oracle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/6?lang=eng'
    quote: 'And for the entering of the oracle he made doors of olive tree'
  - where: 'note 3:14 “A veil, as in the tabernacle”'
    claim: 'The tabernacle''s veil: blue, purple, scarlet, fine twined linen, cherubim'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/26?lang=eng'
    quote: 'And thou shalt make a veil of blue, and purple, and scarlet, and fine twined linen of cunning work: with cherubims shall it be made:'
  - where: 'note 3:14 “A veil, as in the tabernacle”'
    claim: 'The veil is learned from 2 Chr. 3:14'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'From 2 Chr. 3:14 we learn that a veil hung in front of the door.'
  - where: 'note 3:14 “A veil, as in the tabernacle”'
    claim: 'The temple followed the tabernacle''s model, doubled'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'The temple was built after the model of the tabernacle, the dimensions of each part being exactly double.'
  - where: 'note 3:15 “Thirty-five cubits, or eighteen”'
    claim: 'Kings: two pillars of eighteen cubits'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/7?lang=eng'
    quote: 'For he cast two pillars of brass, of eighteen cubits high apiece'
  - where: 'note 3:15 “Thirty-five cubits, or eighteen”'
    claim: '2 Kgs. 25:17 and Jer. 52:21 also give eighteen; 35 from confusing the letter-numerals for 18 and 35'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/3.htm'
    quote: 'according to 1 Kings 7:15; 2 Kings 25:17; Jeremiah 52:21, it was only eighteen cubits. The number thirty-five has arisen by confounding יח equals 18 with לה equals 35'
  - where: 'note 3:15 “Thirty-five cubits, or eighteen”'
    claim: 'A 120-cubit front on a 30-cubit house would be a tower; twenty or thirty cannot be determined'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/3.htm'
    quote: 'for a front 120 cubits high to a house only thirty cubits high could not be called אוּלם; it would have been a מגדּל, a tower. It cannot with certainty be determined whether we should read twenty or thirty cubits'
  - where: 'note 3:15 “Thirty-five cubits, or eighteen”'
    claim: 'Reckoned by Kings, pillars with capitals were 23 cubits'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'These with their capitals were 23 cubits high.'
  - where: 'note 3:15 “Thirty-five cubits, or eighteen”'
    claim: 'Kings makes the house thirty cubits high'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'The temple proper, or interior, was 60 cubits long, 20 cubits broad, 30 cubits high'
  - where: 'note 3:15 “Thirty-five cubits, or eighteen”'
    claim: 'The Greek has thirty-five cubits for the pillars'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_chronicles/3.htm'
    quote: 'two pillars, in height thirty-five cubits, and their chapters of five cubits.'
  - where: 'note 3:15 “Thirty-five cubits, or eighteen”'
    claim: 'The Greek has a hundred and twenty cubits for the porch'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_chronicles/3.htm'
    quote: 'its height a hundred and twenty cubits'
  - where: 'note 3:15 “Thirty-five cubits, or eighteen”'
    claim: 'Numbers were peculiarly hard to transmit; seen in the parallels'
    key: ot-manual-large-numbers
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/enrichment-section-e-the-problem-of-large-numbers-in-the-old-testament?lang=eng'
    quote: 'There is also evidence from the parallel passages in Samuel, Kings and Chronicles and (especially) in Ezra 2 and Nehemiah 7 that numbers were peculiarly difficult to transmit accurately.'
  - where: 'note 3:17 “Stability and Strength”'
    claim: 'The Greek translates the names as Stability and Strength'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_chronicles/3.htm'
    quote: 'Stability,'' and the name of the one on the left ?Strength'
  - where: 'note 3:17 “Stability and Strength”'
    claim: 'Kings gives the same names, Jachin on the right and Boaz on the left'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/7?lang=eng'
    quote: 'he set up the right pillar, and called the name thereof Jachin: and he set up the left pillar, and called the name thereof Boaz.'
  - where: 'christ'
    claim: 'Moriah and the temple; Isaac and Christ perhaps offered in the same area, impossible to know'
    key: sc-knowhy-412
    url: 'https://scripturecentral.org/knowhy/how-abrahams-sacrifice-of-isaac-illuminates-the-atonement'
    quote: 'Both Christ and Isaac may have even been offered up in the same area (in or around Jerusalem), although it is impossible to know for sure.'
  - where: 'christ'
    claim: 'Bowen: the temple at Moriah is about looking forward to the Son for redemption; sacrifice a seeing of redemption; the arrested slaughter'
    key: bowen-mount-lord-provided
    url: 'https://interpreterfoundation.org/journal/in-the-mount-of-the-lord-it-shall-be-seen-and-provided-theophany-and-sacrifice-as-the-etiological-foundation-of-the-temple-in-israelite-and-latter-day-saint-tradit'
    quote: 'the establishment of the Jerusalem temple at Moriah/Jehovah-jireh is about more than Isaac’s arrested sacrifice, the arrested slaughter of Jerusalem, and the vicarious animal sacrifices performed there that memorialized these events—it is to “look forward to [God’s] Son for redemption”'
  - where: 'christ'
    claim: 'Sacrifice is a theophany in which one sees one''s own redemption'
    key: bowen-mount-lord-provided
    url: 'https://interpreterfoundation.org/journal/in-the-mount-of-the-lord-it-shall-be-seen-and-provided-theophany-and-sacrifice-as-the-etiological-foundation-of-the-temple-in-israelite-and-latter-day-saint-tradit'
    quote: 'Sacrifice itself is a kind of theophany in which one “sees” one’s own redemption.'
