chapter: 35
claims:
  - where: setting
    claim: 'The Passover follows the finding of the book and the covenant, as its ratification (one older reading); Kings mentions it briefly, Chronicles describes it at length'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/35.htm'
    quote: 'To ratify the renewal of the covenant, and to confirm the people in the communion with the Lord into which it had entered by the making of the covenant, Josiah, immediately after the finding of the book of the law and the renewal of the covenant, appointed a solemn passover'
  - where: setting
    claim: 'Josiah sought God in his eighth year, purged in his twelfth, reigned thirty-one years; Huldah''s promise of a grave in peace'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/34?lang=eng'
    quote: 'For in the eighth year of his reign, while he was yet young, he began to seek after the God of David his father'
  - where: setting
    claim: 'In the spring of 609 BC Necho II marched north to aid the Assyrian ruler; Josiah tried to block him at Megiddo and was killed'
    key: tolley-imprisonment
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/imprisonment-jeremiah-its-historical-context'
    quote: 'In the spring of 609 BC, the Egyptian pharaoh Necho II[20] led a sizable military force north to aid the Assyrian ruler Asshuruballit II in Carchemish in a frantic effort to retake Haran from the Babylonians.'
  - where: setting
    claim: 'Kings tells the Passover in three verses and the death in a sentence'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng'
    quote: 'Surely there was not holden such a passover from the days of the judges that judged Israel, nor in all the days of the kings of Israel, nor of the kings of Judah'

  - where: thread
    claim: 'What set the Passover apart was that it was kept strictly by the book of the law (one older reading)'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/23.htm'
    quote: '(2) that it was kept in strict accordance with the precepts of the Mosaic book of the law'
  - where: thread
    claim: 'Kings links Josiah''s end to Manasseh''s sins; Chronicles introduces the war simply with “After all this”'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/35.htm'
    quote: 'This didactic connecting of the tragical end of the pious king with the task of his reign … is not found in the Chronicle. Here the war with Necho, in which Josiah fell, is introduced by the simple formula: After all this'
  - where: thread
    claim: 'Chronicles judges the war as against God''s will'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/35.htm'
    quote: 'The author of the Chronicle judges the matter from the religious point of view, from which the undertaking is seen to have been against the will of God, and therefore to have ended in Josiah''s destruction'

  - where: 'note 35:3 “The Levites no longer carry the ark”'
    claim: 'The Levites taught the people the law; they no longer bear the ark as in the wilderness and until the temple'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/35.htm'
    quote: 'The Levites had to teach the people in the law. … ye have not any longer to bear it on your shoulders, as formerly on the journey through the wilderness, and indeed till the building of the temple'
  - where: 'note 35:3 “The Levites no longer carry the ark”'
    claim: 'Most commentators supposed the ark had been removed under Manasseh and Amon; Keil rejects this because the ark is not mentioned again'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/35.htm'
    quote: 'Most ancient and modern commentators, on the other hand, suppose that the holy ark had, during the reigns of the godless Manasseh and Amon, either been removed by them from its place … and that Josiah calls upon the Levites to bring it back again to its place.'
  - where: 'note 35:3 “The Levites no longer carry the ark”'
    claim: 'Keil''s reading: leave the ark in the temple and serve the Lord and His people now in the way described'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/35.htm'
    quote: 'Think not on that which formerly, before the building of the temple, belonged to your service, but serve the Lord and His people now in the manner described in 2 Chronicles 35:4. The interpretation of the words as denoting a material setting or removing of the ark, is completely excluded'
  - where: 'note 35:3 “The Levites no longer carry the ark”'
    claim: 'The father of the family normally slew the lamb; at Hezekiah''s Passover the Levites did it for the unclean'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/30.htm'
    quote: 'This was not the rule: in the case of the paschal lamb, the father of the family who slew the lamb had to hand the blood to the priest, that it might be sprinkled upon the altar; here the Levites did it for the reasons given in 2 Chronicles 30:17.'
  - where: 'note 35:3 “The Levites no longer carry the ark”'
    claim: 'The Passover lost its domestic character and became a sanctuary feast; later the Levites slew the sacrifices'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: '(1) It lost its domestic character and became a sanctuary feast.'
  - where: 'note 35:3 “The Levites no longer carry the ark”'
    claim: 'The Levites slew the sacrifices, at least on some occasions'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: '(6) The Levites (at least on some occasions) slew the sacrifices.'
  - where: 'note 35:3 “The Levites no longer carry the ark”'
    claim: 'The law set the tribe of Levi apart to bear the ark'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/10?lang=eng'
    quote: 'At that time the LORD separated the tribe of Levi, to bear the ark of the covenant of the LORD'

  - where: 'note 35:13 “Roasted, and the rest boiled”'
    claim: '“Roasted” and “sod” render the same verb, bāšal'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'בִּשְּׁל֗וּ'
  - where: 'note 35:13 “Roasted, and the rest boiled”'
    claim: 'BDB: bāšal means boil; with the holy offerings at 2 Chr. 35:13 it is “boil”'
    key: bdb
    url: 'https://biblehub.com/hebrew/1310.htm'
    quote: '1 boil (transitive) object omitted Numbers 11:8, בָּשָׂר 1 Samuel 2:13; גְּדִי Exodus 23:19; Exodus 34:26; Deuteronomy 14:21; נזיד 2 Kings 4:38; of offerings, object הקדשׁים2Chronicles 35:13'
  - where: 'note 35:13 “Roasted, and the rest boiled”'
    claim: 'BDB: of the Passover, cook in general, compared with Exodus 12:8–9 (roast with fire against boiled in water), and 2 Chr. 35:13 with fire'
    key: bdb
    url: 'https://biblehub.com/hebrew/1310.htm'
    quote: 'hence also of הפסח Deuteronomy 16:7 (compare Di; "" Exodus 12:8,9 has צְלִי אֵשׁ opposed to מְבֻשָּׁל בַּמַּיִם) 2 Chronicles 35:13 (בָּאֵשׁ)'
  - where: 'note 35:13 “Roasted, and the rest boiled”'
    claim: 'Voluntary peace offerings at the Passover, traced in the history at 2 Chr. 35:13'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: '(7) Voluntary peace offerings (called Chagigah) were offered. Of these there are traces in the law and in the history (Num. 10:10; 2 Chr. 30:22–24; 35:13).'
  - where: 'note 35:13 “Roasted, and the rest boiled”'
    claim: 'The law: the lamb not boiled, but roast with fire'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/12?lang=eng'
    quote: 'Eat not of it raw, nor sodden at all with water, but roast with fire'

  - where: 'note 35:18 “No Passover like it since Samuel”'
    claim: 'Chronicles'' “days of Samuel” stands for Kings'' “days of the judges”; Samuel closed the period of the judges'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/23.htm'
    quote: 'Instead of "since the days of the judges who judged Israel," we find in 2 Chronicles 35:18, "since the days of Samuel the prophet," who is well known to have closed the period of the judges.'
  - where: 'note 35:18 “No Passover like it since Samuel”'
    claim: 'What distinguished it: all the nation took part, and it was kept strictly by the law, where Hezekiah''s deviated (second month, unpurified eaters)'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/23.htm'
    quote: 'What distinguished this passover above every other was, (1) that "all the nation," not merely Judah and Benjamin, but also the remnant of the ten tribes, took part in it … (2) that it was kept in strict accordance with the precepts of the Mosaic book of the law, whereas in the passover instituted by Hezekiah there were necessarily many points of deviation'
  - where: 'note 35:18 “No Passover like it since Samuel”'
    claim: 'Josiah''s Passover was kept at the legal time, unlike Hezekiah''s'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/35.htm'
    quote: 'and they held the passover in the 14th day of the first month, consequently at the time fixed in the law. It happened otherwise under Hezekiah (2 Chronicles 30:2, 2 Chronicles 30:13, and 2 Chronicles 30:15).'
  - where: 'note 35:18 “No Passover like it since Samuel”'
    claim: 'Samuel judged Israel all his life; Hezekiah''s Passover “since Solomon”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/30?lang=eng'
    quote: 'for since the time of Solomon the son of David king of Israel there was not the like in Jerusalem'

  - where: 'note 35:21 “Necho''s warning”'
    claim: 'Pharaoh Necho disclaimed enmity; Josiah met him at Megiddo and was slain'
    key: bd-josiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/josiah?lang=eng'
    quote: 'Josiah became involved in the war between Assyria and Egypt, and, though Pharaoh Necho disclaimed enmity, Josiah met him in battle at Megiddo and was defeated and slain'
  - where: 'note 35:21 “Necho''s warning”'
    claim: 'Necho was marching to aid the Assyrian ruler against the Babylonians'
    key: tolley-imprisonment
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/imprisonment-jeremiah-its-historical-context'
    quote: 'the Egyptian pharaoh Necho II[20] led a sizable military force north to aid the Assyrian ruler Asshuruballit II in Carchemish in a frantic effort to retake Haran from the Babylonians'
  - where: 'note 35:21 “Necho''s warning”'
    claim: 'Josiah tried to block Necho, hoping to cut off Assyria''s support (Tolley''s reading)'
    key: tolley-imprisonment
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/imprisonment-jeremiah-its-historical-context'
    quote: 'Josiah attempted to block the advance of Necho’s forces at the valley of Megiddo, some sixty miles north of Jerusalem. He hoped to eliminate Assyria’s support and to ensure the Assyrian defeat.'
  - where: 'note 35:21 “Necho''s warning”'
    claim: 'Scripture does not say why Josiah tried to stop Necho'
    key: lund-ezekiel
    url: 'https://rsc.byu.edu/isaiah-prophets/ezekiel-prophet-judgment-prophet-promise'
    quote: 'It was at that time, though the scriptural record doesn’t say why, that the righteous King Josiah of Judah tried to stop Pharaoh Necho at Megiddo. As nearly as we can tell it was like a fly trying to stop a bull.'
  - where: 'note 35:21 “Necho''s warning”'
    claim: 'KnoWhy #861: Josiah was warned by God not to intervene'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: '2 Chronicles 35:21–24 records that Josiah came to fight the king of Egypt at Megiddo despite being warned by God not to intervene.'

  - where: 'note 35:22 “Why Josiah died”'
    claim: 'In Chronicles rewards and punishments are not usually delayed'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'rewards and punishments are not usually delayed in Chronicles, and people are often punished for sins or rewarded for righteousness immediately.'
  - where: 'note 35:22 “Why Josiah died”'
    claim: 'KnoWhy #861: Josiah''s death is the example; because he ignored God, the Egyptians killed him'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'One good example of this is the way the Chronicler describes the death of Josiah. … Because Josiah ignored God, the Egyptians killed him.'
  - where: 'note 35:22 “Why Josiah died”'
    claim: 'Kings sets the end of the reign after the LORD''s word that the wrath for Manasseh''s provocations would not turn'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng'
    quote: 'Notwithstanding the LORD turned not from the fierceness of his great wrath, wherewith his anger was kindled against Judah, because of all the provocations that Manasseh had provoked him withal.'
  - where: 'note 35:22 “Why Josiah died”'
    claim: 'KnoWhy #861: both Kings and Chronicles are needed; sometimes punishment or blessing is immediate, sometimes not'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'Both Kings and Chronicles are necessary to form a nuanced view of the history of Israel and the destruction of Jerusalem. Sometimes people are punished for iniquity or blessed for righteousness immediately, but sometimes they are not.'
  - where: 'note 35:22 “Why Josiah died”'
    claim: 'KnoWhy #310 lists Josiah''s disguise with Ahab''s among the biblical disguise stories'
    key: sc-knowhy-310
    url: 'https://scripturecentral.org/knowhy/why-did-abinadi-use-a-disguise'
    quote: '(3) an Israelite king disguising himself to avoid harm in battle, only to be slain by an archer (1 Kings 22), (4) Josiah disguising himself in order to meet with an Egyptian Pharaoh (2 Chronicles 35; 2 Kings 23)'
  - where: 'note 35:22 “Why Josiah died”'
    claim: 'In these stories the disguise is penetrated and God''s will conveyed'
    key: sc-knowhy-310
    url: 'https://scripturecentral.org/knowhy/why-did-abinadi-use-a-disguise'
    quote: 'one of the parties disguises himself (or in one case herself), but the disguise is penetrated, and God’s will is conveyed in a form which is liable to be quite unacceptable to the one seeking it.'
  - where: 'note 35:22 “Why Josiah died”'
    claim: 'Ahab disguised himself at Ramoth-gilead'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/18?lang=eng'
    quote: 'So the king of Israel disguised himself; and they went to the battle.'
  - where: 'note 35:22 “Why Josiah died”'
    claim: 'Huldah''s promise: gathered to thy grave in peace, not to see the evil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/34?lang=eng'
    quote: 'thou shalt be gathered to thy grave in peace, neither shall thine eyes see all the evil that I will bring upon this place'

  - where: 'note 35:25 “The lost laments for Josiah”'
    claim: 'The book of Lamentations: dirges over the fall of Jerusalem, written some years after the fall'
    key: bd-lamentations
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/lamentations-book-of?lang=eng'
    quote: 'Or, Dirges over the fall of Jerusalem and the nation. Written by Jeremiah. … The date of the book must be some years after the fall of the city, of which the writer was an eyewitness.'
  - where: 'note 35:25 “The lost laments for Josiah”'
    claim: 'The lamentations were a collection holding Jeremiah''s for Josiah, sung as a standing custom, not the canonical Lamentations (one older reading)'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/35.htm'
    quote: '"And they made them (these lamentations) an ordinance (a standing custom) in Israel, and they are written in the lamentations," i.e., in a collection of lamentations, in which, among others, that composed by Jeremiah on the death of Josiah was contained. This collection is, however, not to be identified with the Lamentations of Jeremiah'
  - where: 'note 35:25 “The lost laments for Josiah”'
    claim: 'The Bible Dictionary lists Jer. 22:10–12, 18 and Zech. 12:11 with Josiah''s death'
    key: bd-josiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/josiah?lang=eng'
    quote: 'Josiah met him in battle at Megiddo and was defeated and slain (2 Chr. 35:20–25; see also 2 Kgs. 23:29–30; Jer. 22:10–12, 18; Zech. 12:11).'

  - where: 'note 35:25 “The lost laments for Josiah”'
    claim: 'Lam. 4:20, the footnote''s cross-reference to verse 25, grieves for the LORD''s anointed taken in their pits'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/4?lang=eng'
    quote: 'The breath of our nostrils, the anointed of the LORD, was taken in their pits'

  - where: christ
    claim: 'The Passover commemorated the redemption from Egypt'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'The Feast of the Passover was instituted to commemorate the passing over the houses of the children of Israel in Egypt when God smote the firstborn of the Egyptians, and more generally the redemption from Egypt'
  - where: christ
    claim: 'Christ our passover'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/5?lang=eng'
    quote: 'For even Christ our passover is sacrificed for us'
  - where: christ
    claim: 'Zechariah''s mourning for the pierced one is measured by the mourning in the valley of Megiddon, a passage the Bible Dictionary sets with Josiah''s death'
    key: bd-josiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/josiah?lang=eng'
    quote: 'see also 2 Kgs. 23:29–30; Jer. 22:10–12, 18; Zech. 12:11'
  - where: christ
    claim: 'Zechariah''s “valley of Megiddon” is Megiddo, where Josiah was defeated and died'
    key: bd-megiddo
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/megiddo?lang=eng'
    quote: 'Also the scene of the tragic defeat and death of King Josiah (23:29–30; 2 Chr. 35:22). In Zech. 12:11 the place is called “the valley of Megiddon.”'
  - where: christ
    claim: 'The Lord identifies the wounded one as Jesus that was crucified'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'I am he who was lifted up. I am Jesus that was crucified. I am the Son of God.'
  - where: christ
    claim: 'Jesus ate the Passover with His disciples and instituted the sacrament in remembrance of Him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/22?lang=eng'
    quote: 'With desire I have desired to eat this passover with you before I suffer'
