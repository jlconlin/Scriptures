chapter: 30
claims:
  - where: 'setting'
    claim: 'Ahaz shut the temple doors and made altars in every corner of Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/28?lang=eng'
    quote: 'and shut up the doors of the house of the LORD, and he made him altars in every corner of Jerusalem.'
  - where: 'setting'
    claim: 'Hezekiah opened the doors in the first month of his first year; the cleansing ended on the sixteenth day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/29?lang=eng'
    quote: 'He in the first year of his reign, in the first month, opened the doors of the house of the LORD, and repaired them.'
  - where: 'setting'
    claim: 'Kings sums up the reform briefly: high places removed, brasen serpent broken'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/18?lang=eng'
    quote: 'He removed the high places, and brake the images, and cut down the groves, and brake in pieces the brasen serpent'
  - where: 'setting'
    claim: 'The Passover and its invitation are not in Kings'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/30.htm'
    quote: 'Ch. 2 Chronicles 30:1-12 (not in 2 Kin.). Hezekiah Invites all Israel to keep the Passover'
  - where: 'setting'
    claim: 'Samaria taken in Hezekiah''s sixth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/18?lang=eng'
    quote: 'even in the sixth year of Hezekiah, that is the ninth year of Hoshea king of Israel, Samaria was taken.'
  - where: 'setting'
    claim: 'Scripture Helps asks three questions of chapter 30: its significance, the delay, the unclean'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: '2 Chronicles 30:1: What was significant about Hezekiah’s Passover celebration? … Why did Hezekiah delay the Passover celebration? … Why did Hezekiah allow ritually unclean individuals to participate in the Passover?'
  - where: 'thread'
    claim: 'The letter uses šûb for Israel''s turning and the LORD''s returning'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="7725" n="0.3.3" morph="HVqv2mp" id="14D47">שׁ֚וּבוּ</w> … <w lemma="c/7725" n="0.2.0" morph="HC/Vqj3ms" id="14J1k">וְ/יָשֹׁב֙</w>'
  - where: 'thread'
    claim: 'The LORD''s promise to Solomon: humble themselves, turn from wicked ways'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/7?lang=eng'
    quote: 'If my people, which are called by my name, shall humble themselves, and pray, and seek my face, and turn from their wicked ways; then will I hear from heaven'

  - where: 'note 30:1 “Letters to the northern tribes”'
    claim: 'Hezekiah reigned when Assyria conquered the north; divided two centuries; no unified Passover since Solomon; many scoffed, others came'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'King Hezekiah reigned in the Southern Kingdom at the time the Assyrians conquered the Northern Kingdom. … Because the Northern and Southern Kingdoms had been divided for about two centuries, the Israelites had not experienced a unified Passover celebration since the time of King Solomon.'
  - where: 'note 30:1 “Letters to the northern tribes”'
    claim: 'Hezekiah promoted unity by centralizing religion and the Passover; Israelites, Judahites and resident aliens united; shrines elsewhere destroyed'
    key: pierce-israelite-refugees
    url: 'https://rsc.byu.edu/covenant-compassion/experience-israelite-refugees'
    quote: 'Both the Bible and archaeology illustrate efforts by Hezekiah to promote unity between Israelites and Judahites by centralizing religion and commemorating the Passover … northern Israelites, Judahites, and resident aliens (displaced persons) from both kingdoms were united in observance of Passover.'
  - where: 'note 30:1 “Letters to the northern tribes”'
    claim: 'Pierce: Hezekiah closed shrines and altars elsewhere (2 Chr. 31:1)'
    key: pierce-israelite-refugees
    url: 'https://rsc.byu.edu/covenant-compassion/experience-israelite-refugees'
    quote: 'closed and desecrated shrines/altars at Lachish, Beersheba, and Arad; destroyed items that had become objects of veneration; and established a singular worship center in Jerusalem (2 Kings 18:3–5; 2 Chronicles 31:1).'
  - where: 'note 30:1 “Letters to the northern tribes”'
    claim: 'Jerusalem''s population surged in the late eighth century; refugees from the north likely a major factor; extent debated'
    key: sc-knowhy-708
    url: 'https://scripturecentral.org/knowhy/why-did-lehi-live-in-jerusalem'
    quote: 'Archaeological excavations in and around Jerusalem indicate that the population of the city and surrounding region surged in the late eighth century BC'
  - where: 'note 30:1 “Letters to the northern tribes”'
    claim: 'The extent of refugee growth remains debated'
    key: sc-knowhy-708
    url: 'https://scripturecentral.org/knowhy/why-did-lehi-live-in-jerusalem'
    quote: 'The full extent of Jerusalem’s population growth at this time and how much of it was due to an influx of Northern Israelite refugees remain topics of ongoing inquiry and some debate'
  - where: 'note 30:1 “Letters to the northern tribes”'
    claim: 'Lehi of Manasseh probably descended from Manassite refugees'
    key: sc-knowhy-708
    url: 'https://scripturecentral.org/knowhy/why-did-lehi-live-in-jerusalem'
    quote: 'Lehi was probably a descendant of Manassite refugees who had fled south to Judah with others of the northern kingdom when the Assyrians attacked, destroyed, and deported Israel in 724–722 BC.'
  - where: 'note 30:1 “Letters to the northern tribes”'
    claim: 'Samaria''s fall in Hezekiah''s reign'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/18?lang=eng'
    quote: 'in the fourth year of king Hezekiah, which was the seventh year of Hoshea son of Elah king of Israel, that Shalmaneser king of Assyria came up against Samaria, and besieged it.'

  - where: 'note 30:2 “A Passover a month late”'
    claim: 'The law allowed the unclean and the traveler to keep the Passover in the second month'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/9?lang=eng'
    quote: 'If any man of you or of your posterity shall be unclean by reason of a dead body, or be in a journey afar off, yet he shall keep the passover unto the LORD.'
  - where: 'note 30:2 “A Passover a month late”'
    claim: 'Hezekiah extended both exceptions to the priests and the northern tribes'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'Hezekiah appears to have extended both of these exceptions to the priests, who needed time to sanctify themselves, and to the people from the northern tribes, who needed more time to travel to Jerusalem.'
  - where: 'note 30:2 “A Passover a month late”'
    claim: 'Davis: Hezekiah counseled rather than acting unilaterally like Uzziah; difference of disposition'
    key: davis-bended-rules
    url: 'https://mi.byu.edu/old-testament-reflections/on-bended-rules'
    quote: 'The difference between the case of Uzziah and the case of Hezekiah and his people is one of disposition rather than perfectly orthodox action. … They show they are cognizant of the exceptions they are making, and do so with humble consultation and prayer.'

  - where: 'note 30:6 “Before or after Samaria fell”'
    claim: 'The cleansing began on the first and ended on the sixteenth day of the first month'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/29?lang=eng'
    quote: 'Now they began on the first day of the first month to sanctify … and in the sixteenth day of the first month they made an end.'
  - where: 'note 30:6 “Before or after Samaria fell”'
    claim: 'Samaria besieged in the fourth year, taken in the sixth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/18?lang=eng'
    quote: 'And at the end of three years they took it: even in the sixth year of Hezekiah'
  - where: 'note 30:6 “Before or after Samaria fell”'
    claim: 'Cambridge: first year, while the north stood; not improbable that Hezekiah ventured in Israel''s fallen state what earlier kings would not have dared'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/30.htm'
    quote: 'This Passover took place in the first year of Hezekiah while the Northern Kingdom was still standing. … it is not improbable that Hezekiah ventured to do in the fallen state of Israel that which earlier kings would not have dared to do.'
  - where: 'note 30:6 “Before or after Samaria fell”'
    claim: 'Keil: 30:3 compared with 29:34 is one argument others give for the first year'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/30.htm'
    quote: 'the statement that the priests had not sufficiently sanctified themselves, 2 Chronicles 30:3, which, when compared with that in 2 Chronicles 29:34, that the number of priests who had sanctified themselves was not sufficient'
  - where: 'note 30:6 “Before or after Samaria fell”'
    claim: 'Keil: not the first year; three weeks too short; could not invite subjects of a foreign king; after Samaria fell'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/30.htm'
    quote: 'The calling of the whole people together, "from Dan to Beersheba" (2 Chronicles 30:5), could not be accomplished in three weeks. … before the ruin of the Israelitish kingdom, in inviting the Israelites of the ten tribes, he would have been addressing the subjects of a foreign king'
  - where: 'note 30:6 “Before or after Samaria fell”'
    claim: 'Keil: the kings of Assyria are Tiglath-pileser and Shalmaneser, who carried Israel away'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/30.htm'
    quote: 'that He may return (turn Himself) to the remnant which remains to you from the hand of the kings of Assyria," i.e., of Tiglath-pileser and Shalmaneser.'
  - where: 'note 30:6 “Before or after Samaria fell”'
    claim: 'Scripture Helps: Hezekiah reigned when Assyria conquered the north'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'King Hezekiah reigned in the Southern Kingdom at the time the Assyrians conquered the Northern Kingdom.'

  - where: 'note 30:8 “Give the hand to the LORD”'
    claim: 'The Hebrew of “yield yourselves” is “give hand”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="5414" morph="HVqv2mp" id="14Csz">תְּנוּ</w><seg type="x-maqqef">־</seg><w lemma="3027" morph="HNcbsa" id="14GeH">יָ֣ד</w>'
  - where: 'note 30:8 “Give the hand to the LORD”'
    claim: 'BDB: give hand = submit (1 Chr. 29:24, acknowledged him as lord); pledge (Ezra 10:19)'
    key: bdb
    url: 'https://biblehub.com/hebrew/3027.htm'
    quote: 'after נָתַן: give a pledge וִיִּתְּנוּ יָדָם לְהוֺצִיא נְשֵׁיהֶם Ezra 10:19; submit נָתַן יַד תַּחַת שְׁלֹמֹה 1 Chronicles 29:24, i.e. they acknowledged him as their lord; תְּנויָֿד ליהוה; 2 Chronicles 30:8'
  - where: 'note 30:8 “Give the hand to the LORD”'
    claim: 'BDB: 2 Kgs. 10:15 compact; 30:8 submit to the LORD; more explicitly 1 Chr. 29:24'
    key: bdb
    url: 'https://biblehub.com/hebrew/5414.htm'
    quote: 'also וַיִּתְּנוּ עֹרֶף2Chronicles 29:6 gave, i.e. turned (their) back … of compact, תְּנָה אֶתיָֿדֶ֑ךָ 2 Kings 10:15 … ׳תְּנוּ יָד לְי2Chronicles 30:8 = submit to ׳י; more explicitly, יָד תַּחַת שְׁלֹמהֹ ׳נ 1 Chronicles 29:24'
  - where: 'note 30:8 “Give the hand to the LORD”'
    claim: 'Jehu: give me thine hand'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/10?lang=eng'
    quote: 'If it be, give me thine hand. And he gave him his hand; and he took him up to him into the chariot.'

  - where: 'note 30:9 “Turn, and He will return”'
    claim: 'šûb in verse 9 for the people''s return'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="518 a" morph="HC" id="14sBo">אִם</w><seg type="x-maqqef">־</seg><w lemma="7725" n="0.0" morph="HVqi2mp" id="14RKW">תָּשׁ֖וּבוּ</w>'
  - where: 'note 30:9 “Turn, and He will return”'
    claim: 'The same verb in 7:14 “turn from their wicked ways”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="c/7725" n="1.0" morph="HC/Vqi3mp" id="14dr4">וְ/יָשֻׁ֖בוּ</w>'
  - where: 'note 30:9 “Turn, and He will return”'
    claim: 'BDB: rahum and hannun in Ex. 34:6; the reversed, later order in 2 Chr. 30:9, Nehemiah, Psalms 111, 112, 145, Joel, Jonah'
    key: bdb
    url: 'https://biblehub.com/hebrew/2587.htm'
    quote: 'elsewhere in the earlier phrase רַחוּם וְחַנּוּן Exodus 34:6 (JE) = Psalm 86:15; Psalm 103:8, or the later חַנּוּן וְרַחוּם2Chronicles 30:9; Nehemiah 9:17,31; Psalm 111:4; Psalm 112:4; Psalm 145:8; Joel 2:13; Jonah 4:2.'
  - where: 'note 30:9 “Turn, and He will return”'
    claim: 'The LORD proclaimed His name to Moses: merciful and gracious'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'And the LORD passed by before him, and proclaimed, The LORD, The LORD God, merciful and gracious, longsuffering'

  - where: 'note 30:11 “Some humbled themselves”'
    claim: 'nikneʿû in 30:11'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="3665" n="0.1" morph="HVNp3cp" id="14EeP">נִֽכְנְע֔וּ</w>'
  - where: 'note 30:11 “Some humbled themselves”'
    claim: 'The same verb in 7:14'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="c/3665" morph="HC/VNi3mp" id="14s9p">וְ/יִכָּנְע֨וּ</w>'
  - where: 'note 30:11 “Some humbled themselves”'
    claim: 'The same verb of Manasseh, 33:12'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="c/3665" morph="HC/VNw3ms" id="1414w">וַ/יִּכָּנַ֣ע</w>'
  - where: 'note 30:11 “Some humbled themselves”'
    claim: 'Manasseh humbled himself greatly'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/33?lang=eng'
    quote: 'he besought the LORD his God, and humbled himself greatly before the God of his fathers,'
  - where: 'note 30:11 “Some humbled themselves”'
    claim: 'The same verb of Rehoboam and his princes, 12:6'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="c/3665" morph="HC/VNw3mp" id="148Dn">וַ/יִּכָּנְע֥וּ</w>'
  - where: 'note 30:11 “Some humbled themselves”'
    claim: 'The same verb of Rehoboam, 12:7'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="3665" n="1.1" morph="HVNp3cp" id="14znf">נִכְנָ֔עוּ</w>'
  - where: 'note 30:11 “Some humbled themselves”'
    claim: 'The same verb of Hezekiah after his pride, 32:26'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="c/3665" morph="HC/VNw3ms" id="14yDx">וַ/יִּכָּנַ֤ע</w>'
  - where: 'note 30:11 “Some humbled themselves”'
    claim: 'The same verb of Josiah, 34:27'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="c/3665" n="1.2.2.0" morph="HC/VNw2ms" id="14VnY">וַ/תִּכָּנַ֣ע</w>'
  - where: 'note 30:11 “Some humbled themselves”'
    claim: 'The same verb of Zedekiah humbled not himself, 36:12'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="3665" n="0.0.1" morph="HVNp3ms" id="142os">נִכְנַ֗ע</w>'

  - where: 'note 30:18 “Pardon for those who came unprepared”'
    claim: 'They had traveled great distances and lacked time for purification; the Lord honored the request'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'Because many who participated in the Passover had traveled great distances, they did not have time to perform the required ritual purifications to attend the feast at the temple.'
  - where: 'note 30:18 “Pardon for those who came unprepared”'
    claim: 'Davis: national repentance from idolatry; allowances for the change'
    key: davis-bended-rules
    url: 'https://mi.byu.edu/old-testament-reflections/on-bended-rules'
    quote: 'Hezekiah and his people are doing their best to effect a national repentance from idolatry, and while they make every effort in that direction, some allowances must be made for the change to take place in a timely way.'
  - where: 'note 30:18 “Pardon for those who came unprepared”'
    claim: 'Davis: pride that bends rules for self versus humility that bends them for return'
    key: davis-bended-rules
    url: 'https://mi.byu.edu/old-testament-reflections/on-bended-rules'
    quote: 'the God of creation is quick to distinguish between the pride that bends rules for self-aggrandizement and the humility that bends them in service of genuine return and holy relationship.'
  - where: 'note 30:18 “Pardon for those who came unprepared”'
    claim: 'The Levites killed the lambs for the unclean (the text)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/30?lang=eng'
    quote: 'therefore the Levites had the charge of the killing of the passovers for every one that was not clean, to sanctify them unto the LORD.'

  - where: 'note 30:20 “The LORD healed the people”'
    claim: 'Cambridge: healed by prevention; uncleanness threatened with death (Lev. 15:31)'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/30.htm'
    quote: '20. healed the people] By prevention; no plague was allowed to break out among them, although uncleanness in the sanctuary had been threatened with death; Leviticus 15:31.'
  - where: 'note 30:20 “The LORD healed the people”'
    claim: 'Keil rejects the Lev. 15:31 explanation; sin as spiritual disease, healing the soul'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/30.htm'
    quote: 'The use of the word is explained by the fact that sin was regarded as a spiritual disease, so that רפא is to be understood of healing the soul (as Psalm 41:5), or the transgression (Hosea 14:5; Jeremiah 3:22).'
  - where: 'note 30:20 “The LORD healed the people”'
    claim: 'Davis: the Lord addressed the deeper need, spiritual wounds; hearts touched and healed'
    key: davis-bended-rules
    url: 'https://mi.byu.edu/old-testament-reflections/on-bended-rules'
    quote: 'years of estrangement from true faith and true worship had left not just outward, ritual impurity, but spiritual wounds—most of them no doubt known only to God. In the language of healing, we hear the chronicler signal that more was set right'
  - where: 'note 30:20 “The LORD healed the people”'
    claim: 'Lev. 15:31 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/15?lang=eng'
    quote: 'that they die not in their uncleanness, when they defile my tabernacle that is among them.'

  - where: 'note 30:26 “Nothing like it since Solomon”'
    claim: 'First unified Passover since Solomon after two centuries of division'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'Because the Northern and Southern Kingdoms had been divided for about two centuries, the Israelites had not experienced a unified Passover celebration since the time of King Solomon.'
  - where: 'note 30:26 “Nothing like it since Solomon”'
    claim: 'Keil: comparable only with the dedication feast of Solomon in length, sacrifices, numbers, joy; fourteen days'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/30.htm'
    quote: 'this feast could be compared only with the feast at the dedication of the temple in the time of Solomon, 2 Chronicles 7:1-10, in respect to its length, the richness of the sacrificial gifts, the multitude of those who participated, and the joyous feeling it caused'
  - where: 'note 30:26 “Nothing like it since Solomon”'
    claim: 'Keil: the gifts sufficed for another seven days'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/30.htm'
    quote: 'The gifts were bestowed for the Mazzoth festival, but were so plentiful that they sufficed for another festival of seven days.'
  - where: 'note 30:26 “Nothing like it since Solomon”'
    claim: 'Davis: the third bending came from gratitude, not necessity'
    key: davis-bended-rules
    url: 'https://mi.byu.edu/old-testament-reflections/on-bended-rules'
    quote: 'This time the rules are bent not out of necessity for lack of time or preparation, but in gratitude for the abundant mercy of God.'
  - where: 'note 30:26 “Nothing like it since Solomon”'
    claim: 'Solomon''s feast: seven days and seven days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/7?lang=eng'
    quote: 'for they kept the dedication of the altar seven days, and the feast seven days.'

  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'His healing reaches the deeper need'
    key: davis-bended-rules
    url: 'https://mi.byu.edu/old-testament-reflections/on-bended-rules'
    quote: 'the Lord addresses the deeper need, the more enduring concern'
  - where: 'christ'
    claim: 'The pardon of those who prepared their hearts; the LORD healed (the text)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/30?lang=eng'
    quote: 'And the LORD hearkened to Hezekiah, and healed the people.'
  - where: 'note 30:1 “Letters to the northern tribes”'
    claim: 'Lehi was of Manasseh yet dwelt at Jerusalem all his days'
