chapter: 17
claims:
  - where: 'when'
    claim: 'Jehoshaphat succeeded Asa at his death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/17?lang=eng'
    quote: 'And Jehoshaphat his son reigned in his stead, and strengthened himself against Israel.'
  - where: 'setting'
    claim: 'Jehoshaphat was the fourth king of Judah'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'Jehoshaphat, the fourth king of Judah, was a righteous man whose “heart was lifted up in the ways of the Lord.”'
  - where: 'setting'
    claim: 'Kings summarizes his reign: began in Ahab''s fourth year, walked in Asa''s ways, made peace with Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/22?lang=eng'
    quote: 'And Jehoshaphat the son of Asa began to reign over Judah in the fourth year of Ahab king of Israel. … And Jehoshaphat made peace with the king of Israel.'
  - where: 'setting'
    claim: 'Bible Dictionary characterizes Jehoshaphat and lists 2 Chr. 17–20 as his history'
    key: bd-jehoshaphat
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehoshaphat?lang=eng'
    quote: 'King of Judah, in close alliance with kings of Israel, but still a true worshipper of Jehovah and a religious reformer; for a history of his reign see … 2 Chr. 17:1–12; 18; 19:1–8; 20'
  - where: 'setting'
    claim: 'Verses 7–9, 10–13 and 14–19 have no parallel in Kings'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/17.htm'
    quote: '7–9 (no parallel in 1 Kin.). Jehoshaphat’s Provision for Teaching the Law … 10–13 (no parallel in 1 Kin.). The Greatness of Jehoshaphat … 14–19 (no parallel in 1 Kin.). The Number of Jehoshaphat’s Army'
  - where: 'setting'
    claim: 'Asa had taken cities in mount Ephraim; Baasha built Ramah; chapter 18 opens with the alliance with Ahab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/15?lang=eng'
    quote: 'and out of the cities which he had taken from mount Ephraim'
  - where: 'thread'
    claim: 'One older reading: the fear of the LORD on the neighbors was the blessing of the teaching mission, not a lull that gave time for it'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/17.htm'
    quote: 'This attempt of Jehoshaphat brought him this blessing, that the terror of Jahve fell upon all the surrounding kingdoms … while Berth. fails to apprehend it, saying that Jehoshaphat had time to care for the instruction of his people, because at that time the neighbouring peoples did not venture'
  - where: 'thread'
    claim: 'In Chronicles rewards and punishments are not usually delayed'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'rewards and punishments are not usually delayed in Chronicles, and people are often punished for sins or rewarded for righteousness immediately.'
  - where: 'thread'
    claim: 'Chapter 18 repeats his riches and honour and adds the alliance with Ahab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/18?lang=eng'
    quote: 'Now Jehoshaphat had riches and honour in abundance, and joined affinity with Ahab.'
  - where: 'note 17:3 “Whose first ways?”'
    claim: 'The Hebrew text names David'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'דָּוִ֤יד'
  - where: 'note 17:3 “Whose first ways?”'
    claim: 'The Septuagint lacks David'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_chronicles/17.htm'
    quote: 'And the Lord was with Josaphat, for he walked in the first ways of his father, and did not seek to idols;'
  - where: 'note 17:3 “Whose first ways?”'
    claim: 'On the shorter reading the father is Asa, whose first ways (14–15) were good and latter (16) not'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/17.htm'
    quote: 'Omit David (so LXX.), the person referred to being Asa (1 Kings 22:43). Asa’s first ways (ch. 14, 15) were good, his latter ways (ch. 16), according to the Chronicler, were evil.'
  - where: 'note 17:3 “Whose first ways?”'
    claim: 'Keil reads David''s earlier years, before Bath-sheba and the census'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/17.htm'
    quote: 'The former ways of David are his ways in the earlier years of his reign, in contrast to the later years, in which his adultery with Bathsheba (2 Samuel 11) and the sin of numbering the people (1 Chronicles 21) fall.'
  - where: 'note 17:3 “Whose first ways?”'
    claim: 'Asa relied on Syria and sought physicians, not the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/16?lang=eng'
    quote: 'yet in his disease he sought not to the LORD, but to the physicians.'
  - where: 'note 17:6 “A heart lifted up, for once in a good sense”'
    claim: 'BDB: gabah in a good sense at 2 Chr. 17:6, encouraged'
    key: bdb
    url: 'https://biblehub.com/hebrew/1361.htm'
    quote: 'a. in a good sense, encouraged in the ways of Yahweh 2 Chronicles 17:6;'
  - where: 'note 17:6 “A heart lifted up, for once in a good sense”'
    claim: 'The same verb in 2 Chr. 17:6, 26:16 and 32:25'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'וַ/יִּגְבַּ֥הּ'
  - where: 'note 17:6 “A heart lifted up, for once in a good sense”'
    claim: 'Scripture Helps calls him a righteous man whose heart was lifted up in the ways of the Lord'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'Jehoshaphat, the fourth king of Judah, was a righteous man whose “heart was lifted up in the ways of the Lord.”'
  - where: 'note 17:6 “High places taken away, and not taken away”'
    claim: 'Scripture Helps: the discrepancy is not explained; two possibilities'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'The reason for this apparent discrepancy is not explained. It is possible that some high places remained in use for legitimate worship of Jehovah. Or perhaps the spread and persistence of idolatry made it difficult for the king to completely eliminate these practices.'
  - where: 'note 17:6 “High places taken away, and not taken away”'
    claim: 'Chronicles gives the people''s unprepared hearts as the reason'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/20?lang=eng'
    quote: 'Howbeit the high places were not taken away: for as yet the people had not prepared their hearts unto the God of their fathers.'
  - where: 'note 17:9 “Teachers sent with the book”'
    claim: 'The Church footnote to “taught” points to Deut. 33:10 and 2 Chr. 15:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/17?lang=eng'
    quote: '9a “taught”: Deut. 33:10; 2 Chr. 15:3 (1–4); 2 Ne. 9:48.'
  - where: 'note 17:6 “A heart lifted up, for once in a good sense”'
    claim: 'Uzziah lifted up when strong; Hezekiah when he rendered not again for the benefit'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/26?lang=eng'
    quote: 'But when he was strong, his heart was lifted up to his destruction'
  - where: 'note 17:9 “Teachers sent with the book”'
    claim: 'The Pentateuch, the law, was written by Moses, with later traces; latter-day revelation confirms it (1 Ne. 5:10–11)'
    key: bd-pentateuch
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pentateuch?lang=eng'
    quote: 'contain the Torah or law of Israel. The Pentateuch was written by Moses … scribes and copyists have left their traces … But latter-day revelation confirms that Moses was the author of the first five books of the Bible … (1 Ne. 5:10–11; Moses 1:40–41).'
  - where: 'note 17:9 “Teachers sent with the book”'
    claim: 'The book of the law was the Pentateuch, long in existence by Jehoshaphat''s time'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/17.htm'
    quote: 'The "book of the law of Jahve" is the Pentateuch, not merely a collection of Mosaic laws, since in Jehoshaphat''s time the Mosaic book of the law (the Pentateuch) had been long in existence.'
  - where: 'note 17:9 “Teachers sent with the book”'
    claim: 'The Chronicler meant the Pentateuch; his source may have meant an earlier code within it; the five books improbably existed in present form then'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/17.htm'
    quote: 'The Chronicler no doubt means by this the Pentateuch as we have it, but in the source from which he drew the account one of the earlier codes embedded in our present Pentateuch may have been meant. It is improbable that the five books of Moses existed in the time of Jehoshaphat in the form in which we now have them.'
  - where: 'note 17:14 “An army of 1,160,000”'
    claim: 'The divisions total 1,160,000; David''s census gave Judah 470,000'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/21?lang=eng'
    quote: 'and Judah was four hundred threescore and ten thousand men that drew sword.'
  - where: 'note 17:14 “An army of 1,160,000”'
    claim: 'Keil: clearly too large, yet the divisions are proportioned, making copyists'' errors harder to believe'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/17.htm'
    quote: 'These numbers are clearly too large, and bear no proportion to the result of the numbering … under David … yet the sums of the single divisions appear duly proportioned-a fact which renders it more difficult to believe that these exaggerated numbers are the result of orthographical errors.'
  - where: 'note 17:16 “Amasiah, who volunteered”'
    claim: 'BDB: nadab, volunteer; Hithpael for war (Judg. 5:9), for service of other kinds (2 Chr. 17:16; Neh. 11:2)'
    key: bdb
    url: 'https://biblehub.com/hebrew/5068.htm'
    quote: '1 volunteer for war Judges 5:2,9; for service of other kinds 2Chronicles 17:16; Nehemiah 11:2.'
  - where: 'note 17:16 “Amasiah, who volunteered”'
    claim: 'BDB: the same form for freewill offerings for the first temple'
    key: bdb
    url: 'https://biblehub.com/hebrew/5068.htm'
    quote: '2 offer freewill-offerings for the first temple 1 Chronicles 29:5,6,9 (twice in verse)'
  - where: 'note 17:16 “Amasiah, who volunteered”'
    claim: 'The verb at 17:16 is the Hithpael participle of nadab'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'הַ/מִּתְנַדֵּ֖ב'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ, citing 3 Ne. 15:1–5'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary (see Mosiah 3:8; 15:1; 3 Ne. 15:1–5; D&C 110:1–10)'
  - where: 'christ'
    claim: 'The Lord commands His people to teach one another, with the promise of grace'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: 'Teach ye diligently and my grace shall attend you'
