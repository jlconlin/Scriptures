chapter: 7
claims:
  - where: 'when'
    claim: 'The people were sent away on the twenty-third day of the seventh month, after the feast'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/7?lang=eng'
    quote: 'And on the three and twentieth day of the seventh month he sent the people away into their tents'
  - where: 'setting'
    claim: 'Verses 1–3 (the fire) are not in 1 Kings'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/7.htm'
    quote: 'Ch. 2 Chronicles 7:1-3 (not in 1 Kings). The Sacrifices consumed by Fire from Heaven'
  - where: 'setting'
    claim: 'Verse 6 (the priests and Levites at their offices) is not in 1 Kings'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/7.htm'
    quote: '6. the priests waited on their offices] R.V. the priests stood, according to their offices. This ver. does not appear in 1 Kings.'
  - where: 'setting'
    claim: 'Verses 13–15 have no parallel in 1 Kings'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/7.htm'
    quote: '13–15. These vv. have no parallel in 1 Kings.'
  - where: 'setting'
    claim: 'The high numbers of verse 5 appear also in Kings'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/7.htm'
    quote: '5. twenty and two thousand oxen, and an hundred and twenty thousand sheep] These high numbers appear also in 1 Kings.'
  - where: 'setting'
    claim: 'Chronicles leaves out Solomon''s blessing of the congregation (1 Kgs. 8:54–61)'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/7.htm'
    quote: 'why the author of the book of Kings has omitted the account of the fire which came down from heaven upon the sacrifices, and the author of the Chronicle the blessing of the congregation (1 Kings 8:54-61).'
  - where: 'setting'
    claim: 'Kings has Solomon bless the congregation when he finished praying'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'And he stood, and blessed all the congregation of Israel with a loud voice, saying,'
  - where: 'setting'
    claim: 'The question Chronicles appears to address is whether they were still God''s people and the covenant still stood'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'In contrast, the question Chronicles appears to address is “Are we still God''s people and does the covenant still stand?"'
  - where: 'thread'
    claim: 'The LORD''s word at night begins by saying He has heard the prayer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/7?lang=eng'
    quote: 'And the Lord appeared to Solomon by night, and said unto him, I have heard thy prayer, and have chosen this place to myself for an house of sacrifice.'
  - where: 'thread'
    claim: 'Rehoboam and the princes humbled themselves and were not destroyed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/12?lang=eng'
    quote: 'They have humbled themselves; therefore I will not destroy them, but I will grant them some deliverance'
  - where: 'thread'
    claim: 'Manasseh humbled himself greatly'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/33?lang=eng'
    quote: 'And when he was in affliction, he besought the Lord his God, and humbled himself greatly before the God of his fathers,'
  - where: 'thread'
    claim: 'Zedekiah humbled not himself'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: 'and humbled not himself before Jeremiah the prophet speaking from the mouth of the Lord.'
  - where: 'note 7:1 “Fire on the offerings, glory on the house”'
    claim: 'Kings has no fire at this point; Solomon rises from prayer and blesses the people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'And he stood, and blessed all the congregation of Israel with a loud voice, saying,'
  - where: 'note 7:1 “Fire on the offerings, glory on the house”'
    claim: 'The Church''s footnote sets the fire beside Lev. 9:24 and 1 Chr. 21:26'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/7?lang=eng'
    quote: '“fire”: Lev. 9:24; 1 Chr. 21:26.'
  - where: 'note 7:1 “Fire on the offerings, glory on the house”'
    claim: 'At the tabernacle fire came from the LORD on the burnt offering and the people fell on their faces'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/9?lang=eng'
    quote: 'And there came a fire out from before the Lord, and consumed upon the altar the burnt offering and the fat: which when all the people saw, they shouted, and fell on their faces.'
  - where: 'note 7:1 “Fire on the offerings, glory on the house”'
    claim: 'The LORD answered David by fire on his altar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/21?lang=eng'
    quote: 'and called upon the Lord; and he answered him from heaven by fire upon the altar of burnt offering.'
  - where: 'note 7:1 “Fire on the offerings, glory on the house”'
    claim: 'The temple was built on Ornan''s threshingfloor, where David''s altar stood'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/3?lang=eng'
    quote: 'in the place that David had prepared in the threshingfloor of Ornan the Jebusite.'
  - where: 'note 7:1 “Fire on the offerings, glory on the house”'
    claim: 'Keil: the text does not say the glory left the temple; the glory descended in the fire seen on the house'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/7.htm'
    quote: 'Not a word is said in the text of the glory of Jahve having left the temple during Solomon''s prayer. … According to these plain words, the glory of Jahve descended upon the temple in the fire which came down from heaven.'
  - where: 'note 7:1 “Fire on the offerings, glory on the house”'
    claim: 'Keil: the fire was the confirmatory sign that the LORD accepted the sacrificial service on this altar'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/7.htm'
    quote: 'The devouring of the sacrifices upon the altar by fire from heaven was merely the confirmatory sign that the Lord, enthroned above the ark in the temple, accepted, well pleased, the sacrificial service carried on on the altar of this temple'
  - where: 'note 7:1 “Fire on the offerings, glory on the house”'
    claim: 'Keil: Kings mentioned the cloud as sufficient; Chronicles, portraying the worship, could not leave the fire unmentioned'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/7.htm'
    quote: 'the author of the book of Kings thought it sufficient to mention this sign, and passed over the second … the divine confirmation of the sacrificial worship … by fire from heaven, was so important that he could not leave it unmentioned'
  - where: 'note 7:1 “Fire on the offerings, glory on the house”'
    claim: 'The people saw the fire and the glory on the house, fell down and praised with the refrain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/7?lang=eng'
    quote: 'they bowed themselves with their faces to the ground upon the pavement, and worshipped, and praised the Lord, saying, For he is good; for his mercy endureth for ever.'
  - where: 'note 7:10 “Fourteen days, and home on the twenty-third”'
    claim: 'The Feast of Tabernacles ran from the 15th to the 21st of the seventh month, with an eighth day added'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'was celebrated on the 15th to 21st days of the seventh month. To the seven days was added an eighth, “the last day, that great day of the feast” (John 7:37), a day of holy convocation'
  - where: 'note 7:10 “Fourteen days, and home on the twenty-third”'
    claim: 'The law calls the eighth day of the feast a solemn assembly'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/23?lang=eng'
    quote: 'on the eighth day shall be an holy convocation unto you; and ye shall offer an offering made by fire unto the Lord: it is a solemn assembly'
  - where: 'note 7:10 “Fourteen days, and home on the twenty-third”'
    claim: 'Keil: the dedication ran from the 8th to the 14th, the feast 15th–21st, the closing day the 22nd'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/8.htm'
    quote: 'The feast of tabernacles lasted seven days, from the 15th to the 21st, with a closing festival on the eighth day, i.e., the 22nd of the month (Leviticus 23:33-39). This festival was preceded by the dedication of the temple from the 8th to the 14th of the month.'
  - where: 'note 7:10 “Fourteen days, and home on the twenty-third”'
    claim: 'Kings says the people were sent away on the eighth day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'On the eighth day he sent the people away: and they blessed the king, and went unto their tents joyful and glad of heart'
  - where: 'note 7:10 “Fourteen days, and home on the twenty-third”'
    claim: 'Keil: Solomon dismissed them on the evening of the eighth day and they left on the morning of the 23rd'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/8.htm'
    quote: 'Solomon sent the people away on the eighth day, i.e., on the afternoon or evening of the atzereth of the feast of tabernacles, so that on the morning of the next day, i.e., on the 23rd of the month, the people took their journey home'
  - where: 'note 7:10 “Fourteen days, and home on the twenty-third”'
    claim: 'Keil: taken strictly, Kings'' “eighth day” is at variance with Chronicles'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/8.htm'
    quote: 'if we take the words in their strict sense, is at variance with the statement in the Chronicles'
  - where: 'note 7:10 “Fourteen days, and home on the twenty-third”'
    claim: 'Keil: David is named because the temple fulfilled the promise given to him'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/8.htm'
    quote: 'David is mentioned, because the completion of the building of the temple was the fulfilment of the divine promise given to him.'
  - where: 'note 7:12 “The place the LORD would choose”'
    claim: 'The Church''s footnote sends “place” to Deut. 12:5 and 1 Kgs. 8:29, among others'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/7?lang=eng'
    quote: '“place”: Deut. 12:5 (5–28); 16:2 (2–17); 18:6 (6–8); 31:11 (9–13); 1 Kgs. 8:29 (26–30).'
  - where: 'note 7:12 “The place the LORD would choose”'
    claim: 'Moses forbade burnt offerings in every place and required them in the place the LORD would choose'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/12?lang=eng'
    quote: 'Take heed to thyself that thou offer not thy burnt offerings in every place that thou seest:'
  - where: 'note 7:12 “The place the LORD would choose”'
    claim: 'Kings says “I have hallowed this house” where Chronicles has the choice of the place for a house of sacrifice'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/9?lang=eng'
    quote: 'And the Lord said unto him, I have heard thy prayer and thy supplication, that thou hast made before me: I have hallowed this house, which thou hast built, to put my name there for ever'
  - where: 'note 7:12 “The place the LORD would choose”'
    claim: 'Solomon''s prayer asked that the LORD''s eyes and ears be open to prayer in this place'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/6?lang=eng'
    quote: 'let thine ears be attent unto the prayer that is made in this place.'
  - where: 'note 7:13 “Drought, locusts and pestilence”'
    claim: 'Solomon had prayed for the case of drought and of pestilence and locusts'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/6?lang=eng'
    quote: 'When the heaven is shut up, and there is no rain, because they have sinned against thee; yet if they pray toward this place, and confess thy name, and turn from their sin, when thou dost afflict them;'
  - where: 'note 7:13 “Drought, locusts and pestilence”'
    claim: 'Solomon''s list includes pestilence and locusts'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/6?lang=eng'
    quote: 'If there be dearth in the land, if there be pestilence, if there be blasting, or mildew, locusts, or caterpillers'
  - where: 'note 7:13 “Drought, locusts and pestilence”'
    claim: 'The Church''s footnote at “If” points to Hel. 12:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/7?lang=eng'
    quote: '“If”: Hel. 12:3.'
  - where: 'note 7:13 “Drought, locusts and pestilence”'
    claim: 'Mormon: unless the Lord chastens with famine and pestilence, His people will not remember Him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/hel/12?lang=eng'
    quote: 'And thus we see that except the Lord doth chasten his people with many afflictions, yea, except he doth visit them with death and with terror, and with famine and with all manner of pestilence, they will not remember him.'
  - where: 'note 7:13 “Drought, locusts and pestilence”'
    claim: 'In Chronicles rewards and punishments are not usually delayed'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'rewards and punishments are not usually delayed in Chronicles, and people are often punished for sins or rewarded for righteousness immediately.'
  - where: 'note 7:13 “Drought, locusts and pestilence”'
    claim: 'Both Kings and Chronicles are needed; sometimes people are punished immediately and sometimes not'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'Both Kings and Chronicles are necessary to form a nuanced view of the history of Israel … Sometimes people are punished for iniquity or blessed for righteousness immediately, but sometimes they are not.'
  - where: 'note 7:14 “Four things to do, three things promised”'
    claim: 'The promise of 7:14 in the text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/7?lang=eng'
    quote: 'If my people, which are called by my name, shall humble themselves, and pray, and seek my face, and turn from their wicked ways; then will I hear from heaven, and will forgive their sin, and will heal their land.'
  - where: 'note 7:14 “Four things to do, three things promised”'
    claim: 'Solomon''s petition for drought asked that the people pray, confess and turn'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/6?lang=eng'
    quote: 'yet if they pray toward this place, and confess thy name, and turn from their sin, when thou dost afflict them;'
  - where: 'christ'
    claim: 'The Church''s footnote at “face” points to D&C 101:38'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/7?lang=eng'
    quote: '“face”: D&C 101:38.'
  - where: 'christ'
    claim: 'D&C 101 was given concerning Saints afflicted and cast out of their land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng'
    quote: 'Verily I say unto you, concerning your brethren who have been afflicted, and persecuted, and cast out from the land of their inheritance—'
  - where: 'christ'
    claim: 'D&C 101:38 tells them to seek the face of the Lord always'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng'
    quote: 'And seek the face of the Lord always, that in patience ye may possess your souls, and ye shall have eternal life.'
  - where: 'note 7:20 “Plucked up by the roots”'
    claim: 'Kings has “cut off Israel” where Chronicles has “pluck them up by the roots”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/9?lang=eng'
    quote: 'Then will I cut off Israel out of the land which I have given them'
  - where: 'note 7:20 “Plucked up by the roots”'
    claim: 'The Church''s footnote at “roots” points to Deut. 29:28'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/7?lang=eng'
    quote: '“roots”: Deut. 29:28 (26–28).'
  - where: 'note 7:20 “Plucked up by the roots”'
    claim: 'Moses: the LORD rooted them out of their land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/29?lang=eng'
    quote: 'And the Lord rooted them out of their land in anger, and in wrath, and in great indignation, and cast them into another land, as it is this day.'
  - where: 'note 7:20 “Plucked up by the roots”'
    claim: 'The footnote glosses “evil” in verse 22 as calamity'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/7?lang=eng'
    quote: '“evil”: IE calamity.'
  - where: 'note 7:20 “Plucked up by the roots”'
    claim: 'The house was burned at the end of the book'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: 'And they burnt the house of God, and brake down the wall of Jerusalem, and burnt all the palaces thereof with fire'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'The voice of Christ after the destruction asked the people to return that He might heal them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/9?lang=eng'
    quote: 'O all ye that are spared because ye were more righteous than they, will ye not now return unto me, and repent of your sins, and be converted, that I may heal you?'
  - where: 'setting'
    claim: 'Nebuchadnezzar''s armies destroyed Jerusalem and its temple'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'In the sixth century BC, Nebuchadnezzar’s armies destroyed Jerusalem and its temple, killing and deporting thousands of people.'
  - where: 'note 7:20 “Plucked up by the roots”'
    claim: 'The survivors were carried to Babylon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: 'And them that had escaped from the sword carried he away to Babylon'
  - where: 'note 7:12 “The place the LORD would choose”'
    claim: 'Solomon asked that the LORD''s eyes be open toward the house night and day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'That thine eyes may be open toward this house night and day'
