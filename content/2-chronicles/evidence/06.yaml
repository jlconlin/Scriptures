chapter: 6
claims:
  - where: 'when'
    claim: 'The dedication took place at the feast of the seventh month'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/5?lang=eng'
    quote: 'Wherefore all the men of Israel assembled themselves unto the king in the feast which was in the seventh month.'
  - where: 'setting'
    claim: 'In chapter 5 the cloud filled the house as the singers praised'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/5?lang=eng'
    quote: 'So that the priests could not stand to minister by reason of the cloud: for the glory of the LORD had filled the house of God.'
  - where: 'setting'
    claim: 'The prayer is reproduced from 1 Kings with few verbal changes and without 1 Kgs. 8:50–53'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/6.htm'
    quote: 'The prayer is reproduced from 1 Kings with a few verbal changes and with the omission of v. 50–53.'
  - where: 'setting'
    claim: 'Chronicles gives Solomon''s words at 6:5 more completely than 1 Kgs. 8:16, which omits the choice of Jerusalem'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/6.htm'
    quote: 'in 2 Chronicles 6:5. the actual words of Solomon''s speech are more completely given than in 1 Kings 8:16, where the words, "and I have not chosen a man to be prince over my people Israel, and I have chosen Jerusalem that my name might be there," are omitted.'
  - where: 'setting'
    claim: 'The Greek of 1 Kgs. 8:16 has the choice of Jerusalem'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_kings/8.htm'
    quote: 'I have not chosen a city in any one tribe of Israel to build a house, so that my name should be there: but I chose Jerusalem that my name should be there, and I chose David to be over my people Israel.'
  - where: 'setting'
    claim: 'The Hebrew of Kings lacks the choice of Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'I chose no city out of all the tribes of Israel to build an house, that my name might be therein; but I chose David to be over my people Israel.'
  - where: 'setting'
    claim: 'Chronicles appears to address whether they were still God''s people and the covenant still stood'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'In contrast, the question Chronicles appears to address is “Are we still God''s people and does the covenant still stand?”'
  - where: 'setting'
    claim: 'Solomon''s dedicatory prayer, in 1 Kings 8 and 2 Chr. 6:12–42, is set beside Joseph Smith''s at Kirtland'
    key: sc-knowhy-814
    url: 'https://scripturecentral.org/knowhy/how-did-the-kirtland-temple-dedication-follow-ancient-patterns'
    quote: 'another temple dedicatory prayer can be found in scripture—namely, the dedicatory prayer for the temple of Solomon in Jerusalem, which appears in 1 Kings 8:22–54 and again in 2 Chronicles 6:12–42. In these parallel accounts, Solomon offers a similar dedicatory prayer to Joseph’s.'
  - where: 'thread'
    claim: 'The prayer''s cases: oath, defeat, rain, afflictions, the stranger, war, captivity'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/6.htm'
    quote: 'The subjects of the different parts of the prayer are as follows'
  - where: 'thread'
    claim: 'Verse 40 is answered in the same words at 7:15'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/6.htm'
    quote: '40. attent] i.e. attentive. Cp. 2 Chronicles 7:15 (same English word for same Heb. word).'
  - where: 'thread'
    claim: 'The LORD''s answer repeats the words of 6:40'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/7?lang=eng'
    quote: 'Now mine eyes shall be open, and mine ears attent unto the prayer that is made in this place.'
  - where: 'note 6:13 “A bronze stand shaped like a basin”'
    claim: 'Kings has Solomon stand before the altar and later rise from kneeling, without the platform'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'he arose from before the altar of the LORD, from kneeling on his knees with his hands spread up to heaven.'
  - where: 'note 6:13 “A bronze stand shaped like a basin”'
    claim: 'BDB: here a platform or stage of bronze, probably round and bowl-like'
    key: bdb
    url: 'https://biblehub.com/hebrew/3595.htm'
    quote: '4 plat form or stage of bronze (probably round, bowl-like in shape) on which, according to Chronicles, Solomon stood and kneeled 2 Chronicles 6:13.'
  - where: 'note 6:13 “A bronze stand shaped like a basin”'
    claim: 'The same word is used for the lavers at 2 Chr. 4:6 and 4:14'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'כִּיּוֹרִים֮'
  - where: 'note 6:13 “A bronze stand shaped like a basin”'
    claim: 'The lavers of chapter 4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/4?lang=eng'
    quote: 'He made also ten lavers, and put five on the right hand, and five on the left, to wash in them'
  - where: 'note 6:41 “The prayer ends with Psalm 132”'
    claim: 'Kings ends the prayer with Egypt and Moses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'For thou didst separate them from among all the people of the earth, to be thine inheritance, as thou spakest by the hand of Moses thy servant, when thou broughtest our fathers out of Egypt, O Lord GOD.'
  - where: 'note 6:41 “The prayer ends with Psalm 132”'
    claim: 'Psalm 132 is understood to commemorate David''s bringing the ark to Jerusalem'
    key: larsen-ascending-hill
    url: 'https://journal.interpreterfoundation.org/ascending-into-the-hill-of-the-lord-what-the-psalms-can-tell-us-about-the-rituals-of-the-first-temple/'
    quote: 'has long been understood to have been composed to commemorate King David’s finding of the Ark and its transfer to Jerusalem'
  - where: 'note 6:41 “The prayer ends with Psalm 132”'
    claim: 'The Chronicler''s quoting of Psalm 132 may show he knew a temple rite in which it was sung with the ark procession'
    key: larsen-ascending-hill
    url: 'https://journal.interpreterfoundation.org/ascending-into-the-hill-of-the-lord-what-the-psalms-can-tell-us-about-the-rituals-of-the-first-temple/'
    quote: 'The fact that the Chronicler (2 Chronicles 6:41) has Solomon quoting part of Psalm 132 in this context may indicate that he knew of a temple tradition in which Psalm 132 was sung to accompany a re-enactment of the procession of the Ark into the temple.'
  - where: 'note 6:41 “The prayer ends with Psalm 132”'
    claim: 'The fire and the glory follow as soon as the prayer ends'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/7?lang=eng'
    quote: 'Now when Solomon had made an end of praying, the fire came down from heaven, and consumed the burnt offering and the sacrifices; and the glory of the LORD filled the house.'
  - where: 'note 6:41 “The prayer ends with Psalm 132”'
    claim: 'David had wanted to build a house of rest for the ark'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/28?lang=eng'
    quote: 'I had in mine heart to build an house of rest for the ark of the covenant of the LORD'
  - where: 'note 6:41 “The prayer ends with Psalm 132”'
    claim: 'The Kirtland prayer ends with clothed with salvation and saints shouting for joy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/109?lang=eng'
    quote: 'And let these, thine anointed ones, be clothed with salvation, and thy saints shout aloud for joy. Amen, and Amen.'
  - where: 'note 6:42 “The mercies of David”'
    claim: 'BDB lists the phrase with Isa. 55:3 as mercies shown to David, promised in the Davidic covenant'
    key: bdb
    url: 'https://biblehub.com/hebrew/2617.htm'
    quote: 'promised in the Davidic covenant Psalm Isa 89:50; חַסְדֵי דָוִיד mercies to David Isaiah 55:3; 2Chronicles 6:42'
  - where: 'note 6:42 “The mercies of David”'
    claim: 'The Hebrew is the plural of hesed with David'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'לְ/חַֽסְדֵ֖י'
  - where: 'note 6:42 “The mercies of David”'
    claim: 'Keil reads the phrase as David''s pious deeds for the worship, unlike Isa. 55:3, and compares 32:32 and 35:26'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/6.htm'
    quote: 'There דּוד חסדי are the favours granted to David by the Lord; in 2 Chronicles 6:42, on the contrary, they are the pious deeds of David, - all that he had done for the raising and advancement of the public worship'
  - where: 'note 6:42 “The mercies of David”'
    claim: 'Keil: the same word as at 32:32 and 35:26'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/6.htm'
    quote: 'remember the pious deeds of Thy servant David." הסדים as in 2 Chronicles 32:32; 2 Chronicles 35:26, and Nehemiah 13:14.'
  - where: 'note 6:42 “The mercies of David”'
    claim: 'To turn away the face is to deny the request'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/6.htm'
    quote: 'to turn away the face of any one, i.e., to deny the request, cf. 1 Kings 2:16.'
  - where: 'note 6:42 “The mercies of David”'
    claim: 'Cambridge gives both readings and prefers David''s good deeds'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/6.htm'
    quote: 'remember the mercies of David] i.e. either shew David’s son the mercies thou didst shew to David himself (Isaiah 55:3), or (better), remember the good deeds (“mercies”; cp. 2 Chronicles 32:32) which David did, and reward his son.'
  - where: 'note 6:42 “The mercies of David”'
    claim: 'Psalm 132 opens asking the LORD to remember David, and asks for David''s sake'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/132?lang=eng'
    quote: 'For thy servant David’s sake turn not away the face of thine anointed.'
  - where: 'christ'
    claim: 'The anointed of 6:42 is listed by BDB with the Davidic dynasty with messianic ideals'
    key: bdb
    url: 'https://biblehub.com/hebrew/4899.htm'
    quote: 'Davidic dynasty with Messianic ideals attached Psalm 2:2; Psalm 18:51, = 2 Samuel 22:51; Psalm 89:39; Psalm 89:52; Psalm 132:10 2Chronicles 6:42'
  - where: 'christ'
    claim: 'The Hebrew word is mashiach'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'מְשִׁיחֶ֑י/ךָ'
  - where: 'christ'
    claim: 'Messiah means the anointed; Christ is its Greek equivalent'
    key: bd-messiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/messiah?lang=eng'
    quote: 'An Aramaic word meaning “the anointed.” … In the New Testament the deliverer is called the Christ, which is the Greek equivalent of Messiah'
  - where: 'christ'
    claim: 'Paul said God gave the sure mercies of David in raising Jesus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/13?lang=eng'
    quote: 'And as concerning that he raised him up from the dead, now no more to return to corruption, he said on this wise, I will give you the sure mercies of David.'
