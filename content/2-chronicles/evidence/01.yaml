chapter: 1
claims:
  - where: 'setting'
    claim: 'Chronicles was written as one work and divided into two in the Greek translation'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'Though originally written as a single work, Chronicles was divided into two separate volumes in the Greek translation of the Bible.'
  - where: 'setting'
    claim: 'Chronicles assumes its readers know Samuel and Kings'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'It appears that the author or authors of Chronicles assumed that readers would be familiar with the books of Samuel and Kings.'
  - where: 'setting'
    claim: 'Chronicles was most likely written after the exile, possibly in the fourth century BC'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'most scholars suggest that the books were likely written after the Babylonian exile, possibly in the fourth century BC.'
  - where: 'setting'
    claim: 'Solomon''s reign is 2 Chronicles 1–9, with the temple''s building and consecration in 2–7'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/1.htm'
    quote: 'The history of the reign of Solomon begins with his solemn sacrifice at Gibeon, and some remarks on his wealth (2 Chronicles 1); then follows the building of the temple, with the consecration of the completed holy place (2 Chronicles 2-7).'
  - where: 'setting'
    claim: 'Verse 1 echoes 1 Chr. 29:25'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/1.htm'
    quote: 'God gave His blessing to all that Solomon did for this end. With the last words cf. 1 Chronicles 29:25.'
  - where: 'setting'
    claim: 'Verses 14–17 are said in Kings at the close of Solomon''s reign'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/1.htm'
    quote: 'This statement recurs verbally in 1 Kings 10:26-29, in the concluding remarks on the riches and splendour of Solomon''s reign'
  - where: 'setting'
    claim: 'Chronicles leaves out Adonijah''s attempt, David''s charge on Joab and Shimei, the marriage to Pharaoh''s daughter and the judgment of the two women'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/1.htm'
    quote: 'in the history of Solomon there have been left unrecorded the attempt of Adonijah to usurp the throne … David''s last command in reference to Joab and Shimei; the punishment of these men and of Adonijah; Solomon''s marriage with Pharaoh''s daughter (1 Kings 1:1-3:3); his wise judgment'
  - where: 'when'
    claim: 'Solomon reigned in David''s place after David''s death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/29?lang=eng'
    quote: 'And he died in a good old age, full of days, riches, and honour: and Solomon his son reigned in his stead.'
  - where: 'thread'
    claim: 'Chronicles sets the chariots, horses and wealth here to show that God had given Solomon riches'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/1.htm'
    quote: 'In our Chronicle, on the contrary, we have in 2 Chronicles 1:14-17 only a short statement as to his chariots and horses, and the wealth in silver and gold to be found in the land, merely for the purpose of showing how God had given him riches and possessions.'
  - where: 'section 1 plain'
    claim: '“Tabernacle of the congregation” is in Hebrew “tent of meeting”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/1?lang=eng'
    quote: 'HEB tent of meeting (also v. 13).'
  - where: 'section 1 plain'
    claim: 'Verse 5 better reads that the altar “was there” rather than “he put”'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/1.htm'
    quote: 'he put] R.V. was there. In the Hebrew the position of a point makes the difference between these two translations.'
  - where: 'section 2 plain'
    claim: '“Judge” in verses 10–11 may be read “rule”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/1?lang=eng'
    quote: 'OR rule (also v. 11).'
  - where: 'section 3 plain'
    claim: '“Linen yarn” is the place name Kue'
    key: bdb
    url: 'https://biblehub.com/hebrew/4723.htm'
    quote: 'proper name, of a territory Kuë in Cilicia'
  - where: 'section 3 plain'
    claim: '“Syria” is in Hebrew Aram'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/1?lang=eng'
    quote: 'HEB Aram.'

  - where: 'note 1:3 “The king''s sacrifice at Gibeon”'
    claim: 'Kings says only that the king went to Gibeon to sacrifice'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/3?lang=eng'
    quote: 'And the king went to Gibeon to sacrifice there; for that was the great high place'
  - where: 'note 1:3 “The king''s sacrifice at Gibeon”'
    claim: 'Chronicles tells the public side of the sacrifice, with the leaders of the kingdom, and Kings the theophany; the sacrifice was the consecration of the reign'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/1.htm'
    quote: 'In 1 Kings 3 the theophany-in our text, on the contrary, that aspect of the sacrifice which connected it with the public worship-is more circumstantially narrated. … This sacrifice was no mere private sacrifice-it was the religious consecration of the opening of his reign'
  - where: 'note 1:3 “The king''s sacrifice at Gibeon”'
    claim: 'The two accounts are independent descriptions from the same sources'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/1.htm'
    quote: 'it is at once discernible that they are two independent descriptions of the same thing, but derived from the same sources.'
  - where: 'note 1:3 “The king''s sacrifice at Gibeon”'
    claim: 'Because the Mosaic altar of burnt offering was there, Gibeon was the lawful place for national sacrifice'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/1.htm'
    quote: 'Although the ark was separated from the tabernacle, yet by the latter at Gibeon was the Mosaic altar of burnt-offering, and on that account the sanctuary at Gibeon was Jahve''s dwelling, and the legal place of worship for burnt-offerings of national-theocratic import.'
  - where: 'note 1:3 “The king''s sacrifice at Gibeon”'
    claim: 'An earlier commentator, quoted by Keil, says the historian stresses the lawful place'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/1.htm'
    quote: 'As our historian here brings forward emphatically the fact that Solomon offered his burnt-offering at the legal place of worship'
  - where: 'note 1:3 “The king''s sacrifice at Gibeon”'
    claim: 'The detail on the tabernacle explains why Solomon sacrificed at Gibeon and not in Jerusalem, where David''s sacrifice had been accepted by fire'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/1.htm'
    quote: 'it is only with the purpose of explaining to his readers why Solomon offered the solemn burnt-offering in Gibeon, and not, as we should have expected from 1 Chronicles 21, in Jerusalem, that he is so circumstantial in his statements as to the tabernacle.'
  - where: 'note 1:3 “The king''s sacrifice at Gibeon”'
    claim: 'Most manuscripts read “put”; sixteenth-century editions, some manuscripts, the Septuagint and Vulgate read “there,” the better reading'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/1.htm'
    quote: 'there is found in most editions of the 16th century, and also in manuscripts, שׁם, which the lxx and Vulgate also read. The reading שׁם is unquestionably better and more correct'
  - where: 'note 1:3 “The king''s sacrifice at Gibeon”'
    claim: 'The difference between “he put” and “was there” is one point in the Hebrew'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/1.htm'
    quote: 'he put] R.V. was there. In the Hebrew the position of a point makes the difference between these two translations.'
  - where: 'note 1:3 “The king''s sacrifice at Gibeon”'
    claim: 'Kings qualifies Solomon''s love with the high places'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/3?lang=eng'
    quote: 'only he sacrificed and burnt incense in high places.'

  - where: 'note 1:5 “Sought unto it”'
    claim: 'The verb in verse 5 is dāraš'
    key: oshb-wlc
    url: 'https://biblehub.com/hebrew/1875.htm'
    quote: 'Strong''s Hebrew: 1875. דָּרַשׁ (darash) -- To seek, inquire, require, investigate, demand'
  - where: 'note 1:5 “Sought unto it”'
    claim: 'BDB: resort to, seek; with a place as object, to frequent it in worship, citing this verse and Deut. 12:5'
    key: bdb
    url: 'https://biblehub.com/hebrew/1875.htm'
    quote: '1 (tread a place,) resort to, frequent, with religious object, with accusative of location Amos 5:5; 2Chronicles 1:5, לְ local Deuteronomy 12:5.'
  - where: 'note 1:5 “Sought unto it”'
    claim: 'The Church''s footnote reads “it” as possibly the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/1?lang=eng'
    quote: 'OR Him, i.e., the Lord.'
  - where: 'note 1:5 “Sought unto it”'
    claim: 'Deut. 12:5 commands seeking the LORD''s habitation at the place He chooses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/12?lang=eng'
    quote: 'even unto his habitation shall ye seek, and thither thou shalt come'

  - where: 'note 1:7 “God appeared in a dream by night”'
    claim: 'Kings says the LORD appeared to Solomon in a dream by night, and that he awoke'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/3?lang=eng'
    quote: 'appeared to Solomon in a dream by night'
  - where: 'note 1:7 “God appeared in a dream by night”'
    claim: 'Solomon''s dream at Gibeon is a classic message dream, with a divine being speaking and no symbols to interpret'
    key: pike-lehi-dreamed
    url: 'https://rsc.byu.edu/things-which-my-father-saw/lehi-dreamed-dream-report-lehis-dream-its-biblical-context'
    quote: 'These two classic examples of message dream reports (Keret’s and Solomon’s) portray a divine being conveying a message to the dreamer. There is no symbolic imagery requiring interpretation.'
  - where: 'note 1:7 “God appeared in a dream by night”'
    claim: 'A symbolic dream, by contrast, needs interpretation, usually by someone else'
    key: pike-lehi-dreamed
    url: 'https://rsc.byu.edu/things-which-my-father-saw/lehi-dreamed-dream-report-lehis-dream-its-biblical-context'
    quote: 'Reports of symbolic dreams are typically followed by an interpretation announced by someone other than the dreamer.'
  - where: 'note 1:7 “God appeared in a dream by night”'
    claim: 'The two kinds are not sharply separated in ancient thought'
    key: pike-lehi-dreamed
    url: 'https://rsc.byu.edu/things-which-my-father-saw/lehi-dreamed-dream-report-lehis-dream-its-biblical-context'
    quote: 'this schema overemphasizes a conceptual distinction between symbolic and nonsymbolic dream revelations that does not seem to have been important to ancient Near Eastern peoples.'
  - where: 'note 1:7 “God appeared in a dream by night”'
    claim: 'From 2 Chr. 1:3–6 the tabernacle of Moses was then at Gibeon'
    key: pike-lehi-dreamed
    url: 'https://rsc.byu.edu/things-which-my-father-saw/lehi-dreamed-dream-report-lehis-dream-its-biblical-context'
    quote: 'Second Chronicles 1:3–6 indicates that the Mosaic tabernacle was then in Gibeon, even though David had brought the Ark of the Covenant into Jerusalem.'

  - where: 'note 1:9 “Thy promise unto David”'
    claim: 'The wording of Solomon''s request recalls 1 Chr. 17:23 and recurs at 2 Chr. 6:17'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/1.htm'
    quote: 'The mode of expression brings to mind 1 Chronicles 17:23, and recurs in 2 Chronicles 6:17; 1 Kings 8:26.'
  - where: 'note 1:9 “Thy promise unto David”'
    claim: 'The promise may be 1 Chr. 22:12, translatable as a promise of wisdom'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/1.htm'
    quote: 'Perhaps the particular reference is to the first words of 1 Chronicles 22:12, which may be translated as a promise, Surely the Lord will give thee wisdom and understanding.'
  - where: 'note 1:9 “Thy promise unto David”'
    claim: 'Kings'' answer ends with a conditional promise of long life'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/3?lang=eng'
    quote: 'And if thou wilt walk in my ways, to keep my statutes and my commandments, as thy father David did walk, then I will lengthen thy days.'
  - where: 'note 1:9 “Thy promise unto David”'
    claim: 'One older reading: Chronicles omits the conditional promise of long life because Solomon did not fulfil the condition'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/1.htm'
    quote: 'the conditional promise, "long life" (1 Kings 3:14), is omitted, because Solomon did not fulfil the condition, and the promise was not fulfilled.'

  - where: 'note 1:10 “To judge this thy people”'
    claim: 'The verb in verse 10 is šāpaṭ, judge, govern'
    key: oshb-wlc
    url: 'https://biblehub.com/hebrew/8199.htm'
    quote: 'Strong''s Hebrew: 8199. שָׁפַט (shaphat) -- To judge, govern, vindicate, punish'
  - where: 'note 1:10 “To judge this thy people”'
    claim: 'BDB: to act as lawgiver, judge and governor, giving law, deciding controversies and executing law'
    key: bdb
    url: 'https://biblehub.com/hebrew/8199.htm'
    quote: '1 act as law-giver, judge, governor (giving law, deciding controversies and executing law, civil, religious, political, social; both early and late)'
  - where: 'note 1:10 “To judge this thy people”'
    claim: 'The Church''s footnote gives “rule” and points to Mosiah 29:12–13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/1?lang=eng'
    quote: 'OR rule (also v. 11).'

  - where: 'note 1:3 “The king''s sacrifice at Gibeon”'
    claim: 'The Revised Version reads “was there”'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/1.htm'
    quote: 'he put] R.V. was there.'

  - where: 'note 1:16 “Horses out of Egypt and Kue”'
    claim: 'BDB reads miqwēʾ in 1 Kgs. 10:28 and 2 Chr. 1:16 as “from Kuë,” a territory in Cilicia'
    key: bdb
    url: 'https://biblehub.com/hebrew/4723.htm'
    quote: 'proper name, of a territory Kuë in Cilicia (compare KAT2. 257); מִקֹוֶה from Kuë, for ᵑ0 מִקְוֵה 1 Kings 10:28 (twice in verse) and "" מִקְוֵא2Chronicles 1:16 (twice in verse)'
  - where: 'note 1:16 “Horses out of Egypt and Kue”'
    claim: 'The word in 2 Chr. 1:16 is Strong''s 4723, twice'
    key: oshb-wlc
    url: 'https://biblehub.com/hebrew/4723.htm'
    quote: 'Strong''s Hebrew: 4723. מִקְוֶה (miqveh) -- Gathering, collection, hope'
  - where: 'note 1:16 “Horses out of Egypt and Kue”'
    claim: 'The Church''s footnote to “horses” in Deut. 17:16 points to Solomon''s horses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/17?lang=eng'
    quote: '1 Kgs. 4:26; 2 Chr. 9:28.'

  - where: 'christ'
    claim: 'The Church''s footnote to “Ask” points to 3 Ne. 28:1 and D&C 7:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/1?lang=eng'
    quote: '3 Ne. 28:1 (1–12); D&C 7:1 (1–8).'
