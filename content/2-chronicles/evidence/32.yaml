chapter: 32
claims:
  - where: 'when'
    claim: 'Sennacherib came after Hezekiah''s reform; the chapter runs to Hezekiah''s death and Manasseh''s accession'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/32?lang=eng'
    quote: 'After these things, and the establishment thereof, Sennacherib king of Assyria came, and entered into Judah'
  - where: 'setting'
    claim: 'Chapter 31 ends with Hezekiah doing his work with all his heart'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/31?lang=eng'
    quote: 'to seek his God, he did it with all his heart, and prospered.'
  - where: 'setting'
    claim: 'Kings and Isaiah tell the war at length; Chronicles gives a short narrative with some additions'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/32.htm'
    quote: 'The author of the Chronicle gives only a short narrative of the main events of the struggle; but, notwithstanding its brevity, supplies us with several not unessential additions to these detailed accounts.'
  - where: 'setting'
    claim: 'The preparations for the siege are not in 2 Kings 18 or Isaiah 36'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/32.htm'
    quote: 'Preparations of Hezekiah for the strengthening and defending of Jerusalem. - We find an account of this neither in 2 Kings 18 nor in Isaiah 36'
  - where: 'setting'
    claim: 'Kings tells the tribute Hezekiah paid at Lachish, which Chronicles does not'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/18?lang=eng'
    quote: 'And Hezekiah king of Judah sent to the king of Assyria to Lachish, saying, I have offended; return from me: that which thou puttest on me will I bear.'
  - where: 'setting'
    claim: 'The invasion was in 701 B.C.'
    key: sc-knowhy-451
    url: 'https://scripturecentral.org/knowhy/why-did-some-in-lehis-time-believe-that-jerusalem-could-not-be-destroyed'
    quote: 'Jerusalem miraculously survived an invasion attempt by Assyria, the greatest empire in the world, in 701 B.C.'
  - where: 'setting'
    claim: 'Sennacherib reigned 705–681 B.C. and was slain by his sons'
    key: bd-sennacherib
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sennacherib?lang=eng'
    quote: 'King of Assyria, 705–681 B.C. … he was slain by his sons (2 Kgs. 19:37; 2 Chr. 32:21; Isa. 37:38).'
  - where: 'setting'
    claim: 'Chapter 29: the Levites cleanse the temple'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/29?lang=eng'
    quote: 'The Levites cleanse and sanctify the house of the Lord'
  - where: 'setting'
    claim: 'Chapter 30: Hezekiah''s Passover'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/30?lang=eng'
    quote: 'Hezekiah invites all Israel to a solemn Passover in Jerusalem'
  - where: 'setting'
    claim: 'Chapter 31: the people pay tithes and offerings'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/31?lang=eng'
    quote: 'The people pay tithes and offerings'
  - where: 'setting'
    claim: 'Kings gives Hezekiah''s sickness as the reason for the envoys'' visit'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/20?lang=eng'
    quote: 'sent letters and a present unto Hezekiah: for he had heard that Hezekiah had been sick.'
  - where: 'note 32:5 “Hezekiah’s walls”'
    claim: 'Jotham built on the Ophel wall and built towers'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/27?lang=eng'
    quote: 'on the wall of Ophel he built much'
  - where: 'thread'
    claim: 'Older reading: the Chronicler''s purpose was to show how the LORD helped Hezekiah and humbled Sennacherib''s presumption'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/32.htm'
    quote: 'he wishes to show how God the Lord helped the pious King Hezekiah in this danger to his kingdom, and humbled the presumption of Sennacherib confiding in the might of his powerful army.'
  - where: 'thread'
    claim: 'Older reading: the trial of verse 31 was to try and humble Hezekiah (cf. verse 26)'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/32.htm'
    quote: 'not in order that He might plunge him into misfortune, but to try him, and to humble him (cf. 2 Chronicles 32:26).'
  - where: 'note 32:1 “After this faithfulness”'
    claim: '“Establishment” renders ʾĕmet, firmness, faithfulness, truth'
    key: bdb
    url: 'https://biblehub.com/hebrew/571.htm'
    quote: 'אֱמֶת noun feminine firmness, faithfulness, truth'
  - where: 'note 32:1 “After this faithfulness”'
    claim: 'The Hebrew of 32:1 has ʾĕmet'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'וְ/הָ/אֱמֶת֙'
  - where: 'note 32:1 “After this faithfulness”'
    claim: 'The same word in 31:20, “good and right and truth”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'וְ/הָ֣/אֱמֶ֔ת'
  - where: 'note 32:1 “After this faithfulness”'
    claim: 'A modern translation: “these acts of faithfulness”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=2+Chronicles+32&version=NRSVUE'
    quote: 'After these things and these acts of faithfulness, King Sennacherib of Assyria came and invaded Judah'
  - where: 'note 32:1 “After this faithfulness”'
    claim: 'Kings dates the invasion by the year and tells the tribute and the temple gold'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/18?lang=eng'
    quote: 'Now in the fourteenth year of king Hezekiah did Sennacherib king of Assyria come up against all the fenced cities of Judah, and took them.'
  - where: 'note 32:5 “Hezekiah’s walls”'
    claim: 'The kings kept adding to Jerusalem''s fortifications; Hezekiah fortified it heavily against Assyria; remnants of the walls have been found'
    key: seely-woods-jerusalem-destroyed
    url: 'https://scripturecentral.org/archive/books/book-chapter/how-could-jerusalem-great-city-be-destroyed'
    quote: 'In 701 BC, in the face of the impending Assyrian invasion and siege, Hezekiah once again heavily fortified Jerusalem against attack and siege … Remnants of these walls have been found in archaeological excavations in Jerusalem.'
  - where: 'note 32:5 “Hezekiah’s walls”'
    claim: 'The Broad Wall: late eighth century, Hezekiah''s period; its size; foundation of a taller superstructure; part of a system around the Western Hill'
    key: pierce-israelite-refugees
    url: 'https://rsc.byu.edu/covenant-compassion/experience-israelite-refugees'
    quote: 'uncovered a massive fortification wall dated to the late eighth century BC and the period of King Hezekiah (2 Chronicles 32:5).[20] Archaeological excavations of this so-called “Broad Wall” revealed a 65-meter (213 feet) stretch of wall 7 meters (23 feet) wide that was preserved up to 3.3 meters (11 feet) high'
  - where: 'note 32:5 “Hezekiah’s walls”'
    claim: 'The wall enclosed the Western Hill, protecting people outside the old walls; it bisects houses, some filled in for its foundation; Isaiah 22:9–11 reflects it'
    key: pierce-israelite-refugees
    url: 'https://rsc.byu.edu/covenant-compassion/experience-israelite-refugees'
    quote: 'The Broad Wall bisects several eighth-century-BC dwellings, with some houses intentionally in-filled to provide a foundation for the wall.'
  - where: 'note 32:5 “Hezekiah’s walls”'
    claim: 'The wall was a project aimed at enclosing the Western Hill and protecting people living outside the walls'
    key: pierce-israelite-refugees
    url: 'https://rsc.byu.edu/covenant-compassion/experience-israelite-refugees'
    quote: 'As a royal project aimed at enclosing the Western Hill and protecting the vulnerable population living outside the fortification walls of the Eastern Hill'
  - where: 'note 32:5 “Hezekiah’s walls”'
    claim: 'The later kings kept updating the fortifications: Uzziah built towers, Jotham continued'
    key: seely-woods-jerusalem-destroyed
    url: 'https://scripturecentral.org/archive/books/book-chapter/how-could-jerusalem-great-city-be-destroyed'
    quote: 'The later Judahite kings followed his example and continuously updated the fortifications of the capital city. The Bible notes that Uzziah “built towers” (2 Chronicles 26:9) and that his son Jotham continued the fortifications (2 Chronicles 27:3).'
  - where: 'note 32:5 “Hezekiah’s walls”'
    claim: 'The urgency that sacrificed houses is reflected in Isaiah 22:9–11'
    key: pierce-israelite-refugees
    url: 'https://rsc.byu.edu/covenant-compassion/experience-israelite-refugees'
    quote: 'The need to build this fortification “with sufficient urgency to sacrifice the houses in its way”[64] is reflected in Isaiah 22:9–11, in which the prophet chastises the leadership and people of Jerusalem'
  - where: 'note 32:5 “Hezekiah’s walls”'
    claim: 'The Gihon brought inside the city (verse 30)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/32?lang=eng'
    quote: 'This same Hezekiah also stopped the upper watercourse of Gihon, and brought it straight down to the west side of the city of David.'
  - where: 'note 32:8 “An arm of flesh”'
    claim: 'The Church''s footnote sends “flesh” to the Topical Guide, Trust Not in the Arm of Flesh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/32?lang=eng'
    quote: '8a “flesh”: TG Trust Not in the Arm of Flesh.'
  - where: 'note 32:8 “An arm of flesh”'
    claim: 'Isaiah named the problem: preoccupation with physical preparations rather than trusting in the Lord'
    key: pierce-israelite-refugees
    url: 'https://rsc.byu.edu/covenant-compassion/experience-israelite-refugees'
    quote: 'Isaiah clearly identified the primary problem with the Judahite leadership and people—namely, their preoccupation with physical preparations rather than trusting in the Lord and focusing on their covenant relationship'
  - where: 'note 32:8 “An arm of flesh”'
    claim: 'Hezekiah''s walls and water source contributed to the later feeling that Jerusalem could not fall'
    key: sc-knowhy-451
    url: 'https://scripturecentral.org/knowhy/why-did-some-in-lehis-time-believe-that-jerusalem-could-not-be-destroyed'
    quote: 'He had massive walls and towers built (2 Chronicles 32:2–8) and created a water source inside the city that would help them endure long sieges … These robust fortifications would surely have contributed to a feeling of impregnability.'
  - where: 'note 32:8 “An arm of flesh”'
    claim: 'Some in Lehi''s day still trusted in their fortifications instead of the Lord'
    key: seely-woods-jerusalem-destroyed
    url: 'https://scripturecentral.org/archive/books/book-chapter/how-could-jerusalem-great-city-be-destroyed'
    quote: 'Nevertheless, it appears that some still continued to trust in their fortifications instead of in the Lord'
  - where: 'note 32:20 “King and prophet together”'
    claim: 'Isaiah was Hezekiah''s chief adviser, of great religious and political influence in his reign'
    key: bd-isaiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/isaiah?lang=eng'
    quote: 'He had great religious and political influence during the reign of Hezekiah, whose chief advisor he was.'
  - where: 'note 32:20 “King and prophet together”'
    claim: 'The Hebrew of 32:32 has no “and” before “the book of the kings”: “in the vision of Isaiah … upon (in) the book of the kings”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'בַּ/חֲז֞וֹן יְשַֽׁעְיָ֤הוּ בֶן אָמוֹץ֙ הַ/נָּבִ֔יא עַל סֵ֥פֶר מַלְכֵי'
  - where: 'note 32:20 “King and prophet together”'
    claim: 'A modern translation reads one source: the vision of Isaiah in the Book of the Kings'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=2+Chronicles+32&version=NRSVUE'
    quote: 'Now the rest of the acts of Hezekiah and his good deeds are written in the vision of the prophet Isaiah son of Amoz in the Book of the Kings of Judah and Israel.'
  - where: 'note 32:20 “King and prophet together”'
    claim: 'Isaiah''s book is titled “The vision of Isaiah the son of Amoz”; the prayer and answer are in Isa. 37'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/1?lang=eng'
    quote: 'The vision of Isaiah the son of Amoz, which he saw concerning Judah and Jerusalem'
  - where: 'note 32:25 “A heart lifted up”'
    claim: 'Older reading: he had promised humility in his sickness (Isa. 38:15), became proud after recovering, showed it with the treasures shown to the envoys; the wrath was Isaiah''s prophecy of the treasures carried to Babylon'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/32.htm'
    quote: 'In his sickness he had promised to walk in humility all his days (Isaiah 38:15): yet he became proud after his recovery; and his pride showed itself especially in his showing all his treasures to the Babylonian embassy'
  - where: 'note 32:25 “A heart lifted up”'
    claim: 'Older reading: the wrath was Isaiah''s prophecy that the treasures would go to Babylon'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/32.htm'
    quote: 'Isaiah proclaimed this wrath to him in the prophecy that all the treasures of the king would be carried away to Babylon'
  - where: 'note 32:25 “A heart lifted up”'
    claim: 'Older reading: the judgment was postponed because of the humbling and fell in the Chaldean invasion'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/32.htm'
    quote: 'The threatened judgment was postponed because of this humiliation, and broke over the royal house and the whole kingdom only at a later time in the Chaldean invasion.'
  - where: 'note 32:25 “A heart lifted up”'
    claim: 'Isaiah 38:15, the promise to “go softly”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/38?lang=eng'
    quote: 'I shall go softly all my years in the bitterness of my soul.'
  - where: 'note 32:31 “Left to be tried”'
    claim: 'The Church''s footnote on “try” points to Deut. 8:2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/32?lang=eng'
    quote: '31a “try”: Deut. 8:2 (2–6).'
  - where: 'note 32:31 “Left to be tried”'
    claim: 'The same Hebrew word mōp̄ēṯ in 32:24 and 32:31'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'וּ/מוֹפֵ֖ת'
  - where: 'note 32:31 “Left to be tried”'
    claim: 'Kings says the envoys came because Hezekiah had been sick'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/20?lang=eng'
    quote: 'sent letters and a present unto Hezekiah: for he had heard that Hezekiah had been sick.'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'D&C 105:14, “I will fight your battles”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/105?lang=eng'
    quote: 'for, as I said in a former commandment, even so will I fulfil—I will fight your battles.'
  - where: 'christ'
    claim: 'Isaiah''s charge in 22:11 was a failure to look to the One who made the city''s water and walls'
    key: pierce-israelite-refugees
    url: 'https://rsc.byu.edu/covenant-compassion/experience-israelite-refugees'
    quote: 'by looking to and having respect for the One who made the water and the stone'
  - where: 'explore'
    claim: 'Seely and Woods on why Jerusalem was thought impregnable'
    key: seely-woods-jerusalem-destroyed
    url: 'https://scripturecentral.org/archive/books/book-chapter/how-could-jerusalem-great-city-be-destroyed'
    quote: 'Jerusalem’s deliverance led to the erroneous belief that the holy city was impregnable.'
