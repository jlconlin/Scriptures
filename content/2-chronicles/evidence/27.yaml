chapter: 27
claims:
  - where: 'when'
    claim: 'Jotham reigned sixteen years; he had governed the people while his father was a leper'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/26?lang=eng'
    quote: 'And Uzziah the king was a leper unto the day of his death, and dwelt in a several house, being a leper; for he was cut off from the house of the LORD: and Jotham his son was over the king’s house, judging the people of the land.'
  - where: 'setting'
    claim: 'Jotham governed the people during Uzziah''s leprosy, his father shut out of the house of the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/26?lang=eng'
    quote: 'for he was cut off from the house of the LORD: and Jotham his son was over the king’s house, judging the people of the land.'
  - where: 'setting'
    claim: 'The Bible Dictionary dates Jotham''s reign 758–742 B.C. and lists Isaiah, Hosea and Micah as dated by him'
    key: bd-jotham
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jotham?lang=eng'
    quote: '(2) King of Judah, 758–742 B.C. (2 Kgs. 15:5, 32–38; 2 Chr. 27; Isa. 1:1; 7:1; Hosea 1:1; Micah 1:1).'
  - where: 'setting'
    claim: 'Kings: the high places stayed, Jotham built the higher gate, and in his days the LORD began to send Rezin and Pekah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'He built the higher gate of the house of the LORD. … In those days the LORD began to send against Judah Rezin the king of Syria, and Pekah the son of Remaliah.'
  - where: 'setting'
    claim: 'Chronicles tells the Syrian and Israelite attack under Ahaz; Ahaz walked in the ways of the kings of Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/28?lang=eng'
    quote: 'For he walked in the ways of the kings of Israel, and made also molten images for Baalim. … Wherefore the LORD his God delivered him into the hand of the king of Syria … And he was also delivered into the hand of the king of Israel'
  - where: 'setting'
    claim: 'Isaiah, Hosea and Micah date their words by Jotham among other kings'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/1?lang=eng'
    quote: 'The word of the LORD that came to Micah the Morasthite in the days of Jotham, Ahaz, and Hezekiah, kings of Judah'
  - where: 'setting'
    claim: 'Hosea dates his words by Jotham among other kings'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/1?lang=eng'
    quote: 'The word of the LORD that came unto Hosea, the son of Beeri, in the days of Uzziah, Jotham, Ahaz, and Hezekiah, kings of Judah'
  - where: 'thread'
    claim: 'Uzziah''s successes led to pride and an overreach of his authority'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'Uzziah’s successes as king led to a prideful heart and an overreach of his authority.'
  - where: 'thread'
    claim: 'Uzziah strengthened himself; when strong his heart was lifted up and he went into the temple'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/26?lang=eng'
    quote: 'But when he was strong, his heart was lifted up to his destruction: for he transgressed against the LORD his God, and went into the temple of the LORD to burn incense upon the altar of incense.'
  - where: 'thread'
    claim: 'One older reading: Jotham made his ways firm, walked steadfastly, and did not infringe the rights of the priesthood as Uzziah did'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/27.htm'
    quote: 'because he made his ways firm before Jahve, i.e., walked stedfastly before Jahve; did not incur guilt by falling away into idolatry, or by faithless infringement of the rights of the Lord (as Uzziah did by his interference with the rights of the priesthood).'
  - where: 'thread'
    claim: 'Uzziah built towers in Jerusalem and the desert, as Jotham builds'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/26?lang=eng'
    quote: 'Moreover Uzziah built towers in Jerusalem at the corner gate'
  - where: 'thread'
    claim: 'In Jotham''s days the LORD began to send Rezin and Pekah against Judah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'In those days the LORD began to send against Judah Rezin the king of Syria, and Pekah the son of Remaliah.'
  - where: 'note 27:2 “Two limits on a good reign”'
    claim: 'Kings'' limitation on Jotham is the high places'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'Howbeit the high places were not removed: the people sacrificed and burned incense still in the high places.'
  - where: 'note 27:2 “Two limits on a good reign”'
    claim: 'In 27:2 the verb bôʾ with the hêkal of the LORD'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'לֹא … בָ֖א … הֵיכַ֣ל'
  - where: 'note 27:2 “Two limits on a good reign”'
    claim: 'In 26:16 the same verb and the hêkal of the LORD'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'וַ/יָּבֹא֙ … הֵיכַ֣ל'
  - where: 'note 27:2 “Two limits on a good reign”'
    claim: 'The limitation refers to Uzziah''s intrusion; not in Kings because Kings omits the intrusion; the people''s corruption covers the high places and the moral corruption the prophets censure'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/27.htm'
    quote: 'with the single limitation that he did not go into the sanctuary of Jahve (cf. 2 Chronicles 26:16.). This remark is not found in 2 Kings 15, because there Uzziah''s intrusion into the temple is also omitted.'
  - where: 'note 27:2 “Two limits on a good reign”'
    claim: 'The people''s corruption: the high places and the moral corruption the prophets of that time censure'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/27.htm'
    quote: 'This refers, indeed, to the continuation of the worship in the high places, but hints also at the deep moral corruption which the prophets of that time censure (cf. especially Isaiah 2:5., … Micah 1:5; Micah 2:1.).'
  - where: 'note 27:2 “Two limits on a good reign”'
    claim: 'Uzziah went into the temple to burn incense and became a leper there'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/26?lang=eng'
    quote: 'went into the temple of the LORD to burn incense upon the altar of incense.'
  - where: 'setting'
    claim: 'Isaiah dates his vision partly to Jotham''s days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/1?lang=eng'
    quote: 'The vision of Isaiah the son of Amoz, which he saw concerning Judah and Jerusalem in the days of Uzziah, Jotham, Ahaz, and Hezekiah, kings of Judah.'
  - where: 'note 27:2 “Two limits on a good reign”'
    claim: 'Isaiah 2:7–8 read against the prosperity revived under Uzziah and sustained through Jotham'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/2.htm'
    quote: 'The glory of Solomon, which revived under Uzziah''s fifty-two years'' reign, and was sustained through Jotham''s reign of sixteen years, carried with it the curse of the law'
  - where: 'note 27:5 “Ammon brought under tribute”'
    claim: 'The Ammonites: descended from Lot, east of Gilead, subdued by David, independent after him and bitter enemies of Israel until Assyria and Chaldea'
    key: bd-ammon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ammon?lang=eng'
    quote: 'A tribe descended from Lot … settled east of Mount Gilead … finally reduced to subjection by David … They regained their independence after David’s death and maintained it, as allies of their Aramean neighbors and bitter enemies of Israel, till they fell under the power of Assyria and Chaldea'
  - where: 'note 27:5 “Ammon brought under tribute”'
    claim: 'Ammon came against Jehoshaphat and brought gifts to Uzziah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/26?lang=eng'
    quote: 'And the Ammonites gave gifts to Uzziah: and his name spread abroad even to the entering in of Egypt; for he strengthened himself exceedingly.'
  - where: 'note 27:5 “Ammon brought under tribute”'
    claim: 'Ammon came with Moab against Jehoshaphat'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/20?lang=eng'
    quote: 'the children of Moab, and the children of Ammon, and with them other beside the Ammonites, came against Jehoshaphat to battle.'
  - where: 'note 27:5 “Ammon brought under tribute”'
    claim: 'Kings tells no war of Jotham''s with Ammon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'Howbeit the high places were not removed: the people sacrificed and burned incense still in the high places. He built the higher gate of the house of the LORD.'
  - where: 'note 27:6 “He ordered his ways”'
    claim: 'The verb is hēkîn, hiphil of kûn'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'הֵכִ֣ין … דְּרָכָ֔י/ו'
  - where: 'note 27:6 “He ordered his ways”'
    claim: 'In moral sense the hiphil means direct one''s step, order aright; BDB lists 27:6 with the heart passages 12:14, 19:3, 30:19, 20:33'
    key: bdb
    url: 'https://biblehub.com/hebrew/3559.htm'
    quote: 'in moral and spiritual sense, direct one''s step (צַעֲדוֺ) = order aright … 2Chronicles 27:6 … followed by לֵב … 2Chronicles 12:14, so 2 Chronicles 19:3; 30:19 … so (with לֵאלֹהִים) 2 Chronicles 20:33'
  - where: 'note 27:6 “He ordered his ways”'
    claim: 'The Church''s footnote gives the Hebrew as ordered, a steady course'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/27?lang=eng'
    quote: 'HEB ordered; i.e., maintained a steady course.'
  - where: 'note 27:6 “He ordered his ways”'
    claim: 'Rehoboam did evil because he prepared not his heart'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/12?lang=eng'
    quote: 'And he did evil, because he prepared not his heart to seek the LORD.'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'Psalm 119:5 uses the same root, in the niphal (27:6 is hiphil), of ways being directed aright'
    key: bdb
    url: 'https://biblehub.com/hebrew/3559.htm'
    quote: '2 in moral sense, be directed aright, of ways Proverbs 4:26; Psalm 119:5'
  - where: 'christ'
    claim: 'Uzziah''s successes led to pride and an overreach of his authority'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'Uzziah’s successes as king led to a prideful heart and an overreach of his authority.'
  - where: 'christ'
    claim: 'Jotham became mighty because he prepared his ways before the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/27?lang=eng'
    quote: 'So Jotham became mighty, because he prepared his ways before the LORD his God.'
  - where: 'explore'
    claim: 'Isaiah 2''s proud and prosperous Judah read against the reigns of Uzziah and Jotham'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/2.htm'
    quote: 'It was by erecting fortifications for offence and defence, both lofty and steep … that Uzziah and Jotham especially endeavoured to serve Jerusalem and the land at large.'
