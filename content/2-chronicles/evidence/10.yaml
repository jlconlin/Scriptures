chapter: 10
claims:
  - where: 'when'
    claim: 'Rehoboam succeeded Solomon at his death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/9?lang=eng'
    quote: 'And Solomon slept with his fathers, and he was buried in the city of David his father: and Rehoboam his son reigned in his stead.'
  - where: 'setting'
    claim: 'Scripture Helps divides 2 Chr. 10–35 as the division of the kingdom and the kings of Judah'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: '2 Chronicles 10–35: The division of the kingdom and the history of the kings of Judah.'
  - where: 'setting'
    claim: '2 Chronicles focuses on Judah and mentions the northern kingdom only where it interacts with Judah'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'The book of 2 Chronicles primarily focuses on events in the Southern Kingdom of Judah. It generally mentions the Northern Kingdom only in the context of its interactions with Judah.'
  - where: 'setting'
    claim: 'One older reading: after the revolt the Chronicler confines himself to Judah and tells its first kings at greater length than Kings'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/10.htm'
    quote: 'the author of the Chronicle narrates the history of the kingdom of Judah - to which he confines himself, to the exclusion of the history of the kingdom of the ten tribes - at much greater length than the author of the books of Kings has done.'
  - where: 'setting'
    claim: 'The chapter tells 1 Kgs. 12:1–19 with only small differences of form'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/10.htm'
    quote: 'This event is narrated in our chapter, except in so far as a few unessential differences in form are concerned, exactly as we have it in 1 Kings 12:1-19'
  - where: 'setting'
    claim: 'Kings goes on to tell that the tribes made Jeroboam king, which Chronicles does not'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/12?lang=eng'
    quote: 'they sent and called him unto the congregation, and made him king over all Israel: there was none that followed the house of David, but the tribe of Judah only.'
  - where: 'setting'
    claim: 'The calves appear later in Chronicles where the Levites come to Judah and in Abijah''s speech'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/13?lang=eng'
    quote: 'and there are with you golden calves, which Jeroboam made you for gods.'
  - where: 'setting'
    claim: 'Kings tells that Jeroboam set up the calves at Bethel and Dan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/12?lang=eng'
    quote: 'And he set the one in Beth-el, and the other put he in Dan.'
  - where: 'setting'
    claim: 'The Levites Jeroboam cast off came to Judah; he ordained priests for the calves'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/11?lang=eng'
    quote: 'for Jeroboam and his sons had cast them off from executing the priest’s office unto the LORD'
  - where: 'thread'
    claim: 'The next chapter has the LORD forbid Rehoboam''s war: this thing is done of me'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/11?lang=eng'
    quote: 'Ye shall not go up, nor fight against your brethren: return every man to his house: for this thing is done of me.'
  - where: 'note 10:2 “Jeroboam, whom Chronicles has not introduced”'
    claim: 'Chronicles names Jeroboam before this only in its list of records of Solomon''s acts'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/9?lang=eng'
    quote: 'in the prophecy of Ahijah the Shilonite, and in the visions of Iddo the seer against Jeroboam the son of Nebat?'
  - where: 'note 10:2 “Jeroboam, whom Chronicles has not introduced”'
    claim: 'Chronicles appears to assume its readers know Samuel and Kings'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'It appears that the author or authors of Chronicles assumed that readers would be familiar with the books of Samuel and Kings.'
  - where: 'note 10:2 “Jeroboam, whom Chronicles has not introduced”'
    claim: 'Kings tells that Jeroboam fled to Egypt and stayed there until Solomon died'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: 'Solomon sought therefore to kill Jeroboam. And Jeroboam arose, and fled into Egypt, unto Shishak king of Egypt, and was in Egypt until the death of Solomon.'
  - where: 'note 10:2 “Jeroboam, whom Chronicles has not introduced”'
    claim: 'Solomon made Jeroboam ruler over all the charge of the house of Joseph'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: 'he made him ruler over all the charge of the house of Joseph.'
  - where: 'note 10:2 “Jeroboam, whom Chronicles has not introduced”'
    claim: 'Jeroboam was of Ephraim, the tribe that led the revolt against Judah and David''s family'
    key: bd-jeroboam
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeroboam?lang=eng'
    quote: 'the first king of divided kingdom of Israel; a member of the tribe of Ephraim, which led the revolt against the house of Judah and family of David.'
  - where: 'note 10:2 “Jeroboam, whom Chronicles has not introduced”'
    claim: 'Ephraim''s jealousy of Judah largely brought about the separation, and Rehoboam tried in vain to satisfy it by going to Shechem'
    key: bd-ephraim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ephraim?lang=eng'
    quote: 'It was Ephraim’s jealousy of Judah that in great measure brought about the separation of the two kingdoms and that Rehoboam in vain tried to satisfy by going to Shechem to be crowned.'
  - where: 'note 10:7 “Kindness where Kings has service”'
    claim: 'Kings'' wording of the elders'' counsel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/12?lang=eng'
    quote: 'If thou wilt be a servant unto this people this day, and wilt serve them, and answer them, and speak good words to them, then they will be thy servants for ever.'
  - where: 'note 10:7 “Kindness where Kings has service”'
    claim: 'One older reading: the Chronicler softened the parallel''s words, too blunt for Rehoboam and for him'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/10.htm'
    quote: 'The Chronicler has softened the forcible words of the parallel passage (1 Kings 12:7), “If thou wilt be a servant unto this people this day, and wilt serve them.” The words which were too blunt for Rehoboam were also too blunt for the Chronicler.'
  - where: 'note 10:15 “The word of Ahijah, which Chronicles assumes”'
    claim: 'Chronicles names the prophecy of Ahijah the Shilonite among the records of Solomon''s acts'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/9?lang=eng'
    quote: 'Now the rest of the acts of Solomon, first and last, are they not written in the book of Nathan the prophet, and in the prophecy of Ahijah the Shilonite'
  - where: 'note 10:15 “The word of Ahijah, which Chronicles assumes”'
    claim: 'Kings tells Ahijah''s torn garment and the promise of ten tribes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: 'Take thee ten pieces: for thus saith the LORD, the God of Israel, Behold, I will rend the kingdom out of the hand of Solomon, and will give ten tribes to thee'
  - where: 'note 10:15 “The word of Ahijah, which Chronicles assumes”'
    claim: 'Kings gives the reason: they had forsaken the LORD and worshipped other gods'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: 'Because that they have forsaken me, and have worshipped Ashtoreth the goddess of the Zidonians, Chemosh the god of the Moabites, and Milcom the god of the children of Ammon'
  - where: 'note 10:18 “Hadoram, over the forced labor”'
    claim: 'Adoniram, abbreviated Adoram and called Hadoram at 2 Chr. 10:18, was over the levy of forced labor under David, Solomon and Rehoboam, and was stoned'
    key: bd-adoniram
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/adoniram?lang=eng'
    quote: 'My Lord is exalted (sometimes abbreviated into Adoram). The officer “over the levy” who superintended the forced labor employed in public works during the reigns of David, Solomon, and Rehoboam (2 Sam. 20:24; 1 Kgs. 4:6; 5:14; 12:18); death of, by stoning (2 Chr. 10:18, where he is called Hadoram).'
  - where: 'note 10:18 “Hadoram, over the forced labor”'
    claim: '“Tribute” at 2 Chr. 10:18 is the Hebrew mas'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'הַ/מַּ֔ס'
  - where: 'note 10:18 “Hadoram, over the forced labor”'
    claim: '“Levy” at 1 Kgs. 5:14, where Adoniram is over it, is the same word mas'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'הַ/מַּֽס'
  - where: 'christ'
    claim: 'The joined sticks of Ezekiel 37 represent the future reunification of Israel and Judah under one king'
    key: scripture-helps-ezek
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'The Lord used the symbolic act of joining two sticks to represent the future reunification of Israel and Judah into one nation under a single king.'
  - where: 'christ'
    claim: '“My servant David” in Ezekiel (34:23, the same name as 37:24) refers to Jesus Christ, the Good Shepherd, a descendant of David, not King David, who died about four centuries before'
    key: scripture-helps-ezek
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'This does not refer to King David, who died about four centuries before Ezekiel’s ministry. Rather, it is a reference to Jesus Christ, the Good Shepherd, who was a descendant of David.'
  - where: 'christ'
    claim: 'Through the gospel of Jesus Christ the envy of Judah and Ephraim shall cease'
    key: bd-ephraim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ephraim?lang=eng'
    quote: 'The time will come when, through the operation of the gospel of Jesus Christ, the envy of Judah and Ephraim shall cease (Isa. 11:12–13).'
  - where: 'christ'
    claim: 'The Lord''s word to the Saints: be one'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/38?lang=eng'
    quote: 'I say unto you, be one; and if ye are not one ye are not mine.'
