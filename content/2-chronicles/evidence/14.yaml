chapter: 14
claims:
  - where: 'when'
    claim: 'Asa succeeded Abijah; the land was quiet ten years; Zerah came after'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/14?lang=eng'
    quote: 'So Abijah slept with his fathers, and they buried him in the city of David: and Asa his son reigned in his stead. In his days the land was quiet ten years.'
  - where: 'setting'
    claim: 'Kings tells Asa''s reign in 1 Kgs. 15:9–24: the reform, the bribe to Syria against Baasha, the diseased feet; Chronicles gives a much more detailed account of his forty-one years'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/14.htm'
    quote: 'In 1 Kings 15:9-24 it is merely recorded of Asa, that he reigned forty-one years … The Chronicle also characterizes Asa as a pious king … but gives, as to other matters, a much more detailed account of his reign of forty-one years.'
  - where: 'setting'
    claim: 'Azariah went out to meet Asa, pointed to the victory, and called king and people to remain faithful; covenant renewed (ch. 15)'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/14.htm'
    quote: 'Then we learn that the prophet Azariah, the son of Oded, came to meet him, who, pointing to the victory which the Lord had granted them, called upon the king and the people to remain stedfast in their fidelity to the Lord'
  - where: 'setting'
    claim: '2 Chronicles records kings of Judah not in Kings; Asa sought the Lord in peaceful and difficult times; his faith wavered later'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'But 2 Chronicles also contains details about some of the kings of Judah that are not recorded in the books of Kings. One such king was Asa, who sought the Lord during peaceful and difficult times.'
  - where: 'setting'
    claim: 'Verses 1–5 run beside 1 Kgs. 15:8–12; verses 9–15 have no parallel in Kings'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/14.htm'
    quote: '9–15 (no parallel in Kings). The Battle of Mareshah'
  - where: 'setting'
    claim: 'Hanani rebukes Asa for relying on Syria and recalls the Ethiopians'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/16?lang=eng'
    quote: 'Were not the Ethiopians and the Lubims a huge host, with very many chariots and horsemen? yet, because thou didst rely on the LORD, he delivered them into thine hand.'
  - where: 'thread'
    claim: 'Asa sought the Lord in peaceful and difficult times'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'One such king was Asa, who sought the Lord during peaceful and difficult times.'
  - where: 'thread'
    claim: 'The verb of "we rest on thee" means to lean or support oneself, figuratively to trust'
    key: bdb
    url: 'https://biblehub.com/hebrew/8172.htm'
    quote: '[שָׁעַן] verb Niph`al lean, support oneself'
  - where: 'thread'
    claim: 'In Chronicles rewards and punishments are not usually delayed'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'rewards and punishments are not usually delayed in Chronicles, and people are often punished for sins or rewarded for righteousness immediately.'
  - where: 'section 3 plain'
    claim: 'Plain rendering of verse 13: Asa''s army called the LORD''s host'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/14.htm'
    quote: 'מחנהוּ, i.e., Asa''s army is called Jahve''s, because Jahve fought in and with it against the enemy.'
  - where: 'note 14:1 “Ten quiet years, and Kings’ war with Baasha”'
    claim: 'Kings: Baasha reigned from Asa''s third year and there was war all their days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/15?lang=eng'
    quote: 'And there was war between Asa and Baasha king of Israel all their days.'
  - where: 'note 14:1 “Ten quiet years, and Kings’ war with Baasha”'
    claim: 'Chronicles: no more war to Asa''s thirty-fifth year; Baasha came up in the thirty-sixth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/15?lang=eng'
    quote: 'And there was no more war unto the five and thirtieth year of the reign of Asa.'
  - where: 'note 14:3 “High places taken away, and high places that remained”'
    claim: 'Scripture Helps sets 14:2–5 beside 15:16–17 as a situation similar to Jehoshaphat''s'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'A similar situation is described in the account of Asa (compare 2 Chronicles 14:2–5 with 15:16–17).'
  - where: 'note 14:3 “High places taken away, and high places that remained”'
    claim: 'The reason for the discrepancy is not explained; two possibilities'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'The reason for this apparent discrepancy is not explained. It is possible that some high places remained in use for legitimate worship of Jehovah. Or perhaps the spread and persistence of idolatry made it difficult for the king to completely eliminate these practices.'
  - where: 'note 14:3 “High places taken away, and high places that remained”'
    claim: 'Chronicles 15:17 says the high places were not taken away'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/15?lang=eng'
    quote: 'But the high places were not taken away out of Israel: nevertheless the heart of Asa was perfect all his days.'
  - where: 'note 14:6 “Fortresses in the quiet years”'
    claim: 'Asa raised the army, threw off the Egyptian yoke, rebuilt fortresses destroyed by Sheshonk; no Egyptian invasion for 250 years'
    key: bd-asa
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/asa?lang=eng'
    quote: 'He raised the army to a state of efficiency, threw off the Egyptian yoke, and rebuilt the fortresses destroyed by Sheshonk. After this time there was no invasion from Egypt for more than 250 years.'
  - where: 'note 14:6 “Fortresses in the quiet years”'
    claim: 'Shishak took Judah''s fenced cities in Rehoboam''s day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/12?lang=eng'
    quote: 'And he took the fenced cities which pertained to Judah, and came to Jerusalem.'
  - where: 'note 14:6 “Fortresses in the quiet years”'
    claim: 'Shishak came up in Rehoboam''s fifth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/12?lang=eng'
    quote: 'in the fifth year of king Rehoboam Shishak king of Egypt came up against Jerusalem'
  - where: 'note 14:6 “Fortresses in the quiet years”'
    claim: 'Kings mentions the cities Asa built'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/15?lang=eng'
    quote: 'The rest of all the acts of Asa, and all his might, and all that he did, and the cities which he built'
  - where: 'note 14:7 “Rest because they sought the LORD”'
    claim: 'Chronicles and Kings agree on blessing for righteousness; Chronicles does not usually delay reward; Kings shows delayed punishment'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'Both Chronicles and the Deuteronomistic History are in broad agreement on the issue of blessings for righteousness and punishment for unrighteousness, but Chronicles nuances the Deuteronomistic understanding of the timing of these events.'
  - where: 'note 14:7 “Rest because they sought the LORD”'
    claim: 'In Chronicles rewards and punishments are not usually delayed; often rewarded immediately'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'rewards and punishments are not usually delayed in Chronicles, and people are often punished for sins or rewarded for righteousness immediately.'
  - where: 'note 14:7 “Rest because they sought the LORD”'
    claim: 'Kings: punishment can come even if delayed for a time'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'punishment comes from disobedience, even if that punishment is delayed for a time.'
  - where: 'note 14:7 “Rest because they sought the LORD”'
    claim: 'After prophetic counsel Judah made a covenant to seek the Lord, a renewal of the Sinai covenant'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'Asa responded to prophetic counsel to remove idols from his kingdom and gathered his people to Jerusalem, where they made a covenant to seek the Lord. This is one of many instances in which members of the house of Israel renewed the covenant that had been made at Mount Sinai.'
  - where: 'note 14:7 “Rest because they sought the LORD”'
    claim: 'Asa sought the Lord in peaceful and difficult times'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'One such king was Asa, who sought the Lord during peaceful and difficult times.'
  - where: 'note 14:7 “Rest because they sought the LORD”'
    claim: 'Azariah: if ye seek him, he will be found of you'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/15?lang=eng'
    quote: 'The LORD is with you, while ye be with him; and if ye seek him, he will be found of you; but if ye forsake him, he will forsake you.'
  - where: 'note 14:9 “Zerah the Cushite and his host”'
    claim: '"Ethiopian" is the Hebrew Kushi, a man of Cush'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'הַ/כּוּשִׁ֗י'
  - where: 'note 14:9 “Zerah the Cushite and his host”'
    claim: 'Cush lay south of Egypt, from Syene to near Khartoum, including Nubia'
    key: bd-ethiopia
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ethiopia?lang=eng'
    quote: 'Extended from Syene on the frontier of Egypt southward to the neighborhood of Khartoum, at the junction of the Blue and White Nile. It included the modern Nubia'
  - where: 'note 14:9 “Zerah the Cushite and his host”'
    claim: 'One older view: Zerah an Ethiopian, not an Egyptian, prince'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/14.htm'
    quote: 'holds Zerah to be an Ethiopian and not an Egyptian prince'
  - where: 'note 14:9 “Zerah the Cushite and his host”'
    claim: 'Not improbably an Arabian leader, since Cush included Arabian tribes and Arabians and Cushites are neighbors in 21:16'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/14.htm'
    quote: 'It is therefore not improbable that the leader of the inroad was an Arabian (Sabean) and not an Ethiopian.'
  - where: 'note 14:9 “Zerah the Cushite and his host”'
    claim: 'A thousand thousand expresses the greatest possible number'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/14.htm'
    quote: 'rests upon a rough estimate, in which 1000 times 1000 expresses the idea of the greatest possible number.'
  - where: 'note 14:9 “Zerah the Cushite and his host”'
    claim: 'The number signifies a host too great to number, not literal'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/14.htm'
    quote: 'The number a thousand thousand is probably meant to signify that the host was too great to number; it is not to be taken literally.'
  - where: 'note 14:9 “Zerah the Cushite and his host”'
    claim: 'Judah''s numbers are given to show that Asa hoped not in his army but in the LORD'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/14.htm'
    quote: 'The number of the men in Judah capable of bearing arms is mentioned only to show that Asa set his hope of victory over the innumerable host of the Cushites not on the strength of his army, but on the all-powerful help of the Lord'
  - where: 'note 14:9 “Zerah the Cushite and his host”'
    claim: 'Mareshah lay between Hebron and Ashdod'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/14.htm'
    quote: 'The Cushites pressed forward to Mareshah, i.e., Marissa, between Hebron and Ashdod (see on 2 Chronicles 11:8).'
  - where: 'note 14:9 “Zerah the Cushite and his host”'
    claim: 'Mareshah was one of Rehoboam''s fortified cities'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/11?lang=eng'
    quote: 'And Gath, and Mareshah, and Ziph,'
  - where: 'note 14:11 “Leaning on the LORD”'
    claim: 'šāʿan: Niphal lean, support oneself; figuratively trust upon a person; 2 Chr. 14:10 (Heb.) and 16:7, 8'
    key: bdb
    url: 'https://biblehub.com/hebrew/8172.htm'
    quote: 'lean (figurative = trust) upon, עַל person king Isaiah 10:20; Ezekiel 29:7; 2Chronicles 16:7'
  - where: 'note 14:11 “Leaning on the LORD”'
    claim: 'The same verb (H8172) in 14:11 and three times in 16:7–8'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'נִשְׁעַ֔נּוּ … בְּ/הִשָּׁ֨עֶנְ/ךָ֜ … נִשְׁעַ֨נְתָּ֙ … וּ/בְ/הִשָּֽׁעֶנְ/ךָ֥'
  - where: 'note 14:11 “Leaning on the LORD”'
    claim: 'The "rest" of verse 7 is a different verb (H5117, nuach)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'וַ/יָּ֥נַֽח'
  - where: 'note 14:11 “Leaning on the LORD”'
    claim: 'Hanani: relied on the king of Syria, not on the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/16?lang=eng'
    quote: 'Because thou hast relied on the king of Syria, and not relied on the LORD thy God, therefore is the host of the king of Syria escaped out of thine hand.'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'Come, Follow Me reads Asa''s chapters as trusting in God bringing peace'
    key: cfm-ot-2026-30
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/30?lang=eng'
    quote: '2 Chronicles 14–16: Trusting in God will bring me peace.'
  - where: 'christ'
    claim: 'Faith based on knowing God and Christ, not on what God did in a particular moment'
    key: christofferson-relationship-god
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2022/04/41christofferson?lang=eng'
    quote: 'Their faith was based not on what God did or did not do in a particular circumstance or moment in time but on knowing Him as their benevolent Father and Jesus Christ as their faithful Redeemer.'
  - where: 'explore'
    claim: 'Come, Follow Me pairs Asa''s prayer with Jehoshaphat''s'
    key: cfm-ot-2026-30
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/30?lang=eng'
    quote: 'You could help your children discover how King Asa and King Jehoshaphat responded to challenges by trusting in the Lord (see 2 Chronicles 14:11; 20:3–5, 12).'
  - where: 'section 1 plain'
    claim: 'The “images” of verse 3 (maṣṣēbôt) are sacred stone pillars set up by altars'
    key: bdb
    url: 'https://biblehub.com/hebrew/4676.htm'
    quote: 'especially of sacred stones or pillars in connection with altar'
  - where: 'section 1 plain'
    claim: 'The “groves” of verse 3 (ʾăšērîm) are sacred poles, symbols of the goddess Asherah'
    key: bdb
    url: 'https://biblehub.com/hebrew/842.htm'
    quote: 'a symbol of this goddess, a sacred tree or pole set up near an altar'
  - where: 'section 1 plain'
    claim: 'The “images” of verse 5 (ḥammānîm) are sun-pillars used in idolatrous worship'
    key: bdb
    url: 'https://biblehub.com/hebrew/2553.htm'
    quote: 'sun-pillar, used in idolatrous worship'
