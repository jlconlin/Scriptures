chapter: 31
claims:
  - where: setting
    claim: 'Verses 2–21 are not in 2 Kings; verse 1 runs beside 2 Kgs. 18:4'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/31.htm'
    quote: '2–21 (not in 2 Kin.). Organisation of the Priests, Tithe'
  - where: setting
    claim: 'Kings tells the removal of the high places in one verse'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/18?lang=eng'
    quote: 'He removed the high places, and brake the images, and cut down the groves, and brake in pieces the brasen serpent that Moses had made'
  - where: thread
    claim: 'The chapter moves from the destruction of the idols to provision for the ordering and maintenance of the temple worship'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/31.htm'
    quote: 'Destruction of the idols and the altars of the high places. Provisions for the ordering and maintenance of the temple worship, and the attendants upon it.'
  - where: thread
    claim: 'The heaps grew from the end of the grain harvest (third month) to the end of the fruit and wine harvest (seventh)'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/31.htm'
    quote: 'In the third month, consequently immediately at the end of the grain harvest, they commenced to found the heaps … and in the seventh month, i.e., at the end of the fruit and wine harvest, they completed them'
  - where: section 2 plain
    claim: 'Verses 2–8: restoration of order in worship and of the temple revenues'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/31.htm'
    quote: 'Restoration of order in the public worship, and of the temple revenues and those of the priests.'
  - where: section 3 plain
    claim: 'Verses 9–19: the employment and storing of the gifts'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/31.htm'
    quote: 'The employment and storing of these gifts, 2 Chronicles 31:9-19.'
  - where: section 4 plain
    claim: 'Verses 20–21 are the conclusion of the account'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/31.htm'
    quote: 'The conclusion of this account. Thus did Hezekiah in all Judah'
  - where: section 2 plain
    claim: '“Tents of the LORD” is the camp of the LORD, the temple area'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/31.htm'
    quote: 'the tents of the Lord] R.V. the camp of the LORD, i.e. (in the language of Deut.) “the place which the Lord chose,” Jerusalem or, more exactly, the Temple area.'

  - where: 'note 31:1 “The people finish the work, north as well as south”'
    claim: 'Kings credits Hezekiah with removing the high places'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/18?lang=eng'
    quote: 'He removed the high places, and brake the images, and cut down the groves'

  - where: 'note 31:4 “Freed to give themselves to the law”'
    claim: 'The Hebrew verb (ḥāzaq with bᵉ) here means hold firmly to, devote oneself to'
    key: bdb
    url: 'https://biblehub.com/hebrew/2388.htm'
    quote: 'd. hold firmly to, devote oneself to, followed by בְּ2Chronicles 31:4.'
  - where: 'note 31:4 “Freed to give themselves to the law”'
    claim: 'The verb in verse 4 is yeḥezqû, from ḥāzaq'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="2388" n="0.0" morph="HVqi3mp" id="147gs">יֶחֶזְק֖וּ</w>'
  - where: 'note 31:4 “Freed to give themselves to the law”'
    claim: 'The Church''s footnotes on verse 3 send the daily, Sabbath, new moon and feast offerings to Num. 28'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/31?lang=eng'
    quote: '“offerings”: Num. 28:3 (3–8).'
  - where: 'note 31:5 “Firstfruits and the tithe”'
    claim: 'Firstfruits belonged to God and were offered at the great feasts and privately; 2 Chr. 31:5 among the passages'
    key: bd-firstfruits
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/firstfruits?lang=eng'
    quote: 'Regarded as belonging to God, and offered by the nation as a whole at the great feasts, and by private individuals at other times'
  - where: 'note 31:5 “Firstfruits and the tithe”'
    claim: 'The tithe was paid to the Levites, who gave a tenth of it to the priests'
    key: bd-tithe
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tithe?lang=eng'
    quote: 'In Num. 18:21–28 it is directed that tithe be paid to the Levites, who in their turn give one-tenth of what they receive to the priests.'
  - where: 'note 31:5 “Firstfruits and the tithe”'
    claim: 'Latter-day revelation emphasizes the tithe as a duty and a test of faithfulness; 2 Chr. 31:5–12 listed'
    key: bd-tithe
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tithe?lang=eng'
    quote: 'Latter-day revelation emphasizes the law of the tithe as a duty and a test of faithfulness (D&C 64:23–25; 85:3; 97:11; 119). The honest payment of tithing sanctifies both the individual and the land on which he lives. See also … 2 Chr. 31:5–12'
  - where: 'note 31:5 “Firstfruits and the tithe”'
    claim: 'The firstfruits were given to the priests'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/18?lang=eng'
    quote: 'And whatsoever is first ripe in the land, which they shall bring unto the LORD, shall be thine'
  - where: 'note 31:7 “Heaps from harvest to ingathering”'
    claim: 'Third month = end of the grain harvest, Pentecost; seventh = end of fruit and wine harvest, Tabernacles'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/31.htm'
    quote: 'In the third month, consequently immediately at the end of the grain harvest, they commenced to found the heaps … and in the seventh month, i.e., at the end of the fruit and wine harvest, they completed them'
  - where: 'note 31:7 “Heaps from harvest to ingathering”'
    claim: 'The Feast of Harvest fell in the third month, the Feast of Ingathering later'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/31.htm'
    quote: '7. the third month] The Feast of Harvest took place at the beginning of this month and seven weeks later the Feast of Ingathering followed.'
  - where: 'note 31:7 “Heaps from harvest to ingathering”'
    claim: 'Firstfruits: loaves of new wheat at Pentecost, thanksgiving for the harvest at Tabernacles'
    key: bd-firstfruits
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/firstfruits?lang=eng'
    quote: '(2) the offering of two loaves made with new wheat flour at the Feast of Pentecost (Ex. 34:22; Lev. 23:15, 17); (3) a thanksgiving for the harvest at the Feast of Tabernacles, or of Ingathering'
  - where: 'note 31:6 “Israelites who dwelt in Judah”'
    claim: 'The “children of Israel” of verse 6 are Israelites who had come south from the northern kingdom'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/31.htm'
    quote: 'are not the inhabitants of the northern kingdom, but the Israelites who had emigrated from that kingdom into Judah (as 2 Chronicles 30:25; 2 Chronicles 11:16; 2 Chronicles 10:17).'

  - where: 'note 31:10 “The LORD hath blessed his people”'
    claim: 'This Azariah is hardly the one who withstood Uzziah forty years before'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/31.htm'
    quote: 'Azariah the high priest (hardly the Azariah mentioned 2 Chronicles 26:17, who forty years before tried to prevent Uzziah from pressing into the holy place), of the house of Zadok'
  - where: 'note 31:10 “The LORD hath blessed his people”'
    claim: 'The priestly line runs from Eleazar to Zadok'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/6?lang=eng'
    quote: 'And Ahitub begat Zadok, and Zadok begat Ahimaaz'
  - where: 'note 31:10 “The LORD hath blessed his people”'
    claim: 'Zadok was priest in David''s day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/8?lang=eng'
    quote: 'And Zadok the son of Ahitub, and Ahimelech the son of Abiathar, were the priests'
  - where: 'note 31:12 “Faithfully, and in their trust”'
    claim: 'ʾĕmûnâ appears in verses 12, 15 and 18'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: '<w lemma="b/530" n="1" morph="HR/Ncfsa" id="14S4t">בֶּ/אֱמוּנָ֑ה</w> … <w lemma="b/530" n="0.0" morph="HR/Ncfsc/Sp3mp" id="14ipC">בֶ/אֱמוּנָתָ֖/ם</w>'
  - where: 'note 31:12 “Faithfully, and in their trust”'
    claim: 'BDB: faithfulness in office (31:12); “in trust (over)” at 31:15, 18'
    key: bdb
    url: 'https://biblehub.com/hebrew/530.htm'
    quote: 'faithfulness, trust: a. of human conduct … in office 2 Kings 22:7; 2Chronicles 19:9; 31:12; 34:12; (על) בֶּאֱמוּנָה in trust (over) 1 Chronicles 9:22,26,31; 2Chronicles 31:15,18'
  - where: 'note 31:21 “With all his heart, and prospered”'
    claim: 'Kings says the LORD was with Hezekiah and he prospered'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/18?lang=eng'
    quote: 'And the LORD was with him; and he prospered whithersoever he went forth'
  - where: 'note 31:21 “With all his heart, and prospered”'
    claim: 'In Chronicles rewards and punishments are not usually delayed'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'rewards and punishments are not usually delayed in Chronicles, and people are often punished for sins or rewarded for righteousness immediately.'

  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: christ
    claim: 'Tithing is principally a matter of faith, putting the Lord first'
    key: andersen-2023-tithing
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/10/22andersen?lang=eng'
    quote: 'The world speaks of tithing in terms of our money, but the sacred law of tithing is principally a matter of our faith. Being honest in our tithes is one way we show our willingness to put the Lord first in our lives'
  - where: christ
    claim: 'Faithful tithes establish the Church in faraway places'
    key: andersen-2023-tithing
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/10/22andersen?lang=eng'
    quote: 'Because of your faithful tithes, the Church is being established in faraway places you may never visit among righteous Saints you may never know.'
  - where: section 3 plain
    claim: '“In their set office” (verses 15, 18) means in their trust, in an office of trust'
    key: bdb
    url: 'https://biblehub.com/hebrew/530.htm'
    quote: '(על) בֶּאֱמוּנָה in trust (over) 1 Chronicles 9:22,26,31; 2Chronicles 31:15,18'
