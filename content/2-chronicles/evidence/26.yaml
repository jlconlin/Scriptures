chapter: 26
claims:
  - where: 'when'
    claim: 'Isaiah saw the Lord in the year Uzziah died'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/6?lang=eng'
    quote: 'In the year that king Uzziah died I saw also the Lord sitting upon a throne, high and lifted up'
  - where: 'setting'
    claim: 'Amaziah was killed by conspirators at Lachish after turning from the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/25?lang=eng'
    quote: 'Now after the time that Amaziah did turn away from following the LORD they made a conspiracy against him in Jerusalem; and he fled to Lachish: but they sent to Lachish after him, and slew him there.'
  - where: 'setting'
    claim: 'Kings: Azariah did right, but the high places remained'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'Save that the high places were not removed: the people sacrificed and burnt incense still on the high places.'
  - where: 'setting'
    claim: 'The two names look alike in Hebrew consonants and mean "Jah is my strength" and "Jah hath given help"'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/26.htm'
    quote: 'The two forms of the name when written in Heb. consonants closely resemble each other; the meanings moreover of the two are similar, “Jah is my strength” and “Jah hath given help.”'
  - where: 'setting'
    claim: 'Uzziah may have been a throne name, or the difference may come from the transmission of the text'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'It is possible that Uzziah was his throne name that was officially adopted when he became king. Or perhaps there was an error or confusion in the transmission of the text.'
  - where: 'setting'
    claim: 'Uzziah is called Azariah in Kings'
    key: bd-uzziah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/uzziah?lang=eng'
    quote: 'Strength of the Lord. Called Azariah (2 Kgs. 14:21); king of Judah (2 Chr. 26:1)'
  - where: 'setting'
    claim: 'Verses 5–15 and 16–20 are not in Kings'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/26.htm'
    quote: '5–10 (not in Kings). The Prosperity of Uzziah'
  - where: 'setting'
    claim: 'Kings says nothing of his power; Isaiah 2–4 portray Judah''s might in his days'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/26.htm'
    quote: 'nothing is said in the book of Kings; but the fact itself is placed beyond all doubt, for it is confirmed by the portrayal of the might and greatness of Judah in the prophecies of Isaiah (Isaiah 2-4), which date from the times of Uzziah and Jotham.'
  - where: 'setting'
    claim: 'Come, Follow Me heads the chapter "Pride leads to destruction"'
    key: cfm-ot-2026-30
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/30?lang=eng'
    quote: '2 Chronicles 26:3–21: Pride leads to destruction.'
  - where: 'setting'
    claim: 'Scripture Helps explains why it was wrong for Uzziah to burn incense'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: '2 Chronicles 26:16–21: Why was it wrong for King Uzziah to burn incense in the temple?'
  - where: 'thread'
    claim: 'The same Hebrew expression of strength stands in 2 Chr. 12:1 and 26:16'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'וּ/כְ/חֶזְקָת֔/וֹ'
  - where: 'thread'
    claim: 'In Chronicles rewards and punishments usually come at once'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'rewards and punishments are not usually delayed in Chronicles, and people are often punished for sins or rewarded for righteousness immediately.'
  - where: 'thread'
    claim: 'He was buried in the field of burial that belonged to the kings, because he was a leper'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/26?lang=eng'
    quote: 'in the field of the burial which belonged to the kings; for they said, He is a leper'
  - where: 'thread'
    claim: 'The LORD forsakes those who forsake Him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/15?lang=eng'
    quote: 'if ye forsake him, he will forsake you.'
  - where: 'note 26:5 “Zechariah, a teacher in the fear of God”'
    claim: 'The Hebrew as written reads "in the seeing of God"'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'בִּ/רְאֹ֣ת'
  - where: 'note 26:5 “Zechariah, a teacher in the fear of God”'
    claim: 'The Septuagint reads "the fear of the Lord"'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_chronicles/26.htm'
    quote: 'And he sought the Lord in the days of Zacharias, who understood the fear of the Lord'
  - where: 'note 26:5 “Zechariah, a teacher in the fear of God”'
    claim: 'Nothing more is known of Zechariah'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/26.htm'
    quote: 'Nothing further is known of the Zechariah here mentioned: the commentators hold him to have been an important prophet; for had he been a priest, or the high priest, probably הכּהן would have been used.'
  - where: 'note 26:5 “Zechariah, a teacher in the fear of God”'
    claim: 'Keil judges the written text an orthographical error for "fear"'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/26.htm'
    quote: 'בראות would therefore seem to be an orthographical error for ביראת, some MSS having ביראות or ביראת'
  - where: 'note 26:5 “Zechariah, a teacher in the fear of God”'
    claim: 'The participle means "who gave instruction", used of a leader of song and "teacher"; read "fear of God"'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/26.htm'
    quote: 'who had understanding] R.V. mg., “who gave instruction”; Heb. mçbîn, a word applied to a leader of song (1 Chronicles 15:22, “skilful”; ib. 1 Chronicles 25:7, “conning”; Ch 25:8, “teacher”).'
  - where: 'note 26:5 “Zechariah, a teacher in the fear of God”'
    claim: 'Seeking is the measure: "seek my face"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/7?lang=eng'
    quote: 'If my people, which are called by my name, shall humble themselves, and pray, and seek my face'
  - where: 'note 26:15 “Engines on the towers”'
    claim: 'The Hebrew of verse 15'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'חִשְּׁבֹנ֜וֹת מַחֲשֶׁ֣בֶת חוֹשֵׁ֗ב'
  - where: 'note 26:15 “Engines on the towers”'
    claim: 'BDB: contrivances, engines of war, the invention of inventive men'
    key: bdb
    url: 'https://biblehub.com/hebrew/2810.htm'
    quote: '2Chronicles 26:15 and he made contrivances (i.e. engines of war for hurling stones and arrows, see vb) the invention of inventive men.'
  - where: 'note 26:15 “Engines on the towers”'
    claim: 'The root verb means to think, devise'
    key: bdb
    url: 'https://biblehub.com/hebrew/2803.htm'
    quote: '1 think, account'
  - where: 'note 26:16 “Helped, till he was strong”'
    claim: '"Transgressed" (16) and "trespassed" (18) are one verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'וַ/יִּמְעַ֖ל'
  - where: 'note 26:16 “Helped, till he was strong”'
    claim: 'The same verb in verse 18'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'מָעַ֔לְתָּ'
  - where: 'note 26:16 “Helped, till he was strong”'
    claim: 'The same expression, "and when he was strong", in 26:16 and 12:1'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'וּ/כְ/חֶזְקָת֗/וֹ'
  - where: 'note 26:16 “Helped, till he was strong”'
    claim: 'The verb of "to his destruction" (also 27:2) means, used absolutely, to deal corruptly'
    key: bdb
    url: 'https://biblehub.com/hebrew/7843.htm'
    quote: 'absolute = deal corruptly'
  - where: 'note 26:16 “Helped, till he was strong”'
    claim: '"Transgressed" means to act unfaithfully, treacherously, a priestly word'
    key: bdb
    url: 'https://biblehub.com/hebrew/4603.htm'
    quote: 'act unfaithfully, treacherously, a priestly word'
  - where: 'note 26:16 “Helped, till he was strong”'
    claim: 'Successes led to pride and overreach of authority'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'Uzziah’s successes as king led to a prideful heart and an overreach of his authority.'
  - where: 'note 26:16 “Helped, till he was strong”'
    claim: 'Rehoboam forsook the law when he had strengthened himself'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/12?lang=eng'
    quote: 'when Rehoboam had established the kingdom, and had strengthened himself, he forsook the law of the LORD'
  - where: 'note 26:18 “Why the king could not burn incense”'
    claim: 'No stranger not of Aaron''s seed may offer incense'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/16?lang=eng'
    quote: 'that no stranger, which is not of the seed of Aaron, come near to offer incense before the LORD; that he be not as Korah, and as his company'
  - where: 'note 26:18 “Why the king could not burn incense”'
    claim: 'Abijah boasted that Judah''s priests were Aaron''s sons and burned incense'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/13?lang=eng'
    quote: 'the priests, which minister unto the LORD, are the sons of Aaron, and the Levites wait upon their business'
  - where: 'note 26:18 “Why the king could not burn incense”'
    claim: 'Only Aaronic priests could burn incense before the veil; endnote cites 2 Chr. 13:10–11 and Num. 16:39–40'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'Only priests who held the Aaronic Priesthood were authorized to burn incense on the altar before the veil of the temple.'
  - where: 'note 26:18 “Why the king could not burn incense”'
    claim: 'The priest Azariah bears the king''s other name'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'There is also a priest named Azariah mentioned in 2 Chronicles 26:16–21.'
  - where: 'note 26:19 “Struck at the altar”'
    claim: 'Chronicles usually shows punishments immediately'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'rewards and punishments are not usually delayed in Chronicles, and people are often punished for sins or rewarded for righteousness immediately.'
  - where: 'note 26:21 “A house apart”'
    claim: 'BDB: freedom, separateness; a house apart on account of his disease'
    key: bdb
    url: 'https://biblehub.com/hebrew/2669.htm'
    quote: 'noun feminine freedom, separateness, only בֵּית הַחָפְשִׁית 2 Kings 15:5 2Chronicles 26:21 Qr (Kt החפשׁות) i.e. (si vera 1.) a separate house — a house apart (on account of his disease).'
  - where: 'note 26:21 “A house apart”'
    claim: '"Several" means separate'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/26.htm'
    quote: 'a several house] i.e. separate, special'
  - where: 'note 26:21 “A house apart”'
    claim: 'The leper dwells alone outside the camp'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/13?lang=eng'
    quote: 'he shall dwell alone; without the camp shall his habitation be.'
  - where: 'note 26:21 “A house apart”'
    claim: 'Buried near the royal graves so as not to defile them'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/2_chronicles/26.htm'
    quote: 'was not buried in the graves of the kings, but only in the neighbourhood of them, in the burial-field which belonged to the kings, that his body might not defile the royal graves.'
  - where: 'note 26:21 “A house apart”'
    claim: 'Kings says buried in the city of David'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/2_chronicles/26.htm'
    quote: 'the field of the burial] R.V. the field of burial. In Kings, “in the city of David.”'
  - where: 'note 26:21 “A house apart”'
    claim: 'Kings: buried with his fathers in the city of David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'they buried him with his fathers in the city of David'
  - where: 'note 26:22 “Isaiah''s record of Uzziah”'
    claim: 'Isaiah''s acts of Uzziah may or may not be in the present text under another title'
    key: bd-lost-books
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/lost-books?lang=eng'
    quote: 'writings that may or may not be contained within our present text but may perhaps be known by a different title; for example, … the rest of the acts of Uzziah written by Isaiah (2 Chr. 26:22).'
  - where: 'note 26:22 “Isaiah''s record of Uzziah”'
    claim: 'Kings refers to the chronicles of the kings of Judah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'are they not written in the book of the chronicles of the kings of Judah?'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'Davis contrasts pride that bends rules with humility, as in Jesus'' rebukes and Sabbath healings'
    key: davis-bended-rules
    url: 'https://mi.byu.edu/old-testament-reflections/on-bended-rules'
    quote: 'the God of creation is quick to distinguish between the pride that bends rules for self-aggrandizement and the humility that bends them in service of genuine return and holy relationship.'
  - where: 'christ'
    claim: 'The intervention was like Jesus'' rebukes of Jerusalem''s dignitaries; Hezekiah''s pardon like His Sabbath healings'
    key: davis-bended-rules
    url: 'https://mi.byu.edu/old-testament-reflections/on-bended-rules'
    quote: 'The Lord''s intervention here was little different than the rebukes he would offer the dignitaries of Jerusalem in his ministry among them as Jesus of Nazareth.'
  - where: 'christ'
    claim: 'Helaman 12:2: at the time of prosperity they forget the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/hel/12?lang=eng'
    quote: 'then is the time that they do harden their hearts, and do forget the Lord their God'
  - where: 'explore'
    claim: 'Davis treats Uzziah and Hezekiah''s Passover side by side'
    key: davis-bended-rules
    url: 'https://mi.byu.edu/old-testament-reflections/on-bended-rules'
    quote: 'These two legal anomalies are handled differently by Hezekiah than Uzziah did when he tried to enter the temple and offer a sacrifice.'
