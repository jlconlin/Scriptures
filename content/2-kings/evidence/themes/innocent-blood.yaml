page: innocent-blood
claims:
  # ---------- opening ----------
  - where: 'opening'
    claim: 'sālaḥ (H5545), “pardon,” is used of God only; BDB lists 1 Kgs. 8:30, 39 and 2 Kgs. 24:4 under its absolute use'
    key: bdb
    url: 'https://biblehub.com/hebrew/5545.htm'
    quote: 'forgive, pardon, always of God : absolute Numbers 14:20 (J), 1 Kings 8:30,39 2Chronicles 6:21,30; 2 Kings 24:4'
  - where: 'opening'
    claim: 'Solomon’s “forgive” in 1 Kgs. 8:30, 34, 36, 39 and 50 is the verb H5545 (wĕsālaḥtā), five times in the dedication prayer; 8:50 is the petition for captives'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'וְ/סָלַחְתָּ֤'
  - where: 'opening'
    claim: 'Naaman’s “pardon” in 2 Kgs. 5:18 (twice, yislaḥ) and 24:4’s “pardon” (lisloaḥ, after lōʾ ʾābâ) are the same verb H5545; the script’s count of H5545 in 2 Kings is 3 occurrences in 2 verses, and 24:4 is the only one negated'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'לִ/סְלֹֽחַ'
  - where: 'opening'
    claim: 'dām (H1818) occurs 13 times in 9 verses of 2 Kings (3:22, 23; 9:7 ×2, 26 ×2, 33; 16:13, 15 ×2; 21:16; 24:4 ×2), as the script counted from the WLC; 3:22 is “as blood,” a comparison'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'כַּ/דָּֽם'
  - where: 'opening'
    claim: 'The Bible Dictionary: Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'opening'
    claim: 'Connection made by this page: read across 9:7, 26, Hos. 1:4, 21:16, 23:25–27 and 24:3–4, Kings shows a LORD who sees innocent blood, requites it, visits even the blood of the requital on the house that shed it (Hosea’s words), and would not pardon a city filled with it; the New Testament names the Savior’s blood “the innocent blood” (Matt. 27:4) in the Septuagint’s words for 21:16 and 24:4, and the page reads His as the one innocent blood by which pardon comes; no Church source sets 24:4 beside the Savior, and the step is the page’s own'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'And also for the innocent blood that he shed: for he filled Jerusalem with innocent blood; which the Lord would not pardon.'

  # ---------- I have seen the blood of Naboth ----------
  - where: 'section “I have seen the blood of Naboth”'
    claim: '“Blood” in 9:26 is the plural construct dĕmê (H1818), twice'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'דְּמֵ֣י'
  - where: 'section “I have seen the blood of Naboth”'
    claim: 'BDB files the plural dāmîm under blood shed by violence, naming Gen. 4:10–11 (blood crying from the ground for vengeance) and 2 Kgs. 9:26 in the same entry'
    key: bdb
    url: 'https://biblehub.com/hebrew/1818.htm'
    quote: 'f. plural דָּמִים of abundance, blood in quantity, hence sometimes of blood shed by rude violence, and of blood-stains; — Genesis 4:10,11(J) as crying from the ground for vengeance … 2 Kings 9:26 (twice in verse)'
  - where: 'section “I have seen the blood of Naboth”'
    claim: '“Cleansed” in Num. 35:33 is the verb H3722 kipper (yĕkuppar), the verb of atonement'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'יְכֻפַּ֗ר'
  - where: 'section “I have seen the blood of Naboth”'
    claim: 'Connection made by this page: in Kings innocent blood is seen and requited (9:26; 1 Kgs. 21:19), and Ahab’s humbling moved the requital to his son’s days without dissolving it (1 Kgs. 21:29); the LORD keeps the account of blood'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/21?lang=eng'
    quote: 'I will not bring the evil in his days: but in his son’s days will I bring the evil upon his house.'

  # ---------- The blood of Jezreel ----------
  - where: 'section “The blood of Jezreel”'
    claim: 'The Student Manual reads 10:30–31 together: the house of Omri deserved destruction and Jehu was the means, but the Lord was not pleased with his brutal methods or his wickedness'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'Jehu was the means of bringing about the Lord’s will in this regard, but that does not mean the Lord was pleased with his brutal methods or his wickedness.'
  - where: 'section “The blood of Jezreel”'
    claim: 'The verb of Hos. 1:4 (pāqad with “upon”) is “visit upon,” of sin; BDB lists Hosea 1:4 with Exodus 20:5'
    key: bdb
    url: 'https://biblehub.com/hebrew/6485.htm'
    quote: 'accusative of thing (of sin) Amos 3:2,14; Hosea 1:4; Hosea 2:15; Exodus 20:5'
  - where: 'section “The blood of Jezreel”'
    claim: 'Jackson: the blood Jehu shed at Jezreel would be avenged on his dynasty, whose kings were wicked like their ancestor'
    key: jackson-hosea-marriage
    url: 'https://rsc.byu.edu/isaiah-prophets/marriage-hosea-jehovahs-covenant-israel'
    quote: 'the blood shed by Jehu at that place would now be avenged upon his dynasty, whose kings were wicked like their ancestor'
  - where: 'section “The blood of Jezreel”'
    claim: 'Keil: a thing commanded by God becomes a crime in the performer when he makes the command a cloak for his own evil heart; he finds Jehu’s motive in the historian’s verdict at 2 Kgs. 10:29, 31'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/1.htm'
    quote: 'when he abuses the divine command, and makes it the mere cloak for the lusts of his own evil heart. That Jehu was actuated by such motives as this, is evident enough from the verdict of the historian in 2 Kings 10:29, 2 Kings 10:31'
  - where: 'section “The blood of Jezreel”'
    claim: 'Connection made by this page: 9:7, 10:30 and Hos. 1:4 read together show that the LORD’s seeing of blood extends even to the blood of the requital He commanded; the law held the avenger guiltless (Num. 35:27) and Jehu’s reward was kept (15:12), and the explanations of Hos. 1:4 are Jackson’s and Keil’s; the page draws only that no blood shed in Israel falls outside His seeing'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/1?lang=eng'
    quote: 'I will avenge the blood of Jezreel upon the house of Jehu'

  # ---------- Innocent blood ----------
  - where: 'section “Innocent blood”'
    claim: 'nāqî (H5355) means free from guilt, clean, innocent; BDB says the phrase dām nāqî “innocent blood” is first used in D and lists 2 Kgs. 21:16 and 24:4 among its uses'
    key: bdb
    url: 'https://biblehub.com/hebrew/5355.htm'
    quote: 'דם נקי innocent blood, first used in D, Deuteronomy 19:10; Deuteronomy 27:25; 1 Samuel 19:5; 2 Kings 21:16; 2 Kings 24:4'
  - where: 'section “Innocent blood”'
    claim: 'BDB’s first sense of nāqî: free from guilt, clean, innocent'
    key: bdb
    url: 'https://biblehub.com/hebrew/5355.htm'
    quote: '1 free from guilt, clean, innocent'
  - where: 'section “Innocent blood”'
    claim: 'nāqî (H5355) occurs in 2 Kings only at 21:16 and 24:4 (3 occurrences in 2 verses), as the script counted from the WLC'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'נָקִ֜י'
  - where: 'section “Innocent blood”'
    claim: '“Forgiven” in Deut. 21:8 is the verb H3722 kipper (wĕnikkappēr), the verb of atonement, “covered”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'וְ/נִכַּפֵּ֥ר'
  - where: 'section “Innocent blood”'
    claim: 'BDB renders the last clause of Deut. 21:8 “and the blood shall be covered for them”'
    key: bdb
    url: 'https://biblehub.com/hebrew/3722.htm'
    quote: 'Niph`al Perfect וְנִכַּמֵּר לָהֶם הַדָּם Deuteronomy 21:8 and the blood shall be covered for them.'
  - where: 'section “Innocent blood”'
    claim: 'BDB, on kipper with God as subject (Deut. 21:8 among the examples): God in His sovereignty may Himself provide an atonement or covering for men and their sins which could not be provided by men'
    key: bdb
    url: 'https://biblehub.com/hebrew/3722.htm'
    quote: 'It is conceived that God in his sovereignty may himself provide an atonement or covering for men and their sins which could not be provided by men.'
  - where: 'section “Innocent blood”'
    claim: 'The Student Manual quotes Josephus on who the innocent were: Manasseh slew all the righteous men among the Hebrews and did not spare the prophets'
    key: ot-manual-19
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-19?lang=eng'
    quote: 'he barbarously slew all the righteous men that were among the Hebrews; nor would he spare the prophets'
  - where: 'section “Innocent blood”'
    claim: 'Van Dyke and Ogden gloss “innocent blood” in 21:16 as possibly those who protested Manasseh’s idolatrous policies'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Moreover Manasseh shed innocent blood very much [possibly those who protested his idolatrous policies]'
  - where: 'section “Innocent blood”'
    claim: 'Seamons and Hilton note that the writer of 21:16 is not specific and suggest the shedding was related to death, perhaps specifically human sacrifice'
    key: seamons-hilton-blood-2022
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/remembering-christs-blood-which-was-shed'
    quote: 'While the author is not specific in what it means to “shed innocent blood,” the contextual descriptions of extreme wickedness seem to suggest that it was related to death, perhaps specifically human sacrifice.'
  - where: 'section “Innocent blood”'
    claim: 'The Bible Dictionary gives Isaiah’s death under Manasseh as tradition'
    key: bd-isaiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/isaiah?lang=eng'
    quote: 'Tradition states that he was “sawn asunder” during the reign of Manasseh'
  - where: 'section “Innocent blood”'
    claim: '“From one end to another” in 21:16 is peh lāpeh (H6310 twice), literally mouth to mouth'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'לָ/פֶ֑ה'
  - where: 'section “Innocent blood”'
    claim: 'Connection made by this page: by Num. 35:33 the land’s cleansing for shed blood is the shedder’s blood, and Kings records no requital of the man himself, closing his reign with the formula “slept with his fathers” (21:18); Chronicles says the LORD heard him (2 Chr. 33:12–13), so the king was heard and the blood remained in the land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/33?lang=eng'
    quote: 'And prayed unto him: and he was entreated of him, and heard his supplication, and brought him again to Jerusalem into his kingdom.'

  # ---------- Which the LORD would not pardon ----------
  - where: 'section “Which the LORD would not pardon”'
    claim: 'KnoWhy 861 reads 23:26 as saying that Manasseh was so wicked that even Josiah’s righteousness could not compensate for it'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'King Manasseh was so wicked that even the righteousness of King Josiah could not compensate for it, and the punishment had to eventually come, even if it was delayed for a time.'
  - where: 'section “Which the LORD would not pardon”'
    claim: 'Satterfield: Manasseh’s reversal of Hezekiah’s reforms returned Judah’s former sins, and Josiah’s reformation was outward only'
    key: satterfield-divine-justification
    url: 'https://scripturecentral.org/archive/books/book-chapter/divine-justification-babylonian-destruction-jerusalem'
    quote: 'The reformation made by Josiah’s people was outward only; little inward transformation had taken place'
  - where: 'section “Which the LORD would not pardon”'
    claim: '“I also have heard thee” in 22:19 is šāmaʿtî, the verb H8085 of Solomon’s refrain'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'שָׁמַ֖עְתִּי'
  - where: 'section “Which the LORD would not pardon”'
    claim: '“Would not pardon” in 24:4 is wĕlōʾ ʾābâ YHWH lisloaḥ: the verb H14 ʾābâ with lōʾ, then the infinitive of H5545'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'אָבָ֥ה'
  - where: 'section “Which the LORD would not pardon”'
    claim: 'ʾābâ (H14) means to be willing, to consent'
    key: bdb
    url: 'https://biblehub.com/hebrew/14.htm'
    quote: 'to be willing, to consent'
  - where: 'section “Which the LORD would not pardon”'
    claim: 'BDB lists 24:4 with 1 Kgs. 8:30 under the absolute use of sālaḥ, without an object'
    key: bdb
    url: 'https://biblehub.com/hebrew/5545.htm'
    quote: 'absolute Numbers 14:20 (J), 1 Kings 8:30,39 2Chronicles 6:21,30; 2 Kings 24:4'
  - where: 'section “Which the LORD would not pardon”'
    claim: 'Keil on 24:4: the LORD would not forgive, even for Moses and Samuel (Jer. 15:1), because the measure of the sins was full'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/24.htm'
    quote: 'because the measure of the sins was full, so that God was obliged to punish according to His holy righteousness'
  - where: 'section “Which the LORD would not pardon”'
    claim: 'The Septuagint of 24:4 (the Greek printed beside Brenton’s translation, read at Elpenor) ends οὐκ ἠθέλησε Κύριος ἱλασθῆναι, the verb hilaskomai in the passive; Brenton renders “the Lord would not pardon”'
    key: lxx-rahlfs
    url: 'https://www.ellopos.net/elpenor/greek-texts/septuagint/chapter.asp?book=12&page=24'
    quote: 'καὶ οὐκ ἠθέλησε Κύριος ἱλασθῆναι'
  - where: 'section “Which the LORD would not pardon”'
    claim: 'The Septuagint is the Greek translation of the Old Testament, the version most New Testament quotations of the Old Testament are taken from'
    key: bd-septuagint
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/septuagint?lang=eng'
    quote: 'Most of the quotations from the Old Testament in the New Testament are taken from this version'
  - where: 'section “Which the LORD would not pardon”'
    claim: 'Thayer: in biblical Greek hilaskomai is used passively, to become propitious, be placated or appeased'
    key: thayer
    url: 'https://biblehub.com/greek/2433.htm'
    quote: 'In Biblical Greek used passively, to become propitious, be placated or appeased'
  - where: 'section “Which the LORD would not pardon”'
    claim: 'The Hebrew the Septuagint renders at 24:4 is lisloaḥ, H5545 sālaḥ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'לִ/סְלֹֽחַ'
  - where: 'section “Which the LORD would not pardon”'
    claim: 'Connection made by this page: the sentence of 24:3–4 is on a land and a people (“to remove them out of his sight”), and Kings does not say what it means for any one soul; the law’s two remedies for innocent blood (the shedder’s blood, Num. 35:33; the heifer and the elders’ prayer, Deut. 21:8) reach no city its king has filled, and the land where the LORD dwelt (Num. 35:34) is emptied and the house cast off (23:27); the page does not touch the forgiveness of any one person’s sins'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/35?lang=eng'
    quote: 'Defile not therefore the land which ye shall inhabit, wherein I dwell: for I the Lord dwell among the children of Israel.'

  # ---------- From the blood of righteous Abel ----------
  - where: 'section “From the blood of righteous Abel”'
    claim: 'Talmage: most Bible scholars identify the Zacharias of Matt. 23:35 with Zechariah son of Jehoiada (2 Chr. 24:20–22)'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'It is the opinion of most Bible scholars that the Zacharias referred to in Matthew’s record is Zechariah son of Jehoiada.'
  - where: 'section “From the blood of righteous Abel”'
    claim: 'Talmage reads the speaker of Matt. 23:35 as Jehovah Himself'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'Jehovah Himself replied by predicting that they would dye their hands in the blood of prophets, wise men, and righteous scribes'
  - where: 'section “From the blood of righteous Abel”'
    claim: 'Connection made by this page: in Matt. 23:35–36 (Luke 11:50–51, “required of this generation”) the Savior affirms the principle of 2 Kings 9 and 24, that righteous blood is seen and required of a generation, days before the crowd said of His own blood “His blood be on us” (Matt. 27:25); the principle of Kings is not set aside by the gospel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/23?lang=eng'
    quote: 'That upon you may come all the righteous blood shed upon the earth, from the blood of righteous Abel unto the blood of Zacharias son of Barachias, whom ye slew between the temple and the altar.'

  # ---------- The innocent blood ----------
  - where: 'section “The innocent blood”'
    claim: 'Matt. 27:4 Greek: Ἥμαρτον παραδοὺς αἷμα ἀθῷον; “the innocent blood” is haima athōon, accusative singular'
    key: greek-nt
    url: 'https://biblehub.com/text/matthew/27-4.htm'
    quote: 'Ἥμαρτον παραδοὺς αἷμα ἀθῷον'
  - where: 'section “The innocent blood”'
    claim: 'The Septuagint of 2 Kgs. 21:16 has αἷμα ἀθῷον (haima athōon), the same two words as Matt. 27:4'
    key: lxx-rahlfs
    url: 'https://www.ellopos.net/elpenor/greek-texts/septuagint/chapter.asp?book=12&page=21'
    quote: 'αἷμα ἀθῷον ἐξέχεε Μανασσῆς πολὺ σφόδρα'
  - where: 'section “The innocent blood”'
    claim: 'The Septuagint of 2 Kgs. 24:4 has τὸ αἷμα ἀθῷον … αἵματος ἀθῴου'
    key: lxx-rahlfs
    url: 'https://www.ellopos.net/elpenor/greek-texts/septuagint/chapter.asp?book=12&page=24'
    quote: 'τὸ αἷμα ἀθῷον ἐξέχεε καὶ ἔπλησε τὴν ῾Ιερουσαλὴμ αἵματος ἀθῴου'
  - where: 'section “The innocent blood”'
    claim: 'The Septuagint of Deut. 19:10 has αἷμα ἀναίτιον, another adjective, at the cities of refuge'
    key: lxx-rahlfs
    url: 'https://www.ellopos.net/elpenor/greek-texts/septuagint/chapter.asp?book=5&page=19'
    quote: 'καὶ οὐκ ἐκχυθήσεται αἷμα ἀναίτιον ἐν τῇ γῇ'
  - where: 'section “The innocent blood”'
    claim: 'The Septuagint of Deut. 21:8 has αἷμα ἀναίτιον at the heifer prayer'
    key: lxx-rahlfs
    url: 'https://www.ellopos.net/elpenor/greek-texts/septuagint/chapter.asp?book=5&page=21'
    quote: 'ἵνα μὴ γένηται αἷμα ἀναίτιον ἐν τῷ λαῷ σου ᾿Ισραήλ'
  - where: 'section “The innocent blood”'
    claim: 'The Septuagint of Deut. 27:25 has αἵματος ἀθῴου in the curse on him who takes a reward to slay an innocent person'
    key: lxx-rahlfs
    url: 'https://www.ellopos.net/elpenor/greek-texts/septuagint/chapter.asp?book=5&page=27'
    quote: 'ὃς ἂν λάβῃ δῶρα πατάξαι ψυχὴν αἵματος ἀθῴου'
  - where: 'section “The innocent blood”'
    claim: 'The Septuagint also has αἷμα ἀθῷον at 1 Sam. 19:5, where Jonathan pleads for David'
    key: lxx-rahlfs
    url: 'https://www.ellopos.net/elpenor/greek-texts/septuagint/chapter.asp?book=9&page=19'
    quote: 'ἁμαρτάνεις εἰς αἷμα ἀθῷον θανατῶσαι τὸν Δαυὶδ'
  - where: 'section “The innocent blood”'
    claim: 'The Septuagint also has αἷμα ἀθῷον at Jer. 26:15 (LXX 33:15), where Jeremiah warns his judges'
    key: lxx-rahlfs
    url: 'https://www.ellopos.net/elpenor/greek-texts/septuagint/chapter.asp?book=44&page=33'
    quote: 'αἷμα ἀθῷον δίδοτε ἐφ’ ὑμᾶς'
  - where: 'section “The innocent blood”'
    claim: 'The Church edition’s footnote on “blood” at Matt. 27:4 is TG Blood, Shedding of'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/27?lang=eng'
    quote: '4b “blood”: TG Blood, Shedding of.'
  - where: 'section “The innocent blood”'
    claim: 'The Church edition’s footnote on “blood” at 2 Kgs. 21:16 is the same entry, TG Blood, Shedding of'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/21?lang=eng'
    quote: '16b “blood”: TG Blood, Shedding of.'
  - where: 'section “The innocent blood”'
    claim: 'Elder Hamula: by the shedding of His innocent blood, Jesus Christ satisfied the demands of justice for every sin and transgression'
    key: hamula-sacrament-2014
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2014/10/the-sacrament-and-the-atonement?lang=eng'
    quote: 'By the shedding of His innocent blood, Jesus Christ satisfied the demands of justice for every sin and transgression.'
  - where: 'section “The innocent blood”'
    claim: 'Connection made by this page: in Kings innocent blood is what the LORD would not pardon; in the gospel the Savior’s innocent blood (Matt. 27:4; Hamula) is the blood by which He pardons; the phrase is the same and the direction reversed, not because the principle changed but because this innocent blood is His own, the infinite atonement Amulek reasons to from the law (Alma 34:11–12, 14; Heb. 12:24)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/27?lang=eng'
    quote: 'Saying, I have sinned in that I have betrayed the innocent blood.'
  - where: 'section “The innocent blood”'
    claim: 'BDB files the plural of blood at Gen. 4:10–11 as crying from the ground for vengeance'
    key: bdb
    url: 'https://biblehub.com/hebrew/1818.htm'
    quote: 'Genesis 4:10,11(J) as crying from the ground for vengeance'
  - where: 'section “The innocent blood”'
    claim: 'The New Testament Student Manual quotes Joseph Smith on Abel’s offering: it must be shedding the blood of the Only Begotten to atone for man; without the shedding of blood was no remission'
    key: nt-manual-hebrews-7-13
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/hebrews/chapter-49-hebrews-7-13?lang=eng'
    quote: 'It must be shedding the blood of the Only Begotten to atone for man, for this was the plan of redemption, and without the shedding of blood was no remission.'
  - where: 'section “The innocent blood”'
