page: out-of-his-sight
claims:
  # ---------- opening ----------
  - where: 'opening'
    claim: '“Out of his sight” in 17:18 and “out of my sight” in 23:27 are pānîm (H6440), face: mēʿal pānāyw and mēʿal pānay'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'פָּנַ֔/י'
  - where: 'opening'
    claim: 'The Septuagint (Brenton) renders 17:23 and 23:27 “from his presence” / “from my presence”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_kings/23.htm'
    quote: 'I will also remove Juda from my presence, as I removed Israel'
  - where: 'opening'
    claim: '“Presence” at 13:23 and 24:20 and “before” in the prayer and covenant verses (19:14–15; 20:3; 22:19; 23:3; 25:29) are the same noun pānîm (H6440); the dossier counts 73 occurrences in 68 verses of 2 Kings from the WLC'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'לְ/פָנָ֖י/ו'
  - where: 'opening'
    claim: 'Connection made by this page: Kings tells the removal of both kingdoms as removal from the LORD’s face (13:23; 17:18, 20, 23; 23:27; 24:3, 20), the idiom the Book of Mormon uses for the Fall and calls spiritual death (2 Ne. 9:6; Alma 42:9; Hel. 14:16); the terms for staying before the face were the nation’s own walking before it (1 Kgs. 2:4; 8:25; 9:4–7; 2 Kgs. 21:8), never met, and every reprieve recorded rests on something else (13:4–5, 23; 14:26–27; 8:19; 19:20, 34; 20:5–6; 22:19–20); it ends with a son of David fed “continually before” a king (25:29), kept for David’s sake (8:19) and named in Matt. 1:12, which the page reads beside Mephibosheth at David’s table for Jonathan’s sake (2 Sam. 9:7, 13) and beside Christ appearing before the face of God “for us” (Heb. 9:24); the steps from Kings to Alma and from 25:29 to Heb. 9:24 are the page’s own'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng'
    quote: 'I will remove Judah also out of my sight, as I have removed Israel'

  # ---------- Before whom I stand ----------
  - where: 'section “Before whom I stand”'
    claim: 'In 3:14 “before whom I stand” (lĕpānāyw) and “the presence of Jehoshaphat” (pĕnê) are both pānîm (H6440)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'עָמַ֣דְתִּי'
  - where: 'section “Before whom I stand”'
    claim: 'BDB: ʿāmad with lipnê means “attend upon, be(come) servant of,” and it lists 1 Kgs. 17:1; 18:15; 2 Kgs. 3:14; 5:16 and Jer. 15:19 as “servant of YHWH” under that heading'
    key: bdb
    url: 'https://biblehub.com/hebrew/5975.htm'
    quote: 'e. with לִפְנֵי attend upon, be(come) servant of 1 Samuel 16:22 (see Dr), 1 Kings 1:2 +; servant of ׳י 1 Kings 17:1; 1 Kings 18:15; 2 Kings 3:14; 2 Kings 5:16; Jeremiah 15:19'
  - where: 'section “Before whom I stand”'
    claim: 'Lane: pānîm literally means face; to enter a king’s court was to come before his face, into his presence, and the same was true of the temple'
    key: lane-presence-panim
    url: 'https://rsc.byu.edu/finding-christ-covenant-path/presence-lord-panim'
    quote: 'It literally means “face”—as in one’s visage, the front part of one’s head—but its usage has a broader sense. When entering the court of a king, one came before his face—that is, came into his presence. The same was true in the temple passages of the Old Testament.'
  - where: 'section “Before whom I stand”'
    claim: 'BDB: standing before the LORD “for intercession,” with Jer. 15:1 among the verses listed'
    key: bdb
    url: 'https://biblehub.com/hebrew/5975.htm'
    quote: 'before ׳י, for intercession Genesis 19:27 (J), Deuteronomy 4:10; Jeremiah 15:1; Jeremiah 18:20'
  - where: 'section “Before whom I stand”'
    claim: 'Jer. 15:1 “stood before me” is ʿāmad with lĕpānay (H6440), the construction of 2 Kgs. 3:14'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'לְ/פָנַ֔/י'

  # ---------- As yet ----------
  - where: 'section “As yet”'
    claim: '13:4 “besought the LORD” is wayĕḥal … ʾet-pĕnê YHWH: the verb ḥālâ (H2470) with the object “the face of” (pĕnê, H6440)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'וַ/יְחַ֥ל'
  - where: 'section “As yet”'
    claim: 'BDB: ḥālâ Piel followed by pĕnê means mollify, appease, entreat the favour of, literally make the face of anyone sweet or pleasant'
    key: bdb
    url: 'https://biblehub.com/hebrew/2470.htm'
    quote: 'Pi`el followed by מְּנֵי, מָּנֶיךָ, מָּנַיִךְ = mollify, appease, entreat the favour of, literally make the face of any one sweet or pleasant'
  - where: 'section “As yet”'
    claim: '13:23 “from his presence” is mēʿal pānāyw (H6440), and “as yet” is ʿad ʿattâ, “until now”; “because of his covenant” is lĕmaʿan bĕrîtô'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'הִשְׁלִיכָ֥/ם'
  - where: 'section “As yet”'
    claim: '“For David his servant’s sake” (8:19) and “for mine own sake, and for my servant David’s sake” (19:34; 20:6) are lĕmaʿan (H4616)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'לְמַֽעֲנִ֔/י'
  - where: 'section “As yet”'
    claim: 'BDB files lĕmaʿan Dāwid in 2 Kgs. 8:19 and 19:34 as “for the sake of David’s memory, and the promises given to him,” and lĕmaʿănî in 19:34 and 20:6 as “for my own sake, i.e. to vindicate my name”'
    key: bdb
    url: 'https://biblehub.com/hebrew/4616.htm'
    quote: 'i.e. for the sake of David''s memory, and the promises given to him, 1 Kings 11:12,13,32,34; 1 Kings 15:4; 2 Kings 8:19; 2 Kings 19:34 (= Isaiah 37:35), Isaiah 20:6 (all D2); לְמַעֲנִי (of ׳י) for my own sake, i.e. to vindicate my name, 2 Kings 19:34 (= Isaiah 37:35), 2 Kings 20:6'
  - where: 'section “As yet”'
    claim: '“Walk before me” in 1 Kgs. 2:4, 8:25 and 9:4 is lĕpānay (H6440), before my face'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'לְ/פָנַ֗/י'
  - where: 'section “As yet”'
    claim: '1 Kgs. 9:7 “will I cast out of my sight” is mēʿal pānay (H6440), the phrase of 2 Kgs. 23:27'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'אֲשַׁלַּ֖ח'
  - where: 'section “As yet”'
    claim: 'Bowen sets the Lord’s conditional promise to Nephi (2 Ne. 4:4, “inasmuch as ye will not keep my commandments ye shall be cut off from my presence”) beside the conditional dynastic promise to David in 1 Kgs. 2:2–4, 8:25 and 9:4–7'
    key: bowen-cut-off
    url: 'https://rsc.byu.edu/vol-21-no-2-2020/cut-off-face-presence'
    quote: 'The Lord’s covenant promises to Nephi distinctly resemble the conditional version of the Lord’s dynastic promise to David'
  - where: 'section “As yet”'
    claim: 'Bowen’s note quotes 2 Ne. 4:4, “inasmuch as ye will not keep my commandments ye shall be cut off from my presence”'
    key: bowen-cut-off
    url: 'https://rsc.byu.edu/vol-21-no-2-2020/cut-off-face-presence'
    quote: 'See 2 Nephi 4:4, which reads, “inasmuch as ye will not keep my commandments ye shall be cut off from my presence”'

  # ---------- Out of his sight ----------
  - where: 'section “Out of his sight”'
    claim: '17:18, 17:20 and 17:23 all have pānîm (H6440): pānāyw, mippānāyw, pānāyw'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'מִ/פָּנָֽי/ו'
  - where: 'section “Out of his sight”'
    claim: 'Keil on 17:18: God “removed them from His face”'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/17.htm'
    quote: 'This conduct excited the anger of God, so that He removed them from His face, and only left the tribe (i.e., the kingdom) of Judah'
  - where: 'section “Out of his sight”'
    claim: 'Keil on 17:20: “thrust them from His face”; he distinguishes “rejected” (penal chastisement meant to turn Israel) from “cast out of his sight,” which denotes driving into exile'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/17.htm'
    quote: 'humbled them till He thrust them from His face. מאס differs from מפּניו השׁליך. The latter denotes driving into exile; the former, simply that kind of rejection which consisted in chastisement'
  - where: 'section “Out of his sight”'
    claim: 'Keil on 17:23: “till the Lord removed them from His face”'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/17.htm'
    quote: 'till the Lord removed them from His face, thrust them out of the land of the Lord'
  - where: 'section “Out of his sight”'
    claim: 'The verdict formula “in the sight of the LORD” (28 verses of right or evil in the sight of the LORD, by occurrences.mjs) uses ʿênê (H5869), eyes, not pānîm; e.g. 17:2 bĕʿênê'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'בְּ/עֵינֵ֣י'
  - where: 'section “Out of his sight”'
    claim: 'Scripture Helps: those exiled to Assyria in large numbers “eventually became lost to history”; “There is much we do not know about the fate of the lost tribes of Israel”'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'Still other survivors were taken into exile in Assyria in large numbers, and they eventually became lost to history.'
  - where: 'section “Out of his sight”'
    claim: 'Scripture Helps: “There is much we do not know about the fate of the lost tribes of Israel”'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'There is much we do not know about the fate of the lost tribes of Israel.'
  - where: 'section “For us”'
    claim: 'Scripture Helps, on 2 Kings 17:5–23, quotes the Savior’s words of the lost tribes: “not lost unto the Father, for he knoweth whither he hath taken them”'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'But Jesus Christ taught that they were “not lost unto the Father, for he knoweth whither he hath taken them.”'
  - where: 'section “Out of his sight”'
    claim: 'The Student Manual: where the tribes went is not known, and the Lord has not revealed their location'
    key: ot-manual-kings-d
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-d?lang=eng'
    quote: 'Where they went is not known, and this fact has led to much speculation about their present whereabouts. The Lord has not seen fit to reveal their location'

  # ---------- Wept before me ----------
  - where: 'section “Wept before me”'
    claim: '“Before the LORD” in 19:14, 19:15 and 23:3, “before thee” in 20:3, and “before the LORD … before me” in 22:19 are lipnê / lĕpānêkā / lĕpānay, pānîm (H6440)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'לְ/פָנֶ֗י/ךָ'
  - where: 'section “Wept before me”'
    claim: '23:27 “out of my sight” is mēʿal pānay, first person, pānîm (H6440); 24:3 “out of his sight” and 24:20 “from his presence” are pānāyw'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'אָסִיר֙'

  # ---------- Continually before him ----------
  - where: 'section “Continually before him”'
    claim: '25:29 “continually before him” is tāmîd (H8548) with lĕpānāyw (H6440), the last occurrence of pānîm in the book'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'תָּמִ֛יד'
  - where: 'section “Continually before him”'
    claim: 'lipnê / lĕpānāyw is the everyday “before” of a person before a person in 2 Kings: the dossier’s grouping of the WLC occurrences counts 19 such verses (e.g. 4:12, the Shunammite “stood before him”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'לְ/פָנָֽי/ו'
  - where: 'section “Continually before him”'
    claim: 'BDB: tāmîd as an adverb means continually, “of going on without interruption = continuously”'
    key: bdb
    url: 'https://biblehub.com/hebrew/8548.htm'
    quote: 'a. of going on without interruption = continuously'
  - where: 'section “Continually before him”'
    claim: 'The Student Manual: Jehoiachin was released by Evil-merodach and “kindly treated by his Babylonian overlords”'
    key: ot-manual-19
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-19?lang=eng'
    quote: 'From that time until his death, the former king was kindly treated by his Babylonian overlords.'
  - where: 'section “Continually before him”'
    claim: 'Keil: no safe conjecture can be made as to Evil-merodach’s motives'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/25.htm'
    quote: 'We cannot make any safe conjecture as to the motives which induced Evil-merodach to pardon Jehoiachin and confer this distinction upon him.'
  - where: 'section “Continually before him”'
    claim: 'Keil reads the release as resting on God’s decree that David’s seed would not be utterly rejected (2 Sam. 7:14–15)'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/25.htm'
    quote: 'The higher ground of this joyful termination of his imprisonment lay in the gracious decree of God, that the seed of David, though severely chastised for its apostasy from the Lord, should not be utterly rejected (2 Samuel 7:14-15).'
  - where: 'section “Continually before him”'
    claim: 'Keil takes the release as “a comforting sign to the whole of the captive people” that the banishment would end if they acknowledged that for their sins “they had been driven away from before His face”'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/25.htm'
    quote: 'this event was also intended as a comforting sign to the whole of the captive people, that the Lord would one day put an end to their banishment, if they would acknowledge that it was a well-merited punishment for this sins that they had been driven away from before His face'
  - where: 'section “Continually before him”'
    claim: 'Keil at 25:29 glosses “ate continually before him” as “ate at the king’s table (cf. 2 Samuel 9:7)”; the paragraph’s only cross-reference for the phrase'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/25.htm'
    quote: '"And ate continually before him all his life," i.e., ate at the king''s table (cf. 2 Samuel 9:7).'
  - where: 'section “Continually before him”'
    claim: 'tāmîd (H8548) occurs three times in 2 Sam. 9 (verses 7, 10, 13), the dossier’s count from the WLC'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'תָּמִֽיד'
  - where: 'section “Continually before him”'
    claim: '“For Jonathan’s sake” in 2 Sam. 9:1 and 9:7 is baʿăbûr (H5668), not lĕmaʿan'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'בַּֽ/עֲבוּר֙'
  - where: 'section “Continually before him”'
    claim: 'Connection made by this page: 2 Kgs. 25:27–30 (a son of a fallen royal house brought from prison and fed “continually before” a king for life; the narrator silent on Evil-merodach’s motive, but David’s house kept “for David his servant’s sake … to his children,” 8:19) read beside 2 Sam. 9:1–13 (a son of a fallen royal house brought from Lo-debar and fed “continually” at the king’s table “for Jonathan’s sake”), and carried to Matt. 1:12, 16, where this Jehoiachin is “Jechonias” in the line to Christ; no Latter-day Saint source reads 25:27–30 as a figure of anything'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/9?lang=eng'
    quote: 'thou shalt eat bread at my table continually.'

  # ---------- Cut off from the presence ----------
  - where: 'section “Cut off from the presence”'
    claim: 'Guide to the Scriptures: spiritual death is “Separation from God and His influences”'
    key: gs-death-spiritual
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/death-spiritual?lang=eng'
    quote: 'Separation from God and His influences; to die as to things pertaining to righteousness.'
  - where: 'section “Cut off from the presence”'
    claim: 'Guide to the Scriptures: mortals with evil thoughts, words and works are spiritually dead while still alive on earth'
    key: gs-death-spiritual
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/death-spiritual?lang=eng'
    quote: 'Mortals with evil thoughts, words, and works are spiritually dead while still alive on earth (1 Tim. 5:6).'
  - where: 'section “Cut off from the presence”'
    claim: 'Bowen: Alma’s “cut off from the presence of the Lord” rests on the Hebrew pānîm, face, whose two senses Alma uses “to emphasize the relational nature of the physical and spiritual death that resulted from the Fall”'
    key: bowen-cut-off
    url: 'https://rsc.byu.edu/vol-21-no-2-2020/cut-off-face-presence'
    quote: 'how Alma uses the multiple meanings or senses—hereafter polysemy—of the Hebrew word pānîm, literally “face,”[2] in the idioms “cut off from the face of the earth” and “cut off . . . from the presence of the Lord” to emphasize the relational nature of the physical and spiritual death that resulted from the Fall.'
  - where: 'section “Cut off from the presence”'
    claim: 'Bowen: without the Atonement, being cut off from the Lord’s face would have been permanent'
    key: bowen-cut-off
    url: 'https://rsc.byu.edu/vol-21-no-2-2020/cut-off-face-presence'
    quote: 'Without the Atonement of Jesus Christ, the condition of spiritual death—being “cut off” from the Lord’s “face”—would have been permanent'
  - where: 'section “Cut off from the presence”'
    claim: 'Connection made by this page: Kings’ removal of a nation from the LORD’s face (17:18–23; 23:27; 24:3, 20) is the same idiom and the same kind of separation in which the Book of Mormon names the Fall and spiritual death (2 Ne. 9:6; Alma 42:9; Hel. 14:16), told as a nation’s history; and Jehoiachin before a Babylonian’s face is that removal carried out, “still before a face, and not the one the nation was made to come before”; no source makes the step'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/42?lang=eng'
    quote: 'that is, they were cut off from the presence of the Lord'
  - where: 'section “Cut off from the presence”'
    claim: 'Lane: the men of Israel were commanded to come before the face of the Lord three times a year, at the temple festivals'
    key: lane-presence-panim
    url: 'https://rsc.byu.edu/finding-christ-covenant-path/presence-lord-panim'
    quote: 'The men of Israel were commanded to come before the face of the Lord three times a year during the three required temple festivals'

  # ---------- For us ----------
  - where: 'section “For us”'
    claim: 'Thayer: in Heb. 9:24 the phrase with prosōpon means “to appear before the face of God, spoken of Christ, the eternal priest, who has entered into the heavenly sanctuary”'
    key: thayer
    url: 'https://biblehub.com/greek/4383.htm'
    quote: 'to appear before the face of God, spoken of Christ, the eternal priest, who has entered into the heavenly sanctuary, Hebrews 9:24'
  - where: 'section “For us”'
    claim: 'Connection made by this page: the row from Elisha standing before the face for the sake of Jehoshaphat’s presence (3:14), Israel kept before it for the fathers’ sake (13:23) and Judah for David’s (8:19; 19:34; 20:6) and kings heard there (19:20; 20:5; 22:19), Mephibosheth fed for Jonathan’s sake (2 Sam. 9:7) and Jehoiachin as the kept seed of David (25:29; 8:19), to Christ appearing before the face of God “for us” (Heb. 9:24), is the page’s arrangement; no source joins Kings to Heb. 9:24'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/9?lang=eng'
    quote: 'now to appear in the presence of God for us'
  - where: 'section “For us”'
    claim: 'The Bible Dictionary: “Jehovah is the premortal Jesus Christ,” citing D&C 110:1–10'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary (see Mosiah 3:8; 15:1; 3 Ne. 15:1–5; D&C 110:1–10).'
  - where: 'section “For us”'
    claim: 'Connection made by this page: the first-person “my sight” of 23:27 and “my presence” of Ether 3:13 are one speaker, Jehovah, who is the premortal Christ; the pairing is the page’s'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/ether/3?lang=eng'
    quote: 'therefore ye are brought back into my presence; therefore I show myself unto you.'
  - where: 'section “For us”'
    claim: 'The Topical Guide, “God, Presence of,” lists Hel. 14:15 with Morm. 9:13 and Ether 3:13 as “men may be brought into the presence of the Lord”'
    key: tg-god-presence-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/tg/god-presence-of?lang=eng'
    quote: 'men may be brought into the presence of the Lord, Hel. 14:15'
  - where: 'section “For us”'
    claim: 'Scripture Helps’ endnote on the restoration of the Ten Tribes, in its section on 2 Kings 17:5–23, sends the reader to D&C 110:11'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'See also Jeremiah 3:18; 16:15; 31:8; Doctrine and Covenants 110:11; 133:26.'

  # ---------- The disciple ----------
  - where: 'section “The disciple”'
    claim: 'Connection made by this page: 2 Ne. 2:8 (“no flesh that can dwell in the presence of God, save it be through the merits, and mercy, and grace of the Holy Messiah”) read as the doctrine Kings’ history of its kingdoms was writing toward; the step is the page’s'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/2?lang=eng'
