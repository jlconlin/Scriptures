chapter: 2
claims:
  - where: 'setting'
    claim: 'Elisha was called in 1 Kgs. 19:16–21; Elijah is translated in this chapter; the chapter heading gives its course.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/2?lang=eng'
    quote: 'Elisha and the prophets know that Elijah is to be translated—Elijah divides the waters of the Jordan and is taken up into heaven in a whirlwind—The mantle of Elijah falls on Elisha'
  - where: 'setting'
    claim: 'Elijah and Elisha were together six or seven years; afterward Elisha was the leading prophet of the north for more than fifty years; his record is mostly miracles of kindness.'
    key: bd-elisha
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elisha?lang=eng'
    quote: 'They seem to have been together some six or seven years. After Elijah’s translation, Elisha was the leading prophet of the northern kingdom and the trusted adviser of the kings of Israel. His miracles form the chief part of his recorded work. These were for the most part acts of kindness and mercy'
  - where: 'setting'
    claim: 'Elisha’s ministry lasted more than fifty years.'
    key: bd-elisha
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elisha?lang=eng'
    quote: 'His ministry lasted more than 50 years, during the reigns of Jehoram, Jehu, Jehoahaz, and Joash.'
  - where: 'setting'
    claim: '2 Kings 1–2 is the only detailed biblical account of prophetic succession.'
    key: woods-elisha-children
    url: 'https://byustudies.byu.edu/article/elisha-and-the-children-the-question-of-accepting-prophetic-succession'
    quote: '2 Kings 1–2 contains the only detailed biblical account of prophetic succession.'
  - where: 'thread'
    claim: 'The chiastic structure of 2 Kings 1–2 is climaxed by Elijah’s ascension (2:11).'
    key: woods-elisha-children
    url: 'https://byustudies.byu.edu/article/elisha-and-the-children-the-question-of-accepting-prophetic-succession'
    quote: 'These chapters also form a chiastic structure, climaxed by the ascension of Elijah in 2 Kings 2:11.'
  - where: 'thread'
    claim: 'One older reading: the two miracles of 2:19–25 were meant to accredit Elisha as endowed with the Spirit and power of God, as Elijah had been.'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/2.htm'
    quote: 'The two following miracles of Elisha (2 Kings 2:19-25) were also intended to accredit him in the eyes of the people as a man endowed with the Spirit and power of God, as Elijah had been.'
  - where: 'section 1 plain'
    claim: '“From thy head” means from over you as leader of the group.'
    key: ot-minute-2-kings-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-2'
    quote: 'in Hebrew, like often in English, the leader of an organization is called a “head.” Thus this phrase might be better translated as “the Lord will take away thy master as the head of your group today.”'
  - where: 'section 2 plain'
    claim: '“Wrapped it together” is better “rolled up.”'
    key: ot-minute-2-kings-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-2'
    quote: '“Wrapped it together” might be better translated as “rolled up,” but the original word is obscure'
  - where: 'section 4 plain'
    claim: 'The Hebrew for “cruse” is dish or bowl.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/2?lang=eng'
    quote: '20a “cruse”: HEB dish, bowl.'
  - where: 'section 5 plain'
    claim: 'The Hebrew for “little children” means youths.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/2?lang=eng'
    quote: '23a “little children”: HEB youths (not little children).'

  - where: 'note 2:2 “Three times told to stay”'
    claim: 'Whether the three places matter is unknown.'
    key: ot-minute-2-kings-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-2'
    quote: 'Three times at three different places—Gilgal, Beth-el, and Jericho—Elijah told Elisha to stay, and Elisha responded with an oath that he would not leave Elijah. Whether the locations have any significance to the story is unknown.'
  - where: 'note 2:2 “Three times told to stay”'
    claim: 'Bethel was where Jacob saw the ladder; it may be significant that Elijah visited it first.'
    key: ot-minute-2-kings-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-2'
    quote: 'Beth-el was the location of Jacob’s vision of the ladder or stair to heaven. As Elijah was about to take a route into heaven, it might be significant that he visited Beth-el first.'
  - where: 'note 2:2 “Three times told to stay”'
    claim: 'The Gilgal of 2:1 is a place near Bethel, not the Gilgal of Joshua’s stones by Jericho.'
    key: bd-gilgal
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gilgal?lang=eng'
    quote: '(2) A place near Bethel, visited by Elijah and Elisha (Deut. 11:30; 2 Kgs. 2:1).'
  - where: 'note 2:2 “Three times told to stay”'
    claim: 'One older reading: Elijah went by the Spirit’s impulse to visit the schools of the prophets; Elisha stayed to be an eyewitness and receive the firstborn’s inheritance.'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/2.htm'
    quote: 'He therefore took this way from an impulse received from the Spirit of God, that he might visit the schools of the prophets … resolved, certainly also from an inward impulse of the Spirit of God, to be an eye-witness of his glorification, that he might receive the spiritual inheritance of the first-born'
  - where: 'note 2:2 “Three times told to stay”'
    claim: 'Joshua’s stones at Gilgal (Josh. 4), Jacob at Bethel, Joshua’s curse on Jericho (Josh. 6:26) and its rebuilding: the scriptures and the footnotes to 2:1–4.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/2?lang=eng'
    quote: '2b “Beth-el”: Gen. 12:8 (7–8); 28:19 (16–19)'

  - where: 'note 2:3 “The sons of the prophets”'
    claim: 'The sons of the prophets were bands living together for instruction and worship; not all claimed a supernatural gift; Amos 7:14.'
    key: bd-schools-of-the-prophets
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/schools-of-the-prophets?lang=eng'
    quote: 'The name given to bands of prophets or “sons of prophets” living together for instruction and worship under Samuel, Elijah, and Elisha. Little is known about these schools … they were simply trained religious teachers, while some inspired prophets had received no training in the schools (Amos 7:14'
  - where: 'note 2:3 “The sons of the prophets”'
    claim: '“From thy head” means as head of the group.'
    key: ot-minute-2-kings-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-2'
    quote: 'Thus this phrase might be better translated as “the Lord will take away thy master as the head of your group today.”'
  - where: 'note 2:3 “The sons of the prophets”'
    claim: 'The text: they knew, and Elisha answers “hold ye your peace”; they bow to him in 2:15.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/2?lang=eng'
    quote: '3a “sons”: 1 Kgs. 20:35.'

  - where: 'note 2:9 “A double portion of thy spirit”'
    claim: 'The birthright son received a double portion; Elisha expressed willingness to be Elijah’s successor and may have asked for an added measure of the Holy Ghost.'
    key: scripture-helps-2-kings-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/26-2-kings-2-7?lang=eng'
    quote: 'Elisha regarded Elijah not only as a teacher but also as a father. In Israelite tradition, the birthright son was traditionally given a double portion … Elisha may have also been asking for an added measure of the Holy Ghost to help him in his prophetic role.'
  - where: 'note 2:9 “A double portion of thy spirit”'
    claim: 'The Hebrew pî šᵉnayim of 2:9.'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'שְׁנַ֥יִם'
  - where: 'note 2:9 “A double portion of thy spirit”'
    claim: 'The same two words in Deut. 21:17.'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'שְׁנַ֔יִם'
  - where: 'note 2:9 “A double portion of thy spirit”'
    claim: 'The firstborn’s share is a better explanation than more miracles; one portion for himself and one to guide the people.'
    key: woods-elisha-children
    url: 'https://byustudies.byu.edu/article/elisha-and-the-children-the-question-of-accepting-prophetic-succession'
    quote: 'Some may interpret this doubling to mean that Elisha performed greater and more miracles than did Elijah. A better explanation would be that Elisha was probably alluding to the prerogative of the firstborn … Perhaps Elisha was asking Elijah for one portion of the spirit for himself and one portion of the spirit in order to guide the people.'
  - where: 'note 2:9 “A double portion of thy spirit”'
    claim: 'The spirit is most likely the Spirit of God; Elijah could not grant it; it depended on God.'
    key: wilson-holy-spirit
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/holy-spirit'
    quote: 'Elisha, asked for a double portion of Elijah’s spirit—most likely meaning the Spirit of God (see 2 Kings 2:9, 15). … However, Elijah could not grant a double portion of the Spirit—the gift was utterly dependent upon God.'
  - where: 'note 2:9 “A double portion of thy spirit”'
    claim: 'Deut. 21:17, the footnote to 2:9.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/2?lang=eng'
    quote: '9a “double”: Deut. 21:17.'

  - where: 'note 2:11 “Elijah translated”'
    claim: 'Elijah was taken without dying, translated; appeared translated at the Transfiguration and resurrected at Kirtland.'
    key: scripture-helps-2-kings-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/26-2-kings-2-7?lang=eng'
    quote: 'Elijah was taken into heaven without dying, which means he was translated. … Elijah later appeared as a translated being on the Mount of Transfiguration to help give the keys of the priesthood to Peter, James, and John. Later, Elijah also appeared as a resurrected being to Joseph Smith and Oliver Cowdery in the Kirtland Temple'
  - where: 'note 2:11 “Elijah translated”'
    claim: 'Definition of translated beings.'
    key: gs-translated-beings
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/translated-beings?lang=eng'
    quote: 'Persons who are changed so that they do not experience pain or death until their resurrection to immortality.'
  - where: 'note 2:11 “Elijah translated”'
    claim: 'Heaven here is not celestial glory; Joseph Smith on translation, the terrestrial order and the labors of the ministry.'
    key: ot-manual-5
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-5?lang=eng'
    quote: 'Elijah was taken from this earth as a translated being, but not into celestial glory.'
  - where: 'note 2:11 “Elijah translated”'
    claim: 'Joseph Smith: translation not into an eternal fulness; the terrestrial order.'
    key: ot-manual-5
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-5?lang=eng'
    quote: 'Many have supposed that the doctrine of translation was a doctrine whereby men were taken immediately into the presence of God, and into an eternal fullness, but this is a mistaken idea. Their place of habitation is that of the terrestrial order'
  - where: 'note 2:11 “Elijah translated”'
    claim: 'Joseph Smith: translation delivers from suffering but prolongs the labors of the ministry.'
    key: ot-manual-5
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-5?lang=eng'
    quote: 'translation obtains deliverance from the tortures and sufferings of the body, but their existence will prolong as to the labors and toils of the ministry'
  - where: 'note 2:11 “Elijah translated”'
    claim: 'The whirlwind word is rare and used mostly of divine weather; not the word of 1 Kgs. 19:11; the fire may mark the chariot as heavenly.'
    key: ot-minute-2-kings-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-2'
    quote: 'Fire here might just be the heavenly association or glorious nature of the chariots and horses. The Hebrew word for “whirlwind” … is a rare word occurring only about two dozen times in the Old Testament. Most of the usage has reference to divine weather. … not the word for “great and strong wind” used in 1 Kings 19:11'
  - where: 'note 2:11 “Elijah translated”'
    claim: 'The footnotes at 2:11 point to Translated Beings.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/2?lang=eng'
    quote: '11b “Elijah”: TG Translated Beings.'

  - where: 'note 2:12 “The chariot of Israel”'
    claim: '“My father” is figurative.'
    key: scripture-helps-2-kings-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/26-2-kings-2-7?lang=eng'
    quote: 'Elisha called Elijah his father figuratively in 2 Kings 2:12.'
  - where: 'note 2:12 “The chariot of Israel”'
    claim: 'One older reading: spiritual father; chariots and horsemen the kings’ might, symbol of Elijah’s defense of Israel; rending clothes for sorrow.'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/2.htm'
    quote: 'He called Elijah אבי, "my father," as his spiritual father … "Chariot (war-chariot) and horsemen of Israel," on which the Israelitish kings based the might and security of their kingdom, are a symbolical representation of the strong defence which Elijah had been through his ministry to the kingdom of Israel'
  - where: 'note 2:12 “The chariot of Israel”'
    claim: 'Rending the clothes was a proof of sorrow.'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/2.htm'
    quote: 'he took hold of his clothes and rent them in two pieces, i.e., from the top to the bottom, as a proof of the greatness of his sorrow at his being taken away.'
  - where: 'note 2:12 “The chariot of Israel”'
    claim: 'Joash uses the same phrase at Elisha’s death, tying the two prophets together.'
    key: woods-elisha-children
    url: 'https://byustudies.byu.edu/article/elisha-and-the-children-the-question-of-accepting-prophetic-succession'
    quote: 'this exact phrase is used by Joash, king of Israel, when Elisha departed from him at Elisha’s death (2 Kings 13:14). This reoccurrence lends further credence to the idea that the editor of the book of Kings is trying to tie together the prophetic characteristics of Elijah and Elisha.'
  - where: 'note 2:12 “The chariot of Israel”'
    claim: 'The text of 2:12 and 13:14.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/2?lang=eng'
    quote: '11a “chariot”: Abr. 2:7.'

  - where: 'note 2:13 “The mantle falls”'
    claim: 'The mantle symbolized authority; first in 1 Kgs. 19; its falling symbolized the calling officially passed.'
    key: scripture-helps-2-kings-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/26-2-kings-2-7?lang=eng'
    quote: 'Elijah’s mantle, or robe, was a symbol of his authority. This mantle is first mentioned in 1 Kings 19, when Elijah placed it upon Elisha to designate him as Elijah’s successor. The mantle falling to Elisha as Elijah was taken into heaven symbolized Elijah’s prophetic calling and authority officially being passed to Elisha.'
  - where: 'note 2:13 “The mantle falls”'
    claim: 'Only now could Elisha take the mantle completely as his own.'
    key: ot-minute-2-kings-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-2'
    quote: 'Perhaps that was a symbolic action to declare Elisha his heir, and only now that Elijah was gone could Elisha take the mantle completely as his own.'
  - where: 'note 2:13 “The mantle falls”'
    claim: '’adderet can mean mantle, garment or glory; Elijah wore a hairy mantle (2 Kgs. 1:8; Zech. 13:4).'
    key: woods-elisha-children
    url: 'https://byustudies.byu.edu/article/elisha-and-the-children-the-question-of-accepting-prophetic-succession'
    quote: 'The word ’adderet may be translated as either mantle, garment, or glory. … The combination of these two words lends strong support to the interpretation in 2 Kings 1:8 that Elijah was a man with a hairy mantle or garment rather than being just a hairy man.'
  - where: 'note 2:13 “The mantle falls”'
    claim: 'The cloak was not the source of power; the Spirit supplied it.'
    key: wilson-holy-spirit
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/holy-spirit'
    quote: 'The cloak was not the source of spiritual power though—the Spirit supplied God’s power.'
  - where: 'note 2:13 “The mantle falls”'
    claim: 'The footnote at 2:8 points to 1 Kgs. 19:19.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/2?lang=eng'
    quote: '8a “mantle”: 1 Kgs. 19:19.'

  - where: 'note 2:14 “The Jordan parted again”'
    claim: 'The Elijah–Elisha succession recalls Moses to Joshua; Moses parted the sea and healed Marah; Joshua and Elisha crossed the Jordan dry.'
    key: woods-elisha-children
    url: 'https://byustudies.byu.edu/article/elisha-and-the-children-the-question-of-accepting-prophetic-succession'
    quote: 'It is difficult to read this narrative without comparing the transitions of authority from Moses to Joshua … Moses parted the Red Sea (Ex. 14) and healed the waters of Marah (Ex. 15:23–25). Elisha also parted the Jordan River and healed the bitter water of Jericho'
  - where: 'note 2:14 “The Jordan parted again”'
    claim: 'Both used the mantle as evidence that Jehovah’s power was invested in their appointment; one walked into Israel to lead, the other went out.'
    key: woods-elisha-children
    url: 'https://byustudies.byu.edu/article/elisha-and-the-children-the-question-of-accepting-prophetic-succession'
    quote: 'Both men used this object to part the River Jordan as evidence that the power of Jehovah was invested in their appointment. One walked into Israel to lead her, and the other went out.'
  - where: 'note 2:14 “The Jordan parted again”'
    claim: 'The sons of the prophets recognized his authority after he parted the Jordan as Elijah had.'
    key: scripture-helps-2-kings-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/26-2-kings-2-7?lang=eng'
    quote: 'The “sons of the prophets” recognized Elisha’s prophetic authority after he parted the Jordan River just as Elijah had done.'
  - where: 'note 2:14 “The Jordan parted again”'
    claim: 'More than two dozen miracle stories in 2–7, some echoing Elijah’s, such as the parted Jordan.'
    key: barlow-miracles
    url: 'https://mi.byu.edu/old-testament-reflections/what-are-miracles-for'
    quote: 'more than two dozen such stories, in rapid sequence, in just chapters 2–7. Some of these miracles echo those performed by his predecessor, Elijah, such as Elisha striking the river Jordan with Elijah''s inherited cloak'
  - where: 'note 2:14 “The Jordan parted again”'
    claim: 'The footnotes point to Ex. 14:21 and Josh. 3:16.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/2?lang=eng'
    quote: '8b “waters”: Ex. 14:21; Josh. 3:16 (14–17).'

  - where: 'note 2:16 “Fifty men search three days”'
    claim: 'They wanted to search for Elijah or his body, thinking the wind had carried him.'
    key: ot-minute-2-kings-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-2'
    quote: 'The sons of the prophets wanted to search for Elijah or for his body, thinking that perhaps the wind blew him against some mountain or into some valley.'
  - where: 'note 2:16 “Fifty men search three days”'
    claim: 'The text of 2:16–18; the footnote to the Spirit.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/2?lang=eng'
    quote: '16a “Spirit”: 1 Ne. 11:1; Alma 45:19 (18–19); Moses 6:64.'

  - where: 'note 2:21 “Healed with salt”'
    claim: 'Salt normally corrupts water, so the miracle is greater.'
    key: ot-manual-5
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-5?lang=eng'
    quote: 'The use of salt makes this a greater miracle, since salt normally corrupts rather than purifies water.'
  - where: 'note 2:21 “Healed with salt”'
    claim: 'Jericho’s water near the Dead Sea was likely too salty; the healing recalls Moses.'
    key: ot-minute-2-kings-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-2'
    quote: 'The act of healing waters is reminiscent of Moses in the desert with the children of Israel. Jericho was next to the Dead Sea, so water there would likely be too salty for humans or plants. That Elisha healed the water by adding more salt just adds more to the miracle.'
  - where: 'note 2:21 “Healed with salt”'
    claim: 'Moses parted the sea and healed Marah; Elisha parted the Jordan and healed Jericho.'
    key: woods-elisha-children
    url: 'https://byustudies.byu.edu/article/elisha-and-the-children-the-question-of-accepting-prophetic-succession'
    quote: 'Moses parted the Red Sea (Ex. 14) and healed the waters of Marah (Ex. 15:23–25). Elisha also parted the Jordan River and healed the bitter water of Jericho (2 Kings 2:14–22).'
  - where: 'note 2:21 “Healed with salt”'
    claim: 'One older reading: salt a symbol of incorruptibility and of life destroying death, the substratum of the divine word; the new dish the renewing power of the word.'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/2.htm'
    quote: 'Salt, according to its power of preserving from corruption and decomposition, is a symbol of incorruptibility and of the power of life which destroys death … As such it formed the earthly substratum for the spiritual power of the divine word … A new dish was taken for the purpose … as a symbol of the renewing power of the word of God.'
  - where: 'note 2:21 “Healed with salt”'
    claim: 'The spring is Ain es-Sultan, the only spring near Jericho, watering the plain.'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/2.htm'
    quote: 'is no doubt the present spring Ain es Sultn, the only spring near to Jericho, the waters of which spread over the plain of Jericho'
  - where: 'note 2:21 “Healed with salt”'
    claim: 'One older reading grants salt may take away bad water’s taste, but a dish of it could not heal a spring for ever, and the means does not remove the miracle.'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/2.htm'
    quote: 'could not be so greatly improved by pouring in a dish of salt, that the water lost its injurious qualities for ever, even if salt does possess the power of depriving bad water of its unpleasant taste and injurious effects. The use of these natural means does not remove the miracle.'
  - where: 'note 2:21 “Healed with salt”'
    claim: 'The footnote points to Ex. 15:25.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/2?lang=eng'
    quote: '21b “waters”: Ex. 15:25; Ezek. 47:8 (8–9).'

  - where: 'note 2:23 “The youths and the bears”'
    claim: 'They were older youths or young men; why they harassed him is unknown; the event was serious and may have been a warning to Israel.'
    key: scripture-helps-2-kings-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/26-2-kings-2-7?lang=eng'
    quote: 'The Hebrew text indicates that these were not young children but older youths or even young men. It is unknown why they harassed Elisha or what their specific insults meant. But Elisha’s curse upon them and the subsequent bear attack indicate that their actions were serious and deeply offensive.'
  - where: 'note 2:23 “The youths and the bears”'
    claim: 'The event may have been a warning to Israel about rejecting prophets.'
    key: scripture-helps-2-kings-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/26-2-kings-2-7?lang=eng'
    quote: 'This event may have also been a warning to Israel that the judgments of God would come upon them if they continued to reject His prophets.'
  - where: 'note 2:23 “The youths and the bears”'
    claim: 'The same Hebrew words describe Solomon after he became king (1 Kgs. 3:7).'
    key: scripture-helps-2-kings-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/26-2-kings-2-7?lang=eng'
    quote: 'The same Hebrew words used to describe the youths in this account are also used to describe Solomon after he became king (see 1 Kings 3:7)'
  - where: 'note 2:23 “The youths and the bears”'
    claim: '“Go up” points back to Elijah’s going up in 2:11: try to ascend as Elijah did.'
    key: woods-elisha-children
    url: 'https://byustudies.byu.edu/article/elisha-and-the-children-the-question-of-accepting-prophetic-succession'
    quote: 'This taunt seems to point back to 2 Kings 2:11, in which Elijah went up into heaven. The mocking youths may be saying or implying, “Go ahead, try to ascend to heaven as Elijah did, you usurper of authority!”'
  - where: 'note 2:23 “The youths and the bears”'
    claim: 'Calling him bald refused the hairy garment of authority; accused him as usurper.'
    key: woods-elisha-children
    url: 'https://byustudies.byu.edu/article/elisha-and-the-children-the-question-of-accepting-prophetic-succession'
    quote: 'I submit that these mocking youths called Elisha qērēaḥ because they refused to acknowledge the legitimacy of the hairy garment that Elisha now wore as a symbol of prophetic authority.'
  - where: 'note 2:23 “The youths and the bears”'
    claim: 'The Law’s warning of wild beasts against those who walk contrary (Lev. 26:21–22).'
    key: woods-elisha-children
    url: 'https://byustudies.byu.edu/article/elisha-and-the-children-the-question-of-accepting-prophetic-succession'
    quote: 'As a result, they incurred the vengeance of God who had previously warned, “And if you walk contrary to me, . . . I will send wild beasts among you, which shall rob you of your children” (Lev. 26:21–22).'
  - where: 'note 2:23 “The youths and the bears”'
    claim: 'The seminary manual relays Rasmussen: the bears did not kill but lacerated them.'
    key: ot-seminary-lesson-97
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-2-kings/lesson-97-2-kings-1-4?lang=eng'
    quote: 'The bears did not kill the offenders, as some commentaries assume, but ‘tare,’ or lacerated, them'
  - where: 'note 2:23 “The youths and the bears”'
    claim: 'The Student Manual: the idea ends with the curse; the assumption that Elisha directed the bears may not be justified.'
    key: ot-manual-5
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-5?lang=eng'
    quote: 'In verse 24 the idea ends. This ending is indicated by a period after “and cursed them in the name of the Lord.” The verse then states that two she bears came out of the woods. The assumption that Elisha directed the bears may not be justified.'
  - where: 'note 2:23 “The youths and the bears”'
    claim: 'The footnote at 2:23 gives the Hebrew as youths.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/2?lang=eng'
    quote: '23a “little children”: HEB youths (not little children).'

