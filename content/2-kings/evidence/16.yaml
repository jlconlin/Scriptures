chapter: 16
claims:
  - where: setting
    claim: 'Assyria was the dominant power of the Near East, known for desolating conquered lands and deporting their people'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'Assyria was a dominant power in the ancient Near East, particularly during the eighth and seventh centuries BC. … The Assyrians had a reputation for viciously desolating the lands and torturing the people they conquered. They also often deported large portions of a conquered population'
  - where: setting
    claim: 'Tiglath-pileser III ruled about 747–727 BC and began collecting tribute from Israel and Judah'
    key: rsc-combs-ahaz-sign
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/king-ahazs-sign-christ-jesus'
    quote: 'Tiglath-pileser III, king of Assyria (c. 747–727 BC), sometimes called Pul (see 2 Kings 15:19), made incursions into the land and began to collect tribute from Israel and Judah'
  - where: setting
    claim: 'Rezin tried to form a coalition of the kingdoms Assyria had subjected; Pekah joined, Judah would not'
    key: rsc-combs-ahaz-sign
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/king-ahazs-sign-christ-jesus'
    quote: 'Rezin, king of Syria, attempted to form a coalition of those kingdoms that had been subjugated by Assyria; this included both the Kingdom of Israel and the Kingdom of Judah. Israel, under the rule of Pekah, joined with Rezin, but Judah would not.'
  - where: setting
    claim: 'The two kings meant to replace Ahaz with a king who would join their alliance'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'When Ahaz refused, Israel and Syria threatened to go to battle against Judah and replace Ahaz with a leader who would join their alliance.'
  - where: setting
    claim: 'The attack is called the Syro-Ephraimite war, about 734 BC; only Isaiah tells of the prophet''s intervention'
    key: rsc-combs-ahaz-sign
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/king-ahazs-sign-christ-jesus'
    quote: 'This attack against Judah is known as the Syro-Ephraimite War (c. 734 BC) … Both 2 Kings and Isaiah describe the siege of Jerusalem laid by the armies of Pekah and Rezin, but only Isaiah includes an account of prophetic intervention.'
  - where: setting
    claim: 'Chronicles tells of the defeats Judah suffered from Syria and Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/28?lang=eng'
    quote: 'Wherefore the Lord his God delivered him into the hand of the king of Syria; and they smote him, and carried away a great multitude of them captives, and brought them to Damascus.'
  - where: thread
    claim: 'Isaiah told Ahaz to rely on the Lord and not seek help from Assyria; Ahaz disregarded him'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'Isaiah encouraged Ahaz and the people of Judah to rely on the Lord for deliverance from the armies of Pekah and Rezin. He also encouraged Ahaz not to seek help from Assyria. However, Ahaz disregarded Isaiah’s counsel'
  - where: thread
    claim: 'After the alliance Ahaz made unauthorized changes to the furnishings and ordinances of the temple'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'Ahaz persisted in his apostasy after he made an alliance with Assyria. He made unauthorized changes to the furnishings and ordinances of the temple'
  - where: section 2 plain
    claim: '“Present” rendered as a payment for favor (the Hebrew word is the one for a bribe)'
    key: bdb
    url: 'https://biblehub.com/hebrew/7810.htm'
    quote: 'noun masculine present, specifically bribe'
  - where: section 3 plain
    claim: '“Meat offering” is the meal or grain offering'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/16.htm'
    quote: '13. his meat offering] R.V. meal-offering.'
  - where: section 3 plain
    claim: '“To inquire by” rendered as “I will consider what to do with it”'
    key: bdb
    url: 'https://biblehub.com/hebrew/1239.htm'
    quote: 'compare perhaps 2 Kings 16:15 consider (what shall be done with the old altar)'
  - where: section 4 plain
    claim: 'The sea was set on a base of stone'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_kings/16.htm'
    quote: 'took down the sea from the brazen oxen that were under it, and set it upon a base of stone.'
  - where: section 4 plain
    claim: '“Covert for the sabbath” rendered as a covered way'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/16.htm'
    quote: '18. And the covert [R.V. the covered way] for the sabbath]'
  - where: 'note 16:2 “A very young father”'
    claim: 'Hezekiah was twenty-five at his accession'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/18?lang=eng'
    quote: 'Twenty and five years old was he when he began to reign; and he reigned twenty and nine years in Jerusalem.'
  - where: 'note 16:2 “A very young father”'
    claim: 'The Greek of 2 Chronicles 28:1 makes Ahaz twenty-five at his accession'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_chronicles/28.htm'
    quote: 'Achaz was five and twenty years old when he began to reign, and he reigned sixteen years in Jerusalem'
  - where: 'note 16:3 “His son through the fire”'
    claim: 'Chronicles says Ahaz burnt his children in the fire'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/28?lang=eng'
    quote: 'Moreover he burnt incense in the valley of the son of Hinnom, and burnt his children in the fire, after the abominations of the heathen'
  - where: 'note 16:3 “His son through the fire”'
    claim: 'The verse leaves doubt whether Ahaz killed his son or initiated him; Chronicles supports an actual human sacrifice; commentators agree Ahaz killed some of his children'
    key: ot-manual-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-12?lang=eng'
    quote: 'This verse leaves some doubt about what Ahaz did. Did he kill his son or merely initiate him into the worship of a false god? Second Chronicles 28:3 supports the idea of an actual human sacrifice, and the commentators generally agree that Ahaz did murder some of his children in this fashion.'
  - where: 'note 16:3 “His son through the fire”'
    claim: 'Molech, the Ammonite fire god, served by passing children through fire or burning them'
    key: bd-molech
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/molech?lang=eng'
    quote: 'The abomination of the children of Ammon, a fire god, worshipped by passing children through or burning them in fire (Deut. 18:10; 2 Chr. 28:3).'
  - where: 'note 16:3 “His son through the fire”'
    claim: 'An older reading places the sacrifice during the Syrian oppression, to appease the gods, as the king of Moab did'
    key: ot-manual-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-12?lang=eng'
    quote: 'The offering of his son for Moloch took place, in all probability, during the severe oppression of Ahaz by the Syrians, and was intended to appease the wrath of the gods, as was done by the king of the Moabites in similar circumstances [2 Kings 3:27].'
  - where: 'note 16:3 “His son through the fire”'
    claim: 'Keil puts the sacrifice in all probability in the Syrian oppression, to appease the gods, as the king of Moab did'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/16.htm'
    quote: 'The offering of his son for Moloch took place, in all probability, during the severe oppression of Ahaz by the Syrians, and was intended to appease the wrath of the gods'
  - where: 'note 16:7 “Servant and son of Assyria”'
    claim: 'Pekah and Rezin wanted Judah in their alliance; when Ahaz refused they meant to replace him'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'The kings of Israel (Pekah) and Syria (Rezin) wanted King Ahaz and the people of Judah to join them in an alliance to resist Assyria’s dominance. When Ahaz refused, Israel and Syria threatened to go to battle against Judah and replace Ahaz'
  - where: 'note 16:7 “Servant and son of Assyria”'
    claim: 'Isaiah counseled reliance on the Lord and against seeking Assyria''s help; Ahaz disregarded him'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'He also encouraged Ahaz not to seek help from Assyria. However, Ahaz disregarded Isaiah’s counsel and asked the king of Assyria for protection.'
  - where: 'note 16:7 “Servant and son of Assyria”'
    claim: 'Only Isaiah tells of the prophet''s intervention'
    key: rsc-combs-ahaz-sign
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/king-ahazs-sign-christ-jesus'
    quote: 'Both 2 Kings and Isaiah describe the siege of Jerusalem laid by the armies of Pekah and Rezin, but only Isaiah includes an account of prophetic intervention.'
  - where: 'note 16:7 “Servant and son of Assyria”'
    claim: 'A fragmentary Assyrian record lists tribute from Ahaz under his full name Jehoahaz'
    key: rsc-combs-ahaz-sign
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/king-ahazs-sign-christ-jesus'
    quote: 'A fragmentary Assyrian record from the period corroborates the biblical account. In that record, Tiglath-pileser boasts of the tribute that he received from Ahaz of Judah (identified by his full name, Jehoahaz):'
  - where: 'note 16:7 “Servant and son of Assyria”'
    claim: 'The list names Jehoahaz of Judah beside the rulers of Ashkelon, Edom and Gaza, paying gold, silver and costly goods'
    key: rsc-combs-ahaz-sign
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/king-ahazs-sign-christ-jesus'
    quote: 'Mitinti of Ashkelon, Jehoahaz of Judah, Kaush-malaku of Edom, Muzr[i . . .], Hanno of Gaza, (consisting of) gold, silver, tin, iron'
  - where: 'note 16:8 “A present, or a bribe”'
    claim: 'The Hebrew word in verse 8 is šōḥad'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'שֹֽׁחַד'
  - where: 'note 16:8 “A present, or a bribe”'
    claim: 'šōḥad is a present, specifically a bribe, usually to pervert justice (Ex. 23:8; Deut. 16:19)'
    key: bdb
    url: 'https://biblehub.com/hebrew/7810.htm'
    quote: 'noun masculine present, specifically bribe; … bribe, usually to pervert justice'
  - where: 'note 16:8 “A present, or a bribe”'
    claim: 'Isaiah had told Ahaz to rely on the Lord for deliverance'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'Isaiah encouraged Ahaz and the people of Judah to rely on the Lord for deliverance from the armies of Pekah and Rezin.'
  - where: 'note 16:10 “An altar from Damascus”'
    claim: 'Probably an altar to a false god that Ahaz admired; he had a copy made and set aside the great altar'
    key: ot-manual-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-12?lang=eng'
    quote: 'Evidently, while in Damascus, Ahaz saw an altar, probably to a false god, that caught his admiration. He had a duplicate made in Jerusalem and set aside the great altar in the temple to use the new one in its place'
  - where: 'note 16:10 “An altar from Damascus”'
    claim: 'An older reading: Ahaz meant it as an altar of Jehovah, but God had prescribed the form of His sanctuary, so a heathen-model altar was practically idolatrous'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/16.htm'
    quote: 'In the opinion of Ahaz, the altar which had been built after the model of that of Damascus was not to be an idolatrous altar, but an altar of Jehovah. … God Himself had prescribed the form for His sanctuary (cf. Exodus 25:40'
  - where: 'note 16:10 “An altar from Damascus”'
    claim: 'An altar of human design on a heathen model was practically the same as an idolatrous altar'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/16.htm'
    quote: 'so that any altar planned by man and built according to a heathen model was practically the same as an idolatrous altar.'
  - where: 'note 16:10 “An altar from Damascus”'
    claim: 'Chronicles says Ahaz sacrificed to the gods of Damascus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/28?lang=eng'
    quote: 'For he sacrificed unto the gods of Damascus, which smote him: and he said, Because the gods of the kings of Syria help them, therefore will I sacrifice to them'
  - where: 'note 16:10 “An altar from Damascus”'
    claim: 'Ahaz made unauthorized changes to the furnishings and ordinances of the temple'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'He made unauthorized changes to the furnishings and ordinances of the temple'
  - where: 'note 16:10 “An altar from Damascus”'
    claim: 'Urijah the priest is the one of Isaiah 8:2'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/16.htm'
    quote: 'he sent a picture and model of it "according to all the workmanship thereof," i.e., its style of architecture, to Urijah the priest (see Isaiah 8:2)'
  - where: 'note 16:15 “For me to inquire by”'
    claim: 'The verb in verse 15 is baqqēr (Piel of bāqar)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'לְ/בַקֵּֽר'
  - where: 'note 16:15 “For me to inquire by”'
    claim: 'The verb means seek, contemplate, consider, reflect (Prov. 20:25), and perhaps “consider” at 2 Kgs. 16:15'
    key: bdb
    url: 'https://biblehub.com/hebrew/1239.htm'
    quote: 'consider, reflect, absolute Proverbs 20:25 אַחַר נְדָרִים i.e. whether the vows were wise, or should be kept (compare Str on the passage & references); compare perhaps 2 Kings 16:15 consider (what shall be done with the old altar)'
  - where: 'note 16:15 “For me to inquire by”'
    claim: 'BDB also allows that the phrase denotes some religious service performed by the king himself'
    key: bdb
    url: 'https://biblehub.com/hebrew/1239.htm'
    quote: 'perhaps denoting some religious service to be performed by king himself'
  - where: 'note 16:15 “For me to inquire by”'
    claim: 'The Greek reads “in the morning”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_kings/16.htm'
    quote: 'and the brazen altar shall be for me in the morning.'
  - where: 'note 16:18 “For the king of Assyria”'
    claim: 'Ten lavers on wheeled bases, used for washing the animals for sacrifice'
    key: bd-laver
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/laver?lang=eng'
    quote: 'In Solomon’s temple, besides the molten sea, there were 10 lavers on wheels, with bases (1 Kgs. 7:27–39), used for washing the animals that were to be sacrificed (2 Chr. 4:6).'
  - where: 'note 16:18 “For the king of Assyria”'
    claim: 'The covert for the sabbath: a word found nowhere else, a colonnade for the king''s Sabbath approach'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/16.htm'
    quote: 'The noun, which occurs nowhere else, signifies some colonnade along which the king could pass when on the sabbath he went to the temple.'
  - where: 'note 16:18 “For the king of Assyria”'
    claim: '“For the king of Assyria” is literally “from the face of,” used with fleeing, seeking help, fearing'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/16.htm'
    quote: 'The preposition=literally ‘from the face of’ is a form constantly employed after verbs of fleeing (Genesis 16:8), of seeking help (Isaiah 19:20) and so of fearing, humbling oneself, trembling, &c. This is its sense here.'
  - where: 'note 16:18 “For the king of Assyria”'
    claim: 'One older reading: Ahaz removed the bronze so the Assyrian would not see it and ask for it'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/16.htm'
    quote: 'we may suppose that Tiglath-pileser was disposed to ask for the beautiful things which he saw, and as it was not in Ahaz’s power to say him nay, the king removed these treasures that the Assyrian monarch might not see and ask for them.'
  - where: 'note 16:18 “For the king of Assyria”'
    claim: 'Another reading: the reason is not given, a link to Assyria cannot be proved; if any, fear and concealment, not a gift'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/16.htm'
    quote: 'If the alterations which Ahaz made in the stands and the brazen sea had any close connection with his relation to Tiglath-pileser, which cannot be proved, Ahaz must have been impelled by fear to make them, not that he might send them as presents to him, but that he might hide them from him'
  - where: 'note 16:18 “For the king of Assyria”'
    claim: 'The reason for the mutilation of the vessels is not given'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/16.htm'
    quote: 'The reason why, or the object with which Ahaz mutilated these sacred vessels, is not given.'
  - where: christ
    claim: 'Matthew reads the sign as fulfilled in Jesus, “God with us”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/1?lang=eng'
    quote: 'Behold, a virgin shall be with child, and shall bring forth a son, and they shall call his name Emmanuel, which being interpreted is, God with us.'
  - where: christ
    claim: 'Ahaz chose Assyria over the Lord''s deliverance offered through Isaiah'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'However, Ahaz disregarded Isaiah’s counsel and asked the king of Assyria for protection.'
  - where: explore
    claim: 'Tiglath-pileser''s capture of Damascus fulfilled Amos 1:3–5'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/16.htm'
    quote: 'Tiglath-pileser then marched against Damascus, took the city, slew Rezin, and led the inhabitants away to Kir, as Amos had prophesied (Amos 1:3-5).'
  - where: explore
    claim: 'Chronicles says Ahaz was not buried in the sepulchres of the kings'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/28?lang=eng'
    quote: 'they buried him in the city, even in Jerusalem: but they brought him not into the sepulchres of the kings of Israel'
