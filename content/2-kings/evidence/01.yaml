chapter: 1
claims:
  - where: setting
    claim: 'The Bible Dictionary names the revolt of Moab and the joint maritime expedition with Jehoshaphat as the chief events of Ahaziah''s reign, and points to the Moabite Stone'
    key: bd-ahaziah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ahaziah?lang=eng'
    quote: 'King of Israel; the chief events of his reign were his joint maritime expedition with Jehoshaphat (2 Chr. 20:35–37) and the revolt of Moab (see Moabite Stone) (2 Kgs. 1:2; 3:4–5'
  - where: setting
    claim: 'Ahaziah reigned two years and served Baal as his father and mother had'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/22?lang=eng'
    quote: 'For he served Baal, and worshipped him, and provoked to anger the LORD God of Israel, according to all that his father had done.'

  - where: 'note 1:2 “Baal-zebub, the god of Ekron”'
    claim: 'Baal-zebub means Baal (lord) of the fly, a deity of the Ekronites'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/1176.htm'
    quote: 'From Ba''al and zbuwb; Baal of (the) Fly; Baal-Zebub, a special deity of the Ekronites'
  - where: 'note 1:2 “Baal-zebub, the god of Ekron”'
    claim: 'The Septuagint renders the name “Baal fly, the god of Accaron”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_kings/1.htm'
    quote: 'Go and enquire of Baal fly, the god of Accaron, whether I shall recover of this my sickness.'
  - where: 'note 1:2 “Baal-zebub, the god of Ekron”'
    claim: 'Ekron was the northernmost of the Philistine towns'
    key: bd-ekron
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ekron?lang=eng'
    quote: 'The most northerly of the Philistine towns, nine miles from the sea, at first allotted to Judah (Josh. 15:45–46), then to Dan (19:43).'
  - where: 'note 1:2 “Baal-zebub, the god of Ekron”'
    claim: 'Beelzebub, the Philistine god''s name, became a title for Satan; the Pharisees used it of Jesus'' power and He denied it'
    key: bd-beelzebub
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/beelzebub?lang=eng'
    quote: 'Name of a Philistine god. Used as a title for the “chief of the demons,” or Satan. The Pharisees referred to him as the “prince of the devils” (Matt. 12:24). Jesus denied that He cast out devils by the power of Beelzebub'

  - where: 'note 1:8 “A hairy man”'
    claim: '“A hairy man” refers to a rough garment, probably of goat''s or camel''s hair, perhaps an animal''s skin (Heb. 11:37)'
    key: ot-manual-5
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-5?lang=eng'
    quote: 'The statement that Elijah “was a hairy man” refers to the fact that the prophet was dressed in a rough garment, probably made of either goat’s or camel’s hair. Perhaps he actually wore an animal’s skin with the hair still on it (see Hebrews 11:37).'
  - where: 'note 1:8 “A hairy man”'
    claim: 'Baʿal śēʿār (“owner of hair”) is listed under baʿal as a noun of relation, the same idiom as baʿal ha-ḥălōmôt, “dreamer” (Gen. 37:19)'
    key: bdb
    url: 'https://biblehub.com/bdb/1167.htm'
    quote: 'dreamer Genesis 37:19 (E); ׳ב דברים whosoever hath cases, complaints Exodus 24:14 (E); שׂער ׳ב an hairy man 2 Kings 1:8'

  - where: 'note 1:10 “Why the fire fell on the captains”'
    claim: 'The king meant to arrest and punish Elijah'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/1.htm'
    quote: 'Clearly Ahaziah’s design was to arrest and punish Elijah'
  - where: 'note 1:10 “Why the fire fell on the captains”'
    claim: 'The first two captains used the title “man of God” in mockery'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/1.htm'
    quote: 'But in the two first addresses the title was given no doubt in mockery. In the mouth of one who really felt the force of the words there could have followed them no such sentence as ‘the king hath said, Come down’.'
  - where: 'note 1:10 “Why the fire fell on the captains”'
    claim: 'The third captain gives no command but kneels as a suppliant'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/1.htm'
    quote: 'He utters no command, but as a suppliant recognises the power of which Elijah was the representative.'
  - where: 'note 1:10 “Why the fire fell on the captains”'
    claim: 'Since the third captain also obeyed the king and lived, the first two were guilty of something more: the summons “come down,” a contempt of the prophet''s office and of the Lord'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/1.htm'
    quote: 'The first two must therefore have been guilty of some crime, which they and their people had to expiate with their death. … but in their saying "Man of God, come down." This summons to the prophet, to allow himself to be led as a prisoner before the king, involved a contempt not only of the prophetic office'
  - where: 'note 1:10 “Why the fire fell on the captains”'
    claim: 'Another older reading: Elijah calls on God to show that His servants and message may not be lightly despised'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/1.htm'
    quote: 'in the spirit of the Law he calls on God to make manifest that His servants and His message may not lightly be despised'
  - where: 'note 1:10 “Why the fire fell on the captains”'
    claim: 'The punishment came from the Lord, not the prophet'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/1.htm'
    quote: 'This sin was punished, and that not by the prophet, but by the Lord Himself, who fulfilled the word of His servant.'
  - where: 'note 1:10 “Why the fire fell on the captains”'
    claim: 'The Student Manual (relaying Clarke): only God could send the fire; Elijah''s words were declarative, not a curse'
    key: ot-manual-5
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-5?lang=eng'
    quote: 'God alone could send the fire; and as he is just and good, he would not have destroyed these men had there not been a sufficient cause to justify the act.'
  - where: 'note 1:10 “Why the fire fell on the captains”'
    claim: 'The Student Manual (relaying Clarke): “if I be a man of God” means “as surely as I am”'
    key: ot-manual-5
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-5?lang=eng'
    quote: 'If I be a man of God, i. e., as surely as I am a man of God, fire shall come down from heaven, and shall consume thee and thy fifty. This is the literal meaning of the original; and by it we see that Elijah’s words were only declarative, and not imprecatory.'

  - where: 'note 1:16 “Is it because there is no God in Israel?”'
    claim: 'The Septuagint gives the question with a single negative'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_kings/1.htm'
    quote: 'Is it because there is no God in Israel, that ye go to enquire of Baal fly, the God of Accaron? but it shall not be so.'
  - where: 'note 1:16 “Is it because there is no God in Israel?”'
    claim: 'The question is asked three times in the chapter (verses 3, 6, 16)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/1?lang=eng'
    quote: 'Forasmuch as thou hast sent messengers to inquire of Baal-zebub the god of Ekron, is it not because there is no God in Israel to inquire of his word?'

  - where: 'note 1:17 “Two kings named Jehoram”'
    claim: 'Jehoram son of Ahab began to reign in the eighteenth year of Jehoshaphat (a second dating beside 1:17)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/3?lang=eng'
    quote: 'Now Jehoram the son of Ahab began to reign over Israel in Samaria the eighteenth year of Jehoshaphat king of Judah, and reigned twelve years.'
  - where: 'note 1:17 “Two kings named Jehoram”'
    claim: 'Jehoram of Judah married Ahab''s daughter; Ahaziah son of Jehoram reigned in Judah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/8?lang=eng'
    quote: 'And he walked in the way of the kings of Israel, as did the house of Ahab: for the daughter of Ahab was his wife'

  - where: christ
    claim: 'One older reading: Jesus did not blame Elijah but admonished disciples who wanted to imitate him; the act belongs to the old covenant, not the gospel'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/1.htm'
    quote: 'But this act cannot be transferred to the times of the new covenant, as is clearly shown in Luke 9:54-55, where Christ does not blame Elijah for what he did, but admonishes His disciples'
  - where: christ
    claim: 'The spirit of the Law differs from that of the Gospel; the Lord forbade the disciples to imitate Elijah'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/1.htm'
    quote: 'The spirit of the Law differs from that of the Gospel, and our Lord forbad (Luke 9:55) his disciples the wish to imitate Elijah.'
  - where: christ
    claim: 'Luke 9:54–56: James and John and the fire'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/9?lang=eng'
    quote: 'For the Son of man is not come to destroy men’s lives, but to save them. And they went to another village.'
