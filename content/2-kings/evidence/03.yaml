chapter: 3
claims:
  - where: 'when'
    claim: 'The text dates the chapter by Jehoram''s accession in the eighteenth year of Jehoshaphat'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/3?lang=eng'
    quote: 'Now Jehoram the son of Ahab began to reign over Israel in Samaria the eighteenth year of Jehoshaphat king of Judah, and reigned twelve years.'

  - where: 'setting'
    claim: 'Moab had paid tribute to Israel since David, yearly, in the figures of verse 4; Mesha rebelled at Ahab''s death thinking Israel weakening'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'The Moabites had paid tribute to Israel since the days of King David. They gave a hundred thousand lambs and the same number of rams to the king of Israel each year … With the death of Ahab, King Mesha of Moab thought Israel was weakening, so he rebelled'

  - where: 'setting'
    claim: 'Jehoram''s brother Ahaziah died without a son; Moab rebelled after Ahab''s death (2 Kgs. 1)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/1?lang=eng'
    quote: 'Then Moab rebelled against Israel after the death of Ahab.'

  - where: 'setting'
    claim: 'Jehoram is called Joram; Ahaziah son of Ahab reigned before him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/8?lang=eng'
    quote: 'And in the fifth year of Joram the son of Ahab king of Israel'

  - where: 'thread'
    claim: 'The prophet''s word of verse 19 is carried out in verse 25'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/3.htm'
    quote: 'The Israelites followed the fugitives into their own land and laid it waste, as Elisha had prophesied (2 Kings 3:25 compared with 2 Kings 3:19).'

  - where: 'thread'
    claim: 'The allies left without renewing Moab''s subjugation'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/3.htm'
    quote: 'so that they gave up the further prosecution of the siege and the conquest of the city, without having attained the object of the expedition, namely, to renew the subjugation of Moab under the power of Israel.'

  - where: 'note 3:2 “The pillar of Baal”'
    claim: 'The word is maṣṣēbâ, a stone or stele erected for worship, usually condemned from Deuteronomy through 2 Kings and rendered “image” in the KJV at 2 Kgs. 3:2'
    key: sc-knowhy-870
    url: 'https://scripturecentral.org/knowhy/why-does-isaiah-say-there-will-be-a-pillar-in-egypt'
    quote: 'the Hebrew word matzevah, and it is used 34 times in the Hebrew Bible to denote some kind of stone or stele that humans have erected for devotional purposes … often viewed negatively in Deuteronomy through Second Kings (typically translated as “image” in the KJV as in 2 Kings 3:2). They are generally paired with foreign altars that the righteous Israelites must destroy or as objects that wicked kings erect'

  - where: 'note 3:2 “The pillar of Baal”'
    claim: 'Ahab built Baal a house and altar in Samaria; Jehu burned the images of the house of Baal'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/16?lang=eng'
    quote: 'And he reared up an altar for Baal in the house of Baal, which he had built in Samaria.'

  - where: 'note 3:7 “Why Judah and Edom marched with Israel”'
    claim: 'Jehoshaphat''s reasons: friendship with Ahab''s house, Moab''s attack on Judah; Edomite soldiers in servitude to Judah; the least likely direction'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'Jehoshaphat, king of Judah, had maintained friendly relations with Ahab … and wanted to maintain them with Jehoram … Judah had also been attacked by Moab … By marching through Edom, Judah and Israel could increase their army with Edomite soldiers, who were in servitude to Judah. They could also surprise Moab by attacking from the geographically most difficult, and therefore the least likely, direction.'

  - where: 'note 3:7 “Why Judah and Edom marched with Israel”'
    claim: 'The king of Edom was likely Jehoshaphat''s client king, as Mesha had been'
    key: ot-minute-2-kings-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-3'
    quote: 'First Kings 22:47 says, “There was then no king in Edom: a deputy was king.” The king of Edom was likely Jehoshaphat’s client king, similar perhaps to the role Mesha held before he rebelled against Jehoram.'

  - where: 'note 3:7 “Why Judah and Edom marched with Israel”'
    claim: 'The pledge is six words with the same prefix “as,” alternating suffixes, perhaps a treaty formula'
    key: ot-minute-2-kings-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-3'
    quote: 'Jehoshaphat’s pledge is six words in Hebrew, each starting with the same prefix. This prefix is a k sound meaning “as.” Then each word alternates between your and my suffixes. … may have been a kind of poetic response for treaties in ancient Israel.'

  - where: 'note 3:7 “Why Judah and Edom marched with Israel”'
    claim: 'Edom had no king but a deputy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/22?lang=eng'
    quote: 'There was then no king in Edom: a deputy was king.'

  - where: 'note 3:11 “The man who poured water on Elijah''s hands”'
    claim: 'Pouring water on the hands was a servant''s task after meals; the phrase marks Elisha as Elijah''s servant and disciple'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'In the East a servant pours water over the hands of his master after each meal so he can clean them. The expression merely indicates that Elisha was the servant and disciple of Elijah'

  - where: 'note 3:11 “The man who poured water on Elijah''s hands”'
    claim: 'The verse implies a physical side to Elisha''s ministering, if only ritual handwashing'
    key: ot-minute-2-kings-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-3'
    quote: 'this passage seems to imply there was a physical aspect to Elisha’s duties to Elijah, even if it was just for ritual handwashing.'

  - where: 'note 3:11 “The man who poured water on Elijah''s hands”'
    claim: 'Elisha went after Elijah and ministered to him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/19?lang=eng'
    quote: 'Then he arose, and went after Elijah, and ministered unto him.'

  - where: 'note 3:15 “Why Elisha called for a minstrel”'
    claim: 'Elisha was irritated by Jehoram; the minstrel was called to soothe him, and he then agreed to seek the Lord''s direction'
    key: scripture-helps-2-kings-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/26-2-kings-2-7?lang=eng'
    quote: 'Elisha was irritated by the presence of Jehoram, whom he thought of as an idolatrous king. … A minstrel, or harpist, was then called to soothe Elisha, and he eventually agreed to seek the Lord’s direction for the kings.'

  - where: 'note 3:15 “Why Elisha called for a minstrel”'
    claim: 'The music put Elisha in a state of mind to receive the word; compare its effect on Saul, soothed by David and prophesying when the Spirit came'
    key: ot-minute-2-kings-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-3'
    quote: 'The music seems to have put Elisha into a state of mind in which he could channel the word of the Lord. This is reminiscent of how music affected Saul in 1 Samuel both when David played for him to soothe his rage and when the Spirit of the Lord came upon him and he could prophesy.'

  - where: 'note 3:15 “Why Elisha called for a minstrel”'
    claim: 'David''s playing relieved Saul of the evil spirit'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/16?lang=eng'
    quote: 'David took an harp, and played with his hand: so Saul was refreshed, and was well, and the evil spirit departed from him.'

  - where: 'note 3:22 “Water that looked like blood”'
    claim: 'The valley is a wadi; “full of ditches” can be read as digging or as pools forming'
    key: ot-minute-2-kings-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-3'
    quote: 'The valley is a Middle East wadi, or seasonal stream. Most of the year they are dry … Depending on how the words are read, either the Lord commanded the soldiers to dig ditches that were later filled with water, or the Lord commanded that pools of water would exist in the wadi.'

  - where: 'note 3:22 “Water that looked like blood”'
    claim: 'An older reading: the water came by natural means as the LORD had predicted through His prophet'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/3.htm'
    quote: 'The divine help consisted, therefore, not in a miracle which surpassed the laws of nature, but simply in the fact that the Lord God, as He had predicted through His prophet, caused the forces of nature ordained by Him to work in the predetermined manner.'

  - where: 'note 3:22 “Water that looked like blood”'
    claim: 'The red color from the reddish earth of the trenches and the rising sun; Moab knew the wadi was dry and had not seen the rain in the mountains of Edom'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/3.htm'
    quote: 'From the reddish earth of the freshly dug trenches the water collected in them had acquired a reddish colour, which was considerably intensified by the rays of the rising sun … they had neither seen nor heard anything of the rain which had fallen at a great distance off in the Edomitish mountains.'

  - where: 'note 3:22 “Water that looked like blood”'
    claim: 'Moab assumed the allies had slain one another, knowing the jealousy of Israel and Judah and Edom''s forced alliance'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/3.htm'
    quote: 'that their enemies had massacred one another, more especially as the jealousy between Israel and Judah was not unknown to them, and they could have no doubt that Edom had only come with them as a forced ally.'

  - where: 'note 3:22 “Water that looked like blood”'
    claim: 'Perhaps the red rocks reflected in the pools; Moab assumed the armies had fought each other'
    key: ot-minute-2-kings-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-3'
    quote: 'For some reason, perhaps because of the red rocks’ reflection in the pools, the Moabites saw these pools of water as pools of blood and incorrectly assumed that the alliance … did not work out and that the three assembled armies ended up fighting with each other.'

  - where: 'note 3:27 “The son on the wall, and wrath against Israel”'
    claim: 'Chemosh was often offered human sacrifice to appease his anger; Israel lifted the siege perhaps thinking Moab finished, a mistake (2 Kgs. 13:20)'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'Chemosh, god of the Moabites, was frequently offered human sacrifice to appease his anger'

  - where: 'note 3:27 “The son on the wall, and wrath against Israel”'
    claim: 'Israel lifted the siege perhaps feeling Moab''s power had ended, which was a mistake (2 Kgs. 13:20)'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'With the death of the heir, Israel lifted their siege and departed, perhaps feeling that Moab’s power as a nation had ended. This feeling, however, was a mistake'

  - where: 'note 3:27 “The son on the wall, and wrath against Israel”'
    claim: 'In desperation Mesha tried to win the favor of Chemosh by the sacrifice'
    key: ot-minute-2-kings-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-3'
    quote: 'in desperation attempted to win favor with Chemosh, the god of Moab, by sacrificing his eldest son on the walls of the city'

  - where: 'note 3:27 “The son on the wall, and wrath against Israel”'
    claim: 'Offered on the wall in sight of the besiegers, to Chemosh, not to the God of Israel; human sacrifice forbidden by the Law (Lev. 18:21)'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/3.htm'
    quote: 'offered him as a sacrifice upon the wall, i.e., in the sight of the besiegers, not to the God of Israel (Joseph. Ephr. Syr., etc.), but to his own god Camos … by occasioning human sacrifice, which is strictly forbidden in the law (Leviticus 18:21; Leviticus 20:3)'

  - where: 'note 3:27 “The son on the wall, and wrath against Israel”'
    claim: 'An older reading: the phrase is used of divine wrath everywhere else; the abomination brought God''s judgment on Israel, felt in conscience or sign'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/3.htm'
    quote: 'is used of the divine wrath or judgment, which a man brings upon himself by sinning, in every other case in which the phrase occurs … The besiegers, that is to say, felt the wrath of God … either inwardly in their conscience or in some outwardly visible signs'

  - where: 'note 3:27 “The son on the wall, and wrath against Israel”'
    claim: 'Another older reading: the word is nearly always God''s wrath, but Israel could not be blamed; better the wrath of men, the allies grieved at the result'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/3.htm'
    quote: 'The word rendered ‘wrath’ or ‘indignation’ is nearly always used of the wrath of God against offenders. But it appears difficult to take it in that sense here. God’s promise through Elisha was that Israel should conquer'

  - where: 'note 3:27 “The son on the wall, and wrath against Israel”'
    claim: 'Israel could neither foresee nor prevent the sacrifice; the allies were horrified at having shared in such a war'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/3.htm'
    quote: 'They were in no position to know what the king intended, nor, when they saw him on the wall, to prevent his sacrifice. It seems better therefore to take ‘wrath’ in this place to signify ‘wrath of men’. … the allies were grieved at having shared in so disastrous a warfare.'

  - where: 'note 3:27 “The son on the wall, and wrath against Israel”'
    claim: 'qeṣep means wrath'
    key: bdb
    url: 'https://biblehub.com/hebrew/7110.htm'
    quote: 'I. קֶ֫צֶף noun masculine2Kings 3:27 wrath'

  - where: 'note 3:27 “The son on the wall, and wrath against Israel”'
    claim: 'Elisha''s prophecy of devastation was carried out; Moab was not brought back under Israel'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/3.htm'
    quote: 'without having attained the object of the expedition, namely, to renew the subjugation of Moab under the power of Israel.'

  - where: 'note 3:27 “The son on the wall, and wrath against Israel”'
    claim: 'The stele: basalt, from Diban, 34 lines in Moabite, close to Hebrew, carved shortly after 842 for a sanctuary to Chemosh, telling Mesha''s recovery of Moabite territory from Israel; in the Louvre'
    key: louvre-mesha-stele
    url: 'https://collections.louvre.fr/en/ark:/53355/cl010120339'
    quote: '34 lignes en caractère de type phénicien et en dialecte très proche de l''hébreu. Gravé peu après 842 à l''occasion de l''érection d''un sanctuaire au dieu Kamosch. Elle relate la reprise, sur Israël, de nombreux territoires moabites par le roi Mesha'

  - where: 'note 3:27 “The son on the wall, and wrath against Israel”'
    claim: 'The stele is basalt, found at Diban'
    key: louvre-mesha-stele
    url: 'https://collections.louvre.fr/en/ark:/53355/cl010120339'
    quote: 'Matériau : basalte'

  - where: 'note 3:27 “The son on the wall, and wrath against Israel”'
    claim: 'The stele explains Israel''s subjugation of Moab as Chemosh''s anger; one of the oldest mentions of biblical people outside the Bible'
    key: ot-minute-2-kings-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-3'
    quote: 'describing Mesha’s reign and the Israelite subjugation of Moab because the Moabite god Chemosh was angry with his people. The Moabite Stone is one of the oldest mentions of biblical people outside of the Bible.'

  - where: 'note 3:27 “The son on the wall, and wrath against Israel”'
    claim: 'The Law forbids giving children to Molech'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/18?lang=eng'
    quote: 'And thou shalt not let any of thy seed pass through the fire to Molech'

  - where: 'christ'
    claim: 'Elisha''s record has few of his words about Christ, but his ministry and miracles testify of Him'
    key: cfm-ot-2026-28
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/28?lang=eng'
    quote: 'So while we don’t have Elisha’s words about Christ, we do have Elisha’s ministry and miracles, which do testify of Christ. They are powerful manifestations of the Lord’s life-giving, nourishing, and healing power.'

  - where: 'christ'
    claim: 'The Lord inspired Elisha to prophesy things that seemed unlikely; the principle that the Lord fulfills words given through prophets'
    key: cfm-ot-2026-28
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/28?lang=eng'
    quote: 'The Lord inspired Elisha to prophesy of things to come—usually, things that seemed unlikely to occur.'
