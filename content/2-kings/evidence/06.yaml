chapter: 6
claims:
  - where: setting
    claim: 'The king of Israel in these stories is likely Jehoram, though the chapter does not name him; Jehoram called Elisha father'
    key: ot-minute-2-kings-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-6'
    quote: 'Essentially the king of Israel (who was likely Jehoram, but we are not told) placed a price on the head of Elisha'
  - where: setting
    claim: 'Jehoram son of Ahab reigned over Israel in Samaria'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/3?lang=eng'
    quote: 'Now Jehoram the son of Ahab began to reign over Israel in Samaria the eighteenth year of Jehoshaphat king of Judah, and reigned twelve years.'
  - where: setting
    claim: 'Dothan lies midway between the Jordan and the Mediterranean, named elsewhere only at Gen. 37:17; the Elisha stories are separate and likely out of chronological order'
    key: ot-minute-2-kings-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-6'
    quote: 'Dothan is midway between the Jordan River and the coast of the Mediterranean. … Most of these passages here and in the previous chapter are separate miracles that are more than likely out of chronological order since they don’t connect to each other'
  - where: setting
    claim: 'The Syrian leaders knew Elisha from Naaman''s healing'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'The Syrian leaders were well acquainted with the prophet Elisha, for they knew of Naaman’s miraculous healing. They also remembered Elisha’s leading a contingent of the Syrian army into captivity single-handedly and then releasing them'

  - where: thread
    claim: 'The question in verse 33, given to the messenger, is more likely the king''s'
    key: ot-minute-2-kings-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-6'
    quote: 'The question attributed to the messenger in verse 33 seems more likely to have come from the king.'
  - where: thread
    claim: 'The famine prices of 6:25 are to be compared with Elisha''s prophecy in 7:1'
    key: ot-minute-2-kings-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-6'
    quote: 'Compare the prices to Elisha’s prophecy of food prices in 2 Kings 7:1.'

  - where: 'note 6:5 “Why a borrowed axe head”'
    claim: 'Axe heads could fly off; that it was borrowed shows the poverty of the sons of the prophets; iron tools may have been rare'
    key: ot-minute-2-kings-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-6'
    quote: 'That the axe in this story was borrowed shows the poverty of the sons of the prophets. But additionally, as we are told in 1 Samuel 13:19, the Philistines had restricted the people’s access to smiths. … iron tools might still have been fairly rare.'
  - where: 'note 6:5 “Why a borrowed axe head”'
    claim: 'The miracle is like Elisha''s use of salt and grain'
    key: ot-minute-2-kings-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-6'
    quote: 'This miracle is similar to some of Elisha’s other miracles—for example, when he used salt to cure water and grain to cure poisoned food.'
  - where: 'note 6:5 “Why a borrowed axe head”'
    claim: 'The value of iron was not reason enough; the power helped a man honest enough to grieve because the axe was not his own'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'The scarcity of iron and its great value were not sufficient reason to perform such a miracle. “The prophet’s powers were exerted to help one who was honest enough to be the more concerned for his loss because the axe was not his own”'
  - where: 'note 6:5 “Why a borrowed axe head”'
    claim: 'Miracles such as the lost ax help with mortal difficulties and turn people to the Lord'
    key: cfm-ot-2026-28
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/28?lang=eng'
    quote: 'They can help us overcome the difficulties of mortality—like a barren land that needs pure water (see 2 Kings 2:19–22) or a lost ax that needs to be recovered (see 2 Kings 6:4–7). But most importantly, miracles can turn us to the Lord.'

  - where: 'note 6:16 “More with us than with them”'
    claim: 'Eyring applies the assurance to those who serve: some who are with them are invisible, and the Lord calls others to stand with them'
    key: eyring-embark-2008
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2008/10/o-ye-that-embark?lang=eng'
    quote: 'Like that servant of Elisha, there are more with you than those you can see opposed to you. Some who are with you will be invisible to your mortal eyes. The Lord will bear you up and will at times do it by calling others to stand with you.'
  - where: 'note 6:16 “More with us than with them”'
    claim: 'Eyring names quorums, bishops and companions as those called to stand with a servant'
    key: eyring-embark-2008
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2008/10/o-ye-that-embark?lang=eng'
    quote: 'That is why we have quorums. … And he will come to help you and call others to stand with you. It may be to call the right companion to serve with you in your time of need.'

  - where: 'note 6:17 “Horses and chariots of fire”'
    claim: 'The chariots and horses of fire recall Elijah''s ascension'
    key: ot-minute-2-kings-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-6'
    quote: 'He asked the Lord to open the eyes of the young man with him and then prayed to blind the eyes of the army of Syria. Note the chariots and horses of fire are reminiscent of Elijah’s ascension.'
  - where: 'note 6:17 “Horses and chariots of fire”'
    claim: 'Elisha''s miracles are manifestations of the Lord''s power, and seeing them takes the faith of Elisha''s prayer'
    key: cfm-ot-2026-28
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/28?lang=eng'
    quote: 'Miracles happen more often in our lives than we sometimes realize. To see them, we need to seek the faith Elisha had when he prayed on behalf of his fearful young servant'

  - where: 'note 6:22 “Why Elisha fed the Syrians”'
    claim: 'Jehoram, who elsewhere disrespected Elisha, here calls him father; Elisha led the army to Samaria rather than attack with the chariots of fire'
    key: ot-minute-2-kings-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-6'
    quote: 'Rather than attack the Syrian troops with the chariots of fire, Elisha led the army to Samaria, the capital city of Israel … King Jehoram, who in most other places disrespected Elisha, in this instance called him father.'
  - where: 'note 6:22 “Why Elisha fed the Syrians”'
    claim: 'The repeated question shows the king''s eagerness to destroy them, though he could not do it without the prophet''s consent'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/6.htm'
    quote: 'Jehoram could hardly undertake to smite the prisoners brought into his hands by the prophet without Elisha’s consent, though his repeated question ‘Shall I smite them? Shall I smite them?’ shews how eager he was to destroy them.'
  - where: 'note 6:22 “Why Elisha fed the Syrians”'
    claim: 'Elisha''s question means that even prisoners of battle were not slain; the purpose of the miracle was to show the Syrians they faced a prophet of the true God, and the advice served peace'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/6.htm'
    quote: 'since thou dost not even slay those whom thou hast made prisoners in open battle, how wouldst thou venture to put these to death?'
  - where: 'note 6:22 “Why Elisha fed the Syrians”'
    claim: 'The purpose of the miracle was to show the Syrians they had to do with a prophet of the true God; the advice was more likely to ensure peace'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/6.htm'
    quote: 'For the intention was to show the Syrians that they had to do with a prophet of the true God, against whom no human power could be of any avail, that they might learn to fear the almighty God. Even when regarded from a political point of view, the prophet''s advice was more likely to ensure peace'
  - where: 'note 6:22 “Why Elisha fed the Syrians”'
    claim: '“Bread and water” covers all kinds of food: feed them well and let them go'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/6.htm'
    quote: 'We can see from the use of the phrase ‘bread and water’ in other passages that the words embrace all kinds of food, and hence that Elisha’s injunction was equivalent to saying ‘Feed them well, and let them go’.'

  - where: 'note 6:24 “No more raids, then a siege”'
    claim: '“Bands” implies raiding parties; afterward no small groups came, and Ben-hadad invaded with all his host'
    key: ot-minute-2-kings-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-6'
    quote: 'The word “bands” might imply that only a raiding party came to kill Elisha, and after their experience no other small groups invaded. Thus when Ben-hadad decided to invade he did so with all his host.'
  - where: 'note 6:24 “No more raids, then a siege”'
    claim: 'Josephus explained that Ben-hadad gave up secret attempts out of fear of Elisha and made open war'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'so he determined to make no more secret attempts upon the king of Israel, out of fear of Elisha, but resolved to make open war with them, as supposing he could be too hard for his enemies by the multitude of his army and power.'
  - where: 'note 6:24 “No more raids, then a siege”'
    claim: 'Instead of taking Samaria by force, the king of Syria tried to starve it'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'Instead of trying to take Samaria by force, the king of Syria surrounded it and attempted to starve its inhabitants.'
  - where: 'note 6:24 “No more raids, then a siege”'
    claim: 'The Elisha stories are likely out of chronological order'
    key: ot-minute-2-kings-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-6'
    quote: 'Most of these passages here and in the previous chapter are separate miracles that are more than likely out of chronological order'

  - where: 'note 6:25 “Dove’s dung”'
    claim: 'Most scholars take the dove dung as fuel; famine and siege made everything costly'
    key: ot-minute-2-kings-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-6'
    quote: 'The idea expressed here is that the famine and siege combined to make everything in Samaria more expensive. Most scholars assume the donkey head would have been eaten and the dove dung (about 1.2 liters) would have been used for fuel.'
  - where: 'note 6:25 “Dove’s dung”'
    claim: 'The ass was unclean and its head the least edible part; eating bird dung shows the siege''s severity; a quarter cab is about a pint'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'The ass was an unclean animal (see Leviticus 11) and was not to be eaten by an Israelite. The head of an animal was also the most inedible part. To eat bird dung for what little nutritional value there was in it also graphically illustrates the severity of the siege. A cab of dove dung would be a little less than two quarts. A fourth part, then, would be about one pint.'
  - where: 'note 6:25 “Dove’s dung”'
    claim: 'The written text (ketiv) has one word and the read text (qere) dibyonim; BDB glosses it “dove''s dung (?)” and gives the Septuagint''s rendering'
    key: bdb
    url: 'https://biblehub.com/hebrew/1686.htm'
    quote: 'דִּבְיוֺנִים noun [masculine] so Qr; = דב יונים dove''s dung (?) 2 Kings 6:25 for Kt חרייונים; ᵐ5 Κόπρου περιστερῶν'
  - where: 'note 6:25 “Dove’s dung”'
    claim: 'The Westminster Leningrad Codex reads dibyonim in the margin (qere) for the written ḥărê-yônîm'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'דִּבְיוֹנִ֖ים'

  - where: 'note 6:30 “Sackcloth, and an oath against Elisha”'
    claim: 'The threshing floor and winepress are where grain and wine are produced; the king''s helplessness is like his answer to Naaman''s letter'
    key: ot-minute-2-kings-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-6'
    quote: 'The king’s helplessness is similar to his reaction to Naaman’s letter in 2 Kings 5:7. The word translated as “barnfloor” should be understood as a threshing floor, where wheat and other grains were beaten to separate them from the chaff.'
  - where: 'note 6:30 “Sackcloth, and an oath against Elisha”'
    claim: 'The sackcloth under his clothes speaks well of the king: he mourned without proclaiming it'
    key: ot-minute-2-kings-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-6'
    quote: 'That Jehoram was wearing sackcloth under his clothing is a great image and speaks well of his character. This is to show that he was in mourning but did not want to outwardly proclaim it.'
  - where: 'note 6:30 “Sackcloth, and an oath against Elisha”'
    claim: '“God do so and more also to me” is a standard biblical oath'
    key: ot-minute-2-kings-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-6'
    quote: '“God do so and more also to me” is a standard oath in various places in the Bible.'
  - where: 'note 6:30 “Sackcloth, and an oath against Elisha”'
    claim: 'The woman''s account fulfilled the curses of Lev. 26:29 and Deut. 28:53, 57; the sackcloth was more an outward work than repentance, as verse 31 shows'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/6.htm'
    quote: 'in which the curses of the law in Leviticus 26:29 and Deuteronomy 28:53, Deuteronomy 28:57 had been literally fulfilled, rent his clothes … though it was indeed more an opus operatum than a true bending of the heart before God and His judgment. This is proved by his conduct in 2 Kings 6:31.'
  - where: 'note 6:30 “Sackcloth, and an oath against Elisha”'
    claim: 'The king thought he had done his part with the sackcloth, and when help did not come he turned his rage on the prophet'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/6.htm'
    quote: 'The king thought that he had done his part by putting on the hairy garment; and as the anticipated help had nevertheless failed to come, he flew into a rage, for which the prophet was to pay the penalty.'
  - where: 'note 6:33 “The king or the messenger”'
    claim: 'The Hebrew reads “the messenger” in verse 33'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'מַּלְאָ֖ךְ'
  - where: 'note 6:33 “The king or the messenger”'
    claim: 'The verses are unclear; “king” (melek) and “messenger” (malak) are similar, and the question seems more likely the king''s'
    key: ot-minute-2-kings-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-6'
    quote: 'These verses are not very clear, and different translations interpret the events and speakers differently. … The words “king” and “messenger” are similar in Hebrew: “king” is melek, and “messenger” is “melak.” The question attributed to the messenger in verse 33 seems more likely to have come from the king.'
  - where: 'note 6:33 “The king or the messenger”'
    claim: 'The son of a murderer is Jehoram, son of Ahab and Jezebel; the murder likely Naboth''s'
    key: ot-minute-2-kings-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-6'
    quote: 'Elisha called Jehoram “son of a murderer.” Jehoram’s father was Ahab, and his mother was Jezebel. The murder referred to was likely that of Naboth (1 Kings 21).'
  - where: 'note 6:33 “The king or the messenger”'
    claim: 'Elisha answers with the word of the LORD promising food by the next day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/7?lang=eng'
    quote: 'Then Elisha said, Hear ye the word of the LORD; Thus saith the LORD, To morrow about this time shall a measure of fine flour be sold for a shekel'

  - where: christ
    claim: 'Elisha''s miracles testify of Christ, manifestations of the Lord''s life-giving, nourishing and healing power'
    key: cfm-ot-2026-28
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/28?lang=eng'
    quote: 'we do have Elisha’s ministry and miracles, which do testify of Christ. They are powerful manifestations of the Lord’s life-giving, nourishing, and healing power.'
  - where: christ
    claim: 'In the gospel of Jesus Christ there is help from both sides of the veil'
    key: holland-times-of-trouble-1980
    url: 'https://www.churchofjesuschrist.org/study/new-era/1980/10/for-times-of-trouble?lang=eng'
    quote: 'In the gospel of Jesus Christ you have help from both sides of the veil and you must never forget that.'

  - where: explore
    claim: 'The siege is lifted in chapter 7 by a noise of chariots and horses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/7?lang=eng'
    quote: 'For the Lord had made the host of the Syrians to hear a noise of chariots, and a noise of horses, even the noise of a great host'
  - where: 'note 6:33 “The king or the messenger”'
    claim: 'The king and his messenger both went to Elisha'
    key: ot-minute-2-kings-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-6'
    quote: 'the king and his messenger went to Elisha, who must have been in the city as it was under siege and no one would have been able to leave.'
