chapter: 24
claims:
  - where: when
    claim: 'Jerusalem is taken in the eighth year of the king of Babylon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'And Jehoiachin the king of Judah went out to the king of Babylon, he, and his mother, and his servants, and his princes, and his officers: and the king of Babylon took him in the eighth year of his reign.'
  - where: setting
    claim: 'Jehoiakim reigned 609–598 B.C. by the Bible Dictionary, originally named Eliakim'
    key: bd-jehoiakim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehoiakim?lang=eng'
    quote: 'King of Judah (609–598 B.C.), originally called Eliakim'
  - where: setting
    claim: 'Nebuchadnezzar II founded the Neo-Babylonian or Chaldean empire after Assyria fell and reigned 605–562 BC'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'After the fall of Assyria, King Nebuchadnezzar II established the Neo-Babylonian or Chaldean Empire in Babylonia. It was during his reign (605–562 BC) that the Kingdom of Judah was conquered'
  - where: setting
    claim: 'Nebuchadnezzar defeated Pharaoh-necho at Carchemish in Jehoiakim''s fourth year; Egypt had made Eliakim king and renamed him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/46?lang=eng'
    quote: 'Against Egypt, against the army of Pharaoh-necho king of Egypt, which was by the river Euphrates in Carchemish, which Nebuchadrezzar king of Babylon smote in the fourth year of Jehoiakim the son of Josiah king of Judah.'
  - where: setting
    claim: 'Ezekiel was among the exiles of the first capture'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'The Babylonians took many wealthy, educated, and skilled people back to Babylon as captives to disable Judah from being able to wage war. The prophet Ezekiel was among these exiles.'
  - where: setting
    claim: 'Babylonian cuneiform records corroborate the first capture'
    key: sc-knowhy-860
    url: 'https://scripturecentral.org/knowhy/why-do-extra-biblical-sources-matter'
    quote: 'The Babylonian Chronicles, various clay tablets written in ancient cuneiform and discovered in the late 1800s and early 1900s, provide extra-biblical corroboration of these events.'
  - where: setting
    claim: 'Lehi was called in the first year of Zedekiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/1?lang=eng'
    quote: 'For it came to pass in the commencement of the first year of the reign of Zedekiah, king of Judah, (my father, Lehi, having dwelt at Jerusalem in all his days)'
  - where: thread
    claim: 'Jehoiakim stopped paying tribute, which brought the Babylonian army'
    key: sc-knowhy-860
    url: 'https://scripturecentral.org/knowhy/why-do-extra-biblical-sources-matter'
    quote: 'According to 2 Kings 24, King Nebuchadnezzar’s Babylonian army attacked Jerusalem due to King Jehoiakim’s refusal to continue paying tribute to this superpower.'
  - where: thread
    claim: 'Jehoiakim did evil in the sight of the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng'
    quote: 'And he did that which was evil in the sight of the LORD, according to all that his fathers had done.'
  - where: thread
    claim: 'The Lord warned Lehi to flee before the city was destroyed and led his family out'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'The Lord warned Lehi to flee Jerusalem with his family before the city was destroyed. The Lord then led them to the promised land in the Western Hemisphere.'
  - where: section 1 plain
    claim: '“River of Egypt” renders naḥal, a torrent-valley or wadi'
    key: bdb
    url: 'https://biblehub.com/hebrew/5158.htm'
    quote: '2 Torrent-valley, wady, as stream-bed'
  - where: 'note 24:1 “A vassal who stopped paying”'
    claim: 'Jehoiakim refused to continue paying tribute to Babylon, and that brought the attack'
    key: sc-knowhy-860
    url: 'https://scripturecentral.org/knowhy/why-do-extra-biblical-sources-matter'
    quote: 'According to 2 Kings 24, King Nebuchadnezzar’s Babylonian army attacked Jerusalem due to King Jehoiakim’s refusal to continue paying tribute to this superpower.'
  - where: 'note 24:1 “A vassal who stopped paying”'
    claim: 'Jehoiakim died just as the siege began; his son was taken some months later'
    key: sc-knowhy-860
    url: 'https://scripturecentral.org/knowhy/why-do-extra-biblical-sources-matter'
    quote: 'Just as the siege began, Jehoiakim died and a few months later the Babylonians finished their complete capture of Jerusalem.'
  - where: 'note 24:1 “A vassal who stopped paying”'
    claim: 'Pharaoh-necho had made Eliakim king, renamed him, and put the land to tribute'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng'
    quote: 'And Pharaoh-nechoh made Eliakim the son of Josiah king in the room of Josiah his father, and turned his name to Jehoiakim'
  - where: 'note 24:2 “The word of the prophets coming due”'
    claim: 'The LORD spoke by His servants the prophets in Manasseh''s day of wiping Jerusalem as a dish'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/21?lang=eng'
    quote: 'And the LORD spake by his servants the prophets, saying, … I will wipe Jerusalem as a man wipeth a dish, wiping it, and turning it upside down.'
  - where: 'note 24:2 “The word of the prophets coming due”'
    claim: 'The Church''s footnote to verse 2 sets 1 Nephi 1:13 beside it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: '2d “word”: 2 Kgs. 21:14 (12–16); 23:27; 1 Ne. 1:13.'
  - where: 'note 24:2 “The word of the prophets coming due”'
    claim: 'The Church''s footnote to verse 13 sets Isaiah''s word to Hezekiah (2 Kgs. 20:17) beside “as the LORD had said”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: '13a “carried”: 2 Kgs. 20:17 (17–18).'
  - where: 'note 24:2 “The word of the prophets coming due”'
    claim: 'Lehi read that Jerusalem would be destroyed and many carried captive into Babylon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/1?lang=eng'
    quote: 'many things did my father read concerning Jerusalem—that it should be destroyed, and the inhabitants thereof; many should perish by the sword, and many should be carried away captive into Babylon.'
  - where: 'note 24:3 “For the sins of Manasseh”'
    claim: 'Jeremiah gives the same reason, and says not even Moses and Samuel could turn it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/15?lang=eng'
    quote: 'Though Moses and Samuel stood before me, yet my mind could not be toward this people … because of Manasseh the son of Hezekiah king of Judah, for that which he did in Jerusalem.'
  - where: 'note 24:3 “For the sins of Manasseh”'
    claim: 'Manasseh filled Jerusalem with innocent blood and seduced the people to do more evil than the nations'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/21?lang=eng'
    quote: 'Moreover Manasseh shed innocent blood very much, till he had filled Jerusalem from one end to another'
  - where: 'note 24:7 “Egypt out of the contest”'
    claim: 'One older reading: the notice shows Necho''s attitude and that resistance by Judah was not to be thought of'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/24.htm'
    quote: 'The purpose of this notice is to indicate, on the one hand, what attitude Necho, whose march to the Euphrates was previously mentioned, had assumed on the conquest of Judah by the Chaldaeans, and on the other hand, that under these circumstances a successful resistance to the Chaldaeans on the part of Judah was not for a moment to be thought of.'
  - where: 'note 24:7 “Egypt out of the contest”'
    claim: 'Naḥal means a torrent, or a torrent-valley, a wadi'
    key: bdb
    url: 'https://biblehub.com/hebrew/5158.htm'
    quote: 'I. נַ֫חַל noun masculine2Kings 3:16 torrent, torrent-valley, wady'
  - where: 'note 24:7 “Egypt out of the contest”'
    claim: 'Judah''s south border went out unto the river of Egypt; Carchemish in Jehoiakim''s fourth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/15?lang=eng'
    quote: 'From thence it passed toward Azmon, and went out unto the river of Egypt; and the goings out of that coast were at the sea: this shall be your south coast.'
  - where: 'note 24:12 “Babylon''s own record of the surrender”'
    claim: 'The Chronicle records the taking of the city and the capture of the king'
    key: sc-knowhy-860
    url: 'https://scripturecentral.org/knowhy/why-do-extra-biblical-sources-matter'
    quote: 'They record that the Babylonian king “camped against the city of Judah and on the second day of the month of Adar he took the city and captured the king.”'
  - where: 'note 24:12 “Babylon''s own record of the surrender”'
    claim: 'The Chronicle calls the loot tribute; the Bible says it was the temple''s vessels'
    key: sc-knowhy-860
    url: 'https://scripturecentral.org/knowhy/why-do-extra-biblical-sources-matter'
    quote: 'The Babylonian Chronicle does not note any religious significance of the loot taken from Jerusalem, simply remarking the king “took its heavy tribute and brought them to Babylon.”'
  - where: 'note 24:12 “Babylon''s own record of the surrender”'
    claim: 'The Chronicle says he appointed a king of his own choice, and dates it to 597 BC'
    key: sc-knowhy-860
    url: 'https://scripturecentral.org/knowhy/why-do-extra-biblical-sources-matter'
    quote: 'The Babylonian Chronicle also states that the king of Babylon “appointed a king of his own choice there.” … The Babylonian Chronicle gives the exact date all this transpired: March 16, 597 BC.'
  - where: 'note 24:12 “Babylon''s own record of the surrender”'
    claim: 'Kings dates the temple''s burning by Nebuchadnezzar''s years; Ezekiel dates by Jehoiachin''s captivity'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'And in the fifth month, on the seventh day of the month, which is the nineteenth year of king Nebuchadnezzar king of Babylon, came Nebuzar-adan'
  - where: 'note 24:12 “Babylon''s own record of the surrender”'
    claim: 'Ezekiel was among the exiles'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'The prophet Ezekiel was among these exiles.'
  - where: 'note 24:14 “Ten thousand, seven thousand, a thousand”'
    claim: 'One older reading: 10,000 is the sum, detailed in vv. 15–16; the mighty men are men of property, as in 15:20; smiths include weapon-makers; the poor were left because they possessed nothing'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/24.htm'
    quote: 'In 2 Kings 24:14 the number of those who were carried off is simply given in a general form, according to its sum-total, as 10,000; and then in 2 Kings 24:15, 2 Kings 24:16 the details are more minutely specified.'
  - where: 'note 24:14 “Ten thousand, seven thousand, a thousand”'
    claim: 'The mighty men were men of property, not warriors; locksmiths probably include makers of weapons'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/24.htm'
    quote: 'their number was 7000. The persons intended are not warriors, but men of property, as in 2 Kings 15:20. … including probably not actual locksmiths only, but makers of weapons also.'
  - where: 'note 24:14 “Ten thousand, seven thousand, a thousand”'
    claim: 'The poor were left because Nebuchadnezzar feared no rebellion from those who had nothing'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/24.htm'
    quote: 'the poor people of the land, i.e., the lower portion of the population of Jerusalem, from whom Nebuchadnezzar did not fear any rebellion, because they possessed nothing (Jeremiah 39:10)'
  - where: 'note 24:14 “Ten thousand, seven thousand, a thousand”'
    claim: 'Babylon took the wealthy, educated and skilled to disable Judah from waging war; Ezekiel among them'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'The Babylonians took many wealthy, educated, and skilled people back to Babylon as captives to disable Judah from being able to wage war. The prophet Ezekiel was among these exiles.'
  - where: 'note 24:14 “Ten thousand, seven thousand, a thousand”'
    claim: 'The King James renders the same class in 15:20 “mighty men of wealth”; Jeremiah lists the same exiles'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'And Menahem exacted the money of Israel, even of all the mighty men of wealth, of each man fifty shekels of silver'
  - where: 'note 24:17 “Mattaniah renamed”'
    claim: 'The names mean “gift of Yahweh” and “Yahweh is my justice/righteousness”; the name may imply Babylon''s actions were just; renaming showed Babylonian control'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'Nebuchadnezzar changed Mattaniah’s name (which means “gift of Yahweh”) to Zedekiah (meaning “Yahweh is my justice/righteousness”). This was perhaps Nebuchadnezzar’s way of implying that what he was doing to Jerusalem was just. Regardless, … renaming him demonstrated that the kingdom was under Babylonian control.'
  - where: 'note 24:17 “Mattaniah renamed”'
    claim: 'The Bible Dictionary gives the name''s meaning and points to Jer. 23:6 and 33:16'
    key: bd-zedekiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zedekiah?lang=eng'
    quote: 'The Lord (is) righteousness. The last king of Judah, his name changed from Mattaniah to Zedekiah (Jer. 23:6; 33:16).'
  - where: 'note 24:17 “Mattaniah renamed”'
    claim: 'The Church''s footnote to Zedekiah''s rebellion (verse 20) points to the oath in 2 Chr. 36:13 and Ezek. 17:15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: '20a “Zedekiah”: 2 Chr. 36:13; Jer. 52:3; Ezek. 17:15.'
  - where: 'note 24:17 “Mattaniah renamed”'
    claim: 'Nebuchadnezzar made Zedekiah swear by God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: 'And he also rebelled against king Nebuchadnezzar, who had made him swear by God: but he stiffened his neck, and hardened his heart from turning unto the Lord God of Israel.'
  - where: "note 24:17 “Lehi's Jerusalem and Zedekiah's first year”"
    claim: 'Lehi lived at Jerusalem in Zedekiah''s first year'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'Lehi, the first prophet of the Book of Mormon, lived at Jerusalem during the first year of Zedekiah’s reign.'
  - where: "note 24:17 “Lehi's Jerusalem and Zedekiah's first year”"
    claim: 'Zedekiah''s elevation in spring 597 BC is a scholarly consensus, checked in the Babylonian Chronicle'
    key: chadwick-lehi-departure
    url: 'https://byustudies.byu.edu/article/dating-the-departure-of-lehi-from-jerusalem'
    quote: 'can be cross-checked in the Babylonian Chronicle … It is a historical certainty, now accepted by a complete consensus of biblical and historical scholarship, that Zedekiah was elevated to the throne of Judah by the Babylonian monarch Nebuchadnezzar in the spring of the year 597 BC.'
  - where: "note 24:17 “Lehi's Jerusalem and Zedekiah's first year”"
    claim: 'The 600 BC notation in editions from 1920 to 2012 was a modern addition'
    key: chadwick-lehi-departure
    url: 'https://byustudies.byu.edu/article/dating-the-departure-of-lehi-from-jerusalem'
    quote: 'This is largely due to the presence of an asterisk in 1 Nephi 2:4, present in every official edition of the Book of Mormon from 1920 to 2012, which alerts readers to a “600 BC” chronological notation at the bottom of the page.'
  - where: "note 24:17 “Lehi's Jerusalem and Zedekiah's first year”"
    claim: 'Chadwick argues Lehi departed in late 605 BC'
    key: chadwick-lehi-departure
    url: 'https://byustudies.byu.edu/article/dating-the-departure-of-lehi-from-jerusalem'
    quote: 'In what may come as a surprise to many readers, I suggest that Lehi’s departure from Jerusalem occurred sometime in November 605 BC.'
  - where: "note 24:17 “Lehi's Jerusalem and Zedekiah's first year”"
    claim: 'Most readers, and Mormon''s heading to 3 Nephi, put the departure in Zedekiah''s first year'
    key: brown-jeremiah-imprisonment
    url: 'https://rsc.byu.edu/vol-2-no-1-2001/jeremiahs-imprisonment-date-lehis-departure'
    quote: 'most readers of the Book of Mormon have assumed that Lehi led his family into the wilderness in the opening year of the reign of Zedekiah. This view finds evident confirmation from no less an author than Mormon'
  - where: "note 24:17 “Lehi's Jerusalem and Zedekiah's first year”"
    claim: 'From 597 to a birth in 5–4 B.C. is only 592–593 years; the problem is unsolved'
    key: brown-jeremiah-imprisonment
    url: 'https://rsc.byu.edu/vol-2-no-1-2001/jeremiahs-imprisonment-date-lehis-departure'
    quote: 'most scholars argue for a date of 5–4 B.C. for the birth of the Savior. This dating allows for only 593 or 592 years between the beginning of the reign of Zedekiah and the birth of the Messiah. This discrepancy … remains an issue that has not been solved.'
  - where: "note 24:17 “Lehi's Jerusalem and Zedekiah's first year”"
    claim: 'Brown and Seely argue for a departure in the first year'
    key: brown-jeremiah-imprisonment
    url: 'https://rsc.byu.edu/vol-2-no-1-2001/jeremiahs-imprisonment-date-lehis-departure'
    quote: 'a considerable amount of evidence exists, regarding these passages and other passages as well, that has not been considered and that argues for Lehi and his family leaving Jerusalem in the first year rather than during a later year of Zedekiah’s reign.'
  - where: "note 24:17 “Lehi's Jerusalem and Zedekiah's first year”"
    claim: 'Some place the departure about 588–587 BC because of Jeremiah''s imprisonment; Chadwick''s 605 model rests on the people of the land counting Zedekiah as rightful king'
    key: sc-knowhy-475
    url: 'https://scripturecentral.org/knowhy/when-did-lehi-leave-jerusalem'
    quote: 'It wasn’t until toward the end of Zedekiah’s reign that Jeremiah was imprisoned, about 588–587 BC (Jeremiah 32–33; 37–38). Because of this, some Book of Mormon scholars think Lehi stayed in Jerusalem through most of Zedekiah’s reign and departed closer to 588–587 BC.'
  - where: "note 24:17 “Lehi's Jerusalem and Zedekiah's first year”"
    claim: 'The 605 model: the people of the land considered Zedekiah the rightful heir from 609, so his first year could be 608'
    key: sc-knowhy-475
    url: 'https://scripturecentral.org/knowhy/when-did-lehi-leave-jerusalem'
    quote: 'the “people of the land” did not recognize the Egyptian vassal as the legitimate king, but instead considered young Zedekiah as the rightful heir. If this is true, the first year of Zedekiah’s reign mentioned by Nephi could be 608 BC'
  - where: "note 24:17 “Lehi's Jerusalem and Zedekiah's first year”"
    claim: 'Mormon''s heading to 3 Nephi'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/1?lang=eng'
    quote: 'a descendant of Nephi who was the son of Lehi, who came out of Jerusalem in the first year of the reign of Zedekiah, the king of Judah.'
  - where: christ
    claim: 'Lehi testified of the coming of a Messiah and the redemption of the world; Nephi on the tender mercies'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/1?lang=eng'
    quote: 'the things which he saw and heard, and also the things which he read in the book, manifested plainly of the coming of a Messiah, and also the redemption of the world.'
  - where: christ
    claim: 'The Lord warned Lehi to flee and led his family out'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'The Lord warned Lehi to flee Jerusalem with his family before the city was destroyed.'
  - where: explore
    claim: 'KnoWhy 475 sets the proposed dates of Lehi''s departure side by side'
    key: sc-knowhy-475
    url: 'https://scripturecentral.org/knowhy/when-did-lehi-leave-jerusalem'
    quote: 'This leads many Book of Mormon scholars to conclude that Lehi left around 597–596 BC, within the first year of Zedekiah’s reign'
  - where: "note 24:17 “Lehi's Jerusalem and Zedekiah's first year”"
    claim: 'Lehi''s call came in the first year of Zedekiah, when many prophets warned Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/1?lang=eng'
    quote: 'For it came to pass in the commencement of the first year of the reign of Zedekiah, king of Judah, (my father, Lehi, having dwelt at Jerusalem in all his days); and in that same year there came many prophets, prophesying unto the people that they must repent'
  - where: "note 24:17 “Lehi's Jerusalem and Zedekiah's first year”"
    claim: 'Chadwick: Lehi prophesied from the first year of Zedekiah (608/7 BC) until he left late in 605 BC, some four years'
    key: chadwick-lehi-departure
    url: 'https://byustudies.byu.edu/article/dating-the-departure-of-lehi-from-jerusalem'
    quote: 'He likely prophesied from the suggested “first year of the reign of Zedekiah” (608/7 BC) until he left Jerusalem late in 605 BC, a ministry of some four years'
  - where: "note 24:17 “Lehi's Jerusalem and Zedekiah's first year”"
    claim: 'Chadwick: the people of the land regarded Zedekiah as heir after 609, and 608/7 was considered his first year'
    key: chadwick-lehi-departure
    url: 'https://byustudies.byu.edu/article/dating-the-departure-of-lehi-from-jerusalem'
    quote: 'regarded eight-year-old Zedekiah as the legitimate heir to the throne of Judah after his brother Jehoahaz was deposed in 609 BC and that 608/7 BC (utilizing Jeremiah’s method) was considered the first year of Zedekiah’s reign by such people at the time.'
