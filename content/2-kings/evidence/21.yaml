chapter: 21
claims:
  - where: setting
    claim: 'Manasseh reigned ca. 687–642 BC and reversed Hezekiah''s reform'
    key: satterfield-divine-justification
    url: 'https://scripturecentral.org/archive/books/book-chapter/divine-justification-babylonian-destruction-jerusalem'
    quote: 'However, Hezekiah’s son, Manasseh (ca. 687–642 BC), reversed his father’s reform policies (see 2 Kings 21; 2 Chronicles 33).'
  - where: setting
    claim: 'Assyria reached its peak under Manasseh; its empire ran from Babylonia to Asia Minor and took in Egypt'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'As previously mentioned, the prowess of Assyria peaked during the reign of Manasseh. They controlled the regions from Babylonia to Asia Minor, south through Israel and encompassed Egypt'
  - where: setting
    claim: 'Records of Esarhaddon and Ashurbanipal show Manasseh as Assyria''s vassal; Chronicles tells of his repentance, Kings does not'
    key: tolley-imprisonment
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/imprisonment-jeremiah-its-historical-context'
    quote: 'Records left behind by the Assyrian rulers Esarhaddon and Ashurbanipal both indicate that Manasseh was a vassal of Assyria … In contrast to the book of Kings, Chronicles describes King Manasseh as repenting before his death (2 Chronicles 33:11–13).'
  - where: setting
    claim: 'The book later gives Manasseh''s sins as the reason for Judah''s fall'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'Surely at the commandment of the Lord came this upon Judah, to remove them out of his sight, for the sins of Manasseh, according to all that he did;'
  - where: thread
    claim: 'Manasseh''s reversal of Hezekiah''s reform brought back Judah''s former sins'
    key: satterfield-divine-justification
    url: 'https://scripturecentral.org/archive/books/book-chapter/divine-justification-babylonian-destruction-jerusalem'
    quote: 'But with Manasseh’s reversal of his father’s religious reforms, Judah’s former sins returned.'
  - where: thread
    claim: 'Kings omits Manasseh''s conversion because it had no lasting effect on the kingdom or the people'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/21.htm'
    quote: 'This incident is omitted in our book, because the conversion of Manasseh was not followed by any lasting results so far as the kingdom was concerned; the abolition of outward idolatry in Jerusalem did not lead to the conversion of the people'

  - where: 'note 21:1 “A boy king, and Assyria''s vassal”'
    claim: 'Josephus places Manasseh''s birth in Hezekiah''s added fifteen years'
    key: sc-knowhy-648
    url: 'https://scripturecentral.org/knowhy/why-did-isaiah-prophesy-of-a-suffering-messiah'
    quote: 'According to Josephus, an ancient Jewish historian, it was during these final fifteen years that Hezekiah’s son Manasseh, who would become the next king, was born.'
  - where: 'note 21:1 “A boy king, and Assyria''s vassal”'
    claim: 'Chronologies differ by ten years on the start of the reign, possibly a coregency with Hezekiah'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Many chronologies mark the beginning of Manasseh’s reign in 697 BC while others employ the year 687 BC. This ten-year discrepancy may be due to a ten-year coregency with Hezekiah from 697–687 BC.'
  - where: 'note 21:1 “A boy king, and Assyria''s vassal”'
    claim: 'Manasseh had to submit to Assyria but could have kept Hezekiah''s reforms'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'During Manasseh’s reign (ca. 687–642 BC), Assyria reached her peak of power. Manasseh had no choice but to wholly submit to vassalage. Even so, he could have maintained Hezekiah’s religious reforms and reverential awe for Jehovah.'
  - where: 'note 21:1 “A boy king, and Assyria''s vassal”'
    claim: 'Assyrian records name Manasseh as a vassal'
    key: tolley-imprisonment
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/imprisonment-jeremiah-its-historical-context'
    quote: 'Records left behind by the Assyrian rulers Esarhaddon and Ashurbanipal both indicate that Manasseh was a vassal of Assyria'
  - where: 'note 21:1 “A boy king, and Assyria''s vassal”'
    claim: 'Hephzibah means “my delight is in her”; Isaiah applies the name to Jerusalem'
    key: bd-hephzibah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hephzibah?lang=eng'
    quote: 'My delight is in her. Mother of King Manasseh (2 Kgs. 21:1). Isaiah (62:4) applies the name to Jerusalem.'

  - where: 'note 21:3 “Undoing Hezekiah, copying Ahab”'
    claim: 'Manasseh reversed Hezekiah''s reform'
    key: satterfield-divine-justification
    url: 'https://scripturecentral.org/archive/books/book-chapter/divine-justification-babylonian-destruction-jerusalem'
    quote: 'However, Hezekiah’s son, Manasseh (ca. 687–642 BC), reversed his father’s reform policies (see 2 Kings 21; 2 Chronicles 33).'
  - where: 'note 21:3 “Undoing Hezekiah, copying Ahab”'
    claim: 'The grove is the Asherah, a tree or tree-like pole set up as an object of worship'
    key: bd-grove
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/grove?lang=eng'
    quote: 'In Hebrew, called Asherah (of which the plural is Asherim or Asheroth), either a living tree or a tree-like pole, set up as an object of worship'
  - where: 'note 21:3 “Undoing Hezekiah, copying Ahab”'
    claim: 'Assyria ruled Judah culturally; astrology and divination filled Esarhaddon''s court'
    key: ot-manual-19
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-19?lang=eng'
    quote: 'In Judah, Assyria ruled not only politically but also culturally. Her cults, gods, and fashions were introduced into the land by Manasseh. This was the golden age of astrology and divination in Assyria, and during the reign of Esarhaddon priests and astrologers filled the court'
  - where: 'note 21:3 “Undoing Hezekiah, copying Ahab”'
    claim: 'Manasseh added star worship to Baal and Asherah; it was done in the open air or on rooftops with small altars and incense'
    key: ot-manual-19
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-19?lang=eng'
    quote: 'In Judah the stars were worshiped, not by devotions to images, but by simple contemplation in the open air or on the rooftops. Small altars were constructed and incense burned as part of the devotional exercise.'
  - where: 'note 21:3 “Undoing Hezekiah, copying Ahab”'
    claim: 'The worship of Jehovah was merged with idolatry until barely distinguishable from paganism'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'The worship of Jehovah was merged so completely with idolatry that it was barely distinguishable from paganism. It was a spiritual crisis of enormous proportions.'

  - where: 'note 21:6 “Every forbidden way of reading the unseen”'
    claim: '“Observed times” is a verb for soothsaying of uncertain origin, also in Lev. 19:26'
    key: bdb
    url: 'https://biblehub.com/hebrew/6049.htm'
    quote: 'II. [עָנַן] verb Po`. practice soothsaying (probably denominative, but original meaning dubious … וְעוֺנֵן 2 Kings 21:6 2Chronicles 33:6; Imperfect2masculine plural וְלֹא תְעוֺנֵ֑נוּ Leviticus 19:26 (H)'
  - where: 'note 21:6 “Every forbidden way of reading the unseen”'
    claim: '“Used enchantments” is to practise divination, condemned here and forbidden in Deuteronomy and Leviticus'
    key: bdb
    url: 'https://biblehub.com/hebrew/5172.htm'
    quote: 'condemned by prophetic writer 2 Kings 21:6 2Chronicles 33:6 (+ עוֺנֵן וְעָשָׂח אוֺב וְיִדְּעֹנִים), 2 Kings 17:17 ("" וַיִּקְסְמוּ קְסָמִים); forbidden in D and H: Deuteronomy 18:10'
  - where: 'note 21:6 “Every forbidden way of reading the unseen”'
    claim: 'The “familiar spirit” of this verse is the necromancer'
    key: bdb
    url: 'https://biblehub.com/hebrew/178.htm'
    quote: '2 necromancer, in phrase אוֺב אוֺ יִדְּעֹנִי necromancer or wizard Leviticus 20:27 … וְיִדְּעֹנִי ׳א Deuteronomy 18:11; 2Chronicles 33:6 = 2 Kings 21:6'
  - where: 'note 21:6 “Every forbidden way of reading the unseen”'
    claim: 'The “wizard” is one who knows the secrets of the unseen world, always paired with the necromancer'
    key: bdb
    url: 'https://biblehub.com/hebrew/3049.htm'
    quote: 'familiar spirit (properly either as knowing, wise (acquainted with secrets of unseen world) … familiar spirit, always "" אוֺב, אֹבוֺת'

  - where: 'note 21:7 “The house where the LORD put His name”'
    claim: 'The LORD told Solomon that if Israel turned away He would cast the house hallowed for His name out of His sight'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/9?lang=eng'
    quote: 'Then will I cut off Israel out of the land which I have given them; and this house, which I have hallowed for my name, will I cast out of my sight'
  - where: 'note 21:7 “The house where the LORD put His name”'
    claim: 'The sentence on Judah returns to the words about the house of the name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng'
    quote: 'And the Lord said, I will remove Judah also out of my sight, as I have removed Israel, and will cast off this city Jerusalem which I have chosen, and the house of which I said, My name shall be there.'

  - where: 'note 21:10 “Prophets the chapter does not name”'
    claim: 'Chronicles says the LORD spoke to Manasseh and his people but they would not hearken'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/33?lang=eng'
    quote: 'And the Lord spake to Manasseh, and to his people: but they would not hearken.'
  - where: 'note 21:10 “Prophets the chapter does not name”'
    claim: 'The words of the seers who spoke to Manasseh were written in the book of the kings'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/33?lang=eng'
    quote: 'Now the rest of the acts of Manasseh, and his prayer unto his God, and the words of the seers that spake to him in the name of the Lord God of Israel, behold, they are written in the book of the kings of Israel.'
  - where: 'note 21:10 “Prophets the chapter does not name”'
    claim: 'The prophets'' names are not all known; they boldly prophesied the destruction'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'The Lord’s wrath was kindled, and He sent prophets to testify against this rapid spiritual devolution. While we do not have all of their names, these prophets boldly prophesied of imminent destruction'

  - where: 'note 21:11 “Why Manasseh bears the blame”'
    claim: 'Hezekiah''s people were in the LORD''s favor; Manasseh''s reversal brought back the former sins (D&C 82:7)'
    key: satterfield-divine-justification
    url: 'https://scripturecentral.org/archive/books/book-chapter/divine-justification-babylonian-destruction-jerusalem'
    quote: 'Hezekiah’s people found themselves in the Lord’s good graces after they had eradicated idolatry … But with Manasseh’s reversal of his father’s religious reforms, Judah’s former sins returned. … The Lord has said, “Go your ways and sin no more; but unto that soul who sinneth shall the former sins return” (D&C 82:7).'
  - where: 'note 21:11 “Why Manasseh bears the blame”'
    claim: 'Those who fall away after enlightenment become harder (Alma 24:30); Josiah''s reform was outward only'
    key: satterfield-divine-justification
    url: 'https://scripturecentral.org/archive/books/book-chapter/divine-justification-babylonian-destruction-jerusalem'
    quote: 'Consequently, Josiah’s reforms were not able to dislodge the sinful nature of the people of Judah. The reformation made by Josiah’s people was outward only; little inward transformation had taken place'
  - where: 'note 21:11 “Why Manasseh bears the blame”'
    claim: 'Read with Chronicles, Manasseh may have created conditions later people could not overcome'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'If read in light of Chronicles, it is possible that King Manasseh may have created conditions in society that future people were not able to overcome, leading to the people continuing to sin, and their eventual destruction.'
  - where: 'note 21:11 “Why Manasseh bears the blame”'
    claim: 'Kings names Manasseh as the cause of Judah''s fall in 24:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'Surely at the commandment of the Lord came this upon Judah, to remove them out of his sight, for the sins of Manasseh, according to all that he did;'
  - where: 'note 21:11 “Why Manasseh bears the blame”'
    claim: 'Josiah''s reform did not turn the LORD''s anger, because of Manasseh''s provocations (23:26)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng'
    quote: 'because of all the provocations that Manasseh had provoked him withal.'

  - where: 'note 21:13 “Measured like Samaria, wiped like a dish”'
    claim: 'Line and plummet were used for building and for leveling; the measure of Samaria means destruction like Samaria''s, the plummet of Ahab the extermination of his house'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/21.htm'
    quote: 'The measure (קו) and the plummet (משׁקלת, lit., a level) were applied to what was being built (Zechariah 1:16), and also to what was being made level with the ground, i.e., completely thrown down (Amos 7:7). … The meaning is: I shall destroy Jerusalem as I have destroyed Samaria'
  - where: 'note 21:13 “Measured like Samaria, wiped like a dish”'
    claim: 'The tingling ears denote a judgment never heard of before, as in 1 Sam. 3:11 and Jer. 19:3'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/21.htm'
    quote: 'The phrase, "that whosoever heareth it, both his ears may tingle," denotes such a judgment as has never been heard of before, and excites alarm and horror (cf. 1 Samuel 3:11 and Jeremiah 19:3).'
  - where: 'note 21:13 “Measured like Samaria, wiped like a dish”'
    claim: 'The wiped dish is a thing done with; “upside down” is literally on its face'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/21.htm'
    quote: 'The description is of a thing that is done with, and will be used no more. ‘To turn it upside down’, is literally ‘to turn it upon the face thereof’, a rendering which brings out very completely the intention of using the dish no more.'

  - where: 'note 21:16 “Innocent blood”'
    claim: 'The innocent may have been those who protested the idolatry'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Moreover Manasseh shed innocent blood very much [possibly those who protested his idolatrous policies], till he had filled Jerusalem from one end to another.'
  - where: 'note 21:16 “Innocent blood”'
    claim: 'Josephus says Manasseh slew the righteous and did not spare the prophets'
    key: ot-manual-19
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-19?lang=eng'
    quote: 'he barbarously slew all the righteous men that were among the Hebrews; nor would he spare the prophets, for he every day slew some of them, till Jerusalem was overflown with blood.'
  - where: 'note 21:16 “Innocent blood”'
    claim: 'The book counts the innocent blood as a sin the LORD would not pardon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'And also for the innocent blood that he shed: for he filled Jerusalem with innocent blood; which the Lord would not pardon.'
  - where: 'note 21:16 “Innocent blood”'
    claim: 'Rabbinic sources say Isaiah was sawn asunder under Manasseh; their reliability is in question; some cite Hebrews 11'
    key: parry-man-named-isaiah
    url: 'https://rsc.byu.edu/search-diligently-words-isaiah/man-named-isaiah'
    quote: 'Other ancient rabbinic sources claim that King Manasseh participated in the martyrdom of Isaiah, wherein Isaiah was sawn asunder in a tree. There are different versions of this account, and the reliability of these sources are in question.'
  - where: 'note 21:16 “Innocent blood”'
    claim: 'The full truth of Isaiah''s death may not be known'
    key: parry-man-named-isaiah
    url: 'https://rsc.byu.edu/search-diligently-words-isaiah/man-named-isaiah'
    quote: 'Some scholars cite Hebrews 11:36, which states that some ancient prophets “were stoned, they were sawn asunder, were tempted, were slain with the sword,” as support that Isaiah was sawn asunder. Unfortunately, we may not know the full truth concerning Isaiah’s death until we have better sources.'

  - where: 'note 21:17 “The repentance Kings leaves out”'
    claim: 'In affliction Manasseh humbled himself greatly before God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/33?lang=eng'
    quote: 'And when he was in affliction, he besought the Lord his God, and humbled himself greatly before the God of his fathers,'
  - where: 'note 21:17 “The repentance Kings leaves out”'
    claim: 'The LORD heard him and brought him back; Manasseh knew the LORD was God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/33?lang=eng'
    quote: 'And prayed unto him: and he was entreated of him, and heard his supplication, and brought him again to Jerusalem into his kingdom. Then Manasseh knew that the Lord he was God.'
  - where: 'note 21:17 “The repentance Kings leaves out”'
    claim: 'After his return he removed the idol and the altars and restored the LORD''s altar; Kings omits this because the conversion had no lasting effect on the people'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/21.htm'
    quote: 'removed the idol from the temple, abolished from the city the idolatrous altars erected in Jerusalem and upon the temple-mountain, restored the altar of Jehovah … This incident is omitted in our book, because the conversion of Manasseh was not followed by any lasting results so far as the kingdom was concerned'
  - where: 'note 21:17 “The repentance Kings leaves out”'
    claim: 'Chronicles says the Assyrian generals took Manasseh to Babylon in chains'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/21.htm'
    quote: 'Jehovah caused Manasseh the king to be taken prisoner by the generals of the king of Assyria and led away to Babylon in chains'
  - where: 'note 21:17 “The repentance Kings leaves out”'
    claim: 'Why Kings omits the captivity and repentance is not easy to understand'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/21.htm'
    quote: 'Why the writer of Kings tells neither of Manasseh’s captivity nor of his repentance and return is not easy to understand.'

  - where: 'note 21:24 “Amon''s murder and the boy king”'
    claim: 'Amon was assassinated by his servants at twenty-four, leaving eight-year-old Josiah; he was sixteen at Josiah''s birth'
    key: tolley-imprisonment
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/imprisonment-jeremiah-its-historical-context'
    quote: 'At the time of his death, Amon was only twenty-four years old (2 Kings 21:19; 2 Chronicles 33:21), leaving his eight-year-old son Josiah to rule (2 Kings 22:1; 2 Chronicles 34:1). This means that Amon was sixteen years old when his son was born.'
  - where: 'note 21:24 “Amon''s murder and the boy king”'
    claim: 'Little is known of the people of the land, but they held great influence; Josiah''s rule was a turning point'
    key: tolley-imprisonment
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/imprisonment-jeremiah-its-historical-context'
    quote: 'Little is known about this group, but it is clear that its members wielded a tremendous amount of influence upon the young king … Josiah’s rule would prove to be a turning point in the religious history of Judah'
  - where: 'note 21:24 “Amon''s murder and the boy king”'
    claim: 'The people of the land also installed Joash, Azariah and Jehoahaz'
    key: tolley-imprisonment
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/imprisonment-jeremiah-its-historical-context'
    quote: 'The people of the land also acted to install Joash following the assassination of Ahaziah (2 Kings 11:17–21), Azariah/Uzziah following the assassination of Amaziah (2 Kings 14:21), and Jehoahaz following the death of Josiah (2 Kings 23:30).'

  - where: christ
    claim: 'Manasseh humbled himself, prayed, and was heard'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/33?lang=eng'
    quote: 'And prayed unto him: and he was entreated of him, and heard his supplication, and brought him again to Jerusalem into his kingdom.'
  - where: christ
    claim: 'People sometimes suffer for ancestors'' decisions across generations'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'anyone who has witnessed the negative impact of people’s poor decisions across multiple generations knows that people sometimes suffer because of the sins of ancestors'
  - where: christ
    claim: 'Manasseh may have created conditions in Judah that those after him could not overcome'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'If read in light of Chronicles, it is possible that King Manasseh may have created conditions in society that future people were not able to overcome, leading to the people continuing to sin, and their eventual destruction.'
  - where: 'note 21:17 “The repentance Kings leaves out”'
    claim: 'Another reading: the repentance made no difference to the succession, so Kings omitted it'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/21.htm'
    quote: 'Perhaps as these events made no difference in the succession, and as he deals with the political rather than with the religious history of the nation, he preferred to omit any record'
  - where: 'note 21:17 “The repentance Kings leaves out”'
    claim: 'Amon restored the idols Manasseh had abolished'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/21.htm'
    quote: 'after the death of Manasseh even the idolatrous abominations that had been abolished were restored by Amon'
