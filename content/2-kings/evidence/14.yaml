chapter: 14
claims:
  # ---- when / setting / thread ----
  - where: when
    claim: 'Amaziah began in the second year of Joash of Israel and reigned 29 years; Jeroboam began in Amaziah''s fifteenth year and reigned 41'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/14?lang=eng'
    quote: 'In the second year of Joash son of Jehoahaz king of Israel reigned Amaziah the son of Joash king of Judah. … reigned twenty and nine years in Jerusalem'
  - where: setting
    claim: 'Chapter 13: Jehoash son of Jehoahaz reigns in Israel; Hazael oppresses Israel; Elisha dies'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/13?lang=eng'
    quote: 'began Jehoash the son of Jehoahaz to reign over Israel in Samaria … And Elisha died, and they buried him. … But Hazael king of Syria oppressed Israel all the days of Jehoahaz.'
  - where: setting
    claim: 'Judah had controlled Edom since David; Edom revolted under Joram; Amaziah made it subject again'
    key: ot-manual-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-12?lang=eng'
    quote: 'The kingdom of Judah had controlled Edom and exacted tribute from that kingdom since the days of King David. In the days of King Joram, however, Edom revolted (see 2 Kings 8:20).'
  - where: setting
    claim: 'Jeroboam II was of Jehu''s dynasty, the ablest and most successful in war of Israel''s kings; Amos and Hosea prophesied in his reign'
    key: bd-jeroboam
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeroboam?lang=eng'
    quote: 'Jeroboam Ⅱ, of the dynasty of Jehu, the ablest of the kings of Israel, and the most successful in war … Amos and Hosea prophesied during his reign'
  - where: setting
    claim: 'Eighth-century prosperity unknown since David and Solomon; Damascus recovering from Assyria, Assyria weakened; Israel and Judah recaptured territory and trade routes'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'With the eighth century BC came a period of wealth and prosperity to the kingdoms of Israel and Judah unknown since the monarchy of David and Solomon. Israel’s former enemy, Damascus, was recuperating from crushing blows by Assyrian King Adad-nirari'
  - where: setting
    claim: 'Assyria was weakened by internal struggles; Israel and Judah recovered lost territory'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Assyria, in turn, was weakened by internal struggles … Israel capitalized on the absence of a dominant foreign military force by recapturing territory and trade routes previously lost to Damascus'
  - where: thread
    claim: 'Amaziah spared the murderers'' children according to the law of Moses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/14?lang=eng'
    quote: 'But the children of the murderers he slew not: according unto that which is written in the book of the law of Moses'
  - where: thread
    claim: 'Jehoash: the victory over Edom lifted up Amaziah''s heart'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/14?lang=eng'
    quote: 'Thou hast indeed smitten Edom, and thine heart hath lifted thee up'
  - where: thread
    claim: 'Israel took its prosperity as a sign of God''s pleasure while sliding toward destruction'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'The people of Israel were convinced that material prosperity was an absolute sign of God’s pleasure resting upon them, yet the northern kingdom of Israel was sliding rapidly toward her destruct'
  - where: thread
    claim: 'The prophets of Jeroboam''s reign denounced idolatry and oppression'
    key: bd-jeroboam
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeroboam?lang=eng'
    quote: 'Amos and Hosea prophesied during his reign, and denounced the idolatry, licentiousness, and oppression that prevailed throughout the kingdom.'

  # ---- plain ----
  - where: thread
    claim: 'The LORD promised Jehu four generations on the throne'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/10?lang=eng'
    quote: 'thy children of the fourth generation shall sit on the throne of Israel'
  - where: section 2 plain
    claim: '“Look one another in the face” is an idiom for going to war'
    key: ot-manual-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-12?lang=eng'
    quote: 'To “look one another in the face” is a Hebrew idiom for going to war with one another.'
  - where: section 4 plain
    claim: '“Not any shut up, nor any left” means no one, great or small'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/14.htm'
    quote: 'The expression means that there was no one, great or small, young or old, to whom they could look for aid.'

  # ---- notes ----
  - where: 'note 14:3 “Right, but not like David”'
    claim: 'Amaziah did right, not like David, as Joash his father did; Chronicles: not with a perfect heart'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/25?lang=eng'
    quote: 'And he did that which was right in the sight of the Lord, but not with a perfect heart.'
  - where: 'note 14:3 “Right, but not like David”'
    claim: 'Joash did right while Jehoiada instructed him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/12?lang=eng'
    quote: 'all his days wherein Jehoiada the priest instructed him'

  - where: 'note 14:7 “Edom, and the rock called Joktheel”'
    claim: 'Edom lay south of the Dead Sea, outside Israel''s land; descended from Esau; kin to Israel yet constantly at war'
    key: bd-edom
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/edom?lang=eng'
    quote: 'This country lay south of the Dead Sea … It was not included within the limits of the land of Israel … In spite of the kinship there seems to have been great mutual hatred, and wars were of constant occurrence'
  - where: 'note 14:7 “Edom, and the rock called Joktheel”'
    claim: 'The Hebrew has the article: ha-selaʿ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'הַ/סֶּ֖לַע'
  - where: 'note 14:7 “Edom, and the rock called Joktheel”'
    claim: 'Sela is the same word as “rock”; the rock city of Edom'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/5554.htm'
    quote: 'The same as cela''; Sela, the rock-city of Idumaea -- rock, Sela(-h).'
  - where: 'note 14:7 “Edom, and the rock called Joktheel”'
    claim: 'Sela, a place in Edom taken in war and called Joktheel; site dubious; identification with Petra denied by some, held by others'
    key: bdb
    url: 'https://biblehub.com/hebrew/5554.htm'
    quote: 'proper name, of a location in Edom … captured in war 2 Kings 14:7 (and called יָקְתְאֵל) … site dubious; old identification with Petra denied, plausibly, by BuhlEdom … but held Benz2Kings 14:7'
  - where: 'note 14:7 “Edom, and the rock called Joktheel”'
    claim: 'Joktheel: name given to Sela by Amaziah; its meaning dubious'
    key: bdb
    url: 'https://biblehub.com/hebrew/3371.htm'
    quote: 'Imperfect from a √ קות, meaning dubious … 2 name given to סֶלַע (= Petra) by King Amaziah, its captor 2 Kings 14:7'

  - where: 'note 14:8 “A challenge to war”'
    claim: 'The idiom means going to war; Kings gives no reason; Chronicles: mercenaries hired, sent home on a prophet''s warning, angered'
    key: ot-manual-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-12?lang=eng'
    quote: 'To “look one another in the face” is a Hebrew idiom for going to war with one another. Although in the version here no explanation is given for why Amaziah asked for war, the parallel version in Chronicles explains what occurred'
  - where: 'note 14:8 “A challenge to war”'
    claim: 'The mercenaries ravaged Judah''s towns; Amaziah then declared war'
    key: ot-manual-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-12?lang=eng'
    quote: 'the mercenaries vented their anger by ravaging several of Judah’s towns on their return to the north. When Amaziah learned of their actions, he declared war on Israel.'
  - where: 'note 14:8 “A challenge to war”'
    claim: '100,000 hired for 100 talents; the man of God''s warning; sent home in anger; 3,000 killed and spoil taken'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/25?lang=eng'
    quote: 'He hired also an hundred thousand mighty men of valour out of Israel for an hundred talents of silver. … they returned home in great anger. … fell upon the cities of Judah … and smote three thousand of them, and took much spoil.'
  - where: 'note 14:8 “A challenge to war”'
    claim: 'Amaziah rashly rose up against Israel, and it was nearly fatal'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Following her victories, Judah, under the reign of King Amaziah, rashly rose up against Israel. This was nearly fatal'

  - where: 'note 14:9 “The thistle and the cedar”'
    claim: 'An apologue like Jotham''s, of marriage not war; the thistle trodden down while the cedar stands; contempt for Amaziah''s power'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/14.htm'
    quote: 'This he does by an apologue (cf. Jdg 9:8-15) in which he speaks not of war but of marriage. … The thistle … is trodden down by some passing beast and perishes unregarded, while the cedar stands unharmed. Words could hardly convey more strongly the low opinion'
  - where: 'note 14:9 “The thistle and the cedar”'
    claim: 'The fable pictures a proud man overrating his strength and the sudden overthrow that may come on him'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/14.htm'
    quote: 'the thorn-bush putting itself upon an equality with the cedar is a figurative representation of a proud man overrating his strength … the sudden overthrow and destruction which may come unexpectedly upon the proud man in the midst of his daring plans'
  - where: 'note 14:9 “The thistle and the cedar”'
    claim: 'Verse 10: high-minded; be content with the fame from Edom and stay home'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/14.htm'
    quote: 'thy heart has lifted thee up, equivalent to, thou hast become high-minded. הכּבד, "be honoured," i.e., be content with the fame thou hast acquired at Edom, "and stay at home."'
  - where: 'note 14:9 “The thistle and the cedar”'
    claim: 'The words of verse 10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/14?lang=eng'
    quote: 'Thou hast indeed smitten Edom, and thine heart hath lifted thee up: glory of this, and tarry at home'

  - where: 'note 14:9 “The thistle and the cedar”'
    claim: 'Amaziah and Judah the thistle, Joash and Israel the cedar; Amaziah evidently asked for a princess as part of a state apology; Joash would trample him'
    key: ot-manual-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-12?lang=eng'
    quote: 'In his parable, Amaziah and Judah are the thistle, a weed that dries up and blows away in the summer heat. Joash and Israel are the cedar … Amaziah evidently asked for a royal princess as part of an official state apology.'
  - where: 'note 14:11 “Why Amaziah would not hear”'
    claim: 'Amaziah set up Edom''s gods; the prophet''s rebuke; the king silenced him; God determined to destroy him; it came of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/25?lang=eng'
    quote: 'he brought the gods of the children of Seir, and set them up to be his gods, and bowed down himself before them … Art thou made of the king’s counsel? forbear … for it came of God, that he might deliver them into the hand of their enemies'

  - where: 'note 14:11 “Why Amaziah would not hear”'
    claim: 'The prophet''s question'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/25?lang=eng'
    quote: 'Why hast thou sought after the gods of the people, which could not deliver their own people out of thine hand?'

  - where: 'note 14:19 “Fifteen years, and a conspiracy”'
    claim: 'Amaziah was freed and allowed to regain his throne as a vassal of Israel; plots followed the embarrassments'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Amaziah was eventually freed and allowed to regain his throne but as a vassal of the king of Israel. On the heels of these embarrassments came plots to remove Amaziah from the throne.'
  - where: 'note 14:19 “Fifteen years, and a conspiracy”'
    claim: 'Chronicles: the conspiracy came after Amaziah turned from the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/25?lang=eng'
    quote: 'Now after the time that Amaziah did turn away from following the Lord they made a conspiracy against him in Jerusalem; and he fled to Lachish'
  - where: 'note 14:19 “Fifteen years, and a conspiracy”'
    claim: 'Lachish: between Hebron and the coast, in Judah, fortified by Rehoboam; Amaziah killed there'
    key: bd-lachish
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/lachish?lang=eng'
    quote: 'A city of the Amorites, between Hebron and the coast … afterwards included in Judah (15:39); fortified by Rehoboam (2 Chr. 11:9); here Amaziah was killed (2 Kgs. 14:19; 2 Chr. 25:27).'

  - where: 'note 14:21 “Azariah, also called Uzziah”'
    claim: 'Uzziah, called Azariah; builds Elath; defeats the Philistines; fortifies Jerusalem; leprosy; Isa. 6:1, Amos 1:1'
    key: bd-uzziah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/uzziah?lang=eng'
    quote: 'Called Azariah (2 Kgs. 14:21); king of Judah (2 Chr. 26:1); builds Elath … defeats the Philistines (26:6); fortifies Jerusalem (26:9); smitten with leprosy … earthquake in his reign (Isa. 6:1; Amos 1:1'
  - where: 'note 14:21 “Azariah, also called Uzziah”'
    claim: 'Isaiah''s vision dated to the year Uzziah died'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/6?lang=eng'
    quote: 'In the year that king Uzziah died I saw also the Lord sitting upon a throne'
  - where: 'note 14:21 “Azariah, also called Uzziah”'
    claim: 'Elath: a town of Edom on the Gulf of Aqaba, a naval station under the monarchy'
    key: bd-elath
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elath?lang=eng'
    quote: 'A town of Edom, on the Gulf of Aqabah, one of the “stations” of the Israelites in the wilderness (Deut. 2:8); a naval station during the monarchy (1 Kgs. 9:26; 2 Kgs. 8:20; 14:22; 16:6).'

  - where: 'note 14:21 “Azariah, also called Uzziah”'
    claim: 'Amos dates his prophecy to the days of Uzziah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/1?lang=eng'
    quote: 'in the days of Uzziah king of Judah'
  - where: 'note 14:25 “Jonah son of Amittai”'
    claim: 'Jonah of Gath-hepher in Zebulun lived under Jeroboam II and foretold the restored borders; the book tells an episode of his life'
    key: bd-jonah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jonah?lang=eng'
    quote: 'Of Gath-hepher in Zebulun. He lived under Jeroboam Ⅱ, whose success in restoring the ancient boundaries of Israel he predicted (2 Kgs. 14:25). The present book of Jonah … describes an episode in his life'
  - where: 'note 14:25 “Jonah son of Amittai”'
    claim: 'Gath-hepher a small village north of Nazareth; Jonah a court prophet with a local mission to Jeroboam''s court'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Jonah was a court prophet from Gath-hepher, a small village north of Nazareth in Galilee. He apparently had a local mission to the court of Jeroboam II in Samaria, as noted in 2 Kings 14:25, but the Lord had other plans for Jonah.'
  - where: 'note 14:25 “Jonah son of Amittai”'
    claim: 'The borders of the prophecy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/14?lang=eng'
    quote: 'He restored the coast of Israel from the entering of Hamath unto the sea of the plain, according to the word of the Lord God of Israel'

  - where: 'note 14:26 “None shut up, nor any left”'
    claim: 'The words are taken verbatim from Deut. 32:36: Israel brought to the extremity Moses foretold; the Lord had to interpose or His people would perish'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/14.htm'
    quote: 'verbatim from Deuteronomy 32:36, to show that the kingdom of Israel had been brought to the utmost extremity of distress predicted there by Moses, and it was necessary that the Lord should interpose with His help, if His people were not utterly to perish'
  - where: 'note 14:26 “None shut up, nor any left”'
    claim: 'The Lord had not yet uttered the decree of rejection; the help came from His compassion'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/14.htm'
    quote: 'The higher ground for this strengthening of Israel in the time of Jeroboam was to be found in the compassion of God. … He had not yet spoken, i.e., had not yet uttered the decree of rejection through the mouth of a prophet.'
  - where: 'note 14:26 “None shut up, nor any left”'
    claim: 'The phrase means no one, great or small; the affliction came from the Syrian inroads east of the Jordan and beyond'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/14.htm'
    quote: 'Occasioned by the inroads of the Syrians, who had not only conquered the lands on the east side, but also at one time some considerable portions on the west of the Jordan. … no one, great or small, young or old, to whom they could look for aid.'
  - where: 'note 14:26 “None shut up, nor any left”'
    claim: 'Israel''s doom was not yet fixed; a place of repentance left; Jeroboam was the saviour of 13:5'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/14.htm'
    quote: 'i.e. As yet the doom of Israel was not fixed. There was yet a place of repentance left. but he saved them] Jeroboam was the saviour spoken of in 2 Kings 13:5.'
  - where: 'note 14:26 “None shut up, nor any left”'
    claim: 'The Hebrew of 14:26 has ʿāṣûr and ʿāzûb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'וְ/אֶ֤פֶס עָצוּר֙ וְ/אֶ֣פֶס עָז֔וּב'
  - where: 'note 14:26 “None shut up, nor any left”'
    claim: 'The Hebrew of Deut. 32:36 has the same pair'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'עָצ֥וּר וְ/עָזֽוּב'
  - where: 'note 14:26 “None shut up, nor any left”'
    claim: 'Verses 26–27; 13:5, 13:23; 17:18'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/14?lang=eng'
    quote: 'And the Lord said not that he would blot out the name of Israel from under heaven: but he saved them by the hand of Jeroboam the son of Joash.'
  - where: 'note 14:26 “None shut up, nor any left”'
    claim: 'The LORD had compassion because of His covenant and would not cast them off as yet; He gave Israel a saviour'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/13?lang=eng'
    quote: 'And the Lord was gracious unto them, and had compassion on them, and had respect unto them, because of his covenant with Abraham, Isaac, and Jacob, and would not destroy them, neither cast he them from his presence as yet.'
  - where: 'note 14:28 “Damascus and Hamath, which belonged to Judah”'
    claim: 'David garrisoned Damascus; Toi of Hamath was his tributary; Hamath was Solomon''s, with store cities; hence a “recovery”'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/14.htm'
    quote: 'garrisons were placed in Damascus by David … Having been once in the possession of the Israelites, the reconquest by Jeroboam II. may be spoken of as a recovery. … Toi the king of Hamath was one of David’s tributaries … Solomon built ‘store cities’ in Hamath'
  - where: 'note 14:28 “Damascus and Hamath, which belonged to Judah”'
    claim: 'The two kingdoms'' holdings rivaled Solomon''s; a time of confidence, trade, wealth, and pride'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'From north to south the combined land holdings of Israel and Judah rivaled those held by Solomon two centuries earlier. It was a time of great confidence, open trade, and wealth. Unfortunately, this prosperity led Israel … to swell with pride'

  # ---- christ / explore ----
  - where: 'note 14:28 “Damascus and Hamath, which belonged to Judah”'
    claim: 'What had belonged to Judah under David and Solomon; the kingdoms, not the cities; the city of Hamath never belonged to Israel, Damascus had been David''s'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/14.htm'
    quote: 'By Damascus and Hamath we are not to understand the cities, but the kingdoms; for not only did the city of Hamath never belong to the kingdom of Israel, but it was situated outside the boundaries laid down by Moses for Israel'
  - where: 'note 14:28 “Damascus and Hamath, which belonged to Judah”'
    claim: 'Damascus David had conquered and Solomon had not permanently lost'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/14.htm'
    quote: 'It was different with the city of Damascus, which David had conquered and even Solomon had not permanently lost'
  - where: christ
    claim: 'Jesus gave the sign of the prophet Jonas, three days and nights'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/12?lang=eng'
    quote: 'there shall no sign be given to it, but the sign of the prophet Jonas: For as Jonas was three days and three nights in the whale’s belly; so shall the Son of man be three days and three nights in the heart of the earth.'
  - where: christ
    claim: 'The Jonah of 2 Kgs. 14:25 is the Jonah of the book'
    key: bd-jonah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jonah?lang=eng'
    quote: 'He lived under Jeroboam Ⅱ, whose success in restoring the ancient boundaries of Israel he predicted (2 Kgs. 14:25). The present book of Jonah … describes an episode in his life'
  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary (see Mosiah 3:8; 15:1; 3 Ne. 15:1–5; D&C 110:1–10).'
  - where: christ
    claim: 'The LORD saw the affliction of Israel, with no helper'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/14?lang=eng'
    quote: 'For the Lord saw the affliction of Israel, that it was very bitter: for there was not any shut up, nor any left, nor any helper for Israel.'
  - where: christ
    claim: 'The song of Moses: the LORD acts when His people''s power is gone'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/32?lang=eng'
    quote: 'For the Lord shall judge his people, and repent himself for his servants, when he seeth that their power is gone, and there is none shut up, or left.'
  - where: explore
    claim: 'Chronicles'' account has the hired soldiers, the gods of Edom and two prophets'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/25?lang=eng'
    quote: 'But there came a man of God to him, saying, O king, let not the army of Israel go with thee'
