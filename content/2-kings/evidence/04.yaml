chapter: 4
claims:
  - where: when
    claim: 'Jehoram son of Ahab reigned over Israel in the time of these chapters'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/3?lang=eng'
    quote: 'Now Jehoram the son of Ahab began to reign over Israel in Samaria the eighteenth year of Jehoshaphat king of Judah, and reigned twelve years.'
  - where: setting
    claim: 'Chapters 2–7 are a cluster of more than two dozen miracle stories with little of Elisha''s teaching; some echo Elijah''s, some prefigure Jesus'''
    key: barlow-miracles
    url: 'https://mi.byu.edu/old-testament-reflections/what-are-miracles-for'
    quote: 'it includes little of his teachings. Instead, the record of his days reads as a collection of miracle stories attributed to the prophet—more than two dozen such stories, in rapid sequence, in just chapters 2–7.'
  - where: setting
    claim: 'Elisha''s miracles were mostly for those connected with the companies of prophets, and the two prophets worked almost wholly in the northern kingdom'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/4.htm'
    quote: 'this multiplying of the widow’s oil was wrought for the help of those connected with the colleges of prophets. … Most of the places we read of as seats of prophetic schools were in the ten tribes, and nearly all the work of the two great leaders was done among the northern people.'
  - where: setting
    claim: 'The dearth may well be the famine of 8:1, and some incidents told before chapter 8 happened after it'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/4.htm'
    quote: 'The allusion will then be to the famine foretold in 2 Kings 8:1. That some of the incidents related before that chapter occurred after the famine, see note on 2 Kings 8:4.'
  - where: setting
    claim: 'Many of Elisha''s miracles match Elijah''s; the widow''s oil is like the miracle for the widow of Zarephath'
    key: ot-minute-2-kings-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-4'
    quote: 'Many of Elisha’s miracles match those of Elijah, and the one these verses recount is similar to Elijah’s miracle with the widow of Zarephath.'
  - where: setting
    claim: 'The Church''s manual compares the Shunammite''s son with Luke 7 and the hundred fed with John 6'
    key: cfm-ot-2026-28
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/28?lang=eng'
    quote: 'You might also compare the miracles Elisha performed with miracles that Jesus Christ performed (see 2 Kings 4:8–37 and Luke 7:11–16; 2 Kings 4:42–44 and John 6:1–13'
  - where: thread
    claim: 'In spite of the calf worship, there was real religious feeling in the north, shown in the prophetic companies'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/4.htm'
    quote: 'It would seem therefore that in spite of the prevalence of the calf-worship there must have been a special manifestation of true religious feeling, just at the worst time of Israel’s history.'
  - where: thread
    claim: 'The new moon and sabbath were occasions of worship held by the prophets in Israel; the prophets did the priesthood''s duties where priests could not'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/4.htm'
    quote: 'it is clear from this history that even in Israel, while the house of Ahab was still on the throne, religious services were regularly held by the prophets in the name of Jehovah. The prophets performed all the duties of the priesthood'
  - where: thread
    claim: 'The account shows the Lord caring for His servants, giving them what the law assigned to the priests'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/4.htm'
    quote: 'The object, therefore, in communicating this account is not to relate another miracle of Elisha, but to show how the Lord cared for His servants, and assigned to them that which had been appropriated in the law to the Levitical priests'
  - where: 'section 1 plain'
    claim: '"Stayed" means stopped'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/4?lang=eng'
    quote: '6a “stayed”: HEB stopped.'
  - where: 'section 4 plain'
    claim: '"Dearth" may be read famine'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/4?lang=eng'
    quote: '38b “dearth”: OR famine.'
  - where: "note 4:2 “A widow's oil, like Elijah's”"
    claim: 'Differences from Elijah''s widow: an Israelite, two sons, many vessels'
    key: ot-minute-2-kings-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-4'
    quote: 'This widow was an Israelite where Elijah’s widow was not; this widow had two sons where Elijah’s widow had one; and this widow had many vessels where Elijah’s widow had one.'
  - where: "note 4:2 “A widow's oil, like Elijah's”"
    claim: 'A debtor''s children could be made to work off a debt; the law limited it; the custom was still known in Jesus'' time'
    key: scripture-helps-2-kings-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/26-2-kings-2-7?lang=eng'
    quote: 'Anciently, when a person was unable to pay a debt, the labor of the debtor’s children could be used as payment for the debt. … The law of Moses required that Israelites in bondage be treated the same as hired workers and released every seven years.'
  - where: "note 4:2 “A widow's oil, like Elijah's”"
    claim: 'Elijah''s and Elisha''s widows'' miracles are a double witness of Christ''s nourishment for widowed Israel'
    key: read-elijah-elisha
    url: 'https://scripturecentral.org/archive/periodicals/magazine-article/elijah-and-elisha-foreshadowing-latter-day-work'
    quote: 'Further, like Elijah, Elisha provides this oil for a widow. Similar miracles with similar elements usually suggest that a witness is being made.'
  - where: 'note 4:8 “A great woman of Shunem”'
    claim: '"Great woman" probably means wealthy and influential, by her own standing; her husband barely appears'
    key: ot-minute-2-kings-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-4'
    quote: '“Great woman” in verse 8 probably means “wealthy and influential.” The woman’s greatness was probably the consequence of some quality or inheritance of her own and not of her husband since he is hardly mentioned throughout this narrative.'
  - where: 'note 4:8 “A great woman of Shunem”'
    claim: 'Shunem lay ten or fifteen miles east of Carmel, on Elisha''s way through Israel'
    key: ot-minute-2-kings-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-4'
    quote: 'Shunem is about ten or fifteen miles east of Mount Carmel (depending on where on the mountain Elisha lived). If Elisha was going anywhere in Israel, he likely would have passed right by Shunem.'
  - where: 'note 4:10 “A chamber on the wall”'
    claim: 'The chamber was an upper room kept for honored guests; "on the wall" probably for its window in the blank wall'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'The aliyah, ‘chamber,’ is an upper room of an Eastern house, being sometimes built on the roof … called a chamber ‘in the wall,’ probably because its window, opening to the street, made a break in the dead wall … kept as a room for the entertainment of honored guests.'
  - where: 'note 4:10 “A chamber on the wall”'
    claim: 'The dead boy was laid on the prophet''s bed'
    key: ot-minute-2-kings-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-4'
    quote: 'The dead boy was laid on the prophet’s bed, just as the child was in the story of Elijah and the widow of Zarephath.'
  - where: 'note 4:13 “I dwell among mine own people”'
    claim: 'An appeal to the king or the captain would be for hardship or oppression; living among kin, she had no foe to be protected from'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/4.htm'
    quote: 'If the king or the captain of the host were to be appealed to, it must be for some case of hardship and oppression. The Shunammite shews she has no necessity of this kind, for all those among whom she lives are friends and relatives.'
  - where: 'note 4:13 “I dwell among mine own people”'
    claim: 'The captain of the host could wield great influence (Joab, Abner)'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/4.htm'
    quote: 'If we may take Joab, in David’s time, as an example, this officer possessed immense influence.'
  - where: 'note 4:13 “I dwell among mine own people”'
    claim: 'She asked nothing when offered a reward; Elisha and Gehazi settled on a child'
    key: hilton-motherhood-ot
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/motherhood-old-testament'
    quote: 'She showed great care for the prophet Elisha, yet when he offered to reward her she asked for nothing. Elisha and his servant Gehazi determined that her reward should be to have a child, even though her husband was old'
  - where: "note 4:16 “Sarah's promise”"
    claim: 'The Hebrew of 4:16 has lammôʿēd … kāʿēt ḥayyâ … bēn'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'לַ/מּוֹעֵ֤ד הַ/זֶּה֙ כָּ/עֵ֣ת חַיָּ֔ה'
  - where: "note 4:16 “Sarah's promise”"
    claim: 'The Hebrew of Gen. 18:14 has the same words, lammôʿēd … kāʿēt ḥayyâ … bēn'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'לַ/מּוֹעֵ֞ד אָשׁ֥וּב אֵלֶ֛י/ךָ כָּ/עֵ֥ת חַיָּ֖ה וּ/לְ/שָׂרָ֥ה בֵֽן'
  - where: "note 4:16 “Sarah's promise”"
    claim: 'The Church''s footnote at "time" points to Gen. 18:14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/4?lang=eng'
    quote: '16a “time”: Gen. 18:14.'
  - where: "note 4:16 “Sarah's promise”"
    claim: 'The story matches Sarah''s; Sarah heard through the tent, as Elisha spoke first through Gehazi'
    key: ot-minute-2-kings-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-4'
    quote: 'The story of the Shunammite woman matches that of Sarah’s making food for the messengers of God while they met with Abraham. Sarah was separated from the men as they talked, but she could hear the conversation through the tent'
  - where: "note 4:16 “Sarah's promise”"
    claim: 'The Shunammite stands among the barren women of the Old Testament whose stories God answered, a pattern Luke takes up'
    key: sc-knowhy-705
    url: 'https://scripturecentral.org/knowhy/why-are-childless-women-prominent-in-the-christmas-story'
    quote: 'Although each of them was barren (Genesis 11:29–30; 18:11; 25:20–21; 29:28, 31; Judges 13:2; 1 Samuel 1:1–2; 2 Kings 4:14), God’s promises and covenants would be kept through divine and joyous means.'
  - where: "note 4:16 “Sarah's promise”"
    claim: 'Her answer is hope, not doubt: let your words come true'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'The woman’s response to Elisha’s promise of a child is not one of doubt but one of hope. In essence she was saying, “Let not your words be a lie,” or “Let your words come true.”'
  - where: 'note 4:23 “Neither new moon, nor sabbath”'
    claim: 'The new moon was a monthly occasion of sacrifice; perhaps Elisha could be found only on those days'
    key: ot-minute-2-kings-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-4'
    quote: 'The new moon was a monthly occasion for sacrifice (Numbers 28:11–15). … Either it wasn’t appropriate to visit with a prophet unless it was the new moon or the Sabbath, or the people knew Elisha’s whereabouts only on those days'
  - where: 'note 4:23 “Neither new moon, nor sabbath”'
    claim: 'The husband connected the visit with a religious duty; prophets might preside at the feasts, as Samuel at Ramah'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'The Shunammite’s husband did not connect his wife’s proposed visit to the prophet with the death of his child, but with some religious duty. The new moon (i.e. the first day of the month) and the sabbath were feasts at which the prophets might be asked to preside'
  - where: "note 4:29 “The prophet's staff”"
    claim: 'The charge not to greet anyone was meant so that the failure could not be blamed on an accident; the failure showed that miracles come through faith and prayer, not the staff'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/4.htm'
    quote: 'the prophet wished thereby to preclude at the very outset the possibility of attributing the failure of Gehazi''s attempt to awaken the child to any external or accidental circumstance'
  - where: "note 4:29 “The prophet's staff”"
    claim: 'The staff''s failure taught that the power was not magically in Elisha''s person or staff'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/4.htm'
    quote: 'a practical proof that the power to work miracles was not connected in any magical way with his person or his staff, but that miracles as works of divine omnipotence could only be wrought through faith and prayer'
  - where: "note 4:29 “The prophet's staff”"
    claim: '"Neither voice, nor hearing" is the phrase used of the dead idols at Carmel'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/4.htm'
    quote: 'This is the meaning of קשׁב ואין קול אין both here and 1 Kings 18:29, where it is used of dead idols.'
  - where: 'note 4:30 “I will not leave thee”'
    claim: 'Her words match Elisha''s threefold words to Elijah; she would not accept Gehazi as proxy'
    key: ot-minute-2-kings-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-4'
    quote: 'The Shunammite woman’s words match Elisha’s three-times-repeated statements to Elijah shortly before he was taken up to heaven. She would not accept Elisha’s proxy servant Gehazi'
  - where: 'note 4:30 “I will not leave thee”'
    claim: 'She told Gehazi all was well, perhaps saving her plea for Elisha'
    key: ot-minute-2-kings-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-4'
    quote: 'Gehazi asked the Shunammite woman if all was well with her, her husband, and her child, to which she answered with a lie. … perhaps she was saving her plea for Elisha’s ears.'
  - where: 'note 4:30 “I will not leave thee”'
    claim: 'She would trust no one but the prophet to heal her son'
    key: hilton-motherhood-ot
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/motherhood-old-testament'
    quote: 'She treasured this child, and when he suffered a serious ailment she exercised great faith in seeking Elisha to heal her son. She would not trust anyone but the prophet to heal him.'
  - where: 'note 4:34 “The flesh of the child waxed warm”'
    claim: 'Elisha''s actions resemble Elijah''s with the widow''s son'
    key: ot-minute-2-kings-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-4'
    quote: 'If the account is true to reality, the actions seem ritualistic and similar to Elijah’s actions with the son of the widow of Zarephath.'
  - where: 'note 4:34 “The flesh of the child waxed warm”'
    claim: 'Elijah and Elisha shared miracles (parted Jordan, food multiplied, children raised) that prefigured Jesus'' works'
    key: seely-messiah
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/jesus-messiah-prophet-priest-king'
    quote: 'Thus, Elijah and Elisha both parted the waters of the Jordan (see 2 Kings 2:8; 14), both multiplied food (see 1 Kings 17:14–16; 2 Kings 4:42–44), and both raised children from the dead (see 1 Kings 17:23; 2 Kings 4:34–37).'
  - where: 'note 4:34 “The flesh of the child waxed warm”'
    claim: 'These miracles prefigured a future prophet; Jesus would do the same'
    key: seely-messiah
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/jesus-messiah-prophet-priest-king'
    quote: 'miracles that would prefigure the coming of a future prophet. … Jesus, the Anointed One, would do the same miracles as He calmed the storm, fed the five thousand, and raised the dead.'
  - where: 'note 4:41 “Death in the pot”'
    claim: 'The gourds were probably Calotropis procera; a little causes severe diarrhea, much could kill'
    key: ot-minute-2-kings-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-4'
    quote: 'The wild gourds were probably the Calotropis procera, sometimes called the apple of Sodom. Consuming even a small amount results in severe diarrhea, and consuming a large amount could be fatal.'
  - where: 'note 4:41 “Death in the pot”'
    claim: 'As with the salt at Jericho, Elisha healed the food with meal'
    key: ot-minute-2-kings-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-4'
    quote: 'As he healed the water at Jericho with salt (2 Kings 2:21), Elisha healed the food from the poison with some ground wheat.'
  - where: 'note 4:42 “Firstfruits for the man of God”'
    claim: 'The law gave the firstfruits to the priests (Deut. 18:4–5; Num. 18:13); here they are given to the prophet''s companies'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/4.htm'
    quote: 'that which had been appropriated in the law to the Levitical priests, who were to receive, according to Deuteronomy 18:4-5, and Numbers 18:13, the first-fruits of corn, new wine, and oil.'
  - where: 'note 4:42 “Firstfruits for the man of God”'
    claim: 'The godly in Israel did not take Jeroboam''s worship as lawful and found a substitute in the schools of the prophets'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/4.htm'
    quote: 'the godly men in Israel did not regard the worship introduced by Jeroboam (his state-church) as legitimate worship, but sought and found in the schools of the prophets a substitute for the lawful worship of God'
  - where: 'note 4:42 “Firstfruits for the man of God”'
    claim: 'The gift was small enough for one man to carry in a sack'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/4.htm'
    quote: 'That twenty barley loaves and a portion of roasted grains of corn were not a sufficient quantity to satisfy a hundred men, is evident from the fact that one man was able to carry the whole of this gift in a sack'
  - where: 'note 4:42 “Firstfruits for the man of God”'
    claim: 'The firstfruits may have been brought as a religious duty to Elisha as God''s representative, with no place to take them'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/4.htm'
    quote: 'it may have been brought as a religious duty (cf. Leviticus 23:14) and presented to Elisha, as the representative of God, in this time when there was no place to which such offerings could be brought.'
  - where: 'note 4:44 “They shall eat, and shall leave thereof”'
    claim: 'The Church''s manual compares 4:42–44 with John 6:1–13 and 4:8–37 with Luke 7:11–16'
    key: cfm-ot-2026-28
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/28?lang=eng'
    quote: 'compare the miracles Elisha performed with miracles that Jesus Christ performed (see 2 Kings 4:8–37 and Luke 7:11–16; 2 Kings 4:42–44 and John 6:1–13'
  - where: 'note 4:44 “They shall eat, and shall leave thereof”'
    claim: 'Feeding a multitude with little food prefigures a miracle of Jesus'
    key: barlow-miracles
    url: 'https://mi.byu.edu/old-testament-reflections/what-are-miracles-for'
    quote: 'Others prefigure miracles later attributed to Jesus: feeding a multitude with little food (2 Kings 4:42–44), healing a leper (2 Kings 5:1–14), even raising a child from the dead (2 Kings 4:18–37).'
  - where: 'note 4:44 “They shall eat, and shall leave thereof”'
    claim: 'The footnote at "left" points to Matt. 14:20 and 15:37'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/4?lang=eng'
    quote: '44a “left”: Matt. 14:20 (19–21); 15:37 (36–38).'
  - where: christ
    claim: 'The Church compares the Shunammite''s son with the widow''s son at Nain'
    key: cfm-ot-2026-28
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/28?lang=eng'
    quote: 'see 2 Kings 4:8–37 and Luke 7:11–16'
  - where: christ
    claim: 'Those who receive the Lord''s servants receive Him; the Shunammite was blessed for her kindness'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'Those who receive the servants of the Lord also receive Him (see D&C 84:36). The Shunammite woman showed her love for God by her kindness to His chosen servant Elisha.'
  - where: christ
    claim: 'The principle drawn from the widow''s oil'
    key: ot-seminary-lesson-97
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-2-kings/lesson-97-2-kings-1-4?lang=eng'
    quote: 'When we turn to the Lord in faith, He can bless us according to our needs and righteous desires.'
  - where: explore
    claim: 'Barlow''s essay on what Elisha''s miracles are for'
    key: barlow-miracles
    url: 'https://mi.byu.edu/old-testament-reflections/what-are-miracles-for'
    quote: 'As a cluster, the miracles establish Elisha as empowered to see into the future, to curse or heal and resurrect, to control nature, and to determine the fate of armies, among other matters.'
