chapter: 12
claims:
  - where: setting
    claim: 'Jehoash escaped Athaliah through his aunt, was hidden in the temple six years, was made king by Jehoiada, and at seven would certainly have had Jehoiada''s counsel'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'Jehoash escaped through the intervention of his aunt … After hiding Jehoash in the temple for six years, Jehoiada the priest decided to make the child’s existence known and install him as Judah’s king. … he would certainly have received the counsel and guidance of Jehoiada'
  - where: setting
    claim: 'Two kings were named Jehoash; the king of Judah is also called Joash, and is not the Jehoash of Israel in chapter 13'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'The Jehoash mentioned here is not the same Jehoash who was king of Judah … There were two kings by the same name. … The other Jehoash, also called Joash, was the one hid by the priests in Judah'
  - where: setting
    claim: 'Jehoash was seven when he began to reign; Jehoiada made a covenant between the LORD, the king and the people; Hazael was cutting Israel short'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/11?lang=eng'
    quote: 'Jehoiada made a covenant between the LORD and the king and the people, that they should be the LORD’s people … Seven years old was Jehoash when he began to reign.'
  - where: setting
    claim: 'Kings records the reign''s character, the temple repair, the Syrians bought off and the murder; Chronicles adds Jehoiada''s death, the idolatry and Zechariah''s stoning, which fit easily into Kings'' account'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/12.htm'
    quote: 'The parallel account in 2 Chronicles 24 supplies several additions to this: viz., concerning the wives of Joash, the distribution of the Levites at the repairing of the temple, the death of Jehoiada, and the seduction of Joash to idolatry … all of which can easily be fitted into our account.'
  - where: thread
    claim: 'The high places were local altars; the reforming kings Hezekiah and Josiah ordered them removed'
    key: bd-high-places
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/high-places?lang=eng'
    quote: 'Such altars became local centers of the worship of Jehovah. … Religious reformers like Hezekiah and Josiah tried therefore to centralize the worship more and more in Jerusalem … and the high places were ordered to be removed'
  - where: thread
    claim: 'The house of God was broken up under Athaliah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/24?lang=eng'
    quote: 'For the sons of Athaliah, that wicked woman, had broken up the house of God'
  - where: thread
    claim: 'Chronicles gives the reason for the murder: Jehoiada died and the king killed his son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/24?lang=eng'
    quote: 'Thus Joash the king remembered not the kindness which Jehoiada his father had done to him, but slew his son.'
  - where: 'note 12:2 “As long as Jehoiada taught him”'
    claim: 'The Septuagint (Brenton) reads “all the days that Jodae the priest instructed him”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_kings/12.htm'
    quote: 'And Joas did that which was right in the sight of the Lord all the days that Jodae the priest instructed him.'
  - where: 'note 12:2 “As long as Jehoiada taught him”'
    claim: 'Chronicles: right all the days of Jehoiada; after his death the princes, idols, and Zechariah stoned at the king''s command'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/24?lang=eng'
    quote: 'And Joash did that which was right in the sight of the Lord all the days of Jehoiada the priest. … Then the king hearkened unto them. And they left the house of the Lord God of their fathers, and served groves and idols … stoned him with stones at the commandment of the king in the court of the house of the Lord.'
  - where: 'note 12:2 “As long as Jehoiada taught him”'
    claim: 'Jehoiada''s advice and support was the most important factor in the reign; Jehoash did not continue as he began'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'It appears that the single most important factor in Jehoash’s reign was the wise advice and support he received from the high priest, Jehoiada (see v. 2). During Jehoash’s administration the temple was repaired, but unfortunately, Jehoash did not continue as he had commenced.'
  - where: 'note 12:4 “Census money or current money”'
    claim: 'BDB lists kesep ʿōbēr in this verse with Gen. 23:16, current money of the merchant'
    key: bdb
    url: 'https://biblehub.com/hebrew/5674.htm'
    quote: 'e. pass along (from hand to hand), only participle שֶׁקֶל כֶּסֶף עֹבֵר לַסֹּחֵר Genesis 23:16 i.e. current money of the merchant … כֶּסֶף עֹבֵר 2 Kings 12:5.'
  - where: 'note 12:4 “Census money or current money”'
    claim: 'BDB: ʿērek (the word behind “every man is set at”) is elsewhere the priest''s valuation for vows and redemption-money (Lev. 27:2; Num. 18:16)'
    key: bdb
    url: 'https://biblehub.com/hebrew/6187.htm'
    quote: 'estimate, valuation, made by ordering, classifying … in 2 Kings 12:5 read עֵרֶךְ (for ᵑ0 עוֺנֵּר) money of a man''s valuation … of priest''s valuation of trespass-offering Leviticus 5:15,18; Leviticus 5:25, vows, and redemption-money Leviticus 27:2'
  - where: 'note 12:4 “Census money or current money”'
    claim: 'Ex. 30:13 and Gen. 23:16 in the King James; Chronicles calls the whole the collection Moses laid upon Israel; the footnote at 4a points to Ex. 30:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/24?lang=eng'
    quote: 'And they made a proclamation through Judah and Jerusalem, to bring in to the Lord the collection that Moses the servant of God laid upon Israel in the wilderness.'
  - where: 'note 12:4 “Census money or current money”'
    claim: 'Chronicles calls the collection Moses'' commandment; its footnote 6a (read with source.mjs --notes: “collection”: Ex. 30:16 (12–16)) sends it to the half shekel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/24?lang=eng'
    quote: 'the collection, according to the commandment of Moses the servant of the Lord, and of the congregation of Israel, for the tabernacle of witness?'
  - where: 'note 12:4 “Census money or current money”'
    claim: 'Gen. 23:16 renders the same phrase current money with the merchant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/23?lang=eng'
    quote: 'four hundred shekels of silver, current money with the merchant.'
  - where: 'note 12:9 “Why the repairs stalled, and what the chest changed”'
    claim: 'No answer to “Why repair ye not” is given in Kings or Chronicles; the priests may have had difficulty raising and dividing the money'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/12.htm'
    quote: 'No answer is given to this question either here or in 2 Chronicles. … The priests and Levites had perhaps found much difficulty in increasing the sums collected, and in apportioning what they received between their own maintenance and the restoration-fund. There seems to have been no blame attached to them by the king'
  - where: 'note 12:9 “Why the repairs stalled, and what the chest changed”'
    claim: 'Money given at home with no united action languished; the chest let givers see others giving and a sum kept in regular account'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/12.htm'
    quote: 'While the money had been given by individuals at their homes, and with no united action, the preparations had languished. The new arrangement put life into the work. The givers saw that others were giving as well as they, and found that a sum was being gathered of which regular account was kept'
  - where: 'note 12:9 “Why the repairs stalled, and what the chest changed”'
    claim: 'Chronicles: the Levites hastened it not; the people rejoiced and cast into the chest; vessels made from the rest when they had finished'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/24?lang=eng'
    quote: 'Howbeit the Levites hastened it not. … For the sons of Athaliah, that wicked woman, had broken up the house of God … And when they had finished it, they brought the rest of the money before the king and Jehoiada, whereof were made vessels for the house of the Lord'
  - where: 'note 12:9 “Why the repairs stalled, and what the chest changed”'
    claim: 'Josiah''s repair uses the same arrangement, with no reckoning because they dealt faithfully; Jehoash was seven at accession, so about thirty in his twenty-third year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/22?lang=eng'
    quote: 'Howbeit there was no reckoning made with them of the money that was delivered into their hand, because they dealt faithfully.'
  - where: 'note 12:9 “Why the repairs stalled, and what the chest changed”'
    claim: 'The Levites were slow in collecting and in devoting part of their revenues; the king acted less for their negligence than because the first measure did not answer its purpose'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/12.htm'
    quote: 'they were dilatory both in the collection of the money and in the devotion of a portion of their revenues to the repairing of the temple. But that the king took the matter in hand himself, not so much because of the dilatoriness or negligence of the priests as because his first measure'
  - where: 'note 12:9 “Why the repairs stalled, and what the chest changed”'
    claim: 'Kings and Chronicles on the vessels do not conflict: Kings speaks of the time while the repairs went on, Chronicles of what was done afterward'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/12.htm'
    quote: 'there is no ground for saying that there is any contradiction, since the words of our text affirm nothing more than that none of the money that came in was applied to the making of vessels of worship so long as the repairing of the building went on.'
  - where: 'note 12:18 “The temple''s treasures sent to Hazael”'
    claim: 'Hazael fought Israel and Judah for Ramoth-gilead, was defeated by Shalmaneser, then attacked again (12:17–18 among the attacks)'
    key: bd-hazael
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hazael?lang=eng'
    quote: 'soon started on a war with Israel and Judah for the possession of Ramoth-gilead (8:28–29; 9:14–15). We learn from Assyrian inscriptions that he was attacked and defeated in Damascus by Shalmaneser … but a few years later he was again strong enough to attack Israel (2 Kgs. 10:32; 12:17–18'
  - where: 'note 12:18 “The temple''s treasures sent to Hazael”'
    claim: 'The temple was often spoiled by foreign enemies or by kings of Judah, Joash among them, to buy off attack; it was restored by Joash and Josiah'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'It was often spoiled of its treasures, whether by foreign enemies (Shishak, Jehoash of Israel, Nebuchadnezzar) or by kings of Judah (Asa, Joash, Ahaz, Hezekiah) to buy off the attack … It was restored by Joash and by Josiah.'
  - where: 'note 12:18 “The temple''s treasures sent to Hazael”'
    claim: 'Chronicles: a small Syrian company defeated a great host because Judah had forsaken the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/24?lang=eng'
    quote: 'For the army of the Syrians came with a small company of men, and the Lord delivered a very great host into their hand, because they had forsaken the Lord God of their fathers.'
  - where: 'note 12:20 “Why his servants killed him”'
    claim: 'Chronicles: the servants conspired for the blood of Jehoiada''s sons; Joash not buried in the kings'' sepulchres; Jehoiada buried among the kings; Joash remembered not Jehoiada''s kindness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/24?lang=eng'
    quote: 'his own servants conspired against him for the blood of the sons of Jehoiada the priest, and slew him on his bed, and he died: and they buried him in the city of David, but they buried him not in the sepulchres of the kings.'
  - where: 'note 12:20 “Why his servants killed him”'
    claim: 'Jehoiada was buried with the kings as a mark of honor'
    key: bd-jehoiada
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehoiada?lang=eng'
    quote: 'The high priest who procured the overthrow of Queen Athaliah and the establishment of Joash as king; as a mark of honor he was buried with the kings of Judah'
  - where: 'note 12:20 “Why his servants killed him”'
    claim: 'Chronicles on Jehoiada''s burial'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/24?lang=eng'
    quote: 'And they buried him in the city of David among the kings, because he had done good in Israel, both toward God, and toward his house.'
  - where: christ
    claim: 'The Bible Dictionary sends the reader from the Zacharias of Luke 11:51 (and Matt. 23:35) to the Zechariah of 2 Chr. 24:20–22 (“see also”)'
    key: bd-zacharias
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zacharias?lang=eng'
    quote: '(2) Slain between the temple and the altar (Matt. 23:35; Luke 11:51; see also 2 Chr. 24:20–22).'
  - where: christ
    claim: 'Luke 11:51 and Matt. 23:37 in the King James'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'From the blood of Abel unto the blood of Zacharias, which perished between the altar and the temple: verily I say unto you, It shall be required of this generation.'
  - where: christ
    claim: 'Matt. 23:37'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/23?lang=eng'
    quote: 'O Jerusalem, Jerusalem, thou that killest the prophets, and stonest them which are sent unto thee'
  - where: christ
    claim: 'Matthew calls the martyr Zacharias son of Barachias'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/23?lang=eng'
    quote: 'unto the blood of Zacharias son of Barachias, whom ye slew between the temple and the altar.'
  - where: christ
    claim: 'Elder Henry D. Taylor relays Heber C. Kimball: no one will endure on borrowed light; each must gain personal knowledge; every member entitled to know Jesus Christ is the Savior'
    key: taylor-borrowed-light-1971
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1971/04/man-cannot-endure-on-borrowed-light?lang=eng'
    quote: 'Heber C. Kimball, a counselor to President Brigham Young, warned the Saints in 1856 that many trials would come to test their faith; that the time would come that no man or woman would be able to endure on borrowed light. Each must gain a personal knowledge of the truth'
  - where: explore
    claim: 'Zechariah''s last words in 2 Chr. 24:22'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/24?lang=eng'
    quote: 'And when he died, he said, The Lord look upon it, and require it.'
