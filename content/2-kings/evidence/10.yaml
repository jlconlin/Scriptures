chapter: 10
claims:
  - where: setting
    claim: 'Anointing Jehu was one of the last commissions given Elijah, carried out by Elisha'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'One of the last commissions the Lord gave Elijah was to anoint Jehu as king of Israel (see 1 Kings 19:16). Elisha now carried out that commission for Elijah.'
  - where: setting
    claim: 'Ahab raised an altar to Baal in the house of Baal he built in Samaria'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/16?lang=eng'
    quote: 'And he reared up an altar for Baal in the house of Baal, which he had built in Samaria.'
  - where: thread
    claim: 'The Student Manual: Ahab’s house deserved destruction; Jehu was the means; the Lord was not pleased with his methods'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'Jehu was the means of bringing about the Lord’s will in this regard, but that does not mean the Lord was pleased with his brutal methods or his wickedness.'
  - where: 'note 10:1 “Ahab’s seventy sons”'
    claim: 'The Hebrew ben reaches to grandsons and descendants; BDB cites 2 Kgs. 10:30 “sons of the fourth generation”'
    key: bdb
    url: 'https://biblehub.com/hebrew/1121.htm'
    quote: 'בְּנֵי רְבִעִים 2 Kings 10:30 sons of the fourth Generation, and, in General, descendants'
  - where: 'note 10:1 “Ahab’s seventy sons”'
    claim: 'The word is used in the widest sense, including grandson'
    key: bdb
    url: 'https://biblehub.com/hebrew/1121.htm'
    quote: 'a son (as a builder of the family name), in the widest sense (of literal and figurative relationship, including grandson'
  - where: 'note 10:1 “Ahab’s seventy sons”'
    claim: 'Jehu meant to kill all Ahab’s sons or grandsons who were heirs to the throne'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'Jehu wanted to kill all the sons or grandsons of Ahab who were part of the royal line and therefore heirs to the throne of Israel.'
  - where: 'note 10:1 “Ahab’s seventy sons”'
    claim: 'The two kings were Joram and Ahaziah, killed in chapter 9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/10?lang=eng'
    quote: 'But they were exceedingly afraid, and said, Behold, two kings stood not before him: how then shall we stand?'
  - where: 'note 10:9 “Who slew all these?”'
    claim: 'One older reading: Jehu spoke as if a higher decree had killed the princes, to justify his conspiracy and prepare for verse 10'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/10.htm'
    quote: 'Jehu did not tell the people that the king''s sons had been slain by his command, but spake as if this had been done without his interfering by a higher decree, that he might thereby justify his conspiracy in the eyes of the people'
  - where: 'note 10:9 “Who slew all these?”'
    claim: 'Jehu’s words at the gate'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/10?lang=eng'
    quote: 'Ye be righteous: behold, I conspired against my master, and slew him: but who slew all these?'
  - where: 'note 10:13 “Ahaziah’s kinsmen and the queen mother”'
    claim: 'Ahaziah’s father married the daughter of Ahab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/8?lang=eng'
    quote: 'for the daughter of Ahab was his wife: and he did evil in the sight of the Lord.'
  - where: 'note 10:13 “Ahaziah’s kinsmen and the queen mother”'
    claim: 'Ahaziah’s mother was Athaliah, daughter of Omri'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/8?lang=eng'
    quote: 'And his mother’s name was Athaliah, the daughter of Omri king of Israel.'
  - where: 'note 10:13 “Ahaziah’s kinsmen and the queen mother”'
    claim: 'Chronicles names the dead as princes of Judah and sons of Ahaziah’s brethren'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/22?lang=eng'
    quote: 'and found the princes of Judah, and the sons of the brethren of Ahaziah, that ministered to Ahaziah, he slew them.'
  - where: 'note 10:13 “Ahaziah’s kinsmen and the queen mother”'
    claim: 'gebirah means queen mother; BDB lists 1 Kgs. 15:13 and compares 2 Kgs. 10:13'
    key: bdb
    url: 'https://biblehub.com/hebrew/1377.htm'
    quote: '2 queen-mother, 1 Kings 15:13 2Chronicles 15:16; ׳וַיְסִרֶהָ מִגּ he removed her from (the position of) queen-mother; compare 2 Kings 10:13'
  - where: 'note 10:15 “Jehonadab, father of the Rechabites”'
    claim: 'Jonadab son of Rechab gave the Rechabites their rule'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/35?lang=eng'
    quote: 'for Jonadab the son of Rechab our father commanded us, saying, Ye shall drink no wine, neither ye, nor your sons for ever:'
  - where: 'note 10:15 “Jehonadab, father of the Rechabites”'
    claim: 'The group’s origin is obscure; Jehu invited Jehonadab to witness the attack; the family was known for loyalty to the LORD'
    key: thompson-rechabites
    url: 'https://scripturecentral.org/archive/books/book-chapter/rechabites-model-group-lehis-world'
    quote: 'How the Rechabite group originated is obscure; some have called it “a mystery.” … King Jehu encountered Jehonadab (Jonadab) while traveling toward Mount Carmel and invited him to accompany him and witness his destructive attack on the priests of Baal'
  - where: 'note 10:15 “Jehonadab, father of the Rechabites”'
    claim: 'The family was known for pious loyalty to Yahweh'
    key: thompson-rechabites
    url: 'https://scripturecentral.org/archive/books/book-chapter/rechabites-model-group-lehis-world'
    quote: 'these people were known, to a considerable degree, for their pious loyalty to Yahweh.'
  - where: 'note 10:19 “A sacrifice that was a trap”'
    claim: 'Ahab built the house of Baal in Samaria'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/16?lang=eng'
    quote: 'And he reared up an altar for Baal in the house of Baal, which he had built in Samaria.'
  - where: 'note 10:19 “A sacrifice that was a trap”'
    claim: 'One older reading: the slaying was lawful, but Jehu’s motives were political, since Baal’s priests were bound to Ahab’s dynasty'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/10.htm'
    quote: 'Objectively considered, the slaying of the worshippers of Baal was in accordance with the law, … but the subjective motives which impelled Jehu, apart from the artifice, were thoroughly selfish'
  - where: 'note 10:19 “A sacrifice that was a trap”'
    claim: 'One older reading: by destroying Baal’s worshippers Jehu might hope to draw the LORD’s many worshippers to his side'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/10.htm'
    quote: 'whereas by their extermination he might hope to draw to his side the whole of the very numerous supporters of the Jehovah-worship'
  - where: 'note 10:27 “A draught house”'
    claim: 'BDB: maḥărāʾâ, a cloaca or cesspool, the ketiv at 2 Kgs. 10:27, with qere môṣāʾôt'
    key: bdb
    url: 'https://biblehub.com/hebrew/4280.htm'
    quote: '[מַחֲרָאָה] noun feminine only plural cloaca, cess-pool; — מחראות 2 Kings 10:27 Kt (Qr מוֺצָאוֺת).'
  - where: 'note 10:27 “A draught house”'
    claim: 'BDB: the qere means places of going out, a privy, a euphemism for the ketiv'
    key: bdb
    url: 'https://biblehub.com/hebrew/4163.htm'
    quote: '2 Kings 10:27 Qr מוֺצָאוֺת places of going out to, i.e. a privy (compare Arabic ; German Abtritt), euphemistically for Kt מַחֲרָאוֺת.'
  - where: 'note 10:30 “Commended for the deed, faulted for the heart”'
    claim: 'The promise to Jehu was kept to the fourth generation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'Thy sons shall sit on the throne of Israel unto the fourth generation. And so it came to pass.'
  - where: 'note 10:30 “Commended for the deed, faulted for the heart”'
    claim: 'The LORD commends the deed done to Ahab’s house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/10?lang=eng'
    quote: 'and hast done unto the house of Ahab according to all that was in mine heart, thy children of the fourth generation shall sit on the throne of Israel.'
  - where: 'note 10:30 “Commended for the deed, faulted for the heart”'
    claim: 'The Student Manual: the house of Omri deserved destruction; the Lord was not pleased with Jehu’s methods'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'In other words, the house of Omri had reached such a state of wickedness that it deserved destruction. Jehu was the means of bringing about the Lord’s will in this regard, but that does not mean the Lord was pleased with his brutal methods or his wickedness.'
  - where: 'note 10:32 “Israel cut short”'
    claim: 'BDB renders the infinitive at 2 Kgs. 10:32 “to cut off in Israel”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7096.htm'
    quote: 'Pi`el Infinitive construct לִקַצּוֺת בְּ 2 Kings 10:32 to cut off in Israel'
  - where: 'note 10:32 “Israel cut short”'
    claim: 'Hazael was defeated by Shalmaneser, then attacked Israel again; the Bible Dictionary cites this verse'
    key: bd-hazael
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hazael?lang=eng'
    quote: 'he was attacked and defeated in Damascus by Shalmaneser, king of Assyria; but a few years later he was again strong enough to attack Israel (2 Kgs. 10:32; 12:17–18; 13:3–7, 22; 2 Chr. 24:24).'
  - where: 'note 10:32 “Israel cut short”'
    claim: 'Elisha wept, foreseeing the evil Hazael would do to Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/8?lang=eng'
    quote: 'And Hazael said, Why weepeth my lord? And he answered, Because I know the evil that thou wilt do unto the children of Israel'
  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary (see Mosiah 3:8; 15:1; 3 Ne. 15:1–5; D&C 110:1–10).'
  - where: christ
    claim: 'D&C 64:34: the Lord requires the heart and a willing mind'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/64?lang=eng'
    quote: 'Behold, the Lord requireth the heart and a willing mind; and the willing and obedient shall eat the good of the land of Zion in these last days.'
