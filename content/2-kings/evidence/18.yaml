chapter: 18
claims:
  - where: when
    claim: 'Sennacherib''s campaign against Judah and the siege of Jerusalem were in 701'
    key: luckenbill-annals
    url: 'https://archive.org/download/annalsofsennache00senn_0/annalsofsennache00senn_0_djvu.txt'
    quote: 'According to the Assyrian account this siege, conducted in 701, led to the submission of Hezekiah (it does not mention the capture of the city) and his payment of tribute.'
  - where: setting
    claim: 'Ahaz asked Assyria for help, which made Judah a vassal and brought disaster in Hezekiah''s reign'
    key: sc-knowhy-720
    url: 'https://scripturecentral.org/knowhy/why-is-ancient-near-eastern-history-and-geography-helpful-for-understanding-isaiah'
    quote: 'Ahaz asked Assyria for help in defeating the two northern invaders. This ended the war in 732 BC but ultimately made Judah a vassal kingdom to the Assyrian Empire. This would bring disastrous results during the reign of Hezekiah, son of Ahaz, just as Isaiah had prophesied'
  - where: setting
    claim: 'Hezekiah was a great religious and political reformer, assisted by Isaiah in church and state'
    key: bd-hezekiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hezekiah?lang=eng'
    quote: 'King of Judah, and a great religious and political reformer (2 Kgs. 18:1–21:3; 2 Chr. 29:1–33:3; Isa. 36–39). He suppressed idolatry and reconstituted the temple services. In his reforms both in church and state he had the assistance of the great prophet Isaiah.'
  - where: setting
    claim: 'Micah prophesied in Hezekiah''s days, and Hezekiah heeded him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/26?lang=eng'
    quote: 'Micah the Morasthite prophesied in the days of Hezekiah king of Judah … did he not fear the LORD, and besought the LORD, and the LORD repented him of the evil which he had pronounced against them?'
  - where: setting
    claim: 'Kings sums up the reform briefly and gives most room to the invasion; Chronicles describes the temple''s cleansing and the Passover, with the remnant of the ten tribes invited, at length'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/18.htm'
    quote: 'The prophetic author of our books first of all describes quite briefly the character of the king''s reign (2 Kings 18:1-8), and then gives an elaborate description of the invasion … The chronicler, on the other hand, has fixed his chief attention upon the religious reformation'
  - where: setting
    claim: 'Chronicles: the Passover to which Hezekiah invited the remnant of the ten tribes'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/18.htm'
    quote: 'the restoration of the Jehovah-cultus and the feast of passover, to which Hezekiah invited all the people, not only the subjects of his own kingdom, but the remnant of the ten tribes also (2 Chronicles 29-31)'
  - where: setting
    claim: 'From verse 13 the chapter parallels Isaiah 36'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/18?lang=eng'
    quote: '13a “fourteenth”: Isa. 36:1 (1–22).'
  - where: setting
    claim: 'The account of 18:13–19:37 is very similar to Isaiah 36–37'
    key: ot-manual-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-12?lang=eng'
    quote: 'is very similar to the account in Isaiah 36–37.'
  - where: thread
    claim: 'The verb "trust" (bāṭaḥ) first occurs in 2 Kings at 18:5, then in the Rabshakeh''s speech (18:19–24, 30) and 19:10'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'בָּטָ֑ח'
  - where: thread
    claim: 'Sennacherib took the money but did not depart, and sent a force against Jerusalem'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/18.htm'
    quote: 'For though Sennacherib did indeed take the money, he did not depart, as he had no doubt promised, but, emboldened still further by this submissiveness, sent a detachment of his army against Jerusalem, and summoned Hezekiah to surrender the capital.'
  - where: thread
    claim: 'Come, Follow Me reads the Assyrians'' taunts as a challenge to faith and Hezekiah''s faithfulness from 18:5–7'
    key: cfm-ot-2026-29
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/29?lang=eng'
    quote: 'Most of us have experiences that challenge our faith. For Hezekiah and his people, one of those challenges came when the Assyrian army approached Jerusalem.'
  - where: 'note 18:4 “The high places removed at last”'
    claim: 'Earlier kings praised by Kings left the high places (Asa, Jehoshaphat, Jehoash, Amaziah, Azariah, Jotham)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'Howbeit the high places were not removed: the people sacrificed and burned incense still in the high places. He built the higher gate of the house of the LORD.'
  - where: 'note 18:4 “The high places removed at last”'
    claim: 'Amaziah did right "yet not like David his father"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/14?lang=eng'
    quote: 'And he did that which was right in the sight of the LORD, yet not like David his father: he did according to all things as Joash his father did.'
  - where: 'note 18:4 “The high places removed at last”'
    claim: 'High places were local altars to Jehovah, desecrated by idolatry; Hezekiah and Josiah centralized worship in Jerusalem'
    key: bd-high-places
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/high-places?lang=eng'
    quote: 'Such altars became local centers of the worship of Jehovah. When idolatry came in, many of these altars were desecrated and used for heathen worship. Religious reformers like Hezekiah and Josiah tried therefore to centralize the worship more and more in Jerusalem'
  - where: 'note 18:4 “The high places removed at last”'
    claim: 'No sacrifices anywhere but Jerusalem, after Deuteronomy 12'
    key: bd-high-places
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/high-places?lang=eng'
    quote: 'the high places were ordered to be removed—no sacrifices were to be offered anywhere except in Jerusalem (2 Kgs. 18:4, 22; 23; 2 Chr. 31:1; 34:3; see also Deut. 12:11–14).'
  - where: 'note 18:4 “The high places removed at last”'
    claim: 'Chronicles: the people threw down the high places in Judah and in Ephraim and Manasseh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/31?lang=eng'
    quote: 'threw down the high places and the altars out of all Judah and Benjamin, in Ephraim also and Manasseh, until they had utterly destroyed them all.'
  - where: 'note 18:4 “Nehushtan”'
    claim: 'The serpent had been kept for centuries; Israel came to burn incense to it; Hezekiah destroyed it with the idolatry of Ahaz''s reign'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'The brass serpent created by Moses … had been preserved for centuries. At some point, the Israelites began burning incense to it. King Hezekiah wanted to eliminate idol worship. So he destroyed the brass serpent and all other forms of idol worship that had been prevalent during the reign of his father, Ahaz'
  - where: 'note 18:4 “Nehushtan”'
    claim: 'Nehushtan means "bronze serpent-thing"'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'The word nehushtan means “bronze serpent-thing”'
  - where: christ
    claim: 'The serpent was a type of the spiritual salvation wrought by Christ (John 3:14–15; 2 Ne. 25:20)'
    key: ot-manual-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-12?lang=eng'
    quote: 'As a means of physical salvation and as a type of the spiritual salvation to be wrought by Jesus Christ (see John 3:14–15; 2 Nephi 25:20; Helaman 8:13–15), Moses made a serpent of brass'
  - where: 'note 18:5 “He trusted”'
    claim: 'Hezekiah''s incomparability is in trust; Josiah''s in adherence to the law; no contradiction with 23:25'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/18.htm'
    quote: 'The verdict, "after him was none like him among all the kings of Judah," refers to Hezekiah''s confidence in God (בּטח), in which he had no equal, whereas in the case of Josiah his conscientious adherence to the Mosaic law is extolled in the same words (2 Kings 23:25)'
  - where: 'note 18:5 “He trusted”'
    claim: 'The verb bāṭaḥ occurs first in 2 Kings at 18:5 and then throughout the Rabshakeh''s speech'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'בָּטָֽחְתָּ'
  - where: 'note 18:5 “He trusted”'
    claim: 'Kings says the same of Josiah at 23:25 (the footnote at 18:5 points there)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/18?lang=eng'
    quote: '5a “trusted”: 2 Kgs. 23:25.'
  - where: 'note 18:7 “Why Hezekiah rebelled”'
    claim: 'Under Ahaz''s treaty Judah paid annual tribute; Hezekiah rebelled around 705 BC after the Assyrian king''s death; Sennacherib invaded a few years later'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'As part of the treaty King Ahaz established with the king of Assyria, the Kingdom of Judah was subservient to Assyria and required to pay a large annual tribute. This arrangement continued through the reign of Hezekiah until around 705 BC, when Hezekiah rebelled against Assyria following the death of their king.'
  - where: 'note 18:7 “Why Hezekiah rebelled”'
    claim: 'Hezekiah refused the usual tribute; a successful expedition against the Philistines'
    key: bd-hezekiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hezekiah?lang=eng'
    quote: 'The early part of the reign was prosperous. Hezekiah made a successful expedition against the Philistines (2 Kgs. 18:8; 2 Chr. 28:18) and refused to pay the usual tribute to Assyria (2 Kgs. 18:7).'
  - where: 'note 18:7 “Why Hezekiah rebelled”'
    claim: 'Ahaz paid the temple''s and palace''s silver and gold to Assyria'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/16?lang=eng'
    quote: 'And Ahaz took the silver and gold that was found in the house of the LORD, and in the treasures of the king’s house, and sent it for a present to the king of Assyria.'
  - where: 'note 18:14 “What Isaiah leaves out”'
    claim: 'Isaiah and Chronicles pass over the negotiations and tribute'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/18.htm'
    quote: 'These negotiations with Sennacherib on the part of Hezekiah are passed over both in the book of Isaiah and also in the Chronicles, because they had no further influence upon the future progress of the war.'
  - where: 'note 18:14 “What Isaiah leaves out”'
    claim: 'Sennacherib''s annals record thirty talents of gold and 800 talents of silver among Hezekiah''s tribute, sent after him to Nineveh'
    key: luckenbill-annals
    url: 'https://archive.org/download/annalsofsennache00senn_0/annalsofsennache00senn_0_djvu.txt'
    quote: 'In addition to the 30 talents of gold and 800 talents of silver (there were), gems, … all kinds of valuable (heavy) treasures, as well as his daughters, his harem, his male and female musicians, (which) he had (them) bring after me to Nineveh, my royal city.'
  - where: 'note 18:14 “What Isaiah leaves out”'
    claim: 'The Kings account agrees with the Assyrian on the captured cities and the tribute'
    key: luckenbill-annals
    url: 'https://archive.org/download/annalsofsennache00senn_0/annalsofsennache00senn_0_djvu.txt'
    quote: 'the passage in IT Kings 18:13 f. (and Isa. 36:1f.) agrees with the Assyrian account in the report of Judean cities captured by Sennacherib and tribute paid the Assyrian by Hezekiah.'
  - where: 'note 18:14 “What Isaiah leaves out”'
    claim: 'The confession shows Hezekiah had rebelled without provocation, thinking himself strong enough'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/18.htm'
    quote: 'It seems most natural to gather from this that Hezekiah had begun his movement for rebellion without any provocation from Assyria. … his confession of a fault shews that he had attempted to withdraw his homage merely because he thought himself strong enough to do so.'
  - where: 'note 18:14 “What Isaiah leaves out”'
    claim: 'Older reading: nothing wrong in throwing off the yoke; the wrong was buying back the peace, a temporary weakness of faith turned to blessing by the Lord''s covenant faithfulness'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/18.htm'
    quote: 'there was nothing really wrong in the shaking off of this yoke by the refusal to pay any further tribute. But Hezekiah certainly did wrong, when, after taking the first step, he was alarmed … This false step on the part of the pious king, which arose from a temporary weakness of faith'
  - where: 'note 18:14 “What Isaiah leaves out”'
    claim: 'The false step was turned to blessing by Sennacherib''s pride and the Lord''s covenant faithfulness'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/18.htm'
    quote: 'was nevertheless turned into a blessing through the pride of Sennacherib and the covenant-faithfulness of the Lord'
  - where: 'note 18:14 “What Isaiah leaves out”'
    claim: 'Ahaz had emptied the treasuries of temple and palace in the same way'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/18.htm'
    quote: 'The like emptying of the treasuries both of the temple and of the king had been made a very few years before (2 Kings 16:8) by Ahaz to purchase the alliance of Tiglath-pileser against Pekah and Rezin.'
  - where: 'note 18:14 “What Isaiah leaves out”'
    claim: 'Hezekiah undid the adornment of the temple he had done; the gold plating of doors and doorposts (2 Chr. 29:3)'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/18.htm'
    quote: 'Hezekiah was the last man to have stripped the temple doors if there had been any other way of raising what was demanded. He had been rejoiced at the purification and adornment of the temple, and must have been very hard driven ere he consented to undo the work which he had so lately done.'
  - where: 'note 18:14 “What Isaiah leaves out”'
    claim: 'The posts are the doorposts; the gold plates Hezekiah had put on them (2 Chr. 29:3)'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/18.htm'
    quote: 'had the gold plates with which he had covered the doors and doorposts of the temple (2 Chronicles 29:3) removed, to send them to the king of Assyria. האמנות, lit., the supports, i.e., the posts, of the doors.'
  - where: 'note 18:14 “What Isaiah leaves out”'
    claim: 'In his first year Hezekiah opened and repaired the temple doors'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/29?lang=eng'
    quote: 'He in the first year of his reign, in the first month, opened the doors of the house of the Lord, and repaired them.'
  - where: 'note 18:14 “What Isaiah leaves out”'
    claim: 'Sennacherib took the money and still sent an army against Jerusalem'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/18.htm'
    quote: 'For though Sennacherib did indeed take the money, he did not depart, as he had no doubt promised, but, emboldened still further by this submissiveness, sent a detachment of his army against Jerusalem'
  - where: 'note 18:17 “The rest is Isaiah 36”'
    claim: 'Isaiah 36:2 names only the Rabshakeh, sent from Lachish'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/36?lang=eng'
    quote: 'And the king of Assyria sent Rabshakeh from Lachish to Jerusalem unto king Hezekiah with a great army.'
  - where: 'note 18:17 “The rest is Isaiah 36”'
    claim: 'Isaiah 36:19 lacks Hena and Ivah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/36?lang=eng'
    quote: 'Where are the gods of Hamath and Arphad? where are the gods of Sepharvaim? and have they delivered Samaria out of my hand?'
  - where: christ
    claim: 'Nephi makes the serpent Moses raised a witness that there is no other name than Jesus Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/25?lang=eng'
    quote: 'if they would cast their eyes unto the serpent which he did raise up before them … there is none other name given under heaven save it be this Jesus Christ, of which I have spoken, whereby man can be saved.'
  - where: christ
    claim: 'Hezekiah and Josiah encourage those whose lives need reform to trust in the Lord'
    key: cfm-ot-2026-29
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/29?lang=eng'
    quote: 'When we sense that our lives need some reforms, we can take encouragement from these two bright spots in the dark years of Judah’s history. Perhaps the examples of Hezekiah and Josiah can inspire us to “trust in the Lord our God” (2 Kings 18:22).'
  - where: christ
    claim: 'The Assyrians'' reasons not to trust the Lord compared with reasons Satan gives for doubting faith today'
    key: cfm-ot-2026-29
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/29?lang=eng'
    quote: 'Compare the Assyrians’ reasons for the Israelites not to trust the Lord with the reasons Satan gives for us to doubt our faith today.'
