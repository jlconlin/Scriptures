chapter: 13
claims:
  - where: setting
    claim: 'Jehoahaz is the first of the four generations promised to Jehu'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/13.htm'
    quote: 'Jehoahaz the son of Jehu] The first of the four generations for which God promised that the line of Jehu should continue.'
  - where: setting
    claim: 'Two kings named Jehoash: one in Israel, son of Jehoahaz; one in Judah, hidden from Athaliah'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'There were two kings by the same name. Jehoash who became king of Israel, the Northern Kingdom, was the son of Jehoahaz and helped deliver Israel from the Syrians. The other Jehoash, also called Joash, was the one hid by the priests in Judah'
  - where: setting
    claim: 'Elisha''s ministry lasted more than fifty years, through Jehoram, Jehu, Jehoahaz and Joash'
    key: bd-elisha
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elisha?lang=eng'
    quote: 'His ministry lasted more than 50 years, during the reigns of Jehoram, Jehu, Jehoahaz, and Joash.'
  - where: setting
    claim: 'The narrative moves ahead of the events it discusses, the historian writing many years later'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'The narrative here is difficult to follow because the historian continually moves ahead of the circumstances he is discussing. He could do so because he was writing many years later.'
  - where: setting
    claim: 'Chapter 13 is not in Chronicles'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/13.htm'
    quote: 'The visit of Joash to Elisha on his deathbed. Elisha’s prediction of victory over Syria. A dead body brought to life on touching Elisha’s bones (Not in Chronicles)'
  - where: thread
    claim: 'The account of Hazael''s oppression and Joash''s victories is given so that Elisha''s prophecy is seen fulfilled'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/13.htm'
    quote: 'The prophecy which Elisha uttered before his death is here followed immediately by the account of its fulfilment, and to this end the oppression of the Israelites by Hazael is mentioned once more'
  - where: 'note 13:5 “Who the saviour was”'
    claim: 'The promised saviour is not a reference to Jesus; deliverance came through Jehoahaz''s son and grandson'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'Because the title of Savior is associated with Jesus, some may think the Lord was promising a deliverer, but all that was being promised was deliverance. Deliverance from Hazael, king of Syria, and later his son, Ben-hadad, was to come through the son and grandson of Jehoahaz.'
  - where: 'section 1 plain'
    claim: 'Dwelling in their tents means living peaceably at home without being driven off by the enemy'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/13.htm'
    quote: 'dwelt in their booths again, as before, i.e., were able to live peaceably again in their houses, without being driven off and led away by the foe'
  - where: 'note 13:5 “Who the saviour was”'
    claim: '2 Kings 14:26–27: the LORD saw the affliction of Israel and saved them by the hand of Jeroboam'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/14?lang=eng'
    quote: 'For the LORD saw the affliction of Israel, that it was very bitter … but he saved them by the hand of Jeroboam the son of Joash.'
  - where: 'note 13:6 “The calves, and the grove left standing”'
    claim: 'The grove is the Asherah, a tree or pole set up as an object of worship, forbidden by the prophets'
    key: bd-grove
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/grove?lang=eng'
    quote: 'In Hebrew, called Asherah … either a living tree or a tree-like pole, set up as an object of worship, being symbolic of the female or productive principle in nature.'
  - where: 'note 13:6 “The calves, and the grove left standing”'
    claim: 'Jehu destroyed Baal but kept the golden calves at Bethel and Dan; Ahab made a grove'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/10?lang=eng'
    quote: 'Howbeit from the sins of Jeroboam the son of Nebat, who made Israel to sin, Jehu departed not from after them, to wit, the golden calves that were in Beth-el, and that were in Dan.'
  - where: 'note 13:14 “A king who wept for the prophet”'
    claim: 'Elisha had used the same words of Elijah at 2:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/2?lang=eng'
    quote: 'And Elisha saw it, and he cried, My father, my father, the chariot of Israel, and the horsemen thereof.'
  - where: 'note 13:16 “A prophecy acted out by two”'
    claim: 'Prophetic symbolic actions sometimes included the prophet and another person: Elisha and Joash shot the arrow together'
    key: parry-symbolic-action
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/symbolic-action-prophecy-old-testament'
    quote: 'In at least two instances in the Old Testament, the symbolic action included participation of the prophet and one or more other individuals—Elisha and Joash together shot an arrow (see 2 Kings 13:14–19)'
  - where: 'note 13:16 “A prophecy acted out by two”'
    claim: 'Prophetic symbolic action originated from God and carries His authority'
    key: parry-symbolic-action
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/symbolic-action-prophecy-old-testament'
    quote: 'Second, the prophetic symbolic action originated from God. … Because the revelation originates with God and thus carries the authority of God through His prophet, the message (whether verbal or nonverbal) should therefore be accepted.'
  - where: 'note 13:16 “A prophecy acted out by two”'
    claim: 'Other prophets prophesied by symbolic action, such as Ahijah tearing the garment'
    key: parry-symbolic-action
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/symbolic-action-prophecy-old-testament'
    quote: 'Ahijah tore a new garment into twelve pieces (see 1 Kings 11:29–31)'
  - where: 'note 13:19 “Why three strokes angered the prophet”'
    claim: 'Smiting the ground means shooting the arrows to the earth, a symbol of the overthrow of the Syrians'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/13.htm'
    quote: 'ארצה הך, "strike to the earth," i.e., shoot the arrows to the ground … The shooting of the arrows to the earth was intended to symbolize the overthrow of the Syrians.'
  - where: 'note 13:19 “Why three strokes angered the prophet”'
    claim: 'Stopping after three was a sign of lack of zeal for the promise, of true faith in God''s power to fulfil it'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/13.htm'
    quote: 'When, therefore, he left off after shooting only three times, this was a sign that he was wanting in the proper zeal for obtaining the divine promise, i.e., in true faith in the omnipotence of God to fulfil His promise.'
  - where: 'note 13:19 “Why three strokes angered the prophet”'
    claim: 'The lack of zeal diminished the completeness of the victory God had promised'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/13.htm'
    quote: 'The lack of zeal in Joash by the giving of only three strokes when Elisha hoped for five or six, diminished the completeness of the victory which God had promised.'
  - where: 'note 13:19 “Why three strokes angered the prophet”'
    claim: 'Verse 25 is told so the prophecy can be seen fulfilled; the three victories drove Syria from west of the Jordan'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/13.htm'
    quote: 'The history is introduced that the prophecy of Elisha may be pointed out as fulfilled. By these three victories Syria must have been driven from the west side of the Jordan, the land which had been conquered by Hazael in the reign of Jehoahaz.'
  - where: 'note 13:21 “Life from a prophet’s grave”'
    claim: 'Moabite bands came at the season of the year when armies took the field'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/13.htm'
    quote: 'We can see from such passages as 2 Samuel 11:1; 1 Kings 20:22; 1 Kings 20:26 … that there was a season of the year at which alone it was usual, and perhaps, on account of the climate, possible, for an army to take the field.'
  - where: 'note 13:21 “Life from a prophet’s grave”'
    claim: 'The dead were wrapped, not coffined, and laid in rock tombs closed by a stone, so the body could touch Elisha''s bones'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/13.htm'
    quote: 'The earlier Israelites did not bury their dead in coffins, but wrapped them in linen cloths and laid them in tombs hewn out of the rock. The tomb was then covered with a stone, which could easily be removed.'
  - where: 'note 13:21 “Life from a prophet’s grave”'
    claim: 'The miracle set the seal of divine attestation on the dying prophet''s prophecy of victory; God of the living'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/13.htm'
    quote: 'The design of this miracle … was not to show how even in the grave Elisha surpassed his master Elijah in miraculous power … but to impress the seal of divine attestation upon the prophecy of the dying prophet concerning the victory of Joash over the Syrians'
  - where: 'note 13:21 “Life from a prophet’s grave”'
    claim: 'The miracle shows it was nothing in the prophet himself; God worked through his dead body too'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/13.htm'
    quote: 'The record of this miracle seems intended to set forth that it was nothing in the prophet himself which had given him the great powers he manifested in his lifetime. Through his dead body God could work a miracle also.'
  - where: 'note 13:21 “Life from a prophet’s grave”'
    claim: '“Bones” need not mean a long time had passed since Elisha''s death'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/13.htm'
    quote: 'We need not press the literal sense of ‘bones’, as though a long time had elapsed since Elisha died.'
  - where: 'note 13:23 “Spared for the fathers’ sake, as yet”'
    claim: 'At the fall of Samaria the LORD removed Israel out of His sight, as He had said by the prophets'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/17?lang=eng'
    quote: 'Until the LORD removed Israel out of his sight, as he had said by all his servants the prophets.'
  - where: setting
    claim: 'Under Jehoahaz Hazael conquered the land west of the Jordan; the east had been taken in Jehu''s day'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/13.htm'
    quote: 'By these three victories Syria must have been driven from the west side of the Jordan, the land which had been conquered by Hazael in the reign of Jehoahaz. The eastern side of Jordan was already in the hand of Syria before Jehoahaz came to the throne.'
  - where: thread
    claim: 'Joash''s three victories fulfil Elisha''s prophecy'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/13.htm'
    quote: 'Three times did Joash beat [R.V. smite] him] The history is introduced that the prophecy of Elisha may be pointed out as fulfilled.'
  - where: thread
    claim: 'The king was to appropriate the promise through his own act; stopping showed lack of zeal'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/13.htm'
    quote: 'This promise the king was then to appropriate to himself through an act of his own.'
  - where: 'note 13:19 “Why three strokes angered the prophet”'
    claim: 'Jeroboam reconquered Gilead'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/13.htm'
    quote: 'Joash recovered the former from Benhadad, whilst his son Jeroboam reconquered Gilead also (see at 2 Kings 14:25).'
  - where: christ
    claim: 'The promise of deliverance was to be appropriated through the king''s own act'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/13.htm'
    quote: 'This promise the king was then to appropriate to himself through an act of his own.'
  - where: christ
    claim: 'The miracle bore witness that God is the God of the living, not the dead'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/13.htm'
    quote: 'since the Lord thereby bore witness that He was not the God of the dead, but of the living, and that His spirit was raised above death and corruptibility.'
  - where: christ
    claim: 'Jesus Christ is at the center of the Abrahamic covenant'
    key: nelson-everlasting-covenant
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/10/04-the-everlasting-covenant?lang=eng'
    quote: 'The fulfillment of the Abrahamic covenant becomes feasible because of the Atonement of our Savior, the Lord Jesus Christ. Jesus Christ is at the center of the Abrahamic covenant.'
  - where: christ
    claim: 'God will not abandon those who have covenanted with Him; He offers chances to change and helps them back'
    key: nelson-everlasting-covenant
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/10/04-the-everlasting-covenant?lang=eng'
    quote: 'Because God has hesed for those who have covenanted with Him, He will love them. He will continue to work with them and offer them opportunities to change. He will forgive them when they repent. And should they stray, He will help them find their way back to Him.'
  - where: explore
    claim: 'Parry''s study of symbolic action as prophecy in the Old Testament'
    key: parry-symbolic-action
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/symbolic-action-prophecy-old-testament'
    quote: 'Several Old Testament prophets, including Abraham, Moses, Ahijah, Elijah, Isaiah, Jeremiah, and Ezekiel used such symbolic actions to prophesy, without words, of future events.'
  - where: 'note 13:10 “Years that do not add up”'
    claim: 'Jehoahaz began in the 23rd year of Joash of Judah and reigned 17 years; Jehoash began in the 37th'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/13?lang=eng'
    quote: 'In the thirty and seventh year of Joash king of Judah began Jehoash the son of Jehoahaz to reign over Israel in Samaria, and reigned sixteen years.'
  - where: 'note 13:14 “A king who wept for the prophet”'
    claim: 'The same phrase used by Joash at Elisha''s death ties Elijah and Elisha together'
    key: woods-elisha-children
    url: 'https://byustudies.byu.edu/article/elisha-and-the-children-the-question-of-accepting-prophetic-succession'
    quote: 'It is interesting to note that this exact phrase is used by Joash, king of Israel, when Elisha departed from him at Elisha’s death (2 Kings 13:14). This reoccurrence lends further credence to the idea that the editor of the book of Kings is trying to tie together the prophetic characteristics of Elijah and Elisha.'
  - where: 'note 13:16 “A prophecy acted out by two”'
    claim: 'Gilead east of the Jordan taken by Hazael in Jehu''s day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/10?lang=eng'
    quote: 'From Jordan eastward, all the land of Gilead, the Gadites, and the Reubenites, and the Manassites, from Aroer, which is by the river Arnon, even Gilead and Bashan.'
  - where: 'note 13:23 “Spared for the fathers’ sake, as yet”'
    claim: '“As yet” is ʿad ʿattâ, until now'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'עָֽתָּה'
  - where: 'note 13:5 “Who the saviour was”'
    claim: 'The historian wrote many years after the events'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'The narrative here is difficult to follow because the historian continually moves ahead of the circumstances he is discussing. He could do so because he was writing many years later.'
  - where: 'note 13:14 “A king who wept for the prophet”'
    claim: 'Jehoash sought the dying prophet, perhaps feeling Elisha alone held the key to Israel''s safety'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'Jehoash, king of Israel, sought the prophet before his death, perhaps feeling that Elisha alone held the key to Israel’s future safety.'
  - where: 'note 13:16 “A prophecy acted out by two”'
    claim: 'Symbolic actions often needed other participants or an audience; Ahijah tore the garment as Jeroboam looked on'
    key: parry-symbolic-action
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/symbolic-action-prophecy-old-testament'
    quote: 'Other examples demonstrate audience observation. Ahijah ripped the garment as King Jeroboam looked on.'
  - where: 'note 13:23 “Spared for the fathers’ sake, as yet”'
    claim: 'In 13:23 “from his presence” is pānāyw, His face or presence'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/2_kings/13-23.htm'
    quote: 'pā·nāw'
  - where: 'note 13:23 “Spared for the fathers’ sake, as yet”'
    claim: 'In 17:23 “out of his sight” is the same word, His presence'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/2_kings/17-23.htm'
    quote: 'till that Jehovah hath turned Israel aside from His presence'
  - where: 'note 13:5 “Who the saviour was”'
    claim: 'The saviour was given in Jehoahaz''s two successors, Jehoash (who won back the cities) and Jeroboam (who restored the borders)'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/13.htm'
    quote: 'but the Lord gave them the saviour in the two successors of Jehoahaz, in the kings Jehoash and Jeroboam, the former of whom wrested from the Syrians all the cities'
