chapter: 20
claims:
  - where: when
    claim: 'Hezekiah reigned twenty-nine years'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/18?lang=eng'
    quote: 'Twenty and five years old was he when he began to reign; and he reigned twenty and nine years in Jerusalem.'
  - where: setting
    claim: 'Verses 1–11 parallel Isaiah 38 and verses 12–19 Isaiah 39'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/20?lang=eng'
    quote: '1a “Hezekiah”: Isa. 38:1 (1–8). … 12a “Berodach-baladan”: Isa. 39:1.'
  - where: setting
    claim: 'Kings omits the psalm Isaiah gives (Isa. 38:9), the thanksgiving with which Hezekiah would go up to the temple'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/20.htm'
    quote: 'But there is given there the thanksgiving of Hezekiah which expresses the feelings with which the king would go up to the temple … It is called ‘the writing of Hezekiah when he had been sick and was recovered of his sickness’ (Isaiah 38:9)'
  - where: setting
    claim: 'The promise of deliverance in verse 6 implies the Assyrians had not yet withdrawn'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/20.htm'
    quote: 'The words, "and I will deliver thee out of the hand of the Assyrians," imply most distinctly that the Assyrian had only occupied the land and threatened Jerusalem, and had not yet withdrawn.'
  - where: setting
    claim: 'Another reading takes verse 6 as protection from future attacks, puts the illness soon after the Assyrian overthrow, and finds the fourteenth year plus fifteen equal to the twenty-nine years'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/20.htm'
    quote: 'It is to deliverance from all such future attacks that God’s promise is best referred. … we come to the conclusion that Hezekiah’s sickness occurred soon after the Assyrian overthrow, and that thus the notes of time which fix (2 Kings 18:13) Sennacherib’s invasion in the fourteenth year … fill up together the twenty-nine years'
  - where: setting
    claim: 'The prophecy of verse 17 is fulfilled at 2 Kings 24:13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/20?lang=eng'
    quote: '17a “carried”: 2 Kgs. 24:13 (12–14); 1 Ne. 1:13.'
  - where: 'note 20:10 “Why the shadow had to go back”'
    claim: 'The backward shadow signified a life at its natural close being put back by God for more years'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/20.htm'
    quote: 'The retrograde movement of the shadow upon the sun-dial indicated that Hezekiah''s life, which had already arrived at its close by natural means, was to be put back by a miracle of divine omnipotence, so that it might continue for another series of years.'
  - where: thread
    claim: 'Judah removed for the sins of Manasseh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'Surely at the commandment of the LORD came this upon Judah, to remove them out of his sight, for the sins of Manasseh, according to all that he did;'
  - where: 'note 20:4 “The middle court, or the middle of the city”'
    claim: 'The ketiv reads "city" (hāʿîr) and the qere "court" (ḥāṣēr)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'ה/עיר … חָצֵ֖ר'
  - where: 'note 20:5 “What Kings adds to the promise”'
    claim: 'The Hebrew word for "captain" is nāgîd'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'נְגִיד'
  - where: 'note 20:5 “What Kings adds to the promise”'
    claim: '2 Kings 19:34 uses the same words of the defense of the city'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/19?lang=eng'
    quote: 'For I will defend this city, to save it, for mine own sake, and for my servant David’s sake.'
  - where: 'note 20:6 “Fifteen years added”'
    claim: 'President Kimball: we seldom exceed our time; Hezekiah was the exception; the Lord yielded to his prayers'
    key: ot-manual-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-12?lang=eng'
    quote: '“I believe we may die prematurely but seldom exceed our time very much. One exception was Hezekiah, 25-year-old king of Judah who was far more godly than his successors or predecessors. … “The Lord yielded unto his prayers.'
  - where: 'note 20:6 “Fifteen years added”'
    claim: 'The manual points from Kimball''s words to D&C 42:48'
    key: ot-manual-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-12?lang=eng'
    quote: '(Faith Precedes the Miracle, pp. 103–5; see also D&C 42:48.)'
  - where: 'note 20:6 “Fifteen years added”'
    claim: 'The First Presidency (1905) likened the warning to Edward Partridge to Hezekiah''s case; the prophecy was conditional and passed when Partridge repented'
    key: sc-knowhy-804
    url: 'https://scripturecentral.org/knowhy/why-did-the-lord-talk-about-one-mighty-and-strong'
    quote: 'The First Presidency goes on to liken this incident to the sickness and healing of Hezekiah recorded in 2 Kings 20:1–6. In that prophecy, Hezekiah was told he would soon die, but it was then rescinded when Hezekiah prayed to the Lord.'
  - where: 'note 20:6 “Fifteen years added”'
    claim: 'The statement was the First Presidency''s in 1905; Partridge had been warned that one mighty and strong would take his place'
    key: sc-knowhy-804
    url: 'https://scripturecentral.org/knowhy/why-did-the-lord-talk-about-one-mighty-and-strong'
    quote: 'As the First Presidency observed in 1905 … “[Edward Partridge] was warned of the judgment of God impending, and the prediction was made that another, ‘one mighty and strong,’ would be sent of God to take his place'
  - where: 'note 20:6 “Fifteen years added”'
    claim: 'Partridge repented and the threatened judgment passed'
    key: sc-knowhy-804
    url: 'https://scripturecentral.org/knowhy/why-did-the-lord-talk-about-one-mighty-and-strong'
    quote: 'However, Bishop Partridge repented … he “undoubtedly obtained a mitigation of the threatened judgment,” so the coming forth of one mighty and strong “may also be considered as having passed away and the whole incident of the prophecy closed.”'
  - where: 'note 20:10 “Why the shadow had to go back”'
    claim: 'A sudden advance in the direction the shadow was going seems natural and easier; going back reverses nature'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/20.htm'
    quote: 'The king’s meaning is that it appears more natural and therefore easier, for the shadow to make a sudden advance in the direction in which it has been already going, than to turn in the contrary way. let the shadow return backward ten degrees] R.V. steps. Thus reversing the order of nature.'
  - where: 'note 20:10 “Why the shadow had to go back”'
    claim: 'Isaiah seems to give a choice, though Hezekiah may have taken the words hypothetically and replied that only a backward shadow would be a sure sign'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/20.htm'
    quote: 'Isaiah seems to have given the king a choice as to the sign, namely, whether the shadow should go ten degrees forward or backward. But this does not necessarily follow from the words quoted. … and may have replied, the advance of the shadow would not be a sure sign to him, but only its going back.'
  - where: 'note 20:10 “Why the shadow had to go back”'
    claim: 'The sign was chosen as significant: the retrograde shadow pictured a life at its close put back by God'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/20.htm'
    quote: 'This miraculous sign was selected as a significant one in itself, to confirm the promise of a fresh extension of life which had been given to Hezekiah by the grace of God in opposition to the natural course of things.'
  - where: 'note 20:10 “Why the shadow had to go back”'
    claim: 'In Isaiah the sign is announced without a choice'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/38?lang=eng'
    quote: 'Behold, I will bring again the shadow of the degrees, which is gone down in the sun dial of Ahaz, ten degrees backward.'
  - where: 'note 20:12 “The rest is Isaiah 39”'
    claim: 'Merodach is the more correct form; the labials interchange easily'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/20.htm'
    quote: 'The first part of the name is given as Merodach in Isaiah. This is the more correct form, but the interchange of the two labials is very easily made.'
  - where: 'note 20:12 “The rest is Isaiah 39”'
    claim: '"Was glad" in Isaiah is the correct reading; the Septuagint reads "he rejoiced" in Kings; the Hebrew words differ very slightly'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/20.htm'
    quote: 'In Isaiah we read he ‘was glad of them’, and there is no doubt that is the correct reading. The LXX. gives ἐχάρη, he rejoiced, in this passage. The difference in the Hebrew words is very slight.'
  - where: 'note 20:12 “The rest is Isaiah 39”'
    claim: '"Hearkened" is apparently a copyist''s error for Isaiah''s "was glad," which many manuscripts and versions have in Kings'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/20.htm'
    quote: 'In 2 Kings 20:13 ויּשׁמע is apparently a copyist''s error for ויּשׂמח of Isaiah, which many of the codd. and ancient versions have even in our text.'
  - where: 'note 20:12 “The rest is Isaiah 39”'
    claim: 'Isaiah''s wording of verses 12, 13 and 19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/39?lang=eng'
    quote: 'At that time Merodach-baladan, the son of Baladan, king of Babylon, sent letters and a present to Hezekiah … And Hezekiah was glad of them … He said moreover, For there shall be peace and truth in my days.'
  - where: 'note 20:20 “Hezekiah’s tunnel”'
    claim: 'The tunnel: about 1770 feet through limestone, Gihon to Siloam, about 701 BC, a defense against Assyria; dug from both ends; inscription near the Siloam end; still in use'
    key: bd-hezekiahs-tunnel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hezekiahs-tunnel?lang=eng'
    quote: 'An elaborate engineering scheme extending about 1770 feet through limestone rock, bringing the waters of Gihon spring inside the walls of Jerusalem to the pool of Siloam. The tunnel was built in the days of Hezekiah, about 701 B.C., as a defense against possible attack from the Assyrian army under Sennacherib (2 Kgs. 20:20; 2 Chr. 32:4, 30). Workmen dug from both ends'
  - where: 'note 20:20 “Hezekiah’s tunnel”'
    claim: 'The inscription tells how the workmen heard each other and the water flowed'
    key: bd-hezekiahs-tunnel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hezekiahs-tunnel?lang=eng'
    quote: 'each heard the voice of the other who called his neighbor … And on the day of the boring through the stonecutters struck, each to meet his fellow, pick to pick, and there flowed the waters to the pool'
  - where: 'note 20:20 “Hezekiah’s tunnel”'
    claim: 'The tunnel served the Western Hill''s population and protected the water from a siege; 643 meters; two teams following fissures; at least four years'
    key: pierce-israelite-refugees
    url: 'https://rsc.byu.edu/covenant-compassion/experience-israelite-refugees'
    quote: 'This project stemmed from the need to provide water to the growing population of the Western Hill as well as the necessity of protecting Jerusalem’s water supply from Assyrian forces should Jerusalem be besieged. … The tunnel runs for 643 meters (2,100 feet) … it is estimated that the tunneling took at least four years to complete.'
  - where: 'note 20:20 “Hezekiah’s tunnel”'
    claim: 'Isaiah''s complaint was preoccupation with physical preparation rather than trust in the Lord'
    key: pierce-israelite-refugees
    url: 'https://rsc.byu.edu/covenant-compassion/experience-israelite-refugees'
    quote: 'Isaiah clearly identified the primary problem with the Judahite leadership and people—namely, their preoccupation with physical preparations rather than trusting in the Lord'
  - where: 'note 20:20 “Hezekiah’s tunnel”'
    claim: 'The water source let Jerusalem endure long sieges and contributed to the belief in Lehi''s time that the city could not fall'
    key: sc-knowhy-451
    url: 'https://scripturecentral.org/knowhy/why-did-some-in-lehis-time-believe-that-jerusalem-could-not-be-destroyed'
    quote: 'created a water source inside the city that would help them endure long sieges (2 Kings 20:20; 2 Chronicles 32:4, 30). These robust fortifications would surely have contributed to a feeling of impregnability.'
  - where: christ
    claim: 'Hezekiah''s prayer and tears'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/20?lang=eng'
    quote: 'I have heard thy prayer, I have seen thy tears: behold, I will heal thee'
  - where: explore
    claim: 'Pierce''s study of Hezekiah''s Jerusalem, the tunnel and the refugees who built it'
    key: pierce-israelite-refugees
    url: 'https://rsc.byu.edu/covenant-compassion/experience-israelite-refugees'
    quote: 'the use of Israelite labor to create the Siloam Tunnel and the Broad Wall, seal impressions and ostraca with Israelite names, and Hezekiah naming his son Manasseh all strongly suggest ways that the Judahites incorporated refugees'
  - where: 'note 20:4 “The middle court, or the middle of the city”'
    claim: 'The Septuagint reads "the middle court" with the qere'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_kings/20.htm'
    quote: 'And Esaias was in the middle court, and the word of the Lord came to him'
  - where: 'note 20:5 “What Kings adds to the promise”'
    claim: 'The word the LORD used of Saul in 1 Samuel 9:16 is nāgîd'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'נָגִיד'
  - where: 'note 20:5 “What Kings adds to the promise”'
    claim: 'Isaiah 38:6 ends at "I will defend this city," and Isaiah 38:22 presupposes the going up to the temple'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/38?lang=eng'
    quote: 'And I will deliver thee and this city out of the hand of the king of Assyria: and I will defend this city. … What is the sign that I shall go up to the house of the LORD?'
  - where: 'note 20:12 “The rest is Isaiah 39”'
    claim: 'Kings has wayyišmaʿ, "and he heard"'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'וַ/יִּשְׁמַ֣ע'
  - where: 'note 20:12 “The rest is Isaiah 39”'
    claim: 'Isaiah has wayyiśmaḥ, "and he was glad"; the consonants differ in the last letter'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'וַ/יִּשְׂמַ֣ח'
