chapter: 5
claims:
  - where: when
    claim: 'The king of Israel was Jehoram; the king of Syria probably Ben-hadad II'
    key: hardy-naaman-gehazi-2002
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/08/naaman-and-gehazi-a-contrast-in-obedience?lang=eng'
    quote: 'Thus, when a letter from the king of Syria (probably Ben-hadad II) arrived for Jehoram, king of Israel, there was great concern.'
  - where: setting
    claim: 'Jehoram was Ahab''s son, king of Israel in Samaria'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/3?lang=eng'
    quote: 'Now Jehoram the son of Ahab began to reign over Israel in Samaria the eighteenth year of Jehoshaphat king of Judah, and reigned twelve years.'
  - where: setting
    claim: 'Chapters 2–7 present Elisha''s miracles as a cluster; Naaman''s healing is well known'
    key: barlow-miracles
    url: 'https://mi.byu.edu/old-testament-reflections/what-are-miracles-for'
    quote: 'Some of Elisha’s wonders are well-known among Latter-day Saints because of our attraction to simple lessons learned (the cure of Naaman’s leprosy by washing seven times in the Jordan River; 2 Kings 5:1–14). … As a cluster, the miracles establish Elisha as empowered'
  - where: setting
    claim: 'Syria is the KJV name for Aram, the Arameans, located mostly north of Israel'
    key: scripture-helps-2-kings-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/26-2-kings-2-7?lang=eng'
    quote: 'The King James Version of the Bible uses the Greek word Syrian to refer to the Arameans, or the people of Aram. … The ancient nation of Syria was located mostly north of Israel.'
  - where: setting
    claim: 'Syria rebelled after Solomon''s death; about a century of tense relations, wars and periods of official peace'
    key: hardy-naaman-gehazi-2002
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/08/naaman-and-gehazi-a-contrast-in-obedience?lang=eng'
    quote: 'When his son King Solomon died and Israel was split into two kingdoms, Syria rebelled, thus initiating about 100 years of tense political relations. … there also existed periods of official peace, interspersed with occasional skirmishes.'
  - where: setting
    claim: 'Ben-hadad''s wars with Israel are told in 1 Kings 20 and 22'
    key: ot-minute-2-kings-5
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-5'
    quote: 'Ben-Hadad’s wars with Israel and Judah are described in 1 Kings 20 and 22.'
  - where: setting
    claim: 'The story turns an enemy into a convert and a possible successor into an outcast'
    key: ot-minute-2-kings-5
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-5'
    quote: 'this story takes an enemy of Israel and turns him into a convert and also takes someone who could succeed Elisha as prophet and turns him into an outcast.'
  - where: thread
    claim: 'The foreigners respond to the child''s words with faith; the king of Israel distrusts'
    key: sc-knowhy-859
    url: 'https://scripturecentral.org/knowhy/why-are-the-words-of-a-child-considered-important-in-the-story-of-naaman'
    quote: 'In contrast to all these foreigners who are responding to the words of the child with faith, the narrative portrays the king of Israel as distraught and distrusting.'
  - where: thread
    claim: 'Naaman humbles himself, listens to his servants, and his flesh becomes like a little child''s'
    key: sc-knowhy-859
    url: 'https://scripturecentral.org/knowhy/why-are-the-words-of-a-child-considered-important-in-the-story-of-naaman'
    quote: 'However, at this point, Naaman humbles himself and listens to his servants.'
  - where: thread
    claim: 'Naaman''s confession joins the little maid''s testimony'
    key: hardy-naaman-gehazi-2002
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/08/naaman-and-gehazi-a-contrast-in-obedience?lang=eng'
    quote: 'Naaman joined his testimony with that of the little Israelite maid: “Behold, now I know that there is no God in all the earth, but in Israel”'
  - where: thread
    claim: 'Gehazi had witnessed Elisha''s power'
    key: hardy-naaman-gehazi-2002
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/08/naaman-and-gehazi-a-contrast-in-obedience?lang=eng'
    quote: 'Gehazi knew Elisha was a prophet of the one true God. He had personally witnessed God’s power'
  - where: thread
    claim: 'Enemy turned convert, possible successor turned outcast'
    key: ot-minute-2-kings-5
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-5'
    quote: 'this story takes an enemy of Israel and turns him into a convert and also takes someone who could succeed Elisha as prophet and turns him into an outcast.'
  - where: thread
    claim: 'The leprosy taken from Naaman for faith passes to Gehazi'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/5.htm'
    quote: 'It was not too harsh a punishment that the leprosy taken from Naaman on account of his faith in the living God, should pass to Gehazi on account of his departure from the true God.'
  - where: section 1 plain
    claim: '"By companies" means raiding bands'
    key: ot-minute-2-kings-5
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-5'
    quote: '“And the Syrians had gone out by companies” is a literal translation of a Semitic idiom, and it should be interpreted as “and the Syrians went out to raid.”'
  - where: section 1 plain
    claim: '"Deliverance" here is victory'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/5.htm'
    quote: 'because by him the Lord had given deliverance] R.V. victory.'
  - where: section 2 plain
    claim: '"Strike his hand" is better "wave his hand"'
    key: ot-minute-2-kings-5
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-5'
    quote: '“Strike his hand” might be better translated as “wave his hand.”'
  - where: section 3 plain
    claim: '"He leaneth on my hand" denotes the service of the king''s aide'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/5.htm'
    quote: 'The words "and he supports himself upon my hand" are not to be understood literally, but are a general expressly denoting the service which Naaman had to render as the aide-de-camp to his king'

  - where: 'note 5:1 “The LORD gave Syria its victory”'
    claim: 'The writer credits the LORD; Syrians would say otherwise; Jehovah not God of the Jews only; Gentiles in His care'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/5.htm'
    quote: 'That the Lord was the deliverer is the thought of the Jewish writer. The Syrians would have put the case differently. … Jehovah was not regarded by the compiler of this narrative as exclusively the God of the Jews, nor the Gentiles thought to be beyond, or deprived of, His care. He helps them though they know Him not.'
  - where: 'note 5:1 “The LORD gave Syria its victory”'
    claim: 'Perhaps the war against the Assyrians, who invaded Syria about this time'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/5.htm'
    quote: 'About this time the Assyrians invaded Syria and the countries round about, and it is not improbable that this was the war in which Naaman had gained his fame.'

  - where: 'note 5:1 “A great man, but a leper”'
    claim: 'Leprosy covers a variety of chronic skin diseases; Naaman''s condition and severity unknown'
    key: scripture-helps-2-kings-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/26-2-kings-2-7?lang=eng'
    quote: 'The term leprosy can refer to a variety of chronic skin diseases. Naaman’s specific condition and its severity are not known.'
  - where: 'note 5:1 “A great man, but a leper”'
    claim: 'Probably not Hansen''s disease'
    key: ot-minute-2-kings-5
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-5'
    quote: 'Leprosy in the Bible was probably not the same illness that we call Hansen’s disease today, but it was definitely a skin-related illness.'
  - where: 'note 5:1 “A great man, but a leper”'
    claim: 'Leprosy associated with uncleanness, eclipsing Naaman''s greatness'
    key: anderson-naaman-baptism-1994
    url: 'https://www.churchofjesuschrist.org/study/ensign/1994/01/naaman-baptism-and-cleansing?lang=eng'
    quote: 'in the eyes of Israel and most of the ancient world his disease of leprosy was associated with uncleanliness. Thus, Naaman was dying as an unclean man, and that fact completely eclipsed his greatness!'

  - where: 'note 5:3 “A captive girl''s faith”'
    claim: 'A direct quotation from a child is rare in the Old Testament; she was enslaved in war'
    key: sc-knowhy-859
    url: 'https://scripturecentral.org/knowhy/why-are-the-words-of-a-child-considered-important-in-the-story-of-naaman'
    quote: 'contains something that is rare in the Old Testament: a direct quotation from a child. The narrative state that a little Israelite girl, who had been enslaved by the Syrians during war, was a servant to Naaman’s wife.'
  - where: 'note 5:3 “A captive girl''s faith”'
    claim: 'Raid idiom; plunder and slaves; little maid likely an adolescent'
    key: ot-minute-2-kings-5
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-5'
    quote: 'Syrian soldiers would have rushed into an Israelite village, stolen anything of value, and kidnapped anyone who would make a good slave. Naaman’s wife’s servant was called a “little maid” and would likely have been an adolescent.'
  - where: 'note 5:3 “A captive girl''s faith”'
    claim: 'An enslaved girl might be glad; her care suggests good treatment; Naaman and the king act on her words'
    key: sc-knowhy-859
    url: 'https://scripturecentral.org/knowhy/why-are-the-words-of-a-child-considered-important-in-the-story-of-naaman'
    quote: 'One would assume that an enslaved person would not care about their enslavers and might even be happy that they had a condition like leprosy. However, this little Israelite girl appears to care about Naaman, suggesting that Naaman and his household may have treated their servants well'
  - where: 'note 5:3 “A captive girl''s faith”'
    claim: 'Foreigners respond with faith; the king of Israel distraught and distrusting'
    key: sc-knowhy-859
    url: 'https://scripturecentral.org/knowhy/why-are-the-words-of-a-child-considered-important-in-the-story-of-naaman'
    quote: 'In contrast to all these foreigners who are responding to the words of the child with faith, the narrative portrays the king of Israel as distraught and distrusting.'

  - where: 'note 5:7 “Only God can kill and make alive”'
    claim: 'The king''s words mean "am I omnipotent like God?", recalling Deut. 32:39 and 1 Sam. 2:6; the letter was not insolent; the Syrian king thought the prophet at the king''s command'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/5.htm'
    quote: '"Am I God, to be able to kill and make alive?" i.e., am I omnipotent like God? (cf. Deuteronomy 32:39; 1 Samuel 2:6) … were certainly not so insolent in their meaning as Joram supposed, but simply meant: have him cured, as thou hast a wonder-working prophet'
  - where: 'note 5:7 “Only God can kill and make alive”'
    claim: 'The Syrian king imagined Joram could command his prophets; no ground for suspicion'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/5.htm'
    quote: 'the Syrian king imagining, according to his heathen notions of priests and gotes, that Joram could do what he liked with his prophets and their miraculous powers. There was no ground, therefore, for the suspicion which Joram expressed'
  - where: 'note 5:7 “Only God can kill and make alive”'
    claim: 'The king does not trust God or Elisha, sees himself as one who must act as God, does not believe Naaman can be healed'
    key: sc-knowhy-859
    url: 'https://scripturecentral.org/knowhy/why-are-the-words-of-a-child-considered-important-in-the-story-of-naaman'
    quote: 'He does not place his faith in God or in His servant Elisha. Instead, he sees only himself as the one who must act as God and does not believe Naaman can be healed'
  - where: 'note 5:7 “Only God can kill and make alive”'
    claim: 'Elisha reproved the king''s unbelieving alarm'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/5.htm'
    quote: 'When Elisha heard of this, he reproved the king for his unbelieving alarm'

  - where: 'note 5:10 “A messenger, a muddy river, and seven times”'
    claim: 'Naaman expected a direct, immediate cure; was sent a messenger; muddy Jordan; faith and humility'
    key: scripture-helps-2-kings-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/26-2-kings-2-7?lang=eng'
    quote: 'This account highlights the faith and humility required for Naaman … Naaman expected Elisha to heal him directly and immediately rather than sending a messenger to instruct him to wash seven times in the muddy Jordan River.'
  - where: 'note 5:10 “A messenger, a muddy river, and seven times”'
    claim: 'Elisha did not go outside himself; the arrival tests Naaman''s faith'
    key: sc-knowhy-859
    url: 'https://scripturecentral.org/knowhy/why-are-the-words-of-a-child-considered-important-in-the-story-of-naaman'
    quote: 'But whatever his level, it is tested when he arrives at Elisha’s house. Elisha does not even deign to go outside himself to speak to Naaman'
  - where: 'note 5:10 “A messenger, a muddy river, and seven times”'
    claim: '"Strike his hand" better "wave his hand"'
    key: ot-minute-2-kings-5
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-5'
    quote: '“Strike his hand” might be better translated as “wave his hand.”'
  - where: 'note 5:10 “A messenger, a muddy river, and seven times”'
    claim: 'The Jordan low, fed by Galilee; Naaman''s low opinion justified; Abana and Pharpar probably the Barada, splitting at Damascus'
    key: ot-minute-2-kings-5
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-5'
    quote: 'Because of the low elevation of the Jordan River and because it is fed by the Sea of Galilee instead of by springs or mountain run-off, Naaman’s low opinion of the Jordan is justified. … The Abana and Pharpar rivers are probably the modern Barada River … the river splitting near Damascus'
  - where: 'note 5:10 “A messenger, a muddy river, and seven times”'
    claim: 'Seven times read as a reference to the seven-day quarantine, of which Naaman was oblivious'
    key: anderson-naaman-baptism-1994
    url: 'https://www.churchofjesuschrist.org/study/ensign/1994/01/naaman-baptism-and-cleansing?lang=eng'
    quote: 'The act that would bring about Naaman’s cleansing—immersing himself in the Jordan River seven times—was so undramatic that Naaman, oblivious to the symbolic reference to the seven-day quarantine required of a leper in Israel'
  - where: 'note 5:10 “A messenger, a muddy river, and seven times”'
    claim: 'Leviticus 13: quarantine seven days and reexamination'
    key: anderson-naaman-baptism-1994
    url: 'https://www.churchofjesuschrist.org/study/ensign/1994/01/naaman-baptism-and-cleansing?lang=eng'
    quote: 'We read in Leviticus 13, for example, that the priest was to quarantine a suspected leper for seven days and then reexamine him'

  - where: 'note 5:13 “Some great thing”'
    claim: 'Faust: "some great thing" was simple and easy'
    key: faust-some-great-thing-2001
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2001/10/some-great-thing?lang=eng'
    quote: '“Some great thing” in this instance was extraordinarily simple and easy to do.'
  - where: 'note 5:13 “Some great thing”'
    claim: 'Servants of low social status guided Naaman to Elisha and encouraged him to obey'
    key: scripture-helps-2-kings-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/26-2-kings-2-7?lang=eng'
    quote: 'servants of low social status helped guide Naaman to Elisha and encouraged him to follow the prophet’s counsel.'
  - where: 'note 5:13 “Some great thing”'
    claim: 'Elisha asked Naaman to humble himself and do strictly as commanded; the Lord''s commands simple, D&C 89:3'
    key: hardy-naaman-gehazi-2002
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/08/naaman-and-gehazi-a-contrast-in-obedience?lang=eng'
    quote: 'Elisha did not ask Naaman to do “some great thing.” What was required? To humble himself and do strictly as he had been commanded. … The Lord’s commands are clear, uncomplicated, and in many instances “adapted to the capacity of the weak and the weakest of all saints” (D&C 89:3).'

  - where: 'note 5:14 “Cleansed on the Lord''s terms”'
    claim: 'Naaman as example of baptism done as God asks; a Syrian river would not have healed; priesthood authority'
    key: keller-fall-atonement
    url: 'https://rsc.byu.edu/vol-5-no-2-2004/teaching-fall-atonement-comparative-method'
    quote: 'Had he not followed the directions of God through the prophet Elisha, he would have retained the leprosy. Had he washed in a Syrian river, he would not have been healed. He had to do what God asked of him. … being baptized under the hands of a person holding the priesthood of God'
  - where: 'note 5:14 “Cleansed on the Lord''s terms”'
    claim: 'Naaman healed by the power of God, not the water; same of baptism'
    key: anderson-naaman-baptism-1994
    url: 'https://www.churchofjesuschrist.org/study/ensign/1994/01/naaman-baptism-and-cleansing?lang=eng'
    quote: 'Naaman saw nothing inherently special in Israelite water or in the act of immersion. He was right. Naaman was healed not by the water or by immersion, but by the power of God. … Even so, the power behind the act and the symbolism is the power of God.'
  - where: 'note 5:14 “Cleansed on the Lord''s terms”'
    claim: 'Naaman''s story as a type of the cleansing of repentance and baptism; burial and rebirth with Christ'
    key: anderson-naaman-baptism-1994
    url: 'https://www.churchofjesuschrist.org/study/ensign/1994/01/naaman-baptism-and-cleansing?lang=eng'
    quote: 'The story of Naaman the leper stands as a type and shadow of the cleansing power of repentance and baptism. … Baptism by immersion suggests a burial and resurrection with Christ, a death to the life of sin and a rebirth'

  - where: 'note 5:14 “A little girl and a little boy”'
    claim: 'The little maid is naʿărâ qᵉṭannâ (verse 2)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'נַעֲרָ֣ה קְטַנָּ֑ה'
  - where: 'note 5:14 “A little girl and a little boy”'
    claim: 'The little child is naʿar qāṭōn (verse 14)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'נַ֥עַר קָטֹ֖ן'
  - where: 'note 5:14 “A little girl and a little boy”'
    claim: 'The simile anchors the story: female child at the start, male child at the end'
    key: sc-knowhy-859
    url: 'https://scripturecentral.org/knowhy/why-are-the-words-of-a-child-considered-important-in-the-story-of-naaman'
    quote: 'The narrative begins with the lowest imaginable status in the ancient Near Eastern hierarchy—a foreign, captive, “female child” (na''arah qetannah)—and concludes with the mighty Aramean military commander physically reduced/restored to the state of a male child (na''ar qaton).'
  - where: 'note 5:14 “A little girl and a little boy”'
    claim: 'Not only healed but transformed; listened to a captive child, submitted to a foreign prophet, washed in the land''s waters'
    key: sc-knowhy-859
    url: 'https://scripturecentral.org/knowhy/why-are-the-words-of-a-child-considered-important-in-the-story-of-naaman'
    quote: 'the text signals that Naaman hasn''t just experienced a physical healing; he has undergone a transformation. To be cured, the "great man" had to listen to a captive child, submit to the instructions of a foreign prophet'
  - where: 'note 5:14 “A little girl and a little boy”'
    claim: 'Humbled like a child, his flesh becomes like a child''s; Mosiah 3:19'
    key: sc-knowhy-859
    url: 'https://scripturecentral.org/knowhy/why-are-the-words-of-a-child-considered-important-in-the-story-of-naaman'
    quote: 'When Naaman humbles himself like a little child, his flesh becomes like the flesh of a little child.'

  - where: 'note 5:15 “Naaman''s confession and Jesus'' use of it”'
    claim: 'Naaman returned to Samaria, 30 miles, to thank Elisha'
    key: bd-naaman
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/naaman?lang=eng'
    quote: 'He showed his gratitude by returning to Samaria, a distance of 30 miles, to thank Elisha.'
  - where: 'note 5:15 “Naaman''s confession and Jesus'' use of it”'
    claim: 'Naaman joined his testimony with the maid''s'
    key: hardy-naaman-gehazi-2002
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/08/naaman-and-gehazi-a-contrast-in-obedience?lang=eng'
    quote: 'Naaman joined his testimony with that of the little Israelite maid'
  - where: 'note 5:15 “Naaman''s confession and Jesus'' use of it”'
    claim: 'The Savior used Naaman to rebuke His people''s unbelief in Him'
    key: scripture-helps-2-kings-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/26-2-kings-2-7?lang=eng'
    quote: 'The Savior later used Naaman’s example to rebuke His own people for their lack of belief in Him.'
  - where: 'note 5:15 “Naaman''s confession and Jesus'' use of it”'
    claim: 'Luke 4:27, in the synagogue at Nazareth; the hearers try to cast Him down'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/4?lang=eng'
    quote: 'And many lepers were in Israel in the time of Eliseus the prophet; and none of them was cleansed, saving Naaman the Syrian.'

  - where: 'note 5:16 “Why Elisha took nothing”'
    claim: 'Elisha refused gifts for the use of God''s power; priestcraft (2 Ne. 26:29–31); Matt. 10:8; Gehazi did not refuse'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'Elisha refused the gifts Naaman offered for his use of God’s power, but Gehazi did not. The temptation to use priesthood power for personal gain has plagued man throughout history … Nephi called such employment priestcraft and said it is forbidden by the Lord (see 2 Nephi 26:29–31).'
  - where: 'note 5:16 “Why Elisha took nothing”'
    claim: 'Matthew 10:8, the charge to the Twelve'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/10?lang=eng'
    quote: 'Heal the sick, cleanse the lepers, raise the dead, cast out devils: freely ye have received, freely give.'

  - where: 'note 5:16 “Why Elisha took nothing”'
    claim: 'On Keil''s reading Elisha refused to avoid any appearance of the selfishness of the false prophets'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/5.htm'
    quote: 'which the prophet, however, stedfastly refused, notwithstanding all his urging, that he might avoid all appearance of selfishness, by which the false prophets were actuated.'
  - where: 'note 5:17 “Two mules'' burden of earth”'
    claim: 'A god worshipped properly only in his own lands; Naaman wanted Israelite soil to worship Jehovah at home'
    key: scripture-helps-2-kings-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/26-2-kings-2-7?lang=eng'
    quote: 'A common belief in many ancient cultures was that a god could be worshipped properly only within his own lands. Naaman wanted to bring Israelite soil into his homeland so he could feel justified in worshipping Jehovah there.'
  - where: 'note 5:17 “Two mules'' burden of earth”'
    claim: 'Religion rooted in places, strong in the ancient Mediterranean; Naaman did not think Jehovah could be worshipped elsewhere'
    key: shannon-location
    url: 'https://rsc.byu.edu/jacob/location-location-location'
    quote: 'Smith specifically highlights the ancient Mediterranean as one place where a locative perspective was the norm … Naaman feels the need to bring back dirt from the land of Israel, because he does not believe it is otherwise possible to worship Jehovah in another place.'
  - where: 'note 5:17 “Two mules'' burden of earth”'
    claim: 'He intended to build an altar to Jehovah on the earth'
    key: bd-naaman
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/naaman?lang=eng'
    quote: 'Naaman took with him to Syria two mules’ burden of earth (2 Kgs. 5:17), on which he intended to erect an altar to Jehovah. He did this because he believed that the God of Israel could only be worshipped on Israelite soil.'
  - where: 'note 5:17 “Two mules'' burden of earth”'
    claim: 'Alma corrected the Zoramites: God can be worshipped from any location'
    key: scripture-helps-2-kings-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/26-2-kings-2-7?lang=eng'
    quote: 'Naaman’s misunderstanding is similar to the Zoramites’ misunderstanding in the Book of Mormon. They felt God could be worshipped only on a holy stand in their synagogue. Alma corrected this misunderstanding by teaching that God could be worshipped from any location'

