chapter: 19
claims:
  - where: setting
    claim: 'Sennacherib invaded Judah in 701 BC, destroyed fortified cities, but did not take Jerusalem'
    key: sc-knowhy-451
    url: 'https://scripturecentral.org/knowhy/why-did-some-in-lehis-time-believe-that-jerusalem-could-not-be-destroyed'
    quote: 'he invaded the southern kingdom of Judah in 701. Although he destroyed several well-fortified cities and carried away thousands of people, he was not successful in conquering Jerusalem.'
  - where: setting
    claim: 'Hezekiah''s reign coincided with Isaiah''s ministry'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'King Hezekiah’s reign coincided with the ministry of the prophet Isaiah.'
  - where: setting
    claim: 'Chapter 19 runs with Isaiah 37 (footnote 6a); Chronicles tells it briefly (2 Chr. 32:20–21)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/19?lang=eng'
    quote: '6a “Isaiah”: Isa. 37:6 (1–38).'
  - where: setting
    claim: 'Sennacherib took the fortified cities of Judah; Hezekiah paid tribute, and the king still sent the Rabshakeh against Jerusalem (18:13–17)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/18?lang=eng'
    quote: 'Sennacherib king of Assyria come up against all the fenced cities of Judah, and took them.'
  - where: thread
    claim: 'Hezekiah and his people showed faith, and the Lord saved Jerusalem miraculously'
    key: cfm-ot-2026-29
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/29?lang=eng'
    quote: 'But Hezekiah and his people showed faith in the Lord, who saved Jerusalem in a miraculous way.'
  - where: thread
    claim: 'Verse 37 fulfils the prophecy of Sennacherib''s death in verse 7'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/19.htm'
    quote: 'For the fulfilment of the prophecy of Sennacherib''s death, see 2 Kings 19:37.'
  - where: note 19:2 “Isaiah enters the history”
    claim: 'Hezekiah sent messengers to seek Isaiah''s counsel and ask him to pray; Isaiah''s reassurance echoed Isaiah 10'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'He also sent messengers to seek Isaiah’s counsel and to ask him to pray for the people. Isaiah reassured Hezekiah’s messengers that the Lord would protect Jerusalem against the mighty Assyrian army, echoing his prophecy recorded in Isaiah 10.'
  - where: note 19:2 “Isaiah enters the history”
    claim: 'Scripture Helps compares 19:6–7 with Isaiah 10:28–34'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: '21. Compare 2 Kings 19:6–7 with Isaiah 10:28–34.'
  - where: note 19:2 “Isaiah enters the history”
    claim: 'Chronicles says Hezekiah and Isaiah prayed together, and that Hezekiah''s acts were written in the vision of Isaiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/32?lang=eng'
    quote: 'And for this cause Hezekiah the king, and the prophet Isaiah the son of Amoz, prayed and cried to heaven.'
  - where: note 19:2 “Isaiah enters the history”
    claim: 'Isaiah is first named in 2 Kings at 19:2 (the text of 2 Kings searched for the name: first at 19:2, 5, 6)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/19?lang=eng'
    quote: 'And he sent Eliakim, which was over the household, and Shebna the scribe, and the elders of the priests, covered with sackcloth, to Isaiah the prophet the son of Amoz.'
  - where: note 19:20 ““I have heard””
    claim: 'Kings has “I have heard,” which Isaiah omits; it clarifies the sense; the answer has three parts'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/19.htm'
    quote: 'שׁמעתּי (2 Kings 19:21) is omitted in Isaiah, so that וגו התפּלּלתּ אשׁר is to be taken in the sense of "with regard to that which thou hast prayed to me," whilst שׁמעתּי (I have heard) elucidates the thought'
  - where: note 19:20 ““I have heard””
    claim: 'The answer announces the retreat, then confirms it by a sign and by the promise that the Assyrian would not enter or besiege the city'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/19.htm'
    quote: '(1) the shameful retreat of Sennacherib as a just retribution for his mockery of the living God … (2) the confirmation of this assurance through the indication of a sign … and through the distinct promise, that the Assyrian would neither come into the city nor besiege it'
  - where: note 19:20 ““I have heard””
    claim: 'Keil: Tirhakah''s approach was providence already at work; at the prayer the Lord added the miracle'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/19.htm'
    quote: 'But at the prayer of the king the Lord added this miracle to the other, which His providence had already brought to pass.'
  - where: note 19:20 ““I have heard””
    claim: 'Isaiah sent word that the Lord had heard the king''s prayers'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'Isaiah later sent word to Hezekiah that the Lord had heard the king’s prayers and further reassured him that the Lord would defend Jerusalem against the Assyrian army.'
  - where: note 19:34 “A promise kept, and later misread”
    claim: 'The 701 promise and deliverance was one reason many believed Jerusalem could not be conquered a century later'
    key: sc-knowhy-451
    url: 'https://scripturecentral.org/knowhy/why-did-some-in-lehis-time-believe-that-jerusalem-could-not-be-destroyed'
    quote: 'For this, and several other possible reasons, when the Babylonian armies laid siege to Jerusalem about a hundred years later, there were many in the city who firmly believed it could not be conquered.'
  - where: note 19:34 “A promise kept, and later misread”
    claim: 'The promises of protection were conditional on obedience'
    key: sc-knowhy-451
    url: 'https://scripturecentral.org/knowhy/why-did-some-in-lehis-time-believe-that-jerusalem-could-not-be-destroyed'
    quote: 'But the Lord had made it clear, through his prophets, that these promises of protection were conditional, depending on the people’s obedience to God’s commandments (1 Kings 6:12–13; 9:6–7).'
  - where: note 19:34 “A promise kept, and later misread”
    claim: 'The text of 19:34: “for my servant David''s sake”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/19?lang=eng'
    quote: 'For I will defend this city, to save it, for mine own sake, and for my servant David’s sake.'
  - where: note 19:35 “That night”
    claim: 'Kings has “that night” where Isaiah 37:36 has “Then”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/37?lang=eng'
    quote: 'Then the angel of the LORD went forth, and smote in the camp of the Assyrians a hundred and fourscore and five thousand'
  - where: note 19:35 “That night”
    claim: 'Isaiah''s promise was fulfilled when a plague struck the camp'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'Isaiah’s promise was fulfilled when a plague struck the Assyrian camp, and Judah was spared.'
  - where: note 19:35 “That night”
    claim: 'JST of Isa. 37:36: survivors awoke to find the corpses; the number may have been exaggerated (relaying the New Oxford Annotated Bible)'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'The Joseph Smith Translation of Isaiah 37:36 clarifies that some survivors awoke in the morning to find the dead corpses … It has been suggested that the number of 185,000 Assyrian casualties could have been exaggerated to emphasize the Lord’s power'
  - where: note 19:35 “That night”
    claim: 'The manuscript''s reading at Isaiah 37:36: “who were left”'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/114'
    quote: '36 who were left'
  - where: note 19:35 “That night”
    claim: 'Other sources suggest the Lord may have sent a plague upon the Assyrian army'
    key: sc-knowhy-648
    url: 'https://scripturecentral.org/knowhy/why-did-isaiah-prophesy-of-a-suffering-messiah'
    quote: 'Other biblical and historical sources suggest that the Lord may have sent a plague upon the Assyrian army.'
  - where: note 19:35 “That night”
    claim: 'Chronicles: the angel cut off the mighty men and leaders; Sennacherib returned with shame'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/32?lang=eng'
    quote: 'And the Lord sent an angel, which cut off all the mighty men of valour, and the leaders and captains in the camp of the king of Assyria. So he returned with shame of face to his own land.'
  - where: christ
    claim: 'Hezekiah as a type and shadow of Jesus Christ, the great high priest (Heb. 4:14)'
    key: sc-knowhy-648
    url: 'https://scripturecentral.org/knowhy/why-did-isaiah-prophesy-of-a-suffering-messiah'
    quote: 'King Hezekiah was merely a type and a shadow of Jesus Christ—the true Messiah and great high priest who was to come (see Hebrews 4:14).'
  - where: christ
    claim: 'Hezekiah''s actions (19:1–7, 14–19) as a pattern for faith that is challenged'
    key: cfm-ot-2026-29
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/29?lang=eng'
    quote: 'Most of us have experiences that challenge our faith. For Hezekiah and his people, one of those challenges came when the Assyrian army approached Jerusalem.'
  - where: christ
    claim: 'The Creator of verse 15 is Jesus Christ (footnote 15c, TG Jesus Christ, Creator)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/19?lang=eng'
    quote: '15c “made”: TG Jesus Christ, Creator.'
  - where: christ
    claim: 'Hezekiah offered an intercessory prayer on behalf of the people'
    key: sc-knowhy-648
    url: 'https://scripturecentral.org/knowhy/why-did-isaiah-prophesy-of-a-suffering-messiah'
    quote: 'Hezekiah went before the Lord at the temple and offered an intercessory prayer on behalf of the people (2 Kings 19:14–19; Isaiah 37:14–20).'
  - where: note 19:20 ““I have heard””
    claim: 'Keil (relaying Gerlach): the army''s destruction would hardly have been decisive without Tirhakah''s approach'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/19.htm'
    quote: '"the destruction of the army would hardly have produced any decisive effect without the approach of Tirhakah, since the great power of the Assyrian king, especially in relation to the small kingdom of Judah, was not broken thereby.'
