chapter: 17
claims:
  - where: when
    claim: 'Hoshea began to reign in the twelfth year of Ahaz; Samaria fell in his ninth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/17?lang=eng'
    quote: 'In the ninth year of Hoshea the king of Assyria took Samaria, and carried Israel away into Assyria'
  - where: setting
    claim: 'Nothing is recorded of Hoshea that shows how he was better than the kings before him'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/17.htm'
    quote: 'We have no record of the doings of Hoshea, so as to specify in what points he was better than his predecessors.'
  - where: setting
    claim: 'The chapter has no parallel in Chronicles'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/17.htm'
    quote: 'Reign of Hoshea king of Israel. Shalmaneser invades Israel, imprisons Hoshea and carries the people captive (Not in Chronicles)'
  - where: setting
    claim: 'In 734 Tiglath-pileser destroyed Damascus and depopulated Gilead and Naphtali, and Judah accepted Assyrian suzerainty; Shalmaneser V reigned 727–722; Sargon concluded the siege'
    key: bd-assyria
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/assyria-and-babylonia?lang=eng'
    quote: 'in 734 these powers revolted and the result of a fresh war was the destruction of Damascus, the depopulation of Gilead and Naphtali (2 Kgs. 15:29), and the acceptance of Assyrian suzerainty by Judah.'
  - where: setting
    claim: 'Shalmaneser, 727–722 B.C., put Hoshea under tribute and besieged Samaria'
    key: bd-shalmaneser
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shalmaneser?lang=eng'
    quote: 'King of Assyria, 727–722 B.C., puts Hoshea under tribute (2 Kgs. 17:3); besieges Samaria, which is taken after three years'
  - where: setting
    claim: 'The date of Samaria''s fall is thought to be 721 B.C., possibly 722'
    key: ot-manual-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-12?lang=eng'
    quote: 'The date is thought to be 721 B.C., but it may have been 722.'
  - where: setting
    claim: 'Hosea and Micah foretold the destruction of Samaria'
    key: ot-manual-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-12?lang=eng'
    quote: 'The destruction of Samaria, the capital of the Northern Kingdom, was foretold by Hosea and Micah (see Hosea 13:16; Micah 1:6)'
  - where: thread
    claim: 'The same Hebrew verb, “fear,” stands in verses 7, 25, 28, 32–39 and 41'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'יְרֵאִים֙'
  - where: thread
    claim: 'Verses 7–23 give two reasons, other gods and the customs of the nations, and lay the blame finally on the kings, above all Jeroboam'
    key: halverson-fall-of-israel
    url: 'https://interpreterfoundation.org/journal/why-did-northern-israel-fall-to-the-assyrians-a-weberian-proposal'
    quote: 'This passage includes two major themes of why Israel provoked God’s anger: (1) they worshipped other gods, and (2) they walked in customs of other nations.'
  - where: 'note 17:4 “Tribute withheld, and an appeal to Egypt”'
    claim: 'Suzerain-vassal relations were typical when empires conquered smaller states, as with Israel (2 Kgs. 17:3); they usually involved tribute'
    key: sc-knowhy-128
    url: 'https://scripturecentral.org/knowhy/what-did-it-mean-to-be-king-over-all-the-land'
    quote: 'In the ancient Near East, this patron-client or suzerain-vassal relationship was typical when larger empires conquered smaller states, as happened to Israel and Judah (2 Kings 17:3; Lamentations 1:1 NRSV).'
  - where: 'note 17:4 “Tribute withheld, and an appeal to Egypt”'
    claim: 'Failure to pay yearly tribute was regarded as a direct challenge to the overlord, as with Israel''s own vassals under David and Solomon'
    key: sc-knowhy-128
    url: 'https://scripturecentral.org/knowhy/what-did-it-mean-to-be-king-over-all-the-land'
    quote: 'The relationship usually involved tribute payments to the suzerain. During the reigns of David and Solomon, for instance, Israel had vassals which “were expected to pay tribute to the Israelite king” and “even the simple failure to pay the yearly tribute, would be regarded … [as] a direct challenge'
  - where: 'note 17:4 “Tribute withheld, and an appeal to Egypt”'
    claim: 'So, or Sebech, an Ethiopian, had made himself lord of Egypt and stirred a revolt involving Syria, Philistia and Samaria'
    key: bd-assyria
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/assyria-and-babylonia?lang=eng'
    quote: 'the Ethiopian So or Sebech (2 Kgs. 17:4) had made himself lord of all Egypt and had begun to foment a revolt in which Syria was involved, together with Philistia and Samaria'
  - where: 'note 17:6 “Who took Samaria, and where Israel went”'
    claim: 'Shalmaneser began the siege; Sargon (722–705) concluded it'
    key: bd-assyria
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/assyria-and-babylonia?lang=eng'
    quote: 'The siege of Samaria, begun by Shalmaneser (2 Kgs. 17:3–6), was concluded by Sargon (722–705)'
  - where: 'note 17:6 “Who took Samaria, and where Israel went”'
    claim: 'The seminary manual names Sargon as the king who carried the ten tribes captive'
    key: ot-seminary-2-kings-intro
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-2-kings?lang=eng'
    quote: 'The idolatrous ten tribes of Israel are carried into captivity by King Sargon of Assyria.'
  - where: 'note 17:6 “Who took Samaria, and where Israel went”'
    claim: 'Tiglath-pileser carried off the trans-Jordan tribes and Galilee in 740; Sargon II took the rest of Israel and placed them at Halah, Habor'
    key: bd-captivities
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng'
    quote: 'In 740 B.C. Tiglath-pileser carried away the trans-Jordanic tribes and the inhabitants of Galilee (2 Kgs. 15:29; 1 Chr. 5:26) to Assyria; in 721 B.C. Sargon Ⅱ carried into captivity the rest of Israel (2 Kgs. 17:3), placing them at Halah, Habor, etc.'
  - where: 'note 17:6 “Who took Samaria, and where Israel went”'
    claim: 'Assyrian inscriptions illuminate the deportations to places in what is now Iraq and Iran'
    key: chadwick-review-ten-tribes
    url: 'https://byustudies.byu.edu/article/the-ten-lost-tribes-a-world-history'
    quote: 'Assyrian inscriptions bearing deportation counts, mostly fragmentary, but in one case quite complete, illuminate biblical references to those of Israel who were “carried away” to diverse locations in what is now Iraq and Iran.'
  - where: 'note 17:7 “Why Israel fell, in the writer''s words”'
    claim: '2 Kgs. 17:7–23 is a famous passage that shaped later understanding of why Israel fell; it blames the kings, specifically Jeroboam'
    key: halverson-fall-of-israel
    url: 'https://interpreterfoundation.org/journal/why-did-northern-israel-fall-to-the-assyrians-a-weberian-proposal'
    quote: 'In what is a famous passage for shaping generations of interpretation as to why ancient Israel collapsed, we find in 2 Kings 17:7–23 the stinging Deuteronomistic judgment against Israel for infidelity.'
  - where: 'note 17:7 “Why Israel fell, in the writer''s words”'
    claim: 'The Northern Kingdom disobeyed, embraced idolatry and rejected the prophets, and so lost the Lord''s protection'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'Because the people of the Northern Kingdom disobeyed the Lord’s laws, embraced idolatry, and rejected the prophets, they lost the Lord’s protection and were eventually conquered by the Assyrians.'
  - where: 'note 17:9 “From the tower of the watchmen to the fenced city”'
    claim: 'Towers guarded vineyards; the phrase means from thinly to heavily populated areas, all Israel'
    key: ot-manual-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-12?lang=eng'
    quote: 'The expression “from the tower of the watchmen to the fenced city” simply means from thinly populated areas to heavily populated areas. It is another way of saying that all Israel, the Northern Kingdom, had turned to the worship of idols.'
  - where: 'note 17:9 “From the tower of the watchmen to the fenced city”'
    claim: 'Watchtowers stood in the loneliest places, fenced cities were populous; the phrase recurs at 18:8'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/17.htm'
    quote: 'The towers, in which watchmen were stationed to keep guard over the flocks and crops, were always in the most lonely and deserted spots, while fenced cities implied the presence of many inhabitants.'
  - where: 'note 17:9 “From the tower of the watchmen to the fenced city”'
    claim: 'The verb rendered “did secretly” occurs only here; the Septuagint and others take it as “decked out” their worship'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/17.htm'
    quote: 'The verb here used occurs nowhere else in the Bible, though one apparently cognate, and differing only by a single letter, is found several times.'
  - where: 'note 17:9 “From the tower of the watchmen to the fenced city”'
    claim: 'Others, with the Septuagint, read “decked out” their worship with things alien to the law'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/17.htm'
    quote: 'Others, with the LXX. (ἠμφιέσαντο), think that the meaning probably is ‘they decked out’ their worship, employed things alien to the simplicity of the Mosaic ordinances'
  - where: 'note 17:13 “Prophets and seers”'
    claim: 'A prophet is a spokesperson for God; a seer uses means to reveal hidden things; the Book of Mormon calls a seer greater'
    key: sc-knowhy-86
    url: 'https://scripturecentral.org/knowhy/why-is-a-seer-greater-than-a-prophet'
    quote: 'A prophet is a spokesperson for God, whereas a seer is one who uses "means" (divine instruments) to reveal mysteries and secrets.'
  - where: 'note 17:13 “Prophets and seers”'
    claim: 'Seers are mentioned in the Bible as present in Israel''s society, 2 Kgs. 17:13 among the passages'
    key: sc-knowhy-86
    url: 'https://scripturecentral.org/knowhy/why-is-a-seer-greater-than-a-prophet'
    quote: 'Indeed, seers are mentioned in the biblical record as having had a presence in Israel’s society (1 Samuel 9:9, 11, 19; 2 Samuel 15:27; 24:11; 2 Kings 17:13; Micah 3:7; Amos 7:12; Isaiah 30:10)'
  - where: 'note 17:15 “Followed vanity, and became vain”'
    claim: 'Hebel is vapour, breath; figuratively vanity, of idols; 2 Kgs. 17:15 and Jer. 2:5 have the phrase “went after vanity”'
    key: bdb
    url: 'https://biblehub.com/hebrew/1892.htm'
    quote: 'figurative of what is evanescent, unsubstantial, worthless, vanity, as of idols'
  - where: 'note 17:15 “Followed vanity, and became vain”'
    claim: 'The verb habal: Jer. 2:5 = 2 Kgs. 17:15, they went after vanity and became vain'
    key: bdb
    url: 'https://biblehub.com/hebrew/1891.htm'
    quote: 'Qal Jeremiah 2:5 = 2 Kings 17:15 they went after vanity וַיֶּהְבָּ֑לוּ and became vain'
  - where: 'note 17:18 “None left but the tribe of Judah”'
    claim: '“Judah” here includes Benjamin, Levi and northern Israelites who had joined Judah; the ten tribes are listed; the division was not clean'
    key: ot-manual-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-12?lang=eng'
    quote: 'at this time Benjamin, Levi, and all other Israelites who had left the nation of Israel and joined Judah were included under the title of Judah.'
  - where: 'note 17:18 “None left but the tribe of Judah”'
    claim: 'The ten tribes carried away; some Levites were with Israel, some Ephraim and Manasseh with Judah'
    key: ot-manual-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-12?lang=eng'
    quote: 'Some of the tribe of Levi were still with Israel (the ten tribes), however, and some of Ephraim, Manasseh, and other tribes were with Judah. So, the division is not as clear as a superficial reading might indicate.'
  - where: 'note 17:18 “None left but the tribe of Judah”'
    claim: 'By the tribe of Judah is meant the kingdom'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/17.htm'
    quote: 'By the ‘tribe of Judah’ is meant the kingdom.'
  - where: 'note 17:18 “None left but the tribe of Judah”'
    claim: 'Some survivors migrated to the Southern Kingdom and joined the Israelites in Judah'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'Some of these survivors migrated to the Southern Kingdom and joined the population of other Israelites residing in Judah.'
  - where: 'note 17:18 “None left but the tribe of Judah”'
    claim: 'Judah too will be removed as Israel was (2 Kgs. 23:27, where footnote 18a points)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/17?lang=eng'
    quote: '18a “removed”: 2 Kgs. 23:27; 2 Ne. 16:12.'
  - where: 'note 17:23 “Removed out of his sight, but not lost to the Father”'
    claim: 'Many were killed; some went to Judah; some remained and mixed with the settlers (the Samaritans); others were exiled in large numbers and became lost to history, the lost tribes, part of the scattering'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'Still other survivors were taken into exile in Assyria in large numbers, and they eventually became lost to history. This group is often referred to as the lost tribes of Israel, and their scattering is part of what the scriptures call the scattering of Israel.'
  - where: 'note 17:23 “Removed out of his sight, but not lost to the Father”'
    claim: 'Much is unknown of their fate; the Savior said they are not lost to the Father; the restoration of the Ten Tribes is part of the gathering'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'There is much we do not know about the fate of the lost tribes of Israel.'
  - where: 'note 17:23 “Removed out of his sight, but not lost to the Father”'
    claim: 'The deportees assimilated; intermarriage began at once; within four or five generations none remembered their heritage; lost because they forgot who they were'
    key: chadwick-review-ten-tribes
    url: 'https://byustudies.byu.edu/article/the-ten-lost-tribes-a-world-history'
    quote: 'Intermarriage with non-Israelite locals began almost immediately. Within four or five generations, none of their descendants even retained a memory of their Israelite heritage. Lost Israel became lost not because they did not know where they were, but because they forgot who they were.'
  - where: 'note 17:23 “Removed out of his sight, but not lost to the Father”'
    claim: 'The lost tribes have not returned; prophecies speak of their return when ready to obey the gospel'
    key: bd-israel-kingdom
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/israel-kingdom-of?lang=eng'
    quote: 'Since their captivity they have never yet returned to their homeland, but extensive promises and prophecies speak of the time when they of the “north countries” shall return when they are ready to obey the gospel.'
  - where: 'note 17:23 “Removed out of his sight, but not lost to the Father”'
    claim: 'Moses gave the keys of the leading of the ten tribes from the land of the north (D&C 110:11)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/110?lang=eng'
    quote: 'committed unto us the keys of the gathering of Israel from the four parts of the earth, and the leading of the ten tribes from the land of the north.'
  - where: 'note 17:23 “Removed out of his sight, but not lost to the Father”'
    claim: 'The Savior: the lost tribes are not lost unto the Father (3 Ne. 17:4)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/17?lang=eng'
    quote: 'for they are not lost unto the Father, for he knoweth whither he hath taken them.'
  - where: 'note 17:28 “A priest sent back to Bethel”'
    claim: 'The king of Assyria brought back an exiled Israelite priest to teach the settlers the ways of the Lord'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'The Assyrians believed these attacks occurred because the newcomers did not worship Jehovah. In response, the king of Assyria brought back an exiled Israelite priest to live among the people and teach them the ways of the Lord.'
  - where: 'note 17:26 “The manner of the God of the land”'
    claim: 'In the ancient world religion and deities were rooted in places (“locative”); Naaman''s earth is an example'
    key: shannon-location
    url: 'https://rsc.byu.edu/jacob/location-location-location'
    quote: 'The theological difficulties that Ezekiel and Jacob seem to be facing are based in a religious concept that religion and deities were rooted in specific places.'
  - where: 'note 17:26 “The manner of the God of the land”'
    claim: 'Naaman did not believe it possible to worship Jehovah in another place without the land''s earth'
    key: shannon-location
    url: 'https://rsc.byu.edu/jacob/location-location-location'
    quote: 'Naaman feels the need to bring back dirt from the land of Israel, because he does not believe it is otherwise possible to worship Jehovah in another place.'
  - where: 'note 17:28 “A priest sent back to Bethel”'
    claim: 'The priest was a priest of the calves, settled at Bethel, the chief seat of Jeroboam''s image-worship, and taught the colonists to worship Jehovah after the manner of the land'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/17.htm'
    quote: 'The priest sent by the Assyrian king was of course an Israelitish priest of the calves, for he was one of those who had been carried away and settled in Bethel, the chief seat of Jeroboam''s image-worship'
  - where: 'note 17:28 “A priest sent back to Bethel”'
    claim: 'This explains the worship described in verse 29'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/17.htm'
    quote: 'This explains the state of divine worship in the land as described in 2 Kings 17:29.'
  - where: 'note 17:28 “A priest sent back to Bethel”'
    claim: 'The calf worship would be what he taught; the worship of the ten tribes was professedly of Jehovah but contrary to His commandment'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/17.htm'
    quote: 'For the worship of the ten tribes was professedly a worship of Jehovah, though performed in a manner contradictory to His express commandment.'
  - where: 'note 17:28 “A priest sent back to Bethel”'
    claim: 'Bethel was where one of the golden calves had been set up'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/17.htm'
    quote: 'The place where one of the golden calves had been set up. The worship of these objects would be what the priest taught as the national worship of the ten tribes.'
  - where: 'note 17:33 “The beginning of the Samaritans”'
    claim: 'The foreigners went on worshiping their own gods with Jehovah; the mixed population came to identify as Israel and were called Samaritans; the Jews rejected them; hostility after the exile and in Jesus'' day'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'Over the next few centuries, the foreigners who had been brought into Israel continued to worship their own gods along with Jehovah. Eventually this mixed population of Israelites and foreigners came to predominantly identify themselves as children of Israel and became known as Samaritans.'
  - where: 'note 17:33 “The beginning of the Samaritans”'
    claim: 'The Jews refused the Samaritans for mixed ancestry and practices; hostility after the exile and in Jesus'' life'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'This rejection led to hostility between the two groups, which was evident both after the Jewish exile and during the life of Jesus Christ.'
  - where: 'note 17:33 “The beginning of the Samaritans”'
    claim: 'It is uncertain whether the “Samaritans” of 2 Kgs. 17:29 are the New Testament group; the term means both the inhabitants of Samaria and the religious group'
    key: matson-bridging
    url: 'https://rsc.byu.edu/learn-me/bridging-biblical-gap'
    quote: 'Like the reference to “Samaritans” in 2 Kings 17:29, it is uncertain if this is a reference to the same group discussed in the New Testament, as the term is employed to describe both the inhabitants of Samaria and members of the religious group.'
  - where: 'note 17:33 “The beginning of the Samaritans”'
    claim: 'Refused a share in the temple, they became opponents of the Jews and built a rival temple on Mount Gerizim'
    key: bd-samaritans
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samaritans?lang=eng'
    quote: 'This claim not being allowed, they became, as the books of Ezra and Nehemiah show, bitter opponents of the Jews, and started a rival temple of their own on Mount Gerizim.'
  - where: 'note 17:34 “Feared, and feared not”'
    claim: 'The same verb “fear” stands in verses 32–34'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'יְרֵאִ֖ים'
  - where: 'note 17:34 “Feared, and feared not”'
    claim: 'Verses 32–33, 41 say what the colonists thought they did; verse 34 the truth as God regarded it; worship of Jehovah as a local deity is no worship'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/17.htm'
    quote: 'This worship of Jehovah, merely because they regard Him as the local deity of the land, is no worship at all. God will not be served from policy.'
  - where: 'note 17:34 “Feared, and feared not”'
    claim: 'The contrast with “they feared the Lord” is no difficulty: those verses express what the colonists thought'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/17.htm'
    quote: 'These latter express what the new colonists thought they were doing, and what they also thought to be enough. This verse expresses what the writer knew to be the truth as God regarded the service.'
  - where: 'note 17:34 “Feared, and feared not”'
    claim: 'Verses 35–39 recite the covenant''s prohibitions to show the mixed worship as a complete breach of the covenant'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/17.htm'
    quote: 'To indicate the character of this worship still more clearly, and hold it up as a complete breach of the covenant and as utter apostasy from Jehovah, the historian describes still more fully, in 2 Kings 17:35-39'
  - where: christ
    claim: 'Jesus Christ is he who gave the law and covenanted with Israel (3 Ne. 15:5)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/15?lang=eng'
    quote: 'Behold, I am he that gave the law, and I am he who covenanted with my people Israel'
  - where: christ
    claim: 'The chapter heading of 3 Nephi 16: Jesus will visit others of the lost sheep of Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/16?lang=eng'
    quote: 'Jesus will visit others of the lost sheep of Israel'
  - where: christ
    claim: 'The Apostles were directed to preach to Samaria; Philip did a successful work there'
    key: bd-samaritans
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samaritans?lang=eng'
    quote: 'but the people of Samaria were included among those to whom the Apostles were directed to preach the gospel (Acts 1:8), and a very successful work was done there by Philip (Acts 8:4–25).'
  - where: christ
    claim: 'President Nelson: the gathering of Israel is the most important thing taking place on earth today'
    key: nelson-hope-israel
    url: 'https://www.churchofjesuschrist.org/study/broadcasts/worldwide-devotional-for-young-adults/2018/06/hope-of-israel?lang=eng'
    quote: 'That gathering is the most important thing taking place on earth today. Nothing else compares in magnitude, nothing else compares in importance, nothing else compares in majesty. And if you choose to, if you want to, you can be a big part of it.'
  - where: christ
    claim: 'Footnote 38a sets 1 Ne. 21:15 beside “ye shall not forget”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/17?lang=eng'
    quote: '38a “forget”: Deut. 4:23; 1 Ne. 21:15; Alma 46:8; D&C 133:2.'
