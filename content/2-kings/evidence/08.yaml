chapter: 8
claims:
  - where: when
    claim: 'Elisha''s counsel to the woman was given at least seven years before the events of verses 3–6'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/8.htm'
    quote: 'It is clear from verse 3 that Elisha’s advice was given at least seven years before the event narrated in these verses.'

  - where: setting
    claim: 'The accounts of Elisha''s work are probably not told in chronological order'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/8.htm'
    quote: 'It is probable that the accounts of Elisha’s work and influence are not related in their chronological order.'
  - where: setting
    claim: 'Joram and Jehoram are forms of the same name, used of both kings'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/8.htm'
    quote: 'They are but different forms of the same name, and given in the Bible narrative indiscriminately to each.'
  - where: setting
    claim: 'Jehoram son of Ahab reigned over Israel in Samaria twelve years'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/3?lang=eng'
    quote: 'Now Jehoram the son of Ahab began to reign over Israel in Samaria the eighteenth year of Jehoshaphat king of Judah, and reigned twelve years.'
  - where: setting
    claim: 'The daughter of Ahab whom Jehoram of Judah married was Athaliah'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/8.htm'
    quote: 'Joram had married a daughter of Ahab, namely Athaliah (2 Kings 8:26), and walked in the ways of the house of Ahab, transplanting the worship of Baal into his kingdom.'
  - where: setting
    claim: 'Hazael became king by murdering Ben-hadad and was defeated by Shalmaneser of Assyria, as Assyrian inscriptions record'
    key: bd-hazael
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hazael?lang=eng'
    quote: 'He became king by murdering his master Benhadad (2 Kgs. 8:15) and soon started on a war with Israel and Judah for the possession of Ramoth-gilead (8:28–29; 9:14–15). We learn from Assyrian inscriptions that he was attacked and defeated in Damascus by Shalmaneser, king of Assyria'
  - where: setting
    claim: 'Chronicles retells Jehoram''s and Ahaziah''s reigns (2 Chr. 21–22)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/21?lang=eng'
    quote: 'Jehoram was thirty and two years old when he began to reign, and he reigned eight years in Jerusalem.'

  - where: thread
    claim: 'Elisha came to Damascus to carry out the commission Elijah received at Horeb concerning Hazael'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/8.htm'
    quote: 'Elisha then came to Damascus at the instigation of the Spirit of God, to carry out the commission which Elijah had received at Horeb with regard to Hazael (1 Kings 19:15).'
  - where: thread
    claim: 'By the end of the chapter Hazael is already beginning to fulfil Elisha''s forecast at Ramoth-gilead'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/8.htm'
    quote: 'Hazael was already beginning to fulfil the forecast of Elisha. Ramoth-gilead belonged to Israel (1 Kings 22:3) but now, as in Ahab’s reign, it was being seized by the Syrians.'
  - where: thread
    claim: 'Chronicles says Ahaziah''s coming to Joram was his destruction, from God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/22?lang=eng'
    quote: 'And the destruction of Ahaziah was of God by coming to Joram: for when he was come, he went out with Jehoram against Jehu the son of Nimshi, whom the Lord had anointed to cut off the house of Ahab.'

  - where: section 1 plain
    claim: 'Verse 1 looks back to counsel given before the woman left (rendered "had spoken")'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/8.htm'
    quote: '1. Then spake Elisha] R.V. Now Elisha had spoken. It is clear from verse 3 that Elisha’s advice was given at least seven years before the event narrated in these verses. Hence the necessity for the change of tense.'

  - where: 'note 8:1 “A warning given years before”'
    claim: 'Verse 1 looks back; the famine is most likely the dearth of 2 Kgs. 4:38'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/8.htm'
    quote: 'The famine here spoken of was most likely the same to which allusion is made in 2 Kings 4:38, and perhaps the conference of the king with Gehazi mentioned in verse 4 took place before the latter was smitten with leprosy. It is not however absolutely certain'
  - where: 'note 8:1 “A warning given years before”'
    claim: 'The events of 8:1–6 took place before Naaman''s healing, since Gehazi was not yet a leper'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/8.htm'
    quote: 'the event related here took place before the curing of Naaman the Syrian (2 Kings 5), as is evident from the fact that Gehazi talked with the king (2 Kings 8:4), and therefore had not yet been punished with leprosy.'
  - where: 'note 8:1 “A warning given years before”'
    claim: 'The LORD "calls for" the sword against a land in the same way; Elisha foretells the dearth as he foretold the siege''s end, referring his words to the LORD'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/8.htm'
    quote: 'the Lord hath called for a famine] Similarly the Lord is said to call for the sword against a land, Jeremiah 25:29; Ezekiel 38:21.'
  - where: 'note 8:1 “A warning given years before”'
    claim: 'Elisha made a special trip to warn the woman, a blessing that followed her faithfulness'
    key: bartholomew-follow-prophet
    url: 'https://rsc.byu.edu/vol-9-no-1-2008/follow-prophet-eight-principles-1-2-kings'
    quote: 'Because of her faithfulness, great blessings followed. … Later, when Elisha prophesied a seven-year famine in Israel, he made a special trip to this woman’s home to warn her to leave the country with her family to save their lives.'

  - where: 'note 8:5 “The woman at the door”'
    claim: 'The king orders all that was hers restored, with the produce of her fields since she left'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/8?lang=eng'
    quote: 'Restore all that was hers, and all the fruits of the field since the day that she left the land, even until now.'

  - where: 'note 8:10 “Did Elisha tell Hazael to lie?”'
    claim: 'The written Hebrew (ketiv) has lo, "not"; the reading tradition (qere) has lo, "to him"'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'ל֖/וֹ'
  - where: 'note 8:10 “Did Elisha tell Hazael to lie?”'
    claim: 'Joseph Smith''s manuscript reads "if thou wilt go and say unto him" at verse 10'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/84'
    quote: 'Vers 10 And Elisha said unto him, if thou wilt go and say unto him, Thou mayes certainly recover, howbeit, the Lord'
  - where: 'note 8:10 “Did Elisha tell Hazael to lie?”'
    claim: 'Nyman counts the change in 2 Kgs. 8 among the "very insignificant" changes in 2 Kings'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'The book of 2 Kings has five verses changed, but four of these are very insignificant changes. … In chapter 8, the KJV “go say unto him” is rendered “thou wilt go and say unto him.”'
  - where: 'note 8:10 “Did Elisha tell Hazael to lie?”'
    claim: 'The Student Manual reads verse 10 as: the disease was not fatal, but the king would die by other means'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'Elisha informed Hazael (see v. 10) that the disease the king was suffering from was not fatal, but he would die by other means.'

  - where: 'note 8:12 “Why the man of God wept”'
    claim: 'Elisha fixed his eyes on Hazael until Hazael was embarrassed'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/8.htm'
    quote: 'Elisha then fixed Hazael for a long time with his eye, and wept. וגו ויּעמד literally, he made his face stand fast, and directed it (upon Hazael) to shaming. עד־בּשׁ as in Judges 3:25; not in a shameless manner (Thenius), but till Hazael was embarrassed by it.'
  - where: 'note 8:12 “Why the man of God wept”'
    claim: 'Elisha knew Hazael''s heart: the wicked cannot look unashamedly into the eye of the righteous'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'Elisha knew the heart of Hazael and the evil he would cause, for the wicked cannot look unashamedly into the piercing eye of the righteous (see v. 11).'
  - where: 'note 8:12 “Why the man of God wept”'
    claim: 'The prophecy elaborates the LORD''s word to Elijah in 1 Kgs. 19:17; its fulfilment is told in 10:32–33 and 13:3'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/8.htm'
    quote: 'This cruel conduct towards Israel which is here predicted of Hazael, was only a special elaboration of the brief statement made by the Lord to Elijah concerning Hazael (1 Kings 19:17). The fulfilment of this prediction is indicated generally in 2 Kings 10:32-33, and 2 Kings 13:3.'
  - where: 'note 8:12 “Why the man of God wept”'
    claim: 'Hazael waged war on Israel and Judah, and attacked Israel again after his defeat by Shalmaneser'
    key: bd-hazael
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hazael?lang=eng'
    quote: 'but a few years later he was again strong enough to attack Israel (2 Kgs. 10:32; 12:17–18; 13:3–7, 22; 2 Chr. 24:24).'

  - where: 'note 8:13 “What is thy servant, a dog?”'
    claim: 'BDB lists 2 Kgs. 8:13 as "dog" used of a man in excessive humility'
    key: bdb
    url: 'https://biblehub.com/hebrew/3611.htm'
    quote: 'b. applied, figurative, to men, in contempt 1 Samuel 17:43, so of psalmist''s enemies Psalm 22:17; Psalm 22:21, or in excessive humility 2 Kings 8:13'
  - where: 'note 8:13 “What is thy servant, a dog?”'
    claim: 'Hazael murdered his master Ben-hadad to become king'
    key: bd-hazael
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hazael?lang=eng'
    quote: 'He became king by murdering his master Benhadad (2 Kgs. 8:15)'
  - where: 'note 8:13 “What is thy servant, a dog?”'
    claim: 'The LORD told Elijah to anoint Hazael king over Syria (1 Kgs. 19:15)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/19?lang=eng'
    quote: 'And the LORD said unto him, Go, return on thy way to the wilderness of Damascus: and when thou comest, anoint Hazael to be king over Syria'

  - where: 'note 8:19 “A light kept for David”'
    claim: 'Chronicles gives the covenant with David as the reason Judah was spared'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/21?lang=eng'
    quote: 'Howbeit the Lord would not destroy the house of David, because of the covenant that he had made with David, and as he promised to give a light to him and to his sons for ever.'
  - where: 'note 8:19 “A light kept for David”'
    claim: 'Chronicles adds that Jehoram slew all his brothers'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/21?lang=eng'
    quote: 'he strengthened himself, and slew all his brethren with the sword'

  - where: 'note 8:20 “Edom and Libnah break away”'
    claim: 'Libnah was a city Joshua took'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/10?lang=eng'
    quote: 'Then Joshua passed from Makkedah, and all Israel with him, unto Libnah, and fought against Libnah'
  - where: 'note 8:20 “Edom and Libnah break away”'
    claim: 'Edom lay south of the Dead Sea; Israel and Edom were kin, with constant wars'
    key: bd-edom
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/edom?lang=eng'
    quote: 'This country lay south of the Dead Sea, having Moab on the north and the Dead Sea on the northwest. … In spite of the kinship there seems to have been great mutual hatred, and wars were of constant occurrence'
  - where: 'note 8:20 “Edom and Libnah break away”'
    claim: 'Chronicles: Libnah revolted because Jehoram had forsaken the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/21?lang=eng'
    quote: 'The same time also did Libnah revolt from under his hand; because he had forsaken the Lord God of his fathers.'

  - where: 'note 8:26 “Twenty-two or forty-two”'
    claim: '2 Chr. 22:2 gives Ahaziah''s age as forty-two; the footnote gives "Twenty-two" as the alternative reading'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/22?lang=eng'
    quote: 'OR Twenty-two; see 2 Kgs. 8:26.'
  - where: 'note 8:26 “Twenty-two or forty-two”'
    claim: 'The footnote to 2 Chr. 22:2 gives "granddaughter" for "daughter"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/22?lang=eng'
    quote: 'OR granddaughter'
  - where: 'note 8:26 “Twenty-two or forty-two”'
    claim: 'Joseph Smith revised 2 Chr. 22:2 to match 2 Kgs. 8:26, correcting a contradiction'
    key: sc-knowhy-786
    url: 'https://scripturecentral.org/knowhy/did-the-joseph-smith-translation-of-the-bible-rely-on-scholarly-commentaries'
    quote: 'Similarly, Joseph made changes to 2 Chronicles 22:2 and Nehemiah 7 in an effort to correct contradictions in the biblical text. In 2 Chronicles 22:2, the age of King Ahaziah is revised to match the parallel account in 2 Kings 8:26'
  - where: 'note 8:26 “Twenty-two or forty-two”'
    claim: 'The JST changes "forty and two" in 2 Chr. 22:2 to "twenty and two," matching 2 Kgs. 8:26'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'the KJV states that Ahaziah was forty and two years when he began to reign. The JST changes this to twenty and two, which makes it conform to the parallel account of 2 Kings 8:26.'
  - where: 'note 8:26 “Twenty-two or forty-two”'
    claim: 'Ahab was the son of Omri'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/16?lang=eng'
    quote: 'And in the thirty and eighth year of Asa king of Judah began Ahab the son of Omri to reign over Israel'

  - where: 'note 8:29 “Two kings at Jezreel”'
    claim: 'Joram held Ramoth-gilead against Hazael and returned to Jezreel to be healed; Jehu''s conspiracy begins there'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/9?lang=eng'
    quote: 'So Jehu the son of Jehoshaphat the son of Nimshi conspired against Joram. (Now Joram had kept Ramoth-gilead, he and all Israel, because of Hazael king of Syria.'
  - where: 'note 8:29 “Two kings at Jezreel”'
    claim: 'Ahab died fighting the Syrians at Ramoth-gilead'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/22?lang=eng'
    quote: 'So the king of Israel and Jehoshaphat the king of Judah went up to Ramoth-gilead.'
  - where: 'note 8:29 “Two kings at Jezreel”'
    claim: 'Chronicles: Ahaziah''s destruction was of God by coming to Joram; his mother was his counsellor to do wickedly'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/22?lang=eng'
    quote: 'He also walked in the ways of the house of Ahab: for his mother was his counsellor to do wickedly.'

  - where: christ
    claim: 'The Interpreter Foundation''s study help reads the "light" of 8:19 as Jesus Christ, to come through Judah'
    key: interpreter-cfm-2026-2-kings-2-7
    url: 'https://interpreterfoundation.org/come-follow-me/old-testament-2026/2-kings-2-7-2'
    quote: 'the Lord will not destroy the royal line in Judah because of the promise to David that a “light” (Jesus Christ; 8:19) would come through Judah.'
  - where: christ
    claim: 'The covenant with David is the reason Chronicles gives for sparing the house of David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/21?lang=eng'
    quote: 'Howbeit the Lord would not destroy the house of David, because of the covenant that he had made with David'
