chapter: 9
claims:
  - where: when
    claim: 'Jehoram (Joram) son of Ahab reigned twelve years over Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/3?lang=eng'
    quote: 'Now Jehoram the son of Ahab began to reign over Israel in Samaria the eighteenth year of Jehoshaphat king of Judah, and reigned twelve years.'
  - where: when
    claim: 'Ahaziah of Judah reigned one year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/8?lang=eng'
    quote: 'Two and twenty years old was Ahaziah when he began to reign; and he reigned one year in Jerusalem. And his mother’s name was Athaliah, the daughter of Omri king of Israel.'

  - where: setting
    claim: 'Joram reigned twelve years in Samaria'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/3?lang=eng'
    quote: 'Now Jehoram the son of Ahab began to reign over Israel in Samaria the eighteenth year of Jehoshaphat king of Judah, and reigned twelve years.'
  - where: setting
    claim: 'Joram was wounded fighting Hazael at Ramoth-gilead, with Ahaziah of Judah beside him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/8?lang=eng'
    quote: 'And he went with Joram the son of Ahab to the war against Hazael king of Syria in Ramoth-gilead; and the Syrians wounded Joram.'
  - where: setting
    claim: 'The LORD told Elijah at Horeb to anoint Jehu'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/19?lang=eng'
    quote: 'And Jehu the son of Nimshi shalt thou anoint to be king over Israel: and Elisha the son of Shaphat of Abel-meholah shalt thou anoint to be prophet in thy room.'
  - where: setting
    claim: 'The evil on Ahab''s house was delayed to his son''s days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/21?lang=eng'
    quote: 'because he humbleth himself before me, I will not bring the evil in his days: but in his son’s days will I bring the evil upon his house.'
  - where: setting
    claim: 'Jezebel was a Phoenician princess, the wife of Ahab'
    key: bd-jezebel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jezebel?lang=eng'
    quote: 'A Phoenician princess, daughter of Ethbaal, king of Zidonians, and wife of Ahab, king of Israel (1 Kgs. 16:31).'

  - where: thread
    claim: 'The Student Manual sums up the vineyard scene as the day of Elijah''s prophecy come'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'This was also the exact spot where Elijah had appeared to Ahab years before and prophesied that his posterity would one day be exterminated (see 1 Kings 21:21–23). That day had come.'
  - where: thread
    claim: 'The captains'' "Is all well?" in verse 11 is hăšālôm, the same word as "Is it peace?"'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'הֲ/שָׁל֔וֹם'
  - where: thread
    claim: 'The delay to the son''s days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/21?lang=eng'
    quote: 'I will not bring the evil in his days: but in his son’s days will I bring the evil upon his house.'

  - where: section 1 plain
    claim: 'The idiom of verse 8 means every male, and "shut up and left" everyone, bond or free'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/9.htm'
    quote: 'The entire family is doomed. God will cut off from Ahab every man child. (R.V.) … The phrase is intended to embrace every one, young or old, bond or free.'

  - where: 'note 9:3 “Anointed by a son of the prophets”'
    claim: 'Elijah was commanded at Horeb to anoint Jehu'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/19?lang=eng'
    quote: 'And Jehu the son of Nimshi shalt thou anoint to be king over Israel'
  - where: 'note 9:3 “Anointed by a son of the prophets”'
    claim: 'Kings were anointed to their office by the prophets, Saul and David among them, and Jehu at 2 Kgs. 9:3, 6'
    key: bd-anoint
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/anoint?lang=eng'
    quote: 'Kings were anointed to their office by the prophets (1 Sam. 10:1; 16:13; 2 Sam. 5:3; 1 Kgs. 1:39; 19:16; 2 Kgs. 9:3, 6; 11:12; 1 Chr. 11:3; 29:22; 2 Chr. 23:11).'

  - where: 'note 9:7 “Why the house of Ahab”'
    claim: 'Jezebel cut off the prophets of the LORD; Obadiah hid a hundred'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/18?lang=eng'
    quote: 'For it was so, when Jezebel cut off the prophets of the LORD, that Obadiah took an hundred prophets, and hid them by fifty in a cave, and fed them with bread and water.'
  - where: 'note 9:7 “Why the house of Ahab”'
    claim: 'The Bible Dictionary: the marriage did most to bring down the northern kingdom, through Phoenician worship'
    key: bd-jezebel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jezebel?lang=eng'
    quote: 'This marriage, more than any other single event, caused the downfall of the northern kingdom, as Jezebel introduced into Israel the worst forms of Phoenician worship in place of the worship of Jehovah'
  - where: 'note 9:7 “Why the house of Ahab”'
    claim: 'Elijah''s sentence on Ahab used the same terms as for Jeroboam''s and Baasha''s houses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/21?lang=eng'
    quote: 'And will make thine house like the house of Jeroboam the son of Nebat, and like the house of Baasha the son of Ahijah'
  - where: 'note 9:7 “Why the house of Ahab”'
    claim: 'The LORD later commends Jehu, and the next verse sets the limit'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/10?lang=eng'
    quote: 'But Jehu took no heed to walk in the law of the LORD God of Israel with all his heart: for he departed not from the sins of Jeroboam, which made Israel to sin.'

  - where: 'note 9:13 “Garments on the stairs”'
    claim: 'The garments, large wrapping cloths, were spread on the steps as a throne in homage; Keil compares Matt. 21:7'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/9.htm'
    quote: 'The clothes, which consisted simply of a large piece of cloth for wrapping round the body (see at 1 Kings 11:29), they spread out in the place of carpets upon the steps, which served as a throne, to do homage to Jehu. For these signs of homage compare Matthew 21:7'
  - where: 'note 9:13 “Garments on the stairs”'
    claim: 'At Jesus'' entry a multitude spread garments in the way'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/21?lang=eng'
    quote: 'And a very great multitude spread their garments in the way; others cut down branches from the trees, and strawed them in the way.'

  - where: 'note 9:13 “Garments on the stairs”'
    claim: 'Laying cloaks at a man''s feet was a ceremony acknowledging a king, a sign of loyalty and of his authority'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'Verse 13 describes a special ceremony in which a man was acknowledged king. Those present laid their cloaks down at his feet as a symbol of their loyalty and recognition of his authority.'
  - where: 'note 9:13 “Garments on the stairs”'
    claim: 'The Hebrew words are difficult and the early translators guessed at them'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/9.htm'
    quote: 'The difficult words המּעלות אל־גּרם, as to the meaning of which the early translators have done nothing but guess, can hardly be rendered in any other way than that proposed by Kimchi'
  - where: 'note 9:13 “Garments on the stairs”'
    claim: 'Keil: they did not look for a suitable place for a throne but laid their clothes on the bare steps'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/9.htm'
    quote: 'without looking for a suitable place on which to erect a throne, they laid their clothes upon the bare steps'
  - where: 'note 9:27 “Why the king of Judah died too”'
    claim: 'Jehoshaphat was the father of Jehoram, Ahaziah''s father'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/8?lang=eng'
    quote: 'Jehoram the son of Jehoshaphat king of Judah began to reign'

  - where: 'note 9:20 “Driving like a madman”'
    claim: 'The Hebrew of verse 20 is bᵉšiggāʿôn, and of verse 11 hamᵉšuggāʿ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'בְ/שִׁגָּע֖וֹן'
  - where: 'note 9:20 “Driving like a madman”'
    claim: 'BDB: šiggāʿôn is madness; at 2 Kgs. 9:20, hyperbolically, "madly"'
    key: bdb
    url: 'https://biblehub.com/hebrew/7697.htm'
    quote: 'שִׁגָּעוֺן noun masculine madness; … ׳בְּשׁ 2 Kings 9:20 (hyperb.) madly.'
  - where: 'note 9:20 “Driving like a madman”'
    claim: 'BDB: mᵉšuggāʿ used of prophets contemptuously, Hos. 9:7, Jer. 29:26, and 2 Kgs. 9:11'
    key: bdb
    url: 'https://biblehub.com/hebrew/7696.htm'
    quote: '׳מ of prophets, contemptuously Hosea 9:7, ׳כָּלאִֿישׁ מ וּמִתְנַבֵּא Jeremiah 29:26, as substantive 2 Kings 9:11'
  - where: 'note 9:20 “Driving like a madman”'
    claim: 'Same root as "mad" in verse 11; Jehu''s driving was well known; the Greek and Latin read "furiously," Josephus "leisurely," the Aramaic "quietly"'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/9.htm'
    quote: 'It is clear from this that Jehu was well known … The word rendered ‘furiously’ is from the same root as that rendered ‘mad’ in verse 11. This is the sense given by the Greek and Latin versions, but Josephsus as if explaining this word says ‘Jehu journeyed leisurely and in good order’. The Chaldee and Arabic also explain it by ‘quietly’.'

  - where: 'note 9:22 “Whoredoms and witchcrafts”'
    claim: 'The words are zᵉnûnîm and kᵉšāpîm'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'זְנוּנֵ֞י'
  - where: 'note 9:22 “Whoredoms and witchcrafts”'
    claim: 'BDB classes zᵉnûnîm at 2 Kgs. 9:22 as religious, with Hosea'
    key: bdb
    url: 'https://biblehub.com/hebrew/2183.htm'
    quote: 'c. religious 2 Kings 9:22; Ezekiel 23:11,29; Hosea 2:4; Hosea 2:6; Hosea 4:12; Hosea 5:4.'
  - where: 'note 9:22 “Whoredoms and witchcrafts”'
    claim: 'BDB: kᵉšāpîm here figurative of seductive and corrupting influences, paired as in Nahum 3:4 of Nineveh'
    key: bdb
    url: 'https://biblehub.com/hebrew/3785.htm'
    quote: '2 figurative of seductive and corrupting influences: of Jezebel 2 Kings 9:22 "" זְנוּנִים; of Nineveh personified as harlot Nahum 3:4'
  - where: 'note 9:22 “Whoredoms and witchcrafts”'
    claim: 'Ahab married Jezebel and served Baal'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/16?lang=eng'
    quote: 'he took to wife Jezebel the daughter of Ethbaal king of the Zidonians, and went and served Baal, and worshipped him.'

  - where: 'note 9:27 “Why the king of Judah died too”'
    claim: 'Ahaziah''s father married Ahab''s daughter; Ahaziah walked in Ahab''s way'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/8?lang=eng'
    quote: 'And he walked in the way of the house of Ahab, and did evil in the sight of the LORD, as did the house of Ahab: for he was the son in law of the house of Ahab.'
  - where: 'note 9:27 “Why the king of Judah died too”'
    claim: 'Chronicles: Ahaziah''s destruction was of God; he was found hidden in Samaria, brought to Jehu and slain, and buried for Jehoshaphat''s sake'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/22?lang=eng'
    quote: 'And he sought Ahaziah: and they caught him, (for he was hid in Samaria,) and brought him to Jehu: and when they had slain him, they buried him: Because, said they, he is the son of Jehoshaphat, who sought the Lord with all his heart.'
  - where: 'note 9:27 “Why the king of Judah died too”'
    claim: 'Chronicles: the destruction of Ahaziah was of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/22?lang=eng'
    quote: 'And the destruction of Ahaziah was of God by coming to Joram'

  - where: 'note 9:30 “Jezebel at the window”'
    claim: 'The Hebrew reads that she set her eyes in pûk'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'בַּ/פּ֤וּךְ'
  - where: 'note 9:30 “Jezebel at the window”'
    claim: 'BDB: pûk is antimony, a black powder darkening the edges of the lids'
    key: bdb
    url: 'https://biblehub.com/hebrew/6320.htm'
    quote: 'antimony, stibium … black mineral powder, for increasing brilliance of eyes by darkening edges of lids; ׳וַתָּשֶׂם בֵּמּ עֵינֶוהָ 2 Kings 9:30'
  - where: 'note 9:30 “Jezebel at the window”'
    claim: 'The manual (quoting Keil and Delitzsch): she dressed to die as a queen, not to allure; her greeting rendered "Is it peace, thou Zimri, murderer of his lord?" pointing to Zimri''s fate; Jehu did not answer'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: '“Jezebel [painted her face] that she might present an imposing appearance to Jehu and die as a queen; not to allure him by her charms. … ‘Is it peace, thou Zimri, murderer of his lord?’ … to point to the fate which Jehu would bring upon himself by the murder of the king, as Zimri had already done … But Jehu did not deign to answer'
  - where: 'note 9:30 “Jezebel at the window”'
    claim: 'Zimri killed Elah, reigned seven days, and died in the burning palace'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/16?lang=eng'
    quote: 'did Zimri reign seven days in Tirzah. … he went into the palace of the king’s house, and burnt the king’s house over him with fire, and died'

  - where: 'note 9:36 “The word of Elijah kept”'
    claim: 'Elijah''s recorded word against Jezebel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/21?lang=eng'
    quote: 'And of Jezebel also spake the LORD, saying, The dogs shall eat Jezebel by the wall of Jezreel.'
  - where: 'note 9:36 “The word of Elijah kept”'
    claim: 'Jezebel was daughter of Ethbaal, king of the Zidonians'
    key: bd-jezebel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jezebel?lang=eng'
    quote: 'A Phoenician princess, daughter of Ethbaal, king of Zidonians, and wife of Ahab'

  - where: christ
    claim: 'The Lord''s word by His own voice or His servants'' is the same and shall all be fulfilled'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/1?lang=eng'
    quote: 'my word shall not pass away, but shall all be fulfilled, whether by mine own voice or by the voice of my servants, it is the same.'
