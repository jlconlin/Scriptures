chapter: 23
claims:
  - where: setting
    claim: 'Seely dates Josiah''s reform to 622 B.C. and reads 22–23 as one account (the book found, Huldah, the reading)'
    key: seely-covenant-renewal
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal'
    quote: 'Another instructive example of a covenant-renewal ceremony can be found in the account of the reforms of Josiah in 622 B.C. (see 2 Kings 22–23).'
  - where: setting
    claim: 'Josiah killed by Necho at Megiddo in 609 BC, Egypt marching to assist Assyria; four years of Egyptian domination; Jehoahaz three months, Jehoiakim set up'
    key: schade-kingdom-judah
    url: 'https://scripturecentral.org/archive/books/book-chapter/kingdom-judah-politics-prophets-and-scribes-late-preexilic-period'
    quote: 'Josiah was killed by Pharaoh Necho II at Meggido in 609 BC. This occurred as the Egyptians were marching north to assist their ally (Assur-uballit II of Assyria) who was falling to the Babylonians and the Medes in western Mesopotamia.'
  - where: setting
    claim: 'Zephaniah prophesied during Josiah''s reign and reform'
    key: bowen-putting-down-priests
    url: 'https://interpreterfoundation.org/journal/putting-down-the-priests-a-note-on-royal-evaluations-wehisbit-and-priestly-purges-in-2-kings-235-and-mosiah-115'
    quote: 'Zephaniah, whose prophetic ministry ran contemporaneously with King Josiah’s reign and reform'
  - where: setting
    claim: 'The eighteenth year of Josiah; Jeremiah called in the thirteenth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/22?lang=eng'
    quote: 'And it came to pass in the eighteenth year of king Josiah, that the king sent Shaphan'
  - where: setting
    claim: 'Prophets like Lehi and Jeremiah preached that Jerusalem must repent or be destroyed (1 Ne. 1:4)'
    key: seely-woods-jerusalem-destroyed
    url: 'https://scripturecentral.org/archive/books/book-chapter/how-could-jerusalem-great-city-be-destroyed'
    quote: 'Prophets like Lehi and Jeremiah were threatened with death when they spoke what many Jews considered to be blasphemous words against the holy city'
  - where: thread
    claim: 'The order of the account: covenant, idolatry removed in Jerusalem, Judah, Bethel and Samaria, then the Passover'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/23.htm'
    quote: 'After this he had all the remnants of idolatry eradicated, not only in Jerusalem and Judah, but also in Bethel and the other cities of Samaria, and directed the people to strengthen themselves in their covenant fidelity towards the Lord by the celebration of a solemn passover.'
  - where: thread
    claim: 'The people''s changes were outward only; inwardly the pull back to idolatry was stronger'
    key: satterfield-divine-justification
    url: 'https://scripturecentral.org/archive/books/book-chapter/divine-justification-babylonian-destruction-jerusalem'
    quote: 'But we also have seen that the changes made by the people were outward only. Inwardly, the draw to sin and idolatry was stronger than their will to follow the Lord.'
  - where: 'note 23:3 “Standing to the covenant”'
    claim: 'To stand to the covenant is to pledge to keep it; likely a formal covenant-renewal ceremony like Moses'' before entering the land'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'The people then “stood to the covenant,” meaning they pledged to keep the covenant with the Lord. This was likely part of a formal covenant-renewal ceremony like the one Moses and the children of Israel performed before entering the promised land.'
  - where: 'note 23:3 “Standing to the covenant”'
    claim: 'Seely: Huldah as preamble, the curses as witness, the public reading, the oath; the objects removed show the apostasy'
    key: seely-covenant-renewal
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal'
    quote: 'In a sense, Huldah provides the Preamble to the covenant ceremony when she declared that in fact the Lord was the author of the Stipulations contained therein … Israel’s apostasy and the need for covenant renewal are graphically illustrated in the almost incredible description of the abominable objects'
  - where: 'note 23:5 “Priests the kings had ordained”'
    claim: 'kōmer occurs three times; nothing in the word means idolatrous; KJV adjective drawn from the activities; Aramaic cognate the main word for priest'
    key: bowen-putting-down-priests
    url: 'https://interpreterfoundation.org/journal/putting-down-the-priests-a-note-on-royal-evaluations-wehisbit-and-priestly-purges-in-2-kings-235-and-mosiah-115'
    quote: 'From an etymological perspective, nothing in the Hebrew word translated “idolatrous priests” in the KJV — kōmer — itself suggests that it denoted the performance of idolatrous rites … In Aramaic, the cognate noun kûmrāʾ constituted the main word for “priest.” Attested only three times'
  - where: 'note 23:5 “Priests the kings had ordained”'
    claim: 'Hosea 10:5 uses it of the calf priests; the kĕmārîm of the high places would have burned incense to Jehovah; Zephaniah condemns them'
    key: bowen-putting-down-priests
    url: 'https://interpreterfoundation.org/journal/putting-down-the-priests-a-note-on-royal-evaluations-wehisbit-and-priestly-purges-in-2-kings-235-and-mosiah-115'
    quote: 'Those kĕmārîm who had been “ordained to burn incense in the high places of Judah” would have been burning incense to Jehovah, the national God.'
  - where: 'note 23:5 “Priests the kings had ordained”'
    claim: 'Josiah put down priests appointed by Amon and Manasseh'
    key: bowen-putting-down-priests
    url: 'https://interpreterfoundation.org/journal/putting-down-the-priests-a-note-on-royal-evaluations-wehisbit-and-priestly-purges-in-2-kings-235-and-mosiah-115'
    quote: 'to describe the latter’s removal of priests, whom Amon, Josiah’s father, and Manasseh, Josiah’s grandfather, had appointed'
  - where: 'note 23:5 “Priests the kings had ordained”'
    claim: 'The writer counts the purge laudable; the verb wĕhišbît is a purge'
    key: bowen-putting-down-priests
    url: 'https://interpreterfoundation.org/journal/putting-down-the-priests-a-note-on-royal-evaluations-wehisbit-and-priestly-purges-in-2-kings-235-and-mosiah-115'
    quote: 'we can firmly conclude that this term represented a type of priest, that Josiah had the royal authority to either ordain or remove such priests, and that the Deuteronomistic writer who detailed Josiah’s “put[ting] down,” “suppression,” or “purging” (wĕhišbît) considered it laudable.'
  - where: 'note 23:5 “Priests the kings had ordained”'
    claim: 'Mormon uses the same idiom of Noah; Bowen reads the contrast with Josiah as deliberate'
    key: bowen-putting-down-priests
    url: 'https://interpreterfoundation.org/journal/putting-down-the-priests-a-note-on-royal-evaluations-wehisbit-and-priestly-purges-in-2-kings-235-and-mosiah-115'
    quote: 'Mormon employs additional “Deuteronomistic” language in evaluating Mosiah, Noah, and other dynastic Book of Mormon leaders, suggesting that the evident contrast between King Noah and King Josiah is deliberately made.'
  - where: 'note 23:5 “Priests the kings had ordained”'
    claim: 'The Hebrew word in 23:5 is hakkĕmārîm (Strong''s 3649)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'הַ/כְּמָרִ֗ים'
  - where: 'note 23:6 “Burned, ground to powder, and scattered”'
    claim: 'The grove is Asherah, a fertility goddess'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng'
    quote: '6a “grove”: IE Asherah, a fertility goddess.'
  - where: 'note 23:6 “Burned, ground to powder, and scattered”'
    claim: 'Manasseh set a graven image of the grove in the house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/21?lang=eng'
    quote: 'And he set a graven image of the grove that he had made in the house'
  - where: 'note 23:6 “Burned, ground to powder, and scattered”'
    claim: 'Ashes cast on the graves of the common people to defile them as graves of idolaters; the Kidron already defiled by Asa and Hezekiah'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/23.htm'
    quote: 'Asa had already had an idol burned in the Kidron valley (1 Kings 15:13), and Hezekiah had ordered the idolatrous abominations to be taken out of the city and carried thither … Josiah ordered the ashes to be cast upon these graves, probably in order to defile them as the graves of idolaters.'
  - where: 'note 23:6 “Burned, ground to powder, and scattered”'
    claim: 'The ashes carried to Bethel to defile the chief seat of idolatry'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/23.htm'
    quote: 'to defile the idolatrous place of worship at Bethel as the chief seat of idolatry and false worship.'
  - where: 'note 23:9 “Priests without an altar”'
    claim: 'The priests of the high places could not sacrifice but ate the priests'' portions at home, like priests with a bodily defect'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/23.htm'
    quote: 'though he did allow them "to eat that which was unleavened," i.e., to eat of the sacred altar-gifts intended for the priests … only they were not allowed to consume this at a holy place, but simply in the midst of their brethren, i.e., at home in the family. They were thus placed on a par with the priests who were rendered incapable of service on account of a bodily defect (Leviticus 21:17-22).'
  - where: 'note 23:16 “Josiah by name”'
    claim: 'The prophecy of 1 Kgs. 13:2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/13?lang=eng'
    quote: 'Behold, a child shall be born unto the house of David, Josiah by name; and upon thee shall he offer the priests of the high places that burn incense upon thee, and men’s bones shall be burnt upon thee.'
  - where: 'note 23:21 “A Passover kept by the book”'
    claim: 'Seely: the Passover a sign of recommitment, recounting the deliverance, a historical prologue to the covenant renewal'
    key: seely-covenant-renewal
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal'
    quote: 'As a sign of the people’s recommitment to the covenant, Josiah commanded them to observe the Feast of the Passover (see 2 Kings 23:21–22), which recounts God’s miraculous deliverance of Israel from Egypt and provides a sort of Historical Prologue to the covenant-renewal process.'
  - where: 'note 23:21 “A Passover kept by the book”'
    claim: 'Chronicles: no passover like it since Samuel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/35?lang=eng'
    quote: 'And there was no passover like to that kept in Israel from the days of Samuel the prophet'
  - where: 'note 23:26 “Why the reform did not turn the wrath”'
    claim: 'Manasseh so wicked that Josiah''s righteousness could not compensate; punishment delayed but had to come'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'the Deuteronomistic History suggests that God had allowed Jerusalem to be destroyed because King Manasseh was so wicked that even the righteousness of King Josiah could not compensate for it, and the punishment had to eventually come, even if it was delayed for a time.'
  - where: 'note 23:26 “Why the reform did not turn the wrath”'
    claim: 'Josiah''s reforms further reaching than Hezekiah''s but not lasting; Jer. 3:10 describes the response; outward changes only'
    key: satterfield-divine-justification
    url: 'https://scripturecentral.org/archive/books/book-chapter/divine-justification-babylonian-destruction-jerusalem'
    quote: 'Though Josiah’s reforms were more aggressive and further reaching than Hezekiah’s, their ultimate effects upon the people of Jerusalem were not beneficially lasting.'
  - where: 'note 23:26 “Why the reform did not turn the wrath”'
    claim: 'Jer. 3:10 applied to the response to Josiah''s reforms; outward changes, inner pull too great'
    key: satterfield-divine-justification
    url: 'https://scripturecentral.org/archive/books/book-chapter/divine-justification-babylonian-destruction-jerusalem'
    quote: 'Through Jeremiah, the Lord said, “Judah hath not turned unto me with her whole heart, but feignedly, saith the Lord” (Jeremiah 3:10). Though outward changes had been made, the inner struggle to return to former practices was too great.'
  - where: 'note 23:29 “Josiah''s death at Megiddo”'
    claim: 'The ally Necho marched to help was Assur-uballit II of Assyria, falling to the Babylonians and the Medes'
    key: schade-kingdom-judah
    url: 'https://scripturecentral.org/archive/books/book-chapter/kingdom-judah-politics-prophets-and-scribes-late-preexilic-period'
    quote: 'This occurred as the Egyptians were marching north to assist their ally (Assur-uballit II of Assyria) who was falling to the Babylonians and the Medes in western Mesopotamia.'
  - where: 'note 23:29 “Josiah''s death at Megiddo”'
    claim: 'Necho was marching north to assist Assyria; four years of Egyptian domination until Carchemish'
    key: schade-kingdom-judah
    url: 'https://scripturecentral.org/archive/books/book-chapter/kingdom-judah-politics-prophets-and-scribes-late-preexilic-period'
    quote: 'During the next four years (609–605 BC), Judah was under Egyptian domination until the Babylonian victory at Carchemish in 605.'
  - where: 'note 23:29 “Josiah''s death at Megiddo”'
    claim: 'Nineveh fell in 612; Josiah tried to stop the Egyptians; his death foreshadowed Judah''s; Jehoiakim and Zedekiah resisted the empire'
    key: seely-woods-jerusalem-destroyed
    url: 'https://scripturecentral.org/archive/books/book-chapter/how-could-jerusalem-great-city-be-destroyed'
    quote: 'In 612 Nineveh fell … In 609 Josiah, attempting to stop the Egyptians from marching to assist the Assyrians against the Babylonians, was killed in battle at Megiddo (2 Kings 23:29–30). What happened to Josiah was a frightening foreshadowing of what would later happen to Judah.'
  - where: 'note 23:29 “Josiah''s death at Megiddo”'
    claim: 'The NRSVue reads “went up to the king of Assyria”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=2+Kings+23%3A29&version=NRSVUE'
    quote: 'In his days Pharaoh Neco king of Egypt went up to the king of Assyria to the River Euphrates.'
  - where: 'note 23:29 “Josiah''s death at Megiddo”'
    claim: 'Huldah''s promise of a grave in peace, defined as not seeing the evil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/22?lang=eng'
    quote: 'thou shalt be gathered into thy grave in peace; and thine eyes shall not see all the evil which I will bring upon this place.'
  - where: 'note 23:34 “Renamed by Pharaoh”'
    claim: 'A new name was a sign of dependence; masters renamed servants (Gen. 41:45; Dan. 1:7); Necho did not recognize Jehoahaz'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/23.htm'
    quote: 'the king of Egypt did not acknowledge the reign of Jehoahaz, because he had been installed by the people without his consent. "And changed his name into Jehoiakim." The alteration of the name was a sign of dependence.'
  - where: 'note 23:34 “Renamed by Pharaoh”'
    claim: 'The new names were Israelite; the vassal likely chose them; Eliakim changed El to Jehovah'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/23.htm'
    quote: 'Eliakim, and at a later period Mattaniah (2 Kings 24:17), received genuine Israelitish names, Jehoiakim, i.e., "Jehovah will set up," … allowed them to choose the new names for themselves, and simply confirmed them as a sign of their supremacy. Eliakim altered his name into Jehoiakim, i.e., El (God) into Jehovah'
  - where: 'note 23:34 “Renamed by Pharaoh”'
    claim: 'Jehoahaz was imprisoned at Necho''s headquarters in Riblah'
    key: schade-kingdom-judah
    url: 'https://scripturecentral.org/archive/books/book-chapter/kingdom-judah-politics-prophets-and-scribes-late-preexilic-period'
    quote: 'After Jehoahaz’s18 short three-month reign in 609, he was imprisoned in Necho’s headquarters in Riblah.'
  - where: 'note 23:37 “The reform ends with Jehoiakim”'
    claim: 'Under Jehoiakim Josiah''s reform policies ended; things went from bad to worse'
    key: satterfield-divine-justification
    url: 'https://scripturecentral.org/archive/books/book-chapter/divine-justification-babylonian-destruction-jerusalem'
    quote: 'Under Jehoiakim, Josiah’s reform policies came to an end. Immediately, things went from bad to worse.'
  - where: 'note 23:37 “The reform ends with Jehoiakim”'
    claim: 'In Jehoiakim''s days the covenant was purposely rejected (Jer. 11:9–10)'
    key: satterfield-divine-justification
    url: 'https://scripturecentral.org/archive/books/book-chapter/divine-justification-babylonian-destruction-jerusalem'
    quote: 'In the days of Josiah, the return to the Lord was emphasized through covenant renewal where the people swore they would obey Jehovah (see 2 Kings 23:3). But in the days of Jehoiakim, the covenant was purposefully rejected.'
  - where: 'note 23:37 “The reform ends with Jehoiakim”'
    claim: 'Jehoiakim put Urijah to death for the same message as Lehi and Jeremiah; his successors resisted the empire'
    key: seely-woods-jerusalem-destroyed
    url: 'https://scripturecentral.org/archive/books/book-chapter/how-could-jerusalem-great-city-be-destroyed'
    quote: 'In fact, the prophet Urijah was put to death by King Jehoiakim for delivering the same message of destruction that Lehi and Jeremiah did (Jeremiah 26:20–23).'
  - where: 'note 23:37 “The reform ends with Jehoiakim”'
    claim: 'Jehoiakim and Zedekiah followed Hezekiah and Josiah in resistance, not reform'
    key: seely-woods-jerusalem-destroyed
    url: 'https://scripturecentral.org/archive/books/book-chapter/how-could-jerusalem-great-city-be-destroyed'
    quote: 'But King Jehoiakim and later King Zedekiah attempted to follow in the footsteps of Hezekiah and Josiah not in religious reform but in resistance, if not revolt, against the governing empire.'
