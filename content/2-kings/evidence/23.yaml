    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng'
    quote: '25b “turned”: Deut. 6:5; 2 Kgs. 18:5.'
  - where: explore
    claim: 'Eliason''s BYU Studies article examines Barker''s reading of Josiah''s reform and its Latter-day Saint reception'
    key: eliason-josiah
    url: 'https://byustudies.byu.edu/article/is-the-bible-reliable-a-case-study'
    quote: 'The core of Barker’s argument, made in various ways in her many books, is that Josiah’s reforms did irreparable damage to what she calls a “temple theology.”'
