chapter: 25
claims:
  - where: setting
    claim: 'In Zedekiah''s reign Jerusalem was destroyed and many taken to Babylon'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'After Josiah was killed in battle, the next four kings led Judah back into wickedness. During the reign of King Zedekiah, Jerusalem was destroyed, and many people were captured and taken into Babylon.'
  - where: setting
    claim: 'Zedekiah was Jehoiachin''s uncle, set on the throne by Nebuchadnezzar'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'After King Jehoiachin was taken captive to Babylon, his uncle Mattaniah was made king of Judah by Nebuchadnezzar.'
  - where: setting
    claim: 'The chapter is told again in Jeremiah 52 (the Church''s footnotes point verse by verse)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: '5a “pursued”: Jer. 52:8 (3–15). … 28a “kindly”: Jer. 52:32 (31–34).'
  - where: setting
    claim: 'Lehi lived at Jerusalem in Zedekiah''s first year and was warned to flee before the destruction'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'Lehi, the first prophet of the Book of Mormon, lived at Jerusalem during the first year of Zedekiah’s reign. The Lord warned Lehi to flee Jerusalem with his family before the city was destroyed.'
  - where: setting
    claim: 'One son of Zedekiah, Mulek, survived and was led to the Western Hemisphere'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'We learn from the Book of Mormon that one of Zedekiah’s sons, Mulek, survived and escaped the destruction of Jerusalem. The Lord directed Mulek and others to the promised land in the Western Hemisphere'
  - where: setting
    claim: 'Kings runs from David''s death to Jehoiachin''s last years, after about 561 B.C.'
    key: ot-seminary-2-kings-intro
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-2-kings?lang=eng'
    quote: 'starting with the death of King David (approximately 1015 B.C.) and concluding with the death of King Jehoiachin (sometime after approximately 561 B.C.).'
  - where: thread
    claim: 'The protection of the temple was conditional; the Lord warned Solomon that the hallowed house would be cast out of His sight'
    key: seely-woods-jerusalem-destroyed
    url: 'https://scripturecentral.org/archive/books/book-chapter/how-could-jerusalem-great-city-be-destroyed'
    quote: 'The blessings of protection promised in the covenants of Moses and of David were conditional. … and this house, which I have hallowed for my name, will I cast out of my sight” (1 Kings 9:6–7).'
  - where: thread
    claim: 'Manasseh''s wickedness cost Judah its protection; Judah did not learn from Israel'
    key: ot-seminary-2-kings-intro
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-2-kings?lang=eng'
    quote: 'Unfortunately, Judah did not learn from the mistakes of Israel. … One of these kings was King Manasseh, whose wickedness caused Judah to lose its divine protection.'
  - where: section 1 plain
    claim: '"Broken up" means the wall was breached'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: '4b “broken up”: HEB penetrated, opened up.'
  - where: section 2 plain
    claim: 'Snuffers were devices for putting out lamps'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: '14b “snuffers”: IE devices for extinguishing. 1 Kgs. 7:50.'
  - where: 'note 25:6 “Judged for a broken oath”'
    claim: 'The Church''s footnote sets Ezekiel 17:12 beside the judgment of Zedekiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: '6a “king”: Ezek. 17:12; Omni 1:15.'
  - where: 'note 25:18 “Seraiah the chief priest”'
    claim: 'Seraiah was probably the son of Azariah and grandson of Hilkiah'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/25.htm'
    quote: 'Seraiah, the chief priest] Probably the son of Azariah and grandson of Hilkiah (1 Chronicles 6:14). His name is not found except in the parallel narratives.'
  - where: 'note 25:18 “Seraiah the chief priest”'
    claim: 'Hilkiah the high priest of Josiah''s day is the Hilkiah of 1 Chronicles 6:13, and an ancestor of Ezra'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/22.htm'
    quote: 'Hilkiah the high priest] From 1 Chronicles 6:13 it seems that he was the son of Shallum, and judging from Ezra 7:1 he appears to have been an ancestor of Ezra.'
  - where: 'note 25:18 “Seraiah the chief priest”'
    claim: 'Seraiah''s son Jehozadak went into captivity'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/6?lang=eng'
    quote: 'And Azariah begat Seraiah, and Seraiah begat Jehozadak, … And Jehozadak went into captivity, when the Lord carried away Judah and Jerusalem by the hand of Nebuchadnezzar.'
  - where: 'note 25:18 “Seraiah the chief priest”'
    claim: 'Ezra is called the son of Seraiah, and went up from Babylon to teach the law'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/7?lang=eng'
    quote: 'Ezra the son of Seraiah, the son of Azariah, the son of Hilkiah, … This Ezra went up from Babylon; and he was a ready scribe in the law of Moses'
  - where: christ
    claim: 'Israel was scattered for breaking its covenants'
    key: nelson-let-god-prevail
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/10/46nelson?lang=eng'
    quote: 'Sadly, Israel’s posterity broke their covenants with God. They stoned the prophets and were not willing to let God prevail in their lives. Subsequently, God scattered them to the four corners of the earth. Mercifully, He later promised to gather them'
  - where: 'note 25:22 “The remnant at Mizpah”'
    claim: 'The Church''s footnote sends the reader to Jeremiah 40 for Gedaliah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: '22a “Gedaliah”: Jer. 40:5 (1–6); 43:6.'
  - where: 'note 25:22 “The remnant at Mizpah”'
    claim: 'Ahikam son of Shaphan and Shaphan the scribe were among those Josiah sent to inquire about the book'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/22?lang=eng'
    quote: 'And the king commanded Hilkiah the priest, and Ahikam the son of Shaphan, and Achbor the son of Michaiah, and Shaphan the scribe, and Asahiah a servant of the king’s, saying,'
  - where: 'note 25:27 “The head of Jehoiachin lifted up”'
    claim: 'To lift up the head means to show favor, as when Pharaoh released the butler and restored him'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/25.htm'
    quote: 'did lift up the head of Jehoiachin] For the expression, signifying ‘to shew favour to’, compare Genesis 40:13; Genesis 40:20, where Pharaoh in a similar manner is said to have ‘lifted up the head’ of his chief butler, when he released him from prison and restored him to his post.'
  - where: 'note 25:27 “The head of Jehoiachin lifted up”'
    claim: 'The Hebrew of 25:27 uses nasa (H5375) with rosh (H7218), "lift up the head"'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'נָשָׂ֡א'
  - where: 'note 25:27 “The head of Jehoiachin lifted up”'
    claim: 'Genesis 40:13 and 40:20 use the same two words'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'יִשָּׂ֤א פַרְעֹה֙ אֶת רֹאשֶׁ֔/ךָ'
  - where: 'note 25:27 “The head of Jehoiachin lifted up”'
    claim: 'Evil-merodach was Nebuchadnezzar''s son, king 561–559 B.C.'
    key: bd-evil-merodach
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/evil-merodach?lang=eng'
    quote: 'Son of Nebuchadnezzar and king of Babylon 561–559 B.C. (2 Kgs. 25:27; Jer. 52:31).'
  - where: 'note 25:27 “The head of Jehoiachin lifted up”'
    claim: 'Babylonian ration tablets list oil for Jehoiachin, king of Judah, and his sons, as a prisoner'
    key: sc-knowhy-860
    url: 'https://scripturecentral.org/knowhy/why-do-extra-biblical-sources-matter'
    quote: 'Some of these tablets listed how much food should be given to various prisoners, and one of these tablets listed the rations for King Jehoiachin himself: “ten sila of oil to Jehoiachin, king of Judah . . . and to the sons of the king.”'
  - where: 'note 25:27 “The head of Jehoiachin lifted up”'
    claim: 'Jehoiachin lived out his final days in relative peace and comfort in Babylon'
    key: ot-seminary-2-kings-intro
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-2-kings?lang=eng'
    quote: 'After many years, King Jehoiachin of Judah is released from prison and is allowed to live out his final days in relative peace and comfort in Babylon.'
  - where: christ
    claim: 'The Davidic dynasty ceased politically with Jehoiachin and Zedekiah; Jeremiah''s prophecy of the Davidic Branch remained for a future Davidic descendant'
    key: bowen-ominous-onomastics
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/ominous-onomastics'
    quote: 'In temporal terms, the Davidic dynasty ceased as a political entity with the exile of Jehoiachin and later his uncle Zedekiah to Babylon. Neither Jehoiachin, his son Shealtiel, nor his grandson Zerubbabel reigned as king … this prophecy remained to be fulfilled by a future Davidic descendant.'
  - where: christ
    claim: 'Israel is gathered as God''s children accept the gospel, receive ordinances, and make and keep covenants'
    key: gt-gathering-of-israel
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/gathering-of-israel-study-guide?lang=eng'
    quote: 'Anciently, God scattered the children of Israel because of their wickedness and rebellion. Israel is gathered as God’s children accept the gospel of Jesus Christ, receive the ordinances of salvation and exaltation, make covenants with God, and strive to keep those covenants.'
  - where: christ
    claim: 'President Nelson: the gathering is an essential prelude to the Second Coming and the most important work in the world'
    key: nelson-let-god-prevail
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/10/46nelson?lang=eng'
    quote: 'As an essential prelude to the Second Coming of the Lord, it is the most important work in the world!'
  - where: christ
    claim: 'Matthew traces David''s line through Jechonias'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/1?lang=eng'
    quote: 'And after they were brought to Babylon, Jechonias begat Salathiel; and Salathiel begat Zorobabel;'
  - where: explore
    claim: 'Scripture threads: the fall retold, the temple warning, Lehi, the return, scattering and gathering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/7?lang=eng'
    quote: 'This Ezra went up from Babylon; and he was a ready scribe in the law of Moses'
