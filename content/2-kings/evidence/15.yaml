chapter: 15
claims:
  - where: setting
    claim: 'Azariah and Uzziah are the same person; it is not clear why the text uses both names'
    key: ot-manual-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-12?lang=eng'
    quote: 'They were the same person. It is not clear why the text here uses the two different names.'
  - where: setting
    claim: 'Uzziah is called Azariah; he is named Uzziah in Chronicles and in Isaiah 6:1'
    key: bd-uzziah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/uzziah?lang=eng'
    quote: 'Called Azariah (2 Kgs. 14:21); king of Judah (2 Chr. 26:1); … smitten with leprosy (2 Kgs. 15:5; 2 Chr. 26:19); earthquake in his reign (Isa. 6:1; Amos 1:1; Zech. 14:5)'
  - where: setting
    claim: 'Tiglath-pileser III (745–727) made the first sustained attempt to incorporate Syria; took tribute from Damascus and Samaria; after their revolt destroyed Damascus and depopulated Gilead and Naphtali'
    key: bd-assyria
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/assyria-and-babylonia?lang=eng'
    quote: 'no sustained attempt to incorporate Syria in the empire was made till the reign of Tiglath-pileser Ⅲ (745–727). In 738 he took tribute from Damascus and Samaria (2 Kgs. 15:19); in 734 these powers revolted and the result of a fresh war was the destruction of Damascus, the depopulation of Gilead and Naphtali (2 Kgs. 15:29)'
  - where: setting
    claim: 'Hosea and Amos prophesied in the days of Uzziah and Jeroboam'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/1?lang=eng'
    quote: 'The word of the LORD that came unto Hosea, the son of Beeri, in the days of Uzziah, Jotham, Ahaz, and Hezekiah, kings of Judah, and in the days of Jeroboam the son of Joash, king of Israel.'
  - where: thread
    claim: 'Judah''s dynasty, resting on an unconditional covenant, had stable government; the north was unstable'
    key: halverson-fall-of-israel
    url: 'https://interpreterfoundation.org/journal/why-did-northern-israel-fall-to-the-assyrians-a-weberian-proposal'
    quote: 'contributing to the establishment of the conditions for a strong and stable government.'
  - where: thread
    claim: 'Tiglath-pileser''s deportation was the first; Sargon II carried the rest of Israel captive (2 Kgs. 17)'
    key: bd-captivities
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng'
    quote: 'In 740 B.C. Tiglath-pileser carried away the trans-Jordanic tribes and the inhabitants of Galilee (2 Kgs. 15:29; 1 Chr. 5:26) to Assyria; in 721 B.C. Sargon Ⅱ carried into captivity the rest of Israel (2 Kgs. 17:3)'
  - where: thread
    claim: 'Rezin and Pekah''s war falls on Ahaz in the next chapter'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/16?lang=eng'
    quote: 'Then Rezin king of Syria and Pekah son of Remaliah king of Israel came up to Jerusalem to war: and they besieged Ahaz, but could not overcome him.'

  - where: 'note 15:5 “Why the LORD smote the king”'
    claim: 'Chronicles: Uzziah, lifted up, went into the temple to burn incense, was withstood by the priests, and was struck with leprosy, cut off from the house of the Lord, with Jotham over the king''s house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/26?lang=eng'
    quote: 'But when he was strong, his heart was lifted up to his destruction: for he transgressed against the Lord his God, and went into the temple of the Lord to burn incense upon the altar of incense.'
  - where: 'note 15:5 “Why the LORD smote the king”'
    claim: 'The priests told Uzziah that burning incense belonged to the priests'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/26?lang=eng'
    quote: 'It appertaineth not unto thee, Uzziah, to burn incense unto the Lord, but to the priests the sons of Aaron, that are consecrated to burn incense'
  - where: 'note 15:5 “Why the LORD smote the king”'
    claim: 'The passage is used to show the need for divine authority; Uzziah, a fairly good king, became lifted up and usurped priesthood authority'
    key: ot-manual-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-12?lang=eng'
    quote: 'They use it to show that it is necessary to have divine authority to act in the ordinances and offices of the Church. … Uzziah was a fairly good king and, as such, prospered and became strong. But at that point he became lifted up and usurped priesthood authority'

  - where: 'note 15:12 “Jehu''s fourth generation”'
    claim: 'The Church''s footnote at verse 10 points to Amos 7:9, and at verse 12 to Hosea 1:4 and 2 Kgs. 10:30'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: '“smote”: Amos 7:9 (7–9).'
  - where: 'note 15:12 “Jehu''s fourth generation”'
    claim: 'The footnote at verse 12 points to Hosea 1:4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: '“Jehu”: Hosea 1:4.'
  - where: 'note 15:12 “Jehu''s fourth generation”'
    claim: 'The promise to Jehu of the fourth generation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/10?lang=eng'
    quote: 'thy children of the fourth generation shall sit on the throne of Israel.'

  - where: 'note 15:10 “Why Israel''s throne would not hold”'
    claim: 'No prophet in Judah threatened that David''s dynasty would fail, because his covenant was unconditional'
    key: halverson-fall-of-israel
    url: 'https://interpreterfoundation.org/journal/why-did-northern-israel-fall-to-the-assyrians-a-weberian-proposal'
    quote: 'at no point in the Biblical record does any prophetic voice in the kingdom of Judah rise up to call the king’s political authority into serious question with the threat that the unconditional covenant was being revoked and that the dynasty was going to fail.'
  - where: 'note 15:10 “Why Israel''s throne would not hold”'
    claim: 'Jeroboam''s kingdom was founded on a conditional promise through Ahijah'
    key: halverson-fall-of-israel
    url: 'https://interpreterfoundation.org/journal/why-did-northern-israel-fall-to-the-assyrians-a-weberian-proposal'
    quote: 'When Ahijah delivered to Jeroboam the promise of the kingdom and a dynasty, there was a significant difference from the promise that David received: David’s promise was unconditional; Jeroboam’s promise was conditional.'
  - where: 'note 15:10 “Why Israel''s throne would not hold”'
    claim: 'Of nineteen northern kings, eight were murdered in coups and seven died naturally'
    key: halverson-fall-of-israel
    url: 'https://interpreterfoundation.org/journal/why-did-northern-israel-fall-to-the-assyrians-a-weberian-proposal'
    quote: 'of the nineteen kings that ruled, eight were murdered in military coups, one committed suicide, one died from injuries sustained in a fall, one was killed in battle, and one was taken into captivity. Only seven died from natural causes.'
  - where: 'note 15:10 “Why Israel''s throne would not hold”'
    claim: 'Hosea prophesied in the days of these kings and said they set up kings not by the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/8?lang=eng'
    quote: 'They have set up kings, but not by me: they have made princes, and I knew it not'

  - where: 'note 15:19 “Pul, who is Tiglath-pileser, and the price of a throne”'
    claim: 'Tiglath-pileser III was the throne name of a general named Pulu who took the throne in a coup; Pul of 15:19 is the Tiglath-pileser of 15:29'
    key: pierce-israelite-refugees
    url: 'https://rsc.byu.edu/covenant-compassion/experience-israelite-refugees'
    quote: 'Tiglath-pileser III (Akkadian Tukultī-apil-Ešarra, meaning “my trust is in the son of the Ešarra”) was the throne name of an Assyrian general originally named Pulu who carried out a successful coup to become the Assyrian king.'
  - where: 'note 15:19 “Pul, who is Tiglath-pileser, and the price of a throne”'
    claim: 'Assyrian records mention Menahem''s tribute'
    key: pierce-israelite-refugees
    url: 'https://rsc.byu.edu/covenant-compassion/experience-israelite-refugees'
    quote: 'Examples of Assyrian loyalty or vassal treaties for the land of Israel mention payment of tribute by the Israelite kings Jehu, Joash, and Menahem, as well as oaths for the Philistine cities of Ashkelon and Ekron in the Assyrian annals of Tiglath-pileser III and Sennacherib.'
  - where: 'note 15:19 “Pul, who is Tiglath-pileser, and the price of a throne”'
    claim: 'The prophets warned against trusting Assyria rather than the LORD'
    key: pierce-israelite-refugees
    url: 'https://rsc.byu.edu/covenant-compassion/experience-israelite-refugees'
    quote: 'may have precipitated the prophetic counsel to not place political trust in Assyria or other temporal kings and kingdoms. The prophets Hosea and Isaiah cautioned against and condemned Israel and Judah for making alliances with Assyria.'
  - where: 'note 15:19 “Pul, who is Tiglath-pileser, and the price of a throne”'
    claim: 'Ancient Near Eastern kings took throne names; Pul took the throne name Tiglath-pileser; Esharra is a temple'
    key: sc-knowhy-536
    url: 'https://scripturecentral.org/knowhy/why-did-benjamin-give-multiple-names-for-jesus-at-the-coronation-of-his-son-mosiah'
    quote: 'ancient Semitic and Mesopotamian kings also bestowed important throne names and titles on themselves. … The Mesopotamian king Pul or Pulu took the throne name Tiglath-Pileser, meaning “my trust is the heir of [the temple of the god] Esharra”'
  - where: 'note 15:19 “Pul, who is Tiglath-pileser, and the price of a throne”'
    claim: 'The tribute from Samaria is dated 738'
    key: bd-assyria
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/assyria-and-babylonia?lang=eng'
    quote: 'In 738 he took tribute from Damascus and Samaria (2 Kgs. 15:19)'
  - where: 'note 15:19 “Pul, who is Tiglath-pileser, and the price of a throne”'
    claim: '“Mighty men of wealth” are men of property, not warriors; Menahem taxed them fifty shekels each'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/15.htm'
    quote: 'To collect the requisite amount, Menahem imposed upon all persons of property a tax of fifty shekels each. … חיל גּבּורי: not warriors, but men of property'
  - where: 'note 15:19 “Pul, who is Tiglath-pileser, and the price of a throne”'
    claim: 'Fifty shekels was a sixtieth of a talent, so 60,000 men paid, showing the richness of the time'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/15.htm'
    quote: 'Fifty shekels=one maneh, was the sixtieth part of a talent of silver. Hence the mighty men of wealth must have numbered 60,000, a number which tells of the richness of the time.'
  - where: 'note 15:19 “Pul, who is Tiglath-pileser, and the price of a throne”'
    claim: 'Ahaz later sends to Tiglath-pileser'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/16?lang=eng'
    quote: 'So Ahaz sent messengers to Tiglath-pileser king of Assyria, saying, I am thy servant and thy son: come up, and save me'

  - where: 'note 15:29 “The first captivity”'
    claim: 'Chronicles names the eastern tribes carried away and where'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/5?lang=eng'
    quote: 'he carried them away, even the Reubenites, and the Gadites, and the half tribe of Manasseh, and brought them unto Halah, and Habor, and Hara, and to the river Gozan, unto this day.'
  - where: 'note 15:29 “The first captivity”'
    claim: 'Tiglath-pileser carried off the trans-Jordan tribes and Galilee (dated 740); Sargon II later took the rest of Israel'
    key: bd-captivities
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng'
    quote: 'In 740 B.C. Tiglath-pileser carried away the trans-Jordanic tribes and the inhabitants of Galilee (2 Kgs. 15:29; 1 Chr. 5:26) to Assyria; in 721 B.C. Sargon Ⅱ carried into captivity the rest of Israel'
  - where: 'note 15:29 “The first captivity”'
    claim: 'Galilee conquered and annexed in 732 BC'
    key: pierce-israelite-refugees
    url: 'https://rsc.byu.edu/covenant-compassion/experience-israelite-refugees'
    quote: 'Starting with the Syro-Ephraimite War (2 Kings 16:5–7; Isaiah 7), the Assyrian empire, ruled by Tiglath-pileser III, conquered and annexed the Galilee in 732 BC.'
  - where: 'note 15:29 “The first captivity”'
    claim: 'Isaiah 9:1 describes how the Assyrians had already overcome northern Israel, including Galilee, plunging it into darkness'
    key: sc-knowhy-869
    url: 'https://scripturecentral.org/knowhy/why-was-isaiah-9-important-for-defending-jesus-s-galilean-origin'
    quote: 'Isaiah 9 goes on to describe how the Assyrians had already overcome northern Israel (which included the Galilee area) plunging them into darkness'

  - where: 'note 15:30 “Jotham''s twentieth year”'
    claim: 'Jotham reigned sixteen years, so there must be a mistake in the numbers here or there; such variations make the chronology very difficult until Assyrian and Egyptian records are in order'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/15.htm'
    quote: 'As Jotham is said below in verse 33 to have reigned only sixteen years, there must be some mistake in the numbers either here or there. The occurrence of such variations makes the task of fixing the chronology very difficult'
  - where: 'note 15:30 “Jotham''s twentieth year”'
    claim: 'Ahaz began to reign in Pekah''s seventeenth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/16?lang=eng'
    quote: 'In the seventeenth year of Pekah the son of Remaliah Ahaz the son of Jotham king of Judah began to reign.'

  - where: 'note 15:37 “The war that brings Isaiah to Ahaz”'
    claim: 'Chronicles adds that in Jotham''s reign the people did yet corruptly'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/27?lang=eng'
    quote: 'And he did that which was right in the sight of the Lord, according to all that his father Uzziah did: howbeit he entered not into the temple of the Lord. And the people did yet corruptly.'
  - where: 'note 15:37 “The war that brings Isaiah to Ahaz”'
    claim: 'Damascus and Samaria revolted; the war destroyed Damascus, depopulated Gilead and Naphtali, and Judah accepted Assyrian suzerainty'
    key: bd-assyria
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/assyria-and-babylonia?lang=eng'
    quote: 'in 734 these powers revolted and the result of a fresh war was the destruction of Damascus, the depopulation of Gilead and Naphtali (2 Kgs. 15:29), and the acceptance of Assyrian suzerainty by Judah.'

  - where: christ
    claim: 'Matthew applies Isaiah 9:1–2 to Jesus dwelling in Capernaum; Galilee, though in the shadow of death, would receive light'
    key: sc-knowhy-869
    url: 'https://scripturecentral.org/knowhy/why-was-isaiah-9-important-for-defending-jesus-s-galilean-origin'
    quote: 'This passage also makes specific reference to the people of Galilee, indicating that even those who had died “in the land of the shadow of death,” would receive light in the form of a Messianic child. Matthew applies this prophecy to Jesus and to His Galilean homeland'
  - where: christ
    claim: 'Jesus answers the objection of John 7:52 in John 8:12 using Isaiah 9''s phrasing'
    key: sc-knowhy-869
    url: 'https://scripturecentral.org/knowhy/why-was-isaiah-9-important-for-defending-jesus-s-galilean-origin'
    quote: 'Here, Jesus uses phraseology from Isaiah 9 to indicate that there was indeed a prophecy of an important figure related to Galilee.'
  - where: christ
    claim: 'Application: when life is dark and seems hopeless, there is hope and light through Jesus Christ'
    key: sc-knowhy-869
    url: 'https://scripturecentral.org/knowhy/why-was-isaiah-9-important-for-defending-jesus-s-galilean-origin'
    quote: 'For many, life can be dark, and life can sometimes feel hopeless. But John and Matthew’s use of Isaiah 9 remind everyone that even when things are dark and despair is hard to eliminate, that there is still hope and light through Jesus Christ.'
  - where: christ
    claim: 'Matthew''s words on Capernaum'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/4?lang=eng'
    quote: 'And leaving Nazareth, he came and dwelt in Capernaum, which is upon the sea coast, in the borders of Zabulon and Nephthalim'
  - where: 'note 15:10 “Why Israel''s throne would not hold”'
    claim: 'On this proposal, the unconditional covenant helped give Judah a stable government'
    key: halverson-fall-of-israel
    url: 'https://interpreterfoundation.org/journal/why-did-northern-israel-fall-to-the-assyrians-a-weberian-proposal'
    quote: 'contributing to the establishment of the conditions for a strong and stable government.'
  - where: 'note 15:19 “Pul, who is Tiglath-pileser, and the price of a throne”'
    claim: 'An older commentary took Pul for a separate king whose name had not been found on the Assyrian monuments'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/15.htm'
    quote: 'Pul, whose name has not yet been discovered upon the Assyrian monuments, was the last king of Nineveh of the family of the Derketades'
