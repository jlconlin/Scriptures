chapter: 11
claims:
  - where: setting
    claim: 'Athaliah was the daughter of Ahab and Jezebel and wife of Jehoram of Judah, and brought Baal worship into Judah'
    key: bd-athaliah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/athaliah?lang=eng'
    quote: 'Daughter of Ahab, king of Israel, and his Phoenician wife Jezebel. Athaliah became the wife of Jehoram, king of Judah … and introduced Baal worship into the southern kingdom as her mother had done in the northern kingdom'
  - where: setting
    claim: 'Chronicles tells the story again, with the Levites gathered from the cities of Judah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/23?lang=eng'
    quote: 'And they went about in Judah, and gathered the Levites out of all the cities of Judah, and the chief of the fathers of Israel, and they came to Jerusalem.'
  - where: setting
    claim: 'Kings and Chronicles are two independent extracts from a fuller account, with no irreconcilable contradiction'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/11.htm'
    quote: 'In both accounts we have only short extracts preserved from a common and more complete original, the extracts having been made quite independently of one another and upon different plans … but which contain no irreconcilable contradictions.'

  - where: 'note 11:1 “Ahab''s daughter against David''s house”'
    claim: 'Athaliah killed the royal heirs to secure her position; Joash escaped'
    key: bd-athaliah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/athaliah?lang=eng'
    quote: 'In an effort to solidify her position she destroyed the royal heirs to the throne, but Joash escaped (2 Kgs. 11:1–3; 2 Chr. 22:2–12). She met her death by the sword'
  - where: 'note 11:1 “Ahab''s daughter against David''s house”'
    claim: 'Raiders had carried off all Jehoram''s sons but the youngest, Jehoahaz (Ahaziah)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/21?lang=eng'
    quote: 'and his sons also, and his wives; so that there was never a son left him, save Jehoahaz, the youngest of his sons.'

  - where: 'note 11:2 “The princess who was the priest''s wife”'
    claim: 'Chronicles names her Jehoshabeath and says she was the wife of Jehoiada the priest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/22?lang=eng'
    quote: 'So Jehoshabeath, the daughter of king Jehoram, the wife of Jehoiada the priest, (for she was the sister of Ahaziah,) hid him from Athaliah, so that she slew him not.'

  - where: 'note 11:5 “Why the sabbath”'
    claim: 'Jehoiada did not dismiss the courses going off duty on the sabbath'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/23?lang=eng'
    quote: 'took every man his men that were to come in on the sabbath, with them that were to go out on the sabbath: for Jehoiada the priest dismissed not the courses.'
  - where: 'note 11:5 “Why the sabbath”'
    claim: 'Those coming on duty were divided into three, those who should have been relieved but were kept into two'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/11.htm'
    quote: 'the priests and Levites, who came on the Sabbath and entered upon the week''s service, were divided into three sections; and those who should have been relieved, but were detained, into two.'
  - where: 'note 11:5 “Why the sabbath”'
    claim: 'The crowd was larger than usual because the sabbath was chosen'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/11.htm'
    quote: 'Shewing that there was a numerous convocation. The gathering would be larger than usual because the Sabbath had been chosen for these operations.'

  - where: 'note 11:12 “The crown and the testimony”'
    claim: 'Jehoiada conferred two objects, nēzer (crown, certain) and ʿēdût (far less certain); one view is a list of laws by which the king rules'
    key: ricks-kingship-coronation
    url: 'https://scripturecentral.org/archive/books/book-chapter/kingship-coronation-and-covenant-mosiah-16-0'
    quote: 'At the coronation of Joash, Jehoiada the priest conferred upon him two objects, called the nēzer and the ʿēdût. The meaning of the first term is certain; it means “crown” (2 Kings 11:12). What ʿēdût means is far less certain.'
  - where: 'note 11:12 “The crown and the testimony”'
    claim: 'Ricks relays the view that the king, as possessor of the law, read the book of the covenant to the assembly and made the covenant'
    key: ricks-kingship-coronation
    url: 'https://scripturecentral.org/archive/books/book-chapter/kingship-coronation-and-covenant-mosiah-16-0'
    quote: 'The king, as possessor of the law, would then “read out to the assembly the commandments of the book of the covenant and then . . . make the covenant between Yahweh and his people.”'
  - where: 'note 11:12 “The crown and the testimony”'
    claim: 'The testimony is the book of the law, per Deut. 17:18–19'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/11.htm'
    quote: 'handed him the testimony, i.e., the book of the law, as the rule of his life and action as king, according to the precept in Deuteronomy 17:18-19.'
  - where: 'note 11:12 “The crown and the testimony”'
    claim: 'The word was first used of the law given to Moses (the tables in the ark); the delivery of the Law would form a solemn part of the coronation'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/11.htm'
    quote: 'In Exodus 25:16; Exodus 25:21 it is described as ‘the Testimony which I shall give thee’. … So the delivery of the Law would naturally form a most solemn portion of the coronation ceremony.'
  - where: 'note 11:12 “The crown and the testimony”'
    claim: 'BDB: ʿēdût is the testimony of the Ten Words on the tables; for 2 Kgs 11:12 it proposes a different reading, comparing 2 Sam 1:10'
    key: bdb
    url: 'https://biblehub.com/hebrew/5715.htm'
    quote: '1 testimony of the Ten Words on the tables as a solemn divine charge … For הָעֵדוּת 2 Kings 11:12 2Chronicles 23:11 read probably הַצְּעָדוֺת (compare 2 Samuel 1:10 We and others).'
  - where: 'note 11:12 “The crown and the testimony”'
    claim: 'The king was to write and read a copy of the law all his days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/17?lang=eng'
    quote: 'he shall write him a copy of this law in a book out of that which is before the priests the Levites'

  - where: 'note 11:17 “A covenant for king and people”'
    claim: 'The king''s role rested on two covenants, toward God and toward the people'
    key: ricks-kingship-coronation
    url: 'https://scripturecentral.org/archive/books/book-chapter/kingship-coronation-and-covenant-mosiah-16-0'
    quote: 'was based on two covenants which defined the duties of the crown towards God and towards the people.'
  - where: 'note 11:17 “A covenant for king and people”'
    claim: 'For Israel the temple was the site of coronation; Joash stood by the pillar'
    key: ricks-kingship-coronation
    url: 'https://scripturecentral.org/archive/books/book-chapter/kingship-coronation-and-covenant-mosiah-16-0'
    quote: 'A society’s most sacred spot is the location where the holy act of royal coronation takes place. For Israel, the temple was that site. So we read that during his coronation Joash stood “by a pillar [of the temple], as the manner was” (2 Kings 11:14).'
  - where: 'note 11:17 “A covenant for king and people”'
    claim: 'ʿal ha-ʿammûd is more often “on” the pillar; Josiah stands at the same place to make the covenant (2 Kgs 23:3)'
    key: ricks-kingship-coronation
    url: 'https://scripturecentral.org/archive/books/book-chapter/kingship-coronation-and-covenant-mosiah-16-0'
    quote: 'The preposition ʿal can be translated “by,” but it is much more often rendered “on” or “upon.” Similarly, in 2 Kings 23:3 … He then stands “by” or “on the pillar”—ʿal ha-ʿammûd—and makes a covenant to keep all the commandments.'
  - where: 'note 11:17 “A covenant for king and people”'
    claim: 'Ricks sets 2 Kgs 11:17 beside Benjamin''s covenant: what was reserved for kings is extended to the people'
    key: ricks-kingship-coronation
    url: 'https://scripturecentral.org/archive/books/book-chapter/kingship-coronation-and-covenant-mosiah-16-0'
    quote: 'Again we can find a similar idea in the enthronement of Joash: “And Jehoiada made a covenant between the Lord and the king and the people, that they should be the Lord’s people” (2 Kings 11:17). What was once reserved for kings at coronation has now been extended in Nephite culture to the people generally.'

  - where: 'note 11:12 “The crown and the testimony”'
    claim: 'The Bible records the anointing of a few kings, Joash among them'
    key: ricks-kingship-coronation
    url: 'https://scripturecentral.org/archive/books/book-chapter/kingship-coronation-and-covenant-mosiah-16-0'
    quote: 'The Bible records the anointing of six kings: Saul, David, Solomon, Jehu, Joash, and Jehoahaz.'
  - where: 'note 11:12 “The crown and the testimony”'
    claim: 'Detailed accounts of Solomon''s and Joash''s coronations likely because both kingships were challenged'
    key: ricks-kingship-coronation
    url: 'https://scripturecentral.org/archive/books/book-chapter/kingship-coronation-and-covenant-mosiah-16-0'
    quote: 'it is most likely that we have detailed accounts concerning the coronation of Solomon and Joash specifically because both kingships were challenged.'
  - where: 'note 11:17 “A covenant for king and people”'
    claim: 'Ricks relays scholars'' conclusion that the coronation covenants were made in the temple, the king at the pillar'
    key: ricks-kingship-coronation
    url: 'https://scripturecentral.org/archive/books/book-chapter/kingship-coronation-and-covenant-mosiah-16-0'
    quote: 'Thus scholars have concluded that the covenants made in connection with Israelite coronations were “made in the Temple. . . . The king went up into the House of Yahweh, he had his place by, or on, the pillar . . . and he concluded the covenant before Yahweh.”'

  - where: 'note 11:18 “Baal''s house broken down”'
    claim: 'Athaliah brought Baal worship into Judah'
    key: bd-athaliah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/athaliah?lang=eng'
    quote: 'introduced Baal worship into the southern kingdom as her mother had done in the northern kingdom (2 Chr. 22:2–4; 24:7).'
  - where: 'note 11:18 “Baal''s house broken down”'
    claim: 'Athaliah''s sons broke up the house of God and gave its dedicated things to Baalim'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/24?lang=eng'
    quote: 'For the sons of Athaliah, that wicked woman, had broken up the house of God; and also all the dedicated things of the house of the Lord did they bestow upon Baalim.'

  - where: christ
    claim: 'Joash, in the line of David and the ancestry of Christ, is saved, preserving the royal line'
    key: interpreter-cfm-2026-2-kings-2-7
    url: 'https://interpreterfoundation.org/come-follow-me/old-testament-2026/2-kings-2-7-2'
    quote: 'the child Joash/Jehoash—in the line of David and the ancestry of Christ—is saved from death, thus preserving the royal line'
  - where: christ
    claim: 'Messiah means anointed, from the anointing of kings'
    key: ricks-kingship-coronation
    url: 'https://scripturecentral.org/archive/books/book-chapter/kingship-coronation-and-covenant-mosiah-16-0'
    quote: 'the name Messiah, which was used to refer to several of the kings of Israel, means “anointed,” no doubt referring to the rite of anointing the king during his installation'
  - where: christ
    claim: 'Benjamin''s people, by covenant, are called the children of Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/5?lang=eng'
    quote: 'because of the covenant which ye have made ye shall be called the children of Christ, his sons, and his daughters'
  - where: 'note 11:12 “The crown and the testimony”'
    claim: 'ʿēdût came to stand for the code of law in general, as a testimony of God'
    key: bdb
    url: 'https://biblehub.com/hebrew/5715.htm'
    quote: '2 the code of law in General (late), as a testimony of God'
  - where: christ
    claim: 'What was once reserved for kings at coronation is extended to the people generally'
    key: ricks-kingship-coronation
    url: 'https://scripturecentral.org/archive/books/book-chapter/kingship-coronation-and-covenant-mosiah-16-0'
    quote: 'What was once reserved for kings at coronation has now been extended in Nephite culture to the people generally.'
  - where: when
    claim: 'Jehu reigned twenty-eight years over Israel, from the year Ahaziah died, so Athaliah''s seventh year fell in his reign'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/10?lang=eng'
    quote: 'And the time that Jehu reigned over Israel in Samaria was twenty and eight years.'
  - where: setting
    claim: 'Joash, in the line of David, is saved from death, preserving the royal line'
    key: interpreter-cfm-2026-2-kings-2-7
    url: 'https://interpreterfoundation.org/come-follow-me/old-testament-2026/2-kings-2-7-2'
    quote: 'the child Joash/Jehoash—in the line of David and the ancestry of Christ—is saved from death, thus preserving the royal line'
  - where: 'note 11:17 “A covenant for king and people”'
    claim: 'The temple was Israel''s coronation site, but Solomon, made king before it was built, was crowned at Gihon'
    key: ricks-kingship-coronation
    url: 'https://scripturecentral.org/archive/books/book-chapter/kingship-coronation-and-covenant-mosiah-16-0'
    quote: 'However, the temple had not been built when Solomon became king, so he was crowned at Gihon (see 1 Kings 1:45).'
  - where: 'note 11:12 “The crown and the testimony”'
    claim: 'BDB: II ṣᵉʿādâ, armlet, a band clasping the upper arm; read haṣṣᵉʿādôt at 2 Kgs 11:12 for hāʿēdût'
    key: bdb
    url: 'https://biblehub.com/hebrew/6807.htm'
    quote: 'II. [צְעָדָה] noun feminine armlet, band clasping upper arm … plural הַצְּעָדוֺת Isaiah 3:20 (ladies'' finery); read ׳הַצּ also 2 Kings 11:12 (for ᵑ0 הָעֵדוּת)'
  - where: 'note 11:17 “A covenant for king and people”'
    claim: 'A king received a new name at his crowning; the LORD calls the king his son and confers his coronation name'
    key: ricks-kingship-coronation
    url: 'https://scripturecentral.org/archive/books/book-chapter/kingship-coronation-and-covenant-mosiah-16-0'
    quote: 'In many societies, a king received a new name or throne name when he was crowned king. … During the “royal protocol Yahweh addresses the king in direct speech, calls him his son, invests him with sovereign rights, confers upon him his coronation name'
  - where: 'note 11:17 “A covenant for king and people”'
    claim: 'Many scholars include divine adoption of the king in the enthronement; of Solomon, 2 Sam 7:14'
    key: ricks-kingship-coronation
    url: 'https://scripturecentral.org/archive/books/book-chapter/kingship-coronation-and-covenant-mosiah-16-0'
    quote: 'many scholars include as part of the enthronement procedure the divine adoption of the king. … referring directly to Solomon, declares, “I will be his father, and he shall be my son” (2 Samuel 7:14).'
  - where: 'note 11:17 “A covenant for king and people”'
    claim: 'The new name and divine adoption, once reserved for kings at coronation, Benjamin extends to the people'
    key: ricks-kingship-coronation
    url: 'https://scripturecentral.org/archive/books/book-chapter/kingship-coronation-and-covenant-mosiah-16-0'
    quote: 'What was once reserved for kings at coronation has now been extended in Nephite culture to the people generally. These last two themes—new name and divine adoption—are included in the coronation ritual'
  - where: christ
    claim: 'The new name and divine adoption reserved for kings are extended to the people'
    key: ricks-kingship-coronation
    url: 'https://scripturecentral.org/archive/books/book-chapter/kingship-coronation-and-covenant-mosiah-16-0'
    quote: 'These last two themes—new name and divine adoption—are included in the coronation ritual and further confirm the ancient antecedents of King Benjamin’s address.'
