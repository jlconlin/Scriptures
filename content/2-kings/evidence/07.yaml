chapter: 7
claims:
  - where: when
    claim: 'The king of Israel in the siege is Jehoram'
    key: ot-minute-2-kings-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-7'
    quote: 'Jehoram believed the retreat was some sort of trick to get the Israelites in Samaria to leave the protection of the city.'

  - where: setting
    claim: 'Samaria stood on a hill with steep slopes'
    key: ot-minute-2-kings-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-7'
    quote: 'Samaria was located on a hill with steep slopes, so the lepers would literally descend or “fall” down the hill.'
  - where: thread
    claim: 'Elisha prophesied things that seemed unlikely; Come, Follow Me pairs 7:1–16 with 4:8–17 as the Lord fulfilling His words through prophets'
    key: cfm-ot-2026-28
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/28?lang=eng'
    quote: 'The Lord inspired Elisha to prophesy of things to come—usually, things that seemed unlikely to occur. As you read 2 Kings 4:8–17; 7:1–16, think about how you respond to the word of the Lord through His prophets today.'
  - where: thread
    claim: 'In chapter 6 the chariots were unseen; here the Syrians are made to hear chariots'
    key: ot-minute-2-kings-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-7'
    quote: 'In the previous chapter chariots surrounded the Syrians, but no one could see them except Elisha and his servant. … The miracle of the Syrians hearing chariots was enough to drive them from the camp.'


  - where: 'note 7:1 “A seah of flour for a shekel”'
    claim: 'The measure is a seah, about eight pounds of flour; a shekel normally bought far more, perhaps a hundred pounds; the price was unbelievable only against the famine prices'
    key: ot-minute-2-kings-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-7'
    quote: 'The word translated as “measure” here is the Hebrew word seah, and a seah of flour is about eight pounds. Normally a shekel would buy far more flour, possibly around one hundred pounds. But compared to the prices in the previous chapter, the price is unbelievable'
  - where: 'note 7:1 “A seah of flour for a shekel”'
    claim: 'The price could fall only if the siege were lifted'
    key: ot-minute-2-kings-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-7'
    quote: 'Elisha prophesied that the cost of food would go down, but only if the siege were lifted.'

  - where: 'note 7:2 “Windows in heaven”'
    claim: 'The phrase “a lord on whose hand the king leaned” describes Naaman''s role at 5:18; one of the rulers did not believe the price'
    key: ot-minute-2-kings-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-7'
    quote: 'the price is unbelievable enough that one of the rulers didn’t believe it. Note that the phrase “a lord on whose hand the king leaned” (verse 2) is the same phrase describing Naaman’s role to the king of Syria in 2 Kings 5:18.'
  - where: 'note 7:2 “Windows in heaven”'
    claim: 'Naaman describes the king of Syria leaning on his hand in the house of Rimmon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/5?lang=eng'
    quote: 'when my master goeth into the house of Rimmon to worship there, and he leaneth on my hand'

  - where: 'note 7:3 “Four lepers at the gate”'
    claim: 'By the law of Moses the lepers were excluded from the city'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/7.htm'
    quote: 'Although by the law of Moses these lepers were excluded from the city'
  - where: 'note 7:3 “Four lepers at the gate”'
    claim: 'The law required a leper to live alone outside the camp'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/13?lang=eng'
    quote: 'he is unclean: he shall dwell alone; without the camp shall his habitation be.'
  - where: 'note 7:3 “Four lepers at the gate”'
    claim: 'The lepers were not allowed in the city; “fall” means to defect, and literally to go down Samaria''s steep hill'
    key: ot-minute-2-kings-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-7'
    quote: 'The four lepers were not allowed in the city and were trapped near the gate. Here the verb “to fall” should be taken as “to defect,” … Samaria was located on a hill with steep slopes, so the lepers would literally descend or “fall” down the hill.'

  - where: 'note 7:6 “A noise of chariots”'
    claim: 'In chapter 6 unseen chariots surrounded the Syrians and they could not see where they were led; here hearing chariots drove them from the camp'
    key: ot-minute-2-kings-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-7'
    quote: 'In the previous chapter chariots surrounded the Syrians, but no one could see them except Elisha and his servant. Then the Syrians could not see they were being led to Samaria, where they would be surrounded by an army.'
  - where: 'note 7:6 “A noise of chariots”'
    claim: 'The Hittites of 2 Kgs. 7:6 are the Canaanite nations north of Palestine, from the Orontes to the Euphrates, strong enough to contend with Egypt and Assyria'
    key: bd-hittites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hittites?lang=eng'
    quote: 'in the Bible the name denotes all the Canaanite (as distinguished from the Aramean or Syrian) nations that lived north of Palestine from the Orontes to the Euphrates (1 Kgs. 10:29; 2 Kgs. 7:6). … they were strong enough to contend on equal terms with the kings of Egypt and Assyria.'
  - where: 'note 7:6 “A noise of chariots”'
    claim: 'Leaving the animals seems irrational; siege troops were likely not mounted; soldiers who knew of Elisha may have needed only a pretext to panic'
    key: ot-minute-2-kings-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-7'
    quote: 'fleeing from possible battle without taking horses seems irrational. However, it is likely the soldiers on siege duty were not mounted warriors, … many of the soldiers were aware of Elisha’s abilities and possibly only needed some pretext like the rumor of another army to induce the panic'

  - where: 'note 7:9 “We do not well”'
    claim: 'Though excluded from the city, the lepers still had a citizen''s duty to report the flight'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/7.htm'
    quote: 'Although by the law of Moses these lepers were excluded from the city, they yet had in their degree the duties of citizens to perform, and in neglecting to give tidings of the Syrian flight, they were not acting the citizen’s part.'
  - where: 'note 7:9 “We do not well”'
    claim: '“Some mischief will come upon us” is “punishment will overtake us” or “our iniquity will find us out”; the delay would be found out and punished'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/7.htm'
    quote: 'some mischief will come upon us] R.V. punishment will overtake us. On the margin of R.V. is ‘our iniquity will find us out’. … when it became known they would surely be punished for not giving immediate information.'
  - where: 'note 7:9 “We do not well”'
    claim: 'The lepers went no further than the gate; the warders carried the news to the palace'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/7.htm'
    quote: 'The men themselves would go no further than the gate, but the warders on the wall would carry the news, as soon as they received it, to the royal palace.'
  - where: 'note 7:9 “We do not well”'
    claim: 'The lepers first fed themselves and hid valuables, then their consciences were aroused'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/7.htm'
    quote: 'they first of all satisfied their own hunger with the provisions which they found in the tents, and then took different valuables and concealed them. But their consciences were soon aroused, so that they said: We are not doing right; this day is a day of joyful tidings'

  - where: 'note 7:17 “He saw it but never tasted it”'
    claim: 'Orson Hyde: God was making the Syrians pack animals to carry supplies to His people; the nobleman saw but never tasted; that is the reward of disbelieving the prophets'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'God was making them pack animals to take to his people what they needed. … he was trodden down under foot and stamped to death—he saw it but he never tasted it. That is the reward of those who disbelieve the Prophets of God'
  - where: 'note 7:17 “He saw it but never tasted it”'
    claim: 'The speaker quoted is Elder Orson Hyde'
    key: ot-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng'
    quote: 'Elder Orson Hyde said:'
  - where: 'note 7:17 “He saw it but never tasted it”'
    claim: 'Probably because of rumors of food, the people trampled him; he died in a rush out of the city, not a Syrian attack into it; the story is told twice without naming Elisha'
    key: ot-minute-2-kings-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-kings-7'
    quote: 'Probably because of the rumors of food outside the city, the besieged Samarian citizens trampled the king’s servant who doubted Elisha’s prophecy. It is ironic that he died from a rush out of the city and not from a Syrian attack into the city. The story is told twice in a chiastic structure and without naming Elisha.'

  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: christ
    claim: 'The Lord''s word is fulfilled whether by His own voice or His servants'''
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/1?lang=eng'
    quote: 'my word shall not pass away, but shall all be fulfilled, whether by mine own voice or by the voice of my servants, it is the same.'
  - where: christ
    claim: 'Come, Follow Me applies Elisha''s prophecies of unlikely things to the word of the Lord through prophets today'
    key: cfm-ot-2026-28
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/28?lang=eng'
    quote: 'The Lord inspired Elisha to prophesy of things to come—usually, things that seemed unlikely to occur. As you read 2 Kings 4:8–17; 7:1–16, think about how you respond to the word of the Lord through His prophets today.'
