chapter: 22
claims:
  - where: setting
    claim: 'Amon was killed by his servants; the people of the land made Josiah king'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/21?lang=eng'
    quote: 'And the servants of Amon conspired against him, and slew the king in his own house. And the people of the land slew all them that had conspired against king Amon; and the people of the land made Josiah his son king in his stead.'
  - where: setting
    claim: 'The Bible Dictionary dates Josiah 641–610 B.C.'
    key: bd-josiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/josiah?lang=eng'
    quote: 'King of Judah, 641–610 B.C. (see 2 Kgs. 22–24; 2 Chr. 34–35).'
  - where: setting
    claim: 'Jeremiah called in Josiah''s thirteenth year; Zephaniah prophesied in his days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng'
    quote: 'To whom the word of the LORD came in the days of Josiah the son of Amon king of Judah, in the thirteenth year of his reign.'
  - where: setting
    claim: 'The Book of Mormon originates in Jerusalem in the time following Josiah and the finding of the book of the law'
    key: seely-self-reference
    url: 'https://rsc.byu.edu/they-shall-grow-together/rhetoric-self-reference-deuteronomy-book-mormon'
    quote: 'The Book of Mormon originates in Jerusalem in 600 BC from the time following Josiah and the discovery in the temple of the “book of the law,”'
  - where: setting
    claim: 'Josiah''s reform came not many years before Lehi left Jerusalem'
    key: sc-knowhy-451
    url: 'https://scripturecentral.org/knowhy/why-did-some-in-lehis-time-believe-that-jerusalem-could-not-be-destroyed'
    quote: 'Not many years before Lehi left Jerusalem, Judah’s King Josiah had undertaken a massive religious reformation that centralized worship around the Temple of Jerusalem.'
  - where: setting
    claim: 'Chronicles adds that Josiah began to seek God in his eighth year and to purge the land in his twelfth, before the eighteenth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/34?lang=eng'
    quote: 'For in the eighth year of his reign, while he was yet young, he began to seek after the God of David his father: and in the twelfth year he began to purge Judah and Jerusalem from the high places'
  - where: setting
    claim: 'Ahikam son of Shaphan protected Jeremiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/26?lang=eng'
    quote: 'Nevertheless the hand of Ahikam the son of Shaphan was with Jeremiah, that they should not give him into the hand of the people to put him to death.'
  - where: setting
    claim: 'A man of God named Josiah before his birth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/13?lang=eng'
    quote: 'O altar, altar, thus saith the LORD; Behold, a child shall be born unto the house of David, Josiah by name'
  - where: thread
    claim: 'Josiah tore his clothes in grief, knowing he and his people had not kept the laws'
    key: sc-knowhy-428
    url: 'https://scripturecentral.org/knowhy/how-is-the-use-of-deuteronomy-in-the-book-of-mormon-evidence-for-its-authenticity'
    quote: 'But “when the king had heard the words of the book of the law … he rent his clothes” in grief, knowing that he and his people had not kept the laws in this book (vv. 11–13).'
  - where: thread
    claim: 'Huldah''s answer has two parts, to the people and to the king'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/22.htm'
    quote: 'The first part of her announcement applies "to the man who has sent you to me" (2 Kings 22:15), the second "to the king of Judah, who has sent to inquire of the Lord" (2 Kings 22:18).'
  - where: thread
    claim: 'The judgment was delayed until after Josiah''s death, but certain'
    key: davis-huldah
    url: 'https://mi.byu.edu/old-testament-reflections/a-prophet-named-huldah'
    quote: 'though the Lord, through Huldah, had conceded to delay Judah’s fate until after the righteous king was dead, the doom of the nation as a whole was certain because of decades of unrepentant idolatry and neglect of the law of the Lord.'
  - where: section 3 plain
    claim: '“Gathered” the money (v. 9) is rendered “emptied out”'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/22.htm'
    quote: 'Thy servants have gathered [R.V. emptied out] the money] The verb, in most of its forms is used of ‘pouring out’'
  - where: section 4 plain
    claim: '“The college” is the second quarter of the city'
    key: bdb
    url: 'https://biblehub.com/hebrew/4932.htm'
    quote: '3 second quarter, district, of city, הַמִּשְׁנֶה 2 Kings 22:14 2Chronicles 34:22; Zephaniah 1:10'

  - where: 'note 22:1 “A boy on the throne”'
    claim: 'The people of the land made Josiah king'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/21?lang=eng'
    quote: 'and the people of the land made Josiah his son king in his stead.'
  - where: 'note 22:1 “A boy on the throne”'
    claim: 'The people appointed Amon''s son Josiah king'
    key: ot-seminary-lesson-101
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-2-kings/lesson-101-2-kings-21-25?lang=eng'
    quote: 'He was killed by his servants two years after he became king. The people then appointed Amon’s son Josiah as the next king.'
  - where: 'note 22:1 “A boy on the throne”'
    claim: 'Josiah reformed while young, under Hilkiah''s guidance'
    key: bd-josiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/josiah?lang=eng'
    quote: 'While still young, he made, under the guidance of Hilkiah, a thorough religious reformation, which extended to the northern tribes.'
  - where: 'note 22:1 “A boy on the throne”'
    claim: 'Chronicles: seeking God in the eighth year, purging in the twelfth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/34?lang=eng'
    quote: 'For in the eighth year of his reign, while he was yet young, he began to seek after the God of David his father: and in the twelfth year he began to purge Judah and Jerusalem'
  - where: 'note 22:1 “A boy on the throne”'
    claim: 'Kimball: surprising that Josiah did right, given wicked progenitors and the lost law'
    key: kimball-tpc-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-spencer-w-kimball/chapter-6?lang=eng'
    quote: 'although his immediate progenitors were extremely wicked … This is all the more surprising when we learn that by that time … the written law of Moses had been lost and was virtually unknown, even among the priests of the temple!'

  - where: 'note 22:2 “In the words of the law”'
    claim: 'The phrase is based on Deuteronomy and expresses unwavering adherence to the law'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/22.htm'
    quote: 'The description of his character, "he turned not aside to the right hand and to the left," sc. from that which was right in the eyes of the Lord, is based upon Deuteronomy 5:29; Deuteronomy 17:11, Deuteronomy 17:20, and Deuteronomy 28:14, and expresses an unwavering adherence to the law of the Lord.'
  - where: 'note 22:2 “In the words of the law”'
    claim: 'Josiah, like Hezekiah, followed David'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/22.htm'
    quote: 'Josiah (for the name, see at 1 Kings 13:2), like Hezekiah, trode once more in the footsteps of his pious forefather David'
  - where: 'note 22:2 “In the words of the law”'
    claim: 'The law of the king: copy of the law, read all his days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/17?lang=eng'
    quote: 'that he shall write him a copy of this law in a book … And it shall be with him, and he shall read therein all the days of his life'

  - where: 'note 22:8 “What the book was”'
    claim: 'The scriptures had been lost or hidden under the wicked kings before Josiah'
    key: ot-seminary-lesson-101
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-2-kings/lesson-101-2-kings-21-25?lang=eng'
    quote: 'Explain that the scriptures had been lost or hidden during the reign of the wicked kings before Josiah.'
  - where: 'note 22:8 “What the book was”'
    claim: 'Manasseh reigned fifty-five years (Amon two, 21:19)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/21?lang=eng'
    quote: 'Manasseh was twelve years old when he began to reign, and reigned fifty and five years in Jerusalem.'
  - where: 'note 22:8 “What the book was”'
    claim: 'Kimball: the book Moses had placed in the ark'
    key: kimball-tpc-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-spencer-w-kimball/chapter-6?lang=eng'
    quote: 'At that time Hilkiah, the high priest, found the book of the law, which Moses had placed in the ark of the covenant, and delivered it to King Josiah.'
  - where: 'note 22:8 “What the book was”'
    claim: 'Most scholars: a version of Deuteronomy, possibly more of the Pentateuch'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'Most scholars believe that the book of the law was a version of Deuteronomy, although it could have included more of the Pentateuch (Genesis through Deuteronomy).'
  - where: 'note 22:8 “What the book was”'
    claim: 'Since the 1780s readers have noted the affinity with the specifically Deuteronomic laws'
    key: eliason-josiah
    url: 'https://byustudies.byu.edu/article/is-the-bible-reliable-a-case-study'
    quote: 'Since at least the 1780s, careful Bible readers have noted that the affinity between the specifically Deuteronomic laws—as opposed to the Covenant Code or priestly material—suggests that the 2 Kings narrative recounts the discovery of proto-Deuteronomy in the temple.'
  - where: 'note 22:8 “What the book was”'
    claim: 'The book led to centralizing sacrificial worship at Jerusalem and abolishing the high places'
    key: bd-josiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/josiah?lang=eng'
    quote: 'It made at once a great impression and led to the centralizing of all sacrificial worship at Jerusalem and the abolition of local idolatrous sanctuaries or high places.'
  - where: 'note 22:8 “What the book was”'
    claim: 'Deut. 31:26: the book put in the side of the ark'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/31?lang=eng'
    quote: 'Take this book of the law, and put it in the side of the ark of the covenant of the LORD your God, that it may be there for a witness against thee.'

  - where: 'note 22:11 “Why the king tore his clothes”'
    claim: 'He tore his clothes in grief, knowing they had not kept the laws'
    key: sc-knowhy-428
    url: 'https://scripturecentral.org/knowhy/how-is-the-use-of-deuteronomy-in-the-book-of-mormon-evidence-for-its-authenticity'
    quote: 'he rent his clothes” in grief, knowing that he and his people had not kept the laws in this book (vv. 11–13).'
  - where: 'note 22:11 “Why the king tore his clothes”'
    claim: 'From the commission one infers the curses of Lev. 26 and Deut. 28 had been read; the law was given also to the existing generation'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/22.htm'
    quote: 'we may infer that the curses of the law upon the despisers of the commandments of God in Leviticus 26; Deuteronomy 28:1, and other passages, had been read to the king. … since the law was not only given to the fathers to obey, but also to the existing generation'
  - where: 'note 22:11 “Why the king tore his clothes”'
    claim: 'Jehoiakim and his servants did not rend their garments'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/36?lang=eng'
    quote: 'Yet they were not afraid, nor rent their garments, neither the king, nor any of his servants that heard all these words.'

  - where: 'note 22:14 “Who Huldah was”'
    claim: 'One of only a few women called prophetess; unknown why they went to her; shows her stature'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'She is one of only a few women called a prophetess in the Bible. … It is unknown why King Josiah’s servants went to Huldah to inquire of the Lord rather than to other prophets who were in Jerusalem at the time. But the fact that they went to her demonstrates her spiritual stature among the people.'
  - where: 'note 22:14 “Who Huldah was”'
    claim: 'Jeremiah and Zephaniah were active; Huldah''s oracle used “thus says the LORD” fourfold and was blunt'
    key: davis-huldah
    url: 'https://mi.byu.edu/old-testament-reflections/a-prophet-named-huldah'
    quote: 'Jeremiah was well known in Jerusalem for his dire warnings to the people, and the prophet Zephaniah was also active during this period. … What the prophet Huldah had to say was as blunt and powerful as anything her well-known contemporary prophets may have uttered. It was couched in a fourfold use of the oracular formula “thus says the LORD,”'
  - where: 'note 22:14 “Who Huldah was”'
    claim: '“The prophetess” with the article: a well-known figure'
    key: davis-huldah
    url: 'https://mi.byu.edu/old-testament-reflections/a-prophet-named-huldah'
    quote: 'Huldah is referred to as “the prophetess” (emphasis added), suggesting that, in the author’s mind, she was a well-known figure with a stable reputation as a spokesperson for the Lord.'
  - where: 'note 22:14 “Who Huldah was”'
    claim: 'Her confirmation of the book was a milestone in the formation of the Bible'
    key: davis-huldah
    url: 'https://mi.byu.edu/old-testament-reflections/a-prophet-named-huldah'
    quote: 'In other words, Huldah’s prophetic witness was a significant milestone in the formation of the Bible itself'
  - where: 'note 22:14 “Who Huldah was”'
    claim: 'The officials took the book to Huldah for verification'
    key: eliason-josiah
    url: 'https://byustudies.byu.edu/article/is-the-bible-reliable-a-case-study'
    quote: 'Josiah’s officials discovered the “book of the law” in the course of temple renovations and took it to the prophetess Huldah for verification of its authenticity.'
  - where: 'note 22:14 “Who Huldah was”'
    claim: 'A prophetess has a testimony of Jesus and the spirit of revelation; no priesthood or keys'
    key: gs-prophetess
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/prophetess?lang=eng'
    quote: 'A woman who has received a testimony of Jesus and enjoys the spirit of revelation. A prophetess does not hold the priesthood or its keys.'
  - where: 'note 22:14 “Who Huldah was”'
    claim: 'The gift of prophecy is available to all members'
    key: ot-seminary-lesson-101
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-2-kings/lesson-101-2-kings-21-25?lang=eng'
    quote: 'Huldah was a prophetess in the sense that she had the gift of prophecy. This gift is available to all members of the Lord’s Church.'
  - where: 'note 22:14 “Who Huldah was”'
    claim: 'Mishneh: the second quarter of the city; also Zeph. 1:10'
    key: bdb
    url: 'https://biblehub.com/hebrew/4932.htm'
    quote: '3 second quarter, district, of city, הַמִּשְׁנֶה 2 Kings 22:14 2Chronicles 34:22; Zephaniah 1:10'
  - where: 'note 22:14 “Who Huldah was”'
    claim: 'Zeph. 1:10 names “the second”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zeph/1?lang=eng'
    quote: 'there shall be the noise of a cry from the fish gate, and an howling from the second'

  - where: 'note 22:17 “A judgment repentance did not undo”'
    claim: 'Josiah did his best; the Lord delayed the fate but the doom was certain'
    key: davis-huldah
    url: 'https://mi.byu.edu/old-testament-reflections/a-prophet-named-huldah'
    quote: 'The chroniclers report that Josiah did his best to show Judah’s repentance. … though the Lord, through Huldah, had conceded to delay Judah’s fate until after the righteous king was dead, the doom of the nation as a whole was certain because of decades of unrepentant idolatry and neglect of the law of the Lord.'
  - where: 'note 22:17 “A judgment repentance did not undo”'
    claim: 'After the reform the LORD did not turn from his wrath because of Manasseh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng'
    quote: 'Notwithstanding the LORD turned not from the fierceness of his great wrath, wherewith his anger was kindled against Judah, because of all the provocations that Manasseh had provoked him withal.'

  - where: 'note 22:19 “A tender heart”'
    claim: 'Rākak: to be tender, soft, of heart'
    key: bdb
    url: 'https://biblehub.com/hebrew/7401.htm'
    quote: '[רָכַךְ] verb be tender, weak, soft … 1 be tender, weak, of heart'
  - where: 'note 22:19 “A tender heart”'
    claim: 'In 22:19 the verb means be softened, penitent, parallel to kana Niphal (humbled thyself)'
    key: bdb
    url: 'https://biblehub.com/hebrew/7401.htm'
    quote: 'b. be softened, penitent, "" כָּנַע Niph`al, 2 Kings 22:19 2Chronicles 34:27.'
  - where: 'note 22:20 “In peace, though he died in battle”'
    claim: '“Gathered to his fathers” means to die, used of violent death in battle too; “in peace” = not seeing Jerusalem''s devastation'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/22.htm'
    quote: 'To gather to his fathers means merely to let him die, and is generally applied to a peaceful death upon a sick-bed, like the synonymous phrase, to lie with one''s fathers; but it is also applied to a violent death by being slain in battle (1 Kings 22:40 and 1 Kings 22:34)'
  - where: 'note 22:20 “In peace, though he died in battle”'
    claim: '“In peace” explained by “thine eyes shall not see”'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/2_kings/22.htm'
    quote: 'in peace, i.e., without living to witness the devastation of Jerusalem, as is evident from the words, "thine eyes will not see," etc.'
  - where: 'note 22:20 “In peace, though he died in battle”'
    claim: 'None of the evils in his days; no reference to the war with Egypt'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/2_kings/22.htm'
    quote: 'None of these evils denounced against the nation shall come to pass in thy days. As far as they are concerned thou shalt die in peace. The promise has no reference to the war with Egypt (2 Kings 23:29) in which Josiah was slain at Megiddo.'
  - where: 'note 22:20 “In peace, though he died in battle”'
    claim: 'Josiah died a free man before Babylon; the people stayed settled; kingdom left more in harmony with the Lord'
    key: davis-huldah
    url: 'https://mi.byu.edu/old-testament-reflections/a-prophet-named-huldah'
    quote: 'Though he died in battle with Egypt, Josiah died a free man before he or his people could be brought under the violent oppression of Babylon. During his life, his people remained settled at Jerusalem, and he died “in peace,” having left his kingdom more in harmony with the Lord than it had been when he came to the throne.'
  - where: 'note 22:20 “In peace, though he died in battle”'
    claim: 'Ahab was wounded by an arrow and died'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/22?lang=eng'
    quote: 'And a certain man drew a bow at a venture, and smote the king of Israel between the joints of the harness … So the king died, and was brought to Samaria'

  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: christ
    claim: 'Kimball: Josiah had the law of Moses only; we have the fulness'
    key: kimball-tpc-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-spencer-w-kimball/chapter-6?lang=eng'
    quote: 'Josiah had the law of Moses only. In our scriptures we have the gospel of Jesus Christ in its fulness; and if a taste is sweet, in fulness there is joy.'
  - where: christ
    claim: 'Kimball: return to the scriptures as Josiah did'
    key: kimball-tpc-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-spencer-w-kimball/chapter-6?lang=eng'
    quote: 'I feel strongly that we must all of us return to the scriptures just as King Josiah did and let them work mightily within us, impelling us to an unwavering determination to serve the Lord.'
  - where: christ
    claim: 'Studying the scriptures helps us turn to the Lord'
    key: ot-seminary-lesson-101
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-2-kings/lesson-101-2-kings-21-25?lang=eng'
    quote: 'Studying the scriptures can help us turn to the Lord with all our heart and put away evil influences.'
  - where: explore
    claim: 'Davis''s essay on Huldah'
    key: davis-huldah
    url: 'https://mi.byu.edu/old-testament-reflections/a-prophet-named-huldah'
    quote: 'In this post, I propose to linger without apology over the consequential ministry of one of the Bible’s most unheralded figures, the prophet Huldah.'
