summary: >-
  Second Kings is the book of a prophet's work handed on and a people's long failure to keep
  the covenant. Elijah is taken up and his mantle falls to Elisha, who strikes the Jordan and
  asks "Where is the LORD God of Elijah?". The kings of both kingdoms fall away until Assyria and
  Babylon carry the people off. Yet the book of the law is found in the temple and read, the LORD
  promises David "a light", and the book ends with an heir of David alive and fed in Babylon.
  The quiet center is a fallen mantle: the LORD does not leave His people without a prophet, and
  His word and promise outlast the kings.
motifs:
  - "Primary: Elijah's mantle, a heavy, shaggy cloak of dark goat hair, lying where it fell on the flat stones of the Jordan's bank, one corner in the water, with a worn leather girdle coiled beside it (2 Kgs. 1:8; 2:13–14)."
  - "Supporting: on a fallen block of dressed temple stone at the right, one closed scroll of the law (2 Kgs. 22:8)."
  - "Supporting: on the same stone beside the scroll, one small clay oil lamp, lit, the only flame in the picture (2 Kgs. 8:19)."
composition: >-
  A wide, calm landscape at sunset in the Jordan valley. The hairy mantle and its girdle lie in
  the near foreground on pale river stones, the mantle's corner in the shallow water. Behind them
  a slow, wide river curves away between banks of reeds and trees, with low hills beyond. At the
  right, on fallen squared stones, the closed scroll and the small lit lamp rest on the highest
  block. The sky shades from deep indigo to gold, the sun low at the left. No people, animals,
  chariots, horses, whirlwind, armies, city or smoke.
