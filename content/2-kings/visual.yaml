alt: A heavy, shaggy cloak of dark goat hair lies on pale stones at the edge of a slow river at sunset, one corner in the water, with a worn leather belt coiled beside it; farther along the bank a closed scroll and a small lit clay lamp rest on a fallen block of cut stone, under an indigo-to-gold sky.
key:
  - '**The hairy mantle and the leather girdle** are Elijah''s: the king knew him by them, “an hairy man, and girt with a girdle of leather about his loins” ([[2 Kgs. 1:8]]). When Elijah “went up by a whirlwind into heaven” ([[2 Kgs. 2:11]]), Elisha “took up also the mantle of Elijah that fell from him … and stood by the bank of Jordan,” struck the waters with it, and said, “Where is the LORD God of Elijah?” ([[2 Kgs. 2:13–14]]). The LORD did not leave His people without a prophet.'
  - '**The scroll on the temple stone** is the book the high priest found during Josiah''s repairs: “I have found the book of the law in the house of the LORD” ([[2 Kgs. 22:8]]). The king read it to all the people, “both small and great,” and “made a covenant before the LORD … And all the people stood to the covenant” ([[2 Kgs. 23:2–3]]).'
  - '**The lit lamp** is the LORD''s promise to David: “the LORD would not destroy Judah for David his servant''s sake, as he promised him to give him alway a light” ([[2 Kgs. 8:19]]). Jerusalem falls, but the book''s last verses find a son of David still alive, lifted “out of prison” in Babylon ([[2 Kgs. 25:27]]); the picture sets the two together, as the book does by ending there.'
status: approved
