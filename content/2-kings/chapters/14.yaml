chapter: 14
title: Thine Heart Hath Lifted Thee Up
tagline: Amaziah of Judah keeps the law of Moses, wins back Edom, and in his pride challenges Israel; Jehoash answers with a fable of a thistle and a cedar, breaks down Jerusalem's wall and carries off the temple's treasures; then the LORD, seeing Israel's bitter affliction, restores its borders through Jeroboam II, as Jonah had foretold.
when: 'Amaziah''s twenty-nine years in Judah, from the second year of Joash king of Israel, and the forty-one years of Jeroboam II in Samaria, from Amaziah''s fifteenth year'

setting: |
  Chapter 13 told the north: Jehoahaz and then his son Jehoash, kings of Israel in Jehu's line, the Syrian oppression under Hazael, and the death of Elisha. Chapter 14 goes back to Judah and then follows both kingdoms for a generation. The names repeat. Amaziah is the son of Joash of Judah, whose servants had killed him ([[2 Kgs. 12:20]]); his rival is Jehoash of Israel, also called Joash (the two kings are told apart in the setting of [[2 Kgs. 12]]). Judah had ruled Edom from David's time until Edom broke away under Joram ([[2 Kgs. 8:20]]), and Amaziah sets out to win it back.

  The parallel account in [[2 Chr. 25]] tells Amaziah's reign more fully, and the notes go to it where Kings leaves a question open. In the north, Jeroboam the son of Joash, called Jeroboam II, was of the dynasty of Jehu, “the ablest of the kings of Israel, and the most successful in war”; Amos and Hosea prophesied in his reign. The eighth century brought both kingdoms a wealth not known since David and Solomon. Syria was recovering from Assyrian blows, Assyria was held back by troubles of its own, and Israel and Judah took back territory and trade routes they had lost.

thread: |
  Two kings fill the chapter, and the LORD's dealings with them run against what a reader might expect. Amaziah did right. He kept the law of Moses even in punishing his father's murderers, sparing their children (verse 6; the law is explained at [[Deut. 24:16]]), and he won back Edom. The victory undid him. “Thine heart hath lifted thee up,” his rival tells him (verse 10), and Chronicles shows the pride at work: he set up the gods of the defeated Edomites and silenced the prophet sent to warn him (the note on verse 11). He would not hear, and the war he chose cost Jerusalem its wall, the temple its treasures, and Amaziah his freedom and finally his life.

  Jeroboam II did evil, and under him Israel and Judah together came to hold land that rivaled Solomon's. Kings gives the reason, and it is not the king: the LORD saw Israel's bitter affliction, with no helper left, and had not said He would blot out its name (verses 26–27). The prosperity was mercy, not approval. The people of that age took their wealth as a sure sign of God's pleasure while the kingdom slid toward its fall, and the prophets of Jeroboam's own reign denounced its idolatry and oppression. With Zachariah (verse 29), Jehu's house reaches the fourth generation the LORD had promised it ([[2 Kgs. 10:30]]).

sections:
  - range: 1-7
    heading: Amaziah begins well
    plain: |
      In the second year of Joash son of Jehoahaz, king of Israel, Amaziah son of Joash became king of Judah. He was twenty-five years old when he began to reign, and he reigned twenty-nine years in Jerusalem; his mother was Jehoaddan, from Jerusalem. He did what was right in the LORD's sight, but not as David his ancestor had; he did everything just as his father Joash had done. Still the high places were not removed, and the people went on sacrificing and burning incense there. As soon as the kingdom was firmly in his hand, he executed the servants who had killed his father the king. But he did not put the murderers' children to death, following what is written in the book of the law of Moses, where the LORD commanded: “Fathers shall not be put to death for their children, nor children for their fathers; each one shall be put to death for his own sin.” He killed ten thousand Edomites in the Valley of Salt, took Sela in battle, and named it Joktheel, as it is still called.
  - range: 8-14
    heading: The thistle and the cedar
    plain: |
      Then Amaziah sent messengers to Jehoash son of Jehoahaz, son of Jehu, king of Israel, with a challenge to meet him in battle: “Come, let us face one another.” Jehoash king of Israel sent back this answer to Amaziah king of Judah: “A thistle in Lebanon sent word to a cedar in Lebanon, ‘Give your daughter to my son as his wife.’ Then a wild beast of Lebanon passed by and trampled the thistle. You have indeed beaten Edom, and it has made you proud. Enjoy your glory, and stay at home. Why stir up trouble that will bring you down, you and Judah with you?” But Amaziah would not listen. So Jehoash king of Israel marched out, and he and Amaziah king of Judah faced one another at Beth-shemesh, a town of Judah. Judah was beaten by Israel, and every man fled home. Jehoash king of Israel captured Amaziah king of Judah, the son of Jehoash son of Ahaziah, at Beth-shemesh. Then he came to Jerusalem and broke down its wall for four hundred cubits, from the Gate of Ephraim to the Corner Gate. He took all the gold and silver and all the vessels found in the house of the LORD and in the treasuries of the king's house, took hostages as well, and went back to Samaria.
  - range: 15-22
    heading: Two kings die, and a young king is crowned
    plain: |
      The rest of what Jehoash did, his might, and how he fought Amaziah king of Judah, are written in the book of the chronicles of the kings of Israel. Jehoash died and was buried in Samaria with the kings of Israel, and his son Jeroboam reigned in his place. Amaziah son of Joash, king of Judah, lived fifteen years after the death of Jehoash son of Jehoahaz, king of Israel. The rest of Amaziah's acts are written in the book of the chronicles of the kings of Judah. A conspiracy was formed against him in Jerusalem, and he fled to Lachish; but they sent men after him to Lachish and killed him there. They brought his body back on horses, and he was buried in Jerusalem with his fathers in the city of David. All the people of Judah took Azariah, who was sixteen years old, and made him king in place of his father Amaziah. After his father the king had died, he built Elath and restored it to Judah.
  - range: 23-29
    heading: Jeroboam II and the borders restored
    plain: |
      In the fifteenth year of Amaziah son of Joash, king of Judah, Jeroboam son of Joash became king of Israel in Samaria, and he reigned forty-one years. He did what was evil in the LORD's sight; he did not turn from any of the sins of Jeroboam son of Nebat, who made Israel sin. He restored Israel's border from the entrance of Hamath to the sea of the plain, as the LORD God of Israel had said through His servant Jonah son of Amittai, the prophet from Gath-hepher. For the LORD saw how bitter Israel's affliction was: there was no one left at all, great or small, and no one to help Israel. The LORD had not said that He would blot out the name of Israel from under heaven, and He saved them through Jeroboam son of Joash. The rest of Jeroboam's acts, all he did, his might, how he fought, and how he recovered for Israel Damascus and Hamath, which had belonged to Judah, are written in the book of the chronicles of the kings of Israel. Jeroboam died and was buried with his fathers, the kings of Israel, and his son Zachariah reigned in his place.

notes:
  - ref: 3
    phrase: yet not like David his father
    kind: history
    title: Right, but not like David
    body: |
      Amaziah's verdict comes with a qualification. Kings measures each king of Judah against David (the form is explained at [[1 Kgs. 15:3]]), and Amaziah is measured instead against his own father. That comparison carries a limit of its own, since Joash had done right “all his days wherein Jehoiada the priest instructed him” ([[2 Kgs. 12:2]]; the note there tells how that ended). The parallel account in Chronicles names what Amaziah lacked: he did right “but not with a perfect heart” ([[2 Chr. 25:2]]). The high places stayed in his reign as in his father's (verse 4; they are explained at [[1 Kgs. 3:2]]).

      Chronicles goes on to tell how, after his victory over Edom, he set up the Edomites' gods as his own (the note on verse 11).
    sources: [lds-scriptures]

  - ref: 7
    phrase: took Selah by war, and called the name of it Joktheel
    kind: history
    title: Edom, and the rock called Joktheel
    body: |
      Amaziah's first war won back a land Judah had lost under Joram (the setting). Edom lay south of the Dead Sea and was not part of Israel's inheritance. Its people descended from Esau and were Israel's kin, yet the two peoples fought again and again.

      The city he took is called in Hebrew *ha-selaʿ*, “the Sela,” a name that means “the rock”: Sela was the rock city of Edom. Where it stood is uncertain: an old identification with Petra has been both questioned and defended. Amaziah gave it a new name, Joktheel, whose meaning is uncertain.
    sources: [bd-edom, oshb-wlc, strongs-concordance, bdb]

  - ref: 8
    phrase: Come, let us look one another in the face
    kind: history
    title: A challenge to war
    body: |
      “Let us look one another in the face” is a Hebrew idiom for going to war: Amaziah is declaring war on Israel. Kings gives no reason. Chronicles tells of a grievance just before the challenge. Preparing for Edom, Amaziah had hired a hundred thousand soldiers from Israel for a hundred talents of silver. A man of God warned him that the LORD was not with Israel, and he sent them home ([[2 Chr. 25:6–10]]). They went home angry, and while Amaziah was in Edom they fell on the cities of Judah, killing three thousand and taking much spoil ([[2 Chr. 25:13]]). Chronicles itself says only that Amaziah then “took advice” and sent the challenge ([[2 Chr. 25:17]]); the Church's reading joins the two, so that the raid is why he declared war.

      Even so, the challenge was rash. Coming fresh from his victory, Amaziah rose up against Israel, and the war came close to destroying Judah.
    sources: [ot-manual-12, lds-scriptures, vandyke-ogden-twelve]

  - ref: 9
    phrase: The thistle that was in Lebanon sent to the cedar that was in Lebanon
    kind: symbol
    title: The thistle and the cedar
    body: |
      Jehoash answers the challenge with a fable, as Jotham had once answered the men of Shechem with a fable of trees ([[Judg. 9:8–15]], where the fable has its own notes). Amaziah and Judah are the thistle, a weed that dries up in the summer heat; Jehoash and Israel are the cedar, the giant tree of Lebanon. The thistle asks the cedar for its daughter as though the two were equals, and the request may stand for one Amaziah really made: he “evidently asked for a royal princess as part of an official state apology.” Jehoash answers that a passing beast will trample the thistle without a glance while the cedar stands untouched. The fable pictures a proud man who overrates his strength and asks for what lies beyond his station, and the sudden ruin that can come on him in the middle of his plans. Its tone is contempt. Words could hardly say more plainly how little Jehoash thought of Judah's power.

      Verse 10 applies it. “Thine heart hath lifted thee up” means that the victory over Edom has made Amaziah high-minded, and “glory of this, and tarry at home” tells him to be content with the fame he won there and stay home.
    sources: [ot-manual-12, cambridge-kings, keil-kings, lds-scriptures]

  - ref: 11
    phrase: But Amaziah would not hear
    kind: history
    title: Why Amaziah would not hear
    body: |
      Chronicles explains Amaziah's deafness, and the explanation is idolatry. Coming back from the slaughter of the Edomites, he brought their gods home, set them up as his own, bowed down to them and burned incense to them ([[2 Chr. 25:14]]). The LORD sent a prophet to ask why he had sought gods “which could not deliver their own people out of thine hand,” and the king cut him off: “Art thou made of the king’s counsel? forbear” ([[2 Chr. 25:15–16]]). The prophet stopped, saying that God had determined to destroy the king “because thou hast done this, and hast not hearkened unto my counsel” ([[2 Chr. 25:16]]).

      So when Jehoash's warning came, Chronicles reads the refusal as the judgment already at work: “it came of God, that he might deliver them into the hand of their enemies, because they sought after the gods of Edom” ([[2 Chr. 25:20]]). A king who had silenced the LORD's prophet would not listen to his enemy either.
    sources: [lds-scriptures]

  - ref: 19
    phrase: they made a conspiracy against him in Jerusalem
    kind: history
    title: Fifteen years, and a conspiracy
    body: |
      Amaziah outlived his rival Jehoash by fifteen years (verse 17), and both histories end his reign with a plot. On one Latter-day Saint reading of the period, he was released and allowed to take back his throne, but as a vassal of the king of Israel, and the plots to remove him came on the heels of those humiliations. Chronicles dates the conspiracy from his apostasy: “after the time that Amaziah did turn away from following the Lord they made a conspiracy against him in Jerusalem” ([[2 Chr. 25:27]]).

      He fled to Lachish, a city of Judah between Hebron and the coast that Rehoboam had fortified, and his pursuers killed him there. His father had died by a conspiracy too ([[2 Kgs. 12:20]]).
    sources: [vandyke-ogden-twelve, lds-scriptures, bd-lachish]

  - ref: 21
    phrase: took Azariah, which was sixteen years old
    kind: history
    title: Azariah, also called Uzziah
    body: |
      The sixteen-year-old the people made king is the Uzziah of Chronicles and the prophets, the same king under another name. Chronicles credits him with building Elath (verse 22), with victories over the Philistines and with fortifying Jerusalem, and tells how he was struck with leprosy ([[2 Chr. 26]]). Isaiah dates his vision of the Lord on His throne to “the year that king Uzziah died” ([[Isa. 6:1]]), and Amos dates his prophecy to Uzziah's days ([[Amos 1:1]]). The reign itself is told in [[2 Kgs. 15:1–7]].

      Elath, the town he rebuilt, was an Edomite town on the Gulf of Aqaba and a naval station under the kings ([[1 Kgs. 9:26]]).
    sources: [bd-uzziah, bd-elath, lds-scriptures]

  - ref: 25
    phrase: his servant Jonah, the son of Amittai, the prophet, which was of Gath-hepher
    kind: history
    title: Jonah son of Amittai
    body: |
      The prophet whose word Jeroboam fulfilled is the Jonah of the book of Jonah, named here by his father and his town. Gath-hepher was in Zebulun, a small village north of Nazareth in Galilee. He lived under Jeroboam II and foretold his success in restoring Israel's ancient borders, and the book of Jonah tells an episode from the life of the same man. On one Latter-day Saint reading, he was a court prophet who apparently had a local mission to Jeroboam's court in Samaria, but the LORD had other plans for him ([[Jonah 1:1–2]]); the book's own setting is at [[Jonah 1]].

      The two borders of the prophecy, “the entering of Hamath” in the north and “the sea of the plain” in the south, are explained at [[Amos 6:14]]. A prophet of the LORD foretold good for a king who did evil (verse 24); verses 26–27 give the reason, and the next note takes it up.
    sources: [bd-jonah, vandyke-ogden-twelve, lds-scriptures]

  - ref: 26
    phrase: there was not any shut up, nor any left, nor any helper for Israel
    kind: history
    title: None shut up, nor any left
    body: |
      Verse 26 borrows its words from the song of Moses, where the LORD “shall judge his people, and repent himself for his servants, when he seeth that their power is gone, and there is none shut up, or left” ([[Deut. 32:36]]). The Hebrew pair is the same in both places, *ʿāṣûr* and *ʿāzûb*, “shut up” and “left,” and the expression means that there was no one at all, great or small, to whom Israel could look for help. Syria's wars had taken the land east of the Jordan and more ([[2 Kgs. 13:3]], [[2 Kgs. 13:7]]), and read this way, the echo shows the northern kingdom brought to the extremity Moses had foreseen, where the LORD had to step in if His people were not to perish.

      Verse 27 gives the reason the help came to an evil king's reign: the LORD “said not that he would blot out the name of Israel from under heaven.” He had not yet spoken the sentence of rejection, and there was still room to repent. Chapter 13 says the same in its own words: the LORD “had compassion on them, … because of his covenant with Abraham, Isaac, and Jacob, and would not destroy them, neither cast he them from his presence as yet” ([[2 Kgs. 13:23]]), and He had given Israel “a saviour” ([[2 Kgs. 13:5]]), whom one reading takes to be Jeroboam, though chapter 13 also credits his father with winning back cities from Syria ([[2 Kgs. 13:25]]). The reprieve was not the end: the sentence came at last, and the LORD “removed them out of his sight” ([[2 Kgs. 17:18]]).
    sources: [keil-kings, cambridge-kings, oshb-wlc, lds-scriptures]

  - ref: 28
    phrase: Hamath, which belonged to Judah, for Israel
    kind: history
    title: Damascus and Hamath, which belonged to Judah
    body: |
      Damascus and Hamath were never towns of Judah's kingdom, and the phrase looks back to what they had been under David and Solomon. David had put garrisons in Damascus, and the Syrians became his servants ([[2 Sam. 8:6]]); Toi king of Hamath paid him tribute ([[2 Sam. 8:9–10]]); and in Solomon's day Hamath was part of his realm, where he built store cities ([[2 Chr. 8:4]]). Having once been held by David's house, both could be said to be “recovered” when Jeroboam took them for Israel. The claim has a limit: the city of Hamath never belonged to Israel and lay outside the borders Moses set, so what was recovered there was the land of the kingdom, not the city, while Damascus itself had been David's and was not wholly lost under Solomon.

      Together, Jeroboam's Israel and Uzziah's Judah held land that rivaled Solomon's two centuries earlier. It was a time of confidence, open trade and wealth, and of the pride that came with it.
    sources: [cambridge-kings, keil-kings, vandyke-ogden-twelve]

christ: |
  The prophet of verse 25 is the Jonah whose three days in the fish Jesus made “the sign of the prophet Jonas,” the sign of His own death and Resurrection ([[Matt. 12:39–40]]; see the note on [[Jonah 1:17]]). And the LORD who “saw the affliction of Israel” when there was no “helper for Israel” (verse 26) is Jehovah, “the premortal Jesus Christ,” acting as the song of Moses said He would when His people's power was gone ([[Deut. 32:36]]).

  Amaziah's victory lifted up his heart until he would hear neither the prophet nor his rival (verses 10–11), and the pride cost Jerusalem its wall. Israel's wealth under Jeroboam was the Lord's compassion on a people with no other helper, not His approval of their king (verses 24–27). Success is not the Lord's verdict on a life, and the Lord who saw Israel's bitter affliction when no one else could help sees His people's affliction still.

explore: |
  - **The same reign in Chronicles.** [[2 Chr. 25]], with the hired soldiers, the gods of Edom, and the two prophets Amaziah heard and would not hear.
  - **Jotham's fable.** [[Judg. 9:7–21]], the trees that would not be king.
  - **Jeroboam's Israel as its prophets saw it.** [[Amos 6:1–14]] and [[Amos 7:10–17]].

