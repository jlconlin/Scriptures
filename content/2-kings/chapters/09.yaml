chapter: 9
title: This Is the Word of the LORD
tagline: Elisha sends one of the sons of the prophets to anoint Jehu king in secret at Ramoth-gilead; Jehu drives to Jezreel, kills Joram son of Ahab in Naboth's field and has Ahaziah of Judah struck down, and Jezebel, painted and crowned at her window, is thrown down and eaten by dogs, as Elijah had said.
when: 'The end of the twelve-year reign of Joram (Jehoram) son of Ahab over Israel, in the one year of Ahaziah king of Judah'

setting: |
  Chapter 9 begins Jehu's revolt, which runs through chapter 10 and ends the dynasty of Omri and Ahab. Israel's king is Joram (also spelled Jehoram), Ahab's son, who has reigned twelve years in Samaria ([[2 Kgs. 3:1]]). He has been wounded fighting Hazael of Syria at Ramoth-gilead and has gone back to Jezreel to recover, and Ahaziah king of Judah, whose mother was of Ahab's house, has come down to see him ([[2 Kgs. 8:26–29]]). The army is left holding Ramoth-gilead under its captains, and one of them is Jehu.

  Behind the chapter stand two words spoken to Elijah. At Horeb the LORD told him to anoint Jehu son of Nimshi king over Israel ([[1 Kgs. 19:16]]). In Naboth's vineyard at Jezreel he pronounced the sentence on Ahab's house and on Jezebel, and the LORD, seeing Ahab humble himself, put it off to his son's days ([[1 Kgs. 21:21–29]]). Jezebel, the Phoenician princess Ahab married, is still alive as the king's mother (verse 22). Hosea later named his first son Jezreel, for “I will avenge the blood of Jezreel upon the house of Jehu” ([[Hos. 1:4]]); that note and the one at [[2 Kgs. 10:30]] take up how the prophets judged the revolt.

thread: |
  Chapter 9 is the keeping of words spoken years before, and the text keeps pointing back to them. Elijah had been told to anoint Jehu; Elisha now sends a young prophet to do it. Elijah had told Ahab that his house would be cut off and the dogs would eat Jezebel, and the LORD had delayed the evil to his son's days ([[1 Kgs. 21:29]]). In this chapter the son's days come. Joram dies in the very portion of Naboth, and Jehu has the body thrown there “according to the word of the LORD” (verse 26). Jezebel dies at Jezreel, and Jehu, told there is almost nothing left to bury, says, “This is the word of the LORD, which he spake by his servant Elijah the Tishbite” (verse 36).

  Between those words runs a single question. “Is it peace?” ask the king's horsemen, and the king, and Jezebel at her window (verses 17–22, 31), and the captains' “Is all well?” in verse 11 is the same word in Hebrew, *hăšālôm*. Jehu's answer to Joram says why there is none: “What peace, so long as the whoredoms of thy mother Jezebel and her witchcrafts are so many?”

sections:
  - range: 1-10
    heading: Jehu anointed in secret
    plain: |
      Elisha the prophet called one of the sons of the prophets and said to him, “Get ready, take this flask of oil with you, and go to Ramoth-gilead. When you get there, look for Jehu son of Jehoshaphat, son of Nimshi. Go in, have him get up from among his fellow officers, and take him into an inner room. Then take the flask, pour the oil on his head, and say, ‘This is what the LORD says: I have anointed you king over Israel.’ Then open the door and run. Don't wait.”

      So the young man, the young prophet, went to Ramoth-gilead. When he arrived, the commanders of the army were sitting together. “I have a message for you, commander,” he said. “For which of us?” Jehu asked. “For you, commander.” Jehu got up and went into the house, and the young man poured the oil on his head and said to him, “This is what the LORD, the God of Israel, says: I have anointed you king over the LORD's people, over Israel. You are to strike down the house of Ahab your master, so that I may avenge the blood of my servants the prophets, and the blood of all the LORD's servants, shed by Jezebel. The whole house of Ahab will perish. I will cut off every male belonging to Ahab in Israel, bond or free. I will make Ahab's house like the house of Jeroboam son of Nebat and like the house of Baasha son of Ahijah. And the dogs will eat Jezebel in the plot of ground at Jezreel, and no one will bury her.” Then he opened the door and ran.
  - range: 11-13
    heading: The captains proclaim Jehu king
    plain: |
      When Jehu came out to his master's officers, one of them asked him, “Is everything all right? Why did this madman come to you?” He answered, “You know the man and the way he talks.” “That's not true,” they said. “Tell us.” So he said, “He told me this and this: ‘This is what the LORD says: I have anointed you king over Israel.’” At once each of them took his cloak and spread it under Jehu at the top of the stairs. They blew the trumpet and shouted, “Jehu is king!”
  - range: 14-29
    heading: Joram and Ahaziah die
    plain: |
      So Jehu son of Jehoshaphat, son of Nimshi, conspired against Joram. (Joram and all Israel had been holding Ramoth-gilead against Hazael king of Syria, but King Joram had gone back to Jezreel to recover from the wounds the Syrians gave him when he fought Hazael.) Jehu said, “If you are with me, don't let anyone slip out of the city to take the news to Jezreel.” Then Jehu got into his chariot and drove to Jezreel, because Joram was lying there, and Ahaziah king of Judah had come down to see him.

      The lookout on the tower in Jezreel saw Jehu's troop coming and said, “I see a troop of men.” Joram said, “Send a horseman to meet them and ask, ‘Do you come in peace?’” The horseman rode out to meet him and said, “The king asks, ‘Do you come in peace?’” Jehu said, “What do you care about peace? Fall in behind me.” The lookout reported, “The messenger reached them, but he isn't coming back.” The king sent a second horseman, who came to them and said, “The king asks, ‘Do you come in peace?’” Jehu answered, “What do you care about peace? Fall in behind me.” The lookout reported, “He reached them too, and he isn't coming back. And the driving is like the driving of Jehu son of Nimshi: he drives like a madman.”

      “Harness my chariot,” Joram said, and it was harnessed. Joram king of Israel and Ahaziah king of Judah rode out, each in his own chariot, to meet Jehu, and they met him on the plot of ground that had belonged to Naboth the Jezreelite. When Joram saw Jehu he asked, “Do you come in peace, Jehu?” He answered, “How can there be peace, as long as the whoredoms and sorceries of your mother Jezebel are so many?” Joram turned his chariot around and fled, calling to Ahaziah, “Treachery, Ahaziah!” Jehu drew his bow with all his strength and shot Joram between the shoulders; the arrow came out through his heart, and he slumped down in his chariot.

      Jehu said to Bidkar, his officer, “Pick him up and throw him onto the field that belonged to Naboth the Jezreelite. Remember how, when you and I were riding together behind Ahab his father, the LORD laid this sentence on him: ‘Yesterday I saw the blood of Naboth and the blood of his sons, says the LORD, and I will repay you on this very plot of ground, says the LORD.’ So pick him up and throw him onto that plot, as the LORD said.”

      When Ahaziah king of Judah saw this, he fled by the road to the garden house. Jehu went after him, shouting, “Strike him down too!” They struck him in his chariot on the way up to Gur, near Ibleam. He fled to Megiddo and died there. His servants carried him to Jerusalem in a chariot and buried him with his fathers in his tomb in the city of David. Ahaziah had become king over Judah in the eleventh year of Joram son of Ahab.
  - range: 30-37
    heading: Jezebel's end
    plain: |
      When Jehu came to Jezreel, Jezebel heard of it. She painted her eyes, arranged her hair, and looked out of a window. As Jehu came in through the gate, she said, “Do you come in peace, you Zimri, who murdered his master?” He looked up at the window and called, “Who is on my side? Who?” Two or three eunuchs looked down at him. “Throw her down,” he said. They threw her down, and some of her blood spattered on the wall and on the horses, and Jehu trampled her underfoot.

      He went in and ate and drank. Then he said, “See to this cursed woman and bury her, for she was a king's daughter.” But when they went to bury her, they found nothing of her but the skull, the feet and the palms of her hands. They came back and told him, and he said, “This is the word of the LORD that He spoke through His servant Elijah the Tishbite: ‘In the plot of ground at Jezreel the dogs will eat Jezebel's flesh. Jezebel's body will be like dung on the field in the plot at Jezreel, so that no one will be able to say, This is Jezebel.’”

notes:
  - ref: 3
    phrase: pour it on his head, and say, Thus saith the LORD, I have anointed thee king over Israel
    kind: history
    title: Anointed by a son of the prophets
    body: |
      Jehu's anointing carries out a commission the LORD gave Elijah at Horeb: “Jehu the son of Nimshi shalt thou anoint to be king over Israel” ([[1 Kgs. 19:16]]). Elijah is not recorded anointing any of the three he was sent to anoint (see the note at [[1 Kgs. 19:15]]); Elisha, his successor, sees this one done, and sends one of the sons of the prophets with the oil. Kings in Israel were anointed to their office by prophets, as Samuel anointed Saul and David ([[1 Sam. 10:1]]; [[1 Sam. 16:13]]).

      It is done in secret. The young man is to take Jehu away from his fellow officers into an inner chamber, and then to “open the door, and flee, and tarry not.” The captains outside learn what happened only when Jehu, pressed, tells them (verses 11–12). The text gives no reason for the haste; it shows only that the one sent did exactly what he was told.
    sources: [lds-scriptures, bd-anoint]

  - ref: 7
    phrase: that I may avenge the blood of my servants the prophets
    kind: history
    title: Why the house of Ahab
    body: |
      The commission gives its own reason: the blood of the LORD's prophets and servants shed “at the hand of Jezebel.” She had “cut off the prophets of the LORD” in Elijah's day, when Obadiah hid a hundred of them in caves ([[1 Kgs. 18:4]]), and Elijah at Horeb said that Israel had “slain thy prophets with the sword” ([[1 Kgs. 19:14]]). Her marriage to Ahab did more than any other single event to bring the northern kingdom down, for through her came “the worst forms of Phoenician worship in place of the worship of Jehovah.”

      The sentence was not new. Elijah had pronounced it on Ahab in Naboth's vineyard, in the terms already used against the houses of Jeroboam and Baasha (verses 8–9; the comparison is explained at [[1 Kgs. 21:22]]). Verse 8's idiom, every male of the house, bond or free, is explained at [[1 Kgs. 14:10]]. When Ahab humbled himself, the LORD put the sentence off to “his son's days” ([[1 Kgs. 21:29]]). Joram is that son.

      Whether the LORD approved of the way Jehu carried it out is a separate question. The LORD's later commendation of Jehu, its limit in the next verse, the Church's reading of both, and Hosea's word on “the blood of Jezreel” are taken up at [[2 Kgs. 10:30]] and [[Hos. 1:4]].

      The theme page [Innocent Blood](/2-kings/themes/innocent-blood/) follows the book's account of innocent blood from Naboth's vineyard to the fall of Jerusalem.
    sources: [lds-scriptures, bd-jezebel]

  - ref: 13
    phrase: took every man his garment, and put it under him on the top of the stairs
    kind: history
    title: Garments on the stairs
    body: |
      The captains made Jehu king on the spot, and the garments were their homage. They had called the messenger a madman and Jehu's first answer an evasion (“It is false,” verse 12), but once they heard “Thus saith the LORD, I have anointed thee king over Israel,” they acted at once. Laying their cloaks at his feet was a ceremony of acknowledging a king, a sign of their loyalty and of his authority, and the trumpet and the cry “Jehu is king” made the proclamation.

      The Hebrew behind “the top of the stairs” is difficult, and the early translators could only guess at it. One older reading takes it as the bare steps: each man's garment, a large cloth wrapped round the body, was spread like a carpet on them to serve Jehu for a throne, for they did not wait to find a fit place for one. The same reading sets these signs of homage beside the welcome Jesus received on His last entry into Jerusalem, when “a very great multitude spread their garments in the way” ([[Matt. 21:7–8]]).
    sources: [ot-manual-6, keil-kings, lds-scriptures]

  - ref: 20
    phrase: he driveth furiously
    kind: words
    title: Driving like a madman
    body: |
      The watchman's “furiously” is, in Hebrew, “in madness” (*bᵉšiggāʿôn*), a hyperbole for “madly.” It comes from the same root as the captains' word for the prophet in verse 11, “this mad fellow” (*hamᵉšuggāʿ*), a word Hebrew used “of prophets, contemptuously” (so too [[Hosea 9:7]] and [[Jer. 29:26]]). The soldiers' sneer at the man who anointed Jehu comes back as the watchman's description of Jehu himself, whose way of driving was well enough known to be recognized from the tower.

      The old translations did not all take the word so. The Greek and Latin versions read it as the King James does, but Josephus has Jehu coming on “leisurely and in good order,” and the Aramaic and Arabic versions explain the word as “quietly.” The difference reaches the scene. In Josephus' retelling the watchman reports only “a troop of horsemen,” and says nothing of Jehu being known from the tower by his driving. A slow approach would also account for the time the story needs. After the company comes in sight, Joram sends out one horseman, then another, and then rides out himself with Ahaziah, all before the company reaches Jezreel. For that reason the slower reading has been judged the likelier. The King James sides with the Greek, and the verse leaves the question open.
    sources: [oshb-wlc, bdb, cambridge-kings, josephus-antiquities]

  - ref: 22
    phrase: the whoredoms of thy mother Jezebel and her witchcrafts
    kind: words
    title: Whoredoms and witchcrafts
    body: |
      Jehu's charge against Jezebel is idolatry, not a catalogue of private sins. The word for “whoredoms” here (*zᵉnûnîm*) is religious: the faithlessness of turning to other gods, the sense it has in Hosea ([[Hosea 4:12]]). Her “witchcrafts” (*kᵉšāpîm*, sorceries) are figurative here, “seductive and corrupting influences,” and the pair stands together in Nahum's picture of Nineveh as a harlot, “the mistress of witchcrafts” ([[Nahum 3:4]]). The charge is what Kings has already told of her: the daughter of the king of the Zidonians, through whom Ahab “went and served Baal, and worshipped him” ([[1 Kgs. 16:31]]; see the note at verse 7).
    sources: [oshb-wlc, bdb, lds-scriptures]

  - ref: 27
    phrase: Smite him also in the chariot
    kind: history
    title: Why the king of Judah died too
    body: |
      Ahaziah of Judah died because he belonged, through his mother and by his conduct, to the house Jehu was sent to destroy. His father had married “the daughter of Ahab” ([[2 Kgs. 8:18]]); his mother was Athaliah, “the daughter of Omri” ([[2 Kgs. 8:26]]); and he “walked in the way of the house of Ahab” ([[2 Kgs. 8:27]]). He had come down to visit Joram (verse 16) and rode out beside him. Chronicles draws the conclusion in so many words: “the destruction of Ahaziah was of God by coming to Joram” ([[2 Chr. 22:7]]).

      Chronicles tells his death differently. In Kings he is struck in his chariot on the ascent of Gur near Ibleam, flees to Megiddo and dies there. In Chronicles he is found hiding in Samaria, brought to Jehu and slain ([[2 Chr. 22:9]]). Both accounts are brief, and neither explains how its details fit the other's. They agree that he died at Jehu's order and was buried. Kings says he was buried in the city of David with his fathers (verse 28). Chronicles gives the reason he was buried at all: “he is the son of Jehoshaphat, who sought the LORD with all his heart.” Son here means descendant, since Jehoshaphat was his grandfather ([[2 Kgs. 8:16]], 25).
    sources: [lds-scriptures]

  - ref: 30
    phrase: she painted her face, and tired her head
    kind: history
    title: Jezebel at the window
    body: |
      Jezebel prepared herself before she met Jehu. The Hebrew says she set her eyes in *pûk*: antimony, the black mineral powder used to darken the edges of the eyelids and make the eyes look brighter. On one older reading she did it “that she might present an imposing appearance to Jehu and die as a queen; not to allure him by her charms.”

      Her greeting, on the same reading, was a warning. “Had Zimri peace, who slew his master?” is, more literally, “Is it peace, thou Zimri, murderer of his lord?” Zimri had killed his king, reigned seven days and died in the palace he set on fire over himself ([[1 Kgs. 16:10–18]]), and she named him “to point to the fate which Jehu would bring upon himself.” Jehu did not answer her. He asked who in the palace was on his side, and her own eunuchs threw her down (verses 32–33).
    sources: [oshb-wlc, bdb, ot-manual-6, lds-scriptures]

  - ref: 36
    phrase: This is the word of the LORD, which he spake by his servant Elijah the Tishbite
    kind: scripture
    title: The word of Elijah kept
    body: |
      Jehu's last words in the chapter name what has happened as Elijah's prophecy fulfilled. Elijah had said in Naboth's vineyard, “The dogs shall eat Jezebel by the wall of Jezreel” ([[1 Kgs. 21:23]]); the words Jehu recalls are fuller, adding that her body would lie “as dung upon the face of the field,” so that none could say, “This is Jezebel.” He had first sent to have her buried, “for she is a king's daughter”: she was the daughter of Ethbaal, king of the Zidonians ([[1 Kgs. 16:31]]). The burial party found too little left to bury. What it meant to lie unburied is explained at [[1 Kgs. 16:4]], where the same threat falls on Baasha's house.

      Twice in the chapter Jehu ties an event to that word: Joram's body thrown into Naboth's plot “according to the word of the LORD” (verse 26), and Jezebel here. The rest of Ahab's house follows in the next chapter, by the same word spoken to Elijah ([[2 Kgs. 10:17]]).
    sources: [lds-scriptures, bd-jezebel]

christ: |
  The chapter's witness is to the word of the LORD, the premortal Christ (see [[Ex. 3:14]]): what He spoke through Elijah came to pass years later, on the plot of ground He had named. He has said the same of His word in this dispensation ([[D&C 1:38]]; see the chapter on [[2 Kgs. 7]]). What He has promised through His prophets stands as surely as what He spoke through Elijah, even when, as with Ahab's house, years pass before it comes.

explore: |
  - **The sentence on Ahab's house.** [[1 Kgs. 21:17–29]], in Naboth's vineyard, and its delay.
  - **Jehu finishes the work, and its limit.** [[2 Kgs. 10]], with Hosea's later word on the blood of Jezreel ([[Hos. 1:4–5]]).
  - **The Chronicler's account.** [[2 Chr. 22:1–9]], which reads Ahaziah's death as “of God.”

sources: [lds-scriptures, oshb-wlc, bdb, bd-anoint, bd-jezebel, ot-manual-6, keil-kings, cambridge-kings, josephus-antiquities]
