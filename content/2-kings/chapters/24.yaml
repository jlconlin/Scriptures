chapter: 24
title: As the LORD Had Said
tagline: Jehoiakim rebels against Babylon and dies; his young son surrenders Jerusalem after three months and is carried off with the temple's gold and the kingdom's leading men; Nebuchadnezzar sets up Mattaniah as king and names him Zedekiah.
when: 'From the last years of Jehoiakim to the accession of Zedekiah; Jerusalem is taken in the eighth year of Nebuchadnezzar king of Babylon (verse 12)'

setting: |
  Chapter 24 opens a few years after Josiah's death at Megiddo ([[2 Kgs. 23:29]]). Pharaoh-necho had put Josiah's son Eliakim on the throne and renamed him Jehoiakim ([[2 Kgs. 23:34]]); he reigned 609–598 BC. Then the master of Judah changed. Nebuchadnezzar II, who built the Neo-Babylonian or Chaldean empire on the ruins of Assyria and reigned 605–562 BC, defeated Necho's army at Carchemish on the Euphrates in Jehoiakim's fourth year ([[Jer. 46:2]]).

  The chapter covers three kings: Jehoiakim's rebellion and death (verses 1–7), Jehoiachin's three months and the first capture of Jerusalem (verses 8–16), and the enthronement of Zedekiah (verse 17). The first capture took the leaders of the nation into exile, the prophet Ezekiel among them, and Babylon's own cuneiform records confirm it. Verses 18–20 are the opening of [[Jer. 52:1–3]], and their notes are there; the city's end follows in chapter 25.

  This is also where the Book of Mormon begins. Lehi, who had “dwelt at Jerusalem in all his days,” was called “in the commencement of the first year of the reign of Zedekiah” ([[1 Ne. 1:4]]), the king set up in verse 17; when that first year fell is argued in the note on verse 17.

thread: |
  The chapter tells the conquest of Judah twice, once as politics and once as the LORD's doing. The politics are plain. Jehoiakim pays tribute to Babylon and then stops; raiders come; Nebuchadnezzar besieges the city and takes its king, its treasure and its leading men, and puts a king of his own choosing on the throne. But at each turn the narrator names the cause behind the cause. The LORD sends the raiders (verse 2); the blow falls “at the commandment of the LORD” (verse 3); the temple's gold goes “as the LORD had said” (verse 13); and Zedekiah's revolt comes “through the anger of the LORD” (verse 20). Each king in turn is summed up in one line: he “did that which was evil in the sight of the LORD” (verses 9, 19; [[2 Kgs. 23:37]]).

  So the chapter is the word of the prophets coming due. What Isaiah told Hezekiah, what the prophets told Manasseh and what Jeremiah was preaching in Jehoiakim's day ([[Jer. 25:1–11]]) comes to pass in a dozen verses. Yet verse 17 also sets up the king in whose first year the Lord called Lehi, the prophet He would lead out of Jerusalem before the end.

sections:
  - range: 1-7
    heading: Jehoiakim rebels
    plain: |
      In Jehoiakim's days Nebuchadnezzar king of Babylon came up, and Jehoiakim became his vassal for three years; then he turned and rebelled against him. The LORD sent raiding bands against him, of Chaldeans, Syrians, Moabites and Ammonites, and sent them against Judah to destroy it, as the LORD had said through His servants the prophets. It was surely at the LORD's command that this came on Judah, to remove them from His sight for the sins of Manasseh and all that he had done, and for the innocent blood he had shed: he had filled Jerusalem with innocent blood, and the LORD would not pardon it. The rest of Jehoiakim's acts are written in the book of the chronicles of the kings of Judah. Jehoiakim died, and Jehoiachin his son reigned in his place. The king of Egypt did not march out of his own land again, because the king of Babylon had taken everything that had belonged to the king of Egypt, from the Brook of Egypt to the river Euphrates.
  - range: 8-17
    heading: Jehoiachin surrenders, and the first exile
    plain: |
      Jehoiachin was eighteen when he became king, and he reigned three months in Jerusalem. His mother was Nehushta, the daughter of Elnathan of Jerusalem. He did evil in the LORD's sight, just as his father had. At that time the officers of Nebuchadnezzar king of Babylon came up against Jerusalem and laid siege to it, and Nebuchadnezzar himself came to the city while his officers were besieging it. Jehoiachin king of Judah went out to the king of Babylon, with his mother, his servants, his princes and his officials, and the king of Babylon took him prisoner in the eighth year of his own reign. He carried off all the treasures of the LORD's house and of the king's palace, and cut up all the gold vessels that Solomon king of Israel had made for the LORD's temple, as the LORD had said. He carried away all Jerusalem: all the princes and all the men of might, ten thousand captives, and all the craftsmen and smiths. No one was left but the poorest people of the land. He took Jehoiachin to Babylon, with the king's mother, the king's wives, his officials and the leading men of the land; he carried them into exile from Jerusalem to Babylon. All the men of might, seven thousand, and the craftsmen and smiths, a thousand, all of them strong and fit for war, the king of Babylon brought captive to Babylon. Then the king of Babylon made Mattaniah, Jehoiachin's uncle, king in his place, and changed his name to Zedekiah.
  - range: 18-20
    heading: Zedekiah
    plain: |
      Zedekiah was twenty-one when he became king, and he reigned eleven years in Jerusalem. His mother was Hamutal, the daughter of Jeremiah of Libnah. He did evil in the LORD's sight, just as Jehoiakim had. The LORD's anger against Jerusalem and Judah went on until He had cast them out of His presence, and it was through that anger that Zedekiah rebelled against the king of Babylon.

notes:
  - ref: 1
    phrase: 'Jehoiakim became his servant three years: then he turned and rebelled against him'
    kind: history
    title: A vassal who stopped paying
    body: |
      “Became his servant” means that Jehoiakim paid tribute to Babylon, and his rebellion was a refusal to go on paying it; that refusal is what brought Nebuchadnezzar's army to Jerusalem. Judah had been a tributary before. Pharaoh-necho had made Jehoiakim king and laid a tribute on the land ([[2 Kgs. 23:33–35]]), and Babylon's victory over Necho at Carchemish ([[Jer. 46:2]]) gave the tribute a new master.

      Kings does not say how Jehoiakim died. He “slept with his fathers” (verse 6), just as the siege began, and a few months later his son had to surrender the city. Chronicles says Nebuchadnezzar bound him to carry him to Babylon ([[2 Chr. 36:6]]), and Jeremiah had foretold for him “the burial of an ass”; the note at [[Jer. 22:19]] sets the accounts side by side.
    sources: [sc-knowhy-860, lds-scriptures]

  - ref: 2
    phrase: according to the word of the LORD, which he spake by his servants the prophets
    kind: scripture
    title: The word of the prophets coming due
    body: |
      The raiders were Chaldeans and three of Judah's neighbors, but the verse says the LORD sent them, and it says why: He had told Judah so through His prophets. Kings has kept the record of those warnings. In Manasseh's day “the LORD spake by his servants the prophets” that He would “wipe Jerusalem as a man wipeth a dish” and hand the remnant of His inheritance to their enemies ([[2 Kgs. 21:10–14]]). Huldah told Josiah's messengers that the evil written in the book would come on the city ([[2 Kgs. 22:16]]). Isaiah had told Hezekiah that the treasures of his house would be carried to Babylon ([[2 Kgs. 20:17]]), and verse 13 marks that word fulfilled, “as the LORD had said” (the prophecy is explained at [[Isa. 39:6]]). Jeremiah was saying the same in Jehoiakim's Jerusalem, and he called Nebuchadrezzar the LORD's “servant” in bringing it about ([[Jer. 25:9]]).

      One more voice belongs with these, though the Bible does not record it. In the first year of Zedekiah, the king this chapter ends by enthroning, Lehi read in vision that Jerusalem “should be destroyed,” and that many “should be carried away captive into Babylon” ([[1 Ne. 1:13]]). The destruction he foretold comes in chapter 25.
    sources: [lds-scriptures]

  - ref: 3
    phrase: for the sins of Manasseh, according to all that he did
    kind: history
    title: For the sins of Manasseh
    body: |
      Verses 3–4 answer why Judah fell, and the answer reaches back two generations. The blow came “at the commandment of the LORD” for Manasseh's sins and for the innocent blood he shed, “which the LORD would not pardon.” Each phrase repeats what Kings has already said. Manasseh “shed innocent blood very much, till he had filled Jerusalem from one end to another” ([[2 Kgs. 21:16]]), and even after Josiah, the king who turned to the LORD with all his heart, “the LORD turned not from the fierceness of his great wrath… because of all the provocations that Manasseh had provoked him withal” ([[2 Kgs. 23:25–26]]). Jeremiah gives the same reason in the LORD's voice, “because of Manasseh the son of Hezekiah king of Judah, for that which he did in Jerusalem,” in the same oracle in which the LORD says that even Moses and Samuel could not turn Him ([[Jer. 15:1–4]]).

      Manasseh did not sin alone. Kings says that the people “hearkened not” and that he “seduced them to do more evil than did the nations” ([[2 Kgs. 21:9]]), and each king of this chapter did evil as the king before him had (verses 9, 19). Why one reign weighed so heavily is the subject of the note at [[2 Kgs. 21:11]].

      The theme page [Innocent Blood](/2-kings/themes/innocent-blood/) asks why the LORD “would not pardon” this blood, and what the Savior's blood answers instead.
    sources: [lds-scriptures]

  - ref: 7
    phrase: the king of Egypt came not again any more out of his land
    kind: history
    title: Egypt out of the contest
    body: |
      Verse 7 says why no help would come from Egypt. Babylon had taken everything Egypt had held “from the river of Egypt unto the river Euphrates,” and Pharaoh stayed at home. On one older reading, the notice is placed here to show Egypt's position while the Chaldeans conquered Judah: under these circumstances a successful resistance by Judah “was not for a moment to be thought of.”

      The “river of Egypt” is a wadi, not a great river. The Hebrew word is *naḥal*, a torrent or a torrent-valley: a stream bed. This one marked Judah's southern border, where the boundary “went out unto the river of Egypt” to the sea ([[Josh. 15:4]]). So Babylon held everything from Judah's southern edge to the Euphrates.
    sources: [keil-kings, bdb, lds-scriptures]

  - ref: 12
    phrase: the king of Babylon took him in the eighth year of his reign
    kind: history
    title: Babylon's own record of the surrender
    body: |
      Kings and Babylon's own records describe the same event. The Babylonian Chronicles, cuneiform tablets recording the deeds of Babylon's kings, say that Nebuchadnezzar “camped against the city of Judah and on the second day of the month of Adar he took the city and captured the king,” that he “took its heavy tribute and brought them to Babylon,” and that he “appointed a king of his own choice there.” Those three clauses are verses 12, 13 and 17. The Chronicle calls the plunder tribute; Kings says what it was, the treasures of the temple and the gold vessels Solomon had made. The Chronicle's date puts the surrender in 597 BC.

      “His reign” can only be Nebuchadnezzar's, since Jehoiachin had reigned three months (verse 8). From here Kings dates Judah's end by the Babylonian king's years, as it dates the burning of the temple to “the nineteenth year of king Nebuchadnezzar” ([[2 Kgs. 25:8]]). Ezekiel, who was carried away in this deportation, counted from it instead: “the fifth year of king Jehoiachin's captivity” ([[Ezek. 1:2]]).
    sources: [sc-knowhy-860, scripture-helps-2-kings-16-25, lds-scriptures]

  - ref: 14
    phrase: even ten thousand captives
    kind: history
    title: Ten thousand, seven thousand, a thousand
    body: |
      Verse 14 gives a round total, and verses 15–16 name the groups taken: the court (the king, his mother, his wives, his officers and “the mighty of the land”), seven thousand “men of might,” and a thousand craftsmen and smiths. On one older reading the “mighty men of valour” of verse 14 are those seven thousand, and they were men of property rather than soldiers, the class the King James calls “mighty men of wealth” in [[2 Kgs. 15:20]]. Verse 16, though, calls them “strong and apt for war.” The same reading takes the smiths to include makers of weapons, and holds that the poor were left because, having nothing, they were not feared as rebels.

      What Babylon took was the wealthy, the educated and the skilled, to leave Judah unable to wage war. Even so, the king Babylon set up rebelled (verse 20). Jeremiah lists the same exiles ([[Jer. 29:2]]) and saw them as the good figs, sent away “for their good” ([[Jer. 24:5]]); the note at [[Jer. 24:1]] says more about why the leaders went first. The 3,023 of [[Jer. 52:28]] is a different count, explained at that verse.
    sources: [keil-kings, scripture-helps-2-kings-16-25, lds-scriptures]

  - ref: 17
    phrase: made Mattaniah his father’s brother king in his stead
    kind: history
    title: Lehi's Jerusalem and Zedekiah's first year
    body: |
      The king set up in this verse is the king of [[1 Ne. 1:4]]: Lehi's call came “in the commencement of the first year of the reign of Zedekiah,” when many prophets warned that Jerusalem must repent or be destroyed, and Lehi lived at Jerusalem in that year. When Nebuchadnezzar enthroned Zedekiah is not in doubt: the Babylonian Chronicle confirms his elevation in the spring of 597 BC, and scholars accept the date.

      When Lehi left is argued. Mormon says Lehi “came out of Jerusalem in the first year of the reign of Zedekiah” (3 Nephi, heading), and most readers have put his call and his departure in the same year. Some place the departure near the end of Zedekiah's reign, about 588–587 BC, because Nephi speaks of Jeremiah as already in prison ([[1 Ne. 7:14]]). Others answer that the evidence favors the first year after all. The first-year date leaves a difficulty. Lehi prophesied that the Messiah would come six hundred years after he left ([[1 Ne. 10:4]]). Most scholars favor 5–4 BC for Jesus' birth, only 592 or 593 years after 597 BC, and the discrepancy “remains an issue that has not been solved.” A third model separates the call from the departure: on it the people of the land counted Zedekiah the rightful heir from 609, so that the first year Nephi names, when Lehi's call came, was 608/7 BC; Lehi then prophesied for some four years and left Jerusalem late in 605 BC. The heading to 3 Nephi, which puts the departure itself in that first year, is a difficulty for this model that the passages cited here do not take up. The “600 BC” notation that stood in editions of the Book of Mormon from 1920 to 2012 was a modern addition and does not settle it. The Jerusalem Lehi knew is described at [[Jer. 1:4]] and [[Jer. 21:7]].
    sources: [scripture-helps-2-kings-16-25, chadwick-lehi-departure, brown-jeremiah-imprisonment, sc-knowhy-475, lds-scriptures]

  - ref: 17
    phrase: changed his name to Zedekiah
    kind: words
    title: Mattaniah renamed
    body: |
      The new name showed whose king Zedekiah was, as Pharaoh-necho's renaming of Eliakim had shown for Egypt (see the note on [[2 Kgs. 23:34]]). Zedekiah means “Yahweh is my justice/righteousness,” perhaps Nebuchadnezzar's way of saying that what he was doing to Jerusalem was just.

      The new king also took an oath. Nebuchadnezzar “had made him swear by God” ([[2 Chr. 36:13]]), and Ezekiel calls that oath the LORD's own, so that breaking it was a sin against Him ([[Ezek. 17:15]]; the note at [[Ezek. 17:19]]). The oath stands behind the chapter's last line, “Zedekiah rebelled against the king of Babylon” (verse 20).
    sources: [scripture-helps-2-kings-16-25, bd-zedekiah, lds-scriptures]

christ: |
  In the first year of the king this chapter enthrones, the Lord called Lehi, and Lehi testified in Jerusalem that what he had seen and read “manifested plainly of the coming of a Messiah, and also the redemption of the world” ([[1 Ne. 1:19]]). The prophet who foretold the city's fall also foretold its Redeemer, and the Lord warned Lehi and led his family out before the city was destroyed. Nephi drew the lesson from his father's life: “the tender mercies of the Lord are over all those whom he hath chosen, because of their faith, to make them mighty even unto the power of deliverance” ([[1 Ne. 1:20]]).

  The Lord's judgment on a people and His deliverance can come in the same years, and for a disciple, as for Lehi, that deliverance comes to those who have faith.

