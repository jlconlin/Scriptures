chapter: 2
title: The Spirit of Elijah Doth Rest on Elisha
tagline: Elisha will not leave Elijah on his last journey, sees him taken up by a whirlwind into heaven, and takes up his fallen mantle; the Jordan parts for him as it did for his master, he heals the waters of Jericho, and youths who mock him on the road to Bethel are torn by bears.
when: 'The last day of Elijah’s ministry and the first of Elisha’s; the text gives no year'

setting: |
  Elijah's story began in [[1 Kgs. 17]], and this chapter ends it. Years earlier, at the LORD's command, he had thrown his mantle over Elisha as he plowed, and Elisha had left his oxen to follow him ([[1 Kgs. 19:16–21]]). They seem to have been together some six or seven years. Now the LORD is about to take Elijah, and everyone in the story knows it: Elijah, Elisha, and the bands of prophets at Bethel and Jericho.

  After this chapter Elisha is the leading prophet of the northern kingdom and the adviser of its kings, through a ministry of more than fifty years whose record is mostly miracles, for the most part acts of kindness and mercy. Chapters 1 and 2 together have been called the only detailed account in the Bible of one prophet succeeding another.

  The road runs from Gilgal by Bethel and Jericho to the Jordan and across it, and back again after Elijah is gone. Elijah does not leave the story when he leaves the earth. He stands with Moses beside the transfigured Christ ([[Matt. 17:3]]), and in 1836 he came to the Kirtland Temple, the prophet who “was taken to heaven without tasting death” ([[D&C 110:13]]).

thread: |
  The chapter asks one question: will Elijah's spirit pass to another man? Three times Elijah tells Elisha to stay behind, and three times Elisha swears he will not leave him. At the Jordan he asks for the firstborn's portion of his master's spirit, and Elijah answers that the gift is not his to give: it will be so if Elisha sees him taken. Elisha sees. The chariot of fire and the whirlwind are the turning point, and what follows gives the answer. The mantle that parted the Jordan falls to Elisha; he strikes the water with it and calls on “the LORD God of Elijah,” and the river parts again; the sons of the prophets who watched from a distance say, “The spirit of Elijah doth rest on Elisha,” and bow before him.

  The last two episodes test the new prophet's word. At Jericho a spring that brought death is healed “according to the saying of Elisha” (verse 22), and on the road to Bethel those who mock him meet the LORD's judgment. One older reading takes both miracles as meant to show the people that Elisha was endowed with the Spirit and power of God, as Elijah had been. The chapter ends with Elisha going his own way, to Carmel and to Samaria.

sections:
  - range: 1-6
    heading: Elisha will not leave him
    plain: |
      When the LORD was about to take Elijah up into heaven in a whirlwind, Elijah and Elisha were setting out from Gilgal. Elijah said to Elisha, “Please stay here, for the LORD has sent me to Bethel.” Elisha answered, “As surely as the LORD lives, and as surely as you live, I will not leave you.” So they went down to Bethel. The company of prophets at Bethel came out to Elisha and said to him, “Do you know that the LORD is going to take your master from over you today?” He said, “Yes, I know it. Say nothing.” Elijah said to him, “Elisha, please stay here, for the LORD has sent me to Jericho.” He answered, “As surely as the LORD lives, and as surely as you live, I will not leave you.” So they came to Jericho. The prophets at Jericho came to Elisha and said, “Do you know that the LORD is going to take your master from over you today?” He answered, “Yes, I know it. Say nothing.” Then Elijah said to him, “Please stay here, for the LORD has sent me to the Jordan.” He answered, “As surely as the LORD lives, and as surely as you live, I will not leave you.” And the two of them went on.
  - range: 7-15
    heading: The chariot of fire and the mantle
    plain: |
      Fifty men of the company of prophets went and stood at a distance to watch, while the two of them stood by the Jordan. Elijah took his cloak, rolled it up, and struck the water, and it divided to one side and the other, so that the two of them crossed over on dry ground. When they had crossed, Elijah said to Elisha, “Ask what I should do for you before I am taken from you.” Elisha said, “Please let me receive a double portion of your spirit.” Elijah said, “You have asked a hard thing. Yet if you see me as I am taken from you, it will be yours; if not, it will not.” As they walked on, talking, suddenly a chariot of fire and horses of fire came between them, and Elijah went up into heaven in a whirlwind. Elisha saw it and cried out, “My father, my father, the chariots and horsemen of Israel!” And he saw him no more. He took hold of his own clothes and tore them in two. He picked up the cloak that had fallen from Elijah, went back, and stood on the bank of the Jordan. He took the cloak that had fallen from Elijah, struck the water, and said, “Where is the LORD, the God of Elijah?” When he struck the water, it divided to one side and the other, and Elisha crossed over. The company of prophets from Jericho, watching, said, “The spirit of Elijah rests on Elisha.” They came to meet him and bowed to the ground before him.
  - range: 16-18
    heading: The search
    plain: |
      They said to him, “Look, we your servants have fifty strong men with us. Please let them go and look for your master, in case the Spirit of the LORD has carried him off and set him down on some mountain or in some valley.” He said, “Do not send them.” But they kept urging him until he was embarrassed to refuse, and he said, “Send them.” So they sent fifty men, who searched for three days and did not find him. When they came back to him at Jericho, where he was staying, he said, “Did I not tell you not to go?”
  - range: 19-22
    heading: The healing of the waters
    plain: |
      The men of the city said to Elisha, “As you can see, my lord, this city is well placed, but the water is bad and the land is barren.” He said, “Bring me a new bowl and put salt in it.” They brought it to him. He went out to the spring, threw the salt into it, and said, “Thus says the LORD: I have healed this water. From now on it will no longer cause death or barrenness.” And the water has stayed healed to this day, just as Elisha said.
  - range: 23-25
    heading: The youths at Bethel
    plain: |
      From there he went up to Bethel. As he was going up the road, some youths came out of the city and jeered at him: “Go up, baldhead! Go up, baldhead!” He turned around, looked at them, and cursed them in the name of the LORD. Then two she-bears came out of the woods and mauled forty-two of them. From there he went on to Mount Carmel, and from there he returned to Samaria.

notes:
  - ref: 2
    phrase: As the LORD liveth, and as thy soul liveth, I will not leave thee.
    kind: history
    title: Three times told to stay
    body: |
      Elisha's oath, sworn three times at three places, is the first test of the chapter, and the text never says why Elijah asked him to stay behind. Whether the places themselves matter is not known, though each has a past. This Gilgal is not the one by Jericho where Joshua set up the stones of Israel's crossing ([[Josh. 4:19–20]]) but a place near Bethel, from which they “went down” to it; Bethel is where Jacob saw the ladder to heaven ([[Gen. 28:12–19]]), and it may be significant that Elijah, about to go up to heaven, went there first; Jericho is the city Joshua cursed ([[Josh. 6:26]]; the note at [[1 Kgs. 16:34]] tells of its rebuilding).

      One older reading gives the journey a purpose. Elijah said that the LORD had sent him to each place, so he went at the Spirit's prompting to visit the bands of prophets once more before he left, and Elisha, knowing he was the appointed successor, would not leave his side, because he meant to be an eyewitness of his master's going and so receive the firstborn's inheritance. That reading ties Elisha's persistence here to the condition Elijah sets in verse 10: “if thou see me when I am taken from thee.”
    sources: [ot-minute-2-kings-2, bd-gilgal, keil-kings, lds-scriptures]

  - ref: 3
    phrase: the sons of the prophets
    kind: history
    title: The sons of the prophets
    body: |
      The “sons of the prophets” were not anyone's children but bands of prophets who lived together for instruction and worship under Samuel, Elijah and Elisha. Little is known about them. Not all of them claimed a supernatural gift; they were trained religious teachers, and some inspired prophets, Amos among them, never belonged to such a school ([[Amos 7:14]]). The groups at Bethel and Jericho had been told what Elisha already knew, that the LORD would take Elijah that day, and Elisha's answer, “hold ye your peace,” asks them not to speak of it.

      “From thy head” need not picture something lifted off Elisha. In Hebrew, as in English, the leader of a group is its “head,” so the phrase might be better rendered, “the LORD will take away thy master as the head of your group today.” By the end of the chapter the same sons of the prophets bow to Elisha in Elijah's place (verse 15).
    sources: [bd-schools-of-the-prophets, ot-minute-2-kings-2, lds-scriptures]

  - ref: 9
    phrase: let a double portion of thy spirit be upon me
    kind: words
    title: A double portion of thy spirit
    body: |
      Elisha was most likely asking for the share of an heir, not for twice as much of Elijah's spirit. Under the law of Moses the firstborn son received a double portion of his father's goods ([[Deut. 21:17]]; the note at [[Deut. 21:15]] explains the law), and the two Hebrew words here, *pî šᵉnayim*, are the ones used there. Elisha regarded Elijah as a father as well as a teacher. By asking for the birthright son's portion he may have been saying that he was willing to be Elijah's spiritual successor, and he may also have been asking for an added measure of the Holy Ghost for the work. Some have read the doubling as a promise that Elisha would work more and greater miracles than Elijah, but words taken from the law of the firstborn point to the inheritance instead. One Latter-day Saint reading suggests that he wanted one portion for himself and one with which to guide the people.

      Elijah calls it “a hard thing” (verse 10) and does not promise it. The spirit Elisha asked for was most likely the Spirit of God, and Elijah could not give it; the gift depended entirely on God. Elijah names a sign instead: if Elisha sees him taken, it will be so. Elisha sees (verse 12), and the sons of the prophets later say what has happened: “The spirit of Elijah doth rest on Elisha” (verse 15).
    sources: [scripture-helps-2-kings-2, oshb-wlc, woods-elisha-children, wilson-holy-spirit, lds-scriptures]

  - ref: 11
    phrase: Elijah went up by a whirlwind into heaven
    kind: prophets
    title: Elijah translated
    body: |
      Elijah was taken into heaven without dying, which is what Latter-day Saints mean in calling him translated. Translated beings are people “changed so that they do not experience pain or death until their resurrection to immortality,” and the Doctrine and Covenants says the same of Elijah, who “was taken to heaven without tasting death” ([[D&C 110:13]]). “Heaven” here does not mean celestial glory. Joseph Smith taught that translation was not a doctrine by which men were taken at once into God's presence and an eternal fulness; translated beings belong to “the terrestrial order” and are kept for further ministry, so that translation “obtains deliverance from the tortures and sufferings of the body, but their existence will prolong as to the labors and toils of the ministry.” Enoch is another (see the note at [[Gen. 5:24]]).

      Elijah's ministry did continue. He appeared as a translated being on the Mount of Transfiguration to help give the keys of the priesthood to Peter, James and John, and later appeared as a resurrected being to Joseph Smith and Oliver Cowdery in the Kirtland Temple to confer the keys of the sealing power. The note at [[Mal. 4:5]] explains why Elijah was the one sent.

      The whirlwind is not the “great and strong wind” of Horeb, in which “the LORD was not” ([[1 Kgs. 19:11]]); the Hebrew word here is a different and rare one, used mostly of weather sent by God. The fire of the chariot and horses may simply mark them as heavenly and glorious.
    sources: [scripture-helps-2-kings-2, gs-translated-beings, ot-manual-5, ot-minute-2-kings-2, lds-scriptures]

  - ref: 12
    phrase: My father, my father, the chariot of Israel, and the horsemen thereof
    kind: symbol
    title: The chariot of Israel
    body: |
      Elisha's cry is about what Elijah had been to Israel. “My father” is figurative: Elijah was his spiritual father, and Elisha had just asked for the son's inheritance. On one older reading, chariots and horsemen were the strength on which Israel's kings rested the safety of their kingdom, and Elisha uses them as a symbol of the strong defense Elijah had been to the kingdom through his ministry. Tearing his clothes in two was the sign of grief.

      The words come back at the end of Elisha's own life, when Joash king of Israel weeps over the dying Elisha with exactly the same cry ([[2 Kgs. 13:14]]). The repetition is one of the ways the book ties the two prophets' characters together.
    sources: [scripture-helps-2-kings-2, keil-kings, woods-elisha-children, lds-scriptures]

  - ref: 13
    phrase: He took up also the mantle of Elijah that fell from him
    kind: symbol
    title: The mantle falls
    body: |
      Elijah's mantle, his robe, was the symbol of his authority, and its falling to Elisha marks the moment the prophetic calling passed to him. Elijah had first thrown it over Elisha in the field to designate him as successor (the note at [[1 Kgs. 19:19]] tells of it); perhaps only now, with Elijah gone, could Elisha take it wholly as his own. On one Latter-day Saint reading, Elijah's mantle (*ʾadderet*) was the hairy garment that marked a prophet: he was “an hairy man” ([[2 Kgs. 1:8]]), and the prophet's “rough garment” of [[Zech. 13:4]] is, in Hebrew, a hairy mantle. That reading matters for the taunt of verse 23.

      The cloak was a sign, not the source of power. The Spirit supplied God's power, and the next verse shows it: Elisha strikes the water and calls not on the mantle but on the LORD.
    sources: [scripture-helps-2-kings-2, ot-minute-2-kings-2, woods-elisha-children, wilson-holy-spirit, lds-scriptures]

  - ref: 14
    phrase: Where is the LORD God of Elijah?
    kind: scripture
    title: The Jordan parted again
    body: |
      Elisha's question is answered by the river, in a scene that is hard to read without thinking of Israel's first succession of leaders. Moses parted the sea ([[Ex. 14:21–22]]); when his authority passed to Joshua, the Jordan was stopped and Israel crossed on dry ground ([[Josh. 3:14–17]]). Here Elijah parts the Jordan with his mantle going out (verse 8), and Elisha parts it with the same mantle coming back. Each parting showed that the LORD's power stood behind the man who held the mantle: Elijah used it to leave the land, and Elisha used it to come back into the land as its prophet.

      The sons of the prophets, who had watched from across the river, recognized his authority because he parted the Jordan just as Elijah had done. It is the first of more than two dozen miracle stories that fill Elisha's record in chapters 2–7, some of them echoing Elijah's, as this one does.
    sources: [woods-elisha-children, scripture-helps-2-kings-2, barlow-miracles, lds-scriptures]

  - ref: 16
    phrase: lest peradventure the Spirit of the LORD hath taken him up, and cast him upon some mountain, or into some valley
    kind: history
    title: Fifty men search three days
    body: |
      The sons of the prophets thought the Spirit might have carried Elijah off and set him down on some mountain or in some valley, and they wanted to search for him or for his body. Obadiah had feared the same thing of Elijah years before ([[1 Kgs. 18:12]], with its note). Elisha, who had seen him go, told them not to send. They pressed him until he was ashamed to refuse, the fifty men searched three days and found nothing, and Elisha could only remind them, “Did I not say unto you, Go not?” (verse 18).
    sources: [ot-minute-2-kings-2, lds-scriptures]

  - ref: 21
    phrase: cast the salt in there
    kind: symbol
    title: Healed with salt
    body: |
      Salt normally spoils water rather than purifying it, and water in the plain of Jericho, near the Dead Sea, was likely too salty already, so using salt makes the healing more plainly a miracle. The healing recalls Moses sweetening the bitter water of Marah ([[Ex. 15:23–25]]). Like Moses, Elisha has now both parted the waters and healed bad water, one more way the chapter draws the new prophet in the likeness of Israel's first.

      Elisha himself says what healed the spring: “Thus saith the LORD, I have healed these waters.” One older reading grants that salt may take away the bad taste of water, but holds that a dish of it could not heal a spring for ever, and that the means does not remove the miracle. On that reading the salt, which keeps things from decay, is a symbol of the life that overcomes death and the earthly vehicle of the divine word that did the healing, and the new bowl is a sign of the renewing power of that word. The same reading identifies the spring as the one now called ʿAin es-Sultan, the only spring near Jericho, whose water spreads over its plain. Either way, “the waters were healed unto this day, according to the saying of Elisha” (verse 22).
    sources: [ot-manual-5, ot-minute-2-kings-2, woods-elisha-children, keil-kings, lds-scriptures]

  - ref: 23
    phrase: there came forth little children out of the city, and mocked him
    kind: history
    title: The youths and the bears
    body: |
      The mockers were not small children but older youths or even young men; the Hebrew words are the ones Solomon uses of himself as a new king (see the note at [[1 Kgs. 3:7]]). Why they harassed Elisha, and what their insults meant, is not known. Elisha's curse and the coming of the bears suggest that what they did was serious and deeply offensive, and the event may also have been a warning to Israel that God's judgments would come if they kept rejecting His prophets, as the Law had warned of wild beasts sent against a people who walked contrary to Him ([[Lev. 26:21–22]]).

      A Latter-day Saint study reads the taunt as an attack on the succession the chapter has just told. “Go up” is the verb of verse 11, where Elijah went up into heaven, so the youths may be saying, in effect, try to ascend as Elijah did. “Bald head” may be meant figuratively: Elijah's mark was his hairy mantle, and calling the man who now wore it bald denied that he had any right to it, accusing him of usurping a prophet's authority.

      Two cautions bear on what happened. Read strictly, the verb does not say that the bears killed the youths, as some commentaries assume; they “tare,” or lacerated, them. And Elisha's curse ends one thought and the bears begin another, so the assumption that Elisha directed the bears may not be justified. The text says only that he cursed them “in the name of the LORD,” and that the bears came.
    sources: [scripture-helps-2-kings-2, woods-elisha-children, ot-seminary-lesson-97, ot-manual-5, lds-scriptures]

christ: |
  Elijah's going up is one of the ways his life points to Christ: as Elijah was taken up into heaven, so was Jesus, while His disciples watched, “and a cloud received him out of their sight,” with the promise that “this same Jesus” would come again as they had seen Him go ([[Acts 1:9–11]]). The keys Elijah held were given again in the Kirtland Temple, and that sealing power is crucial “for gathering and preparing a covenant people on both sides of the veil.”

  The mantle still passes: “The work goes forward—and one prophet succeeds another,” and what passes is not the cloak's power but God's, which His Spirit supplies to the one He calls. The sealing power Elijah brought back makes priesthood ordinances “binding both on earth and in heaven,” so the covenants a disciple makes today rest on the keys this chapter's prophet held.

explore: |
  - **The first succession.** [[Num. 27:15–23]] and [[Josh. 3:7–17]], Moses to Joshua, and the Jordan parted for the new leader.
  - **Elijah afterward.** [[Matt. 17:1–9]], the Transfiguration, and [[D&C 110:13–16]], Kirtland.
  - **Elisha's ministry.** [[2 Kgs. 4:1–44]] and [[2 Kgs. 13:14–21]], where the cry of verse 12 comes back.
  - **The youths and the bears.** “[Elisha and the Children: The Question of Accepting Prophetic Succession](https://byustudies.byu.edu/article/elisha-and-the-children-the-question-of-accepting-prophetic-succession),” *BYU Studies* 32, no. 3 (1992), reads 2 Kings 1–2 as a story of accepting or refusing a prophet's successor.

