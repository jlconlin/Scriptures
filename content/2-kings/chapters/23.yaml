chapter: 23
title: All the People Stood to the Covenant
tagline: Josiah reads the book of the covenant to the people, binds them to it, and clears the temple, Judah and Bethel of every false altar and keeps a Passover like none before it; yet the wrath against Judah stands, Josiah falls at Megiddo, and his sons reign as Pharaoh's men.
when: 'In the eighteenth year of Josiah king of Judah, and in the reigns of his sons Jehoahaz and Jehoiakim after his death'

setting: |
  The chapter runs straight on from chapter 22. In Josiah's eighteenth year ([[2 Kgs. 22:3]]), 622 B.C. in one Latter-day Saint reckoning, the high priest found a book of the law in the temple; Josiah tore his clothes at its words, and the prophetess Huldah answered that the evil it threatened would come, though not in his lifetime (the book and Huldah are explained at [[2 Kgs. 22:8]] and [[2 Kgs. 22:14]]). This chapter tells what the king did next: he read the book to the people and bound them to it by covenant, cleansed the temple, Jerusalem, Judah and the old northern sanctuary at Bethel of what earlier kings had set up, and kept a Passover.

  Then the history turns. In 609 B.C. Pharaoh Necho II marched north to help Assyria, which was falling to Babylon and the Medes, and Josiah was killed at Megiddo trying to stop him. For four years Judah was under Egypt: Necho deposed Josiah's son Jehoahaz after three months and set his brother Jehoiakim on the throne.

  Jeremiah had been called in Josiah's thirteenth year ([[Jer. 1:2]]), and Zephaniah prophesied in the same reign. The prophets who warned that Jerusalem must repent or be destroyed, Lehi among them ([[1 Ne. 1:4]]), preached to the generation this chapter leaves behind; what Lehi's family may have known of the reform is taken up at [[Deut. 31:9]].

thread: |
  The chapter tells the reform in order: the covenant at the temple, idolatry rooted out of Jerusalem and Judah, then out of Bethel and the cities of Samaria, then a Passover to seal the people's loyalty. Verse 25 says that no king before him or after him turned to the LORD as he did, “according to all the law of Moses.”

  Then comes “Notwithstanding.” The wrath kindled by Manasseh is not turned away, and the last ten verses show how quickly the reform comes undone: Josiah dead in battle, his sons doing evil “according to all that his fathers had done,” and Pharaoh choosing Judah's kings and taxing its people. A king could cleanse the temple, but he could not change the hearts of a people whose changes were outward only.

sections:
  - range: 1-3
    heading: The book read and the covenant made
    plain: |
      The king sent for all the elders of Judah and Jerusalem. He went up to the house of the LORD with all the men of Judah, everyone who lived in Jerusalem, the priests, the prophets and all the people, from the least to the greatest, and he read aloud to them everything written in the book of the covenant that had been found in the temple. Then the king stood by the pillar and made a covenant before the LORD: to follow the LORD and keep His commandments, His testimonies and His statutes with all their heart and soul, and to carry out the words of the covenant written in this book. And all the people pledged themselves to the covenant.
  - range: 4-14
    heading: Clearing the temple and the land
    plain: |
      The king ordered Hilkiah the high priest, the priests next in rank and the doorkeepers to bring out of the temple every object made for Baal, for the Asherah and for all the host of heaven. He burned them outside Jerusalem in the fields of the Kidron and carried their ashes to Bethel. He removed the priests the kings of Judah had appointed to burn incense at the high places in the towns of Judah and around Jerusalem, and those who burned incense to Baal, to the sun, the moon, the planets and all the host of heaven. He took the Asherah out of the LORD's house to the brook Kidron outside the city, burned it there, ground it to powder and threw the powder on the graves of the common people. He tore down the houses of the sodomites beside the temple, where women wove hangings for the Asherah.

      He brought all the priests in from the towns of Judah and defiled the high places where they had burned incense, from Geba to Beersheba, and tore down the shrines at the gate of Joshua, the city's governor, on the left as one entered. The priests of the high places did not serve at the LORD's altar in Jerusalem, but they ate unleavened bread with their fellow priests. He defiled Topheth in the valley of Hinnom, so that no one could again make a son or daughter pass through the fire to Molech. He removed the horses the kings of Judah had dedicated to the sun, at the entrance to the temple by the room of Nathan-melech the officer, and burned the chariots of the sun. He tore down the altars the kings of Judah had built on the roof of Ahaz's upper room, and the altars Manasseh had built in the two courts of the temple, smashed them and threw their dust into the Kidron. He defiled the high places facing Jerusalem, to the right of the mount of corruption, which Solomon king of Israel had built for Ashtoreth, the abomination of the Sidonians, for Chemosh, the abomination of Moab, and for Milcom, the abomination of the Ammonites. He broke the images to pieces, cut down the groves and filled their places with human bones.
  - range: 15-20
    heading: Bethel and the cities of Samaria
    plain: |
      He also tore down the altar at Bethel and the high place made by Jeroboam son of Nebat, who led Israel into sin. He burned the high place, ground it to powder and burned the Asherah. As Josiah looked around, he saw the tombs on the hillside; he had the bones taken out of them and burned on the altar, defiling it, as the word of the LORD had said through the man of God who foretold these things. Then he asked, “What is that marker I see?” The men of the city told him, “It is the tomb of the man of God who came from Judah and foretold these very things you have done to the altar of Bethel.” “Leave it alone,” he said. “Let no one disturb his bones.” So they left his bones alone, along with the bones of the prophet who had come from Samaria. Josiah removed all the shrines of the high places in the towns of Samaria that the kings of Israel had built to provoke the LORD, and did to them just as he had done at Bethel. He killed all the priests of those high places on their altars, burned human bones on them, and went back to Jerusalem.
  - range: 21-27
    heading: The Passover, and the wrath that stood
    plain: |
      The king commanded all the people, “Keep the Passover to the LORD your God, as it is written in this book of the covenant.” No Passover like it had been kept since the days when judges led Israel, nor in all the days of the kings of Israel or of Judah; it was in Josiah's eighteenth year that this Passover was kept to the LORD in Jerusalem. Josiah also got rid of the mediums and spiritists, the images, the idols and every abomination found in Judah and Jerusalem, to carry out the words of the law written in the book Hilkiah the priest had found in the LORD's house. There was no king before him who turned to the LORD as he did, with all his heart, soul and strength, according to all the law of Moses, and none like him arose after him. Even so, the LORD did not turn from the fierceness of His great anger, which burned against Judah for all the ways Manasseh had provoked Him. The LORD said, “I will remove Judah from my sight too, as I removed Israel, and I will reject Jerusalem, the city I chose, and the house of which I said, ‘My name shall be there.’”
  - range: 28-37
    heading: Megiddo, and Pharaoh's kings
    plain: |
      The rest of Josiah's acts, and all he did, are written in the book of the chronicles of the kings of Judah. In his days Pharaoh Necho king of Egypt went up to the king of Assyria at the river Euphrates. King Josiah went out to meet him, and Necho killed him at Megiddo as soon as he saw him. His servants brought his body from Megiddo to Jerusalem in a chariot and buried him in his own tomb. Then the people of the land took Jehoahaz son of Josiah, anointed him and made him king in his father's place.

      Jehoahaz was twenty-three when he became king, and he reigned three months in Jerusalem; his mother was Hamutal, daughter of Jeremiah of Libnah. He did evil in the LORD's sight, as his fathers had done. Pharaoh Necho put him in chains at Riblah in the land of Hamath, so that he could not reign in Jerusalem, and imposed on the land a tribute of a hundred talents of silver and a talent of gold. Pharaoh Necho made Eliakim son of Josiah king in his father's place and changed his name to Jehoiakim; he took Jehoahaz away, and Jehoahaz went to Egypt and died there. Jehoiakim paid Pharaoh the silver and gold, but to do it he taxed the land, collecting the silver and gold from the people of the land, each according to his assessment, to pay Pharaoh Necho. Jehoiakim was twenty-five when he became king, and he reigned eleven years in Jerusalem; his mother was Zebudah, daughter of Pedaiah of Rumah. He did evil in the LORD's sight, as his fathers had done.

notes:
  - ref: 3
    phrase: all the people stood to the covenant
    kind: history
    title: Standing to the covenant
    body: |
      Those who “stood to the covenant” pledged themselves to it. The king made the covenant first, by the pillar, and then the people bound themselves to keep it with him. The scene was likely a formal covenant renewal, of the kind Moses held with Israel before they entered the promised land.

      Read that way, chapters 22 and 23 follow the parts of such a ceremony. Huldah's answer (22:15–20) declares that the LORD stands behind the book and that its curses will bear witness against a disobedient people; the king reads the book publicly, to “small and great” (verse 2); king and people take the oath (verse 3); and the Passover that follows recalls the deliverance from Egypt (verses 21–22). On the same reading, the long list of things carried out of the temple and broken down in verses 4–20 is the measure of how far Judah had fallen from the covenant it was renewing.
    sources: [scripture-helps-2-kings-16-25, seely-covenant-renewal]

  - ref: 5
    phrase: he put down the idolatrous priests
    kind: words
    title: Priests the kings had ordained
    body: |
      The “idolatrous priests” are the *kĕmārîm* (singular *kōmer*), a rare word for a kind of priest that appears only three times in the Hebrew Bible, and nothing in the word itself means “idolatrous.” The King James adjective seems to be drawn from what the verse goes on to say they did; in Aramaic the related word was the ordinary word for priest. Hosea uses it of the priests of the calf at Bethel ([[Hos. 10:5]]), and Zephaniah, who prophesied in Josiah's reign, names “the Chemarims with the priests” among those the LORD would cut off ([[Zeph. 1:4]]). The priests who burned incense on the high places of Judah were probably burning it to Jehovah, at shrines his reform condemned; the verse sets beside them those who served Baal, the sun, the moon and the stars.

      What the verse stresses is who had ordained them: “the kings of Judah,” here Josiah's father Amon and grandfather Manasseh. The writer counts their removal to Josiah's credit; the verb, *hišbît*, describes a purge. The Book of Mormon uses the same expression of King Noah: “he put down all the priests that had been consecrated by his father” ([[Mosiah 11:5]]). On one Latter-day Saint reading Mormon draws the contrast on purpose: Josiah removed the priests of his idolatrous fathers to restore the LORD's worship, and Noah, who “did not walk in the ways of his father” ([[Mosiah 11:1]]), removed his father's priests to install priests of his own.
    sources: [bowen-putting-down-priests, oshb-wlc]

  - ref: 6
    phrase: cast the powder thereof upon the graves of the children of the people
    kind: history
    title: Burned, ground to powder, and scattered
    body: |
      Josiah did more than remove the objects of false worship: he destroyed them in ways that left them unclean and defiled the places where they ended up. The “grove” here is the image of Asherah, a fertility goddess, and it had stood in the LORD's own house, where Manasseh “set a graven image of the grove” ([[2 Kgs. 21:7]]). Josiah had it burned at the brook Kidron, ground to powder, and the powder thrown on the graves of the common people. On one older reading the point was to defile those graves as the graves of idolaters, and the Kidron valley was already the place where reforming kings disposed of idols: Asa had burned one there ([[1 Kgs. 15:13]]), and Hezekiah had the temple's abominations carried there.

      The ashes of the vessels made for Baal, the Asherah and the host of heaven went the other way, to Bethel (verse 4). On the same reading that was meant to defile the chief seat of false worship in the north, before Josiah came to destroy its altar himself (verses 15–16).
    sources: [lds-scriptures, keil-kings]

  - ref: 9
    phrase: the priests of the high places came not up to the altar of the LORD in Jerusalem
    kind: history
    title: Priests without an altar
    body: |
      The priests Josiah brought in from the high places of Judah (verse 8) lost their altars but not their living. They could not offer sacrifice at the temple altar, yet they “did eat of the unleavened bread among their brethren.” On one older reading this means they still received the priests' share of the offerings, but ate it at home rather than in the holy place, which put them on the same footing as a priest kept from serving by a bodily defect, who could eat the holy food but not approach the altar ([[Lev. 21:17–23]]).
    sources: [keil-kings]

  - ref: 16
    phrase: according to the word of the LORD which the man of God proclaimed
    kind: scripture
    title: Josiah by name
    body: |
      Verses 15–20 fulfill what a man of God from Judah cried against Jeroboam's altar at Bethel long before Josiah was born: “a child shall be born unto the house of David, Josiah by name; and upon thee shall he offer the priests of the high places that burn incense upon thee, and men's bones shall be burnt upon thee” ([[1 Kgs. 13:2]]). Josiah burns bones from the tombs on that altar, and the narrator says it was done according to that word. He spares one tomb, the man of God's own, where the old prophet of Bethel had asked to be laid beside him; and in the cities of Samaria he does “according to all the acts that he had done in Beth-el” (verse 19), slaying the priests of the high places on their altars and burning men's bones on them. The prophecy, and why a prophet could name a king before his birth, are explained at [[1 Kgs. 13:2]]; the shared grave at [[1 Kgs. 13:31]].
    sources: [lds-scriptures]

  - ref: 21
    phrase: Keep the passover unto the LORD your God, as it is written in the book of this covenant
    kind: history
    title: A Passover kept by the book
    body: |
      The Passover crowned the covenant renewal. Remembering God's deliverance of Israel from Egypt, it gave the covenant the people had just sworn its historical prologue, the account of what God had done for them, and their keeping of it was a sign of their recommitment.

      It was kept “as it is written in the book,” and the book directs where: “Thou mayest not sacrifice the passover within any of thy gates … But at the place which the LORD thy God shall choose to place his name in” ([[Deut. 16:5–6]]). So this Passover “was holden to the LORD in Jerusalem” (verse 23); the move from a household meal to a feast at the chosen place is explained at [[Deut. 16:5]]. Chronicles tells the feast at length and makes the same claim for it as verse 22: “there was no passover like to that kept in Israel from the days of Samuel the prophet” ([[2 Chr. 35:18]]).
    sources: [seely-covenant-renewal, lds-scriptures]

  - ref: 26
    phrase: Notwithstanding the LORD turned not from the fierceness of his great wrath
    kind: history
    title: Why the reform did not turn the wrath
    body: |
      Verse 25 says that no king before or after Josiah turned to the LORD as he did (how that sits beside the same praise of Hezekiah is at [[2 Kgs. 18:5]]), and verse 26 begins “Notwithstanding.” The text names its reason: “all the provocations that Manasseh had provoked him withal.” Manasseh's sins and the judgment pronounced on them are explained at [[2 Kgs. 21:11]], and why a king long dead is blamed at [[Jer. 15:4]]. On one Latter-day Saint reading of the history's logic, Manasseh's wickedness was so great that even Josiah's righteousness could not make up for it; the punishment could be delayed but not cancelled.

      The prophets of the time supply the other half. Huldah had said the evil would come because “they have forsaken me” ([[2 Kgs. 22:17]]), and she spared only the king, whose heart was tender. Jeremiah, called in Josiah's reign, said of the people that “Judah hath not turned unto me with her whole heart, but feignedly” ([[Jer. 3:10]]). Josiah's reform reached further than Hezekiah's, but its effect on the people did not last: on the same reading, the changes were outward, and the pull back to the old worship was too strong.

      Verse 27 then pronounces the judgment in the words used of the northern kingdom, “I will remove Judah also out of my sight, as I have removed Israel” (compare [[2 Kgs. 17:18]]).
    sources: [sc-knowhy-861, satterfield-divine-justification]

  - ref: 29
    phrase: and he slew him at Megiddo
    kind: history
    title: Josiah's death at Megiddo
    body: |
      Josiah died trying to keep Egypt from rescuing Assyria. Nineveh had fallen in 612 B.C., and in 609 Pharaoh Necho II was marching north to help his ally, the Assyrian king Assur-uballit II, who was falling to the Babylonians and the Medes. Where the King James reads that Necho “went up against the king of Assyria,” modern translations such as the NRSVue read “went up to the king of Assyria,” which is what the campaign was. Josiah went out to stop him and was killed at Megiddo. Chronicles adds Necho's warning that God had sent him, and Josiah's disguise ([[2 Chr. 35:20–24]]; the note at [[Jer. 46:2]] tells it).

      Huldah had promised that Josiah would be “gathered into thy grave in peace,” and the promise explained itself: “thine eyes shall not see all the evil which I will bring upon this place” ([[2 Kgs. 22:20]]). He died before that evil came (see the note at [[Isa. 57:1]]). Even so, his death was a frightening foreshadowing of what would happen to Judah. For four years the land was Egypt's, until Babylon beat Egypt at Carchemish in 605, and Jehoiakim and later Zedekiah followed him not in reform but in resisting the empire, which brought Babylon to Jerusalem.
    sources: [schade-kingdom-judah, seely-woods-jerusalem-destroyed, nrsvue, lds-scriptures]

  - ref: 34
    phrase: turned his name to Jehoiakim
    kind: history
    title: Renamed by Pharaoh
    body: |
      A new name from an overlord was a sign of dependence. Necho did not accept the king the people of the land had chosen: he put Jehoahaz in chains at Riblah in the land of Hamath, Necho's headquarters (and where Nebuchadnezzar would later judge Zedekiah; [[2 Kgs. 25:6]]), and set up Jehoahaz's brother Eliakim, the elder by two years by the ages the text gives (verses 31, 36). On one older reading, rulers of the time gave new names to those they took into their service, as Pharaoh named Joseph and the prince of Babylon's eunuchs named Daniel ([[Gen. 41:45]]; [[Dan. 1:7]]).

      Yet the new name is Israelite. Eliakim, with God (*El*) in his name, became Jehoiakim, “Jehovah will set up,” and the same reading supposes that the vassal chose it himself and Pharaoh only confirmed it as a mark of his supremacy. Nebuchadnezzar would do the same when he made Mattaniah king as Zedekiah ([[2 Kgs. 24:17]]). Jehoahaz, also called Shallum, died in Egypt; Jeremiah's lament for him is at [[Jer. 22:10]].
    sources: [keil-kings, schade-kingdom-judah, lds-scriptures]

  - ref: 37
    phrase: according to all that his fathers had done
    kind: history
    title: The reform ends with Jehoiakim
    body: |
      The chapter that began with the best of Judah's kings ends with two of his sons who did evil “according to all that his fathers had done.” Under Jehoiakim the reform came to an end, and on one Latter-day Saint reading things went at once from bad to worse. In Josiah's days the people had sworn to obey the LORD (verse 3); in Jehoiakim's the covenant was rejected on purpose, and Jeremiah said so: “They are turned back to the iniquities of their forefathers” ([[Jer. 11:10]]).

      Jehoiakim also put the prophet Urijah to death for prophesying the same destruction that Jeremiah, and later Lehi, would preach ([[Jer. 26:20–23]]). Jeremiah's own word to this king, set against his father's justice, is at [[Jer. 22:13–19]].
    sources: [satterfield-divine-justification, seely-woods-jerusalem-destroyed]

christ: |
  Josiah's covenant was to keep the LORD's commandments “with all their heart and all their soul” (verse 3), and the verdict on him uses the words of [[Deut. 6:5]], the commandment Jesus named “the first and great commandment” ([[Matt. 22:37–38]]); the note at [[Deut. 6:5]] sets the two side by side.

  The people stood to the same covenant, yet Jeremiah said that Judah “hath not turned unto me with her whole heart, but feignedly” ([[Jer. 3:10]]), and the outward changes did not hold. A covenant with the Lord is a whole-souled commitment between Him and the disciple who makes it, and a reform of the outward life does not keep it unless the heart has turned as well.

explore: |
  - **The reform in Chronicles.** [[2 Chr. 34–35]], which begins the purge in Josiah's twelfth year and tells the Passover and Josiah's death at more length.
  - **The prophecy at Bethel.** [[1 Kgs. 13:1–6]], the man of God who named Josiah.
  - **Jeremiah on Josiah's sons.** [[Jer. 22:10–19]], Shallum (Jehoahaz) and Jehoiakim set against their father.
  - **Was the reform a restoration?** Some Latter-day Saint writers have read Josiah's reform as a loss of older temple teaching; a [*BYU Studies* article](https://byustudies.byu.edu/article/is-the-bible-reliable-a-case-study) reviews that reading and its critics, and the note at [[Deut. 31:9]] sets out both sides.

