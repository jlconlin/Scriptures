chapter: 12
title: All His Days Wherein Jehoiada Instructed Him
tagline: Jehoash, the boy-king Jehoiada crowned, reigns forty years in Jerusalem; he orders the temple repaired, and when the priests' collection fails, a chest by the altar pays the workmen; then Hazael comes, the temple's treasures are sent to buy him off, and Jehoash dies at his servants' hands.
when: 'Forty years in Jerusalem, beginning in the seventh year of Jehu king of Israel'

setting: |
  Chapter 12 turns from the north, where Jehu had ended Ahab's house, to Judah and the king who survived Athaliah. When Athaliah killed the royal heirs, Jehoash escaped through his aunt, who hid him in the temple six years; in the seventh, Jehoiada the priest brought him out and had him made king, with a covenant between the LORD, the king and the people ([[2 Kgs. 11:4]]; [[2 Kgs. 11:17]], where the covenant is explained). He was seven years old ([[2 Kgs. 11:21]]), so a king that young would certainly have reigned with Jehoiada's counsel and guidance. The chapter calls him both Jehoash and Joash. He is not the Jehoash who reigned over Israel in the next chapter: there were two kings of that name, one in each kingdom.

  To the north, Hazael of Syria was already cutting Israel short ([[2 Kgs. 10:32]]), and in verse 17 he turns toward Jerusalem. Kings tells the forty-year reign in a few lines: its character, the repair of the temple, the Syrians bought off, and the king's murder. The parallel account in [[2 Chr. 24]] adds the death of Jehoiada, the king's turn to idols, and the stoning of the prophet Zechariah, and these can be fitted into Kings' account without strain. The notes below go to Chronicles where Kings leaves a question open.

thread: |
  The chapter hangs on the condition in verse 2. Jehoash did right “all his days wherein Jehoiada the priest instructed him,” and the rest of the reign shows what that limit meant. The good years are the years of the temple. Even then the high places stayed, the local altars that the reforming kings Hezekiah and Josiah would later remove (explained at [[1 Kgs. 3:2]]). But the house of the LORD, broken up under Athaliah, was put back in order, and the money for it was handled so honestly that no one asked for an account (verse 15).

  Then the order reverses. The king who restored the temple stripped it of its treasures to send Hazael away (verse 18). Kings closes with a conspiracy and gives no reason. Chronicles supplies the reason, and with it the end of the condition in verse 2: Jehoiada died, and the king who had been his pupil killed his son.

sections:
  - range: 1-3
    heading: The king Jehoiada taught
    plain: |
      In the seventh year of Jehu, Jehoash became king, and he reigned forty years in Jerusalem. His mother was Zibiah, from Beer-sheba. Jehoash did what was right in the LORD's sight all the years that Jehoiada the priest instructed him. But the high places were not removed; the people still offered sacrifices and burned incense there.
  - range: 4-16
    heading: The temple repaired
    plain: |
      Jehoash said to the priests, “Take all the money from the holy gifts that is brought into the LORD's house: the money paid by each one counted in the census, the money set as each person's valuation, and all the money that anyone freely chooses to bring into the LORD's house. Let each priest receive it from the people he knows, and let them repair the damage to the house wherever any is found.” But by the twenty-third year of King Jehoash the priests had still not repaired the damage. So the king called Jehoiada the priest and the other priests and asked them, “Why are you not repairing the damage to the house? From now on take no more money from the people you know; hand it over for the repairs.” The priests agreed to receive no more money from the people, and not to be responsible for the repairs.

      Then Jehoiada the priest took a chest, bored a hole in its lid, and set it beside the altar, on the right as one comes into the LORD's house, and the priests who guarded the entrance put into it all the money brought into the house. Whenever they saw that there was a great deal of money in the chest, the king's scribe and the high priest came, tied it up in bags, and counted the money found in the LORD's house. They gave the counted money to the men appointed to oversee the work on the house, and these paid it out to the carpenters and builders working on the LORD's house, to the masons and stonecutters, and for buying timber and dressed stone to repair the damage, and for everything else the repairs cost. None of the money brought into the LORD's house was used to make silver bowls, snuffers, basins, trumpets, or any vessels of gold or silver for it; it went to the workmen, who repaired the house with it. No one asked for an accounting from the men who received the money to pay the workmen, because they were honest. The money from guilt offerings and sin offerings was not brought into the LORD's house; it belonged to the priests.
  - range: 17-18
    heading: Hazael bought off
    plain: |
      Then Hazael king of Syria attacked Gath and took it, and he set out to go up against Jerusalem. Jehoash king of Judah took all the holy things that his fathers Jehoshaphat, Jehoram and Ahaziah, kings of Judah, had dedicated, along with his own, and all the gold found in the treasuries of the LORD's house and of the king's house, and sent them to Hazael king of Syria. Then Hazael withdrew from Jerusalem.
  - range: 19-21
    heading: Joash slain
    plain: |
      The rest of the acts of Joash, and all that he did, are written in the book of the chronicles of the kings of Judah. His servants rose up, formed a conspiracy, and killed Joash at Beth-millo, on the road down to Silla. Jozachar son of Shimeath and Jehozabad son of Shomer, his servants, struck him down and he died. They buried him with his fathers in the city of David, and Amaziah his son became king in his place.

notes:
  - ref: 2
    phrase: all his days wherein Jehoiada the priest instructed him
    kind: history
    title: As long as Jehoiada taught him
    body: |
      The verdict on Jehoash is good, but only for a while: he did right for as long as Jehoiada taught him, and the limit is part of the verdict. The Greek translation reads the same way, “all the days that Jodae the priest instructed him,” and Chronicles makes it plainer still: “all the days of Jehoiada the priest” ([[2 Chr. 24:2]]). Jehoiada's advice and support were probably the most important factor in the reign, and Jehoash “did not continue as he had commenced.”

      Kings does not tell what happened when the teaching stopped. Chronicles does. Jehoiada died at a great age and was buried among the kings; then the princes of Judah came to the king, “Then the king hearkened unto them,” and they “left the house of the Lord God of their fathers, and served groves and idols” ([[2 Chr. 24:17–18]]). When Jehoiada's son Zechariah rebuked them, they stoned him in the temple court “at the commandment of the king” ([[2 Chr. 24:21]]). The temple repairs of verses 4–16 belong to the years before that turn; the end of the chapter (notes on verses 18 and 20) belongs to the years after it.
    sources: [lxx-rahlfs, lds-scriptures, ot-manual-6]

  - ref: 4
    phrase: the money of every one that passeth the account
    kind: words
    title: Census money or current money
    body: |
      Verse 4 names three kinds of temple income, and the first is the one the King James translators read as census money. Their “every one that passeth the account” echoes the law of the half shekel, paid by “every one that passeth among them that are numbered” ([[Ex. 30:13]]). The Hebrew is only two words, *kesep ʿōbēr*, “passing money.” The standard lexicon lists this verse with the phrase in [[Gen. 23:16]], which the King James renders “current money with the merchant,” so the words may mean only money that passes in trade. The plain words above follow the King James, and Chronicles leans the same way: it gathers the whole income under one name, “the collection that Moses the servant of God laid upon Israel in the wilderness” ([[2 Chr. 24:9]]), and the Church's footnote at [[2 Chr. 24:6]] sends that collection to the half shekel of [[Ex. 30:12–16]].

      The other two kinds are clearer. “The money that every man is set at” is valuation money: its Hebrew word, *ʿērek*, is the law's word for the sum the priest set for a person vowed to the LORD and for redemption ([[Lev. 27:2–8]]; [[Num. 18:16]]). The last is every freewill gift. Whichever the first phrase means, the king's point is that every kind of money that came into the house was to go to its repair.
    sources: [bdb, lds-scriptures]

  - ref: 9
    phrase: Jehoiada the priest took a chest, and bored a hole in the lid of it
    kind: history
    title: Why the repairs stalled, and what the chest changed
    body: |
      The king's question “Why repair ye not?” gets no answer in Kings or in Chronicles, though the delay was long: by the king's twenty-third year Jehoash was about thirty. Chronicles says the work was large, since the sons of Athaliah “had broken up the house of God” ([[2 Chr. 24:7]]), and that the Levites sent out to collect “hastened it not” ([[2 Chr. 24:5]]). They were slow, then, in gathering the money and probably in setting aside part of what they received for the repairs; they may also have found it hard to raise enough and to divide it between their own support and the repair fund. So the king took the work out of their hands (verses 7–8), less to punish them, it seems, than because the first arrangement had not done what it was meant to do.

      The chest changed the method. Money that had been given to each priest privately, with no united action, now went into one box beside the altar and was counted by the king's scribe and the high priest. Chronicles adds a proclamation through the land, and the people “rejoiced, and brought in, and cast into the chest, until they had made an end” ([[2 Chr. 24:10]]). The givers could now see that others were giving too, and that the sum was kept in regular account, and the work came to life. The same arrangement, money counted and given to overseers who were trusted with no reckoning “because they dealt faithfully,” returns when Josiah repairs the temple ([[2 Kgs. 22:7]]).

      Verse 13 says none of this money made vessels of silver or gold, and Chronicles says vessels were made from it, but Chronicles places them afterward: “when they had finished it, they brought the rest of the money before the king and Jehoiada, whereof were made vessels for the house of the Lord” ([[2 Chr. 24:14]]). Kings speaks of the money while the work went on, and Chronicles of what was left over, so the two need not conflict.
    sources: [lds-scriptures, cambridge-kings, keil-kings]

  - ref: 18
    phrase: took all the hallowed things
    kind: history
    title: The temple's treasures sent to Hazael
    body: |
      Hazael was the king of Syria whose future cruelty made Elisha weep (see [[2 Kgs. 8:12]]). He had made war on Israel and Judah for Ramoth-gilead and, after a defeat by Assyria, grew strong enough to attack again; these verses are one of those attacks. When he took Gath and set his face toward Jerusalem, Jehoash bought him off with everything dedicated to the temple by three kings before him and by himself, and all the gold in the treasuries of the temple and the palace. His ancestor Asa had paid an earlier Syrian king the same way ([[1 Kgs. 15:18]]).

      The temple was often stripped like this, by foreign enemies and by kings of Judah buying off an attack, and Joash belongs to both lists that count its history: among the kings who spoiled it and among the two, he and Josiah, who restored it. In this chapter he does both. Chronicles tells the Syrian invasion as judgment: a small Syrian company defeated a very great host of Judah, “because they had forsaken the Lord God of their fathers” ([[2 Chr. 24:24]]).
    sources: [bd-hazael, bd-temple-of-solomon, lds-scriptures]

  - ref: 20
    phrase: his servants arose, and made a conspiracy
    kind: history
    title: Why his servants killed him
    body: |
      Kings names the killers and gives no motive; Chronicles gives it: the servants conspired “for the blood of the sons of Jehoiada the priest, and slew him on his bed” ([[2 Chr. 24:25]]). The king Jehoiada had hidden as a small child, crowned and taught had his teacher's son Zechariah stoned, and Chronicles says outright that “Joash the king remembered not the kindness which Jehoiada his father had done to him” ([[2 Chr. 24:22]]).

      The two burials make the contrast. Jehoiada was buried in the city of David “among the kings, because he had done good in Israel” ([[2 Chr. 24:16]]), a mark of honor. Joash was buried in the city of David as verse 21 says, “but they buried him not in the sepulchres of the kings” ([[2 Chr. 24:25]]). His son Amaziah later put the killers to death but spared their children, as the law of Moses required ([[2 Kgs. 14:5–6]]).
    sources: [lds-scriptures, bd-jehoiada]

christ: |
  Listing the righteous blood that would be required of His generation, Jesus ended with “Zacharias, which perished between the altar and the temple” ([[Luke 11:51]]). The Bible Dictionary sends the reader from that verse to Zechariah son of Jehoiada, stoned in the temple court at Joash's command ([[2 Chr. 24:20–22]]), though Matthew calls the martyr “Zacharias son of Barachias” ([[Matt. 23:35]]). Jesus also mourned over “Jerusalem, thou that killest the prophets” ([[Matt. 23:37]]). Joash's goodness lasted as long as his teacher's life. Heber C. Kimball warned the Saints that the time would come when no one could endure on borrowed light, and Elder Henry D. Taylor drew the lesson that each must gain a personal knowledge of the truth: a teacher's faith can raise a disciple, but it does not stand in for that disciple's own witness that Jesus Christ is the Savior.

explore: |
  - **The rest of the story.** [[2 Chr. 24]]: Jehoiada's death, the princes' counsel, Zechariah's rebuke and his last words, “The Lord look upon it, and require it.”
  - **The boy hidden in the temple.** [[2 Kgs. 11]], Athaliah's reign and Jehoiada's covenant.
  - **The same repair under Josiah.** [[2 Kgs. 22:3–7]], where the chest's arrangement returns and leads to the finding of the book of the law.

