chapter: 4
title: They Shall Eat, and Shall Leave Thereof
tagline: Elisha fills a prophet's widow's vessels with oil, promises a son to the woman of Shunem and raises him from the dead, heals the poisoned pottage at Gilgal, and feeds a hundred men with twenty loaves.
when: 'In the reign of Jehoram son of Ahab, king of Israel'

setting: |
  Elisha has just taken up Elijah's mantle and parted the Jordan with it ([[2 Kgs. 2:13–15]]), and in chapter 3 he spoke before three kings in the war of Jehoram son of Ahab against Moab ([[2 Kgs. 3:1]]). Chapter 4 turns from kings to households. Its four stories belong to a run of more than two dozen miracle stories in chapters 2–7, told one after another, with little of Elisha's teaching among them. Most of the people helped are connected with the companies of prophets, “the sons of the prophets,” and nearly all of Elijah's and Elisha's work was done in the northern kingdom. The stories may not be told in order: the “dearth” at Gilgal (verse 38) may well be the famine Elisha foretells in [[2 Kgs. 8:1]], and the Shunammite's story goes on there after it.

  Several of these miracles answer Elijah's. A widow's oil does not fail, and a dead son is laid on the prophet's bed and given back to his mother, as at Zarephath ([[1 Kgs. 17:8–24]]). Others look forward to Jesus: the Shunammite's son to the widow's son Jesus raised at Nain ([[Luke 7:11–16]]), and the hundred fed to the five thousand ([[John 6:1–13]]); that comparison is drawn at [[2 Kgs. 4:44]].
thread: |
  The people Elisha helps here are the faithful of a kingdom that worshipped Jeroboam's calves. The widow's husband “did fear the LORD” (verse 1), one of the prophets' companies. The Shunammite's husband supposes she is going to the prophet for the new moon or the sabbath (verse 23); on one older reading, the prophets held services in Jehovah's name on those days and did the work of a priesthood the north did not have. The man from Baal-shalisha brings his firstfruits to “the man of God” (verse 42). On that reading there was real faith in Israel even at the worst time in its history, and the firstfruits at Gilgal show the LORD caring for those who served Him, giving them, through His prophet, what the law had assigned to the priests.

  Each story begins with too little: a single pot of oil against a creditor, no son and an old husband, death in the pot in a famine, twenty loaves for a hundred men. Each ends with enough. The chapter's last words say how: “they did eat, and left thereof, according to the word of the LORD” (verse 44).

sections:
  - range: 1-7
    heading: The widow's oil
    plain: |
      The widow of one of the sons of the prophets cried to Elisha, “Your servant my husband is dead, and you know that he feared the LORD. Now the man he owed is coming to take my two sons as his slaves.” Elisha asked her, “What shall I do for you? Tell me, what do you have in the house?” She said, “Your servant has nothing in the house but a jar of oil.” He said, “Go and borrow empty jars from all your neighbors, and not just a few. Then go inside, shut the door behind you and your sons, and pour the oil into all those jars, setting each one aside when it is full.” She went and shut the door behind her and her sons. They brought her the jars, and she kept pouring. When the jars were full she said to her son, “Bring me another one.” He said, “There are no more,” and the oil stopped. She went and told the man of God, and he said, “Go, sell the oil and pay your debt, and you and your sons can live on what is left.”
  - range: 8-17
    heading: The woman of Shunem
    plain: |
      One day Elisha went to Shunem, where a wealthy woman lived, and she pressed him to stay for a meal. After that, whenever he passed that way, he stopped there to eat. She said to her husband, “I can see that this man who keeps coming by is a holy man of God. Let us make a small room on the wall and put a bed, a table, a chair and a lamp in it for him, so that he can stay there when he comes.” One day he came, went up to the room and lay down. He said to Gehazi his servant, “Call this Shunammite woman,” and she came and stood before him. Elisha said to Gehazi, “Tell her, ‘You have gone to all this trouble for us. What can be done for you? Shall we speak to the king or the commander of the army for you?’” She answered, “I live among my own people.” Elisha asked, “What can be done for her, then?” Gehazi said, “She has no child, and her husband is old.” “Call her,” Elisha said, and she came and stood in the doorway. He said, “At this time next year you will hold a son in your arms.” “No, my lord,” she said, “man of God, do not deceive your servant.” But the woman conceived, and at that time the next year she gave birth to a son, as Elisha had told her.
  - range: 18-37
    heading: The son raised
    plain: |
      The child grew. One day he went out to his father among the reapers, and he said to his father, “My head, my head!” His father told a servant, “Carry him to his mother.” The servant brought him to her, and he sat on her lap until noon, and then he died. She went up, laid him on the bed of the man of God, shut the door and went out. She called to her husband, “Send me one of the servants and a donkey, so that I can hurry to the man of God and come back.” He asked, “Why go to him today? It is neither the new moon nor the sabbath.” “It is all right,” she said. She saddled the donkey and told her servant, “Drive on, and do not slow down for me unless I tell you.” So she came to the man of God at Mount Carmel. When he saw her in the distance he said to Gehazi, “Look, there is the Shunammite. Run to meet her and ask her, ‘Are you well? Is your husband well? Is the child well?’” She answered, “All is well.” But when she reached the man of God on the hill she took hold of his feet. Gehazi came to push her away, but the man of God said, “Leave her alone. She is in bitter distress, and the LORD has hidden it from me and not told me.” She said, “Did I ask my lord for a son? Did I not say, ‘Do not deceive me’?” Elisha said to Gehazi, “Tuck up your robe, take my staff and go. If you meet anyone, do not greet him, and if anyone greets you, do not answer. Lay my staff on the boy's face.” But the boy's mother said, “As surely as the LORD lives and as you live, I will not leave you.” So he got up and followed her. Gehazi went on ahead and laid the staff on the boy's face, but there was no sound and no response. He went back to meet Elisha and told him, “The boy has not woken up.” When Elisha came into the house, there was the boy, dead, lying on his bed. He went in, shut the door on the two of them, and prayed to the LORD. Then he got on the bed and lay on the child, his mouth on the boy's mouth, his eyes on his eyes, his hands on his hands. As he stretched himself out over him, the boy's body grew warm. Elisha got up, walked back and forth in the house, then went up and stretched himself out over him again. The boy sneezed seven times and opened his eyes. Elisha called Gehazi and said, “Call the Shunammite,” and he did. When she came in, Elisha said, “Take your son.” She came in, fell at his feet and bowed to the ground. Then she took her son and went out.
  - range: 38-41
    heading: Death in the pot
    plain: |
      Elisha came back to Gilgal while there was famine in the land. The sons of the prophets were sitting before him, and he told his servant, “Put on the big pot and cook a stew for the sons of the prophets.” One of them went out into the field to gather herbs. He found a wild vine and gathered his lap full of its wild gourds, came back and sliced them into the pot of stew, not knowing what they were. The stew was served to the men, and as they began to eat they cried out, “Man of God, there is death in the pot!” and they could not eat it. Elisha said, “Bring some flour.” He threw it into the pot and said, “Serve it to the people to eat.” And there was nothing harmful in the pot.
  - range: 42-44
    heading: A hundred men fed
    plain: |
      A man came from Baal-shalisha bringing the man of God bread from the firstfruits: twenty loaves of barley bread and some fresh ears of grain. Elisha said, “Give it to the people to eat.” His servant said, “How can I set this before a hundred men?” Elisha said again, “Give it to the people to eat, for this is what the LORD says: ‘They will eat and have some left over.’” So he set it before them, and they ate and had some left over, as the LORD had said.

notes:
  - ref: 2
    phrase: Thine handmaid hath not any thing in the house, save a pot of oil
    kind: history
    title: A widow's oil, like Elijah's
    body: |
      The widow's oil repeats Elijah's miracle for the widow of Zarephath, with differences. This widow is an Israelite, where Elijah's was a woman of Zidon; she has two sons, not one; and she fills many vessels with oil, where Elijah's widow had only her one cruse. Her danger is debt, not famine: her sons were to work off what their father owed, a custom the law of Moses limited and that was still known in Jesus' day ([[Matt. 18:25]]).

      Elisha begins by asking what she has, and she has almost nothing. The oil runs as long as there are vessels to hold it and stops when the last borrowed vessel is full, and the prophet sends her to sell it, pay the debt and live on the rest. Taken together, the two widows' miracles make a double witness; what they witness of is said at the close of [[1 Kgs. 17]].
    sources: [ot-minute-2-kings-4, scripture-helps-2-kings-2, read-elijah-elisha]

  - ref: 8
    phrase: where was a great woman
    kind: history
    title: A great woman of Shunem
    body: |
      “Great” here most likely means wealthy and influential, and the standing seems to have been her own: her husband is hardly mentioned in the story. Shunem lay ten or fifteen miles east of Mount Carmel, where Elisha spent time ([[2 Kgs. 2:25]]; verse 25), so Elisha's journeys from there would likely take him past it. She began by pressing a meal on him, and his stopping there became a habit.
    sources: [ot-minute-2-kings-4]

  - ref: 10
    phrase: a little chamber, I pray thee, on the wall
    kind: history
    title: A chamber on the wall
    body: |
      The room she built was an upper chamber, set on the roof or as a second story, the kind of room a house kept furnished for honored guests. It was called a chamber “on the wall” probably because its window, opening to the street, was the one break in the house's blank outer wall. She furnished it with a bed, a table, a stool and a lamp for a man she had recognized as “an holy man of God” (verse 9).

      In the story the room matters again when the child dies, for his mother lays him on “the bed of the man of God” (verse 21), as Elijah laid the widow's son on his own bed.
    sources: [ot-manual-6, ot-minute-2-kings-4]

  - ref: 13
    phrase: I dwell among mine own people
    kind: history
    title: I dwell among mine own people
    body: |
      Her answer declines the offer: she needs no one to speak for her at court. A word to the king, or to the captain of the host, who in Joab's day had immense influence, would be sought by someone in hardship or under oppression. On one older reading she is saying that she has no such need, since everyone around her is family and friends, and there is no enemy to be protected from.

      So Elisha asks Gehazi what can be done, and Gehazi names what she lacked and had not mentioned: “she hath no child, and her husband is old” (verse 14). She had cared for the prophet and asked for nothing when he offered a reward, and the reward Elisha and Gehazi settled on was a child.
    sources: [cambridge-kings, hilton-motherhood-ot]

  - ref: 16
    phrase: according to the time of life, thou shalt embrace a son
    kind: words
    title: Sarah's promise
    body: |
      Elisha's promise is worded as the LORD's promise to Abraham of a son for Sarah, and the footnote at verse 16 points there ([[Gen. 18:14]]). The Hebrew of both verses has the same phrases in the same order: *lammôʿēd* (“about this season” here), then *kāʿēt ḥayyâ*, “according to the time of life,” and both end with *bēn*, “a son.” The likeness runs beyond the words. Sarah made food for the LORD's messengers and heard the promise from the tent while they talked with Abraham ([[Gen. 18:6–10]]); the Shunammite fed the man of God, and he spoke with her at first through Gehazi.

      She stands in a line of barren women in the Old Testament, Sarah, Rebekah, Rachel, Samson's mother and Hannah among them, whose childlessness God answered with a promised son, a pattern Luke takes up when he begins with Elisabeth ([[Luke 1:7]]). Her reply, “do not lie unto thine handmaid,” is best taken as hope rather than doubt: in effect, let your words come true. Verse 17 says they did, “at that season that Elisha had said unto her.”
    sources: [oshb-wlc, lds-scriptures, ot-minute-2-kings-4, sc-knowhy-705, ot-manual-6]

  - ref: 23
    phrase: it is neither new moon, nor sabbath
    kind: history
    title: Neither new moon, nor sabbath
    body: |
      The husband's question shows that people went to the prophet on the holy days. The new moon, the first day of the month, was a monthly day of sacrifice ([[Num. 28:11–15]]), and the new moon and the sabbath were feasts at which a prophet might be asked to preside, as Samuel did at the high place of Ramah ([[1 Sam. 9:12–13]]). So he connects her ride with a religious duty, not with their son, whom she has laid on the prophet's bed without a word. Another possibility is that people knew where to find Elisha only on those days.
    sources: [ot-minute-2-kings-4, ot-manual-6]

  - ref: 29
    phrase: lay my staff upon the face of the child
    kind: history
    title: The prophet's staff
    body: |
      The staff did nothing. Gehazi laid it on the child, “but there was neither voice, nor hearing” (verse 31), the expression used on Carmel of Baal, who did not answer ([[1 Kgs. 18:29]]). One older reading holds that Elisha sent the staff to teach, not to raise the child. On that reading the order to greet no one on the road was meant so that the failure could not be put down to any outward or accidental circumstance, and the failure itself showed the Shunammite's household, and perhaps Gehazi, that the power was not in the prophet's person or his staff in any magical way: such miracles come only through faith and prayer. What raised the child came when Elisha shut the door and “prayed unto the LORD” (verse 33).
    sources: [keil-kings]

  - ref: 30
    phrase: As the LORD liveth, and as thy soul liveth, I will not leave thee
    kind: history
    title: I will not leave thee
    body: |
      The mother's oath is Elisha's own. He had sworn it three times to Elijah on the road before Elijah was taken up ([[2 Kgs. 2:2]]; 2:4, 6), refusing to be left behind, and now she swears it to him, refusing to accept Gehazi in his place. To her husband she says only “It shall be well” (verse 23), and to Gehazi's three questions “It is well” (verse 26), though the child lay dead; after the way she had been spoken to through Gehazi in verses 13–14, perhaps she was saving her plea for Elisha himself. At his feet she says what she had held back (verses 27–28). She would trust no one but the prophet to heal her son.
    sources: [ot-minute-2-kings-4, hilton-motherhood-ot]

  - ref: 34
    phrase: he stretched himself upon the child; and the flesh of the child waxed warm
    kind: history
    title: The flesh of the child waxed warm
    body: |
      The raising of the Shunammite's son follows Elijah's raising of the widow's son at Zarephath closely. In both the dead boy lies on the prophet's bed, the prophet is alone with him and prays, and he stretches himself on the child ([[1 Kgs. 17:19–22]]; how the two acts compare is at [[1 Kgs. 17:21]]). This account tells it in stages: Elisha lies on the boy mouth to mouth, eyes to eyes, hands to hands, and the body grows warm; he walks the house, stretches himself on him again, and the boy sneezes seven times and opens his eyes.

      The raised child is one of three miracles that Elijah and Elisha share, with the parted Jordan and the multiplied food. In a Latter-day Saint reading they prefigured a prophet to come: Jesus, the Anointed One, would calm the storm, feed the five thousand and raise the dead.
    sources: [ot-minute-2-kings-4, seely-messiah]

  - ref: 41
    phrase: Then bring meal
    kind: history
    title: Death in the pot
    body: |
      The cry “there is death in the pot” (verse 40) was no exaggeration. The wild gourds were probably the fruit of *Calotropis procera*, sometimes called the apple of Sodom: a little causes severe diarrhea, and a large amount can kill. Elisha's remedy is meal, as at Jericho he had healed the spring with a cruse of salt ([[2 Kgs. 2:21]]), and “there was no harm in the pot.”
    sources: [ot-minute-2-kings-4]

  - ref: 42
    phrase: bread of the firstfruits, twenty loaves of barley
    kind: history
    title: Firstfruits for the man of God
    body: |
      By the law the firstfruits belonged to the priests ([[Num. 18:13]]; [[Deut. 18:4–5]]), and this man brings them to the prophet. On one older reading, the godly in the northern kingdom did not accept Jeroboam's worship as lawful, and found in the prophets' companies a substitute for the worship of God; a man bringing his firstfruits as a religious duty, with no lawful sanctuary to take them to, would give them to Elisha as God's representative. The gift was small, twenty barley loaves and some fresh ears, little enough for one man to carry in a sack, and Elisha gave all of it away to the hundred.
    sources: [keil-kings, cambridge-kings]

  - ref: 44
    phrase: they did eat, and left thereof, according to the word of the LORD
    kind: christ
    title: They shall eat, and shall leave thereof
    body: |
      The hundred fed looks forward to Jesus' feeding of the five thousand ([[John 6:1–13]]); feeding a multitude with little food is one of the miracles of Elisha that prefigure Christ's. The likeness is in the details. Here there are twenty barley loaves, and in John “five barley loaves” ([[John 6:9]]). Here a servant objects that the food cannot go round, and in John a disciple asks, “what are they among so many?” ([[John 6:9]]). In both there is food left over, and the footnote at verse 44 points to the fragments gathered after the five thousand and the four thousand ([[Matt. 14:20]]; [[Matt. 15:37]]).
    sources: [cfm-ot-2026-28, barlow-miracles, lds-scriptures]

christ: |
  Elisha's miracles point beyond him to Jesus Christ. The prophet gave a dead son back to his mother and fed a hundred with twenty loaves; Jesus raised the widow's son at Nain and “delivered him to his mother” ([[Luke 7:15]]), and fed five thousand from five loaves ([[2 Kgs. 4:44]]).

  The Shunammite received the Lord's servant and was blessed, and the Lord's word to His servants stands: “he that receiveth my servants receiveth me” ([[D&C 84:36]]). The widow who turned to the prophet with only a pot of oil shows the principle the Church draws from her story: when a disciple turns to the Lord in faith, He can bless that disciple according to his or her needs and righteous desires.

explore: |
  - **Elijah's widow and son.** [[1 Kgs. 17:8–24]], the miracles this chapter's first two stories answer.
  - **The Shunammite again.** [[2 Kgs. 8:1–6]], where she returns after the famine to claim her house and land.
  - **Jesus' miracles.** [[Luke 7:11–17]] (the widow's son at Nain) and [[John 6:1–14]] (the five thousand).
  - **What miracles are for.** A reflection on 2 Kings 2–7, “[What Are Miracles For?](https://mi.byu.edu/old-testament-reflections/what-are-miracles-for)”

