chapter: 19
title: That Which Thou Hast Prayed to Me I Have Heard
tagline: Hezekiah takes the Assyrian's threats into the house of the LORD and sends to Isaiah; the LORD answers his prayer, and in one night the army that surrounded Jerusalem is gone.
when: 'Hezekiah''s fourteenth year (18:13), the same campaign as chapter 18'

setting: |
  Chapter 18 ended with Hezekiah's officers coming back from the Rabshakeh with their clothes torn. Sennacherib had taken the fortified cities of Judah, and the tribute Hezekiah paid had not turned him back ([[2 Kgs. 18:13–17]]). Chapter 19 tells what Hezekiah did next and how the city was spared. The campaign is the one Sennacherib led against Judah in 701 BC, in which he destroyed many fortified towns and carried away thousands of people but did not take Jerusalem.

  Hezekiah's reign coincided with Isaiah's ministry, and here, in the nineteenth chapter of 2 Kings, the prophet first appears in the history. The chapter runs with [[Isa. 37]] almost word for word, and Chronicles tells the same deliverance in four verses ([[2 Chr. 32:20–23]]). This site has already explained the Isaiah chapter: Hezekiah's first response ([[Isa. 37:1]]), the birth image ([[Isa. 37:3]]), Tirhakah ([[Isa. 37:9]]), the letter spread before the LORD and the prayer ([[Isa. 37:14]], [[Isa. 37:16]]), the taunt-song, the hook in the nose and the sign of the remnant ([[Isa. 37:26]], [[Isa. 37:29]], [[Isa. 37:31]]), and Sennacherib's death ([[Isa. 37:38]]). The notes here stay with what Kings adds or what the history of Kings makes of it.

thread: |
  Chapter 18 set Hezekiah apart from every king of Judah by his trust, “he trusted in the LORD God of Israel” ([[2 Kgs. 18:5]]), and then let the Rabshakeh mock that trust for a whole chapter. Chapter 19 is the test of it, and the answer is given in the order in which Hezekiah acts. He goes into the house of the LORD in sackcloth and sends to the prophet (verses 1–5). Isaiah answers that the king will “hear a rumour, and shall return to his own land,” and fall “by the sword in his own land” (verse 7). Then a second threat comes, a letter that turns the Rabshakeh's taunt into a charge against the LORD Himself, “Let not thy God in whom thou trustest deceive thee” (verse 10). Hezekiah takes the letter to the temple, spreads it before the LORD, and prays that the kingdoms of the earth may know “that thou art the LORD God, even thou only” (verse 19).

  The answer begins with “I have heard” (verse 20), and the end of the chapter carries out what Isaiah said in verse 7: Sennacherib “returned, and dwelt at Nineveh” (verse 36), and there he fell by the sword in his own land (verse 37). Hezekiah and his people trusted the LORD, and the LORD saved the city.

sections:
  - range: 1-7
    heading: The king goes to the LORD's house and sends to the prophet
    plain: |
      When King Hezekiah heard the report, he tore his clothes, put on sackcloth, and went into the house of the LORD. He sent Eliakim, who was in charge of the palace, Shebna the scribe, and the senior priests, all in sackcloth, to the prophet Isaiah son of Amoz. They told him: “Hezekiah says this: Today is a day of distress, of rebuke and of disgrace. We are like a woman whose children have come to the moment of birth, and she has no strength left to deliver them. Perhaps the LORD your God will hear all the words of the Rabshakeh, whom his master the king of Assyria sent to mock the living God, and will punish him for the words the LORD your God has heard. So offer a prayer for the remnant that is still left.” When King Hezekiah's servants came to Isaiah, Isaiah told them: “Say this to your master: The LORD says, Do not be afraid of the words you have heard, the words with which the king of Assyria's servants have blasphemed Me. I will put a spirit in him: he will hear a report and go back to his own land, and in his own land I will have him cut down by the sword.”
  - range: 8-13
    heading: A second threat, in writing
    plain: |
      The Rabshakeh went back and found the king of Assyria fighting against Libnah, for he had heard that the king had left Lachish. Then the king heard that Tirhakah king of Ethiopia had set out to fight him, and he sent messengers to Hezekiah once more with this message for the king of Judah: “Do not let your God, in whom you trust, deceive you by promising that Jerusalem will not be handed over to the king of Assyria. You have heard what the kings of Assyria have done to every land, destroying them completely. Will you be the one rescued? Did the gods of the nations my fathers destroyed rescue them: Gozan, Haran, Rezeph, and the people of Eden in Telassar? Where is the king of Hamath, the king of Arpad, the king of the city of Sepharvaim, of Hena and of Ivah?”
  - range: 14-19
    heading: Hezekiah's prayer
    plain: |
      Hezekiah took the letter from the messengers and read it. Then he went up to the house of the LORD and spread it out before the LORD, and prayed: “LORD, God of Israel, enthroned above the cherubim, You alone are God of all the kingdoms of the earth; You made heaven and earth. Bend down Your ear, LORD, and hear; open Your eyes, LORD, and see. Hear the words Sennacherib has sent to mock the living God. It is true, LORD, that the kings of Assyria have laid waste the nations and their lands and thrown their gods into the fire. But those were no gods, only things made by human hands, wood and stone, and so they could destroy them. Now, LORD our God, save us from his hand, I pray, so that all the kingdoms of the earth may know that You, LORD, are God, You alone.”
  - range: 20-34
    heading: The LORD's answer through Isaiah
    plain: |
      Then Isaiah son of Amoz sent word to Hezekiah: “The LORD God of Israel says: I have heard your prayer to Me about Sennacherib king of Assyria. This is the word the LORD has spoken about him: The virgin daughter of Zion despises you and laughs at you; the daughter of Jerusalem shakes her head behind you as you go. Whom have you mocked and blasphemed? Against whom have you raised your voice and lifted your eyes so proudly? Against the Holy One of Israel! Through your messengers you have mocked the Lord. You said: With my many chariots I have climbed the heights of the mountains, the far reaches of Lebanon; I will cut down its tallest cedars and its finest cypresses; I will reach its farthest lodging, its thickest forest. I have dug wells and drunk foreign water, and with the soles of my feet I have dried up all the streams of the besieged places. Have you not heard that I planned this long ago, and shaped it in days of old? Now I have brought it about, so that you could turn fortified cities into heaps of ruins. That is why their people had so little strength: they were dismayed and put to shame, as weak as grass in the field or green shoots, like grass on the rooftops, scorched before it grows. But I know where you stay, when you go out and come in, and how you rage against Me. Because your raging and your arrogance have reached My ears, I will put My hook in your nose and My bridle in your mouth, and turn you back by the way you came. And this will be the sign for you, Hezekiah: this year you will eat what grows by itself, next year what springs up from that, but in the third year you will sow and reap, plant vineyards and eat their fruit. The survivors of the house of Judah who are left will again take root below and bear fruit above. For a remnant will go out from Jerusalem, and survivors from Mount Zion. The zeal of the LORD of hosts will do this. So the LORD says this about the king of Assyria: He will not come into this city or shoot an arrow here; he will not come before it with a shield or build a siege ramp against it. He will go back by the way he came, and he will not come into this city, says the LORD. For I will defend this city and save it, for My own sake and for the sake of My servant David.”
  - range: 35-37
    heading: The deliverance
    plain: |
      That night the angel of the LORD went out and struck down a hundred and eighty-five thousand in the Assyrian camp, and when people got up early in the morning, there were all the dead bodies. So Sennacherib king of Assyria broke camp and went home, and stayed at Nineveh. One day, while he was worshipping in the house of his god Nisroch, his sons Adrammelech and Sharezer struck him down with the sword and escaped to the land of Armenia. His son Esarhaddon became king in his place.

notes:
  - ref: 2
    phrase: to Isaiah the prophet the son of Amoz
    kind: history
    title: Isaiah enters the history
    body: |
      Isaiah had prophesied since the days of Uzziah ([[Isa. 1:1]]), but this verse is the first time 2 Kings names him: Kings tells his part in Hezekiah's reign only, here and in chapter 20. The king sends his chief officers in sackcloth to ask two things of the prophet: counsel, and prayer “for the remnant that are left” (verse 4). Chronicles, telling the same crisis, puts the two men side by side: “Hezekiah the king, and the prophet Isaiah the son of Amoz, prayed and cried to heaven” ([[2 Chr. 32:20]]).

      Isaiah's reply in verses 6–7 was not new to him. It echoes what he had prophesied years before, in the passage where the Assyrian advances city by city toward Jerusalem until the LORD of hosts “shall lop the bough with terror” and cut down Lebanon ([[Isa. 10:28–34]]). The assurance Hezekiah received was the word Isaiah had already spoken about this enemy.
    sources: [scripture-helps-2-kings-16-25, lds-scriptures]

  - ref: 20
    phrase: That which thou hast prayed to me against Sennacherib king of Assyria I have heard
    kind: scripture
    title: '“I have heard”'
    body: |
      Kings says outright what Isaiah's version leaves to be understood: the LORD's reply to Hezekiah opens with “I have heard.” In Isaiah the sentence stops at “Whereas thou hast prayed to me against Sennacherib king of Assyria” ([[Isa. 37:21]]), and the answer simply follows; Kings adds the verb, and the thought becomes clear. The prayer of verses 15–19 asked the LORD to “bow down thine ear, and hear” (verse 16), and the first word of the answer is that He has.

      What follows is the content of that hearing. First the retreat of Sennacherib, told as the LORD's scorn for his boasting (verses 21–28); then a sign by which Hezekiah would know the city was delivered (verses 29–31), and the promise that the Assyrian would not enter Jerusalem or lay siege to it (verses 32–34). One older reading adds that the approach of Tirhakah (verse 9) was already the LORD's providence at work, and that at Hezekiah's prayer He added the miracle of verse 35 to it. On any reading, the text sets the deliverance after the prayer and as its answer.
    sources: [keil-kings, scripture-helps-2-kings-16-25, lds-scriptures]

  - ref: 34
    phrase: for mine own sake, and for my servant David’s sake
    kind: scripture
    title: A promise kept, and later misread
    body: |
      The LORD gives two reasons for defending Jerusalem, His own name and His servant David, and the second is one Kings has given before. It is why the LORD would not destroy Judah under a wicked king ([[2 Kgs. 8:19]], “A light kept for David”; the promise is explained at [[1 Kgs. 11:36]]). Here it keeps the capital itself from an army that had taken the fortified cities of Judah ([[2 Kgs. 18:13]]).

      That deliverance had a long afterlife. When Babylon besieged Jerusalem about a century later, many in the city firmly believed it could not be conquered, and the LORD's promise to Hezekiah, kept in 701 BC, was one of the reasons. Laman and Lemuel shared the belief ([[1 Ne. 2:13]]). But the promises to protect the city had always depended on the people's obedience; the condition is the note at [[1 Kgs. 9:6]], and Jeremiah's warning against trusting in “the temple of the LORD” is the note at [[Jer. 7:4]]. The promise that saved the city in Hezekiah's day did not save it a century later, when the people had not kept the condition.
    sources: [sc-knowhy-451, lds-scriptures]

  - ref: 35
    phrase: it came to pass that night, that the angel of the LORD went out
    kind: history
    title: That night
    body: |
      Kings ties the deliverance to the night after the promise: where Isaiah's account begins with “Then” ([[Isa. 37:36]]), Kings says “that night.” The text says only that “the angel of the LORD” struck the camp and that the dead were found in the morning; Chronicles adds that the angel “cut off all the mighty men of valour, and the leaders and captains,” and that Sennacherib went home “with shame of face” ([[2 Chr. 32:21]]). The blow is understood as a plague that struck the Assyrian camp, and other biblical and historical sources suggest that the Lord may have sent one. The site's note on the deliverance at [[Isa. 37:36]] sets the account beside Sennacherib's own annals.

      The King James wording, “when they arose early in the morning, behold, they were all dead corpses,” leaves unclear who it was that arose. Joseph Smith's revision of the parallel verse, [[Isa. 37:36]], adds “who were left,” which makes it the survivors who awoke to find the bodies. The figure, 185,000, may have been magnified to emphasize the Lord's power in the deliverance, as has been suggested; the text gives it as it stands, and the point it makes, that the city was saved by the LORD and not by an army, does not depend on the count.
    sources: [scripture-helps-2-kings-16-25, jsp-ot2, sc-knowhy-648, lds-scriptures]

christ: |
  Hezekiah prayed to the God who “hast made heaven and earth” (verse 15): the Creator, Jehovah, the premortal Jesus Christ, as the closing section of [[Isa. 37]] on this site explains. Hezekiah himself, who offered an intercessory prayer on behalf of his people, was “a type and a shadow of Jesus Christ—the true Messiah and great high priest who was to come,” the High Priest of [[Heb. 4:14]].

  Hezekiah met a challenge to his faith by going to the Lord's house, seeking the prophet's counsel and laying the enemy's words before the Lord in prayer, and the Lord answered. Most disciples meet experiences that challenge their faith, and the same Lord hears them when, like Hezekiah, they lay the challenge before Him.

explore: |
  - **The other accounts.** [[Isa. 37]] (with this site's notes) and [[2 Chr. 32:1–23]], which adds Hezekiah's preparations for the siege.
  - **Isaiah's earlier word.** [[Isa. 10:5–34]]: Assyria as the rod in the LORD's hand, and the boast He would break.
  - **Jerusalem's later trust.** [[Jer. 7:1–15]] and [[1 Ne. 2:13]].

parallels:
