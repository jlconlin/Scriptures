chapter: 10
title: See My Zeal for the LORD
tagline: Jehu has the seventy heirs of Ahab killed by their own guardians, cuts down the princes of Judah on the road, takes Jehonadab into his chariot, and traps the worshippers of Baal in their own temple; the LORD commends the deed, but Jehu keeps the golden calves, and Hazael begins to take Israel's land.
when: 'The beginning of Jehu''s reign over Israel, which lasted twenty-eight years (verse 36), at Jezreel and Samaria'

setting: |
  Chapter 10 finishes the revolt that chapter 9 began. Anointing Jehu was one of the last commissions the LORD gave Elijah ([[1 Kgs. 19:16]]), and Elisha carried it out through one of the sons of the prophets, with the charge “thou shalt smite the house of Ahab thy master” ([[2 Kgs. 9:7]]). By the end of chapter 9, Jehu has killed Joram king of Israel and Ahaziah king of Judah ([[2 Kgs. 9:24]], 27) and has had Jezebel thrown down at Jezreel ([[2 Kgs. 9:33]]). The rest of Ahab's house is still alive in Samaria, the capital Omri built ([[1 Kgs. 16:24]]), where Ahab had raised an altar to Baal in the house of Baal he built there ([[1 Kgs. 16:32]]).

  The chapter takes the purge to its end, then judges it by the measure Kings applies to the northern kings after him as well: Jeroboam's calves at Bethel and Dan ([[1 Kgs. 12:28]]; [[2 Kgs. 13:2]]; [[2 Kgs. 14:24]]). It closes on Israel's eastern border, where Hazael of Syria begins to take Israel's land. Hosea later named his son Jezreel for the blood Jehu shed in this revolt ([[Hos. 1:4]], where the note “Why Jehu's house answers for Jezreel” takes up the tension).

thread: |
  The chapter turns on Jehu's own phrase: “Come with me, and see my zeal for the LORD” (verse 16). His zeal is beyond doubt. He wipes out Ahab's line in Jezreel and Samaria and destroys “Baal out of Israel” (verse 28), and he claims, as the narrator confirms, that the word the LORD spoke through Elijah has been fulfilled (verses 10, 17). The LORD Himself commends the deed and rewards it (verse 30).

  Then the narrator sets a second measure beside the first. Jehu kept Jeroboam's golden calves (verse 29), and he “took no heed to walk in the law of the LORD God of Israel with all his heart” (verse 31). The commendation is for the deed, not the man: the house of Ahab had earned its end and Jehu was the means of it, but the Lord was not pleased with his methods. Verse 32 adds that in those days “the LORD began to cut Israel short.”

sections:
  - range: 1-11
    heading: The seventy sons of Ahab
    plain: |
      Ahab had seventy sons in Samaria. Jehu wrote letters and sent them to Samaria, to the city's rulers, to the elders and to the guardians of Ahab's sons. “Since your master's sons are with you, and you have chariots and horses, a fortified city and weapons, as soon as this letter reaches you, choose the best and fittest of your master's sons, set him on his father's throne, and fight for your master's house.” But they were terrified. “Two kings could not stand against him,” they said. “How can we?” So the steward of the palace, the governor of the city, the elders and the guardians sent word to Jehu: “We are your servants, and we will do whatever you tell us. We will make no one king. Do whatever you think best.”

      Then he wrote them a second letter: “If you are on my side and will obey me, take the heads of your master's sons and come to me at Jezreel by this time tomorrow.” The seventy princes were being brought up by the leading men of the city. When the letter came, the men took the king's sons and killed all seventy, put their heads in baskets and sent them to Jehu at Jezreel. A messenger told him, “They have brought the heads of the king's sons.” He said, “Pile them in two heaps at the entrance of the gate until morning.” In the morning he went out, stood before all the people and said, “You are righteous. I conspired against my master and killed him; but who killed all these? Know, then, that nothing the LORD spoke against the house of Ahab will fail. The LORD has done what He said through His servant Elijah.” So Jehu killed everyone who was left of Ahab's house in Jezreel, all his great men, his close friends and his priests, until he left him no survivor.
  - range: 12-17
    heading: On the road to Samaria
    plain: |
      Then Jehu set out for Samaria. At the shearing house on the way, he met kinsmen of Ahaziah king of Judah and asked, “Who are you?” They said, “We are Ahaziah's kinsmen, and we are going down to greet the sons of the king and the sons of the queen mother.” He said, “Take them alive.” They took them alive and killed them at the pit of the shearing house, forty-two men; he left none of them.

      Going on from there, he came upon Jehonadab the son of Rechab, who was coming to meet him. Jehu greeted him and said, “Is your heart true to mine, as mine is to yours?” “It is,” Jehonadab answered. “If it is, give me your hand.” He gave him his hand, and Jehu took him up into the chariot and said, “Come with me and see my zeal for the LORD.” So they had him ride in his chariot. When he came to Samaria, he killed all who were left of Ahab's house there, until he had destroyed it, as the LORD had said to Elijah.
  - range: 18-28
    heading: The assembly for Baal
    plain: |
      Then Jehu gathered all the people and said to them, “Ahab served Baal a little; Jehu will serve him much. Now call all the prophets of Baal, all his servants and all his priests to me. Let no one be missing, for I have a great sacrifice to offer to Baal. Whoever is missing will not live.” But Jehu was doing it by cunning, in order to destroy the worshippers of Baal. Jehu said, “Proclaim a solemn assembly for Baal,” and they proclaimed it. Jehu sent word through all Israel, and every worshipper of Baal came; not one stayed away. They went into the house of Baal, and it was full from one end to the other. He told the man in charge of the wardrobe, “Bring out robes for all the worshippers of Baal,” and he brought them out.

      Then Jehu and Jehonadab the son of Rechab went into the house of Baal, and Jehu said to the worshippers of Baal, “Search and make sure that none of the servants of the LORD are here with you, only the worshippers of Baal.” They went in to offer sacrifices and burnt offerings. Jehu had posted eighty men outside and told them, “If any of the men I am delivering into your hands escapes, the man who lets him go will pay with his life.” As soon as he had finished offering the burnt offering, Jehu told the guards and officers, “Go in and kill them; let no one come out.” They struck them down with the sword, threw the bodies out, and went on to the city of the house of Baal. They brought out the images from the house of Baal and burned them. They broke down the image of Baal, tore down the house of Baal and made it a latrine, as it is to this day. So Jehu wiped out Baal from Israel.
  - range: 29-36
    heading: The verdict on Jehu
    plain: |
      But Jehu did not turn away from the sins of Jeroboam the son of Nebat, who made Israel sin: the golden calves at Bethel and Dan. The LORD said to Jehu, “Because you have done well in carrying out what is right in my eyes, and have done to the house of Ahab all that was in my heart, your sons to the fourth generation will sit on the throne of Israel.” But Jehu did not take care to walk in the law of the LORD God of Israel with all his heart; he did not turn away from the sins of Jeroboam, who made Israel sin.

      In those days the LORD began to cut away pieces of Israel. Hazael struck them throughout Israel's territory east of the Jordan: all the land of Gilead, the Gadites, the Reubenites and the Manassites, from Aroer by the Arnon valley through Gilead and Bashan. The rest of Jehu's acts, all he did and all his might, are written in the book of the chronicles of the kings of Israel. Jehu died and was buried in Samaria, and his son Jehoahaz reigned after him. Jehu reigned over Israel in Samaria twenty-eight years.

notes:
  - ref: 1
    phrase: Ahab had seventy sons in Samaria
    kind: history
    title: Ahab’s seventy sons
    body: |
      The seventy were Ahab's male line, the heirs who could claim his throne. Many were probably grandsons, since the Hebrew word for “son” reaches to grandsons and to descendants in general, as in verse 30's “children of the fourth generation.” The Student Manual puts Jehu's aim plainly: he “wanted to kill all the sons or grandsons of Ahab who were part of the royal line and therefore heirs to the throne of Israel.”

      The first letter is a dare. The men of Samaria have the princes, chariots and horses, a fortified city and weapons; let them crown the best of Ahab's sons and fight. Their answer shows they have already counted the dead: “two kings stood not before him: how then shall we stand?” ([[2 Kgs. 10:4]]). The two kings are the two Jehu had just killed, Joram of Israel and Ahaziah of Judah ([[2 Kgs. 9:24]], 27). The second letter takes the men at their word, and the guardians of the princes become their killers.
    sources: [bdb, ot-manual-6, lds-scriptures]

  - ref: 9
    phrase: but who slew all these?
    kind: history
    title: Who slew all these?
    body: |
      Jehu owns the one killing he could not deny and disowns the seventy he had ordered. Standing by the two heaps of heads at the gate, he tells the people they are righteous: he conspired against his master, but who killed all these? He leaves out that the heads came at his written command (verse 6). One older reading takes the speech as a calculated defense. Jehu spoke as if the princes had died “without his interfering by a higher decree,” to “justify his conspiracy in the eyes of the people” and to prepare them for what he said next, that nothing the LORD had spoken against Ahab's house would fall to the ground ([[2 Kgs. 10:10]]).

      The word he appeals to is real. Elijah had pronounced it at Naboth's vineyard: every male of Ahab's house cut off, and the house made “like the house of Jeroboam the son of Nebat” ([[1 Kgs. 21:21–22]]). The narrator affirms it in his own voice at verse 17, “according to the saying of the LORD, which he spake to Elijah.” How each part of that sentence was kept is gathered in the note on [[1 Kgs. 21:19]].
    sources: [keil-kings, lds-scriptures]

  - ref: 13
    phrase: the children of the queen
    kind: history
    title: Ahaziah’s kinsmen and the queen mother
    body: |
      The princes of Judah were kin to Ahab, and that is why Jehu's sword reached them. Ahaziah's father had married “the daughter of Ahab” ([[2 Kgs. 8:18]]), and his mother was Athaliah, “the daughter of Omri king of Israel” ([[2 Kgs. 8:26]]). Chronicles names the dead as “the princes of Judah, and the sons of the brethren of Ahaziah” ([[2 Chr. 22:8]]), so “brethren” here means kinsmen in the wider sense, nephews among them.

      They were on their way to greet “the children of the king and the children of the queen.” The word for “queen” here, *gᵉbîrâ*, is the title of the queen mother, the king's mother, the same title as in [[1 Kgs. 15:13]], where King Asa removed his mother from that position. The queen mother of Israel was Jezebel, Joram's mother ([[2 Kgs. 9:22]]), already dead at Jezreel ([[2 Kgs. 9:33]]). The travellers came to greet a royal family that Jehu had already destroyed, and they died at the pit by the shearing house, forty-two men.
    sources: [lds-scriptures, bdb]

  - ref: 15
    phrase: Jehonadab the son of Rechab
    kind: history
    title: Jehonadab, father of the Rechabites
    body: |
      Jehonadab is the ancestor whose rule the Rechabites were still keeping in Jeremiah's day: no wine, no houses, no fields, a life in tents ([[Jer. 35:6–7]]; their story is at [[Jer. 35:2]]). How the group began is obscure, and this meeting with Jehu is one of the few hints. From this story and from Jeremiah 35, the family seems to have been known for its devoted loyalty to the LORD.

      Jehu invites such a man to watch what he does next. He asks whether Jehonadab's heart is true to his, takes his hand, lifts him into the chariot and tells him to “come with me, and see my zeal for the LORD” ([[2 Kgs. 10:16]]). Jehonadab rides with him into Samaria and goes with him into the house of Baal (verse 23), a man loyal to the LORD standing witness to the purge. The text does not say what Jehonadab thought of what he saw.
    sources: [thompson-rechabites, lds-scriptures]

  - ref: 19
    phrase: But Jehu did it in subtilty
    kind: history
    title: A sacrifice that was a trap
    body: |
      Jehu's promise to serve Baal “much” was a pretense, and the narrator says so before the trap is sprung, so that the reader knows what the worshippers do not. The temple was the house of Baal that Ahab had built in Samaria ([[1 Kgs. 16:32]]). Jehu proclaims a solemn assembly, threatens death to anyone who stays away, hands out the vestments, has the crowd searched for servants of the LORD, and posts eighty men outside. When the burnt offering is finished, the guards go in.

      Why destroy them by a trick, and why at all? One older reading points to politics. Destroying Baal's worshippers was “in accordance with the law,” but Baal's priests and prophets were bound up with Ahab's dynasty and could be dangerous to the new king, and by destroying them he might hope to draw the LORD's many worshippers to his side. What the text itself says about Jehu's heart comes in verses 29–31 (see the note on [[2 Kgs. 10:30]]).
    sources: [keil-kings, lds-scriptures]

  - ref: 27
    phrase: made it a draught house
    kind: words
    title: A draught house
    body: |
      A “draught house” is a latrine. Jehu's men tore down Baal's temple and turned the site into a latrine, and the narrator adds that it was still one “unto this day.” The word written in the Hebrew text (the *ketiv*, *what is written*) is *maḥărāʾôt*, a cesspool. The Jewish scribes' reading tradition (the *qere*, *what is read*) has the reader say *môṣāʾôt* instead, literally “places of going out,” a euphemism for the same thing. The King James uses the same English word where food “is cast out into the draught” ([[Matt. 15:17]]).
    sources: [bdb, oshb-wlc]

  - ref: 30
    phrase: thy children of the fourth generation shall sit on the throne of Israel
    kind: history
    title: Commended for the deed, faulted for the heart
    body: |
      The LORD's word to Jehu commends what he did to Ahab's house, and the verses around it judge the man. Jehu had done “according to all that was in mine heart” to that house, the sentence laid on it at his anointing ([[2 Kgs. 9:7–9]]). His reward was a dynasty to the fourth generation of his sons (in Hebrew, “sons of the fourth,” descendants four generations on). Kings records it kept: Jehoahaz, Joash, Jeroboam the second and Zachariah ([[2 Kgs. 13:1]]; [[2 Kgs. 13:10]]; [[2 Kgs. 14:23]]; [[2 Kgs. 15:8]]), and of the last, “And so it came to pass” ([[2 Kgs. 15:12]]).

      On either side of the promise stand the calves of Bethel and Dan ([[2 Kgs. 10:29]]; their meaning is at [[1 Kgs. 12:28]]) and the verdict that Jehu “took no heed to walk in the law of the LORD God of Israel with all his heart” ([[2 Kgs. 10:31]]). One Church reading takes that limit as the key: the house of Omri “deserved destruction,” and Jehu was the means of it, “but that does not mean the Lord was pleased with his brutal methods or his wickedness.” Hosea later names his son Jezreel for the blood Jehu shed. How the LORD could commend the deed and still visit that blood on Jehu's house is the subject of the note at [[Hos. 1:4]].
    sources: [lds-scriptures, ot-manual-6, bdb]

  - ref: 32
    phrase: the LORD began to cut Israel short
    kind: history
    title: Israel cut short
    body: |
      *Cut short* here means to cut off: the Hebrew phrase is “to cut off in Israel,” and the next verse names the piece that was taken: everything east of the Jordan, Gilead and Bashan, the land of Gad, Reuben and half of Manasseh, south to Aroer on the Arnon. The verb is an unusual one here, and the standard lexicon suggests the text probably first read a similar word, “to be angry with” Israel; either way, verse 33 says what was lost. The text names the LORD as the one who began it and Hazael of Syria as the means.

      This is the harm Elisha wept to foresee when he told Hazael he would be king ([[2 Kgs. 8:12]]). Assyrian inscriptions supply the setting: Shalmaneser king of Assyria attacked Hazael and defeated him in Damascus, “but a few years later he was again strong enough to attack Israel.” This verse is one of those attacks, and more followed in the next reigns ([[2 Kgs. 12:17]]; [[2 Kgs. 13:3]]).
    sources: [bdb, bd-hazael, lds-scriptures]

christ: |
  The LORD whose word against Ahab's house did not fall to the ground (verse 10) is Jehovah, “the premortal Jesus Christ.” The chapter shows that He can use a man's zeal to carry out His word and still find the man wanting, because Jehu would not walk in His law “with all his heart” ([[2 Kgs. 10:31]]). The measure is the same now: “the Lord requireth the heart and a willing mind” ([[D&C 64:34]]), so zeal in the Lord's cause, however great, does not stand in for a heart turned to Him.

explore: |
  - **The sentence on Ahab's house.** [[1 Kgs. 21:17–29]], Elijah's word at Naboth's vineyard, and [[2 Kgs. 9:1–10]], Jehu's anointing.
  - **The blood of Jezreel.** [[Hos. 1:4–5]], the son named for Jehu's revolt.
  - **Jehonadab's descendants.** [[Jer. 35]], the Rechabites in the temple.
  - **Jehu's dynasty to its end.** [[2 Kgs. 13:1–13]], [[2 Kgs. 14:23–29]] and [[2 Kgs. 15:8–12]].
  - **What Hazael did to Gilead.** [[Amos 1:3–4]], Amos's charge against Damascus and the house of Hazael.
  - **Judah after the purge.** [[2 Kgs. 11]], where Athaliah takes the throne.

sources: [lds-scriptures, bdb, oshb-wlc, ot-manual-6, keil-kings, thompson-rechabites, bd-hazael, bd-jehovah]
