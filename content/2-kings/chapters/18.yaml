chapter: 18
title: He Trusted in the LORD God of Israel
tagline: Hezekiah removes the high places and breaks the brazen serpent, rebels against Assyria, and watches Samaria fall; when Sennacherib takes Judah's cities he pays a ruinous tribute, and the Assyrian army comes to Jerusalem anyway.
when: 'From the third year of Hoshea king of Israel, when Hezekiah began to reign, to Sennacherib''s invasion of Judah in 701 BC'

setting: |
  Chapter 18 opens the last part of the book, the kings of Judah who outlived Israel. Hezekiah inherited a kingdom bound to Assyria: his father Ahaz had asked Assyria for help against Syria and Israel ([[2 Kgs. 16:7–8]]), which made Judah a vassal and, as Isaiah had warned, brought disaster in his son's reign. Hezekiah reigned twenty-nine years, a great reformer in religion and in government, with the prophet Isaiah beside him; Micah also prophesied in his days, and in Jehoiakim's reign the elders of Judah remembered that Hezekiah had heeded him ([[Jer. 26:18–19]]).

  Kings tells his reform in a few verses and gives most of its space to the Assyrian invasion. Chronicles does the reverse, describing at length the cleansing of the temple and the Passover to which Hezekiah invited even the remnant of the northern tribes ([[2 Chr. 30:1]]). From verse 13 to the end of chapter 19, Kings tells the same events as [[Isa. 36]]–37, in very similar words, which this site has already explained. The notes here stay with what Kings has and Isaiah does not: the measure of Hezekiah's reign (verses 1–8), Samaria's fall told again in his years (verses 9–12; the fall itself is explained at [[2 Kgs. 17:6]] and [[2 Kgs. 17:23]]), and the tribute he paid (verses 14–16).

thread: |
  The chapter turns on one word. In verse 5 the writer gives Hezekiah's distinction: “He trusted in the LORD God of Israel.” The Hebrew verb, *bāṭaḥ*, appears there for the first time in 2 Kings, and its next appearances are all in the Rabshakeh's mouth: “What confidence is this wherein thou trustest?” (verse 19), on whom “dost thou trust” (verse 20), Egypt and “all that trust on him” (verse 21), “We trust in the LORD our God” (verse 22), and “Neither let Hezekiah make you trust in the LORD” (verse 30). The enemy's speech is an argument against the very trust verse 5 praised.

  Between the praise and the attack Kings sets something Isaiah leaves out. The king who trusted the LORD and rebelled against Assyria (verse 7) sent word to Sennacherib, “I have offended,” and paid him with the temple's silver and the gold from its doors (verses 14–16). Sennacherib took the money and sent his army against Jerusalem anyway. So the Rabshakeh's challenge to Hezekiah's trust comes after the tribute has failed, and the chapter ends without an answer: the people silent on the wall, Hezekiah's officers coming to him with their clothes torn. His answer is chapter 19, where he takes the words into the house of the LORD.

sections:
  - range: 1-8
    heading: A king like David
    plain: |
      In the third year of Hoshea son of Elah, king of Israel, Hezekiah son of Ahaz became king of Judah. He was twenty-five years old when he began to reign, and he reigned twenty-nine years in Jerusalem. His mother was Abi, daughter of Zechariah. He did what was right in the LORD's sight, just as his ancestor David had done. He removed the high places, broke the images, and cut down the groves. He broke in pieces the bronze serpent Moses had made, for until that time the Israelites had been burning incense to it; he called it Nehushtan. He trusted in the LORD, the God of Israel, so that there was no one like him among all the kings of Judah, either after him or before him. He held fast to the LORD and never turned away from following Him; he kept the commandments the LORD had given Moses. And the LORD was with him: he succeeded in everything he undertook. He rebelled against the king of Assyria and would not serve him. He defeated the Philistines as far as Gaza and its territory, from watchtower to fortified city.
  - range: 9-12
    heading: Samaria falls
    plain: |
      In King Hezekiah's fourth year, the seventh year of Hoshea son of Elah, king of Israel, Shalmaneser king of Assyria marched against Samaria and besieged it. At the end of three years they took it; in Hezekiah's sixth year, Hoshea's ninth, Samaria was captured. The king of Assyria deported Israel to Assyria and settled them in Halah, on the Habor, the river of Gozan, and in the cities of the Medes. This happened because they had not obeyed the voice of the LORD their God, but broke His covenant and all that Moses the servant of the LORD had commanded; they would neither listen nor obey.
  - range: 13-16
    heading: The tribute
    plain: |
      In King Hezekiah's fourteenth year Sennacherib king of Assyria came up against all the fortified cities of Judah and captured them. Hezekiah king of Judah sent this message to the king of Assyria at Lachish: “I have done wrong. Withdraw from me, and I will pay whatever you impose on me.” The king of Assyria demanded of Hezekiah three hundred talents of silver and thirty talents of gold. So Hezekiah gave him all the silver that was found in the house of the LORD and in the treasuries of the palace. At that time Hezekiah stripped the gold from the doors of the LORD's temple and from the doorposts he himself had overlaid, and gave it to the king of Assyria.
  - range: 17-25
    heading: “What confidence is this?”
    plain: |
      The king of Assyria sent the Tartan, the Rabsaris and the Rabshakeh from Lachish to King Hezekiah at Jerusalem with a great army. They came up to Jerusalem and took their stand by the channel of the upper pool, on the road to the fuller's field. When they called for the king, Eliakim son of Hilkiah, who was over the palace, Shebna the scribe, and Joah son of Asaph, the recorder, went out to them. The Rabshakeh said to them: “Tell Hezekiah, This is what the great king, the king of Assyria, says: What is this confidence of yours? You say you have strategy and strength for war, but those are empty words. On whom are you relying, that you rebel against me? You are relying on Egypt, that splintered reed, which pierces the hand of anyone who leans on it; that is what Pharaoh king of Egypt is to all who rely on him. And if you tell me, ‘We trust in the LORD our God,’ isn't He the one whose high places and altars Hezekiah has removed, telling Judah and Jerusalem, ‘You must worship before this altar in Jerusalem’? Come now, make a bargain with my master the king of Assyria: I will give you two thousand horses, if you can put riders on them. How then can you turn back even one officer, the least of my master's servants, and rely on Egypt for chariots and horsemen? Besides, have I come up against this place to destroy it without the LORD? The LORD Himself told me, Go up against this land and destroy it.”
  - range: 26-37
    heading: The speech to the wall
    plain: |
      Then Eliakim son of Hilkiah, Shebna and Joah said to the Rabshakeh, “Please speak to your servants in Aramaic, for we understand it. Don't speak to us in the language of Judah where the people on the wall can hear.” But the Rabshakeh answered, “Did my master send me to speak these words only to your master and to you? Isn't it to the men sitting on the wall, who with you will be reduced by the siege to eating and drinking their own filth?” Then the Rabshakeh stood and called out in a loud voice in the language of Judah: “Hear the word of the great king, the king of Assyria! This is what the king says: Don't let Hezekiah deceive you; he cannot deliver you from my hand. Don't let Hezekiah persuade you to trust in the LORD by saying, ‘The LORD will surely deliver us; this city will not be given into the hand of the king of Assyria.’ Don't listen to Hezekiah. This is what the king of Assyria says: Make peace with me and come out to me. Then each of you will eat from his own vine and his own fig tree and drink water from his own cistern, until I come and take you away to a land like your own, a land of grain and new wine, of bread and vineyards, of olive oil and honey, so that you may live and not die. Don't listen to Hezekiah when he misleads you, saying, ‘The LORD will deliver us.’ Has the god of any nation ever delivered his land from the hand of the king of Assyria? Where are the gods of Hamath and Arpad? Where are the gods of Sepharvaim, Hena and Ivah? Did they deliver Samaria from my hand? Which of all the gods of these countries has delivered his country from my hand, that the LORD should deliver Jerusalem from my hand?” But the people kept silent and answered him not a word, for the king had commanded, “Do not answer him.” Then Eliakim son of Hilkiah, who was over the palace, Shebna the scribe and Joah son of Asaph, the recorder, went to Hezekiah with their clothes torn and told him what the Rabshakeh had said.

notes:
  - ref: 4
    phrase: He removed the high places
    kind: history
    title: The high places removed at last
    body: |
      Hezekiah is the first king of Judah of whom Kings says that he removed the high places. Every earlier king the book praises carries the same reservation: Asa's heart was perfect, “But the high places were not removed” ([[1 Kgs. 15:14]]); so for Jehoshaphat ([[1 Kgs. 22:43]]), Jehoash ([[2 Kgs. 12:3]]), Amaziah, who did right “yet not like David his father” ([[2 Kgs. 14:3–4]]), Azariah ([[2 Kgs. 15:4]]) and Jotham ([[2 Kgs. 15:35]]). Of Hezekiah the verdict has no “but”: he did right “according to all that David his father did” (verse 3). How David became the measure of a king is explained at [[1 Kgs. 3:14]].

      The high places were hilltop altars, some of them altars to Jehovah, which became local centers of worship and then were turned to idolatry. Reformers like Hezekiah and, later, Josiah tried to gather worship into Jerusalem, where it could be kept under control, so that sacrifice was offered nowhere else, as Deuteronomy had directed ([[Deut. 12:11–14]]). Chronicles adds that the people carried the work beyond Judah, into Ephraim and Manasseh, the old north ([[2 Chr. 31:1]]). The reform was real enough for the Assyrian envoy to use it against Hezekiah ([[2 Kgs. 18:22]]; see the note at [[Isa. 36:7]]).
    sources: [lds-scriptures, bd-high-places]

  - ref: 4
    phrase: brake in pieces the brasen serpent that Moses had made
    kind: history
    title: Nehushtan
    body: |
      Hezekiah broke the serpent because Israel had made an idol of it, burning incense to the bronze itself, and he destroyed it with the rest of the idolatry of his father Ahaz's reign. The name *Nehushtan* means “bronze serpent-thing.” How the serpent outlasted the wilderness by centuries, how a sign of the LORD's healing became an idol, and how the bitten Israelites were meant to look through it rather than to it, is explained at [[Num. 21:9]].
    sources: [scripture-helps-2-kings-16-25]

  - ref: 5
    phrase: He trusted in the LORD God of Israel
    kind: scripture
    title: He trusted
    body: |
      Kings sets Hezekiah apart from every king of Judah by his trust, and then says nearly the same of Josiah, that there was no king like him before him or after him ([[2 Kgs. 23:25]]). One older reading answers the apparent conflict: each is incomparable in a different thing, Hezekiah in his confidence in God and Josiah in his faithful keeping of the law of Moses. The verb of verse 5, *bāṭaḥ*, is the one the Rabshakeh turns against Hezekiah through his speech (verses 19–30; the note at [[Isa. 36:4]] follows it).
    sources: [keil-kings, oshb-wlc, lds-scriptures]

  - ref: 7
    phrase: he rebelled against the king of Assyria, and served him not
    kind: history
    title: Why Hezekiah rebelled
    body: |
      Hezekiah's rebellion was the undoing of his father's bargain. The treaty Ahaz had bought with the temple's silver and gold ([[2 Kgs. 16:7–8]]) bound Judah to pay a large tribute every year. Hezekiah kept paying until about 705 BC, when the Assyrian king died; then he refused the tribute, and he struck the Philistines as far as Gaza (verse 8). A few years later the new king, Sennacherib, came west with a great army (verse 13).

      In the text the rebellion stands in the same verse as “the LORD was with him; and he prospered whithersoever he went forth.” What came of it, the tribute of verses 14–16, is the next note.
    sources: [scripture-helps-2-kings-16-25, bd-hezekiah, lds-scriptures]

  - ref: 14
    phrase: I have offended; return from me
    kind: history
    title: What Isaiah leaves out
    body: |
      Verses 14–16 tell what Isaiah and Chronicles both pass over: the king who had rebelled sent word to Sennacherib at Lachish confessing that he had done wrong and offering to pay whatever was asked. Sennacherib's own annals agree that Judah's cities fell and that Hezekiah paid. They give the gold as Kings does, thirty talents, and the silver as eight hundred talents to Kings' three hundred, with gems, ivory, Hezekiah's daughters and his musicians, sent after the king to Nineveh.

      To pay it Hezekiah did what his father had done, giving up “all the silver that was found in the house of the LORD, and in the treasures of the king's house” (compare [[2 Kgs. 16:8]]). Then he went further: he cut the gold off the temple doors and the doorposts “which Hezekiah king of Judah had overlaid.” The gold was his own work: verse 16 says he had overlaid the doorposts himself, and in the first month of his reign he had opened the doors of the house of the LORD and repaired them ([[2 Chr. 29:3]]). Now he undid that work to buy a peace.

      The text does not judge the payment, but it shows that it failed. Sennacherib took the money and sent his army against Jerusalem anyway (verse 17). Hezekiah's “I have offended” has been read two ways: as an admission that he had thrown off Assyria's yoke only because he thought himself strong enough, or as words wrung from him in distress, the rebellion itself not wrong but the attempt to buy back the peace a passing weakness of faith, which Sennacherib's pride and the LORD's faithfulness to His covenant turned to good. What Hezekiah did when the payment failed is chapter 19 ([[2 Kgs. 19:1]]).
    sources: [keil-kings, cambridge-kings, luckenbill-annals, lds-scriptures]

  - ref: 17
    phrase: the king of Assyria sent Tartan and Rabsaris and Rab-shakeh from Lachish
    kind: scripture
    title: The rest is Isaiah 36
    body: |
      From here to the end of the chapter, Kings and [[Isa. 36]] tell the same scene in nearly the same words, and the notes there explain it. Kings is a little fuller. It names three Assyrian officers where Isaiah names only the Rabshakeh, who does the talking ([[Isa. 36:2]], “Lachish and the Rabshakeh”), and its list of fallen cities' gods adds Hena and Ivah (verse 34; [[Isa. 36:19]]).

      For the speech itself, see the notes on Isaiah 36: the meeting place where Ahaz had once refused Isaiah's counsel ([[Isa. 36:2]]), Egypt the broken reed ([[Isa. 36:6]]), the reform turned into a charge ([[Isa. 36:7]]), the half-truth that the LORD sent Assyria ([[Isa. 36:10]]), the plea to speak Aramaic ([[Isa. 36:11]]), the counterfeit promise of vine and fig tree ([[Isa. 36:16]]), and the people's silence ([[Isa. 36:21]]).
    sources: [lds-scriptures]

christ: |
  The bronze serpent Hezekiah broke had been a type of Jesus Christ, and Nephi made the serpent Moses raised a witness that “there is none other name given under heaven save it be this Jesus Christ … whereby man can be saved” ([[2 Ne. 25:20]]). The image was destroyed because Israel had come to burn incense to the bronze itself; the One it pointed to remained. Hezekiah's distinction was trust in the LORD, and the Assyrian's whole speech was an argument against that trust.

  What the Lord gives as a sign of Him is given to lead to Him, as Nephi read the serpent. The reasons offered today for doubting faith in Him are much like the Rabshakeh's, and Hezekiah's reform shows that a life needing reform can begin again in trust in the Lord.

explore: |
  - **The reform in full.** [[2 Chr. 29:1–31:21]]: the temple cleansed, the Passover kept, and the invitation sent to the remnant of Israel.
  - **The rest of the story.** Isaiah 36–37 on this site, and [[2 Kgs. 19:1–37]]: Hezekiah's prayer and the LORD's answer.

