chapter: 16
title: I Am Thy Servant and Thy Son
tagline: Besieged by Syria and Israel, Ahaz of Judah buys the help of Tiglath-pileser with the temple's silver and gold; he comes home from meeting his new master in Damascus with the pattern of a foreign altar, sets the LORD's bronze altar aside, and strips the temple's bronze because of the king of Assyria.
when: 'Sixteen years in Jerusalem, beginning in the seventeenth year of Pekah king of Israel'

setting: |
  Ahaz followed his father Jotham on the throne of Judah when Assyria was the dominant power of the Near East, a nation known for devastating the lands it conquered and deporting their people. Tiglath-pileser III, king of Assyria about 747–727 BC, had begun collecting tribute from Israel and Judah, and in Pekah's reign he carried off the people of Galilee and Naphtali ([[2 Kgs. 15:29]]). Rezin of Damascus tried to unite the kingdoms Assyria had subjected; Pekah of Israel joined him, and Judah would not. In Jotham's last years the LORD “began to send against Judah Rezin the king of Syria, and Pekah the son of Remaliah” ([[2 Kgs. 15:37]]), and under Ahaz the two came up to Jerusalem to put a king of their own on its throne, in what is called the Syro-Ephraimite war, about 734 BC.

  Kings tells Ahaz's sixteen years in twenty verses, and nearly all of them are that war and what Ahaz did to the temple afterward. Two other books cover the same years: [[2 Chr. 28]], with the defeats Judah suffered, and Isaiah, who alone tells of the prophet sent to meet Ahaz in the crisis ([[Isa. 7]] and its notes on the site). Ahaz's son and successor was Hezekiah (verse 20; [[2 Kgs. 18]]).

thread: |
  Verse 7 is the hinge of the chapter: “I am thy servant and thy son.” Isaiah had been sent to tell Ahaz to rely on the LORD for deliverance and not to seek help from Assyria; Ahaz disregarded him and asked the king of Assyria instead, and the chapter follows what that choice cost. He paid for the help with the silver and gold of the house of the LORD (verse 8). He went to Damascus to meet his new master and came home with the pattern of a foreign altar, which took the place of the bronze altar that had stood “before the LORD” (verses 10–16). And he stripped the bronze from the temple's stands and its sea and took away the king's entrances to the temple, and the account's last words give the reason: “for the king of Assyria” (verse 18).

  The help worked in the short run: Damascus fell and Rezin died (verse 9), though Chronicles says the king of Assyria “distressed him, but strengthened him not” ([[2 Chr. 28:20]]). Either way, the chapter measures Ahaz by David (verse 2), and what it remembers of his reign, after the alliance, is his changes to the furnishings and ordinances of the LORD's house.

sections:
  - range: 1-4
    heading: The ways of the kings of Israel
    plain: |
      In the seventeenth year of Pekah son of Remaliah, king of Israel, Ahaz son of Jotham became king of Judah. He was twenty years old when he became king, and he reigned sixteen years in Jerusalem. He did not do what was right in the sight of the LORD his God, as his ancestor David had done. He followed the ways of the kings of Israel instead; he even made his son pass through the fire, after the detestable practices of the nations the LORD had driven out before the Israelites. He offered sacrifices and burned incense at the high places, on the hills, and under every green tree.
  - range: 5-9
    heading: Help bought from Assyria
    plain: |
      Then Rezin king of Syria and Pekah son of Remaliah king of Israel came up to make war on Jerusalem. They besieged Ahaz but could not defeat him. At that time Rezin king of Syria took Elath for Syria and drove the Judeans out of it, and the Syrians came to Elath and have lived there to this day. So Ahaz sent messengers to Tiglath-pileser king of Assyria to say, “I am your servant and your son. Come up and rescue me from the king of Syria and the king of Israel, who are attacking me.” Ahaz took the silver and gold found in the house of the LORD and in the treasuries of the king's palace and sent it to the king of Assyria as a bribe. The king of Assyria agreed: he marched against Damascus, captured it, carried its people away captive to Kir, and put Rezin to death.
  - range: 10-16
    heading: The altar from Damascus
    plain: |
      King Ahaz went to Damascus to meet Tiglath-pileser king of Assyria. He saw the altar there and sent Urijah the priest a drawing of it and its pattern, with every detail of its workmanship. Urijah the priest built the altar following everything King Ahaz had sent from Damascus, and he had it finished by the time King Ahaz came back. When the king returned from Damascus and saw the altar, he went up to it and offered on it: he burned his burnt offering and his grain offering, poured out his drink offering, and sprinkled the blood of his peace offerings on the altar. The bronze altar that stood before the LORD he moved from the front of the temple, from between the new altar and the house of the LORD, and put it on the north side of the new altar. Then King Ahaz commanded Urijah the priest: “On the great altar burn the morning burnt offering and the evening grain offering, the king's burnt offering and his grain offering, and the burnt offering of all the people of the land with their grain offerings and drink offerings. Sprinkle on it all the blood of the burnt offerings and all the blood of the sacrifices. As for the bronze altar, I will consider what to do with it.” Urijah the priest did everything King Ahaz commanded.
  - range: 17-20
    heading: The temple stripped for Assyria
    plain: |
      King Ahaz cut away the panels of the stands and removed the basins from them, and he took the Sea down from the bronze oxen that held it up and set it on a base of stone. Because of the king of Assyria he also removed from the house of the LORD the covered way for the Sabbath that had been built at the temple, and the king's outer entrance. The rest of what Ahaz did is written in the book of the chronicles of the kings of Judah. Ahaz died and was buried with his fathers in the city of David, and Hezekiah his son became king in his place.

notes:
  - ref: 2
    phrase: Twenty years old was Ahaz when he began to reign
    kind: history
    title: A very young father
    body: |
      The ages Kings gives make Ahaz a father at about eleven. He became king at twenty and reigned sixteen years, so he died at about thirty-six; his son Hezekiah was “Twenty and five years old” when he began to reign in his place ([[2 Kgs. 18:2]]), which puts Hezekiah's birth when Ahaz was about eleven. The Greek translation of [[2 Chr. 28:1]] gives a different age: there Ahaz was “five and twenty years old when he began to reign,” which would make him about sixteen when Hezekiah was born.

      The text does not say which figure is right, and this note does not try to settle it; the dates of the reigns are set side by side in [Two Kingdoms and Assyria](/old-testament/guides/two-kingdoms-and-assyria/#rulers).
    sources: [lds-scriptures, lxx-rahlfs]

  - ref: 3
    phrase: made his son to pass through the fire
    kind: history
    title: His son through the fire
    body: |
      The verse alone leaves in doubt whether Ahaz killed his son or only initiated him into the worship of a false god, and Chronicles settles it toward sacrifice. The words “pass through the fire” could by themselves describe a rite of passing through flame, but Chronicles says that Ahaz “burnt his children in the fire” ([[2 Chr. 28:3]]), which supports an actual human sacrifice, and “the commentators generally agree that Ahaz did murder some of his children in this fashion.” It was the worship of Molech, the fire god of the Ammonites, served by passing children through fire or burning them in it; the law forbade it to Israel (see the note at [[Lev. 18:21]]).

      Why a king of Judah would do it the text does not say. One older reading puts the sacrifice “in all probability” in the Syrian oppression of verses 5–6, an offering meant to appease the gods, as the king of Moab offered his eldest son on the wall of his besieged city ([[2 Kgs. 3:27]], with the note there).
    sources: [ot-manual-12, keil-kings, bd-molech, lds-scriptures]

  - ref: 7
    phrase: I am thy servant and thy son
    kind: history
    title: Servant and son of Assyria
    body: |
      Ahaz's message makes him the Assyrian king's subject, and he sent it against a prophet's counsel. Pekah and Rezin had wanted Judah in their alliance against Assyria; when Ahaz refused, they set out to replace him with a king who would join them. Isaiah was sent to tell Ahaz to rely on the LORD for deliverance from the two kings and not to seek help from Assyria, and Ahaz disregarded him. Kings leaves the prophet out of its account; only Isaiah tells of his meeting with the king ([[Isa. 7:3–12]], with the notes there).

      An Assyrian record bears out the submission. A fragmentary list of the tribute Tiglath-pileser received names “Jehoahaz of Judah,” Ahaz's full name, among the kings who paid him, beside the rulers of Ashkelon, Edom and Gaza, in gold, silver and other costly goods.
    sources: [scripture-helps-2-kings-16-25, rsc-combs-ahaz-sign]

  - ref: 8
    phrase: sent it for a present to the king of Assyria
    kind: words
    title: A present, or a bribe
    body: |
      The King James “present” is milder than the Hebrew. The word is *šōḥad*, a present given to gain something, specifically a bribe; its usual use is the bribe that perverts justice, the gift the law forbids a judge to take ([[Ex. 23:8]]; [[Deut. 16:19]]). Ahaz's payment bought the Assyrian king's favor, and it was paid out of the house of the LORD, for the deliverance Isaiah had told him to seek from the LORD Himself.
    sources: [bdb, oshb-wlc, scripture-helps-2-kings-16-25]

  - ref: 10
    phrase: saw an altar that was at Damascus
    kind: history
    title: An altar from Damascus
    body: |
      The altar Ahaz copied in Damascus took the place of the temple's own altar. Ahaz went there to meet his new overlord, saw the altar, and sent its design home. It was probably an altar to a false god that caught his admiration; he had a copy made in Jerusalem and set aside the great altar of the temple to use the new one in its place. Chronicles does not describe the altar, but it says that Ahaz “sacrificed unto the gods of Damascus, which smote him” ([[2 Chr. 28:23]]), and the altar is among the unauthorized changes he made to the furnishings and ordinances of the temple.

      One older reading holds that Ahaz meant it as an altar of Jehovah, not of an idol, and that it was a sin all the same: God had prescribed the form of His sanctuary Himself ([[Ex. 25:40]]), so an altar planned by man on a heathen model was practically the same as an idolatrous one. Urijah the priest built it to order and did all the king commanded (verses 11, 16); he is probably the “Uriah the priest” whom Isaiah took as a witness ([[Isa. 8:2]], with the note there).
    sources: [ot-manual-12, keil-kings, scripture-helps-2-kings-16-25, lds-scriptures]

  - ref: 15
    phrase: the brasen altar shall be for me to inquire by
    kind: words
    title: For me to inquire by
    body: |
      What Ahaz meant by keeping the bronze altar “to inquire by” is not certain. The verb, *baqqēr*, means to seek or look for, and also to consider or reflect, as in [[Prov. 20:25]], where a man thinks again about his vows after he has made them. Here it perhaps means “consider (what shall be done with the old altar),” so that Ahaz would decide its use later; it may instead denote some religious service the king himself was to perform at it. The Greek translation took the word differently: “the brazen altar shall be for me in the morning.”

      On any reading the order is the same. The daily offerings of morning and evening, the king's and the people's, now went to the new “great altar,” and the bronze altar that had stood “before the LORD” (verse 14) was moved to one side to wait on the king's decision.
    sources: [bdb, oshb-wlc, lxx-rahlfs]

  - ref: 18
    phrase: turned he from the house of the LORD for the king of Assyria
    kind: history
    title: For the king of Assyria
    body: |
      The text gives one reason for Ahaz's last changes to the temple: the king of Assyria. Ahaz cut the panels from the ten wheeled stands that carried the lavers, the basins used to wash the animals for sacrifice; he lifted the bronze sea off its twelve oxen and set it on stones (on what became of the oxen, see the note at [[1 Kgs. 7:25]]); and he took away the “covert for the sabbath,” a word found nowhere else, probably a covered way by which the king came to the temple on the Sabbath, along with the king's outer entrance. The words translated “for the king of Assyria” are literally “from the face of” him, an idiom used with fleeing, seeking help and fearing.

      What Ahaz feared is not said. One older reading supposes that Tiglath-pileser was disposed to ask for the fine bronze he saw, and that Ahaz, who could not refuse him, removed it so that the Assyrian would not see it and demand it. Another holds that the reason is not given and a link with Assyria cannot be proved; if there was one, Ahaz acted out of fear, to hide the things, not to send them as a gift.
    sources: [bd-laver, cambridge-kings, keil-kings]

christ: |
  Ahaz's crisis is where the sign of Immanuel was given. When he would not ask a sign, the Lord gave one to the house of David: “Behold, a virgin shall conceive, and bear a son, and shall call his name Immanuel” ([[Isa. 7:14]]), and Matthew reads it as fulfilled in the birth of Jesus, “God with us” ([[Matt. 1:23]]). The sign was given in the same crisis in which Ahaz sent the silver of the LORD's house to buy a foreign king's help (verses 7–8).

  The principle for a disciple is the one Isaiah put to Ahaz: “If ye will not believe, surely ye shall not be established” ([[Isa. 7:9]]). Safety sought from worldly power, as Ahaz sought it, is paid for with what belongs to God, and the Lord who is God with us asks instead for trust in Him.

explore: |
  - **Isaiah meets Ahaz.** [[Isa. 7:1–16]] and [[Isa. 8:1–8]], the prophet's counsel during the war of verses 5–9, the sign given to the house of David, and the “razor that is hired” of [[Isa. 7:20]].
  - **The Chronicler's account.** [[2 Chr. 28]], with Judah's defeats, the gods of Damascus (verse 23), and Ahaz's burial outside the sepulchres of the kings (verse 27).
  - **Damascus's sentence.** [[Amos 1:3–5]], the judgment on Damascus that ends with its people carried captive to Kir, as verse 9 records.
  - **The son who trusted.** [[2 Kgs. 18:1–7]], Hezekiah, who trusted in the LORD and “rebelled against the king of Assyria, and served him not” ([[2 Kgs. 18:7]]).

