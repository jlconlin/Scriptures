chapter: 11
title: The King's Son in the House of the LORD
tagline: Athaliah, Ahab's daughter, kills the royal heirs of Judah and takes the throne; one infant son is hidden in the temple for six years, until Jehoiada the priest crowns him, Athaliah is put to death, and king and people covenant to be the LORD's.
when: 'The seventh year of Athaliah''s reign in Judah, while Jehu reigned in Israel'

setting: |
  Chapters 9 and 10 ended Ahab's house in Israel; this chapter tells what was left of it in Judah. Athaliah was the daughter of Ahab and Jezebel. She had married Jehoram, king of Judah ([[2 Kgs. 8:18]]), and brought the worship of Baal into the southern kingdom as her mother had brought it into the northern. Their son Ahaziah reigned one year; Jehu's men struck him down by Ibleam and he died at Megiddo ([[2 Kgs. 9:27]]), and Jehu went on to kill forty-two of Ahaziah's kinsmen whom he met on the road ([[2 Kgs. 10:13–14]]). Then the king's mother took the throne.

  For six years the kingdom promised to David was ruled by a daughter of Ahab. The LORD had said He would not destroy Judah, for David's sake, but would give him “alway a light” ([[2 Kgs. 8:19]]; see the note there), and in this chapter that promise hangs on a single child. Chronicles tells the story again at more length, with the Levites gathered from the cities of Judah to guard the king ([[2 Chr. 22:10–23:21]]); the accounts differ in what they include, and one older reading takes them as two independent extracts from a fuller record, with differences that are apparent rather than irreconcilable. Chapter 12 tells the reign of the boy who was crowned here.

thread: |
  The chapter is the story of a hidden heir, and it turns on the house of the LORD: the heir is hidden there, crowned there, and brought down from it to the throne. Athaliah's purge leaves David's line one infant deep; a princess who is a priest's wife hides him in the temple, and for six years the true king lives in the LORD's house while Ahab's daughter sits in David's palace.

  In the seventh year the priest brings him out. Jehoiada arms the guard with David's own weapons, sets the crown and the testimony on the boy, and has him anointed, and when Athaliah comes in crying treason she finds the whole land against her. Then the priest does what the coronation was for: he makes a covenant between the LORD, the king and the people, that they should be the LORD's people. The house of Baal is broken down the same day, the king is brought down from the LORD's house to sit on the throne of the kings, and “the city was in quiet.”

sections:
  - range: 1-3
    heading: The seed royal, and the one who was hidden
    plain: |
      When Athaliah, Ahaziah's mother, saw that her son was dead, she set about destroying the whole royal family. But Jehosheba, King Joram's daughter and Ahaziah's sister, took Ahaziah's son Joash and stole him away from among the king's sons who were being killed. She hid him and his nurse in a bedroom, out of Athaliah's reach, so he was not killed. He stayed hidden with her in the house of the LORD for six years, while Athaliah reigned over the land.
  - range: 4-12
    heading: Jehoiada crowns the king's son
    plain: |
      In the seventh year Jehoiada sent for the commanders of hundreds, with the captains and the guard, and brought them to him in the house of the LORD. He made a covenant with them, put them under oath there in the LORD's house, and showed them the king's son. Then he gave them their orders: “This is what you are to do. A third of you who come on duty on the sabbath will guard the king's palace, a third will be at the gate of Sur, and a third at the gate behind the guard; so you will keep watch over the palace, that it not be broken into. And the two companies of you who go off duty on the sabbath will guard the house of the LORD around the king. Surround the king, every man with his weapon in his hand, and anyone who comes inside the ranks is to be killed. Stay with the king wherever he goes.”

      The commanders of hundreds did everything Jehoiada the priest commanded. Each brought his men, both those coming on duty on the sabbath and those going off, and they came to Jehoiada. The priest gave the commanders King David's spears and shields that were kept in the temple of the LORD. The guards took their places, every man with his weapon in his hand, around the king, from the right side of the temple to the left, by the altar and the temple. Then Jehoiada brought out the king's son, put the crown on him and gave him the testimony. They made him king and anointed him, and they clapped their hands and shouted, “Long live the king!”
  - range: 13-16
    heading: “Treason, treason”
    plain: |
      When Athaliah heard the noise of the guard and the people, she came to the people in the temple of the LORD. She looked, and there was the king, standing by the pillar as the custom was, with the officers and the trumpeters beside him, and all the people of the land rejoicing and blowing trumpets. Athaliah tore her clothes and cried, “Treason! Treason!” Jehoiada the priest commanded the commanders of hundreds who were over the troops: “Bring her out beyond the ranks, and kill with the sword anyone who follows her.” For the priest had said, “She must not be killed in the house of the LORD.” So they seized her, and she went by the way the horses enter the king's palace, and there she was killed.
  - range: 17-21
    heading: The covenant, and the king on his throne
    plain: |
      Jehoiada made a covenant between the LORD and the king and the people, that they would be the LORD's people, and a covenant between the king and the people. All the people of the land went to the house of Baal and tore it down; they smashed his altars and his images to pieces and killed Mattan the priest of Baal in front of the altars. The priest appointed officers over the house of the LORD. He took the commanders of hundreds, the captains, the guard and all the people of the land, and they brought the king down from the house of the LORD and went by way of the gate of the guard to the king's palace, and he sat on the throne of the kings. All the people of the land rejoiced, and the city was quiet, now that Athaliah had been killed with the sword at the king's palace. Jehoash was seven years old when he began to reign.

notes:
  - ref: 1
    phrase: she arose and destroyed all the seed royal
    kind: history
    title: Ahab's daughter against David's house
    body: |
      Athaliah destroyed the royal heirs, among them her son Ahaziah's own sons (verse 2), in an effort to secure her hold on the throne.

      The royal family was already thin. Raiders had carried off all of Jehoram's sons but the youngest, Ahaziah ([[2 Chr. 21:17]]; Chronicles calls him Jehoahaz), and Jehu had killed Ahaziah's kinsmen on the road to Samaria ([[2 Kgs. 10:13–14]]). So when the text says she destroyed “all the seed royal,” it means that David's line, which the LORD had promised to keep as a light ([[2 Kgs. 8:19]]), came down to one infant whom she missed (verse 2).
    sources: [bd-athaliah, lds-scriptures]

  - ref: 2
    phrase: Jehosheba, the daughter of king Joram, sister of Ahaziah
    kind: history
    title: The princess who was the priest's wife
    body: |
      The rescuer was a king's daughter, and Chronicles, which names her Jehoshabeath, adds what Kings leaves out: she was “the wife of Jehoiada the priest” ([[2 Chr. 22:11]]). She took the child and his nurse out of the slaughter and hid them in a bedchamber, and the boy was hidden with her in the house of the LORD, where her husband served, for six years (verses 2–3). Joash was seven when he was crowned (verse 21), so he had been an infant when she carried him off.

      The two people who saved David's line were thus a woman of the royal house and a priest, and the priest is the one who brings the boy out in the seventh year (verse 4).
    sources: [lds-scriptures]

  - ref: 5
    phrase: A third part of you that enter in on the sabbath
    kind: history
    title: Why the sabbath
    body: |
      The sabbath was the day the watch changed, and on it Jehoiada had two sets of men under arms at once. The verses speak of men who “enter in” and men who “go forth” on the sabbath (verses 5, 7, 9), and Chronicles says what Jehoiada did with them: “Jehoiada the priest dismissed not the courses” ([[2 Chr. 23:8]]). On one older reading, which follows Chronicles in taking the men as priests and Levites serving by the week, those coming on were divided into three companies to hold the palace and its gates (verses 5–6), and the men who should have gone home were kept back in two companies to guard the boy in the temple (verse 7). A sabbath also brought more people to the temple than an ordinary day, and on the same reading the crowd at the crowning (verse 14) was larger than usual because the sabbath had been chosen.

      The weapons came from the temple itself. “King David's spears and shields” (verse 10) were, on the same reading, arms David had dedicated to the sanctuary.
    sources: [lds-scriptures, keil-kings, cambridge-kings]

  - ref: 12
    phrase: put the crown upon him, and gave him the testimony
    kind: words
    title: The crown and the testimony
    body: |
      The crown made Joash king; the “testimony” is harder, and the reading with the most support is that it was the law he was to reign by. The Hebrew word, *ʿēdût*, is the word for the tables of the covenant laid up in the ark, “the testimony which I shall give thee” ([[Ex. 25:16]], the footnote's cross-reference), and it came to stand for the law of God more broadly. The law of Moses required a king to keep a copy of the law beside him and read it all his days ([[Deut. 17:18–19]]; see the note there), and on that reading Jehoiada handed the boy the book of the law at his crowning as the rule of his reign.

      That reading is not certain. *Crown* (*nēzer*) is clear; what *ʿēdût* means here is “far less certain.” A Latter-day Saint study of coronation in Israel and in Mosiah 1–6 relays the view of earlier scholars that it was a list of laws given to the king, who as keeper of the law would read the book of the covenant to the assembly and make the covenant between the LORD and His people. The standard Hebrew lexicon instead proposes, with others, reading a different word here, and points to the verse where David is brought Saul's crown and “the bracelet that was on his arm” ([[2 Sam. 1:10]]). The law fits what follows: in verse 17 the same priest makes a covenant between the LORD, the king and the people.

      Joash was also anointed, one of the few kings whose anointing the Bible records. The same study holds that the crownings told in most detail, Solomon's and Joash's, are most likely told so fully because both successions were challenged. What the anointing meant is explained at [[1 Kgs. 1:39]].
    sources: [ricks-kingship-coronation, keil-kings, cambridge-kings, bdb, lds-scriptures]

  - ref: 17
    phrase: that they should be the LORD’s people
    kind: scripture
    title: A covenant for king and people
    body: |
      The coronation ends in a double covenant, and the first one makes the whole nation, not only the king, the LORD's. On the Latter-day Saint study of coronation cited at verse 12, a king of Israel held his office under two covenants, one that defined his duties toward God and one toward his people. Verse 17 has both: Jehoiada makes a covenant “between the LORD and the king and the people,” and another “between the king also and the people.”

      The setting is the temple. On the same study, the temple was Israel's place of coronation once it stood (Solomon, made king before it was built, was crowned at Gihon), and Joash stood “by a pillar, as the manner was” (verse 14); the preposition in *ʿal hā-ʿammûd* is more often rendered “on,” so the king may have stood on a platform. Josiah stands at the same place when he reads the book of the covenant and makes a covenant to keep the commandments ([[2 Kgs. 23:3]]), and the study relays the conclusion that the covenants of an Israelite coronation were made there, in the temple, before the LORD.

      The Book of Mormon shows the same pattern carried further. King Benjamin gathered his people at the temple to proclaim his son Mosiah king, and the day ended with the people's covenant and a new name: “because of the covenant which ye have made ye shall be called the children of Christ” ([[Mosiah 5:7]]). One Latter-day Saint scholar sets 2 Kings 11:17 beside that verse and reads Benjamin's covenant as extending to all the people what had once been reserved for kings at their crowning.
    sources: [ricks-kingship-coronation, lds-scriptures]

  - ref: 18
    phrase: all the people of the land went into the house of Baal, and brake it down
    kind: history
    title: Baal's house broken down
    body: |
      The first thing the people do after covenanting to be the LORD's is to tear down Baal's house. There was a house of Baal in Judah because Athaliah had brought Baal worship into Judah as her mother Jezebel had brought it into Israel. Chronicles adds that under her the house of God itself had been plundered: her sons “had broken up the house of God; and also all the dedicated things of the house of the Lord did they bestow upon Baalim” ([[2 Chr. 24:7]]). The boy king will order the breaches of the LORD's house repaired ([[2 Kgs. 12:5]]).

      The house of Baal is broken down not by a king's order but by “all the people of the land” who have just made the covenant, and the priest then appoints officers over the house of the LORD.
    sources: [bd-athaliah, lds-scriptures]

christ: |
  Joash was in the line of David and in the ancestry of Christ, and when he was saved from death the royal line was preserved through this one hidden child. He was crowned and anointed, and the name *Messiah*, which means “anointed,” was used of several of Israel's kings, from that rite ([[1 Kgs. 1:39]] explains it).

  The covenant that made Judah “the LORD's people” has its likeness in the covenant Benjamin's people made when they were called “his sons, and his daughters” ([[Mosiah 5:7]]; see the note on verse 17), where what had once been reserved for kings at their crowning reaches the whole people. Belonging to the Lord is not reserved for a king: everyone who takes Christ's name by covenant is His.

explore: |
  - **The same story in Chronicles.** [[2 Chr. 22:10–23:21]], with the Levites, the names of the captains, and the covenant.
  - **The king's copy of the law.** [[Deut. 17:14–20]], the law a king was to keep beside him, which one reading takes the “testimony” at Joash's crowning to be.
  - **Another coronation at the temple.** [[Mosiah 1–6]], King Benjamin, Mosiah's crowning and the people's covenant; the study [“Kingship, Coronation, and Covenant in Mosiah 1–6”](https://scripturecentral.org/archive/books/book-chapter/kingship-coronation-and-covenant-mosiah-16-0), sets the two side by side.
  - **Josiah at the pillar.** [[2 Kgs. 23:1–3]], the covenant made at the same place.
  - **What became of the boy king.** [[2 Kgs. 12]] and [[2 Chr. 24]].

sources: [lds-scriptures, bd-athaliah, keil-kings, cambridge-kings, bdb, ricks-kingship-coronation, interpreter-cfm-2026-2-kings-2-7]
