chapter: 5
title: Wash, and Be Clean
tagline: A captive Israelite girl sends the leper Naaman, captain of Syria's army, to Elisha; humbled, he washes seven times in the Jordan and is made clean, while Elisha's own servant Gehazi takes the gift the prophet refused and receives Naaman's leprosy.
when: 'In Elisha''s ministry, in the reign of a king of Israel the chapter does not name (probably Jehoram)'

setting: |
  Chapters 2–7 tell Elisha's wonders as a cluster, and Naaman's healing is among the best known of them. The king of Israel is not named; he was probably Jehoram, Ahab's son, and the king of Syria probably Ben-hadad II. Syria is the King James name for Aram, the land of the Arameans, mostly north of Israel; Naaman boasts of the rivers of Damascus in verse 12. The two kingdoms had been at odds for about a century, ever since Syria broke away after Solomon's death, with open wars (those of [[1 Kgs. 20]] and [[1 Kgs. 22]]) and spells of official peace broken by skirmishes. The raid that carried off the little maid (verse 2) belongs to that border warfare, and the king of Israel reads the letter of verse 6 with alarm.

  The chapter has two halves. In the first (verses 1–19) an enemy commander is healed and turns to the God of Israel; in the second (verses 20–27) a man who had served beside the prophet loses his place and takes on the disease Naaman left behind.

thread: |
  The chapter is a study in who listens. It begins with the lowest voice in it, a captive Israelite child, and the foreigners who hear her act on her word: Naaman, his wife, the king of Syria. The king of Israel, who has the prophet in his own land, hears the same request and sees only a trap. At Elisha's door Naaman is tested again, by a messenger and an errand beneath his dignity, and he passes only because he listens to his servants. He goes down into the Jordan a great man and comes up with the flesh of a little child, and he returns to say what the girl had said at the start: the God of Israel is God.

  Then the story turns on the man who should have understood best. Gehazi had seen the prophet's power at work, and he runs after the gift his master refused. The story turns an enemy of Israel into a convert, and a man who might have succeeded Elisha into an outcast. The leprosy taken from Naaman for his faith passes to Gehazi for his greed and deceit.

sections:
  - range: 1-7
    heading: A captive girl and a king's letter
    plain: |
      Naaman, commander of the king of Syria's army, stood high with his master and was held in honor, because through him the LORD had given Syria victory. He was a mighty warrior, but he had leprosy. Syrian raiding bands had carried off a young girl from the land of Israel, and she became a servant to Naaman's wife. She said to her mistress, “If only my master could go to the prophet in Samaria! He would cure him of his leprosy.” Naaman went and told the king what the girl from Israel had said. “Go, then,” the king of Syria said. “I will send a letter to the king of Israel.” So Naaman set out, taking ten talents of silver, six thousand pieces of gold, and ten sets of clothing. The letter he brought to the king of Israel read: “With this letter I am sending you my servant Naaman, so that you may cure him of his leprosy.” When the king of Israel read it, he tore his clothes and said, “Am I God, able to kill and to bring to life, that this man sends me someone to cure of leprosy? See how he is looking for a quarrel with me!”
  - range: 8-14
    heading: Seven times in the Jordan
    plain: |
      When Elisha the man of God heard that the king of Israel had torn his clothes, he sent him word: “Why have you torn your clothes? Let the man come to me, and he will know that there is a prophet in Israel.” So Naaman came with his horses and chariot and stopped at the door of Elisha's house. Elisha sent a messenger out to him: “Go and wash seven times in the Jordan, and your flesh will be restored and you will be clean.” But Naaman was angry and went away. “I thought he would surely come out to me,” he said, “and stand and call on the name of the LORD his God, and wave his hand over the spot and cure the disease. Aren't the Abana and the Pharpar, the rivers of Damascus, better than all the waters of Israel? Couldn't I wash in them and be clean?” And he turned and went off in a rage. His servants came to him and said, “My father, if the prophet had told you to do some great thing, wouldn't you have done it? How much more, then, when he tells you only, ‘Wash and be clean’!” So he went down and dipped himself seven times in the Jordan, as the man of God had said, and his flesh was restored like the flesh of a little child, and he was clean.
  - range: 15-19
    heading: No God but in Israel
    plain: |
      Then Naaman and all his company went back to the man of God. He stood before him and said, “Now I know that there is no God in all the earth except in Israel. Please accept a gift from your servant.” But Elisha said, “As surely as the LORD lives, before whom I stand, I will accept nothing.” Naaman urged him, but he refused. Then Naaman said, “If not, then please let your servant be given as much earth as two mules can carry, for your servant will never again offer burnt offering or sacrifice to any other god, but only to the LORD. In one thing may the LORD pardon your servant: when my master goes into the temple of Rimmon to worship, leaning on my arm, and I bow down there with him, may the LORD pardon your servant for this.” Elisha said to him, “Go in peace.” And Naaman went a short distance on his way.
  - range: 20-27
    heading: Gehazi
    plain: |
      But Gehazi, the servant of Elisha the man of God, said to himself, “My master has let this Syrian Naaman off without taking anything from him. As surely as the LORD lives, I will run after him and get something.” So Gehazi hurried after Naaman. When Naaman saw him running, he got down from his chariot to meet him and asked, “Is everything all right?” “Everything is all right,” Gehazi said. “My master sent me to say, ‘Two young men from the sons of the prophets have just come to me from the hill country of Ephraim. Please give them a talent of silver and two sets of clothing.’” “Please, take two talents,” Naaman said, and he pressed him, tied up two talents of silver in two bags with two sets of clothing, and gave them to two of his servants, who carried them ahead of Gehazi. When he came to the hill, he took the things from them and put them away in the house, and sent the men off. Then he went in and stood before his master. “Where have you been, Gehazi?” Elisha asked. “Your servant didn't go anywhere,” he answered. But Elisha said, “Didn't my heart go with you when the man got down from his chariot to meet you? Is this the time to take money and clothing, and olive groves and vineyards, sheep and cattle, menservants and maidservants? Naaman's leprosy will cling to you and to your descendants forever.” And Gehazi went out from his presence a leper, as white as snow.

notes:
  - ref: 1
    phrase: by him the LORD had given deliverance unto Syria
    kind: history
    title: The LORD gave Syria its victory
    body: |
      The narrator credits Israel's God with an enemy general's success. The Syrians would have told the story differently, but the writer of Kings sees the LORD's hand behind Naaman's victories, and on one older reading the line shows that he did not think of Jehovah as the God of Israel alone, or of the Gentiles as beyond His care: “He helps them though they know Him not.”

      Which war Naaman won is not said. The same older reading thinks it not improbable that it was against the Assyrians, who were invading Syria and its neighbors about this time.
    sources: [cambridge-kings]

  - ref: 1
    phrase: but he was a leper
    kind: history
    title: A great man, but a leper
    body: |
      Verse 1 piles up Naaman's honors and ends on one word that undoes them. He is captain of the host, great with his master, honourable, a mighty man in valour, “but he was a leper.” The biblical term covers a variety of chronic skin diseases; what Naaman had, and how severe it was, is not known, and it was probably not what is now called Hansen's disease (the law's word is explained at [[Lev. 13:2]]). In Israel and most of the ancient world such a disease made a man unclean, so that in Israel's eyes his illness “completely eclipsed his greatness.”

      In Israel the law of Moses would have put such a man outside the camp ([[Lev. 13:46]]). In Syria, as the story tells it, Naaman still commands the army, lives in a household with his wife, and attends his king in the house of Rimmon (verse 18).
    sources: [scripture-helps-2-kings-2, ot-minute-2-kings-5, anderson-naaman-baptism-1994]

  - ref: 3
    phrase: Would God my lord were with the prophet that is in Samaria!
    kind: history
    title: A captive girl's faith
    body: |
      The story is set in motion by a child, and it is rare for the Old Testament to quote a child at all. She was an Israelite girl taken when the Syrians “had gone out by companies,” an idiom for raiding: soldiers swept into an Israelite village, took what was worth taking, and carried off anyone who would make a good slave. “Little maid” means a young girl, likely an adolescent.

      A captive might have been glad of her master's affliction. She wants him healed instead, which suggests that Naaman's household treated her well enough for her to care. Then her word travels upward: Naaman repeats it to the king of Syria, and the king believes it enough to send his general to Israel with a letter and a fortune. Three foreigners act in faith on what a slave girl says. The king of Israel, with the prophet in his own kingdom, will read the same request and see only a plot (verse 7).
    sources: [sc-knowhy-859, ot-minute-2-kings-5]

  - ref: 7
    phrase: Am I God, to kill and to make alive
    kind: history
    title: Only God can kill and make alive
    body: |
      The king of Israel is right that only God can do what the letter asks. “To kill and to make alive” is what the LORD says of Himself, “I kill, and I make alive” ([[Deut. 32:39]]; compare Hannah's song, [[1 Sam. 2:6]]), so his question amounts to asking whether he is almighty like God. What he gets wrong is everything else. He reads the letter as a pretext for a quarrel, though the Syrian king, thinking of prophets as a king's servants, likely meant no more than that the king of Israel should have his wonder-working prophet cure the man. And he looks only to himself. He does not turn to God or to God's servant; he sees himself as the one who would have to act as God, and he does not believe Naaman can be healed.

      Elisha's message to the king answers that unbelief: “let him come now to me, and he shall know that there is a prophet in Israel” (verse 8).
    sources: [keil-kings, sc-knowhy-859]

  - ref: 10
    phrase: Go and wash in Jordan seven times
    kind: symbol
    title: A messenger, a muddy river, and seven times
    body: |
      Naaman's outburst in verses 11–12 shows what he expected, and Elisha's instruction denies him each part of it. He came with horses and chariot to the prophet's door expecting the prophet to meet him, call on his God, and cure him on the spot; “strike his hand over the place” is better rendered “wave his hand” over it. Instead Elisha did not even come outside. A messenger came out with an errand, and the errand was to bathe in the muddy Jordan. Naaman's low opinion of it was justified. The Jordan lies low and is fed by the Sea of Galilee rather than by springs or mountain runoff, while Damascus had its own rivers, the Abana and Pharpar, probably the one river now called the Barada, which divides where it enters the city. What the instruction tested was not the water but Naaman's faith and humility.

      Why seven times the text does not say. One reading sees in it the seven days a suspected leper was shut up before the priest examined him again ([[Lev. 13:4–5]]), a link Naaman, a foreigner, could not have seen. The text's own emphasis is on the obedience: he dipped himself seven times “according to the saying of the man of God” (verse 14).
    sources: [scripture-helps-2-kings-2, sc-knowhy-859, ot-minute-2-kings-5, anderson-naaman-baptism-1994]

  - ref: 13
    phrase: if the prophet had bid thee do some great thing
    kind: prophets
    title: Some great thing
    body: |
      Naaman's servants answer his rage with a simple argument: he would have done something hard, so why refuse something easy? For the second time in the chapter people of low station move the story, first the captive girl who sent him to the prophet and now the servants who send him back. President James E. Faust drew the lesson from their words: “‘Some great thing’ in this instance was extraordinarily simple and easy to do.”

      The difficulty was never the task. Elisha did not ask for some great thing; he asked Naaman to humble himself and do exactly what he was told, and the Lord's commandments are mostly of that kind, “adapted to the capacity of the weak and the weakest of all saints” ([[D&C 89:3]]). Naaman's pride was the only thing in the way.
    sources: [faust-some-great-thing-2001, scripture-helps-2-kings-2, hardy-naaman-gehazi-2002]

  - ref: 14
    phrase: according to the saying of the man of God
    kind: christ
    title: Cleansed on the Lord's terms
    body: |
      Latter-day Saint teachers read Naaman's washing as a figure of baptism, and the reading turns on the words “according to the saying of the man of God.” Had Naaman not followed the directions God gave through Elisha, he would have kept his leprosy; had he washed in a Syrian river, he would not have been healed. In the same way, baptism must be done as God asks, under the hands of one holding His priesthood.

      Naaman was also right that there was nothing special in Israel's water. He was healed by the power of God, not by the river or by being immersed in it, and the power behind baptism is likewise God's. The washing that left him clean is read as the cleansing baptism brings, a burial with Christ and a rising to “newness of life” ([[Rom. 6:4]]). This is a typological reading rather than the narrator's own, but it follows the story closely: a man made unclean goes down into the water at a prophet's word and comes up clean.
    sources: [keller-fall-atonement, anderson-naaman-baptism-1994]

  - ref: 14
    phrase: like unto the flesh of a little child
    kind: words
    title: A little girl and a little boy
    body: |
      The simile ties the end of the healing to the beginning of the story. The captive in verse 2 is a *naʿărâ qᵉṭannâ*, a “little maid,” a young girl; Naaman's new flesh in verse 14 is like that of a *naʿar qāṭōn*, a young boy, the same two words in the masculine. The chapter opens with the lowest status in the ancient Near East, a foreign captive girl, and the mighty commander ends restored to the state of a male child.

      Scripture Central reads the echo as the story's meaning: Naaman has not only been healed but transformed. To be cured the great man had to listen to a captive child, submit to a foreign prophet's instruction, and wash in Israel's river, and his flesh became like a child's when he had humbled himself like one. King Benjamin's words describe the change: a person becomes a saint “and becometh as a child, submissive, meek, humble, patient, full of love” ([[Mosiah 3:19]]).
    sources: [sc-knowhy-859, oshb-wlc]

  - ref: 15
    phrase: now I know that there is no God in all the earth, but in Israel
    kind: scripture
    title: Naaman's confession and Jesus' use of it
    body: |
      Naaman does not go straight home. He goes back up from the Jordan to Elisha, with all his company, to thank him, a journey of some thirty miles back to Samaria, and what he says joins his testimony to the little maid's: the God she trusted is the only God.

      Jesus took Naaman as His example in the synagogue at Nazareth: “many lepers were in Israel in the time of Eliseus the prophet; and none of them was cleansed, saving Naaman the Syrian” ([[Luke 4:27]]). He used the foreign general's faith to rebuke His own people for their unbelief in Him, and they understood Him well enough to try to throw Him from a cliff ([[Luke 4:28–29]]).
    sources: [bd-naaman, hardy-naaman-gehazi-2002, scripture-helps-2-kings-2, lds-scriptures]

  - ref: 16
    phrase: I will receive none
    kind: history
    title: Why Elisha took nothing
    body: |
      Elisha's refusal, sworn by the LORD and repeated when Naaman urges him, keeps clear whose work the healing was. Naaman had brought a fortune for the purpose (verse 5), and to take it would have made the power of God a service for hire; on one older reading Elisha also meant to avoid any appearance of the self-interest that drove the false prophets. The temptation to use that power for gain is an old one: Nephi calls it priestcraft and says the Lord forbids it ([[2 Ne. 26:29–31]]), and Jesus sent His servants out to heal with the charge “freely ye have received, freely give” ([[Matt. 10:8]]). Gehazi, in the second half of the chapter, takes what his master refused.
    sources: [ot-manual-6, keil-kings, lds-scriptures]

  - ref: 17
    phrase: two mules’ burden of earth
    kind: history
    title: Two mules' burden of earth
    body: |
      Naaman wants Israel's soil because he believes the God of Israel can be worshipped only on Israel's ground. Many ancient peoples held that a god could be worshipped properly only in his own land, and the idea of religion rooted in a particular place was strong across the ancient Mediterranean world. So Naaman means to carry a piece of Israel home and build on it an altar to Jehovah, on which, he promises, he will offer to no other god.

      His faith is real and his theology is still that of his homeland. Elisha does not correct it here. The Book of Mormon gives the correction in another setting: the Zoramites thought God could be worshipped only from their holy stand, and Alma taught that God could be worshipped in any place ([[Alma 33:2–11]]).
    sources: [scripture-helps-2-kings-2, shannon-location, bd-naaman]

  - ref: 19
    phrase: Go in peace
    kind: history
    title: Bowing in the house of Rimmon
    body: |
      Naaman's second request is pardon for a duty he cannot escape. Rimmon was the god of the Syrians of Damascus, and Naaman's place at his master's side, the king leaning on his hand, would take him into Rimmon's house; he asks in advance that the LORD pardon him when he bows there with the king. He has not asked leave to worship Rimmon, and he has just promised to sacrifice to no god but the LORD (verse 17).

      Elisha's “Go in peace” evidently accepts the sincerity of Naaman's conversion. He adds nothing more, and sends the new believer home with what he knows.
    sources: [bd-rimmon, scripture-helps-2-kings-2]

  - ref: 26
    phrase: Went not mine heart with thee
    kind: history
    title: Gehazi's sin and its wages
    body: |
      Gehazi's sin is greed that uses the prophet's name. He was no stranger to Elisha's power: he had been with him at the raising of the Shunammite's son and the feeding of the hundred ([[2 Kgs. 4:8–37]], [[2 Kgs. 4:42–44]]). Yet he calls Naaman “this Syrian,” swears by the LORD that he will get something from him (verse 20), and invents a message from his master to get it. Then he lies to Elisha himself.

      Elisha's answer turns Gehazi's own words against him. Gehazi says his servant “went no whither,” in Hebrew *lō' hālak*, “did not go”; Elisha answers *lō' libbî hālak*, “had not my heart gone?” The words are difficult and have been explained in very different ways; the simplest reading is that he was present in spirit when Naaman stepped down from his chariot. And his question, “Is it a time to receive money?”, asks whether this was the moment for a servant of the true God to take payment from a foreigner for what God had done, when so many false prophets were already bringing the prophetic office into contempt by their greed.

      The punishment fits the story. The leprosy taken from Naaman for his faith passes to Gehazi for leaving the true God, and on the older reading it punished not only his greed but his abuse of the prophet's name. He goes out “white as snow,” as Moses' hand and Miriam had been ([[Ex. 4:6]]; [[Num. 12:10]]). Gehazi appears once more, telling the king of Israel of Elisha's great deeds ([[2 Kgs. 8:4–5]]).
    sources: [hardy-naaman-gehazi-2002, keil-kings, oshb-wlc]

christ: |
  Jesus Christ claimed this chapter as His own precedent. At Nazareth He named Naaman as the one leper of Elisha's day who was cleansed ([[Luke 4:27]]), setting a foreigner's faith against His neighbors' unbelief, and the Church sets Naaman's healing beside the ten lepers He cleansed, of whom only a Samaritan returned to give thanks ([[Luke 17:11–19]]). The chapter's lesson is a promise: “As I am humble and obedient, Jesus Christ can heal me.”

  Naaman was made clean when he humbled himself and did what the Lord's servant said, and he came up from the water with the flesh of a little child. For a disciple the cleansing comes the same way: through the ordinances the Lord gives, received as He asks, and through humbling oneself to hear His prophets and good counsel from people one would not think to listen to.

explore: |
  - **Jesus' sermon at Nazareth.** [[Luke 4:16–30]], where Naaman and the widow of Zarephath are His examples.
  - **The law of leprosy.** [[Lev. 13:1–46]] and [[Lev. 14:1–9]], the examination and cleansing of a leper in Israel.
  - **“Some Great Thing.”** President James E. Faust's [conference talk](https://www.churchofjesuschrist.org/study/general-conference/2001/10/some-great-thing?lang=eng) (October 2001) on Naaman and the simple things the Lord asks.

