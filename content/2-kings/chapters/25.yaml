chapter: 25
title: Carried Away out of Their Land
tagline: Babylon breaks into Jerusalem, blinds Zedekiah, burns the house of the LORD and carries Judah away; the governor left over the remnant is murdered and the people flee to Egypt, and the book ends with a king of David's line brought out of prison in Babylon.
when: 'From the ninth to the eleventh year of Zedekiah (verses 1–2), the city burned in the nineteenth year of Nebuchadnezzar (verse 8); the last verses leap to the thirty-seventh year of Jehoiachin''s captivity, the year Evil-merodach began to reign (verse 27)'

setting: |
  Second Kings ends where the history of the two kingdoms has been heading since Samaria fell. In Zedekiah's reign Jerusalem was destroyed and many of its people were taken to Babylon. Zedekiah was Jehoiachin's uncle, whom Nebuchadnezzar had set on the throne when he carried Jehoiachin away ([[2 Kgs. 24:17]]), and his rebellion ([[2 Kgs. 24:20]]) brings the Babylonian army back.

  The chapter is told a second time as [[Jer. 52]], and the Church's footnotes send the reader there verse by verse. The notes on that chapter explain the dates of the siege, the blinding of Zedekiah, Solomon's bronze carried off, and the day of Jehoiachin's release; [[Jer. 39]] tells the fall again, and Jeremiah 40–43 tells at length what verses 22–26 summarize. The notes here take up what Kings itself adds.

  The chapter meets the Book of Mormon twice. Lehi had lived at Jerusalem in Zedekiah's first year and was warned to flee with his family before the city fell ([[1 Ne. 1:4]]). And though verse 7 says the sons of Zedekiah were slain before his eyes, the Book of Mormon tells of one son, Mulek, who survived and was led to the Western Hemisphere ([[Hel. 8:21]]); the note at [[Jer. 52:10]] gives the rest. The history that began with David's death ends with Jehoiachin's last years in Babylon, sometime after about 561 B.C.

thread: |
  Chapter 25 tells the end of Judah without a sermon, because the reason was given before it came. The LORD had said, “I will remove Judah also out of my sight, as I have removed Israel” ([[2 Kgs. 23:27]]), and when the Babylonians first came it was “for the sins of Manasseh” ([[2 Kgs. 24:3]]). Judah had watched Israel fall, and it did not learn from the mistakes of Israel. So this chapter only reports. The LORD had hallowed the house for His name and warned that if Israel turned to other gods He would cast it out of His sight ([[1 Kgs. 9:6–7]], and the note there); now it is burnt (verse 9); the bronze Solomon cast is broken and carried away (verses 13–17); the chief priests and officers die at Riblah. Then comes the line that closed Samaria's story, now spoken of Judah: “So Judah was carried away out of their land” (verse 21; compare [[2 Kgs. 17:23]]).

  Two short scenes follow. A governor is set over the poor left in the land, and he tells the captains of the forces and their men to serve the king of Babylon and live (verse 24); he is murdered, and the people go down to Egypt (verse 26). Then, in Babylon, a king of David's line is brought out of prison and fed at the king's table all the days of his life (verses 27–30). The book says nothing more about him, and that is where it ends.

sections:
  - range: 1-7
    heading: The siege, the breach, and the king's capture
    plain: |
      In the ninth year of Zedekiah's reign, on the tenth day of the tenth month, Nebuchadnezzar king of Babylon came against Jerusalem with his whole army, camped against it, and built siege works all around it. The city was under siege until Zedekiah's eleventh year. By the ninth day of the fourth month the famine in the city was so severe that the people had no bread. Then the wall was breached, and all the soldiers fled by night through the gate between the two walls by the king's garden, while the Chaldeans surrounded the city; the king went toward the plain. The Chaldean army pursued the king and overtook him in the plains of Jericho, and his whole army scattered from him. They took the king up to the king of Babylon at Riblah, where sentence was passed on him. They killed Zedekiah's sons before his eyes, then put out his eyes, bound him in bronze chains, and took him to Babylon.
  - range: 8-17
    heading: The house of the LORD burned
    plain: |
      On the seventh day of the fifth month, in Nebuchadnezzar's nineteenth year, Nebuzar-adan, captain of the guard and an officer of the king of Babylon, came to Jerusalem. He burned the house of the LORD, the king's palace, and all the houses of Jerusalem; every great man's house he burned. The Chaldean army with him tore down the walls all around the city. Nebuzar-adan carried away the rest of the people left in the city, those who had deserted to the king of Babylon, and the rest of the crowd, but he left some of the poorest of the land to tend the vineyards and work the fields. The Chaldeans broke up the bronze pillars of the temple, the stands, and the great bronze basin called the sea, and carried the bronze to Babylon. They took the pots, shovels, snuffers, and spoons, and all the bronze vessels used in the temple service; the captain of the guard took the firepans and bowls of gold and of silver. The bronze of the two pillars, the one sea, and the stands that Solomon had made for the house of the LORD was more than could be weighed. Each pillar was eighteen cubits high, with a bronze top three cubits high, decorated all around with network and pomegranates of bronze, and the second pillar was like it.
  - range: 18-21
    heading: The leaders put to death at Riblah
    plain: |
      The captain of the guard took Seraiah the chief priest, Zephaniah the second priest, and the three doorkeepers. From the city he took an officer who had command of the soldiers, five of the king's personal attendants who were found in the city, the chief scribe of the army who enrolled the people of the land, and sixty men of the people of the land who were found in the city. Nebuzar-adan brought them to the king of Babylon at Riblah, and the king had them struck down and killed at Riblah in the land of Hamath. So Judah was carried away out of its land.
  - range: 22-26
    heading: Gedaliah at Mizpah
    plain: |
      Over the people Nebuchadnezzar had left in the land of Judah he made Gedaliah, son of Ahikam, son of Shaphan, ruler. When the army commanders and their men heard that the king of Babylon had made Gedaliah governor, they came to him at Mizpah: Ishmael son of Nethaniah, Johanan son of Careah, Seraiah son of Tanhumeth the Netophathite, and Jaazaniah son of a Maachathite, with their men. Gedaliah swore to them and their men: “Do not be afraid to serve the Chaldeans. Live in the land and serve the king of Babylon, and it will go well with you.” But in the seventh month Ishmael son of Nethaniah, son of Elishama, of the royal family, came with ten men and struck Gedaliah down, and he died, together with the Jews and the Chaldeans who were with him at Mizpah. Then all the people, small and great, and the army commanders set out and went to Egypt, because they were afraid of the Chaldeans.
  - range: 27-30
    heading: Jehoiachin brought out of prison
    plain: |
      In the thirty-seventh year of the exile of Jehoiachin king of Judah, on the twenty-seventh day of the twelfth month, Evil-merodach king of Babylon, in the year he became king, released Jehoiachin from prison. He spoke kindly to him and gave him a seat above the seats of the other kings who were with him in Babylon. Jehoiachin put off his prison clothes, and for the rest of his life he ate regularly at the king's table. The king gave him a regular allowance, a portion every day, as long as he lived.

notes:
  - ref: 6
    phrase: they gave judgment upon him
    kind: scripture
    title: Judged for a broken oath
    body: |
      Verse 6 does not say what Zedekiah was judged for, but Ezekiel's prophecy against him does: a broken oath. Nebuchadnezzar had made Zedekiah king and bound him by an oath (see the note at [[2 Kgs. 24:17]]), and Ezekiel calls the revolt a covenant broken: Zedekiah “rebelled against him in sending his ambassadors into Egypt… shall he break the covenant, and be delivered?” ([[Ezek. 17:15]]). The same prophecy said where he would end: “in the midst of Babylon he shall die” ([[Ezek. 17:16]]). The note at [[Jer. 52:11]] explains how Zedekiah saw the king of Babylon face to face and yet never saw Babylon.
    sources: [lds-scriptures]

  - ref: 18
    phrase: Seraiah the chief priest
    kind: history
    title: Seraiah the chief priest
    body: |
      The chief priest killed at Riblah was probably the grandson of Hilkiah, the high priest who found the book of the law in Josiah's day ([[2 Kgs. 22:8]]). The Chronicler's line of priests runs “Hilkiah begat Azariah,” and “Azariah begat Seraiah” ([[1 Chr. 6:13–14]]).

      Kings records only his death, but the list goes on past it. Seraiah's son Jehozadak “went into captivity” when Judah was carried away ([[1 Chr. 6:15]]). Generations later the scribe who went up from Babylon to teach the law in Jerusalem gave his descent in the same names, “Ezra the son of Seraiah, the son of Azariah, the son of Hilkiah” ([[Ezra 7:1]]), and so Hilkiah appears to have been Ezra's ancestor. If so, the priestly family whose head died with the city's leaders went into exile with the people, and from it came the man who “had prepared his heart to seek the law of the LORD, and to do it, and to teach in Israel statutes and judgments” ([[Ezra 7:10]]).
    sources: [cambridge-kings, lds-scriptures]

  - ref: 22
    phrase: Gedaliah the son of Ahikam, the son of Shaphan
    kind: history
    title: The remnant at Mizpah
    body: |
      Gedaliah came from the house that served Josiah's reform: “Ahikam the son of Shaphan” and “Shaphan the scribe” were among the men Josiah sent to inquire of the LORD about the book of the law ([[2 Kgs. 22:12]]). Kings gives his short rule five verses, and Jeremiah tells it at length ([[Jer. 40:7–43:7]]). The notes there carry the rest: his family ([[Jer. 40:5]]); Ishmael “of the seed royal” (verse 25; [[Jer. 40:8]]); Gedaliah's counsel in verse 24, which was Jeremiah's ([[Jer. 40:9]]); and the flight to Egypt in verse 26, made against the word the LORD gave the remnant through Jeremiah ([[Jer. 42:19]]; [[Jer. 43:7]]).
    sources: [lds-scriptures]

  - ref: 27
    phrase: did lift up the head of Jehoiachin king of Judah out of prison
    kind: history
    title: The head of Jehoiachin lifted up
    body: |
      To “lift up the head” of a prisoner is to show him favor. The Hebrew words are the ones Joseph used in prison when he told Pharaoh's butler, “within three days shall Pharaoh lift up thine head, and restore thee unto thy place” ([[Gen. 40:13]]), and Pharaoh did it on his birthday ([[Gen. 40:20]]). Here it is an act of a new king: Evil-merodach, Nebuchadnezzar's son, who reigned in Babylon from 561 to 559 B.C. Verses 28–30 spell out what the release meant: kind words, a seat above the other captive kings, prison clothes put off, a place at the king's table, and a daily allowance for the rest of his life.

      Babylon's own records know the captive king. Administrative tablets excavated at Babylon list the food to be given to prisoners, and one of them allots a ration of oil “to Jehoiachin, king of Judah . . . and to the sons of the king.” Jeremiah's copy of these verses gives the twenty-fifth day of the month where Kings has the twenty-seventh, and sets Jehoiachin's release beside Zedekiah's end; both are in the note at [[Jer. 52:31]]. The book does not say why Evil-merodach did it. It leaves Jehoiachin living out his days in relative peace and comfort in Babylon, a son of David alive in exile.

      The theme page [Out of His Sight](/2-kings/themes/out-of-his-sight/) sets this last scene, a son of David eating “continually before” a king, beside Mephibosheth at David's table (2 Sam. 9:7, 13).
    sources: [oshb-wlc, bd-evil-merodach, sc-knowhy-860, ot-seminary-2-kings-intro, lds-scriptures]

christ: |
  The book ends with no son of David reigning in Jerusalem. David's house stopped ruling when Jehoiachin and Zedekiah went into exile: Jehoiachin never reigned again, and neither did his son or his grandson, so Jeremiah's promise of a righteous king from David's line was left for a later son of David to fulfill. The king lifted up out of prison in the last verses is the Jechonias through whom Matthew traces that line to “Jesus, who is called Christ” ([[Matt. 1:12]], [[Matt. 1:16]]; see the note at [[Jer. 52:34]]).

  The scattering in this chapter came of broken covenants (verse 21; [[2 Kgs. 17:23]]), and the gathering comes of kept ones: Israel is gathered as God's children accept the gospel of Jesus Christ, receive His ordinances, and make and keep covenants with God. That gathering is “an essential prelude to the Second Coming of the Lord,” “the most important work in the world,” and it goes on in every life that comes to Christ by covenant.

explore: |
  - **The fall told again.** [[Jer. 39]] and [[Jer. 52]], and the remnant after Gedaliah in [[Jer. 42–43]].
  - **The warning at the temple's dedication.** [[1 Kgs. 9:1–9]], and Jeremiah's sermon at the temple gate, [[Jer. 7:1–15]].
  - **The family led out before the fall.** [[1 Ne. 1:4–20]] and [[1 Ne. 2:1–4]].
  - **Scattered and gathered.** [[1 Ne. 22:3–5]] and [[2 Ne. 6:8–11]].
  - **The way back.** [[Ezra 1:1–11]], where the temple's vessels return, and [[Ezra 7:1–10]], where Seraiah's descendant comes up from Babylon with the law.

