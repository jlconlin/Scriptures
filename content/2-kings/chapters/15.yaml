chapter: 15
title: Unto the Fourth Generation
tagline: In Judah, Azariah reigns fifty-two years, a leper at the end, and his son Jotham after him; in Israel, five kings follow Jeroboam II in quick succession, four of them killed by the next, while Assyria takes its price from Menahem and then carries Galilee and Gilead away captive.
when: 'From the twenty-seventh year of Jeroboam II of Israel, when Azariah began to reign in Judah, to the death of Jotham'

setting: |
  Chapter 15 covers two long reigns in Judah and the troubled years in Israel after Jeroboam II, whose reign closed chapter 14. Azariah of Judah is Uzziah, the name the chapter itself uses in verses 13, 30 and 32 and the name Chronicles and Isaiah use; the two names belong to the same man, and why the text uses both is not clear. These are the years of the prophets: Hosea and Amos prophesied “in the days of Uzziah” and of Jeroboam ([[Hos. 1:1]]; [[Amos 1:1]]), and Isaiah saw the Lord “in the year that king Uzziah died” ([[Isa. 6:1]]).

  Beyond both kingdoms, Assyria was moving west again. Tiglath-pileser III (745–727 B.C.) was the first Assyrian king to make a sustained attempt to bring Syria into the empire. He took tribute from Damascus and Samaria, and after they revolted he took Damascus and emptied Gilead and Naphtali. Both events are in this chapter (verses 19–20 and 29).

  The chapter dates each reign by the other kingdom's king, and not all its figures can be made to agree (see the note on verse 30). The B.C. dates differ by source; the [Two Kingdoms and Assyria](/old-testament/guides/two-kingdoms-and-assyria/#rulers) guide sets them side by side.

thread: |
  The chapter sets the two kingdoms side by side, and the contrast is the point. Judah has two kings in thirty-eight verses, father and son, fifty-two years and sixteen; both did right, and under both the high places stayed. Israel has five kings in the same chapter, and four of them die by conspiracy, each killer taking the dead king's throne. The verdict on each northern king is the same line, that he “departed not from the sins of Jeroboam the son of Nebat.”

  Verse 12 marks where the north's last stable house ends. Jehu had been promised four generations on the throne, and when his great-great-grandson is murdered after six months, the writer stops to say the word was kept: “And so it came to pass.” After that, nothing holds. Menahem buys the Assyrian king's backing with silver, and in Pekah's days the same king returns and carries the north and the east of the land into captivity, the first of the deportations that end in chapter 17. The chapter closes in Judah, with the LORD beginning to send Syria and Israel against it, the war that brings Isaiah to Ahaz in the next chapter.

sections:
  - range: 1-7
    heading: Azariah of Judah, the leper king
    plain: |
      In the twenty-seventh year of Jeroboam king of Israel, Azariah son of Amaziah became king of Judah. He was sixteen when he began to reign, and he reigned fifty-two years in Jerusalem. His mother was Jecholiah, of Jerusalem. He did what was right in the LORD's sight, just as his father Amaziah had done, except that the high places were not removed; the people still sacrificed and burned incense on them. The LORD struck the king, and he was a leper until the day he died, and he lived in a separate house. Jotham the king's son had charge of the palace and governed the people of the land. The rest of Azariah's acts, and all he did, are written in the book of the chronicles of the kings of Judah. Azariah died and was buried with his fathers in the city of David, and his son Jotham became king in his place.
  - range: 8-12
    heading: Zachariah, the last of Jehu's house
    plain: |
      In the thirty-eighth year of Azariah king of Judah, Zachariah son of Jeroboam became king over Israel in Samaria, and he reigned six months. He did what was evil in the LORD's sight, as his fathers had done; he did not turn from the sins of Jeroboam son of Nebat, who made Israel sin. Shallum son of Jabesh conspired against him, struck him down in front of the people, killed him, and reigned in his place. The rest of Zachariah's acts are written in the book of the chronicles of the kings of Israel. This was the word the LORD had spoken to Jehu: “Your sons will sit on the throne of Israel to the fourth generation.” And so it happened.
  - range: 13-16
    heading: Shallum's month, and Menahem's seizure
    plain: |
      Shallum son of Jabesh became king in the thirty-ninth year of Uzziah king of Judah, and he reigned one full month in Samaria. Then Menahem son of Gadi came up from Tirzah to Samaria, struck down Shallum son of Jabesh there, killed him, and reigned in his place. The rest of Shallum's acts, and the conspiracy he made, are written in the book of the chronicles of the kings of Israel. Then Menahem attacked Tiphsah and everyone in it, and its territory from Tirzah, because they would not open their gates to him; he struck it, and he ripped open all its pregnant women.
  - range: 17-22
    heading: Menahem pays Pul
    plain: |
      In the thirty-ninth year of Azariah king of Judah, Menahem son of Gadi became king over Israel, and he reigned ten years in Samaria. He did what was evil in the LORD's sight; all his days he did not turn from the sins of Jeroboam son of Nebat, who made Israel sin. Pul king of Assyria came against the land, and Menahem gave Pul a thousand talents of silver, so that Pul would support him and secure the kingdom in his hand. Menahem raised the money from Israel, from all the men of wealth, fifty shekels of silver from each man, to give to the king of Assyria. So the king of Assyria turned back and did not stay in the land. The rest of Menahem's acts, and all he did, are written in the book of the chronicles of the kings of Israel. Menahem died, and his son Pekahiah became king in his place.
  - range: 23-26
    heading: Pekahiah
    plain: |
      In the fiftieth year of Azariah king of Judah, Pekahiah son of Menahem became king over Israel in Samaria, and he reigned two years. He did what was evil in the LORD's sight; he did not turn from the sins of Jeroboam son of Nebat, who made Israel sin. Pekah son of Remaliah, one of his officers, conspired against him and struck him down in Samaria, in the palace of the king's house, with Argob and Arieh and fifty men of Gilead. He killed him and reigned in his place. The rest of Pekahiah's acts, and all he did, are written in the book of the chronicles of the kings of Israel.
  - range: 27-31
    heading: Pekah, and the first captivity
    plain: |
      In the fifty-second year of Azariah king of Judah, Pekah son of Remaliah became king over Israel in Samaria, and he reigned twenty years. He did what was evil in the LORD's sight; he did not turn from the sins of Jeroboam son of Nebat, who made Israel sin. In the days of Pekah king of Israel, Tiglath-pileser king of Assyria came and took Ijon, Abel-beth-maachah, Janoah, Kedesh and Hazor, and Gilead and Galilee, all the land of Naphtali, and carried the people captive to Assyria. Then Hoshea son of Elah conspired against Pekah son of Remaliah, struck him down, killed him, and reigned in his place, in the twentieth year of Jotham son of Uzziah. The rest of Pekah's acts, and all he did, are written in the book of the chronicles of the kings of Israel.
  - range: 32-38
    heading: Jotham of Judah
    plain: |
      In the second year of Pekah son of Remaliah king of Israel, Jotham son of Uzziah became king of Judah. He was twenty-five when he began to reign, and he reigned sixteen years in Jerusalem. His mother was Jerusha, daughter of Zadok. He did what was right in the LORD's sight, just as his father Uzziah had done. But the high places were not removed; the people still sacrificed and burned incense on them. He built the upper gate of the LORD's house. The rest of Jotham's acts, and all he did, are written in the book of the chronicles of the kings of Judah. In those days the LORD began to send Rezin king of Syria and Pekah son of Remaliah against Judah. Jotham died and was buried with his fathers in the city of David his father, and his son Ahaz became king in his place.

notes:
  - ref: 5
    phrase: the LORD smote the king, so that he was a leper unto the day of his death
    kind: history
    title: Why the LORD smote the king
    body: |
      Kings says only that the LORD struck Azariah with leprosy; Chronicles gives the reason, and it is a trespass on the priesthood. Grown strong and proud, Uzziah went into the temple to burn incense on the altar of incense. Azariah the priest and eighty others went in after him and told him, “It appertaineth not unto thee, Uzziah, to burn incense unto the Lord, but to the priests the sons of Aaron, that are consecrated to burn incense.” He grew angry with them, censer in hand, and the leprosy rose up in his forehead there by the altar; he was a leper, shut out of the temple, for the rest of his life ([[2 Chr. 26:16–21]]).

      The Church's standard reading of the episode is about authority. Latter-day Saints have often used the Chronicles account to teach that acting in the ordinances requires divine authority: a king who had done well and prospered grew proud and took for himself what belonged to the priests. The fifth article of faith states the principle: “a man must be called of God, by prophecy, and by the laying on of hands by those who are in authority” ([[A of F 1:5]]). Isaiah's vision came in the year this king died, and the note at [[Isa. 6:1]] sets the proud king shut out of the temple beside the King whom Isaiah saw enthroned in it.
    sources: [lds-scriptures, ot-manual-12]

  - ref: 10
    phrase: Shallum the son of Jabesh conspired against him
    kind: history
    title: Why Israel's throne would not hold
    body: |
      Four of this chapter's five kings of Israel die by conspiracy, while Judah's two kings pass the throne from father to son. Zachariah is killed by Shallum (verse 10), Shallum by Menahem (verse 14), Pekahiah by Pekah, one of his own officers (verse 25), and Pekah by Hoshea (verse 30). Menahem alone is not said to have been killed: he “slept with his fathers” (verse 22), and he began his reign by sacking a town that would not open its gates to him (verse 16; see the note at [[Hos. 10:14]]).

      One proposal looks for the reason in how each throne began. David's house rested on an unconditional promise, and no prophet in Judah threatened that his dynasty would fail. Jeroboam's kingdom was promised through Ahijah with a condition attached ([[1 Kgs. 11:38]]). On this reading the unconditional promise helped give Judah a stable government that the north did not have: of the north's nineteen kings, eight were murdered in military coups and only seven died of natural causes. Hosea, who prophesied in these years, gave the LORD's verdict: “They have set up kings, but not by me” ([[Hos. 8:4]]); the notes at [[Hos. 7:7]] and [[Hos. 8:4]] follow the murders king by king.
    sources: [halverson-fall-of-israel, lds-scriptures]

  - ref: 12
    phrase: This was the word of the LORD which he spake unto Jehu
    kind: scripture
    title: Jehu's fourth generation
    body: |
      Verse 12 says that the LORD's promise to Jehu has run its course. The LORD had told Jehu, “thy children of the fourth generation shall sit on the throne of Israel” ([[2 Kgs. 10:30]]), and the chapters since have counted them: Jehoahaz ([[2 Kgs. 10:35]]), Joash ([[2 Kgs. 13:9]]), Jeroboam ([[2 Kgs. 14:16]]) and now Zachariah ([[2 Kgs. 14:29]]). Zachariah reigns six months and is murdered, and the writer pauses over his death to say the word was kept to the letter: “And so it came to pass.”

      The promise was both a reward and a limit, and the prophets had already announced the end of the house: Amos against “the house of Jeroboam” and Hosea against “the house of Jehu,” to whom the Church's footnotes on verses 10 and 12 point ([[Amos 7:9]]; [[Hos. 1:4]]). How the house the LORD commended could also be the house He judged is explained at [[2 Kgs. 10:30]] and in the note at [[Hos. 1:4]].
    sources: [lds-scriptures]

  - ref: 19
    phrase: Pul the king of Assyria came against the land
    kind: history
    title: Pul, who is Tiglath-pileser, and the price of a throne
    body: |
      Pul and the Tiglath-pileser of verse 29 are one king under two names. Pulu was an Assyrian general who took the throne in a coup and reigned as Tiglath-pileser III, a throne name meaning “my trust is in the son of the Ešarra,” the Ešarra being a temple; ancient Near Eastern kings commonly took throne names. An older commentary still took Pul for a separate king, whose name had “not yet been discovered upon the Assyrian monuments.” Assyria's records now bear the verse out: the annals of Tiglath-pileser III and Sennacherib record tribute paid by Israelite kings, Menahem among them, and the tribute from Samaria is dated to 738 B.C.

      The verse also says what Menahem was buying: Pul's hand was to be with him “to confirm the kingdom in his hand.” Menahem had taken the throne by murder (verse 14), and he paid Assyria to keep it. The thousand talents came from a levy of fifty shekels on “all the mighty men of wealth” (verse 20), which in this sense means men of property, not warriors. Fifty shekels was a sixtieth of a talent, so some sixty thousand men paid, a figure that shows how rich the land was. Hosea and Isaiah condemned such alliances with Assyria, and Hosea's “Ephraim hath hired lovers” ([[Hos. 8:9]]) is read in the note there as tribute of this kind. In the next chapter Judah's king seeks Assyria's help too ([[2 Kgs. 16:7]]).
    sources: [pierce-israelite-refugees, sc-knowhy-536, bd-assyria, keil-kings, cambridge-kings, lds-scriptures]

  - ref: 29
    phrase: carried them captive to Assyria
    kind: history
    title: The first captivity
    body: |
      This verse records the first deportation of Israel to Assyria, years before the fall of Samaria. The list runs from the towns of Naphtali and Galilee to Gilead, and Chronicles names those taken from beyond the Jordan: “the Reubenites, and the Gadites, and the half tribe of Manasseh,” brought “unto Halah, and Habor, and Hara, and to the river Gozan” ([[1 Chr. 5:26]]). Tiglath-pileser carried off the tribes beyond the Jordan and the people of Galilee, and Sargon II later took the rest of Israel ([[2 Kgs. 17:6]]). The year is given differently, from 740 B.C. to 732.

      Isaiah speaks of the same lands when he says the LORD “at the first … lightly afflicted the land of Zebulun and the land of Naphtali, and afterward did more grievously afflict her” ([[Isa. 9:1]]): the Assyrians had already overcome the north, Galilee included, and plunged it into darkness. The promise that follows, that the people who walked in darkness would see a great light, is explained in the note at [[Isa. 9:1]].
    sources: [lds-scriptures, bd-captivities, pierce-israelite-refugees, sc-knowhy-869]

  - ref: 30
    phrase: in the twentieth year of Jotham the son of Uzziah
    kind: history
    title: Jotham's twentieth year
    body: |
      The date in this verse cannot be fitted to the chapter's own figures as they stand. Verse 33 gives Jotham sixteen years, and the next chapter has his son Ahaz begin to reign in Pekah's seventeenth year ([[2 Kgs. 16:1]]), so a “twentieth year of Jotham” falls after Jotham's reign had ended. On one older reading there must be some mistake in the numbers either here or in verse 33, and such variations make the chronology very hard to fix until it can be checked against the Assyrian and Egyptian records. This site does not try to reconcile the figures; the dates its sources give are set side by side in the [Two Kingdoms and Assyria](/old-testament/guides/two-kingdoms-and-assyria/#rulers) guide.
    sources: [cambridge-kings, lds-scriptures]

  - ref: 37
    phrase: In those days the LORD began to send against Judah Rezin the king of Syria, and Pekah the son of Remaliah
    kind: history
    title: The war that brings Isaiah to Ahaz
    body: |
      The last note of Jotham's reign opens the next chapter's war, and Kings says the LORD sent it. Jotham did right, but the high places stayed (verse 35), and Chronicles adds of his reign that “the people did yet corruptly” ([[2 Chr. 27:2]]). The attack falls on his son: Rezin and Pekah “came up to Jerusalem to war: and they besieged Ahaz, but could not overcome him” ([[2 Kgs. 16:5]]). This is the war of Isaiah 7, whose coalition and its aims are explained at [[Isa. 7:1]].

      Both kingdoms of the alliance, Damascus and Samaria, later revolted against Tiglath-pileser, and the war that followed destroyed Damascus, emptied Gilead and Naphtali, the captivity of verse 29, and ended with Judah accepting Assyria's overlordship.
    sources: [lds-scriptures, bd-assyria]

christ: |
  The first land carried captive in this chapter (verse 29) is the land where Jesus made His home. Isaiah promised that the region the LORD “lightly afflicted” at the first, Zebulun and Naphtali, would see a great light ([[Isa. 9:1–2]]), and Matthew says that Jesus “came and dwelt in Capernaum, which is upon the sea coast, in the borders of Zabulon and Nephthalim” so that the prophecy might be fulfilled ([[Matt. 4:13–16]]). After His hearers objected that “out of Galilee ariseth no prophet,” His words “I am the light of the world: he that followeth me shall not walk in darkness, but shall have the light of life” use the language of Isaiah 9, and can be read as His claim to be the light promised to Galilee ([[John 7:52]]; [[John 8:12]]). Matthew and John find Isaiah's promise to a land in captivity's shadow fulfilled in Him, and so no darkness a disciple passes through is beyond the reach of His light.

explore: |
  - **Uzziah's whole reign, and Jotham's.** [[2 Chr. 26]]–27, with the wars, the building and the trespass that Kings leaves out.
  - **The prophets of these years.** [[Hos. 7]]–8 on the kings set up “not by me,” [[Amos 7:7–17]] on the house of Jeroboam, and [[Isa. 6]], dated by Uzziah's death.
  - **What came of Assyria.** [[2 Kgs. 16]], where Ahaz sends to Tiglath-pileser for help, and [[2 Kgs. 17]], the fall of Samaria.

