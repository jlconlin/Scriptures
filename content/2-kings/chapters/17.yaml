chapter: 17
title: They Feared the LORD, and Served Their Own Gods
tagline: Hoshea, Israel's last king, withholds his tribute and looks to Egypt; Assyria takes Samaria after three years and carries Israel away, and the writer stops to say why; foreigners settled in the empty land learn to fear the LORD and go on serving their own gods.
when: 'The ninth year of Hoshea king of Israel, who began to reign in the twelfth year of Ahaz king of Judah'

setting: |
  Chapter 17 is the end of the northern kingdom. Its last king, Hoshea, reigned nine years in Samaria, and What made him “not as the kings of Israel that were before him” (verse 2) is not recorded. The kingdom he ruled was already cut down. In 734 B.C. Assyria under Tiglath-pileser III had destroyed Damascus and emptied Gilead and Naphtali of their people ([[2 Kgs. 15:29]]), and Judah under Ahaz had accepted Assyria's overlordship. Shalmaneser V (727–722 B.C.) put Hoshea under tribute and laid siege to Samaria; the city fell after three years, in 721 B.C. or perhaps 722. Hosea and Micah had foretold it ([[Hos. 13:16]]; [[Micah 1:6]]). Chronicles does not tell this chapter at all.

  The chapter has three parts: the fall itself, told in six verses (1–6); the writer's explanation of why it happened (7–23); and what became of the land afterward, settled by peoples Assyria brought in, who added the LORD to their own gods (24–41). The kings and dates of these years are set side by side in [Two Kingdoms and Assyria](/old-testament/guides/two-kingdoms-and-assyria/#rulers).

thread: |
  The fall of Samaria takes six verses. The reasons for it take seventeen. Kings has told the northern kingdom's story king by king, and here the narrator stops telling and explains, in the language of the covenant. The LORD brought Israel out of Egypt; Israel feared other gods and walked in the customs of the nations; the LORD sent prophets and seers to say “Turn ye,” and Israel would not hear. The blame comes to rest on the kings, and above all on Jeroboam, whose sins Israel “departed not from” (verses 21–22). The judgment is the one the prophets had spoken (verse 23).

  Then the emptied land fills with other peoples, and the same thing happens again on a smaller stage. One Hebrew verb, “fear,” runs through the chapter from verse 7 to verse 41. Israel “feared other gods” (verse 7); the newcomers at first “feared not the LORD” (verse 25), then were taught how they “should fear the LORD” (verse 28), and ended by fearing the LORD and serving their own gods together (verses 32–33). The covenant recited in verses 35–39 allows only one fear. The chapter ends not with Israel but with its successors, still doing “as did their fathers.”

sections:
  - range: 1-6
    heading: The fall of Samaria
    plain: |
      In the twelfth year of Ahaz king of Judah, Hoshea son of Elah became king of Israel in Samaria, and he reigned nine years. He did what was evil in the LORD's sight, though not as the kings of Israel before him had done. Shalmaneser king of Assyria marched against him, and Hoshea became his vassal and paid him tribute. But the king of Assyria discovered that Hoshea was plotting against him: he had sent envoys to So king of Egypt and had stopped paying the tribute he had sent to Assyria year by year. So the king of Assyria seized him and put him in prison. Then the king of Assyria invaded the whole land, came up to Samaria, and besieged it for three years. In the ninth year of Hoshea the king of Assyria captured Samaria and deported Israel to Assyria. He settled them in Halah, on the Habor, the river of Gozan, and in the cities of the Medes.
  - range: 7-23
    heading: Why Israel was carried away
    plain: |
      This happened because the people of Israel had sinned against the LORD their God, who had brought them up out of Egypt from under the power of Pharaoh. They worshiped other gods and followed the customs of the nations the LORD had driven out before them, and the customs the kings of Israel had introduced. They did in secret things that were not right against the LORD their God. They built shrines on high places in all their towns, from the lonely watchtower to the walled city. They set up sacred pillars and Asherah poles on every high hill and under every green tree, and burned incense on all the high places as the nations had done whom the LORD had removed before them. They did wicked things that provoked the LORD to anger, and they served idols, though the LORD had told them, “You shall not do this.”

      Yet the LORD warned Israel and Judah through every prophet and every seer: “Turn from your evil ways. Keep my commandments and my statutes, all the law I commanded your fathers and sent you by my servants the prophets.” But they would not listen. They were as stiff-necked as their fathers, who had not trusted the LORD their God. They rejected His statutes, the covenant He had made with their fathers, and the warnings He had given them. They went after worthless things and became worthless themselves, and they imitated the nations around them, though the LORD had commanded them not to do as those nations did. They abandoned all the commandments of the LORD their God and made themselves two calves of cast metal, and an Asherah pole; they bowed down to all the host of heaven and served Baal. They made their sons and daughters pass through the fire, practiced divination and omens, and sold themselves to do evil in the LORD's sight, provoking Him to anger.

      So the LORD was very angry with Israel and removed them from His presence. Only the tribe of Judah was left. Yet Judah did not keep the commandments of the LORD their God either; they followed the customs Israel had introduced. The LORD rejected all the descendants of Israel. He afflicted them and handed them over to plunderers until He had thrust them from His presence. When He tore Israel away from the house of David, they made Jeroboam son of Nebat king, and Jeroboam drove Israel away from following the LORD and led them into great sin. The people of Israel persisted in all the sins Jeroboam committed and did not turn from them, until the LORD removed Israel from His presence, as He had warned through all His servants the prophets. So Israel was taken from their own land into exile in Assyria, and they are there to this day.
  - range: 24-33
    heading: New people in Samaria
    plain: |
      The king of Assyria brought people from Babylon, Cuthah, Avva, Hamath and Sepharvaim and settled them in the towns of Samaria in place of the Israelites. They took possession of Samaria and lived in its towns. When they first settled there they did not worship the LORD, so the LORD sent lions among them, and the lions killed some of them. It was reported to the king of Assyria: “The peoples you deported and settled in the towns of Samaria do not know what the god of that land requires. He has sent lions among them, and they are killing them, because the people do not know what he requires.” Then the king of Assyria gave this order: “Send back one of the priests you took captive from there. Let him go and live there and teach the people what the god of the land requires.” So one of the priests who had been deported from Samaria came and lived in Bethel and taught them how to worship the LORD.

      Nevertheless each national group made its own gods in the towns where they settled and set them up in the shrines the people of Samaria had built on the high places. The people from Babylon made Succoth-benoth, those from Cuthah made Nergal, and those from Hamath made Ashima; the Avvites made Nibhaz and Tartak, and the Sepharvites burned their children in the fire as sacrifices to Adrammelech and Anammelech, the gods of Sepharvaim. They worshiped the LORD, but they also appointed all sorts of their own people to serve as priests in the shrines on the high places. They worshiped the LORD, and they also served their own gods according to the customs of the nations from which they had been brought.
  - range: 34-41
    heading: Unto this day
    plain: |
      To this day they keep to their former practices. They do not truly worship the LORD, nor do they follow the statutes and ordinances, the law and the commandment, that the LORD gave the descendants of Jacob, whom He named Israel. The LORD made a covenant with them and commanded them: “Do not worship other gods or bow down to them, serve them or sacrifice to them. Worship the LORD, who brought you up out of Egypt with great power and an outstretched arm; bow down to Him and offer sacrifices to Him. Be careful always to keep the statutes and ordinances, the law and the commandment, that He wrote for you, and do not worship other gods. Do not forget the covenant I have made with you, and do not worship other gods. Worship the LORD your God, and He will deliver you from the hand of all your enemies.” But they would not listen; they kept to their former practices. Even while these nations were worshiping the LORD, they were serving their idols. To this day their children and their children's children go on doing as their fathers did.

notes:
  - ref: 4
    phrase: he had sent messengers to So king of Egypt
    kind: history
    title: Tribute withheld, and an appeal to Egypt
    body: |
      In Assyria's eyes Hoshea's “conspiracy” was a vassal's revolt. In the ancient Near East, when a great empire conquered a smaller state, the defeated king became the vassal of the “great king,” bound to him by allegiance and usually by tribute, and verse 3 is a case of it: Hoshea “became his servant” and paid what he owed “year by year” (verse 4). Under that kind of rule, even a vassal's simple failure to pay the yearly tribute was regarded as a direct challenge to the overlord; it was so with Israel's own vassals under David and Solomon.

      Hoshea stopped paying and sent to Egypt for help. So is identified as an Ethiopian also called Sebech, who had made himself lord of all Egypt and was stirring up a revolt in which Syria, Philistia and Samaria were all involved. Egypt sent nothing that the text records. The king of Assyria seized Hoshea first and then came for his city (verses 4–5).
    sources: [sc-knowhy-128, bd-assyria]

  - ref: 6
    phrase: carried Israel away into Assyria
    kind: history
    title: Who took Samaria, and where Israel went
    body: |
      Verse 6 says only “the king of Assyria.” Shalmaneser, named in verse 3, began the siege; it was concluded by his successor Sargon II, whose reign began in 722 B.C., and Sargon is the king named as carrying the ten tribes into captivity. When Kings tells the siege again, it likewise names Shalmaneser as the one who came up against Samaria and then says only, “at the end of three years they took it” ([[2 Kgs. 18:9–10]]).

      This was the second deportation. Tiglath-pileser had already carried off the tribes east of the Jordan and the people of Galilee ([[2 Kgs. 15:29]]); now the rest of Israel went. Assyria's own inscriptions, with their counts of deportees, shed light on the biblical references to Israelites carried away to places in what is now Iraq and Iran. What became of them is the question of verse 23.
    sources: [bd-assyria, ot-seminary-2-kings-intro, bd-captivities, chadwick-review-ten-tribes]

  - ref: 7
    phrase: For so it was, that the children of Israel had sinned
    kind: history
    title: Why Israel fell, in the writer's words
    body: |
      With verse 7 the history becomes a sermon. Verses 7–23 are the narrator's own explanation of the fall, a passage that has shaped how generations of readers have understood why Israel collapsed. Two charges run through them: Israel worshiped other gods, and Israel walked in the customs of the nations. Assyria's armies are hardly mentioned. What exposed Israel to them, on this account, was its own unfaithfulness, by which it lost the Lord's protection.

      The charge begins with the Exodus. The God Israel left was the one who had “brought them up out of the land of Egypt” (verse 7), the same words the covenant uses again in verse 36. The list that follows gathers the north's whole history of false worship: the high places, the pillars and groves (see [[1 Kgs. 14:15]]), the two calves of Bethel and Dan ([[1 Kgs. 12:28]]), the host of heaven, Baal, and children passed through the fire ([[Lev. 18:21]]). Twice the writer says these were things they or their kings “made” (verses 8, 16).
    sources: [halverson-fall-of-israel, scripture-helps-2-kings-16-25]

  - ref: 9
    phrase: from the tower of the watchmen to the fenced city
    kind: words
    title: From the tower of the watchmen to the fenced city
    body: |
      The phrase means everywhere. Watchtowers were built to guard flocks, crops and vineyards, and they stood in the loneliest places in the land; fenced (walled) cities were where people crowded together. From one to the other is from the emptiest country to the busiest town, and so the verse says that the whole northern kingdom had turned to idols. Kings uses the same phrase of Hezekiah's war on the Philistines ([[2 Kgs. 18:8]]).

      The verb translated “did secretly” occurs nowhere else in the Bible. The King James' sense comes from a related verb meaning to cover. The Septuagint and some later readers take it instead as “they decked out” their worship, overlaying it with things foreign to the law, which the rest of the verse then lists. Either way the charge is the same.
    sources: [ot-manual-12, cambridge-kings]

  - ref: 13
    phrase: by all the prophets, and by all the seers
    kind: scripture
    title: Prophets and seers
    body: |
      The center of the writer's case is that Israel was warned. The LORD “testified” by every messenger He had, and Kings has shown many of them in the north: Ahijah ([[1 Kgs. 14:15]]), Elijah and Elisha, Micaiah ([[1 Kgs. 22:8]]), Jonah ([[2 Kgs. 14:25]]). Their message is summed up in two words, “Turn ye.”

      The verse names two kinds of messenger. In the Book of Mormon the difference is spelled out: a prophet is a spokesperson for God, while a seer uses means God has prepared to make known what is hidden, and so “a seer is greater than a prophet” ([[Mosiah 8:15]]). This verse is one of several that show seers had a place in Israel's life. Israel's fault was not that the LORD was silent, but that “they would not hear” (verse 14).
    sources: [sc-knowhy-86]

  - ref: 15
    phrase: they followed vanity, and became vain
    kind: words
    title: Followed vanity, and became vain
    body: |
      The words are a play on one Hebrew root. “Vanity” is *hebel*, literally a vapor or breath, and so anything insubstantial and worthless, idols among them. “Became vain” is the verb made from it. Israel went after emptiness and became empty. Jeremiah charged Judah in the same words ([[Jer. 2:5]], where the note explains the root).
    sources: [bdb]

  - ref: 18
    phrase: there was none left but the tribe of Judah only
    kind: history
    title: None left but the tribe of Judah
    body: |
      “The tribe of Judah” here means the kingdom of Judah. That kingdom included Benjamin, Levi, and Israelites from other tribes who had left the north and joined it; the ten tribes carried away were Reuben, Simeon, Issachar, Zebulun, Gad, Dan, Asher, Naphtali, Ephraim and Manasseh. Even so the line was not clean: some Levites remained with the northern tribes, and some of Ephraim, Manasseh and others lived in Judah. When Samaria fell, some survivors went south and joined the Israelites already living there. How northern Israelites came to be in Judah from the start is told at [[1 Kgs. 12:17]].

      The next verse will not let Judah take comfort from being left. It too “walked in the statutes of Israel” (verse 19), and the day would come when the LORD said of Judah what He had done to Israel ([[2 Kgs. 23:27]]).
    sources: [ot-manual-12, cambridge-kings, scripture-helps-2-kings-16-25, lds-scriptures]

  - ref: 23
    phrase: Until the LORD removed Israel out of his sight
    kind: scripture
    title: Removed out of his sight, but not lost to the Father
    body: |
      The removal was what the prophets had foretold, Ahijah first among them ([[1 Kgs. 14:15]]). Not all Israel went: some survivors went south to Judah (see verse 18), and some stayed and mixed with the newcomers (verse 33). Those taken east in large numbers became lost to history, the lost tribes, and much about their fate is not known.

      How could a people be lost when this chapter writes down where they were taken (verse 6)? One Latter-day Saint reading of the Assyrian evidence answers that the deportees intermarried with their neighbors almost at once, and within four or five generations none of their descendants remembered being Israelites: “Lost Israel became lost not because they did not know where they were, but because they forgot who they were.”

      Restoration scripture does not leave them there. The risen Savior told the Nephites He was going “to show myself unto the lost tribes of Israel, for they are not lost unto the Father, for he knoweth whither he hath taken them” ([[3 Ne. 17:4]]). In the Kirtland Temple Moses committed “the keys of the gathering of Israel from the four parts of the earth, and the leading of the ten tribes from the land of the north” ([[D&C 110:11]]). The tribes have never returned to their homeland, but the prophecies speak of a return when they are ready to obey the gospel.
    sources: [scripture-helps-2-kings-16-25, chadwick-review-ten-tribes, bd-israel-kingdom, lds-scriptures]

  - ref: 26
    phrase: the manner of the God of the land
    kind: history
    title: The manner of the God of the land
    body: |
      The settlers explained the lions the way their world explained such things: the land had a god, and they had not given him his due. In the ancient world religion and its gods were commonly thought to be rooted in particular places. Naaman showed the same belief when he asked for two mules' burden of Israel's earth, because he did not think Jehovah could be worshiped elsewhere without it ([[2 Kgs. 5:17]]).

      The narrator, for his part, says plainly that “the LORD sent lions among them” (verse 25). What the settlers made of the LORD once they had been taught His “manner” is the subject of verses 32–34.
    sources: [shannon-location]

  - ref: 28
    phrase: dwelt in Beth-el
    kind: history
    title: A priest sent back to Bethel
    body: |
      The priest was an exiled Israelite brought back to live among the settlers and teach them the ways of the LORD, and he settled at Bethel, the place where Jeroboam had set up one of the golden calves ([[1 Kgs. 12:29]]). The text says only that he taught them how they “should fear the LORD.”

      Bethel raises the question of what such a priest would have taught. One older reading takes it that a deported priest of the north was a priest of the calves, so that what he taught the newcomers was the national religion of the ten tribes: professedly the worship of Jehovah, but carried on in a way contrary to His express commandment. On that reading the settlers learned the LORD's “manner” from the sanctuary that verses 16 and 21–22 have just condemned, which would explain the mixed worship verse 29 goes on to describe.
    sources: [scripture-helps-2-kings-16-25, keil-kings, cambridge-kings]

  - ref: 33
    phrase: They feared the LORD, and served their own gods
    kind: history
    title: The beginning of the Samaritans
    body: |
      The name first appears in this chapter: verse 29 calls the people who built the high places “the Samaritans.” Whether it means there the same community as in the New Testament is uncertain, since the word is used both for anyone living in Samaria and for the later religious group.

      What verse 33 describes, the LORD worshiped alongside the gods each people had brought, is where that later community began. The settlers mixed with the Israelites who had stayed, and over the following centuries the mixed population came to think of itself above all as children of Israel. The Jews rejected them for their descent and their worship; refused a share in rebuilding the temple, they became bitter opponents of the Jews and built a rival temple on Mount Gerizim, and the hostility was still alive in Jesus' day ([[John 4:9]]).
    sources: [scripture-helps-2-kings-16-25, bd-samaritans, matson-bridging]

  - ref: 34
    phrase: they fear not the LORD
    kind: words
    title: Feared, and feared not
    body: |
      Verse 33 says the settlers “feared the LORD”; verse 34 says “they fear not the LORD.” It is the same Hebrew verb in both. One older reading reconciles them: verses 32, 33 and 41 say what the settlers thought they were doing, and thought was enough, while verse 34 says what that worship was as God regarded it, since worshiping Jehovah as the local god of the land, one god beside others, is no worship of Him at all.

      The covenant the writer recites in verses 35–39 leaves no room for a shared fear: “Ye shall not fear other gods” comes three times (verses 35, 37, 38), and “him shall ye fear” is said of the LORD alone, who brought Israel out of Egypt (verse 36). On the same reading, the writer recites it to show the settlers' divided worship as a complete breach of the covenant.
    sources: [oshb-wlc, cambridge-kings, keil-kings]

christ: |
  The LORD of verse 36, who brought Israel “up out of the land of Egypt with great power and a stretched out arm,” is the one who told the Nephites, “I am he that gave the law, and I am he who covenanted with my people Israel” ([[3 Ne. 15:5]]). The covenant this chapter says Israel forgot was His, and He did not forget the people it scatters. After His Resurrection He said He would go to other sheep of Israel who had not yet heard His voice, “that there may be one fold and one shepherd” ([[3 Ne. 16:3]]). The mixed people of Samaria were not forgotten either: Jesus spoke with a woman of Samaria ([[John 4:9]]), and Samaria was among the places to which His Apostles were sent to preach, where Philip did a very successful work ([[Acts 8:4–25]]).

  Israel was scattered for forgetting the covenant (verse 38), and the Lord answers forgetfulness with a promise: “they may forget, yet will I not forget thee, O house of Israel” ([[1 Ne. 21:15]]). The gathering of that scattered house, for which Moses brought the keys, is in President Russell M. Nelson's words “the most important thing taking place on earth today,” and every disciple who chooses to can have a part in it.

