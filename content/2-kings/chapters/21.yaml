chapter: 21
title: As a Man Wipeth a Dish
tagline: Hezekiah's son Manasseh undoes his father's reform, brings idols and altars into the LORD's own house and fills Jerusalem with innocent blood; the prophets announce that Jerusalem will go the way of Samaria, and Manasseh's son Amon follows him until his servants kill him and the people of the land crown Josiah.
when: 'The fifty-five years of Manasseh and the two of his son Amon, after the death of Hezekiah'

setting: |
  Hezekiah, the king who “trusted in the LORD God of Israel” ([[2 Kgs. 18:5]]), is succeeded by his twelve-year-old son, and the reign that follows undoes his father's work. Manasseh reigned about 687 to 642 BC on one common reckoning, in the years when Assyria was at the height of its power, with an empire running from Babylonia to Asia Minor and taking in Egypt. The records of the Assyrian kings Esarhaddon and Ashurbanipal both name Manasseh as a vassal.

  Kings tells the reign almost entirely as a list of sins and a sentence of judgment, then adds two years of Manasseh's son Amon, murdered in his palace. Chronicles tells more of Manasseh, including a captivity and a repentance this chapter does not mention ([[2 Chr. 33:11–19]]; see the note at verse 17). From here on the book gives Manasseh as the reason Judah fell ([[2 Kgs. 23:26]]; [[2 Kgs. 24:3–4]]), and Jeremiah names him too ([[Jer. 15:4]]; see the note there). The chapter ends with the people of the land setting Amon's young son Josiah on the throne; his reform fills the next two chapters. The *Babylon and the Exile* guide sets Manasseh among the [rulers of the period](/old-testament/guides/babylon-and-the-exile/#rulers).

thread: |
  Manasseh's reign is told as Hezekiah's reform run backward. What his father tore down he builds again; what Ahab did in Samaria he does in Jerusalem; and he carries his altars and his idol into the very house of which the LORD had said, “In Jerusalem will I put my name” (verse 4). Two verses frame the list. Verse 2 compares him with the nations the LORD cast out before Israel, and verse 9 says he led Judah to do worse than they did. The sentence of verses 11–15 follows from that comparison (verse 11): Jerusalem will be measured with the line used on Samaria.

  The reversal is what the writer dwells on, and one Latter-day Saint study reads it as the moment Judah's former sins returned. The writer of Kings says nothing of the repentance Chronicles records, for reasons that are not certain (see the note at verse 17). Amon walks in all his father's ways, and the chapter closes on a murder in the palace and a boy of eight made king, the one whose reform will not be enough to turn the sentence back.

sections:
  - range: 1-9
    heading: Hezekiah's reform undone
    plain: |
      Manasseh was twelve years old when he became king, and he reigned fifty-five years in Jerusalem. His mother's name was Hephzibah. He did what was evil in the LORD's sight, following the detestable practices of the nations the LORD had driven out before the Israelites. He rebuilt the high places his father Hezekiah had destroyed; he set up altars to Baal and made an Asherah pole, as Ahab king of Israel had done; and he bowed down to all the stars of heaven and served them. He built altars in the LORD's house, the house of which the LORD had said, “In Jerusalem I will put my name.” In both courts of the LORD's house he built altars to all the host of heaven. He made his son pass through the fire, practiced soothsaying and divination, and consulted necromancers and spiritists. He did great evil in the LORD's sight and provoked Him to anger. He set the carved image of Asherah that he had made in the house of which the LORD had said to David and to his son Solomon, “In this house, and in Jerusalem, which I have chosen out of all the tribes of Israel, I will put my name forever. I will not again make Israel's feet wander from the land I gave their fathers, if only they will be careful to do everything I have commanded them and all the law my servant Moses gave them.” But they did not listen, and Manasseh led them astray, so that they did more evil than the nations the LORD had destroyed before the Israelites.
  - range: 10-15
    heading: The line of Samaria
    plain: |
      The LORD spoke through His servants the prophets: “Because Manasseh king of Judah has done these detestable things, more wickedly than all the Amorites who were before him, and has led Judah into sin with his idols, this is what the LORD, the God of Israel, says: I am bringing such disaster on Jerusalem and Judah that the ears of everyone who hears of it will tingle. I will stretch over Jerusalem the measuring line used on Samaria and the plumb line used on the house of Ahab. I will wipe Jerusalem as one wipes a dish, wiping it and turning it upside down. I will abandon the remnant of my inheritance and hand them over to their enemies; they will be plunder and spoil for all their enemies, because they have done evil in my sight and have provoked me to anger from the day their fathers came out of Egypt until today.”
  - range: 16-18
    heading: Innocent blood, and Manasseh's death
    plain: |
      Manasseh also shed so much innocent blood that he filled Jerusalem from one end to the other, besides the sin he led Judah into, doing evil in the LORD's sight. The rest of Manasseh's acts, all he did and the sin he committed, are written in the book of the chronicles of the kings of Judah. Manasseh died and was buried in the garden of his own house, the garden of Uzza, and his son Amon became king in his place.
  - range: 19-26
    heading: Amon
    plain: |
      Amon was twenty-two years old when he became king, and he reigned two years in Jerusalem. His mother was Meshullemeth daughter of Haruz, from Jotbah. He did evil in the LORD's sight, as his father Manasseh had done. He walked in all his father's ways, served the idols his father had served and bowed down to them. He forsook the LORD, the God of his fathers, and did not walk in the LORD's way. Amon's servants conspired against him and killed the king in his own house. Then the people of the land killed all who had conspired against King Amon, and they made his son Josiah king in his place. The rest of Amon's acts are written in the book of the chronicles of the kings of Judah. He was buried in his tomb in the garden of Uzza, and his son Josiah became king in his place.

notes:
  - ref: 1
    phrase: Manasseh was twelve years old when he began to reign
    kind: history
    title: A boy king, and Assyria's vassal
    body: |
      Manasseh came to the throne a boy and held it through Assyria's strongest years. According to Josephus he was born in the fifteen years the LORD added to Hezekiah's life ([[2 Kgs. 20:6]]), which agrees with his being twelve at his father's death. The chronologies set the start of his reign ten years apart, at 697 or 687 BC, and one explanation offered is that he shared the throne with Hezekiah for those ten years; that is a proposal, not something the text records.

      Politically he had no choice but to submit to Assyria. Assyria's own records, from Esarhaddon and Ashurbanipal, list him as a vassal. Even so, he could have kept his father's reforms and his reverence for Jehovah, and the charge Kings brings against him is that he undid what Hezekiah had done (verse 3).

      His mother's name, Hephzibah, means “my delight is in her.” Isaiah gives the same name to Jerusalem restored ([[Isa. 62:4]]; see the note there).
    sources: [sc-knowhy-648, vandyke-ogden-twelve, tolley-imprisonment, bd-hephzibah]

  - ref: 3
    phrase: he built up again the high places which Hezekiah his father had destroyed
    kind: history
    title: Undoing Hezekiah, copying Ahab
    body: |
      Verse 3 reverses Hezekiah's reform item by item. The high places his father had removed ([[2 Kgs. 18:4]]; see the note there) were built again. The altars to Baal and the grove came back as Ahab had set them up in Samaria ([[1 Kgs. 16:32–33]]); the grove is the Asherah, explained at [[2 Kgs. 13:6]] (see the note there).

      To these Manasseh added the worship of the stars, “all the host of heaven,” a worship that belonged to Assyria's world. Assyria ruled Judah's culture as well as its politics, and in these years astrology and divination flourished there, with astrologers filling the court of Esarhaddon. In Judah the stars were worshipped without images, in the open air or on the rooftops, at small altars where incense was burned. Manasseh brought this worship into the temple itself, with altars to the host of heaven in both its courts (verse 5).

      On one Latter-day Saint reading, the worship of Jehovah was by then so merged with idolatry that it could barely be told from paganism: the reforms had not only lapsed, the LORD's own worship had lost its distinctness.
    sources: [satterfield-divine-justification, bd-grove, ot-manual-19, vandyke-ogden-twelve]

  - ref: 6
    phrase: observed times, and used enchantments, and dealt with familiar spirits and wizards
    kind: words
    title: Every forbidden way of reading the unseen
    body: |
      Verse 6 uses the law's own words for the practices Moses had forbidden. *Observed times* renders a verb for soothsaying whose original meaning is uncertain; *used enchantments* is to practise divination, reading signs and omens. The familiar spirit here is the necromancer, who claimed to consult the dead, and the wizard is perhaps a knowing one, someone supposed to be acquainted with the secrets of the unseen world (the derivation is uncertain); the Hebrew always names the two together. The same verbs stand in the law's prohibitions ([[Lev. 19:26]]; [[Deut. 18:10–11]]; see the note at [[Deut. 18:10]]), and Deuteronomy's list opens, as this verse does, with the one who makes his son pass through the fire (the rite is explained at [[2 Kgs. 16:3]]).

      Saul had put such people out of the land before he went in search of one ([[1 Sam. 28:3]]; see the note there). Manasseh, as king, dealt with them.
    sources: [bdb]

  - ref: 7
    phrase: In this house, and in Jerusalem, which I have chosen out of all tribes of Israel, will I put my name for ever
    kind: scripture
    title: The house where the LORD put His name
    body: |
      Twice in four verses the writer measures Manasseh's sin by the promise he defiled, quoting what the LORD had said of the temple: there He would put His name (verse 4, and here in full). Manasseh set his carved image of Asherah inside that house.

      The promise carried its condition, and verse 8 quotes it: Israel's feet would not be moved from the land “only if they will observe to do” all the law. The LORD had told Solomon the other side when He gave the promise. If Israel turned to other gods, “this house, which I have hallowed for my name, will I cast out of my sight” ([[1 Kgs. 9:7]]). The book comes back to these words when the sentence on Judah is confirmed after Josiah's reform: the LORD “will cast off this city Jerusalem which I have chosen, and the house of which I said, My name shall be there” ([[2 Kgs. 23:27]]).
    sources: [lds-scriptures]

  - ref: 10
    phrase: the LORD spake by his servants the prophets
    kind: history
    title: Prophets the chapter does not name
    body: |
      The sentence of verses 11–15 comes through prophets the writer does not name, and not all their names are known. Chronicles adds two things: the LORD spoke to Manasseh and to his people, and they would not listen ([[2 Chr. 33:10]]); and the words of the seers who spoke to Manasseh were written in the records of the kings ([[2 Chr. 33:18]]). Whoever they were, their message survives: they foretold the city's destruction plainly, in the images of verses 12–13.

      The phrase also links the two kingdoms' ends. Samaria fell “as he had said by all his servants the prophets” ([[2 Kgs. 17:23]]), and the bands that come against Judah are sent “according to the word of the LORD, which he spake by his servants the prophets” ([[2 Kgs. 24:2]]).
    sources: [lds-scriptures, vandyke-ogden-twelve]

  - ref: 11
    phrase: Because Manasseh king of Judah hath done these abominations
    kind: history
    title: Why Manasseh bears the blame
    body: |
      Kings names Manasseh as the cause of Judah's fall. Verses 11–15 announce it, and the book repeats it when the judgment comes: Josiah's reform did not turn the LORD's anger, “because of all the provocations that Manasseh had provoked him withal” ([[2 Kgs. 23:26]]), and the end came “for the sins of Manasseh” ([[2 Kgs. 24:3]]).

      Why a king long dead is blamed has a Latter-day Saint answer in what his reign did to his people. Hezekiah's people had come into the LORD's favor when they put away their idols; one study reads Manasseh's reversal of the reform as the return of their former sins, by the principle the Lord gave in this dispensation, “unto that soul who sinneth shall the former sins return” ([[D&C 82:7]]), and by Mormon's warning that a people once enlightened who fall away “become more hardened” than if they had never known ([[Alma 24:30]]). On this reading, Josiah's reform, two generations later, changed what the people did without changing what they were. Read beside Chronicles, the account suggests that Manasseh created conditions in Judah that those after him could not overcome, so that they went on sinning until the destruction came.

      The text does not make the people his victims. He “made Judah also to sin” (verse 11), but verse 9 has already said that “they hearkened not,” and verse 15 charges them with their own evil since the day their fathers left Egypt. How this stands with the rule that each person answers for his own sin is taken up at [[Ezek. 18:20]] (see the note there).
    sources: [satterfield-divine-justification, sc-knowhy-861, lds-scriptures]

  - ref: 13
    phrase: I will wipe Jerusalem as a man wipeth a dish
    kind: symbol
    title: Measured like Samaria, wiped like a dish
    body: |
      The two images of verse 13 say that Jerusalem will be destroyed as completely as Samaria was. The line and the plummet (a level or plumb line) were a builder's tools. They were used to lay out what was to be built ([[Zech. 1:16]]), and also to mark what was to be leveled to the ground ([[Amos 7:7]]). On one older reading “the line of Samaria” is the measure the LORD used in destroying Samaria, and “the plummet of the house of Ahab” the measure by which Ahab's house was wiped out: what was done to them will be done to Jerusalem.

      The dish is plainer still. A dish wiped and turned upside down, literally turned on its face, is a thing finished with and put away. The ears that “shall tingle” at the news (verse 12) are the words the LORD spoke to Samuel of the fall of Eli's house ([[1 Sam. 3:11]]), and Jeremiah repeats them of Jerusalem ([[Jer. 19:3]]): a judgment never heard of before, which brings alarm and horror.
    sources: [keil-kings, cambridge-kings]

  - ref: 16
    phrase: Manasseh shed innocent blood very much
    kind: history
    title: Innocent blood
    body: |
      Verse 16 adds a sin of another kind to the idolatry: Manasseh filled Jerusalem with innocent blood. Who died the verse does not say. One Latter-day Saint reading suggests they were people who protested his idolatry. Josephus says that Manasseh “barbarously slew all the righteous men that were among the Hebrews,” not sparing even the prophets. The book counts this sin on its own when the end comes: the innocent blood was something “which the LORD would not pardon” ([[2 Kgs. 24:4]]).

      Ancient Jewish sources say that Isaiah was among the dead, sawn asunder, and some read Hebrews' “they were sawn asunder” ([[Heb. 11:37]]) as an allusion to it. The accounts differ and their reliability is in question, so how Isaiah died may not be known without better sources.

      The theme page [Innocent Blood](/2-kings/themes/innocent-blood/) sets this verse and 24:4 beside the words Judas used of the Savior's blood (Matt. 27:4).
    sources: [vandyke-ogden-twelve, ot-manual-19, lds-scriptures, parry-man-named-isaiah]

  - ref: 17
    phrase: are they not written in the book of the chronicles of the kings of Judah?
    kind: scripture
    title: The repentance Kings leaves out
    body: |
      Kings closes Manasseh's reign without a word of the repentance Chronicles records. There the Assyrian captains carry him to Babylon in chains; in his affliction he humbles himself greatly before the God of his fathers and prays, and the LORD hears him and brings him back to Jerusalem, and “Manasseh knew that the LORD he was God” ([[2 Chr. 33:11–13]]). Back on his throne he takes the idol out of the temple, removes the altars he had built in the city and on the temple mount, and restores the LORD's altar ([[2 Chr. 33:15–16]]).

      Why Kings says nothing of this is not easy to say. On one older reading the conversion left no lasting mark on the kingdom: putting away outward idolatry did not convert the people, and Amon restored the idols his father had abolished (verses 20–21). Another older reading is that the repentance changed nothing in the succession, so the writer left it out. The note at verse 11 gives the Latter-day Saint reading of what Manasseh's reign left behind.
    sources: [lds-scriptures, keil-kings, cambridge-kings]

  - ref: 24
    phrase: the people of the land made Josiah his son king in his stead
    kind: history
    title: Amon's murder and the boy king
    body: |
      Amon reigned two years and was killed in his own house by his servants. He was twenty-four when he died, so he had been sixteen when Josiah was born, and his son was eight ([[2 Kgs. 22:1]]). Then “the people of the land” put the conspirators to death and crowned the boy. Little is known about this group, but it plainly held great influence, and it appears at other crises of David's house: it crowned Joash ([[2 Kgs. 11:17–21]]), Azariah after his father's murder ([[2 Kgs. 14:21]]), and Jehoahaz after Josiah's death ([[2 Kgs. 23:30]]).

      The boy they crowned would make his reign a turning point in Judah's religious history ([[2 Kgs. 22:2]]).
    sources: [tolley-imprisonment]

christ: |
  The Lord who spoke through the prophets against Manasseh is the Lord who heard him. Jesus Christ said to the Nephites, “I am he that gave the law, and I am he who covenanted with my people Israel” ([[3 Ne. 15:5]]), and Chronicles says that when Manasseh, who had filled Jerusalem with innocent blood, humbled himself and prayed, He heard him and brought him home ([[2 Chr. 33:12–13]]). Neither book says more of what that meant for Manasseh himself.

  Kings adds the other half: read beside Chronicles, Manasseh may have left conditions in Judah that those after him could not overcome. The Lord hears those who humble themselves before Him, and a disciple's choices, for good or ill, still shape the world in which children and grandchildren learn to live.

explore: |
  - **Manasseh in Chronicles.** [[2 Chr. 33:1–25]], the captivity, the prayer and the return, beside this chapter.
  - **The sentence confirmed.** [[2 Kgs. 23:26–27]], [[2 Kgs. 24:3–4]] and [[Jer. 15:1–4]], where the fall of Judah is set down to Manasseh.
  - **Idols in the temple.** Ezekiel's vision of the abominations in the house of the LORD, [[Ezek. 8:3–16]].

