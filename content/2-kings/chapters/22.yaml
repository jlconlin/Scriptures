chapter: 22
title: The Book of the Law
tagline: Josiah, made king at eight, repairs the temple; the high priest finds the book of the law, and when it is read to the king he tears his clothes and sends to the prophetess Huldah, who answers that the judgment the book threatens will come, but not in his days.
when: 'The reign of Josiah; the book is found in his eighteenth year'

setting: |
  Josiah came to the throne after two wicked reigns. His grandfather Manasseh had filled Jerusalem with idols and innocent blood ([[2 Kgs. 21:16]]), and his father Amon “walked in all the way that his father walked in” ([[2 Kgs. 21:21]]) until his own servants killed him. The people of the land put the conspirators to death and made the eight-year-old Josiah king ([[2 Kgs. 21:24]]). The Bible Dictionary dates his reign 641–610 B.C. He is the king whom a man of God had named at Bethel long before his birth ([[1 Kgs. 13:2]]).

  Prophets were at work in his reign. Jeremiah was called in Josiah's thirteenth year ([[Jer. 1:2]]), and Zephaniah prophesied “in the days of Josiah” ([[Zeph. 1:1]]). It is also Lehi's Jerusalem: the Book of Mormon begins there in the years after the book of the law was found, and the reform came not many years before Lehi left the city.

  The chapter is the first half of one story; chapter 23 tells how Josiah read the book to the people, made a covenant, cleansed the land and kept the Passover. Chronicles tells the story again ([[2 Chr. 34]]–35) and adds that Josiah had begun to seek the God of David in his eighth year as king and to purge the land of idols in his twelfth, before the book was found ([[2 Chr. 34:3]]). One of the men he sends to Huldah, Ahikam son of Shaphan, would later protect Jeremiah from those who wanted him put to death ([[Jer. 26:24]]).

thread: |
  The chapter moves from a king who does right without the book to a king who hears it. Josiah already walks in David's way (verse 2). Then the high priest finds the book of the law, and what Josiah hears read is the law's warning to a people who forsake the LORD. He does not treat it as an old document about his ancestors. He tears his clothes, says that the wrath is “kindled against us,” and sends to ask the LORD what it means for him, for the people and for all Judah.

  Huldah's answer has two parts. To the people the word stands: everything the book threatens will come upon Jerusalem, because they have forsaken the LORD, and the wrath “shall not be quenched.” To the king there is mercy: because his heart was tender and he humbled himself, the LORD has heard him, and he will be gathered to his grave before the evil comes. The chapter leaves the two side by side, a judgment repentance could delay but not undo, and a man spared because the word found him willing.

sections:
  - range: 1-2
    heading: A king of eight who did right
    plain: |
      Josiah was eight years old when he became king, and he reigned thirty-one years in Jerusalem. His mother's name was Jedidah, the daughter of Adaiah of Boscath. He did what was right in the LORD's sight and followed in every way the path of David his ancestor, without turning aside to the right or to the left.
  - range: 3-7
    heading: Repairing the temple
    plain: |
      In the eighteenth year of his reign King Josiah sent the scribe Shaphan, son of Azaliah, son of Meshullam, to the house of the LORD with these instructions: “Go up to Hilkiah the high priest and have him count the silver that has been brought into the house of the LORD, which the doorkeepers have collected from the people. Have them hand it over to the men appointed to supervise the work on the house of the LORD, and have them pay it to the workers who are repairing the damaged places in the temple: the carpenters, builders and masons. Have them also buy timber and cut stone for the repairs.” No account was required of the men who were given the money, because they were honest.
  - range: 8-13
    heading: The book found and read
    plain: |
      Hilkiah the high priest said to Shaphan the scribe, “I have found the book of the law in the house of the LORD.” He gave the book to Shaphan, and Shaphan read it. Then Shaphan went to the king and reported: “Your servants have emptied out the money that was in the temple and handed it to the men who supervise the work on the house of the LORD.” Then Shaphan the scribe told the king, “Hilkiah the priest has given me a book,” and he read it aloud to the king. When the king heard the words of the book of the law, he tore his clothes. He gave orders to Hilkiah the priest, to Ahikam son of Shaphan, to Achbor son of Michaiah, to Shaphan the scribe and to Asahiah the king's servant: “Go and inquire of the LORD for me, for the people and for all Judah about what is written in this book that has been found. Great is the LORD's anger that burns against us, because our ancestors have not obeyed the words of this book or done everything written there for us to do.”
  - range: 14-20
    heading: Huldah's answer
    plain: |
      So Hilkiah the priest, Ahikam, Achbor, Shaphan and Asahiah went to the prophetess Huldah. She was the wife of Shallum son of Tikvah, son of Harhas, keeper of the wardrobe, and she lived in Jerusalem in the Second Quarter. They spoke with her, and she said to them: “This is what the LORD, the God of Israel, says: Tell the man who sent you to me, ‘This is what the LORD says: I am going to bring disaster on this place and on the people who live here, everything written in the book the king of Judah has read. Because they have forsaken me and burned incense to other gods, provoking me to anger by all the work of their hands, my anger will burn against this place and will not be put out.’ But to the king of Judah, who sent you to inquire of the LORD, say this: ‘This is what the LORD, the God of Israel, says about the words you heard: Because your heart was tender and you humbled yourself before the LORD when you heard what I said against this place and its people, that they would become a desolation and a curse, and because you tore your clothes and wept before me, I have heard you, says the LORD. Therefore I will gather you to your ancestors, and you will be laid in your grave in peace. Your eyes will not see all the disaster I am going to bring on this place.’” And they took her answer back to the king.

notes:
  - ref: 1
    phrase: Josiah was eight years old when he began to reign
    kind: history
    title: A boy on the throne
    body: |
      Josiah was made king by the people of the land; he did not take the throne himself. When Amon's servants murdered him, it was “the people of the land” who killed the conspirators and made his young son king ([[2 Kgs. 21:24]]). Who governed for an eight-year-old the text does not say. Later, Josiah made his reformation “under the guidance of Hilkiah,” the high priest of verse 4.

      What is remarkable is the order of events. Chronicles says Josiah began to seek the God of David in the eighth year of his reign, when he was about sixteen, and to purge the land of idols in the twelfth ([[2 Chr. 34:3]]). The book of the law was not found until the eighteenth year (verse 3), when he was about twenty-six. President Spencer W. Kimball found it all the more surprising that Josiah did right when his fathers had been so wicked and the written law had been lost and was all but unknown, even among the temple's priests.
    sources: [lds-scriptures, bd-josiah, ot-seminary-lesson-101, kimball-tpc-6]

  - ref: 2
    phrase: turned not aside to the right hand or to the left
    kind: scripture
    title: In the words of the law
    body: |
      The narrator praises Josiah in the language of Deuteronomy, which uses the same phrase for faithfulness to the commandments. Israel is told not to “go aside from any of the words which I command thee this day, to the right hand, or to the left, to go after other gods to serve them” ([[Deut. 28:14]]), and the law of the king requires that he keep a copy of the law, read it all his days, and “turn not aside from the commandment, to the right hand, or to the left” ([[Deut. 17:20]]). Set against those passages, the phrase means an unwavering adherence to the law of the LORD.

      “Walked in all the way of David his father” puts Josiah beside Hezekiah, who also did right “according to all that David his father did” ([[2 Kgs. 18:3]]). How the two can each be called incomparable is taken up at [[2 Kgs. 18:5]].
    sources: [keil-kings, lds-scriptures]

  - ref: 8
    phrase: I have found the book of the law in the house of the LORD
    kind: history
    title: What the book was
    body: |
      What Hilkiah found was a written book of the law of Moses that had passed out of use, though Kings does not say which part of the law it held. Most scholars believe it was a version of Deuteronomy, though it may have included more of the five books of Moses. Careful readers have noticed since at least the 1780s that the laws peculiar to Deuteronomy, rather than the other law codes of the five books of Moses, fit the account of the find. The reform the book set off centralized sacrificial worship at Jerusalem and abolished the high places.

      The scriptures, it seems, had been lost or hidden under the wicked kings before Josiah, Manasseh's fifty-five years and Amon's two. The law itself had told Israel to keep “this book of the law” “in the side of the ark of the covenant” as “a witness against thee” ([[Deut. 31:26]]), and President Kimball took the find to be the very book Moses had placed in the ark. When Deuteronomy was written, and what some writers think Josiah's reform cost Israel, is discussed at [[Deut. 31:9]].
    sources: [ot-seminary-lesson-101, kimball-tpc-6, scripture-helps-2-kings-16-25, eliason-josiah, bd-josiah, lds-scriptures]

  - ref: 11
    phrase: he rent his clothes
    kind: history
    title: Why the king tore his clothes
    body: |
      Josiah tore his clothes in grief, because the book showed him that he and his people had not kept its laws. His words in verse 13 suggest what had been read to him: the curses the law pronounces on those who despise God's commandments, as in [[Lev. 26]] and [[Deut. 28]], where “if thou wilt not hearken unto the voice of the LORD thy God… all these curses shall come upon thee” ([[Deut. 28:15]]).

      Josiah also does not read the curses as history. The fathers disobeyed, but the wrath is “kindled against us,” and the law was written “concerning us,” given to his own generation to obey and not only to the fathers. So he sends to inquire “for me, and for the people, and for all Judah.”

      His son would hear a prophet's scroll read and do the opposite: Jehoiakim and his servants “were not afraid, nor rent their garments” ([[Jer. 36:24]]; the contrast is drawn in the note there).
    sources: [sc-knowhy-428, keil-kings, lds-scriptures]

  - ref: 14
    phrase: Huldah the prophetess
    kind: history
    title: Who Huldah was
    body: |
      Huldah was a prophetess of known standing in Jerusalem, and the king's men took the book to her to have it confirmed. The text calls her “the prophetess,” with the article, as a figure its readers would know, one of only a few women in the Bible given that title (the others are taken up at [[Ex. 15:20]]). Jeremiah and Zephaniah were both prophesying in those years, so the choice was not for want of prophets; why the delegation went to her is not known.

      She answered as the prophets did, with “Thus saith the LORD” again and again, and she did not soften the word for the king. In the Church's terms a prophetess has a testimony of Jesus and enjoys the spirit of revelation, without holding the priesthood or its keys, and the gift of prophecy she had is open to every member of the Church.

      Her answer carried weight beyond Josiah's court. In confirming that the book was the LORD's word, her witness has been called a milestone in the formation of the Bible itself.

      Her home “in the college” was in the Second Quarter of the city; the Hebrew *mishneh* names a second quarter or district of the city, and Zephaniah names the same district, “the second” ([[Zeph. 1:10]]).
    sources: [scripture-helps-2-kings-16-25, davis-huldah, gs-prophetess, ot-seminary-lesson-101, eliason-josiah, bdb, lds-scriptures]

  - ref: 17
    phrase: my wrath shall be kindled against this place, and shall not be quenched
    kind: history
    title: A judgment repentance did not undo
    body: |
      Huldah's answer keeps two things apart: what the LORD will do to Jerusalem and what He will do for Josiah. The first part is addressed to “the man that sent you” (verse 15), the second to “the king of Judah” (verse 18). For the city nothing is softened. Every curse in the book will come “because they have forsaken me,” and the wrath “shall not be quenched.”

      Josiah's repentance did not reverse that, and his reform, though he did his best, could not. The LORD promised through Huldah to hold back Judah's fate until the righteous king was dead, but the nation's end was certain after decades of unrepentant idolatry and neglect of the law. The account says the same after the reform is finished: the LORD “turned not from the fierceness of his great wrath… because of all the provocations that Manasseh had provoked him withal” ([[2 Kgs. 23:26]]; the reasons are at [[2 Kgs. 21:11]]).
    sources: [davis-huldah, lds-scriptures]

  - ref: 19
    phrase: Because thine heart was tender
    kind: words
    title: A tender heart
    body: |
      A “tender” heart here is not a gentle temperament but a penitent one. The verb (*rākak*) means to be soft or tender; of the heart it can mean to be fainthearted, but in this verse it means “be softened, penitent,” set in parallel with the next verb, “thou hast humbled thyself.” Josiah's heart was softened by the word he heard, and the verse names what followed: he humbled himself, tore his clothes and wept, and the LORD answers in kind: “I also have heard thee.”
    sources: [bdb]

  - ref: 20
    phrase: thou shalt be gathered into thy grave in peace
    kind: history
    title: In peace, though he died in battle
    body: |
      Josiah was killed at Megiddo by Pharaoh-nechoh ([[2 Kgs. 23:29]]), which seems to break the promise of a peaceful death. Read in context, though, the promise concerns what Josiah would see befall Jerusalem, not the manner of his death. To be gathered to one's fathers simply means to die, and it is said of men killed in battle as well as of men who die in bed: Ahab was shot in his chariot and died, and still “slept with his fathers” ([[1 Kgs. 22:40]]). “In peace” is explained by the next clause: “thine eyes shall not see all the evil which I will bring upon this place.” None of the disasters pronounced against the nation would come in his days; the promise did not speak to the war with Egypt.

      Josiah died a free man before Babylon could subjugate him or his people, and during his life they stayed settled in Jerusalem. He left his kingdom more in harmony with the Lord than he had found it. Isaiah speaks of the righteous “taken away from the evil to come,” and the note at [[Isa. 57:1]] sets this promise beside it.
    sources: [keil-kings, cambridge-kings, davis-huldah, lds-scriptures]

christ: |
  The LORD who answered Josiah through Huldah is Jehovah, the premortal Jesus Christ, and the chapter shows Him both just and merciful: the judgment the law pronounced stands, and the king whose heart was tender is heard. President Kimball drew the comparison for a reader now: “Josiah had the law of Moses only. In our scriptures we have the gospel of Jesus Christ in its fulness.”

  What moved Josiah was hearing the word and letting it humble him. In the same way the scriptures, received with a tender heart, turn a disciple to the Lord; President Kimball taught that all must “return to the scriptures just as King Josiah did and let them work mightily within us.”

explore: |
  - **The rest of the story.** [[2 Kgs. 23:1–30]], the covenant, the reform, the Passover and Josiah's death; and [[2 Chr. 34]]–35, the Chronicler's account.
  - **What Josiah heard.** [[Deut. 28]], the blessings and curses of the covenant.
  - **A king who did not tear his clothes.** [[Jer. 36]], where Jehoiakim burns Jeremiah's scroll.
  - **Huldah.** [“A Prophet Named Huldah”](https://mi.byu.edu/old-testament-reflections/a-prophet-named-huldah), an essay in the Maxwell Institute's *Old Testament Reflections* (2026).

