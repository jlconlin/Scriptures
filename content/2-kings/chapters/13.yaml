chapter: 13
title: The Arrow of the LORD's Deliverance
tagline: Jehu's son and grandson reign in Samaria under Syria's heel; the LORD hears Jehoahaz and promises a deliverer; the dying Elisha has King Joash shoot the arrow of deliverance and strike the ground, and he strikes only three times; a dead man revives at Elisha's bones, and Joash beats Syria three times.
when: 'The reigns of Jehoahaz (seventeen years) and Jehoash (sixteen years) over Israel in Samaria, beginning in the twenty-third year of Joash king of Judah'

setting: |
  Chapter 13 returns from Judah to the north and to Jehu's dynasty. The LORD had promised Jehu that his sons would sit on Israel's throne to the fourth generation ([[2 Kgs. 10:30]]); Jehoahaz is the first of them, and his son Jehoash the second. The chapter calls the northern king both Jehoash and Joash, and he is not Joash of Judah, the boy-king of chapter 12: there were two kings of the name, one in each kingdom.

  These are Hazael's years. Elisha had wept to foresee what Hazael would do to Israel ([[2 Kgs. 8:12]]), and he had already taken everything east of the Jordan in Jehu's day ([[2 Kgs. 10:32–33]]). Under Jehoahaz the pressure reaches the land west of the river and the army is nearly gone.

  Elisha has not appeared since he sent a young prophet to anoint Jehu ([[2 Kgs. 9:1]]). His ministry ran more than fifty years, from Jehoram to Joash, and this chapter gives his last act and his death. None of it is in Chronicles. The narrator also runs ahead of his story, writing long afterward: verses 5–6 speak of a deliverance not yet come, and verses 22–25 go back over Hazael's oppression to show Elisha's last word coming true.

thread: |
  The chapter is about deliverance given to people who did not deserve it. Both kings do evil and keep Jeroboam's calves, and yet the LORD hears Jehoahaz when he prays, gives a saviour, and spares Israel “because of his covenant with Abraham, Isaac, and Jacob” (verse 23). The reason is the LORD's mercy and His covenant, not Israel's merit.

  At the center the dying prophet puts that deliverance into the king's hands, literally, with a bow and arrows. The arrow is the LORD's; how much of the victory Joash receives depends on how far he acts on the promise, and he strikes three times and stops. Then Elisha dies, and his grave gives life to a dead man, as though to say that the word of the dead prophet still stands. The last verses tell what came of it: Joash beat Syria three times, just as many times as he struck the ground. The writer of Kings records the prophecy, then shows its fulfilment. And his “as yet” in verse 23 reminds the reader that the reprieve would not last forever.

sections:
  - range: 1-9
    heading: Jehoahaz
    plain: |
      In the twenty-third year of Joash son of Ahaziah, king of Judah, Jehoahaz son of Jehu became king over Israel in Samaria, and he reigned seventeen years. He did what was evil in the LORD's sight and followed the sins of Jeroboam son of Nebat, who had led Israel into sin; he did not turn from them. So the LORD's anger burned against Israel, and He gave them over to Hazael king of Syria and to Ben-hadad son of Hazael for as long as they lived. Then Jehoahaz pleaded with the LORD, and the LORD listened to him, for He saw how the king of Syria was oppressing Israel. (The LORD gave Israel a deliverer, and they escaped from Syria's power, and the Israelites lived in their own homes as they had before. Even so, they did not turn from the sins of Jeroboam's house, who led Israel into sin, but kept on in them; and the Asherah pole was still standing in Samaria.) The king of Syria had left Jehoahaz no more of an army than fifty horsemen, ten chariots and ten thousand foot soldiers, for he had destroyed them and made them like dust trampled at threshing. The rest of what Jehoahaz did, and his might, is written in the book of the chronicles of the kings of Israel. Jehoahaz died and was buried in Samaria, and his son Joash became king in his place.
  - range: 10-13
    heading: Jehoash
    plain: |
      In the thirty-seventh year of Joash king of Judah, Jehoash son of Jehoahaz became king over Israel in Samaria, and he reigned sixteen years. He did what was evil in the LORD's sight; he did not turn from any of the sins of Jeroboam son of Nebat, who led Israel into sin, but kept on in them. The rest of what Joash did, and the might with which he fought Amaziah king of Judah, is written in the book of the chronicles of the kings of Israel. Joash died, and Jeroboam took his throne; Joash was buried in Samaria with the kings of Israel.
  - range: 14-19
    heading: The dying prophet and the arrows
    plain: |
      Elisha had fallen ill with the illness he would die of, and Joash king of Israel came down to him and wept over him. “My father, my father!” he said. “The chariots of Israel and its horsemen!” Elisha told him, “Take a bow and arrows,” and he took them. Elisha said to the king of Israel, “Put your hand on the bow,” and he did, and Elisha laid his own hands on the king's hands. “Open the window toward the east,” he said, and it was opened. “Shoot!” Elisha said, and he shot. Then Elisha said, “The LORD's arrow of victory, the arrow of victory over Syria! You will strike the Syrians at Aphek until you have made an end of them.” Then he said, “Take the arrows,” and the king took them. “Strike the ground,” he told the king of Israel, and he struck three times and stopped. The man of God was angry with him. “You should have struck five or six times,” he said. “Then you would have struck Syria until you had made an end of it. Now you will strike Syria only three times.”
  - range: 20-21
    heading: Elisha's grave
    plain: |
      Elisha died, and they buried him. Bands of Moabite raiders used to invade the land each year as spring came. Once, as some men were burying a man, they suddenly saw a band of raiders, and they threw the man into Elisha's tomb. As soon as the man touched Elisha's bones, he came to life and stood up on his feet.
  - range: 22-25
    heading: The cities won back
    plain: |
      Hazael king of Syria had oppressed Israel all through the reign of Jehoahaz. But the LORD was gracious to them and had compassion on them and turned toward them, because of His covenant with Abraham, Isaac and Jacob. He would not destroy them, and He did not yet cast them out of His presence. When Hazael king of Syria died, his son Ben-hadad became king in his place. Then Jehoash son of Jehoahaz took back from Ben-hadad son of Hazael the cities Hazael had taken in war from his father Jehoahaz. Three times Joash defeated him, and he recovered the cities of Israel.

notes:
  - ref: 5
    phrase: And the LORD gave Israel a saviour
    kind: history
    title: Who the saviour was
    body: |
      The “saviour” of verse 5 is a deliverer from Syria, not a prophecy of Jesus Christ. The title can sound messianic to a modern ear, but what the LORD promised Jehoahaz was deliverance, and it came through his own son and grandson. Jehoash won back the cities Hazael had taken (verse 25), and Jeroboam II restored Israel's old borders ([[2 Kgs. 14:25]]).

      Verses 5–6 stand in parentheses because they run ahead of the story, as this historian, writing many years later, often does: Jehoahaz himself never saw the answer, for Hazael “oppressed Israel all the days of Jehoahaz” (verse 22). Kings comes back to it when it describes Jeroboam's reign in words that echo verse 4: “the LORD saw the affliction of Israel, that it was very bitter… but he saved them by the hand of Jeroboam the son of Joash” ([[2 Kgs. 14:26–27]]). Verse 7 shows how low Israel had been brought when the LORD heard its king: fifty horsemen and ten chariots were all the army left.
    sources: [ot-manual-6, keil-kings, lds-scriptures]

  - ref: 6
    phrase: there remained the grove also in Samaria
    kind: history
    title: The calves, and the grove left standing
    body: |
      Both kings in this chapter are judged by the same failing: they kept “the sins of Jeroboam the son of Nebat” (verses 2, 11), the golden calves at Bethel and Dan, which Jehu had kept too even after he destroyed Baal's house ([[2 Kgs. 10:28–29]]; the calves are explained at [[1 Kgs. 12:28]]). Verse 6 adds that “the grove” still stood in Samaria. The grove is an *asherah*, a living tree or a carved pole set up as an object of worship, which the prophets forbade. Ahab had made one ([[1 Kgs. 16:33]]), and when Jehu purged Samaria the text says he burned Baal's images and broke down Baal's house ([[2 Kgs. 10:26–27]]); it says nothing of the grove.

      The detail sits inside the parenthesis about deliverance, and it makes the point of that parenthesis. Even when the LORD saved Israel, Israel did not turn from its idols; the deliverance was His mercy, not their reform.
    sources: [bd-grove, lds-scriptures]
  - ref: 10
    phrase: In the thirty and seventh year of Joash king of Judah
    kind: history
    title: Years that do not add up
    body: |
      A reader who does the arithmetic will find that verses 1 and 10 disagree. Jehoahaz began in Joash of Judah's twenty-third year and reigned seventeen years, which would take him to Joash's fortieth year, yet his son is said to begin in the thirty-seventh. The figures cannot all be right as they stand, and the chapter does not say how its years were counted. No note on the site tries to reconcile the cross-dating of the two kingdoms; the dates in the [Two Kingdoms and Assyria](/old-testament/guides/two-kingdoms-and-assyria/#rulers) guide are approximate, and where the proposals differ it gives each.
    sources: [lds-scriptures]
  - ref: 14
    phrase: wept over his face
    kind: history
    title: A king who wept for the prophet
    body: |
      Joash keeps Jeroboam's calves (verse 11), yet he comes down to the dying prophet and weeps over him, perhaps because he felt that Elisha alone held “the key to Israel's future safety.” His cry, “O my father, my father, the chariot of Israel, and the horsemen thereof,” is the one Elisha himself raised when Elijah was taken up ([[2 Kgs. 2:12]], where the note explains it). That the same phrase is spoken over both prophets is one of the ways the book of Kings ties Elijah and Elisha together.

      The scene that follows shows how far this king, who honors the prophet and keeps the calves, will act on the prophet's word.
    sources: [ot-manual-6, woods-elisha-children, lds-scriptures]
  - ref: 16
    phrase: Put thine hand upon the bow
    kind: symbol
    title: A prophecy acted out by two
    body: |
      The arrows are a prophecy acted out, and the prophet and the king act it out together. Old Testament prophets often prophesied by symbolic action: Ahijah tore a new garment into twelve pieces before Jeroboam ([[1 Kgs. 11:29–31]]), and such acts came from God and carried His authority as surely as spoken words. Often someone else looked on, as Jeroboam watched Ahijah tear the garment. Here the king takes part: Joash draws the bow, Elisha lays his hands on the king's hands, and one arrow is shot by both, one of at least two such acts in the Old Testament in which another person joined the prophet.

      The window opens east, toward the land beyond the Jordan, Gilead, which Hazael had taken in Jehu's day ([[2 Kgs. 10:32–33]]). Elisha names the arrow before he names its target: it is first “the arrow of the LORD's deliverance,” and only then “the arrow of deliverance from Syria.”
    sources: [parry-symbolic-action, lds-scriptures]
  - ref: 19
    phrase: Thou shouldest have smitten five or six times
    kind: history
    title: Why three strokes angered the prophet
    body: |
      Joash had just been told that a shot arrow meant victory over Syria, so the second command may have tested how much victory he wanted. “Smite upon the ground” most likely means to shoot the remaining arrows into the ground, and each shot stood for an overthrow of the Syrians. Three times he shot and stopped, and Elisha's anger answers that half-measure. The text does not say why he stopped. On one older reading, stopping at three showed that he lacked zeal for the promise and true faith that God could do all He had said; that want of zeal cost him the full victory, as Elisha's words in verse 19 say.

      The chapter ends by keeping the count. “Three times did Joash beat him, and recovered the cities of Israel” (verse 25), and the history is told so that the reader can see the dying prophet's word fulfilled. The three victories probably drove Syria from the land west of the Jordan that Hazael had taken under Jehoahaz. Gilead, beyond the river, waited for Jeroboam II ([[2 Kgs. 14:25]]).
    sources: [keil-kings, cambridge-kings]

  - ref: 21
    phrase: touched the bones of Elisha, he revived
    kind: history
    title: Life from a prophet’s grave
    body: |
      The last miracle of Elisha's story happens after he is dead, and it may confirm what he said before he died. The Moabite raiders came “at the coming in of the year,” the season when armies took the field ([[2 Sam. 11:1]]), and a burial party that saw them coming put the body in haste into Elisha's tomb. The earlier Israelites did not bury in coffins; the dead were wrapped in linen cloths and laid in tombs cut in the rock and closed with a stone, so a body laid in haste could easily touch the bones already there. “Bones” need not mean that Elisha had been dead long.

      The text does not say what the miracle meant, and older readers give two answers. One takes it as God's seal on the prophet's last prophecy: the dying man had promised Joash victory over Syria, and life coming out of his grave declared that the word still stood. The other takes it to show that nothing in the prophet himself had given him his powers, since God could work a miracle through his dead body as well. The raised man of verse 21 joins the Shunammite's son, whom Elisha raised in life ([[2 Kgs. 4:34]]).
    sources: [cambridge-kings, keil-kings]

  - ref: 23
    phrase: neither cast he them from his presence as yet
    kind: history
    title: Spared for the fathers’ sake, as yet
    body: |
      Verse 23 gives the reason Israel was spared, and the reason is the LORD's covenant with the fathers, not anything Israel had done. Three verbs pile up the mercy (gracious, compassion, respect), and the cause follows: “because of his covenant with Abraham, Isaac, and Jacob.” For the covenant's sake the LORD turned again to a nation that kept Jeroboam's calves, and He did not cast them away from His presence.

      The last words look ahead. “As yet” is in Hebrew *ʿad-ʿattâ*, “until now”: the reprieve held up to the time of the telling. Chapter 17 tells the end with the same Hebrew word for the LORD's presence, *pānāyw*, which the King James renders there “sight”: “the LORD removed Israel out of his sight, as he had said by all his servants the prophets” ([[2 Kgs. 17:23]], where the note explains it).
    sources: [oshb-wlc, biblehub-interlinear, lds-scriptures]
christ: |
  The LORD of this chapter, the premortal Jesus Christ ([[Ex. 3:14]]), hears a king who did evil, sends a deliverer to a people who would not leave their idols, and spares them for the sake of His covenant with Abraham, Isaac and Jacob. At Elisha's grave He gives life to a dead man, bearing witness that He is “not the God of the dead, but of the living” ([[Matt. 22:32]]). Jesus Christ is at the center of that Abrahamic covenant, and those who make covenants with God today are bound to Him in the same way: He does not abandon them, He keeps giving them chances to change, and when they stray He helps them find their way back. Joash was to take hold of the LORD's promise by an act of his own, and he received three victories for three strokes.

explore: |
  - **Hazael's wars.** [[2 Kgs. 8:7–15]], [[2 Kgs. 10:32–33]] and [[2 Kgs. 12:17–18]]: what Elisha wept to foresee, as it came.
  - **The saviour who came.** [[2 Kgs. 14:23–29]], Jeroboam II and the word of Jonah son of Amittai.
  - **Prophecy without words.** [“Symbolic Action as Prophecy in the Old Testament”](https://rsc.byu.edu/sperry-symposium-classics-old-testament/symbolic-action-prophecy-old-testament), on Elisha's arrows, Ahijah's garment, Jeremiah's yoke and the rest.

