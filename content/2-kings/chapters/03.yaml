chapter: 3
title: The Word of the LORD Is with Him
tagline: Moab breaks away, three kings march against it and run out of water in the wilderness of Edom, and Elisha, who will not look at the king of Israel, speaks for the LORD for Jehoshaphat's sake; the water comes, Moab is routed, and the war ends with a son burned on a city wall.
when: 'The reign of Jehoram the son of Ahab, who began to reign over Israel in the eighteenth year of Jehoshaphat king of Judah ([[2 Kgs. 3:1]])'

setting: |
  Jehoram, called Joram at [[2 Kgs. 8:16]], is the second of Ahab's sons to reign. Ahaziah, the son of Ahab who reigned before him ([[1 Kgs. 22:51]]), died in chapter 1 without a son ([[2 Kgs. 1:17]]), and chapter 1 had opened with the sentence this chapter takes up: “Then Moab rebelled against Israel after the death of Ahab” ([[2 Kgs. 1:1]]).

  Moab had paid tribute to Israel since the days of David. The figures in verse 4 are that tribute, paid every year: a hundred thousand lambs and a hundred thousand rams with their wool. When Ahab died, Mesha thought Israel was weakening and broke away. His own account of how he threw off Israel's rule survives on a stone inscription (see the note at verse 27).

  The chapter is also the first in which Elisha deals with kings. In chapter 2 he received Elijah's mantle and the double portion he asked for (see [[2 Kgs. 2:9]] and [[2 Kgs. 2:13]]); here he is still known as the man who served Elijah. Jehoshaphat of Judah, who had insisted on hearing a prophet of the LORD before Ramoth-gilead ([[1 Kgs. 22:7]]), insists again, and his ally is now Ahab's son instead of Ahab.

thread: |
  The chapter is a campaign that nearly fails twice. It nearly fails in the wilderness, when after seven days' march the armies have no water and Jehoram can only say that the LORD has brought three kings together to hand them to Moab (verses 10 and 13). Jehoshaphat asks for a prophet. Elisha will not look at the king of Israel, but for Judah's king he speaks: the LORD will fill the dry valley with water no one sees coming, and that is only “a light thing” beside the victory He will add (verse 18). Both come as he said. The water arrives at the morning offering, the Moabites take it for blood and run into an army ready for them, and their land is laid waste as the prophet had described.

  The campaign then stops short at the walls of Kir-haraseth. Mesha, unable to break out, offers his heir to his own god in sight of the besiegers, “great indignation” comes against Israel, and the kings go home without bringing Moab back under tribute.

sections:
  - range: 1-3
    heading: Jehoram king of Israel
    plain: |
      Jehoram the son of Ahab became king over Israel in Samaria in the eighteenth year of Jehoshaphat king of Judah, and he reigned twelve years. He did evil in the sight of the LORD, but not as his father and mother had: he removed the sacred pillar of Baal that his father had made. Yet he held to the sins of Jeroboam the son of Nebat, who made Israel sin, and did not turn from them.
  - range: 4-12
    heading: Moab rebels, and the kings run out of water
    plain: |
      Mesha king of Moab bred sheep, and he paid the king of Israel a hundred thousand lambs and a hundred thousand rams, with their wool. But when Ahab died, the king of Moab rebelled against the king of Israel. So King Jehoram went out from Samaria at that time and mustered all Israel. He sent word to Jehoshaphat king of Judah: “The king of Moab has rebelled against me. Will you go with me to fight Moab?” Jehoshaphat answered, “I will go. I am as you are, my people as your people, my horses as your horses.” He asked, “Which way shall we go up?” and Jehoram answered, “By the road through the wilderness of Edom.”

      So the king of Israel, the king of Judah and the king of Edom set out. They made a roundabout march of seven days, and there was no water for the army or for the animals with them. The king of Israel cried, “Alas! The LORD has called these three kings together only to hand them over to Moab!” But Jehoshaphat said, “Is there no prophet of the LORD here, through whom we may ask the LORD?” One of the king of Israel's servants answered, “Elisha the son of Shaphat is here, who used to pour water on Elijah's hands.” Jehoshaphat said, “The word of the LORD is with him.” So the king of Israel, Jehoshaphat and the king of Edom went down to him.
  - range: 13-20
    heading: Elisha and the water
    plain: |
      Elisha said to the king of Israel, “What have I to do with you? Go to your father's prophets and your mother's prophets.” The king of Israel said, “No, for the LORD has called these three kings together to hand them over to Moab.” Elisha said, “As the LORD of hosts lives, before whom I stand, if I did not respect Jehoshaphat king of Judah, I would not look at you or notice you. But now bring me a musician.” While the musician played, the hand of the LORD came upon Elisha.

      He said, “This is what the LORD says: Make this valley full of pools. For the LORD says: You will see no wind and no rain, yet this valley will be filled with water, and you, your cattle and your other animals will drink. This is an easy thing for the LORD. He will also hand Moab over to you. You will strike every fortified city and every choice city, cut down every good tree, stop up every spring, and ruin every good field with stones.” In the morning, at the time the morning offering was made, water came flowing from the direction of Edom, and the land was filled with water.
  - range: 21-27
    heading: Moab routed, and the sacrifice on the wall
    plain: |
      When all Moab heard that the kings had come to fight them, everyone old enough to bear arms was called up and posted at the border. They rose early in the morning, the sun shone on the water, and across from them the Moabites saw the water as red as blood. “This is blood,” they said. “The kings must have fought and killed one another. Now to the plunder, Moab!” But when they reached the camp of Israel, the Israelites rose and struck them, and they fled. Israel pushed into the land, striking Moab as they went.

      They tore down the cities. Each man threw a stone on every good field until it was covered; they stopped up every spring and cut down every good tree. Only in Kir-haraseth did they leave its stones in place, and the slingers surrounded it and attacked it. When the king of Moab saw that the battle was going against him, he took seven hundred swordsmen to break through to the king of Edom, but they could not. Then he took his eldest son, who was to reign after him, and offered him as a burnt offering on the wall. And great wrath came against Israel; they withdrew from him and went back to their own land.

notes:
  - ref: 2
    phrase: he put away the image of Baal that his father had made
    kind: history
    title: The pillar of Baal
    body: |
      The “image of Baal” that Jehoram removed was a standing stone, not a statue. The Hebrew word, *maṣṣēbâ*, names a stone or stele set up for worship. From Deuteronomy through 2 Kings such stones are usually condemned, set beside foreign altars that the righteous are to destroy or raised by wicked kings, and the King James often renders the word “image,” as it does here. This one was Ahab's own, set up in the Samaria where he had built Baal a house and an altar ([[1 Kgs. 16:32]]).

      Removing it is why Jehoram is judged less evil than his father and his mother, Jezebel, but it did not end the worship. Baal still had a house in Samaria full of worshippers when Jehu came to the throne, and Jehu “brought forth the images out of the house of Baal, and burned them” ([[2 Kgs. 10:26]]). What Jehoram kept was the sin that Kings lays on king after king of Israel, the calves Jeroboam set up at Bethel and Dan, of which the text says “this thing became a sin” ([[1 Kgs. 12:30]]).
    sources: [sc-knowhy-870, lds-scriptures]

  - ref: 7
    phrase: I am as thou art, my people as thy people, and my horses as thy horses
    kind: history
    title: Why Judah and Edom marched with Israel
    body: |
      Jehoshaphat had reasons of his own to march. He had kept friendly relations with Ahab and wanted to keep them with Ahab's son, and Moab had attacked Judah too ([[2 Chr. 20:1]]). Going round through Edom added Edomite soldiers, since Edom was subject to Judah, and let the allies come at Moab from the hardest direction, where they were least expected. Edom at this time had “no king … a deputy was king” ([[1 Kgs. 22:47]]), so the “king of Edom” of verse 9 was likely a client ruler under Jehoshaphat, much as Mesha had been under Israel.

      Jehoshaphat answers with the words he had given Ahab before Ramoth-gilead (see [[1 Kgs. 22:4]] and the note there on the alliance and what it cost Judah). In Hebrew the pledge is six short words with matched sounds, which may mark it as a set formula for sealing an alliance.
    sources: [ot-manual-6, ot-minute-2-kings-3, lds-scriptures]

  - ref: 11
    phrase: which poured water on the hands of Elijah
    kind: words
    title: The man who poured water on Elijah's hands
    body: |
      To pour water on someone's hands was a servant's work: a servant poured water over his master's hands after a meal to wash them. The phrase means simply that Elisha had been Elijah's servant and disciple. That is how Jehoram's servant describes him, not yet by any deed of his own but by the master he had served. When Elijah called him from the plough, Elisha “went after Elijah, and ministered unto him” ([[1 Kgs. 19:21]]), and this verse suggests that the ministering was physical as well as spiritual.

      For Jehoshaphat it is enough. “The word of the LORD is with him,” he says (verse 12), and the three kings go down to the prophet instead of sending for him.
    sources: [ot-manual-6, ot-minute-2-kings-3, lds-scriptures]

  - ref: 15
    phrase: But now bring me a minstrel
    kind: history
    title: Why Elisha called for a minstrel
    body: |
      Elisha called for a musician to quiet his own anger before he sought the LORD for the kings. He had just refused Jehoram, sending him to his father's and his mother's prophets and saying that only Jehoshaphat's presence kept him from turning away (verses 13–14).

      The verse says the word came: “when the minstrel played … the hand of the LORD came upon him.” The music seems to have brought him into a state of mind in which the word of the LORD could come to him. Music had worked on Saul in the same two ways, when David's playing eased the evil spirit that troubled him and when the Spirit of the LORD came on him among the prophets and he prophesied (see [[1 Sam. 10:5]] and the note there on music among the prophets). The word Elisha then gives is for all three kings, and it is a word of rescue.
    sources: [scripture-helps-2-kings-2, ot-minute-2-kings-3, lds-scriptures]

  - ref: 22
    phrase: the Moabites saw the water on the other side as red as blood
    kind: history
    title: Water that looked like blood
    body: |
      The water that saved the allies is the water that drew Moab to its defeat. The valley was a wadi, a seasonal streambed dry most of the year. Elisha's “Make this valley full of ditches” (verse 16) can be read either as an order to dig pits that would then fill, or as a promise that pools would stand in the wadi; either way the water was to come with no wind or rain anyone could see (verse 17). It came “by the way of Edom” at the hour of the morning offering (verse 20). One older reading explains it as rain that fell far off in the mountains of Edom and ran down the wadi: the LORD, “as He had predicted through His prophet,” made the forces of nature He had ordained work as He had said.

      At sunrise the Moabites at the border saw the pools red. Low sunlight on water standing in reddish earth would account for the color, or the red rocks reflected in the pools. What Moab could not account for was water at all: they knew the wadi was dry and had seen no rain. So they took it for blood, and supposed that the allies, Israel and Judah with their old rivalry and Edom a forced partner, had fallen on one another. They came for the spoil and met an army ready for battle (verse 24).
    sources: [ot-minute-2-kings-3, keil-kings]

  - ref: 27
    phrase: there was great indignation against Israel
    kind: history
    title: The son on the wall, and wrath against Israel
    body: |
      Mesha's last act was a sacrifice to his own god. When he could not break out of Kir-haraseth, he took the son who was to reign after him and burned him as an offering on the wall, in full view of the besiegers. The offering was to Chemosh, the god of Moab, not to the LORD, and Chemosh was often offered human sacrifice to appease his anger; in his desperation Mesha was trying to win the god's favor. The Law forbade the giving of children to a god ([[Lev. 18:21]]).

      The text says only that wrath came against Israel and the allies went home. With the heir dead, Israel lifted the siege, “perhaps feeling that Moab's power as a nation had ended,” and that was a mistake: Moabite bands were raiding Israel again in Elisha's last years ([[2 Kgs. 13:20]]).

      The word translated “indignation,” *qeṣep*, means wrath, and it is nearly always used of God's wrath against those who offend Him. Older commentaries divide over it here. One takes it in that sense: the abomination Israel had driven Mesha to brought God's judgment on Israel, felt in conscience or in some visible sign. Another finds it hard to see how Israel could be blamed, since the LORD had promised the victory and they could neither foresee the sacrifice nor stop it, and takes the wrath to be human: the allies' grief at having shared in so disastrous a war. Either way, what Elisha had foretold was done (verses 24–25 answer verse 19), but Moab was not brought back under tribute.

      Mesha told the story his own way. A basalt stele found at Diban in Moab, now in the Louvre, carries thirty-four lines in Moabite, a dialect very close to Hebrew. It was carved shortly after 842 BC for a sanctuary to Chemosh, and it tells how Mesha took back from Israel much of Moab's land, explaining Israel's earlier rule over Moab as the anger of Chemosh against his own people. It is among the oldest mentions of biblical people outside the Bible (the note at [[1 Kgs. 16:24]] gives what it says of Omri).
    sources: [ot-manual-6, bdb, keil-kings, cambridge-kings, ot-minute-2-kings-3, louvre-mesha-stele, lds-scriptures]

christ: |
  No words of Elisha about the Savior are recorded, but his ministry and miracles testify of Christ as “powerful manifestations of the Lord's life-giving, nourishing, and healing power.” In this chapter that power fills a dry valley with water for three armies and their animals, at the word of the God whom Jehoshaphat insisted on consulting: the God of Israel, who as the risen Christ said, “I am he that gave the law, and I am he who covenanted with my people Israel” ([[3 Ne. 15:5]]).

  The Lord gave Elisha words about things that seemed unlikely to happen, and He fulfilled them; He fulfills in the same way the words He gives through His prophets now (see [[D&C 1:38]] and the Witness of Christ for [[2 Kgs. 7]]).

explore: |
  - **Moab in the prophets.** [[Isa. 15–16]], with Kir-haraseth at [[Isa. 16:7]], and [[Jer. 48]].
  - **Jehoshaphat and Moab in Chronicles.** [[2 Chr. 20]], where Moab and Ammon invade Judah and singers go out before Jehoshaphat's army.
  - **Elisha's next miracles.** [[2 Kgs. 4]], the widow's oil, the Shunammite's son and the hundred men fed.

