chapter: 20
title: I Have Heard Thy Prayer
tagline: Hezekiah, sick unto death, prays and is given fifteen years, and the shadow goes back on the dial of Ahaz; then envoys come from Babylon, he shows them everything, and Isaiah foretells that all of it will be carried there.
when: 'Hezekiah''s fourteenth year, with fifteen years still to reign, to his death after twenty-nine years'

setting: |
  Chapter 20 closes Hezekiah's reign with two stories Isaiah also tells, his illness and the envoys from Babylon, and then with the formula with which Kings closes a reign. Verses 1–19 run with [[Isa. 38]]–39, which this site has already explained. Kings leaves out the psalm of thanksgiving Hezekiah wrote after he recovered ([[Isa. 38:9–20]]) and keeps several details Isaiah lacks; the notes here stay with those.

  “In those days” is not a date, but the numbers place the illness. Hezekiah reigned twenty-nine years ([[2 Kgs. 18:2]]) and was given fifteen more (verse 6), so he fell ill in his fourteenth year, the year Sennacherib invaded ([[2 Kgs. 18:13]]). The promise “I will deliver thee and this city out of the hand of the king of Assyria” (verse 6) speaks of a rescue still to come, so the illness most likely came before the deliverance of chapter 19, as the setting of [[Isa. 38]] explains; one older commentary reads the promise instead as protection against Assyria's return and puts the illness soon after the defeat. Kings, like Isaiah, tells the story after the deliverance, where it leads into the embassy from Babylon (dated in the setting of [[Isa. 39]]) and Isaiah's word that Judah's treasure would be carried there (verse 17), fulfilled in [[2 Kgs. 24:13]].

thread: |
  The chapter is about a gift and what came of it. Hezekiah is under sentence of death; he prays and weeps; and the answer comes before Isaiah is out of the court: fifteen years, a cure by the third day, and the city saved. The sign he chose was the harder one: the shadow going back on the dial.

  Then the gift is tested. The king of Babylon sends letters and a present “for he had heard that Hezekiah had been sick” (verse 12): the healing is what brings the envoys, and Hezekiah shows them every treasure he has. Chronicles, telling the same years, says that after his healing Hezekiah “rendered not again according to the benefit done unto him; for his heart was lifted up” ([[2 Chr. 32:25]]), and that in the business of the envoys “God left him, to try him, that he might know all that was in his heart” ([[2 Chr. 32:31]]). Isaiah's answer is that the treasure, and sons of Hezekiah's line, will go to Babylon. The last verse names the son who succeeded him, Manasseh, the king for whose sins, Kings will say, Judah was removed out of the LORD's sight ([[2 Kgs. 24:3]]).

sections:
  - range: 1-7
    heading: Sick unto death
    plain: |
      In those days Hezekiah became deathly ill. The prophet Isaiah son of Amoz came to him and said, “This is what the LORD says: Put your house in order, for you are going to die; you will not recover.” Hezekiah turned his face to the wall and prayed to the LORD: “Please, LORD, remember how I have walked before You faithfully and with a whole heart, and have done what is good in Your sight.” And Hezekiah wept bitterly. Before Isaiah had gone out of the middle court, the word of the LORD came to him: “Go back and tell Hezekiah, the leader of My people, This is what the LORD, the God of your father David, says: I have heard your prayer; I have seen your tears. I will heal you. On the third day you will go up to the house of the LORD. I will add fifteen years to your life, and I will deliver you and this city from the hand of the king of Assyria. I will defend this city for My own sake and for the sake of My servant David.” Then Isaiah said, “Bring a cake of figs.” They brought it and laid it on the boil, and he recovered.
  - range: 8-11
    heading: The shadow goes back
    plain: |
      Hezekiah had asked Isaiah, “What will be the sign that the LORD will heal me, and that I will go up to the house of the LORD on the third day?” Isaiah answered, “This is the sign the LORD gives you that He will do what He has promised: shall the shadow go forward ten steps, or go back ten steps?” Hezekiah answered, “It is easy for the shadow to lengthen ten steps. No, let the shadow go back ten steps.” So Isaiah the prophet called on the LORD, and the LORD brought the shadow back the ten steps it had gone down on the stairway of Ahaz.
  - range: 12-19
    heading: The envoys from Babylon
    plain: |
      At that time Berodach-baladan son of Baladan, king of Babylon, sent letters and a present to Hezekiah, because he had heard that Hezekiah had been ill. Hezekiah received the envoys and showed them his whole storehouse: the silver, the gold, the spices and the fine oil, his armory, and everything in his treasuries. There was nothing in his palace or in all his realm that Hezekiah did not show them. Then Isaiah the prophet came to King Hezekiah and asked, “What did these men say? Where did they come from?” Hezekiah said, “They came from a distant country, from Babylon.” Isaiah asked, “What have they seen in your palace?” Hezekiah answered, “They have seen everything in my palace. There is nothing among my treasures that I did not show them.” Then Isaiah said to Hezekiah, “Hear the word of the LORD: The days are coming when everything in your palace, and all that your fathers have stored up until this day, will be carried off to Babylon. Nothing will be left, says the LORD. And some of your own descendants, born to you, will be taken away, and they will be eunuchs in the palace of the king of Babylon.” Hezekiah said to Isaiah, “The word of the LORD you have spoken is good.” For he thought, “Is it not good, if there will be peace and security in my lifetime?”
  - range: 20-21
    heading: The end of Hezekiah's reign
    plain: |
      The rest of Hezekiah's acts, all his might, and how he made the pool and the conduit and brought water into the city, are written in the book of the chronicles of the kings of Judah. Hezekiah rested with his fathers, and his son Manasseh reigned in his place.

notes:
  - ref: 4
    phrase: afore Isaiah was gone out into the middle court
    kind: words
    title: The middle court, or the middle of the city
    body: |
      The Hebrew text has two readings of where Isaiah was when the answer came, and both make the same point: it came almost at once. The consonants written in the text (the *ketiv*, the text as written) say *hāʿîr*, “the city,” so that Isaiah was in the middle of the city; the word the scribes marked to be read aloud instead (the *qere*, the reading) is *ḥāṣēr*, “court.” The King James follows the qere, as the Septuagint already had: “Esaias was in the middle court.”

      Read as “court,” Isaiah had not yet crossed the middle court; read as “city,” he had gone no farther than the middle of Jerusalem. Either way the prophet who had just pronounced the sentence was sent back with a second word before he had gone far.
    sources: [oshb-wlc, lxx-rahlfs]

  - ref: 5
    phrase: tell Hezekiah the captain of my people
    kind: scripture
    title: What Kings adds to the promise
    body: |
      Kings gives the LORD's answer more fully than [[Isa. 38:5–6]] does, and three things are only here. Hezekiah is called “the captain of my people,” Hebrew *nāgîd*, the title the LORD gave Saul when He told Samuel to anoint him “to be captain over my people Israel” ([[1 Sam. 9:16]]). The healing has a date: “on the third day thou shalt go up unto the house of the LORD.” Isaiah leaves the words out but presupposes them, since his Hezekiah asks for a sign “that I shall go up to the house of the LORD” ([[Isa. 38:22]]; the note there takes up the third day).

      And where Isaiah's verse ends “I will defend this city,” Kings gives the reason: “for mine own sake, and for my servant David's sake” (verse 6), the words Isaiah had sent the king when Sennacherib's army threatened the city ([[2 Kgs. 19:34]]). The king's life and the city's rescue come in one promise, and both are given for David's sake.
    sources: [oshb-wlc, lds-scriptures]

  - ref: 6
    phrase: I will add unto thy days fifteen years
    kind: prophets
    title: Fifteen years added
    body: |
      President Spencer W. Kimball read the fifteen years as a true exception: “I believe we may die prematurely but seldom exceed our time very much. One exception was Hezekiah.” Told by a prophet to set his house in order, Hezekiah wept and prayed, and “the Lord yielded unto his prayers.” Beside those words belongs the revelation that the one who “hath faith in me to be healed, and is not appointed unto death, shall be healed” ([[D&C 42:48]]).

      The First Presidency drew on the same story in 1905 to explain a warning that did not come to pass. [[D&C 85:7]] had warned that “one mighty and strong” would take Bishop Edward Partridge's place, and they likened it to Hezekiah's case: the king was told he would die, and the sentence was rescinded when he prayed. Since Partridge repented, the threatened judgment passed in the same way. How a pronounced sentence can be revised is explained at [[Isa. 38:5]].
    sources: [ot-manual-12, sc-knowhy-804, lds-scriptures]

  - ref: 10
    phrase: It is a light thing for the shadow to go down ten degrees
    kind: symbol
    title: Why the shadow had to go back
    body: |
      Only Kings tells that Hezekiah chose his sign. Isaiah's words appear to offer it either way, forward ten steps or back (though Hezekiah may have heard them as a question rather than an offer, and answered that only a backward shadow would be a sure sign), and Hezekiah calls going forward “a light thing.” The point seems to be that a shadow suddenly jumping ahead in the direction it was already moving might pass for something natural, while going back would reverse the order of nature. In [[Isa. 38:8]] the LORD simply announces the backward shadow.

      One older reading finds the sign fitted to what it confirmed: the promise was a life lengthened against the natural course of things, and the shadow going back showed a life that had reached its natural close being put back by the LORD to run on for more years. Kings adds that “Isaiah the prophet cried unto the LORD” (verse 11): the prophet asked, and the LORD moved the shadow. What the “dial of Ahaz” was, and Mormon's word that when the sun seems to go back “it is the earth that moveth and not the sun” ([[Hel. 12:15]]), are at [[Isa. 38:8]].
    sources: [cambridge-kings, keil-kings, lds-scriptures]

  - ref: 12
    phrase: Berodach-baladan, the son of Baladan, king of Babylon
    kind: scripture
    title: The rest is Isaiah 39
    body: |
      Kings tells the embassy of verses 12–19 almost word for word as [[Isa. 39]] does, where the notes explain who Merodach-baladan was, what was wrong with showing everything ([[Isa. 39:2]]), and the prophecy that followed; Kings differs in three small ways.

      Kings spells the king “Berodach”; Isaiah's “Merodach” is the more correct form of the name, the two lip sounds b and m being easily exchanged. Kings says Hezekiah “hearkened unto them” (verse 13) where Isaiah says he “was glad of them” ([[Isa. 39:2]]). The two Hebrew verbs, *wayyišmaʿ* and *wayyiśmaḥ*, differ in their consonants by one letter, and older commentaries judge Isaiah's the original reading: many manuscripts and the Septuagint read “he rejoiced” even in Kings. And Kings gives Hezekiah's last words as a question, “Is it not good, if peace and truth be in my days?” (verse 19), where Isaiah has a statement; the note at [[Isa. 39:8]] weighs what he meant.
    sources: [cambridge-kings, keil-kings, lds-scriptures]

  - ref: 20
    phrase: how he made a pool, and a conduit, and brought water into the city
    kind: history
    title: Hezekiah’s tunnel
    body: |
      The conduit is the tunnel that still runs beneath the City of David. Hezekiah's workmen cut it through the limestone, about 1,770 feet by one measurement (a recent study gives 643 meters, about 2,100 feet), to carry the water of the Gihon spring, outside the walls on the city's eastern side, to the pool of Siloam inside them ([[2 Chr. 32:30]]). Two crews dug from opposite ends, following natural fissures in the rock, until they met. The work is estimated to have taken at least four years, and an inscription carved near the Siloam end tells the moment when the cutters, each hearing “the voice of the other who called his neighbor,” struck “pick to pick, and there flowed the waters to the pool.”

      It was built against Assyria. The water had to reach the growing population of the western hill, and a city with its spring inside the walls could hold out through a long siege. Such fortifications gave Jerusalem a name for being impregnable that lasted into Lehi's day. Isaiah did not fault the engineering but the trust placed in it, the preoccupation with physical preparation rather than trust in the Lord; his charge is at [[Isa. 22:11]].
    sources: [bd-hezekiahs-tunnel, pierce-israelite-refugees, sc-knowhy-451, lds-scriptures]

christ: |
  [[Isa. 38]] sets Hezekiah's prayer with tears beside the Savior, who “offered up prayers and supplications with strong crying and tears unto him that was able to save him from death, and was heard” ([[Heb. 5:7]]; see the note at [[Isa. 38:5]]). The LORD who told Hezekiah, “I have heard thy prayer, I have seen thy tears,” is the Lord who hears that way still.

  A disciple's days are in His hands: healing is promised to the one with faith who “is not appointed unto death” ([[D&C 42:48]]; see the note at verse 6). Hezekiah vowed to spend the years given back in praise, “The living, the living, he shall praise thee, as I do this day” ([[Isa. 38:19]]), and the same years held his pride and his humbling ([[2 Chr. 32:25–26]]).

explore: |
  - **Hezekiah's psalm.** [[Isa. 38:9–20]], the thanksgiving Kings leaves out, with its notes on this site.
  - **The Chronicler's account.** [[2 Chr. 32:24–33]]: the illness, the heart lifted up and humbled, God leaving him “to try him” when the envoys came, and the watercourse of Gihon.
  - **Hezekiah's Jerusalem.** [“The Experience of Israelite Refugees”](https://rsc.byu.edu/covenant-compassion/experience-israelite-refugees), a Religious Studies Center study of the Broad Wall, the tunnel, and the northern refugees who very likely dug it.

parallels:
  - ref: Isa. 38:1–8, 21–22
    note: The illness, the healing and the sign, with Hezekiah's psalm between (38:9–20).
  - ref: Isa. 39
    note: The envoys from Babylon, nearly word for word.
  - ref: 2 Chr. 32:24–33
    note: The Chronicler's summary, which adds that Hezekiah's heart was lifted up and that he humbled himself.

