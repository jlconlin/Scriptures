chapter: 1
title: The Word of the LORD Which Elijah Had Spoken
tagline: King Ahaziah, injured in a fall, sends to a Philistine god to ask whether he will live; the LORD sends Elijah with the answer instead, and the king who tries to bring the prophet in by force dies as the word said.
when: 'After the death of Ahab ([[2 Kgs. 1:1]]), in the two-year reign of his son Ahaziah over Israel ([[1 Kgs. 22:51]])'

setting: |
  Ahaziah was the son of Ahab. He reigned over Israel in Samaria for two years, walked “in the way of his father, and in the way of his mother,” and “served Baal, and worshipped him” ([[1 Kgs. 22:51–53]]). The break between 1 and 2 Kings falls in the middle of his short reign: Kings was one book in Hebrew (see the setting of [[1 Kgs. 1:1]]), and this chapter finishes the account that began at the end of 1 Kings 22.

  The chief events of the reign were a joint venture at sea with Jehoshaphat ([[2 Chr. 20:35–37]]) and the revolt of Moab that opens this chapter. Moab's revolt is told in [[2 Kgs. 3]]; here it is a single line.

  The chapter comes just before Elijah is taken up in [[2 Kgs. 2]]. The king's messengers set out for Ekron and never arrive. Elijah meets them on the road, sends them back with the LORD's answer, and then faces the soldiers the king sends to bring him in. The prophecy of the chapter is fulfilled inside the chapter: the king dies “according to the word of the LORD which Elijah had spoken” (verse 17).

thread: |
  The chapter turns on one question, asked three times. When Ahaziah sends to Ekron, the angel of the LORD gives Elijah the words to say: “Is it not because there is not a God in Israel, that ye go to inquire of Baal-zebub?” (verse 3). The messengers repeat it to the king (verse 6), and Elijah says it to his face at the end (verse 16), this time with the words “to inquire of his word.” The king's question was whether he would recover, and he took it to a foreign idol.

  The rest of the chapter shows that there is a God in Israel, and that His prophet does not come at a king's command. The king answers the prophecy by sending soldiers, and two captains order the “man of God” to come down at the king's command; fire from heaven shows who he is. The third captain kneels and asks for his life, and only then, at the angel's word, does Elijah go down, to tell the king to his face what he had already sent him by messengers. The king dies as the word said, and the throne passes to his brother.

sections:
  - range: 1-8
    heading: Inquire of Baal-zebub
    plain: |
      After Ahab died, Moab rebelled against Israel. Ahaziah fell through the lattice of his upper room in Samaria and lay sick. He sent messengers and told them, “Go and ask Baal-zebub, the god of Ekron, whether I will recover from this sickness.”

      But the angel of the LORD said to Elijah the Tishbite, “Get up, go and meet the messengers of the king of Samaria, and ask them, ‘Is it because there is no God in Israel that you are going to ask Baal-zebub, the god of Ekron?’ So this is what the LORD says: You will not get up from the bed you have gone up to; you will surely die.” And Elijah went.

      The messengers came back to the king, and he asked them, “Why have you come back?” They said, “A man came up to meet us and told us, ‘Go back to the king who sent you and tell him, This is what the LORD says: Is it because there is no God in Israel that you are sending to ask Baal-zebub, the god of Ekron? Therefore you will not get up from the bed you have gone up to; you will surely die.’” The king asked, “What kind of man was he, the one who came up to meet you and told you this?” They said, “A hairy man, with a leather belt around his waist.” And the king said, “It is Elijah the Tishbite.”
  - range: 9-16
    heading: Three captains of fifty
    plain: |
      Then the king sent a captain with his fifty men to Elijah. The captain went up to him where he was sitting on the top of a hill and said, “Man of God, the king says, Come down.” Elijah answered the captain, “If I am a man of God, let fire come down from heaven and consume you and your fifty.” And fire came down from heaven and consumed him and his fifty.

      The king sent another captain with his fifty. He said to Elijah, “Man of God, this is the king's order: Come down at once.” Elijah answered, “If I am a man of God, let fire come down from heaven and consume you and your fifty.” And the fire of God came down from heaven and consumed him and his fifty.

      The king sent a third captain with his fifty. This captain went up, fell on his knees before Elijah, and pleaded with him: “Man of God, please let my life and the lives of these fifty men, your servants, be precious to you. Fire has come down from heaven and burned up the first two captains and their fifties; but now let my life be precious to you.” The angel of the LORD said to Elijah, “Go down with him; do not be afraid of him.” So Elijah got up and went down with him to the king.

      He said to the king, “This is what the LORD says: Because you sent messengers to ask Baal-zebub, the god of Ekron, as if there were no God in Israel whose word you could ask, you will not get up from the bed you have gone up to; you will surely die.”
  - range: 17-18
    heading: According to the word of the LORD
    plain: |
      So Ahaziah died, as the LORD had said through Elijah. Because he had no son, Jehoram became king in his place, in the second year of Jehoram the son of Jehoshaphat king of Judah. The rest of what Ahaziah did is written in the book of the chronicles of the kings of Israel.

notes:
  - ref: 2
    phrase: inquire of Baal-zebub the god of Ekron
    kind: history
    title: Baal-zebub, the god of Ekron
    body: |
      Baal-zebub was a Philistine god, worshipped at Ekron, and his name means Baal, or lord, of the fly. In the story the point is plain enough: a sick king of Israel sends to the idol of a Philistine town to learn whether he will live.

      Ekron was the northernmost of the Philistine towns. The LORD's question in the next verse names what the errand meant: Ahaziah, who served Baal as his father and mother had ([[1 Kgs. 22:52–53]]), sent past the God of Israel to a foreign god.

      The name lived on. In the New Testament Beelzebub is a title for Satan, the chief of the demons. The Pharisees used it to explain away Jesus' miracles, “This fellow doth not cast out devils, but by Beelzebub the prince of the devils” ([[Matt. 12:24]]), and Jesus denied that the power He used was Beelzebub's.
    sources: [strongs-concordance, bd-ekron, bd-beelzebub]

  - ref: 8
    phrase: He was an hairy man, and girt with a girdle of leather about his loins
    kind: symbol
    title: A hairy man
    body: |
      “An hairy man” is best taken of Elijah's clothing, not his head: the prophet was dressed in a rough garment, probably of goat's or camel's hair, and perhaps in an animal's skin with the hair still on it (compare [[Heb. 11:37]]). The Hebrew is *baʿal śēʿār*, literally “owner of hair,” the idiom by which Hebrew describes a person by what marks him, as a “dreamer” is an owner of dreams ([[Gen. 37:19]]).

      The king knew from that description who had met his messengers. Zechariah speaks of the day when false prophets will no longer “wear a rough garment to deceive” ([[Zech. 13:4]]), so a garment of hair was what a prophet was known by. John the Baptist, who came “in the spirit and power of Elias” ([[Luke 1:17]]), was dressed the same way, in camel's hair with a leather girdle about his loins ([[Mark 1:6]]).
    sources: [ot-manual-5, bdb]

  - ref: 10
    phrase: If I be a man of God, then let fire come down from heaven
    kind: history
    title: Why the fire fell on the captains
    body: |
      All three captains came on the same errand, to bring the prophet to the king, whose purpose was evidently to arrest and punish him, yet only the first two died (verses 13–15). The difference the text shows is in how they came. Each of the first two called Elijah “man of God” and in the same breath ordered him to come down at the king's word, and the second added “quickly” (verse 11). The third gave no order; he fell on his knees and asked for his life. In one older reading, the title in the first two mouths was mockery, and the summons to hand himself over as a prisoner was contempt both for the prophet's office and for the LORD who stood behind it.

      The fire was the LORD's, not Elijah's: “God alone could send the fire; and as he is just and good, he would not have destroyed these men had there not been a sufficient cause.” On that explanation Elijah's words are a declaration rather than a curse: “If I be a man of God” means “as surely as I am a man of God,” fire will come down. Another older reading hears a prayer, that God would show that His servants and His message are not lightly despised. Either way, the second time the text names it “the fire of God” (verse 12).
    sources: [cambridge-kings, keil-kings, ot-manual-5]

  - ref: 16
    phrase: is it not because there is no God in Israel to inquire of his word
    kind: words
    title: Is it because there is no God in Israel?
    body: |
      The question asks whether the king sends to Ekron because Israel has no God. In verses 3 and 6 the King James words it “is it not because there is not a God in Israel,” which a modern reader can hear as saying the opposite. The Septuagint puts it plainly, “Is it because there is no God in Israel,” and that is how the verses read in context: Ahaziah acted as though Israel had no God to ask.

      The third time, at the king's bedside, Elijah adds what the king had passed over: a God in Israel “to inquire of his word.” Ahaziah had sent to ask one thing, whether he would recover (verse 2). The God he did not ask answered him anyway, three times, by the angel, by the messengers and by the prophet in person, and the answer did not change.
    sources: [lxx-rahlfs, lds-scriptures]

  - ref: 17
    phrase: And Jehoram reigned in his stead in the second year of Jehoram the son of Jehoshaphat king of Judah
    kind: history
    title: Two kings named Jehoram
    body: |
      Two kings named Jehoram reigned at the same time, one in Israel and one in Judah, and Judah's Jehoram had a son named Ahaziah, like the king who dies in this chapter. The Jehoram who succeeds here is another son of Ahab, “Jehoram the son of Ahab” ([[2 Kgs. 3:1]]), since Ahaziah had no son. The other is Jehoram the son of Jehoshaphat, king of Judah, who “walked in the way of the kings of Israel, as did the house of Ahab: for the daughter of Ahab was his wife” ([[2 Kgs. 8:18]]); his son was another Ahaziah, who began to reign “in the twelfth year of Joram the son of Ahab king of Israel” ([[2 Kgs. 8:25]]). Kings also spells the northern king's name Joram, and dates the southern Jehoram's accession “in the fifth year of Joram the son of Ahab king of Israel” ([[2 Kgs. 8:16]]).

      The text dates the northern Jehoram's accession two ways: here, in the second year of Jehoram of Judah, and in [[2 Kgs. 3:1]], in the eighteenth year of Jehoshaphat. This note does not try to reconcile them; the dates that different sources give for the kings are set side by side in [Two Kingdoms and Assyria](/old-testament/guides/two-kingdoms-and-assyria/#rulers).
    sources: [lds-scriptures]

christ: |
  Centuries later, when a Samaritan village would not receive Jesus, James and John asked, “Lord, wilt thou that we command fire to come down from heaven, and consume them, even as Elias did?” ([[Luke 9:54]]). He turned and rebuked them: “Ye know not what manner of spirit ye are of. For the Son of man is not come to destroy men's lives, but to save them” ([[Luke 9:55–56]]). The rebuke fell on the disciples who wanted to copy Elijah, not on Elijah. One older reading explains the difference: the fire fell under the law, and what Elijah did then is not a pattern for disciples under the gospel.

  A disciple's zeal for the Lord's honor takes its shape from the Lord's own errand, to save lives and not destroy them. The question of the chapter still stands as well: there is a God in Israel to inquire of, and His word, sought or unsought, is the one that holds.

explore: |
  - **Elijah's last days.** [[2 Kgs. 2]], where he is taken up and his mantle passes to Elisha.
  - **Fire from heaven.** Carmel, where the fire of the LORD fell on Elijah's sacrifice ([[1 Kgs. 18:38]]), and [[Luke 9:51–56]], where Jesus refuses to call it down.
  - **Elijah and John the Baptist.** [[Mal. 4:5–6]], [[Luke 1:17]] and [[Matt. 11:14]], with [[Mark 1:6]] for the dress.

