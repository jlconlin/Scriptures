chapter: 7
title: According to the Word of the LORD
tagline: Elisha promises flour and barley at a shekel in the gate of Samaria by the next day, and the king's officer scoffs; four lepers find the Syrian camp deserted, the LORD having made the army hear chariots and horses, and the price falls as Elisha said while the officer is trampled in the gate.
when: 'In the reign of Jehoram son of Ahab king of Israel (the chapter does not name him), at the end of Ben-hadad''s siege of Samaria'

setting: |
  Chapter 7 finishes the story that began at [[2 Kgs. 6:24]]. Ben-hadad's army has shut Samaria in, the famine has reached the prices of 6:25 and the mothers of 6:28, and the king, in sackcloth, has sworn to have Elisha's head and then gone down to the prophet's house in despair: why wait for the LORD any longer ([[2 Kgs. 6:33]], where the note explains who said it). Chapter 7 opens with Elisha's reply to that question.

  The king is most likely Jehoram, Ahab's son ([[2 Kgs. 3:1]]); chapter 6's setting explains why. Samaria stood on a hill with steep slopes, and the Syrian camp lay below it, so the lepers at the gate had to go down to reach it, and the scouts followed the fleeing army to the Jordan (verse 15).

thread: |
  The chapter turns on a word spoken and a word kept. Elisha's promise in verse 1 sounds impossible, and a royal officer says so. Elisha's answer to him in verse 2 then becomes a second prophecy. The rest of the chapter is told so that both come true to the letter, and the narrator stops to say so three times: “according to the word of the LORD” (verse 16), “as the man of God had said” (verse 17), “as the man of God had spoken” (verse 18). It belongs beside the Shunammite's promised son ([[2 Kgs. 4:16]]): both are prophecies of things that seemed unlikely, which the Lord fulfilled.

  How the LORD keeps His word is told as the mirror of chapter 6. There the servant was shown chariots of fire he could not see, and the Syrian raiders were led where they could not see they were going; here the Syrian army hears the sound of chariots and runs. The news is carried not by the king or the prophet but by four lepers who were living outside the gate, and the one man who doubted sees the plenty and dies in the gate before he can eat it.

sections:
  - range: 1-2
    heading: Flour for a shekel by tomorrow
    plain: |
      Elisha said, “Hear the word of the LORD. This is what the LORD says: About this time tomorrow a measure of fine flour will sell for a shekel, and two measures of barley for a shekel, in the gate of Samaria.” The officer on whose arm the king leaned answered the man of God, “Look, even if the LORD opened windows in the sky, could this happen?” Elisha said, “You will see it with your own eyes, but you will not eat any of it.”
  - range: 3-11
    heading: The lepers find the camp empty
    plain: |
      Four men with leprosy were at the entrance of the gate. They said to one another, “Why sit here until we die? If we say, ‘We'll go into the city,’ the famine is there and we'll die; if we stay here, we'll die too. So let's go over to the Syrian camp. If they spare us, we live; if they kill us, we only die.” At dusk they set out for the Syrian camp, and when they reached its edge, no one was there. The Lord had made the Syrian army hear the sound of chariots and horses, the noise of a great army, and they had said to one another, “The king of Israel has hired the kings of the Hittites and the kings of Egypt to attack us!” So they had got up and fled at dusk, leaving their tents, their horses and their donkeys, the camp just as it was, and run for their lives.

      The lepers came to the edge of the camp, went into one tent, ate and drank, carried off silver, gold and clothing and hid them; then they came back, went into another tent, took more and hid it. Then they said to one another, “We are not doing right. This is a day of good news, and we are keeping it to ourselves. If we wait until morning light, trouble will catch up with us. Come, let's go and tell the king's household.” So they went and called to the gatekeepers of the city and told them, “We went to the Syrian camp, and there was nobody there, not a sound of anyone, only horses tied up, donkeys tied up, and the tents left as they were.” The gatekeepers shouted the news, and it was reported inside the king's palace.
  - range: 12-15
    heading: The king suspects a trap
    plain: |
      The king got up in the night and said to his officers, “I'll tell you what the Syrians have done. They know we are starving, so they have left the camp to hide in the countryside, thinking, ‘When they come out of the city, we will take them alive and get into the city.’” One of his officers answered, “Let some men take five of the horses still left in the city (they are like all the people of Israel still left here, like all the Israelites who are perishing), and let us send them to see.” So they took two chariot horses, and the king sent them after the Syrian army, saying, “Go and find out.” They followed them as far as the Jordan, and the whole road was strewn with clothing and equipment the Syrians had thrown away in their haste. The messengers came back and told the king.
  - range: 16-20
    heading: The word fulfilled
    plain: |
      Then the people went out and plundered the Syrian camp. So a measure of fine flour sold for a shekel, and two measures of barley for a shekel, as the LORD had said. The king had put the officer on whose arm he leaned in charge of the gate, and the people trampled him in the gate, and he died, just as the man of God had said when the king came down to him. It happened exactly as the man of God had told the king: “Two measures of barley for a shekel and a measure of fine flour for a shekel will be sold about this time tomorrow in the gate of Samaria.” And the officer had answered the man of God, “Even if the LORD opened windows in the sky, could such a thing happen?” and Elisha had said, “You will see it with your own eyes, but you will not eat any of it.” That is what happened to him: the people trampled him in the gate, and he died.

notes:
  - ref: 1
    phrase: a measure of fine flour be sold for a shekel
    kind: words
    title: A seah of flour for a shekel
    body: |
      Elisha's price is not cheap by ordinary standards; it is unbelievable only beside the famine. The “measure” is a *seah*, about eight pounds of flour, and in normal times a shekel bought far more than that, perhaps a hundred pounds. Set against a donkey's head at eighty pieces of silver ([[2 Kgs. 6:25]], where the note explains the prices), the price could fall that far only if the siege were lifted. So the promise was really a promise that the Syrian army would be gone within a day.
    sources: [ot-minute-2-kings-7]

  - ref: 2
    phrase: if the LORD would make windows in heaven, might this thing be?
    kind: history
    title: Windows in heaven
    body: |
      The officer scoffs with the most extravagant picture he can find: even if the LORD opened windows in the sky, the price could not fall so low. The doubter is no bystander. “A lord on whose hand the king leaned” is the same phrase that describes Naaman's place beside the king of Syria, who leaned on his hand when he went into the house of Rimmon ([[2 Kgs. 5:18]]).

      Elisha answers the scorn with a second prophecy: the officer will see the plenty, but not eat of it. How that came true is told at verse 17.
    sources: [ot-minute-2-kings-7, lds-scriptures]

  - ref: 3
    phrase: four leprous men at the entering in of the gate
    kind: history
    title: Four lepers at the gate
    body: |
      The lepers sat outside the gate because the law of Moses kept them out of the city: a leper was unclean, and “without the camp shall his habitation be” ([[Lev. 13:46]]). So they were trapped near the gate, and their reasoning in verse 4 is the plain arithmetic of men with nothing left: death in the city, death at the gate, and at the Syrian camp at least a chance.

      “Let us fall unto the host of the Syrians” means to defect, to go over to the enemy and give themselves up. The verb also fits the ground: Samaria sat on a steep hill, so the lepers literally went down to the camp.
    sources: [lds-scriptures, ot-minute-2-kings-7, cambridge-kings]

  - ref: 6
    phrase: the Lord had made the host of the Syrians to hear a noise of chariots
    kind: history
    title: A noise of chariots
    body: |
      The LORD routs the army through its ears, as in chapter 6 He worked through eyes. At Dothan the mountain was full of horses and chariots of fire round about Elisha, which his servant could not see until his eyes were opened, and the Syrian raiders could not see that they were being led into Samaria ([[2 Kgs. 6:17]]–20). Here the army sees nothing and hears chariots, horses and “a great host,” and that alone sends it running.

      The Syrians took the sound for mercenaries the king of Israel had hired. The Hittites here are the Canaanite nations north of Palestine, from the Orontes to the Euphrates, as distinct from the Arameans, the Syrians themselves. The Syrian army fled at dusk and left the camp standing, horses and donkeys included. That seems irrational, but the troops holding a siege were likely foot soldiers, not horsemen, whose animals were there to haul supplies, and men who had heard what Elisha could do may have needed only a rumor to panic.
    sources: [ot-minute-2-kings-7, bd-hittites]

  - ref: 9
    phrase: "We do not well: this day is a day of good tidings, and we hold our peace"
    kind: history
    title: We do not well
    body: |
      The lepers feed themselves first, then their consciences catch up with them. They have eaten, drunk and twice hidden silver, gold and clothing before they stop and say that they are doing wrong. On one older reading, the duty they had neglected was a citizen's: the law shut them out of the city, but they still owed it the news that would save it, and every hour of silence left the city starving.

      “Some mischief will come upon us” means punishment, or as the Revised Version's margin has it, “our iniquity will find us out.” They expected the delay to come to light in the morning and to be punished for it. So the good news reaches the king's house through the city's outcasts, who go no further than the gate and call it in to the gatekeepers.
    sources: [keil-kings, cambridge-kings]

  - ref: 17
    phrase: the people trode upon him in the gate, and he died
    kind: prophets
    title: He saw it but never tasted it
    body: |
      The officer dies exactly as Elisha said, and the narrator tells it twice so that no one misses it. The king had put him in charge of the gate, and the crowd, probably rushing out on the news of food, trampled him there, so that he died in a rush out of the city rather than in a Syrian attack into it. Verses 18–20 then tell the prophecy, the officer's scorn and its end again, almost word for word, without once naming Elisha: he is only “the man of God,” and the word is the LORD's.

      Drawn as a lesson for latter-day hearers, the story makes the Syrians pack animals without knowing it, carrying to God's people what they needed, while the doubting nobleman “saw it but he never tasted it. That is the reward of those who disbelieve the Prophets of God.”
    sources: [ot-minute-2-kings-7, ot-manual-6]

christ: |
  The LORD whose word Elisha spoke is Jehovah, the premortal Jesus Christ, and the chapter shows Him keeping that word to the day and to the price, when nothing the besieged city could see promised it. He says the same of His word in this dispensation: it “shall all be fulfilled, whether by mine own voice or by the voice of my servants, it is the same” ([[D&C 1:38]]). The promises and warnings He gives through living prophets are as sure now as Elisha's were, however unlikely they seem when they are spoken.

explore: |
  - **Another promise that seemed impossible.** [[2 Kgs. 4:8–17]], the Shunammite's son.
  - **The chariots no one could see.** [[2 Kgs. 6:8–23]], the other half of this chapter's pattern.

sources: [lds-scriptures, ot-minute-2-kings-7, cfm-ot-2026-28, ot-manual-6, bd-hittites, bd-jehovah, keil-kings, cambridge-kings]
