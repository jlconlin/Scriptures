chapter: 6
title: They That Be with Us Are More
tagline: Elisha makes a borrowed axe head swim, warns the king of Israel of every Syrian ambush, and when an army surrounds him at Dothan shows his servant the LORD's horses and chariots of fire; he leads the blinded Syrians to Samaria and has them fed and sent home, and then Ben-hadad's siege brings Samaria to famine and the king turns on the prophet.
when: 'In the reign of a king of Israel the chapter does not name, most likely Jehoram son of Ahab, during the wars with Ben-hadad of Syria'

setting: |
  Chapter 6 carries on the cycle of Elisha stories that began when Elijah was taken ([[2 Kgs. 2]]). They are separate accounts, more than likely not in chronological order, and the chapter holds three of them: the axe head at the Jordan (verses 1–7), the Syrian army at Dothan (verses 8–23), and the siege of Samaria, which runs on into chapter 7 (verses 24–33).

  The king of Israel is never named in these stories. He is most likely Jehoram, Ahab's son, who reigned in Samaria ([[2 Kgs. 3:1]]), and Elisha's “son of a murderer” in verse 32 points to that father: Jehoram was the son of Ahab and Jezebel, and the murder meant is most likely Naboth's ([[1 Kgs. 21:13]]). His enemy is the king of Syria (Aram), named in verse 24 as Ben-hadad; the name is explained at [[1 Kgs. 20:1]]. The Syrians already knew Elisha: Naaman had come home healed ([[2 Kgs. 5:14]]). Dothan, where Elisha was staying, lay midway between the Jordan and the Mediterranean; the only other place the Bible names it is where Joseph's brothers sold him ([[Gen. 37:17]]).

thread: |
  The chapter turns on what people can and cannot see. A king of Syria cannot see how his plans keep reaching Israel, and his servant names the reason: Elisha, “the prophet that is in Israel” (verse 12). At Dothan the servant sees only the enemy, and Elisha prays, “open his eyes, that he may see” (verse 17); the horses and chariots of fire were already there. The Syrians are struck blind, led to Samaria, and have their eyes opened in the middle of the enemy's capital, where they are fed instead of killed.

  The siege ends the chapter on the other side of that line. The famine comes to its worst, and the king of Israel, in sackcloth, swears to have Elisha's head. The chapter's last words, the messenger's in the Hebrew but more likely the king's (see the note at verse 33), are that there is no use waiting for the LORD any longer. The answer comes in the next verse, through the prophet he meant to kill: food in the gate of Samaria by the next day ([[2 Kgs. 7:1]]), set against the famine prices of 6:25.

sections:
  - range: 1-7
    heading: The axe head that swam
    plain: |
      The sons of the prophets said to Elisha, “The place where we live with you is too small for us. Let us go to the Jordan, and each of us will take a beam from there, and we will build ourselves a place to live.” He said, “Go.” One of them said, “Please come with your servants.” He answered, “I will come.” So he went with them. When they came to the Jordan, they began cutting down trees. As one of them was felling a beam, the iron axe head fell into the water, and he cried out, “Oh no, master! It was borrowed!” The man of God asked, “Where did it fall?” When he showed him the place, Elisha cut a stick, threw it in there, and made the iron float. “Pick it up,” he said, and the man reached out his hand and took it.
  - range: 8-23
    heading: The army at Dothan
    plain: |
      The king of Syria was at war with Israel. He took counsel with his officers and said, “I will set up my camp in such and such a place.” But the man of God sent word to the king of Israel: “Be careful not to pass that place, because the Syrians are going down there.” So the king of Israel sent men to the place the man of God had warned him about and was on his guard there, not once or twice but many times. The king of Syria was greatly troubled by this. He called his officers and said, “Will you not tell me which of us is on the side of the king of Israel?” One of his officers said, “None of us, my lord the king. But Elisha, the prophet who is in Israel, tells the king of Israel the very words you speak in your bedroom.” The king said, “Go and find out where he is, so that I can send men to seize him.” He was told, “He is in Dothan.” So he sent horses, chariots and a strong force there. They came by night and surrounded the city.

      When the servant of the man of God got up early and went out, an army with horses and chariots was surrounding the city. “Oh no, my master! What shall we do?” the servant asked. Elisha answered, “Don't be afraid. Those who are with us are more than those who are with them.” Then Elisha prayed, “LORD, please open his eyes so that he may see.” The LORD opened the young man's eyes, and he saw the hill full of horses and chariots of fire all around Elisha. As the enemy came down toward him, Elisha prayed to the LORD, “Strike these people with blindness.” He struck them with blindness, as Elisha had asked. Elisha told them, “This is not the road, and this is not the city. Follow me, and I will lead you to the man you are looking for.” And he led them to Samaria. When they had entered Samaria, Elisha said, “LORD, open these men's eyes so that they may see.” The LORD opened their eyes, and they saw that they were in the middle of Samaria. When the king of Israel saw them, he asked Elisha, “My father, shall I kill them? Shall I kill them?” “Do not kill them,” he answered. “Would you kill men you had taken captive with your own sword and bow? Set food and water before them so that they may eat and drink and go back to their master.” So the king prepared a large meal for them, and after they had eaten and drunk he sent them away, and they returned to their master. The raiding bands from Syria stopped coming into Israel's territory.
  - range: 24-33
    heading: Famine in besieged Samaria
    plain: |
      Some time later Ben-hadad king of Syria mobilized his whole army and marched up and laid siege to Samaria. There was a great famine in the city; the siege lasted so long that a donkey's head sold for eighty pieces of silver, and a quarter of a cab of dove's dung for five. As the king of Israel was walking along the wall, a woman cried out to him, “Help me, my lord the king!” He answered, “If the LORD does not help you, where can I get help for you? From the threshing floor, or from the winepress?” Then the king asked her, “What is the matter?” She told him of a pact with another woman to eat their sons one after the other, and that, after the first son had been eaten, the other woman had hidden hers. When the king heard the woman's words, he tore his clothes. As he went along the wall, the people looked, and they saw that underneath he had sackcloth on his body. He said, “May God deal with me, and more, if the head of Elisha son of Shaphat stays on his shoulders today!”

      Elisha was sitting in his house, and the elders were sitting with him. The king sent a man, but before the messenger arrived Elisha said to the elders, “Do you see how this son of a murderer has sent someone to cut off my head? Look: when the messenger comes, shut the door and hold it against him. Isn't the sound of his master's footsteps right behind him?” While he was still speaking, the messenger came down to him, and he said, “This disaster is from the LORD. Why should I wait for the LORD any longer?”

notes:
  - ref: 5
    phrase: Alas, master! for it was borrowed.
    kind: history
    title: Why a borrowed axe head
    body: |
      The miracle answers one poor man's loss, and his own cry gives the reason: the axe was not his. Iron axe heads were much like modern ones and could fly off a loose handle; that this one had to be borrowed suggests how poor the sons of the prophets were, and iron tools may still have been fairly rare in Israel (the Philistines had once kept smiths out of the land, [[1 Sam. 13:19]]). On one reading, the scarcity and value of the iron were not reason enough for such a miracle; rather, “the prophet's powers were exerted to help one who was honest enough to be the more concerned for his loss because the axe was not his own.”

      It belongs with the other small wonders Elisha worked for the community of prophets, like the salt that healed the water and the meal that healed the poisoned pottage ([[2 Kgs. 2:21]]; [[2 Kgs. 4:41]]). Like the healed spring, the lost axe is a miracle that meets the plain difficulties of mortal life, and, “most importantly, miracles can turn us to the Lord.” How Elisha's miracles answer the Savior's is explained at [[2 Kgs. 4:44]].
    sources: [ot-minute-2-kings-6, ot-manual-6, cfm-ot-2026-28]

  - ref: 16
    phrase: they that be with us are more than they that be with them
    kind: prophets
    title: More with us than with them
    body: |
      Elisha's answer holds for anyone who serves the Lord and feels outnumbered: “there are more with you than those you can see opposed to you. Some who are with you will be invisible to your mortal eyes.” The Lord will also at times bear His servants up by calling others to stand with them, through the quorum, the bishop and the companion.
    sources: [eyring-embark-2008]

  - ref: 17
    phrase: the mountain was full of horses and chariots of fire round about Elisha
    kind: symbol
    title: Horses and chariots of fire
    body: |
      The fiery host is the protection of heaven made visible around the prophet. The king of Syria had sent “horses, and chariots, and a great host” (verse 14), and they compassed the city; the servant is shown a second ring inside theirs, God's own army encamped about His servant, so that on the hill of Dothan the barrier against the Syrians was complete. Elisha does not pray for the army to come, since it is already there, but for the servant's eyes, so that he may be as confident as his master. The fire marks the host as not of this earth, and the vision need not be taken as one of literal horses and chariots. Horses and a chariot of fire had appeared when Elijah was taken ([[2 Kgs. 2:11]]).
    sources: [cambridge-kings, keil-kings, ot-minute-2-kings-6]

  - ref: 22
    phrase: set bread and water before them
    kind: history
    title: Why Elisha fed the Syrians
    body: |
      The text does not say why Elisha spared the army, only what came of it: the raiding bands came no more (verse 23). Rather than attack with the chariots of fire, he led the blinded troops into Samaria, and the king, who elsewhere shows Elisha little respect, here calls him “My father” and asks twice whether to strike them. On one older reading the repeated question shows how eager he was, though he could hardly kill the prophet's captives without the prophet's consent.

      Elisha's reply turns on the king's own practice. On one older reading, its sense is: you do not kill even the men you take in open battle with sword and bow, so how could you kill these, whom you did not take at all? The same reading gives the miracle an object, to show the Syrians that they faced a prophet of the true God, against whom no human power availed, and adds that sparing them was also more likely to bring peace. “Bread and water” covers food of every kind, so the command meant “feed them well, and let them go,” and the king made “great provision” (verse 23).
    sources: [ot-minute-2-kings-6, cambridge-kings, keil-kings]

  - ref: 24
    phrase: besieged Samaria
    kind: history
    title: No more raids, then a siege
    body: |
      Verse 23 says the Syrian bands came no more, and verse 24 has the whole Syrian army at Samaria's walls; the two describe different kinds of war. “Bands” are raiding parties, and after Dothan no more of them came; this time Ben-hadad “gathered all his host.” Josephus gave Elisha as the reason for the change: the king “determined to make no more secret attempts upon the king of Israel, out of fear of Elisha, but resolved to make open war.” This time he did not storm the city but surrounded it to starve it out.
    sources: [ot-minute-2-kings-6, ot-manual-6]

  - ref: 25
    phrase: the fourth part of a cab of dove’s dung
    kind: words
    title: Dove’s dung
    body: |
      The prices measure the famine: siege and hunger together made everything in Samaria dear. The donkey was unclean under the law ([[Lev. 11:3–8]]) and its head the least edible part, yet it fetched eighty pieces of silver; a quarter of a cab of “dove's dung,” about a pint, fetched five. The dung may have been eaten for what little nourishment it held, though most scholars take it as fuel. The prices come back in the next chapter, when Elisha promises flour and barley at a shekel a measure by the next day ([[2 Kgs. 7:1]]).
    sources: [ot-manual-6, ot-minute-2-kings-6]

  - ref: 30
    phrase: he had sackcloth within upon his flesh
    kind: history
    title: Sackcloth, and an oath against Elisha
    body: |
      The king mourns in secret, then swears to kill the prophet, and readers weigh the sackcloth differently. His first answer to the woman is helplessness: “If the LORD do not help thee, whence shall I help thee?” The threshing floor and the winepress are where grain and wine were made, and he has neither to give, a helplessness like his answer to Naaman's letter ([[2 Kgs. 5:7]]). The woman's story is, on one older reading, the curse of the law fulfilled to the letter: the siege in which parents would eat their children ([[Lev. 26:29]]; [[Deut. 28:53]], where the note gathers the cases).

      Then the people see the sackcloth under his robe. One Latter-day Saint reading takes it as a good sign: “a great image” that “speaks well of his character,” a mourning he did not want to put on show. Another reading sets it against the oath in verse 31 and finds an outward work more than a turning of the heart: the king thought he had done his part, and when no help came he turned his rage on the prophet. The oath itself, “God do so and more also to me,” is a standard form of oath in the Bible.
    sources: [ot-minute-2-kings-6, keil-kings, lds-scriptures]

  - ref: 33
    phrase: this evil is of the LORD; what should I wait for the LORD any longer?
    kind: history
    title: The king or the messenger
    body: |
      The Hebrew says “the messenger” came down to Elisha, but the words that follow seem to fit the king better. The verses are not clear, and translations divide the speakers differently. Elisha has said the king's footsteps are right behind his man (verse 32), and the Hebrew words for “king” (*melek*) and “messenger” (*malʾāk*) look much alike, so the question may well be the king's. On that reading the king followed his messenger to the prophet's house, and the despair is his own: the LORD has sent this evil, so why wait on Him any longer?

      The question “what should I wait for the LORD any longer?” is answered in the very next verse, by the man he came to kill: “Hear ye the word of the LORD” ([[2 Kgs. 7:1]]).
    sources: [oshb-wlc, ot-minute-2-kings-6, lds-scriptures]

christ: |
  Elisha's miracles testify of Christ as manifestations of the Lord's power (see [[2 Kgs. 3]]). At Dothan that power surrounds a prophet and a frightened young man, and the lesson holds for disciples now: “In the gospel of Jesus Christ you have help from both sides of the veil.” The servant's fear was real, but so was the host around him, and the Lord's help reaches His people in the same way now, whether or not they can see it at the time.

explore: |
  - **The siege lifted.** [[2 Kgs. 7:1–16]]: the noise of chariots and horses that the LORD made the Syrians hear, and the lepers who found the camp empty.
  - **The chariot of fire before.** [[2 Kgs. 2:9–14]], where Elisha first saw it.
  - **Help from both sides of the veil.** Elder Jeffrey R. Holland, “For Times of Trouble,” *New Era*, Oct. 1980, and President Henry B. Eyring, “O Ye That Embark,” October 2008 general conference.

