chapter: 8
title: The LORD Hath Shewed Me
tagline: The Shunammite, warned of a famine seven years before, comes home to find her land taken and has it restored while Gehazi is telling the king her story; in Damascus Elisha tells Hazael that the LORD has shown him he will be king and weeps for what he will do to Israel; in Judah, Jehoram and then Ahaziah walk in the way of Ahab's house, and the LORD spares Judah for David's sake.
when: 'In the reign of Joram son of Ahab king of Israel, from his fifth year to his twelfth (verses 16, 25), while Jehoram and then Ahaziah reigned in Judah; the famine of verses 1–6 began at least seven years before the woman''s return'

setting: |
  Chapter 8 opens with two more of the Elisha stories that began in [[2 Kgs. 2]], and like the rest they are probably not told in chronological order: the first episode looks back over seven years. After it the chapter turns to Damascus and then to the royal record of Judah.

  The names need sorting. Joram and Jehoram are two forms of one name, and the Bible uses both for two kings who reigned at the same time: Joram son of Ahab, who reigned twelve years over Israel in Samaria ([[2 Kgs. 3:1]]), and Jehoram son of Jehoshaphat in Jerusalem. The Judean Jehoram had married Ahab's daughter Athaliah, so the two royal houses were joined by marriage, and his son Ahaziah was Ahab's grandson. In Syria the king is Ben-hadad (the name is explained at [[1 Kgs. 20:1]]) until Hazael, his servant, murders him and takes the throne. Assyrian inscriptions know Hazael too: Shalmaneser of Assyria attacked and defeated him in Damascus, though he was soon strong enough to turn on Israel again.

  The second half of the chapter, Jehoram's and Ahaziah's reigns, is told again in [[2 Chr. 21–22]], which adds details Kings leaves out. The war at Ramoth-gilead in the last verses leads directly into Jehu's revolt in chapter 9.

thread: |
  Elisha's word moves through the chapter, and each time it runs ahead of events. To the Shunammite it was a warning years in advance: leave, for the LORD has called for a famine. She obeyed, survived, and came home to a king who was hearing her story at that very moment. In Damascus the word is darker. Elisha came to carry out the commission Elijah had received at Horeb ([[1 Kgs. 19:15]]), and twice he says “the LORD hath shewed me”: that Ben-hadad will die, and that Hazael will be king. He weeps because he has been shown more than that. Before the chapter ends Hazael is already at war with Israel at Ramoth-gilead.

  Judah's record runs the other way. Its king marries into Ahab's house and walks in its way, and his son does the same. Judah is spared only “for David his servant's sake” (verse 19). The last verse brings the two houses together at Jezreel, where Chronicles says Ahaziah's visit was his destruction, “of God” ([[2 Chr. 22:7]]).

sections:
  - range: 1-6
    heading: The Shunammite's land restored
    plain: |
      Elisha had told the woman whose son he had brought back to life, “Get up, go with your household, and live wherever you can, because the LORD has called for a famine, and it will come on the land for seven years.” The woman did as the man of God said: she went with her household and lived in the land of the Philistines for seven years. At the end of the seven years she came back from the land of the Philistines and went to appeal to the king for her house and her land.

      The king was talking with Gehazi, the servant of the man of God. “Tell me,” he said, “all the great things Elisha has done.” Just as Gehazi was telling the king how Elisha had brought a dead person back to life, the woman whose son he had restored came to appeal to the king for her house and land. Gehazi said, “My lord the king, this is the woman, and this is her son whom Elisha brought back to life.” The king asked the woman, and she told him. So the king assigned an official to her and said, “Give back everything that was hers, with all the harvest of her fields from the day she left the land until now.”
  - range: 7-15
    heading: Elisha and Hazael in Damascus
    plain: |
      Elisha came to Damascus while Ben-hadad king of Syria was ill. When the king was told, “The man of God has come here,” he said to Hazael, “Take a gift with you, go and meet the man of God, and ask the LORD through him, ‘Will I recover from this illness?’” So Hazael went to meet him, taking a gift of every good thing of Damascus, forty camel loads. He came, stood before him and said, “Your son Ben-hadad king of Syria has sent me to ask, ‘Will I recover from this illness?’” Elisha answered, “Go and tell him, ‘You will certainly recover.’ But the LORD has shown me that he will certainly die.”

      Elisha fixed his gaze on him until Hazael was embarrassed, and then the man of God wept. “Why is my lord weeping?” Hazael asked. “Because I know the harm you will do to the people of Israel,” he answered. “You will set their fortresses on fire, kill their young men with the sword, dash their little children to pieces, and rip open their pregnant women.” Hazael said, “But what is your servant, a mere dog, that he should do such a great thing?” Elisha answered, “The LORD has shown me that you will be king over Syria.” Then Hazael left Elisha and went back to his master, who asked, “What did Elisha say to you?” He answered, “He told me you would certainly recover.” The next day he took a thick cloth, soaked it in water and spread it over the king's face, so that he died. And Hazael reigned in his place.
  - range: 16-24
    heading: Jehoram king of Judah
    plain: |
      In the fifth year of Joram son of Ahab king of Israel, while Jehoshaphat was king of Judah, Jehoram son of Jehoshaphat became king of Judah. He was thirty-two years old when he became king, and he reigned eight years in Jerusalem. He followed the ways of the kings of Israel, as the house of Ahab had done, for he had married Ahab's daughter, and he did evil in the sight of the LORD. Even so, the LORD was not willing to destroy Judah, for the sake of His servant David, since He had promised to give him and his descendants a lamp forever.

      In Jehoram's days Edom rebelled against Judah's rule and set up a king of its own. So Jehoram went over to Zair with all his chariots. He rose by night and broke through the Edomites who had surrounded him and the commanders of their chariots, and his army fled home to their tents. So Edom has been in rebellion against Judah to this day, and Libnah rebelled at the same time. The rest of Jehoram's acts, and all he did, are written in the book of the chronicles of the kings of Judah. Jehoram died and was buried with his fathers in the city of David, and his son Ahaziah reigned in his place.
  - range: 25-29
    heading: Ahaziah king of Judah
    plain: |
      In the twelfth year of Joram son of Ahab king of Israel, Ahaziah son of Jehoram king of Judah became king. He was twenty-two years old when he became king, and he reigned one year in Jerusalem. His mother was Athaliah, the granddaughter of Omri king of Israel. He followed the ways of the house of Ahab and did evil in the sight of the LORD, as the house of Ahab had done, for he was related by marriage to Ahab's house. He went with Joram son of Ahab to war against Hazael king of Syria at Ramoth-gilead, and the Syrians wounded Joram. King Joram returned to Jezreel to recover from the wounds the Syrians had given him at Ramah when he fought against Hazael king of Syria. And Ahaziah son of Jehoram king of Judah went down to Jezreel to see Joram son of Ahab, because he was wounded.

notes:
  - ref: 1
    phrase: for the LORD hath called for a famine
    kind: history
    title: A warning given years before
    body: |
      Verse 1 looks back: Elisha's counsel was given at least seven years before the woman came to the king, so “Then spake Elisha” is better read as “Elisha had spoken.” The famine was most likely the dearth already mentioned when Elisha healed the pottage at Gilgal ([[2 Kgs. 4:38]]). That would put these verses early in Elisha's story, and would explain how Gehazi could be talking with the king: if this happened before Naaman's healing, Gehazi was still the prophet's servant and not yet a leper ([[2 Kgs. 5:27]], where his sin is explained). That is an older reading, likely but not certain.

      The LORD “calls for” a famine as elsewhere He calls for the sword against a land; the dearth is His, and Elisha names it and its length as the LORD's word, just as he had named the end of the siege ([[2 Kgs. 7:1]]). For the Shunammite the word was a rescue, and it can be read as one of the blessings that followed her care for the prophet ([[2 Kgs. 4:8–10]]): Elisha took care to warn her household to leave and save their lives, and she “did after the saying of the man of God” (verse 2).
    sources: [cambridge-kings, keil-kings, bartholomew-follow-prophet]

  - ref: 5
    phrase: behold, the woman, whose son he had restored to life, cried to the king
    kind: history
    title: The woman at the door
    body: |
      The woman came home to find that her house and land were no longer hers: she had to “cry unto the king” for them (verse 3), and his order to “restore all that was hers” (verse 6) shows they had passed to others while she was away. The text stresses the timing with its “behold.” She walked in at the very moment Gehazi was telling the king about her son, and Gehazi could point to her: “this is the woman, and this is her son.” When the king asked her, she told him, and he restored not only her house and field but all the produce of her fields from the day she left (verse 6).

      The text names no miracle here. The king who asked to hear “all the great things that Elisha hath done” (verse 4) is shown one of them standing in front of him.
    sources: [lds-scriptures]

  - ref: 10
    phrase: Go, say unto him, Thou mayest certainly recover
    kind: words
    title: Did Elisha tell Hazael to lie?
    body: |
      As the King James Version reads it, Elisha seems to give Hazael a false message for the king, “thou mayest certainly recover,” and then to say in the same breath that the king will die. The Hebrew is itself uncertain at this point. The consonants written in the text (the *ketiv*) have *lōʾ*, “not,” which would make Elisha's message *Thou shalt not recover*. The reading tradition printed in the margin (the *qere*) has *lô*, “to him,” a word that sounds the same, and the King James follows that one: “say unto him, Thou mayest certainly recover.”

      Joseph Smith's revision of the Bible changed the sentence. His manuscript reads, “if thou wilt go and say unto him, Thou mayes certainly recover, howbeit, the Lord” (spelling as in the manuscript): the words are no longer a command but a condition, “if thou wilt go and say.” Hazael does take that message back to his master (verse 14). The change is a few words, counted among the “very insignificant changes” in 2 Kings, but it touches the question a reader asks here.

      The Church's older Student Manual reads the King James words another way: the disease itself was not fatal, but the king would die by other means. On either reading the sentence ends where Elisha's knowledge does, with “the LORD hath shewed me that he shall surely die.”
    sources: [oshb-wlc, jsp-ot2, nyman-jst-historical, ot-manual-6]

  - ref: 12
    phrase: Because I know the evil that thou wilt do unto the children of Israel
    kind: history
    title: Why the man of God wept
    body: |
      Elisha weeps because the LORD has shown him what Hazael will do to Israel, and he says so plainly. Verse 11 sets the scene: Elisha fixed his gaze on Hazael until Hazael was ashamed, and only then wept. The stare is Elisha seeing into Hazael's heart, “for the wicked cannot look unashamedly into the piercing eye of the righteous.”

      What Elisha foresees fills out the LORD's word to Elijah at Horeb, that whoever escaped “the sword of Hazael” would meet Jehu's ([[1 Kgs. 19:17]]). The rest of 2 Kings records that it came true: Hazael “smote them in all the coasts of Israel” ([[2 Kgs. 10:32]]), and the LORD “delivered them into the hand of Hazael king of Syria” ([[2 Kgs. 13:3]]); he even marched on Jerusalem ([[2 Kgs. 12:17]]). Amos later opens his book with the judgment on Damascus for what it did to Gilead and names “the house of Hazael” ([[Amos 1:3–4]], where the note explains it). The prophet who sees the evil coming is not glad of it: he weeps for the people who will suffer it.
    sources: [keil-kings, ot-manual-6, bd-hazael, lds-scriptures]

  - ref: 13
    phrase: is thy servant a dog, that he should do this great thing?
    kind: words
    title: What is thy servant, a dog?
    body: |
      “Dog” was a word of contempt when used of a person, and Hazael applies it to himself. The standard Hebrew lexicon lists this verse as a case of the word used in excessive humility: what is a mere dog of a servant, that he should do anything so great? Elisha answers: “The LORD hath shewed me that thou shalt be king over Syria.” It is the commission the LORD gave Elijah at Horeb, to “anoint Hazael to be king over Syria” ([[1 Kgs. 19:15]], where the note explains how the three commissions were carried out by other hands).

      Then he gives his master the comforting half of Elisha's answer and keeps the rest (verse 14), and the next day he smothers the king with a wet cloth and takes the throne. He “became king by murdering his master Benhadad.” Elisha foretold the throne; the text lays the murder at Hazael's door.
    sources: [bdb, bd-hazael, lds-scriptures]

  - ref: 19
    phrase: for David his servant’s sake
    kind: scripture
    title: A light kept for David
    body: |
      Judah survives Jehoram's reign only because of a promise made to someone else. He married Ahab's daughter and walked in the way of Ahab's house (verse 18); Chronicles adds that once he was on the throne he killed all his brothers with the sword ([[2 Chr. 21:4]]). Yet the LORD “would not destroy Judah.” The “light” is a lamp, the promise that David's family would stay on the throne in Jerusalem; it is explained at [[1 Kgs. 11:36]], where Kings first makes it, and the promise itself is Nathan's ([[2 Sam. 7:16]]).

      Chronicles names the reason as a covenant: “the Lord would not destroy the house of David, because of the covenant that he had made with David” ([[2 Chr. 21:7]]). The kings who inherited that covenant broke faith with it, but the LORD did not, and the chapter's next king, though related by marriage to Ahab's house (verse 27), still sits on David's throne.
    sources: [lds-scriptures]

  - ref: 20
    phrase: Edom revolted from under the hand of Judah
    kind: history
    title: Edom and Libnah break away
    body: |
      Judah is spared, but not spared loss: in Jehoram's reign it lost Edom in the south and Libnah in the west. Edom, the land of Esau's descendants south of the Dead Sea, had been conquered by David ([[2 Sam. 8:14]]), won back its kingdom under Hadad in Solomon's day ([[1 Kgs. 11:14]]), and was subject to Judah again by Jehoshaphat's time, when “there was then no king in Edom: a deputy was king” ([[1 Kgs. 22:47]]). Now it “made a king over themselves.” Jehoram's night attack did not win it back: Edom “revolted from under the hand of Judah unto this day” (verse 22).

      Libnah was a city of Judah's own, one Joshua had taken ([[Josh. 10:29–30]]). Chronicles gives the reason Kings leaves unstated: it revolted “because he had forsaken the Lord God of his fathers” ([[2 Chr. 21:10]]).
    sources: [bd-edom, lds-scriptures]

  - ref: 26
    phrase: Two and twenty years old was Ahaziah when he began to reign
    kind: scripture
    title: Twenty-two or forty-two
    body: |
      Kings makes Ahaziah twenty-two when he became king, and that fits: his father Jehoram came to the throne at thirty-two and reigned eight years (verse 17), so he died at forty. The parallel in Chronicles reads “Forty and two years old was Ahaziah when he began to reign” ([[2 Chr. 22:2]]), which would make the son older than his father. Joseph Smith's revision of the Bible changed Chronicles to “twenty and two,” bringing it into line with Kings; it is one of the places where his revision corrects a contradiction between parallel accounts, and the Church's footnote to Chronicles gives “Twenty-two” as the alternative reading.

      Verse 18 says Jehoram's wife was “the daughter of Ahab,” and here Ahaziah's mother Athaliah is “the daughter of Omri.” Ahab was Omri's son ([[1 Kgs. 16:29]]), so “daughter” means a female descendant here; the footnote in Chronicles gives “granddaughter.” Her name matters for what comes next: when her son is killed, she seizes Judah's throne herself ([[2 Kgs. 11:1]]).
    sources: [lds-scriptures, sc-knowhy-786, nyman-jst-historical]

  - ref: 29
    phrase: went down to see Joram the son of Ahab in Jezreel
    kind: history
    title: Two kings at Jezreel
    body: |
      The last verses place the two kings where chapter 9 needs them. Ramoth-gilead, east of the Jordan, was the city Ahab had died fighting for against the Syrians ([[1 Kgs. 22:29–37]]); his son now holds it against Hazael but is wounded, and goes home to Jezreel to recover (Ramah in verse 29 is the same battle). Ahaziah, his ally and kinsman by marriage (verse 27), goes to visit him. Chapter 9 opens with Jehu anointed at Ramoth and driving to Jezreel, where both kings are ([[2 Kgs. 9:14–16]]).

      Chronicles says what the visit meant. Ahaziah's mother “was his counsellor to do wickedly” ([[2 Chr. 22:3]]), and “the destruction of Ahaziah was of God by coming to Joram” ([[2 Chr. 22:7]]). The marriage that joined Judah's house to Ahab's in verse 18 brings Judah's king to Jezreel at the moment the judgment on Ahab's house falls; Jehu's revolt is explained at [[2 Kgs. 9:7]].
    sources: [lds-scriptures]

christ: |
  The LORD spared Judah through a faithless reign “for David his servant's sake,” and the promise He kept was a “light” for David's line. One Latter-day Saint reading takes that light to be Jesus Christ, who would come through Judah; Chronicles names its ground as “the covenant that he had made with David” ([[2 Chr. 21:7]]). The covenant outlasted the kings who inherited it, and the same faithfulness stands behind the Lord's covenants with His people now: “If we believe not, yet he abideth faithful: he cannot deny himself” ([[2 Tim. 2:13]]).

explore: |
  - **Hazael's wars.** [[2 Kgs. 10:32–33]], [[2 Kgs. 12:17–18]] and [[2 Kgs. 13:3–7, 22]]: what Elisha wept over, as it came; and [[Amos 1:3–5]] on the site.
  - **The two Jehorams in Chronicles.** [[2 Chr. 21–22]], which adds Jehoram's murder of his brothers, Elijah's letter to him and his death.
  - **The lamp for David.** [[1 Kgs. 11:36]], [[1 Kgs. 15:4]] and [[2 Sam. 7:16]], with the notes there.

