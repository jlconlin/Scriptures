chapter: 24
claims:
  # ---------- setting / thread ----------
  - where: 'setting'
    claim: 'The rites of this chapter bring Israel into the covenant'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'As will be discussed later, these rites initiated the Israelites into a covenant relationship with God.'
  - where: 'setting'
    claim: 'Hebrews retells the sprinkling of the blood'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/9?lang=eng'
    quote: 'Whereupon neither the first testament was dedicated without blood.'
  - where: 'setting'
    claim: 'The Savior’s words over the cup take up Exodus 24:8'
    key: seely-sacrifice
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/09/united-states-and-canada-section/sacrifice-in-similitude-of-the-savior?lang=eng'
    quote: 'He hearkened back to Exodus 24:8—“behold the blood of the covenant”—when He took the wine and instituted the sacrament, saying, “This is my blood of the new testament [covenant]” (Matthew 26:28).'
  - where: 'thread'
    claim: 'One older reading: the blood of the covenant qualified Israel, in its representatives, to go up and see God'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/24.htm'
    quote: 'Through their consecration with the blood of the covenant, the Israelites were qualified to ascend the mountain, and there behold the God of Israel and celebrate the covenant meal'
  - where: 'thread'
    claim: 'The ascent and the meal further seal the covenant'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'To further seal the covenant, seventy elders of Israel ascend the mount, where they see the God of Israel and participate in a covenantal meal.'
  - where: 'thread'
    claim: 'The closing verses are set beside the end of the book, where cloud and glory settle on the tabernacle'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'Exodus 24.15-16 Exodus 40.34-Leviticus 1.1'
  - where: 'thread'
    claim: 'The closing verses turn the covenant ceremony toward the tabernacle'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'essentially transforming the covenant ceremony into a preparation in worship for the establishment of the tabernacle cult.'
  - where: 'thread'
    claim: 'Moses’s experience on the mount becomes the community’s through the tabernacle'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'Moses’ “mountain experience” in Exodus 24 will thus become the community’s via the tabernacle:'

  # ---------- sections ----------
  - where: 'section 3 plain'
    claim: 'The last phrase of verse 10 may be read “clear as the very heavens” (the Church’s footnote 10c)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/24?lang=eng'
    quote: 'OR clear as the very heavens.'

  # ---------- note 24:1 ----------
  - where: 'note 24:1 “Who went up with Moses”'
    claim: 'Nadab and Abihu are sons of Aaron, later named with him for the priest’s office'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/28?lang=eng'
    quote: 'that he may minister unto me in the priest’s office, even Aaron, Nadab and Abihu, Eleazar and Ithamar, Aaron’s sons.'
  - where: 'note 24:1 “Who went up with Moses”'
    claim: 'Elders in the Old Testament are often the older men of a tribe who governed'
    key: bd-elders
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elders?lang=eng'
    quote: 'In many instances in the Old Testament it has reference to the older men in a tribe, usually entrusted with the governmental affairs.'
  - where: 'note 24:1 “Who went up with Moses”'
    claim: 'The Bible Dictionary names this passage as one with ordained elders of the Melchizedek Priesthood'
    key: bd-elders
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elders?lang=eng'
    quote: 'There were ordained elders in the Melchizedek Priesthood in Old Testament times, as in Ex. 24:9–11 and Num. 11:16.'
  - where: 'note 24:1 “Who went up with Moses”'
    claim: 'The seventy elders can be seen as a precedent for the office of the Seventy'
    key: sc-knowhy-813
    url: 'https://scripturecentral.org/knowhy/why-is-the-church-of-jesus-christ-of-latter-day-saints-organized-according-to-ancient-patterns'
    quote: 'It is also possible to see in the Old Testament precedents for the priesthood office of the Seventy, as Moses was instructed to call seventy elders of Israel who stood with him in God’s presence (Exodus 24:1; Numbers 11:16).'
  - where: 'note 24:1 “Who went up with Moses”'
    claim: 'Why the company climbs: nearer contact with the LORD’s presence fits them to lead (the study prints Durham)'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'a still more intimate contact with the Presence of Yahweh. In such a manner are they uniquely equipped for their service of guidance and teaching, of leadership.'

  # ---------- note 24:4 ----------
  - where: 'note 24:4 “Twelve standing stones”'
    claim: 'The Hebrew word for pillar and what it denotes'
    key: sc-knowhy-870
    url: 'https://scripturecentral.org/knowhy/why-does-isaiah-say-there-will-be-a-pillar-in-egypt'
    quote: 'it is used 34 times in the Hebrew Bible to denote some kind of stone or stele that humans have erected for devotional purposes.'
  - where: 'note 24:4 “Twelve standing stones”'
    claim: 'Jacob’s pillar at Bethel shows the use of such stones'
    key: sc-knowhy-870
    url: 'https://scripturecentral.org/knowhy/why-does-isaiah-say-there-will-be-a-pillar-in-egypt'
    quote: 'This passage supports the notion that matzevot were used to commemorate sacred space or mark that a covenant had occurred.'
  - where: 'note 24:4 “Twelve standing stones”'
    claim: 'The twelve stones likely commemorate each tribe’s covenant'
    key: sc-knowhy-870
    url: 'https://scripturecentral.org/knowhy/why-does-isaiah-say-there-will-be-a-pillar-in-egypt'
    quote: 'Additionally, each tribe made a covenant with the Lord at that moment, so the twelve stones likely commemorated that event.'
  - where: 'note 24:4 “Twelve standing stones”'
    claim: 'Elsewhere such stones are paired with foreign altars to be destroyed'
    key: sc-knowhy-870
    url: 'https://scripturecentral.org/knowhy/why-does-isaiah-say-there-will-be-a-pillar-in-egypt'
    quote: 'They are generally paired with foreign altars that the righteous Israelites must destroy or as objects that wicked kings erect (see Deuteronomy 7:5).'
  - where: 'note 24:4 “Twelve standing stones”'
    claim: 'The altar stands for the LORD and the pillars for the tribes; the stones are a witness'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'The altar represents Yahweh, and the pillars represent the twelve tribes of Israel. The pillars, or standing stones, also serve as a witness to or a memorial of the covenant.'
  - where: 'note 24:4 “Twelve standing stones”'
    claim: 'The Church’s footnote 4d at “pillars” points to Jacob’s pillar in Genesis 31:45'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/24?lang=eng'
    quote: 'Gen. 31:45.'
  - where: 'note 24:4 “Twelve standing stones”'
    claim: 'Jacob’s pillar in Genesis 31 is set up at a covenant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/31?lang=eng'
    quote: 'Now therefore come thou, let us make a covenant, I and thou; and let it be for a witness between me and thee. And Jacob took a stone, and set it up for a pillar.'
  - where: 'note 24:4 “Twelve standing stones”'
    claim: 'The word for pillars in 24:4 is Strong’s 4676'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'מַצֵּבָ֔ה'
  - where: 'note 24:4 “Twelve standing stones”'
    claim: '“Images” in 23:24 is the same word (Strong’s 4676)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'מַצֵּבֹתֵיהֶֽם'

  # ---------- note 24:5 ----------
  - where: 'note 24:5 “Why young men offer the sacrifices”'
    claim: 'Young men offer because priests had not yet been ordained'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'Since priests had not been ordained yet, Moses had young men of Israel offer both burnt and peace offerings, both of which included the splashing of blood against the sides of the altar.'
  - where: 'note 24:5 “Why young men offer the sacrifices”'
    claim: 'The young men may have been firstborn sons'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'it is possible that the young men were firstborn. Numbers 8 recounts the substitution of the Levites for the firstborn of the Israelites, suggesting that the firstborn generally could have had priestly or cultic functions'
  - where: 'note 24:5 “Why young men offer the sacrifices”'
    claim: 'One older reading: they were Moses’s helpers, and Moses did the priestly act'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/24.htm'
    quote: 'they simply acted as servants of Moses; and the priestly duty of sprinkling the blood was performed by him as the mediator of the covenant.'
  - where: 'note 24:5 “Why young men offer the sacrifices”'
    claim: 'Neither offering is a sin offering; what the burnt offering represents'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'They are nonexpiatory. The burnt offering, which is burnt on the altar in its entirety, represents holding nothing back from God, a total consecration of one’s being.'
  - where: 'note 24:5 “Why young men offer the sacrifices”'
    claim: 'The peace offering is shared'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'The peace offering is apportioned between God, the priest, and the offerer.'

  # ---------- note 24:7 ----------
  - where: 'note 24:7 “What Moses read aloud”'
    claim: 'The people first gave this answer in 19:8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/19?lang=eng'
    quote: 'And all the people answered together, and said, All that the LORD hath spoken we will do.'

  # ---------- note 24:8 blood ----------
  - where: 'note 24:8 “Blood on the altar and on the people”'
    claim: 'Dividing the blood is unlike later burnt and peace offerings'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'But in this account, only half of the blood was used against the sides of the altar, unlike the practice in later burnt and peace offerings.'
  - where: 'note 24:8 “Blood on the altar and on the people”'
    claim: 'The altar perhaps stood for God, so both parties were bound'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'the splashing of blood upon the altar perhaps suggested that the altar stood as a symbol for God.'
  - where: 'note 24:8 “Blood on the altar and on the people”'
    claim: 'Both parties were bound by blood'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'blood was splashed on the altar, which represented God, just as blood was splashed on the people—both parties were bound by blood and partook of the covenant experience.'
  - where: 'note 24:8 “Blood on the altar and on the people”'
    claim: 'The sprinkling shows the covenant binds both sides'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'attests to the reciprocity of this covenant. Both God and Israel are bound—God to support and defend his people; the people to love and obey their God.'
  - where: 'note 24:8 “Blood on the altar and on the people”'
    claim: 'Blood as a symbol of life and of saving power extended by covenant'
    key: seely-sacrifice
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/09/united-states-and-canada-section/sacrifice-in-similitude-of-the-savior?lang=eng'
    quote: 'Blood in the ancient and modern world is a symbol of life—both mortal life and spiritually redeemed life. It was a symbol of God’s saving power extended to people through covenant.'
  - where: 'note 24:8 “Blood on the altar and on the people”'
    claim: 'Blood in Israel’s worship created bonds of kinship defined by covenant (the study prints Abusch)'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'Surely one of them was that of creating and maintaining bonds of kinship which were defined in terms of covenant'
  - where: 'note 24:8 “Blood on the altar and on the people”'
    claim: 'The people were identified with the slain animal as a warning (the study prints Mendenhall and Herion)'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'the people were identified with the sacrificed animal, so that the fate of the latter is presented as the fate to be expected by the people if they violated their sacred promise.'
  - where: 'note 24:8 “Blood on the altar and on the people”'
    claim: 'Blood is put on Aaron and his sons as it was on all Israel here'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'As with the splashing of the blood onto the whole of Israel in Exodus 24, the splashing of the blood and oil onto Aaron ritually established the relationship between Aaron and God.'

  # ---------- note 24:8 christ ----------
  - where: 'note 24:8 “The words Jesus took up at the Last Supper”'
    claim: 'Jesus’s words over the cup'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/26?lang=eng'
    quote: 'For this is my blood of the new testament, which is shed for many for the remission of sins.'
  - where: 'note 24:8 “The words Jesus took up at the Last Supper”'
    claim: '“Testament” there means covenant'
    key: ot-minute-ex-24
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-24-28-31-34'
    quote: 'The word “testament” in this context means “covenant.”'
  - where: 'note 24:8 “The words Jesus took up at the Last Supper”'
    claim: 'At the Last Supper Jesus moved the symbol of blood to the new covenant, looking back to this verse'
    key: seely-sacrifice
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/09/united-states-and-canada-section/sacrifice-in-similitude-of-the-savior?lang=eng'
    quote: 'Jesus transferred the symbol of blood from animal sacrifice under the law of Moses to the new covenant. He hearkened back to Exodus 24:8'
  - where: 'note 24:8 “The words Jesus took up at the Last Supper”'
    claim: 'Hebrews retells the sprinkling and Moses’s words'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/9?lang=eng'
    quote: 'he took the blood of calves and of goats, with water, and scarlet wool, and hyssop, and sprinkled both the book, and all the people, Saying, This is the blood of the testament which God hath enjoined unto you.'
  - where: 'note 24:8 “The words Jesus took up at the Last Supper”'
    claim: 'Hebrews calls Christ the mediator of the new testament by means of death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/9?lang=eng'
    quote: 'And for this cause he is the mediator of the new testament, that by means of death'
  - where: 'note 24:8 “The words Jesus took up at the Last Supper”'
    claim: 'The Church’s footnote 8a at “blood” points to 1 Peter 1:2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/24?lang=eng'
    quote: '1 Pet. 1:2.'

  # ---------- note 24:10 saw ----------
  - where: 'note 24:10 “The elders see God”'
    claim: 'The Church’s footnotes index the verse under appearances of Jesus Christ before His birth and under the bodily nature of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/24?lang=eng'
    quote: 'TG God, Manifestations of; Jesus Christ, Appearances, Antemortal.'
  - where: 'note 24:10 “The elders see God”'
    claim: 'Footnote 10b at “feet”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/24?lang=eng'
    quote: 'TG God, Body of, Corporeal Nature.'
  - where: 'note 24:10 “The elders see God”'
    claim: 'No cloud hides the Lord from this company'
    key: muhlestein-theophanies
    url: 'https://rsc.byu.edu/ascending-mountain-lord/darkness-light-lord-elements-israelite-theophanies'
    quote: 'There is no mention of clouds, and the Lord is not hidden here.'
  - where: 'note 24:10 “The elders see God”'
    claim: 'A suggested reason: the company was worthy to come more fully into His presence'
    key: muhlestein-theophanies
    url: 'https://rsc.byu.edu/ascending-mountain-lord/darkness-light-lord-elements-israelite-theophanies'
    quote: 'Perhaps this is because the select group was worthy to more fully come into God’s presence.'
  - where: 'note 24:10 “The elders see God”'
    claim: 'Latter-day revelation: Moses sought to prepare all the people to behold the face of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'Now this Moses plainly taught to the children of Israel in the wilderness, and sought diligently to sanctify his people that they might behold the face of God;'

  # ---------- note 24:10 sapphire ----------
  - where: 'note 24:10 “A pavement like the sky”'
    claim: 'The writer can only compare what was seen'
    key: muhlestein-theophanies
    url: 'https://rsc.byu.edu/ascending-mountain-lord/darkness-light-lord-elements-israelite-theophanies'
    quote: 'The closest the writer can come to the reality of the scene is to compare aspects of what they saw to a work of sapphire and the body of heaven.'
  - where: 'note 24:10 “A pavement like the sky”'
    claim: 'A modern translation of verse 10'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2024&version=NRSVUE'
    quote: 'Under his feet there was something like a pavement of sapphire stone, like the very heaven for clearness.'
  - where: 'note 24:10 “A pavement like the sky”'
    claim: 'The picture is of the Lord standing in a bright sky'
    key: muhlestein-theophanies
    url: 'https://rsc.byu.edu/ascending-mountain-lord/darkness-light-lord-elements-israelite-theophanies'
    quote: 'The bright blue of sapphire combined with the reference to heaven seems to indicate that the Lord is standing in a luminous sky or heaven.'
  - where: 'note 24:10 “A pavement like the sky”'
    claim: 'One study reads the sapphire as the heavenly sanctuary'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'we find a description of the heavenly sanctuary, its blue sapphire being a common feature of temples in the ancient Near East'
  - where: 'note 24:10 “A pavement like the sky”'
    claim: 'Ezekiel’s throne is like a sapphire stone'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/1?lang=eng'
    quote: 'And above the firmament that was over their heads was the likeness of a throne, as the appearance of a sapphire stone'
  - where: 'note 24:10 “A pavement like the sky”'
    claim: 'The wording of the Kirtland Temple vision'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/110?lang=eng'
    quote: 'We saw the Lord standing upon the breastwork of the pulpit, before us; and under his feet was a paved work of pure gold, in color like amber.'

  # ---------- note 24:11 ----------
  - where: 'note 24:11 “A meal in the presence of God”'
    claim: 'Sacred meals, peace offerings among them, belonged to covenant making'
    key: hopkin-covenant
    url: 'https://rsc.byu.edu/creation-sinai/covenant-among-covenants'
    quote: 'Anciently, sacred meals, including the Passover meal, peace offerings, and meals in other settings, were often a part of the covenant-making or covenant-renewal process.'
  - where: 'note 24:11 “A meal in the presence of God”'
    claim: 'One older reading: the meal was of the peace offerings sacrificed below'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/24.htm'
    quote: 'they celebrated thus near to Him the sacrificial meal of the peace-offerings, which had been sacrificed at the conclusion of the covenant'
  - where: 'note 24:11 “A meal in the presence of God”'
    claim: 'The feast of a peace offering represents fellowship with God'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'The offerer takes the majority of the sacrifice back to his family and celebrates with a feast that represents fellowship and unity with God and fellow man.'
  - where: 'note 24:11 “A meal in the presence of God”'
    claim: '“Laid not his hand” most likely means God did not harm them'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'The apparent meaning here is that God did not harm these elders in spite of their proximity to the consuming glory and holiness of God.'
  - where: 'note 24:11 “A meal in the presence of God”'
    claim: 'Another possibility the same study offers'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'The Hebrew word for “laid,” shalach, also means “to stretch out,” perhaps indicating that God did not extend his hand to these elders, a privilege he might have granted Moses, who enjoyed greater intimacy than did these seventy.'
  - where: 'note 24:11 “A meal in the presence of God”'
    claim: 'A modern translation has “chief men” for “nobles”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2024&version=NRSVUE'
    quote: 'God did not lay his hand on the chief men of the Israelites; they beheld God, and they ate and drank.'

  # ---------- note 24:12 ----------
  - where: 'note 24:12 “The tables Moses went up to receive”'
    claim: 'The tables are given at the end of the forty days, written by God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/31?lang=eng'
    quote: 'two tables of testimony, tables of stone, written with the finger of God.'

  # ---------- note 24:14 ----------
  - where: 'note 24:14 “Who is left in charge”'
    claim: 'Who Hur was'
    key: bd-hur
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hur?lang=eng'
    quote: 'One who, with Aaron, supported the hands of Moses in the battle with Amalek (Ex. 17:10, 12; 24:14).'
  - where: 'note 24:14 “Who is left in charge”'
    claim: 'Joshua fought Amalek while Aaron and Hur held up Moses’s hands'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/17?lang=eng'
    quote: 'So Joshua did as Moses had said to him, and fought with Amalek: and Moses, Aaron, and Hur went up to the top of the hill.'
  - where: 'note 24:14 “Who is left in charge”'
    claim: 'Joshua is with Moses when he comes down'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/32?lang=eng'
    quote: 'And when Joshua heard the noise of the people as they shouted, he said unto Moses, There is a noise of war in the camp.'
  - where: 'note 24:14 “Who is left in charge”'
    claim: 'The people come to Aaron because he was in charge below'
    key: ot-minute-ex-24
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-24-28-31-34'
    quote: 'They approached Aaron, who was in charge at the base of the mountain (see Exodus 24:14), and demanded that he make them an idol'

  # ---------- note 24:16 ----------
  - where: 'note 24:16 “The glory of the LORD”'
    claim: 'Here the glory is light wrapped in the darkness of the cloud'
    key: muhlestein-theophanies
    url: 'https://rsc.byu.edu/ascending-mountain-lord/darkness-light-lord-elements-israelite-theophanies'
    quote: 'Again we are presented with the image of God being surrounded by light, which is surrounded by darkness.'
  - where: 'note 24:16 “The glory of the LORD”'
    claim: 'The Shechinah, with this verse named'
    key: bd-shechinah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shechinah?lang=eng'
    quote: 'The Presence. A word used by the later Jews (and borrowed from them by the Christians) to denote the cloud of brightness and glory that marked the presence of the Lord, as spoken of in Ex. 3:1–6; 24:16'
