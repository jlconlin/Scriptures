  # ---------- note 23:21 ----------
  - where: 'note 23:21 “The Angel who bears the name of the LORD”'
    claim: '“My name is in him” means he has the LORD’s authority; disobedience brings catastrophe'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'Disobedience will result in catastrophe, the Lord asserts, because “my name is in him [šĕmî bĕqirbô]”—that is, “he has my authority.”[32]'
  - where: 'note 23:21 “The Angel who bears the name of the LORD”'
    claim: 'The Angel’s identity is much discussed; “my Angel” is malʾākî, pointing to Malachi'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'The identity of this theophanic “Angel”—in Exodus 23:20, he is called “my Angel” (malʾākî)—has elicited no small amount of discussion and speculation. The description malʾākî draws our attention forward to the book of Malachi (“my angel/messenger”)'
  - where: 'note 23:21 “The Angel who bears the name of the LORD”'
    claim: 'Malachi 3:1 identifies the Lord as the messenger of the covenant; perhaps the Angel here is the Lord'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'That promise identifies “the Lord” himself as “the messenger of the covenant.” Perhaps it is the same here: the Angel is the Lord himself.'
  - where: 'note 23:21 “The Angel who bears the name of the LORD”'
    claim: 'In the bush the angel of the LORD is God Himself (the site’s note at 3:2)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/23?lang=eng'
    quote: 'Ex. 14:19; Josh. 5:14 (13–15); Isa. 63:9.'

  - where: 'note 23:21 “The Angel who bears the name of the LORD”'
    claim: 'In verse 23 “mine Angel” is the noun with the first-person suffix (malʾākî)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'מַלְאָכִ/י֮'

  # ---------- note 23:28 ----------
