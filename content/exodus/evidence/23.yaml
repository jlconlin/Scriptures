chapter: 23
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'Israel reached Sinai in the third month after leaving Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/19?lang=eng'
    quote: 'In the third month, when the children of Israel were gone forth out of the land of Egypt, the same day came they into the wilderness of Sinai.'
  - where: 'setting'
    claim: 'The people stood afar off and Moses went up to receive the laws that begin at 20:22'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/20?lang=eng'
    quote: 'And the people stood afar off, and Moses drew near unto the thick darkness where God was.'
  - where: 'setting'
    claim: 'The collection runs from Exodus 20:22 to 23:33 and is the first law code after the Ten Commandments'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'The first major law code in the Pentateuch, immediately after the giving of the Decalogue, is the Covenant Code (Exodus 20:22–23:33), for which the Decalogue serves as a kind of prologue.'
  - where: 'setting'
    claim: 'Moses writes these words in the book of the covenant in the next chapter'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'Moses’s writing “all the words of the Lord” (Exodus 24:4) in the “book of the covenant” (24:7), and Moses’s ratifying the covenant by applying “the blood of the covenant” to the people (24:8; compare Mosiah 4:2).'
  - where: 'setting'
    claim: 'The laws look ahead to Israel’s entry into the land'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'constitutes an ethos for the establishment of the Israelites in the wilderness as a covenant people—and holding them together as such—with a view of their eventual entry into the land of promise.'
  - where: 'setting'
    claim: 'The law of the feasts is repeated in Exodus 34 and Deuteronomy 16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/23?lang=eng'
    quote: 'Ex. 34:18 (18–26); Deut. 16:16; Ezek. 46:9.'
  - where: 'setting'
    claim: 'The Joseph Smith Translation changes one word in the chapter, in verse 3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/23?lang=eng'
    quote: 'JST Ex. 23:3 … wicked man …'
  - where: 'setting'
    claim: 'In Joshua 24 Joshua recounts how the LORD led Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/24?lang=eng'
    quote: 'And I sent the hornet before you, which drave them out from before you, even the two kings of the Amorites; but not with thy sword, nor with thy bow.'
  - where: 'thread'
    claim: 'The laws through 23:9 are grouped as laws of Israelite sociality'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'Laws Governing Israelite “Sociality” (Exodus 22:15–23:9)'
  - where: 'thread'
    claim: 'The laws through 23:9 are rules for holding a community together'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'the laws or statutes in Exodus 21:33–23:9 can be broadly viewed as rules necessary to holding a community together—that is, establishing a community ethos.'
  - where: 'thread'
    claim: 'The code forbids mistreating the weakest: the stranger, widow, orphan, poor'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'It strictly forbids mistreatment of society’s weakest members, exemplified here by the foreign migrant (“stranger”), the widow, the orphan, and the poor (Exodus 22:19–26; 23:6; see further below).'
  - where: 'thread'
    claim: 'The enemy’s animals stand among the court rules because enmity must not lead to injustice'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/23.htm'
    quote: 'personal antipathy, enmity, and hatred were not to lead them to injustice or churlish behaviour.'
  - where: 'thread'
    claim: 'The land sabbath is in 23:10–12, and what benefits the land benefits the poor'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'What was beneficial to the land on which the Israelites resided would consequently benefit the poor and the vulnerable.'
  - where: 'thread'
    claim: 'Verse 13 is the boundary between the two series of laws'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/23.htm'
    quote: 'This forms a very fitting boundary line between the two series of mishpatim, inasmuch as the observance and maintenance of both of them depended upon the attitude in which Israel stood towards Jehovah.'
  - where: 'thread'
    claim: 'The warning of verse 13 is the transition to the laws about Israel’s relation to the LORD (the feasts)'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/23.htm'
    quote: 'a warning, which forms the transition to the relation of Israel to Jehovah'
  - where: 'thread'
    claim: 'The code closes with blessings in 23:20–33'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'The Covenant Code closes with an enumeration of blessings (Exodus 23:20–33).'
  - where: 'thread'
    claim: 'The blessings are conditioned on obedience; D&C 82:10 and 130:20–21 state the principle'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'However, all of it is predicated on obedience or “hearing” (Exodus 23:21–22), which should cause us to recall what is taught in Doctrine and Covenants 130:20–21'
  - where: 'thread'
    claim: 'D&C 82:10 summarizes the point of 23:20–33'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'These two statements are perhaps the clearest and most concise articulations of the principle of covenant obedience in the scriptures, and they summarize the point of Exodus 23:20–33.'

  # ---------- plain words ----------
  - where: 'section 1 plain'
    claim: 'Verse 2: do not follow the crowd or side with the majority in a lawsuit'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/23?lang=eng'
    quote: 'OR Thou shalt not follow the crowd to do evil, neither speak up in a lawsuit, being influenced by the majority, to subvert justice.'
  - where: 'section 1 plain'
    claim: 'Verse 5: do not leave the enemy to it; help him free the animal'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2023&version=NRSVUE'
    quote: 'When you see the donkey of one who hates you struggling under its burden and you would hold back from setting it free, you must help to set it free.'
  - where: 'section 1 plain'
    claim: 'Verses 6–7: “cause” is a lawsuit and “matter” a charge'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/23?lang=eng'
    quote: 'OR charges or lawsuit.'
  - where: 'section 1 plain'
    claim: 'Verse 8: the gift is a bribe'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/23?lang=eng'
    quote: 'HEB bribe. TG Bribe.'
  - where: 'section 2 plain'
    claim: 'Verse 13: “be circumspect” is take heed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/23?lang=eng'
    quote: 'OR take heed.'
  - where: 'section 3 plain'
    claim: 'Verse 15: “empty” is without offerings'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/23?lang=eng'
    quote: 'IE without offerings.'
  - where: 'section 3 plain'
    claim: 'Verse 19: “seethe” is cook'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/23?lang=eng'
    quote: 'OR cook … ; i.e., Israel must not do such fertility-cult practices.'
  - where: 'section 4 plain'
    claim: 'Verse 26: “cast their young” is miscarry'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/23?lang=eng'
    quote: 'OR None shall miscarry.'
  - where: 'section 5 plain'
    claim: 'Verse 31: the river is the Euphrates'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/23?lang=eng'
    quote: 'IE the Euphrates.'
  - where: 'section 5 plain'
    claim: 'Verse 29: the beasts are wild beasts'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/23?lang=eng'
    quote: 'OR wild beasts.'

  # ---------- note 23:3 ----------
  - where: 'note 23:3 “Not favoring the poor in court, and the JST reading”'
    claim: 'The Joseph Smith Translation reads “wicked man” for “poor man”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/23?lang=eng'
    quote: 'JST Ex. 23:3 … wicked man … D&C 56:17 (17–18).'
  - where: 'note 23:3 “Not favoring the poor in court, and the JST reading”'
    claim: '“Countenance” is favor; the footnote points to Leviticus 19:15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/23?lang=eng'
    quote: 'OR favor. Lev. 19:15.'
  - where: 'note 23:3 “Not favoring the poor in court, and the JST reading”'
    claim: 'The pairing of “poor” in verses 3 and 6 seems strange, and the law elsewhere protects the poor'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'this juxtaposition of “poor” in Exodus 23:3 with “poor” in Exodus 23:6 that forbids “wrest[ing] the judgment [mišpaṭ, or justice] of thy poor in his cause” seems strange. The Mosaic legislation elsewhere—particularly in the Deuteronomic Code (see below)—in fact, provides certain protections and perhaps even some privileges to the poor.'
  - where: 'note 23:3 “Not favoring the poor in court, and the JST reading”'
    claim: 'The JST change accords with Deuteronomy and the Zion theology of Moses 7:18'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'The JST alteration of “poor” to “wicked” here accords with both Deuteronomy and the Zion theology articulated in JST Genesis (Moses 7:18).'
  - where: 'note 23:3 “Not favoring the poor in court, and the JST reading”'
    claim: 'The impartiality of verses 1–2 and 6 should produce the fairness a Zion people needs'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'the impartiality mandated for the Israelites in Exodus 23:1–2, 6 should produce the ethic of fairness and equality necessary for the establishment of a “Zion” people (Moses 7:18).'
  - where: 'note 23:3 “Not favoring the poor in court, and the JST reading”'
    claim: 'Moses 7:18: no poor among them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/7?lang=eng'
    quote: 'and there was no poor among them.'

  # ---------- note 23:5 ----------
  - where: 'note 23:5 “Helping an enemy with his fallen animal”'
    claim: 'The Hebrew verb is used first for leaving and then for loosing'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/23.htm'
    quote: 'is used in the first instance in the sense of leaving it alone, leaving it in a helpless condition, and immediately afterwards in the sense of undoing or letting loose.'
  - where: 'note 23:5 “Helping an enemy with his fallen animal”'
    claim: 'A modern translation of verse 5'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2023&version=NRSVUE'
    quote: 'When you see the donkey of one who hates you struggling under its burden and you would hold back from setting it free, you must help to set it free.'
  - where: 'note 23:5 “Helping an enemy with his fallen animal”'
    claim: 'Deuteronomy 22:4 gives the rule for a brother’s animal'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/22?lang=eng'
    quote: 'Thou shalt not see thy brother’s ass or his ox fall down by the way, and hide thyself from them: thou shalt surely help him to lift them up again.'
  - where: 'note 23:5 “Helping an enemy with his fallen animal”'
    claim: 'Why the law is worded as ceasing to leave'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/23.htm'
    quote: 'is chosen because the ordinary course, which the natural man adopts, is to leave an enemy to take care of his own affairs, without troubling about either him or his difficulties.'
  - where: 'note 23:5 “Helping an enemy with his fallen animal”'
    claim: 'Why the law stands among the rules for court'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/23.htm'
    quote: 'personal antipathy, enmity, and hatred were not to lead them to injustice or churlish behaviour.'
  - where: 'note 23:5 “Helping an enemy with his fallen animal”'
    claim: 'These verses show that picturing the law as fierce retaliation is inaccurate; they require doing good'
    key: ot-manual-ex-21-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-21-24-31-35-the-mosaic-law-a-preparatory-gospel?lang=eng'
    quote: 'They picture a system of fierce retaliation and brutal punishment. In Exodus 23:1–8 is an excellent example of the inaccuracy of that conception.'

  # ---------- note 23:9 ----------
  - where: 'note 23:9 “Israel knows the heart of a stranger”'
    claim: 'The stranger is the foreign migrant'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'exemplified here by the foreign migrant (“stranger”), the widow, the orphan, and the poor'
  - where: 'note 23:9 “Israel knows the heart of a stranger”'
    claim: 'A modern translation says “resident alien”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2023&version=NRSVUE'
    quote: 'You shall not oppress a resident alien; you know the heart of an alien, for you were aliens in the land of Egypt.'
  - where: 'note 23:9 “Israel knows the heart of a stranger”'
    claim: 'The command and its reason stand also at 22:21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/22?lang=eng'
    quote: 'Thou shalt neither vex a stranger, nor oppress him: for ye were strangers in the land of Egypt.'
  - where: 'note 23:9 “Israel knows the heart of a stranger”'
    claim: 'The reminder of Egypt taught Israel to care for the weakest with sympathy'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'helped them to recognize their obligation to care for their society’s weakest members and to do so with sympathy'
  - where: 'note 23:9 “Israel knows the heart of a stranger”'
    claim: 'Israel could not be the LORD’s own people while abusing the weakest'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'they could not become Yahweh’s “special possession” or “sealed people”[23] if they treated others unethically and abused the weakest among them.'

  # ---------- note 23:11 ----------
  - where: 'note 23:11 “The seventh year, a sabbath for the land”'
    claim: 'Every seventh year was consecrated; the land was the Lord’s and kept a Sabbath; produce left to the poor and beasts'
    key: bd-sabbatical-year
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sabbatical-year?lang=eng'
    quote: 'As was the seventh day in every week and the seventh month in every year, so also was every seventh year consecrated to the Lord. The land, inasmuch as it was the Lord’s, was to keep a Sabbath unto Him (Lev. 25:2–7).'
  - where: 'note 23:11 “The seventh year, a sabbath for the land”'
    claim: 'What grew of itself was left for the poor and the beasts'
    key: bd-sabbatical-year
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sabbatical-year?lang=eng'
    quote: 'In this year the self-sown produce of the arable lands was to be left for the poor and the beasts of the field'
  - where: 'note 23:11 “The seventh year, a sabbath for the land”'
    claim: 'Leviticus 25 gives the law at length'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/25?lang=eng'
    quote: 'But in the seventh year shall be a sabbath of rest unto the land, a sabbath for the Lord: thou shalt neither sow thy field, nor prune thy vineyard.'
  - where: 'note 23:11 “The seventh year, a sabbath for the land”'
    claim: 'Deuteronomy adds a release of debts; both laws provided for the poor'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'Both the year of the land Sabbath and the year of the Lord’s release provided for the poor (compare Exodus 23:11 with Deuteronomy 15:4).'
  - where: 'note 23:11 “The seventh year, a sabbath for the land”'
    claim: 'The law was habitually broken before the exile'
    key: bd-sabbatical-year
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sabbatical-year?lang=eng'
    quote: 'The law of the sabbatical year was habitually broken by the Jews for a long period before the Babylonian exile.'
  - where: 'note 23:11 “The seventh year, a sabbath for the land”'
    claim: 'The seventy years of exile made up for the unkept sabbaths'
    key: bd-sabbatical-year
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sabbatical-year?lang=eng'
    quote: 'The 70 years of exile and the land’s desolation were regarded as making up for the unobserved Sabbaths of the land (2 Chr. 36:21).'

  # ---------- note 23:14 ----------
  - where: 'note 23:14 “The three feasts”'
    claim: 'The three feasts are Unleavened Bread, Weeks, and Tabernacles, when all males appeared before the Lord'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'The law commanded that three times a year all the males of the covenant people were to appear before the Lord in the place that He should choose; that is, in the Feast of Unleavened Bread, in the Feast of Weeks, and in the Feast of Tabernacles'
  - where: 'note 23:14 “The three feasts”'
    claim: 'The Hebrew word for these feasts means a pilgrim feast'
    key: bdb
    url: 'https://biblehub.com/hebrew/2282.htm'
    quote: '1 feast, especially one observed by a pilgrimage (Exodus 23:14,17):'
  - where: 'note 23:14 “The three feasts”'
    claim: 'The feast of unleavened bread was added to the Passover and is its usual name'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'A seven days’ feast of unleavened bread (hence its usual name), with special offerings, was added (Ex. 12:15; Num. 28:16–25).'
  - where: 'note 23:14 “The three feasts”'
    claim: 'The feast of harvest is Pentecost, fifty days after Passover, during the wheat harvest; Deuteronomy calls it the feast of weeks'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'Fifty days (Lev. 23:16) after the Feast of the Passover, the Feast of Pentecost was kept. During those 50 days the harvest of wheat was being gathered in. It is called (Ex. 23:16) “the feast of harvest, the firstfruits of thy labours” and (Deut. 16:10) “the feast of weeks.”'
  - where: 'note 23:14 “The three feasts”'
    claim: 'Ingathering is the Feast of Tabernacles, in the seventh month, reckoned the most joyful'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'The Feast of Tabernacles (Lev. 23:34) or of Ingathering (Ex. 23:16), called by later Jews the Feast (John 7:37) and reckoned by them to be the greatest and most joyful of all, was celebrated on the 15th to 21st days of the seventh month.'
  - where: 'note 23:14 “The three feasts”'
    claim: 'What Tabernacles celebrated'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'The events celebrated were the sojourning of the children of Israel in the wilderness (Lev. 23:43) and the gathering-in of all the fruits of the year (Ex. 23:16).'
  - where: 'note 23:14 “The three feasts”'
    claim: '“Empty” means without offerings'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/23?lang=eng'
    quote: 'IE without offerings.'
  - where: 'note 23:14 “The three feasts”'
    claim: 'The law presupposed settled peace and was not generally observed; Elkanah went up once a year'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'This ordinance presupposed a state of settled peace rarely if ever realized in the history of the people in Old Testament times. It was not and could not be generally or even frequently observed. Elkanah, a pious Israelite of the times of the later Judges, went up to Shiloh once a year (1 Sam. 1:3).'
  - where: 'note 23:14 “The three feasts”'
    claim: 'Exodus 34:23–24 repeats the law with a promise that the land will be safe'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'neither shall any man desire thy land, when thou shalt go up to appear before the Lord thy God thrice in the year.'

  # ---------- note 23:19 ----------
  - where: 'note 23:19 “A kid boiled in its mother’s milk”'
    claim: 'The footnote: “seethe” is cook, and the practice belonged to fertility cults'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/23?lang=eng'
    quote: 'OR cook … ; i.e., Israel must not do such fertility-cult practices. Ex. 34:26.'
  - where: 'note 23:19 “A kid boiled in its mother’s milk”'
    claim: 'The law is repeated in Exodus 34:26 and Deuteronomy 14:21, the latter among food laws'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/23.htm'
    quote: 'A kid not to be boiled in its mother’s milk. Repeated verbatim, in the "" Exodus 34:26 b, and Deuteronomy 14:21 b.'
  - where: 'note 23:19 “A kid boiled in its mother’s milk”'
    claim: 'Deuteronomy 14:21 sets the command after a food law'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/14?lang=eng'
    quote: 'Ye shall not eat of any thing that dieth of itself'
  - where: 'note 23:19 “A kid boiled in its mother’s milk”'
    claim: 'From its place beside ritual rules the law had a religious motive'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/23.htm'
    quote: 'The law, to judge from its position beside ritual injunctions, will have had not, as might have been supposed, a humanitarian, but a religious motive.'
  - where: 'note 23:19 “A kid boiled in its mother’s milk”'
    claim: 'Most supposed it aimed at a superstitious custom, perhaps a charm for fertility of fields'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/23.htm'
    quote: 'Di. and most suppose then it is aimed against some superstitious custom—perhaps (Maimonides; Spencer, Legg. Hebr. (1686), II. viii.; al.) that of using milk thus prepared as a charm for rendering fields and orchards more productive.'
  - where: 'note 23:19 “A kid boiled in its mother’s milk”'
    claim: 'Kid cooked in milk was likely an ordinary dish'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/23.htm'
    quote: 'it is very likely that by way of improving the flavour they were sometimes cooked in milk.'
  - where: 'note 23:19 “A kid boiled in its mother’s milk”'
    claim: 'Keil: the act shows contempt for the relation of parent and young'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/23.htm'
    quote: 'as indicating a contempt of the relation which God has established and sanctified between parent and young, and thus subverting the divine ordinances.'
  - where: 'note 23:19 “A kid boiled in its mother’s milk”'
    claim: 'Jewish tradition read it as a general prohibition of meat prepared with milk'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/23.htm'
    quote: 'In the Targum, Mishnah, etc., it is regarded as a general prohibition against eating flesh prepared with milk.'

