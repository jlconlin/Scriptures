    url: 'https://biblehub.com/hebrew/6880.htm'
    quote: 'noun feminine collective hornets (? as wounding, prostrating; Late Hebrew = Biblical Hebrew); — allies of Israel;'
  - where: 'note 23:28 “The hornets, and little by little”'
    claim: 'The word occurs only in Exodus 23:28, Joshua 24:12 and Deuteronomy 7:20'
    key: bdb
    url: 'https://biblehub.com/hebrew/6880.htm'
    quote: 'Exodus 23:28; Joshua 24:12 (both E), Deuteronomy 7:20.'
