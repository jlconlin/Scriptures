  # ---------- note 23:33 ----------
  - where: 'note 23:33 “Why the nations of Canaan were to be driven out”'
    claim: 'The footnotes to verses 31 and 33 point to 1 Nephi 17 and Judges 2:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/23?lang=eng'
    quote: '1 Ne. 17:35 (32–38).'
  - where: 'note 23:33 “Why the nations of Canaan were to be driven out”'
    claim: 'Deuteronomy 9:4–5: not for Israel’s righteousness but for the nations’ wickedness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/9?lang=eng'
    quote: 'Not for thy righteousness, or for the uprightness of thine heart, dost thou go to possess their land: but for the wickedness of these nations the Lord thy God doth drive them out from before thee'
  - where: 'note 23:33 “Why the nations of Canaan were to be driven out”'
    claim: 'The conquest is one of the most challenging parts of the Old Testament; the Book of Mormon gives the reason'
    key: scripture-helps-violence
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/52-violence-and-destruction-in-the-old-testament?lang=eng'
    quote: 'One of the most challenging parts of the Old Testament is God’s command for the Israelites to “smite and utterly destroy” the nations that lived in the land of Canaan. From the Book of Mormon we learn that the destruction of the Canaanites was a consequence of their rebellion against the Lord.'
  - where: 'note 23:33 “Why the nations of Canaan were to be driven out”'
    claim: 'Not an impulsive act; a response to generations of rebellion; justice and protection of the covenant people'
    key: scripture-helps-violence
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/52-violence-and-destruction-in-the-old-testament?lang=eng'
    quote: 'The destruction of Canaanite cities was not an impulsive act of God’s wrath. It was a response to generations of rebellion against God and reflects both His justice and His desire to protect His covenant people from the corrupting influence of those who had completely rejected Him.'
  - where: 'note 23:33 “Why the nations of Canaan were to be driven out”'
    claim: 'The appendix cites Abraham being told the iniquity of Canaan was not yet full'
    key: scripture-helps-violence
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/52-violence-and-destruction-in-the-old-testament?lang=eng'
    quote: 'In fact, centuries earlier, the Lord told Abraham that his descendants would reside in Egypt for hundreds of years because the iniquity of those in Canaan was not yet full.'
  - where: 'note 23:33 “Why the nations of Canaan were to be driven out”'
    claim: 'In Judges 2 an angel rebukes Israel for making leagues with the people of the land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/2?lang=eng'
    quote: 'And ye shall make no league with the inhabitants of this land; ye shall throw down their altars: but ye have not obeyed my voice: why have ye done this?'

