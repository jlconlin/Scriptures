chapter: 22
claims:
  # ---------- setting / thread ----------
  - where: 'setting'
    claim: 'The judgments run from 20:22 to 23:33 and are identified with the book of the covenant of 24:7'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'This has led many scholars to suggest that the foregoing legislation constitutes the book of the covenant mentioned in Exodus 24:7'
  - where: 'setting'
    claim: 'The Covenant Code is Exodus 20:22–23:33 and looks ahead to the land'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'First, the Covenant Code (Exodus 20:22–23:33) legislation constitutes an ethos for the establishment of the Israelites in the wilderness as a covenant people—and holding them together as such—with a view of their eventual entry into the land of promise.'
  - where: 'setting'
    claim: 'Malachi names the widow, the fatherless and the stranger among those whose oppressors the Lord will witness against'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/3?lang=eng'
    quote: 'against those that oppress the hireling in his wages, the widow, and the fatherless, and that turn aside the stranger from his right'
  - where: 'setting'
    claim: 'Deuteronomy 24 restates the laws on pledges and on the stranger, fatherless and widow'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/24?lang=eng'
    quote: 'Thou shalt not pervert the judgment of the stranger, nor of the fatherless; nor take a widow’s raiment to pledge'
  - where: 'thread'
    claim: 'Case (casuistic) laws are conditional sentences that often begin with “if”'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'Casuistic laws or statutes, on the other hand, are commandments that govern behavior on a case-by-case basis. These statutes are worded as conditional sentences and often begin with the word “if.”'
  - where: 'thread'
    claim: 'Direct (apodictic) commands are unconditional'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'Apodictic laws are moreover characterized by their unconditionality—they prescribe what is to be done in all situations.'
  - where: 'thread'
    claim: 'The property statutes are rules for holding a community together, and restitution secured its peace'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'can be broadly viewed as rules necessary to holding a community together—that is, establishing a community ethos.'
  - where: 'thread'
    claim: 'Restitution ensured the shalom of the community'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'In other words, restitution ensured the šālôm—peace, integrity—of the community.'
  - where: 'thread'
    claim: 'Israel could not be the LORD’s own people while abusing the weakest'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'they could not become Yahweh’s “special possession” or “sealed people”[23] if they treated others unethically and abused the weakest among them.'

  # ---------- sections ----------
  - where: 'section 1 plain'
    claim: '“Breaking up” is breaking in'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/22?lang=eng'
    quote: '“up”: OR in.'
  - where: 'section 1 plain'
    claim: 'Verses 2–3 speak of bloodguilt on the one who kills the thief'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/22.htm'
    quote: 'i.e., in the latter case the person killing him drew upon himself blood-guiltiness'
  - where: 'section 1 plain'
    claim: 'Verse 5: the man lets his beast loose and it feeds'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/22?lang=eng'
    quote: '“put”: HEB let his beast loose and it shall feed.'
  - where: 'section 1 plain'
    claim: '“Corn” is grain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/22?lang=eng'
    quote: '“corn”: HEB grain.'
  - where: 'section 2 plain'
    claim: '“Make it good” is make restitution'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/22?lang=eng'
    quote: 'IE make restitution.'
  - where: 'section 3 plain'
    claim: 'The dowry is a bride-price'
    key: bdb
    url: 'https://biblehub.com/hebrew/4119.htm'
    quote: 'מֹ֫הַר noun masculine purchase-price of wife'
  - where: 'section 4 plain'
    claim: '“Usury” is interest; “wax hot” is be aroused'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/22?lang=eng'
    quote: '“usury”: OR interest. TG Usury.'
  - where: 'section 4 plain'
    claim: '“Covering only” is only covering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/22?lang=eng'
    quote: '“covering only”: OR only covering.'
  - where: 'section 5 plain'
    claim: 'The Joseph Smith Translation reads “against God” in verse 28'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/22?lang=eng'
    quote: 'JST Ex. 22:28 … against God …'
  - where: 'section 5 plain'
    claim: '“Liquors” is the outflow of the presses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/22?lang=eng'
    quote: '“liquors”: OR outflow of the presses.'

  # ---------- note 22:1 ----------
  - where: 'note 22:1 “Why five for an ox and four for a sheep”'
    claim: 'One reading printed in the manual: a sheep’s theft is of present and future value'
    key: ot-manual-ex-21-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-21-24-31-35-the-mosaic-law-a-preparatory-gospel?lang=eng'
    quote: 'To steal a sheep is to steal the present and future value of a man’s property.'
  - where: 'note 22:1 “Why five for an ox and four for a sheep”'
    claim: 'The ox is dearer because it was trained to work'
    key: ot-manual-ex-21-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-21-24-31-35-the-mosaic-law-a-preparatory-gospel?lang=eng'
    quote: 'The ox requires a higher rate of restitution, five-fold, because the ox was trained to pull carts, and to plow, and was used for a variety of farm tasks.'
  - where: 'note 22:1 “Why five for an ox and four for a sheep”'
    claim: 'Judgment on the offender and restitution to the offended'
    key: ot-manual-ex-21-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-21-24-31-35-the-mosaic-law-a-preparatory-gospel?lang=eng'
    quote: 'In all these cases, there is not only judgment by God against the offender but also restitution to the offended.'
  - where: 'note 22:1 “Why five for an ox and four for a sheep”'
    claim: 'Double if the animal is alive in his hand, fourfold or fivefold if killed or sold'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/22.htm'
    quote: 'In the latter case, the thief was to restore piece for piece twofold (Exodus 22:4); in the former, he was to restore an ox fivefold and a small animal (a sheep or a goat) fourfold (Exodus 22:1).'
  - where: 'note 22:1 “Why five for an ox and four for a sheep”'
    claim: 'One older reading: the difference lies in the educational purpose of the law'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/22.htm'
    quote: 'The reason can only have lain in the educational purpose of the law: viz., in the intention to lead the thief to repent of his crime, to acknowledge his guilt, and to restore what he had stolen.'
  - where: 'note 22:1 “Why five for an ox and four for a sheep”'
    claim: 'Repentance and return were possible only while he still had the animal'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/22.htm'
    quote: 'this was always in his power; but the possibility was gone as soon as it had either been consumed or sold'
  - where: 'note 22:1 “Why five for an ox and four for a sheep”'
    claim: 'The thief is sold so that his labor pays the compensation'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/22.htm'
    quote: 'i.e., for the value of what he had stolen, that he might earn by his labour the compensation to be paid.'
  - where: 'note 22:1 “Why five for an ox and four for a sheep”'
    claim: 'The Church’s footnote on “four” points to David’s ruling; Nathan’s story is of a poor man’s one ewe lamb'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/12?lang=eng'
    quote: 'And he shall restore the lamb fourfold, because he did this thing, and because he had no pity.'

  # ---------- note 22:2 ----------
  - where: 'note 22:2 “No blood be shed for him means no bloodguilt”'
    claim: 'The Hebrew of verse 2 ends “there is no blood to him,” with blood in the plural'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'דָּמִֽים'
  - where: 'note 22:2 “No blood be shed for him means no bloodguilt”'
    claim: 'Literal rendering; “him” is the one who struck the thief'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/22.htm'
    quote: 'there shall be no blood to him (the person smiting him); if the sun has risen upon him (the thief breaking in), there is blood to him'
  - where: 'note 22:2 “No blood be shed for him means no bloodguilt”'
    claim: 'The plural means drops of blood, blood shed, and stands for bloodguilt'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/22.htm'
    quote: 'lit., drops of blood, blood shed'
  - where: 'note 22:2 “No blood be shed for him means no bloodguilt”'
    claim: '“For him” is the householder in verses 2 and 3; “upon him” is the thief; blood implies bloodguiltiness'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/22.htm'
    quote: 'for him] i.e. for the householder, if he kills him in the darkness.'
  - where: 'note 22:2 “No blood be shed for him means no bloodguilt”'
    claim: 'The Hebrew pictures digging through'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/22.htm'
    quote: 'breaking in] digging through: cf. Jeremiah 2:34, Job 24:16, Matthew 6:19 RVm.'
  - where: 'note 22:2 “No blood be shed for him means no bloodguilt”'
    claim: 'In verse 3 “upon him” is the thief and “for him” the householder'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/22.htm'
    quote: '3a. upon him] i.e. upon the thief.'
  - where: 'note 22:2 “No blood be shed for him means no bloodguilt”'
    claim: 'The Church’s footnote: “up” or “in”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/22?lang=eng'
    quote: '“up”: OR in.'
  - where: 'note 22:2 “No blood be shed for him means no bloodguilt”'
    claim: 'Why the thief by night differs'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/22.htm'
    quote: 'the power and intention of a nightly thief are uncertain, and whether he may not have come for the purpose of committing murder'
  - where: 'note 22:2 “No blood be shed for him means no bloodguilt”'
    claim: 'By day even a thief’s life was to be spared'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/22.htm'
    quote: 'because even the life of a thief was to be spared, as he could be punished for his crime, and what was stolen be restored'

  # ---------- note 22:16 ----------
  - where: 'note 22:16 “The dowry is a bride-price”'
    claim: 'Mohar is the purchase-price of a wife; it stands in Genesis 34:12 and Exodus 22:17 (Hebrew 22:16)'
    key: bdb
    url: 'https://biblehub.com/hebrew/4119.htm'
    quote: 'מֹ֫הַר noun masculine purchase-price of wife'
  - where: 'note 22:16 “The dowry is a bride-price”'
    claim: 'The noun stands in Genesis 34:12'
    key: bdb
    url: 'https://biblehub.com/hebrew/4119.htm'
    quote: 'Genesis 34:12 (J; "" מַתָּן) 1 Samuel 18:25; construct מֹהַר הַבְּתוּלֹת Exodus 22:16 (E).'
  - where: 'note 22:16 “The dowry is a bride-price”'
    claim: '“Endow” in verse 16 is the cognate verb (Strong’s 4117), used twice'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'מָהֹ֛ר'
  - where: 'note 22:16 “The dowry is a bride-price”'
    claim: 'The verb means to acquire by paying the purchase-price, and stands in this verse (Hebrew 22:15)'
    key: bdb
    url: 'https://biblehub.com/hebrew/4117.htm'
    quote: 'verb denominative acquire by paying purchase-price'
  - where: 'note 22:16 “The dowry is a bride-price”'
    claim: 'Shechem’s offer for Dinah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/34?lang=eng'
    quote: 'Ask me never so much dowry and gift'

  # ---------- note 22:18 ----------
  - where: 'note 22:18 “The Joseph Smith Translation reads murderer”'
    claim: 'The JST reading'
    key: jst-ex-22
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-ex/22?lang=eng'
    quote: 'Thou shalt not suffer a murderer to live.'
  - where: 'note 22:18 “The Joseph Smith Translation reads murderer”'
    claim: 'The Hebrew word is a feminine participle, “sorceress”'
    key: bdb
    url: 'https://biblehub.com/hebrew/3784.htm'
    quote: 'feminine singular מְכַשֵּׁפָה = sorceress Exodus 22:17 (E)'
  - where: 'note 22:18 “The Joseph Smith Translation reads murderer”'
    claim: 'The Church’s footnote: a sorceress or a sorcerer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/22?lang=eng'
    quote: 'IE a sorceress or a sorcerer. JST Ex. 22:18 … murderer … TG Sorcery.'
  - where: 'note 22:18 “The Joseph Smith Translation reads murderer”'
    claim: 'What the change reflects'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'This alteration reflects the notion, consistent elsewhere in the Mosaic legislation, that murder constitutes a capital crime.'
  - where: 'note 22:18 “The Joseph Smith Translation reads murderer”'
    claim: 'Witchcraft conceivably forgivable, offered as an inference'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'Apparently, witchcraft—though a grievous sin—is conceivably forgivable (compare Deuteronomy 18:10–12).'
  - where: 'note 22:18 “The Joseph Smith Translation reads murderer”'
    claim: 'Deliberate murder is a capital offense in 21:12'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'Deliberate murder constituted an unambiguous capital offense (Exodus 21:12, 14)'

  # ---------- note 22:20 ----------
  - where: 'note 22:20 “Utterly destroyed means put under the ban”'
    claim: 'The verb means ban, devote, exterminate'
    key: bdb
    url: 'https://biblehub.com/hebrew/2763.htm'
    quote: 'verb Hiph`il ban, devote, exterminate'
  - where: 'note 22:20 “Utterly destroyed means put under the ban”'
    claim: 'Most often of Canaanite cities'
    key: bdb
    url: 'https://biblehub.com/hebrew/2763.htm'
    quote: '1 most often of devoting to destruction cities of Canaanites and other neighbours of Israel'
  - where: 'note 22:20 “Utterly destroyed means put under the ban”'
    claim: 'Also of Israelites, for worshipping other gods'
    key: bdb
    url: 'https://biblehub.com/hebrew/2763.htm'
    quote: 'd. so also of devoting even Israelites: a city of Israel for worshipping other gods Deuteronomy 13:16'
  - where: 'note 22:20 “Utterly destroyed means put under the ban”'
    claim: 'The same passive form stands in Leviticus 27:29'
    key: bdb
    url: 'https://biblehub.com/hebrew/2763.htm'
    quote: 'Hoph`al Imperfect יָחֳרַם Leviticus 27:29; Ezra 10:8; יָחֳרָ֑ם Exodus 22:19'
  - where: 'note 22:20 “Utterly destroyed means put under the ban”'
    claim: 'The verb of verse 20 (Strong’s 2763) is not the “put to death” of verse 19'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'יָֽחֳרָ֑ם'
  - where: 'note 22:20 “Utterly destroyed means put under the ban”'
    claim: 'The law again forbids other gods'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'This legislation again forbids worshipping or tolerating other gods (Exodus 22:19).'
  - where: 'note 22:20 “Utterly destroyed means put under the ban”'
    claim: 'Leviticus 27:29'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/27?lang=eng'
    quote: 'None devoted, which shall be devoted of men, shall be redeemed; but shall surely be put to death.'

  # ---------- note 22:21 ----------
  - where: 'note 22:21 “The stranger, and the reason Israel is given”'
    claim: 'Who the stranger is'
    key: bd-stranger
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/stranger?lang=eng'
    quote: 'The word is frequently used to denote a man of non-Israelite birth, resident in the promised land with the permission of the Israelite authorities.'
  - where: 'note 22:21 “The stranger, and the reason Israel is given”'
    claim: 'What the provisions were for'
    key: bd-stranger
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/stranger?lang=eng'
    quote: 'all of which were intended to secure for them justice and fair treatment'
  - where: 'note 22:21 “The stranger, and the reason Israel is given”'
    claim: 'The Hebrew word: a sojourner with no inherited rights; used of Israel in Egypt from Genesis 15:13'
    key: bdb
    url: 'https://biblehub.com/hebrew/1616.htm'
    quote: '1 sojourner, temporary dweller, new-comer (no inherited rights)'
  - where: 'note 22:21 “The stranger, and the reason Israel is given”'
    claim: 'The word is used of Israel in Egypt in Genesis 15:13 and here'
    key: bdb
    url: 'https://biblehub.com/hebrew/1616.htm'
    quote: 'of Israel in Egypt Genesis 15:13; Exodus 22:20; Exodus 23:9 (all J E) Leviticus 19:34 (H) Deuteronomy 10:19'
  - where: 'note 22:21 “The stranger, and the reason Israel is given”'
    claim: 'The reminder taught sympathy'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'The reminder that the Israelites had themselves lived as marginalized, enslaved, and displaced “strangers” in Egypt helped them to recognize their obligation to care for their society’s weakest members and to do so with sympathy'
  - where: 'note 22:21 “The stranger, and the reason Israel is given”'
    claim: 'Leviticus 19:34 and Deuteronomy 10:19 give the same reason with a command to love'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/19?lang=eng'
    quote: 'But the stranger that dwelleth with you shall be unto you as one born among you, and thou shalt love him as thyself; for ye were strangers in the land of Egypt'

  # ---------- note 22:23 ----------
  - where: 'note 22:23 “The LORD Himself answers for the widow and the fatherless”'
    claim: 'No human penalty; the Lord reserves it'
    key: ot-manual-ex-21-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-21-24-31-35-the-mosaic-law-a-preparatory-gospel?lang=eng'
    quote: 'In this case, however, rulers were not allowed to impose the death penalty. The Lord reserved that right to Himself (see v. 24).'
  - where: 'note 22:23 “The LORD Himself answers for the widow and the fatherless”'
    claim: '“Afflict” in 22:22–23 is the verb of 1:11 (Strong’s 6031)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'תְעַנֶּ֖ה'
  - where: 'note 22:23 “The LORD Himself answers for the widow and the fatherless”'
    claim: '“Cry” in 22:23 is the noun of 3:7 (Strong’s 6818)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'צַעֲקָתֽ/וֹ'
  - where: 'note 22:23 “The LORD Himself answers for the widow and the fatherless”'
    claim: 'Israel had been the stranger, the widow and the orphan'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'The Israelites had collectively been “the stranger,” “the widow,” and “the orphan” (as it were) in times past'
  - where: 'note 22:23 “The LORD Himself answers for the widow and the fatherless”'
    claim: 'The pair becomes a name for the most vulnerable'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'The “widow and the fatherless [orphan]” becomes a metonymy throughout the Hebrew Bible for the most vulnerable members of its society'
  - where: 'note 22:23 “The LORD Himself answers for the widow and the fatherless”'
    claim: 'Their treatment is a spiritual barometer; James and D&C 83:6 are cited'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'The treatment of a society’s most vulnerable constitutes a kind of spiritual barometer.'
  - where: 'note 22:23 “The LORD Himself answers for the widow and the fatherless”'
    claim: 'James 1:27 speaks of pure religion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/james/1?lang=eng'
    quote: 'Pure religion and undefiled before God and the Father is this, To visit the fatherless and widows in their affliction'

  # ---------- note 22:25 ----------
  - where: 'note 22:25 “Usury here is any interest, on a loan to the poor”'
    claim: 'In biblical English usury often means any interest'
    key: bd-usury
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/usury?lang=eng'
    quote: 'In biblical English it often means simply charging interest on a loan.'
  - where: 'note 22:25 “Usury here is any interest, on a loan to the poor”'
    claim: 'The restriction concerns lending within the covenant people'
    key: bd-usury
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/usury?lang=eng'
    quote: 'The restriction, however, seems to be when lending to a fellow church member. There is no clear restriction against charges for loans to others.'
  - where: 'note 22:25 “Usury here is any interest, on a loan to the poor”'
    claim: 'Latter-day revelation has no such restriction'
    key: bd-usury
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/usury?lang=eng'
    quote: 'Latter-day revelation does not contain restrictions against interest charges.'
  - where: 'note 22:25 “Usury here is any interest, on a loan to the poor”'
    claim: 'The Hebrew noun'
    key: bdb
    url: 'https://biblehub.com/hebrew/5392.htm'
    quote: 'noun [masculine] interest, usury (literally something bitten off)'
  - where: 'note 22:25 “Usury here is any interest, on a loan to the poor”'
    claim: 'The Church’s footnote gives “interest”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/22?lang=eng'
