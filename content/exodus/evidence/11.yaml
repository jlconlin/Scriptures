chapter: 11
claims:
  - where: 'when'
    claim: 'The ninth plague was three days of darkness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/10?lang=eng'
    quote: 'And Moses stretched forth his hand toward heaven; and there was a thick darkness in all the land of Egypt three days:'
  - where: 'when'
    claim: 'The institution of the Passover and its preparations came between the announcement and the plague; the day of the announcement cannot be fixed'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/11.htm'
    quote: 'the institution of the Passover, the directions of Moses to the people respecting the things which they were to ask for from the Egyptians, and the preparations for the feast of the Passover and the exodus, all came between.'
  - where: 'setting'
    claim: 'Chapter 10 ends with Pharaoh’s threat and Moses’s answer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/10?lang=eng'
    quote: 'And Moses said, Thou hast spoken well, I will see thy face again no more.'
  - where: 'setting'
    claim: 'The plague itself falls in chapter 12, after the Passover instructions'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/12?lang=eng'
    quote: 'And it came to pass, that at midnight the LORD smote all the firstborn in the land of Egypt, from the firstborn of Pharaoh that sat on his throne unto the firstborn of the captive that was in the dungeon; and all the firstborn of cattle.'
  - where: 'setting'
    claim: 'The death of Pharaoh’s firstborn was announced to Moses before he returned to Egypt; the Church’s footnote at 11:5 points there'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/11?lang=eng'
    quote: '“firstborn”: Ex. 4:23 (21–23).'
  - where: 'setting'
    claim: 'Psalm 78 recalls the smiting of the firstborn'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/78?lang=eng'
    quote: 'And smote all the firstborn in Egypt; the chief of their strength in the tabernacles of Ham:'
  - where: 'setting'
    claim: 'Psalm 105 recalls the smiting of the firstborn'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/105?lang=eng'
    quote: 'He smote also all the firstborn in their land, the chief of all their strength.'
  - where: 'setting'
    claim: 'Hebrews speaks of “he that destroyed the firstborn”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/11?lang=eng'
    quote: 'Through faith he kept the passover, and the sprinkling of blood, lest he that destroyed the firstborn should touch them.'
  - where: 'thread'
    claim: 'The Church’s footnote at “thrust” in 11:1 points to 12:39, where Israel is thrust out'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/11?lang=eng'
    quote: '“thrust”: Ex. 12:39.'
  - where: 'thread'
    claim: 'Chapter 12 has the great cry and the asking for silver and gold'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/12?lang=eng'
    quote: 'And Pharaoh rose up in the night, he, and all his servants, and all the Egyptians; and there was a great cry in Egypt; for there was not a house where there was not one dead.'
  - where: 'thread'
    claim: 'Verse 8’s prediction that Pharaoh’s ministers will beg Israel to leave is answered in 12:31–33'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/11.htm'
    quote: 'Then the Pharaoh’s ministers themselves will come humbly to Moses, and beg him and his people to leave Egypt; cf. Exodus 12:31-33.'
  - where: 'thread'
    claim: 'Some earlier plagues spared Goshen (here the hail)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/9?lang=eng'
    quote: 'Only in the land of Goshen, where the children of Israel were, was there no hail.'
  - where: 'thread'
    claim: 'Verses 9–10 close the account of the dealings with Pharaoh that began at 7:8; what was predicted at 7:3 and 4:21 had come to pass'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/11.htm'
    quote: 'In Exodus 11:9 and Exodus 11:10 the account of Moses’ negotiations with Pharaoh, which commenced at Exodus 7:8, is brought to a close. What God predicted to His messengers immediately before sending them to Pharaoh (Exodus 7:3) … had now come to pass.'
  - where: 'thread'
    claim: 'Exodus 7:3–4 has the words of 11:9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/7?lang=eng'
    quote: 'But Pharaoh shall not hearken unto you, that I may lay my hand upon Egypt'
  - where: 'thread'
    claim: 'The Joseph Smith Translation of 11:10 reads “And Pharaoh hardened his heart”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/11?lang=eng'
    quote: '“and”: JST Ex. 11:10 … And Pharaoh hardened his heart …'
  - where: 'section 1 plain'
    claim: '“Borrow” rendered “ask,” after the Church’s footnote'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/11?lang=eng'
    quote: '“borrow”: HEB ask.'
  - where: 'section 2 plain'
    claim: '“Move his tongue” rendered “growl,” and the maidservant’s mill as a handmill, after a modern translation'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2011&version=NRSVUE'
    quote: 'to the firstborn of the female slave who is behind the handmill and all the firstborn of the livestock. … But not a dog shall growl at any of the Israelites'
  - where: 'note 11:1 “When the LORD said this”'
    claim: 'Chapter 10 ends with Moses before Pharaoh, saying he will see his face no more'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/10?lang=eng'
    quote: 'And Moses said, Thou hast spoken well, I will see thy face again no more.'
  - where: 'note 11:1 “When the LORD said this”'
    claim: 'One account has the LORD speak verses 1–3 after Pharaoh dismissed Moses'
    key: ot-minute-ex-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-7-13'
    quote: 'After being thrown out of Pharaoh’s presence, the Lord told Moses that there was one more plague.'
  - where: 'note 11:1 “When the LORD said this”'
    claim: 'A modern translation renders verse 1 as looking back and puts verse 3 in parentheses'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2011&version=NIV'
    quote: 'Now the Lord had said to Moses, “I will bring one more plague on Pharaoh and on Egypt. … 3 (The Lord made the Egyptians favorably disposed(D) toward the people'
  - where: 'note 11:1 “When the LORD said this”'
    claim: 'Pharaoh next speaks to Moses when he calls for him by night'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/12?lang=eng'
    quote: 'And he called for Moses and Aaron by night, and said, Rise up, and get you forth from among my people'
  - where: 'note 11:2 “Asking the Egyptians for silver and gold”'
    claim: 'The Church’s footnotes give “HEB ask” for “borrow” and point from “favour” to the promise at the bush'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/11?lang=eng'
    quote: '“favour”: Ex. 3:21 (21–22).'
  - where: 'note 11:2 “Asking the Egyptians for silver and gold”'
    claim: 'At the bush the instruction named only the women; verses 2–3 here name men and women, the favour the LORD gave, and Moses’s standing'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/11?lang=eng'
    quote: 'Speak now in the ears of the people, and let every man borrow of his neighbour, and every woman of her neighbour … Moreover the man Moses was very great in the land of Egypt'
  - where: 'note 11:2 “Asking the Egyptians for silver and gold”'
    claim: 'At the bush the instruction was given of the women'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/3?lang=eng'
    quote: 'But every woman shall borrow of her neighbour, and of her that sojourneth in her house, jewels of silver, and jewels of gold, and raiment'
  - where: 'note 11:4 “Which midnight, and who goes out”'
    claim: 'The verse says “About midnight will I go out”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/11?lang=eng'
    quote: 'And Moses said, Thus saith the LORD, About midnight will I go out into the midst of Egypt:'
  - where: 'note 11:4 “Which midnight, and who goes out”'
    claim: 'The plague did not fall on the night after the ninth plague ended; which midnight is meant cannot be determined from the verse'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/11.htm'
    quote: 'What midnight is meant, cannot be determined. So much is certain, however, that the last decisive blow did not take place in the night following the cessation of the ninth plague'
  - where: 'note 11:4 “Which midnight, and who goes out”'
    claim: 'The Passover directions had to reach the people at least four days before the feast'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/11.htm'
    quote: 'they must have been communicated to the people at least four days before the feast of the Passover and their departure from Egypt (Exodus 12:3).'
  - where: 'note 11:4 “Which midnight, and who goes out”'
    claim: 'The last plague is carried out by the LORD Himself, the others through Moses and Aaron'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/11.htm'
    quote: 'The last blow upon Pharaoh was to be carried out by Jehovah Himself, whereas the other plagues had been brought by Moses and Aaron.'
  - where: 'note 11:4 “Which midnight, and who goes out”'
    claim: 'Chapter 12 speaks of the LORD passing through and of “the destroyer”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/12?lang=eng'
    quote: 'the LORD will pass over the door, and will not suffer the destroyer to come in unto your houses to smite you.'
  - where: 'note 11:5 “From the throne to the handmill”'
    claim: 'A modern translation renders the maidservant behind the mill as a female slave at the handmill'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2011&version=NRSVUE'
    quote: 'from the firstborn of Pharaoh who sits on his throne to the firstborn of the female slave who is behind the handmill and all the firstborn of the livestock.'
  - where: 'note 11:5 “From the throne to the handmill”'
    claim: 'Hymns for Senusret III credit the king with protecting the youths'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'In a set of hymns for Senusret III, he is ascribed the power of protecting the youths that they may slumber and of making it possible for the Egyptians to raise their youths.'
  - where: 'note 11:5 “From the throne to the handmill”'
    claim: 'The plague showed that Pharaoh could not use his powers against Jehovah'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'Jehovah had demonstrated an ability to exercise that which was kingly privilege and that Pharaoh could not exercise his powers in opposition to Jehovah, who was in complete control'
  - where: 'note 11:5 “From the throne to the handmill”'
    claim: 'Pharaoh was regarded as a deity, so the death of his heir challenged his divine succession'
    key: sc-knowhy-631
    url: 'https://scripturecentral.org/knowhy/why-were-particular-plagues-sent-against-egypt'
    quote: 'Pharaoh himself was regarded as a deity, and thus the death of the pharaonic heir was a challenge to his divine succession.'
  - where: 'note 11:5 “From the throne to the handmill”'
    claim: 'The Church’s footnote at “firstborn” points to the message of 4:21–23'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/11?lang=eng'
    quote: '“firstborn”: Ex. 4:23 (21–23).'
  - where: 'note 11:7 “Not a dog will growl”'
    claim: 'The Hebrew verb means “sharpen,” figuratively of the tongue: to utter no sound against Israel; the same use is in Joshua 10:21'
    key: bdb
    url: 'https://biblehub.com/hebrew/2782.htm'
    quote: '2 sharpen, figurative the tongue, כֶּֿלֶב לְשֹׁנוֺ לְ׳לֹא יֶח Exodus 11:7 (J), i.e. utter no sound against Israel, Joshua 10:21.'
  - where: 'note 11:7 “Not a dog will growl”'
    claim: 'A modern translation renders “not a dog shall growl”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2011&version=NRSVUE'
    quote: 'But not a dog shall growl at any of the Israelites—not at people, not at animals'
  - where: 'note 11:7 “Not a dog will growl”'
    claim: 'Verse 6 has the great cry and verse 7 begins with “But”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/11?lang=eng'
    quote: 'And there shall be a great cry throughout all the land of Egypt … But against any of the children of Israel shall not a dog move his tongue'
  - where: 'note 11:7 “Not a dog will growl”'
    claim: 'Joshua 10:21 uses the figure of men after a victory, the people returning to the camp in peace'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/10?lang=eng'
    quote: 'And all the people returned to the camp to Joshua at Makkedah in peace: none moved his tongue against any of the children of Israel.'
  - where: 'note 11:7 “The difference between Egypt and Israel”'
    claim: '“Put a difference” is one Hebrew verb (Strong’s 6395), which Exodus also has at 8:22 and 9:4'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'יַפְלֶ֣ה'
  - where: 'note 11:7 “The difference between Egypt and Israel”'
    claim: 'The verb means to make separate or distinguish between, and the lexicon lists the three Exodus verses (8:18 in the Hebrew numbering)'
    key: bdb
    url: 'https://biblehub.com/hebrew/6395.htm'
    quote: 'of ׳י, make separate, with accusative Exodus 8:18 (by treating differently); … distinguish between, בֵּין thing, Exodus 9:4, בֵּין person Exodus 11:7.'
  - where: 'note 11:7 “The difference between Egypt and Israel”'
    claim: 'The verse’s words, and the Church’s footnote at “difference” pointing to 1 Nephi 17:35'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/11?lang=eng'
    quote: '“difference”: 1 Ne. 17:35 (33–38).'
  - where: 'note 11:7 “The difference between Egypt and Israel”'
    claim: 'Nephi is speaking of the peoples driven out of the land of promise by Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/17?lang=eng'
    quote: 'And now, do ye suppose that the children of this land, who were in the land of promise, who were driven out by our fathers, do ye suppose that they were righteous? Behold, I say unto you, Nay.'
  - where: 'note 11:8 “Why Moses left in anger”'
    claim: 'One suggestion: Moses was angry because he knew what the plague would bring on the Egyptians through Pharaoh’s pride'
    key: ot-minute-ex-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-7-13'
    quote: 'Perhaps that anger was triggered because Moses knew what was to happen to the Egyptian people with this tenth plague, all because of Pharaoh’s stubborn pride and obstinance in not letting the children of Israel leave.'
  - where: 'note 11:8 “Why Moses left in anger”'
    claim: 'One older reading: the anger was on account of what Pharaoh had said in 10:27–28'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/11.htm'
    quote: 'in hot anger] viz. on account of what the Pharaoh had said, Exodus 10:27-28.'
  - where: 'christ'
    claim: 'The Passover would help Israel look forward to the Messiah’s coming'
    key: scripture-helps-ex-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/13-exodus-7-13?lang=eng'
    quote: 'The Passover would help the Israelites look forward to the Messiah’s coming and the deliverance of God’s children from spiritual death.'
  - where: 'christ'
    claim: 'Paul calls Christ “our passover”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/5?lang=eng'
    quote: 'For even Christ our passover is sacrificed for us:'
  - where: 'note 11:2 “Asking the Egyptians for silver and gold”'
    claim: 'The Church’s footnote gives “HEB ask” for “borrow”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/11?lang=eng'
    quote: '“borrow”: HEB ask.'
  - where: 'note 11:7 “The difference between Egypt and Israel”'
    claim: 'The same verb stands at 8:22 (Hebrew 8:18), of Goshen'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וְ/הִפְלֵיתִי֩'
  - where: 'note 11:7 “The difference between Egypt and Israel”'
    claim: 'The same verb stands at 9:4, of the cattle'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וְ/הִפְלָ֣ה'
  - where: 'note 11:7 “The difference between Egypt and Israel”'
    claim: 'The verse says the LORD puts a difference between the Egyptians and Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/11?lang=eng'
    quote: 'that ye may know how that the Lord doth put a difference between the Egyptians and Israel.'
