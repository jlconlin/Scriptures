chapter: 30
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'Moses was on the mount forty days and forty nights'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/24?lang=eng'
    quote: 'and Moses was in the mount forty days and forty nights.'
  - where: 'setting'
    claim: 'The instructions for the tabernacle run through chapters 25–31, the making through 35–39, the dedication in 40'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'The construction of this tabernacle is described in Exodus 25–31, with the actual construction in chapters 35–39 and the consecration, or dedication, of the structure in chapter 40.'
  - where: 'setting'
    claim: 'The silver of those numbered is accounted for in chapter 38'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/38?lang=eng'
    quote: 'And the silver of them that were numbered of the congregation was an hundred talents, and a thousand seven hundred and threescore and fifteen shekels, after the shekel of the sanctuary:'
  - where: 'setting'
    claim: 'The laver is set up and used in chapter 40'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'And he set the laver between the tent of the congregation and the altar, and put water there, to wash withal.'

  # ---------- plain words ----------
  - where: 'section 1 plain'
    claim: 'Shittim is acacia; the horns were of one piece with the altar; the crown is a border; the meat offering is a meal offering (Church footnotes 1c, 2a, 3b, 9b)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/30?lang=eng'
    quote: 'HEB acacia. … IE of one piece with the altar. … HEB border. … OR meal offering.'
  - where: 'section 2 plain'
    claim: 'The sum is a census; the tabernacle of the congregation is the tent of meeting (Church footnotes 12a, 16b)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/30?lang=eng'
    quote: 'OR census. … HEB tent of meeting (also vv. 18, 20, 26, 36).'
  - where: 'section 4 plain'
    claim: 'Oil olive is olive oil; the apothecary is a perfumer; vessels are utensils; sanctify is consecrate; man’s flesh is that of one who is not a priest (Church footnotes 24a, 25c, 27a, 29a, 32a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/30?lang=eng'
    quote: 'OR olive oil. … HEB perfumer. … OR its utensils. … OR consecrate. … IE the common man who is not a priest.'
  - where: 'section 5 plain'
    claim: 'Modern translations read “seasoned with salt” for “tempered together”'
    key: esv
    url: 'https://biblehub.com/exodus/30-35.htm'
    quote: 'and make an incense blended as by the perfumer, seasoned with salt, pure and holy.'

  # ---------- note 30:1 ----------
  - where: 'note 30:1 “The golden altar before the veil”'
    claim: 'The altar of incense stood in the Holy Place, in the middle, before the veil; like the altar of burnt offering but smaller and overlaid with gold'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'In the middle, before the veil and before the mercy seat (Ex. 30:6), stood the altar of incense, similar in construction to the altar of burnt offering but smaller and overlaid with gold.'
  - where: 'note 30:1 “The golden altar before the veil”'
    claim: 'Incense only, morning and evening; no animal sacrifices'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'On it incense was burned morning and evening (no animal sacrifices); and on its horns was put once a year, on the Day of Atonement, the blood of the sin offering (Ex. 30:10).'
  - where: 'note 30:1 “The golden altar before the veil”'
    claim: 'The candlestick stood on its south side and the table of shewbread on its north'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'On the south side of the altar of incense stood the candlestick (Ex. 26:35), of pure gold of beaten work … On the north side of the altar stood the table of shewbread (Ex. 25:23–30) made of acacia wood.'
  - where: 'note 30:1 “The golden altar before the veil”'
    claim: 'Chapter 40 calls it the golden altar and places it before the veil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'And he put the golden altar in the tent of the congregation before the veil:'

  # ---------- note 30:7 ----------
  - where: 'note 30:7 “Incense and prayer”'
    claim: 'A psalm compares prayer to incense'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/141?lang=eng'
    quote: 'Let my prayer be set forth before thee as incense; and the lifting up of my hands as the evening sacrifice.'
  - where: 'note 30:7 “Incense and prayer”'
    claim: 'In John’s vision the odours are the prayers of saints'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/5?lang=eng'
    quote: 'having every one of them harps, and golden vials full of odours, which are the prayers of saints.'
  - where: 'note 30:7 “Incense and prayer”'
    claim: 'An angel offers incense with the prayers of the saints on the golden altar before the throne'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/8?lang=eng'
    quote: 'there was given unto him much incense, that he should offer it with the prayers of all saints upon the golden altar which was before the throne.'
  - where: 'note 30:7 “Incense and prayer”'
    claim: 'The incense offering coincided with the daily morning and evening sacrifices'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'The Lord commanded Moses that twice each day, Aaron was to burn incense on this altar. This timing would correlate with the daily morning and evening sacrifices.'
  - where: 'note 30:7 “Incense and prayer”'
    claim: 'The duty was the high priest’s; in the second temple it passed to all the priests by lot'
    key: bd-incense
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/incense?lang=eng'
    quote: 'the duty of offering it twice daily fell upon the high priest (Ex. 30:7–8), but in the second temple the privilege was extended to all the priests, and the lot was cast each day to decide who should offer it (Luke 1:9).'
  - where: 'note 30:7 “Incense and prayer”'
    claim: 'The priest entered alone, cast the incense on coals from the altar of burnt offering, and returned to a congregation praying outside'
    key: bd-incense
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/incense?lang=eng'
    quote: 'Live coals were brought from the brazen altar of burnt offering and placed on the golden altar of incense; then the priest to whom the lot had fallen entered alone into the Holy Place … he returned to the congregation, who were praying outside'
  - where: 'note 30:7 “Incense and prayer”'
    claim: 'Zacharias’s lot was to burn incense while the people prayed outside; the angel stood beside the altar of incense'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'And there appeared unto him an angel of the Lord standing on the right side of the altar of incense.'

  # ---------- note 30:9 ----------
  - where: 'note 30:9 “Strange incense, and the stranger of verse 33”'
    claim: 'The lexicon classes “strange incense” here with “strange fire” in Leviticus 10:1, as strange to the law'
    key: bdb
    url: 'https://biblehub.com/hebrew/2114.htm'
    quote: 'd. strange to the law; קְטֹרֶת זָרָה strange incense Exodus 30:9 (P); אֵשׁ זָרָה strange fire Leviticus 10:1; Numbers 3:4; Numbers 26:61(P).'
  - where: 'note 30:9 “Strange incense, and the stranger of verse 33”'
    claim: 'The lexicon lists Exodus 30:33 where the word means one outside the priestly family'
    key: bdb
    url: 'https://biblehub.com/hebrew/2114.htm'
    quote: 'especially of another family than priests'' אִישׁ זָר Leviticus 22:12 (H) Numbers 17:5 (P); זָר Leviticus 22:10,13 (H) Exodus 29:33; Exodus 30:33'
  - where: 'note 30:9 “Strange incense, and the stranger of verse 33”'
    claim: 'The word for “strange” in verse 9 is the feminine of Strong’s 2114'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'זָרָ֖ה'
  - where: 'note 30:9 “Strange incense, and the stranger of verse 33”'
    claim: 'The word for “stranger” in verse 33 is the masculine of the same word, Strong’s 2114'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'זָ֑ר'
  - where: 'note 30:9 “Strange incense, and the stranger of verse 33”'
    claim: 'One older reading: strange incense is incense the LORD had not appointed, not made by His recipe'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/30.htm'
    quote: 'No "strange incense" was to be offered upon it, - i.e., incense which Jehovah had not appointed (cf. Leviticus 10:1), that is to say, which had not been prepared according to His instructions'
  - where: 'note 30:9 “Strange incense, and the stranger of verse 33”'
    claim: 'The stranger is any layman or non-priest, not only a non-Israelite'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/30.htm'
    quote: 'זר (Exodus 30:33) a stranger, is not only the non-Israelite, but laymen or non-priests in general.'
  - where: 'note 30:9 “Strange incense, and the stranger of verse 33”'
    claim: 'Nadab and Abihu offered strange fire with incense and died'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/10?lang=eng'
    quote: 'took either of them his censer, and put fire therein, and put incense thereon, and offered strange fire before the Lord, which he commanded them not.'

  # ---------- note 30:10 ----------
  - where: 'note 30:10 “Blood on the horns of the incense altar”'
    claim: 'The yearly rite on the horns is on the Day of Atonement'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'on its horns was put once a year, on the Day of Atonement, the blood of the sin offering (Ex. 30:10).'
  - where: 'note 30:10 “Blood on the horns of the incense altar”'
    claim: 'The day is the tenth of the seventh month'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/16?lang=eng'
    quote: 'that in the seventh month, on the tenth day of the month, ye shall afflict your souls, and do no work at all'
  - where: 'note 30:10 “Blood on the horns of the incense altar”'
    claim: 'On that day the high priest took incense within the veil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/16?lang=eng'
    quote: 'And he shall put the incense upon the fire before the Lord, that the cloud of the incense may cover the mercy seat that is upon the testimony, that he die not:'
  - where: 'note 30:10 “Blood on the horns of the incense altar”'
    claim: 'In the sin offering the blood was put on the horns of the altar of sweet incense'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/4?lang=eng'
    quote: 'And the priest shall put some of the blood upon the horns of the altar of sweet incense before the Lord, which is in the tabernacle of the congregation'
  - where: 'note 30:10 “Blood on the horns of the incense altar”'
    claim: 'The sin offering for the whole congregation put blood on the horns of the incense altar'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'The priest then took the blood and smeared it on the horns or corners of the altar of incense in the holy place that stood before the veil, pouring the remaining blood at the base of the altar of burnt offerings outside.'

  # ---------- note 30:12 ----------
  - where: 'note 30:12 “Why a census called for a ransom”'
    claim: 'Kopher is the price of a life, a ransom'
    key: bdb
    url: 'https://biblehub.com/hebrew/3724.htm'
    quote: 'the price of a life, ransom'
  - where: 'note 30:12 “Why a census called for a ransom”'
    claim: 'The lexicon on the word in this verse'
    key: bdb
    url: 'https://biblehub.com/hebrew/3724.htm'
    quote: 'Exodus 30:12 is a half shekel of the sanctuary paid by each male above twenty years at the census in order that there might be no plague upon them.'
  - where: 'note 30:12 “Why a census called for a ransom”'
    claim: 'Why the ransom was required is debated'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'Although scholars debate why this ransom price had to be paid by Israel and what “atonement for your souls” means'
  - where: 'note 30:12 “Why a census called for a ransom”'
    claim: 'The census of Numbers 1 counted men of twenty and up able to go to war'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/1?lang=eng'
    quote: 'From twenty years old and upward, all that are able to go forth to war in Israel: thou and Aaron shall number them by their armies.'
  - where: 'note 30:12 “Why a census called for a ransom”'
    claim: 'One older reading: numbering enrolled men in the army of Jehovah, an approach to the holy God that needed the protection of the kopher'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/30.htm'
    quote: 'where the soul is said to be protected by the copher, so as to be able to come without danger into the presence of the holy God … Such an approach to God took place at the numbering of the people for the purpose of enrolling them in the army of Jehovah'
  - where: 'note 30:12 “Why a census called for a ransom”'
    claim: 'Another older reading compares David’s census and proposes pride or the bringing of sins to God’s notice'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/30.htm'
    quote: 'a census was dangerous to the lives of the persons numbered (cf. 2 Samuel 24), whether because it was likely to give rise to feelings of self-satisfaction and pride, or because it tended to bring the sins and imperfections of individuals prominently before God’s notice'
  - where: 'note 30:12 “Why a census called for a ransom”'
    claim: 'After David’s numbering a pestilence killed seventy thousand'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/24?lang=eng'
    quote: 'So the Lord sent a pestilence upon Israel from the morning even to the time appointed: and there died of the people from Dan even to Beer-sheba seventy thousand men.'
  - where: 'note 30:12 “Why a census called for a ransom”'
    claim: 'David confessed the numbering as sin'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/24?lang=eng'
    quote: 'And David’s heart smote him after that he had numbered the people. And David said unto the Lord, I have sinned greatly in that I have done'
  - where: 'note 30:12 “Why a census called for a ransom”'
    claim: 'The officers after the Midianite war brought gold to make atonement for their souls'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/31?lang=eng'
    quote: 'We have therefore brought an oblation for the Lord, what every man hath gotten, of jewels of gold, chains, and bracelets, rings, earrings, and tablets, to make an atonement for our souls before the Lord.'
  - where: 'note 30:12 “Why a census called for a ransom”'
    claim: 'One study counts the presentation of gold among the ways of enacting atonement, with sacrifice and incense'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'there were at least four recognized ways of enacting atonement: the offering of blood sacrifice upon the altar, the use of incense, the killing of those who profaned sacred space, and the presentation of gold.'

  - where: 'note 30:12 “Why a census called for a ransom”'
    claim: 'One study suggests the ransom possibly refers to the golden calf'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'it possibly refers to the sin of worshipping the golden calf.'

  # ---------- note 30:15 ----------
  - where: 'note 30:15 “Half a shekel from every man alike”'
    claim: 'The Church’s footnote to verse 13 points to Nehemiah 10:32'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/30?lang=eng'
    quote: 'Neh. 10:32.'
  - where: 'note 30:15 “Half a shekel from every man alike”'
    claim: 'The Church’s footnote to verse 16 points to 2 Chronicles 24:6–9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/30?lang=eng'
    quote: '2 Chr. 24:6 (6–9).'
  - where: 'note 30:15 “Half a shekel from every man alike”'
    claim: 'One older reading: the later yearly temple tax of a half shekel is based on this passage'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/30.htm'
    quote: 'The later institution of an annual Temple-tax of a half-shekel'
  - where: 'note 30:15 “Half a shekel from every man alike”'
    claim: 'Before the Persian period silver passed by weight, not as coin'
    key: bd-money
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/money?lang=eng'
    quote: 'The Hebrews appear to have been ignorant of coinage until the Persian period. Before that time gold and silver were used as a medium of exchange, but payments were made by weight.'
  - where: 'note 30:15 “Half a shekel from every man alike”'
    claim: 'The early shekel’s weight is uncertain; from the second century B.C. it was 15.126 grams'
    key: bd-weights-and-measures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/weights-and-measures?lang=eng'
    quote: 'Shekel. It is uncertain what its exact weight was in early times; from the 2nd century B.C. onward it was 218 grains (15.126 grams).'
  - where: 'note 30:15 “Half a shekel from every man alike”'
    claim: 'One older reading: the flat rate because all were equal before Jehovah'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/30.htm'
    quote: 'was to pay half a shekel of the sanctuary as atonement-money; the rich no more, the poor no less (Exodus 30:15), because all were equal in the sight of Jehovah'
  - where: 'note 30:15 “Half a shekel from every man alike”'
    claim: 'The silver came from 603,550 men at half a shekel each'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/38?lang=eng'
    quote: 'A bekah for every man, that is, half a shekel, after the shekel of the sanctuary, for every one that went to be numbered, from twenty years old and upward, for six hundred thousand and three thousand and five hundred and fifty men.'
  - where: 'note 30:15 “Half a shekel from every man alike”'
    claim: 'The hundred talents were cast into the sockets of the sanctuary and of the veil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/38?lang=eng'
    quote: 'And of the hundred talents of silver were cast the sockets of the sanctuary, and the sockets of the veil; an hundred sockets of the hundred talents, a talent for a socket.'
  - where: 'note 30:15 “Half a shekel from every man alike”'
    claim: 'One study: the tabernacle’s foundation was the ransom silver'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'This would mean that the entire foundation of the tabernacle was built upon the foundation of the silver from the ransom price.'
  - where: 'note 30:15 “Half a shekel from every man alike”'
    claim: 'Joash called for the collection Moses laid on Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/24?lang=eng'
    quote: 'to bring in to the Lord the collection that Moses the servant of God laid upon Israel in the wilderness.'
  - where: 'note 30:15 “Half a shekel from every man alike”'
    claim: 'Nehemiah’s generation pledged a third of a shekel yearly'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/10?lang=eng'
    quote: 'Also we made ordinances for us, to charge ourselves yearly with the third part of a shekel for the service of the house of our God;'
  - where: 'note 30:15 “Half a shekel from every man alike”'
    claim: 'The tribute of Matthew 17:24 is the didrachmon, rendered “half-shekel” in some Bibles'
    key: bd-money
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/money?lang=eng'
    quote: 'the didrachmon (or double drachme) (Matt. 17:24), translated “half-shekel” in some Bibles, or “tribute money” in KJV.'
  - where: 'note 30:15 “Half a shekel from every man alike”'
    claim: 'Jesus asked of whom kings take tribute, and had Peter pay for them both'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/17?lang=eng'
    quote: 'thou shalt find a piece of money: that take, and give unto them for me and thee.'
  - where: 'note 30:15 “Half a shekel from every man alike”'
    claim: 'One older reading of Matthew 17:25–26: children of the kingdom no longer owe the atonement money'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/30.htm'
    quote: 'It was not till this sinful nature had been sanctified by a perfect atonement … that as children of the kingdom they had no longer to pay this atonement-money for their souls (Matthew 17:25-26).'

  # ---------- note 30:18 ----------
  - where: 'note 30:18 “The laver, and why hands and feet”'
    claim: 'What the laver was'
    key: bd-laver
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/laver?lang=eng'
    quote: 'A vessel containing water for the priests to wash their hands and feet before offering sacrifice. In the tabernacle it stood between the altar and the door (Ex. 30:17–21).'
  - where: 'note 30:18 “The laver, and why hands and feet”'
    claim: 'Where it stood'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'Between the altar of burnt offering and the door of the tent stood a laver of brass on a base of brass (Ex. 30:18).'
  - where: 'note 30:18 “The laver, and why hands and feet”'
    claim: 'The washing was ritual; hands and feet as the parts likeliest to have met impurity'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'The washing that took place was far more ritualistic in nature and not just for removing dirt from the hands … The hands and feet would need to be washed because they would be the most likely parts of the body to have touched or trod on impurity.'
  - where: 'note 30:18 “The laver, and why hands and feet”'
    claim: 'The laver is described last and with the least detail'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'The fact that it was discussed last and with the least detail possibly shows the lesser significance of this piece of furniture'
  - where: 'note 30:18 “The laver, and why hands and feet”'
    claim: 'The washing reminded Israel of the need to be clean for ordinances and the Lord’s presence'
    key: scripture-helps-ex-35
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/16-exodus-35-40-leviticus-1-4-16-19?lang=eng'
    quote: 'This was a reminder for the Israelites of the need to be clean as they participated in sacred ordinances and prepared to enter the Lord’s presence.'
  - where: 'note 30:18 “The laver, and why hands and feet”'
    claim: 'Moses, Aaron and his sons washed there when the tabernacle was set up, and at each approach'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'And Moses and Aaron and his sons washed their hands and their feet thereat: When they went into the tent of the congregation, and when they came near unto the altar, they washed; as the Lord commanded Moses.'

  # ---------- note 30:25 ----------
  - where: 'note 30:25 “Oil that makes holy”'
    claim: 'The study: the oil was designated as God’s own'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'The direction from which the anointing began, with the oil specifically designated as God’s own, and the single performance of the act, all suggest that the act was to be understood as if God himself were doing it.'
  - where: 'note 30:25 “Oil that makes holy”'
    claim: 'The holy anointing oil was olive oil with spices, restricted in use'
    key: bd-anoint
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/anoint?lang=eng'
    quote: 'The holy anointing oil used in the law of Moses was composed of olive oil mixed with spices and was to be restricted in use to certain specified ceremonies (Ex. 30:22–33; 37:29).'
  - where: 'note 30:25 “Oil that makes holy”'
    claim: 'Ordinary anointing was a sign of hospitality and part of grooming'
    key: bd-anoint
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/anoint?lang=eng'
    quote: 'It is a sign of hospitality in Luke 7:46 and of routine personal grooming in 2 Sam. 12:20 and Matt. 6:17.'
  - where: 'note 30:25 “Oil that makes holy”'
    claim: 'The anointing oil was scented, made by formula, used only to sanctify'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'Unlike other oil, the anointing oil was a scented oil, made according to a specific formula, to be used solely to sanctify the items within the tabernacle:'
  - where: 'note 30:25 “Oil that makes holy”'
    claim: 'Atoning rites were repeated; anointing was done once, from the Holy of Holies outward to the laver'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'whereas all the atoning rituals were repeated often, the act of being anointed or splashed with the blood or oil, once done, was never performed again. Moreover, in the case of the tabernacle’s dedication, the process of anointing began from the inside out, from the Holy of Holies to the laver outside.'
  - where: 'note 30:25 “Oil that makes holy”'
    claim: 'Moses anointed the tabernacle and all in it in Leviticus 8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/8?lang=eng'
    quote: 'And Moses took the anointing oil, and anointed the tabernacle and all that was therein, and sanctified them.'

  # ---------- note 30:34 ----------
  - where: 'note 30:34 “The spices of the incense”'
    claim: 'Stacte: a gum gathered in drops; identification dubious; the name is the Greek and Latin rendering'
    key: bdb
    url: 'https://biblehub.com/hebrew/5198.htm'
    quote: 'נָטָף noun [masculine] an odorific gum (gathered in drops), used in sacred incense Exodus 30:34 (P). Identification dubious; ᵐ5 στακτή, ᵑ9 stacte'
  - where: 'note 30:34 “The spices of the incense”'
    claim: 'Onycha: the King James word comes from the Greek and Latin; usually taken as the operculum of certain molluscs, pungent when burnt'
    key: bdb
    url: 'https://biblehub.com/hebrew/7827.htm'
    quote: 'ὄνυξ, onyx (whence AV onycha), i.e. unguis odoratus, the operculum, or closing-flap, of certain molluscs, with pungent odour whenburnt'
  - where: 'note 30:34 “The spices of the incense”'
    claim: 'Galbanum: a kind of gum; the name is the Greek and Latin'
    key: bdb
    url: 'https://biblehub.com/hebrew/2464.htm'
    quote: 'χαλβάνη, ᵑ9 galbanum) — a kind of gum Exodus 30:34, ingredient of the holy incense'
  - where: 'note 30:34 “The spices of the incense”'
    claim: 'The participle in verse 35 means salted'
    key: bdb
    url: 'https://biblehub.com/hebrew/4414.htm'
    quote: 'Pu`al Participle מְמֻלָּח Exodus 30:35 salted, i.e. the incense (see Di.)'
  - where: 'note 30:34 “The spices of the incense”'
    claim: 'A modern translation: “seasoned with salt”'
    key: esv
    url: 'https://biblehub.com/exodus/30-35.htm'
    quote: 'and make an incense blended as by the perfumer, seasoned with salt, pure and holy.'
  - where: 'note 30:34 “The spices of the incense”'
    claim: 'The preparation of the incense is in verses 34–36'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/incense?lang=eng'
    quote: 'The preparation of incense is described in Ex. 30:34–36'

  # ---------- christ ----------
  - where: 'christ'
    claim: 'One study reads the ransom silver of the foundation toward the ransom made through Christ'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'Similarly, it is only through the solid foundation of the ransom (redemption) made through Christ that our path back to the presence of God can be made.'
  - where: 'christ'
    claim: 'Hebrews sets Christ’s one entry beside the high priest’s yearly entry'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/9?lang=eng'
    quote: 'Neither by the blood of goats and calves, but by his own blood he entered in once into the holy place, having obtained eternal redemption for us.'
  - where: 'christ'
    claim: 'Messiah and Christ both mean anointed'
    key: bd-anointed-one
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/anointed-one?lang=eng'
    quote: 'Jesus is spoken of as the Christ and the Messiah, which means He is the one anointed of the Father to be His personal representative in all things pertaining to the salvation of mankind. The English word Christ is from a Greek word meaning “anointed”'
  - where: 'christ'
    claim: 'Messiah is from a Hebrew and Aramaic term meaning anointed'
    key: bd-anointed-one
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/anointed-one?lang=eng'
    quote: 'and is the equivalent of Messiah, which is from a Hebrew and Aramaic term meaning “anointed.”'
  - where: 'christ'
    claim: 'The New Testament calls Christ’s life a ransom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/20?lang=eng'
    quote: 'Even as the Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many.'
  - where: 'christ'
    claim: 'Paul: a ransom for all'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-tim/2?lang=eng'
    quote: 'Who gave himself a ransom for all, to be testified in due time.'

