chapter: 12
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'The first month is named Abib in the next chapter'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/13?lang=eng'
    quote: 'This day came ye out in the month Abib.'
  - where: 'setting'
    claim: 'What the Passover commemorates'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'The Feast of the Passover was instituted to commemorate the passing over the houses of the children of Israel in Egypt when God smote the firstborn of the Egyptians, and more generally the redemption from Egypt (Ex. 12:27; 13:15).'
  - where: 'setting'
    claim: 'The first Passover differed from the later ones'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'The first Passover differed somewhat from those succeeding it.'
  - where: 'setting'
    claim: 'Later the feast was kept at the sanctuary and not in the home'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'It lost its domestic character and became a sanctuary feast.'
  - where: 'thread'
    claim: 'The chapter weaves ritual instruction into the narrative and looks past its first hearers to their posterity'
    key: heal-children-ask
    url: 'https://mi.byu.edu/old-testament-reflections/and-when-your-children-ask-you'
    quote: 'In the case of Exodus 12, the genre shift is from narrative to law. But it is not a complete shift; rather, it is a weaving of narrative and law'
  - where: 'thread'
    claim: 'The chapter is the origin story recalled and reenacted at the yearly feast'
    key: heal-children-ask
    url: 'https://mi.byu.edu/old-testament-reflections/and-when-your-children-ask-you'
    quote: 'But here is the origin story, a story that will be recalled at the annual celebration of the Passover and Unleavened Bread festivals and reinforced by these festivals being embodied and reenacted.'

  # ---------- sections ----------
  - where: 'section 1 plain'
    claim: '“Sodden” is boiled'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/12?lang=eng'
    quote: '“sodden”: HEB boiled … in.'
  - where: 'section 1 plain'
    claim: '“Purtenance” is the edible inner parts'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/12?lang=eng'
    quote: '“purtenance”: IE edible inner parts.'
  - where: 'section 4 plain'
    claim: '“Borrowed” may be read “asked” (see the note on verse 35)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/12?lang=eng'
    quote: '“borrowed”: OR asked.'

  # ---------- note 12:2 ----------
  - where: 'note 12:2 “A year that starts from the deliverance”'
    claim: 'The Exodus resets the reckoning of time; the months are numbered from it as a reminder'
    key: heal-children-ask
    url: 'https://mi.byu.edu/old-testament-reflections/and-when-your-children-ask-you'
    quote: 'the Exodus from Egypt is an event of such significance that it resets time (Exodus 12:2). The month of the Exodus is to become the first month and each month was simply numbered after that, as a constant reminder of their redemption (e.g. Exodus 16:1).'
  - where: 'note 12:2 “A year that starts from the deliverance”'
    claim: 'The spring month began the religious year; the autumn month Tishri remained the civil and agricultural new year'
    key: sc-knowhy-849
    url: 'https://scripturecentral.org/knowhy/why-is-yom-kippur-the-day-of-atonement-in-the-fall-at-the-end-of-the-harvest-rather-than-closer-to-the-spring-passover-when-jesus-was-sacrificed'
    quote: 'While Nisan (in the spring) was the first month on the religious calendar (Exodus 12:2), which was used for festival cycles and liturgical purposes, Tishri (in the fall) was the chronological and agricultural new year.'
  - where: 'note 12:2 “A year that starts from the deliverance”'
    claim: 'The next chapter names the month'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/13?lang=eng'
    quote: 'This day came ye out in the month Abib.'

  # ---------- note 12:5 ----------
  - where: 'note 12:5 “The lamb, and whom scripture says it is”'
    claim: 'Paul calls Christ “our passover”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/5?lang=eng'
    quote: 'For even Christ our passover is sacrificed for us'
  - where: 'note 12:5 “The lamb, and whom scripture says it is”'
    claim: 'The lamb was slain “between the evenings” of the fourteenth'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'It was slain by the whole congregation between the evenings (between sunset and total darkness) of the 14th Abib'
  - where: 'note 12:5 “The lamb, and whom scripture says it is”'
    claim: 'John places the Crucifixion at the time the Passover lambs were being killed'
    key: seely-lamb
    url: 'https://rsc.byu.edu/behold-lamb-god/behold-lamb-god'
    quote: 'portrays Jesus being bound and crucified on the cross precisely at the time that the Passover lambs were being killed at the temple.'
  - where: 'note 12:5 “The lamb, and whom scripture says it is”'
    claim: 'The synoptic Gospels make the Last Supper a Passover meal; John has it the night before; either way the death falls in the Passover season'
    key: sc-knowhy-845
    url: 'https://scripturecentral.org/knowhy/why-is-the-passover-important-for-understanding-easter'
    quote: 'Of course, this would mean Jesus’s Last Supper was not the night of Passover, but would have occurred the night before. Regardless, the important thing is that His death coincided with the Passover season.'
  - where: 'note 12:5 “The lamb, and whom scripture says it is”'
    claim: 'The synoptic Gospels record the Last Supper as the Passover meal'
    key: seely-lamb
    url: 'https://rsc.byu.edu/behold-lamb-god/behold-lamb-god'
    quote: 'The synoptic Gospels (Matthew, Mark, and Luke) record that Jesus and His Apostles met in an upper room and celebrated the Passover meal at the Last Supper'
  - where: 'note 12:5 “The lamb, and whom scripture says it is”'
    claim: 'Every element of the meal pointed to the Messiah'
    key: seely-lamb
    url: 'https://rsc.byu.edu/behold-lamb-god/behold-lamb-god'
    quote: 'The elements of the Passover meal: the lamb, the blood, the unleavened bread, and the bitter herbs all pointed toward the coming of the Messiah and the redemption He would offer from sin, death, and hell.'

  # ---------- note 12:11 ----------
  - where: 'note 12:11 “What the word passover means”'
    claim: 'The verb means to pass or spring over'
    key: bdb
    url: 'https://biblehub.com/hebrew/6452.htm'
    quote: 'verb pass or spring over'
  - where: 'note 12:11 “What the word passover means”'
    claim: 'In Exodus 12:13, 23, 27 it is used of the LORD passing over (sparing) Israel’s houses; the same verb is in Isaiah 31:5'
    key: bdb
    url: 'https://biblehub.com/hebrew/6452.htm'
    quote: 'passing over (sparing) houses of Israel; Infinitive absolute מָּסוֺחַ Isaiah 31:5 a passing over'
  - where: 'note 12:11 “What the word passover means”'
    claim: 'The verb stands in verse 13 (Strong’s 6452)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וּפָסַחְתִּ֖י'
  - where: 'note 12:11 “What the word passover means”'
    claim: 'The noun pesach comes from the verb and came to be used for the lamb'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/12.htm'
    quote: 'came afterwards to be used for the lamb, through which, according to divine appointment, the passing by or sparing had been effected'
  - where: 'note 12:11 “What the word passover means”'
    claim: 'In verse 21 “the passover” is the passover lamb'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/12?lang=eng'
    quote: '“passover”: IE passover lamb.'

  # ---------- note 12:12 ----------
  - where: 'note 12:12 “Judgment on the gods of Egypt”'
    claim: 'Numbers repeats that the LORD executed judgments on Egypt’s gods'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/33?lang=eng'
    quote: 'upon their gods also the LORD executed judgments.'
  - where: 'note 12:12 “Judgment on the gods of Egypt”'
    claim: 'The plagues showed Jehovah greater than Egypt’s gods, Pharaoh among them'
    key: scripture-helps-ex-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/13-exodus-7-13?lang=eng'
    quote: 'The plagues clearly demonstrated that Jehovah was more powerful than the gods of Egypt, including Pharaoh, who was seen by the Egyptians as a god.'
  - where: 'note 12:12 “Judgment on the gods of Egypt”'
    claim: 'Many take 12:12 to mean each plague targeted one deity; such attempts have had varying success and may miss the confrontation with Pharaoh'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'These attempts have been executed with varying degrees of success but, as Hoffmeier has noted, may be missing the true confrontation being played out in the narrative.'
  - where: 'note 12:12 “Judgment on the gods of Egypt”'
    claim: 'Egyptian texts credit the king with power over life and death and imply that he could protect his children; in the tenth plague he could not'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'We are also told that the king will cause to live those whom he wishes to live, and those whom he wishes to die will surely die.[111] It is implied that the king had the ability to protect his children.'
  - where: 'note 12:12 “Judgment on the gods of Egypt”'
    claim: 'Pharaoh could not use his powers against Jehovah'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'Pharaoh could not exercise his powers in opposition to Jehovah'

  # ---------- note 12:13 ----------
  - where: 'note 12:13 “A sign of the household’s obedience”'
    claim: 'The blood on the door was a token of the household’s obedience'
    key: seely-lamb
    url: 'https://rsc.byu.edu/behold-lamb-god/behold-lamb-god'
    quote: 'daubed it around the frame of the door as a “token” to their obedience to the Lord’s commandments.'
  - where: 'note 12:13 “A sign of the household’s obedience”'
    claim: 'The Lord would acknowledge the household’s obedience, shown by the blood'
    key: seely-lamb
    url: 'https://rsc.byu.edu/behold-lamb-god/behold-lamb-god'
    quote: 'When the Lord came in the night He would acknowledge the obedience of the household'
  - where: 'note 12:13 “A sign of the household’s obedience”'
    claim: 'The token showed commitment, faith and trust'
    key: ot-minute-ex-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-7-13'
    quote: 'This token indicated the commitment to follow God, obey Him, and have faith and trust in Him.'
  - where: 'note 12:13 “A sign of the household’s obedience”'
    claim: 'Hebrews says Moses kept the Passover and the sprinkling of blood through faith'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/11?lang=eng'
    quote: 'Through faith he kept the passover, and the sprinkling of blood, lest he that destroyed the firstborn should touch them.'

  # ---------- note 12:14 ----------
  - where: 'note 12:14 “How the feast is kept for ever”'
    claim: 'President Hunter: Jesus fulfilled the ancient law; the lamb is no longer required'
    key: hunter-passover
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1985/04/christ-our-passover?lang=eng'
    quote: 'Jesus fulfilled the ancient law and ushered in a new dispensation based on a higher, holier understanding of the law of sacrifice. No more would men be required to offer the firstborn lamb from their flock, because the Firstborn of God had come to offer himself'
  - where: 'note 12:14 “How the feast is kept for ever”'
    claim: 'President Hunter: the bread and wine became the emblems in place of the animals and herbs'
    key: hunter-passover
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1985/04/christ-our-passover?lang=eng'
    quote: 'The bread and wine, rather than the animals and herbs, would become emblems of the great Lamb’s body and blood, emblems to be eaten and drunk reverently and in remembrance of him forever.'
  - where: 'note 12:14 “How the feast is kept for ever”'
    claim: 'At the Passover meal the Savior instituted the sacrament'
    key: hunter-passover
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1985/04/christ-our-passover?lang=eng'
    quote: 'In this simple but impressive manner the Savior instituted the ordinance now known as the sacrament of the Lord’s Supper.'
  - where: 'note 12:14 “How the feast is kept for ever”'
    claim: 'The risen Lord ended blood sacrifice among the Nephites'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/9?lang=eng'
    quote: 'And ye shall offer up unto me no more the shedding of blood; yea, your sacrifices and your burnt offerings shall be done away'

  # ---------- note 12:22 ----------
  - where: 'note 12:22 “What hyssop was”'
    claim: 'Hyssop was a kind of wild marjoram, used at the Passover and in purification rites'
    key: bd-hyssop
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hyssop?lang=eng'
    quote: 'A kind of wild marjoram, used at the Passover (Ex. 12:22); for sprinkling purposes in the purification of lepers (Lev. 14:4, 51) and in the sacrifice of the red heifer (Num. 19:6; see also 1 Kgs. 4:33; Ps. 51:7).'
  - where: 'note 12:22 “What hyssop was”'
    claim: 'John alone mentions hyssop at the cross; Matthew and Mark only the reed'
    key: bd-hyssop
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hyssop?lang=eng'
    quote: 'According to John (19:29), the sponge with the vinegar offered to our Lord on the cross was “put upon hyssop.” Matthew and Mark do not mention the hyssop but only the reed'
  - where: 'note 12:22 “What hyssop was”'
    claim: 'Hyssop was a bushy shrub used in cleansing ceremonies'
    key: ot-minute-ex-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-7-13'
    quote: 'They were to take some hyssop, a type of bushy shrub used in some cleansing ceremonies, and dip it in the lamb’s blood and smear their home’s entryway with it.'
  - where: 'note 12:22 “What hyssop was”'
    claim: 'John likely names hyssop to evoke Exodus 12:22'
    key: sc-knowhy-845
    url: 'https://scripturecentral.org/knowhy/why-is-the-passover-important-for-understanding-easter'
    quote: 'John likely mentions hyssop more specifically to evoke the command to use a sprig of hyssop to smear the blood of the Passover lamb on their doorposts as recorded in Exodus 12:22.'
  - where: 'note 12:22 “What hyssop was”'
    claim: 'John’s wording at the cross'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/19?lang=eng'
    quote: 'they filled a sponge with vinegar, and put it upon hyssop, and put it to his mouth.'

  # ---------- note 12:23 ----------
  - where: 'note 12:23 “The LORD and the destroyer”'
    claim: 'The Hebrew word in 12:23 is a participle meaning destroyer, the form used of the destroying angel in 1 Chronicles 21:15'
    key: bdb
    url: 'https://biblehub.com/hebrew/7843.htm'
    quote: 'Participle as adjective, of lion Jeremiah 2:30, angel 1 Chronicles 21:15; = destroyer Exodus 12:23'
  - where: 'note 12:23 “The LORD and the destroyer”'
    claim: 'The Church’s help speaks of the Lord causing the destroying angel to pass over'
    key: scripture-helps-ex-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/13-exodus-7-13?lang=eng'
    quote: 'The Lord caused the destroying angel to pass over Israelite homes that were marked with the blood of a lamb.'
  - where: 'note 12:23 “The LORD and the destroyer”'
    claim: 'A latter-day revelation speaks of the destroying angel passing by as with the children of Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/89?lang=eng'
    quote: 'that the destroying angel shall pass by them, as the children of Israel, and not slay them.'

  # ---------- note 12:26 ----------
  - where: 'note 12:26 “The children’s question is written into the story”'
    claim: 'The chapter brings ritual instruction into the narrative in a way that nearly breaks the fourth wall'
    key: heal-children-ask
    url: 'https://mi.byu.edu/old-testament-reflections/and-when-your-children-ask-you'
    quote: 'Thematically, the chapter introduces ritual instruction into the narrative in a way that almost breaks the fourth wall.'
  - where: 'note 12:26 “The children’s question is written into the story”'
    claim: 'The narrator looks beyond Moses and Aaron and the congregation to posterity'
    key: heal-children-ask
    url: 'https://mi.byu.edu/old-testament-reflections/and-when-your-children-ask-you'
    quote: 'It is as though the narrator is looking beyond Moses and Aaron, and even beyond the “the whole congregation of Israel” (Exodus 12:3), to the author’s own community and their posterity (Exodus 12:24-25).'
  - where: 'note 12:26 “The children’s question is written into the story”'
    claim: 'Verses 26–27 are imagined future narratives'
    key: heal-children-ask
    url: 'https://mi.byu.edu/old-testament-reflections/and-when-your-children-ask-you'
    quote: 'This is no longer a direct narrative or an indirect narrative, but imagined future narratives.'
  - where: 'note 12:26 “The children’s question is written into the story”'
    claim: 'Remembering across generations is promoted by questions; the ordinance links generations'
    key: heal-children-ask
    url: 'https://mi.byu.edu/old-testament-reflections/and-when-your-children-ask-you'
    quote: 'And generational remembering is promoted through a culture of questions.'
  - where: 'note 12:26 “The children’s question is written into the story”'
    claim: 'The ordinance establishes links between generations'
    key: heal-children-ask
    url: 'https://mi.byu.edu/old-testament-reflections/and-when-your-children-ask-you'
    quote: 'The ordinance is establishing inter-generational links through recursive liturgical practices.'
  - where: 'note 12:26 “The children’s question is written into the story”'
    claim: 'The child’s question returns in Exodus 13:14 and Deuteronomy 6:20–21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/12?lang=eng'
    quote: '“children”: Ex. 13:14; Deut. 6:21 (20–25).'
  - where: 'note 12:26 “The children’s question is written into the story”'
    claim: 'In later times the head of the household related the history at the feast'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'The history of the redemption from Egypt was related by the head of the household (Ex. 12:26–27).'

  # ---------- note 12:29 ----------
  - where: 'note 12:29 “Why the firstborn”'
    claim: 'The death of Pharaoh’s firstborn was announced when Moses was sent back to Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/4?lang=eng'
    quote: 'Israel is my son, even my firstborn: And I say unto thee, Let my son go, that he may serve me: and if thou refuse to let him go, behold, I will slay thy son, even thy firstborn.'
  - where: 'note 12:29 “Why the firstborn”'
    claim: 'Moses announced the plague to Pharaoh beforehand'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/11?lang=eng'
    quote: 'About midnight will I go out into the midst of Egypt: And all the firstborn in the land of Egypt shall die'
  - where: 'note 12:29 “Why the firstborn”'
    claim: 'The Lord gives repeated warnings before judgment'
    key: scripture-helps-violence
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/52-violence-and-destruction-in-the-old-testament?lang=eng'
    quote: 'He does not rush to condemn but gives repeated warnings and opportunities to repent.'
  - where: 'note 12:29 “Why the firstborn”'
    claim: 'Much about such accounts remains hard to comprehend'
    key: scripture-helps-violence
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/52-violence-and-destruction-in-the-old-testament?lang=eng'
    quote: 'While much about the accounts of violence and destruction in the Old Testament remains difficult to fully comprehend'

  # ---------- note 12:35 ----------
  - where: 'note 12:35 “Borrowed means asked”'
    claim: '“Borrowed” may be read “asked”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/12?lang=eng'
    quote: '“borrowed”: OR asked.'
  - where: 'note 12:35 “Borrowed means asked”'
    claim: '“Lent unto them” may be read “let them have”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/12?lang=eng'
    quote: '“lent unto them”: OR let them have.'

  # ---------- note 12:37 ----------
  - where: 'note 12:37 “Six hundred thousand men”'
    claim: 'The figure agrees with the census of Numbers 1, which counted only men of war, so the whole could be over two million'
    key: ot-manual-ex-11-19
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-11-19-the-passover-and-the-exodus?lang=eng'
    quote: 'The figure given here of six hundred thousand men agrees approximately with the official census of the Israelites given in Numbers 1:45–46. There, however, men means only the males twenty years and older who were capable of going to war. This fact means that the total company could easily have been over two million people.'
  - where: 'note 12:37 “Six hundred thousand men”'
    claim: 'Numbers were hard to transmit accurately'
    key: ot-manual-large-numbers
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/enrichment-section-e-the-problem-of-large-numbers-in-the-old-testament?lang=eng'
    quote: 'numbers were peculiarly difficult to transmit accurately.'
  - where: 'note 12:37 “Six hundred thousand men”'
    claim: 'The word for thousand has other senses: family, clan, perhaps a military unit'
    key: ot-manual-large-numbers
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/enrichment-section-e-the-problem-of-large-numbers-in-the-old-testament?lang=eng'
    quote: '’eleph is the ordinary word for ‘thousand’, but it can also be used in a variety of other senses: e.g. ‘family’ (Judges 6:15, Revised Version) or ‘clan’ (Zechariah 9:7; 12:5, 6, Revised Standard Version) or perhaps a military unit.'
  - where: 'note 12:37 “Six hundred thousand men”'
    claim: 'On that proposal the migration numbered about 72,000'
    key: ot-manual-large-numbers
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/enrichment-section-e-the-problem-of-large-numbers-in-the-old-testament?lang=eng'
    quote: 'The total fighting force is some 18,000 which would probably mean a figure of about 72,000 for the whole migration.'
  - where: 'note 12:37 “Six hundred thousand men”'
    claim: 'The proposal is offered as something there is good reason to believe, about the censuses of Numbers'
    key: ot-manual-large-numbers
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/enrichment-section-e-the-problem-of-large-numbers-in-the-old-testament?lang=eng'
    quote: 'Suffice it to say that there is good reason to believe that the original censuses in Numbers 1 and 26 set out the numbers of each tribe, somewhat in this form'
  - where: 'note 12:37 “Six hundred thousand men”'
    claim: 'The word for thousand in 12:37 is eleph (Strong’s 505)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'אֶ֧לֶף'

  # ---------- note 12:38 ----------
  - where: 'note 12:38 “The mixed multitude and who may eat”'
    claim: 'The Hebrew means a blending of many, of other peoples'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/12?lang=eng'
    quote: '“a mixed multitude”: HEB a blending of many; i.e., of other peoples.'
  - where: 'note 12:38 “The mixed multitude and who may eat”'
    claim: 'Verse 38 implies that non-Israelites left too'
    key: ot-minute-ex-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-7-13'
    quote: 'Verse 38 implies that non-Israelites also left.'
  - where: 'note 12:38 “The mixed multitude and who may eat”'
