    url: 'https://biblehub.com/sep/exodus/12.htm'
    quote: 'And the sojourning of the children of Israel, while they sojourned in the land of Egypt and the land of Chanaan, was four hundred and thirty years.'
  - where: 'note 12:40 “Four hundred and thirty years, counted from when”'
    claim: 'The Samaritan text has a like addition, as the manual prints it'
    key: ot-manual-ex-11-19
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-11-19-the-passover-and-the-exodus?lang=eng'
    quote: 'which they sojourned in the land of Canaan and in the land of Egypt was 430 years'
  - where: 'note 12:40 “Four hundred and thirty years, counted from when”'
    claim: 'Other texts do not support the addition'
    key: ot-manual-ex-11-19
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-11-19-the-passover-and-the-exodus?lang=eng'
    quote: 'Other equally significant texts do not support this addition, however.'
  - where: 'note 12:40 “Four hundred and thirty years, counted from when”'
    claim: 'The Bible has two versions of the length; Paul seems to count from Abraham, though he may have meant something else'
    key: ot-manual-ex-11-19
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-11-19-the-passover-and-the-exodus?lang=eng'
    quote: 'The Bible contains two versions of how long Israel was in Egypt. According to Exodus 12:40–41, the period was exactly 430 years. Paul, however, in Galatians 3:17, seems to suggest that it was 430 years from the time Abraham received the covenant to the Exodus, although Paul may have meant something else.'
  - where: 'note 12:40 “Four hundred and thirty years, counted from when”'
    claim: 'Genesis 15:13 suggests a captivity of four hundred years; a scholar the manual cites judges the longer stay best supported'
    key: ot-manual-ex-11-19
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-11-19-the-passover-and-the-exodus?lang=eng'
    quote: 'This passage suggests strongly that the captivity would be four hundred years. One scholar wrote a summary of the evidence for both views and concluded that the idea of the longer captivity is the best supported.'
  - where: 'note 12:40 “Four hundred and thirty years, counted from when”'
    claim: 'The Greek reading would reduce the stay in Egypt to 215 years'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/12.htm'
    quote: 'nor are the 430 years to be reduced to 215 by an arbitrary interpolation, such as we find in the lxx'
  - where: 'note 12:40 “Four hundred and thirty years, counted from when”'
    claim: 'Exodus 6 gives four generations from Levi to Moses; genealogies omit links'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/12.htm'
    quote: 'the genealogies do not always contain a complete enumeration of all the separate links, but very frequently intermediate links of little historical importance are omitted'
  - where: 'note 12:40 “Four hundred and thirty years, counted from when”'
    claim: 'Other genealogies give six to ten generations over the same span'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/12.htm'
    quote: 'we find six generations from Joseph to Zelophehad; … nine or ten are given from Joseph to Joshua.'
  - where: 'note 12:40 “Four hundred and thirty years, counted from when”'
    claim: 'Four generations are named between Levi and Moses in Exodus 6'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/12.htm'
    quote: 'the fact that there were more than the four generations mentioned in Exodus 6:16. between Levi and Moses'
  - where: 'note 12:40 “Four hundred and thirty years, counted from when”'
    claim: 'Paul’s count in Galatians'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/gal/3?lang=eng'
    quote: 'the law, which was four hundred and thirty years after'

