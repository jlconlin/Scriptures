chapter: 32
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'Moses was on the mount forty days and forty nights'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/24?lang=eng'
    quote: 'And Moses went into the midst of the cloud, and gat him up into the mount: and Moses was in the mount forty days and forty nights.'
  - where: 'setting'
    claim: 'While the calf was made, Moses was on the mount receiving the instructions for the tabernacle'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'As Moses was receiving the instructions for the tabernacle and its dedication at the top of Sinai, the Israelites at the mountain’s base feared that Moses would not return.'
  - where: 'setting'
    claim: 'Moses retells the calf in Deuteronomy 9, with details Exodus does not give (the LORD’s anger with Aaron)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/9?lang=eng'
    quote: 'And the Lord was very angry with Aaron to have destroyed him: and I prayed for Aaron also the same time.'
  - where: 'setting'
    claim: 'Jeroboam set up two calves with the words of Exodus 32:4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/12?lang=eng'
    quote: 'Whereupon the king took counsel, and made two calves of gold, and said unto them, It is too much for you to go up to Jerusalem: behold thy gods, O Israel, which brought thee up out of the land of Egypt.'
  - where: 'thread'
    claim: 'The chapter divides into the sin (1–6), the LORD and Moses on the mount (7–14), the descent and the destruction of the calf (15–20), Aaron (21–24), the Levites (25–29), and Moses’s second intercession (30–35)'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/32.htm'
    quote: 'The sin of the Golden Calf, vv. 1–6; Jehovah, having told Moses that it is His intention to destroy the people in consequence, is diverted from His purpose by Moses’ intercession, vv. 7–14; Moses, coming down from the mount'
  - where: 'thread'
    claim: 'The people had committed to all the LORD desired; the calf, weeks later, was open rebellion'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'Now, many weeks later, they were not just rejecting the Lord’s proposal, they were committing an act of open rebellion.'
  - where: 'thread'
    claim: 'In the Joseph Smith Translation the LORD’s answer on the mount is conditional on the people’s repentance'
    key: jst-ex-32
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-ex/32?lang=eng'
    quote: 'And the Lord said unto Moses, If they will repent of the evil which they have done, I will spare them, and turn away my fierce wrath'
  - where: 'section 5 plain'
    claim: '“Naked” in verse 25 is rendered “broken loose,” following the Church’s footnote'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/32?lang=eng'
    quote: 'OR riotous, let loose.'

  # ---------- note 32:4 ----------
  - where: 'note 32:4 “What the calf stood for”'
    claim: 'The people feared their connection with God was broken by Moses’s absence and wanted an idol for access'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'Moses’s absence has led the Israelites to fear that their connection with the divine has been broken in some fashion thus, the idol was needed for access.'
  - where: 'note 32:4 “What the calf stood for”'
    claim: 'The idol probably took the place of Moses as intercessor; the calf may have been a pedestal, a symbol of the LORD’s presence'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'Thus, the golden calf would have served as the pedestal for Jehovah—a symbol of his presence. … Thus, it is likely that the Israelites substituted the intercessory role of Moses with an idol that would function the same way.'
  - where: 'note 32:4 “What the calf stood for”'
    claim: 'The bull represented a major deity across the ancient Near East'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'In most major cultures of the ancient Near East, the bull (and in some cases the cow as well) represented a major deity of that culture'
  - where: 'note 32:4 “What the calf stood for”'
    claim: 'Some suggest the Egyptian bull-god Apis; the study answers that Israel would hardly expect an Egyptian god to deliver them from Egypt'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'some have suggested that the golden calf represented the bull-god Apis … But this would presuppose that the Israelites expected an Egyptian deity to deliver them from Egypt, which hardly seems correct.'
  - where: 'note 32:4 “What the calf stood for”'
    claim: 'The study concludes that the idol more likely represented Yahweh'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'Having said all this, it is more likely that the idol was meant to represent Yahweh, who could be found to be represented by the bull as well.'
  - where: 'note 32:4 “What the calf stood for”'
    claim: 'The narrative uses the plural of the single calf'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'As to whether there was one or more idols, though calf is singular, the narrative is consistent in the use of the plural, particularly the verbal forms, when referring to the idol.'
  - where: 'note 32:4 “What the calf stood for”'
    claim: 'Even if meant for Yahweh, the image was an idol and broke the commandments'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'Yet even if the golden calf was made to represent Yahweh, the reader is to understand the image fell under the parameter of an idol, and thus the Israelites had quickly broken the explicit commandments'
  - where: 'note 32:4 “What the calf stood for”'
    claim: 'Nehemiah 9, a confession led by Levites, gives the words in the singular'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/9?lang=eng'
    quote: 'Yea, when they had made them a molten calf, and said, This is thy God that brought thee up out of Egypt, and had wrought great provocations;'
  - where: 'note 32:4 “What the calf stood for”'
    claim: 'Jeroboam uses the words of Exodus 32:4 of his two calves'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/12?lang=eng'
    quote: 'behold thy gods, O Israel, which brought thee up out of the land of Egypt.'

  # ---------- note 32:6 ----------
  - where: 'note 32:6 “What the people rose up to do”'
    claim: 'BDB lists the verb in Exodus 32:6 under “sport, play”'
    key: bdb
    url: 'https://biblehub.com/hebrew/6711.htm'
    quote: '2 sport, play Genesis 21:9 (E) Exodus 32:6 (J); make sport for Judges 16:25'
  - where: 'note 32:6 “What the people rose up to do”'
    claim: 'Rites of true worship (burnt and peace offerings) were kept, offered through the calf'
    key: ot-manual-ex-21-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-21-24-31-35-the-mosaic-law-a-preparatory-gospel?lang=eng'
    quote: 'some of the proper rites of the true worship were observed on this occasion, for they brought burnt-offerings and peace-offerings … though he permitted and even encouraged them to offer this worship through an idolatrous medium, the molten calf.'
  - where: 'note 32:6 “What the people rose up to do”'
    claim: 'The Church’s footnote on “peace offerings” in 32:6 points to Exodus 24:5; Paul quotes the verse'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/10?lang=eng'
    quote: 'Neither be ye idolaters, as were some of them; as it is written, The people sat down to eat and drink, and rose up to play.'

  # ---------- note 32:10 ----------
  - where: 'note 32:10 “The offer Moses refused”'
    claim: 'The offer tested and showed Moses’s integrity; he interceded instead of exalting himself'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'Jehovah created a circumstance that tested and then demonstrated the prophet’s exceptional integrity and character. … Instead of seizing the opportunity to exalt himself, his name, and his posterity, Moses interceded on behalf of Jacob’s posterity'
  - where: 'note 32:10 “The offer Moses refused”'
    claim: 'Keil: “let me alone” puts the nation’s fate in Moses’s hand; Moses stood the test'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/32.htm'
    quote: 'God puts the fate of the nation into the hand of Moses, that he may remember his mediatorial office, and show himself worthy of his calling. … And Moses stood the test.'
  - where: 'note 32:10 “The offer Moses refused”'
    claim: 'The offer echoes the promise to Abraham in Genesis 12:2 and recurs at Numbers 14:12'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/32.htm'
    quote: 'make of him a great nation, as He had promised Abraham in Genesis 12:2. … the words which God made use of on a subsequent occasion of a similar kind (Numbers 14:12)'
  - where: 'note 32:10 “The offer Moses refused”'
    claim: 'Moses lay before the LORD forty days pleading'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/9?lang=eng'
    quote: 'Thus I fell down before the Lord forty days and forty nights, as I fell down at the first; because the Lord had said he would destroy you.'

  # ---------- note 32:14 ----------
  - where: 'note 32:14 “The Joseph Smith Translation of the LORD’s answer”'
    claim: 'JST Exodus 32:14 in full'
    key: jst-ex-32
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-ex/32?lang=eng'
    quote: 'And the Lord said unto Moses, If they will repent of the evil which they have done, I will spare them, and turn away my fierce wrath; but, behold, thou shalt execute judgment upon all that will not repent of this evil this day. Therefore, see thou do this thing that I have commanded thee, or I will execute all that which I had thought to do unto my people.'
  - where: 'note 32:14 “The Joseph Smith Translation of the LORD’s answer”'
    claim: 'JST Exodus 32:12, in the footnote: the people will repent'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/32?lang=eng'
    quote: 'JST Ex. 32:12 … wrath. Thy people will repent of this evil; therefore come thou not out against them.'
  - where: 'note 32:14 “The Joseph Smith Translation of the LORD’s answer”'
    claim: 'The Student Manual gives the verse 12 reading with “Turn from thy fierce wrath”'
    key: ot-manual-ex-21-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-21-24-31-35-the-mosaic-law-a-preparatory-gospel?lang=eng'
    quote: 'The Joseph Smith Translation corrects this verse to show that Moses said: “Turn from thy fierce wrath. Thy people will repent of this evil; therefore come thou not out against them.”'

  # ---------- note 32:19 ----------
  - where: 'note 32:19 “Why Moses broke the tables”'
    claim: 'Breaking a tablet could signify invalidating a treaty; an Akkadian legal phrase of Hammurabi’s era meant this'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'In the ancient Near East, to “break a tablet” could signify the invalidating of a treaty. In the Akkadian legal terminology of Hammurabi’s era, for example, the phrase tuppam hepu (“break the tablet”) meant to break an agreement, to invalidate or repudiate a document.'
  - where: 'note 32:19 “Why Moses broke the tables”'
    claim: 'The broken tablets reflected the rejected promise'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'Thus, the terms of Jehovah’s original agreement with the Israelites (Exodus 19:5–8) were no longer in force. Broken tablets reflected the rejected promise.'
  - where: 'note 32:19 “Why Moses broke the tables”'
    claim: 'By breaking them Moses nullified the covenants written on them'
    key: ot-minute-ex-24
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-24-28-31-34'
    quote: 'Moses became angry and broke the two tablets of commandments and laws. By breaking the two tablets, Moses essentially nullified the covenants written upon them.'
  - where: 'note 32:19 “Why Moses broke the tables”'
    claim: 'The calf came at the moment Moses was receiving the fulness of the gospel for the people'
    key: thomas-provocation
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/provocation-wilderness-rejection-grace'
    quote: 'Their rejection of the Lord in the very moment that Moses was receiving the fulness of the gospel for them was a most serious provocation.'
  - where: 'note 32:19 “Why Moses broke the tables”'
    claim: 'Moses broke the tables before the people’s eyes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/9?lang=eng'
    quote: 'And I took the two tables, and cast them out of my two hands, and brake them before your eyes.'

  # ---------- note 32:20 ----------
  - where: 'note 32:20 “Why the people were made to drink the calf”'
    claim: 'Cambridge: the people drink their own sin; compares Numbers 5:24'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/32.htm'
    quote: '20. The people are made to drink their own sin. … to drink of it] Cf. the curses to be drunk by the suspected wife, Numbers 5:24.'
  - where: 'note 32:20 “Why the people were made to drink the calf”'
    claim: 'Keil: not to shame them, but a sign that they would bear the sin; compares Numbers 5:24'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/32.htm'
    quote: 'The sin was poured as it were into their bowels along with the water, as a symbolical sign that they would have to bear it and atone for it, just as a woman who was suspected of adultery was obliged to drink the curse-water (Numbers 5:24).'
  - where: 'note 32:20 “Why the people were made to drink the calf”'
    claim: 'Keil rejects the view that the object was to shame them with the worthlessness of their god'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/32.htm'
    quote: 'The object of this was certainly not to make them ashamed, by showing them the worthlessness of their god'
  - where: 'note 32:20 “Why the people were made to drink the calf”'
    claim: 'Deuteronomy calls the calf “your sin” and says the dust was cast into the brook from the mount'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/9?lang=eng'
    quote: 'And I took your sin, the calf which ye had made, and burnt it with fire, and stamped it, and ground it very small, even until it was as small as dust: and I cast the dust thereof into the brook that descended out of the mount.'

  # ---------- note 32:24 ----------
  - where: 'note 32:24 “Aaron’s account, and what became of Aaron”'
    claim: 'Aaron excused himself by blaming the people, and bore responsibility'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'The Hebrew text of Exodus 32:22–25 is clear that Aaron tried to excuse himself to Moses for making the golden calf by vilifying the people to Moses. But Aaron bore responsibility for letting the people get out of control'
  - where: 'note 32:24 “Aaron’s account, and what became of Aaron”'
    claim: 'Aaron was not destroyed; his repentance was apparently accepted'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'Aaron was not destroyed. He lived to the ripe old age of 123 and died on Mount Hor (Numbers 20:22–29; 33:38–39). Apparently, Aaron’s repentance was real and accepted by the Lord.'
  - where: 'note 32:24 “Aaron’s account, and what became of Aaron”'
    claim: 'The LORD was angry enough with Aaron to destroy him, and Moses prayed for him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/9?lang=eng'
    quote: 'And the Lord was very angry with Aaron to have destroyed him: and I prayed for Aaron also the same time.'

  # ---------- note 32:25 ----------
  - where: 'note 32:25 “Naked, or let loose”'
    claim: 'BDB: the verb in Exodus 32:25, twice, means to let loose, remove restraint'
    key: bdb
    url: 'https://biblehub.com/hebrew/6544.htm'
    quote: '1 let go, let loose, people, i.e. remove restraint from them, Exodus 32:25 (twice in verse) (E); … unbind head (by removing turban, sign of mourning) Leviticus 10:6'
  - where: 'note 32:25 “Naked, or let loose”'
    claim: 'The Church’s footnote gives “riotous, let loose”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/32?lang=eng'
    quote: 'OR riotous, let loose.'
  - where: 'note 32:25 “Naked, or let loose”'
    claim: 'The Student Manual (quoting Rasmussen) allows both senses: exposed in guilt, and unruly'
    key: ot-manual-ex-21-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-21-24-31-35-the-mosaic-law-a-preparatory-gospel?lang=eng'
    quote: 'The expression can also mean ‘exposed in guilt before God’s wrath.’ … Both conditions would be to the shame of a people who were supposed to be religious.'

  # ---------- note 32:26 ----------
  - where: 'note 32:26 “The Levites”'
    claim: 'Levites are the descendants of Levi, assigned the ministry of the sanctuary, assistants to the priests'
    key: bd-levites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levites?lang=eng'
    quote: 'Descendants of Levi. The work of ministering in the sanctuary was assigned to this tribe. … The work of the Levites was to assist the priests (Num. 3:5–10; 18:1–7).'
  - where: 'note 32:26 “The Levites”'
    claim: 'They were given to God in place of the firstborn and had no inheritance in Canaan'
    key: bd-levites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levites?lang=eng'
    quote: 'they thus became God’s peculiar property, given to Him in place of the firstborn (8:16). They were cleansed for their office (8:7–16). They had no inheritance in Canaan (18:23–24)'
  - where: 'note 32:26 “The Levites”'
    claim: 'Deuteronomy 10:8: the tribe of Levi was separated “at that time”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/10?lang=eng'
    quote: 'At that time the Lord separated the tribe of Levi, to bear the ark of the covenant of the Lord, to stand before the Lord to minister unto him, and to bless in his name, unto this day.'
  - where: 'note 32:26 “The Levites”'
    claim: 'One older reading: “At that time” in Deuteronomy 10:8 refers to the stay at Horeb'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/32.htm'
    quote: 'At that time will refer to the period of the stay at Horeb, the subject of Deuteronomy 9:8 to Deuteronomy 10:5'
  - where: 'note 32:26 “The Levites”'
    claim: 'Keil reads verse 29 as a call to consecrate themselves for the LORD’s service, and joins Deuteronomy 33:9 to it'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/32.htm'
    quote: 'consecrate yourselves to-day for the service of the Lord, by preserving the obedience you have just shown towards Him, by not knowing either son or brother in His service, and thus gain for yourselves a blessing.'
  - where: 'note 32:26 “The Levites”'
    claim: 'Keil: Moses saw in their obedience what would fit them for the LORD’s service; cf. Deuteronomy 33:9'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/32.htm'
    quote: 'Moses discerns such a disposition and act as would fit them for the service of the Lord.'
  - where: 'note 32:26 “The Levites”'
    claim: 'Deuteronomy 33:9, Moses’s blessing on Levi'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/33?lang=eng'
    quote: 'Who said unto his father and to his mother, I have not seen him; neither did he acknowledge his brethren, nor knew his own children: for they have observed thy word, and kept thy covenant.'

  # ---------- note 32:28 ----------
  - where: 'note 32:28 “The three thousand”'
    claim: 'JST Exodus 32:14 records the LORD’s command to execute judgment on those who will not repent that day'
    key: jst-ex-32
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-ex/32?lang=eng'
    quote: 'thou shalt execute judgment upon all that will not repent of this evil this day. Therefore, see thou do this thing that I have commanded thee, or I will execute all that which I had thought to do unto my people.'
  - where: 'note 32:28 “The three thousand”'
    claim: 'The Church’s chapter heading calls the slain “rebels”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/32?lang=eng'
    quote: 'The Levites slay about 3,000 rebels'
  - where: 'note 32:28 “The three thousand”'
    claim: 'The Church’s appendix: such accounts remain hard to comprehend'
    key: scripture-helps-violence
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/52-violence-and-destruction-in-the-old-testament?lang=eng'
    quote: 'While much about the accounts of violence and destruction in the Old Testament remains difficult to fully comprehend, the following perspectives can help us approach them with greater understanding.'
  - where: 'note 32:28 “The three thousand”'
    claim: 'God has always been perfectly merciful and perfectly just'
    key: scripture-helps-violence
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/52-violence-and-destruction-in-the-old-testament?lang=eng'
    quote: 'it is important to remember that God, who “is the same yesterday, today, and forever,” has always been perfectly merciful and perfectly just.'
  - where: 'note 32:28 “The three thousand”'
    claim: 'God gives warnings and opportunities to repent before judging'
    key: scripture-helps-violence
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/52-violence-and-destruction-in-the-old-testament?lang=eng'
    quote: 'He does not rush to condemn but gives repeated warnings and opportunities to repent.'

  # ---------- note 32:32 ----------
  - where: 'note 32:32 “The book, and the offer the LORD declined”'
    claim: 'Scripture speaks of a heavenly record of the faithful'
    key: bd-book-of-life
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/book-of-life?lang=eng'
    quote: 'However, the scriptures indicate that a heavenly record is kept of the faithful, whose names are recorded, as well as an account of their righteous deeds (D&C 88:2; 128:7).'
  - where: 'note 32:32 “The book, and the offer the LORD declined”'
    claim: 'The Church’s footnote on “book” in 32:33 points to the Topical Guide entry “Book of Life”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/32?lang=eng'
    quote: 'TG Book of Life'
  - where: 'note 32:32 “The book, and the offer the LORD declined”'
    claim: 'Psalm 69:28 uses the image of being blotted from the book of the living'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/69?lang=eng'
    quote: 'Let them be blotted out of the book of the living, and not be written with the righteous.'
  - where: 'note 32:32 “The book, and the offer the LORD declined”'
    claim: 'The Church’s footnote on “blot” in 32:32 points to Romans 9:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/9?lang=eng'
    quote: 'For I could wish that myself were accursed from Christ for my brethren, my kinsmen according to the flesh:'

  # ---------- christ / explore ----------
  - where: 'christ'
    claim: 'Moses’s pleading can remind us of Christ, the advocate with the Father'
    key: scripture-helps-ex-19
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/15-exodus-19-20-24-31-34?lang=eng'
    quote: 'Moses’s pleading with the Lord on behalf of his people can remind us of Jesus Christ, who is our advocate with the Father.'
  - where: 'christ'
    claim: 'The Student Manual sees the similitude of Moses 1:6 in Moses as mediator here'
    key: ot-manual-ex-21-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-21-24-31-35-the-mosaic-law-a-preparatory-gospel?lang=eng'
    quote: 'That similitude is shown clearly here. As the people faced destruction because of their wickedness, Moses became their mediator with God.'
  - where: 'christ'
    claim: 'D&C 45:3–5: the Savior as advocate, pleading His own suffering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'Listen to him who is the advocate with the Father, who is pleading your cause before him—'
  - where: 'explore'
