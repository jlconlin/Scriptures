chapter: 10
claims:
  - where: 'setting'
    claim: 'One proposal ties the hail, locusts and darkness to seasonal winds from February to April'
    key: sc-knowhy-631
    url: 'https://scripturecentral.org/knowhy/why-were-particular-plagues-sent-against-egypt'
    quote: 'The next three plagues—the hailstorm, the swarms of locusts, and the thick darkness which could be “felt”—are all linked to seasonal winds occurring from February to April.'
  - where: 'setting'
    claim: 'On that proposal the series of plagues ends in the spring, at the time of the Passover'
    key: sc-knowhy-631
    url: 'https://scripturecentral.org/knowhy/why-were-particular-plagues-sent-against-egypt'
    quote: 'Thus, the whole sequence would have culminated in the spring, corresponding to the timing of Passover.'
  - where: 'setting'
    claim: 'The Joseph Smith Translation in the footnotes to verses 1, 20 and 27 has Pharaoh harden his own heart'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/10?lang=eng'
    quote: 'But Pharaoh hardened his heart …'
  - where: 'setting'
    claim: 'The Church''s footnotes join the locusts of this chapter to Psalm 105:34 and Mosiah 12:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/10?lang=eng'
    quote: 'Ps. 105:34; Mosiah 12:6 (6–7).'
  - where: 'setting'
    claim: 'Psalm 105 names the darkness and the locusts'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/105?lang=eng'
    quote: 'He sent darkness, and made it dark; and they rebelled not against his word.'
  - where: 'setting'
    claim: 'Abinadi warns of hail, an east wind and insects that devour grain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/12?lang=eng'
    quote: 'I will send forth hail among them, and it shall smite them; and they shall also be smitten with the east wind; and insects shall pester their land also, and devour their grain.'
  - where: 'thread'
    claim: 'On one reading the king of Egypt was supposed to ensure the harvest'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'More apropos to the contest motif, the king was supposed to be able to ensure a good harvest and prevent such calamities.'
  - where: 'thread'
    claim: 'The king was held responsible for Egypt''s sunlight'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'The king was seen as being directly responsible for Egypt receiving sunlight or for illuminating the two lands.'
  - where: 'section 2 plain'
    claim: '“Destroyed” in verse 7 may be rendered “ruined”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/10?lang=eng'
    quote: 'OR ruined.'
  - where: 'section 2 plain'
    claim: 'Pharaoh''s words in verse 10 are a conditional and an accusation: “if” for “as,” and “evil is before you” an idiom for being bent on mischief'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/10?lang=eng'
    quote: 'Hebrew idiom meaning “you are bent on mischief.”'
  - where: 'section 2 plain'
    claim: 'A modern translation renders verse 10 as an ironic refusal'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2010%3A2%2C10%2C21%2C29&version=NRSVUE'
    quote: 'The Lord indeed will be with you, if ever I let your little ones go with you! Plainly, you have some evil purpose in mind.'
  - where: 'section 3 plain'
    claim: '“This death” in verse 17 is the deadly plague of locusts'
    key: ot-minute-ex-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-7-13'
    quote: 'Pharaoh hastily called for Moses and Aaron to ask God to take away the deadly plague.'
  - where: 'section 5 plain'
    claim: '“Be stayed” in verse 24 means remain behind'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/10?lang=eng'
    quote: 'OR remain behind.'
  - where: 'section 5 plain'
    claim: '“Thou hast spoken well” in verse 29 is in Hebrew “As you have spoken”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/10?lang=eng'
    quote: 'HEB As you have spoken.'
  - where: 'note 10:2 “Signs meant to be retold”'
    claim: 'Moses is addressed in verse 2 as the representative of the nation'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/10.htm'
    quote: 'In the expression, "thou mayest tell," Moses is addressed as the representative of the nation.'
  - where: 'note 10:2 “Signs meant to be retold”'
    claim: 'Psalms 78 and 105 show how Israel told the signs to its children'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/10.htm'
    quote: 'We may learn from Psalm 78 and 105 in what manner the Israelites narrated these signs to their children and children''s children.'
  - where: 'note 10:2 “Signs meant to be retold”'
    claim: 'The verse ends in the plural, and its concern for teaching later generations is compared with Exodus 12:26 and Psalm 78:5–6'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/10.htm'
    quote: 'The story is to be passed on to the children. The interest in the instruction of future generations, as Deuteronomy 4:9; Deuteronomy 6:7; comp. also ch. Exodus 12:26 f., with the note, and Jdg 6:13, Psalm 44:1; Psalm 78:5-6.'
  - where: 'note 10:2 “Signs meant to be retold”'
    claim: 'The “thou” is Moses as Israel''s representative, with a plural “ye” at the end of the verse'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/10.htm'
    quote: 'i.e. Moses, addressed however as the representative of Israel. Cf. the plural ye at the end of the verse.'
  - where: 'note 10:2 “‘Wrought’ is a mild word for the Hebrew”'
    claim: 'The Hebrew verb in this form means to busy or divert oneself with a person; BDB renders Exodus 10:2 “made a toy of Egypt” and gives the sense “deal wantonly, ruthlessly with”'
    key: bdb
    url: 'https://biblehub.com/hebrew/5953.htm'
    quote: 'busy, divert oneself with … Exodus 10:2 (J) how I … have made a toy of Egypt; especially deal wantonly, ruthlessly with'
  - where: 'note 10:2 “‘Wrought’ is a mild word for the Hebrew”'
    claim: 'The same form of the verb stands in 1 Samuel 6:6'
    key: bdb
    url: 'https://biblehub.com/hebrew/5953.htm'
    quote: 'especially deal wantonly, ruthlessly with … 1 Samuel 6:6'
  - where: 'note 10:2 “‘Wrought’ is a mild word for the Hebrew”'
    claim: 'One modern translation: “made fools of the Egyptians”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2010%3A2%2C10%2C21%2C29&version=NRSVUE'
    quote: 'and that you may tell your children and grandchildren how I have made fools of the Egyptians and what signs I have done among them'
  - where: 'note 10:2 “‘Wrought’ is a mild word for the Hebrew”'
    claim: 'Another modern translation: “dealt harshly”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2010%3A2%2C10%2C21%2C29&version=NIV'
    quote: 'how I dealt harshly'
  - where: 'note 10:5 “The locusts finish what the hail began”'
    claim: 'The damage of the hail and of the locusts can be treated as one'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'The damage done to the crops by the hail is compounded by the damage wrought thereafter by the locusts. Hence, we should consider this damage as a single aspect of two plagues'
  - where: 'note 10:5 “The locusts finish what the hail began”'
    claim: 'The king was supposed to ensure the harvest, and Egyptian literature says so abundantly'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'the king was supposed to be able to ensure a good harvest and prevent such calamities. Egyptian literature consistently and abundantly describes the king’s ability to bring forth crops abundantly'
  - where: 'note 10:5 “The locusts finish what the hail began”'
    claim: 'A ravaged crop was a sign of a weak king'
    key: sc-knowhy-631
    url: 'https://scripturecentral.org/knowhy/why-were-particular-plagues-sent-against-egypt'
    quote: 'The king was supposed to ensure a good harvest and prevent calamities like a locust infestation that destroys the crops. A ravaged crop was a sign of a weak king.'
  - where: 'note 10:5 “The locusts finish what the hail began”'
    claim: 'Locusts were a known pest in the ancient Near East'
    key: sc-knowhy-631
    url: 'https://scripturecentral.org/knowhy/why-were-particular-plagues-sent-against-egypt'
    quote: 'Locust are a commonly known pest in the ancient Near East.'
  - where: 'note 10:10 “Pharaoh’s blessing is a taunt”'
    claim: 'The Church''s footnote explains “evil is before you” as an idiom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/10?lang=eng'
    quote: 'Hebrew idiom meaning “you are bent on mischief.”'
  - where: 'note 10:10 “Pharaoh’s blessing is a taunt”'
    claim: 'The Church''s footnote gives “if” for “as”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/10?lang=eng'
    quote: 'OR if.'
  - where: 'note 10:10 “Pharaoh’s blessing is a taunt”'
    claim: 'A modern translation renders Pharaoh''s words as an ironic refusal'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2010%3A2%2C10%2C21%2C29&version=NRSVUE'
    quote: 'The Lord indeed will be with you, if ever I let your little ones go with you! Plainly, you have some evil purpose in mind.'
  - where: 'note 10:10 “Pharaoh’s blessing is a taunt”'
    claim: 'Another modern translation: “Clearly you are bent on evil”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2010%3A2%2C10%2C21%2C29&version=NIV'
    quote: 'Clearly you are bent on evil.'
  - where: 'note 10:13 “The east wind and the sea wind”'
    claim: 'Locusts breed in east Sudan and are blown into the Nile Valley by an east or southeast wind and cleared by a sea wind'
    key: sc-knowhy-631
    url: 'https://scripturecentral.org/knowhy/why-were-particular-plagues-sent-against-egypt'
    quote: 'They breed in east Sudan and move north along the Red Sea. An east (or southeast) wind would blow them into the Nile Valley, and then a “sea wind” (from the north or northwest) would clear them out.'
  - where: 'note 10:13 “The east wind and the sea wind”'
    claim: 'The Hebrew word for sea also means west, from the position of the Mediterranean'
    key: bdb
    url: 'https://biblehub.com/hebrew/3220.htm'
    quote: 'west, west-word (originally sea-ward, from position of Mediterranean with reference to Palestine, and this sense still often perceptible)'
  - where: 'note 10:13 “The east wind and the sea wind”'
    claim: 'The east wind was viewed as an instrument of God''s judgment'
    key: sc-knowhy-560
    url: 'https://scripturecentral.org/knowhy/why-did-abinadi-warn-the-people-of-an-east-wind'
    quote: 'the “east wind” was sometimes called “the wind of the Lord” (see Hosea 13:15) because it was “viewed as an instrument of God’s judgment.”'
  - where: 'note 10:13 “The east wind and the sea wind”'
    claim: '“East wind” could describe a hot, dry wind from any direction; in Egypt southern winds bring locusts'
    key: sc-knowhy-560
    url: 'https://scripturecentral.org/knowhy/why-did-abinadi-warn-the-people-of-an-east-wind'
    quote: '“East wind” could thus be used to describe any hot, dry, devasting wind, regardless of which direction it came from.'
  - where: 'note 10:13 “The east wind and the sea wind”'
    claim: 'Abinadi''s warning of an east wind uses the language of the Egyptian plagues'
    key: sc-knowhy-560
    url: 'https://scripturecentral.org/knowhy/why-did-abinadi-warn-the-people-of-an-east-wind'
    quote: 'couched in language reminiscent of the Egyptian plagues (cf. Exodus 10:13)'
  - where: 'note 10:21 “Darkness over the land of the sun”'
    claim: 'The sun was among the greatest objects of Egyptian worship, and the king was the son of Re and Re himself'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'The sun was among the greatest objects of Egyptian worship and was integrally tied to Re and his various syncretistic manifestations. The king was intimately caught up in this association, being both the son of Re and Re himself.'
  - where: 'note 10:21 “Darkness over the land of the sun”'
    claim: 'The king was held responsible for Egypt''s sunlight'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'The king was seen as being directly responsible for Egypt receiving sunlight or for illuminating the two lands.'
  - where: 'note 10:21 “Darkness over the land of the sun”'
    claim: 'The darkness may be the most direct attack on Pharaoh''s royal duties'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'The darkening of the sun may be the most direct attack against Pharaoh’s ability to fulfill his royal duties in the face of Jehovah’s power.'
  - where: 'note 10:21 “Darkness over the land of the sun”'
    claim: 'Re was the sun god'
    key: sc-knowhy-631
    url: 'https://scripturecentral.org/knowhy/why-were-particular-plagues-sent-against-egypt'
    quote: 'The chief Egyptian god, Amun-Re, was the personification of the sun.'
  - where: 'note 10:21 “Darkness over the land of the sun”'
    claim: 'A sandstorm on the hot southern winds of March and April can darken the sky for days'
    key: sc-knowhy-631
    url: 'https://scripturecentral.org/knowhy/why-were-particular-plagues-sent-against-egypt'
    quote: 'Hot southern winds, known as khamsin, blow in sand from the Sahara Desert in March and April. A large wind storm at this time can completely darken the sky for days at a time.'
  - where: 'note 10:21 “Darkness over the land of the sun”'
    claim: 'The darkness has been read as a warning of the death of the firstborn'
    key: ot-minute-ex-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-7-13'
    quote: 'Darkness in the scriptures often presages death. This plague was a warning of the final plague in Chapter 11—death of the firstborn.'
  - where: 'note 10:26 “Pharaoh’s offers, and why Moses takes none”'
    claim: 'Pharaoh had earlier offered to let the people go without the little ones, and now with them but without the cattle; the cattle were needed for sacrifice'
    key: ot-minute-ex-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-7-13'
    quote: 'Moses, however, demanded that they be allowed to leave with their cattle because they were necessary in their sacrificial ceremonies.'
  - where: 'note 10:26 “Pharaoh’s offers, and why Moses takes none”'
    claim: '“Be stayed” means remain behind'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/10?lang=eng'
    quote: 'OR remain behind.'
  - where: 'note 10:29 “The last audience runs on into chapter 11”'
    claim: 'Moses''s address in 11:4–8 continues his answer of 10:29'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/11.htm'
    quote: 'Moses'' address to Pharaoh forms the continuation of his brief answer in Exodus 10:29.'
  - where: 'note 10:29 “The last audience runs on into chapter 11”'
    claim: 'To “see my face” is to be admitted to the king''s presence'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/10.htm'
    quote: 'see my face] i.e. be admitted to my presence'
  - where: 'note 10:29 “The last audience runs on into chapter 11”'
    claim: 'Moses''s reply in Hebrew is “As you have spoken”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/10?lang=eng'
    quote: 'HEB As you have spoken.'
  - where: 'christ'
    claim: 'One older reading: the darkness on Egypt and the light on Israel are types of the wrath and grace of God'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/10.htm'
    quote: '"The darkness which covered the Egyptians, and the light which shone upon the Israelites, were types of the wrath and grace of God" (Hengstenberg).'
  - where: 'christ'
    claim: 'The Church''s footnote at “felt” in verse 21 points to 3 Nephi 8:20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/10?lang=eng'
    quote: '3 Ne. 8:20.'
  - where: 'christ'
    claim: 'In 3 Nephi the darkness could be felt and lasted three days, the sign of the Savior''s death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/8?lang=eng'
    quote: 'And it came to pass that it did last for the space of three days that there was no light seen'
  - where: 'parallels'
    claim: 'Abinadi warns of hail, the east wind and insects'
    key: sc-knowhy-560
    url: 'https://scripturecentral.org/knowhy/why-did-abinadi-warn-the-people-of-an-east-wind'
    quote: 'Abinadi foretold that the Lord would “send forth hail,” and would also smite them “with the east wind” and that “insects shall pester their land … and devour their grain” (Mosiah 12:6).'
  - where: 'parallels'
    claim: 'The darkness of 3 Nephi 8 could be felt and lasted three days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/8?lang=eng'
    quote: 'there was thick darkness upon all the face of the land, insomuch that the inhabitants thereof who had not fallen could feel the vapor of darkness'
  - where: 'christ'
    claim: 'Nephi cites Zenos for the three days of darkness as a sign of the Savior''s death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/19?lang=eng'
    quote: 'according to the words of Zenos, which he spake concerning the three days of darkness, which should be a sign given of his death unto those who should inhabit the isles of the sea'
