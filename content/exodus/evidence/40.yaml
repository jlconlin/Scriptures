chapter: 40
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'The tabernacle was raised on the first day of the first month of the second year'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'on the first day of the first month of the second year (one year less 14 days from the Exodus) he reared it up and finished the work.'
  - where: 'setting'
    claim: 'Israel had been at Sinai some nine months, Moses was twice forty days on the mount, and the building took less than half a year'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/40.htm'
    quote: 'As not quite nine months had elapsed between the arrival of the Israelites at Sinai … and the first day of the second year … the building, and all the work connected with it, had not occupied quite half a year; as we have to deduct from the nine months (or somewhat less) not only the eighty days which Moses spent upon Sinai'
  - where: 'setting'
    claim: 'Nine months since the arrival at Sinai'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/40.htm'
    quote: 'viz. (v. 17) of the second year of the Exodus, nine months since the arrival at Sinai (Exodus 19:1).'
  - where: 'setting'
    claim: 'Leviticus opens with the LORD calling Moses from the tabernacle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/1?lang=eng'
    quote: 'And the Lord called unto Moses, and spake unto him out of the tabernacle of the congregation, saying,'
  - where: 'setting'
    claim: 'The laws of sacrifice were given from the tabernacle'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/40.htm'
    quote: 'it was from the tabernacle that Jehovah spake to Moses, when He gave him the laws of sacrifice, which were promulgated before the consecration of the priests, and were carried out in connection with it.'
  - where: 'setting'
    claim: 'The people are numbered on the first day of the second month of the second year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/1?lang=eng'
    quote: 'And the Lord spake unto Moses in the wilderness of Sinai, in the tabernacle of the congregation, on the first day of the second month, in the second year after they were come out of the land of Egypt, saying,'
  - where: 'setting'
    claim: 'The cloud lifts on the twentieth day of the second month'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/10?lang=eng'
    quote: 'And it came to pass on the twentieth day of the second month, in the second year, that the cloud was taken up from off the tabernacle of the testimony.'
  - where: 'setting'
    claim: 'Israel leaves the wilderness of Sinai when the cloud lifts'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/10?lang=eng'
    quote: 'And the children of Israel took their journeys out of the wilderness of Sinai; and the cloud rested in the wilderness of Paran.'
  - where: 'thread'
    claim: 'The setting up began inside, in the Holy of Holies, and then moved outside'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'The setting up of the tabernacle began from the inside—starting in the Holy of Holies and moving in a clockwise fashion, from the setting up of the table of the bread of the presence, to the menorah, to the altar of incense. It then moved to the outside and the setting up of the altar, followed, finally, by the placing of the laver.'
  - where: 'thread'
    claim: 'The book closes with the promise of 29:43, 45 fulfilled'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/40.htm'
    quote: 'The book thus closes with the fulfilment of the promise given in Exodus 29:43; Exodus 29:45 (see on Exodus 29:43-46). The Dwelling is complete,—and Jehovah, with His protecting and sanctifying Presence, has taken up His abode in it, in the midst of His people.'
  - where: 'thread'
    claim: 'The cloud and glory having rested on Sinai now move upon the tabernacle'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'having rested atop Mount Sinai now moves upon the tabernacle'
  - where: 'thread'
    claim: 'The cloud that had guided Israel on the journey now came down on the tabernacle, and its rising was the command to go forward'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/40.htm'
    quote: 'now came down upon the tabernacle and filled the dwelling with the gracious presence of the Lord'

  # ---------- plain words ----------
  - where: 'section 1 plain'
    claim: '“Tabernacle of the congregation” is the tent of meeting; the “hanging” is a screen; “put the hanging” is set up the screen'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'HEB set up the screen for.'
  - where: 'section 1 plain'
    claim: 'The “hanging” at the court gate is a screen or curtain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'OR screen or curtain'
  - where: 'section 2 plain'
    claim: '“His foot” is its base; “tabernacle of the congregation” is the tent of meeting; the anointing is “for an” everlasting priesthood'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'HEB tent of meeting.'
  - where: 'section 2 plain'
    claim: '“His foot” is its base'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'OR its base.'
  - where: 'section 3 plain'
    claim: 'The “veil of the covering” is a screening veil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'OR screening veil and screened the ark.'
  - where: 'section 3 plain'
    claim: 'The “meat offering” is a meal or cereal offering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'OR meal or cereal.'
  - where: 'section 3 plain'
    claim: '“Sockets” are bases'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'HEB its bases.'
  - where: 'section 3 plain'
    claim: '“Staves” are poles'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'OR poles.'
  - where: 'section 3 plain'
    claim: '“Over against” is opposite'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'OR opposite.'

  # ---------- note 40:2 ----------
  - where: 'note 40:2 “New Year’s Day, a year after Egypt”'
    claim: 'The date is one year less fourteen days from the Exodus'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'on the first day of the first month of the second year (one year less 14 days from the Exodus) he reared it up and finished the work.'
  - where: 'note 40:2 “New Year’s Day, a year after Egypt”'
    claim: 'The Passover is commanded again in the first month of the second year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/9?lang=eng'
    quote: 'And the Lord spake unto Moses in the wilderness of Sinai, in the first month of the second year after they were come out of the land of Egypt, saying,'
  - where: 'note 40:2 “New Year’s Day, a year after Egypt”'
    claim: 'Numbers 9 is the command to keep the Passover again'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/9?lang=eng'
    quote: 'Israel is again commanded to keep the Passover—A cloud rests upon the'
  - where: 'note 40:2 “New Year’s Day, a year after Egypt”'
    claim: 'The first day of the first month is the day Noah uncovered the ark; a new beginning marks the creation, flood and tabernacle accounts'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'on “the first day of the first month” (40.2, 17), the same day the covering was removed from the ark for Noah to gaze upon a renewed creation (Genesis 8.13), that is, on New Year’s Day.141 This new beginning marks the creation … deluge … and tabernacle … narratives.'
  - where: 'note 40:2 “New Year’s Day, a year after Egypt”'
    claim: 'A devotional reading: the first day of a new year, symbolizing new life in Christ'
    key: champoux-beginning-again
    url: 'https://mi.byu.edu/old-testament-reflections/beginning-again'
    quote: 'In other words, at the start of the second year of their wanderings—not just the first day of the year but the first day of a new year.[3] Setting up the tabernacle on this day symbolized the new life redeemed Israel could find in Christ.'
  - where: 'note 40:2 “New Year’s Day, a year after Egypt”'
    claim: 'Israel left Egypt on the fifteenth day of the first month'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/33?lang=eng'
    quote: 'And they departed from Rameses in the first month, on the fifteenth day of the first month'

  # ---------- note 40:29 ----------
  - where: 'note 40:29 “Moses serves at the altar before Aaron is consecrated”'
    claim: 'Leviticus 8 tells the washing and the anointing of the tabernacle and of Aaron'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/8?lang=eng'
    quote: 'And Moses took the anointing oil, and anointed the tabernacle and all that was therein, and sanctified them.'
  - where: 'note 40:29 “Moses serves at the altar before Aaron is consecrated”'
    claim: 'Numbers looks back on the setting up and the anointing together'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/7?lang=eng'
    quote: 'And it came to pass on the day that Moses had fully set up the tabernacle, and had anointed it, and sanctified it, and all the instruments thereof'
  - where: 'note 40:29 “Moses serves at the altar before Aaron is consecrated”'
    claim: 'Verse 16 is stated provisionally; the consecration came somewhat later'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/40.htm'
    quote: 'It is stated provisionally, in Exodus 40:16, that this command was fulfilled by Moses. But from the further history we find that the consecration of the priests did not take place contemporaneously with the erection of the tabernacle, but somewhat later'
  - where: 'note 40:29 “Moses serves at the altar before Aaron is consecrated”'
    claim: 'The offering is the daily morning and evening sacrifice, performed before the anointing'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/40.htm'
    quote: 'offered "the burnt-offering and meat-offering," i.e., the daily morning and evening sacrifice, upon the altar of burnt-offering (Exodus 29:38-42). Consequently the sacrificial service was performed upon them before they had been anointed.'
  - where: 'note 40:29 “Moses serves at the altar before Aaron is consecrated”'
    claim: 'The furnishings were holy by being made as instructed and by the glory filling the house'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/40.htm'
    quote: 'They were made holy things and holy vessels by the fact that they were built, prepared, and set up, according to the instructions given by Jehovah; and still more by the fact, that … the "glory of the Lord filled the tabernacle"'
  - where: 'note 40:29 “Moses serves at the altar before Aaron is consecrated”'
    claim: 'The “meat offering” is a meal or cereal offering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'OR meal or cereal.'

  # ---------- note 40:33 ----------
  - where: 'note 40:33 “Seven times “as the LORD commanded Moses””'
    claim: 'The Sabbath ties the creation and tabernacle accounts together'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'The Sabbath, in fact, appears to tie the creation (Genesis 2.1-3), deluge (Genesis 8.6-12), Sinai (Exodus 24.16-18), and tabernacle accounts (Exodus 35.1-3)'
  - where: 'note 40:33 “Seven times “as the LORD commanded Moses””'
    claim: 'The tabernacle is completed by seven acts of Moses, beside seven speeches'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'the tabernacle not only being completed in seven speeches (with the seventh addressing the Sabbath) and by seven acts of Moses who did “just as Yhwh commanded” (cf. Exodus 40.19, 21, 23, 25, 27, 29, 32)'
  - where: 'note 40:33 “Seven times “as the LORD commanded Moses””'
    claim: 'The end of Exodus may serve as a bookend with the creation account: a completed building sanctified by the LORD’s presence'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'the book of Exodus thus ends with a climax that may serve as something of a bookend with the creation account in as much as it describes a completed temple-building project sanctified by the presence of Yhwh (40.34-35)'
  - where: 'note 40:33 “Seven times “as the LORD commanded Moses””'
    claim: 'Exodus 40:33 has the verb “finished” (Strong’s 3615) and the noun “work” (4399)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וַ/יְכַ֥ל'
  - where: 'note 40:33 “Seven times “as the LORD commanded Moses””'
    claim: 'Genesis 2:2 has the same verb (Strong’s 3615) and noun (4399)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'וַ/יְכַ֤ל'

  # ---------- note 40:34 ----------
  - where: 'note 40:34 “The cloud and the glory on later houses of the LORD”'
    claim: 'After a temple is dedicated God comes to it in glory, as at the tabernacle and Solomon’s temple'
    key: sc-knowhy-806
    url: 'https://scripturecentral.org/knowhy/how-does-the-construction-of-the-kirtland-temple-follow-ancient-patterns'
    quote: 'Finally, after the temple is dedicated, God comes to His new house in glory. When the children of Israel finished the tabernacle, “a cloud covered the tent of the congregation, and the glory of the Lord filled the tabernacle” (Exodus 40:34).'
  - where: 'note 40:34 “The cloud and the glory on later houses of the LORD”'
    claim: 'The cloud and glory filled Solomon’s temple at its dedication'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'So that the priests could not stand to minister because of the cloud: for the glory of the Lord had filled the house of the Lord.'
  - where: 'note 40:34 “The cloud and the glory on later houses of the LORD”'
    claim: 'Ezekiel saw the glory fill the temple'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/43?lang=eng'
    quote: 'So the spirit took me up, and brought me into the inner court; and, behold, the glory of the Lord filled the house.'
  - where: 'note 40:34 “The cloud and the glory on later houses of the LORD”'
    claim: 'D&C 84:5 speaks of the temple in the New Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: '1–5, The New Jerusalem and the temple will be built in Missouri'
  - where: 'note 40:34 “The cloud and the glory on later houses of the LORD”'
    claim: 'D&C 109 is the prayer dedicating the Kirtland Temple'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/109?lang=eng'
    quote: 'That thy glory may rest down upon thy people, and upon this thy house, which we now dedicate to thee, that it may be sanctified and consecrated to be holy, and that thy holy presence may be continually in this house;'

  # ---------- note 40:35 ----------
  - where: 'note 40:35 “Why Moses could not go in”'
    claim: 'No real discrepancy: Moses had to wait for the invitation, as on Sinai, which probably comes at Lev. 1:1 or 9:23'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'is likely right in pointing out “no real discrepancy” here in Moses’ inability to enter since even in Exodus 24.15-18 (as well as in 19.20) it is clear that he had to wait until Yhwh’s invitation (24.17) which, in the tabernacle context, probably occurs in Leviticus (either 1.1 or 9.23).'
  - where: 'note 40:35 “Why Moses could not go in”'
    claim: 'The verse still makes Moses’s inability a matter of emphasis'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'However, and given the lack of objective discrepancy, Exodus 40.35 still makes Moses’ inability to enter the Presence a matter of literary emphasis not found in the narrative of chapter 24'
  - where: 'note 40:35 “Why Moses could not go in”'
    claim: 'The same “not able” as Ex. 33:20; the Presence in the tabernacle is real though mediated'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'In Exodus 33.20, Yhwh had prohibited Moses from entering his Presence too directly (“You are not able (לא תוכל) to see my face…”), so that the prohibition here would seem to imply that Yhwh’s Presence via the tabernacle though mediated is nonetheless a real Presence not to be trifled with'
  - where: 'note 40:35 “Why Moses could not go in”'
    claim: 'The LORD calls Moses from the tabernacle in Lev. 1:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/1?lang=eng'
    quote: 'And the Lord called unto Moses, and spake unto him out of the tabernacle of the congregation, saying,'
  - where: 'note 40:35 “Why Moses could not go in”'
    claim: 'The study gives the intensity of the Presence as why Moses cannot enter'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'the intensity of this glorious mystery is so powerful, Moses is not able to enter'

  # ---------- christ / explore ----------
  - where: 'christ'
    claim: 'John 1:14 speaks of the Word dwelling among us and of His glory'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/1?lang=eng'
    quote: 'And the Word was made flesh, and dwelt among us, (and we beheld his glory, the glory as of the only begotten of the Father,) full of grace and truth.'
  - where: 'christ'
    claim: 'Hebrews calls Christ minister of the true tabernacle and the earthly holy places figures of the true'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/9?lang=eng'
    quote: 'For Christ is not entered into the holy places made with hands, which are the figures of the true; but into heaven itself, now to appear in the presence of God for us:'
  - where: 'christ'
    claim: 'Revelation calls God’s dwelling with men “the tabernacle of God”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/21?lang=eng'
    quote: 'Behold, the tabernacle of God is with men, and he will dwell with them, and they shall be his people, and God himself shall be with them, and be their God.'
  - where: 'explore'
    claim: 'The study follows the cloud from Sinai to the tent and sets the end of Exodus beside the creation'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'but also a bookend with the prologue to the Torah, the creation account of Genesis 1-2.3, where upon completing the cosmic temple, God enters his dwelling place in the enthronement of the Sabbath.'
