chapter: 38
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'The tabernacle was set up on the first day of the first month of the second year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'And it came to pass in the first month in the second year, on the first day of the month, that the tabernacle was reared up.'
  - where: 'setting'
    claim: 'The people brought more than the work needed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/36?lang=eng'
    quote: 'The people bring much more than enough for the service of the work, which the LORD commanded to make.'
  - where: 'setting'
    claim: 'Chapter 36 tells of the making of the curtains, the boards and the veil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/36?lang=eng'
    quote: 'And he made boards for the tabernacle of shittim wood, standing up.'
  - where: 'setting'
    claim: 'Chapter 37 tells of the making of the ark, the table, the candlestick and the incense altar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/37?lang=eng'
    quote: 'And Bezaleel made the ark of shittim wood … And he made the table of shittim wood … And he made the candlestick of pure gold … And he made the incense altar of shittim wood'
  - where: 'setting'
    claim: 'The altar and the court are commanded in chapter 27'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/27?lang=eng'
    quote: 'And thou shalt make an altar of shittim wood, five cubits long, and five cubits broad; the altar shall be foursquare: and the height thereof shall be three cubits.'
  - where: 'setting'
    claim: 'The laver is commanded in chapter 30'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/30?lang=eng'
    quote: 'Thou shalt also make a laver of brass, and his foot also of brass, to wash withal'
  - where: 'setting'
    claim: 'The priests’ garments are made in chapter 39'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/39?lang=eng'
    quote: 'And of the blue, and purple, and scarlet, they made cloths of service, to do service in the holy place, and made the holy garments for Aaron; as the LORD commanded Moses.'
  - where: 'thread'
    claim: 'The command for the laver named its metal and its place, not where the metal came from'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/30?lang=eng'
    quote: 'Thou shalt also make a laver of brass, and his foot also of brass, to wash withal: and thou shalt put it between the tabernacle of the congregation and the altar, and thou shalt put water therein.'
  - where: 'thread'
    claim: 'The gold was brought by the willing hearted; silver and brass were offered too'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/35?lang=eng'
    quote: 'And they came, both men and women, as many as were willing hearted, and brought bracelets, and earrings, and rings, and tablets, all jewels of gold'
  - where: 'thread'
    claim: 'The silver bases stood under the boards and under the pillars of the veil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/26?lang=eng'
    quote: 'And thou shalt make forty sockets of silver under the twenty boards'

  # ---------- sections ----------
  - where: 'section 1 plain'
    claim: 'Shittim is acacia; “of the same” is of one piece; brass is bronze; “the compass” is the rim (Church footnotes 1c, 2a, 2b, 4a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/38?lang=eng'
    quote: 'HEB acacia (also v. 6). … OR one piece with it. … OR bronze (also vv. 3, 5–6). … OR its rim or border.'
  - where: 'section 2 plain'
    claim: 'Looking glasses are mirrors (Church footnote 8a); the women served at the entrance to the tent of meeting'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2038%3A8%2C21&version=NRSVUE'
    quote: 'He made the basin of bronze with its stand of bronze, from the mirrors of the women who served at the entrance to the tent of meeting.'
  - where: 'section 3 plain'
    claim: 'Sockets are bases; chapiters are capitals; the hanging is a screen; “answerable” is corresponding (Church footnotes 10b, 17a, 18a, 18b)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/38?lang=eng'
    quote: 'OR bases (also vv. 11–12, 14–15, etc.). … OR capitals or headwork. … OR screen or curtain. … OR corresponding.'
  - where: 'section 4 plain'
    claim: 'Verse 21 rendered as records drawn up at Moses’s command, the work of the Levites under Ithamar’s direction'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2038%3A8%2C21&version=NRSVUE'
    quote: 'These are the records of the tabernacle, the tabernacle of the covenant, which were drawn up at the commandment of Moses, the work of the Levites being under the direction of Ithamar son of the priest Aaron.'
  - where: 'section 5 plain'
    claim: '“Occupied” is used; “that went to be numbered” is who was numbered in the census (Church footnotes 24a, 26b)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/38?lang=eng'
    quote: 'HEB used. … OR who was numbered in the census.'

  # ---------- note 38:8 ----------
  - where: 'note 38:8 “Mirrors given by the women who served at the door”'
    claim: 'The mirrors were polished bronze'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'These mirrors would not be like today’s mirrors, but instead, they were a poured slab of bronze that was then polished to provide a small amount of reflection.'
  - where: 'note 38:8 “Mirrors given by the women who served at the door”'
    claim: 'The mirrors were melted or hammered into the laver'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'These mirrors either were melted down or possibly hammered into shape to create the laver.'
  - where: 'note 38:8 “Mirrors given by the women who served at the door”'
    claim: 'The commentary reads the gift as devotion'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'The faithful women who donated their bronze showed their great devotion to the Lord by offering a valuable possession so that the laver could be constructed.'
  - where: 'note 38:8 “Mirrors given by the women who served at the door”'
    claim: 'The verb means wage war and, second, serve at the sacred tent; of Levites, and of women in Exodus 38:8 and 1 Samuel 2:22'
    key: bdb
    url: 'https://biblehub.com/hebrew/6633.htm'
    quote: '2 serve at sacred tent, Levites, with accusative צָבָא Numbers 4:23; Numbers 8:24 (P); women Exodus 38:8 (twice in verse) (P) 1 Samuel 2:22.'
  - where: 'note 38:8 “Mirrors given by the women who served at the door”'
    claim: 'The lexicon renders the phrase “the mirrors of the serving-women”'
    key: bdb
    url: 'https://biblehub.com/hebrew/4759.htm'
    quote: 'plural construct מַרְאֹת הַצֹּבְאֹת Exodus 38:8 (P) the mirrors of the serving-women (see Di).'
  - where: 'note 38:8 “Mirrors given by the women who served at the door”'
    claim: 'A modern translation reads “the women who served at the entrance to the tent of meeting”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2038%3A8%2C21&version=NRSVUE'
    quote: 'He made the basin of bronze with its stand of bronze, from the mirrors of the women who served at the entrance to the tent of meeting.'
  - where: 'note 38:8 “Mirrors given by the women who served at the door”'
    claim: '1 Samuel 2:22 has the same King James phrase'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/2?lang=eng'
    quote: 'the women that assembled at the door of the tabernacle of the congregation.'

  # ---------- note 38:21 ----------
  - where: 'note 38:21 “An account of the metals, kept by the Levites under Ithamar”'
    claim: 'A modern translation of verse 21, with the Levites doing the work under Ithamar'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2038%3A8%2C21&version=NRSVUE'
    quote: 'These are the records of the tabernacle, the tabernacle of the covenant, which were drawn up at the commandment of Moses, the work of the Levites being under the direction of Ithamar son of the priest Aaron.'
  - where: 'note 38:21 “An account of the metals, kept by the Levites under Ithamar”'
    claim: 'Ithamar was Aaron’s youngest son'
    key: bd-ithamar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ithamar?lang=eng'
    quote: 'Youngest son of Aaron.'
  - where: 'note 38:21 “An account of the metals, kept by the Levites under Ithamar”'
    claim: 'Ithamar is named with his brothers when the priests are called'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/28?lang=eng'
    quote: 'even Aaron, Nadab and Abihu, Eleazar and Ithamar, Aaron’s sons.'
  - where: 'note 38:21 “An account of the metals, kept by the Levites under Ithamar”'
    claim: 'The service of the sons of Gershon was under Ithamar’s hand'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/4?lang=eng'
    quote: 'This is the service of the families of the sons of Gershon in the tabernacle of the congregation: and their charge shall be under the hand of Ithamar the son of Aaron the priest.'
  - where: 'note 38:21 “An account of the metals, kept by the Levites under Ithamar”'
    claim: 'The service of the sons of Merari was under Ithamar’s hand'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/4?lang=eng'
    quote: 'This is the service of the families of the sons of Merari, according to all their service, in the tabernacle of the congregation, under the hand of Ithamar the son of Aaron the priest.'
  - where: 'note 38:21 “An account of the metals, kept by the Levites under Ithamar”'
    claim: 'The testimony is the tables, put into the ark'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/25?lang=eng'
    quote: 'And thou shalt put into the ark the testimony which I shall give thee.'
  - where: 'note 38:21 “An account of the metals, kept by the Levites under Ithamar”'
    claim: 'The tables are called tables of testimony'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/31?lang=eng'
    quote: 'two tables of testimony, tables of stone, written with the finger of God.'
  - where: 'note 38:21 “An account of the metals, kept by the Levites under Ithamar”'
    claim: 'The Levites are appointed over the tabernacle of testimony'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/1?lang=eng'
    quote: 'But thou shalt appoint the Levites over the tabernacle of testimony, and over all the vessels thereof, and over all things that belong to it'

  # ---------- note 38:24 ----------
  - where: 'note 38:24 “How much metal the account records”'
    claim: 'A talent was 3,000 shekels, by these verses; its weight'
    key: bd-weights-and-measures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/weights-and-measures?lang=eng'
    quote: 'Talent. (Hebrew kikkar); equivalent to 3,000 shekels (see Ex. 38:25, 26); about 75.6 pounds, or 34.272 kilograms.'
  - where: 'note 38:24 “How much metal the account records”'
    claim: 'The totals in pounds and tons are computed from the dictionary’s talent: 29.243 talents of gold, 100.592 of silver, 70.8 of bronze, at 75.6 pounds (34.272 kg) each'
    key: bd-weights-and-measures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/weights-and-measures?lang=eng'
    quote: 'about 75.6 pounds, or 34.272 kilograms.'
  - where: 'note 38:24 “How much metal the account records”'
    claim: 'Biblical weights varied and are hard to fix'
    key: bd-weights-and-measures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/weights-and-measures?lang=eng'
    quote: 'varied from time to time, which makes it difficult to arrive at a correct understanding of these things today.'
  - where: 'note 38:24 “How much metal the account records”'
    claim: 'The early shekel’s weight is uncertain'
    key: bd-weights-and-measures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/weights-and-measures?lang=eng'
    quote: 'Shekel. It is uncertain what its exact weight was in early times; from the 2nd century B.C. onward it was 218 grains (15.126 grams).'
  - where: 'note 38:24 “How much metal the account records”'
    claim: 'A shekel was at first a weight, not a coin'
    key: bd-weights-and-measures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/weights-and-measures?lang=eng'
    quote: 'Originally a shekel was a term for a certain weight; later it became a term for the value of a piece of money.'
  - where: 'note 38:24 “How much metal the account records”'
    claim: 'The chapter’s own figures: the silver, the count, and a talent to a socket'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/38?lang=eng'
    quote: 'an hundred sockets of the hundred talents, a talent for a socket.'

  # ---------- note 38:26 ----------
  - where: 'note 38:26 “The count behind the silver”'
    claim: 'The half shekel was commanded as the offering of every man numbered'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/30?lang=eng'
    quote: 'This they shall give, every one that passeth among them that are numbered, half a shekel after the shekel of the sanctuary'
  - where: 'note 38:26 “The count behind the silver”'
    claim: 'The census of Numbers 1 gives the same total'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/1?lang=eng'
    quote: 'Even all they that were numbered were six hundred thousand and three thousand and five hundred and fifty.'
  - where: 'note 38:26 “The count behind the silver”'
    claim: 'The census is dated the first day of the second month of the second year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/1?lang=eng'
    quote: 'on the first day of the second month, in the second year after they were come out of the land of Egypt'
  - where: 'note 38:26 “The count behind the silver”'
    claim: 'One older reading: the difficulty and a “simple assumption” that reconciles it'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/30.htm'
    quote: 'This apparent discrepancy may be reconciled by the simple assumption, that immediately after the command of God had been issued respecting the building of the tabernacle … the numbering of the males was commenced and the atonement-money collected'
  - where: 'note 38:26 “The count behind the silver”'
    claim: 'The same reading: the nation was later enrolled on the basis of the provisional numbering'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/30.htm'
    quote: 'the whole nation was enrolled according to its tribes, fathers'' houses, and families, on the basis of this provisional numbering, and thus the census was completed.'
  - where: 'note 38:26 “The count behind the silver”'
    claim: 'The same reading: why the two totals agree'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/30.htm'
    quote: 'For this reason the census gave exactly the same number of males as the numbering (cf. Exodus 38:26 and Numbers 1:46), although the one had been carried out nine months before the other.'

  # ---------- christ / explore ----------
  - where: 'christ'
    claim: 'The Church teaches that the sacrifices at the altar were symbolic of Christ’s atoning sacrifice'
    key: scripture-helps-ex-35
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/16-exodus-35-40-leviticus-1-4-16-19?lang=eng'
    quote: 'The altar in the outer courtyard was used for animal sacrifices. … Animal sacrifices were symbolic of the atoning sacrifice of Jesus Christ.'
  - where: 'christ'
    claim: 'The atonement money was to make an atonement for their souls'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/30?lang=eng'
    quote: 'that it may be a memorial unto the children of Israel before the LORD, to make an atonement for your souls.'
  - where: 'christ'
    claim: 'The New Testament uses the word “ransom” of Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/20?lang=eng'
    quote: 'Even as the Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many.'
  - where: 'explore'
    claim: 'The laver is set in its place and used when the tabernacle is set up'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'And he set the laver between the tent of the congregation and the altar, and put water there, to wash withal.'
  - where: 'explore'
    claim: 'The Levites keep the charge of the tabernacle of testimony'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/1?lang=eng'
    quote: 'and the Levites shall keep the charge of the tabernacle of testimony.'
