  - where: 'note 28:38 “How holy things could carry iniquity”'
    claim: 'The footnote on verse 43 gives “do not incur guilt”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/28?lang=eng'
    quote: 'OR do not incur guilt.'
  - where: 'note 28:38 “How holy things could carry iniquity”'
    claim: 'One older reading: to bear iniquity is to take it away by taking it on oneself'
