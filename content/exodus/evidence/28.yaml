  # ---------- note 28:39 ----------
  - where: 'note 28:39 “What every priest wore: coat, girdle, cap and breeches”'
    claim: 'The four basic garments of a priest'
    key: scripture-helps-ex-35
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/16-exodus-35-40-leviticus-1-4-16-19?lang=eng'
    quote: 'Israelite priests wore four basic garments: linen breeches (undergarments), a girdle, a mitre, and a coat.'
  - where: 'note 28:39 “What every priest wore: coat, girdle, cap and breeches”'
    claim: 'The coat reached to the knees or below and was white, a color of purity'
    key: scripture-helps-ex-35
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/16-exodus-35-40-leviticus-1-4-16-19?lang=eng'
    quote: 'A coat was a garment of fine linen that extended to or below the knees. The Hebrew word translated as “fine linen” indicates that the coat was white, a color associated with purity in the scriptures.'
  - where: 'note 28:39 “What every priest wore: coat, girdle, cap and breeches”'
    claim: 'The girdle was a sash'
    key: scripture-helps-ex-35
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/16-exodus-35-40-leviticus-1-4-16-19?lang=eng'
    quote: 'A girdle was an embroidered sash wrapped around the waist.'
  - where: 'note 28:39 “What every priest wore: coat, girdle, cap and breeches”'
    claim: 'The coat was the first thing put on after the washing; the verse may be rendered as weaving a shirt-like undergarment'
    key: clothed-holy-garments
    url: 'https://rsc.byu.edu/ascending-mountain-lord/clothed-holy-garments-apparel-temple-officiants-ancient-israel'
    quote: 'The first item that was placed upon the high priest, immediately after washing (see Leviticus 8:6–7), was the linen coat. … The Hebrew of this verse may also be rendered: “And thou shalt weave a shirt-like undergarment of fine white cloth.”'
  - where: 'note 28:39 “What every priest wore: coat, girdle, cap and breeches”'
    claim: 'The mitre is a turban and the bonnets are hats or headdresses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/28?lang=eng'
    quote: 'HEB hats, or headdresses.'
  - where: 'note 28:39 “What every priest wore: coat, girdle, cap and breeches”'
    claim: 'On the Day of Atonement the high priest wore the linen garments'
    key: clothed-holy-garments
    url: 'https://rsc.byu.edu/ascending-mountain-lord/clothed-holy-garments-apparel-temple-officiants-ancient-israel'
    quote: 'Thus on Yom Kippur (the Day of Atonement) the priest wore the linen coat, which (in the minds of many Christians) indicated that he was officiating as a type of Christ (see Leviticus 16).'
  - where: 'note 28:39 “What every priest wore: coat, girdle, cap and breeches”'
    claim: 'Leviticus 16:4 lists the linen garments for that day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/16?lang=eng'
    quote: 'He shall put on the holy linen coat, and he shall have the linen breeches upon his flesh, and shall be girded with a linen girdle, and with the linen mitre shall he be attired: these are holy garments'
  - where: 'note 28:39 “What every priest wore: coat, girdle, cap and breeches”'
    claim: 'The law of the altar forbids steps for the sake of nakedness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/20?lang=eng'
    quote: 'Neither shalt thou go up by steps unto mine altar, that thy nakedness be not discovered thereon.'

