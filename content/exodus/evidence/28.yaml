chapter: 28
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'Moses was on the mount forty days and forty nights'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/24?lang=eng'
    quote: 'And Moses went into the midst of the cloud, and gat him up into the mount: and Moses was in the mount forty days and forty nights.'
  - where: 'setting'
    claim: 'The last chapter closed with the oil for the lamp'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/27?lang=eng'
    quote: 'And thou shalt command the children of Israel, that they bring thee pure oil olive beaten for the light, to cause the lamp to burn always.'
  - where: 'setting'
    claim: 'Aaron was Moses’s elder brother, of the tribe of Levi, and his spokesman'
    key: bd-aaron
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/aaron?lang=eng'
    quote: 'Son of Amram and Jochebed, of the tribe of Levi (Ex. 6:16–20); elder brother of Moses (Ex. 7:7). He was appointed by the Lord to assist Moses in bringing the children of Israel out of Egypt and to be his spokesman'
  - where: 'setting'
    claim: 'Aaron was the first high priest of the Aaronic order'
    key: bd-high-priest
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/high-priest?lang=eng'
    quote: 'The office was hereditary and came through the firstborn among the family of Aaron, Aaron himself being the first high priest of the Aaronic order.'
  - where: 'setting'
    claim: 'The garments are made in Exodus 39 as the LORD commanded Moses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/39?lang=eng'
    quote: 'And of the blue, and purple, and scarlet, they made cloths of service, to do service in the holy place, and made the holy garments for Aaron; as the Lord commanded Moses.'
  - where: 'setting'
    claim: 'Moses clothes Aaron in the garments in Leviticus 8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/8?lang=eng'
    quote: 'And he put upon him the coat, and girded him with the girdle, and clothed him with the robe, and put the ephod upon him, and he girded him with the curious girdle of the ephod, and bound it unto him therewith.'
  - where: 'thread'
    claim: 'Ordinary priests wore four garments and the high priest four more'
    key: scripture-helps-ex-35
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/16-exodus-35-40-leviticus-1-4-16-19?lang=eng'
    quote: 'Israelite priests wore four basic garments: linen breeches (undergarments), a girdle, a mitre, and a coat. Aaron and subsequent high priests wore four additional items: a robe, a breastplate, an ephod, and a gold-plated holy crown on the cap.'
  - where: 'thread'
    claim: 'The officiant represented all Israel when he ministered'
    key: clothed-holy-garments
    url: 'https://rsc.byu.edu/ascending-mountain-lord/clothed-holy-garments-apparel-temple-officiants-ancient-israel'
    quote: 'Elsewhere we read that the officiant “represented all Israel when he ministered in the tabernacle.”'
  - where: 'thread'
    claim: 'The tabernacle’s entrances were marked by blue, scarlet and purple, and the text gives no meaning for the colors'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'the gate, the entrance into the tabernacle proper, and the veil … were distinguished from the surrounding cloth by their coloration, having been dyed in blue, scarlet, and purple. Any explicit meaning behind this selection of colors is unknown'
  - where: 'thread'
    claim: 'The priest wore the same colors, which suggests he was a figure who moved between states and helped others do so'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'Blue, scarlet, and purple were also dominant in the clothing worn by the priest. The association of the priest with these colors suggests that the priest was a liminal figure, or one who moved between the different states and whose purpose was to facilitate such movement'

  # ---------- plain ----------
  - where: 'section 2 plain'
    claim: 'The “curious girdle” is a skillfully woven one; “ouches” are settings; “wreathen” is braided'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/28?lang=eng'
    quote: 'OR skillfully woven.'
  - where: 'section 6 plain'
    claim: 'The mitre is a turban, the bonnets headdresses, the tabernacle of the congregation the tent of meeting, and “bear not iniquity” is “do not incur guilt”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/28?lang=eng'
    quote: 'OR do not incur guilt.'

  # ---------- note 28:1 ----------
  - where: 'note 28:1 “Aaron, his sons, and the priesthood they held”'
    claim: 'The Lord confirmed a priesthood on Aaron and his seed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'And the Lord confirmed a priesthood also upon Aaron and his seed, throughout all their generations, which priesthood also continueth and abideth forever with the priesthood which is after the holiest order of God.'
  - where: 'note 28:1 “Aaron, his sons, and the priesthood they held”'
    claim: 'The Aaronic Priesthood was of lesser power than the Melchizedek and administered the outward ordinances'
    key: bd-aaronic-priesthood
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/aaronic-priesthood?lang=eng'
    quote: 'This priesthood was of lesser power and authority than the priesthood of Melchizedek and was used to administer the outward ordinances, particularly as characterized by the ceremonies of the law of Moses.'
  - where: 'note 28:1 “Aaron, his sons, and the priesthood they held”'
    claim: 'Only Levites received the lesser priesthood; only Aaron and his sons could be priests; the high priest came from Aaron’s firstborn line'
    key: bd-aaronic-priesthood
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/aaronic-priesthood?lang=eng'
    quote: 'the lesser priesthood was conferred only upon men of the tribe of Levi. However, within the tribe, only Aaron and his sons could hold the office of priest. And, still further, from the firstborn of Aaron’s sons (after Aaron) was selected the high priest'
  - where: 'note 28:1 “Aaron, his sons, and the priesthood they held”'
    claim: 'Priests offered sacrifice, burned incense and taught the law; other Levites assisted'
    key: bd-aaronic-priesthood
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/aaronic-priesthood?lang=eng'
    quote: 'The priests could offer sacrifices for the people, burn incense on the altar, and teach the law, whereas the other Levites were employed in more menial tasks'
  - where: 'note 28:1 “Aaron, his sons, and the priesthood they held”'
    claim: 'Nadab and Abihu went up the mount with the elders'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/24?lang=eng'
    quote: 'Then went up Moses, and Aaron, Nadab, and Abihu, and seventy of the elders of Israel:'
  - where: 'note 28:1 “Aaron, his sons, and the priesthood they held”'
    claim: 'Nadab and Abihu offered strange fire and died'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/10?lang=eng'
    quote: 'And there went out fire from the Lord, and devoured them, and they died before the Lord.'
  - where: 'note 28:1 “Aaron, his sons, and the priesthood they held”'
    claim: 'Eleazar received Aaron’s garments at his death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/20?lang=eng'
    quote: 'And Moses stripped Aaron of his garments, and put them upon Eleazar his son; and Aaron died there in the top of the mount'
  - where: 'note 28:1 “Aaron, his sons, and the priesthood they held”'
    claim: 'The high priesthood was in Eleazar’s family until Eli, of Ithamar’s line'
    key: bd-high-priest
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/high-priest?lang=eng'
    quote: 'It was in the family of Eleazar, Aaron’s third son, until the time of Eli, a descendant of Ithamar, Aaron’s youngest son'
  - where: 'note 28:1 “Aaron, his sons, and the priesthood they held”'
    claim: 'The Aaronic Priesthood continued with the house of Aaron until John the Baptist'
    key: bd-aaronic-priesthood
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/aaronic-priesthood?lang=eng'
    quote: 'The Aaronic Priesthood continued “with the house of Aaron among the children of Israel” from Aaron until John the Baptist, who was a priest in the Aaronic order (D&C 84:26–27)'

  # ---------- note 28:2 ----------
  - where: 'note 28:2 “Why the priests wore holy garments”'
    claim: 'The priests’ clothing was sacred and symbolic, like clothing associated with temple ordinances today'
    key: scripture-helps-ex-35
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/16-exodus-35-40-leviticus-1-4-16-19?lang=eng'
    quote: 'Like clothing associated with temple ordinances in our day, the clothing worn by Israelite priests was sacred and deeply symbolic.'
  - where: 'note 28:2 “Why the priests wore holy garments”'
    claim: 'Washing, anointing and clothing prepared Aaron and his sons to officiate'
    key: scripture-helps-ex-35
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/16-exodus-35-40-leviticus-1-4-16-19?lang=eng'
    quote: 'The ceremonies of washing, anointing, and clothing in holy garments helped prepare Aaron and his sons to officiate in the sacred ordinances of the tabernacle.'
  - where: 'note 28:2 “Why the priests wore holy garments”'
    claim: 'One commentator the study quotes: the garments reminded Israel that a holy God was present with them'
    key: clothed-holy-garments
    url: 'https://rsc.byu.edu/ascending-mountain-lord/clothed-holy-garments-apparel-temple-officiants-ancient-israel'
    quote: 'One commentator suggested that the function of the priestly garments “was to remind the Israelites that a powerful, holy and just God was indeed present with them in so far as the wearer of the garments was held to be linked to Him.”'
  - where: 'note 28:2 “Why the priests wore holy garments”'
    claim: 'The garments passed from Aaron to his sons'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/29?lang=eng'
    quote: 'And the holy garments of Aaron shall be his sons’ after him, to be anointed therein, and to be consecrated in them.'
  - where: 'note 28:2 “Why the priests wore holy garments”'
    claim: 'Moses put Aaron’s garments on Eleazar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/20?lang=eng'
    quote: 'And Moses stripped Aaron of his garments, and put them upon Eleazar his son'

  # ---------- note 28:6 ----------
  - where: 'note 28:6 “What an ephod was”'
    claim: 'What the ephod was is debated, so the King James Version leaves the word untranslated; most scholars think of an apron'
    key: clothed-holy-garments
    url: 'https://rsc.byu.edu/ascending-mountain-lord/clothed-holy-garments-apparel-temple-officiants-ancient-israel'
    quote: 'there continues to be some debate within the scholarly community as to what exactly the ephod was. Thus the term remains untranslated in the King James Version. Most scholars maintain that it was an apron of unsurpassable beauty, having gold woven into it'
  - where: 'note 28:6 “What an ephod was”'
    claim: 'It was the outermost garment, on which the shoulder stones and the breastplate were fastened'
    key: clothed-holy-garments
    url: 'https://rsc.byu.edu/ascending-mountain-lord/clothed-holy-garments-apparel-temple-officiants-ancient-israel'
    quote: 'we know that it was the outermost garment upon which the onyx shoulder stones and the breast piece of judgment were fastened.'
  - where: 'note 28:6 “What an ephod was”'
    claim: 'The Bible Dictionary describes it as shaped like a waistcoat; a linen ephod was worn by priests, Samuel and David'
    key: bd-ephod
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ephod?lang=eng'
    quote: 'shaped like a waistcoat with two shoulder pieces and a girdle. … An ephod of linen seems to have become the dress of all priests (1 Sam. 22:18). It was also worn by Samuel (1 Sam. 2:18) and by David when he brought up the Ark (2 Sam. 6:14).'
  - where: 'note 28:6 “What an ephod was”'
    claim: 'BDB defines the word as a priestly garment, shoulder-cape or mantle'
    key: bdb
    url: 'https://biblehub.com/hebrew/646.htm'
    quote: '1 ephod, priestly garment, shoulder-cape or mantle'
  - where: 'note 28:6 “What an ephod was”'
    claim: 'BDB lists a use of the ephod in consulting the LORD (1 Sam. 23:6, 9), on one view by the Urim and Thummim in the breastpiece attached to it'
    key: bdb
    url: 'https://biblehub.com/hebrew/646.htm'
    quote: 'by Urim & Thummim in the breast-piece attached to the ephod (compare Exodus 28:28-30'
  - where: 'note 28:6 “What an ephod was”'
    claim: 'The “curious girdle” is a skillfully woven one'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/28?lang=eng'
    quote: 'OR skillfully woven.'
  - where: 'note 28:6 “What an ephod was”'
    claim: 'David asks Abiathar for the ephod'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/23?lang=eng'
    quote: 'And David knew that Saul secretly practised mischief against him; and he said to Abiathar the priest, Bring hither the ephod.'

  # ---------- note 28:12 ----------
  - where: 'note 28:12 “Israel’s names on the shoulders and over the heart”'
    claim: 'One older reading: the memorial is that Jehovah might remember the sons of Israel'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/28.htm'
    quote: 'Aaron was to bear their names before Jehovah upon his two shoulders for a memorial, i.e., that Jehovah might remember the sons of Israel when Aaron appeared before Him clothed with the ephod'
  - where: 'note 28:12 “Israel’s names on the shoulders and over the heart”'
    claim: 'The names showed that as mediator the high priest brought the nation to God'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/28.htm'
    quote: 'To show that as mediator he brought the nation to God, the names of the twelve tribes were engraved upon precious stones on the shoulders of the ephod.'

  # ---------- note 28:15 ----------
  - where: 'note 28:15 “A pouch of cloth set with twelve stones”'
    claim: 'Aaron’s breastplate was fabric, not metal, and folded into a pocket for the Urim and Thummim; it is not the one Joseph Smith used'
    key: ot-manual-ex-25-30
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-25-30-35-40-the-house-of-the-lord-in-the-wilderness?lang=eng'
    quote: 'The breastplate worn by Aaron and subsequent high priests should not be confused with the one used by the Prophet Joseph Smith in translating the Book of Mormon. Aaron’s breastplate was made of fabric rather than of metal'
  - where: 'note 28:15 “A pouch of cloth set with twelve stones”'
    claim: 'Folded, it became a square pocket'
    key: ot-manual-ex-25-30
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-25-30-35-40-the-house-of-the-lord-in-the-wilderness?lang=eng'
    quote: 'It was twice as long as it was wide and when folded became a square pocket into which the Urim and Thummim was placed.'
  - where: 'note 28:15 “A pouch of cloth set with twelve stones”'
    claim: 'BDB defines the word as breast-piece or sacred pouch, called “of judgment” for the decision given by the Urim and Thummim'
    key: bdb
    url: 'https://biblehub.com/hebrew/2833.htm'
    quote: 'the breast-piece or sacred pouch … pouch of judgment, because of the decision given by the'
  - where: 'note 28:15 “A pouch of cloth set with twelve stones”'
    claim: 'A span square is about nine inches each way'
    key: clothed-holy-garments
    url: 'https://rsc.byu.edu/ascending-mountain-lord/clothed-holy-garments-apparel-temple-officiants-ancient-israel'
    quote: 'It was a span in length and width (about 9x9 inches), thus forming a perfect square.'
  - where: 'note 28:15 “A pouch of cloth set with twelve stones”'
    claim: 'A breastplate was deposited with the Book of Mormon plates, with the stones fastened to it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-h/1?lang=eng'
    quote: 'Also, that there were two stones in silver bows—and these stones, fastened to a breastplate, constituted what is called the Urim and Thummim—deposited with the plates'
  - where: 'note 28:15 “A pouch of cloth set with twelve stones”'
    claim: 'Several of the stones’ names are Egyptian loanwords, and some stones are unidentified'
    key: sc-knowhy-848
    url: 'https://scripturecentral.org/knowhy/why-are-egyptian-loanwords-in-the-law-of-moses'
    quote: 'The precious stones used in the outfit of the high priest in Exodus 28:17-20 are often Egyptian loanwords. Words for red jasper, feldspar, turquoise, an unidentified gemstone thought by some to be peridot, and another completely unknown precious stone are all Egyptian loanwords.'

  # ---------- note 28:30 ----------
  - where: 'note 28:30 “The Urim and Thummim in Aaron’s breastplate”'
    claim: 'The name means Lights and Perfections; an instrument prepared of God for revelation and translating'
    key: bd-urim-and-thummim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/urim-and-thummim?lang=eng'
    quote: 'Hebrew term that means “Lights and Perfections.” An instrument prepared of God to assist man in obtaining revelation from the Lord and in translating languages.'
  - where: 'note 28:30 “The Urim and Thummim in Aaron’s breastplate”'
    claim: 'A seer’s prerogative; the brother of Jared, Abraham, Aaron and the Nephite prophets had one; there is more than one, and Joseph Smith had the brother of Jared’s'
    key: bd-urim-and-thummim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/urim-and-thummim?lang=eng'
    quote: 'Using a Urim and Thummim is the special prerogative of a seer … There is more than one Urim and Thummim, but we are informed that Joseph Smith had the one used by the brother of Jared'
  - where: 'note 28:30 “The Urim and Thummim in Aaron’s breastplate”'
    claim: 'Abraham and the Nephite prophets used a Urim and Thummim'
    key: bd-urim-and-thummim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/urim-and-thummim?lang=eng'
    quote: 'Abraham used a Urim and Thummim (Abr. 3:1–4), as did Aaron and the priests of Israel, and also the prophets among the Nephites (Omni 1:20–21; Mosiah 8:13–19; 21:26–28; 28:11–20; Ether 4:1–7).'
  - where: 'note 28:30 “The Urim and Thummim in Aaron’s breastplate”'
    claim: 'The Bible mentions it in Saul’s time and not afterward; its restoration was hoped for after the exile'
    key: bd-high-priest
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/high-priest?lang=eng'
    quote: 'The high priest was privileged to use the Urim and Thummim (Num. 27:21), and we read of it during Saul’s time but not afterward. It was apparently missing, but its restoration was hoped for during the time of the second temple (Ezra 2:63).'
  - where: 'note 28:30 “The Urim and Thummim in Aaron’s breastplate”'
    claim: 'Most scholars have thought it gave a yes or no answer; another study argues for prophetic inspiration'
    key: sc-knowhy-417
    url: 'https://scripturecentral.org/knowhy/were-joseph-smiths-translation-instruments-like-the-israelite-urim-and-thummim'
    quote: 'Most biblical scholars over the past few centuries have believed that the Urim and Thummim was “used merely to obtain a yes or no answer, similar to casting lots.” Yet Van Dam has argued that there “was something very lively and direct”'
  - where: 'note 28:30 “The Urim and Thummim in Aaron’s breastplate”'
    claim: 'The argument for prophetic inspiration'
    key: sc-knowhy-417
    url: 'https://scripturecentral.org/knowhy/were-joseph-smiths-translation-instruments-like-the-israelite-urim-and-thummim'
    quote: '“[p]rophetic inspiration is the only revelatory means that is known that can adequately account for the complexity and subtlety of some of the answers received.”'
  - where: 'note 28:30 “The Urim and Thummim in Aaron’s breastplate”'
    claim: 'Joseph Smith’s instruments and the biblical ones were alike in some respects and different in others'
    key: sc-knowhy-417
    url: 'https://scripturecentral.org/knowhy/were-joseph-smiths-translation-instruments-like-the-israelite-urim-and-thummim'
    quote: 'While Joseph’s instruments were different in some respects with what is known about the biblical Urim and Thummim, these sacred cousins are certainly similar enough to be called by the same name.'
  - where: 'note 28:30 “The Urim and Thummim in Aaron’s breastplate”'
    claim: 'Moroni described two stones in silver bows fastened to a breastplate'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-h/1?lang=eng'
    quote: 'Also, that there were two stones in silver bows—and these stones, fastened to a breastplate, constituted what is called the Urim and Thummim—deposited with the plates'
  - where: 'note 28:30 “The Urim and Thummim in Aaron’s breastplate”'
    claim: 'Joshua was to have counsel asked for him by the judgment of Urim'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/27?lang=eng'
    quote: 'And he shall stand before Eleazar the priest, who shall ask counsel for him after the judgment of Urim before the Lord'

  - where: 'note 28:30 “The Urim and Thummim in Aaron’s breastplate”'
    claim: 'After the exile a difficult question was reserved until a priest with Urim and Thummim should stand up'
    key: bdb
    url: 'https://biblehub.com/hebrew/224.htm'
    quote: 'post-exilic Jews reserved difficult questions until there stood up a priest'

  # ---------- note 28:35 ----------
  - where: 'note 28:35 “The blue robe, its bells and its pomegranates”'
    claim: 'The robe reached past the ephod to the knee; the bells were gold and the pomegranates cloth'
    key: clothed-holy-garments
    url: 'https://rsc.byu.edu/ascending-mountain-lord/clothed-holy-garments-apparel-temple-officiants-ancient-israel'
    quote: 'it would reach past the ephod to the knee. … At the bottom of the robe, stitched onto the fringe of it, were a series of alternating gold bells and cloth pomegranates.'
  - where: 'note 28:35 “The blue robe, its bells and its pomegranates”'
    claim: 'The “hole of an habergeon” is the opening in a coat of mail'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/28?lang=eng'
    quote: 'OR opening in a coat of mail.'
  - where: 'note 28:35 “The blue robe, its bells and its pomegranates”'
    claim: 'One older reading: pomegranates as the word of God as food, bells as its sounding'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/28.htm'
    quote: 'were symbols of the word and testimony of God as a sweet and pleasant spiritual food, that enlivens the soul and refreshes the heart … and that the bells were symbols of the sounding of this word, or the revelation and proclamation of the word.'
  - where: 'note 28:35 “The blue robe, its bells and its pomegranates”'
    claim: 'On that reading Aaron was the medium of the word, which is why he could not appear without the sound'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/28.htm'
    quote: 'Aaron was represented as the recipient and medium of the word and testimony which came down from heaven; and this was the reason why he was not to appear before the Lord without that sound, lest he should forfeit his life.'
  - where: 'note 28:35 “The blue robe, its bells and its pomegranates”'
    claim: 'The study takes the bells as the sounding forth of God’s word'
    key: clothed-holy-garments
    url: 'https://rsc.byu.edu/ascending-mountain-lord/clothed-holy-garments-apparel-temple-officiants-ancient-israel'
    quote: 'Owing to the fact that the sounding of these bells likely represented the “sounding forth” of the word of God, it is no wonder that they symbolize divine protection.'
  - where: 'note 28:35 “The blue robe, its bells and its pomegranates”'
    claim: 'The pomegranates were probably chosen for their association with the promised land'
    key: clothed-holy-garments
    url: 'https://rsc.byu.edu/ascending-mountain-lord/clothed-holy-garments-apparel-temple-officiants-ancient-israel'
    quote: 'it is quite probable that their pattern was chosen due to their association with the promised land (see Deuteronomy 8:7–8; Numbers 13:23)'
  - where: 'note 28:35 “The blue robe, its bells and its pomegranates”'
    claim: 'Pomegranates are among the produce of the promised land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/8?lang=eng'
    quote: 'A land of wheat, and barley, and vines, and fig trees, and pomegranates; a land of oil olive, and honey;'

  # ---------- note 28:36 ----------
