  - where: 'note 28:36 “The gold plate on Aaron’s forehead”'
    claim: 'The study reads the call to the high priest to be holy as a call to all Israel'
    key: clothed-holy-garments
    url: 'https://rsc.byu.edu/ascending-mountain-lord/clothed-holy-garments-apparel-temple-officiants-ancient-israel'
