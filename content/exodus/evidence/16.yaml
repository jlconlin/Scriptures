chapter: 16
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'Israel had been about a month on the road when it reached the wilderness of Sin'
    key: ot-minute-ex-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-14-17'
    quote: 'After leaving Egypt, the Hebrews traveled for about one month before they arrived in this desert.'
  - where: 'setting'
    claim: 'At Elim Israel found wells and palm trees after the bitter water of Marah'
    key: ot-minute-ex-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-14-17'
    quote: 'After experiencing bitter water in Marah, the people of Israel found twelve wells of good water and plenty of palm trees.'
  - where: 'setting'
    claim: 'Where the wilderness of Sin lay'
    key: bd-sin-wilderness-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sin-wilderness-of?lang=eng'
    quote: 'Where the Israelites encamped, lying between Horeb and the Gulf of Suez (Ex. 16:1; 17:1; Num. 33:11–12).'
  - where: 'setting'
    claim: 'The place name Sin is unrelated to the word sin; the trouble there was hunger, after the trouble with water'
    key: ot-minute-ex-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-14-17'
    quote: 'arrived in the desert of Sin (the name has nothing to do with the moral concept of sin), one of six desert areas that the Hebrews traveled through on their way to Canaan.'
  - where: 'setting'
    claim: 'Scripture has no record of Sabbath observance before this narrative, which the Bible Dictionary lists as evidence that the day was holy before the law'
    key: bd-sabbath
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sabbath?lang=eng'
    quote: 'the narrative of the manna—Ex. 16:23–30; and the narrative of the man gathering sticks—Num. 15:32–36); but we have no evidence of its observance in patriarchal times.'
  - where: 'setting'
    claim: 'Deuteronomy 8 is Moses’s explanation of the manna'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/8?lang=eng'
    quote: 'And he humbled thee, and suffered thee to hunger, and fed thee with manna, which thou knewest not, neither did thy fathers know'
  - where: 'setting'
    claim: 'Paul’s “spiritual meat” is the manna'
    key: thomas-provocation
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/provocation-wilderness-rejection-grace'
    quote: 'And did all eat the same spiritual meat [manna]; And did all drink the same spiritual drink [water at Meribah]'
  - where: 'setting'
    claim: 'Limhi names the manna when he rallies his people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/7?lang=eng'
    quote: 'and fed them with manna that they might not perish in the wilderness'
  - where: 'setting'
    claim: 'The Church’s footnotes send the reader from the quails and the manna to Psalms 78 and 105, 1 Corinthians 10, 1 Nephi 17 and Mosiah 7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/16?lang=eng'
    quote: '“manna”: 1 Cor. 10:3 (1–6); 1 Ne. 17:28; Mosiah 7:19.'
  - where: 'thread'
    claim: 'The bread was given to comfort and to test'
    key: ot-minute-ex-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-14-17'
    quote: 'He said He would “rain bread from heaven,” not only to comfort them but also to test them, to see if they would “walk in [His] law.”'
  - where: 'thread'
    claim: 'The LORD answered the murmuring with mercy and food; the murmuring was against Him more than against Moses and Aaron'
    key: ot-minute-ex-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-14-17'
    quote: 'Their murmurings were not so much against Moses and Aaron as against the Lord. The Lord was merciful and provided for them in their hunger.'
  - where: 'thread'
    claim: 'The manna kept for the Sabbath did not rot as on other days; none was to be found on the Sabbath'
    key: ot-minute-ex-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-14-17'
    quote: 'That portion did not rot overnight as it did on the other days of the week, showing once again that God was in control.'
  - where: 'thread'
    claim: 'The gift was meant to bring Israel to know the Lord'
    key: ot-minute-ex-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-14-17'
    quote: 'This blessing would help them come to know the Lord.'

  # ---------- plain ----------
  - where: 'section 2 plain'
    claim: '“A certain rate” is a portion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/16?lang=eng'
    quote: '“rate”: OR portion.'
  - where: 'section 3 plain'
    claim: 'The “small round thing” is fine and flake-like'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/16?lang=eng'
    quote: '“round”: HEB fine, flake-like.'
  - where: 'section 3 plain'
    claim: '“It is manna” may be read “What is it?”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/16?lang=eng'
    quote: '“It”: OR What is it? (HEB man-hu.)'
  - where: 'section 3 plain'
    claim: '“According to his eating” is what he could eat'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/16?lang=eng'
    quote: '“his eating”: OR what he could eat.'
  - where: 'section 4 plain'
    claim: '“Seethe” is to cook or boil'
    key: ot-minute-ex-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-14-17'
    quote: 'On the sixth day they were to bake or seethe (boil) what was needed for the day; the rest of the double batch could be laid up for the next day.'

  # ---------- note 16:4 bread from heaven ----------
  - where: 'note 16:4 “The bread from heaven and the bread of life”'
    claim: 'One reading, relayed by the KnoWhy from a scholar it quotes: the feeding of the five thousand looks back to the manna and the quails'
    key: sc-knowhy-664
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-use-passover-imagery-in-his-bread-of-life-sermon'
    quote: 'This famous miracle, notes Huntsman, not only “re-creates the table fellowship of the Passover meal” but also harks back “to Jehovah’s provision of manna and flesh to the Israelites in the wilderness.”'
  - where: 'note 16:4 “The bread from heaven and the bread of life”'
    claim: 'The other Gospels place the feeding in a desert place'
    key: sc-knowhy-664
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-use-passover-imagery-in-his-bread-of-life-sermon'
    quote: 'Other Gospel accounts place this mountain in a “desert place.”'
  - where: 'note 16:4 “The bread from heaven and the bread of life”'
    claim: 'The sermon was given the day after the feeding'
    key: sc-knowhy-664
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-use-passover-imagery-in-his-bread-of-life-sermon'
    quote: 'Finally, as Jesus delivered a sermon to the multitude in Capernaum the following day, He stated, “I am the bread of life'
  - where: 'note 16:4 “The bread from heaven and the bread of life”'
    claim: 'The crowd cites the manna and Jesus answers that the Father gives the true bread'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/6?lang=eng'
    quote: 'Our fathers did eat manna in the desert; as it is written, He gave them bread from heaven to eat.'
  - where: 'note 16:4 “The bread from heaven and the bread of life”'
    claim: 'Elder Christofferson calls manna a type and symbol of Christ'
    key: christofferson-daily-bread
    url: 'https://speeches.byu.edu/talks/d-todd-christofferson/give-us-this-day-our-daily-bread'
    quote: 'Above all, remember that we have Him of whom manna was a type and symbol, the very Bread of Life, the Redeemer.'
  - where: 'note 16:4 “The bread from heaven and the bread of life”'
    claim: 'Psalm 78 names the manna “the corn of heaven” and “angels’ food”'
    key: parry-manna
    url: 'https://scripturecentral.org/archive/books/book-chapter/manna-symbol-jesus-christ'
    quote: 'This bread was called “manna,” “the corn of heaven,” and “angels’ food” (Ps. 78:24–25).'

  # ---------- note 16:4 test ----------
  - where: 'note 16:4 “The bread is also a test”'
    claim: 'Moses says the wilderness years were to prove Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/8?lang=eng'
    quote: 'to humble thee, and to prove thee, to know what was in thine heart, whether thou wouldest keep his commandments, or no.'
  - where: 'note 16:4 “The bread is also a test”'
    claim: 'Moses spoke forty years on'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/8?lang=eng'
    quote: 'And thou shalt remember all the way which the Lord thy God led thee these forty years in the wilderness'
  - where: 'note 16:4 “The bread is also a test”'
    claim: 'The people had to gather daily and only a set amount'
    key: ot-minute-ex-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-14-17'
    quote: 'They had to go out daily to gather it but could gather only a certain amount each day.'
  - where: 'note 16:4 “The bread is also a test”'
    claim: 'Jesus quotes Deuteronomy 8:3 to the tempter'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/4?lang=eng'
    quote: 'But he answered and said, It is written, Man shall not live by bread alone, but by every word that proceedeth out of the mouth of God.'
  - where: 'note 16:4 “The bread is also a test”'
    claim: 'One study sets Israel’s forty years of manna beside Jesus’s forty days'
    key: parry-manna
    url: 'https://scripturecentral.org/archive/books/book-chapter/manna-symbol-jesus-christ'
    quote: 'The children of Israel ate manna for forty years (Ex. 16:35), a period of testing.'
  - where: 'note 16:4 “The bread is also a test”'
    claim: 'The same study’s other half of the comparison'
    key: parry-manna
    url: 'https://scripturecentral.org/archive/books/book-chapter/manna-symbol-jesus-christ'
    quote: 'Jesus was tempted of Satan after fasting forty days and forty nights (Matt. 4:1–2).'

  # ---------- note 16:15 ----------
  - where: 'note 16:15 “‘It is manna’ can be read ‘What is it?’”'
    claim: 'The Hebrew of the people’s words is man hu'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'מָ֣ן'
  - where: 'note 16:15 “‘It is manna’ can be read ‘What is it?’”'
    claim: 'The Church’s footnote gives “What is it?”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/16?lang=eng'
    quote: '“It”: OR What is it? (HEB man-hu.)'
  - where: 'note 16:15 “‘It is manna’ can be read ‘What is it?’”'
    claim: 'The Septuagint has “What is this?”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/exodus/16.htm'
    quote: 'And when the children of Israel saw it, they said one to another, What is this? for they knew not what it was'
  - where: 'note 16:15 “‘It is manna’ can be read ‘What is it?’”'
    claim: 'A modern translation has the question in the text'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2016%3A15%2C31%2C34&version=NRSVUE'
    quote: 'When the Israelites saw it, they said to one another, “What is it?” For they did not know what it was.'
  - where: 'note 16:15 “‘It is manna’ can be read ‘What is it?’”'
    claim: 'The same translation gives “It is manna” as the alternative in its footnote'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2016%3A15%2C31%2C34&version=NRSVUE'
    quote: 'Or “It is manna”'
  - where: 'note 16:15 “‘It is manna’ can be read ‘What is it?’”'
    claim: 'The lexicon: most probably “What is it?”, meant as a popular etymology of the name'
    key: bdb
    url: 'https://biblehub.com/hebrew/4478.htm'
    quote: 'most probably ''What is it?'' the question being intended as a popular etymology of'

  # ---------- note 16:18 ----------
  - where: 'note 16:18 “Enough for each, and what Paul made of it”'
    claim: 'An omer is about two quarts'
    key: scripture-helps-ex-14
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/14-exodus-14-18?lang=eng'
    quote: 'An omer is a unit of measurement that is equivalent to about two quarts, or half a gallon.'
  - where: 'note 16:18 “Enough for each, and what Paul made of it”'
    claim: 'One reading: each family found in its tent just what it needed'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/16.htm'
    quote: 'when they measured it in their tents, they had collected just as many omers as they needed for the number in their families'
  - where: 'note 16:18 “Enough for each, and what Paul made of it”'
    claim: 'The other reading: all was heaped together and measured out'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/16.htm'
    quote: 'all that was gathered was placed in a heap, and then measured out in the quantity that each required.'
  - where: 'note 16:18 “Enough for each, and what Paul made of it”'
    claim: 'The commentary prefers the first reading'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/16.htm'
    quote: 'but the words of the text decidedly favour the old Jewish view.'
  - where: 'note 16:18 “Enough for each, and what Paul made of it”'
    claim: 'Paul quotes the verse while urging the Saints to give to those in want'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/2-cor/8?lang=eng'
    quote: 'As it is written, He that had gathered much had nothing over; and he that had gathered little had no lack.'
  - where: 'note 16:18 “Enough for each, and what Paul made of it”'
    claim: 'The chapter heading of 2 Corinthians 8 on its subject'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/2-cor/8?lang=eng'
    quote: 'True Saints impart of their substance to the poor'

  # ---------- note 16:21 ----------
  - where: 'note 16:21 “Daily bread”'
    claim: 'Elder Christofferson calls the manna Israel’s daily bread from heaven'
    key: christofferson-daily-bread
    url: 'https://speeches.byu.edu/talks/d-todd-christofferson/give-us-this-day-our-daily-bread'
    quote: 'Jehovah solved the challenge by miraculously providing their daily bread from heaven—manna.'
  - where: 'note 16:21 “Daily bread”'
    claim: 'What the petition in the Lord’s Prayer teaches'
    key: christofferson-daily-bread
    url: 'https://speeches.byu.edu/talks/d-todd-christofferson/give-us-this-day-our-daily-bread'
    quote: 'Jesus is teaching us, His disciples, that we should look to God each day for the bread—the help and sustenance—we require in that particular day.'
  - where: 'note 16:21 “Daily bread”'
    claim: 'The petition as Matthew has it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/6?lang=eng'
    quote: 'Give us this day our daily bread.'

  # ---------- note 16:23 ----------
  - where: 'note 16:23 “The Sabbath before Sinai”'
    claim: 'The Sabbath was holy before the law; the manna narrative is among the evidence; no record of its observance by the patriarchs'
    key: bd-sabbath
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sabbath?lang=eng'
    quote: 'The Sabbath was a holy day before the giving of the law, even from the earliest times'
  - where: 'note 16:23 “The Sabbath before Sinai”'
    claim: 'No evidence of observance in patriarchal times'
    key: bd-sabbath
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sabbath?lang=eng'
    quote: 'but we have no evidence of its observance in patriarchal times.'
  - where: 'note 16:23 “The Sabbath before Sinai”'
    claim: 'The silence is put down to the scantiness of the record; the Sabbath is an eternal principle'
    key: bd-sabbath
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sabbath?lang=eng'
    quote: 'This is no doubt due to the scantiness of the record, for the Sabbath is an eternal principle and would have existed from the days of Adam, whenever the gospel was on the earth among men.'
  - where: 'note 16:23 “The Sabbath before Sinai”'
    claim: 'The manna lesson was a precursor to the fourth commandment'
    key: ot-minute-ex-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-14-17'
    quote: 'This particular teaching about when to work and when to rest was a precursor to the later revelation of the fourth commandment in Exodus, chapter 20.'
  - where: 'note 16:23 “The Sabbath before Sinai”'
    claim: 'Genesis tells of the seventh day sanctified'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/2?lang=eng'
    quote: 'And God blessed the seventh day, and sanctified it: because that in it he had rested from all his work which God created and made.'

  # ---------- note 16:31 ----------
  - where: 'note 16:31 “What manna was”'
    claim: 'No natural product answers to the account'
    key: bd-manna
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/manna?lang=eng'
    quote: 'It is impossible to find any natural product that will answer to the requirements of the scriptural narrative in regard to this heavensent food.'
  - where: 'note 16:31 “What manna was”'
    claim: 'The Church’s footnote at verse 14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/16?lang=eng'
    quote: '“round”: HEB fine, flake-like.'
  - where: 'note 16:31 “What manna was”'
    claim: 'Numbers on its color and on its falling with the dew at night'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/11?lang=eng'
    quote: 'And when the dew fell upon the camp in the night, the manna fell upon it.'
  - where: 'note 16:31 “What manna was”'
    claim: 'The Bedouin of Sinai know a tamarisk sap called by the same name'
    key: bdb
    url: 'https://biblehub.com/hebrew/4478.htm'
    quote: 'known to Bedouin in Sinai Peninsula; a juice exuding in heavy drops from twigs'
  - where: 'note 16:31 “What manna was”'
    claim: 'It comes from a tamarisk in the west of the peninsula at the end of May and in June and is sweet and sticky'
    key: bdb
    url: 'https://biblehub.com/hebrew/4478.htm'
    quote: 'tree (tamarix gallica mannifera) in West Sinai Peninsula, end of May and in June, sweet, sticky, honey-like'

  # ---------- note 16:34 ----------
  - where: 'note 16:34 “A pot of manna before the Testimony”'
    claim: 'The Testimony is the two tablets that would be placed in the ark'
    key: ot-minute-ex-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-14-17'
    quote: 'Note: The “testimony” refers to the two tablets of the Ten Commandments that would be placed in the ark of the covenant.'
  - where: 'note 16:34 “A pot of manna before the Testimony”'
    claim: 'Aaron’s act is told here by anticipation, to sum up what concerns the manna'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/16.htm'
    quote: 'by way of anticipation, for the purpose of summing up everything of importance relating to the manna'
  - where: 'note 16:34 “A pot of manna before the Testimony”'
    claim: 'The Hebrew has no “golden”; it is the Septuagint’s'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/16.htm'
    quote: 'a golden jar, but there is nothing of this kind in the original text.'
  - where: 'note 16:34 “A pot of manna before the Testimony”'
    claim: 'The Septuagint reads “a golden pot”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/exodus/16.htm'
    quote: 'And Moses said to Aaron, Take a golden pot, and cast into it one full homer of manna; and thou shalt lay it up before God, to be kept for your generations'
  - where: 'note 16:34 “A pot of manna before the Testimony”'
    claim: 'The Bible Dictionary sets 1 Kings 8:9 beside Hebrews 9:4 on what the ark held'
    key: bd-ark-of-the-covenant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ark-of-the-covenant?lang=eng'
    quote: 'According to 1 Kgs. 8:9 it contained only the Tables of the Law, but in Heb. 9:4 it is said to have contained the “pot of manna” and “Aaron’s rod that budded,” which had been ordered to be kept “before the Testimony”'
  - where: 'note 16:34 “A pot of manna before the Testimony”'
    claim: 'Hebrews on the golden pot'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/9?lang=eng'
    quote: 'wherein was the golden pot that had manna, and Aaron’s rod that budded, and the tables of the covenant'
  - where: 'note 16:34 “A pot of manna before the Testimony”'
    claim: '1 Kings 8:9 is said of the ark when it was placed in Solomon’s temple'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'The ark, containing the two tablets of stone, is placed in the Holy o'

  # ---------- note 16:35 ----------
  - where: 'note 16:35 “When the manna stopped”'
    claim: 'The manna ceased after Israel ate the grain of Canaan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/5?lang=eng'
    quote: 'And the manna ceased on the morrow after they had eaten of the old corn of the land; neither had the children of Israel manna any more; but they did eat of the fruit of the land of Canaan that year.'
  - where: 'note 16:35 “When the manna stopped”'
    claim: 'It was after the Passover kept in Canaan, as Elder Christofferson quotes Joshua 5:11'
    key: christofferson-daily-bread
    url: 'https://speeches.byu.edu/talks/d-todd-christofferson/give-us-this-day-our-daily-bread'
    quote: 'on the morrow after the passover'
  - where: 'note 16:35 “When the manna stopped”'
    claim: 'The manna was not meant to become a dole'
    key: christofferson-daily-bread
    url: 'https://speeches.byu.edu/talks/d-todd-christofferson/give-us-this-day-our-daily-bread'
    quote: 'We should note, by the way, that 40 years of manna was not meant to become a dole. Once the tribes of Israel were in a position to provide for themselves, they were required to do so.'

  # ---------- christ ----------
  - where: 'christ'
    claim: 'Manna was a figure of Christ, the living bread'
    key: parry-manna
    url: 'https://scripturecentral.org/archive/books/book-chapter/manna-symbol-jesus-christ'
    quote: 'Manna symbolized Jesus Christ, who is “the living bread” (John 6:51).'
  - where: 'christ'
    claim: 'Paul’s “spiritual meat” is the manna, and he goes on to the rock'
    key: thomas-provocation
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/provocation-wilderness-rejection-grace'
    quote: 'And did all eat the same spiritual meat [manna]; And did all drink the same spiritual drink [water at Meribah]'
  - where: 'christ'
    claim: 'The hearers took the saying about His flesh only literally'
    key: christofferson-living-bread
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2017/10/the-living-bread-which-came-down-from-heaven?lang=eng'
    quote: 'The Savior’s intended meaning was totally lost on His hearers who understood His statement only literally.'
  - where: 'christ'
    claim: 'Jesus then gave the meaning of the figure: dwelling in Him'
    key: christofferson-living-bread
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2017/10/the-living-bread-which-came-down-from-heaven?lang=eng'
    quote: 'He then expressed the profound meaning of His metaphor:'
  - where: 'christ'
    claim: 'One study: the manna was undeserved, given to a murmuring people'
    key: parry-manna
    url: 'https://scripturecentral.org/archive/books/book-chapter/manna-symbol-jesus-christ'
    quote: 'Manna was undeserved. The lord said, “I have heard the murmurings of the children of Israel'
  - where: 'christ'
