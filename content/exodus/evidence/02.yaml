chapter: 2
claims:
  # ---------- when / setting ----------
  - where: 'when'
    claim: 'Moses was forty when he went out to his brethren, and forty more years passed in Midian'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/7?lang=eng'
    quote: 'And when he was full forty years old, it came into his heart to visit his brethren the children of Israel.'
  - where: 'when'
    claim: 'Moses was eighty when he spoke to Pharaoh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/7?lang=eng'
    quote: 'And Moses was fourscore years old, and Aaron fourscore and three years old, when they spake unto Pharaoh.'
  - where: 'setting'
    claim: 'Stephen puts forty years in Midian before the bush'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/7?lang=eng'
    quote: 'And when forty years were expired, there appeared to him in the wilderness of mount Sina an angel of the Lord in a flame of fire in a bush.'
  - where: 'setting'
    claim: 'Hebrews reads the hiding of the child and the leaving of Egypt as acts of faith'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/11?lang=eng'
    quote: 'By faith he forsook Egypt, not fearing the wrath of the king: for he endured, as seeing him who is invisible.'
  - where: 'setting'
    claim: 'The Joseph Smith Translation restores a prophecy of Joseph in Egypt about Moses'
    key: jst-gen-50
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-gen/50?lang=eng'
    quote: 'Joseph in Egypt prophesies of Moses freeing Israel from Egyptian bondage'

  # ---------- thread ----------
  - where: 'thread'
    claim: 'The women of Exodus 1–2 are read as active participants in Israel’s salvation'
    key: tilton-moses-midwife
    url: 'https://journal.interpreterfoundation.org/moses-as-midwife-what-the-exodus-birth-story-teaches-about-motherhood-and-christ/'
    quote: 'these women are active participants in the salvation of Israel, moving the story forward in important ways'
  - where: 'thread'
    claim: 'The chapter shows God’s hand in saving Moses'
    key: ot-minute-ex-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-1-6'
    quote: 'we have seen God’s hand in saving Moses, the future liberator of His people, from Pharaoh’s decree of death to all male Hebrew children'
  - where: 'thread'
    claim: 'The chapter shows Moses as rescuer or deliverer'
    key: ot-minute-ex-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-1-6'
    quote: 'we have also seen Moses as the rescuer, or deliverer, saving his fellow people from harm'
  - where: 'thread'
    claim: 'Moses’s early life is read as a descent from palace to exile, and the exile as the turning point'
    key: sc-knowhy-846
    url: 'https://scripturecentral.org/knowhy/why-did-moses-have-to-walk-a-sacred-path-before-delivering-israel'
    quote: 'That exile, however, becomes the turning point where he begins his ascent and is made fully ready to deliver Israel.'
  - where: 'thread'
    claim: 'Gershom means “a foreigner there”'
    key: sc-knowhy-846
    url: 'https://scripturecentral.org/knowhy/why-did-moses-have-to-walk-a-sacred-path-before-delivering-israel'
    quote: 'he lives as a shepherd and names his son Gershom, meaning “a foreigner there.”'
  - where: 'thread'
    claim: 'God is not named in Exodus 2 before verse 23, and is named five times in verses 23–25'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/2?lang=eng'
    quote: 'their cry came up unto God by reason of the bondage'

  # ---------- sections ----------
  - where: 'section 2 plain'
    claim: '“From the face of Pharaoh” is “from the presence of”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/2?lang=eng'
    quote: 'OR the presence of.'
  - where: 'section 1 plain'
    claim: 'The “slime” of 2:3 is bitumen, asphalt'
    key: bdb
    url: 'https://biblehub.com/hebrew/2564.htm'
    quote: 'bitumen, asphalt'
  - where: 'section 3 plain'
    claim: '“Strange” in 1611 meant foreign'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/2.htm'
    quote: 'This was the meaning of ‘strange’ (from Lat. extraneus), when the AV. was made in 1611'
  - where: 'section 4 plain'
    claim: '“Had respect unto them” is in Hebrew “knew”: took notice of them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/2?lang=eng'
    quote: 'HEB and God knew; i.e., He was cognizant of them.'

  # ---------- note 2:1 ----------
  - where: 'note 2:1 “Moses’s parents, and why no one is named”'
    claim: 'Moses’s parents were Amram and Jochebed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/6?lang=eng'
    quote: 'And Amram took him Jochebed his father’s sister to wife; and she bare him Aaron and Moses'
  - where: 'note 2:1 “Moses’s parents, and why no one is named”'
    claim: 'The one sister scripture names for Moses is Miriam'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/26?lang=eng'
    quote: 'and she bare unto Amram Aaron and Moses, and Miriam their sister'
  - where: 'note 2:1 “Moses’s parents, and why no one is named”'
    claim: 'Aaron was three years older than Moses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/7?lang=eng'
    quote: 'And Moses was fourscore years old, and Aaron fourscore and three years old'
  - where: 'note 2:1 “Moses’s parents, and why no one is named”'
    claim: 'The absence of other names in the birth story is read as pointing to the name Moses'
    key: arp-moses-egyptian
    url: 'https://journal.interpreterfoundation.org/joseph-knew-first-moses-the-egyptian-son/'
    quote: 'The conspicuous absence of any other names in this part of the narrative signals that the name of Moses is significant.'

  # ---------- note 2:3 ----------
  - where: 'note 2:3 “The ark among the reeds”'
    claim: 'The Hebrew tevah names the vessel of the infant Moses, made of papyrus'
    key: bdb
    url: 'https://biblehub.com/hebrew/8392.htm'
    quote: 'vessel in which infant Moses was laid among reeds Exodus 2:3 (made of papyrus'
  - where: 'note 2:3 “The ark among the reeds”'
    claim: 'The only other use of the word is for Noah’s ark'
    key: bdb
    url: 'https://biblehub.com/hebrew/8392.htm'
    quote: 'vessel which saved Noah and his family, with animals, during flood'
  - where: 'note 2:3 “The ark among the reeds”'
    claim: 'The word means a chest or box'
    key: bdb
    url: 'https://biblehub.com/hebrew/8392.htm'
    quote: 'properly chest, box'
  - where: 'note 2:3 “The ark among the reeds”'
    claim: 'The “slime” of 2:3 is bitumen, asphalt'
    key: bdb
    url: 'https://biblehub.com/hebrew/2564.htm'
    quote: 'bitumen, asphalt'
  - where: 'note 2:3 “The ark among the reeds”'
    claim: 'One older reading: the word is meant to recall Noah’s ark'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/2.htm'
    quote: 'is probably intended to call to mind the ark in which Noah was saved'
  - where: 'note 2:3 “The ark among the reeds”'
    claim: 'Jochebed puts her son into the water that was meant to drown him'
    key: welch-saviors
    url: 'https://mi.byu.edu/old-testament-reflections/saviors-before-sinai'
    quote: 'entrusts her child to the waters meant to drown him'

  # ---------- note 2:10 court ----------
  - where: 'note 2:10 “A Hebrew raised in Pharaoh’s court”'
    claim: 'Moses was nursed by his mother until weaning, about age three'
    key: muhlestein-israel-egypt
    url: 'https://rsc.byu.edu/creation-sinai/israel-egypt-canaan'
    quote: 'Moses was nursed by his own mother until the age of weaning, which was probably around three years old.'
  - where: 'note 2:10 “A Hebrew raised in Pharaoh’s court”'
    claim: 'He likely learned of his heritage from his mother'
    key: muhlestein-israel-egypt
    url: 'https://rsc.byu.edu/creation-sinai/israel-egypt-canaan'
    quote: 'It is quite likely that at her knee he learned something of his heritage and their family’s religious beliefs.'
  - where: 'note 2:10 “A Hebrew raised in Pharaoh’s court”'
    claim: 'He grew up in the royal harem, where the royal family was raised and educated'
    key: muhlestein-israel-egypt
    url: 'https://rsc.byu.edu/creation-sinai/israel-egypt-canaan'
    quote: 'Moses would have spent most of his growing years in the royal harem, the institution where Pharaoh insured that his family members were raised and educated properly'
  - where: 'note 2:10 “A Hebrew raised in Pharaoh’s court”'
    claim: 'Foreign princes were educated at court, and Moses’s origins were probably known'
    key: muhlestein-israel-egypt
    url: 'https://rsc.byu.edu/creation-sinai/israel-egypt-canaan'
    quote: 'It is probable that Moses’s foreign origins were not hidden. If so, he likely would have been viewed in a manner similar to these foreign princes'
  - where: 'note 2:10 “A Hebrew raised in Pharaoh’s court”'
    claim: 'The dating on which this picture rests is called speculative'
    key: muhlestein-israel-egypt
    url: 'https://rsc.byu.edu/creation-sinai/israel-egypt-canaan'
    quote: 'We must keep in mind that this date is speculative'
  - where: 'note 2:10 “A Hebrew raised in Pharaoh’s court”'
    claim: 'Stephen says Moses was learned in the wisdom of the Egyptians'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/7?lang=eng'
    quote: 'And Moses was learned in all the wisdom of the Egyptians, and was mighty in words and in deeds.'

  # ---------- note 2:10 name ----------
  - where: 'note 2:10 “Moses: an Egyptian name with a Hebrew meaning”'
    claim: 'The Church’s footnote gives an Egyptian and a Hebrew sense'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/2?lang=eng'
    quote: 'IE in Egyptian “To beget a child” and in Hebrew “To draw out.”'
  - where: 'note 2:10 “Moses: an Egyptian name with a Hebrew meaning”'
    claim: 'One reading: Exodus 2:10 plays on the name Moses and its Egyptian meaning, son'
    key: arp-moses-egyptian
    url: 'https://journal.interpreterfoundation.org/joseph-knew-first-moses-the-egyptian-son/'
    quote: 'This prophecy also follows the same Egyptian pun between the name Moses and its Egyptian meaning of son in Exodus 2:10'
  - where: 'note 2:10 “Moses: an Egyptian name with a Hebrew meaning”'
    claim: 'The name is built on the Egyptian root for giving birth, as in Thutmose and Rameses'
    key: sc-knowhy-846
    url: 'https://scripturecentral.org/knowhy/why-did-moses-have-to-walk-a-sacred-path-before-delivering-israel'
    quote: 'the name is also Egyptian, built on the root msỉ “give birth,” “be born,” as seen in names like Thutmose “born of Thoth” and Rameses “Ra has borne him.”'
  - where: 'note 2:10 “Moses: an Egyptian name with a Hebrew meaning”'
    claim: 'The name is almost certainly Egyptian; the narrator puns on the rare Hebrew verb mashah'
    key: arp-moses-egyptian
    url: 'https://journal.interpreterfoundation.org/joseph-knew-first-moses-the-egyptian-son/'
    quote: '“almost certainly Egyptian”6 the Biblical narrators provide a conspicuous Hebrew pun between the name of Moses'
  - where: 'note 2:10 “Moses: an Egyptian name with a Hebrew meaning”'
    claim: 'The Hebrew form is active, “he who draws out”'
    key: arp-moses-egyptian
    url: 'https://journal.interpreterfoundation.org/joseph-knew-first-moses-the-egyptian-son/'
    quote: 'Moshe would be the active participle of the verb mashah, “he who draws out,” instead of the expected passive participle mashu, “one drawn out.”'
  - where: 'note 2:10 “Moses: an Egyptian name with a Hebrew meaning”'
    claim: 'The active form is read as pointing to Moses drawing Israel out of Egypt'
    key: arp-moses-egyptian
    url: 'https://journal.interpreterfoundation.org/joseph-knew-first-moses-the-egyptian-son/'
    quote: 'his active role of drawing out Israel from Egypt as a deliverer'
  - where: 'note 2:10 “Moses: an Egyptian name with a Hebrew meaning”'
    claim: 'The Egyptian word means son or child'
    key: arp-moses-egyptian
    url: 'https://journal.interpreterfoundation.org/joseph-knew-first-moses-the-egyptian-son/'
    quote: 'corresponds to the Egyptian word mose, meaning ‘son’ or ‘child’'
  - where: 'note 2:10 “Moses: an Egyptian name with a Hebrew meaning”'
    claim: 'Joseph’s restored prophecy sets the name Moses beside the word son'
    key: arp-moses-egyptian
    url: 'https://journal.interpreterfoundation.org/joseph-knew-first-moses-the-egyptian-son/'
    quote: 'Joseph’s prophecy of Moses the deliverer restored by Joseph Smith would include a pun on Moses’s name and the word son'
  - where: 'note 2:10 “Moses: an Egyptian name with a Hebrew meaning”'
    claim: 'JST Genesis 50:29 foretells the name and the adoption'
    key: jst-gen-50
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-gen/50?lang=eng'
    quote: 'he shall be called Moses. And by this name he shall know that he is of thy house; for he shall be nursed by the king’s daughter, and shall be called her son.'

  # ---------- note 2:14 ----------
  - where: 'note 2:14 “The deliverer refused: Stephen’s reading”'
    claim: 'Stephen says Moses expected his brethren to understand that God would deliver them by his hand'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/7?lang=eng'
    quote: 'For he supposed his brethren would have understood how that God by his hand would deliver them: but they understood not.'
  - where: 'note 2:14 “The deliverer refused: Stephen’s reading”'
    claim: 'Stephen says God sent the Moses they refused as ruler and deliverer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/7?lang=eng'
    quote: 'This Moses whom they refused, saying, Who made thee a ruler and a judge? the same did God send to be a ruler and a deliverer'
  - where: 'note 2:14 “The deliverer refused: Stephen’s reading”'
    claim: 'Stephen applies the pattern to his hearers and the Just One'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/7?lang=eng'
    quote: 'they have slain them which shewed before of the coming of the Just One; of whom ye have been now the betrayers and murderers'
  - where: 'note 2:14 “The deliverer refused: Stephen’s reading”'
    claim: 'The Church’s study help reads the killing as defense, not murder'
    key: scripture-helps-ex-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/12-exodus-1-6?lang=eng'
    quote: 'However, since he was acting in defense, Moses was not guilty of murder.'

  # ---------- note 2:17 ----------
  - where: 'note 2:17 “The meeting at the well”'
    claim: 'Meetings at a well in Genesis 24, Genesis 29 and Exodus 2 follow one pattern'
    key: sc-knowhy-854
    url: 'https://scripturecentral.org/knowhy/why-does-boaz-allude-to-a-well-in-connection-with-his-meeting-ruth'
    quote: 'In Genesis 29, Jacob travels away from his current home and meets his wife Rachel at a well. In Exodus 2, Moses leaves Egypt and meets his wife at a well.'
  - where: 'note 2:17 “The meeting at the well”'
    claim: 'What a type-scene is'
    key: sc-knowhy-854
    url: 'https://scripturecentral.org/knowhy/why-does-boaz-allude-to-a-well-in-connection-with-his-meeting-ruth'
    quote: 'Type-scenes are a narrative style in which certain stories are modeled after a basic outline, with the specifics being changed depending on the individual story being told.'
  - where: 'note 2:17 “The meeting at the well”'
    claim: 'The differences between the scenes carry the meaning'
    key: sc-knowhy-854
    url: 'https://scripturecentral.org/knowhy/why-does-boaz-allude-to-a-well-in-connection-with-his-meeting-ruth'
    quote: 'these differences allowed the type-scene to fit each character’s historical circumstance and, perhaps more importantly, provide the audience with some deeper meaning'
  - where: 'note 2:17 “The meeting at the well”'
    claim: 'What is distinctive in Moses’s scene is that he must first deal with the shepherds'
    key: sc-knowhy-854
    url: 'https://scripturecentral.org/knowhy/why-does-boaz-allude-to-a-well-in-connection-with-his-meeting-ruth'
    quote: 'Moses has to help the women at the well deal with interlopers before he can draw water for his future wife (Exodus 2:15-17).'
  - where: 'note 2:17 “The meeting at the well”'
    claim: 'Moses’s driving off the shepherds foreshadows the deliverance from Egypt'
    key: sc-knowhy-854
    url: 'https://scripturecentral.org/knowhy/why-does-boaz-allude-to-a-well-in-connection-with-his-meeting-ruth'
    quote: 'He will have to help deliver his people from oppressors in Egypt, just as he delivered the women from the rascals at the well.'
  - where: 'note 2:17 “The meeting at the well”'
    claim: '“Helped them” is the Hebrew verb yasha (H3467)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וַ/יּ֣וֹשִׁעָ֔/ן'
  - where: 'note 2:17 “The meeting at the well”'
    claim: '“Delivered” in 2:19 is a different Hebrew verb (H5337)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'הִצִּילָ֖/נוּ'
  - where: 'note 2:17 “The meeting at the well”'
    claim: 'Yasha in this stem means deliver'
    key: bdb
    url: 'https://biblehub.com/hebrew/3467.htm'
    quote: 'verb Hiph`il deliver'

  # ---------- note 2:18 ----------
  - where: 'note 2:18 “Reuel, Jethro, and the priesthood Moses received”'
    claim: 'Jethro is also called Jether and Reuel, a prince and priest of Midian'
    key: bd-jethro
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jethro?lang=eng'
    quote: 'Also called Jether and Reuel, a prince and priest of Midian who gave Moses a home after his flight from Egypt and afterwards became his father-in-law'
  - where: 'note 2:18 “Reuel, Jethro, and the priesthood Moses received”'
    claim: 'The priesthood Moses received from Jethro was the Melchizedek Priesthood'
    key: bd-jethro
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jethro?lang=eng'
    quote: 'It was from Jethro that Moses received the Melchizedek Priesthood (D&C 84:6–7).'
  - where: 'note 2:18 “Reuel, Jethro, and the priesthood Moses received”'
    claim: 'Two explanations of the two names: scribal error, or a personal and a priestly name'
    key: ot-minute-ex-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-1-6'
    quote: 'some scholars attribute the dual names to scribal error. Others say that perhaps Reuel was indeed his real name, but Jethro was his priestly name.'
  - where: 'note 2:18 “Reuel, Jethro, and the priesthood Moses received”'
    claim: 'Jethro descended from Abraham and Keturah through Midian'
    key: scripture-helps-ex-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/12-exodus-1-6?lang=eng'
    quote: 'As a Midianite, Jethro was a descendant of Abraham and Keturah through their son Midian.'
  - where: 'note 2:18 “Reuel, Jethro, and the priesthood Moses received”'
    claim: 'Where Midian lay'
    key: scripture-helps-ex-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/12-exodus-1-6?lang=eng'
    quote: 'Midian was mostly east of the Jordan River and the Dead Sea and included the southern and eastern portions of the Sinai Peninsula'
  - where: 'note 2:18 “Reuel, Jethro, and the priesthood Moses received”'
    claim: 'The Joseph Smith Translation calls Jethro the high priest of Midian'
    key: jst-ex-18
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-ex/18?lang=eng'
    quote: 'When Jethro, the high priest of Midian, Moses’ father-in-law, heard of all that God had done for Moses'
  - where: 'note 2:18 “Reuel, Jethro, and the priesthood Moses received”'
    claim: 'Moses received the Holy Priesthood under Jethro’s hand'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'And the sons of Moses, according to the Holy Priesthood which he received under the hand of his father-in-law, Jethro;'
  - where: 'note 2:18 “Reuel, Jethro, and the priesthood Moses received”'
    claim: 'The line of ordination reaches back to the days of Abraham'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'Esaias also lived in the days of Abraham, and was blessed of him'
  - where: 'note 2:18 “Reuel, Jethro, and the priesthood Moses received”'
    claim: 'Jethro confesses the LORD and offers sacrifice to God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/18?lang=eng'
    quote: 'And Jethro, Moses’ father in law, took a burnt offering and sacrifices for God'

  # ---------- note 2:25 ----------
  - where: 'note 2:25 “God heard, remembered, looked, and knew”'
    claim: 'The Hebrew of “had respect unto them” is “God knew”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/2?lang=eng'
    quote: 'HEB and God knew; i.e., He was cognizant of them.'
  - where: 'note 2:25 “God heard, remembered, looked, and knew”'
    claim: 'The verb in 2:25 is yada (H3045), “know”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וַ/יֵּ֖דַע'
  - where: 'note 2:25 “God heard, remembered, looked, and knew”'
    claim: 'One older reading: “knew” is noticed, regarded'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/2.htm'
    quote: 'lit. knew (them), i.e. noticed, regarded them'
  - where: 'note 2:25 “God heard, remembered, looked, and knew”'
    claim: 'One older reading: “looked” is saw with attention and sympathy'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/2.htm'
    quote: 'viz. with attention and sympathy'
  - where: 'note 2:25 “God heard, remembered, looked, and knew”'
    claim: 'Remembering the covenant means the time had come to fulfil it'
    key: ot-minute-ex-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-1-6'
    quote: 'it was time for God to fulfil His promise of redeeming His people'
  - where: 'note 2:25 “God heard, remembered, looked, and knew”'
    claim: 'Exodus 3:7 has the verb “know” (H3045) of 2:25'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'יָדַ֖עְתִּי'
  - where: 'note 2:25 “God heard, remembered, looked, and knew”'
    claim: 'Exodus 3:7 has the verb “see” (H7200) of 2:25'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'רָאִ֛יתִי'
  - where: 'note 2:25 “God heard, remembered, looked, and knew”'
    claim: 'Exodus 3:7 has the verb “hear” (H8085) of 2:24'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'שָׁמַ֨עְתִּי֙'
  - where: 'note 2:25 “God heard, remembered, looked, and knew”'
