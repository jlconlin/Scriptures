chapter: 6
claims:
  - where: 'when'
    claim: 'Moses was eighty when he and Aaron spoke to Pharaoh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/7?lang=eng'
    quote: 'And Moses was fourscore years old, and Aaron fourscore and three years old, when they spake unto Pharaoh.'
  - where: 'setting'
    claim: 'The Church chapter heading names two things: the Lord identifies Himself as Jehovah, and the genealogies of Reuben, Simeon and Levi'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/6?lang=eng'
    quote: 'The Lord identifies Himself as Jehovah—The genealogies of Reuben, Simeon, and Levi are listed.'
  - where: 'setting'
    claim: 'In chapter 5 Pharaoh withheld straw and kept the tale of bricks; the officers blamed Moses and Aaron'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/5?lang=eng'
    quote: 'Ye shall no more give the people straw to make brick, as heretofore: let them go and gather straw for themselves.'
  - where: 'setting'
    claim: 'Verse 4 brings together the covenant promises of Genesis 17:7–8 and the later promises to Isaac and Jacob'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/6.htm'
    quote: 'In Exodus 6:4 the covenant promises of Genesis 17:7-8; Genesis 26:3; Genesis 35:11-12, are all brought together'
  - where: 'explore'
    claim: 'Deuteronomy 26 gives the words to be said with the basket of firstfruits, telling of the deliverance from Egypt as done'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/26?lang=eng'
    quote: 'And the Lord brought us forth out of Egypt with a mighty hand, and with an outstretched arm, and with great terribleness, and with signs, and with wonders:'
  - where: 'thread'
    claim: 'The stress on the Lord’s own actions, past and future, in 6:1–8 answers the grief of 5:22–23 and teaches reliance on God'
    key: brown-trust-lord
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/trust-lord'
    quote: 'This unusually heavy stress by the Lord on His own actions, both past and future, must have begun to open Moses’ eyes to the important concept that he and his fellow Israelites were to rely totally on God'
  - where: 'thread'
    claim: 'The speech answers Moses’s complaint of 5:22–23 with statements in the first person'
    key: brown-trust-lord
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/trust-lord'
    quote: 'In answering the now grief-stricken Moses (see Exodus 5:22–23), God quietly assured him and his fellow Israelites that He would surely bring events to their proper end.'
  - where: 'thread'
    claim: 'The promise has three elements: deliverance, adoption as God’s nation, and the land'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/6.htm'
    quote: '(a) the deliverance of Israel from the bondage of Egypt … (b) the adoption of Israel as the nation of God; - (c) the guidance of Israel into the land promised to the fathers (Exodus 6:6-8).'
  - where: 'thread'
    claim: 'The promise begins at 6:2 and ends at 6:8 with the same words, “I am the LORD”'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/6.htm'
    quote: 'The divine promise not only commences in Exodus 6:2, but concludes at Exodus 6:8, with the emphatic expression, "I Jehovah,"'
  - where: 'thread'
    claim: 'The people’s earlier belief gave way to despondency as the oppression increased'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/6.htm'
    quote: 'Thus the early belief of the Israelites was changed into the despondency of unbelief through the increase of their oppression.'
  - where: 'thread'
    claim: 'The Lord’s reply to Moses’s objection comes in 7:1–5; the story broken off at 6:12 resumes at 6:28'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/6.htm'
    quote: 'The reply of God to this objection is given in Exodus 7:1-5.'
  - where: 'section 1 plain'
    claim: 'The “strong hand” of verse 1 is the Lord’s power, by which Pharaoh is compelled'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/6?lang=eng'
    quote: 'HEB by a hand of strength; i.e., by reason of the power of the Lord.'
  - where: 'section 2 plain'
    claim: '“Uncircumcised lips” means impaired speech'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/6?lang=eng'
    quote: 'IE of impaired speech. Ex. 4:10.'
  - where: 'note 6:3 “The patriarchs knew the name Jehovah”'
    claim: 'The Joseph Smith Translation of 6:3 makes the last clause a question'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/6?lang=eng'
    quote: 'JST Ex. 6:3 … and unto Jacob. I am the Lord God Almighty; the Lord Jehovah. And was not my name known unto them?'
  - where: 'note 6:3 “The patriarchs knew the name Jehovah”'
    claim: 'God introduced Himself to Jacob as God Almighty'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/35?lang=eng'
    quote: 'And God said unto him, I am God Almighty: be fruitful and multiply'
  - where: 'note 6:3 “The patriarchs knew the name Jehovah”'
    claim: 'Latter-day revelation (JST Ex. 6:3; Abr. 1:16; 2:8) and Gen. 22:14 show the name was known before Moses'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Although Ex. 6:3 states that the God of Israel was not known by the name Jehovah before Moses’ time, latter-day revelation tells us otherwise; see JST Ex. 6:3 (Ex. 6:3 note c); Abr. 1:16; 2:8; see also Gen. 22:14.'
  - where: 'note 6:6 “To redeem is a kinsman’s act”'
    claim: 'The Hebrew verb ga’al means to redeem, to act as kinsman, to do the part of next of kin; the kinsman of Lev. 25:25 is this word'
    key: bdb
    url: 'https://biblehub.com/hebrew/1350.htm'
    quote: '1 act as kinsman, do the part of next of kin (chiefly in D H P Ruth), גֹּאֵל kinsman Leviticus 25:25 (H)'
  - where: 'note 6:6 “To redeem is a kinsman’s act”'
    claim: 'BDB’s head definition of the verb'
    key: bdb
    url: 'https://biblehub.com/hebrew/1350.htm'
    quote: 'I. גָּאַל verb redeem, act as kinsman'
  - where: 'note 6:6 “To redeem is a kinsman’s act”'
    claim: 'BDB gives a separate sense for the verb with God as subject, implying personal relationship'
    key: bdb
    url: 'https://biblehub.com/hebrew/1350.htm'
    quote: '3 redeem, with God as subject implying personal relationship, chiefly in poetry'
  - where: 'note 6:6 “To redeem is a kinsman’s act”'
    claim: 'BDB lists Exodus 6:6 under that sense, of Israel redeemed from Egyptian bondage'
    key: bdb
    url: 'https://biblehub.com/hebrew/1350.htm'
    quote: 'b. Israel, from Egyptian bondage Exodus 6:6 (P?) Exodus 15:13 (song) Psalm 74:2'
  - where: 'note 6:6 “To redeem is a kinsman’s act”'
    claim: 'Jehovah was considered the divine goel of Israel as a whole, with Exodus 6:6 and 15:13 cited'
    key: sc-knowhy-162
    url: 'https://scripturecentral.org/knowhy/why-was-ammoron-determined-to-avenge-the-blood-of-his-brother'
    quote: 'Extending this legal procedure into the theological realm, Jehovah was, naturally, considered the divine goel (redeemer, avenger) of Israel as a whole (Exodus 6:6; 15:13; Psalm 74:2; 94).'
  - where: 'note 6:6 “To redeem is a kinsman’s act”'
    claim: 'The divine goel was expected to buy Israel back from bondage'
    key: sc-knowhy-162
    url: 'https://scripturecentral.org/knowhy/why-was-ammoron-determined-to-avenge-the-blood-of-his-brother'
    quote: 'He was expected to avenge Israel’s blood shed by her physical and spiritual enemies and also to redeem Israel or buy her back from bondage, slavery, or debt servitude.'
  - where: 'note 6:6 “To redeem is a kinsman’s act”'
    claim: 'The law of the kinsman who redeems a poor brother’s land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/25?lang=eng'
    quote: 'If thy brother be waxen poor, and hath sold away some of his possession, and if any of his kin come to redeem it, then shall he redeem that which his brother sold.'
  - where: 'note 6:6 “The arm of the LORD and the arm of Pharaoh”'
    claim: 'The Exodus expressions about Jehovah’s arm are counterparts to Egyptian expressions of royal power'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'Hoffmeier has shown that the Exodus narrative’s expressions concerning the arm of Jehovah are “Hebrew derivations or counterparts to Egyptian expressions that symbolized Egyptian royal power.”'
  - where: 'note 6:6 “The arm of the LORD and the arm of Pharaoh”'
    claim: 'The language is used to call up Pharaoh’s might and Jehovah’s power over it'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'The language that creates these images of Jehovah’s arm seems to be employed specifically to invoke the image of Pharaoh’s might and Jehovah’s ability to overcome that might.'
  - where: 'note 6:6 “The arm of the LORD and the arm of Pharaoh”'
    claim: 'The Church’s footnote to verse 1 gives the Hebrew as “by a hand of strength” and takes it of the Lord’s power'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/6?lang=eng'
    quote: 'HEB by a hand of strength; i.e., by reason of the power of the Lord.'
  - where: 'note 6:12 “Why Moses calls his lips uncircumcised”'
    claim: 'The Joseph Smith Translation of verse 30 (numbered 6:29) reads “of stammering lips, and slow of speech”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/6?lang=eng'
    quote: 'JST Ex. 6:29 … of stammering lips, and slow of speech; how shall …'
  - where: 'note 6:12 “Why Moses calls his lips uncircumcised”'
    claim: 'The foreskin was understood as covering or blocking function, so “uncircumcised” became a metaphor for being covered or insensitive; Exodus 6:12, 30 and Jeremiah 6:10 are cited'
    key: sc-knowhy-872
    url: 'https://scripturecentral.org/knowhy/why-does-jeremiah-refer-to-circumcising-the-heart'
    quote: 'the ancients appear to have understood the excess skin surrounding the glans of male anatomy as covering or blocking full function or sensitivity. Thus, it became a metaphor for being covered from or insensitive to spiritual things generally (see, for example, Jeremiah 6:10, Exodus 6:12, 30).'
  - where: 'note 6:12 “Why Moses calls his lips uncircumcised”'
    claim: 'Leviticus speaks of uncircumcised hearts'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'if then their uncircumcised hearts be humbled'
  - where: 'note 6:14 “Why a genealogy interrupts the story”'
    claim: 'The genealogy breaks the narrative to show that it is this Moses and this Aaron who were given the task'
    key: ot-minute-ex-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-1-6'
    quote: 'The biblical text breaks the narrative to list a genealogy leading up to Moses and Aaron’s generation to show that it is this very Moses and this very Aaron that had been given the task of delivering Israel.'
  - where: 'note 6:14 “Why a genealogy interrupts the story”'
    claim: 'The list begins with Reuben to show Levi’s place among Jacob’s sons'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/6.htm'
    quote: 'To show clearly the genealogical position of Levi, the tribe-father of Moses and Aaron, among the sons of Jacob, the genealogy commences with Reuben, the first-born of Jacob'
  - where: 'note 6:14 “Why a genealogy interrupts the story”'
    claim: 'Aaron stands first in the genealogy as the elder; Moses takes precedence in the conclusion that leads back to the narrative'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/6.htm'
    quote: 'In the genealogy itself Aaron stands first, as the elder of the two; in the conclusion, which leads over to the historical narrative that follows, Moses takes precedence of his elder brother'
  - where: 'note 6:14 “Why a genealogy interrupts the story”'
    claim: 'Verses 28–30 resume the story broken off at verse 12'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/6.htm'
    quote: 'In Exodus 6:28-30 the thread of the history, which was broken off at Exodus 6:12, is again resumed.'
  - where: 'note 6:16 “Four generations, as Abraham was told”'
    claim: 'The Church’s footnote at verse 19 points to Genesis 15:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/6?lang=eng'
    quote: 'Gen. 15:16 (13–16)'
  - where: 'note 6:16 “Four generations, as Abraham was told”'
    claim: 'The narrator lists four generations, matching the promise to Abram of deliverance in the fourth generation'
    key: ot-minute-ex-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-1-6'
    quote: 'The narrator listed only four generations from the time of Jacob (Israel), starting with Jacob’s first three sons: Reuben, Simeon, and Levi. In Genesis 15:13–16, the Lord promised Abram that deliverance of his people would come in the fourth generation'
  - where: 'note 6:20 “Amram and Jochebed”'
    claim: 'Jochebed was a daughter of Levi born in Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/26?lang=eng'
    quote: 'And the name of Amram’s wife was Jochebed, the daughter of Levi, whom her mother bare to Levi in Egypt: and she bare unto Amram Aaron and Moses, and Miriam their sister.'
  - where: 'note 6:20 “Amram and Jochebed”'
    claim: 'Leviticus 18:12 forbids union with a father’s sister'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/18?lang=eng'
    quote: 'she is thy father’s near kinswoman.'
  - where: 'note 6:20 “Amram and Jochebed”'
    claim: 'Such a marriage was prohibited in the law of Moses but allowed before it was given'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/6.htm'
    quote: 'a marriage which was prohibited in the Mosaic law (Leviticus 18:12), but was allowed before the giving of the law'
  - where: 'note 6:23 “Names the later story needs”'
    claim: 'Aaron’s sons became the leaders of the Levitical Priesthood'
    key: ot-minute-ex-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-1-6'
    quote: 'The narrator goes on to list Aaron’s sons, who would go on to become leaders of the Levitical Priesthood in Israel.'
  - where: 'note 6:23 “Names the later story needs”'
    claim: 'Eleazar and Ithamar assisted Aaron after Nadab and Abihu died; the high priests descended from Eleazar, those from Eli to Abiathar excepted'
    key: bd-eleazar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/eleazar?lang=eng'
    quote: 'Eleazar and Ithamar were Aaron’s chief assistants after the death of Nadab and Abihu by fire'
  - where: 'note 6:23 “Names the later story needs”'
    claim: 'The high priests descended from Eleazar, with one exception'
    key: bd-eleazar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/eleazar?lang=eng'
    quote: 'All the high priests until the Maccabean period were descended from Eleazar, with the exception of those from Eli to Abiathar, inclusive, who belonged to the family of Ithamar.'
  - where: 'note 6:23 “Names the later story needs”'
    claim: 'Phinehas, Aaron’s grandson, acted at Peor and was later high priest'
    key: bd-phinehas
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/phinehas?lang=eng'
    quote: 'Grandson of Aaron (Ex. 6:25); kills the two offenders at Peor (Num. 25:7, 11; 31:6; Ps. 106:30); Phinehas and the trans-Jordanic tribes (Josh. 22:15, 30–32); his home (Josh. 24:33); high priest (Judg. 20:28'
  - where: 'note 6:23 “Names the later story needs”'
    claim: 'Korah son of Izhar led the rebellion against Moses and Aaron; his descendants were a guild of musicians named in psalm titles'
    key: bd-korah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/korah?lang=eng'
    quote: 'the leader of the rebellion against Moses and Aaron (Num. 16; 26:9–11; Jude 1:11). His descendants, the Korahites, or Korathites, formed a guild of musicians (2 Chr. 20:19; titles of Ps. 42; 44–49; 84–85; 87–88)'
  - where: 'note 6:23 “Names the later story needs”'
    claim: 'Numbers 16:1 names Korah as son of Izhar, son of Kohath, son of Levi'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/16?lang=eng'
    quote: 'Now Korah, the son of Izhar, the son of Kohath, the son of Levi'
  - where: 'christ'
    claim: 'What it is to redeem'
    key: gs-redeem
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/redeem-redeemed-redemption?lang=eng'
    quote: 'To deliver, to purchase, or to ransom, such as to free a person from bondage by payment.'
  - where: 'christ'
    claim: 'Jesus Christ is the Redeemer'
    key: gs-redeemer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/redeemer?lang=eng'
    quote: 'Jesus Christ is the great Redeemer of mankind because He, through His Atonement, paid the price for the sins of mankind and made possible the resurrection of all people.'
  - where: 'christ'
    claim: 'The Church’s footnote 6a at “bring” points to 1 Nephi 19:10, where the God who led Israel out of Egypt yields Himself to be lifted up'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/19?lang=eng'
    quote: 'And the God of our fathers, who were led out of Egypt, out of bondage, and also were preserved in the wilderness by him, yea, the God of Abraham, and of Isaac, and the God of Jacob, yieldeth himself'
  - where: 'explore'
    claim: 'Numbers 3:27 names the four families of Kohath'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/3?lang=eng'
    quote: 'And of Kohath was the family of the Amramites, and the family of the Izeharites, and the family of the Hebronites, and the family of the Uzzielites: these are the families of the Kohathites.'
