chapter: 20
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'Israel reached Sinai in the third month after leaving Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/19?lang=eng'
    quote: 'In the third month, when the children of Israel were gone forth out of the land of Egypt, the same day came they into the wilderness of Sinai.'
  - where: 'setting'
    claim: 'Three days before, Moses was told to sanctify the people for the day the LORD would come down in the sight of all'
    key: scripture-helps-ex-19
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/15-exodus-19-20-24-31-34?lang=eng'
    quote: 'Three days earlier, the Lord had commanded Moses to sanctify the people so they could be prepared for when “the Lord will come down in the sight of all the people upon mount Sinai.”'
  - where: 'setting'
    claim: 'The name “ten commandments” is in Exodus 34:28'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'And he wrote upon the tables the words of the covenant, the ten commandments.'
  - where: 'setting'
    claim: 'The Hebrew name is the Ten Words; the Greek name Decalogue comes from it'
    key: bd-commandments-ten
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/commandments-the-ten?lang=eng'
    quote: 'The Hebrew name for these is the “Ten Words,” hence the Greek name Decalogue.'
  - where: 'setting'
    claim: 'They were engraved on two tables of stone kept in the Ark'
    key: bd-commandments-ten
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/commandments-the-ten?lang=eng'
    quote: 'They were engraved on two tables of stone, which were placed in the Ark; hence the Ark was called the Ark of the Covenant (Num. 10:33).'
  - where: 'setting'
    claim: 'The ten are divided differently in different traditions; the Roman Catholic count joins the first and second and divides the last'
    key: bd-commandments-ten
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/commandments-the-ten?lang=eng'
    quote: 'There has been a difference of opinion as to the way in which the commandments were divided into ten. The Roman Church, following the example of St. Augustine, unites what we know as the first and second and divides the last into two.'
  - where: 'setting'
    claim: 'The commandments are reiterated in the Book of Mormon and the Doctrine and Covenants'
    key: bd-commandments-ten
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/commandments-the-ten?lang=eng'
    quote: 'The Ten Commandments have been reiterated in latter-day revelation, certifying as to their genuineness and importance, as also Moses’ experience on Sinai has been thus verified. See Mosiah 12:32–37; 13:5; D&C 42:18–28; 59:5–13.'
  - where: 'setting'
    claim: 'The Savior summarized the ten in two great commandments'
    key: bd-commandments-ten
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/commandments-the-ten?lang=eng'
    quote: 'Our Lord, quoting from Deut. 6:4–5 and Lev. 19:18, has summarized the Ten Commandments in “two great commandments” (Matt. 22:37–39).'
  - where: 'setting'
    claim: 'The Church’s footnotes point from this chapter to Deuteronomy 5 and to Abinadi’s recital in Mosiah 13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/20?lang=eng'
    quote: 'Deut. 5:6 (6–21); Mosiah 13:12 (12–24).'
  - where: 'thread'
    claim: 'The law code that follows the Decalogue runs from 20:22 to 23:33, and the Decalogue is its prologue'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'The first major law code in the Pentateuch, immediately after the giving of the Decalogue, is the Covenant Code (Exodus 20:22–23:33), for which the Decalogue serves as a kind of prologue.'
  - where: 'thread'
    claim: 'The first four commandments concern the covenant relationship with God'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'The first four commandments define and protect the Israelites’ covenant relationship with Yahweh (Exodus 20:1–11).'
  - where: 'thread'
    claim: 'The next six concern relationships among the people of the covenant'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'The next six commandments pertain to their inner relationships within the covenant (Exodus 20:12–17).'
  - where: 'thread'
    claim: 'The place of the Decalogue at the head of the law codes shows the relational nature of the law that follows'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'helps us appreciate and understand the social/relational nature of all the legislation that follows.'
  - where: 'thread'
    claim: 'Each of the two great commandments answers to one table of the ten'
    key: eom-ten-commandments
    url: 'https://eom.byu.edu/index.php/Ten_Commandments'
    quote: 'encapsulates one of the two tables of the Ten Commandments.'
  - where: 'thread'
    claim: 'The commandments about God carry explanations; those about neighbors are short and direct'
    key: eom-ten-commandments
    url: 'https://eom.byu.edu/index.php/Ten_Commandments'
    quote: 'These are elaborated with explanations and consequences. The second table, written in short, direct statements, deals with'
  - where: 'thread'
    claim: 'The people handed to Moses the direct experience of God'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'Rather, the children of Israel place the burden and privilege of personally experiencing God on Moses.'

  # ---------- sections ----------
  - where: 'section 1 plain'
    claim: '“Stranger” may be rendered sojourner'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/20?lang=eng'
    quote: 'OR sojourner.'
  - where: 'section 1 plain'
    claim: '“Hallowed” is sanctified, made holy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/20?lang=eng'
    quote: 'OR sanctified or consecrated.'
  - where: 'section 2 plain'
    claim: 'The Hebrew of “kill” is murder'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/20?lang=eng'
    quote: 'HEB murder.'
  - where: 'section 3 plain'
    claim: 'The fear of verse 20 is respect that keeps one from sin'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/20?lang=eng'
    quote: 'OR because respect for Him will always be present with you, you will not sin.'
  - where: 'section 4 plain'
    claim: '“With me” in verse 23 means in association with me'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/20?lang=eng'
    quote: 'IE in association with me.'
  - where: 'section 4 plain'
    claim: '“Discovered” is revealed, uncovered'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/20?lang=eng'
    quote: 'OR revealed.'

  # ---------- notes ----------
  - where: 'note 20:1 “Words the whole people heard”'
    claim: 'The people at the foot of Sinai heard God’s voice proclaim the commandments from the cloud'
    key: scripture-helps-ex-19
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/15-exodus-19-20-24-31-34?lang=eng'
    quote: 'While the Israelites were gathered at the base of Mount Sinai, they heard the voice of God proclaim the Ten Commandments to them from a cloud at the top of the mountain.'
  - where: 'note 20:1 “Words the whole people heard”'
    claim: 'Moses says the LORD spoke these words to the whole assembly and added no more'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/5?lang=eng'
    quote: 'These words the Lord spake unto all your assembly in the mount out of the midst of the fire, of the cloud, and of the thick darkness, with a great voice: and he added no more.'
  - where: 'note 20:1 “Words the whole people heard”'
    claim: 'Deuteronomy 4 names them ten commandments, written on two tables'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/4?lang=eng'
    quote: 'And he declared unto you his covenant, which he commanded you to perform, even ten commandments; and he wrote them upon two tables of stone.'

  - where: 'note 20:2 “The commandments begin with the deliverance”'
    claim: 'Verse 2 reminds Israel that God acts on their behalf'
    key: ot-minute-ex-18
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-18-20'
    quote: 'This was also a reminder that God acts on behalf of the children of Israel.'
  - where: 'note 20:2 “The commandments begin with the deliverance”'
    claim: 'The commandments serve the bond stated in Exodus 6:7'
    key: shannon-kingdom-priests
    url: 'https://mi.byu.edu/old-testament-reflections/gods-trustworthiness-and-becoming-a-kingdom-of-priests'
    quote: 'All of the commandments, regulations, and covenants that the Lord gave to his people in the scriptures were in service to this bond.'
  - where: 'note 20:2 “The commandments begin with the deliverance”'
    claim: 'The reflection quotes Exodus 6:7 as what the LORD wanted for Israel'
    key: shannon-kingdom-priests
    url: 'https://mi.byu.edu/old-testament-reflections/gods-trustworthiness-and-becoming-a-kingdom-of-priests'
    quote: 'he told Moses what he wanted for Israel: “And I will take you to me for a people, and I will be to you a God'
  - where: 'note 20:2 “The commandments begin with the deliverance”'
    claim: 'In the first commandment Exodus puts the connection with God first'
    key: shannon-kingdom-priests
    url: 'https://mi.byu.edu/old-testament-reflections/gods-trustworthiness-and-becoming-a-kingdom-of-priests'
    quote: 'Note that Exodus puts the connection with God first and foremost'

  - where: 'note 20:4 “What the second commandment forbids”'
    claim: 'A graven image is a figure carved of wood or stone'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/20.htm'
    quote: 'to carve wood or stone, is a figure made of wood or stone'
  - where: 'note 20:4 “What the second commandment forbids”'
    claim: 'The commandment is about figures made for worship, not image-making in general'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/20.htm'
    quote: 'the allusion is not to the making of images generally, but to the construction of figures of God as objects of religious reverence or worship, but this is expressly stated in Exodus 20:5'
  - where: 'note 20:4 “What the second commandment forbids”'
    claim: 'Deuteronomy 4:15–16 is taken as Moses’s own explanation; the images are representations of Jehovah'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/20.htm'
    quote: 'This authoritative exposition of the divine prohibition on the part of Moses himself proves undeniably, that'
  - where: 'note 20:4 “What the second commandment forbids”'
    claim: 'The images in view are symbolical representations of Jehovah'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/20.htm'
    quote: 'are to be understood as referring to symbolical representations of Jehovah.'
  - where: 'note 20:4 “What the second commandment forbids”'
    claim: 'Deuteronomy 4: Israel saw no similitude at Horeb, lest they make a graven image'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/4?lang=eng'
    quote: 'Take ye therefore good heed unto yourselves; for ye saw no manner of similitude on the day that the Lord spake unto you in Horeb out of the midst of the fire:'
  - where: 'note 20:4 “What the second commandment forbids”'
    claim: 'A calf made to represent the LORD was still an idol under this commandment'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'Yet even if the golden calf was made to represent Yahweh, the reader is to understand the image fell under the parameter of an idol'

  - where: 'note 20:5 “What jealous means when it is said of God”'
    claim: 'The two senses of jealous in scripture'
    key: gs-jealous
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jealous-jealousy?lang=eng'
    quote: 'As used in the scriptures, the word jealous has two meanings: (1) to be fervent and to have sensitive and deep feelings about someone or something, and (2) to be envious of someone or suspicious that another will gain some advantage.'
  - where: 'note 20:5 “What jealous means when it is said of God”'
    claim: 'The Church’s footnote on the Hebrew'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/20?lang=eng'
    quote: 'possessing sensitive and deep feelings.'
  - where: 'note 20:5 “What jealous means when it is said of God”'
    claim: 'The adjective is used only of God'
    key: bdb
    url: 'https://biblehub.com/hebrew/7067.htm'
    quote: 'adjective jealous; — only of God'
  - where: 'note 20:5 “What jealous means when it is said of God”'
    claim: 'BDB: of God as punishing those who hate Him and as demanding exclusive service; also Exodus 34:14'
    key: bdb
    url: 'https://biblehub.com/hebrew/7067.htm'
    quote: '(as punishing those who hate him), Exodus 34:14 (J), Deuteronomy 4:24; Deuteronomy 6:15 (demanding exclusive service)'

  - where: 'note 20:5 “The third and fourth generation, and the thousands”'
    claim: 'The Church’s footnote limits the visiting to children who do as their parents did'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/20?lang=eng'
    quote: 'IE insofar as the children learn and do the sinful things the parents do; but see v. 6 concerning those who repent and serve the Lord.'
  - where: 'note 20:5 “The third and fourth generation, and the thousands”'
    claim: 'D&C 98:46 uses the same words'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/98?lang=eng'
    quote: 'And upon his children, and upon his children’s children of all them that hate me, unto the third and fourth generation.'
  - where: 'note 20:5 “The third and fourth generation, and the thousands”'
    claim: '“Thousands” read as the thousandth generation, with Deuteronomy 7:9'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/20.htm'
    quote: 'On the other hand He shows mercy to the thousandths, i.e., to the thousandth generation (cf. Deuteronomy 7:9'
  - where: 'note 20:5 “The third and fourth generation, and the thousands”'
    claim: 'Grace reaches further than wrath'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/20.htm'
    quote: 'except that love in the form of grace reaches much further than wrath.'

  - where: 'note 20:8 “The Sabbath commandment and its two reasons”'
    claim: 'What the word sabbath means'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/20?lang=eng'
    quote: 'HEB stopping, cessation, rest (from labor).'
  - where: 'note 20:8 “The Sabbath commandment and its two reasons”'
    claim: 'Deuteronomy names the servants’ rest as a purpose'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/5?lang=eng'
    quote: 'that thy manservant and thy maidservant may rest as well as thou.'
  - where: 'note 20:8 “The Sabbath commandment and its two reasons”'
    claim: 'The Sabbath was kept before the law, as in the narrative of the manna'
    key: bd-sabbath
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sabbath?lang=eng'
    quote: 'The Sabbath was a holy day before the giving of the law, even from the earliest times'
  - where: 'note 20:8 “The Sabbath commandment and its two reasons”'
    claim: 'In course of time many regulations grew up and were kept by the Pharisees'
    key: bd-sabbath
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sabbath?lang=eng'
    quote: 'In course of time many regulations grew up and were observed by the Pharisees.'
  - where: 'note 20:8 “The Sabbath commandment and its two reasons”'
    claim: 'After the Ascension the Church kept the first day of the week'
    key: bd-sabbath
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sabbath?lang=eng'
    quote: 'After the Ascension of Christ, the members of the Church, whether Jews or Gentiles, kept holy the first day of the week (the Lord’s day) as a weekly commemoration of our Lord’s Resurrection'
  - where: 'note 20:8 “The Sabbath commandment and its two reasons”'
    claim: 'D&C 59 confirms the Sabbath for the latter days'
    key: bd-sabbath
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sabbath?lang=eng'
    quote: 'Latter-day revelation confirms the significance of the Sabbath (or Lord’s day) in D&C 59.'

  - where: 'note 20:12 “The commandment with a promise”'
    claim: 'The promise is about remaining in the promised land, not only long life'
    key: ot-minute-ex-18
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-18-20'
    quote: 'This does not necessarily refer to just a long life but infers that the honoring of parents would allow the children of Israel to remain in their promised land for a long time.'
  - where: 'note 20:12 “The commandment with a promise”'
    claim: 'Paul calls it the first commandment with promise'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/eph/6?lang=eng'
    quote: 'Honour thy father and mother; (which is the first commandment with promise;)'
  - where: 'note 20:12 “The commandment with a promise”'
    claim: 'Matthew 15:4–6 is the Savior’s interpretation of the fifth commandment'
    key: bd-commandments-ten
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/commandments-the-ten?lang=eng'
    quote: 'see also Mark 2:27 and Matt. 15:4–6 for interpretation of fourth and fifth'

  - where: 'note 20:13 “From the act to the heart”'
    claim: 'The Church’s footnote: the Hebrew is murder'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/20?lang=eng'
    quote: 'HEB murder.'
  - where: 'note 20:13 “From the act to the heart”'
    claim: 'BDB defines the verb murder, slay'
    key: bdb
    url: 'https://biblehub.com/hebrew/7523.htm'
    quote: 'verb murder, slay'
  - where: 'note 20:13 “From the act to the heart”'
    claim: 'BDB lists Exodus 20:13 under murder, slay, with premeditation'
    key: bdb
    url: 'https://biblehub.com/hebrew/7523.htm'
    quote: 'murder, slay, with premeditation, Exodus 20:13 (E) = Deuteronomy 5:17'
  - where: 'note 20:13 “From the act to the heart”'
    claim: 'Christ expands the second table in the Sermon on the Mount, forbidding lust and anger'
    key: eom-ten-commandments
    url: 'https://eom.byu.edu/index.php/Ten_Commandments'
    quote: 'He warns of attitudes that lead to misdeeds, forbidding not only adultery, but lust, not only killing, but anger.'
  - where: 'note 20:13 “From the act to the heart”'
    claim: 'The commandments are meant to govern thoughts and desires as well as acts'
    key: bd-commandments-ten
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/commandments-the-ten?lang=eng'
    quote: 'where it is shown that they are intended to control our thoughts and desires as well as our acts.'
  - where: 'note 20:13 “From the act to the heart”'
    claim: 'D&C 59:6 restates the commandments with “anything like unto it”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/59?lang=eng'
    quote: 'Thou shalt not steal; neither commit adultery, nor kill, nor do anything like unto it.'

  - where: 'note 20:17 “A commandment about desire”'
    claim: 'The verb means desire, take pleasure in'
    key: bdb
    url: 'https://biblehub.com/hebrew/2530.htm'
    quote: 'verb desire, take pleasure in'
  - where: 'note 20:17 “A commandment about desire”'
    claim: 'Its use in Exodus 20:17 is of selfish desire'
    key: bdb
    url: 'https://biblehub.com/hebrew/2530.htm'
    quote: 'in bad sense of inordinate, ungoverned, selfish desire, followed by accusative Exodus 20:17'
  - where: 'note 20:17 “A commandment about desire”'
    claim: 'The verb is also used in a good sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/2530.htm'
    quote: 'less often in good sense'
  - where: 'note 20:17 “A commandment about desire”'
    claim: 'The Church’s footnote on “covet”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/20?lang=eng'
    quote: 'HEB desire, take pleasure in.'
  - where: 'note 20:17 “A commandment about desire”'
    claim: 'Paul equated coveting with idolatry'
    key: ot-manual-ex-20
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-20-the-ten-commandments?lang=eng'
