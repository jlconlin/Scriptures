    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-20-the-ten-commandments?lang=eng'
    quote: 'then material things become as a god to that person'
  - where: 'note 20:17 “A commandment about desire”'
    claim: 'One who covets may have other gods before him'
    key: ot-manual-ex-20
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-20-the-ten-commandments?lang=eng'
    quote: 'may have ‘other gods before him,’'

  - where: 'note 20:19 “The people ask for someone to stand between”'
    claim: 'The Church’s footnote joins this verse to Deuteronomy 5, Deuteronomy 18:16, Hebrews 12 and D&C 84'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/20?lang=eng'
    quote: 'Deut. 5:25; 18:16; Heb. 12:19; D&C 84:22 (21–26); Moses 1:11 (11, 14).'
  - where: 'note 20:19 “The people ask for someone to stand between”'
    claim: 'D&C 84:24: they hardened their hearts and could not endure His presence'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'But they hardened their hearts and could not endure his presence'
  - where: 'note 20:19 “The people ask for someone to stand between”'
    claim: 'Joseph Smith on the Israelites’ prayer and the carnal law (discourse of 27 Aug. 1843)'
    key: jsp-history-e1-1708
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-e-1-1-july-1843-30-april-1844/80'
    quote: 'When God offers a blessing or knowledge to a man, and he refuses to receive it, he will be damned. The Israelites prayed that God would speak to Moses, and not to them; in consequence of which he cursed them with a carnal law.'
  - where: 'note 20:19 “The people ask for someone to stand between”'
    claim: 'The scene shows a community removing itself from God’s presence'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'presents one that is actively engaged in removing itself from God’s presence.'
  - where: 'note 20:19 “The people ask for someone to stand between”'
    claim: 'Psalm 95’s “provocation” appears to allude to the scene in Exodus 20'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'Yet the term appears to also allude directly to the Sinai variant in Exodus 20'
  - where: 'note 20:19 “The people ask for someone to stand between”'
    claim: 'The people would not exercise the faith to overcome their fear'
    key: thomas-provocation
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/provocation-wilderness-rejection-grace'
    quote: 'the Israelites refused to exercise sufficient faith to overcome their fear and enter into the fire, smoke, and earthquake that lay between them and the face of God.'
  - where: 'note 20:19 “The people ask for someone to stand between”'
    claim: 'The request was not a wholesale rejection of the covenant'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'This does not, however, amount to a wholesale rejection of the covenant. Rather, the children of Israel place the burden and privilege of personally experiencing God on Moses.'

