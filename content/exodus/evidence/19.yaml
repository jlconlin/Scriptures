chapter: 19
claims:
  # ---------- setting / thread ----------
  - where: 'setting'
    claim: 'Rephidim, the camp before Sinai, is where the people had no water and drank from the rock'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/17?lang=eng'
    quote: 'and pitched in Rephidim: and there was no water for the people to drink.'
  - where: 'setting'
    claim: 'The camp at Sinai fulfils the sign given at the burning bush'
    key: ot-minute-ex-18
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-18-20'
    quote: 'It was the fulfillment of the Lord’s promise to Moses at the burning bush'
  - where: 'setting'
    claim: 'Israel stays about eleven months; the rest of Exodus, Leviticus and Numbers 1–10 are set at Sinai'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'They would stay there for the next eleven months—a period of unprecedented revelation recorded in the rest of the book of Exodus, all of Leviticus, and the first third of Numbers (1:1–10:10).'
  - where: 'setting'
    claim: 'Israel leaves the wilderness of Sinai on the twentieth day of the second month of the second year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/10?lang=eng'
    quote: 'And it came to pass on the twentieth day of the second month, in the second year, that the cloud was taken up from off the tabernacle of the testimony.'
  - where: 'setting'
    claim: 'Moses retells the day at Horeb in Deuteronomy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/4?lang=eng'
    quote: 'Specially the day that thou stoodest before the Lord thy God in Horeb, when the Lord said unto me, Gather me the people together, and I will make them hear my words'
  - where: 'thread'
    claim: 'Moses makes three ascents in the chapter; the instructions for the theophany come on the second'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'In sum, Moses’s second trip up Mount Sinai entailed receiving instructions from the Lord on preparing the people to enter his divine presence.'
  - where: 'thread'
    claim: 'The end of chapter 19 is Moses’s third ascent'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'the implied setting being the same as the end of chapter 19—namely, Moses’s third ascent'
  - where: 'thread'
    claim: 'The promise rests on the reminder of what God has already done'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'the children of Israel can trust that their acceptance of the terms will result in them being a “peculiar treasure” because they already know what God has done for them in the past'
  - where: 'thread'
    claim: 'The people are ready to ascend and only Moses is called; the study calls this a paradox, and reads chapter 20 as the answer'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'Yet the narrative now presents a paradox; though the Israelites are at the “nether part of the mount” and ready to ascend, according to Exodus 19:20, only Moses is called up the mountain'

  # ---------- sections ----------
  - where: 'section 2 plain'
    claim: '“Peculiar treasure” rendered “my own treasure”: peculiar means one’s very own'
    key: bd-peculiar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/peculiar?lang=eng'
    quote: 'One’s very own, exclusive, or special; not used in the Bible as odd or eccentric.'
  - where: 'section 4 plain'
    claim: '“Nether part of” the mount is the foot of it (verse 17), as the Church’s footnote gives'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/19?lang=eng'
    quote: '17b “nether part of”: OR foot of.'

  # ---------- note 19:1 ----------
  - where: 'note 19:1 “Where Sinai was, and the day Israel arrived”'
    claim: 'The site of Sinai is disputed; the Bible Dictionary thinks the southern peninsula probable'
    key: bd-sinai
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sinai?lang=eng'
    quote: 'Its site has been much disputed, and some scholars maintain that it was in the country of Edom. It probably was in the southern part of the peninsula between the gulfs of Suez and Aqabah and is to be identified with one of the peaks of Jebel Musa.'
  - where: 'note 19:1 “Where Sinai was, and the day Israel arrived”'
    claim: 'Scripture Helps captions its photograph “a traditional site”'
    key: scripture-helps-ex-19
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/15-exodus-19-20-24-31-34?lang=eng'
    quote: 'A traditional site of Mount Sinai in Egypt'
  - where: 'note 19:1 “Where Sinai was, and the day Israel arrived”'
    claim: 'The sign given at the bush named this mountain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/3?lang=eng'
    quote: 'When thou hast brought forth the people out of Egypt, ye shall serve God upon this mountain.'
  - where: 'note 19:1 “Where Sinai was, and the day Israel arrived”'
    claim: 'One older reading: the verse gives the month only, so the day of arrival is uncertain'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/19.htm'
    quote: 'the month only is given, and not the day of the month, and it is altogether uncertain whether the arrival in the desert of Sinai took place on one of the first, one of the middle, or one of the last days of the month'
  - where: 'note 19:1 “Where Sinai was, and the day Israel arrived”'
    claim: 'One older reading: the Jewish tradition that puts the giving of the law on the fiftieth day after Passover is too late to be historical'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/19.htm'
    quote: 'The Jewish tradition, which assigns the giving of the law to the fiftieth day after the Passover, is of far too recent a date to pass for historical'
  - where: 'note 19:1 “Where Sinai was, and the day Israel arrived”'
    claim: 'Pentecost, the fiftieth day after Passover, celebrated the giving of the law at Sinai'
    key: sc-knowhy-90
    url: 'https://scripturecentral.org/knowhy/did-abinadi-prophesy-during-pentecost'
    quote: 'Pentecost was a pilgrimage festival that took place in the spring, the fiftieth day after Passover, which celebrated the giving of the Law to Moses on Mount Sinai (see Exodus 34:22; Deuteronomy 16:10).'

  # ---------- note 19:4 ----------
  - where: 'note 19:4 “What the eagle pictures”'
    claim: 'The image may suggest swiftness and power, or the nurturing, protective wings'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'may suggest the swiftness and power by which the children of Israel had been brought to this point, but some suggested that the imagery is not so much one of the power of an eagle but the nurturing nature of such, the terminology reflecting the image of the eagles’ protective wings.'
  - where: 'note 19:4 “What the eagle pictures”'
    claim: 'Moses’s song uses the eagle for the LORD’s care of Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/32?lang=eng'
    quote: 'As an eagle stirreth up her nest, fluttereth over her young, spreadeth abroad her wings, taketh them, beareth them on her wings: So the Lord alone did lead him'
  - where: 'note 19:4 “What the eagle pictures”'
    claim: 'The Old Testament Minute sets Deuteronomy 32:11 beside this verse'
    key: ot-minute-ex-18
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-18-20'
    quote: 'We see this imagery again in Deuteronomy 32:11 in reference to Moses'
  - where: 'note 19:4 “What the eagle pictures”'
    claim: 'A Latter-day Saint study reads the image as a mother eagle’s tender, protective care'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'If they falter, she will swoop down and bear them up on her own powerful wings. [20] The imagery is of tender, protective care that is ever present.'
  - where: 'note 19:4 “What the eagle pictures”'
    claim: 'Either way the point is God’s own part in bringing Israel to Himself'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'the point of the reminder is to note how God was explicitly involved in their coming to him. What is emphasized are the Israelites’ relationship with God himself and, more importantly, God’s own desire to bring them to him.'

  # ---------- note 19:5 peculiar ----------
  - where: 'note 19:5 “Peculiar means His own”'
    claim: 'Peculiar means one’s very own, not odd'
    key: bd-peculiar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/peculiar?lang=eng'
    quote: 'One’s very own, exclusive, or special; not used in the Bible as odd or eccentric. The Hebrew word segullah, which is translated “peculiar” in Deut. 14:2 and 26:18, is translated “special” in Deut. 7:6.'
  - where: 'note 19:5 “Peculiar means His own”'
    claim: 'The English comes from Latin peculium, private property'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'The English phrase “peculiar treasure” derives from the Latin peculium, meaning “private property”[3] and is translated from the Hebrew word seḡǔllâ, meaning “private, acquired treasure.”'
  - where: 'note 19:5 “Peculiar means His own”'
    claim: 'The Hebrew noun is “valued property, peculiar treasure,” used of Israel first at Exodus 19:5'
    key: bdb
    url: 'https://biblehub.com/hebrew/5459.htm'
    quote: '1 valued property, peculiar treasure, which ׳י has chosen (בחר) and taken to himself; always of people of Israel, first Exodus 19:5'
  - where: 'note 19:5 “Peculiar means His own”'
    claim: 'The word is a king’s personal treasure set apart within all he owns (as the study prints it from another author)'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'where the king was the theoretical owner of everything. Within this total ownership, he might gather and put to one side things that he specially prized and considered to be his own in a unique way.'
  - where: 'note 19:5 “Peculiar means His own”'
    claim: 'Moses repeats the word in Deuteronomy 7:6, where it is “special”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/7?lang=eng'
    quote: 'the Lord thy God hath chosen thee to be a special people unto himself, above all people that are upon the face of the earth.'
  - where: 'note 19:5 “Peculiar means His own”'
    claim: 'Peter applies “a peculiar people” to believers'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-pet/2?lang=eng'
    quote: 'But ye are a chosen generation, a royal priesthood, an holy nation, a peculiar people'

  # ---------- note 19:5 covenant ----------
  - where: 'note 19:5 “Which covenant, and the condition on it”'
    claim: 'Israel was brought to Sinai on the basis of the Abrahamic covenant'
    key: hopkin-covenant
    url: 'https://rsc.byu.edu/creation-sinai/covenant-among-covenants'
    quote: 'Simply put, the Israelites were brought out of Egypt and toward Sinai on the basis of the Abrahamic covenant, not on the basis of the Mosaic covenant that would be instituted there.'
  - where: 'note 19:5 “Which covenant, and the condition on it”'
    claim: 'The Mosaic covenant was initiated because of the Abrahamic'
    key: hopkin-covenant
    url: 'https://rsc.byu.edu/creation-sinai/covenant-among-covenants'
    quote: 'it is because of the Abrahamic covenant that the Lord chose to initiate the Mosaic covenant with the Israelites, and it is the Abrahamic covenant that defines the boundaries of the Mosaic covenant'
  - where: 'note 19:5 “Which covenant, and the condition on it”'
    claim: 'The Sinai covenant’s blessings are conditioned on obedience'
    key: hopkin-covenant
    url: 'https://rsc.byu.edu/creation-sinai/covenant-among-covenants'
    quote: 'These guarantees and blessings, however, were conditioned on the Israelites’ continued obedience to the terms of the covenant.'
  - where: 'note 19:5 “Which covenant, and the condition on it”'
    claim: 'This is the first covenant made with Israel as a whole people'
    key: shannon-kingdom-priests
    url: 'https://mi.byu.edu/old-testament-reflections/gods-trustworthiness-and-becoming-a-kingdom-of-priests'
    quote: 'In the book of Exodus, we find a record of the first covenant that God made with Israel as a whole people.'
  - where: 'note 19:5 “Which covenant, and the condition on it”'
    claim: 'Moses says the LORD brought Israel out to keep the oath sworn to the fathers'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/7?lang=eng'
    quote: 'But because the Lord loved you, and because he would keep the oath which he had sworn unto your fathers, hath the Lord brought you out with a mighty hand'

  # ---------- note 19:6 ----------
  - where: 'note 19:6 “Kingdom of priests, royal priesthood, kings and priests”'
    claim: 'The phrase is unique in the Hebrew Bible and hard to translate exactly'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'a kingdom of priests (or mamleket kohanîm) is unique to the Hebrew Bible, and, while the roots of each term is clear, an exact translation of the terms together is more difficult.'
  - where: 'note 19:6 “Kingdom of priests, royal priesthood, kings and priests”'
    claim: 'The first noun may be adjectival, “royal priesthood,” as the Septuagint took it; some early Jewish texts read “kings and priests”'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'In this case, the translation would be “royal priesthood.” This is the manner in which the Septuagint understood the clause.[6] Finally, some early Jewish texts suggest that the two terms represented independent nouns, thus providing a reading of “kings and priests.”'
  - where: 'note 19:6 “Kingdom of priests, royal priesthood, kings and priests”'
    claim: 'The Septuagint reads “a royal priesthood”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/exodus/19.htm'
    quote: '6And ye shall be to me a royal priesthood and a holy nation: these words shalt thou speak to the children of Israel.'
  - where: 'note 19:6 “Kingdom of priests, royal priesthood, kings and priests”'
    claim: 'Peter’s wording reflects the Septuagint’s reading'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'The adjectival reading by the Septuagint of Exodus 19:6 is reflected in 1 Peter 2:9: “But ye are a chosen generation, a royal priesthood, an holy nation, a peculiar people.”'
  - where: 'note 19:6 “Kingdom of priests, royal priesthood, kings and priests”'
    claim: 'John writes “kings and priests unto God”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/1?lang=eng'
    quote: 'And hath made us kings and priests unto God and his Father; to him be glory and dominion for ever and ever. Amen.'
  - where: 'note 19:6 “Kingdom of priests, royal priesthood, kings and priests”'
    claim: 'A priest’s prerogative is nearness to God, and the offer extends it to all Israel'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'The great prerogative of priests is that they enjoy a privileged relationship with God. They can enter into sacred space and approach God in a way others cannot. They alone are exclusively dedicated to God and to his service. God is inviting all of Israel to be priests'
  - where: 'note 19:6 “Kingdom of priests, royal priesthood, kings and priests”'
    claim: 'In the end only the Levites held priesthood'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'In fact, in practical terms, only one-twelfth of the tribes of Israel held any priesthood at all—the Levites.'

  # ---------- note 19:8 ----------
  - where: 'note 19:8 “Yes before the terms”'
    claim: 'The people commit themselves before any commandment is given, which the reflection reads as faith'
    key: shannon-kingdom-priests
    url: 'https://mi.byu.edu/old-testament-reflections/gods-trustworthiness-and-becoming-a-kingdom-of-priests'
    quote: 'Even before Jehovah gives Israel a single commandment, the Israelites affirm, “All that the Lord has spoken we will do” (Exodus 19:8).'
  - where: 'note 19:8 “Yes before the terms”'
    claim: 'The reflection calls it an act of faith and trust before the terms are known'
    key: shannon-kingdom-priests
    url: 'https://mi.byu.edu/old-testament-reflections/gods-trustworthiness-and-becoming-a-kingdom-of-priests'
    quote: 'This is an act of tremendous faith on the part of the Israelites, as they choose to put their trust in a covenant relationship with Jehovah even before they know what the parameters of that bond are going to look like.'
  - where: 'note 19:8 “Yes before the terms”'
    claim: 'Acceptance was a twofold process: verbal assent, then a ratifying act'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'The acceptance would be a twofold process: first, the Israelites had to verbally accept the terms, and, second, some recognized physical act by which both parties demonstrated that the new relationship was now in force must be enacted.'
  - where: 'note 19:8 “Yes before the terms”'
    claim: 'The ratifying event was to be the manifestation of God Himself'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'As the instructions suggest, the ratifying event appears to be a visual manifestation of God himself'
  - where: 'note 19:8 “Yes before the terms”'
    claim: 'The people give the same answer again in Exodus 24'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/24?lang=eng'
    quote: 'and all the people answered with one voice, and said, All the words which the Lord hath said will we do.'
  - where: 'note 19:8 “Yes before the terms”'
    claim: 'The ceremony of Exodus 24 ratifies and seals the covenant, with a second assent'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'In Exodus 24, the people participate in a ceremony to ratify and seal the covenant. They once again verbally assent in unison to the covenant.'

  # ---------- note 19:10 ----------
  - where: 'note 19:10 “What the people were being prepared for”'
    claim: '“In the sight of” is literally “before/to the eyes of” all the people'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: '(literally, “YHWH will descend before/to the eyes of all the people”; Exodus 19:10–11)'
  - where: 'note 19:10 “What the people were being prepared for”'
    claim: 'Moses sought to sanctify the people that they might behold the face of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'Now this Moses plainly taught to the children of Israel in the wilderness, and sought diligently to sanctify his people that they might behold the face of God;'
  - where: 'note 19:10 “What the people were being prepared for”'
    claim: 'Joseph Smith: Moses sought to bring Israel into the presence of God but could not'
    key: jsp-history-c1-addenda-12
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-c-1-2-november-1838-31-july-1842/547'
    quote: 'Moses sought to bring the children of Israel into the presence of God. through the power of the Priesthood but he could not'
  - where: 'note 19:10 “What the people were being prepared for”'
    claim: 'The study cites this sentence of Joseph Smith as describing Exodus 19 and 32–34'
    key: hopkin-covenant
    url: 'https://rsc.byu.edu/creation-sinai/covenant-among-covenants'
    quote: 'As stated by Joseph, further describing events in Exodus 19 and Exodus 32–34, “Moses sought to bring the children of Israel into the presence of God, through the power of the Priesthood, but he could not.”'
  - where: 'note 19:10 “What the people were being prepared for”'
    claim: 'At the foot of Sinai the Lord tried to sanctify the people and bring them up the mountain into His presence'
    key: thomas-provocation
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/provocation-wilderness-rejection-grace'
    quote: 'First, at the foot of Sinai, where the Lord tried to sanctify His people and to cause them to come up the mountain, enter His presence, and behold His face'

  # ---------- note 19:12 ----------
  - where: 'note 19:12 “A fenced mountain”'
    claim: 'The boundary taught the people not to treat sacred space casually'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'were not to treat sacred space casually (but were to show extreme reverence for it, upon penalty of death)'
  - where: 'note 19:12 “A fenced mountain”'
    claim: 'Later only Moses comes near, a company worships afar off, and the people do not go up'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/24?lang=eng'
    quote: 'And Moses alone shall come near the Lord: but they shall not come nigh; neither shall the people go up with him.'
  - where: 'note 19:12 “A fenced mountain”'
    claim: 'The tabernacle functions as a portable Sinai, sharing its three districts of holiness'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'In the following ways the narrative brings out the tabernacle’s function as a portable Sinai:54'
  - where: 'note 19:12 “A fenced mountain”'
    claim: 'The first shared feature listed is three districts of holiness'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'the three districts of holiness common to each;'
  - where: 'note 19:12 “A fenced mountain”'
    claim: 'The comparison the study prints: fence and court, the limited group and the priests, Moses and the high priest'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'The fence around the mountain, with an altar at the foot of the mountain, would correspond to the court of the sanctuary with its altar of burnt offering; the limited group of people who could go up to a certain point on the mountain would correspond to the priests of the sanctuary'
  - where: 'note 19:12 “A fenced mountain”'
    claim: 'One older reading: the offender was not to be followed past the boundary but killed from a distance'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/19.htm'
    quote: '"No hand shall touch him" (the individual who passed the barrier and touched the mountain), i.e., no one was to follow him within the appointed boundaries, but he was to be killed from a distance either by stones or darts.'
  - where: 'note 19:12 “A fenced mountain”'
    claim: 'One older reading: the prohibition was to make the people conscious of their unholiness and God’s holiness'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/19.htm'
    quote: 'were intended to awaken in the people a consciousness of their own unholiness quite as much as of the unapproachable holiness of Jehovah'

  # ---------- note 19:13 Hebrews ----------
  - where: 'note 19:13 “The mount that might be touched, and mount Sion”'
    claim: 'Hebrews recalls the mount that might be touched and the rule about the beast'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/12?lang=eng'
    quote: '(For they could not endure that which was commanded, And if so much as a beast touch the mountain, it shall be stoned, or thrust through with a dart:'
  - where: 'note 19:13 “The mount that might be touched, and mount Sion”'
    claim: 'Hebrews sets mount Sion and Jesus the mediator of the new covenant against Sinai'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/12?lang=eng'
    quote: 'And to Jesus the mediator of the new covenant, and to the blood of sprinkling, that speaketh better things than that of Abel.'
  - where: 'note 19:13 “The mount that might be touched, and mount Sion”'
    claim: 'The study reads Hebrews as taking the Sinai scene for Israel’s refusal of the invitation into God’s presence'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'this later Christian interpretation of the narrative appears to have assumed that the events of Exodus 20 described the Israelites’ refusal of God’s invitation to enter into his presence and engage with the divine community'
  - where: 'note 19:13 “The mount that might be touched, and mount Sion”'
    claim: 'The passage ends with the warning not to refuse him that speaketh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/12?lang=eng'
    quote: 'See that ye refuse not him that speaketh. For if they escaped not who refused him that spake on earth, much more shall not we escape'

  # ---------- note 19:13 come up ----------
  - where: 'note 19:13 “Told to come up, then kept back”'
    claim: 'The “trumpet” of verse 13 is a ram’s horn'
    key: bdb
    url: 'https://biblehub.com/hebrew/3104.htm'
    quote: 'ram, ram''s horn, cornet'
  - where: 'note 19:13 “Told to come up, then kept back”'
