  # ---------- note 19:14 ----------
  - where: 'note 19:14 “Washing and abstaining before meeting God”'
    claim: 'The people, like Moses at the bush, make gestures of approach'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'they—like Moses, who was required to remove his shoes in the first theophany—must participate in gestures of approach'
  - where: 'note 19:14 “Washing and abstaining before meeting God”'
    claim: 'Washing clothes represents removing impurity; abstinence is for three days'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'This time, the Lord requires the people to wash their clothes and to abstain from sexual relations for three days. The washing of clothes clearly represents the removal of impurities and contaminations.'
  - where: 'note 19:14 “Washing and abstaining before meeting God”'
    claim: 'One reason suggested: other religions used sexual rites; Israel’s God separated sex and worship'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'One reason is that many ancient religions used sexual rites as a way of entreating the gods to bless their lands with fertility. [26] The God of Israel unequivocally separated sex and worship.'
  - where: 'note 19:14 “Washing and abstaining before meeting God”'
    claim: 'Another reason suggested: bodily emissions made one ceremonially unclean for a time'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'Another reason is that the emission of bodily fluids was believed to make one temporarily less than whole and thus ceremonially unclean.'
  - where: 'note 19:14 “Washing and abstaining before meeting God”'
    claim: 'The study notes that 3 Nephi 27:19 speaks of a cosmic event, not of Sinai'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'The context is of a cosmic event rather than the event of entering God’s presence at Sinai'
  - where: 'note 19:14 “Washing and abstaining before meeting God”'
    claim: 'Temporary celibacy for worshippers was common in the ancient world'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'It must also be remembered that temporary celibacy for worshippers was common in the ancient world.'
  - where: 'note 19:14 “Washing and abstaining before meeting God”'
    claim: 'The abstinence does not imply that sex was sinful (as the study prints it from another author)'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'This temporary continence does not imply that sex was sinful for Israelites and other ancient Near Easterners—any more than eating is sinful because people sometimes fast for religious reasons.'
  - where: 'note 19:14 “Washing and abstaining before meeting God”'
    claim: 'The Church’s footnote gives the Hebrew of verse 15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/19?lang=eng'
    quote: '15a “come”: HEB do not go near any woman; i.e., with lust.'
  - where: 'note 19:14 “Washing and abstaining before meeting God”'
    claim: 'The risen Christ speaks of garments washed in His blood as the condition of entering God’s rest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/27?lang=eng'
    quote: 'therefore nothing entereth into his rest save it be those who have washed their garments in my blood'
  - where: 'note 19:14 “Washing and abstaining before meeting God”'
    claim: 'The study calls that requirement similar to the washing at Sinai'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'is similar to the original Sinaitic instruction to wash one’s clothes in preparation for the theophany that would take place three days later'

  # ---------- note 19:16 ----------
  - where: 'note 19:16 “The horn no one is said to blow”'
    claim: 'No one is said to blow the horn; it is not Moses or an Israelite'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'Moreover, there is no mention as to who is blowing the horn. [31] It is not Moses or any Israelite'
  - where: 'note 19:16 “The horn no one is said to blow”'
    claim: 'The source of the trumpet is not made clear'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'The source of the trumpet, whether human or heavenly, is not made clear.'
  - where: 'note 19:16 “The horn no one is said to blow”'
    claim: 'The shofar is a curved horn, as of a cow or ram'
    key: bdb
    url: 'https://biblehub.com/hebrew/7782.htm'
    quote: 'in any case the ׳שׁ is a curved horn, as of cow or ram'
  - where: 'note 19:16 “The horn no one is said to blow”'
    claim: 'Uses of the shofar in Israel: war and warning'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'to call to war (Numbers 10:9; Judges 3:27; 6:34; 1 Samuel 13:3), to warn of an approaching enemy (Hosea 5:8; Ezekiel 33:3)'
  - where: 'note 19:16 “The horn no one is said to blow”'
    claim: 'Uses of the shofar in Israel: coronation and praise'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'to celebrate the coronation of the king (1 Kings 1:34, 39), and to praise the Lord (Psalm 98:1–6)'
  - where: 'note 19:16 “The horn no one is said to blow”'
    claim: 'At Sinai the horn heralds the Lord’s presence, as the trump of God in 1 Thessalonians'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'This passage in 1 Thessalonians certainly fits well with the theophany described in Exodus 19, as does Psalm 98. The Lord’s presence was being heralded, and it should be praised.'
  - where: 'note 19:16 “The horn no one is said to blow”'
    claim: 'The Lord descends with the trump of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-thes/4?lang=eng'
    quote: 'For the Lord himself shall descend from heaven with a shout, with the voice of the archangel, and with the trump of God'

  # ---------- note 19:18 ----------
  - where: 'note 19:18 “Fire that shows and smoke that hides”'
    claim: 'Four elements attend the divine presence; the smoke that hides is the salient one'
    key: muhlestein-theophanies
    url: 'https://rsc.byu.edu/ascending-mountain-lord/darkness-light-lord-elements-israelite-theophanies'
    quote: 'In this account, there seem to be four elements associated with the divine presence: smoke, light, thunder, and quaking. [15] The smoke, which would hide the personage of God, seems to be the most salient point of the above passage.'
  - where: 'note 19:18 “Fire that shows and smoke that hides”'
    claim: 'The fire that reveals God causes the smoke that hides Him'
    key: muhlestein-theophanies
    url: 'https://rsc.byu.edu/ascending-mountain-lord/darkness-light-lord-elements-israelite-theophanies'
    quote: 'In fact, it seems to be the fire of the Lord’s presence that causes the smoke—as actual fire does—and in this way, the very light which reveals God also causes the element which hides him.'
  - where: 'note 19:18 “Fire that shows and smoke that hides”'
    claim: 'Moses recalls fire, darkness and a voice with no similitude'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/4?lang=eng'
    quote: 'And the Lord spake unto you out of the midst of the fire: ye heard the voice of the words, but saw no similitude; only ye heard a voice.'
  - where: 'note 19:18 “Fire that shows and smoke that hides”'
    claim: 'This is the only time the whole community hears God without an intermediary (as the study prints it from another author)'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: '“This is the only instance in the Old Testament where the gathered community is confronted with such a direct experience of God, hearing God speak without an intermediary. It is a unique divine appearance.”'

  # ---------- note 19:22 ----------
  - where: 'note 19:22 “Priests before Aaron”'
    claim: 'Aaron and his sons are called to the priest’s office later, in chapter 28'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/28?lang=eng'
    quote: 'And take thou unto thee Aaron thy brother, and his sons with him, from among the children of Israel, that he may minister unto me in the priest’s office'
  - where: 'note 19:22 “Priests before Aaron”'
    claim: 'One older reading: these were those who had served as priests by natural right and custom'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/19.htm'
    quote: 'The priests were neither "the sons of Aaron," i.e., Levitical priest, nor the first-born or principes populi, but "those who had hitherto discharged the duties of the priestly office according to natural right and custom" (Baumgarten).'

