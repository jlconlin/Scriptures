chapter: 1
claims:
  - where: 'setting'
    claim: 'Exodus continues the narrative of Genesis.'
    key: bd-exodus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/exodus-book-of?lang=eng'
    quote: 'A continuation of the narrative in Genesis, it consists of two principal divisions: (1) historical, Ex. 1–18; (2) legislative, Ex. 19–40.'
  - where: 'setting'
    claim: 'The Bible Dictionary describes the book as the history of a nation in three stages, the first being a nation enslaved.'
    key: bd-exodus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/exodus-book-of?lang=eng'
    quote: 'gives the early history of the nation in three clearly marked stages: first, a nation enslaved; then a nation redeemed; lastly, a nation set apart'
  - where: 'setting'
    claim: 'Latter-day revelation confirms Moses as the author of the Pentateuch, and scribes and copyists have left their traces on it.'
    key: bd-pentateuch
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pentateuch?lang=eng'
    quote: 'It is also evident that scribes and copyists have left their traces upon the Pentateuch as we have it today … But latter-day revelation confirms that Moses was the author of the first five books of the Bible'
  - where: 'setting'
    claim: 'Exodus 1:1 repeats the names of Genesis 46 (the Church’s footnote 1a points to Gen. 46:8).'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/1?lang=eng'
    quote: 'Gen. 46:8.'
  - where: 'thread'
    claim: 'The king’s measures come in a series (a first measure of forced labor, a second plan with the midwives, then open violence), and each served to increase Israel.'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/1.htm'
    quote: 'all the measures adopted by the cunning of Pharaoh to weaken and diminish the Israelites, instead of checking, served rather to promote their continuous increase.'
  - where: 'thread'
    claim: 'The command to the midwives is the second plan and the command to all the people the third, an act of open violence.'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/1.htm'
    quote: 'The failure of his second plan drove the king to acts of open violence. He issued commands to all his subjects to throw every Hebrew boy that was born into the river (i.e., the Nile).'
  - where: 'section 2 plain'
    claim: '“Treasure cities” are storage cities; “grieved because of” can be rendered “apprehensive of.”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/1?lang=eng'
    quote: 'HEB storage cities; i.e., granaries. … OR apprehensive of.'
  - where: 'section 3 plain'
    claim: '“Stools” are birth-stools, and the “houses” God made the midwives are households.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/1?lang=eng'
    quote: 'OR birth-stools. … OR households (descendants).'
  - where: 'section 3 plain'
    claim: '“Lively” means vigorous.'
    key: bdb
    url: 'https://biblehub.com/hebrew/2422.htm'
    quote: 'adjective having the vigour of life, lively'
  - where: 'note 1:7 “The promise begins to be kept”'
    claim: 'Verse 7 states Israel’s growth five times, to emphasize that the Lord was fulfilling His promise.'
    key: ot-minute-ex-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-1-6'
    quote: 'Verse 7 tells us that the children of Israel multiplied while in Egypt, stating it five times, in one way or another. … here it is used to emphasize that the Lord was fulfilling His promise to His people.'
  - where: 'note 1:7 “The promise begins to be kept”'
    claim: 'The Church’s footnote to “taskmasters” in verse 11 points back to Genesis 15:13–14.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/1?lang=eng'
    quote: 'Gen. 15:13 (13–14); Deut. 26:6.'
  - where: 'note 1:8 “Why the new king feared Israel”'
    claim: 'Joseph is often placed in the Hyksos period; the verse may mean either that the king who knew Joseph died or that the Hyksos dynasty ended, and the new Pharaoh distrusted all Semites.'
    key: sc-knowhy-844
    url: 'https://scripturecentral.org/knowhy/why-were-the-hebrews-allowed-to-settle-in-egypt'
    quote: 'This could literally mean that the Pharaoh who personally knew Joseph passed away, but it could also mean that the Pharaohs who knew Joseph, the Hyksos dynasty, came to an end when the Hyksos were expelled'
  - where: 'note 1:8 “Why the new king feared Israel”'
    claim: 'The Hyksos were Canaanites who took over the northern part of Egypt.'
    key: sc-knowhy-844
    url: 'https://scripturecentral.org/knowhy/why-were-the-hebrews-allowed-to-settle-in-egypt'
    quote: 'By 1650 B.C., there were so many of these Canaanites living in Egypt that they took over the northern part of that land, inaugurating a period known as the Hyksos Period'
  - where: 'note 1:8 “Why the new king feared Israel”'
    claim: '“Knew not Joseph” most likely means the king had no respect for Joseph.'
    key: muhlestein-israel-egypt
    url: 'https://rsc.byu.edu/creation-sinai/israel-egypt-canaan'
    quote: 'most likely does not mean that he had never heard of Joseph, but instead means that this pharaoh had no respect for Joseph or anything he did.'
  - where: 'note 1:8 “Why the new king feared Israel”'
    claim: 'Theban rulers threw off the Hyksos about 1550 B.C., detested foreign rule, and built forts on the northeastern border.'
    key: muhlestein-israel-egypt
    url: 'https://rsc.byu.edu/creation-sinai/israel-egypt-canaan'
    quote: 'The Egyptians absolutely detested having been dominated by foreigners and took steps toward never letting it happen again, including … building forts along Egypt’s northeastern border to protect it from foreign incursions from Canaan.'
  - where: 'note 1:8 “Why the new king feared Israel”'
    claim: 'Fear of another invasion explains the wish to keep Israel from aiding invaders (Ex. 1:10); however the Hyksos and Israel align, Israel was enslaved at the height of the New Kingdom; the Israelites lived near the frontier.'
    key: muhlestein-israel-egypt
    url: 'https://rsc.byu.edu/creation-sinai/israel-egypt-canaan'
    quote: 'Regardless of exactly how the Hyksos and the Israelites align historically, we can be sure that the Israelites were enslaved in Egypt during the height of Egypt’s power during the New Kingdom.'
  - where: 'note 1:8 “Why the new king feared Israel”'
    claim: 'Fear of another Hyksos invasion explains the enslavement as a way to keep Israel from aiding invaders.'
    key: muhlestein-israel-egypt
    url: 'https://rsc.byu.edu/creation-sinai/israel-egypt-canaan'
    quote: 'The fear of another Hyksos invasion and any known connection between the Israelites and the Hyksos would also explain why these new Egyptian kings wanted to enslave the Israelites in order to avoid their aiding any potential invaders (Exodus 1:10).'
  - where: 'note 1:8 “Why the new king feared Israel”'
    claim: 'The Israelites lived in the far northeast, near the frontier.'
    key: muhlestein-israel-egypt
    url: 'https://rsc.byu.edu/creation-sinai/israel-egypt-canaan'
    quote: 'Fortunately for the Israelites, they were far north and east, near the frontier.'
  - where: 'note 1:11 “When this was, and which Pharaoh”'
    claim: 'The text never names the Pharaoh; 1 Kings 6 with a temple date of about 966 B.C. gives 1446 B.C., but 480 is probably symbolic, twelve times forty.'
    key: sc-knowhy-847
    url: 'https://scripturecentral.org/knowhy/why-does-contextualizing-the-exodus-story-matter'
    quote: '966 plus 480 years is 1446 BC … However, 480 years is almost certainly supposed to be a symbolic number—the result of multiplying 12, a significant number in ancient Israel, with 40'
  - where: 'note 1:11 “When this was, and which Pharaoh”'
    claim: 'Merneptah’s stela gives the latest possible date; it writes Israel with the sign for a people, not a place.'
    key: sc-knowhy-847
    url: 'https://scripturecentral.org/knowhy/why-does-contextualizing-the-exodus-story-matter'
    quote: 'The latest possible date for the Exodus can be established, because a pharaoh named Merneptah erected a stela with an inscription in which he claimed to have eliminated the Israelites.'
  - where: 'note 1:11 “When this was, and which Pharaoh”'
    claim: 'Merneptah was the son of Ramesses II; his inscription is the first mention of Israel outside the Bible and places battle with Israel in Canaan, so the conquest was before 1200 B.C.; the date of the Exodus cannot be known with certainty.'
    key: muhlestein-israel-egypt
    url: 'https://rsc.byu.edu/creation-sinai/israel-egypt-canaan'
    quote: 'We can be sure that it had at least happened by the reign of Merneptah, the son of Ramses the Great, because Merneptah, in the first extrabiblical attestation of Israel, mentions battle with Israelites in the land of Canaan early in his reign. Thus the conquest should have happened before 1200 BC'
  - where: 'note 1:11 “When this was, and which Pharaoh”'
    claim: 'The stela marks Israel with the glyph for a group of people, not a geographic location.'
    key: muhlestein-israel-egypt
    url: 'https://rsc.byu.edu/creation-sinai/israel-egypt-canaan'
    quote: 'The word Israel is followed not by the glyph that indicates a geographic location but by a glyph that indicates a group of people.'
  - where: 'note 1:11 “When this was, and which Pharaoh”'
    claim: 'The city named in verse 11 points to Ramesses II, who built Pi-Ramesses.'
    key: sc-knowhy-847
    url: 'https://scripturecentral.org/knowhy/why-does-contextualizing-the-exodus-story-matter'
    quote: 'It states that the Israelites worked on building a city called Ramesses. This detail only makes sense during the reign of Ramesses II who built a capital city called Pi-Ramesses.'
  - where: 'note 1:11 “When this was, and which Pharaoh”'
    claim: 'Ramesses II may well have been the Pharaoh of the Exodus, though it is hard to be sure.'
    key: sc-knowhy-847
    url: 'https://scripturecentral.org/knowhy/why-does-contextualizing-the-exodus-story-matter'
    quote: 'Although it is difficult to be completely sure, this evidence suggests Ramesses II may well have been the pharaoh of the Exodus.'
  - where: 'note 1:11 “When this was, and which Pharaoh”'
    claim: 'Pithom and Raamses are most likely two neighboring sites; 1250 B.C. is a round and speculative date.'
    key: muhlestein-israel-egypt
    url: 'https://rsc.byu.edu/creation-sinai/israel-egypt-canaan'
    quote: 'These cities are, respectively, most likely modern tell el-Retabeh, which is near Wadi Tumilat, and nearby Qantir, which is adjacent to Avaris. … If we operate under this assumption, a nice, round date for the Exodus would be 1250 BC. We must keep in mind that this date is speculative'
  - where: 'note 1:11 “When this was, and which Pharaoh”'
    claim: 'The Bible Dictionary names Seti I and Ramses II as the Pharaohs of the oppression.'
    key: bd-pharaoh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pharaoh?lang=eng'
    quote: 'The Pharaohs of oppression, Seti Ⅰ and Ramses Ⅱ, belonging to the 19th dynasty (Ex. 1; 2)'
  - where: 'note 1:11 “When this was, and which Pharaoh”'
    claim: 'Knowing when the two cities were built, the most likely setting is the early Ramesside era under Seti I and Rameses II.'
    key: muhlestein-israel-egypt
    url: 'https://rsc.byu.edu/creation-sinai/israel-egypt-canaan'
    quote: 'Knowing when these cities were built allows us to postulate that the most likely setting for the story of Moses is in the early Ramesside era, under the kings Seti I and Rameses II'
  - where: 'note 1:11 “When this was, and which Pharaoh”'
    claim: 'The Bible Dictionary reports Merneptah as the Pharaoh generally believed to be that of the Exodus, and says this has been doubted.'
    key: bd-pharaoh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pharaoh?lang=eng'
    quote: 'it is generally believed that the Pharaoh of the Exodus was Mer-ne-ptah, but the discovery of the Tell el-Amarna tablets has thrown doubt on this.'
  - where: 'note 1:11 “When this was, and which Pharaoh”'
    claim: '“Treasure cities” are in Hebrew storage cities, granaries.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/1?lang=eng'
    quote: 'HEB storage cities; i.e., granaries.'
  - where: 'note 1:14 “Why brick”'
    claim: 'The delta had little stone, so building was in mud brick; Egyptian records attest forced brick-making by Semites and others, and tomb scenes show taskmasters and quotas.'
    key: muhlestein-israel-egypt
    url: 'https://rsc.byu.edu/creation-sinai/israel-egypt-canaan'
    quote: 'a place with little stone, dictating that almost all building was done with mud bricks. Egyptian records bear witness to the forced mining and brick-making activities of various groups in Egypt, including other Semites. Scenes from Egyptian tombs record that taskmasters insured that those they oversaw made their quota of bricks, which were made using straw, mud, and the sun.'
  - where: 'note 1:14 “Why brick”'
    claim: 'Mud-brick structures do not last, and remains of Israelite settlements cannot be expected in the wet delta.'
    key: muhlestein-israel-egypt
    url: 'https://rsc.byu.edu/creation-sinai/israel-egypt-canaan'
    quote: 'mud-brick structures do not last the way stone structures do, and we cannot hope to find remains of Israelite settlements in an area with a high water table'
  - where: 'note 1:15 “Two midwives for a whole people”'
    claim: 'One older reading: the two named midwives were Hebrew women and heads of the profession, who passed the instructions on.'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/1.htm'
    quote: 'The midwives named in Exodus 1:15, who are not Egyptian but Hebrew women, were no doubt the heads of the whole profession, and were expected to communicate their instructions to their associates.'
  - where: 'note 1:15 “Two midwives for a whole people”'
    claim: 'Another reading has the king speaking to many midwives, of whom two are named.'
    key: ot-minute-ex-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-1-6'
    quote: 'He spoke to many Hebrew midwives, two of them being Shiphrah and Puah.'
  - where: 'note 1:17 “The first to resist Pharaoh”'
    claim: 'The “houses” of verse 21 are households, descendants.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/1?lang=eng'
    quote: 'OR households (descendants).'
  - where: 'note 1:17 “The first to resist Pharaoh”'
    claim: 'One reading: the rebellion against Egypt began with the midwives.'
    key: tilton-moses-midwife
    url: 'https://journal.interpreterfoundation.org/moses-as-midwife-what-the-exodus-birth-story-teaches-about-motherhood-and-christ/'
    quote: 'It was through the courageous actions of these midwives that the rebellion against Egypt began (Exodus 1:15–17).'
  - where: 'note 1:17 “The first to resist Pharaoh”'
    claim: 'Another reading: a line of women, beginning with the midwives, keeps Moses alive.'
    key: welch-saviors
    url: 'https://mi.byu.edu/old-testament-reflections/saviors-before-sinai'
    quote: 'The midwives Shiphrah and Puah cannily defy Pharaoh’s infanticide decree and preserve the entire generation of which Moses is a part. … Without these women, there is no Moses; without Moses, there is no Exodus.'
  - where: 'note 1:19 “Did the midwives lie to Pharaoh?”'
    claim: '“Lively” means having the vigour of life, of women bearing quickly and easily.'
    key: bdb
    url: 'https://biblehub.com/hebrew/2422.htm'
    quote: 'adjective having the vigour of life, lively … of Hebrew women in childbirth, bearing quickly easily.'
  - where: 'note 1:19 “Did the midwives lie to Pharaoh?”'
    claim: 'One retelling calls the answer the midwives’ ostensible reason.'
    key: ot-minute-ex-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-1-6'
    quote: 'When asked by Pharaoh why they did not obey him, their ostensible reason was that Hebrew women were healthier than Egyptian women and always seemed to deliver their children before a midwife could attend to them.'
  - where: 'note 1:19 “Did the midwives lie to Pharaoh?”'
    claim: 'One older reading: the reply deceived the king.'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/1.htm'
    quote: 'They succeeded in deceiving the king with this reply, as childbirth is remarkably rapid and easy in the case of Arabian women'
  - where: 'note 1:19 “Did the midwives lie to Pharaoh?”'
    claim: 'Augustine, as that commentary quotes him: God rewarded their mercy, not their falsehood.'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/1.htm'
    quote: 'Thus God rewarded them, "not, however, because they lied, but because they were merciful to the people of God; it was not their falsehood therefore that was rewarded, but their kindness … " (Augustine, contra mendac. c. 19.)'
  - where: 'christ'
    claim: 'The Student Manual compares the threat to Moses’s life with Herod’s threat to Christ’s, citing Moses 1:6.'
    key: ot-manual-ex-1-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-1-10-let-my-people-go?lang=eng'
    quote: 'The life of Moses, who was a similitude of the Savior (see Moses 1:6), was threatened by the ruler of the land, just as the life of Christ was threatened by Herod, who decreed the death of the children of Bethlehem.'
