chapter: 36
claims:
  # ---------- when / setting ----------
  - where: 'when'
    claim: 'Moses came down from Sinai with the second tables before the work began'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'And it came to pass, when Moses came down from mount Sinai with the two tables of testimony in Moses’ hand'
  - where: 'when'
    claim: 'The tabernacle was raised on the first day of the first month of the second year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'And it came to pass in the first month in the second year, on the first day of the month, that the tabernacle was reared up.'
  - where: 'setting'
    claim: 'Moses gathered the whole congregation and told them what the LORD commanded'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/35?lang=eng'
    quote: 'And Moses gathered all the congregation of the children of Israel together, and said unto them, These are the words which the Lord hath commanded, that ye should do them.'
  - where: 'setting'
    claim: 'Moses named Bezaleel to the people before the work began'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/35?lang=eng'
    quote: 'And Moses said unto the children of Israel, See, the Lord hath called by name Bezaleel the son of Uri, the son of Hur, of the tribe of Judah;'
  - where: 'setting'
    claim: 'The Church’s footnotes point from the curtains and boards made here to the instructions in Exodus 26'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/36?lang=eng'
    quote: 'Ex. 26:1 (1–14).'

  # ---------- thread ----------
  - where: 'thread'
    claim: 'Chapters 35–40 repeat the instructions nearly word for word with the tense changed'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/36.htm'
    quote: 'In the main, the narrative is repeated verbatim from the instructions in chs. 25–31, with the simple substitution of past tenses for future'
  - where: 'thread'
    claim: 'Verses 8–19 answer to Exodus 26:1–14'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/36.htm'
    quote: 'Mutatis mutandis, the text agrees almost verbally with Exodus 26:1-14'
  - where: 'thread'
    claim: 'Verses 20–34 answer to Exodus 26:15–29, and 26:30 is not repeated'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/36.htm'
    quote: 'Exodus 36:20-34. The boards, or ‘frames,’ to support the curtains. Exodus 26:15-29 (v. 30 not repeated).'
  - where: 'thread'
    claim: 'Verses 35–38 answer to the veil and screen of Exodus 26, and 26:33–35 is not repeated'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/36.htm'
    quote: 'Exodus 36:35-38. The Veil and Screen. Exodus 26:31-32; Exodus 26:36-37 (vv. 33–35 not repeated).'
  - where: 'thread'
    claim: 'In the making, the dwelling comes before the furniture it will hold'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/36.htm'
    quote: 'The order is in certain cases different: thus the Dwelling (Exodus 36:8-38) is made before the articles (the Ark, &c.), which it is to contain (Exodus 37:1-24)'
  - where: 'thread'
    claim: 'The table and candlestick are placed when Moses sets up the tabernacle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'And he put the table in the tent of the congregation, upon the side of the tabernacle northward, without the veil.'
  - where: 'thread'
    claim: 'One older reading: the singular “he made” refers to Bezaleel'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/36.htm'
    quote: 'in the sequel (even in v. 8b) the sing. (referring to Běẓal’çl) is used regularly'
  - where: 'thread'
    claim: 'Another older reading: the singular verbs have an indefinite subject'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/36.htm'
    quote: 'are in the third person singular with an indefinite subject, corresponding to the German man (the French on).'

  # ---------- plain ----------
  - where: 'section 1 plain'
    claim: '“Wise hearted” rendered “skilled”: the Church’s footnote gives “able”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/36?lang=eng'
    quote: 'OR all the able men (see also v. 4).'
  - where: 'section 1 plain'
    claim: '“For the service of” means in the construction of'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/36?lang=eng'
    quote: 'IE in the construction of (see also vv. 2, 8).'
  - where: 'section 1 plain'
    claim: '“Stuff” means materials'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/36?lang=eng'
    quote: 'OR materials.'
  - where: 'section 1 plain'
    claim: 'The proclamation of verse 6 rendered “make anything more as an offering”, after a modern translation'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2036%3A1-8&version=NRSVUE'
    quote: 'No man or woman is to make anything else as an offering for the sanctuary.'
  - where: 'section 2 plain'
    claim: '“Taches” are clasps'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/36?lang=eng'
    quote: 'OR clasps.'
  - where: 'section 3 plain'
    claim: '“Shittim” is acacia'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/36?lang=eng'
    quote: 'HEB acacia.'
  - where: 'section 3 plain'
    claim: 'The tenons fitted the boards one to another'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/36?lang=eng'
    quote: 'HEB which made them fit one to another.'
  - where: 'section 3 plain'
    claim: '“Sockets” are bases'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/36?lang=eng'
    quote: 'OR bases (also vv. 26, 30, 36, 38).'
  - where: 'section 3 plain'
    claim: 'The middle bar “shoots” through, that is, passes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/36?lang=eng'
    quote: 'OR pass.'
  - where: 'section 4 plain'
    claim: 'The “hanging” for the door is a screen'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/36?lang=eng'
    quote: 'OR a screen or curtain.'
  - where: 'section 4 plain'
    claim: '“Chapiters” are the tops of the pillars'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/36?lang=eng'
    quote: 'OR capitals or tops of the pillars.'

  # ---------- note 36:1 ----------
  - where: 'note 36:1 “Verse 1 may be the end of Moses’s speech”'
    claim: 'A modern translation puts verse 1 in Moses’s mouth as an instruction'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2036%3A1-8&version=NRSVUE'
    quote: 'shall work in accordance with all that the Lord has commanded.'
  - where: 'note 36:1 “Verse 1 may be the end of Moses’s speech”'
    claim: 'In that translation the narrative resumes at verse 2 with Moses calling the workers'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2036%3A1-8&version=NRSVUE'
    quote: 'Moses then called Bezalel and Oholiab and every skilled person to whom the Lord had given skill'

  # ---------- note 36:5 ----------
  - where: 'note 36:5 “An offering that had to be stopped”'
    claim: 'A modern translation of the proclamation'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2036%3A1-8&version=NRSVUE'
    quote: 'No man or woman is to make anything else as an offering for the sanctuary.'
  - where: 'note 36:5 “An offering that had to be stopped”'
    claim: 'The Hebrew word for “work” in verse 6 (H4399) is the word for “stuff” in verse 7'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'מְלָאכָ֖ה'
  - where: 'note 36:5 “An offering that had to be stopped”'
    claim: 'Verse 7 (“the stuff”) has the same word, H4399, with the article'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וְ/הַ/מְּלָאכָ֗ה'
  - where: 'note 36:5 “An offering that had to be stopped”'
    claim: 'The Church’s footnote renders “stuff” in verse 7 as materials'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/36?lang=eng'
    quote: 'OR materials.'
  - where: 'note 36:5 “An offering that had to be stopped”'
    claim: 'The verse’s own words: the proclamation and the people restrained'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/36?lang=eng'
    quote: 'Let neither man nor woman make any more work for the offering of the sanctuary. So the people were restrained from bringing.'

  # ---------- christ / explore ----------
  - where: 'christ'
    claim: 'The veil made in verse 35 is the veil commanded in Exodus 26'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/36.htm'
    quote: 'Exodus 36:35-38. The Veil and Screen. Exodus 26:31-32; Exodus 26:36-37 (vv. 33–35 not repeated).'
  - where: 'explore'
    claim: 'In 1 Chronicles 29 the people give willingly for the temple and rejoice'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/29?lang=eng'
    quote: 'Then the people rejoiced, for that they offered willingly, because with perfect heart they offered willingly to the Lord'
  - where: 'explore'
    claim: 'In Hezekiah’s day the offerings left a great store'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/31?lang=eng'
    quote: 'we have had enough to eat, and have left plenty: for the Lord hath blessed his people; and that which is left is this great store.'
