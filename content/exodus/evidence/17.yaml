chapter: 17
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'Israel leaves Rephidim for the wilderness of Sinai, so Rephidim is the camp before the mountain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/33?lang=eng'
    quote: 'And they departed from Rephidim, and pitched in the wilderness of Sinai.'
  - where: 'setting'
    claim: 'What and where Rephidim was'
    key: bd-rephidim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/rephidim?lang=eng'
    quote: 'Supports. A wilderness station passed just before reaching Sinai; the scene of a battle with Amalek, in which the victory was won by Israel in answer to the prayers of Moses'
  - where: 'setting'
    claim: 'Where the Amalekites lived'
    key: gs-amalekites-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/amalekites-old-testament?lang=eng'
    quote: 'An Arab tribe that lived in the desert of Paran between the Arabah and the Mediterranean.'
  - where: 'setting'
    claim: 'The itinerary in Numbers names Rephidim as the place without water'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/33?lang=eng'
    quote: 'And they removed from Alush, and encamped at Rephidim, where was no water for the people to drink.'
  - where: 'thread'
    claim: 'The rod in both halves of the chapter is the same rod'
    key: scripture-helps-ex-14
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/14-exodus-14-18?lang=eng'
    quote: 'The rod Moses held was the same rod that the Lord had promised would enable Moses to perform miracles'
  - where: 'thread'
    claim: 'The murmuring at Rephidim is not punished'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/17.htm'
    quote: 'the divine long-suffering and grace interposed in this case also, and provided for the want without punishing their murmuring'
  - where: 'thread'
    claim: 'The rod has been read as the sign of God’s presence in the battle'
    key: ot-minute-ex-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-14-17'
    quote: 'The rod, or staff, signified God’s presence. He was in control of this battle.'
  - where: 'thread'
    claim: 'Whatever the gesture meant, the Lord was the source of Israel’s power in the battle'
    key: scripture-helps-ex-14
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/14-exodus-14-18?lang=eng'
    quote: 'Regardless of the reason for Moses’s actions, it is clear that the Lord was the source of the Israelites’ power in this battle.'
  - where: 'thread'
    claim: 'Meaning of Jehovah-nissi'
    key: bd-jehovah-nissi
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah-nissi?lang=eng'
    quote: 'The Lord is my banner. Name given by Moses to the altar erected after the victory at Rephidim (Ex. 17:15).'
  - where: 'thread'
    claim: 'Massah and Meribah mean Testing and Strife'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/17?lang=eng'
    quote: 'IE Testing, Trying, or Proving.'

  # ---------- plain ----------
  - where: 'section 1 plain'
    claim: '“After their journeys” means by stages; “chide” means quarrel'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2017%3A1-16&version=NRSVUE'
    quote: 'the whole congregation of the Israelites journeyed by stages, as the Lord commanded. They camped at Rephidim, but there was no water for the people to drink.(A) 2 The people quarreled with Moses'
  - where: 'section 1 plain'
    claim: '“Tempt the LORD” is to put Him to the test (the Church’s footnote 2b)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/17?lang=eng'
    quote: 'HEB put the Lord to the test.'

  # ---------- notes ----------
  - where: 'note 17:2 “Tempting the LORD means putting Him to the test”'
    claim: 'The Church’s footnote to “tempt the LORD”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/17?lang=eng'
    quote: 'HEB put the Lord to the test.'
  - where: 'note 17:2 “Tempting the LORD means putting Him to the test”'
    claim: 'The verb means to test, not to tempt in the modern sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/5254.htm'
    quote: 'test, try, prove, tempt [but not in modern sense of the word'
  - where: 'note 17:2 “Tempting the LORD means putting Him to the test”'
    claim: 'The same verb is used of God testing Israel at 15:25 and 16:4'
    key: bdb
    url: 'https://biblehub.com/hebrew/5254.htm'
    quote: 'God tests or proves Abraham Genesis 22:1 (E), Israel Exodus 15:25; Exodus 20:20 (E), Exodus 16:4 (J)'
  - where: 'note 17:2 “Tempting the LORD means putting Him to the test”'
    claim: 'The lexicon lists 17:2, 7 and Deuteronomy 6:16 under Israel testing God'
    key: bdb
    url: 'https://biblehub.com/hebrew/5254.htm'
    quote: 'Israel tests, or tries God: Exodus 17:2,7; Numbers 14:22 (J), Deuteronomy 6:16'
  - where: 'note 17:2 “Tempting the LORD means putting Him to the test”'
    claim: 'The Savior answers the tempter with Deuteronomy 6:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/4?lang=eng'
    quote: 'Jesus said unto him, It is written again, Thou shalt not tempt the Lord thy God.'

  - where: 'note 17:6 “The rock is at Horeb, the mountain of the bush”'
    claim: 'Horeb is another name for Sinai'
    key: bd-horeb
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/horeb?lang=eng'
    quote: 'Another name for Sinai (Ex. 3:1; Deut. 1:6; 4:10; 1 Kgs. 19:8; Mal. 4:4; 3 Ne. 25:4).'
  - where: 'note 17:6 “The rock is at Horeb, the mountain of the bush”'
    claim: 'The elders were taken as witnesses of the miracle'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/17.htm'
    quote: 'The elders were to be eye-witnesses of the miracle, that they might bear their testimony to it before the unbelieving people'
  - where: 'note 17:6 “The rock is at Horeb, the mountain of the bush”'
    claim: 'What the LORD’s standing on the rock signified'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/17.htm'
    quote: 'standing before Moses upon the rock, signified the gracious assistance of God.'
  - where: 'note 17:6 “The rock is at Horeb, the mountain of the bush”'
    claim: 'Israel comes to the desert of Sinai on leaving Rephidim'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/19?lang=eng'
    quote: 'For they were departed from Rephidim, and were come to the desert of Sinai, and had pitched in the wilderness; and there Israel camped before the mount.'

  - where: 'note 17:6 “That Rock was Christ”'
    claim: 'Paul identifies the rock with Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/10?lang=eng'
    quote: 'And did all drink the same spiritual drink: for they drank of that spiritual Rock that followed them: and that Rock was Christ.'
  - where: 'note 17:6 “That Rock was Christ”'
    claim: 'Nephi names the smitten rock, with the other works done through Moses, in his oath that there is no other name than Jesus Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/25?lang=eng'
    quote: 'and also gave him power that he should smite the rock and the water should come forth; yea, behold I say unto you, that as these things are true, and as the Lord God liveth, there is none other name given under heaven save it be this Jesus Christ'
  - where: 'note 17:6 “That Rock was Christ”'
    claim: 'Elder McConkie’s comment on 1 Corinthians 10:1–4, as the Student Manual prints it'
    key: ot-manual-ex-11-19
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-11-19-the-passover-and-the-exodus?lang=eng'
    quote: 'He is the spiritual drink, the living water, the water of life, which if men drink they shall never thirst more.'
  - where: 'note 17:6 “That Rock was Christ”'
    claim: 'The comment is Elder Bruce R. McConkie’s, on Paul’s statement'
    key: ot-manual-ex-11-19
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-11-19-the-passover-and-the-exodus?lang=eng'
    quote: 'Elder Bruce R. McConkie’s commentary on Paul’s statement is very enlightening:'
  - where: 'note 17:6 “That Rock was Christ”'
    claim: 'A reading that lists, among the symbols of Christ here, that He was smitten at Calvary'
    key: ot-minute-ex-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-14-17'
    quote: 'Christ is often referred to as the rock of our salvation, He was smitten at Calvary, and we frequently speak of Him as being our Living Water.'

  - where: 'note 17:7 “Massah and Meribah, the names scripture keeps”'
    claim: 'The Church’s footnote on Massah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/17?lang=eng'
    quote: 'IE Testing, Trying, or Proving.'
  - where: 'note 17:7 “Massah and Meribah, the names scripture keeps”'
    claim: 'The Church’s footnote on Meribah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/17?lang=eng'
    quote: 'IE Strife, Complaint.'
  - where: 'note 17:7 “Massah and Meribah, the names scripture keeps”'
    claim: 'Psalm 95’s “provocation” and “temptation” are Meribah and Massah, and Hebrews quotes it'
    key: thomas-provocation
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/provocation-wilderness-rejection-grace'
    quote: 'Harden not your heart, as in the provocation [Hebrew meribah], and as in the day of temptation [Hebrew massah] in the wilderness'
  - where: 'note 17:7 “Massah and Meribah, the names scripture keeps”'
    claim: 'Jacob draws on Psalm 95'
    key: thomas-provocation
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/provocation-wilderness-rejection-grace'
    quote: 'Jacob referred to Psalm 95 (on the plates of brass) when he wrote'
  - where: 'note 17:7 “Massah and Meribah, the names scripture keeps”'
    claim: 'This event is the Provocation'
    key: thomas-provocation
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/provocation-wilderness-rejection-grace'
    quote: 'The event at Meribah is the Provocation mentioned throughout the Bible.'
  - where: 'note 17:7 “Massah and Meribah, the names scripture keeps”'
    claim: 'The day read as a refusal of grace'
    key: thomas-provocation
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/provocation-wilderness-rejection-grace'
    quote: 'God offers His children grace, but the children will not seek it; God offers His children heaven, but the children will not enter in.'
  - where: 'note 17:7 “Massah and Meribah, the names scripture keeps”'
    claim: 'The study counts three further provocations, the first at the foot of Sinai'
    key: thomas-provocation
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/provocation-wilderness-rejection-grace'
    quote: 'describe three additional incidents of provocation. First, at the foot of Sinai'
  - where: 'note 17:7 “Massah and Meribah, the names scripture keeps”'
    claim: 'Meribah is a name given to Rephidim'
    key: bd-meribah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/meribah?lang=eng'
    quote: 'Contention. (1) A name given to Rephidim (Ex. 17:7).'
  - where: 'note 17:7 “Massah and Meribah, the names scripture keeps”'
    claim: 'Meribah is also a name given to Kadesh'
    key: bd-meribah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/meribah?lang=eng'
    quote: '(2) A name given to Kadesh (Num. 20:13, 24; 27:14; Deut. 32:51; 33:8; Ps. 81:7).'
  - where: 'note 17:7 “Massah and Meribah, the names scripture keeps”'
    claim: 'After the second Meribah Moses is told he will not bring the congregation into the land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/20?lang=eng'
    quote: 'Because ye believed me not, to sanctify me in the eyes of the children of Israel, therefore ye shall not bring this congregation into the land which I have given them.'

  - where: 'note 17:9 “Joshua appears without introduction”'
    claim: 'The name Joshua first occurs in Exodus at 17:9 (hebrew.mjs exodus --word H3091: 17:9, 10, 13, 14; 24:13; 32:17; 33:11)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'יְהוֹשֻׁ֨עַ֙'
  - where: 'note 17:9 “Joshua appears without introduction”'
    claim: 'Who Joshua was, and the forms of his name'
    key: bd-joshua
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joshua?lang=eng'
    quote: 'God is help. The name also occurs in the Old Testament under the various forms Jehoshua, Hoshea, Jeshua, and Jesus; son of Nun, and successor of Moses; born in Egypt before the Exodus'
  - where: 'note 17:9 “Joshua appears without introduction”'
    claim: 'Joshua stayed at the tabernacle (the tent of meeting) when Moses returned to the camp'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/33?lang=eng'
    quote: 'but his servant Joshua, the son of Nun, a young man, departed not out of the tabernacle.'
  - where: 'note 17:9 “Joshua appears without introduction”'
    claim: 'The King James New Testament calls Joshua “Jesus”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/4?lang=eng'
    quote: 'For if Jesus had given them rest, then would he not afterward have spoken of another day.'
  - where: 'note 17:9 “Joshua appears without introduction”'
    claim: 'Why the memorial is rehearsed to Joshua'
    key: ot-minute-ex-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-14-17'
    quote: 'Joshua, who eventually succeeded Moses in leading the children of Israel into Canaan, especially needed to remember the event.'

  - where: 'note 17:11 “What the raised hand meant”'
    claim: 'That the raised hands were a gesture of prayer is possible, not certain'
    key: scripture-helps-ex-14
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/14-exodus-14-18?lang=eng'
    quote: 'It is possible that Moses’s uplifted hands were a gesture of prayer.'
  - where: 'note 17:11 “What the raised hand meant”'
    claim: 'Lifting the hands was the gesture of prayer in the ancient world'
    key: calabro-gestures
    url: 'https://rsc.byu.edu/ascending-mountain-lord/gestures-praise-lifting-spreading-hands-biblical-prayer'
    quote: 'The quintessential type of gesture associated with prayer in the ancient world was the lifting of the hands, a visual sign that accompanied verbal expressions of praise and entreaty.'
  - where: 'note 17:11 “What the raised hand meant”'
    claim: 'The rod signified God’s presence'
    key: ot-minute-ex-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-14-17'
    quote: 'The rod, or staff, signified God’s presence. He was in control of this battle.'
  - where: 'note 17:11 “What the raised hand meant”'
    claim: 'Moses spread his hands to the LORD to end the hail'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/9?lang=eng'
    quote: 'And Moses went out of the city from Pharaoh, and spread abroad his hands unto the Lord: and the thunders and hail ceased'

  - where: 'note 17:12 “Holding up the hands of the prophet”'
    claim: 'President Lee, then in the First Presidency, cited Moses at Rephidim'
    key: rasband-hold-up
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2024/10/53rasband?lang=eng'
    quote: 'President Harold B. Lee, at the time a member of the First Presidency, cited the example of Moses standing atop the hill at Rephidim.'
  - where: 'note 17:12 “Holding up the hands of the prophet”'
    claim: 'President Lee’s words on upholding the President’s hands'
    key: rasband-hold-up
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2024/10/53rasband?lang=eng'
    quote: 'but as we uphold his hands, and as we lead under his direction, by his side, the gates of hell will not prevail against you and against Israel.'
  - where: 'note 17:12 “Holding up the hands of the prophet”'
    claim: 'Elder Rasband’s definition of sustaining'
    key: rasband-hold-up
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2024/10/53rasband?lang=eng'
    quote: 'To sustain means to hold up another person, to give them our attention, to be faithful to their trust, to act upon their words.'
  - where: 'note 17:12 “Holding up the hands of the prophet”'
    claim: 'President Packer applied the heavy hands of verse 12 to the President of the Church and his counselors'
    key: packer-shield
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1995/04/the-shield-of-faith?lang=eng'
    quote: 'Should age and infirmity cause his hands to grow heavy, they are held up by his counselors at his side.'
  - where: 'note 17:12 “Holding up the hands of the prophet”'
    claim: 'The speaker is President Boyd K. Packer'
    key: packer-shield
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1995/04/the-shield-of-faith?lang=eng'
    quote: 'By President Boyd K. Packer'
  - where: 'note 17:12 “Holding up the hands of the prophet”'
    claim: 'Hur is with Aaron again at Sinai'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/24?lang=eng'
    quote: 'Tarry ye here for us, until we come again unto you: and, behold, Aaron and Hur are with you'

  - where: 'note 17:14 “The book Moses is told to write in”'
    claim: 'The Hebrew as pointed reads “in the book,” often taken of a history Moses had begun; not the necessary meaning'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/17.htm'
    quote: 'The Heb., as pointed, is, in the book, whence it has often been supposed that the reference is to the history which Moses had already begun to write. But though this might be the meaning of the Heb., it is certainly not the necessary meaning'
  - where: 'note 17:14 “The book Moses is told to write in”'
    claim: 'Hebrew idiom writes “in the book”'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/17.htm'
    quote: 'the Hebrew always writes in the book, Numbers 5:23, 1 Samuel 10:25, Jeremiah 32:10, Job 19:23'
  - where: 'note 17:14 “The book Moses is told to write in”'
    claim: 'Another older reading of “the book”'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/17.htm'
    quote: 'in "the book" appointed for a record of the wonderful works of God'
  - where: 'note 17:14 “The book Moses is told to write in”'
    claim: 'Moses writes at the LORD’s word later in Exodus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'And the Lord said unto Moses, Write thou these words: for after the tenor of these words I have made a covenant with thee and with Israel.'

  - where: 'note 17:14 “The decree against Amalek”'
    claim: 'Deuteronomy gives the manner of the attack'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/25?lang=eng'
    quote: 'How he met thee by the way, and smote the hindmost of thee, even all that were feeble behind thee, when thou wast faint and weary; and he feared not God.'
  - where: 'note 17:14 “The decree against Amalek”'
    claim: 'The attack fell on the rear of the camp and the most vulnerable'
    key: scripture-helps-ex-14
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/14-exodus-14-18?lang=eng'
    quote: 'the book of Deuteronomy adds the important detail that the Amalekites attacked the rear of the camp, killing the most vulnerable'
  - where: 'note 17:14 “The decree against Amalek”'
    claim: 'The Amalekites went on attacking Israel'
    key: scripture-helps-ex-14
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/14-exodus-14-18?lang=eng'
    quote: 'The Amalekites would continue to attack Israel in the generations to come.'
  - where: 'note 17:14 “The decree against Amalek”'
    claim: 'The war ran from Moses’s time to Saul’s and David’s'
    key: gs-amalekites-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/amalekites-old-testament?lang=eng'
    quote: 'They were constantly at war with the Hebrews from the time of Moses (Ex. 17:8) to Saul and David (1 Sam. 15; 27:8; 30; 2 Sam. 8:11–12).'
  - where: 'note 17:14 “The decree against Amalek”'
    claim: 'Balaam foresees Amalek’s end'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/24?lang=eng'
    quote: 'Amalek was the first of the nations; but his latter end shall be that he perish for ever.'
  - where: 'note 17:14 “The decree against Amalek”'
    claim: 'Amalekites with Midian in Gideon’s day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/6?lang=eng'
    quote: 'the Midianites came up, and the Amalekites, and the children of the east, even they came up against them'
  - where: 'note 17:14 “The decree against Amalek”'
    claim: 'Amalekites burn Ziklag'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/30?lang=eng'
    quote: 'the Amalekites had invaded the south, and Ziklag, and smitten Ziklag, and burned it with fire'
  - where: 'note 17:14 “The decree against Amalek”'
    claim: 'Commanded battle was the exception'
    key: scripture-helps-violence
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/52-violence-and-destruction-in-the-old-testament?lang=eng'
    quote: 'While the Lord sometimes commanded the Israelites to go to battle, this was the exception rather than the rule.'
  - where: 'note 17:14 “The decree against Amalek”'
    claim: 'Such accounts do not justify violence today'
    key: scripture-helps-violence
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/52-violence-and-destruction-in-the-old-testament?lang=eng'
    quote: 'we should not think that examples of violence in the Old Testament would ever be justification for committing violence today'
  - where: 'note 17:14 “The decree against Amalek”'
    claim: 'Not every instance can be fully understood'
    key: scripture-helps-violence
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/52-violence-and-destruction-in-the-old-testament?lang=eng'
    quote: 'Even though we cannot fully comprehend all the instances of divinely sanctioned violence in the Old Testament'

  - where: 'note 17:15 “The LORD is my banner”'
    claim: 'Meaning of the altar’s name'
    key: bd-jehovah-nissi
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah-nissi?lang=eng'
    quote: 'The Lord is my banner. Name given by Moses to the altar erected after the victory at Rephidim (Ex. 17:15).'
  - where: 'note 17:15 “The LORD is my banner”'
    claim: 'The Hebrew noun behind “nissi” and its meanings'
    key: bdb
    url: 'https://biblehub.com/hebrew/5251.htm'
    quote: 'standard, ensign, signal, sign'
  - where: 'note 17:15 “The LORD is my banner”'
    claim: 'Its sense at Exodus 17:15'
    key: bdb
    url: 'https://biblehub.com/hebrew/5251.htm'
    quote: 'standard, as rallying-point'
  - where: 'note 17:15 “The LORD is my banner”'
