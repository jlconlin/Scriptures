chapter: 15
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'The next date the book gives is the fifteenth day of the second month'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/16?lang=eng'
    quote: 'came unto the wilderness of Sin, which is between Elim and Sinai, on the fifteenth day of the second month after their departing out of the land of Egypt.'
  - where: 'setting'
    claim: 'The poem is traditionally called the Song of the Sea'
    key: welch-praise
    url: 'https://mi.byu.edu/old-testament-reflections/exodus-15-and-the-practice-of-praise'
    quote: 'The poem recorded in Exodus 15, known traditionally as the Song of the Sea, is among the most ancient texts in the Hebrew Bible.'
  - where: 'setting'
    claim: 'The Church’s chapter heading calls it the song of Moses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/15?lang=eng'
    quote: 'The children of Israel sing the song of Moses—They extol the Lord as a man of war and rejoice in their deliverance from Egypt'
  - where: 'setting'
    claim: 'Isaiah 12:2 and Psalm 118:14 repeat the song’s second verse (the Church’s footnote 2a points to 2 Ne. 22:2, which is Isaiah 12:2)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/118?lang=eng'
    quote: 'The Lord is my strength and song, and is become my salvation.'
  - where: 'setting'
    claim: 'Nehemiah 9:11 prays in the song’s images'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/9?lang=eng'
    quote: 'their persecutors thou threwest into the deeps, as a stone into the mighty waters.'
  - where: 'setting'
    claim: 'Psalm 106 sets the singing beside the forgetting'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/106?lang=eng'
    quote: 'Then believed they his words; they sang his praise.'
  - where: 'setting'
    claim: 'Psalm 106:13: they soon forgot His works'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/106?lang=eng'
    quote: 'They soon forgat his works; they waited not for his counsel'
  - where: 'setting'
    claim: 'Revelation names a song of Moses and of the Lamb'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/15?lang=eng'
    quote: 'And they sing the song of Moses the servant of God, and the song of the Lamb'
  - where: 'setting'
    claim: 'Marah has the first murmuring in the record of the wanderings'
    key: ot-manual-ex-11-19
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-11-19-the-passover-and-the-exodus?lang=eng'
    quote: 'This verse contains the first of over twenty uses of the word murmur in its various forms in the record of Israel’s wanderings.'
  - where: 'thread'
    claim: 'The song covers the whole Exodus and its last verses look to its end'
    key: ot-minute-ex-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-14-17'
    quote: 'The entire song that Moses wrote refers to the Exodus from beginning to end. In these verses, he focused on the end of the Exodus.'
  - where: 'thread'
    claim: 'One reflection hears three movements in the song'
    key: welch-praise
    url: 'https://mi.byu.edu/old-testament-reflections/exodus-15-and-the-practice-of-praise'
    quote: 'the song recounts God’s victory over Egypt, his freeing of Israel, and his building of a holy sanctuary where he will plant them and make them flourish.'
  - where: 'thread'
    claim: 'The same reflection reads the crossing as a replay of creation'
    key: welch-praise
    url: 'https://mi.byu.edu/old-testament-reflections/exodus-15-and-the-practice-of-praise'
    quote: 'tells the story of the Israelites’ crossing to safety as a replay of Genesis 1: God subdues the chaos of the Egyptian chariots, divides the waters, and makes dry land appear.'
  - where: 'thread'
    claim: 'Marah is the second of the crises of faith after the departure'
    key: brown-trust-lord
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/trust-lord'
    quote: 'These two situations, taken in reverse order, led to the next two crises of faith.'
  - where: 'thread'
    claim: 'The Lord was teaching Israel to rely on Him'
    key: brown-trust-lord
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/trust-lord'
    quote: 'Part of the Lord’s program for the Israelites was to force them to come to trust and rely upon Him for all of their needs.'

  # ---------- plain words ----------
  - where: 'section 1 plain'
    claim: '“Prepare him an habitation” is rendered “praise Him” (see the note on verse 2)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/15?lang=eng'
    quote: 'HEB praise Him.'
  - where: 'section 2 plain'
    claim: '“Lust” is desire'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/15?lang=eng'
    quote: 'HEB soul; i.e., desire.'
  - where: 'section 2 plain'
    claim: '“Fearful in praises” may be read “to be praised with awe”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/15?lang=eng'
    quote: 'OR to be praised with awe.'
  - where: 'section 3 plain'
    claim: '“Palestina” is Philistia'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/15?lang=eng'
    quote: 'OR Philistia.'
  - where: 'section 3 plain'
    claim: '“Dukes” are chiefs'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/15?lang=eng'
    quote: 'HEB chiefs.'
  - where: 'section 5 plain'
    claim: 'Marah means bitterness; threescore and ten is seventy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/15?lang=eng'
    quote: 'IE Bitterness.'

  # ---------- notes ----------
  - where: 'note 15:1 “An old song set into the story”'
    claim: 'The Song of the Sea is among the poems written in the oldest stage of Hebrew'
    key: sc-knowhy-853
    url: 'https://scripturecentral.org/knowhy/why-does-the-old-testament-contain-poems-in-the-middle-of-stories'
    quote: 'However, small portions of these Classical Biblical Hebrew books contain segments written in the oldest stage of the three: Archaic Biblical Hebrew. The Song of the Sea (Exodus 15), the Song of Deborah (Judges 5), the Blessings of Jacob (Genesis 49) and of Moses (Deuteronomy 33), the Oracles of Balaam (Numbers 23–24)'
  - where: 'note 15:1 “An old song set into the story”'
    claim: 'The song is among the most ancient texts in the Hebrew Bible'
    key: welch-praise
    url: 'https://mi.byu.edu/old-testament-reflections/exodus-15-and-the-practice-of-praise'
    quote: 'The poem recorded in Exodus 15, known traditionally as the Song of the Sea, is among the most ancient texts in the Hebrew Bible.'
  - where: 'note 15:1 “An old song set into the story”'
    claim: 'The age of Archaic Biblical Hebrew is debated; there are reasons to put it before 1000 BC'
    key: sc-knowhy-853
    url: 'https://scripturecentral.org/knowhy/why-does-the-old-testament-contain-poems-in-the-middle-of-stories'
    quote: 'Some Hebraists have proposed that Archaic Biblical Hebrew is not very old, and dates from a comparatively short time before the Babylonian Exile. However, there are reasons for thinking that Archaic Biblical Hebrew predates 1000 BC.'
  - where: 'note 15:1 “An old song set into the story”'
    claim: 'Ugaritic is a related language older than 1200 BC, and Exodus 15 shares phrases and word pairs with it'
    key: sc-knowhy-853
    url: 'https://scripturecentral.org/knowhy/why-does-the-old-testament-contain-poems-in-the-middle-of-stories'
    quote: 'Ugaritic is a language which is related to Hebrew and dates from before 1200 BC. … Some Archaic Biblical Hebrew texts such as Exodus 15 even contain phrases and word pairs that are the same as what one finds in Ugaritic.'
  - where: 'note 15:1 “An old song set into the story”'
    claim: 'Scribes valued such songs as early material and would work them into their writing'
    key: sc-knowhy-853
    url: 'https://scripturecentral.org/knowhy/why-does-the-old-testament-contain-poems-in-the-middle-of-stories'
    quote: 'Archaic Biblical Hebrew often appears in songs or poems which were likely held in high regard as some of the earliest material known from ancient Israel. Thus, if a scribe knew that such material existed, they would likely incorporate it into their contemporary material'
  - where: 'note 15:1 “An old song set into the story”'
    claim: 'Or an author might write poetry in the older style on purpose'
    key: sc-knowhy-853
    url: 'https://scripturecentral.org/knowhy/why-does-the-old-testament-contain-poems-in-the-middle-of-stories'
    quote: 'It is also possible that authors wrote using older stages of the language (archaizing their words) when creating such things as poetry to set it apart from the other text and to give it more beauty'

  - where: 'note 15:2 “Prepare him an habitation, or praise him”'
    claim: 'The Church’s footnote gives the Hebrew as “praise Him”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/15?lang=eng'
    quote: 'HEB praise Him.'
  - where: 'note 15:2 “Prepare him an habitation, or praise him”'
    claim: 'The dictionary gives the verb two senses, and the King James rendering is “prepare an habitation”'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/5115.htm'
    quote: 'A primitive root; to rest (as at home); causatively (through the implied idea of beauty (compare naveh)), to celebrate (with praises) -- keept at home, prepare an habitation.'
  - where: 'note 15:2 “Prepare him an habitation, or praise him”'
    claim: 'BDB renders the form in Exodus 15:2 “I will beautify, adorn him (with praises)” and marks it parallel to “exalt”'
    key: bdb
    url: 'https://biblehub.com/hebrew/5115.htm'
    quote: 'Imperfect1singular suffix אַנְוֵהוּ Exodus 15:2 I will beautify, adorn him (with praises; object ׳י; "" רומם; ᵐ5 δυξάσω, ᵑ7 glorificabo).'
  - where: 'note 15:2 “Prepare him an habitation, or praise him”'
    claim: 'The Septuagint reads “I will glorify him”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/exodus/15.htm'
    quote: 'He was to me a helper and protector for salvation: this is my God and I will glorify him; my father''s God, and I will exalt him.'
  - where: 'note 15:2 “Prepare him an habitation, or praise him”'
    claim: 'The NRSVue reads “I will praise him”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus+15%3A2%2C11%2C13%2C17%2C25&version=NRSVUE'
    quote: 'this is my God, and I will praise him;'

  - where: 'note 15:3 “The LORD as a warrior”'
    claim: 'The song praises God as Divine Warrior acting for Israel'
    key: sc-knowhy-277
    url: 'https://scripturecentral.org/knowhy/why-does-jacob-describe-god-as-a-divine-warrior'
    quote: 'the book of Exodus records a song of thanksgiving that Moses offered, which praised God for acting on Israel’s behalf in His role as Divine Warrior.'
  - where: 'note 15:3 “The LORD as a warrior”'
    claim: 'Divine-warrior language runs through the Old Testament and was common in the ancient world'
    key: sc-knowhy-277
    url: 'https://scripturecentral.org/knowhy/why-does-jacob-describe-god-as-a-divine-warrior'
    quote: 'This type of language, which attributes to Jehovah the characteristics of a “divine warrior” who comes from heaven to fight battles on behalf of his covenant people, is found throughout the Old Testament and is common to traditions regarding many deities throughout the ancient world.'
  - where: 'note 15:3 “The LORD as a warrior”'
    claim: 'Israel celebrated God’s redemption with images of a conquering hero'
    key: sc-knowhy-277
    url: 'https://scripturecentral.org/knowhy/why-does-jacob-describe-god-as-a-divine-warrior'
    quote: 'When the ancient Israelites celebrated the history of God’s intervention to save or redeem His children, they often used dramatic images of God coming as a conquering hero and vanquishing the opposition.'
  - where: 'note 15:3 “The LORD as a warrior”'
    claim: 'The image belonged to the covenant: those who kept it could call on the Lord to defend them'
    key: sc-knowhy-277
    url: 'https://scripturecentral.org/knowhy/why-does-jacob-describe-god-as-a-divine-warrior'
    quote: 'The covenant people were taught that if they kept their covenants, they could call upon the Lord to fulfill His promise to defend them from all harm and evil.'
  - where: 'note 15:3 “The LORD as a warrior”'
    claim: 'Jacob used the portrayal for a people who feared they were cut off'
    key: sc-knowhy-277
    url: 'https://scripturecentral.org/knowhy/why-does-jacob-describe-god-as-a-divine-warrior'
    quote: 'Jacob sought to reassure his people that the Lord had not forgotten them by utilizing the traditional scriptural portrayal of God as a Divine Warrior who had the power to intervene and fulfill His covenantal promises.'
  - where: 'christ'
    claim: 'Jacob names the devil, death and hell as the monster God delivers from'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/9?lang=eng'
    quote: 'For he delivereth his saints from that awful monster the devil, and death, and hell, and that lake of fire and brimstone, which is endless torment.'

  - where: 'note 15:11 “Among the gods”'
    claim: 'The verse says there is no other god like the Lord'
    key: ot-minute-ex-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-14-17'
    quote: 'Moses wrote that there is no other god like the Lord—He is merciful and glorious and works wonders.'
  - where: 'note 15:11 “Among the gods”'
    claim: 'One older reading: the comparison is with so-called gods who could do no such deeds'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/15.htm'
    quote: 'not strong ones, but gods, Elohim, Psalm 86:8, because none of the many so-called gods could perform such deeds'
  - where: 'note 15:11 “Among the gods”'
    claim: 'Jethro says the LORD is greater than all gods; Psalm 86:8 states what the song asks (footnote 11b)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/18?lang=eng'
    quote: 'Now I know that the Lord is greater than all gods: for in the thing wherein they dealt proudly he was above them.'
  - where: 'note 15:11 “Among the gods”'
    claim: 'The Church’s footnote gives “to be praised with awe” for “fearful in praises”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/15?lang=eng'
    quote: 'OR to be praised with awe.'
  - where: 'note 15:11 “Among the gods”'
    claim: 'The NRSVue has “awesome in splendor”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus+15%3A2%2C11%2C13%2C17%2C25&version=NRSVUE'
    quote: 'awesome in splendor, doing wonders?'

  - where: 'note 15:16 “A people bought”'
    claim: 'BDB lists Exodus 15:16 under God victoriously redeeming his people, with Psalm 74:2 where the verb is parallel to “redeem”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7069.htm'
    quote: 'b. of God as victoriously redeeming his people Exodus 15:16; Isaiah 11:11; Psalm 74:2 ("" גָּאַל)'
  - where: 'note 15:16 “A people bought”'
    claim: 'The Church’s footnote 16c on “purchased” points to Psalm 74:2 and 1 Corinthians 6:20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/15?lang=eng'
    quote: 'Ps. 74:2; 1 Cor. 6:20.'
  - where: 'christ'
    claim: 'The Church’s footnote 16c on “purchased” points to 1 Corinthians 6:20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/15?lang=eng'
    quote: 'Ps. 74:2; 1 Cor. 6:20.'
  - where: 'christ'
    claim: 'Paul says the Saints are bought with a price'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/6?lang=eng'
    quote: 'For ye are bought with a price: therefore glorify God in your body, and in your spirit, which are God’s.'

  - where: 'note 15:17 “Which mountain, and which sanctuary”'
    claim: 'One reading: the holy habitation of verse 13 is the promised land'
    key: ot-minute-ex-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-14-17'
    quote: 'were led unto God’s “holy habitation,” which in this instance referred to the promised land (see Exodus 15:17).'
  - where: 'note 15:17 “Which mountain, and which sanctuary”'
    claim: 'The same reading takes verse 17 of Israel residing in the mountains'
    key: ot-minute-ex-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-14-17'
    quote: 'God would calm those neighboring people so the Hebrews could pass through peaceably to reside in the mountains, a sanctuary that God had established for His people.'
  - where: 'note 15:17 “Which mountain, and which sanctuary”'
    claim: 'Another reading: the song ends with the building of a holy sanctuary'
    key: welch-praise
    url: 'https://mi.byu.edu/old-testament-reflections/exodus-15-and-the-practice-of-praise'
    quote: 'the song recounts God’s victory over Egypt, his freeing of Israel, and his building of a holy sanctuary where he will plant them and make them flourish.'
  - where: 'note 15:17 “Which mountain, and which sanctuary”'
    claim: 'That reading names the temple'
    key: welch-praise
    url: 'https://mi.byu.edu/old-testament-reflections/exodus-15-and-the-practice-of-praise'
    quote: '3) restoration of God’s people to his presence in the temple.'
  - where: 'note 15:17 “Which mountain, and which sanctuary”'
    claim: 'One older reading: the mountain is the mount of the sanctuary, not the hill country, and the planting is in the house of the Lord'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/15.htm'
    quote: 'The "mountain of Jehovah''s inheritance" was not the hill country of Canaan (Deuteronomy 3:25), but the mountain which Jehovah had prepared for a sanctuary (Psalm 78:54) … the planting of the people of God in the house of the Lord (Psalm 92:14)'
  - where: 'note 15:17 “Which mountain, and which sanctuary”'
    claim: 'The same reading calls this the goal of the redemption from Egypt'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/15.htm'
    quote: 'This was the goal, to which the redemption from Egypt pointed, and to which the prophetic foresight of Moses raised both himself and his people in this song'
  - where: 'note 15:17 “Which mountain, and which sanctuary”'
    claim: 'Psalm 78:54 uses the song’s words of the sanctuary mountain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/78?lang=eng'
    quote: 'And he brought them to the border of his sanctuary, even to this mountain, which his right hand had purchased.'
  - where: 'note 15:17 “Which mountain, and which sanctuary”'
    claim: 'Solomon’s words at the dedication of the temple (the Church’s footnote 17a points here)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'I have surely built thee an house to dwell in, a settled place for thee to abide in for ever.'

  - where: 'note 15:20 “Miriam the prophetess”'
    claim: 'Miriam is the sister who watched the ark of bulrushes and led the women with timbrels'
    key: bd-miriam
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/miriam?lang=eng'
    quote: 'Sister of Moses (Num. 26:59); watches the ark of bulrushes (Ex. 2:4–8); leads the women with timbrels (Ex. 15:20–21); murmurs against Moses and is smitten with leprosy (Num. 12:1–15; Deut. 24:9); dies in Kadesh (Num. 20:1; Micah 6:4).'
  - where: 'note 15:20 “Miriam the prophetess”'
    claim: 'The sister is unnamed in Exodus 2; the name Miriam occurs in Exodus only at 15:20–21 (scripts/occurrences.mjs exodus "Miriam")'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/2?lang=eng'
    quote: 'And his sister stood afar off, to wit what would be done to him.'
  - where: 'note 15:20 “Miriam the prophetess”'
    claim: 'What a prophetess is'
    key: gs-prophetess
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/prophetess?lang=eng'
    quote: 'A woman who has received a testimony of Jesus and enjoys the spirit of revelation. A prophetess does not hold the priesthood or its keys.'
  - where: 'note 15:20 “Miriam the prophetess”'
    claim: 'Miriam, Deborah and Huldah acted as prophetesses without being presiding authorities'
    key: sc-knowhy-284
    url: 'https://scripturecentral.org/knowhy/what-does-the-book-of-mormon-teach-about-prophets'
    quote: 'individuals can act as prophets or prophetesses (lowercase p), as Miriam, Deborah, or Huldah, in the Bible did, receiving a divine commission to preach and testify, even though they weren’t presiding church authorities.'
  - where: 'note 15:20 “Miriam the prophetess”'
    claim: 'Miriam and Aaron’s complaint assumes the LORD had spoken by them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/12?lang=eng'
    quote: 'And they said, Hath the Lord indeed spoken only by Moses? hath he not spoken also by us? And the Lord heard it.'
  - where: 'note 15:20 “Miriam the prophetess”'
    claim: 'Micah names Miriam with Moses and Aaron as sent before Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/6?lang=eng'
    quote: 'and I sent before thee Moses, Aaron, and Miriam.'
  - where: 'note 15:20 “Miriam the prophetess”'
    claim: 'One study suggests Miriam and the women composed and first sang the song'
    key: sc-knowhy-867
    url: 'https://scripturecentral.org/knowhy/who-wrote-the-psalms'
    quote: 'Although the song is introduced in Exodus 15:1, the singing of the song is described in Exodus 20–21 … This suggests that Miriam and a group of regular Hebrew women were the people who composed and originally sang the song'
  - where: 'note 15:20 “Miriam the prophetess”'
    claim: 'Women meet the victors with timbrels and dances in Judges 11:34 and 1 Samuel 18:6 (the Church’s footnote 20d points to 1 Sam. 18:6)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/11?lang=eng'
    quote: 'his daughter came out to meet him with timbrels and with dances'
  - where: 'note 15:20 “Miriam the prophetess”'
    claim: 'The women of Israel meet Saul and David singing and dancing with tabrets'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/18?lang=eng'
    quote: 'the women came out of all cities of Israel, singing and dancing, to meet king Saul, with tabrets, with joy, and with instruments of musick.'

  - where: 'note 15:24 “The first murmuring”'
    claim: 'What it is to murmur'
    key: gs-murmur
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/murmur?lang=eng'
    quote: 'To grumble and complain against God’s purposes, plans, or servants.'
  - where: 'note 15:24 “The first murmuring”'
    claim: 'This is the first of over twenty uses of the word in the record of the wanderings'
    key: ot-manual-ex-11-19
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-11-19-the-passover-and-the-exodus?lang=eng'
    quote: 'This verse contains the first of over twenty uses of the word murmur in its various forms in the record of Israel’s wanderings.'
  - where: 'note 15:24 “The first murmuring”'
    claim: 'The Hebrew verb is nearly confined to the wilderness stories'
    key: bdb
    url: 'https://biblehub.com/hebrew/3885.htm'
    quote: 'II. [לוּן] verb murmur, only Exodus 15, 16, 17; Numbers 14, 16, 17; and Joshua 9:18'
  - where: 'note 15:24 “The first murmuring”'
    claim: 'Water is the critical need in the desert, and Israel had none left'
    key: brown-trust-lord
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/trust-lord'
    quote: 'We all know that when people travel in the desert, the most critical necessity for life is water. … they had spent their water, both for themselves and for their animals, and found themselves in dire need.'
  - where: 'note 15:24 “The first murmuring”'
    claim: 'Moses says the murmurings are against the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/16?lang=eng'
    quote: 'your murmurings are not against us, but against the Lord.'
  - where: 'note 15:24 “The first murmuring”'
