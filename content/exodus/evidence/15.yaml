    url: 'https://www.churchofjesuschrist.org/study/general-conference/1989/10/murmur-not?lang=eng'
    quote: 'Murmuring seems to come so naturally to the natural man. It crosses the scriptural spectrum of recorded complaints. We need bread. We need water. (See Num. 21:5.)'

