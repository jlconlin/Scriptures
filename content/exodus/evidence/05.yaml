chapter: 5
claims:
  - where: 'when'
    claim: 'Moses was eighty when he and Aaron spoke to Pharaoh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/7?lang=eng'
    quote: 'And Moses was fourscore years old, and Aaron fourscore and three years old, when they spake unto Pharaoh.'
  - where: 'setting'
    claim: 'In Egypt the king was the mediator between the gods and humans and was held to be divine himself'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'the king was the mediator between the gods and humans, and the only way in which the gods could be approached.'
  - where: 'setting'
    claim: 'Pharaoh was regarded as divine'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'However, it must be remembered that Pharaoh was divine himself; he simultaneously was Re, Atum, Osiris, Horus,[46] and their representative on earth, while Moses was just a man.'
  - where: 'setting'
    claim: 'The Israelites lived near the northeastern delta, where there was little stone and nearly all building was in mud brick'
    key: muhlestein-israel-egypt
    url: 'https://rsc.byu.edu/creation-sinai/israel-egypt-canaan'
    quote: 'The Bible places the Israelites near the northeastern delta of the Nile, a place with little stone, dictating that almost all building was done with mud bricks.'
  - where: 'setting'
    claim: 'King Noah''s reply to Abinadi echoes Pharaoh''s words in Exodus 5:2'
    key: sc-knowhy-731
    url: 'https://scripturecentral.org/knowhy/how-was-abinadi-a-prophet-like-unto-moses'
    quote: 'This challenge precisely echoes “the words first spoken by Pharaoh to Moses and Aaron,” who asked, “Who is the Lord, that I should obey his voice to let Israel go?” (Exodus 5:2).'
  - where: 'thread'
    claim: 'The paired “Thus saith” of the LORD and of Pharaoh has been read as a deliberate contest between the two'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'some have seen the juxtaposed use by Jehovah and Pharaoh of “Thus says” phrases as an intentional comparison and contest between the two beings'
  - where: 'thread'
    claim: 'One reading of the setback: Israel was being brought to rely on God alone, not on Pharaoh, his foremen, or their own resources'
    key: brown-trust-lord
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/trust-lord'
    quote: 'they were beginning to be forced by God to rely neither on the now capricious Pharaoh and his foremen nor on their own abilities and resources.'
  - where: 'thread'
    claim: 'God was moving Israel toward relying on Him alone'
    key: brown-trust-lord
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/trust-lord'
    quote: 'God had begun to propel Israel toward a situation in which they would have to rely on Him alone, not upon anything or anyone else.'
  - where: 'note 5:1 “Two kings, two messengers”'
    claim: '“Thus saith” was a common ancient Near Eastern way of asserting authority, and Pharaoh uses it in verse 10'
    key: ot-minute-ex-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-1-6'
    quote: 'This form of asserting authority was often used in the ancient Near East. (Note in Exodus 5:10 that Pharaoh affirmed his personal authority by stating, “Thus saith Pharaoh.”)'
  - where: 'note 5:1 “Two kings, two messengers”'
    claim: 'Some see the two “Thus saith” formulas as an intentional contest over whose word comes to pass'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'an intentional comparison and contest between the two beings, demonstrating which of the two could actually bring about that which he said.'
  - where: 'note 5:1 “Two kings, two messengers”'
    claim: 'The king was mediator between gods and humans'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'It was appropriate that Moses dealt with the king, for the king was the mediator between the gods and humans, and the only way in which the gods could be approached.'
  - where: 'note 5:1 “Two kings, two messengers”'
    claim: 'Pharaoh was divine himself, so the confrontation is a contest between Jehovah and Pharaoh'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'Pharaoh was divine himself; he simultaneously was Re, Atum, Osiris, Horus,[46] and their representative on earth, while Moses was just a man. Thus, the confrontation takes the form of a contest between Jehovah and Pharaoh.'
  - where: 'note 5:2 “The question the plagues answer”'
    claim: 'The name Pharaoh is given is Jehovah, and he believed he knew all the gods who mattered in Egypt'
    key: brown-trust-lord
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/trust-lord'
    quote: 'Pharaoh asked, “Who is the Lord [i.e., Jehovah], that I should obey his voice to let Israel go? I know not the Lord, neither will I let Israel go” (Exodus 5:2).'
  - where: 'note 5:2 “The question the plagues answer”'
    claim: 'Pharaoh believed he knew all the gods who mattered'
    key: brown-trust-lord
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/trust-lord'
    quote: 'Pharaoh believed, it is clear, that he knew all the gods who mattered as far as Egyptian affairs were concerned.'
  - where: 'note 5:2 “The question the plagues answer”'
    claim: 'Pharaoh''s “I know not the LORD” is answered by the promise of 7:5 that the Egyptians shall know'
    key: ot-minute-ex-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-1-6'
    quote: 'He admitted that he did not know the Lord. We will see later that the Lord assured Egypt that “[they] shall know that I am the Lord, when I stretch forth mine hand upon Egypt, and bring out the children of Israel from among them” (7:5).'
  - where: 'note 5:2 “King Noah asks Pharaoh’s question”'
    claim: 'Noah''s challenge in Mosiah 11:27 precisely echoes Pharaoh''s'
    key: sc-knowhy-731
    url: 'https://scripturecentral.org/knowhy/how-was-abinadi-a-prophet-like-unto-moses'
    quote: 'This challenge precisely echoes “the words first spoken by Pharaoh to Moses and Aaron,” who asked, “Who is the Lord, that I should obey his voice to let Israel go?” (Exodus 5:2).'
  - where: 'note 5:2 “King Noah asks Pharaoh’s question”'
    claim: 'The account of Abinadi is framed with elements of Moses''s confrontation with Pharaoh'
    key: sc-knowhy-731
    url: 'https://scripturecentral.org/knowhy/how-was-abinadi-a-prophet-like-unto-moses'
    quote: 'it is significant that throughout Mosiah 11–17, “the story of Abinadi is framed with elements of the story of Moses and his confrontation with Pharaoh.”'
  - where: 'note 5:2 “King Noah asks Pharaoh’s question”'
    claim: 'Both kings put their people in bondage'
    key: sc-knowhy-731
    url: 'https://scripturecentral.org/knowhy/how-was-abinadi-a-prophet-like-unto-moses'
    quote: 'Like Noah, the pharaoh also made the children of Israel live in “hard bondage” and construct many buildings for him (Exodus 1:14).'
  - where: 'note 5:2 “King Noah asks Pharaoh’s question”'
    claim: 'Both prophets had fled and returned, and both warned of plagues by which the king would know the Lord'
    key: sc-knowhy-731
    url: 'https://scripturecentral.org/knowhy/how-was-abinadi-a-prophet-like-unto-moses'
    quote: 'both Moses and Abinadi had initially served the people but had to flee out of the land for their lives. Abinadi returned “after the space of two years,” just as Moses returned to Egypt after many years.'
  - where: 'note 5:2 “King Noah asks Pharaoh’s question”'
    claim: 'Through the plagues each king would know that the Lord is the Lord'
    key: sc-knowhy-731
    url: 'https://scripturecentral.org/knowhy/how-was-abinadi-a-prophet-like-unto-moses'
    quote: 'Furthermore, through these plagues, Noah and the pharaoh would each know “know that I am the Lord” (Mosiah 12:3; Exodus 7:5).'
  - where: 'note 5:3 “Why ask for only three days?”'
    claim: 'The request gave Pharaoh the chance to let Israel go of his own free will, leaving him no one else to blame'
    key: ot-manual-ex-1-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-1-10-let-my-people-go?lang=eng'
    quote: 'God gave the pharaoh a chance to let Israel go, of his own free will, to worship God. Through his refusal the pharaoh could blame no one but himself for the consequences.'
  - where: 'note 5:3 “Why ask for only three days?”'
    claim: 'One older reading: God made His purposes known step by step so that the king might more easily grant the first demand'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/3.htm'
    quote: 'this first demand arose from the desire on the part of God to make known His purposes concerning Israel only step by step, that it might be all the easier for the hard heart of the king to grant what was required.'
  - where: 'note 5:3 “Why ask for only three days?”'
    claim: 'Pestilence and sword were, in the common belief of the nations, how the gods punished neglect of their worship'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/5.htm'
    quote: 'these are mentioned as expressive of a violent death, and as the means employed by the deities, according to the ordinary belief of the nations, to punish the neglect of their worship.'
  - where: 'note 5:7 “Bricks, straw, and a quota”'
    claim: 'Little stone in the delta, so nearly all building was in mud brick; Egyptian records attest forced brick-making by various groups'
    key: muhlestein-israel-egypt
    url: 'https://rsc.byu.edu/creation-sinai/israel-egypt-canaan'
    quote: 'a place with little stone, dictating that almost all building was done with mud bricks. Egyptian records bear witness to the forced mining and brick-making activities of various groups in Egypt, including other Semites.'
  - where: 'note 5:7 “Bricks, straw, and a quota”'
    claim: 'Tomb scenes show taskmasters seeing that a quota of bricks was made, with straw, mud and sun'
    key: muhlestein-israel-egypt
    url: 'https://rsc.byu.edu/creation-sinai/israel-egypt-canaan'
    quote: 'Scenes from Egyptian tombs record that taskmasters insured that those they oversaw made their quota of bricks, which were made using straw, mud, and the sun.'
  - where: 'note 5:7 “Bricks, straw, and a quota”'
    claim: 'The Hebrew word for straw means straw threshed fine, mixed with clay in brick-making'
    key: bdb
    url: 'https://biblehub.com/hebrew/8401.htm'
    quote: 'straw, i.e. straw threshed fine'
  - where: 'note 5:7 “Bricks, straw, and a quota”'
    claim: 'BDB: the straw was mixed with clay in brick-making (Exodus 5:7)'
    key: bdb
    url: 'https://biblehub.com/hebrew/8401.htm'
    quote: 'mixed with clay in brick-making Exodus 5:7'
  - where: 'note 5:7 “Bricks, straw, and a quota”'
    claim: 'The “tale” of bricks is the quota, which was not reduced though the straw was withheld'
    key: ot-minute-ex-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-1-6'
    quote: 'On top of that, the “tale of the bricks”—that is, their quota or tax obligation—was not to be reduced.'
  - where: 'note 5:14 “The Israelite foremen”'
    claim: 'The taskmasters were overseers over the Hebrews; the officers were Israelite brickmaking foremen'
    key: ot-minute-ex-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-1-6'
    quote: 'The taskmasters, or overseers, over the Hebrews, beat the Israelite officers (who were the brickmaking foremen), forcing them and those working under them to work harder'
  - where: 'note 5:16 “Whose fault?”'
    claim: 'The Hebrew clause is two words: a form of the verb “to sin” and “thy people”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וְ/חָטָ֥את'
  - where: 'note 5:16 “Whose fault?”'
    claim: 'The verb means to miss, go wrong, sin'
    key: bdb
    url: 'https://biblehub.com/hebrew/2398.htm'
    quote: 'verb miss (a goal or way), go wrong, sin'
  - where: 'note 5:16 “Whose fault?”'
    claim: 'The New International Version places the fault with Pharaoh''s people'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Exodus%205%3A16&version=NIV'
    quote: 'Your servants are being beaten, but the fault is with your own people.'
  - where: 'note 5:16 “Whose fault?”'
    claim: 'The New Revised Standard Version Updated Edition places the fault with Pharaoh himself'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%205%3A16&version=NRSVUE'
    quote: 'Look how your servants are beaten! But the fault is with you.'
  - where: 'note 5:16 “Whose fault?”'
    claim: 'The Septuagint has Pharaoh injuring his people'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/exodus/5.htm'
    quote: 'behold thy servants have been scourged: thou wilt therefore injure thy people.'
  - where: 'note 5:16 “Whose fault?”'
    claim: 'On the King James reading the foremen blame Pharaoh''s leaders for not providing straw'
    key: ot-minute-ex-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-1-6'
    quote: 'despite the fact that Pharaoh’s leaders were at fault by not providing the straw.'
  - where: 'note 5:22 “Moses’s complaint”'
    claim: 'One older reading, quoting Augustine: Moses''s words are inquiry and prayer, not defiance'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/5.htm'
    quote: '"These are not words of contumacy or indignation, but of inquiry and prayer" (Aug. quaest. 14).'
  - where: 'note 5:22 “Moses’s complaint”'
    claim: 'The complaint proceeded from faith'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/5.htm'
    quote: 'The question and complaint proceeded from faith, which flies to God when it cannot understand the dealings of God'
  - where: 'note 5:22 “Moses’s complaint”'
    claim: 'God answered a grief-stricken Moses with quiet assurance in the first verses of chapter 6'
    key: brown-trust-lord
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/trust-lord'
    quote: 'In answering the now grief-stricken Moses (see Exodus 5:22–23), God quietly assured him and his fellow Israelites that He would surely bring events to their proper end.'
  - where: 'explore'
    claim: 'The Church''s footnote at “returned” in verse 22 points to D&C 121:1–6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/5?lang=eng'
    quote: '“returned”: D&C 121:2 (1–6).'
  - where: 'christ'
    claim: 'For Jacob and Alma the Exodus and the Atonement stand together: deliverance from the slavery of sin as from the slavery of Pharaoh'
    key: brown-exodus-type
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/02/the-exodus-seeing-it-as-a-test-a-testimony-and-a-type?lang=eng'
    quote: 'The Atonement provided a spiritual deliverance from the slavery of sin in the same way that the Exodus provided a physical escape from the slavery of the Pharaoh.'
  - where: 'christ'
    claim: 'After the failed appeal God assured Moses that He was in charge and that the Hebrews could trust His promises'
    key: brown-exodus-type
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/02/the-exodus-seeing-it-as-a-test-a-testimony-and-a-type?lang=eng'
    quote: 'He assured them not only that he was in charge, but that the Hebrews could put all of their trust in his promises'
