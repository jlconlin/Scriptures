chapter: 31
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'Moses was on the mount forty days and forty nights; this chapter ends that stay'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/31?lang=eng'
    quote: 'And he gave unto Moses, when he had made an end of communing with him upon mount Sinai, two tables of testimony, tables of stone, written with the finger of God.'
  - where: 'setting'
    claim: 'Moses presents the builders to the people in nearly the same words in chapter 35'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/35?lang=eng'
    quote: 'And Moses said unto the children of Israel, See, the LORD hath called by name Bezaleel the son of Uri, the son of Hur, of the tribe of Judah;'
  - where: 'setting'
    claim: 'When Moses gathers the congregation, the Sabbath is the first thing he says'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/35?lang=eng'
    quote: 'Six days shall work be done, but on the seventh day there shall be to you an holy day, a sabbath of rest to the LORD: whosoever doeth work therein shall be put to death.'
  - where: 'setting'
    claim: 'The chapter has three parts: the artisans, the Sabbath, the tablets'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/31?lang=eng'
    quote: 'Artisans are inspired in building and furnishing the tabernacle—Israel is commanded to keep the Lord’s Sabbaths—The death penalty is decreed for Sabbath desecration—Moses receives the stone tablets.'
  - where: 'thread'
    claim: 'The Sabbath law at the end of the instructions means rest even from building the tabernacle'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'Perhaps the Lord wanted to help the people to know that even though they may have been eager to build this sacred structure, they had to remember that they should rest on the seventh day—even from constructing the tabernacle.'
  - where: 'thread'
    claim: 'The Sabbath is named the covenant sign only after the tabernacle and priesthood instructions, which may suggest these too belong to the Mosaic covenant'
    key: hopkin-covenant
    url: 'https://rsc.byu.edu/creation-sinai/covenant-among-covenants'
    quote: 'is identified as such only after the instructions concerning the tabernacle and the priesthood are given (Exodus 25:1–31:11) may suggest that the latter elements [of the tabernacle and the priesthood] were also intrinsically related to the Mosaic covenant'
  - where: 'thread'
    claim: 'One study reads the Spirit of God and the Sabbath as linking the tabernacle to the Creation'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'The Sabbath, therefore, forms a bridge, an inclusio, linking creation with cultus as its climax,30 the tabernacle manifestly created as a mini-cosmos oriented to the Sabbath.'

  # ---------- plain ----------
  - where: 'section 1 plain'
    claim: '“Cunning works” may be rendered artistic designs; “cloths of service” are officiating garments; “his furniture” is its utensils'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/31?lang=eng'
    quote: 'OR artistic designs.'
  - where: 'section 1 plain'
    claim: '“Wise hearted” and “wisdom” here are skill in technical work'
    key: bdb
    url: 'https://biblehub.com/hebrew/2450.htm'
    quote: '1 skilful in technical work; artificers Isaiah 3:3; sailors Ezekiel 27:8 … artisans of tabernacle and temple and their furniture Exodus 28:3; Exodus 31:6'

  # ---------- note 31:2 ----------
  - where: 'note 31:2 “Bezaleel and Aholiab”'
    claim: 'To call by name is to choose or appoint for a particular work'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/31.htm'
    quote: 'To "call by name" is to choose or appoint by name for a particular work (cf. Isaiah 45:3-4).'
  - where: 'note 31:2 “Bezaleel and Aholiab”'
    claim: 'Bezaleel is the master-builder, named first and in places alone; one older reading identifies his grandfather with the Hur of 17:10 and 24:14'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/31.htm'
    quote: 'Bezaleel was a grandson of Hur, of the tribe of Judah, who is mentioned in Exodus 17:10; Exodus 24:14, and was called to be the master-builder, to superintend the whole of the building and carry out the artistic work'
  - where: 'note 31:2 “Bezaleel and Aholiab”'
    claim: 'Bezaleel is always mentioned first and sometimes alone'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/31.htm'
    quote: 'consequently he is not only invariably mentioned first (Exodus 35:30; Exodus 36:1-2), but in the accounts of the execution of the separate portions he is mentioned alone (Exodus 37:1; Exodus 38:22).'
  - where: 'note 31:2 “Bezaleel and Aholiab”'
    claim: 'Another older commentary finds no sufficient grounds for identifying the two Hurs'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/31.htm'
    quote: 'There are no sufficient grounds for identifying the Ḥur here with the Ḥur of Exodus 17:10, Exodus 24:14.'
  - where: 'note 31:2 “Bezaleel and Aholiab”'
    claim: 'Aholiab is described as an engraver and embroiderer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/38?lang=eng'
    quote: 'And with him was Aholiab, son of Ahisamach, of the tribe of Dan, an engraver, and a cunning workman, and an embroiderer in blue, and in purple, and in scarlet, and fine linen.'
  - where: 'note 31:2 “Bezaleel and Aholiab”'
    claim: 'Wise-hearted women spun for the tabernacle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/35?lang=eng'
    quote: 'And all the women that were wise hearted did spin with their hands, and brought that which they had spun, both of blue, and of purple, and of scarlet, and of fine linen.'
  - where: 'note 31:2 “Bezaleel and Aholiab”'
    claim: 'Chronicles gives Hur, Uri, Bezaleel in the line of Judah (through Caleb)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/2?lang=eng'
    quote: 'And Hur begat Uri, and Uri begat Bezaleel.'
  - where: 'note 31:2 “Bezaleel and Aholiab”'
    claim: 'The brasen altar Bezaleel made stood before the tabernacle in Solomon’s day (at Gibeon, 2 Chr. 1:3)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/1?lang=eng'
    quote: 'Moreover the brasen altar, that Bezaleel the son of Uri, the son of Hur, had made, he put before the tabernacle of the Lord: and Solomon and the congregation sought unto it.'
  - where: 'note 31:2 “Bezaleel and Aholiab”'
    claim: 'Moses adds that the LORD put it in their hearts to teach'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/35?lang=eng'
    quote: 'And he hath put in his heart that he may teach, both he, and Aholiab, the son of Ahisamach, of the tribe of Dan.'

  # ---------- note 31:3 ----------
  - where: 'note 31:3 “The Spirit of God given for a craft”'
    claim: 'The “wisdom” of verses 3 and 6 is classed by the lexicon as skill in technical work'
    key: bdb
    url: 'https://biblehub.com/hebrew/2451.htm'
    quote: '1 skill in war Isaiah 10:13; in technical work Exodus 28:3; Exodus 31:3,6; Exodus 35:26,31,35; Exodus 36:1,2(P), compare 1 Kings 7:14'
  - where: 'note 31:3 “The Spirit of God given for a craft”'
    claim: 'The “wise hearted” are those skilful in technical work, including the artisans of the tabernacle and the women who spun'
    key: bdb
    url: 'https://biblehub.com/hebrew/2450.htm'
    quote: '1 skilful in technical work; artificers Isaiah 3:3 … artisans of tabernacle and temple and their furniture Exodus 28:3; Exodus 31:6; Exodus 35:10; Exodus 36:1,2,4,8 (P) … women in spinning Exodus 35:25 (P)'
  - where: 'note 31:3 “The Spirit of God given for a craft”'
    claim: 'It is likely that Bezaleel and Aholiab learned their skills as slaves in Egypt'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'It is likely that Bezaleel and Aholiab learned their skills while enslaved in Egypt, working as artisans on the wonders there. Here we see that the Lord used these painful lessons to make craftsmen that could bless the lives of the Israelites.'
  - where: 'note 31:3 “The Spirit of God given for a craft”'
    claim: 'One study reads the Spirit of God as instrumental in both the Creation (Gen. 1:2) and the tabernacle (Ex. 31:1–11)'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'we merely recall how the רוח of God is instrumental both in the building of the cosmic temple, the world (Genesis 1.2), and in the micro-cosmic world, the tabernacle (Exodus 31.1-11)'
  - where: 'note 31:3 “The Spirit of God given for a craft”'
    claim: 'The same study calls the tabernacle a micro-cosmos within the macro'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'the tabernacle/temple constitutes something of a new creation within the old, a micro-cosmos within the macro, designed to mediate the paradisal Presence of the Creator.'
  - where: 'note 31:3 “The Spirit of God given for a craft”'
    claim: 'Genesis 1:2 has the phrase “the Spirit of God”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/1?lang=eng'
    quote: 'And the earth was without form, and void; and darkness was upon the face of the deep. And the Spirit of God moved upon the face of the waters.'

  # ---------- note 31:13 structure ----------
  - where: 'note 31:13 “Why the Sabbath is commanded again here”'
    claim: 'The Sabbath is the last thing taught in the command to build the tabernacle; rest applied even to the building'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'It is interesting to note that the very last thing that the Lord taught as part of His command to build the tabernacle was to honor the Sabbath. … they should rest on the seventh day—even from constructing the tabernacle.'
  - where: 'note 31:13 “Why the Sabbath is commanded again here”'
    claim: 'The ban on kindling fire (35:3) would reach the fires used to work the metals'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'would not only apply to the fires they might build at their (tent) homes on the Sabbath but also to the fires needed to forge the gold, silver, and brass for the tabernacle.'
  - where: 'note 31:13 “Why the Sabbath is commanded again here”'
    claim: 'One study counts the tabernacle instructions as seven speeches, the seventh on the Sabbath'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'the tabernacle not only being completed in seven speeches (with the seventh addressing the Sabbath) and by seven acts of Moses who did “just as Yhwh commanded”'
  - where: 'note 31:13 “Why the Sabbath is commanded again here”'
    claim: 'In that study the Sabbath is a bridge linking creation and the tabernacle'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'The Sabbath, therefore, forms a bridge, an inclusio, linking creation with cultus as its climax'
  - where: 'note 31:13 “Why the Sabbath is commanded again here”'
    claim: 'Moses puts the Sabbath first when he delivers the instructions'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/35?lang=eng'
    quote: 'Six days shall work be done, but on the seventh day there shall be to you an holy day, a sabbath of rest to the LORD: whosoever doeth work therein shall be put to death.'

  # ---------- note 31:13 sign ----------
  - where: 'note 31:13 “The sign of the covenant”'
    claim: 'The rainbow, circumcision and the Sabbath are the signs of the covenants with Noah, Abraham and Israel'
    key: hopkin-covenant
    url: 'https://rsc.byu.edu/creation-sinai/covenant-among-covenants'
    quote: 'The sign that God enjoined Abraham and his descendants to make is that of circumcision (Genesis 17:9–10, 13–14), while the sign of the Mosaic covenant was the keeping of the Sabbath day'
  - where: 'note 31:13 “The sign of the covenant”'
    claim: 'Signs are acts repeated in later generations to confirm the covenant'
    key: hopkin-covenant
    url: 'https://rsc.byu.edu/creation-sinai/covenant-among-covenants'
    quote: 'The main difference between oaths and signs is that signs are physical acts that continue to be repeated in subsequent generations to confirm the existence of the covenant.'
  - where: 'note 31:13 “The sign of the covenant”'
    claim: 'The word “sign” in Exodus 31:13 is Hebrew ’ot (H226)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'א֨וֹת'
  - where: 'note 31:13 “The sign of the covenant”'
    claim: 'The word “token” of the rainbow in Genesis 9:13 is the same Hebrew word (H226)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'לְ/א֣וֹת'
  - where: 'note 31:13 “The sign of the covenant”'
    claim: 'The rainbow is called a token (’ot) in the King James Version'
    key: hopkin-covenant
    url: 'https://rsc.byu.edu/creation-sinai/covenant-among-covenants'
    quote: 'One example of a sign of a covenant is the rainbow provided by God in Genesis 9:12–16, translated as a “token” (אות/‘ot) in the King James Version (KJV).'
  - where: 'note 31:13 “The sign of the covenant”'
    claim: 'Genesis calls the bow and circumcision each a token of a covenant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/17?lang=eng'
    quote: 'And ye shall circumcise the flesh of your foreskin; and it shall be a token of the covenant betwixt me and you.'

  # ---------- note 31:14 ----------
  - where: 'note 31:14 “The death penalty for breaking the Sabbath”'
    claim: 'One older reading: desecrating the Sabbath was punished with death as a breach of the covenant, the Sabbath being its sign'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/31.htm'
    quote: 'It was therefore a holy thing for Israel (Exodus 31:14), the desecration of which would be followed by the punishment of death, as a breach of the covenant.'
  - where: 'note 31:14 “The death penalty for breaking the Sabbath”'
    claim: 'A man found gathering sticks on the Sabbath was held until the LORD’s word was given'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/15?lang=eng'
    quote: 'And they put him in ward, because it was not declared what should be done to him.'
  - where: 'note 31:14 “The death penalty for breaking the Sabbath”'
    claim: 'He was put to death outside the camp'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/15?lang=eng'
    quote: 'And all the congregation brought him without the camp, and stoned him with stones, and he died; as the Lord commanded Moses.'

  # ---------- note 31:17 ----------
  - where: 'note 31:17 “‘He rested, and was refreshed’”'
    claim: 'The Hebrew verb means take breath, refresh oneself, and the lexicon lists it at Ex. 23:12, 2 Sam. 16:14 and Ex. 31:17'
    key: bdb
    url: 'https://biblehub.com/hebrew/5314.htm'
    quote: 'Niph`al Imperfect3masculine singular יִנָּפֵשׁ Exodus 23:12 (E) 2 Samuel 16:14; וַיִּנָּפַ֑שׁ Exodus 31:17 (P); — take breath, refresh oneself.'
  - where: 'note 31:17 “‘He rested, and was refreshed’”'
    claim: 'David and his people came weary and refreshed themselves'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/16?lang=eng'
    quote: 'And the king, and all the people that were with him, came weary, and refreshed themselves there.'

  # ---------- note 31:18 ----------
  - where: 'note 31:18 “The tables of testimony”'
    claim: '“Testimony” is the testimony of the Ten Words on the tables; the ark is named for containing them'
    key: bdb
    url: 'https://biblehub.com/hebrew/5715.htm'
    quote: '1 testimony of the Ten Words on the tables as a solemn divine charge, ׳לֻחֹת הע Exodus 31:18; Exodus 32:15; Exodus 34:29 (P), ׳הע Exodus 25:16,21; Exodus 40:20 (P); ark as containing tables'
  - where: 'note 31:18 “The tables of testimony”'
    claim: 'Moses repeats “written with the finger of God” in Deuteronomy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/9?lang=eng'
    quote: 'And the Lord delivered unto me two tables of stone written with the finger of God; and on them was written according to all the words, which the Lord spake with you in the mount'

  # ---------- christ ----------
  - where: 'christ'
    claim: 'Jesus called Himself Lord of the Sabbath'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/2?lang=eng'
    quote: 'Therefore the Son of man is Lord also of the sabbath.'
  - where: 'christ'
    claim: 'Paul sets tables of stone beside the tables of the heart'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/2-cor/3?lang=eng'
    quote: 'written not with ink, but with the Spirit of the living God; not in tables of stone, but in fleshy tables of the heart.'

  # ---------- explore ----------
  - where: 'explore'
    claim: 'Hebrews 4 speaks of a rest that remains for the people of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/4?lang=eng'
    quote: 'There remaineth therefore a rest to the people of God.'
