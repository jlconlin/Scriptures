page: proved-in-the-wilderness
claims:
  - where: 'section “One verb, two directions”'
    claim: 'The five Exodus verses are one Hebrew verb (nasah, H5254): proved/prove with God as subject (15:25; 16:4; 20:20), tempt/tempted with Israel as subject (17:2, 7)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'נִסָּֽ/הוּ'
  - where: 'section “One verb, two directions”'
    claim: 'Connection made by this page: the five verses set in order as one verb in two directions (the Lord proves at Marah and the manna; Israel tempts at Massah; the Lord comes to prove at Sinai)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/17?lang=eng'
    quote: 'because they tempted the LORD, saying, Is the LORD among us, or not?'
  - where: 'section “One verb, two directions”'
    claim: 'The Church''s footnote at Ex. 15:25 sends “proved” to Deut. 8:2, D&C 98:14 and Abr. 3:25'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/15?lang=eng'
    quote: 'Deut. 8:2; D&C 98:14 (12–14); 124:55; 132:51; Abr. 3:25.'
  - where: 'section “One verb, two directions”'
    claim: 'In Ps. 95:9 “tempted” is nasah (H5254) and “proved” is bachan (H974), another verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'בְּ֝חָנ֗וּ/נִי'
  - where: 'section “Marah and the manna”'
    claim: 'Like the tree at Marah, Jesus Christ offers His healing power to take away bitterness'
    key: scripture-helps-ex-14
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/14-exodus-14-18?lang=eng'
    quote: 'Like the tree that brought healing to Marah’s waters, Jesus Christ offers His healing power to cleanse us and remove bitterness from our lives.'
  - where: 'section “Marah and the manna”'
    claim: 'The daily manna was meant to teach faith, one day at a time (Christofferson, quoted)'
    key: scripture-helps-ex-14
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/14-exodus-14-18?lang=eng'
    quote: 'By providing a daily sustenance, one day at a time, Jehovah was trying to teach faith to a nation'
  - where: 'section “Massah”'
    claim: '“Tempt” in Deut. 6:16 means “put to the test”; Israel was told not to test God as at Massah'
    key: scripture-helps-dt-6
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/18-deuteronomy-6-8-15-18-29-30-34?lang=eng'
    quote: 'The Hebrew word translated as “tempt” in the King James Version of the Bible means to “put to the test.” Therefore, in this passage the Israelites were commanded to not test God as they had done in Massah'
  - where: 'section “Massah”'
    claim: 'Ps. 95:8–9 names the day of temptation in the wilderness; Heb. 3:8–9 takes it up'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/3?lang=eng'
    quote: 'Harden not your hearts, as in the provocation, in the day of temptation in the wilderness:'
  - where: 'section “God is come to prove you”'
    claim: 'One purpose of the manna was to teach that man lives by every word from the Lord (Deut. 8:3)'
    key: scripture-helps-ex-14
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/14-exodus-14-18?lang=eng'
    quote: 'He taught that one of the purposes of the Lord providing manna was to help them know “that man doth not live by bread only, but by every word that proceedeth out of the mouth of the Lord.”'
  - where: 'section “The Savior in the wilderness”'
    claim: 'Elder Romney: Jesus answered the three temptations from Deut. 8:3, 6:16 and 6:13'
    key: ot-manual-dt-1-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-1-16-an-exhortation-to-obedience-part-1?lang=eng'
    quote: 'When the devil tempted Him to turn the stones into bread, He countered by quoting from Deuteronomy'
  - where: 'section “The Savior in the wilderness”'
    claim: 'Jesus’s reply “Thou shalt not tempt the Lord thy God” is Deut. 6:16, the command about Massah'
    key: scripture-helps-dt-6
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/18-deuteronomy-6-8-15-18-29-30-34?lang=eng'
    quote: 'In response, Jesus referenced Deuteronomy 6:16, saying, “Thou shalt not tempt the Lord thy God.”'
  - where: 'section “The Savior in the wilderness”'
    claim: 'Luke’s account of the temptations “may be intended to recall the Exodus”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'the story of Jesus’ temptations may be intended to recall the Exodus'
  - where: 'section “The Savior in the wilderness”'
    claim: 'The Church’s footnote on the forty days (Matt. 4:2) points to Ex. 24:18'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/4?lang=eng'
    quote: 'TG Fast, Fasting. Ex. 24:18.'
  - where: 'section “The bread and the rock”'
    claim: 'Manna was a type and symbol of the Bread of Life (Christofferson)'
    key: christofferson-daily-bread
    url: 'https://speeches.byu.edu/talks/d-todd-christofferson/give-us-this-day-our-daily-bread'
    quote: 'Above all, remember that we have Him of whom manna was a type and symbol, the very Bread of Life, the Redeemer.'
  - where: 'section “The bread and the rock”'
    claim: 'Paul: the fathers ate the same spiritual meat, drank of the spiritual Rock, “that Rock was Christ”; “Neither let us tempt Christ”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/10?lang=eng'
    quote: 'Neither let us tempt Christ, as some of them also tempted, and were destroyed of serpents.'
  - where: 'section “The bread and the rock”'
    claim: 'Scripture calls Christ both “the rock” and the source of living water'
    key: scripture-helps-ex-14
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/14-exodus-14-18?lang=eng'
    quote: 'The scriptures refer to Jesus Christ as both “the rock” and the source of living water.'
