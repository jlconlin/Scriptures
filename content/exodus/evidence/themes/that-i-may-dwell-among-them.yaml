page: that-i-may-dwell-among-them
claims:
  - where: 'section “From the mountain to a tent”'
    claim: 'The verb “abode” in 24:16 is Strong’s 7931 (shakan)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וַ/יִּשְׁכֹּ֤ן'
  - where: 'section “From the mountain to a tent”'
    claim: 'The verb “dwell” in 25:8 is the same verb (7931); the verb occurs in Exodus in just five verses'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וְ/שָׁכַנְתִּ֖י'
  - where: 'section “From the mountain to a tent”'
    claim: 'The verb “dwell” in 29:45 is the same verb (7931)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וְ/שָׁ֣כַנְתִּ֔י'
  - where: 'section “From the mountain to a tent”'
    claim: 'The verb “dwell” in 29:46 is the same verb (7931)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'לְ/שָׁכְנִ֣/י'
  - where: 'section “From the mountain to a tent”'
    claim: 'The verb “abode” in 40:35 is the same verb (7931), the fifth verse'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'שָׁכַ֥ן'
  - where: 'section “From the mountain to a tent”'
    claim: '“Tabernacle” (4908, mishkan) comes from shakan'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/4908.htm'
    quote: 'From shakan; a residence (including a shepherd''s hut, the lair of animals, figuratively, the grave; also the Temple); specifically, the Tabernacle'
  - where: 'section “Not in the midst of thee”'
    claim: '“In the midst of thee” at 33:3 is the Hebrew noun qereb (7130)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'בְּ/קִרְבְּ/ךָ֗'
  - where: 'section “Not in the midst of thee”'
    claim: '“Among us” at 34:9 is the same noun, qereb (7130)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'בְּ/קִרְבֵּ֑/נוּ'
  - where: 'section “Not in the midst of thee”'
    claim: 'Connection made by this page: set beside 33:3 (“I will not go up in the midst of thee; for thou art a stiffnecked people”), the prayer of 34:9 (“let my Lord… go among us; for it is a stiffnecked people”) uses its words, on the shared Hebrew noun and the same phrase “stiffnecked people”; the reason given there for not going is the reason Moses gives for asking'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'let my Lord, I pray thee, go among us'
  - where: 'section “The glory filled the tabernacle”'
    claim: '“Abode” at 40:35 is the verb of 24:16 (7931)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'שָׁכַ֥ן'
  - where: 'section “The glory filled the tabernacle”'
    claim: 'One study sets the glory filling the tent (40.34) beside its dwelling on the mount (24.16)'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'which now ''fills'' again and again the ''dwelling'' of the tent (40.34), just as it had ''taken dwelling'' upon the mount (24.16)'
  - where: 'section “Dwelt among us”'
    claim: 'The Greek verb of John 1:14 is “to tent or encamp,” used specially for “to reside (as God did in the Tabernacle of old”'
    key: strongs-greek
    url: 'https://biblehub.com/greek/4637.htm'
    quote: 'to tent or encamp, i.e. (figuratively) to occupy (as a mansion) or (specially), to reside (as God did in the Tabernacle of old'
  - where: 'opening'
    claim: 'The Greek verb is used at John 1:14 and Revelation 21:3 (among us; with one)'
    key: strongs-greek
    url: 'https://biblehub.com/greek/4637.htm'
    quote: 'ἐν ἡμῖν, among us, John 1:14; μετά τίνος, with one, Revelation 21:3'
  - where: 'section “Dwelt among us”'
    claim: 'The Topical Guide entry “God, Presence of” lists Ex. 13:21, Ex. 29:45, John 1:14, Rev. 7:15 and Rev. 21:3'
    key: tg-god-presence-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/tg/god-presence-of?lang=eng'
    quote: 'I will dwell among the children of Israel, Ex. 29:45'
  - where: 'section “Dwelt among us”'
    claim: 'The Topical Guide entry “God, Presence of” also lists Ex. 13:21'
    key: tg-god-presence-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/tg/god-presence-of?lang=eng'
    quote: 'Lord went before … in a pillar of a cloud, Ex. 13:21'
  - where: 'section “Not in the midst of thee”'
    claim: '“Stiffnecked people” at 33:3 is the same three Hebrew words (H5971 H7186 H6203) as at 34:9'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'עֹ֨רֶף֙'
  - where: 'section “Dwelt among us”'
    claim: 'The tabernacle, and the ark within it, represented God’s presence among His people; Jesus Christ was God’s presence among His people'
    key: cfm-ot-2022-thoughts-19
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-individuals-and-families-old-testament-2022/19-thoughts?lang=eng'
    quote: 'Just as the tabernacle, and the ark within it, represented God’s presence among His people, Jesus Christ was God’s presence among His people'
