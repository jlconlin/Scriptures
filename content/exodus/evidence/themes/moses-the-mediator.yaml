page: moses-the-mediator
claims:
  - where: 'section “Who bears”'
    claim: 'A priest is a mediator between his people and God, and the people must stand afar off'
    key: bd-priests
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/priests?lang=eng'
    quote: 'The essential idea of a Hebrew priest was that of a mediator between his people and God by representing them officially in worship and sacrifice. By virtue of his office he was able to draw nigh to God, while they, because of their sins and infirmities, must needs stand afar off.'
  - where: 'section “A prophet like unto me”'
    claim: 'Deut. 18:16 ties the promise to the Horeb request'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/18?lang=eng'
    quote: 'According to all that thou desiredst of the Lord thy God in Horeb in the day of the assembly, saying, Let me not hear again the voice of the Lord my God'
  - where: 'section “A prophet like unto me”'
    claim: 'Deut. 18:18 promise of a Prophet like Moses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/18?lang=eng'
    quote: 'I will raise them up a Prophet from among their brethren, like unto thee, and will put my words in his mouth'
  - where: 'section “A prophet like unto me”'
    claim: 'Peter applies the promise (Acts 3:22)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/3?lang=eng'
    quote: 'A prophet shall the Lord your God raise up unto you of your brethren, like unto me; him shall ye hear in all things whatsoever he shall say unto you.'
  - where: 'section “A prophet like unto me”'
    claim: 'Christ says “I am he of whom Moses spake” (3 Ne. 20:23)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/20?lang=eng'
    quote: 'Behold, I am he of whom Moses spake, saying: A prophet shall the Lord your God raise up unto you of your brethren, like unto me; him shall ye hear in all things whatsoever he shall say unto you.'
  - where: 'section “A prophet like unto me”'
    claim: 'God to Moses: in the similitude of the Only Begotten (Moses 1:6)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng'
    quote: 'thou art in the similitude of mine Only Begotten'
  - where: 'section “Blot me out”'
    claim: 'Ex. 32:33: the Lord’s answer in the text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/32?lang=eng'
    quote: 'Whosoever hath sinned against me, him will I blot out of my book.'
  - where: 'section “Blot me out”'
    claim: 'Moses’s pleading can remind us of Jesus Christ, our advocate'
    key: scripture-helps-ex-19
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/15-exodus-19-20-24-31-34?lang=eng'
    quote: 'Moses’s pleading with the Lord on behalf of his people can remind us of Jesus Christ, who is our advocate with the Father.'
  - where: 'section “Who bears”'
    claim: 'The Church’s footnote at Ex. 28:38 gives “OR atone for” for “bear”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/28?lang=eng'
    quote: '38a “bear”: OR atone for.'
  - where: 'section “Who bears”'
    claim: '“Bear” in Ex. 28:38 is Hebrew nasa (H5375)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וְ/נָשָׂ֨א'
  - where: 'section “Who bears”'
    claim: '“Bear” in Ex. 25:27 (the staves, to bear the table) is nasa (H5375), the ordinary carrying sense'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'לָ/שֵׂ֖את'
  - where: 'section “Who bears”'
    claim: '“Forgive” in Ex. 32:32 is nasa (H5375)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'תִּשָּׂ֣א'
  - where: 'section “Who bears”'
    claim: '“Bare” in Isa. 53:12 is nasa (H5375)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'נָשָׂ֔א'
  - where: 'section “Who bears”'
    claim: 'Connection made by this page: Ex. 28:38 (the priest is to bear the iniquity of the holy things), Ex. 32:32 (Moses asks the Lord to forgive the people’s sin) and Isa. 53:12 (the servant “bare the sin of many, and made intercession”) set side by side, on the one Hebrew verb with sin or iniquity as its object'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/53?lang=eng'
    quote: 'he bare the sin of many, and made intercession for the transgressors.'
  - where: 'section “The mediator of the new covenant”'
    claim: 'JST Gal. 3:19–20 names Moses and Jesus Christ as mediators of the two covenants'
    key: jst-gal-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-gal/3?lang=eng'
    quote: 'Moses, who was ordained by the hand of angels to be a mediator of this first covenant, (the law.) Now this mediator was not a mediator of the new covenant; but there is one mediator of the new covenant, who is Christ'
  - where: 'section “The mediator of the new covenant”'
    claim: '1 Tim. 2:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-tim/2?lang=eng'
    quote: 'For there is one God, and one mediator between God and men, the man Christ Jesus'
  - where: 'section “The mediator of the new covenant”'
    claim: 'Heb. 3:5–6: Moses a servant, Christ a son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/3?lang=eng'
    quote: 'Moses verily was faithful in all his house, as a servant'
  - where: 'section “The mediator of the new covenant”'
    claim: 'Heb. 3:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/3?lang=eng'
    quote: 'But Christ as a son over his own house'
  - where: 'section “The mediator of the new covenant”'
    claim: 'Heb. 7:25: He ever liveth to make intercession'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/7?lang=eng'
    quote: 'seeing he ever liveth to make intercession for them.'
  - where: 'section “The mediator of the new covenant”'
    claim: 'Heb. 9:15: the mediator of the new testament'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/9?lang=eng'
    quote: 'he is the mediator of the new testament, that by means of death, for the redemption of the transgressions that were under the first testament, they which are called might receive the promise of eternal inheritance'
  - where: 'section “The mediator of the new covenant”'
    claim: 'D&C 45:4: the Advocate pleads the sufferings, death and shed blood'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'Father, behold the sufferings and death of him who did no sin, in whom thou wast well pleased; behold the blood of thy Son which was shed'
  - where: 'section “The mediator of the new covenant”'
    claim: 'Connection made by this page: Moses pleads the oath to Abraham, Isaac and Israel (Ex. 32:13) and offers himself, and is answered that the one who sinned will be blotted out (Ex. 32:33); in D&C 45 the Advocate pleads His own blood, already shed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/32?lang=eng'
    quote: 'Remember Abraham, Isaac, and Israel, thy servants, to whom thou swarest by thine own self'
