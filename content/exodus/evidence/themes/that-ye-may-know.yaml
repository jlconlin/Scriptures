page: that-ye-may-know
claims:
  - where: opening
    claim: 'The Hebrew verb behind “know” is one verb, yada‘ (H3045), in 5:2 and 7:5 (and throughout the run)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וְ/יָדְע֤וּ'
  - where: opening
    claim: 'The Hebrew verb behind “know” in 5:2'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'יָדַ֨עְתִּי֙'
  - where: opening
    claim: 'Connection made by this page: after a first promise to Israel (6:7), the verses turn to Egypt (to know by plague and sea) and back to Israel (by rescue, bread, and at last His dwelling), and Moses asks to know Him; the words set side by side are 7:5 and 29:46'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/7?lang=eng'
    quote: 'And the Egyptians shall know that I am the LORD, when I stretch forth mine hand upon Egypt, and bring out the children of Israel from among them.'
  - where: section “Who is the LORD?”
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: section “Who is the LORD?”
    claim: 'Jehovah is the premortal Jesus Christ; “Lord” in the Old Testament usually means Jehovah'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary'
  - where: section “Egypt, by plague and by the sea”
    claim: 'The frogs (8:10) and the firstborn (11:7) are also verses of knowing; 11:7 form is plural “ye may know”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'תֵּֽדְע֔וּ/ן'
  - where: section “Egypt, by plague and by the sea”
    claim: 'The Church’s edition cross-references 7:5 “know” to 14:4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/7?lang=eng'
    quote: '5a “know”: Ex. 14:4.'
  - where: section “Who is the LORD?”
    claim: 'Pharaoh admitted he did not know the Lord; the Lord assured Egypt they shall know (7:5)'
    key: ot-minute-ex-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-1-6'
    quote: 'He admitted that he did not know the Lord. We will see later that the Lord assured Egypt that “[they] shall know that I am the Lord, when I stretch forth mine hand upon Egypt, and bring out the children of Israel from among them” (7:5).'
  - where: section “Egypt, by plague and by the sea”
    claim: 'The Egyptians’ knowing at the sea: 14:4 and 14:18 (the last verse with Egypt as the one to know)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וְ/יָדְע֥וּ'
  - where: section “Egypt, by plague and by the sea”
    claim: 'The plagues’ stated purposes: that Pharaoh and the Egyptians shall know, and that there is none like the LORD'
    key: scripture-helps-ex-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/13-exodus-7-13?lang=eng'
    quote: 'The Lord said that through the plagues He would send, Pharaoh and the Egyptians “shall know that I am the Lord” and that “there is none like me in all the earth.”'
  - where: section “Egypt, by plague and by the sea”
    claim: 'The plagues demonstrate the Lord’s superior status as the true God'
    key: sc-knowhy-631
    url: 'https://scripturecentral.org/knowhy/why-were-particular-plagues-sent-against-egypt'
    quote: 'a series of ten plagues is brought down upon Egypt to compel Pharaoh’s hand and demonstrate the Lord’s superior status as the true God (Exodus 7–12).'
  - where: section “Israel, by rescue and bread”
    claim: 'The purpose of the signs, “ye may know how that I am the Lord,” was also passed on to Israel'
    key: ot-minute-ex-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-7-13'
    quote: 'This purpose, that “ye may know how that I am the Lord,” was also passed on to the children of Israel.'
  - where: section “Now I know”
    claim: '18:11 is the only verse in which someone says he has come to know the LORD; Pharaoh’s “I know not” (5:2) is the same verb form (yada‘ qal perfect, yāda‘tî), with a negative; no later verse has a foreigner as the one to know'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'יָדַ֔עְתִּי'
  - where: section “Now I know”
    claim: 'Jethro’s “Now I know” is exactly the point God made to Israel during the plagues'
    key: ot-minute-ex-18
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-18-20'
    quote: 'This was exactly the point that God made to the Israelites during the plagues'
  - where: section “By His dwelling, and by His sign”
    claim: 'The Church’s edition cross-references 29:45 to 6:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/29?lang=eng'
    quote: 'Ex. 6:7.'
  - where: section “By His dwelling, and by His sign”
    claim: 'Connection made by this page: the words “they shall know that I am the LORD,” said three times of the Egyptians (7:5; 14:4, 14:18), are said once of Israel, at 29:46'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/29?lang=eng'
    quote: 'And they shall know that I am the LORD their God, that brought them forth out of the land of Egypt, that I may dwell among them: I am the LORD their God.'
  - where: section “By His dwelling, and by His sign”
    claim: 'The Hebrew form wĕyādĕ‘û, “they shall know that I am the LORD,” occurs only at 7:5, 14:4 and 14:18 (of the Egyptians) and 29:46 (its only use of Israel)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וְ/יָדְע֗וּ'
  - where: section “By His dwelling, and by His sign”
    claim: 'The Sabbath is a sign of the covenant relationship'
    key: scripture-helps-ex-19
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/15-exodus-19-20-24-31-34?lang=eng'
    quote: 'The Lord taught the Israelites that He gave the Sabbath day to them as a “sign” of their covenant relationship with Him.'
  - where: section “That I may know thee”
    claim: 'The Church’s edition points 33:12 “know” to John 10:14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/33?lang=eng'
    quote: '12b “know”: John 10:14'
  - where: section “That I may know thee”
    claim: 'John 10:14 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/10?lang=eng'
    quote: 'I am the good shepherd, and know my sheep, and am known of mine.'
  - where: section “That I may know thee”
    claim: 'Connection made by this page: Moses’s “that I may know thee” (33:13) set beside John 17:3, “that they might know thee”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/17?lang=eng'
    quote: 'And this is life eternal, that they might know thee the only true God, and Jesus Christ, whom thou hast sent.'
  - where: section “That I may know thee”
    claim: 'Eternal life is to live forever as families in God’s presence'
    key: gs-eternal-life
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/eternal-life?lang=eng'
    quote: 'To live forever as families in God’s presence (D&C 132:19–20, 24, 55).'
  - where: section “That I may know thee”
    claim: 'Without God there would be no mortal or eternal life'
    key: hales-seeking-know
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/10/seeking-to-know-god-our-heavenly-father-and-his-son-jesus-christ?lang=eng'
    quote: 'Indeed, without God, there would be no mortal or eternal life.'
