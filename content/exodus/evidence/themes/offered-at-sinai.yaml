page: offered-at-sinai
claims:
  - where: 'section “The offer”'
    claim: 'One study reads Ex. 19 as God inviting all of Israel to be priests'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'God is inviting all of Israel to be priests, to have an intimate, personal relationship with him.'
  - where: 'section “The offer”'
    claim: '“Kingdom of priests” suggests a people who have received priesthood authority'
    key: scripture-helps-ex-19
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/15-exodus-19-20-24-31-34?lang=eng'
    quote: 'The phrase “kingdom of priests” suggests a group of people who have received God’s priesthood authority and are responsible for administering the ordinances of the gospel.'
  - where: 'section “Afar off”'
    claim: 'One study describes the people at Ex. 20:18–21 as removing themselves from God’s presence'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'it presents an Israelite community that is not seeking to enter into the presence of God but presents one that is actively engaged in removing itself from God’s presence.'
  - where: 'section “Afar off”'
    claim: 'Another study cautions that D&C 84:24 does not amount to a wholesale rejection of the covenant'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'Doctrine and Covenants 84:24 tells us, “They hardened their hearts and could not endure his [God’s] presence.” This does not, however, amount to a wholesale rejection of the covenant.'
  - where: 'section “Not according to the first”'
    claim: 'The breaking of the tables reflected Israel’s broken covenant'
    key: scripture-helps-ex-19
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/15-exodus-19-20-24-31-34?lang=eng'
    quote: 'Moses’s act of breaking the tablets reflected Israel’s broken covenant.'
  - where: 'section “Not according to the first”'
    claim: 'JST Ex. 34:1–2: the second tables are not according to the first; the priesthood is taken away'
    key: jst-ex-34
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-ex/34?lang=eng'
    quote: 'it shall not be according to the first, for I will take away the priesthood out of their midst; therefore my holy order, and the ordinances thereof, shall not go before them'
  - where: 'section “Not according to the first”'
    claim: 'JST Deut. 10:2: the first tables had the everlasting covenant of the holy priesthood'
    key: jst-deut-10
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-deut/10?lang=eng'
    quote: 'save the words of the everlasting covenant of the holy priesthood'
  - where: 'section “Not according to the first”'
    claim: 'The law of Moses was a good law and a preparatory gospel to bring its adherents to Christ'
    key: bd-law-of-moses
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/law-of-moses?lang=eng'
    quote: 'The law as given through Moses was a good law, although adapted to a lower spiritual capacity'
  - where: 'section “Not according to the first”'
    claim: 'The law functioned under the Aaronic Priesthood as a preparatory gospel to bring its adherents to Christ'
    key: bd-law-of-moses
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/law-of-moses?lang=eng'
    quote: 'The law functioned under the Aaronic Priesthood and was a preparatory gospel to bring its adherents to Christ.'
  - where: 'section “A promise being left”'
    claim: 'One study says the writer of Hebrews believed the invitation was in effect for the early Christian community'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'the writer of Hebrews believed that the invitation associated with the narrative, to enter into God’s presence, was in effect for the early Christian community'
  - where: 'section “A promise being left”'
    claim: 'In Psalm 95 “the provocation” translates the Hebrew merība, associated with Israel’s provoking the Lord for water at Meribah'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'This term is a translation of the Hebrew word merȋbā, which is often associated with a particular event—namely, the Israelites’ provoking of the Lord for water at the site that would eventually be called Meribah.'
  - where: 'section “A promise being left”'
    claim: 'One study suggests the psalm also alludes to the Sinai variant in Exodus 20'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'Yet the term appears to also allude directly to the Sinai variant in Exodus 20'
  - where: 'section “Another mountain”'
    claim: 'Heb. 12:18–20 alludes to Exodus 20, including the people’s entreaty to Moses'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'The allusions are clear: the theophanic elements, the trumpet sound, the entreaty to Moses that he meet with God, and so forth, all point to Exodus 20.'
  - where: 'section “Another mountain”'
    claim: 'The Church’s help: fire, tempest and trumpet allude to Sinai; believers look to another mountain, Mount Zion'
    key: scripture-helps-nt-heb-7-13
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-new-testament/46-hebrews-7-13?lang=eng'
    quote: 'The reference to fire, tempest, and a trumpet in Hebrews 12:18–19 is an allusion to God’s presence on Mount Sinai'
  - where: 'section “Another mountain”'
    claim: 'Believers are to look to another mountain, Mount Zion'
    key: scripture-helps-nt-heb-7-13
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-new-testament/46-hebrews-7-13?lang=eng'
    quote: 'Believers are to look to another mountain, Mount Zion, for greater glory.'
  - where: 'section “Another mountain”'
    claim: 'Through Christ’s sacrifice we are able to enter into God’s presence'
    key: scripture-helps-nt-heb-7-13
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-new-testament/46-hebrews-7-13?lang=eng'
    quote: 'It is through Christ’s sacrifice that we are able to enter into God’s presence.'
  - where: 'section “Another mountain”'
    claim: 'The Church’s footnotes at 1 Pet. 2:9 tie “holy nation” to Ex. 19:6 and “peculiar” to Ex. 19:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-pet/2?lang=eng'
    quote: '“holy”: Ex. 19:6. TG Israel, Blessings of.'
  - where: 'section “Another mountain”'
    claim: 'D&C 107:19 gives the higher priesthood’s privilege in the wording of Heb. 12:22–24; the Church’s footnote joins them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/107?lang=eng'
    quote: '“general”: Heb. 12:23 (22–24).'
  - where: 'section “Another mountain”'
    claim: 'Connection made by this page: “Let us draw near” (Heb. 10:22) set beside the people who “stood afar off” (Ex. 20:21)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/10?lang=eng'
    quote: 'Let us draw near with a true heart in full assurance of faith'
