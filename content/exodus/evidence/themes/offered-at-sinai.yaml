  - where: 'section “Let us draw near”'
    claim: 'D&C 84:24 “swore that they should not enter into his rest while in the wilderness, which rest is the fulness of his glory”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'swore that they should not enter into his rest while in the wilderness, which rest is the fulness of his glory.'
  - where: 'section “Let us draw near”'
    claim: 'Belnap and Skinner on D&C 84:19–24: “the event itself—the Israelites’ refusal to enter into God’s presence—is clearly the Exodus 19–20 narrative”'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'the event itself—the Israelites’ refusal to enter into God’s presence—is clearly the Exodus 19–20 narrative'
  - where: 'section “Let us draw near”'
    claim: 'Ellicott on Heb. 4:1: the promise “remains unexhausted, waiting for complete fulfilment”'
    key: ellicott-hebrews
    url: 'https://biblehub.com/commentaries/ellicott/hebrews/4.htm'
    quote: 'remains unexhausted, waiting for complete fulfilment'
  - where: 'section “Let us draw near”'
    claim: 'Footnote 1 Pet. 2:9d “holy” → Ex. 19:6 (old-ledger row 17, re-read)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-pet/2?lang=eng'
    quote: 'a royal priesthood, an holy nation, a peculiar people'
  - where: 'section “Let us draw near”'
    claim: 'Ellicott on 1 Pet. 2:9: “These words are a direct quotation from Exodus 19:6, according to the LXX. version.”'
    key: ellicott-1-peter
    url: 'https://biblehub.com/commentaries/ellicott/1_peter/2.htm'
    quote: 'These words are a direct quotation from Exodus 19:6, according to the LXX. version.'
  - where: 'section “Let us draw near”'
    claim: 'Heb. 10:22 “Let us draw near with a true heart in full assurance of faith”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/10?lang=eng'
    quote: 'Let us draw near with a true heart in full assurance of faith'
  - where: 'section “Let us draw near”'
    claim: 'Connection made by this page: Heb. 10:22 “let us draw near” set beside Ex. 20:21 “the people stood afar off, and Moses drew near”; no source joins the two verses (Delitzsch, in Ellicott on Heb. 12:22–24, is the nearest)'
    key: ellicott-hebrews
    url: 'https://biblehub.com/commentaries/ellicott/hebrews/12.htm'
    quote: 'a standing afar off'

  # ---------- section “The privilege of receiving the mysteries” ----------
  - where: 'section “The privilege of receiving the mysteries”'
    claim: 'D&C 84:19–22 as quoted; D&C 107:19 “to enjoy the communion and presence of God the Father, and Jesus the mediator of the new covenant,” footnote 19c “general” → Heb. 12:23 (22–24) (old-ledger row 18, re-read)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/107?lang=eng'
    quote: 'to enjoy the communion and presence of God the Father, and Jesus the mediator of the new covenant.'
  - where: 'section “The privilege of receiving the mysteries”'
    claim: 'D&C 84:22 “For without this no man can see the face of God, even the Father, and live.”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
