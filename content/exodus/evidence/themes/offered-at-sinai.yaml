page: offered-at-sinai
claims:
  # ---------- opening ----------
  - where: 'opening'
    claim: 'JST Ex. 34:1: “I will take away the priesthood out of their midst; therefore my holy order, and the ordinances thereof, shall not go before them; for my presence shall not go up in their midst”'
    key: jst-ex-34
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-ex/34?lang=eng'
    quote: 'I will take away the priesthood out of their midst; therefore my holy order, and the ordinances thereof, shall not go before them; for my presence shall not go up in their midst, lest I destroy them.'
  - where: 'opening'
    claim: 'mērāḥōq (H7350) occurs 4 times in Exodus (2:4; 20:18; 20:21; 24:1); nāgaš (H5066) of approach to the LORD at Sinai only of Moses (20:21; 24:2 “Moses alone”), the priests at 19:22; 24:2 the elders “shall not come nigh” (yiggāšû) and the people shall not go up (yaʿălû)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'נִגַּ֣שׁ'
  - where: 'opening'
    claim: '24:2 “Moses alone,” lĕbaddô (H905); 20:21 and 24:1 “afar off,” mērāḥōq'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'לְ/בַדּ/וֹ֙'
  - where: 'opening'
    claim: 'Ellicott on 19:6: priests “entitled to draw near to God in prayer without an intermediary”; Cambridge on 19:6: “the right of access to Him”'
    key: ellicott-exodus
    url: 'https://biblehub.com/commentaries/ellicott/exodus/19.htm'
    quote: 'entitled to draw near to God in prayer without an intermediary'
  - where: 'opening'
    claim: 'Cambridge on 19:6: “ever enjoying the right of access to Him”'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/19.htm'
    quote: 'the right of access to Him'
  - where: 'opening'
    claim: 'Connection made by this page: the distance words (afar off, draw near, go up) read as the book’s own measure of the offer of 19:6 and its loss; the commentaries note the words verse by verse without following them.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/20?lang=eng'
    quote: 'And the people stood afar off, and Moses drew near unto the thick darkness where God was.'

  # ---------- section “A kingdom of priests” ----------
  - where: 'section “A kingdom of priests”'
    claim: 'Ellicott on 19:6: “kings and priests unto God … priests, as entitled to draw near to God in prayer without an intermediary”'
    key: ellicott-exodus
    url: 'https://biblehub.com/commentaries/ellicott/exodus/19.htm'
    quote: 'priests, as entitled to draw near to God in prayer without an intermediary'
  - where: 'section “A kingdom of priests”'
    claim: 'Cambridge on 19:6: “a kingdom whose citizens are all priests, living wholly in God’s service, and ever enjoying the right of access to Him”'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/19.htm'
    quote: 'a kingdom whose citizens are all priests, living wholly in God’s service, and ever enjoying the right of access to Him'
  - where: 'section “A kingdom of priests”'
    claim: 'Hardison on 19:6: “God is inviting all of Israel to be priests, to have an intimate, personal relationship with him. This is unique in the ancient world.”'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'God is inviting all of Israel to be priests, to have an intimate, personal relationship with him. This is unique in the ancient world.'
  - where: 'section “A kingdom of priests”'
    claim: 'Scripture Helps on 19:6: the phrase “suggests a group of people who have received God’s priesthood authority and are responsible for administering the ordinances of the gospel”'
    key: scripture-helps-ex-19
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/15-exodus-19-20-24-31-34?lang=eng'
    quote: 'suggests a group of people who have received God’s priesthood authority and are responsible for administering the ordinances of the gospel'
  - where: 'section “A kingdom of priests”'
    claim: 'Scripture Helps on 19:6: “the Lord had intended for the ordinances of the Melchizedek Priesthood to play an important role in the Israelites becoming a kingdom of priests and a holy nation that could ‘behold the face of God’”'
    key: scripture-helps-ex-19
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/15-exodus-19-20-24-31-34?lang=eng'
    quote: 'the Lord had intended for the ordinances of the Melchizedek Priesthood to play an important role in the Israelites becoming a kingdom of priests and a holy nation that could “behold the face of God.”'
  - where: 'section “A kingdom of priests”'
    claim: 'Belnap and Skinner on 19:13 and 19:20–24: the trumpet “was to mark the time that the Israelites could now ascend the mountain”; “the narrative now presents a paradox”'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'was to mark the time that the Israelites could now ascend the mountain'
  - where: 'section “A kingdom of priests”'
    claim: 'Belnap and Skinner: “Yet the narrative now presents a paradox”'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'Yet the narrative now presents a paradox'
  - where: 'section “A kingdom of priests”'
    claim: 'Student Manual (quoting Rasmussen) on 19:10–25: the people “apparently … were not fully ready to come up ‘in the sight’ of the Lord”'
    key: ot-manual-ex-11-19
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-11-19-the-passover-and-the-exodus?lang=eng'
    quote: 'apparently they were not fully ready to come up ‘in the sight’ of the Lord on the mount where Moses was'
  - where: 'section “A kingdom of priests”'
    claim: 'Keil on 19:16–24: “apart from the physical impossibility of 600,000 ascending the mountain, it never was intended that all the people should do so”'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/19.htm'
    quote: 'it never was intended that all the people should do so'
  - where: 'section “A kingdom of priests”'
    claim: 'Keil on 19:12–13: “in the persons of their representatives”'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/19.htm'
    quote: 'in the persons of their representatives'
  - where: 'section “A kingdom of priests”'
    claim: 'Cambridge on 19:13b: doubts whether the clause “they shall come up” is in its original position (Bacon would move it to v. 24)'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/19.htm'
    quote: 'original position'

  # ---------- section “And the people stood afar off” ----------
  - where: 'section “And the people stood afar off”'
    claim: 'Cambridge on 20:18: nûaʿ “swayed to and fro, shook”; read probably “and the people were afraid, and trembled”'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/20.htm'
    quote: 'and the people were afraid, and trembled'
  - where: 'section “And the people stood afar off”'
    claim: 'Ellicott on 20:20: “God approved the people’s proposal, and directed that they should withdraw to their tents (Deuteronomy 5:28–30)”; “the same manifestation which repelled the people attracted Moses”'
    key: ellicott-exodus
    url: 'https://biblehub.com/commentaries/ellicott/exodus/20.htm'
    quote: 'God approved the people’s proposal, and directed that they should withdraw to their tents (Deuteronomy 5:28-30).'
  - where: 'section “And the people stood afar off”'
    claim: 'Ellicott on 20:21: “the same manifestation which repelled the people attracted Moses”'
    key: ellicott-exodus
    url: 'https://biblehub.com/commentaries/ellicott/exodus/20.htm'
    quote: 'the same manifestation which repelled the people attracted Moses'
  - where: 'section “And the people stood afar off”'
    claim: 'Deut. 5:28 “They have well said all that they have spoken.”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/5?lang=eng'
    quote: 'They have well said all that they have spoken.'
  - where: 'section “And the people stood afar off”'
    claim: 'Footnote Ex. 20:19a “speak” → Deut. 5:25; 18:16; Heb. 12:19; D&C 84:22 (21–26); Moses 1:11 (11, 14)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/20?lang=eng'
    quote: 'Speak thou with us, and we will hear: but let not God speak with us, lest we die.'
  - where: 'section “And the people stood afar off”'
    claim: 'D&C 84:23–24: Moses “sought diligently to sanctify his people that they might behold the face of God; But they hardened their hearts and could not endure his presence”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'But they hardened their hearts and could not endure his presence'
  - where: 'section “And the people stood afar off”'
    claim: 'Scripture Helps on 20:18–21: “it appears that the Lord had intended for them to experience something more significant”; quotes Joseph Smith, “The Israelites prayed that God would speak to Moses and not to them; in consequence of which he cursed them with a carnal law.”'
    key: scripture-helps-ex-19
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/15-exodus-19-20-24-31-34?lang=eng'
    quote: 'it appears that the Lord had intended for them to experience something more significant'
  - where: 'section “And the people stood afar off”'
    claim: 'Scripture Helps quoting Joseph Smith: “The Israelites prayed that God would speak to Moses and not to them; in consequence of which he cursed them with a carnal law.”'
    key: scripture-helps-ex-19
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/15-exodus-19-20-24-31-34?lang=eng'
    quote: 'The Israelites prayed that God would speak to Moses and not to them; in consequence of which he cursed them with a carnal law.'
  - where: 'section “And the people stood afar off”'
    claim: 'Hardison on 20:19–20 and D&C 84:24: not “a wholesale rejection of the covenant”; the people “place the burden and privilege of personally experiencing God on Moses. They prefer a less direct and less demanding experience.”'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'place the burden and privilege of personally experiencing God on Moses. They prefer a less direct and less demanding experience.'
  - where: 'section “And the people stood afar off”'
    claim: 'Hardison: “does not, however, amount to a wholesale rejection of the covenant”'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'amount to a wholesale rejection of the covenant'
  - where: 'section “And the people stood afar off”'
    claim: 'Keil on 19:16–24 and 20:18–21: the people “gave up the right of speaking with God”'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/19.htm'
    quote: 'gave up the right of speaking with God'
  - where: 'section “And the people stood afar off”'
    claim: 'Eubank: “They preferred to have Moses be their spokesman, but that isn’t a kingdom of priests.”'
    key: eubank-kingdom-priests
    url: 'https://rsc.byu.edu/covenant-compassion/kingdom-priests-holy-nation'
    quote: 'They preferred to have Moses be their spokesman, but that isn’t a kingdom of priests.'

  # ---------- section “Moses alone shall come near” ----------
  - where: 'section “Moses alone shall come near”'
    claim: 'Cambridge on 24:2: “Observe the gradation: the people generally are to remain at the foot of the mountain; Aaron, his two sons, and the elders come partly up the mountain; only Moses goes to the top”'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/24.htm'
    quote: 'the people generally are to remain at the foot of the mountain; Aaron, his two sons, and the elders come partly up the mountain; only Moses goes to the top'
  - where: 'section “Moses alone shall come near”'
    claim: 'Keil on 19:16 (looking to 24:9–11): “What God really intended, came to pass. After the people had been received into fellowship with Jehovah through the atoning blood of the sacrifice, they were permitted to ascend the mountain in the persons of their representatives, and there to see God”'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/19.htm'
    quote: 'What God really intended, came to pass. After the people had been received into fellowship with Jehovah through the atoning blood of the sacrifice, they were permitted to ascend the mountain in the persons of their representatives, and there to see God'
  - where: 'section “Moses alone shall come near”'
    claim: 'Hardison on 24:9–11, quoting Durham: “a still more intimate contact with the Presence of Yahweh”'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'a still more intimate contact with the Presence of Yahweh'
  - where: 'section “Moses alone shall come near”'
    claim: 'D&C Student Manual ch. 31 on D&C 84:23–25: Israel covenanted (Ex. 19:7–8), “some of them, including Aaron and two of his sons, ‘saw the God of Israel’ (Exodus 24:9–10)”; then “hardened their hearts and ‘corrupted themselves’ with idolatry”'
    key: dc-student-manual-31
    url: 'https://www.churchofjesuschrist.org/study/manual/doctrine-and-covenants-student-manual-2017/chapter-31-doctrine-and-covenants-84?lang=eng'
    quote: 'some of them, including Aaron and two of his sons, “saw the God of Israel” (Exodus 24:9–10). However, the children of Israel hardened their hearts and “corrupted themselves” with idolatry'
  - where: 'section “Moses alone shall come near”'
    claim: 'Ex. 24:10–11 “they saw the God of Israel … and did eat and drink”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/24?lang=eng'
    quote: 'also they saw God, and did eat and drink.'

  # ---------- section “I will not go up in the midst of thee” ----------
  - where: 'section “I will not go up in the midst of thee”'
    claim: 'Scripture Helps on 32:15–24: “Moses’s act of breaking the tablets reflected Israel’s broken covenant.”'
    key: scripture-helps-ex-19
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/15-exodus-19-20-24-31-34?lang=eng'
    quote: 'Moses’s act of breaking the tablets reflected Israel’s broken covenant.'
  - where: 'section “I will not go up in the midst of thee”'
    claim: 'Ellicott on 33:3–5: the proposed withdrawal “was in mercy, that they might not be consumed, as there was danger of their being unless they repented and turned to God”'
    key: ellicott-exodus
    url: 'https://biblehub.com/commentaries/ellicott/exodus/33.htm'
    quote: 'It was in mercy, that they might not be consumed, as there was danger of their being unless they repented and turned to God.'
  - where: 'section “I will not go up in the midst of thee”'
    claim: 'JST Ex. 34:1–2 as quoted: the priesthood taken away, the presence not going up, “I have sworn in my wrath, that they shall not enter into my presence, into my rest, in the days of their pilgrimage”'
    key: jst-ex-34
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-ex/34?lang=eng'
    quote: 'for I have sworn in my wrath, that they shall not enter into my presence, into my rest, in the days of their pilgrimage.'
  - where: 'section “I will not go up in the midst of thee”'
    claim: 'JST Deut. 10:2: the second tables have the words of the first “save the words of the everlasting covenant of the holy priesthood”'
    key: jst-deut-10
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-deut/10?lang=eng'
    quote: 'save the words of the everlasting covenant of the holy priesthood'
  - where: 'section “I will not go up in the midst of thee”'
    claim: 'D&C 84:25–26 “Therefore, he took Moses out of their midst, and the Holy Priesthood also; And the lesser priesthood continued”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'Therefore, he took Moses out of their midst, and the Holy Priesthood also;'
  - where: 'section “I will not go up in the midst of thee”'
    claim: 'Bible Dictionary, Melchizedek Priesthood: “When the children of Israel failed to live up to the privileges and covenants of the Melchizedek Priesthood, the Lord took away the higher law and gave them a lesser priesthood and a lesser law.”'
    key: bd-melchizedek-priesthood
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/melchizedek-priesthood?lang=eng'
    quote: 'When the children of Israel failed to live up to the privileges and covenants of the Melchizedek Priesthood, the Lord took away the higher law and gave them a lesser priesthood and a lesser law.'
  - where: 'section “I will not go up in the midst of thee”'
    claim: 'Guide to the Scriptures, Aaronic Priesthood: “They had refused to be sanctified and receive the Melchizedek Priesthood and its ordinances.”'
    key: gs-aaronic-priesthood
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/aaronic-priesthood?lang=eng'
    quote: 'They had refused to be sanctified and receive the Melchizedek Priesthood and its ordinances.'
  - where: 'section “I will not go up in the midst of thee”'
    claim: 'Student Manual on JST Ex. 34:1: the “it” “seems to refer to the new order and not the new writings”; JST Deut. 10:2 makes the two sets the same with one exception'
    key: ot-manual-ex-21-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-21-24-31-35-the-mosaic-law-a-preparatory-gospel?lang=eng'
    quote: 'the new order of things introduced because of the rebellion of Israel'
  - where: 'section “I will not go up in the midst of thee”'
    claim: 'Belnap and Skinner: “Instead of a holy nation, where all individuals could represent themselves directly to God, the priests began to act as intermediaries and represented the people before God.”'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'Instead of a holy nation, where all individuals could represent themselves directly to God, the priests began to act as intermediaries and represented the people before God.'
  - where: 'section “I will not go up in the midst of thee”'
    claim: 'Hardison on ch. 34: “The people are restored to a nation of priests, though not collectively”; the Levites “will bear the priesthood—a preparatory priesthood—of God”'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'The people are restored to a nation of priests, though not collectively'
  - where: 'section “I will not go up in the midst of thee”'
    claim: 'Muhlestein (Ensign, Mar. 2018): “Though the Lord had more in store for them, the Israelites sent their leaders to Moses, telling him to converse with God alone.”'
    key: muhlestein-exodus-deliverance
    url: 'https://www.churchofjesuschrist.org/study/ensign/2018/03/israels-exodus-and-deliverance-then-and-now?lang=eng'
    quote: 'Though the Lord had more in store for them, the Israelites sent their leaders to Moses, telling him to converse with God alone.'

  # ---------- section “Let us draw near” ----------
  - where: 'section “Let us draw near”'
    claim: 'Footnotes Heb. 12:18 “mount” → Ex. 19:12 and 12:19 “voice” → Ex. 20:19 (old-ledger row 13, re-read)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/12?lang=eng'
    quote: 'which voice they that heard entreated that the word should not be spoken to them any more'
  - where: 'section “Let us draw near”'
    claim: 'Scripture Helps on Heb. 12:18–23: “an allusion to God’s presence on Mount Sinai … This awe-inspiring experience was preliminary. Believers are to look to another mountain, Mount Zion, for greater glory.”'
    key: scripture-helps-nt-heb-7-13
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-new-testament/46-hebrews-7-13?lang=eng'
    quote: 'This awe-inspiring experience was preliminary. Believers are to look to another mountain, Mount Zion, for greater glory.'
  - where: 'section “Let us draw near”'
    claim: 'Ellicott on Heb. 12:22–24, quoting Delitzsch: “Their drawing nigh was at the same time a standing afar off; the mount of the revelation might not be approached by them”'
    key: ellicott-hebrews
    url: 'https://biblehub.com/commentaries/ellicott/hebrews/12.htm'
    quote: 'Their drawing nigh was at the same time a standing afar off; the mount of the revelation might not be approached by them'
  - where: 'section “Let us draw near”'
    claim: 'Ps. 95:11 and footnote 95:8b “HEB at Meribah”; Heb. 3:8 footnote “provocation” → Num. 14:23 (2–23); Jacob 1:7; Alma 12:36 (not Sinai)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/95?lang=eng'
    quote: 'Unto whom I sware in my wrath that they should not enter into my rest.'
  - where: 'section “Let us draw near”'
    claim: 'Heb. 3:19 “they could not enter in because of unbelief”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/3?lang=eng'
