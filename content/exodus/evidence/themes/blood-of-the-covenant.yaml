page: blood-of-the-covenant
claims:
  - where: opening
    claim: 'Connection made by this page: the four blood rites of Exodus (12:13; 24:8; 29:20–21; 30:10) set side by side, in the book''s order, as four things blood does; the labels are the page''s'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/30?lang=eng'
    quote: 'And Aaron shall make an atonement upon the horns of it once in a year with the blood of the sin offering of atonements'
  - where: 'section “Protection: the door”'
    claim: 'Obedience witnessed by the blood on the doorposts, symbolizing protection of the firstborn'
    key: seely-sacrifice
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/09/united-states-and-canada-section/sacrifice-in-similitude-of-the-savior?lang=eng'
    quote: 'obedience to God’s commandment to kill the Passover lamb was witnessed by daubing the blood of the lamb on the doorposts, symbolizing God’s protection of the firstborn from death during the final plague.'
  - where: 'section “Protection: the door”'
    claim: 'The passing by represents Christ overcoming death'
    key: scripture-helps-ex-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/13-exodus-7-13?lang=eng'
    quote: 'That passing by, or pass over, represents Jesus Christ ultimately overcoming death.'
  - where: 'section “Belonging: the altar and the people”'
    claim: 'Altar blood represented Christ''s blood; blood on the people symbolized Atonement blessings and the seriousness of covenants; both parties bound'
    key: scripture-helps-ex-19
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/15-exodus-19-20-24-31-34?lang=eng'
    quote: 'The blood that Moses sprinkled on the altar represented the blood of Jesus Christ, which He would shed at Gethsemane and on the cross. When Moses sprinkled blood on the people, it symbolized the blessings of the Atonement of Jesus Christ that the people would receive through the covenant they had made. It also symbolized the seriousness of those covenants. Sprinkling blood showed that both God and the people were mutually bound by this covenant.'
  - where: 'section “Service: the priests”'
    claim: 'Leviticus 8 narrates the blood on Aaron''s and his sons'' ear, thumb and toe'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/8?lang=eng'
    quote: 'And he slew it; and Moses took of the blood of it, and put it upon the tip of Aaron’s right ear, and upon the thumb of his right hand, and upon the great toe of his right foot.'
  - where: 'section “Service: the priests”'
    claim: 'Splashing of blood and oil onto Aaron ritually established the relationship between Aaron and God'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'the splashing of the blood and oil onto Aaron ritually established the relationship between Aaron and God.'
  - where: 'section “Service: the priests”'
    claim: 'The induction rites were not repeated, unlike the atoning rites'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'Unlike the atonement rites, the induction rites used to establish the initial relationship with God were not repeated.'
  - where: 'section “Access: the horns, once a year”'
    claim: 'On the Day of Atonement the high priest entered the Holy of Holies and sprinkled blood on the mercy seat'
    key: scripture-helps-ex-35
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/16-exodus-35-40-leviticus-1-4-16-19?lang=eng'
    quote: 'He then entered the Holy of Holies and sprinkled blood from the sacrifices onto the mercy seat of the ark of the covenant.'
  - where: 'section “Access: the horns, once a year”'
    claim: 'The Church''s footnote on Heb. 9:7 “once” points to Ex. 30:10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/9?lang=eng'
    quote: '“once”: Ex. 30:10.'
  - where: 'section “The cup, and the way in”'
    claim: 'Jesus hearkened back to Ex. 24:8 at the Last Supper'
    key: seely-sacrifice
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/09/united-states-and-canada-section/sacrifice-in-similitude-of-the-savior?lang=eng'
    quote: 'He hearkened back to Exodus 24:8—“behold the blood of the covenant”—when He took the wine and instituted the sacrament'
  - where: 'section “The cup, and the way in”'
    claim: 'The Church''s footnote on 1 Pet. 1:2 “blood” points to Ex. 24:8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-pet/1?lang=eng'
    quote: '“blood”: Ex. 24:8 (5–8); Heb. 12:24.'
  - where: 'section “The cup, and the way in”'
    claim: 'Christ was both High Priest and the offering, and made His sacrifice only once'
    key: scripture-helps-nt-heb-7-13
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-new-testament/46-hebrews-7-13?lang=eng'
    quote: 'Jesus Christ made His sacrifice only once. Jesus was both our High Priest in making the offering and the very offering itself.'
  - where: 'section “The cup, and the way in”'
    claim: 'Bread and wine replace animals and herbs as emblems of the Lamb''s body and blood'
    key: hunter-passover
    url: 'https://www.churchofjesuschrist.org/study/ensign/1985/05/christ-our-passover?lang=eng'
    quote: 'The bread and wine, rather than the animals and herbs, would become emblems of the great Lamb’s body and blood'
