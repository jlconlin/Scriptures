page: the-firstborn
claims:
  # ---------- opening ----------
  - where: 'opening'
    claim: 'bĕkôr (H1060) occurs 20 times in 11 verses of Exodus: 12 of Egypt’s firstborn (11:5 ×4; 12:12; 12:29 ×4; 13:15 ×3), 5 of Israel’s (13:2, 13, 15; 22:29; 34:20), 4:22 (Israel), 4:23 (Pharaoh’s), 6:14 (Reuben)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'בְּכֹרֶֽ/ךָ'
  - where: 'opening'
    claim: 'Hunter: “the Firstborn of God had come to offer himself”'
    key: hunter-passover
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1985/04/christ-our-passover?lang=eng'
    quote: 'because the Firstborn of God had come to offer himself as an “infinite and eternal sacrifice.”'
  - where: 'opening'
    claim: 'Connection made by this page: the path from 4:22 (my firstborn) through 12:29, 13:2 (it is mine), 13:13 (redeem), Num. 3:12 (Levites) to Luke 2:23 read as one; and that in Jesus the redeemed son and the offered firstling meet. No source makes either join.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/2?lang=eng'
    quote: 'Every male that openeth the womb shall be called holy to the Lord'

  # ---------- section “Israel is my son, even my firstborn” ----------
  - where: 'section “Israel is my son, even my firstborn”'
    claim: 'Cambridge on 4:22: Israel “treated as an individual” is brought into “the closest and dearest relation to Jehovah, as his ‘son’ (cf. Hosea 11:1), his ‘firstborn’”'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/4.htm'
    quote: 'Israel, treated as an individual, is brought into the closest and dearest relation to Jehovah, as his ‘son’ (cf. Hosea 11:1), his ‘firstborn.’'
  - where: 'section “Israel is my son, even my firstborn”'
    claim: 'Cambridge on 4:22–23: the message is “formulated with special reference to the final and severest plague”'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/4.htm'
    quote: 'formulated with special reference to the final and severest plague'
  - where: 'section “Israel is my son, even my firstborn”'
    claim: 'Keil on 4:22–23: Pharaoh who will not release Jehovah’s first-born pays the penalty in his own first-born (cf. 12:29)'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/4.htm'
    quote: 'if Pharaoh would not let Jehovah''s first-born son depart, he would pay the penalty in the life of his own first-born (cf. Exodus 12:29)'
  - where: 'section “Israel is my son, even my firstborn”'
    claim: 'Footnote 4:23a “son” → Ex. 11:5 (1–5); footnote 11:5b “firstborn” → Ex. 4:23 (21–23): the Church’s footnotes join the threat and the plague from both ends'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/4?lang=eng'
    quote: 'and if thou refuse to let him go, behold, I will slay thy son, even thy firstborn.'
  - where: 'section “Israel is my son, even my firstborn”'
    claim: 'Ex. 11:5, the plague announced'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/11?lang=eng'
    quote: 'And all the firstborn in the land of Egypt shall die, from the firstborn of Pharaoh that sitteth upon his throne'
  - where: 'section “Israel is my son, even my firstborn”'
    claim: 'Keil on 11:5: the first-born “represented the whole race”'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/11.htm'
    quote: 'represented the whole race'

  # ---------- section “It is mine” ----------
  - where: 'section “It is mine”'
    claim: 'BDB on pāsaḥ (H6452) I: Qal at Ex. 12:13, 23, 27 of the LORD passing over (sparing) Israel’s houses; the root of pesaḥ, Passover'
    key: bdb
    url: 'https://biblehub.com/hebrew/6452.htm'
    quote: 'Exodus 12:13,23,27'
  - where: 'section “It is mine”'
    claim: 'Elder Gong: “That passing by, or pass over, represents Jesus Christ ultimately overcoming death.”'
    key: gong-hosanna-hallelujah
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/04/31gong?lang=eng'
    quote: 'That passing by, or pass over, represents Jesus Christ ultimately overcoming death.'
  - where: 'section “It is mine”'
    claim: '13:2 “it is mine” is lî hûʾ, two words'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'הֽוּא'
  - where: 'section “It is mine”'
    claim: 'Num. 3:13 gives the ground of the claim: hallowed “on the day that I smote all the firstborn in the land of Egypt”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/3?lang=eng'
    quote: 'Because all the firstborn are mine; for on the day that I smote all the firstborn in the land of Egypt I hallowed unto me all the firstborn in Israel'
  - where: 'section “It is mine”'
    claim: 'Scripture Helps on Ex. 13:1–2, 12: having saved the firstborn of the faithful from death, the Lord claimed them as belonging to Him'
    key: scripture-helps-ex-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/13-exodus-7-13?lang=eng'
    quote: 'Having saved the firstborn of the faithful from death, the Lord claimed them as belonging to Him.'
  - where: 'section “It is mine”'
    claim: 'Student Manual quoting President John Taylor (Mediation and Atonement, p. 108): having saved the first-born of Israel, the Lord “made a claim upon them for their services in His cause”'
    key: ot-manual-ex-11-19
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-11-19-the-passover-and-the-exodus?lang=eng'
    quote: 'having saved the lives of all the first-born of Israel, made a claim upon them for their services in His cause.'
  - where: 'section “It is mine”'
    claim: 'Keil on 13:1–2: Jehovah sanctified the first-born by adopting Israel as His first-born son (4:22)'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/13.htm'
    quote: 'But Jehovah sanctified the first-born of Israel to Himself by adopting Israel as His first-born son (Exodus 4:22), or as His possession.'
  - where: 'section “It is mine”'
    claim: 'Keil on 13:2: the sanctification rested not on the deliverance through the paschal blood but on God’s sanctifying them for Himself, and therefore delivering them'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/13.htm'
    quote: 'rested not upon the deliverance of the first-born sons from the stroke of the destroyer through the atoning blood of the paschal lamb, but upon the fact that God sanctified them for Himself at that time, and therefore delivered them.'
  - where: 'section “It is mine”'
    claim: 'Keil on 22:29: the adoption of the first-born was “a perpetual guarantee to the whole nation of the right of covenant fellowship”'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/22.htm'
    quote: 'a perpetual guarantee to the whole nation of the right of covenant fellowship'

  # ---------- section “All the firstborn of my children I redeem” ----------
  - where: 'section “All the firstborn of my children I redeem”'
    claim: 'BDB on peṭer (H6363): “that which separates, first opens”; with reḥem, firstborn of man and beast (Ex. 13:12, 15; 34:19); in apposition to bĕkôr at Ex. 13:2'
    key: bdb
    url: 'https://biblehub.com/hebrew/6363.htm'
    quote: 'that which separates, first opens'
  - where: 'section “All the firstborn of my children I redeem”'
    claim: 'peṭer occurs in Exodus only at 13:2, 12, 13, 15; 34:19, 20 (8 forms)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'פֶּ֤טֶר'
  - where: 'section “All the firstborn of my children I redeem”'
    claim: 'Cambridge on 13:13: “redeem” is pâdâh (not gâ’al, as 6:6), “the word used regularly of redeeming a person, or animal, from death or servitude”'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/13.htm'
    quote: 'the word used regularly of redeeming a person, or animal, from death or servitude'
  - where: 'section “All the firstborn of my children I redeem”'
    claim: 'Keil on 13:11–16: the first-born sons were “also to be consecrated to Jehovah as a sacrifice,” but “not indeed in the manner of the heathen, by slaying and burning upon the altar, but by presenting them to the Lord as living sacrifices”'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/13.htm'
    quote: 'not indeed in the manner of the heathen, by slaying and burning upon the altar, but by presenting them to the Lord as living sacrifices'
  - where: 'section “All the firstborn of my children I redeem”'
    claim: 'Ex. 13:15, the father’s answer: the LORD slew the firstborn of Egypt; therefore firstlings are sacrificed and firstborn sons redeemed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/13?lang=eng'
    quote: 'therefore I sacrifice to the Lord all that openeth the matrix, being males; but all the firstborn of my children I redeem.'
  - where: 'section “All the firstborn of my children I redeem”'
    claim: 'Num. 3:12, 46–47: the Levites taken instead of all the firstborn; the 273 in excess redeemed at five shekels apiece'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/3?lang=eng'
    quote: 'Thou shalt even take five shekels apiece by the poll'
  - where: 'section “All the firstborn of my children I redeem”'
    claim: 'Student Manual on Num. 3: the Levites acted “in the stead of the firstborn son”; the excess 273 “were redeemed by a five-shekel offering each”'
    key: ot-manual-numbers-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-1-12-wilderness-wanderings-part-1?lang=eng'
    quote: 'The excess 273 firstborn who were not redeemed man for man by a Levite substitute were redeemed by a five-shekel offering each.'
  - where: 'section “All the firstborn of my children I redeem”'
    claim: 'Bible Dictionary: the Levites “thus became God’s peculiar property, given to Him in place of the firstborn” (Num. 8:16)'
    key: bd-levites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levites?lang=eng'
    quote: 'they thus became God’s peculiar property, given to Him in place of the firstborn'
  - where: 'section “All the firstborn of my children I redeem”'
    claim: 'Scripture Helps endnote 24: originally the firstborn male was to serve in a priestly role in the tabernacle; later the tribe of Levi exclusively filled that role'
    key: scripture-helps-ex-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/13-exodus-7-13?lang=eng'
    quote: 'Originally, the firstborn male from each family was to serve in a priestly role in the tabernacle. Later, the tribe of Levi exclusively filled that role'
  - where: 'section “All the firstborn of my children I redeem”'
    claim: 'Keil on 34:17–26: among the positive commands, “the consecration of the first-born connected with the Passover (see at Exodus 13:2, 11, 12)”'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/34.htm'
    quote: 'the consecration of the first-born connected with the Passover'

  # ---------- section “To present him to the Lord” ----------
  - where: 'section “To present him to the Lord”'
    claim: 'Footnote Ex. 13:2d “womb” → Luke 2:23'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/13?lang=eng'
    quote: 'Sanctify unto me all the firstborn, whatsoever openeth the womb among the children of Israel, both of man and of beast: it is mine.'
  - where: 'section “To present him to the Lord”'
    claim: 'Footnote Luke 2:23a → Ex. 13:2; 34:19; Luke 2:22 “to present him to the Lord”; 2:7 “her firstborn son”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/2?lang=eng'
    quote: 'they brought him to Jerusalem, to present him to the Lord'
  - where: 'section “To present him to the Lord”'
    claim: 'Cambridge on Luke 2:23: the law is Ex. 13:2; 22:29; 34:19; Num. 3:13; 18:15–16; Levi “sanctified to the Lord in lieu of the firstborn”; five shekels “a rule afterwards extended to all the firstborn”'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/2.htm'
    quote: 'The tribe of Levi were sanctified to the Lord in lieu of the firstborn, and originally all the firstborn in excess of the number of the Levites had to be redeemed with five shekels of the sanctuary (about 15 shillings), a rule afterwards extended to all the firstborn.'
  - where: 'section “To present him to the Lord”'
    claim: 'Cambridge on Luke 2:22: the Greek is “their” purification; “Strictly speaking, the child was never purified, but only the mother.”'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/2.htm'
    quote: 'Strictly speaking, the child was never purified, but only the mother.'
  - where: 'section “To present him to the Lord”'
    claim: 'Cambridge on Luke 2:7: “firstborn” does not imply other children; “See Hebrews 1:6, where first-born=only-begotten.”'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/2.htm'
    quote: 'See Hebrews 1:6, where first-born=only-begotten.'
  - where: 'section “To present him to the Lord”'
    claim: 'Ellicott on Luke 2:22: the presentation “a witness of the idea of the priesthood of the firstborn—a survival of the idea in practice, even after the functions of that priesthood had been superseded by the priesthood of the sons of Aaron”'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/2.htm'
    quote: 'It was obviously a witness of the idea of the priesthood of the firstborn—a survival of the idea in practice, even after the functions of that priesthood had been superseded by the priesthood of the sons of Aaron.'
  - where: 'section “To present him to the Lord”'
    claim: 'NT Student Manual quoting President Oaks: “In obedience to the law of Moses, Joseph and Mary brought the infant Jesus to the temple at Jerusalem after forty days, to present him to the Lord.”'
    key: nt-student-manual-15
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/introduction-to-the-gospel-according-to-st-luke/chapter-15-luke-1-3?lang=eng'
    quote: 'In obedience to the law of Moses, Joseph and Mary brought the infant Jesus to the temple at Jerusalem after forty days, to present him to the Lord.'
  - where: 'section “To present him to the Lord”'
    claim: 'NT Student Manual on Luke 2:22–24: the offering (lamb, or two birds) was the mother’s purification under Lev. 12; it names no redemption of the child'
    key: nt-student-manual-15
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/introduction-to-the-gospel-according-to-st-luke/chapter-15-luke-1-3?lang=eng'
    quote: 'That Mary presented turtledoves or pigeons instead of a lamb is evidence Jesus Christ was born to a mother of little material means.'
  - where: 'section “To present him to the Lord”'
    claim: 'Bible Dictionary: under the law of Moses the firstborn son belonged to God “and special ordinances were provided for his redemption (Ex. 13:12–15; 22:29; Num. 3:45; Luke 2:22–23)”'
    key: bd-firstborn
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/firstborn?lang=eng'
    quote: 'special ordinances were provided for his redemption (Ex. 13:12–15; 22:29; Num. 3:45; Luke 2:22–23)'
  - where: 'section “To present him to the Lord”'
    claim: 'Skinner: Jesus was taken to the temple “to be presented to his Father and be redeemed or ransomed according to the Mosaic law” (Luke does not say so)'
    key: skinner-life-jesus
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
    quote: 'to be presented to his Father and be redeemed or ransomed according to the Mosaic law'

  # ---------- section “The Firstborn of God” ----------
  - where: 'section “The Firstborn of God”'
    claim: 'Cambridge on Col. 1:15: “Firstborn over all creation; standing to it in the relation of priority of existence and supremacy of inherited right”; compares Ps. 89:27'
    key: cambridge-colossians
    url: 'https://biblehub.com/commentaries/cambridge/colossians/1.htm'
    quote: 'priority of existence and supremacy of inherited right'
  - where: 'section “The Firstborn of God”'
    claim: 'Cambridge on Col. 1:18: “firstborn from the dead” echoes 1:15; “He is not only the ‘First-fruits’ but the ‘First-Born’ in His resurrection.”'
    key: cambridge-colossians
    url: 'https://biblehub.com/commentaries/cambridge/colossians/1.htm'
    quote: 'He is not only the “First-fruits” but the “First-Born” in His resurrection.'
  - where: 'section “The Firstborn of God”'
    claim: 'Ps. 89:27 “I will make him my firstborn”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/89?lang=eng'
    quote: 'Also I will make him my firstborn, higher than the kings of the earth.'
  - where: 'section “The Firstborn of God”'
    claim: 'Bible Dictionary: Jesus is the firstborn of the spirit children, the Only Begotten in the flesh, and the first to rise from the dead'
    key: bd-firstborn
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/firstborn?lang=eng'
    quote: 'Jesus is the firstborn of the spirit children of our Heavenly Father, the Only Begotten of the Father in the flesh, and the first to rise from the dead in the Resurrection'
  - where: 'section “The Firstborn of God”'
    claim: 'Scripture Helps on Ex. 13:1–2, 12: the commandment “can remind us of Jesus Christ, who was the firstborn of all the spirit children of Heavenly Father”; endnote 26 cites Col. 1:14–18; D&C 93:21'
    key: scripture-helps-ex-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/13-exodus-7-13?lang=eng'
    quote: 'can remind us of Jesus Christ, who was the firstborn of all the spirit children of Heavenly Father'
  - where: 'section “The Firstborn of God”'
    claim: 'Guide to the Scriptures: “The firstborn symbolized Jesus Christ and His earthly ministry, reminding the people that the great Messiah would come (Moses 5:4–8; 6:63).”'
    key: gs-firstborn
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/firstborn?lang=eng'
    quote: 'The firstborn symbolized Jesus Christ and His earthly ministry, reminding the people that the great Messiah would come'
  - where: 'section “The Firstborn of God”'
    claim: 'Moses 5:7: the firstlings offered are “a similitude of the sacrifice of the Only Begotten”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/5?lang=eng'
    quote: 'This thing is a similitude of the sacrifice of the Only Begotten of the Father'
  - where: 'section “The Firstborn of God”'
    claim: 'Student Manual on Ex. 11: the death of Egypt’s firstborn released Israel; “In like manner the atoning sacrifice of the Firstborn Son of God freed the children of God from death, a bondage to Satan.”'
    key: ot-manual-ex-11-19
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-11-19-the-passover-and-the-exodus?lang=eng'
    quote: 'In like manner the atoning sacrifice of the Firstborn Son of God freed the children of God from death, a bondage to Satan.'
  - where: 'section “The Firstborn of God”'
    claim: 'Hunter: “No more would men be required to offer the firstborn lamb from their flock, because the Firstborn of God had come to offer himself as an ‘infinite and eternal sacrifice.’” (the talk never cites Luke 2:22–24 or Ex. 13:2)'
    key: hunter-passover
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1985/04/christ-our-passover?lang=eng'
    quote: 'No more would men be required to offer the firstborn lamb from their flock, because the Firstborn of God had come to offer himself'
  - where: 'section “The Firstborn of God”'
    claim: 'Connection made by this page: the son presented under Ex. 13:2 (Luke 2:22–23) went on to the fate 13:15 assigns to the firstling, so that the two fates meet in Him. No source makes this join (Hunter does not cite Luke 2; the Guide does not name the two fates); stated as the page’s reading and not a teaching of the Church.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/13?lang=eng'
    quote: 'therefore I sacrifice to the Lord all that openeth the matrix, being males; but all the firstborn of my children I redeem.'

  # ---------- section “The inheritance of the firstborn” ----------
  - where: 'section “The inheritance of the firstborn”'
    claim: 'Ellicott on Luke 2:22 compares Heb. 12:23 as “the expansion of the thought to the whole company of those who are the ‘firstborn’”'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/2.htm'
    quote: 'Comp. Hebrews 12:23 as giving the expansion of the thought to the whole company of those who are the “firstborn,”'
  - where: 'section “The inheritance of the firstborn”'
    claim: 'D&C 93:21–22: “am the Firstborn … are the church of the Firstborn”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/93?lang=eng'
    quote: 'And all those who are begotten through me are partakers of the glory of the same, and are the church of the Firstborn.'
  - where: 'section “The inheritance of the firstborn”'
    claim: 'Bible Dictionary: the faithful “receive through Jesus Christ the inheritance of the firstborn” (D&C 93:21–22)'
    key: bd-firstborn
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/firstborn?lang=eng'
    quote: 'since they receive through Jesus Christ the inheritance of the firstborn'
  - where: 'section “The inheritance of the firstborn”'
    claim: 'Student Manual: Christ “came as the Redeemer, paying the price for all, and thus is justified in requesting that they serve Him” (1 Cor. 6:20)'
    key: ot-manual-ex-11-19
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-11-19-the-passover-and-the-exodus?lang=eng'
    quote: 'He came as the Redeemer, paying the price for all, and thus is justified in requesting that they serve Him.'
  - where: 'section “The inheritance of the firstborn”'
    claim: 'Student Manual quoting President Taylor: the saved first-born owed “their services in His cause”'
    key: ot-manual-ex-11-19
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-11-19-the-passover-and-the-exodus?lang=eng'
    quote: 'made a claim upon them for their services in His cause'
