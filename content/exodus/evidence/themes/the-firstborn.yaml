page: the-firstborn
claims:
  - where: 'section “One firstborn against another”'
    claim: 'The tenth plague is taken in 12:29; the reason Exodus gives for it is 4:22–23 (Pharaoh''s decree at 1:22 is the first step)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/12?lang=eng'
    quote: 'And it came to pass, that at midnight the LORD smote all the firstborn in the land of Egypt, from the firstborn of Pharaoh that sat on his throne unto the firstborn of the captive that was in the dungeon; and all the firstborn of cattle.'
  - where: 'section “The night the firstborn died”'
    claim: 'The passing by represents Jesus Christ overcoming death (Gong, quoted)'
    key: scripture-helps-ex-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/13-exodus-7-13?lang=eng'
    quote: 'That passing by, or pass over, represents Jesus Christ ultimately overcoming death.'
  - where: 'section “The night the firstborn died”'
    claim: 'Student Manual compares the death of Egypt''s firstborn freeing Israel with the Firstborn Son''s sacrifice freeing from death'
    key: ot-manual-ex-11-19
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-11-19-the-passover-and-the-exodus?lang=eng'
    quote: 'what finally released the children of Israel from the bondage of the pharaoh (the symbol of Satan) was the death of the firstborn of Egypt. In like manner the atoning sacrifice of the Firstborn Son of God freed the children of God from death, a bondage to Satan.'
  - where: 'section “It is mine”'
    claim: 'The commandment was related to the sparing of Israel''s firstborn; the Lord claimed them'
    key: scripture-helps-ex-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/13-exodus-7-13?lang=eng'
    quote: 'This commandment was related to His sparing of Israel’s firstborn children and animals from the final plague. Having saved the firstborn of the faithful from death, the Lord claimed them as belonging to Him.'
  - where: 'section “The Levites in their place”'
    claim: 'The Lord accepted Levi in lieu of the firstborn; the balance redeemed with money'
    key: ot-manual-ex-11-19
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-11-19-the-passover-and-the-exodus?lang=eng'
    quote: 'He accepted the tribe of Levi in lieu of the first-born of Israel; and as there were more of the first-born than there were of the Levites, the balance had to be redeemed with money'
  - where: 'section “The Firstborn”'
    claim: 'The ransoming ceremony was a symbolic reliving of the Passover'
    key: skinner-life-jesus
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
    quote: 'This ritual of ransoming was a symbolic reliving of the Passover,[23] where the male child was redeemed from full-time servitude to God by a five-shekel payment'
  - where: 'section “The Firstborn”'
    claim: 'Connection made by this page: the Firstborn presented and redeemed under the law of Ex. 13:2 (Luke 2:23), set beside the Firstborn of God who came to offer Himself (Hunter)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/2?lang=eng'
    quote: '(As it is written in the law of the Lord, Every male that openeth the womb shall be called holy to the Lord;)'
  - where: 'section “The Firstborn”'
    claim: 'Jesus is the firstborn of the spirit children and the first to rise from the dead'
    key: bd-firstborn
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/firstborn?lang=eng'
    quote: 'Jesus is the firstborn of the spirit children of our Heavenly Father, the Only Begotten of the Father in the flesh, and the first to rise from the dead in the Resurrection'
  - where: 'section “The Firstborn”'
    claim: 'The commandment can remind us of Jesus Christ, firstborn of the spirit children'
    key: scripture-helps-ex-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/13-exodus-7-13?lang=eng'
    quote: 'The commandment to dedicate firstborn sons to the Lord can remind us of Jesus Christ, who was the firstborn of all the spirit children of Heavenly Father.'
  - where: 'section “The Firstborn”'
    claim: 'Ex. 4:22 (“Israel is my son”) cross-references Hosea 11:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/4?lang=eng'
    quote: 'Hosea 11:1 (1–4)'
  - where: 'section “The Firstborn”'
    claim: 'The Hosea 11 heading says Israel was called out of Egypt in similitude of our Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/11?lang=eng'
    quote: 'Israel, as a child, was called out of Egypt in similitude of our Lord'
  - where: 'section “The Firstborn”'
    claim: 'Hunter: no more the firstborn lamb, because the Firstborn of God had come to offer himself'
    key: hunter-passover
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1985/04/christ-our-passover?lang=eng'
    quote: 'No more would men be required to offer the firstborn lamb from their flock, because the Firstborn of God had come to offer himself as an “infinite and eternal sacrifice.”'
