  - where: 'section “They have well said”'
    claim: 'Seely: “it seems more likely that “prophet” is meant in a collective sense, referring to the future succession of prophets”; conclusion: the prophecy “has been fulfilled in the past by Christ and others”'
    key: seely-prophet-like-moses
    url: 'https://journal.interpreterfoundation.org/a-prophet-like-moses-deuteronomy-1815-18-in-the-book-of-mormon-the-bible-and-the-dead-sea-scrolls/'
    quote: 'a collective sense, referring to the future succession of prophets'
  - where: 'section “They have well said”'
    claim: 'Keil on Deut. 18:15: “treats of the sending of prophets generally”; “that Christ, in whom the prophetic character culminated and was completed, is to be included”'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/18.htm'
    quote: 'that Christ, in whom the prophetic character culminated and was completed, is to be included'
  - where: 'section “They have well said”'
    claim: 'Keil: “treats of the sending of prophets generally”'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/18.htm'
    quote: 'treats of the sending of prophets generally'
  - where: 'section “They have well said”'
    claim: 'Footnote Deut. 18:15b “Prophet” → Acts 3:22 (22–23); 7:37; 1 Ne. 22:21; 3 Ne. 20:23; JS—H 1:40'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/18?lang=eng'
