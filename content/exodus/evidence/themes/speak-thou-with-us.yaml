  - where: 'section “They have well said”'
    claim: 'Student Manual (20-6): “In each instance these scriptures make it clear that the prophet like unto Moses was the Savior, Jesus Christ.”'
    key: ot-manual-deuteronomy-17-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-17-33-an-exhortation-to-obedience-part-2?lang=eng'
    quote: 'In each instance these scriptures make it clear that the prophet like unto Moses was the Savior, Jesus Christ.'
  - where: 'section “They have well said”'
    claim: 'Scripture Helps on Deut. 18:15–19: “After His Resurrection, Jesus Christ declared that He was the fulfillment of Moses’s prophecy.”'
    key: scripture-helps-deut
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/18-deuteronomy-6-8-15-18-29-30-34?lang=eng'
    quote: 'After His Resurrection, Jesus Christ declared that He was the fulfillment of Moses’s prophecy.'
  - where: 'section “They have well said”'
    claim: '3 Ne. 20:23 “Behold, I am he of whom Moses spake”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/20?lang=eng'
