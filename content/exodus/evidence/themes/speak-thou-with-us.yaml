page: speak-thou-with-us
claims:
  # ---------- opening ----------
  - where: 'opening'
    claim: 'Deut. 5:27–28 as quoted: the request in full and the Lord’s “They have well said all that they have spoken.”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/5?lang=eng'
    quote: 'they have well said all that they have spoken.'
  - where: 'opening'
    claim: 'Deut. 18:17–18: “They have well spoken that which they have spoken. I will raise them up a Prophet from among their brethren, like unto thee, and will put my words in his mouth”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/18?lang=eng'
    quote: 'They have well spoken that which they have spoken.'
  - where: 'opening'
    claim: 'D&C 45:4 “behold the blood of thy Son which was shed”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'behold the blood of thy Son which was shed'
  - where: 'opening'
    claim: 'Connection made by this page: the one request (Ex. 20:19; Deut. 5:27) followed through both books to its answer: the man given (Moses, Deut. 5:5; Ex. 32), the One promised (Deut. 18:15–18) and named (Acts 3:22; 3 Ne. 20:23; JST Gal. 3:19–20); the commentaries and footnotes carry the steps, the sequence as one page is the site’s. One own reading named in the body: Ex. 32:32–33 beside D&C 45:3–5.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/20?lang=eng'
    quote: 'Speak thou with us, and we will hear: but let not God speak with us, lest we die.'

  # ---------- section “I stood between the LORD and you” ----------
  - where: 'section “I stood between the LORD and you”'
    claim: 'Deut. 5:5 ʿōmēd bên YHWH ûbênêkem (H5975 + H996), “standing between the LORD and between you”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'עֹמֵ֨ד'
  - where: 'section “I stood between the LORD and you”'
    claim: 'Keil on Deut. 5:5: “showing the mediatorial position which he occupied between the Lord and the people … which alone in fact rendered the conclusion of the covenant possible at all, on account of the alarm of the people”'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/5.htm'
    quote: 'showing the mediatorial position which he occupied between the Lord and the people'
  - where: 'section “I stood between the LORD and you”'
    claim: 'Keil, same paragraph: “which alone in fact rendered the conclusion of the covenant possible at all, on account of the alarm of the people”'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/5.htm'
    quote: 'which alone in fact rendered the conclusion of the covenant possible at all, on account of the alarm of the people'
  - where: 'section “I stood between the LORD and you”'
    claim: 'Cambridge on Deut. 5:23–27: “The people, fearing the fatal effect of hearing God’s voice directly, request Moses to act as mediator.”'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/5.htm'
    quote: 'The people, fearing the fatal effect of hearing God’s voice directly, request Moses to act as mediator.'
  - where: 'section “I stood between the LORD and you”'
    claim: 'Bible Dictionary, Priests: “a mediator between his people and God … By virtue of his office he was able to draw nigh to God, while they, because of their sins and infirmities, must needs stand afar off.”'
    key: bd-priests
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/priests?lang=eng'
    quote: 'By virtue of his office he was able to draw nigh to God, while they, because of their sins and infirmities, must needs stand afar off.'
  - where: 'section “I stood between the LORD and you”'
    claim: 'Keil on Deut. 5:28–31: “God approved of what the people said, because it sprang from a consciousness of the unworthiness of any sinner to come into the presence of the holy God”'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/5.htm'
    quote: 'God approved of what the people said, because it sprang from a consciousness of the unworthiness of any sinner to come into the presence of the holy God'
  - where: 'section “I stood between the LORD and you”'
    claim: 'D&C 84:24 “could not endure his presence”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'But they hardened their hearts and could not endure his presence'
  - where: 'section “I stood between the LORD and you”'
    claim: 'Scripture Helps on Ex. 20:18–21: “it appears that the Lord had intended for them to experience something more significant”'
    key: scripture-helps-ex-19
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/15-exodus-19-20-24-31-34?lang=eng'
    quote: 'it appears that the Lord had intended for them to experience something more significant'
  - where: 'section “I stood between the LORD and you”'
    claim: 'Num. 16:48 wayyaʿămōd bên (H5975 + H996), the only other “stood between” in the Pentateuch (occurrences.mjs all “stood between”; the two verses share ʿāmad + bên … ûbên); stated as a fact of the text with a pointer to the Numbers essay.'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'וַ/יַּעֲמֹ֥ד'
  - where: 'section “I stood between the LORD and you”'
    claim: 'Num. 16:48 “And he stood between the dead and the living; and the plague was stayed.”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/16?lang=eng'
    quote: 'And he stood between the dead and the living; and the plague was stayed.'

  # ---------- section “They have well said” ----------
  - where: 'section “They have well said”'
    claim: 'hêṭîbû (H3190, Hiphil perfect 3cp) at Deut. 5:28 “well said” and 18:17 “well spoken”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'הֵיטִ֖יבוּ'
  - where: 'section “They have well said”'
    claim: 'Ellicott on Deut. 5:28–31: “It will appear by comparison of the two passages that the promise of the prophet like unto Moses was given at this very time”'
    key: ellicott-deuteronomy
    url: 'https://biblehub.com/commentaries/ellicott/deuteronomy/5.htm'
    quote: 'It will appear by comparison of the two passages that the promise of the prophet like unto Moses was given at this very time'
  - where: 'section “They have well said”'
    claim: 'Footnote Deut. 18:16a “hear” → Ex. 20:19; Deut. 5:25. TG Hardheartedness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/18?lang=eng'
    quote: 'According to all that thou desiredst of the Lord thy God in Horeb in the day of the assembly'
  - where: 'section “They have well said”'
    claim: 'Keil on Deut. 18:15: “at any time when the people stood in need of a mediator with God like Moses, God would invariably send a prophet”; “The promised prophet, therefore, was to resemble Moses”'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/18.htm'
    quote: 'at any time when the people stood in need of a mediator with God like Moses, God would invariably send a prophet'
  - where: 'section “They have well said”'
    claim: 'Keil, same paragraph: “The promised prophet, therefore, was to resemble Moses”'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/18.htm'
    quote: 'The promised prophet, therefore, was to resemble Moses'
  - where: 'section “They have well said”'
    claim: 'Cambridge on Deut. 18:15–19: “to be such a mediator of His word, as in Ḥoreb they had prayed Moses to be”; “the phrase does not imply equality in rank with Moses”'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/18.htm'
    quote: 'the phrase does not imply equality in rank with Moses'
  - where: 'section “They have well said”'
    claim: 'Cambridge, same chapter: “to be such a mediator of His word, as in Ḥoreb they had prayed Moses to be”'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/18.htm'
    quote: 'they had prayed Moses to be'
  - where: 'section “They have well said”'
    claim: 'Bowen: the Israelites’ “rejection of the immediate presence of God and a request for human intermediaries served as the basis for the giving of this prophecy”'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
