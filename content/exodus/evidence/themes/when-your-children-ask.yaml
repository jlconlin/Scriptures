page: when-your-children-ask
claims:
  - where: 'section “God remembers first”'
    claim: 'The Church’s footnote to Ex. 3:15 gives the alternative “thus shall I be remembered” for “this”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/3?lang=eng'
    quote: 'thus shall I be remembered'
  - where: 'section “God remembers first”'
    claim: 'The noun zikkaron (“memorial,” as in Ex. 12:14) is formed from the verb zakar, “remember”'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/2146.htm'
    quote: 'From zakar; a memento (or memorable thing, day or writing) -- memorial, record.'
  - where: 'section “God remembers first”'
    claim: 'The noun zeker (“memorial,” as in Ex. 3:15) is formed from zakar'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/2143.htm'
    quote: 'from zakar; a memento, abstr. Recollection (rarely if ever); by implication, commemoration -- memorial, memory, remembrance, scent.'
  - where: 'section “God remembers first”'
    claim: 'The verb zakar means to remember'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/2142.htm'
    quote: 'zakar: To remember, to recall, to call to mind, to mention'
  - where: 'section “God remembers first”'
    claim: 'Ex. 2:24 “remembered” is the verb zakar (H2142)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וַ/יִּזְכֹּ֤ר'
  - where: 'section “God remembers first”'
    claim: 'Ex. 3:15 “memorial” is zeker (H2143)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'זִכְרִ֖/י'
  - where: 'section “A day, a question, an answer”'
    claim: 'Ex. 10:2 has “tell in the ears of thy son” and no “remember” or “memorial”; Exodus has “remember” only in 2:24, 6:5, 13:3, 20:8, 32:13, and “memorial” only in 3:15, 12:14, 13:9, 17:14, 28:12, 28:29, 30:16, 39:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/10?lang=eng'
    quote: 'And that thou mayest tell in the ears of thy son, and of thy son’s son, what things I have wrought in Egypt'
  - where: 'section “A day, a question, an answer”'
    claim: 'Ex. 12:26–27 gives the children’s question and the parents’ answer with “say,” not “remember”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/12?lang=eng'
    quote: 'when your children shall say unto you, What mean ye by this service?'
  - where: 'section “A day, a question, an answer”'
    claim: 'Ex. 13:8 and 13:14 give the answer with “shew” and “say,” not “remember”; 13:9 has “memorial”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/13?lang=eng'
    quote: 'when thy son asketh thee in time to come, saying, What is this? that thou shalt say unto him, By strength of hand the LORD brought us out from Egypt'
  - where: 'section “A day, a question, an answer”'
    claim: 'Josh. 4:6–7 has the children’s question and the word “memorial”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/4?lang=eng'
    quote: 'these stones shall be for a memorial unto the children of Israel for ever'
  - where: 'section “Before the LORD”'
    claim: 'An older commentary reads the memorial stones as meaning that the LORD might remember the sons of Israel'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/28.htm'
    quote: 'i.e., that Jehovah might remember the sons of Israel when Aaron appeared before Him clothed with the ephod'
  - where: 'section “Before the LORD”'
    claim: 'Ex. 32:13 is the one place in Exodus where a person asks God to remember (the verbs “remember” in Exodus: 2:24, 6:5 God remembers; 13:3 Moses to the people; 20:8 God to Israel; 32:13 Moses to the LORD; the Hebrew verb zakar also stands at 20:24, 23:13 and 34:19, and none of them is a request to God)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/32?lang=eng'
    quote: 'Remember Abraham, Isaac, and Israel, thy servants, to whom thou swarest by thine own self'
  - where: 'section “Before the LORD”'
    claim: 'Connection made by this page: the memorials of Ex. 12–13 (“Remember this day”) set beside the memorials “before the LORD” (Ex. 28:29; 30:16): a memorial given “unto you” with “Remember this day,” and memorials borne or set “before the LORD”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/28?lang=eng'
    quote: 'for a memorial before the LORD continually'
  - where: 'section “In remembrance of me”'
    claim: 'Luke calls the supper “this passover” and gives “this do in remembrance of me”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/22?lang=eng'
    quote: 'With desire I have desired to eat this passover with you before I suffer:'
  - where: 'section “In remembrance of me”'
    claim: 'Paul repeats the words over the bread and the cup'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/11?lang=eng'
    quote: 'And when he had given thanks, he brake it, and said, Take, eat: this is my body, which is broken for you: this do in remembrance of me.'
  - where: 'section “In remembrance of me”'
    claim: 'Paul writes “Christ our passover is sacrificed for us”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/5?lang=eng'
    quote: 'For even Christ our passover is sacrificed for us:'
  - where: 'section “In remembrance of me”'
    claim: 'John 19:14 would put the Last Supper the night before Passover'
    key: sc-knowhy-845
    url: 'https://scripturecentral.org/knowhy/why-is-the-passover-important-for-understanding-easter'
    quote: 'Of course, this would mean Jesus’s Last Supper was not the night of Passover, but would have occurred the night before.'
  - where: 'section “In remembrance of me”'
    claim: 'Jesus introduced the sacrament at the end of the Passover meal, to be repeated in remembrance of Him'
    key: scripture-helps-ex-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/13-exodus-7-13?lang=eng'
    quote: 'At the end of this meal, Jesus introduced the ordinance of the sacrament, which He told His disciples to repeat in remembrance of Him.'
  - where: 'section “In remembrance of me”'
    claim: 'President Packer: the Passover would be commemorated forever as the sacrament'
    key: scripture-helps-ex-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/13-exodus-7-13?lang=eng'
    quote: 'President Boyd K. Packer explained that after the death of Jesus Christ, “the Passover would be commemorated forever as the sacrament.”'
  - where: 'section “Always remember him”'
    claim: 'The sacrament prayer on the bread: willing to take His name and always remember him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/moro/4?lang=eng'
    quote: 'that they are willing to take upon them the name of thy Son, and always remember him, and keep his commandments'
  - where: 'section “Always remember him”'
    claim: 'The prayer on the wine: they do always remember him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/moro/5?lang=eng'
    quote: 'that they do always remember him, that they may have his Spirit to be with them'
  - where: 'section “Always remember him”'
    claim: 'D&C 20:77, 79 have the same words as Moro. 4:3 and 5:2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/20?lang=eng'
    quote: 'that they do always remember him, that they may have his Spirit to be with them'
  - where: 'section “Always remember him”'
    claim: 'The risen Lord at 3 Ne. 18:7: ye do always remember me'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/18?lang=eng'
    quote: 'it shall be a testimony unto the Father that ye do always remember me'
  - where: 'section “Always remember him”'
    claim: 'Connection made by this page: the sacrament prayers’ “witness unto thee, O God” (Moro. 4:3) and “a testimony unto the Father” (3 Ne. 18:7), set beside the Exodus memorials borne “before the LORD” (Ex. 28:29)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/28?lang=eng'
    quote: 'for a memorial before the LORD continually'
