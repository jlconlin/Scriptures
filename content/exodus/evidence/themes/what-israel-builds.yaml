  - where: 'section “The service of the tabernacle”'
    claim: 'The noun avodah (5656) occurs 23 times in 20 verses of Exodus: Egypt’s labor in chapters 1–6 (nine), the Passover service at 12:25, 12:26, 13:5, and the tabernacle (eleven, 27:19 to 39:42)'
