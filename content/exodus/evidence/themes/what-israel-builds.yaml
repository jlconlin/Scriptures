  - where: 'section “The service of the tabernacle”'
    claim: 'Temple worship, service and work share the same term in the Old Testament'
    key: lane-worship
    url: 'https://rsc.byu.edu/ascending-mountain-lord/worship-bowing-down-serving-lord'
    quote: 'These connections can help us see how temple worship, temple service, and temple work are literally synonymous in the Old Testament—they share the same term.'
  - where: 'section “The service of the tabernacle”'
    claim: 'Connection made by this page: the noun avodah, first used of the labor Pharaoh forced (1:14) and last used of the finished tabernacle (39:42, “work” in the King James), set side by side'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/39?lang=eng'
    quote: 'so the children of Israel made all the work'
  - where: 'section “The Servant”'
    claim: 'The words for Israel’s bondage come from root ‘bd; the Isaiah 53 “servant” is a noun from it'
    key: brown-exodus-pattern
    url: 'https://rsc.byu.edu/jerusalem-zarahemla/exodus-pattern-book-mormon'
    quote: 'All of the words describing Israel’s bondage derive from the root ‘bd. It is also a noun from this same root which is translated “servant” in Isaiah 53'
  - where: 'section “The Servant”'
    claim: 'Brown: Jesus is the expected servant who frees from bondage'
    key: brown-exodus-pattern
    url: 'https://rsc.byu.edu/jerusalem-zarahemla/exodus-pattern-book-mormon'
    quote: 'Jesus is the expected servant (‘ebed) who, by paying the price of redemption, frees all those who will follow him from bondage'
