page: sabbath-and-tabernacle
claims:
  - where: opening
    claim: 'Connection made by this page: the Sabbath passages of Ex. 16, 20, 31, 35 and the finishing of the work (39–40) are set out in the order of the text as a sequence'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/35?lang=eng'
    quote: 'Six days shall work be done, but on the seventh day there shall be to you an holy day, a sabbath of rest to the LORD'
  - where: section “Before Sinai”
    claim: 'The noun “sabbath” does not occur in the Bible before Exodus 16'
    key: pike-sabbath-ot
    url: 'https://rsc.byu.edu/sacred-time/sabbath-old-testament'
    quote: 'Surprisingly, the noun šabbāt does not occur in the Bible until Exodus 16'
  - where: section “Before Sinai”
    claim: 'The Sabbath was a holy day before the law, citing the manna narrative (Ex. 16:23–30)'
    key: bd-sabbath
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sabbath?lang=eng'
    quote: 'The Sabbath was a holy day before the giving of the law, even from the earliest times'
  - where: section “The reason given”
    claim: 'The Church’s footnote glosses “sabbath” (20:8) as stopping, cessation, rest, and points to Ex. 31:17'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/20?lang=eng'
    quote: 'HEB stopping, cessation, rest (from labor). See Ex. 31:17.'
  - where: section “The reason given”
    claim: 'The Lord’s resting on the seventh day is a pattern'
    key: scripture-helps-gen-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/02-genesis-1-2-moses-2-3-abraham-4-5?lang=eng'
    quote: 'The Lord resting on the seventh day provides a pattern for us to follow.'
  - where: section “The reason given”
    claim: 'Ex. 20:11 “rested” is wayyanach (H5117), a different verb from shavat of Gen. 2:2–3 and Ex. 31:17'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וַ/יָּ֖נַח'
  - where: section “The reason given”
    claim: 'Ex. 31:17 uses shavat'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'שָׁבַ֖ת'
  - where: section “The reason given”
    claim: 'Gen. 2:2 uses shavat'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'וַ/יִּשְׁבֹּת֙'
  - where: section “The sign that closes the instructions”
    claim: 'The Sabbath was given as a sign of the covenant relationship, with the promise to make His covenant people holy'
    key: scripture-helps-ex-19
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/15-exodus-19-20-24-31-34?lang=eng'
    quote: 'The Lord taught the Israelites that He gave the Sabbath day to them as a “sign” of their covenant relationship with Him. As they observed His Sabbath, the Lord promised to make His covenant people holy.'
  - where: section “First, when the work begins”
    claim: 'Connection made by this page: the Sabbath is the last subject of the tabernacle instructions (31:12–17) and the first of the building (35:1–3), with the golden calf between'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/31?lang=eng'
    quote: 'Verily my sabbaths ye shall keep: for it is a sign between me and you throughout your generations'
  - where: section “Finished, seen, blessed”
    claim: 'Connection made by this page: Ex. 39:32, 43 and Gen. 1:31–2:3 share wording in English (“finished”, “saw… and, behold”, “blessed”)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/39?lang=eng'
    quote: 'And Moses did look upon all the work, and, behold, they had done it as the LORD had commanded, even so had they done it: and Moses blessed them.'
  - where: section “Finished, seen, blessed”
    claim: 'Connection made by this page: the Genesis words the comparison rests on'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/2?lang=eng'
    quote: 'Thus the heavens and the earth were finished, and all the host of them.'
  - where: section “Finished, seen, blessed”
    claim: '“Finished” is one root (kalah): Gen. 2:2'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'וַ/יְכַ֤ל'
  - where: section “Finished, seen, blessed”
    claim: '“Finished” (kalah): Ex. 39:32'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וַ/תֵּ֕כֶל'
  - where: section “Finished, seen, blessed”
    claim: '“Finished” (kalah): Ex. 40:33'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וַ/יְכַ֥ל'
  - where: section “Finished, seen, blessed”
    claim: '“Work” (melakhah): Gen. 2:2–3'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'מְלַאכְתּ֔/וֹ'
  - where: section “Finished, seen, blessed”
    claim: '“Work” (melakhah): Ex. 39:43'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'הַ/מְּלָאכָ֗ה'
  - where: section “Finished, seen, blessed”
    claim: '“Blessed” (barak): Gen. 2:3 and Ex. 39:43'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וַ/יְבָ֥רֶךְ'
  - where: section “Finished, seen, blessed”
    claim: '“Saw… and behold” (wayyar… wehinneh): Ex. 39:43 and Gen. 1:31'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וְ/הִנֵּה֙'
  - where: section “Finished, seen, blessed”
    claim: '“Saw… and behold” (wayyar… wehinneh) at Gen. 1:31'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'וְ/הִנֵּה'
  - where: section “Finished, seen, blessed”
    claim: 'Bradshaw: for Ex. 40:33 the Hebrew strongly parallels the account of how God finished Creation'
    key: bradshaw-moses-temple-text
    url: 'https://journal.interpreterfoundation.org/the-book-of-moses-as-a-temple-text/'
    quote: 'Exodus 40:33 describes how Moses completed the Tabernacle. The Hebrew text strongly parallels the account of how God finished Creation.'
  - where: section “Finished, seen, blessed”
    claim: 'Belnap: it appears that the writers of Exodus deliberately invoked the Creation to describe the building of the tabernacle'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'it appears that the writers of Exodus deliberately invoked the Creation to describe the building of the tabernacle.'
  - where: section “Lord of the Sabbath”
    claim: 'JST Mark 2:26–27: the Son of man made the Sabbath day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-mark/2?lang=eng'
    quote: 'For the Son of man made the Sabbath day, therefore the Son of man is Lord also of the Sabbath.'
  - where: section “Lord of the Sabbath”
    claim: 'The Sabbath symbolized the creation, the deliverance from Egypt and the resurrection'
    key: bd-sabbath
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sabbath?lang=eng'
    quote: 'the Sabbath was symbolic of the mighty works of God: the creation of the earth, the deliverance of Israel from Egypt, and the resurrection of Jesus from the dead.'
  - where: section “Lord of the Sabbath”
    claim: 'After the Resurrection the Church observed the first day of the week to remember it'
    key: gs-sabbath-day
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/sabbath-day?lang=eng'
    quote: 'After the Resurrection, the members of the Church, whether Jews or Gentiles, observed the first day of the week (the Lord’s day) to remember the Lord’s Resurrection.'
  - where: section “Lord of the Sabbath”
    claim: 'President Nelson: the Savior identified Himself as Lord of the Sabbath'
    key: nelson-sabbath
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2015/04/the-sabbath-is-a-delight?lang=eng'
    quote: 'The Savior identified Himself as Lord of the Sabbath. It is His day!'
