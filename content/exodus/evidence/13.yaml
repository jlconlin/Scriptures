    quote: 'Their first encounter may not be considered a theophany proper, but they definitely experienced Jehovah’s presence.'
  - where: 'note 13:21 “The pillar of cloud and fire”'
    claim: 'The pairing first appears here and becomes a common motif of divine encounters'
    key: muhlestein-theophanies
    url: 'https://rsc.byu.edu/ascending-mountain-lord/darkness-light-lord-elements-israelite-theophanies'
    quote: 'It is here that we first encounter the seemingly paradoxical appearance of the Lord as a fire and a cloud. This almost antithetical parallel use of the two ideas becomes a common motif of divine encounters throughout the Bible.'
  - where: 'note 13:21 “The pillar of cloud and fire”'
    claim: 'One pillar was both fire and cloud'
    key: muhlestein-theophanies
    url: 'https://rsc.byu.edu/ascending-mountain-lord/darkness-light-lord-elements-israelite-theophanies'
    quote: 'It is striking that the same pillar acted as both fire and cloud, light and darkness.'
  - where: 'note 13:21 “The pillar of cloud and fire”'
    claim: 'The pillar contained the Lord’s presence'
