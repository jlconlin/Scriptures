    url: 'https://rsc.byu.edu/ascending-mountain-lord/darkness-light-lord-elements-israelite-theophanies'
    quote: 'As it contained the Lord’s presence, the pillar was simultaneously fire and cloud.'
  - where: 'note 13:21 “The pillar of cloud and fire”'
    claim: 'A reading of why fire and cloud together: revealed and hidden'
