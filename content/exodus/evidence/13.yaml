chapter: 13
claims:
  - where: 'when'
    claim: 'Moses speaks on the day of the departure, in the month Abib; the Hebrew of “came ye out” is “you are to come out”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/13?lang=eng'
    quote: 'HEB you are to come out.'
  - where: 'setting'
    claim: 'Israel had gone from Rameses to Succoth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/12?lang=eng'
    quote: 'And the children of Israel journeyed from Rameses to Succoth, about six hundred thousand on foot that were men, beside children.'
  - where: 'setting'
    claim: 'The LORD brought Israel out “the selfsame day”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/12?lang=eng'
    quote: 'And it came to pass the selfsame day, that the LORD did bring the children of Israel out of the land of Egypt by their armies.'
  - where: 'setting'
    claim: 'The feast of unleavened bread was commanded in chapter 12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/12?lang=eng'
    quote: 'And ye shall observe the feast of unleavened bread; for in this selfsame day have I brought your armies out of the land of Egypt: therefore shall ye observe this day in your generations by an ordinance for ever.'
  - where: 'setting'
    claim: 'The law repeats the redemption of the firstborn'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'But the firstling of an ass thou shalt redeem with a lamb: and if thou redeem him not, then shalt thou break his neck. All the firstborn of thy sons thou shalt redeem.'
  - where: 'setting'
    claim: 'Nehemiah remembers the pillar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/9?lang=eng'
    quote: 'Moreover thou leddest them in the day by a cloudy pillar; and in the night by a pillar of fire, to give them light in the way wherein they should go.'
  - where: 'setting'
    claim: 'The psalms remember the pillar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/78?lang=eng'
    quote: 'In the daytime also he led them with a cloud, and all the night with a light of fire.'
  - where: 'thread'
    claim: 'The chapter’s matters, as the Church’s heading lists them: firstborn, feast, Joseph’s bones, pillar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/13?lang=eng'
    quote: 'The firstborn of man and of beasts are to be sanctified unto the Lord—The Feast of Unleavened Bread is to be kept in the land of Canaan'
  - where: 'section 1 plain'
    claim: '“Sanctify” may be rendered “consecrate,” that is, set apart'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/13?lang=eng'
    quote: 'OR Consecrate.'
  - where: 'section 2 plain'
    claim: '“This day came ye out” is in Hebrew “you are to come out”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/13?lang=eng'
    quote: 'HEB you are to come out.'
  - where: 'section 2 plain'
    claim: '“In all thy quarters” means within all your borders; “shew” is “tell”; “in his season” is “at the appointed time”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/13?lang=eng'
    quote: 'OR within all your borders.'
  - where: 'section 3 plain'
    claim: '“All that openeth the matrix” is all the firstborn'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/13?lang=eng'
    quote: 'IE all the firstborn (see also v. 15).'
  - where: 'section 3 plain'
    claim: '“Would hardly let us go” is “stubbornly refused to let us go”; “ass” is donkey'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus+13%3A13-18&version=NRSVUE'
    quote: 'When Pharaoh stubbornly refused to let us go, the Lord killed all the firstborn in the land of Egypt'
  - where: 'section 4 plain'
    claim: '“Repent” is “change their minds”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus+13%3A13-18&version=NRSVUE'
    quote: 'If the people face war, they may change their minds and return to Egypt.'
  - where: 'section 4 plain'
    claim: '“Harnessed” is “equipped for battle”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/13?lang=eng'
    quote: 'OR equipped for battle.'

  - where: 'note 13:2 “What became of the claim on the firstborn”'
    claim: 'The footnote renders “Sanctify” as “Consecrate”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/13?lang=eng'
    quote: 'OR Consecrate.'
  - where: 'note 13:2 “What became of the claim on the firstborn”'
    claim: 'The LORD hallowed Israel’s firstborn on the day He smote Egypt’s; the Levites were taken instead of the firstborn'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/3?lang=eng'
    quote: 'Because all the firstborn are mine; for on the day that I smote all the firstborn in the land of Egypt I hallowed unto me all the firstborn in Israel, both man and beast: mine shall they be'
  - where: 'note 13:2 “What became of the claim on the firstborn”'
    claim: 'The 273 firstborn beyond the number of the Levites were redeemed at five shekels each'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/3?lang=eng'
    quote: 'And for those that are to be redeemed of the two hundred and threescore and thirteen of the firstborn of the children of Israel, which are more than the Levites;'
  - where: 'note 13:2 “What became of the claim on the firstborn”'
    claim: 'Five shekels apiece'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/3?lang=eng'
    quote: 'Thou shalt even take five shekels apiece by the poll, after the shekel of the sanctuary shalt thou take them'
  - where: 'note 13:2 “What became of the claim on the firstborn”'
    claim: 'Every firstborn son was to be redeemed from a month old for five shekels'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/18?lang=eng'
    quote: 'And those that are to be redeemed from a month old shalt thou redeem, according to thine estimation, for the money of five shekels, after the shekel of the sanctuary, which is twenty gerahs.'
  - where: 'note 13:2 “What became of the claim on the firstborn”'
    claim: 'Under the law the firstborn son belonged to God and was redeemed'
    key: bd-firstborn
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/firstborn?lang=eng'
    quote: 'Under the law of Moses, the firstborn son was regarded as belonging to God, and special ordinances were provided for his redemption (Ex. 13:12–15; 22:29; Num. 3:45; Luke 2:22–23).'
  - where: 'note 13:2 “What became of the claim on the firstborn”'
    claim: 'The firstborn were at first to serve in a priestly role, and the Levites later filled it'
    key: scripture-helps-ex-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/13-exodus-7-13?lang=eng'
    quote: 'Originally, the firstborn male from each family was to serve in a priestly role in the tabernacle. Later, the tribe of Levi exclusively filled that role (see Numbers 3:12).'
  - where: 'note 13:2 “What became of the claim on the firstborn”'
    claim: 'Luke cites this law at the presentation of Jesus; the footnote at “womb” in 13:2 points to Luke 2:23'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/2?lang=eng'
    quote: '(As it is written in the law of the Lord, Every male that openeth the womb shall be called holy to the Lord;)'

  - where: 'note 13:4 “The month Abib”'
    claim: 'Abib means a green head of grain; the harvest month; later called Nisan'
    key: bd-abib
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abib?lang=eng'
    quote: 'A green head of grain. The name of the harvest month (Ex. 13:4; 23:15; 34:18; Deut. 16:1). After the Captivity it was known as Nisan (Neh. 2:1).'
  - where: 'note 13:4 “The month Abib”'
    claim: 'Abib falls in March or April'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'On the 10th Abib (March or April) a male lamb (or kid) of the first year, without blemish, was chosen'

  - where: 'note 13:9 “A sign on the hand and between the eyes”'
    claim: 'The Hebrew word for “frontlets” means bands between the eyes, figurative at 13:16'
    key: bdb
    url: 'https://biblehub.com/hebrew/2903.htm'
    quote: 'always bands, frontlet-bands, between the eyes … figurative of dedication of firstborn'
  - where: 'note 13:9 “A sign on the hand and between the eyes”'
    claim: 'The injunction was originally figurative and later taken literally, whence phylacteries'
    key: bdb
    url: 'https://biblehub.com/hebrew/2903.htm'
    quote: 'This injunction, originally figurative for perpetual remembrance … was taken literally by later Jews, and hence the custom of wearing phylacteries'
  - where: 'note 13:9 “A sign on the hand and between the eyes”'
    claim: 'A modern translation has “emblem on your forehead” and marks the Hebrew as uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus+13%3A13-18&version=NRSVUE'
    quote: 'It shall serve as a sign on your hand and as an emblem on your forehead that by strength of hand the Lord brought us out of Egypt.'
  - where: 'note 13:9 “A sign on the hand and between the eyes”'
    claim: 'The translation’s footnote on “emblem”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus+13%3A13-18&version=NRSVUE'
    quote: 'Or as a frontlet; meaning of Heb uncertain'
  - where: 'note 13:9 “A sign on the hand and between the eyes”'
    claim: 'What frontlets or phylacteries were, and that they held Ex. 13:1–10 and 11–16'
    key: bd-frontlets
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/frontlets?lang=eng'
    quote: 'Strips of parchment on which were written four passages of scriptures (Ex. 13:1–10, 11–16; Deut. 6:5–9; 11:13–21) and that were rolled up and attached to bands of leather worn (as an act of obedience to Ex. 13:9, 16; Deut. 6:8; 11:18) around the forehead or around the arm.'
  - where: 'note 13:9 “A sign on the hand and between the eyes”'
    claim: 'The Pharisees wore them broad to be conspicuous'
    key: bd-frontlets
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/frontlets?lang=eng'
    quote: 'The Pharisees wore them broader than other people in order to make them as conspicuous as possible (Matt. 23:5).'
  - where: 'note 13:9 “A sign on the hand and between the eyes”'
    claim: 'Deuteronomy uses the same pair of the commandments; the footnotes at 13:9 and 13:16 point there'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/6?lang=eng'
    quote: 'And thou shalt bind them for a sign upon thine hand, and they shall be as frontlets between thine eyes.'

  - where: 'note 13:13 “Why a donkey is redeemed with a lamb”'
    claim: 'Clean firstborn animals were sacrificed; unclean might be redeemed, sold, or put to death'
    key: bd-firstborn
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/firstborn?lang=eng'
    quote: 'The male firstborn of animals also belonged to God. Clean animals were used for sacrifices, while unclean animals might be redeemed, sold, or put to death (Ex. 13:2–13; 34:19–20; Lev. 27:11–13, 26–27).'
  - where: 'note 13:13 “Why a donkey is redeemed with a lamb”'
    claim: 'The ass stands for the unclean domestic animals; a lamb is given for it or it is killed'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/13.htm'
    quote: 'asses, as the most common of the unclean domestic animals, instead of the whole of these animals, Numbers 18:15'
  - where: 'note 13:13 “Why a donkey is redeemed with a lamb”'
    claim: 'The donkey was redeemed with a lamb or kid, or killed'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/13.htm'
    quote: 'The first-born of the ass was to be redeemed with a male lamb or kid'
  - where: 'note 13:13 “Why a donkey is redeemed with a lamb”'
    claim: 'The Hebrew verb for “redeem”'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/13.htm'
    quote: 'the word used regularly of redeeming a person, or animal, from death or servitude'
  - where: 'note 13:13 “Why a donkey is redeemed with a lamb”'
    claim: 'An unredeemed donkey could not be kept'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/13.htm'
    quote: 'Unless redeemed, it could not be retained for use by its owner.'
  - where: 'note 13:13 “Why a donkey is redeemed with a lamb”'
    claim: 'Numbers gives the rule for unclean beasts generally; Exodus repeats the rule at 34:19–20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/18?lang=eng'
    quote: 'nevertheless the firstborn of man shalt thou surely redeem, and the firstling of unclean beasts shalt thou redeem.'

  - where: 'note 13:15 “Hardly means stubbornly”'
    claim: 'The Hebrew verb in 13:15 is H7185 (qashah), Hiphil'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'הִקְשָׁ֣ה'
  - where: 'note 13:15 “Hardly means stubbornly”'
    claim: 'The verb means to make difficult; the clause at 13:15'
    key: bdb
    url: 'https://biblehub.com/hebrew/7185.htm'
    quote: 'make difficult, difficulty: הִקְשָׁה לְשַׁלְּחֵנוּ Exodus 13:15 Pharaoh made difficulty about sending us away'
  - where: 'note 13:15 “Hardly means stubbornly”'
    claim: 'The same verb is used of the hardening of Pharaoh’s heart at 7:3'
    key: bdb
    url: 'https://biblehub.com/hebrew/7185.htm'
    quote: 'make hard, stiff, stubborn, figurative of obstinacy … Exodus 7:3 (P)'
  - where: 'note 13:15 “Hardly means stubbornly”'
    claim: 'A modern translation: “stubbornly refused”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus+13%3A13-18&version=NRSVUE'
    quote: 'When Pharaoh stubbornly refused to let us go, the Lord killed all the firstborn in the land of Egypt'
  - where: 'note 13:15 “Hardly means stubbornly”'
    claim: 'A second modern translation has the same'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Exodus+13%3A13-18&version=NIV'
    quote: 'When Pharaoh stubbornly refused to let us go, the Lord killed the firstborn of both people and animals in Egypt.'

  - where: 'note 13:17 “The short road Israel did not take”'
    claim: 'The Exodus route avoided the forts and the direct routes, the way of the Philistines and the way of Shur'
    key: muhlestein-israel-egypt
    url: 'https://rsc.byu.edu/creation-sinai/israel-egypt-canaan'
    quote: 'the route of the Exodus kept them from encountering the major forts and encounters with the forces of the Egyptians,'
  - where: 'note 13:17 “The short road Israel did not take”'
    claim: 'The way of the Philistines and of Shur were the shortest routes'
    key: muhlestein-israel-egypt
    url: 'https://rsc.byu.edu/creation-sinai/israel-egypt-canaan'
    quote: 'including the way of the Philistines and the way of Shur, the shortest and most direct routes to Canaan.'
  - where: 'note 13:17 “The short road Israel did not take”'
    claim: 'Israel avoided the well-garrisoned route'
    key: muhlestein-israel-egypt
    url: 'https://rsc.byu.edu/creation-sinai/israel-egypt-canaan'
    quote: 'we know they avoided the more traveled and well-garrisoned route and instead went largely east and a little south.'
  - where: 'note 13:17 “The short road Israel did not take”'
    claim: 'Military outposts on the way of the Philistines; though equipped for battle the people might have gone back; the longer road was safer but hemmed them in'
    key: ot-minute-ex-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-7-13'
    quote: 'This was because there were military outposts on the “way of the land of the Philistines.” If the Israelites got caught in any skirmishes with the military along the way even though they were equipped or “harnessed” for battle, they may have become discouraged and returned to Egypt.'
  - where: 'note 13:17 “The short road Israel did not take”'
    claim: 'The longer route was safer and hemmed Israel in'
    key: ot-minute-ex-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-7-13'
    quote: 'which was a longer, but safer, route. However, the route also hemmed in the Israelites between the Red Sea and Pharaoh’s armies.'
  - where: 'note 13:17 “The short road Israel did not take”'
    claim: '“Repent” here is to change their minds'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus+13%3A13-18&version=NRSVUE'
    quote: 'If the people face war, they may change their minds and return to Egypt.'
  - where: 'note 13:17 “The short road Israel did not take”'
    claim: 'The Hebrew word behind “harnessed” means in battle array'
    key: bdb
    url: 'https://biblehub.com/hebrew/2571.htm'
    quote: 'adjective plural in battle array, always this form, Exodus 13:18 (E)'
  - where: 'note 13:17 “The short road Israel did not take”'
    claim: 'The footnote at “repent” points to Ex. 14:12 (11–12) and Num. 14:4 (1–4)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/13?lang=eng'
    quote: 'Ex. 14:12 (11–12); Num. 14:4 (1–4).'
  - where: 'note 13:17 “The short road Israel did not take”'
    claim: 'At the sea the Egyptians marched after them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/14?lang=eng'
    quote: 'And when Pharaoh drew nigh, the children of Israel lifted up their eyes, and, behold, the Egyptians marched after them; and they were sore afraid'
  - where: 'note 13:17 “The short road Israel did not take”'
    claim: 'The spies’ report at the border of Canaan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/13?lang=eng'
    quote: 'But the men that went up with him said, We be not able to go up against the people; for they are stronger than we.'

  - where: 'note 13:18 “The Red sea, the sea of reeds, and the unknown route”'
    claim: 'The Hebrew of “Red sea” at 13:18 is yam suph (H3220, H5488)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'ס֑וּף'
  - where: 'note 13:18 “The Red sea, the sea of reeds, and the unknown route”'
    claim: 'Suph means reeds or rushes, and is the word at Ex. 2:3'
    key: bdb
    url: 'https://biblehub.com/hebrew/5488.htm'
    quote: 'reeds, rushes (collective) … rushes, in Nile Exodus 2:3,5 (E)'
  - where: 'note 13:18 “The Red sea, the sea of reeds, and the unknown route”'
    claim: 'The name probably means sea of reeds; the Greek name Red Sea is wider'
    key: bdb
    url: 'https://biblehub.com/hebrew/5488.htm'
    quote: 'probably = sea of rushes or reeds ( > sea of (city) Suph), which Greek included in wider name θάλασσα Ἐρυθρἀ, Red Sea'
  - where: 'note 13:18 “The Red sea, the sea of reeds, and the unknown route”'
    claim: 'The name is used of the Gulf of Suez and sometimes the Gulf of Akaba, as at 1 Kgs. 9:26'
    key: bdb
    url: 'https://biblehub.com/hebrew/5488.htm'
    quote: 'name applied only to arms of Red Sea; most often … to Gulf of Suez Exodus 10:19 … sometimes to Gulf of Akaba 1 Kings 9:26'
  - where: 'note 13:18 “The Red sea, the sea of reeds, and the unknown route”'
    claim: 'A modern translation keeps Red Sea and notes “Sea of Reeds”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus+13%3A13-18&version=NRSVUE'
    quote: '13.18 Or Sea of Reeds'
  - where: 'note 13:18 “The Red sea, the sea of reeds, and the unknown route”'
    claim: 'A second modern translation does the same'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Exodus+13%3A13-18&version=NIV'
    quote: 'Exodus 13:18 Or the Sea of Reeds'
  - where: 'note 13:18 “The Red sea, the sea of reeds, and the unknown route”'
    claim: 'The name can be translated either way; some propose another body of water; other evidence favors the Red Sea; it was a large body of water'
    key: scripture-helps-ex-14
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/14-exodus-14-18?lang=eng'
    quote: 'Because of this, some believe that the Israelites may have camped near some other body of water. However, other evidence suggests that the text is indeed referring to the Red Sea. Regardless of where the Israelites were, the scriptures suggest that the sea they crossed was a large body of water.'
  - where: 'note 13:18 “The Red sea, the sea of reeds, and the unknown route”'
    claim: 'Where Israel camped after leaving Egypt is unclear'
    key: scripture-helps-ex-14
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/14-exodus-14-18?lang=eng'
    quote: 'The exact location where the Israelites camped after their departure from Egypt is unclear.'
  - where: 'note 13:18 “The Red sea, the sea of reeds, and the unknown route”'
    claim: 'Etham’s location is not known'
    key: ot-minute-ex-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-7-13'
    quote: 'Scholars are not certain where Etham was located, but we do know that it was at “the edge of the wilderness [the desert],” probably very close to the Red Sea.'
  - where: 'note 13:18 “The Red sea, the sea of reeds, and the unknown route”'
    claim: 'The Exodus likely began near Avaris/Raameses; the route cannot be traced; it went east and a little south'
    key: muhlestein-israel-egypt
    url: 'https://rsc.byu.edu/creation-sinai/israel-egypt-canaan'
    quote: 'The Exodus most likely began near Avaris/Raameses, an area that preserves many linguistic remnants of Semitic place-names'
  - where: 'note 13:18 “The Red sea, the sea of reeds, and the unknown route”'
    claim: 'The route cannot be traced specifically'
    key: muhlestein-israel-egypt
    url: 'https://rsc.byu.edu/creation-sinai/israel-egypt-canaan'
    quote: 'While we cannot trace the route specifically from there, we know they avoided the more traveled and well-garrisoned route and instead went largely east and a little south.'
  - where: 'note 13:18 “The Red sea, the sea of reeds, and the unknown route”'
    claim: 'Latter-day revelation confirms the parting of the sea'
    key: bd-red-sea
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/red-sea?lang=eng'
    quote: 'The parting of the sea by Moses is confirmed in latter-day revelation in 1 Ne. 4:2; 17:26–27; Hel. 8:11; Moses 1:25.'
  - where: 'note 13:18 “The Red sea, the sea of reeds, and the unknown route”'
    claim: 'Solomon’s ships on the Red sea in Edom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/9?lang=eng'
    quote: 'And king Solomon made a navy of ships in Ezion-geber, which is beside Eloth, on the shore of the Red sea, in the land of Edom.'

  - where: 'note 13:19 “Joseph’s bones and the oath behind them”'
    claim: 'Joseph’s oath, which Exodus repeats'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/50?lang=eng'
    quote: 'And Joseph took an oath of the children of Israel, saying, God will surely visit you, and ye shall carry up my bones from hence.'
  - where: 'note 13:19 “Joseph’s bones and the oath behind them”'
    claim: 'The bones were buried at Shechem'
    key: lds-scriptures
