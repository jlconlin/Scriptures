chapter: 9
claims:
  - where: 'when'
    claim: 'Moses was eighty when he and Aaron spoke to Pharaoh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/7?lang=eng'
    quote: 'And Moses was fourscore years old, and Aaron fourscore and three years old, when they spake unto Pharaoh.'
  - where: 'setting'
    claim: 'Goshen was first set apart at the plague of flies (8:22)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/8?lang=eng'
    quote: 'And I will sever in that day the land of Goshen, in which my people dwell, that no swarms of flies shall be there'
  - where: 'setting'
    claim: 'Paul quotes verse 16 in Romans 9:17, and goes on to speak of mercy and hardening'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/9?lang=eng'
    quote: 'For the scripture saith unto Pharaoh, Even for this same purpose have I raised thee up, that I might shew my power in thee, and that my name might be declared throughout all the earth.'
  - where: 'setting'
    claim: 'Scripture places hail among later judgments (Revelation 16:21; D&C 29:16), passages the Church footnote 18a lists at the hail'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/9?lang=eng'
    quote: 'Josh. 10:11; Ezek. 38:22; Rev. 16:21; Mosiah 12:6; D&C 29:16 (16–21); 109:30. TG Plague.'
  - where: 'setting'
    claim: 'Revelation 16:21 has a great hail among the last plagues'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/16?lang=eng'
    quote: 'And there fell upon men a great hail out of heaven, every stone about the weight of a talent'
  - where: 'setting'
    claim: 'D&C 29:16 foretells a great hailstorm'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/29?lang=eng'
    quote: 'And there shall be a great hailstorm sent forth to destroy the crops of the earth.'
  - where: 'thread'
    claim: 'Through the plagues Pharaoh and the Egyptians were to know that He is the Lord and that there is none like Him in all the earth'
    key: scripture-helps-ex-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/13-exodus-7-13?lang=eng'
    quote: 'The Lord said that through the plagues He would send, Pharaoh and the Egyptians “shall know that I am the Lord” and that “there is none like me in all the earth.”'
  - where: 'thread'
    claim: 'The Joseph Smith Translation of 9:12 reads “And Pharaoh hardened his heart”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/9?lang=eng'
    quote: 'JST Ex. 9:12 And Pharaoh hardened his heart …'
  - where: 'section 1 plain'
    claim: '“a very grievous murrain” is a severe plague; “sever between” is to distinguish between'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/9?lang=eng'
    quote: 'OR severe plague.'
  - where: 'section 2 plain'
    claim: '“blains” are blisters'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/9?lang=eng'
    quote: 'HEB blisters, pustules.'
  - where: 'section 2 plain'
    claim: 'The “ashes of the furnace” are soot of a kiln'
    key: bdb
    url: 'https://biblehub.com/hebrew/6368.htm'
    quote: 'noun [masculine] soot'
  - where: 'section 3 plain'
    claim: 'Verse 15 may be rendered “by now I could have stretched out my hand” and verse 16 “to show you my power”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%209%3A14-16&version=NRSVUE'
    quote: 'Indeed, by now I could have stretched out my hand and struck you and your people with pestilence, and you would have been cut off from the earth.'
  - where: 'section 3 plain'
    claim: 'The verb of verse 16 means to maintain, keep standing'
    key: bdb
    url: 'https://biblehub.com/hebrew/5975.htm'
    quote: 'cause to stand firm Psalm 18:34 = 2 Samuel 22:34 (with עַל location); maintain (opposed to overthrow) Exodus 9:16 (J), 1 Kings 15:4'
  - where: 'section 5 plain'
    claim: '“bolled” is in bud and “rie” is spelt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/9?lang=eng'
    quote: 'HEB spelt (a type of wheat).'
  - where: 'note 9:3 “The murrain and the king''s herds”'
    claim: 'Murrain is a general word for infectious diseases of livestock'
    key: ot-minute-ex-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-7-13'
    quote: 'The word “murrain” is an umbrella term covering various infectious diseases that affect livestock and other animals.'
  - where: 'note 9:3 “The murrain and the king''s herds”'
    claim: 'Bull cults were common in Egypt and Hathor was associated with the cow'
    key: sc-knowhy-631
    url: 'https://scripturecentral.org/knowhy/why-were-particular-plagues-sent-against-egypt'
    quote: 'Bull cults were common in Egypt. The gods Apis, Ptah, and Re could all be symbolized as the bull. The goddess Hathor was associated with the cow.'
  - where: 'note 9:3 “The murrain and the king''s herds”'
    claim: 'The pharaoh was depicted as a herder; the crook and flail were royal symbols'
    key: sc-knowhy-631
    url: 'https://scripturecentral.org/knowhy/why-were-particular-plagues-sent-against-egypt'
    quote: 'The pharaoh was often depicted as a herder who cared for the livestock, and royal symbolism included the shepherd’s crook and flail.'
  - where: 'note 9:6 “All the cattle died, yet cattle remain”'
    claim: 'One older reading: “all” is popular usage, and the plague is restricted to cattle in the field'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/9.htm'
    quote: 'all is not to be taken in an absolute sense, but according to popular usage, as denoting such a quantity, that what remained was nothing in comparison; and, according to Exodus 9:3, it must be entirely restricted to the cattle in the field.'
  - where: 'note 9:6 “All the cattle died, yet cattle remain”'
    claim: 'The chapter itself has Egyptian animals after the murrain (verses 10, 19–21) and limits the plague to cattle in the field (verse 3)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/9?lang=eng'
    quote: 'The Lord destroys the cattle of the Egyptians, but not of the Israelites'
  - where: 'note 9:8 “Soot from a kiln”'
    claim: 'The Hebrew word rendered “ashes” means soot'
    key: bdb
    url: 'https://biblehub.com/hebrew/6368.htm'
    quote: 'noun [masculine] soot, ᵐ5 αὶθάλη (? wafted about); — construct (הַ)כִּבְשָׁן ׳פ Exodus 9:8,10 (P) furnace-soot.'
  - where: 'note 9:8 “Soot from a kiln”'
    claim: 'The Hebrew word rendered “furnace” is a kiln for lime or pottery'
    key: bdb
    url: 'https://biblehub.com/hebrew/3536.htm'
    quote: 'noun masculine kiln, for lime or pottery'
  - where: 'note 9:8 “Soot from a kiln”'
    claim: 'The Church footnote 9b points to Deuteronomy 28:27, “the botch of Egypt”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/28?lang=eng'
    quote: 'The Lord will smite thee with the botch of Egypt, and with the emerods, and with the scab, and with the itch, whereof thou canst not be healed.'
  - where: 'note 9:8 “Soot from a kiln”'
    claim: 'One older reading: the plague comes from the workshops of the buildings Israel was made to raise'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/9.htm'
    quote: 'Jehovah also possessed the power to bring ruin upon him from the workshops of those splendid edifices, for the erection of which he had made use of the strength of the Israelites'
  - where: 'note 9:8 “Soot from a kiln”'
    claim: 'One older reading: the soot is an emblem of the furnace of Israel’s bondage (Deut. 4:20)'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/9.htm'
    quote: 'the soot or ashes of the lime-kiln, the residuum of that fiery heat and emblem of the furnace in which Israel groaned'
  - where: 'note 9:8 “Soot from a kiln”'
    claim: 'Deuteronomy 4:20 calls Egypt the iron furnace'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/4?lang=eng'
    quote: 'But the Lord hath taken you, and brought you forth out of the iron furnace, even out of Egypt'
  - where: 'note 9:11 “The magicians leave the story”'
    claim: '9:11 is the last verse in Exodus that names the magicians (scripts/occurrences.mjs exodus "magicians": 7:11, 22; 8:7, 18, 19; 9:11)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/9?lang=eng'
    quote: 'And the magicians could not stand before Moses because of the boils; for the boil was upon the magicians, and upon all the Egyptians.'
  - where: 'note 9:11 “The magicians leave the story”'
    claim: 'The magicians failed at the lice and said it was the finger of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/8?lang=eng'
    quote: 'Then the magicians said unto Pharaoh, This is the finger of God: and Pharaoh’s heart was hardened'
  - where: 'note 9:11 “The magicians leave the story”'
    claim: 'One study says of Egypt’s priests generally (not of the magicians by name) that bugs and boils made them ritually unclean and unable to perform rites for the king'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'Further, being infested with bugs and boils rendered the priests ritually unclean and thus unable to perform the rituals that could have perhaps aided the king in trying to restore order.'
  - where: 'note 9:16 “Raised up, or kept standing”'
    claim: 'One older reading: the verb of verse 15 is “I have stretched out,” taken as a conditional clause'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/9.htm'
    quote: '(I have stretched out, etc.) is to be taken as the conditional clause: "If I had now stretched out My hand and smitten thee...thou wouldest have been cut off."'
  - where: 'note 9:16 “Raised up, or kept standing”'
    claim: 'The verb of verse 16 means to cause to stand or continue'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/9.htm'
    quote: 'forms the antithesis to תּכּהד, and means to cause to stand or continue, as in 1 Kings 15:4; 2 Chronicles 9:8'
  - where: 'note 9:16 “Raised up, or kept standing”'
    claim: 'The same older reading: causing to stand presupposes setting up, and Paul renders the verb in that first sense in Romans 9:17'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/9.htm'
    quote: 'Causing to stand presupposes setting up. In this first sense the Apostle Paul has rendered it ἐξήγειρα in Romans 9:17, in accordance with the purport of his argument'
  - where: 'note 9:16 “Raised up, or kept standing”'
    claim: 'A modern translation renders verse 15 as what could have happened and verse 16 as “let you live”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%209%3A14-16&version=NRSVUE'
    quote: 'Indeed, by now I could have stretched out my hand and struck you and your people with pestilence, and you would have been cut off from the earth.(B) 16 But this is why I have let you live: to show you my power'
  - where: 'note 9:16 “Raised up, or kept standing”'
    claim: 'The lexicon gives the sense in Exodus 9:16 as maintain, opposed to overthrow'
    key: bdb
    url: 'https://biblehub.com/hebrew/5975.htm'
    quote: 'cause to stand firm Psalm 18:34 = 2 Samuel 22:34 (with עַל location); maintain (opposed to overthrow) Exodus 9:16 (J), 1 Kings 15:4'
  - where: 'note 9:16 “Raised up, or kept standing”'
    claim: 'The Church footnotes 16b and 16c: “let thee remain”; Hebrew “show thee”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/9?lang=eng'
    quote: 'OR let thee remain.'
  - where: 'note 9:16 “Raised up, or kept standing”'
    claim: 'The Church footnote 16c: Hebrew “show thee”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/9?lang=eng'
    quote: 'HEB show thee.'
  - where: 'note 9:16 “Raised up, or kept standing”'
    claim: 'The Septuagint (Brenton) has “preserved” in verse 16'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/exodus/9.htm'
    quote: 'And for this purpose hast thou been preserved, that I might display in thee my strength, and that my name might be published in all the earth.'
  - where: 'note 9:16 “Raised up, or kept standing”'
    claim: 'Another modern translation keeps “raised you up” in verse 16'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Exodus%209%3A14-16&version=ESV'
    quote: 'But for this purpose I have raised you up, to show you my power, so (C)that my name may be proclaimed in all the earth.'
  - where: 'note 9:16 “Raised up, or kept standing”'
    claim: 'Paul quotes the verse with “raised thee up” and continues with mercy and hardening (Rom. 9:17–18)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/9?lang=eng'
    quote: 'Therefore hath he mercy on whom he will have mercy, and whom he will he hardeneth.'
  - where: 'note 9:20 “Egyptians who feared the word of the LORD”'
    claim: 'The warning gave the Egyptians a chance to protect themselves and their livestock'
    key: ot-minute-ex-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-7-13'
    quote: 'the Lord gave the Egyptian people a chance to protect themselves and their livestock from harm or death. Some of the people feared the Lord and protected themselves and animals accordingly; others did not.'
  - where: 'note 9:20 “Egyptians who feared the word of the LORD”'
    claim: 'Pharaoh’s servants speak to him before the locusts (10:7)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/10?lang=eng'
    quote: 'And Pharaoh’s servants said unto him, How long shall this man be a snare unto us? let the men go, that they may serve the Lord their God: knowest thou not yet that Egypt is destroyed?'
  - where: 'note 9:23 “Hail and fire against a king of storms”'
    claim: 'The king was thought to manifest himself as a storm of flame and lightning; these qualities are applied to Jehovah'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'Again, Jehovah was usurping the king’s ability, which was to manifest himself as a storm of both flame and lightening[89] or storm clouds[90] or to perform the errand of the storm.[91] Instead, these qualities are applied to Jehovah and his powers.'
  - where: 'note 9:23 “Hail and fire against a king of storms”'
    claim: 'The king was supposed to protect his people from the storm; Jehovah protected His people and Pharaoh could not'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'the king was supposed to be the one who protected his people from the storm[92] and would not let them be given over to the flame of the gods.[93] Here we see again that Jehovah protected his people from storms and flames, while Pharaoh could not.'
  - where: 'note 9:23 “Hail and fire against a king of storms”'
    claim: 'Others relate the hail to Egyptian sky deities'
    key: sc-knowhy-631
    url: 'https://scripturecentral.org/knowhy/why-were-particular-plagues-sent-against-egypt'
    quote: 'This catastrophic hailstorm would challenge the authority of the Egyptian sky deities, such as Nut, Shu, and Tefnut.'
  - where: 'note 9:27 “Pharaoh''s confession”'
    claim: 'Pharaoh admitted he had sinned, at least “this time”'
    key: ot-minute-ex-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-7-13'
    quote: 'Pharaoh finally admitted that he was in the wrong and had sinned—at least “this time.” He admitted that he and his people were wicked. He even admitted that the “Lord is righteous.”'
  - where: 'note 9:27 “Pharaoh''s confession”'
    claim: 'Pharaoh says “I have sinned” again after the locusts (10:16)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/10?lang=eng'
    quote: 'Then Pharaoh called for Moses and Aaron in haste; and he said, I have sinned against the Lord your God, and against you.'
  - where: 'note 9:29 “Hands spread out in prayer”'
    claim: 'The Church footnote 29a points to 1 Kings 8:22, Solomon spreading his hands in prayer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'And Solomon stood before the altar of the Lord in the presence of all the congregation of Israel, and spread forth his hands toward heaven:'
  - where: 'note 9:29 “Hands spread out in prayer”'
    claim: 'Spreading the hands is a gesture of supplication, and it ironically ends the storm'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'The greater power of Jehovah and his representative is ironically highlighted when Moses stopped Egypt from being given over to the storm or flame by the simple supplicating gesture of spreading out his hands before Jehovah.'
  - where: 'note 9:31 “What the crops tell”'
    claim: 'The Church footnotes 31a and 32b: “bolled” is in bud; “rie” is spelt, a type of wheat'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/9?lang=eng'
    quote: 'HEB spelt (a type of wheat).'
  - where: 'note 9:31 “What the crops tell”'
    claim: 'The Church footnote 31a: “bolled” is in bud'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/9?lang=eng'
    quote: 'OR in bud.'
  - where: 'note 9:31 “What the crops tell”'
    claim: 'One study places the hailstorm in February, when barley and flax are growing'
    key: sc-knowhy-631
    url: 'https://scripturecentral.org/knowhy/why-were-particular-plagues-sent-against-egypt'
    quote: 'Due to the weather patterns that prevail in February, when barley and flax are growing, a major hailstorm would go straight north to south'
  - where: 'note 9:31 “What the crops tell”'
    claim: 'The locusts eat what the hail left (10:5)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/10?lang=eng'
    quote: 'and they shall eat the residue of that which is escaped, which remaineth unto you from the hail'
  - where: 'note 9:31 “What the crops tell”'
    claim: 'The crop damage of the hail and the locusts is to be considered a single aspect of two plagues'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'The damage done to the crops by the hail is compounded by the damage wrought thereafter by the locusts. Hence, we should consider this damage as a single aspect of two plagues and investigate the phenomenon accordingly.'
  - where: 'christ'
    claim: 'The Church footnote 29b at “earth” points to 3 Nephi 11:14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/9?lang=eng'
    quote: 'Deut. 10:14; Ps. 24:1; 1 Ne. 11:6; 3 Ne. 11:14; D&C 14:9; 15:2; Abr. 4:12 (12, 24–25).'
  - where: 'christ'
    claim: 'The risen Christ tells the Nephites He is the God of Israel and of the whole earth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/11?lang=eng'
    quote: 'that ye may know that I am the God of Israel, and the God of the whole earth, and have been slain for the sins of the world.'
  - where: 'explore'
    claim: 'The Church footnotes point to Deuteronomy 28:27, 60 (9b, 14a) and Mosiah 12:6 (18a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/9?lang=eng'
    quote: 'Deut. 28:60 (60–61).'
