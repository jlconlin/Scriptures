chapter: 4
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'Moses was eighty when he and Aaron spoke to Pharaoh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/7?lang=eng'
    quote: 'And Moses was fourscore years old, and Aaron fourscore and three years old, when they spake unto Pharaoh.'
  - where: 'setting'
    claim: 'The call came while Moses kept Jethro’s flock at Horeb, the mountain of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/3?lang=eng'
    quote: 'Now Moses kept the flock of Jethro his father in law, the priest of Midian: and he led the flock to the backside of the desert, and came to the mountain of God, even to Horeb.'
  - where: 'setting'
    claim: 'Stephen counts forty years between Moses’s flight and the bush'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/7?lang=eng'
    quote: 'And when forty years were expired, there appeared to him in the wilderness of mount Sina an angel of the Lord in a flame of fire in a bush.'
  - where: 'setting'
    claim: 'Aaron was three years older than Moses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/7?lang=eng'
    quote: 'And Moses was fourscore years old, and Aaron fourscore and three years old, when they spake unto Pharaoh.'
  - where: 'setting'
    claim: 'The vision of Moses 1 came after the call at Horeb and before Moses reached Egypt'
    key: ot-manual-ex-1-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-1-10-let-my-people-go?lang=eng'
    quote: 'The great vision Moses received, as recorded in Moses 1, took place after Moses’ original call on Mount Horeb and before his arrival in Egypt. Moses 1:17 refers to the burning bush experience in retrospect.'
  - where: 'setting'
    claim: 'Moses 1:17 looks back on the bush; Moses 1:26 looks ahead to the deliverance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng'
    quote: 'And he also gave me commandments when he called unto me out of the burning bush'
  - where: 'setting'
    claim: 'Joseph in Egypt foresaw Moses’s rod and his spokesman'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/3?lang=eng'
    quote: 'I will raise up a Moses; and I will give power unto him in a rod; and I will give judgment unto him in writing. Yet I will not loose his tongue'
  - where: 'thread'
    claim: 'Verse 13 is read as Moses begging the Lord to send another person'
    key: ot-minute-ex-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-1-6'
    quote: 'Moses was so worried about his speech problem that he begged God to send him another person that could also help.'
  - where: 'thread'
    claim: 'The Lord, who remembered His covenant, expected Moses to keep his part of it'
    key: ot-minute-ex-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-1-6'
    quote: 'Just as the Lord remembered His covenant with Abraham’s descendants, He expected Moses and the rest of the Hebrews to remember their parts of the covenant as well.'
  - where: 'thread'
    claim: 'The people’s belief wavers at the first adversity, in Exodus 5:20–23'
    key: ot-manual-ex-1-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-1-10-let-my-people-go?lang=eng'
    quote: 'Although their initial reaction when they saw the signs was very positive, at the first indication of challenge and adversity their commitment began to waver (see Exodus 5:20–23).'
  - where: 'thread'
    claim: 'The Lord had told Moses to tell the elders that He had visited them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/3?lang=eng'
    quote: 'Go, and gather the elders of Israel together, and say unto them, The LORD God of your fathers, the God of Abraham, of Isaac, and of Jacob, appeared unto me, saying, I have surely visited you'

  # ---------- plain words ----------
  - where: 'section 1 plain'
    claim: '“The river” is the Nile (footnote 9a in the Church’s edition)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/4?lang=eng'
    quote: 'IE the Nile.'
  - where: 'section 1 plain'
    claim: 'The rod is a staff'
    key: ot-minute-ex-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-1-6'
    quote: 'God turned Moses’s staff into a serpent, then turned it back into a staff.'
  - where: 'section 2 plain'
    claim: 'Verse 13 may be rendered “through whomever thou wilt send” (footnote 13a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/4?lang=eng'
    quote: 'OR through whomever thou wilt send.'
  - where: 'section 4 plain'
    claim: 'The one who “let him go” in verse 26 is the Lord'
    key: jst-ex-4
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-ex/4?lang=eng'
    quote: 'And the Lord spared Moses and let him go, because Zipporah, his wife, circumcised the child.'
  - where: 'section 4 plain'
    claim: 'Verse 26 read with the Lord as the subject'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'So he [the Lord] let him go: then she said, A bloody husband thou art, because of the circumcision'

  # ---------- note 4:2 ----------
  - where: 'note 4:2 “The rod of God”'
    claim: 'The rod is a staff'
    key: ot-minute-ex-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-1-6'
    quote: 'God turned Moses’s staff into a serpent, then turned it back into a staff.'
  - where: 'note 4:2 “The rod of God”'
    claim: 'Moses was keeping Jethro’s flock when he was called'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/3?lang=eng'
    quote: 'Now Moses kept the flock of Jethro his father in law, the priest of Midian'
  - where: 'note 4:2 “The rod of God”'
    claim: 'The rod is lifted over the sea'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/14?lang=eng'
    quote: 'But lift thou up thy rod, and stretch out thine hand over the sea, and divide it'
  - where: 'note 4:2 “The rod of God”'
    claim: 'The rod that struck the river strikes the rock in Horeb; Moses holds it during the battle with Amalek'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/17?lang=eng'
    quote: 'thy rod, wherewith thou smotest the river, take in thine hand, and go. Behold, I will stand before thee there upon the rock in Horeb; and thou shalt smite the rock'
  - where: 'note 4:2 “The rod of God”'
    claim: 'Joseph in Egypt prophesied that power would be given Moses in a rod'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/3?lang=eng'
    quote: 'And the Lord hath said: I will raise up a Moses; and I will give power unto him in a rod; and I will give judgment unto him in writing.'

  # ---------- note 4:3 ----------
  - where: 'note 4:3 “Why a serpent, a leprous hand, and blood”'
    claim: 'The king wore the uraeus, the embodiment of the cobra goddess who protected him'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'Moreover, the king wore the Uraeus, a snake-shaped crownlet … The Uraeus was the embodiment of the cobra goddess who was to protect the king and imbue him with divine power.'
  - where: 'note 4:3 “Why a serpent, a leprous hand, and blood”'
    claim: 'Egyptian depictions show Horus and the king holding a snake by the tail; a proposal joins this to Moses’s taking the serpent by the tail'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'when Moses or Aaron picked the snake up by the tail, which is not how snakes are typically handled, it imitated many depictions of Horus (who was strongly associated with the king) holding a snake by the tail.'
  - where: 'note 4:3 “Why a serpent, a leprous hand, and blood”'
    claim: 'The serpent sign shows God as the source of Moses’s power and greater than Egypt’s gods'
    key: ot-minute-ex-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-1-6'
    quote: 'By demonstrating His ability to change the staff into a serpent, God indicated that He was the source of Moses’s power and greater than the Egyptian gods.'
  - where: 'note 4:3 “Why a serpent, a leprous hand, and blood”'
    claim: 'The leprous hand is read as a sign of God’s ability to heal; the blood as a sign of judgment'
    key: ot-minute-ex-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-1-6'
    quote: 'we see symbolism here again of God’s ability to heal. If the people still did not believe Moses, he was instructed to place some river water on dry land and turn that water into blood. This appears to be a sign of God’s judgment upon people who would not follow His prophet.'
  - where: 'note 4:3 “Why a serpent, a leprous hand, and blood”'
    claim: 'The first plague turns the river to blood'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/7?lang=eng'
    quote: 'I will smite with the rod that is in mine hand upon the waters which are in the river, and they shall be turned to blood.'
  - where: 'note 4:3 “Why a serpent, a leprous hand, and blood”'
    claim: 'Before Pharaoh, Aaron’s rod becomes a serpent'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/7?lang=eng'
    quote: 'Aaron cast down his rod before Pharaoh, and before his servants, and it became a serpent.'

  # ---------- note 4:10 ----------
  - where: 'note 4:10 “What Moses’s difficulty with speech was”'
    claim: 'The Hebrew word behind “slow” (twice in the verse) is the adjective kabed, H3515'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'כְבַד'
  - where: 'note 4:10 “What Moses’s difficulty with speech was”'
    claim: 'The adjective means “heavy,” and here heavy, dull of speech and tongue'
    key: bdb
    url: 'https://biblehub.com/hebrew/3515.htm'
    quote: 'heavy, dull of speech and tongue Exodus 4:10 (twice in verse)'
  - where: 'note 4:10 “What Moses’s difficulty with speech was”'
    claim: 'Two explanations: a mild speech impediment, or poor command of Hebrew and Egyptian after forty years in Midian'
    key: ot-manual-ex-1-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-1-10-let-my-people-go?lang=eng'
    quote: 'There is some evidence that Moses may have had a mild speech impediment (see Reading 9-22), although some scholars think Moses may only have been suggesting that his facility in both the Hebrew and Egyptian languages was poor after having lived forty years with the Midianites.'
  - where: 'note 4:10 “What Moses’s difficulty with speech was”'
    claim: 'Joseph in Egypt foretold that Moses’s tongue would not be loosed and that he would have a spokesman'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/3?lang=eng'
    quote: 'Yet I will not loose his tongue, that he shall speak much, for I will not make him mighty in speaking. But I will write unto him my law, by the finger of mine own hand; and I will make a spokesman for him.'

  # ---------- note 4:16 ----------
  - where: 'note 4:16 “Moses, Aaron, and the order of revelation”'
    claim: 'The arrangement is repeated at Exodus 7:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/7?lang=eng'
    quote: 'See, I have made thee a god to Pharaoh: and Aaron thy brother shall be thy prophet.'
  - where: 'note 4:16 “Moses, Aaron, and the order of revelation”'
    claim: 'JST Ex. 7:1 (footnotes 1b and 1c) reads “prophet” for “god” and “spokesman” for “prophet”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/7?lang=eng'
    quote: 'JST Ex. 7:1 … prophet …'
  - where: 'note 4:16 “Moses, Aaron, and the order of revelation”'
    claim: 'JST Ex. 7:1, footnote 1c, reads “spokesman”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/7?lang=eng'
    quote: 'JST Ex. 7:1 … spokesman.'
  - where: 'note 4:16 “Moses, Aaron, and the order of revelation”'
    claim: 'D&C 28 gives Joseph Smith the place of Moses and Oliver Cowdery the place of Aaron'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/28?lang=eng'
    quote: 'no one shall be appointed to receive commandments and revelations in this church excepting my servant Joseph Smith, Jun., for he receiveth them even as Moses.'
  - where: 'note 4:16 “Moses, Aaron, and the order of revelation”'
    claim: 'Oliver is to be obedient, even as Aaron'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/28?lang=eng'
    quote: 'And thou shalt be obedient unto the things which I shall give unto him, even as Aaron, to declare faithfully the commandments and the revelations, with power and authority unto the church.'
  - where: 'note 4:16 “Moses, Aaron, and the order of revelation”'
    claim: 'The Church’s footnote to “Aaron” in D&C 28:3 points to Exodus 4:14–16, 30'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/28?lang=eng'
    quote: 'Ex. 4:30 (14–16, 30)'

  # ---------- note 4:21 ----------
  - where: 'note 4:21 “Who hardened Pharaoh’s heart”'
    claim: 'JST Ex. 4:21 says Pharaoh will harden his heart'
    key: jst-ex-4
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-ex/4?lang=eng'
    quote: 'and I will prosper thee; but Pharaoh will harden his heart, and he will not let the people go.'
  - where: 'note 4:21 “Who hardened Pharaoh’s heart”'
    claim: 'The JST appendix says each such passage shows that Pharaoh hardened his own heart'
    key: jst-ex-4
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-ex/4?lang=eng'
    quote: 'The Lord is not responsible for Pharaoh’s hardness of heart. See also JST, Exodus 7:3, 13; 9:12; 10:1, 20, 27; 11:10; 14:4, 8, 17; each reference, when correctly translated, shows that Pharaoh hardened his own heart.'
  - where: 'note 4:21 “Who hardened Pharaoh’s heart”'
    claim: 'Each passage is revised in the JST; the revisions stress Pharaoh’s agency'
    key: scripture-helps-ex-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/12-exodus-1-6?lang=eng'
    quote: 'in the Joseph Smith Translation, each such passage is revised to say that Pharaoh hardened his own heart. These revisions emphasize Pharaoh’s personal agency in resisting God’s will.'
  - where: 'note 4:21 “Who hardened Pharaoh’s heart”'
    claim: 'Exodus itself says Pharaoh hardened his heart (8:15, 32)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/8?lang=eng'
    quote: 'But when Pharaoh saw that there was respite, he hardened his heart, and hearkened not unto them; as the LORD had said.'
  - where: 'note 4:21 “Who hardened Pharaoh’s heart”'
    claim: 'After the hail Pharaoh hardened his heart (9:34)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/9?lang=eng'
    quote: 'And when Pharaoh saw that the rain and the hail and the thunders were ceased, he sinned yet more, and hardened his heart, he and his servants.'
  - where: 'note 4:21 “Who hardened Pharaoh’s heart”'
    claim: 'The Lord said beforehand that the king would not let them go'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/3?lang=eng'
    quote: 'And I am sure that the king of Egypt will not let you go, no, not by a mighty hand.'
  - where: 'note 4:21 “Who hardened Pharaoh’s heart”'
    claim: 'An older count: the hardening is ascribed to the Lord ten times'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/4.htm'
    quote: 'The hardening of Pharaoh is ascribed to God, not only in the passages just quoted, but also in Exodus 9:12; Exodus 10:20, Exodus 10:27; Exodus 11:10; Exodus 14:8; that is to say, ten times in all'
  - where: 'note 4:21 “Who hardened Pharaoh’s heart”'
    claim: 'The same count: ten times Pharaoh hardened his own heart'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/4.htm'
    quote: 'But it is also stated just as often, viz., ten times, that Pharaoh hardened his own heart, or made it heavy or firm'
  - where: 'note 4:21 “Who hardened Pharaoh’s heart”'
    claim: 'The verb here is literally “make firm”; two other words, “hard” and “heavy,” are used elsewhere'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/4.htm'
    quote: 'lit., I will make his heart firm, so that it will not move, his feelings and attitude towards Israel will not change. … "I will make Pharaoh''s heart hard, or unfeeling;" and in Exodus 10:1 … "I have made his heart heavy,"'
  - where: 'note 4:21 “Who hardened Pharaoh’s heart”'
    claim: 'The verb in 4:21 is chazaq, H2388'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'אֲחַזֵּ֣ק'
  - where: 'note 4:21 “Who hardened Pharaoh’s heart”'
    claim: 'chazaq means to be or grow firm, strong'
    key: bdb
    url: 'https://biblehub.com/hebrew/2388.htm'
    quote: 'verb be or grow firm, strong, strengthen'

  # ---------- note 4:22 ----------
  - where: 'note 4:22 “Israel the firstborn, and Pharaoh’s firstborn”'
    claim: 'The “son” is the whole people; Pharaoh’s and Egypt’s firstborn would die if he refused'
    key: ot-minute-ex-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-1-6'
    quote: 'His “son” represents all the people of Israel. Moses would ask the Pharaoh to let God’s people go. If Pharaoh would not, then Pharaoh’s own firstborn, and all of Egypt’s firstborn sons, would be killed.'
  - where: 'note 4:22 “Israel the firstborn, and Pharaoh’s firstborn”'
    claim: 'The firstborn son is the heir, and under the law belonged to God'
    key: bd-firstborn
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/firstborn?lang=eng'
    quote: 'In the patriarchal order, the firstborn son is the heir and inherits the leadership of the family upon the death of the father. … Under the law of Moses, the firstborn son was regarded as belonging to God'
  - where: 'note 4:22 “Israel the firstborn, and Pharaoh’s firstborn”'
    claim: 'The firstborn of Egypt die at midnight (12:29)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/12?lang=eng'
    quote: 'And it came to pass, that at midnight the LORD smote all the firstborn in the land of Egypt, from the firstborn of Pharaoh that sat on his throne'
  - where: 'note 4:22 “Israel the firstborn, and Pharaoh’s firstborn”'
    claim: 'Jeremiah keeps the word firstborn for Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/31?lang=eng'
    quote: 'for I am a father to Israel, and Ephraim is my firstborn.'

  # ---------- note 4:24 ----------
  - where: 'note 4:24 “Why the Lord sought to kill Moses”'
    claim: 'The JST gives the reason: Moses had not circumcised his son'
    key: jst-ex-4
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-ex/4?lang=eng'
    quote: 'The Lord was angry with Moses, and his hand was about to fall upon him, to kill him; for he had not circumcised his son.'
  - where: 'note 4:24 “Why the Lord sought to kill Moses”'
    claim: 'In the JST the Lord spares Moses because of Zipporah’s act, and Moses confesses'
    key: jst-ex-4
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-ex/4?lang=eng'
    quote: 'And the Lord spared Moses and let him go, because Zipporah, his wife, circumcised the child. And she said, Thou art a bloody husband. And Moses was ashamed, and hid his face from the Lord, and said, I have sinned before the Lord.'
  - where: 'note 4:24 “Why the Lord sought to kill Moses”'
    claim: 'The passage is among the most difficult because so much appears to be missing'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'This passage has been recognized as one of the most difficult in the Old Testament to decipher and understand because so much appears to be missing.'
  - where: 'note 4:24 “Why the Lord sought to kill Moses”'
    claim: 'The wording about the feet is vague'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'whose feet Zipporah touched with her son’s blood because the wording is vague … The feet could belong to any male present: Moses, their son, or Jehovah.'
  - where: 'note 4:24 “Why the Lord sought to kill Moses”'
    claim: 'The JST gives no reason for Moses’s failure; Zipporah’s quick action is the significant act'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'No explanation is given in the JST for why Moses had failed to honor God’s directive to circumcise his son … This lack of information is important because it makes Zipporah’s quick and immediate action the significant act in the narrative.'
  - where: 'note 4:24 “Why the Lord sought to kill Moses”'
    claim: 'Some suggest the son’s blood foreshadows the blood that saved Israel at the Passover (Ex. 12:12–14, 43–48)'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'Some have suggested that the blood of Moses’s firstborn son vicariously functioned to save him, foreshadowing the use of blood to save the Israelites from the destroying angel and the destruction of the firstborn as recorded in Exodus 12:12–14, 43–48.'
  - where: 'note 4:24 “Why the Lord sought to kill Moses”'
    claim: 'The Lord expected Moses to keep his part of the covenant; circumcision was its token'
    key: ot-minute-ex-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-1-6'
    quote: 'He expected Moses and the rest of the Hebrews to remember their parts of the covenant as well. As part of the covenant promise, their sons had to be circumcised “as a token of the covenant betwixt [God] and [Abraham]” (Genesis 17:11).'
  - where: 'note 4:24 “Why the Lord sought to kill Moses”'
    claim: 'The uncircumcised male has broken the covenant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/17?lang=eng'
    quote: 'that soul shall be cut off from his people; he hath broken my covenant.'
  - where: 'note 4:24 “Why the Lord sought to kill Moses”'
    claim: 'Zipporah is the last of the women in Exodus 1–6 who save Moses’s life'
    key: welch-saviors
    url: 'https://mi.byu.edu/old-testament-reflections/saviors-before-sinai'
    quote: 'Finally, Zipporah, Moses’s Midianite wife, saves his life yet again in the cryptic episode of chapter 4, when she performs the priestly rite of covenantal circumcision that Moses himself seems to have left undone.'
  - where: 'note 4:24 “Why the Lord sought to kill Moses”'
    claim: 'No uncircumcised person may eat the Passover'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/12?lang=eng'
    quote: 'for no uncircumcised person shall eat thereof.'
  - where: 'note 4:24 “Why the Lord sought to kill Moses”'
    claim: 'Moses had sent Zipporah back to her father'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/18?lang=eng'
    quote: 'Then Jethro, Moses’ father in law, took Zipporah, Moses’ wife, after he had sent her back,'

  # ---------- christ / explore ----------
  - where: 'christ'
    claim: 'Matthew applies Hosea’s line to the child Jesus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/2?lang=eng'
    quote: 'that it might be fulfilled which was spoken of the Lord by the prophet, saying, Out of Egypt have I called my son.'
  - where: 'christ'
    claim: 'Jesus is the Firstborn; the faithful receive the inheritance of the firstborn through Him'
