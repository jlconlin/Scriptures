chapter: 14
claims:
  - where: 'when'
    claim: 'Israel left Rameses on the fifteenth day of the first month'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/33?lang=eng'
    quote: 'And they departed from Rameses in the first month, on the fifteenth day of the first month'
  - where: 'setting'
    claim: 'The Joseph Smith Translation reads in verse 4 that Pharaoh will harden his own heart'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/14?lang=eng'
    quote: 'And Pharaoh will harden his heart'
  - where: 'setting'
    claim: 'The Joseph Smith Translation reads in verse 8 that Pharaoh hardened his own heart'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/14?lang=eng'
    quote: 'And Pharaoh hardened his heart, and he pursued'
  - where: 'setting'
    claim: 'The parting of the sea is confirmed in latter-day revelation'
    key: bd-red-sea
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/red-sea?lang=eng'
    quote: 'The parting of the sea by Moses is confirmed in latter-day revelation in 1 Ne. 4:2; 17:26–27; Hel. 8:11; Moses 1:25.'
  - where: 'setting'
    claim: 'Joshua sets the drying of the Jordan beside the drying of the Red Sea'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/4?lang=eng'
    quote: 'dried up the waters of Jordan from before you, until ye were passed over'
  - where: 'thread'
    claim: 'Verse 4 repeats the words the Lord used before and during the plagues'
    key: ot-minute-ex-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-14-17'
    quote: 'Verse 4 echoes the words that the Lord used prior to and during the plagues in Egypt.'

  - where: 'note 14:4 “A camp chosen to look like a mistake”'
    claim: 'The Church’s footnote gives the Hebrew of “turn” as “return”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/14?lang=eng'
    quote: 'HEB return.'
  - where: 'note 14:4 “A camp chosen to look like a mistake”'
    claim: 'The Church’s footnote: “honoured upon” can be read “honoured by”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/14?lang=eng'
    quote: 'HEB I will be honored by Pharaoh and by all his army, etc.'
  - where: 'note 14:4 “A camp chosen to look like a mistake”'
    claim: 'The encampment hemmed Israel in between the sea and Pharaoh’s army'
    key: ot-minute-ex-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-14-17'
    quote: 'However, the encampment would hem in Moses and his people between the Red Sea and Pharaoh’s armies.'
  - where: 'note 14:4 “A camp chosen to look like a mistake”'
    claim: 'One older reading: the route was foolish by human judgment and was commanded so that God might be honoured upon Pharaoh'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/14.htm'
    quote: 'it was not only out of the way, but a very foolish way, according to human judgment. God commanded Moses to take this road, that He might be honoured upon Pharaoh'
  - where: 'note 14:4 “A camp chosen to look like a mistake”'
    claim: 'The Hebrew verb (Niphal of kabed) means to get oneself glory or honour, in or by someone, in Exodus 14:4, 17, 18'
    key: bdb
    url: 'https://biblehub.com/hebrew/3513.htm'
    quote: 'get oneself glory (or honour), of God … in or by any one Exodus 14:4,17,18'
  - where: 'note 14:4 “A camp chosen to look like a mistake”'
    claim: 'Where Israel camped after leaving Egypt is not known'
    key: scripture-helps-ex-14
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/14-exodus-14-18?lang=eng'
    quote: 'The exact location where the Israelites camped after their departure from Egypt is unclear.'

  - where: 'note 14:8 “A high hand means boldly”'
    claim: 'The Church’s footnote explains “with an high hand” as “in defiance”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/14?lang=eng'
    quote: 'IE in defiance.'
  - where: 'note 14:8 “A high hand means boldly”'
    claim: 'A modern translation renders the phrase “boldly”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2014&version=NRSVUE'
    quote: 'he pursued the Israelites, who were going out boldly.'
  - where: 'note 14:8 “A high hand means boldly”'
    claim: 'The lexicon lists the raised hand as a symbol of might and cites this verse and Numbers 33:3 of Israel in the Exodus'
    key: bdb
    url: 'https://biblehub.com/hebrew/7311.htm'
    quote: 'figurative: of hand, symbol of might, Deuteronomy 32:27 … of Israel in Exodus'
  - where: 'note 14:8 “A high hand means boldly”'
    claim: 'Numbers 33:3 repeats the phrase'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/33?lang=eng'
    quote: 'the children of Israel went out with an high hand in the sight of all the Egyptians.'

  - where: 'note 14:11 “The complaint at the sea”'
    claim: 'The Israelites’ fear at the sea was reasonable, and is one of their crises of faith'
    key: brown-trust-lord
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/trust-lord'
    quote: 'Quite rightly, the Israelites feared for their lives and said so in these words'
  - where: 'note 14:11 “The complaint at the sea”'
    claim: 'Their distrust was that God had brought them out only to stand aside'
    key: brown-trust-lord
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/trust-lord'
    quote: 'thus negating their fearful distrust that He had led them out of bondage only to stand aside while they were slaughtered.'
  - where: 'note 14:11 “The complaint at the sea”'
    claim: 'The Church’s footnote to verse 12 points to Exodus 5:21 and 13:17'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/14?lang=eng'
    quote: 'Ex. 5:21 (20–23); 13:17 (17–18).'
  - where: 'note 14:11 “The complaint at the sea”'
    claim: 'God foresaw that the people might repent when they saw war'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/13?lang=eng'
    quote: 'Lest peradventure the people repent when they see war, and they return to Egypt'
  - where: 'note 14:11 “The complaint at the sea”'
    claim: 'Psalm 106:7 says the fathers provoked God at the Red Sea'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/106?lang=eng'
    quote: 'but provoked him at the sea, even at the Red sea.'

  - where: 'note 14:15 “Stand still, and then go forward”'
    claim: 'The Hebrew behind “stand still” can mean to take one’s assigned position'
    key: scripture-helps-ex-14
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/14-exodus-14-18?lang=eng'
    quote: 'The phrase “stand still” comes from a Hebrew word that can also mean “to take one’s proper or assigned position.”'
  - where: 'note 14:15 “Stand still, and then go forward”'
    claim: 'A modern translation renders it “stand firm”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2014&version=NRSVUE'
    quote: 'Do not be afraid, stand firm, and see the deliverance that the Lord will accomplish for you today'
  - where: 'note 14:15 “Stand still, and then go forward”'
    claim: 'On one reading the Lord here acknowledges Moses’s prayers and calls for faith in action'
    key: ot-minute-ex-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-14-17'
    quote: 'The Lord acknowledged Moses’s faith and prayers on behalf of the children of Israel. It was time to put faith into action.'
  - where: 'note 14:15 “Stand still, and then go forward”'
    claim: 'Elder Holland read the Lord’s “go forward” as confirming Moses’s “stand still”'
    key: holland-cast
    url: 'https://www.churchofjesuschrist.org/study/ensign/2000/03/cast-not-away-therefore-your-confidence?lang=eng'
    quote: 'In confirmation the great Jehovah said to Moses, “Speak unto the children of Israel, that they go forward.”'
  - where: 'note 14:15 “Stand still, and then go forward”'
    claim: 'Elder Holland called going forward the second lesson of the spirit of revelation'
    key: holland-cast
    url: 'https://www.churchofjesuschrist.org/study/ensign/2000/03/cast-not-away-therefore-your-confidence?lang=eng'
    quote: 'That is the second lesson of the spirit of revelation. After you have gotten the message, after you have paid the price to feel His love and hear the word of the Lord, go forward. Don’t fear, don’t vacillate, don’t quibble, don’t whine.'
  - where: 'note 14:15 “Stand still, and then go forward”'
    claim: 'Elder Holland was speaking of Doctrine and Covenants 8:2–3'
    key: holland-cast
    url: 'https://www.churchofjesuschrist.org/study/ensign/2000/03/cast-not-away-therefore-your-confidence?lang=eng'
    quote: 'Why would the Lord use the example of crossing the Red Sea as the classic example of “the spirit of revelation”?'

  - where: 'note 14:16 “By whose power the sea was divided”'
    claim: 'The Church’s footnote to verse 16 points to JST Genesis 14:26–31'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/14?lang=eng'
    quote: 'See JST Gen. 14:26–31 (Appendix).'
  - where: 'note 14:16 “By whose power the sea was divided”'
    claim: 'The Church’s footnote to verse 16 points to Helaman 8:11 and Doctrine and Covenants 8:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/14?lang=eng'
    quote: 'Mosiah 7:19; Hel. 8:11; D&C 8:3.'
  - where: 'note 14:16 “By whose power the sea was divided”'
    claim: 'Moses 1:25 promises Moses power over the waters'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng'
    quote: 'thou shalt be made stronger than many waters; for they shall obey thy command as if thou wert God.'
  - where: 'note 14:16 “By whose power the sea was divided”'
    claim: 'Doctrine and Covenants 8:2–3 names the spirit of revelation as the spirit by which Moses brought Israel through the sea'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/8?lang=eng'
    quote: 'this is the spirit by which Moses brought the children of Israel through the Red Sea on dry ground.'
  - where: 'note 14:16 “By whose power the sea was divided”'
    claim: 'JST Genesis 14:30, in the passage on Melchizedek (compare Genesis 14:18–20), says those ordained after this order have power by faith to divide the seas'
    key: jst-gen-14
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-gen/14?lang=eng'
    quote: 'every one being ordained after this order and calling should have power, by faith, to break mountains, to divide the seas, to dry up waters, to turn them out of their course'

  - where: 'note 14:19 “The guide becomes a guard”'
    claim: 'The phrase “angel of God” usually refers to God Himself in the Old Testament'
    key: ot-minute-ex-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-14-17'
    quote: 'In the Old Testament, this phrase usually refers to God Himself (see Exodus 3:2). The cloud also represents the presence of God.'
  - where: 'note 14:19 “The guide becomes a guard”'
    claim: 'Here the pillar acts as a means of salvation for Israel'
    key: muhlestein-theophanies
    url: 'https://rsc.byu.edu/ascending-mountain-lord/darkness-light-lord-elements-israelite-theophanies'
    quote: 'At this point, the pillar acted as a means of salvation for Israel, the primary role Jehovah takes in the Exodus story.'
  - where: 'note 14:19 “The guide becomes a guard”'
    claim: 'A Latter-day Saint study places Exodus 14 in a pattern of angels saving people physically (Hagar, Ishmael, Isaac, Lot), here for all Israel'
    key: halverson-path
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/path-angels'
    quote: 'but this time the beneficiary is the entire host of Israel, while Moses and the angel of the Lord share the responsibility of being the Lord’s messenger.'
  - where: 'note 14:19 “The guide becomes a guard”'
    claim: 'The earlier rescues in the pattern are of Hagar, Ishmael, Isaac, and Lot'
    key: halverson-path
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/path-angels'
    quote: 'the physical salvation of a specific individual (Hagar, Ishmael, Isaac) or a small group (Lot and his family)'

  - where: 'note 14:21 “The wind is the LORD’s instrument”'
    claim: 'The song of Exodus 15 attributes the gathering of the waters to the blast of the Lord’s nostrils'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/15?lang=eng'
    quote: 'And with the blast of thy nostrils the waters were gathered together, the floods stood upright as an heap'
  - where: 'note 14:21 “The wind is the LORD’s instrument”'
    claim: 'One older commentary: an ebb strengthened by wind cannot account for water divided in two directions'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/14.htm'
    quote: 'the drying of the sea as here described cannot be accounted for by an ebb strengthened by the east wind, because the water is all driven southwards in the ebb, and not sent in two opposite directions.'
  - where: 'note 14:21 “The wind is the LORD’s instrument”'
    claim: 'One older commentary: the division required a wind sent by God'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/14.htm'
    quote: 'Such a division could only be produced by a wind sent by God, and working with omnipotent force'
  - where: 'note 14:21 “The wind is the LORD’s instrument”'
    claim: 'The escape through the sea showed the Lord’s control over nature'
    key: brown-exodus-type
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/02/the-exodus-seeing-it-as-a-test-a-testimony-and-a-type?lang=eng'
    quote: 'The final deliverance came by escaping through the sea, which demonstrated the Lord’s control over nature.'

  - where: 'note 14:22 “Baptized in the cloud and in the sea”'
    claim: 'Paul says the fathers were baptized unto Moses in the cloud and in the sea'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/10?lang=eng'
    quote: 'And were all baptized unto Moses in the cloud and in the sea;'
  - where: 'note 14:22 “Baptized in the cloud and in the sea”'
    claim: 'The cloud and sea are read as baptism by water and by the Holy Ghost'
    key: hoskisson-plan
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/plan-salvation-first-six-books-old-testament'
    quote: 'That is, they were baptized by water and by the Holy Ghost.'
  - where: 'note 14:22 “Baptized in the cloud and in the sea”'
    claim: 'Passing through the Red Sea marks the departure from Egypt as baptism marks departure from the world'
    key: hoskisson-plan
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/plan-salvation-first-six-books-old-testament'
    quote: 'The departure from Egypt was marked by passing through the Red Sea. Our departure from the world is also symbolized by passing through the waters of baptism.'

  - where: 'note 14:25 “Chariot wheels taken off, or bound”'
    claim: 'The Church’s footnote gives “bound” as the alternative to “took off”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/14?lang=eng'
    quote: 'OR bound.'
  - where: 'note 14:25 “Chariot wheels taken off, or bound”'
    claim: 'The Septuagint reads that He bound the axles of the chariots'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/exodus/14.htm'
    quote: 'and bound the axle-trees of their chariots, and caused them to go with difficulty'
  - where: 'note 14:25 “Chariot wheels taken off, or bound”'
    claim: 'A modern translation reads “clogged”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2014&version=NRSVUE'
    quote: 'He clogged their chariot wheels so that they turned with difficulty.'
  - where: 'note 14:25 “Chariot wheels taken off, or bound”'
    claim: 'A modern translation renders “troubled” as “threw … into a panic”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2014&version=NRSVUE'
    quote: 'looked down on the Egyptian army and threw the Egyptian army into a panic.'
  - where: 'note 14:25 “Chariot wheels taken off, or bound”'
    claim: 'The Hebrew verb for “troubled” in 14:24 means to confuse or discomfit'
    key: bdb
    url: 'https://biblehub.com/hebrew/2000.htm'
    quote: 'confuse, discomfit, with accusative Exodus 14:24'

  - where: 'note 14:27 “The Egyptians die by water”'
    claim: 'A Latter-day Saint scholar (quoted in the KnoWhy) notes that Pharaoh’s army died the death he had decreed for the Hebrew boys'
    key: sc-knowhy-731
    url: 'https://scripturecentral.org/knowhy/how-was-abinadi-a-prophet-like-unto-moses'
    quote: 'Pharaoh and his armies, ironically, suffered death in the waters of the Red Sea (see Exodus 14)—the same death that Pharaoh had decreed upon the Hebrew male children—to be cast into the water.'
  - where: 'note 14:27 “The Egyptians die by water”'
    claim: 'The Hebrew verb means “shook off,” and Psalm 136:15 uses the same verb'
    key: bdb
    url: 'https://biblehub.com/hebrew/5287.htm'
    quote: 'shook off the Egyptian into'
  - where: 'note 14:27 “The Egyptians die by water”'
    claim: 'The lexicon equates the verb in Exodus 14:27 with that in Psalm 136:15'
    key: bdb
    url: 'https://biblehub.com/hebrew/5287.htm'
    quote: 'Psalm 136:15 (also with accusative'
  - where: 'note 14:27 “The Egyptians die by water”'
    claim: 'The Septuagint reads “shook off”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/exodus/14.htm'
    quote: 'and the Lord shook off the Egyptians in the midst of the sea.'
  - where: 'note 14:27 “The Egyptians die by water”'
    claim: 'A modern translation reads “tossed”; the sea returned at dawn'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2014&version=NRSVUE'
    quote: 'at dawn the sea returned to its normal depth. As the Egyptians fled before it, the Lord tossed the Egyptians into the sea.'
  - where: 'note 14:27 “The Egyptians die by water”'
    claim: 'Pharaoh had ordered Hebrew sons cast into the river'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/1?lang=eng'
    quote: 'And Pharaoh charged all his people, saying, Every son that is born ye shall cast into the river'

  - where: 'note 14:31 “Israel fears the LORD and believes”'
    claim: 'Israel no longer needed to fear the Egyptians but the Lord'
    key: ot-minute-ex-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-14-17'
    quote: 'They no longer needed to fear the Egyptians; they needed to fear the Lord.'
  - where: 'note 14:31 “Israel fears the LORD and believes”'
    claim: 'One older reading: faith in the Lord was bound up with faith in Moses, hence the miracle by his hand and staff'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/14.htm'
    quote: 'But faith in the Lord was inseparably connected with faith in Moses as the servant of the Lord. Hence the miracle was wrought through the hand and staff of Moses.'
  - where: 'note 14:31 “Israel fears the LORD and believes”'
    claim: 'The demonstrations of power convinced the Hebrews for a time'
    key: brown-exodus-type
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/02/the-exodus-seeing-it-as-a-test-a-testimony-and-a-type?lang=eng'
    quote: 'These demonstrations of power finally convinced the Hebrews, at least for the time being.'
  - where: 'note 14:31 “Israel fears the LORD and believes”'
    claim: 'Israel’s new faith was soon shaken'
    key: brown-exodus-type
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/02/the-exodus-seeing-it-as-a-test-a-testimony-and-a-type?lang=eng'
    quote: 'Although Israel’s newly found faith was soon shaken when they ran out of water and food in the desert'
  - where: 'note 14:31 “Israel fears the LORD and believes”'
    claim: 'Psalm 106:12–13 sets belief and forgetting side by side'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/106?lang=eng'
    quote: 'They soon forgat his works; they waited not for his counsel:'

  - where: 'christ'
    claim: 'Paul calls the crossing baptism in the cloud and in the sea'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/10?lang=eng'
    quote: 'And were all baptized unto Moses in the cloud and in the sea;'
  - where: 'christ'
    claim: 'The Hebrew word for salvation usually means help or physical rescue from God'
    key: scripture-helps-ex-14
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/14-exodus-14-18?lang=eng'
    quote: 'is often used in the Old Testament to refer to help or assistance from God—almost always some form of rescue in the physical sense.'
  - where: 'explore'
    claim: 'The Church’s footnote to verse 29 points to Isaiah 11:16 and Doctrine and Covenants 133:27'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/14?lang=eng'
    quote: 'Isa. 11:16; 2 Ne. 21:16; D&C 133:27.'
  - where: 'explore'
    claim: 'Isaiah 11:16 promises a highway like the one out of Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/11?lang=eng'
    quote: 'like as it was to Israel in the day that he came up out of the land of Egypt.'
  - where: 'explore'
    claim: 'Doctrine and Covenants 133:27 speaks of a highway in the great deep'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/133?lang=eng'
    quote: 'And an highway shall be cast up in the midst of the great deep.'
