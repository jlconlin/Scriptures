chapter: 39
claims:
  # ---------- when / setting ----------
  - where: 'when'
    claim: 'The tabernacle is set up on the first day of the first month of the second year, so the work is finished before then'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'And it came to pass in the first month in the second year, on the first day of the month, that the tabernacle was reared up.'
  - where: 'setting'
    claim: 'The last chapter gave an account of the metals used'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/38?lang=eng'
    quote: 'This is the sum of the tabernacle, even of the tabernacle of testimony, as it was counted, according to the commandment of Moses'
  - where: 'setting'
    claim: 'Bezaleel and Aholiab and the wise hearted did the work'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/36?lang=eng'
    quote: 'Then wrought Bezaleel and Aholiab, and every wise hearted man, in whom the Lord put wisdom and understanding to know how to work all manner of work for the service of the sanctuary'
  - where: 'setting'
    claim: 'Verses 1–31 repeat chapter 28, in the main word for word, with past tenses for future'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/39.htm'
    quote: 'In the main, the narrative is repeated verbatim from the instructions in chs. 25–31, with the simple substitution of past tenses for future; in two or three cases, however, a phrase is altered, and there are also some instances of omission or abridgement.'
  - where: 'setting'
    claim: 'Moses puts the garments on Aaron in Leviticus 8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/8?lang=eng'
    quote: 'And he put the breastplate upon him: also he put in the breastplate the Urim and the Thummim.'

  # ---------- thread ----------
  - where: 'thread'
    claim: 'The garments are told in the order ephod, breastplate, robe, linen garments, plate, each answering a passage of chapter 28'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/39.htm'
    quote: 'The robes consisted of the ephod (Exodus 39:2-7, as in Exodus 28:6-12), the choshen or breastplate (Exodus 39:8-21, as in Exodus 28:15-29), the mel or over-coat (Exodus 39:22-26, as in Exodus 28:31-34)'
  - where: 'thread'
    claim: 'The linen garments answer 28:39–42 and the plate 28:36–37, so the plate comes last here'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/39.htm'
    quote: 'Exodus 39:27-29. The tunics, turban, caps, drawers, and sashes. Exodus 28:39-40; Exodus 28:42 a (abridged: vv. 41, 42b, 43 not repeated). Exodus 39:30-31. The golden plate, on the front of the turban. Exodus 28:36-37 (v. 38 not repeated.'
  - where: 'thread'
    claim: 'One older reading of the order: the other garments stand between the ephod and the gold plate'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/39.htm'
    quote: 'so here all the rest of the priests'' robes are included between the shoulder-dress, the principal part of the official robes of the high priest, and the golden frontlet, the inscription upon which rendered it the most striking sign of the dignity of his office'
  - where: 'thread'
    claim: 'The sentences of chapter 28 that say what a garment is for are not repeated (28:29–30; 28:35b)'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/39.htm'
    quote: 'vv. 29, 30 (the Urim and Thummim) not repeated). Exodus 39:22-26. The robe of the ephod. Exodus 28:31-35 a (v. 35b not repeated).'
  - where: 'thread'
    claim: 'Most of verse 3 is new to the second telling'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/39.htm'
    quote: 'Exodus 39:2-5. The ephod (v. 1 introductory; most of v. 3 new. Exodus 28:6-8.'
  - where: 'thread'
    claim: 'The Urim and Thummim are not mentioned in chapter 39'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/39.htm'
    quote: 'The Urim and Thummim are not mentioned (cf. Exodus 28:30).'
  - where: 'thread'
    claim: 'Moses was told to put the Urim and Thummim in the breastplate'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/28?lang=eng'
    quote: 'And thou shalt put in the breastplate of judgment the Urim and the Thummim; and they shall be upon Aaron’s heart, when he goeth in before the Lord'
  - where: 'thread'
    claim: 'In verses 32 and 42 the Israelites as a whole, not the craftsmen, are named as having done the work'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/39.htm'
    quote: 'As in v. 32 (cf. Exodus 25:8), the Israelites generally, not … in particular, are mentioned as those who did the work.'
  - where: 'thread'
    claim: 'Bread, oil and incense were delivered with the furniture: everything needed to begin the daily worship'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/39.htm'
    quote: 'shew-bread (Exodus 39:36), holy oil for the candlestick and for anointing, and fragrant incense (Exodus 39:38), were also prepared and delivered to Moses, - everything, therefore, that was required for the institution of the daily worship, as soon as the tabernacle was set up.'

  # ---------- sections ----------
  - where: 'section 1 plain'
    claim: 'The Church’s footnotes give “officiating garments” for “cloths of service,” “threads” for “wires,” “skillful design” for “cunning work,” “skillfully woven band” for “curious girdle,” and “settings” for “ouches”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/39?lang=eng'
    quote: 'HEB officiating garments. … OR threads. … OR skillful design. … OR skillfully woven band (also vv. 20–21). … OR settings (also vv. 13, 16, 18).'
  - where: 'section 2 plain'
    claim: 'The Church’s footnote gives “intertwined cords” for “wreathen work”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/39?lang=eng'
    quote: 'OR intertwined cords.'
  - where: 'section 3 plain'
    claim: 'The Church’s footnote gives “garment of mail” for “habergeon”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/39?lang=eng'
    quote: 'HEB garment of mail.'
  - where: 'section 4 plain'
    claim: 'The Church’s footnotes give “turban” for “mitre” and “caps” for “goodly” bonnets'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/39?lang=eng'
    quote: 'HEB turban. … HEB caps.'
  - where: 'section 5 plain'
    claim: 'The Church’s footnotes give “its implements,” “screening veil,” “bread of the presence,” “screen for the opening,” and “its base”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/39?lang=eng'
    quote: 'OR its implements. … OR screening veil. … OR bread of the presence. … HEB screen for the opening. … OR its base.'
  - where: 'section 5 plain'
    claim: '“The tabernacle of the tent of the congregation” is the dwelling of the tent of meeting'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/39.htm'
    quote: 'the Dwelling of the tent of meeting] the pleonasm, as Exodus 40:2; Exodus 40:6; Exodus 40:29; cf. v. 40.'

  # ---------- note 39:1 ----------
  - where: 'note 39:1 “The refrain: as the LORD commanded Moses”'
    claim: 'The clause stands seven times in verses 1–31 (verses 1, 5, 7, 21, 26, 29, 31)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/39?lang=eng'
    quote: 'And they tied unto it a lace of blue, to fasten it on high upon the mitre; as the Lord commanded Moses.'
  - where: 'note 39:1 “The refrain: as the LORD commanded Moses”'
    claim: 'The refrain returns in chapter 40 as Moses sets up the tabernacle (verses 19, 21, 25, 27, 29, 32), and 40:16 says of Moses what 39:32 says of Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'Thus did Moses: according to all that the Lord commanded him, so did he.'
  - where: 'note 39:1 “The refrain: as the LORD commanded Moses”'
    claim: 'Moses was told to make everything after the pattern shown him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/25?lang=eng'
    quote: 'And look that thou make them after their pattern, which was shewed thee in the mount.'
  - where: 'note 39:1 “The refrain: as the LORD commanded Moses”'
    claim: 'One study sets verse 42 beside Genesis 6:22, of Noah and the ark, as a general correspondence'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'we merely note the general correspondence that even as “Noah did according to all that God had commanded him, thus did he” (Genesis 6.22) in relation to the ark, so “according to all that Yhwh had commanded Moses, thus did the Israelites all the work” (Exodus 39.42)'
  - where: 'note 39:1 “The refrain: as the LORD commanded Moses”'
    claim: 'Genesis 6:22 in the King James Version'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/6?lang=eng'
    quote: 'Thus did Noah; according to all that God commanded him, so did he.'

  # ---------- note 39:3 ----------
  - where: 'note 39:3 “How gold was worked into the cloth”'
    claim: 'The Hebrew word rendered “wires” means cord or thread, here threads of gold in the ephod'
    key: bdb
    url: 'https://biblehub.com/hebrew/6616.htm'
    quote: 'cord, thread (twisted) … threads (of gold) in ephod Exodus 39:3 (all P).'
  - where: 'note 39:3 “How gold was worked into the cloth”'
    claim: 'The Church’s footnote gives “threads” for “wires”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/39?lang=eng'
    quote: 'OR threads.'
  - where: 'note 39:3 “How gold was worked into the cloth”'
    claim: 'The instruction named gold among the ephod’s materials without saying how it was to be worked in'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/28?lang=eng'
    quote: 'And they shall make the ephod of gold, of blue, and of purple, of scarlet, and fine twined linen, with cunning work.'

  # ---------- note 39:28 ----------
  - where: 'note 39:28 “An Egyptian word for the priests’ linen”'
    claim: 'The word for “fine linen” in verse 28 is shesh (Strong’s 8336)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'שֵׁ֔שׁ'
  - where: 'note 39:28 “An Egyptian word for the priests’ linen”'
    claim: 'The lexicon calls the word probably a loanword from Egyptian and glosses it as fine Egyptian linen; it lists Genesis 41:42 and the women’s spinning in Exodus 35:25'
    key: bdb
    url: 'https://biblehub.com/hebrew/8336.htm'
    quote: 'byssus (loan-word probably from Egyptian … byssus, fine Egyptian linen … i.e. the linen thread (spun by women Exodus 35:25), and the material woven from it: used for garments Genesis 41:42 (E)'
  - where: 'note 39:28 “An Egyptian word for the priests’ linen”'
    claim: 'Pharaoh clothed Joseph in fine linen'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/41?lang=eng'
    quote: 'And Pharaoh took off his ring from his hand, and put it upon Joseph’s hand, and arrayed him in vestures of fine linen, and put a gold chain about his neck;'
  - where: 'note 39:28 “An Egyptian word for the priests’ linen”'
    claim: 'The words for the priests’ clothes and the tabernacle’s materials include several Egyptian loanwords, among them the word for the sash'
    key: sc-knowhy-848
    url: 'https://scripturecentral.org/knowhy/why-are-egyptian-loanwords-in-the-law-of-moses'
    quote: 'The description of the clothes worn by the priests as well as the materials used in the tabernacle contain several Egyptian loanwords. The sash worn by Aaron is described using an Egyptian loanword.'
  - where: 'note 39:28 “An Egyptian word for the priests’ linen”'
    claim: 'Exodus–Numbers has an unusually high concentration of Egyptian loanwords'
    key: sc-knowhy-848
    url: 'https://scripturecentral.org/knowhy/why-are-egyptian-loanwords-in-the-law-of-moses'
    quote: 'specialists who study the Hebrew lexicon have argued that Exodus–Numbers contains an unusually high concentration of Egyptian loanwords compared with the rest of the Hebrew Bible.'
  - where: 'note 39:28 “An Egyptian word for the priests’ linen”'
    claim: 'The loanwords are mostly words for concrete things'
    key: sc-knowhy-848
    url: 'https://scripturecentral.org/knowhy/why-are-egyptian-loanwords-in-the-law-of-moses'
    quote: 'They are not mostly abstract theological terms. They are largely concrete material-culture and setting words.'
  - where: 'note 39:28 “An Egyptian word for the priests’ linen”'
    claim: 'The study grants that the words could have come in later and argues that they were more likely brought out of Egypt'
    key: sc-knowhy-848
    url: 'https://scripturecentral.org/knowhy/why-are-egyptian-loanwords-in-the-law-of-moses'
    quote: 'Although it is hypothetically possible that these Egyptian terms all came into the Hebrew language later … it makes more sense to see these terms as being brought out of Egypt by the Israelites when they left.'

  # ---------- note 39:43 ----------
  - where: 'note 39:43 “Finished, seen, and blessed”'
    claim: 'Genesis 1:31 and 2:1–3 in the King James Version'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/2?lang=eng'
    quote: 'Thus the heavens and the earth were finished, and all the host of them.'
  - where: 'note 39:43 “Finished, seen, and blessed”'
    claim: 'The verb “did look upon” in 39:43 is the verb “saw” of Genesis 1:31 (Strong’s 7200), followed in both by “all,” “behold” (2009) and the verb “make” or “do” (6213)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וַיַּ֨רְא'
  - where: 'note 39:43 “Finished, seen, and blessed”'
    claim: 'Genesis 1:31 has the verb “saw” (7200) and “behold” (2009); Genesis 2:1–2 the verb “finished” (3615) and the noun “work” (4399); Genesis 2:3 the verb “blessed” (1288)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'וַיַּ֤רְא'
  - where: 'note 39:43 “Finished, seen, and blessed”'
    claim: '“Finished” in 39:32 is the verb of Genesis 2:1 (3615); “work” (4399) and “blessed” (1288) in 39:43 are the words of Genesis 2:2–3'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וַתֵּ֕כֶל'
  - where: 'note 39:43 “Finished, seen, and blessed”'
    claim: 'An older commentary sets verse 32 beside Genesis 2:1'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/39.htm'
    quote: '32. Subscription, in P’s manner (cf. Genesis 2:1), to the entire enumeration (Exodus 36:8 to Exodus 39:31).'
  - where: 'note 39:43 “Finished, seen, and blessed”'
    claim: 'A Latter-day Saint study says the writers of Exodus appear to have invoked the Creation deliberately in describing the building of the tabernacle'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'Like the temple, the tabernacle represented the divine realm, and in fact it appears that the writers of Exodus deliberately invoked the Creation to describe the building of the tabernacle.'
  - where: 'note 39:43 “Finished, seen, and blessed”'
    claim: 'One older reading: the blessing answered the people’s readiness, liberality and zeal'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/39.htm'
    quote: 'The readiness and liberality with which the people had presented the gifts required for this work, and the zeal which they had shown … were most cheering signs of the willingness of the Israelites to serve the Lord'

  # ---------- christ / explore ----------
  - where: 'christ'
    claim: 'Hebrews quotes the command to make all things after the pattern and names Christ as high priest and minister of the true tabernacle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/8?lang=eng'
    quote: 'We have such an high priest, who is set on the right hand of the throne of the Majesty in the heavens; A minister of the sanctuary, and of the true tabernacle, which the Lord pitched, and not man.'
  - where: 'christ'
    claim: 'Hebrews says the earthly priests serve the example and shadow of heavenly things'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/8?lang=eng'
    quote: 'Who serve unto the example and shadow of heavenly things, as Moses was admonished of God when he was about to make the tabernacle: for, See, saith he, that thou make all things according to the pattern shewed to thee in the mount.'
  - where: 'explore'
    claim: 'Moses clothes Aaron in the garments in Leviticus 8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/8?lang=eng'
    quote: 'And he put the breastplate upon him: also he put in the breastplate the Urim and the Thummim.'
