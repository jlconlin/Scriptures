chapter: 26
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'Moses was on the mount forty days and forty nights when these instructions were given'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/24?lang=eng'
    quote: 'and Moses was in the mount forty days and forty nights.'
  - where: 'setting'
    claim: 'The ark, the table of shewbread and the mercy seat are commanded in chapter 25'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'On the north side of the altar stood the table of shewbread (Ex. 25:23–30) made of acacia wood.'
  - where: 'setting'
    claim: 'The ark with the testimony in it is commanded in chapter 25'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'The ark had within it “The Testimony” (the two tables of stone) (Ex. 25:21; 31:18).'
  - where: 'setting'
    claim: 'The tabernacle was 30 cubits long and 10 broad and high'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'It was oblong, 30 cubits in length and 10 in breadth and height.'
  - where: 'setting'
    claim: 'Thirty cubits is about forty-five feet'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'which would make the structure thirty cubits long (45 feet or 13.7 meters)'
  - where: 'setting'
    claim: 'Ten cubits is about fifteen feet'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'Each panel was ten cubits tall (15 feet or 4.6 meters) and 1.5 cubits wide'
  - where: 'setting'
    claim: 'The walls could be taken apart and carried'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'Because the walls were made of these individual panels, they could be disassembled and carried on carts.'
  - where: 'setting'
    claim: 'The Church’s footnotes point from the curtains and boards to their making in Exodus 36'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/26?lang=eng'
    quote: 'Ex. 36:8 (8–19).'
  - where: 'setting'
    claim: 'Hebrews describes the tabernacle with its first room and, after the second veil, the Holiest of all'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/9?lang=eng'
    quote: 'And after the second veil, the tabernacle which is called the Holiest of all;'
  - where: 'thread'
    claim: 'The veil is described before the door of the tent: the more sacred first'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'thus showing that God first taught the more sacred before moving to the less sacred'
  - where: 'thread'
    claim: 'The materials are graded from less holy to more holy'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'This gradation of holiness existed throughout the tabernacle.'
  - where: 'thread'
    claim: 'Gold clasps on the linen and bronze on the goats’ hair mark the inner covering as the more sacred'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'The colorful inner layer used gold clasps, while this layer used bronze, demonstrating the more sacred nature of the inner covering'
  - where: 'thread'
    claim: 'Verse 30 says the structure rests on what Moses was shown as well as what he was told'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'Instead, the structure was based on both a vision and a description.'
  - where: 'thread'
    claim: 'The Church’s footnote on “fashion” in verse 30 points to Exodus 25:40'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/26?lang=eng'
    quote: 'Ex. 25:40; 27:8.'

  # ---------- plain ----------
  - where: 'section 1 plain'
    claim: 'Taches are clasps; “it shall be one tabernacle” means the tabernacle is unified'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/26?lang=eng'
    quote: 'OR the tabernacle shall be unified.'
  - where: 'section 1 plain'
    claim: '“Cunning work” is the work of a skilled, inventive weaver'
    key: bdb
    url: 'https://biblehub.com/hebrew/2803.htm'
    quote: 'work of the cunning (ingenious, inventive) workman (of artistic devices in weaving'
  - where: 'section 2 plain'
    claim: 'The goats’ hair curtains are a tent over the tabernacle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/26?lang=eng'
    quote: 'HEB as a tent.'
  - where: 'section 3 plain'
    claim: 'Shittim wood is acacia'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'two narrower corner ones of acacia wood (Ex. 26:15), overlaid with gold (26:29)'
  - where: 'section 4 plain'
    claim: '“Over against” means opposite'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/26?lang=eng'
    quote: 'OR opposite.'

  # ---------- note 26:1 The curtains ----------
  - where: 'note 26:1 “The curtains themselves are the tabernacle”'
    claim: 'The lexicon describes the dwelling as planks lined with tapestry, with a tent over it, and distinguishes the two in Exodus 26:7'
    key: bdb
    url: 'https://biblehub.com/hebrew/4908.htm'
    quote: 'rendered conventionally ''tabernacle''), of planks lined with vari-coloured tapestry, with a ''tent'''
  - where: 'note 26:1 “The curtains themselves are the tabernacle”'
    claim: 'The Church’s footnote at verse 7 gives the Hebrew of “to be a covering” as “as a tent”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/26?lang=eng'
    quote: 'HEB as a tent.'
  - where: 'note 26:1 “The curtains themselves are the tabernacle”'
    claim: 'The tent was spread over the tabernacle'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'Over the tabernacle the tent was spread.'
  - where: 'note 26:1 “The curtains themselves are the tabernacle”'
    claim: 'The linen curtains served as an inner lining to the tent covering'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'Suspended over them, and serving as an inner lining to the tent covering, was the rich covering—10 curtains (each 28 cubits by 4)'
  - where: 'note 26:1 “The curtains themselves are the tabernacle”'
    claim: 'Over the tent came two coverings of skins'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: '(1) an inner covering of ramskins dyed red; (2) a covering of badger skins over all (Ex. 26:14)'
  - where: 'note 26:1 “The curtains themselves are the tabernacle”'
    claim: 'The costliest of the four layers is innermost'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'It is meaningful that the most beautiful and costly of the four layers that cover the tabernacle is on the inside, not the outside.'
  - where: 'note 26:1 “The curtains themselves are the tabernacle”'
    claim: 'Four cubits, about six feet, is the widest a ground loom weaves, which explains the ten strips'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'The reason the covering was made from ten panels is that six feet is about the widest fabric a ground loom can make.'
  - where: 'note 26:1 “The curtains themselves are the tabernacle”'
    claim: 'The longer goats’ hair curtains cover the linen by a cubit on each side'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'they would protect or cover by one cubit on each side the more colorful and costly fabric below'

  # ---------- note 26:1 cherubim ----------
  - where: 'note 26:1 “Cherubim overhead and on the veil”'
    claim: 'Unlike the other entrances, the veil has cherubim like those on the innermost covering'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'unlike the other cloth items associated with ingress and egress (the other “doors”), the veil also included images of cherubim similar to those on the innermost roof covering'
  - where: 'note 26:1 “Cherubim overhead and on the veil”'
    claim: 'From inside the holy place the cherubim were seen on the ceiling'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'when in the holy room, cherubim images could be seen on the ceiling'
  - where: 'note 26:1 “Cherubim overhead and on the veil”'
    claim: 'The text does not say why cherubim were worked into these fabrics'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'While we are not told specifically why the cherubim were to be incorporated into these demarcations of space, cherubim are found elsewhere in the Old Testament'
  - where: 'note 26:1 “Cherubim overhead and on the veil”'
    claim: 'Elsewhere the first function of cherubim is to guard a space, as at Eden'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'Their first function is to guard selected space. In Genesis, following the exile of Adam and Eve, cherubim are placed before the tree of life'
  - where: 'note 26:1 “Cherubim overhead and on the veil”'
    claim: 'The cherubim at Eden act as the veil does, and they let in as well as keep out'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'Yet their function is not only to keep things out, but to allow them in as well. Similarly, the veil was not a one-way entry.'
  - where: 'note 26:1 “Cherubim overhead and on the veil”'
    claim: 'Genesis 3:24: cherubim placed at the east of Eden to keep the way of the tree of life'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/3?lang=eng'
    quote: 'he placed at the east of the garden of Eden Cherubims, and a flaming sword which turned every way, to keep the way of the tree of life.'
  - where: 'note 26:1 “Cherubim overhead and on the veil”'
    claim: 'A reading printed in Morales’s article (a block quotation he credits to D. W. Parry): the high priest going west through the veil on the Day of Atonement reverses Adam’s eastward expulsion'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'Adam’s eastward expulsion from the Garden is reversed when the high priest travels west past the consuming fire of the sacrifice and the purifying water of the laver, through the veil woven with images of cherubim.'
  - where: 'note 26:1 “Cherubim overhead and on the veil”'
    claim: '“Cunning work” is the work of an ingenious, inventive weaver'
    key: bdb
    url: 'https://biblehub.com/hebrew/2803.htm'
    quote: 'work of the cunning (ingenious, inventive) workman (of artistic devices in weaving'

  # ---------- note 26:6 taches ----------
  - where: 'note 26:6 “Clasps that make the curtains one”'
    claim: 'The Church’s footnote gives clasps for taches'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/26?lang=eng'
    quote: 'OR clasps (also v. 11).'
  - where: 'note 26:6 “Clasps that make the curtains one”'
    claim: 'The Church’s footnote on “it shall be one tabernacle”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/26?lang=eng'
    quote: 'OR the tabernacle shall be unified.'
  - where: 'note 26:6 “Clasps that make the curtains one”'
    claim: 'The Hebrew word is a hook on the edge of the curtains, matching the loops'
    key: bdb
    url: 'https://biblehub.com/hebrew/7165.htm'
    quote: 'hook, on edge of curtains of tabernacle, matching the loops'
  - where: 'note 26:6 “Clasps that make the curtains one”'
    claim: 'The gold clasps, where the veil hung, lay at the line between the two rooms'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'This means that the center point of this combined large fabric covering fell at the line between the two rooms.'

  # ---------- note 26:15 boards ----------
  - where: 'note 26:15 “The frame: boards, sockets and bars”'
    claim: 'Three sides were of 48 boards of acacia overlaid with gold'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'Its north, west, and south sides were made of 46 boards (10 cubits by 1½) and two narrower corner ones of acacia wood (Ex. 26:15), overlaid with gold (26:29).'
  - where: 'note 26:15 “The frame: boards, sockets and bars”'
    claim: 'Bars through golden rings fastened the boards together'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'These boards were fitted with golden rings, through which were passed bars of acacia wood overlaid with gold to fasten all firmly together.'
  - where: 'note 26:15 “The frame: boards, sockets and bars”'
    claim: 'The east entrance was closed by a screen'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'The entrance toward the east was closed by a screen of blue, purple, and scarlet and fine twined linen.'
  - where: 'note 26:15 “The frame: boards, sockets and bars”'
    claim: 'Each board was ten cubits, about fifteen feet, tall'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'Each panel was ten cubits tall (15 feet or 4.6 meters) and 1.5 cubits wide (2.25 feet or 0.7 meters).'
  - where: 'note 26:15 “The frame: boards, sockets and bars”'
    claim: 'Whether the boards were solid or open frames is debated'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'There is debate whether the panels were solid or simply frames, the latter, of course, being far easier to transport'
  - where: 'note 26:15 “The frame: boards, sockets and bars”'
    claim: 'How the bars were arranged is debated'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'There is significant debate regarding the bars'
  - where: 'note 26:15 “The frame: boards, sockets and bars”'
    claim: 'The walls came apart to be carried'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'Because the walls were made of these individual panels, they could be disassembled and carried on carts.'
  - where: 'note 26:15 “The frame: boards, sockets and bars”'
    claim: 'A tenon is a dowel at the foot of a board'
    key: ot-manual-ex-25-30
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-25-30-35-40-the-house-of-the-lord-in-the-wilderness?lang=eng'
    quote: 'The tenon was one of two large rectangular dowels at the bottom end of each board.'
  - where: 'note 26:15 “The frame: boards, sockets and bars”'
    claim: 'The sockets let the wall stand on uneven ground'
    key: ot-manual-ex-25-30
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-25-30-35-40-the-house-of-the-lord-in-the-wilderness?lang=eng'
    quote: 'Since all of the boards were fastened firmly side to side, making a rigid wall, every socket could rest on the ground even when it was irregular.'
  - where: 'note 26:15 “The frame: boards, sockets and bars”'
    claim: 'There were ninety-six silver sockets under the boards'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'Below the panels that created the walls were a total of ninety-six silver sockets or bases'
  - where: 'note 26:15 “The frame: boards, sockets and bars”'
    claim: 'The hundred sockets of the sanctuary and the veil were cast from the hundred talents of silver'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/38?lang=eng'
    quote: 'And of the hundred talents of silver were cast the sockets of the sanctuary, and the sockets of the veil; an hundred sockets of the hundred talents, a talent for a socket.'
  - where: 'note 26:15 “The frame: boards, sockets and bars”'
    claim: 'The silver of the sockets was not donated but paid as a ransom'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'It was the only item that was not donated. Instead, a ransom or redemptive tax was paid by all males twenty years and older (Exodus 30:13).'
  - where: 'note 26:15 “The frame: boards, sockets and bars”'
    claim: 'The commentary reads the silver foundation as a figure of redemption through Christ'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'it is only through the solid foundation of the ransom (redemption) made through Christ that our path back to the presence of God can be made'

  # ---------- note 26:31 veil ----------
  - where: 'note 26:31 “The veil before the ark”'
    claim: 'The veil divided the tabernacle into two parts and was of the same materials as the inner covering'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'The tabernacle was divided into two parts by a veil of the same materials as the screen of the court, the inner roof covering of the tabernacle, and the screen of the tent'
  - where: 'note 26:31 “The veil before the ark”'
    claim: 'Aaron was not to come within the veil at all times'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/16?lang=eng'
    quote: 'Speak unto Aaron thy brother, that he come not at all times into the holy place within the veil before the mercy seat, which is upon the ark; that he die not'
  - where: 'note 26:31 “The veil before the ark”'
    claim: 'Hebrews: the high priest alone went into the second room, once a year, with blood'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/9?lang=eng'
    quote: 'But into the second went the high priest alone once every year, not without blood, which he offered for himself, and for the errors of the people:'
  - where: 'note 26:31 “The veil before the ark”'
    claim: 'The verb for what the veil does is the verb for what the firmament does in Genesis 1:6'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'whereas the firmament is created to “separate” … the waters (Genesis 1.6), so the tabernacle veil is to “separate” … the holy place from the holiest place (Exodus 26.33)'
  - where: 'note 26:31 “The veil before the ark”'
    claim: 'The verb describes the ordering of the elements of creation'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'to describe the separating or the ordering of the different elements of the creation: light from dark, upper waters from lower waters, day from night'
  - where: 'note 26:31 “The veil before the ark”'
    claim: 'On that reading the veil may represent the distinction between mortal and divine spheres'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'The use of the verb suggests that the veil may have also represented the ongoing nature of the creation, as well as the distinction between mortal and divine spheres.'

  # ---------- note 26:33 christ ----------
  - where: 'note 26:33 “The veil and the flesh of Christ”'
    claim: 'In scripture a veil is a symbol for a separation between God and man'
    key: gs-veil
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/veil?lang=eng'
    quote: '(2) a symbol for a separation between God and man'
  - where: 'note 26:33 “The veil and the flesh of Christ”'
    claim: 'Hebrews: while the first tabernacle stood the way into the holiest was not yet manifest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/9?lang=eng'
    quote: 'The Holy Ghost this signifying, that the way into the holiest of all was not yet made manifest, while as the first tabernacle was yet standing:'
  - where: 'note 26:33 “The veil and the flesh of Christ”'
    claim: 'At Jesus’s death the veil of the temple was rent from top to bottom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/27?lang=eng'
    quote: 'And, behold, the veil of the temple was rent in twain from the top to the bottom; and the earth did quake, and the rocks rent;'
  - where: 'note 26:33 “The veil and the flesh of Christ”'
    claim: 'Hebrews identifies the veil with the flesh of Jesus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/10?lang=eng'
    quote: 'By a new and living way, which he hath consecrated for us, through the veil, that is to say, his flesh;'

  # ---------- note 26:34 rooms ----------
  - where: 'note 26:34 “Two rooms: the holy place and the Holy of Holies”'
    claim: 'The most holy place is also called the Holy of Holies'
    key: bd-holy-of-holies
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/holy-of-holies?lang=eng'
    quote: 'Also called “Most Holy Place.” The most sacred room in the tabernacle and, later, in the temple, as contrasted with the Holy Place.'
  - where: 'note 26:34 “Two rooms: the holy place and the Holy of Holies”'
    claim: 'The outer room was 20 cubits by 10'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'In the outer compartment (20 cubits by 10), called the Holy Place, were three things'
  - where: 'note 26:34 “Two rooms: the holy place and the Holy of Holies”'
    claim: 'The Holy of Holies held only the ark'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'The Holy of Holies contained only one piece of furniture: the Ark of the Covenant, or the Ark of the Testimony (Ex. 25:22).'
  - where: 'note 26:34 “Two rooms: the holy place and the Holy of Holies”'
    claim: 'The altar of incense stood in the middle of the outer room, before the veil'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'In the middle, before the veil and before the mercy seat (Ex. 30:6), stood the altar of incense'
  - where: 'note 26:34 “Two rooms: the holy place and the Holy of Holies”'
    claim: 'One older reading: the most holy place was a cube of ten cubits'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/26.htm'
    quote: 'whilst the most holy place was a cube of ten cubits in every direction'
  - where: 'note 26:34 “Two rooms: the holy place and the Holy of Holies”'
    claim: 'The same reading sets the cube beside Solomon’s temple and the city John saw'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/26.htm'
    quote: 'Just as in both the tabernacle and Solomon''s temple the most holy place was in the form of a perfect cube (of 10 and 20 cubits respectively), so John saw the city of God, which came down from God out of heaven, in the form of a perfect cube.'
  - where: 'note 26:34 “Two rooms: the holy place and the Holy of Holies”'
    claim: 'Hebrews names the first room the sanctuary, with the candlestick and the table'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/9?lang=eng'
    quote: 'For there was a tabernacle made; the first, wherein was the candlestick, and the table, and the shewbread; which is called the sanctuary.'
  - where: 'note 26:34 “Two rooms: the holy place and the Holy of Holies”'
