chapter: 18
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'Israel comes into the wilderness of Sinai in the third month'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/19?lang=eng'
    quote: 'In the third month, when the children of Israel were gone forth out of the land of Egypt, the same day came they into the wilderness of Sinai.'
  - where: 'when'
    claim: 'The camp before this chapter was at Rephidim'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/17?lang=eng'
    quote: 'journeyed from the wilderness of Sin, after their journeys, according to the commandment of the Lord, and pitched in Rephidim'
  - where: 'setting'
    claim: 'Jethro gave Moses a home after his flight, became his father-in-law, and gave him advice about delegation; the entry divides the chapter at 18:1–12 and 18:13–27'
    key: bd-jethro
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jethro?lang=eng'
    quote: 'a prince and priest of Midian who gave Moses a home after his flight from Egypt and afterwards became his father-in-law (Ex. 3:1; 4:18; 18:1–12). … He also gave Moses some practical advice about administrative delegation of responsibility (Ex. 18:13–27).'
  - where: 'setting'
    claim: 'Moses received the Holy Priesthood under the hand of Jethro'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'And the sons of Moses, according to the Holy Priesthood which he received under the hand of his father-in-law, Jethro;'
  - where: 'setting'
    claim: 'Moses retells the appointing of the judges in Deuteronomy 1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'So I took the chief of your tribes, wise men, and known, and made them heads over you, captains over thousands, and captains over hundreds, and captains over fifties, and captains over tens, and officers among your tribes.'
  - where: 'setting'
    claim: 'D&C 136 organizes the camp of Israel under captains of hundreds, fifties and tens'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/136?lang=eng'
    quote: 'Let the companies be organized with captains of hundreds, captains of fifties, and captains of tens, with a president and his two counselors at their head, under the direction of the Twelve Apostles.'
  - where: 'setting'
    claim: 'In the next chapter Israel camps before the mount'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/19?lang=eng'
    quote: 'For they were departed from Rephidim, and were come to the desert of Sinai, and had pitched in the wilderness; and there Israel camped before the mount.'
  - where: 'thread'
    claim: 'The chapter falls into the visit (1–12) and the counsel (13–27)'
    key: bd-jethro
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jethro?lang=eng'
    quote: 'afterwards became his father-in-law (Ex. 3:1; 4:18; 18:1–12). … He also gave Moses some practical advice about administrative delegation of responsibility (Ex. 18:13–27).'
  - where: 'thread'
    claim: 'Jethro’s counsel keeps teaching and the great matters with Moses and delegates the smaller ones to men of good character'
    key: ot-minute-ex-18
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-18-20'
    quote: 'Moses could still handle “great matters,” but smaller matters could be handled by those whom he delegated. Moses’s delegates needed to be God-fearing, honest, free of greed, and capable of being good leaders.'

  # ---------- sections ----------
  - where: 'section 1 plain'
    claim: 'Gershom’s name: “I have been a sojourner in a foreign land”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/18?lang=eng'
    quote: 'HEB I have been a sojourner in a foreign land.'
  - where: 'section 1 plain'
    claim: 'In verse 6 “said” is “sent word”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/18?lang=eng'
    quote: 'IE sent word.'
  - where: 'section 4 plain'
    claim: 'Verse 19: Moses is to represent the people before God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/18?lang=eng'
    quote: 'OR You represent the people before God.'
  - where: 'section 4 plain'
    claim: 'Verse 23 in a modern translation: “and God so commands you”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2018&version=NRSVUE'
    quote: 'If you do this and God so commands you, then you will be able to endure, and all these people will go to their homes in peace.'

  # ---------- note 18:2 ----------
  - where: 'note 18:2 “Zipporah and the sons come back”'
    claim: 'Moses took his wife and sons with him toward Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/4?lang=eng'
    quote: 'And Moses took his wife and his sons, and set them upon an ass, and he returned to the land of Egypt: and Moses took the rod of God in his hand.'
  - where: 'note 18:2 “Zipporah and the sons come back”'
    claim: 'The sending back fell sometime between Ex. 4:20 and Ex. 18; safety is suggested as a possible reason'
    key: ot-minute-ex-18
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-18-20'
    quote: 'Sometime between the time that Moses and Zipporah had gone to Egypt in Exodus 4:20 and Exodus 18, Moses sent Zipporah and their sons back to Midian to live with Zipporah’s father, Jethro—perhaps for safety reasons.'
  - where: 'note 18:2 “Zipporah and the sons come back”'
    claim: 'The footnote at verse 6 explains “said” as “sent word”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/18?lang=eng'
    quote: 'IE sent word.'

  # ---------- note 18:5 ----------
  - where: 'note 18:5 “When Jethro came: before Sinai or after”'
    claim: 'Israel reaches the wilderness of Sinai only at 19:1–2, from Rephidim'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/19?lang=eng'
    quote: 'For they were departed from Rephidim, and were come to the desert of Sinai, and had pitched in the wilderness; and there Israel camped before the mount.'
  - where: 'note 18:5 “When Jethro came: before Sinai or after”'
    claim: 'Deuteronomy sets the appointing of the judges “at that time,” after the word to leave Horeb'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And I spake unto you at that time, saying, I am not able to bear you myself alone:'
  - where: 'note 18:5 “When Jethro came: before Sinai or after”'
    claim: 'The word to leave Horeb comes just before it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'The Lord our God spake unto us in Horeb, saying, Ye have dwelt long enough in this mount:'
  - where: 'note 18:5 “When Jethro came: before Sinai or after”'
    claim: 'The rock struck at Rephidim is “the rock in Horeb”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/17?lang=eng'
    quote: 'Behold, I will stand before thee there upon the rock in Horeb; and thou shalt smite the rock, and there shall come water out of it, that the people may drink.'
  - where: 'note 18:5 “When Jethro came: before Sinai or after”'
    claim: 'One older reading: the camp is Rephidim, at Horeb'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/18.htm'
    quote: 'The mount of God is Horeb (Exodus 3:1); and the place of encampment is Rephidim, at Horeb'
  - where: 'note 18:5 “When Jethro came: before Sinai or after”'
    claim: 'On that reading the mention of the mount of God favors Rephidim'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/18.htm'
    quote: 'For the fact that the mount of God is mentioned as the place of encampment at the time, is an argument in favour of Rephidim, rather than against it, as we have already shown.'
  - where: 'note 18:5 “When Jethro came: before Sinai or after”'
    claim: 'On that reading the stay at Rephidim left time enough for the sacrifice, the day of judging and the choosing of judges'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/18.htm'
    quote: 'amply sufficient time, inasmuch as one whole day would suffice for the sight of the judicial sitting, which is said to have taken place the day after the sacrificial meal (Exodus 18:13).'
  - where: 'note 18:5 “When Jethro came: before Sinai or after”'
    claim: 'Another older reading: the camp of verse 5 cannot be Rephidim and must be the wilderness of Sinai'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/18.htm'
    quote: 'In v. 5 the ‘wilderness where he was encamped, at the mount of God,’ cannot be Rephidim (Exodus 17:1), but can only be the ‘wilderness of Sinai,’ the arrival at which, however, is not mentioned till Exodus 19:1-2 a.'
  - where: 'note 18:5 “When Jethro came: before Sinai or after”'
    claim: 'On that reading Deuteronomy places the episode at the end of the stay at Horeb, so that it belongs later than where it is told'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/18.htm'
    quote: 'The Deuteronomist quite clearly places the episode at the close of the Israelites’ sojourn at Horeb'
  - where: 'note 18:5 “When Jethro came: before Sinai or after”'
    claim: 'The same reading: the episode stood originally at a later point'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/18.htm'
    quote: 'There are strong reasons for thinking that this episode stood originally at a later point in the narrative.'
  - where: 'note 18:5 “When Jethro came: before Sinai or after”'
    claim: 'Scripture Helps says only that the counsel was given while Israel camped near Mount Sinai'
    key: scripture-helps-ex-14
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/14-exodus-14-18?lang=eng'
    quote: 'While the Israelites camped near Mount Sinai, Jethro counseled Moses to delegate some of his responsibilities to others.'

  # ---------- note 18:11 ----------
  - where: 'note 18:11 “What Jethro now knows”'
    claim: 'The LORD had said Israel would know Him by the deliverance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/6?lang=eng'
    quote: 'ye shall know that I am the Lord your God, which bringeth you out from under the burdens of the Egyptians.'
  - where: 'note 18:11 “What Jethro now knows”'
    claim: 'Jethro’s words are the point God made to Israel during the plagues'
    key: ot-minute-ex-18
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-18-20'
    quote: 'Jethro said in verse 11, “Now I know that the Lord is greater than all gods.” This was exactly the point that God made to the Israelites during the plagues'
  - where: 'note 18:11 “What Jethro now knows”'
    claim: 'The JST of verse 1 calls Jethro the high priest of Midian'
    key: jst-ex-18
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-ex/18?lang=eng'
    quote: 'When Jethro, the high priest of Midian, Moses’ father-in-law, heard of all that God had done for Moses, and for Israel his people'
  - where: 'note 18:11 “What Jethro now knows”'
    claim: 'A modern translation fills out the second half of the verse and makes “they” the Egyptians'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2018&version=NRSVUE'
    quote: 'Now I know that the Lord is greater than all gods, because he delivered the people from the Egyptians, when they dealt arrogantly with them.'
  - where: 'note 18:11 “What Jethro now knows”'
    claim: 'Nehemiah 9:10 uses “dealt proudly against them” of Pharaoh, his servants and his people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/9?lang=eng'
    quote: 'And shewedst signs and wonders upon Pharaoh, and on all his servants, and on all the people of his land: for thou knewest that they dealt proudly against them.'

  # ---------- note 18:12 ----------
  - where: 'note 18:12 “The meal before God”'
    claim: 'To eat bread is to share the sacred meal that went with the sacrifice'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/18.htm'
    quote: 'to eat bread] i.e. to take part in the sacred meal accompanying the sacrifice: the ‘sacrifice’ here meant being of the nature of the later ‘peace-offering,’ an essential part of which was the accompanying sacred meal, in which the worshipper and his friends partook'
  - where: 'note 18:12 “The meal before God”'
    claim: '“Before God” means before the altar'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/18.htm'
    quote: 'before God] i.e. before the altar, presupposed by the sacrifices.'

  # ---------- note 18:19 ----------
  - where: 'note 18:19 “What “to God-ward” means”'
    claim: 'The Church’s footnote: “You represent the people before God”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/18?lang=eng'
    quote: 'OR You represent the people before God.'
  - where: 'note 18:19 “What “to God-ward” means”'
    claim: 'A modern translation of verse 19'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2018&version=NRSVUE'
    quote: 'You should represent the people before God and bring their cases to God.'
  - where: 'note 18:19 “What “to God-ward” means”'
    claim: 'The Hebrew of “to God-ward” is the preposition mul (Strong’s 4136) followed by “God”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'מ֚וּל'
  - where: 'note 18:19 “What “to God-ward” means”'
    claim: 'The preposition means “front, in front of”'
    key: bdb
    url: 'https://biblehub.com/hebrew/4136.htm'
    quote: 'preposition front, in front of'

  # ---------- note 18:21 ----------
  - where: 'note 18:21 “The four marks of a judge”'
    claim: 'The Hebrew of “able men” is anshe chayil (Strong’s 2428); of “covetousness,” betsa (Strong’s 1215)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'חַ֜יִל'
  - where: 'note 18:21 “The four marks of a judge”'
    claim: 'The noun means strength, efficiency'
    key: bdb
    url: 'https://biblehub.com/hebrew/2428.htm'
    quote: 'strength, efficiency, wealth, army'
  - where: 'note 18:21 “The four marks of a judge”'
    claim: 'In Ex. 18:21 the sense is ability, efficiency, often involving moral worth; Ruth 3:11 is listed under the same sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/2428.htm'
    quote: '2 ability, efficiency, often involving moral worth ׳אַנְשֵׁי ח Genesis 47:6 (J), Exodus 18:21,25 (both E); of a woman אֵשֶׁת ׳ח Proverbs 12:4; Proverbs 31:10; Ruth 3:11'
  - where: 'note 18:21 “The four marks of a judge”'
    claim: 'Ruth 3:11 reads “virtuous woman” in the King James Version'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/3?lang=eng'
    quote: 'for all the city of my people doth know that thou art a virtuous woman.'
  - where: 'note 18:21 “The four marks of a judge”'
    claim: 'The Hebrew word behind “covetousness” means gain made by violence, unjust gain, and Ex. 18:21 is listed under unjust gain'
    key: bdb
    url: 'https://biblehub.com/hebrew/1215.htm'
    quote: 'noun masculine gain made by violence, unjust gain, profit'
  - where: 'note 18:21 “The four marks of a judge”'
    claim: 'A modern translation: “hate dishonest gain”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2018&version=NRSVUE'
    quote: 'You should also look for able men among all the people, men who fear God, are trustworthy, and hate dishonest gain'

  # ---------- note 18:23 ----------
  - where: 'note 18:23 “Counsel given subject to God’s command”'
    claim: 'In Deuteronomy Moses tells the people he cannot bear them alone'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And I spake unto you at that time, saying, I am not able to bear you myself alone:'
  - where: 'note 18:23 “Counsel given subject to God’s command”'
    claim: 'The people put the men forward'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'Take you wise men, and understanding, and known among your tribes, and I will make them rulers over you.'
  - where: 'note 18:23 “Counsel given subject to God’s command”'
    claim: 'Moses’s charge to the judges'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'Ye shall not respect persons in judgment; but ye shall hear the small as well as the great; ye shall not be afraid of the face of man; for the judgment is God’s: and the cause that is too hard for you, bring it unto me, and I will hear it.'


  # ---------- explore ----------
  - where: 'explore'
    claim: 'The Church’s footnote at “judge” in verse 13 points to Mosiah 29:11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/18?lang=eng'
    quote: 'Mosiah 29:11 (11–44)'
  - where: 'explore'
    claim: 'D&C 84:6–16 traces the priesthood from Moses through Jethro back to Adam'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'And Jethro received it under the hand of Caleb;'
