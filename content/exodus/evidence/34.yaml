    url: 'https://biblehub.com/commentaries/cambridge/exodus/34.htm'
    quote: 'Moses, therefore, put a veil on his face, which he wore ever afterwards, except when he went in to speak with God, or while he was communicating to the people the Divine message which he had received'
  - where: 'note 34:33 “When Moses wore the veil, and what Paul saw in it”'
    claim: 'Verses 34–35 describe habitual practice'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/34.htm'
    quote: 'The tenses are throughout frequentative, describing Moses’ habitual practice.'
  - where: 'note 34:33 “When Moses wore the veil, and what Paul saw in it”'
    claim: 'The Septuagint renders “shone” as “was glorified”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/exodus/34.htm'
    quote: 'Moses knew not that the appearance of the skin of his face was glorified, when God spoke to him.'
  - where: 'note 34:33 “When Moses wore the veil, and what Paul saw in it”'
    claim: 'One older reading: Paul’s words for glory come from the Greek rendering, and Paul assigns the waning of the glory as the reason for the veil'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/34.htm'
    quote: 'that they might not see its gradual waning away (v. 13), which St Paul regards as a type of the passing away of their own dispensation; and (2) that St Paul’s key-words in the passage, δόξα, δεδόξασται (‘glory,’ ‘hath been made glorious’), are suggested by the LXX. rend. of ‘shone’'
  - where: 'note 34:33 “When Moses wore the veil, and what Paul saw in it”'
    claim: '2 Corinthians 3:7, 13–14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/2-cor/3?lang=eng'
    quote: 'But their minds were blinded: for until this day remaineth the same veil untaken away in the reading of the old testament; which veil is done away in Christ.'

