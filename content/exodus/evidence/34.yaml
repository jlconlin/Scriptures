    url: 'https://www.biblegateway.com/passage/?search=Exodus+34%3A29-35&version=NRSVUE'
    quote: 'When Moses had finished speaking with them, he put a veil on his face'
  - where: 'note 34:33 “When Moses wore the veil, and what Paul saw in it”'
    claim: 'One older reading: when the veil was worn'
