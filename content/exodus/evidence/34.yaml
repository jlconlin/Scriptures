chapter: 34
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'Moses stayed on the mount a second forty days and nights'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/10?lang=eng'
    quote: 'And I stayed in the mount, according to the first time, forty days and forty nights; and the Lord hearkened unto me at that time also, and the Lord would not destroy thee.'
  - where: 'setting'
    claim: 'The LORD had promised to proclaim His name before Moses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/33?lang=eng'
    quote: 'And he said, I will make all my goodness pass before thee, and I will proclaim the name of the Lord before thee'
  - where: 'setting'
    claim: 'The Church’s footnote on “proclaimed” in verse 5 points back to that promise'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'Ex. 33:19.'
  - where: 'setting'
    claim: 'A second stay of forty days, “according to the first time”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/10?lang=eng'
    quote: 'And I stayed in the mount, according to the first time, forty days and forty nights'
  - where: 'setting'
    claim: 'One study counts three theophanies at Sinai, this the third'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'the commissioning call of Moses (Exodus 3–4), the establishment of the Mosaic covenant (Exodus 19–20, 24), and the renewal of the covenant after the rebellion of the golden calf (Exodus 32–34).'
  - where: 'setting'
    claim: 'The Sinai narrative (Exodus 19–34) ends with the second tablets'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'the Sinai pericope or Sinai narrative, which comprises Exodus 19–34. It is fronted by Moses’s first meeting and is ended by the reception of the second set of tablets.'
  - where: 'setting'
    claim: 'Moses retells the hewing of the second tables in Deuteronomy 10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/10?lang=eng'
    quote: 'At that time the Lord said unto me, Hew thee two tables of stone like unto the first, and come up unto me into the mount, and make thee an ark of wood.'
  - where: 'setting'
    claim: 'Paul argues from the veil in 2 Corinthians 3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/2-cor/3?lang=eng'
    quote: 'And not as Moses, which put a veil over his face, that the children of Israel could not steadfastly look to the end of that which is abolished:'
  - where: 'setting'
    claim: 'The JST and D&C 84 say what was taken away'
    key: jst-ex-34
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-ex/34?lang=eng'
    quote: 'God again writes the law on tablets of stone prepared by Moses but takes the Melchizedek Priesthood and its ordinances away from the children of Israel.'
  - where: 'thread'
    claim: 'The LORD had said He would not go up in the midst of a stiffnecked people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/33?lang=eng'
    quote: 'for I will not go up in the midst of thee; for thou art a stiffnecked people: lest I consume thee in the way.'
  - where: 'thread'
    claim: 'One older reading: at Exodus 20:5 zeal stood first and mercy after; here mercy is in front'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/34.htm'
    quote: 'The Lord had already revealed Himself to the whole nation from Mount Sinai as visiting sin and showing mercy (Exodus 20:5.). But whereas on that occasion the burning zeal of Jehovah which visits sin stood in the foreground, and mercy only followed afterwards, here grace, mercy, and goodness are placed in the front.'
  - where: 'thread'
    claim: 'One older reading: the laws repeat two leading points from chapters 21–23, the warning against league with the Canaanites (11–16) and the true worship of the LORD (17–26)'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/34.htm'
    quote: 'the Lord repeats from among the rights of Israel, upon the basis of which the covenant had been established (ch. 21-23), two of the leading points which determined the attitude of the nation towards Him'
  - where: 'thread'
    claim: 'The two points are verses 11–16 and 17–26'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/34.htm'
    quote: 'These were, first, the warning against every kind of league with the Canaanites, who were to be driven out before the Israelites (Exodus 34:11-16); and, secondly, the instructions concerning the true worship of Jehovah (Exodus 34:17-26).'
  - where: 'thread'
    claim: 'The new commandments build on the earlier injunctions against other gods and idols'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'The result of this provocation was the giving of a new set of tablets, which included a set of commandments that emphasized and built upon the earlier injunctions against worshipping other gods and engaging in idol worship.'
  - where: 'thread'
    claim: 'The prohibition of molten gods alludes to the golden calf'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/34.htm'
    quote: 'first of all negatively, in the prohibition against making molten images, with an allusion to the worship of the golden calf'

  # ---------- plain ----------
  - where: 'section 2 plain'
    claim: '“and that” in verse 7 may be rendered “but who”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'OR but who.'
  - where: 'section 3 plain'
    claim: '“be for a snare” may be rendered “become a snare”; “groves” are asherim'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'HEB asherim, or cultic deities.'
  - where: 'section 3 plain'
    claim: 'An asherah was a tree or tree-like pole (so “sacred poles”)'
    key: bd-grove
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/grove?lang=eng'
    quote: 'either a living tree or a tree-like pole, set up as an object of worship'
  - where: 'section 4 plain'
    claim: '“earing” is plowing; “after the tenor of” is “according to”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'HEB plowing.'
  - where: 'section 4 plain'
    claim: '“seethe a kid” is to cook a young goat'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'IE cook a young goat in its mother’s milk—a ritual food of the fertility cults.'
  - where: 'section 5 plain'
    claim: 'Verse 33 rendered “When Moses had finished speaking”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus+34%3A29-35&version=NRSVUE'
    quote: 'When Moses had finished speaking with them, he put a veil on his face'

  # ---------- note 34:1 ----------
  - where: 'note 34:1 “What the second tables did not restore”'
    claim: 'JST Exodus 34:1: the law written again, but the priesthood and its ordinances taken away'
    key: jst-ex-34
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-ex/34?lang=eng'
    quote: 'I will write upon them also, the words of the law, according as they were written at the first on the tables which thou brakest; but it shall not be according to the first, for I will take away the priesthood out of their midst; therefore my holy order, and the ordinances thereof, shall not go before them'
  - where: 'note 34:1 “What the second tables did not restore”'
    claim: 'JST Exodus 34:2: the law of a carnal commandment; not to enter His presence in the days of their pilgrimage'
    key: jst-ex-34
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-ex/34?lang=eng'
    quote: 'But I will give unto them the law as at the first, but it shall be after the law of a carnal commandment; for I have sworn in my wrath, that they shall not enter into my presence, into my rest, in the days of their pilgrimage.'
  - where: 'note 34:1 “What the second tables did not restore”'
    claim: 'JST Deuteronomy 10:2 names what was left off the second tables'
    key: jst-deut-10
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-deut/10?lang=eng'
    quote: 'And I will write on the tables the words that were on the first tables, which thou brakest, save the words of the everlasting covenant of the holy priesthood, and thou shalt put them in the ark.'
  - where: 'note 34:1 “What the second tables did not restore”'
    claim: 'D&C 84:24–26: Israel hardened their hearts; Moses and the Holy Priesthood taken; the lesser priesthood continued'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'But they hardened their hearts and could not endure his presence; therefore, the Lord in his wrath, for his anger was kindled against them, swore that they should not enter into his rest while in the wilderness'
  - where: 'note 34:1 “What the second tables did not restore”'
    claim: 'D&C 84:25'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'Therefore, he took Moses out of their midst, and the Holy Priesthood also;'
  - where: 'note 34:1 “What the second tables did not restore”'
    claim: 'The missing words were the higher ordinances that gave access to the Lord’s presence'
    key: thomas-provocation
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/provocation-wilderness-rejection-grace'
    quote: 'meaning the higher, sanctifying ordinances of the Melchizedek Priesthood. Those were the very ordinances that gave access to the presence of the Lord (see Joseph Smith Translation, Exodus 34:1–2).'
  - where: 'note 34:1 “What the second tables did not restore”'
    claim: 'Only the Levites held priesthood'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'In fact, in practical terms, only one-twelfth of the tribes of Israel held any priesthood at all—the Levites.'
  - where: 'note 34:1 “What the second tables did not restore”'
    claim: 'Priests became intermediaries'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'Instead of a holy nation, where all individuals could represent themselves directly to God, the priests began to act as intermediaries and represented the people before God.'
  - where: 'note 34:1 “What the second tables did not restore”'
    claim: 'The offer of Exodus 19:6 was to the whole people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/19?lang=eng'
    quote: 'And ye shall be unto me a kingdom of priests, and an holy nation.'
  - where: 'note 34:1 “What the second tables did not restore”'
    claim: 'The law of Moses was a good law'
    key: bd-law-of-moses
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/law-of-moses?lang=eng'
    quote: 'The law as given through Moses was a good law, although adapted to a lower spiritual capacity than is required for obedience to the gospel in its fulness.'
  - where: 'note 34:1 “What the second tables did not restore”'
    claim: 'It was a preparatory gospel'
    key: bd-law-of-moses
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/law-of-moses?lang=eng'
    quote: 'The law functioned under the Aaronic Priesthood and was a preparatory gospel to bring its adherents to Christ.'
  - where: 'note 34:1 “What the second tables did not restore”'
    claim: 'God did not abandon Israel'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'Yet, even at this lowest point, God did not abandon them.'

  # ---------- note 34:6 ----------
  - where: 'note 34:6 “The name the LORD proclaims”'
    claim: 'The long name describes attributes of God, unlike the brief name at the bush'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'Unlike the laconic name “I am that I am,” this name contains thirty-two words, all describing various attributes of God.'
  - where: 'note 34:6 “The name the LORD proclaims”'
    claim: 'Such mercy is unlike the religions around Israel'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'This mercy, grace, and longsuffering is atypical in the ancient religious milieu.'
  - where: 'note 34:6 “The name the LORD proclaims”'
    claim: '“Goodness” is hesed, covenant loyalty, in contrast with Israel'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: '“Goodness” is the Hebrew word hesed … it conveys the sense of steadfast loyalty to the covenant. This stands in stark contrast to the behavior of the children of Israel, who are far from steadfast and immovable.'
  - where: 'note 34:6 “The name the LORD proclaims”'
    claim: 'The Hebrew word in verse 6 is hesed'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'חֶ֥סֶד'
  - where: 'note 34:6 “The name the LORD proclaims”'
    claim: 'Numbers 14: Israel murmurs and speaks of returning to Egypt; Moses prays the words back'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/14?lang=eng'
    quote: 'Israel murmurs and speaks of returning to Egypt'
  - where: 'note 34:6 “The name the LORD proclaims”'
    claim: 'Moses cites the words as spoken by the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/14?lang=eng'
    quote: 'And now, I beseech thee, let the power of my Lord be great, according as thou hast spoken, saying,'
  - where: 'note 34:6 “The name the LORD proclaims”'
    claim: 'Jonah gives the words as his reason for fleeing'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jonah/4?lang=eng'
    quote: 'Therefore I fled before unto Tarshish: for I knew that thou art a gracious God, and merciful, slow to anger, and of great kindness'

  # ---------- note 34:7 ----------
  - where: 'note 34:7 “Forgiving, and not clearing the guilty”'
    claim: 'Footnote 7c gives “but who” for “and that”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'OR but who.'
  - where: 'note 34:7 “Forgiving, and not clearing the guilty”'
    claim: 'Footnote 7e: the JST reads “rebellious” for “guilty”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'JST Ex. 34:7 … rebellious …'
  - where: 'note 34:7 “Forgiving, and not clearing the guilty”'
    claim: 'Justice is part of God’s nature; mercy will not rob justice'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'While God’s mercy and forgiveness are again emphasized, it is now revealed that justice is an essential part of God’s nature. God will not clear the guilty or overlook sin. Mercy will not rob justice.'
  - where: 'note 34:7 “Forgiving, and not clearing the guilty”'
    claim: '“Thousands” read as thousands of generations; the proportion of mercy to anger'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: '“keeping mercy for thousands [that is, thousands of generations] … But his mercy will extend until the thousandth generation—250 times longer than his anger.'

  # ---------- note 34:9 ----------
  - where: 'note 34:9 “Moses pleads the people’s fault as his reason”'
    claim: 'The LORD’s earlier word: He would not go up in the midst of a stiffnecked people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/33?lang=eng'
    quote: 'for I will not go up in the midst of thee; for thou art a stiffnecked people: lest I consume thee in the way.'
  - where: 'note 34:9 “Moses pleads the people’s fault as his reason”'
    claim: 'One older reading: Moses lays hold of the grace just revealed'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/34.htm'
    quote: 'it was perfectly natural that, when this petition was granted, he should lay hold of the grace that had been revealed to him as it never had been before, and endeavour to give even greater stability to the covenant.'
  - where: 'note 34:9 “Moses pleads the people’s fault as his reason”'
    claim: 'The stubbornness is pleaded as a motive for forgiveness, as at Genesis 8:21'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/34.htm'
    quote: 'was appropriately pleaded as a motive for asking forgiveness, inasmuch as God Himself had assigned the natural corruption of the human race as a reason why He would not destroy it again with a flood (Genesis 8:21).'
  - where: 'note 34:9 “Moses pleads the people’s fault as his reason”'
    claim: 'Genesis 8:21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/8?lang=eng'
    quote: 'I will not again curse the ground any more for man’s sake; for the imagination of man’s heart is evil from his youth; neither will I again smite any more every thing living, as I have done.'
  - where: 'note 34:9 “Moses pleads the people’s fault as his reason”'
    claim: 'Moses includes himself with the nation'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/34.htm'
    quote: 'Moses spoke collectively, including himself in the nation in the presence of God.'
  - where: 'note 34:9 “Moses pleads the people’s fault as his reason”'
    claim: '“Inheritance” is an inalienable possession; Moses asks that Israel again be God’s special possession'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'The word translated as “inheritance,” nahala, refers to an eternal, inalienable possession. In other words, Moses is asking God to take Israel once again as his own special possession, his segulla.'
  - where: 'note 34:9 “Moses pleads the people’s fault as his reason”'
    claim: 'The “peculiar treasure” of Exodus 19:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/19?lang=eng'
    quote: 'then ye shall be a peculiar treasure unto me above all people: for all the earth is mine:'
  - where: 'note 34:9 “Moses pleads the people’s fault as his reason”'
    claim: 'The Hebrew word translated “peculiar treasure” at Exodus 19:5 is segullah (H5459)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'סְגֻלָּה֙'

  # ---------- note 34:10 ----------
  - where: 'note 34:10 “The covenant renewed, and the marvels promised”'
    claim: 'The covenant relationship is not permanently revoked'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'God will not permanently revoke the privilege of a covenant relationship. Israel will once again be his people.'
  - where: 'note 34:10 “The covenant renewed, and the marvels promised”'
    claim: 'The restricted instructions still established a covenant; the marvels are for others to see'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'the instructions still formally established a covenant relationship in which God promised to “do marvels, such as have not been done in all the earth, nor in any nation” (Exodus 34:10), before the people of Israel, which in turn, would be the means by which others would see the wonderful things of God.'
  - where: 'note 34:10 “The covenant renewed, and the marvels promised”'
    claim: '“Done” is the verb “to create,” as in Genesis 1; the act read as the miracle of forgiveness'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'the word “done” is from the Hebrew word bara’, “to create.” It is the word used in Genesis 1. … What is this act? It is the miracle of forgiveness.'
  - where: 'note 34:10 “The covenant renewed, and the marvels promised”'
    claim: 'The verb in verse 10 is bara (H1254), in the passive'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'נִבְרְא֥וּ'

  # ---------- note 34:13 ----------
  - where: 'note 34:13 “Groves are asherim”'
    claim: 'The Church’s footnote gives the Hebrew'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'HEB asherim, or cultic deities.'
  - where: 'note 34:13 “Groves are asherim”'
    claim: 'The Hebrew word in verse 13 is asherah (H842), plural with suffix'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'אֲשֵׁרָ֖י/ו'
  - where: 'note 34:13 “Groves are asherim”'
    claim: 'What an asherah was'
    key: bd-grove
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/grove?lang=eng'
    quote: 'In Hebrew, called Asherah (of which the plural is Asherim or Asheroth), either a living tree or a tree-like pole, set up as an object of worship, being symbolic of the female or productive principle in nature. Every Phoenician altar had an asherah near it.'
  - where: 'note 34:13 “Groves are asherim”'
    claim: 'Why they were forbidden'
    key: bd-grove
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/grove?lang=eng'
    quote: 'This “nature worship” became associated with gross immorality, and so the practice of setting up such “groves” or idols was forbidden by Hebrew prophets'

  # ---------- note 34:15 ----------
  - where: 'note 34:15 “Idolatry as unfaithfulness in marriage”'
    claim: 'The LORD speaks of Israel as bride and Himself as bridegroom, as in Hosea 2'
    key: thomas-provocation
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/provocation-wilderness-rejection-grace'
    quote: 'He spoke of the covenant people as bride and Himself as bridegroom (see Hosea 2:19–20).'
  - where: 'note 34:15 “Idolatry as unfaithfulness in marriage”'
    claim: 'Hosea 2:19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/2?lang=eng'
    quote: 'And I will betroth thee unto me for ever; yea, I will betroth thee unto me in righteousness, and in judgment, and in lovingkindness, and in mercies.'
  - where: 'note 34:15 “Idolatry as unfaithfulness in marriage”'
    claim: 'The calf, within forty days of the covenant, likened to adultery on the wedding night'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'Within forty days of experiencing God and entering into a holy covenant through sacred rituals, the children of Israel break their covenant. This happens so fast that it could be likened unto “committing adultery on one’s wedding night.”'
  - where: 'note 34:15 “Idolatry as unfaithfulness in marriage”'
    claim: 'The Church’s footnote on “call” points to Numbers 25'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'Num. 25:2 (1–2).'
  - where: 'note 34:15 “Idolatry as unfaithfulness in marriage”'
    claim: 'Numbers 25:1–2: whoredom, an invitation to sacrifices, eating, bowing down'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/25?lang=eng'
    quote: 'And they called the people unto the sacrifices of their gods: and the people did eat, and bowed down to their gods.'
  - where: 'note 34:15 “Idolatry as unfaithfulness in marriage”'
    claim: 'JST Exodus 34:14 reads “Jehovah” for “Jealous”'
    key: jst-ex-34
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-ex/34?lang=eng'
    quote: 'For thou shalt worship no other god; for the Lord, whose name is Jehovah, is a jealous God.'

  # ---------- note 34:23 ----------
  - where: 'note 34:23 “The command to appear before the LORD stands”'
    claim: 'The thrice-yearly appearance is the one instruction unchanged between the two sets of tablets'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'Intriguingly, one set of instructions stayed the same between the original and the secondary tablets—namely, that all Israelites were to come to the tabernacle three times a year.'
  - where: 'note 34:23 “The command to appear before the LORD stands”'
    claim: 'It has been argued the verb was originally “see”'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'thus providing a reading of “three times in the year all thy males shall see the Lord God” rather than “three times in the year all thy males shall be seen/present themselves (“appear before”) before the Lord God.”'
  - where: 'note 34:23 “The command to appear before the LORD stands”'
    claim: 'The conclusion, stated conditionally'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'If this emended reading is correct, the commandment to go to the tabernacle three times per year, reflected in both sets of tablets, potentially carried with it the great promise to see the face of God.'
  - where: 'note 34:23 “The command to appear before the LORD stands”'
    claim: 'The same proposal made for Exodus 34:24'
    key: thomas-provocation
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/provocation-wilderness-rejection-grace'
    quote: 'The text of Exodus 34:24 was subtly altered from “to see the face of the Lord” (lir’ot ‘et-pene yhwh) to the phrase “to appear before the Lord” (lera’ot ‘et-pene yhwh).'

