chapter: 27
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'Moses was on the mount forty days and forty nights'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/24?lang=eng'
    quote: 'And Moses went into the midst of the cloud, and gat him up into the mount: and Moses was in the mount forty days and forty nights.'
  - where: 'setting'
    claim: 'Moses is in the cloud on the mount forty days and forty nights'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/24?lang=eng'
    quote: 'And Moses went into the midst of the cloud, and gat him up into the mount: and Moses was in the mount forty days and forty nights.'
  - where: 'setting'
    claim: 'The command to make a sanctuary stands at the head of the instructions'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/25?lang=eng'
    quote: 'And let them make me a sanctuary; that I may dwell among them.'
  - where: 'setting'
    claim: 'The instructions began with the ark, in chapter 25, and reach the altar in the court at 27:1–8'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'He started with the most sacred aspect of the tabernacle, the ark of the covenant in the Holy of Holies (Exodus 25:10–22), and then worked out to the least sacred, the altar of sacrifice in the outer courtyard (Exodus 27:1–8).'
  - where: 'setting'
    claim: 'Chapter 26 describes the boards and curtains of the tent'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'Its north, west, and south sides were made of 46 boards (10 cubits by 1½) and two narrower corner ones of acacia wood (Ex. 26:15), overlaid with gold (26:29).'
  - where: 'setting'
    claim: 'A veil divided the tabernacle in two'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'The tabernacle was divided into two parts by a veil of the same materials as the screen of the court'
  - where: 'setting'
    claim: 'The laver, which stood in the court, is commanded in chapter 30'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'Between the altar of burnt offering and the door of the tent stood a laver of brass on a base of brass (Ex. 30:18).'
  - where: 'setting'
    claim: 'The altar of incense, which stood in the holy place, is commanded in chapter 30'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'In the middle, before the veil and before the mercy seat (Ex. 30:6), stood the altar of incense, similar in construction to the altar of burnt offering but smaller and overlaid with gold.'
  - where: 'setting'
    claim: 'The altar and the court are made in Exodus 38'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/27?lang=eng'
    quote: '1a “altar”: Ex. 35:16; 38:1 (1–7); Ezek. 9:2; Alma 15:17.'
  - where: 'setting'
    claim: 'The court is made in Exodus 38:9–20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/27?lang=eng'
    quote: '9a “linen”: Ex. 38:16 (9–20).'
  - where: 'setting'
    claim: 'The command about the oil is repeated in Leviticus 24'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/24?lang=eng'
    quote: 'Command the children of Israel, that they bring unto thee pure oil olive beaten for the light, to cause the lamps to burn continually.'
  - where: 'setting'
    claim: 'Chapter 28 turns to Aaron and his sons as priests'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/28?lang=eng'
    quote: 'And take thou unto thee Aaron thy brother, and his sons with him, from among the children of Israel, that he may minister unto me in the priest’s office'
  - where: 'thread'
    claim: 'The instructions move from the most sacred thing outward to the altar in the court'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'He started with the most sacred aspect of the tabernacle, the ark of the covenant in the Holy of Holies (Exodus 25:10–22), and then worked out to the least sacred, the altar of sacrifice in the outer courtyard (Exodus 27:1–8).'
  - where: 'thread'
    claim: 'The order of the instructions is the reverse of the order of approach'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'even though Israel (represented by the high priest) would enter from the courtyard, then move into the Holy Place, and finally into the Holy of Holies'
  - where: 'thread'
    claim: 'The altar was the first thing met inside the gate'
    key: ot-manual-ex-25-30
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-25-30-35-40-the-house-of-the-lord-in-the-wilderness?lang=eng'
    quote: 'The first thing encountered as one entered the main gate was the altar of sacrifice.'
  - where: 'thread'
    claim: 'The ark, table and candlestick were gold; the altar of burnt offering and the bases of the court bronze'
    key: ot-manual-ex-25-30
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-25-30-35-40-the-house-of-the-lord-in-the-wilderness?lang=eng'
    quote: 'Fine or pure gold was used for the Ark, the propitiatory, the table of the Presence and its vessels; for the lampstand and its accessories … Finally there was bronze, of which metal the altar of burnt offering and its utensils, the bases of the court'
  - where: 'thread'
    claim: 'One older reading: verses 20–21 are a transition from the sanctuary to its servants'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/27.htm'
    quote: 'The instructions concerning the Oil For the Candlestick, and the daily trimming of the lamps by the priests, form a transition from the fitting up of the sanctuary to the installation of its servants.'

  # ---------- sections ----------
  - where: 'section 1 plain'
    claim: '“Of the same” means the horns are part of the altar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/27?lang=eng'
    quote: '2b “of the same”: IE part of the altar.'
  - where: 'section 1 plain'
    claim: '“Compass” may be rendered ledge'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/27?lang=eng'
    quote: '5a “compass”: OR ledge.'
  - where: 'section 2 plain'
    claim: 'The “hanging” of the gate is a screen'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/27?lang=eng'
    quote: '16a “hanging”: OR screen, or curtain. Ex. 26:36; 38:18 (9–20).'
  - where: 'section 2 plain'
    claim: 'The “pins” of verse 19 are pegs'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/27.htm'
    quote: '"All the vessels of the dwelling in all the work thereof (i.e., all the tools needed for the tabernacle), and all its pegs, and all the pegs of the court, (shall be of) brass or copper."'
  - where: 'section 3 plain'
    claim: '“Without the veil” is outside the veil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/27?lang=eng'
    quote: '21c “without”: OR outside of the veil.'
  - where: 'section 3 plain'
    claim: '“Order it” is keep it in order'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/27?lang=eng'
    quote: '21f “order it”: OR keep it in order.'

  # ---------- notes ----------
  - where: 'note 27:1 “The altar of burnt offering”'
    claim: 'The account of its making calls it the altar of burnt offering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/38?lang=eng'
    quote: 'And he made the altar of burnt offering of shittim wood: five cubits was the length thereof, and five cubits the breadth thereof; it was foursquare; and three cubits the height thereof.'
  - where: 'note 27:1 “The altar of burnt offering”'
    claim: 'It is called the brasen altar in 39:39'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/39?lang=eng'
    quote: 'The brasen altar, and his grate of brass, his staves, and all his vessels, the laver and his foot,'
  - where: 'note 27:1 “The altar of burnt offering”'
    claim: 'It stood in the court in front of the door of the tent, and took its name from its brass covering'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'In the court outside the tent and in front of its door stood the altar of burnt offering, a square of five cubits, three cubits high. Its outer frame was acacia wood overlaid with brass (Ex. 27:1–2, 8), whence its name (Ex. 39:39).'
  - where: 'note 27:1 “The altar of burnt offering”'
    claim: 'It was the largest piece of furniture'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'It was by far the largest piece of furniture.'
  - where: 'note 27:1 “The altar of burnt offering”'
    claim: 'The offerer brought his animal to the door of the tabernacle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/1?lang=eng'
    quote: 'he shall offer it of his own voluntary will at the door of the tabernacle of the congregation before the Lord.'
  - where: 'note 27:1 “The altar of burnt offering”'
    claim: 'The priests sprinkled the blood on the altar by the door'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/1?lang=eng'
    quote: 'and the priests, Aaron’s sons, shall bring the blood, and sprinkle the blood round about upon the altar that is by the door of the tabernacle of the congregation.'
  - where: 'note 27:1 “The altar of burnt offering”'
    claim: 'The fire on the altar was never to go out'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/6?lang=eng'
    quote: 'The fire shall ever be burning upon the altar; it shall never go out.'
  - where: 'note 27:1 “The altar of burnt offering”'
    claim: 'The continual burnt offering was made at the door of the tabernacle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/29?lang=eng'
    quote: 'This shall be a continual burnt offering throughout your generations at the door of the tabernacle of the congregation before the Lord: where I will meet you, to speak there unto thee.'
  - where: 'note 27:1 “The altar of burnt offering”'
    claim: 'What the pans, shovels and fleshhooks were for'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'The pans were used for collecting and disposing of the ashes from the sacrifices. The shovels were used to scoop up the ashes. The fleshhooks, or meat forks, were used to place the sacrifice on the altar so it could be burned, rotated, and moved.'
  - where: 'note 27:1 “The altar of burnt offering”'
    claim: 'The firepans carried coals'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'The firepans were used for collecting coals to be used for lighting the menorah and the altar of incense and so forth.'

  - where: 'note 27:2 “The horns of the altar”'
    claim: 'The horns are part of the altar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/27?lang=eng'
    quote: '2b “of the same”: IE part of the altar.'
  - where: 'note 27:2 “The horns of the altar”'
    claim: 'The blood of the sin offering was put on the horns of the altar of burnt offering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/4?lang=eng'
    quote: 'And the priest shall take of the blood of the sin offering with his finger, and put it upon the horns of the altar of burnt offering, and shall pour out his blood at the bottom of the altar of burnt offering.'
  - where: 'note 27:2 “The horns of the altar”'
    claim: 'The same is commanded at the consecration of Aaron and his sons'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/29?lang=eng'
    quote: 'And thou shalt take of the blood of the bullock, and put it upon the horns of the altar with thy finger, and pour all the blood beside the bottom of the altar.'
  - where: 'note 27:2 “The horns of the altar”'
    claim: 'The horns were the loftiest points of the altar, and the blood was put there to bring the atonement nearer to God; they were also a refuge'
    key: bd-altar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/altar?lang=eng'
    quote: 'At the four corners were four horns; on these, the loftiest points of the altar, the blood of the sin offerings was put, that the atonement be brought nearer to God. At times these horns were also a place of refuge for fugitives (1 Kgs. 1:50; 2:28).'
  - where: 'note 27:2 “The horns of the altar”'
    claim: 'Adonijah caught hold of the horns of the altar for fear of Solomon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/1?lang=eng'
    quote: 'And Adonijah feared because of Solomon, and arose, and went, and caught hold on the horns of the altar.'
  - where: 'note 27:2 “The horns of the altar”'
    claim: 'Horns were symbols of power and strength'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'The number four often symbolizes the four corners of the earth, and horns in ancient times were often symbols of power and strength.'
  - where: 'note 27:2 “The horns of the altar”'
    claim: 'One commentary’s reading of the blood on the four horns'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'Thus, the blood covering the four horns could symbolize the power or strength of Jesus Christ’s Atonement reaching all four corners of the earth.'

  - where: 'note 27:8 “A wooden altar that carried fire”'
    claim: 'The hollow was probably filled with earth or unhewn stones; a ledge ran halfway up, supported by a grating'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'The hollow was probably filled with earth or unhewn stones (Ex. 20:24–25). Around and halfway up the altar was a ledge (Ex. 27:5), supported by a grating or network of brass.'
  - where: 'note 27:8 “A wooden altar that carried fire”'
    claim: 'It had rings and staves by which it was carried'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'Besides various brazen utensils for use in the sacrifices, it had rings and staves by means of which it was carried.'
  - where: 'note 27:8 “A wooden altar that carried fire”'
    claim: 'Altars were of earth or unhewn stone, often enclosed in a wooden case'
    key: bd-altar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/altar?lang=eng'
    quote: 'The materials of an altar were either of raised earth (Ex. 20:24; 2 Kgs. 5:17) or unhewn stones (Ex. 20:25; Deut. 27:5; Josh. 8:31). The Israelites often enclosed the earth or stones in a wooden case to preserve the proper shape (Ex. 27:1).'
  - where: 'note 27:8 “A wooden altar that carried fire”'
    claim: 'What the grate was is debated'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'It could either be a grate halfway down on the sides, or it could possibly mean that the grate itself (where the sacrifice was burned) was halfway down the wall of the altar.'
  - where: 'note 27:8 “A wooden altar that carried fire”'
    claim: 'Moses was shown a pattern of the tabernacle and its instruments'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/25?lang=eng'
    quote: 'According to all that I shew thee, after the pattern of the tabernacle, and the pattern of all the instruments thereof, even so shall ye make it.'

  - where: 'note 27:9 “The court, and who came into it”'
    claim: 'The size of the court, its fence, and its east entrance'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'The tent stood in a court 100 cubits by 50, surrounded by a fence (Ex. 27:18) five cubits high, composed of pillars and hangings of fine white linen. The entrance toward the east was 20 cubits wide (Ex. 27:16)'
  - where: 'note 27:9 “The court, and who came into it”'
    claim: 'The screen of the court was of the same materials as the veil and the screen of the tent'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'The tabernacle was divided into two parts by a veil of the same materials as the screen of the court, the inner roof covering of the tabernacle, and the screen of the tent (Ex. 36:35, 37).'
  - where: 'note 27:9 “The court, and who came into it”'
    claim: 'Any Israelite could bring sacrifices into the court; only priests entered the tent'
    key: ot-manual-ex-25-30
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-25-30-35-40-the-house-of-the-lord-in-the-wilderness?lang=eng'
    quote: 'Into this courtyard anyone of Israel could bring sacrifices, but only the priests could enter the tabernacle itself.'
  - where: 'note 27:9 “The court, and who came into it”'
    claim: 'The court was the only place an Israelite who was not of the priestly tribe could come'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'It was the only place non-Levite Israelites could come to worship since the tabernacle proper could only be entered by the priests.'
  - where: 'note 27:9 “The court, and who came into it”'
    claim: 'The tent walls rest on silver bases, the court pillars on brass; the metals show a gradation of sanctity'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'Unlike the inner sanctuary walls, which rested on a foundation of silver bases, these outer pillars rested on brass or bronze sockets or bases. The different metals show the gradation of sanctity.'
  - where: 'note 27:9 “The court, and who came into it”'
    claim: 'Silver and gold mark the more sacred areas'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'As a worshiper progressed toward more sacred areas, silver and gold were used to show the symbolic progression of sanctity.'
  - where: 'note 27:9 “The court, and who came into it”'
    claim: 'One study: the three zones correspond to the base, midsection and peak of the mountain of God'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'Its three zones of intensifying holiness (outer courtyard, holy place, Holy of Holies) corresponded respectively to the mountain of God’s base, midsection, and peak, a symbolism naturally generating the question of who may approach (ascend).'
  - where: 'note 27:9 “The court, and who came into it”'
    claim: 'The same study prints the comparison of the court and its altar with the fence around Sinai and the altar at its foot'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'The fence around the mountain, with an altar at the foot of the mountain, would correspond to the court of the sanctuary with its altar of burnt offering'

  - where: 'note 27:20 “Beaten oil, brought by the people”'
    claim: 'Beaten oil was the finest quality, made by pounding olives in a mortar and skimming the first oil; common oil came from the remaining pulp'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/27.htm'
    quote: '‘Beaten’ oil was oil of the finest quality: it was obtained ‘by gently pounding the olives in a mortar; the pulp was then poured into a wicker or rush basket, which, acting as a strainer, allowed the liquid to run into a vessel underneath.'
  - where: 'note 27:20 “Beaten oil, brought by the people”'
    claim: 'The first oil was skimmed off; commoner oil came from the pulp left in the baskets'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/27.htm'
    quote: 'The oil which would presently float upon the top was skimmed off,’ and this formed the oil in question. The commoner kinds of oil were obtained from the pulp remaining in the baskets'
  - where: 'note 27:20 “Beaten oil, brought by the people”'
    claim: 'The candlestick stood in the holy place and its lamps burned this oil'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'On the south side of the altar of incense stood the candlestick (Ex. 26:35), of pure gold of beaten work, with six branches and seven lamps. Pure olive oil beaten was burned in the lamps (Ex. 27:20–21; Lev. 24:2).'
  - where: 'note 27:20 “The lamp tended evening and morning”'
    claim: 'Leviticus sets “from the evening unto the morning” beside “continually”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/24?lang=eng'
    quote: 'Without the veil of the testimony, in the tabernacle of the congregation, shall Aaron order it from the evening unto the morning before the Lord continually: it shall be a statute for ever in your generations.'
  - where: 'note 27:20 “The lamp tended evening and morning”'
    claim: 'Aaron lit the lamps at evening and dressed them in the morning'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'Aaron lit the lamps at evening and dressed them in the morning (Ex. 30:8; Lev. 24:3).'
  - where: 'note 27:20 “The lamp tended evening and morning”'
    claim: 'One older reading: the Hebrew word means regularly, not without interruption'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/27.htm'
    quote: 'continually] i.e. not continuously (Exodus 25:30 Heb.), but regularly, as a standing practice, whether daily (as here, Exodus 29:38; Exodus 29:42, Exodus 30:8 al.), or whenever occasion required (Exodus 28:29-30).'
  - where: 'note 27:21 “The tent of meeting”'
    claim: 'The Church’s footnote gives the Hebrew as tent of meeting'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/27?lang=eng'
    quote: '21a “tabernacle”: HEB tent of meeting.'
  - where: 'note 27:21 “The tent of meeting”'
    claim: 'This is the first verse of Exodus with the King James phrase (printed by scripts/occurrences.mjs from the King James text: 27:21, then 28:43, 29:4)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/27?lang=eng'
    quote: 'In the tabernacle of the congregation without the veil, which is before the testimony'
  - where: 'note 27:21 “The tent of meeting”'
    claim: 'The Hebrew words in 27:21 are Strong’s 168 (tent) and 4150 (meeting)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'מוֹעֵד֩'
  - where: 'note 27:21 “The tent of meeting”'
    claim: 'BDB: tent of meeting, of God with His people; frequent from Exodus 27:21 on'
    key: bdb
    url: 'https://biblehub.com/hebrew/4150.htm'
    quote: 'tent of meeting (of God with his people'
  - where: 'note 27:21 “The tent of meeting”'
    claim: 'BDB: the name is frequent, 27:21 and 29:4 among its instances'
    key: bdb
    url: 'https://biblehub.com/hebrew/4150.htm'
    quote: 'often in P, as Exodus 27:21; Exodus 29:4; Leviticus 1:1,3; Joshua 18:1; Joshua 19:51, etc. (131 t.)'
  - where: 'note 27:21 “The tent of meeting”'
    claim: 'The LORD says He will meet Moses and Israel at the door of this tent'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/29?lang=eng'
    quote: 'And there I will meet with the children of Israel, and the tabernacle shall be sanctified by my glory.'

  # ---------- christ / explore ----------
  - where: 'christ'
    claim: 'The sacrifices offered at the altar in the court were symbolic of the Savior’s atoning sacrifice'
    key: scripture-helps-ex-35
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/16-exodus-35-40-leviticus-1-4-16-19?lang=eng'
