chapter: 7
claims:
  - where: 'when'
    claim: 'Moses was eighty and Aaron eighty-three when they spoke to Pharaoh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/7?lang=eng'
    quote: 'And Moses was fourscore years old, and Aaron fourscore and three years old, when they spake unto Pharaoh.'
  - where: 'setting'
    claim: 'Stephen says Moses was forty when he first went out to his brethren'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/7?lang=eng'
    quote: 'And when he was full forty years old, it came into his heart to visit his brethren the children of Israel.'
  - where: 'setting'
    claim: 'Stephen says forty more years passed before the burning bush'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/7?lang=eng'
    quote: 'And when forty years were expired, there appeared to him in the wilderness of mount Sina an angel of the Lord in a flame of fire in a bush.'
  - where: 'setting'
    claim: 'Moses died at one hundred and twenty'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/34?lang=eng'
    quote: 'And Moses was an hundred and twenty years old when he died: his eye was not dim, nor his natural force abated.'
  - where: 'setting'
    claim: 'The Joseph Smith Translation of verse 3 says Pharaoh will harden his own heart'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/7?lang=eng'
    quote: 'JST Ex. 7:3 And Pharaoh will harden his heart, as I said unto thee; and thou shalt multiply my signs …'
  - where: 'setting'
    claim: 'The Joseph Smith Translation of verse 13 says Pharaoh hardened his heart'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/7?lang=eng'
    quote: 'JST Ex. 7:13 And Pharaoh hardened his heart …'
  - where: 'setting'
    claim: 'The “river” of this chapter is the Nile'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/7?lang=eng'
    quote: 'OR Nile (so also in vv. 18, 20–21, 24–25).'
  - where: 'setting'
    claim: 'The sign of the rod is followed by ten plagues'
    key: ot-minute-ex-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-7-13'
    quote: 'The sign of the staff would be followed by ten plagues.'
  - where: 'thread'
    claim: 'The sign of the rod begins the contest between Jehovah and Pharaoh, and the snake was a symbol of Pharaoh and his power'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'it is certainly the beginning of the contest between Jehovah and Pharaoh. We will briefly examine this contest because the snake was so much a symbol of Pharaoh and his power.'
  - where: 'thread'
    claim: 'Control of the Nile was counted among the king''s powers'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'In contaminating the Nile, Jehovah had shown his superiority in an area that was an integral part of the king’s powers.'
  - where: 'thread'
    claim: 'The plagues are read as a contest between Jehovah and Pharaoh'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'Thus, the proper lens through which we should view the conflict acted out in the plagues pericope is that of Jehovah’s triumph over Pharaoh.'

  - where: 'note 7:1 “A god to Pharaoh”'
    claim: 'The Joseph Smith Translation reads “prophet” where the King James has “god,” and the footnote points to Exodus 4:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/7?lang=eng'
    quote: 'JST Ex. 7:1 … prophet … Ex. 4:16.'
  - where: 'note 7:1 “A god to Pharaoh”'
    claim: 'The Joseph Smith Translation reads “spokesman” where the King James has “prophet”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/7?lang=eng'
    quote: 'JST Ex. 7:1 … spokesman.'
  - where: 'note 7:1 “A god to Pharaoh”'
    claim: 'Because Pharaoh was viewed as divine, a meeting between him and Moses would have been between unequals'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'Because Pharaoh was viewed as divine (or semidivine), any normal meeting between Moses and Pharaoh would have been between unequals.'
  - where: 'note 7:1 “A god to Pharaoh”'
    claim: 'Giving Moses an attendant prophet made him Pharaoh''s equal and so set Jehovah above Pharaoh'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'By designating Moses as being similar to a god with an attendant prophet, Jehovah made it so that Moses and Pharaoh were equal.[44] This innately lifted Jehovah above Pharaoh, because Jehovah was still greater than Moses, who was now Pharaoh’s equal.'
  - where: 'note 7:1 “A god to Pharaoh”'
    claim: 'The arrangement: God instructs Moses, Moses directs Aaron, Aaron speaks to Pharaoh'
    key: ot-minute-ex-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-7-13'
    quote: 'God would instruct Moses, then Moses would direct Aaron, and Aaron, as spokesman, would speak with the Pharaoh.'

  - where: 'note 7:4 “Slaves called armies”'
    claim: 'The Hebrew word rendered “armies” in 7:4 is the plural of tsava (Strong''s 6635)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'צִבְאֹתַ֜/י'
  - where: 'note 7:4 “Slaves called armies”'
    claim: 'The same word is rendered “hosts” in 12:41'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'צִבְא֥וֹת'
  - where: 'note 7:4 “Slaves called armies”'
    claim: 'One older reading: Israel is called armies because it left Egypt equipped and ordered by tribes'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/7.htm'
    quote: '(armies) is used of Israel, with reference to its leaving Egypt equipped (Exodus 13:18) and organized as an army according to the tribes'
  - where: 'note 7:4 “Slaves called armies”'
    claim: 'In this sense Israel is called the hosts of Jehovah'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/7.htm'
    quote: 'to contend for the cause of the Lord, and fight the battles of Jehovah. In this respect the Israelites were called the hosts of Jehovah.'

  - where: 'note 7:5 “What the plagues were for”'
    claim: 'Many have tried to match each plague to one Egyptian god, with varying success'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'to mean that each plague was purposefully aimed at showing Jehovah’s power over a specific deity of Egypt.[11] These attempts have been executed with varying degrees of success'
  - where: 'note 7:5 “What the plagues were for”'
    claim: 'Pharaoh cannot be separated from the gods he represented'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'It is impossible to entirely separate Pharaoh from the pantheon of which he was an integral part and for which he served as the earthly representative.'
  - where: 'note 7:5 “What the plagues were for”'
    claim: 'The king''s first duty was to keep the created order against disorder'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'Wilkinson writes, “The king’s primary duty: to safeguard created order by attacking the forces of disorder.”'
  - where: 'note 7:5 “What the plagues were for”'
    claim: 'The plagues in sequence were what the king was supposed to prevent, chaos triumphing over order'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'These calamities as individual catastrophes were just the sort of thing that the king was supposed to prevent, but their arrival in an unrelenting sequence could be seen as nothing short of chaos triumphing over order.'
  - where: 'note 7:5 “What the plagues were for”'
    claim: 'Some plagues can be related to particular Egyptian deities; for others there is no clear connection'
    key: sc-knowhy-631
    url: 'https://scripturecentral.org/knowhy/why-were-particular-plagues-sent-against-egypt'
    quote: 'As some biblical scholars have argued, individual plagues can be related to the responsibilities of specific Egyptian deities (see table)'
  - where: 'note 7:5 “What the plagues were for”'
    claim: 'For the third and fourth plagues the KnoWhy''s table finds no clear connection with a deity'
    key: sc-knowhy-631
    url: 'https://scripturecentral.org/knowhy/why-were-particular-plagues-sent-against-egypt'
    quote: 'No clear connection, but some have suggested that flying insects could allude to the Egyptian god Kheprer'
  - where: 'note 7:5 “What the plagues were for”'
    claim: 'The contest was also for Israel, which had been influenced by Egyptian idolatry'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'The Israelites had been influenced by Egyptian idolatry and were struggling with idolatrous practices. By setting up such a contest, Jehovah would make it clear to the Israelites that he alone was divine'
  - where: 'note 7:5 “What the plagues were for”'
    claim: 'Abinadi says of King Noah what the Lord says here of the Egyptians'
    key: sc-knowhy-516
    url: 'https://scripturecentral.org/knowhy/why-does-the-book-of-mosiah-refer-to-the-exodus-narrative'
    quote: 'Similarly, the Lord stated that both King Noah and the Egyptians “shall know that I am the Lord” (Mosiah 12:3, Exodus 7:5).'
  - where: 'note 7:5 “What the plagues were for”'
    claim: 'King Noah''s answer to Abinadi echoes Pharaoh''s words in Exodus 5:2'
    key: sc-knowhy-731
    url: 'https://scripturecentral.org/knowhy/how-was-abinadi-a-prophet-like-unto-moses'
    quote: 'This challenge precisely echoes “the words first spoken by Pharaoh to Moses and Aaron,” who asked, “Who is the Lord, that I should obey his voice to let Israel go?” (Exodus 5:2).'

  - where: 'note 7:10 “Serpent or crocodile?”'
    claim: 'The word in 7:9–10 and 12 is tannin (Strong''s 8577)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'לְ/תַנִּֽין'
  - where: 'note 7:10 “Serpent or crocodile?”'
    claim: 'The word in 4:3 and in 7:15 is nachash (Strong''s 5175), the ordinary word for a snake'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'לְ/נָחָ֑שׁ'
  - where: 'note 7:10 “Serpent or crocodile?”'
    claim: 'The lexicon glosses tannin as serpent, dragon, sea-monster, and lists Ezekiel 29:3 under it'
    key: bdb
    url: 'https://biblehub.com/hebrew/8577.htm'
    quote: 'noun masculineEzekiel 29:3 serpent, dragon, sea-monster'
  - where: 'note 7:10 “Serpent or crocodile?”'
    claim: 'The lexicon places Exodus 7:9, 10, 12 under the sense “serpent”'
    key: bdb
    url: 'https://biblehub.com/hebrew/8577.htm'
    quote: '1 serpent, Deuteronomy 32:33 (venomous), Psalm 91:13'
  - where: 'note 7:10 “Serpent or crocodile?”'
    claim: 'Tannin is a broad word for reptilian creatures'
    key: sc-knowhy-732
    url: 'https://scripturecentral.org/knowhy/why-does-the-book-of-mormon-mention-dragons'
    quote: 'tannin, is a broad term describing reptilian creatures of various sizes: snakes, crocodiles, and even legendary sea serpents.'
  - where: 'note 7:10 “Serpent or crocodile?”'
    claim: 'The word in Pharaoh''s court likely means crocodile; the text still ties it to the snake of chapter 4; the two creatures carry much the same associations'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'In Pharaoh’s court, the word likely used actually means “crocodile.” It is difficult to know whether the use of crocodile represents a later change or whether it was the original word used.'
  - where: 'note 7:10 “Serpent or crocodile?”'
    claim: 'The crocodile and the snake have similar royal and chaos associations'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'The crocodile has royal and chaos associations that are very similar to that of the snake, so there is no effective difference.'

  - where: 'note 7:11 “Pharaoh’s magicians”'
    claim: 'The Hebrew word means an engraver or writer, used of one who has occult knowledge'
    key: bdb
    url: 'https://biblehub.com/hebrew/2748.htm'
    quote: 'engraver, writer, only in derived sense of one possessed of occult knowledge, diviner, astrologer, magician'
  - where: 'note 7:11 “Pharaoh’s magicians”'
    claim: 'The word is used of Egyptian magicians almost always (the lexicon excepts Daniel 2:2), which suggests an Egyptian origin, though Egyptologists do not agree'
    key: bdb
    url: 'https://biblehub.com/hebrew/2748.htm'
    quote: 'the fact that the word is always applied to Egyptian magicians, except Daniel 2:2 (late), suggests Egyptian origin, but no agreement among Egyptologists'
  - where: 'note 7:11 “Pharaoh’s magicians”'
    claim: 'The same word names the magicians of Genesis 41:8'
    key: bdb
    url: 'https://biblehub.com/hebrew/2748.htm'
    quote: '1 magicians of Egypt Genesis 41:8'
  - where: 'note 7:11 “Pharaoh’s magicians”'
    claim: 'The last verse in Exodus that names the magicians is 9:11'
    key: bdb
    url: 'https://biblehub.com/hebrew/2748.htm'
    quote: 'Exodus 7:22; Exodus 9:11 (twice in verse)'
  - where: 'note 7:11 “Pharaoh’s magicians”'
    claim: 'The word is derived from an Egyptian title borne by priests'
    key: sc-knowhy-731
    url: 'https://scripturecentral.org/knowhy/how-was-abinadi-a-prophet-like-unto-moses'
    quote: 'Exodus 7:11 uses a Hebrew word that derives from the Egyptian hry-tp, a “title often borne by Egyptian priests.”'
  - where: 'note 7:11 “Pharaoh’s magicians”'
    claim: 'Paul names the magicians Jannes and Jambres; the Old Testament does not name them'
    key: bd-jannes-and-jambres
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jannes-and-jambres?lang=eng'
    quote: 'Egyptian magicians who opposed Moses, mentioned by Paul (2 Tim. 3:8), but not referred to in the Old Testament.'
  - where: 'note 7:11 “Pharaoh’s magicians”'
    claim: 'The magicians could imitate but never prevent or remove a plague, and their imitations of the first two likely made things worse'
    key: scripture-helps-ex-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/13-exodus-7-13?lang=eng'
    quote: 'they were never able to prevent or overcome the plagues the Lord sent. In fact, their imitations of the first two plagues likely made circumstances worse for the people of Egypt.'

  - where: 'note 7:12 “The serpent on Pharaoh’s brow”'
    claim: 'The king wore the uraeus, a snake-shaped crownlet believed to spit fire at his enemies'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'the king wore the Uraeus, a snake-shaped crownlet, which was charged with power and “spat fire at the king’s enemies,” embodying “protective power and aggressive intent towards the forces of disorder.”'
  - where: 'note 7:12 “The serpent on Pharaoh’s brow”'
    claim: 'Royal inscriptions speak of the serpent on the king''s brow consuming his enemies'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'wherein Amun-Re says, “My serpent on your brow consumed them [the enemy]”; Ramses II’s Kadesh inscriptions, in Lichtheim, 2:70 which says, “The serpent on my brow felled my foes.”'
  - where: 'note 7:12 “The serpent on Pharaoh’s brow”'
    claim: 'The first inscription quoted is from the annals of Thutmose III'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'See also “The Annals of the Battle at Megiddo by Tuthmose III,” in Lichtheim, Ancient Egyptian Literature, 2:36, wherein Amun-Re says'
  - where: 'note 7:12 “The serpent on Pharaoh’s brow”'
    claim: 'The snake was also a chief symbol of chaos, as were foreigners'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'It is critical to understand that one of the major symbols for chaos was a snake. It is also important to note that another strong symbol for chaos was foreigners.'
  - where: 'note 7:12 “The serpent on Pharaoh’s brow”'
    claim: 'The sign would have been seen as a direct challenge to Pharaoh''s power, and Jehovah came away the victor'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'With all this ideology, Jehovah dared to show his power via a snake and came away from the battle as the victor. Pharaoh’s magicians were unable to overcome Jehovah’s messenger.'
  - where: 'note 7:12 “The serpent on Pharaoh’s brow”'
    claim: 'The sign was a direct challenge to Pharaoh''s power'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'To those with a knowledge of Pharaoh’s ties with snakes, this must have been viewed as a direct challenge to Pharaoh’s power.'
  - where: 'note 7:12 “The serpent on Pharaoh’s brow”'
    claim: 'The serpent represented deity in Egypt, and the sign showed Pharaoh who the true deity was'
    key: ot-minute-ex-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-7-13'
    quote: 'In ancient Egypt, the serpent represented deity. Pharaoh was shown who the true deity was: the Lord.'

  - where: 'note 7:15 “Nine plagues in three rounds”'
    claim: 'One older reading arranges the first nine plagues in three groups of three'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/7.htm'
    quote: 'If we carefully examine the account of these nine penal miracles, we shall find that they are arranged in three groups of three plagues each.'
  - where: 'note 7:15 “Nine plagues in three rounds”'
    claim: 'The first, fourth and seventh are announced in the morning; the third, sixth and ninth come unannounced'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/7.htm'
    quote: 'whilst the third, sixth, and ninth were sent without any such announcement (Exodus 8:16; Exodus 9:8; Exodus 10:21). Again, the first, fourth, and seventh were announced to Pharaoh in the morning'
  - where: 'note 7:15 “Nine plagues in three rounds”'
    claim: 'The magicians are shamed at the third plague and struck at the sixth; Pharaoh breaks off after the ninth'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/7.htm'
    quote: 'were put to shame with their arts by the third, and were compelled to see in it the finger of God (Exodus 8:19), - that they were smitten themselves by the sixth, and were unable to stand before Moses (Exodus 9:11)'
  - where: 'note 7:15 “Nine plagues in three rounds”'
    claim: 'On this reading the first three plagues fell on the whole land and the separation of Israel began with the fourth'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/7.htm'
    quote: 'The first three plagues covered the whole land, and fell upon the Israelites as well as the Egyptians; with the fourth the separation commenced between Egyptians and Israelites'
  - where: 'note 7:15 “Nine plagues in three rounds”'
    claim: 'The tenth plague stands apart as inflicted directly by God'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/7.htm'
    quote: 'The last plague, commonly known as the tenth, which Moses also announced to the king before his departure (Exodus 11:4.), differed from the nine former ones both in purpose and form.'
  - where: 'note 7:15 “Nine plagues in three rounds”'
    claim: 'The text does not say why Pharaoh went out to the water; bathing, devotions to the Nile, and measuring the flood have been suggested'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/7.htm'
    quote: 'for what reason is not stated. Apparently a standing custom is alluded to (cf. Exodus 8:20; also Exodus 2:5): to bathe'
  - where: 'note 7:15 “Nine plagues in three rounds”'
    claim: 'The suggestions include devotions to the Nile and measuring the rise of the river'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/7.htm'
    quote: 'to pay his devotions to the Nile2[118], to ascertain, if it were the time (June) at which the annual inundation was beginning, how much the river had risen, have all been suggested.'

  - where: 'note 7:20 “Why the river first”'
    claim: 'The Nile was Egypt''s sacred river, and the land depended on its yearly flood'
    key: bd-nile
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nile?lang=eng'
    quote: 'The Nile was the sacred river of Egypt, frequently mentioned in the account of the Israelites’ sojourn there. There being practically no rain in Egypt, the land on either bank is dependent upon the annual flood for water'
  - where: 'note 7:20 “Why the river first”'
    claim: 'Egyptian texts put the king in charge of the Nile'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'Elsewhere we are informed that the king is “in charge of the Nile.”[62] Thuthmosis III is described as having the Nile in his service, by which he gives life to Egypt.[63] One pharaoh was told that “the water in the river is drunk when you wish.”'
  - where: 'note 7:20 “Why the river first”'
    claim: 'The Admonitions of Ipuwer describe a river of blood under a weak king or none'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'The Admonitions of Ipuwer tell us that when there is a weak king, or no king, the “river is blood, as one drinks of it one shrinks from people and thirsts for water.”'
  - where: 'note 7:20 “Why the river first”'
    claim: 'The plague showed Jehovah''s superiority in what was counted the king''s own power'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'In contaminating the Nile, Jehovah had shown his superiority in an area that was an integral part of the king’s powers.'
  - where: 'note 7:20 “Why the river first”'
    claim: 'Hapi, god of the Nile, is the deity proposed for this plague'
    key: sc-knowhy-631
    url: 'https://scripturecentral.org/knowhy/why-were-particular-plagues-sent-against-egypt'
    quote: 'Hapi was the god of the Nile, and personified the annual inundation that usually brought life and fertility.'
  - where: 'note 7:20 “Why the river first”'
    claim: 'In years of very high flood the Nile can run red, stink, kill fish and become undrinkable'
    key: sc-knowhy-631
    url: 'https://scripturecentral.org/knowhy/why-were-particular-plagues-sent-against-egypt'
    quote: 'In years of extremely high flooding, due to high rains at the source waters of a major Nile tributary in Ethiopia, algae-rich soil turns the waters blood-red, giving off a putrid smell, killing the fish, and making the waters undrinkable'
  - where: 'note 7:20 “Why the river first”'
    claim: 'A natural means does not make the plagues less than divine signs and wonders'
    key: sc-knowhy-631
    url: 'https://scripturecentral.org/knowhy/why-were-particular-plagues-sent-against-egypt'
    quote: 'This does not mean that the plagues were not divine “signs and wonders,” as the biblical account refers to them (Exodus 7:2).'

  - where: 'explore'
    claim: 'The Church''s footnote at verse 17 joins the turning of water to blood with Revelation 11:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/7?lang=eng'
    quote: 'Rev. 11:6 (5–6).'
  - where: 'explore'
    claim: 'In Revelation the two prophets have power to turn waters to blood'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/11?lang=eng'
    quote: 'and have power over waters to turn them to blood, and to smite the earth with all plagues, as often as they will.'
  - where: 'explore'
    claim: 'The study of the plagues as a contest with Pharaoh treats each plague and then the plagues as a whole'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
