chapter: 3
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'Moses was eighty when he and Aaron spoke to Pharaoh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/7?lang=eng'
    quote: 'And Moses was fourscore years old, and Aaron fourscore and three years old, when they spake unto Pharaoh.'
  - where: 'when'
    claim: 'Stephen puts the bush forty years after the flight to Midian'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/7?lang=eng'
    quote: 'And when forty years were expired, there appeared to him in the wilderness of mount Sina an angel of the Lord in a flame of fire in a bush.'
  - where: 'setting'
    claim: 'The bush is the first recorded appearance of the Lord to Moses'
    key: scripture-helps-ex-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/12-exodus-1-6?lang=eng'
    quote: 'This is the first recorded instance of the Lord appearing to Moses.'
  - where: 'setting'
    claim: 'The scene at the bush runs from 3:1 to 4:17'
    key: sc-knowhy-846
    url: 'https://scripturecentral.org/knowhy/why-did-moses-have-to-walk-a-sacred-path-before-delivering-israel'
    quote: 'he is told to “draw not nigh hither” but to remove his shoes and receive instruction (Exodus 3:1–4:17).'
  - where: 'setting'
    claim: 'The chapter before ends with God remembering the covenant with the patriarchs'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/2?lang=eng'
    quote: 'And God heard their groaning, and God remembered his covenant with Abraham, with Isaac, and with Jacob.'
  - where: 'setting'
    claim: 'Moses fled Egypt and lived in Midian as a shepherd'
    key: sc-knowhy-846
    url: 'https://scripturecentral.org/knowhy/why-did-moses-have-to-walk-a-sacred-path-before-delivering-israel'
    quote: 'The narrative goes on to portray the royal son becoming an exile in Midian, where he lives as a shepherd'
  - where: 'setting'
    claim: 'Moses married Zipporah, a daughter of Jethro, who is also called Reuel'
    key: scripture-helps-ex-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/12-exodus-1-6?lang=eng'
    quote: 'Jethro (also known as Reuel) was the high priest of Midian, a region to the east of Egypt.'
  - where: 'setting'
    claim: 'Moses married Zipporah'
    key: scripture-helps-ex-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/12-exodus-1-6?lang=eng'
    quote: 'Moses married Zipporah, one of Jethro’s daughters.'
  - where: 'setting'
    claim: 'In the rest of the scene Moses fears Israel will not believe him, and signs are given'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'Moses expresses his concern that the children of Israel will not believe that God has appeared to him. God responds by turning a rod into a serpent and back into a rod'
  - where: 'thread'
    claim: 'The Lord’s first words about Israel are a run of verbs: He sees, hears, knows, comes down, delivers; “come down” is an idiom for divine intervention'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'God sees. He listens. He knows. He comes down (an idiom for describing divine intervention in human affairs). [5] He delivers.'
  - where: 'thread'
    claim: 'God does not answer “Who am I?” by speaking of Moses; He answers with His own presence'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'Moses is not equal to the task at hand. But God is, and he promises, “Certainly, I will be with thee” (Exodus 3:12).'
  - where: 'thread'
    claim: 'The verb “I AM” stands four times in verses 12–14, the first translated “I will be”'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'In Exodus 3:12–14, “I AM” is repeated four times in quick succession (translated as “I will be” in verse 12).'
  - where: 'section 4 plain'
    claim: 'Verse 22: the women are to ask, not borrow (see the note on 3:22)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/3?lang=eng'
    quote: '“borrow”: HEB ask.'

  # ---------- notes ----------
  - where: 'note 3:1 “Horeb, the mountain of God”'
    claim: 'Horeb is another name for Mount Sinai, where the law was given'
    key: gs-sinai-mount
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/sinai-mount?lang=eng'
    quote: 'it is also called Mount Horeb (Ex. 3:1). Here God gave His law to Moses for the house of Israel'
  - where: 'note 3:1 “Horeb, the mountain of God”'
    claim: 'The mountain earns the name “mountain of God” by what happens there in this chapter and later'
    key: ot-minute-ex-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-1-6'
    quote: 'The mountain will indeed earn the designation “the mountain of God” as we read about the event about to unfold and about other forthcoming events when Moses was on the mountain.'
  - where: 'note 3:1 “Horeb, the mountain of God”'
    claim: 'Where the mountain was is not known'
    key: ot-minute-ex-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-1-6'
    quote: '(The location of the original mountain is not known.)'

  - where: 'note 3:2 “The angel of the LORD and the LORD in the bush”'
    claim: 'The Joseph Smith Translation of verse 2 has “presence of the Lord” where the King James has “angel of the LORD”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/3?lang=eng'
    quote: 'JST Ex. 3:2 … presence of the Lord …'
  - where: 'note 3:2 “The angel of the LORD and the LORD in the bush”'
    claim: 'In some Old Testament passages the angel of the Lord speaks as God Himself'
    key: bd-angels
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/angels?lang=eng'
    quote: 'In some passages the “angel of the Lord” speaks as the voice of God Himself (Gen. 22:11–12).'
  - where: 'note 3:2 “The angel of the LORD and the LORD in the bush”'
    claim: 'The phrase often means a visible manifestation of God'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'In the Old Testament, the phrase “angel of the Lord” often refers to a “manifestation of God that is visible to the human eye.”'
  - where: 'note 3:2 “The angel of the LORD and the LORD in the bush”'
    claim: 'Stephen says an angel appeared in the bush and that the voice of the Lord then came to Moses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/7?lang=eng'
    quote: 'When Moses saw it, he wondered at the sight: and as he drew near to behold it, the voice of the Lord came unto him,'

  - where: 'note 3:2 “A fire that does not burn up the bush”'
    claim: 'Scripture often describes God’s presence as brightness, glory or fire'
    key: scripture-helps-ex-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/12-exodus-1-6?lang=eng'
    quote: 'Throughout the scriptures, descriptions of God’s presence often emphasize brightness, glory, or fire.'
  - where: 'note 3:2 “A fire that does not burn up the bush”'
    claim: 'One study reads the unconsumed bush as a bush giving off light'
    key: muhlestein-theophanies
    url: 'https://rsc.byu.edu/ascending-mountain-lord/darkness-light-lord-elements-israelite-theophanies'
    quote: 'The description of a bush that burned with fire but was not consumed seems to be a description of a bush that exuded light.'
  - where: 'note 3:2 “A fire that does not burn up the bush”'
    claim: 'On that reading light is what marked God’s presence'
    key: muhlestein-theophanies
    url: 'https://rsc.byu.edu/ascending-mountain-lord/darkness-light-lord-elements-israelite-theophanies'
    quote: 'it is clear that Moses’ theophany was essentially luminous and that light was the element that indicated God’s presence.'
  - where: 'note 3:2 “A fire that does not burn up the bush”'
    claim: 'An older commentary reads the burning thorn-bush as Israel in the affliction of Egypt'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/3.htm'
    quote: 'the burning thorn-bush represented the people of Israel as they were burning in the fire of affliction, the iron furnace of Egypt (Deuteronomy 4:20).'
  - where: 'note 3:2 “A fire that does not burn up the bush”'
    claim: 'The same commentary: the bush is not consumed because Jehovah is in the flame'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/3.htm'
    quote: 'it was not consumed; for in the flame was Jehovah, who chastens His people, but does not give them over unto death (Psalm 118:18).'

  - where: 'note 3:4 “What Moses 1 adds to the call at the bush”'
    claim: 'Moses 1:17 records a commandment given at the bush'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng'
    quote: 'And he also gave me commandments when he called unto me out of the burning bush, saying: Call upon God in the name of mine Only Begotten, and worship me.'
  - where: 'note 3:4 “What Moses 1 adds to the call at the bush”'
    claim: 'The vision of Moses 1 comes after the bush and before the return to Egypt'
    key: sc-knowhy-846
    url: 'https://scripturecentral.org/knowhy/why-did-moses-have-to-walk-a-sacred-path-before-delivering-israel'
    quote: 'This high mountain experience occurs after the burning bush but prior to going into Egypt to deliver Israel.'

  - where: 'note 3:5 “Why Moses takes off his shoes”'
    claim: 'Moses is not yet ready to enter the presence of God'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'In spite of this answer, Moses is not ready to enter into the presence of God.'
  - where: 'note 3:5 “Why Moses takes off his shoes”'
    claim: 'Taking off the sandals is a symbolic gesture of approach that stands for cleansing before entering God’s presence'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'The act is primarily symbolic. It is a gesture of approach that represents the ritual cleansing'
  - where: 'note 3:5 “Why Moses takes off his shoes”'
    claim: 'The plain side of the act: dirt is not tracked into God’s house'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'It goes without saying that “one should not track dirt into God’s house.”'
  - where: 'note 3:5 “Why Moses takes off his shoes”'
    claim: 'It also shows deference and humility, since sandals were worn by people of means'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'because only people of means wore sandals in Egypt and Israel, when Moses removes his sandals he demonstrates deference and humility.'
  - where: 'note 3:5 “Why Moses takes off his shoes”'
    claim: 'The scene stresses distance and preparation before a commission'
    key: sc-knowhy-846
    url: 'https://scripturecentral.org/knowhy/why-did-moses-have-to-walk-a-sacred-path-before-delivering-israel'
    quote: 'Instead of immediate entry, this scene emphasizes distance, preparation, and an initial commissioning.'
  - where: 'note 3:5 “Why Moses takes off his shoes”'
    claim: 'Joshua is given the same command before Jericho'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/5?lang=eng'
    quote: 'Loose thy shoe from off thy foot; for the place whereon thou standest is holy. And Joshua did so.'

  - where: 'note 3:6 “The God of Abraham, Isaac, and Jacob, and the God of the living”'
    claim: 'The title recurs where God promises deliverance and serves as its guarantee'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'This name-title recurs in Exodus 3:15, 16 and 4:5, “precisely in passages in which God promises salvation and deliverance to his people, and serves as a guarantee of that deliverance.”'
  - where: 'note 3:6 “The God of Abraham, Isaac, and Jacob, and the God of the living”'
    claim: 'Jesus quoted the verse to the Sadducees as proof that the dead rise'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/12?lang=eng'
    quote: 'And as touching the dead, that they rise: have ye not read in the book of Moses, how in the bush God spake unto him, saying, I am the God of Abraham, and the God of Isaac, and the God of Jacob?'
  - where: 'note 3:6 “The God of Abraham, Isaac, and Jacob, and the God of the living”'
    claim: 'Nephi says the God of Abraham, Isaac and Jacob is the one who would be crucified'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/19?lang=eng'
    quote: 'the God of Abraham, and of Isaac, and the God of Jacob, yieldeth himself, according to the words of the angel, as a man, into the hands of wicked men, to be lifted up'

  - where: 'note 3:12 “What the token is”'
    claim: '“A token” may be read “the sign”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/3?lang=eng'
    quote: '“a token”: OR the sign.'
  - where: 'note 3:12 “What the token is”'
    claim: 'What the token is, is not clear'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'It is not clear exactly what this token is.'
  - where: 'note 3:12 “What the token is”'
    claim: 'Proposals: the burning bush, the presence of God, the eventual success of the mission'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'She offers several possibilities for the token, including the burning bush, the presence of God, and the eventual success of Moses’ mission.'
  - where: 'note 3:12 “What the token is”'
    claim: '“I will be with thee” is a formula of reassurance used where the risk of failure is great'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'It is most frequently used “when the addressee faces danger or a task where the risk of failure is very great.”'
  - where: 'note 3:12 “What the token is”'
    claim: 'Israel camped before the mount in the third month'
    key: gs-sinai-mount
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/sinai-mount?lang=eng'
    quote: 'A mountain on the Sinai Peninsula near which Moses and the Israelites camped three months after their exodus from Egypt'

  - where: 'note 3:14 “What the words I AM THAT I AM say”'
    claim: 'The Hebrew of the phrase, and that the King James translates it “I AM THAT I AM”'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'God responds, “’ehyeh ’ăšer ’ehyeh,” translated in the King James Version as “I AM THAT I AM” (Exodus 3:14).'
  - where: 'note 3:14 “What the words I AM THAT I AM say”'
    claim: 'The word in verse 14 is the first-person imperfect of the verb “to be” (Strong’s 1961)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'אֶֽהְיֶ֖ה'
  - where: 'note 3:14 “What the words I AM THAT I AM say”'
    claim: 'The same form stands in verse 12, “I will be with thee”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'אֶֽהְיֶ֣ה'
  - where: 'note 3:14 “What the words I AM THAT I AM say”'
    claim: 'The verb is repeated four times in verses 12–14 and is translated “I will be” in verse 12'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'In Exodus 3:12–14, “I AM” is repeated four times in quick succession (translated as “I will be” in verse 12).'
  - where: 'note 3:14 “What the words I AM THAT I AM say”'
    claim: 'A modern translation has “I am who I am”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%203%3A12-22&version=NRSVUE'
    quote: 'God said to Moses, “I am who I am.”'
  - where: 'note 3:14 “What the words I AM THAT I AM say”'
    claim: 'The same translation notes two other renderings'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%203%3A12-22&version=NRSVUE'
    quote: '3.14 Or I am what I am or I will be what I will be'
  - where: 'note 3:14 “What the words I AM THAT I AM say”'
    claim: 'The Septuagint (Brenton’s English) renders the phrase “I am THE BEING”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/exodus/3.htm'
    quote: 'And God spoke to Moses, saying, I am THE BEING; and he said, Thus shall ye say to the children of Israel, THE BEING has sent me to you.'
  - where: 'note 3:14 “What the words I AM THAT I AM say”'
    claim: 'The name YHWH, transliterated Jehovah, is based on the verb “to be” and can mean “He is” or, in the first person, “I am”'
    key: scripture-helps-ex-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/12-exodus-1-6?lang=eng'
    quote: 'The Hebrew name for the God of Israel is YHWH, a word that is traditionally transliterated as Jehovah in English. This name is based on the verb “to be” and can mean “He is,” or, in the first person, “I am.”'
  - where: 'note 3:14 “What the words I AM THAT I AM say”'
    claim: 'In the ancient world a name was held to reveal a person’s nature'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'In the ancient world, one’s name was far more than an appellation. It revealed the very essence and nature of a person.'
  - where: 'note 3:14 “What the words I AM THAT I AM say”'
    claim: 'The name Jehovah denotes “the eternal I Am”'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'The covenant or proper name of the God of Israel. It denotes the “Unchangeable One,” “the eternal I Am” (Ex. 6:3; Ps. 83:18; Isa. 12:2; 26:4).'
  - where: 'note 3:14 “What the words I AM THAT I AM say”'
    claim: 'One reading quoted in a Latter-day Saint study: the repeated verb asserts God’s presence with Israel in Egypt'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'However absent he may have seemed to the oppressed Israelites in Egypt, . . . his Is-ness means Presence.'
  - where: 'note 3:14 “What the words I AM THAT I AM say”'
    claim: 'The same study gives a second reading (the Creator) and says that on either the phrase reveals something of God’s nature'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'Whether we understand ’ehyeh ’ăšer ’ehyeh to be a reference to Jehovah’s role as creator, with all the power that entails, or a theological statement of his constant, unfailing presence, the name reveals something of the nature of God.'

  - where: 'note 3:14 “What the words I AM THAT I AM say”'
    claim: 'The phrase of verse 14 may not be a name at all'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'It is possible that ’ehyeh ’ăšer ’ehyeh is not a name at all.'

  - where: 'note 3:14 “The LORD who speaks is Jesus Christ”'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary (see Mosiah 3:8; 15:1; 3 Ne. 15:1–5; D&C 110:1–10).'
  - where: 'note 3:14 “The LORD who speaks is Jesus Christ”'
    claim: 'The King James Version prints the name as Lord or God in small capitals'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'In the KJV, the Jewish custom has been followed, and the name is generally denoted by Lord or God, printed in small capitals.'
  - where: 'note 3:14 “The LORD who speaks is Jesus Christ”'
    claim: 'The Greek words for “I AM” are found in fourteen other places in John, identifying Jesus as the God of the Old Testament'
    key: sc-knowhy-664
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-use-passover-imagery-in-his-bread-of-life-sermon'
    quote: 'This same expression was spoken by Jehovah to Moses when He declared “I AM THAT I AM” (Exodus 3:14) and is found fourteen other places throughout John’s Gospel and in a few more locations in the other three Gospels, identifying Jesus as the God of the Old Testament.'
  - where: 'note 3:14 “The LORD who speaks is Jesus Christ”'
    claim: 'The Lord introduces Himself in the Doctrine and Covenants as the Great I Am'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/29?lang=eng'
    quote: 'Listen to the voice of Jesus Christ, your Redeemer, the Great I Am, whose arm of mercy hath atoned for your sins;'
  - where: 'note 3:14 “The LORD who speaks is Jesus Christ”'
    claim: 'The risen Lord told the Nephites that He gave the law and covenanted with Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/15?lang=eng'
    quote: 'Behold, I am he that gave the law, and I am he who covenanted with my people Israel'

  - where: 'note 3:18 “Why the request is only for three days”'
    claim: 'An older commentary: the first demand was small because God made His purposes known step by step'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/3.htm'
    quote: 'this first demand arose from the desire on the part of God to make known His purposes concerning Israel only step by step'
  - where: 'note 3:18 “Why the request is only for three days”'
    claim: 'The same commentary prints the view that the moderate request put Pharaoh to the proof and left his refusal without excuse'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/3.htm'
    quote: 'It served to put Pharaoh to the proof. God did not come forth with His whole plan and desire at first, that his obduracy might appear so much the more glaring, and find no excuse in the greatness of the requirement.'
  - where: 'note 3:18 “Why the request is only for three days”'
    claim: 'Moses and Aaron make this request of Pharaoh in chapter 5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/5?lang=eng'
    quote: 'let us go, we pray thee, three days’ journey into the desert, and sacrifice unto the Lord our God'

  - where: 'note 3:22 “To borrow here is to ask”'
    claim: 'The Hebrew behind “borrow” is “ask”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/3?lang=eng'
    quote: '“borrow”: HEB ask.'
  - where: 'note 3:22 “To borrow here is to ask”'
    claim: 'The verb in verse 22 is sha’al (Strong’s 7592)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וְ/שָׁאֲלָ֨ה'
  - where: 'note 3:22 “To borrow here is to ask”'
    claim: 'The lexicon: the verb can mean borrow, and many take it so here, but it is not clear that temporary use was pretended'
    key: bdb
    url: 'https://biblehub.com/hebrew/7592.htm'
    quote: 'so also (according to many), with accusative of thing Exodus 3:22( + מִן person), Exodus 11:2; Exodus 12:35 (both + מֵאֵת person; all E), — it is, however, not clear that there was any pretext of mere temporary use'
  - where: 'note 3:22 “To borrow here is to ask”'
    claim: 'A modern translation has “ask” and “plunder”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%203%3A19-22&version=NRSVUE'
    quote: 'each woman shall ask her neighbor and any woman living in the neighbor’s house for jewelry of silver and of gold and clothing, and you shall put them on your sons and on your daughters; so you shall plunder the Egyptians.'
