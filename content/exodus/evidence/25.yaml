chapter: 25
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'The command to build the sanctuary was given during Moses’s forty days on Sinai'
    key: scripture-helps-ex-35
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/16-exodus-35-40-leviticus-1-4-16-19?lang=eng'
    quote: 'During the 40 days Moses was on Mount Sinai, the Lord commanded him to build a sanctuary, or tabernacle, so the Lord could “dwell among” His people.'
  - where: 'when'
    claim: 'Moses was in the mount forty days and forty nights'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/24?lang=eng'
    quote: 'And Moses went into the midst of the cloud, and gat him up into the mount: and Moses was in the mount forty days and forty nights.'
  - where: 'setting'
    claim: 'The instructions are in chapters 25–31, the making in 35–39, the dedication in 40'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'The construction of this tabernacle is described in Exodus 25–31, with the actual construction in chapters 35–39 and the consecration, or dedication, of the structure in chapter 40.'
  - where: 'setting'
    claim: 'Thirteen chapters, almost a third of the book, are given to the tabernacle'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'A total of thirteen chapters in Exodus are devoted to the tabernacle structure (or almost one third of the total chapters for the book).'
  - where: 'setting'
    claim: 'The tabernacle was the center of Israel’s worship until Solomon’s temple'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'The center place of Israel’s worship activities during the wanderings and until the building of the temple in Solomon’s day.'
  - where: 'setting'
    claim: 'The altar of incense, which belongs with the table and lampstand, is not described until chapter 30'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'It is interesting that Exodus does not describe the altar of incense (the next logical item to cover as it is closest to the ark of the covenant) until Exodus 30:1–10.'
  - where: 'setting'
    claim: 'The altar of incense stood in the holy place with the candlestick and the table'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'In the outer compartment (20 cubits by 10), called the Holy Place, were three things: (1) In the middle, before the veil and before the mercy seat (Ex. 30:6), stood the altar of incense'
  - where: 'setting'
    claim: 'Israel left Egypt with silver, gold, and raiment'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/12?lang=eng'
    quote: 'they borrowed of the Egyptians jewels of silver, and jewels of gold, and raiment'
  - where: 'setting'
    claim: 'Stephen cites the pattern shown to Moses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/7?lang=eng'
    quote: 'Our fathers had the tabernacle of witness in the wilderness, as he had appointed, speaking unto Moses, that he should make it according to the fashion that he had seen.'
  - where: 'setting'
    claim: 'Hebrews quotes Exodus 25:40'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/8?lang=eng'
    quote: 'for, See, saith he, that thou make all things according to the pattern shewed to thee in the mount.'
  - where: 'thread'
    claim: 'The instructions begin with the most sacred furnishing and move outward to the court'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'He started with the most sacred aspect of the tabernacle, the ark of the covenant in the Holy of Holies (Exodus 25:10–22), and then worked out to the least sacred, the altar of sacrifice in the outer courtyard (Exodus 27:1–8).'
  - where: 'thread'
    claim: 'The furnishings of the holy place each had a domestic function'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'all three either made of pure gold or covered in gold (see Exodus 26:33–35); … and while all three may have had cosmic significance it is also noteworthy that each served a mundane, domestic function.'
  - where: 'thread'
    claim: 'The people later gave more than was needed'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'Exodus 36:5–7 describes how the people contributed so much to the building of the tabernacle that the craftsmen asked Moses to turn the people away.'
  - where: 'thread'
    claim: 'The willing offering is brought in chapter 35'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/35?lang=eng'
    quote: 'And they came, every one whose heart stirred him up, and every one whom his spirit made willing, and they brought the Lord’s offering to the work of the tabernacle of the congregation'
  - where: 'thread'
    claim: 'The design was the Lord’s and not man’s'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'The Lord revealed here that the Israelites were to follow the prescribed “pattern” to build the structure. It was not the design of men, but of the Lord.'

  # ---------- plain-words renderings ----------
  - where: 'section 1 plain'
    claim: 'Brass is bronze; the dyed stuffs are yarn; the skins are leather; shittim is acacia'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2025&version=NRSVUE'
    quote: 'gold, silver, and bronze, 4 blue, purple, and crimson yarns and fine linen, goats’ hair, 5 tanned rams’ skins, fine leather, acacia wood'
  - where: 'section 1 plain'
    claim: '“Instruments” are furniture or utensils'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/25?lang=eng'
    quote: 'OR furniture, equipment, utensils.'
  - where: 'section 2 plain'
    claim: 'The “crown” is a molding'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'The crown likely does not refer to a wearable crown … but instead to crown molding, such as the molding that crowned the top of the ark.'
  - where: 'section 2 plain'
    claim: 'The cherubim are made as part of the mercy seat'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/25?lang=eng'
    quote: 'OR as part of it.'
  - where: 'section 3 plain'
    claim: 'The border is a rim a handbreadth wide; the vessels are for pouring drink offerings'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2025&version=NRSVUE'
    quote: 'You shall make around it a rim a handbreadth wide and a molding of gold around the rim.'
  - where: 'section 3 plain'
    claim: '“Covers” are jars, and “to cover withal” is for pouring libations'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/25?lang=eng'
    quote: 'HEB wherewith to pour libations.'
  - where: 'section 3 plain'
    claim: 'Shewbread is the bread of the presence'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/25?lang=eng'
    quote: 'HEB bread of faces, or bread of the presence.'
  - where: 'section 4 plain'
    claim: 'The candlestick is a lampstand with cups shaped like almond blossoms, of one piece'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2025&version=NRSVUE'
    quote: 'three cups shaped like almond blossoms, each with calyx and petals, on one branch'
  - where: 'section 4 plain'
    claim: 'The ornaments are almonds, buds, and flowers'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'Each branch (minus the center branch) had three sets of almonds, buds, and flowers on the arm.'
  - where: 'section 4 plain'
    claim: 'The lamps are set up; “the same” means one piece'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/25?lang=eng'
    quote: 'OR one piece.'

  # ---------- note 25:5 ----------
  - where: 'note 25:5 “Bronze, acacia, and a leather no one can name”'
    claim: 'A modern translation reads bronze, fine leather, and acacia wood'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2025&version=NRSVUE'
    quote: 'gold, silver, and bronze, 4 blue, purple, and crimson yarns and fine linen, goats’ hair, 5 tanned rams’ skins, fine leather, acacia wood'
  - where: 'note 25:5 “Bronze, acacia, and a leather no one can name”'
    claim: 'The Church’s footnote gives acacia for shittim'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/25?lang=eng'
    quote: 'OR acacia.'
  - where: 'note 25:5 “Bronze, acacia, and a leather no one can name”'
    claim: 'Acacia resists rot; the Hebrew word for the skins is lost; brass is more likely bronze'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'The “badgers’ skin” is better translated as just some sort of durable leather, as the original Hebrew word has been lost over the centuries. Shittim wood (better translated as “acacia”) is a hardy wood that is very resistant to rot and decay.'
  - where: 'note 25:5 “Bronze, acacia, and a leather no one can name”'
    claim: 'The Septuagint has “blue skins” and “incorruptible wood”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/exodus/25.htm'
    quote: 'skins dyed red, and blue skins, and incorruptible wood'
  - where: 'note 25:5 “Bronze, acacia, and a leather no one can name”'
    claim: 'The lexicon defines the word as a kind of leather and suggests the dugong'
    key: bdb
    url: 'https://biblehub.com/hebrew/8476.htm'
    quote: 'a kind of leather or skin, and perhaps the animal yielding it (probably the dugong'
  - where: 'note 25:5 “Bronze, acacia, and a leather no one can name”'
    claim: 'The materials are listed in descending order of value; gold is often seen as a symbol of divinity'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'The various items were listed in descending order of value. Gold was the costliest and is often seen as a symbol of divinity, royalty, and wealth.'
  - where: 'note 25:5 “Bronze, acacia, and a leather no one can name”'
    claim: 'The fabrics too are listed in descending order of value'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'Like the metals, the colors of fabric were listed in order of descending value.'
  - where: 'note 25:5 “Bronze, acacia, and a leather no one can name”'
    claim: 'The text gives no meaning for the colors; they mark the entrances and the priest’s clothing'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'Any explicit meaning behind this selection of colors is unknown since the text gives no indication of their significance, but they clearly distinguished these spaces from other spaces in the tabernacle.'
  - where: 'note 25:5 “Bronze, acacia, and a leather no one can name”'
    claim: 'The same colors were dominant in the priest’s clothing'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'Blue, scarlet, and purple were also dominant in the clothing worn by the priest.'

  # ---------- note 25:8 ----------
  - where: 'note 25:8 “A house for the LORD in the camp”'
    claim: 'The tabernacle was a portable temple'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'The tabernacle was in fact a portable temple.'
  - where: 'note 25:8 “A house for the LORD in the camp”'
    claim: 'Like modern temples it was the house of the Lord'
    key: scripture-helps-ex-35
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/16-exodus-35-40-leviticus-1-4-16-19?lang=eng'
    quote: 'Like modern temples, the tabernacle was the house of the Lord.'
  - where: 'note 25:8 “A house for the LORD in the camp”'
    claim: 'Three sections, each nearer to God’s presence'
    key: scripture-helps-ex-35
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/16-exodus-35-40-leviticus-1-4-16-19?lang=eng'
    quote: 'The tabernacle was divided into three main sections: the outer courtyard, the holy place, and the most holy place (also called the Holy of Holies). Each space represented an increasing proximity to God’s holy presence.'
  - where: 'note 25:8 “A house for the LORD in the camp”'
    claim: 'Sanctuary is literally “a holiness”; the verb dwell implies a nonpermanent residence'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'God simply states, “And let them make me a sanctuary [literally, “a holiness”]; that I may dwell among them.” Though the English translation suggests that the edifice was meant to be the actual dwelling place of God, the Hebrew term shakan, translated as “dwell,” implies a nonpermanent residence.'
  - where: 'note 25:8 “A house for the LORD in the camp”'
    claim: 'The tabernacle is better seen as a meeting place'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'it may be more accurate to view the tabernacle as more of a meeting place rather than as a permanent dwelling place of God.'
  - where: 'note 25:8 “A house for the LORD in the camp”'
    claim: 'God’s desire to be among His people is unlike the religions around Israel'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'demonstrates a mortal-divine relationship not existing in other religions of the ancient Near East.'
  - where: 'note 25:8 “A house for the LORD in the camp”'
    claim: 'The Hebrew word for tabernacle means dwelling-place'
    key: bdb
    url: 'https://biblehub.com/hebrew/4908.htm'
    quote: 'noun masculine Exodus 26:6 dwelling-place'
  - where: 'note 25:8 “A house for the LORD in the camp”'
    claim: 'The noun is from the verb dwell'
    key: bdb
    url: 'https://biblehub.com/hebrew/4908.htm'
    quote: 'from shakan'
  - where: 'note 25:8 “A house for the LORD in the camp”'
    claim: 'The verb “dwell” in verse 8 (Strong’s 7931)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וְ/שָׁכַנְתִּ֖י'
  - where: 'note 25:8 “A house for the LORD in the camp”'
    claim: 'The noun “tabernacle” in verse 9 (Strong’s 4908)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'הַ/מִּשְׁכָּ֔ן'
  - where: 'note 25:8 “A house for the LORD in the camp”'
    claim: 'The purpose is restated at 29:45'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/29?lang=eng'
    quote: 'And I will dwell among the children of Israel, and will be their God.'
  - where: 'note 25:8 “A house for the LORD in the camp”'
    claim: 'The mercy seat was regarded as the earthly dwelling place of Jehovah'
    key: bd-ark-of-the-covenant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ark-of-the-covenant?lang=eng'
    quote: 'the Mercy Seat which formed its covering was regarded as the earthly dwelling place of Jehovah (Ex. 25:22).'

  # ---------- note 25:9 ----------
  - where: 'note 25:9 “A pattern shown on the mountain”'
    claim: 'The Hebrew word means construction, pattern, figure'
    key: bdb
    url: 'https://biblehub.com/hebrew/8403.htm'
    quote: 'noun feminine construction, pattern, figure'
  - where: 'note 25:9 “A pattern shown on the mountain”'
    claim: 'The same word is used of David’s pattern in 1 Chronicles 28:19'
    key: bdb
    url: 'https://biblehub.com/hebrew/8403.htm'
    quote: 'absolute 1 Chronicles 28:19; construct Exodus 25:9 (twice in verse)'
  - where: 'note 25:9 “A pattern shown on the mountain”'
    claim: 'The pattern shown to Moses is a recurrent theme of the building section'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'The building section within the larger cycle, furthermore, is itself unified by the recurrent theme that Moses was shown the “pattern”'
  - where: 'note 25:9 “A pattern shown on the mountain”'
    claim: 'Hebrews reads the tabernacle as an example and shadow of heavenly things'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/8?lang=eng'
    quote: 'Who serve unto the example and shadow of heavenly things, as Moses was admonished of God when he was about to make the tabernacle'
  - where: 'note 25:9 “A pattern shown on the mountain”'
    claim: 'The holy places made with hands are figures of the true, which is heaven itself'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/9?lang=eng'
    quote: 'For Christ is not entered into the holy places made with hands, which are the figures of the true; but into heaven itself'
  - where: 'note 25:9 “A pattern shown on the mountain”'
    claim: 'David received the pattern of the temple from the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/28?lang=eng'
    quote: 'made me understand in writing by his hand upon me, even all the works of this pattern.'

  # ---------- note 25:10 ----------
  - where: 'note 25:10 “The ark of the covenant”'
    claim: 'What the ark was and how Israel regarded it'
    key: bd-ark-of-the-covenant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ark-of-the-covenant?lang=eng'
    quote: 'an oblong chest of acacia or shittim wood overlaid with gold, 2½ cubits long, 1½ broad and high, made by Moses at God’s command (Ex. 25). It was the oldest and most sacred of the religious symbols of the Israelites'
  - where: 'note 25:10 “The ark of the covenant”'
    claim: 'John saw the ark in his vision of heaven'
    key: bd-ark-of-the-covenant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ark-of-the-covenant?lang=eng'
    quote: 'It was seen by John in his vision of heaven (Rev. 11:19).'
  - where: 'note 25:10 “The ark of the covenant”'
    claim: 'The ark was the only furniture in the Holy of Holies'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'The Holy of Holies contained only one piece of furniture: the Ark of the Covenant, or the Ark of the Testimony (Ex. 25:22).'
  - where: 'note 25:10 “The ark of the covenant”'
    claim: 'The Testimony is the two tables of stone, and the ark’s names come from them'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: '(the two tables of stone) (Ex. 25:21; 31:18). From these the ark got both its names.'
  - where: 'note 25:10 “The ark of the covenant”'
    claim: 'A cubit is about 17½ inches'
    key: bd-weights-and-measures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/weights-and-measures?lang=eng'
    quote: 'Cubit. The distance from the elbow to the tip of the finger, normally about 17½ inches, or 444.25 millimeters'
  - where: 'note 25:10 “The ark of the covenant”'
    claim: 'The ark’s size in feet'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'This would mean that the ark chest would be about 3.75 feet (1.1 meters) long by 2.25 feet (0.7 meters) deep and tall.'
  - where: 'note 25:10 “The ark of the covenant”'
    claim: 'The crown is a crown molding'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'but instead to crown molding, such as the molding that crowned the top of the ark.'
  - where: 'note 25:10 “The ark of the covenant”'
    claim: 'Only the ark kept its poles in the rings, likely so that no one touched it'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'only the ark was to have the poles kept in the rings at all times. This was likely because no one was to touch the ark itself due to its sacred nature.'
  - where: 'note 25:10 “The ark of the covenant”'
    claim: 'The word for testimony indicates a relationship between two parties'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'The Hebrew term translated as “testimony” in this case indicates the establishment of a relationship between two parties.'
  - where: 'note 25:10 “The ark of the covenant”'
    claim: 'Those who carried the holy things were not to touch them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/4?lang=eng'
    quote: 'the sons of Kohath shall come to bear it: but they shall not touch any holy thing, lest they die.'

  # ---------- note 25:17 ----------
  - where: 'note 25:17 “The mercy seat, the place of atonement”'
    claim: 'The mercy seat was the golden covering of the ark'
    key: bd-mercy-seat
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/mercy-seat?lang=eng'
    quote: 'The golden covering of the Ark of the Covenant in the Holy of Holies.'
  - where: 'note 25:17 “The mercy seat, the place of atonement”'
    claim: 'The Church’s footnote: Hebrew atonement-cover, a golden slab the size of the ark’s top'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/25?lang=eng'
    quote: 'HEB atonement-cover. Note that it was a golden slab of the same dimension as the top of the ark. A winged cherub was placed on each end.'
  - where: 'note 25:17 “The mercy seat, the place of atonement”'
    claim: 'Tyndale coined “mercy seat”; the word shares its root with the verb for atonement'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'William Tindale coined the term mercy seat in his translation of the English text of the Bible. … The word has the same root as the word atonement (kaphar in Hebrew)'
  - where: 'note 25:17 “The mercy seat, the place of atonement”'
    claim: 'A modern translation reads “cover”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2025&version=NRSVUE'
    quote: 'Then you shall make a cover of pure gold; two cubits and a half shall be its length and a cubit and a half its width.'
  - where: 'note 25:17 “The mercy seat, the place of atonement”'
    claim: 'The lexicon gives “propitiatory” and derives it from the verb in the sense cover over sin'
    key: bdb
    url: 'https://biblehub.com/hebrew/3727.htm'
    quote: 'noun propitiatory, late technical word from … cover over sin: the older explanation cover, lid has no justification in usage'
  - where: 'note 25:17 “The mercy seat, the place of atonement”'
    claim: 'The Septuagint reads “a propitiatory, a lid”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/exodus/25.htm'
    quote: 'And thou shalt make a propitiatory, a lid of pure gold; the length of two cubits and a half, and the breadth of a cubit and a half.'
  - where: 'note 25:17 “The mercy seat, the place of atonement”'
    claim: 'The mercy seat served as the altar of the highest atonement, on the Day of Atonement'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'It served, with the ark beneath, as an altar on which the highest atonement known to the Jewish law was effected. On it was sprinkled the blood of the sin offering of the Day of Atonement (Lev. 16:14–15).'
  - where: 'note 25:17 “The mercy seat, the place of atonement”'
    claim: 'The verb began with the sense of rubbing or wiping and came to mean purge, purify'
    key: spackman-atonement
    url: 'https://byustudies.byu.edu/article/the-israelite-roots-of-atonement-terminology'
    quote: 'Linguistically, kippēr began with very concrete meaning, something like “to rub, wipe,” which in a ritual setting led to “purge, purify,”'
  - where: 'note 25:17 “The mercy seat, the place of atonement”'
    claim: 'Purging the sanctuary maintained the divine presence; the roots of at-one-ment were already there'
    key: spackman-atonement
    url: 'https://byustudies.byu.edu/article/the-israelite-roots-of-atonement-terminology'
    quote: 'purging it of that sin and pollution had the effect of repairing or maintaining the deity’s presence and blessing. In a sense, then, while the term was more limited, the roots of atonement as bringing two back together, healing a rift, were already present.'
  - where: 'note 25:17 “The mercy seat, the place of atonement”'
    claim: 'The English word atonement is built from its parts'
    key: spackman-atonement
    url: 'https://byustudies.byu.edu/article/the-israelite-roots-of-atonement-terminology'
    quote: 'atonement was coined as an etymological neologism, built from the meaning of its English parts, literally “at-one-ment,”'

  # ---------- note 25:18 ----------
  - where: 'note 25:18 “The cherubim”'
    claim: 'Cherubim represent heavenly creatures of unknown form'
    key: bd-cherubim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/cherubim?lang=eng'
    quote: 'Figures representing heavenly creatures, the exact form being unknown.'
  - where: 'note 25:18 “The cherubim”'
    claim: 'Their first function is to guard selected space'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'Their first function is to guard selected space. In Genesis, following the exile of Adam and Eve, cherubim are placed before the tree of life'
  - where: 'note 25:18 “The cherubim”'
    claim: 'Their second function is movement: God sits between them and they bear Him'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'Another function associated with the cherubim is that of movement. First Samuel 4:4 is the first reference to speak of God as sitting between cherubim, … where the cherubim are depicted not only as beings that surround God but also as those that bear him from place to place.'
  - where: 'note 25:18 “The cherubim”'
    claim: 'The inner curtains were embroidered with cherubim'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'made of fine twined linen, and blue and purple and scarlet, embroidered with figures of cherubim (Ex. 26:1).'
  - where: 'note 25:18 “The cherubim”'
    claim: 'The mercy seat was God’s throne in Israel'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'It was God’s throne in Israel. Compare the phrase “The Lord God of Israel, which sitteth upon (or dwelleth between) the cherubim” (1 Sam. 4:4).'
  - where: 'note 25:18 “The cherubim”'
    claim: 'Wings symbolically represent the power to move and to act'
    key: ot-manual-ex-25-30
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-25-30-35-40-the-house-of-the-lord-in-the-wilderness?lang=eng'
    quote: 'Another revelation indicates, however, that wings symbolically represent the power to move and to act (see D&C 77:4).'
  - where: 'note 25:18 “The cherubim”'
    claim: 'The Church’s footnote on “of the mercy seat”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/25?lang=eng'
    quote: 'OR as part of it.'

