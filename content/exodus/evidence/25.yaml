  - where: 'note 25:30 “The bread of the Presence”'
    claim: 'Twelve cakes in two piles, with frankincense, changed each Sabbath and eaten by the priests'
    key: bd-shewbread
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shewbread?lang=eng'
    quote: 'The name given to 12 unleavened cakes placed in two piles on the Table of Shewbread … Frankincense was put upon each row (Lev. 24:7). The shewbread was changed every Sabbath day and the old loaves were eaten by the priests in a holy place (Lev. 24:9).'
  - where: 'note 25:30 “The bread of the Presence”'
    claim: 'What the shewbread signified'
    key: bd-shewbread
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shewbread?lang=eng'
    quote: 'In the shewbread the 12 tribes were perpetually presented before God; yet it was wholly consumed by man; thus it provided both a sacrifice and a communion.'
