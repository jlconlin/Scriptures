  # ---------- note 25:31 ----------
  - where: 'note 25:31 “The lampstand and its almond blossoms”'
    claim: 'The candlestick is properly a menorah or lampstand; its form'
    key: bd-candlestick
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/candlestick?lang=eng'
    quote: '(More properly menorah, or lampstand.) Made for the tabernacle (Ex. 25:31–37; 37:17–24), placed on the south side, opposite the table of shewbread. From the main vertical stem three pairs of branches extended, curving upward so that all seven lamps on the ends were at the same level.'
  - where: 'note 25:31 “The lampstand and its almond blossoms”'
    claim: 'A modern translation: cups shaped like almond blossoms'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2025&version=NRSVUE'
    quote: 'three cups shaped like almond blossoms, each with calyx and petals, on one branch'
  - where: 'note 25:31 “The lampstand and its almond blossoms”'
    claim: 'A talent is about 75.6 pounds'
    key: bd-weights-and-measures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/weights-and-measures?lang=eng'
    quote: 'equivalent to 3,000 shekels (see Ex. 38:25, 26); about 75.6 pounds, or 34.272 kilograms.'
  - where: 'note 25:31 “The lampstand and its almond blossoms”'
    claim: 'The lampstand was the only light in the tabernacle'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'The main purpose of the menorah, or lamp stand, was to give light to the Holy Place. In fact, this was the only light in the tabernacle'
  - where: 'note 25:31 “The lampstand and its almond blossoms”'
    claim: 'The lamps burned olive oil and were tended evening and morning'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'Pure olive oil beaten was burned in the lamps (Ex. 27:20–21; Lev. 24:2). Aaron lit the lamps at evening and dressed them in the morning (Ex. 30:8; Lev. 24:3).'
  - where: 'note 25:31 “The lampstand and its almond blossoms”'
    claim: 'Jewish tradition associates the menorah with the burning bush and the tree of life'
    key: ensign-menorah-2018
    url: 'https://www.churchofjesuschrist.org/study/ensign/2018/12/the-menorah?lang=eng'
    quote: 'In Jewish tradition, the menorah, with its treelike form and ornamentation, is often associated with the burning bush as well as the tree of life.'
  - where: 'note 25:31 “The lampstand and its almond blossoms”'
    claim: 'Seven often represents wholeness or perfection'
    key: ensign-menorah-2018
    url: 'https://www.churchofjesuschrist.org/study/ensign/2018/12/the-menorah?lang=eng'
    quote: 'The number seven often represents wholeness, completeness, or perfection.'
  - where: 'note 25:31 “The lampstand and its almond blossoms”'
    claim: 'The menorah as a stylized tree of life'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'It also appears evident that the menorah was a stylized tree of life (cf. Exodus 25.31-40).'
  - where: 'note 25:31 “The lampstand and its almond blossoms”'
    claim: 'The menorah as a representation of the tree of life'
    key: sc-knowhy-702
    url: 'https://scripturecentral.org/knowhy/how-do-johns-seven-letters-reflect-the-ancient-temple'
    quote: 'the menorah served as a representation of the tree of life with its seven branches (see Exodus 25:31–37).'
  - where: 'note 25:31 “The lampstand and its almond blossoms”'
    claim: 'Whatever it represented, its function was to give light'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'while the menorah may have represented the cosmic tree, functionally its purpose was to provide light within the room like any other lamp.'
  - where: 'note 25:31 “The lampstand and its almond blossoms”'
    claim: 'Light is a symbol of Jesus Christ'
    key: scripture-helps-ex-35
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/16-exodus-35-40-leviticus-1-4-16-19?lang=eng'
    quote: 'Light is a symbol of Jesus Christ, who is “the light of the world.”'
  - where: 'note 25:31 “The lampstand and its almond blossoms”'
    claim: 'John’s vision of the candlesticks'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/1?lang=eng'
    quote: 'the seven candlesticks which thou sawest are the seven churches.'

