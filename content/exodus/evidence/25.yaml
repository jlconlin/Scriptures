    claim: 'The Lord’s lesson from David and the shewbread'
    key: bd-shewbread
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shewbread?lang=eng'
    quote: 'the Lord drew from this incident the lesson that the law of charity overrides every ritual law (Matt. 12:4; Mark 2:26; Luke 6:4).'
  - where: 'note 25:30 “The bread of the Presence”'
    claim: 'The table was functionally a table with food on it'
