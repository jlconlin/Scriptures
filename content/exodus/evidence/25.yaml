    quote: 'the table of the presence, so named for the bread that was placed on the table and replaced every Sabbath, was, functionally, simply a table with food on it.'
  - where: 'note 25:30 “The bread of the Presence”'
    claim: 'The furnishings of the holy place are associated with hospitality'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'Another thing these items have in common is their association with rites of hospitality.'
  - where: 'note 25:30 “The bread of the Presence”'
    claim: 'The priests’ meal as Israel breaking bread with God'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
