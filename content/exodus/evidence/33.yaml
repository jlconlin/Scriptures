chapter: 33
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'Moses returns to the LORD on the day after the calf'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/32?lang=eng'
    quote: 'And the Lord plagued the people, because they made the calf, which Aaron made.'
  - where: 'when'
    claim: 'Moses goes up the mount again with the second tables'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'and Moses rose up early in the morning, and went up unto mount Sinai'
  - where: 'setting'
    claim: 'Moses broke the tables'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/32?lang=eng'
    quote: 'and he cast the tables out of his hands, and brake them beneath the mount.'
  - where: 'setting'
    claim: 'About three thousand men died'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/32?lang=eng'
    quote: 'and there fell of the people that day about three thousand men.'
  - where: 'setting'
    claim: 'Chapter 32 ends with an angel promised and the sin still to be visited'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/32?lang=eng'
    quote: 'behold, mine Angel shall go before thee: nevertheless in the day when I visit I will visit their sin upon them.'
  - where: 'setting'
    claim: 'Exodus 32–34 tell of the renewal of the covenant after the golden calf'
    key: hardison-theophany
    url: 'https://rsc.byu.edu/ascending-mountain-lord/theophany-sinai'
    quote: 'the renewal of the covenant after the rebellion of the golden calf (Exodus 32–34)'
  - where: 'setting'
    claim: 'The promise is kept when the LORD passes by and proclaims His name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'And the Lord passed by before him, and proclaimed, The Lord, The Lord God, merciful and gracious, longsuffering, and abundant in goodness and truth,'
  - where: 'setting'
    claim: 'Paul quotes verse 19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/9?lang=eng'
    quote: 'For he saith to Moses, I will have mercy on whom I will have mercy, and I will have compassion on whom I will have compassion.'
  - where: 'setting'
    claim: 'Elijah is at Horeb when the LORD passes by'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/19?lang=eng'
    quote: 'Go forth, and stand upon the mount before the Lord. And, behold, the Lord passed by'
  - where: 'setting'
    claim: 'A revelation to Joseph Smith recalls the angel sent without the presence'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/103?lang=eng'
    quote: 'I say not unto you as I said unto your fathers: Mine angel shall go up before you, but not my presence.'
  - where: 'thread'
    claim: '“My presence” in verse 14 is literally “my face”'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'God promises, “My presence [literally, ‘my face’] will walk [presumably with the Israelites], and I will cause you to have rest” (author’s translation).'
  - where: 'thread'
    claim: 'The same Hebrew word (Strong’s 6440) stands in verse 11 (“face to face”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'פָּנִ֣ים'
  - where: 'thread'
    claim: 'The same word stands in verse 14 (“my presence”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'פָּנַ֥/י'
  - where: 'thread'
    claim: 'The same word stands in verse 15 (“thy presence”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'פָּנֶ֨י/ךָ֙'
  - where: 'thread'
    claim: 'The same word stands in verse 20 (“my face”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'פָּנָ֑/י'
  - where: 'thread'
    claim: 'The same word stands in verse 23 (“my face”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וּ/פָנַ֖/י'
  - where: 'thread'
    claim: 'The chapter falls into three parts: the command to leave (1–6), the tent outside the camp (7–11), Moses’s intercession (12–23)'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2033&version=NRSVUE'
    quote: 'The Tent outside the Camp'
  - where: 'thread'
    claim: 'The withdrawal of verses 2–3 (an angel in place of the presence) is not the last word: the LORD relents (the source says so at verses 17–19)'
    key: ot-minute-ex-24
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-24-28-31-34'
    quote: 'The Lord relented from what He had told Moses previously (that He would replace His presence with an angel along the way to the promised land [see verse 2]).'

  # ---------- plain words ----------
  - where: 'section 1 plain'
    claim: 'Verse 5 may be read as a condition: if I came up, I would consume'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/33?lang=eng'
    quote: 'OR if I came up … I would consume …'
  - where: 'section 2 plain'
    claim: 'The “tabernacle of the congregation” is the tent of meeting'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/33?lang=eng'
    quote: 'HEB tent of meeting (also vv. 9–11).'
  - where: 'section 2 plain'
    claim: 'The verbs of verses 7–11 may be read as customary action'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2033&version=NRSVUE'
    quote: 'Now Moses used to take the tent and pitch it outside the camp, far off from the camp; he called it the tent of meeting.'
  - where: 'section 3 plain'
    claim: '“Separated” means made a distinct people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/33?lang=eng'
    quote: 'OR special, distinctive people.'
  - where: 'section 4 plain'
    claim: '“While I pass by” is “until I have gone past”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/33?lang=eng'
    quote: 'HEB until I have gone past.'
  - where: 'section 4 plain'
    claim: '“Clift” is cleft and “back parts” is back'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2033&version=NRSVUE'
    quote: 'I will put you in a cleft of the rock, and I will cover you with my hand until I have passed by; 23 then I will take away my hand, and you shall see my back, but my face shall not be seen.'

  # ---------- note 33:3 ----------
  - where: 'note 33:3 “The land is still promised, but not the LORD’s company”'
    claim: 'The LORD would not go with them because His presence would destroy a stubborn people'
    key: ot-minute-ex-24
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-24-28-31-34'
    quote: 'The Lord told Moses that He would not go with them because His presence would destroy such a stubborn people.'
  - where: 'note 33:3 “The land is still promised, but not the LORD’s company”'
    claim: 'An angel was promised before the calf'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/23?lang=eng'
    quote: 'Beware of him, and obey his voice, provoke him not; for he will not pardon your transgressions: for my name is in him.'
  - where: 'note 33:3 “The land is still promised, but not the LORD’s company”'
    claim: 'D&C 103 distinguishes the angel from the presence'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/103?lang=eng'
    quote: 'But I say unto you: Mine angels shall go up before you, and also my presence, and in time ye shall possess the goodly land.'

  # ---------- note 33:6 ----------
  - where: 'note 33:6 “Why the people take off their ornaments”'
    claim: 'The Church’s footnote words verse 5 as a condition'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/33?lang=eng'
    quote: 'OR if I came up … I would consume …'
  - where: 'note 33:6 “Why the people take off their ornaments”'
    claim: 'The ornaments represented prosperity'
    key: ot-minute-ex-24
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-24-28-31-34'
    quote: 'They mourned the news by removing their jewelry and other ornaments, things that represented their prosperity, things that were important to them.'
  - where: 'note 33:6 “Why the people take off their ornaments”'
    claim: 'Putting them off showed the Lord mattered more than possessions'
    key: ot-minute-ex-24
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-24-28-31-34'
    quote: 'By mourning in such a manner, they showed the Lord that He was more important in their lives than worldly possessions.'
  - where: 'note 33:6 “Why the people take off their ornaments”'
    claim: 'The people later give their jewelry for the tabernacle (35:22)'
    key: ot-minute-ex-24
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-24-28-31-34'
    quote: 'In Exodus 35:22, we read that the children of Israel also gave up their jewelry to contribute it to the building of the future tabernacle.'
  - where: 'note 33:6 “Why the people take off their ornaments”'
    claim: 'A modern translation reads verse 6 as “from Mount Horeb onward”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2033&version=NRSVUE'
    quote: 'Therefore the Israelites stripped themselves of their ornaments, from Mount Horeb onward.'

  # ---------- note 33:7 ----------
  - where: 'note 33:7 “This tent is not the tabernacle of chapters 25–31”'
    claim: 'The name is “tent of meeting”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/33?lang=eng'
    quote: 'HEB tent of meeting (also vv. 9–11).'
  - where: 'note 33:7 “This tent is not the tabernacle of chapters 25–31”'
    claim: 'A modern translation has “the tent” and reads the verbs as customary'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2033&version=NRSVUE'
    quote: 'Now Moses used to take the tent and pitch it outside the camp, far off from the camp; he called it the tent of meeting.'
  - where: 'note 33:7 “This tent is not the tabernacle of chapters 25–31”'
    claim: 'The pillar of cloud “would descend” whenever Moses entered'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2033&version=NRSVUE'
    quote: 'When Moses entered the tent, the pillar of cloud would descend and stand at the entrance of the tent'
  - where: 'note 33:7 “This tent is not the tabernacle of chapters 25–31”'
    claim: 'The tabernacle was not yet finished; Moses set up a temporary one'
    key: ot-minute-ex-24
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-24-28-31-34'
    quote: 'In the meantime, Moses set up a temporary tabernacle— a tent that he pitched outside the camp.'
  - where: 'note 33:7 “This tent is not the tabernacle of chapters 25–31”'
    claim: 'The cloud represented the presence of God'
    key: ot-minute-ex-24
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-24-28-31-34'
    quote: 'As we saw in prior chapters, the cloud represented the presence of God.'
  - where: 'note 33:7 “This tent is not the tabernacle of chapters 25–31”'
    claim: 'One older reading: a tent of Moses’s own, made a temporary sanctuary by the cloud; not the tabernacle of chapter 25, made only in chapter 35'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/33.htm'
    quote: 'but a tent belonging to Moses, which was made into a temporary sanctuary by the fact that the pillar of cloud came down upon it, and Jehovah talked with Moses there'
  - where: 'note 33:7 “This tent is not the tabernacle of chapters 25–31”'
    claim: 'The same reading gives a purpose for the distance from the camp'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/33.htm'
    quote: 'Moses desired thereby to lead the people to a fuller recognition of their separation from their God, that their penitence might be deepened in consequence'
  - where: 'note 33:7 “This tent is not the tabernacle of chapters 25–31”'
    claim: 'The Church’s Student Manual gives this reading of the tent'
    key: ot-manual-ex-21-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-21-24-31-35-the-mosaic-law-a-preparatory-gospel?lang=eng'
    quote: 'The ‘tent’ is neither the sanctuary of the tabernacle described in [Exodus 25–30], which was not made till after the perfect restoration of the covenant [Exodus 35–40]'

  - where: 'note 33:7 “This tent is not the tabernacle of chapters 25–31”'
    claim: 'The tent was called by the same name as the tabernacle'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/33.htm'
    quote: 'and which was called by the same name as the tabernacle'
  # ---------- note 33:11 ----------
  - where: 'note 33:11 “Face to face, as a friend”'
    claim: 'Numbers says the LORD speaks with Moses mouth to mouth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/12?lang=eng'
    quote: 'With him will I speak mouth to mouth, even apparently, and not in dark speeches; and the similitude of the Lord shall he behold'
  - where: 'note 33:11 “Face to face, as a friend”'
    claim: 'Deuteronomy’s closing word on Moses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/34?lang=eng'
    quote: 'And there arose not a prophet since in Israel like unto Moses, whom the Lord knew face to face,'
  - where: 'note 33:11 “Face to face, as a friend”'
    claim: 'Moses 1 opens with Moses seeing God face to face'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng'
    quote: 'And he saw God face to face, and he talked with him, and the glory of God was upon Moses; therefore Moses could endure his presence.'

  # ---------- note 33:14 ----------
  - where: 'note 33:14 “My presence” is “my face,” and what the rest is'
    claim: 'Literal rendering of verse 14'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: '“My presence [literally, ‘my face’] will walk [presumably with the Israelites], and I will cause you to have rest” (author’s translation).'
  - where: 'note 33:14 “My presence” is “my face,” and what the rest is'
    claim: 'Rest here is the settlement in the land'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'In this instance, “rest” is associated with the future settlement of the children of Israel after their wandering in the wilderness or the reception of their “inheritance.”'
  - where: 'note 33:14 “My presence” is “my face,” and what the rest is'
    claim: 'Psalm 95 speaks of God’s own rest'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'Yet the rest in Psalm 95 is God’s rest. In other words, Psalm 95 suggests that the children of Israel could have entered into God’s own rest.'
  - where: 'note 33:14 “My presence” is “my face,” and what the rest is'
    claim: 'In granting Moses’s request (verse 17) the LORD relents from sending an angel in place of His presence'
    key: ot-minute-ex-24
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-24-28-31-34'
    quote: 'The Lord relented from what He had told Moses previously (that He would replace His presence with an angel along the way to the promised land [see verse 2]).'
  - where: 'note 33:14 “My presence” is “my face,” and what the rest is'
    claim: 'Deuteronomy uses “rest” of the settlement'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/3?lang=eng'
    quote: 'Until the Lord have given rest unto your brethren, as well as unto you, and until they also possess the land'
  - where: 'note 33:14 “My presence” is “my face,” and what the rest is'
    claim: 'D&C 84:24 says Israel in the wilderness could not endure His presence and did not enter His rest, the fulness of His glory'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'But they hardened their hearts and could not endure his presence; therefore, the Lord in his wrath, for his anger was kindled against them, swore that they should not enter into his rest while in the wilderness, which rest is the fulness of his glory.'
  - where: 'note 33:14 “My presence” is “my face,” and what the rest is'
    claim: 'Moses asks again on the mount that the Lord go among them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'If now I have found grace in thy sight, O Lord, let my Lord, I pray thee, go among us; for it is a stiffnecked people'

  # ---------- note 33:18 ----------
  - where: 'note 33:18 “Moses asks for glory and is promised goodness and a name”'
    claim: 'The promise is kept in 34:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'And the Lord descended in the cloud, and stood with him there, and proclaimed the name of the Lord.'
  - where: 'note 33:18 “Moses asks for glory and is promised goodness and a name”'
    claim: 'One older reading: Moses sought more than any earlier revelation of the glory'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/33.htm'
    quote: 'must have been something surpassing all former revelations of the glory of Jehovah'
  - where: 'note 33:18 “Moses asks for glory and is promised goodness and a name”'
    claim: 'The same reading equates “my glory” in verse 22 with “all my goodness” in verse 19'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/33.htm'
    quote: 'In Exodus 33:22 "My glory" is used for "all My goodness," and in Exodus 34:6 it is stated that Jehovah passed by before the face of Moses.'
  - where: 'note 33:18 “Moses asks for glory and is promised goodness and a name”'
    claim: 'What passed before Moses was the moral nature of God, on that reading'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/33.htm'
    quote: 'signifies goodness; not the brilliancy which strikes the senses, but the spiritual and ethical nature of the Divine Being'
  - where: 'note 33:18 “Moses asks for glory and is promised goodness and a name”'
    claim: 'The closing sentence of verse 19 gives the ground of the grant'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/33.htm'
    quote: 'it was an act of unconditional grace and compassion on the part of God, to which no man, not even Moses, could lay any just claim'
  - where: 'note 33:18 “Moses asks for glory and is promised goodness and a name”'
    claim: 'Paul quotes verse 19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/9?lang=eng'
    quote: 'For he saith to Moses, I will have mercy on whom I will have mercy, and I will have compassion on whom I will have compassion.'

  - where: 'note 33:18 “Moses asks for glory and is promised goodness and a name”'
    claim: 'On that reading Paul uses the words in the same sense'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/33.htm'
    quote: 'The apostle Paul uses the words in the same sense in Romans 9:15'
  # ---------- note 33:20 ----------
  - where: 'note 33:20 “Who can see God and live”'
    claim: 'Verse 20 seems to contradict verse 11'
    key: scripture-helps-ex-19
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/15-exodus-19-20-24-31-34?lang=eng'
    quote: 'seemingly contradicts verse 11, which states that “the Lord spake unto Moses face to face, as a man speaketh unto his friend.”'
  - where: 'note 33:20 “Who can see God and live”'
    claim: 'The JST reads the refusal as for that time, because of Israel’s sins'
    key: scripture-helps-ex-19
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/15-exodus-19-20-24-31-34?lang=eng'
    quote: 'The Lord indicated that because of Israel’s sins, they would not be allowed to see the Lord’s face at that time.'
  - where: 'note 33:20 “Who can see God and live”'
    claim: 'JST Exodus 33:20, first sentence'
    key: jst-ex-33
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-ex/33?lang=eng'
    quote: 'Thou canst not see my face at this time, lest mine anger be kindled against thee also, and I destroy thee, and thy people; for there shall no man among them see me at this time, and live, for they are exceeding sinful.'
  - where: 'note 33:20 “Who can see God and live”'
    claim: 'JST Exodus 33:20, the general rule'
    key: jst-ex-33
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-ex/33?lang=eng'
    quote: 'And no sinful man hath at any time, neither shall there be any sinful man at any time, that shall see my face and live.'
  - where: 'note 33:20 “Who can see God and live”'
    claim: 'JST Exodus 33:23'
    key: jst-ex-33
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-ex/33?lang=eng'
    quote: 'but my face shall not be seen, as at other times; for I am angry with my people Israel.'
  - where: 'note 33:20 “Who can see God and live”'
    claim: 'Moses’s own account of how he saw God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng'
    quote: 'But now mine own eyes have beheld God; but not my natural, but my spiritual eyes, for my natural eyes could not have beheld; for I should have withered and died in his presence; but his glory was upon me'
  - where: 'note 33:20 “Who can see God and live”'
    claim: 'D&C 67:11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/67?lang=eng'
    quote: 'For no man has seen God at any time in the flesh, except quickened by the Spirit of God.'
  - where: 'note 33:20 “Who can see God and live”'
    claim: 'D&C 84:21–22: ordinances and authority of the priesthood are needed to see the face of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'And without the ordinances thereof, and the authority of the priesthood, the power of godliness is not manifest unto men in the flesh;'
  - where: 'note 33:20 “Who can see God and live”'
    claim: 'D&C 84:22: without this no man can see the face of God and live'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'For without this no man can see the face of God, even the Father, and live.'
  - where: 'note 33:20 “Who can see God and live”'
    claim: 'D&C 84:23: Moses taught this to Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'Now this Moses plainly taught to the children of Israel in the wilderness, and sought diligently to sanctify his people that they might behold the face of God;'
  - where: 'note 33:20 “Who can see God and live”'
    claim: 'The texts remain hard to reconcile even with the JST'
    key: muhlestein-theophanies
    url: 'https://rsc.byu.edu/ascending-mountain-lord/darkness-light-lord-elements-israelite-theophanies'
    quote: 'Even with this change, these are difficult texts to reconcile.'
  - where: 'note 33:20 “Who can see God and live”'
    claim: 'A pattern of revealing and hiding through Exodus'
    key: muhlestein-theophanies
    url: 'https://rsc.byu.edu/ascending-mountain-lord/darkness-light-lord-elements-israelite-theophanies'
    quote: 'The Lord reveals himself, yet at the same time, his glory is too great to be fully revealed. Frequently, this conundrum is expressed by light revealing the Lord while darkness hides him.'
  - where: 'note 33:20 “Who can see God and live”'
    claim: 'Here the pattern is the face seen and then only the back'
    key: muhlestein-theophanies
    url: 'https://rsc.byu.edu/ascending-mountain-lord/darkness-light-lord-elements-israelite-theophanies'
    quote: 'Here it is expressed by Moses seeing the Lord’s face yet shortly thereafter only being allowed to see the back of him because of man’s fallen and sinful actions.'

