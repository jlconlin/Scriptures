chapter: 37
claims:
  # ---------- setting / thread ----------
  - where: 'setting'
    claim: 'The chapter tells of the making of the ark, mercy seat, table, candlestick, incense altar, oil and incense'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/37?lang=eng'
    quote: 'Bezaleel makes the ark, the mercy seat, and the cherubims—He makes the table, the vessels, the candlestick, the incense altar, the holy anointing oil, and the sweet incense.'
  - where: 'setting'
    claim: 'The instructions answered by this chapter are Ex. 25:10–39 and 30:1–5, 22–25, 34–35'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/37.htm'
    quote: 'Exodus 37:1-9. The Ark and Mercy-seat. Exodus 25:10-14; Exodus 25:17-20 (vv. 15, 16, 21, 22 not repeated). Exodus 37:10-16. The Table of Presence-bread. Exodus 25:23-29 (v. 30 not repeated).'
  - where: 'setting'
    claim: 'The ark was the one furnishing of the most holy place'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'The Holy of Holies contained only one piece of furniture: the Ark of the Covenant, or the Ark of the Testimony (Ex. 25:22).'
  - where: 'setting'
    claim: 'Hebrews names the candlestick, the table and the shewbread as the furniture of the first room'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/9?lang=eng'
    quote: 'For there was a tabernacle made; the first, wherein was the candlestick, and the table, and the shewbread; which is called the sanctuary.'
  - where: 'thread'
    claim: 'The account of the making repeats the instructions nearly word for word, with past tenses for future'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/37.htm'
    quote: 'In the main, the narrative is repeated verbatim from the instructions in chs. 25–31, with the simple substitution of past tenses for future'
  - where: 'thread'
    claim: 'The verses left out concern the position or use of the vessels and are told in chapter 40; 25:22 is omitted'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/37.htm'
    quote: 'Thus a few verses (as Exodus 25:8-9; Exodus 25:15; Exodus 25:22; Exodus 25:40) are omitted, as not needing repetition; others (as Exodus 25:16; Exodus 25:21; Exodus 25:30; Exodus 25:37 b), chiefly relating to the position or use of the different vessels named, are incorporated in Exodus 40:17-23, the account of the erection of the Tent of Meeting, where they actually belong'
  - where: 'thread'
    claim: 'The oil and the incense, two long sections of chapter 30, are given a single verse'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/37.htm'
    quote: 'the sections on the Anointing Oil and the Incense (Exodus 30:22-38) are merely referred to briefly in a single verse (Exodus 37:29)'
  - where: 'thread'
    claim: 'The use of the incense altar (30:6–10) is not repeated here'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/37.htm'
    quote: '25–28 (Exodus 30:1-5). The altar of incense. Exodus 30:6-10 are not repeated.'

  # ---------- plain ----------
  - where: 'section 1 plain'
    claim: 'Shittim is acacia'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/37?lang=eng'
    quote: 'HEB acacia (also vv. 4, 10, 15, 25, 28).'
  - where: 'section 1 plain'
    claim: 'The “crown” is a rim or molding'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/37.htm'
    quote: '2. a crown] a rim or moulding (Exodus 25:11). See on Exodus 25:11.'
  - where: 'section 1 plain'
    claim: 'The Church’s footnote on “crown”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/37?lang=eng'
    quote: 'OR border (also vv. 11–12, 26–27).'
  - where: 'section 1 plain'
    claim: 'The cherubim were of one piece with the mercy seat'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/37?lang=eng'
    quote: 'OR of one piece with.'
  - where: 'section 2 plain'
    claim: '“Over against” the border is next to it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/37?lang=eng'
    quote: 'OR Next to.'
  - where: 'section 2 plain'
    claim: 'The “vessels” are utensils'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/37?lang=eng'
    quote: 'OR utensils.'
  - where: 'section 2 plain'
    claim: 'The “covers” are jugs for pouring drink offerings'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/37?lang=eng'
    quote: 'HEB the jugs for pouring libations.'
  - where: 'section 3 plain'
    claim: 'The “knops” are buds, the “bowls” cups'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/37?lang=eng'
    quote: 'OR its branches, its cups, etc.'
  - where: 'section 3 plain'
    claim: 'A modern translation: cups shaped like almond blossoms'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2037&version=NRSVUE'
    quote: 'three cups shaped like almond blossoms, each with calyx and petals, on one branch'
  - where: 'section 3 plain'
    claim: 'The “knops” are buds'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/37?lang=eng'
    quote: 'OR its buds.'
  - where: 'section 4 plain'
    claim: 'The “apothecary” is a perfumer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/37?lang=eng'
    quote: 'OR perfumer.'

  # ---------- note 37:1 ----------
  - where: 'note 37:1 “The one furnishing named as Bezaleel’s work”'
    claim: 'One older reading: the ark, as the most holy thing, is distinguished by being expressly named as the work of Bezaleel'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/37.htm'
    quote: 'the holy chest (the ark), as being the most holy thing of all, is distinguished above all the rest, by being expressly mentioned as the work of Bezaleel, the chief architect of the whole.'

  # ---------- note 37:25 ----------
  - where: 'note 37:25 “The incense altar among the furniture it stood with”'
    claim: 'In the instructions the incense altar is not described with the table and the lampstand but waits until 30:1–10'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'It is interesting that Exodus does not describe the altar of incense (the next logical item to cover as it is closest to the ark of the covenant) until Exodus 30:1–10.'
  - where: 'note 37:25 “The incense altar among the furniture it stood with”'
    claim: 'The altar of incense stood in the middle of the holy place, before the veil and the mercy seat'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'In the middle, before the veil and before the mercy seat (Ex. 30:6), stood the altar of incense, similar in construction to the altar of burnt offering but smaller and overlaid with gold.'
  - where: 'note 37:25 “The incense altar among the furniture it stood with”'
    claim: 'The candlestick stood on the south side of the altar of incense and the table on the north'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: '(2) On the south side of the altar of incense stood the candlestick (Ex. 26:35), of pure gold of beaten work, with six branches and seven lamps.'
  - where: 'note 37:25 “The incense altar among the furniture it stood with”'
    claim: 'The table of shewbread stood on the north side of the altar'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: '(3) On the north side of the altar stood the table of shewbread (Ex. 25:23–30) made of acacia wood.'
  - where: 'note 37:25 “The incense altar among the furniture it stood with”'
    claim: 'The incense altar is made in this chapter after the table and the candlestick'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/37?lang=eng'
    quote: 'He makes the table, the vessels, the candlestick, the incense altar, the holy anointing oil, and the sweet incense.'

  # ---------- note 37:29 ----------
  - where: 'note 37:29 “The oil and the incense in a single verse”'
    claim: 'The Church’s footnote gives “perfumer” for “apothecary”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/37?lang=eng'
    quote: 'OR perfumer.'

  # ---------- christ / explore ----------
  - where: 'christ'
    claim: 'Hebrews names the cherubim and the mercy seat and declines to describe them in detail'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/9?lang=eng'
    quote: 'And over it the cherubims of glory shadowing the mercyseat; of which we cannot now speak particularly.'
  - where: 'christ'
    claim: 'Hebrews calls the tabernacle and its service a figure, and says Christ entered heaven itself'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/9?lang=eng'
    quote: 'For Christ is not entered into the holy places made with hands, which are the figures of the true; but into heaven itself, now to appear in the presence of God for us:'
