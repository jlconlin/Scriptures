    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/7?lang=eng'
    quote: 'Who needeth not daily, as those high priests, to offer up sacrifice, first for his own sins, and then for the people’s: for this he did once, when he offered up himself.'
  - where: 'christ'
    claim: 'A study of the chapter reads each element of the daily offering as foreshadowing the Savior'
