chapter: 29
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'The rites commanded here are carried out in Leviticus 8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/8?lang=eng'
    quote: 'So Aaron and his sons did all things which the Lord commanded by the hand of Moses.'
  - where: 'setting'
    claim: 'Leviticus 8 tells the doing of it step by step, with the refrain “as the LORD commanded Moses”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/8?lang=eng'
    quote: 'And Moses brought Aaron’s sons, and put coats upon them, and girded them with girdles, and put bonnets upon them; as the Lord commanded Moses.'
  - where: 'setting'
    claim: 'The command to wash, clothe and anoint the priests is repeated when the tabernacle is to be set up'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'And thou shalt put upon Aaron the holy garments, and anoint him, and sanctify him; that he may minister unto me in the priest’s office.'
  - where: 'setting'
    claim: 'Moses officiated and received the breast of the second ram'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/8?lang=eng'
    quote: 'And Moses took the breast, and waved it for a wave offering before the Lord: for of the ram of consecration it was Moses’ part; as the Lord commanded Moses.'
  - where: 'setting'
    claim: 'The altar sacrifices of the law were of three kinds'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'Altar sacrifices were of three kinds: sin offerings, burnt offerings, and peace offerings.'
  - where: 'setting'
    claim: 'The law of the sacrifices is set out in Leviticus 1–7'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/29.htm'
    quote: 'This can only be fully understood in connection with the sacrificial law contained in Leviticus 1-7.'
  - where: 'thread'
    claim: 'A priest in Israel was a mediator between the people and God'
    key: bd-priests
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/priests?lang=eng'
    quote: 'The essential idea of a Hebrew priest was that of a mediator between his people and God by representing them officially in worship and sacrifice.'
  - where: 'thread'
    claim: 'The consecration had a ceremonial part and a sacrificial part'
    key: bd-priests
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/priests?lang=eng'
    quote: 'Consecration to the priestly office consisted of two parts: ceremonial and sacrificial.'
  - where: 'thread'
    claim: 'One study reads the sanctifying of the tabernacle and priests as God’s own part in making reconciliation possible'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'just as mortals sanctified themselves and the space around them to reconcile themselves with God, so God participated in preparing the space and the individual so that reconciliation could happen.'

  # ---------- sections ----------
  - where: 'section 1 plain'
    claim: 'A bullock is a young bull'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/29?lang=eng'
    quote: 'OR young bull (also vv. 3, 10–12, 14, 36).'
  - where: 'section 1 plain'
    claim: 'The “curious” girdle is one skillfully woven'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/29?lang=eng'
    quote: 'OR skillfully woven.'
  - where: 'section 2 plain'
    claim: 'The “caul” above the liver is its lobe, and a “sweet savour” a pleasing fragrance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/29?lang=eng'
    quote: 'OR pleasing fragrance.'
  - where: 'section 3 plain'
    claim: 'The “rump” is the fat tail'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/29?lang=eng'
    quote: 'HEB fat tail.'
  - where: 'section 4 plain'
    claim: 'To “seethe” the flesh is to cook it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/29?lang=eng'
    quote: 'OR cook its flesh.'
  - where: 'section 5 plain'
    claim: 'Lambs “of the first year” are a year old'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/29?lang=eng'
    quote: 'HEB a year old.'
  - where: 'section 5 plain'
    claim: 'The “meat offering” is an offering of flour'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/29?lang=eng'
    quote: 'HEB cereal, meal, or flour.'

  # ---------- note 29:4 ----------
  - where: 'note 29:4 “Washed, clothed, and anointed at the door”'
    claim: 'The consecration had two parts, ceremonial and sacrificial'
    key: bd-priests
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/priests?lang=eng'
    quote: 'Consecration to the priestly office consisted of two parts: ceremonial and sacrificial.'
  - where: 'note 29:4 “Washed, clothed, and anointed at the door”'
    claim: 'The ceremonial part was washing at the door, clothing, and anointing'
    key: bd-priests
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/priests?lang=eng'
    quote: '(1) They were washed at the door of the tabernacle. (2) They were clothed with the priestly garments (coats, girdles, and miters or turbans). (3) They were anointed (Ex. 40:15) with holy oil.'
  - where: 'note 29:4 “Washed, clothed, and anointed at the door”'
    claim: 'The text does not say what the washing involved'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'The Bible does not mention what the washing involved, but the ceremony likely would have included much of the body.'
  - where: 'note 29:4 “Washed, clothed, and anointed at the door”'
    claim: 'Washing with water signified ritual cleanness that allowed sacred acts'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'Anciently, washing with water often symbolized becoming ritually clean, which allowed the person to perform sacred acts such as prayer or sacrifice.'
  - where: 'note 29:4 “Washed, clothed, and anointed at the door”'
    claim: 'The washing symbolized spiritual cleansing, and the three acts prepared the priests to officiate'
    key: scripture-helps-ex-35
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/16-exodus-35-40-leviticus-1-4-16-19?lang=eng'
    quote: 'The ceremonies of washing, anointing, and clothing in holy garments helped prepare Aaron and his sons to officiate in the sacred ordinances of the tabernacle. The act of washing symbolized being spiritually cleansed.'
  - where: 'note 29:4 “Washed, clothed, and anointed at the door”'
    claim: 'Aaron’s sons received only the linen clothing, not the high priest’s garments'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'A significant difference is that Aaron’s sons were only dressed in the white linen clothing and not in the beautiful colorful garments of the high priest.'
  - where: 'note 29:4 “Washed, clothed, and anointed at the door”'
    claim: 'The Church’s footnote to “wash” points to D&C 124:39'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/29?lang=eng'
    quote: 'Lev. 8:6; D&C 124:39.'
  - where: 'note 29:4 “Washed, clothed, and anointed at the door”'
    claim: 'D&C 124:39 names anointings and washings among the ordinances of the Lord’s house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/124?lang=eng'
    quote: 'your anointings, and your washings, and your baptisms for the dead … are ordained by the ordinance of my holy house, which my people are always commanded to build unto my holy name.'

  # ---------- note 29:7 ----------
  - where: 'note 29:7 “What the anointing meant”'
    claim: 'Kings were anointed to their office'
    key: bd-anoint
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/anoint?lang=eng'
    quote: 'Kings were anointed to their office by the prophets'
  - where: 'note 29:7 “What the anointing meant”'
    claim: 'Priests and the high priest were anointed, and Elisha was to be anointed a prophet'
    key: bd-anoint
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/anoint?lang=eng'
    quote: 'The anointing of the priests is outlined in Ex. 40:15; of the high priest (Aaronic order) in Lev. 21:10. Elisha was to be anointed a prophet by Elijah (1 Kgs. 19:16).'
  - where: 'note 29:7 “What the anointing meant”'
    claim: 'The holy oil was olive oil with spices, restricted to certain ceremonies'
    key: bd-anoint
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/anoint?lang=eng'
    quote: 'The holy anointing oil used in the law of Moses was composed of olive oil mixed with spices and was to be restricted in use to certain specified ceremonies (Ex. 30:22–33; 37:29).'
  - where: 'note 29:7 “What the anointing meant”'
    claim: 'Unlike the atoning rites, the anointing was done once and not repeated'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'whereas all the atoning rituals were repeated often, the act of being anointed or splashed with the blood or oil, once done, was never performed again.'
  - where: 'note 29:7 “What the anointing meant”'
    claim: 'The study reads the oil as God’s own, transforming what it touched'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'the oil belonged to God himself, transforming that which touched it and making those items representative of him or able to interact with him.'
  - where: 'note 29:7 “What the anointing meant”'
    claim: 'The study reads the anointing as a divine act done through a mortal representative'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'In other words, the anointing is a divine act, creating an environment that allows mortal acts to have efficacy. In essence, the anointing is the divine reaching out to mortals.'
  - where: 'note 29:7 “What the anointing meant”'
    claim: 'The same study cites Leviticus 21:10–12 for the transformation the anointing works'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'Leviticus 21:10–12 reveals that the high priest is not allowed to act like the rest of society during the mourning process because “the crown of the anointing oil of his God is upon him.”'
  - where: 'note 29:7 “What the anointing meant”'
    claim: 'Leviticus says the anointing oil of God is on the high priest, so that he may not leave the sanctuary'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/21?lang=eng'
    quote: 'Neither shall he go out of the sanctuary, nor profane the sanctuary of his God; for the crown of the anointing oil of his God is upon him: I am the Lord.'
  - where: 'note 29:7 “What the anointing meant”'
    claim: 'A psalm remembers the oil on Aaron’s head running down his beard to his garments'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/133?lang=eng'
    quote: 'It is like the precious ointment upon the head, that ran down upon the beard, even Aaron’s beard: that went down to the skirts of his garments;'
  - where: 'note 29:7 “What the anointing meant”'
    claim: 'Christ and Messiah both mean “anointed”'
    key: bd-anointed-one
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/anointed-one?lang=eng'
    quote: 'The English word Christ is from a Greek word meaning “anointed” and is the equivalent of Messiah, which is from a Hebrew and Aramaic term meaning “anointed.”'
  - where: 'note 29:7 “What the anointing meant”'
    claim: 'Jesus is the one anointed of the Father'
    key: bd-anointed-one
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/anointed-one?lang=eng'
    quote: 'Jesus is spoken of as the Christ and the Messiah, which means He is the one anointed of the Father to be His personal representative in all things pertaining to the salvation of mankind.'

  # ---------- note 29:9 ----------
  - where: 'note 29:9 “To consecrate is to fill the hand”'
    claim: 'The Hebrew of “consecrate” in verse 9 is the verb “fill” (H4390) with “hand” (H3027)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וּ/מִלֵּאתָ֥'
  - where: 'note 29:9 “To consecrate is to fill the hand”'
    claim: 'The clause can be translated “fill the hand of Aaron and the hand of his sons”'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'The wording “and thou shalt consecrate Aaron and his sons” can actually be translated as “thou shalt fill the hand of Aaron and the hand of his sons.”'
  - where: 'note 29:9 “To consecrate is to fill the hand”'
    claim: 'The noun in “ram of consecration” means installation of priests, and the lexicon compares the verb'
    key: bdb
    url: 'https://biblehub.com/hebrew/4394.htm'
    quote: '2 installation (of priests): Leviticus 7:37; Leviticus 8:33'
  - where: 'note 29:9 “To consecrate is to fill the hand”'
    claim: 'The priests’ hands were filled with the portions of the ram and the bread, and so the gifts they would offer were committed to them'
    key: bd-priests
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/priests?lang=eng'
    quote: 'The priest’s hands were filled (see 1 Kgs. 13:33, “consecrated him”; Hebrew “filled his hand”) with the fat, the kidneys, the right thigh or shoulder, and part of the meal offering. The gifts that henceforward they would offer to the Lord on behalf of the people were thus committed to them.'
  - where: 'note 29:9 “To consecrate is to fill the hand”'
    claim: 'Another reading: an open hand receiving authority or a commission'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'The Hebrew wording implies a symbolic opening of the hand to receive authority or a divine commission from God.'
  - where: 'note 29:9 “To consecrate is to fill the hand”'
    claim: 'The Church’s footnote to verse 35 gives the sense of “consecrate them”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/29?lang=eng'
    quote: 'OR engage in the ordinance of setting them apart.'

  # ---------- note 29:10 ----------
  - where: 'note 29:10 “Three sacrifices in a set order”'
    claim: 'What each of the three sacrifices was for'
    key: bd-priests
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/priests?lang=eng'
    quote: '(1) a bullock as a sin offering, to put away their sin; (2) a ram as a burnt offering, to indicate the full and complete surrender of themselves to God; (3) a ram as a peace or consecration offering.'
  - where: 'note 29:10 “Three sacrifices in a set order”'
    claim: 'What the laying on of hands did'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'The laying on of hands (Lev. 16:21) dedicated the animal to God and made it the sacrificer’s representative and substitute (Lev. 1:4; Num. 8:10).'
  - where: 'note 29:10 “Three sacrifices in a set order”'
    claim: 'The priests could act for the people only because of the shedding of blood'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'The death of these animals as part of the consecration was a reminder to the priests that they were only able to act on behalf of the people because of the shedding of blood.'
  - where: 'note 29:10 “Three sacrifices in a set order”'
    claim: 'The blood of a sin offering went on the horns of the altar and the rest at its base'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'The blood of the sin offering (except in the particular case of the trespass offering) was put (smeared) upon the horns of the altar of burnt offering in ordinary cases.'
  - where: 'note 29:10 “Three sacrifices in a set order”'
    claim: 'The blood of burnt and peace offerings was sprinkled round the altar'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'The blood of the trespass, burnt, and peace offering was sprinkled on the altar of burnt offering round about.'
  - where: 'note 29:10 “Three sacrifices in a set order”'
    claim: 'The order sin, burnt, peace is the order of atonement, sanctification and fellowship'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'It is noteworthy that when the three offerings were offered together, the sin always preceded the burnt, and the burnt the peace offerings. Thus the order of the symbolizing sacrifices was the order of atonement, sanctification, and fellowship with the Lord.'

  # ---------- note 29:14 ----------
  - where: 'note 29:14 “Burned outside the camp”'
    claim: 'Leviticus makes burning outside the camp the rule for a priest’s sin offering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/4?lang=eng'
    quote: 'Even the whole bullock shall he carry forth without the camp unto a clean place, where the ashes are poured out, and burn him on the wood with fire'
  - where: 'note 29:14 “Burned outside the camp”'
    claim: 'Hebrews takes up the burning of sin offerings outside the camp'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/13?lang=eng'
    quote: 'For the bodies of those beasts, whose blood is brought into the sanctuary by the high priest for sin, are burned without the camp.'
  - where: 'note 29:14 “Burned outside the camp”'
    claim: 'A study of the chapter says Hebrews alludes to this burning'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'The author of Hebrews alluded to this when he taught, “Wherefore Jesus also, that he might sanctify the people with his own blood, suffered without the gate.'

  # ---------- note 29:20 ----------
  - where: 'note 29:20 “Blood on the ear, the thumb, and the toe”'
    claim: 'The blood on ear, thumb and toe symbolized obedience and service'
    key: bd-priests
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/priests?lang=eng'
    quote: 'The blood of the ram was put upon the tip of the priest’s right ear, the thumb of his right hand, and the great toe of his right foot. Obedience to the divine voice and activity in the divine service were thus symbolized.'
  - where: 'note 29:20 “Blood on the ear, the thumb, and the toe”'
    claim: 'The ear: hearing and hearkening'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'Placing the blood on the right ear could be a symbol of the sanctification of the priest’s ability to hear the word of God and to hearken to His commands.'
  - where: 'note 29:20 “Blood on the ear, the thumb, and the toe”'
    claim: 'The thumb: the hands that performed the sacrifices'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'The blood on the right thumb could represent the cleansing of the priest’s hands. This was important because his hands were the main way in which the priest executed the various sacrifices and ordinances.'
  - where: 'note 29:20 “Blood on the ear, the thumb, and the toe”'
    claim: 'The toe: the path the priests walked'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'The right large toe could be a symbol for the path the priests took, representing that they were to follow the counsel they received from the Lord.'
  - where: 'note 29:20 “Blood on the ear, the thumb, and the toe”'
    claim: 'One study reads the sprinkling of blood and oil on Aaron as establishing his relationship with God, as the blood sprinkled on all Israel had done'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'As with the splashing of the blood onto the whole of Israel … the splashing of the blood and oil onto Aaron affected the establishment of the relationship between Aaron and God.'

  # ---------- note 29:27 ----------
  - where: 'note 29:27 “The wave breast and the heave shoulder”'
    claim: 'The Church’s footnotes give “lifted up” for waved and “elevated” for heaved'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/29?lang=eng'
    quote: 'OR lifted up.'
  - where: 'note 29:27 “The wave breast and the heave shoulder”'
    claim: 'The footnote for “heaved”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/29?lang=eng'
    quote: 'OR elevated.'
  - where: 'note 29:27 “The wave breast and the heave shoulder”'
    claim: 'The Hebrew word for wave offering means a swinging or waving, and was used at first of the priest’s share'
    key: bdb
    url: 'https://biblehub.com/hebrew/8573.htm'
    quote: 'a swinging, waving, wave-offering, offering'
  - where: 'note 29:27 “The wave breast and the heave shoulder”'
    claim: 'The word was originally a term for the priest’s share of a sacrifice'
    key: bdb
    url: 'https://biblehub.com/hebrew/8573.htm'
    quote: 'waving, wave-offering, technical term in P (H), originally of priest''s share of sacrifice'
  - where: 'note 29:27 “The wave breast and the heave shoulder”'
    claim: 'The Hebrew word for heave offering means a contribution for sacred uses, something lifted off or separated'
    key: bdb
    url: 'https://biblehub.com/hebrew/8641.htm'
    quote: 'contribution, offering, for sacred uses (not certain before Deuteronomy; chiefly Ezekiel, P and late) (properly something lifted off, separated)'
  - where: 'note 29:27 “The wave breast and the heave shoulder”'
    claim: 'One reading of how the waving was done'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'Waving the offering likely meant that the priests took the sacrifice in their hands and waved it or moved it back and forth between the offerers (the priests) and the altar.'
  - where: 'note 29:27 “The wave breast and the heave shoulder”'
    claim: 'The same reading: the Lord accepted the offering and returned a portion'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'In essence, the Lord accepted the sacrifice and then returned a portion to them so that they could partake of it as part of the consecration ceremony.'
  - where: 'note 29:27 “The wave breast and the heave shoulder”'
    claim: 'The wave breast and heave thigh of the peace offerings were assigned for the priests’ maintenance'
    key: bd-priests
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/priests?lang=eng'
    quote: 'For the maintenance of the priests were assigned: (1) Portions of the Altar Offerings … the wave breast and the heave thigh of the peace offerings (Lev. 7:34).'
  - where: 'note 29:27 “The wave breast and the heave shoulder”'
    claim: 'The priests had no inheritance in the land'
    key: bd-priests
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/priests?lang=eng'
    quote: 'but the priests were to have no part or inheritance in the land (Num. 18:20; Josh. 21:13–19).'

  # ---------- note 29:33 ----------
  - where: 'note 29:33 “A meal at the door of the tabernacle”'
    claim: 'The meal was the characteristic rite of the peace offering and signified fellowship'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'The characteristic rite was the sacrificial meal. A feast symbolized fellowship and friendship among all its partakers and providers, and also a state of joy and gladness'
  - where: 'note 29:33 “A meal at the door of the tabernacle”'
    claim: 'Peace offerings presupposed peace with God'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'Peace offerings, as the name indicates, presupposed that the sacrificer was at peace with God; they were offered for the further realization and enjoyment of that peace.'
  - where: 'note 29:33 “A meal at the door of the tabernacle”'
    claim: 'One reading: the Lord invites the priests to a meal in His house, a sign that they are at peace with Him'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'the Lord’s invitation to the priests to enter His home (the tabernacle) and partake of a meal with Him (the Lord partook His portion through the act of burning on the altar) could symbolize that the priests were now at peace with God.'

  # ---------- note 29:35 ----------
  - where: 'note 29:35 “Seven days for the priests and for the altar”'
    claim: 'The priests stayed at the door of the tabernacle the seven days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/8?lang=eng'
    quote: 'And ye shall not go out of the door of the tabernacle of the congregation in seven days, until the days of your consecration be at an end: for seven days shall he consecrate you.'
  - where: 'note 29:35 “Seven days for the priests and for the altar”'
    claim: 'Seven often stands for completion'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'The number seven in the Bible often represents completion or perfection. The earth was not complete or perfect until the seventh day or period of Creation.'
  - where: 'note 29:35 “Seven days for the priests and for the altar”'
    claim: 'One study: the seven days are like a creation, after which atonement can be made at the altar'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'For now it is enough to recognize that the process is done, like a creation, for seven days so that atonement can be made there from then on.'

  # ---------- note 29:38 ----------
  - where: 'note 29:38 “The continual burnt offering”'
    claim: 'The continual burnt offering was offered twice daily because Israel’s obligation to surrender was constant'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'As the obligation to surrender was constant on the part of Israel, a burnt offering, called the continual burnt offering, was offered twice daily, morning and evening.'
  - where: 'note 29:38 “The continual burnt offering”'
    claim: 'The “meat offering” is of grain or flour'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/29?lang=eng'
    quote: 'HEB cereal, meal, or flour.'
  - where: 'note 29:38 “The continual burnt offering”'
    claim: 'One older reading of why the daily offering is commanded here'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/29.htm'
    quote: 'The directions concerning these are attached to the instructions for the consecration of the priests, because these sacrifices commenced immediately after the completion of the tabernacle'
  - where: 'note 29:38 “The continual burnt offering”'
    claim: 'Numbers calls it the offering ordained at Sinai and sets the other sacrifices beside it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/28?lang=eng'
    quote: 'It is a continual burnt offering, which was ordained in mount Sinai for a sweet savour, a sacrifice made by fire unto the Lord.'
  - where: 'note 29:38 “The continual burnt offering”'
    claim: 'The Church’s footnotes to verses 38 and 41 point to Daniel 8:11 and Psalm 141:2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/29?lang=eng'
    quote: 'Num. 28:3 (3–8); 1 Chr. 16:40; Dan. 8:11.'

  # ---------- note 29:42 ----------
  - where: 'note 29:42 “Where the LORD meets Israel”'
    claim: 'The Church’s footnote gives the Hebrew as “tent of meeting”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/29?lang=eng'
    quote: 'HEB opening of the tent of meeting (also vv. 10–11, 30, 32, 42, 44).'
  - where: 'note 29:42 “Where the LORD meets Israel”'
    claim: 'One older reading: the meeting promised at the ark is here extended to the whole nation at the altar'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/29.htm'
    quote: 'the presence and communion of God, which are attached to the ark of the covenant in Exodus 25:22, are ensured to the whole nation'
  - where: 'note 29:42 “Where the LORD meets Israel”'
    claim: 'The same reading: the people could come only to the altar, not to the ark'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/29.htm'
    quote: 'As the people were not allowed to approach the ark of the covenant, but only to draw near to the altar of burnt-offering in the sanctuary, it was important to declare that the Lord would manifest Himself to them even there'

  # ---------- note 29:46 ----------
  - where: 'note 29:46 “Brought out of Egypt to dwell among them”'
    claim: 'The Church’s footnote to verse 45 points to the promise of Exodus 6:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/29?lang=eng'
    quote: 'Ex. 6:7.'
  - where: 'note 29:46 “Brought out of Egypt to dwell among them”'
