    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'These daily sacrifices (offered each morning and evening) included four main elements: a sacrificed lamb, flour, beaten oil, and wine. Each of these elements strongly foreshadows the Savior.'
  - where: 'christ'
    claim: 'The same study sets John 1:14 beside the promise, in a literal translation'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'John taught, “And the Word became flesh, and did tabernacle among us, and we beheld his glory'
  - where: 'explore'
