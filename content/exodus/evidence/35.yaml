chapter: 35
claims:
  # ---------- when / setting ----------
  - where: 'when'
    claim: 'Moses came down from Sinai with the second tables before this chapter'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'And it came to pass, when Moses came down from mount Sinai with the two tables of testimony in Moses’ hand'
  - where: 'when'
    claim: 'The tabernacle was reared on the first day of the first month of the second year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'And it came to pass in the first month in the second year, on the first day of the month, that the tabernacle was reared up.'
  - where: 'setting'
    claim: 'The command to build the sanctuary was given during Moses’s forty days on Sinai'
    key: scripture-helps-ex-35
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/16-exodus-35-40-leviticus-1-4-16-19?lang=eng'
    quote: 'During the 40 days Moses was on Mount Sinai, the Lord commanded him to build a sanctuary, or tabernacle, so the Lord could “dwell among” His people.'
  - where: 'setting'
    claim: 'Exodus 35–40: the people give willingly, skilled workers build, and the glory fills the tabernacle'
    key: scripture-helps-ex-35
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/16-exodus-35-40-leviticus-1-4-16-19?lang=eng'
    quote: 'The Israelites willingly provided the materials necessary to build the tabernacle, and skilled workers built each of its components. Once the tabernacle was completed, the glory of the Lord filled it.'
  - where: 'setting'
    claim: 'The giving and the work run on into chapter 36'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/36?lang=eng'
    quote: 'And they spake unto Moses, saying, The people bring much more than enough for the service of the work, which the Lord commanded to make.'

  # ---------- thread ----------
  - where: 'thread'
    claim: 'Chapters 25–31 are the Lord’s description and 35–40 the people’s fulfilling of it'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'While it can be beneficial to read both how the Lord described the tabernacle (25–31) and how the people then fulfilled the command (35–40), most readers will just read one of these two sections.'
  - where: 'thread'
    claim: 'The two accounts run parallel because Moses built from the revelation'
    key: ot-manual-ex-25-30
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-25-30-35-40-the-house-of-the-lord-in-the-wilderness?lang=eng'
    quote: 'Since Moses used the revelation to guide the construction, there is a close parallel between the two descriptions in Exodus.'
  - where: 'thread'
    claim: 'The second account repeats the first nearly verbatim with past tenses for future'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/35.htm'
    quote: 'In the main, the narrative is repeated verbatim from the instructions in chs. 25–31, with the simple substitution of past tenses for future'
  - where: 'thread'
    claim: 'The order of contents differs between the two accounts'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/35.htm'
    quote: 'There are also, as compared with chs. 25–31, differences in the order of contents.'
  - where: 'thread'
    claim: 'Chapter 36 makes the curtains and boards of the building'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/35.htm'
    quote: 'Exodus 36:8-19. The curtains for the Dwelling, the tent over it, and the two outer coverings.'
  - where: 'thread'
    claim: 'Chapter 37 makes the ark and the other furniture'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/35.htm'
    quote: 'Exodus 37:1-9. The Ark and Mercy-seat. Exodus 25:10-14; Exodus 25:17-20'
  - where: 'thread'
    claim: 'Chapter 38 includes the court'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/35.htm'
    quote: 'Exodus 38:9-20. The Court of the Tent of Meeting. Exodus 27:9-19.'
  - where: 'thread'
    claim: 'Chapter 39 makes the priests’ garments'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/35.htm'
    quote: 'Exodus 39:2-5. The ephod (v. 1 introductory; most of v. 3 new. Exodus 28:6-8.'
  - where: 'thread'
    claim: 'Moses delivers the commands after the covenant is restored'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/35.htm'
    quote: 'After the restoration of the covenant, Moses announced to the people the divine commands with reference to the holy place of the tabernacle which was to be built.'
  - where: 'thread'
    claim: 'The calf was made while Moses was receiving the revelation; the people nonetheless gave liberally'
    key: ot-manual-ex-25-30
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-25-30-35-40-the-house-of-the-lord-in-the-wilderness?lang=eng'
    quote: 'despite their other faults and failings (the golden calf episode took place while Moses was on the mount receiving this revelation), when Israel heard what the Lord asked, they responded with joyous liberality.'
  - where: 'thread'
    claim: 'The willing offering was a command Israel fulfilled to overflowing (36:5–7)'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'Some modern readers criticize the ancient Israelites for their disobedience and other failings; however, this is one command they fulfilled to overflowing.'
  - where: 'thread'
    claim: 'Verses 1–3 are the Sabbath command'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/35.htm'
    quote: '1–3. Command to observe the sabbath.'
  - where: 'thread'
    claim: 'Verses 4–19 call for offerings and for skilled workers; 20–29 tell the fulfilment'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/35.htm'
    quote: 'and after that he called upon those who were endowed with understanding to prepare the different articles, as prescribed in ch. 25-30, mentioning these also one by one (Exodus 35:11-19)'
  - where: 'thread'
    claim: 'Verses 20–29 are the people’s response'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/35.htm'
    quote: '20–29. How the people responded to Moses’ summons: ordinary men, women, and ‘rulers,’ all brought willingly whatever their means, or their ability, enabled them to provide.'
  - where: 'thread'
    claim: 'Verses 30 and following announce Bezaleel and Aholiab'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/35.htm'
    quote: 'Exodus 35:30 to Exodus 36:1. Moses announces to the people the appointment of Bĕẓal’çl and Oholiab, and of other skilled workmen qualified to assist.'

  # ---------- plain-words renderings ----------
  - where: 'section 1 plain'
    claim: '“Habitations” are dwellings; the rule is no fire in any of them on the Sabbath'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2035&version=NRSVUE'
    quote: 'You shall kindle no fire in all your dwellings on the Sabbath day.'
  - where: 'section 2 plain'
    claim: 'Brass is bronze; the dyed stuffs are yarn; badgers’ skins are fine leather; shittim is acacia'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2035&version=NRSVUE'
    quote: 'gold, silver, and bronze; 6 blue, purple, and crimson yarns and fine linen; goats’ hair, 7 tanned rams’ skins, and fine leather; acacia wood'
  - where: 'section 2 plain'
    claim: 'The Church’s footnote gives acacia for shittim'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/35?lang=eng'
    quote: 'HEB acacia (also v. 24).'
  - where: 'section 2 plain'
    claim: '“Wise hearted” is skilled'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/35?lang=eng'
    quote: 'IE every one that is talented or skilled.'
  - where: 'section 2 plain'
    claim: '“Taches” are hooks'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/35?lang=eng'
    quote: 'OR its hooks.'
  - where: 'section 2 plain'
    claim: '“Staves” are poles; the “veil of the covering” is the curtain that screens; the candlestick is a lampstand'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2035&version=NRSVUE'
    quote: 'the ark with its poles, the cover, and the curtain for the screen; 13 the table with its poles and all its utensils and the bread of the Presence;(F) 14 and the lampstand for the light'
  - where: 'section 2 plain'
    claim: '“Vessels” are utensils'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/35?lang=eng'
    quote: 'OR its utensils.'
  - where: 'section 2 plain'
    claim: 'The “hanging” for the door is a screen or curtain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/35?lang=eng'
    quote: 'OR screen or curtain.'
  - where: 'section 2 plain'
    claim: 'The laver’s “foot” is its base'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/35?lang=eng'
    quote: 'OR its base.'
  - where: 'section 2 plain'
    claim: '“Pins” are pegs'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/35?lang=eng'
    quote: 'OR pegs.'
  - where: 'section 2 plain'
    claim: 'The “cloths of service” are garments for officiating'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/35?lang=eng'
    quote: 'HEB officiating garments.'
  - where: 'section 3 plain'
    claim: 'The “tabernacle of the congregation” is the tent of meeting'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/35?lang=eng'
    quote: 'HEB tent of meeting.'
  - where: 'section 3 plain'
    claim: 'The “jewels of gold” are gold jewelry'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/35?lang=eng'
    quote: 'OR gold jewelry.'
  - where: 'section 3 plain'
    claim: 'Verse 22 names gold objects of all sorts, and everyone presenting gold; verses 23–26 name yarn, fine leather, and the women’s skill'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2035&version=NRSVUE'
    quote: 'all sorts of gold objects, everyone bringing an offering of gold to the Lord. 23 And everyone who possessed blue or purple or crimson yarn or fine linen or goats’ hair or tanned rams’ skins or fine leather brought them.'
  - where: 'section 3 plain'
    claim: 'The women of verse 26 were moved to use their skill'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2035&version=NRSVUE'
    quote: 'all the women whose hearts moved them to use their skill spun the goats’ hair.'
  - where: 'section 3 plain'
    claim: 'The “rulers” are presiding officers, leaders'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/35?lang=eng'
    quote: 'OR presidents or presiding officers.'
  - where: 'section 3 plain'
    claim: 'The “willing offering” is a freewill offering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/35?lang=eng'
    quote: 'OR freewill.'
  - where: 'section 4 plain'
    claim: '“Curious works” are artistic things'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/35?lang=eng'
    quote: 'OR artistic things (also v. 35).'
  - where: 'section 4 plain'
    claim: 'The workers of verse 35 are artisan, designer, embroiderer, and weaver'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2035&version=NRSVUE'
    quote: 'He has filled them with skill to do every kind of work done by an artisan or by a designer or by an embroiderer in blue, purple, and crimson yarns and in fine linen or by a weaver'

  # ---------- note 35:3 ----------
  - where: 'note 35:3 “The Sabbath set before the work”'
    claim: 'One study counts seven speeches in the tabernacle account, the seventh on the Sabbath, and says the Sabbath forms an inner frame in it, naming Exodus 35:1–3'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'tabernacle accounts (Exodus 35.1-3), the tabernacle not only being completed in seven speeches (with the seventh addressing the Sabbath) … but structurally forming something of an inner frame in the tabernacle pericope.'
  - where: 'note 35:3 “The Sabbath set before the work”'
    claim: 'The Church’s footnote to “kindle” points to Exodus 16:23'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/35?lang=eng'
    quote: 'Ex. 16:23; D&C 59:13.'
  - where: 'note 35:3 “The Sabbath set before the work”'
    claim: 'At the first Sabbath of the manna the cooking was done the day before'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/16?lang=eng'
    quote: 'To morrow is the rest of the holy sabbath unto the Lord: bake that which ye will bake to day, and seethe that ye will seethe'
  - where: 'note 35:3 “The Sabbath set before the work”'
    claim: 'The rule against kindling fire would apply to the fires for working the tabernacle’s metal'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'would not only apply to the fires they might build at their (tent) homes on the Sabbath but also to the fires needed to forge the gold, silver, and brass for the tabernacle.'

  # ---------- note 35:5 ----------
  - where: 'note 35:5 “A willing heart”'
    claim: 'The adjective “willing” (H5081) in 35:5, 22 means incited, inclined, willing'
    key: bdb
    url: 'https://biblehub.com/hebrew/5081.htm'
    quote: '1 incited, inclined, willing,'
  - where: 'note 35:5 “A willing heart”'
    claim: 'The adjective stands in Exodus 35:5 and 35:22 and nowhere else in the book'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'נְדִ֣יב'
  - where: 'note 35:5 “A willing heart”'
    claim: 'A modern translation: whoever is of a generous heart'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2035&version=NRSVUE'
    quote: 'let whoever is of a generous heart bring the Lord’s offering'
  - where: 'note 35:5 “A willing heart”'
    claim: 'The verb (H5068) means incite, impel'
    key: bdb
    url: 'https://biblehub.com/hebrew/5068.htm'
    quote: 'verb incite, impel'
  - where: 'note 35:5 “A willing heart”'
    claim: 'The lexicon renders the phrase of 25:2 and 35:29 “whose heart incited”; in 35:21 the subject is the spirit'
    key: bdb
    url: 'https://biblehub.com/hebrew/5068.htm'
    quote: 'Exodus 25:2 whose heart incited compare Exodus 35:29; subject'
  - where: 'note 35:5 “A willing heart”'
    claim: 'The verb occurs three times in Exodus: 25:2; 35:21; 35:29'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'נָדְבָ֨ה'
  - where: 'note 35:5 “A willing heart”'
    claim: 'The Church’s footnote gives “freewill” for “willing” in verse 29'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/35?lang=eng'
    quote: 'OR freewill.'
  - where: 'note 35:5 “A willing heart”'
    claim: 'The noun (H5071) is used of the gifts for building and furnishing the tabernacle'
    key: bdb
    url: 'https://biblehub.com/hebrew/5071.htm'
    quote: 'a. including gifts used in erection and furnishing of tabernacle Exodus 35:29; Exodus 36:3 (P)'
  - where: 'note 35:5 “A willing heart”'
    claim: 'The right attitude was required for the offering to do Israel good; the manual explains it from Moroni 7:6–10'
    key: ot-manual-ex-25-30
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-25-30-35-40-the-house-of-the-lord-in-the-wilderness?lang=eng'
    quote: 'Mormon taught that if a gift of sacrifice is offered to the Lord with a grudging attitude, not only is it not acceptable to the Lord, but it becomes an evil act (see Moroni 7:6–10). Unless Israel had the right attitude about the sacrifice of their materials, it would do them no good.'
  - where: 'note 35:5 “A willing heart”'
    claim: 'The Church’s footnote to “willing” in verse 5 points to D&C 64:34'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/35?lang=eng'
    quote: 'D&C 59:15; 64:22, 34.'
  - where: 'note 35:5 “A willing heart”'
    claim: 'The same verb is used of the freewill offerings for the first temple in 1 Chronicles 29'
    key: bdb
    url: 'https://biblehub.com/hebrew/5068.htm'
    quote: '2 offer freewill-offerings for the first temple 1 Chronicles 29:5,6,9 (twice in verse)'

  # ---------- note 35:22 ----------
  - where: 'note 35:22 “The gold the people brought”'
    claim: 'A modern translation of the four ornaments'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2035&version=NRSVUE'
    quote: 'all who were of a willing heart brought brooches and earrings and signet rings and pendants, all sorts of gold objects'
  - where: 'note 35:22 “The gold the people brought”'
    claim: 'The word behind “tablets” (H3558) is defined only as the name of a golden ornament'
    key: bdb
    url: 'https://biblehub.com/hebrew/3558.htm'
    quote: 'name of a golden ornament'
  - where: 'note 35:22 “The gold the people brought”'
    claim: 'Israel left Egypt with jewels of silver and gold'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/12?lang=eng'
    quote: 'and they borrowed of the Egyptians jewels of silver, and jewels of gold, and raiment'
  - where: 'note 35:22 “The gold the people brought”'
    claim: 'After the calf the people stripped off their ornaments'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/33?lang=eng'
    quote: 'And the children of Israel stripped themselves of their ornaments by the mount Horeb.'
  - where: 'note 35:22 “The gold the people brought”'
    claim: 'A Latter-day Saint commentary on 33:4–6 notes that the people also gave their jewelry for the tabernacle (35:22)'
    key: ot-minute-ex-24
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-24-28-31-34'
    quote: 'In Exodus 35:22, we read that the children of Israel also gave up their jewelry to contribute it to the building of the future tabernacle.'

  # ---------- note 35:25 ----------
  - where: 'note 35:25 “The women who spun”'
    claim: '“Wise hearted” and “wisdom” are technical skill, as in verse 10 and 28:3'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/35.htm'
    quote: '‘Wise hearted,’ and ‘wisdom,’ of technical skill; cf. v. 10, and on Exodus 28:3.'
  - where: 'note 35:25 “The women who spun”'
    claim: 'The women spun linen (v. 25) and coarser material (v. 26)'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/35.htm'
    quote: 'The special contributions of the women. The women spun yarn, both of linen (v. 25) and coarser (v. 26) materials.'
  - where: 'note 35:25 “The women who spun”'
    claim: 'Spinning goats’ hair into yarn for tent coverings was still women’s work in the East when the commentary was written'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/35.htm'
    quote: 'Spinning is still in the East the work of women: and both in the Sin. Peninsula and elsewhere women still spin camels’ and goats’ hair into the coarse yarn out of which tent-coverings are woven.'
  - where: 'note 35:25 “The women who spun”'
    claim: 'The goats’ hair was for the curtains covering the tabernacle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/26?lang=eng'
    quote: 'And thou shalt make curtains of goats’ hair to be a covering upon the tabernacle: eleven curtains shalt thou make.'
  - where: 'note 35:25 “The women who spun”'
    claim: 'The laver was made of the mirrors of the women who assembled at the door of the tabernacle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/38?lang=eng'
    quote: 'And he made the laver of brass, and the foot of it of brass, of the lookingglasses of the women assembling, which assembled at the door of the tabernacle of the congregation.'

  # ---------- note 35:34 ----------
  - where: 'note 35:34 “Called to teach as well as to build”'
    claim: 'A modern translation: he has inspired him to teach'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%2035&version=NRSVUE'
    quote: 'And he has inspired him to teach, both him and Oholiab son of Ahisamach, of the tribe of Dan.'
  - where: 'note 35:34 “Called to teach as well as to build”'
    claim: 'The Church’s footnote sends Bezaleel’s calling back to 31:2–6, where teaching is not named'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/35?lang=eng'
    quote: 'Ex. 31:2 (2–6).'
  - where: 'christ'
    claim: 'The tabernacle was to be a sanctuary where the Lord could dwell among His people'
    key: scripture-helps-ex-35
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/16-exodus-35-40-leviticus-1-4-16-19?lang=eng'
    quote: 'The tabernacle was to be a sanctuary where the Lord could dwell among His people.'
  - where: 'christ'
    claim: 'Temples in this dispensation, like ancient ones, are built by the sacrifice and consecration of the people'
    key: sc-knowhy-806
    url: 'https://scripturecentral.org/knowhy/how-does-the-construction-of-the-kirtland-temple-follow-ancient-patterns'
    quote: 'Temples in both antiquity and this dispensation are built from the finest materials available through the sacrifice and consecration of the people.'
  - where: 'christ'
    claim: 'The Kirtland Temple’s dedicatory prayer says the Saints gave out of their poverty to build a house where the Son of Man might manifest himself'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/109?lang=eng'
    quote: 'out of our poverty we have given of our substance to build a house to thy name, that the Son of Man might have a place to manifest himself to his people.'

  # ---------- explore ----------
  - where: 'explore'
    claim: 'In 1 Chronicles 29 the leaders and people offer willingly for the temple'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/29?lang=eng'
    quote: 'Then the people rejoiced, for that they offered willingly, because with perfect heart they offered willingly to the Lord: and David the king also rejoiced with great joy.'
