chapter: 8
claims:
  - where: 'when'
    claim: 'Moses was eighty and Aaron eighty-three when they spoke to Pharaoh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/7?lang=eng'
    quote: 'And Moses was fourscore years old, and Aaron fourscore and three years old, when they spake unto Pharaoh.'
  - where: 'setting'
    claim: 'The lexicon cites this chapter by the Hebrew numbering, four verses lower: King James 8:26 is Hebrew 8:22'
    key: bdb
    url: 'https://biblehub.com/hebrew/8441.htm'
    quote: 'a. Israel''s sacrifices, מִצְרַיִם ׳ת (genitive object) Exodus 8:22 (twice in verse) (E), compare Genesis 46:34 (J); למצרים ׳ת Genesis 43:32 (J)'
  - where: 'thread'
    claim: 'One reading: calamities like these were what the king was supposed to prevent, and their unrelenting sequence could be seen as chaos triumphing over order'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'These calamities as individual catastrophes were just the sort of thing that the king was supposed to prevent, but their arrival in an unrelenting sequence could be seen as nothing short of chaos triumphing over order.'
  - where: 'thread'
    claim: 'In the frogs, lice and flies the whole known world, down to its smallest elements, seems to rise against the king'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'They represent familiar elements of the known world, and it is the whole of the known world, down to the most minute elements, that seems to be rising up against the king and Egypt in a chaotic manner.'
  - where: 'section 2 plain'
    claim: '“Glory over me” is a polite address giving Pharaoh the honor of deciding when'
    key: bdb
    url: 'https://biblehub.com/hebrew/6286.htm'
    quote: 'as polite address to king, Imperative masculine singular הִתְמָּאֵר Exodus 8:5 (J), assume the honour over me (to decide) when, etc.'
  - where: 'section 3 plain'
    claim: 'The “lice” of the third plague may be gnats'
    key: bdb
    url: 'https://biblehub.com/hebrew/3654.htm'
    quote: 'noun [masculine], meaning dubious; either gnat, gnats, gnat-swarm'
  - where: 'section 4 plain'
    claim: '“Corrupted” in verse 24 is Hebrew “ruined”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/8?lang=eng'
    quote: '“corrupted”: HEB ruined.'
  - where: 'section 5 plain'
    claim: '“Is not meet” may be rendered “would not be right,” and “the abomination of” as “things abominable to”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/8?lang=eng'
    quote: '“the abomination of”: OR things abominable to.'

  - where: 'note 8:2 “Why frogs”'
    claim: 'Heket was a frog-headed goddess, consort of the creator god Khnum, whose work included controlling the multiplication of frogs; overpowering her domain can be seen as an indirect challenge of the king'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'Khnum’s consort is Heket, a frog-headed goddess whose job, among other things, was to control the multiplication of frogs by protecting frog-eating crocodiles.[68] Overpowering the domain of the creator’s consort can be seen as an indirect challenge of the king.'
  - where: 'note 8:2 “Why frogs”'
    claim: 'The goddess was supposed to keep the frog population from getting out of control'
    key: sc-knowhy-631
    url: 'https://scripturecentral.org/knowhy/why-were-particular-plagues-sent-against-egypt'
    quote: 'The goddess Hekhet (depicted with a frog head) was supposed to control and manage the frog population and prevent it from getting unwieldy and out of control.'
  - where: 'note 8:2 “Why frogs”'
    claim: 'For the frogs and the two plagues after them, Egyptian literature offers no substantial references'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'The next three plagues are problematic to the current approach, or to any approach that tries to tie them in with the king or deity. There simply are not substantial references to anything having to do with these plagues in Egyptian literature.'
  - where: 'note 8:2 “Why frogs”'
    claim: 'The challenge to the king is better seen as a challenge to order'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'However, the nature of this challenge to the king is probably better seen in light of the overall challenge to ma’at that will be presented below.'
  - where: 'note 8:2 “Why frogs”'
    claim: 'Maintaining order was one of Pharaoh''s two main duties'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'Pharaoh both failed to maintain order and failed to destroy its enemies—his two main duties.'
  - where: 'note 8:2 “Why frogs”'
    claim: 'Too many frogs is listed among the elements of disorder'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'Contaminated water, too many frogs, various insect infestations, disease among humans and animals, storms, loss of crops, the sun being darkened, and loss of human life are all elements of disorder that touch on every aspect of Egyptian life.'
  - where: 'note 8:2 “Why frogs”'
    claim: 'In a natural account of the plagues, frogs leave the banks for dry land after the flooding'
    key: sc-knowhy-631
    url: 'https://scripturecentral.org/knowhy/why-were-particular-plagues-sent-against-egypt'
    quote: 'In response to the flooding and reddening waters, frogs would leave the marshy banks and invade the dry land.'
  - where: 'note 8:2 “Why frogs”'
    claim: 'The natural account ties the frogs to years of extremely high flooding of the Nile'
    key: sc-knowhy-631
    url: 'https://scripturecentral.org/knowhy/why-were-particular-plagues-sent-against-egypt'
    quote: 'In years of extremely high flooding'

  - where: 'note 8:9 “Glory over me: a courtesy to the king”'
    claim: 'The verb in Moses''s phrase is a reflexive form of the verb “to glorify”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'הִתְפָּאֵ֣ר'
  - where: 'note 8:9 “Glory over me: a courtesy to the king”'
    claim: 'The form means “glorify oneself,” with “over” a person “boast” (Judges 7:2), and here it is a polite address to a king'
    key: bdb
    url: 'https://biblehub.com/hebrew/6286.htm'
    quote: 'Hithpa`el 1. glorify oneself, with עַל person: = boast, Imperfect3masculine singular יִתְמָּאֵר Judges 7:2; Isaiah 10:15; as polite address to king, Imperative masculine singular הִתְמָּאֵר Exodus 8:5 (J), assume the honour over me (to decide) when, etc.'
  - where: 'note 8:9 “Glory over me: a courtesy to the king”'
    claim: 'Letting Pharaoh choose the time perhaps made it clear that the removal was no coincidence'
    key: scripture-helps-ex-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/13-exodus-7-13?lang=eng'
    quote: 'By allowing Pharaoh to choose when the plague would end, Moses was perhaps making it clear that the removal of the plague was not by coincidence but by the power of God.'

  - where: 'note 8:16 “Lice or gnats, and the swarms of the fourth plague”'
    claim: 'The Hebrew words for the creatures of the third and fourth plagues have been translated many ways'
    key: muhlestein-pharaoh
    url: 'https://rsc.byu.edu/creation-sinai/what-i-will-do-pharaoh'
    quote: 'These terms have been taken to mean gnats, flies, lice, mosquitos, dog flies, maggots, and beetles.'
  - where: 'note 8:16 “Lice or gnats, and the swarms of the fourth plague”'
    claim: 'The meaning of the word for the third plague is doubtful: gnats (most moderns, with Philo and Origen) or lice (with Josephus)'
    key: bdb
    url: 'https://biblehub.com/hebrew/3654.htm'
    quote: 'noun [masculine], meaning dubious; either gnat, gnats, gnat-swarm (so ᵐ5 ᵑ9 … and most moderns), or [louse,] lice (so ᵑ6 ᵑ7 JosAnt. ii. 14. 13'
  - where: 'note 8:16 “Lice or gnats, and the swarms of the fourth plague”'
    claim: 'A modern translation reads “gnats” in verse 16'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%208&version=NRSVUE'
    quote: 'Stretch out your staff and strike the dust of the earth, so that it may become gnats throughout the whole land of Egypt.'
  - where: 'note 8:16 “Lice or gnats, and the swarms of the fourth plague”'
    claim: 'One Hebrew word stands behind “swarms of flies” in verse 21'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'הֶ/עָרֹ֑ב'
  - where: 'note 8:16 “Lice or gnats, and the swarms of the fourth plague”'
    claim: 'The word for the fourth plague probably means “swarm,” used of stinging flies'
    key: bdb
    url: 'https://biblehub.com/hebrew/6157.htm'
    quote: 'probably swarm (mixture, from incessant, involved motion; LagBN 112 doubts); — of plague of stinging flies, coming in a swarm'
  - where: 'note 8:16 “Lice or gnats, and the swarms of the fourth plague”'
    claim: 'The Septuagint names the insect of the fourth plague the dog-fly'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/exodus/8.htm'
    quote: 'behold, I send upon thee, and upon thy servants, and upon thy people, and upon your houses, the dog-fly; and the houses of the Egyptians shall be filled with the dog-fly'
  - where: 'note 8:16 “Lice or gnats, and the swarms of the fourth plague”'
    claim: 'The fourth plague is presumed to be a biting fly such as the dog fly'
    key: sc-knowhy-631
    url: 'https://scripturecentral.org/knowhy/why-were-particular-plagues-sent-against-egypt'
    quote: 'Presumably a biting fly, such as the dog fly, which likewise could flourish after all the frogs died off.'

  - where: 'note 8:19 “The finger of God”'
    claim: 'The magicians say Elohim, “God,” not the name the King James renders “the LORD”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'אֶצְבַּ֥ע אֱלֹהִ֖ים הִ֑וא'
  - where: 'note 8:19 “The finger of God”'
    claim: 'One older reading: had the magicians meant the God of Israel they would have said Jehovah'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/8.htm'
    quote: 'The word Elohim is decisive in support of this view. If they had meant to refer to the God of Israel, they would have used the name Jehovah.'
  - where: 'note 8:19 “The finger of God”'
    claim: 'On that reading the magicians saw the work of some deity, and so a distinction between Israel and Egypt was made in the plagues that followed'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/8.htm'
    quote: 'the Egyptian magicians saw nothing more than the finger of God in the miracle which they could not imitate, that is to say, the work of some deity, possibly one of the gods of the Egyptians … a distinction was made in the plagues which followed between the Israelites and the Egyptians'
  - where: 'note 8:19 “The finger of God”'
    claim: 'The Church''s footnote at “finger” gives Luke 11:20 first'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/8?lang=eng'
    quote: '“finger”: Luke 11:20; John 3:2; Acts 2:22; 10:38; 1 Ne. 19:22; Alma 23:6; D&C 84:3; 121:12.'

  - where: 'note 8:22 “Goshen set apart”'
    claim: 'From the plague of flies on, the plagues distinguish between Israel and Egypt'
    key: brown-exodus-type
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/02/the-exodus-seeing-it-as-a-test-a-testimony-and-a-type?lang=eng'
    quote: 'Thus, beginning with the plague of the flies, the plagues that ravaged Egypt made a clear distinction between the Israelite slaves and the Egyptians. (See Ex. 8:23; Ex. 9:4–7.)'
  - where: 'note 8:22 “Goshen set apart”'
    claim: 'Goshen was the part of Egypt where Israel lived, probably in the eastern delta'
    key: bd-goshen
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/goshen?lang=eng'
    quote: 'The part of Egypt in which the Israelites dwelt. It contained pasture land (Gen. 46:33–34) and lay somewhere between Palestine and the capital of Egypt (46:28–29), probably in the eastern part of the delta of the Nile.'
  - where: 'note 8:22 “Goshen set apart”'
    claim: '“Sever” is a verb for making separate by treating differently'
    key: bdb
    url: 'https://biblehub.com/hebrew/6395.htm'
    quote: 'of ׳י, make separate, with accusative Exodus 8:18 (by treating differently)'
  - where: 'note 8:22 “Goshen set apart”'
    claim: 'The Hebrew noun behind “division” in verse 23 is peduth'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'פְדֻ֔ת'
  - where: 'note 8:22 “Goshen set apart”'
    claim: 'The noun means “ransom” and is the word in Psalm 111:9'
    key: bdb
    url: 'https://biblehub.com/hebrew/6304.htm'
    quote: 'noun feminine ransom; ׳פ Psalm 111:9 2t.'
  - where: 'note 8:22 “Goshen set apart”'
    claim: 'The lexicon renders the clause “I will set a ransom (distinguishing)” and calls it improbable and the text dubious'
    key: bdb
    url: 'https://biblehub.com/hebrew/6304.htm'
    quote: 'Exodus 8:19 I will set a ransom (distinguishing) between my people and thy people ᵑ7, but improbable and text dubious; ᵐ5 ᵑ6 ᵑ9 set a distinction (reading what ?).'
  - where: 'note 8:22 “Goshen set apart”'
    claim: 'The Septuagint has “a difference” in verse 23'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/exodus/8.htm'
    quote: 'And I will put a difference between my people and thy people, and on the morrow shall this be on the land.'
  - where: 'note 8:22 “Goshen set apart”'
    claim: 'A modern translation has “a distinction” in verse 23'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%208&version=NRSVUE'
    quote: 'Thus I will make a distinction between my people and your people. This sign shall appear tomorrow.'
  - where: 'note 8:22 “Goshen set apart”'
    claim: 'A modern translation reads “in this land” for “in the midst of the earth”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Exodus%208&version=NRSVUE'
    quote: 'that you may know that I the Lord am in this land.'
  - where: 'note 8:22 “Goshen set apart”'
    claim: 'The Septuagint reads “the God of all the earth”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/exodus/8.htm'
    quote: 'that thou mayest know that I am the Lord the God of all the earth.'
  - where: 'note 8:22 “Goshen set apart”'
    claim: 'A natural account has Goshen geographically shielded from the swarms'
    key: sc-knowhy-631
    url: 'https://scripturecentral.org/knowhy/why-were-particular-plagues-sent-against-egypt'
    quote: 'Goshen, where the Hebrews lived, was geographically shielded from the swarms of flies in the main Nile Valley.'
  - where: 'note 8:22 “Goshen set apart”'
    claim: 'That the plagues were selective adds to their miraculous nature'
    key: ot-manual-ex-1-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-1-10-let-my-people-go?lang=eng'
    quote: 'The fact that the plagues were selective (that is, sent upon the Egyptians but not the Israelites) adds to their miraculous nature.'

  - where: 'note 8:26 “What the Egyptians would not bear to see”'
    claim: 'The word “abomination” is used here of Israel''s sacrifices, as of the Egyptians'' aversion in Genesis 46:34 and 43:32'
    key: bdb
    url: 'https://biblehub.com/hebrew/8441.htm'
    quote: 'a. Israel''s sacrifices, מִצְרַיִם ׳ת (genitive object) Exodus 8:22 (twice in verse) (E), compare Genesis 46:34 (J); למצרים ׳ת Genesis 43:32 (J)'
  - where: 'note 8:26 “What the Egyptians would not bear to see”'
    claim: 'One answer: cows were sacred to the Egyptians'
    key: ot-minute-ex-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-7-13'
    quote: 'However, the Egyptians detested the sacrifices (particularly of cows) that the people of Israel offered. According to Moses, the people of Egypt would stone those that offered such sacrifices, as cows were sacred to the Egyptians.'
  - where: 'note 8:26 “What the Egyptians would not bear to see”'
    claim: 'One older commentary: animals the Egyptians held it unlawful to sacrifice, such as the cow, sacred to Isis'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/8.htm'
    quote: 'the abomination of the Egyptians] i.e. animals which the Egyptians deemed it unlawful to sacrifice, and the sacrifice of which would consequently shock them: as the cow (which was sacred to Isis), the bull'
  - where: 'note 8:26 “What the Egyptians would not bear to see”'
    claim: 'Another older reading denies that the offense lay in the animals, since only the cow among Israel''s offerings was sacred in Egypt'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/8.htm'
    quote: 'The abomination referred to did not consist in their sacrificing animals which the Egyptians regarded as holy. … Moreover, the cow was the only animal offered in sacrifice by the Israelites, which the Egyptians regarded as sacred.'
  - where: 'note 8:26 “What the Egyptians would not bear to see”'
    claim: 'That reading puts the offense in the manner of sacrifice'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/8.htm'
    quote: 'would not carry out the rigid regulations observed by the Egyptians with regard to the cleanness of the sacrificial animals (vid., Hengstenberg, p. 114), and in fact would not observe the sacrificial rites of the Egyptians at all.'

  - where: 'christ'
    claim: 'The Church''s footnote at “none” in verse 10 gives D&C 76:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/8?lang=eng'
    quote: '“none”: D&C 76:1 (1–2).'
  - where: 'explore'
    claim: 'The purpose “that thou mayest know” is stated at Exodus 7:5; 8:22; 9:14, 29; 14:4, 18'
    key: scripture-helps-ex-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/13-exodus-7-13?lang=eng'
    quote: 'Exodus 7:5. See also Exodus 8:22; 9:29; 14:4, 18.'
