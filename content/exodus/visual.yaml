summary: >-
  Exodus is the way out of Egypt and the year at Sinai, and it ends where the Lord's
  promise to dwell among His people is kept: a tent pitched in the middle of the camp
  with His glory resting on it. The book's center is Jehovah, who redeems a people,
  makes covenant with them on the mountain, and comes to live among them.
look: >-
  Photo-realistic: what a large-format landscape photograph taken in clear, low morning
  light would show. Real desert terrain, real woven cloth and hide, real sea water, true
  scale and natural color, sharp from foreground to horizon. Not an illustration, a
  poster, a cartoon or a painting: no simplified or faceted shapes, no flat areas of
  color, no fantasy glow, no lens blur.
motifs:
  - "Primary: one ancient desert tent standing alone on open wilderness ground: long, low and rectangular with a nearly flat roof, covered in dark woven goat hair and weathered reddish-brown hides, held by plain ropes and pegs, its narrow end closed by a single curtain of deep blue, purple and scarlet cloth. It is large and plain, with no ornament, no stripes and no peaked roof; it must not look like a modern marquee or a circus tent."
  - "Primary: one low, dense, natural cloud resting directly on the tent's roof and nowhere else in a clear sky, lit warm gold from within the way a cloud is lit by the sun behind it, its light falling softly on the ground around the tent."
  - "Supporting: far off at the left edge, the sea stands apart in two steep walls of real water with one straight strip of wet seabed between them, small in the distance; a faint worn track leads from it across the plain toward the tent."
  - "Supporting: one broad, bare granite mountain far behind the tent, steady and quiet, with no fire, lightning or smoke on it."
composition: >-
  A wide, low horizon. The tent with its resting cloud sits just right of center as the
  one clear focal point, with open, empty ground around it. The mountain rises behind it,
  darker and quieter than the cloud. At the far left edge the parted sea is small and
  distant, and the faint track runs from it across the plain. Few, large things: open
  ground left open, no rows of bushes or scattered boulders. One light: the low morning
  sun behind the viewer's right shoulder, so shadows fall to the left and away; the only
  other light is the cloud's own warm glow on the tent and the ground beside it. No
  figures, no animals, no furnishings, no buildings.
alt: A long, low desert tent with a golden cloud resting on its roof stands on open wilderness ground, with a bare mountain behind it and the parted sea small in the distance at the left.
status: proposed
