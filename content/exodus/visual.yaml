summary: >-
  Exodus is the way out of Egypt and the year at Sinai, and it ends where the Lord's
  promise to dwell among His people is kept: a tent pitched in the middle of the camp
  with His glory resting on it. The book's center is Jehovah, who redeems a people,
  makes covenant with them on the mountain, and comes to live among them.
look: >-
  A realistic painted illustration, as a skilled landscape illustrator would paint a
  full-page plate in gouache for a fine book: true proportions and scale, natural color,
  believable light and cast shadows, real-looking cloth, bronze, rock and water. It is
  plainly a painting and not a photograph: forms are slightly simplified, surfaces are
  smooth washes of color with little fine texture (no gravel, pebbles or grain picked out
  one by one), and edges are clean and soft. It is not a cartoon or a flat poster either:
  no outlines, no faceted or stylized shapes, no exaggerated color.
motifs:
  - "Primary: the tabernacle, one ancient desert tent: long, low and rectangular with a nearly flat roof, covered in dark woven goat hair and weathered reddish-brown hides, held by plain ropes and pegs. Its narrow east end, facing the viewer's side, is closed by one single curtain woven all over of blue, purple and scarlet thread together, one cloth of one mingled color, not separate colored panels and not stripes."
  - "Primary: the outer court around it: a large rectangular enclosure, about twice as long as it is wide, fenced by a continuous waist-to-head-high wall of plain white linen hangings stretched between evenly set wooden posts. The tent stands in the far half of the enclosure; the near half is open ground. The fence has one opening in the middle of its near short side."
  - "Primary: in the open near half of the court, on the line between the fence's opening and the tent's door, one square altar of weathered bronze, about chest high and a little wider than it is tall, with a short upturned horn at each of its four top corners and a thin thread of pale smoke rising straight from it."
  - "Primary: between the altar and the tent's door, on the same line, the laver: one wide, shallow, round basin of polished bronze holding still water, set on a short round bronze foot, about waist high and clearly smaller than the altar. Nothing else stands in the court."
  - "Primary: one low, soft, natural cloud sitting directly on the tent's roof, touching it along its whole length, and nowhere else in a clear sky, white and pale gold like a cloud with the morning sun in it, calm and still. It is a cloud, not fire, not smoke and not an explosion; it has no bright burning core."
  - "Supporting: in the middle distance at the upper left, the sea is parted: two tall, sheer, still walls of dark blue water standing upright like cliffs, with one straight strip of dry sand running between them to the horizon. The walls are smooth and vertical with level tops; they are not breaking waves and have no curling crests, surf or spray."
  - "Supporting: in the middle distance at the left, beyond the court and at the foot of the mountain's lowest slope, one single tall crag of bare reddish granite split by one vertical cleft; a white ribbon of water falls from the cleft and runs as one narrow bright stream across the plain toward the left. It is the only water on the ground. It is in the middle distance, never in the foreground, and is smaller in the picture than the tent."
  - "Supporting: one broad, bare granite mountain far behind the tent, steady and quiet, with no fire, lightning or smoke on it."
composition: >-
  A wide landscape seen from a rise some distance off, high enough that the viewer looks
  down and over the near fence into the court. The whole court is inside the picture with
  open desert on every side of it: all four sides of the linen fence and all four corners
  are visible, and no part of the fence touches or is cut by any edge of the frame. The
  court lies in the foreground, right of center, and takes up about half the picture's width, set at a
  slight angle: its near short side with the opening toward the lower left, then the
  bronze altar, then the smaller laver, then the tent with the cloud on its roof. The
  mountain rises behind, darker and quieter than the cloud. In the upper left, in the
  middle distance and plainly visible, is the parted sea: its two walls of water stand
  tall and sheer like long cliffs, about a tenth of the picture's height, with the dry
  strip between them running straight to the horizon. The court is the foreground: nothing stands between it and the viewer but open sand.
  Beyond the court's far left corner, in the middle distance below the mountain, is the
  one split crag with its falling water and stream, between the court and the distant
  sea. The rest of the desert ground is left open: no rows of
  bushes, no other boulders or scattered stones, no other tents. One light: the low morning sun
  behind the viewer's right shoulder, so shadows fall to the left and away; the cloud adds
  only a soft warm light on the tent roof beneath it. No figures, no animals, no other
  furnishings, no buildings.
alt: A long, low desert tent with a pale golden cloud resting on its roof stands inside a courtyard fenced with white linen, a bronze altar and a smaller bronze basin in the open court before it; a bare mountain rises behind, and the parted sea lies in the distance at the left, and between them water falls from a split rock at the mountain's foot.
status: proposed
