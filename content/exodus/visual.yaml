summary: >-
  Exodus is the way out of Egypt and the year at Sinai, and it ends where the Lord's
  promise to dwell among His people is kept: a tent pitched in the middle of the camp
  with His glory resting on it. The book's center is Jehovah, who redeems a people,
  makes covenant with them on the mountain, and comes to live among them.
look: >-
  A realistic painted illustration, as a skilled landscape illustrator would paint a
  full-page plate in gouache for a fine book: true proportions and scale, natural color,
  believable light and cast shadows, real-looking cloth, bronze, rock and water. It is
  plainly a painting and not a photograph: forms are slightly simplified, surfaces are
  smooth washes of color with little fine texture (no gravel, pebbles or grain picked out
  one by one), and edges are clean and soft. It is not a cartoon or a flat poster either:
  no outlines, no faceted or stylized shapes, no exaggerated color.
motifs:
  - "Primary: the tabernacle, a long, low, flat-roofed tent covered in dark goat hair and reddish hides, its east end closed by a curtain of blue, purple and scarlet."
  - "Primary: the outer court around it, fenced with white linen hangings on wooden posts, with one opening in its near short side; the whole court is inside the picture."
  - "Primary: in the court, on the line from the opening to the tent's door, the square bronze altar of burnt offering with a horn at each corner and a thread of smoke, and behind it the smaller round bronze laver holding water."
  - "Primary: one soft white-gold cloud resting on the tent's roof and nowhere else."
  - "Supporting: in the middle distance at the left, at the mountain's foot, a split crag with water falling from its cleft and a stream running off across the plain."
  - "Supporting: far off at the left, the parted sea, two walls of water with a dry road between them."
  - "Supporting: one broad, bare granite mountain behind the tent, with no fire or smoke on it."
composition: >-
  A wide landscape seen from a rise, looking down and over the near fence into the court,
  which is the foreground and lies right of center. From left to right the picture follows
  the book: the parted sea, the rock and its water, the mountain, the tabernacle with the
  cloud on it. Open sand around the court. One light, the low morning sun from behind the
  viewer's right, shadows falling to the left; the cloud adds a soft warm light on the
  tent roof. No figures, animals or buildings.
