summary: >-
  Exodus is the way out of Egypt and the year at Sinai, and it ends where the Lord's
  promise to dwell among His people is kept: a tent pitched in the middle of the camp
  with His glory resting on it. The book's center is Jehovah, who redeems a people,
  makes covenant with them on the mountain, and comes to live among them.
look: >-
  Photo-realistic: what a large-format landscape photograph taken in clear, low morning
  light would show. Real desert terrain, real woven cloth and hide, real sea water, true
  scale and natural color, sharp from foreground to horizon. Not an illustration, a
  poster, a cartoon or a painting: no simplified or faceted shapes, no flat areas of
  color, no fantasy glow, no lens blur.
motifs:
  - "Primary: the tabernacle, one ancient desert tent: long, low and rectangular with a nearly flat roof, covered in dark woven goat hair and weathered reddish-brown hides, held by plain ropes and pegs. Its narrow east end, facing the viewer's side, is closed by one single curtain woven all over of blue, purple and scarlet thread together, one cloth of one mingled color, not separate colored panels and not stripes."
  - "Primary: the outer court around it: a large rectangular enclosure, about twice as long as it is wide, fenced by a continuous waist-to-head-high wall of plain white linen hangings stretched between evenly set wooden posts. The tent stands in the far half of the enclosure; the near half is open ground. The fence has one opening in the middle of its near short side."
  - "Primary: in the open near half of the court, on the line between the fence's opening and the tent's door, one square altar of weathered bronze, about chest high and a little wider than it is tall, with a short upturned horn at each of its four top corners and a thin thread of pale smoke rising straight from it."
  - "Primary: between the altar and the tent's door, on the same line, the laver: one wide, shallow, round basin of polished bronze holding still water, set on a short round bronze foot, about waist high and clearly smaller than the altar. Nothing else stands in the court."
  - "Primary: one low, soft, natural cloud resting on the tent's roof and nowhere else in a clear sky, white and pale gold like a cloud with the morning sun in it, calm and still. It is a cloud, not fire, not smoke and not an explosion; it has no bright burning core."
  - "Supporting: far off at the left edge, small in the distance, the sea is parted: two tall, sheer, still walls of dark blue water standing upright like cliffs, with one straight strip of dry sand running between them to the horizon. The walls are smooth and vertical with level tops; they are not breaking waves and have no curling crests, surf or spray."
  - "Supporting: one broad, bare granite mountain far behind the tent, steady and quiet, with no fire, lightning or smoke on it."
composition: >-
  A wide landscape seen from a low rise, so that the viewer looks slightly down and over
  the near fence into the court. The court lies just right of center, set at a slight
  angle: its near short side with the opening toward the lower left, the bronze altar in
  the open ground inside, the smaller bronze laver between it and the tent, the tent beyond with the cloud on its roof. The mountain
  rises behind, darker and quieter than the cloud. At the far left edge the parted sea is
  small and distant. Open desert ground around the court is left open: no rows of bushes,
  no scattered boulders, no other tents. One light: the low morning sun behind the
  viewer's right shoulder, so shadows fall to the left and away; the cloud adds only a
  soft warm light on the tent roof beneath it. No figures, no animals, no other
  furnishings, no buildings.
alt: A long, low desert tent with a pale golden cloud resting on its roof stands inside a courtyard fenced with white linen, a bronze altar and a smaller bronze basin in the open court before it; a bare mountain rises behind, and the parted sea is small in the distance at the left.
status: proposed
