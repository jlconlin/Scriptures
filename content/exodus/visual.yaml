summary: >-
  Exodus is the way out of Egypt and the year at Sinai, and it ends where the Lord's
  promise to dwell among His people is kept: a tent pitched in the middle of the camp
  with His glory resting on it. The book's center is Jehovah, who redeems a people,
  makes covenant with them on the mountain, and comes to live among them.
motifs:
  - "Primary: a single plain tent of woven cream and warm clay cloth, with a gently pitched roof and a closed front curtain, standing alone on open wilderness ground. A soft cloud rests low over it, lit from within by restrained gold light that spills quietly onto the ground around the tent. No figures, no furnishings visible, no ornament beyond the tent's simple shape."
  - "Supporting: a narrow path of pale dry ground that crosses a calm, deep indigo sea at the far left, the water standing in still, smooth banks on either side of the path, then continues as a worn track across the plain toward the tent."
  - "Supporting: a broad, dark, flat-topped mountain far behind the tent, steady and quiet under a clear sky, with no fire, lightning, or smoke on it."
composition: >-
  A wide, low horizon. The tent with its resting cloud sits just right of center as the
  one clear focal point, with open, empty ground around it. The mountain rises behind it
  as a calm indigo-olive mass, much smaller in contrast than the tent's glow. At the far
  left edge the still sea and its dry path begin, and the path runs gently across the
  plain, widening toward the tent in the foreground. Clay and olive ground, a parchment
  cream sky warming to gold above the cloud. The mood is arrival and rest, never storm
  or spectacle.
alt: A single tent with a soft golden cloud resting over it stands on open wilderness ground, with a dark mountain behind it and a path crossing a calm sea at the far left.
status: proposed
