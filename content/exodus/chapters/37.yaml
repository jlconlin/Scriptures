chapter: 37
title: The Ark and the Furniture of the Holy Place Made
tagline: Bezaleel makes the ark and its mercy seat, the table, the candlestick and the altar of incense, each as the LORD had described it on the mountain, and the holy oil and incense with them.
when: 'In the first year after Israel left Egypt, while the tabernacle was being made; it was set up on the first day of the second year (40:17).'

setting: |
  The people have brought their offerings, more than the work needed ([[Ex. 36:5–7]]), and the craftsmen have made the tent itself: its curtains, its boards, and its veil ([[Ex. 36:8–38]]). This chapter tells of the making of what will stand inside it. Bezaleel, the craftsman the LORD called by name (see [[Ex. 31:2]]), makes the ark and the mercy seat for the most holy place, then the table, the candlestick, and the altar of incense for the holy place, and last the anointing oil and the incense.

  Each of these was described to Moses on the mountain, and the explanations are there: the ark at [[Ex. 25:10]], the mercy seat and its cherubim at [[Ex. 25:17]], the table at [[Ex. 25:23]], the candlestick at [[Ex. 25:31]], the altar of incense at [[Ex. 30:1]], the oil at [[Ex. 30:25]], and the incense at [[Ex. 30:34]]. The King James words that mislead are explained there too: “shittim” at [[Ex. 25:5]], “crown” at [[Ex. 25:10]], the “covers” of the table at [[Ex. 25:30]], and “candlestick,” “bowls,” and “knops” at [[Ex. 25:31]].

  Nothing made here is used yet. The furniture is carried into the tent and put to its work in chapter 40.

  Hebrews looks back on these pieces room by room: in the first, “the candlestick, and the table, and the shewbread” ([[Heb. 9:2]]); behind the second veil, the ark ([[Heb. 9:3–4]]).

thread: |
  Almost every sentence of this chapter has been read before. It repeats the instructions of chapters 25 and 30 nearly word for word, with the tenses changed: “thou shalt make” has become “he made.” Why the account is told twice is taken up at [[Ex. 35:1]].

  What is worth a reader’s attention is the little that changes.

  Some sentences are missing. The instructions said what each piece was for: the testimony was to go into the ark, bread was to be set on the table, the lamps were to be lit, incense was to be burned morning and evening. None of that is here. In one older reading the verses left out are those “chiefly relating to the position or use of the different vessels,” and they come back in the account of the setting up, “where they actually belong.” There the testimony is put into the ark ([[Ex. 40:20]]), the bread is set out ([[Ex. 40:23]]), the lamps are lit ([[Ex. 40:25]]), and incense is burned on the golden altar ([[Ex. 40:27]]). The promise attached to the mercy seat, “there I will meet with thee” ([[Ex. 25:22]]), is not repeated either. This chapter is about making and nothing else.

  A few things are added or moved, and the notes take them up. A maker is named (verse 1). The altar of incense is made beside the table and the candlestick (verse 25). And the oil and the incense are reported in a single verse (verse 29).

sections:
  - range: 1-9
    heading: The ark and the mercy seat
    plain: |
      Bezaleel made the ark of acacia wood, two and a half cubits long and a cubit and a half wide and high. He overlaid it with pure gold inside and out and put a gold molding around it. He cast four gold rings for its four corners, two on each side, made poles of acacia wood overlaid with gold, and put the poles through the rings to carry it.

      He made the mercy seat of pure gold, two and a half cubits long and a cubit and a half wide. He made two cherubim of hammered gold at its two ends, one at each end, of one piece with the mercy seat. Their wings were spread upward and covered the mercy seat, and they faced each other, with their faces toward the mercy seat.
  - range: 10-16
    heading: The table
    plain: |
      He made the table of acacia wood, two cubits long, a cubit wide, and a cubit and a half high. He overlaid it with pure gold and put a gold molding around it. He also made a rim a handbreadth wide around it, with a gold molding on the rim. He cast four gold rings and fixed them at the four corners, by its four legs, next to the rim, to hold the poles for carrying it. The poles were of acacia wood overlaid with gold. He made the utensils of the table of pure gold: its dishes and spoons, and the bowls and jugs for pouring drink offerings.
  - range: 17-24
    heading: The candlestick
    plain: |
      He made the candlestick of pure gold, of hammered work: its shaft and branches, its cups, buds, and flowers were all of one piece with it. Six branches came out of its sides, three on one side and three on the other. Each branch had three cups shaped like almond blossoms, each with a bud and a flower. The candlestick itself had four such cups, with a bud beneath each pair of branches. The whole was one hammered piece of pure gold.

      He made its seven lamps, its tongs, and its snuff dishes of pure gold. He made it and all its utensils from one talent of pure gold.
  - range: 25-29
    heading: The altar of incense, the oil, and the incense
    plain: |
      He made the altar of incense of acacia wood, a cubit long, a cubit wide, and two cubits high, square, with its horns of one piece with it. He overlaid its top, its sides, and its horns with pure gold and put a gold molding around it. He made two gold rings under the molding, on its two sides, to hold the poles for carrying it, and made the poles of acacia wood overlaid with gold.

      He made the holy anointing oil and the pure incense of sweet spices, blended as a perfumer blends.

notes:
  - ref: 1
    phrase: And Bezaleel made the ark
    kind: history
    title: The one furnishing named as Bezaleel’s work
    body: |
      The ark is the only piece of the tabernacle that the account of the making introduces with Bezaleel’s name. The work on the tent began with “every wise hearted man among them that wrought the work of the tabernacle” ([[Ex. 36:8]]) and ran on from there as “he made.” At the ark the name returns, and the rest of this chapter follows from it as “he made” again.

      The text does not say why. One older reading takes the naming as an honor paid to the ark: “the holy chest (the ark), as being the most holy thing of all, is distinguished above all the rest, by being expressly mentioned as the work of Bezaleel, the chief architect of the whole.” The note on [[Ex. 31:2]] says who Bezaleel was and what Spirit he was given for the work; the note on [[Ex. 25:10]] says why the ark was the most sacred of the furnishings. The summary at the end of the account credits him with everything: he “made all that the LORD commanded Moses” ([[Ex. 38:22]]).
    sources: [keil-exodus]

  - ref: 25
    phrase: he made the incense altar
    kind: history
    title: The incense altar among the furniture it stood with
    body: |
      The altar of incense is made here together with the table and the candlestick, the two furnishings that shared the holy place with it. In the instructions it was separated from them. Chapter 25 described the table and the candlestick, and then the text “does not describe the altar of incense (the next logical item to cover as it is closest to the ark of the covenant) until Exodus 30:1–10,” five chapters later.

      The account of the making has all three in a row, as Moses had listed them when he called for workers: the table, the candlestick, “and the incense altar” ([[Ex. 35:13–15]]). In the finished tent the altar stood “before the veil and before the mercy seat,” in the middle of the holy place, with the candlestick on its south side and the table on its north.

      Only the making is repeated. What was to be done at this altar, and the yearly atonement on its horns, are explained at [[Ex. 30:1]], [[Ex. 30:7]], and [[Ex. 30:10]]. Incense is first burned on it at [[Ex. 40:27]].
    sources: [ot-minute-ex-25, bd-tabernacle, lds-scriptures]

  - ref: 29
    phrase: the holy anointing oil, and the pure incense of sweet spices
    kind: scripture
    title: The oil and the incense in a single verse
    body: |
      The making of the oil and the incense is reported in this one verse, though the instructions for them took seventeen ([[Ex. 30:22–38]]). The recipes are at [[Ex. 30:22–25]] for the oil and [[Ex. 30:34–35]] for the incense; neither the ingredients nor the rules that kept both from common use are repeated here. The “apothecary” whose craft the verse names is a perfumer, which is the word the plain-words rendering above uses.

      What the oil was for is explained at [[Ex. 30:25]], and the spices of the incense at [[Ex. 30:34]].
    sources: [lds-scriptures]

christ: |
  Hebrews names these furnishings one after another, down to “the cherubims of glory shadowing the mercyseat; of which we cannot now speak particularly” ([[Heb. 9:5]]), and says what they were: “a figure for the time then present” ([[Heb. 9:9]]). Christ entered not those holy places but heaven itself ([[Heb. 9:24]]); the passage is given in full at the close of the book (see [[Ex. 40:34]]).

  How Hebrews reads the pattern is taken up at [[Ex. 25:9]]. The mercy seat and the word Paul uses of the Savior are taken up at [[Ex. 25:21]].

explore: |
  - **The instructions this chapter carries out.** [[Ex. 25:10–40]] for the ark, the table, and the candlestick; [[Ex. 30:1–10]] and [[Ex. 30:22–38]] for the altar of incense, the oil, and the incense.
  - **The furniture put to use.** [[Ex. 40:20–27]], where the testimony goes into the ark, the bread is set out, the lamps are lit, and incense is burned.
  - **How these pieces traveled.** [[Num. 4:4–15]], the covering of the ark, the table, the candlestick, and the golden altar when the camp moved.
  - **The tabernacle read by the New Testament.** [[Heb. 9:1–12]]; [[Heb. 9:23–24]].

