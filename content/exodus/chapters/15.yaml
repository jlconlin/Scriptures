chapter: 15
title: The Song at the Sea
tagline: On the far shore Moses and Israel sing to the LORD, who has thrown horse and rider into the sea, and Miriam leads the women in the refrain. Three days later the water is bitter and the people murmur; the LORD heals the water and offers to be their healer.
when: 'The first month, in the days after the crossing: the song on the shore, three days’ march to Marah, then Elim. The next date the book gives is “the fifteenth day of the second month” (16:1).'

setting: |
  Pharaoh’s army has followed Israel into the sea, and the waters have closed over it. “The people feared the LORD, and believed the LORD, and his servant Moses” ([[Ex. 14:31]]). Chapter 15 is what they did next.

  Verses 1–18 are a poem set into the story, “known traditionally as the Song of the Sea” and also called “the song of Moses.” Verses 19–21 return to prose and bring in Miriam. Verses 22–27 take Israel into the wilderness of Shur, to the bitter water of Marah and the wells of Elim. Which sea this was, and the route, are taken up at [[Ex. 13:18]].

  Later scripture keeps returning to the song. Its second verse is sung again almost word for word in [[Isa. 12:2]] and [[Ps. 118:14]]. The Levites of Nehemiah’s day pray in its images: “their persecutors thou threwest into the deeps, as a stone into the mighty waters” ([[Neh. 9:11]]). Psalm 106 sets the song beside what follows it in this chapter: “Then believed they his words; they sang his praise. They soon forgat his works” ([[Ps. 106:12–13]]).

  Marah, at the end of the chapter, opens the wilderness stories: here the LORD proves His people.

thread: |
  The chapter holds a song and a complaint, and three days lie between them.

  The song has one subject. Moses and Israel sing it, but every deed in it is the LORD’s: He throws, He shatters, He blows with His wind, He leads, He will bring in and plant. It looks back and then forward. Verses 1–12 tell of the sea. From verse 13 the song looks ahead, to the peoples who will hear of this and tremble and to a mountain and a sanctuary not yet seen. It “refers to the Exodus from beginning to end,” and its last verses are about “the end of the Exodus.” One Latter-day Saint reflection hears three movements in it, “God’s victory over Egypt, his freeing of Israel, and his building of a holy sanctuary where he will plant them,” and reads the crossing itself as “a replay of Genesis 1,” in which God “divides the waters, and makes dry land appear.” It ends, “The LORD shall reign for ever and ever.”

  Then the story resumes, and it is short. Three days without water, a spring that cannot be drunk, and the people who sang now ask, “What shall we drink?” The LORD answers the need first: Moses cries to Him, He shows him a tree, and the water is made sweet. Only then does the chapter say, “there he proved them.” Marah is among the early “crises of faith” by which the Lord taught Israel “to trust and rely upon Him for all of their needs.” The chapter closes on a promise, “I am the LORD that healeth thee,” and on twelve wells at Elim.

sections:
  - range: 1-5
    heading: The horse and his rider
    plain: |
      Then Moses and the children of Israel sang this song to the LORD:

      “I will sing to the LORD, for He has triumphed gloriously; He has thrown the horse and its rider into the sea. The LORD is my strength and my song, and He has become my salvation. He is my God, and I will praise Him; my father’s God, and I will exalt Him. The LORD is a man of war; the LORD is His name. He has cast Pharaoh’s chariots and his army into the sea; his chosen captains are drowned in the Red sea. The depths have covered them; they sank to the bottom like a stone.”
  - range: 6-12
    heading: Thy right hand, O LORD
    plain: |
      “Your right hand, O LORD, is glorious in power; Your right hand, O LORD, has dashed the enemy in pieces. In the greatness of Your majesty You have overthrown those who rose against You; You sent out Your wrath, and it consumed them like stubble. At the blast of Your nostrils the waters were gathered together; the floods stood upright as a heap, and the depths were congealed in the heart of the sea.

      “The enemy said, ‘I will pursue, I will overtake, I will divide the spoil; I will have my desire of them. I will draw my sword; my hand will destroy them.’ You blew with Your wind, and the sea covered them; they sank like lead in the mighty waters.

      “Who is like You, O LORD, among the gods? Who is like You, glorious in holiness, to be praised with awe, doing wonders? You stretched out Your right hand, and the earth swallowed them.”
  - range: 13-18
    heading: To thy holy habitation
    plain: |
      “In Your mercy You have led out the people You redeemed; in Your strength You have guided them to Your holy habitation. The peoples will hear and be afraid. Sorrow will seize the inhabitants of Philistia. The chiefs of Edom will be dismayed; trembling will seize the mighty men of Moab; all the inhabitants of Canaan will melt away. Fear and dread will fall on them; by the greatness of Your arm they will be as still as a stone, until Your people pass over, O LORD, until the people You have purchased pass over.

      “You will bring them in and plant them in the mountain of Your inheritance, in the place, O LORD, that You have made to dwell in, the sanctuary, O Lord, that Your hands have established. The LORD shall reign for ever and ever.”
  - range: 19-21
    heading: Miriam and the women
    plain: |
      For Pharaoh’s horses went into the sea with his chariots and his horsemen, and the LORD brought the waters of the sea back over them; but the children of Israel walked on dry land in the midst of the sea.

      Miriam the prophetess, the sister of Aaron, took a timbrel in her hand, and all the women went out after her with timbrels and with dances. Miriam answered them, “Sing to the LORD, for He has triumphed gloriously; He has thrown the horse and its rider into the sea.”
  - range: 22-27
    heading: Marah and Elim
    plain: |
      Moses led Israel on from the Red sea into the wilderness of Shur. They went three days in the wilderness and found no water. When they came to Marah they could not drink its water, because it was bitter; that is why the place was called Marah, “bitterness.” The people murmured against Moses: “What shall we drink?” He cried to the LORD, and the LORD showed him a tree. When he threw it into the water, the water became sweet.

      There the LORD made a statute and an ordinance for them, and there He proved them. He said, “If you will listen carefully to the voice of the LORD your God, and do what is right in His sight, and give ear to His commandments, and keep all His statutes, I will put on you none of the diseases I brought on the Egyptians; for I am the LORD who heals you.”

      Then they came to Elim, where there were twelve wells of water and seventy palm trees, and they camped there by the water.

notes:
  - ref: 1
    phrase: Then sang Moses and the children of Israel this song
    kind: history
    title: An old song set into the story
    body: |
      The song is written in an older Hebrew than the story around it. Hebrew changed over the centuries as English has, and a few poems inside the Bible’s narrative books stand in what is called Archaic Biblical Hebrew, “the oldest stage” of the language: this song, the Song of Deborah, the blessings of Jacob and of Moses, and the oracles of Balaam among them. The song is “among the most ancient texts in the Hebrew Bible.”

      The age of that stage of the language is disputed. “Some Hebraists have proposed that Archaic Biblical Hebrew is not very old,” but there are “reasons for thinking that Archaic Biblical Hebrew predates 1000 BC.” The chief one is its likeness to Ugaritic, a related language that “dates from before 1200 BC”; this chapter in particular has “phrases and word pairs that are the same as what one finds in Ugaritic.”

      Two explanations are offered for a poem standing in the middle of prose. Such songs “were likely held in high regard as some of the earliest material known from ancient Israel,” so that a scribe who knew one “would likely incorporate it” where the story reached it. Or a writer might use the old style on purpose for poetry, “to set it apart from the other text and to give it more beauty.”
    sources: [sc-knowhy-853, welch-praise]

  - ref: 2
    phrase: I will prepare him an habitation
    kind: words
    title: Prepare him an habitation, or praise him
    body: |
      The Hebrew here most likely means “I will praise him”; the Church’s footnote to the verse reads “HEB praise Him.” The verb has two senses, “to rest (as at home)” and “to celebrate (with praises).” The King James translators took the first and wrote “prepare him an habitation.” The second gives “I will beautify, adorn him (with praises),” parallel to the next line, “I will exalt him.”

      The ancient Greek translation read it that way long before: “this is my God and I will glorify him.” A modern translation has “this is my God, and I will praise him.” The two halves of the line then answer each other: my God, whom I praise; my father’s God, whom I exalt.

      A dwelling for the LORD does come into the song, but at its end, and there the LORD makes it Himself (see the note on verse 17).
    sources: [lds-scriptures, strongs-concordance, bdb, lxx-rahlfs, nrsvue]

  - ref: 3
    phrase: The LORD is a man of war
    kind: symbol
    title: The LORD as a warrior
    body: |
      The line pictures God fighting for a people who did not fight. At the sea Israel had been told, “The LORD shall fight for you, and ye shall hold your peace” ([[Ex. 14:14]]), and the song is a thanksgiving that praises God “for acting on Israel’s behalf in His role as Divine Warrior.”

      The image was a familiar one. Language of this kind, which gives Jehovah “the characteristics of a ‘divine warrior’ who comes from heaven to fight battles on behalf of his covenant people, is found throughout the Old Testament and is common to traditions regarding many deities throughout the ancient world.” When Israel celebrated what God had done to redeem them, “they often used dramatic images of God coming as a conquering hero and vanquishing the opposition.”

      The picture gave hope because it belonged to the covenant. Israel had been promised that if they kept their covenants, they could call on the Lord to defend them. That is how the Book of Mormon prophet Jacob uses it for a people who feared they were cut off: “the Mighty God shall deliver his covenant people” ([[2 Ne. 6:17]]).
    sources: [sc-knowhy-277, lds-scriptures]

  - ref: 11
    phrase: Who is like unto thee, O LORD, among the gods?
    kind: scripture
    title: Among the gods
    body: |
      The question expects the answer “no one”: the song is saying “that there is no other god like the Lord.” It does not stop to say what the other “gods” are. One older reading supplies the reason for the comparison: the LORD stands alone “because none of the many so-called gods could perform such deeds.”

      Exodus speaks this way twice more around the same events. The last plague was a judgment “against all the gods of Egypt” ([[Ex. 12:12]]; see the note there), and when Jethro hears what happened he says, “Now I know that the LORD is greater than all gods” ([[Ex. 18:11]]). A psalm of David turns the question into a statement: “Among the gods there is none like unto thee, O Lord” ([[Ps. 86:8]]).

      “Fearful in praises,” in the second half of the verse, can be read “to be praised with awe”; a modern translation has “awesome in splendor.”
    sources: [ot-minute-ex-14, keil-exodus, lds-scriptures, nrsvue]

  - ref: 16
    phrase: which thou hast purchased
    kind: words
    title: A people bought
    body: |
      “Purchased” is the song’s second word for what the LORD did for Israel at the sea. It answers “redeemed” in verse 13, the word explained at [[Ex. 6:6]]. Here the verb describes God “victoriously redeeming his people.” A psalm sets the two words side by side as the song does: “Remember thy congregation, which thou hast purchased of old; the rod of thine inheritance, which thou hast redeemed” ([[Ps. 74:2]]).
    sources: [bdb, lds-scriptures]

  - ref: 17
    phrase: the mountain of thine inheritance
    kind: scripture
    title: Which mountain, and which sanctuary
    body: |
      While Israel is still on the shore of the sea, the song speaks of a mountain, a dwelling place, and a sanctuary. Later scripture takes up its words for the sanctuary and the temple. A psalm says the LORD “brought them to the border of his sanctuary, even to this mountain, which his right hand had purchased” ([[Ps. 78:54]]), and Solomon, dedicating the temple, says, “I have surely built thee an house to dwell in, a settled place for thee to abide in for ever” ([[1 Kgs. 8:13]]).

      Latter-day Saint readers have understood these lines as speaking of the land and of the temple. One reading takes the “holy habitation” of verse 13 as the promised land, and this verse as Israel coming “to reside in the mountains, a sanctuary that God had established for His people.” Another sees in the song’s three parts a pattern that runs through the Old Testament, whose last step is the “restoration of God’s people to his presence in the temple.”

      One older reading takes the mountain as “the mountain which Jehovah had prepared for a sanctuary,” and the planting as the planting of Israel “in the house of the Lord.” That, in this reading, “was the goal, to which the redemption from Egypt pointed.”

      The word “sanctuary” does not return in Exodus until the command for the tabernacle: “let them make me a sanctuary; that I may dwell among them” ([[Ex. 25:8]]).
    sources: [ot-minute-ex-14, welch-praise, keil-exodus, lds-scriptures]

  - ref: 20
    phrase: Miriam the prophetess
    kind: history
    title: Miriam the prophetess
    body: |
      Miriam is named here for the first time, and with a title. She is the sister who watched the ark of bulrushes ([[Ex. 2:4]]), unnamed in that story. A prophetess is “a woman who has received a testimony of Jesus and enjoys the spirit of revelation”; she “does not hold the priesthood or its keys.” Miriam, Deborah, and Huldah acted as prophetesses, “receiving a divine commission to preach and testify, even though they weren’t presiding church authorities.”

      Scripture bears the title out in two places. When Miriam and Aaron later complain against Moses, their own words claim the gift: “hath he not spoken also by us?” ([[Num. 12:2]]). And the LORD, through Micah, counts her among those He sent to lead Israel out: “I sent before thee Moses, Aaron, and Miriam” ([[Micah 6:4]]).

      Her part in the song may be larger than two verses suggest. Verse 1 gives the song to “Moses and the children of Israel.” But the singing is pictured only here, with timbrels and dances, which may suggest “that Miriam and a group of regular Hebrew women were the people who composed and originally sang the song.” The text does not settle it. Women meet the victors with timbrels and dancing elsewhere in scripture ([[Judg. 11:34]]; [[1 Sam. 18:6]]); on the timbrel and the dance, see the note at [[Ps. 150:4]]. See also [Women and marriage in the Old Testament](/old-testament/guides/women-and-marriage/#the-women).
    sources: [bd-miriam, gs-prophetess, sc-knowhy-284, sc-knowhy-867, lds-scriptures]

  - ref: 24
    phrase: the people murmured against Moses
    kind: prophets
    title: The first murmuring
    body: |
      The word “murmur” appears here for the first time, and it follows Israel from here to Canaan. To murmur is “to grumble and complain against God’s purposes, plans, or servants.” The verse is “the first of over twenty uses of the word murmur in its various forms in the record of Israel’s wanderings.”

      The need was real. Water is “the most critical necessity for life” in the desert, and after three days Israel “found themselves in dire need.” The two verses set two responses side by side. The people spoke against Moses; Moses “cried unto the LORD” (verse 25). In the next chapter he tells them whom the complaint had really reached: “your murmurings are not against us, but against the LORD” ([[Ex. 16:8]]).

      Elder Neal A. Maxwell defined murmuring as “a half-suppressed resentment or muttered complaint” and said, as Moses had, that the one really addressed by some murmuring “is clearly the Lord, as when the people complained against Moses.” He observed that “murmuring seems to come so naturally to the natural man,” and that it runs through scripture’s record of complaints: “We need bread. We need water.”
    sources: [gs-murmur, ot-manual-ex-11-19, brown-trust-lord, maxwell-murmur-not, lds-scriptures]

  - ref: 25
    phrase: there he proved them
    kind: history
    title: What was proved at Marah
    body: |
      At Marah the LORD proved, or tested, Israel. Moses later describes the whole wilderness in this verse’s word ([[Deut. 8:2]]), and the next test is already in view: the manna is given “that I may prove them” (see the note on [[Ex. 16:4]]).

      The verse does not say what the “statute and an ordinance” made at Marah were. One older reading holds that they were not words at all but lay “in the divine act itself”: being led to water that could not be drunk, and having it healed, was to be “an institution or law by which God would always guide and govern His people,” so that “Israel could always reckon upon the help of God.”
    sources: [lds-scriptures, keil-exodus]

  - ref: 26
    phrase: I am the LORD that healeth thee
    kind: scripture
    title: The healed water and the LORD who heals
    body: |
      The LORD who has just healed the water at Marah now offers to be Israel’s healer. Verse 25 says the water was “made sweet,” and the Church’s chapter heading calls that a healing: “The waters of Marah are healed.” Scripture speaks the same way of a miracle of Elisha’s: “Thus saith the LORD, I have healed these waters” ([[2 Kgs. 2:21]]). The healing can be read as a lesson for the people: “when the bitter waters were wonderfully healed, the children of Israel would have learned that God would and could also heal them.”

      The promise has a condition and a scope. It is for those who hearken and keep the statutes, and it concerns “these diseases … which I have brought upon the Egyptians.” Moses repeats it to the next generation in nearly the same words: the LORD “will put none of the evil diseases of Egypt, which thou knowest, upon thee” ([[Deut. 7:15]]).
    sources: [brown-trust-lord, lds-scriptures]

christ: |
  The LORD of this song is Jehovah (see [[Ex. 3:14]]). “He is become my salvation”: Isaiah sings the line again, and the note at [[Isa. 12:2]] takes up its word “salvation.” He has “redeemed” and “purchased” a people, and the Church’s footnote on “purchased” points to Paul’s words to the Saints at Corinth: “ye are bought with a price” ([[1 Cor. 6:20]]).

  The warrior of verse 3 returns in the Book of Mormon. Jacob takes the God who fights for His covenant people and names the last enemies as death and hell, from which the Holy One of Israel delivers through the Atonement ([[2 Ne. 9:19, 25–26]]).

  At Marah the Church’s study help offers a comparison: the tree that healed the bitter water can remind a reader of Jesus Christ, who offers healing and takes bitterness away. The chapter’s own last word about the LORD is “I am the LORD that healeth thee.”

  And the song is not left behind at the sea. In John’s vision the victors stand by “a sea of glass mingled with fire” and sing “the song of Moses the servant of God, and the song of the Lamb” ([[Rev. 15:2–3]]).

explore: |
  - **The song sung again.** [[Isa. 12]] and [[Ps. 118:14]] take up its second verse.
  - **The sea remembered.** [[Ps. 106:7–13]] and [[Ps. 77:16–20]].
  - **Other old songs in the story.** The Song of Deborah ([[Judg. 5]]) and the song Moses taught Israel at the end of his life ([[Deut. 32]]).
  - **Miriam afterward.** [[Num. 12:1–15]] and [[Num. 20:1]].
  - **Murmuring in another wilderness.** [[1 Ne. 16:20]] and [[1 Ne. 17:23–31]], where Nephi argues from the sea and the water.
  - **The song of Moses and of the Lamb.** [[Rev. 15:2–4]].
  - **Why praise.** “Exodus 15 and the Practice of Praise” (Maxwell Institute, *Old Testament Reflections*, 2026) asks why God would want praise at all, and answers from this song.

