chapter: 17
title: Water from the Rock, and Amalek
tagline: At Rephidim the thirsty people ask whether the LORD is among them, and He stands on the rock in Horeb and gives them water. Then Amalek attacks, and Israel prevails for as long as Moses’s hands are held up.
when: 'Between the fifteenth day of the second month (16:1) and the arrival at Sinai in the third month (19:1), at Rephidim, the camp before the mountain.'

setting: |
  Israel is some weeks out of Egypt. The people have left the wilderness of Sin, where the manna began ([[Ex. 16:1]]), and have come by stages to Rephidim, “a wilderness station passed just before reaching Sinai.” The itinerary in Numbers remembers the place for one thing: it was “where was no water for the people to drink” ([[Num. 33:14]]).

  This is the third complaint since the sea. At Marah the water was bitter and “the people murmured against Moses” ([[Ex. 15:24]]); in the wilderness of Sin they were hungry ([[Ex. 16:2–3]]); now they are thirsty, and Moses fears for his life. Murmuring is explained at [[Ex. 15:24]], and the rod Moses carries at [[Ex. 4:2]].

  The second half of the chapter brings an enemy. The Amalekites were a tribe of the desert between the Arabah and the Mediterranean, whom Genesis traces to a grandson of Esau (see [[Gen. 36:12]]).

  Later scripture returns to both halves. The psalms sing of the water: “He opened the rock, and the waters gushed out” ([[Ps. 105:41]]). Psalm 95 uses the two names given to the place to warn Israel ([[Ps. 95:8]]), Nephi reminds his brothers of the rock ([[1 Ne. 17:29]]), and Paul says who the Rock was ([[1 Cor. 10:4]]). Deuteronomy tells Israel to remember what Amalek did ([[Deut. 25:17]]).

thread: |
  The chapter turns on the people’s question, which the narrator places at the end of the first story: “Is the LORD among us, or not?” (verse 7). Two stories follow one another, a quarrel inside the camp and an attack from outside it, and the same rod is in Moses’s hand in both (verses 5, 9).

  In the first, the people are thirsty and turn on Moses, and he tells them that their quarrel is with the LORD (verse 2). No punishment follows. The LORD sends Moses ahead with some of the elders and says, “I will stand before thee there upon the rock.” The rod that struck the river in Egypt strikes the rock, and there is water.

  In the second, the battle goes Israel’s way only while Moses’s hand is raised, and when his arms give out two men hold them up until sunset. Whatever the gesture meant, “it is clear that the Lord was the source of the Israelites’ power in this battle.”

  Each story ends with a name. The place of the quarrel is called Massah and Meribah, Testing and Strife, for what Israel did there. The altar built after the battle is called Jehovah-nissi, “The Lord is my banner.”

sections:
  - range: 1-7
    heading: Water from the rock in Horeb
    plain: |
      The whole congregation of Israel moved on from the wilderness of Sin by stages, as the LORD commanded, and camped at Rephidim. There was no water for the people to drink. So the people quarreled with Moses and said, “Give us water to drink.” Moses said, “Why do you quarrel with me? Why do you put the LORD to the test?” But the people were thirsty, and they murmured against Moses: “Why did you bring us up out of Egypt, to kill us and our children and our cattle with thirst?”

      Moses cried to the LORD, “What shall I do with this people? They are almost ready to stone me.” The LORD said, “Go on ahead of the people, and take some of the elders of Israel with you. Take in your hand the rod with which you struck the river, and go. I will stand before you there on the rock in Horeb. Strike the rock, and water will come out of it for the people to drink.” Moses did so in the sight of the elders of Israel. He named the place Massah and Meribah, because the children of Israel quarreled there and because they tested the LORD, saying, “Is the LORD among us, or not?”
  - range: 8-13
    heading: The battle with Amalek
    plain: |
      Then Amalek came and fought with Israel at Rephidim. Moses said to Joshua, “Choose men for us, and go out and fight Amalek. Tomorrow I will stand on the top of the hill with the rod of God in my hand.” Joshua did as Moses told him and fought Amalek, and Moses, Aaron, and Hur went up to the top of the hill.

      Whenever Moses held up his hand, Israel prevailed; whenever he let it down, Amalek prevailed. But Moses’s hands grew heavy. So they took a stone and put it under him, and he sat on it, and Aaron and Hur held up his hands, one on each side, and his hands stayed steady until the sun went down. And Joshua overcame Amalek and his people with the edge of the sword.
  - range: 14-16
    heading: A memorial and an altar
    plain: |
      The LORD said to Moses, “Write this in a book as a memorial, and recite it in Joshua’s hearing: for I will utterly blot out the remembrance of Amalek from under heaven.” Moses built an altar and named it Jehovah-nissi. He said, “The LORD has sworn it: the LORD will have war with Amalek from generation to generation.”

notes:
  - ref: 2
    phrase: wherefore do ye tempt the LORD?
    kind: words
    title: Tempting the LORD means putting Him to the test
    body: |
      “Tempt” here means to test, and the people are the ones doing it. The Hebrew is “put the Lord to the test,” and the verb means “test, try, prove, tempt,” “but not in modern sense of the word.” Nobody is enticing God to do wrong. The people are requiring Him to prove Himself.

      The same verb has just been used the other way round, where the King James Version has “prove.” At Marah the LORD gave Israel a statute, “and there he proved them” ([[Ex. 15:25]]). The manna came with a rule about gathering it, “that I may prove them, whether they will walk in my law, or no” ([[Ex. 16:4]]).

      Verse 7 gives the test in the people’s own words: “Is the LORD among us, or not?” The law later forbids it by the name of this place: “Ye shall not tempt the LORD your God, as ye tempted him in Massah” ([[Deut. 6:16]]). That is the sentence with which the Savior answers the tempter on the pinnacle of the temple ([[Matt. 4:7]]); see the note at [[Ps. 91:11]].
    sources: [lds-scriptures, bdb]

  - ref: 6
    phrase: I will stand before thee there upon the rock in Horeb
    kind: history
    title: The rock is at Horeb, the mountain of the bush
    body: |
      The rock is in Horeb, which is another name for Sinai, so the camp at Rephidim is already within reach of the mountain where Moses was called (see [[Ex. 3:1]]). When Israel leaves Rephidim it is at once “come to the desert of Sinai” ([[Ex. 19:2]]). Jethro’s visit, told in between, finds Moses “encamped at the mount of God”; when that visit took place is not settled (see the note on [[Ex. 18:5]]). Where the mountain itself stood is not known; see [[Ex. 19:1]].

      Moses does not strike the rock in front of the camp. He goes ahead with some of the elders, and the water comes “in the sight of the elders of Israel.” In one older reading they were taken as “eye-witnesses of the miracle,” to testify of it to the people. In the same reading the LORD’s standing on the rock before Moses “signified the gracious assistance of God.”
    sources: [bd-horeb, keil-exodus, lds-scriptures]

  - ref: 6
    phrase: there shall come water out of it
    kind: christ
    title: That Rock was Christ
    body: |
      Paul identifies the rock as Christ. Recalling the cloud, the sea, and the manna, he says that the fathers “did all drink the same spiritual drink: for they drank of that spiritual Rock that followed them: and that Rock was Christ” ([[1 Cor. 10:4]]). The identification is scripture’s own. How Psalm 95 and Hebrews preach from the same day is told at [[Ps. 95:8]].

      Moses’s own song uses the word as a name for Israel’s God: “He is the Rock, his work is perfect” ([[Deut. 32:4]]), “the Rock of his salvation” ([[Deut. 32:15]]).

      Nephi ties the miracle to the Savior’s name. He reminds his brothers that Moses “smote the rock, and there came forth water, that the children of Israel might quench their thirst” ([[1 Ne. 17:29]]). Later he swears an oath by the miracle, naming it after the deliverance from Egypt and the raising of the serpent for those who were bitten. As surely as the Lord gave Moses power “that he should smite the rock and the water should come forth” ([[2 Ne. 25:20]]), and as surely as all these things are true, “there is none other name given under heaven save it be this Jesus Christ, of which I have spoken, whereby man can be saved” ([[2 Ne. 25:20]]).

      Elder Bruce R. McConkie wrote of Paul’s sentence that Christ “is the spiritual drink, the living water, the water of life, which if men drink they shall never thirst more.” One Latter-day Saint reading compares the struck rock and its water with Christ, who “was smitten at Calvary.” That is a reading of the image. Paul’s sentence is the scripture.
    sources: [lds-scriptures, ot-manual-ex-11-19, ot-minute-ex-14]

  - ref: 7
    phrase: Massah, and Meribah
    kind: scripture
    title: Massah and Meribah, the names scripture keeps
    body: |
      The two names mean Testing and Strife, and later scripture uses them as shorthand for this day. The verse gives the reason for each, the people’s “chiding” and their having “tempted the LORD.”

      Psalm 95 builds its warning on both names, which the King James Version translates: “as in the provocation, and as in the day of temptation in the wilderness” ([[Ps. 95:8]]). Hebrews quotes the psalm ([[Heb. 3:8]]), and Jacob draws on it when he writes of “the provocation in the days of temptation while the children of Israel were in the wilderness” ([[Jacob 1:7]]). The note at [[Ps. 95:8]] explains the wording. One Latter-day Saint study names this chapter as the source: “The event at Meribah is the Provocation mentioned throughout the Bible.” The same study counts three further provocations, the first of them at the foot of Sinai; that one is taken up at [[Ex. 20:19]] and [[Ex. 34:1]].

      There is a second Meribah. The name is given to Rephidim and also to Kadesh, where Israel is again without water. At Kadesh Moses is told to “speak ye unto the rock” ([[Num. 20:8]]), and he “smote the rock twice” ([[Num. 20:11]]). It is after that day, and not this one, that he is told he will not bring the congregation into the land ([[Num. 20:12]]). Here he is commanded to strike, and “Moses did so.”
    sources: [lds-scriptures, bd-meribah, thomas-provocation]

  - ref: 9
    phrase: Joshua
    kind: history
    title: Joshua appears without introduction
    body: |
      This is the first mention of Joshua in Exodus, and the narrative does not say who he is: Moses simply hands him the battle. He was the “son of Nun, and successor of Moses; born in Egypt before the Exodus.” The book goes on to show him as Moses’s “minister” on the mountain ([[Ex. 24:13]]) and as the “young man” who stayed at the tent of meeting when Moses left it ([[Ex. 33:11]]).

      His name means “God is help,” and it “occurs in the Old Testament under the various forms Jehoshua, Hoshea, Jeshua, and Jesus.” That is why the King James New Testament can call him Jesus ([[Heb. 4:8]]; see the note at [[Ps. 95:11]]). Numbers records that Moses “called Oshea the son of Nun Jehoshua” ([[Num. 13:16]]).

      Verse 14 looks ahead to what he will become. The memorial is to be rehearsed “in the ears of Joshua,” the man who “eventually succeeded Moses in leading the children of Israel into Canaan” and so “especially needed to remember the event.”
    sources: [oshb-wlc, bd-joshua, lds-scriptures, ot-minute-ex-14]

  - ref: 11
    phrase: when Moses held up his hand
    kind: symbol
    title: What the raised hand meant
    body: |
      The text does not say why Moses raised his hand, only what he was holding and what followed. It may have been a gesture of prayer. Lifting the hands was “the quintessential type of gesture associated with prayer in the ancient world.” Moses has done it before in this book: to end the hail he “spread abroad his hands unto the LORD” ([[Ex. 9:33]]).

      What the chapter does name is the rod. Moses says beforehand that he will stand on the hill “with the rod of God in mine hand” (verse 9), the staff of the signs in Egypt and of the rock a few verses earlier (see [[Ex. 4:2]]). One Latter-day Saint reading is that the rod “signified God’s presence. He was in control of this battle.”

      Either way, the narrative ties the outcome to the hill and not to the field: “when he let down his hand, Amalek prevailed.”
    sources: [scripture-helps-ex-14, calabro-gestures, ot-minute-ex-14, lds-scriptures]

  - ref: 12
    phrase: Aaron and Hur stayed up his hands
    kind: prophets
    title: Holding up the hands of the prophet
    body: |
      Latter-day prophets have used this verse to teach what it is to sustain the President of the Church. President Harold B. Lee, then a member of the First Presidency, pointed to Moses on the hill at Rephidim and said of the President of the Church, “as we uphold his hands, and as we lead under his direction, by his side, the gates of hell will not prevail against you and against Israel.” Elder Ronald A. Rasband, who quoted him in 2024, defined the word in the same talk: “To sustain means to hold up another person.” President Boyd K. Packer kept to the verse’s own detail: “Should age and infirmity cause his hands to grow heavy, they are held up by his counselors at his side.”

      Of Hur the book says little. He is with Aaron here, and he is with Aaron again when Moses goes up the mountain and leaves the elders in their care: “Aaron and Hur are with you” ([[Ex. 24:14]]).
    sources: [rasband-hold-up, packer-shield, lds-scriptures]

  - ref: 14
    phrase: Write this for a memorial in a book
    kind: history
    title: The book Moses is told to write in
    body: |
      The LORD commands a written record, and which book is meant is not certain. With the vowels it is given, the Hebrew phrase is “in the book,” and it “has often been supposed that the reference is to the history which Moses had already begun to write.” But that “is certainly not the necessary meaning,” since Hebrew “always writes in the book” where English says “a book.” One older reading takes it as the book “appointed for a record of the wonderful works of God.”

      Either way, Exodus shows Moses writing at the LORD’s word. Later he “wrote all the words of the LORD” ([[Ex. 24:4]]) and is told, “Write thou these words” ([[Ex. 34:27]]). Who wrote the book as a whole is taken up at [[Ex. 1:1]].
    sources: [cambridge-exodus, keil-exodus, lds-scriptures]

  - ref: 14
    phrase: I will utterly put out the remembrance of Amalek
    kind: history
    title: The decree against Amalek
    body: |
      The LORD Himself declares war on Amalek, and the reason is given in Deuteronomy, not here. Exodus says only who began it: “Then came Amalek, and fought with Israel” (verse 8). Moses later tells what the attack was like. Amalek “smote the hindmost of thee, even all that were feeble behind thee, when thou wast faint and weary; and he feared not God” ([[Deut. 25:18]]). It fell on the rear of the camp and on those least able to defend themselves.

      The sentence passed here is then handed on. Deuteronomy makes it Israel’s charge once the land is at rest: “thou shalt blot out the remembrance of Amalek from under heaven; thou shalt not forget it” ([[Deut. 25:19]]). Balaam foresees Amalek’s end ([[Num. 24:20]]). Samuel sends Saul against Amalek with this day as the stated ground: “I remember that which Amalek did to Israel, how he laid wait for him in the way, when he came up from Egypt” ([[1 Sam. 15:2]]). In the years between, the Amalekites went on attacking Israel. They come up with Midian in Gideon’s day ([[Judg. 6:3]]), and they burn Ziklag before David returns to it ([[1 Sam. 30:1]]). “From generation to generation” (verse 16) describes a war that was still being fought in David’s day. Who the Amalekites were is told at [[Gen. 36:12]].

      A decree like this one is read within limits. The Lord’s commanding Israel to battle “was the exception rather than the rule”; no such account is a warrant for violence now; and not every instance can be fully understood.
    sources: [lds-scriptures, scripture-helps-ex-14, scripture-helps-violence, gs-amalekites-ot]

  - ref: 15
    phrase: Jehovah-nissi
    kind: words
    title: The LORD is my banner
    body: |
      The altar’s name means “The Lord is my banner.” The second word is the Hebrew for a “standard, ensign, signal,” used here for a “standard, as rallying-point,” the thing an army gathers to. One older reading gives the sense as “He is our Leader; we fight under His banner.” A Latter-day Saint paraphrase is “Jehovah is my source of victory.”

      The same Hebrew word is the “ensign” of Isaiah’s prophecies, as in “a root of Jesse, which shall stand for an ensign of the people” ([[Isa. 11:10]]; see the note at [[Isa. 5:26]]).

      The next verse is harder than the King James Version shows. The Hebrew of verse 16 is “A hand upon the throne of the Lord!” That is an oath, and the King James translators rendered it so: “the LORD hath sworn.” The word for “throne” stands in a form found nowhere else, and “many scholars” have read “banner” in its place. A modern translation does so, “A hand upon the banner of the Lord!”, and marks the Hebrew as uncertain. That reading “has the advantage of bringing Moses’ words into direct relation with the name of the altar.” On either reading the verse ends in the same place, with war against Amalek “from generation to generation.”
    sources: [bd-jehovah-nissi, bdb, cambridge-exodus, nrsvue, lds-scriptures, ot-minute-ex-14]

christ: |
  Scripture names the Rock of this chapter as Christ ([[1 Cor. 10:4]]). The note on verse 6 gives what Paul, Moses, and Nephi make of it. The LORD who says “I will stand before thee there upon the rock” is Jehovah (see [[Ex. 3:14]]).

  The Savior spoke of water that He gives. To a woman drawing at a well He said, “whosoever drinketh of the water that I shall give him shall never thirst” ([[John 4:14]]), and at the feast in Jerusalem He “stood and cried, saying, If any man thirst, let him come unto me, and drink” ([[John 7:37]]).

  The people at Rephidim were thirsty and doubted that the LORD was with them. One Latter-day Saint study reads the Provocation, wherever it recurs, as “a refusal to partake of the goodness of God.” Jacob had set those words against it: he labored to persuade his people to “come unto Christ, and partake of the goodness of God” ([[Jacob 1:7]]) and not to repeat the provocation in the wilderness.

explore: |
  - **The second Meribah.** [[Num. 20:1–13]], where Moses is told to speak to the rock.
  - **The psalms on the rock and the test.** [[Ps. 78:15–20]], [[Ps. 105:41]], and [[Ps. 114:8]] for the water; [[Ps. 95:7–11]] for Massah and Meribah, with [[Heb. 3:7–19]].
  - **Nephi’s argument from the Exodus.** [[1 Ne. 17:23–31]], where the rock stands with the sea and the manna.
  - **Living water.** [[John 4:5–14]] and [[John 7:37–39]].
  - **Amalek afterward.** [[Deut. 25:17–19]], [[1 Sam. 15]], and [[1 Sam. 30]].
  - **A study of the provocation.** “The Provocation in the Wilderness and the Rejection of Grace” (Religious Studies Center, 2005) follows Massah and Meribah through the Old Testament, Hebrews, and the Book of Mormon.

