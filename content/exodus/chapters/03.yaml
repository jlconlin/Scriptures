chapter: 3
title: The Burning Bush
tagline: At Horeb the LORD calls to Moses from a bush that burns and is not consumed. He has seen Israel’s affliction and has come down to deliver them, He sends Moses to Pharaoh, and when Moses asks His name He answers, “I AM THAT I AM.”
when: 'Near Moses’s eightieth year (7:7), forty years after he fled to Midian (Acts 7:30), while Israel is still in bondage.'

setting: |
  Moses has been a shepherd in Midian since he fled from Pharaoh ([[Ex. 2:15]]). He has married Zipporah, a daughter of the priest of Midian, who is called Reuel in chapter 2 and Jethro here (see [[Ex. 2:18]]). In Egypt the oppression has continued under an unnamed Pharaoh (see [[Ex. 1:11]]), and the last chapter ended with a turn: “God heard their groaning, and God remembered his covenant with Abraham, with Isaac, and with Jacob” ([[Ex. 2:24]]).

  Chapter 3 is what God does about it. It is the first appearance of the Lord to Moses that scripture records, and it is the first half of one conversation: the scene at the bush runs on through [[Ex. 4:17]], where Moses’s doubts continue and signs are given him. The place is Horeb, the mountain to which Moses will bring Israel back.

  Later scripture returns to the bush often. Stephen retells it before the council ([[Acts 7:30–35]]). Jesus quotes verse 6 to the Sadducees ([[Mark 12:26–27]]) and takes the name of verse 14 on His own lips ([[John 8:58]]). In latter-day revelation Moses looks back on the bush ([[Moses 1:17]]), and the Lord introduces Himself as “the Great I Am” ([[D&C 29:1]]).

thread: |
  The chapter moves from what God has seen to who God is. Before Moses is asked to do anything, the LORD says what He Himself has done and will do: “I have surely seen,” “have heard,” “I know their sorrows,” “I am come down to deliver them” (verses 7–8). To “come down” is the Old Testament’s way of saying that God steps into human affairs. Only then comes “I will send thee” (verse 10).

  Moses answers with two questions, and the rest of the chapter is the reply to them. The first is “Who am I?” (verse 11). God does not answer it by telling Moses anything about Moses. He says, “Certainly I will be with thee.” The second is “What is his name?” (verse 13). The answer, “I AM THAT I AM,” uses the same Hebrew verb as the “I will be” of verse 12. The messenger’s weakness is answered by the presence of the One who sends him.

  Verses 16–22 then tell Moses the whole course of what is coming, before any of it happens: the elders will listen, Pharaoh will refuse, the LORD will strike Egypt, Pharaoh will let them go, and Israel will not leave empty.

sections:
  - range: 1-6
    heading: The bush that was not consumed
    plain: |
      Moses was keeping the flock of his father-in-law Jethro, the priest of Midian. He led the flock to the far side of the wilderness and came to Horeb, the mountain of God. There the angel of the LORD appeared to him in a flame of fire from the middle of a bush. Moses looked: the bush was on fire, and yet it was not burned up. He said, “I will turn aside and look at this great sight, and see why the bush does not burn away.”

      When the LORD saw that he had turned aside to look, God called to him from the middle of the bush: “Moses, Moses!” He answered, “Here I am.” God said, “Do not come closer. Take your shoes off your feet, for the place where you are standing is holy ground. I am the God of your father, the God of Abraham, the God of Isaac, and the God of Jacob.” Moses hid his face, because he was afraid to look at God.
  - range: 7-10
    heading: “I am come down to deliver them”
    plain: |
      The LORD said, “I have surely seen the affliction of my people in Egypt, and I have heard them cry out because of their taskmasters. I know their sorrows. I have come down to deliver them from the hand of the Egyptians and to bring them up out of that land to a good and wide land, a land flowing with milk and honey, the home of the Canaanites, Hittites, Amorites, Perizzites, Hivites, and Jebusites. The cry of the children of Israel has reached me, and I have seen how the Egyptians oppress them. Come now: I will send you to Pharaoh, and you will bring my people, the children of Israel, out of Egypt.”
  - range: 11-15
    heading: Two questions and the name
    plain: |
      Moses said to God, “Who am I, to go to Pharaoh and to bring the children of Israel out of Egypt?” God said, “I will certainly be with you. And this will be the sign to you that I have sent you: when you have brought the people out of Egypt, you will all serve God on this mountain.”

      Moses said, “Suppose I go to the children of Israel and tell them, ‘The God of your fathers has sent me to you,’ and they ask me, ‘What is his name?’ What shall I tell them?” God said to Moses, “I AM THAT I AM. Say this to the children of Israel: I AM has sent me to you.” And God said further, “Say this to the children of Israel: The LORD God of your fathers, the God of Abraham, the God of Isaac, and the God of Jacob, has sent me to you. This is my name forever, and by this I am to be remembered through all generations.”
  - range: 16-22
    heading: What Moses is to say, and what will happen
    plain: |
      “Go and gather the elders of Israel and tell them: The LORD God of your fathers, the God of Abraham, Isaac, and Jacob, appeared to me and said, I have surely visited you and seen what is done to you in Egypt, and I have said that I will bring you up out of the affliction of Egypt to the land of the Canaanites, Hittites, Amorites, Perizzites, Hivites, and Jebusites, a land flowing with milk and honey.

      “They will listen to you. Then you and the elders of Israel are to go to the king of Egypt and say to him: The LORD God of the Hebrews has met with us. Now let us go, we beg you, three days’ journey into the wilderness, to sacrifice to the LORD our God. I know that the king of Egypt will not let you go, no, not by a mighty hand. So I will stretch out my hand and strike Egypt with all the wonders I will do there, and after that he will let you go. And I will give this people favor in the eyes of the Egyptians, so that when you go you will not go empty-handed. Every woman is to ask her neighbor, and any woman staying in her house, for jewels of silver and gold and for clothing. You will put them on your sons and daughters, and so you will spoil the Egyptians.”

notes:
  - ref: 1
    phrase: the mountain of God, even to Horeb
    kind: history
    title: Horeb, the mountain of God
    body: |
      Horeb is another name for Mount Sinai, so the bush burns on the mountain where the law will later be given.

      The verse calls it “the mountain of God” before anything has happened there. The name looks ahead: the mountain “will indeed earn the designation” by what happens in this chapter and in the chapters to come. The sign given in verse 12 already points to that return (“ye shall serve God upon this mountain”).

      Where the mountain stood is another matter: “The location of the original mountain is not known.” That question is taken up where Israel arrives at it, at [[Ex. 19:1]].
    sources: [gs-sinai-mount, ot-minute-ex-1]

  - ref: 2
    phrase: the angel of the LORD
    kind: scripture
    title: The angel of the LORD and the LORD in the bush
    body: |
      The one who appears in the bush is the LORD Himself. Verse 2 says that “the angel of the LORD appeared,” but in verse 4 it is the LORD who sees Moses turn aside and God who calls “out of the midst of the bush,” and in verse 6 the speaker says, “I am the God of thy father.” A reader fairly asks which it was.

      The Joseph Smith Translation answers by changing the word: in verse 2 it reads “presence of the Lord” where the King James Version has “the angel of the LORD.” That agrees with how the phrase behaves elsewhere. In some Old Testament passages the angel of the Lord “speaks as the voice of God Himself,” and the phrase is often understood of a “manifestation of God that is visible to the human eye.” The same thing happens when Abraham is stopped on Moriah (see the note at [[Gen. 22:11]]).

      Stephen keeps both expressions when he retells the story. There appeared to Moses “an angel of the Lord in a flame of fire in a bush” ([[Acts 7:30]]), and as he drew near, “the voice of the Lord came unto him” ([[Acts 7:31]]). The second note on verse 14 takes up who the LORD of this chapter is.
    sources: [lds-scriptures, bd-angels, hardison-theophany]

  - ref: 2
    phrase: the bush was not consumed
    kind: symbol
    title: A fire that does not burn up the bush
    body: |
      Fire is one of scripture’s regular marks of God’s presence, and on one reading the bush that was not consumed was a bush shining with light. Scripture often pictures His presence as brightness, glory, or fire; when the Lord later comes down on this same mountain before all Israel, “the LORD descended upon it in fire” ([[Ex. 19:18]]). The account of the bush “seems to be a description of a bush that exuded light,” so that “light was the element that indicated God’s presence.”

      One older reading goes further and treats the sight as a picture of the message Moses is about to hear. On that reading the thorn-bush is Israel: it “represented the people of Israel as they were burning in the fire of affliction, the iron furnace of Egypt,” and it was not consumed because “in the flame was Jehovah, who chastens His people, but does not give them over unto death.” The chapter itself does not say what the bush stands for, so this remains a reading.
    sources: [scripture-helps-ex-1, muhlestein-theophanies, keil-exodus, lds-scriptures]

  - ref: 4
    phrase: God called unto him out of the midst of the bush
    kind: scripture
    title: What Moses 1 adds to the call at the bush
    body: |
      Latter-day revelation records a commandment given at the bush that Exodus does not preserve. Facing Satan some time afterward, Moses says that God “gave me commandments when he called unto me out of the burning bush, saying: Call upon God in the name of mine Only Begotten, and worship me” ([[Moses 1:17]]). So Moses was taught at the bush not only the name I AM but to approach God in the name of His Only Begotten.

      Moses 1 also fills the gap between this chapter and the return to Egypt. The vision on the unnamed mountain “occurs after the burning bush but prior to going into Egypt to deliver Israel.” There the Lord tells him, “I am with thee, even unto the end of thy days; for thou shalt deliver my people from bondage” ([[Moses 1:26]]), words close to the “I will be with thee” of verse 12.
    sources: [lds-scriptures, sc-knowhy-846]

  - ref: 5
    phrase: put off thy shoes from off thy feet
    kind: symbol
    title: Why Moses takes off his shoes
    body: |
      Taking off his sandals is a gesture of approach: a sign of the cleansing required before a person comes into God’s presence, and of humility. Moses has answered “Here am I,” yet he is told, “Draw not nigh hither.” The command is read as saying that he is not yet ready to enter the presence of God, and the scene “emphasizes distance, preparation, and an initial commissioning.”

      The removal of the shoes belongs to that preparation. There is a plain side to it, since “one should not track dirt into God’s house,” but “the act is primarily symbolic. It is a gesture of approach that represents the ritual cleansing” required before a person enters God’s presence. It is also an act of lowliness: “because only people of means wore sandals in Egypt and Israel, when Moses removes his sandals he demonstrates deference and humility.”

      Joshua is given the same command before Jericho: “Loose thy shoe from off thy foot; for the place whereon thou standest is holy” ([[Josh. 5:15]]).
    sources: [hardison-theophany, sc-knowhy-846, lds-scriptures]

  - ref: 6
    phrase: the God of Abraham, the God of Isaac, and the God of Jacob
    kind: scripture
    title: The God of Abraham, Isaac, and Jacob, and the God of the living
    body: |
      Before He gives any name, the LORD identifies Himself by the men He covenanted with; Jesus later argued for the resurrection from this sentence. The title is not only a way of saying which God is speaking. It returns in verses 15 and 16 and in [[Ex. 4:5]], “precisely in passages in which God promises salvation and deliverance to his people, and serves as a guarantee of that deliverance.”

      Jesus argued from the sentence itself. To the Sadducees, “which say there is no resurrection” ([[Mark 12:18]]), He said, “have ye not read in the book of Moses, how in the bush God spake unto him, saying, I am the God of Abraham, and the God of Isaac, and the God of Jacob?” ([[Mark 12:26]]). “He is not the God of the dead, but the God of the living” ([[Mark 12:27]]); Luke’s account adds, “for all live unto him” ([[Luke 20:38]]).

      Nephi uses the same title to say who would one day be crucified: “the God of Abraham, and of Isaac, and the God of Jacob, yieldeth himself, according to the words of the angel, as a man, into the hands of wicked men” ([[1 Ne. 19:10]]).
    sources: [hardison-theophany, lds-scriptures]

  - ref: 12
    phrase: this shall be a token unto thee
    kind: words
    title: What the token is
    body: |
      The verse does not make plain what the token is, and it joins it to something still ahead: Israel serving God at this mountain. “Token” is the King James word for a sign. It comes attached to the promise “I will be with thee,” a formula of reassurance used most often “when the addressee faces danger or a task where the risk of failure is very great.”

      Proposals have included “the burning bush, the presence of God, and the eventual success of Moses’ mission.” Whichever it was, the verse speaks of a day when the freed people will “serve God upon this mountain,” and Israel does camp before the mount in the third month after leaving Egypt ([[Ex. 19:1–2]]).
    sources: [lds-scriptures, hardison-theophany, gs-sinai-mount]

  - ref: 14
    phrase: I AM THAT I AM
    kind: words
    title: What the words I AM THAT I AM say
    body: |
      God answers the question about His name with a form of the verb “to be,” and the name given in the next verse is built on that verb. The Hebrew is *ehyeh asher ehyeh*. *Ehyeh* is “I am” or “I will be”; it is the word translated “I will be” two verses earlier, in “Certainly I will be with thee.” The phrase has been rendered several ways. A modern translation gives “I am who I am” and notes “I am what I am or I will be what I will be.” The Septuagint, the ancient Greek translation, has “I am THE BEING.”

      Verse 15 then gives the name itself, which the King James Version prints as “the LORD.” This is the Hebrew name YHWH, “traditionally transliterated as Jehovah in English,” which “is based on the verb ‘to be’ and can mean ‘He is,’ or, in the first person, ‘I am.’” So the “I AM” of verse 14 and the name of verse 15 rest on one verb, the first as God says it of Himself and the second as Israel will say it of Him: “this is my name for ever.” Whether the phrase of verse 14 is itself a name is less sure; it may be “not a name at all” but a statement about the One who bears the name.

      Why would the people ask for a name at all? “In the ancient world, one’s name was far more than an appellation. It revealed the very essence and nature of a person.” The name has been understood in more than one way. The name Jehovah denotes “the eternal I Am.” One reading hears in the repeated verb a promise of nearness: “However absent he may have seemed to the oppressed Israelites in Egypt, . . . his Is-ness means Presence.” Another takes it of God as Creator. Either way “the name reveals something of the nature of God,” and in this chapter it comes joined to “I will be with thee.”
    sources: [oshb-wlc, hardison-theophany, nrsvue, lxx-rahlfs, scripture-helps-ex-1, bd-jehovah]

  - ref: 14
    phrase: I AM hath sent me unto you
    kind: christ
    title: The LORD who speaks is Jesus Christ
    body: |
      The God who names Himself I AM at the bush is Jehovah, and “Jehovah is the premortal Jesus Christ.” The King James Version does not print the name; following Jewish custom, “the name is generally denoted by Lord or God, printed in small capitals.” As a rule, then, “the LORD” in Exodus is this name, and Latter-day Saints read it as the Savior before His birth.

      Jesus claimed the name for Himself. “Before Abraham was, I am” ([[John 8:58]]), He told those who disputed with Him in the temple, and they took up stones ([[John 8:59]]). The Greek words for “I am” recur on His lips through John’s Gospel, “identifying Jesus as the God of the Old Testament.”

      Restoration scripture says so plainly. The risen Lord told the Nephites, “I am he that gave the law, and I am he who covenanted with my people Israel” ([[3 Ne. 15:5]]). And three revelations to Joseph Smith open with the title from the bush: “Listen to the voice of Jesus Christ, your Redeemer, the Great I Am” ([[D&C 29:1]]; see also [[D&C 38:1]]; [[D&C 39:1]]).

      Whether the patriarchs knew the name Jehovah is a separate question, treated at [[Ex. 6:3]].
    sources: [bd-jehovah, sc-knowhy-664, lds-scriptures]

  - ref: 18
    phrase: three days’ journey into the wilderness
    kind: history
    title: Why the request is only for three days
    body: |
      Moses is told to ask Pharaoh for far less than God has just said He will do, and on one older reading the small request is a test, not a trick. In verses 8 and 17 the LORD’s purpose is to bring Israel out of Egypt to Canaan for good. Yet the words given for Pharaoh ask only leave to go three days into the wilderness to sacrifice, and that is what Moses and Aaron say when they stand before him ([[Ex. 5:3]]).

      One explanation is that the first demand came from God’s will “to make known His purposes concerning Israel only step by step.” Another is that the request “served to put Pharaoh to the proof”: asked for so little, his refusal would “find no excuse in the greatness of the requirement.” The next verse adds that the LORD knows, before the request is ever made, that the king will refuse.
    sources: [keil-exodus, lds-scriptures]

  - ref: 22
    phrase: every woman shall borrow of her neighbour
    kind: words
    title: To borrow here is to ask
    body: |
      The Hebrew verb is “ask,” and it is not clear that a loan was meant. The Church’s footnote gives “HEB ask,” and a modern translation reads “each woman shall ask her neighbor.” The verb can mean to borrow, and many have taken it so here, but “it is, however, not clear that there was any pretext of mere temporary use.”

      The verb behind “spoil” means to “strip of, spoil,” and the modern translation has “you shall plunder the Egyptians.” One older reading sees justice in it: “Egypt had spoiled Israel by the tributary labour so unjustly enforced, and now Israel carried off the spoil of Egypt.”

      The promise was also an old one being kept. The LORD “would not let His people go out empty, but, according to the promise in Genesis 15:14, with great substance”: Abraham had been told that his seed would serve a strange nation and “afterward shall they come out with great substance” ([[Gen. 15:14]]). It is carried out as Israel leaves, when the Egyptians “lent unto them such things as they required” ([[Ex. 12:36]]); “lent” there is a form of the same verb.
    sources: [lds-scriptures, oshb-wlc, bdb, nrsvue, keil-exodus]

christ: |
  The witness of Christ in this chapter is the Speaker. The LORD in the bush is Jehovah, the premortal Jesus Christ (see the second note on verse 14), so the words of verses 7–8 are His: “I have surely seen the affliction of my people,” “I know their sorrows,” “I am come down to deliver them.” He made Himself known to Israel as the One to whom His people should look for redemption.

  Latter-day revelation adds that Moses was commanded at the bush to call upon God in the name of the Only Begotten ([[Moses 1:17]]; see the note on verse 4). And the resurrected Lord renewed the promise of deliverance to modern Israel: “ye shall bear record of me, even Jesus Christ, that I am the Son of the living God, that I was, that I am, and that I am to come” ([[D&C 68:6]]).

explore: |
  - **The rest of the conversation.** The scene does not end with the chapter: read [[Ex. 4:1–17]] for Moses’s further doubts and the signs given him.
  - **Stephen’s retelling.** [[Acts 7:30–35]] tells the story of the bush and draws its own point: the Moses whom Israel refused, God sent “to be a ruler and a deliverer.”
  - **Between the bush and Egypt.** Read [[Moses 1]], where Moses sees God face to face, resists Satan, and is promised power over the waters.
  - **The name on Jesus’s lips.** [[John 8:51–59]]; and [[John 6:20]], where “It is I” translates the same Greek words, “I am.”
  - **The return to the mountain.** [[Ex. 19:1–6]], where Israel camps before the mount on which Moses was told they would serve God.
  - **A study of the whole.** “Theophany on Sinai” (Religious Studies Center, 2013) follows Moses’s three meetings with God on this mountain: the call at the bush, the covenant, and its renewal after the golden calf.

