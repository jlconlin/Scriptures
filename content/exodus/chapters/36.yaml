chapter: 36
title: More Than Enough
tagline: The craftsmen receive Israel’s offering and find it is more than the work can use, so Moses has to stop the giving. Then the making begins with the dwelling itself, its curtains, its gilded boards, and its veil.
when: 'At Mount Sinai, after Moses comes down with the second tables (34:29) and before the tabernacle is raised on the first day of the first month of the second year (40:17).'

setting: |
  Israel is still camped at Sinai. Moses has come down from the mount a second time ([[Ex. 34:29]]), gathered the whole congregation, and told them what the LORD commanded: the Sabbath first, then an offering of materials from “whosoever is of a willing heart” ([[Ex. 35:5]]). The people have gone away and come back with their gifts, and Moses has named the two men who will direct the work, Bezaleel and Aholiab (see [[Ex. 31:2]]).

  This chapter is where the building starts. The first seven verses finish the story of the offering. The rest tell of the making of the dwelling: the curtains and coverings, the frame of boards, the veil, and the hanging for the door. The LORD described all of these to Moses in chapter 26, and what each one was is explained there. The furniture comes in the next chapter and the court in the one after.

  The work ends when the tabernacle is “reared up” on the first day of the first month of the second year ([[Ex. 40:17]]).

thread: |
  The chapter has two parts, and only the first is new. In verses 1–7 the workers take over the offering, discover that there is too much of it, and ask Moses to stop the people. In verses 8–38 they begin to build, and from there the account follows the instructions of chapter 26 almost word for word, with the tenses changed from command to report. The curtains and coverings of verses 8–19 were commanded at [[Ex. 26:1–14]], the boards and bars of verses 20–34 at [[Ex. 26:15–29]], and the veil and the door hanging of verses 35–38 at [[Ex. 26:31–37]]. Why the book tells all of this twice is taken up in chapter 35.

  Where the two accounts differ, the differences are small. The instructions began with the ark ([[Ex. 25:10]]). The making begins with the tent that will hold it. The charge to raise the tabernacle after the fashion shown in the mount ([[Ex. 26:30]]) is not repeated here, and neither are the directions for hanging the veil and placing the furniture ([[Ex. 26:33–35]]). Those are done when Moses sets the tabernacle up ([[Ex. 40:21–24]]).

  From verse 8 on the text says simply that “he made” each thing. One older reading takes “he” to be Bezaleel; another takes it as an indefinite “one made,” meaning the workers generally.

  What joins the two parts is said in the first verse. The work is done by people whose skill the LORD gave (see [[Ex. 31:3]]) and whose own hearts moved them to come, and it is done “according to all that the LORD had commanded.”

sections:
  - range: 1-7
    heading: The offering outruns the work
    plain: |
      Bezaleel and Aholiab set to work, with every skilled man to whom the LORD had given wisdom and understanding to know how to do all the work of building the sanctuary, as the LORD had commanded.

      Moses called Bezaleel, Aholiab, and every skilled man whose heart moved him to come and do the work. They received from Moses the whole offering the children of Israel had brought for building the sanctuary. And the people kept bringing freewill offerings morning after morning.

      Then all the craftsmen left what they were doing and came to Moses. “The people are bringing much more than is needed for the work the LORD commanded.” So Moses had it proclaimed through the camp that no man or woman should make anything more as an offering for the sanctuary, and the people were kept from bringing more. The materials they had were enough for all the work, and more than enough.
  - range: 8-19
    heading: The curtains and the coverings
    plain: |
      The skilled workers made the tabernacle of ten curtains of fine twined linen with blue, purple, and scarlet, and with cherubim worked into them. Each curtain was twenty-eight cubits long and four wide. Five were joined into one set and five into another. Fifty loops of blue ran along the edge of each set, and fifty clasps of gold joined the two, so that it became one tabernacle.

      For the tent over the tabernacle he made eleven curtains of goats’ hair, each thirty cubits long and four wide, joined in a set of five and a set of six. Fifty loops on each set and fifty clasps of brass coupled the tent into one.

      Over the tent he made a covering of rams’ skins dyed red, and above that a covering of the leather the King James Version calls badgers’ skins (see [[Ex. 25:5]]).
  - range: 20-34
    heading: The boards and the bars
    plain: |
      He made upright boards of acacia wood for the tabernacle, each ten cubits long and a cubit and a half wide, with two tenons to fit it to the next. Twenty boards stood on the south side on forty bases of silver, two bases under each board for its two tenons. Twenty more stood on the north side on forty silver bases. For the west end he made six boards, and two more for the corners, joined at the bottom and joined at the top to one ring. That made eight boards on sixteen silver bases.

      He made bars of acacia wood, five for the boards of each side and five for the west end, with the middle bar passing through the boards from one end to the other. He overlaid the boards with gold, made rings of gold to hold the bars, and overlaid the bars with gold.
  - range: 35-38
    heading: The veil and the door
    plain: |
      He made the veil of blue, purple, and scarlet, and fine twined linen, with cherubim worked into it. For it he made four pillars of acacia wood overlaid with gold, with hooks of gold, and cast four bases of silver for them.

      For the door of the tabernacle he made a screen of blue, purple, and scarlet, and fine twined linen, done in needlework. It had five pillars with their hooks. He overlaid the tops of the pillars and their fillets with gold, but their five bases were of brass.

notes:
  - ref: 1
    phrase: Then wrought Bezaleel and Aholiab
    kind: words
    title: Verse 1 may be the end of Moses’s speech
    body: |
      The first verse can be read as the last sentence of what Moses says to the people at [[Ex. 35:30–35]], and not as the start of the work. In the King James Version the craftsmen have already “wrought” in verse 1, and yet Moses does not call them or give them the materials until verses 2 and 3.

      A modern translation removes the difficulty by putting verse 1 inside Moses’s speech as an instruction: Bezaleel, Aholiab, and every skilled person “shall work in accordance with all that the Lord has commanded.” Read that way the story runs in order. Moses names the builders and says what they are to do, then calls them, then hands over the offering.

      The plain-words rendering above keeps the King James reading. On either reading the verse says the same two things about the work: the LORD gave the skill for it, and it was to be done as He commanded.
    sources: [nrsvue]

  - ref: 5
    phrase: much more than enough
    kind: history
    title: An offering that had to be stopped
    body: |
      The people gave more than the work could use, and Moses had to forbid them to bring any more. The offering of chapter 35 had already been handed to the craftsmen, and still the gifts came “every morning.” The craftsmen left their work to tell Moses, a proclamation went through the camp, and “the people were restrained from bringing.”

      The wording of the proclamation is odd in English: “Let neither man nor woman make any more work for the offering.” The Hebrew word for “work” here is the one translated “stuff” in verse 7, which the Church’s footnote renders “materials,” and a modern translation gives the proclamation as “No man or woman is to make anything else as an offering for the sanctuary.” Men and women are both named, as both were among the givers ([[Ex. 35:22]]; for the women’s spinning, see [[Ex. 35:25]]).

      None of it had been demanded. The offering was asked only of the willing (see [[Ex. 35:5]]; for the gold the people had to give, see [[Ex. 35:22]]). The givers were the people who had made the golden calf not long before, and whatever their other failings, this was a command they more than kept. Chapter 35 sets the giving beside the calf (see [[Ex. 35:20–29]]).
    sources: [lds-scriptures, nrsvue, oshb-wlc, ot-minute-ex-25]

christ: |
  The dwelling these workers begin is the one the LORD asked for so “that I may dwell among them” ([[Ex. 25:8]]), and the LORD who asked is Jehovah (see [[Ex. 3:14]]). How John takes up that wish in speaking of the Word made flesh is told with chapter 25.

  Of the things made in this chapter, the New Testament names one as a figure of Christ. The veil of verse 35 closed the way into the most holy place, and Hebrews says that the way is now open “through the veil, that is to say, his flesh” ([[Heb. 10:20]]). The note at [[Ex. 26:33]] gives that reading in full.

explore: |
  - **The instructions for what is made here.** [[Ex. 26:1–37]], with the notes there on the curtains, the boards, the veil, and the door.
  - **The offering asked for and brought.** [[Ex. 25:1–7]]; [[Ex. 35:4–29]].
  - **Other willing offerings for the LORD’s house.** [[1 Chr. 29:6–9]], where the people give for the temple and rejoice “for that they offered willingly”; [[2 Chr. 31:5–10]], where the offerings of Hezekiah’s day leave “this great store.”
  - **The dwelling raised.** [[Ex. 40:17–33]], where Moses sets up what is made in this chapter and hangs the veil.

