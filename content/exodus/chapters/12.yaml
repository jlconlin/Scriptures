chapter: 12
title: The Passover
tagline: The LORD tells Israel to slay a lamb, mark their doors with its blood, and eat it dressed for the road. At midnight the firstborn of Egypt die, the marked houses are passed over, and Israel walks out of Egypt.
when: 'The first month, Abib (13:4): the lamb is chosen on the tenth day and slain on the fourteenth, and Israel leaves Egypt that night.'

setting: |
  Nine plagues have fallen on Egypt, and Pharaoh has still not let Israel go (on the hardening of his heart see [[Ex. 4:21]]). In the last chapter Moses told him to his face what the tenth would be: at midnight every firstborn in Egypt would die ([[Ex. 11:4–6]]). Chapter 12 tells of that night and of the instructions given to Israel before it.

  The chapter is the charter of the Passover, the feast “instituted to commemorate the passing over the houses of the children of Israel in Egypt when God smote the firstborn of the Egyptians, and more generally the redemption from Egypt.” What is described here is a meal in a house, with the blood on that house’s door. “The first Passover differed somewhat from those succeeding it”: in the land the feast “became a sanctuary feast,” kept where the LORD’s house stood.

  Later scripture comes back to this night again and again. The psalms sing of it: “Egypt was glad when they departed” ([[Ps. 105:38]]); “To him that smote Egypt in their firstborn” ([[Ps. 136:10]]). Hebrews counts the keeping of it among the acts of Moses’s faith ([[Heb. 11:28]]). And the New Testament sets the death of Jesus Christ at the Passover and calls Him the lamb ([[1 Cor. 5:7]]).

thread: |
  The chapter tells Israel how to remember the night before the night happens. Twenty-eight verses of instruction come first: the LORD to Moses and Aaron (verses 1–20), then Moses to the elders (verses 21–27). Only then does the story move, and it moves fast: midnight, the cry in Egypt, Pharaoh’s summons, the departure (verses 29–42). Then the chapter turns back to law (verses 43–49). It is “a weaving of narrative and law.” This is “the origin story,” written so that it can be “recalled at the annual celebration” and “embodied and reenacted.” The feast and the unleavened bread are commanded “for ever,” and the child’s question is provided for, while the lamb is still alive in the pen.

  Inside the instruction the promise of safety is stated twice. The LORD will pass through Egypt; where He sees the blood He will pass over (verses 13, 23). What is asked of each household is a lamb slain, its blood on the door, and the family inside until morning (verses 6–7, 22).

  The account of Israel’s part is framed by one sentence, which closes the instructions and returns at the end: “as the LORD had commanded Moses and Aaron, so did they” (verses 28, 50).

sections:
  - range: 1-13
    heading: The lamb and the blood on the door
    plain: |
      The LORD spoke to Moses and Aaron in Egypt: “This month is to be the first month of your year. Tell the whole congregation of Israel that on the tenth day of this month every man is to take a lamb for his father’s house, one lamb for a household. If a household is too small for a lamb, it is to share with its nearest neighbor, counting the people and how much each can eat. The lamb must be without blemish, a male a year old, taken from the sheep or from the goats. Keep it until the fourteenth day of the month; then the whole assembly of Israel is to kill it in the evening.

      “They are to take some of the blood and put it on the two side posts and on the lintel of the houses where they eat it. That night they are to eat the flesh roasted with fire, with unleavened bread and bitter herbs. Do not eat it raw or boiled in water, but roasted, with its head, legs, and inner parts. Leave nothing until morning; burn whatever is left. Eat it with your loins girded, your shoes on your feet, and your staff in your hand, and eat it in haste. It is the LORD’s passover.

      “For I will pass through the land of Egypt this night and strike all the firstborn in the land, man and beast, and I will execute judgment against all the gods of Egypt. I am the LORD. The blood will be a token for you on the houses where you are. When I see the blood I will pass over you, and the plague will not destroy you when I strike Egypt.”
  - range: 14-20
    heading: Seven days of unleavened bread
    plain: |
      “This day is to be a memorial for you. Keep it as a feast to the LORD through your generations, an ordinance for ever. For seven days eat unleavened bread. On the first day put leaven out of your houses; whoever eats leavened bread from the first day to the seventh will be cut off from Israel. Hold a holy convocation on the first day and another on the seventh. No work is to be done on them except preparing what everyone must eat.

      “Keep the feast of unleavened bread, because on this very day I have brought your hosts out of Egypt. In the first month, from the evening of the fourteenth day to the evening of the twenty-first, eat unleavened bread. For seven days no leaven is to be found in your houses. Whoever eats what is leavened, sojourner or native, will be cut off from the congregation of Israel. Eat nothing leavened, wherever you live.”
  - range: 21-28
    heading: Moses instructs the elders
    plain: |
      Moses called the elders of Israel and said, “Choose lambs for your families and kill the passover. Take a bunch of hyssop, dip it in the blood in the basin, and strike the lintel and the two side posts with it. None of you is to go out of the door of his house until morning. For the LORD will pass through to strike the Egyptians, and when He sees the blood on the lintel and the two side posts, the LORD will pass over the door and will not allow the destroyer to come into your houses to strike you.

      “Keep this as an ordinance for you and your sons for ever. When you come to the land the LORD will give you, as He has promised, keep this service. And when your children ask you, ‘What do you mean by this service?’ say, ‘It is the sacrifice of the LORD’s passover, who passed over the houses of the children of Israel in Egypt when He struck the Egyptians, and delivered our houses.’” The people bowed their heads and worshipped. Then they went and did as the LORD had commanded Moses and Aaron.
  - range: 29-36
    heading: Midnight
    plain: |
      At midnight the LORD struck all the firstborn in the land of Egypt, from the firstborn of Pharaoh on his throne to the firstborn of the captive in the dungeon, and all the firstborn of the cattle. Pharaoh rose in the night, with all his servants and all the Egyptians, and there was a great cry in Egypt, for there was no house without someone dead.

      He called for Moses and Aaron by night and said, “Rise up and get out from among my people, you and the children of Israel. Go, serve the LORD, as you have said. Take your flocks and herds, as you have said, and be gone; and bless me also.” The Egyptians pressed the people to leave in haste, for they said, “We are all dead men.” So the people took their dough before it was leavened, their kneading troughs wrapped in their clothes on their shoulders. They had done as Moses said and asked the Egyptians for jewels of silver and gold and for clothing. The LORD gave the people favor with the Egyptians, who let them have what they asked. So they spoiled the Egyptians.
  - range: 37-42
    heading: Out of Egypt
    plain: |
      The children of Israel journeyed from Rameses to Succoth, about six hundred thousand men on foot, besides children. A mixed multitude went up with them, and flocks and herds, a great many cattle. They baked unleavened cakes from the dough they had brought out of Egypt; it had not been leavened, because they were thrust out and could not wait, and they had prepared no provisions.

      The sojourning of the children of Israel, who dwelt in Egypt, was four hundred and thirty years. At the end of the four hundred and thirty years, on that very day, all the hosts of the LORD went out of the land of Egypt. It is a night to be much observed to the LORD for bringing them out of Egypt, a night of the LORD to be observed by all the children of Israel in their generations.
  - range: 43-51
    heading: Who may eat the Passover
    plain: |
      The LORD said to Moses and Aaron, “This is the ordinance of the passover. No stranger is to eat of it. A servant bought with money may eat of it once he is circumcised. A foreigner or a hired servant may not. It is to be eaten in one house; carry none of the flesh outside, and do not break a bone of it. All the congregation of Israel is to keep it. When a stranger sojourns with you and wishes to keep the passover to the LORD, let all his males be circumcised; then he may come near and keep it, and he will be as one born in the land. No uncircumcised person may eat of it. There is one law for the native and for the stranger who sojourns among you.”

      All the children of Israel did as the LORD commanded Moses and Aaron. And on that very day the LORD brought the children of Israel out of the land of Egypt by their hosts.

notes:
  - ref: 2
    phrase: the beginning of months
    kind: history
    title: A year that starts from the deliverance
    body: |
      The Exodus resets Israel’s calendar: the month of the deliverance becomes the first month, and the rest are counted from it. The departure is “an event of such significance that it resets time,” and each month afterward is “simply numbered after that, as a constant reminder of their redemption.” The book itself does this from now on, dating the next stage of the journey “on the fifteenth day of the second month after their departing out of the land of Egypt” ([[Ex. 16:1]]).

      The month is named in the next chapter: “This day came ye out in the month Abib” ([[Ex. 13:4]]); the name and its season are explained there.

      The command did not do away with every other way of counting the year. In later Israel the spring month was “the first month on the religious calendar,” the one “used for festival cycles and liturgical purposes,” while Tishri, in the autumn, “was the chronological and agricultural new year.”
    sources: [heal-children-ask, sc-knowhy-849, lds-scriptures]

  - ref: 5
    phrase: without blemish, a male of the first year
    kind: christ
    title: The lamb, and whom scripture says it is
    body: |
      The New Testament names Christ as the Passover lamb: “For even Christ our passover is sacrificed for us” ([[1 Cor. 5:7]]). John the Baptist’s first words about Jesus are “Behold the Lamb of God, which taketh away the sin of the world” ([[John 1:29]]). Peter takes up this verse’s own requirement: we are redeemed “with the precious blood of Christ, as of a lamb without blemish and without spot” ([[1 Pet. 1:19]]).

      John’s Gospel carries it into the hour of the Crucifixion. The lamb was to be killed on the fourteenth day “in the evening” (verse 6), that is, “between the evenings (between sunset and total darkness).” In John, Jesus is condemned on “the preparation of the passover” ([[John 19:14]]), which is read as showing Him crucified “precisely at the time that the Passover lambs were being killed at the temple.” Matthew, Mark, and Luke tell of the Last Supper as the Passover meal itself, so the Gospels differ about the day. Either way, “the important thing is that His death coincided with the Passover season.”

      The rest of the meal has been read the same way: “The elements of the Passover meal: the lamb, the blood, the unleavened bread, and the bitter herbs all pointed toward the coming of the Messiah and the redemption He would offer from sin, death, and hell.”
    sources: [lds-scriptures, bd-feasts, seely-lamb, sc-knowhy-845]

  - ref: 11
    phrase: it is the LORD’s passover
    kind: words
    title: What the word passover means
    body: |
      “Passover” names first what the LORD did, and only afterward the lamb and the feast. The Hebrew verb in verses 13, 23, and 27 means to “pass or spring over,” and in this chapter it is used of the LORD “passing over (sparing)” the houses of Israel. So read, the emphasis is on the sparing more than the motion. Isaiah uses the same verb when he promises that the LORD will defend Jerusalem “as birds flying”: “passing over he will preserve it” ([[Isa. 31:5]]).

      The noun in this verse comes from that verb. Within a few verses it has moved from the act to the animal: “kill the passover” (verse 21) means the passover lamb. On one older reading, the word “came afterwards to be used for the lamb, through which, according to divine appointment, the passing by or sparing had been effected.”
    sources: [bdb, oshb-wlc, keil-exodus, lds-scriptures]

  - ref: 12
    phrase: against all the gods of Egypt I will execute judgment
    kind: history
    title: Judgment on the gods of Egypt
    body: |
      The last plague is a judgment on what Egypt worshipped, though the verse names no god. Numbers says it again when it looks back on this night: the Egyptians were burying their firstborn, and “upon their gods also the LORD executed judgments” ([[Num. 33:4]]). Taken together, the plagues “clearly demonstrated that Jehovah was more powerful than the gods of Egypt, including Pharaoh, who was seen by the Egyptians as a god.”

      Many readers have taken this verse to mean that each plague was aimed at one deity; that pairing, and what the plagues were for from the beginning, are taken up at [[Ex. 7:5]]. A more cautious reading holds that such attempts may miss “the true confrontation being played out in the narrative,” which is with Pharaoh himself.

      On that reading the tenth plague strikes at a royal claim. Egyptian texts say of the king that “those whom he wishes to die will surely die,” and imply “that the king had the ability to protect his children.” On this night “Pharaoh could not exercise his powers in opposition to Jehovah.” The verse closes with the conclusion the plagues were sent to teach: “I am the LORD.”
    sources: [lds-scriptures, scripture-helps-ex-7, muhlestein-pharaoh]

  - ref: 13
    phrase: the blood shall be to you for a token
    kind: symbol
    title: A sign of the household’s obedience
    body: |
      The blood on the door is called a token “to you,” and it is read as the household’s own sign of obedience and faith. When the Lord came in the night “He would acknowledge the obedience of the household.” The token “indicated the commitment to follow God, obey Him, and have faith and trust in Him.”

      Hebrews names faith when it looks back on this night: “Through faith he kept the passover, and the sprinkling of blood” ([[Heb. 11:28]]). Moses’s own instructions add that the household was to stay behind the marked door: “none of you shall go out at the door of his house until the morning” (verse 22).
    sources: [lds-scriptures, seely-lamb, ot-minute-ex-7]

  - ref: 14
    phrase: an ordinance for ever
    kind: prophets
    title: How the feast is kept for ever
    body: |
      The Passover was commanded “for ever,” and the Savior Himself changed the form in which it is kept. At His last Passover He said, “With desire I have desired to eat this passover with you before I suffer” ([[Luke 22:15]]), and at that table He “instituted the ordinance now known as the sacrament of the Lord’s Supper.”

      Elder Howard W. Hunter taught that with Gethsemane, Calvary, and the empty tomb, “Jesus fulfilled the ancient law and ushered in a new dispensation based on a higher, holier understanding of the law of sacrifice. No more would men be required to offer the firstborn lamb from their flock, because the Firstborn of God had come to offer himself.” From then on, “the bread and wine, rather than the animals and herbs, would become emblems of the great Lamb’s body and blood.”

      The risen Lord said as much to the Nephites: “ye shall offer up unto me no more the shedding of blood; yea, your sacrifices and your burnt offerings shall be done away” ([[3 Ne. 9:19]]). Amulek had already said where the law was pointing: “this is the whole meaning of the law, every whit pointing to that great and last sacrifice” ([[Alma 34:14]]).
    sources: [hunter-passover, lds-scriptures]

  - ref: 22
    phrase: a bunch of hyssop
    kind: history
    title: What hyssop was
    body: |
      Hyssop was “a kind of wild marjoram,” “a type of bushy shrub used in some cleansing ceremonies,” and on this night a bunch of it served as the brush. The law later calls for it “for sprinkling purposes in the purification of lepers” and in the rite of the red heifer, and David prays, “Purge me with hyssop, and I shall be clean” ([[Ps. 51:7]]).

      The plant appears once more at a Passover. John says that the sponge of vinegar lifted to Jesus on the cross was “put … upon hyssop” ([[John 19:29]]), where Matthew and Mark mention only a reed. John “likely mentions hyssop more specifically to evoke the command to use a sprig of hyssop to smear the blood of the Passover lamb.”
    sources: [bd-hyssop, ot-minute-ex-7, sc-knowhy-845, lds-scriptures]

  - ref: 23
    phrase: the destroyer
    kind: scripture
    title: The LORD and the destroyer
    body: |
      The chapter says both that the LORD struck Egypt and that a “destroyer” did, and it does not explain how the two are related. In verses 12 and 29 the LORD Himself passes through and smites. In this verse He passes over the door “and will not suffer the destroyer to come in.” The Hebrew word, “destroyer,” is the form used of “the angel that destroyed” at Jerusalem in David’s day ([[1 Chr. 21:15]]).

      Later scripture speaks of the destroyer too. Moses kept the Passover “lest he that destroyed the firstborn should touch them” ([[Heb. 11:28]]), and a latter-day revelation promises the obedient “that the destroying angel shall pass by them, as the children of Israel, and not slay them” ([[D&C 89:21]]). The two can be put together as this verse puts them: the Lord “caused the destroying angel to pass over Israelite homes.”
    sources: [lds-scriptures, bdb, scripture-helps-ex-7]

  - ref: 26
    phrase: What mean ye by this service?
    kind: structure
    title: The children’s question is written into the story
    body: |
      In the middle of urgent instructions for the next few hours, Moses tells parents what to say when their children, not yet born, ask about this service in the promised land. The chapter brings ritual instruction into the story “in a way that almost breaks the fourth wall”: it is “as though the narrator is looking beyond Moses and Aaron,” and beyond the congregation, to “their posterity.” Verses 26–27 are “imagined future narratives.”

      On this reading, “generational remembering is promoted through a culture of questions,” and the feast goes on “establishing inter-generational links” each time a child asks and a parent answers. The answer the parents are given is in the first person: the LORD “delivered our houses.”

      The child’s question returns in the next chapter and in Deuteronomy ([[Ex. 13:14]]; [[Deut. 6:20–21]]). In later times “the history of the redemption from Egypt was related by the head of the household” as part of the feast.

      [When Your Children Ask](/exodus/themes/when-your-children-ask/) follows the book’s memorials from this question to the Last Supper.
    sources: [heal-children-ask, bd-feasts, lds-scriptures]

  - ref: 29
    phrase: the LORD smote all the firstborn in the land of Egypt
    kind: history
    title: Why the firstborn
    body: |
      The tenth plague answers Pharaoh’s refusal to let go Israel, whom the LORD calls His firstborn, and it was announced with that reason before the first plague fell. When Moses was sent back to Egypt he was told to say to Pharaoh, “Israel is my son, even my firstborn: And I say unto thee, Let my son go, that he may serve me: and if thou refuse to let him go, behold, I will slay thy son, even thy firstborn” ([[Ex. 4:22–23]]).

      The verse does not soften what happened. The blow reached from the throne to the dungeon and to the cattle, and “there was not a house where there was not one dead” (verse 30). It came last, after nine plagues and after Moses had told Pharaoh plainly what was coming ([[Ex. 11:4–6]]). In the Old Testament’s judgments generally the Lord “does not rush to condemn but gives repeated warnings and opportunities to repent.” Much in these accounts “remains difficult to fully comprehend.”

      What the LORD then asks of Israel’s own firstborn, whom He spared, is the subject of the next chapter (see [[Ex. 13:2]]).
    sources: [lds-scriptures, scripture-helps-violence]

  - ref: 35
    phrase: they borrowed of the Egyptians
    kind: words
    title: Borrowed means asked
    body: |
      “Borrowed” can be read “asked,” and “lent unto them” in the next verse can be read “let them have.” Nothing here says the goods were to be returned. The word and the promise behind it are explained at [[Ex. 3:22]], where the LORD foretold this moment.
    sources: [lds-scriptures]

  - ref: 37
    phrase: about six hundred thousand on foot that were men
    kind: history
    title: Six hundred thousand men
    body: |
      Taken as it stands, the number means a people of some two million. The figure “agrees approximately with the official census” of [[Num. 1:45–46]], which counted only men of twenty and older who could go to war, so that “the total company could easily have been over two million people.”

      Whether the figure has come down as it was first written is an open question. The starting point is that “numbers were peculiarly difficult to transmit accurately.” The Hebrew word for “thousand,” *’eleph*, which is the word in this verse, “can also be used in a variety of other senses,” such as a family, a clan, “or perhaps a military unit.” If the census lists once used the word in that sense, the fighting force was “some 18,000 which would probably mean a figure of about 72,000 for the whole migration.”

      That is a proposal about how the numbers were copied, offered as something there is “good reason to believe,” and not an established result. The verse itself says “about.”
    sources: [ot-manual-ex-11-19, ot-manual-large-numbers, oshb-wlc]

  - ref: 38
    phrase: a mixed multitude
    kind: history
    title: The mixed multitude and who may eat
    body: |
      The “mixed multitude” were people of other nations who left Egypt with Israel: the Hebrew phrase means “a blending of many; i.e., of other peoples.” Who they were and why they came, the text does not say.

      The law at the end of the chapter answers the question their presence raises. With such a company on the road, “it was necessary to properly identify those who declared themselves to be a part of the Lord’s people.” A stranger may not eat the Passover as a stranger. But one who sojourns with Israel and wishes to keep it may be circumcised with the males of his house, “and he shall be as one that is born in the land” (verse 48). After that there is “one law” for both (verse 49). Circumcision was “a token of the covenant” made with Abraham ([[Gen. 17:11]]); it is explained at [[Gen. 17:10]].
    sources: [lds-scriptures, ot-minute-ex-7]

  - ref: 40
    phrase: four hundred and thirty years
    kind: history
    title: Four hundred and thirty years, counted from when
    body: |
      The Hebrew text counts 430 years in Egypt; the ancient Greek translation spreads the same 430 years over Canaan and Egypt, and Paul seems to count as it does. The Septuagint, the Greek translation, reads here that Israel sojourned “in the land of Egypt and the land of Chanaan” for 430 years, and the Samaritan text has a similar addition. Paul “seems to suggest” the same count when he says the law came “four hundred and thirty years after” the covenant with Abraham ([[Gal. 3:17]]), though he “may have meant something else.” On that count the stay in Egypt itself was about half as long, 215 years.

      Two things favor the longer stay. Abraham was told that his seed would be afflicted “four hundred years” ([[Gen. 15:13]]), which “suggests strongly that the captivity would be four hundred years.” And of the added words in the Samaritan text, “other equally significant texts do not support this addition.” One summary of the evidence for both views “concluded that the idea of the longer captivity is the best supported.”

      The difficulty for the longer count is the genealogy, which names only four generations from Levi to Moses ([[Ex. 6:16–20]]). One older reading answers that biblical genealogies “do not always contain a complete enumeration of all the separate links,” and points to other family lines that run six to ten generations over the same years. The question is not closed. When the Exodus took place is treated at [[Ex. 1:11]]. See [Israel's Story in One Place](/old-testament/guides/israels-story/#patriarchs) for how the sojourn in Egypt fits the rest of the history.
    sources: [lxx-rahlfs, ot-manual-ex-11-19, keil-exodus, lds-scriptures]

  - ref: 42
    phrase: a night to be much observed unto the LORD
    kind: words
    title: A night of watching, kept twice
    body: |
      The Hebrew word behind “observed” can also mean a watching or vigil, and the verse uses it twice, once of the LORD and once of Israel. Its sense is “watching, vigil,” with “observance” as the other rendering, and the phrase can be translated “a night of vigils”; the first half of the verse can be read “the Lord watched to bring them out.” A modern translation shows both halves: “That was for the Lord a night of vigil, to bring them out of the land of Egypt. That same night is a vigil to be kept for the Lord by all the Israelites throughout their generations.”

      Read that way, the night is the LORD’s vigil first and Israel’s afterward. The King James wording brings out Israel’s part, the observance.
    sources: [lds-scriptures, bdb, nrsvue]

  - ref: 46
    phrase: neither shall ye break a bone thereof
    kind: christ
    title: No bone of the lamb is broken
    body: |
      John says that the command not to break the lamb’s bones was fulfilled at the cross. The soldiers broke the legs of the two men crucified with Jesus, “But when they came to Jesus, and saw that he was dead already, they brake not his legs” ([[John 19:33]]). John then gives the reason: “these things were done, that the scripture should be fulfilled, A bone of him shall not be broken” ([[John 19:36]]). The Church’s footnote to this verse sends the reader there.

      John is read as shaping his whole Gospel “to frame the ministry of Jesus the Christ as the Lamb of God,” from the Baptist’s first witness to John’s own testimony at the cross “that He was the Passover Lamb.” A psalm has similar words about the righteous sufferer; see the note at [[Ps. 34:20]].
    sources: [lds-scriptures, seely-lamb]

christ: |
  Scripture itself names what this chapter foreshadows. The lamb without blemish and the unbroken bones are each taken up in the New Testament and applied to Jesus Christ (see the notes on verses 5 and 46). Paul, having called Christ “our passover,” goes on from the lamb to the feast: “Therefore let us keep the feast … with the unleavened bread of sincerity and truth” ([[1 Cor. 5:8]]).

  The chapter turns on two things, and each has its counterpart in Him. A household is spared from death by a lamb’s blood, and a people walks out of bondage. “Just as the blood of the Passover lamb saved the Hebrews from death when it was brushed on their doors, so the blood of Jesus saves all humanity from physical and spiritual death”; and as the Passover brought freedom from Egypt, His suffering, death, and Resurrection “lead to all humanity being free from bondage to sin and death.”

  The Lord also took the meal of this chapter into His own hands: at a Passover table He gave the bread and the cup that His disciples still receive (see the note on verse 14).

explore: |
  - **The night retold and the firstborn claimed.** [[Ex. 13:1–16]] repeats the feast and adds what the LORD asks of Israel’s firstborn.
  - **The Passovers that follow.** After Egypt scripture records one in the wilderness ([[Num. 9:1–5]]) and one at Gilgal ([[Josh. 5:10–11]]), and then none until Hezekiah’s ([[2 Chr. 30]]).
  - **The last Passover.** [[Luke 22:7–20]], where the meal becomes the sacrament, and [[John 19:14–37]], where John sets the Crucifixion beside the lamb.
  - **Leaven.** [[1 Cor. 5:6–8]], Paul’s reading of the seven days of unleavened bread.
  - **The destroying angel in a latter-day promise.** [[D&C 89:18–21]].
  - **A study of the whole image.** “Behold the Lamb of God” (Religious Studies Center, 2008) follows the lamb through scripture, from the sacrifices and the Passover to the Lamb of the book of Revelation.

