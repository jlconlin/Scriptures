chapter: 25
title: A Sanctuary for the LORD
tagline: On the mountain the LORD asks Israel for a willing offering and a sanctuary, so that He may dwell among them. He begins with its furniture, the ark and its mercy seat, a table for bread, and a golden lampstand, each to be made after the pattern He shows Moses.
when: 'During the forty days and forty nights Moses spent on Mount Sinai (24:18).'

setting: |
  Moses has gone up into the cloud on Sinai, where he stays forty days and forty nights ([[Ex. 24:18]]). What the LORD says to him there fills chapters 25–31, and nearly all of it concerns one thing: a sanctuary for Israel to build and carry with them. The making is told in chapters 35–39 and the setting up in chapter 40. Thirteen chapters in all, “almost one third” of the book, are given to it.

  The tabernacle became “the center place of Israel’s worship activities during the wanderings and until the building of the temple in Solomon’s day.” This chapter gives the reason for it, the materials, and the first three furnishings: the ark, the table, and the lampstand. The altar of incense, which stood with the table and the lampstand, is not described until [[Ex. 30:1]].

  Israel had come out of Egypt with “jewels of silver, and jewels of gold, and raiment” ([[Ex. 12:35]]; see [[Ex. 3:22]]).

  The New Testament returns to this chapter more than once. Stephen cites it before the council ([[Acts 7:44]]), and Hebrews quotes its last verse to explain what the tabernacle was ([[Heb. 8:5]]).

thread: |
  The chapter gives its reason before any of its measurements: “let them make me a sanctuary; that I may dwell among them.” Everything after verse 8 furnishes that dwelling, and the order is worth noticing. The instructions do not begin with walls or a courtyard. They begin with the ark, “the most sacred aspect of the tabernacle,” and from there the LORD “worked out” toward the court, which is reached in chapter 27. The section on the ark ends with a promise: “there I will meet with thee” (verse 22).

  After the ark come a table with bread on it and a lamp. The furnishings of the holy place, though made of gold or covered with it, each “served a mundane, domestic function.”

  Two requirements frame the instructions. The first is willingness. The materials are to come only from “every man that giveth it willingly with his heart,” and when the time came the people gave so much that “the craftsmen asked Moses to turn the people away” (told at [[Ex. 36:5–7]]). The second is the pattern. Verse 9 and verse 40 both hold Moses to what he is shown on the mount (see the note on verse 9). The sanctuary was “not the design of men, but of the Lord.”

sections:
  - range: 1-9
    heading: A willing offering and a sanctuary
    plain: |
      The LORD told Moses to ask the children of Israel for an offering, to be taken from everyone whose heart moved him to give. These are the things to receive: gold, silver, and bronze; blue, purple, and scarlet yarn, fine linen, and goats’ hair; rams’ skins dyed red, fine leather, and acacia wood; oil for the lamp, and spices for the anointing oil and the incense; onyx and other stones to be set in the ephod and the breastplate.

      “Let them make me a sanctuary, so that I may dwell among them. Make it exactly as I show you, after the pattern of the tabernacle and the pattern of all its furnishings.”
  - range: 10-22
    heading: The ark and the mercy seat
    plain: |
      They are to make an ark of acacia wood, two and a half cubits long and a cubit and a half wide and high, overlaid with pure gold inside and out, with a gold molding around it. Four gold rings are fixed at its four corners, two on each side, and poles of acacia overlaid with gold pass through the rings to carry it. The poles stay in the rings and are never taken out. Into the ark goes the testimony that the LORD will give.

      Over it goes a mercy seat of pure gold, two and a half cubits long and a cubit and a half wide. Two cherubim of hammered gold stand at its two ends, made as part of it, their wings spread upward and covering the mercy seat, their faces turned toward each other and toward the mercy seat.

      “There I will meet with you. From above the mercy seat, from between the two cherubim on the ark of the testimony, I will speak with you of all that I give you in commandment for the children of Israel.”
  - range: 23-30
    heading: The table and its bread
    plain: |
      Make a table of acacia wood, two cubits long, a cubit wide, and a cubit and a half high, overlaid with pure gold, with a gold molding around it. Around it goes a rim a handbreadth wide, with a gold molding on the rim. Four gold rings at the four corners, by its legs and close to the rim, hold the gold-covered poles that carry it. Its dishes and spoons, and the jars and bowls for pouring drink offerings, are to be of pure gold.

      “And you shall set the bread of the Presence on the table before me always.”
  - range: 31-40
    heading: The golden lampstand
    plain: |
      Make a lampstand of pure gold, of hammered work: its shaft and branches, its cups, buds, and flowers are all to be of one piece with it. Six branches come out of its sides, three on one side and three on the other. Each branch has three cups shaped like almond blossoms, each with a bud and a flower. The lampstand itself has four such cups, with a bud beneath each pair of branches. The whole is one hammered piece of pure gold.

      Make its seven lamps, and set them up so that they give light in front of it. Its tongs and snuff dishes are to be of pure gold. The lampstand and all these utensils are to be made from one talent of pure gold.

      “See that you make them after their pattern, which was shown you on the mount.”

notes:
  - ref: 5
    phrase: badgers’ skins, and shittim wood
    kind: words
    title: Bronze, acacia, and an unidentified leather
    body: |
      Three King James names in this list mislead a modern reader: “brass” is bronze, “shittim wood” is acacia, and “badgers’ skins” is a leather whose identity is uncertain. A modern translation reads “gold, silver, and bronze” and “tanned rams’ skins, fine leather, acacia wood.”

      Shittim wood is “acacia,” “a hardy wood that is very resistant to rot and decay,” and the ancient Greek translation calls it simply “incorruptible wood.” For the skins the Greek translators wrote “blue skins.” The Hebrew word means “a kind of leather or skin, and perhaps the animal yielding it,” and a sea animal, the dugong, has been suggested. The plain-words rendering above says “fine leather,” since “the original Hebrew word has been lost over the centuries.”

      The metals are named in descending order of value, and one reading is that the dyed cloths are as well. The colors raise a question the chapter does not answer. “Any explicit meaning behind this selection of colors is unknown since the text gives no indication of their significance,” though the same three mark the tabernacle’s entrances and the priest’s clothing. Gold is “often seen as a symbol of divinity, royalty, and wealth”; that is a reading brought to the text.
    sources: [nrsvue, lds-scriptures, ot-minute-ex-25, lxx-rahlfs, bdb, belnap-dwell-among]

  - ref: 8
    phrase: a sanctuary; that I may dwell among them
    kind: history
    title: A house for the LORD in the camp
    body: |
      The tabernacle was the LORD’s house among Israel’s tents, and the reason He gives for it is that He wishes to live among His people. It “was in fact a portable temple,” and “like modern temples, the tabernacle was the house of the Lord.”

      Two words name it. A “sanctuary” is a holy place. The “tabernacle” of the next verse is in Hebrew a “dwelling-place,” a noun made from the verb “dwell” in this verse.

      The mercy seat within it “was regarded as the earthly dwelling place of Jehovah.” The verb “implies a nonpermanent residence,” and one reading is that the tabernacle was “more of a meeting place rather than as a permanent dwelling place of God.” The chapter’s own promise is “there I will meet with thee” (verse 22). God’s wish to be among His people has been read as “a mortal-divine relationship not existing in other religions of the ancient Near East.”

      The building had three parts: a court, a holy place, and a most holy place, each nearer than the last to the presence of God. The curtains, the veil, and the court are described in chapters 26 and 27.

      The purpose is stated once more when the instructions for the priests are finished: “And I will dwell among the children of Israel, and will be their God” ([[Ex. 29:45]]).
    sources: [bd-tabernacle, scripture-helps-ex-35, bd-ark-of-the-covenant, belnap-dwell-among, bdb, oshb-wlc, lds-scriptures]

  - ref: 9
    phrase: after the pattern of the tabernacle
    kind: scripture
    title: A pattern shown on the mountain
    body: |
      Moses was shown what to build, and Hebrews says that what he built from it was a likeness and shadow of things in heaven. The charge to follow the pattern opens and closes this chapter (verses 9 and 40) and comes back in the chapters that follow, a “recurrent theme” of the building instructions: “thou shalt rear up the tabernacle according to the fashion thereof which was shewed thee in the mount” ([[Ex. 26:30]]).

      Hebrews quotes verse 40 and says what it implies. The priests of the tabernacle “serve unto the example and shadow of heavenly things, as Moses was admonished of God when he was about to make the tabernacle” ([[Heb. 8:5]]). The holy places made with hands are “the figures of the true,” and the true is “heaven itself” ([[Heb. 9:24]]). Stephen says more briefly that Moses was to make it “according to the fashion that he had seen” ([[Acts 7:44]]).

      The word returns when a temple replaces the tent. David hands Solomon the plan of the house and says that the LORD “made me understand in writing by his hand upon me, even all the works of this pattern” ([[1 Chr. 28:19]]).
    sources: [bdb, morales-tabernacle, lds-scriptures]

  - ref: 10
    phrase: an ark of shittim wood
    kind: history
    title: The ark of the covenant
    body: |
      The ark was a chest of acacia wood covered with gold that held the tables of the law, and it was the only furnishing of the most holy place. It was “the oldest and most sacred of the religious symbols of the Israelites.”

      A cubit is the length of a forearm, “normally about 17½ inches,” which makes the ark “about 3.75 feet (1.1 meters) long by 2.25 feet (0.7 meters) deep and tall.” Its “crown of gold” was not a king’s crown. The word more likely describes a “crown molding,” an edging around the top, and the plain-words rendering above says “molding.”

      It held the Testimony, the two tables of stone, and from them it is called both the ark of the testimony and the ark of the covenant. The Hebrew word for testimony “indicates the establishment of a relationship between two parties.” What else was kept with the ark is told at [[Ex. 16:34]].

      The table and the altars also had carrying poles, but only the ark’s were to stay in their rings (verse 15). “This was likely because no one was to touch the ark itself due to its sacred nature.” The Levites who carried the holy things were warned that “they shall not touch any holy thing, lest they die” ([[Num. 4:15]]).

      John saw the ark in his vision of heaven: “the temple of God was opened in heaven, and there was seen in his temple the ark of his testament” ([[Rev. 11:19]]).
    sources: [bd-ark-of-the-covenant, bd-tabernacle, bd-weights-and-measures, ot-minute-ex-25, belnap-dwell-among, lds-scriptures]

  - ref: 17
    phrase: a mercy seat of pure gold
    kind: words
    title: The mercy seat, the place of atonement
    body: |
      The name “mercy seat” translates a Hebrew word made from the verb for atonement, and it names the place where atonement was made. It was not a chair. It was the “golden covering of the Ark of the Covenant,” a slab of gold the size of the ark’s top.

      The Hebrew word can be rendered “atonement-cover” or “propitiatory,” meaning a place of atonement. The English name goes back to William Tyndale, who “coined the term mercy seat in his translation.” A modern translation says only “a cover of pure gold.” The ancient Greek translation keeps both ideas: “a propitiatory, a lid of pure gold.”

      What was done there explains the name. Once a year, on the Day of Atonement, the high priest carried the blood of the sin offering within the veil to “sprinkle it upon the mercy seat, and before the mercy seat” ([[Lev. 16:15]]). With the ark beneath it, the mercy seat served “as an altar on which the highest atonement known to the Jewish law was effected.”

      How the verb came to mean atonement is explained in more than one way. One takes it as to “cover over sin.” Another traces it instead from a concrete sense of rubbing or wiping to the purging of sin and impurity from the sanctuary. That purging “had the effect of repairing or maintaining the deity’s presence and blessing,” so that “the roots of atonement as bringing two back together, healing a rift, were already present.” The English word says as much by its parts: at-one-ment. For the same verb with God as the one who atones, see [[Ps. 78:38]].
    sources: [bd-mercy-seat, lds-scriptures, ot-minute-ex-25, nrsvue, bdb, lxx-rahlfs, bd-tabernacle, spackman-atonement]

  - ref: 18
    phrase: two cherubims of gold
    kind: symbol
    title: The cherubim
    body: |
      Cherubim in scripture guard holy places and stand at the throne of God. They are figures “representing heavenly creatures, the exact form being unknown.”

      Scripture first shows them at the edge of Eden, placed “to keep the way of the tree of life” ([[Gen. 3:24]]). Their appearances elsewhere suggest two functions. Their “first function is to guard selected space,” in Eden and here over the ark. The tabernacle’s inner curtains were “embroidered with figures of cherubim” as well. The second function is movement. God is spoken of as sitting between the cherubim, and in Ezekiel they are “those that bear him from place to place.”

      The mercy seat with its cherubim is accordingly spoken of as a throne. It “was God’s throne in Israel,” and the LORD is the one “which dwelleth between the cherubims” ([[1 Sam. 4:4]]).

      The wings may be a symbol more than a likeness. A latter-day revelation says of the winged beasts in John’s vision that “their wings are a representation of power, to move, to act” ([[D&C 77:4]]), and the same has been said of these.

      The figures were not made separately and fastened on. Verse 19 has them made “of the mercy seat,” that is, “as part of it.”
    sources: [bd-cherubim, belnap-dwell-among, bd-tabernacle, ot-manual-ex-25-30, lds-scriptures]

  - ref: 21
    phrase: the mercy seat above upon the ark
    kind: christ
    title: The mercy seat and the word propitiation
    body: |
      Paul calls Jesus Christ a propitiation, and his Greek word is the one the Greek Old Testament uses for the mercy seat; whether he meant the mercy seat itself is disputed. In the Greek Old Testament that word, *hilastērion*, is the name of “the well-known cover of the ark of the covenant in the Holy of holies,” and Hebrews uses it in describing the ark: “over it the cherubims of glory shadowing the mercyseat” ([[Heb. 9:5]]). Paul uses it once, of the Savior: “Whom God hath set forth to be a propitiation through faith in his blood” ([[Rom. 3:25]]).

      Many interpreters, ancient and modern, have read him as saying that Christ “besprinkled with his own blood” was in truth what the mercy seat “had been typically, i. e., the sign and pledge of expiation.” Others take the word in that verse as “an expiatory sacrifice.”

      Hebrews draws the comparison at length. The high priest went within the veil once a year with blood that was not his own. Christ “by his own blood he entered in once into the holy place, having obtained eternal redemption for us” ([[Heb. 9:12]]). The blood sprinkled on the mercy seat on the Day of Atonement “can also represent the blood of Jesus Christ.”
    sources: [thayer, lds-scriptures, scripture-helps-ex-35]

  - ref: 22
    phrase: there I will meet with thee
    kind: scripture
    title: Where the LORD would speak
    body: |
      The mercy seat was to be the place where the LORD met Moses and went on giving him commandments for Israel. It was “the place of the manifestation of God’s glory and His meeting place with His people.” One study describes the movement from the mountain to the most holy place of the tent: “the glory cloud transitions from Sinai to the tabernacle Holy of Holies,” and what happened at Sinai “is continued in the tabernacle.”

      The promise was kept. After the tabernacle was set up, Moses went in to speak with the LORD, and “he heard the voice of one speaking unto him from off the mercy seat that was upon the ark of testimony, from between the two cherubims” ([[Num. 7:89]]).

      The same presence is why the most holy place was closed to nearly everyone. Aaron was told not to come within the veil at all times, “for I will appear in the cloud upon the mercy seat” ([[Lev. 16:2]]).
    sources: [bd-mercy-seat, morales-tabernacle, lds-scriptures]

  - ref: 30
    phrase: shewbread before me alway
    kind: history
    title: The bread of the Presence
    body: |
      Shewbread is bread set out before the LORD; its Hebrew name means “bread of faces, or bread of the presence.” Twelve unleavened loaves lay on the table in two piles, with frankincense on each. They were replaced every Sabbath, and the priests ate the old loaves in a holy place. The law for it is in [[Lev. 24:5–9]].

      The bread stood for the whole people and was also a meal: “In the shewbread the 12 tribes were perpetually presented before God; yet it was wholly consumed by man; thus it provided both a sacrifice and a communion.”

      The table “was, functionally, simply a table with food on it,” and the furnishings of the holy place share an “association with rites of hospitality.” One reading of the priests’ weekly meal is that Israel, through its priests, could “symbolically come into the presence of God and break bread with Him each week.”

      The vessels of verse 29 served drink as well as bread. “To cover withal” is in Hebrew “wherewith to pour libations,” that is, drink offerings, and the plain-words rendering above follows that.

      The Savior appealed to this bread when the Pharisees accused His disciples of breaking the Sabbath. David, He reminded them, “did eat the shewbread, which was not lawful for him to eat” ([[Matt. 12:4]]). The lesson He drew is that “the law of charity overrides every ritual law.”
    sources: [lds-scriptures, bd-shewbread, belnap-dwell-among, ot-minute-ex-25]

  - ref: 31
    phrase: a candlestick of pure gold
    kind: symbol
    title: The lampstand and its almond blossoms
    body: |
      The “candlestick” was a seven-branched stand for oil lamps, ornamented with almond blossoms. It is more properly called the “menorah, or lampstand.” “From the main vertical stem three pairs of branches extended, curving upward so that all seven lamps on the ends were at the same level.” The “bowls,” “knops,” and “flowers” are its ornament: cups, buds, and flowers, or in a modern translation “cups shaped like almond blossoms, each with calyx and petals.” The whole was hammered from a talent of gold (verse 39), “about 75.6 pounds.”

      “This was the only light in the tabernacle.” The lamps burned olive oil (see [[Ex. 27:20]]), and “Aaron lit the lamps at evening and dressed them in the morning.”

      The text does not say why the lamp has branches and blossoms. “In Jewish tradition, the menorah, with its treelike form and ornamentation, is often associated with the burning bush as well as the tree of life.” One study reads it the same way, as “a representation of the tree of life with its seven branches”; another says only that it “may have represented the cosmic tree.” The number of its lamps “often represents wholeness, completeness, or perfection.”

      The Revelation of John shares the image. John saw “in the midst of the seven candlesticks one like unto the Son of man” ([[Rev. 1:13]]) and was told that “the seven candlesticks which thou sawest are the seven churches” ([[Rev. 1:20]]). Light is a symbol of Jesus Christ, who said, “I am the light of the world” ([[John 8:12]]).
    sources: [bd-candlestick, nrsvue, bd-weights-and-measures, ot-minute-ex-25, bd-tabernacle, ensign-menorah-2018, sc-knowhy-702, belnap-dwell-among, scripture-helps-ex-35, lds-scriptures]

christ: |
  The LORD who asks for a tent among Israel’s tents is Jehovah (see [[Ex. 3:14]]), and John tells of His coming in the flesh with the word of this chapter: “the Word was made flesh, and dwelt among us” ([[John 1:14]]). The Greek behind “dwelt” means, in essence, that He “tabernacled among us.”

  Hebrews reads the tabernacle itself as a witness of Him. What its priests served was a shadow (see the note on verse 9), and the reality arrived with “Christ being come an high priest of good things to come, by a greater and more perfect tabernacle, not made with hands” ([[Heb. 9:11]]). The high priest who carried blood through the veil to the mercy seat “foreshadowed Jesus Christ.” Paul’s use of the Greek word for the mercy seat is taken up in the note on verse 21.

  The wish spoken in verse 8 is also where scripture ends. John heard a great voice out of heaven: “Behold, the tabernacle of God is with men, and he will dwell with them, and they shall be his people, and God himself shall be with them, and be their God” ([[Rev. 21:3]]).

explore: |
  - **The offering brought and the work done.** [[Ex. 35:4–29]] and [[Ex. 36:2–7]] for the people’s gifts; [[Ex. 37:1–24]] for the making of the ark, the table, and the lampstand.
  - **The Day of Atonement at the mercy seat.** [[Lev. 16:2–17]].
  - **The tabernacle read by the New Testament.** [[Heb. 8:1–5]]; [[Heb. 9:1–12]]; [[Heb. 9:23–24]].
  - **The ark brought into the temple.** [[1 Kgs. 8:1–11]], where the cloud fills Solomon’s house.
  - **Others who built from what the LORD showed them.** [[1 Chr. 28:11–19]]; [[1 Ne. 17:8]]; [[Ether 2:16]].
  - **A study of the tabernacle’s spaces.** “‘That I May Dwell among Them’: Liminality and Ritual in the Tabernacle” (Religious Studies Center, 2013) reads the tabernacle’s colors, cherubim, and furniture as marking a place where God and Israel could meet.

