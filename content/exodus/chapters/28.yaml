chapter: 28
title: Holy Garments for Aaron
tagline: The LORD names Aaron and his sons as priests and describes what they are to wear. Aaron will carry the names of the twelve tribes on his shoulders and over his heart, and on his forehead the words HOLINESS TO THE LORD.
when: 'During Moses’s forty days and forty nights on Mount Sinai (24:18).'

setting: |
  Moses is on the mount, in the cloud, where he stays forty days and forty nights ([[Ex. 24:18]]). The LORD has been showing him a sanctuary to build and what is to stand in it (see [[Ex. 25:8]]). The last chapter closed with the oil for the lamp ([[Ex. 27:20]]). This one turns from the house to the men who will serve in it.

  Aaron is Moses’s elder brother, of the tribe of Levi, and has been his spokesman since Egypt (see [[Ex. 4:14]]). Here he and his four sons are named as priests, and nearly all of the chapter describes what Aaron is to wear. He was “the first high priest of the Aaronic order,” and most of the garments are those of that office. His sons’ plainer clothing takes a few verses at the end.

  Nothing is made yet. Craftsmen make the garments in [[Ex. 39:1–31]], “as the LORD commanded Moses” ([[Ex. 39:1]]), and Moses puts them on Aaron in [[Lev. 8:7–9]]. The next chapter gives the rite by which the priests are washed, clothed and anointed (see [[Ex. 29:4]]).

thread: |
  The chapter dresses a man to go where the rest of Israel may not, and his garments say that he does not go for himself.

  What only the high priest wore comes first: the ephod with its shoulder stones, the breastplate tied to the ephod, the Urim and Thummim inside the breastplate, the blue robe, and the gold plate on the forehead. Only then comes the plain linen that every priest wore. Ordinary priests had four garments, and the high priest four more.

  One word runs through the high priest’s part. Aaron is to “bear” the names of the children of Israel on his shoulders (verse 12) and on his heart (verse 29); he is to “bear the judgment of the children of Israel” (verse 30); and he is to “bear the iniquity of the holy things” they bring (verse 38). Each time it is “before the LORD.” The man who ministered in the tabernacle “represented all Israel” there, and the garments make that visible: twelve names cut in stone go in with him each time.

  One Latter-day Saint reading sees the cloth, too, as marking a man who goes between. The ephod and breastplate are of blue, purple and scarlet, the colors that marked the tabernacle’s gate, door and veil. The text gives no meaning for the colors, but they mark the places of passage, and on this reading a priest dressed in them is a figure “who moved between the different states and whose purpose was to facilitate such movement.”

  Twice the chapter names the stakes: Aaron’s bells must sound “that he die not” (verse 35), and the priests must be covered “that they bear not iniquity, and die” (verse 43).

sections:
  - range: 1-5
    heading: Aaron and his sons, and garments to consecrate them
    plain: |
      “Bring your brother Aaron to you, and his sons with him, from among the children of Israel, so that he may serve me as priest: Aaron, and Aaron’s sons Nadab and Abihu, Eleazar and Ithamar. Make holy garments for your brother Aaron, for glory and for beauty. Speak to all the skilled workers whom I have filled with the spirit of wisdom, so that they make Aaron’s garments to consecrate him to serve me as priest.

      “These are the garments they are to make: a breastplate, an ephod, a robe, an embroidered coat, a mitre, and a girdle. They are to make holy garments for Aaron and his sons, and they are to use gold, blue, purple and scarlet, and fine linen.”
  - range: 6-14
    heading: The ephod and the stones on its shoulders
    plain: |
      “They are to make the ephod of gold, blue, purple, scarlet, and fine twined linen, skillfully worked. It is to have two shoulder pieces joined at its two edges. Its skillfully woven band is to be of the same work and the same materials.

      “Take two onyx stones and engrave on them the names of the children of Israel, six on one stone and six on the other, in the order of their birth. Engrave them as a signet is engraved, and set them in settings of gold. Put the two stones on the shoulders of the ephod as stones of memorial for the children of Israel. Aaron shall bear their names before the LORD on his two shoulders for a memorial. Make settings of gold, and two braided chains of pure gold, and fasten the chains to the settings.”
  - range: 15-30
    heading: The breastplate of judgment
    plain: |
      “Make the breastplate of judgment, skillfully worked like the ephod and of the same materials. It is to be square when doubled, a span long and a span wide. Set in it four rows of stones: a sardius, a topaz, and a carbuncle; an emerald, a sapphire, and a diamond; a ligure, an agate, and an amethyst; a beryl, an onyx, and a jasper. They are to be set in gold. There are to be twelve stones, engraved like signets with the names of the children of Israel, one for each of the twelve tribes.

      “Make braided chains of pure gold and two gold rings for the two ends of the breastplate. Run the chains through the rings and fasten their other ends to the two settings on the shoulder pieces of the ephod. Make two more gold rings for the two ends of the breastplate, on its inner edge next to the ephod, and two for the ephod itself, low on its front above the woven band. Bind the breastplate by its rings to the rings of the ephod with a lace of blue, so that it does not come loose from the ephod.

      “So Aaron shall bear the names of the children of Israel in the breastplate of judgment on his heart when he goes into the holy place, for a memorial before the LORD continually. Put the Urim and the Thummim in the breastplate of judgment, and they shall be on Aaron’s heart when he goes in before the LORD. Aaron shall bear the judgment of the children of Israel on his heart before the LORD continually.”
  - range: 31-35
    heading: The robe of the ephod
    plain: |
      “Make the robe of the ephod all of blue. It is to have an opening for the head in the middle of it, with a woven binding around the opening, like the opening of a coat of mail, so that it does not tear. On its hem make pomegranates of blue, purple and scarlet, with bells of gold between them all the way around: a golden bell and a pomegranate, a golden bell and a pomegranate. Aaron is to wear it when he ministers. Its sound shall be heard when he goes into the holy place before the LORD and when he comes out, so that he does not die.”
  - range: 36-38
    heading: The plate on the forehead
    plain: |
      “Make a plate of pure gold and engrave on it, as a signet is engraved, HOLINESS TO THE LORD. Fasten it with a blue lace to the front of the mitre. It shall be on Aaron’s forehead, and Aaron shall bear the iniquity of the holy things that the children of Israel consecrate in all their holy gifts. It shall always be on his forehead, so that they may be accepted before the LORD.”
  - range: 39-43
    heading: Linen for all the priests
    plain: |
      “Weave the coat of fine linen, make the mitre of fine linen, and make the girdle of needlework. For Aaron’s sons make coats, girdles, and headdresses, for glory and for beauty. Put them on your brother Aaron and on his sons with him, and anoint them, consecrate them, and sanctify them, so that they may serve me as priests.

      “Make them linen breeches to cover their nakedness, reaching from the waist to the thighs. Aaron and his sons are to wear them when they go into the tent of meeting or come near the altar to minister in the holy place, so that they do not incur guilt and die. This is a statute forever for him and for his descendants after him.”

notes:
  - ref: 1
    phrase: that he may minister unto me in the priest’s office
    kind: history
    title: Aaron, his sons, and the priesthood they held
    body: |
      Aaron and his four sons are here set apart from the rest of Israel as priests. Latter-day revelation names the priesthood they received: “the Lord confirmed a priesthood also upon Aaron and his seed, throughout all their generations” ([[D&C 84:18]]). It is the priesthood called Aaronic, or Levitical, “of lesser power and authority than the priesthood of Melchizedek,” and it “was used to administer the outward ordinances.”

      There were ranks within it. The lesser priesthood was conferred only on men of the tribe of Levi, but within that tribe “only Aaron and his sons could hold the office of priest,” and from Aaron’s line came the high priest. Priests offered the sacrifices, burned incense, and taught the law. The other Levites assisted them (for the Levites, see [[Ex. 32:26]]).

      Aaron did not put himself forward; the LORD tells Moses to take him. Hebrews makes a rule of it: “no man taketh this honour unto himself, but he that is called of God, as was Aaron” ([[Heb. 5:4]]).

      The four sons did not fare alike. Nadab and Abihu, who had gone up the mount with Moses and the elders ([[Ex. 24:9]]), later “offered strange fire before the LORD, which he commanded them not” ([[Lev. 10:1]]), and died for it. Eleazar was clothed in his father’s garments when Aaron died ([[Num. 20:28]]), and the high priesthood stayed in his family until the time of Eli, who was of Ithamar’s line.

      The Aaronic Priesthood continued “with the house of Aaron among the children of Israel” ([[D&C 84:27]]) from Aaron until John the Baptist. How it relates to the higher priesthood that Israel was offered at Sinai is told at [[Ex. 34:1]].
    sources: [lds-scriptures, bd-aaronic-priesthood, bd-high-priest]

  - ref: 2
    phrase: for glory and for beauty
    kind: symbol
    title: Why the priests wore holy garments
    body: |
      The clothing was part of what fitted a priest to serve, and the chapter says so directly: the garments are made “to consecrate him, that he may minister unto me” (verse 3). Being clothed in them, with the washing and anointing of the next chapter, prepared Aaron and his sons to officiate in the tabernacle. The priests’ clothing was “sacred and deeply symbolic,” as clothing associated with temple ordinances is today.

      “For glory and for beauty” is said of the high priest’s dress here and of his sons’ plain linen in verse 40. On one reading the garments’ function was “to remind the Israelites that a powerful, holy and just God was indeed present with them in so far as the wearer of the garments was held to be linked to Him.”

      The garments went with the office. “The holy garments of Aaron shall be his sons’ after him” ([[Ex. 29:29]]), and when Aaron died Moses “stripped Aaron of his garments, and put them upon Eleazar his son” ([[Num. 20:28]]).

      The “wise hearted” who are to make them are named at [[Ex. 31:2]].
    sources: [scripture-helps-ex-35, clothed-holy-garments, lds-scriptures]

  - ref: 6
    phrase: the ephod
    kind: history
    title: What an ephod was
    body: |
      The ephod was the high priest’s outermost garment, and the King James Version leaves its Hebrew name untranslated; what it looked like is still debated. It has been described as “shaped like a waistcoat with two shoulder pieces and a girdle” and as a “shoulder-cape or mantle”; most scholars take it to have been an apron.

      The chapter gives its parts and not its cut: two shoulder pieces joined at the edges, a band of the same work to bind it on (the “curious girdle,” which is a skillfully woven one), and gold worked in with the blue, purple, scarlet and linen.

      It matters for what was fastened to it: the two stones on the shoulders, and the breastplate with the Urim and Thummim. In later scripture a priest’s ephod is sent for when someone wants to inquire of the LORD: David, learning that Saul is plotting against him, says to Abiathar the priest, “Bring hither the ephod” ([[1 Sam. 23:9]]). On one view the inquiry was made “by Urim & Thummim in the breast-piece attached to the ephod.”

      A plain linen ephod is also mentioned as the dress of other priests, of the boy Samuel, and of David when he brought up the ark.
    sources: [bd-ephod, bdb, clothed-holy-garments, lds-scriptures]

  - ref: 12
    phrase: bear their names before the LORD upon his two shoulders
    kind: symbol
    title: Israel’s names on the shoulders and over the heart
    body: |
      Aaron carries the names of the twelve tribes into the sanctuary twice over: on two onyx stones on his shoulders, six names to a stone, and on twelve stones over his heart, one name to a stone (verses 21 and 29). Both are “for a memorial.”

      A memorial is a reminder, and on one older reading it reminds God: Aaron bore the names “that Jehovah might remember the sons of Israel when Aaron appeared before Him.” On that reading the high priest did not enter on his own account: “To show that as mediator he brought the nation to God, the names of the twelve tribes were engraved upon precious stones.”

      Verse 29 adds “continually”: the names go in whenever he does.
    sources: [keil-exodus]

  - ref: 15
    phrase: the breastplate of judgment
    kind: history
    title: A pouch of cloth set with twelve stones
    body: |
      The breastplate was not armor but a piece of the same woven work as the ephod, “made of fabric rather than of metal,” a span square (about nine inches each way) once it was doubled, and the doubling is understood to have made “a square pocket.”

      It is “of judgment” because of what it held: the name means “pouch of judgment, because of the decision given by” the Urim and Thummim (see the note on verse 30).

      On its face were twelve stones in four rows, each engraved with the name of a tribe. Not all of the stones can now be identified. Several of the Hebrew names are Egyptian words, including those for red jasper, feldspar and turquoise, and one names a “completely unknown precious stone.” The English names in verses 17–20 should be read with that in mind.

      Gold rings, braided chains and a blue lace hold it to the ephod at top and bottom, “that the breastplate be not loosed from the ephod.”

      It should not be confused with the breastplate that Moroni said was “deposited with the plates” of the Book of Mormon ([[JS—H 1:35]]; see the note on verse 30).
    sources: [bdb, ot-manual-ex-25-30, clothed-holy-garments, sc-knowhy-848, lds-scriptures]

  - ref: 30
    phrase: the Urim and the Thummim
    kind: history
    title: The Urim and Thummim in Aaron’s breastplate
    body: |
      The Urim and Thummim were an instrument of revelation that the high priest carried in the breastplate, and the chapter neither describes them nor tells Moses to make them. He is only told to put them in. The name is Hebrew for “Lights and Perfections,” and the thing itself was “an instrument prepared of God to assist man in obtaining revelation from the Lord and in translating languages.”

      The Bible shows the instrument in use but not how it worked. Joshua was to stand before Eleazar the priest, “who shall ask counsel for him after the judgment of Urim before the LORD” ([[Num. 27:21]]). Saul inquired, and “the LORD answered him not, neither by dreams, nor by Urim, nor by prophets” ([[1 Sam. 28:6]]). After Saul’s time it is not mentioned in use. The exiles who returned from Babylon set a hard question aside “till there stood up a priest with Urim and with Thummim” ([[Ezra 2:63]]).

      Most biblical scholars have supposed that it gave “a yes or no answer, similar to casting lots.” Others argue that only prophetic inspiration can account for “the complexity and subtlety of some of the answers received.” The question is open.

      Latter-day revelation says more about such instruments than about Aaron’s in particular. The use of a Urim and Thummim is “the special prerogative of a seer,” and Aaron was not the only one to have such an instrument. Abraham had one ([[Abr. 3:1]]), as did the brother of Jared and the Nephite prophets (see [[Mosiah 8:13]]). The one Joseph Smith received was the brother of Jared’s, not Aaron’s. Moroni described it to him as “two stones in silver bows” that were “fastened to a breastplate” ([[JS—H 1:35]]). The Nephite instrument and the biblical one differed in some respects and are “similar enough to be called by the same name.”
    sources: [bd-urim-and-thummim, bd-high-priest, lds-scriptures, bdb, sc-knowhy-417]

  - ref: 35
    phrase: his sound shall be heard
    kind: symbol
    title: The blue robe, its bells and its pomegranates
    body: |
      Under the ephod Aaron wore a robe all of blue, with gold bells and cloth pomegranates alternating around its hem, and the verse says the bells must be heard when he goes into the holy place and comes out, “that he die not.” The robe reached past the ephod to the knee. It went on over the head, and the opening was bound like the “opening in a coat of mail” (the King James “habergeon”) so that it would not tear.

      The verse does not say why silence would be fatal, and what has been offered are readings of the ornaments.

      On one Latter-day Saint reading the bells likely represent the sounding forth of God’s word, and the pomegranates were most likely chosen for “their association with the promised land,” where they grew (see [[Deut. 8:8]]).

      One older reading carries the first idea further. The pomegranates were “symbols of the word and testimony of God as a sweet and pleasant spiritual food,” and the bells “symbols of the sounding of this word.” So dressed, Aaron was “the recipient and medium of the word and testimony which came down from heaven,” and on this reading that is why he could not come before the LORD without the sound.
    sources: [clothed-holy-garments, keil-exodus, lds-scriptures]

  - ref: 36
    phrase: HOLINESS TO THE LORD
    kind: symbol
    title: The gold plate on Aaron’s forehead
    body: |
      The last piece of the high priest’s dress is a plate of pure gold, tied with a blue lace to the front of his turban and engraved as a seal is engraved. When it is made and when it is put on, it is called a crown: “the plate of the holy crown” ([[Ex. 39:30]]); “the golden plate, the holy crown” ([[Lev. 8:9]]).

      On one Latter-day Saint reading the inscription reaches past the man who wore it. Because “the high priest represented the people before God,” the call to him to be holy “was, by application, a call to all in Israel to be holy before the Lord.”

      What the plate was for is the subject of verse 38 and the next note.
    sources: [lds-scriptures, clothed-holy-garments]

  - ref: 38
    phrase: bear the iniquity of the holy things
    kind: words
    title: How holy things could carry iniquity
    body: |
      The plate is on Aaron’s forehead so that Israel’s offerings will be accepted in spite of what is wrong with them. That is the sense of the puzzling phrase “the iniquity of the holy things.” The holy things are what the children of Israel “hallow in all their holy gifts.” The iniquity, on one older reading, is “the sin which clung to the holy offerings of the people on account of the unholiness of their nature.” The verse ends with its purpose: “that they may be accepted before the LORD.”

      “Bear” here means more than carry. An alternate rendering is “atone for,” and the same older reading explains the Hebrew idiom as “to bear iniquity (sin) and take it away.” On that reading the high priest, wearing the plate, stood as “an atoning mediator of the whole nation,” so that “the gifts of the nation became well-pleasing to the Lord.”

      The chapter’s last verse uses the same English words the other way around. The priests are to be covered “that they bear not iniquity, and die,” where the sense is “do not incur guilt.” In verse 38 Aaron bears guilt that is the people’s; in verse 43 a careless priest would bring guilt on himself.

      The word atonement is explained at [[Ex. 25:17]].
    sources: [lds-scriptures, keil-exodus]

  - ref: 39
    phrase: the coat of fine linen
    kind: history
    title: 'What every priest wore: coat, girdle, cap and breeches'
    body: |
      The high priest wore linen under his ornaments, and his sons wore nothing else: a coat, a sash, a head covering, and breeches. These are the four garments of an ordinary priest.

      The coat was a linen garment reaching to the knees or below, and it was white, “a color associated with purity in the scriptures.” It was the first thing put on after the washing, and the verse may be rendered, “And thou shalt weave a shirt-like undergarment of fine white cloth.” The girdle was an embroidered sash around the waist. Aaron’s “mitre” is a turban, and his sons’ “bonnets” are “hats, or headdresses.”

      The breeches come last and apart from the rest, with their reason attached: “to cover their nakedness.” The law of the altar closed on the same word, forbidding steps “that thy nakedness be not discovered thereon” ([[Ex. 20:26]]).

      For the service of the Day of Atonement the high priest was to wear these linen garments: “He shall put on the holy linen coat, and he shall have the linen breeches upon his flesh, and shall be girded with a linen girdle, and with the linen mitre shall he be attired” ([[Lev. 16:4]]).

      The anointing, consecrating and sanctifying of verse 41 belong to the rite of the next chapter (see [[Ex. 29:4]]).
    sources: [scripture-helps-ex-35, clothed-holy-garments, lds-scriptures]

christ: |
  Scripture names the one to whom the office points: “we have a great high priest, that is passed into the heavens, Jesus the Son of God” ([[Heb. 4:14]]). Hebrews reasons from Aaron’s call to Christ’s. No man takes the honor to himself, and “So also Christ glorified not himself to be made an high priest” ([[Heb. 5:5]]). In that epistle Jesus Christ is “the great High Priest, of whom all the others were pre-figures.”

  Hebrews says that Christ does in heaven itself what Aaron did in the tabernacle, which was a copy of it. He has entered “into heaven itself, now to appear in the presence of God for us” ([[Heb. 9:24]]), and “he ever liveth to make intercession for them” ([[Heb. 7:25]]).

  The Church teaches that many aspects of the high priest’s clothing pointed to Jesus Christ. A Latter-day Saint study, which calls its own reading “a homily,” follows that through the garments. The names on the shoulder stones suggest the Messiah who bears the burdens of covenant Israel. On the breastplate “each name is now on a separate stone,” so that each believer “has a special place in that all-prevailing intercession.” The gold plate with its inscription has been taken in the Church’s teaching materials to signify “that Christ, the Great High Priest, would be perfectly holy before God,” and Hebrews describes Him so: “holy, harmless, undefiled, separate from sinners” ([[Heb. 7:26]]).

explore: |
  - **The garments made and put on.** [[Ex. 39:1–31]]; [[Lev. 8:6–9]].
  - **The rite that follows.** [[Ex. 29:4–9]], where the priests are washed, clothed and anointed.
  - **The great High Priest.** [[Heb. 4:14–16]]; [[Heb. 5:1–10]]; [[Heb. 7:23–28]]; [[Heb. 9:24]].
  - **The priesthood of Aaron in the latter days.** [[D&C 13:1]]; [[D&C 84:18–27]]; [[D&C 107:14]].
  - **Seers and the Urim and Thummim.** [[Ether 3:22–28]]; [[Mosiah 8:13–19]]; [[D&C 130:8–10]].
  - **A study of the garments.** “Clothed in Holy Garments: The Apparel of the Temple Officiants of Ancient Israel” (Religious Studies Center, 2013) reports how Christian interpreters have read each garment as a figure of Christ.

