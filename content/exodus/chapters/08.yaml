chapter: 8
title: Frogs, Lice, and Flies
tagline: Three more plagues fall on Egypt. Pharaoh asks Moses to pray and twice breaks his word, his magicians own “the finger of God,” and the Lord sets Goshen apart from the swarms.
when: 'Moses’s eightieth year (by 7:7); the second, third and fourth plagues'

setting: |
  Chapter 7 ended with the Nile turned to blood and a week gone by: “seven days were fulfilled, after that the LORD had smitten the river” ([[Ex. 7:25]]). Chapter 8 tells the next three plagues: frogs, lice, and swarms of flies. Pharaoh is still unnamed (see [[Ex. 1:11]]). His magicians were introduced at [[Ex. 7:11]]; the purpose of the plagues is discussed at [[Ex. 7:5]].

  Twice in this chapter Pharaoh is given relief, and twice he hardens his heart once it comes; the hardening is treated at [[Ex. 4:21]].

  Aaron’s rod brings the frogs and the lice. No rod is mentioned for the flies: “the LORD did so” (verse 24).

  Two psalms retell these plagues ([[Ps. 78:45]]; [[Ps. 105:30–31]]). The Hebrew Bible begins the chapter four verses later, so a lexicon or commentary that follows it numbers verse 26 here as 8:22.

thread: |
  Exodus 8 is built on a purpose stated twice, each time to Pharaoh: **“that thou mayest know.”** The frogs go on the day he names “that thou mayest know that there is none like unto the LORD our God” (verse 10). Goshen is spared “to the end thou mayest know that I am the LORD in the midst of the earth” (verse 22). The man being taught is the one who said, “I know not the LORD” ([[Ex. 5:2]]).

  Three things give way as the chapter goes on. The first is the magicians. They bring up frogs of their own (verse 7), fail at the dust (verse 18), and tell their king, “This is the finger of God” (verse 19). The second is Pharaoh’s word. He promises to let the people go (verse 8) and withdraws it when the frogs are dead (verse 15); he promises again (verse 28) and withdraws it again (verse 32), though Moses has named the fault to his face (verse 29). The third is the plagues’ falling on Egypt and Israel alike: from verse 22 on there is “a division between my people and thy people.”

  Twice Moses prays for Pharaoh. He “cried unto the LORD” (verse 12) and “entreated the LORD” (verse 30), and both times “the LORD did according to the word of Moses.”

  These are small plagues beside what is coming. On one reading they belong to the challenge to Egypt’s king that the note on [[Ex. 7:5]] describes: in the frogs and the insects “it is the whole of the known world, down to the most minute elements, that seems to be rising up against the king and Egypt.”

sections:
  - range: 1-7
    heading: Frogs from the river
    plain: |
      The LORD told Moses to go to Pharaoh and say, “This is what the LORD says: Let My people go, so that they may serve Me. If you refuse, I will strike your whole territory with frogs. The river will swarm with frogs. They will come up into your house, into your bedroom and onto your bed, into your servants’ houses and onto your people, into your ovens and your kneading troughs. The frogs will climb on you, on your people, and on all your servants.” Then the LORD told Moses to have Aaron stretch out his hand with his rod over the streams, the rivers, and the ponds, and bring frogs up over the land of Egypt. Aaron stretched his hand over the waters of Egypt, and the frogs came up and covered the land. The magicians did the same with their enchantments and brought up frogs on the land of Egypt.
  - range: 8-15
    heading: Pharaoh names the day
    plain: |
      Pharaoh sent for Moses and Aaron and said, “Pray to the LORD to take the frogs away from me and my people, and I will let the people go to sacrifice to the LORD.” Moses said, “I leave the honor to you: say when I am to pray for you, your servants, and your people, so that the frogs are cut off from you and your houses and are left only in the river.” Pharaoh said, “Tomorrow.” Moses said, “It will be as you say, so that you may know that there is no one like the LORD our God. The frogs will leave you, your houses, your servants, and your people, and will remain only in the river.” Moses and Aaron went out, and Moses cried to the LORD about the frogs He had brought on Pharaoh. The LORD did as Moses asked. The frogs died in the houses, the villages, and the fields. They were gathered into heaps, and the land stank. But when Pharaoh saw that there was relief, he hardened his heart and would not listen to them, as the LORD had said.
  - range: 16-19
    heading: The dust becomes lice
    plain: |
      The LORD told Moses to have Aaron stretch out his rod and strike the dust of the ground, so that it would become lice (or gnats) through all the land of Egypt. Aaron did so, and there were lice on people and animals; all the dust of the land became lice throughout Egypt. The magicians tried with their enchantments to produce lice and could not. The lice were on people and animals. The magicians said to Pharaoh, “This is the finger of God.” But Pharaoh’s heart was hardened, and he would not listen to them, as the LORD had said.
  - range: 20-24
    heading: Swarms, and Goshen spared
    plain: |
      The LORD told Moses to rise early, meet Pharaoh as he came out to the water, and say, “This is what the LORD says: Let My people go, so that they may serve Me. If you will not, I will send swarms on you, your servants, your people, and your houses. The houses of the Egyptians will be full of them, and so will the ground they stand on. But on that day I will set apart the land of Goshen, where My people live, and no swarms will be there, so that you may know that I am the LORD in the midst of the earth. I will put a division between My people and your people. Tomorrow this sign will be.” The LORD did so. Heavy swarms of flies came into Pharaoh’s house, into his servants’ houses, and into all Egypt, and the land was ruined by them.
  - range: 25-32
    heading: Pharaoh bargains
    plain: |
      Pharaoh sent for Moses and Aaron and said, “Go, sacrifice to your God here in the land.” Moses said, “That would not be right. What we sacrifice to the LORD our God is abhorrent to the Egyptians. If we offer before their eyes what they abhor, will they not stone us? We will go three days’ journey into the wilderness and sacrifice to the LORD our God as He commands us.” Pharaoh said, “I will let you go to sacrifice to the LORD your God in the wilderness, only do not go very far. Pray for me.” Moses said, “I am going out from you, and I will pray to the LORD that the swarms may leave Pharaoh, his servants, and his people tomorrow. But Pharaoh must not deal deceitfully again by refusing to let the people go to sacrifice to the LORD.” Moses went out and prayed to the LORD, and the LORD did as Moses asked. He removed the swarms from Pharaoh, his servants, and his people; not one remained. But Pharaoh hardened his heart this time also and would not let the people go.

notes:
  - ref: 2
    phrase: I will smite all thy borders with frogs
    kind: history
    title: Why frogs
    body: |
      Exodus does not say why the second plague is frogs; one proposal names an Egyptian goddess, and the likelier answer is the king’s duty to keep order in his land. The warning dwells on places: Pharaoh’s house, his bedchamber and his bed first, then the ovens and the kneading troughs (verses 3–4). A psalm remembers the frogs “in the chambers of their kings” ([[Ps. 105:30]]).

      The goddess is Heket, “a frog-headed goddess whose job, among other things, was to control the multiplication of frogs,” and she was the consort of the creator god Khnum, so that overrunning her domain “can be seen as an indirect challenge of the king.” The proposal comes with a caution, for this plague and the two after it: “There simply are not substantial references to anything having to do with these plagues in Egyptian literature.”

      Keeping order in Egypt was one of Pharaoh’s “two main duties,” and “too many frogs” stands with the other plagues among the “elements of disorder that touch on every aspect of Egyptian life.”

      A natural account has been offered, in which frogs “would leave the marshy banks and invade the dry land” in a year of extreme flooding. What the chapter stresses is that these came when Aaron stretched out his hand and died on the day Pharaoh himself chose.
    sources: [muhlestein-pharaoh, sc-knowhy-631]
  - ref: 9
    phrase: Glory over me
    kind: words
    title: 'Glory over me: a courtesy to the king'
    body: |
      Moses’s odd phrase is a courtesy to the king: he hands Pharaoh the honor of naming the time. The Hebrew verb means to “glorify oneself,” and with “over” a person it means to boast, as when the Lord thins Gideon’s army “lest Israel vaunt themselves against me” ([[Judg. 7:2]]). Here it is used “as polite address to king”: “assume the honour over me (to decide) when.”

      The courtesy has a purpose, and Moses states it in the next verse: “that thou mayest know that there is none like unto the LORD our God.” A plague that ends at a time of the king’s own choosing is hard to put down to coincidence, and that is perhaps why Moses offers the choice. Pharaoh says “To morrow.” The text does not say why he did not ask for that same day. Moses prays, and “the LORD did according to the word of Moses” (verse 13).
    sources: [oshb-wlc, bdb, scripture-helps-ex-7]
  - ref: 16
    phrase: that it may become lice
    kind: words
    title: Lice or gnats, and the swarms of the fourth plague
    body: |
      The creatures the King James Version calls lice and flies cannot be identified with certainty. The Hebrew words “have been taken to mean gnats, flies, lice, mosquitos, dog flies, maggots, and beetles.”

      For the third plague the meaning is “dubious”: “either gnat, gnats, gnat-swarm” or “lice,” with ancient writers on both sides and most modern scholars for gnats. A modern translation accordingly reads “so that it may become gnats throughout the whole land of Egypt.”

      For the fourth plague the Hebrew has one word, *‘arov*, with no separate word for “flies.” The word is “probably swarm,” used here “of plague of stinging flies, coming in a swarm.” The ancient Greek translation named the insect, “the dog-fly,” and “a biting fly” of that kind is still supposed. A psalm says of these swarms, “which devoured them” ([[Ps. 78:45]]).

      The third plague is also the first to come with no word to Pharaoh beforehand: the Lord speaks to Moses, Aaron strikes the dust, and it is done.
    sources: [muhlestein-pharaoh, bdb, nrsvue, oshb-wlc, lxx-rahlfs, sc-knowhy-631]
  - ref: 19
    phrase: This is the finger of God
    kind: scripture
    title: The finger of God
    body: |
      The magicians’ words are the first admission from Pharaoh’s own court that a power beyond theirs is at work. They had matched the rods, the blood and the frogs ([[Ex. 7:11]]; [[Ex. 7:22]]; verse 7). At the dust they try and cannot, and they tell the king so. When they next appear they are unable even to stand before Moses ([[Ex. 9:11]]).

      How much do they concede? They say “God” (*Elohim*), the general word, and not the name in which Moses has spoken from the first audience, the LORD. One older reading presses the difference: “If they had meant to refer to the God of Israel, they would have used the name Jehovah.” On that reading they grant only “the work of some deity, possibly one of the gods of the Egyptians,” and the next plague answers them, since “a distinction was made in the plagues which followed between the Israelites and the Egyptians” (see the note on verse 22). This rests on one word, and the text does not say what the magicians thought.

      Scripture uses the phrase elsewhere of God’s own direct work. The tables of the law were “written with the finger of God” ([[Ex. 31:18]]). And Jesus said of His casting out of devils, “if I with the finger of God cast out devils, no doubt the kingdom of God is come upon you” ([[Luke 11:20]]), the first verse to which the Church’s footnote here sends the reader.
    sources: [oshb-wlc, keil-exodus, lds-scriptures]
  - ref: 22
    phrase: I will sever in that day the land of Goshen
    kind: history
    title: Goshen set apart
    body: |
      With the fourth plague the Lord draws a line on the map: the swarms fill Egypt and stop at Goshen. Nothing was said of Goshen under the blood, the frogs or the lice. From here the line holds for the cattle ([[Ex. 9:4]]), the hail ([[Ex. 9:26]]), the darkness ([[Ex. 10:23]]) and the firstborn, where its purpose is stated again: “that ye may know how that the LORD doth put a difference between the Egyptians and Israel” ([[Ex. 11:7]]). It is a turn in the whole account: “beginning with the plague of the flies, the plagues that ravaged Egypt made a clear distinction between the Israelite slaves and the Egyptians.”

      Goshen was the part of Egypt where Israel lived, “probably in the eastern part of the delta of the Nile.” Jacob’s family was settled there in Joseph’s day ([[Gen. 45:10]]; [[Gen. 47:6]]).

      Two words carry the idea. “Sever” is a verb for making separate “by treating differently.” “Division” in verse 23 is stranger. The Hebrew noun means “ransom,” and it is the word translated “redemption” in “He sent redemption unto his people” ([[Ps. 111:9]]), so that the clause would say, “I will set a ransom (distinguishing) between my people and thy people.” That rendering is judged “improbable,” and the Hebrew text here is doubtful. The ancient Greek translation has “a difference,” and a modern one “a distinction.” Whatever the wording, the sparing of Goshen is itself called a “sign,” and it is announced a day ahead.

      What the sign shows is in the verse: “to the end thou mayest know that I am the LORD in the midst of the earth.” A modern translation reads “in this land,” that is, in Egypt. The ancient Greek widens it instead: “the God of all the earth.”

      A natural account has been offered, that Goshen “was geographically shielded from the swarms of flies in the main Nile Valley.” The narrative’s interest is elsewhere. That the plagues were selective “adds to their miraculous nature,” and here the selection was foretold.
    sources: [brown-exodus-type, bd-goshen, oshb-wlc, bdb, lxx-rahlfs, nrsvue, sc-knowhy-631, ot-manual-ex-1-10]
  - ref: 26
    phrase: the abomination of the Egyptians
    kind: history
    title: What the Egyptians would not bear to see
    body: |
      Moses refuses Pharaoh’s first offer because Israel’s sacrifices, made in sight of Egyptians, would outrage them and endanger Israel. “The abomination of the Egyptians” means what Egyptians abhor. The word is the one used when the Egyptians would not eat with Hebrews and of their aversion to shepherds ([[Gen. 43:32]]; [[Gen. 46:34]]); the note at [[Gen. 43:32]] treats that aversion.

      Exodus does not say what in the sacrifice would offend. One answer is the animals: “cows were sacred to the Egyptians,” and on one older reading the phrase means “animals which the Egyptians deemed it unlawful to sacrifice,” among them the cow, “which was sacred to Isis.” Another older reading disagrees, in part because “the cow was the only animal offered in sacrifice by the Israelites, which the Egyptians regarded as sacred,” and it finds the offense in the manner of the offering: Israel “would not observe the sacrificial rites of the Egyptians at all.” Neither can be shown from the verse.

      Moses adds that they must sacrifice “as he shall command us” (verse 27). Pharaoh’s reply, “only ye shall not go very far away,” is a second partial offer, and others follow ([[Ex. 10:8–11]]; [[Ex. 10:24]]).
    sources: [bdb, ot-minute-ex-7, cambridge-exodus, keil-exodus]

christ: |
  The LORD who sends these plagues and takes them away is Jehovah ([[Ex. 3:14]]). Moses tells Pharaoh that the frogs will go at the appointed time “that thou mayest know that there is none like unto the LORD our God” (verse 10). The Church’s footnote on “none” there sends the reader to the opening of a latter-day revelation: “the Lord is God, and beside him there is no Savior” ([[D&C 76:1]]).

  The magicians’ phrase, “the finger of God,” is the one Jesus used of His own casting out of devils ([[Luke 11:20]]; see the note on verse 19).

explore: |
  - **“That thou mayest know.”** Follow the purpose through [[Ex. 7:5]], verses 10 and 22 here, [[Ex. 9:14]], [[Ex. 9:29]], and [[Ex. 14:4]] and [[Ex. 14:18]].
  - **The line between Egypt and Israel.** [[Ex. 9:4–7]], [[Ex. 9:26]], [[Ex. 10:23]], and [[Ex. 11:7]].
  - **Pharaoh’s offers.** Compare verses 25 and 28 with [[Ex. 10:8–11]] and [[Ex. 10:24–26]].
  - **The plagues remembered in song.** [[Ps. 78:44–51]] and [[Ps. 105:30–31]].

parallels:
  - ref: Ps. 105:30–31
    note: The psalm remembers the frogs “in the chambers of their kings,” and the flies and lice together.
  - ref: Ps. 78:45
    note: The swarms “devoured them,” and the frogs “destroyed them.”
  - ref: Luke 11:20
    note: Jesus casts out devils “with the finger of God,” the magicians’ phrase.

