chapter: 16
title: Bread from Heaven
tagline: A month out of Egypt, Israel is hungry and wishes itself back. The LORD answers with quails at evening and, every morning but the seventh, a bread no one has seen before, given a day’s portion at a time.
when: 'The fifteenth day of the second month after leaving Egypt (verse 1), about a month after the Passover night.'

setting: |
  Israel has been on the road for about a month. The sea is behind them ([[Ex. 14:21–31]]), the bitter water of Marah has been made sweet, and they have camped by the wells and palm trees of Elim ([[Ex. 15:23–27]]). Now they come into the wilderness of Sin, the country “lying between Horeb and the Gulf of Suez.” The name is a place name and “has nothing to do with the moral concept of sin.” Here the trouble is not water but food.

  What begins in this chapter lasts as long as the wilderness does. The manna that first falls in the wilderness of Sin feeds Israel for forty years, until they reach the border of Canaan (verse 35). In this chapter Israel also keeps a Sabbath, before the commandment is spoken at Sinai ([[Ex. 20:8]]).

  Later scripture keeps returning to this bread. Moses explains it to the next generation ([[Deut. 8:2–3]]). The psalms sing of it ([[Ps. 78:24–25]]; [[Ps. 105:40]]). Nephi reminds his brothers of it, “ye also know that they were fed with manna in the wilderness” ([[1 Ne. 17:28]]), and Limhi rallies his people with it ([[Mosiah 7:19]]). Paul calls it “spiritual meat” ([[1 Cor. 10:3]]). And Jesus Christ takes it as the text of His sermon on the bread of life ([[John 6:31–35]]).

thread: |
  The chapter is about bread that comes with instructions. Israel complains of hunger (on the murmuring, see [[Ex. 15:24]]), and the LORD answers the complaint with food. But He says from the first that the food is also a test: “that I may prove them, whether they will walk in my law, or no” (verse 4). The bread came “not only to comfort them but also to test them.”

  The rest of the chapter is that test, laid out as four simple rules. Gather a day’s portion each morning. Keep none of it overnight. On the sixth day gather double. On the seventh day do not go out at all. Twice some of the people do otherwise (verses 20, 27), and each time the rule holds: manna hoarded on a weekday rots by morning, manna kept for the Sabbath does not, and on the seventh day there is nothing in the field.

  The LORD also says what the people are meant to learn from being fed this way: “ye shall know that I am the LORD your God” (verse 12). Moses and Aaron say that the complaint was never really about them: “your murmurings are not against us, but against the LORD” (verse 8). Before any bread falls, the people look toward the wilderness and see His glory in the cloud (verse 10; on the cloud see [[Ex. 13:21]], and on the glory [[Ex. 24:16]]).

  The last verses look a long way ahead: a jar of manna to be kept for generations who will never gather it, and the forty years it would fall.

sections:
  - range: 1-3
    heading: Hunger in the wilderness of Sin
    plain: |
      The whole congregation of Israel set out from Elim and came to the wilderness of Sin, which lies between Elim and Sinai, on the fifteenth day of the second month after they left Egypt. There the whole congregation murmured against Moses and Aaron. They said, “If only we had died by the hand of the LORD in Egypt, when we sat by the pots of meat and ate all the bread we wanted! You have brought us out into this wilderness to kill this whole assembly with hunger.”
  - range: 4-12
    heading: The promise of bread and meat
    plain: |
      The LORD said to Moses, “I will rain bread from heaven for you. The people are to go out and gather a day’s portion every day, so that I may test them, whether they will walk in my law or not. On the sixth day, when they prepare what they bring in, it will be twice as much as they gather on other days.”

      Moses and Aaron told all Israel, “At evening you will know that it was the LORD who brought you out of Egypt, and in the morning you will see the glory of the LORD, for He hears your murmurings against Him. What are we, that you murmur against us?” Moses said, “The LORD will give you meat to eat in the evening and bread to the full in the morning, because He hears the murmurings you murmur against Him. What are we? Your murmurings are not against us but against the LORD.”

      Moses told Aaron to say to the whole congregation, “Come near before the LORD, for He has heard your murmurings.” As Aaron spoke, they looked toward the wilderness, and the glory of the LORD appeared in the cloud. The LORD said to Moses, “I have heard the murmurings of the children of Israel. Tell them: At evening you will eat meat, and in the morning you will be filled with bread, and you will know that I am the LORD your God.”
  - range: 13-21
    heading: Quails at evening, manna in the morning
    plain: |
      That evening quails came up and covered the camp, and in the morning dew lay all around it. When the dew had gone, there on the face of the wilderness lay something fine and flake-like, as fine as frost on the ground. When the children of Israel saw it they said to one another, “What is it?” for they did not know what it was. Moses said, “This is the bread the LORD has given you to eat. This is what the LORD has commanded: each of you is to gather as much as he can eat, an omer a head for the number of people in his tent.”

      The children of Israel did so, some gathering more and some less. When they measured it by the omer, the one who had gathered much had nothing left over and the one who had gathered little had no lack; each had gathered what he could eat. Moses said, “Let no one leave any of it until morning.” But some did not listen to Moses and left part of it until morning, and it bred worms and stank, and Moses was angry with them. They gathered it every morning, each as much as he could eat, and when the sun grew hot it melted.
  - range: 22-30
    heading: The sixth day and the seventh
    plain: |
      On the sixth day they gathered twice as much bread, two omers for each person, and all the leaders of the congregation came and told Moses. He said, “This is what the LORD has said: Tomorrow is a day of rest, a holy sabbath to the LORD. Bake what you want to bake and boil what you want to boil, and set aside all that is left over to be kept until morning.” They set it aside until morning, as Moses told them, and it did not stink and there were no worms in it. Moses said, “Eat that today, for today is a sabbath to the LORD; today you will not find it in the field. Six days you are to gather it, but on the seventh day, the sabbath, there will be none.”

      Even so, some of the people went out on the seventh day to gather, and they found none. The LORD said to Moses, “How long will you refuse to keep my commandments and my laws? See, the LORD has given you the sabbath; that is why on the sixth day He gives you bread for two days. Let every man stay where he is; let no one leave his place on the seventh day.” So the people rested on the seventh day.
  - range: 31-36
    heading: A jar kept for the generations
    plain: |
      The house of Israel called it manna. It was white, like coriander seed, and it tasted like wafers made with honey. Moses said, “This is what the LORD commands: Fill an omer with it to be kept for your generations, so that they may see the bread I fed you with in the wilderness when I brought you out of Egypt.” Moses told Aaron, “Take a pot, put an omer of manna in it, and set it before the LORD to be kept for your generations.” As the LORD commanded Moses, Aaron set it before the Testimony to be kept.

      The children of Israel ate manna forty years, until they came to an inhabited land; they ate manna until they came to the borders of Canaan. An omer is the tenth part of an ephah.

notes:
  - ref: 4
    phrase: I will rain bread from heaven for you
    kind: christ
    title: The bread from heaven and the bread of life
    body: |
      Jesus Christ said that the bread of this chapter pointed to Him. John sets the scene at a time when “the passover, a feast of the Jews, was nigh” ([[John 6:4]]). Jesus had just fed five thousand people in a desert place, a miracle that can be read as looking back “to Jehovah’s provision of manna and flesh to the Israelites in the wilderness.” The next day the crowd asked Him for a sign and held up this chapter as the standard: “Our fathers did eat manna in the desert; as it is written, He gave them bread from heaven to eat” ([[John 6:31]]).

      His answer corrects them twice. First about the giver: “Moses gave you not that bread from heaven; but my Father giveth you the true bread from heaven” ([[John 6:32]]). Then about the bread: “I am the bread of life: he that cometh to me shall never hunger; and he that believeth on me shall never thirst” ([[John 6:35]]).

      He also says where the manna fell short. “Your fathers did eat manna in the wilderness, and are dead” ([[John 6:49]]). It kept a people alive from one day to the next and no longer. Of Himself He says, “if any man eat of this bread, he shall live for ever: and the bread that I will give is my flesh, which I will give for the life of the world” ([[John 6:51]]). He is the one “of whom manna was a type and symbol, the very Bread of Life, the Redeemer.”

      The psalm’s names for the manna, “angels’ food” and “the corn of heaven,” are explained at [[Ps. 78:25]].
    sources: [lds-scriptures, sc-knowhy-664, christofferson-daily-bread, parry-manna]

  - ref: 4
    phrase: that I may prove them
    kind: scripture
    title: The bread is also a test
    body: |
      The manna is given as food and as a test, and Moses later says what was being tested. Forty years on, he tells the generation about to enter Canaan that the LORD led them through the wilderness “to humble thee, and to prove thee, to know what was in thine heart, whether thou wouldest keep his commandments, or no” ([[Deut. 8:2]]). Of the manna in particular he says that the LORD “suffered thee to hunger, and fed thee with manna, which thou knewest not,” for a reason: “that he might make thee know that man doth not live by bread only, but by every word that proceedeth out of the mouth of the LORD doth man live” ([[Deut. 8:3]]).

      The test was built into the way the bread was to be gathered. The people “had to go out daily to gather it but could gather only a certain amount each day.” Moses adds that the proving was meant for their good: “to do thee good at thy latter end” ([[Deut. 8:16]]).

      Jesus answered the tempter in the wilderness with Moses’s sentence about the manna: “Man shall not live by bread alone, but by every word that proceedeth out of the mouth of God” ([[Matt. 4:4]]). The two wildernesses can be set side by side: Israel ate manna forty years, “a period of testing,” and Jesus “was tempted of Satan after fasting forty days and forty nights.”
    sources: [lds-scriptures, ot-minute-ex-14, parry-manna]

  - ref: 15
    phrase: It is manna
    kind: words
    title: “It is manna” can be read “What is it?”
    body: |
      The people’s words in this verse are most likely a question, “What is it?”, and the verse ties the name manna to that question. The Hebrew is two short words, *man hu*. The King James translators took them as a statement. The Church’s footnote gives the other reading, “What is it?”; the ancient Greek translation has “What is this?”; and a modern translation puts “What is it?” in the text and “It is manna” in the margin.

      The verse offers the question as “a popular etymology” of the name, that is, the people’s own account of where the word came from. The rest of the sentence fits a question better than a statement: they said it “for they wist not what it was.” Moses answers what they asked: “This is the bread which the LORD hath given you to eat.” The naming itself is told later, in verse 31.
    sources: [lds-scriptures, oshb-wlc, bdb, lxx-rahlfs, nrsvue]

  - ref: 18
    phrase: he that gathered much had nothing over, and he that gathered little had no lack
    kind: scripture
    title: Enough for each, and what Paul made of it
    body: |
      Every household ended the morning with what it needed, an omer a head (about two quarts), and Paul later quoted this verse to the Saints at Corinth. How each household came to have just what it needed, the verse does not say. One older reading sets out two possibilities: that each family, measuring in its own tent, found it “had collected just as many omers as they needed,” or that “all that was gathered was placed in a heap, and then measured out in the quantity that each required.” The same reading judges that the wording favors the first.

      Paul takes up the verse when he asks the Corinthian Saints to give from what they have to those in want. He wants their abundance to “be a supply for their want, that their abundance also may be a supply for your want: that there may be equality” ([[2 Cor. 8:14]]). Then he quotes this verse: “As it is written, He that had gathered much had nothing over; and he that had gathered little had no lack” ([[2 Cor. 8:15]]).
    sources: [lds-scriptures, scripture-helps-ex-14, keil-exodus]

  - ref: 21
    phrase: they gathered it every morning
    kind: prophets
    title: Daily bread
    body: |
      Manna gathered on a weekday could not be kept overnight, so Israel had to receive it again every morning, and an apostle has tied that to a line of the Lord’s Prayer. Kept until the next morning it bred worms (verse 20); left on the ground it melted in the sun.

      Elder D. Todd Christofferson describes the manna as Jehovah “miraculously providing their daily bread from heaven.” Of the petition “Give us this day our daily bread” ([[Matt. 6:11]]) he says, “Jesus is teaching us, His disciples, that we should look to God each day for the bread—the help and sustenance—we require in that particular day.”
    sources: [christofferson-daily-bread, lds-scriptures]

  - ref: 23
    phrase: the rest of the holy sabbath unto the LORD
    kind: history
    title: The Sabbath before Sinai
    body: |
      Israel keeps the Sabbath here before the Ten Commandments are given; the day is older than Sinai. Genesis tells that God rested on the seventh day “and sanctified it” ([[Gen. 2:2–3]]), but of the patriarchs’ keeping it “we have no evidence.”

      Moses introduces the day with the words “This is that which the LORD hath said.” When some go out to gather on the seventh day, the LORD asks, “How long refuse ye to keep my commandments and my laws?” (verse 28). The account of the manna is one of the evidences that the Sabbath “was a holy day before the giving of the law, even from the earliest times.” The silence about earlier generations is “no doubt due to the scantiness of the record, for the Sabbath is an eternal principle.”

      What this chapter adds is the way Israel learned the day in practice: the manna itself taught it. Verse 29 calls the day a gift: “the LORD hath given you the sabbath.” The lesson was “a precursor to the later revelation of the fourth commandment”; the commandment itself is taken up at [[Ex. 20:8]], and the Sabbath as a sign at [[Ex. 31:13]].
    sources: [bd-sabbath, ot-minute-ex-14, lds-scriptures]

  - ref: 31
    phrase: it was like coriander seed, white
    kind: history
    title: What manna was
    body: |
      Scripture describes manna only by comparison, and nothing known in nature matches the description. Here it is white, like coriander seed, with a taste “like wafers made with honey”; in verse 14 it lies on the ground like frost, and the Church’s footnote renders the “small round thing” as “fine, flake-like.” Numbers adds that it fell with the dew at night ([[Num. 11:9]]).

      The Bedouin of the Sinai Peninsula know a natural substance that goes by the same name. It is “a juice exuding in heavy drops from twigs” of a tamarisk tree in the west of the peninsula in early summer, “sweet, sticky, honey-like.” But that sap drips from one kind of tree in one season of the year. This bread lay on the open ground around the camp, came six days and not the seventh, spoiled overnight except on the Sabbath, and went on for forty years. In short, “It is impossible to find any natural product that will answer to the requirements of the scriptural narrative in regard to this heavensent food.”
    sources: [bd-manna, bdb, lds-scriptures]

  - ref: 34
    phrase: before the Testimony
    kind: history
    title: A pot of manna before the Testimony
    body: |
      The “Testimony” is the tables of the law that would later be kept in the ark, so these closing verses run ahead of the story. The later command reads, “thou shalt put into the ark the testimony which I shall give thee” ([[Ex. 25:16]]). One older reading is that Aaron’s act is told here “by way of anticipation, for the purpose of summing up everything of importance relating to the manna.” The next verse does the same when it speaks of the whole forty years.

      The purpose of the jar is given in verse 32: later generations were to “see the bread wherewith I have fed you in the wilderness.”

      Hebrews lists the jar among the holy things of the tabernacle: the ark, “wherein was the golden pot that had manna, and Aaron’s rod that budded, and the tables of the covenant” ([[Heb. 9:4]]). The Hebrew of verse 33 says only a pot; “golden” comes from the ancient Greek translation, which reads “Take a golden pot.” Of the ark in Solomon’s temple it is written, “There was nothing in the ark save the two tables of stone” ([[1 Kgs. 8:9]]). The ark itself is described at [[Ex. 25:10]].
    sources: [ot-minute-ex-14, keil-exodus, lxx-rahlfs, bd-ark-of-the-covenant, lds-scriptures]

  - ref: 35
    phrase: until they came to a land inhabited
    kind: scripture
    title: When the manna stopped
    body: |
      The manna lasted as long as the wilderness did and stopped as soon as Israel could eat from the land. Joshua records the day. After Israel kept the Passover in Canaan and ate the grain of the land, “the manna ceased on the morrow after they had eaten of the old corn of the land; neither had the children of Israel manna any more” ([[Josh. 5:12]]).

      Elder D. Todd Christofferson draws the conclusion from that ending: “40 years of manna was not meant to become a dole. Once the tribes of Israel were in a position to provide for themselves, they were required to do so.”
    sources: [lds-scriptures, christofferson-daily-bread]

christ: |
  The LORD who feeds Israel here is Jehovah (see [[Ex. 3:14]]), and when He came in the flesh He said that the manna was a figure of Him ([[John 6:32–35]]; see the note on verse 4). Paul reads it the same way when he calls the manna “spiritual meat” and goes on to the rock that gave Israel water ([[1 Cor. 10:3–4]]; see [[Ex. 17:6]]).

  Jesus carried the figure further than His hearers could follow. The bread He would give was His flesh ([[John 6:51]]), and His meaning “was totally lost on His hearers who understood His statement only literally.” He said Himself what He meant by eating: “He that eateth my flesh, and drinketh my blood, dwelleth in me, and I in him” ([[John 6:56]]).

  The manna came to a people who were murmuring, and one reading sees a likeness in that: it “was undeserved,” and Christ “died for undeserving sinners.” Paul’s words are, “while we were yet sinners, Christ died for us” ([[Rom. 5:8]]).

  The risen Lord makes a promise of it to those who overcome: “To him that overcometh will I give to eat of the hidden manna” ([[Rev. 2:17]]).

explore: |
  - **Moses’s own explanation.** [[Deut. 8:1–18]], where Moses looks back on forty years of testing and says what the manna was for.
  - **The sermon on the bread of life.** [[John 6:22–59]], spoken at Passover time the day after the feeding of the five thousand.
  - **The quails a second time.** [[Num. 11:4–34]], where the people tire of the manna and ask for meat; [[Ps. 78:18–31]] retells both accounts.
  - **The next want.** [[Ex. 17:1–7]], water from the rock at Horeb.
  - **Nephi’s wilderness.** [[1 Ne. 16:16]] and [[1 Ne. 16:30–31]]. One study compares the Liahona with the manna: “Both were discovered in the morning, both were discovered upon the ground, both were round in appearance,” and each came when a hungry company was murmuring.
  - **The Sabbath afterward.** [[Ex. 20:8–11]]; [[Ex. 31:12–17]]; [[D&C 59:9–13]].

