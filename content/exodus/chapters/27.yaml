chapter: 27
title: The Altar, the Court, and the Oil for the Lamp
tagline: The LORD describes the altar of burnt offering and the linen-fenced court in which it stands, and then commands Israel to bring pure olive oil so that Aaron and his sons can keep a lamp burning before Him.
when: 'While Moses is on Mount Sinai forty days and forty nights (24:18), receiving the pattern of the tabernacle.'

setting: |
  Moses is on the mountain, inside the cloud, where he stays forty days and forty nights ([[Ex. 24:18]]). The LORD has been speaking since the beginning of chapter 25, and these instructions hang on one sentence: “let them make me a sanctuary; that I may dwell among them” ([[Ex. 25:8]]; see the note there for what the tabernacle was). The first furnishing described was the ark ([[Ex. 25:10]]), and chapter 26 described the tent of boards and curtains and the veil that divides it.

  This chapter finishes the structure. It describes the altar that stands in front of the tent, then the court that encloses both, and it ends with a command of a different kind: oil for the lamp, and who is to tend it. Two things are held back until later: the altar of incense in the holy place ([[Ex. 30:1]]) and the laver in the court ([[Ex. 30:18]]).

  The description is an instruction, with the building still to come. The altar and the court are made in [[Ex. 38:1–20]], in nearly the same words, and the command about the oil is given again in [[Lev. 24:2–4]]. With the next chapter the LORD turns from the place to the men who will serve in it ([[Ex. 28:1]]).

thread: |
  The instructions have been moving outward. The LORD began with “the most sacred aspect of the tabernacle, the ark of the covenant in the Holy of Holies,” and “then worked out to the least sacred, the altar of sacrifice in the outer courtyard.” After the altar comes the fence that bounds the court.

  That reverses the order in which a worshipper would enter. He came in from the camp through the gate on the east, and the first thing he met inside it was the altar; Israel, in the person of the high priest, “would enter from the courtyard, then move into the Holy Place, and finally into the Holy of Holies.”

  The materials mark the distance. The ark, the table and the candlestick were gold. Here the word that keeps returning is brass: the altar's covering, its utensils, its grate and rings, the sockets of the court, every peg. Silver appears only on the hooks and fillets of the pillars.

  Then the last two verses change subject. Everything so far has been a thing to make; now there is something to do, and people to do it. The children of Israel are to bring oil, and Aaron and his sons are to keep the lamp from evening to morning (for their calling as priests, see [[Ex. 28:1]]). One older reading takes these verses as “a transition from the fitting up of the sanctuary to the installation of its servants.”

sections:
  - range: 1-8
    heading: The altar of burnt offering
    plain: |
      “Make an altar of shittim wood, five cubits long and five cubits wide, square, and three cubits high. Make horns on its four corners, of one piece with it, and overlay it with brass. Make its pans to receive its ashes, and its shovels, basins, fleshhooks and firepans; all its utensils are to be of brass.

      “Make a grate for it, a network of brass, with four brass rings at its four corners. Set it under the ledge of the altar, below, so that the net reaches halfway up the altar. Make staves of shittim wood overlaid with brass, and put them through the rings on the two sides of the altar to carry it. Make it hollow, of boards. As it was shown you on the mount, so shall they make it.”
  - range: 9-19
    heading: The court
    plain: |
      “Make the court of the tabernacle. On the south side there are to be hangings of fine twined linen a hundred cubits long, on twenty pillars set in twenty sockets of brass, with the hooks of the pillars and their fillets of silver. The north side is to be the same: a hundred cubits of hangings, twenty pillars, twenty sockets of brass, hooks and fillets of silver. Across the west end the hangings are fifty cubits, with ten pillars and ten sockets.

      “The east end is also fifty cubits wide. On each side of the gate there are fifteen cubits of hangings on three pillars and three sockets, and for the gate itself a screen of twenty cubits, of blue, purple, scarlet and fine twined linen, embroidered, on four pillars and four sockets. All the pillars around the court have fillets of silver; their hooks are silver and their sockets brass.

      “The court is a hundred cubits long and fifty wide, and its hangings of fine twined linen are five cubits high, on sockets of brass. All the utensils used in the service of the tabernacle, all its pegs, and all the pegs of the court are to be of brass.”
  - range: 20-21
    heading: Oil for the lamp
    plain: |
      “Command the children of Israel to bring you pure oil of beaten olives for the light, so that a lamp may burn always. In the tabernacle of the congregation, outside the veil that hangs before the testimony, Aaron and his sons are to keep it in order from evening to morning before the LORD. It is a statute for ever through their generations, on behalf of the children of Israel.”

notes:
  - ref: 1
    phrase: an altar of shittim wood
    kind: history
    title: The altar of burnt offering
    body: |
      This is the altar on which Israel’s sacrifices were burned, and it stood in the open court, not inside the tent. The chapter calls it only “an altar.” The account of its making names it “the altar of burnt offering” ([[Ex. 38:1]]), and from its covering it was also called the “brasen altar” ([[Ex. 39:39]]). Its place was “outside the tent and in front of its door,” and it was “by far the largest piece of furniture.” For the wood and the metal see [[Ex. 25:5]], and for the cubit [[Ex. 25:10]].

      Leviticus shows what was done at it. An Israelite brought his animal “at the door of the tabernacle of the congregation” ([[Lev. 1:3]]), and the priests sprinkled its blood on the altar that stood there. The fire was not allowed to die: “The fire shall ever be burning upon the altar; it shall never go out” ([[Lev. 6:13]]). The continual burnt offering of [[Ex. 29:38–42]] was made on it.

      The utensils of verse 3 belong to that work. The pans and shovels were for the ashes, the fleshhooks were forks for placing and turning the sacrifice on the fire, and the firepans carried coals.
    sources: [lds-scriptures, bd-tabernacle, ot-minute-ex-25]

  - ref: 2
    phrase: the horns of it
    kind: symbol
    title: The horns of the altar
    body: |
      The horns were projections at the four corners of the altar, of one piece with it, and they were the part on which atoning blood was put. In the sin offering the priest took blood on his finger and “put it upon the horns of the altar of burnt offering” ([[Lev. 4:25]]), and the same is commanded for the day Aaron and his sons are consecrated ([[Ex. 29:12]]). The horns were “the loftiest points of the altar,” and the blood was put there “that the atonement be brought nearer to God.”

      They were also what a man in fear of his life took hold of. Adonijah, afraid of Solomon, “caught hold on the horns of the altar” ([[1 Kgs. 1:50]]), and Joab did the same after him ([[1 Kgs. 2:28]]). The law had already set a limit to that refuge: the man who kills another “with guile” is to be taken “from mine altar, that he may die” ([[Ex. 21:14]]).

      The chapter does not say why an altar has horns. Horns “in ancient times were often symbols of power and strength,” and on one reading the blood on the four horns “could symbolize the power or strength of Jesus Christ’s Atonement reaching all four corners of the earth.”
    sources: [lds-scriptures, bd-altar, ot-minute-ex-25]

  - ref: 8
    phrase: Hollow with boards shalt thou make it
    kind: history
    title: A wooden altar that carried fire
    body: |
      The altar was a hollow frame of boards covered with brass, and it was probably filled with earth or stones. A wooden box is a strange thing to burn sacrifices on, and the LORD had lately told Israel to make Him an altar of earth or of uncut stone ([[Ex. 20:24–25]]). The two commands can be read together. “The hollow was probably filled with earth or unhewn stones,” and Israel “often enclosed the earth or stones in a wooden case to preserve the proper shape.” On that reading the frame gave the altar its form and let it be carried on staves, and the filling was the earth or stone the earlier law asked for. The chapter itself does not say what went inside.

      The grate is less clear. Around the altar and halfway up ran a ledge (the King James “compass”), “supported by a grating or network of brass.” Whether that network ran around the sides of the altar, halfway down, or was a grate set halfway down inside it, on which the sacrifice burned, is debated.

      “As it was shewed thee in the mount” repeats what was said of the whole tabernacle: Moses was shown what he was to make (see [[Ex. 25:9]]).
    sources: [bd-tabernacle, bd-altar, ot-minute-ex-25]

  - ref: 9
    phrase: the court of the tabernacle
    kind: history
    title: The court, and who came into it
    body: |
      The court was the fenced yard around the tent, and it was as far as an Israelite who was not a priest could come. It measured a hundred cubits by fifty, enclosed by a fence “five cubits high, composed of pillars and hangings of fine white linen.” Its one entrance was on the east, twenty cubits wide, closed by a screen of the same materials as the veil and the door of the tent. “Into this courtyard anyone of Israel could bring sacrifices, but only the priests could enter the tabernacle itself.”

      The “fillets” of the pillars were of silver, and what they were is not certain. They may have been bands, each a “fillet or ring clasping (binding) a pillar of the tabernacle,” though most have understood rods joining the tops of the pillars, from which the hangings hung.

      The court is the outermost of the tabernacle’s three spaces, each nearer to the LORD’s presence than the one before (see [[Ex. 25:8]]). The walls of the tent stand on silver bases; out here the pillars stand on brass. For what the change of metal marks, see the note on [[Ex. 26:37]].

      One study compares the three spaces with Mount Sinai, where Israel had just learned that nearness to the LORD has bounds (see [[Ex. 19:12]]): the court, the holy place and the Holy of Holies correspond to the mountain’s “base, midsection, and peak.” On that reading the court is the foot of the mountain.
    sources: [bd-tabernacle, bdb, ot-manual-ex-25-30, ot-minute-ex-25, morales-tabernacle]

  - ref: 20
    phrase: pure oil olive beaten
    kind: history
    title: Beaten oil, brought by the people
    body: |
      “Beaten” oil was the finest grade of olive oil, and it was what the lamps of the holy place burned. On one older account it was made “by gently pounding the olives in a mortar,” then letting the pulp drain through a basket and skimming off the oil that rose first; the “commoner kinds of oil were obtained from the pulp remaining in the baskets.”

      The light it fed is the candlestick of [[Ex. 25:31]], which stood in the holy place. The command is addressed to the whole people. The children of Israel bring the oil, the priests tend the flame, and the statute is kept “on the behalf of the children of Israel” (verse 21).

      Olive oil can stand for purity, for the influence of the Holy Ghost, and for the atoning blood of Jesus Christ.
    sources: [cambridge-exodus, bd-tabernacle, scripture-helps-ex-35]

  - ref: 20
    phrase: to cause the lamp to burn always
    kind: history
    title: The lamp tended evening and morning
    body: |
      The lamp was lit each evening and tended each morning; whether “always” means a flame that never went out or a lamp lit regularly is read two ways. The next verse gives the hours: Aaron and his sons tend it “from evening to morning.” When the command is repeated the two expressions stand together, “from the evening unto the morning before the LORD continually” ([[Lev. 24:3]]). The lamps were lit at evening and dressed in the morning (see [[Ex. 30:7–8]]).

      On one reading the light was “continually burning,” with the priest trimming the lamp, adding oil and relighting it every morning and evening. One older reading takes the Hebrew word more loosely: “not continuously,” “but regularly, as a standing practice.” The verse does not decide between them.
    sources: [lds-scriptures, bd-tabernacle, ot-minute-ex-25, cambridge-exodus]

  - ref: 21
    phrase: the tabernacle of the congregation
    kind: words
    title: The tent of meeting
    body: |
      “The tabernacle of the congregation” is in Hebrew the “tent of meeting.” The King James “congregation” suggests a gathering of people, but the meeting the name has in view is “of God with his people.” The LORD Himself speaks of meeting Israel at this tent in [[Ex. 29:42–43]]; see the note at [[Ex. 29:42]].
    sources: [lds-scriptures, oshb-wlc, bdb]

christ: |
  The altar in the court was where Israel’s sacrifices were offered, and those sacrifices were symbols of the atoning sacrifice of Jesus Christ. Amulek says that the whole meaning of the law was to point to “that great and last sacrifice,” the Son of God ([[Alma 34:14]]). Sacrifice had carried that meaning from the beginning, when the angel told Adam, “This thing is a similitude of the sacrifice of the Only Begotten of the Father” ([[Moses 5:7]]).

  Two more details of the chapter have been read as pointing to Him, and both are readings. The gate of the court is hung in the colors of the door and the veil, and the Savior called Himself the way in: “I am the door: by me if any man enter in, he shall be saved” ([[John 10:9]]). On this reading, “From the very beginning to the very end of our journey back to God, the Savior stands beckoning us to enter through Him.” And the oil that gives the sanctuary its light is “beaten,” and the same reading sets Isaiah’s words beside it: “he was bruised for our iniquities” ([[Isa. 53:5]]).

explore: |
  - **The altar and the court made.** [[Ex. 38:1–20]], where Bezaleel makes what is commanded here.
  - **What was offered on the altar.** [[Lev. 1:1–9]] for the burnt offering, and [[Ex. 29:38–42]] for the offering made every day.
  - **The lamp tended.** [[Ex. 30:7–8]] and [[Lev. 24:1–4]], where the lighting of the lamps is joined to the burning of incense.
  - **Hebrews on the sanctuary.** [[Heb. 9:1–14]]: the first tabernacle, its furniture and its service, and Christ as high priest “by a greater and more perfect tabernacle.”

