chapter: 40
title: The Glory of the LORD Fills the Tabernacle
tagline: On the first day of the second year Moses raises the tabernacle and sets each thing in its place, as the LORD commanded. Then the cloud covers the tent, the glory of the LORD fills it, and the book ends with Israel following that cloud.
when: 'The first day of the first month of the second year after the departure from Egypt (40:17).'

setting: |
  Israel has been camped at Sinai since the third month after leaving Egypt ([[Ex. 19:1]]). In that time the covenant was made and broken and renewed, and Moses spent forty days on the mount twice. The people have now made everything the LORD showed Moses there and brought it to him, and he has looked over the work and blessed them ([[Ex. 39:43]]). What remains is to put it together.

  The chapter dates itself: the first day of the first month of the second year (verse 17). Israel had reached Sinai some nine months before, so that by one older reckoning the making of the tabernacle “had not occupied quite half a year.”

  The camp does not move yet. Leviticus opens with the LORD calling to Moses “out of the tabernacle of the congregation” ([[Lev. 1:1]]), and the laws of sacrifice are given from there. A month after this chapter the people are numbered ([[Num. 1:1]]), and on the twentieth day of that second month the cloud lifts and Israel leaves Sinai ([[Num. 10:11–12]]).

thread: |
  The chapter has three parts: the LORD commands, Moses does, and the LORD comes.

  The command (verses 1–15) names the furnishings in order and then the anointing of the house and of its priests. The doing (verses 16–33) follows the same order. Once the tent stands, the setting of the furnishings “began from the inside,” with the ark behind its veil, then the table, the candlestick and the incense altar in the outer room, and “then moved to the outside,” to the altar, the laver and the court. Each piece was explained where the LORD commanded it: the ark at [[Ex. 25:10]], the veil at [[Ex. 26:31]], the table at [[Ex. 25:23]], the candlestick at [[Ex. 25:31]], the altar of incense at [[Ex. 30:1]], the altar of burnt offering at [[Ex. 27:1]], the laver at [[Ex. 30:18]], the court at [[Ex. 27:9]], and the priesthood of Aaron and his sons at [[Ex. 28:1]]. Why the tabernacle is described twice is taken up at [[Ex. 35:1]].

  The refrain continues, and the ending is new. Seven times Moses finishes a step “as the LORD commanded Moses,” and then “Moses finished the work.” At that point the LORD does what no workman could do. He had promised, “the tabernacle shall be sanctified by my glory,” and “I will dwell among the children of Israel” ([[Ex. 29:43–45]]). The cloud and the glory that rested on Sinai (see [[Ex. 24:16]]) now come down on the tent, and the book closes with that promise kept.

  The last three verses look past the end of the book. The cloud that went before Israel (see [[Ex. 13:21]]) now rests on the tabernacle, and its lifting is the signal to march. Israel still has a wilderness to cross, and the LORD will cross it with them.

sections:
  - range: 1-8
    heading: The command to set up the tabernacle
    plain: |
      The LORD said to Moses: “On the first day of the first month set up the tabernacle, the tent of meeting. Put the ark of the testimony in it and screen the ark with the veil. Bring in the table and arrange on it what belongs there. Bring in the candlestick and light its lamps. Put the gold altar for incense in front of the ark of the testimony, and hang the screen at the door of the tabernacle.

      “Put the altar of burnt offering in front of the door of the tabernacle. Put the laver between the tent of meeting and the altar, and put water in it. Set up the court all around, and hang the screen at the gate of the court.”
  - range: 9-15
    heading: The command to anoint the house and its priests
    plain: |
      “Take the anointing oil and anoint the tabernacle and everything in it. Make it holy, with all its vessels, and it shall be holy. Anoint the altar of burnt offering and all its vessels and make the altar holy, and it shall be an altar most holy. Anoint the laver and its base and make it holy.

      “Bring Aaron and his sons to the door of the tent of meeting and wash them with water. Put the holy garments on Aaron, anoint him, and make him holy, so that he may serve me as priest. Bring his sons and clothe them with coats, and anoint them as you anointed their father, so that they may serve me as priests. Their anointing shall be to them for an everlasting priesthood through all their generations.”
  - range: 16-33
    heading: Moses raises the tabernacle
    plain: |
      Moses did all of it, just as the LORD commanded him. On the first day of the first month of the second year the tabernacle was raised. Moses set its bases, stood up its boards, put in its bars, and raised its pillars. He spread the tent over the tabernacle and put the covering of the tent over that, as the LORD commanded Moses.

      He put the testimony into the ark, set the poles on the ark, and put the mercy seat on top of it. He brought the ark into the tabernacle and hung the screening veil to hide it, as the LORD commanded Moses. He put the table in the tent of meeting on the north side, outside the veil, and set the bread in order on it before the LORD, as the LORD had commanded Moses. He put the candlestick opposite the table, on the south side, and lighted the lamps before the LORD, as the LORD commanded Moses. He put the golden altar before the veil and burned sweet incense on it, as the LORD commanded Moses.

      He hung the screen at the door of the tabernacle. He put the altar of burnt offering by the door and offered on it the burnt offering and the meal offering, as the LORD commanded Moses. He set the laver between the tent of meeting and the altar and put water in it for washing. Moses and Aaron and his sons washed their hands and feet there whenever they went into the tent or came near the altar, as the LORD commanded Moses. He raised the court around the tabernacle and the altar and hung the screen at its gate. So Moses finished the work.
  - range: 34-38
    heading: The cloud and the glory
    plain: |
      Then the cloud covered the tent of meeting, and the glory of the LORD filled the tabernacle. Moses could not go into the tent, because the cloud rested on it and the glory of the LORD filled the tabernacle.

      Through all their journeys, whenever the cloud was taken up from over the tabernacle, the children of Israel set out. If it was not taken up, they stayed until the day it was. The cloud of the LORD was on the tabernacle by day, and there was fire on it by night, where all the house of Israel could see it, throughout all their journeys.

notes:
  - ref: 2
    phrase: On the first day of the first month
    kind: history
    title: New Year’s Day, a year after Egypt
    body: |
      The tabernacle goes up on the first day of the year, two weeks short of a year after Israel left Egypt. The first month is the month of the Exodus, which the LORD had made “the beginning of months” ([[Ex. 12:2]]; its name is at [[Ex. 13:4]]). Israel went out “on the fifteenth day of the first month” ([[Num. 33:3]]). The command to keep the Passover a second time comes in this same month ([[Num. 9:1]]).

      The day has been read as more than a date. The first day of the first month is also the day on which Noah took the covering off the ark and saw dry ground ([[Gen. 8:13]]), “that is, on New Year’s Day,” and one study finds one “new beginning” marking the accounts of the Creation, the Flood and the tabernacle alike. Read devotionally, the day is “not just the first day of the year but the first day of a new year,” and raising the tabernacle then “symbolized the new life redeemed Israel could find in Christ.”

      The text gives no reason for the date. These are readings of it.
    sources: [bd-tabernacle, lds-scriptures, morales-tabernacle, champoux-beginning-again]

  - ref: 29
    phrase: offered upon it the burnt offering and the meat offering
    kind: history
    title: Moses’s service at the altar and Aaron’s consecration
    body: |
      Moses himself performs the first services of the tabernacle, and the anointing of Aaron and his sons, commanded in verses 12–15, is not told until Leviticus. He sets out the bread, lights the lamps, burns the incense and offers the first sacrifice. The LORD commanded two things in this chapter, the raising and the anointing, and verses 17–33 report only the first. In Leviticus Moses “brought Aaron and his sons, and washed them with water” ([[Lev. 8:6]]), “took the anointing oil, and anointed the tabernacle and all that was therein” ([[Lev. 8:10]]), and “poured of the anointing oil upon Aaron’s head” ([[Lev. 8:12]]). Numbers looks back on it all as “the day that Moses had fully set up the tabernacle, and had anointed it, and sanctified it” ([[Num. 7:1]]).

      One older reading therefore takes verse 16, “Thus did Moses,” as said ahead of the event, since “the consecration of the priests did not take place contemporaneously with the erection of the tabernacle, but somewhat later.” On that reading the burnt offering and “meat offering” of this verse (a meal or cereal offering) are “the daily morning and evening sacrifice” of [[Ex. 29:38]], and Moses served at the furnishings before they were anointed. They were already holy, on this view, because they were made and set up as the LORD instructed, and still more because His glory filled the house.

      For the priesthood Moses held, see [[Ex. 2:18]]; for the washing, clothing and anointing of the priests, [[Ex. 29:4]]; for the oil, [[Ex. 30:25]].
    sources: [lds-scriptures, keil-exodus]

  - ref: 33
    phrase: So Moses finished the work
    kind: structure
    title: Seven times “as the LORD commanded Moses”
    body: |
      The account of the raising is built on a refrain repeated seven times, and the seven have been read as one of the ties between the tabernacle and the week of Creation. Seven times a step ends “as the LORD commanded Moses”: the tent and its covering (verse 19), the ark and the veil (21), the bread (23), the lamps (25), the incense (27), the altar and its offering (29), and the washing at the laver (32). The people’s part was summed up the same way, for they “did according to all that the LORD commanded Moses” ([[Ex. 39:32]]).

      One study counts these as “seven acts of Moses,” set beside the seven speeches in which the tabernacle was commanded (see the note at [[Ex. 31:13]]), and sees the Sabbath tying the accounts of the Creation and of the tabernacle together. On this reading the end of Exodus “may serve as something of a bookend with the creation account,” since it shows a finished building made holy by the LORD’s presence.

      The last line of the account shares its wording with Genesis: “So Moses finished the work” has the same Hebrew verb and noun as “on the seventh day God ended his work” ([[Gen. 2:2]]), where the King James varies the English. This belongs with the echoes of the Creation set out at [[Ex. 39:43]].

      The bookend is a reading of how the text is shaped. Exodus does not itself call the tabernacle a new creation.
    sources: [morales-tabernacle, oshb-wlc, lds-scriptures]

  - ref: 34
    phrase: the glory of the LORD filled the tabernacle
    kind: scripture
    title: The cloud and the glory on later houses of the LORD
    body: |
      The cloud and the glory come again when a later house of the LORD is finished, and latter-day revelation promises them once more. (The glory itself is explained at [[Ex. 24:16]].) When Solomon’s temple was dedicated, “the priests could not stand to minister because of the cloud: for the glory of the LORD had filled the house of the LORD” ([[1 Kgs. 8:11]]). The two accounts follow one pattern: once the house is finished and dedicated, “God comes to His new house in glory.” Ezekiel saw the same of the temple shown to him in vision: “the glory of the LORD filled the house” ([[Ezek. 43:5]]).

      Latter-day revelation speaks in the same terms of a temple still to be built in the New Jerusalem: “an house shall be built unto the Lord, and a cloud shall rest upon it, which cloud shall be even the glory of the Lord, which shall fill the house” ([[D&C 84:5]]). The prayer that dedicated the Kirtland Temple asks that “thy glory may rest down upon thy people, and upon this thy house” ([[D&C 109:12]]), and “let thy house be filled, as with a rushing mighty wind, with thy glory” ([[D&C 109:37]]). The footnotes to this verse in the Church’s edition point to both sections.

      [That I May Dwell among Them](/exodus/themes/that-i-may-dwell-among-them/) follows the glory from Sinai to this tent.
    sources: [lds-scriptures, sc-knowhy-806]

  - ref: 35
    phrase: Moses was not able to enter
    kind: history
    title: Why Moses could not go in
    body: |
      Moses, who went up into the cloud on Sinai, cannot enter the tent he has just raised, and the verse gives its own reason: “the cloud abode thereon, and the glory of the LORD filled the tabernacle.” One study finds “no real discrepancy” with Sinai, because there too Moses waited to be called. The cloud covered the mount six days, “and the seventh day he called unto Moses out of the midst of the cloud” ([[Ex. 24:16]]), and only then did Moses go up into it. For the tabernacle the call probably comes either in the first verse of Leviticus, where “the LORD called unto Moses, and spake unto him out of the tabernacle of the congregation” ([[Lev. 1:1]]), or after Aaron’s first offerings, when “Moses and Aaron went into the tabernacle of the congregation” ([[Lev. 9:23]]).

      The verse still makes a point of his being kept out, and the same study reads that as a statement about the place. The Hebrew “not able” is what the LORD said to Moses about seeing His face (see [[Ex. 33:20]]), so that His presence in the tabernacle is a real presence, not to be treated lightly. That is one reading.

      The tent Moses entered earlier, with the cloudy pillar standing at its door ([[Ex. 33:9]]), is treated at [[Ex. 33:7]].
    sources: [morales-tabernacle, lds-scriptures]

christ: |
  The book that began with Israel in bondage ends with the LORD, who is Jehovah (see [[Ex. 3:14]]), dwelling in a tent in their camp. He had said that this was why He brought them out: “that I may dwell among them” ([[Ex. 29:46]]).

  John uses both words, dwelling and glory, of the Word made flesh: “the Word was made flesh, and dwelt among us, (and we beheld his glory, the glory as of the only begotten of the Father,) full of grace and truth” ([[John 1:14]]). The wording is shared with the promise and with this chapter’s ending.

  Hebrews says how the tabernacle relates to Christ’s work. He is a “minister of the sanctuary, and of the true tabernacle, which the Lord pitched, and not man” ([[Heb. 8:2]]), and He “is not entered into the holy places made with hands, which are the figures of the true; but into heaven itself, now to appear in the presence of God for us” ([[Heb. 9:24]]).

  The Bible’s last vision takes the tabernacle’s name for the end of the story: “Behold, the tabernacle of God is with men, and he will dwell with them, and they shall be his people, and God himself shall be with them, and be their God” ([[Rev. 21:3]]).

