chapter: 39
title: As the LORD Commanded Moses
tagline: The craftsmen make Aaron’s garments as they were described on the mount, and the whole tabernacle is carried to Moses piece by piece. He looks over all the work, finds it done as the LORD commanded, and blesses the people.
when: 'In the first year after Israel left Egypt, before the first day of the first month of the second year, when the tabernacle is set up (40:17).'

setting: |
  This is the last chapter of the making. Since chapter 35 the people have brought their offerings, and Bezaleel, Aholiab and the “wise hearted” (see [[Ex. 31:2]]) have made the tent, its furniture and its court. The last chapter closed with an account of the metals used ([[Ex. 38:21]]). What remains is the clothing of the priests.

  Verses 1–31 follow chapter 28 closely, in the main word for word, with “they made” where the instruction said “thou shalt make.” Each garment is explained where the LORD commands it: see [[Ex. 28:6]] and the notes after it.

  Then everything is brought to Moses. Nothing has been set up yet. That waits for “the first day of the first month” ([[Ex. 40:2]]), and Moses puts the garments on Aaron in [[Lev. 8:7–9]].

thread: |
  The chapter is a report, and its refrain says what kind: seven times in the first thirty-one verses the account stops to say “as the LORD commanded Moses” (see the note on verse 1).

  The garments come in this order: the ephod and its shoulder stones (verses 2–7; commanded at [[Ex. 28:6]]), the breastplate (verses 8–21; [[Ex. 28:15]]), the blue robe (verses 22–26; [[Ex. 28:31]]), the linen that every priest wore (verses 27–29; [[Ex. 28:39]]), and the gold plate (verses 30–31; [[Ex. 28:36]]). The plate was described before the linen in chapter 28 and is made after it here. One older reading takes the order to be deliberate: the other garments stand between the ephod, “the principal part of the official robes of the high priest,” and the plate, whose inscription made it “the most striking sign of the dignity of his office.”

  The second telling is shorter than the first. It says what was made and leaves out most of what chapter 28 said each piece was for: that Aaron should bear Israel’s names on his heart, that the bells be heard “that he die not.” The Urim and Thummim are not mentioned at all. Moses had been told to put them in the breastplate, not to make them ([[Ex. 28:30]]), and when he clothes Aaron “he put in the breastplate the Urim and the Thummim” ([[Lev. 8:8]]). Most of verse 3 is new: it tells how the gold was worked into the cloth (see the note on that verse).

  At verse 32 the subject changes. It is no longer the craftsmen but “the children of Israel” who “did according to all that the LORD commanded Moses,” and it is they who bring the work to Moses. The list runs from the tent and its coverings through the furniture to the court and the garments. It also includes the shewbread, the oil and the incense: “everything, therefore, that was required for the institution of the daily worship, as soon as the tabernacle was set up.” Moses looks, finds it as commanded, and blesses them (see the note on verse 43).

  Why the making is told at such length, and why the golden calf stands between the command and the making, is taken up where the second telling begins (see [[Ex. 35:1]]).

sections:
  - range: 1-7
    heading: The ephod and its shoulder stones
    plain: |
      From the blue, purple and scarlet yarn they made the garments for officiating in the holy place, and they made the holy garments for Aaron, as the LORD commanded Moses.

      The ephod was made of gold, blue, purple, scarlet, and fine twined linen. They hammered the gold into thin sheets and cut it into threads, to work it in with the blue, the purple, the scarlet and the fine linen in a skillful design. The ephod had shoulder pieces that joined it at its two edges. Its skillfully woven band was of the same work and the same materials, as the LORD commanded Moses.

      They set onyx stones in settings of gold and engraved them, as a signet is engraved, with the names of the children of Israel. The stones were put on the shoulders of the ephod as stones of memorial for the children of Israel, as the LORD commanded Moses.
  - range: 8-21
    heading: The breastplate
    plain: |
      The breastplate was made in the same skilled work as the ephod and of the same materials. It was square when doubled, a span long and a span wide. Four rows of stones were set in it: a sardius, a topaz, and a carbuncle; an emerald, a sapphire, and a diamond; a ligure, an agate, and an amethyst; a beryl, an onyx, and a jasper, each in its setting of gold. There were twelve stones for the twelve tribes, each engraved like a signet with the name of one of them.

      They made chains of pure gold, twisted like cords, with two gold settings and two gold rings. The rings went on the two ends of the breastplate, the chains ran through the rings, and the other ends of the chains were fastened to the settings on the shoulder pieces of the ephod, in front. Two more gold rings went on the two ends of the breastplate, on the inner edge next to the ephod, and two on the ephod itself, low on its front, above the woven band. They bound the breastplate by its rings to the rings of the ephod with a lace of blue, so that it sat above the woven band and did not come loose from the ephod, as the LORD commanded Moses.
  - range: 22-26
    heading: The robe of the ephod
    plain: |
      The robe of the ephod was woven all of blue. The opening in the middle of it was like the opening of a coat of mail, with a binding around it so that it would not tear. On the hem they made pomegranates of blue, purple, scarlet, and twined linen, and bells of pure gold, and they put the bells between the pomegranates all the way around the hem: a bell and a pomegranate, a bell and a pomegranate. It was a robe to minister in, as the LORD commanded Moses.
  - range: 27-31
    heading: The linen garments and the plate of gold
    plain: |
      For Aaron and his sons they made woven coats of fine linen, the turban of fine linen, the caps of fine linen, and the linen breeches of fine twined linen. They made the girdle of fine twined linen with blue, purple and scarlet, worked with the needle, as the LORD commanded Moses.

      They made the plate of the holy crown of pure gold and wrote on it, as a signet is engraved, HOLINESS TO THE LORD. They tied a lace of blue to it to fasten it high on the turban, as the LORD commanded Moses.
  - range: 32-43
    heading: All the work is brought to Moses
    plain: |
      So all the work of the tabernacle, the tent of meeting, was finished. The children of Israel did everything just as the LORD had commanded Moses.

      They brought the tabernacle to Moses: the tent and all its implements, its clasps, boards, bars, pillars and sockets. They brought the covering of rams’ skins dyed red, the covering of badgers’ skins (see [[Ex. 25:5]]), and the screening veil. They brought the ark of the testimony with its poles, and the mercy seat; the table with all its vessels, and the bread of the Presence; the pure candlestick with its lamps set in order, all its vessels, and the oil for the light. They brought the golden altar, the anointing oil, the sweet incense, and the screen for the door of the tent; the altar of bronze with its bronze grating, its poles and all its vessels; and the laver and its base. They brought the hangings of the court with its pillars and sockets, the screen for the court gate, its cords and its pins, and all the vessels for the service of the tabernacle. And they brought the garments for officiating in the holy place, the holy garments for Aaron the priest and the garments of his sons for serving as priests.

      The children of Israel had made all of it just as the LORD commanded Moses. Moses looked over all the work and saw that they had done it as the LORD had commanded. And Moses blessed them.

notes:
  - ref: 1
    phrase: as the LORD commanded Moses
    kind: structure
    title: 'The refrain: as the LORD commanded Moses'
    body: |
      The clause closes each stage of the making of the garments, seven times in thirty-one verses (verses 1, 5, 7, 21, 26, 29 and 31), and it makes the repeated description read as a report. Chapter 28 was a command in the future tense. This chapter gives the same garments in the past tense and signs each of them off.

      Moses had been held to what he was shown: “look that thou make them after their pattern, which was shewed thee in the mount” ([[Ex. 25:40]]). The refrain reports, piece by piece, that it was so made.

      At the end the formula widens from the single garment to the whole work and from the craftsmen to the people: “the children of Israel did according to all that the LORD commanded Moses, so did they” (verse 32), and verse 42 says it again. One study of the tabernacle sets verse 42 beside what Genesis says of an earlier builder: “Thus did Noah; according to all that God commanded him, so did he” ([[Gen. 6:22]]). It offers the likeness only as a “general correspondence” between the ark and the tabernacle.

      The refrain does not end with the chapter. The same is said of Moses himself, “Thus did Moses: according to all that the LORD commanded him, so did he” ([[Ex. 40:16]]), and “as the LORD commanded Moses” returns verse after verse as he sets the tabernacle up ([[Ex. 40:19–32]]).
    sources: [lds-scriptures, morales-tabernacle]

  - ref: 3
    phrase: beat the gold into thin plates, and cut it into wires
    kind: history
    title: How gold was worked into the cloth
    body: |
      This verse tells how gold became part of a woven garment, which chapter 28 did not: it was hammered into thin sheets, the sheets were cut into strands, and the strands were worked in with the blue, purple and scarlet yarn and the linen. The King James “wires” translates a Hebrew word for a cord or thread: these are “threads (of gold).”

      The instruction had only listed gold first among the ephod’s materials: “they shall make the ephod of gold, of blue, and of purple, of scarlet, and fine twined linen” ([[Ex. 28:6]]).
    sources: [lds-scriptures, bdb]

  - ref: 28
    phrase: a mitre of fine linen
    kind: words
    title: An Egyptian word for the priests’ linen
    body: |
      The “fine linen” of the priests’ coats, turban and caps is named with a “loan-word probably from Egyptian” that means “fine Egyptian linen.” It is the word for the “vestures of fine linen” in which Pharaoh arrayed Joseph ([[Gen. 41:42]]), and for the thread the women of Israel spun for the tabernacle ([[Ex. 35:25]]).

      The description of the priests’ clothes and of the tabernacle’s materials has “several Egyptian loanwords,” the word for Aaron’s sash among them. (For the stones of the breastplate, see [[Ex. 28:15]].)

      One Latter-day Saint reading takes this as a sign that the account remembers where Israel had been. Exodus through Numbers has “an unusually high concentration of Egyptian loanwords compared with the rest of the Hebrew Bible,” and the borrowed words are mostly names for things, “concrete material-culture and setting words.” It grants that such words might have entered Hebrew later, and judges that “it makes more sense to see these terms as being brought out of Egypt by the Israelites when they left.” That is an argument from vocabulary and not a proof. On that reading, a people a year out of Egypt named their priests’ linen as Egypt named it.
    sources: [bdb, oshb-wlc, sc-knowhy-848, lds-scriptures]

  - ref: 43
    phrase: Moses did look upon all the work
    kind: scripture
    title: Finished, seen, and blessed
    body: |
      The chapter closes in words that also close the account of the Creation. Set side by side:

      - “Thus the heavens and the earth were finished” ([[Gen. 2:1]]). “Thus was all the work of the tabernacle of the tent of the congregation finished” (verse 32).
      - “God saw every thing that he had made, and, behold, it was very good” ([[Gen. 1:31]]). “Moses did look upon all the work, and, behold, they had done it” (verse 43).
      - “God blessed the seventh day” ([[Gen. 2:3]]). “Moses blessed them” (verse 43).

      The likeness is closer in Hebrew than in English. The King James “did look upon” translates the verb that is “saw” in Genesis. “Behold” and “blessed” are the same words in both passages, “finished” is the same verb in another form, and the “work” of verse 43 (though not of verse 32) is the word for God’s “work” in [[Gen. 2:2]].

      One older commentary sets verse 32 beside [[Gen. 2:1]] without drawing anything from it. A Latter-day Saint study says more generally that “the writers of Exodus deliberately invoked the Creation to describe the building of the tabernacle.” It does not cite these verses, and nothing more is claimed here than that the wording is shared. Earlier echoes of the Creation in the tabernacle chapters are noted at [[Ex. 31:3]] and [[Ex. 31:13]].

      The text does not say what Moses’s blessing was. One older reading takes it as his answer to what the people had shown: their “readiness and liberality” in giving and their zeal in the work were “most cheering signs of the willingness of the Israelites to serve the Lord.”
    sources: [lds-scriptures, oshb-wlc, cambridge-exodus, belnap-dwell-among, keil-exodus]

christ: |
  The high priest’s garments are finished here, and what scripture makes of that office is told where they are commanded (see [[Ex. 28:1]] and the close of that chapter).

  What this chapter adds is its refrain. Everything was made as the LORD showed it to Moses, and Hebrews gives the reason that mattered. The priests of this tabernacle “serve unto the example and shadow of heavenly things,” which is why Moses was told to “make all things according to the pattern” ([[Heb. 8:5]]). The reality behind the shadow is Christ, the high priest who ministers in “the true tabernacle” ([[Heb. 8:1–2]]; see the close of the next chapter, at [[Ex. 40:34]]).

explore: |
  - **The command behind each garment.** [[Ex. 28:6–43]], with the notes there.
  - **The garments put on.** [[Lev. 8:6–9]], where Moses clothes Aaron and places the Urim and Thummim in the breastplate.
  - **The refrain continued.** [[Ex. 40:16–33]], which ends, “So Moses finished the work.”
  - **The true tabernacle.** [[Heb. 8:1–5]]; [[Heb. 9:11–12]].

