chapter: 19
title: The Covenant Offered at Sinai
tagline: Israel camps before the mountain, and the LORD offers to make them His own treasure, a kingdom of priests. The people say yes and make ready for three days. On the third day He comes down in fire, and they stand at the foot of the mount.
when: 'The third month after the departure from Egypt (verse 1).'

setting: |
  Israel left Egypt in the first month of its new calendar ([[Ex. 12:2]]). Since then the people have crossed the sea, eaten manna, and drunk from the rock at Rephidim, their last camp before this one ([[Ex. 17:1]]). Now, in the third month, they come into the wilderness of Sinai and pitch their tents in front of the mountain where Moses saw the burning bush. The sign he was given there is kept: “When thou hast brought forth the people out of Egypt, ye shall serve God upon this mountain” ([[Ex. 3:12]]).

  They will not move again for most of a year. The camp breaks up “on the twentieth day of the second month, in the second year” ([[Num. 10:11]]), and everything in between is set at this mountain: the rest of Exodus, all of Leviticus, and the opening chapters of Numbers. Chapter 19 is the doorway to all of it. The commandments begin in the next chapter. This one holds the offer of the covenant and the three days of making ready.

thread: |
  The chapter is a covenant proposed and accepted, with a prophet carrying the words up and down a mountain. Moses climbs three times (verses 3, 8, and 20). He comes down the first time with the offer, the second time with instructions for meeting the LORD, and the third time with a warning.

  The offer has an order. First comes what the LORD has already done: “Ye have seen what I did.” Then come the condition and the promise. The promise leans on the reminder, so that Israel can trust what is offered “because they already know what God has done for them in the past.”

  With the people’s answer in verse 8, the chapter turns from the offer to making ready for the meeting. The LORD says He will come down in the sight of all the people on the third day. They wash and wait. A boundary is drawn around the mount, and they are told that when the horn sounds long they will come up.

  The third day arrives with thunder, fire, smoke, and the horn. Moses leads the people out of the camp “to meet with God” (verse 17), and there the chapter leaves them. Only Moses is called up, and he is sent straight back down to keep the people from breaking through. The people have accepted the offer and made ready, but when the chapter closes they are still at the foot of the mount, and the next chapter tells what they did ([[Ex. 20:18–21]]).

sections:
  - range: 1-2
    heading: Israel camps before the mount
    plain: |
      In the third month after the children of Israel left Egypt, on that same day, they came into the wilderness of Sinai. They had set out from Rephidim and come to the desert of Sinai, and they pitched their camp in the wilderness. There Israel camped in front of the mountain.
  - range: 3-6
    heading: The offer
    plain: |
      Moses went up to God, and the LORD called to him from the mountain: “Say this to the house of Jacob, and tell the children of Israel: You have seen what I did to the Egyptians, and how I carried you on eagles’ wings and brought you to myself. Now, if you will truly obey my voice and keep my covenant, you will be my own treasure above all peoples, for all the earth is mine. You will be to me a kingdom of priests and a holy nation. These are the words you are to speak to the children of Israel.”
  - range: 7-9
    heading: The people answer
    plain: |
      Moses came and called the elders of the people and set before them all the words the LORD had commanded him. All the people answered together, “All that the LORD has spoken we will do.” Moses took their answer back to the LORD.

      The LORD said to Moses, “I am coming to you in a thick cloud, so that the people may hear when I speak with you and believe you for ever.” And Moses told the LORD what the people had said.
  - range: 10-15
    heading: Three days of making ready
    plain: |
      The LORD said to Moses, “Go to the people and sanctify them today and tomorrow. Let them wash their clothes and be ready for the third day, for on the third day the LORD will come down on mount Sinai in the sight of all the people. Set bounds for the people all around, and tell them, ‘Take care not to go up into the mount or touch its border. Whoever touches the mount shall surely be put to death. No hand is to touch it; he shall be stoned or shot through. Whether beast or man, it shall not live.’ When the trumpet sounds long, they shall come up to the mount.”

      Moses went down from the mount to the people and sanctified them, and they washed their clothes. He said to them, “Be ready for the third day. Do not come near your wives.”
  - range: 16-19
    heading: The third day
    plain: |
      On the morning of the third day there were thunders and lightnings and a thick cloud on the mount, and the sound of a trumpet, very loud, so that all the people in the camp trembled. Moses brought the people out of the camp to meet with God, and they stood at the foot of the mount.

      Mount Sinai was covered with smoke, because the LORD came down on it in fire. The smoke went up like the smoke of a furnace, and the whole mountain shook. As the sound of the trumpet went on and grew louder and louder, Moses spoke, and God answered him by a voice.
  - range: 20-25
    heading: Moses is called up and sent down
    plain: |
      The LORD came down on the top of mount Sinai and called Moses up to the top of the mount, and Moses went up. The LORD said to him, “Go down and warn the people not to break through to the LORD to gaze, or many of them will perish. Let the priests also, who come near to the LORD, sanctify themselves, or the LORD will break out against them.”

      Moses said, “The people cannot come up to mount Sinai, for you charged us, ‘Set bounds about the mount and sanctify it.’” The LORD said to him, “Go, get down. Then come up, you and Aaron with you. But do not let the priests and the people break through to come up to the LORD, or He will break out against them.” So Moses went down to the people and spoke to them.

notes:
  - ref: 1
    phrase: the wilderness of Sinai
    kind: history
    title: Where Sinai was, and the day Israel arrived
    body: |
      Where Mount Sinai stood is not known for certain, and the verse gives the month of Israel’s arrival without the day. The mountain’s “site has been much disputed.” It “probably was in the southern part of the peninsula between the gulfs of Suez and Aqabah,” at one of the peaks called Jebel Musa, which is called only “A traditional site.” In the text this is the mountain of the bush (see [[Ex. 3:1]]), of which Moses was told, “ye shall serve God upon this mountain” ([[Ex. 3:12]]).

      “The same day” reads like a date, yet no day has been named. One older reading concludes that only the month is given, so that “it is altogether uncertain whether the arrival in the desert of Sinai took place on one of the first, one of the middle, or one of the last days of the month.” Later Jewish tradition set the giving of the law on the fiftieth day after Passover, and the Feast of Weeks, or Pentecost, became a festival that “celebrated the giving of the Law to Moses on Mount Sinai.” The same older reading judges that tradition “of far too recent a date to pass for historical,” so it does not settle the day.
    sources: [bd-sinai, scripture-helps-ex-19, keil-exodus, sc-knowhy-90, lds-scriptures]

  - ref: 4
    phrase: I bare you on eagles’ wings
    kind: symbol
    title: What the eagle pictures
    body: |
      The eagle’s wings can picture strength and speed or a parent’s care. The image “may suggest the swiftness and power by which the children of Israel had been brought to this point.” Others find in it “the nurturing nature” of the bird, “the image of the eagles’ protective wings.”

      Moses’s own song uses the eagle the second way: “As an eagle stirreth up her nest, fluttereth over her young, spreadeth abroad her wings, taketh them, beareth them on her wings: So the LORD alone did lead him” ([[Deut. 32:11–12]]). Read beside that song, the picture is of a mother eagle teaching her young to fly and catching them when they falter, an image of “tender, protective care that is ever present.”

      Whichever is meant, “the point of the reminder is to note how God was explicitly involved in their coming to him.” What the verse stresses is “God’s own desire to bring them to him,” and the offer of the next two verses is built on that.
    sources: [belnap-skinner-sinai, hardison-theophany, ot-minute-ex-18, lds-scriptures]

  - ref: 5
    phrase: a peculiar treasure unto me
    kind: words
    title: Peculiar means His own
    body: |
      “Peculiar” here means belonging to someone as his own. It has nothing to do with being strange: the word is “not used in the Bible as odd or eccentric” and means one’s “very own, exclusive, or special.” The English goes back to the Latin *peculium*, private property. The Hebrew noun behind the two English words, *segullah*, is “valued property, peculiar treasure.”

      The picture comes from the courts of the ancient world, “where the king was the theoretical owner of everything.” Out of all he owned, a king “might gather and put to one side things that he specially prized and considered to be his own in a unique way,” and that was his *segullah*. The verse speaks the same way. The LORD owns everything, “for all the earth is mine,” and out of everything He offers to set Israel apart as what He prizes.

      Israel is first called this here. Moses repeats it: “the LORD thy God hath chosen thee to be a special people unto himself” ([[Deut. 7:6]]), where “special” is the same Hebrew word. Peter carries it over to those who believe in Christ, “a peculiar people” ([[1 Pet. 2:9]]). The same word is “jewels” at [[Mal. 3:17]], where the note gives a latter-day apostle’s explanation of it.
    sources: [bd-peculiar, bdb, belnap-skinner-sinai, hardison-theophany, lds-scriptures]

  - ref: 5
    phrase: keep my covenant
    kind: history
    title: Which covenant, and the condition on it
    body: |
      The covenant offered here grows out of the one already made with Abraham, but with a new party and a stated condition. Israel has just been delivered on the strength of the older promise: “the Israelites were brought out of Egypt and toward Sinai on the basis of the Abrahamic covenant, not on the basis of the Mosaic covenant that would be instituted there.” Moses says so when he looks back. The LORD brought them out “because he would keep the oath which he had sworn unto your fathers” ([[Deut. 7:8]]). On this account, “it is because of the Abrahamic covenant that the Lord chose to initiate the Mosaic covenant with the Israelites.”

      The other party is now a whole people; this is “the first covenant that God made with Israel as a whole people.” And the blessings are stated with a condition, being “conditioned on the Israelites’ continued obedience to the terms of the covenant.” The verse is built as an if and a then. The promises to Abraham are in [[Gen. 17:1–8]].
    sources: [hopkin-covenant, shannon-kingdom-priests, lds-scriptures]

  - ref: 6
    phrase: a kingdom of priests
    kind: words
    title: Kingdom of priests, royal priesthood, kings and priests
    body: |
      “A kingdom of priests” has been translated three ways. The Hebrew phrase “is unique to the Hebrew Bible,” and “an exact translation of the terms together is more difficult.” The King James takes the two nouns as “kingdom of priests.” The first noun can also work as an adjective, which gives “royal priesthood.” That “is the manner in which the Septuagint understood the clause”: the ancient Greek translation reads “ye shall be to me a royal priesthood and a holy nation.” Peter writes it that way when he applies the verse to the Church: “ye are a chosen generation, a royal priesthood, an holy nation, a peculiar people” ([[1 Pet. 2:9]]). And “some early Jewish texts” read two separate nouns, “kings and priests.” Revelation has the same pair of words, “kings and priests unto God” ([[Rev. 1:6]]); the likeness is one of wording.

      All three offer a priest’s standing to an entire people. “The great prerogative of priests is that they enjoy a privileged relationship with God. They can enter into sacred space and approach God in a way others cannot.” In this verse “God is inviting all of Israel to be priests.”

      What Israel received in the end was narrower, a priesthood held by one tribe out of twelve. How that came about, and what latter-day revelation says was first intended, is told at [[Ex. 34:1]].
    sources: [belnap-skinner-sinai, lxx-rahlfs, hardison-theophany, lds-scriptures]

  - ref: 8
    phrase: All that the LORD hath spoken we will do
    kind: history
    title: Yes before the terms
    body: |
      Israel accepts the covenant before hearing its terms. The people commit themselves, and that can be read as “an act of tremendous faith”: they “put their trust in a covenant relationship with Jehovah even before they know what the parameters of that bond are going to look like.”

      The answer is the first of two steps. Accepting a covenant like this one was “a twofold process.” The people “had to verbally accept the terms,” and then some act had to show “that the new relationship was now in force.” The spoken acceptance is in this verse. On one reading the act was to be the LORD’s own coming down on the third day (verse 11).

      When the commandments and judgments have been heard, the people give the answer again: “All the words which the LORD hath said will we do” ([[Ex. 24:3]]). That is said in a ceremony held “to ratify and seal the covenant,” which is explained at [[Ex. 24:8]].
    sources: [shannon-kingdom-priests, belnap-skinner-sinai, hardison-theophany, lds-scriptures]

  - ref: 10
    phrase: sanctify them to day and to morrow
    kind: scripture
    title: What the people were being prepared for
    body: |
      Latter-day revelation says what the days of preparation were for: that the people might see God. The chapter itself says the LORD would “come down in the sight of all the people” (verse 11). Moses “sought diligently to sanctify his people that they might behold the face of God” ([[D&C 84:23]]). Joseph Smith taught the same in his own words: “Moses sought to bring the children of Israel into the presence of God,” and he sought it “through the power of the Priesthood but he could not.”

      So the washing and waiting were for more than hearing commandments read. At the foot of Sinai the Lord “tried to sanctify His people and to cause them to come up the mountain, enter His presence, and behold His face.”

      This chapter ends with the people prepared and standing below. How they drew back is told at [[Ex. 20:19]], and what was withheld from them afterward at [[Ex. 34:1]].
    sources: [lds-scriptures, jsp-history-c1-addenda-12, hopkin-covenant, thomas-provocation]

  - ref: 12
    phrase: thou shalt set bounds unto the people
    kind: history
    title: A fenced mountain
    body: |
      The boundary marks the mountain as holy ground, and one reading finds in it the degrees of nearness that the tabernacle will have. Its first lesson is that Israel is “not to treat sacred space casually.” When the covenant is made, the people stay at the foot of the mount, a chosen company goes up and worships “afar off,” and “Moses alone shall come near the LORD” ([[Ex. 24:1–2]]).

      One study counts “the three districts of holiness common to each” among the ways the tabernacle works as “a portable Sinai.” In its comparison the fence around the mountain answers to the court, the limited group that went part of the way up answers to the priests in the holy place, and Moses at the top answers to the high priest in the most holy place. That is a reading of the narrative and not something the chapter says. The tabernacle is explained at [[Ex. 25:8]].

      The penalty is death, and the next verse says how it was to be carried out. “There shall not an hand touch it” can be taken of the trespasser instead of the mountain. On one older reading, “no one was to follow him within the appointed boundaries, but he was to be killed from a distance either by stones or darts.” The same reading says what the fence was for: “to awaken in the people a consciousness of their own unholiness quite as much as of the unapproachable holiness of Jehovah.”
    sources: [belnap-skinner-sinai, morales-tabernacle, keil-exodus, lds-scriptures]

  - ref: 13
    phrase: whether it be beast or man, it shall not live
    kind: christ
    title: The mount that might be touched, and mount Sion
    body: |
      Hebrews quotes this verse to set Sinai beside what believers come to through Jesus Christ. “Ye are not come unto the mount that might be touched, and that burned with fire” ([[Heb. 12:18]]). The writer recalls the rule about the animals, “if so much as a beast touch the mountain, it shall be stoned, or thrust through with a dart” ([[Heb. 12:20]]), and then turns: “But ye are come unto mount Sion, and unto the city of the living God, the heavenly Jerusalem” ([[Heb. 12:22]]), to “the general assembly and church of the firstborn” ([[Heb. 12:23]]), and to “Jesus the mediator of the new covenant” ([[Heb. 12:24]]).

      The writer of Hebrews seems to take what the people did next ([[Ex. 20:18–21]]) as Israel’s “refusal of God’s invitation to enter into his presence.” The passage closes with a warning drawn from this mountain: “See that ye refuse not him that speaketh” ([[Heb. 12:25]]).
    sources: [lds-scriptures, belnap-skinner-sinai]

  - ref: 13
    phrase: when the trumpet soundeth long, they shall come up to the mount
    kind: scripture
    title: Told to come up, then kept back
    body: |
      The people are told here that they will come up the mountain, and before the chapter ends they are kept back, and the chapter gives no reason. The long blast of the ram’s horn was to be the signal. Until it sounded the mount was closed, and when it sounded “they shall come up.” On the third day the horn sounds and the people stand at the foot of the mount, yet only Moses is called, and he is sent down to warn them “lest they break through unto the LORD to gaze” (verse 21).

      Apparently the people “were not fully ready to come up ‘in the sight’ of the Lord on the mount where Moses was.” How they drew back is told at [[Ex. 20:19]].

      The ancient Greek translation has a different sentence in this verse: “when the voices and trumpets and cloud depart from off the mountain, they shall come up on the mountain.” On that wording the ascent comes after the manifestation is over. The King James follows the Hebrew, in which the horn is the summons.
    sources: [belnap-skinner-sinai, ot-manual-ex-11-19, lxx-rahlfs, bdb, lds-scriptures]

  - ref: 14
    phrase: they washed their clothes
    kind: history
    title: Washing and abstaining before meeting God
    body: |
      Washing and abstinence were ways of approaching holy ground, as taking off his shoes had been for Moses at the bush. The people, “like Moses, who was required to remove his shoes in the first theophany” (a theophany is an appearance of God), must make “gestures of approach.” “The washing of clothes clearly represents the removal of impurities and contaminations.”

      The command of verse 15 is to abstain from sexual relations for the three days, and several reasons have been suggested. “Many ancient religions used sexual rites” to ask their gods for fertility, while “the God of Israel unequivocally separated sex and worship.” Another is that bodily emissions were held to leave a person for a time “ceremonially unclean.” Besides, “temporary celibacy for worshippers was common in the ancient world.” The command carries no judgment against marriage. It “does not imply that sex was sinful for Israelites,” “any more than eating is sinful because people sometimes fast for religious reasons.”

      The risen Christ uses washed clothing for those who come into God’s presence: “nothing entereth into his rest save it be those who have washed their garments in my blood” ([[3 Ne. 27:19]]). The setting there is not Sinai, yet the requirement is “similar to the original Sinaitic instruction to wash one’s clothes in preparation for the theophany.”
    sources: [hardison-theophany, belnap-skinner-sinai, lds-scriptures]

  - ref: 16
    phrase: the voice of the trumpet exceeding loud
    kind: symbol
    title: The horn no one is said to blow
    body: |
      The text names no one who sounds this horn; it announces that the LORD is arriving. One reading is that “It is not Moses or any Israelite”; another leaves it open, since the source, “whether human or heavenly, is not made clear.”

      The instrument is the *shofar*, a “curved horn, as of cow or ram.” Israel blew it “to call to war,” “to warn of an approaching enemy,” “to celebrate the coronation of the king,” and “to praise the Lord.” At Sinai it is a herald: “The Lord’s presence was being heralded.” The New Testament has a trumpet from heaven do the same at the Lord’s coming: “the Lord himself shall descend from heaven with a shout, with the voice of the archangel, and with the trump of God” ([[1 Thes. 4:16]]).
    sources: [hardison-theophany, belnap-skinner-sinai, bdb, lds-scriptures]

  - ref: 18
    phrase: the LORD descended upon it in fire
    kind: symbol
    title: Fire that shows and smoke that hides
    body: |
      Fire and cloud come together on the mountain, and the one seems to show that the LORD is there while the other hides Him. There seem to be “four elements associated with the divine presence” in these verses, “smoke, light, thunder, and quaking,” and the smoke, “which would hide the personage of God,” seems the chief of them. The two belong together: “it seems to be the fire of the Lord’s presence that causes the smoke—as actual fire does—and in this way, the very light which reveals God also causes the element which hides him.”

      Moses remembers the day that way: “the mountain burned with fire unto the midst of heaven, with darkness, clouds, and thick darkness. And the LORD spake unto you out of the midst of the fire: ye heard the voice of the words, but saw no similitude; only ye heard a voice” ([[Deut. 4:11–12]]).

      What the people received was a voice, and the LORD had said beforehand why He would come in a cloud: “that the people may hear when I speak with thee, and believe thee for ever” (verse 9). The day has been called “the only instance in the Old Testament where the gathered community is confronted with such a direct experience of God, hearing God speak without an intermediary.” The pillar of cloud and fire that led Israel here is treated at [[Ex. 13:21]], and the glory of the LORD on the mount at [[Ex. 24:16]].
    sources: [muhlestein-theophanies, hardison-theophany, lds-scriptures]

  - ref: 22
    phrase: the priests also, which come near to the LORD
    kind: history
    title: Priests before Aaron
    body: |
      Who these priests were the text does not say, and Aaron and his sons have not yet been called to the priest’s office ([[Ex. 28:1]]). One older reading holds that they were neither Aaron’s sons nor the firstborn, but “those who had hitherto discharged the duties of the priestly office according to natural right and custom.” Whoever they were, the warning reaches them too. Those whose work is to come near must sanctify themselves, and they stay below with the people (verse 24). The priesthood Moses held is taken up at [[Ex. 2:18]].
    sources: [keil-exodus, lds-scriptures]

christ: |
  The LORD who comes down on Sinai is Jehovah (see [[Ex. 3:14]]), and the New Testament reads the chapter with Jesus Christ in view.

  Hebrews sets the fenced mountain beside mount Sion and ends its list of what believers have come to with Jesus, “the mediator of the new covenant” (see the note on verse 13). Peter gives the titles of verses 5–6 to those who believe in Christ (see the note on verse 6) and says what their priestly work is: “to offer up spiritual sacrifices, acceptable to God by Jesus Christ” ([[1 Pet. 2:5]]).

  Revelation, in words close to those of verse 6, names the one who makes a people into priests. Jesus Christ “loved us, and washed us from our sins in his own blood, And hath made us kings and priests unto God and his Father” ([[Rev. 1:5–6]]). At Sinai the people washed their clothes to meet the LORD; the risen Lord speaks of garments washed in His blood, a likeness taken up in the note on verse 14.

explore: |
  - **Moses tells it again.** [[Deut. 4:10–13]] and [[Deut. 5:2–5]], the day at Horeb as he recalled it for the generation that would enter the land.
  - **The covenant made.** [[Ex. 24:1–11]], where the people answer a second time, the blood of the covenant is sprinkled, and a company goes up the mountain.
  - **What Israel drew back from.** [[Ex. 20:18–21]] with [[D&C 84:19–27]]; the full account is at [[Ex. 34:1]].
  - **The promise taken up.** [[1 Pet. 2:5–10]] and [[Rev. 1:5–6]].
  - **Sinai and Sion.** [[Heb. 12:18–29]].
  - **A study of the whole.** “The Promise and the Provocation: The Sinai Narrative” (Religious Studies Center, 2021) follows chapters 19–34 from the promise through the people’s refusal to the covenant renewed.

