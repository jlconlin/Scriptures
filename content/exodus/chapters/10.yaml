chapter: 10
title: Locusts and Darkness
tagline: The eighth and ninth plagues strip Egypt of its last green thing and then of its light, while Pharaoh bargains over who may go and what may be taken, and at last forbids Moses to come before him again.
when: 'During the plagues: the eighth and the ninth, before the first Passover'

setting: |
  Seven plagues have fallen. The hail of chapter 9 beat down the flax and the barley and left the wheat and the “rie,” which “were not grown up” ([[Ex. 9:31–32]]). Chapter 10 tells of the two plagues that follow, the locusts and the darkness, and of the last bargaining between Pharaoh and Moses. Only the death of the firstborn remains, announced in chapter 11.

  One proposal about the season is that the hail, the locusts and the darkness “are all linked to seasonal winds occurring from February to April,” so that the whole series ends in the spring, at the time of the Passover. The chapter itself gives no date.

  Three times the chapter says that the LORD hardened Pharaoh’s heart (verses 1, 20, 27). In the Joseph Smith Translation, printed in the footnotes to those verses, Pharaoh hardens his own heart; the question is treated once, at [[Ex. 4:21]]. What the plagues were for is taken up at [[Ex. 7:5]], and why Israel in Goshen is spared at [[Ex. 8:22]].

  Later scripture comes back to these two plagues. The psalms that retell the Exodus name both ([[Ps. 78:46]]; [[Ps. 105:28]], [[Ps. 105:34]]), and in the Book of Mormon the prophet Abinadi warns King Noah’s people of hail, an east wind and devouring insects ([[Mosiah 12:6]]).

thread: |
  The chapter opens with a question put to Pharaoh, **“How long wilt thou refuse to humble thyself before me?”** (verse 3), and everything after it is his answer, given a piece at a time.

  His own servants now ask the same “How long,” but of him: “knowest thou not yet that Egypt is destroyed?” (verse 7). So he bargains. Before the locusts he will let the men go and keep the children. After the darkness he will let the children go and keep the herds. Between the two he confesses, “I have sinned against the LORD your God, and against you” (verse 16), and asks to be forgiven “only this once.” When the locusts are gone, nothing changes. Moses’s terms do not move either: young and old, sons and daughters, flocks and herds, and at the end “there shall not an hoof be left behind” (verse 26).

  On one reading, the two plagues strike what Egypt held its king responsible for: the harvest and the light of the sun (see the notes on verses 5 and 21). The locusts eat the harvest and the darkness hides the sun, and both times Pharaoh sends for Moses.

  The Lord gives one more reason for all of it in verse 2, and it looks past Egypt: these signs are to be told to Israel’s children and grandchildren, “that ye may know how that I am the LORD.” The chapter ends with the talking over. Pharaoh will not see Moses again, and Moses agrees.

sections:
  - range: 1-6
    heading: '“How long wilt thou refuse?”'
    plain: |
      The LORD said to Moses, “Go in to Pharaoh. I have hardened his heart and the hearts of his servants so that I may show these signs of Mine before him, and so that you may tell your son and your grandson what I have done in Egypt and the signs I have set among them, and so that you may all know that I am the LORD.” Moses and Aaron went in and said to Pharaoh, “This is what the LORD, the God of the Hebrews, says: How long will you refuse to humble yourself before Me? Let My people go so that they may serve Me. If you refuse, tomorrow I will bring locusts into your country. They will cover the ground until it cannot be seen. They will eat what little the hail left you and every tree growing in your fields. They will fill your houses, your servants’ houses and every house in Egypt, something neither your fathers nor their fathers ever saw, from the day they came to be on the earth until now.” Then Moses turned and went out.
  - range: 7-11
    heading: 'Who shall go?'
    plain: |
      Pharaoh’s servants said to him, “How long will this man be a trap for us? Let the people go and serve the LORD their God. Do you not yet see that Egypt is ruined?” So Moses and Aaron were brought back, and Pharaoh said, “Go, serve the LORD your God. But who exactly will be going?” Moses said, “We will go with our young and our old, with our sons and daughters, with our flocks and herds, because we must hold a feast to the LORD.” Pharaoh said, “The LORD be with you indeed, if I ever let you go with your little ones! Look, you are up to no good. No. Let the men go and serve the LORD, since that is what you asked for.” And they were driven out of Pharaoh’s presence.
  - range: 12-20
    heading: The locusts
    plain: |
      The LORD said to Moses, “Stretch out your hand over Egypt for the locusts, so that they come up over the land and eat every plant the hail left.” Moses stretched out his rod, and the LORD brought an east wind over the land all that day and all that night. In the morning the east wind had brought the locusts. They came up over the whole land and settled in every part of Egypt, in swarms so heavy that there had never been the like before and never would be again. They covered the ground until the land was dark. They ate every plant and all the fruit of the trees that the hail had left, and nothing green remained on tree or plant in all Egypt. Pharaoh sent for Moses and Aaron in haste and said, “I have sinned against the LORD your God and against you. Forgive my sin just this once, and pray to the LORD your God to take this deadly plague away from me.” Moses went out and prayed to the LORD. The LORD turned the wind into a very strong west wind, which lifted the locusts and drove them into the Red Sea. Not one locust was left in all Egypt. But the LORD hardened Pharaoh’s heart, and he would not let the children of Israel go.
  - range: 21-23
    heading: Darkness that may be felt
    plain: |
      The LORD said to Moses, “Stretch out your hand toward heaven so that there will be darkness over Egypt, darkness that can be felt.” Moses stretched out his hand toward heaven, and there was thick darkness in all the land of Egypt for three days. People could not see one another, and for three days no one got up from where he was. But all the children of Israel had light where they lived.
  - range: 24-29
    heading: 'Not a hoof left behind'
    plain: |
      Pharaoh called Moses and said, “Go, serve the LORD. Your little ones may go with you too. Only your flocks and herds must remain behind.” Moses said, “You must also let us have sacrifices and burnt offerings to offer to the LORD our God. Our livestock will go with us. Not a hoof will be left behind, because we must take from them to serve the LORD our God, and we will not know what we need for serving the LORD until we get there.” But the LORD hardened Pharaoh’s heart, and he would not let them go. Pharaoh said to him, “Get away from me. Take care that you never see my face again, for on the day you see my face you will die.” Moses said, “As you have said. I will not see your face again.”

notes:
  - ref: 2
    phrase: tell in the ears of thy son, and of thy son’s son
    kind: scripture
    title: Signs meant to be retold
    body: |
      Verse 2 adds a second purpose to the plagues: beyond what Egypt is to learn ([[Ex. 7:5]]), they are a story Israel is to hand down. The command is given to Moses, who is addressed “as the representative of the nation,” and the verse ends in the plural: “that ye may know how that I am the LORD.”

      The instruction comes before the Passover is given, and it is of a piece with what that feast will require, where a child’s question is expected and a parent’s answer is supplied ([[Ex. 12:26]]; [[Ex. 13:8]]). One older reading points to Psalms 78 and 105 as showing “in what manner the Israelites narrated these signs to their children and children’s children.” Psalm 78 opens with exactly that duty, “that the generation to come might know them, even the children which should be born; who should arise and declare them to their children” ([[Ps. 78:6]]), and then tells the plagues, the locusts among them ([[Ps. 78:46]]).
    sources: [keil-exodus, cambridge-exodus]
  - ref: 2
    phrase: what things I have wrought in Egypt
    kind: words
    title: '“Wrought” is a mild word for the Hebrew'
    body: |
      The Hebrew verb behind “wrought” is sharper than the King James suggests. In this form it means to busy or divert oneself with someone; the clause has been rendered “how I … have made a toy of Egypt,” and the verb is used especially for dealing “wantonly, ruthlessly with” a person.

      Modern translations divide between the two senses. One has “how I have made fools of the Egyptians”; another, “how I dealt harshly” with them. The King James softens the same verb again where the Philistine priests speak of Egypt and Pharaoh: “when he had wrought wonderfully among them, did they not let the people go” ([[1 Sam. 6:6]]).

      Which shade is meant here cannot be settled from the word alone. On either rendering, the verb says how the LORD dealt with Egypt, and not only that He did something there.
    sources: [bdb, nrsvue, niv]
  - ref: 5
    phrase: which remaineth unto you from the hail
    kind: history
    title: The locusts finish what the hail began
    body: |
      The eighth plague is aimed at what the seventh left standing, and the chapter says so three times (verses 5, 12, 15). The hail had ruined the flax and the barley, but the wheat and the “rie” “were not smitten” ([[Ex. 9:31–32]]). What the hail left the locusts take, with the fruit of the trees, until “there remained not any green thing.” The two can be read as one blow: “the damage done to the crops by the hail is compounded by the damage wrought thereafter by the locusts.”

      Why the crops? One reading starts from what Egypt claimed for its king. Pharaoh “was supposed to be able to ensure a good harvest and prevent such calamities,” and Egyptian writing “consistently and abundantly describes the king’s ability to bring forth crops abundantly.” By that measure, “a ravaged crop was a sign of a weak king.” This is a proposal about how the plague would have been understood in Egypt; the text’s own emphasis is that nothing like it had been seen before (verses 6, 14), though locusts were “a commonly known pest in the ancient Near East.”

      Pharaoh’s servants draw the conclusion before the locusts come: “knowest thou not yet that Egypt is destroyed?” (verse 7).
    sources: [muhlestein-pharaoh, sc-knowhy-631]
  - ref: 10
    phrase: Let the LORD be so with you, as I will let you go
    kind: words
    title: Pharaoh’s blessing is a taunt
    body: |
      Pharaoh’s words sound like a blessing in the King James Version, and they are a refusal. The Church’s footnotes give “if” as another rendering of “as,” and explain “evil is before you” as an idiom for being “bent on mischief.” Modern translations make the tone plain: “The LORD indeed will be with you, if ever I let your little ones go with you!” and “Clearly you are bent on evil.” The paraphrase above follows that sense.

      He then grants the request in its narrowest form. The men may go and serve the LORD, “for that ye did desire,” and Moses and Aaron are driven out.
    sources: [lds-scriptures, nrsvue, niv]
  - ref: 13
    phrase: the LORD brought an east wind upon the land
    kind: history
    title: The east wind and the sea wind
    body: |
      The locusts come on one wind and leave on another, the first after Moses stretches out his rod and the second after he prays. The account fits the habits of the insect: locusts “breed in east Sudan and move north along the Red Sea,” and “an east (or southeast) wind would blow them into the Nile Valley, and then a ‘sea wind’ (from the north or northwest) would clear them out.” The “west wind” of verse 19 is in Hebrew a wind of the sea: the word for the sea also names the west, “from position of Mediterranean with reference to Palestine.”

      What the chapter marks as the LORD’s doing is the timing and the completeness. The plague is announced for “to morrow” (verse 4), the LORD brings the wind when Moses stretches out his rod, the swarm is beyond anything before or after it, and when it goes “there remained not one locust in all the coasts of Egypt.” (On the name of the sea into which they are driven, see [[Ex. 13:18]].)

      An east wind carries a meaning of its own in scripture, where it was “viewed as an instrument of God’s judgment.” The phrase could be used of any hot, withering wind, “regardless of which direction it came from.” Abinadi’s warning to the people of King Noah is “couched in language reminiscent of the Egyptian plagues”: “they shall also be smitten with the east wind; and insects shall pester their land also, and devour their grain” ([[Mosiah 12:6]]).
    sources: [sc-knowhy-631, sc-knowhy-560, bdb]
  - ref: 21
    phrase: even darkness which may be felt
    kind: history
    title: Darkness over the land of the sun
    body: |
      The ninth plague puts out the sun, which in Egypt was bound up with the king himself. It comes with no audience and no warning; the LORD speaks to Moses and Moses lifts his hand. The sun “was among the greatest objects of Egyptian worship,” and Pharaoh was held to be “both the son of Re and Re himself” (Re being the sun god). He “was seen as being directly responsible for Egypt receiving sunlight.” On this reading the darkness “may be the most direct attack against Pharaoh’s ability to fulfill his royal duties”: for three days the land’s light is not his to give.

      A natural means has been proposed. Hot southern winds “blow in sand from the Sahara Desert in March and April,” and a great storm “can completely darken the sky for days at a time.” The text names no means. What it stresses is that the darkness came when Moses stretched out his hand, that it held all Egypt in place for three days, and that “all the children of Israel had light in their dwellings” (verse 23; on Israel set apart, see [[Ex. 8:22]]).

      The darkness has also been read as a sign of what is next: “Darkness in the scriptures often presages death,” and this plague “was a warning of the final plague,” the death of the firstborn.
    sources: [muhlestein-pharaoh, sc-knowhy-631, ot-minute-ex-7]
  - ref: 26
    phrase: there shall not an hoof be left behind
    kind: history
    title: Pharaoh’s offers, and why Moses takes none
    body: |
      Each offer Pharaoh makes in the course of the plagues keeps something back, and Moses refuses this last one because the herds are what Israel will worship with. After the flies he says, “Go ye, sacrifice to your God in the land” ([[Ex. 8:25]]), and then allows the wilderness, “only ye shall not go very far away” ([[Ex. 8:28]]). In this chapter he will let the men go without the children (verse 11), and then the people without their flocks and herds, which are to “be stayed,” that is, to remain behind (verse 24).

      Moses’s answer to the last offer gives two reasons. The animals are the worship: sacrifices and burnt offerings cannot be made without them, so the livestock “were necessary in their sacrificial ceremonies.” And Israel cannot choose beforehand which to bring, because “we know not with what we must serve the LORD, until we come thither.” What the LORD will require has not yet been told them, so nothing can be left.

      After the last plague Pharaoh grants what he refuses here, in Moses’s own terms: “Also take your flocks and your herds, as ye have said, and be gone; and bless me also” ([[Ex. 12:32]]).
    sources: [ot-minute-ex-7, lds-scriptures]
  - ref: 29
    phrase: I will see thy face again no more
    kind: history
    title: The last audience runs on into chapter 11
    body: |
      Moses accepts Pharaoh’s dismissal, yet the next chapter has him still speaking to the king. To “see my face” is to “be admitted to my presence,” and Moses’s reply is assent, not praise: the Hebrew is “As you have spoken.” But [[Ex. 11:4–8]] is a speech of Moses to Pharaoh announcing the death of the firstborn, and it ends, “And he went out from Pharaoh in a great anger” ([[Ex. 11:8]]).

      One older reading takes the two passages as a single scene. Moses’s words in chapter 11 form “the continuation of his brief answer in Exodus 10:29,” and the LORD’s word to Moses in [[Ex. 11:1–3]] is something told him “before the last interview,” set down there because it explains “the confidence with which Moses answered Pharaoh.” On that reading Moses can agree never to come again because he already knows that one more plague will end the matter, and his answer may itself be “an advance warning of the tenth and final deadly plague.”

      The text does not say this in so many words.
    sources: [keil-exodus, cambridge-exodus, ot-minute-ex-7, lds-scriptures]

christ: |
  The LORD of this chapter, who is Jehovah ([[Ex. 3:14]]), asks a king to humble himself, takes away the locusts when that king’s plea is carried to Him, and keeps light in the dwellings of His people while Egypt sits in the dark. One older reading sees the last of these as a figure: “The darkness which covered the Egyptians, and the light which shone upon the Israelites, were types of the wrath and grace of God.”

  The Church’s footnote at “felt” (verse 21) sends the reader to the Book of Mormon, where a darkness of three days is the sign of the Savior’s death. The prophet Zenos, as Nephi quotes him, spoke of “the three days of darkness, which should be a sign given of his death” ([[1 Ne. 19:10]]), and when it came, “there was thick darkness upon all the face of the land, insomuch that the inhabitants thereof who had not fallen could feel the vapor of darkness” ([[3 Ne. 8:20]]).

explore: |
  - **The plagues as Israel sang them.** Read [[Ps. 78:42–51]] and [[Ps. 105:26–36]] beside chapters 7–11.
  - **Another locust plague to be told to the children.** [[Joel 1:2–4]] and [[Joel 2:1–11]].
  - **The east wind.** It returns at the sea ([[Ex. 14:21]]), and in the Book of Mormon at [[Mosiah 7:31]].
  - **The end of the audience.** Read on through [[Ex. 11:4–8]].

parallels:
  - ref: Mosiah 12:6
    note: Abinadi warns King Noah’s people of hail, an east wind, and insects that devour their grain.
  - ref: 3 Ne. 8:20
    note: A thick darkness that could be felt, lasting three days, at the death of the Savior.

sources: [muhlestein-pharaoh, sc-knowhy-631, sc-knowhy-560, ot-minute-ex-7, keil-exodus, cambridge-exodus, bdb, nrsvue, niv, lds-scriptures]
