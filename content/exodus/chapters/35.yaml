chapter: 35
title: A Willing Offering
tagline: Moses gathers Israel and passes on what the LORD commanded on the mount, beginning with the Sabbath. The people bring their gold, their cloth, and their skill for the tabernacle, each as the heart moves, and Moses presents the two builders the LORD has called.
when: 'After Moses came down from Sinai with the second tables (34:29), in the first year after the departure from Egypt. The tabernacle was set up on the first day of the second year (40:17).'

setting: |
  Moses has come down from Mount Sinai with the second tables, his face shining from speaking with the LORD ([[Ex. 34:29]]). The covenant broken at the golden calf has been made again (see [[Ex. 34:10]]). Now he gathers “all the congregation” and gives them what he was given during his forty days on the mount: the command to build a sanctuary in which the LORD would dwell among them (see [[Ex. 25:8]]).

  The people are still camped at Sinai, where they arrived in the third month after leaving Egypt ([[Ex. 19:1]]). The book dates the end of the work that begins here: the tabernacle was set up “in the first month in the second year, on the first day of the month” ([[Ex. 40:17]]).

  This chapter opens the last part of Exodus, six chapters that tell one thing: the people give the materials, skilled workers make each part, and when the tabernacle is finished the glory of the LORD fills it. The giving and the calling of the workers are told here, and both run on into the first verses of chapter 36.

thread: |
  In this chapter what the LORD commanded on the mount begins to be done. Chapters 25–31 gave the instructions, and chapters 35–40 tell “how the people then fulfilled the command.” The two accounts run parallel because Moses built from the revelation. In one older reading the second account is, in the main, the first “repeated verbatim,” “with the simple substitution of past tenses for future.” The order is different. The instructions began with the ark ([[Ex. 25:10]]). The making begins with the curtains and boards of the building (chapter 36), goes on to the furniture and the court (chapters 37–38), and comes to the priests’ garments last (chapter 39). Each furnishing and garment is explained where it is commanded. For the materials listed in this chapter and the King James names for them, see [[Ex. 25:5]]; for the sanctuary itself, [[Ex. 25:8]].

  Between the command and the making stand three chapters: the golden calf, Moses’s pleading, and the covenant renewed (chapters 32–34). Moses speaks here, in one older reading’s phrase, “after the restoration of the covenant.” The calf was made while Moses was on the mount receiving the revelation he now delivers. Yet “despite their other faults and failings,” “when Israel heard what the Lord asked, they responded with joyous liberality.” It was “one command they fulfilled to overflowing” (see [[Ex. 36:5–7]]).

  The chapter has four parts: the Sabbath (verses 1–3), the call for gifts and for workers (4–19), the people’s response (20–29), and the two builders (30–35). The verses of the response keep naming the heart: a willing heart, a heart stirred up, a wise heart.

sections:
  - range: 1-3
    heading: The Sabbath first
    plain: |
      Moses gathered the whole congregation of Israel and said, “These are the things the LORD has commanded you to do. Work is to be done for six days, but the seventh day is to be holy to you, a sabbath of rest to the LORD. Whoever does work on it shall be put to death. You shall not kindle a fire in any of your dwellings on the sabbath day.”
  - range: 4-19
    heading: What to bring and what to make
    plain: |
      Moses told them what the LORD had commanded. “Take from among you an offering for the LORD. Let everyone whose heart is willing bring it: gold, silver, and bronze; blue, purple, and scarlet yarn, fine linen, and goats’ hair; rams’ skins dyed red, fine leather, and acacia wood; oil for the lamp, and spices for the anointing oil and the incense; onyx and other stones to be set in the ephod and the breastplate.

      “And let everyone among you who is skilled come and make all that the LORD has commanded: the tabernacle with its tent and its covering, its hooks, boards, bars, pillars, and sockets; the ark and its poles, the mercy seat, and the veil that screens it; the table with its poles and utensils, and the shewbread; the lampstand with its utensils and lamps, and the oil for the light; the altar of incense and its poles, the anointing oil, the incense, and the screen for the door of the tabernacle; the altar of burnt offering with its bronze grate, its poles, and its utensils; the laver and its base; the hangings of the court with their pillars and sockets, and the screen for the gate of the court; the pegs of the tabernacle and of the court, and their cords; the garments for ministering in the holy place, and the holy garments for Aaron the priest and for his sons.”
  - range: 20-29
    heading: The people bring their gifts
    plain: |
      The congregation went out from Moses. Then they came back, everyone whose heart stirred him and whose spirit made him willing, and brought the LORD’s offering for the work of the tent of meeting, for its service, and for the holy garments.

      Men and women came alike. All who were willing brought gold jewelry of every kind, each one presenting an offering of gold to the LORD. Whoever had blue, purple, or scarlet yarn, fine linen, goats’ hair, red rams’ skins, or fine leather brought them. Whoever could give silver or bronze brought it, and whoever had acacia wood that the work could use brought that.

      The skilled women spun with their own hands and brought what they had spun: blue, purple, and scarlet yarn, and fine linen. The women whose hearts moved them to use their skill spun the goats’ hair. The leaders brought the onyx and the stones for the ephod and the breastplate, and the spices and oil for the light, the anointing oil, and the incense.

      So the children of Israel brought a freewill offering to the LORD, every man and woman whose heart made them willing to bring something for the work the LORD had commanded through Moses.
  - range: 30-35
    heading: Bezaleel and Aholiab
    plain: |
      Moses said to the people, “See, the LORD has called by name Bezaleel the son of Uri, the son of Hur, of the tribe of Judah. He has filled him with the spirit of God, with wisdom, understanding, and knowledge in every kind of craft: to make artistic designs, to work in gold, silver, and bronze, to cut and set stones, and to carve wood. He has also put it in his heart to teach, both him and Aholiab the son of Ahisamach, of the tribe of Dan. He has filled them with skill to do every kind of work: the engraver’s, the designer’s, the embroiderer’s in blue, purple, and scarlet yarn and fine linen, and the weaver’s.”

notes:
  - ref: 3
    phrase: Ye shall kindle no fire
    kind: structure
    title: The Sabbath set before the work
    body: |
      Moses’s first word to the gathered people is about the day on which the tabernacle is not to be built. The LORD’s instructions on the mount ended with the Sabbath ([[Ex. 31:12–17]]), and Moses’s delivery of them begins with it. One study counts seven speeches in the account, “with the seventh addressing the Sabbath,” and sees the Sabbath “structurally forming something of an inner frame” in it. Why the Sabbath stands beside the building at all is taken up at [[Ex. 31:13]]. The commandment itself is treated at [[Ex. 20:8]] and the penalty at [[Ex. 31:14]].

      Verse 3 is not in that earlier passage. The Church’s footnote to it points back to the manna, where food for the first Sabbath in the wilderness was to be cooked the day before: “bake that which ye will bake to day, and seethe that ye will seethe” ([[Ex. 16:23]]). Given here, at the head of the building instructions, the rule would cover the fires of the people’s tents and also “the fires needed to forge the gold, silver, and brass for the tabernacle.”
    sources: [morales-tabernacle, ot-minute-ex-25, lds-scriptures]

  - ref: 5
    phrase: whosoever is of a willing heart
    kind: words
    title: A willing heart
    body: |
      The offering for the tabernacle is asked only of those who want to give it, and the chapter says so in more than one way. “Willing” in verses 5 and 22 is a Hebrew adjective meaning “incited, inclined, willing,” and a modern translation has “whoever is of a generous heart.” In verses 21 and 29 the same root is a verb, to “incite, impel.” There the spirit or the heart is what moves the giver; the phrase is, more literally, “whose heart incited.” The gift itself, the “willing offering” of verse 29, is a “freewill” offering, a word used of “gifts used in erection and furnishing of tabernacle.”

      The verb had been used once before, when the LORD first asked for the offering: “of every man that giveth it willingly with his heart ye shall take my offering” ([[Ex. 25:2]]).

      The condition was a real one. “Unless Israel had the right attitude about the sacrifice of their materials, it would do them no good.” That has been explained from Mormon’s teaching about any gift: when it is given grudgingly, “it is counted unto him the same as if he had retained the gift” ([[Moro. 7:8]]). The Church’s footnote to this verse points to a latter-day revelation that speaks in the same terms: “the Lord requireth the heart and a willing mind” ([[D&C 64:34]]).

      The same verb returns when Israel next builds a house for the LORD. It is the verb for those who “offer freewill-offerings for the first temple” in David’s day, of whom Chronicles says, “with perfect heart they offered willingly to the LORD” ([[1 Chr. 29:9]]).
    sources: [bdb, oshb-wlc, nrsvue, ot-manual-ex-25-30, lds-scriptures]

  - ref: 22
    phrase: bracelets, and earrings, and rings, and tablets
    kind: history
    title: The gold the people brought
    body: |
      The first gifts named are the people’s own gold ornaments, the second time at Sinai that they have given up their gold. The first time was for the calf, when Aaron told them, “Break off the golden earrings, which are in the ears of your wives, of your sons, and of your daughters” ([[Ex. 32:2]]). After the calf they took off their ornaments in mourning ([[Ex. 33:6]]), and those ornaments have been linked with this verse, where the people “also gave up their jewelry to contribute it to the building of the future tabernacle.” The text itself draws no comparison between the gift for the calf and this one.

      The King James “tablets” are a piece of jewelry and not something to write on: the Hebrew word is defined only as the “name of a golden ornament,” and a modern translation of the four reads “brooches and earrings and signet rings and pendants.”

      The book has already told of Israel leaving Egypt with “jewels of silver, and jewels of gold” ([[Ex. 12:35]]; see [[Ex. 3:22]]).
    sources: [lds-scriptures, nrsvue, bdb, ot-minute-ex-24]

  - ref: 25
    phrase: all the women that were wise hearted did spin
    kind: history
    title: The women who spun
    body: |
      The yarn for the tabernacle’s cloth was spun by the women of the camp, and the chapter calls them “wise hearted,” its term for skill in a craft. It uses the same words of everyone called to the work in verse 10 and of the craftsmen who work with Bezaleel (see [[Ex. 31:6]]).

      They spun two kinds of thread. One older reading distinguishes the linen and dyed yarn of verse 25 from the “coarser” goats’ hair of verse 26. It notes that in that part of the world, down to its own day, women “still spin camels’ and goats’ hair into the coarse yarn out of which tent-coverings are woven.” That is the use the goats’ hair had here: “thou shalt make curtains of goats’ hair to be a covering upon the tabernacle” ([[Ex. 26:7]]).

      The chapter names the women among the givers as well as the workers: “both men and women” in verse 22, and “every man and woman” in verse 29. They appear once more when the laver is made, from the mirrors of the women who assembled at the door of the tabernacle ([[Ex. 38:8]]).
    sources: [lds-scriptures, cambridge-exodus]

  - ref: 34
    phrase: he hath put in his heart that he may teach
    kind: history
    title: Called to teach as well as to build
    body: |
      Moses presents the two builders in nearly the words the LORD used on the mount, and adds one gift that was not named there: teaching. A modern translation reads, “he has inspired him to teach, both him and Oholiab.” For who the two men were, and what it means that Bezaleel was filled with the spirit of God, see [[Ex. 31:2]] and [[Ex. 31:3]].

      The next chapter shows whom there was to teach: the two work alongside “every wise hearted man, in whom the LORD put wisdom and understanding” ([[Ex. 36:1]]).
    sources: [nrsvue, lds-scriptures]

christ: |
  The gifts of this chapter are “the LORD’s offering,” and the LORD is Jehovah (see [[Ex. 3:14]]). The people give their gold and their work for “a sanctuary where the Lord could dwell among His people.” How the New Testament reads that dwelling in Jesus Christ is told at [[Ex. 25:8]] and at the close of that chapter.

  Temples in this dispensation, like the tabernacle, have been built “through the sacrifice and consecration of the people.” The Saints who built the Kirtland Temple said in its dedicatory prayer whom the house was for: “out of our poverty we have given of our substance to build a house to thy name, that the Son of Man might have a place to manifest himself to his people” ([[D&C 109:5]]).

explore: |
  - **More than enough.** [[Ex. 36:2–7]], where the gifts outrun the need and Moses has to stop them.
  - **The instruction this chapter carries out.** [[Ex. 25:1–9]] for the offering; [[Ex. 31:1–11]] for the builders; [[Ex. 31:12–17]] for the Sabbath.
  - **What became of the gold, silver, and bronze.** [[Ex. 38:24–31]], the sum of the metals given.

