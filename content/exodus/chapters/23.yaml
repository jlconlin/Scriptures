chapter: 23
title: Justice, Rest, and the Angel Sent Before
tagline: The laws given at Sinai end with rules for honest courts, a year and a day of rest, and three feasts. Then the LORD promises an Angel who bears His name to bring Israel into the land.
when: 'The third month after Israel left Egypt (19:1), at Sinai: the last of the judgments the LORD gives Moses on the mountain.'

setting: |
  Israel is camped at Sinai. The people have heard the Ten Commandments and “stood afar off,” and Moses has gone up alone into “the thick darkness where God was” ([[Ex. 20:21]]). What he is given there runs from [[Ex. 20:22]] to the end of this chapter. It is the first collection of laws in the Bible after the Ten Commandments, and in the next chapter Moses writes it down and reads it to the people as “the book of the covenant” ([[Ex. 24:7]]). What kind of law this is, is explained at [[Ex. 21:1]].

  Chapter 23 is the end of that collection, and it looks past the wilderness. Its laws assume fields, vineyards and olive groves, a house of the LORD to which firstfruits are carried, and borders. They were given to hold Israel together as a covenant people “with a view of their eventual entry into the land of promise.”

  Later scripture comes back to the chapter. The law of the three feasts is given again after the golden calf ([[Ex. 34:18–26]]) and in Deuteronomy ([[Deut. 16:16]]). Joshua, recounting how the LORD had led Israel, looks back on the promise of the hornet as one that was kept ([[Josh. 24:12]]). The Angel promised here is spoken of again later in Exodus and in a latter-day revelation ([[D&C 103:19–20]]). The Joseph Smith Translation changes one word, in verse 3.

thread: |
  The chapter finishes what Israel owes and then turns to what the LORD promises.

  Its first nine verses belong with the laws before them, which one Latter-day Saint study gathers under Israel’s “sociality”: they are among the “rules necessary to holding a community together.” Here the subject is the court. A witness must not lie, follow the crowd, or take a gift, and a poor man’s case is to be neither favored nor bent against him. In the middle of these rules stands an enemy’s lost ox and his fallen donkey (verses 4–5): a quarrel is no more a reason to wrong a man than a bribe is. The ninth comes with its reason. The law “strictly forbids mistreatment of society’s weakest members,” and Israel is told why in one clause: “ye know the heart of a stranger.”

  The two laws of rest that follow are worded for the same people. The land rests in the seventh year “that the poor of thy people may eat,” and work stops on the seventh day so that the servant’s son and the stranger “may be refreshed.” In this law, “what was beneficial to the land” also benefits “the poor and the vulnerable.” The Sabbath commandment itself is treated at [[Ex. 20:8]].

  Verse 13 is the turn. On one older reading its warning against the names of other gods is “a very fitting boundary line” between the two series of laws, the judgments before it and the laws of worship after it, since keeping either depended on where Israel stood with the LORD. Three feasts follow (verses 14–19).

  Then the commands give way to promises (verses 20–33): an Angel to lead the way, bread and water blessed, sickness removed, enemies driven out, wide borders. Every one of them hangs on an “if” (verse 22). The collection “closes with an enumeration of blessings,” and all of it “is predicated on obedience.” A latter-day revelation states the rule in a sentence: “I, the Lord, am bound when ye do what I say; but when ye do not what I say, ye have no promise” ([[D&C 82:10]]).

sections:
  - range: 1-9
    heading: Honest courts, and an enemy’s donkey
    plain: |
      Do not spread a false report, and do not join hands with the wicked to be an unrighteous witness. Do not follow the crowd in doing evil, and when you speak in a lawsuit do not side with the majority to bend justice. Do not favor a poor man in his lawsuit either.

      If you come upon your enemy’s ox or donkey wandering off, take it back to him. If you see the donkey of someone who hates you lying under its load, do not walk away and leave him to it. Help him free it.

      Do not bend justice against your poor in his lawsuit. Keep far from a false charge, and do not put the innocent and the righteous to death, for I will not acquit the wicked. Take no gift as a bribe, for a bribe blinds the wise and twists the words of the righteous. Do not oppress a stranger. You know the heart of a stranger, because you were strangers in the land of Egypt.
  - range: 10-13
    heading: The seventh year and the seventh day
    plain: |
      For six years sow your land and gather its crops. In the seventh year let it rest and lie untouched, so that the poor of your people may eat, and what they leave the beasts of the field may eat. Do the same with your vineyard and your olive grove.

      For six days do your work, and on the seventh day rest, so that your ox and your donkey may rest, and the son of your handmaid and the stranger may be refreshed.

      Take heed to everything I have said to you. Do not mention the names of other gods; let them not be heard from your mouth.
  - range: 14-19
    heading: Three feasts in the year
    plain: |
      Three times a year keep a feast to me. Keep the feast of unleavened bread: eat unleavened bread for seven days, as I commanded you, at the appointed time in the month Abib, for in that month you came out of Egypt. No one is to appear before me without an offering. Keep the feast of harvest, the firstfruits of what you have sown in the field. Keep the feast of ingathering at the end of the year, when you gather in your crops from the field. Three times a year all your males are to appear before the Lord GOD.

      Do not offer the blood of my sacrifice with leavened bread, and do not let the fat of my sacrifice remain until morning. Bring the first of the firstfruits of your land into the house of the LORD your God. Do not cook a kid in its mother’s milk.
  - range: 20-26
    heading: An Angel to keep Israel in the way
    plain: |
      I am sending an Angel before you to keep you on the way and to bring you to the place I have prepared. Take heed of him and obey his voice. Do not provoke him, for he will not pardon your transgressions; my name is in him. But if you truly obey his voice and do all that I say, I will be an enemy to your enemies and an adversary to your adversaries.

      My Angel will go before you and bring you to the Amorites, the Hittites, the Perizzites, the Canaanites, the Hivites, and the Jebusites, and I will cut them off. Do not bow down to their gods or serve them or do as those nations do. Overthrow them utterly and break their images in pieces. Serve the LORD your God, and He will bless your bread and your water, and I will take sickness away from among you. None will miscarry or be barren in your land, and I will fill out the number of your days.
  - range: 27-33
    heading: Little by little
    plain: |
      I will send my fear ahead of you and destroy every people you come to, and I will make all your enemies turn their backs to you. I will send hornets ahead of you to drive out the Hivite, the Canaanite, and the Hittite. I will not drive them out in a single year, or the land would become desolate and the wild beasts would multiply against you. Little by little I will drive them out, until you have increased and inherit the land.

      I will set your borders from the Red Sea to the sea of the Philistines, and from the desert to the river Euphrates. I will deliver the inhabitants of the land into your hand, and you will drive them out before you. Make no covenant with them or with their gods. They are not to live in your land, or they will make you sin against me. If you serve their gods, it will surely be a snare to you.

notes:
  - ref: 3
    phrase: countenance a poor man in his cause
    kind: scripture
    title: Not favoring the poor in court, and the JST reading
    body: |
      The verse forbids tilting a lawsuit toward a man because he is poor, and the Joseph Smith Translation changes “poor man” to “wicked man.” To “countenance” is to favor, as the Church’s footnote gives it. As the King James has the verse, it is half of a pair: verse 6 forbids the opposite wrong, to “wrest the judgment of thy poor.” Leviticus puts both halves in one sentence: “thou shalt not respect the person of the poor, nor honour the person of the mighty: but in righteousness shalt thou judge thy neighbour” ([[Lev. 19:15]]).

      One Latter-day Saint study finds the pairing odd as it stands. That “poor” in verse 3 should sit beside “poor” in verse 6 “seems strange,” since the law elsewhere “provides certain protections and perhaps even some privileges to the poor.” The Prophet’s change, the study says, “accords with both Deuteronomy and the Zion theology” of [[Moses 7:18]], where the Lord’s people have “no poor among them.”

      In either wording the verdict is to follow the case and not the standing of the person, and that impartiality, the study says, should produce “the ethic of fairness and equality” a Zion people needs.
    sources: [lds-scriptures, bowen-law-codes]

  - ref: 5
    phrase: thou shalt surely help with him
    kind: words
    title: Helping an enemy with his fallen animal
    body: |
      The verse commands a man to stop and help someone who hates him get an overloaded donkey back on its feet. The King James sentence is hard to follow because the Hebrew uses one verb in two senses. On one older reading the verb is used “in the first instance in the sense of leaving it alone, leaving it in a helpless condition, and immediately afterwards in the sense of undoing or letting loose.” A modern translation makes the same sense of it: “When you see the donkey of one who hates you struggling under its burden and you would hold back from setting it free, you must help to set it free.” Deuteronomy gives the rule again for a “brother’s” animal, in plainer words: “thou shalt surely help him to lift them up again” ([[Deut. 22:4]]).

      The same reading explains why the verse mentions the wish to hold back. Leaving an enemy to manage his own trouble is “the ordinary course, which the natural man adopts,” and the law names the impulse in order to forbid it. It stands among the rules for witnesses and judges because “personal antipathy, enmity, and hatred were not to lead them to injustice or churlish behaviour.”

      Verses like these are why the law of Moses should not be pictured as “a system of fierce retaliation and brutal punishment.” This part of it requires a person to do good to an enemy.
    sources: [keil-exodus, nrsvue, ot-manual-ex-21-24, lds-scriptures]

  - ref: 9
    phrase: ye know the heart of a stranger
    kind: scripture
    title: Israel knows the heart of a stranger
    body: |
      The law against oppressing a stranger rests on what Israel remembers of Egypt. The stranger is “the foreign migrant,” someone from another people living among Israel; a modern translation says “resident alien.” The command and its reason stood a chapter earlier ([[Ex. 22:21]]). Here the LORD adds that Israel knows such a person’s heart from the inside.

      One Latter-day Saint study of the law takes that appeal to memory as the purpose of the clause. The reminder that Israel had lived as strangers in Egypt “helped them to recognize their obligation to care for their society’s weakest members and to do so with sympathy.” The same study sets the stranger beside the widow, the orphan and the poor of these chapters as the people the law most protects, and it says that Israel could not be the LORD’s own people “if they treated others unethically and abused the weakest among them.”
    sources: [bowen-law-codes, nrsvue, lds-scriptures]

  - ref: 11
    phrase: the seventh year thou shalt let it rest and lie still
    kind: history
    title: The seventh year, a sabbath for the land
    body: |
      Every seventh year the fields, vineyards and olive groves were to be left unworked, and what grew of itself belonged to the poor and to the animals. As the seventh day was holy, so every seventh year was consecrated to the Lord: the land was His, and it was to keep a sabbath to Him. Leviticus gives the law at length and calls the year “a sabbath of rest unto the land” ([[Lev. 25:4]]). It also asks the question any farmer would: “What shall we eat the seventh year?” ([[Lev. 25:20]]). The answer is a promise: “I will command my blessing upon you in the sixth year” ([[Lev. 25:21]]).

      Exodus states the purpose in a clause, “that the poor of thy people may eat.” Deuteronomy adds a release of debts in the same year, and the two laws have one aim: “Both the year of the land Sabbath and the year of the Lord’s release provided for the poor.”

      The law was not kept. For a long period before the Babylonian exile it was habitually broken, and the seventy years of exile were regarded as making up for the sabbaths the land had missed. The Chronicler says that Judah lay desolate “until the land had enjoyed her sabbaths” ([[2 Chr. 36:21]]).
    sources: [bd-sabbatical-year, bowen-law-codes, lds-scriptures]

  - ref: 14
    phrase: Three times thou shalt keep a feast unto me in the year
    kind: history
    title: The three feasts
    body: |
      The three feasts are Unleavened Bread in the spring, Harvest fifty days later, and Ingathering in the autumn; they are better known as Passover, Pentecost, and Tabernacles. The Hebrew word for such a feast, *ḥag*, means a “feast, especially one observed by a pilgrimage.” These are journeys: three times a year the men of Israel were to “appear before the Lord GOD” (verse 17), “in the place which he shall choose,” as Deuteronomy adds ([[Deut. 16:16]]).

      Only the first is tied here to Israel’s history, “for in it thou camest out from Egypt.” It is the feast that began with the Passover, explained in chapter 12 (see [[Ex. 12:14]]). The other two are named for the farm year. The feast of harvest came as the wheat harvest was being gathered; Deuteronomy calls it “the feast of weeks,” and the New Testament knows it as Pentecost. The feast of ingathering is the Feast of Tabernacles, kept in the seventh month. It celebrated the gathering of the whole year’s produce and, as Leviticus adds, Israel’s sojourn in the wilderness, and later generations counted it the greatest and most joyful of the feasts. Verse 16 sets it at “the end of the year,” though it falls in the seventh month counted from Abib. The two ways of counting the year are explained at [[Ex. 12:2]].

      No one came with nothing in his hands. “Empty” in verse 15 means “without offerings,” and Deuteronomy sets the measure: “Every man shall give as he is able” ([[Deut. 16:17]]).

      A law that sends every man away from home three times a year assumes a country at peace, and this one “presupposed a state of settled peace rarely if ever realized” in Old Testament times. It could not be kept often, and it was not; Elkanah, a devout man in the days of the judges, went up to Shiloh once a year. When the feasts are commanded again, a promise comes with them: “neither shall any man desire thy land, when thou shalt go up to appear before the LORD thy God thrice in the year” ([[Ex. 34:24]]).

      What it meant to “appear before” God is taken up at [[Ps. 42:2]].
    sources: [bd-feasts, bdb, lds-scriptures]

  - ref: 19
    phrase: Thou shalt not seethe a kid in his mother’s milk
    kind: history
    title: A kid boiled in its mother’s milk
    body: |
      The law forbids cooking a young goat in the milk of its own mother, and it gives no reason. To “seethe” is to boil. The command is repeated word for word when the feasts are given again ([[Ex. 34:26]]) and once more among the food laws of Deuteronomy ([[Deut. 14:21]]), so it mattered, but none of the three places explains it.

      The Church’s footnote takes it as a rite of the religions around Israel: “Israel must not do such fertility-cult practices.” An older commentary reasons the same way from where the law stands. Set beside rules for sacrifice and firstfruits, it will have had “a religious motive,” and most have supposed it aimed “against some superstitious custom,” perhaps the use of such milk as “a charm for rendering fields and orchards more productive.”

      Another older reading gives a different reason. Kid cooked in milk was probably an ordinary dish, and on this reading to cook the animal in its own mother’s milk showed “a contempt of the relation which God has established and sanctified between parent and young.” Jewish tradition took the verse more broadly still, “as a general prohibition against eating flesh prepared with milk.”

      The text itself names no reason, and the older readings are proposals. What it supplies is the company the law keeps: it stands with the feasts and the firstfruits here, and with the laws of clean and unclean food in Deuteronomy.
    sources: [lds-scriptures, cambridge-exodus, keil-exodus]

  - ref: 20
    phrase: I send an Angel before thee
    kind: scripture
    title: The Angel and the presence of the LORD
    body: |
      Later in Exodus, and in a latter-day revelation, an angel going before Israel is set apart from the LORD’s own presence among them. After the golden calf the promise of this verse is repeated: “mine Angel shall go before thee” ([[Ex. 32:34]]). The next chapter says what Israel has lost with it. “And I will send an angel before thee” ([[Ex. 33:2]]), the LORD says, but “I will not go up in the midst of thee; for thou art a stiffnecked people: lest I consume thee in the way” ([[Ex. 33:3]]). Then the LORD says, “My presence shall go with thee, and I will give thee rest” ([[Ex. 33:14]]), and Moses holds to that word: “If thy presence go not with me, carry us not up hence” ([[Ex. 33:15]]).

      A revelation to Joseph Smith draws the same line when it promises the Saints more than their fathers had: “I say not unto you as I said unto your fathers: Mine angel shall go up before you, but not my presence” ([[D&C 103:19]]). To them the Lord says, “Mine angels shall go up before you, and also my presence” ([[D&C 103:20]]).

      Isaiah, looking back on the journey, joins the two words: “the angel of his presence saved them” ([[Isa. 63:9]]; see the note there). Who the Angel of this chapter is, is the subject of the next note.
    sources: [lds-scriptures]

  - ref: 21
    phrase: my name is in him
    kind: christ
    title: The Angel who bears the name of the LORD
    body: |
      The Angel is to be obeyed as the LORD is obeyed because he carries the LORD’s name, which is to say His authority. Disobedience to him will be disastrous because “my name is in him,” that is, “he has my authority.” The next verse moves between the two voices without a seam: Israel is to “obey his voice, and do all that I speak.”

      Who he is, the chapter does not say, and the question “has elicited no small amount of discussion and speculation.” One Latter-day Saint study points to the Hebrew behind “mine Angel,” *malʾākî*, which is also the name Malachi, and to that prophet’s promise of a messenger called by the same word. Malachi’s promise, the study says, identifies the Lord Himself as “the messenger of the covenant” ([[Mal. 3:1]]), and it suggests the like for Exodus: “Perhaps it is the same here: the Angel is the Lord himself.” It is offered as a possibility.

      Two things in scripture bear on it and pull in different directions. Earlier in Exodus “the angel of the LORD” in the burning bush turns out to be the LORD speaking (see [[Ex. 3:2]]). Later in Exodus the angel sent before Israel is distinguished from the LORD’s presence (see the note on verse 20). If the Angel is the LORD, he is Jehovah, the premortal Jesus Christ (see [[Ex. 3:14]]), and “the messenger of the covenant” as a title of Christ is taken up at [[Mal. 3:1]].
    sources: [bowen-law-codes, oshb-wlc, lds-scriptures]

  - ref: 28
    phrase: I will send hornets before thee
    kind: words
    title: The hornets, and little by little
    body: |
      Whether the hornets are insects or a figure for panic is not settled. The standard lexicon gives the Hebrew word as a collective, “hornets,” and describes them as “allies of Israel.” A modern translation has “swarms of hornets” and marks the word “Meaning of Heb uncertain.” It is found only where this promise is made, repeated, and remembered: here, in [[Deut. 7:20]], and in Joshua’s account of the conquest.

      One older reading takes the hornets as a figure. The promise “is hardly to be taken literally,” it argues, because the book of Joshua tells of no such thing, and because Joshua himself uses the word of two kings who were beaten in battle: “I sent the hornet before you, which drave them out from before you, even the two kings of the Amorites; but not with thy sword, nor with thy bow” ([[Josh. 24:12]]). On that reading the hornets continue verse 27, where the LORD sends His “fear” ahead of Israel; they are “the stings of alarm which followed this fear.” Read either way, Joshua’s sentence gives the point of the image: the land was not won by Israel’s weapons.

      The promise is also slow on purpose. The nations will not be driven out “in one year,” and verses 29–30 say why: an emptied land would go wild before Israel was numerous enough to fill it. Deuteronomy repeats the reason: “thou mayest not consume them at once, lest the beasts of the field increase upon thee” ([[Deut. 7:22]]).
    sources: [bdb, nrsvue, keil-exodus, lds-scriptures]

  - ref: 33
    phrase: lest they make thee sin against me
    kind: scripture
    title: Why the nations of Canaan were to be driven out
    body: |
      This chapter gives one reason for driving out the peoples of Canaan, the pull of their gods, and other scripture adds a second, their own wickedness. Here the danger is to Israel: do not bow to their gods (verse 24), make no covenant with them or their gods (verse 32), and do not let them stay, “for if thou serve their gods, it will surely be a snare unto thee.”

      Deuteronomy warns Israel against taking the conquest as a compliment: “for the wickedness of these nations the LORD thy God doth drive them out from before thee” ([[Deut. 9:5]]). The judgment had waited a long time. Abraham was told that his seed would not return to the land for generations, “for the iniquity of the Amorites is not yet full” ([[Gen. 15:16]]). Nephi, arguing from this history with his brothers, says of the same peoples: “the Lord esteemeth all flesh in one; he that is righteous is favored of God. But behold, this people had rejected every word of God, and they were ripe in iniquity” ([[1 Ne. 17:35]]).

      The Church’s treatment of the subject draws on Nephi’s words and on the promise to Abraham. It calls the conquest one of the most challenging parts of the Old Testament, and it says that the destruction of the Canaanite cities “was not an impulsive act of God’s wrath” but a response to generations of rebellion, one that reflects both justice and the desire to protect a covenant people from being corrupted.

      The book of Judges tells what came of the warning. Israel made leagues with the people of the land, and an angel told them the result, and his last word is this verse’s: “I will not drive them out from before you; but they shall be as thorns in your sides, and their gods shall be a snare unto you” ([[Judg. 2:3]]).
    sources: [lds-scriptures, scripture-helps-violence]

christ: |
  The New Testament returns to each of the three feasts commanded here. The Savior died at the first of them, as He had said He would: “after two days is the feast of the passover, and the Son of man is betrayed to be crucified” ([[Matt. 26:2]]). Paul calls Him “our passover” ([[1 Cor. 5:7]]; see the notes to chapter 12). The Holy Ghost was poured out on His disciples “when the day of Pentecost was fully come” ([[Acts 2:1]]), which is this chapter’s feast of harvest. At the feast of ingathering, “In the last day, that great day of the feast, Jesus stood and cried, saying, If any man thirst, let him come unto me, and drink” ([[John 7:37]]). The water drawn from Siloam and the lamps lit in the temple courts at that feast are “probably” what He refers to there and in [[John 8:12]]. For the first Christians the old festivals carried these added associations.

  The chapter’s closing promise is of one who goes before Israel bearing the LORD’s name, to keep them in the way and bring them to a place prepared. Whether that Angel is the LORD Himself is left open by the text, and the note on verse 21 gives the reading that he may be.

explore: |
  - **The feasts in full.** [[Lev. 23]] is the whole calendar of holy days; [[Deut. 16:1–17]] gives the three pilgrim feasts again.
  - **The seventh year and the fiftieth.** [[Lev. 25]], where the land’s sabbath grows into the jubilee, and [[Deut. 15:1–11]], the release of debts.
  - **An enemy’s need.** [[Prov. 25:21]] and [[Matt. 5:43–44]].
  - **The names of other gods.** [[Hosea 2:17]] and [[Ps. 16:4]], each with a note on this chapter’s verse 13.
  - **The borders.** [[Gen. 15:18]], the promise to Abraham; [[1 Kgs. 4:21]], Solomon’s reach; and the note at [[Ps. 72:8]].
  - **The one who goes before.** [[Josh. 5:13–15]], the captain of the LORD’s host, and [[Isa. 63:9]].
  - **The promises looked back on.** [[Josh. 24:11–13]] and [[Judg. 2:1–3]].

