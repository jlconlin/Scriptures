chapter: 33
title: My Presence Shall Go with Thee
tagline: After the golden calf the LORD says He will send an angel but will not go up in Israel’s midst. The people mourn, Moses meets the LORD at a tent outside the camp and pleads until he is promised, “My presence shall go with thee,” and then he asks to see the LORD’s glory.
when: 'At Horeb, in the days after the golden calf (32:30), before Moses goes up the mount again with the second tables (34:4).'

setting: |
  Israel is still camped at Horeb. While Moses was on the mount being shown the pattern of the tabernacle (chapters 25–31), the people made a golden calf. Moses broke the tables, about three thousand men died, and Moses went back to the LORD to plead for the people (chapter 32). That chapter ended with a pardon that was only partial: “behold, mine Angel shall go before thee: nevertheless in the day when I visit I will visit their sin upon them” ([[Ex. 32:34]]).

  Chapter 33 is the middle of the three chapters that tell of “the renewal of the covenant after the rebellion of the golden calf.” It takes up the question the calf has left open: whether the LORD will still go with this people. The tabernacle, commanded so “that I may dwell among them” ([[Ex. 25:8]]), is not yet built; it is made in chapters 35–40. The chapter closes with a promise to Moses that is kept in the next, when the LORD passes by and proclaims His name ([[Ex. 34:5–7]]).

  Later scripture returns here. Paul quotes verse 19 ([[Rom. 9:15]]). Elijah stands on this mountain while the LORD passes by ([[1 Kgs. 19:9–13]]). And a revelation to Joseph Smith recalls the angel sent without the presence ([[D&C 103:19–20]]).

thread: |
  One word runs through the chapter, and the King James Version translates it two ways. The Hebrew word for “face” stands behind “face to face” in verse 11, behind “my presence” in verse 14 (literally “my face”) and “thy presence” in verse 15, and behind “my face” in verses 20 and 23. The chapter asks whether, and how nearly, Israel and Moses may have the face of the LORD.

  It moves in three parts. First the presence is withdrawn: an angel will lead, but “I will not go up in the midst of thee” (verse 3), and the people mourn. Then the presence is shown at a distance: the tent where the LORD speaks with Moses stands outside the camp, and the people watch from the doors of their own tents (verses 7–11). Then Moses asks. He asks to know the LORD’s way and who will be sent with him, and is promised the presence and rest (verses 12–14). He asks that the LORD go with “I and thy people,” and that is granted also (verses 15–17). Last he asks to see the LORD’s glory, and is promised the goodness and the name, though not, this time, the face (verses 18–23).

  Through all of it Moses will not be separated from the people. He ends his first request with “this nation is thy people” (verse 13), and in his second he says “I and thy people” twice (verse 16).

sections:
  - range: 1-6
    heading: An angel, but not the LORD in their midst
    plain: |
      The LORD said to Moses, “Leave this place, you and the people you brought up out of Egypt, and go up to the land that I swore to give to the seed of Abraham, Isaac, and Jacob. I will send an angel ahead of you, and I will drive out the Canaanites, Amorites, Hittites, Perizzites, Hivites, and Jebusites. It is a land flowing with milk and honey. But I will not go up among you, for you are a stiffnecked people, and I might consume you on the way.”

      When the people heard this hard news they mourned, and no one put on his ornaments. For the LORD had told Moses to say to them, “You are a stiffnecked people. If I came up among you even for a moment, I would consume you. Now take off your ornaments, and I will know what to do with you.” So the children of Israel stripped off their ornaments at mount Horeb.
  - range: 7-11
    heading: The tent outside the camp
    plain: |
      Moses would take the tent and pitch it outside the camp, far off from it, and he called it the tent of meeting. Anyone who sought the LORD went out to that tent outside the camp. Whenever Moses went out to it, all the people rose and stood, each at the door of his own tent, and watched him until he had gone in. As Moses entered, the pillar of cloud came down and stood at the door of the tent, and the LORD talked with Moses. When the people saw the pillar of cloud standing at the door, they all rose and worshipped, each at his own tent door.

      The LORD spoke to Moses face to face, as a man speaks to his friend. Then Moses would go back to the camp, but his servant Joshua the son of Nun, a young man, did not leave the tent.
  - range: 12-16
    heading: “If thy presence go not with me”
    plain: |
      Moses said to the LORD, “You tell me, ‘Bring up this people,’ but you have not let me know whom you will send with me. Yet you have said, ‘I know you by name, and you have found grace in my sight.’ If I have found grace in your sight, show me now your way, so that I may know you and find grace in your sight. And consider that this nation is your people.”

      The LORD said, “My presence will go with you, and I will give you rest.” Moses answered, “If your presence does not go with me, do not take us up from here. How will it be known that I and your people have found grace in your sight, unless you go with us? That is what sets us apart, me and your people, from every other people on the face of the earth.”
  - range: 17-23
    heading: “Shew me thy glory”
    plain: |
      The LORD said to Moses, “I will do this also that you have asked, for you have found grace in my sight, and I know you by name.” Moses said, “I beg you, show me your glory.”

      He said, “I will make all my goodness pass before you, and I will proclaim the name of the LORD before you. I will be gracious to whom I will be gracious, and I will show mercy to whom I will show mercy.” And He said, “You cannot see my face, for no man shall see me and live.” The LORD said, “There is a place beside me, and you shall stand on a rock. While my glory passes by I will put you in a cleft of the rock and cover you with my hand until I have passed. Then I will take away my hand and you shall see my back, but my face shall not be seen.”

notes:
  - ref: 3
    phrase: I will not go up in the midst of thee
    kind: scripture
    title: The land is still promised, but not the LORD’s company
    body: |
      The LORD keeps His oath about the land and withdraws Himself from the journey, and the reason He gives is the people’s own safety. The promise sworn to Abraham stands, an angel will go ahead, and the nations will be driven out (verses 1–2). What is taken back is His own going “in the midst” of the camp, “lest I consume thee in the way”: His presence “would destroy such a stubborn people.”

      An angel had been promised before the calf as well ([[Ex. 23:20]]). The note there sets out how an angel going before Israel is distinguished from the LORD’s own presence, in this chapter and in [[D&C 103:19–20]]. In verses 12–17 Moses asks for the presence itself.
    sources: [ot-minute-ex-24, lds-scriptures]

  - ref: 6
    phrase: stripped themselves of their ornaments
    kind: history
    title: Why the people take off their ornaments
    body: |
      Laying aside their ornaments is how the people mourn, and verse 5 shows that the LORD had commanded it. The command comes with a warning, which the Church’s footnote words as a condition (“if I came up … I would consume”), and with a verdict held open: “that I may know what to do unto thee.”

      The ornaments were “things that represented their prosperity, things that were important to them,” and by putting them off the people “showed the Lord that He was more important in their lives than worldly possessions.”

      The last words of verse 6 may tell when and not where. Where the King James Version has “by the mount Horeb,” a modern translation reads that the Israelites stripped themselves of their ornaments “from Mount Horeb onward.” Later the people give their jewelry as an offering for the building of the tabernacle ([[Ex. 35:22]]).
    sources: [lds-scriptures, ot-minute-ex-24, nrsvue]

  - ref: 7
    phrase: the Tabernacle of the congregation
    kind: history
    title: This tent is not the tabernacle of chapters 25–31
    body: |
      The “tabernacle” Moses pitches here is a tent, not the sanctuary whose pattern he has just been shown, which is not made until chapters 35–40. A modern translation says simply that Moses took “the tent,” and the name he gives it is, as the Church’s footnote has it, “tent of meeting.” The finished tabernacle is called by the same name, which is why the two are easily confused.

      What tent this was the verse does not say. It served as “a temporary tabernacle,” and one older reading takes it for “a tent belonging to Moses, which was made into a temporary sanctuary by the fact that the pillar of cloud came down upon it.” The cloud is the sign that the LORD is there (see [[Ex. 13:21]]). The modern translation also reads the verbs of verses 7–11 as custom, not a single occasion: “Moses used to take the tent and pitch it outside the camp,” and when he entered, “the pillar of cloud would descend.”

      Where the tent stands matters as much as what it is. It is “afar off from the camp,” and anyone who seeks the LORD has to go out to it. The same older reading sees purpose in the distance: Moses meant “to lead the people to a fuller recognition of their separation from their God.” The chapter itself gives no reason.
    sources: [lds-scriptures, nrsvue, ot-minute-ex-24, keil-exodus, ot-manual-ex-21-24]

  - ref: 11
    phrase: face to face, as a man speaketh unto his friend
    kind: scripture
    title: Face to face, as a friend
    body: |
      The verse says without qualification that the LORD and Moses spoke as two friends speak, and the rest of scripture says the same of Moses. “With him will I speak mouth to mouth, even apparently, and not in dark speeches; and the similitude of the LORD shall he behold” ([[Num. 12:8]]). Deuteronomy’s last word on him is that no prophet arose in Israel like Moses, “whom the LORD knew face to face” ([[Deut. 34:10]]). Latter-day revelation begins its account of him the same way: “he saw God face to face, and he talked with him” ([[Moses 1:2]]).

      How this verse stands with verse 20, nine verses later, is taken up at [[Ex. 33:20]].
    sources: [lds-scriptures]

  - ref: 14
    phrase: My presence shall go with thee, and I will give thee rest
    kind: words
    title: “My presence” is “my face,” and what the rest is
    body: |
      The promise Moses is given is, word for word, that the LORD’s face will go, and the rest that comes with it is first of all the land. A literal rendering runs, “My presence [literally, ‘my face’] will walk [presumably with the Israelites], and I will cause you to have rest.”

      “Rest” in this verse “is associated with the future settlement of the children of Israel after their wandering in the wilderness.” Moses uses the word that way when he speaks of the day the LORD shall “have given rest unto your brethren” ([[Deut. 3:20]]). Scripture also knows a rest that is God’s own. Psalm 95 says of this generation that they should not enter “my rest” ([[Ps. 95:11]]), which “suggests that the children of Israel could have entered into God’s own rest.” Latter-day revelation says of Israel in the wilderness that they “could not endure his presence,” and that the Lord swore “that they should not enter into his rest while in the wilderness, which rest is the fulness of his glory” ([[D&C 84:24]]). What Israel was offered at Sinai and lost is told in full at [[Ex. 34:1]].

      Moses answers at once, “If thy presence go not with me, carry us not up hence” (verse 15), and asks that the LORD go with the people too. In granting it (verse 17) the LORD relents from what He had said in verse 3, that an angel would go in place of His presence. On the mount Moses asks once more: “let my Lord, I pray thee, go among us” ([[Ex. 34:9]]).
    sources: [belnap-skinner-sinai, ot-minute-ex-24, lds-scriptures]

  - ref: 18
    phrase: shew me thy glory
    kind: scripture
    title: Moses asks for glory and is promised goodness and a name
    body: |
      Moses asks to see the LORD’s glory, and the answer promises him “all my goodness,” the proclaiming of “the name of the LORD,” and grace. (What the glory of the LORD is in Exodus is treated at [[Ex. 24:16]].) The promise is kept on the mount in the next chapter: “the LORD descended in the cloud, and stood with him there, and proclaimed the name of the LORD” ([[Ex. 34:5]]). The words of that proclamation are treated at [[Ex. 34:6]].

      Why Moses asks at all, when he already speaks with the LORD face to face, the chapter does not explain. One older reading holds that he sought “something surpassing all former revelations of the glory of Jehovah.” The same reading notices that verse 22 says “while my glory passeth by” of what verse 19 called “all my goodness,” and concludes that what passed before Moses was “not the brilliancy which strikes the senses, but the spiritual and ethical nature of the Divine Being.” That is an inference from the two verses, not something the text states.

      The sentence that closes verse 19, on the same reading, gives the ground on which the request is granted: it was “an act of unconditional grace and compassion on the part of God, to which no man, not even Moses, could lay any just claim.” That reading adds that Paul uses the words in the same sense: “For he saith to Moses, I will have mercy on whom I will have mercy, and I will have compassion on whom I will have compassion” ([[Rom. 9:15]]).
    sources: [lds-scriptures, keil-exodus]

  - ref: 20
    phrase: there shall no man see me, and live
    kind: scripture
    title: Who can see God and live
    body: |
      The Joseph Smith Translation reads this verse as a refusal for that time, because of Israel’s sin, and adds that no sinful man can see God’s face and live. The difficulty is plain enough. Nine verses earlier “the LORD spake unto Moses face to face” (verse 11), and at the making of the covenant the elders of Israel “saw the God of Israel” ([[Ex. 24:10]]). Verse 20 seems to contradict both.

      The Prophet’s revision supplies the time and the reason: “Thou canst not see my face at this time, lest mine anger be kindled against thee also, and I destroy thee, and thy people; for there shall no man among them see me at this time, and live, for they are exceeding sinful.” A general rule follows: “no sinful man hath at any time, neither shall there be any sinful man at any time, that shall see my face and live.” Verse 23 is revised to agree: “my face shall not be seen, as at other times; for I am angry with my people Israel.” So the face Moses had seen “at other times” is withheld on this occasion, and the cause is Israel’s sin.

      Other Restoration scripture says what makes the sight possible. Moses gives his own account: “mine own eyes have beheld God; but not my natural, but my spiritual eyes, for my natural eyes could not have beheld; for I should have withered and died in his presence; but his glory was upon me; and I beheld his face, for I was transfigured before him” ([[Moses 1:11]]). The same is said of all: “no man has seen God at any time in the flesh, except quickened by the Spirit of God” ([[D&C 67:11]]). And where the ordinances and authority of the priesthood are lacking, the power of godliness is not manifest, and “without this no man can see the face of God, even the Father, and live” ([[D&C 84:21–22]]). The next verse adds that Moses taught this plainly to Israel “and sought diligently to sanctify his people that they might behold the face of God” ([[D&C 84:23]]).

      The two verses are not made simple by this: “Even with this change, these are difficult texts to reconcile.” One reading sets them within a pattern that runs through the book of Exodus, in which “the Lord reveals himself, yet at the same time, his glory is too great to be fully revealed.” Often it is darkness that does the hiding. Here the pattern is “expressed by Moses seeing the Lord’s face yet shortly thereafter only being allowed to see the back of him because of man’s fallen and sinful actions.”
    sources: [jst-ex-33, scripture-helps-ex-19, lds-scriptures, muhlestein-theophanies]

  - ref: 22
    phrase: a clift of the rock
    kind: scripture
    title: The cleft of the rock, and the LORD passing by
    body: |
      The King James “clift” is a cleft, an opening in the rock, and Moses is put there for his protection. A modern translation reads “a cleft of the rock,” and the Church’s footnote gives the Hebrew of the verse’s last words as “until I have gone past.” Moses is hidden and covered until the glory has gone by, because seeing it “would be so powerful that God would have to protect Moses with His hand and with the cleft of a rock.”

      What follows is told in bodily words: a hand, a back, a face. The Church’s footnote to “back” points to the Topical Guide’s entry on the bodily nature of God, and the passage belongs with the Old Testament’s many “manlike descriptions of an interactive God,” among them that “Moses not only sees the Lord’s back (see Exodus 33:23) but speaks to Him face to face and mouth to mouth.”

      Centuries later Elijah came to the same mountain, and the account of his visit shares this passage’s features. He “came thither unto a cave, and lodged there” ([[1 Kgs. 19:9]]); he was told to stand on the mount, “and, behold, the LORD passed by” ([[1 Kgs. 19:11]]); and afterward “he wrapped his face in his mantle” ([[1 Kgs. 19:13]]). The likeness has been counted among several between the two prophets: “Moses and Elijah both wait in a cave in Mt. Sinai,” and “The Lord tells both of them that he will pass them by.”
    sources: [nrsvue, lds-scriptures, ot-minute-ex-24, thomas-provocation, sc-knowhy-858]

christ: |
  The LORD who speaks with Moses as a friend is Jehovah, the premortal Jesus Christ (see [[Ex. 3:14]]), and the Church’s footnote to verse 11 points to the Topical Guide’s list of His appearances before His birth.

  The Joseph Smith Translation joins the seeing of God to the Son. Where John writes, “No man hath seen God at any time” ([[John 1:18]]), the Prophet’s revision goes on, “except he hath borne record of the Son; for except it is through him no man can be saved.”

  Moses stands between the LORD and Israel through the whole chapter, “still the mediator between his people and God.” What his pleading for the people has to do with Christ is said at [[Ex. 32:32]].

explore: |
  - **The promise kept.** [[Ex. 34:5–9]]: the LORD descends, passes by, and proclaims His name, and Moses asks once more that He “go among us.”
  - **Moses’s own account of seeing God.** [[Moses 1:1–11]], where the glory of God is upon Moses so that he can endure His presence.
  - **An angel, and also the presence.** [[D&C 103:15–20]], where the Lord contrasts what He said to “your fathers” with what He promises the Saints.
  - **The presence in the midst of the camp.** [[Ex. 40:34–38]]: when the tabernacle is finished, the cloud covers the tent and the glory of the LORD fills it.
  - **A study of the pattern.** “Darkness, Light, and the Lord: Elements of Israelite Theophanies” (Religious Studies Center, 2013) follows the revealing and the hiding of the LORD through the book of Exodus.

