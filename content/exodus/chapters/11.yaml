chapter: 11
title: One Plague More
tagline: Before he leaves Pharaoh for the last time, Moses announces the death of Egypt’s firstborn and the difference the LORD will put between Egypt and Israel.
when: 'After the three days of darkness and before the first Passover; the day is not given'

setting: |
  Nine plagues have fallen. The ninth, “a thick darkness in all the land of Egypt three days” ([[Ex. 10:22]]), ended with Pharaoh’s threat: “see my face no more; for in that day thou seest my face thou shalt die” ([[Ex. 10:28]]). Moses agreed to the terms: “I will see thy face again no more” ([[Ex. 10:29]]). In chapter 11 he is still speaking to Pharaoh; how its first three verses fit into that audience is taken up in the note on verse 1.

  The chapter announces the last plague. The blow itself falls in chapter 12, after the Passover has been given and kept.

  This last plague was also the first one named. Before Moses went back to Egypt, the LORD gave him the words for Pharaoh, “I will slay thy son, even thy firstborn” ([[Ex. 4:23]]); the note at [[Ex. 4:22]] takes up what “firstborn” meant.

  Later scripture comes back to this plague. The psalms sing that the LORD “smote all the firstborn in Egypt; the chief of their strength” ([[Ps. 78:51]]; see also [[Ps. 105:36]]), and Hebrews says that Moses kept the Passover “lest he that destroyed the firstborn should touch them” ([[Heb. 11:28]]).

thread: |
  The chapter is **a word spoken ahead of the event**, and chapter 12 tells its fulfillment part by part, often in the same words. Pharaoh will “thrust you out” (verse 1), and Israel leaves with unbaked dough “because they were thrust out of Egypt, and could not tarry” ([[Ex. 12:39]]). The people are to ask for silver and gold (verse 2), and they do ([[Ex. 12:35–36]]). The firstborn will die at midnight, from the throne down (verses 4–5), and “at midnight the LORD smote all the firstborn in the land of Egypt, from the firstborn of Pharaoh that sat on his throne” ([[Ex. 12:29]]). There will be “a great cry” (verse 6), and “there was a great cry in Egypt” ([[Ex. 12:30]]). Pharaoh’s servants will beg Israel to go (verse 8), and Pharaoh and the Egyptians do ([[Ex. 12:31–33]]).

  At the center is the purpose given in verse 7: “that ye may know how that the LORD doth put a difference between the Egyptians and Israel.” Some of the earlier plagues had spared Goshen (see the note at [[Ex. 8:22]]). This time all Egypt is to cry out, and against Israel not so much as a dog is to growl.

  Verses 9–10 then close the whole account of Moses and Aaron before Pharaoh that began in chapter 7, and they close it in the words that opened it: “Pharaoh shall not hearken unto you,” and the wonders multiplied “in the land of Egypt” ([[Ex. 7:3–4]]). What the LORD said beforehand has come to pass. On the hardening of Pharaoh’s heart in verse 10, where the Joseph Smith Translation reads “And Pharaoh hardened his heart,” see the note at [[Ex. 4:21]].

sections:
  - range: 1-3
    heading: One plague more
    plain: |
      The Lord said to Moses, “I will bring one more plague on Pharaoh and on Egypt. After that he will let you go from here, and when he does, he will drive you out altogether. Now tell the people that every man is to ask his neighbor, and every woman hers, for jewels of silver and gold.” The Lord gave the people favor in the eyes of the Egyptians, and Moses himself was a very great man in Egypt, in the eyes of Pharaoh’s servants and of the people.
  - range: 4-8
    heading: Moses’s last words to Pharaoh
    plain: |
      Moses said, “This is what the LORD says: About midnight I will go out into the midst of Egypt, and every firstborn in the land of Egypt will die, from the firstborn of Pharaoh who sits on his throne to the firstborn of the servant woman at the handmill, and all the firstborn of the animals. There will be a great cry through all the land of Egypt, such as there never was and never will be again. But against the children of Israel, man or beast, not so much as a dog will growl, so that you may know that the LORD puts a difference between the Egyptians and Israel. All these servants of yours will come down to me and bow to me and say, ‘Go, you and all the people who follow you.’ After that I will go.” And he went out from Pharaoh in great anger.
  - range: 9-10
    heading: The wonders summed up
    plain: |
      The Lord said to Moses, “Pharaoh will not listen to you, so that my wonders may be multiplied in the land of Egypt.” Moses and Aaron did all these wonders before Pharaoh, and the Lord hardened Pharaoh’s heart, and he would not let the children of Israel go out of his land.

notes:
  - ref: 1
    phrase: And the LORD said unto Moses
    kind: history
    title: When the LORD said this
    body: |
      Verses 1–3 stand in the middle of Moses’s last audience with Pharaoh, and they can be placed in two ways. The difficulty is the order of events. Chapter 10 ends with Moses before Pharaoh, answering, “I will see thy face again no more” ([[Ex. 10:29]]). In verse 4 of this chapter he is still speaking to Pharaoh, and verse 8 ends with his leaving. Between the two comes a word of the LORD to Moses alone, with an instruction for the people.

      Taken in order, the word came once Pharaoh had dismissed him: “After being thrown out of Pharaoh’s presence, the Lord told Moses that there was one more plague.” Taken as looking back, it had come earlier, and Moses went to the audience already knowing what the last plague would be. A modern translation reads verse 1 that way, “Now the Lord had said to Moses,” and sets verse 3 in parentheses.

      The choice is about how the story is being told, and the chapter does not settle it. Pharaoh next speaks to Moses when he calls for him by night ([[Ex. 12:31]]).
    sources: [lds-scriptures, ot-minute-ex-7, niv]
  - ref: 2
    phrase: let every man borrow of his neighbour
    kind: scripture
    title: Asking the Egyptians for silver and gold
    body: |
      This instruction carries out what the LORD promised at the burning bush, and it is now given to the whole people. There He said, “I will give this people favour in the sight of the Egyptians: and it shall come to pass, that, when ye go, ye shall not go empty” ([[Ex. 3:21]]), and the instruction named the women. Here Moses is told to say it “in the ears of the people,” and the men are to ask as well.

      The Church’s footnote at “borrow” reads “HEB ask.” What the word means, and whether anything was to be given back, is treated at [[Ex. 3:22]]. Verse 3 says why the Egyptians gave: the LORD moved them to it, and Moses by now was “very great” in the eyes of Pharaoh’s own servants and of the people. The asking is carried out as Israel leaves ([[Ex. 12:35–36]]).
    sources: [lds-scriptures]
  - ref: 4
    phrase: About midnight will I go out
    kind: history
    title: Which midnight, and who goes out
    body: |
      Moses names an hour and no day, and the one who will go out is the LORD Himself. A reader may take “about midnight” to mean the coming night. But before the plague falls, Israel must choose a lamb “in the tenth day of this month” ([[Ex. 12:3]]) and keep it “until the fourteenth day” ([[Ex. 12:6]]). So, on one older reading, “the last decisive blow did not take place in the night following the cessation of the ninth plague,” and which midnight is meant “cannot be determined” from this verse alone. The night itself is told in chapter 12.

      On the same reading, the last plague differs in who acts: “The last blow upon Pharaoh was to be carried out by Jehovah Himself, whereas the other plagues had been brought by Moses and Aaron.” The darkness came when Moses “stretched forth his hand toward heaven” ([[Ex. 10:22]]). Of this plague the LORD says, “will I go out.” How chapter 12 speaks of His passing through the land, and of “the destroyer,” belongs to [[Ex. 12:23]].
    sources: [lds-scriptures, keil-exodus]
  - ref: 5
    phrase: from the firstborn of Pharaoh that sitteth upon his throne
    kind: history
    title: From the throne to the handmill
    body: |
      The plague reaches every rank in Egypt, and the king’s own house is named first. The list runs from the heir of the throne to the child of “the female slave who is behind the handmill,” as a modern translation has it. When the plague comes, the lowest place is given as “the captive that was in the dungeon” ([[Ex. 12:29]]).

      Two things known of Egyptian kingship suggest why the king’s house mattered. Pharaoh “was regarded as a deity, and thus the death of the pharaonic heir was a challenge to his divine succession.” And the king was credited with guarding Egypt’s young: hymns for Senusret III ascribe to him “the power of protecting the youths that they may slumber.” On this reading the last plague showed that “Pharaoh could not exercise his powers in opposition to Jehovah.” These are proposals drawn from Egyptian texts and not something the chapter says.

      The reason Exodus itself gives is the first message sent to Pharaoh, “Israel is my son, even my firstborn” ([[Ex. 4:22]]); see the note there. The death of the firstborn, and how the Church’s sources speak of it, is taken up at [[Ex. 12:29]].
    sources: [nrsvue, muhlestein-pharaoh, sc-knowhy-631, lds-scriptures]
  - ref: 7
    phrase: shall not a dog move his tongue
    kind: words
    title: Not a dog will growl
    body: |
      The saying means that not even a dog will make a sound against Israel that night. The Hebrew verb is “sharpen,” used as a figure of the tongue, “i.e. utter no sound against Israel,” and a modern translation has “not a dog shall growl at any of the Israelites.” The verse begins with “But” and answers the one before it: in Egypt “a great cry,” and against Israel not a growl.

      The book of Joshua uses the same figure of men. After a victory the people came back to the camp in peace, and “none moved his tongue against any of the children of Israel” ([[Josh. 10:21]]).
    sources: [bdb, nrsvue, lds-scriptures]
  - ref: 7
    phrase: the LORD doth put a difference between the Egyptians and Israel
    kind: scripture
    title: The difference between Egypt and Israel
    body: |
      The LORD now distinguishes between the two peoples themselves, and “put a difference” is the word used when Goshen was first spared. It is one verb in Hebrew, meaning to “make separate” or “distinguish between,” and Exodus has it at the plague of flies, “I will sever in that day the land of Goshen” ([[Ex. 8:22]]), and at the plague on the cattle, “the LORD shall sever between the cattle of Israel and the cattle of Egypt” ([[Ex. 9:4]]). The setting apart of Goshen is explained at [[Ex. 8:22]].

      The Church’s footnote at “difference” sends the reader to Nephi, who says on what ground the Lord favors one people above another. Speaking of Israel and of the peoples it later drove out of the land of promise, he says, “Behold, the Lord esteemeth all flesh in one; he that is righteous is favored of God” ([[1 Ne. 17:35]]).
    sources: [oshb-wlc, bdb, lds-scriptures]
  - ref: 8
    phrase: in a great anger
    kind: history
    title: Why Moses left in anger
    body: |
      The text does not say why Moses was angry, and two reasons have been offered. One looks to what was coming: “Perhaps that anger was triggered because Moses knew what was to happen to the Egyptian people with this tenth plague, all because of Pharaoh’s stubborn pride.” One older reading looks back to [[Ex. 10:27–28]], where Pharaoh refuses once more and threatens Moses with death, and takes the anger to be “on account of what the Pharaoh had said.”
    sources: [ot-minute-ex-7, cambridge-exodus]

christ: |
  The LORD who says “will I go out into the midst of Egypt” is Jehovah (see the note at [[Ex. 3:14]]). This chapter says that He will put a difference between Egypt and Israel, and it does not say how. Chapter 12 does: the blood of a lamb on the doorposts, “and when I see the blood, I will pass over you” ([[Ex. 12:13]]). The Passover was to “help the Israelites look forward to the Messiah’s coming,” and Paul calls Christ “our passover” ([[1 Cor. 5:7]]). The lamb and what it signified are the subject of chapter 12.

explore: |
  - [[Ex. 12:29–36]]: the announcement fulfilled, part by part.
  - [[Ex. 4:21–23]]: the last plague named before the first was sent.
  - [[Ex. 3:19–22]]: what Moses was told at the bush about Pharaoh’s refusal, the wonders, and the favor of the Egyptians.
  - [[Ps. 78:51]] and [[Ps. 105:36]]: the last plague as Israel sang of it.

