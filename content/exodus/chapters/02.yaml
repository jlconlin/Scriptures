chapter: 2
title: Drawn Out of the Water
tagline: A Levite mother hides her son in an ark among the reeds, Pharaoh’s daughter draws him out and names him Moses, and the man who tries to deliver his brethren ends a stranger in Midian, until God hears Israel’s cry.
when: 'During the oppression, from Moses’s birth through his exile in Midian: about eighty years, by Acts 7:23, 30 and Exodus 7:7'

setting: |
  Chapter 1 ended with Pharaoh’s order to all his people: “Every son that is born ye shall cast into the river” ([[Ex. 1:22]]). Chapter 2 begins with one such son. The king is the Pharaoh of the oppression, whom the text never names; who he may have been is taken up at [[Ex. 1:11]].

  Twenty-five verses cover most of a lifetime. Stephen says Moses was “full forty years old” when he went out to his brethren ([[Acts 7:23]]) and that forty more years passed in Midian ([[Acts 7:30]]); Exodus says he was “fourscore years old” when he stood before Pharaoh ([[Ex. 7:7]]). From those eighty years the chapter tells three short scenes, at the river, among the Hebrew laborers, and at a well in Midian. Its last three verses turn from Moses to God and lead into the call at the burning bush in chapter 3.

  Other scripture fills in what Exodus leaves unsaid. Stephen retells the chapter before the council in Jerusalem ([[Acts 7:20–29]]). Hebrews reads the hiding of the child and the leaving of Egypt as acts of faith ([[Heb. 11:23–27]]). And the Joseph Smith Translation restores a prophecy of Joseph in Egypt that names Moses generations before his birth (Joseph Smith Translation, Genesis 50:24–38, in the appendix of the Latter-day Saint edition of the Bible).

thread: |
  Exodus 2 is a chapter of rescues, and the man who will rescue Israel is first rescued himself.

  Three times someone is delivered. A baby is drawn out of the river that was meant to drown him (verses 1–10). A Hebrew laborer is defended from the Egyptian who is beating him (verses 11–12). Seven sisters are saved from the shepherds who drive them from a well (verses 16–19). The first rescue is the work of women from beginning to end: a mother, a sister, a princess and her maid, after the midwives of chapter 1. On one reading they are “active participants in the salvation of Israel, moving the story forward in important ways.” In the other two Moses is the rescuer. Read together, the scenes have been taken to show “God’s hand in saving Moses, the future liberator of His people,” and then “Moses as the rescuer, or deliverer, saving his fellow people from harm.”

  Yet the chapter moves downward. Moses’s own attempt to help his brethren fails, because “they understood not” ([[Acts 7:25]]), and the son of Pharaoh’s daughter ends as a shepherd in another man’s house, giving his son a name that means “a foreigner there.” That direction has itself been read as the point: “That exile, however, becomes the turning point where he begins his ascent and is made fully ready to deliver Israel.”

  Then the chapter changes its subject. God is not named in the first twenty-two verses. In the last three He is named five times, and four verbs are His: He heard, He remembered, He looked, He knew. The next chapter opens with Him saying what follows from that: “I am come down to deliver them” ([[Ex. 3:8]]).

sections:
  - range: 1-10
    heading: The child in the ark
    plain: |
      A man of the tribe of Levi married a Levite woman. She conceived and bore a son, and when she saw what a fine child he was, she hid him for three months. When she could hide him no longer, she took a basket made of papyrus, coated it with bitumen and pitch, put the child in it, and set it among the reeds at the edge of the river. His sister stood at a distance to learn what would happen to him.

      Pharaoh’s daughter came down to bathe at the river while her attendants walked along the bank. She saw the basket among the reeds and sent her maid to bring it. When she opened it she saw the child, and the baby was crying. She felt compassion for him and said, “This is one of the Hebrews’ children.” Then his sister said to Pharaoh’s daughter, “Shall I go and call a nurse from the Hebrew women to nurse the child for you?” “Go,” she said, and the girl went and called the child’s mother. Pharaoh’s daughter told her, “Take this child and nurse him for me, and I will pay you.” So the woman took the child and nursed him. When the child had grown, she brought him to Pharaoh’s daughter, and he became her son. She named him Moses, saying, “Because I drew him out of the water.”
  - range: 11-15
    heading: Moses goes out to his brethren
    plain: |
      In time, when Moses was grown, he went out to his brethren and saw their forced labor. He saw an Egyptian striking a Hebrew, one of his own people. He looked this way and that, saw that no one was there, killed the Egyptian, and hid him in the sand.

      The next day he went out again and found two Hebrew men fighting. He said to the one in the wrong, “Why are you striking your fellow?” The man answered, “Who made you a prince and a judge over us? Do you mean to kill me as you killed the Egyptian?” Moses was afraid and said, “Surely this thing is known.” When Pharaoh heard of it, he sought to kill Moses. But Moses fled from Pharaoh’s presence and settled in the land of Midian, and he sat down by a well.
  - range: 16-22
    heading: A stranger in Midian
    plain: |
      The priest of Midian had seven daughters. They came to draw water and filled the troughs to water their father’s flock, but the shepherds came and drove them away. Moses stood up and came to their rescue, and he watered their flock. When they came home to Reuel their father, he asked, “How is it that you are back so early today?” They said, “An Egyptian delivered us from the shepherds; he even drew water for us and watered the flock.” He said to his daughters, “Then where is he? Why did you leave the man? Call him to eat with us.”

      Moses was content to live with the man, who gave him his daughter Zipporah as wife. She bore a son, and Moses named him Gershom, for he said, “I have been a foreigner in a foreign land.”
  - range: 23-25
    heading: God hears
    plain: |
      A long time passed, and the king of Egypt died. The children of Israel groaned under their bondage and cried out, and their cry rose up to God. God heard their groaning, and God remembered His covenant with Abraham, with Isaac, and with Jacob. God looked on the children of Israel, and God took notice of them.

notes:
  - ref: 1
    phrase: a man of the house of Levi
    kind: history
    title: Moses’s parents, and why no one is named
    body: |
      The Levite couple are Amram and Jochebed, whom Exodus does not name until a later genealogy: “Amram took him Jochebed his father’s sister to wife; and she bare him Aaron and Moses” ([[Ex. 6:20]]). The telling here could leave the impression that Moses was their first child. He was not. A sister old enough to watch the ark and speak to a princess appears three verses later, and the one sister scripture names for him is Miriam ([[Num. 26:59]]); Aaron was three years older than Moses ([[Ex. 7:7]]).

      None of the people in the story of the birth is named: not the father, the mother, the sister, or the princess. The first name given is the child’s, in verse 10, and the silence before it has been read as deliberate, since it “signals that the name of Moses is significant.” The note on verse 10 takes up the name.
    sources: [lds-scriptures, arp-moses-egyptian]
  - ref: 3
    phrase: an ark of bulrushes
    kind: symbol
    title: The ark among the reeds
    body: |
      The Hebrew word for the baby’s basket, *tevah*, names only one other vessel in the Old Testament: the ark of Noah. It is the vessel “in which infant Moses was laid among reeds” and the vessel “which saved Noah and his family, with animals, during flood,” and nothing else. The word means a chest or box (see the note at [[Gen. 6:14]]). This one was made of papyrus, the King James “bulrushes,” and sealed with bitumen, its “slime,” and with pitch.

      Exodus does not say why it uses the word. One older reading holds that it “is probably intended to call to mind the ark in which Noah was saved.”

      The river is the other half of the picture. Pharaoh had ordered every Hebrew son cast into the river ([[Ex. 1:22]]), and that is where this mother puts her son. In one writer’s words she “entrusts her child to the waters meant to drown him.”
    sources: [bdb, keil-exodus, welch-saviors]
  - ref: 10
    phrase: he became her son
    kind: history
    title: A Hebrew raised in Pharaoh’s court
    body: |
      Moses spent his first years with his own mother and the rest of his youth in the royal household of Egypt. Exodus passes over those years in half a verse, and Stephen gives them one sentence ([[Acts 7:22]]). What can be added comes from what is known of the Egyptian court, and it is inference, not record.

      He was nursed by his mother “until the age of weaning, which was probably around three years old,” and “it is quite likely that at her knee he learned something of his heritage.” After that he “would have spent most of his growing years in the royal harem, the institution where Pharaoh insured that his family members were raised and educated properly.” In the period where the story is most likely set, foreign princes were also brought to court and schooled with Egypt’s elite, so “it is probable that Moses’s foreign origins were not hidden.” The study that draws this picture calls its own dating “speculative”; the question of the date is treated at [[Ex. 1:11]].

      Hebrews says what Moses did with that upbringing: “By faith Moses, when he was come to years, refused to be called the son of Pharaoh’s daughter” ([[Heb. 11:24]]), choosing “to suffer affliction with the people of God” ([[Heb. 11:25]]).
    sources: [muhlestein-israel-egypt, lds-scriptures]
  - ref: 10
    phrase: she called his name Moses
    kind: words
    title: 'Moses: an Egyptian name with a Hebrew meaning'
    body: |
      The name works in two languages, and each says something about the man. The Church’s footnote gives both senses; here is what lies behind them.

      In Egyptian, the name is “almost certainly Egyptian,” built on the root for “give birth” or “be born” that appears in royal names such as Thutmose, “born of Thoth,” and Rameses, “Ra has borne him.” The word “corresponds to the Egyptian word mose, meaning ‘son’ or ‘child.’” On one reading the verse itself plays on that meaning, setting the name beside the word “son”: “he became her son. And she called his name Moses.”

      In Hebrew, the narrator ties the name to a rare verb, *mashah*, “to draw out.” But the form of the name is active. It is “he who draws out,” where the princess’s explanation would lead us to expect “one drawn out.” On one reading, the name given for what was done to him says what he will do: it points to “his active role of drawing out Israel from Egypt as a deliverer.”

      Latter-day scripture adds that the name was foretold. In the prophecy of Joseph in Egypt that the Joseph Smith Translation restores, the Lord says of the coming deliverer, “he shall be called Moses. And by this name he shall know that he is of thy house; for he shall be nursed by the king’s daughter, and shall be called her son” (Joseph Smith Translation, Genesis 50:29). There too the name stands beside the word “son.”
    sources: [lds-scriptures, sc-knowhy-846, arp-moses-egyptian, jst-gen-50]
  - ref: 14
    phrase: Who made thee a prince and a judge over us?
    kind: scripture
    title: 'The deliverer refused: Stephen’s reading'
    body: |
      Stephen reads this question as Israel’s refusal of the deliverer God was sending them. In his telling Moses went out at forty expecting his brethren to see that God would deliver them by his hand ([[Acts 7:25]]). The killing of the Egyptian is, for Stephen, the act of a man who “defended him, and avenged him that was oppressed” ([[Acts 7:24]]); the Church’s study help likewise reads it as the defense of a life and not as murder. The refusal came the next day: “he that did his neighbour wrong thrust him away” ([[Acts 7:27]]).

      Stephen then answers the man’s question. Who made Moses a ruler and a judge? “This Moses whom they refused, saying, Who made thee a ruler and a judge? the same did God send to be a ruler and a deliverer” ([[Acts 7:35]]). The answer came forty years late and from a burning bush.

      That is the use Stephen makes of the chapter before the council. Israel refused Moses the first time he came, and “as your fathers did, so do ye” ([[Acts 7:51]]): his hearers had done the same to “the Just One” ([[Acts 7:52]]).
    sources: [lds-scriptures, scripture-helps-ex-1]
  - ref: 17
    phrase: Moses stood up and helped them
    kind: structure
    title: The meeting at the well
    body: |
      A man far from home who meets his future wife at a well is a scene Genesis has already told twice, of Abraham’s servant and Rebekah ([[Gen. 24:10–28]]) and of Jacob and Rachel ([[Gen. 29:1–12]]). Such scenes follow a pattern, “modeled after a basic outline, with the specifics being changed depending on the individual story being told,” and the changes are where the meaning lies.

      What is new in Moses’s scene is the fight. He “has to help the women at the well deal with interlopers before he can draw water,” and that looks ahead: “He will have to help deliver his people from oppressors in Egypt, just as he delivered the women from the rascals at the well.”

      The King James “helped” is a mild word for the Hebrew verb, *yasha‘*, which in this form means “deliver”: Moses stood up and delivered them. In the English of verse 19, where the Hebrew verb is a different one, the daughters tell their father the same: “An Egyptian delivered us.”
    sources: [sc-knowhy-854, oshb-wlc, bdb]
  - ref: 18
    phrase: Reuel their father
    kind: history
    title: Reuel, Jethro, and the priesthood Moses received
    body: |
      Moses’s father-in-law is one man with more than one name, a descendant of Abraham, and the man from whom Moses received the priesthood.

      **The names.** He is Reuel here and Jethro from [[Ex. 3:1]] on: Jethro, “also called Jether and Reuel, a prince and priest of Midian.” Why the names differ is not known. “Some scholars attribute the dual names to scribal error. Others say that perhaps Reuel was indeed his real name, but Jethro was his priestly name.”

      **Midian.** The Midianites descended from Abraham through his wife Keturah and their son Midian ([[Gen. 25:2]], with the note there). Their country is described as lying mostly east of the Jordan and the Dead Sea and reaching into the south and east of the Sinai Peninsula.

      **The priest.** Exodus calls him “the priest of Midian” and does not say here whose priest he was. Later he says, “Now I know that the LORD is greater than all gods” ([[Ex. 18:11]]), and offers sacrifices to God (see [[Ex. 18:12]]). The Joseph Smith Translation of [[Ex. 18:1]] calls him “the high priest of Midian.” Latter-day revelation says the most: Moses held “the Holy Priesthood which he received under the hand of his father-in-law, Jethro” ([[D&C 84:6]]), and Jethro’s own ordination is traced back, man by man, to the days of Abraham ([[D&C 84:7–14]]). This was the Melchizedek Priesthood.

      Neither Exodus nor the revelation says when this took place.
    sources: [bd-jethro, ot-minute-ex-1, scripture-helps-ex-1, jst-ex-18, lds-scriptures]
  - ref: 25
    phrase: God had respect unto them
    kind: words
    title: God heard, remembered, looked, and knew
    body: |
      The last verb of the chapter is, in Hebrew, simply “knew”: the Church’s footnote gives “and God knew,” and the King James translators filled it out as “had respect unto them.” With it the two closing verses give God four verbs in a row: He heard, He remembered, He looked, He knew.

      In one older reading, He “looked” on Israel “with attention and sympathy,” and He “knew” them in the sense that He “noticed, regarded them.” And when He remembered the covenant, “it was time for God to fulfil His promise of redeeming His people.” The covenant itself had foretold both the bondage and its end ([[Gen. 15:13–14]]).

      The same words return when God speaks for Himself. At the bush He tells Moses, “I have surely seen the affliction of my people which are in Egypt, and have heard their cry by reason of their taskmasters; for I know their sorrows” ([[Ex. 3:7]]); the Hebrew verbs for seeing, hearing, and knowing are those of these two verses. And later, with the verb of verse 24, He says, “I have remembered my covenant” ([[Ex. 6:5]]).
    sources: [lds-scriptures, oshb-wlc, cambridge-exodus, ot-minute-ex-1]

christ: |
  The Lord later tells Moses, “thou art in the similitude of mine Only Begotten” ([[Moses 1:6]]), and Moses himself promises a prophet “like unto me” ([[Deut. 18:15]]), which Peter applies to Jesus ([[Acts 3:22]]). The likeness begins in this chapter. The Church’s study help sets two of its moments beside Matthew’s account of the Savior’s infancy: each was saved as an infant from a king’s decree of death ([[Matt. 2:13–16]]), and each stayed in exile until the king who sought his life had died (verse 23 with [[Ex. 4:19]]; [[Matt. 2:19–20]]).

  Stephen sets the refusal of Moses beside what the council he was addressing had done to “the Just One” ([[Acts 7:52]]); the note on verse 14 follows his argument.

  And the God who hears, remembers, looks, and knows in the last verses is the LORD who speaks from the bush in the next chapter, who is Jehovah (see [[Ex. 3:14]]).

explore: |
  - **Stephen’s retelling.** Read [[Acts 7:17–36]] beside the chapter and mark what Stephen adds: the forty years, what Moses “supposed,” and the conclusion in verse 35.
  - **By faith.** [[Heb. 11:23–27]] tells the same events as choices. Hebrews says Moses left Egypt “not fearing the wrath of the king” ([[Heb. 11:27]]); set that beside verses 14–15 here.
  - **Joseph’s prophecy of Moses.** Read Joseph Smith Translation, Genesis 50:24–38 (in the appendix), with Lehi’s quotation of it in [[2 Ne. 3:9–10]] and [[2 Ne. 3:16–17]].
  - **Meetings at wells.** Compare [[Gen. 24:10–28]], [[Gen. 29:1–12]], and verses 15–21 here, and note what is different in each.
  - **From the palace to the wilderness.** Scripture Central’s “Why Did Moses Have to Walk a Sacred Path Before Delivering Israel?” reads Moses’s early life as a descent and an ascent, and sees the same pattern “repeated in the life of Jesus.” It is one reading, and it draws on [[Moses 1:1–25]].

parallels:
  - ref: Acts 7:20–29
    note: Stephen retells the chapter and adds that Moses was forty and expected his brethren to understand.
  - ref: Heb. 11:23–27
    note: The hiding of the child and Moses’s leaving Egypt, told as acts of faith.
  - ref: Ex. 6:20
    note: Names the parents, Amram and Jochebed; compare verse 1.
  - ref: D&C 84:6
    note: Moses received the Holy Priesthood under the hand of Jethro; compare verse 18.
  - ref: Ex. 3:7
    note: The LORD says in His own voice what verses 24–25 say of Him.

