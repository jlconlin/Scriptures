chapter: 22
title: Restitution, and the Stranger, the Widow, and the Poor
tagline: The judgments given at Sinai go on. A thief repays what he took and more, a keeper answers for what was left with him, and the LORD Himself promises to hear the stranger, the widow, the fatherless, and the poor man without his cloak.
when: 'At Sinai, in or after the third month from the departure (19:1), while Moses is with the LORD on the mount (20:21–22).'

setting: |
  The LORD is still speaking to Moses on Sinai. After the Ten Commandments the people stood far off, “and Moses drew near unto the thick darkness where God was” ([[Ex. 20:21]]). What he was given there runs to the end of chapter 23, and its heading stands at the start of chapter 21: “Now these are the judgments which thou shalt set before them” ([[Ex. 21:1]]). Moses will write these words down and read them to the people as “the book of the covenant,” and they will answer, “All that the LORD hath said will we do, and be obedient” ([[Ex. 24:7]]). What kind of law this is, and how it stands beside the law collections of Israel’s neighbors, is explained in the setting of chapter 21 (see [[Ex. 21:1]]).

  Chapter 22 begins in the middle of that speech. The cases at the end of chapter 21 concern an ox that gores or falls into a pit; this chapter opens with an ox that is stolen. The laws speak of fields, vineyards, standing grain, and houses, though Israel is camped in the wilderness: they are given “with a view of their eventual entry into the land of promise.”

  Later scripture keeps returning to the second half of the chapter. Deuteronomy restates its laws on pledges and on the stranger, the fatherless, and the widow ([[Deut. 24:10–22]]). Malachi names the same people when he says whom the Lord will witness against ([[Mal. 3:5]]). And Paul, on trial in Jerusalem, quotes verse 28 ([[Acts 23:5]]).

thread: |
  The chapter changes its voice halfway through. Verses 1–17 are case law, the form explained in the note on [[Ex. 21:1]]. Nearly every one begins “If” and ends with what must be paid. Their refrain is restitution: “he shall restore,” “he shall make restitution,” “he shall pay double,” “he shall surely make it good.” Together they can be read as “rules necessary to holding a community together.” When an animal is stolen, a field is grazed bare, or a borrowed ox dies, the person who lost something is made whole, and on one Latter-day Saint reading that restitution “ensured the *šālôm*—peace, integrity—of the community.”

  From verse 18 the voice changes. The LORD begins to speak to Israel directly, “Thou shalt not” and “Ye shall not,” the form of commands that hold “in all situations.” Some of what follows still begins with “if” (verses 23, 25, and 26), but what comes after it is a command or the LORD’s own warning, not a sum to be paid. Three offenses are punished with death (verses 18–20). Then come the people who have no one to take their part: the stranger, the widow, the fatherless child, and the poor man who has pledged his cloak. The property laws had judges and oaths to enforce them. Here the LORD says that He will hear them Himself (verses 23, 27). The reason He gives is Israel’s own past: “for ye were strangers in the land of Egypt.”

  The chapter ends, “ye shall be holy men unto me.” Israel “could not become” the LORD’s own people “if they treated others unethically and abused the weakest among them.”

sections:
  - range: 1-6
    heading: Theft and damage
    plain: |
      If a man steals an ox or a sheep and kills it or sells it, he is to repay five oxen for the ox and four sheep for the sheep. If a thief is caught breaking in and is struck so that he dies, no one bears guilt for his blood. But if the sun has risen on him, there is guilt for his blood. A thief must make full restitution; if he has nothing, he is to be sold for his theft. If the stolen animal is found alive in his hand, whether ox, donkey, or sheep, he repays double.

      If a man lets his animal loose and it grazes in another man’s field or vineyard, he is to make restitution from the best of his own field and the best of his own vineyard. If a fire breaks out and catches in thorns, so that stacked grain, standing grain, or the field is burned up, the one who kindled the fire must make restitution.
  - range: 7-15
    heading: Goods kept, lost, and borrowed
    plain: |
      If a man gives his neighbor money or goods to keep and they are stolen from that man’s house, the thief, if he is found, pays double. If the thief is not found, the master of the house is brought before the judges, to see whether he has laid his hand on his neighbor’s goods. In every case of trespass, whether over an ox, a donkey, a sheep, clothing, or any lost thing that another claims as his own, both parties come before the judges, and the one the judges condemn pays double to his neighbor.

      If a man gives his neighbor a donkey, an ox, a sheep, or any animal to keep, and it dies or is hurt or is driven away with no one seeing it, an oath of the LORD between the two settles it. The keeper swears that he has not laid his hand on his neighbor’s goods. The owner accepts the oath, and nothing is repaid. But if it was stolen from him, he makes restitution to its owner. If it was torn by a wild beast, he brings what is left as evidence and does not repay what was torn.

      If a man borrows something from his neighbor and it is hurt or dies while its owner is not with it, he must make it good. If the owner was with it, he does not. If it was hired, it came for its hire.
  - range: 16-20
    heading: Seduction, and three offenses punished with death
    plain: |
      If a man entices a virgin who is not betrothed and lies with her, he must pay the bride-price and take her as his wife. If her father utterly refuses to give her to him, he is still to pay money equal to the bride-price of virgins.

      You shall not allow a witch to live. Whoever lies with a beast shall be put to death. Whoever sacrifices to any god but the LORD alone shall be utterly destroyed.
  - range: 21-27
    heading: The stranger, the widow, the fatherless, and the poor
    plain: |
      Do not wrong a stranger or oppress him, for you were strangers in the land of Egypt. Do not afflict any widow or fatherless child. If you afflict them at all, and they cry out to me, I will surely hear their cry. My anger will burn, and I will kill you with the sword, and your wives will be widows and your children fatherless.

      If you lend money to any of my people who is poor among you, do not treat him as a usurer would, and do not charge him interest. If you take your neighbor’s garment as a pledge, give it back to him by sunset. It is his only covering, the clothing for his skin. What else will he sleep in? When he cries out to me, I will hear, for I am gracious.
  - range: 28-31
    heading: What is owed to God, and a holy people
    plain: |
      Do not revile God, and do not curse the ruler of your people. Do not delay to offer the first of your harvest and of what flows from your presses. Give me the firstborn of your sons. Do the same with your oxen and your sheep: the young one stays seven days with its mother, and on the eighth day you give it to me.

      You are to be holy men to me. Do not eat flesh torn by beasts in the field; throw it to the dogs.

notes:
  - ref: 1
    phrase: five oxen for an ox, and four sheep for a sheep
    kind: history
    title: Why five for an ox and four for a sheep
    body: |
      A thief repays more for an animal he has killed or sold than for one found alive, and more for an ox than for a sheep. An animal found alive in the thief’s hand goes back with a second like it (verse 4). One already killed or sold is repaid four or five times over.

      Two explanations of the scale have been offered, and they answer different halves of the question. One explains why an ox costs more than a sheep: to steal a sheep “is to steal the present and future value of a man’s property,” and the ox is dearer still because it “was trained to pull carts, and to plow.” One older reading explains why killing or selling the animal raises the price from double to fourfold. It finds the reason in “the educational purpose of the law”: while the animal is in his hands the thief can still repent and bring it back, and “the possibility was gone as soon as it had either been consumed or sold.”

      On either account the payment goes to the person who was wronged. In these cases there is “not only judgment by God against the offender but also restitution to the offended.” A thief with nothing to pay “shall be sold for his theft” (verse 3), so “that he might earn by his labour the compensation to be paid”; the terms and limits of such service are explained at [[Ex. 21:2]].

      David gives the same figure. When Nathan tells him of the rich man who took a poor man’s one ewe lamb, David rules at once, “he shall restore the lamb fourfold” ([[2 Sam. 12:6]]).
    sources: [ot-manual-ex-21-24, keil-exodus, lds-scriptures]

  - ref: 2
    phrase: there shall no blood be shed for him
    kind: words
    title: No blood be shed for him means no bloodguilt
    body: |
      The phrase is about guilt for a killing, and it means that a householder who kills a burglar in the dark is not held guilty of his blood. The Hebrew says only that “there shall be no blood to him,” where “blood” stands for bloodguilt. “For him” is the householder. In verse 3 the sun rises “upon him,” the thief, and the blood is again “for him,” the householder: once “the sun be risen,” whoever kills the thief does bear the guilt.

      “Breaking up” is the King James’s phrase for breaking in; the Hebrew pictures “digging through” a wall.

      One older reading gives the reason for the two rulings. By night “the power and intention of a nightly thief are uncertain, and whether he may not have come for the purpose of committing murder.” By day the case is different, “because even the life of a thief was to be spared, as he could be punished for his crime, and what was stolen be restored.”
    sources: [oshb-wlc, keil-exodus, cambridge-exodus, lds-scriptures]

  - ref: 16
    phrase: he shall surely endow her to be his wife
    kind: history
    title: The dowry is a bride-price
    body: |
      The payment in these two verses goes from the man to the woman’s father: it is a bride-price. The Hebrew noun behind “dowry” in verse 17 means the “purchase-price of wife,” and “endow” in verse 16 is the verb made from it, to “acquire by paying purchase-price.” It is the word Shechem uses when he asks for Dinah: “Ask me never so much dowry and gift” ([[Gen. 34:12]]).

      What the law requires, then, is that a man who seduces an unbetrothed woman may not walk away. He owes her marriage and owes her family the full bride-price. Her father may refuse him, and if he does the man pays all the same. On the law's provisions for women and marriage, see [Women and marriage in the Old Testament](/old-testament/guides/women-and-marriage/#the-law).
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 18
    phrase: a witch
    kind: scripture
    title: The Joseph Smith Translation reads murderer
    body: |
      In the Joseph Smith Translation this verse reads, “Thou shalt not suffer a murderer to live.” The King James “witch” stands for a Hebrew word meaning “sorceress,” one who practices what Deuteronomy says must not be found in Israel ([[Deut. 18:10]]).

      The change “reflects the notion, consistent elsewhere in the Mosaic legislation, that murder constitutes a capital crime.” The last chapter has already said so: “He that smiteth a man, so that he die, shall be surely put to death” ([[Ex. 21:12]]). It may also suggest that witchcraft, “though a grievous sin,” is “conceivably forgivable”; that is an inference from the change, and no more is claimed for it.
    sources: [jst-ex-22, bowen-law-codes, bdb, lds-scriptures]

  - ref: 20
    phrase: he shall be utterly destroyed
    kind: words
    title: Utterly destroyed means devoted to destruction
    body: |
      “Utterly destroyed” is one Hebrew verb, and not the “put to death” of the verse before: the offender is devoted to destruction. The verb is used “most often of devoting to destruction cities of Canaanites,” but also “of devoting even Israelites: a city of Israel for worshipping other gods.” The same form returns in Leviticus: “None devoted, which shall be devoted of men, shall be redeemed; but shall surely be put to death” ([[Lev. 27:29]]).

      The offense is sacrifice “unto any god, save unto the LORD only.” Here the law “again forbids worshipping or tolerating other gods,” and this time it names the penalty.
    sources: [bdb, oshb-wlc, bowen-law-codes, lds-scriptures]

  - ref: 21
    phrase: for ye were strangers in the land of Egypt
    kind: history
    title: The stranger, and the reason Israel is given
    body: |
      The stranger of this verse is a foreigner living among Israel, and Israel is told to protect him because the Israelites were once strangers themselves. In the law the word “is frequently used to denote a man of non-Israelite birth, resident in the promised land.” The Hebrew word means a “sojourner, temporary dweller, new-comer (no inherited rights).” The law’s provisions about such people “were intended to secure for them justice and fair treatment.”

      The reason attached to the command is memory. “The reminder that the Israelites had themselves lived as marginalized, enslaved, and displaced ‘strangers’ in Egypt helped them to recognize their obligation to care for their society’s weakest members and to do so with sympathy.” The next chapter puts it more inwardly: “ye know the heart of a stranger” ([[Ex. 23:9]]). The word had been Israel’s own since the promise to Abraham that his seed would be “a stranger in a land that is not theirs” ([[Gen. 15:13]]).

      The same reason comes back in Leviticus and Deuteronomy, and there the command goes further than not oppressing: “thou shalt love him as thyself; for ye were strangers in the land of Egypt” ([[Lev. 19:34]]); “Love ye therefore the stranger: for ye were strangers in the land of Egypt” ([[Deut. 10:19]]).
    sources: [bd-stranger, bdb, bowen-law-codes, lds-scriptures]

  - ref: 23
    phrase: I will surely hear their cry
    kind: scripture
    title: The LORD Himself answers for the widow and the fatherless
    body: |
      No court is named for this law: the LORD says that He will hear the complaint and carry out the sentence Himself. Human rulers are given no penalty to impose here; “the Lord reserved that right to Himself.” Those who afflict widows and orphans will leave widows and orphans of their own (verse 24).

      The wording is that of Israel’s own story. “Afflict” is the verb used of the taskmasters set over Israel “to afflict them with their burdens” ([[Ex. 1:11]]), and “cry” is the word the LORD used at the bush, when He said that He had “heard their cry” ([[Ex. 3:7]]). The reason given for the stranger in verse 21 reaches these two as well: Israel “had collectively been ‘the stranger,’ ‘the widow,’ and ‘the orphan’ (as it were) in times past.”

      Throughout the Hebrew Bible “the widow and the fatherless” becomes a name “for the most vulnerable members of its society,” and how they are treated is “a kind of spiritual barometer.” James defines “pure religion” by it: “To visit the fatherless and widows in their affliction” ([[James 1:27]]). A revelation to Joseph Smith makes the same provision for the Church: “widows and orphans shall be provided for, as also the poor” ([[D&C 83:6]]). These provisions are set beside the rest of the law in [Women and marriage in the Old Testament](/old-testament/guides/women-and-marriage/#the-law).
    sources: [ot-manual-ex-21-24, oshb-wlc, bowen-law-codes, lds-scriptures]

  - ref: 25
    phrase: neither shalt thou lay upon him usury
    kind: words
    title: Usury here is any interest, on a loan to the poor
    body: |
      “Usury” in this verse is interest of any amount, not only an excessive rate, and the loan in view is one made to a person in need. In biblical English the word “often means simply charging interest on a loan.”

      The borrower is “any of my people that is poor by thee,” and the limits of the law follow from that. The restriction seems to hold for loans within the covenant people, with no clear rule against charging others. Deuteronomy draws the line in so many words: “Unto a stranger thou mayest lend upon usury; but unto thy brother thou shalt not lend upon usury” ([[Deut. 23:20]]). Leviticus gives the purpose: “Take thou no usury of him, or increase: but fear thy God; that thy brother may live with thee” ([[Lev. 25:36]]).

      The law is not carried into the Restoration as a rule about lending: “Latter-day revelation does not contain restrictions against interest charges.”
    sources: [bd-usury, lds-scriptures]

  - ref: 27
    phrase: for I am gracious
    kind: scripture
    title: The cloak returned by sunset, and the reason given
    body: |
      The law about the pledged garment ends with the LORD’s own character as its reason: “I am gracious.” The garment is the outer cloak, which, one older reading explains, was “a large square piece of cloth” that the poor used “to sleep in.” To hold it past the working day, on one reading, “is equivalent to making him pledge his life.” Deuteronomy repeats the rule, “that he may sleep in his own raiment, and bless thee” ([[Deut. 24:13]]), and forbids taking a widow’s garment in pledge at all ([[Deut. 24:17]]).

      “Gracious” is a word the Hebrew Bible keeps for God. It is “only used as an attribute of God,” and here of God “as hearing the cry of the vexed debtor.” Exodus uses it once more, when the LORD proclaims His name to Moses as “merciful and gracious” (see [[Ex. 34:6]]).
    sources: [bdb, oshb-wlc, keil-exodus, ot-manual-ex-21-24, lds-scriptures]

  - ref: 28
    phrase: Thou shalt not revile the gods
    kind: scripture
    title: The gods, God, and the judges
    body: |
      The Joseph Smith Translation reads “Thou shalt not revile against God.” The Hebrew word is *elohim*, plural in form, which is the usual word for God and can also mean gods. “Most other English translations, like the JST, render” it “in the singular, as ‘God’ rather than plural ‘gods,’” while the King James “follows the Greek Septuagint,” the ancient Greek translation, which has “Thou shalt not revile the gods.”

      The same word is behind “the judges” in verses 8 and 9, where the Greek says the parties come “before God.” That use of the word is explained in the note on [[Ex. 21:6]].

      The verse sets God and the ruler side by side because “rejection of communal religious and political authority would have imperiled the Israelites’ existence.” Paul quotes its second half when he is rebuked for the way he answered the high priest: “it is written, Thou shalt not speak evil of the ruler of thy people” ([[Acts 23:5]]). In the Book of Mormon it is the charge that finally condemns Abinadi. He had withstood the charges of false prophecy and blasphemy, and was “executed for having reviled against the king”: “He has reviled the king” ([[Mosiah 17:12]]).
    sources: [lds-scriptures, bowen-law-codes, lxx-rahlfs, bdb, oshb-wlc, sc-knowhy-89]

  - ref: 29
    phrase: the firstborn of thy sons shalt thou give unto me
    kind: scripture
    title: How a firstborn son is given
    body: |
      A firstborn son was given to the LORD by being redeemed, as the law has already said: “all the firstborn of man among thy children shalt thou redeem” ([[Ex. 13:13]]). The LORD’s claim on the firstborn, its origin on the night of the Passover, and what became of it are explained at [[Ex. 13:2]].
    sources: [lds-scriptures]

  - ref: 31
    phrase: ye shall be holy men unto me
    kind: scripture
    title: What the judgments are for
    body: |
      The chapter’s last verse can be read as stating the purpose of what comes before it: a people holy to the LORD. It takes up the offer made when Israel reached Sinai, “ye shall be unto me a kingdom of priests, and an holy nation” (see [[Ex. 19:6]]). Both verses have been compared with the Savior’s words “that ye may be the children of your Father” ([[Matt. 5:45]]), in which He was perhaps restoring “the true *telos* to which that legislation had been given,” its end and aim.

      The rule attached to it is small and concrete. Meat torn by wild beasts is not to be eaten. Leviticus counts such meat as defiling: whoever eats “that which was torn with beasts” is “unclean until the even” ([[Lev. 17:15]]).
    sources: [lds-scriptures, bowen-law-codes]

christ: |
  The LORD who gives these judgments is Jehovah (see [[Ex. 3:14]]), and twice in this chapter He says what He will do when the weak cry to Him: “I will surely hear their cry”; “I will hear; for I am gracious.”

  In His mortal ministry He counted what is done for such people as done to Himself. “I was a stranger, and ye took me in,” He says of the day of judgment, and “Inasmuch as ye have done it unto one of the least of these my brethren, ye have done it unto me” ([[Matt. 25:35, 40]]). That saying has been joined to the law’s care for the widow and the fatherless: the “pure religion” of James consists in “meeting the needs of those whom Jesus characterizes as ‘the least of these,’ his brothers and sisters.”

explore: |
  - **The reason repeated.** [[Ex. 23:9]]; [[Lev. 19:33–34]]; [[Deut. 10:17–19]], where the LORD is the one who “loveth the stranger.”
  - **Deuteronomy’s restatement.** [[Deut. 24:10–22]] twice gives the reason (verses 18 and 22): “thou shalt remember that thou wast a bondman.”
  - **The prophets hold Israel to it.** [[Mal. 3:5]], which the risen Lord repeats to the Nephites ([[3 Ne. 24:5]]).
  - **Restitution joined to an offering.** [[Lev. 6:2–5]], where what was taken is restored with a fifth part added.
  - **Borrowing among the Nephites.** [[Mosiah 4:28]], King Benjamin on returning what is borrowed.

