chapter: 18
title: Jethro’s Counsel
tagline: Jethro, the priest of Midian, brings Moses’s wife and sons to the camp at the mount of God, blesses the LORD for Israel’s deliverance, and offers sacrifice. The next day he watches Moses judge the people alone from morning to evening and counsels him to share the burden with able men.
when: 'As the book orders it, after the battle with Amalek at Rephidim (17:8–16) and before Israel comes into the wilderness of Sinai “in the third month” (19:1). The chapter itself gives no date (see the note on verse 5).'

setting: |
  Israel has crossed the sea, eaten manna, drunk from the rock, and fought off Amalek at Rephidim ([[Ex. 17:8–13]]). The next visitor comes in peace. Jethro is the priest of Midian in whose house Moses lived after he fled from Pharaoh. Moses married his daughter Zipporah and was keeping his flock when the LORD called him at the bush ([[Ex. 3:1]]). Who Jethro was, and the priesthood Moses received from him, are treated at [[Ex. 2:18]].

  The chapter is two scenes on two days. In the first (verses 1–12) Jethro arrives with Zipporah and the two boys, hears from Moses what the LORD has done, and answers with a blessing, a confession and a sacrifice. In the second (verses 13–27) he sees his son-in-law sitting as the only judge for the whole camp and counsels him to share the judging with able men. Then he goes home. It is the last chapter before Sinai: in the next one Israel camps before the mount and the covenant is offered.

  Other scripture takes up both halves. Moses retells the appointing of the judges in his own words ([[Deut. 1:9–18]]). Latter-day revelation names Jethro as the man under whose hand Moses received “the Holy Priesthood” ([[D&C 84:6]]), and it organizes a later camp of Israel under captains of hundreds, fifties and tens ([[D&C 136:3]]).

thread: |
  Each half of the chapter turns on something Jethro perceives. In the first he *hears*. Verse 1 opens with what he “heard of all that God had done,” verse 8 has Moses tell him the whole of it, and verses 9–12 give his answer in four steps: he rejoices, he blesses the LORD, he says “Now I know,” and he offers sacrifice. The deliverance from Egypt is confessed here by a man who was not in Egypt to see it.

  In the second half he *sees*. “When Moses’ father in law saw all that he did to the people,” he asked a question with one word at its center: “why sittest thou thyself alone?” (verse 14). The word comes back in his verdict, “thou art not able to perform it thyself alone” (verse 18), and the remedy answers it: “they shall bear the burden with thee” (verse 22).

  The counsel does not take Moses’s calling from him. It sorts his work in two. Moses keeps the work of standing before God for the people, bringing the hard causes to God, and teaching the ordinances and laws (verses 19–20). The everyday judging goes to men chosen for their character (verses 21–22).

sections:
  - range: 1-6
    heading: Jethro comes with Zipporah and the boys
    plain: |
      Jethro, the priest of Midian and Moses’s father-in-law, heard of all that God had done for Moses and for His people Israel, and that the LORD had brought Israel out of Egypt. Moses had sent his wife Zipporah back, and Jethro now took her and her two sons. One was named Gershom, because Moses had said, “I have been a sojourner in a foreign land.” The other was named Eliezer, because he had said, “The God of my father was my help, and delivered me from the sword of Pharaoh.”

      Jethro came with Moses’s sons and wife into the wilderness where Moses was camped, at the mount of God. He sent word to Moses: “I, your father-in-law Jethro, am coming to you, with your wife and her two sons.”
  - range: 7-12
    heading: “Now I know that the LORD is greater than all gods”
    plain: |
      Moses went out to meet his father-in-law, bowed to him, and kissed him. They asked after each other’s welfare and went into the tent. Moses told him everything the LORD had done to Pharaoh and the Egyptians for Israel’s sake, all the hardship that had met them on the way, and how the LORD had delivered them.

      Jethro rejoiced over all the good the LORD had done for Israel in delivering them from the Egyptians. He said, “Blessed be the LORD, who has delivered you from the hand of the Egyptians and of Pharaoh, and has delivered the people from under the hand of the Egyptians. Now I know that the LORD is greater than all gods, for in the very thing in which they acted proudly He was above them.” Then Jethro brought a burnt offering and sacrifices for God, and Aaron came with all the elders of Israel to eat bread with Moses’s father-in-law before God.
  - range: 13-18
    heading: Moses judges alone, from morning to evening
    plain: |
      The next day Moses sat to judge the people, and they stood around him from morning until evening. When his father-in-law saw all that he was doing for the people, he said, “What is this that you are doing for the people? Why do you sit alone, with all the people standing around you from morning until evening?”

      Moses answered, “Because the people come to me to inquire of God. When they have a dispute they come to me, and I judge between one person and another, and I make known to them the statutes of God and His laws.”

      His father-in-law said, “What you are doing is not good. You will surely wear yourself out, you and these people with you. The task is too heavy for you; you cannot do it by yourself.”
  - range: 19-23
    heading: Jethro’s counsel
    plain: |
      “Listen to me now. I will give you counsel, and God be with you. You be the one who stands before God for the people and brings their cases to God. Teach them the ordinances and the laws, and show them the way they must walk and the work they must do.

      “And look among all the people for able men who fear God, men of truth who hate covetousness. Set them over the people as rulers of thousands, of hundreds, of fifties, and of tens. Let them judge the people at all times. Every great matter they will bring to you, but every small matter they will judge themselves. That will make it lighter for you, and they will bear the burden with you. If you do this, and God so commands you, you will be able to endure, and all these people will go to their place in peace.”
  - range: 24-27
    heading: Moses does as Jethro said
    plain: |
      Moses listened to his father-in-law and did all that he had said. He chose able men out of all Israel and made them heads over the people: rulers of thousands, of hundreds, of fifties, and of tens. They judged the people at all times. The hard cases they brought to Moses, and every small matter they judged themselves. Then Moses let his father-in-law go, and Jethro went back to his own land.

notes:
  - ref: 2
    phrase: after he had sent her back
    kind: history
    title: Zipporah and the sons come back
    body: |
      Exodus never tells of Moses sending his family back to Midian; this verse simply assumes that he had. When he set out for Egypt he “took his wife and his sons, and set them upon an ass” ([[Ex. 4:20]]), and Zipporah is last seen at the lodging place on the road (see [[Ex. 4:24]]). After that the family is not mentioned until now.

      So the most that can be said is that the sending back happened “sometime between the time that Moses and Zipporah had gone to Egypt in Exodus 4:20 and Exodus 18.” The book gives no reason. One suggestion is that it was “perhaps for safety reasons.”

      Chapter 2 told of the birth of Gershom only ([[Ex. 2:22]]); here the second son is named, Eliezer. And in verse 6 Jethro “said” his greeting before the two men had met: the sense is that he “sent word” ahead, which is how the paraphrase above gives it.
    sources: [ot-minute-ex-18, lds-scriptures]

  - ref: 5
    phrase: where he encamped at the mount of God
    kind: history
    title: 'When Jethro came: before Sinai or after'
    body: |
      The chapter stands before Israel reaches Sinai, yet several of its details sound as though Israel were already there, and the question of when the visit took place is not settled.

      **The difficulty.** Israel comes “into the wilderness of Sinai” only in the next chapter, having “departed from Rephidim” ([[Ex. 19:1–2]]). But Jethro finds Moses camped “at the mount of God.” Moses is already making known “the statutes of God, and his laws” (verse 16). And when Moses himself retells the appointing of the judges, he sets it “at that time” ([[Deut. 1:9]]). That was the time when the Lord said, “Ye have dwelt long enough in this mount” ([[Deut. 1:6]]), as Israel was about to leave Horeb, not as it arrived.

      The Church’s study help for these chapters says that Jethro gave his counsel “while the Israelites camped near Mount Sinai,” and goes no further into the order of events.

      **Two older readings.** One keeps the visit where it stands. Rephidim, on this reading, was itself at Horeb (the rock struck there is “the rock in Horeb,” [[Ex. 17:6]]), so that the mention of the mount of God “is an argument in favour of Rephidim, rather than against it,” and the days at Rephidim left “amply sufficient time” for the sacrifice, the day of judging and the choosing of the judges. The other holds that the camp of verse 5 “cannot be Rephidim” and “can only be the ‘wilderness of Sinai,’” and that Deuteronomy “quite clearly places the episode at the close of the Israelites’ sojourn at Horeb”; on that view the visit is told here earlier than it happened.

      On Horeb and Sinai as two names for one mountain, see [[Ex. 3:1]].
    sources: [scripture-helps-ex-14, keil-exodus, cambridge-exodus, lds-scriptures]

  - ref: 11
    phrase: Now I know that the LORD is greater than all gods
    kind: scripture
    title: What Jethro now knows
    body: |
      Jethro’s words say back to Israel what the deliverance from Egypt was meant to teach. Before the plagues the LORD had told Israel, “ye shall know that I am the LORD your God, which bringeth you out from under the burdens of the Egyptians” ([[Ex. 6:7]]). Jethro’s “Now I know” is “exactly the point that God made to the Israelites during the plagues.”

      The man who says it is no stranger to the priesthood. The Joseph Smith Translation of verse 1 calls him “the high priest of Midian,” and latter-day revelation speaks of “the Holy Priesthood which he received under the hand of his father-in-law, Jethro” ([[D&C 84:6]]). The full note is at [[Ex. 2:18]]. The reason he gives for what he now knows is the event Moses has just told him.

      That reason is compressed in the King James Version: “for in the thing wherein they dealt proudly he was above them.” A modern translation fills it out: the LORD is greater than all gods “because he delivered the people from the Egyptians, when they dealt arrogantly with them.” The “they” are the Egyptians. Nehemiah’s prayer uses the King James phrase of Pharaoh, his servants and his people: “thou knewest that they dealt proudly against them” ([[Neh. 9:10]]).

      For the judgment “against all the gods of Egypt,” see [[Ex. 12:12]].
    sources: [ot-minute-ex-18, jst-ex-18, nrsvue, lds-scriptures]

  - ref: 12
    phrase: to eat bread with Moses’ father in law before God
    kind: history
    title: The meal before God
    body: |
      On one older reading, the bread eaten “before God” is a sacrificial meal, not an ordinary supper: the verse joins it to the burnt offering and sacrifices Jethro has just brought. To eat bread here is “to take part in the sacred meal accompanying the sacrifice.” The sacrifice was of the kind later called a peace offering, “an essential part of which was the accompanying sacred meal, in which the worshipper and his friends partook,” and “before God” means “before the altar, presupposed by the sacrifices.”

      The elders of Israel eat in God’s presence once more, on the mountain itself. The covenant meal is treated at [[Ex. 24:11]].
    sources: [cambridge-exodus, lds-scriptures]

  - ref: 19
    phrase: Be thou for the people to God-ward
    kind: words
    title: What “to God-ward” means
    body: |
      “To God-ward” means toward God, in front of Him: Moses is to stand before God on the people’s behalf. A modern translation has “You should represent the people before God and bring their cases to God.”
    sources: [nrsvue]

  - ref: 21
    phrase: able men, such as fear God, men of truth, hating covetousness
    kind: words
    title: The four marks of a judge
    body: |
      The four qualifications describe character more than skill, and the Hebrew sharpens two of the King James words.

      “Able men” renders a phrase whose noun means “strength, efficiency,” and in this verse “ability, efficiency, often involving moral worth.”

      The word behind “covetousness” means, in this verse, “unjust gain,” and a modern translation accordingly reads men who “hate dishonest gain.”
    sources: [bdb, oshb-wlc, nrsvue]

  - ref: 23
    phrase: and God command thee so
    kind: scripture
    title: Counsel given subject to God’s command
    body: |
      Jethro does not ask Moses to reorder Israel on a father-in-law’s word alone: the plan is to be carried out if “God command thee so.” Exodus then says only that Moses “did all that he had said” (verse 24).

      Moses’s own retelling shows more of how it was done. He told the people, “I am not able to bear you myself alone” ([[Deut. 1:9]]). He had them put the men forward: “Take you wise men, and understanding, and known among your tribes, and I will make them rulers over you” ([[Deut. 1:13]]). And he gave the judges a charge that Exodus does not record: “Ye shall not respect persons in judgment; but ye shall hear the small as well as the great; ye shall not be afraid of the face of man; for the judgment is God’s: and the cause that is too hard for you, bring it unto me, and I will hear it” ([[Deut. 1:17]]).
    sources: [lds-scriptures]

christ: |
  The chapter’s witness of Christ is in what Jethro says of the LORD. He blesses “the LORD, who hath delivered you out of the hand of the Egyptians,” and confesses Him “greater than all gods” (verses 10–11). The LORD of Exodus is Jehovah, the premortal Jesus Christ (see [[Ex. 3:14]]), so the Deliverer whom the priest of Midian praises is the Savior.

explore: |
  - **The seventy elders.** [[Num. 11:10–17]] and [[Num. 11:24–25]], where Moses again says the people are “too heavy” for him to bear “alone,” and the LORD gives him seventy elders to “bear the burden of the people with thee.”
  - **The priesthood line through Jethro.** [[D&C 84:6–16]] traces it from Moses back to Adam.
  - **A later camp of Israel.** [[D&C 136:1–16]], the organization of the companies for the journey west.
  - **Judges among the Nephites.** The Church’s footnote at verse 13 points to [[Mosiah 29:11]], where King Mosiah proposes “wise men to be judges, that will judge this people according to the commandments of God.”

