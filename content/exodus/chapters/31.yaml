chapter: 31
title: The Builders, the Sabbath, and the Tables
tagline: The LORD names the craftsmen who will build His house and fills them with His Spirit, sets the Sabbath over their work as the sign of the covenant, and gives Moses the two tables written with the finger of God.
when: 'At the end of Moses’s forty days and forty nights on Mount Sinai (24:18).'

setting: |
  Moses has been on Mount Sinai, in the cloud, for forty days and forty nights ([[Ex. 24:18]]). Since chapter 25 the LORD has been showing him the tabernacle: its furnishings, its tent and court, its priests and their clothing, its oil and incense (see [[Ex. 25:8]] for the tabernacle as the LORD’s house). This chapter closes those instructions in three parts. The LORD names the men who will make it (verses 1–11). He commands the Sabbath, and calls it a sign (verses 12–17). And He gives Moses the tables of stone that Moses was called up the mountain to receive (verse 18; see [[Ex. 24:12]]).

  Each of the three returns later in the book. Moses announces the builders to the people in nearly the same words at [[Ex. 35:30–35]], and they set to work in chapter 36. When he gathers the congregation to begin, the Sabbath is the first thing he says ([[Ex. 35:1–3]]). The tables do not survive the descent (see [[Ex. 32:19]]).

  The verse after this chapter begins the story of the golden calf ([[Ex. 32:1]]). While the LORD is finishing the pattern of His house and writing the tables, the people at the foot of the mountain have given up on Moses.

thread: |
  Six chapters have said what is to be made. This one says who will make it, when the making must stop, and what Moses is to carry down.

  The first two parts stand side by side: work, and rest from work. Bezaleel is filled with the Spirit of God for “all manner of workmanship,” and a list of everything he and his fellows are to make runs from the tabernacle itself to the incense (verses 7–11). Then, with the list barely finished, the LORD says that “whosoever doeth any work” on the seventh day shall be put to death. The order may itself be the point (see the first note on verse 13).

  The Sabbath is then given a name it has not had before in Exodus. In chapter 16 it was given ([[Ex. 16:29]]) and in chapter 20 commanded; here it is “a sign between me and you,” the mark of the covenant made at this mountain. It is called so only now, after the tabernacle and its priesthood have been described. One reading of that timing is that the house where the LORD will dwell and the priests who will serve in it belong to the same covenant as the day that marks His people.

  The reason the chapter gives for the day is the Creation: “in six days the LORD made heaven and earth, and on the seventh day he rested.” The call of the builders and the Sabbath law can be read in that light, as joining the making of the tabernacle to the making of the world (see the notes on verses 3 and 13).

  Verse 18 ends the forty days. Moses went up for the tables, and they are the last thing put into his hands.

sections:
  - range: 1-11
    heading: The builders called by name
    plain: |
      The LORD said to Moses, “See, I have called by name Bezaleel the son of Uri, the son of Hur, of the tribe of Judah. I have filled him with the Spirit of God, with wisdom, understanding, knowledge, and every kind of craftsmanship: to make artistic designs, to work in gold, silver, and brass, to cut and set stones, to carve wood, and to do every kind of work.

      “And I have appointed Aholiab the son of Ahisamach, of the tribe of Dan, to work with him. Into the hearts of all who are skilled I have put skill, so that they may make everything I have commanded you: the tabernacle of the congregation, the ark of the testimony and the mercy seat on it, and all the furnishings of the tent; the table and its vessels, the pure candlestick and all its vessels, and the altar of incense; the altar of burnt offering and all its vessels, and the laver and its base; the cloths of service, the holy garments for Aaron the priest and the garments of his sons for their service as priests; and the anointing oil and the sweet incense for the holy place. They are to do everything just as I have commanded you.”
  - range: 12-17
    heading: The Sabbath, a sign for ever
    plain: |
      The LORD said to Moses, “Say this also to the children of Israel: Be sure to keep my sabbaths. The Sabbath is a sign between me and you through your generations, so that you may know that I am the LORD who makes you holy.

      “Keep the Sabbath, because it is holy to you. Anyone who defiles it shall be put to death; whoever does any work on it shall be cut off from among his people. Work may be done for six days, but the seventh day is a sabbath of rest, holy to the LORD. Whoever does any work on the Sabbath day shall be put to death.

      “So the children of Israel are to keep the Sabbath, observing it through their generations as a perpetual covenant. It is a sign between me and the children of Israel for ever. For in six days the LORD made heaven and earth, and on the seventh day He rested and was refreshed.”
  - range: 18-18
    heading: The tables given
    plain: |
      When He had finished speaking with Moses on Mount Sinai, He gave him the two tables of the testimony, tables of stone, written with the finger of God.

notes:
  - ref: 2
    phrase: I have called by name Bezaleel
    kind: history
    title: Bezaleel and Aholiab
    body: |
      The LORD appoints two craftsmen, Bezaleel of Judah and Aholiab of Dan, to build the tabernacle. Nearly all that is known of them is in this chapter and in the chapters where the work is done. To be “called by name” is, in one older reading, “to choose or appoint by name for a particular work.”

      Bezaleel has the leading part. He is named first here and wherever both appear, and several parts of the work are credited to him alone (see [[Ex. 37:1]]; [[Ex. 38:22]]); the same reading calls him “the master-builder.” Aholiab is “given with him,” and is described later as an engraver and an embroiderer ([[Ex. 38:23]]). Behind them stand “all that are wise hearted” (verse 6), the unnamed men and women who do much of the making (see [[Ex. 35:25]]).

      Bezaleel’s grandfather is Hur. Whether this is the Hur who held up Moses’s hands against Amalek and was left with Aaron in charge of the camp (see [[Ex. 17:12]]; [[Ex. 24:14]]) the text does not say. One older commentary takes it that he is; another finds “no sufficient grounds” for it. Chronicles keeps the same three generations in the line of Judah: “Hur begat Uri, and Uri begat Bezaleel” ([[1 Chr. 2:20]]).

      Chronicles also preserves a last sight of his work. In Solomon’s day “the brasen altar, that Bezaleel the son of Uri, the son of Hur, had made” still stood before the tabernacle at Gibeon ([[2 Chr. 1:5]]).

      When Moses presents the two men to Israel he adds something this chapter does not say: the LORD has put it in their hearts to teach ([[Ex. 35:34]]).
    sources: [keil-exodus, cambridge-exodus, lds-scriptures]

  - ref: 3
    phrase: I have filled him with the spirit of God
    kind: scripture
    title: The Spirit of God given for a craft
    body: |
      What the Spirit of God gives Bezaleel is skill: the ability to design and to work metal, stone, and wood. The “wisdom” named in this verse and in verse 6 is skill “in technical work,” and the “wise hearted” are those “skilful in technical work,” among them the artisans of the tabernacle and the women who spun for it.

      The gift does not replace ability. In verse 6 the LORD puts wisdom in the hearts of those the verse calls wise hearted. It is “likely” that Bezaleel and Aholiab “learned their skills while enslaved in Egypt,” so that the LORD turned what the bondage had taught them to the building of His house; the text does not say so.

      The phrase is the one used at the Creation, when “the Spirit of God moved upon the face of the waters” ([[Gen. 1:2]]). One study of the tabernacle reads the echo as deliberate: the Spirit of God is “instrumental both in the building of the cosmic temple, the world,” and in the building of the tabernacle. On that reading the tabernacle is made as the world was made, by the same Spirit.

      The priests’ garments were assigned to the same “wise hearted” workers at [[Ex. 28:3]].
    sources: [bdb, ot-minute-ex-25, morales-tabernacle, lds-scriptures]

  - ref: 13
    phrase: Verily my sabbaths ye shall keep
    kind: structure
    title: Why the Sabbath is commanded again here
    body: |
      The Sabbath law comes last in the instructions for the tabernacle, and two reasons have been given for its place. The Sabbath was already kept (see [[Ex. 16:23]]) and already commanded (see [[Ex. 20:8]]), so its return here needs explaining.

      The first reason is practical, and it is offered as a possibility. A people eager to build the LORD’s house might suppose that such a work could not wait for a day of rest. Perhaps the command stands here to say that it can: they were to “rest on the seventh day—even from constructing the tabernacle.” When Moses passes the instructions on, he puts the Sabbath before everything else and adds that no fire is to be kindled on it ([[Ex. 35:2–3]]), a rule that would reach the fires “needed to forge the gold, silver, and brass” as well as those in the tents.

      The second reason is in how the instructions are arranged. One study counts them as “seven speeches (with the seventh addressing the Sabbath)” and compares the seven with the week of Creation, which this passage itself calls to mind in verse 17. In that reading “the Sabbath, therefore, forms a bridge” between the making of the world and the making of the tabernacle. This is a proposal about the shape of the text, and the text does not number the speeches.
    sources: [ot-minute-ex-25, morales-tabernacle, lds-scriptures]

  - ref: 13
    phrase: it is a sign between me and you
    kind: scripture
    title: The sign of the covenant
    body: |
      Calling the Sabbath a “sign” puts it beside the rainbow and circumcision as the mark of a covenant. Of the rainbow God said to Noah, “it shall be for a token of a covenant between me and the earth” ([[Gen. 9:13]]), and of circumcision to Abraham, “it shall be a token of the covenant betwixt me and you” ([[Gen. 17:11]]). The Hebrew word behind “token” in the first of these is the word rendered “sign” in this passage. So the covenant with Noah had the bow, the covenant with Abraham had circumcision, and “the sign of the Mosaic covenant was the keeping of the Sabbath day.”

      A sign in this sense is not a single event. Signs “are physical acts that continue to be repeated in subsequent generations to confirm the existence of the covenant,” and the passage says twice that the Sabbath is to be kept through Israel’s generations (verses 13, 16).

      The verse also says what the sign is for: “that ye may know that I am the LORD that doth sanctify you.” Ezekiel repeats the sentence almost word for word when he tells how Israel treated the day in the wilderness (see [[Ezek. 20:12]]).

      The commandment itself and its two reasons are treated at [[Ex. 20:8]].

      [The Sabbath and the Making of the Tabernacle](/exodus/themes/sabbath-and-tabernacle/) follows the Sabbath from the manna to the building of the tabernacle and its finishing.
    sources: [hopkin-covenant, oshb-wlc, lds-scriptures]

  - ref: 14
    phrase: shall surely be put to death
    kind: history
    title: The death penalty for breaking the Sabbath
    body: |
      The law sets death as the penalty for working on the Sabbath, and one older reading explains the severity from the verses just before: the day is the sign of the covenant, and its desecration was punished with death “as a breach of the covenant.” The penalty is stated twice (verses 14, 15) and once more when Moses delivers the law to the people ([[Ex. 35:2]]).

      Scripture records one case in which the penalty was carried out. In the wilderness “they found a man that gathered sticks upon the sabbath day” ([[Num. 15:32]]); he was held until the LORD’s word was given, and then put to death outside the camp ([[Num. 15:36]]).

      The book of the covenant uses the same words of one who strikes a man so that he dies: he “shall be surely put to death” ([[Ex. 21:12]]).
    sources: [keil-exodus, lds-scriptures]

  - ref: 17
    phrase: and was refreshed
    kind: words
    title: “He rested, and was refreshed”
    body: |
      “Was refreshed” translates a Hebrew verb that means to “take breath,” and it is the one new word in a sentence otherwise taken from the fourth commandment. “In six days the LORD made heaven and earth” repeats the commandment, which says only that He “rested the seventh day” ([[Ex. 20:11]]). This verse adds that He was refreshed.

      Two other verses have the verb, and both are about people. David and those who fled with him from Absalom “came weary, and refreshed themselves” ([[2 Sam. 16:14]]). And the Sabbath law in the book of the covenant gives as its purpose that “the son of thy handmaid, and the stranger, may be refreshed” ([[Ex. 23:12]]). The word used there for the relief of a servant’s child and a foreigner at the end of a week’s labor is the word used here of the LORD at the end of the Creation.

      The passage does not explain the expression.
    sources: [bdb, lds-scriptures]

  - ref: 18
    phrase: written with the finger of God
    kind: scripture
    title: The tables of testimony
    body: |
      The two tables are the writing from God’s own hand that Moses was called up the mountain to receive (see [[Ex. 24:12]]). Their name, “tables of testimony,” is the name that the ark and the tabernacle take from them. “Testimony” here is the Ten Commandments themselves, the “testimony of the Ten Words on the tables as a solemn divine charge.” Because the tables were to lie in the ark, it is “the ark of the testimony” (verse 7; see [[Ex. 25:16]]).

      “Written with the finger of God” means that the writing was not Moses’s. The next chapter says so without a figure: “the tables were the work of God, and the writing was the writing of God, graven upon the tables” ([[Ex. 32:16]]). Moses uses the phrase again when he retells the day ([[Deut. 9:10]]). It was first heard in Exodus from Pharaoh’s magicians (see [[Ex. 8:19]]).

      What the Ten Commandments are and how they are counted is told in chapter 20. What these first tables held, and how the second pair differed from them, is told at [[Ex. 34:1]].
    sources: [bdb, lds-scriptures]

christ: |
  The Sabbath is given here as a sign of who the LORD is: “that ye may know that I am the LORD that doth sanctify you.” The LORD who says so is Jehovah (see [[Ex. 3:14]]), and in His ministry He claimed the day as His own: “the Son of man is Lord also of the sabbath” ([[Mark 2:28]]).

  Paul sets the tables of stone beside another writing. The Saints at Corinth are “the epistle of Christ … written not with ink, but with the Spirit of the living God; not in tables of stone, but in fleshy tables of the heart” ([[2 Cor. 3:3]]).

explore: |
  - **The builders at work.** [[Ex. 35:30–36:7]], where Bezaleel and Aholiab are presented to the people and the offerings outrun the need.
  - **The sign in Ezekiel.** [[Ezek. 20:10–24]], where Ezekiel retells Israel’s years in the wilderness and what became of the Sabbath there.
  - **The Sabbath and the covenant in Isaiah.** [[Isa. 56:1–7]] and [[Isa. 58:13–14]].
  - **The Lord of the Sabbath.** [[Mark 2:23–3:6]].
  - **The Lord’s day in the latter days.** [[D&C 59:9–14]].
  - **A rest that remains.** [[Heb. 4:1–11]], where the seventh day of the Creation becomes a promise still open to the people of God.

