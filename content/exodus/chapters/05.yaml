chapter: 5
title: Bricks without Straw
tagline: Moses and Aaron carry the Lord’s word to Pharaoh, who answers “Who is the LORD?” and makes Israel’s labor heavier, until the people blame Moses and Moses asks the Lord why he was sent.
when: 'Moses’s eightieth year (by 7:7); the first audience with Pharaoh'

setting: |
  Chapter 4 closed with the elders of Israel believing Moses and Aaron and bowing their heads in worship ([[Ex. 4:29–31]]). Chapter 5 is the first audience with Pharaoh, and it goes badly. The Lord had told Moses that it would: “I am sure that the king of Egypt will not let you go, no, not by a mighty hand” ([[Ex. 3:19]]; the hardening of Pharaoh’s heart is treated at [[Ex. 4:21]]). The king is not named, here or anywhere in the book; [[Ex. 1:11]] has the note on who he may have been.

  The king Moses faced was more than a ruler: he was held to stand between the gods and his people and to be divine himself.

  The chapter has no sign and no plague. It ends with a question from Moses that the Lord answers in the first verse of chapter 6, so the story runs straight on. In the Book of Mormon, King Noah answers the prophet Abinadi with Pharaoh’s question ([[Mosiah 11:27]]).

thread: |
  Exodus 5 turns on Pharaoh’s question: **“Who is the LORD, that I should obey his voice?”** (verse 2). The rest of the chapter is his own answer in practice, and the chapters that follow are the Lord’s.

  Two kings speak here, and each has messengers who begin “Thus saith.” Moses and Aaron bring the word of “the LORD God of Israel” (verse 1); the taskmasters go out with “Thus saith Pharaoh” (verse 10). On this first day it is Pharaoh’s word that comes to pass. He gives his order “the same day” (verse 6), the straw stops, the count of bricks stands, and the Israelite foremen are beaten when it is not met.

  Then the damage spreads inward. The foremen go to Pharaoh as “thy servants” and hear twice that they are idle. They come out and call down the LORD’s judgment on Moses and Aaron. The people who bowed their heads at the end of chapter 4 now have a harder life than before Moses came, and they say so.

  Moses takes that to the Lord in words as blunt as theirs: “neither hast thou delivered thy people at all” (verse 23). The answer is the next verse: “Now shalt thou see what I will do to Pharaoh” ([[Ex. 6:1]]). One reading of the setback is that Israel was being brought to a point where it could lean neither on Pharaoh and his foremen nor on its own resources, and would “have to rely on Him alone.”

sections:
  - range: 1-5
    heading: '“Let my people go”'
    plain: |
      Afterward Moses and Aaron went in to Pharaoh and said, “This is what the LORD, the God of Israel, says: Let My people go, so that they may hold a feast to Me in the wilderness.” Pharaoh said, “Who is the LORD, that I should obey Him and let Israel go? I do not know the LORD, and I will not let Israel go.” They said, “The God of the Hebrews has met with us. Please let us go three days’ journey into the desert and sacrifice to the LORD our God, or He may strike us with disease or with the sword.” The king of Egypt said, “Moses and Aaron, why are you keeping the people from their work? Get back to your labor.” And he added, “Look how many these people are now, and you would have them stop working.”
  - range: 6-14
    heading: The same bricks, and no straw
    plain: |
      That same day Pharaoh gave orders to the taskmasters over the people and to their foremen: “Do not give the people straw for making bricks any longer, as you have done. Let them go and gather straw for themselves. But require the same number of bricks from them as before, and do not reduce it. They are idle; that is why they cry out, ‘Let us go and sacrifice to our God.’ Make the work heavier for these men so that they keep at it and pay no attention to empty words.” The taskmasters and foremen went out and told the people, “This is what Pharaoh says: I will not give you straw. Go and get it wherever you can find it, but your workload will not be reduced at all.” So the people scattered through all Egypt to gather stubble for straw. The taskmasters pressed them: “Finish your work, each day’s amount, just as when there was straw.” And the Israelite foremen, whom Pharaoh’s taskmasters had put in charge, were beaten and asked, “Why have you not made your full number of bricks yesterday and today, as before?”
  - range: 15-19
    heading: The foremen appeal to Pharaoh
    plain: |
      The Israelite foremen went and cried out to Pharaoh, “Why do you treat your servants this way? No straw is given to your servants, and still they tell us, ‘Make bricks!’ Your servants are beaten, but the fault is with your own people.” He said, “Idle, that is what you are, idle. That is why you say, ‘Let us go and sacrifice to the LORD.’ Now go and work. No straw will be given you, and you will deliver the full number of bricks.” The foremen saw that they were in trouble when they were told that the daily number of bricks would not be lowered.
  - range: 20-23
    heading: The blame falls on Moses
    plain: |
      As they came out from Pharaoh they met Moses and Aaron, who were standing there, and said, “May the LORD look at you and judge! You have made us hateful in the eyes of Pharaoh and his servants, and have put a sword in their hand to kill us.” Moses went back to the LORD and said, “Lord, why have You brought trouble on this people? Why did You ever send me? Since I came to Pharaoh to speak in Your name, he has done evil to this people, and You have not delivered Your people at all.”

notes:
  - ref: 1
    phrase: Thus saith the LORD God of Israel
    kind: structure
    title: Two kings, two messengers
    body: |
      Moses and Aaron open with a formula that names the one who sent them, and Pharaoh’s men use the same formula nine verses later. It was a “form of asserting authority” that “was often used in the ancient Near East,” and in verse 10 the taskmasters go out with “Thus saith Pharaoh.”

      Some take the pairing as deliberate: “an intentional comparison and contest between the two beings, demonstrating which of the two could actually bring about that which he said.” In Egypt “the king was the mediator between the gods and humans,” and “Pharaoh was divine himself,” so that the confrontation “takes the form of a contest between Jehovah and Pharaoh.” What the plagues were for is taken up at [[Ex. 7:5]].
    sources: [ot-minute-ex-1, muhlestein-pharaoh]
  - ref: 2
    phrase: Who is the LORD, that I should obey his voice to let Israel go?
    kind: history
    title: The question the plagues answer
    body: |
      Pharaoh’s question is a refusal, not a request to be taught, and the Lord’s reply to it comes in chapter 7. The name Moses and Aaron have just spoken to him is Jehovah (the King James “the LORD”; see [[Ex. 3:14]]), and Pharaoh “believed, it is clear, that he knew all the gods who mattered as far as Egyptian affairs were concerned.”

      Pharaoh admits that he does not know the LORD; before the first plague the Lord says, “the Egyptians shall know that I am the LORD, when I stretch forth mine hand upon Egypt, and bring out the children of Israel from among them” ([[Ex. 7:5]]).

      [That Ye May Know That I Am the LORD](/exodus/themes/that-ye-may-know/) follows Pharaoh’s “I know not the LORD” through the plagues, the rescue and the tabernacle to Moses’s request to know Him.
    sources: [brown-trust-lord, ot-minute-ex-1]
  - ref: 2
    phrase: I know not the LORD, neither will I let Israel go
    kind: scripture
    title: King Noah asks Pharaoh’s question
    body: |
      In the Book of Mormon, King Noah echoes Pharaoh’s question. When Abinadi’s preaching is reported to him, Noah says, “Who is Abinadi, that I and my people should be judged of him, or who is the Lord, that shall bring upon my people such great affliction?” ([[Mosiah 11:27]]).

      The challenge “precisely echoes” Pharaoh’s, and it is one of several ways in which “the story of Abinadi is framed with elements of the story of Moses and his confrontation with Pharaoh”: a king who has put his people in bondage, a prophet who had fled and come back, and a warning of plagues through which the king would learn who the Lord is.
    sources: [sc-knowhy-731]
  - ref: 3
    phrase: three days’ journey into the desert
    kind: history
    title: Why ask for only three days?
    body: |
      The request for three days is the Lord’s own wording, not something Moses devised. He gave Moses the sentence at the bush ([[Ex. 3:18]]) and told him in the next verse that the king would refuse it ([[Ex. 3:19]]).

      Why begin with so small a request, when the Lord meant to bring Israel out for good? The request gave Pharaoh “a chance to let Israel go, of his own free will,” so that in refusing he “could blame no one but himself for the consequences.” The note on [[Ex. 3:18]], where the request is first given, has more.

      The threat that closes the request has a background too. On one older reading, pestilence and the sword were, “according to the ordinary belief of the nations,” the means by which a god punished the neglect of his worship.
    sources: [ot-manual-ex-1-10, keil-exodus]
  - ref: 7
    phrase: straw to make brick
    kind: history
    title: Bricks, straw, and a quota
    body: |
      Pharaoh’s order leaves the “tale” of bricks, “that is, their quota,” where it was and adds the labor of finding the straw. The straw of this chapter is “straw threshed fine,” which was “mixed with clay in brick-making.” Until now it had been supplied (“as heretofore”). He gives his explanation before any quota has been missed: “they be idle” (verse 8).

      Why Israel’s labor was brickmaking, and what Egypt’s own records show of it, is told at [[Ex. 1:14]].
    sources: [bdb, ot-minute-ex-1]
  - ref: 14
    phrase: the officers of the children of Israel
    kind: history
    title: The Israelite foremen
    body: |
      Two ranks stand between Pharaoh and the brickmakers, and only the lower one is Israelite. The “taskmasters” are the “overseers, over the Hebrews”; the “officers” are Israelites, “the brickmaking foremen,” whom the taskmasters had appointed. The foremen answer for the count, so they are the ones beaten when it falls short, the ones who appeal to Pharaoh, and the ones who meet Moses and Aaron on the way out. The bitter words of verse 21 come from men who have just been beaten and then sent back to work.
    sources: [ot-minute-ex-1]
  - ref: 16
    phrase: but the fault is in thine own people
    kind: words
    title: Whose fault?
    body: |
      The foremen’s last words to Pharaoh are very brief in Hebrew, and translations place the blame differently. The clause is two words, a form of a verb meaning “miss (a goal or way), go wrong, sin” and “thy people”; the King James supplies the rest.

      As the King James has it, the foremen blame Pharaoh’s men, the “leaders” who “were at fault by not providing the straw,” and one modern translation agrees: “the fault is with your own people.” Another has them blame the king himself: “But the fault is with you.” The ancient Greek translation goes a third way: “thou wilt therefore injure thy people.” Pharaoh’s reply passes over the point (verse 17).
    sources: [oshb-wlc, bdb, ot-minute-ex-1, niv, nrsvue, lxx-rahlfs]
  - ref: 22
    phrase: why is it that thou hast sent me?
    kind: scripture
    title: Moses’s complaint
    body: |
      Moses takes the foremen’s complaint, and his own, to the Lord. He asks why the people have been made to suffer and why he was sent, though he had been told that Pharaoh would refuse ([[Ex. 3:19]]).

      One older reading hears faith in it, citing Augustine: “These are not words of contumacy or indignation, but of inquiry and prayer.” The complaint “proceeded from faith, which flies to God when it cannot understand the dealings of God.” The reply is to a “grief-stricken Moses,” whom God “quietly assured” that “He would surely bring events to their proper end”: “Now shalt thou see what I will do to Pharaoh” ([[Ex. 6:1]]).
    sources: [keil-exodus, brown-trust-lord]

christ: |
  The LORD of this chapter, who is Jehovah ([[Ex. 3:14]]), calls Israel “my people” (verse 1) while they are still Pharaoh’s brickmakers, and He hears Moses’s complaint that He has not delivered them. His answer has been read as an assurance that He is in charge and that Israel can trust what He has promised: “I will take you to me for a people, and I will be to you a God” ([[Ex. 6:7]]).

  On one reading, Jacob and Alma connect the deliverance from Egypt with the Savior’s deliverance: the Atonement gives “a spiritual deliverance from the slavery of sin in the same way that the Exodus provided a physical escape from the slavery of the Pharaoh.”

explore: |
  - **“Know that I am the LORD.”** Follow the answer to Pharaoh’s question through [[Ex. 6:7]], [[Ex. 7:5]], and [[Ex. 8:22]].
  - **The terms of the request.** Watch what Pharaoh offers and what Moses refuses in [[Ex. 8:25–28]] and [[Ex. 10:24–26]].
  - **Prayers that ask why.** The Church’s footnote to verse 22 points to [[D&C 121:1–6]]; compare the Lord’s answers in [[Ex. 6:1]] and [[D&C 121:7–8]].

parallels:
  - ref: Mosiah 11:27
    note: King Noah answers Abinadi with Pharaoh’s question, “who is the Lord?”

