chapter: 34
title: The Covenant Renewed
tagline: Moses carries two new tables up Sinai, and the LORD proclaims His name as merciful and gracious. The covenant is made again, and Moses comes down with a face that shines.
when: 'At Mount Sinai after the golden calf, during Moses’s second forty days on the mountain (34:28).'

setting: |
  Israel is still camped at Sinai, and the covenant made there lies broken. Moses shattered the first tables when he saw the calf (see [[Ex. 32:19]]). Since then he has pleaded for the people, and he has asked to see the LORD’s glory; the answer was a promise: “I will make all my goodness pass before thee, and I will proclaim the name of the LORD before thee” ([[Ex. 33:19]]). This chapter is that promise kept.

  Moses goes up alone with two tables he has cut himself and stays, as he later said, “according to the first time, forty days and forty nights” ([[Deut. 10:10]]). This has been counted as the third appearance of God to Moses on this mountain: “the commissioning call of Moses,” “the establishment of the Mosaic covenant,” and now “the renewal of the covenant after the rebellion of the golden calf.” The long account of Sinai that began in chapter 19 “is ended by the reception of the second set of tablets.” What remains of the book is the building of the tabernacle.

  Later scripture returns to the chapter often. Moses retells it in [[Deut. 10:1–5]]. The words of the proclamation are prayed and repeated again (see the note on verse 6). Paul builds an argument on the veil ([[2 Cor. 3:7–18]]). The Joseph Smith Translation and [[D&C 84:19–27]] say what the second tables did not restore.

thread: |
  The calf raised one question: would the LORD still go with this people? He had said He would not, “for thou art a stiffnecked people: lest I consume thee in the way” ([[Ex. 33:3]]). The chapter answers the question, and it begins with who God is before it says anything about what Israel must do.

  First comes the name. The LORD had already revealed Himself to the whole nation “as visiting sin and showing mercy,” in the second commandment (see [[Ex. 20:5]]). One older reading sets the two passages side by side: there the zeal that visits sin stood first and mercy followed, while “here grace, mercy, and goodness are placed in the front.” Moses hears the name and prays again, at once, that the LORD would go among them (verse 9). The reply is a single sentence: “Behold, I make a covenant.”

  Then come the terms, and they are not a new law. On the same older reading the LORD repeats “two of the leading points which determined the attitude of the nation towards Him,” both from the laws on which the covenant was first made (chapters 21–23): no league with the peoples of Canaan or their gods (verses 11–16), and the worship of the LORD in His feasts, His firstlings and His Sabbath (verses 17–26). The new commandments “emphasized and built upon the earlier injunctions against worshipping other gods and engaging in idol worship,” and “Thou shalt make thee no molten gods” is said “with an allusion to the worship of the golden calf.”

  So the covenant is renewed. Latter-day revelation adds that it was not renewed on the first terms (see the note on verse 1). The chapter closes with the glory of God on a mortal face, and with a veil over it.

sections:
  - range: 1-4
    heading: Two new tables
    plain: |
      The LORD said to Moses, “Cut two tables of stone like the first, and I will write on them the words that were on the first tables, which you broke. Be ready in the morning. Come up Mount Sinai and present yourself to me on the top of the mount. No one is to come up with you or be seen anywhere on the mountain, and no flocks or herds are to graze in front of it.”

      Moses cut two tables of stone like the first. He rose early in the morning and went up Mount Sinai as the LORD had commanded, carrying the two tables in his hand.
  - range: 5-9
    heading: The LORD proclaims His name
    plain: |
      The LORD came down in the cloud, stood with him there, and proclaimed the name of the LORD. He passed by before Moses and proclaimed: “The LORD, the LORD God, merciful and gracious, longsuffering, and abundant in goodness and truth, keeping mercy for thousands, forgiving iniquity and transgression and sin, but who will by no means clear the guilty, visiting the iniquity of the fathers on the children and on the children’s children, to the third and fourth generation.”

      Moses quickly bowed his head to the ground and worshipped. He said, “If I have now found grace in your sight, O Lord, let my Lord, I pray, go among us, for this is a stiffnecked people. Pardon our iniquity and our sin, and take us for your inheritance.”
  - range: 10-17
    heading: The covenant, and no covenant with Canaan
    plain: |
      He said, “I make a covenant. Before all your people I will do marvels such as have not been done in all the earth or in any nation. All the people you live among will see the work of the LORD, for what I am going to do with you is a fearful thing.

      “Keep what I command you today. I am driving out before you the Amorite, the Canaanite, the Hittite, the Perizzite, the Hivite, and the Jebusite. Take care that you make no covenant with the inhabitants of the land you are going to, or it will become a snare among you. You are to tear down their altars, break their images, and cut down their sacred poles. You shall worship no other god, for the LORD, whose name is Jealous, is a jealous God.

      “Make no covenant with the people of the land. They prostitute themselves to their gods and sacrifice to them, and someone will invite you, and you will eat of his sacrifice. You will take their daughters for your sons, and their daughters, who prostitute themselves to their gods, will lead your sons to do the same. You shall make no molten gods.”
  - range: 18-28
    heading: The feasts, and the words written
    plain: |
      “Keep the feast of unleavened bread. Eat unleavened bread seven days, as I commanded you, in the time of the month Abib, for in the month Abib you came out of Egypt.

      “Every firstborn of the womb is mine, and every male firstling of your cattle, ox or sheep. The firstling of an ass you shall redeem with a lamb; if you do not redeem it, break its neck. All your firstborn sons you shall redeem. No one is to appear before me empty-handed.

      “Six days you shall work, and on the seventh day you shall rest. Even in plowing time and in harvest you shall rest.

      “Keep the feast of weeks, of the firstfruits of the wheat harvest, and the feast of ingathering at the year’s end. Three times a year all your males shall appear before the Lord GOD, the God of Israel. I will cast out the nations before you and enlarge your borders, and no one will desire your land when you go up to appear before the LORD your God three times a year.

      “Do not offer the blood of my sacrifice with leaven, and do not leave the sacrifice of the feast of the passover until morning. Bring the first of the firstfruits of your land to the house of the LORD your God. Do not boil a kid in its mother’s milk.”

      The LORD said to Moses, “Write these words, for according to these words I have made a covenant with you and with Israel.” He was there with the LORD forty days and forty nights and neither ate bread nor drank water. And he wrote on the tables the words of the covenant, the ten commandments.
  - range: 29-35
    heading: The shining face and the veil
    plain: |
      When Moses came down from Mount Sinai with the two tables of testimony in his hand, he did not know that the skin of his face shone while he talked with Him. Aaron and all the children of Israel saw that the skin of his face shone, and they were afraid to come near him. Moses called to them. Aaron and all the leaders of the congregation came back to him, and Moses talked with them. Afterward all the children of Israel came near, and he gave them as commandments all that the LORD had spoken with him on Mount Sinai.

      When Moses had finished speaking with them, he put a veil on his face. Whenever he went in before the LORD to speak with Him, he took the veil off until he came out. Then he came out and told the children of Israel what he had been commanded. They saw that the skin of his face shone, and Moses put the veil on his face again until he went in to speak with Him.

notes:
  - ref: 1
    phrase: the words that were in the first tables
    kind: scripture
    title: What the second tables did not restore
    body: |
      The second tables carried the law again, but latter-day revelation says they did not carry all that the first had held. As the verse stands, the new tables are simply to be “like unto the first.” The Joseph Smith Translation keeps that promise and sets a limit on it: “I will write upon them also, the words of the law, according as they were written at the first on the tables which thou brakest; but it shall not be according to the first, for I will take away the priesthood out of their midst; therefore my holy order, and the ordinances thereof, shall not go before them.” The Joseph Smith Translation of Moses’s own retelling names the one thing left out: the LORD would write the former words “save the words of the everlasting covenant of the holy priesthood.”

      A revelation to Joseph Smith says what that loss meant. The greater priesthood “holdeth the key of the mysteries of the kingdom, even the key of the knowledge of God” ([[D&C 84:19]]), and without its ordinances and authority no one can see the face of God and live ([[D&C 84:21–22]]; see the note on [[Ex. 33:20]]). Because Israel hardened their hearts, the Lord “took Moses out of their midst, and the Holy Priesthood also; And the lesser priesthood continued, which priesthood holdeth the key of the ministering of angels and the preparatory gospel” ([[D&C 84:25–26]]).

      The missing words are read as “the higher, sanctifying ordinances of the Melchizedek Priesthood,” which were “the very ordinances that gave access to the presence of the Lord.” In practical terms “only one-twelfth of the tribes of Israel held any priesthood at all,” and “the priests began to act as intermediaries and represented the people before God.” The offer of [[Ex. 19:6]] had been made to the whole people.

      The Joseph Smith Translation continues, “I will give unto them the law as at the first, but it shall be after the law of a carnal commandment,” and it says they would not enter His presence “in the days of their pilgrimage.” The law given through Moses “was a good law, although adapted to a lower spiritual capacity than is required for obedience to the gospel in its fulness,” and it was “a preparatory gospel to bring its adherents to Christ.” Yet “even at this lowest point, God did not abandon them.”

      See [[Ex. 19:10]] for what the people were being prepared for, [[Ex. 20:19]] for their drawing back, and [[Ex. 32:19]] for the breaking of the first tables.

      [What Was Offered at Sinai](/exodus/themes/offered-at-sinai/) sets these tables in the whole account of the offer.
    sources: [jst-ex-34, jst-deut-10, lds-scriptures, thomas-provocation, belnap-skinner-sinai, bd-law-of-moses]

  - ref: 6
    phrase: The LORD, The LORD God, merciful and gracious
    kind: scripture
    title: The name the LORD proclaims
    body: |
      The name proclaimed on the mountain is an account of the LORD’s character, spoken by Himself to the prophet of a people who have just sinned. It keeps a promise: Moses had asked to see His glory, and the LORD had answered that He would proclaim His name (see the setting above). At the bush the name was brief (see [[Ex. 3:14]]). This one is long, its words “all describing various attributes of God.”

      Its first words set the God of Israel apart. Such mercy, grace and longsuffering are “atypical in the ancient religious milieu.” “Goodness” translates *hesed*, which carries “the sense of steadfast loyalty to the covenant” and so “stands in stark contrast to the behavior of the children of Israel” at the calf. The word is explained at [[Ps. 51:1]].

      Later scripture returns to these words. When the people murmur and speak of returning to Egypt, Moses prays, “let the power of my Lord be great, according as thou hast spoken, saying, The LORD is longsuffering, and of great mercy, forgiving iniquity and transgression” ([[Num. 14:17–18]]), and the answer comes, “I have pardoned according to thy word” ([[Num. 14:20]]). Jonah gives them as the reason he fled: “I knew that thou art a gracious God, and merciful, slow to anger, and of great kindness” ([[Jonah 4:2]]). The Psalms repeat them; the note at [[Ps. 86:15]] sets the wording side by side.
    sources: [lds-scriptures, hardison-theophany]

  - ref: 7
    phrase: that will by no means clear the guilty
    kind: scripture
    title: Forgiving, and not clearing the guilty
    body: |
      One sentence says that the LORD forgives “iniquity and transgression and sin” and that He will not clear the guilty. For “and that” the Church’s footnotes give “but who,” and the Joseph Smith Translation reads “rebellious” where the King James has “guilty.” With that reading the line says He will by no means clear the rebellious.

      In this verse “it is now revealed that justice is an essential part of God’s nature,” and “Mercy will not rob justice.” Mercy is kept “for thousands,” which can be taken as thousands of generations, and judgment reaches to the third and fourth, so that on this reading “his mercy will extend until the thousandth generation—250 times longer than his anger.”

      What it means for iniquity to be visited on children is taken up at [[Ex. 20:5]].
    sources: [lds-scriptures, hardison-theophany]

  - ref: 9
    phrase: for it is a stiffnecked people
    kind: scripture
    title: Moses pleads the people’s fault as his reason
    body: |
      Moses asks the LORD to go with Israel, and the reason he gives is the very fault for which the LORD had said He would not. The earlier word was, “I will not go up in the midst of thee; for thou art a stiffnecked people” ([[Ex. 33:3]]). Now, having heard the name, Moses prays, “let my Lord, I pray thee, go among us; for it is a stiffnecked people.”

      One older reading explains the boldness: it was natural that Moses should “lay hold of the grace that had been revealed to him as it never had been before.” The people’s stubbornness “was appropriately pleaded as a motive for asking forgiveness,” in the way that God had once given the bent of the human heart as His reason for not destroying the earth again ([[Gen. 8:21]]).

      He also says “our iniquity and our sin,” though he had no part in the calf: “Moses spoke collectively, including himself in the nation in the presence of God.”

      His last request reaches back to what was first offered at Sinai. The word translated “inheritance” “refers to an eternal, inalienable possession,” so that “Moses is asking God to take Israel once again as his own special possession,” the “peculiar treasure” of [[Ex. 19:5]].
    sources: [keil-exodus, hardison-theophany, lds-scriptures, oshb-wlc]

  - ref: 10
    phrase: Behold, I make a covenant
    kind: history
    title: The covenant renewed, and the marvels promised
    body: |
      The LORD answers Moses’s prayer with a covenant, and so the bond broken at the calf is taken up again. “God will not permanently revoke the privilege of a covenant relationship.” The instructions that follow restrict what Israel will receive (see the note on verse 1), yet they “still formally established a covenant relationship,” and the marvels promised in it “would be the means by which others would see the wonderful things of God.”

      The verse does not say what the marvels are. The next verse speaks of the nations being driven out, and the people among whom Israel lives are to see “the work of the LORD.” Another reading starts from the wording. In “such as have not been done,” the Hebrew verb is the verb “to create,” “the word used in Genesis 1,” so that the promise is put in the language of creation. On that reading the unprecedented act is the one just asked for: “the miracle of forgiveness.” The verse leaves room for it.
    sources: [hardison-theophany, belnap-skinner-sinai, oshb-wlc]

  - ref: 13
    phrase: cut down their groves
    kind: words
    title: Groves are asherim
    body: |
      The “groves” Israel is to cut down are not stands of trees. The Hebrew word is *asherim*, and the Church’s footnote gives it so: “HEB asherim, or cultic deities.” An asherah was “either a living tree or a tree-like pole, set up as an object of worship, being symbolic of the female or productive principle in nature,” and “every Phoenician altar had an asherah near it.” That is why the verse names them in one breath with altars and images, and why they are to be cut down. The plain-words rendering above calls them sacred poles.

      The command has a reason: this “nature worship” “became associated with gross immorality,” and so the setting up of such objects “was forbidden by Hebrew prophets.”
    sources: [bd-grove, lds-scriptures, oshb-wlc]

  - ref: 15
    phrase: go a whoring after their gods
    kind: symbol
    title: Idolatry as unfaithfulness in marriage
    body: |
      The harsh phrase pictures the worship of other gods as unfaithfulness in a marriage. Scripture speaks of the LORD and Israel in that way: “He spoke of the covenant people as bride and Himself as bridegroom,” as in Hosea, “I will betroth thee unto me for ever” ([[Hos. 2:19]]). The same picture has been used for the golden calf: Israel broke the covenant within forty days of making it, so quickly that it has been likened to “committing adultery on one’s wedding night.”

      The warning is practical as well. Verses 15 and 16 name two ordinary ways into another people’s worship, a neighbor’s invitation to a sacrificial meal and a marriage, and the footnotes point to the place where it happened in the wilderness ([[Num. 25:1–2]]).

      The verse before this one calls the LORD by the name “Jealous.” The Joseph Smith Translation reads it, “for the Lord, whose name is Jehovah, is a jealous God.” What “jealous” means when it is said of God is explained at [[Ex. 20:5]].
    sources: [thomas-provocation, hardison-theophany, jst-ex-34, lds-scriptures]

  - ref: 23
    phrase: appear before the Lord GOD
    kind: scripture
    title: The command to appear before the LORD stands
    body: |
      The command to come before the LORD three times a year stands in the renewed covenant just as it stood in the first (see [[Ex. 23:14]] for the three feasts). Whatever else had changed, “one set of instructions stayed the same between the original and the secondary tablets—namely, that all Israelites were to come to the tabernacle three times a year.”

      The observation matters because of a proposal about the verb. It has been argued that the command once said Israel’s men were to “see” the LORD and not only to “appear before” Him; the note at [[Ps. 42:2]] sets out the argument. The same proposal has been made for verse 24 of this chapter, that the text “was subtly altered” from a phrase meaning “to see the face of the Lord” to the phrase “to appear before the Lord.” If that is right, then “the commandment to go to the tabernacle three times per year, reflected in both sets of tablets, potentially carried with it the great promise to see the face of God.”

      This remains a proposal about how one word was once read. What the text as it stands does show is that the pilgrimage to the LORD’s house was not withdrawn.
    sources: [belnap-skinner-sinai, thomas-provocation]

  - ref: 28
    phrase: he wrote upon the tables the words of the covenant, the ten commandments
    kind: scripture
    title: Who wrote on the second tables, and what
    body: |
      Read with verse 1 and with Moses’s own retelling, the “he” who writes on the tables is the LORD, and what He writes is the Ten Commandments. The chapter opens with His promise, “I will write upon these tables the words that were in the first tables.” Moses later says how it was kept: “he wrote on the tables, according to the first writing, the ten commandments, which the LORD spake unto you in the mount out of the midst of the fire in the day of the assembly: and the LORD gave them unto me” ([[Deut. 10:4]]). The ten commandments in view are those spoken from the fire in chapter 20.

      The sentence by itself can be read another way, because Moses is the subject of its first half and has just been told, “Write thou these words.” On that reading, “this time, Moses himself wrote the words on the tablets.” This chapter’s set of instructions is itself often called the “ritual decalogue” “because of its focus on worship performances.”

      One older reading keeps the two writings apart. As he had written the book of the covenant ([[Ex. 24:4]]), so now “Moses was to write down these words,” the terms just repeated, “like the covenant rights and laws that had been given before.” The stone tables are another matter: “And He (Jehovah) wrote upon the tables the ten covenant words.”

      The introduction to chapter 20 treats the counting of the ten and the two tables.
    sources: [lds-scriptures, ot-minute-ex-24, belnap-skinner-sinai, keil-exodus]

  - ref: 29
    phrase: the skin of his face shone
    kind: words
    title: A face that sent out rays
    body: |
      Moses came down with the light of God’s presence on his face, and the Hebrew verb for “shone” means here to “send out rays.” The verse gives the cause, “while he talked with him,” which a modern translation renders “because he had been talking with God.”

      The scene has been set beside the Savior on the mount, when “his face did shine as the sun” ([[Matt. 17:2]]): “Such a transfiguration seems to be a feature of face-to-face encounters with Deity.”

      The Book of Mormon remembers the scene. When Abinadi stood before the priests of Noah to recite the commandments, “his face shone with exceeding luster, even as Moses’ did while in the mount of Sinai, while speaking with the Lord” ([[Mosiah 13:5]]).

      The glory of the LORD is treated at [[Ex. 24:16]], and what it means to see God at [[Ex. 33:20]].
    sources: [bdb, nrsvue, lds-scriptures, sc-knowhy-212]

  - ref: 33
    phrase: he put a veil on his face
    kind: scripture
    title: When Moses wore the veil, and what Paul saw in it
    body: |
      Moses did not veil his face while he delivered the LORD’s words; he veiled it when he had finished. The King James “till Moses had done speaking” reads the other way, but the Hebrew has no word for “till.” It says that Moses finished speaking and put on a veil, and a modern translation has, “When Moses had finished speaking with them, he put a veil on his face.” The plain-words rendering above follows it. Verses 34–35 then describe a custom. One older reading sums it up: he wore the veil “ever afterwards, except when he went in to speak with God, or while he was communicating to the people the Divine message which he had received.” Israel saw the shining face whenever it heard the word of the LORD from him.

      Paul read the passage in Greek, and it shaped his words. The ancient Greek translation says here that the skin of Moses’s face “was glorified,” and Paul’s recurring words for glory in his discussion of this scene “are suggested by” that rendering. He writes that Israel “could not steadfastly behold the face of Moses for the glory of his countenance; which glory was to be done away” ([[2 Cor. 3:7]]), and that Moses “put a veil over his face, that the children of Israel could not steadfastly look to the end of that which is abolished” ([[2 Cor. 3:13]]). Exodus gives no reason for the veil. On one older reading Paul supplies it: the veil was there so that Israel would not watch the glory fade, “might not see its gradual waning away.” On that reading Paul takes the fading as a figure of the passing of the covenant the glory came with.

      Then he turns the veil into a figure of his own day: “until this day remaineth the same veil untaken away in the reading of the old testament; which veil is done away in Christ” ([[2 Cor. 3:14]]).
    sources: [oshb-wlc, nrsvue, cambridge-exodus, lxx-rahlfs, lds-scriptures]

christ: |
  The LORD who comes down in the cloud and proclaims His name is Jehovah (see [[Ex. 3:14]]). The Book of Mormon describes the Son of God in words close to those of the proclamation. Alma, without citing Sinai, told the people of Ammonihah that He would come “full of grace, equity, and truth, full of patience, mercy, and long-suffering, quick to hear the cries of his people and to answer their prayers” ([[Alma 9:26]]).

  At Sinai the children of Israel “lost much that would not be restored until the Messiah came in the meridian of time.” The second tables came with “the law of a carnal commandment,” and the Epistle to the Hebrews has that same phrase where it says that Christ is made a priest “not after the law of a carnal commandment, but after the power of an endless life” ([[Heb. 7:16]]). In the meantime the law itself pointed to Him: those who kept it rightly were to “look forward with steadfastness unto Christ” ([[2 Ne. 25:24]]).

  Paul reads the end of the chapter as pointing to Christ. The veil “is done away in Christ” ([[2 Cor. 3:14]]), and the glory that once rested on one man’s face is promised to all who turn to the Lord: “we all, with open face beholding as in a glass the glory of the Lord, are changed into the same image from glory to glory” ([[2 Cor. 3:18]]).

explore: |
  - **Moses’s retelling.** [[Deut. 9:18–29]] and [[Deut. 10:1–5]]: the second forty days, the prayer, and the tables put in the ark.
  - **The name prayed back.** [[Num. 14:11–20]], where Moses pleads the words of verses 6–7; [[Jonah 4:2]]; and the note at [[Ps. 86:15]].
  - **The greater and the lesser priesthood.** [[D&C 84:19–27]], read with the Joseph Smith Translation of verses 1–2.
  - **The veil and the glory.** [[2 Cor. 3:6–18]].
  - **Grace and truth.** [[John 1:14–17]], where John writes of glory beheld, “full of grace and truth,” and of the law “given by Moses.”
  - **Transfigured.** [[Moses 1:1–11]]; [[Matt. 17:1–9]].
  - **A study of the three appearances at Sinai.** “Theophany on Sinai” (Religious Studies Center, 2013) follows the bush, the covenant and its renewal, and what each revealed of God.

