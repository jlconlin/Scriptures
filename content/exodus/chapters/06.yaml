chapter: 6
title: I Am the LORD
tagline: After the first appeal to Pharaoh fails, the LORD answers Moses with His own name and seven promises, and the story stops to say who Moses and Aaron are.
when: 'After Moses and Aaron first stand before Pharaoh and before the first plague; Moses is eighty years old (Exodus 7:7)'

setting: |
  Chapter 5 ended badly. Moses and Aaron asked Pharaoh to let Israel go, and Pharaoh answered, “Who is the LORD, that I should obey his voice to let Israel go?” ([[Ex. 5:2]]). He then took away the straw for the bricks and kept the quota. The Israelite officers blamed Moses and Aaron, and Moses turned to the Lord with a complaint: “neither hast thou delivered thy people at all” ([[Ex. 5:23]]).

  Chapter 6 is the Lord's answer, given “in the land of Egypt” (verse 28). It is the last chapter before the plagues, and it does two things: the Lord identifies Himself as Jehovah, and the families of Reuben, Simeon, and Levi are listed. The speech of verses 2–8 says that the covenant with Abraham, Isaac, and Jacob is about to be kept; verse 4 gathers up the promises of [[Gen. 17:7–8]], the land and “I will be their God.”

thread: |
  The chapter is held together by one sentence: **“I am the LORD.”** It opens the speech (verse 2), opens the message for Israel (verse 6), closes it (verse 8), and returns when the story resumes (verse 29). Between its first and last use in the speech the Lord says what He has done (“I appeared,” “I have also established my covenant,” “I have also heard,” “I have remembered”) and then, seven times in three verses, what He will do: bring out, rid, redeem, take for a people, be a God, bring in, give. The promises fall into three parts: deliverance from Egypt, the taking of Israel as God's own people, and the land sworn to the fathers. This heavy stress on the Lord's own actions, past and future, answers the grief of [[Ex. 5:22–23]], and it can be read as teaching Moses and Israel to rely wholly on Him.

  The rest of the chapter shows the people and the prophet discouraged. The people who “believed” in [[Ex. 4:31]] do not listen now; their oppression has grown, and the reason the verse gives is “anguish of spirit” and “cruel bondage” (verse 9). Moses, sent again to Pharaoh, reasons that a man Israel will not hear has no hope with a king (verse 12). At that point the narrator stops, sets out the family of Moses and Aaron (verses 14–27), and then takes up the story exactly where it stopped. Moses's objection is left standing at the chapter's end; the Lord answers it in [[Ex. 7:1–5]].

sections:
  - range: 1-8
    heading: “I am the LORD”
    plain: |
      The Lord said to Moses, “Now you will see what I will do to Pharaoh. Compelled by a strong hand he will let them go; compelled by a strong hand he will drive them out of his land.” God spoke to Moses and said, “I am the LORD. I appeared to Abraham, Isaac, and Jacob by the name of God Almighty, but by my name JEHOVAH I was not known to them. I established my covenant with them, to give them the land of Canaan, the land where they lived as strangers. I have heard the groaning of the children of Israel, whom the Egyptians hold in bondage, and I have remembered my covenant. So say to the children of Israel: I am the LORD. I will bring you out from under the burdens of the Egyptians. I will deliver you from their bondage. I will redeem you with a stretched out arm and with great judgments. I will take you to be my people, and I will be your God, and you will know that I am the LORD your God, who brings you out from under the burdens of the Egyptians. I will bring you into the land I swore to give to Abraham, Isaac, and Jacob, and I will give it to you as a heritage. I am the LORD.”
  - range: 9-13
    heading: Israel will not listen, and Moses objects
    plain: |
      Moses told this to the children of Israel, but they did not listen to him, because of their anguish of spirit and their cruel bondage. The Lord said to Moses, “Go in and tell Pharaoh king of Egypt to let the children of Israel go out of his land.” Moses answered, “The children of Israel have not listened to me. How then will Pharaoh listen to me, when I speak so poorly?” The Lord spoke to Moses and Aaron and gave them a charge to the children of Israel and to Pharaoh king of Egypt, to bring the children of Israel out of the land of Egypt.
  - range: 14-27
    heading: The family of Moses and Aaron
    plain: |
      These are the heads of their fathers' houses. Reuben, Israel's firstborn, had four sons, and Simeon six; these are their families. Levi had three sons, Gershon, Kohath, and Merari, and lived 137 years. Gershon had two sons and Merari two. Kohath had four sons, Amram, Izhar, Hebron, and Uzziel, and lived 133 years. Amram married Jochebed, his father's sister, and she bore him Aaron and Moses; Amram lived 137 years. Izhar's sons were Korah, Nepheg, and Zichri, and Korah's sons became the families of the Korhites. Uzziel had three sons. Aaron married Elisheba, the daughter of Amminadab and sister of Naashon, and she bore him Nadab, Abihu, Eleazar, and Ithamar. Eleazar married one of the daughters of Putiel, and she bore him Phinehas. These are the heads of the Levite families. This is the Aaron and Moses to whom the Lord said, “Bring the children of Israel out of the land of Egypt by their armies.” These are the ones who spoke to Pharaoh king of Egypt to bring Israel out of Egypt: this Moses and Aaron.
  - range: 28-30
    heading: The story resumes
    plain: |
      On the day the Lord spoke to Moses in the land of Egypt, He said, “I am the LORD. Tell Pharaoh king of Egypt everything I say to you.” And Moses said before the Lord, “I speak so poorly; how will Pharaoh listen to me?”

notes:
  - ref: 3
    phrase: by my name JEHOVAH was I not known to them
    kind: scripture
    title: The patriarchs knew the name Jehovah
    body: |
      Abraham, Isaac, and Jacob did know the name Jehovah. As the King James Version has it, the verse says they knew God only as “God Almighty,” the name by which He introduced Himself to Jacob ([[Gen. 35:11]]) and, before him, to Abraham: “I am the Almighty God” ([[Gen. 17:1]]). The Joseph Smith Translation makes the last clause a question that expects the answer yes: “And was not my name known unto them?”

      Other scripture agrees with the question. In Genesis, Abraham names the place where Isaac was bound “Jehovah-jireh” ([[Gen. 22:14]]). In the book of Abraham the Lord says so twice in His own voice: “Abraham, Abraham, behold, my name is Jehovah” ([[Abr. 1:16]]), and “My name is Jehovah, and I know the end from the beginning” ([[Abr. 2:8]]). So although the verse as it stands “states that the God of Israel was not known by the name Jehovah before Moses’ time, latter-day revelation tells us otherwise.”

      What the name itself means is taken up at [[Ex. 3:14]].
    sources: [lds-scriptures, bd-jehovah]
  - ref: 6
    phrase: I will redeem you
    kind: words
    title: To redeem is a kinsman's act
    body: |
      “Redeem” here translates a verb from family law, the one for what the nearest relative did for a kinsman in trouble. The first sense of the Hebrew verb, *ga'al*, is to “act as kinsman, do the part of next of kin.” In the law that kinsman bought back the land a poor relative had been forced to sell: “if any of his kin come to redeem it, then shall he redeem that which his brother sold” ([[Lev. 25:25]]).

      With God as its subject the verb means to redeem “implying personal relationship,” and that is its sense here: Israel redeemed “from Egyptian bondage.” One reading draws the two senses together: by “extending this legal procedure into the theological realm, Jehovah was, naturally, considered the divine goel (redeemer, avenger) of Israel as a whole,” the one expected “to redeem Israel or buy her back from bondage, slavery, or debt servitude.” The Song of the Sea uses it again once the people are out: “the people which thou hast redeemed” ([[Ex. 15:13]]).
    sources: [bdb, sc-knowhy-162, lds-scriptures]
  - ref: 6
    phrase: with a stretched out arm
    kind: history
    title: The arm of the LORD and the arm of Pharaoh
    body: |
      The “stretched out arm” may be aimed at Pharaoh in his own terms. One proposal is that the Exodus account's expressions about the Lord's arm are “Hebrew derivations or counterparts to Egyptian expressions that symbolized Egyptian royal power,” so that the language “seems to be employed specifically to invoke the image of Pharaoh’s might and Jehovah’s ability to overcome that might.” On that reading the Lord describes what He is about to do with an image the kings of Egypt used for their own strength.

      The “strong hand” of verse 1 belongs with it. The English could be taken to mean Pharaoh's hand, but the Hebrew is “by a hand of strength,” that is, by the Lord's power: Pharaoh will send Israel out because he is forced to. What the plagues were for, and the contest with Pharaoh as a whole, is the subject of [[Ex. 7:5]].
    sources: [muhlestein-pharaoh, lds-scriptures]
  - ref: 12
    phrase: who am of uncircumcised lips
    kind: words
    title: Why Moses calls his lips uncircumcised
    body: |
      “Uncircumcised lips” is a figure for lips that are covered over, a mouth that does not do its work. Moses is repeating what he said at the bush: “I am slow of speech, and of a slow tongue” ([[Ex. 4:10]]). Where he repeats the objection at the chapter's end (verse 30; JST Exodus 6:29), the Joseph Smith Translation says it plainly: “of stammering lips, and slow of speech.”

      The figure is strange to a modern ear, and the Old Testament uses it of other parts of the body too. The foreskin was thought of as “covering or blocking full function or sensitivity,” and so “it became a metaphor for being covered from or insensitive to spiritual things generally.” Jeremiah says of his hearers that “their ear is uncircumcised, and they cannot hearken” ([[Jer. 6:10]]), and Leviticus speaks of “uncircumcised hearts” ([[Lev. 26:41]]). Moses turns the figure on his own speech.
    sources: [lds-scriptures, sc-knowhy-872]
  - ref: 14
    phrase: These be the heads of their fathers’ houses
    kind: history
    title: Why a genealogy interrupts the story
    body: |
      The list of names is there to say who Moses and Aaron are before the contest with Pharaoh begins. The text “breaks the narrative to list a genealogy leading up to Moses and Aaron’s generation to show that it is this very Moses and this very Aaron that had been given the task of delivering Israel,” and the lines that close it say so twice: “These are that Aaron and Moses” (verse 26), “these are that Moses and Aaron” (verse 27).

      That purpose explains its odd shape. It starts like a list of all Israel, with Reuben and Simeon, and then stops at the third son. On one older reading it begins with Jacob's firstborn “to show clearly the genealogical position of Levi, the tribe-father of Moses and Aaron, among the sons of Jacob,” and it goes no further than Levi. The order of the two names changes as well. “In the genealogy itself Aaron stands first, as the elder of the two”; in verse 27, which leads back into the story, Moses is named first.

      With that done, verses 28–30 repeat verses 10–12 almost word for word. The repetition is the narrator finding his place again: “the thread of the history, which was broken off at Exodus 6:12, is again resumed.”
    sources: [ot-minute-ex-1, keil-exodus]
  - ref: 16
    phrase: according to their generations
    kind: scripture
    title: Four generations, as Abraham was told
    body: |
      From Levi to Moses the list counts four generations (Levi, Kohath, Amram, Moses), and four is the number the Lord gave Abraham. When He foretold the bondage He said, “in the fourth generation they shall come hither again” ([[Gen. 15:16]]). The narrator “listed only four generations from the time of Jacob,” and the Lord had “promised Abram that deliverance of his people would come in the fourth generation.”

      The same promise to Abraham speaks of four hundred years ([[Gen. 15:13]]). How four generations and so long a stay in Egypt fit together is taken up at [[Ex. 12:40]].
    sources: [lds-scriptures, ot-minute-ex-1]
  - ref: 20
    phrase: Jochebed his father’s sister
    kind: history
    title: Amram and Jochebed
    body: |
      Moses's parents are named here for the first time in the book, and they were nephew and aunt. Chapter 2 said only that “a man of the house of Levi” married “a daughter of Levi” ([[Ex. 2:1]]). Here the man is Amram, a grandson of Levi, and the woman is Jochebed, his father's sister, “the daughter of Levi, whom her mother bare to Levi in Egypt” ([[Num. 26:59]]).

      The law given later at Sinai forbids a man to marry his father's sister ([[Lev. 18:12]]). The chapter records the marriage without comment, and on one older reading such a marriage “was prohibited in the Mosaic law (Leviticus 18:12), but was allowed before the giving of the law.”
    sources: [lds-scriptures, keil-exodus]
  - ref: 23
    phrase: Nadab, and Abihu, Eleazar, and Ithamar
    kind: history
    title: Names the later story needs
    body: |
      Several of Aaron's family, and Korah, come back later in the story. Aaron's four sons “would go on to become leaders of the Levitical Priesthood in Israel”; their calling is at [[Ex. 28:1]]. Nadab and Abihu die offering “strange fire” ([[Lev. 10:1]]). Eleazar and Ithamar “were Aaron’s chief assistants after the death of Nadab and Abihu.” His son Phinehas (verse 25), the last name in the list, is the man who “was zealous for my sake” at Peor ([[Num. 25:11]]) and who appears afterward as high priest.

      Korah (verses 21 and 24) is the son of Izhar, Amram's brother, and so first cousin to Moses and Aaron. In the wilderness ([[Num. 16:1]]) he will be “the leader of the rebellion against Moses and Aaron.” His family did not end with him: his descendants “formed a guild of musicians,” and their name stands in the titles of a number of psalms.
    sources: [ot-minute-ex-1, bd-eleazar, bd-phinehas, bd-korah, lds-scriptures]

christ: |
  The LORD who says “I will redeem you” is Jehovah (see the note at [[Ex. 3:14]]). To redeem is “to deliver, to purchase, or to ransom, such as to free a person from bondage by payment,” and Jesus Christ is called the great Redeemer because His Atonement paid the price of sin and made the resurrection of all people possible. The verb behind “redeem” in verse 6 is taken up in the note there.

  Nephi puts the deliverance from Egypt and the cross in one sentence. The same God “of our fathers, who were led out of Egypt, out of bondage,” he says, “yieldeth himself … as a man, into the hands of wicked men, to be lifted up” ([[1 Ne. 19:10]]). The Church's footnote at verse 6 points to that verse.

explore: |
  - [[Ex. 7:1–7]]: the Lord's answer to the objection Moses makes twice in this chapter, and the ages of the two brothers.
  - [[Gen. 17:1–8]]: the appearance as “the Almighty God” and the covenant that verses 3–8 call to mind.
  - [[Abr. 1:16]] and [[Abr. 2:8]]: the Lord tells Abraham that His name is Jehovah.
  - [[Deut. 26:5–9]]: the words an Israelite spoke with his firstfruits, which tell of the deliverance from Egypt as a thing done.
  - [[Num. 3:27]]: the four families of Kohath named in verse 18, as they stood in the wilderness.

