chapter: 32
title: The Golden Calf
tagline: While Moses is on the mount the people have Aaron make a calf of gold and keep a feast before it. Moses pleads for them, breaks the tables, destroys the calf, and offers himself for their sin.
when: 'At the end of Moses’s forty days and forty nights on Mount Sinai (24:18).'

setting: |
  Moses has been out of sight for forty days. He went up into the cloud on Sinai after the covenant was sealed with blood, and “was in the mount forty days and forty nights” ([[Ex. 24:18]]), leaving the camp in the care of Aaron and Hur ([[Ex. 24:14]]). The seven chapters between that verse and this one are what he heard there: the instructions for the tabernacle and its priesthood. They end with the LORD giving him “two tables of testimony, tables of stone, written with the finger of God” ([[Ex. 31:18]]).

  This chapter goes back down to the camp. The people who had answered, “All that the LORD hath said will we do, and be obedient” ([[Ex. 24:7]]), now ask Aaron to make them gods. The story begun here runs through chapter 34, where the covenant is renewed.

  Later scripture returns to this day often. Moses retells it to the next generation, adding details Exodus does not give ([[Deut. 9:8–21]]). A psalm and a prayer in Nehemiah’s time confess it ([[Ps. 106:19–23]]; [[Neh. 9:18]]). Stephen and Paul both cite it as a warning ([[Acts 7:39–41]]; [[1 Cor. 10:7]]), and Jeroboam repeats the sin nearly word for word ([[1 Kgs. 12:28]]).

thread: |
  The chapter moves between the camp and the mountain: the sin in the camp (verses 1–6), the LORD and Moses on the mount (7–14), Moses’s descent and what he does in the camp (15–29), and his return to the LORD (30–35).

  On the mountain the question is whose people these are. The LORD says to Moses, “thy people, which thou broughtest out of the land of Egypt.” Moses hands the words back: “thy people, which thou hast brought forth out of the land of Egypt.” Everything Moses pleads rests on that: the LORD’s own deliverance, His name among the Egyptians, and His oath to Abraham, Isaac, and Israel.

  In the camp the question is what the people have done to the covenant. They had agreed to all the LORD desired; now, weeks later, “they were not just rejecting the Lord’s proposal, they were committing an act of open rebellion.” Moses breaks the tables, destroys the calf, and calls the camp to choose, and judgment falls that day.

  In the Joseph Smith Translation the LORD’s answer to Moses on the mount is a condition: the people will be spared if they repent (see the note on verse 14). So the people are spared and the nation goes on toward the land, but not as before. An angel will go before them (see [[Ex. 23:20]]), and the sin is still to be visited. Whether the LORD Himself will go with them is the subject of the next chapter, and what Israel lost at Sinai is told in full at [[Ex. 34:1]].

sections:
  - range: 1-6
    heading: The calf
    plain: |
      When the people saw that Moses was long in coming down from the mount, they gathered around Aaron and said, “Up, make us gods to go before us. As for this Moses, the man who brought us up out of Egypt, we do not know what has become of him.” Aaron told them to break off the gold earrings of their wives, sons, and daughters and bring them to him, and all the people did.

      He took the gold from them, shaped it with a graving tool, and made a molten calf. They said, “These are your gods, O Israel, which brought you up out of the land of Egypt.” When Aaron saw it, he built an altar before it and proclaimed, “Tomorrow is a feast to the LORD.” Early the next day they offered burnt offerings and brought peace offerings. The people sat down to eat and drink, and rose up to play.
  - range: 7-14
    heading: Moses pleads on the mount
    plain: |
      The LORD said to Moses, “Go down. Your people, whom you brought out of Egypt, have corrupted themselves. They have turned aside quickly from the way I commanded them. They have made a molten calf, worshipped it, sacrificed to it, and said, ‘These are your gods, O Israel.’ I have seen this people; it is a stiffnecked people. Now let me alone, that my wrath may burn against them and I may consume them, and I will make of you a great nation.”

      Moses pleaded with the LORD his God: “LORD, why does your wrath burn against your people, whom you brought out of Egypt with great power and a mighty hand? Why should the Egyptians say that He brought them out for mischief, to slay them in the mountains? Turn from your fierce wrath. Remember Abraham, Isaac, and Israel, your servants, to whom you swore by your own self to multiply their seed as the stars of heaven and to give them this land forever.”

      And the LORD repented of the evil He had thought to do to His people (see the note on verse 14).
  - range: 15-20
    heading: The tables broken and the calf destroyed
    plain: |
      Moses turned and went down from the mount with the two tables of the testimony in his hand. They were written on both sides. The tables were the work of God, and the writing was the writing of God, graven on the tables.

      Joshua heard the people shouting and said, “There is a noise of war in the camp.” Moses answered, “It is not the shout of men who are winning, nor the cry of men who are beaten. It is singing that I hear.”

      As soon as he came near the camp and saw the calf and the dancing, Moses’s anger burned. He threw the tables from his hands and broke them at the foot of the mount. He took the calf they had made, burned it in the fire, ground it to powder, scattered it on the water, and made the children of Israel drink it.
  - range: 21-24
    heading: Aaron’s answer
    plain: |
      Moses said to Aaron, “What did this people do to you, that you have brought so great a sin upon them?” Aaron said, “Do not let my lord’s anger burn. You know the people, that they are set on mischief. They said to me, ‘Make us gods to go before us; as for this Moses, we do not know what has become of him.’ I said, ‘Whoever has any gold, let him break it off.’ They gave it to me, I cast it into the fire, and out came this calf.”
  - range: 25-29
    heading: Who is on the LORD’s side
    plain: |
      Moses saw that the people had broken loose, for Aaron had let them loose, to their shame among their enemies. He stood in the gate of the camp and said, “Who is on the LORD’s side? Let him come to me.” All the sons of Levi gathered to him.

      He said to them, “Thus says the LORD God of Israel: Let every man put his sword at his side and go through the camp from gate to gate, and slay every man his brother, his companion, and his neighbor.” The sons of Levi did as Moses said, and about three thousand men of the people fell that day. For Moses had said, “Consecrate yourselves today to the LORD, every man upon his son and upon his brother, that He may bestow a blessing on you this day.”
  - range: 30-35
    heading: Moses offers himself
    plain: |
      The next day Moses said to the people, “You have sinned a great sin. Now I will go up to the LORD; perhaps I can make an atonement for your sin.”

      He returned to the LORD and said, “Oh, this people have sinned a great sin and have made themselves gods of gold. Yet now, if you will forgive their sin; and if not, blot me, I pray, out of the book you have written.” The LORD said, “Whoever has sinned against me, him will I blot out of my book. Now go, lead the people to the place I have told you of. My Angel will go before you. But in the day when I visit, I will visit their sin upon them.”

      And the LORD plagued the people because they made the calf, which Aaron made.

notes:
  - ref: 4
    phrase: These be thy gods, O Israel
    kind: history
    title: What the calf stood for
    body: |
      The calf may have been meant to represent the LORD who had brought Israel out of Egypt, not a rival god; the text does not say outright, and the question is debated. The reason the people give for wanting it is that Moses is gone. One Latter-day Saint study reads the request this way: Moses’s absence made them fear “that their connection with the divine has been broken,” and so “it is likely that the Israelites substituted the intercessory role of Moses with an idol that would function the same way.”

      The form was a familiar one. “In most major cultures of the ancient Near East, the bull” stood for a great god, and the calf has been explained as the Egyptian bull-god Apis. The same study answers that this “would presuppose that the Israelites expected an Egyptian deity to deliver them from Egypt, which hardly seems correct,” and concludes that “it is more likely that the idol was meant to represent Yahweh.” Another proposal it reports is that the image was a pedestal for the unseen God, “a symbol of his presence.”

      The chapter’s own words point the same way. The calf is credited with the Exodus, and Aaron proclaims the next day’s feast “to the LORD.” The plural “gods” is how the narrative speaks of the image throughout, “though calf is singular.” When the Levites of Nehemiah’s day confess this sin they use the singular: “This is thy God that brought thee up out of Egypt” ([[Neh. 9:18]]). Jeroboam, setting up his two calves centuries later, uses the words of this verse ([[1 Kgs. 12:28]]).

      None of this lessens the offense. An image meant for the LORD is still an image, forbidden in the commandment the people had heard from the fire (see [[Ex. 20:4]]) and again in the first law after it: “neither shall ye make unto you gods of gold” ([[Ex. 20:23]]). Moses uses those very words in his confession (verse 31). What Israel gave up in the exchange is the subject of [[Ps. 106:20]].
    sources: [belnap-skinner-sinai, lds-scriptures]

  - ref: 6
    phrase: rose up to play
    kind: words
    title: What the people rose up to do
    body: |
      “Play” here means noisy festivity, and the chapter itself says what kind: shouting loud enough to be heard up the mountain (verse 17), singing (verse 18), and dancing (verse 19). The standard lexicon lists the Hebrew verb in this verse under the sense “sport, play.”

      The setting is what makes it grave. The eating and drinking follow burnt offerings and peace offerings on an altar built before the calf, the same two offerings named when the covenant was sealed ([[Ex. 24:5]]). On one older reading, “some of the proper rites of the true worship were observed on this occasion,” offered “through an idolatrous medium, the molten calf.”

      Paul quotes the verse as his one example of Israel’s idolatry in the wilderness: “Neither be ye idolaters, as were some of them; as it is written, The people sat down to eat and drink, and rose up to play” ([[1 Cor. 10:7]]). Stephen’s summary is that they “rejoiced in the works of their own hands” ([[Acts 7:41]]).
    sources: [bdb, lds-scriptures, ot-manual-ex-21-24]

  - ref: 10
    phrase: let me alone
    kind: scripture
    title: The offer Moses refused
    body: |
      The LORD’s words to Moses contain an offer: the people destroyed, and Moses made the father of a new nation in their place. The words are those of the promise to Abraham: “I will make of thee a great nation” ([[Gen. 12:2]]). Moses does not take the offer up, or even mention it. He answers with three reasons for sparing Israel, none of them about himself: these are the LORD’s people, whom He delivered; the Egyptians will say He brought them out to kill them; and He swore to the fathers.

      One Latter-day Saint study reads the offer as a proving of Moses. The circumstance “tested and then demonstrated the prophet’s exceptional integrity and character”: “Instead of seizing the opportunity to exalt himself, his name, and his posterity, Moses interceded.” One older reading says the same of “let me alone.” By asking to be left alone, “God puts the fate of the nation into the hand of Moses, that he may remember his mediatorial office,” and “Moses stood the test.”

      The offer is made again when the people refuse to enter Canaan: “I will smite them with the pestilence, and disinherit them, and will make of thee a greater nation and mightier than they” ([[Num. 14:12]]).

      In Moses’s retelling the pleading goes on for forty days. “I fell down before the LORD forty days and forty nights, as I fell down at the first; because the LORD had said he would destroy you” ([[Deut. 9:25]]). A psalm’s picture of this moment, Moses standing “in the breach,” is taken up at [[Ps. 106:23]].
    sources: [belnap-skinner-sinai, keil-exodus, lds-scriptures]

  - ref: 14
    phrase: the LORD repented of the evil
    kind: scripture
    title: The Joseph Smith Translation of the LORD’s answer
    body: |
      In the Joseph Smith Translation the LORD does not repent; He sets a condition, and it is the people who are to repent. Two verses are changed. Moses’s plea in verse 12 no longer asks the LORD to “repent of this evil.” It reads, “Turn from thy fierce wrath. Thy people will repent of this evil; therefore come thou not out against them.” And verse 14 becomes the LORD’s reply:

      > And the Lord said unto Moses, If they will repent of the evil which they have done, I will spare them, and turn away my fierce wrath; but, behold, thou shalt execute judgment upon all that will not repent of this evil this day. Therefore, see thou do this thing that I have commanded thee, or I will execute all that which I had thought to do unto my people.

      The reading answers the difficulty the King James wording raises, that God should repent of an evil. The same difficulty, and the Hebrew verb behind “repented,” are treated at [[Gen. 6:6]].

      In this reading Moses goes down the mountain with a promise that depends on the people’s repentance and with a charge of his own to carry out “this day.” The judgment at the gate of the camp follows (see the note on verse 28).
    sources: [jst-ex-32, lds-scriptures]

  - ref: 19
    phrase: brake them beneath the mount
    kind: symbol
    title: Why Moses broke the tables
    body: |
      Moses broke the tables in anger, and the act also said something: the covenant written on them had been broken by the people. The text gives the anger. Moses’s own retelling adds that he did it in their sight: “I took the two tables, and cast them out of my two hands, and brake them before your eyes” ([[Deut. 9:17]]).

      In the world Israel lived in, the gesture had a legal meaning. In the ancient Near East, to break a tablet “could signify the invalidating of a treaty,” and a phrase with that sense is found in the legal language of Hammurabi’s era, where it meant “to break an agreement, to invalidate or repudiate a document.” On that reading, “Broken tablets reflected the rejected promise.” By breaking them Moses “essentially nullified the covenants written upon them.”

      The verses just before dwell on what the tables were: “the work of God,” with “the writing of God” on both their sides. Latter-day revelation says what was lost with them. Because the people “hardened their hearts and could not endure his presence,” the LORD “took Moses out of their midst, and the Holy Priesthood also; And the lesser priesthood continued” ([[D&C 84:24–26]]). One Latter-day Saint study calls the calf “a most serious provocation” because it came “in the very moment that Moses was receiving the fulness of the gospel for them.”

      What the first tables held, and how the second differed, is told at [[Ex. 34:1]].
    sources: [belnap-skinner-sinai, ot-minute-ex-24, thomas-provocation, lds-scriptures]

  - ref: 20
    phrase: made the children of Israel drink of it
    kind: history
    title: Why the people were made to drink the calf
    body: |
      The text gives no reason for making the people drink the powdered calf, and the explanations offered are readings. Moses’s retelling names the thing destroyed in a striking way: “I took your sin, the calf which ye had made, and burnt it with fire, and stamped it, and ground it very small, even until it was as small as dust: and I cast the dust thereof into the brook that descended out of the mount” ([[Deut. 9:21]]). The calf is “your sin,” and the water is the brook that ran down from the mountain.

      One older commentary sums up the act in a sentence: “The people are made to drink their own sin.” Another denies that the point was to shame them with the worthlessness of their god and takes it as “a symbolical sign that they would have to bear it and atone for it.” Both compare the water a suspected wife was made to drink in [[Num. 5:24]].
    sources: [cambridge-exodus, keil-exodus, lds-scriptures]

  - ref: 24
    phrase: there came out this calf
    kind: history
    title: Aaron’s account, and what became of Aaron
    body: |
      Aaron answers Moses by blaming the people and by saying that the calf came out of the fire. The narrator says that Aaron took the gold, “fashioned it with a graving tool,” and built the altar (verses 4–5). Aaron says that he threw the gold into the fire “and there came out this calf.” He begins with the people: “thou knowest the people, that they are set on mischief.” One Latter-day Saint study says plainly that Aaron “tried to excuse himself to Moses for making the golden calf by vilifying the people,” and that he “bore responsibility for letting the people get out of control.”

      The chapter does not excuse him. Moses’s question already lays the sin at his door (“thou hast brought so great a sin upon them”), the narrator repeats the charge in verse 25, and the last verse of the chapter names him: “they made the calf, which Aaron made.”

      Exodus does not say what the LORD said of Aaron, but Moses does: “the LORD was very angry with Aaron to have destroyed him: and I prayed for Aaron also the same time” ([[Deut. 9:20]]). Aaron was not destroyed. He went on to serve in the priest’s office appointed to him in the instructions Moses had just received (see [[Ex. 28:1]]), and the same study concludes, “Apparently, Aaron’s repentance was real and accepted by the Lord.”
    sources: [belnap-skinner-sinai, lds-scriptures]

  - ref: 25
    phrase: the people were naked
    kind: words
    title: Naked, or let loose
    body: |
      The word translated “naked” more likely describes a people out of control than a people unclothed, and the plain-words rendering above follows that sense. The alternative in the Latter-day Saint edition’s footnote is “riotous, let loose,” and the standard lexicon defines the Hebrew verb in this verse as to “let go, let loose, people, i.e. remove restraint from them,” and notes that it stands twice in the verse: the people were loose, and Aaron had loosed them.

      Another reading keeps both senses, the people exposed in their guilt and the people unruly, and observes that “Both conditions would be to the shame of a people who were supposed to be religious.”
    sources: [bdb, lds-scriptures, ot-manual-ex-21-24]

  - ref: 26
    phrase: all the sons of Levi
    kind: history
    title: The Levites
    body: |
      The tribe that answers Moses’s call here is the tribe later given the service of the sanctuary, and scripture connects the two. The Levites are the descendants of Levi, and Moses and Aaron were of that tribe ([[Ex. 2:1]]). In Israel’s later worship, “The work of ministering in the sanctuary was assigned to this tribe.” Aaron and his sons were the priests (see [[Ex. 28:1]]). “The work of the Levites was to assist the priests.” They were “given to Him in place of the firstborn” of all Israel (see [[Ex. 13:2]]), and they “had no inheritance in Canaan.”

      Moses’s retelling of the calf goes on to their appointment: “At that time the LORD separated the tribe of Levi, to bear the ark of the covenant of the LORD, to stand before the LORD to minister unto him, and to bless in his name” ([[Deut. 10:8]]). On one older reading “that time” is the stay at Horeb.

      One older reading also takes Moses’s hard words in verse 29, “Consecrate yourselves to day to the LORD,” in that sense, and sets beside them his last blessing on the tribe, in which Levi “said unto his father and to his mother, I have not seen him; neither did he acknowledge his brethren, nor knew his own children: for they have observed thy word, and kept thy covenant” ([[Deut. 33:9]]). The Levites are told to “consecrate yourselves to-day for the service of the Lord,” and in their obedience Moses sees “such a disposition and act as would fit them for the service of the Lord.”
    sources: [bd-levites, lds-scriptures, keil-exodus, cambridge-exodus]

  - ref: 28
    phrase: about three thousand men
    kind: history
    title: The three thousand
    body: |
      About three thousand men died at the hands of the Levites that day, and the text presents it as the LORD’s judgment: Moses gives the order with “Thus saith the LORD God of Israel.” Exodus does not record the LORD saying it. The Joseph Smith Translation does: there the LORD’s answer on the mount charges Moses to “execute judgment upon all that will not repent of this evil this day” (see the note on verse 14).

      In the chapter Moses first stands in the gate and calls the whole camp: “Who is on the LORD’s side? let him come unto me.” The judgment comes after that call, and the Church’s chapter heading calls those who fell “rebels.” The alternative the LORD names in the Joseph Smith Translation is that He would Himself do all He had thought to do to His people.

      It is still a hard passage, and the verses do not soften it: the Levites are told to slay brother, companion, and neighbor. The Church’s study help on violence in the Old Testament grants that much in such accounts “remains difficult to fully comprehend,” and reminds the reader that God “has always been perfectly merciful and perfectly just” and gives warnings and opportunities to repent before He judges. In this chapter the mercy and the judgment stand side by side: a people spared at Moses’s pleading, and a sin the LORD still says He will visit (verse 34).
    sources: [jst-ex-32, scripture-helps-violence, lds-scriptures]

  - ref: 32
    phrase: blot me, I pray thee, out of thy book
    kind: scripture
    title: The book, and the offer the LORD declined
    body: |
      Moses asks that, if the people cannot be forgiven, his own name be removed from the book the LORD has written. Scripture speaks of such a record elsewhere: “a heavenly record is kept of the faithful, whose names are recorded, as well as an account of their righteous deeds.” A psalm uses the same image for the opposite wish: “Let them be blotted out of the book of the living, and not be written with the righteous” ([[Ps. 69:28]]).

      The prayer is spoken in two halves, and the first is left unfinished. “Yet now, if thou wilt forgive their sin”: Moses does not say what then. He had told the people he would go up to see whether he could “make an atonement” for them (verse 30; for the word, see [[Ex. 25:17]]), and what he offers is himself.

      The LORD does not accept it. “Whosoever hath sinned against me, him will I blot out of my book.” Moses is sent back to lead the people, with an angel before him and the sin still to be visited.

      Paul, grieving over Israel in his own day, speaks as Moses did: “I could wish that myself were accursed from Christ for my brethren, my kinsmen according to the flesh” ([[Rom. 9:3]]).
    sources: [bd-book-of-life, lds-scriptures]

christ: |
  The LORD against whom Israel sins in this chapter, and with whom Moses pleads, is Jehovah (see [[Ex. 3:14]]). The chapter points to Him in a second way, through Moses.

  Moses had been told, “thou art in the similitude of mine Only Begotten” ([[Moses 1:6]]), and the likeness shows here: with the people facing destruction, Moses “became their mediator with God.” His pleading can call to mind Jesus Christ, whom scripture names as “an advocate with the Father” ([[1 Jn. 2:1]]).

  In latter-day revelation the Savior describes His own pleading: “Father, behold the sufferings and death of him who did no sin, in whom thou wast well pleased; behold the blood of thy Son which was shed” ([[D&C 45:4]]). “Wherefore, Father, spare these my brethren that believe on my name” ([[D&C 45:5]]).

explore: |
  - **Moses’s own telling.** [[Deut. 9:7–29]] and [[Deut. 10:1–11]]: the forty days of pleading, the prayer for Aaron, the second tables, and the tribe of Levi set apart.
  - **The psalm of confession.** [[Ps. 106:19–23]]: the glory exchanged for an ox, and Moses in the breach.
  - **Two New Testament warnings.** [[Acts 7:37–43]], where Stephen says the fathers “in their hearts turned back again into Egypt”; and [[1 Cor. 10:1–12]], where Paul says these things “are written for our admonition” ([[1 Cor. 10:11]]).
  - **The calves of Jeroboam.** [[1 Kgs. 12:26–33]]: the same image and the same words, set up at Bethel and Dan.
  - **What was withheld.** [[D&C 84:19–27]], with the note at [[Ex. 34:1]].
  - **What happens next.** [[Ex. 33:1–17]], where Moses will not go on without the LORD’s presence, and [[Ex. 34:6–7]], where the LORD proclaims His name.
  - **The Advocate.** [[Heb. 7:22–27]]: the priest who “ever liveth to make intercession for them” ([[Heb. 7:25]]).

