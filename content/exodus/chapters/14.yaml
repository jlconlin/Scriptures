chapter: 14
title: Through the Sea
tagline: Camped with the sea in front and Pharaoh’s chariots behind, Israel is told to stand still and then to go forward. The waters divide, Israel crosses on dry ground, and the sea closes over the army of Egypt.
when: 'The first month, in the days after Israel left Rameses on the fifteenth (Num. 33:3). The crossing itself fills one night and ends at daybreak.'

setting: |
  Israel has left Egypt. From Succoth the people came to Etham, “in the edge of the wilderness” ([[Ex. 13:20]]), led by the LORD in a pillar of cloud by day and of fire by night (see [[Ex. 13:21]]) and kept on purpose from the short road to Canaan (see [[Ex. 13:17]]). Which sea they now come to, and where on its shore, is taken up at [[Ex. 13:18]]. This chapter is about what happened there.

  Pharaoh’s heart is hardened again in this chapter, and the hearts of his army with it (verses 4, 8, 17). The paraphrase below keeps the King James wording. The Joseph Smith Translation reads in verses 4 and 8 that Pharaoh hardened his own heart, and the question is treated once, at [[Ex. 4:21]].

  Later scripture keeps returning to this night. The psalms sing of it ([[Ps. 77:16–20]]; [[Ps. 106:7–12]]; [[Ps. 114:3]]; [[Ps. 136:13–15]]). Isaiah remembers the way made through the depths ([[Isa. 51:10]]), and Joshua sets the crossing of the Jordan beside it ([[Josh. 4:23]]). Nephi argues from it twice with his brothers ([[1 Ne. 4:2]]; [[1 Ne. 17:26–27]]). For Latter-day Saints the event itself is not in question: the parting of the sea “is confirmed in latter-day revelation.”

thread: |
  The LORD says what the day is for before anything happens: “I will be honoured upon Pharaoh, and upon all his host; that the Egyptians may know that I am the LORD” (verse 4, and again in verses 17–18). They are the words He spoke before and during the plagues (see [[Ex. 7:5]]).

  Between that announcement and its fulfillment the people of Israel do very little. They are afraid, they cry out, they accuse Moses (verses 10–12), and they walk. Everything else is the LORD’s doing, and the chapter says so in the same few words each time. Moses promises, “The LORD shall fight for you” (verse 14); the Egyptians, their chariots failing, say, “the LORD fighteth for them” (verse 25). Moses says, “see the salvation of the LORD” (verse 13); at the end “the LORD saved Israel that day,” and Israel “saw” it (verses 30–31). Twice Moses stretches out his hand over the sea, once before it opens and once before it closes (verses 21, 27), and both times the verse goes on to what the LORD did.

  So the day has an outcome on each shore. The Egyptians were to know who the LORD is. Israel learns it too: the people who were “sore afraid” of Pharaoh (verse 10) end by fearing the LORD and believing Him “and his servant Moses” (verse 31).

sections:
  - range: 1-4
    heading: A camp by the sea
    plain: |
      The LORD said to Moses, “Tell the children of Israel to turn and camp in front of Pi-hahiroth, between Migdol and the sea, opposite Baal-zephon. Camp there, by the sea. Pharaoh will say of them, ‘They are tangled up in the land; the wilderness has shut them in.’ I will harden Pharaoh’s heart, and he will come after them. I will be honored upon Pharaoh and upon all his army, and the Egyptians will know that I am the LORD.” And Israel did so.
  - range: 5-9
    heading: Pharaoh pursues
    plain: |
      The king of Egypt was told that the people had fled. He and his servants changed their minds about them and said, “Why have we done this? We have let Israel go from serving us.” He made his chariot ready and took his people with him: six hundred chosen chariots and all the other chariots of Egypt, with captains over all of them. The LORD hardened the heart of Pharaoh king of Egypt, and he pursued the children of Israel, who had gone out with a high hand. The Egyptians came after them with all Pharaoh’s horses and chariots, his horsemen and his army, and overtook them camped by the sea, beside Pi-hahiroth, in front of Baal-zephon.
  - range: 10-14
    heading: Fear, and the answer to it
    plain: |
      As Pharaoh drew near, the children of Israel looked up and saw the Egyptians marching after them. They were terrified and cried out to the LORD. And they said to Moses, “Were there no graves in Egypt, that you have brought us out to die in the wilderness? Why have you done this to us, bringing us out of Egypt? Is this not what we told you in Egypt: ‘Leave us alone, and let us serve the Egyptians’? It would have been better for us to serve the Egyptians than to die in the wilderness.”

      Moses said to the people, “Do not be afraid. Stand still, and see the salvation of the LORD, which He will show you today. The Egyptians you have seen today you will never see again. The LORD will fight for you, and you are to hold your peace.”
  - range: 15-20
    heading: Go forward
    plain: |
      The LORD said to Moses, “Why do you cry to me? Tell the children of Israel to go forward. Lift up your rod, stretch out your hand over the sea, and divide it, and the children of Israel will go through the middle of the sea on dry ground. I will harden the hearts of the Egyptians, and they will follow them. I will gain honor upon Pharaoh and all his army, his chariots and his horsemen, and the Egyptians will know that I am the LORD.”

      The angel of God, who had been going in front of the camp of Israel, moved and went behind them, and the pillar of cloud moved from in front of them and stood behind them. It came between the camp of the Egyptians and the camp of Israel. To the one it was cloud and darkness, and to the other it gave light through the night, so that neither came near the other all night.
  - range: 21-25
    heading: The sea divided
    plain: |
      Moses stretched out his hand over the sea, and the LORD drove the sea back with a strong east wind all that night. He made the sea dry land, and the waters were divided. The children of Israel went into the middle of the sea on dry ground, with the waters a wall to them on their right and on their left. The Egyptians pursued and went in after them, all Pharaoh’s horses, his chariots, and his horsemen.

      In the morning watch the LORD looked at the Egyptian army through the pillar of fire and cloud and threw it into confusion. He took off their chariot wheels, so that they drove heavily. The Egyptians said, “Let us flee from Israel, for the LORD is fighting for them against Egypt.”
  - range: 26-31
    heading: The sea returns
    plain: |
      The LORD said to Moses, “Stretch out your hand over the sea, and let the waters come back over the Egyptians, their chariots, and their horsemen.” Moses stretched out his hand over the sea, and as morning came the sea returned to its full strength. The Egyptians fled straight into it, and the LORD overthrew them in the middle of the sea. The waters came back and covered the chariots, the horsemen, and all the army of Pharaoh that had gone into the sea after Israel. Not one of them was left. But the children of Israel had walked on dry land through the middle of the sea, with the waters a wall to them on their right and on their left.

      So the LORD saved Israel that day from the hand of the Egyptians, and Israel saw the Egyptians dead on the shore. Israel saw the great work the LORD had done against the Egyptians. The people feared the LORD, and they believed the LORD and His servant Moses.

notes:
  - ref: 4
    phrase: I will be honoured upon Pharaoh
    kind: history
    title: A camp chosen to look like a mistake
    body: |
      The LORD puts Israel where there is no way out, and He says why before it happens. The order in verse 2 is to “turn” (the Church’s footnote gives the Hebrew as “return”) and to camp with the sea in front. The camp “would hem in Moses and his people between the Red Sea and Pharaoh’s armies.” One older reading calls the road “a very foolish way, according to human judgment.” That is how the LORD says Pharaoh will read it: “They are entangled in the land, the wilderness hath shut them in” (verse 3). Just where the camp lay is not known (see [[Ex. 13:18]]).

      This phrase gives the reason. The Church’s footnotes say that “upon” may also be read as by, and the Hebrew verb means to “get oneself glory (or honour),” here “in or by” someone. The LORD will be glorified by what becomes of Pharaoh and his army. The result He names is the one the plagues were sent for: “that the Egyptians may know that I am the LORD” (see [[Ex. 7:5]]).
    sources: [lds-scriptures, ot-minute-ex-14, keil-exodus, bdb, scripture-helps-ex-14]

  - ref: 8
    phrase: with an high hand
    kind: words
    title: A high hand means boldly
    body: |
      “With an high hand” describes how Israel left Egypt: openly and boldly, not as runaways. The Church’s footnote explains it as “in defiance,” and a modern translation has Israel “going out boldly.” In Hebrew a raised hand is a figure for strength. The standard lexicon lists this verse under the hand as a “symbol of might,” used here “of Israel in Exodus.” The phrase returns when Numbers reviews the journey: “the children of Israel went out with an high hand in the sight of all the Egyptians” ([[Num. 33:3]]).

      The boldness belongs to the departure. Two verses later the same people are “sore afraid” (verse 10).
    sources: [lds-scriptures, bdb, nrsvue]

  - ref: 11
    phrase: Because there were no graves in Egypt
    kind: history
    title: The complaint at the sea
    body: |
      With the chariots in sight Israel cries to the LORD and then turns on Moses. The fear itself was reasonable: “Quite rightly, the Israelites feared for their lives.” The failure of faith lay in the conclusion they drew from it, a “fearful distrust that He had led them out of bondage only to stand aside while they were slaughtered.”

      “The word that we did tell thee in Egypt” (verse 12) has a history. The Church’s footnote sends the reader back to the day the burdens were increased, when the officers of Israel said to Moses and Aaron, “The LORD look upon you, and judge” ([[Ex. 5:21]]). It points also to [[Ex. 13:17]], where God had already foreseen that the people might “repent when they see war.”

      A psalm counts this moment among Israel’s sins and not only among its fears: “Our fathers understood not thy wonders in Egypt; they remembered not the multitude of thy mercies; but provoked him at the sea, even at the Red sea” ([[Ps. 106:7]]). The complaints that follow in the wilderness are taken up at [[Ex. 15:24]].
    sources: [brown-trust-lord, lds-scriptures]

  - ref: 15
    phrase: Wherefore criest thou unto me?
    kind: prophets
    title: Stand still, and then go forward
    body: |
      The LORD’s “go forward” completes Moses’s “stand still” and does not correct it. Moses has just told the people to “stand still, and see the salvation of the LORD” (verse 13), and the next words from heaven are an order to march. The Hebrew behind “stand still” can mean to take one’s assigned place, and a modern translation renders it “stand firm.” What Israel is told to give up is fear and fighting (verses 13–14). What it is told to do is walk.

      The verse also implies that Moses had been praying, though the chapter records no prayer of his. On one reading the LORD here “acknowledged Moses’s faith and prayers on behalf of the children of Israel,” and now “It was time to put faith into action.”

      Elder Jeffrey R. Holland read the two commands as one. After quoting Moses’s “Fear ye not, stand still,” he went on: “In confirmation the great Jehovah said to Moses, ‘Speak unto the children of Israel, that they go forward.’” He named this the second lesson of the spirit of revelation. Once the word of the Lord has been received, “go forward. Don’t fear, don’t vacillate, don’t quibble, don’t whine.” The revelation he was speaking of is [[D&C 8:2–3]], which the next note takes up.
    sources: [holland-cast, ot-minute-ex-14, scripture-helps-ex-14, nrsvue]

  - ref: 16
    phrase: stretch out thine hand over the sea, and divide it
    kind: scripture
    title: By whose power the sea was divided
    body: |
      Moses is told to divide the sea, and verse 21 says that the LORD did it. Later scripture holds the two together: the power was God’s, and it was given to Moses. Nephi, urging his brothers back to Jerusalem for the plates, says that Moses “truly spake unto the waters of the Red Sea and they divided hither and thither” ([[1 Ne. 4:2]]), and later that “by his word the waters of the Red Sea were divided” ([[1 Ne. 17:26]]). Nephi the son of Helaman says whose power it was: “God gave power unto one man, even Moses, to smite upon the waters of the Red Sea” ([[Hel. 8:11]]). Hebrews names the people’s part: “By faith they passed through the Red sea as by dry land” ([[Heb. 11:29]]).

      Restoration scripture adds three things, and the Church’s footnotes to verses 16 and 21 point to each. The vision in the book of Moses had promised this power beforehand: “thou shalt be made stronger than many waters; for they shall obey thy command as if thou wert God” ([[Moses 1:25]]). The Joseph Smith Translation, in its account of Melchizedek, says God swore that “every one being ordained after this order and calling should have power, by faith, to break mountains, to divide the seas, to dry up waters” (JST, Genesis 14:30). And a revelation to Oliver Cowdery names the spirit by which it was done. The Lord speaks “in your mind and in your heart, by the Holy Ghost,” and “this is the spirit by which Moses brought the children of Israel through the Red Sea on dry ground” ([[D&C 8:2–3]]).
    sources: [lds-scriptures, jst-gen-14]

  - ref: 19
    phrase: the angel of God
    kind: history
    title: The guide becomes a guard
    body: |
      The angel of God and the pillar, which had led the camp, now move behind it and stand between Israel and the chariots all night. Who the angel is has been read two ways. In the Old Testament the phrase “angel of God” “usually refers to God Himself,” as at the burning bush (see [[Ex. 3:2]]), and in verse 24 it is the LORD who looks out from the pillar. Another Latter-day Saint reading takes the angel as a messenger whom God sends. It sets this night in a line of Old Testament rescues by angels (Hagar, Ishmael, Isaac, Lot) and notes what is different: “this time the beneficiary is the entire host of Israel, while Moses and the angel of the Lord share the responsibility of being the Lord’s messenger.”

      What is new in this verse is what the pillar does (the pillar itself is explained at [[Ex. 13:21]]). It had gone ahead “to lead them the way” ([[Ex. 13:21]]). Now “the pillar acted as a means of salvation for Israel, the primary role Jehovah takes in the Exodus story.” To one camp it is cloud and darkness, and to the other it is light.
    sources: [ot-minute-ex-14, muhlestein-theophanies, halverson-path]

  - ref: 21
    phrase: by a strong east wind all that night
    kind: history
    title: The wind is the LORD’s instrument
    body: |
      The verse names both a means and its author: a strong east wind blew all night, and it was the LORD who “caused the sea to go back.” The account keeps together three things a reader might want to separate: Moses’s outstretched hand, a wind that takes the whole night, and waters that stand as “a wall” on both sides (verses 22, 29). The song that follows says of the same waters, “with the blast of thy nostrils the waters were gathered together, the floods stood upright as an heap” ([[Ex. 15:8]]), and of their return, “Thou didst blow with thy wind, the sea covered them” ([[Ex. 15:10]]).

      A wind and a tide alone do not account for what is described. One older reading observes that an ebb, even one strengthened by the east wind, moves the water one way, and the text has it part to both sides: “Such a division could only be produced by a wind sent by God, and working with omnipotent force.” The escape through the sea “demonstrated the Lord’s control over nature.”
    sources: [lds-scriptures, keil-exodus, brown-exodus-type]

  - ref: 22
    phrase: the waters were a wall unto them
    kind: christ
    title: Baptized in the cloud and in the sea
    body: |
      Paul reads the crossing as Israel’s baptism: “all our fathers were under the cloud, and all passed through the sea” ([[1 Cor. 10:1]]), and “were all baptized unto Moses in the cloud and in the sea” ([[1 Cor. 10:2]]). The type is scripture’s own. The sea and the cloud have been read as the two parts of baptism: “That is, they were baptized by water and by the Holy Ghost.”

      On that reading the water is a boundary. “The departure from Egypt was marked by passing through the Red Sea,” as baptism marks a departure from the world.

      Paul goes on from the sea to the food and drink of the wilderness, and ends with the words “that Rock was Christ” ([[1 Cor. 10:4]]; see [[Ex. 17:6]]).
    sources: [lds-scriptures, hoskisson-plan]

  - ref: 25
    phrase: took off their chariot wheels
    kind: words
    title: Chariot wheels taken off, or bound
    body: |
      The King James Version and the ancient Greek translation differ on what the LORD did to the chariot wheels, and in both the chariots could hardly move. The King James Version says He “took off” their wheels. The Church’s footnote gives the alternative “bound,” which is the reading of the ancient Greek translation: He “bound the axle-trees of their chariots, and caused them to go with difficulty.” A modern translation follows it: “He clogged their chariot wheels so that they turned with difficulty.”

      The verse before says that the LORD “troubled” the Egyptian host. The verb means to “confuse, discomfit,” and the same modern translation says He “threw the Egyptian army into a panic.” How He did it the chapter does not say, beyond His look from the pillar.
    sources: [lds-scriptures, lxx-rahlfs, nrsvue, bdb]

  - ref: 27
    phrase: the LORD overthrew the Egyptians
    kind: history
    title: The Egyptians die by water
    body: |
      Pharaoh’s army dies the death that Pharaoh had ordered for Israel’s sons. At the beginning of the book he “charged all his people, saying, Every son that is born ye shall cast into the river” ([[Ex. 1:22]]). Here Pharaoh and his armies, “ironically, suffered death in the waters of the Red Sea,” which was “the same death that Pharaoh had decreed upon the Hebrew male children.”

      The account is brief and complete. The sea returns at daybreak, the Egyptians run into it, and of those who had gone into the sea “there remained not so much as one of them” (verse 28).

      “Overthrew” translates a vivid verb. The standard lexicon renders it “shook off,” the ancient Greek translation has “the Lord shook off the Egyptians in the midst of the sea,” and a modern translation says He “tossed” them into it. A psalm of thanksgiving uses the same Hebrew word of the same moment and names the king: He “overthrew Pharaoh and his host in the Red sea” ([[Ps. 136:15]]).
    sources: [sc-knowhy-731, bdb, lxx-rahlfs, nrsvue, lds-scriptures]

  - ref: 31
    phrase: believed the LORD, and his servant Moses
    kind: scripture
    title: Israel fears the LORD and believes
    body: |
      The chapter ends with Israel’s fear moved from the Egyptians to the LORD. Before the crossing the people were “sore afraid” of the army (verse 10), and Moses told them, “Fear ye not” (verse 13). After it, “the people feared the LORD.” They “no longer needed to fear the Egyptians; they needed to fear the Lord.”

      Believing Moses is joined to believing the LORD in a single clause. One older reading takes that as part of the purpose: “faith in the Lord was inseparably connected with faith in Moses as the servant of the Lord. Hence the miracle was wrought through the hand and staff of Moses.”

      The belief was real, and it did not last. These “demonstrations of power finally convinced the Hebrews, at least for the time being,” and the new faith “was soon shaken when they ran out of water and food in the desert.” A psalm sets the two side by side. “Then believed they his words; they sang his praise” ([[Ps. 106:12]]) is followed at once by “They soon forgat his works” ([[Ps. 106:13]]).
    sources: [ot-minute-ex-14, keil-exodus, brown-exodus-type, lds-scriptures]

christ: |
  The New Testament names what the crossing foreshadows. Paul calls it Israel’s baptism “in the cloud and in the sea,” and he ends the same sentence at Christ, the “spiritual Rock that followed them” (see the note on verse 22).

  The chapter’s own word for the day is salvation. Moses says, “see the salvation of the LORD” (verse 13), and the account concludes, “Thus the LORD saved Israel that day” (verse 30). In the Old Testament the word is often used of God’s help, and then almost always of a rescue from physical danger, as it is here. The One who saves is the LORD, who is Jehovah (see [[Ex. 3:14]]), and Israel adds nothing to the victory: “The LORD shall fight for you, and ye shall hold your peace” (verse 14).

  Isaiah, looking back, has a name for those who crossed. The LORD “made the depths of the sea a way for the ransomed to pass over” ([[Isa. 51:10]]).

explore: |
  - **The song on the far shore.** [[Ex. 15:1–21]] tells the same night in poetry, sung by Moses and then by Miriam.
  - **The psalms that retell it.** [[Ps. 77:16–20]], [[Ps. 106:7–12]], [[Ps. 114]], and [[Ps. 136:13–15]].
  - **The Jordan and after.** Israel crosses the Jordan on dry ground ([[Josh. 3:14–17]]; [[Josh. 4:23]]), and Elijah and Elisha divide it again ([[2 Kgs. 2:8]]; [[2 Kgs. 2:14]]).
  - **Nephi’s argument from the sea.** [[1 Ne. 4:1–3]] and [[1 Ne. 17:23–31]].
  - **A highway still to come.** [[Isa. 11:15–16]] promises a way for the remnant “like as it was to Israel in the day that he came up out of the land of Egypt,” and [[D&C 133:26–27]] speaks of a highway “cast up in the midst of the great deep.”
  - **The spirit of revelation.** [[D&C 8:1–3]].

