chapter: 20
title: The Ten Commandments
tagline: From the fire on Sinai God speaks ten commandments in the hearing of all Israel. The people draw back and ask Moses to stand between them and God, and Moses goes up into the thick darkness.
when: 'The third month after the departure from Egypt (19:1), at Mount Sinai.'

setting: |
  Israel is camped before Mount Sinai in the third month after leaving Egypt ([[Ex. 19:1]]). In the last chapter the LORD offered to make this people His own (see [[Ex. 19:5]]), and Moses was told to sanctify them against the third day, when the LORD would come down on the mountain in the sight of all (see [[Ex. 19:10]]). Now He speaks.

  What He says is known as the Ten Commandments, though the chapter does not use the name; it comes from later passages ([[Ex. 34:28]]; [[Deut. 4:13]]). The Hebrew name is the “Ten Words,” and from it comes the Greek name, Decalogue. They were afterward “engraved on two tables of stone, which were placed in the Ark.” The text does not number them, and “there has been a difference of opinion as to the way in which the commandments were divided into ten”: the Roman Catholic tradition joins what Latter-day Saints know as the first and second and divides the last in two. This page follows the Church’s numbering.

  Moses repeats the ten in [[Deut. 5:6–21]], Abinadi recites them before the priests of King Noah ([[Mosiah 12:33–36]]; [[Mosiah 13:11–24]]), and latter-day revelation repeats them ([[D&C 42:18–28]]; [[D&C 59:5–13]]). The Savior summed them up in two ([[Matt. 22:37–39]]).

thread: |
  The chapter turns on a change in how God speaks. In verses 1–17 He speaks to the whole people. In verses 18–21 the people, terrified, ask that He speak to Moses instead. From verse 22 on He does: “Thus thou shalt say unto the children of Israel.” The ten are the only words Israel hears from God directly (see the note on verse 1). The laws that begin at verse 22 and run to the end of chapter 23 come through Moses, and the Decalogue stands before them as “a kind of prologue.”

  The ten themselves fall into two parts. The first four “define and protect the Israelites’ covenant relationship” with the LORD: no other gods, no image, His name, His day. The next six “pertain to their inner relationships within the covenant”: parents, life, marriage, property, testimony, and last of all desire. The two parts answer to the Savior’s two great commandments, to love God and to love one’s neighbor ([[Matt. 22:37–40]]), each of which “encapsulates one of the two tables.”

  The two parts also sound different. The commandments about God are “elaborated with explanations and consequences”: “for I the LORD thy God am a jealous God”; “for in six days the LORD made heaven and earth.” Those about neighbors are “written in short, direct statements.”

  Standing where it does, at the head of all the law that follows, the Decalogue shows “the social/relational nature” of that law. It begins from a relationship already made, with the God who brought Israel out of Egypt, and goes on to say how that people is to live with Him and with one another.

sections:
  - range: 1-11
    heading: The LORD and His people
    plain: |
      God spoke all these words: “I am the LORD your God, who brought you out of the land of Egypt, out of the house of bondage. You shall have no other gods before me.

      “You shall not make for yourself a carved image, or a likeness of anything in heaven above, on the earth below, or in the water under the earth. You shall not bow down to them or serve them. For I the LORD your God am a jealous God, visiting the iniquity of the fathers on the children to the third and fourth generation of those who hate me, and showing mercy to thousands of those who love me and keep my commandments.

      “You shall not take the name of the LORD your God in vain; the LORD will not hold guiltless anyone who takes His name in vain.

      “Remember the sabbath day and keep it holy. Six days you are to labor and do all your work, but the seventh day is the sabbath of the LORD your God. On it you shall do no work: you, your son, your daughter, your manservant, your maidservant, your cattle, or the sojourner within your gates. For in six days the LORD made heaven and earth, the sea, and all that is in them, and rested on the seventh day. Therefore the LORD blessed the sabbath day and made it holy.”
  - range: 12-17
    heading: Neighbors
    plain: |
      “Honor your father and your mother, so that your days may be long in the land the LORD your God is giving you.

      “You shall not murder. You shall not commit adultery. You shall not steal. You shall not bear false witness against your neighbor.

      “You shall not covet your neighbor’s house. You shall not covet your neighbor’s wife, or his manservant, or his maidservant, or his ox, or his ass, or anything that is your neighbor’s.”
  - range: 18-21
    heading: The people stand afar off
    plain: |
      All the people saw the thunder and the lightning, the sound of the trumpet, and the mountain smoking, and they drew back and stood at a distance. They said to Moses, “You speak with us, and we will listen; but do not let God speak with us, or we will die.”

      Moses said to them, “Do not be afraid. God has come to test you, and so that respect for Him will stay before you and you will not sin.” The people stood far off, and Moses drew near to the thick darkness where God was.
  - range: 22-26
    heading: No gods of silver, and an altar of earth
    plain: |
      The LORD said to Moses, “Say this to the children of Israel: You have seen that I have talked with you from heaven. You shall not make gods of silver to set beside me, nor make gods of gold for yourselves.

      “Make me an altar of earth, and sacrifice on it your burnt offerings and your peace offerings, your sheep and your oxen. In every place where I record my name I will come to you and bless you. If you make me an altar of stone, do not build it of cut stone, for if you lift your tool on it you have polluted it. And do not go up to my altar by steps, so that your nakedness is not uncovered on it.”

notes:
  - ref: 1
    phrase: God spake all these words
    kind: scripture
    title: Words the whole people heard
    body: |
      The Ten Commandments were spoken aloud to the whole camp, not given to Moses in private. The people at the foot of the mountain heard the voice of God proclaim them from the cloud on its top, and Moses says so when he retells the day: “the LORD spake unto you out of the midst of the fire: ye heard the voice of the words, but saw no similitude; only ye heard a voice” ([[Deut. 4:12]]).

      They are the only part of the law given in that way. “These words the LORD spake unto all your assembly in the mount out of the midst of the fire, of the cloud, and of the thick darkness, with a great voice: and he added no more” ([[Deut. 5:22]]). Everything after verse 21 comes through Moses, at the people’s own request (see the note on verse 19).

      The same retelling supplies the name and the number: “he declared unto you his covenant, which he commanded you to perform, even ten commandments; and he wrote them upon two tables of stone” ([[Deut. 4:13]]).
    sources: [lds-scriptures, scripture-helps-ex-19]

  - ref: 2
    phrase: which have brought thee out of the land of Egypt
    kind: structure
    title: The commandments begin with the deliverance
    body: |
      Before any command is given, the LORD says who He is and what He has already done for the people He is addressing. The sentence is “a reminder that God acts on behalf of the children of Israel.” The commandments are spoken to a people already rescued.

      One Latter-day Saint reflection reads all the commandments as serving a bond the LORD had already announced. While Israel was still in Egypt He told Moses what He meant to do: “I will take you to me for a people, and I will be to you a God” ([[Ex. 6:7]]). “All of the commandments, regulations, and covenants that the Lord gave to his people in the scriptures were in service to this bond,” and in the commandment that follows this verse “Exodus puts the connection with God first and foremost.”
    sources: [ot-minute-ex-18, shannon-kingdom-priests]

  - ref: 4
    phrase: any graven image
    kind: history
    title: What the second commandment forbids
    body: |
      The second commandment forbids images made to be worshipped; it is not a ban on carving or picturing as such. A “graven image” is “a figure made of wood or stone,” and the next verse says what such figures were for: “Thou shalt not bow down thyself to them, nor serve them.” One older reading concludes that the commandment refers “not to the making of images generally, but to the construction of figures of God as objects of religious reverence or worship.”

      Moses gives the reason when he repeats the law. At Sinai Israel heard a voice and saw no form: “ye saw no manner of similitude on the day that the LORD spake unto you in Horeb out of the midst of the fire: Lest ye corrupt yourselves, and make you a graven image” ([[Deut. 4:15–16]]). The same reading takes that passage as Moses’s own explanation of the commandment and so understands the images in view as “symbolical representations of Jehovah” Himself.

      That matters for what comes next in the book. An image meant to represent the LORD still falls under the commandment, which is how one Latter-day Saint study reads the golden calf: “even if the golden calf was made to represent Yahweh,” it was an idol (see [[Ex. 32:4]]).
    sources: [keil-exodus, lds-scriptures, belnap-skinner-sinai]

  - ref: 5
    phrase: a jealous God
    kind: words
    title: What jealous means when it is said of God
    body: |
      “Jealous” here is the fervor of a covenant that allows no rival; it is not envy. In scripture the English word has two senses: “to be fervent and to have sensitive and deep feelings about someone or something,” and “to be envious of someone or suspicious that another will gain some advantage.” The first is the one meant, and the Church’s footnote gives the Hebrew as “possessing sensitive and deep feelings.”

      The Hebrew adjective is used in the Old Testament “only of God.” The standard lexicon sums up what it conveys in two phrases: God “demanding exclusive service,” and God “punishing those who hate him.” When the covenant is renewed after the golden calf the word becomes a name: “the LORD, whose name is Jealous, is a jealous God” ([[Ex. 34:14]]).
    sources: [gs-jealous, lds-scriptures, bdb]

  - ref: 5
    phrase: visiting the iniquity of the fathers upon the children
    kind: scripture
    title: The third and fourth generation, and the thousands
    body: |
      The warning is for children who go on in their fathers’ sin, and the promise set beside it is far larger than the threat. Two things in the sentence limit it. The visiting falls on “them that hate me,” and the Church’s footnote explains that it holds “insofar as the children learn and do the sinful things the parents do,” pointing on to verse 6 for “those who repent and serve the Lord.”

      A latter-day revelation uses the same words, “unto the third and fourth generation,” and then gives the way out: “But if the children shall repent, or the children’s children, and turn to the Lord their God, with all their hearts and with all their might, mind, and strength … then thine indignation shall be turned away” ([[D&C 98:47]]).

      The proportions matter as well. Judgment is counted to the third and fourth generation; mercy is shown “unto thousands.” One older reading takes “thousands” as the thousandth generation, as Moses says elsewhere that God keeps covenant and mercy “to a thousand generations” ([[Deut. 7:9]]). The same reading says of the whole sentence that “love in the form of grace reaches much further than wrath.”

      Ezekiel later answers the objection that a son must bear his father’s iniquity. How his answer stands beside this commandment is taken up at [[Ezek. 18:20]].
    sources: [lds-scriptures, keil-exodus]

  - ref: 8
    phrase: Remember the sabbath day, to keep it holy
    kind: scripture
    title: The Sabbath commandment and its two reasons
    body: |
      Scripture gives two reasons for the Sabbath commandment, one in each telling of the ten. Here the reason is the Creation: in six days the LORD made heaven and earth, “and rested the seventh day.” In Deuteronomy it is the Exodus: “remember that thou wast a servant in the land of Egypt, and that the LORD thy God brought thee out thence through a mighty hand and by a stretched out arm: therefore the LORD thy God commanded thee to keep the sabbath day” ([[Deut. 5:15]]). The day was “instituted to commemorate God’s seventh day of rest at the Creation,” “and also the redemption from Egyptian bondage.”

      The word sabbath means “stopping, cessation, rest (from labor),” and the commandment extends that rest to the whole household: son and daughter, servants, cattle, and the sojourner. Deuteronomy says why the servants are named: “that thy manservant and thy maidservant may rest as well as thou” ([[Deut. 5:14]]).

      “Remember” does not mean the day was new. Israel had been keeping it since the manna began to fall (see [[Ex. 16:23]]).

      In the course of time “many regulations” grew up around the commandment and were kept by the Pharisees. The Savior said of the day, “The sabbath was made for man, and not man for the sabbath” ([[Mark 2:27]]). After His Ascension the Church “kept holy the first day of the week (the Lord’s day) as a weekly commemoration of our Lord’s Resurrection,” and a latter-day revelation renews the commandment for that day: “thou shalt go to the house of prayer and offer up thy sacraments upon my holy day” ([[D&C 59:9]]). The Sabbath as a sign of the covenant is taken up at [[Ex. 31:13]].
    sources: [bd-sabbath, lds-scriptures]

  - ref: 12
    phrase: that thy days may be long upon the land
    kind: scripture
    title: The commandment with a promise
    body: |
      The promise attached to the fifth commandment reaches beyond one person’s length of years to Israel’s life in the promised land. The words are “upon the land which the LORD thy God giveth thee.” The promise “does not necessarily refer to just a long life”; it implies that honoring parents “would allow the children of Israel to remain in their promised land for a long time.”

      Paul, writing to children, calls this “the first commandment with promise” ([[Eph. 6:2]]). The Savior’s own reading of the commandment is in [[Matt. 15:4–6]].
    sources: [ot-minute-ex-18, lds-scriptures, bd-commandments-ten]

  - ref: 13
    phrase: Thou shalt not kill
    kind: scripture
    title: From the act to the heart
    body: |
      The sixth commandment forbids murder, and the Savior carried it back to the anger that comes before the act. The Church’s footnote gives “murder” for the Hebrew, and the plain-words rendering above follows it. The standard lexicon defines the verb “murder, slay,” and lists this commandment among its uses for killing “with premeditation.”

      Jesus quoted this commandment and the next in the Sermon on the Mount and went behind both. “Whosoever is angry with his brother … shall be in danger of the judgment” ([[Matt. 5:22]]); “whosoever looketh on a woman to lust after her hath committed adultery with her already in his heart” ([[Matt. 5:28]]). He “warns of attitudes that lead to misdeeds, forbidding not only adultery, but lust, not only killing, but anger.” Read in that light, the commandments “are intended to control our thoughts and desires as well as our acts.”

      Latter-day revelation restates them with the same reach: “Thou shalt not steal; neither commit adultery, nor kill, nor do anything like unto it” ([[D&C 59:6]]).
    sources: [lds-scriptures, bdb, eom-ten-commandments, bd-commandments-ten]

  - ref: 17
    phrase: Thou shalt not covet
    kind: words
    title: A commandment about desire
    body: |
      The last commandment forbids a desire, where the four before it forbid acts. The Hebrew verb means to “desire, take pleasure in,” and the lexicon classes its use in this verse as “inordinate, ungoverned, selfish desire.” The word is not bad in itself; it is also used, “less often,” in a “good sense.” Here everything it reaches for is “thy neighbour’s.”

      Paul chose this commandment to show what the law does to a person who hears it: “I had not known lust, except the law had said, Thou shalt not covet” ([[Rom. 7:7]]). Twice he calls covetousness idolatry ([[Eph. 5:5]]; [[Col. 3:5]]). When the heart is set on the things of the world until allegiance to God no longer matters, “material things become as a god.” On that reading the tenth commandment leads back to the first: one who covets “may have ‘other gods before him.’”
    sources: [bdb, lds-scriptures, ot-manual-ex-20]

  - ref: 19
    phrase: let not God speak with us, lest we die
    kind: prophets
    title: The people ask for someone to stand between
    body: |
      Latter-day revelation treats the people’s request to hear God only through Moses as the moment Israel drew back from what was offered at Sinai. Moses had “sought diligently to sanctify his people that they might behold the face of God; But they hardened their hearts and could not endure his presence” ([[D&C 84:23–24]]). Joseph Smith named the consequence of that request: “When God offers a blessing or knowledge to a man, and he refuses to receive it, he will be damned. The Israelites prayed that God would speak to Moses, and not to them; in consequence of which he cursed them with a carnal law.”

      Moses remembered the day the same way: “I stood between the LORD and you at that time, to shew you the word of the LORD: for ye were afraid by reason of the fire, and went not up into the mount” ([[Deut. 5:5]]). Latter-day Saint studies describe a community “actively engaged in removing itself from God’s presence,” and a failure of faith as much as of courage: the people “refused to exercise sufficient faith to overcome their fear.”

      It was not the end of the covenant. The request “does not, however, amount to a wholesale rejection of the covenant. Rather, the children of Israel place the burden and privilege of personally experiencing God on Moses.”

      What the people had been prepared for is told at [[Ex. 19:10]]. What was withheld after the golden calf, and what was given in its place, is told at [[Ex. 34:1]]. A psalm’s word for Israel’s hardening in the wilderness, “the provocation,” has been read as alluding to this scene as well (see [[Ps. 95:8]]).
    sources: [lds-scriptures, jsp-history-e1-1708, belnap-skinner-sinai, thomas-provocation, hardison-theophany]

  - ref: 20
    phrase: God is come to prove you
    kind: words
    title: Fear not, and the fear of God
    body: |
      Moses tells the people not to be afraid and, in the same sentence, that God has come so that His fear will stay with them. The fear he tells them to put away is the fear of dying that made them draw back (verse 19). The fear that is to stay is given in the Church’s footnote as respect: “because respect for Him will always be present with you, you will not sin.” Moses joins fear and obedience again when he teaches the commandments to the next generation: “That thou mightest fear the LORD thy God, to keep all his statutes and his commandments” ([[Deut. 6:2]]).

      “Prove” means test, and the plain-words rendering above says so. The Hebrew verb “could also be translated as ‘train,’” or “instruct,” so the thunder and fire may be read as schooling as well as examination. Either way the outcome was the same: “Whether testing or training, Israel fails.”
    sources: [lds-scriptures, ot-minute-ex-18, hardison-theophany]

  - ref: 21
    phrase: the thick darkness where God was
    kind: symbol
    title: Darkness that hides the light
    body: |
      The “thick darkness” where God was is a heavy cloud that conceals Him, and on the mountain it comes together with fire. The Hebrew word means “cloud, heavy cloud,” and it is the word for the cloud “in which God dwells.” Its nearest relatives in other languages mean “to cover or wrap up,” and whatever its exact sense, “it has something to do with a darkness that covers or conceals.”

      On the mountain the darkness and the fire belong together. Deuteronomy says the mountain “burned with fire unto the midst of heaven, with darkness, clouds, and thick darkness” ([[Deut. 4:11]]). One Latter-day Saint study observes that the fire of the LORD’s presence seems to cause the smoke, as fire does, so that “the very light which reveals God also causes the element which hides him.” Jehovah “was both filled with light and hidden.”

      The same word returns when the cloud fills Solomon’s temple: “The LORD said that he would dwell in the thick darkness” ([[1 Kgs. 8:12]]).

      The glory of the LORD is treated at [[Ex. 24:16]], and what it means to see God at [[Ex. 33:20]].
    sources: [bdb, muhlestein-theophanies, lds-scriptures]

  - ref: 25
    phrase: thou shalt not build it of hewn stone
    kind: history
    title: An altar no tool has shaped
    body: |
      The first law given after the Ten Commandments is about how to build an altar, and it asks for the plainest one possible: earth, or stones as they are found. The verse gives its own reason for the stones, “if thou lift up thy tool upon it, thou hast polluted it,” and does not say why a tool should pollute. Two explanations have been offered.

      One is that cut stone belonged to the making of idols. Hewn stones “were often used to make idolatrous objects,” and the tools that made them “were therefore considered unclean.” The other, one older reading, is that the altar “was to set forth the nature of the simple earthly soil, unaltered by the hand of man,” and so was to be of earth or of stones “just as they existed in their natural state.” That reading takes the law together with verse 23: Israel was not to make gods of silver and gold, “but simply to construct an altar of earth or unhewn stones without steps.”

      Later scripture shows the rule kept. Moses repeats it for the altar on mount Ebal: “thou shalt not lift up any iron tool upon them” ([[Deut. 27:5]]), and Joshua builds that altar “of whole stones, over which no man hath lift up any iron” ([[Josh. 8:31]]).
    sources: [ot-minute-ex-18, keil-exodus, lds-scriptures, bowen-law-codes]

christ: |
  The voice at Sinai is the voice of the LORD, who is Jehovah (see [[Ex. 3:14]]), and the risen Savior spoke of the law as His own: “Behold, I am he that gave the law, and I am he who covenanted with my people Israel; therefore, the law in me is fulfilled” ([[3 Ne. 15:5]]). In His ministry He taught the commandments as reaching thought and desire (see the note on verse 13) and gathered the ten into two: “On these two commandments hang all the law and the prophets” ([[Matt. 22:40]]).

  Abinadi, having recited these commandments to the priests of Noah, said what the law could not do: “salvation doth not come by the law alone; and were it not for the atonement, which God himself shall make for the sins and iniquities of his people, that they must unavoidably perish, notwithstanding the law of Moses” ([[Mosiah 13:28]]).

  The people’s plea for someone to stand between them and God also received an answer that reaches to Christ. Moses told Israel that the LORD would raise up a Prophet “like unto me,” and that this was “According to all that thou desiredst of the LORD thy God in Horeb in the day of the assembly” ([[Deut. 18:15–16]]): the promise of the Prophet is given in answer to the request made in this chapter. Peter quoted the promise in preaching Jesus ([[Acts 3:22]]), and the Savior said it of Himself: “I am he of whom Moses spake” ([[3 Ne. 20:23]]).

  Hebrews sets the two mountains side by side. “Ye are not come unto the mount that might be touched, and that burned with fire” ([[Heb. 12:18]]); ye are come “to Jesus the mediator of the new covenant” ([[Heb. 12:24]]).

explore: |
  - **The covenant sealed.** [[Ex. 24:3–8]], where Moses writes the words of the LORD and ratifies the covenant with blood.
  - **Moses’s second telling.** [[Deut. 5:1–33]]: the ten again, the Sabbath grounded in the Exodus, and what the LORD said of the people’s request (verses 28–31).
  - **Abinadi before the priests of Noah.** [[Mosiah 12:33–37]]; [[Mosiah 13:11–35]]: the commandments recited, and then what the law pointed to.
  - **The Sermon on the Mount.** [[Matt. 5:17–48]] and [[3 Ne. 12:17–48]], where the Lawgiver teaches the commandments.
  - **The commandments restated in the latter days.** [[D&C 42:18–29]]; [[D&C 59:5–13]].
  - **Two mountains.** [[Heb. 12:18–29]].
  - **A study of the Sinai narrative.** “The Promise and the Provocation: The Sinai Narrative” (Religious Studies Center, 2021) follows the invitation to come up the mountain, and Israel’s refusal, through later scripture.

