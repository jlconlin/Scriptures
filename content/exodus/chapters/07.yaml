chapter: 7
title: The Rod and the River
tagline: The Lord sends Moses and Aaron back to Pharaoh with a sign and a first plague. Aaron’s rod swallows the rods of the magicians, the river turns to blood, and Pharaoh goes home unmoved.
when: 'Moses’s eightieth year (verse 7); the first sign before Pharaoh and the first plague'

setting: |
  Chapter 6 ended with Moses’s objection: “how shall Pharaoh hearken unto me?” ([[Ex. 6:30]]). Chapter 7 opens with the Lord’s answer. This is the first chapter of the plagues: one sign in Pharaoh’s court (verses 8–13) and then the first of ten plagues (verses 14–25).

  Verse 7 gives the brothers’ ages, eighty and eighty-three. Stephen fills in the rest of the count: Moses was “full forty years old” when he first went out to his brethren ([[Acts 7:23]]), forty more years passed before the bush ([[Acts 7:30]]), and he died at “an hundred and twenty” ([[Deut. 34:7]]).

  Three things are assumed here and explained elsewhere. Pharaoh is unnamed ([[Ex. 1:11]]). The rod is the shepherd’s staff of [[Ex. 4:2]]. And verses 3 and 13 speak of the hardening of Pharaoh’s heart, where the Joseph Smith Translation has Pharaoh harden his own; the note is at [[Ex. 4:21]]. The “river” throughout is the Nile.

  Later scripture comes back to this chapter. Two of the psalms that retell the Exodus include the first plague: “He turned their waters into blood, and slew their fish” ([[Ps. 105:29]]; see also [[Ps. 78:44]]).

thread: |
  Exodus 7 says what the plagues are for before any of them falls: **“the Egyptians shall know that I am the LORD”** (verse 5). Pharaoh had said, “I know not the LORD” ([[Ex. 5:2]]). The stated purpose takes up his word “know,” and the Lord repeats it at the river’s edge: “In this thou shalt know that I am the LORD” (verse 17).

  The chapter then shows the pattern the next chapters will repeat. The Lord gives a command, Moses and Aaron do “as the LORD commanded” (verses 6, 10, 20), the magicians match it, Pharaoh’s heart is hardened, and the narrator adds “as the LORD had said” (verses 13, 22). The refusals do not surprise the Lord. He announced them in verse 4.

  The two acts are not chosen at random. The sign of the rod has been called “the beginning of the contest between Jehovah and Pharaoh,” and it was fought with a serpent, which “was so much a symbol of Pharaoh and his power” (see the note on verse 12). The first plague falls on the Nile, which Egypt held to be the king’s to command (see the note on verse 20). On this reading the chapter aims at Egypt’s king before it aims at anything else, and the plagues as a whole are to be seen through “Jehovah’s triumph over Pharaoh.”

  The chapter ends without a result. Pharaoh “turned and went into his house” (verse 23), his people dig for water, and seven days pass.

sections:
  - range: 1-7
    heading: Moses sent again
    plain: |
      The LORD said to Moses, “See, I have made you a god to Pharaoh, and your brother Aaron will be your prophet. You will say everything I command you, and Aaron will tell Pharaoh to send the children of Israel out of his land. I will harden Pharaoh’s heart and multiply My signs and wonders in Egypt. Pharaoh will not listen to you, so that I may lay My hand on Egypt and bring My armies, My people the children of Israel, out of the land by great judgments. The Egyptians will know that I am the LORD when I stretch out My hand over Egypt and bring Israel out from among them.” Moses and Aaron did just as the LORD commanded. Moses was eighty years old and Aaron eighty-three when they spoke to Pharaoh.
  - range: 8-13
    heading: Aaron’s rod and the magicians’ rods
    plain: |
      The LORD told Moses and Aaron, “When Pharaoh says to you, ‘Show a miracle,’ tell Aaron to take his rod and throw it down before Pharaoh, and it will become a serpent.” They went in to Pharaoh and did so. Aaron threw down his rod before Pharaoh and his servants, and it became a serpent. Pharaoh called for his wise men and sorcerers, and the magicians of Egypt did the same with their enchantments: each threw down his rod, and the rods became serpents. But Aaron’s rod swallowed theirs. And he hardened Pharaoh’s heart, so that he did not listen to them, as the LORD had said.
  - range: 14-18
    heading: The warning at the river
    plain: |
      The LORD said to Moses, “Pharaoh’s heart is hardened; he refuses to let the people go. Go to him in the morning, when he goes out to the water. Stand on the bank of the river to meet him, and take in your hand the rod that was turned into a serpent. Say to him, ‘The LORD, the God of the Hebrews, sent me to you to say, Let My people go, so that they may serve Me in the wilderness; and until now you have not listened. This is what the LORD says: By this you will know that I am the LORD. I will strike the water of the river with the rod in my hand, and it will be turned to blood. The fish in the river will die, the river will stink, and the Egyptians will loathe to drink its water.’”
  - range: 19-25
    heading: The river turned to blood
    plain: |
      The LORD told Moses to have Aaron take his rod and stretch out his hand over the waters of Egypt, over the streams, rivers, ponds, and every pool, so that they would become blood, and there would be blood through all the land, even in vessels of wood and stone. Moses and Aaron did so. He lifted the rod and struck the water of the river while Pharaoh and his servants watched, and all the water in the river was turned to blood. The fish died, the river stank, and the Egyptians could not drink from it; there was blood through all the land of Egypt. The magicians of Egypt did the same with their enchantments. Pharaoh’s heart was hardened, and he did not listen, as the LORD had said. He turned and went into his house and did not take even this to heart. All the Egyptians dug along the river for water to drink, because they could not drink the river’s water. Seven days passed after the LORD struck the river.

notes:
  - ref: 1
    phrase: I have made thee a god to Pharaoh
    kind: history
    title: A god to Pharaoh
    body: |
      The Lord answers Moses’s objection by changing where Moses stands before the king, and the Joseph Smith Translation says what that standing is: a prophet’s. Moses had asked how Pharaoh would ever listen to him ([[Ex. 6:30]]). The reply sets up a chain. The Lord commands Moses, Moses tells Aaron, and Aaron speaks to the king (verse 2): “God would instruct Moses, then Moses would direct Aaron, and Aaron, as spokesman, would speak with the Pharaoh.” The Lord had described the brothers the same way at the bush: “thou shalt be to him instead of God” ([[Ex. 4:16]]).

      The Joseph Smith Translation reads “prophet” where the King James Version has “god” and “spokesman” where it has “prophet”: Moses is a prophet to Pharaoh, and Aaron speaks for him.

      Egypt explains why the stronger wording would fit the occasion. The king was held to be divine (see [[Ex. 5:1]]), so that “any normal meeting between Moses and Pharaoh would have been between unequals.” One reading is that giving Moses an attendant prophet put him on the king’s level, and that this “innately lifted Jehovah above Pharaoh, because Jehovah was still greater than Moses.”
    sources: [lds-scriptures, ot-minute-ex-7, muhlestein-pharaoh]
  - ref: 4
    phrase: mine armies
    kind: words
    title: Slaves called armies
    body: |
      The Lord calls a people in bondage His armies, and the Hebrew word is the one translated “hosts” when they leave: “all the hosts of the LORD went out from the land of Egypt” ([[Ex. 12:41]]). One older reading takes it to look ahead to the manner of the departure, with Israel “organized as an army according to the tribes,” and concludes that “in this respect the Israelites were called the hosts of Jehovah.”
    sources: [oshb-wlc, keil-exodus]
  - ref: 5
    phrase: the Egyptians shall know that I am the LORD
    kind: history
    title: What the plagues were for
    body: |
      The plagues are sent so that Egypt will know who the LORD is, and this verse says so before the first one. It answers Pharaoh’s “I know not the LORD” ([[Ex. 5:2]]), and the Lord repeats it as the plagues go on: “that thou mayest know that there is none like me in all the earth” ([[Ex. 9:14]]).

      Against whom is the lesson directed? On the last night the Lord says, “against all the gods of Egypt I will execute judgment” ([[Ex. 12:12]]), and many have tried to pair each plague with one god. The attempts “have been executed with varying degrees of success.” Some plagues “can be related to the responsibilities of specific Egyptian deities”; for the lice and the flies there is “no clear connection,” only a suggestion that flying insects allude to a god pictured as a beetle.

      Another reading takes the plagues as a whole and begins with the king. Pharaoh cannot be separated “from the pantheon of which he was an integral part and for which he served as the earthly representative” (see [[Ex. 5:1]]). His office was “to safeguard created order by attacking the forces of disorder.” Foul water, vermin, disease, ruined crops and a darkened sun were, one at a time, “just the sort of thing that the king was supposed to prevent,” and “their arrival in an unrelenting sequence could be seen as nothing short of chaos triumphing over order.” On this reading the plagues showed Egypt that its king could not do what a king was for.

      Israel was watching too. The Israelites “had been influenced by Egyptian idolatry,” and the contest would “make it clear to the Israelites that he alone was divine.”

      Abinadi uses the same sentence of King Noah, whose answer to him echoed Pharaoh’s (see [[Ex. 5:2]]): Noah “shall know that I am the Lord” ([[Mosiah 12:3]]).
    sources: [muhlestein-pharaoh, sc-knowhy-631, sc-knowhy-516, sc-knowhy-731]
  - ref: 10
    phrase: it became a serpent
    kind: words
    title: Serpent or crocodile?
    body: |
      The creature in Pharaoh’s court is named by a different Hebrew word from the snake at the burning bush, a broader word that can also mean a crocodile. At the bush the rod became a *nachash*, the ordinary word for a snake ([[Ex. 4:3]]). Here it becomes a *tannin*, which the lexicon glosses “serpent, dragon, sea-monster,” and which is “a broad term describing reptilian creatures of various sizes: snakes, crocodiles, and even legendary sea serpents.” It is Ezekiel’s word for Pharaoh himself: “the great dragon that lieth in the midst of his rivers” ([[Ezek. 29:3]]).

      The question is not settled. The lexicon puts these verses under the sense “serpent.” One study judges that “the word likely used actually means ‘crocodile,’” though it is “difficult to know” whether that was the original word. The chapter itself treats the two as one: verse 15 calls it “the rod which was turned to a serpent” and uses the ordinary word. Little turns on the choice, since “the crocodile has royal and chaos associations that are very similar to that of the snake.”
    sources: [oshb-wlc, bdb, sc-knowhy-732, muhlestein-pharaoh]
  - ref: 11
    phrase: the magicians of Egypt
    kind: history
    title: Pharaoh’s magicians
    body: |
      The magicians are named by a word that probably comes from an Egyptian title often held by priests, the same word used of the men who failed to read an earlier Pharaoh’s dreams ([[Gen. 41:8]]). The Hebrew word means “engraver, writer,” used “only in derived sense of one possessed of occult knowledge.” Scripture uses it almost always of Egyptians, which suggests “Egyptian origin,” and one study derives it from an Egyptian “title often borne by Egyptian priests”; the derivation is not agreed on. The verse sets them beside “the wise men.”

      The Old Testament does not name them. Paul does: “Jannes and Jambres withstood Moses” ([[2 Tim. 3:8]]).

      The story marks the limit of what they can do. Their rods are swallowed here. They add blood to blood (verse 22) and frogs to frogs, but they never prevent a plague or overcome one, so that their first two successes likely made matters worse for Egypt. At the third plague they fail and tell Pharaoh, “This is the finger of God” ([[Ex. 8:19]]). At the sixth they “could not stand before Moses because of the boils” ([[Ex. 9:11]]), and they are not heard from again. How they did what they did the text does not say; *Scripture Helps* gives a latter-day apostle’s view beside these verses.
    sources: [bdb, sc-knowhy-731, bd-jannes-and-jambres, scripture-helps-ex-7]
  - ref: 12
    phrase: Aaron’s rod swallowed up their rods
    kind: symbol
    title: The serpent on Pharaoh’s brow
    body: |
      A serpent was the emblem of Pharaoh’s own power, so a contest of serpents in his court was a contest about him. The king “wore the Uraeus, a snake-shaped crownlet, which was charged with power and ‘spat fire at the king’s enemies.’” Royal inscriptions speak of it as a weapon: in the annals of Thutmose III the god tells the king, “My serpent on your brow consumed them,” and Ramses II says, “The serpent on my brow felled my foes.”

      The snake had a second meaning in Egypt. It was “one of the major symbols for chaos,” and “another strong symbol for chaos was foreigners.” On this reading a foreigner who threw a serpent down before the king would have been seen as acting out a battle the king was supposed to win. Instead “Jehovah dared to show his power via a snake and came away from the battle as the victor,” which “must have been viewed as a direct challenge to Pharaoh’s power.” Put more simply: “In ancient Egypt, the serpent represented deity. Pharaoh was shown who the true deity was: the Lord.”

      Pharaoh’s magicians do produce serpents. The sign is in what happens next, and it leaves them without their rods.
    sources: [muhlestein-pharaoh, ot-minute-ex-7]
  - ref: 15
    phrase: Get thee unto Pharaoh in the morning
    kind: structure
    title: Nine plagues in three rounds
    body: |
      The morning meeting at the water opens the first of three rounds, on one older reading of how the plagues are arranged. The first nine fall “in three groups of three plagues each.” The first plague of each round (the first, fourth and seventh) is “announced to Pharaoh in the morning”; the second is announced as well; the third (the third, sixth and ninth) comes “without any such announcement.” The tenth stands apart from all nine “both in purpose and form.”

      The arrangement shows a progress that a list of ten hides, and each round ends at a turn in the story: [[Ex. 8:19]], [[Ex. 9:11]], and [[Ex. 10:28]]. By the third plague the magicians “were put to shame with their arts”; by the sixth they “were smitten themselves”; after the ninth Pharaoh breaks off all dealings with Moses. The same reading has the first three plagues fall on “the whole land,” Israel included, with “the separation” between Egypt and Israel beginning at the fourth ([[Ex. 8:22]]).

      Why Pharaoh went out to the water each morning “is not stated.” Bathing, “devotions to the Nile,” and measuring “how much the river had risen” have each been suggested.
    sources: [keil-exodus, cambridge-exodus]
  - ref: 20
    phrase: all the waters that were in the river were turned to blood
    kind: history
    title: Why the river first
    body: |
      The first plague strikes the thing Egypt lived by and the thing its king was supposed to command. “The Nile was the sacred river of Egypt,” and because the country has almost no rain, the land “is dependent upon the annual flood for water.”

      Egyptian texts put the river in the king’s hands. He is “in charge of the Nile”; one Pharaoh was told that “the water in the river is drunk when you wish.” An Egyptian text, the Admonitions of Ipuwer, pictures the opposite. It says that under a weak king, or none, the “river is blood, as one drinks of it one shrinks from people and thirsts for water.” So “in contaminating the Nile, Jehovah had shown his superiority in an area that was an integral part of the king’s powers.” The god proposed for this plague is Hapi, who “personified the annual inundation that usually brought life and fertility” (on such pairings see the note on verse 5).

      The Nile is known to redden. In years of extreme flood, soil rich in algae “turns the waters blood-red, giving off a putrid smell, killing the fish, and making the waters undrinkable.” That “does not mean that the plagues were not divine ‘signs and wonders.’” The text’s own emphasis is on what no flood explains: the plague is announced beforehand, it comes at the stroke of the rod “in the sight of Pharaoh” (verse 20), it reaches, in the King James wording, even the water “in vessels of wood, and in vessels of stone” (verse 19), and it lasts a counted seven days (verse 25).
    sources: [bd-nile, muhlestein-pharaoh, sc-knowhy-631]

christ: |
  The LORD who speaks in this chapter is Jehovah ([[Ex. 3:14]]), and what He wants from Egypt is to be known: “the Egyptians shall know that I am the LORD” (verse 5). In this chapter He acts through servants. Moses carries His word and Aaron speaks it, and neither does anything but “as the LORD commanded” (verse 6).

explore: |
  - **Waters turned to blood again.** The Church’s footnote to verse 17 cross-references John’s two prophets, who “have power over waters to turn them to blood, and to smite the earth with all plagues” ([[Rev. 11:6]]).
  - **The magicians’ last appearances.** Follow them through [[Ex. 8:7]], [[Ex. 8:18–19]], and [[Ex. 9:11]], and read what Paul makes of them in [[2 Tim. 3:8–9]].
  - **“Know that I am the LORD.”** Trace the phrase from [[Ex. 5:2]] through [[Ex. 7:17]], [[Ex. 9:14]], and [[Ex. 14:4]], and then read [[Mosiah 12:2–3]].
  - **The plagues retold.** [[Ps. 78:43–51]] and [[Ps. 105:26–36]] retell the plagues in song.
  - **Pharaoh and the plagues.** The study “‘What I Will Do to Pharaoh’” (in *From Creation to Sinai*) takes each plague in turn beside what Egypt believed about its king, and then the plagues as a whole.

parallels:
  - ref: Mosiah 12:3
    note: Abinadi says of King Noah what the Lord says here of the Egyptians, that he “shall know that I am the Lord.”

