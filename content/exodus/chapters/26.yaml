chapter: 26
title: The Tabernacle and Its Veil
tagline: The LORD describes the tent that will be His dwelling. Curtains worked with cherubim are laid over a frame of gilded boards, and a veil divides the holy place from the most holy.
when: 'While Moses is on Mount Sinai forty days and forty nights (24:18).'

setting: |
  Moses is on Mount Sinai, where he stays forty days and forty nights ([[Ex. 24:18]]). The instructions for the LORD’s sanctuary began in the last chapter with the things it will hold: the ark and its mercy seat, the table, and the candlestick. This chapter describes the building that houses them. Why the LORD asks for a dwelling among His people is taken up at [[Ex. 25:8]], the pattern shown to Moses at [[Ex. 25:9]], the materials at [[Ex. 25:5]], and the cubit at [[Ex. 25:10]].

  The structure is small. It was “oblong, 30 cubits in length and 10 in breadth and height,” which is about forty-five feet long and fifteen feet wide and high. Curtains were laid over a frame of upright boards, and the whole could be taken apart and carried. The court around it, and the altar that stood there, come in the next chapter.

  The making of all this is told in nearly the same words at [[Ex. 36:8–38]]. Hebrews describes the finished tent with its two rooms and its “second veil” ([[Heb. 9:3]]), and reads the arrangement as teaching about Christ (see the note on verse 33).

thread: |
  The chapter describes the LORD’s dwelling beginning with its innermost covering. First come the ten linen curtains worked with cherubim, which the text calls “the tabernacle” itself (verses 1–6). Over them goes a tent of goats’ hair, and over that two coverings of skins (verses 7–14). Only then come the gilded boards on which all of it hangs (verses 15–30). The inner of the two hangings comes first, the veil before the ark (verses 31–35), and then the hanging for the door (verses 36–37). On one reading that order is itself the teaching, “showing that God first taught the more sacred before moving to the less sacred.”

  The materials are read the same way: clasps of gold on the linen and of brass on the goats’ hair, silver under the pillars of the veil and brass under those of the door (see the note on verse 37).

  Two sentences stand out from the measurements. The many pieces are to be fastened so that the dwelling “shall be one” (verse 6; of the tent in verse 11). And the whole is to be raised “according to the fashion thereof which was shewed thee in the mount” (verse 30), as the last chapter said of its furniture ([[Ex. 25:40]]): the structure “was based on both a vision and a description.”

  One line brings these details together. The veil “shall divide unto you between the holy place and the most holy” (verse 33). The rest of scripture has a great deal to say about that curtain: who passed it and when, and what it meant that it was there.

sections:
  - range: 1-6
    heading: The curtains of linen
    plain: |
      “Make the tabernacle of ten curtains of fine twined linen with blue, purple and scarlet, and work cherubim into them with skilled work. Each curtain is to be twenty-eight cubits long and four cubits wide, all of one size. Join five of the curtains to one another, and the other five likewise.

      “Make loops of blue along the edge of the end curtain of one set, and the same along the facing edge of the other set: fifty loops on each, opposite one another. Make fifty clasps of gold and join the two sets with them, so that the tabernacle is one whole.”
  - range: 7-14
    heading: The tent of goats’ hair and the coverings
    plain: |
      “Make curtains of goats’ hair for a tent over the tabernacle, eleven of them, each thirty cubits long and four cubits wide. Join five into one set and six into another, and fold the sixth curtain double at the front of the tent. Make fifty loops on the edge of each set and fifty clasps of brass; put the clasps into the loops and join the tent so that it is one.

      “The half curtain that is left over is to hang down the back of the tabernacle, and the extra cubit of length on each side is to hang over the sides of the tabernacle to cover it. Make a covering for the tent of rams’ skins dyed red, and above it a covering of badgers’ skins.”
  - range: 15-30
    heading: The boards, the sockets and the bars
    plain: |
      “Make upright boards of acacia wood for the tabernacle, each ten cubits long and a cubit and a half wide, with two tenons set side by side. Make twenty boards for the south side, with forty sockets of silver under them, two under each board for its two tenons; and twenty boards with forty silver sockets for the north side. For the west end make six boards, and two more for the two corners, joined at the bottom and joined at the top to one ring: eight boards with sixteen sockets of silver.

      “Make bars of acacia wood, five for the boards of each side and five for the west end, with the middle bar in the midst of the boards reaching from end to end. Overlay the boards with gold, make rings of gold to hold the bars, and overlay the bars with gold. Then set up the tabernacle according to the plan you were shown on the mountain.”
  - range: 31-37
    heading: The veil and the door
    plain: |
      “Make a veil of blue, purple, scarlet and fine twined linen, of skilled work, with cherubim. Hang it by hooks of gold on four pillars of acacia wood overlaid with gold, standing on four sockets of silver. Hang the veil under the clasps, and bring the ark of the testimony in behind it. The veil is to divide the holy place from the most holy for you. Put the mercy seat on the ark of the testimony in the most holy place. Set the table outside the veil on the north side, and the candlestick opposite it on the south side.

      “Make a hanging for the door of the tent, of blue, purple, scarlet and fine twined linen, worked with needlework. Make five pillars of acacia wood for it and overlay them with gold, with hooks of gold, and cast five sockets of brass for them.”

notes:
  - ref: 1
    phrase: thou shalt make the tabernacle with ten curtains
    kind: words
    title: The curtains themselves are the tabernacle
    body: |
      In this verse “the tabernacle” is first of all the ten linen curtains, not the whole compound. The Hebrew word names a structure “of planks lined with vari-coloured tapestry,” with a tent over it. The chapter keeps the two apart. The goats’ hair curtains of verse 7 are made, in the Hebrew, “as a tent” upon the tabernacle: “Over the tabernacle the tent was spread.”

      That makes four layers. Innermost is the linen, in blue, purple and scarlet, with cherubim; then the goats’ hair; then “an inner covering of ramskins dyed red”; then “a covering of badger skins over all.” (The colors and the skins are treated at [[Ex. 25:5]].) The linen served “as an inner lining to the tent covering”: “The most beautiful and costly of the four layers that cover the tabernacle is on the inside, not the outside.”

      Two practical details are explained by the weaving. The linen comes in ten strips because each is four cubits wide, about six feet, and “six feet is about the widest fabric a ground loom can make.” And the goats’ hair curtains are two cubits longer than the linen so that, as verse 13 says, a cubit hangs over on each side “to cover it”: the plain cloth protects “the more colorful and costly fabric below.”
    sources: [bdb, lds-scriptures, bd-tabernacle, ot-minute-ex-25]

  - ref: 1
    phrase: cherubims of cunning work
    kind: symbol
    title: Cherubim overhead and on the veil
    body: |
      Cherubim are woven into two pieces of cloth in the tabernacle, the inner curtains and the veil (verse 31), so that a priest in the holy place saw them above him and in front of him. The door hanging has none: “unlike the other cloth items associated with ingress and egress (the other ‘doors’), the veil also included images of cherubim similar to those on the innermost roof covering.”

      The text does not say why they are here. What cherubim do elsewhere in scripture suggests a reason: they guard a place, as at the east of Eden ([[Gen. 3:24]]). What they are and what they do is taken up at [[Ex. 25:18]], where two of gold are set on the mercy seat. On this reading the cherubim on the veil mark the way to the LORD’s presence as guarded. They do not mark it as closed, since the cherubim’s function “is not only to keep things out, but to allow them in as well. Similarly, the veil was not a one-way entry.”

      One reading carries the comparison with Eden further: on the Day of Atonement “Adam’s eastward expulsion from the Garden is reversed when the high priest travels west past the consuming fire of the sacrifice and the purifying water of the laver, through the veil woven with images of cherubim.” That is an interpretation; the chapter itself draws no line to Eden.

      “Cunning” here has nothing to do with slyness. It is the older English for skill.
    sources: [belnap-dwell-among, lds-scriptures, morales-tabernacle, bdb]

  - ref: 6
    phrase: fifty taches of gold
    kind: words
    title: Clasps that make the curtains one
    body: |
      A tache is a clasp, and the fifty of them turn two great sheets of linen into a single covering. The Hebrew word is a “hook, on edge of curtains of tabernacle, matching the loops.” The ten curtains are first joined five and five. Fifty loops of blue run along the facing edge of each set, and the gold clasps catch them together. The verse states the result, “it shall be one tabernacle,” or “the tabernacle shall be unified.” The goats’ hair tent is joined the same way with clasps of brass, “that it may be one” (verse 11).

      The line of gold clasps has a second use, and verse 33 names it: “thou shalt hang up the veil under the taches.” The join between the two sets of curtains “fell at the line between the two rooms.”
    sources: [lds-scriptures, bdb, ot-minute-ex-25]

  - ref: 15
    phrase: boards for the tabernacle of shittim wood standing up
    kind: history
    title: 'The frame: boards, sockets and bars'
    body: |
      The curtains hung over a frame of forty-eight upright boards that could be taken apart and carried. Three sides “were made of 46 boards (10 cubits by 1½) and two narrower corner ones of acacia wood,” all “overlaid with gold”; the entrance, toward the east, was “closed by a screen.” (Shittim wood is treated at [[Ex. 25:5]].) Each board stood ten cubits tall, about fifteen feet. “There is debate whether the panels were solid or simply frames.”

      The King James words name the joinery. A tenon “was one of two large rectangular dowels at the bottom end of each board,” and each tenon sat in a socket, a base of silver. Two separate bases under each board meant that “every socket could rest on the ground even when it was irregular.” Bars of gilded acacia ran through gold rings on the boards “to fasten all firmly together”; how the five bars on each wall were arranged is not clear from the text, and “there is significant debate” about it.

      The book later says where the silver for the sockets came from. There are ninety-six sockets under the boards and four more under the pillars of the veil (verse 32), and a hundred sockets are cast from a hundred talents of silver ([[Ex. 38:27]]). That silver was not part of the freewill offering. It was the ransom money of the men who were numbered, so the walls of the LORD’s dwelling stood on the ransom of the people (see the note on [[Ex. 30:15]]). On one reading that foundation is a figure of “the ransom (redemption) made through Christ.”
    sources: [bd-tabernacle, ot-minute-ex-25, ot-manual-ex-25-30, lds-scriptures]

  - ref: 31
    phrase: thou shalt make a veil
    kind: history
    title: The veil before the ark
    body: |
      The veil was a curtain of the same rich fabric as the tabernacle’s inner covering, hung on four gilded pillars, and it “divided” the tent “into two parts.” Behind it stood the ark (see the note on verse 34). In front of it the priests did their daily work.

      Almost no one passed it. The LORD told Moses to warn Aaron “that he come not at all times into the holy place within the veil before the mercy seat, which is upon the ark; that he die not” ([[Lev. 16:2]]), and Hebrews sums up the rule that followed: “into the second went the high priest alone once every year, not without blood” ([[Heb. 9:7]]).

      The chapter does not say why a curtain should stand between Israel and the place where the LORD had promised to meet them, but its verb is a clue. The veil is to “divide” the holy from the most holy, and the same Hebrew verb is used in the Creation account, where the firmament is made to “divide the waters from the waters” ([[Gen. 1:6]]). The word is used for “the separating or the ordering of the different elements of the creation: light from dark, upper waters from lower waters, day from night.” On that reading the veil “may have also represented the ongoing nature of the creation, as well as the distinction between mortal and divine spheres.”
    sources: [bd-tabernacle, lds-scriptures, morales-tabernacle, belnap-dwell-among]

  - ref: 33
    phrase: the veil shall divide unto you between the holy place and the most holy
    kind: christ
    title: The veil and the flesh of Christ
    body: |
      The New Testament reads the veil as a figure of the flesh of Jesus Christ, and His death as the opening of the way through it. In scripture “veil” names both this divider and “a symbol for a separation between God and man.” Hebrews says what the tabernacle’s veil taught while it hung: “the way into the holiest of all was not yet made manifest, while as the first tabernacle was yet standing” ([[Heb. 9:8]]).

      Matthew records what happened to the veil of the temple in the hour Jesus died: “the veil of the temple was rent in twain from the top to the bottom” ([[Matt. 27:51]]). In Hebrews, believers have “boldness to enter into the holiest by the blood of Jesus, By a new and living way, which he hath consecrated for us, through the veil, that is to say, his flesh” ([[Heb. 10:19–20]]).

      The identification is Hebrews’ own; the verse in Exodus says only that the veil “shall divide.”
    sources: [lds-scriptures, gs-veil]

  - ref: 34
    phrase: in the most holy place
    kind: history
    title: 'Two rooms: the holy place and the Holy of Holies'
    body: |
      The veil made two rooms of unequal size and unequal access. The inner one, “also called ‘Most Holy Place,’” is the Holy of Holies, “the most sacred room in the tabernacle and, later, in the temple.” The outer room, the holy place, was “20 cubits by 10,” twice as long as it was wide.

      The chapter gives no measurements for the inner room. Since the whole structure was thirty cubits long and ten wide and high, one older reading concludes that “the most holy place was a cube of ten cubits in every direction.” It sets that cube beside the inner room of Solomon’s temple, a cube of twenty cubits, and beside the holy city of John’s vision ([[Rev. 21:16]]), which that reading also calls “a perfect cube.”

      Verses 34 and 35 then place the furniture already commanded. The inner room “contained only one piece of furniture,” the ark, with the mercy seat upon it (see [[Ex. 25:10]] and [[Ex. 25:17]]). Outside the veil the table stood on the north side and the candlestick on the south (see [[Ex. 25:23]] and [[Ex. 25:31]]). The altar of incense, which stood “in the middle, before the veil,” is not commanded until [[Ex. 30:1]].

      Hebrews describes the same two rooms: “the first, wherein was the candlestick, and the table, and the shewbread; which is called the sanctuary,” and beyond the veil “the Holiest of all” ([[Heb. 9:2–3]]). Into the first “the priests went always” ([[Heb. 9:6]]). The inner room was entered once a year (see the note on verse 31).
    sources: [bd-holy-of-holies, bd-tabernacle, keil-exodus, lds-scriptures]

  - ref: 37
    phrase: five sockets of brass
    kind: symbol
    title: Silver under the veil, brass under the door
    body: |
      The hanging at the door is made of the same colors and linen as the veil, but it is the plainer of the two. The veil is “cunning work” with cherubim; the door hanging is “needlework,” and “no cherubim are mentioned.” The veil hangs on four pillars set in silver, the door hanging on five pillars set in brass.

      The change of metal is read as a statement about nearness to God: it marks a progression “from less holy to more holy, brass being the less expensive of the two metals. This gradation of holiness existed throughout the tabernacle.” The clasps of the two coverings are read the same way: gold on the linen within and brass on the goats’ hair over it (verses 6 and 11), “demonstrating the more sacred nature of the inner covering.”

      The whole plan had “three zones of intensifying holiness (outer courtyard, holy place, Holy of Holies).” The court is described at [[Ex. 27:9]].
    sources: [ot-minute-ex-25, morales-tabernacle]

christ: |
  The chapter’s witness of Christ is its veil: Hebrews names that curtain as His flesh and reads His death as the way opened through it (see the note on verse 33). The same letter says where He went: hope “entereth into that within the veil; Whither the forerunner is for us entered, even Jesus, made an high priest for ever after the order of Melchisedec” ([[Heb. 6:19–20]]). Under the law “the high priest alone” went behind the veil, “once every year” ([[Heb. 9:7]]). Hebrews calls Jesus a “forerunner” who has entered “for us.”

  The LORD who gives Moses these measurements is Jehovah (see [[Ex. 3:14]]), and the veil He orders hung before the ark is, by the New Testament’s account, a figure of the flesh He would later take.

explore: |
  - **The tabernacle made and raised.** [[Ex. 36:8–38]], where the curtains, boards and veil are made, and [[Ex. 40:17–21]], where Moses sets them up on the first day of the first month of the second year.
  - **Hebrews on the two rooms.** [[Heb. 9:1–12]] and [[Heb. 10:19–22]].
  - **Within the veil once a year.** [[Lev. 16:2–17]], the Day of Atonement.
  - **The veil rent.** [[Matt. 27:50–51]].
  - **Cherubim at the east of Eden.** [[Gen. 3:24]].
  - **A veil still to be taken off.** A latter-day revelation says of the Lord’s coming that “the veil of the covering of my temple, in my tabernacle, which hideth the earth, shall be taken off, and all flesh shall see me together” ([[D&C 101:23]]).
  - **A study of the tabernacle’s thresholds.** “‘That I May Dwell among Them’: Liminality and Ritual in the Tabernacle” (Religious Studies Center, 2013) looks at the gate, the door and the veil, and at what the cherubim on the veil signified.

