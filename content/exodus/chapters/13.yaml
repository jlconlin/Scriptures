chapter: 13
title: Remember This Day
tagline: On the day Israel leaves Egypt, the LORD claims every firstborn, Moses tells the people how the day is to be remembered in Canaan, and the pillar of cloud and fire goes before the camp.
when: 'The day of the departure from Egypt, in the month Abib (verse 4), and the first marches after it'

setting: |
  The night of the Passover is over. Egypt’s firstborn are dead, Pharaoh has sent Israel away, and the people have journeyed from Rameses to Succoth ([[Ex. 12:37]]). Chapter 12 closes on “the selfsame day” that the LORD brought them out ([[Ex. 12:51]]); chapter 13 holds what was said on that day and how the journey began.

  Four matters fill it: the LORD’s claim on the firstborn of man and beast, the week of unleavened bread as it is to be kept in Canaan, the bones of Joseph, and the pillar of cloud by day and of fire by night. The week of unleavened bread picks up chapter 12. The seven days were commanded there ([[Ex. 12:15–20]]), and that chapter explains the feast and its bread; here Moses gives the command to the people for the years to come. The claim on the firstborn is new, and it follows from the night just past.

  Later scripture returns to all of it. The law repeats the redemption of the firstborn ([[Ex. 34:19–20]]), and Luke shows it kept for the infant Jesus ([[Luke 2:22–23]]). Deuteronomy takes up the sign on the hand and between the eyes ([[Deut. 6:8]]). Joshua tells of the burial of Joseph’s bones ([[Josh. 24:32]]). The psalms and Nehemiah remember the pillar ([[Ps. 78:14]]; [[Neh. 9:12]]), and so does Nephi ([[1 Ne. 17:30]]).

thread: |
  The chapter is about **remembering, and it begins on the day Israel leaves Egypt.** Israel has been free for a day and has not yet reached the sea, and Moses is already speaking of “when the LORD shall bring thee into the land” (verses 5 and 11) and of sons who will one day ask what their fathers are doing.

  The deliverance is fastened to things that come round again. Each year in the month Abib there is a week without leaven (verses 6–7). Each time a firstborn male is born, in the house or in the herd, it is given to the LORD or bought back (verses 12–13). Both observances are to be explained to a child, the first before he asks (verse 8) and the second when he does (verse 14). And both are to be a sign or token on the hand and between the eyes (verses 9 and 16). The reason is given four times in nearly the same words: “by strength of hand the LORD brought you out” (verse 3), “with a strong hand” (verse 9), “By strength of hand” (verse 14), “by strength of hand” (verse 16).

  The last six verses turn from the speech to the road, and they are about who chose it. “God led them not” by the near way; “God led the people about”; “the LORD went before them.” Moses carries the bones of a man who had said, long before, that God would do this (verse 19). The chapter ends with the pillar that did not leave, by day or by night.

sections:
  - range: 1-2
    heading: The firstborn claimed
    plain: |
      The LORD said to Moses, “Set apart to me every firstborn among the children of Israel, the first to open the womb, whether of man or of beast. It is mine.”
  - range: 3-10
    heading: The week of unleavened bread, for the land to come
    plain: |
      Moses said to the people, “Remember this day, the day you came out of Egypt, out of the house of bondage, for the LORD brought you out of this place by the strength of His hand. No leavened bread is to be eaten. Today you are going out, in the month Abib. When the LORD brings you into the land of the Canaanites, Hittites, Amorites, Hivites, and Jebusites, the land He swore to your fathers to give you, a land flowing with milk and honey, you are to keep this service in this month. For seven days you shall eat unleavened bread, and the seventh day is a feast to the LORD. Unleavened bread shall be eaten all seven days. No leavened bread and no leaven is to be seen with you anywhere within your borders. On that day you shall tell your son, ‘This is because of what the LORD did for me when I came out of Egypt.’ It shall be to you as a sign on your hand and a memorial between your eyes, so that the LORD’s law may be in your mouth, for with a strong hand the LORD brought you out of Egypt. Keep this ordinance at its appointed time, year after year.”
  - range: 11-16
    heading: The firstborn given and redeemed
    plain: |
      “When the LORD brings you into the land of the Canaanites, as He swore to you and to your fathers, and gives it to you, you shall set apart to the LORD every firstborn. Every firstborn male of your animals is the LORD’s. Every firstborn donkey you shall redeem with a lamb, and if you will not redeem it, you shall break its neck. Every firstborn among your sons you shall redeem. In time to come, when your son asks you, ‘What is this?’ you shall say to him, ‘By the strength of His hand the LORD brought us out of Egypt, out of the house of bondage. When Pharaoh stubbornly refused to let us go, the LORD slew every firstborn in the land of Egypt, of man and of beast. That is why I sacrifice to the LORD every male that is first to open the womb, and why I redeem every firstborn of my sons.’ It shall be as a token on your hand and as frontlets between your eyes, for by the strength of His hand the LORD brought us out of Egypt.”
  - range: 17-22
    heading: The road and the pillar
    plain: |
      When Pharaoh had let the people go, God did not lead them by the road through the land of the Philistines, though it was near. God said, “The people may change their minds when they see war, and go back to Egypt.” So God led the people around, by the road of the wilderness toward the Red sea. The children of Israel went up out of Egypt equipped for battle. Moses took Joseph’s bones with him, because Joseph had made the children of Israel swear solemnly: “God will surely visit you, and you shall carry my bones up from here with you.” They set out from Succoth and camped at Etham, on the edge of the wilderness. The LORD went before them in a pillar of cloud by day, to lead them on the way, and in a pillar of fire by night, to give them light, so that they could travel by day and by night. The pillar of cloud by day and the pillar of fire by night did not leave its place before the people.

notes:
  - ref: 2
    phrase: Sanctify unto me all the firstborn
    kind: scripture
    title: What became of the claim on the firstborn
    body: |
      The LORD’s claim on Israel’s firstborn became, as the law unfolded, the service of the Levites and a redemption price paid for every firstborn son. To sanctify the firstborn is to consecrate it, to set it apart as the LORD’s own, and the last words of the verse say so: “it is mine.” The reason is the one the father gives his son in verse 15, and the LORD states it again in Numbers: “on the day that I smote all the firstborn in the land of Egypt I hallowed unto me all the firstborn in Israel” ([[Num. 3:13]]). Before the plagues began He had called Israel itself “my son, even my firstborn” (see the note at [[Ex. 4:22]]).

      Under the law the firstborn son “was regarded as belonging to God, and special ordinances were provided for his redemption.” At first the claim meant service: the firstborn son of each family was to serve in a priestly role at the tabernacle, a role the tribe of Levi later filled alone. Numbers tells of the exchange. “I have taken the Levites from among the children of Israel instead of all the firstborn” ([[Num. 3:12]]). The firstborn were then counted against the Levites, and the 273 for whom there was no Levite were redeemed at five shekels each ([[Num. 3:46–47]]). After that the rule for every family was to redeem a firstborn son “from a month old” for “five shekels” ([[Num. 18:15–16]]).

      [The Firstborn](/exodus/themes/the-firstborn/) follows the firstborn from Pharaoh's decree to the tenth plague, the law of redemption and the Firstborn of God.
    sources: [lds-scriptures, bd-firstborn, scripture-helps-ex-7]
  - ref: 4
    phrase: the month Abib
    kind: history
    title: The month Abib
    body: |
      Abib is the old name of the spring month in which Israel left Egypt, the month the LORD had just made “the first month of the year” ([[Ex. 12:2]]). The word means a “green head of grain,” and it is the “name of the harvest month,” which falls in “March or April.” The name most readers know is the later one: “After the Captivity it was known as Nisan.”
    sources: [bd-abib, bd-feasts]
  - ref: 9
    phrase: a sign unto thee upon thine hand, and for a memorial between thine eyes
    kind: symbol
    title: A sign on the hand and between the eyes
    body: |
      In later centuries the sign on the hand and the frontlets between the eyes were worn literally, as phylacteries, passages of scripture on bands of leather; whether the saying was first meant as a figure of speech is disputed. The words come twice in this chapter, once after the week of unleavened bread (verse 9) and once after the redeeming of the firstborn (verse 16), and verse 9 gives the purpose: “that the LORD’s law may be in thy mouth.” The Hebrew word behind “frontlets” in verse 16 means “bands” worn “between the eyes,” and one reading takes it here as “figurative of dedication of firstborn.” A modern translation has “an emblem on your forehead” and notes that the meaning of the Hebrew is uncertain.

      Deuteronomy uses the same pair of the commandments themselves: “thou shalt bind them for a sign upon thine hand, and they shall be as frontlets between thine eyes” ([[Deut. 6:8]]). Phylacteries were strips of “parchment on which were written four passages of scriptures,” two of them from this chapter (verses 1–10 and 11–16), “rolled up and attached to bands of leather worn (as an act of obedience to Ex. 13:9, 16; Deut. 6:8; 11:18) around the forehead or around the arm.” One reading holds that the saying was “originally figurative for perpetual remembrance” and “was taken literally by later Jews, and hence the custom of wearing phylacteries.”

      That is the custom behind the Savior’s words about the scribes and Pharisees: “all their works they do for to be seen of men: they make broad their phylacteries” ([[Matt. 23:5]]). His complaint is about display. They “wore them broader than other people in order to make them as conspicuous as possible.”

      [When Your Children Ask](/exodus/themes/when-your-children-ask/) follows the memorials of Exodus to the Last Supper.
    sources: [bdb, nrsvue, bd-frontlets, lds-scriptures]
  - ref: 13
    phrase: every firstling of an ass thou shalt redeem with a lamb
    kind: history
    title: Why a donkey is redeemed with a lamb
    body: |
      A donkey was an unclean animal, so its firstborn was not sacrificed but bought back with a lamb or destroyed. The firstborn males of animals belonged to God as well as the sons: “Clean animals were used for sacrifices, while unclean animals might be redeemed, sold, or put to death.” One older reading takes the donkey to be named “as the most common of the unclean domestic animals, instead of the whole of these animals,” and Numbers gives the rule in general terms: “the firstling of unclean beasts shalt thou redeem” ([[Num. 18:15]]).

      To “redeem” is to buy back. The verb is “the word used regularly of redeeming a person, or animal, from death or servitude.” A lamb is given for the donkey, and the owner keeps the donkey. If he would not give the lamb he could not keep the animal either: “Unless redeemed, it could not be retained for use by its owner.”

      A firstborn son is the LORD’s as surely as a firstborn lamb, and he is redeemed (verse 15). The price is not named here; the note at verse 2 gives what the law later fixed. Exodus repeats the whole rule at [[Ex. 34:19–20]].

      [The Firstborn](/exodus/themes/the-firstborn/) follows the firstborn from Pharaoh's decree to the tenth plague, the law of redemption and the Firstborn of God.
    sources: [bd-firstborn, keil-exodus, cambridge-exodus, lds-scriptures]
  - ref: 15
    phrase: Pharaoh would hardly let us go
    kind: words
    title: Hardly means stubbornly
    body: |
      “Would hardly let us go” does not mean that Pharaoh barely let Israel go; it means that he stubbornly refused. The Hebrew is one verb, to “make difficult,” and the clause is “Pharaoh made difficulty about sending us away.” Modern translations have “When Pharaoh stubbornly refused to let us go.”

      The same verb stands in the LORD’s words before the plagues, “I will harden Pharaoh’s heart” ([[Ex. 7:3]]). In the answer a father is to give his son, the one who does the hardening is Pharaoh. The question of who hardened Pharaoh’s heart is taken up once, at [[Ex. 4:21]].
    sources: [bdb, nrsvue, niv, oshb-wlc]
  - ref: 17
    phrase: the way of the land of the Philistines
    kind: history
    title: The short road Israel did not take
    body: |
      The near road to Canaan was among the routes Egypt guarded. The route Israel took “kept them from encountering the major forts and encounters with the forces of the Egyptians,” and so it kept clear of “the way of the Philistines and the way of Shur, the shortest and most direct routes to Canaan”; they “avoided the more traveled and well-garrisoned route.” There were “military outposts” on that road, and a people who met them might have “become discouraged and returned to Egypt.”

      The reason the verse gives is about the people and not about the road. God said they might “repent,” that is, change their minds, “when they see war.” They left Egypt “harnessed,” a word that means “in battle array,” and even so equipped they might have lost heart. The Church’s footnote at “repent” points to two later scenes in which the people speak as God here said they might. At the sea, with the Egyptians marching after them, they said, “it had been better for us to serve the Egyptians, than that we should die in the wilderness” ([[Ex. 14:12]]). At the border of Canaan, told that its people “are stronger than we” ([[Num. 13:31]]), they said, “Let us make a captain, and let us return into Egypt” ([[Num. 14:4]]).

      So the longer road was “a longer, but safer, route,” and it was also the one that “hemmed in the Israelites between the Red Sea and Pharaoh’s armies.” Chapter 14 tells what came of that.
    sources: [muhlestein-israel-egypt, ot-minute-ex-7, nrsvue, bdb, lds-scriptures]
  - ref: 18
    phrase: the wilderness of the Red sea
    kind: history
    title: The Red sea, the sea of reeds, and the unknown route
    body: |
      The name in Hebrew is *yam suph*, which probably means “sea of reeds,” and where Israel reached the water is not known. *Suph* is “reeds, rushes,” the word for the “flags” at the river’s edge where the infant Moses was laid ([[Ex. 2:3]]). In Greek the name was taken into the wider name Red Sea, which the King James Version uses. Modern translations keep “Red Sea” in the text and put “Sea of Reeds” in the margin.

      The name has led to a question about the place. Because it can be translated either way, some have thought that Israel camped by another body of water, though other evidence points to the Red Sea itself. In the Old Testament the name is “applied only to arms of Red Sea,” most often the Gulf of Suez and sometimes the Gulf of Akaba, where Solomon built ships “on the shore of the Red sea, in the land of Edom” ([[1 Kgs. 9:26]]). Whichever water it was, “the scriptures suggest that the sea they crossed was a large body of water.”

      Israel’s road to the sea and its camps after leaving Egypt are not known. Etham (verse 20) has not been located; it lay at “the edge of the wilderness,” probably near the sea. The Exodus “most likely began near Avaris/Raameses.” “While we cannot trace the route specifically from there,” Israel “went largely east and a little south.”

      The event itself is not left in doubt. The parting of the sea “is confirmed in latter-day revelation in 1 Ne. 4:2; 17:26–27; Hel. 8:11; Moses 1:25.” The crossing is the subject of chapter 14 ([[Ex. 14:21–22]]).
    sources: [bdb, oshb-wlc, nrsvue, niv, scripture-helps-ex-14, ot-minute-ex-7, muhlestein-israel-egypt, bd-red-sea, lds-scriptures]
  - ref: 19
    phrase: the bones of Joseph
    kind: scripture
    title: Joseph’s bones and the oath behind them
    body: |
      Moses is keeping an oath that Joseph took from Israel on his deathbed. “Joseph took an oath of the children of Israel, saying, God will surely visit you, and ye shall carry up my bones from hence” ([[Gen. 50:25]]), and Exodus repeats his words almost exactly. The note at [[Gen. 50:24]] treats the wording and its return in the Lord’s message to the elders, “I have surely visited you” ([[Ex. 3:16]]).

      Joseph “was put in a coffin in Egypt” ([[Gen. 50:26]]), and there the book of Genesis leaves him. Hebrews counts his request as faith: “By faith Joseph, when he died, made mention of the departing of the children of Israel; and gave commandment concerning his bones” ([[Heb. 11:22]]). The oath was kept in the land, at the end of the book of Joshua: “the bones of Joseph, which the children of Israel brought up out of Egypt, buried they in Shechem, in a parcel of ground which Jacob bought” ([[Josh. 24:32]]).

      In the Joseph Smith Translation of [[Gen. 50:24–38]], “Joseph in Egypt prophesies of Moses freeing Israel from Egyptian bondage.” On that account the man whose bones Moses carried had named him: “a seer will I raise up to deliver my people out of the land of Egypt; and he shall be called Moses.”
    sources: [lds-scriptures, jst-gen-50]
  - ref: 21
    phrase: in a pillar of a cloud
    kind: symbol
    title: The pillar of cloud and fire
    body: |
      The pillar was the visible sign that the LORD Himself was with the camp. The verse gives it three uses: “to lead them the way,” “to give them light,” and so to let them “go by day and night.” It may not be an appearance of God in the full sense, but with it Israel as a people “definitely experienced Jehovah’s presence.”

      There was one pillar and not two. On the morning at the sea the LORD looks out “through the pillar of fire and of the cloud” ([[Ex. 14:24]]), and the night before, the cloud that was darkness to the Egyptians “gave light by night” to Israel ([[Ex. 14:20]]). So “the same pillar acted as both fire and cloud, light and darkness,” and because “it contained the Lord’s presence, the pillar was simultaneously fire and cloud.” Clouds of this kind in scripture “were no doubt clouds of glory, not the dull, gray clouds of rain.”

      Why the LORD’s presence should be shown by fire and by cloud together is a question the text does not answer. One Latter-day Saint reading notes that the pair first appears here and becomes common in divine encounters throughout the Bible, and suggests that “the nature of God is so glorious that as it is revealed, it must also be hidden.”

      Verse 22 adds that the pillar was not taken away. It moves behind the camp at the sea, where the text speaks also of “the angel of God” ([[Ex. 14:19]]). When the tabernacle is raised it rests there, “the cloud of the LORD” by day and fire by night, “in the sight of all the house of Israel, throughout all their journeys” ([[Ex. 40:38]]). Isaiah sees a cloud by day and a fire by night over Zion (see the note at [[Isa. 4:5]]).
    sources: [muhlestein-theophanies, bd-cloud, lds-scriptures]

christ: |
  The law of this chapter was kept for Jesus. Mary and Joseph brought Him to Jerusalem, and Luke gives the reason by citing this law: “Every male that openeth the womb shall be called holy to the Lord” ([[Luke 2:22–23]]). The commandment to dedicate firstborn sons “can remind us of Jesus Christ, who was the firstborn of all the spirit children of Heavenly Father.” He says of Himself, “I was in the beginning with the Father, and am the Firstborn” ([[D&C 93:21]]), and Paul calls Him “the firstborn of every creature” ([[Col. 1:15]]).

  The LORD who goes before Israel in the pillar is Jehovah (see the note at [[Ex. 3:14]]), and Nephi names Him as he tells of the pillar: “the Lord their God, their Redeemer, going before them” ([[1 Ne. 17:30]]).

explore: |
  - [[Num. 3:11–13, 40–51]] and [[Num. 8:14–19]]: the Levites taken in place of the firstborn.
  - [[Luke 2:22–39]]: the firstborn Son presented in the temple.
  - [[Deut. 6:4–9, 20–25]]: the sign on the hand and the son’s question, a generation later.
  - [[Gen. 50:22–26]] and [[Josh. 24:32]]: Joseph’s oath, from his deathbed to his burial.
  - [[Num. 9:15–23]]: how the camp moved and rested by the cloud.
  - [[1 Ne. 17:23–31]]: Nephi’s retelling of the deliverance and the leading.
  - [[D&C 93:21–22]] and [[Heb. 12:23]]: the Firstborn, and the church of the Firstborn.
  - [[1 Pet. 1:18–19]]: redemption and a lamb, in Peter’s words about Christ.

