chapter: 38
title: The Court Made and the Metals Counted
tagline: Bezaleel makes the altar of burnt offering, the laver and the court, and the laver is cast from the mirrors of the women who served at the door. Then the gold, the silver and the bronze of the whole work are weighed and written down.
when: 'At Mount Sinai, while the tabernacle is being made; it is set up “in the first month in the second year, on the first day of the month” (40:17).'

setting: |
  Israel is camped at Sinai, and the work the LORD described to Moses on the mountain is under way. The people have brought their offerings, more than the work needed ([[Ex. 36:5–7]]). Bezaleel and those with him have made the curtains, the boards and the veil of the tent (chapter 36), and then what stands inside it: the ark, the table, the candlestick and the altar of incense (chapter 37).

  This chapter goes outside the tent. It tells of the making of the altar of burnt offering, the laver and the court, in nearly the words of the commands in [[Ex. 27:1–19]] and [[Ex. 30:17–21]]. Each is explained where it is commanded: the altar at [[Ex. 27:1]], the laver at [[Ex. 30:18]], the court at [[Ex. 27:9]].

  The last eleven verses have no counterpart in the instructions. They are an account of the gold, silver and bronze that went into the whole work. After it only the priests’ garments remain to be made ([[Ex. 39:1]]), and then the tabernacle is set up ([[Ex. 40:17]]).

thread: |
  Nearly everything here was said before as a command and is said again as a thing done. “Thou shalt make an altar” ([[Ex. 27:1]]) has become “he made the altar,” and the measurements are the same. Why the book tells the tabernacle twice is taken up in the chapter on [[Ex. 35:1]]. This chapter says two things the commands did not.

  The first is half a verse. The command for the laver named only its metal and its place. Verse 8 says where the metal came from: the mirrors of the women who served at the door of the tent.

  The second is the account that closes the chapter. It names who kept it, Ithamar and the Levites, and who did the work, Bezaleel and Aholiab (see [[Ex. 31:2]]). Then it gives the weight of each metal and what was made of it. The three do not come in the same way. The gold and the bronze are “of the offering,” brought by those whose hearts were willing ([[Ex. 35:22]]; [[Ex. 35:24]]). The silver in the account is “of them that were numbered”: the half shekel that each counted man paid alike (see [[Ex. 30:12]]).

  The account also follows each metal to its place. The silver went to the hundred bases under the sanctuary and the veil, the bronze to the altar and to the bases and pegs of the court. On how the metals mark nearness to the LORD’s presence, see [[Ex. 27:9]].

sections:
  - range: 1-7
    heading: The altar of burnt offering
    plain: |
      He made the altar of burnt offering of acacia wood, five cubits long and five cubits wide, square, and three cubits high. He made horns on its four corners, of one piece with it, and overlaid it with bronze. All its utensils he made of bronze: the pots, the shovels, the basins, the fleshhooks and the firepans.

      He made a bronze grating of network for the altar, under its rim, reaching halfway up. He cast four rings for the four corners of the grating to hold the poles. He made the poles of acacia wood overlaid with bronze and put them through the rings on the altar’s sides to carry it. He made the altar hollow, of boards.
  - range: 8-8
    heading: The laver, from the women’s mirrors
    plain: |
      He made the laver of bronze, and its base of bronze, from the mirrors of the women who served at the door of the tent of meeting.
  - range: 9-20
    heading: The court and its gate
    plain: |
      He made the court. On the south side its hangings were of fine twined linen, a hundred cubits long, with twenty pillars on twenty bronze bases; the hooks and fillets of the pillars were silver. The north side was the same. The west side had fifty cubits of hangings, with ten pillars and ten bases.

      The east side was fifty cubits. On each side of the gate were fifteen cubits of hangings, with three pillars and three bases. All the hangings around the court were of fine twined linen. The bases of the pillars were bronze; their hooks, their fillets and the overlay of their capitals were silver.

      The screen for the gate of the court was needlework of blue, purple and scarlet and fine twined linen, twenty cubits long and five cubits high, corresponding to the hangings of the court, on four pillars with four bronze bases. All the pegs of the tabernacle and of the court around it were bronze.
  - range: 21-23
    heading: The account, and who kept it
    plain: |
      This is the reckoning of the tabernacle, the tabernacle of the testimony, drawn up at Moses’s command. The Levites drew it up under the direction of Ithamar, son of Aaron the priest.

      Bezaleel the son of Uri, the son of Hur, of the tribe of Judah, made all that the LORD commanded Moses. With him was Aholiab the son of Ahisamach, of the tribe of Dan, an engraver, a skilled workman, and an embroiderer in blue, purple, scarlet and fine linen.
  - range: 24-31
    heading: The gold, the silver and the bronze
    plain: |
      All the gold used in the work of the holy place, the gold of the offering, was twenty-nine talents and 730 shekels, by the shekel of the sanctuary.

      The silver from those of the congregation who were numbered was a hundred talents and 1,775 shekels, by the shekel of the sanctuary. That is a bekah a head, half a shekel, for everyone who was numbered from twenty years old and upward: 603,550 men. From the hundred talents were cast the bases of the sanctuary and of the veil, a hundred bases, a talent to a base. Of the 1,775 shekels he made hooks for the pillars, overlaid their capitals, and made their fillets.

      The bronze of the offering was seventy talents and 2,400 shekels. With it he made the bases for the door of the tent of meeting, the bronze altar with its grating and all its utensils, the bases of the court and of its gate, and all the pegs of the tabernacle and of the court.

notes:
  - ref: 8
    phrase: the lookingglasses of the women assembling
    kind: history
    title: Mirrors given by the women who served at the door
    body: |
      The laver was made from bronze mirrors, and the women who gave them are described by a word for service at the sanctuary. A mirror then was not glass. It was “a poured slab of bronze that was then polished to provide a small amount of reflection,” and the mirrors “either were melted down or possibly hammered into shape to create the laver.” The gift can be read as devotion: the women “showed their great devotion to the Lord by offering a valuable possession.”

      “Assembling” hides what the women were doing. The Hebrew verb means to wage war, and in a second sense to “serve at sacred tent.” It is used that way of the Levites, and of women only here and in [[1 Sam. 2:22]], where the King James again has “the women that assembled at the door of the tabernacle of the congregation.” The phrase in this verse is then “the mirrors of the serving-women,” and a modern translation reads “the mirrors of the women who served at the entrance to the tent of meeting.” The plain-words rendering above follows them. On “tent of meeting,” see [[Ex. 27:21]].

      The verse does not say what their service was.
    sources: [ot-minute-ex-25, bdb, nrsvue, lds-scriptures]

  - ref: 21
    phrase: This is the sum of the tabernacle
    kind: history
    title: An account of the metals, kept by the Levites under Ithamar
    body: |
      Verses 21–31 are a written account of the metal that went into the tabernacle, and verse 21 is its heading. A modern translation reads the whole verse, “These are the records of the tabernacle, the tabernacle of the covenant, which were drawn up at the commandment of Moses, the work of the Levites being under the direction of Ithamar son of the priest Aaron.”

      The King James “for the service of the Levites” can be read as though the account were made for the Levites’ use. On the modern rendering the Levites did the reckoning, with Ithamar over them, and the plain-words rendering above follows it.

      Ithamar was the “youngest son of Aaron,” named with his brothers when the priests were called ([[Ex. 28:1]]). Numbers gives him the same kind of charge again. When the camp moves, the service of the Levite families of Gershon and Merari is “under the hand of Ithamar the son of Aaron the priest” ([[Num. 4:28]]; [[Num. 4:33]]). The Levites are introduced at [[Ex. 32:26]].

      The “testimony” in “the tabernacle of testimony” is the two tables of stone, which were to lie in the ark; the name is explained at [[Ex. 31:18]]. It returns when the Levites are given their charge, “over the tabernacle of testimony, and over all the vessels thereof” ([[Num. 1:50]]).
    sources: [lds-scriptures, nrsvue, bd-ithamar]

  - ref: 24
    phrase: twenty and nine talents
    kind: history
    title: How much metal the account records
    body: |
      At about seventy-five pounds to the talent, the account records about 2,200 pounds of gold, 7,600 of silver and 5,350 of bronze: about one metric ton, three and a half, and nearly two and a half. These are weights, since a shekel in Moses’s day was a weight and not a coin (see [[Ex. 30:15]]).

      The chapter itself shows how many shekels made a talent. Verse 26 counts 603,550 men at half a shekel each, which is 301,775 shekels. Verse 25 gives the same silver as a hundred talents and 1,775 shekels. A talent was therefore 3,000 shekels.

      The talent is reckoned at “about 75.6 pounds, or 34.272 kilograms.” The figures are approximate. Biblical weights varied over time, and of the shekel in particular, “It is uncertain what its exact weight was in early times.”

      Each base under the boards of the tent was “a talent for a socket” (verse 27), a block of silver of some seventy-five pounds.
    sources: [bd-weights-and-measures, lds-scriptures]

  - ref: 26
    phrase: six hundred thousand and three thousand and five hundred and fifty men
    kind: history
    title: The count behind the silver
    body: |
      The silver in the account is the half shekel that every man numbered was to give as a ransom for his life, and the total is the same as the census in Numbers. The command, and what the ransom was for, are at [[Ex. 30:12]]. The number here, 603,550, is exactly the number in [[Num. 1:46]]: “Even all they that were numbered were six hundred thousand and three thousand and five hundred and fifty.”

      The dates raise a question. The census in Numbers is ordered “on the first day of the second month, in the second year” ([[Num. 1:1]]), and the tabernacle was set up a month before that, “in the first month in the second year, on the first day of the month” ([[Ex. 40:17]]). Yet the silver of the numbered men was cast into the bases the tabernacle stood on. One older reading reconciles the two by a “simple assumption”: the men were counted and the money collected when the offerings for the tabernacle were first called for, and afterward the whole nation “was enrolled according to its tribes, fathers’ houses, and families, on the basis of this provisional numbering.” That, on this reading, is why “the census gave exactly the same number of males as the numbering.” The text does not explain it.

      What a number of this size implies, and whether such numbers have come down as first written, is treated at [[Ex. 12:37]].
    sources: [lds-scriptures, keil-exodus]

christ: |
  How the things made in this chapter are read of Jesus Christ is said where each is first commanded. The altar of verses 1–7 is where Israel’s sacrifices were offered, and those sacrifices “were symbolic of the atoning sacrifice of Jesus Christ” (see [[Ex. 27:1]]).

  The silver of verses 25–28 was paid by every numbered man “to make an atonement for your souls” ([[Ex. 30:16]]), and here it becomes the hundred bases on which the sanctuary stands. The New Testament uses the word “ransom” of Christ ([[Matt. 20:28]]). The passages are in the chapter on [[Ex. 30:12–16]], with one Latter-day Saint study’s reading of the ransom silver under the tabernacle.

