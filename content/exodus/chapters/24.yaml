chapter: 24
title: The Blood of the Covenant
tagline: Israel hears the LORD’s words and agrees to them, and Moses puts the blood of the covenant on the altar and on the people. Seventy elders see the God of Israel and eat in His presence, and Moses goes up into the cloud for forty days.
when: 'The third month after Israel left Egypt (19:1), in the days after the Ten Commandments were spoken; the chapter closes with Moses forty days and forty nights on the mount.'

setting: |
  Israel has been camped before Sinai since the third month ([[Ex. 19:1]]). The LORD has spoken the Ten Commandments from the mountain in the hearing of all the people, and the people, afraid, have asked Moses to hear the rest for them ([[Ex. 20:19]]): “the people stood afar off, and Moses drew near unto the thick darkness where God was” ([[Ex. 20:21]]). What he heard there is the body of judgments in chapters 21–23. This chapter opens without naming its speaker. It is the LORD, still speaking to Moses on the mountain, and in verse 3 Moses comes down to tell the people.

  Chapter 24 is where the covenant offered in chapter 19 is made. Moses reports the LORD’s words, writes them, and binds the people to them with sacrifice and blood: “these rites initiated the Israelites into a covenant relationship with God.” Then Israel’s leaders go up and see God, and Moses goes higher still to receive the tables of stone. The chapter closes the part of the book that began when Israel reached the mountain. It also opens the next: the forty days of its last verse are the days in which Moses is shown the tabernacle (chapters 25–31).

  The New Testament returns to this chapter at two weighty moments. Hebrews retells the sprinkling of the blood to explain the death of Christ ([[Heb. 9:18–22]]), and the Savior’s words over the cup at the Last Supper take up the words Moses speaks here ([[Matt. 26:28]]).

thread: |
  The chapter climbs the mountain in three stages, and at each stage fewer people go on. All Israel stands at the foot, where the altar is built and the covenant is made (verses 3–8). Aaron, his two sons, and seventy elders go partway up, see the God of Israel, and eat and drink (verses 9–11). Moses, with Joshua attending him, goes on into the cloud (verses 12–18). The first two verses set this out beforehand: the company is to worship “afar off,” Moses alone is to “come near,” and the people are not to go up at all.

  What happens at the foot comes first, and in a careful order. The words are spoken and the people agree. The words are written. An altar is built and sacrifice is offered. The book is read aloud and the people agree again, so that they have consented both to what they heard and to what stands written. Only then is the blood put on them. The going up follows from it. On one older reading, “Through their consecration with the blood of the covenant, the Israelites were qualified to ascend the mountain, and there behold the God of Israel and celebrate the covenant meal,” in the persons of those who represented them; the ascent and the meal have also been read as serving “to further seal the covenant.”

  The last verses look ahead. Cloud covers the mountain and the glory of the LORD abides on it, and the book will end with the same cloud and the same glory settling on the tabernacle ([[Ex. 40:34–35]]). One study reads these verses as turning the covenant ceremony “into a preparation in worship for the establishment of the tabernacle”: what Moses meets on the mountain “will thus become the community’s via the tabernacle.”

sections:
  - range: 1-2
    heading: Come up unto the LORD
    plain: |
      The LORD said to Moses, “Come up to the LORD, you and Aaron, Nadab and Abihu, and seventy of the elders of Israel, and worship at a distance. Moses alone is to come near the LORD. The others are not to come near, and the people are not to go up with him.”
  - range: 3-8
    heading: The covenant is made at the foot of the mountain
    plain: |
      Moses came and told the people all the words of the LORD and all the judgments. The people answered with one voice, “All the words which the LORD has said we will do.” Moses wrote down all the words of the LORD. He rose early in the morning and built an altar at the foot of the mountain, with twelve pillars for the twelve tribes of Israel. He sent young men of Israel, who offered burnt offerings and sacrificed oxen as peace offerings to the LORD.

      Moses took half of the blood and put it in basins, and half he sprinkled on the altar. He took the book of the covenant and read it in the hearing of the people, and they said, “All that the LORD has said we will do, and be obedient.” Then Moses took the blood and sprinkled it on the people and said, “Behold the blood of the covenant, which the LORD has made with you concerning all these words.”
  - range: 9-11
    heading: They saw the God of Israel
    plain: |
      Then Moses went up with Aaron, Nadab and Abihu, and seventy of the elders of Israel, and they saw the God of Israel. Under His feet there was something like a pavement of sapphire stone, as clear as the sky itself. He did not lay His hand on these leaders of Israel. They saw God, and they ate and drank.
  - range: 12-18
    heading: Moses goes up into the cloud
    plain: |
      The LORD said to Moses, “Come up to me on the mountain and stay there, and I will give you tables of stone, and a law, and commandments which I have written, so that you may teach them.” Moses rose with Joshua his minister and went up the mount of God. He said to the elders, “Wait here for us until we come back to you. Aaron and Hur are with you; whoever has a matter to settle can go to them.”

      Moses went up the mountain, and a cloud covered it. The glory of the LORD rested on mount Sinai, and the cloud covered it six days. On the seventh day He called to Moses out of the cloud. To the children of Israel the glory of the LORD looked like a devouring fire on the top of the mountain. Moses went into the cloud and up the mountain, and he was there forty days and forty nights.

notes:
  - ref: 1
    phrase: seventy of the elders of Israel
    kind: history
    title: Who went up with Moses
    body: |
      The company called up the mountain is Israel’s leadership: Aaron and two of his sons, and seventy of the elders. Nadab and Abihu are the first sons named when Aaron’s house is chosen “that he may minister unto me in the priest’s office” ([[Ex. 28:1]]). They die later for offering “strange fire before the LORD” ([[Lev. 10:1]]).

      “Elders” in the Old Testament often means “the older men in a tribe, usually entrusted with the governmental affairs,” which was not necessarily a priesthood calling. This passage is named as something more: “There were ordained elders in the Melchizedek Priesthood in Old Testament times, as in Ex. 24:9–11 and Num. 11:16.” In the second of those passages the LORD has Moses gather “seventy men of the elders of Israel” to bear the burden of the people with him ([[Num. 11:16]]). It is “possible to see in the Old Testament precedents for the priesthood office of the Seventy” in these men “who stood with him in God’s presence.”

      Why they are taken up is not said. One answer is that they are given “a still more intimate contact with the Presence” and so are “uniquely equipped for their service of guidance and teaching, of leadership.” The three distances from the LORD that these verses lay down (the people below, the company partway, Moses alone near) are described at [[Ex. 19:12]].
    sources: [lds-scriptures, bd-elders, sc-knowhy-813, hardison-theophany]

  - ref: 4
    phrase: twelve pillars
    kind: history
    title: Twelve standing stones
    body: |
      The twelve pillars are standing stones, one for each tribe, set up beside the altar, likely as a memorial of the covenant made there. The Hebrew word, *matzevah*, is used “to denote some kind of stone or stele that humans have erected for devotional purposes.” Jacob set one up at Bethel after his dream ([[Gen. 28:18]]), a passage that “supports the notion that matzevot were used to commemorate sacred space or mark that a covenant had occurred.” The Church’s footnote here points to another, the pillar Jacob raised when he and Laban made a covenant ([[Gen. 31:45]]).

      At Sinai, “each tribe made a covenant with the Lord at that moment, so the twelve stones likely commemorated that event.” On another reading the whole arrangement is a picture of the two parties: “The altar represents Yahweh, and the pillars represent the twelve tribes of Israel,” and the stones “serve as a witness to or a memorial of the covenant.”

      A reader may recall that the judgments just given tell Israel to break down such stones, for “images” in that command is the same Hebrew word. Elsewhere in scripture these stones “are generally paired with foreign altars that the righteous Israelites must destroy.” The command speaks of “their images” ([[Ex. 23:24]]), in a verse about the gods of the nations. These twelve stand beside an altar to the LORD.
    sources: [sc-knowhy-870, hardison-theophany, oshb-wlc, lds-scriptures]

  - ref: 5
    phrase: young men of the children of Israel
    kind: history
    title: Why young men offer the sacrifices
    body: |
      Young men offer the sacrifices because Aaron and his sons have not been consecrated, and the Levites have not been chosen: “Since priests had not been ordained yet, Moses had young men of Israel offer both burnt and peace offerings.”

      Who the young men were is not said. They may have been firstborn sons, since the Levites were later taken in place of the firstborn ([[Num. 8:18]]). One older reading rejects that: “they simply acted as servants of Moses; and the priestly duty of sprinkling the blood was performed by him as the mediator of the covenant.” Either way, it is Moses who handles the blood (verses 6 and 8).

      Neither offering is for sin. The burnt offering, wholly consumed on the altar, “represents holding nothing back from God, a total consecration of one’s being.” The peace offering is shared, “apportioned between God, the priest, and the offerer,” and so it ends in a meal (see the note on verse 11).
    sources: [belnap-skinner-sinai, keil-exodus, hardison-theophany, lds-scriptures]

  - ref: 7
    phrase: the book of the covenant
    kind: history
    title: What Moses read aloud
    body: |
      The book of the covenant is the writing Moses made in verse 4, and its contents are the words the people have just heard. Which chapters it held is taken up where the laws begin, at [[Ex. 21:1]].

      The people’s answer is now given for the third time. They said it when the covenant was first offered ([[Ex. 19:8]]), again when Moses reported the words (verse 3), and here when the written book is read, this time adding “and be obedient.” The first of those answers is discussed at [[Ex. 19:8]].
    sources: [lds-scriptures]

  - ref: 8
    phrase: sprinkled it on the people
    kind: symbol
    title: Blood on the altar and on the people
    body: |
      The blood is divided between the altar and the people, perhaps so that both parties to the covenant are marked with it. Half goes on the altar at once (verse 6). The other half waits in basins until the people have heard the book and agreed, and then it is put on them. Later burnt and peace offerings are not handled this way: “only half of the blood was used against the sides of the altar, unlike the practice in later burnt and peace offerings.” “The splashing of blood upon the altar perhaps suggested that the altar stood as a symbol for God,” so that “both parties were bound by blood and partook of the covenant experience.” The rite “attests to the reciprocity of this covenant. Both God and Israel are bound—God to support and defend his people; the people to love and obey their God.”

      Blood “is a symbol of life,” and in Israel’s worship it was “a symbol of God’s saving power extended to people through covenant.” The law says so in its own words: “the life of the flesh is in the blood” ([[Lev. 17:11]]). Two further meanings have been proposed. Shared blood makes kin, and one purpose of blood in Israel’s rites was “creating and maintaining bonds of kinship which were defined in terms of covenant.” And the blood warned: “the people were identified with the sacrificed animal, so that the fate of the latter is presented as the fate to be expected by the people if they violated their sacred promise.”

      Blood is put on persons once more in Exodus, when Aaron and his sons are consecrated ([[Ex. 29:20–21]]). “As with the splashing of the blood onto the whole of Israel in Exodus 24, the splashing of the blood and oil onto Aaron ritually established the relationship between Aaron and God.”

      [Four Rites of Blood](/exodus/themes/blood-of-the-covenant/) sets the blood of the covenant beside the blood on the door, on the priests and on the incense altar, and follows it to the Savior's cup.
    sources: [belnap-skinner-sinai, hardison-theophany, seely-sacrifice, lds-scriptures]

  - ref: 8
    phrase: the blood of the covenant
    kind: christ
    title: The words Jesus took up at the Last Supper
    body: |
      Jesus took up Moses’s words over the blood when He gave the cup to His disciples: “For this is my blood of the new testament, which is shed for many for the remission of sins” ([[Matt. 26:28]]). “The word ‘testament’ in this context means ‘covenant.’” At that table He “transferred the symbol of blood from animal sacrifice under the law of Moses to the new covenant,” and in doing so “He hearkened back to Exodus 24:8.”

      Hebrews makes the argument at length, and it begins from this scene. Moses read the law to the people and then “sprinkled both the book, and all the people, Saying, This is the blood of the testament which God hath enjoined unto you” ([[Heb. 9:19–20]]). The point Hebrews draws is that “neither the first testament was dedicated without blood” ([[Heb. 9:18]]), and that the new one required a death as well: Christ “is the mediator of the new testament, that by means of death” those who are called “might receive the promise of eternal inheritance” ([[Heb. 9:15]]).

      The Church’s footnote to this verse points also to Peter, who greets the Saints as chosen “unto obedience and sprinkling of the blood of Jesus Christ” ([[1 Pet. 1:2]]).

      [Four Rites of Blood](/exodus/themes/blood-of-the-covenant/) follows the blood of the covenant from the door to the priests and the incense altar, and to the Savior's cup.
    sources: [lds-scriptures, seely-sacrifice, ot-minute-ex-24]

  - ref: 10
    phrase: they saw the God of Israel
    kind: scripture
    title: The elders see God
    body: |
      The verse says plainly that these men saw God, and the next verse says it again. It does not describe Him. It mentions His feet and what lay beneath them, and no more. The Church’s footnotes file the verse in the Topical Guide under the appearances of Jesus Christ before His birth and, at “feet,” under the bodily nature of God.

      In this account “there is no mention of clouds, and the Lord is not hidden here.” A reason has been suggested: “Perhaps this is because the select group was worthy to more fully come into God’s presence.” The people below see only fire on the summit (verse 17). Latter-day revelation says that Moses “sought diligently to sanctify his people that they might behold the face of God” ([[D&C 84:23]]); that is taken up at [[Ex. 19:10]].

      How this verse stands with the LORD’s later word to Moses, “there shall no man see me, and live,” and what the Joseph Smith Translation adds there, is treated at [[Ex. 33:20]].
    sources: [lds-scriptures, muhlestein-theophanies]

  - ref: 10
    phrase: a paved work of a sapphire stone
    kind: symbol
    title: A pavement like the sky
    body: |
      What the elders saw under the LORD’s feet is described only by comparison, and the verse says “as it were” twice. “The closest the writer can come to the reality of the scene is to compare aspects of what they saw to a work of sapphire and the body of heaven.” A modern translation makes the King James phrasing plainer: “Under his feet there was something like a pavement of sapphire stone, like the very heaven for clearness.”

      The picture is of deep, clear blue: “The bright blue of sapphire combined with the reference to heaven seems to indicate that the Lord is standing in a luminous sky or heaven.” Ezekiel’s vision names the same stone above the firmament: “the likeness of a throne, as the appearance of a sapphire stone” ([[Ezek. 1:26]]). One study takes the elders’ vision as a sight of the heavenly temple, “its blue sapphire being a common feature of temples in the ancient Near East.” That is a reading; the verse itself names no throne and no temple.

      The account of the Lord’s appearance in the Kirtland Temple shares this verse’s wording: Joseph Smith and Oliver Cowdery “saw the Lord standing upon the breastwork of the pulpit,” and “under his feet was a paved work of pure gold, in color like amber” ([[D&C 110:2]]).
    sources: [muhlestein-theophanies, nrsvue, morales-tabernacle, lds-scriptures]

  - ref: 11
    phrase: did eat and drink
    kind: history
    title: A meal in the presence of God
    body: |
      The meal on the mountain belongs to the making of the covenant. Anciently, “sacred meals, including the Passover meal, peace offerings, and meals in other settings, were often a part of the covenant-making or covenant-renewal process.” What was eaten is not stated. On one older reading it was “the sacrificial meal of the peace-offerings, which had been sacrificed at the conclusion of the covenant” that morning (verse 5). The feast of a peace offering “represents fellowship and unity with God and fellow man.” Here it is eaten by those who have just seen Him.

      “He laid not his hand” most likely means that they were not harmed. “The apparent meaning here is that God did not harm these elders in spite of their proximity to the consuming glory and holiness of God.” There is another possibility. The Hebrew verb “also means ‘to stretch out,’” so the line may mean “that God did not extend his hand to these elders, a privilege he might have granted Moses.” A modern translation calls the “nobles” “the chief men of the Israelites.”
    sources: [hopkin-covenant, keil-exodus, hardison-theophany, nrsvue]

  - ref: 12
    phrase: tables of stone
    kind: scripture
    title: The tables Moses went up to receive
    body: |
      Moses is called higher for something the covenant does not yet have: a writing from God’s own hand. Moses himself wrote everything written so far (verse 4). The tables are different, holding commandments “which I have written,” and when they are handed to him at the end of the forty days they are “tables of stone, written with the finger of God” ([[Ex. 31:18]]).

      What the first tables held, and how they differed from the second pair, is explained at [[Ex. 34:1]].
    sources: [lds-scriptures]

  - ref: 14
    phrase: Aaron and Hur are with you
    kind: history
    title: Who is left in charge
    body: |
      Moses leaves Aaron and Hur to hear the people’s matters and takes Joshua with him. All three were last seen together at the battle with Amalek, where “Joshua did as Moses had said to him, and fought with Amalek: and Moses, Aaron, and Hur went up to the top of the hill” ([[Ex. 17:10]]). Hur is known from that day as the one “who, with Aaron, supported the hands of Moses.” Joshua rises with Moses (verse 13) and is at his side on the way down ([[Ex. 32:17]]).

      The arrangement explains what happens next. When Moses is long in returning, the people bring their demand to Aaron ([[Ex. 32:1]]), “who was in charge at the base of the mountain.”
    sources: [bd-hur, ot-minute-ex-24, lds-scriptures]

  - ref: 16
    phrase: the glory of the LORD abode upon mount Sinai
    kind: symbol
    title: The glory of the LORD
    body: |
      The glory of the LORD is the visible sign that He is present: a brightness, here wrapped in cloud. It looks to the people “like devouring fire” (verse 17). Later Jewish usage had a name for this, the Shechinah, “the cloud of brightness and glory that marked the presence of the Lord.”

      The cloud covers the mountain for six days with the glory inside it, “the image of God being surrounded by light, which is surrounded by darkness.” The LORD told Moses that “no man can behold all my glory, and afterwards remain in the flesh on the earth” ([[Moses 1:5]]). How the fire shows Him and the smoke hides Him is described at [[Ex. 19:18]].

      “Abode” matters as well. The Hebrew verb means to dwell, and the word for the tabernacle is made from it. On one reading, the sentence “begins with the word” for dwelling, “offering a preview of the following section’s subject,” the dwelling-place, “so that the tabernacle is a kind of miniature Sinai.” From inside the cloud the LORD asks for a sanctuary, “that I may dwell among them” ([[Ex. 25:8]]). The same reading takes the six days and the seventh as a Sabbath pattern that ties the creation, Sinai, and the tabernacle together.

      The glory first appeared to Israel in the wilderness ([[Ex. 16:10]]), and it fills the tabernacle on the book’s last page ([[Ex. 40:34]]).
    sources: [muhlestein-theophanies, bd-shechinah, morales-tabernacle, oshb-wlc, lds-scriptures]

  - ref: 18
    phrase: forty days and forty nights
    kind: history
    title: What the forty days held
    body: |
      During the forty days the LORD shows Moses the tabernacle, its furnishings, and its priesthood (chapters 25–31), and “when he had made an end of communing with him” He gives him the tables ([[Ex. 31:18]]). Moses later adds what this chapter leaves out, that he fasted the whole time: “I neither did eat bread nor drink water” ([[Deut. 9:9]]).

      Forty days and forty nights come again in scripture. Moses spends a second forty days on the mountain after the calf ([[Ex. 34:28]]). Elijah travels “forty days and forty nights unto Horeb the mount of God” ([[1 Kgs. 19:8]]), and the two prophets “each go without food for forty days.” The Church’s footnote adds the Savior’s fast in the wilderness ([[Matt. 4:2]]). One older reading draws these together: “In all these cases the number refers to a period of temptation, of the trial of faith, as well as to a period of the strengthening of faith through the miraculous support bestowed by God.”

      While Moses is in the cloud, the camp waits below. What it does with the waiting is told in chapter 32 ([[Ex. 32:1]]).
    sources: [lds-scriptures, sc-knowhy-858, keil-exodus]

christ: |
  Scripture itself says where the blood of this chapter points. At the Last Supper the Savior took the words Moses spoke over the blood and spoke them of His own (see the second note on verse 8). Hebrews then sets the two covenants side by side. Moses dedicated the first with the blood of animals; believers have come “to Jesus the mediator of the new covenant, and to the blood of sprinkling, that speaketh better things than that of Abel” ([[Heb. 12:24]]).

  The chapter shows Moses going between the LORD and the people. He carries the words down, puts the blood on the people, and goes up alone. Hebrews gives that office to Christ, in a greater degree: “he is the mediator of a better covenant, which was established upon better promises” ([[Heb. 8:6]]). The Church’s help on these verses finds Him in the rite itself: the blood on the altar represents the blood Jesus Christ would shed, and the blood on the people the blessings of His Atonement that come through the covenant. The same help joins the rite to the Savior’s own pleading, in which He asks the Father to “behold the blood of thy Son which was shed” ([[D&C 45:4]]).

  The LORD whom the elders saw is Jehovah (see [[Ex. 3:14]]).

explore: |
  - **The first covenant and the new.** [[Heb. 9:11–22]] reads the sprinkling of this chapter beside the death of Christ, and [[Heb. 12:18–24]] sets Sinai beside mount Sion.
  - **The seventy elders again.** [[Num. 11:16–17, 24–25]], where the LORD puts His Spirit on seventy elders to share Moses’s burden.
  - **Seeing God.** [[Ex. 33:11]] and [[Ex. 33:18–23]], with [[D&C 84:19–24]] on what Moses sought for the whole people.
  - **The glory at the temple.** [[1 Kgs. 8:10–11]], where the cloud and the glory fill the house Solomon built.
  - **A study of the mountain.** “Theophany on Sinai” (Religious Studies Center, 2013) follows three appearances of God on Sinai: the call of Moses, the making of the covenant in chapters 19–24, and its renewal after the calf.

