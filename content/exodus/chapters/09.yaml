chapter: 9
title: None Like Me in All the Earth
tagline: Disease among the herds, boils, and a storm of hail and fire fall on Egypt, and the LORD tells Pharaoh why he has been left standing.
when: 'The fifth, sixth, and seventh plagues; Moses is eighty years old (Exodus 7:7)'

setting: |
  Four plagues have passed: blood, frogs, lice, and flies. With the flies the Lord began to set the land of Goshen apart (see [[Ex. 8:22]]), and Pharaoh, having promised to let the people go, took the promise back. Chapter 9 tells the next three: a disease that kills the Egyptians' livestock, boils and blains on the Egyptians themselves, and hail with fire, while Israel is spared.

  The first two are told briefly, in seven verses and five. The third takes the rest of the chapter and carries a long message from the Lord to Pharaoh (verses 13–19). Pharaoh's magicians appear here for the last time, and under the hail Pharaoh says, “I have sinned.”

  Later scripture returns to this chapter. Paul quotes verse 16 where he writes of God's mercy and of hardening ([[Rom. 9:17–18]]). The psalms retell the hail ([[Ps. 78:47–48]]; [[Ps. 105:32]]), and scripture places hail among the judgments of the last days: “a great hail out of heaven” ([[Rev. 16:21]]), and “a great hailstorm sent forth to destroy the crops of the earth” ([[D&C 29:16]]).

thread: |
  Three times in this chapter Pharaoh is told what the plagues are for, twice in the Lord's message and once by Moses, and each time the word is **earth**. They come “that thou mayest know that there is none like me in all the earth” (verse 14); Pharaoh has been kept “that my name may be declared throughout all the earth” (verse 16); and the storm will stop at Moses's prayer “that thou mayest know how that the earth is the LORD’s” (verse 29). Pharaoh had asked, “Who is the LORD?” ([[Ex. 5:2]]). The answer given here is larger than the God of one enslaved people: through the plagues Pharaoh and the Egyptians were to know that He is the Lord and that there is none like Him in all the earth. The purpose of the plagues as a whole is taken up at [[Ex. 7:5]].

  The chapter also draws lines. The Lord will “sever between the cattle of Israel and the cattle of Egypt” (verse 4); the hail falls everywhere but Goshen (verse 26); and before the hail a line appears inside Egypt itself, between the servants of Pharaoh who “feared the word of the LORD” and those who “regarded not” (verses 20–21).

  Against all this stands Pharaoh's heart, and the chapter describes it in three ways. It “was hardened” (verses 7, 35); “the LORD hardened” it (verse 12), where the Joseph Smith Translation reads “And Pharaoh hardened his heart”; and Pharaoh “hardened his heart, he and his servants” (verse 34). The question those wordings raise is answered once, at [[Ex. 4:21]].

sections:
  - range: 1-7
    heading: 'The fifth plague: disease among the herds'
    plain: |
      The Lord told Moses to go in to Pharaoh and say, “The LORD God of the Hebrews says: Let my people go, so that they may serve me. If you refuse and keep holding them, the hand of the LORD will be on your livestock in the field, on the horses, donkeys, camels, oxen, and sheep, with a very severe plague. The LORD will make a distinction between the livestock of Israel and the livestock of Egypt, and nothing that belongs to the children of Israel will die.” The Lord set a time: “Tomorrow the LORD will do this in the land.” The next day He did it. The livestock of Egypt died, and not one animal belonging to the children of Israel died. Pharaoh sent to find out, and it was so: not one of the Israelites' animals was dead. But Pharaoh's heart was hardened, and he did not let the people go.
  - range: 8-12
    heading: 'The sixth plague: boils'
    plain: |
      The Lord told Moses and Aaron to take handfuls of soot from a kiln, and Moses was to throw it toward the sky in Pharaoh's sight. It would become fine dust over all the land of Egypt and would break out in boils and blisters on people and animals throughout the land. They took the soot and stood before Pharaoh, Moses threw it toward the sky, and boils and blisters broke out on people and animals. The magicians could not stand before Moses because of the boils, for the boils were on the magicians as on all the Egyptians. And the Lord hardened Pharaoh's heart, and he did not listen to them, as the Lord had told Moses.
  - range: 13-21
    heading: The LORD's message before the hail
    plain: |
      The Lord told Moses to rise early, stand before Pharaoh, and say, “The LORD God of the Hebrews says: Let my people go, so that they may serve me. This time I will send all my plagues upon your heart, and on your servants and your people, so that you may know that there is none like me in all the earth. By now I could have stretched out my hand and struck you and your people with pestilence, and you would have been cut off from the earth. But for this purpose I have kept you standing: to show you my power, and so that my name may be declared throughout all the earth. Do you still exalt yourself against my people and refuse to let them go? Tomorrow about this time I will send a very heavy hail, such as has not been in Egypt from the day it was founded until now. So send now and bring in your livestock and everything you have in the field. Every person and animal that is found in the field and not brought home will die when the hail comes down.” Those among Pharaoh's servants who feared the word of the Lord hurried their servants and livestock indoors. Those who paid no attention to the word of the Lord left theirs in the field.
  - range: 22-26
    heading: 'The seventh plague: hail and fire'
    plain: |
      The Lord told Moses to stretch out his hand toward the sky, so that hail would fall on all the land of Egypt, on people, on animals, and on every plant of the field. Moses stretched out his rod toward the sky, and the Lord sent thunder and hail, and fire ran along the ground. The Lord rained hail on the land of Egypt, hail with fire flashing through it, heavier than any the land had known since it became a nation. Through all the land of Egypt the hail struck down everything that was in the field, people and animals alike; it beat down every plant of the field and broke every tree. Only in the land of Goshen, where the children of Israel were, was there no hail.
  - range: 27-35
    heading: Pharaoh confesses, and sins yet more
    plain: |
      Pharaoh sent for Moses and Aaron and said, “This time I have sinned. The LORD is righteous, and I and my people are wicked. Pray to the LORD, for there has been enough of this mighty thunder and hail. I will let you go; you need stay no longer.” Moses answered, “As soon as I am out of the city I will spread out my hands to the LORD. The thunder will stop and there will be no more hail, so that you may know that the earth is the LORD's. But as for you and your servants, I know that you do not yet fear the LORD God.” The flax and the barley were ruined, for the barley was in the ear and the flax was in bud. The wheat and the spelt were not ruined, for they had not yet come up. Moses went out of the city, away from Pharaoh, and spread out his hands to the Lord, and the thunder and hail stopped and the rain no longer poured on the earth. When Pharaoh saw that the rain, the hail, and the thunder had stopped, he sinned yet more and hardened his heart, he and his servants. Pharaoh's heart was hardened, and he would not let the children of Israel go, as the Lord had said through Moses.

notes:
  - ref: 3
    phrase: a very grievous murrain
    kind: history
    title: The murrain and the king's herds
    body: |
      “Murrain” is a pestilence among animals: “an umbrella term covering various infectious diseases that affect livestock and other animals.” The verse lists what it will reach: horses, asses, camels, oxen, and sheep.

      Why the herds? One study sets the plague beside what cattle meant in Egypt. “Bull cults were common in Egypt,” the goddess Hathor “was associated with the cow,” and the king himself “was often depicted as a herder who cared for the livestock”; his “royal symbolism included the shepherd’s crook and flail.” That is background an Egyptian would have brought to the plague. The text names no god and no royal office as its target.

      What the text does stress is the appointed time (“To morrow,” verse 5) and the line drawn between the herds of Egypt and the herds of Israel (verse 4), which Pharaoh sends men to check (verse 7). The purpose of the plagues, and the question of Egypt's gods, are treated at [[Ex. 7:5]].
    sources: [ot-minute-ex-7, sc-knowhy-631]
  - ref: 6
    phrase: all the cattle of Egypt died
    kind: history
    title: All the cattle died, yet cattle remain
    body: |
      “All” in this verse does not mean every animal in Egypt, as the chapter itself shows. A few verses later boils break out “upon man, and upon beast” (verse 10), and before the hail Pharaoh's servants still have cattle to bring in from the field (verses 19–21).

      Two things narrow the word. The plague was announced against “thy cattle which is in the field” (verse 3), so animals kept elsewhere were outside it. And on one older reading “all” is used “according to popular usage, as denoting such a quantity, that what remained was nothing in comparison.”

      The exact statement in the verse is the other one: of the cattle of Israel “died not one.”
    sources: [keil-exodus, lds-scriptures]
  - ref: 8
    phrase: ashes of the furnace
    kind: symbol
    title: Soot from a kiln
    body: |
      The “ashes of the furnace” are soot from a kiln. The Hebrew word for “ashes” here means “soot,” and the “furnace” is a “kiln, for lime or pottery.” Moses throws a handful into the air before Pharaoh, and what comes down on Egypt is a disease of the skin. The Church's footnote points to [[Deut. 28:27]], where the same affliction is called “the botch of Egypt.”

      Why soot from a kiln? No verse says. One older reading starts from what the kilns of Egypt were for. The earlier plagues turned the Nile and the dust of the land against Egypt; this one brings ruin “from the workshops of those splendid edifices, for the erection of which he had made use of the strength of the Israelites.” The soot is then the “emblem of the furnace in which Israel groaned,” and the same reading points to what Moses later calls the bondage: the Lord “brought you forth out of the iron furnace, even out of Egypt” ([[Deut. 4:20]]).
    sources: [bdb, keil-exodus, lds-scriptures]
  - ref: 11
    phrase: the magicians could not stand before Moses
    kind: history
    title: The magicians leave the story
    body: |
      This is the last verse in Exodus that names Pharaoh's magicians. They copied the first signs ([[Ex. 7:11]]; [[Ex. 7:22]]; [[Ex. 8:7]]), failed at the lice, and told Pharaoh, “This is the finger of God” ([[Ex. 8:19]]). Now the boils are on them too, and they cannot even remain in Moses's presence.

      One study of the plagues adds a point about Egypt's priests: “being infested with bugs and boils rendered the priests ritually unclean and thus unable to perform the rituals that could have perhaps aided the king in trying to restore order.” The study speaks of the priests generally and does not name these magicians. Who the magicians were, and how they did what they did, is treated at [[Ex. 7:11]].
    sources: [lds-scriptures, muhlestein-pharaoh]
  - ref: 16
    phrase: for this cause have I raised thee up
    kind: words
    title: Raised up, or kept standing
    body: |
      “Raised thee up” can also be rendered as keeping Pharaoh standing, and on that rendering the Lord is telling Pharaoh why he is still alive. The King James wording of verses 15 and 16 reads as a threat followed by a statement that Pharaoh was set in his place for this. The difference lies in two verbs.

      Verse 15 sounds like something about to happen: “For now I will stretch out my hand.” Yet Pharaoh is not cut off. The Hebrew verb looks back (“I have stretched out”), and one older reading takes the clause as a condition: “If I had now stretched out My hand and smitten thee...thou wouldest have been cut off.” A modern translation agrees: “by now I could have stretched out my hand and struck you and your people with pestilence, and you would have been cut off from the earth.”

      In verse 16, “raised thee up” translates a form of the Hebrew verb “to stand” that means to cause to stand; its sense in this verse is to “maintain (opposed to overthrow).” The Church's footnote offers “let thee remain.” The ancient Greek translation has “for this purpose hast thou been preserved,” and a modern translation, “this is why I have let you live.” Not every modern translation agrees; another keeps “I have raised you up.” The footnote adds that “shew in thee” is in Hebrew “show thee”: Pharaoh himself is the one who is to see the power.

      Read this way, the two verses belong together. The Lord could already have ended the contest; He has kept Pharaoh standing so that Pharaoh would see His power and His name be declared in all the earth. The plain-words paraphrase on this page follows that reading, which the Church's footnote allows; the rendering is not settled.

      The King James sense is not shut out. The same older reading adds, “Causing to stand presupposes setting up,” and says it is in that first sense that Paul gives the verse: “raised thee up” ([[Rom. 9:17]]), where he goes on to God's mercy and to hardening ([[Rom. 9:18]]). The hardening of Pharaoh's heart is treated at [[Ex. 4:21]].
    sources: [lds-scriptures, keil-exodus, bdb, nrsvue, esv, lxx-rahlfs]
  - ref: 20
    phrase: He that feared the word of the LORD among the servants of Pharaoh
    kind: history
    title: Egyptians who feared the word of the LORD
    body: |
      The hail comes with a way of escape, and some of Pharaoh's own servants take it. The warning in verse 19 is addressed to Egypt: bring in your people and animals from the field. With it “the Lord gave the Egyptian people a chance to protect themselves and their livestock from harm or death,” and the two verses that follow show Pharaoh's court dividing over it. Some hurry their servants and cattle indoors; others leave them where they are.

      The verse names what separates the two groups: the first “feared the word of the LORD,” and the second “regarded not” that word. Pharaoh's servants are heard from again before the next plague, when they ask him, “knowest thou not yet that Egypt is destroyed?” ([[Ex. 10:7]]).
    sources: [ot-minute-ex-7, lds-scriptures]
  - ref: 23
    phrase: the fire ran along upon the ground
    kind: history
    title: Hail and fire against a king of storms
    body: |
      The storm may answer a claim Egypt made for its king. In Egyptian royal thought, one study reports, it was the king's power to “manifest himself as a storm of both flame and lightening,” and he was also “supposed to be the one who protected his people from the storm.” In this chapter “these qualities are applied to Jehovah and his powers”: the Lord sends the thunder, the hail, and the fire, and the land of Goshen has none of it (verse 26). “Jehovah protected his people from storms and flames, while Pharaoh could not.”

      Others relate the plague to Egypt's gods of the sky, since such a storm “would challenge the authority of the Egyptian sky deities, such as Nut, Shu, and Tefnut.” Both are proposals about what the plague would have meant in Egypt. The chapter's own measure of the storm is that there had been nothing like it “since it became a nation” (verse 24).
    sources: [muhlestein-pharaoh, sc-knowhy-631]
  - ref: 27
    phrase: I have sinned this time
    kind: history
    title: Pharaoh's confession
    body: |
      Pharaoh says the right words, and the chapter shows how little they held. Under the hail he “finally admitted that he was in the wrong and had sinned,” and he adds that the Lord is righteous and that he and his people are wicked. The limit is in his own sentence: “this time.”

      Moses is not persuaded. He promises to pray and says in the same breath, “I know that ye will not yet fear the LORD God” (verse 30). When the storm stops, the narrator takes up Pharaoh's own word: “he sinned yet more” (verse 34). The pattern returns with the locusts, when Pharaoh says, “I have sinned against the LORD your God, and against you” ([[Ex. 10:16]]), and again does not let the people go.
    sources: [ot-minute-ex-7, lds-scriptures]
  - ref: 29
    phrase: I will spread abroad my hands unto the LORD
    kind: symbol
    title: Hands spread out in prayer
    body: |
      To spread out the hands is to pray, as Solomon did at the dedication of the temple, when he “spread forth his hands toward heaven” ([[1 Kgs. 8:22]]). Moses says he will do it once he is outside the city, and the storm will stop.

      One study of the plagues notes the irony. Egypt is kept from being given over to the storm “by the simple supplicating gesture of spreading out his hands before Jehovah.” Moses says what the stopping is meant to teach: “that thou mayest know how that the earth is the LORD’s.”
    sources: [lds-scriptures, muhlestein-pharaoh]
  - ref: 31
    phrase: the flax and the barley was smitten
    kind: history
    title: What the crops tell
    body: |
      The two verses about the crops show the season of the storm and prepare for the next plague. Barley “in the ear” and flax “bolled” (the Church's footnote gives “in bud”) were far enough along to be destroyed; the wheat and the “rie” (in Hebrew, the footnote says, spelt, “a type of wheat”) had not yet come up. One study places the hailstorm in “February, when barley and flax are growing.”

      The wheat that survives does not survive long. The locusts of the next chapter “shall eat the residue of that which is escaped, which remaineth unto you from the hail” ([[Ex. 10:5]]). For that reason one study treats the ruin of Egypt's crops as “a single aspect of two plagues,” the hail and the locusts together.
    sources: [lds-scriptures, sc-knowhy-631, muhlestein-pharaoh]

christ: |
  The LORD who speaks in this chapter is Jehovah (see the note at [[Ex. 3:14]]). What He says of Himself here is that there is none like Him in all the earth (verse 14) and that the earth is His (verse 29).

  At verse 29 the Church's footnote points to the risen Savior's words to the Nephites at the temple in Bountiful. He invites them to feel the prints of the nails, “that ye may know that I am the God of Israel, and the God of the whole earth, and have been slain for the sins of the world” ([[3 Ne. 11:14]]). The link is the footnote's cross-reference on the word “earth,” one of several it lists, and the two verses are set side by side here for their shared words: “that thou mayest know” and “that ye may know.”

explore: |
  - [[Rom. 9:14–24]]: Paul's use of verse 16.
  - [[Ps. 78:44–51]] and [[Ps. 105:26–36]]: Israel's songs retell the plagues, the hail among them.
  - [[Ex. 10:1–6]]: the Lord's next message to Pharaoh, and the locusts that finish what the hail left.
  - [[Deut. 28:27]] and [[Deut. 28:60]]: Moses warns Israel that the diseases of Egypt can come on a covenant people who turn away.
  - [[Rev. 16:1–21]] and [[D&C 29:14–21]]: sores, hail, and other plagues among the judgments before the Lord's coming.
  - [[Mosiah 12:6]]: Abinadi prophesies hail against the people of King Noah.

