chapter: 21
title: The Judgments
tagline: The LORD gives Moses the first of the judgments. They say when a servant goes free, when a killer dies and when he may flee, what is owed for an injury, and what an owner answers for.
when: 'The third month after the departure from Egypt (19:1), at Sinai, after the Ten Commandments.'

setting: |
  The Ten Commandments have just been spoken from the mountain. The people “stood afar off, and Moses drew near unto the thick darkness where God was” ([[Ex. 20:21]]), and there the LORD goes on speaking, now to Moses alone, with laws he is to set before them. What the people’s drawing back cost them is taken up at [[Ex. 20:19]] and [[Ex. 34:1]].

  Chapters 21–23 are those laws. When Moses comes down he tells the people “all the words of the LORD, and all the judgments” ([[Ex. 24:3]]), writes them, and reads “the book of the covenant” ([[Ex. 24:7]]) aloud, and the people answer that they will do it. Many scholars take that book to be these chapters, so the collection (20:22–23:33) is often called the Covenant Code or the Book of the Covenant. The Ten Commandments stand before it as “a kind of prologue.”

  Israel was not the only ancient people with written laws. This collection has often been compared with others from the ancient Near East, “especially the Code of Hammurabi,” and Hammurabi’s laws have cases like some in this chapter: a term of service that ends in release, the eye put out, the ox known to gore. The contents are similar, but “direct textual dependency remains unclear at best,” and Exodus presents its laws as “a direct revelation from God” to which the people bind themselves by covenant. The law of Moses was “inferior to the fulness of the gospel,” and yet it held “many provisions … of high ethical and moral value.”

thread: |
  The chapter calls its contents “judgments,” and most of what follows is cases: if this happens, then that is to be done. The Ten Commandments state their principles without conditions. On one view the judgments are “the illustration of the basic principle in terms of specific cases,” and they show how far a commandment reaches.

  The cases come in an order. First the servant: his release, and the rights of a woman sold into a household (verses 2–11). Then life: killing, and the acts ranked with it (verses 12–17). Then the body: injuries in a quarrel, to a servant, to a pregnant woman (verses 18–27). Then harm done by what a person owns, the ox that gores (verses 28–32). Last comes harm done to what a person owns (verses 33–36), which runs on into the next chapter. The laws of injury “taught the ancient Israelites to value the lives of those around them as they would their very own.” The laws of property require that a loss be made good, and that restitution kept the peace of the community.

  Two things recur. One is what a person knew or intended: whether the killer lay in wait (verses 13–14), whether the owner of the ox had been warned (verses 29, 36). The other is the servant, who returns again and again. He is freed in the seventh year (verse 2), protected from a master’s blows (verses 20, 26–27), and valued at a price (verse 32). The law does not treat servant and free alike, and it does not leave the servant without rights.

sections:
  - range: 1-6
    heading: The servant who goes free, and the one who stays
    plain: |
      These are the judgments Moses is to set before the people. If you buy a Hebrew servant, he is to serve six years, and in the seventh he goes out free, paying nothing. If he came alone, he leaves alone; if he came married, his wife leaves with him. If his master gave him a wife and she has borne him sons or daughters, the wife and her children remain the master’s, and he leaves alone.

      But if the servant says plainly, “I love my master, my wife, and my children; I will not go out free,” his master is to bring him to the judges, and then to the door or the doorpost, and pierce his ear with an awl. He then serves him for ever.
  - range: 7-11
    heading: A daughter sold into a household
    plain: |
      If a man sells his daughter as a maidservant, she does not go out as the menservants do. If she does not please the master who has betrothed her to himself, he must let her be redeemed; he has no power to sell her to a foreign people, since he has dealt deceitfully with her. If he has betrothed her to his son, he is to treat her as a daughter. If he takes another wife, he may not reduce her food, her clothing, or her marital rights. If he does not do these three things for her, she goes out free, with no payment.
  - range: 12-17
    heading: Offenses punished by death
    plain: |
      Whoever strikes a man so that he dies is to be put to death. But if he did not lie in wait, and God delivered the man into his hand, the LORD will appoint a place to which he may flee. If a man comes deliberately against his neighbor to kill him by guile, he is to be taken even from the LORD’s altar to die.

      Whoever strikes his father or his mother is to be put to death. Whoever steals a man, whether he has sold him or is found holding him, is to be put to death. Whoever curses his father or his mother is to be put to death.
  - range: 18-27
    heading: Injuries
    plain: |
      If men quarrel and one strikes the other with a stone or his fist, and the man does not die but is laid up in bed, then if he gets up and walks about on his staff, the one who struck him is clear. He must only pay for the lost time and see him fully healed.

      If a man strikes his servant or his maid with a rod and the servant dies under his hand, he is to be punished. But if the servant remains alive a day or two, he is not to be punished, for the servant is his money.

      If men fight and hurt a pregnant woman so that she miscarries, and no other harm follows, the one responsible is to be punished as the woman’s husband lays upon him, and he pays as the judges determine. If other harm follows, the rule is life for life, eye for eye, tooth for tooth, hand for hand, foot for foot, burning for burning, wound for wound, stripe for stripe.

      If a man strikes the eye of his servant or his maid and destroys it, he is to let the servant go free for the eye’s sake. If he knocks out a servant’s tooth, he is to let the servant go free for the tooth’s sake.
  - range: 28-32
    heading: The ox that gores
    plain: |
      If an ox gores a man or a woman to death, the ox is to be stoned and its flesh is not to be eaten, but its owner is clear. If the ox was accustomed to gore, and its owner had been warned and did not keep it in, and it kills a man or a woman, the ox is to be stoned and its owner also is to be put to death. If a sum of money is laid on him, he is to pay for the ransom of his life whatever is laid on him. The same judgment holds if the ox gores a son or a daughter. If the ox gores a manservant or a maidservant, the owner is to give their master thirty shekels of silver, and the ox is to be stoned.
  - range: 33-36
    heading: The open pit, and an ox that kills an ox
    plain: |
      If a man opens a pit, or digs one, and does not cover it, and an ox or an ass falls in, the owner of the pit is to make it good: he pays the animal’s owner, and the dead animal is his. If one man’s ox injures another’s so that it dies, they are to sell the live ox and divide the money, and divide the dead ox also. But if the ox was known to gore and its owner did not keep it in, he is to pay ox for ox, and the dead animal is his.

notes:
  - ref: 1
    phrase: these are the judgments
    kind: words
    title: What a judgment is
    body: |
      A judgment here is a ruling on a case, and most of the chapter is written as cases. The laws of the Pentateuch take two main forms. Some are unconditional, like the “thou shalt” of the Ten Commandments. Others “govern behavior on a case-by-case basis”: they “are worded as conditional sentences and often begin with the word” *if*. Most of the laws in this chapter are of the second kind. Those that are not stand out, such as “he that curseth his father, or his mother, shall surely be put to death” (verse 17), which names no circumstance at all.

      The word reaches into the Book of Mormon. Lehi quotes a prophecy of Joseph in Egypt: “I will raise up a Moses; and I will give power unto him in a rod; and I will give judgment unto him in writing” ([[2 Ne. 3:17]]). One Latter-day Saint study suggests that it “may be of this” collection, which “largely consists of the” judgments, that the Lord spoke to Joseph. That is offered as a possibility. What the account plainly says is that Moses wrote them down ([[Ex. 24:4]]): “the text insists that Moses wrote.”
    sources: [bowen-law-codes, lds-scriptures]

  - ref: 2
    phrase: six years he shall serve
    kind: history
    title: Servants under the law
    body: |
      The law’s first act toward a Hebrew servant is to set a term to his service: six years, and in the seventh he goes out “free for nothing.” The verse does not say how he came to be bought. Elsewhere the law names two ways an Israelite might be sold: a thief who could not make restitution “shall be sold for his theft” ([[Ex. 22:3]]), and a brother “waxen poor” might be sold to his neighbor ([[Lev. 25:39]]). A term of this kind was known elsewhere. The laws of Hammurabi release a debtor’s family after three years of labor: “in the fourth year they shall be set free.”

      Later tellings of the law add to it. Deuteronomy names the woman with the man, “an Hebrew man, or an Hebrew woman” ([[Deut. 15:12]]), and forbids sending the servant away with nothing: “thou shalt not let him go away empty” ([[Deut. 15:13]]). Leviticus, which sets the poor brother’s release at the year of jubilee ([[Lev. 25:40]]), says what kind of service this is to be: “thou shalt not compel him to serve as a bondservant” ([[Lev. 25:39]]), and “Thou shalt not rule over him with rigour” ([[Lev. 25:43]]).

      Both books give the reason, and it is the Exodus. Deuteronomy says, “thou shalt remember that thou wast a bondman in the land of Egypt” ([[Deut. 15:15]]). In Leviticus the LORD says it of the servants themselves: “For they are my servants, which I brought forth out of the land of Egypt: they shall not be sold as bondmen” ([[Lev. 25:42]]).

      What this law does is set limits: a term, a release without payment, and, later in the chapter, penalties on a master who kills or maims (see the note on verse 20). It speaks of the Hebrew servant. Servants bought from other nations are treated at [[Lev. 25:44–46]], and they have no such release.
    sources: [lds-scriptures, hammurabi-king]

  - ref: 6
    phrase: his master shall bore his ear through with an awl
    kind: symbol
    title: The ear pierced at the door
    body: |
      A servant who chose to stay was brought before God and then marked at the door of the house he was joining for life. The reason he gives is love: “I love my master, my wife, and my children” (verse 5). Verse 4 explains the wife and children. A wife whom the master had given, and her children, stayed with the master when the servant’s term ended. One older reading grants that this “may appear oppressive” and takes the choice to stay as the law’s way “to modify the harshness of such a separation.”

      “Unto the judges” is literally “to God”: the Hebrew word is *elohim*, and the standard lexicon lists this verse under the sense “rulers, judges, either as divine representatives at sacred places or as reflecting divine majesty and power.” The same older reading has the servant make his declaration at “the place where judgment was given in the name of God,” as Moses says of Israel’s courts: “the judgment is God’s” ([[Deut. 1:17]]).

      The piercing is explained from the way Deuteronomy tells it: “thrust it through his ear unto the door” ([[Deut. 15:17]]). Ear and door are named together, and on that reading the servant is by this sign “to be fastened as it were to the house for ever,” with “for ever” taken as “as long as he lives.”
    sources: [lds-scriptures, bdb, keil-exodus]

  - ref: 7
    phrase: she shall not go out as the menservants do
    kind: history
    title: A daughter sold as a maidservant
    body: |
      The daughter of this law is sold to be married into the house that buys her, and the law is a list of what that house owes her. The verses that follow show it: her master has “betrothed her to himself” (verse 8) or “unto his son” (verse 9). On that ground the sale has been read to mean that a father “could arrange for the marriage of his daughter,” and “she shall not go out as the menservants do” to mean that her husband “could not use her as a slave.” One older reading takes the phrase differently: sold “as a housekeeper and concubine,” she was “not to be sent away as free at the end of six years of service.”

      Her rights follow, one condition at a time. If the master is not pleased with her, he must let her be redeemed, and he may not sell her to foreigners. If she is given to his son, she is treated as a daughter. If another wife is taken, her food, her clothing, and her “duty of marriage,” her marital rights, are not to be reduced. If these three are withheld, she goes out free and pays nothing. In all of it “she too maintained certain rights.”
    sources: [lds-scriptures, ot-manual-ex-21-24, keil-exodus]

  - ref: 13
    phrase: but God deliver him into his hand
    kind: scripture
    title: Killing without lying in wait
    body: |
      The law of homicide turns on intent: the one who lay in wait dies, and the one who did not is given a place to flee. “God deliver him into his hand” describes a death the killer did not plan. In ancient law premeditation “required a murder to have been preplanned or implemented through treachery,” and these verses name both, lying in wait and coming “to slay him with guile” (verse 14). The provision for the one who killed without intending it holds “divine justice and mercy in balance.”

      The place is promised here and named later. In the land there were to be cities of refuge, “that the slayer may flee thither, which killeth any person at unawares” ([[Num. 35:11]]). The altar gives a murderer no shelter: Joab “caught hold on the horns of the altar” ([[1 Kgs. 2:28]]) and was put to death there at Solomon’s order ([[1 Kgs. 2:34]]).

      Nephi’s account of Laban has been read against this law. The Spirit’s words to him are close to this verse’s: “Slay him, for the Lord hath delivered him into thy hands” ([[1 Ne. 4:12]]). Nephi also notes that he went “not knowing beforehand the things which I should do” ([[1 Ne. 4:6]]). One Latter-day Saint study takes the likeness to show that “the Spirit may have been legally excusing Nephi for slaying Laban.” That is a proposal, and it is offered as one.
    sources: [lds-scriptures, bowen-law-codes, sc-knowhy-256]

  - ref: 17
    phrase: he that curseth his father, or his mother
    kind: scripture
    title: Striking or cursing a parent
    body: |
      Striking a parent and cursing a parent stand in this list beside murder and kidnapping, and the Savior quotes the second as the commandment of God. He sets it with the fifth commandment: “For God commanded, saying, Honour thy father and mother: and, He that curseth father or mother, let him die the death” ([[Matt. 15:4]]). In Mark the same words are introduced “For Moses said” ([[Mark 7:10]]).

      What the law forbade was more than a hard word. The acts of verses 15 and 17 have been described as “violence and imprecatory oaths against one’s parents,” an imprecation being a curse called down on someone, and with kidnapping they “amounted to capital offenses.”

      On “smiteth” in verse 15, one Latter-day Saint study observes that if the word means an assault and not a killing, the verse “acts as a guide for the ancient civil/criminal judge to consider capital punishment during the sentencing phase.” The same study names the principle under the penalty: “to love and honor our parents.”
    sources: [lds-scriptures, bowen-law-codes, lund-ot-laws]

  - ref: 20
    phrase: he shall be surely punished
    kind: scripture
    title: A master who kills his servant
    body: |
      The Joseph Smith Translation makes the killing of a servant a capital crime. Where the King James Version says the master “shall be surely punished,” the Joseph Smith Translation reads “put to death,” and it makes the same change in verse 21, where the servant lives a day or two. Read that way, “killing a servant” belongs with the other capital crimes of the chapter. The Hebrew verb is literally “avenged,” and the verse does not say how: “In what the punishment consisted, is not stated.”

      Verse 21 is the harder one. “He is his money” means that the servant is “his master’s property, purchased by his master’s money.” One older reading explains the exemption by intent. If the servant survives a day or two, “it is clear that he did not intend to kill him,” and the master “is considered to have sufficiently punished himself by the loss of his property.”

      The law does speak of a person as property here, and it sets a price on a servant killed by an ox (verse 32). A servant nonetheless “has rights, and cannot be treated with entire impunity.” A master who destroys a servant’s eye or knocks out a tooth must “let him go free” (verses 26–27). The term of service and the reason for it are in the note on verse 2.
    sources: [lds-scriptures, ot-manual-ex-21-24, cambridge-exodus]

  - ref: 22
    phrase: so that her fruit depart from her
    kind: history
    title: The woman struck in a quarrel
    body: |
      The case is a bystander’s: two men fight, a pregnant woman is struck, and the law separates two outcomes. If she miscarries and there is no other harm, the man pays what the husband lays on him and the judges allow. If there is other harm, the rule of “life for life” applies (verse 23).

      One Latter-day Saint study counts this among the laws that “recognize the value of the gestation period,” an instance of the principle of “honoring life in all its stages.”
    sources: [lds-scriptures, lund-ot-laws]

  - ref: 24
    phrase: Eye for eye, tooth for tooth
    kind: scripture
    title: An eye for an eye
    body: |
      “Eye for eye” is a rule about the measure of a penalty: the punishment is to match the injury. It “expresses a principle of legal symmetry, of repaying in kind,” so that “the act of the punishment must be similar to the offense.” It is stated here inside a case that goes before judges (verse 22), and Deuteronomy gives it to a court that has made “diligent inquisition” ([[Deut. 19:18]]). Leviticus puts it in a sentence: “as he hath done, so shall it be done to him” ([[Lev. 24:19]]).

      The rule was not Israel’s alone. It was “divinely revealed in the Old Testament and applied broadly throughout the ancient Near East,” and Hammurabi’s laws have it in nearly the same words: “If a man put out the eye of another man, his eye shall be put out.” Within this chapter the rule is not applied to a servant’s injury. A servant who loses an eye or a tooth to his master goes free (verses 26–27).

      The Savior quotes the verse in the Sermon on the Mount: “Ye have heard that it hath been said, An eye for an eye, and a tooth for a tooth: But I say unto you, That ye resist not evil” ([[Matt. 5:38–39]]). One Latter-day Saint study reads Him as moving His disciples to a standard “in which we commit all personal vengeance or justice into his hands,” and suggests that He “did not so much intend to institute a new ethic as to restore the true ethic underlying the Mosaic legislation.”

      Alma’s teaching on restoration has been read as drawing on the same principle: “the meaning of the word restoration is to bring back again evil for evil” ([[Alma 41:13]]).
    sources: [lds-scriptures, bowen-law-codes, sc-knowhy-149, hammurabi-king]

  - ref: 28
    phrase: the ox shall be surely stoned
    kind: history
    title: Why the ox is stoned
    body: |
      An ox that kills a person is stoned and its flesh is not eaten, and the law gives no reason. One older reading finds the reason in the life taken: the ox “was laden with the guilt of murder, and therefore had become unclean,” and points to the word given to Noah: “at the hand of every beast will I require it” ([[Gen. 9:5]]).

      The owner’s part depends on what he knew. If the ox had not gored before, he is clear. If it was known to gore, and he had been warned and did not keep it in, his own life is forfeit: once he is on notice, “the owner will be held accountable for the actions of that animal.” The same case stands in Hammurabi’s laws, where the owner of a known gorer that kills a free man “shall pay one-half a mina in money.” Exodus begins from the owner’s life and then allows a payment in its place (see the note on verse 30).
    sources: [lds-scriptures, keil-exodus, lund-ot-laws, hammurabi-king]

  - ref: 30
    phrase: a sum of money
    kind: words
    title: The price of a life
    body: |
      The “sum of money” is in Hebrew a *kopher*, “the price of a life, ransom.” The negligent owner’s life is forfeit, and he may give this payment “for the ransom of his life” in whatever amount is laid on him.

      The law does not allow such a payment for a murderer: “ye shall take no satisfaction for the life of a murderer, which is guilty of death” ([[Num. 35:31]]). “Satisfaction” there is the same Hebrew word. A psalm takes up this payment and says that no man can make it to God for his brother; see the note at [[Ps. 49:7]].
    sources: [bdb, lds-scriptures]

  - ref: 32
    phrase: thirty shekels of silver
    kind: christ
    title: The price of a servant
    body: |
      Thirty shekels of silver is the value this law sets on a servant’s life, and it is the sum for which Jesus was betrayed. When Judas bargained with the chief priests, “they covenanted with him for thirty pieces of silver” ([[Matt. 26:15]]). Elder James E. Talmage wrote that the amount “was the price fixed by the law as that of a slave; it was also the foreseen sum of the blood-money to be paid for the Lord’s betrayal.”

      The foreseeing is in Zechariah, in a chapter the Church’s edition heads as a prophecy of the Messiah’s betrayal. The prophet says, “So they weighed for my price thirty pieces of silver” ([[Zech. 11:12]]), and Matthew, telling how the money was returned, speaks of “the thirty pieces of silver, the price of him that was valued” ([[Matt. 27:9]]).
    sources: [lds-scriptures, talmage-jesus-christ-33]

christ: |
  The judgments are spoken by the LORD in the first person: “I will appoint thee a place” (verse 13); “thou shalt take him from mine altar” (verse 14). The LORD who speaks is Jehovah, the premortal Jesus Christ (see [[Ex. 3:14]]).

  In His mortal ministry He quotes this chapter twice. He cites its law on cursing parents as what “God commanded” ([[Matt. 15:4]]), and He takes its “eye for eye” as the saying from which He leads His disciples further (see the notes on verses 17 and 24). The price the chapter sets on a servant is the price that was paid for Him (see the note on verse 32).

explore: |
  - **The law in Jeremiah’s day.** [[Jer. 34:8–17]], where the LORD holds Jerusalem to this law: “At the end of seven years let ye go every man his brother an Hebrew” ([[Jer. 34:14]]).
  - **The cities of refuge.** [[Num. 35:9–34]] and [[Deut. 19:1–13]].
  - **The Sermon on the Mount.** [[Matt. 5:38–48]], where the Savior goes on from “eye for eye.”
  - **A study of the three law codes.** “‘I Will Give Judgment unto Him in Writing’: The Three Law Codes of the Pentateuch” (Religious Studies Center, 2021) sets this collection beside the laws of Leviticus and Deuteronomy.

