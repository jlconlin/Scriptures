chapter: 1
title: A New King Which Knew Not Joseph
tagline: Jacob’s family of seventy becomes a people that fills the land. A new king enslaves them and then orders their sons killed, and still they multiply.
when: 'During the oppression in Egypt, before the birth of Moses'

setting: |
  Exodus is “a continuation of the narrative in Genesis.” Genesis ended with Joseph’s death in Egypt ([[Gen. 50:26]]); Exodus repeats the names of the sons who came down with Jacob and the count of seventy ([[Gen. 46:8–27]]), and then passes over the intervening generations in two verses.

  Latter-day revelation names Moses as the writer: the Lord told him, “thou shalt write the things which I shall speak” ([[Moses 1:40]]), and Lehi found “the five books of Moses” on the plates of brass ([[1 Ne. 5:11]]). It is also evident that “scribes and copyists have left their traces upon the Pentateuch as we have it today”; the fuller statement is at [[Gen. 1:1]].

  The chapter names no king and gives no date. The note on verse 11 says what can be known about the date. The book tells the history of a nation in three stages, “first, a nation enslaved; then a nation redeemed; lastly, a nation set apart,” and this chapter begins the first.

  Later scripture retells it. Stephen summarizes the chapter in three verses ([[Acts 7:17–19]]), a psalm sings it ([[Ps. 105:23–25]]), and Nephi reminds his brothers that Israel was “laden with tasks, which were grievous to be borne” ([[1 Ne. 17:25]]).

thread: |
  The chapter is a contest between **a promise and a king**.

  It begins with growth. Seventy people come into Egypt, that generation dies, and their children become so many that “the land was filled with them” (verses 1–7). Stephen calls that growth the promise sworn to Abraham coming due ([[Acts 7:17]]; see the note on verse 7).

  Then a new king sets out to stop it, and he tries three times. The first measure is forced labor: taskmasters, burdens, brick and mortar (verses 11–14). The result is the line the chapter turns on: “the more they afflicted them, the more they multiplied and grew” (verse 12). The second goes through the midwives: he tells them to kill the boys as they are born, and they will not (verses 15–21). The third is open: all his people are to throw the newborn sons into the river (verse 22). One older reading sums up the pattern: every measure the king took to weaken Israel, “instead of checking, served rather to promote their continuous increase.”

  God is named only in the middle scene. The midwives “feared God,” and “God dealt well with the midwives” (verses 17, 20–21). He does not speak in this chapter. What stands against Pharaoh is a people who keep having children and two women who will not do what they are told.

  The chapter ends with the decree still in force. The next chapter opens with one of the sons it was meant to kill.

sections:
  - range: 1-7
    heading: A family becomes a people
    plain: |
      These are the names of the sons of Israel who came to Egypt with Jacob, each with his household: Reuben, Simeon, Levi, and Judah; Issachar, Zebulun, and Benjamin; Dan and Naphtali; Gad and Asher. Jacob’s descendants numbered seventy in all; Joseph was already in Egypt. In time Joseph died, and so did his brothers and all of that generation. But the children of Israel had many children. They increased and grew very strong, until the land was full of them.
  - range: 8-14
    heading: A new king and hard bondage
    plain: |
      A new king came to power in Egypt, one who did not know Joseph. He said to his people, “The Israelites have become too many and too strong for us. We must deal shrewdly with them, or they will keep increasing, and if a war breaks out they will join our enemies, fight against us, and leave the country.” So the Egyptians set taskmasters over them to wear them down with heavy loads, and they built the store cities of Pithom and Raamses for Pharaoh. But the more they were oppressed, the more they multiplied and grew, and the Egyptians grew uneasy about them. They worked the Israelites harshly and made their lives bitter with hard labor in mortar and brick and every kind of work in the fields. All the work they were made to do was harsh.
  - range: 15-21
    heading: The midwives who feared God
    plain: |
      The king of Egypt spoke to the Hebrew midwives, one named Shiphrah and the other Puah. “When you help the Hebrew women give birth,” he said, “and see them on the birth-stools, if it is a son, kill him. If it is a daughter, let her live.” But the midwives feared God. They did not do what the king told them, and they let the boys live. The king sent for them and asked, “Why have you done this? Why have you let the boys live?” They answered, “Hebrew women are not like Egyptian women. They are vigorous, and they give birth before the midwife gets to them.” So God was good to the midwives, and the people went on multiplying and became very strong. Because the midwives feared God, He gave them households.
  - range: 22-22
    heading: Every son into the river
    plain: |
      Then Pharaoh gave an order to all his people: “Throw every son that is born into the river, and let every daughter live.”

notes:
  - ref: 7
    phrase: were fruitful, and increased abundantly, and multiplied
    kind: scripture
    title: The promise begins to be kept
    body: |
      The verse says five times over that Israel grew, and the repetition is there “to emphasize that the Lord was fulfilling His promise to His people.” As Jacob set out for Egypt, God told him, “fear not to go down into Egypt; for I will there make of thee a great nation” ([[Gen. 46:3]]). Genesis had already reported the beginning, that in Goshen they “grew, and multiplied exceedingly” ([[Gen. 47:27]]); Exodus now reports a land full of them.

      Stephen reads the verse the same way: “when the time of the promise drew nigh, which God had sworn to Abraham, the people grew and multiplied in Egypt” ([[Acts 7:17]]). The promise to Abraham also foretold affliction: his seed would be “a stranger in a land that is not theirs, and shall serve them; and they shall afflict them four hundred years” ([[Gen. 15:13]]). On the four hundred years, see [[Ex. 12:40]].
    sources: [ot-minute-ex-1, lds-scriptures]
  - ref: 8
    phrase: a new king over Egypt, which knew not Joseph
    kind: history
    title: Why the new king feared Israel
    body: |
      The king’s fear in verse 10, that Israel would “join also unto our enemies,” makes sense if he belonged to the dynasty that had just driven foreign rulers out of Egypt. Joseph is often placed in the time of the Hyksos, kings of Canaanite origin who ruled northern Egypt (see the background to [[Gen. 41]]). The verse “could literally mean that the Pharaoh who personally knew Joseph passed away, but it could also mean that the Pharaohs who knew Joseph, the Hyksos dynasty, came to an end.” Either way, “knew not” most likely means disregard, not ignorance: the new king “had no respect for Joseph or anything he did.”

      The rulers who expelled the Hyksos, about 1550 B.C., “absolutely detested having been dominated by foreigners,” and they fortified the northeastern border against another invasion from Canaan. Israel was a Semitic people settled near that border, and the fear of another invasion “would also explain why these new Egyptian kings wanted to enslave the Israelites in order to avoid their aiding any potential invaders.” This is a reconstruction, and it depends on when Joseph lived, which is not known. What does not depend on it is that Israel was enslaved under the New Kingdom, when Egypt was at the height of its power.
    sources: [sc-knowhy-844, muhlestein-israel-egypt]
  - ref: 11
    phrase: treasure cities, Pithom and Raamses
    kind: history
    title: When this was, and which Pharaoh
    body: |
      Exodus never names the Pharaoh, and the date of the Exodus is not known. Three pieces of evidence narrow it.

      **A number.** Solomon began the temple “in the four hundred and eightieth year after the children of Israel were come out of the land of Egypt” ([[1 Kgs. 6:1]]). Counted back from about 966 B.C., that gives 1446 B.C. But 480 is twelve times forty, and it “is almost certainly supposed to be a symbolic number.”

      **A stone.** Pharaoh Merneptah, the son of Ramesses II, set up an inscription that boasts of defeating Israel in Canaan. It is the first mention of Israel outside the Bible, and it writes the name with the sign for a people, not for a place. Israel was therefore in Canaan, and the Exodus was over, before about 1200 B.C.

      **A city.** Verse 11 says the Israelites built a city called Raamses, a detail that “only makes sense during the reign of Ramesses II who built a capital city called Pi-Ramesses.” Pithom and Raamses are “most likely” two neighboring sites, and it is known when those sites were built.

      Together these make “the most likely setting” the reigns of Seti I and Ramesses II, in the thirteenth century B.C. The Bible Dictionary names the same two kings as “the Pharaohs of oppression.” For the Pharaoh of the Exodus itself it reports Merneptah as the one “generally believed,” and adds that this has been doubted. More recent Latter-day Saint studies propose his father: Ramesses II “may well have been the pharaoh of the Exodus,” and “a nice, round date” would be 1250 B.C. Those who make the proposal call it “speculative.” Other chapters here say only “Pharaoh.”

      “Treasure cities” are, in the Hebrew, “storage cities,” that is, granaries. For the sequence around it, see [A Timeline of the Old Testament](/old-testament/guides/israels-story/#patriarchs).
    sources: [sc-knowhy-847, muhlestein-israel-egypt, bd-pharaoh, lds-scriptures]
  - ref: 14
    phrase: in mortar, and in brick
    kind: history
    title: Why brick
    body: |
      Israel made bricks because of where it lived. The Bible puts the Israelites near the northeastern Nile delta, “a place with little stone, dictating that almost all building was done with mud bricks.” Egyptian records tell of forced brick-making by various groups, other Semites among them, and scenes in Egyptian tombs show taskmasters seeing that their workers “made their quota of bricks, which were made using straw, mud, and the sun.” The quota and the straw come back in [[Ex. 5:7–8]].

      The same fact explains why remains of these settlements are not to be expected. Mud brick does not last as stone does, least of all in ground as wet as the delta’s.

      [What Israel Builds](/exodus/themes/what-israel-builds/) follows the word for this bondage to the service of the tabernacle.
    sources: [muhlestein-israel-egypt]
  - ref: 15
    phrase: the Hebrew midwives
    kind: history
    title: Two midwives for a whole people
    body: |
      Verse 15 names two midwives for a people the king thought too many, and two explanations are given. One older reading takes Shiphrah and Puah to be “the heads of the whole profession,” who “were expected to communicate their instructions to their associates”; another has the king speaking to many midwives, “two of them being Shiphrah and Puah.” The text says only that these two were spoken to. It names both women and never names the king.

      This is the first time Exodus uses the word “Hebrew.” On where the name comes from and who uses it, see [[Gen. 14:13]]. See also [Women and marriage in the Old Testament](/old-testament/guides/women-and-marriage/#the-women).
    sources: [keil-exodus, ot-minute-ex-1]
  - ref: 17
    phrase: But the midwives feared God
    kind: history
    title: The first to resist Pharaoh
    body: |
      The first people in Exodus to defy Pharaoh are two women, before Moses is born. On one Latter-day Saint reading, “it was through the courageous actions of these midwives that the rebellion against Egypt began.” Another counts Shiphrah and Puah first in a line of women who keep Moses alive through the next chapters (his mother, his sister, Pharaoh’s daughter, and later his wife) and concludes, “Without these women, there is no Moses; without Moses, there is no Exodus.” Both are their authors’ reflections on the story, but the order of events is the text’s own.

      Their reward is told in verse 21: God “made them houses,” that is, “households (descendants).” This woman's story is told alongside others in [Women and marriage in the Old Testament](/old-testament/guides/women-and-marriage/#the-women).
    sources: [tilton-moses-midwife, welch-saviors, lds-scriptures]
  - ref: 19
    phrase: for they are lively, and are delivered ere the midwives come in unto them
    kind: history
    title: Did the midwives lie to Pharaoh?
    body: |
      The text does not say whether the midwives’ answer was true, and it puts their reward down to their fear of God, not to the answer. “Lively” means “having the vigour of life,” used here of women “bearing quickly easily.” But verse 17 has already said that the midwives chose to let the boys live. The answer has accordingly been called “their ostensible reason,” and one older reading says plainly that “they succeeded in deceiving the king with this reply.”

      Augustine’s answer to whether God rewarded a lie was that He rewarded them “not, however, because they lied, but because they were merciful to the people of God.” The chapter’s own reason is that the midwives “feared God” (verse 21). For more on the women of the Old Testament, see [Women and marriage in the Old Testament](/old-testament/guides/women-and-marriage/#the-women).
    sources: [bdb, ot-minute-ex-1, keil-exodus]

christ: |
  The chapter shows why a deliverer is needed and that God has already begun to act: the growth of Israel is, in Stephen’s words, “the time of the promise” drawing near ([[Acts 7:17]]).

  The last verse is the decree Moses will be born under. A king orders the sons of Israel killed, and the child who will lead Israel out is born under that order and survives it ([[Ex. 2:1–10]]). That infancy has been compared with the Savior’s, whose life Herod threatened when he had the children of Bethlehem killed ([[Matt. 2:13–16]]); the next chapter takes up the comparison ([[Ex. 2]]). It is a likeness between two lives; the chapter itself draws none.

explore: |
  - **Stephen’s retelling.** [[Acts 7:17–22]] tells this chapter and the next in six verses.
  - **The psalm’s version.** [[Ps. 105:23–25]] says that God “increased his people greatly” and that the hatred followed; see the note there.
  - **The promise behind the bondage.** Read [[Gen. 15:13–14]] and [[Gen. 46:3–4]], then [[Ex. 2:23–25]], where God “remembered his covenant.”
  - **Taskmasters in the Book of Mormon.** Alma’s people are put under “tasks” and “task-masters” ([[Mosiah 24:9]]), and the story that follows is told as a deliverance from bondage ([[Mosiah 24:13–21]]).

parallels:
  - ref: Acts 7:17–19
    note: Stephen retells the growth of Israel, the king who “knew not Joseph,” and the casting out of the children.
  - ref: Ps. 105:23–25
    note: The psalm tells of Israel’s increase in Egypt and the hatred that followed it.
  - ref: 1 Ne. 17:25
    note: Nephi reminds his brothers that Israel was in bondage and “laden with tasks.”
  - ref: Mosiah 24:9
    note: Amulon puts tasks and taskmasters over Alma’s people.

