chapter: 29
title: The Consecration of the Priests
tagline: The LORD tells Moses how Aaron and his sons are to be made priests. They are washed, clothed, anointed, and consecrated by three sacrifices over seven days. A lamb is to be offered every morning and evening, and the LORD promises to dwell among Israel.
when: 'During Moses’s forty days on Mount Sinai (24:18). The rites are carried out later, in Leviticus 8.'

setting: |
  Moses is on the mountain, where he “was in the mount forty days and forty nights” ([[Ex. 24:18]]), receiving the pattern of the tabernacle. Chapter 28 named the priests, Aaron and his sons, and described their garments; the priesthood they held is treated at [[Ex. 28:1]]. This chapter says how they are to be made priests.

  These are instructions for rites not yet performed. The tabernacle does not exist, and nothing here is done until it stands. The command is repeated when the tabernacle is to be set up ([[Ex. 40:12–15]]), and Leviticus 8 describes the rites being carried out step by step, with the refrain “as the LORD commanded Moses” ([[Lev. 8:13]]).

  Moses himself officiates. He washes, clothes, and anoints his brother, offers the sacrifices, and receives a share of the last one (verse 26).

  The rites use things that are explained where the LORD commands them: the altar ([[Ex. 27:1]]), the garments (chapter 28), the anointing oil ([[Ex. 30:25]]). They also use the three kinds of altar sacrifice known to the law, “sin offerings, burnt offerings, and peace offerings,” whose rules are set out in Leviticus 1–7.

  The chapter closes with the offering the new priests are to make every day, and with the LORD’s own statement of why He brought Israel out of Egypt.

thread: |
  A priest in Israel was “a mediator between his people and God.” The chapter says, step by step, how a man becomes such a mediator.

  First come three things done to the priests: they are washed, clothed, and anointed (verses 4–9). Then come three sacrifices offered for them: one for sin, one wholly burned, one eaten (verses 10–34). The consecration thus has two parts, “ceremonial and sacrificial,” and the order within the second part is deliberate (see the note on verse 10). The Hebrew idiom behind “consecrate” is to “fill the hand,” and at the center of the rite the offering is laid in the priests’ hands (see the note on verse 9).

  All of it is repeated for seven days, for the priests and for the altar they will serve (verses 35–37). Then the chapter says what a consecrated priesthood and a consecrated altar are for: a lamb every morning and every evening through Israel’s generations (verses 38–42).

  In the last five verses the LORD turns from commands to promises. Through verse 41 the verbs are commands to Moses: “thou shalt” wash, anoint, kill, sprinkle, sanctify. From verse 42 the LORD says what He will do: “I will meet,” “I will sanctify,” “I will dwell.” The two sides have been described in this way: “just as mortals sanctified themselves and the space around them to reconcile themselves with God, so God participated in preparing the space and the individual so that reconciliation could happen.”

  The final verse gives the reason for everything in the chapter, and for the deliverance from Egypt: “that I may dwell among them.”

sections:
  - range: 1-9
    heading: Washed, clothed, and anointed
    plain: |
      “This is what you are to do to hallow them, so that they may serve me as priests. Take one young bull and two rams without blemish, with unleavened bread, unleavened cakes mixed with oil, and unleavened wafers spread with oil, all made of wheat flour. Put the bread in one basket and bring it with the bull and the two rams.

      “Bring Aaron and his sons to the door of the tabernacle of the congregation and wash them with water. Take the garments and put on Aaron the coat, the robe of the ephod, the ephod, and the breastplate, and gird him with the skillfully woven girdle of the ephod. Set the mitre on his head and the holy crown on the mitre. Then take the anointing oil, pour it on his head, and anoint him.

      “Bring his sons and put coats on them. Gird Aaron and his sons with girdles and bind the bonnets on them. The priest’s office will be theirs by a perpetual statute. So you are to consecrate Aaron and his sons.”
  - range: 10-18
    heading: The sin offering and the burnt offering
    plain: |
      “Bring the bull before the tabernacle. Aaron and his sons are to lay their hands on its head, and you are to kill it before the LORD at the door of the tabernacle. Put some of its blood on the horns of the altar with your finger and pour out the rest at the base of the altar. Burn on the altar the fat that covers the inner parts, the lobe of the liver, and the two kidneys with their fat. But the flesh of the bull, its hide, and its dung you are to burn outside the camp. It is a sin offering.

      “Take one of the rams. Aaron and his sons are to lay their hands on its head. Kill it and sprinkle its blood around the altar. Cut the ram in pieces, wash its inner parts and its legs, and lay them with the pieces and the head. Burn the whole ram on the altar. It is a burnt offering to the LORD, a pleasing fragrance, an offering made by fire to the LORD.”
  - range: 19-28
    heading: The ram of consecration
    plain: |
      “Take the other ram. Aaron and his sons are to lay their hands on its head. Kill it, and put some of its blood on the tip of the right ear of Aaron and of his sons, on the thumb of their right hand, and on the great toe of their right foot, and sprinkle the blood around the altar. Take some of the blood that is on the altar and some of the anointing oil and sprinkle it on Aaron and his garments, and on his sons and their garments. So he and his garments will be hallowed, and his sons and their garments with him.

      “Take from this ram the fat and the fat tail, the fat that covers the inner parts, the lobe of the liver, the two kidneys with their fat, and the right shoulder, for it is a ram of consecration. Take also one loaf of bread, one cake of oiled bread, and one wafer from the basket of unleavened bread that is before the LORD. Put all of it in the hands of Aaron and his sons, and wave it as a wave offering before the LORD. Then take it from their hands and burn it on the altar as a burnt offering, a pleasing fragrance before the LORD, an offering made by fire.

      “Take the breast of the ram of Aaron’s consecration and wave it before the LORD; it will be your portion. Set apart the breast that is waved and the shoulder that is heaved up, from the ram of consecration, from what is for Aaron and for his sons. They will belong to Aaron and his sons by a statute for ever from the children of Israel. It is a heave offering, the children of Israel’s heave offering to the LORD out of their peace offerings.”
  - range: 29-37
    heading: The meal and the seven days
    plain: |
      “Aaron’s holy garments are to pass to his sons after him, so that they may be anointed and consecrated in them. The son who becomes priest in his place is to wear them seven days when he comes into the tabernacle to minister in the holy place.

      “Take the ram of consecration and cook its flesh in the holy place. Aaron and his sons are to eat the flesh of the ram and the bread in the basket at the door of the tabernacle. They are to eat the things with which the atonement was made, to consecrate and sanctify them. No one else may eat of them, because they are holy. If any of the flesh or the bread is left until morning, burn it. It is not to be eaten, because it is holy.

      “Do all this to Aaron and his sons as I have commanded you. Seven days you are to consecrate them. Each day offer a bull as a sin offering for atonement. Cleanse the altar when you make atonement for it, and anoint it to sanctify it. Seven days you are to make atonement for the altar and sanctify it, and it will be an altar most holy. Whatever touches the altar will be holy.”
  - range: 38-46
    heading: The daily offering and the promise
    plain: |
      “This is what you are to offer on the altar: two lambs a year old, day by day, continually. Offer one lamb in the morning and the other in the evening. With the first lamb offer a tenth measure of flour mixed with a quarter of a hin of beaten oil, and a quarter of a hin of wine as a drink offering. Offer the second lamb in the evening with the same offering of flour and the same drink offering as in the morning, a pleasing fragrance, an offering made by fire to the LORD. This is to be a continual burnt offering through your generations at the door of the tabernacle of the congregation before the LORD, where I will meet you and speak to you.

      “There I will meet with the children of Israel, and the tabernacle will be sanctified by my glory. I will sanctify the tabernacle of the congregation and the altar. I will also sanctify Aaron and his sons to serve me as priests. I will dwell among the children of Israel and will be their God. They will know that I am the LORD their God, who brought them out of the land of Egypt so that I might dwell among them. I am the LORD their God.”

notes:
  - ref: 4
    phrase: shalt wash them with water
    kind: history
    title: Washed, clothed, and anointed at the door
    body: |
      The consecration begins with three acts done to the priests before any sacrifice is offered: they are washed, clothed, and anointed. The rite as a whole “consisted of two parts: ceremonial and sacrificial,” and these three acts are the ceremonial part.

      The washing is done at the entrance of the tent, and “the Bible does not mention what the washing involved.” In the ancient world washing with water “often symbolized becoming ritually clean, which allowed the person to perform sacred acts such as prayer or sacrifice,” and here it stood for spiritual cleansing. Together the three acts prepared Aaron and his sons to officiate in the tabernacle.

      The clothing follows chapter 28, where each garment is explained (see [[Ex. 28:2]]). Aaron is dressed as high priest, with the ephod, the breastplate, and the holy crown. His sons receive only coats, girdles, and bonnets.

      The Church’s footnotes to the washing in this verse and the anointing in verse 7 point to a latter-day revelation in which the Lord names “your anointings, and your washings” among the things “ordained by the ordinance of my holy house, which my people are always commanded to build unto my holy name” ([[D&C 124:39]]).
    sources: [bd-priests, ot-minute-ex-25, scripture-helps-ex-35, lds-scriptures]

  - ref: 7
    phrase: pour it upon his head, and anoint him
    kind: symbol
    title: What the anointing meant
    body: |
      Anointing with the holy oil marked Aaron as one set apart by God for a sacred office, and the titles Messiah and Christ both mean “anointed.” In Israel priests were anointed, kings “were anointed to their office by the prophets,” and Elisha “was to be anointed a prophet by Elijah.” The oil used on Aaron was not common oil. It was “composed of olive oil mixed with spices” and was “restricted in use to certain specified ceremonies” (see [[Ex. 30:25]]).

      The anointing has been read as God’s own act, carried out through Moses. The atoning rites of the tabernacle were repeated often, but the anointing, “once done, was never performed again.” The oil “belonged to God himself, transforming that which touched it,” so that “the anointing is the divine reaching out to mortals.” In Leviticus the high priest may not leave the sanctuary to mourn, “for the crown of the anointing oil of his God is upon him” ([[Lev. 21:12]]).

      The oil was poured out freely. A psalm remembers it running down “upon the beard, even Aaron’s beard” and on to the skirts of his garments ([[Ps. 133:2]]).

      Jesus is “the one anointed of the Father to be His personal representative in all things pertaining to the salvation of mankind,” and Peter says with what He was anointed: “God anointed Jesus of Nazareth with the Holy Ghost and with power” ([[Acts 10:38]]).
    sources: [bd-anoint, belnap-dwell-among, bd-anointed-one, lds-scriptures]

  - ref: 9
    phrase: thou shalt consecrate Aaron and his sons
    kind: words
    title: To consecrate is to fill the hand
    body: |
      The Hebrew behind “consecrate” in this verse is an idiom: to fill the hand. Where the King James Version reads “thou shalt consecrate Aaron and his sons,” the Hebrew “can actually be translated as ‘thou shalt fill the hand of Aaron and the hand of his sons.’” A related noun gives the second ram its name: the “ram of consecration” in verse 22 is the ram of “installation (of priests).”

      The rite acts the idiom out. In verses 22–24 Moses lays the fat, the right shoulder, and the bread “in the hands of Aaron, and in the hands of his sons,” and they lift them before the LORD. The priests’ hands “were filled” with these portions, and so “the gifts that henceforward they would offer to the Lord on behalf of the people were thus committed to them.”

      Another reading of the idiom looks to the open hand itself, which “implies a symbolic opening of the hand to receive authority or a divine commission from God.” The phrase as a whole means to “engage in the ordinance of setting them apart.”
    sources: [oshb-wlc, bdb, bd-priests, ot-minute-ex-25, lds-scriptures]

  - ref: 10
    phrase: shall put their hands upon the head of the bullock
    kind: history
    title: Three sacrifices in a set order
    body: |
      The priests are consecrated by three sacrifices offered in a fixed order: a sin offering, a burnt offering, and an offering that ends in a meal. The bull is the sin offering, “to put away their sin.” The first ram is a burnt offering, wholly consumed on the altar, “to indicate the full and complete surrender of themselves to God.” The second ram is “a peace or consecration offering,” part of which the priests eat.

      Each sacrifice begins in the same way, with Aaron and his sons laying their hands on the animal’s head. In the sacrifices of the law that act “dedicated the animal to God and made it the sacrificer’s representative and substitute.” The men who will offer sacrifice for Israel begin as men who need one, a reminder “that they were only able to act on behalf of the people because of the shedding of blood.”

      The blood is handled differently each time, as the law of sacrifice later prescribes. The blood of a sin offering “was put (smeared) upon the horns of the altar,” and the blood of burnt and peace offerings “was sprinkled on the altar of burnt offering round about.” Verses 12, 16, and 20 follow that rule.

      The order carries the meaning. Whenever the three were offered together the sin offering came first, then the burnt offering, then the peace offering, which is “the order of atonement, sanctification, and fellowship with the Lord.”
    sources: [bd-priests, bd-sacrifices, ot-minute-ex-25]

  - ref: 14
    phrase: shalt thou burn with fire without the camp
    kind: christ
    title: Burned outside the camp
    body: |
      The flesh of the sin offering is carried out of the camp and burned, and the Epistle to the Hebrews sees in that practice the place where Jesus suffered. Only the fat of the bull goes on the altar. The law later makes the same disposal the rule for the sin offering of a priest: “the whole bullock shall he carry forth without the camp unto a clean place” ([[Lev. 4:12]]).

      Hebrews takes up the practice, speaking of the sin offerings whose blood the high priest carried into the sanctuary: “For the bodies of those beasts, whose blood is brought into the sanctuary by the high priest for sin, are burned without the camp. Wherefore Jesus also, that he might sanctify the people with his own blood, suffered without the gate” ([[Heb. 13:11–12]]). The writer then turns it into a summons: “Let us go forth therefore unto him without the camp, bearing his reproach” ([[Heb. 13:13]]).
    sources: [lds-scriptures, ot-minute-ex-25]

  - ref: 20
    phrase: upon the tip of the right ear of Aaron
    kind: symbol
    title: Blood on the ear, the thumb, and the toe
    body: |
      The blood put on the priest’s right ear, right thumb, and right great toe has been read as a sign of what he is to hear, what he is to do, and where he is to walk. The text gives no explanation of its own. That reading has been put in a sentence: “Obedience to the divine voice and activity in the divine service were thus symbolized.”

      A fuller reading takes the three in turn, and offers each as a possibility. The ear “could be a symbol of the sanctification of the priest’s ability to hear the word of God and to hearken to His commands.” The thumb could stand for the hands, “the main way in which the priest executed the various sacrifices and ordinances.” The toe “could be a symbol for the path the priests took.”

      The verse that follows completes the act. Blood from the altar and anointing oil are sprinkled on the priests and on their garments, and the text says what this does: Aaron “shall be hallowed, and his garments.” This sprinkling has been read as what established the relationship between Aaron and God, and compared with the blood sprinkled on the whole of Israel when the covenant was made (see [[Ex. 24:8]]).
    sources: [bd-priests, ot-minute-ex-25, belnap-dwell-among]

  - ref: 27
    phrase: the breast of the wave offering, and the shoulder of the heave offering
    kind: history
    title: The wave breast and the heave shoulder
    body: |
      “Wave offering” and “heave offering” name the parts of a sacrifice that were lifted before the LORD and then given to the priests as their share. Here “waved” means “lifted up” and “heaved” means “elevated.” The first Hebrew word is “a swinging, waving, wave-offering,” used at first of the priest’s share of a sacrifice, and the second is a “contribution, offering, for sacred uses,” “properly something lifted off, separated.”

      The chapter does not describe the motion. One reading is that the priests “took the sacrifice in their hands and waved it or moved it back and forth between the offerers (the priests) and the altar,” so that “the Lord accepted the sacrifice and then returned a portion to them.”

      On this one occasion the breast goes to Moses, who officiates: “it shall be thy part” (verse 26). From then on the breast and the shoulder of every peace offering Israel brings are “Aaron’s and his sons’ by a statute for ever.” This is how the priests were to live. They “were to have no part or inheritance in the land,” and these portions were among the things assigned for their maintenance.
    sources: [lds-scriptures, bdb, ot-minute-ex-25, bd-priests]

  - ref: 33
    phrase: they shall eat those things wherewith the atonement was made
    kind: symbol
    title: A meal at the door of the tabernacle
    body: |
      The consecration ends with a meal: Aaron and his sons eat the flesh of the second ram and the bread from the basket at the door of the tabernacle. A meal was “the characteristic rite” of the peace offering, which “presupposed that the sacrificer was at peace with God,” and “a feast symbolized fellowship and friendship among all its partakers and providers.”

      One reading makes the LORD the host. His portion has gone up from the altar, and the priests eat theirs at the door of His house, so that the meal “could symbolize that the priests were now at peace with God.”

      The meal has limits that mark it as holy. No one but the priests may eat of it, and nothing is kept for the next day. What remains in the morning is burned.
    sources: [bd-sacrifices, ot-minute-ex-25]

  - ref: 35
    phrase: seven days shalt thou consecrate them
    kind: history
    title: Seven days for the priests and for the altar
    body: |
      The rite is repeated for seven days, and the priests do not leave the tabernacle until it is finished. When Moses carries out the command he tells them, “ye shall not go out of the door of the tabernacle of the congregation in seven days, until the days of your consecration be at an end” ([[Lev. 8:33]]).

      The altar is treated as the priests are. Each day a bull is offered as a sin offering, and the altar is cleansed, atoned for, and anointed, until it is “an altar most holy” (on the word atonement, see [[Ex. 25:17]]).

      The text does not say why the number is seven. One reading is that seven “often represents completion or perfection,” as in the week of Creation, and the rite has been described in the same terms: “the process is done, like a creation, for seven days so that atonement can be made there from then on.”

      The same seven days are prescribed for Aaron’s successor. The son who is priest in his place is to wear the holy garments seven days (verse 30).
    sources: [lds-scriptures, ot-minute-ex-25, belnap-dwell-among]

  - ref: 38
    phrase: two lambs of the first year day by day continually
    kind: history
    title: The continual burnt offering
    body: |
      Once the tabernacle stood, a lamb was to be offered on its altar every morning and every evening, with flour, oil, and wine. This is the “continual burnt offering” of verse 42. A burnt offering signified surrender to God, and “as the obligation to surrender was constant on the part of Israel,” the offering was made “twice daily, morning and evening.” With each lamb went a measure of flour mixed with oil (the King James “meat offering” is an offering of “cereal, meal, or flour”) and a drink offering of wine.

      One older reading is that the directions stand in this chapter about consecrating priests “because these sacrifices commenced immediately after the completion of the tabernacle.” Moses later calls it the offering “which was ordained in mount Sinai” ([[Num. 28:6]]), and every other sacrifice in Israel’s calendar is offered “beside the continual burnt offering” ([[Num. 28:10]]).

      The Church’s footnotes to these verses point to places where later scripture assumes the daily offering. A psalm asks that prayer rise “as the evening sacrifice” ([[Ps. 141:2]]). Daniel’s vision of desolation is of a time when “the daily sacrifice was taken away” ([[Dan. 8:11]]).
    sources: [bd-sacrifices, keil-exodus, lds-scriptures]

  - ref: 42
    phrase: where I will meet you
    kind: scripture
    title: Where the LORD meets Israel
    body: |
      The LORD names the door of the tabernacle, where the daily offering is made, as a place where He will meet the whole people and not Moses alone. The Hebrew name behind “tabernacle of the congregation” is “tent of meeting” (see [[Ex. 27:21]]), and these two verses say whose meeting it is: “where I will meet you, to speak there unto thee,” and “there I will meet with the children of Israel.”

      He had already said this of the ark: “there I will meet with thee, and I will commune with thee from above the mercy seat” ([[Ex. 25:22]]). That promise was to Moses, at a place the people could not approach. In one older reading the promise here reaches beyond Moses: the presence and communion promised at the ark “are ensured to the whole nation” at the altar in the court, the one place where the people could draw near.
    sources: [lds-scriptures, keil-exodus]

  - ref: 46
    phrase: that I may dwell among them
    kind: scripture
    title: Brought out of Egypt to dwell among them
    body: |
      The chapter ends by stating the purpose of the Exodus: the LORD brought Israel out of Egypt in order to dwell among them. The sentence takes up the promise He made while they were still slaves, “I will take you to me for a people, and I will be to you a God” ([[Ex. 6:7]]), and adds where it was leading.

      These words have been read as “the supernal reason given as to why the Israelites should have a tabernacle.”

      The verses before it say who makes the dwelling possible. After prescribing seven days of rites for Moses to perform, the LORD says “I will sanctify”: the tabernacle, the altar, and Aaron and his sons (verse 44), and He names the means, “by my glory” (verse 43). At the close of the book “the glory of the LORD filled the tabernacle” ([[Ex. 40:34]]), and when Aaron’s first offerings are made, “the glory of the LORD appeared unto all the people” ([[Lev. 9:23]]).

      The tabernacle as the LORD’s house is treated at [[Ex. 25:8]], and His glory at [[Ex. 24:16]].
    sources: [lds-scriptures, belnap-dwell-among, ot-minute-ex-25]

christ: |
  The sacrifices of this chapter belong to a law given from the beginning, in which offerings were made “in a similitude of the sacrifice that would be made of the Only Begotten Son of God.” Hebrews sets Christ beside the priesthood consecrated here and marks both the likeness and the difference.

  The likeness is in the calling. Aaron did not make himself a priest: “no man taketh this honour unto himself, but he that is called of God, as was Aaron. So also Christ glorified not himself to be made an high priest” ([[Heb. 5:4–5]]). The title Christ itself means “anointed” (see the note on verse 7).

  The difference is in the sacrifice. Aaron’s first offering is for his own sin, and his work is never finished. Christ “needeth not daily, as those high priests, to offer up sacrifice, first for his own sins, and then for the people’s: for this he did once, when he offered up himself” ([[Heb. 7:27]]). “Every priest standeth daily ministering and offering oftentimes the same sacrifices, which can never take away sins: But this man, after he had offered one sacrifice for sins for ever, sat down on the right hand of God” ([[Heb. 10:11–12]]). He suffered “without the gate,” as the sin offering was burned outside the camp (see the note on verse 14).

  The lamb, flour, oil, and wine of the daily offering have each been read as something that “strongly foreshadows the Savior,” whom John the Baptist calls “the Lamb of God, which taketh away the sin of the world” ([[John 1:29]]).

  The LORD who promises here to dwell among Israel is Jehovah (see [[Ex. 3:14]]). The promise has been set beside John’s words, “the Word was made flesh, and dwelt among us” ([[John 1:14]]), and the last vision of scripture speaks in the same words as this chapter’s last verses ([[Rev. 21:3]]). Both passages are set out in chapter 25 (see [[Ex. 25:8]]).

explore: |
  - **The rites carried out.** [[Lev. 8:1–36]], where Moses does what is commanded here, and [[Lev. 9:1–24]], Aaron’s first offerings and the fire from before the LORD.
  - **The command repeated.** [[Ex. 40:12–15]], when the tabernacle is to be set up.
  - **Christ the high priest.** [[Heb. 5:1–10]]; [[Heb. 7:23–28]]; [[Heb. 10:1–14]].
  - **A meal before God.** [[Ex. 24:9–11]], where the elders of Israel eat on the mountain when the covenant is made.
  - **The daily offering in Israel’s calendar.** [[Num. 28:1–8]].
  - **Washings and anointings in the Lord’s house.** [[D&C 124:37–40]].
  - **A study of the tabernacle’s rites.** “‘That I May Dwell among Them’: Liminality and Ritual in the Tabernacle” (Religious Studies Center, 2013) reads the rites of the tabernacle as the means by which God and Israel were brought together.

