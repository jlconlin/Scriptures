chapter: 4
title: Signs, a Spokesman, and the Road to Egypt
tagline: Moses fears that Israel will not believe him and that he cannot speak. The Lord gives him three signs, his brother Aaron, and a message for Pharaoh about a firstborn son, and the people believe.
when: 'Moses’s eightieth year, by 7:7: the end of the call at Horeb and the journey back to Egypt'

setting: |
  Chapter 4 opens in the middle of a conversation. Moses is still at the burning bush on Horeb, where he had led Jethro’s flock ([[Ex. 3:1]]), and his first words answer what the Lord has just told him to say to the elders of Israel. Stephen counts forty years since Moses fled Egypt ([[Acts 7:29–30]]). The men who wanted him dead have died (verse 19), and the people he is sent to have never seen him work a sign.

  The chapter then moves quickly: back to Jethro in Midian for leave to go (on Jethro, see [[Ex. 2:18]]), out onto the road with Zipporah and their sons, a stop at a lodging place where Moses nearly dies, a meeting with Aaron at “the mount of God,” and at last the elders of Israel in Egypt. Aaron, three years the elder ([[Ex. 7:7]]), appears here for the first time.

  Latter-day revelation places one more event in this interval: the vision recorded in Moses 1, which came after the call on Horeb and before Moses arrived in Egypt (see the note on [[Ex. 3:4]]). The Moses who reaches Pharaoh has therefore seen more than this chapter tells.

  Later scripture returns to the chapter at three points. Joseph in Egypt foresaw Moses’s rod and his spokesman ([[2 Ne. 3:17]]); a revelation to Oliver Cowdery compares Joseph Smith to Moses and Oliver to Aaron ([[D&C 28:2–3]]); and Hosea and Matthew speak of the son called out of Egypt ([[Hos. 11:1]]; [[Matt. 2:15]]).

thread: |
  The chapter begins with “they will not believe me” and ends with “the people believed.” Most of what lies between is what the Lord supplies to get from one to the other.

  Moses raises three difficulties, and none is brushed aside. *They will not believe that the LORD appeared to me:* he is given three signs, worked with a staff, his own hand, and water from the river (verses 1–9). *I cannot speak:* the Lord does not deny it. He answers that He made the mouth and will be with it (verses 10–12). Then Moses asks that the Lord send by whomever He will, which has been read as begging for someone else to go, and the Lord’s anger is kindled. Even then He provides: Aaron is already coming out to meet him (verses 13–17).

  On the road two things are said about sons. Moses is to tell Pharaoh that Israel is the Lord’s firstborn, and that Pharaoh’s firstborn is the price of refusing (verses 22–23). Then, at the lodging place, the Lord confronts Moses himself, and Zipporah circumcises their son (verses 24–26).

  The ending is quiet. Aaron speaks, the signs are done, and the people learn what the Lord had told Moses to tell them, that He had “visited” them ([[Ex. 3:16]]). They bow their heads and worship. The belief will be tested within a chapter ([[Ex. 5:20–23]]), but the fear Moses started with has been answered.

sections:
  - range: 1-9
    heading: Three signs for a people who may not believe
    plain: |
      Moses answered, “But they won’t believe me or listen to me. They will say, ‘The Lord did not appear to you.’” The Lord asked him, “What is that in your hand?” “A staff,” he said. “Throw it on the ground.” He threw it down and it became a snake, and Moses ran from it. Then the Lord said, “Reach out and take it by the tail.” He reached out and caught it, and it became a staff in his hand. “This is so that they will believe that the Lord, the God of their fathers, the God of Abraham, of Isaac, and of Jacob, has appeared to you.”

      The Lord went on: “Put your hand into your bosom.” He did, and when he took it out, it was leprous, like snow. “Put it back.” He did, and when he drew it out again it was restored like the rest of his flesh. “If they will not believe you or heed the first sign, they will believe the second. And if they believe neither sign and will not listen to you, take some water from the Nile and pour it on the dry ground. The water you take from the river will become blood on the ground.”
  - range: 10-17
    heading: “I am not eloquent”
    plain: |
      Moses said to the Lord, “O my Lord, I am not eloquent. I never have been, and I am not now that You have spoken to Your servant. I am slow of speech and slow of tongue.” The Lord said, “Who made man’s mouth? Who makes a person mute or deaf, seeing or blind? Is it not I, the Lord? Now go. I will be with your mouth and teach you what to say.” But Moses said, “O my Lord, please send by whomever You will send.”

      Then the Lord’s anger was kindled against Moses. He said, “Is there not your brother, Aaron the Levite? I know that he speaks well. Even now he is coming out to meet you, and when he sees you he will be glad in his heart. You will speak to him and put the words in his mouth. I will be with your mouth and with his, and I will teach you both what to do. He will speak for you to the people. He will be a mouth for you, and you will be as God to him. And take this staff in your hand; with it you will do the signs.”
  - range: 18-23
    heading: Leave from Jethro, and a message for Pharaoh
    plain: |
      Moses went back to Jethro his father-in-law and said, “Please let me go back to my brethren in Egypt and see whether they are still alive.” Jethro said, “Go in peace.” In Midian the Lord said to Moses, “Go, return to Egypt, for all the men who sought your life are dead.” So Moses took his wife and his sons, set them on a donkey, and started back to Egypt, with the rod of God in his hand.

      The Lord said to him, “When you go back to Egypt, see that you do before Pharaoh all the wonders I have put in your hand. But I will harden his heart, and he will not let the people go. Then say to Pharaoh, ‘This is what the Lord says: Israel is my son, my firstborn. I say to you, Let my son go so that he may serve me. If you refuse to let him go, I will slay your son, your firstborn.’”
  - range: 24-26
    heading: At the lodging place
    plain: |
      At the inn on the way, the Lord met him and sought to kill him. Zipporah took a sharp stone, cut off her son’s foreskin, and cast it at his feet. “Surely you are a bloody husband to me,” she said. So the Lord let him go. She said “a bloody husband” because of the circumcision.
  - range: 27-31
    heading: Aaron, the elders, and a people who believe
    plain: |
      The Lord said to Aaron, “Go into the wilderness to meet Moses.” He went, met him at the mount of God, and kissed him. Moses told Aaron everything the Lord had sent him to say and all the signs He had commanded. Then Moses and Aaron went and gathered all the elders of the children of Israel. Aaron spoke all the words the Lord had spoken to Moses and did the signs in the sight of the people. And the people believed. When they heard that the Lord had visited the children of Israel and had looked on their affliction, they bowed their heads and worshipped.

notes:
  - ref: 2
    phrase: 'A rod'
    kind: symbol
    title: 'The rod of God'
    body: |
      The rod is a shepherd’s staff, and from this verse on it is the instrument by which the Lord’s power is shown through Moses. Moses was keeping Jethro’s flock when he was called ([[Ex. 3:1]]), and what he has in his hand is the tool of that work.

      By verse 20 the narrator calls the same staff “the rod of God.” The Lord tells Moses to take it with him, “wherewith thou shalt do signs” (verse 17), and the rest of the book bears that out. It is lifted over the sea ([[Ex. 14:16]]); the Lord tells Moses to strike the rock in Horeb with “thy rod, wherewith thou smotest the river” ([[Ex. 17:5]]); and Moses stands on the hill “with the rod of God in mine hand” while Israel fights Amalek ([[Ex. 17:9]]).

      Joseph in Egypt had been told of it. In his prophecy, which Lehi rehearses to his own son Joseph, the Lord says, “I will raise up a Moses; and I will give power unto him in a rod” ([[2 Ne. 3:17]]).
    sources: [ot-minute-ex-1, lds-scriptures]
  - ref: 3
    phrase: 'it became a serpent'
    kind: symbol
    title: 'Why a serpent, a leprous hand, and blood'
    body: |
      The text gives the signs one purpose, “that they may believe” (verse 5), and does not interpret them one by one. What follows are readings of why these three would speak to people who lived in Egypt.

      **The serpent.** The crown of the pharaohs bore a cobra, the uraeus, which embodied a goddess “who was to protect the king and imbue him with divine power.” By turning a staff into a serpent and back again, one reading runs, God showed that He “was the source of Moses’s power and greater than the Egyptian gods.” Egyptian art also shows the god Horus, who was closely tied to the king, holding a snake by the tail, “which is not how snakes are typically handled,” and it has been proposed that Moses’s taking the serpent by the tail imitates those pictures.

      **The hand.** The second sign is worked on Moses’s own body: his hand turns leprous and is then restored. It has been read as a sign of “God’s ability to heal.”

      **The blood.** The third is held in reserve for those who will believe neither of the others, and it “appears to be a sign of God’s judgment upon people who would not follow His prophet.” The first plague will turn the river itself to blood ([[Ex. 7:17–20]]).

      Aaron does the signs before the people in verse 30. The serpent is shown again to Pharaoh, where his magicians answer it; what the snake meant in Pharaoh’s own court is at [[Ex. 7:11]].
    sources: [muhlestein-pharaoh, ot-minute-ex-1, lds-scriptures]
  - ref: 10
    phrase: 'slow of speech, and of a slow tongue'
    kind: words
    title: 'What Moses’s difficulty with speech was'
    body: |
      Where the King James Version has “slow,” the Hebrew says Moses was “heavy” of mouth and of tongue, and it does not say what made him so. Two explanations have been offered: that Moses “may have had a mild speech impediment,” or that after forty years among the Midianites his command of Hebrew and Egyptian was poor.

      What the passage does record is that the Lord never disputes the weakness. He answers, “Who hath made man’s mouth?”, and promises, “I will be with thy mouth” (verses 11–12).

      Restoration scripture adds that the weakness was foreknown and deliberately left in place. Joseph in Egypt heard the Lord say of Moses, “I will not loose his tongue, that he shall speak much, for I will not make him mighty in speaking” ([[2 Ne. 3:17]]), and in the same verse, “I will make a spokesman for him” ([[2 Ne. 3:17]]).
    sources: [oshb-wlc, bdb, ot-manual-ex-1-10, lds-scriptures]
  - ref: 16
    phrase: 'thou shalt be to him instead of God'
    kind: scripture
    title: 'Moses, Aaron, and the order of revelation'
    body: |
      Aaron is to stand to Moses as a prophet stands to God, speaking only what he is given. The Lord puts words in Moses’s mouth, Moses puts them in Aaron’s (verse 15), and Aaron speaks them to the people.

      The Lord states the arrangement again when the brothers are about to face Pharaoh: “I have made thee a god to Pharaoh: and Aaron thy brother shall be thy prophet” ([[Ex. 7:1]]). There the Joseph Smith Translation reads “prophet” in place of “god” and “spokesman” in place of “prophet,” which says in plain terms what the figure means.

      A revelation to Oliver Cowdery names the two brothers when it sets Oliver’s place beside Joseph Smith’s. No one is appointed to receive commandments and revelations for the Church except Joseph Smith, “for he receiveth them even as Moses” ([[D&C 28:2]]), and Oliver is to be obedient to what is given to Joseph, “even as Aaron, to declare faithfully the commandments and the revelations” ([[D&C 28:3]]). The revelation does not quote Exodus; the Church’s edition ties its “Aaron” to these verses by a cross-reference.
    sources: [lds-scriptures]
  - ref: 21
    phrase: 'I will harden his heart'
    kind: scripture
    title: 'Who hardened Pharaoh’s heart'
    body: |
      The Joseph Smith Translation answers the difficulty directly: it is Pharaoh who hardens his heart. As the King James Version reads, the Lord sends Moses to demand Israel’s release, says in the same breath that He will see the demand refused, and afterward judges Egypt for the refusal. The Prophet’s revision of this verse reads, “I will prosper thee; but Pharaoh will harden his heart, and he will not let the people go.” He revised each later passage of the kind in the same way, and the revisions “emphasize Pharaoh’s personal agency in resisting God’s will.”

      Exodus as it stands also says in places that Pharaoh hardened his own heart. “When Pharaoh saw that there was respite, he hardened his heart” ([[Ex. 8:15]]); “Pharaoh hardened his heart at this time also” ([[Ex. 8:32]]); and after the hail “he sinned yet more, and hardened his heart, he and his servants” ([[Ex. 9:34]]). One older count of the Hebrew text finds the hardening ascribed to the Lord ten times and to Pharaoh himself ten times. And before any sign was given, the Lord had told Moses what He knew of the man: “I am sure that the king of Egypt will not let you go” ([[Ex. 3:19]]).

      The Hebrew verb in this verse means to “be or grow firm, strong,” so that the clause is literally “I will make his heart firm, so that it will not move.”
    sources: [jst-ex-4, scripture-helps-ex-1, oshb-wlc, bdb, keil-exodus, lds-scriptures]
  - ref: 22
    phrase: 'Israel is my son, even my firstborn'
    kind: scripture
    title: 'Israel the firstborn, and Pharaoh’s firstborn'
    body: |
      The message Moses is given for Pharaoh on the way back to Egypt sets one firstborn son against another: release mine, or lose yours. The “son” here “represents all the people of Israel,” and “firstborn” is a word with legal weight. In the patriarchal order “the firstborn son is the heir,” and under the law of Moses he “was regarded as belonging to God.” The demand that follows is put in those terms: “Let my son go, that he may serve me.”

      Verse 23 also names the last plague before the first has been sent. If Pharaoh would not let Israel go, his own firstborn, and Egypt’s, would die, and so it happens at midnight on the night of the Passover ([[Ex. 12:29]]). Pharaoh is told the end at the beginning.

      Jeremiah keeps the title: “I am a father to Israel, and Ephraim is my firstborn” ([[Jer. 31:9]]). What the law does with Israel’s own firstborn after the deliverance is at [[Ex. 13:2]].

      [The Firstborn](/exodus/themes/the-firstborn/) follows the claim on the firstborn from Pharaoh's decree to the law of redemption, and from there to the Firstborn of God.
    sources: [ot-minute-ex-1, bd-firstborn, lds-scriptures]
  - ref: 24
    phrase: 'the LORD met him, and sought to kill him'
    kind: scripture
    title: 'Why the Lord sought to kill Moses'
    body: |
      The Joseph Smith Translation gives the reason the King James text leaves out: Moses had not circumcised his son. The three verses have been called “one of the most difficult in the Old Testament to decipher and understand because so much appears to be missing.” They do not say why the Lord seeks to kill him or which son is meant, and even “his feet” is unclear, since they “could belong to any male present.”

      The Prophet’s revision reads, “The Lord was angry with Moses, and his hand was about to fall upon him, to kill him; for he had not circumcised his son.” Zipporah circumcises the child, the Lord spares Moses because of what she did, and then comes a sentence with no counterpart in the King James text: “Moses was ashamed, and hid his face from the Lord, and said, I have sinned before the Lord.”

      Circumcision was the token of the covenant with Abraham, and of the male who lacked it the Lord had said, “he hath broken my covenant” ([[Gen. 17:14]]; see the note at [[Gen. 17:11]]). The Lord who was about to redeem Israel for that covenant’s sake expected Moses to keep his own part of it.

      The revision does not say why Moses had left it undone, and that silence “makes Zipporah’s quick and immediate action the significant act in the narrative.” She is the last in the line of women in these chapters who keep Moses alive. Some have also suggested that the blood of the son, which turns death away from Moses, foreshadows the blood that would shield Israel on the night of the Passover, a meal of which “no uncircumcised person shall eat” ([[Ex. 12:48]]). That is a suggestion, not something either text says. Neither text explains what Zipporah means by “a bloody husband.”

      By [[Ex. 18:2]] Zipporah is with her father again: Jethro brings her to Moses “after he had sent her back.”
    sources: [jst-ex-4, olson-matriarchs, ot-minute-ex-1, welch-saviors, lds-scriptures]

christ: |
  The LORD who speaks in this chapter is Jehovah (see [[Ex. 3:14]]), and He calls Israel here “my son, even my firstborn.” Hosea remembered the Exodus in the Lord’s own words, “called my son out of Egypt” ([[Hos. 11:1]]). Matthew says that line was fulfilled when the child Jesus was brought back from Egypt after Herod’s death: “Out of Egypt have I called my son” ([[Matt. 2:15]]).

  Jesus is “the firstborn of the spirit children of our Heavenly Father, the Only Begotten of the Father in the flesh,” and it is “through Jesus Christ” that the faithful receive “the inheritance of the firstborn.”

explore: |
  - **What Moses saw before he reached Egypt.** [[Moses 1:1–42]], set between the bush and the return.
  - **Joseph’s prophecy of Moses.** [[2 Ne. 3:9–17]]: the rod, the tongue not loosed, the spokesman.
  - **Others who said they could not speak.** Enoch ([[Moses 6:26–34]]); Jeremiah ([[Jer. 1:6–9]]); and Moroni on weakness ([[Ether 12:23–27]]).
  - **Paul on Pharaoh.** [[Rom. 9:17–18]] reasons from the Lord’s word to Pharaoh in [[Ex. 9:16]].
  - **Zipporah among the matriarchs.** “The Matriarchs: Administrators of God’s Covenantal Blessings” (BYU Religious Studies Center) reads her act beside those of Sarah, Hagar, Rebekah, Leah, Rachel and Tamar.

