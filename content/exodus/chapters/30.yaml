chapter: 30
title: Incense, Ransom, Water, and Oil
tagline: The LORD finishes the furnishing of His house with an altar for incense before the veil, a half shekel from every man numbered, a laver for the priests to wash at, and the recipes for the holy oil and the holy incense.
when: 'While Moses is on Mount Sinai forty days and forty nights (24:18), receiving the pattern of the tabernacle.'

setting: |
  Moses is on Mount Sinai, in the cloud, for forty days and forty nights ([[Ex. 24:18]]), and the LORD is still giving him the pattern of the tabernacle that began in chapter 25 (see [[Ex. 25:8]] and [[Ex. 25:9]] for the tabernacle as the LORD’s house and for “the pattern”). Chapters 25–27 described the ark, the table, the candlestick, the tent, the altar of burnt offering and the court. Chapters 28–29 turned to the priests: their clothing and their consecration. Chapter 30 gathers what the service of the house still lacks: an altar for incense, a payment of silver from every man who is numbered, a laver where the priests wash, and the recipes for the anointing oil and the incense.

  The chapter is five instructions. After the first, each opens with a new “the LORD spake unto Moses” or “the LORD said unto Moses” (verses 11, 17, 22, 34).

  Everything commanded here is reported as done before the book ends: the incense altar, the oil and the incense at [[Ex. 37:25–29]], the laver at [[Ex. 38:8]], the silver of the numbering at [[Ex. 38:25–28]], and the setting up and first use of the golden altar and the laver at [[Ex. 40:26–32]].

thread: |
  Two kinds of phrase run through the chapter and say what it is about. One is a promise, “where I will meet with thee,” said twice of the place before the veil where the incense burns (verses 6, 36). The other is a warning attached to coming near: “that there be no plague among them” (verse 12), “that they die not” (verses 20, 21), “shall even be cut off from his people” (verses 33, 38). The chapter is about what it takes for a people to meet a holy God and live.

  Each of the five instructions supplies something for that meeting. The incense rises twice a day before the veil, in line with the mercy seat. The half shekel is “a ransom” paid by every man counted, and it is called “atonement money.” The water stands between the altar and the tent, so that no priest goes to either unwashed. The oil is poured on the furniture and on the priests “that they may be most holy.” The incense is compounded by a recipe that may be used for nothing else.

  The chapter’s word for all of it is “holy.” The altar is “most holy unto the LORD,” the anointed furnishings are “most holy,” the oil is “holy, and it shall be holy unto you,” the incense is “most holy.” What is holy is fenced: no strange incense, no copy of the oil, none of it on anyone who is not a priest.

  One Latter-day Saint study reads the anointing as the LORD’s own part in the meeting: with oil that is His, “God did not just wait but prepared the space and items so that such interaction was possible” (see the note on verse 25).

sections:
  - range: 1-10
    heading: The altar of incense
    plain: |
      “Make an altar for burning incense, of acacia wood: a cubit long, a cubit wide and two cubits high, square, with its horns of one piece with it. Overlay its top, its sides and its horns with pure gold, and put a border of gold around it. Make two gold rings under the border, on its two sides, to hold the poles for carrying it, and make the poles of acacia wood overlaid with gold. Set it in front of the veil that is by the ark of the testimony, before the mercy seat that is over the testimony, where I will meet with you.

      “Aaron is to burn sweet incense on it every morning when he tends the lamps, and again when he lights the lamps in the evening: a perpetual incense before the LORD through your generations. Offer no strange incense on it, no burnt offering and no meal offering, and pour no drink offering on it. Once a year Aaron shall make atonement on its horns with the blood of the sin offering of atonement. It is most holy to the LORD.”
  - range: 11-16
    heading: The atonement money
    plain: |
      The LORD said to Moses, “When you take a census of the children of Israel, each man shall give the LORD a ransom for his soul as he is counted, so that no plague comes among them when you number them. Everyone who is numbered shall give half a shekel by the shekel of the sanctuary (a shekel is twenty gerahs) as an offering to the LORD. Everyone who is numbered, from twenty years old and up, shall give it. The rich shall not give more and the poor shall not give less than half a shekel when they give the LORD’s offering to make atonement for your souls. Take the atonement money from the children of Israel and appoint it for the service of the tent of meeting. It will be a memorial for the children of Israel before the LORD, to make atonement for your souls.”
  - range: 17-21
    heading: The laver
    plain: |
      The LORD said to Moses, “Make a laver of brass, with its base of brass, for washing. Put it between the tent of meeting and the altar, and put water in it. Aaron and his sons shall wash their hands and their feet at it. When they go into the tent of meeting they shall wash with water, so that they do not die; and so also when they come near the altar to minister, to burn an offering made by fire to the LORD. They shall wash their hands and their feet, so that they do not die. This is a statute for ever for Aaron and his descendants through their generations.”
  - range: 22-33
    heading: The holy anointing oil
    plain: |
      The LORD said to Moses, “Take the finest spices: five hundred shekels of pure myrrh, half as much (two hundred and fifty) of sweet cinnamon, two hundred and fifty of sweet calamus, and five hundred of cassia, by the shekel of the sanctuary, and a hin of olive oil. Make of these a holy anointing oil, blended as a perfumer blends.

      “Anoint with it the tent of meeting and the ark of the testimony, the table and all its utensils, the candlestick and its utensils, the altar of incense, the altar of burnt offering with all its utensils, and the laver and its base. Consecrate them, so that they are most holy; whatever touches them shall be holy. Anoint Aaron and his sons and consecrate them, to minister to me as priests.

      “Say to the children of Israel: This is my holy anointing oil through your generations. It shall not be poured on the body of anyone who is not a priest, and you shall make nothing else by its recipe. It is holy, and it shall be holy to you. Whoever compounds anything like it, or puts any of it on a stranger, shall be cut off from his people.”
  - range: 34-38
    heading: The holy incense
    plain: |
      The LORD said to Moses, “Take sweet spices, stacte, onycha and galbanum, with pure frankincense, an equal weight of each. Make of them an incense, blended as a perfumer blends, seasoned with salt, pure and holy. Beat some of it very fine and put it before the testimony in the tent of meeting, where I will meet with you. It shall be most holy to you. You shall not make any for yourselves by this recipe; it is holy to the LORD. Whoever makes anything like it, to enjoy its smell, shall be cut off from his people.”

notes:
  - ref: 1
    phrase: an altar to burn incense upon
    kind: history
    title: The golden altar before the veil
    body: |
      The altar of incense was a small gold-covered altar that stood inside the tent, in the Holy Place, directly in front of the veil. It was a cubit square and two cubits high (the cubit is explained at [[Ex. 25:10]]), built like the altar of burnt offering but smaller, and overlaid with gold. Later chapters call it “the golden altar” ([[Ex. 40:26]]). It stood in the middle of the room, with the candlestick on its south side and the table of shewbread on its north.

      Its work was different from that of the great altar in the court (see [[Ex. 27:1]]). Incense was burned on it morning and evening and no animal was sacrificed there; verse 9 forbids every other kind of offering.

      Verse 6 gives its position by what lies beyond the veil, not by what stands beside it: “before the mercy seat that is over the testimony, where I will meet with thee.” The veil hung between (see [[Ex. 26:31]]), but the altar was set in line with the mercy seat, the place of meeting named at [[Ex. 25:22]] (see [[Ex. 25:17]]).
    sources: [bd-tabernacle, lds-scriptures]

  - ref: 7
    phrase: burn thereon sweet incense every morning
    kind: scripture
    title: Incense and prayer
    body: |
      Scripture itself reads the rising smoke of incense as prayer. David asks, “Let my prayer be set forth before thee as incense; and the lifting up of my hands as the evening sacrifice” ([[Ps. 141:2]]). John sees the same thing in heaven: “golden vials full of odours, which are the prayers of saints” ([[Rev. 5:8]]), and an angel offering incense “with the prayers of all saints upon the golden altar which was before the throne” ([[Rev. 8:3]]).

      The offering was made when the lamps were tended (see [[Ex. 27:20]]), morning and evening, a timing that “would correlate with the daily morning and evening sacrifices” (see [[Ex. 29:38]]). In this chapter the duty is Aaron’s. In the second temple it passed to all the priests, and the one who would offer it was chosen each day by lot. The priest went into the Holy Place alone, cast the incense on coals brought from the altar of burnt offering, and then “returned to the congregation, who were praying outside.”

      That is the scene at the opening of Luke. Zacharias’s “lot was to burn incense when he went into the temple of the Lord,” and “the whole multitude of the people were praying without at the time of incense” ([[Luke 1:9–10]]). The angel who announced the birth of John appeared “standing on the right side of the altar of incense” ([[Luke 1:11]]).
    sources: [lds-scriptures, bd-incense, ot-minute-ex-25]

  - ref: 9
    phrase: strange incense
    kind: words
    title: Strange incense, and the stranger of verse 33
    body: |
      “Strange” here means unauthorized, not foreign or exotic. The Hebrew word is used for what is “strange to the law,” and the “strange incense” of this verse is classed with the “strange fire” of [[Lev. 10:1]]. One older reading defines it by the end of the chapter: strange incense is “incense which Jehovah had not appointed,” that is, any not made by the recipe of verses 34–38.

      The verse in Leviticus shows how seriously the rule was meant. Nadab and Abihu, sons of Aaron, put incense on fire in their censers and offered “strange fire,” “which he commanded them not,” and they died before the LORD ([[Lev. 10:1–2]]).

      The “stranger” of verse 33 is the same Hebrew word, and it carries the same sense. That verse is counted among the places where the word means a person outside the priestly family. To put the oil “upon a stranger” is to put it on anyone who is not a priest, Israelite or not (see also [[Ex. 29:33]]).
    sources: [bdb, oshb-wlc, keil-exodus, lds-scriptures]

  - ref: 10
    phrase: once in a year
    kind: scripture
    title: Blood on the horns of the incense altar
    body: |
      The yearly rite of this verse belongs to the Day of Atonement: “on its horns was put once a year, on the Day of Atonement, the blood of the sin offering.” Leviticus 16 gives the day, the tenth of the seventh month ([[Lev. 16:29]]), and the rite. On that day the high priest also carried incense within the veil, “that the cloud of the incense may cover the mercy seat that is upon the testimony, that he die not” ([[Lev. 16:13]]).

      The horns of this altar received blood at other times too. When a sin offering was made for the high priest or for the whole congregation, the priest was to “put some of the blood upon the horns of the altar of sweet incense” ([[Lev. 4:7]]; see also [[Lev. 4:18]]). So the altar where no animal was ever burned was still marked with the blood of the sacrifices offered outside.

      What the word “atonement” means, and the mercy seat as its place, is explained at [[Ex. 25:17]].
    sources: [bd-tabernacle, lds-scriptures, belnap-dwell-among]

  - ref: 12
    phrase: a ransom for his soul
    kind: history
    title: Why a census called for a ransom
    body: |
      Every man counted was to pay for his life, and the chapter does not say why being counted put it at risk. “Ransom” is the Hebrew *kopher*, “the price of a life,” the word used for the payment that redeems a forfeited life at [[Ex. 21:30]]. In this verse it is “a half shekel of the sanctuary paid by each male above twenty years at the census in order that there might be no plague upon them.”

      The reason is debated, and what follows are proposals. One Latter-day Saint study suggests that the ransom “possibly refers to the sin of worshipping the golden calf,” which the story reaches in chapter 32. A census of men “from twenty years old and upward” was a muster of “all that are able to go forth to war in Israel” ([[Num. 1:3]]), and one older reading holds that to be enrolled was to come near the holy God as a member of “the army of Jehovah,” which no one could do safely without a covering for his soul. Another points to David’s numbering of Israel, after which a pestilence killed seventy thousand ([[2 Sam. 24:15]]), and supposes a belief that a census was dangerous “whether because it was likely to give rise to feelings of self-satisfaction and pride, or because it tended to bring the sins and imperfections of individuals prominently before God’s notice.” David’s own words afterward were “I have sinned greatly in that I have done” ([[2 Sam. 24:10]]).

      That silver could “make an atonement” without blood is not unique to this law. After the war with Midian the officers brought gold to the tabernacle “to make an atonement for our souls” ([[Num. 31:50]]), and one Latter-day Saint study counts “the presentation of gold” among the recognized ways of making atonement in the law, beside sacrifice on the altar and the use of incense.
    sources: [bdb, lds-scriptures, ot-minute-ex-25, keil-exodus, cambridge-exodus, belnap-dwell-among]

  - ref: 15
    phrase: The rich shall not give more, and the poor shall not give less
    kind: history
    title: Half a shekel from every man alike
    body: |
      The ransom was a small, fixed weight of silver, and it was the same for every man. A shekel in Moses’s day was a weight and not a coin: “The Hebrews appear to have been ignorant of coinage until the Persian period,” and before then “payments were made by weight.” How heavy the early shekel was is uncertain. By the standard known from the second century B.C., 15.126 grams, half a shekel would be about seven and a half grams of silver. One older reading gives the reason for the flat rate: “all were equal in the sight of Jehovah.”

      Verse 16 assigns the silver to “the service of the tabernacle,” and the end of the book says what became of it. From 603,550 men (on the number, see [[Ex. 12:37]]) came a hundred talents and more, and of the hundred talents “were cast the sockets of the sanctuary, and the sockets of the veil” ([[Ex. 38:27]]). The bases on which the boards and the veil’s pillars stood were made of the ransom silver, so that, as one study puts it, the tabernacle “was built upon the foundation of the silver from the ransom price.”

      Later scripture knows payments like it. The Church’s footnotes to verses 13 and 16 point to two: King Joash called for “the collection that Moses the servant of God laid upon Israel in the wilderness” to repair the temple ([[2 Chr. 24:9]]), and Nehemiah’s generation bound themselves to a yearly “third part of a shekel for the service of the house of our God” ([[Neh. 10:32]]). In the Gospels the “tribute” asked of Peter at Capernaum ([[Matt. 17:24]]) is in Greek a *didrachmon*, a word some Bibles translate “half-shekel,” and one older reading holds that this yearly temple tax “is based ultimately on this passage.” Jesus asked Peter whether kings take tribute from their own children, and then had him pay it for them both ([[Matt. 17:25–27]]). Another older reading takes His question to mean that the “children of the kingdom,” for whom a perfect atonement would be made, no longer owed atonement money for their souls.
    sources: [bd-money, bd-weights-and-measures, lds-scriptures, ot-minute-ex-25, keil-exodus, cambridge-exodus]

  - ref: 18
    phrase: a laver of brass
    kind: history
    title: The laver, and why hands and feet
    body: |
      The laver was a basin of water in the court, where the priests washed their hands and feet before every service. It was “a vessel containing water for the priests to wash their hands and feet before offering sacrifice,” and it stood “between the altar of burnt offering and the door of the tent.” The chapter gives it no measurements and no shape, only its metal, its base and its place (on the metals, see [[Ex. 25:5]]; on what it was made from, [[Ex. 38:8]]).

      The washing was a rite and not housekeeping: it “was far more ritualistic in nature and not just for removing dirt from the hands.” Hands and feet were named because they “would be the most likely parts of the body to have touched or trod on impurity.” The water was a reminder to Israel that those who take part in sacred ordinances and come toward the LORD’s presence must be clean.

      The penalty is stated twice, “that they die not,” in the same words Leviticus uses of the high priest within the veil ([[Lev. 16:13]]). When the tabernacle was set up, “Moses and Aaron and his sons washed their hands and their feet thereat” ([[Ex. 40:31]]). This washing was repeated at each service. The washing of Aaron and his sons at their consecration, done once, is at [[Ex. 29:4]].
    sources: [bd-laver, bd-tabernacle, ot-minute-ex-25, scripture-helps-ex-35, lds-scriptures]

  - ref: 25
    phrase: an holy anointing oil
    kind: symbol
    title: Oil that makes holy
    body: |
      The anointing oil was olive oil scented with four spices, and it was reserved for setting apart the tabernacle, its furniture and its priests as holy. Verses 26–30 list what it touched: the tent, the ark, the table, the candlestick, both altars, the laver, and then Aaron and his sons. Verse 29 says what it did: “thou shalt sanctify them, that they may be most holy.”

      Anointing in itself was ordinary in that world, a courtesy shown to a guest and a part of everyday grooming. That is why this oil is fenced so closely. “Unlike other oil, the anointing oil was a scented oil, made according to a specific formula, to be used solely to sanctify the items within the tabernacle,” and the LORD calls it “an holy anointing oil unto me” (verse 31). No one might copy the recipe or use the oil on an ordinary person.

      Because the oil was “specifically designated as God’s own,” one Latter-day Saint study reads the anointing as His act and not Israel’s. The sacrifices that made atonement were repeated continually, but the anointing was done once, and at the dedication of the tabernacle it moved outward “from the Holy of Holies to the laver outside.” The reading is given more fully at [[Ex. 29:7]], with the anointing of the priests and the title “anointed” that comes from it. The anointing itself is carried out at [[Lev. 8:10–12]].
    sources: [bd-anoint, belnap-dwell-among, lds-scriptures]

  - ref: 34
    phrase: stacte, and onycha, and galbanum
    kind: words
    title: The spices of the incense
    body: |
      The three unfamiliar names are the King James translators’ borrowings from the Greek and Latin versions, and not all of them can be identified with certainty. Stacte translates a Hebrew word for “an odorific gum (gathered in drops),” and its “identification” is “dubious.” Onycha is usually taken to be “the operculum, or closing-flap, of certain molluscs,” which gives a strong smell when burned. Galbanum is “a kind of gum.” With pure frankincense they were mixed in equal weights.

      “Tempered together” in verse 35 is rendered differently in modern translations, and the plain-words version above follows them: “seasoned with salt.” The Hebrew participle means “salted.”

      Like the oil, the incense was made by a recipe reserved for the sanctuary. Verse 38 forbids making it “to smell thereto,” that is, for one’s own enjoyment. This is the incense that verse 9 requires on the golden altar, and any other is “strange incense” (see the note on verse 9).
    sources: [bdb, esv, lds-scriptures]

christ: |
  Hebrews sets the yearly rite of verse 10 beside the work of Christ. Israel’s high priest went within the veil “once every year, not without blood” ([[Heb. 9:7]]). Christ, “an high priest of good things to come” ([[Heb. 9:11]]), entered once, with His own blood ([[Heb. 9:12]]). The comparison is drawn out at [[Ex. 25:17]].

  The oil of verses 22–33 is the oil with which Aaron was anointed, and “Messiah” and “Christ” both mean “anointed.” What that title says of Jesus is at [[Ex. 29:7]].

  The New Testament uses the King James word of verse 12, “ransom,” of Him. The Son of Man came “to give his life a ransom for many” ([[Matt. 20:28]]); He “gave himself a ransom for all” ([[1 Tim. 2:6]]). One Latter-day Saint study reads the ransom silver under the tabernacle’s boards in that light: as the tent rested on those bases, so the way back to God’s presence rests on “the solid foundation of the ransom (redemption) made through Christ.”

explore: |
  - **Zacharias at the altar of incense.** [[Luke 1:5–23]]: the daily offering of this chapter, and the people praying outside, at the announcement of John’s birth.
  - **The Day of Atonement.** [[Lev. 16:1–34]], the yearly rite that verse 10 looks to, read in [[Heb. 9:1–14]].
  - **Aaron between the dead and the living.** [[Num. 16:46–48]]: Aaron takes a censer of incense into the camp and makes atonement, and a plague is stayed.
  - **David’s numbering.** [[2 Sam. 24:1–25]]; [[1 Chr. 21:1–30]]: a census, a pestilence, and an altar.
  - **The tribute money.** [[Matt. 17:24–27]].
  - **A study of the tabernacle’s rites.** “‘That I May Dwell among Them’: Liminality and Ritual in the Tabernacle” (Religious Studies Center, 2013) treats the rites of atonement and the rites of anointing as two kinds of act, with what each said about Israel and the LORD.

