alt: A shallow cave opens in a pale rock face on a mountain slope with a bare stone ledge before it; on a rounded hilltop beyond stands a waist-high altar of twelve rough stones with wood laid on top and a thin ditch of water around its foot; in the near left foreground, beside a bare shrub, the torn pieces of a cream wool garment with a red border lie in a heap on a flat rock, with two pieces apart on the ground; the sun sets at the left under an indigo-to-gold sky.
key:
  - '**The torn garment** is the new garment the prophet Ahijah “rent … in twelve pieces,” telling Jeroboam, “Take thee ten pieces: for thus saith the LORD … I will rend the kingdom out of the hand of Solomon, and will give ten tribes to thee” ([[1 Kgs. 11:30–31]]), because Solomon had “not kept my covenant” ([[1 Kgs. 11:11]]). The two pieces lying apart stand for what was left to David''s house: “he shall have one tribe for my servant David''s sake” ([[1 Kgs. 11:32]]; the note there explains why the pieces and the tribes don''t count out evenly).'
  - '**The altar of twelve stones** is the altar Elijah built on Mount Carmel: “Elijah took twelve stones, according to the number of the tribes of the sons of Jacob … and he made a trench about the altar” ([[1 Kgs. 18:31–32]]); he “put the wood in order,” and “the water ran round about the altar” ([[1 Kgs. 18:33]], [[1 Kgs. 18:35]]). In a kingdom torn in two, Elijah built one altar for all twelve tribes, where he had called the people to choose: “if the LORD be God, follow him” ([[1 Kgs. 18:21]]).'
  - '**The quiet cave** is the cave at Horeb where Elijah lodged ([[1 Kgs. 19:9]]): the wind, the earthquake and the fire came, “but the LORD was not in the fire: and after the fire a still small voice” ([[1 Kgs. 19:12]]), and Elijah “went out, and stood in the entering in of the cave” ([[1 Kgs. 19:13]]).'
