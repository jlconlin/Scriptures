summary: >-
  First Kings is the book of the house and the heart: a king who asks for an understanding
  heart and builds the house where the LORD puts His name, a heart that is turned away, and a
  kingdom torn in two. Against the gods of the north, Elijah calls Israel to stop halting
  between two opinions, and then, on Horeb, the LORD is not in the wind, the earthquake or
  the fire, and after them comes a still small voice. It points to Jesus Christ, whose
  voice the Book of Mormon calls “a still voice of perfect mildness” (Hel. 5:30).
motifs:
  - "Primary: on the lower slope of a bare mountain, the dark mouth of a shallow cave in a face of warm, pale rock, with a plain flat ledge of stone before it and its inside in soft shadow; nothing is moving anywhere near it (1 Kgs. 19:9, 11–13)."
  - "Supporting: in the middle distance on a rounded hilltop, a waist-high altar of twelve rough stones in three courses of four, with split wood laid on top and a narrow ditch of still water around its foot (1 Kgs. 18:31–35)."
  - "Supporting: in the near left foreground, beside a bare shrub, a new cream wool garment with a dark red border, torn into ragged pieces: most of them in a heap on a low flat rock, two lying apart on the ground (1 Kgs. 11:30–32)."
composition: >-
  A wide, calm landscape of dry mountain country with the sun low at the left of the horizon.
  The cave and its stone ledge sit at the right on the mountain's lower slope, the quietest
  place in the picture. Left of center on a rounded hilltop stands the altar of twelve stones
  with its wood and its ditch of water. In the near left foreground the torn garment lies on a
  flat rock and on the ground beside a bare shrub. The sky shades from deep indigo at the top to
  gold at the horizon. No figures, animals, fire, smoke, storm, buildings or other objects.
