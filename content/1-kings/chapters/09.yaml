chapter: 9
title: I Have Hallowed This House
tagline: The LORD appears to Solomon a second time, hallows the temple for His name, and sets the conditions on which house, throne and land will last; then the record of Solomon's dealings with Hiram, his levy and his buildings, his offerings at the altar, and his fleet to Ophir.
when: 'At the end of the twenty years in which Solomon built the temple and his own house (9:1, 10)'

setting: |
  Chapter 9 closes the account of building that began in chapter 5. The temple took seven years and Solomon's own house thirteen ([[1 Kgs. 6:38]]; [[1 Kgs. 7:1]]), and verse 10 counts the two together: “at the end of twenty years.” The chapter opens after the dedication of chapter 8, when the glory of the LORD had filled the house as a cloud and Solomon had prayed at the altar. The LORD now answers that prayer, appearing to Solomon as He had at Gibeon at the start of his reign ([[1 Kgs. 3:5]]).

  Chronicles tells the same answer and the same list of works ([[2 Chr. 7:11–8:18]]), sometimes with a detail Kings leaves out, and the notes below draw on both. The second half of the chapter is a set of brief notices: what Solomon gave Hiram, whom he set to work and what they built, how he worshipped at the altar he had made, and the fleet he sent down the Red Sea. The chapter heading sums them up as Solomon reigning “in splendor”; the warning that comes before them says on what terms the splendor would last.

thread: |
  The LORD's answer has two parts. Verses 4–5 speak to Solomon and take up the words of his own prayer for David's throne, “There shall not fail thee a man” ([[1 Kgs. 8:25]]): the throne will stand if Solomon walks as David walked. Verses 6–9 turn to Israel and its children: if they serve other gods, the house itself will not protect them, and passersby will ask why the LORD has done this to it (the note at verse 8).

  The notices that follow tell where Solomon's means came from: Hiram's cedar and gold (verses 10–14), the labor raised in the land (verses 15–25), and the gold of Ophir (verses 26–28). One older reading takes that as the reason they are gathered here, to show the resources behind so much building. When the condition is broken, the text remembers this chapter: the LORD was angry with Solomon because his heart was turned from the God “which had appeared unto him twice” ([[1 Kgs. 11:9]]).

sections:
  - range: 1-9
    heading: I Have Hallowed This House
    plain: |
      When Solomon had finished building the house of the LORD and the king's house, and everything he had set his heart on making, the LORD appeared to him a second time, as He had appeared to him at Gibeon. The LORD said to him: “I have heard your prayer and your plea that you made before Me. I have made holy this house that you built, to put My name there forever, and My eyes and My heart will be there always. As for you, if you walk before Me as your father David walked, with integrity of heart and uprightness, doing all I have commanded you and keeping My statutes and My judgments, then I will establish the throne of your kingdom over Israel forever, as I promised your father David when I said, ‘You will never lack a man on the throne of Israel.’ But if you or your children turn away from following Me and do not keep the commandments and statutes I have set before you, but go and serve other gods and worship them, then I will cut Israel off from the land I gave them, and this house that I have made holy for My name I will cast out of My sight, and Israel will become a proverb and a byword among all peoples. This house, high as it is, will astonish everyone who passes by, and they will hiss and ask, ‘Why has the LORD done this to this land and to this house?’ And the answer will be: ‘Because they forsook the LORD their God, who brought their fathers out of the land of Egypt, and took hold of other gods and worshipped and served them. That is why the LORD has brought all this disaster on them.’”
  - range: 10-14
    heading: What Cities Are These?
    plain: |
      At the end of the twenty years in which Solomon built the two houses, the house of the LORD and the king's house, King Solomon gave Hiram twenty cities in the land of Galilee, for Hiram king of Tyre had supplied Solomon with cedar and fir and with gold, as much as he wanted. But when Hiram came from Tyre to see the cities Solomon had given him, they did not please him. “What kind of cities are these you have given me, my brother?” he said. And he called them the land of Cabul, a name they still have. Hiram had sent the king a hundred and twenty talents of gold.
  - range: 15-25
    heading: The Reason of the Levy
    plain: |
      This is the account of the forced labor King Solomon raised: it was to build the house of the LORD and his own house, the Millo and the wall of Jerusalem, and Hazor, Megiddo and Gezer. (Pharaoh king of Egypt had come up and taken Gezer, burned it, and killed the Canaanites who lived in it, and had given it as a gift to his daughter, Solomon's wife.) So Solomon rebuilt Gezer, and Lower Beth-horon, Baalath, and Tadmor in the wilderness, and all his store cities, the cities for his chariots and for his horsemen, and whatever else he wished to build in Jerusalem, in Lebanon, and throughout the land he ruled. The people who were left of the Amorites, Hittites, Perizzites, Hivites and Jebusites, who were not Israelites, the descendants of those the Israelites had not been able to destroy, Solomon conscripted as a permanent labor force, as they are to this day. But Solomon made no Israelites into bondmen; they were his soldiers, his officials, his commanders and captains, and the officers over his chariots and horsemen. These were the chief officers over Solomon's work, five hundred and fifty of them, who supervised the people doing it. After Pharaoh's daughter had moved up from the city of David to the house Solomon had built for her, he built the Millo. Three times a year Solomon offered burnt offerings and peace offerings on the altar he had built to the LORD, and burned incense on the altar before the LORD. So he completed the house.
  - range: 26-28
    heading: A Navy of Ships
    plain: |
      King Solomon also built a fleet of ships at Ezion-geber, which is near Eloth on the shore of the Red Sea, in the land of Edom. Hiram sent his own men with the fleet, sailors who knew the sea, to serve with Solomon's men. They went to Ophir and brought back from there four hundred and twenty talents of gold, which they delivered to King Solomon.

notes:
  - ref: 3
    phrase: to put my name there for ever; and mine eyes and mine heart shall be there perpetually
    kind: prophets
    title: My name, mine eyes and mine heart
    body: |
      To put the LORD's name in the house is to give it His authority. Moses had promised a place the LORD would choose “to cause his name to dwell there” ([[Deut. 12:11]]), and from then on the temple is spoken of again and again as a house for the name of the LORD (5:5; 8:16–20, 29). These passages mean more than an inscription on the building: the Lord puts His name in a temple “because he gives authority for his name to be used in the sacred ordinances of that house.” Modern revelation speaks the same way, of houses built “unto my holy name,” and the Kirtland dedicatory prayer asks a blessing on “thy people upon whom thy name shall be put in this house” ([[D&C 109:26]]).

      The rest of the verse answers the prayer in its own terms. Solomon had asked “that thine eyes may be open toward this house night and day, even toward the place of which thou hast said, My name shall be there” ([[1 Kgs. 8:29]]). The LORD now says the name is there “for ever,” and His eyes and His heart with it, “perpetually.” What “for ever” means, when the next verses add an “if,” is the note at verse 6.
    sources: [oaks-name-1985, scripture-helps-2-samuel-11, lds-scriptures]

  - ref: 6
    phrase: But if ye shall at all turn from following me, ye or your children
    kind: history
    title: A house hallowed for ever, on a condition
    body: |
      The house was hallowed “for ever,” but the LORD's protection of it was conditional, and verse 6 states the condition. Verses 4–5 speak to Solomon alone (“thou”) and repeat the condition David had passed on to him for the throne ([[1 Kgs. 2:4]]), measured by David's walk; the Joseph Smith Translation's qualification of that measure is the note at [[1 Kgs. 3:14]]. Verse 6 turns to the plural, “ye or your children,” and the stakes become the land and the temple itself: if Israel serves other gods, the LORD will cut Israel off from the land and cast the hallowed house out of His sight.

      Later generations held on to the “for ever” and forgot the “if.” By Lehi's day many appear to have trusted that because the temple was the LORD's house He would naturally protect it, and to have misunderstood the covenant with David in the same way. Part of that covenant was indeed unconditional, the promise that David's throne would be established for ever ([[2 Sam. 7:16]]), and it was fulfilled in Jesus, the Messiah of David's line. But the LORD had made it clear through His prophets that His promises to protect the city and the temple depended on the people's obedience, and this verse is one of the places He said so (with [[1 Kgs. 6:12–13]]). Jeremiah's sermon at the temple gate warns against that trust: “Trust ye not in lying words, saying, The temple of the LORD” ([[Jer. 7:4]]).

      The warning came true in stages. The temple's decline began within a few years of Solomon's death, as worship scattered to the hilltops and the groves, until “Jehovah withdrew His protecting presence from the place no longer holy.” Babylon's army finally “burnt the house of the LORD” ([[2 Kgs. 25:9]]).
    sources: [sc-knowhy-451, ot-manual-kings-1, lds-scriptures]

  - ref: 8
    phrase: And at this house, which is high
    kind: words
    title: A house that is high
    body: |
      The Hebrew says the house is, or will be, “high” (*ʿelyôn*), and the phrase is hard: the standard lexicon marks its reading in this verse with a query. The Septuagint keeps it: “this house, which is high.” The New Revised Standard Version follows the Syriac and Old Latin instead and reads “This house will become a heap of ruins,” noting that the Hebrew has “will become high.”

      One older reading keeps the Hebrew and finds the point in it. The word is the one Moses used for Israel's blessing, that the LORD would set His people “high above all nations” if they obeyed ([[Deut. 26:19]]; [[Deut. 28:1]]). The temple stood on a high hill, where its ruins could not fail to be seen; it would stay high, but in the opposite sense, as an example of Israel's rejection for every passerby. On that reading the blessing turns into the curse with its own word. The same reading takes the passersby's question and answer that follow as the curse of the covenant in Deuteronomy, transferred from the land to the house: “Wherefore hath the LORD done thus unto this land?… Because they have forsaken the covenant of the LORD God of their fathers” ([[Deut. 29:24–25]]).
    sources: [oshb-wlc, lxx-rahlfs, nrsvue, bdb, keil-kings, lds-scriptures]

  - ref: 13
    phrase: he called them the land of Cabul
    kind: history
    title: The land of Cabul
    body: |
      Solomon paid Hiram with land, and Hiram did not think much of it. The twenty cities lay in Galilee (verse 11), and when Hiram saw them they did not please him. The name he gave the district carries his verdict: *Cabul* is glossed as displeasing or dirty, and a possible popular etymology is “as good as nothing”; there was also a town of that name in Asher ([[Josh. 19:27]]). One older reading takes “my brother” as the conventional address between kings and supposes the cities were inhabited chiefly by Canaanites and were in poor condition.

      Chronicles adds what Kings leaves out: Solomon rebuilt “the cities which Huram had restored to Solomon” and settled Israelites in them ([[2 Chr. 8:2]]). The same older reading takes these to be the twenty cities, given back, and the hundred and twenty talents of verse 14 as something Hiram “had sent,” a loan toward Solomon's many buildings, with the cities offered as security and the loan later repaid; Kings itself does not say what the gold was for.
    sources: [bdb, keil-kings, lds-scriptures]

  - ref: 15
    phrase: this is the reason of the levy which king Solomon raised
    kind: history
    title: What the levy built, and what it cost
    body: |
      Verse 15 turns back to the forced labor of chapter 5 and says what it was for. The “levy” (*mas*) is the labor gang raised from the people for public works that the note at [[1 Kgs. 5:13]] explains, with its men, its shifts and its later cost. Here the list goes beyond the temple and the palace to the defenses of Jerusalem (the Millo and the wall) and to strongholds across the land. Megiddo, one of them, stood on the caravan route from Egypt to Damascus. Store cities and cities for chariots and horsemen follow (verse 19).

      Verses 20–22 say who bore the heaviest share. The remnant of the Canaanite peoples Solomon made a “tribute of bondservice,” in Hebrew *mas ʿōbēd*, a toiling labor gang, while Israelites served as soldiers and officers. Even so, the works weighed on Israel itself: Solomon taxed the people heavily and used forced labor to complete them, and a deep resentment grew, especially in the northern tribes.
    sources: [bdb, bd-megiddo, ot-manual-kings-1, lds-scriptures]

  - ref: 24
    phrase: But Pharaoh’s daughter came up out of the city of David
    kind: scripture
    title: Pharaoh's daughter moves out of the city of David
    body: |
      Pharaoh's daughter moves out of the city of David when the works named at her marriage are finished. Solomon had “brought her into the city of David, until he had made an end of building his own house, and the house of the LORD, and the wall of Jerusalem round about” ([[1 Kgs. 3:1]]); now those works are done, and Kings records her move to the house he built for her (described at [[1 Kgs. 7:8]]). Verse 16 has already said what came with the marriage: Pharaoh had taken Gezer, burned it, and given it to his daughter. The marriage itself is the note at [[1 Kgs. 3:1]].

      Kings tells when she moved; Chronicles gives the reason, in Solomon's own words: “My wife shall not dwell in the house of David king of Israel, because the places are holy, whereunto the ark of the LORD hath come” ([[2 Chr. 8:11]]). The ark had rested in the city of David until it was carried up to the temple ([[1 Kgs. 8:1]]), and in Chronicles Solomon would not have a foreign wife living where it had been.
    sources: [lds-scriptures]

  - ref: 25
    phrase: three times in a year did Solomon offer
    kind: scripture
    title: Three times in a year
    body: |
      The three times are the three pilgrim feasts of the law. Chronicles names them: Solomon offered “according to the commandment of Moses… three times in the year, even in the feast of unleavened bread, and in the feast of weeks, and in the feast of tabernacles” ([[2 Chr. 8:13]]). The commandment is Moses' own: “Three times in a year shall all thy males appear before the LORD thy God in the place which he shall choose” ([[Deut. 16:16]]). With the house finished, the place the LORD had chosen existed, and the king kept the feasts at its altar.

      “So he finished the house” closes the long account of the temple that began with Solomon's letter to Hiram in chapter 5.
    sources: [lds-scriptures]

  - ref: 28
    phrase: they came to Ophir
    kind: history
    title: Gold from Ophir
    body: |
      No one knows for certain where Ophir was: a country from which gold was brought, “probably a port of southern Arabia.” The name first appears among the descendants of Joktan ([[Gen. 10:29]]). Job names the gold of Ophir as the measure of precious things ([[Job 28:16]]).

      The fleet sailed from Ezion-geber, “beside Eloth, on the shore of the Red sea, in the land of Edom” (verse 26), with sailors Hiram supplied (verse 27). The two accounts give different sums, 420 talents of gold in Kings and 450 in Chronicles ([[2 Chr. 8:18]]), and neither says whether its sum was one voyage's cargo or the whole return from the voyages. More gold from Ophir comes in the next chapter ([[1 Kgs. 10:11]]).
    sources: [bd-ophir, lds-scriptures]

christ: |
  The LORD who appeared to Solomon and hallowed the house is Jehovah, the premortal Jesus Christ, and the name He put there was His authority for the ordinances of the house (the note at verse 3). His temples today are houses built to that name. A disciple who partakes of the sacrament witnesses a willingness to receive those ordinances and “the highest blessings available through the name and by the authority of the Savior.”

explore: |
  - **The same answer in Chronicles.** [[2 Chr. 7:11–22]], with the promise “If my people, which are called by my name, shall humble themselves” ([[2 Chr. 7:14]]); then [[2 Chr. 8:1–18]].
  - **The condition broken.** [[1 Kgs. 11:9–13]]; [[2 Kgs. 25:8–9]].
  - **The temple as a false refuge.** Jeremiah's sermon at the gate, [[Jer. 7:1–15]], and the passersby of [[Jer. 22:8–9]].
  - **A hiss and a byword.** Nephi's prophecy of the Jews in [[1 Ne. 19:13–14]].
  - **A house for the Lord's name in this dispensation.** [[D&C 109:1–5, 24–26]].
  - **Solomon's temple on the site.** [The guide to temple and worship](/old-testament/guides/temple-and-worship/#temples).

