chapter: 15
title: His Heart Was Perfect with the LORD
tagline: Four kings in two kingdoms, each judged in a sentence; Asa of Judah walks with a whole heart, and in Israel Baasha's coup ends Jeroboam's house as Ahijah had said.
when: 'From the eighteenth year of Jeroboam: Abijam and Asa in Judah, Nadab and Baasha in Israel'

setting: |
  Chapter 14 closed with the deaths of Jeroboam in Israel and Rehoboam in Judah ([[1 Kgs. 14:20]], [[1 Kgs. 14:31]]). From here the writer tells the two kingdoms side by side, dating each king's accession by the year of the king reigning in the other (verses 1, 9, 25, 33); the *Two Kingdoms and Assyria* guide sets the kings and their dates side by side ([Rulers and events](/old-testament/guides/two-kingdoms-and-assyria/#rulers)).

  Asa, the third king of Judah, reigned forty-one years, and his reign fills most of the chapter. Chronicles tells it at much greater length ([[2 Chr. 14:1–16:14]]): his army and fortresses, a national covenant to seek Jehovah, and the prophets Azariah and Hanani, whom Kings does not name. Kings gives each king a verdict and leaves the rest to “the book of the chronicles” (verses 7, 23, 31; on that book see [[1 Kgs. 14:19]]).

thread: |
  The chapter is four verdicts, and they use two measures. A king of Judah is set beside David: Abijam's heart “was not perfect with the LORD his God, as the heart of David his father” (verse 3), and Asa “did that which was right in the eyes of the LORD, as did David his father” (verse 11). A king of Israel is set beside Jeroboam, the poor standard by which Israel's evil kings were measured afterward: Nadab and Baasha each “walked in the way” of Jeroboam “and in his sin wherewith he made Israel to sin” (verses 26, 34).

  Between the verdicts the chapter shows why the measure matters. Judah keeps David's line, a lamp in Jerusalem “for David's sake” (verse 4), and Asa's whole heart outlasts the high places he could not remove. Israel's first dynasty ends in its second reign, cut off by a usurper “according unto the saying of the LORD” (verse 29), and the usurper walks the same way at once (verse 34).

sections:
  - range: 1-8
    heading: Abijam of Judah
    plain: |
      In the eighteenth year of Jeroboam son of Nebat, Abijam became king of Judah. He reigned three years in Jerusalem; his mother was Maachah, daughter of Abishalom. He followed all the sins his father had committed before him, and his heart was not wholly true to the LORD his God, as his ancestor David's heart had been. Even so, for David's sake the LORD his God gave him a lamp in Jerusalem, raising up his son after him and keeping Jerusalem secure, because David had done what was right in the LORD's eyes and had not turned aside from anything the LORD commanded him all his life, except in the matter of Uriah the Hittite. There was war between Rehoboam and Jeroboam as long as he lived. The rest of Abijam's acts, all that he did, are written in the book of the chronicles of the kings of Judah; and there was war between Abijam and Jeroboam. Abijam died and was buried in the city of David, and his son Asa became king in his place.
  - range: 9-24
    heading: Asa of Judah
    plain: |
      In the twentieth year of Jeroboam king of Israel, Asa became king of Judah. He reigned forty-one years in Jerusalem; his mother was Maachah, daughter of Abishalom. Asa did what was right in the LORD's eyes, as his ancestor David had. He expelled the male shrine prostitutes from the land and removed all the idols his fathers had made. He even removed Maachah his mother from her position as queen mother, because she had made a horrid object for the goddess Asherah; Asa cut it down and burned it in the Kidron valley. The high places were not removed, but Asa's heart was wholly true to the LORD all his life. He brought into the LORD's house the silver, gold, and vessels that his father had dedicated and that he himself had dedicated.

      There was war between Asa and Baasha king of Israel throughout their reigns. Baasha marched against Judah and fortified Ramah, to stop anyone from going out to Asa king of Judah or coming in to him. So Asa took all the silver and gold that was left in the treasuries of the LORD's house and of the palace, gave it to his officials, and sent it to Ben-hadad son of Tabrimon, son of Hezion, king of Aram, who ruled in Damascus, with this message: “Let there be a treaty between you and me, as there was between my father and your father. I am sending you a gift of silver and gold. Break your treaty with Baasha king of Israel, so that he will withdraw from me.” Ben-hadad agreed. He sent his army commanders against the cities of Israel and struck Ijon, Dan, Abel-beth-maachah, all Cinneroth, and the whole land of Naphtali. When Baasha heard of it, he stopped fortifying Ramah and stayed in Tirzah. Then King Asa called up all Judah, with no one exempt, and they carried away the stones and timber Baasha had used at Ramah; with them King Asa fortified Geba of Benjamin and Mizpah. The rest of Asa's acts, his strength, all he did, and the cities he built are written in the book of the chronicles of the kings of Judah. But in his old age his feet became diseased. Asa died and was buried with his fathers in the city of his ancestor David, and his son Jehoshaphat became king in his place.
  - range: 25-34
    heading: Nadab and Baasha of Israel
    plain: |
      Nadab son of Jeroboam became king of Israel in the second year of Asa king of Judah, and he reigned over Israel two years. He did evil in the LORD's sight, following his father's way and the sin by which his father had led Israel to sin. Baasha son of Ahijah, of the tribe of Issachar, conspired against him and struck him down at Gibbethon, a Philistine town that Nadab and all Israel were besieging. Baasha killed Nadab in the third year of Asa king of Judah and became king in his place. As soon as he was king, he struck down the whole house of Jeroboam; he left Jeroboam no one alive until he had wiped them out, as the LORD had said through His servant Ahijah of Shiloh. This happened because of the sins Jeroboam committed and led Israel to commit, by which he provoked the LORD, the God of Israel, to anger. The rest of Nadab's acts, all that he did, are written in the book of the chronicles of the kings of Israel. There was war between Asa and Baasha king of Israel throughout their reigns. In the third year of Asa king of Judah, Baasha son of Ahijah became king over all Israel in Tirzah, and he reigned twenty-four years. He did evil in the LORD's sight, following the way of Jeroboam and the sin by which he had led Israel to sin.

notes:
  - ref: 3
    phrase: his heart was not perfect with the LORD his God, as the heart of David his father
    kind: history
    title: The measure of every king
    body: |
      Kings sums up each reign in a sentence, and the sentence compares. A king of Judah is held up to David, as Abijam is here and Asa is in verse 11. A king of Israel is held up to Jeroboam, whom the LORD had promised to be with if he kept the commandments; he led his people into idolatry instead, and the kings of Israel who did evil were afterward measured against the poor standard he set. So Nadab “walked in the way of his father” (verse 26), and Baasha, who destroyed Jeroboam's family, “walked in the way of Jeroboam” (verse 34). The wars, the buildings and the rest are left to the chronicles (verses 7, 23, 31); what the history records of a king is the way he walked.

      The same form turns up in the Book of Mormon. Mormon relies on the royal formula of walking or not walking “in the ways of” someone: Noah “did not walk in the ways of his father” ([[Mosiah 11:1]]), a verdict the rest of his story more or less fills out, and Moroni says of the Jaredite king Shez that “he did walk in the ways of the Lord” ([[Ether 10:2]]). On one Latter-day Saint reading, Mormon almost certainly had royal annals on the brass plates, material of the kind that became part of the biblical history, and adapted their conventions.

      The Joseph Smith Translation changes the comparison in this verse and in verse 11. Abijam's heart was not perfect “as the Lord commanded David his father,” and Asa did right “as he commanded David his father.” Why the revision qualifies David as a model throughout Kings is explained at [[1 Kgs. 3:14]]; verse 5's own change is the next note.
    sources: [scripture-helps-2-samuel-11, bowen-putting-down-priests, lds-scriptures, nyman-jst-historical]

  - ref: 5
    phrase: save only in the matter of Uriah the Hittite
    kind: scripture
    title: Save only in the matter of Uriah
    body: |
      Verse 5 is the reason Judah keeps its king: the lamp in Jerusalem (verse 4, explained at [[1 Kgs. 11:36]]) is given “for David's sake,” because David did right. The King James then makes a large claim, that David turned aside from nothing the LORD commanded “all the days of his life,” with one exception. The Joseph Smith Translation keeps the exception and rewrites the rest: “because David did right in the eyes of the Lord, and turned not aside from all that he commanded him, to sin against the Lord; but repented of the evil all the days of his life, save only in the matter of Uriah the Hittite, wherein the Lord cursed him.”

      The change brings the verse into line with latter-day revelation, which the Church's footnote sets beside it: David did not sin against the Lord “save in the case of Uriah and his wife; and, therefore he hath fallen from his exaltation” ([[D&C 132:39]]). It also fits the verse to the period of David's repentance. In the revision the David for whose sake the lamp is given is a man who repented of the evil, not one who did none.
    sources: [jsp-ot2, nyman-jst-historical, lds-scriptures]

  - ref: 12
    phrase: he took away the sodomites out of the land
    kind: words
    title: The sodomites
    body: |
      The “sodomites” are not people of Sodom. The Hebrew *qᵉdēšîm* is the plural of *qādēš*, a male temple prostitute. The Law forbade the office: “There shall be no whore of the daughters of Israel, nor a sodomite of the sons of Israel” ([[Deut. 23:17]]). The same class had appeared in Judah under Rehoboam ([[1 Kgs. 14:24]]), and Asa's expulsion was not complete: his son Jehoshaphat put away “the remnant of the sodomites, which remained in the days of his father Asa” ([[1 Kgs. 22:46]]), and Josiah would tear down their houses by the temple itself ([[2 Kgs. 23:7]]).

      The Joseph Smith Translation adds a verdict to the reform. After Asa “took away the Sodomites out of the Land, and remooved all the Idols that his fathers had made,” the manuscript adds, “and it pleased the Lord.”
    sources: [oshb-wlc, bdb, jsp-ot2, nyman-jst-historical]

  - ref: 13
    phrase: even her he removed from being queen
    kind: history
    title: Maachah the queen mother
    body: |
      Maachah held a title, and Asa took it from her. The word rendered “queen,” *gᵉbîrâ*, means here the queen mother: Asa “removed her from (the position of) queen-mother.” She was Abijam's mother (verse 2), and verse 10 gives Asa's mother the same name and father, so one older commentary reads her as Asa's grandmother. Either way, she still held the title under Asa until he took it from her.

      What she had made is called a *mipleṣet*, a “horrid thing (thing to shudder at),” some abominable object of idolatry whose form is “not precisely known.” It was made for Asherah, the goddess behind the King James “grove” (explained at [[1 Kgs. 14:15]]). Asa cut it down and burned it at the brook Kidron.
    sources: [oshb-wlc, bdb, keil-kings, lds-scriptures]

  - ref: 14
    phrase: Asa’s heart was perfect with the LORD all his days
    kind: words
    title: A heart perfect with the LORD
    body: |
      “Perfect” here means whole, or complete. A heart *šālēm* with the LORD is, in the standard lexicon's words, “a mind at peace with” Him, “keeping covt. relation, hence complete, perfect.” It is loyalty kept to the covenant, the phrase Solomon used when he prayed that Israel's heart be “perfect with the LORD our God” ([[1 Kgs. 8:61]]) and the one the writer used when Solomon's heart turned ([[1 Kgs. 11:4]]). Abijam lacked it (verse 3); Asa had it.

      It did not mean that Asa did everything required, and the verse says both halves at once: the high places stayed, “nevertheless” Asa's heart was whole (on the high places, see [[1 Kgs. 3:2]]). Chronicles says Asa took away the high places ([[2 Chr. 14:3]]) and also that they “were not taken away out of Israel” ([[2 Chr. 15:17]]). One older reading takes the high places of this verse as unlawful altars to the LORD rather than shrines to idols, and resolves the two statements by supposing that Asa abolished such altars but could not carry the reform through the whole nation.
    sources: [oshb-wlc, bdb, keil-kings, lds-scriptures]

  - ref: 19
    phrase: come and break thy league with Baasha king of Israel
    kind: scripture
    title: Break thy league with Baasha
    body: |
      Asa answered Baasha's blockade with a bribe, and Chronicles records the Lord's verdict on it. Ramah, in Benjamin on the border of Ephraim, stood on the frontier and on the road to Jerusalem; Baasha fortified it so that none could “go out or come in to Asa” (verse 17). Asa emptied what was left in the temple and palace treasuries and paid the king of Aram at Damascus to turn on Israel. It worked: Ben-hadad struck Israel's northern towns, Baasha left Ramah, and Asa used Baasha's own stones to fortify Geba and Mizpah (verses 20–22). Kings reports all this without comment.

      Chronicles does not. Hanani the seer came to Asa and said, “Because thou hast relied on the king of Syria, and not relied on the Lord thy God, therefore is the host of the king of Syria escaped out of thine hand” ([[2 Chr. 16:7]]), reminded him of the far larger army the LORD had delivered into his hand when he relied on Him ([[2 Chr. 16:8]]), and ended with the word of verse 14: “the eyes of the Lord run to and fro throughout the whole earth, to shew himself strong in the behalf of them whose heart is perfect toward him. Herein thou hast done foolishly: therefore from henceforth thou shalt have wars” ([[2 Chr. 16:9]]). Asa put the seer in prison ([[2 Chr. 16:10]]).
    sources: [bd-ramah, lds-scriptures]

  - ref: 23
    phrase: in the time of his old age he was diseased in his feet
    kind: scripture
    title: Diseased in his feet
    body: |
      Kings gives Asa's last illness in a clause; Chronicles gives its date and adds a charge. The disease came “in the thirty and ninth year of his reign,” two years before his death, and grew “exceeding great: yet in his disease he sought not to the Lord, but to the physicians” ([[2 Chr. 16:12]]).
    sources: [lds-scriptures]

  - ref: 29
    phrase: according unto the saying of the LORD, which he spake by his servant Ahijah the Shilonite
    kind: history
    title: According unto the saying of the LORD
    body: |
      Baasha's massacre of Jeroboam's family is told as the fulfillment of Ahijah's word to Jeroboam's wife ([[1 Kgs. 14:10–11]]), and verse 30 repeats the reason Ahijah gave: the sins of Jeroboam, by which he made Israel sin. The man who fulfilled it walked in Jeroboam's way himself: Baasha walked in Jeroboam's way (verse 34), and the next chapter's word against him names, among his sins, his “being like the house of Jeroboam; and because he killed him” ([[1 Kgs. 16:7]]).

      Nadab's end is the first of its kind in the north, and Baasha's house will end the same way ([[1 Kgs. 16:11–12]]). One Latter-day Saint study explains the difference between the kingdoms by their foundations. David's dynasty rested on an unconditional promise ([[2 Sam. 7:16]]), and no prophet in Judah announced that it would fall. Israel was founded on conditional covenants, through a prophet's word (Ahijah's) and a judge-like military leader (Jeroboam), so a prophet could name a dynasty's end. Of Israel's nineteen kings, five had such prophecies spoken against them; eight were murdered in coups, and only seven died of natural causes.
    sources: [lds-scriptures, halverson-fall-of-israel]

christ: |
  Hanani's rebuke (the note on verse 19) names what the chapter's verdicts measure: the Lord shows Himself strong for those “whose heart is perfect toward him” ([[2 Chr. 16:9]]). The LORD who looks for that whole heart is the Lord who came to the Kirtland Temple saying, “I am he who liveth, I am he who was slain; I am your advocate with the Father” ([[D&C 110:4]]), and in the Joseph Smith Translation the king He made the measure of Judah's kings is a man who “repented of the evil all the days of his life” (JST 1 Kgs. 15:5).

  For a disciple the whole heart Hanani described is kept the same way, by relying on the Lord rather than on other help, the choice Nephi made: “I will not put my trust in the arm of flesh” ([[2 Ne. 4:34]]).

explore: |
  - **Asa in Chronicles.** [[2 Chr. 14:1–16:14]], with Azariah's prophecy and the covenant to seek the LORD ([[2 Chr. 15:1–15]]) and Hanani's rebuke.
  - **The word against Jeroboam's house.** [[1 Kgs. 14:7–16]], then the same word against Baasha's in [[1 Kgs. 16:1–4]].
  - **David as the measure.** [[1 Kgs. 3:14]] and [[1 Kgs. 11:4]], where the Joseph Smith Translation first qualifies the comparison.

