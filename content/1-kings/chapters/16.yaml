chapter: 16
title: Worse than All That Were Before Him
tagline: Five kings of Israel in thirty-four verses. The word against Baasha comes true by an assassin's hand, the army makes Omri king and he builds Samaria, and Ahab marries Jezebel and brings Baal into Israel.
when: 'From the twenty-sixth to the thirty-eighth year of Asa king of Judah (verses 8, 29)'

setting: |
  Chapter 15 left Baasha on the throne of the northern kingdom. He had killed Nadab, Jeroboam's son, and wiped out Jeroboam's house, “according unto the saying of the LORD” ([[1 Kgs. 15:27–29]]). Chapter 16 tells the end of Baasha's house and then four more reigns. The Church's chapter heading sums them up: “Elah, Zimri, Omri, and Ahab reign in wickedness.” All this time Asa reigned in Judah, and the text dates each northern king by Asa's years. The capital moves from Tirzah to Samaria, the city Omri built.

  Over some two hundred years the north would have nineteen kings, and it “soon went into apostasy and adopted many practices of Baalism, notwithstanding the ministries of such great prophets as Elijah and Amos.” The last verses of this chapter tell how Baal came in: Ahab married Jezebel. The next verse in the book is Elijah's first ([[1 Kgs. 17:1]]).

  For the formula that opens and closes each reign, and for “the book of the chronicles of the kings of Israel” (verses 5, 14, 20, 27), see the notes on [[1 Kgs. 15:3]] and [[1 Kgs. 14:19]].

thread: |
  The chapter measures every king by one standard and finds each one walking “in the way of Jeroboam” (verses 2, 19, 26, 31). It also ties events to the word spoken before them. Jehu prophesies against Baasha in verses 1–4, and Zimri carries the sentence out “according to the word of the LORD” (verse 12). The chapter's last verse fulfils a word Joshua spoke when Jericho fell (verse 34). Carrying out the word does not excuse the one who does it, though: Baasha is condemned for the very killing that fulfilled Ahijah's prophecy (verse 7).

  The chapter also runs downhill. Omri “did worse than all that were before him” (verse 25), and Ahab did evil “above all that were before him” (verse 30). Ahab's accession was a turning point for the worse, though Omri had prepared the way. Jeroboam's calves had come to look like a “light thing” beside what Ahab did: he married a Phoenician princess and built a temple to Baal in his own capital, the step that set the north on the road to its fall. With Baal established in Samaria, the book turns to the prophet who would confront him.

sections:
  - range: 1-7
    heading: The word against Baasha
    plain: |
      The word of the LORD came to the prophet Jehu son of Hanani against Baasha: “I lifted you out of the dust and made you ruler over My people Israel. But you have walked in the way of Jeroboam and made My people Israel sin, provoking Me to anger with their sins. So I am going to sweep away Baasha and his house, and make your house like the house of Jeroboam son of Nebat. Anyone of Baasha's who dies in the city, the dogs will eat; anyone of his who dies in the open country, the birds will eat.” The rest of Baasha's deeds and his strength are written in the book of the chronicles of the kings of Israel. Baasha died and was buried in Tirzah, and his son Elah became king. So the LORD's word came through Jehu against Baasha and his house for all the evil he did in the LORD's sight, provoking Him with what his hands had made, by being like the house of Jeroboam, and also because he had struck that house down.
  - range: 8-14
    heading: Elah and Zimri
    plain: |
      In the twenty-sixth year of Asa king of Judah, Elah son of Baasha became king over Israel in Tirzah, and he reigned two years. His officer Zimri, commander of half his chariots, plotted against him. While Elah was in Tirzah getting drunk in the house of Arza, the steward of his palace, Zimri came in, struck him down and killed him, in Asa's twenty-seventh year, and took his place. As soon as he sat on the throne he killed the whole house of Baasha, leaving him not one male, whether relative or friend. So Zimri destroyed Baasha's house, as the LORD had said through the prophet Jehu, because of all the sins of Baasha and of Elah his son, the sins they committed and made Israel commit, provoking the LORD God of Israel with their worthless idols. The rest of Elah's deeds are written in the book of the chronicles of the kings of Israel.
  - range: 15-22
    heading: Seven days, and a divided people
    plain: |
      In Asa's twenty-seventh year Zimri reigned seven days in Tirzah. The army was then besieging Gibbethon, a Philistine town. When the troops in the camp heard that Zimri had plotted and killed the king, all Israel made Omri, the army's commander, king over Israel that same day in the camp. Omri and all Israel with him marched up from Gibbethon and besieged Tirzah. When Zimri saw that the city was taken, he went into the citadel of the palace, set the palace on fire over himself, and died. He died for his sins: he did evil in the LORD's sight, walked in the way of Jeroboam, and made Israel sin as Jeroboam did. The rest of Zimri's deeds, and his treason, are written in the book of the chronicles of the kings of Israel. Then the people of Israel split in two. Half followed Tibni son of Ginath to make him king, and half followed Omri. Omri's side overpowered Tibni's; Tibni died, and Omri became king.
  - range: 23-28
    heading: Omri and Samaria
    plain: |
      In the thirty-first year of Asa king of Judah, Omri became king over Israel, and he reigned twelve years, six of them in Tirzah. He bought the hill of Samaria from Shemer for two talents of silver, built a city on it, and named the city Samaria after Shemer, the hill's owner. But Omri did evil in the LORD's sight, worse than all who came before him. He walked in all the way of Jeroboam son of Nebat and in the sin by which Jeroboam made Israel sin, provoking the LORD God of Israel with their worthless idols. The rest of Omri's deeds, and the strength he showed, are written in the book of the chronicles of the kings of Israel. Omri died and was buried in Samaria, and his son Ahab became king.
  - range: 29-34
    heading: Ahab, Jezebel, and Baal
    plain: |
      In the thirty-eighth year of Asa king of Judah, Ahab son of Omri became king over Israel, and he reigned over Israel in Samaria twenty-two years. Ahab did more evil in the LORD's sight than all who came before him. As if walking in the sins of Jeroboam were a small thing, he married Jezebel, daughter of Ethbaal king of the Sidonians, and went and served Baal and bowed down to him. He set up an altar to Baal in the temple of Baal that he built in Samaria. Ahab also made an Asherah, and did more to provoke the LORD God of Israel to anger than all the kings of Israel before him. In his days Hiel of Bethel rebuilt Jericho. He laid its foundation with Abiram his firstborn, and set up its gates with Segub his youngest, as the LORD had said through Joshua son of Nun.

notes:
  - ref: 1
    phrase: Jehu the son of Hanani
    kind: history
    title: Jehu the son of Hanani
    body: |
      This Jehu is a prophet, and not the Jehu who later becomes king of Israel. That Jehu was “the son of Jehoshaphat the son of Nimshi” ([[2 Kgs. 9:2]]), anointed to end Ahab's house. The prophet Jehu's father, “Hanani the seer,” rebuked Asa of Judah for relying on the king of Syria rather than on the LORD ([[2 Chr. 16:7]]), the same alliance Asa made against Baasha ([[1 Kgs. 15:18–20]]). Jehu himself later met Jehoshaphat of Judah with a rebuke for allying with Ahab: “Shouldest thou help the ungodly, and love them that hate the Lord?” ([[2 Chr. 19:2]]). He also wrote: Jehoshaphat's acts were “written in the book of Jehu the son of Hanani” ([[2 Chr. 20:34]]).

      So the man who pronounces Baasha's doom spoke to kings in both kingdoms. In this chapter his word comes first and the event follows. Verses 1–4 give the sentence, and verse 12 records it carried out “according to the word of the LORD, which he spake against Baasha by Jehu the prophet.”
    sources: [lds-scriptures]

  - ref: 2
    phrase: I exalted thee out of the dust
    kind: symbol
    title: Out of the dust and back again
    body: |
      Lifting a king “out of the dust” is the language of enthronement, and the threat in verse 3 is that language run backward. On one reading the line is a “royal formula of enthronement” that draws on the sentence on Adam, “dust thou art, and unto dust shalt thou return” ([[Gen. 3:19]]). To be taken from the dust was to be raised from obscurity to the throne and accepted as a covenant partner of God; to return to the dust was to lose the office and the covenant with it: “to be ‘from dust’ is to enter covenant and to return ‘to dust’ is to have the covenant voided.”

      Read that way, verses 2–3 hold both halves of the formula. The LORD names what He gave (“exalted thee … made thee prince over my people Israel”), names the breach (“thou hast walked in the way of Jeroboam”), and pronounces the loss: Baasha's posterity will be taken away. The Book of Mormon also uses the image, as when Lehi pleads with his sons to “arise from the dust” ([[2 Ne. 1:23]]).
    sources: [sc-knowhy-715]

  - ref: 4
    phrase: Him that dieth of Baasha in the city shall the dogs eat
    kind: symbol
    title: No grave for Baasha's house
    body: |
      The sentence means that Baasha's family would die without burial, and it is the same sentence, nearly word for word, that Ahijah spoke against Jeroboam's house ([[1 Kgs. 14:11]]). Verse 3 has just said it: “I will … make thy house like the house of Jeroboam.” The same words will be spoken against Ahab's house ([[1 Kgs. 21:24]]), and the LORD later names both earlier houses as the pattern for Ahab's ([[2 Kgs. 9:9]]).

      To lie unburied, food for dogs and birds, was more than a grim end. Many ancient peoples saw it as “a disgrace and an indication of divine judgment,” a judgment thought to follow a person into the afterlife, where identity was bound to the tomb. Baasha himself was buried in Tirzah (verse 6); the threat falls on “him that dieth of Baasha,” his house. By modern revelation a lack of burial does the departed spirit no harm, and the fate of the unburied Jaredites is read instead as a picture of total annihilation, “physically, generationally, and spiritually.”
    sources: [sc-knowhy-586]

  - ref: 7
    phrase: and because he killed him
    kind: history
    title: Condemned for doing what was foretold
    body: |
      Verse 7 adds a reason that seems to clash with what came before: Baasha is condemned not only for walking in Jeroboam's way but also because he struck down Jeroboam's house. Yet Ahijah had foretold that the LORD would “raise him up a king over Israel, who shall cut off the house of Jeroboam” ([[1 Kgs. 14:14]]), and Baasha did it “according unto the saying of the LORD” ([[1 Kgs. 15:29]]). One older reading takes verse 7 as written to block exactly that inference: because the LORD says “I … made thee prince” (verse 2), a reader might suppose Baasha killed Nadab's house at God's command. The prophecy gave Baasha no right to make himself its fulfiller. That he went on with Jeroboam's sin shows he acted for his own ends and not under divine direction. Another older comment on verse 2 reads “I … made thee prince” in the same spirit: Scripture often speaks of God as doing “those things which, in the course of his providence, he permits to be done.”

      Zimri raises the same question at verse 12, where he destroys Baasha's house “according to the word of the LORD.” It need not be supposed that Zimri was ordained to the deed, for “prophets can prophesy what men will bring upon themselves without necessitating the Lord’s predestining and controlling them to make it so.” The same older commentary reads Jehu's bloodshed at Jezreel in the same way (see the note on [[Hos. 1:4]]).
    sources: [keil-kings, ot-manual-4, keil-hosea, lds-scriptures]

  - ref: 21
    phrase: Then were the people of Israel divided into two parts
    kind: history
    title: Why the north had so many coups
    body: |
      This chapter is the northern kingdom's instability in small. Within it one king is murdered by his own chariot commander (verses 9–10), a usurper lasts seven days and dies in the burning palace (verses 15–18), the army proclaims its general king in the field (verse 16), and the nation splits between two claimants until one of them dies (verses 21–22). Later Jezebel greets Jehu, an army captain who had just killed his king, with “Had Zimri peace, who slew his master?” ([[2 Kgs. 9:31]]).

      Why the north fared so differently from Judah is taken up in the note on [[1 Kgs. 15:29]]. On one Latter-day Saint proposal, Jeroboam's promise was conditional where David's was not ([[1 Kgs. 11:38]]), so prophets in the north could announce a dynasty's overthrow, as Jehu does to Baasha in verses 1–4, and the throne never settled.
    sources: [halverson-fall-of-israel, lds-scriptures]

  - ref: 24
    phrase: he bought the hill Samaria of Shemer for two talents of silver
    kind: history
    title: Omri, more than six verses
    body: |
      The one act of Omri's that Kings records beyond his rise to power is the founding of Samaria. He bought the hill, built on it, and named the city after Shemer, its first owner. The site was strong: the Assyrians could take it only after a siege of three years ([[2 Kgs. 17:5–6]]). Samaria stayed the capital of the ten tribes until they were carried away captive, and by New Testament times the whole central district of the land took its name.

      Omri founded a strong dynasty, and he mattered more than his six verses suggest. Writers outside the Bible say more about his reign than the Bible does. The inscription of Mesha, king of Moab, admits that Omri conquered Moab and took tribute from it, and that Assyrian annals called Israel “land of the house of Omri” and its kings “sons of Omri” even after his dynasty had been replaced. Omri also made the alliance with Ethbaal that brought Jezebel to his son (verse 31).

      Of his religion Kings gives only its verdict: Omri “did worse than all that were before him” (verse 25). Micah would later charge that “the statutes of Omri are kept” ([[Micah 6:16]]; see the note there).
    sources: [bd-samaria, bd-omri, ot-manual-4, keil-kings, lds-scriptures]

  - ref: 31
    phrase: as if it had been a light thing for him to walk in the sins of Jeroboam the son of Nebat
    kind: history
    title: Worse than Jeroboam
    body: |
      “The sins of Jeroboam” were worship meant for Israel's own God; Ahab added the worship of another god. What Jeroboam's calves at Dan and Bethel were meant to be is not certain; one reading holds they were “supposed to be images of Jehovah” (see the note on [[1 Kgs. 12:28]]), and every northern king so far had been charged with walking in Jeroboam's way ([[1 Kgs. 15:26]], 34; verses 13, 19, 26). Ahab went further: he “went and served Baal, and worshipped him,” built a house of Baal in his capital with an altar in it (verse 32), and made an Asherah, the image the King James calls a “grove” (verse 33; see the note on [[1 Kgs. 14:15]]). Under Ahab the worship of Baal and Asherah was established in Israel, and an attempt was made to wipe out the prophets of the LORD and His worship ([[1 Kgs. 18:13]]).

      That is the sense of “as if it had been a light thing.” Beside open service to Baal, the sin that had defined every reign since the kingdom divided looks small. The verdicts climb accordingly: Ahab did evil “above all that were before him” (verse 30) and “did more to provoke the LORD God of Israel to anger than all the kings of Israel that were before him” (verse 33).
    sources: [bd-jeroboam, bd-ahab, lds-scriptures]

  - ref: 31
    phrase: he took to wife Jezebel the daughter of Ethbaal king of the Zidonians
    kind: history
    title: Jezebel
    body: |
      Jezebel was a Phoenician princess, and her marriage to Ahab is the hinge of the northern kingdom's history. It, “more than any other single event, caused the downfall of the northern kingdom,” because she brought into Israel the worst forms of Phoenician worship in place of the worship of Jehovah. The book will show what she did with her power: she cut off the prophets of the LORD ([[1 Kgs. 18:4]]), swore to kill Elijah ([[1 Kgs. 19:2]]), and contrived Naboth's death ([[1 Kgs. 21]]).

      Her god sets up what comes next. “Baal was the Canaanite storm god, associated with lightning and rain,” and the next verse of the book is Elijah's oath that there would be neither dew nor rain but by his word ([[1 Kgs. 17:1]]); what the drought and the fire on Carmel show about Jehovah and Baal is told at [[1 Kgs. 18:38]].
    sources: [bd-jezebel, scripture-helps-1-kings]

  - ref: 34
    phrase: In his days did Hiel the Beth-elite build Jericho
    kind: scripture
    title: Joshua's word kept
    body: |
      The chapter ends with a word of the LORD fulfilled long after it was spoken. When Jericho fell, Joshua swore that whoever rebuilt it would lay its foundation in his firstborn and set up its gates in his youngest son ([[Josh. 6:26]]); the note there explains the oath and what “build” meant, restoring the city's fortifications. Kings records the price “according to the word of the LORD, which he spake by Joshua.”

      Why tell it here, at the end of Ahab's introduction? One older reading answers that the rebuilding is set down as a proof of how far ungodliness had progressed in Israel, and the curse's fulfilment shows that the LORD will not let His servants' word be broken with impunity. The verse closes with the words that closed verse 12, “according to the word of the LORD, which he spake by,” a prophet: in Ahab's days a man defied an ancient curse, and the word still held.

      The text does not say what became of Hiel's sons. One older commentator set out three answers: the sons died one after another by the judgment of God while the work went on; the phrase is a proverb for a building that took a man's whole life; or Hiel offered them as foundation sacrifices, as the old Chaldee version represents him slaying them. Of the ancient versions, only that one says the sons were slain or died. Scripture leaves it at the price paid.
    sources: [keil-kings, ot-manual-4, lds-scriptures]

christ: |
  The LORD lifted Baasha “out of the dust” to be prince over His people (verse 2), and that phrase belongs to a wider scriptural language in which being raised from the dust stands for enthronement, exaltation and resurrection, tied to a covenant with God. Baasha held what he was given only until he walked in Jeroboam's way, and lost it for his house (verses 2–3). King Benjamin's people show the covenant side of the same language: they saw themselves as “less than the dust of the earth” ([[Mosiah 4:2]]), and were told that by their covenant they would “be called the children of Christ, his sons, and his daughters” ([[Mosiah 5:7]]). All God's children can make and keep covenants with Him, and so every disciple who stays true to the covenants made at baptism and in the temple arises from the dust, receiving the grace God offers those who come unto Christ.

explore: |
  - **The end of Ahab's house.** [[2 Kgs. 9:6–10]], where the LORD promises to make Ahab's house “like the house of Jeroboam … and like the house of Baasha,” and [[2 Kgs. 9:30–37]].
  - **Elijah.** [[1 Kgs. 17:1]] begins the answer to Ahab's Baal.
  - **Hanani and Jehu in Chronicles.** [[2 Chr. 16:7–10]] and [[2 Chr. 19:1–3]].

