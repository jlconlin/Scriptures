chapter: 5
title: Cedar Trees out of Lebanon
tagline: Hiram of Tyre sends to the new king; Solomon asks him for the cedars of Lebanon to build the house David could not, the two kings make a covenant, and Israel's men are raised to cut the timber and quarry the stone.
when: 'Early in Solomon''s reign, before the temple was begun in his fourth year'

setting: |
  Chapter 4 ended with Solomon at the height of his peace: he “had peace on all sides round about him,” and Judah and Israel dwelt safely, “every man under his vine and under his fig tree” ([[1 Kgs. 4:24–25]]). Chapter 5 turns that peace to the work David had been told his son would do. It opens the long account of the temple (chapters 5–8), and everything in it is preparation: the timber, the stone, the workers, and the treaty that supplied them. The building itself begins in the next chapter, “in the fourth year of Solomon's reign” ([[1 Kgs. 6:1]]), so these arrangements belong to the first years of the reign. David had spent much of his own effort gathering materials for the house, and when Solomon came to the throne it was among the first things he turned to.

  Chronicles tells the same negotiation at greater length ([[2 Chr. 2:1–18]]). There Solomon's letter names the worship the house was for, incense, shewbread and the daily offerings, and Hiram's reply blesses “the Lord God of Israel, that made heaven and earth” ([[2 Chr. 2:12]]). The notes below draw on both. The plan and furnishings of the house itself are the note at [[1 Kgs. 6:2]].

thread: |
  The chapter is about what peace makes possible. Solomon's letter to Hiram gives the argument in three steps: David could not build because of the wars around him, the LORD has now given rest on every side, and so the son promised to David will build the house (verses 3–5). Everything after that is the rest put to work. The king who once sent cedar and carpenters to David becomes Solomon's covenant partner (verses 1, 12); Lebanon's forests come down to the sea and float south (verse 9); Israel's own men go up to the mountains in shifts (verses 13–14).

  Verse 12 stands at the hinge. “The LORD gave Solomon wisdom, as he promised him” points back to the promise at Gibeon ([[1 Kgs. 3:12]]), and it closes the treaty with Hiram and opens the account of the workforce. One older reading takes the wisdom to cover both: the alliance that brought the materials and the skilled men, and the use Solomon made of his own people. The levy that follows it is what the northern tribes would later call a heavy yoke (the note at verse 13).

sections:
  - range: 1-6
    heading: I Purpose to Build an House
    plain: |
      Hiram king of Tyre sent his officials to Solomon when he heard that Solomon had been anointed king in his father's place, for Hiram had always been David's friend and ally. Solomon sent this message back to Hiram: “You know that my father David could not build a house for the name of the LORD his God, because of the wars waged against him on every side, until the LORD put his enemies under his feet. But now the LORD my God has given me rest on every side: there is no adversary and no misfortune. So I intend to build a house for the name of the LORD my God, as the LORD told my father David: ‘Your son, whom I will set on your throne in your place, will build the house for My name.’ Now give orders for cedars to be cut for me in Lebanon. My men will work with yours, and I will pay your men whatever wages you set, for you know there is no one among us who knows how to cut timber as the Sidonians do.”
  - range: 7-12
    heading: They Two Made a League Together
    plain: |
      When Hiram heard Solomon's message he was overjoyed, and he said, “Blessed be the LORD today, who has given David a wise son to rule this great people.” Hiram sent word to Solomon: “I have heard the message you sent me. I will do all you want in supplying cedar and fir. My men will bring the logs down from Lebanon to the sea, and I will make them into rafts to float by sea to the place you name. There I will have them broken apart, and you will take them away. And you will do what I want by supplying food for my household.” So Hiram gave Solomon all the cedar and fir he wanted, and Solomon gave Hiram twenty thousand measures of wheat as food for his household and twenty measures of the finest beaten olive oil, year after year. The LORD gave Solomon wisdom, as He had promised him. There was peace between Hiram and Solomon, and the two of them made a treaty.
  - range: 13-18
    heading: A Levy out of All Israel
    plain: |
      King Solomon conscripted a labor force from all Israel, thirty thousand men. He sent them to Lebanon in shifts of ten thousand a month: one month they were in Lebanon and two months at home. Adoniram was in charge of the forced labor. Solomon also had seventy thousand carriers and eighty thousand stonecutters in the hills, besides thirty-three hundred of Solomon's chief officers who were in charge of the work and directed the people who did it. At the king's command they quarried great stones, costly stones, and dressed them to lay the foundation of the house. Solomon's builders and Hiram's builders and the stoneworkers cut them, and so they prepared the timber and the stone to build the house.

notes:
  - ref: 1
    phrase: Hiram king of Tyre
    kind: history
    title: Hiram, Tyre and the Sidonians
    body: |
      Solomon turned to Tyre because the Phoenicians had what Israel lacked: the forests of Lebanon, the skill to fell them, and the ships to move them. Hiram is the king who had already sent David cedar, carpenters and masons to build his palace ([[2 Sam. 5:11]]); he was a friend of both kings, and Chronicles calls him Huram. He is not the bronze-worker of the same name whom he later sends to Solomon ([[1 Kgs. 7:13–14]]). Tyre was a great commercial seaport on the coast north of Israel. Solomon's letter speaks of “Sidonians” (verse 6) although Hiram reigned at Tyre, because Sidon (Zidon) was the leading city of Phoenicia in early times, and the Old Testament generally calls the Phoenicians Zidonians.

      Lebanon is the long limestone range to the north, rising to eight or nine thousand feet, and its cedars were the prize. Solomon admits plainly that “there is not among us any that can skill to hew timber like unto the Sidonians” (verse 6), and Hiram's offer in verse 9 shows the other half of the problem: the Phoenicians were masters of the sea, and the Israelites were not. Hiram's men brought the logs down to the coast, made them into rafts and floated them south to the port Chronicles names as Joppa ([[2 Chr. 2:16]]). From there the timber was hauled nearly forty miles up an ever-steeper road to Jerusalem, about 2,550 feet above the sea.

      What Tyre wanted in return was food for the king's household (verses 9, 11), and the note at [[Ezek. 27:17]] follows that trade in Israel's grain and oil into the prophets and the New Testament.
    sources: [bd-hiram, bd-tyre, bd-zidon, bd-lebanon, ot-manual-kings-1, madsen-solomons-temple, lds-scriptures]

  - ref: 1
    phrase: a lover of David
    kind: history
    title: Friendship and covenant
    body: |
      Hiram's “love” for David may have been covenant loyalty as well as friendship. The Hebrew is the ordinary verb to love, which can express one friend's affection for another ([[1 Sam. 18:1–3]]). One reading hears covenant language in it: in the biblical world love often meant covenant devotion to one's superior, and hate the standing of one outside that bond, so that the two words could carry a sense of political alliance, and Hiram as “a lover of David” is one of the examples given. On that reading the verse's “for” gives Hiram's reason for sending his servants: the son of the king he was bound to had come to the throne.

      The chapter's last verse on Hiram confirms the friendship as a treaty with David's son: “there was peace between Hiram and Solomon; and they two made a league together” (verse 12). “League” is *bǝrît*, covenant. When Amos later condemns Tyre because it “remembered not the brotherly covenant” ([[Amos 1:9]]), the note there sets this treaty behind the charge.
    sources: [sc-knowhy-186, oshb-wlc, lds-scriptures]

  - ref: 3
    phrase: could not build an house unto the name of the LORD his God for the wars which were about him on every side
    kind: scripture
    title: Why David could not build, and why Solomon could
    body: |
      Solomon's letter gives the wars as the reason the house waited: David was surrounded by enemies until the LORD put them under his feet. Chronicles gives a second reason, which David tells Solomon the word of the LORD had given him: he had shed much blood, and the house would be built by a son who would be “a man of rest,” his name joined to that peace: “his name shall be Solomon, and I will give peace and quietness unto Israel in his days” ([[1 Chr. 22:9]]). The note at [[2 Sam. 7:5]] has the LORD's refusal and the reason Chronicles gives.

      Verse 4 claims that promise as kept: “now the LORD my God hath given me rest on every side.” In verse 5 Solomon quotes the word Nathan brought, that David's son “shall build an house unto my name,” and claims it as his own. The rest that made room for a place for the LORD's name is the note at [[2 Sam. 7:2]]; what it means that the house is built for His name is the note at [[1 Kgs. 9:3]].
    sources: [lds-scriptures]

  - ref: 4
    phrase: neither adversary nor evil occurrent
    kind: words
    title: No adversary, no mishap
    body: |
      Solomon's two words for what he no longer faces are an enemy and a misfortune. “Adversary” is *śāṭān*, which here means an opponent, personal or national, a human enemy rather than the devil. “Evil occurrent” means an evil occurrence: the Hebrew *pegaʿ* is something that happens, the word behind “time and chance” in [[Eccl. 9:11]].

      The word *śāṭān* returns in 1 Kings only in chapter 11, for the adversaries the LORD raised against Solomon after his heart “was turned from the LORD God of Israel” ([[1 Kgs. 11:9]]): “the LORD stirred up an adversary unto Solomon, Hadad the Edomite” ([[1 Kgs. 11:14]]), and then Rezon, who “was an adversary to Israel all the days of Solomon” ([[1 Kgs. 11:23–25]]).
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 11
    phrase: twenty measures of pure oil
    kind: history
    title: Twenty measures, or twenty thousand
    body: |
      Verse 11 gives a small amount of the finest oil, and the larger figure a reader meets elsewhere stands in an account of a different payment. The Hebrew says twenty *kor* of “beaten” oil (*šemen kātît*), oil made by pounding olives in a mortar, especially fine and costly; it is the oil the law required for the lamp of the tabernacle ([[Ex. 27:20]]). A kor is said to equal ten baths. The Greek translation reads twenty thousand baths of beaten oil, and the lexicon would correct the Hebrew to match it and Chronicles, where Solomon promises twenty thousand baths of oil.

      The two passages, though, have different recipients. In Chronicles the wheat, barley, wine and oil go “to thy servants, the hewers that cut timber” ([[2 Chr. 2:10]]); here the wheat and oil are “food to his household,” Hiram's own court, given “year by year.” One older reading holds to the Hebrew on that ground: Kings records the payment for the timber, which Chronicles does not mention, and twenty kor of the finest oil beside twenty thousand of wheat is not out of proportion for a royal table. The text itself does not settle which figure is original.
    sources: [oshb-wlc, bdb, bd-weights-and-measures, lxx-rahlfs, keil-kings, lds-scriptures]

  - ref: 13
    phrase: raised a levy out of all Israel
    kind: history
    title: The levy, and the yoke it became
    body: |
      The levy was forced labor. The Hebrew *mas* is a labor gang raised by levy on the people for public works, the same word used for the gangs Israel served under in Egypt, where it stands behind “taskmasters” ([[Ex. 1:11]]), and for conquered peoples put to labor ([[Josh. 16:10]]). Solomon took thirty thousand men from Israel and sent them to Lebanon in shifts, one month away and two at home (verse 14), under Adoniram, the officer who ran the forced labor under David, Solomon and Rehoboam.

      The heaviest work was laid on others, and Kings draws the line itself. The seventy thousand carriers and eighty thousand quarrymen of verse 15 are, in Chronicles, “strangers” in the land, counted and set to the work ([[2 Chr. 2:17–18]]). On the Canaanites who remained Solomon laid “a tribute of bondservice,” but “of the children of Israel did Solomon make no bondmen” ([[1 Kgs. 9:21–22]]).

      Even so, the levy was remembered. When Solomon died, the northern tribes asked his son to lighten “the grievous service of thy father, and his heavy yoke” ([[1 Kgs. 12:4]]), and when Rehoboam refused and sent Adoram, the same Adoniram, to them, “all Israel stoned him with stones, that he died” ([[1 Kgs. 12:18]]).
    sources: [bdb, bd-adoniram, lds-scriptures]

christ: |
  The LORD whose name the house would bear is Jehovah, the premortal Jesus Christ, and this whole chapter is spent preparing a place for Him: an ally's cedar, Israel's labor and the costliest stone, gathered because He had given rest. Temples in ancient times and in this dispensation have been built the same way, from the finest materials to be had, through the sacrifice and consecration of the people. The Lord names the means in latter-day revelation, “the tithing and the sacrifice which I, the Lord, require at their hands, that there may be a house built unto me” ([[D&C 97:12]]). His houses are built now, as then, from what His people give.

explore: |
  - **The same negotiation in Chronicles.** [[2 Chr. 2:1–18]], with Solomon's account of the worship the house was for and Hiram's fuller blessing.
  - **Hiram afterward.** [[1 Kgs. 9:10–14]] (the cities of Galilee) and [[1 Kgs. 9:26–28]]; [[1 Kgs. 10:11]] (the ships).
  - **A temple like Solomon's.** [[2 Ne. 5:16]]: Nephi built “after the manner of the temple of Solomon save it were not built of so many precious things.”
  - **A house of God in this dispensation.** [[D&C 88:119]]; [[D&C 97:10–17]].
  - **Solomon's temple on the site.** [The guide to temple and worship](/old-testament/guides/temple-and-worship/#temples).

