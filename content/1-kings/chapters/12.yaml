chapter: 12
title: What Portion Have We in David?
tagline: Rehoboam answers the northern tribes' plea for a lighter yoke with a harsher one, and ten tribes make Jeroboam king; to keep them from Jerusalem, Jeroboam sets up golden calves at Bethel and Dan.
when: 'At the death of Solomon, when his son Rehoboam came to be made king (verse 1; [[1 Kgs. 11:43]])'

setting: |
  Solomon is dead and his son Rehoboam has succeeded him ([[1 Kgs. 11:43]]). Chapter 12 tells how the kingdom he inherited was cut in two, and it opens the part of 1 Kings that follows two kingdoms side by side. It has three parts: the assembly at Shechem, where the northern tribes ask for relief, are refused, and make Jeroboam king (verses 1–20); the word of the prophet Shemaiah that stops Rehoboam's war to win them back (verses 21–24); and Jeroboam's new worship at Bethel and Dan (verses 25–33). Chronicles tells the first two parts again ([[2 Chr. 10:1–19]]; [[2 Chr. 11:1–17]]).

  The yoke the tribes complain of was Solomon's: the provision his officers raised from twelve districts and the forced labor of the levy ([[1 Kgs. 4:7]]; the note at [[1 Kgs. 5:13]]), which Adoram, the officer Rehoboam sends to the tribes in verse 18, had charge of ([[1 Kgs. 5:14]]), the burden of taxes and conscript labor in which Samuel's warnings about a king came true. The division fulfills Ahijah's word to Jeroboam ([[1 Kgs. 11:29–39]]). The northern kingdom kept the name Israel and was sometimes called Ephraim, after its leading tribe; it lasted about two centuries before Assyria conquered it, and its scattered people became the lost ten tribes. The southern kingdom, Judah, held the lands of Judah and Benjamin and kept Jerusalem until the Babylonians destroyed the city.

thread: |
  The chapter shows the LORD's word fulfilled through two kings' choices. Ahijah had said that the LORD would tear ten tribes from Solomon's son and give them to Jeroboam ([[1 Kgs. 11:31]]), and verse 15 says the turn of events was “from the LORD, that he might perform his saying.” Yet the text tells the division through what two kings chose. Rehoboam hears two counsels, takes the harsher, and loses the north in a day. Jeroboam, who received the kingdom by a prophet's word and on the condition that he keep the LORD's commandments as David had ([[1 Kgs. 11:38]]), reasons “in his heart” (verse 26) that worship at Jerusalem will cost him the throne, and gives Israel calves, priests and a feast of his own.

  The sin Jeroboam set up at Bethel and Dan becomes the measure of the northern kings after him, and Kings names it again when Israel goes into exile ([[2 Kgs. 17:21–22]]; the note at verse 28).

sections:
  - range: 1-5
    heading: The assembly at Shechem
    plain: |
      Rehoboam went to Shechem, because all Israel had gathered there to make him king. Jeroboam son of Nebat was still in Egypt, where he had fled from King Solomon, and when he heard of it the people sent for him. So Jeroboam and the whole assembly of Israel came and said to Rehoboam, “Your father put a hard yoke on us. Now make the hard service your father demanded, and the heavy yoke he laid on us, lighter, and we will serve you.” He answered, “Go away for three days, then come back to me.” And the people went.
  - range: 6-15
    heading: Two counsels
    plain: |
      King Rehoboam asked the advice of the elders who had served his father Solomon while he lived: “How do you advise me to answer this people?” They told him, “If today you will be a servant to this people and serve them, and answer them with kind words, they will be your servants for ever.” But he set aside the elders' advice and consulted the young men who had grown up with him and now served him. He asked them, “What do you advise? How should we answer this people, who have told me, ‘Lighten the yoke your father put on us’?” The young men who had grown up with him said, “Tell this people who said to you, ‘Your father made our yoke heavy; make it lighter for us,’ tell them this: ‘My little finger is thicker than my father's waist. My father laid a heavy yoke on you; I will make it heavier. My father disciplined you with whips; I will discipline you with whips that sting like scorpions.’” On the third day Jeroboam and all the people came back to Rehoboam, as the king had told them. The king answered the people harshly. He set aside the elders' advice and spoke as the young men had advised: “My father made your yoke heavy, and I will make it heavier. My father disciplined you with whips; I will discipline you with scorpions.” So the king did not listen to the people, for this turn of events came from the LORD, to fulfill the word the LORD had spoken through Ahijah of Shiloh to Jeroboam son of Nebat.
  - range: 16-20
    heading: Ten tribes depart
    plain: |
      When all Israel saw that the king would not listen to them, they answered him, “What share do we have in David? We have no inheritance in the son of Jesse. To your tents, Israel! Now look after your own house, David!” So Israel went home. Only the Israelites who lived in the towns of Judah stayed under Rehoboam's rule. King Rehoboam sent Adoram, who was in charge of the forced labor, and all Israel stoned him to death. King Rehoboam hurried to get into his chariot and escape to Jerusalem. So Israel has been in rebellion against the house of David to this day. When all Israel heard that Jeroboam had returned, they called him to the assembly and made him king over all Israel. No one stayed loyal to the house of David except the tribe of Judah.
  - range: 21-24
    heading: Shemaiah stops the war
    plain: |
      When Rehoboam reached Jerusalem, he gathered all the house of Judah and the tribe of Benjamin, a hundred and eighty thousand chosen fighting men, to make war on the house of Israel and win the kingdom back for Rehoboam son of Solomon. But the word of God came to Shemaiah, the man of God: “Say to Rehoboam son of Solomon, king of Judah, to all the house of Judah and Benjamin, and to the rest of the people: ‘This is what the LORD says: Do not go up to fight against your brothers the Israelites. Go home, every one of you, for this thing is from Me.’” They obeyed the word of the LORD and went home, as the LORD had said.
  - range: 25-33
    heading: Calves at Bethel and Dan
    plain: |
      Jeroboam fortified Shechem in the hill country of Ephraim and lived there; from there he went out and fortified Penuel. Jeroboam thought to himself, “Now the kingdom will go back to the house of David. If this people keep going up to offer sacrifices at the LORD's house in Jerusalem, their hearts will turn back to their lord, Rehoboam king of Judah. Then they will kill me and go back to Rehoboam king of Judah.” So after taking advice, the king made two golden calves and said to the people, “It is too much for you to go up to Jerusalem. Here are your gods, Israel, who brought you up out of the land of Egypt.” He set one up in Bethel and put the other in Dan. And this became a sin, for the people went as far as Dan to worship before the one there. He built shrines on high places and made priests from all sorts of people, who were not Levites. Jeroboam set up a feast on the fifteenth day of the eighth month, like the feast held in Judah, and he offered sacrifices on the altar. He did this at Bethel, sacrificing to the calves he had made, and he installed at Bethel the priests of the high places he had made. On the fifteenth day of the eighth month, a month he had chosen on his own, he went up to the altar he had made at Bethel, set up a feast for the Israelites, and went up to the altar to burn the offering.

notes:
  - ref: 1
    phrase: Rehoboam went to Shechem
    kind: history
    title: Why Shechem and not Jerusalem
    body: |
      The new king went north to the tribes, rather than the tribes coming to his capital, and the place itself shows what was at stake. Shechem lay among the mountains of Ephraim and was one of Israel's oldest holy towns: Abram stopped there on first entering the land, Joshua gathered the tribes there to renew the covenant, and Joseph's bones were buried there ([[Josh. 24:1]]; [[Josh. 24:32]]). It was the old meeting place of the nation in Ephraim, the tribe of Jeroboam. The tribes had the old right to acknowledge the king God chose, and had used it for Saul and David ([[1 Sam. 11:15]]; [[2 Sam. 5:3]]).

      Rehoboam went “in the hope of conciliating the northern tribes,” for the deeper cause of the split was an old rivalry between Judah and Ephraim.
    sources: [bd-shechem, bd-rehoboam, ot-manual-4]

  - ref: 7
    phrase: If thou wilt be a servant unto this people this day
    kind: scripture
    title: A servant to this people
    body: |
      The elders' counsel turns on a reversal: if the king will serve the people today, they will serve him for ever. These were the men who had stood before Solomon (verse 6), and their advice asks Rehoboam to begin his reign by lightening the load his father laid on. The lesson the Church draws from the scene is that Christlike leaders serve the people they lead, and it reads verse 7 beside Jesus' teaching on greatness ([[Matt. 20:25–28]]) and King Benjamin's account of his reign ([[Mosiah 2:10–21]]).

      In that account Benjamin reminds his people that he had “labored with mine own hands that I might serve you, and that ye should not be laden with taxes, and that there should nothing come upon you which was grievous to be borne” ([[Mosiah 2:14]]). Rehoboam, asked for relief from a grievous service, answered with the young men's words instead (verses 13–14).
    sources: [cfm-ot-2026-27, lds-scriptures]

  - ref: 10
    phrase: My little finger shall be thicker
    kind: words
    title: The little finger and the scorpions
    body: |
      Both images in the young men's answer promise a harsher rule than Solomon's. The “little finger” is a single Hebrew word, *qōṭen*, the little finger, set against the father's loins. In one older reading it is a figure for “I possess much greater might than my father.”

      The “scorpions” of verse 11 are not animals but “stinging whips,” as the Hebrew is rendered beside the verse; the same older reading takes them as whips with barbed points like a scorpion's sting. The answer the young men proposed met a request to lighten the yoke with a promise to add to it, and the king gave it, the heavier yoke and the scorpions, though without the boast of the little finger (verse 14).
    sources: [bdb, oshb-wlc, keil-kings, lds-scriptures]

  - ref: 15
    phrase: the cause was from the LORD
    kind: words
    title: A turn of affairs from the LORD
    body: |
      Verse 15 traces the king's refusal to an ordering of events from the LORD, so that He might perform the word Ahijah had spoken ([[1 Kgs. 11:30–31]]). The “cause” is the Hebrew *sibbâ*, a turn of affairs, “a turn (an ordering)” from the LORD. In one older reading it was a divine decree in which Rehoboam “contributed to the fulfilment of the counsel of God through his own folly,” and so brought about the sentence already pronounced on Solomon ([[1 Kgs. 11:11–13]]).

      The same distinction returns when Rehoboam musters Judah and Benjamin to take the tribes back. Shemaiah forbids the war, “for this thing is from me” (verse 24), and that older reading takes “this thing” as the loss of the ten tribes, not their rebellion. King and people obeyed and went home, “according to the word of the LORD.”
    sources: [bdb, lds-scriptures, keil-kings]

  - ref: 16
    phrase: What portion have we in David?
    kind: scripture
    title: Sheba's cry again
    body: |
      The tribes answer Rehoboam in the words of an earlier revolt. Sheba had raised nearly the same cry against David, “We have no part in David, neither have we inheritance in the son of Jesse: every man to his tents, O Israel” ([[2 Sam. 20:1]]; the note there compares the two). Sheba's revolt was put down; this time the cry ended the union.

      Verse 20 says that only the tribe of Judah followed the house of David. The Septuagint reads “Judah and Benjamin” there, and the next verse musters both; the count of tribes in Ahijah's sign is explained at [[1 Kgs. 11:32]].
    sources: [lds-scriptures]

  - ref: 17
    phrase: the children of Israel which dwelt in the cities of Judah
    kind: history
    title: Israelites who stayed with Judah
    body: |
      Not every Israelite of the northern tribes went with Jeroboam. Some lived in the towns of Judah and stayed under Rehoboam, and more came south later: first the priests and Levites whom Jeroboam cast off, then, “out of all the tribes of Israel such as set their hearts to seek the LORD God of Israel” ([[2 Chr. 11:16]]; see also [[2 Chr. 15:9]]). Over the years that followed many from the ten tribes moved to the southern kingdom and became part of Judah.

      That bears on the Book of Mormon. Lehi was a descendant of Manasseh ([[Alma 10:3]]), yet his family lived at Jerusalem generations after Rehoboam. This verse, with the fuller account in Chronicles, helps to explain how a family of Joseph came to be living in the land of Jerusalem.
    sources: [lds-scriptures, scripture-helps-1-kings, ot-manual-4]

  - ref: 28
    phrase: made two calves of gold
    kind: history
    title: The calves, and the sin of Jeroboam
    body: |
      The text gives Jeroboam's reason in his own words: if the people kept going up to sacrifice at the temple in Jerusalem, their hearts would turn back to Rehoboam, and they would kill him (verses 26–27). The Law commanded Israel to bring its offerings to “the place which the LORD your God shall choose out of all your tribes to put his name there” ([[Deut. 12:5]]), and that place was now in Judah. To keep his people from it Jeroboam gave the north its own worship: two calves of gold, sanctuaries, priests and a feast.

      What the calves were meant to be is not certain. Jeroboam may have intended them as substitutes for the ark of the covenant; in another reading they were “supposed to be images of Jehovah.” His proclamation repeats Aaron's at Sinai ([[Ex. 32:4]]; the note there sets out what such an image may have meant). Whatever he intended, the text's verdict is plain: “this thing became a sin” (verse 30), and it led the people into apostasy.

      It became the sin by which Kings measures the north, and Jeroboam's name became proverbial for it. King after king “walked in the way of Jeroboam, and in his sin wherewith he made Israel to sin” ([[1 Kgs. 15:34]]); even Jehu did not depart from “the golden calves that were in Beth-el, and that were in Dan” ([[2 Kgs. 10:29]]); and when Israel goes into exile, the text names it among the reasons: “the children of Israel walked in all the sins of Jeroboam which he did; they departed not from them” ([[2 Kgs. 17:22]]).
    sources: [scripture-helps-1-kings, bd-jeroboam, lds-scriptures]

  - ref: 29
    phrase: he set the one in Beth-el, and the other put he in Dan
    kind: history
    title: Why Bethel and Dan
    body: |
      Jeroboam chose old holy places at the two ends of his kingdom, not his own residence. Bethel, “house of God,” lay on the border of Benjamin and Ephraim, in the south of his realm; Abraham had built an altar there and Jacob had seen the LORD in a dream and named the place ([[Gen. 28:19]]), and it had been a sanctuary in Samuel's day. Dan, in the far north, was the northern limit of the land, and the Danites had kept a graven image and their own priests there since they settled it ([[Judg. 18:30]]; the note at [[Judg. 18:29]]).

      A later priest of Bethel would call it “the king's chapel” ([[Amos 7:13]]; the note there), and the next chapter opens at its altar ([[1 Kgs. 13:1]]).
    sources: [bd-bethel, bd-dan, ot-manual-4, lds-scriptures]

  - ref: 31
    phrase: made priests of the lowest of the people
    kind: history
    title: Priests from all the people
    body: |
      The King James “lowest” misleads: the Hebrew *miqṣôt hāʿām* means “from the whole of (from among) the people.” So the charge is not that Jeroboam's priests were of low birth but that they were drawn from anyone, “not of the sons of Levi,” and so not of the family of Aaron, to whom the Law gave the priest's office ([[Num. 3:10]]).

      Chronicles fills in the rest. Jeroboam cast the Levites out of the priest's office, so that they left their lands and came to Judah ([[2 Chr. 11:14]]), and anyone who came “with a young bullock and seven rams” could be consecrated a priest ([[2 Chr. 13:9]]). The king himself went up to the altar to offer (verses 32–33). The “house of high places” of this verse is a shrine of the kind explained at [[1 Kgs. 3:2]].
    sources: [bdb, oshb-wlc, bd-jeroboam, lds-scriptures]

  - ref: 32
    phrase: Jeroboam ordained a feast in the eighth month
    kind: history
    title: A feast a month late
    body: |
      The feast Jeroboam set up copied “the feast that is in Judah,” the feast of tabernacles, which the Law fixed for “the fifteenth day of this seventh month” ([[Lev. 23:34]]). Later Jews reckoned it the greatest and most joyful of the feasts, celebrating Israel's sojourn in the wilderness. Jeroboam kept the day and moved the month. Verse 33 says where the new date came from: it was the month “which he had devised of his own heart.”
    sources: [lds-scriptures, bd-feasts, bd-jeroboam]

christ: |
  Rehoboam refused the counsel to be a servant to his people (verse 7). Jesus gave His disciples the same counsel and lived it: “whosoever will be great among you, let him be your minister” ([[Matt. 20:26]]), for “the Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many” ([[Matt. 20:28]]).

  Authority among Christ's disciples is held on His terms. A disciple who leads, in a Church calling or in the governing of his own life, leads by serving, and King Benjamin names whom that service reaches: “when ye are in the service of your fellow beings ye are only in the service of your God” ([[Mosiah 2:17]]).

explore: |
  - **Chronicles' telling.** [[2 Chr. 10:1–11:17]], with the Levites and the faithful of every tribe who came south to Jerusalem.
  - **The man of God at Bethel.** [[1 Kgs. 13:1–10]], the warning given to Jeroboam at the altar he built.
  - **The end of Jeroboam's way.** [[2 Kgs. 17:21–23]], the sin of this chapter named as the reason for Israel's exile.
  - **Samuel's warning.** [[1 Sam. 8:10–18]], the manner of the king, and its notes on this site.

