chapter: 22
title: What the LORD Saith unto Me
tagline: Four hundred prophets tell Ahab to go up to Ramoth-gilead and prosper; one prophet, Micaiah, tells him what he saw in the council of the LORD, and Ahab goes up in disguise and dies by an arrow no one aimed, as the word of the LORD had said.
when: 'The third year of peace between Syria and Israel ([[1 Kgs. 22:1–2]]), at the end of Ahab''s reign; the chapter closes with Ahaziah''s accession in the seventeenth year of Jehoshaphat ([[1 Kgs. 22:51]])'

setting: |
  The three years without war count from the end of the war with Syria in chapter 20, when Ahab let Ben-hadad go on a covenant that included the promise, “The cities, which my father took from thy father, I will restore” ([[1 Kgs. 20:34]]). Ramoth-gilead was a city the king of Syria had kept, though the peace required him to give it up, and that is Ahab's case for war.

  The chapter has a wider setting. In the years of peace Israel and Syria were allied against Assyria, and Assyrian inscriptions record that their combined forces were defeated by Shalmaneser III; after that Ahab allied himself with Jehoshaphat of Judah against Syria and was killed trying to take Ramoth-gilead.

  The same story is told almost word for word in [[2 Chr. 18]], where Joseph Smith revised the vision of the lying spirit (see the note at verse 22). It is the last chapter of 1 Kings, but not the end of a book: Kings was one book in Hebrew (see the setting of [[1 Kgs. 1:1]]), and the reign of Ahaziah that begins in verse 51 continues in [[2 Kgs. 1]]. Jehoshaphat's reign is summed up in verses 41–50 by the measure the book uses for every king of Judah (see [[1 Kgs. 15:3]]), with the high places that he did not remove (see [[1 Kgs. 3:2]]).

thread: |
  The chapter sets one man against four hundred. Ahab's prophets give him the answer he wants, “Go up; for the Lord shall deliver it into the hand of the king” (verse 6), and Zedekiah acts it out with iron horns. Micaiah has sworn something else before he arrives: “As the LORD liveth, what the LORD saith unto me, that will I speak” (verse 14). When he does speak, he tells the kings where his word came from, the LORD on His throne with the host of heaven, and where theirs came from, a lying spirit in the mouth of all the prophets.

  The rest of the chapter tests the two words. Ahab sends Micaiah to prison “until I come in peace,” and Micaiah answers, “If thou return at all in peace, the LORD hath not spoken by me” (verses 27–28). Ahab goes to battle in disguise; a man draws a bow at random; the king dies at evening, and the dogs lick his blood “according unto the word of the LORD which he spake” (verse 38). The army goes home without its master, as Micaiah had seen it, like sheep without a shepherd.

  The book then closes with two short reigns. Jehoshaphat did what was right in the eyes of the LORD and made peace with Israel; Ahab's son Ahaziah served Baal, as his father and mother had.

sections:
  - range: 1-4
    heading: Ramoth-gilead is ours
    plain: |
      For three years there was no war between Syria and Israel. In the third year Jehoshaphat king of Judah went down to visit the king of Israel. The king of Israel said to his officials, “You know that Ramoth in Gilead belongs to us, and yet we do nothing to take it back from the king of Syria.” He asked Jehoshaphat, “Will you go with me to fight for Ramoth-gilead?” Jehoshaphat answered, “I am with you as one: my people are your people and my horses are your horses.”
  - range: 5-12
    heading: Four hundred prophets say, Go up
    plain: |
      But Jehoshaphat said to the king of Israel, “First, please ask for the word of the LORD.” So the king of Israel gathered the prophets, about four hundred men, and asked them, “Shall I go to war against Ramoth-gilead, or shall I hold back?” They said, “Go up, for the Lord will give it into the king's hand.”

      Jehoshaphat asked, “Is there no other prophet of the LORD here whom we can ask?” The king of Israel said, “There is still one man through whom we can ask the LORD, Micaiah the son of Imlah. But I hate him, because he never prophesies good about me, only evil.” Jehoshaphat said, “The king should not say that.” So the king of Israel called an officer and said, “Bring Micaiah the son of Imlah quickly.”

      The king of Israel and Jehoshaphat king of Judah were sitting each on his throne, dressed in their royal robes, on the threshing floor at the entrance of the gate of Samaria, with all the prophets prophesying before them. Zedekiah the son of Chenaanah had made himself horns of iron, and he said, “This is what the LORD says: With these you will gore the Syrians until they are destroyed.” All the prophets prophesied the same: “Go up to Ramoth-gilead and succeed; the LORD will give it into the king's hand.”
  - range: 13-28
    heading: Micaiah the son of Imlah
    plain: |
      The messenger who went to call Micaiah told him, “The prophets are all saying good things to the king with one voice. Please let your word agree with theirs, and speak favorably.” Micaiah said, “As the LORD lives, whatever the LORD tells me, that is what I will speak.”

      When he came to the king, the king asked him, “Micaiah, shall we go to war against Ramoth-gilead, or shall we hold back?” He answered, “Go up and succeed; the LORD will give it into the king's hand.” The king said, “How many times must I put you under oath to tell me nothing but the truth in the name of the LORD?” Then Micaiah said, “I saw all Israel scattered on the hills like sheep without a shepherd, and the LORD said, ‘These have no master. Let each of them go home in peace.’” The king of Israel said to Jehoshaphat, “Didn't I tell you he would prophesy nothing good about me, only evil?”

      Micaiah went on: “Then hear the word of the LORD. I saw the LORD sitting on His throne, and all the host of heaven standing beside Him on His right and on His left. The LORD said, ‘Who will persuade Ahab to go up and fall at Ramoth-gilead?’ One said one thing and another said another. Then a spirit came forward, stood before the LORD, and said, ‘I will persuade him.’ The LORD asked, ‘How?’ He said, ‘I will go out and be a lying spirit in the mouth of all his prophets.’ The LORD said, ‘You will persuade him, and you will succeed. Go and do it.’ So now the LORD has let a lying spirit speak through all these prophets of yours, and the LORD has decreed disaster for you.”

      Then Zedekiah the son of Chenaanah came up, struck Micaiah on the cheek, and said, “Which way did the Spirit of the LORD go from me to speak to you?” Micaiah answered, “You will find out on the day you go into an inner room to hide.” The king of Israel said, “Take Micaiah back to Amon the governor of the city and to Joash the king's son, and tell them, ‘This is what the king says: Put this man in prison and give him nothing but scant bread and water until I come back safely.’” Micaiah said, “If you ever come back safely, the LORD has not spoken through me.” And he added, “Listen, all you people!”
  - range: 29-40
    heading: The king in disguise
    plain: |
      So the king of Israel and Jehoshaphat king of Judah went up to Ramoth-gilead. The king of Israel said to Jehoshaphat, “I will disguise myself and go into battle, but you wear your robes.” So the king of Israel disguised himself and went into battle. The king of Syria had ordered his thirty-two chariot commanders, “Do not fight with anyone, small or great, except the king of Israel.” When the chariot commanders saw Jehoshaphat, they said, “That must be the king of Israel,” and turned to attack him, and Jehoshaphat cried out. When the commanders saw that he was not the king of Israel, they stopped chasing him.

      But a man drew his bow without aiming at anyone and struck the king of Israel between the joints of his armor. The king said to his chariot driver, “Turn around and take me out of the battle; I am wounded.” The battle grew fierce that day, and the king was propped up in his chariot facing the Syrians. He died at evening, and the blood from his wound ran down into the floor of the chariot. Near sunset a cry went through the army: “Every man to his city, and every man to his own land!”

      So the king died and was brought to Samaria, and they buried him there. They washed the chariot at the pool of Samaria, where the prostitutes bathed, and the dogs licked up his blood, as the word of the LORD had said. The rest of Ahab's acts, all he did, the ivory house he built and all the cities he built, are written in the book of the chronicles of the kings of Israel. Ahab died and was buried with his fathers, and his son Ahaziah became king after him.
  - range: 41-50
    heading: Jehoshaphat in Judah
    plain: |
      Jehoshaphat the son of Asa became king of Judah in the fourth year of Ahab king of Israel. He was thirty-five years old when he began to reign, and he reigned twenty-five years in Jerusalem. His mother was Azubah the daughter of Shilhi. He followed all the ways of his father Asa and did not turn from them, doing what was right in the eyes of the LORD. Yet the high places were not removed; the people still sacrificed and burned incense there. Jehoshaphat also made peace with the king of Israel.

      The rest of Jehoshaphat's acts, the strength he showed and the wars he fought, are written in the book of the chronicles of the kings of Judah. He drove out of the land the rest of the male cult prostitutes who had remained from the days of his father Asa. At that time there was no king in Edom; a deputy ruled. Jehoshaphat built ships of Tarshish to go to Ophir for gold, but they never sailed, because they were wrecked at Ezion-geber. Then Ahaziah the son of Ahab said to Jehoshaphat, “Let my servants sail with your servants,” but Jehoshaphat refused. Jehoshaphat died and was buried with his fathers in the city of David his father, and his son Jehoram became king after him.
  - range: 51-53
    heading: Ahaziah in Israel
    plain: |
      Ahaziah the son of Ahab became king over Israel in Samaria in the seventeenth year of Jehoshaphat king of Judah, and he reigned over Israel two years. He did evil in the sight of the LORD, following the way of his father, the way of his mother, and the way of Jeroboam the son of Nebat, who made Israel sin. He served Baal and worshipped him, and provoked the LORD God of Israel to anger, just as his father had done.

notes:
  - ref: 4
    phrase: I am as thou art, my people as thy people, my horses as thy horses
    kind: history
    title: Judah's king in Ahab's war
    body: |
      Jehoshaphat puts his whole army at Ahab's disposal because the two houses were already joined by marriage. Chronicles opens the same story by saying that he “joined affinity with Ahab” ([[2 Chr. 18:1]]), which the Church's footnote explains as an alliance by marriage: Jehoshaphat's son Jehoram married Ahab's daughter ([[2 Kgs. 8:18]]).

      His reign held a paradox: he was a king “in close alliance with kings of Israel, but still a true worshipper of Jehovah and a religious reformer.” This chapter shows both sides. He goes with Ahab, yet he is the one who insists on asking the LORD first (verses 5 and 7), and Kings judges him a king who did “that which was right in the eyes of the LORD” (verse 43). Kings records the alliance without comment: “Jehoshaphat made peace with the king of Israel” (verse 44).

      Chronicles does comment. When Jehoshaphat came home from Ramoth-gilead, the seer Jehu the son of Hanani met him with a rebuke, “Shouldest thou help the ungodly,” and told him that wrath was upon him for it ([[2 Chr. 19:2]]). The marriage itself carried Ahab's ways into Judah: Jehoram “walked in the way of the kings of Israel, as did the house of Ahab: for the daughter of Ahab was his wife” ([[2 Kgs. 8:18]]).
    sources: [bd-jehoshaphat, lds-scriptures]

  - ref: 7
    phrase: Is there not here a prophet of the LORD besides
    kind: history
    title: Four hundred prophets and one more
    body: |
      The four hundred spoke in the LORD's name, which is what makes Jehoshaphat's question pointed. Nothing in the chapter makes them prophets of Baal. Their leader Zedekiah says “Thus saith the LORD” (verse 11), all of them promise that “the LORD shall deliver it into the king's hand” (verse 12), and Zedekiah later claims to have had the Spirit of the LORD (verse 24). Yet when all four hundred have agreed, Jehoshaphat asks whether there is not a prophet of the LORD “besides”: their unanimous answer did not satisfy him, and he wanted a true prophet of the LORD.

      What was wrong with them the chapter shows by Ahab's own words. There is one more prophet, he says, “but I hate him; for he doth not prophesy good concerning me, but evil” (verse 8). The king had gathered prophets who said whatever he wanted to hear, and the one he left out was the one who would not. The messenger sent to fetch Micaiah asks him to join the chorus (verse 13), and Micaiah's answer is the reason he was not there: “what the LORD saith unto me, that will I speak” (verse 14).
    sources: [cambridge-kings, halverson-path]

  - ref: 15
    phrase: 'Go, and prosper: for the LORD shall deliver it into the hand of the king'
    kind: history
    title: Micaiah's first answer
    body: |
      Micaiah's first answer repeats the four hundred almost word for word, and it was said “with great sarcasm”: in effect, all your prophets have promised success, and you want me to do the same, so here it is. The scorn told the king that this was not Micaiah's true counsel.

      Ahab's reply shows that he heard it so. The king who had just said that Micaiah never prophesies good of him now hears him prophesy good and will not accept it: “How many times shall I adjure thee that thou tell me nothing but that which is true in the name of the LORD?” (verse 16). Only then does Micaiah tell what he saw.
    sources: [ot-manual-5, bartholomew-follow-prophet]

  - ref: 19
    phrase: I saw the LORD sitting on his throne, and all the host of heaven standing by him on his right hand and on his left
    kind: scripture
    title: Micaiah in the council of the LORD
    body: |
      Against four hundred voices Micaiah sets the place his word came from. He had seen the LORD enthroned with the host of heaven around Him, the scene biblical scholars call the divine council, and *Scripture Helps* says he described it to convey the authority of his message. The council and its other appearances in scripture are explained at [[Ps. 82:1]].

      True prophets in ancient Israel were admitted to that council and made privy to what was decided there, and this chapter is one of the passages that shows it. Jeremiah asks the same of the prophets of his own day, “who hath stood in the counsel of the LORD, and hath perceived and heard his word?” ([[Jer. 23:18]]), and says that if they had stood there, they would have turned the people from their evil way ([[Jer. 23:22]]). Lehi's call follows the same pattern. He “saw God sitting upon his throne, surrounded with numberless concourses of angels” ([[1 Ne. 1:8]]) and learned of the judgments coming on Jerusalem.

      What Micaiah heard in the council was Ahab's death, and telling it put him at risk; it earned him a blow from Zedekiah and a prison cell (verses 24–27).
    sources: [scripture-helps-1-kings, sc-knowhy-17, halverson-path, lds-scriptures]

  - ref: 22
    phrase: I will be a lying spirit in the mouth of all his prophets
    kind: scripture
    title: Did the LORD put a lying spirit in them?
    body: |
      As Kings tells the vision, a spirit offers to deceive Ahab's prophets, the LORD sends it, and Micaiah concludes, “the LORD hath put a lying spirit in the mouth of all these thy prophets” (verse 23). Joseph Smith did not change this verse in Kings, but he changed the same words where Chronicles repeats them. In the Joseph Smith Translation of [[2 Chr. 18:22]] the verb is different: “the Lord hath found a lying spirit in the mouth of these thy prophets,” and the Gospel Library heads the reading with the principle, “The Lord does not put a lying spirit into the mouths of prophets.” In the verse before, the revision gives the reason the spirit could work there: “for all these have sinned against me.”

      *Scripture Helps* reads the vision through that revision: the Lord found a lying spirit among Ahab's prophets rather than put one in them. It says it is unclear why the passage in Kings was left as it was, and it rests the point on what scripture teaches elsewhere, that God is “a God of truth, and canst not lie” ([[Ether 3:12]]).

      An older explanation, printed in the Student Manual, gets to the same place by another road: the Lord “hath permitted or suffered a lying spirit to influence thy prophets,” because scripture often speaks of God as doing what He only permits. The note at [[Ezek. 14:9]] gives the same explanation for the same kind of verse.

      Either way, the lie belonged to the prophets, who were saying what the king wanted to hear, and the same speech that exposes it tells Ahab the truth: “the LORD hath spoken evil concerning thee” (verse 23).
    sources: [lds-scriptures, scripture-helps-1-kings, ot-manual-5, halverson-path]

  - ref: 30
    phrase: I will disguise myself, and enter into the battle
    kind: history
    title: A king in disguise
    body: |
      Ahab goes into battle disguised, and the arrow that kills him is aimed at no one. Disguise stories of this kind recur in the Old Testament: among them, Saul goes to the witch of Endor disguised, a prophet disguises himself to condemn Ahab in chapter 20, and here a king disguises himself in battle and is killed by an archer. In one reading of these stories, the disguise is seen through and God's will reaches the one who hides, in a form he would not want; the kings or their heirs die, and their dynasty fails. The same reading is given to Abinadi, who came to King Noah's people “in disguise” ([[Mosiah 12:1]]).

      Here the plan nearly costs Jehoshaphat his life. Robed as a king, he is the one the Syrian chariots chase, until they see he is not the king of Israel (verses 31–33). Then “a certain man drew a bow at a venture” (verse 34). The Hebrew *lᵉtummô* is from *tōm*, innocence or simplicity, and here means that he shot “without definite aim”: the archer was not trying to hit anyone. The disguise hid Ahab from the Syrian captains, but not from the word of the LORD (verse 38).
    sources: [sc-knowhy-310, oshb-wlc, bdb]

  - ref: 38
    phrase: and they washed his armour
    kind: words
    title: Where the harlots bathed
    body: |
      The King James “they washed his armour” is a mistranslation; the Hebrew says that the harlots bathed there. The words are *wᵉhazzōnôt rāḥāṣû*. *Zōnôt* was taken by some as a word for military equipment, which is where “armour” came from, but it is the plural of the word for a harlot, and *rāḥaṣ* here means to bathe oneself. Read so, the verse says the chariot was washed at the pool of Samaria, where the harlots bathed, while the dogs licked up the king's blood.

      The verse ends by naming the word it fulfilled: “according unto the word of the LORD which he spake.” Elijah had told Ahab after Naboth's death, “In the place where dogs licked the blood of Naboth shall dogs lick thy blood, even thine” ([[1 Kgs. 21:19]]), and the prophet of chapter 20 had told him, “thy life shall go for his life” ([[1 Kgs. 20:42]]). In one older reading, the washing of the chariot where the harlots bathed, with the dogs at the blood, is told as a sign of the contempt heaped on the king at his death.
    sources: [oshb-wlc, strongs-concordance, bdb, sc-knowhy-745, keil-kings]

  - ref: 48
    phrase: 'Jehoshaphat made ships of Tharshish to go to Ophir for gold: but they went not'
    kind: history
    title: Ships that never sailed
    body: |
      Jehoshaphat's ships were to sail from the port Solomon's navy had used, Ezion-geber on the Red Sea, for the same gold of Ophir ([[1 Kgs. 9:26–28]]). They were wrecked before they left.

      Kings gives no reason. Chronicles does: Jehoshaphat had joined with Ahaziah of Israel to build the ships, and the prophet Eliezer the son of Dodavah told him, “Because thou hast joined thyself with Ahaziah,” the LORD had broken his works ([[2 Chr. 20:35–37]]). In Kings, Ahaziah asks to send his own servants with Jehoshaphat's, and Jehoshaphat will not (verse 49). The two accounts differ, partnership in one and refusal in the other, and neither says how they fit together.
    sources: [lds-scriptures]

christ: |
  Micaiah saw Israel “scattered upon the hills, as sheep that have not a shepherd” (verse 17). The Topical Guide's entry on the shepherd sets his words beside Moses' prayer for a leader after him, that the congregation “be not as sheep which have no shepherd” ([[Num. 27:17]]), and lists with them the multitudes Jesus saw “scattered abroad, as sheep having no shepherd” ([[Matt. 9:36]]) and His own words, “I am the good shepherd: the good shepherd giveth his life for the sheep” ([[John 10:11]]). The connection is the Topical Guide's, and it points from the scattered flock of Micaiah's vision to the Shepherd who gives His life for it.

  A prophet's work is not to agree with his hearers but to warn them away from the paths that would destroy them, as Micaiah warned Ahab. The Lord asks that the word of His prophet be received “as if from mine own mouth, in all patience and faith” ([[D&C 21:5]]), and that holds most when the word is not what the hearer wanted.

explore: |
  - **The same story in Chronicles.** [[2 Chr. 18]], with the Joseph Smith Translation of verses 20–22, and Jehoshaphat's reforms and wars that follow in [[2 Chr. 19–20]].
  - **True and false prophets.** [[Jer. 23:16–32]], where the true prophet is the one who has stood in the LORD's counsel, and [[Ezek. 13]]–14 on prophets who say “Peace” when there is none.
  - **Ahab's house to its end.** [[2 Kgs. 1]] (Ahaziah), then Jehu's anointing and the end of the dynasty in [[2 Kgs. 9–10]].

