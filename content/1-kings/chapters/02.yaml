chapter: 2
title: Shew Thyself a Man
tagline: David charges Solomon to keep the law of Moses and to settle his accounts with Joab and Shimei, and dies; Solomon puts Adonijah to death, sends Abiathar to Anathoth, and has Joab killed at the altar and Shimei when he breaks his oath.
when: 'At the death of David, after forty years as king, and the first years of Solomon'

setting: |
  Chapter 1 left two kings in Jerusalem. While the aged David lay cared for by Abishag the Shunammite, his son Adonijah declared, “I will be king” ([[1 Kgs. 1:5]]), with Joab the captain of the army and Abiathar the priest behind him. Nathan and Bath-sheba moved David to act, and Zadok anointed Solomon at Gihon. Adonijah fled to the altar and was spared on a condition: “If he will shew himself a worthy man, there shall not an hair of him fall to the earth: but if wickedness shall be found in him, he shall die” ([[1 Kgs. 1:52]]).

  David died around 968 BC in the reckoning of *Scripture Helps*. This chapter gives David's private charge to his son; Chronicles tells instead of a great public assembly at which David handed over the plans and treasure for the temple and had Solomon anointed a second time before every tribe ([[1 Chr. 28–29]]).

  The chapter closes the stories of 2 Samuel. Joab's murders of Abner and Amasa ([[2 Sam. 3:27]]; [[2 Sam. 20:10]]), Shimei's curses on the road out of Jerusalem ([[2 Sam. 16:5–13]]), Barzillai's kindness at Mahanaim ([[2 Sam. 19:31–39]]) and the word against Eli's house ([[1 Sam. 2:31–35]]) are each settled here.

thread: |
  The chapter is framed by two sentences. “His kingdom was established greatly” (verse 12) stands at the head of Solomon's reign, and on one older reading it is a heading for everything after it: Solomon secured his throne by punishing the men who had risen with Adonijah and by carrying out his father's last instructions. The chapter ends when that is done: “And the kingdom was established in the hand of Solomon” (verse 46).

  Between the two, David's charge has two halves. The first is the law of Moses and the LORD's promise, which comes with an “if” (verses 2–4). The second is a list of debts, to be paid in punishment or in kindness (verses 5–9). Solomon then deals with four men, and the text gives a reason for each: Adonijah's request for Abishag, the word against Eli's house for Abiathar, the innocent blood Joab shed, and Shimei's broken oath. Twice Solomon says that the LORD returns a man's blood or wickedness “upon his own head” (verses 32, 44), and twice he sets beside it the throne of David established “for ever” (verses 33, 45).

sections:
  - range: 1-4
    heading: David's charge to Solomon
    plain: |
      When the time came near for David to die, he gave his son Solomon his charge: “I am going the way everyone on earth goes. Be strong, then, and prove yourself a man. Keep what the LORD your God requires of you: walk in his ways and keep his statutes, his commandments, his judgments and his testimonies, as they are written in the law of Moses, so that you may prosper in everything you do and wherever you turn. Then the LORD will keep the promise he made about me: ‘If your sons watch how they live, and walk before me faithfully with all their heart and all their soul, you will never lack a man on the throne of Israel.’”
  - range: 5-9
    heading: Old debts to settle
    plain: |
      “You know, too, what Joab the son of Zeruiah did to me, and what he did to the two commanders of Israel's armies, Abner the son of Ner and Amasa the son of Jether. He killed them, shedding in peacetime blood that belongs to war, and he stained the belt around his waist and the sandals on his feet with it. Act as your wisdom tells you, and do not let his gray head go down to the grave in peace.

      “But show kindness to the sons of Barzillai the Gileadite, and let them be among those who eat at your table, for they stood by me when I fled from your brother Absalom.

      “And there is Shimei the son of Gera with you, the Benjamite from Bahurim, who cursed me bitterly the day I went to Mahanaim. When he came down to meet me at the Jordan, I swore to him by the LORD, ‘I will not put you to death with the sword.’ Now do not treat him as guiltless. You are a wise man and will know what to do with him; bring his gray head down to the grave in blood.”
  - range: 10-12
    heading: David dies
    plain: |
      Then David died and was laid with his fathers, and he was buried in the city of David. He had reigned over Israel forty years: seven years in Hebron and thirty-three in Jerusalem. Solomon sat on the throne of his father David, and his kingdom was firmly established.
  - range: 13-25
    heading: Adonijah asks for Abishag
    plain: |
      Adonijah the son of Haggith came to Bath-sheba, Solomon's mother. She asked, “Do you come in peace?” “In peace,” he said, and added, “I have something to say to you.” “Say it,” she answered. He said, “You know that the kingdom was mine, and that all Israel looked to me to be king. But the kingdom has turned and gone to my brother, for it came to him from the LORD. Now I have one request; do not refuse me.” “Say it,” she said. “Please ask King Solomon, for he will not refuse you, to give me Abishag the Shunammite as my wife.” Bath-sheba said, “Very well; I will speak to the king for you.”

      So Bath-sheba went to King Solomon to speak for Adonijah. The king rose to meet her, bowed down to her, and sat down on his throne; he had a throne set for the king's mother, and she sat at his right hand. She said, “I have one small request; do not refuse me.” The king answered, “Ask, my mother; I will not refuse you.” She said, “Let Abishag the Shunammite be given to your brother Adonijah as his wife.”

      King Solomon answered his mother, “Why do you ask Abishag the Shunammite for Adonijah? Ask the kingdom for him too, since he is my older brother; ask it for him, and for Abiathar the priest, and for Joab the son of Zeruiah!” Then King Solomon swore by the LORD: “May God punish me, and more, if this request does not cost Adonijah his life. As surely as the LORD lives, who has established me and set me on the throne of my father David and given me a house as he promised, Adonijah will be put to death today.” King Solomon sent Benaiah the son of Jehoiada, who struck him down, and he died.
  - range: 26-27
    heading: Abiathar sent to Anathoth
    plain: |
      To Abiathar the priest the king said, “Go to Anathoth, to your own fields. You deserve to die, but I will not put you to death now, because you carried the ark of the Lord GOD before my father David, and because you shared all my father's hardships.” So Solomon removed Abiathar from being priest to the LORD, fulfilling the word the LORD had spoken at Shiloh about the house of Eli.
  - range: 28-35
    heading: Joab at the altar
    plain: |
      The news reached Joab, who had sided with Adonijah, though he had not sided with Absalom. Joab fled to the tabernacle of the LORD and took hold of the horns of the altar. When King Solomon was told that Joab had fled to the tabernacle and was beside the altar, he sent Benaiah the son of Jehoiada: “Go, strike him down.” Benaiah came to the tabernacle of the LORD and said, “The king says, ‘Come out.’” Joab said, “No; I will die here.” Benaiah reported to the king what Joab had answered.

      The king said, “Do as he said: strike him down and bury him, and so take away from me and from my father's house the guilt of the innocent blood Joab shed. The LORD will bring his blood back on his own head, because without my father David's knowledge he struck down two men more righteous and better than himself and killed them with the sword: Abner the son of Ner, commander of Israel's army, and Amasa the son of Jether, commander of Judah's. Their blood will come back on the head of Joab and of his descendants for ever; but on David and his descendants, his house and his throne, there will be peace from the LORD for ever.” So Benaiah the son of Jehoiada went up and struck him down and killed him, and he was buried at his own house in the wilderness. The king put Benaiah in Joab's place over the army, and put Zadok the priest in Abiathar's place.
  - range: 36-46
    heading: Shimei's oath
    plain: |
      Then the king sent for Shimei and told him, “Build yourself a house in Jerusalem and live there, and do not go out anywhere. On the day you go out and cross the Kidron valley, know for certain that you will die; your blood will be on your own head.” Shimei said to the king, “That is fair. Your servant will do as my lord the king has said.” And Shimei lived in Jerusalem a long time.

      But three years later two of Shimei's slaves ran away to Achish son of Maachah, king of Gath. When Shimei was told, “Your slaves are in Gath,” he saddled his donkey and went to Achish at Gath to look for them, and he brought them back from Gath. Solomon was told that Shimei had gone from Jerusalem to Gath and come back.

      The king sent for Shimei and said, “Did I not make you swear by the LORD, and warn you solemnly, ‘Know for certain that on the day you go out anywhere at all, you will die’? And you told me, ‘What I have heard is fair.’ Why then have you not kept your oath to the LORD and the command I gave you?” The king went on: “You know in your own heart all the wrong you did to my father David. The LORD will bring your wickedness back on your own head. But King Solomon will be blessed, and the throne of David will stand firm before the LORD for ever.” Then the king gave the order to Benaiah the son of Jehoiada, who went out and struck him down, and he died. So the kingdom was made secure in Solomon's hand.

notes:
  - ref: 2
    phrase: be thou strong therefore, and shew thyself a man
    kind: scripture
    title: Strong to keep the law
    body: |
      David's first charge is a call to courage, and the courage he means is obedience. “Be strong and of a good courage” is what Moses said to Joshua before Israel crossed into the land ([[Deut. 31:7]]), and the LORD said it to Joshua again ([[Josh. 1:6–7]]). The plea is an old one passed to a new leader, and it asks for more than nerve in battle: “The courage to obey the law was just as much a part of the plea as to have physical courage.” David's next words make the point themselves. He does not name an enemy for Solomon to face; he names the law, “as it is written in the law of Moses” (verse 3), and the prospering that comes of keeping it.

      The charge also sets out the measure Kings will apply to every king after Solomon. A king was expected to keep God's commandments and so qualify for the promise that his descendants would rule, and the book will say that Israel fell because its kings failed to keep them ([[2 Kgs. 17:7–23]]).
    sources: [ot-manual-kings-1, halverson-fall-of-israel, lds-scriptures]

  - ref: 4
    phrase: If thy children take heed to their way
    kind: scripture
    title: A promise with a condition
    body: |
      David quotes the LORD's promise with an “if” in it. As Nathan delivered it in 2 Samuel 7 (to which the footnote points), the promise to David's house was unconditional: whatever his son did, the LORD would chasten him but not take His mercy away ([[2 Sam. 7:14–15]]). Here David quotes it with a condition attached: the throne stays in the family if his sons “walk before me in truth with all their heart and with all their soul.” Psalm 132 states the same condition: “If thy children will keep my covenant and my testimony that I shall teach them, their children shall also sit upon thy throne for evermore” ([[Ps. 132:12]]).

      That “if” governs the history Kings is about to tell. Psalm 132 adds “the important qualification that David’s earthly kingdom would endure only if his descendants remained faithful,” and because of wickedness the kingdom was divided after Solomon's death and ended when Babylon took Judah captive. The LORD will lay the same condition on Solomon at the temple, in nearly the same words: “There shall not fail thee a man upon the throne of Israel” ([[1 Kgs. 9:5]]; the note at [[1 Kgs. 9:6]] takes up the condition). How the unconditional part of the promise was kept is the subject of [[2 Sam. 7:16]].
    sources: [halverson-fall-of-israel, scripture-helps-1-samuel-17, lds-scriptures]

  - ref: 5
    phrase: shed the blood of war in peace
    kind: words
    title: Blood of war in peace
    body: |
      David's charge against Joab is that he killed in peacetime as a man may kill only in battle. Abner had come to make a covenant with David and had been sent away “in peace” ([[2 Sam. 3:21]]) when Joab took him aside in the gate “to speak with him quietly” and killed him ([[2 Sam. 3:27]]); Amasa was greeted, “Art thou in health, my brother?”, and taken by the beard “to kiss him” ([[2 Sam. 20:9]]). On one older reading, Joab “had murdered the two generals in a time of peace, as one ought only to slay his opponent in time of war,” and the blood on his girdle and shoes is there because he struck them while saluting them.

      Why David waited until his deathbed is the reader's next question, and the same reading answers it. When Abner was murdered David was newly anointed and too weak to punish a man like Joab, so he could only invoke divine retribution on his head ([[2 Sam. 3:29]]; David's own words at [[2 Sam. 3:39]]); when Amasa was killed, the rebellions of Absalom and Sheba had left him weaker still, so he passed the punishment to his son. The same reading takes “Do therefore according to thy wisdom” to mean marking the proper opportunity, since punishing the commander of an army devoted to him took great wisdom if it was not to set off a rebellion.
    sources: [keil-kings, lds-scriptures]

  - ref: 10
    phrase: was buried in the city of David
    kind: christ
    title: David's tomb and Peter's sermon
    body: |
      David's burial became evidence for the Resurrection of Jesus Christ. On the day of Pentecost Peter quoted Psalm 16, “thou wilt not leave my soul in hell,” and then pointed to this verse's fact: David “is both dead and buried, and his sepulchre is with us unto this day” ([[Acts 2:29]]; the Church's footnote sets the two side by side). A psalm that promised a body would not see corruption could not be about a king whose tomb was still standing in Jerusalem. So, Peter argued, David spoke as a prophet who knew that God would raise up Christ of his line to sit on his throne, and “spake of the resurrection of Christ, that his soul was not left in hell, neither his flesh did see corruption” ([[Acts 2:31]]).
    sources: [lds-scriptures]

  - ref: 22
    phrase: ask for him the kingdom also
    kind: history
    title: Abishag and the kingdom
    body: |
      Solomon heard in Adonijah's request a claim to the throne. Among Eastern nations the wives and concubines of a dead or dethroned king were taken by his successor, and so “Adonijah’s request for Abishag was regarded as tantamount to a claim on the throne.” Scripture shows the custom twice in David's own story: the LORD gave David “thy master’s wives into thy bosom” with Saul's house ([[2 Sam. 12:8]]), and Absalom went in to his father's concubines “in the sight of all Israel” ([[2 Sam. 16:22]]). Abishag had lain in David's bosom, though “the king knew her not” ([[1 Kgs. 1:2–4]]); on one older reading she “passed as his concubine” in the people's eyes all the same.

      Adonijah had already said that the kingdom was his brother's “from the LORD” (verse 15), and he had been spared once on condition of his good conduct ([[1 Kgs. 1:52]]). Solomon took the request as treason, or a plan for it: Adonijah had spoken “against his own life” (verse 23); Solomon treated it as his second attempt on the throne. Solomon names Abiathar and Joab with him because those two had backed Adonijah's rebellion ([[1 Kgs. 1:7]]) and, on the older reading, hoped to rule under his name.

      What the text shows is Bath-sheba's standing with the king: he rose, bowed to her, and seated her on a throne at his right hand, the place of honor. Whether she saw what the request meant it does not say. One reading suggests that she may have seen in it “an opportunity to rid Solomon of the threat”; the older one thinks that Adonijah's words had disarmed her suspicion.
    sources: [ot-manual-kings-1, keil-kings, lds-scriptures]

  - ref: 27
    phrase: that he might fulfil the word of the LORD
    kind: scripture
    title: The word against Eli's house
    body: |
      Abiathar's removal took the priest's office from Eli's house, as a man of God had told Eli it would ([[1 Sam. 2:31–35]]). Abiathar was of that house: he was the son of Ahimelech the son of Ahitub ([[1 Sam. 22:20]]), and Ahitub was the grandson of Eli, “the LORD’s priest in Shiloh” ([[1 Sam. 14:3]]). Eli had been told that there would “not be an old man in thine house for ever,” and that the LORD would “raise me up a faithful priest” ([[1 Sam. 2:32]], [[1 Sam. 2:35]]). Through David's reign there seems to have been a double high priesthood, Abiathar of the family of Ithamar and Zadok of the family of Eleazar. Abiathar joined Adonijah while Zadok stayed with David, and when Solomon put “Zadok the priest … in the room of Abiathar” (verse 35), the office passed to Eleazar's line, as the note at [[1 Sam. 2:35]] explains.

      Solomon spared his life and gave his reasons: Abiathar had carried the ark before David and shared his hardships, from the massacre of the priests at Nob, which he alone escaped ([[1 Sam. 22:20]]), to the flight from Absalom ([[2 Sam. 15:24–29]]). Exile to his fields at Anathoth, a priests' city ([[Josh. 21:18]]), was his sentence.
    sources: [bd-zadok, bd-abiathar, lds-scriptures]

  - ref: 28
    phrase: caught hold on the horns of the altar
    kind: history
    title: Joab at the altar
    body: |
      The altar gave Joab no shelter because the law refused it to a murderer: “if a man come presumptuously upon his neighbour, to slay him with guile; thou shalt take him from mine altar, that he may die” ([[Ex. 21:14]]; the note at [[Ex. 21:13]], and Adonijah's flight to the same altar at [[1 Kgs. 1:50]]). Joab fled when he heard what had happened to Adonijah and Abiathar, for he “had turned after Adonijah,” and his support of Adonijah's succession has been given as the reason he was put to death.

      Solomon's sentence, though, speaks only of the old murders. Joab is to die “that thou mayest take away the innocent blood, which Joab shed, from me, and from the house of my father” (verse 31). The Church's footnote sends the reader to the law of the murderer who flees for refuge: the elders were to hand him over, and “thine eye shall not pity him, but thou shalt put away the guilt of innocent blood from Israel” ([[Deut. 19:13]]). Solomon's next words return to the curse David had spoken over Joab's house when Abner died ([[2 Sam. 3:29]]): the blood would return “upon the head of Joab, and upon the head of his seed for ever,” while on David's house there would be peace.
    sources: [bd-joab, lds-scriptures]

  - ref: 43
    phrase: Why then hast thou not kept the oath of the LORD
    kind: history
    title: Shimei's oath
    body: |
      Shimei died for breaking an oath he had sworn to Solomon (verses 42–44). David had sworn to him by the LORD, “I will not put thee to death with the sword” (verse 8; [[2 Sam. 19:23]]), and Solomon did not kill him at once. He set terms instead: a house in Jerusalem, no going out “any whither” (verse 36), and death on the day he crossed the brook Kidron. Shimei accepted them, “The saying is good” (verse 38), and kept them for three years.

      When he went to Gath after his runaway slaves and came back, Solomon did not charge him first with the curse at Mahanaim. He charged him with “the oath of the LORD” he had not kept and the commandment he had broken (verse 43), and only then with “all the wickedness which thine heart is privy to” against David (verse 44). In the terms Shimei had accepted, his death was his own doing: “thy blood shall be upon thine own head” (verse 37). Shimei's cursing and his plea at the Jordan are told at [[2 Sam. 16:10]] and [[2 Sam. 19:22]].
    sources: [lds-scriptures]

christ: |
  The chapter rests Solomon's throne on the LORD's word to David, “the throne of David shall be established before the LORD for ever” (verse 45), and that word was kept in Jesus Christ. Though David's earthly kingdom ended, the promise of a kingdom for ever was fulfilled in Jesus, David's descendant, to whom Gabriel promised “the throne of his father David” ([[Luke 1:32]]). The Church's footnote to “all their heart” in David's condition (verse 4) sets beside it the Lord's word in this dispensation, “the Lord requireth the heart and a willing mind” ([[D&C 64:34]]): what David asked of his sons, the Lord asks of a disciple now.

explore: |
  - **David's public farewell.** [[1 Chr. 28:1–29:24]], the assembly at which he gave Solomon the plans for the temple.
  - **The men of David's reign.** [[2 Sam. 3:22–39]], Abner; [[2 Sam. 20:4–13]], Amasa; [[2 Sam. 16:5–13]] and [[2 Sam. 19:16–23]], Shimei; [[2 Sam. 19:31–39]], Barzillai.
  - **Eli's house.** [[1 Sam. 2:27–36]]; [[1 Sam. 22:20–23]].

