chapter: 6
title: I Will Dwell among the Children of Israel
tagline: Solomon builds the house of the LORD of finished stone, cedar and gold, twice the size of the tabernacle; in the middle of the work the LORD promises to dwell among Israel if Solomon keeps His commandments; two great cherubim stand in the inner room.
when: 'From the fourth year of Solomon’s reign, in the month Zif, to the eleventh, in the month Bul'

setting: |
  Chapter 5 gathered the materials: cedar and fir from Hiram of Tyre, and great hewn stones for the foundation (see [[1 Kgs. 5:1]]). Chapter 6 builds the house itself; chapter 7 adds Solomon's palace and the bronze work, and chapter 8 dedicates the temple. The site was the threshing floor of Araunah the Jebusite, which David had bought ([[2 Sam. 24:24]]) and which Chronicles places on Mount Moriah ([[2 Chr. 3:1]]). David had collected much of the material and planned the house and its furniture in detail, but the building itself was Solomon's work.

  The temple was the central event of Solomon's reign, overshadowing everything else he did. It stood until the army of Babylon burned it ([[2 Kgs. 25:9]]). Nephi, half a world away, built a temple “after the manner of the temple of Solomon” ([[2 Ne. 5:16]]).

  The plan and furnishings of the house, set beside the tabernacle's, are tabled in the [Temple and Worship](/old-testament/guides/temple-and-worship/#temples) guide; this chapter's notes explain what a reader of the verses asks.

thread: |
  Most of the chapter reads like a builder's account: measurements in cubits, kinds of wood, the order of the work. It moves from the shell of the house and its side rooms (verses 2–10) to the panelled and gilded interior (15–22), and then to the inner room, its cherubim, the carvings and the doors (23–35).

  Into the middle of that account the writer sets three verses that are not about stone or cedar at all (11–13). While the house is still going up, the word of the LORD comes to Solomon: if he walks in the LORD's statutes, the LORD will keep the promise He made to David and will dwell among Israel and not forsake them. The LORD's answer after the dedication ([[1 Kgs. 9:1–9]]) sets out the same condition at length.

sections:
  - range: 1-10
    heading: The house and its side rooms
    plain: |
      In the 480th year after the Israelites came out of Egypt, in the fourth year of Solomon's reign over Israel, in the month Zif, the second month, he began to build the house of the LORD.

      The house King Solomon built for the LORD was sixty cubits long, twenty wide and thirty high. The porch in front of the main hall was twenty cubits wide, the full width of the house, and it stood out ten cubits in front of it. He made narrow windows for the house. Against its walls, all around the main hall and the inner room, he built tiers of side rooms. The lowest tier was five cubits wide, the middle six and the third seven, because he set the outside of the house's wall back in ledges all the way round, so that the beams would not have to be set into the walls of the house.

      The house was built of stone made ready before it was brought there, so that no hammer, axe or other iron tool was heard in the house while it was being built. The door to the middle side room was on the right side of the house, and winding stairs went up to the middle tier and from the middle to the third. So he built the house and finished it, roofing it with beams and boards of cedar. He built the tiers of side rooms against the whole house, each five cubits high, resting on the house with cedar timbers.
  - range: 11-13
    heading: The word of the LORD
    plain: |
      Then the word of the LORD came to Solomon: “As for this house you are building: if you walk in My statutes, carry out My judgments, and keep all My commandments and live by them, then I will fulfill through you the word I spoke to David your father. I will dwell among the Israelites, and I will not forsake My people Israel.”
  - range: 14-22
    heading: Cedar and gold within
    plain: |
      So Solomon built the house and finished it. He lined the inside walls of the house with cedar boards from the floor up to the ceiling, covering the inside with wood, and covered the floor with planks of fir. He built twenty cubits of the house, floor and walls, with cedar boards; he built this inside as the inner room, the most holy place. The house in front of it, the main hall, was forty cubits long. The cedar inside the house was carved with knobs and open flowers; it was all cedar, and no stone could be seen.

      He prepared the inner room within the house to hold the ark of the covenant of the LORD. The inner room was twenty cubits long, twenty wide and twenty high. He overlaid it with pure gold, and overlaid the altar of cedar too. Solomon overlaid the inside of the house with pure gold, drew chains of gold across in front of the inner room, and overlaid it with gold. He overlaid the whole house with gold until all of it was finished, and overlaid with gold the whole altar that belonged to the inner room.
  - range: 23-36
    heading: Cherubim, carvings and doors
    plain: |
      In the inner room he made two cherubim of olive wood, each ten cubits high. Each wing of the cherub was five cubits, ten cubits from wingtip to wingtip. The second cherub was also ten cubits; the two were of one measure and one shape, each ten cubits high. He set the cherubim in the inner room with their wings spread, so that a wing of one touched one wall, a wing of the other touched the other wall, and their other wings touched each other in the middle of the room. He overlaid the cherubim with gold.

      On all the walls of the house, inside and out, he carved figures of cherubim, palm trees and open flowers, and he overlaid the floor of the house with gold, inside and out. For the entrance to the inner room he made doors of olive wood; the lintel and doorposts took up a fifth of the wall. On the two olive-wood doors he carved cherubim, palm trees and open flowers, and overlaid them with gold, spreading the gold over the cherubim and the palm trees. For the entrance to the main hall he likewise made doorposts of olive wood, a fourth of the wall, and two doors of fir, each with two folding leaves. He carved cherubim, palm trees and open flowers on them and covered them with gold fitted to the carving. He built the inner court with three courses of dressed stone and a course of cedar beams.
  - range: 37-38
    heading: Seven years
    plain: |
      The foundation of the house of the LORD was laid in the fourth year, in the month Zif. In the eleventh year, in the month Bul, the eighth month, the house was finished in every part and in every detail of its design. He had spent seven years building it.

notes:
  - ref: 1
    phrase: in the four hundred and eightieth year after the children of Israel were come out of the land of Egypt
    kind: history
    title: When the house was built
    body: |
      The verse dates the start of the temple twice, by Solomon's reign (his fourth year) and by the Exodus (480 years after Israel left Egypt). The second date invites arithmetic: on one reckoning the temple was begun about 966 B.C., and adding 480 puts the Exodus in 1446 B.C. But one Latter-day Saint reading holds that 480 is almost certainly a symbolic number, twelve times forty, twelve being a significant number in Israel and forty the years of a generation. On that reading the verse does not fix the Exodus to a year, and its date has to be sought from other historical evidence.

      The end of the work is also dated by Solomon's reign ([[1 Kgs. 6:37–38]]). Zif and Bul are month names the writer explains by number, the second month and the eighth. Begun in the second month of the fourth year and finished in the eighth month of the eleventh, the house took seven years and a half; verse 38 calls it seven. The palace described next took thirteen ([[1 Kgs. 7:1]]).
    sources: [sc-knowhy-847, scripture-helps-2-samuel-11, lds-scriptures]

  - ref: 2
    phrase: the length thereof was threescore cubits, and the breadth thereof twenty cubits, and the height thereof thirty cubits
    kind: history
    title: The plan of the house
    body: |
      The house was built on the model of the tabernacle, the dimensions of each part doubled. It was sixty cubits long, twenty wide and thirty high, with a porch ten cubits deep across the front (verse 3); in feet, the temple was about a hundred long, thirty wide and forty-five high. It had two main rooms, as the tabernacle had: the main hall, forty cubits long ([[1 Kgs. 6:17]]), and behind it the inner room, twenty cubits each way ([[1 Kgs. 6:20]]). Built against the outside, on three sides, were small side rooms on three levels (verses 5–6, 8, 10).

      That is small beside the meetinghouses of today, and the reason is that it was not built to hold a congregation. The worshippers stayed outside in the courts; only the priests went in.

      Solomon did not work out the figures himself. As Moses had received the pattern of the tabernacle ([[Ex. 25:9]]), so for this house, Brigham Young taught, its dimensions and fixtures “were given to Solomon by revelation,” because Solomon “had never built a Temple, and did not know what was necessary in the arrangement of the different apartments, any better than Moses did what was needed in the Tabernacle.” Chronicles says that David gave Solomon “the pattern” ([[1 Chr. 28:11]]). The record in Kings is very exact about the dimensions, which suggests that they were significant. The furnishings of the two houses side by side are in the [Temple and Worship](/old-testament/guides/temple-and-worship/#temples) guide.
    sources: [bd-temple-of-solomon, scripture-helps-2-samuel-11, cowan-ot-temples, ot-manual-kings-1, lds-scriptures]

  - ref: 7
    phrase: neither hammer nor axe nor any tool of iron heard in the house
    kind: history
    title: Stone made ready at the quarry
    body: |
      The stones were cut and dressed where they were quarried and brought to the site finished, so the house went up without the sound of hammer, axe or iron tool. Chapter 5 has the great hewed stones brought for the foundation ([[1 Kgs. 5:17]]), and all the materials of the house were prepared before they reached the site. The King James “made ready before it was brought thither” is usually read as “made ready at the quarry”: the last Hebrew word, *massāʿ*, is most likely a noun for the quarry, though the lexicon marks the text uncertain and allows “when it was quarried.” Either way the stone was finished before it came to the house.

      The verse does not say why the silence mattered. One older reading traces it, probably, to the law of the altar, on which no iron tool was to be lifted ([[Ex. 20:25]]; [[Deut. 27:5]]): as iron was kept from the altar's stones, so the stone for the house was prepared at a distance, and as little noise as possible was made at the house itself. That law and the reasons given for it are explained at [[Ex. 20:25]].
    sources: [bd-temple-of-solomon, cambridge-kings, lds-scriptures]

  - ref: 13
    phrase: I will dwell among the children of Israel
    kind: scripture
    title: The word that came while he built
    body: |
      Halfway through the building account the LORD speaks, and what He says is a condition and a promise. If Solomon walks in His statutes, judgments and commandments, then the LORD will keep the word He spoke to David, that David's son would build the house and his throne would be established ([[2 Sam. 7:13]]), and He will dwell among Israel. The dwelling is the tabernacle's promise again: “let them make me a sanctuary; that I may dwell among them” ([[Ex. 25:8]]). As He had with Moses, the Lord gave Solomon direction while the work was under way.

      The promise is conditional, and these verses are one of the places where the LORD made clear through His prophets that His promises of protection depended on obedience to His commandments. That condition is treated in full at [[1 Kgs. 9:6]].
    sources: [cowan-ot-temples, sc-knowhy-451, lds-scriptures]

  - ref: 16
    phrase: even for the oracle, even for the most holy place
    kind: words
    title: The oracle
    body: |
      “Oracle” is the King James name for the inner room, and the verse explains it at once: “even for the most holy place.” The English rests on an old guess about the Hebrew word, *dᵉbîr*. Two ancient Greek translations and the Latin Vulgate rendered it as though it came from *dibber*, “to speak”; the Vulgate's *oraculum* gave the King James “oracle.” That derivation is incorrect. The word means the hindmost room: the innermost room of the temple, the most holy place, where the ark and the cherubim stood.

      The room was a cube, twenty cubits each way ([[1 Kgs. 6:20]]), overlaid with pure gold and closed off by a partition of golden chains ([[1 Kgs. 6:21]]).
    sources: [bdb]

  - ref: 27
    phrase: their wings touched one another in the midst of the house
    kind: symbol
    title: Two great cherubim over the ark
    body: |
      Two cherubim of olive wood overlaid with gold, each ten cubits tall, filled the inner room: their outer wings touched the side walls and their inner wings met in the middle. They were new. The ark Moses made, with the cherubim of its own mercy seat, was carried in at the dedication and set “under the wings of the cherubims” ([[1 Kgs. 8:6]]). Solomon's were larger, and they stood differently.

      What cherubim are is explained at [[Ex. 25:18]]: figures that guard holy places and attend the throne of God. The room they filled was “the throne-room of Yahweh,” the LORD who “dwelleth between the cherubims” ([[1 Sam. 4:4]]).
    sources: [bd-temple-of-solomon, bdb, lds-scriptures]

christ: |
  The inner room of Solomon's house was the place of the LORD's presence, and John's Gospel can be read as a journey out of that room and back into it. When John says that “the Word was made flesh, and dwelt among us” ([[John 1:14]]), it can be understood that the Son came down from the presence of God in the Holy of Holies, out through the temple, and into the world. The events of His ministry then appear to retrace the way inward. At the end He washes His disciples' feet and prays that they may follow Him into the Father's presence ([[John 17:1–26]]), and after His Resurrection He ascends to the Father ([[John 20:17]]). He does not go back alone: He takes His disciples with Him, opening the way for all of God's children to enter His presence again.

  The promise of verse 13 had a condition, and in the Lord's house now the same principle holds: through covenants made there, the Lord dwells with the disciple who keeps them.

