chapter: 10
title: The Half Was Not Told Me
tagline: The queen of Sheba comes from southern Arabia to test Solomon with riddles and goes home blessing the LORD; then the gold, the ivory throne, the fleets, and the horses out of Egypt.
when: 'Solomon’s reign, after the temple and his own house were built (1 Kgs. 9:10)'

setting: |
  Chapter 9 ended with Solomon's ships sailing from Ezion-geber on the Red Sea, manned by Hiram's sailors, and coming back from Ophir with gold ([[1 Kgs. 9:26–28]]). Chapter 10 follows the gold: first the queen of Sheba's visit, then the inventory of Solomon's wealth. Chronicles tells the story again ([[2 Chr. 9:1–28]]).

  By now the temple and the palace are finished, and the LORD has appeared to Solomon a second time, with a promise and a warning ([[1 Kgs. 9:3–9]]; the note at [[1 Kgs. 9:6]]). The chapter itself has no word of blame. The next one opens with “But king Solomon loved many strange women” ([[1 Kgs. 11:1]]).

  Other scripture remembers the visit. The Church's footnote to “queen” points to Jesus, who named “the queen of the south” as a witness against a generation that would not hear Him ([[Matt. 12:42]]; [[Luke 11:31]]). Isaiah sees those “from Sheba” bringing “gold and incense” to Zion (the note at [[Isa. 60:6]]).

thread: |
  The chapter shows the gift of chapter 3 as the world saw it. The first half is told through a foreign queen's eyes: she hears, comes to test, sees, is left breathless, and ends by blessing the LORD and naming what Israel's throne was for, “to do judgment and justice” (verse 9). The second half is the narrator's inventory: six hundred and sixty-six talents of gold a year, golden shields, an ivory throne with twelve lions, drinking cups of gold because silver was “nothing accounted of,” fleets that came home every three years, chariots and horsemen, and horses brought out of Egypt. Verse 23 sums it up: Solomon “exceeded all the kings of the earth for riches and for wisdom,” and the Church's footnote to “riches” points back to the LORD's promise at Gibeon, “I have also given thee that which thou hast not asked, both riches, and honour” ([[1 Kgs. 3:13]]).

  The chapter itself does not judge the inventory. The Church's footnotes to the law of the king, which forbade a king to multiply horses or wives, point to Solomon (the note at verse 28), and in the end Solomon let his “love for material things” wean him from his early devotion to the Lord.

sections:
  - range: 1-13
    heading: The queen of Sheba
    plain: |
      The queen of Sheba heard of Solomon's fame, which was bound up with the name of the LORD, and she came to test him with riddles. She arrived in Jerusalem with a great retinue and camels loaded with spices, a great deal of gold, and precious stones, and when she came to Solomon she talked with him about everything that was on her mind. Solomon answered all her questions; nothing was hidden from the king that he could not explain to her.

      When the queen of Sheba had seen all Solomon's wisdom, the house he had built, the food of his table, the seating of his officials, the service of his attendants and their clothing, his cupbearers, and the ascent by which he went up to the house of the LORD, she was left breathless. She said to the king, “The report I heard in my own country about your deeds and your wisdom was true. But I did not believe it until I came and saw it with my own eyes, and I was not told the half of it: your wisdom and prosperity go beyond what I heard. Happy are your men, and happy are these servants of yours who stand before you always and hear your wisdom. Blessed be the LORD your God, who delighted in you and set you on the throne of Israel. Because the LORD loved Israel forever, He made you king, to do justice and righteousness.”

      She gave the king a hundred and twenty talents of gold, a very great quantity of spices, and precious stones; never again did such an abundance of spices come as the queen of Sheba gave King Solomon. (Hiram's fleet, which brought gold from Ophir, also brought from Ophir a great quantity of almug wood and precious stones. The king made supports of the almug wood for the house of the LORD and for the king's house, and harps and lyres for the singers; no such almug wood has come or been seen to this day.) King Solomon gave the queen of Sheba everything she desired and asked for, besides what he gave her out of his royal generosity. Then she went back to her own country with her servants.
  - range: 14-22
    heading: Gold, ivory, and the fleets
    plain: |
      The gold that came to Solomon in one year weighed six hundred and sixty-six talents, besides what came from the traders and the merchants, from all the kings of Arabia, and from the governors of the land. King Solomon made two hundred large shields of beaten gold, with six hundred shekels of gold in each, and three hundred smaller shields of beaten gold, with three pounds of gold in each; the king put them in the House of the Forest of Lebanon.

      The king also made a great throne of ivory and overlaid it with the finest gold. The throne had six steps, and its back was rounded at the top. There were armrests on each side of the seat, with a lion standing beside each armrest, and twelve lions stood on the six steps, one at each end of every step. Nothing like it was ever made in any kingdom. All King Solomon's drinking cups were gold, and all the vessels of the House of the Forest of Lebanon were pure gold; none were silver, which was thought of no value in Solomon's days. For the king had at sea a fleet of Tarshish ships along with Hiram's fleet, and once every three years the fleet came in, bringing gold, silver, ivory, apes, and peacocks.
  - range: 23-29
    heading: Riches, chariots, and horses
    plain: |
      So King Solomon surpassed all the kings of the earth in riches and in wisdom. The whole earth sought Solomon's presence to hear the wisdom God had put in his heart, and every one of them brought a gift, vessels of silver and gold, garments, armor, spices, horses and mules, so much year by year.

      Solomon gathered chariots and horsemen. He had fourteen hundred chariots and twelve thousand horsemen, whom he stationed in the chariot cities and with the king in Jerusalem. The king made silver as common in Jerusalem as stones, and cedar as plentiful as the sycomore trees of the lowland. Solomon's horses were brought out of Egypt and out of Kue, and the king's merchants bought them from Kue at a set price. A chariot came up out of Egypt for six hundred shekels of silver and a horse for a hundred and fifty, and in the same way they were brought out, through the king's merchants, for all the kings of the Hittites and the kings of Syria.

notes:
  - ref: 1
    phrase: the queen of Sheba heard of the fame of Solomon concerning the name of the LORD, she came to prove him with hard questions
    kind: history
    title: The queen of Sheba and her hard questions
    body: |
      The queen came from Arabia, and she brought what her country was known for. Sheba is also the name of a son of Joktan, whose descendants “gave their name to a portion of southern Arabia (now called Arabia Felix).” Her camels carried spices, gold, and precious stones (verse 2), and the prophets remember Sheba for the same goods: “incense from Sheba” ([[Jer. 6:20]]), and in Isaiah's vision of Zion, “all they from Sheba” bringing “gold and incense” (the note at [[Isa. 60:6]]).

      What she heard was Solomon's fame “concerning the name of the LORD,” and the phrase ties his fame to the temple. The Hebrew is *lᵉšēm YHWH*, literally “for the name of the LORD,” the same words chapter 8 uses of the house Solomon built “for the name of the LORD God of Israel” ([[1 Kgs. 8:20]]). On one older reading, wherever that great building was talked of, the name of the God to whose honor it was built would surely be heard with it, as Israel had been known long before for the same name: the Gibeonites came “from a very far country” “because of the name of the LORD thy God” ([[Josh. 9:9]]). The Septuagint, the early Greek translation, names both: she heard “of the name of Solomon, and the name of the Lord.”

      The “hard questions” were riddles. The Hebrew *ḥîdôt* means a “riddle, enigmatic, perplexing saying or question,” the word for Samson's riddle at his wedding ([[Judg. 14:12]]), and the queen came “to prove,” to test, Solomon with them. What they were about the text does not record; verse 3 records only the result: there was nothing she asked that the king could not answer.
    sources: [bd-sheba, oshb-wlc, lxx-rahlfs, cambridge-kings, bdb, lds-scriptures]

  - ref: 9
    phrase: because the LORD loved Israel for ever, therefore made he thee king, to do judgment and justice
    kind: scripture
    title: To do judgment and justice
    body: |
      At the end of her visit the queen says what Israel's throne was for. The LORD set Solomon on it because He “loved Israel for ever,” and He made him king “to do judgment and justice.” She is the second foreign ruler to bless the LORD for Solomon; Hiram had blessed Him for giving David “a wise son over this great people” ([[1 Kgs. 5:7]]).

      Psalm 72, which the Church's heading reads as David speaking of Solomon, asks the same of the king: “He shall judge thy people with righteousness, and thy poor with judgment” ([[Ps. 72:2]]). The same psalm pictures the kings of Sheba bringing gifts and the “gold of Sheba” given him ([[Ps. 72:10]]; [[Ps. 72:15]]), two verses that are listed with the queen of Sheba's visit (the note at [[Ps. 72:10]] sets them beside this chapter).
    sources: [lds-scriptures, bd-sheba]

  - ref: 14
    phrase: six hundred threescore and six talents of gold
    kind: history
    title: Where the gold came from, and who paid for it
    body: |
      Solomon's gold came from tribute, trade, and the sea, and much of its cost fell on his own people. Beside the yearly six hundred and sixty-six talents, verse 15 names what came from traders and merchants, from the kings of Arabia, and from the governors of the land. Part of it came by sea. Ophir was “probably a port of southern Arabia,” and the fleet that sailed there brought back 420 talents (the note at [[1 Kgs. 9:28]] gives the count and what it leaves open); Hiram supplied the sailors ([[1 Kgs. 9:27]]), and the fleet came home “once in three years” (verse 22; on the name “Tharshish” for the ships, see the note at [[Ps. 72:10]]).

      Who paid was, in large part, Israel. Part of the wealth came by trade and commerce, “but much of it came through the economic oppression of the people.” More gold and silver came into the country every year, “but very little of it ever filtered down to the average Israelite,” who surrendered so much of his livelihood to the king, and “for the first time in Israel’s history, there began to be a distinct difference between ‘rich’ and ‘poor.’”
    sources: [bd-ophir, ot-manual-kings-1, lds-scriptures]

  - ref: 28
    phrase: Solomon had horses brought out of Egypt
    kind: scripture
    title: Horses out of Egypt
    body: |
      The chapter ends with a thing the law of Moses forbade a king of Israel: “He shall not multiply horses to himself, nor cause the people to return to Egypt, to the end that he should multiply horses” ([[Deut. 17:16]]). The Church's footnote to “horses” in that law points to Solomon, to [[1 Kgs. 4:26]] and to Chronicles' account of this verse, “they brought unto Solomon horses out of Egypt, and out of all lands” ([[2 Chr. 9:28]]); its footnote to “wives” points to [[1 Kgs. 11:1]], the next verse of the story. The note at [[Deut. 17:16]] gives the law's reasons and how Solomon's reign answers them.

      “Linen yarn” in this verse is a mistranslation of a place name: the Hebrew reads “from Kue,” in Cilicia, so the horses came from Egypt and from Kue, as the plain words above have it.
    sources: [lds-scriptures]

christ: |
  The queen came “from the utmost parts of the earth to hear the wisdom of Solomon,” and Jesus said of Himself, “behold, a greater than Solomon is here” ([[Luke 11:31]]). The Church's heading to Psalm 72 calls Solomon “a type of the Messiah.” Those who could hear Jesus daily, in one Latter-day Saint reading, did not realize “how great their opportunities were.”

  The queen traveled a long way on a report and found that “the half was not told me” (verse 7). Jesus made her a witness in the judgment against those who had a greater wisdom near and would not come to hear it ([[Luke 11:31]]); the words of the greater King are as near to a disciple now as the scriptures that hold them.

explore: |
  - **The queen in Jesus' words.** [[Matt. 12:38–42]] and [[Luke 11:29–32]], with Jonah and Nineveh.
  - **The king the psalm prays for.** [[Ps. 72]], judgment for the poor and the gold of Sheba.
  - **The law of the king.** [[Deut. 17:14–20]], beside [[1 Kgs. 10:14–29]] and [[1 Kgs. 11:1–8]].
  - **The promise and its condition.** [[1 Kgs. 3:5–14]]; [[1 Kgs. 9:1–9]]; [[1 Kgs. 11:9–13]].
  - **Nations bringing gifts.** [[Isa. 60:1–9]], gold and incense from Sheba and the ships of Tarshish.

