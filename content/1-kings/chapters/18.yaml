chapter: 18
title: The God That Answereth by Fire
tagline: In the third year Elijah meets Ahab and calls Israel to Carmel; Baal's prophets cry all day to a god who does not answer, the fire of the LORD falls on a drenched altar, the people confess that the LORD is God, and the rain returns.
when: 'In the reign of Ahab king of Israel, “in the third year” (verse 1)'

setting: |
  Chapter 17 sealed the heavens. This chapter opens them. “After many days,” in “the third year,” the word of the LORD sends Elijah back to the king with a promise of rain (verse 1). Jesus and James both give the drought as three years and six months ([[Luke 4:25]]; [[James 5:17]]), and one older reading counts the third year from Elijah's arrival at Zarephath rather than from the start of the drought. By now Ahab and Jezebel had brought the people almost wholly away from the worship of Jehovah to the Phoenician Baal, and Jezebel had killed the prophets of the LORD she could find (verses 4, 13).

  The chapter has three scenes: Elijah's meeting with Obadiah and then with Ahab (verses 1–19), the contest on Carmel (20–40), and the rain (41–46). Both the contest and its end are aimed at Baal, “the Canaanite storm god, associated with lightning and rain”: his prophets cannot bring down fire, and the storm that ends the drought shows Jehovah's power over the very elements Baal was thought to rule.

  Chapter 19 follows straight on. Jezebel swears to kill Elijah, he flees to Horeb, and there the LORD who answered by fire at Carmel is not in the fire but in “a still small voice” ([[1 Kgs. 19:12]]).

thread: |
  The chapter is about who answers. Elijah puts the people's choice in one sentence, “if the LORD be God, follow him: but if Baal, then follow him,” and “the people answered him not a word” (verse 21). The terms of the contest are the same question: “the God that answereth by fire, let him be God” (verse 24). From morning to evening Baal's prophets call, dance and cut themselves, and the narrator says at noon and again at evening that there was no voice and none that answered (verses 26, 29). Elijah's prayer at the altar is brief: he asks that the people may know “that thou art the LORD God, and that thou hast turned their heart back again” (verse 37). The fire falls, and the people who had no word to say now cry, twice, “The LORD, he is the God” (verse 39).

  The rain follows the confession. On one older reading, once the cause of the drought had been removed, the drought itself could be lifted, and lifted by the word of the prophet who had sealed it.
sections:
  - range: 1-16
    heading: Elijah and Obadiah
    plain: |
      Much later, in the third year, the word of the LORD came to Elijah: “Go and present yourself to Ahab, and I will send rain on the land.” So Elijah went to present himself to Ahab. The famine in Samaria was severe. Ahab summoned Obadiah, who was in charge of his household. (Obadiah was deeply devoted to the LORD. When Jezebel was killing off the LORD's prophets, Obadiah had taken a hundred of them, hidden them in caves, fifty to a cave, and kept them supplied with bread and water.) Ahab said to Obadiah, “Go through the land to every spring and every stream. Maybe we can find grass to keep the horses and mules alive, so that we don't lose all our animals.” They divided the land between them, Ahab going one way by himself and Obadiah another. As Obadiah was on his way, Elijah met him. Obadiah recognized him, bowed to the ground, and said, “Is it really you, my lord Elijah?” “It is,” he answered. “Go and tell your master, ‘Elijah is here.’” Obadiah said, “What wrong have I done, that you would hand your servant over to Ahab to be killed? As surely as the LORD your God lives, there is no nation or kingdom where my master has not sent to look for you. Whenever they said, ‘He is not here,’ he made that kingdom or nation swear that they could not find you. And now you tell me, ‘Go and tell your master, Elijah is here.’ As soon as I leave you, the Spirit of the LORD will carry you off to who knows where. When I tell Ahab and he can't find you, he will kill me. Yet I, your servant, have feared the LORD since I was young. Hasn't my lord been told what I did when Jezebel was killing the LORD's prophets, how I hid a hundred of them, fifty to a cave, and fed them bread and water? And now you tell me, ‘Go and tell your master, Elijah is here’! He will kill me.” Elijah said, “As surely as the LORD of hosts lives, whom I serve, I will present myself to him today.” So Obadiah went to meet Ahab and told him, and Ahab went to meet Elijah.
  - range: 17-24
    heading: Ahab and the challenge
    plain: |
      When Ahab saw Elijah, he said to him, “Is that you, the one who brings disaster on Israel?” Elijah answered, “I have not brought disaster on Israel. You have, you and your father's family, by abandoning the LORD's commandments and following the Baals. Now send word and gather all Israel to me at Mount Carmel, with the four hundred and fifty prophets of Baal and the four hundred prophets of Asherah who eat at Jezebel's table.” So Ahab sent word throughout Israel and gathered the prophets at Mount Carmel. Elijah came before all the people and said, “How long will you limp along between two opinions? If the LORD is God, follow Him; but if Baal is, follow him.” The people said nothing at all. Then Elijah said to them, “I am the only prophet of the LORD left, but Baal has four hundred and fifty prophets. Let two bulls be brought to us. Let them choose one, cut it in pieces, and lay it on the wood, but light no fire. I will prepare the other bull and lay it on the wood, and light no fire. Then you call on the name of your gods, and I will call on the name of the LORD. The God who answers by fire, He is God.” All the people answered, “That is a fair test.”
  - range: 25-29
    heading: Baal's prophets call
    plain: |
      Elijah said to the prophets of Baal, “Choose one of the bulls and prepare it first, since there are so many of you. Call on the name of your gods, but light no fire.” They took the bull given them, prepared it, and called on the name of Baal from morning until noon: “Baal, answer us!” But there was no sound and no one answered, and they limped in their dance around the altar they had made. At noon Elijah began to mock them. “Shout louder,” he said. “He is a god, after all! Perhaps he is deep in thought, or has stepped aside, or is away on a journey. Perhaps he is asleep and has to be woken up.” So they shouted louder and, as was their custom, cut themselves with knives and spears until the blood poured over them. Midday passed, and they kept on raving until the time of the evening offering, but there was no sound, no one answered, no one paid attention.
  - range: 30-40
    heading: The fire of the LORD
    plain: |
      Then Elijah said to all the people, “Come here to me.” They all came near, and he repaired the altar of the LORD that had been torn down. Elijah took twelve stones, one for each of the tribes descended from Jacob, to whom the word of the LORD had come, saying, “Your name shall be Israel.” With the stones he built an altar in the name of the LORD, and he dug a trench around it large enough to hold about two measures of seed. He arranged the wood, cut the bull in pieces, and laid it on the wood. Then he said, “Fill four jars with water and pour it on the offering and on the wood.” “Do it again,” he said, and they did it again. “Do it a third time,” he said, and they did it a third time. The water ran down around the altar and even filled the trench. At the time of the evening offering, Elijah the prophet stepped forward and prayed: “LORD, God of Abraham, Isaac, and Israel, let it be known today that You are God in Israel, that I am Your servant, and that I have done all these things at Your word. Answer me, LORD, answer me, so that these people will know that You, LORD, are God, and that You are turning their hearts back again.” Then the fire of the LORD fell and burned up the offering, the wood, the stones and the soil, and it licked up the water in the trench. When all the people saw it, they fell face down and cried, “The LORD, He is God! The LORD, He is God!” Elijah said to them, “Seize the prophets of Baal. Don't let one of them get away.” They seized them, and Elijah brought them down to the Kishon Valley and put them to death there.
  - range: 41-46
    heading: The rain
    plain: |
      Elijah said to Ahab, “Go up, eat and drink, for there is the sound of a heavy rain.” So Ahab went up to eat and drink, and Elijah climbed to the top of Carmel, bent down to the ground, and put his face between his knees. He said to his servant, “Go up and look toward the sea.” The servant went up, looked, and said, “There is nothing.” Seven times Elijah said, “Go back.” The seventh time the servant said, “A cloud as small as a man's hand is rising from the sea.” Elijah said, “Go and tell Ahab, ‘Hitch up your chariot and go down before the rain stops you.’” Meanwhile the sky grew black with clouds and wind, and a heavy rain came. Ahab rode off to Jezreel. The power of the LORD came on Elijah; he tucked his robe into his belt and ran ahead of Ahab all the way to the entrance of Jezreel.

notes:
  - ref: 3
    phrase: Now Obadiah feared the LORD greatly
    kind: history
    title: Obadiah, governor of Ahab's house
    body: |
      Obadiah, whose name means “servant of the Lord,” was the steward of Ahab's household. Arranging the king's appointments was the work of such an officer, which would explain why Elijah sends him to set up the meeting. He is listed apart from the prophet whose book bears the same name, and whether the steward wrote that book “is not known, but it is doubtful.” That the king and his chief steward were themselves out searching for grass shows how severe the famine had become.

      The text tells his character twice, once in the narrator's aside (verses 3–4) and once in his own anxious words to Elijah (verses 12–13): he had feared the LORD from his youth, and when Jezebel was killing the LORD's prophets he hid a hundred of them in caves and fed them. Who the hundred were is not said. They were most likely a company like the “sons of the prophets” of Elisha's day ([[2 Kgs. 2:3]]) or the “company of prophets” of Saul's ([[1 Sam. 10:5]]), followers of the LORD's prophets rather than prophets in Elijah's sense, which would agree with Elijah's claim that he alone was left (verse 22).
    sources: [bd-obadiah, ot-manual-5, ot-minute-1-kings-18]

  - ref: 12
    phrase: the Spirit of the LORD shall carry thee whither I know not
    kind: scripture
    title: Carried by the Spirit
    body: |
      Obadiah fears that the Spirit of the LORD will carry Elijah off before Ahab can come, so that the king will find no one and turn on the messenger. The sons of the prophets assume the same of Elijah when he is taken up ([[2 Kgs. 2:16]]).

      The Book of Mormon tells it of Nephi the son of Helaman, who “was taken by the Spirit and conveyed away out of the midst of them” ([[Hel. 10:16]]). A Latter-day Saint study counts this among many allusions to Elijah's story in Nephi's, and takes them together as evidence that Nephi, given the power to seal on earth and in heaven, used it as Elijah did, to close the heavens against rain ([[Hel. 11:4]]).
    sources: [sc-knowhy-182, lds-scriptures]

  - ref: 17
    phrase: Art thou he that troubleth Israel?
    kind: words
    title: The troubler of Israel
    body: |
      Ahab's word is *ʿōkēr*, from a verb meaning to “stir up, disturb, trouble.” It is the verb Joshua spoke over Achan, whose hidden plunder brought defeat on the whole people: “Why hast thou troubled us? the LORD shall trouble thee this day” ([[Josh. 7:25]]). Chronicles calls Achan “Achar, the troubler of Israel” ([[1 Chr. 2:7]]), the same phrase Ahab uses here. Ahab lays the famine at the prophet's door.

      Elijah hands the word back: “I have not troubled Israel; but thou, and thy father's house” (verse 18). He had no power of his own to bring the famine; he was the LORD's agent, and the cause of Israel's distress was a king who had forsaken the commandments and followed the Baals.
    sources: [bdb, oshb-wlc, ot-manual-5, lds-scriptures]

  - ref: 19
    phrase: gather to me all Israel unto mount Carmel
    kind: history
    title: Carmel, and the prophets of the groves
    body: |
      Carmel, whose name means “garden or park,” is the ridge that runs out into the sea as the one headland on the coast of the land, 1,742 feet high. On one reading, Carmel was “a sacred place for the chief Canaanite god, El,” so that the LORD answered on the other side's own ground.

      Elijah summons two companies. The prophets of Baal number 450. The “prophets of the groves” are the prophets of Asherah: “groves” renders her name, and she was a goddess worshiped in connection with trees, counted in the Canaanite pantheon as Baal's consort (the groves are explained at [[1 Kgs. 14:15]]). They “eat at Jezebel's table,” kept by the queen. The four hundred are summoned and then not named again: verses 22, 25 and 40 speak only of Baal's prophets, and the prophets of Asherah may not have been part of the contest at all.
    sources: [bd-carmel, scripture-helps-1-kings, ot-minute-1-kings-18]

  - ref: 21
    phrase: How long halt ye between two opinions?
    kind: words
    title: Limping between two opinions
    body: |
      Elijah's question is a picture of a people trying to keep two gods. The Hebrew behind “halt” is *pōsᵉḥîm*, “limping,” and “opinions” is *sᵉʿippîm*, “divided opinions,” so the line reads “how long are ye limping on the two divided opinions,” as if on unequal legs. *Scripture Helps* hears in it an idiom of a bird hopping between two branches. Either way the people are not refusing Jehovah; many Israelites “tried to worship multiple gods alongside Jehovah,” and Elijah's call is to stop wavering between them.

      That is why the people “answered him not a word.” On one older reading, they wanted to combine the worship of Jehovah and Baal, and had nothing to say to the charge because they knew from the Law itself that Jehovah required a whole and undivided heart ([[Deut. 6:4–5]]).

      The narrator uses the same verb again in verse 26, where the prophets of Baal “leaped upon the altar”: they went limping around it, probably in their ritual dance. The same older reading takes the word there as a contemptuous name for that dance.
    sources: [bdb, oshb-wlc, scripture-helps-1-kings, keil-kings]

  - ref: 27
    phrase: Elijah mocked them
    kind: words
    title: Elijah's taunt
    body: |
      Elijah's taunt gives Baal a man's needs and limits, which is the point of it: the God of Israel needs no waking, for “he that keepeth Israel shall neither slumber nor sleep” ([[Ps. 121:4]]). Two of the King James words obscure the joke. “Talking” is *śîaḥ*, better “musing,” deep in thought; “pursuing” is, as the footnote gives it, “gone aside, or withdrawn.” Baal, then, is lost in thought, or has stepped away, or is traveling, or is asleep.

      The priests answer by crying louder and cutting themselves “after their manner” (verse 28), which shows that the cutting was a regular practice of Baal's priests. The Law forbade Israel to “make any cuttings in your flesh for the dead” ([[Lev. 19:28]], where the note takes up the rite).
    sources: [ot-minute-1-kings-18, bdb, oshb-wlc, lds-scriptures]

  - ref: 31
    phrase: Elijah took twelve stones, according to the number of the tribes of the sons of Jacob
    kind: symbol
    title: Twelve stones for one Israel
    body: |
      Elijah's altar is a statement about who Israel is. He first “repaired the altar of the LORD that was broken down” (verse 30), so an altar of Jehovah had stood on Carmel already. On one older reading it was most likely built by faithful worshipers in the northern kingdom after the division and torn down under Ahab, as Elijah will complain at Horeb that Israel had “thrown down thine altars” ([[1 Kgs. 19:10]]). He rebuilds it with twelve stones, one for each tribe, though the tribes were now two kingdoms.

      On the same reading, the twelve stones declared that the division of the kingdom was at odds with Israel's calling to be one people of Jehovah with one altar. The verse's reminder that the word of the LORD named Jacob “Israel” ([[Gen. 32:28]]) points the same way: the northern kingdom had taken the name of Israel for itself, but it belonged to the whole nation.
    sources: [keil-kings, lds-scriptures]

  - ref: 33
    phrase: Fill four barrels with water
    kind: history
    title: Water on the altar in a drought
    body: |
      In a drought Elijah pours out water, which was scarce. The “barrels” are jars, filled three times and emptied over the offering and the wood until the trench around the altar is full. The drenching left no doubt that “neither he nor any other human power could light the fire.” Four jars poured three times make twelve, as many as the stones of the altar.
    sources: [scripture-helps-1-kings, christofferson-firm-steadfast-2018, ot-minute-1-kings-18, lds-scriptures]

  - ref: 38
    phrase: Then the fire of the LORD fell
    kind: history
    title: The fire of the LORD
    body: |
      Fire was a test Baal's prophets should have welcomed, since Baal was the storm god of lightning and rain. Yet no fire came to them, and the LORD sent it on an altar soaked with water. On one older reading this was no natural lightning, which could not have done what the text describes: the fire burned up the offering, the wood, the stones of the altar and the soil, and licked up the water in the trench, and the people fell on their faces. It belongs with the other times fire fell from the LORD on an altar: at the first offerings of the tabernacle, when “all the people saw, they shouted, and fell on their faces” ([[Lev. 9:24]]), at David's altar ([[1 Chr. 21:26]]), and at the dedication of Solomon's temple ([[2 Chr. 7:1]]). The fire accredited Elijah as the LORD's servant and showed the LORD to be the living God Israel was to serve.

      The fire also prepares the next chapter. Having seen the LORD answer this way on Carmel, the reader expects the same at Horeb, and the LORD is not in the fire there ([[1 Kgs. 19:12]]).
    sources: [scripture-helps-1-kings, ot-manual-5, sc-knowhy-858, lds-scriptures]

  - ref: 39
    phrase: The LORD, he is the God; the LORD, he is the God
    kind: words
    title: The LORD, he is the God
    body: |
      The people's cry answers Elijah's prayer and spells out his name. He had asked “that this people may know that thou art the LORD God” (verse 37), which the footnote renders “that thou, Jehovah, art the God”; where the King James prints LORD in capitals, the Hebrew has the name Jehovah. Now the people say it back, twice, and the repetition suggests a chant. Elijah's own name joins the same two words: it means “Jehovah is my God.” On one reading, the people were all but chanting his name, so that the moment fulfilled it.
    sources: [lds-scriptures, bd-elijah, ot-minute-1-kings-18]

  - ref: 40
    phrase: Elijah brought them down to the brook Kishon, and slew them there
    kind: history
    title: The prophets of Baal at the Kishon
    body: |
      The text says that Elijah had the people seize the prophets of Baal, let none escape, brought them down from the mountain to the brook Kishon, and killed them there. These are the 450 prophets of Baal named in verse 22; the prophets of Asherah are not mentioned. The Law of Moses set death as the penalty for a prophet who “hath spoken to turn you away from the LORD your God” ([[Deut. 13:5]]; the note there explains the formula “put the evil away”), and for any in Israel who served other gods ([[Deut. 17:2–5]]).

      The text records no command from God for the slaughter and gives no verdict on it. Whether the quiet voice at Horeb carries a gentle correction of Elijah's zeal is one reading's question, taken up at [[1 Kgs. 19:14]].
    sources: [lds-scriptures, davis-zeal]

  - ref: 42
    phrase: put his face between his knees
    kind: scripture
    title: Seven times toward the sea
    body: |
      The LORD had already promised rain (verse 1), and Elijah still prays for it, bowed to the ground with his face between his knees, sending his servant seven times to look at the sea until a cloud “like a man's hand” rises. On one older reading, the posture is one of deep absorption in God, and the prayer asks the Lord to complete His work by fulfilling His promise.

      James reads this prayer as an example for every believer. Elijah, he says, “was a man subject to like passions as we are,” who “prayed earnestly that it might not rain,” and “prayed again, and the heaven gave rain” ([[James 5:17–18]]), and he gives it as an instance of the “effectual fervent prayer of a righteous man” ([[James 5:16]]).
    sources: [keil-kings, lds-scriptures]

  - ref: 46
    phrase: the hand of the LORD was on Elijah
    kind: history
    title: Running before Ahab to Jezreel
    body: |
      “The hand of the LORD” is the LORD's power on a person for a task beyond his own strength; the same phrase describes the inspiration that came on a prophet to prophesy ([[2 Kgs. 3:15]]). Here it carries Elijah ahead of the king's chariot to Jezreel, where Ahab probably had his summer residence: “the minor miracle of Elijah running faster than a chariot.”

      Why he ran is not said. On one older reading, the prophet who had stood against the king now ran before him as his servant, to show that his quarrel was not with Ahab himself and to strengthen the king against the pull of his wife. Jezebel's answer comes in the next verses ([[1 Kgs. 19:1–2]]).
    sources: [keil-kings, ot-minute-1-kings-18]

christ: |
  The God who answered by fire on Carmel is Jehovah, who as the risen Christ told the Nephites, “I am he that gave the law” ([[3 Ne. 15:5]]). Elder D. Todd Christofferson restated Elijah's question for the latter days, glossing “How long halt ye” as “When will you decide once and for all?”: “Either God, our Heavenly Father, exists, or He does not, but if He exists, worship Him. Either Jesus Christ is the Son of God, the resurrected Redeemer of mankind, or He is not, but if He is, follow Him.”

  The people on Carmel did not deny the LORD; they limped between Him and Baal and had nothing to say. For a disciple the same question is still the one that matters, and it is answered not by keeping both but by deciding once and for all to follow Jesus Christ.

explore: |
