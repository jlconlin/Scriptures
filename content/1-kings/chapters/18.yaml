  - **Fire from the LORD on other altars.** [[Lev. 9:22–24]]; [[1 Chr. 21:26]]; [[2 Chr. 7:1–3]].
  - **Elijah's prayer in the New Testament.** [[James 5:16–18]].
  - **Zeal and the still small voice.** “[Zeal and the Still Small Voice](https://mi.byu.edu/old-testament-reflections/zeal-and-the-still-small-voice),” a Maxwell Institute reflection that reads Carmel and Horeb together.

