chapter: 13
title: By the Word of the LORD
tagline: A man of God from Judah cries against Jeroboam's altar at Bethel and refuses the king's bread, then turns back on an old prophet's word and dies on the road; the old prophet buries him and confirms his message, and Jeroboam does not turn.
when: 'At Jeroboam''s feast of the eighth month at Beth-el ([[1 Kgs. 12:32–33]])'

setting: |
  Chapter 12 ended at Bethel, with Jeroboam offering on his new altar at a feast “which he had devised of his own heart,” served by priests “of the lowest of the people” ([[1 Kgs. 12:31–33]]). Chapter 13 opens at that same altar, with the king standing by it to burn incense. The LORD answers the new worship at its first introduction: a man of God from Judah cries out against the altar, and the miraculous signs that follow show that the word is the LORD's. They do not move Jeroboam to repent.

  The story has two parts. In verses 1–10 the man of God delivers his message and refuses the king's hospitality; in verses 11–32 an old prophet of Bethel brings him back to eat, and he is killed by a lion for his disobedience. Neither prophet is named. Verses 33–34 return to Jeroboam.

  The chapter reaches far ahead. The man of God names Josiah of the house of David as the king who will defile the altar, and the fulfillment is told in [[2 Kgs. 23:15–20]]. The end of Jeroboam's house, announced in verse 34, is the subject of [[1 Kgs. 14]].

thread: |
  The chapter is about the word of the LORD and the people who hear it. The word comes to Bethel in a stranger's mouth, and the king cannot lay a hand on him: the hand dries up and the altar splits. The man of God, holding to the word, refuses the king's table. Then he sets the same word aside on the strength of another man's claim to an angel, and the LORD's sentence on him comes through the very man who brought him back. It is fulfilled on the road, and the old prophet ends by confirming the prophecy and asking to be buried beside its messenger.

  Around the two prophets stands Jeroboam, who saw the signs at the altar and did not turn (verse 33). The man of God's death is the chapter's hardest question, and its answer is the chapter's lesson: the command the LORD had given him firsthand was not to be set aside on someone else's word.

sections:
  - range: 1-10
    heading: The man of God at the altar
    plain: |
      By the LORD's command a man of God came from Judah to Bethel while Jeroboam was standing at the altar to burn incense. Speaking by the word of the LORD, he cried out against the altar: “Altar, altar, this is what the LORD says: A son will be born to the house of David, named Josiah. On you he will sacrifice the priests of the high places who burn incense on you, and human bones will be burned on you.” The same day he gave a sign: “This is the sign the LORD has given: the altar will split apart, and the ashes on it will spill out.” When King Jeroboam heard what the man of God had cried against the altar at Bethel, he stretched out his hand from the altar and said, “Seize him!” The hand he stretched out against him dried up, so that he could not draw it back. The altar split and its ashes spilled out, as the man of God had foretold by the word of the LORD. The king said to the man of God, “Appeal to the LORD your God and pray for me, so that my hand may be restored.” The man of God prayed to the LORD, and the king's hand was restored and became as it was before. Then the king said, “Come home with me and refresh yourself, and I will give you a reward.” The man of God answered, “Even if you gave me half your house, I would not go in with you, or eat bread or drink water in this place. The LORD commanded me: Eat no bread, drink no water, and do not go back by the way you came.” So he left by another road, not the one by which he had come to Bethel.
  - range: 11-19
    heading: The old prophet of Bethel
    plain: |
      An old prophet lived in Bethel. His sons came and told him everything the man of God had done there that day and what he had said to the king. Their father asked, “Which way did he go?” His sons had seen the road the man of God from Judah had taken. He told them to saddle his donkey, rode after the man of God, and found him sitting under an oak. “Are you the man of God who came from Judah?” he asked. “I am,” he said. “Come home with me and eat.” The man of God answered, “I may not go back with you or go in with you, or eat bread or drink water with you here. The LORD told me: Eat no bread and drink no water there, and do not go back by the way you came.” The old prophet said, “I am a prophet too, as you are, and an angel told me by the word of the LORD, ‘Bring him back with you to your house to eat bread and drink water.’” But he was lying to him. (The Joseph Smith Translation reads instead, “that I may prove him; and he lied not unto him.”) So the man of God went back with him and ate and drank in his house.
  - range: 20-32
    heading: The lion on the road
    plain: |
      As they sat at the table, the word of the LORD came to the prophet who had brought him back, and he cried out to the man of God from Judah: “This is what the LORD says: Because you have disobeyed the LORD's command and have not kept the commandment the LORD your God gave you, but came back and ate and drank in the place where He told you not to, your body will not be buried in your fathers' tomb.” After the meal, the old prophet saddled the donkey for the prophet he had brought back. As he went, a lion met him on the road and killed him. His body lay in the road, with the donkey standing beside it and the lion standing beside it too. Men passing by saw the body in the road with the lion beside it, and they told the news in the town where the old prophet lived. When the old prophet heard it, he said, “It is the man of God who disobeyed the word of the LORD. The LORD has given him to the lion, which has mauled and killed him, as the LORD told him.” He had his sons saddle his donkey, went out, and found the body lying in the road with the donkey and the lion standing beside it; the lion had not eaten the body or attacked the donkey. He lifted the body onto the donkey and brought it back to his town to mourn and bury him. He laid the body in his own tomb, and they mourned over him: “Alas, my brother!” After he had buried him, he told his sons, “When I die, bury me in the tomb where the man of God is buried; lay my bones beside his. For what he cried out by the word of the LORD against the altar in Bethel and against all the shrines on the high places in the towns of Samaria will surely happen.”
  - range: 33-34
    heading: Jeroboam does not turn
    plain: |
      Even after this, Jeroboam did not turn from his evil way. Again he made priests for the high places from among the common people; anyone who wanted to be a priest he consecrated. This became the sin of Jeroboam's house, the sin that brought it to ruin and wiped it from the face of the earth.

notes:
  - ref: 2
    phrase: Josiah by name
    kind: scripture
    title: A king named before his birth
    body: |
      The man of God's words are fulfilled in [[2 Kgs. 23:15–20]]. Josiah breaks down the altar and high place that Jeroboam made at Bethel, sees the tombs on the hillside, takes the bones from them and burns them on the altar, “and polluted it, according to the word of the LORD which the man of God proclaimed.” Then he slays the priests of the high places on their own altars and burns human bones on them. The king the man of God named was a descendant of David whose reformation reached beyond Judah into the northern tribes, where Bethel lay.

      That a prophet should name a king before his birth is taken up at [[Isa. 44:28]], where the LORD names Cyrus; the note there points back to this verse.
    sources: [lds-scriptures, bd-josiah]

  - ref: 4
    phrase: his hand, which he put forth against him, dried up
    kind: history
    title: The hand stretched out against the prophet
    body: |
      Jeroboam's own body becomes the first sign that the message is the LORD's. He stretches out his hand from the altar to order the man of God seized, and the hand dries up where it is; at the same moment the altar splits and its ashes spill out, as the man of God had said they would (verses 3, 5). The king who would not hear the message must ask its messenger for help: “Entreat now the face of the LORD thy God” (verse 6). The Hebrew idiom behind his words, *ḥal nāʾ ʾet-pᵉnê*, means to appease someone, literally to make his face sweet or pleasant. The man of God prays for the king who tried to have him arrested, and the hand is restored.

      None of it changes the king. He turns at once to an offer of food and a reward (verse 7), and the chapter ends with him going on as before (verse 33).
    sources: [bdb, oshb-wlc]

  - ref: 9
    phrase: Eat no bread, nor drink water
    kind: symbol
    title: Why he could not eat or drink in Bethel
    body: |
      One older reading finds the reason for the command in what the king's offer was meant to do. It takes Jeroboam's invitation (verse 7) not as thanks for his healed hand but as a way to win the man of God over, so that his threat would at least look harmless in the eyes of the people. By refusing even “half thine house,” the man of God declared God's rejection of Jeroboam's worship more strongly still. On the same reading, the order not to go home by the road he came kept anyone from watching for him and holding him back before his errand was done.
    sources: [keil-kings]

  - ref: 18
    phrase: But he lied unto him
    kind: scripture
    title: The lie, and Joseph Smith's revision
    body: |
      The King James says plainly that the old prophet lied; the Joseph Smith Translation says that he did not, and gives the invitation a purpose. The footnote prints its reading: “… drink water, that I may prove him; and he lied not unto him,” as it stands in Joseph Smith's manuscript (spelled there “proove”). The revision says no more than that: what the old prophet meant by his test, and why he spoke of an angel, the text leaves open. On either reading the fault the LORD names in verse 21 is the man of God's own (see the note there).
    sources: [lds-scriptures, jsp-ot2, nyman-jst-historical]

  - ref: 21
    phrase: Forasmuch as thou hast disobeyed the mouth of the LORD
    kind: history
    title: Why the man of God died
    body: |
      The LORD's sentence names the fault in its own terms: the man of God “disobeyed the mouth of the LORD” and did not keep “the commandment which the LORD thy God commanded thee.” Whatever the old prophet intended (see verse 18), the man of God was not left without the truth: he had received the command firsthand and had stated it in full twice, to the king and to the old prophet (verses 8–9, 16–17). The sentence on him then came through the man who had brought him back (verse 20).

      On either reading of verse 18 the conclusion is the same: “The young prophet should have obeyed God.”

      The sentence itself is that his body would not come to “the sepulchre of thy fathers.” He would die before his time and not be buried in his homeland, and the ancient Hebrews counted it a great tragedy not to be buried properly.
    sources: [ot-manual-4]

  - ref: 24
    phrase: the lion also stood by the carcase
    kind: symbol
    title: The lion that stood by the body
    body: |
      The lion is the LORD's instrument, and the text says so through the old prophet, who gave the scene its meaning as soon as he heard of it: “the LORD hath delivered him unto the lion … according to the word of the LORD, which he spake unto him” (verse 26). Three times the lion is seen standing by the body (verses 24, 25, 28), and the last time the text adds that it “had not eaten the carcase, nor torn the ass.” On one older reading, a lion that killed and then neither ate the man nor attacked the donkey was acting against its nature, so that the death could not be taken for an accident: the passers-by saw the LORD's hand in it and carried the news to Bethel.

      This is among the passages in which the Bible attributes to Jehovah the use of real lions to carry out His punishment. Another comes when the foreign peoples settled in Samaria after Israel's exile “feared not the LORD: therefore the LORD sent lions among them” ([[2 Kgs. 17:25–26]]).
    sources: [pike-micah, keil-kings]

  - ref: 31
    phrase: lay my bones beside his bones
    kind: scripture
    title: Buried beside the man of God
    body: |
      The old prophet who brought the man of God back ends as a witness to his message. He brings the body home, lays it in his own grave, mourns him as “my brother,” and asks to be laid beside him, because the word against the altar “shall surely come to pass” (verse 32).

      The grave was still known when the prophecy was fulfilled ([[2 Kgs. 23:17–18]]). When Josiah was burning bones from the tombs at Bethel, he asked about a marker and was told, “It is the sepulchre of the man of God, which came from Judah” ([[2 Kgs. 23:17]]). He ordered, “let no man move his bones,” and so “they let his bones alone, with the bones of the prophet that came out of Samaria.”
    sources: [lds-scriptures]

  - ref: 32
    phrase: in the cities of Samaria
    kind: history
    title: Samaria before there was a Samaria
    body: |
      When the old prophet spoke, the city of Samaria had not yet been built. Omri founded it and made it the capital of the kingdom of Israel ([[1 Kgs. 16:24]]). One older reading takes the phrase as the writer's own, used ahead of time for the northern kingdom, which took the name only after its capital was built. On the same reading, the words “all the houses of the high places” also looked ahead: at the time the only other such shrine besides Bethel was the one at Dan ([[1 Kgs. 12:29]]). Josiah would remove “all the houses also of the high places that were in the cities of Samaria” ([[2 Kgs. 23:19]]).
    sources: [bd-samaria, keil-kings]

  - ref: 33
    phrase: whosoever would, he consecrated him
    kind: history
    title: Priests of whoever wished
    body: |
      After all he had seen, Jeroboam went back to the policy of chapter 12, making priests “of the lowest of the people, which were not of the sons of Levi” ([[1 Kgs. 12:31]]), and verse 33 adds how they were chosen: anyone who wanted the office got it. The King James “consecrated him” stands for the Hebrew “filled his hand” (*yᵉmallēʾ ʾet-yādô*), an idiom for consecration, used of the Levites at [[Ex. 32:29]].

      Kings measures the sin by its result: it “became sin unto the house of Jeroboam, even to cut it off” (verse 34). Ahijah will announce that end in [[1 Kgs. 14:10–11]], and Baasha will carry it out “according unto the saying of the LORD” ([[1 Kgs. 15:29]]).
    sources: [bdb, oshb-wlc]

christ: |
  The word the man of God carried was the word of Jehovah, the premortal Jesus Christ ([[Ex. 3:14]]), and the chapter shows that word standing firm against a king's hand and a king's offer, standing even when its own messenger disobeyed it, and fulfilled at Bethel in Josiah's day ([[2 Kgs. 23:16]]). The man of God died because he set aside a command he had received from the Lord himself on another man's claim to revelation (verses 21–22). A command the Lord has given a disciple still binds that disciple when another person claims a different word from Him.

explore: |
  - **The prophecy fulfilled.** [[2 Kgs. 23:15–20]], Josiah at Bethel.
  - **The end of Jeroboam's house.** [[1 Kgs. 14:1–18]], Ahijah's word to Jeroboam's wife, and [[1 Kgs. 15:25–30]].
  - **Bethel and a prophet from Judah again.** [[Amos 7:10–17]], where the priest of Bethel tells Amos to go back to Judah and eat bread there.

