chapter: 20
title: Ye Shall Know That I Am the LORD
tagline: Ben-hadad of Syria besieges Samaria and claims everything Ahab has; twice the LORD gives Israel the victory, on the hills and on the plain, so that they will know He is the LORD; then Ahab spares the king the LORD had devoted to destruction, and a wounded prophet makes him pronounce his own sentence.
when: 'In the reign of Ahab, two campaigns a year apart (verses 22, 26), three years before the war in which he died ([[1 Kgs. 22:1]])'

setting: |
  Elijah does not appear in this chapter. After Horeb (chapter 19) the story turns to Ahab's wars with Syria, and the prophets who speak to him here are not named: “a prophet” (verse 13), “a man of God” (verse 28), and “a certain man of the sons of the prophets” (verse 35).

  Syria is Aram, the country north and northeast of Israel, whose people were of the same stock as the Israelites. In the days of Israel's kings it was a number of small kingdoms, Damascus among them, and they were as a rule Israel's rivals.

  Ahab was the most wicked of Israel's kings in the Bible Dictionary's reckoning (see the note at [[1 Kgs. 16:31]]), but during his reign Israel was politically strong. This chapter and chapter 22 tell his wars with Syria: Israel won here and lost at Ramoth-gilead. Between them comes Naboth's vineyard (chapter 21). The sentence spoken at the end of this chapter, “thy life shall go for his life,” is carried out in chapter 22.

thread: |
  Twice in the chapter the LORD gives Ahab a victory he has not asked for, and twice He says why: “thou shalt know that I am the LORD” (verse 13), and “ye shall know that I am the LORD” (verse 28). Ben-hadad begins by claiming everything Ahab has (verse 3) and swears there is not dust enough in Samaria for a handful for each of his men (verse 10). After his first defeat his servants shrink Israel's God to a god of the hills (verse 23), and the LORD answers on the plain, where Israel's army looks “like two little flocks of kids” beside a host that “filled the country” (verse 27).

  What Ahab does with the second victory is the turn of the chapter. The king who had boasted sends his servants out in sackcloth to beg for his life, and Ahab calls him “my brother,” seats him in his chariot and sends him home with a treaty. Only then does a prophet name what Ben-hadad was: “a man whom I appointed to utter destruction” (verse 42). The prophet draws the sentence from Ahab's own mouth with a story of a prisoner let slip, and the king goes home “heavy and displeased” (verse 43).

sections:
  - range: 1-12
    heading: The siege and the demands
    plain: |
      Ben-hadad king of Syria gathered his whole army, with thirty-two kings, horses and chariots, and went up and besieged Samaria. He sent messengers into the city to Ahab king of Israel: “This is what Ben-hadad says: Your silver and your gold are mine; your wives and your children, the best of them, are mine too.” The king of Israel answered, “As you say, my lord the king: I am yours, and all that I have.”

      The messengers came again: “Ben-hadad says: I sent to you demanding your silver, your gold, your wives and your children. Now, about this time tomorrow, I will send my servants, and they will search your house and the houses of your servants, and whatever you value they will take in hand and carry off.” Then the king of Israel called all the elders of the land and said, “See how this man is looking for trouble. He sent to me for my wives, my children, my silver and my gold, and I did not refuse him.” The elders and all the people said, “Don't listen to him, and don't agree.” So Ahab told Ben-hadad's messengers, “Tell my lord the king: everything you first demanded of your servant I will do, but this I cannot do.” The messengers went back with his answer.

      Ben-hadad sent word: “May the gods do so to me and more, if the dust of Samaria is enough to give a handful to each of the men who follow me.” The king of Israel answered, “Tell him: the man putting on his armor should not boast like the man taking it off.” Don't boast of the deed until it is done. Ben-hadad heard this while he and the kings were drinking in their shelters, and he told his men, “Take your positions!” And they took their positions against the city.
  - range: 13-21
    heading: The first victory
    plain: |
      Then a prophet came to Ahab king of Israel and said, “This is what the LORD says: Do you see this whole great army? I will give it into your hand today, and you will know that I am the LORD.” Ahab asked, “By whom?” He answered, “This is what the LORD says: by the young men who serve the governors of the provinces.” “Who will begin the battle?” “You will.” So Ahab mustered the young men of the provincial governors, two hundred thirty-two, and after them all the people of Israel, seven thousand.

      They went out at noon, while Ben-hadad was drinking himself drunk in the shelters with the thirty-two kings who were helping him. The young men of the provincial governors went out first. Ben-hadad's scouts reported, “Men are coming out of Samaria,” and he said, “Whether they have come out for peace or for war, take them alive.” The young men came out of the city with the army behind them, and each one struck down his man. The Syrians fled and Israel pursued, and Ben-hadad king of Syria escaped on a horse with some of his horsemen. The king of Israel went out, struck the horses and chariots, and dealt the Syrians a great defeat.
  - range: 22-30
    heading: God of the hills and of the valleys
    plain: |
      The prophet came to the king of Israel and said, “Go, strengthen your forces, and consider well what you must do, for at the turn of the year the king of Syria will come up against you.” The servants of the king of Syria told him, “Their gods are gods of the hills; that is why they were stronger than we were. But let us fight them on the plain, and we will surely be stronger than they are. Do this: remove the kings, each from his post, and put captains in their place. Then raise an army like the one you lost, horse for horse and chariot for chariot, and we will fight them on the plain, and we will surely be stronger.” He listened to them and did so.

      At the turn of the year Ben-hadad mustered the Syrians and went up to Aphek to fight Israel. The Israelites were mustered and supplied with food, and went out to meet them. They camped opposite them like two little flocks of young goats, while the Syrians filled the countryside. A man of God came to the king of Israel and said, “This is what the LORD says: Because the Syrians have said, ‘The LORD is a God of the hills, but He is not a God of the valleys,’ I will give this whole great army into your hand, and you will know that I am the LORD.” For seven days they camped facing each other, and on the seventh day the battle was joined. The Israelites struck down a hundred thousand Syrian foot soldiers in one day. The rest fled into the city of Aphek, and the wall fell on twenty-seven thousand of the men who were left. Ben-hadad fled into the city and hid in an inner room.
  - range: 31-34
    heading: “He is my brother”
    plain: |
      His servants said to him, “We have heard that the kings of the house of Israel are merciful kings. Let us put sackcloth around our waists and ropes on our heads and go out to the king of Israel; perhaps he will spare your life.” So they wrapped sackcloth around their waists, put ropes on their heads, came to the king of Israel and said, “Your servant Ben-hadad says, ‘Please let me live.’” He said, “Is he still alive? He is my brother.” The men were watching for a sign and quickly took him at his word: “Your brother Ben-hadad!” “Go, bring him,” he said. When Ben-hadad came out to him, Ahab had him come up into his chariot.

      Ben-hadad said, “The cities my father took from your father I will give back, and you may set up trading quarters for yourself in Damascus, as my father did in Samaria.” Ahab answered, “On these terms I will let you go.” So he made a treaty with him and sent him away.
  - range: 35-43
    heading: The prophet's sentence
    plain: |
      By the word of the LORD, one of the sons of the prophets said to his companion, “Strike me.” The man refused. Then he said to him, “Because you have not obeyed the voice of the LORD, as soon as you leave me a lion will kill you.” And as soon as he left him, a lion found him and killed him. The prophet found another man and said, “Strike me,” and the man struck him and wounded him. Then the prophet went and waited for the king by the road, disguised with a headband over his eyes.

      As the king passed, he cried out to him: “Your servant went out into the thick of the battle, and a man turned aside and brought a man to me and said, ‘Guard this man. If he goes missing, your life will go for his life, or else you will pay a talent of silver.’ While your servant was busy here and there, he was gone.” The king of Israel said to him, “That is your sentence; you have pronounced it yourself.” Then he quickly took the headband from his eyes, and the king of Israel recognized him as one of the prophets. He said to the king, “This is what the LORD says: Because you have let go out of your hand the man I had devoted to destruction, your life will go for his life, and your people for his people.” And the king of Israel went home to Samaria heavy-hearted and displeased.

notes:
  - ref: 1
    phrase: Ben-hadad the king of Syria
    kind: history
    title: Which Ben-hadad
    body: |
      Ben-hadad is a king of Aram, the country the King James calls Syria, and the name belongs to more than one king of Damascus in Kings. The first Ben-hadad in the book is “the son of Tabrimon, the son of Hezion,” whom Asa hired to break his league with Baasha ([[1 Kgs. 15:18–20]]). The king of this chapter speaks of what “my father” did to Israel (verse 34), and the Church's footnote at verse 2 points ahead to a Ben-hadad who besieges Samaria again in Elisha's day ([[2 Kgs. 6:24]]). The text does not say whether the two are one man.
    sources: [bd-syria, lds-scriptures]

  - ref: 28
    phrase: The LORD is God of the hills, but he is not God of the valleys
    kind: history
    title: God of the hills and of the valleys
    body: |
      The Syrians explained their defeat the way most peoples of the ancient Near East thought of gods: each ruled a particular land, nation or kind of country, and was active only in his own territory. Jephthah spoke to the Ammonite king in the same terms, setting what “Chemosh thy god giveth thee to possess” beside what the LORD gave Israel ([[Judg. 11:24]]). The Syrian Naaman, healed in Israel, would ask for two mules' burden of Israel's earth so that he could worship the LORD at home ([[2 Kgs. 5:17]]), because he thought the God of Israel could be worshipped only on Israel's soil. The servants' advice follows from the belief: lure Israel down to the plain, out of its God's reach.

      The chapter answers the belief by making it the reason for the battle. The man of God repeats the Syrians' words to Ahab and gives them as the cause of the victory: “Because the Syrians have said … therefore will I deliver all this great multitude into thine hand.” The fight is on the plain the Syrians chose, and Israel wins it, so that “ye shall know that I am the LORD,” the God whom Scripture calls “a great King over all the earth” ([[Ps. 47:2]]).
    sources: [sc-knowhy-874, scripture-helps-1-kings, lds-scriptures]

  - ref: 30
    phrase: there a wall fell upon twenty and seven thousand of the men that were left
    kind: history
    title: A hundred thousand in one day
    body: |
      The figures are the text's: a hundred thousand Syrian foot soldiers killed in one day, and twenty-seven thousand more under a fallen wall. Large numbers like these are a long-standing problem in the Old Testament, and one proposal about them names this passage. The Hebrew word for “thousand” in both verses is *ʾelep*, which can also mean a family, a clan, or perhaps a military unit, and before vowels were written it looked the same as *ʾallûp*, a chief or commander. On that proposal the word for a trained soldier has in places been misread as “thousand,” and here “the little Israelite army killed 100 (not 100,000) foot-soldiers, and the wall of Aphek killed 27 (not 27,000) more.”

      That is a proposal about how the numbers were copied, not a claim about the battle. Either way the text counts the victory as the LORD's, promised by the man of God before the armies met (verse 28), and won by an army the chapter has just compared to “two little flocks of kids” (verse 27).
    sources: [ot-manual-large-numbers, oshb-wlc, lds-scriptures]

  - ref: 34
    phrase: So he made a covenant with him, and sent him away
    kind: history
    title: A treaty with the king of Syria
    body: |
      Ahab turned the LORD's victory into a treaty of his own. The Syrians came counting on the name of Israel's kings as “merciful kings” (verse 31), *malkê ḥesed*, kings of *ḥesed*, the word for kindness shown especially to the lowly, the needy and the wretched. They came in sackcloth with ropes on their heads, and they seized on Ahab's “he is my brother” the moment he said it (verse 33). The terms were Ben-hadad's own: the cities his father had taken would be given back, and Israel could have trading quarters (the Church's footnote: bazaars) in Damascus, as Syria had had in Samaria.

      Then came “three years without war between Syria and Israel” ([[1 Kgs. 22:1]]), until Ahab joined Jehoshaphat against Syria and was killed at Ramoth-gilead; the background to [[1 Kgs. 22:1]] tells what Israel and Syria did together in those years.
    sources: [bdb, bd-ahab, lds-scriptures]

  - ref: 36
    phrase: a lion shall slay thee
    kind: history
    title: The man who would not strike
    body: |
      The neighbor's refusal looks like kindness, but the text counts it as disobedience. The request came “in the word of the LORD” (verse 35), and to refuse it was not to have “obeyed the voice of the LORD.” He was killed by a lion, as the man of God from Judah had been when he set aside the word given him ([[1 Kgs. 13:24]]; see the note there). One older reading takes the two deaths alike: they show how severely any opposition to the LORD's commands given through His prophets was punished, “as a warning for others.”

      The same older reading takes the wound the second man gave as part of the message: not only a way to look like a soldier back from the battle, but a sign to Ahab of what he could expect from the Ben-hadad he had just released.
    sources: [keil-kings, lds-scriptures]

  - ref: 40
    phrase: So shall thy judgment be; thyself hast decided it
    kind: history
    title: A king sentences himself
    body: |
      The prophet's story works as a trap, and one older reading sets it beside the one Nathan set for David: a case put to the king as though it were real, so that he gives judgment before he knows the case is his own ([[2 Sam. 12:1–7]]; see the note at [[2 Sam. 12:7]]). The soldier in the story was given a prisoner to guard on pain of “thy life … for his life” or a talent of silver, and let him go while he was “busy here and there.” Ahab, who has just let Ben-hadad go, holds the soldier to his terms. Then the prophet pulls the covering from his face, Ahab sees one of the prophets, and the terms come back on the king: “thy life shall go for his life” (verse 42). (The covering is the “ashes” of the King James; the Hebrew behind it is a headband over the eyes.)

      The disguise puts this scene among a group of biblical stories in which someone comes before a king or a prophet in disguise, among them Ahab himself going into his last battle ([[1 Kgs. 22:30]]); the pattern is described in the note at [[1 Kgs. 14:2]]. In these stories the disguise is seen through, and God's will comes in a form the king can hardly accept. So it is here: the covering comes off, Ahab knows a prophet, and the judgment he has just given the soldier is the one he receives, “thy life shall go for his life” (verse 42), which is carried out at Ramoth-gilead ([[1 Kgs. 22:34–37]]).
    sources: [keil-kings, sc-knowhy-310, lds-scriptures]

  - ref: 42
    phrase: a man whom I appointed to utter destruction
    kind: words
    title: The man of the LORD’s ban
    body: |
      “A man whom I appointed to utter destruction” is in Hebrew *ʾîš ḥermî*, “the man of my *ḥērem*”: Ben-hadad was under the LORD's ban, devoted to Him by destruction (the word is explained at [[Deut. 7:2]]). That is why sparing him counted as disobedience, not mercy. What was devoted could not be bought back: “None devoted, which shall be devoted of men, shall be redeemed; but shall surely be put to death” ([[Lev. 27:29]]; see the note there). In the conquest of Canaan the ban was carried out in the battle itself, and there were to be no captives. The one exception was the enemy king, who could be brought to the commander and executed right after the fighting; to keep him alive afterward was, in effect, to keep a captive.

      Ahab's release of Ben-hadad has been set beside two earlier breaches of the ban that brought terrible consequences: Achan's keeping of spoil from Jericho ([[Josh. 7:1]]) and Saul's sparing of Agag and the best of the flocks ([[1 Sam. 15:9]]; see the note there). Ahab was in Saul's position: given a victory by the LORD, he kept the enemy king alive. The sentence was carried out in the next battle with the Syrians, where an arrow found Ahab in his chariot ([[1 Kgs. 22:34–37]]), and the Church's footnote at this verse points there. That death was the consequence of his failing to slay Ben-hadad as the Lord had commanded.
    sources: [bdb, oshb-wlc, calabro-herem, ot-manual-5, lds-scriptures]

christ: |
  The LORD who gave Ahab both victories so that Israel would “know that I am the LORD” is Jehovah, the premortal Jesus Christ (see the note at [[Ex. 3:14]]), and He is God of the valleys as well as of the hills. The same belief in gods bound to a territory lies behind the wheels of the throne in Ezekiel's vision, which likely taught the exiles that God was still with them wherever they were carried ([[Ezek. 1:15]]).

  For a disciple, no place, high or low, lies outside the reach of Christ's power and presence. Both sentences at the end of this chapter fall on men who set aside the word the LORD had spoken, the one who “hast not obeyed the voice of the LORD” (verse 36) and the king who let go “a man whom I appointed to utter destruction” (verse 42), and a disciple's covenant with Christ asks that the whole of His word be kept, including the part that is hard to keep.

