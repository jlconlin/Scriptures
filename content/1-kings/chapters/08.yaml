chapter: 8
title: Hear Thou in Heaven
tagline: The ark is carried into the finished house and the cloud of the LORD's glory fills it; Solomon asks whether God will indeed dwell on the earth, and prays that whenever Israel turns toward this house, from the land or from exile, the LORD will hear in heaven and forgive.
when: 'At the feast of the seventh month, Ethanim, after the house was finished ([[1 Kgs. 6:38]])'

setting: |
  Chapter 6 built the house and chapter 7 furnished it; chapter 8 brings the LORD into it. The ark had stood in a tent in the city of David since David carried it there ([[2 Sam. 6:17]]). Now the elders of every tribe gather, the priests carry it up to the new house, and the day unfolds in the order the chapter heading gives it: the ark set in the Holy of Holies, the glory of the LORD filling the house, Solomon's dedicatory prayer, and fourteen days of sacrifice and worship. Chronicles tells the day again, adding fire from heaven that consumed the sacrifices ([[2 Chr. 7:1]]).

  Latter-day Saints know this prayer at one remove. The prayer that dedicated the Kirtland Temple in 1836 begins in almost the same words as Solomon's, and temple dedications since have followed the pattern Solomon's set and Kirtland's renewed (see the note at verse 23).

  The plan and furnishings of the house are described at [[1 Kgs. 6:2]] and in the [Temple and Worship](/old-testament/guides/temple-and-worship/#temples) guide. The LORD's answer to this prayer, with its condition, comes in [[1 Kgs. 9:1–9]].

thread: |
  At the center of the chapter Solomon asks one question aloud: “will God indeed dwell on the earth?” ([[1 Kgs. 8:27]]). He has just seen Him come. The cloud has filled the house so that the priests cannot stand to minister, and Solomon has said, “I have surely built thee an house to dwell in, a settled place for thee to abide in for ever” ([[1 Kgs. 8:13]]). In the prayer he says what the house can and cannot be. The heaven of heavens cannot contain God. What the house can be is the place toward which Israel prays, and again and again Solomon asks the same thing: “hear thou in heaven,” and act, most often by forgiving.

  The petitions foresee a disputed oath, defeat, drought, famine and plague, war and exile, and the prayer does not pretend Israel will never need them: “there is no man that sinneth not” ([[1 Kgs. 8:46]]). It ends with a blessing and a charge, “Let your heart therefore be perfect with the LORD our God” ([[1 Kgs. 8:61]]). The prayer shows Solomon's own heart on that day, and the rest of the book shows how far he and his people later departed from it. The LORD's answer, in chapter 9, takes up the same condition ([[1 Kgs. 9:4–9]]).

sections:
  - range: 1-11
    heading: The ark comes to its place
    plain: |
      Then Solomon gathered the elders of Israel, the heads of the tribes and the leaders of the families, to him in Jerusalem, to bring the ark of the LORD's covenant up from the city of David, which is Zion. All the men of Israel gathered to King Solomon at the feast in the month Ethanim, the seventh month. When the elders had come, the priests took up the ark, and they brought up the ark, the tent of meeting, and all the holy vessels that were in the tent; the priests and the Levites carried them. King Solomon and the whole assembly of Israel gathered with him stood before the ark, sacrificing sheep and oxen in numbers too great to count or record.

      The priests brought the ark of the LORD's covenant to its place in the inner room of the house, the most holy place, under the wings of the cherubim. The cherubim spread their wings over the place of the ark, covering the ark and its carrying poles from above. The poles were so long that their ends could be seen from the holy place in front of the inner room, though not from outside, and they are there to this day. There was nothing in the ark except the two stone tablets that Moses put there at Horeb, when the LORD made a covenant with the Israelites after they came out of Egypt.

      When the priests came out of the holy place, the cloud filled the house of the LORD, so that the priests could not stand to do their service because of the cloud: the glory of the LORD had filled His house.
  - range: 12-21
    heading: Solomon speaks to the people
    plain: |
      Then Solomon said, “The LORD has said that He would dwell in the thick darkness. I have built You an exalted house, a settled place for You to dwell in forever.”

      The king turned around and blessed the whole assembly of Israel while they all stood. He said: “Blessed be the LORD God of Israel, who spoke with His own mouth to David my father and has fulfilled it with His own hand. He said, ‘Since the day I brought My people Israel out of Egypt I have chosen no city in all the tribes of Israel in which to build a house for My name to be there; but I chose David to be over My people Israel.’ My father David had it in his heart to build a house for the name of the LORD God of Israel. The LORD said to him, ‘You did well to have it in your heart to build a house for My name. Yet you will not build it; your son, who will come from your own body, will build the house for My name.’ The LORD has kept the promise He made: I have risen up in my father David's place and sit on Israel's throne, as the LORD promised, and I have built the house for the name of the LORD God of Israel. And I have made a place there for the ark, which holds the covenant the LORD made with our fathers when He brought them out of Egypt.”
  - range: 22-30
    heading: Will God indeed dwell on the earth?
    plain: |
      Solomon stood before the altar of the LORD in front of the whole assembly of Israel, spread out his hands toward heaven, and said: “LORD God of Israel, there is no God like You in heaven above or on earth below, who keeps covenant and shows loving kindness to Your servants who walk before You with all their heart. You have kept what You promised Your servant David my father; what You said with Your mouth You have fulfilled with Your hand this day. So now, LORD God of Israel, keep also what You promised him when You said, ‘You will never lack a man in My sight to sit on Israel's throne, if only your children watch their way and walk before Me as you have walked.’ Now, God of Israel, let the word You spoke to Your servant David my father be confirmed.

      “But will God really dwell on the earth? Heaven, even the highest heaven, cannot contain You; how much less this house that I have built! Yet turn to the prayer and plea of Your servant, O LORD my God, and listen to the cry and the prayer Your servant prays before You today: keep Your eyes open toward this house night and day, toward the place of which You said, ‘My name will be there,’ so that You will hear the prayer Your servant makes toward this place. Hear the pleas of Your servant and of Your people Israel when they pray toward this place. Hear in heaven, Your dwelling place, and when You hear, forgive.
  - range: 31-53
    heading: Seven petitions
    plain: |
      “If someone wrongs his neighbor and is made to swear an oath, and he comes and swears before Your altar in this house, then hear in heaven and act. Judge Your servants: condemn the guilty and bring his conduct down on his own head, and clear the innocent and reward him as his innocence deserves.

      “When Your people Israel are struck down before an enemy because they have sinned against You, and they turn back to You, confess Your name, and pray and plead with You in this house, then hear in heaven, forgive the sin of Your people Israel, and bring them back to the land You gave their fathers.

      “When the heavens are shut and there is no rain because they have sinned against You, and they pray toward this place, confess Your name, and turn from their sin because You have afflicted them, then hear in heaven and forgive the sin of Your servants, Your people Israel. Teach them the good way they should walk in, and send rain on Your land, which You gave Your people as an inheritance.

      “If there is famine in the land, or plague, scorching wind or mildew, locust or grasshopper; if an enemy besieges them in their cities; whatever plague or sickness there is, then whatever prayer or plea is made by any one person or by all Your people Israel, each knowing the affliction of his own heart and spreading out his hands toward this house, hear in heaven Your dwelling place, and forgive, and act. Give to each one according to all his ways, since You know his heart (for You, You alone, know the hearts of all people), so that they will fear You all the days they live in the land You gave our fathers.

      “And the foreigner who is not of Your people Israel but comes from a distant country for the sake of Your name (for they will hear of Your great name, Your strong hand and Your outstretched arm): when he comes and prays toward this house, hear in heaven Your dwelling place and do all that he asks of You, so that all the peoples of the earth may know Your name and fear You as Your people Israel do, and may know that this house I have built is called by Your name.

      “When Your people go out to battle against their enemy, wherever You send them, and they pray to the LORD toward the city You have chosen and the house I have built for Your name, then hear their prayer and plea in heaven and uphold their cause.

      “When they sin against You (for there is no one who does not sin), and You are angry with them and give them over to an enemy who carries them captive to his land, far or near, yet if they take it to heart in the land where they are captives, and turn back, and plead with You in the land of their captors, saying, ‘We have sinned, we have done wrong, we have acted wickedly’; if they return to You with all their heart and all their soul in the land of the enemies who took them captive, and pray to You toward their land, which You gave their fathers, toward the city You have chosen and the house I have built for Your name, then hear their prayer and plea in heaven Your dwelling place and uphold their cause. Forgive Your people who have sinned against You and all the wrongs they have done against You, and make their captors show them compassion. For they are Your people and Your inheritance, whom You brought out of Egypt, out of the iron furnace. May Your eyes be open to the plea of Your servant and of Your people Israel, to listen to them whenever they call to You. For You set them apart from all the peoples of the earth to be Your inheritance, as You said through Your servant Moses when You brought our fathers out of Egypt, O Lord GOD.”
  - range: 54-61
    heading: The blessing
    plain: |
      When Solomon had finished offering all this prayer and plea to the LORD, he rose from before the altar of the LORD, where he had been kneeling with his hands spread out toward heaven. He stood and blessed the whole assembly of Israel in a loud voice: “Blessed be the LORD, who has given rest to His people Israel, just as He promised. Not one word has failed of all the good promise He gave through His servant Moses. May the LORD our God be with us as He was with our fathers; may He never leave us or forsake us. May He turn our hearts to Himself, to walk in all His ways and keep His commandments, statutes and judgments, which He commanded our fathers. May these words of my plea before the LORD be near the LORD our God day and night, so that He upholds the cause of His servant and of His people Israel as each day requires, so that all the peoples of the earth may know that the LORD is God and there is no other. So let your heart be wholly true to the LORD our God, to walk in His statutes and keep His commandments, as you do today.”
  - range: 62-66
    heading: The sacrifices and the feast
    plain: |
      Then the king and all Israel with him offered sacrifices before the LORD. Solomon offered peace offerings to the LORD: twenty-two thousand oxen and a hundred and twenty thousand sheep. So the king and all the Israelites dedicated the house of the LORD. That same day the king consecrated the middle of the courtyard in front of the house of the LORD, and offered there the burnt offerings, the grain offerings and the fat of the peace offerings, because the bronze altar before the LORD was too small to hold them all.

      So Solomon held the feast at that time, and all Israel with him, a great assembly from Lebo-hamath in the north to the brook of Egypt in the south, before the LORD our God, seven days and seven more, fourteen days. On the eighth day he sent the people away. They blessed the king and went home to their tents, joyful and glad at heart for all the good the LORD had done for His servant David and for His people Israel.

notes:
  - ref: 2
    phrase: at the feast in the month Ethanim, which is the seventh month
    kind: history
    title: The feast of the seventh month
    body: |
      Solomon timed the dedication to the Feast of Tabernacles, the autumn festival at which the law required every man of Israel to appear “in the place that He should choose.” It ran from the fifteenth to the twenty-first of the seventh month, with an eighth day added, and later Jews counted it the most joyful of all the feasts. Ethanim is the month later called Tishri, the month that also holds the Day of Atonement. The feast is a harvest festival that also remembers the Exodus, kept in temporary shelters. Holding the dedication then has been read as symbolizing the house Israel built for the LORD to live in.

      The timing also explains the end of the chapter. The feast lasted “seven days and seven days, even fourteen days” ([[1 Kgs. 8:65]]), and Chronicles explains the doubling: “they kept the dedication of the altar seven days, and the feast seven days” ([[2 Chr. 7:9]]). The people went home “unto their tents” ([[1 Kgs. 8:66]]).

      The Book of Mormon has a gathering of the same kind. King Benjamin's people came by families and pitched their tents round about the temple ([[Mosiah 2:5–6]]), and that gathering has been read as like the Feast of Tabernacles, with Solomon's dedication as the precedent: tents are named there too, at a feast of the seventh month that “has generally been thought of as a Feast of Tabernacles.”
    sources: [bd-feasts, ot-minute-1-kings-8, sc-knowhy-394, lds-scriptures]

  - ref: 8
    phrase: and there they are unto this day
    kind: history
    title: Written while the temple stood
    body: |
      “This day” is the writer's day, not Solomon's. The line describes the carrying poles of the ark as still in place when it was written, which places at least this line some time after the dedication and before the temple was destroyed. The book of Kings as we have it runs on past that destruction ([[2 Kgs. 25:9]]) to the final captivity of Judah, and it was compiled by an unknown writer from a variety of written documents (see the setting of [[1 Kgs. 1:1]]). The line keeps the voice of someone who could still have gone up to the temple and seen the poles.
    sources: [ot-minute-1-kings-8, bd-kings-books-of]

  - ref: 9
    phrase: There was nothing in the ark save the two tables of stone
    kind: history
    title: Only the two tables of stone
    body: |
      The verse is emphatic: only the two tables were in the ark. That raises a question, because Hebrews describes the ark “wherein was the golden pot that had manna, and Aaron’s rod that budded, and the tables of the covenant” ([[Heb. 9:4]]). The manna and the rod had been ordered kept “before the Testimony,” the tables of the law ([[Ex. 16:34]]; [[Num. 17:10]]; see the note at [[Ex. 16:34]]). Whether they were ever inside the ark, and what became of them by Solomon's day, the text does not say. The book Moses wrote was laid beside the ark, not in it (see the note at [[Deut. 31:26]]).

      What the verse stresses is what remained. Solomon calls the ark the place “wherein is the covenant of the LORD” ([[1 Kgs. 8:21]]): the tables Moses put there at Horeb, which is Sinai. At the heart of the cedar and gold, in the innermost room, the house held the covenant written in stone.
    sources: [bd-ark-of-the-covenant, ot-minute-1-kings-8, lds-scriptures]

  - ref: 11
    phrase: for the glory of the LORD had filled the house of the LORD
    kind: symbol
    title: The cloud of glory
    body: |
      The cloud marks the very presence of the LORD in the house. Later Jews called it the Shechinah, “The Presence”: the cloud of brightness and glory that marked the presence of the Lord. Joseph Smith described this presence in his First Vision as a light “above the brightness of the sun” ([[JS—H 1:16]]). The house was finished, and now the priests “could not stand to minister because of the cloud.” The same thing happened when the tabernacle was raised, when even Moses could not enter ([[Ex. 40:35]]). The note at [[Ex. 40:34]] follows that cloud to the latter-day promises of [[D&C 84:5]] and [[D&C 109:12]].

      A like sign attended the dedication of the Kirtland Temple on March 27, 1836, when people outside saw a bright cloud and a pillar of fire resting over the temple.
    sources: [bd-shechinah, ot-minute-1-kings-8, ot-manual-kings-1, scripture-helps-2-samuel-11, lds-scriptures]

  - ref: 12
    phrase: The LORD said that he would dwell in the thick darkness
    kind: symbol
    title: Thick darkness
    body: |
      Solomon names the cloud with the word used at Sinai. “Thick darkness” is *ʿărāpel*, a heavy cloud, the cloud “in which God dwells” both here and when Moses drew near “unto the thick darkness where God was” ([[Ex. 20:21]]). It is darkness that hides the light, not darkness without it (see the note at [[Ex. 20:21]]).

      No verse records the LORD saying these words; Solomon seems to quote a saying of the LORD's, perhaps from Sinai itself. The ancient Greek translation, the Septuagint, has a fuller form of the saying and places it after the prayer: “He manifested the sun in the heaven: the Lord said he would dwell in darkness: build thou my house,” and it adds, “is not this written in the book of the song?” However it was first spoken, Solomon sets it beside his own claim in the next verse, a house built as “a settled place for thee to abide in for ever” ([[1 Kgs. 8:13]]). The God who hides Himself in cloud has come to a house, and verse 27 will say what that can and cannot mean.
    sources: [bdb, oshb-wlc, ot-minute-1-kings-8, lxx-rahlfs]

  - ref: 22
    phrase: spread forth his hands toward heaven
    kind: history
    title: Hands spread toward heaven
    body: |
      Solomon prayed with his hands raised to heaven. Scripture records prayer with uplifted hands many times, most often in connection with the first temple: “I will lift up my hands in thy name” ([[Ps. 63:4]]). He began standing before the altar and ended on his knees with his hands still spread ([[1 Kgs. 8:54]]). The “stood” of verse 22 may mean only that he was before the altar, not that he stood throughout.

      It was the king, not the high priest, who offered the prayer, and it has been read as the first and only time a king of Israel was permitted this priestly function; by contrast, when King Uzziah later tried to burn incense in the temple, he was struck with leprosy ([[2 Chr. 26:18–19]]). The posture returned at Kirtland in 1836, where Joseph Smith “stood, raised his arms, and with tears running down his cheeks, offered the prayer of dedication.”
    sources: [sc-knowhy-638, ot-minute-1-kings-8, madsen-solomons-temple, sc-knowhy-814]

  - ref: 23
    phrase: who keepest covenant and mercy with thy servants that walk before thee with all their heart
    kind: scripture
    title: The prayer behind D&C 109
    body: |
      The prayer that dedicated the Kirtland Temple, given to Joseph Smith and other leaders by revelation, opens in almost the same words as this verse, the first words of Solomon's prayer. Solomon praised the God “who keepest covenant and mercy with thy servants that walk before thee with all their heart” ([[1 Kgs. 8:23]]); Doctrine and Covenants 109 begins, “Thanks be to thy name, O Lord God of Israel, who keepest covenant and showest mercy unto thy servants who walk uprightly before thee, with all their hearts” ([[D&C 109:1]]). Both prayers start with the covenant, before they ask for anything.

      The likeness goes past the opening words. Both ask protection from enemies (verses 44–45; [[D&C 109:22–33]]). Both look to a scattered Israel: Solomon foresaw captivity and asked forgiveness and compassion for the repentant captives (verses 46–53), and Joseph Smith prayed for the gathering of Israel and the redemption of Jerusalem and Judah ([[D&C 109:54–67]]). Both temples were built to make the Lord's people ready: when his prayer was done Solomon charged the people, “Let your heart therefore be perfect” (verse 61), and Joseph Smith's prayer closes asking that the Saints be clothed with robes of righteousness and crowned with glory ([[D&C 109:76]]). President Russell M. Nelson has taught that Solomon's dedicatory prayer provides patterns used for temples today (the [Temple and Worship](/old-testament/guides/temple-and-worship/#temples) guide quotes him).
    sources: [lds-scriptures, sc-knowhy-814]

  - ref: 27
    phrase: the heaven and heaven of heavens cannot contain thee
    kind: scripture
    title: A house that cannot contain Him
    body: |
      Solomon has just called the house “a settled place for thee to abide in for ever” ([[1 Kgs. 8:13]]), and now he asks whether that can be true. His answer is no and yes. No building holds God: the heavens themselves, even the highest, cannot contain Him. Yet the house is real, and the rest of the prayer says what it is for. It is the place toward which prayer is made, and heaven is where the prayer is heard: “hear thou in heaven thy dwelling place: and when thou hearest, forgive” ([[1 Kgs. 8:30]]).

      Stephen and Paul both said that “the most High dwelleth not in temples made with hands” ([[Acts 7:48]]; [[Acts 17:24]]). Neither statement rejects the temple. Each argues against the idea that God can be confined to a building, and Solomon said the same thing on the day he dedicated one.
    sources: [lds-scriptures, eom-temples]

  - ref: 29
    phrase: that thou mayest hearken unto the prayer which thy servant shall make toward this place
    kind: history
    title: Praying toward the house
    body: |
      The house is the place the LORD has chosen for His name (what it means to put the name there is the note at [[1 Kgs. 9:3]]), the place Deuteronomy had said He would choose ([[Deut. 12:5]]). Prayer was one of its chief purposes, and the petitions that follow picture Israel praying toward it from wherever they are: at its altar (verse 31), in the land (verses 35, 38), on campaign (verse 44), and in a far country as captives (verse 48). Daniel later prayed so in Babylon, with his windows open toward Jerusalem (see the note at [[Dan. 6:10]]).

      The same plea was made in this dispensation. Dedicating the Salt Lake Temple in 1893, President Wilford Woodruff echoed Solomon: “when Thy people shall not have the opportunity of entering this holy house to offer their supplications unto Thee, and they are oppressed and in trouble … and shall turn their faces towards this Thy holy house,” he asked the Lord to hear them. Both dedications asked the Lord to hear the prayers of people in distress who turned toward His house, and to remember His promises to them wherever they were.
    sources: [ot-minute-1-kings-8, madsen-solomons-temple, lds-scriptures]

  - ref: 35
    phrase: When heaven is shut up, and there is no rain
    kind: scripture
    title: When heaven is shut up
    body: |
      Solomon is asking the LORD to honor a term of the covenant. Moses had warned that if Israel served other gods, the LORD would be angry “and he shut up the heaven, that there be no rain” ([[Deut. 11:17]]). The petition is that when drought comes for that reason, and the people pray toward the house, confess His name and turn from their sin, He will forgive and send rain. “The Lord uses the weather sometimes to discipline his people,” President Spencer W. Kimball taught, and these verses are read as a promise that when the people repent and look to the house of the Lord in prayer, the weather can be tempered in their behalf.

      This part of the prayer foreshadows the drought of Elijah's day, when Elijah shut the heavens: “there shall not be dew nor rain these years, but according to my word” ([[1 Kgs. 17:1]]). On Carmel the people fell on their faces and said, “The LORD, he is the God” ([[1 Kgs. 18:39]]), literally confessing the LORD's name as verse 35 asks, and the rain came after Elijah prayed on the mountain ([[1 Kgs. 18:41–45]]). The Book of Mormon has the same pattern. Nephi, the son of Helaman, asked the Lord to send a famine in place of war ([[Hel. 11:4]]), which may mean that he had sealed the heavens as Elijah did; as chief priest he would probably have associated priesthood power in the temple with the blessings these verses ask for: rain, relief from famine, and help against enemies.
    sources: [lds-scriptures, ot-manual-kings-1, ot-minute-1-kings-8, sc-knowhy-182]

  - ref: 41
    phrase: Moreover concerning a stranger, that is not of thy people Israel
    kind: scripture
    title: The stranger from a far country
    body: |
      Solomon asks that the LORD hear the foreigner too, the one who comes “out of a far country for thy name’s sake” and prays toward the house, and he gives the reason: “that all people of the earth may know thy name” ([[1 Kgs. 8:43]]). Non-Israelites could come to the temple and expect God to hear them. The blessing at the end of the chapter gives the same purpose for all the LORD does for Israel: “that all the people of the earth may know that the LORD is God, and that there is none else” ([[1 Kgs. 8:60]]).

      Isaiah promises that the prayer will be answered: the LORD's house “shall be called an house of prayer for all people,” the words Jesus quoted when He cleansed the temple ([[Mark 11:17]]; see the note at [[Isa. 56:7]]).
    sources: [ot-minute-1-kings-8, lds-scriptures]

  - ref: 47
    phrase: Yet if they shall bethink themselves
    kind: words
    title: Bringing the heart back
    body: |
      “Bethink themselves” is in Hebrew *hēšîbû ʾel-libbām*, literally *bring back to their heart*, an idiom meaning “bring back to mind, take into consideration.” The verb is *šûb*, “return,” and the petition turns on it. Exiles first bring the matter back to heart; then they repent (*šābû*, they turn back); and then they “return unto thee with all their heart” ([[1 Kgs. 8:48]]). Each step is the same verb.

      The setting is captivity: they are in the land where they were carried captive and plead in the land of their captors, and the verses seem to look ahead to the Babylonian exile. The confession Solomon gives them, “We have sinned, and have done perversely, we have committed wickedness” ([[1 Kgs. 8:47]]), is nearly the one Daniel prayed in that exile (see the note at [[Dan. 9:5]]).

      The theme page [A Hearing Heart](/1-kings/themes/hearing-heart/) reads Zenos's prayer in Alma 33 as this petition answered, a reading of its own.
    sources: [bdb, oshb-wlc, ot-minute-1-kings-8]

  - ref: 61
    phrase: Let your heart therefore be perfect with the LORD our God
    kind: words
    title: A heart whole with the LORD
    body: |
      “Perfect” here is *šālēm*, whole or complete, the word used of the temple's stones, finished before they were brought to the site ([[1 Kgs. 6:7]]). Said of the heart “with the LORD,” it means “a mind at peace with” Him, “keeping covt. relation, hence complete, perfect.” The charge is to a heart kept whole in covenant with the LORD, “to walk in his statutes, and to keep his commandments, as at this day” ([[1 Kgs. 8:61]]).

      Later the same phrase is turned around. When Solomon was old his wives turned his heart after other gods, “and his heart was not perfect with the LORD his God” ([[1 Kgs. 11:4]]), the same Hebrew phrase. The man who gave the charge did not keep it; how the Joseph Smith Translation reads that verse is the note at [[1 Kgs. 11:4]].
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 63
    phrase: two and twenty thousand oxen, and an hundred and twenty thousand sheep
    kind: history
    title: 142,000 animals
    body: |
      The numbers of animals are the same in Chronicles ([[2 Chr. 7:5]]), and the next verse acknowledges their scale: Solomon consecrated the middle of the court for the offerings, because the bronze altar was too small to hold them ([[1 Kgs. 8:64]]). Still, the numbers are vast. Some Old Testament numbers “seem too large in light of known facts,” and numbers were particularly liable to error as the text was handed down. In the older style of Hebrew writing a single letter could turn “three” into “thirty,” and a scribe copying a numeral is not kept right by the context as he is with other words.

      One older reading defends the figures as they stand. The offerings were given by the king and all Israel together, as the verse says (“So the king and all the children of Israel dedicated the house of the LORD,” [[1 Kgs. 8:63]]), not by Solomon alone; under the law any Israelite could slaughter and prepare a sacrifice, and only the sprinkling of the blood and the burning on the altar belonged to the priests. It points to a Passover in Nero's reign at which some 250,000 paschal lambs were counted, slaughtered within a few hours.
    sources: [lds-scriptures, ot-manual-large-numbers, keil-kings]

christ: |
  The LORD to whom Solomon prayed is the one who “knowest the hearts of all the children of men” ([[1 Kgs. 8:39]]), and the prayer asks Him, again and again, to hear from heaven and forgive. The glory that filled Solomon's house and the signs at Kirtland were both tokens of the Lord's acceptance of a house built in His name, and a week after the Kirtland prayer the Lord came to that house, speaking with “the voice of Jehovah” ([[D&C 110:3]]), and said so Himself: “I am he who liveth, I am he who was slain; I am your advocate with the Father” ([[D&C 110:4]]), and “I have accepted this house, and my name shall be here; and I will manifest myself to my people in mercy in this house” ([[D&C 110:7]]).

  For a disciple now, the promise of this chapter is that the one who hears is Christ, who knows each heart and forgives the one who turns back to Him.

