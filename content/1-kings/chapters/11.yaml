chapter: 11
title: His Wives Turned Away His Heart
tagline: In his old age Solomon's foreign wives turn his heart to their gods; the LORD raises adversaries against him, and the prophet Ahijah tears a new garment into twelve pieces and gives ten to Jeroboam.
when: 'Solomon''s old age (verse 4), to his death after a reign of forty years (verse 42)'

setting: |
  Chapter 10 ended with Solomon greater than all the kings of the earth in riches and wisdom ([[1 Kgs. 10:23]]). Chapter 11 tells how that reign ended, and it closes the account of Solomon. It has four movements: the foreign wives and their gods (verses 1–8), the LORD's sentence on Solomon (verses 9–13), two foreign adversaries, Hadad of Edom and Rezon of Damascus (verses 14–25), and the servant Jeroboam, to whom the prophet Ahijah gives ten tribes in a sign (verses 26–40). The chapter ends with the formula that closes the reigns in Kings: the rest of the king's acts are written in another book, here “the book of the acts of Solomon” (verse 41), and his son reigns in his stead. That book and the formula are explained at [[1 Kgs. 14:19]].

  What Ahijah foretells happens in the next chapter, when the ten tribes reject Solomon's son Rehoboam and make Jeroboam king, and the text says the LORD brought it about “that he might perform his saying, which the LORD spake by Ahijah the Shilonite” ([[1 Kgs. 12:15]]). The Church's footnotes print five Joseph Smith Translation readings in this chapter, and each of them changes what the chapter says about David.

thread: |
  The chapter turns on Solomon's heart. At Gibeon he had asked for a hearing heart ([[1 Kgs. 3:9]]); now, “when Solomon was old,” his wives turn his heart after other gods (verse 4), and the LORD is angry “because his heart was turned” from the God who had appeared to him twice (verse 9). The sentence that follows is spoken in one verb: the LORD will rend the kingdom (verses 11–13). He tempers it twice for David's sake, not in Solomon's days and not all of it, and Ahijah then acts the verb out, tearing a new garment and handing Jeroboam ten of its twelve pieces as the LORD's own word (verses 30–31).

  Jeroboam receives the promise Solomon had received, a sure house on the condition that he walk as David walked (verse 38). The Joseph Smith Translation sharpens what “as David” means. In its reading Solomon's heart “became as the heart of David his father,” and the difference left between the two kings is that Solomon “repenteth not as did David his father, that I may forgive him” (JST 1 Kgs. 11:4, 33). The kingdom is torn for a heart that turned and did not turn back.

sections:
  - range: 1-8
    heading: The wives and their gods
    plain: |
      King Solomon loved many foreign women besides Pharaoh's daughter: women of Moab, Ammon, Edom, Sidon, and the Hittites. These came from the nations the LORD had warned Israel about: “Do not marry them, and do not let them marry you, because they will surely turn your hearts to their gods.” Solomon held fast to them in love. He had seven hundred wives of royal rank and three hundred concubines, and his wives turned his heart away. When Solomon was old, his wives turned his heart after other gods, and his heart was not wholly true to the LORD his God, as his father David's heart had been. Solomon followed Ashtoreth, the goddess of the Sidonians, and Milcom, the detestable god of the Ammonites. He did what was evil in the LORD's sight and did not follow the LORD fully, as his father David had. On the hill facing Jerusalem he built a high place for Chemosh, the detestable god of Moab, and for Molech, the detestable god of the Ammonites. He did the same for all his foreign wives, who burned incense and offered sacrifices to their gods.
  - range: 9-13
    heading: The LORD's sentence
    plain: |
      The LORD was angry with Solomon, because his heart had turned away from the LORD, the God of Israel, who had appeared to him twice and had commanded him on this very point not to follow other gods; but he did not keep the command. So the LORD said to Solomon, “Since you have done this and have not kept My covenant and the statutes I commanded you, I will surely tear the kingdom away from you and give it to your servant. But for the sake of your father David I will not do it in your lifetime; I will tear it out of your son's hand. Even then I will not tear away the whole kingdom. I will give your son one tribe, for the sake of My servant David and for the sake of Jerusalem, which I have chosen.”
  - range: 14-25
    heading: Hadad and Rezon
    plain: |
      The LORD raised up an enemy against Solomon: Hadad the Edomite, who was of the royal family of Edom. Years before, when David was at war with Edom, Joab the commander of the army went up to bury the dead after he had struck down every man in Edom; Joab and all Israel stayed there six months, until they had killed every male in Edom. Hadad, still a small boy, escaped to Egypt with some Edomite servants of his father. They set out from Midian, came to Paran, took men with them from Paran, and reached Pharaoh king of Egypt, who gave Hadad a house, food, and land. Hadad won such favor with Pharaoh that Pharaoh gave him as wife the sister of his own wife, Queen Tahpenes. She bore Hadad a son, Genubath, whom Tahpenes weaned in Pharaoh's house, and Genubath grew up in Pharaoh's household among Pharaoh's sons. When Hadad heard in Egypt that David had died and that Joab the commander was dead, he said to Pharaoh, “Let me go, so that I can return to my own country.” Pharaoh asked, “What have you lacked here, that you want to go home?” “Nothing,” he answered, “but please let me go.” God raised up another enemy against Solomon: Rezon son of Eliadah, who had fled from his master Hadadezer king of Zobah. After David defeated Zobah, Rezon gathered men around him and became the leader of a raiding band. They went to Damascus, settled there, and ruled it. Rezon was Israel's enemy as long as Solomon lived, adding to the harm Hadad did; he hated Israel and ruled over Syria.
  - range: 26-40
    heading: Ahijah and Jeroboam
    plain: |
      Jeroboam son of Nebat, an Ephraimite from Zeredah, also rebelled against the king. He was one of Solomon's officials, and his mother was a widow named Zeruah. This is how he came to rebel. Solomon was building the Millo and closing up the gap in the city of his father David. Jeroboam was a capable man, and when Solomon saw how hard the young man worked, he put him in charge of all the forced labor of the house of Joseph. At that time, as Jeroboam was leaving Jerusalem, the prophet Ahijah of Shiloh met him on the road. Ahijah was wearing a new cloak, and the two of them were alone in the open country. Ahijah took hold of the new cloak he was wearing, tore it into twelve pieces, and said to Jeroboam, “Take ten pieces for yourself. This is what the LORD, the God of Israel, says: ‘I am going to tear the kingdom out of Solomon's hand and give you ten tribes. He will keep one tribe, for the sake of My servant David and for the sake of Jerusalem, the city I have chosen out of all the tribes of Israel. I will do this because they have forsaken Me and worshipped Ashtoreth the goddess of the Sidonians, Chemosh the god of Moab, and Milcom the god of the Ammonites, and have not walked in My ways, doing what is right in My eyes and keeping My statutes and judgments, as his father David did. But I will not take the whole kingdom out of his hand. I will keep him ruler all his life, for the sake of My servant David, whom I chose and who kept My commandments and statutes. I will take the kingdom out of his son's hand and give ten tribes to you. I will give his son one tribe, so that My servant David may always have a lamp before Me in Jerusalem, the city I chose to put My name there. And I will take you, and you will reign over all that you desire, and you will be king over Israel. If you listen to all I command you, walk in My ways, and do what is right in My sight, keeping My statutes and commandments as My servant David did, I will be with you. I will build you a lasting dynasty, as I built for David, and I will give Israel to you. Because of this I will humble David's descendants, but not forever.’” Solomon then tried to kill Jeroboam, but Jeroboam fled to Egypt, to Shishak king of Egypt, and stayed there until Solomon died.
  - range: 41-43
    heading: The death of Solomon
    plain: |
      The rest of Solomon's acts, all that he did, and his wisdom are written in the book of the acts of Solomon. Solomon reigned in Jerusalem over all Israel forty years. Then Solomon died and was buried in the city of his father David, and his son Rehoboam became king in his place.

notes:
  - ref: 1
    phrase: loved many strange women
    kind: words
    title: Strange women
    body: |
      “Strange” is the King James word for foreign, and the charge of verse 1 is that Solomon's wives came from outside the covenant. In marrying these women Solomon broke the Lord's command not to marry outside the covenant; many of the marriages were likely made for political and economic reasons. The nations in the list are the ones whose gods appear in verses 5–8: Sidon, Ammon, Moab. The heir to the throne was the son of one of these marriages: Rehoboam's mother was “Naamah an Ammonitess” ([[1 Kgs. 14:21]]).

      The command quoted in verse 2 does not match any one passage of the Law word for word. The nearest is [[Deut. 7:1–4]], which forbids marriage with the nations Israel would find in the land, the Hittites among them, “For they will turn away thy son from following me” ([[Deut. 7:4]]). The law of the king also seems to stand behind the condemnation: “Neither shall he multiply wives to himself, that his heart turn not away” ([[Deut. 17:17]]). Both laws give the same reason, and verses 3 and 4 report it happening in the same words: the wives “turned away his heart.” How Solomon's reign shows each of the king's three temptations, horses, wives and gold, is the subject of the note at [[Deut. 17:16]].
    sources: [scripture-helps-2-samuel-11, ot-minute-1-kings-11, sears-shannon-polygamy, lds-scriptures]

  - ref: 3
    phrase: seven hundred wives, princesses, and three hundred concubines
    kind: scripture
    title: What latter-day scripture says of Solomon's wives
    body: |
      Latter-day scripture speaks of Solomon's wives in two places. In the revelation on marriage the Lord names Solomon among the servants He “justified … as touching the principle and doctrine of their having many wives and concubines” ([[D&C 132:1]]) and says that “in nothing did they sin save in those things which they received not of me” ([[D&C 132:38]]). Jacob, rebuking the Nephites, says: “David and Solomon truly had many wives and concubines, which thing was abominable before me, saith the Lord” ([[Jacob 2:24]]). The Church's reading holds the two together: some of Solomon's marriages were authorized by the Lord and many were not, and those that were not are the ones Jacob calls abominable. The line between them falls in time: the Lord blessed Solomon and gave him visions while he had plural wives, “but later in his life, he took wives that the Lord did not give him,” as President Joseph Fielding Smith taught. That agrees with verse 4, which places the turning “when Solomon was old.”

      The text's charge against these marriages is what they did to Solomon's heart, and it says so twice (verses 3 and 4). The figures themselves, round numbers that add up to an even thousand, may be an exaggeration or a stylization by the writer, though Solomon certainly had many wives.

      Jacob names David and Solomon but not Abraham or Jacob, who also had more than one wife. The omission may mean that what Jacob condemned “wasn't plural marriage itself, but rather women being exploited for social and material benefit in relationships unapproved by God.” What the scriptures teach about plural marriage as such is gathered in the [*Women and Marriage* guide](/old-testament/guides/women-and-marriage/#plural-marriage).
    sources: [ot-minute-1-kings-11, scripture-helps-2-samuel-11, ot-manual-kings-1, sc-knowhy-64, lds-scriptures]

  - ref: 4
    phrase: as was the heart of David his father
    kind: scripture
    title: As the heart of David
    body: |
      The Joseph Smith Translation makes David not the standard Solomon fell short of but the example he came to resemble. The King James says Solomon's heart was not perfect with the LORD “as was the heart of David his father.” Joseph Smith's manuscript reads, “his heart was not perfect with the Lord his God, and it became as the heart of David his Father.” In verse 6 the revision moves one phrase and so reverses the sense: Solomon “did evil in the sight of the Lord, as David his Father, and went not fully after the Lord.”

      Verse 33 then names the difference between the two kings. To the charge that Solomon has not walked in the LORD's ways the manuscript adds: “and his heart is become as David his father; and he repenteth not as did David his Father, that I may forgive him.” In verse 34, where the LORD spares Solomon for the sake of David, who kept His commandments, the revision adds “in that day,” which a Latter-day Saint study of these changes reads as limiting David's obedience to a time and implying that it did not last all his life. Why Kings holds David up as the measure of a king, and why the Joseph Smith Translation qualifies it, is explained at [[1 Kgs. 3:14]]. Here the qualification gives the reason Solomon is not forgiven: he did evil as David had, and he did not repent as David did. Verse 39 carries the same theme into the sentence itself: the manuscript opens it, “And for the transgression of David, and also for the People I have rent the kingdom,” which places the blame on both the king and the people.
    sources: [jsp-ot2, nyman-jst-historical, lds-scriptures]

  - ref: 5
    phrase: Ashtoreth the goddess of the Zidonians
    kind: history
    title: Ashtoreth, Milcom, Chemosh and Molech
    body: |
      The gods of verses 5–8 are the gods of the wives' own peoples, as verse 8 says: Solomon built for “all his strange wives” what they needed to worship their gods. Ashtoreth was an ancient Semitic goddess, worshipped in Phoenicia, and here as the goddess of Sidon. Milcom and Molech are one god, the Ammonites' fire god, “worshipped by passing children through or burning them in fire,” and Solomon is named among those who practiced that worship; the law against it is the note at [[Lev. 18:21]]. Chemosh was the god of Moab, also worshipped with human sacrifice ([[2 Kgs. 3:27]]).

      “Abomination,” the title the narrator gives Milcom, Chemosh and Molech, is the word for a detested thing, the usual word for an idol. The “hill that is before Jerusalem” of verse 7 is the Mount of Olives. The high places Solomon built there for these three gods stood until Josiah defiled them, and the account of that reform calls the hill “the mount of corruption” ([[2 Kgs. 23:13]]). What a high place was is explained at [[1 Kgs. 3:2]].
    sources: [bdb, bd-molech, bd-chemosh, lds-scriptures]

  - ref: 9
    phrase: which had appeared unto him twice
    kind: prophets
    title: After two visions
    body: |
      Verses 9–10 measure Solomon's fall by what he had been given. The LORD had appeared to him at Gibeon ([[1 Kgs. 3:5]]) and again after the temple was dedicated ([[1 Kgs. 9:2]]), and in the second vision He had named this very sin: if Solomon or his children would “go and serve other gods, and worship them” ([[1 Kgs. 9:6]]), Israel would be cut off and the house cast out of His sight. That is the command verse 10 means by “had commanded him concerning this thing.” How that condition hangs over the temple is the note at [[1 Kgs. 9:6]].

      The order of events is the lesson Elder Joseph B. Wirthlin drew: “even after heavenly visitations, even after receiving blessings above all men, Solomon turned away from the Lord,” and so the kingdom was decreed to be torn from him and given to his servant. Visions given earlier in his reign did not keep the heart of his old age (verse 4).
    sources: [wirthlin-higher-ground-2005, lds-scriptures]

  - ref: 14
    phrase: the LORD stirred up an adversary unto Solomon
    kind: history
    title: Adversaries the LORD raised
    body: |
      Hadad and Rezon are presented as the LORD's answer to Solomon's turned heart: “the LORD stirred up an adversary” (verse 14), and “God stirred him up another adversary” (verse 23).

      Hadad was “of the king's seed in Edom,” that is, of its royal line. As a child he escaped to Egypt when Joab killed the men of Edom, married into Pharaoh's household, and asked to go home once he heard that David and Joab were dead. Rezon had broken away from Hadadezer king of Zobah, whom David defeated, and made himself king in Damascus, where he troubled Israel “all the days of Solomon.” Both may have taken their territory from Solomon's realm during his lifetime; since these lands were not tribes of Israel, this may be how the LORD could still say the kingdom would not be torn in Solomon's days (verse 12).
    sources: [ot-minute-1-kings-11]

  - ref: 28
    phrase: ruler over all the charge of the house of Joseph
    kind: history
    title: Jeroboam and the forced labor
    body: |
      Jeroboam was an official of Solomon's labor gangs. The “charge” he was given is the Hebrew *sēbel*, a load or burden, used here of burdensome forced labor; the “house of Joseph” is the tribes of Joseph's sons Ephraim and Manasseh, and Jeroboam was an Ephraimite himself (the King James “Ephrathite” of verse 26 means a man of Ephraim). The work was Solomon's building: the Millo (a structure or earthwork in the defenses of Jerusalem whose exact meaning is unclear) and the repair of the city of David (verse 27).

      Verse 27 promises to tell “the cause that he lifted up his hand against the king,” and then gives only the occasion; in one older reading, that is all the text relates of the rebellion. The burdens themselves return in the next chapter, where Rehoboam's refusal to lighten them divides the kingdom ([[1 Kgs. 12:4]]).
    sources: [bdb, oshb-wlc, ot-minute-1-kings-11, keil-kings, scripture-helps-2-samuel-11]

  - ref: 30
    phrase: rent it in twelve pieces
    kind: symbol
    title: The torn garment
    body: |
      Ahijah's torn garment is a prophetic sign: the prophet acts the word out, then speaks it. It belongs with the other symbolic acts the prophets performed as oracles, Jeremiah's yoke and broken bottle and Isaiah's walking naked among them. The verb is the LORD's own from verse 11, “I will surely rend the kingdom from thee,” and Ahijah's words join the act to it: “Take thee ten pieces: for thus saith the LORD … I will rend the kingdom” (verse 31).

      A torn garment has announced a torn kingdom once before. When Saul turned away and laid hold of Samuel's mantle, it tore, and Samuel said, “The LORD hath rent the kingdom of Israel from thee this day” ([[1 Sam. 15:28]]; see the note at [[1 Sam. 15:27]]). In one older reading Ahijah's part is the same as Samuel's with Saul: he announces the LORD's decision, and his words give Jeroboam no license to rebel.
    sources: [sc-knowhy-178, keil-kings]

  - ref: 32
    phrase: But he shall have one tribe
    kind: history
    title: Ten and one
    body: |
      Twelve pieces, ten given to Jeroboam and one kept for David's house, leave one unaccounted for, and the text never explains it. The Septuagint, the Greek translation, reads “two tribes” here and in verse 36. The tribe kept is Judah: in the next chapter “there was none that followed the house of David, but the tribe of Judah only” ([[1 Kgs. 12:20]]), though Rehoboam's army is mustered from “all the house of Judah, with the tribe of Benjamin” ([[1 Kgs. 12:21]]).

      Two points of reckoning show why the count is not simple, though neither says what became of the twelfth piece. First, there were not twelve tribes to divide but thirteen: Joseph's sons Ephraim and Manasseh counted as two tribes, and Levi made a thirteenth. Second, the “one tribe” stood for more than Judah alone. Judah's kingdom took in half of the small tribe of Benjamin, the Levites, and the strangers in Judah's land, with more Levites coming south after Jeroboam turned to idolatry, so that more than one tribe in fact stayed with David's house.
    sources: [lds-scriptures, lxx-rahlfs, ot-manual-kings-1, ot-minute-1-kings-11]

  - ref: 36
    phrase: a light alway before me in Jerusalem
    kind: words
    title: A lamp for David
    body: |
      The “light” is a lamp, the Hebrew *nîr*, a word always used figuratively, and here it means that David's family remains on the throne. Kings repeats the promise when later kings of Judah fail: “for David's sake did the LORD his God give him a lamp in Jerusalem” ([[1 Kgs. 15:4]]), and the LORD “would not destroy Judah for David his servant's sake, as he promised him to give him alway a light” ([[2 Kgs. 8:19]]). The figure was already David's: his men swore he would not go to battle again, “that thou quench not the light of Israel” ([[2 Sam. 21:17]]).

      The text gives two reasons for the lamp, and neither is the king who receives it: “for David my servant's sake, and for Jerusalem's sake which I have chosen” (verse 13; again in verses 32 and 36).
    sources: [bdb, oshb-wlc]

  - ref: 38
    phrase: build thee a sure house, as I built for David
    kind: history
    title: A sure house, on a condition
    body: |
      Jeroboam is offered what David was given, but on a condition. David's promise had no “if”: “thine house and thy kingdom shall be established for ever before thee” ([[2 Sam. 7:16]]). Jeroboam's begins, “if thou wilt hearken unto all that I command thee.” David's promise was unconditional and Jeroboam's conditional, so the northern kingdom rested from its founding on conditional covenants and a prophet's word. The Joseph Smith Translation qualifies the example here too, so that Jeroboam is to walk “as David my servant did in the day that I blessed him.”

      Jeroboam broke the condition by turning Israel to the calves ([[1 Kgs. 12:28]]), and his house fell “according unto the saying of the LORD, which he spake by his servant Ahijah” ([[1 Kgs. 15:29]]). From then on the evil kings of Israel are often measured by him, beginning with Baasha, who “walked in the way of Jeroboam” ([[1 Kgs. 15:34]]).
    sources: [halverson-fall-of-israel, jsp-ot2, scripture-helps-2-samuel-11, lds-scriptures]

christ: |
  The lamp kept burning in Jerusalem for David's sake (verse 36) was kept for a reason beyond David: Judah remained under David's line so that the promise that the Messiah would come from David and from Judah ([[Gen. 49:10]]) would be fulfilled. Solomon stands in the line Matthew traces to Jesus ([[Matt. 1:6–7]]), and the affliction of David's seed was “not for ever” (verse 39).

  In the Joseph Smith Translation the LORD names what separated Solomon from David: Solomon “repenteth not as did David his father, that I may forgive him” (JST 1 Kgs. 11:33). The words set forgiveness on the Lord's side, waiting on repentance. A disciple whose heart has turned is in the same place: the Lord is ready to forgive, and what He waits for is the turning back.

explore: |
  - **The word fulfilled.** [[1 Kgs. 12:1–20]], where the ten tribes make Jeroboam king, and [[1 Kgs. 14:1–16]], Ahijah's second word to Jeroboam's house.
  - **The law of the king.** [[Deut. 17:14–20]] and its notes on this site, beside verses 1–8.
  - **Solomon in latter-day scripture.** [[Jacob 2:23–30]] and [[D&C 132:37–39]], read together.
  - **An apostle on Solomon and Jeroboam.** Joseph B. Wirthlin, “Journey to Higher Ground,” general conference, October 2005, which reads this chapter as a warning about prosperity and pride.

