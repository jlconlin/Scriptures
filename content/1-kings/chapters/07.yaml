chapter: 7
title: So Was Ended All the Work
tagline: Solomon builds his own house in thirteen years; Hiram, a craftsman of Tyre, casts the bronze for the temple court, the pillars Jachin and Boaz, the molten sea on twelve oxen, and the ten lavers on their bases; Solomon makes the vessels of gold for within.
when: 'The thirteen years of Solomon’s own house, which followed the seven of the temple; then the bronze and gold work for the temple'

setting: |
  Chapter 6 built the house of the LORD in seven years. Chapter 7 turns first to the king's own house, thirteen years in the building (verses 1–12), and then back to the temple for the work that furnished it: the bronze Hiram cast for the court (13–47) and the vessels of gold Solomon made for inside (48–51). Chapter 8 dedicates it. Chronicles tells the bronze and the vessels again ([[2 Chr. 3:15–4:22]]) but never describes the palace.

  The Hiram of verse 13 is not the king of Tyre who sent the cedar ([[1 Kgs. 5:1]]) but a craftsman of the same name. What he cast stood outside the house, in the court where Israel came: the worshippers stayed outside, and only the priests went in. His bronze stood until the Babylonians broke the pillars, the bases and the sea and carried the metal to Babylon ([[2 Kgs. 25:13]]); the note at [[Jer. 52:17]] follows it there. The plan of the house itself is explained at [[1 Kgs. 6:2]] and tabled, beside the tabernacle's, in the [Temple and Worship](/old-testament/guides/temple-and-worship/#temples) guide.

thread: |
  Two houses share this chapter, and the book counts them together: “at the end of twenty years, when Solomon had built the two houses, the house of the LORD, and the king's house” ([[1 Kgs. 9:10]]). The account of the king's house is short and comes first. Then, from verse 13 to the end, the writer is back at the LORD's house and stays there.

  Most of that account is about what stood in the court: two great pillars at the door, a sea of water on twelve oxen between the altar and the porch, and ten wheeled lavers, five on each side. Hiram's work is listed twice, once as he makes it and again in a summary (verses 40–45), and there was so much bronze that no one weighed it (verse 47). Only then does the chapter go indoors, to the gold altar, table and candlesticks, which only the priests would see. The court was where the people met the temple, and the bronze was what they saw: water for the priests' washing, and names on the pillars, one of which can mean “he will establish.”

sections:
  - range: 1-12
    heading: The king's house
    plain: |
      Solomon spent thirteen years building his own house, and he finished all of it.

      He built the House of the Forest of Lebanon, a hundred cubits long, fifty wide and thirty high, on four rows of cedar pillars with cedar beams laid on them. Above the beams, resting on forty-five pillars, fifteen to a row, it was roofed with cedar. Its windows were set in three rows, window facing window in three tiers, and all the doorways and their frames were squared, window facing window in three tiers.

      He made a hall of pillars fifty cubits long and thirty wide, with a porch in front of it, and pillars and a thick beam before them. He made the Hall of the Throne, where he judged, the Hall of Judgment, panelled with cedar from one side of the floor to the other. His own house, where he lived, had another court within the hall and was of the same work. He also built a house like this hall for Pharaoh's daughter, whom he had married.

      All of these were of costly stone, cut to measure and trimmed with saws inside and out, from the foundation to the eaves and outside as far as the great court. The foundations were costly stones, great blocks of ten cubits and eight. Above them were costly stones cut to measure, and cedar. The great court all around had three courses of hewn stone and a course of cedar beams, like the inner court of the house of the LORD and the porch of the house.
  - range: 13-22
    heading: Hiram and the two pillars
    plain: |
      King Solomon sent to Tyre and brought Hiram. He was the son of a widow of the tribe of Naphtali, and his father had been a man of Tyre, a bronze-worker. Hiram was full of wisdom, understanding and skill for every kind of bronze work. He came to King Solomon and did all his work.

      He cast two bronze pillars, each eighteen cubits high and twelve cubits around. He made two capitals of cast bronze to set on top of the pillars, each five cubits high, with a network of checker work and wreaths of chain work for the capitals, seven for each. He made two rows of pomegranates around each network to cover the capitals at the top of the pillars. The capitals at the top of the pillars in the porch were shaped like lilies, four cubits high. On the capitals of both pillars, above the rounded part next to the network, there were two hundred pomegranates in rows all around.

      He set up the pillars at the porch of the temple. The one on the right he named Jachin, and the one on the left he named Boaz. The tops of the pillars were lily work. So the work on the pillars was finished.
  - range: 23-39
    heading: The sea, the bases and the lavers
    plain: |
      He made the sea of cast bronze, round, ten cubits from rim to rim and five cubits high; a line of thirty cubits measured it around. Below the rim, all around it, were gourd-shaped knobs, ten to a cubit, in two rows, cast with the sea in one piece. It stood on twelve oxen, three facing north, three west, three south and three east; the sea rested on them, and their hindquarters were toward the center. It was a handbreadth thick, and its rim was made like the rim of a cup, like a lily blossom. It held two thousand baths.

      He made ten bronze stands, each four cubits long, four wide and three high. They were made like this: they had panels set between frames, and on the panels and frames were lions, oxen and cherubim; above the frames was a stand, and beneath the lions and oxen were wreaths of hammered work. Each stand had four bronze wheels with bronze axles, and at the four corners were cast supports for the basin. Its mouth, within the crown and above it, measured a cubit; the mouth was round, made like the stand, a cubit and a half, with engravings on it, and its panels were square, not round. The four wheels were under the panels, their axles fixed to the stand, and each wheel was a cubit and a half high, made like a chariot wheel, with axles, rims, spokes and hubs all of cast metal. Each stand had four supports at its corners, cast in one piece with the stand. At the top of the stand was a round band half a cubit high, and its braces and panels were of one piece with it. He engraved cherubim, lions and palm trees on its surfaces, wherever there was room, with wreaths all around. He made all ten stands alike, of one casting, one measure and one shape.

      He made ten bronze basins, each holding forty baths and measuring four cubits, one basin on each of the ten stands. He put five stands on the right side of the house and five on the left, and he set the sea on the right side of the house, eastward, toward the south.
  - range: 40-47
    heading: All Hiram's work
    plain: |
      Hiram also made the basins, the shovels and the bowls. So Hiram finished all the work he did for King Solomon on the house of the LORD: the two pillars; the two bowl-shaped capitals on top of the pillars; the two networks covering the capitals; the four hundred pomegranates for the two networks, two rows for each; the ten stands and the ten basins on them; the one sea and the twelve oxen under it; and the pots, shovels and bowls. All these vessels that Hiram made for King Solomon for the house of the LORD were of burnished bronze.

      The king cast them in the clay ground of the Jordan valley, between Succoth and Zarethan. Solomon left all these vessels unweighed, because there were so very many; the weight of the bronze was never found out.
  - range: 48-51
    heading: The gold within
    plain: |
      Solomon also made all the furnishings of the house of the LORD: the golden altar, the golden table for the shewbread, the lampstands of pure gold before the inner sanctuary, five on the right and five on the left, with the flowers, lamps and tongs of gold; the cups, snuffers, bowls, dishes and censers of pure gold; and the gold hinges for the doors of the inner house, the most holy place, and for the doors of the main hall of the temple.

      So all the work King Solomon did for the house of the LORD was finished. Then Solomon brought in the things his father David had dedicated, the silver, the gold and the vessels, and put them in the treasuries of the house of the LORD.

notes:
  - ref: 1
    phrase: Solomon was building his own house thirteen years
    kind: history
    title: Thirteen years for the king’s house
    body: |
      The king's house took nearly twice as long as the LORD's, thirteen years beside the seven of [[1 Kgs. 6:38]]. They were thirteen more years, which is how the book reaches twenty for the two houses together ([[1 Kgs. 9:10]]). The text sets the two figures side by side and passes no judgment on them. One older reading explains the difference by size: the palace was a far larger work, and the temple, a comparatively small building, had years of preparation behind it before the first stone was laid.

      “All his house” was more than one building. Verses 2–8 name its parts in turn: the House of the Forest of Lebanon (verses 2–5), the porch of pillars (6), the porch for the throne where the king judged (7), and his own dwelling with a house beside it for Pharaoh's daughter (8), whose marriage is explained at [[1 Kgs. 3:1]]. The House of the Forest alone, a hundred cubits by fifty, covered more ground than the temple's sixty by twenty ([[1 Kgs. 6:2]]). Its roof rested on four rows of cedar pillars (verse 2), and it held armour as well: Solomon hung his gold shields there ([[1 Kgs. 10:17]]).
    sources: [cambridge-kings, ot-manual-kings-1, lds-scriptures]

  - ref: 14
    phrase: he was filled with wisdom, and understanding, and cunning to work all works in brass
    kind: history
    title: Hiram the craftsman
    body: |
      The man Solomon brought from Tyre was a master bronze-worker who was half an Israelite. His father was a Tyrian in the same trade; his mother, a widow, belonged to Naphtali by this verse and was “a woman of the daughters of Dan” by Chronicles ([[2 Chr. 2:14]]). Chronicles also widens his skill well beyond bronze, to gold, silver, iron, stone, timber and dyed cloth.

      The “brass” he worked is bronze in modern translations of this verse, and the metal of the whole chapter is bronze. The text praises Hiram's wisdom and understanding before it describes anything he made, and the praise underlines the artistry of what follows, the elaborate capitals of the two pillars above all.
    sources: [meyers-jachin-boaz, lds-scriptures]

  - ref: 21
    phrase: called the name thereof Jachin
    kind: symbol
    title: Jachin and Boaz
    body: |
      The two bronze pillars at the temple's door carried names, and the names are the surest clue to what they meant. Jachin can mean “he will establish,” and Boaz “in strength.” They were hollow, eighteen cubits high with capitals of five more (verses 15–16), though Chronicles makes them thirty-five ([[2 Chr. 3:15]]). They may have marked a gate through which one passed from earthly into holy space; the text names the pillars without explaining them.

      They seem to have held nothing up. The writer describes them not with the building in chapter 6 but at the head of the bronze work Hiram cast for the court (verses 13–45), and the description is so full of obscure words that their exact form and placement cannot be reconstructed with confidence. Free-standing pillars flanked the entrances of other temples of the region, though Jachin and Boaz were considerably larger than the columns whose bases have been found there. They were also seen in a way the interior never was: only priests went into the house, while the court in front of it was where the people sacrificed, sang and gathered. One reading takes the pair as gateposts like those carved at royal gateways in the ancient Near East: they marked the moment the LORD entered His house with the ark, and they told everyone in the court that David's house ruled by His will.
    sources: [scripture-helps-2-samuel-11, bd-temple-of-solomon, meyers-jachin-boaz, lds-scriptures]

  - ref: 23
    phrase: he made a molten sea
    kind: history
    title: Water for washing
    body: |
      The “sea” was a great basin of cast bronze, and its purpose is stated plainly in Chronicles: the ten lavers were for washing “such things as they offered for the burnt offering,” “but the sea was for the priests to wash in” ([[2 Chr. 4:6]]). It stood in the court between the altar and the porch, with five lavers on wheeled stands on each side of the altar ([[1 Kgs. 7:38–39]]).

      Ten cubits across and five high, a handbreadth thick, it weighed more than twenty-five tons and held at least twelve thousand gallons: two thousand baths by this chapter's count (verse 26) and three thousand by Chronicles' ([[2 Chr. 4:5]]). The ten stands that take up verses 27–37 are the carts for the smaller basins, each on four wheels made like a chariot's (verse 33), for washing the animals brought for sacrifice.
    sources: [lds-scriptures, bd-temple-of-solomon, cowan-ot-temples, madsen-solomons-temple]

  - ref: 25
    phrase: It stood upon twelve oxen
    kind: symbol
    title: Twelve oxen
    body: |
      The twelve oxen, three facing each quarter of the compass, stood for the twelve tribes of Israel. Oxen are used that way elsewhere in scripture: at the tabernacle's dedication the princes of the twelve tribes brought twelve oxen to draw its wagons ([[Num. 7:2–8]]).

      The figures had a history of their own. Ahaz later took the sea down from the oxen and set it on a pavement of stone ([[2 Kgs. 16:17]]), yet Jeremiah counts “twelve brasen bulls” among the bronze carried to Babylon ([[Jer. 52:20]]), so the oxen, or others in their place, may have been put back.

      The chapter heading calls the sea a baptismal font. In Solomon's day, Chronicles says, it held water for the priests' washing ([[2 Chr. 4:6]]); its form has passed to the fonts of latter-day temples, which since the Nauvoo Temple have followed the ancient pattern wherever they could; most stand on twelve oxen that represent the twelve tribes.
    sources: [cowan-ot-temples, brandt-oxen-fonts, scripture-helps-2-samuel-11, lds-scriptures]

  - ref: 48
    phrase: Solomon made all the vessels that pertained unto the house of the LORD
    kind: history
    title: Gold within
    body: |
      Bronze was for the court; what stood inside the house was gold. The furnishings followed the tabernacle's without copying them: the altar of incense was cedar overlaid with gold, and in place of one golden candlestick and one table of shewbread there were ten of each, five on either side. Only the priests went into the house; the worshippers remained outside, among Hiram's bronze. What that meant for the size and plan of the house is explained at [[1 Kgs. 6:2]].

      The chapter closes with what David had dedicated, the silver, gold and vessels he had set apart for the LORD from the nations he subdued ([[2 Sam. 8:11]]), brought at last into the treasuries of the house his son built.
    sources: [bd-temple-of-solomon, lds-scriptures]

christ: |
  The oxen beneath the sea, which stood for Israel's tribes, “can also represent the strength and power of Jesus Christ,” and in the Lord's houses today the same oxen bear the font in which the living are baptized for the dead. Joseph Smith taught that “the baptismal font was instituted as a similitude of the grave,” set “underneath where the living are wont to assemble” ([[D&C 128:13]]).

  The font rests on the oxen as the Lord's work rests on those who keep their covenants. Each disciple who is faithful to them becomes part of the strength His work stands on.

