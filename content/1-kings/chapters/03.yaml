chapter: 3
title: Ask What I Shall Give Thee
tagline: At Gibeon the LORD offers the young king whatever he asks; Solomon asks for a hearing heart to judge God's people, and the case of two mothers shows all Israel that the wisdom of God is in him.
when: 'Early in Solomon''s reign, at Gibeon and at Jerusalem'

setting: |
  Chapter 2 closed with the words “the kingdom was established in the hand of Solomon” ([[1 Kgs. 2:46]]), after the deaths that secured his throne. Chapter 3 turns from how Solomon took the kingdom to how he would rule it. It has three parts: a marriage and the state of Israel's worship (verses 1–4), the LORD's appearance to Solomon in a dream at Gibeon (verses 5–15), and a lawsuit between two mothers that shows the gift at work (verses 16–28). The LORD will appear to Solomon a second time, after the temple is built, “as he had appeared unto him at Gibeon” ([[1 Kgs. 9:2]]), and the account of Solomon's fall recalls both appearances ([[1 Kgs. 11:9]]). Chronicles tells the vision at Gibeon too ([[2 Chr. 1:1–13]]), but leaves out the offerings before the ark and the two mothers.

  The Joseph Smith Translation revises this chapter more than any other in 1 Kings: of the twenty-four verses Joseph Smith changed in the book, eleven are here, all within verses 1–14. The Church's footnotes print none of them, and *Scripture Helps* quotes the change to verse 14; the notes below give the others from the manuscript.

thread: |
  The chapter turns on Solomon's heart. It opens with a mixed verdict: Solomon loved the LORD, “only” he sacrificed at the high places (verse 3), and in the Joseph Smith Translation the LORD is displeased with his Egyptian alliance and blesses him for the people's sake. Then the LORD offers him anything, and the young king, who by his own account does not know how to lead, asks for a hearing heart to judge God's people. The LORD grants it, adds the riches and honor Solomon did not ask for, and attaches one condition: that he walk in the LORD's ways (verse 14).

  The case of the two mothers follows as the proof of the gift. It is a very hard case, with no witness and two claims that mirror each other, and the king decides it by bringing a mother's compassion into the open. All Israel sees “that the wisdom of God was in him, to do judgment” (verse 28). Solomon, like Saul and David before him, starts out with great promise. Kings will later record the LORD's word to him, “thou hast not kept my covenant and my statutes” ([[1 Kgs. 11:11]]), the statutes verse 14 had asked him to keep.

sections:
  - range: 1-4
    heading: A marriage and the high places
    plain: |
      Solomon made a marriage alliance with Pharaoh, king of Egypt. He married Pharaoh's daughter and brought her to the City of David, where she stayed until he had finished building his own palace, the LORD's house, and the wall around Jerusalem. The people were still offering sacrifices at the high places, because no house had yet been built for the LORD's name. Solomon loved the LORD and lived by the statutes of his father David, except that he too offered sacrifices and burned incense at the high places. The king went to Gibeon to sacrifice, because it was the most important high place, and he offered a thousand burnt offerings on its altar.
  - range: 5-15
    heading: The dream at Gibeon
    plain: |
      At Gibeon the LORD appeared to Solomon in a dream at night. God said, “Ask for whatever you want Me to give you.” Solomon answered, “You showed great kindness to my father David, because he lived before You faithfully, rightly, and with an honest heart. And You have kept up that great kindness by giving him a son to sit on his throne today. Now, LORD my God, You have made me king in my father's place, but I am only a young man; I do not know how to lead. I am here among the people You have chosen, a people too many to count. So give me a heart that listens, so that I can judge Your people and tell right from wrong. For who could govern this great people of Yours?” The Lord was pleased that Solomon had asked for this. God said to him, “Because you asked for this, and not for long life, or wealth, or the death of your enemies, but for understanding to judge fairly, I will do what you asked. I give you a wise and discerning heart, so that no one before you has been like you, and no one after you will be. I also give you what you did not ask for, both wealth and honor, so that no king will equal you as long as you live. And if you walk in My ways and keep My statutes and commandments, as your father David did, I will give you a long life.” Solomon woke up; it had been a dream. He went to Jerusalem, stood before the ark of the LORD's covenant, offered burnt offerings and peace offerings, and gave a feast for all his servants.
  - range: 16-28
    heading: The two mothers
    plain: |
      Then two prostitutes came to the king and stood before him. One of them said, “My lord, this woman and I live in the same house, and I gave birth while she was there with me. Three days later she gave birth too. We were alone; there was no one else in the house but the two of us. During the night her son died, because she lay on him. She got up in the middle of the night and took my son from beside me while I was asleep. She laid him at her breast and laid her dead son at mine. When I got up in the morning to nurse my son, he was dead. But when I looked at him closely in the morning light, I saw that he was not the son I had borne.” The other woman said, “No! The living one is my son, and the dead one is yours.” The first said, “No, the dead one is yours, and the living one is mine.” So they argued before the king. The king said, “One of you says, ‘This is my son, the living one, and your son is the dead one,’ and the other says, ‘No, your son is the dead one, and mine is the living one.’” Then the king said, “Bring me a sword.” They brought a sword to the king, and he said, “Cut the living child in two, and give half to one and half to the other.” The mother of the living child was overcome with love for her son, and she said to the king, “Please, my lord, give her the living child. Don't kill him!” But the other said, “He shall be neither mine nor yours. Cut him in two.” Then the king gave his ruling: “Give the first woman the living child. Do not kill him. She is his mother.” When all Israel heard the judgment the king had given, they held him in awe, because they saw that he had the wisdom of God to do justice.

notes:
  - ref: 1
    phrase: Solomon made affinity with Pharaoh king of Egypt
    kind: history
    title: A marriage alliance with Egypt
    body: |
      Verse 1 records a treaty sealed by a marriage. Marriages between royal houses were often political, “a way of signing a treaty between two countries,” and with Israel now dominant in the region Solomon apparently wanted to neutralize Egypt, which had used Canaan as a base for its armies. Solomon made many such marriages, and this bride is singled out because of Egypt's standing as a regional power; Egypt's royal daughters did not usually marry outside Egypt. The politics did not make it right: the marriage “showed a lack of faith in the Lord, who had promised to defend Israel and fight her battles.”

      The Joseph Smith Translation says so outright. In the manuscript, verse 1 opens “And the Lord was not pleased with Solomon, for he made affinity with Pharaoh,” says that Solomon took her “to wife” and brought her into the house of David, and closes by saying that the Lord blessed Solomon only for the people's sake. The text itself will later name Pharaoh's daughter first among the “strange women” Solomon loved ([[1 Kgs. 11:1]]); his wives, and what latter-day revelation says of them, are taken up at [[1 Kgs. 11:3]].
    sources: [ot-manual-kings-1, ot-minute-1-kings-3, jsp-ot2, nyman-jst-historical, lds-scriptures]

  - ref: 2
    phrase: the people sacrificed in high places
    kind: history
    title: The high places
    body: |
      The high places were local altars, and before the temple Israel worshiped the LORD at them. Altars on hilltops were an old custom. Those the Canaanites had built were to be destroyed ([[Num. 33:52]]), but Israel built altars to Jehovah at several high places, and these became local centers of His worship; Solomon's worship in verses 2–4 was of this kind. The trouble came later. When idolatry came in, many of these altars were turned to other gods, and the reforming kings Hezekiah and Josiah tried to gather all sacrifice into Jerusalem (that history is told at [[Deut. 12:5]]).

      Verse 2 gives the reason the people still used them: “there was no house built unto the name of the LORD, until those days.” Whether the “only” of verse 3 is a rebuke is less clear. The text is “a little ambiguous” on whether sacrificing there was right: the word leaves room for Solomon's worship to be justified, since God appears to him in the verses that follow, though for the author of Kings high places were no longer acceptable once the temple was built. The Joseph Smith Translation drops the “only” (next note).
    sources: [bd-high-places, ot-minute-1-kings-3, lds-scriptures]

  - ref: 3
    phrase: Solomon loved the LORD, walking in the statutes of David his father
    kind: scripture
    title: How Solomon came to love the LORD
    body: |
      The Joseph Smith Translation turns verse 3 from a qualified compliment into an account of growth. The King James says that Solomon loved the LORD, “only” he sacrificed at the high places. Joseph Smith's revision reads: “because the Lord blessed Solomon as he was walking in the statutes of David, his father, he began to love the Lord, and he sacrificed and burnt incense in high places, and he called on the name of the Lord.” The love follows the blessing, and the worship at the high place becomes a king calling on the LORD's name.

      The next two verses follow from that. Verse 4 says that Gibeon “was in a great high place,” not that it was “the great high place,” a change a Latter-day Saint study of these revisions reads as taking away any suggestion of the worship of Baal. Verse 5 begins, “And the Lord God hearkened unto Solomon, and appeared”: the vision is the LORD's answer to the king who called on Him. Read with the change to verse 1, the same study concludes that Solomon's love for the Lord grew from blessings the Lord gave him because of the righteousness of the people.
    sources: [jsp-ot2, nyman-jst-historical]

  - ref: 4
    phrase: the king went to Gibeon to sacrifice there; for that was the great high place
    kind: history
    title: Why Gibeon, and then the ark
    body: |
      Gibeon was “the great high place” because the tabernacle Moses had made in the wilderness stood there, with its bronze altar, and that is where Solomon offered his thousand burnt offerings ([[2 Chr. 1:3–6]]); David had left priests to serve before it there ([[1 Chr. 16:39]]). The ark was not with it. David had brought the ark up to Jerusalem and set it in a tent he had pitched for it ([[2 Sam. 6:17]]). So Israel's worship was divided between two places: the old tabernacle and its altar at Gibeon, and the ark on Zion.

      That explains verse 15. On waking, Solomon went to Jerusalem and offered again before the ark, which one older reading takes as thanks for the promise he had received. The same reading observes that the one thing missing at Gibeon, the ark with which the LORD had bound up His presence, was supplied on this occasion by a direct revelation in a dream.
    sources: [lds-scriptures, keil-kings]

  - ref: 7
    phrase: 'I am but a little child: I know not how to go out or come in'
    kind: history
    title: A little child who could not go out or come in
    body: |
      Solomon is speaking of inexperience, not infancy. The Hebrew words, *naʿar qāṭōn*, are the same ones used of the “little children” who mocked Elisha ([[2 Kgs. 2:23]]), who were not small children but older youths or even young men. Solomon is most likely speaking in humility. Elder Howard W. Hunter called him “then less than twenty years of age”; later Jewish tradition made him twelve (the Talmudic rabbis) or fourteen (Josephus). The figures in Kings raise a puzzle: Solomon reigned forty years ([[1 Kgs. 11:42]]), and his son Rehoboam was forty-one when he began to reign ([[1 Kgs. 14:21]]), so either Rehoboam was already born at this point or the episode is told out of chronological order.

      “Go out or come in” is the language of leading a people: Moses asked the LORD for a successor “which may go out before them, and which may go in before them” ([[Num. 27:17]]; see the note at [[Deut. 31:2]]). The Joseph Smith Translation makes that plain. In the manuscript Solomon says, “I know not how to lead them, to go out or come in before them,” and the little child moves to the next clause: Solomon is “as a little child” in the midst of the LORD's people.
    sources: [oshb-wlc, scripture-helps-2-kings-2, hunter-understanding-heart-1962, ot-minute-1-kings-3, jsp-ot2, lds-scriptures]

  - ref: 9
    phrase: an understanding heart
    kind: words
    title: A hearing heart
    body: |
      What Solomon asks for is, word for word, a hearing heart, *lēb šōmēaʿ*. The verb is the ordinary Hebrew word for hearing, and the standard lexicon lists this phrase under its sense “hear with attention, … listen to.” The heart, in turn, was not chiefly the seat of feeling: Israelites thought of it as the place thoughts came from. So the request is not a wish for more empathy, and one Latter-day Saint reading renders the phrase “discerning mind.”

      The rest of the verse says what the listening is for: “to judge thy people, that I may discern between good and bad.” The hearing serves judgment, and the judgment is the power to tell right from wrong. The LORD answers with “a wise and an understanding heart” (verse 12), and the next scene shows the gift at work.
    sources: [oshb-wlc, bdb, ot-minute-1-kings-3]

  - ref: 11
    phrase: hast not asked for thyself long life; neither hast asked riches for thyself
    kind: prophets
    title: What Solomon did not ask for
    body: |
      The LORD lists what Solomon passed over (long life, riches, the lives of his enemies) to say what pleased Him: Solomon asked for what he needed “to judge thy people” (verse 9). Elder Howard W. Hunter, then of the Quorum of the Twelve, observed that a young king with enemies both outside his realm and within it might well have asked for any of those things. Instead, “He did not ask for material things of the world, but a spiritual gift—an understanding heart.”

      The riches and honor of verse 13 come as the LORD's addition, not as the object of the prayer. The large and prosperous realm of the next chapter grew, on one Latter-day Saint reading, from this same priority: Solomon's “desire to be a good ruler,” more than a desire for power (see [[1 Kgs. 4:21]]).
    sources: [hunter-understanding-heart-1962, sc-knowhy-857]

  - ref: 14
    phrase: as thy father David did walk
    kind: scripture
    title: As thy father David did walk
    body: |
      The LORD's promise of long life comes with a condition, and the Joseph Smith Translation changes the example attached to it. The King James holds up David's walk as the pattern. Joseph Smith's manuscript reads instead: “then I will lengthen thy days, and thou shalt not walk in unrighteousness as did thy Father David.” David's record helps explain it. He is portrayed as a righteous king, loyal to Jehovah, but at places like this the Joseph Smith Translation seems to stress that not everything he did was righteous, above all with Bathsheba and Uriah; read together, scripture and the revision portray David as an example of what future kings should and should not do. The same kind of revision recurs at several later places where Kings measures a king by David (11:4, 6, 33, 38–39; 14:8; 15:3, 5, 11), though not at every one.

      Joseph Smith also touched verse 6, so that the LORD showed David “great things according to thy mercy, when he walked before thee in truth.” A Latter-day Saint study of these revisions reads that change as showing David's true character and as teaching that blessings depend on obedience to law ([[D&C 130:20–21]]). Solomon reigned forty years ([[1 Kgs. 11:42]]), and one older reading holds that the promise of long life was not fulfilled because Solomon did not keep the condition.
    sources: [jsp-ot2, scripture-helps-2-samuel-11, nyman-jst-historical, keil-kings, lds-scriptures]

  - ref: 16
    phrase: two women, that were harlots
    kind: history
    title: A case with no witness
    body: |
      The story is told as the proof of verse 12: right after the promise of a wise heart comes a very difficult case that only such a heart could decide. The two women lived alone in one house, and “there was no stranger with us in the house” (verse 18), so there was no one to testify. Each woman's claim is the other's turned around, and the king, repeating both in verse 23, has nothing in the testimony to choose between them.

      That the women were prostitutes is said once and then dropped. After verse 16 the narrator calls them only “women,” and it did not matter to Solomon that they stood far below him; one Latter-day Saint reading sees in that the even-handedness of biblical law.
    sources: [keil-kings, ot-minute-1-kings-3]

  - ref: 26
    phrase: her bowels yearned upon her son
    kind: words
    title: Her bowels yearned
    body: |
      The King James “bowels” stands for the Hebrew *raḥămîm*, “compassion,” a word used most often of God's. Many derive it from *reḥem*, “womb”: the feeling of those born of one womb, or, on another view, a mother's feeling. The verb, *nikmᵉrû*, means that it grew warm and tender. The same phrase is used of Joseph when he saw his brother Benjamin: “his bowels did yearn upon his brother” ([[Gen. 43:30]]).

      That compassion is what the king's order brought into the open. Faced with a divided child, the true mother gave up her claim to save his life, and the other woman agreed to his death. The test was wise whatever the facts of birth: the woman willing to give up the baby rather than see it killed would be the best mother to the child, “whether she was the natural mother or not.” The verdict in verse 27 repeats her own words, “give her the living child, and in no wise slay it,” and adds only “she is the mother thereof.”
    sources: [bdb, oshb-wlc, ot-manual-kings-1]

christ: |
  All Israel saw in Solomon “the wisdom of God … to do judgment” (verse 28), and the Church's footnotes to “understanding” (verse 11) and “wisdom” (verse 28) point to Isaiah's promise that “the spirit of wisdom and understanding” would rest on the stem of Jesse ([[2 Ne. 21:2]]; [[Isa. 11:1–2]]). The Lord identifies that stem as Christ ([[D&C 113:1–2]]), and Jesus, speaking of the queen who came “to hear the wisdom of Solomon,” said, “a greater than Solomon is here” ([[Matt. 12:42]]).

  Solomon received an understanding heart because he asked for it, and the footnote to verse 12 sets beside his gift Joseph Smith's discovery that God gives wisdom to those who lack it and ask ([[JS—H 1:11–13]]). Elder Howard W. Hunter taught that any disciple may pray as Solomon did, “Lord, give me an understanding heart,” and that such a heart grows from “the experiences we have in life if we keep the commandments of God.”

explore: |
  - **The second appearance.** [[1 Kgs. 9:1–9]], where the LORD appears to Solomon again and repeats the condition of verse 14; then [[1 Kgs. 11:9–11]].
  - **The same vision in Chronicles.** [[2 Chr. 1:1–13]], which sets the thousand burnt offerings at the bronze altar before the tabernacle.
  - **A prayer for the king's judgment.** [[Ps. 72:1–4]] and its notes on this site, which read the psalm beside verse 9.

