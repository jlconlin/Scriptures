chapter: 19
title: A Still Small Voice
tagline: Threatened by Jezebel, Elijah flees into the wilderness and asks to die; an angel feeds him for the road to Horeb, where the LORD is not in the wind, the earthquake or the fire but in a still small voice, and sends him back to anoint kings and to call Elisha.
when: 'In the reign of Ahab king of Israel, after the contest on Carmel'

setting: |
  Chapter 18 ended in triumph: fire from heaven on Carmel, the prophets of Baal slain at the brook Kishon, rain at last, and Elijah running before Ahab's chariot to Jezreel ([[1 Kgs. 18:38–46]]). Chapter 19 opens with Jezebel's answer, an oath that Elijah would be dead within a day. Elijah flees from the land of Israel and goes on, many days' journey, to Mount Horeb, which is Sinai.

  The chapter moves in three stages: the flight into the wilderness, where an angel feeds him (verses 1–8); the LORD's appearing at Horeb (verses 9–18); and the call of Elisha (verses 19–21). It is told with Moses in view. Elijah fasts forty days, comes to the mountain where the law was given, and meets the signs Moses met there, and that likeness is the key to what the LORD does and does not do (see the note at verse 8).

  Scripture comes back to this chapter. Paul reads the seven thousand of verse 18 as the remnant of his own day ([[Rom. 11:2–5]]). Nephi uses the words “still small voice” ([[1 Ne. 17:45]]), and the Book of Mormon hears that voice again after fire and earthquake ([[Hel. 5:30]]; [[3 Ne. 11:3]]).

thread: |
  The chapter is about how the LORD answers a prophet who says, “It is enough” (verse 4). Elijah answers Jezebel's oath by running, and in the wilderness he asks to die. The LORD's first answer is bread and water, brought twice by an angel, “because the journey is too great for thee” (verse 7). At Horeb His second answer is a question, “What doest thou here, Elijah?”, and Elijah answers with his complaint: he has been zealous, Israel has killed the prophets, “and I, even I only, am left.” Then the LORD passes by. Wind, earthquake and fire come, as they came at Sinai, but the LORD is not in them; after them comes a still small voice.

  The question is asked again in the same words, and Elijah answers again in the same words (verses 13–14). The LORD's last answer is work and company: three men to anoint, one of them Elijah's own successor, and seven thousand in Israel who have not bowed to Baal. The prophet who said he was alone is told that he is not, and the chapter ends with Elisha leaving his oxen to go after him, and he “ministered unto him” (verse 21).

sections:
  - range: 1-8
    heading: Flight into the wilderness
    plain: |
      Ahab told Jezebel everything Elijah had done, and how he had killed all the prophets with the sword. So Jezebel sent a messenger to Elijah to say, “May the gods punish me, and worse, if by this time tomorrow I have not made your life like the life of one of them.” When Elijah saw how things stood, he got up and ran for his life. He came to Beer-sheba, in Judah, and left his servant there. He himself went on a day's journey into the wilderness, and came and sat down under a broom bush. He asked that he might die: “It is enough. Now, LORD, take my life, for I am no better than my fathers.” He lay down and slept under the broom bush, and suddenly an angel touched him and said, “Get up and eat.” He looked, and there by his head was a cake baked on hot coals and a jar of water. He ate and drank and lay down again. The angel of the LORD came a second time, touched him, and said, “Get up and eat, for the journey is too much for you.” So he got up, ate and drank, and on the strength of that food he traveled forty days and forty nights to Horeb, the mountain of God.
  - range: 9-18
    heading: At Horeb
    plain: |
      There he came to the cave and spent the night. And the word of the LORD came to him: “What are you doing here, Elijah?” He answered, “I have been very zealous for the LORD, the God of hosts. The children of Israel have forsaken Your covenant, torn down Your altars, and killed Your prophets with the sword. I alone am left, and they are trying to take my life too.” The LORD said, “Go out and stand on the mountain before the LORD.” And the LORD passed by. A great and mighty wind tore the mountains and broke the rocks in pieces before the LORD, but the LORD was not in the wind. After the wind came an earthquake, but the LORD was not in the earthquake. After the earthquake came a fire, but the LORD was not in the fire. And after the fire came a quiet, gentle voice. When Elijah heard it, he wrapped his face in his cloak, went out, and stood at the entrance of the cave. Then a voice came to him: “What are you doing here, Elijah?” He answered, “I have been very zealous for the LORD, the God of hosts. The children of Israel have forsaken Your covenant, torn down Your altars, and killed Your prophets with the sword. I alone am left, and they are trying to take my life too.” The LORD said to him, “Go back the way you came, to the wilderness of Damascus. When you get there, anoint Hazael king over Syria. Anoint Jehu son of Nimshi king over Israel, and anoint Elisha son of Shaphat of Abel-meholah to be prophet in your place. Whoever escapes the sword of Hazael, Jehu will kill, and whoever escapes the sword of Jehu, Elisha will kill. Yet I have kept for Myself seven thousand in Israel, every knee that has not bowed to Baal and every mouth that has not kissed him.”
  - range: 19-21
    heading: The call of Elisha
    plain: |
      So Elijah went from there and found Elisha son of Shaphat plowing. Twelve yoke of oxen were ahead of him, and he was with the twelfth. Elijah went over to him and threw his cloak over him. Elisha left the oxen, ran after Elijah, and said, “Please let me kiss my father and my mother goodbye, and then I will follow you.” Elijah answered, “Go back. What have I done to you?” So Elisha went back, took the yoke of oxen and slaughtered them. He boiled their meat over a fire made with the oxen's gear and gave it to the people, and they ate. Then he got up, went after Elijah, and served him.

notes:
  - ref: 3
    phrase: when he saw that, he arose, and went for his life
    kind: history
    title: Why Elijah fled
    body: |
      Elijah ran because Jezebel had sworn to kill him within a day, and the text reports his reaction without explaining it; even the verb is read two ways. The received Hebrew text has *wayyarʾ*, “and he saw,” which the King James follows: Elijah saw how matters stood. The Septuagint has “And Eliu feared, and rose, and departed for his life.” Either way he went “for his life,” to save it.

      The threat itself is strange. Jezebel sent a messenger rather than soldiers, and one Latter-day Saint reading takes that as a hint that after Carmel she knew she could not simply have him killed. Elijah went anyway, and far. “Beer-sheba, which belongeth to Judah” is the narrator's way of saying that he left the northern kingdom altogether, for the southern edge of Judah, a desert town; there he left his servant and went a day further into the wilderness alone, sat under a broom bush (the King James' “juniper tree,” a desert shrub), and asked to die. The LORD's first answer was food, brought twice by an angel. Elijah did not stop even then, though a much shorter flight into the desert would likely have kept him safe from Jezebel. The next note gives the answer to why he went on to Horeb.
    sources: [oshb-wlc, lxx-rahlfs, ot-minute-1-kings-19, sc-knowhy-858, lds-scriptures]

  - ref: 8
    phrase: went in the strength of that meat forty days and forty nights unto Horeb the mount of God
    kind: scripture
    title: Elijah at Moses' mountain
    body: |
      The forty days to Horeb put Elijah where Moses had stood, and the chapter is told so that the reader sees it. Horeb is Sinai (see [[Ex. 3:1]]), the mountain of the covenant, far to the south of Beer-sheba across the Negev. The long journey makes sense as part of a pattern in which Elijah is drawn as like Moses. Each goes forty days without food ([[Ex. 24:18]]; [[Ex. 34:28]]). Each waits on the mountain in a cave or a cleft of the rock, and to each the LORD says He will pass by ([[Ex. 33:21–22]]). Each meets fire, storm and earthquake on the mountain, and each covers his face. The notes at [[Ex. 24:18]] and [[Ex. 33:22]] set out the same likenesses from Moses' side.

      The pattern belongs to the narrator. 1 Kings tells Elijah's ministry in a way that leaves little doubt that, in the narrator's mind, he was the prophet like Moses promised in [[Deut. 18:15]]: like Moses he gives food and water by miracle, commands the elements, flees for his life, fasts forty days in the wilderness, and is summoned to Horeb. His forty days also run Israel's forty years in reverse, back through the wilderness to the mountain they had left.

      All of this prepares the surprise of verses 11–12. Moses' mountain is the place where the LORD showed Himself in thunder and fire, and it is there that He shows Elijah something else.
    sources: [scripture-helps-1-kings, ot-minute-1-kings-19, sc-knowhy-858, davis-zeal, lds-scriptures]

  - ref: 11
    phrase: but the LORD was not in the wind
    kind: symbol
    title: Not in the wind, the earthquake, or the fire
    body: |
      Wind, earthquake and fire were the signs that God was present, and the chapter says three times that the LORD was not in them. At Sinai the mountain quaked, with thunder, smoke and fire, and no one could mistake that God was there ([[Ex. 19:16–18]]). A reader who has followed the likenesses to Moses expects what came next at Sinai: the trumpet, and the voice that gave the Ten Commandments, a voice Deuteronomy remembers as loud ([[Deut. 5:22–26]]). On Carmel, one chapter earlier, the LORD had answered by fire from heaven ([[1 Kgs. 18:38]]).

      This time the pattern is turned around. The LORD did not speak to Elijah in a booming voice from the mountain and then come down to destroy his enemies. The wind, the earthquake and the fire still came “before the LORD,” as part of His passing by, but He was “in” the voice that followed in a sense that He was not “in” any of them. The contrast is with Carmel as much as with Sinai: there the LORD had shown Himself in a dramatic way, and here He does not.
    sources: [sc-knowhy-858, davis-zeal, scripture-helps-1-kings, peterson-small-voice, lds-scriptures]

  - ref: 12
    phrase: a still small voice
    kind: words
    title: A still small voice
    body: |
      Each of the three Hebrew words, *qôl dᵉmāmâ daqqâ*, puts the sound close to silence. *Qôl* is the ordinary word for both “voice” and “sound.” *Dᵉmāmâ* is a word of silence, best rendered “whisper”; it is the calm into which the LORD settles a storm: “He maketh the storm a calm” ([[Ps. 107:29]]). *Daqqâ* means thin or fine, the word for the fine flakes of the manna and for fine dust, and here, once, for “a low whisper.” So the King James “still” means quiet rather than motionless, and “small” could as well be “thin” or “crushed”: a sound so quiet that it takes a second word to say how near silence it was.

      Whether Elijah heard words or only a sound the text leaves open, but its quietness is the point, and Elijah recognized it as the LORD's. When he heard it he “wrapped his face in his mantle” and went out to the mouth of the cave, a gesture of both fear and attraction.

      The phrase passed into the Book of Mormon. Nephi told his brothers that the Lord “hath spoken unto you in a still small voice, but ye were past feeling” ([[1 Ne. 17:45]]), a quotation of this verse, since the plates of brass likely held the books of Kings. Among Latter-day Saints it has become one of the main ways of describing the promptings of the Holy Ghost.
    sources: [oshb-wlc, bdb, ot-minute-1-kings-19, davis-zeal, sc-knowhy-410, lds-scriptures]

  - ref: 14
    phrase: I have been very jealous for the LORD God of hosts
    kind: history
    title: Very jealous for the LORD
    body: |
      Elijah's answer to the LORD's question is his zeal (“jealous” here means zealous), and he gives it twice, before the LORD passes by (verse 10) and after (verse 14), in the same words, and the LORD's question is the same both times: “What doest thou here, Elijah?”

      A pointed question asked again in the very same words, right after so plain an object lesson, suggests that the LORD was trying to tell him something, and Elijah answers as he had before. One Latter-day Saint reading takes the lesson to be about zeal itself. Elijah complains that Israel has “slain thy prophets with the sword” just after he himself had presided over the killing of hundreds of prophets, false ones ([[1 Kgs. 18:40]]). On this reading the law of Moses could have justified what he did ([[Deut. 13:1–5]]), which may be why the LORD's remonstrance is so gentle; what the story quietly asks is whether zeal is the path of wisdom, and it answers with a wisdom higher than zeal, in restraint and in truth spoken with a lowered voice. That is a reading of the story, not something the text says outright.

      The rest of Elijah's complaint, “I, even I only, am left,” the LORD answers plainly. He gives Elijah work, a successor, and seven thousand who have not bowed to Baal (verses 15–18): Elijah is not alone.
    sources: [lds-scriptures, ot-minute-1-kings-19, davis-zeal, sc-knowhy-858]

  - ref: 15
    phrase: anoint Hazael to be king over Syria
    kind: history
    title: Three anointings
    body: |
      The LORD sends Elijah north again with three names, two kings and a prophet, and scripture does not record Elijah anointing any of them. Elisha's call came by the mantle (verse 19), and no anointing with oil is told; the command to anoint him is to be understood as a symbol that the prophetic call was passing from Elijah to his successor. Hazael heard from Elisha in Damascus, “The LORD hath shewed me that thou shalt be king over Syria” ([[2 Kgs. 8:13]], the verse the footnote to verse 15 points to), and Elisha wept for the evil Hazael would do to Israel ([[2 Kgs. 8:12]]). Jehu was anointed by one of the sons of the prophets, whom Elisha sent with a box of oil ([[2 Kgs. 9:1–3]]).

      So the commission of verses 15–16 was carried out over years and by other hands, most of it after Elijah was gone.
    sources: [ot-minute-1-kings-19, seely-messiah, lds-scriptures]

  - ref: 18
    phrase: Yet I have left me seven thousand in Israel
    kind: scripture
    title: Seven thousand who have not bowed
    body: |
      The LORD's last word answers Elijah's “I only am left.” On one older reading, seven thousand is an indefinite number for a company small beside the whole people of Israel but enough to be the LORD's holy remnant, the seed of a purified people to come. Kissing was part of the homage paid to idols; Hosea mocks those who “kiss the calves” ([[Hos. 13:2]]). Coming after Elijah's complaint, the number quietly undoes his picture of himself as the last faithful man standing.

      Paul read the verse as a pattern. Asked whether God had cast away His people, he quoted Elijah's complaint and the LORD's reply, “I have reserved to myself seven thousand men, who have not bowed the knee to the image of Baal,” and drew from it the answer for his own day: “Even so then at this present time also there is a remnant according to the election of grace” ([[Rom. 11:2–5]]).
    sources: [cambridge-kings, davis-zeal, lds-scriptures]

  - ref: 19
    phrase: cast his mantle upon him
    kind: history
    title: The mantle
    body: |
      Elijah's mantle, his robe, was the sign of his authority, and throwing it over Elisha marked him as Elijah's successor. It made visible what the anointing of verse 16 meant: that Elisha would take up Elijah's power, authority and mission, deliver the same message and work many of the same miracles. The word, *ʾadderet*, is the same as for the mantle in which Elijah had wrapped his face at Horeb (verse 13). When Elijah is taken up, it falls to Elisha, who strikes the Jordan with it as Elijah had done ([[2 Kgs. 2:8]]; [[2 Kgs. 2:13–14]]); that succession is told in full there.
    sources: [scripture-helps-2-kings-2, seely-messiah, oshb-wlc, lds-scriptures]

  - ref: 20
    phrase: 'Go back again: for what have I done to thee?'
    kind: words
    title: What have I done to thee?
    body: |
      Elijah's reply is curt, and readers have heard it in more than one way. A Latter-day Saint reading paraphrases it, “Go back and cherish these normal moments, for what I have just done is place a mantle upon you that will be a burden far heavier than your oxen carry.” On one older reading it is plain permission: I have put no constraint on you, and the choice of the prophetic calling is yours.

      Verse 21 is Elisha's answer. He killed the yoke of oxen, cooked their meat over the burning harness, fed the people, and went after Elijah, perhaps as a sign that he was fully committed; the same Latter-day Saint reading sees in the meal something of a sacrifice, marking the change in his life. He “ministered unto him,” with a verb that usually means a servant's work.
    sources: [ot-minute-1-kings-19, keil-kings]

christ: |
  What Elijah heard at Horeb the Book of Mormon hears again. After fire and the shaking of the earth, a people in need of repentance heard “a still voice of perfect mildness, as if it had been a whisper” ([[Hel. 5:30]]), and one Latter-day Saint reading names that voice as the voice of Christ. On another Latter-day Saint reading, the account of the destructions in 3 Nephi is crafted to recall Elijah's storm, earthquake and fire, and ends with a small voice that “did pierce them to the very soul” ([[3 Ne. 11:3]]), heralding the Savior's appearance. Elijah himself stood with Moses beside the transfigured Christ ([[Matt. 17:3]]).

  The Lord still speaks to His disciples in Elijah's way. In most cases His way “is not the thunderous interruption or the blinding light but what the scriptures call the ‘still small voice,’” and those who look only for great manifestations can fail to recognize the voice that is given to them; “the Lord rarely speaks loudly. His messages almost always come in a whisper.”

