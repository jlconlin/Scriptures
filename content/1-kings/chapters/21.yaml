chapter: 21
title: The Inheritance of My Fathers
tagline: Naboth will not sell the land the LORD gave his fathers; Jezebel has him stoned on false witness so that Ahab can take his vineyard, Elijah meets the king in it with the LORD's sentence, and the LORD defers the evil when Ahab humbles himself.
when: 'In the reign of Ahab king of Israel, at Jezreel, after the wars with Ben-hadad'

setting: |
  Chapter 20 left Ahab going home “heavy and displeased” after a prophet's rebuke ([[1 Kgs. 20:43]]), and chapter 21 opens with the same words for a different cause. Ahab, the most wicked and the most powerful of the northern kings, is called “king of Samaria” (verse 1; see [[1 Kgs. 16:24]]), but he also made Jezreel, a city on a hill rising out of the plain, his capital, and Naboth's vineyard lay beside the palace there. The story is another instance of Jezebel's influence over her husband (she is introduced at [[1 Kgs. 16:31]]).

  The chapter has three movements: the vineyard taken by a judicial murder (verses 1–16), Elijah's sentence on Ahab, Jezebel and their house (verses 17–26), and Ahab's humbling, which moves the sentence to his son's days (verses 27–29). Chapters 20–22 together show Ahab sinning against the Lord “until it was too late.” The sentence is carried out at Ahab's death ([[1 Kgs. 22:38]]) and in Jehu's revolt, when Naboth is avenged ([[2 Kgs. 9:21–26]]). Naboth's story is a classic illustration, in the northern kingdom, of the corruption Isaiah would condemn in Judah a century or so later, and that Amos and Micah condemned too.

thread: |
  The chapter turns on two ideas of what a king may take. Ahab asks for the vineyard and offers a fair price, and Naboth refuses in the LORD's name, because the land was an inheritance the LORD had given and the law kept it in the family. Ahab can only sulk. Jezebel has a different notion of a king, and she uses the law's own forms (a fast, two witnesses, a charge of blasphemy, stoning by the town) to kill the man who stood in the way.

  Then the LORD speaks. Elijah meets Ahab in the dead man's vineyard and puts the whole deed to him in one question: “Hast thou killed, and also taken possession?” The sentence on his house is the one already spoken and already kept against Jeroboam's house and Baasha's, and Kings will record it kept again, “according to the word of the LORD.” The chapter ends with the surprise that the LORD Himself points out to Elijah: Ahab humbled himself, and the LORD heard it.

sections:
  - range: 1-16
    heading: Naboth's vineyard
    plain: |
      Some time later this happened. Naboth of Jezreel owned a vineyard in Jezreel, next to the palace of Ahab, king of Samaria. Ahab said to Naboth, “Give me your vineyard for a vegetable garden, since it is close to my house. I will give you a better vineyard for it, or, if you prefer, I will pay you what it is worth.” But Naboth said to Ahab, “The LORD forbid that I should give you the inheritance of my fathers.” Ahab went home sullen and angry because Naboth had said, “I will not give you the inheritance of my fathers.” He lay down on his bed, turned his face away, and would not eat. His wife Jezebel came and asked him, “Why are you so upset that you won't eat?” He told her, “I said to Naboth of Jezreel, ‘Sell me your vineyard, or, if you like, I will give you another vineyard for it,’ and he answered, ‘I will not give you my vineyard.’” Jezebel his wife said, “Do you now govern the kingdom of Israel? Get up, eat, and cheer up. I will get you the vineyard of Naboth of Jezreel.” So she wrote letters in Ahab's name, sealed them with his seal, and sent them to the elders and leading men who lived in Naboth's town. In the letters she wrote: “Proclaim a fast, and seat Naboth in a prominent place before the people. Seat two worthless men opposite him, and have them testify against him: ‘You blasphemed God and the king.’ Then take him out and stone him to death.” The men of the town, the elders and leading men who lived there, did just as Jezebel had written in the letters she sent them. They proclaimed a fast and seated Naboth before the people. The two worthless men came in, sat opposite him, and testified against Naboth in front of the people: “Naboth blasphemed God and the king.” So they took him outside the town and stoned him to death. Then they sent word to Jezebel: “Naboth has been stoned; he is dead.” As soon as Jezebel heard it, she said to Ahab, “Get up and take possession of the vineyard that Naboth of Jezreel refused to sell you. Naboth is no longer alive; he is dead.” When Ahab heard that Naboth was dead, he got up and went down to the vineyard to take possession of it.
  - range: 17-26
    heading: Elijah meets Ahab in the vineyard
    plain: |
      Then the word of the LORD came to Elijah the Tishbite: “Go down to meet Ahab king of Israel, who rules in Samaria. He is in Naboth's vineyard; he has gone there to take possession of it. Say to him, ‘This is what the LORD says: Have you killed, and also taken possession?’ Then say to him, ‘This is what the LORD says: In the place where dogs licked up Naboth's blood, dogs will lick up your blood, yes, yours.’” Ahab said to Elijah, “So you have found me, my enemy?” Elijah answered, “I have found you, because you have sold yourself to do what is evil in the LORD's sight. The LORD says: I will bring disaster on you. I will sweep away your descendants and cut off every male of Ahab's house in Israel, slave or free. I will make your house like the house of Jeroboam son of Nebat and like the house of Baasha son of Ahijah, because you have provoked Me to anger and led Israel into sin.” And of Jezebel the LORD said, “Dogs will eat Jezebel by the wall of Jezreel. Those of Ahab's house who die in the city the dogs will eat, and those who die in the open country the birds will eat.” There was never anyone like Ahab, who sold himself to do evil in the LORD's sight, urged on by his wife Jezebel. He did what was utterly detestable in going after idols, just as the Amorites had done, whom the LORD drove out before the Israelites.
  - range: 27-29
    heading: Ahab humbles himself
    plain: |
      When Ahab heard these words, he tore his clothes, put sackcloth on his body, and fasted. He slept in sackcloth and went about softly. Then the word of the LORD came to Elijah the Tishbite: “Have you seen how Ahab has humbled himself before Me? Because he has humbled himself before Me, I will not bring the disaster in his lifetime. I will bring it on his house in his son's days.”

notes:
  - ref: 3
    phrase: the inheritance of my fathers
    kind: history
    title: The inheritance of my fathers
    body: |
      Naboth refuses because the law would not let him sell, not out of stubbornness. Ahab's offer of a better vineyard or its price looks fair, but the vineyard was Naboth's inheritance. The law of Moses allowed an inheritance to be sold only in extreme poverty, and even then it went back to the family at the jubilee; Ahab wanted it for good. Behind the law stood the belief that the land of Israel belonged to Jehovah, who had assigned each tribe its portion, so that by divine decree a family's land was to stay in the family; for a farming family it was also its living. The law says so in its own words: the land “shall not be sold for ever: for the land is mine” ([[Lev. 25:23]], where the note explains it), and “every one of the children of Israel shall keep himself to the inheritance of the tribe of his fathers” ([[Num. 36:7]]). That is why Naboth answers in the LORD's name: “The LORD forbid it me.”

      Ahab's answer is a sulk. He goes home “heavy and displeased,” the words that described him after the prophet's rebuke in [[1 Kgs. 20:43]], and lies on his bed with his face turned away, refusing to eat: he “was miserable because he could not get everything he wanted.”
    sources: [ot-manual-5, pike-poor-needy, lds-scriptures]

  - ref: 7
    phrase: Dost thou now govern the kingdom of Israel?
    kind: history
    title: Jezebel plays the king
    body: |
      Jezebel's question is a taunt: are you king, or not? On one older reading, the Hebrew has no mark of a question, and the “thou” is emphatic, so the sense is “Thou art king, art thou not? why then let such a matter trouble thee or stand in the way of thy will.” On the same reading her “I will give thee” is emphatic too: she does not urge Ahab to act the despot, but plays the part for him. When it is done, Ahab only has to walk down to the vineyard (verse 16).

      Jezebel was the Sidonian princess through whose influence the worship of Baal was established in Israel (see [[1 Kgs. 16:31]]). The narrator names her part in verse 25: there was none like Ahab, “whom Jezebel his wife stirred up.”
    sources: [cambridge-kings, bd-ahab, lds-scriptures]

  - ref: 10
    phrase: two men, sons of Belial, before him, to bear witness against him
    kind: history
    title: A murder in the forms of a trial
    body: |
      Jezebel kills Naboth with the machinery of Israel's own law. Her letters carry the king's seal (verse 8). On one older reading the seal gave them the character of a royal command, and the fast was meant to make the town feel that some public crime lay on it for which it must humble itself before God, and so to give the trial an appearance of justice from the start. The law would put no one to death on one witness: “At the mouth of two witnesses, or three witnesses, shall he that is worthy of death be put to death” ([[Deut. 17:6]]). So two are set opposite Naboth, but they are “sons of Belial,” that is, “worthless” or wicked men.

      The charge is chosen to fit the law too. On the same older reading, God and the king are named together, as in the commandment “Thou shalt not revile the gods, nor curse the ruler of thy people” ([[Ex. 22:28]]), so that Naboth could be accused under that law and stoned as a blasphemer of God. Stoning is the penalty the law sets for idolatry ([[Deut. 17:5]]), and blasphemy, as a practical denial of God, could be punished the same way. The elders and nobles of Naboth's own town did “as it was written in the letters” (verse 11).
    sources: [keil-kings, bd-belial, lds-scriptures]

  - ref: 19
    phrase: Hast thou killed, and also taken possession?
    kind: history
    title: Killed, and also taken possession
    body: |
      The LORD charges the murder to Ahab, though it was Jezebel who wrote the letters. Ahab profited from the killing and went to take the dead man's land: through Jezebel's connivance he killed Naboth and got the vineyard he had coveted. The tenth commandment stands beside the story ([[Ex. 20:17]]), and the lesson drawn from it is that covetousness leads to sin. The desire of verse 2 ends in the death of verse 13.

      Micah, Isaiah's contemporary in Judah, spoke still more plainly of the powerful taking other men's land: “they covet fields, and take them by violence; and houses, and take them away: so they oppress a man and his house, even a man and his heritage” ([[Micah 2:2]]).
    sources: [ot-instructor-33, pike-poor-needy, lds-scriptures]

  - ref: 19
    phrase: In the place where dogs licked the blood of Naboth shall dogs lick thy blood
    kind: scripture
    title: The word against Ahab fulfilled
    body: |
      Kings records Elijah's sentence carried out, and each time calls it the LORD's word. When Ahab died in battle, his chariot was washed “in the pool of Samaria; and the dogs licked up his blood … according unto the word of the LORD which he spake” ([[1 Kgs. 22:38]]). The rest of the sentence was carried out in Jehu's revolt. Jehu, having killed Ahab's son Joram, had the body thrown into Naboth's field and recalled the word the LORD had laid on Ahab: “I will requite thee in this plat, saith the LORD” ([[2 Kgs. 9:25–26]]); Jezebel died at Jezreel, and Jehu named it “the word of the LORD, which he spake by his servant Elijah” ([[2 Kgs. 9:36]]); and the end of Ahab's house came “according to the saying of the LORD, which he spake to Elijah” ([[2 Kgs. 10:17]]). So Naboth was avenged. Ahab's own blood was licked up at Samaria, not in Naboth's field, and the text does not explain the difference of place; it calls that too “the word of the LORD,” and the field itself received the body of Ahab's son, in whose days the LORD had said the evil would come (verse 29).
    sources: [ot-instructor-33, bd-naboth, lds-scriptures]

  - ref: 20
    phrase: thou hast sold thyself to work evil
    kind: words
    title: Sold to do evil
    body: |
      “Sold thyself” is a slave's word: the Hebrew verb, in its reflexive form, has the literal sense “sell oneself as slave,” as in Moses' warning that Israel would one day offer itself for sale in Egypt as bondmen ([[Deut. 28:68]]). Here it is figurative: Ahab has handed himself over to evil as a man sells himself into service. The same figure, again followed by “to do evil,” returns in the narrator's verdict in verse 25 (“there was none like unto Ahab, which did sell himself to work wickedness”), and in the verdict on the whole northern kingdom when it fell, that its people “sold themselves to do evil in the sight of the LORD” ([[2 Kgs. 17:17]]).
    sources: [oshb-wlc, bdb]

  - ref: 22
    phrase: like the house of Jeroboam the son of Nebat, and like the house of Baasha the son of Ahijah
    kind: scripture
    title: Like the house of Jeroboam and of Baasha
    body: |
      The sentence on Ahab's house is one Israel had heard twice and seen kept twice. Ahijah spoke it against Jeroboam's house ([[1 Kgs. 14:10–11]]) and Jehu son of Hanani against Baasha's ([[1 Kgs. 16:3–4]]), each time with the same terms Elijah uses here: every male cut off (the idiom of verse 21 is explained at [[1 Kgs. 14:10]]), and the dead left to the dogs in the city and the birds in the field (verse 24). Both were carried out, Jeroboam's “according unto the saying of the LORD, which he spake by his servant Ahijah” ([[1 Kgs. 15:29]]) and Baasha's “according to the word of the LORD, which he spake against Baasha by Jehu the prophet” ([[1 Kgs. 16:12]]). The charge is the same as well: provoking the LORD to anger and making Israel to sin.
    sources: [lds-scriptures]

  - ref: 29
    phrase: because he humbleth himself before me
    kind: history
    title: Why the LORD saw Ahab's humbling
    body: |
      The LORD saw Ahab's humbling and answered it by moving the evil to his son's days, not by taking it away. Ahab tore his clothes, put on sackcloth and slept in it, fasted, and “went softly.” The LORD Himself points it out to Elijah, the prophet who had just pronounced the sentence: “Seest thou how Ahab humbleth himself before me?” The reason the LORD gives is the humbling itself. In the son's days it came: Jehu killed Ahab's son Joram and had his body thrown into Naboth's field, recalling the burden the LORD had laid on “Ahab his father” ([[2 Kgs. 9:24–26]]).

      The next chapter shows Ahab still at odds with the LORD's word. He hates the prophet who will not prophesy good of him ([[1 Kgs. 22:8]]), goes to battle against that prophet's word, and dies as Micaiah foretold.

      The theme page [A Hearing Heart](/1-kings/themes/hearing-heart/) sets this verse beside the promise of 2 Chr. 7:14 and says what the text does and does not record of Ahab.
    sources: [ot-instructor-33, lds-scriptures]

christ: |
  Naboth died on the word of two worthless witnesses, the number the law required ([[Deut. 17:6]]), and one older reading sets them beside the witnesses sought against Jesus, where “at the last came two false witnesses” ([[Matt. 26:60]]). In both trials an innocent man was condemned on the testimony of false witnesses ([[1 Kgs. 21:13]]). Covetousness leads to greater sin: Ahab's desire for a vineyard ended in an innocent man's death. The LORD who saw Naboth's blood and would not let it go unanswered, and who also saw Ahab humble himself, is Jehovah, the premortal Christ (see [[Ex. 3:14]]). His word through His prophets is fulfilled. Verses 27–29 show “the relationship between repentance and the consequences of sin”: for a disciple now, humbling oneself before the Lord is seen and answered, as Ahab's was, even where the consequences of sin already set in motion are not all taken away.

explore: |
