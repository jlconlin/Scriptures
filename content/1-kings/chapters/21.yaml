  - **The land law behind Naboth's answer.** [[Lev. 25:23–28]] and [[Num. 36:1–9]], with their notes on this site.
  - **The prophets on fields taken by force.** [[Isa. 5:8]], [[Amos 5:12]] and [[Micah 2:1–2]].

