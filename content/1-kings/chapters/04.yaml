chapter: 4
title: Every Man under His Vine
tagline: Solomon's ministers and the twelve officers who fed his court; a kingdom from the Euphrates to Egypt, at peace on every side; and a wisdom as wide as the sand on the shore.
when: 'Solomon’s reign, “all the days of Solomon”'

setting: |
  Chapter 3 gave Solomon the gift he asked for at Gibeon, an understanding heart, and showed it at work in the judgment between two mothers ([[1 Kgs. 3:9]]; [[1 Kgs. 3:16]]). Chapter 4 steps back to show the kingdom that gift was given to govern.

  Much of the chapter is lists, and lists are easy to skip. They are worth reading slowly here, because they are the machinery of the reign: who served the king, how the land was divided to feed his table, how far his rule reached, how many horses he kept. Chapter 5 puts that machinery to work on the temple, and chapter 12 shows what it had cost, when the northern tribes come to Solomon's son and say, “Thy father made our yoke grievous” ([[1 Kgs. 12:4]]).

  Other books on the site have told parts of this already: the border promised to Abraham ([[Gen. 15:18]]), the law's limits on a king's horses, wives and gold ([[Deut. 17:16]]), Samuel's warning of what a king would take ([[1 Sam. 8:17]]), and the proverbs and songs under Solomon's name ([[Prov. 1:1]]).

thread: |
  This is the chapter of Solomon at his height, and the chapter itself offers no word of blame. The people are “as the sand which is by the sea in multitude, eating and drinking, and making merry” (verse 20); the king has “peace on all sides” (verse 24); every man sits safe under his own vine (verse 25); and God gives Solomon a wisdom “as the sand that is on the sea shore” (verse 29).

  Yet the lists say more than the praise does. The court was fed by a monthly levy on twelve districts, and a minister stood “over the tribute,” the forced labor (verse 6). Such taxation fulfilled Samuel's warning about what a king would take. The same office comes back in chapter 12, when the northern tribes complain of the yoke and stone the man “over the tribute” ([[1 Kgs. 12:18]]).

sections:
  - range: 1-6
    heading: Solomon's ministers
    plain: |
      So King Solomon was king over all Israel, and these were his chief officials. Azariah son of Zadok was the priest. Elihoreph and Ahiah, sons of Shisha, were the secretaries, and Jehoshaphat son of Ahilud kept the records. Benaiah son of Jehoiada commanded the army, and Zadok and Abiathar were priests. Azariah son of Nathan was over the district governors, and Zabud son of Nathan was chief minister (the Hebrew calls him a priest; see the note) and the king's friend. Ahishar was over the palace, and Adoniram son of Abda was over the forced labor.
  - range: 7-19
    heading: The twelve officers
    plain: |
      Solomon had twelve officers over all Israel who supplied food for the king and his household; each was responsible for one month of the year. Their names and districts were these: the son of Hur in the hill country of Ephraim; the son of Dekar in Makaz, Shaalbim, Beth-shemesh and Elon-beth-hanan; the son of Hesed in Aruboth, with Sochoh and all the land of Hepher; the son of Abinadab in all the region of Dor, who married Solomon's daughter Taphath; Baana son of Ahilud, over Taanach and Megiddo and all Beth-shean by Zartanah below Jezreel, from Beth-shean to Abel-meholah and beyond Jokneam; the son of Geber in Ramoth-gilead, over the towns of Jair son of Manasseh in Gilead and the region of Argob in Bashan, sixty great walled cities with bronze bars on their gates; Ahinadab son of Iddo in Mahanaim; Ahimaaz in Naphtali, who married Solomon's daughter Basmath; Baanah son of Hushai in Asher and Aloth; Jehoshaphat son of Paruah in Issachar; Shimei son of Elah in Benjamin; and Geber son of Uri in the land of Gilead, the country of Sihon king of the Amorites and of Og king of Bashan. He was the only officer over that land.
  - range: 20-28
    heading: Peace and plenty
    plain: |
      The people of Judah and Israel were as many as the sand by the sea, and they ate and drank and were glad. Solomon ruled over all the kingdoms from the Euphrates to the land of the Philistines and to the border of Egypt; they brought him tribute and served him all his life. Each day his household used thirty measures of fine flour and sixty of meal, ten fattened oxen, twenty oxen from the pasture and a hundred sheep, besides deer, gazelles, roebucks and fattened birds. He ruled all the land west of the Euphrates, from Tiphsah to Gaza, over all its kings, and he had peace on every side. All Solomon's days Judah and Israel lived in safety, from Dan to Beer-sheba, each family under its own vine and fig tree. Solomon had forty thousand stalls of horses for his chariots and twelve thousand horsemen. The officers, each in his month, supplied King Solomon and everyone who ate at his table, and nothing was lacking. They also brought barley and straw for the horses and dromedaries to wherever it was needed, each as he was assigned.
  - range: 29-34
    heading: Solomon's wisdom
    plain: |
      God gave Solomon wisdom and very great understanding, and a breadth of mind as wide as the sand on the seashore. His wisdom surpassed that of all the peoples of the east and all the wisdom of Egypt. He was wiser than anyone: than Ethan the Ezrahite, and Heman, Chalcol and Darda, the sons of Mahol, and his fame spread through all the nations around. He spoke three thousand proverbs, and his songs numbered a thousand and five. He spoke about plants, from the cedar of Lebanon to the hyssop that grows out of a wall, and about animals, birds, creeping things and fish. People came from all nations, and from all the kings of the earth who had heard of his wisdom, to listen to Solomon.

notes:
  - ref: 5
    phrase: Zabud the son of Nathan was principal officer, and the king’s friend
    kind: history
    title: A priest, a counselor, and the king’s friend
    body: |
      “Principal officer” translates the Hebrew *kohen*, the ordinary word for “priest.” The same word stands after Azariah in verse 2 and after Zadok and Abiathar in verse 4, where it is rendered “priest”; for Zabud the King James gives another English word. The title could belong to a man outside Aaron's line: it is used of David's sons, whom the King James calls “chief rulers” ([[2 Sam. 8:18]]). They and Zabud, probably David's grandson, belong with chieftains such as Jethro, “the priest of Midian” ([[Ex. 3:1]]): princes who performed priestly functions.

      “The king's friend” was a technical term, a title of the court rather than a compliment. Hushai bore it under David, “Hushai David’s friend” ([[2 Sam. 15:37]]), and Chronicles' list of David's officers calls him “the king’s companion” ([[1 Chr. 27:33]]).

      Verse 4 raises a question of its own: Abiathar is still listed as a priest, though Solomon had sent him home to Anathoth and “thrust out Abiathar from being priest” ([[1 Kgs. 2:27]]; the note there tells why). The list does not explain it. One older reading passes on the explanation of Theodoret, an ancient interpreter, that Solomon took away Abiathar's office but not his priestly standing, which was hereditary.
    sources: [bdb, keil-kings, lds-scriptures]

  - ref: 7
    phrase: Solomon had twelve officers over all Israel, which provided victuals for the king and his household
    kind: history
    title: What Solomon’s government cost
    body: |
      The list of verses 7–19 is the plan by which the whole country fed the king's court, one district for each month of the year. Solomon governed with more machinery than David had: to David's commander and scribes he added a minister over the palace (Ahishar) and a chief over the twelve district officers (Azariah son of Nathan), and he set Adoniram over the forced labor for the building he planned.

      Each district supplied the court for one month, and its officer laid that burden on its farmers and shepherds. Verses 22–23 give a day's portion: thirty measures of fine flour and sixty of meal, by one reckoning about 188 and 370 bushels, besides the oxen, sheep and game. Such taxation fulfilled what Samuel told Israel a king would take; the note at [[1 Sam. 8:17]] sets the two passages side by side.

      Verse 6 names the other half of the cost, the forced labor Adoniram was over. It had apparently begun under David, whose list of officers already has “Adoram … over the tribute” ([[2 Sam. 20:24]]); the note on [[1 Kgs. 5:13]] tells how large Solomon made the levy and what it cost his son.
    sources: [ot-manual-kings-1, bdb, lds-scriptures]

  - ref: 21
    phrase: Solomon reigned over all kingdoms from the river unto the land of the Philistines, and unto the border of Egypt
    kind: history
    title: From the river to the border of Egypt
    body: |
      Verses 20 and 21 describe Israel as the promises to Abraham had described it: the people “as the sand which is by the sea in multitude” (verse 20) to the promise of seed “as the sand which is upon the sea shore” ([[Gen. 22:17]]), and “the river,” the Euphrates, to the border promised in [[Gen. 15:18]] (the note there tells how far that border was reached under David and Solomon). The kingdoms between the river and Egypt “brought presents,” that is, tribute, and served Solomon all his life.

      How real was that rule? Whether Solomon truly governed the region or only collected tribute from tribes that owed him a nominal allegiance is a fair question, and the archaeology answers part of it. On one Latter-day Saint reading, two finds point to real control. A distinctive burnished red-slipped pottery appears throughout the land in Solomon's time, from cities to country towns, and a new kind of rock-cut bench tomb spreads across Israel at the same time; both suggest a central government of a kind Israel had not had before. The pottery is distinctly Israelite and is not found in Philistine cities such as Ashdod, and on this reading the finds show real central rule over a united kingdom stretching at least from Dan to Beer-sheba, the very bounds verse 25 gives, and perhaps into the Negev in the southwest. The evidence it gives concerns Israel itself, not the kingdoms beyond, out to the river and to Egypt. The same reading traces the kingdom's size and order back to chapter 3: Solomon asked to govern well, not for wealth or power, and was given “that which thou hast not asked, both riches, and honour” ([[1 Kgs. 3:9–13]]).
    sources: [sc-knowhy-857, lds-scriptures]

  - ref: 25
    phrase: every man under his vine and under his fig tree
    kind: symbol
    title: Every man under his vine
    body: |
      Verse 25 says what Solomon's peace meant for a single household: each family “dwelt safely” on its own land, under its own vine and fig tree, from one end of the country to the other. Verse 24 has just said that Solomon “had peace on all sides.” His name means “peaceable,” as the word given David before the boy was born had promised:“his name shall be Solomon, and I will give peace and quietness unto Israel in his days” ([[1 Chr. 22:9]]).

      Micah uses the same words for the last days, when the mountain of the LORD's house is established and nations learn war no more: “they shall sit every man under his vine and under his fig tree; and none shall make them afraid” ([[Micah 4:4]]). The words that describe Solomon's reign are the words the prophet uses for the peace of the Lord's kingdom. Centuries later the Assyrian envoy offered Jerusalem the same vine and fig tree as the price of surrender, a counterfeit of this promise ([[Isa. 36:16]]; the note there tells it).
    sources: [bd-solomon, lds-scriptures]

  - ref: 26
    phrase: forty thousand stalls of horses
    kind: history
    title: Forty thousand, or four thousand?
    body: |
      The Hebrew of this verse reads “forty” thousand stalls, but the parallel in Chronicles reads “four thousand stalls for horses and chariots” ([[2 Chr. 9:25]]). The two Hebrew words are nearly alike (*ʾarbāʿîm*, “forty,” and *ʾarbaʿat*, “four”), and Hebrew number words are easily confused in copying, “just as ‘eight’ and ‘eighty’ differ only by a single letter” in English; the parallel accounts in Samuel, Kings and Chronicles show that numbers were “peculiarly difficult to transmit accurately.”
      Whatever the figure, the horses matter for another reason. The law had told Israel's king that “he shall not multiply horses to himself” ([[Deut. 17:16]]; the note there explains the limit), and chapter 10 tells where Solomon's came from ([[1 Kgs. 10:28]]).
    sources: [biblehub-interlinear, lds-scriptures, ot-manual-large-numbers]

  - ref: 29
    phrase: largeness of heart
    kind: words
    title: Largeness of heart
    body: |
      “Largeness of heart” means breadth of understanding. The Hebrew *rōḥab lēb* is literally breadth of heart, *rōḥab* being the word for the width of a thing or the whole extent of a land, and the verse measures that “largeness of understanding” with the same image verse 20 used for the people: as wide as the sand on the shore. The wisdom is the gift of chapter 3. Solomon asked for “an understanding heart,” and God answered, “I have given thee a wise and an understanding heart” ([[1 Kgs. 3:9]]; [[1 Kgs. 3:12]]); here the gift is given “exceeding much.”

      Verses 30–34 show what that breadth covered: more than the sages of the east and of Egypt, three thousand proverbs and a thousand and five songs, and everything that grows and moves, from the cedar of Lebanon to the hyssop in a wall. Ethan the Ezrahite and Heman, two of the wise men he surpassed, are names that also stand in the titles of Psalms 89 and 88; whether the psalmists are these sages is weighed at [[Ps. 88]]. How many of the proverbs survive in the book of Proverbs is taken up at [[Prov. 1:1]], and the Song that bears his name at [[Song 1:1]].
    sources: [bdb, lds-scriptures]

christ: |
  Verse 34 says that people came “of all people” and from “all kings of the earth” “to hear the wisdom of Solomon.” Jesus used the same words of one of them, the queen of the south, to speak of Himself ([[Matt. 12:42]]); chapter 10, where she comes, draws out the comparison ([[1 Kgs. 10:1–9]]). The wisdom of this chapter was God's gift; in Jesus a greater wisdom stood before a generation that would not hear Him.

  The gift Solomon received is not his alone. “If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him” ([[James 1:5]]): the God who gave Solomon “largeness of heart” gives understanding to any disciple who asks Him.

explore: |
  - **The cost of the kingdom.** [[1 Kgs. 5:13–18]], the levy for the temple; [[1 Kgs. 12:1–20]], the yoke, and Adoram stoned; [[1 Sam. 8:10–18]], Samuel's warning.
  - **The king and the law.** [[Deut. 17:14–20]], beside [[1 Kgs. 10:14–29]] and [[1 Kgs. 11:1–8]].
  - **The promised land and the promised peace.** [[Gen. 15:18]] and [[Gen. 22:17]]; [[Micah 4:1–4]].
  - **Solomon's wisdom.** [[1 Kgs. 3:5–14]], the gift; [[1 Kgs. 10:1–9]], the queen of Sheba; [[Matt. 6:29]] and [[Matt. 12:42]], Jesus on Solomon.

