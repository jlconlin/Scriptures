chapter: 14
title: Why Feignest Thou Thyself to Be Another?
tagline: Jeroboam's wife comes in disguise to the blind prophet who once promised her husband the kingdom, and hears that his house will fall; in Judah Rehoboam's people sin as Israel does, and Shishak of Egypt carries off Solomon's gold.
when: 'Late in Jeroboam''s reign over Israel; Rehoboam''s seventeen years in Judah, with Shishak''s invasion in his fifth year'

setting: |
  Chapter 13 ended with a verdict on Jeroboam's altars and priests at Bethel: “this thing became sin unto the house of Jeroboam, even to cut it off, and to destroy it from off the face of the earth” ([[1 Kgs. 13:34]]). Chapter 14 tells how that sentence was spoken. Its first half (verses 1–20) belongs to Israel: Jeroboam's son falls sick, his wife goes in disguise to the prophet Ahijah, and she hears the ruin of Jeroboam's house, the death of the child and the scattering of Israel. Then Jeroboam dies and his son Nadab reigns. The second half (verses 21–31) turns to Judah, where under Rehoboam the people build high places and groves like Israel, and Shishak of Egypt takes the treasures of the temple and the palace.

  Ahijah is the prophet of Shiloh who tore his new garment into twelve pieces and gave Jeroboam ten ([[1 Kgs. 11:30]]); he now speaks the end of what he began. Shishak, who had sheltered Jeroboam when he fled from Solomon ([[1 Kgs. 11:40]]), came against Jerusalem in Rehoboam's fifth year (925 B.C. in the Student Manual's dating). Chronicles tells the same invasion at more length ([[2 Chr. 12:1–16]]).

thread: |
  The chapter turns on the word of the LORD that no disguise can get around. Jeroboam hides his wife from a prophet who can barely see, and the LORD tells the prophet who is coming before she reaches the door. The word she carries home has three parts: Jeroboam's house will be swept away, the sick child will die as she enters the city, and Israel itself will one day be uprooted and scattered for the groves and the sins Jeroboam taught it. The first sign comes true at once, “according to the word of the LORD” (verse 18), and the rest follows in its time: Baasha destroys the whole house of Jeroboam “according unto the saying of the LORD, which he spake by his servant Ahijah” ([[1 Kgs. 15:29]]), and Assyria carries Israel away ([[2 Kgs. 17:23]]).

  Judah is no better. In the city the LORD chose “to put his name there” (verse 21), the people provoke Him with high places, images and groves, and the gold Solomon made is carried off to Egypt. Rehoboam replaces it with bronze, and the guard carries the bronze before him when he goes to the temple. The chapter sets the two kingdoms side by side under the same judgment.

sections:
  - range: 1-6
    heading: A disguise before a blind prophet
    plain: |
      About that time Jeroboam's son Abijah fell ill. Jeroboam said to his wife, “Disguise yourself so no one will know you are my wife, and go to Shiloh. The prophet Ahijah is there, the one who told me I would be king over this people. Take him ten loaves, some cakes and a jar of honey; he will tell you what will happen to the boy.” She did so and went to Ahijah's house at Shiloh. Ahijah could not see, because his eyes had grown dim with age. But the LORD had told him, “Jeroboam's wife is coming to ask you about her son, who is sick. Say this and this to her. When she comes in she will pretend to be someone else.” So when Ahijah heard her footsteps at the door, he said, “Come in, wife of Jeroboam. Why are you pretending to be someone else? I have been sent to you with hard news.”
  - range: 7-16
    heading: The word against Jeroboam's house
    plain: |
      “Go and tell Jeroboam that this is what the LORD, the God of Israel, says: ‘I raised you up from among the people and made you ruler over My people Israel. I tore the kingdom away from David's house and gave it to you. Yet you have not been like My servant David, who kept My commandments and followed Me with all his heart, doing only what was right in My eyes. You have done more evil than all who came before you. You have made yourself other gods and cast images to provoke Me, and you have thrown Me behind your back. So I am bringing disaster on Jeroboam's house. I will cut off every male belonging to Jeroboam, whoever is shut up or left in Israel, and sweep away what is left of his house as one sweeps away dung, until it is gone. Those of Jeroboam's family who die in the city the dogs will eat, and those who die in the open country the birds will eat. The LORD has spoken.’ As for you, go home. When your feet enter the city, the child will die. All Israel will mourn him and bury him. He is the only one of Jeroboam's family who will be laid in a grave, because in him the LORD, the God of Israel, has found something good in the house of Jeroboam. The LORD will raise up a king over Israel who will cut off Jeroboam's house on that day; and why do I say that day? It is already at hand. The LORD will strike Israel until it sways like a reed in the water. He will uproot Israel from this good land He gave their fathers and scatter them beyond the Euphrates, because they have made their Asherah poles and provoked Him. He will give Israel up because of the sins Jeroboam committed and led Israel to commit.”
  - range: 17-20
    heading: The child dies; Jeroboam's end
    plain: |
      Jeroboam's wife got up and left and came to Tirzah. As she stepped over the threshold of the house, the child died. They buried him, and all Israel mourned him, as the LORD had said through His servant the prophet Ahijah. The rest of what Jeroboam did, his wars and his reign, is written in the book of the chronicles of the kings of Israel. Jeroboam reigned twenty-two years. Then he died and was laid with his fathers, and his son Nadab became king in his place.
  - range: 21-24
    heading: Rehoboam and Judah's sins
    plain: |
      Rehoboam son of Solomon reigned in Judah. He was forty-one when he became king, and he reigned seventeen years in Jerusalem, the city the LORD had chosen out of all the tribes of Israel to put His name there. His mother was Naamah, an Ammonite. Judah did evil in the LORD's sight. By their sins they provoked Him to jealousy more than their fathers had done. They too built high places, images and Asherah poles on every high hill and under every green tree. There were also male prostitutes of the idol worship in the land, and the people followed all the detestable practices of the nations the LORD had driven out before Israel.
  - range: 25-31
    heading: Shishak and the end of Rehoboam
    plain: |
      In the fifth year of King Rehoboam, Shishak king of Egypt attacked Jerusalem. He carried off the treasures of the LORD's house and of the king's house; he took everything, including all the gold shields Solomon had made. King Rehoboam made bronze shields to replace them and entrusted them to the commanders of the guard who kept the door of the palace. Whenever the king went into the LORD's house, the guards carried the shields and then brought them back to the guardroom. The rest of what Rehoboam did is written in the book of the chronicles of the kings of Judah. There was war between Rehoboam and Jeroboam all their days. Rehoboam died and was buried with his fathers in the City of David. His mother was Naamah, an Ammonite. His son Abijam became king in his place.

notes:
  - ref: 2
    phrase: disguise thyself, that thou be not known to be the wife of Jeroboam
    kind: history
    title: A disguise before a blind prophet
    body: |
      Jeroboam's disguise fails against the one thing a disguise cannot hide from: revelation. He trusts the prophet to know what will become of the child, yet sends his wife in place of himself, dressed as someone else and carrying the kind of gift a common citizen's wife would bring: bread, cakes and a jar of honey. Bringing a present to a man of God was the custom ([[1 Sam. 9:7–8]]), but this one was chosen to add to the deception. Perhaps Jeroboam thought the prophet would yield more to a mother than to a father; certainly he knew he was not worthy to ask the Lord for any blessing.

      The narrator then gives two facts that make the plan look sure to work and then undo it. Ahijah is old, and his eyes are “set” (verse 4), so weak he can hardly see. And before the woman arrives the LORD tells him who she is and what to say (verse 5). So the blind man names her from the sound of her feet at the door. The Lord's servant can have things made known to him by revelation “which cannot be obtained through the natural senses.”

      The story is one of several in the Bible that deal with prophets, kings and disguises. Such stories typically depict a contest between God and an earthly king, and they end with the king's death and the end of his dynasty. That is the news Jeroboam's wife carries home.
    sources: [ot-manual-4, sc-knowhy-310, lds-scriptures]

  - ref: 8
    phrase: yet thou hast not been as my servant David
    kind: scripture
    title: Not as my servant David
    body: |
      The Joseph Smith Translation changes what this verse says about David, as it does at several places where Kings measures a king by him. Joseph Smith's manuscript reads: “And rent the kingdom away from the house of David, and gave it thee; because he kept not my commandments, But thou hast not been as my servant David, when he followed me with all his heart, only to do right in mine eyes.” The words “who kept my commandments” are no longer said of David; he is held up instead for the time “when he followed me with all his heart.” A new clause gives a reason for tearing the kingdom away, “because he kept not my commandments,” without naming whose failure is meant. *Scripture Helps* lists 14:8 among the revisions that qualify David as the example.

      Why David is the standard, and why the revision qualifies him, is explained at [[1 Kgs. 3:14]]; the other revisions are at [[1 Kgs. 11:4]] and [[1 Kgs. 15:3]]–5.
    sources: [jsp-ot2, scripture-helps-2-samuel-11]

  - ref: 10
    phrase: him that pisseth against the wall
    kind: words
    title: Every male of the house
    body: |
      The coarse-sounding phrase is a Hebrew idiom for “a male person,” and it is used only where a whole family is to be wiped out. The Hebrew, *maštîn bᵉqîr*, is built on the verb “urinate,” and as a threat it is a sentence of extinction on the whole male line. David uses it when he swears to destroy Nabal's household ([[1 Sam. 25:22]]), and Kings uses it for three ruling houses in turn: Jeroboam's here, Baasha's ([[1 Kgs. 16:11]]) and Ahab's ([[1 Kgs. 21:21]]; [[2 Kgs. 9:8]]). In Kings it falls each time on a ruling house.

      The threat of verse 11 adds the final shame: those cut off will lie unburied, for the dogs and the birds. The same words are spoken against Baasha's house ([[1 Kgs. 16:4]]).
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 13
    phrase: because in him there is found some good thing toward the LORD God of Israel
    kind: history
    title: The one son who would be buried
    body: |
      The good son dies, yet his death is not like the deaths of his father's house: he alone of Jeroboam's family will come to the grave and be mourned. Every other male is to be left for the dogs and the birds (verse 11), and among the Hebrews to be unburied was the worst thing that could happen to the dead. Abijah is buried with all Israel mourning him (verse 18), “because in him there is found some good thing.” The text does not say what the good thing was.

      His death also proves the rest of the prophecy true. In one older reading, Jeroboam was to learn from the child's death, exactly as foretold, that the ruin of his house would come just as surely. The same reading infers from the national mourning that the boy appears to have been the heir to the throne.
    sources: [ot-manual-4, keil-kings]

  - ref: 14
    phrase: 'but what? even now'
    kind: words
    title: 'But what? even now'
    body: |
      The clipped words at the end of the verse mean that the judgment is already at hand. The Hebrew breaks off, and it has been filled in many ways. Two older readings take it as Ahijah catching himself: he has just said the LORD will raise up a king who will cut off Jeroboam's house “that day,” and adds, but what am I saying? Even now. On one reading the day will come so soon that it can be called now; on the other the LORD has already raised the king up.

      The text bears out the haste. Jeroboam's son Nadab reigned only two years before Baasha killed him and wiped out the whole house of Jeroboam ([[1 Kgs. 15:25–29]]).
    sources: [keil-kings, cambridge-kings, lds-scriptures]

  - ref: 15
    phrase: shall scatter them beyond the river
    kind: scripture
    title: Scattered beyond the river
    body: |
      Ahijah's word reaches past Jeroboam's house to the whole northern kingdom: Israel will be uprooted from its land and scattered beyond the Euphrates. Elder James E. Talmage read it as the captivity of the ten tribes: Assyria took Samaria in about 721 B.C. and carried its people away, “thus was the dread prediction of Ahijah to the wife of Jeroboam fulfilled,” and from then on the Ten Tribes are lost to history.

      Kings gives the same cause Ahijah gives. Israel “walked in all the sins of Jeroboam which he did; they departed not from them; until the LORD removed Israel out of his sight, as he had said by all his servants the prophets” ([[2 Kgs. 17:22–23]]).
    sources: [ot-manual-4, lds-scriptures]

  - ref: 15
    phrase: because they have made their groves
    kind: history
    title: Groves
    body: |
      A “grove” in the King James is not a stand of trees but a sacred pole or tree set up for worship, in Hebrew an *asherah* (plural *asherim*). It stood for the female or productive principle in nature, and every Phoenician altar had one beside it. This nature worship came to be tied to gross immorality, and the prophets forbade it. The Law had forbidden it already: “Thou shalt not plant thee a grove of any trees near unto the altar of the LORD thy God” ([[Deut. 16:21]]).

      Ahijah names the groves as the reason Israel will be uprooted, beside the calves and the “sins of Jeroboam” (verse 16; the calves are explained at [[1 Kgs. 12:28]]). Verse 23 then says that Judah built them too, “on every high hill, and under every green tree,” with high places (explained at [[1 Kgs. 3:2]]) and images, and verse 24's “sodomites” are, in the Hebrew, male prostitutes devoted to the same fertility worship. The sin Ahijah names in the north was not the north's alone.
    sources: [bd-grove, lds-scriptures]

  - ref: 19
    phrase: the book of the chronicles of the kings of Israel
    kind: history
    title: The book of the chronicles
    body: |
      The book the writer sends his reader to is a lost royal record, not our books of Chronicles. Kings was compiled by an unknown writer from written documents, the state chronicles among them, and those chronicles were records kept under the kings of Israel and of Judah. They no longer exist. Such a record was already kept at David's court, where a census went unentered “in the account of the chronicles of king David” ([[1 Chr. 27:24]]). The Chronicler, telling Rehoboam's reign, names still other sources: “the book of Shemaiah the prophet, and of Iddo the seer” ([[2 Chr. 12:15]]).

      The reference is part of the formula that closes a reign in Kings, and this chapter has it twice, once for each kingdom: the rest of the king's acts are written in the chronicles of his kingdom (verses 19, 29), he “slept with his fathers,” and his son “reigned in his stead” (verses 20, 31). Solomon's reign closed the same way, with “the book of the acts of Solomon” ([[1 Kgs. 11:41]]). The measure by which the writer judges each king is explained at [[1 Kgs. 15:3]].
    sources: [bd-kings-books-of, ot-seminary-1-kings-intro, lds-scriptures]

  - ref: 25
    phrase: Shishak king of Egypt came up against Jerusalem
    kind: history
    title: Shishak
    body: |
      Shishak was the first king of Egypt's twenty-second dynasty, and Egypt's own monuments record this campaign: a relief of his victory over Rehoboam survives on the wall of the temple at Karnak. He was the king who had sheltered Jeroboam when he fled from Solomon ([[1 Kgs. 11:40]]).

      Kings sets the plunder right after Judah's sins (verses 22–24); Chronicles states the reason outright. Shishak came “because they had transgressed against the Lord,” and the prophet Shemaiah told the king, “Ye have forsaken me, and therefore have I also left you in the hand of Shishak” ([[2 Chr. 12:2]], [[2 Chr. 12:5]]). When Rehoboam and his princes humbled themselves, the LORD granted “some deliverance,” yet left them subject to Egypt, “that they may know my service, and the service of the kingdoms of the countries” ([[2 Chr. 12:7–8]]).

      The loss is measured in Solomon's gold. His three hundred shields of beaten gold had hung in the house of the forest of Lebanon ([[1 Kgs. 10:17]]). Rehoboam replaced them with bronze, kept them in the guardroom, and had them carried whenever he went up to the temple (verses 27–28).
    sources: [bd-shishak, lds-scriptures]

christ: |
  Ahijah could not see the woman at his door, but the LORD told him who she was before she spoke. The LORD of the Old Testament is the premortal Christ (see [[Ex. 3:14]]), who says of Himself, “there is none else save God that knowest thy thoughts and the intents of thy heart” ([[D&C 6:16]]; [[D&C 6:21]]), and whose word is “a discerner of the thoughts and intents of the heart” ([[D&C 33:1]]). The same Lord found “some good thing” in one child of a house given over to idols (verse 13).

  Jeroboam could not come to the Lord in his trouble, so he sent another in disguise. A disciple who lives worthily can call on the Lord in a crisis with confidence and faith, as Jeroboam could not. No disguise hides a person from Him, and the good that is in a heart does not go unseen by Him.

explore: |
  - **The word fulfilled.** [[1 Kgs. 15:25–30]], the end of Jeroboam's house; then [[2 Kgs. 17:7–23]], the end of Israel, told as the outcome of Jeroboam's sins.
  - **The same invasion in Chronicles.** [[2 Chr. 12:1–16]], with Shemaiah's word and Judah's humbling.
  - **A prophet in disguise in the Book of Mormon.** [[Mosiah 12:1]], and Scripture Central's KnoWhy #310, “Why Did Abinadi Use a Disguise?”, which sets Abinadi's disguise beside the biblical stories of prophets, kings and disguises.

