chapter: 17
title: According to My Word
tagline: Elijah seals the heavens against Baal's Israel, is fed by ravens at Cherith and by a widow of Zidon at Zarephath, and raises her son, until she knows that the word of the LORD in his mouth is truth.
when: 'In the reign of Ahab king of Israel, at the start of the drought'

setting: |
  Chapter 16 ended with Ahab, who “did evil in the sight of the LORD above all that were before him” ([[1 Kgs. 16:30]]). He married Jezebel, daughter of the king of the Zidonians, served Baal, and built Baal a house and an altar in Samaria ([[1 Kgs. 16:31–32]]). By then Israel had almost wholly left the worship of Jehovah for the Phoenician Baal. Into that kingdom Elijah steps without warning. A prophet's appearance is usually announced with “the word of the LORD came to…,” but Elijah is simply there, speaking to the king.

  His story runs from this chapter to his ascent in [[2 Kgs. 2]], and chapters 17–19 are its heart: the drought (17), the contest on Carmel that ends it (18), and the flight to Horeb (19). The drought is aimed at Baal, the storm god his worshipers looked to for rain (Jezebel and her god are taken up at [[1 Kgs. 16:31]]), and his priests could do nothing to stop a drought that Elijah had sealed.

  The New Testament reads this chapter twice. Jesus used the widow of Zarephath to rebuke the unbelief of His own people ([[Luke 4:25–26]]), and James held up Elijah's prayer as an example of a righteous man's prayer ([[James 5:17–18]]). Both give the length of the drought as three and a half years.

thread: |
  The chapter is about whose word controls the rain. Elijah's first sentence ends “but according to my word” (verse 1), and he says it to a king who has built a house and an altar for Baal ([[1 Kgs. 16:32]]). On one older reading, his “my word” is set pointedly against the prophets of Baal. Then the narrative shows where Elijah's word comes from. “The word of the LORD came unto him” (verses 2, 8), and he “did according unto the word of the LORD” (verse 5). The widow does “according to the saying of Elijah” (verse 15), and the meal and oil last “according to the word of the LORD, which he spake by Elijah” (verse 16).

  The last scene moves from rain to life. The son dies, the mother blames the prophet, and Elijah takes the child upstairs and cries to the LORD, who hears. The widow ends by confessing what the chapter has been showing: “the word of the LORD in thy mouth is truth” (verse 24), and she says it in a Phoenician town where Baal was worshipped.

sections:
  - range: 1-7
    heading: The drought and the brook Cherith
    plain: |
      Elijah the Tishbite, one of the settlers in Gilead, said to Ahab, “As surely as the LORD, the God of Israel, lives, whom I serve, there will be neither dew nor rain in the years ahead except at my word.” Then the word of the LORD came to Elijah: “Leave here, turn east, and hide by the brook Cherith, east of the Jordan. You will drink from the brook, and I have commanded the ravens to feed you there.” So he did as the LORD said and lived by the brook Cherith. The ravens brought him bread and meat in the morning and bread and meat in the evening, and he drank from the brook. After a while the brook dried up, because there had been no rain in the land.
  - range: 8-16
    heading: The widow of Zarephath
    plain: |
      Then the word of the LORD came to him: “Get up and go to Zarephath, a town of Zidon, and stay there. I have commanded a widow there to feed you.” So he went to Zarephath. When he reached the town gate, there was a widow gathering sticks. He called to her, “Please bring me a little water in a jar to drink.” As she was going to get it, he called after her, “And please bring me a piece of bread.” She answered, “As surely as the LORD your God lives, I have no bread, only a handful of flour in a jar and a little oil in a jug. I am gathering a couple of sticks so that I can go home and bake it for my son and me, so that we can eat it, and then die.” Elijah said to her, “Don't be afraid. Go and do as you said. But first make me a small loaf from it and bring it to me, and afterward make something for yourself and your son. For this is what the LORD, the God of Israel, says: ‘The jar of flour will not run out and the jug of oil will not run dry until the day the LORD sends rain on the land.’” She went and did as Elijah said, and she, Elijah, and her household had food for many days. The jar of flour did not run out and the jug of oil did not run dry, just as the LORD had said through Elijah.
  - range: 17-24
    heading: The widow's son
    plain: |
      Some time later the son of the woman who owned the house fell sick. His illness grew worse and worse until he stopped breathing. She said to Elijah, “What do you have against me, man of God? Did you come to me to bring my sin to God's attention and kill my son?” “Give me your son,” Elijah answered. He took him from her arms, carried him up to the upper room where he was staying, and laid him on his own bed. He cried out to the LORD, “LORD my God, have You brought disaster even on this widow I am staying with, by killing her son?” Then he stretched himself out on the child three times and cried to the LORD, “LORD my God, please let this child's life return to him.” The LORD heard Elijah's cry. The child's life returned to him, and he lived. Elijah picked up the child, carried him down from the upper room into the house, and gave him to his mother. “Look,” Elijah said, “your son is alive.” The woman said to Elijah, “Now I know that you are a man of God, and that the word of the LORD in your mouth is true.”

notes:
  - ref: 1
    phrase: Elijah the Tishbite, who was of the inhabitants of Gilead
    kind: history
    title: Elijah the Tishbite
    body: |
      Almost everything the Bible tells of Elijah's background is in this one line. His name means “Jehovah is my God,” and nothing is known of his parents. Gilead is the rugged hill country east of the Jordan. “Tishbite” is the puzzle, since no place is known from which it could come.

      The Hebrew may help. The word behind “inhabitants” can mean a sojourner, a settler from somewhere else, the word Abraham used of himself among the Hittites ([[Gen. 23:4]]), and it has the same consonants as “Tishbite.” So the line can be read “Elijah from Tishbe, who was one of the settlers in Gilead,” or “Elijah the Tishbite of Tishbe in Gilead.” Either way he lived in Gilead, east of the Jordan, though on the first reading he had come there from somewhere else; it is even possible that he was not an Israelite by birth but a convert from outside Israel. Neither reading gives his family.
    sources: [bd-elijah, ot-minute-1-kings-17]

  - ref: 1
    phrase: there shall not be dew nor rain these years, but according to my word
    kind: prophets
    title: According to my word
    body: |
      Latter-day Saints read Elijah's oath as the sealing power at work. Elder Joseph Fielding Smith quoted verse 1 twice so that his hearers would see “the sealing power by which Elijah was able to close the heavens, that there should be no rain or dew until he spoke.” The same holds of all his miracles: they show that his power was the sealing power of the priesthood, by which what is bound or loosed on earth is bound or loosed in heaven. How Elijah brought that power and its keys back in the latter days is told at [[2 Kgs. 2:11]] and [[Mal. 4:5]].

      The Book of Mormon gives the closest parallel. The Lord gave Nephi, son of Helaman, power to “smite the earth with famine” along with the power that “whatsoever ye shall seal on earth shall be sealed in heaven” ([[Hel. 10:6–7]]). Nephi later asked for rain “according to my words” ([[Hel. 11:13]]), Elijah's own phrase, and a Latter-day Saint study holds that Mormon seems to have shaped Nephi's story to parallel Elijah's.

      “Before whom I stand” means “whom I serve,” and an older reading says the drought carried out the law's own warning to an idolatrous people: if Israel served other gods, the LORD would shut up the heaven, “that there be no rain” ([[Deut. 11:17]]). James says how the power was exercised: Elijah “prayed earnestly that it might not rain” ([[James 5:17]]). On the same older reading, a prophet's power to work came only through faith and prayer to God.
    sources: [ot-manual-5, bd-elijah, sc-knowhy-348, keil-kings, lds-scriptures]

  - ref: 4
    phrase: I have commanded the ravens to feed thee there
    kind: history
    title: Fed by ravens
    body: |
      The ravens are best read as birds, and the feeding as a miracle. Some scholars have argued that “ravens” is a mistranslation for merchants or traders, and others disagree. The setting is against it. Elijah was in hiding, and traders would hardly come to him twice a day. Cherith seems to have been an obscure, isolated place, where Elijah could hide safely and was completely dependent on the Lord for food. Turning the ravens into people would undercut both things the story is telling, the miracle and Elijah's isolation.

      The provision was enough and no more. Ravens brought him bread and meat, but, as Elder Jeffrey R. Holland observed, “unless ravens carry more than I think they do, this was not a gourmet meal,” and then the brook dried up “because there had been no rain in the land” (verse 7). The drought Elijah announced fell on him too.
    sources: [ot-manual-5, ot-minute-1-kings-17, holland-handful-meal-1996]

  - ref: 9
    phrase: Zarephath, which belongeth to Zidon
    kind: history
    title: A widow in Jezebel's country
    body: |
      The LORD sends Elijah out of Israel into the heart of Baal's country. Zarephath was a Phoenician town between Tyre and Sidon, and its people worshipped Baal. In Elijah's day it belonged to Sidon, Jezebel's hometown, whose king was her father ([[1 Kgs. 16:31]]), so Elijah is sent to live in her father's land.

      The one who feeds him is a widow and not an Israelite. The LORD says He has already “commanded” her, and Elder Holland adds that “the widow had been prepared by the Lord for this request.” The timing matters too: Elijah was not sent until the widow and her son were at the point of death, the moment when her faith would be tested.
    sources: [bd-zarephath, scripture-helps-1-kings, ot-minute-1-kings-17, holland-handful-meal-1996, robbins-tithing-2005, lds-scriptures]

  - ref: 12
    phrase: an handful of meal in a barrel, and a little oil in a cruse
    kind: history
    title: A handful of meal and two sticks
    body: |
      The widow's answer shows how little she had. A handful of flour would have been perhaps one serving. The “cake” she could not make was not something sweet but a flat bread baked quickly in the fire. Her “two sticks” show how small a fire she needed, and she speaks, in Elder Holland's words, “in her hunger and fatigue and motherly anguish.” She means to make one last meal for herself and her son, “that we may eat it, and die.” This is the household the LORD has “commanded” to feed His prophet.
    sources: [ot-minute-1-kings-17, holland-handful-meal-1996, robbins-tithing-2005]

  - ref: 13
    phrase: make me thereof a little cake first
    kind: prophets
    title: Make me thereof a little cake first
    body: |
      Elijah's “first” is a test of faith that comes with a promise: “The barrel of meal shall not waste, neither shall the cruse of oil fail” (verse 14). She is asked to act on the LORD's word before she can see it kept.

      The narrator's sentence, “she went and did according to the saying of Elijah” (verse 15), was for Elder Holland an “understated expression of faith—as great, under these circumstances, as any I know in the scriptures.” Perhaps uncertain, he suggested, what her faith would cost her son, she took the loaf to Elijah first, trusting that if nothing were left, at least they would have died “in an act of pure charity.”
    sources: [holland-handful-meal-1996]

  - ref: 18
    phrase: art thou come unto me to call my sin to remembrance, and to slay my son?
    kind: history
    title: To call my sin to remembrance
    body: |
      The widow takes her son's death as a punishment for her sin, and supposes that the man of God's presence in her house has brought that sin to God's notice. Her cry can be read more as a plea for help than as an accusation: she had sheltered a prophet, expecting blessing and protection, and tragedy has come to her home instead.

      Elijah's own prayer asks the same question of the LORD: “hast thou also brought evil upon the widow with whom I sojourn, by slaying her son?” (verse 20). On one older reading, the “also” counts this grief with the other harm the drought had done. On that reading, the words do not reproach God but show Elijah's compassion for the woman who had kept him alive. The same reading sets the scene beside the man born blind: the death was not sent to punish a particular sin, but so that the works of God would be shown in her ([[John 9:3]]).
    sources: [keil-kings, ot-manual-5]

  - ref: 21
    phrase: he stretched himself upon the child three times
    kind: history
    title: He stretched himself upon the child
    body: |
      The Church's footnote sets Elijah's act beside Elisha's ([[2 Kgs. 4:34]]) and Paul's ([[Acts 20:10]]), and the three are not quite the same. One older reading notes that Paul embraced Eutychus to see whether life was still in him, and that Elisha's action is described differently, as warming the child's body. On that reading, Elijah stretched himself on the boy three times to bring the life-giving power of God down on the dead body, and he did it together with his prayer. The text gives the prayer the weight. Elijah “cried unto the LORD” before and after he stretched himself on the child, and what follows is “the LORD heard the voice of Elijah” (verse 22).
    sources: [keil-kings, lds-scriptures]

  - ref: 22
    phrase: the soul of the child came into him again
    kind: words
    title: The soul came into him again
    body: |
      The King James “soul” is *nepeš*, the life that leaves a person at death and returns with life, which is its sense in these two verses. The child had died: his mother says the prophet has come “to slay my son” (verse 18), and Elijah's prayer speaks of “slaying her son” (verse 20). So verse 22 means that his life came back.

      The miracle shows Elijah using priesthood power to restore the dead to life. A Jewish tradition held that only God kept the keys of birth, rain and resurrection; Elijah could raise the widow's son, the rabbis suggested, because God had given him the keys of the resurrection.
    sources: [bdb, oshb-wlc, read-elijah-elisha, sc-knowhy-348]

  - ref: 24
    phrase: the word of the LORD in thy mouth is truth
    kind: history
    title: Now by this I know
    body: |
      The widow's testimony came when her son was raised, not when the meal and oil kept her alive. She had eaten from the jar for “many days” (verse 15), and when her son died she still turned on the prophet. Her son given back alive is what brings her to say that Elijah is a man of God and that the LORD's word in his mouth is true. She had called him “man of God” once before, in her grief (verse 18); now she adds that the LORD's word in his mouth is true.
    sources: [ot-minute-1-kings-17]

christ: |
  Jesus Christ used this chapter against the unbelief of His own people. At Nazareth He reminded His neighbors that many widows were in Israel during the drought, “But unto none of them was Elias sent, save unto Sarepta, a city of Sidon, unto a woman that was a widow” ([[Luke 4:26]]), setting her faith against their unbelief in Him. Elijah's miracles here have counterparts in Christ's: food multiplied for the widow beside the loaves He multiplied ([[Matt. 14:17–21]]), and her son raised beside the dead He raised ([[Matt. 9:18–25]]). Elisha later multiplied oil for another widow ([[2 Kgs. 4:1–7]]), and on one Latter-day Saint reading two such like miracles stand as two witnesses ([[2 Cor. 13:1]]). In that reading the widow stands for Israel, which by straying from the truth has become “spiritually widowed and fatherless—separated from its true Bridegroom and Father,” and the meal and oil that did not fail stand for the nourishment Christ and His servants bring her, which never ceases. On one older reading, Elijah shows himself here as the forerunner of Him who raises all the dead.

  The widow gave her last handful before the promise could be seen, and the doctrine Elijah acted on is the one Moroni taught: “ye receive no witness until after the trial of your faith” ([[Ether 12:6]]). For a disciple, the witness that the Lord's word is true comes as it came to her: after the trial of faith, not before it.

explore: |
  - **Jesus' sermon at Nazareth.** [[Luke 4:16–30]], where the widow of Zarephath and Naaman are His examples.
  - **Elisha's widow and the Shunammite's son.** [[2 Kgs. 4:1–7]] and [[2 Kgs. 4:18–37]], two miracles like this chapter's, which together bear witness of Christ.
  - **Nephi and the sealing power.** [[Hel. 10:4–11]] and [[Hel. 11:1–18]], a famine sealed and loosed by a prophet's word.
  - **Another widow who gave everything.** [[Mark 12:41–44]], which Elder Holland set beside the widow of Zarephath in “[A Handful of Meal and a Little Oil](https://www.churchofjesuschrist.org/study/general-conference/1996/04/a-handful-of-meal-and-a-little-oil?lang=eng).”

