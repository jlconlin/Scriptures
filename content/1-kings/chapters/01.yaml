chapter: 1
title: Who Shall Sit on the Throne
tagline: With David old and failing, his eldest living son Adonijah proclaims himself king at a feast; Nathan and Bath-sheba remind David of his oath, and David has Solomon anointed at Gihon and seated on his throne the same day, while Adonijah's guests scatter and he flees to the altar.
when: 'In the last days of king David, at Jerusalem'

setting: |
  1 Kings opens where 2 Samuel leaves David: old, in Jerusalem, his house divided. The Jews counted Kings as one book; the Greek translation divided Samuel and Kings into two parts each, and the English Bible follows that division. The history runs from Adonijah's bid for the throne in this chapter to the final captivity of Judah, and takes in the whole history of the northern kingdom on the way: more than four hundred years, from David's death to the last days of King Jehoiachin in Babylon.

  The writer is not named, and when and where he wrote is not known. He compiled the history from written records and names some of them: “the book of the acts of Solomon” ([[1 Kgs. 11:41]]) and “the book of the chronicles of the kings of Israel” ([[1 Kgs. 14:19]]) and of Judah ([[1 Kgs. 14:29]]). The chronicles of the kings of Israel were records kept under the kings' direction, not the books of 1 and 2 Chronicles in our Bible. The Book of Mormon's plates of brass held a “record of the Jews” ([[1 Ne. 5:12]]), which likely included 1 and 2 Samuel and 1 and 2 Kings.

  The chapter follows on from the troubles in David's family. Nathan had told David that “the sword shall never depart from thine house” ([[2 Sam. 12:10]]). Amnon and Absalom were dead by the time of this chapter ([[2 Sam. 13:28–29]]; [[2 Sam. 18:14–15]]), and the throne would go either to the next son in line or to the son the LORD had named.

thread: |
  The chapter turns on the question Bath-sheba puts to David: who “shall sit on the throne of my lord the king after him” (verse 20). It offers two answers. Adonijah's is the ordinary rule of the ancient world. He is the eldest son still living, and he gathers the captain of the host, a high priest, his brothers and a feast to acclaim him. The other answer is the LORD's choice of Solomon, which David had sworn to keep. A prophet, a priest and the king's guard back that choice, and David says it aloud at the end: “Blessed be the LORD God of Israel, which hath given one to sit on my throne this day” (verse 48). The chapter tells how the second answer was made public: by the king's own mule, the holy oil, the trumpet and a city loud enough to be heard at Adonijah's table.

  One older reading takes Kings as a whole to be the story of how the LORD kept His promise to David's seed ([[2 Sam. 7:12–16]]). On that reading this chapter is the promise's first test, and Solomon receives his father's whole kingdom as the promised seed, in spite of the attempt to take it.

sections:
  - range: 1-4
    heading: The king grows old
    plain: |
      King David was old and well on in years, and though they covered him with clothes he could not keep warm. So his servants said to him, “Let a young woman be found for my lord the king, to attend the king and wait on him, and let her lie close to you so that my lord the king may be warm.” They searched for a beautiful girl throughout the land of Israel, found Abishag from Shunem, and brought her to the king. She was very beautiful, and she waited on the king and served him, but the king had no relations with her.
  - range: 5-10
    heading: Adonijah makes himself king
    plain: |
      Then Adonijah, the son of Haggith, put himself forward and said, “I will be king.” He provided himself with chariots and horsemen and fifty men to run ahead of him. His father had never once crossed him by asking, “Why have you done this?” He was also a very handsome man, and he was born next after Absalom.

      He talked it over with Joab the son of Zeruiah and with Abiathar the priest, and they took Adonijah's side and helped him. But Zadok the priest, Benaiah the son of Jehoiada, Nathan the prophet, Shimei, Rei, and David's mighty men did not side with Adonijah. Adonijah sacrificed sheep, oxen and fatted cattle by the stone of Zoheleth, near En-rogel, and invited all his brothers, the king's sons, and all the men of Judah who served the king. But he did not invite Nathan the prophet, Benaiah, the mighty men, or his brother Solomon.
  - range: 11-27
    heading: Nathan and Bath-sheba go to the king
    plain: |
      So Nathan said to Bath-sheba, Solomon's mother, “Have you not heard that Adonijah the son of Haggith has become king, and David our lord does not know it? Now let me give you advice, so that you can save your own life and the life of your son Solomon. Go in to King David and say to him, ‘My lord the king, did you not swear to your servant, “Solomon your son shall surely reign after me, and he shall sit on my throne”? Why then has Adonijah become king?’ While you are still speaking with the king, I will come in after you and confirm what you say.”

      So Bath-sheba went in to the king in his room. The king was very old, and Abishag the Shunammite was serving him. Bath-sheba bowed low before the king, and the king asked, “What do you want?” She said, “My lord, you swore to your servant by the LORD your God that Solomon your son would reign after you and sit on your throne. But now Adonijah has become king, and you, my lord the king, do not know it. He has sacrificed oxen, fatted cattle and sheep in great numbers and has invited all the king's sons, Abiathar the priest and Joab the commander of the army, but he has not invited your servant Solomon. And you, my lord the king: the eyes of all Israel are on you, to tell them who shall sit on the throne of my lord the king after him. Otherwise, when my lord the king lies down with his fathers, I and my son Solomon will be treated as criminals.”

      While she was still speaking with the king, Nathan the prophet arrived. They told the king, “Nathan the prophet is here,” and he came in before the king and bowed with his face to the ground. Nathan said, “My lord the king, have you said, ‘Adonijah shall reign after me, and he shall sit on my throne’? For today he has gone down and sacrificed oxen, fatted cattle and sheep in great numbers, and has invited all the king's sons, the commanders of the army and Abiathar the priest. They are eating and drinking with him and saying, ‘God save King Adonijah!’ But me, your servant, and Zadok the priest, Benaiah the son of Jehoiada, and your servant Solomon he has not invited. Has my lord the king done this without telling your servants who should sit on the throne of my lord the king after him?”
  - range: 28-40
    heading: David keeps his oath, and Solomon is anointed
    plain: |
      King David answered, “Call Bath-sheba to me.” She came into the king's presence and stood before him. The king swore: “As the LORD lives, who has redeemed my life out of every trouble, as I swore to you by the LORD God of Israel that Solomon your son shall reign after me and sit on my throne in my place, so I will do this very day.” Bath-sheba bowed with her face to the ground, did homage to the king, and said, “May my lord King David live for ever.”

      Then King David said, “Call Zadok the priest, Nathan the prophet and Benaiah the son of Jehoiada to me.” When they came before the king, he told them, “Take your lord's servants with you, set my son Solomon on my own mule, and bring him down to Gihon. There let Zadok the priest and Nathan the prophet anoint him king over Israel. Blow the trumpet and say, ‘God save King Solomon!’ Then come up after him, and let him come and sit on my throne, for he shall be king in my place. I have appointed him to be ruler over Israel and over Judah.” Benaiah the son of Jehoiada answered the king, “Amen! May the LORD, the God of my lord the king, say so too. As the LORD has been with my lord the king, so may He be with Solomon, and make his throne greater than the throne of my lord King David.”

      So Zadok the priest, Nathan the prophet, Benaiah the son of Jehoiada, and the Cherethites and the Pelethites went down, set Solomon on King David's mule, and brought him to Gihon. Zadok the priest took a horn of oil from the tabernacle and anointed Solomon. They blew the trumpet, and all the people said, “God save King Solomon!” All the people went up after him, playing on pipes and rejoicing so greatly that the ground split with the noise.
  - range: 41-53
    heading: Adonijah's feast breaks up
    plain: |
      Adonijah and all his guests heard it just as they finished eating. When Joab heard the sound of the trumpet, he said, “Why is the city in such an uproar?” While he was still speaking, Jonathan the son of Abiathar the priest arrived. Adonijah said, “Come in, for you are a worthy man and bring good news.” Jonathan answered Adonijah, “No: our lord King David has made Solomon king. The king sent Zadok the priest, Nathan the prophet, Benaiah the son of Jehoiada, and the Cherethites and the Pelethites with him, and they set him on the king's mule. Zadok the priest and Nathan the prophet have anointed him king at Gihon, and they have come up from there rejoicing, so that the city rings with it. That is the noise you heard. Solomon is sitting on the royal throne. And the king's servants have come to congratulate our lord King David, saying, ‘May God make Solomon's name more famous than yours and his throne greater than yours.’ And the king bowed in worship on his bed. The king also said, ‘Blessed be the LORD God of Israel, who has given one to sit on my throne this day, and let my own eyes see it.’”

      Then all Adonijah's guests were afraid; they got up and went each his own way. Adonijah, in fear of Solomon, got up, went and took hold of the horns of the altar. Solomon was told, “Adonijah is afraid of King Solomon; he has taken hold of the horns of the altar and says, ‘Let King Solomon swear to me today that he will not put his servant to death with the sword.’” Solomon said, “If he proves himself a worthy man, not a hair of his head shall fall to the ground; but if wickedness is found in him, he shall die.” So King Solomon sent, and they brought him down from the altar. He came and bowed before King Solomon, and Solomon said to him, “Go to your house.”

notes:
  - ref: 4
    phrase: but the king knew her not
    kind: history
    title: Abishag and the failing king
    body: |
      The opening verses show a king grown old and feeble, and that is the opening Adonijah takes. David cannot keep warm under his blankets, and his servants find a young woman to wait on him. She nursed and served him, and the narrator adds that the king never had relations with her. David's age and weakness evidently persuaded Adonijah that the time had come to show the people he was the heir.

      The last line of verse 4 matters in the next chapter. After David's death Adonijah asks for Abishag as his wife ([[1 Kgs. 2:17]]), and Solomon hears in the request a claim to the throne: “ask for him the kingdom also; for he is mine elder brother” ([[1 Kgs. 2:22]]). On one reading, marrying the young woman who had served David would have burnished Adonijah's claim to the royal line. Why that request cost him his life is taken up at [[1 Kgs. 2:22]].
    sources: [ot-manual-kings-1, hudson-irregular-kings, lds-scriptures]

  - ref: 5
    phrase: I will be king
    kind: history
    title: Adonijah's claim
    body: |
      Adonijah had a real claim by the customs of his world. He was David's fourth son ([[2 Sam. 3:4]]). Amnon and Absalom were dead, and Chileab, the second, is never mentioned after his birth and most likely died young, so Adonijah was probably the eldest son living. Kingdoms in the ancient Near East were expected to pass from the king to his eldest son. Adonijah himself later remembers that “the kingdom was mine, and … all Israel set their faces on me” ([[1 Kgs. 2:15]]).

      He went about it as Absalom had. Absalom “prepared him chariots and horses, and fifty men to run before him” ([[2 Sam. 15:1]]), and Adonijah prepares the same. These were a prince's state carriages and his mounted escort, not an army. Adonijah pressed his claim as the eldest son, with public acclaim, many of the court's officials and nearly all his brothers behind him. Solomon's claim rested on God's choice and the reigning king's word, and on a pattern the Bible tells often: Jacob, Joseph and David were younger sons who took the place the eldest was expected to have.

      On one older reading, Israel's law had already settled which of the two counted: the king was to be one “whom the LORD thy God shall choose” ([[Deut. 17:15]]), and the LORD kept that choice for Himself with Solomon as He had with Saul and David. The verse's own word for Adonijah's bid is that he “exalted himself.”
    sources: [keil-kings, hudson-irregular-kings, lds-scriptures]

  - ref: 6
    phrase: his father had not displeased him at any time in saying, Why hast thou done so?
    kind: history
    title: A father who never asked why
    body: |
      The narrator stops to say why Adonijah dared: his father had never once crossed him, not even to ask, “Why hast thou done so?” The verse traces Adonijah's daring to his father's indulgence. David's sin with Bath-sheba was followed by constant feuds in his family, and in Absalom and Adonijah they ended in open rebellion. They are read as the fulfillment of Nathan's word to David, “the sword shall never depart from thine house” ([[2 Sam. 12:10]], where the sentence is explained). Adonijah's bid is the last of those troubles in David's lifetime.
    sources: [bd-david, lds-scriptures]

  - ref: 8
    phrase: were not with Adonijah
    kind: history
    title: Two parties at court
    body: |
      The men named in verses 7–8 split the court down the middle, and the split decides the rest of the story. Joab, the captain of the host, had been part of every great event of David's reign and was generally faithful to him, but he favored Adonijah's succession, and under Solomon he was put to death at the altar (why is told at [[1 Kgs. 2:28–34]]). Abiathar had been David's priest since he escaped Saul's slaughter of the priests at Nob ([[1 Sam. 22:20]]), and he had stood by David through the years of flight and Absalom's revolt. Now he joined Adonijah.

      On the other side stood Zadok, Benaiah, Nathan and the mighty men. Since Saul's last years there seem to have been two high priests at once, Abiathar with David and Zadok at Gibeon, where the tabernacle stood. In Adonijah's rebellion Abiathar joined the rebels and Zadok stayed faithful. Zadok anointed Solomon and in time took Abiathar's place ([[1 Kgs. 2:35]]; how that fulfills the word to Eli is told at [[1 Kgs. 2:27]]). The choice of this day lasted for centuries: only Zadok's direct descendants held the high priesthood from Solomon to the Hellenistic period. Benaiah was over the Cherethites and the Pelethites ([[2 Sam. 8:18]], where the guard is explained). Adonijah knew the parties as well as anyone: his invitations left out exactly these men (verse 10).
    sources: [bd-joab, bd-abiathar, bd-zadok, huntsman-palm-sunday, lds-scriptures]

  - ref: 17
    phrase: thou swarest by the LORD thy God unto thine handmaid
    kind: scripture
    title: The oath David had sworn
    body: |
      Nathan's plan rests on an oath that Bath-sheba, Nathan and David all speak of as known (verses 13, 17, 30): “Assuredly Solomon thy son shall reign after me.” The chapter does not say when David swore it. What scripture does record, in three places, is the LORD's choice of Solomon. When Solomon was born, “the LORD loved him,” and sent word by Nathan naming him Jedidiah ([[2 Sam. 12:24–25]]). Chronicles makes the choice explicit. David is told, “a son shall be born to thee … his name shall be Solomon” ([[1 Chr. 22:9]]), and he tells the assembly that “of all my sons, (for the LORD hath given me many sons,) he hath chosen Solomon my son to sit upon the throne of the kingdom of the LORD over Israel” ([[1 Chr. 28:5]]).

      Nathan had once rebuked David over Bath-sheba ([[2 Sam. 12]]). Now he and Bath-sheba come before the king together, and he anoints her son. Adonijah, when it is over, concedes the point: the kingdom “is become my brother's: for it was his from the LORD” ([[1 Kgs. 2:15]]).
    sources: [lds-scriptures, bd-nathan]

  - ref: 33
    phrase: cause Solomon my son to ride upon mine own mule
    kind: symbol
    title: The king's own mule
    body: |
      Setting Solomon on David's own mule told the whole city who the next king was before a word was said. On one older reading, a king who let a man ride the animal he himself rode was marking that man as his successor. David meant the people to see clearly that Solomon was his choice and the LORD's, so he ordered the ceremony done at once and in the open: the ride down to Gihon on the king's mount, the anointing, the trumpet and the cry, and the procession back up to the throne (verses 33–35). The procession followed the traditional form of a king's triumphal entry into a city. The narrator tells the ride three times, in David's order, in the doing and in Jonathan's report to Adonijah (verses 33, 38, 44).

      Solomon reigned beside his father from this day. David, still alive, appoints him “ruler over Israel and over Judah” (verse 35), and Solomon “sitteth on the throne of the kingdom” (verse 46). The two ruled together until David died. Chronicles tells of a later assembly at which Israel “made Solomon the son of David king the second time” ([[1 Chr. 29:22]]).
    sources: [keil-kings, ot-manual-kings-1, lds-scriptures]

  - ref: 39
    phrase: Zadok the priest took an horn of oil out of the tabernacle, and anointed Solomon
    kind: history
    title: The holy oil and the anointing
    body: |
      Solomon was made king the way Saul and David had been made king: he was anointed with oil. Israel's kings were anointed to their office by the prophets ([[1 Sam. 10:1]]; [[1 Sam. 16:13]]), and here priest and prophet act together. David orders Zadok and Nathan to anoint him (verse 34), and Jonathan reports that both did (verse 45). The oil itself came from the sanctuary: Zadok took it “out of the tabernacle.” The holy anointing oil of the law of Moses was olive oil mixed with spices, kept for the ceremonies the law named ([[Ex. 30:22–33]]).

      The man with the horn was not the one who made the king. In the Psalms the LORD calls the anointing His own: “with my holy oil have I anointed him” ([[Ps. 89:20]]). Zadok poured the oil as a priest acting for the LORD, who is the One who anoints.
    sources: [bd-anoint, bd-nathan, sc-knowhy-642, lds-scriptures]

  - ref: 50
    phrase: caught hold on the horns of the altar
    kind: history
    title: Adonijah at the altar
    body: |
      Adonijah ran to the altar, whose horns were at times a place of refuge for fugitives. (What the horns were is explained at [[Ex. 27:2]].) The law set a limit to that refuge. A man who killed “with guile” was to be taken “from mine altar, that he may die” ([[Ex. 21:14]]). Nothing in the chapter charges Adonijah with bloodshed, and he asks only for Solomon's oath that he will not be put to the sword (verse 51).

      Solomon gives a promise with a condition instead of an oath. If Adonijah proves “a worthy man,” not a hair of his head will fall; if wickedness is found in him, he will die (verse 52). Adonijah bows to Solomon as king and is sent home. The condition is tested in the next chapter, when Adonijah asks for Abishag and Solomon swears that Adonijah has spoken “this word against his own life” ([[1 Kgs. 2:23]]). At an altar again, Joab, who had “shed the blood of war in peace” ([[1 Kgs. 2:5]]), finds no refuge ([[1 Kgs. 2:28–34]]).
    sources: [bd-altar, lds-scriptures]

christ: |
  The anointing at Gihon stands behind one of the Savior's titles. *Messiah* means “the anointed,” and as a title it named the King and Deliverer Israel was waiting for; *Christ* is the same word in Greek. Solomon's ride has a counterpart in Jesus' entry into Jerusalem. Solomon rode the king's mule to his anointing at the base of the Mount of Olives to the cry “God save king Solomon,” and Jesus rode into the city from the Mount of Olives as His followers cried, “Blessed be the kingdom of our father David, that cometh in the name of the Lord” ([[Mark 11:10]]).

  In this chapter the throne goes to the son the LORD chose, not to the son who reached for it, and the angel told Mary that “the Lord God shall give unto him the throne of his father David” ([[Luke 1:32]]). Jesus' kingship, like Solomon's, is the Father's gift and not a throne seized, so the King a disciple follows reigns by God's appointment.

explore: |
