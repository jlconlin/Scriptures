  - **How the throne was secured.** [[1 Kgs. 2:13–46]], Adonijah, Abiathar, Joab and Shimei.
  - **The King who comes lowly.** [[Zech. 9:9]] and [[Matt. 21:1–11]]; the note at [[Zech. 9:9]] on the royal donkey.

