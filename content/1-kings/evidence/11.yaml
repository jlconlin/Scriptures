chapter: 11
claims:
  - where: setting
    claim: 'The Church''s footnotes print five Joseph Smith Translation readings in 1 Kings 11, each touching David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: 'JST 1 Kgs. 11:39 And for the transgression of David, and also for the people, I have rent the kingdom, and for this I will afflict …'
  - where: thread
    claim: 'JST 11:33: Solomon repenteth not as did David, that I may forgive him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: 'JST 1 Kgs. 11:33 … and his heart is become as David his father; and he repenteth not as did David his father, that I may forgive him.'
  - where: thread
    claim: 'JST 11:4: his heart became as the heart of David'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/83'
    quote: 'his heart was not perfect with the Lord his God, and it became as the heart of David his Father.'

  - where: 'note 11:1 “Strange women”'
    claim: '“Strange” means foreign; Solomon broke the command not to marry outside the covenant; the marriages were likely political and economic'
    key: scripture-helps-2-samuel-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/24-2-samuel-11-12-1-kings-3-6-9-11?lang=eng'
    quote: 'he violated the Lord’s commandment to not marry outside of the covenant. The Hebrew word translated as strange in the King James Version of the Bible means “foreign.” Many of these marriages were likely motivated by political and economic factors.'
  - where: 'note 11:1 “Strange women”'
    claim: 'The command in 11:2 quotes no single passage; the nearest is Deut. 7:1–4; Rehoboam''s mother was an Ammonite'
    key: ot-minute-1-kings-11
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-11'
    quote: 'This commandment from the Lord is not a direct quote of any specific passage. … (the most similar being Deuteronomy 7:1–4). Rehoboam, Solomon’s son who inherited the kingdom, was the son of Naamah, who was an Ammonite'
  - where: 'note 11:1 “Strange women”'
    claim: 'Deut. 17:17 seems to be behind the condemnation of Solomon''s wives'
    key: sears-shannon-polygamy
    url: 'https://rsc.byu.edu/household-god/let-me-take-another-wife'
    quote: 'Deuteronomy 17:17 seems to be behind the condemnation of the wives of King Solomon in 1 Kings 11:1–8'
  - where: 'note 11:1 “Strange women”'
    claim: 'Rehoboam''s mother was Naamah an Ammonitess (1 Kgs. 14:21); the footnote to 11:1 points to Deut. 17:17'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: '1b “strange”: Deut. 17:17; Neh. 13:26.'

  - where: 'note 11:3 “What latter-day scripture says of Solomon''s wives”'
    claim: 'The round numbers may be exaggeration or stylization (his reading); Solomon certainly had many wives, some political marriages'
    key: ot-minute-1-kings-11
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-11'
    quote: 'The nice round numbers and the fact that they add up to an even one thousand may indicate an exaggeration or linguistic stylization on the author’s part. Solomon certainly had many wives, and some of them were political marriages'
  - where: 'note 11:3 “What latter-day scripture says of Solomon''s wives”'
    claim: 'Some of Solomon''s marriages were authorized and many were not; the unauthorized were abominable'
    key: scripture-helps-2-samuel-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/24-2-samuel-11-12-1-kings-3-6-9-11?lang=eng'
    quote: 'While some of Solomon’s marriages were authorized by the Lord, many were not. The marriages that were not authorized by the Lord were “abominable before [Him].”'
  - where: 'note 11:3 “What latter-day scripture says of Solomon''s wives”'
    claim: 'Joseph Fielding Smith: later in life Solomon took wives the Lord did not give him'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'Solomon was blessed and the Lord appeared to him and gave him visions and great blessings when he had plural wives, but later in his life, he took wives that the Lord did not give him.'
  - where: 'note 11:3 “What latter-day scripture says of Solomon''s wives”'
    claim: 'Jacob names David and Solomon, not Abraham and Jacob; its reading that he condemned exploitation, not plural marriage itself'
    key: sc-knowhy-64
    url: 'https://scripturecentral.org/knowhy/what-does-the-book-of-mormon-say-about-polygamy'
    quote: 'That Jacob speaks ill of these biblical polygamists but not righteous men such as Abraham and Jacob, who also married multiple wives … wasn’t plural marriage itself, but rather women being exploited for social and material benefit in relationships unapproved by God.'
  - where: 'note 11:3 “What latter-day scripture says of Solomon''s wives”'
    claim: 'D&C 132:1 names Solomon among those justified; 132:38'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/132?lang=eng'
    quote: 'justified my servants Abraham, Isaac, and Jacob, as also Moses, David and Solomon, my servants, as touching the principle and doctrine of their having many wives and concubines'

  - where: 'note 11:4 “As the heart of David”'
    claim: 'The manuscript reading of 11:4'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/83'
    quote: 'his heart was not perfect with the Lord his God, and it became as the heart of David his Father.'
  - where: 'note 11:4 “As the heart of David”'
    claim: 'The manuscript readings of 11:4 and 11:6'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/83'
    quote: '6th. And Solomon did evil in the sight of the Lord, as David his Father, and went not fully after the Lord.'
  - where: 'note 11:4 “As the heart of David”'
    claim: 'The manuscript reading of 11:33–34, with “in that day”'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/83'
    quote: 'and his heart is become as David his father; and he repenteth not as did David his Father, that I may forgive him. … because he kept my commandment and my statutes in that day.'
  - where: 'note 11:4 “As the heart of David”'
    claim: 'The change to 11:6 reverses the meaning; “in that day” implies David did not keep the commandments all his life'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'The JST adds “in that day.” This addition merely qualifies a time period when David kept the commandments and implies that it was not all of his life.'
  - where: 'note 11:4 “As the heart of David”'
    claim: 'The footnote to 11:4 prints the JST reading'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: 'JST 1 Kgs. 11:4 … and it became as the heart …'

  - where: 'note 11:5 “Ashtoreth, Milcom, Chemosh and Molech”'
    claim: 'Ashtoreth was an ancient Semitic goddess, a Phoenician deity, goddess of the Sidonians in 1 Kgs. 11:5'
    key: bdb
    url: 'https://biblehub.com/hebrew/6253.htm'
    quote: 'ancient Semitic goddess (with male counterpart in Moabite, Sabean and apparently Phoenician); Phoenician deity, עשׁתרת אֱלֹהֵי צִדֹנִים 1 Kings 11:5,33'
  - where: 'note 11:5 “Ashtoreth, Milcom, Chemosh and Molech”'
    claim: '“Abomination” is šiqqûṣ, a detested thing, usually of idols'
    key: bdb
    url: 'https://biblehub.com/hebrew/8251.htm'
    quote: 'שִׁקּוּץ, שִׁקֻּץ noun masculine … detested thing; … construct שִׁקֻּץ 1 Kings 11:5 + … of idols (so usually'
  - where: 'note 11:5 “Ashtoreth, Milcom, Chemosh and Molech”'
    claim: 'Molech or Milcom, the Ammonite fire god, worshipped with child sacrifice; practiced by Solomon'
    key: bd-molech
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/molech?lang=eng'
    quote: 'The abomination of the children of Ammon, a fire god, worshipped by passing children through or burning them in fire (Deut. 18:10; 2 Chr. 28:3). Molech worship was practiced by Solomon (1 Kgs. 11:5, 7)'
  - where: 'note 11:5 “Ashtoreth, Milcom, Chemosh and Molech”'
    claim: 'Chemosh was the god of Moab; Solomon''s high place on Mount Olivet; Josiah destroyed it; human sacrifice'
    key: bd-chemosh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/chemosh?lang=eng'
    quote: 'The god of Moab (1 Kgs. 11:7); also of Ammon (Judg. 11:24). Solomon built for him a high place on Mount Olivet (1 Kgs. 11:7), which Josiah destroyed (2 Kgs. 23:13). Chemosh was worshipped with human sacrifices (2 Kgs. 3:27).'
  - where: 'note 11:5 “Ashtoreth, Milcom, Chemosh and Molech”'
    claim: 'Josiah defiled the high places on the mount of corruption'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng'
    quote: 'And the high places that were before Jerusalem, which were on the right hand of the mount of corruption, which Solomon the king of Israel had builded for Ashtoreth'

  - where: 'note 11:9 “After two visions”'
    claim: 'Wirthlin: even after heavenly visitations Solomon turned away; the kingdom was decreed to be torn from him'
    key: wirthlin-higher-ground-2005
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2005/10/journey-to-higher-ground?lang=eng'
    quote: 'But even after heavenly visitations, even after receiving blessings above all men, Solomon turned away from the Lord. Because of this, the Lord decreed that the kingdom would be torn from him and given to his servant.'
  - where: 'note 11:9 “After two visions”'
    claim: 'The footnote to “appeared” points to the two appearances, 1 Kgs. 3:5 and 9:2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: '9b “appeared”: 1 Kgs. 3:5; 9:2.'

  - where: 'note 11:14 “Adversaries the LORD raised”'
    claim: '“Of the king''s seed” means of the royal line'
    key: ot-minute-1-kings-11
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-11'
    quote: 'A better translation for “of the king’s seed” might be “of the royal line.”'
  - where: 'note 11:14 “Adversaries the LORD raised”'
    claim: 'Hadad and Rezon may have taken their parts during Solomon''s reign; not tribes of Israel, possibly the rationale of verse 12 (his reading)'
    key: ot-minute-1-kings-11
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-11'
    quote: 'Hadad and Rezon, may have taken theirs during Solomon’s reign. Since those kingdoms were not tribes of Israel, that is possibly the rationale for the promise in verse 12 that the kingdom would be rent after Solomon’s death.'
  - where: 'note 11:28 “Jeroboam and the forced labor”'
    claim: '“Charge” is sēbel, burden, here of corvée labor'
    key: bdb
    url: 'https://biblehub.com/hebrew/5447.htm'
    quote: 'סֵ֫בֶל noun [masculine] load, burden; — … construct id., = burdensome labour (of corvée) 1 Kings 11:28.'
  - where: 'note 11:28 “Jeroboam and the forced labor”'
    claim: 'The Hebrew of 11:28 has sēbel'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'סֵ֖בֶל'
  - where: 'note 11:28 “Jeroboam and the forced labor”'
    claim: 'Millo''s meaning is unclear, a structure or earthwork in Jerusalem''s defense; the house of Joseph is Ephraim and Manasseh'
    key: ot-minute-1-kings-11
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-11'
    quote: '“Millo” is a transliteration of the Hebrew word, and its meaning is unclear. It is some kind of structure or earthwork that contributed to the defense of Jerusalem.'
  - where: 'note 11:28 “Jeroboam and the forced labor”'
    claim: 'Joseph''s two sons were Ephraim and Manasseh; Jeroboam over two tribes'
    key: ot-minute-1-kings-11
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-11'
    quote: 'Solomon gave Jeroboam charge over two tribes (Joseph’s two sons were Ephraim and Manasseh)'
  - where: 'note 11:28 “Jeroboam and the forced labor”'
    claim: 'One older reading: the text relates only the circumstances of the rebellion'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/11.htm'
    quote: 'All that is related of his rebellion against the king is the circumstances under which it took place.'
  - where: 'note 11:28 “Jeroboam and the forced labor”'
    claim: 'Rehoboam increased the people''s burdens, which prompted the revolt'
    key: scripture-helps-2-samuel-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/24-2-samuel-11-12-1-kings-3-6-9-11?lang=eng'
    quote: 'Rehoboam increased the people’s burdens, which prompted the ten northern tribes to rebel against him.'
  - where: 'note 11:30 “The torn garment”'
    claim: 'Tearing the garment is one of the symbolic acts performed as prophetic oracles'
    key: sc-knowhy-178
    url: 'https://scripturecentral.org/knowhy/why-did-nephi-prophesy-near-the-highway-which-led-to-the-chief-market'
    quote: 'Other similar symbolic or parabolic acts performed as prophetic oracles are found in Jeremiah 13:1–11 (hiding a waistcloth), Jeremiah 19:1–13 (smashing a bottle), 1 Kings 11:29–39 (tearing a garment into twelve pieces), 2 Kings 13:15–19 (shooting an arrow), and Isaiah 20:2–6 (walking naked).'
  - where: 'note 11:30 “The torn garment”'
    claim: 'One older reading: Ahijah''s conduct analogous to Samuel''s with Saul; no authority to rebel'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/11.htm'
    quote: 'nor was Ahijah''s announcement an inducement or authority to rebel. Ahijah''s conduct as perfectly analogous to that of Samuel in the case of Saul'
  - where: 'note 11:32 “Ten and one”'
    claim: 'The footnotes give the Septuagint''s “two tribes” at 11:32 and 36'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: '32a “one tribe”: Septuagint: two tribes.'
  - where: 'note 11:32 “Ten and one”'
    claim: 'The Septuagint reads two tribes'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_kings/11.htm'
    quote: '32Yet he shall have two tribes, for my servant David''s sake, and for the sake of Jerusalem'
  - where: 'note 11:32 “Ten and one”'
    claim: 'Counting Levi there were thirteen tribes; Judah''s kingdom included half of Benjamin, the Levites, strangers; more Levites came after Jeroboam''s idolatry'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'The kingdom of Judah would include half the small tribe of Benjamin, the Levites, and the strangers that were in Judah’s territory. At first, only part of Levi was with Judah, but after Jeroboam turned to idolatry, many more deserted to Judah.'
  - where: 'note 11:32 “Ten and one”'
    claim: 'Counting Levi, thirteen tribes'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'Because Ephraim and Manasseh, the two sons of Joseph, were two tribes, counting Levi there were thirteen tribes at this time instead of twelve.'
  - where: 'note 11:32 “Ten and one”'
    claim: 'More than one tribe remained with David''s dynasty; Benjamin small'
    key: ot-minute-1-kings-11
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-11'
    quote: 'Technically more than one tribe remained in David’s dynasty: Judah, Benjamin, and some of Levi. Benjamin may not have had a very large population at the time'

  - where: 'note 11:36 “A lamp for David”'
    claim: 'nîr, lamp, always figurative, that David''s family remain on the throne; cf. 15:4; 2 Kgs. 8:19'
    key: bdb
    url: 'https://biblehub.com/hebrew/5216.htm'
    quote: 'I. נִיר noun [masculine] lamp; — always figurative … i.e. that his family may remain on the throne; compare 1 Kings 15:4; 2 Kings 8:19'
  - where: 'note 11:36 “A lamp for David”'
    claim: 'The lamp of Israel figurative of prosperity embodied in David, 2 Sam. 21:17'
    key: bdb
    url: 'https://biblehub.com/hebrew/5216.htm'
    quote: 'figurative of prosperity יִשְׂרָאֵל ׳נ 2 Samuel 21:17 (embodied in David)'
  - where: 'note 11:36 “A lamp for David”'
    claim: 'The Hebrew of 11:36 has nîr'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'נִ֣יר'

  - where: 'note 11:38 “A sure house, on a condition”'
    claim: 'David''s promise was unconditional, Jeroboam''s conditional; the northern kingdom established on conditional covenants and prophetic pronouncement'
    key: halverson-fall-of-israel
    url: 'https://interpreterfoundation.org/journal/why-did-northern-israel-fall-to-the-assyrians-a-weberian-proposal'
    quote: 'the Northern Kingdom of Israel was established on conditional covenants and the charismatic double barrel of prophetic pronouncement (in the person of Ahijah) … David’s promise was unconditional; Jeroboam’s promise was conditional.'
  - where: 'note 11:38 “A sure house, on a condition”'
    claim: 'JST 11:38 adds “in the day that I blessed him”'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/83'
    quote: 'as David my servant did in the day that I blessed him; I will be with thee, and build thee a sure house as I built for David'
  - where: 'note 11:38 “A sure house, on a condition”'
    claim: 'Jeroboam did not keep the commandments, led into idolatry, his house destroyed; later kings measured against his standard'
    key: scripture-helps-2-samuel-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/24-2-samuel-11-12-1-kings-3-6-9-11?lang=eng'
    quote: 'Jeroboam did not keep the commandments and led his people into idolatry. He and all his house were eventually destroyed from the earth. In subsequent generations, the kings of Israel who did evil were often measured against the poor standard set by Jeroboam.'
  - where: 'note 11:38 “A sure house, on a condition”'
    claim: 'The JST footnote at 11:38'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: 'JST 1 Kgs. 11:38 … did in the day that I blessed him; I will be …'

  - where: 'note 11:4 “As the heart of David”'
    claim: 'The manuscript reading of 11:39'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/83'
    quote: 'And, for the transgression of David, and also for the People I have rent the kingdom, and for this I will afflict the'
  - where: 'note 11:4 “As the heart of David”'
    claim: 'The JST of 11:39 places the blame on both the king and the people'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'The JST adds, “And for the transgression of David, and also for the people, I have rent the kingdom, and for this I will afflict the seed of David.” This places the blame on both the king and the people.'

  - where: christ
    claim: 'Judah stayed under David''s line so the promise that the Messiah would come through David and Judah would be fulfilled'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'The tribe of Judah, however, was to continue under the reign of David’s line so that the promise that the Messiah would come through the lineage of David and from the tribe of Judah would be fulfilled (see Genesis 49:10).'
  - where: christ
    claim: 'Solomon in Matthew''s genealogy (Matt. 1:6)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/1?lang=eng'
    quote: 'David the king begat Solomon of her that had been the wife of Urias'
  - where: explore
    claim: 'Wirthlin reads Solomon and Jeroboam as the cycle prosperity, pride, sin'
    key: wirthlin-higher-ground-2005
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2005/10/journey-to-higher-ground?lang=eng'
    quote: 'Solomon and Jeroboam are examples of a great, tragic cycle so often illustrated in the Book of Mormon. When the people are righteous, the Lord prospers them. Prosperity often leads to pride, which leads to sin.'
  - where: christ
    claim: 'JST 11:33: Solomon repenteth not as did David, that I may forgive him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: 'JST 1 Kgs. 11:33 … and his heart is become as David his father; and he repenteth not as did David his father, that I may forgive him.'
  - where: 'note 11:28 “Jeroboam and the forced labor”'
    claim: '“Ephrathite” in 11:26 means Ephraimite'
    key: bdb
    url: 'https://biblehub.com/hebrew/673.htm'
    quote: '1 Ephraimite, compare אֶפְרָתָה 1 Judges 12:5; 1 Samuel 1:1 (of ancestor of Elkanah) 1 Kings 11:26 (of Jeroboam)'
  - where: section 4 plain
    claim: '“Ephrathite” in 11:26 rendered “Ephraimite”'
    key: bdb
    url: 'https://biblehub.com/hebrew/673.htm'
    quote: '1 Ephraimite, compare אֶפְרָתָה 1 Judges 12:5; 1 Samuel 1:1 (of ancestor of Elkanah) 1 Kings 11:26 (of Jeroboam)'
