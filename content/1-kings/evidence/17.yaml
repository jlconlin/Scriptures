chapter: 17
claims:
  - where: setting
    claim: 'Elijah appears without the usual formula announcing a prophet'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/17.htm'
    quote: 'Elijah the Tishbite is introduced without the formula "The word of the Lord came to ...," with which the appearance of the prophets is generally announced'
  - where: setting
    claim: 'Elijah''s story runs from 1 Kings 17 to 2 Kings 2; Israel had nearly forsaken Jehovah for Baal under Ahab and Jezebel'
    key: bd-elijah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elijah?lang=eng'
    quote: 'owing to the influence of Ahab and Jezebel, the people had almost entirely forsaken the worship of Jehovah and had become worshippers of the Phoenician god Baal (1 Kgs. 16:32; 18:19). An account of Elijah’s life is found in 1 Kgs. 17–22; 2 Kgs. 1–2'
  - where: setting
    claim: 'Baal was the storm god; his priests could not prevent Elijah''s drought'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: '“Baal was the Canaanite storm god, associated with lightning and rain.” … The priests of Baal were also powerless to prevent Elijah from causing a drought by sealing the heavens.'
  - where: setting
    claim: 'Ahab married Jezebel, daughter of the king of the Zidonians, and served Baal'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/16?lang=eng'
    quote: 'he took to wife Jezebel the daughter of Ethbaal king of the Zidonians, and went and served Baal, and worshipped him.'
  - where: thread
    claim: 'Elijah''s "at my word" is set against the prophets of Baal'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/17.htm'
    quote: 'In דברי לפי there is involved an emphatic antithesis to others, and more especially to the prophets of Baal.'
  - where: section 1 plain
    claim: '"Before whom I stand" means whom I serve'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/17.htm'
    quote: 'before whom I stand (i.e., whom I serve; see at 1 Kings 1:2)'
  - where: section 1 plain
    claim: '"Before Jordan" may be read "east of" the Jordan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/17?lang=eng'
    quote: '3b “before”: OR east of (also v. 5).'
  - where: 'note 17:1 “Elijah the Tishbite”'
    claim: '"Tishbite" is of uncertain meaning; Gilead is hill country east of Jordan; his parentage is unknown'
    key: bd-elijah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elijah?lang=eng'
    quote: 'Jehovah is my God. Called “the Tishbite,” but the meaning of this name is quite uncertain, no place being known from which it could be derived. He was “of the inhabitants of Gilead,” the wild and beautiful hill country east of Jordan.'
  - where: 'note 17:1 “Elijah the Tishbite”'
    claim: 'Nothing is known of his parentage'
    key: bd-elijah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elijah?lang=eng'
    quote: 'Nothing is known of his parentage.'
  - where: 'note 17:1 “Elijah the Tishbite”'
    claim: 'The word for "inhabitants" can mean sojourner and shares letters with "Tishbite"; two possible renderings'
    key: ot-minute-1-kings-17
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-17'
    quote: 'the Hebrew word translated as “the inhabitants of” could also be translated as “sojourner,” which is how it is used to describe Abraham in Genesis 23:4. The word has the same letters as “Tishbite,” opening two other ways to translate the phrase: “Elijah from Tishbe, who was one of the settlers in Gilead” or “Elijah the Tishbite of Tishbe in Gilead.”'
  - where: 'note 17:1 “Elijah the Tishbite”'
    claim: 'The text gives all we know of Elijah''s origins in verse 1'
    key: ot-minute-1-kings-17
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-17'
    quote: 'The information we are given about Elijah’s past and origins is contained entirely in verse 1'
  - where: 'note 17:1 “According to my word”'
    claim: 'Joseph Fielding Smith read verse 1 as showing the sealing power by which Elijah closed the heavens'
    key: ot-manual-5
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-5?lang=eng'
    quote: 'The reason I put emphasis upon this is to impress you with the sealing power by which Elijah was able to close the heavens, that there should be no rain or dew until he spoke.'
  - where: 'note 17:1 “According to my word”'
    claim: 'The power of Elijah is the sealing power, binding on earth and in heaven'
    key: bd-elijah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elijah?lang=eng'
    quote: 'As demonstrated by his miraculous deeds, the power of Elijah is the sealing power of the priesthood by which things bound or loosed on earth are bound or loosed in heaven.'
  - where: 'note 17:1 “According to my word”'
    claim: 'The Book of Mormon''s Nephi, given the sealing power, controlled the rain "according to my words"; Mormon apparently shaped Nephi''s story to parallel Elijah''s'
    key: sc-knowhy-348
    url: 'https://scripturecentral.org/knowhy/how-do-the-bible-and-book-of-mormon-help-us-understand-the-sealing-power'
    quote: 'Like Elijah, Nephi called upon the Lord to control the rain, “according to my words” (Helaman 11:4, 13).'
  - where: 'note 17:1 “According to my word”'
    claim: 'Mormon apparently shaped his abridgment of Nephi''s story to parallel Elijah''s'
    key: sc-knowhy-348
    url: 'https://scripturecentral.org/knowhy/how-do-the-bible-and-book-of-mormon-help-us-understand-the-sealing-power'
    quote: 'Furthermore, Mormon apparently shaped his abridgment of the story of Nephi to parallel the story of Elijah.'
  - where: 'note 17:1 “According to my word”'
    claim: 'Elijah''s oath applies the law''s threat of drought for idolatry; James ascribes it to prayer; "before whom I stand" = whom I serve'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/17.htm'
    quote: 'was a special application of the threats of the law in Deuteronomy 11:16-17; Deuteronomy 28:23-24, and Leviticus 26:19, to the idolatrous kingdom. … In James 5:17-18, this act of Elijah is ascribed to the power of his prayers'
  - where: 'note 17:1 “According to my word”'
    claim: 'Helaman 10:6–7: Nephi given power to smite with famine and to seal on earth and in heaven'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/hel/10?lang=eng'
    quote: 'Behold, I give unto you power, that whatsoever ye shall seal on earth shall be sealed in heaven'
  - where: 'note 17:4 “Fed by ravens”'
    claim: 'Some scholars read "ravens" as merchants or traders; others hold the translation; hiding makes traders unlikely; the tone is miraculous'
    key: ot-manual-5
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-5?lang=eng'
    quote: 'Some scholars insist that the word raven is a mis-translation and that merchants or traders is the correct rendering. Other scholars disagree. … The fact that Elijah was in hiding makes it unlikely that merchants or traders would come to him twice a day'
  - where: 'note 17:4 “Fed by ravens”'
    claim: 'Cherith was an obscure, isolated place where Elijah depended wholly on the Lord'
    key: ot-manual-5
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-5?lang=eng'
    quote: 'apparently it was an obscure and isolated place where Elijah could hide safely without being accidentally discovered by soldiers, shepherds or passersby. It was also a desolate place where no animal life existed, therefore Elijah was completely dependent upon the Lord for his sustenance.'
  - where: 'note 17:4 “Fed by ravens”'
    claim: 'Reading the ravens as people would undercut both the miracle and Elijah''s isolation'
    key: ot-minute-1-kings-17
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-17'
    quote: 'The Biblical text is describing a miracle and showing Elijah’s isolation in the process. Both would be undercut if these ravens were people.'
  - where: 'note 17:4 “Fed by ravens”'
    claim: 'Holland: the ravens'' meal was not a gourmet meal'
    key: holland-handful-meal-1996
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1996/04/a-handful-of-meal-and-a-little-oil?lang=eng'
    quote: 'Ravens did bring Elijah bread and meat to eat, but unless ravens carry more than I think they do, this was not a gourmet meal.'
  - where: 'note 17:9 “A widow in Jezebel''s country”'
    claim: 'Zarephath lay between Tyre and Sidon'
    key: bd-zarephath
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zarephath?lang=eng'
    quote: 'A city lying between Tyre and Sidon, where Elijah dwelt with a widow (1 Kgs. 17:9; Obad. 1:20; Luke 4:26).'
  - where: 'note 17:9 “A widow in Jezebel''s country”'
    claim: 'Zarephath was a Phoenician city where Baal was worshipped; the widow was a non-Israelite of great faith'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: 'She lived in Zarephath, a Phoenician city where the people worshipped Baal and other false gods. Although she was a non-Israelite, she exercised great faith in Jehovah and His prophet Elijah.'
  - where: 'note 17:9 “A widow in Jezebel''s country”'
    claim: 'Zarephath belonged to Sidon, Jezebel''s hometown'
    key: ot-minute-1-kings-17
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-17'
    quote: 'In Elijah’s day it belonged to Sidon, which was Jezebel’s hometown.'
  - where: 'note 17:9 “A widow in Jezebel''s country”'
    claim: 'Elijah was not sent until the widow and her son were at the point of death'
    key: robbins-tithing-2005
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2005/04/tithing-a-commandment-even-for-the-destitute?lang=eng'
    quote: 'It is interesting that Elijah is not told to go to Zarephath until the widow and her son are at the point of death. It is at this extreme moment—facing starvation—that her faith will be tested.'
  - where: 'note 17:9 “A widow in Jezebel''s country”'
    claim: 'The widow had been prepared by the Lord for Elijah''s request'
    key: holland-handful-meal-1996
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1996/04/a-handful-of-meal-and-a-little-oil?lang=eng'
    quote: 'Furthermore, the widow had been prepared by the Lord for this request.'
  - where: 'note 17:12 “A handful of meal and two sticks”'
    claim: 'The "cake" is a quickly baked flat bread'
    key: ot-minute-1-kings-17
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-17'
    quote: '“Cake” in King James English did not imply something sweet, and the Hebrew word used refers specifically to a flat bread made quickly in a fire'
  - where: 'note 17:12 “A handful of meal and two sticks”'
    claim: 'Two sticks show how small her fire needed to be; she was weak and anguished'
    key: holland-handful-meal-1996
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1996/04/a-handful-of-meal-and-a-little-oil?lang=eng'
    quote: 'In her hunger and fatigue and motherly anguish she cried out to the stranger … I am gathering two sticks [which tells us how small her fire needed to be]'
  - where: 'note 17:12 “A handful of meal and two sticks”'
    claim: 'A handful of meal was perhaps one serving'
    key: robbins-tithing-2005
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2005/04/tithing-a-commandment-even-for-the-destitute?lang=eng'
    quote: 'A “handful of meal” would be very little indeed, perhaps just enough for one serving'
  - where: 'note 17:13 “Make me thereof a little cake first”'
    claim: 'Holland: her obedience an expression of faith as great as any; she would at least have died in an act of pure charity'
    key: holland-handful-meal-1996
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1996/04/a-handful-of-meal-and-a-little-oil?lang=eng'
    quote: 'Then this understated expression of faith—as great, under these circumstances, as any I know in the scriptures. … at least she and her son would have died in an act of pure charity.'
  - where: 'note 17:18 “To call my sin to remembrance”'
    claim: 'The widow saw the death as punishment for her sin, drawn to God''s notice by the man of God''s presence'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/17.htm'
    quote: 'The pious woman discerned in this death a punishment from God for her sin, and supposed that it had been drawn towards her by the presence of the man of God'
  - where: 'note 17:18 “To call my sin to remembrance”'
    claim: 'The death was not punishment but for the manifestation of God''s works, as in John 9'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/17.htm'
    quote: 'the death of this widow''s son was not sent as a punishment for particular sins, but was intended as a medium for the manifestation of the works of God in her (John 9:3)'
  - where: 'note 17:18 “To call my sin to remembrance”'
    claim: 'Elijah''s question in verse 20 is no reproach of God; "also" refers to the drought''s other calamities'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/17.htm'
    quote: 'in which the word also refers to the other calamities occasioned by the drought, contain no reproach of God, but are expressive of the heartiest compassion for the suffering of his benefactress'
  - where: 'note 17:18 “To call my sin to remembrance”'
    claim: 'The widow''s cry was more a plea for help than a criticism'
    key: ot-manual-5
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-5?lang=eng'
    quote: 'The widow’s cry (see v. 18) was more a plea for help than a criticism. In essence she was saying, “I thought sheltering a prophet would bring blessings and protection; instead, tragedy has struck my home.”'
  - where: 'note 17:21 “He stretched himself upon the child”'
    claim: 'Keil: the stretching was to bring down God''s power, not to test for life or warm the body as Elisha did'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/17.htm'
    quote: 'not to ascertain whether there was still any life left in him, as Paul did in Acts 20:10, nor to warm the body of the child and set its blood in circulation, as Elisha did with a dead child (2 Kings 4:34), … but to bring down the vivifying power of God upon the dead body, and thereby support his own word and prayer.'
  - where: 'note 17:21 “He stretched himself upon the child”'
    claim: 'The footnotes set 2 Kgs. 4:34 and Acts 20:10 beside verse 21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/17?lang=eng'
    quote: '21a “stretched”: 2 Kgs. 4:34; Acts 20:10. TG Administrations to the Sick.'
  - where: 'note 17:22 “The soul came into him again”'
    claim: 'The nephesh departs at death and returns with life; BDB cites 1 Kgs 17:21–22'
    key: bdb
    url: 'https://biblehub.com/hebrew/5315.htm'
    quote: '׳נ departs at death and returns with life: … Genesis 35:18 (E) and it came to pass when her soul was going forth (for she died); … compare 1 Kings 17:21,22'
  - where: 'note 17:22 “The soul came into him again”'
    claim: 'Verses 21–22 use nephesh, "soul"'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'נֶֽפֶשׁ'
  - where: 'note 17:22 “The soul came into him again”'
    claim: 'The rabbis said Elijah raised the son because God had given him the keys of resurrection'
    key: sc-knowhy-348
    url: 'https://scripturecentral.org/knowhy/how-do-the-bible-and-book-of-mormon-help-us-understand-the-sealing-power'
    quote: 'He was then able to raise the widow’s son (1 Kings 17:23), the Rabbis suggested, because God had given him the keys to the resurrection.'
  - where: 'note 17:22 “The soul came into him again”'
    claim: 'Elijah used priesthood power to restore the dead to life'
    key: read-elijah-elisha
    url: 'https://scripturecentral.org/archive/periodicals/magazine-article/elijah-and-elisha-foreshadowing-latter-day-work'
    quote: 'Elijah used his priesthood power to restore the dead to life. (See 1 Kgs. 17:17–24.)'
  - where: 'note 17:24 “Now by this I know”'
    claim: 'Her testimony came at the raising of her son, not at the food'
    key: ot-minute-1-kings-17
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-17'
    quote: 'It is interesting that the widow’s testimony of Elijah’s connection to God didn’t come when Elijah provided her with food through the drought, especially considering she was resigned to death when Elijah first approached her in verse 12. Rather, her testimony came at this point when her son was healed.'
  - where: christ
    claim: 'The Savior used the widow''s example to condemn His own people''s unbelief'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: 'During His mortal ministry, the Savior used the widow’s example to condemn His own people for their unbelief in Him.'
  - where: christ
    claim: 'Elijah as a type of Christ: multiplied food, raised the dead'
    key: parry-elijah-symbol
    url: 'https://scripturecentral.org/archive/books/book-chapter/elijah-symbol-jesus-christ'
    quote: 'Miraculously multiplied food (1 Kgs. 17:14–16)'
  - where: christ
    claim: 'Parry sets Christ''s multiplying of food beside Elijah''s'
    key: parry-elijah-symbol
    url: 'https://scripturecentral.org/archive/books/book-chapter/elijah-symbol-jesus-christ'
    quote: 'Miraculously multiplied food (Matt. 14:17; 15:34; Mark 6:38; 8:7; Luke 9:13–17; John 6:9)'
  - where: christ
    claim: 'Parry lists the raising of the dead among the parallels'
    key: parry-elijah-symbol
    url: 'https://scripturecentral.org/archive/books/book-chapter/elijah-symbol-jesus-christ'
    quote: 'Raised the dead (1 Kgs. 17:17–23)'
  - where: christ
    claim: 'The never-failing meal and oil witness that Christ brings never-ceasing nourishment to Israel'
    key: read-elijah-elisha
    url: 'https://scripturecentral.org/archive/periodicals/magazine-article/elijah-and-elisha-foreshadowing-latter-day-work'
    quote: 'both miracles bear prophetic witness that Christ and his servants will bring never-ceasing nourishment to “widowed” Israel.'
  - where: christ
    claim: 'Like miracles stand as a witness (2 Cor. 13:1)'
    key: read-elijah-elisha
    url: 'https://scripturecentral.org/archive/periodicals/magazine-article/elijah-and-elisha-foreshadowing-latter-day-work'
    quote: 'Similar miracles with similar elements usually suggest that a witness is being made. (See 2 Cor. 13:1.)'
  - where: christ
    claim: 'The widow symbolizes Israel, spiritually widowed by straying from the truth'
    key: read-elijah-elisha
    url: 'https://scripturecentral.org/archive/periodicals/magazine-article/elijah-and-elisha-foreshadowing-latter-day-work'
    quote: 'the terms widow and fatherless are often used to symbolize Israel who, by straying from the truth, has become spiritually widowed and fatherless—separated from its true Bridegroom and Father.'
  - where: christ
    claim: 'Elijah multiplied nourishment so that it would not cease'
    key: read-elijah-elisha
    url: 'https://scripturecentral.org/archive/periodicals/magazine-article/elijah-and-elisha-foreshadowing-latter-day-work'
    quote: 'Elijah had the power to multiply nourishment so that it would not cease until the Lord himself sent rain from heaven.'
  - where: christ
    claim: 'Keil: in this miracle Elijah was a forerunner of Him who raises all the dead'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/17.htm'
    quote: 'Through this miracle, in which Elijah showed himself as the forerunner of Him who raiseth all the dead to life'
  - where: christ
    claim: 'Blessings come after the trial of faith'
    key: robbins-tithing-2005
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2005/04/tithing-a-commandment-even-for-the-destitute?lang=eng'
    quote: 'Elijah understood the doctrine that blessings come after the trial of our faith (see Ether 12:6; D&C 132:5).'
  - where: explore
    claim: 'Holland compares the widow of Zarephath with the widow who cast in two mites'
    key: holland-handful-meal-1996
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1996/04/a-handful-of-meal-and-a-little-oil?lang=eng'
    quote: 'This woman is like another widow whom Christ admired so much—she who cast her farthing, her two mites'
  - where: setting
    claim: 'Chapters 17–19: the drought, Carmel and its ending, the flight to Horeb'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: 'Elijah prevailed in the contest, and the drought ended. When Jezebel tried to kill Elijah, he fled to Mount Horeb, where he had a powerful spiritual experience with the Lord.'
  - where: thread
    claim: 'Zarephath was a Phoenician town where Baal was worshipped'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: 'She lived in Zarephath, a Phoenician city where the people worshipped Baal and other false gods.'
  - where: section 1 plain
    claim: '"Of the inhabitants of Gilead" may be read "one of the settlers in Gilead"'
    key: ot-minute-1-kings-17
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-17'
    quote: '“Elijah from Tishbe, who was one of the settlers in Gilead”'
  - where: section 3 plain
    claim: '"What have I to do with thee?" may be rendered "What do you have against me?"'
    key: ot-minute-1-kings-17
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-17'
    quote: '“What have I to do with thee?” or “What do you have against me?”'
  - where: section 3 plain
    claim: 'To call her sin to remembrance means to bring it to remembrance with God'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/17.htm'
    quote: 'Hast thou come to me to bring my sin to remembrance (with God), and to kill my son?'
  - where: 'note 17:1 “According to my word”'
    claim: 'Joseph Fielding Smith quoted the verse a second time for emphasis'
    key: ot-manual-5
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-5?lang=eng'
    quote: 'There is something very significant in that edict. I want you to get it. Follow me again closely: ‘As the Lord God of Israel liveth, before whom I stand'
  - where: 'note 17:1 “According to my word”'
    claim: 'Keil: prophets had power to work only through faith and prayer'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/17.htm'
    quote: 'inasmuch as the prophets received their power to work solely through faith and intercourse with God in prayer'
  - where: 'note 17:1 “Elijah the Tishbite”'
    claim: 'It is possible Elijah was a convert from outside Israel'
    key: ot-minute-1-kings-17
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-17'
    quote: 'It is also possible Elijah was not an Israelite but a convert from somewhere outside of Israel.'
  - where: 'note 17:22 “The soul came into him again”'
    claim: 'Jewish tradition: only God held the keys of birth, rain and resurrection'
    key: sc-knowhy-348
    url: 'https://scripturecentral.org/knowhy/how-do-the-bible-and-book-of-mormon-help-us-understand-the-sealing-power'
    quote: 'According to Jewish tradition, only God Himself held all the keys, including the keys of birth, rain, and resurrection.'
  - where: christ
    claim: 'Parry sets Christ''s raising of the dead beside Elijah''s'
    key: parry-elijah-symbol
    url: 'https://scripturecentral.org/archive/books/book-chapter/elijah-symbol-jesus-christ'
    quote: 'Raised the dead (Matt. 9:18–25)'
  - where: christ
