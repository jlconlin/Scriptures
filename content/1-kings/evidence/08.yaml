chapter: 8
claims:
  - where: 'setting'
    claim: 'The chapter heading gives the order of the day: the ark placed, the glory, the prayer, the sacrifices and fourteen days of worship'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'The ark, containing the two tablets of stone, is placed in the Holy of Holies—The glory of the Lord fills the temple—Solomon offers the dedicatory prayer—He asks for temporal and spiritual blessings upon repentant and prayerful Israel—The people sacrifice and worship for fourteen days.'
  - where: 'setting'
    claim: 'Chronicles retells the dedication, with fire from heaven on the sacrifices'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/7?lang=eng'
    quote: 'Fire comes down from heaven and consumes the sacrifices and burnt off…'
  - where: 'setting'
    claim: 'The Kirtland Temple dedicatory prayer follows Solomon’s; later dedicatory prayers follow the pattern'
    key: sc-knowhy-814
    url: 'https://scripturecentral.org/knowhy/how-did-the-kirtland-temple-dedication-follow-ancient-patterns'
    quote: 'Thus, future temple dedications likewise followed the pattern established by Solomon’s temple and, later, the Kirtland Temple.'
  - where: 'thread'
    claim: 'The Student Manual: the prayer shows Solomon’s heart at the time; he and his people later departed from that state'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'Solomon’s dedicatory prayer gives a good insight into the state of Solomon’s heart at the time. … As the record of 1 Kings unfolds, however, it becomes evident how far Solomon and his people later departed from the spiritual state they were in on the day of dedication.'
  - where: 'thread'
    claim: 'The text: the cloud, the settled place, the question of verse 27, the refrain hear in heaven, no man that sinneth not'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'But will God indeed dwell on the earth? behold, the heaven and heaven of heavens cannot contain thee; how much less this house that I have builded?'

  - where: 'note 8:2 “The feast of the seventh month”'
    claim: 'The Feast of Tabernacles was kept on the 15th–21st of the seventh month, with an eighth day added'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'The Feast of Tabernacles (Lev. 23:34) or of Ingathering (Ex. 23:16), called by later Jews the Feast (John 7:37) and reckoned by them to be the greatest and most joyful of all, was celebrated on the 15th to 21st days of the seventh month. To the seven days was added an eighth'
  - where: 'note 8:2 “The feast of the seventh month”'
    claim: 'The law required all the males to appear at the place the Lord chose at three feasts, Tabernacles among them'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'The law commanded that three times a year all the males of the covenant people were to appear before the Lord in the place that He should choose; that is, in the Feast of Unleavened Bread, in the Feast of Weeks, and in the Feast of Tabernacles'
  - where: 'note 8:2 “The feast of the seventh month”'
    claim: 'Ethanim is later Tishri; the feast is Sukkot'
    key: ot-minute-1-kings-8
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-8'
    quote: 'After the Babylonian exile the month Ethanim’s name changed to Tishrei. The month falls in autumn, and the feast referred to is Sukkot'
  - where: 'note 8:2 “The feast of the seventh month”'
    claim: 'The feast is a harvest festival that also commemorates the Exodus, kept in temporary structures'
    key: ot-minute-1-kings-8
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-8'
    quote: 'it is a harvest festival that also commemorates the Exodus. On the holiday Jews build a temporary structure that they sleep and eat in for the week.'
  - where: 'note 8:2 “The feast of the seventh month”'
    claim: 'Tishri also holds the Day of Atonement'
    key: ot-minute-1-kings-8
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-8'
    quote: 'Tishrei also contains Rosh Hashanah (New Year) and Yom Kippur, the holiest day of the year.'
  - where: 'note 8:2 “The feast of the seventh month”'
    claim: 'Chronicles counts seven days for the dedication of the altar and seven for the feast, and sends the people home on the 23rd'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/7?lang=eng'
    quote: 'And in the eighth day they made a solemn assembly: for they kept the dedication of the altar seven days, and the feast seven days.'
  - where: 'note 8:2 “The feast of the seventh month”'
    claim: 'King Benjamin’s people gathered by families round the temple and stayed in tents, like the Feast of Tabernacles; tents are named at Solomon’s dedication'
    key: sc-knowhy-394
    url: 'https://scripturecentral.org/knowhy/did-the-nephites-have-a-holiday-season-like-we-do-today'
    quote: 'Finally, Benjamin’s speech is similar to the Feast of Tabernacles (Sukkot). … They also stayed in tents during this meeting (Mosiah 2:6). Welch and Szink have noted, “Tents were specifically mentioned in connection with the celebration of Solomon’s dedication of the temple … (1 Kings 8:65–66).'

  - where: 'note 8:2 “The feast of the seventh month”'
    claim: 'The feast at Solomon’s dedication was held in the seventh month and is generally thought of as Tabernacles'
    key: sc-knowhy-394
    url: 'https://scripturecentral.org/knowhy/did-the-nephites-have-a-holiday-season-like-we-do-today'
    quote: 'This feast, in which tents were used, was held in the seventh month (see 1 Kings 8:2) and has generally been thought of as a Feast of Tabernacles.'

  - where: 'note 8:11 “The cloud of glory”'
    claim: 'The cloud was like the one that went with the tabernacle in the Exodus'
    key: ot-minute-1-kings-8
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-8'
    quote: 'A cloud descended upon the temple—similar to the cloud that followed the tabernacle during the Exodus.'

  - where: 'note 8:8 “Written while the temple stood”'
    claim: '“Unto this day” is the day of writing, which must have been before the temple was destroyed'
    key: ot-minute-1-kings-8
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-8'
    quote: '“Until this day” refers to when this text was written, which must not have been during or shortly after the dedication, otherwise there wouldn’t be any use in stating the staves were still there. However, the text had to have been written before the temple was d'
  - where: 'note 8:8 “Written while the temple stood”'
    claim: 'Kings narrates the history to the final captivity of Judah'
    key: bd-kings-books-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/kings-books-of?lang=eng'
    quote: 'The books of Kings narrate the history from the rebellion of Adonijah to the final captivity of Judah'
  - where: 'note 8:8 “Written while the temple stood”'
    claim: 'Kings was compiled by an unknown writer from a variety of written documents'
    key: bd-kings-books-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/kings-books-of?lang=eng'
    quote: 'The books were compiled by some unknown writer from a variety of written documents, including the state chronicles.'

  - where: 'note 8:9 “Only the two tables of stone”'
    claim: 'The Bible Dictionary sets 1 Kgs. 8:9 beside Heb. 9:4; the manna and rod were to be kept before the Testimony'
    key: bd-ark-of-the-covenant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ark-of-the-covenant?lang=eng'
    quote: 'According to 1 Kgs. 8:9 it contained only the Tables of the Law, but in Heb. 9:4 it is said to have contained the “pot of manna” and “Aaron’s rod that budded,” which had been ordered to be kept “before the Testimony” (Ex. 16:32–34; 25:16; 40:20; Num. 17:10).'
  - where: 'note 8:9 “Only the two tables of stone”'
    claim: 'How the other objects went missing is not explained; Horeb is Sinai'
    key: ot-minute-1-kings-8
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-8'
    quote: 'How those went missing is not explained. Horeb is another name for Mount Sinai.'
  - where: 'note 8:9 “Only the two tables of stone”'
    claim: 'The ark is the place “wherein is the covenant of the LORD”; footnote ties 8:21 to Deut. 31:26 and 8:9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'And I have set there a place for the ark, wherein is the covenant of the LORD, which he made with our fathers, when he brought them out of the land of Egypt.'

  - where: 'note 8:11 “The cloud of glory”'
    claim: 'Shechinah: later Jews’ word for the cloud of glory marking the Lord’s presence, citing 1 Kgs. 8:10; set beside the First Vision'
    key: bd-shechinah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shechinah?lang=eng'
    quote: 'The Presence. A word used by the later Jews (and borrowed from them by the Christians) to denote the cloud of brightness and glory that marked the presence of the Lord, as spoken of in Ex. 3:1–6; 24:16; 1 Kgs. 8:10'
  - where: 'note 8:11 “The cloud of glory”'
    claim: 'The Bible Dictionary sets Joseph Smith’s description of the First Vision beside it'
    key: bd-shechinah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shechinah?lang=eng'
    quote: 'The Prophet Joseph Smith described this phenomenon in connection with his First Vision, as a “light … above the brightness of the sun,”'
  - where: 'note 8:11 “The cloud of glory”'
    claim: 'The cloud indicated God’s presence; a like glory attended the Kirtland dedication; both signs of the Lord’s acceptance'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'a cloud of glory filled the house of God, indicating the very presence of God. … The special events attending the dedication of both temples are signs of the Lord’s divine acceptance of the houses built in His name to His honor.'
  - where: 'note 8:11 “The cloud of glory”'
    claim: 'Scripture Helps sets 1 Kgs. 8:1–11 beside the Kirtland dedication: a bright cloud and pillar of fire over the temple'
    key: scripture-helps-2-samuel-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/24-2-samuel-11-12-1-kings-3-6-9-11?lang=eng'
    quote: 'See 1 Kings 8:1–11. A similar manifestation happened with the dedication of the Kirtland Temple on March 27, 1836. … Outside, Saints saw a bright cloud and a pillar of fire rest over the temple'
  - where: 'note 8:11 “The cloud of glory”'
    claim: 'The priests could not stand to minister because of the cloud'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'So that the priests could not stand to minister because of the cloud: for the glory of the LORD had filled the house of the LORD.'

  - where: 'note 8:12 “Thick darkness”'
    claim: 'ʿărāpel: cloud, heavy cloud, in which God dwells (Ex. 20:21; 1 Kgs. 8:12)'
    key: bdb
    url: 'https://biblehub.com/hebrew/6205.htm'
    quote: 'עֲרָפֶל noun masculine cloud, heavy cloud … ׳ע in which God dwells Exodus 20:18 (Gi; van d. H. Exodus 20:21), 1 Kings 8:12 2Chronicles 6:1'
  - where: 'note 8:12 “Thick darkness”'
    claim: 'The word in the verse is ʿărāpel'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'בָּ/עֲרָפֶֽל'
  - where: 'note 8:12 “Thick darkness”'
    claim: 'Solomon seems to quote a word of the Lord’s, perhaps Ex. 20:21; the Septuagint has a longer passage'
    key: ot-minute-1-kings-8
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-8'
    quote: 'Solomon seems to have been quoting some statement of the Lord’s about dwelling in “thick darkness,” perhaps relating to the phrase appearing in Exodus 20:21. The Septuagint has a slightly longer passage here'
  - where: 'note 8:12 “Thick darkness”'
    claim: 'The Septuagint places the saying after verse 53, with the sun, and “the book of the song”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_kings/8.htm'
    quote: '(8:53A) Then spoke Solomon concerning the house, when he had finished building it - He manifested the sun in the heaven: the Lord said he would dwell in darkness: build thou my house, a beautiful house for thyself to dwell in anew. Behold, is not this written in the book of the song?'

  - where: 'note 8:22 “Hands spread toward heaven”'
    claim: 'Prayer with uplifted hands is recorded most often in connection with the first temple; Ps. 63:4'
    key: sc-knowhy-638
    url: 'https://scripturecentral.org/knowhy/why-did-ancient-israelites-lift-their-hands-in-praise'
    quote: 'Accounts of praying with uplifted hands are recorded multiple times throughout the scriptures, most often in connection to the first temple in Jerusalem.'
  - where: 'note 8:22 “Hands spread toward heaven”'
    claim: 'Solomon stood at the start and knelt at the end; “stood” may mean only “before”'
    key: ot-minute-1-kings-8
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-8'
    quote: 'verse 22 indicates that Solomon stood before the altar, but when the prayer ends in verse 54, Solomon was kneeling before the altar. It’s possible that the phrase from verse 22 means only that Solomon was before the altar'
  - where: 'note 8:22 “Hands spread toward heaven”'
    claim: 'Madsen: the first and only time a king of Israel is allowed this priestly function; Uzziah punished'
    key: madsen-solomons-temple
    url: 'https://rsc.byu.edu/eye-faith/solomons-temple-compared-salt-lake-temple'
    quote: 'Here we see the first and only time that a king of Israel is allowed to perform this priestly function. (King Uzziah attempted to act in the priesthood, but was punished with leprosy as described in 2 Chronicles 26:18–19.)'
  - where: 'note 8:22 “Hands spread toward heaven”'
    claim: 'Joseph Smith stood and raised his arms to offer the Kirtland dedicatory prayer'
    key: sc-knowhy-814
    url: 'https://scripturecentral.org/knowhy/how-did-the-kirtland-temple-dedication-follow-ancient-patterns'
    quote: 'Similarly, in Kirtland Joseph Smith “stood, raised his arms, and with tears running down his cheeks, offered the prayer of dedication.”'

  - where: 'note 8:23 “The prayer behind D&C 109”'
    claim: 'D&C 109 was given by revelation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/109?lang=eng'
    quote: 'Prayer offered at the dedication of the temple at Kirtland, Ohio, March 27, 1836. The prayer had been given to the Prophet and other Church leaders by revelation as they worked late the previous night to prepare it.'
  - where: 'note 8:23 “The prayer behind D&C 109”'
    claim: 'Both prayers begin by acknowledging the God who keeps covenant and shows mercy (D&C 109:1; 1 Kgs. 8:23)'
    key: sc-knowhy-814
    url: 'https://scripturecentral.org/knowhy/how-did-the-kirtland-temple-dedication-follow-ancient-patterns'
    quote: 'Both prayers begin by recognizing that the “Lord God of Israel . . . keepest covenant and showest mercy unto thy servants who walk uprightly before thee, with all their hearts” (Doctrine and Covenants 109:1; compare 1 Kings 8:23).'
  - where: 'note 8:23 “The prayer behind D&C 109”'
    claim: 'Both pray for protection from enemies (D&C 109:22–33; 1 Kgs. 8:44–45)'
    key: sc-knowhy-814
    url: 'https://scripturecentral.org/knowhy/how-did-the-kirtland-temple-dedication-follow-ancient-patterns'
    quote: 'Both prayers are also focused on protection from enemies.'
  - where: 'note 8:23 “The prayer behind D&C 109”'
    claim: 'Both see the temple as a place where scattered Israel could be gathered (8:46–53; D&C 109:54–67)'
    key: sc-knowhy-814
    url: 'https://scripturecentral.org/knowhy/how-did-the-kirtland-temple-dedication-follow-ancient-patterns'
    quote: 'Additionally, both prayers also recognized that the temple was a place where Israel could be gathered.'
  - where: 'note 8:23 “The prayer behind D&C 109”'
    claim: 'Both were built to perfect the Lord’s people and prepare them for His coming (8:58, 61; D&C 109:71–80)'
    key: sc-knowhy-814
    url: 'https://scripturecentral.org/knowhy/how-did-the-kirtland-temple-dedication-follow-ancient-patterns'
    quote: 'Both temples were also built to perfect the Lord’s people and prepare them for His coming.'
  - where: 'note 8:23 “The prayer behind D&C 109”'
    claim: 'President Nelson: the prayer provides patterns used for temples today'
    key: sc-knowhy-814
    url: 'https://scripturecentral.org/knowhy/how-did-the-kirtland-temple-dedication-follow-ancient-patterns'
    quote: 'As President Russell M. Nelson explained, the similarities between these two dedicatory prayers are not by coincidence: “[the temple of Solomon’s] dedicatory prayer [provides] patterns that are employed for temples today.”'

  - where: 'note 8:27 “A house that cannot contain Him”'
    claim: 'Acts 7:48 and 17:24 argue not against the temple but against God confined to a structure; Solomon says similarly'
    key: eom-temples
    url: 'https://eom.byu.edu/index.php/Temples'
    quote: 'Neither Stephen''s nor Paul''s statements that "the most High dwelleth not in temples made with hands" (Acts 7:48;17:24; cf. Isa. 66:1-2) imply a rejection of the temple, but rather an argument against the notion that God can be confined to a structure. Solomon, at the dedication of the temple in Jerusalem, said similarly'
  - where: 'note 8:27 “A house that cannot contain Him”'
    claim: 'The refrain: hear thou in heaven thy dwelling place'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'And hearken thou to the supplication of thy servant, and of thy people Israel, when they shall pray toward this place: and hear thou in heaven thy dwelling place: and when thou hearest, forgive.'

  - where: 'note 8:29 “Praying toward the house”'
    claim: 'Prayer is a key purpose of the temple; Solomon specified praying toward it'
    key: ot-minute-1-kings-8
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-8'
    quote: 'Prayer is obviously one of the key purposes of the temple both anciently and in modern times. Solomon specified that Israelites should pray toward the temple'
  - where: 'note 8:29 “Praying toward the house”'
    claim: 'Wilford Woodruff’s 1893 Salt Lake Temple prayer echoed Solomon, for those who cannot enter and turn toward the house'
    key: madsen-solomons-temple
    url: 'https://rsc.byu.edu/eye-faith/solomons-temple-compared-salt-lake-temple'
    quote: 'Heavenly Father, when Thy people shall not have the opportunity of entering this holy house to offer their supplications unto Thee, and they are oppressed and in trouble, surrounded by difficulties or assailed by temptation and shall turn their faces towards this Thy holy house'
  - where: 'note 8:29 “Praying toward the house”'
    claim: 'Madsen: both dedications asked priority for prayers of the distressed who face the temple, wherever they were'
    key: madsen-solomons-temple
    url: 'https://rsc.byu.edu/eye-faith/solomons-temple-compared-salt-lake-temple'
    quote: 'Thus both ancient and modern dedications pled with the Lord to give priority to prayers when supplicants were in distress and chose to face the temple. They asked that he would remember his promises, no matter where they were.'
  - where: 'note 8:29 “Praying toward the house”'
    claim: 'The footnote at “place” points to Deut. 12:5, the place the LORD would choose'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'That thine eyes may be open toward this house night and day, even toward the place of which thou hast said, My name shall be there'

  - where: 'note 8:35 “When heaven is shut up”'
    claim: 'The covenant names a shut heaven as the consequence of serving other gods (Deut. 11:16–17)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/11?lang=eng'
    quote: 'he shut up the heaven, that there be no rain'
  - where: 'note 8:35 “When heaven is shut up”'
    claim: 'The Student Manual: if the people repent, looking to the house of the Lord in prayer, the weather can be tempered'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'First Kings 8:35–36 indicates that if the people repent of their sins, looking to the house of the Lord in prayer and supplication, the weather can be tempered and made to operate in behalf of the righteous.'
  - where: 'note 8:35 “When heaven is shut up”'
    claim: 'President Kimball, quoted in the manual: the Lord uses the weather to discipline His people'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: '“The Lord uses the weather sometimes to discipline his people for the violation of his laws.'
  - where: 'note 8:35 “When heaven is shut up”'
    claim: 'Combs: this part of the prayer foreshadows Elijah’s drought; the people confess the name at Carmel'
    key: ot-minute-1-kings-8
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-8'
    quote: 'This part of the prayer prefigures or foreshadows the drought brought on at the time of Elijah (see 1 Kings 18). After Elijah’s triumph over the priests of Baal, all the people … said, “Yahweh he is the God, Yahweh he is the God” … literally confessing the name of the Lord.'
  - where: 'note 8:35 “When heaven is shut up”'
    claim: 'Nephi, as chief priest, would have associated temple priesthood power with rain, famine and enemies (1 Kgs. 8:33–40)'
    key: sc-knowhy-182
    url: 'https://scripturecentral.org/knowhy/how-did-nephi-use-the-power-to-seal-on-earth-and-in-heaven'
    quote: 'As the Nephite chief priest, Nephi likely also would have readily associated priesthood powers in the temple with the blessings of rain upon the land, averting famine, and withstanding enemies (1 Kings 8:33–40; Leviticus 26:4–7).'
  - where: 'note 8:35 “When heaven is shut up”'
    claim: 'Nephi sealed the heavens as Elijah did'
    key: sc-knowhy-182
    url: 'https://scripturecentral.org/knowhy/how-did-nephi-use-the-power-to-seal-on-earth-and-in-heaven'
    quote: 'This may indicate that Nephi had used his recently-acquired power to “seal” the heavens, just like Elijah.'

  - where: 'note 8:41 “The stranger from a far country”'
    claim: 'Even non-Israelites can come to the temple to pray and expect to be heard'
    key: ot-minute-1-kings-8
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-8'
    quote: 'Even non-Israelites can come to the temple to pray and expect God to hear their prayers.'
  - where: 'note 8:41 “The stranger from a far country”'
    claim: 'Solomon asks that the foreigner from a far country be heard'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'Moreover concerning a stranger, that is not of thy people Israel, but cometh out of a far country for thy name’s sake'

  - where: 'note 8:47 “Bringing the heart back”'
    claim: 'hēšîb ʾel-lēb: bring back to mind, take into consideration; BDB cites 1 Kgs. 8:47'
    key: bdb
    url: 'https://biblehub.com/hebrew/7725.htm'
    quote: '8 אֶללֵֿבָב ׳הֵשׁ bring back to mind, take into consideration, with accusative Lamentations 3:21, followed by clause with כִּי Deuteronomy 4:39 (compare Dr), object omitted Deuteronomy 30:1; 1 Kings 8:47'
  - where: 'note 8:47 “Bringing the heart back”'
    claim: 'The verse has hēšîbû ʾel-libbām, nišbû (carried captive), and šābû (repent, return), with šōbêhem (their captors)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'וְ/הֵשִׁ֨יבוּ֙ … נִשְׁבּוּ … וְ/שָׁ֣בוּ'
  - where: 'note 8:47 “Bringing the heart back”'
    claim: 'Combs: these verses seem to prefigure Babylon; captive (shabah) mirrors repent (shub)'
    key: ot-minute-1-kings-8
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-8'
    quote: 'As verses 35–36 prefigure the drought of Elijah, these verses seem to prefigure the captivity of Babylon. The word for captive, shabah, mirrors the word for repent, shub.'

  - where: 'note 8:61 “A heart whole with the LORD”'
    claim: 'šālēm with heart: a mind at peace with the LORD, keeping covenant relation, hence complete, perfect; 8:61; 11:4; 15:3, 14'
    key: bdb
    url: 'https://biblehub.com/hebrew/8003.htm'
