  - where: 'note 8:63 “142,000 animals”'
    claim: 'Chronicles gives the same figures'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/7?lang=eng'
    quote: 'And king Solomon offered a sacrifice of twenty and two thousand oxen, and an hundred and twenty thousand sheep: so the king and all the people dedicated the house of God.'
  - where: 'note 8:63 “142,000 animals”'
    claim: 'Some Old Testament numbers seem too large; numbers are especially liable to error in copying'
    key: ot-manual-large-numbers
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/enrichment-section-e-the-problem-of-large-numbers-in-the-old-testament?lang=eng'
    quote: 'A recurring question in the study of the Old Testament has to do with the accuracy of the numbers used in the text. Some of these numbers seem too large in light of known facts. … Also, numbers were particularly susceptible to errors in translating.'
  - where: 'note 8:63 “142,000 animals”'
    claim: 'In Hebrew a single letter can turn three into thirty; copying numerals is hard to check from context'
    key: ot-manual-large-numbers
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/enrichment-section-e-the-problem-of-large-numbers-in-the-old-testament?lang=eng'
    quote: 'so in Hebrew, especially in the older style of writing, the addition of a single letter would make ‘three’ into ‘thirty,’ etc. etc. And, again, in copying numerals the scribe is not kept right by the context as he is with other words.'
  - where: 'note 8:63 “142,000 animals”'
    claim: 'Keil: the offerings were peace offerings by the king and all Israel, not for the king alone'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/8.htm'
    quote: 'The thank-offering (שׁלמים זבח) consisted, in accordance with the magnitude of the manifestation of divine grace, of 22,000 oxen and 120,000 sheep.'
  - where: 'note 8:63 “142,000 animals”'
    claim: 'Keil: any Israelite could slaughter; only the blood and the altar portions were the priests’'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/8.htm'
    quote: 'There is nothing in the account about their being "for the king alone." … Moreover it is very evident from the law in Leviticus 1 and 3 that at the offering of sacrifice the slaughtering, flaying, and preparation of the sacrificial animals were performed by any Israelite'
  - where: 'note 8:63 “142,000 animals”'
    claim: 'Keil: only the sprinkling of blood and burning on the altar were the priests’; Josephus’ count of 250,000 paschal lambs under Nero'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/8.htm'
    quote: 'the burning of the sacrificial portions upon the altar which were the exclusive province of the priests. … in the reign of the emperor Nero the procurator Cestius directed the priests to count the number of the paschal lambs, and that they counted 250,000'

