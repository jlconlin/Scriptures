chapter: 18
claims:
  - where: setting
    claim: 'One older reading counts the third year from Elijah''s stay at Zarephath, since Jesus and James give three years and six months'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/18.htm'
    quote: 'The time given, "the third year," is not to be reckoned, as the Rabbins, Clericus, Thenius, and others assume, from the commencement of the drought, but from the event last mentioned, namely, the sojourn of Elijah at Zarephath.'
  - where: setting
    claim: 'Under Ahab and Jezebel the people had almost wholly left Jehovah for the Phoenician Baal'
    key: bd-elijah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elijah?lang=eng'
    quote: 'owing to the influence of Ahab and Jezebel, the people had almost entirely forsaken the worship of Jehovah and had become worshippers of the Phoenician god Baal (1 Kgs. 16:32; 18:19)'
  - where: setting
    claim: 'Baal was the storm god; the contest and the storm that ended the drought showed Jehovah''s power over the elements'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: '“Baal was the Canaanite storm god, associated with lightning and rain.” … To further demonstrate Jehovah’s power over the elements, Elijah then helped bring about a storm that ended the drought.'
  - where: setting
    claim: 'Chapter 19 follows from the fire at Carmel: God who revealed himself dramatically in 18:38 speaks in a still small voice at Horeb'
    key: sc-knowhy-858
    url: 'https://scripturecentral.org/knowhy/why-is-elijah-like-moses'
    quote: 'God had just revealed himself in a dramatic way in 1 Kings 18:38, sending down fire from heaven to consume Elijah’s offering and prove that he was superior to the false God, Baal. But this time God did not reveal himself in a dramatic way'
  - where: setting
    claim: 'Chapter text and heading: Obadiah, the contest, the fire, the rain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/18?lang=eng'
    quote: 'Elijah is sent to meet Ahab—Obadiah saves a hundred prophets and meets Elijah—Elijah challenges the prophets of Baal to call down fire from heaven—They fail—He calls down fire, slays the prophets of Baal, and opens the heavens for rain.'
  - where: thread
    claim: 'One older reading: once the cause of the drought was removed, the drought itself could be removed, by the prophet''s word'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/18.htm'
    quote: 'After the occasion of the curse of drought, which had fallen upon the land, had been removed by the destruction of the idolatrous priest, the curse itself could also be removed.'
  - where: thread
    claim: 'The people''s confession, the LORD is the God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/18?lang=eng'
    quote: 'And when all the people saw it, they fell on their faces: and they said, The Lord, he is the God; the Lord, he is the God.'

  - where: 'note 18:3 “Obadiah, governor of Ahab''s house”'
    claim: 'Obadiah means servant of the Lord; the steward of Ahab is a separate entry from the prophet Obadiah'
    key: bd-obadiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/obadiah?lang=eng'
    quote: 'Servant of the Lord. (1) The steward of Ahab who protected the prophets of God from Jezebel (1 Kgs. 18). … (2) A prophet who foretold the doom of Edom.'
  - where: 'note 18:3 “Obadiah, governor of Ahab''s house”'
    claim: 'As governor of the house Obadiah arranged the king''s appointments; the king and steward searching shows the famine was acute; doubtful he wrote the book of Obadiah'
    key: ot-manual-5
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-5?lang=eng'
    quote: 'Obadiah was the king’s chamberlain, or governor of his house. As such it was his responsibility to arrange the king’s appointments. … The fact that a king and his chief steward had to look for water and grass by themselves shows that the famine had become acute'
  - where: 'note 18:3 “Obadiah, governor of Ahab''s house”'
    claim: 'Doubtful that this Obadiah wrote the book'
    key: ot-manual-5
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-5?lang=eng'
    quote: 'Whether this Obadiah, who “feared the Lord greatly” (v. 3), is the author of the Old Testament book of the same name is not known, but it is doubtful.'
  - where: 'note 18:3 “Obadiah, governor of Ahab''s house”'
    claim: 'The hundred prophets were likely a group like the sons of the prophets or the company of prophets; perhaps not prophets in Elijah''s sense'
    key: ot-minute-1-kings-18
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-18'
    quote: 'It’s more likely the prophets Obadiah saved were part of a group of righteous people, similar to and possibly the same as the “sons of the prophets” mentioned in 2 Kings 2 or the “company of prophets” mentioned in 1 Samuel 10:5. … or they were not prophets in the same way Elijah was.'

  - where: 'note 18:12 “Carried by the Spirit”'
    claim: 'Elijah is taken by the Spirit from place to place, as Nephi son of Helaman is'
    key: sc-knowhy-182
    url: 'https://scripturecentral.org/knowhy/how-did-nephi-use-the-power-to-seal-on-earth-and-in-heaven'
    quote: 'Elijah is taken by the spirit from place to place (1 Kings 18:12; 2 Kings 2:16). Nephi is taken by the spirit from place to place (Helaman 10:16–17).'
  - where: 'note 18:12 “Carried by the Spirit”'
    claim: 'The allusions to Elijah in Nephi''s story strengthen the reading that Nephi sealed the heavens as Elijah did'
    key: sc-knowhy-182
    url: 'https://scripturecentral.org/knowhy/how-did-nephi-use-the-power-to-seal-on-earth-and-in-heaven'
    quote: 'This connection between Nephi and Elijah sealing the heavens is strengthened by the many allusions to the Elijah story in the story of Nephi son of Helaman.'
  - where: 'note 18:12 “Carried by the Spirit”'
    claim: 'Nephi taken by the Spirit and conveyed away'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/hel/10?lang=eng'
    quote: 'for he was taken by the Spirit and conveyed away out of the midst of them.'

  - where: 'note 18:17 “The troubler of Israel”'
    claim: 'ʿōkēr: stir up, disturb, trouble; the participle in 1 Kgs 18:17, with Josh 7:25 and 1 Chr 2:7 (Achan) under the same sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/5916.htm'
    quote: 'עָכַר verb stir up, disturb, trouble … Joshua 7:25 (twice in verse) … יִשְׂרָאֵל ׳ע 1 Kings 18:17,18; 1 Chronicles 2:7 (compare Joshua 7:18 etc., above)'
  - where: 'note 18:17 “The troubler of Israel”'
    claim: 'The word in 18:17 is the participle ʿōkēr'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'עֹכֵ֥ר'
  - where: 'note 18:17 “The troubler of Israel”'
    claim: 'Elijah was only the Lord''s agent; Ahab and his policies were the true cause'
    key: ot-manual-5
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-5?lang=eng'
    quote: 'Elijah had no power by himself to bring on the famine. He was only the agent of the Lord. Ahab and his policies were the true cause of Israel’s distress, but the king refused to accept that responsibility.'
  - where: 'note 18:17 “The troubler of Israel”'
    claim: 'Achar (Achan) the troubler of Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/2?lang=eng'
    quote: 'And the sons of Carmi; Achar, the troubler of Israel, who transgressed in the thing accursed.'

  - where: 'note 18:19 “Carmel, and the prophets of the groves”'
    claim: 'Carmel: garden or park; a hill of 1742 feet, the headland of the coast; known for Elijah and Elisha'
    key: bd-carmel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/carmel?lang=eng'
    quote: 'Garden or park. (1) A hill, 1742 feet high, forming the one headland of the coast of Palestine. It is chiefly known in connection with the history of Elijah and Elisha'
  - where: 'note 18:19 “Carmel, and the prophets of the groves”'
    claim: 'Carmel was a sacred place for El (as quoted in the Scripture Helps endnote)'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: '“The contest takes place at a sacred place for the chief Canaanite god, El, who is also symbolized by the bullock they offer.'
  - where: 'note 18:19 “Carmel, and the prophets of the groves”'
    claim: '“Groves” translates Asherah, a goddess worshiped in connection with trees, Baal''s consort'
    key: ot-minute-1-kings-18
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-18'
    quote: 'Baal had a father named El and a wife or consort named Ashtart or Asherah. When this passage and others refer to the “prophets of the groves,” they are translating the name Asherah as “groves.” Asherah was a fertility and earth goddess worshiped in connection with trees.'
  - where: 'note 18:19 “Carmel, and the prophets of the groves”'
    claim: 'The four hundred prophets of Asherah may not have been part of the contest'
    key: ot-minute-1-kings-18
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-18'
    quote: 'Asherah’s four hundred prophets may not have been part of this trial even though they are mentioned earlier.'

  - where: 'note 18:21 “Limping between two opinions”'
    claim: 'The idiom likely pictured a bird hopping between two branches; many Israelites worshiped other gods alongside Jehovah; a call to stop wavering'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: 'based on a Hebrew idiom that likely referred to a bird hopping between two branches. During Elijah’s time, many Israelites tried to worship multiple gods alongside Jehovah. Elijah’s message was a call for people to stop wavering and fully commit to Jehovah.'
  - where: 'note 18:21 “Limping between two opinions”'
    claim: 'sᵉʿippîm: divided opinions; “how long are ye limping on the two divided opinions (as on unequal legs”'
    key: bdb
    url: 'https://biblehub.com/hebrew/5587.htm'
    quote: '[סְעִמָּה] noun feminine division, divided opinion; — plural absolute עַלשְֿׁתֵּי הַסְּעִמִּים 1 Kings 18:21 how long are ye limping on the two divided opinions (as on unequal legs'
  - where: 'note 18:21 “Limping between two opinions”'
    claim: 'The same verb in 18:26: they went limping along by the altar, probably in their dance'
    key: bdb
    url: 'https://biblehub.com/hebrew/6452.htm'
    quote: 'II. [מָּסַח] verb limp … Pi`el Imperfect3masculine plural וַיְפַסְּחוּ עַלהַֿמִּזְבֵּחַ 1 Kings 18:26 they went limping (along by the altar), i.e. probably in their dance'
  - where: 'note 18:21 “Limping between two opinions”'
    claim: 'Verse 21 has pōsᵉḥîm (6452) and verse 26 wayᵉpassᵉḥû (6452) for “leaped”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'פֹּסְחִים֮'
  - where: 'note 18:21 “Limping between two opinions”'
    claim: 'The people wanted to combine Jehovah and Baal, and were silent because the law demanded an undivided heart (Deut 6:4–5)'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/18.htm'
    quote: 'They wanted to combine the worship of Jehovah and Baal … and were therefore obliged to keep silence under this charge of infatuated halving, since they knew very well from the law itself that Jehovah demanded worship with a whole and undivided heart (Deuteronomy 6:4-5).'
  - where: 'note 18:21 “Limping between two opinions”'
    claim: 'One older reading: the verb in v. 26 is a contemptuous word for the priests'' dance'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/18.htm'
    quote: 'פּסּח is a contemptuous epithet applied to the pantomimic sacrificial dance performed by these priests round about the altar'

  - where: 'note 18:27 “Elijah''s taunt”'
    claim: 'The mocking represents Baal as human, with human needs; Jehovah has no such limits (Ps 121:4)'
    key: ot-minute-1-kings-18
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-18'
    quote: 'Elijah’s mocking represents Baal as more human than god, having human needs, and implies that Jehovah doesn’t have those same limitations. In fact, we’re told in Psalms 121:4, “Behold, he that keepeth Israel shall neither slumber nor sleep.”'
  - where: 'note 18:27 “Elijah''s taunt”'
    claim: 'Cutting “after their manner” shows it was a typical practice of Baal''s priests'
    key: ot-minute-1-kings-18
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-18'
    quote: 'That the priests cut themselves “after their manner” indicates this self-mutilation was a typical practice for priests of Baal.'
  - where: 'note 18:27 “Elijah''s taunt”'
    claim: 'śîaḥ in 1 Kgs 18:27: musing, of a god (AV talk)'
    key: bdb
    url: 'https://biblehub.com/hebrew/7879.htm'
    quote: '2 musing, 1 Kings 18:27 (E) of a god, "" שִׂיג לוֺ, (so RV; SS ''nachdenken''; Buhl ''beschäftigt sein''; AV talk)'
  - where: 'note 18:27 “Elijah''s taunt”'
    claim: 'The words śîaḥ and śîg in 18:27'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'שִׂ֧יחַ'
  - where: 'note 18:27 “Elijah''s taunt”'
    claim: 'Footnote: pursuing, or gone aside, or withdrawn'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/18?lang=eng'
    quote: '“pursuing”: OR gone aside, or withdrawn.'

  - where: 'note 18:31 “Twelve stones for one Israel”'
    claim: 'One older reading: an altar of Jehovah already stood on Carmel, probably built by pious northerners, destroyed under Ahab (19:10)'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/18.htm'
    quote: 'there was already an altar of Jehovah upon Carmel, which either dated from the times anterior to the building of the temple … or, what is more probable, had been built by pious worshippers belonging to the ten tribes since the division of the kingdom … and judging from 1 Kings 19:10, had been destroyed during the reign of Ahab'
  - where: 'note 18:31 “Twelve stones for one Israel”'
    claim: 'The twelve stones declared that the division was at variance with Israel''s calling; the name Israel belonged to the whole nation'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/18.htm'
    quote: 'The twelve stones were a practical declaration on the part of the prophet that the division of the nation into two kingdoms was at variance with the divine calling of Israel, inasmuch as according to the will of God the twelve tribes were to form one people of Jehovah, and to have a common sacrificial altar'
  - where: 'note 18:31 “Twelve stones for one Israel”'
    claim: 'The name Israel claimed by the ten tribes really belonged to the whole nation'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/18.htm'
    quote: 'directs attention to the wrong which the seceding ten tribes had done in claiming the name of Israel for themselves, whereas it really belonged to the whole nation.'

  - where: 'note 18:33 “Water on the altar in a drought”'
    claim: 'The water was scarce during the drought'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: 'Jehovah sent fire from heaven to consume the sacrifice and altar, even though both had been drenched with water, which was scarce during the drought.'
  - where: 'note 18:33 “Water on the altar in a drought”'
    claim: 'The drenching left no doubt that no human power could light the fire'
    key: christofferson-firm-steadfast-2018
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2018/10/firm-and-steadfast-in-the-faith-of-christ?lang=eng'
    quote: 'then ordered that it all be doused with water, not once but three times. There was no doubt that neither he nor any other human power could light the fire.'
  - where: 'note 18:33 “Water on the altar in a drought”'
    claim: 'Four barrels three times make twelve, matching the twelve stones'
    key: ot-minute-1-kings-18
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-18'
    quote: 'Four barrels of water poured three times makes a total of twelve barrels—matching the twelve stones of the altar.'
  - where: 'note 18:33 “Water on the altar in a drought”'
    claim: 'Footnote: barrels, Hebrew jars'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/18?lang=eng'
    quote: '“barrels”: HEB jars.'

  - where: 'note 18:38 “The fire of the LORD”'
    claim: 'Baal the storm god; no fire for his priests; Jehovah''s fire on a drenched altar; all fell down'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: '“Baal was the Canaanite storm god, associated with lightning and rain.” Yet during the contest with Elijah, no fire came when the priests of Baal called upon their false god.'
  - where: 'note 18:38 “The fire of the LORD”'
    claim: 'Not natural lightning but miraculous fire, as in 1 Chr 21:26; 2 Chr 7:1; Lev 9:24; it consumed stones and earth; the people fell on their faces as at Lev 9:24'
    key: ot-manual-5
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-5?lang=eng'
    quote: '“The fire proceeding from Jehovah, was not a natural flash of lightning, which could not produce any such effect, but miraculous fire falling from heaven, as in [1 Chronicles 21:26; 2 Chronicles 7:1] (see [Leviticus 9:24])'
  - where: 'note 18:38 “The fire of the LORD”'
    claim: 'Through the miracle Jehovah accredited Elijah and proved himself the living God; the people fell down as at the consecration of the altar'
    key: ot-manual-5
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-5?lang=eng'
    quote: 'Through this miracle Jehovah not only accredited Elijah as His servant and prophet, but proved Himself to be the living God, whom Israel was to serve; so that all the people who were present fell down upon their faces in worship, as they had done once before, viz. at the consecration of the altar in [Leviticus 9:24]'
  - where: 'note 18:38 “The fire of the LORD”'
    claim: 'The fire at Carmel sets up the contrast of 1 Kgs 19, where God is not in the fire'
    key: sc-knowhy-858
    url: 'https://scripturecentral.org/knowhy/why-is-elijah-like-moses'
    quote: 'The reader expects God to reveal himself in a dramatic way in 1 Kings 19 not only because of all the allusions to Moses but because God had just revealed himself in a dramatic way in 1 Kings 18:38'
  - where: 'note 18:38 “The fire of the LORD”'
    claim: 'Lev 9:24 fire from before the LORD; people fell on their faces'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/9?lang=eng'
    quote: 'And there came a fire out from before the Lord, and consumed upon the altar the burnt offering and the fat: which when all the people saw, they shouted, and fell on their faces.'

  - where: 'note 18:39 “The LORD, he is the God”'
    claim: 'Elijah means Jehovah is my God'
    key: bd-elijah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elijah?lang=eng'
    quote: 'Jehovah is my God.'
  - where: 'note 18:39 “The LORD, he is the God”'
    claim: 'The people may have been chanting; LORD in capitals is Jehovah; the cry is almost Elijah''s name; the moment fulfills his name'
    key: ot-minute-1-kings-18
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-18'
    quote: 'The repetition of the phrase “the Lord, he is the God” implies the people may have been chanting it. … It’s almost as if the Israelites were chanting Elijah’s name. … In this case, this moment fulfils Elijah’s name and was his greatest triumph.'
  - where: 'note 18:39 “The LORD, he is the God”'
    claim: 'Footnote 37a: that thou, Jehovah, art the God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/18?lang=eng'
    quote: '“that”: OR that thou, Jehovah, art the God.'

  - where: 'note 18:40 “The prophets of Baal at the Kishon”'
    claim: 'Elijah ordered the execution of the 450 priests of Baal'
    key: davis-zeal
    url: 'https://mi.byu.edu/old-testament-reflections/zeal-and-the-still-small-voice'
    quote: 'After winning the contest over whose God was real, Elijah ordered the execution of the 450 priests of Baal.'
  - where: 'note 18:40 “The prophets of Baal at the Kishon”'
    claim: 'The law of Moses gave a warrant (Deut 13 and 17); the question is whether zeal is the path of wisdom'
    key: davis-zeal
    url: 'https://mi.byu.edu/old-testament-reflections/zeal-and-the-still-small-voice'
    quote: 'God’s remonstrance with Elijah is not because there was no legal warrant for putting the priests of Baal to the sword. The law of Moses was clear that he could have been justified in doing so (see Deut 13 and 17). … The issue being quietly explored in this story, however, is whether zeal is the path of wisdom.'
  - where: 'note 18:40 “The prophets of Baal at the Kishon”'
    claim: 'No divine command is recorded for the slaughter; a possible gentle rebuke in what follows, a question for readers'
    key: davis-zeal
    url: 'https://mi.byu.edu/old-testament-reflections/zeal-and-the-still-small-voice'
    quote: 'But in Elijah’s story, without divine command, the prophet orders the slaughter of the priests of Baal. … there may be a gentle divine rebuke of some of Elijah’s tactics, too.'
  - where: 'note 18:40 “The prophets of Baal at the Kishon”'
    claim: 'Deut 13:5: the prophet who turns Israel from the LORD is put to death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/13?lang=eng'
    quote: 'And that prophet, or that dreamer of dreams, shall be put to death; because he hath spoken to turn you away from the Lord your God'

  - where: 'note 18:42 “Seven times toward the sea”'
    claim: 'One older reading: Elijah prayed that the Lord would complete His work by fulfilling His promise of rain (18:1)'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/18.htm'
    quote: 'Elijah went up to the top of Carmel to pray that the Lord would complete His work by fulfilling His promise (1 Kings 18:1) in sending rain; and continued in prayer till the visible commencement of the fulfilment of his prayer was announced by his servant'
  - where: 'note 18:42 “Seven times toward the sea”'
    claim: 'The posture probably one of deep absorption in God'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/18.htm'
    quote: 'The peculiar attitude assumed by Elijah when praying (James 5:18), viz., bowing down even to the earth (יגהר) and putting his face between his knees, probably the attitude of deep absorption in God'
  - where: 'note 18:42 “Seven times toward the sea”'
    claim: 'James reads Elijah''s prayer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/james/5?lang=eng'
    quote: 'Elias was a man subject to like passions as we are, and he prayed earnestly that it might not rain: and it rained not on the earth by the space of three years and six months.'
  - where: 'note 18:46 “Running before Ahab to Jezreel”'
    claim: 'The hand of the LORD is the supernatural strength the Lord gave; the formula is used of prophetic inspiration (2 Kgs 3:15)'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/18.htm'
    quote: 'יהוה יד, the hand (i.e., the power) of the Lord, denotes the supernatural strength with which the Lord endowed him, to accomplish superhuman feats. This formula is generally applied to the divine inspiration by which the prophets were prepared for their prophesying (cf. 2 Kings 3:15'
  - where: 'note 18:46 “Running before Ahab to Jezreel”'
    claim: 'One older reading: Elijah ran before Ahab to show humility, as his faithful subject, to touch the king''s heart against Jezebel''s temptations'
    key: keil-kings
