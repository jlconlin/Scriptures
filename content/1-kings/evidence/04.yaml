chapter: 4
claims:
  - where: thread
    claim: 'The Student Manual says Solomon’s taxation fulfilled Samuel’s warning about a king'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'Such taxation fulfilled the words of the prophet Samuel, who many years before had warned Israel what would happen if they chose to have a king rule over them'

  - where: 'note 4:5 “A priest, a counselor, and the king’s friend”'
    claim: 'Theodoret’s explanation: Solomon took away the office but not the hereditary priestly dignity'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/4.htm'
    quote: 'The only possible explanation is that proposed by Theodoret, namely, that Solomon had only deprived him of the ἀρχή, i.e., of the priest''s office, but not of the ἱερωσύνη or priestly dignity, because this was hereditary.'

  - where: 'note 4:7 “What Solomon’s government cost”'
    claim: 'Solomon set Adoniram over the forced labor for his building program'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'Adoniram was named the chief of forced labor—for Solomon had a tremendous building program in mind and no way to begin it without a steady supply of workers.'
  - where: 'note 4:7 “What Solomon’s government cost”'
    claim: 'Azariah son of Nathan was over the officers of the twelve districts, an addition to David’s staff'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'was over the officers [provincial governors]’ of the 12 districts of Israel'
  - where: 'note 4:7 “What Solomon’s government cost”'
    claim: 'David’s list of officers already had Adoram over the tribute'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/20?lang=eng'
    quote: 'And Adoram was over the tribute'
  - where: 'note 4:7 “What Solomon’s government cost”'
    claim: 'Each district fed the court for a month, a burden that fell on farmers and shepherds'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'each district supplied food for one month of every year. The officers in turn imposed the burden of providing food on the farmers and shepherds, and quite a burden it was.'
  - where: 'note 4:7 “What Solomon’s government cost”'
    claim: 'The daily flour and meal came to about 188 and 370 bushels'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: '‘was thirty cors [188 bushels] of fine flour, and sixty cors [about 370 bushels] of meal'
  - where: 'note 4:7 “What Solomon’s government cost”'
    claim: 'The taxation fulfilled Samuel’s warning'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'Such taxation fulfilled the words of the prophet Samuel, who many years before had warned Israel what would happen if they chose to have a king rule over them'
  - where: 'note 4:7 “What Solomon’s government cost”'
    claim: 'The levy was apparently begun under David, with Adoram over it'
    key: bdb
    url: 'https://biblehub.com/hebrew/4522.htm'
    quote: 'apparently instituted, earlier, by David'

  - where: 'note 4:21 “From the river to the border of Egypt”'
    claim: 'The Church’s footnotes set the promises to Abraham beside verses 20 and 21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/4?lang=eng'
    quote: '“the river”: IE the Euphrates. Gen. 15:18.'
  - where: 'note 4:21 “From the river to the border of Egypt”'
    claim: 'The footnote to “sand” in verse 20 points to Gen. 22:17'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/4?lang=eng'
    quote: '“sand”: Gen. 22:17 (17–18); 1 Ne. 12:1.'
  - where: 'note 4:21 “From the river to the border of Egypt”'
    claim: 'The pottery is distinctly Israelite and is not found once one crosses into Philistine territory such as Ashdod'
    key: sc-knowhy-857
    url: 'https://scripturecentral.org/knowhy/why-was-king-solomon-s-kingdom-so-unified-and-large'
    quote: 'The distinctive burnished red-slip pottery appears all along ancient Israelite trading networks, but as soon as one crosses over into the Philistine territory such as Ashdod, this kind of pottery is nowhere to be found. This pottery style appears to be distinctly Israelite'
  - where: 'note 4:21 “From the river to the border of Egypt”'
    claim: 'The question whether Solomon controlled the area or only collected tribute'
    key: sc-knowhy-857
    url: 'https://scripturecentral.org/knowhy/why-was-king-solomon-s-kingdom-so-unified-and-large'
    quote: 'Did Solomon fully control this broader area or did he simply collect tribute from a variety of disunited tribes who all nominally owed him their allegiance?'
  - where: 'note 4:21 “From the river to the border of Egypt”'
    claim: 'A uniform red-slipped pottery appears across the land in Solomon’s time'
    key: sc-knowhy-857
    url: 'https://scripturecentral.org/knowhy/why-was-king-solomon-s-kingdom-so-unified-and-large'
    quote: 'a distinctive burnished red slip pottery appears. This kind of pottery only begins to appear during the time of Solomon, around 950 BCE.'
  - where: 'note 4:21 “From the river to the border of Egypt”'
    claim: 'Bench tombs spread in Solomon’s time and suggest centralization'
    key: sc-knowhy-857
    url: 'https://scripturecentral.org/knowhy/why-was-king-solomon-s-kingdom-so-unified-and-large'
    quote: 'The sudden spread of tombs like this during the time of Solomon also suggests a level of centralization that ancient Israel had not seen before.'
  - where: 'note 4:21 “From the river to the border of Egypt”'
    claim: 'The evidence suggests real control of a kingdom at least from Dan to Beer-sheba'
    key: sc-knowhy-857
    url: 'https://scripturecentral.org/knowhy/why-was-king-solomon-s-kingdom-so-unified-and-large'
    quote: 'This archaeological evidence all suggests that King Solomon had significant control over a united kingdom that stretched at least from Dan to Beer Sheba.'
  - where: 'note 4:21 “From the river to the border of Egypt”'
    claim: 'Perhaps into the Negev in the southwest'
    key: sc-knowhy-857
    url: 'https://scripturecentral.org/knowhy/why-was-king-solomon-s-kingdom-so-unified-and-large'
    quote: 'may even have extended into the Negev desert in the southwest'
  - where: 'note 4:21 “From the river to the border of Egypt”'
    claim: 'The KnoWhy gives as the reason Solomon’s desire to be a good ruler'
    key: sc-knowhy-857
    url: 'https://scripturecentral.org/knowhy/why-was-king-solomon-s-kingdom-so-unified-and-large'
    quote: 'Solomon’s desire to be a good ruler is what led to him having real control over a large and prosperous kingdom.'

  - where: 'note 4:25 “Every man under his vine”'
    claim: 'Solomon’s name means “peaceable”'
    key: bd-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/solomon?lang=eng'
    quote: 'Peaceable. Son of David and Bathsheba.'
  - where: 'note 4:25 “Every man under his vine”'
    claim: 'The footnotes point “peace” to 1 Chr. 22:9 and “vine” to Micah 4:4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/4?lang=eng'
    quote: '“vine”: Micah 4:4.'
  - where: 'note 4:25 “Every man under his vine”'
    claim: 'Chronicles gives the promise in Solomon’s name of peace in his days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/22?lang=eng'
    quote: 'for his name shall be Solomon, and I will give peace and quietness unto Israel in his days.'

  - where: 'note 4:26 “Forty thousand, or four thousand?”'
    claim: 'The Hebrew of 1 Kgs. 4:26 reads forty'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/1_kings/4-26.htm'
    quote: '’ar·bā·‘îm'
  - where: 'note 4:26 “Forty thousand, or four thousand?”'
    claim: 'The Hebrew of 2 Chr. 9:25 reads four'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/2_chronicles/9-25.htm'
    quote: '’ar·ba·‘aṯ'
  - where: 'note 4:26 “Forty thousand, or four thousand?”'
    claim: 'Chronicles has four thousand stalls'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/9?lang=eng'
    quote: 'And Solomon had four thousand stalls for horses and chariots, and twelve thousand horsemen'
  - where: 'note 4:26 “Forty thousand, or four thousand?”'
    claim: 'The Student Manual: Hebrew number words are easily confused in copying'
    key: ot-manual-large-numbers
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/enrichment-section-e-the-problem-of-large-numbers-in-the-old-testament?lang=eng'
    quote: 'the words denoting numbers in Hebrew are easily confused with each other, as in English. Just as ‘eight’ and ‘eighty’ differ only by a single letter'

  - where: 'note 4:29 “Largeness of heart”'
    claim: 'BDB: rochab is breadth, of land the whole extent'
    key: bdb
    url: 'https://biblehub.com/hebrew/7341.htm'
    quote: 'breadth, width; — ׳ר absolute Ezekiel 42:2 +'
  - where: 'note 4:29 “Largeness of heart”'
    claim: 'BDB: with heart it means largeness of understanding, in this verse'
    key: bdb
    url: 'https://biblehub.com/hebrew/7341.htm'
    quote: 'largeness of understanding (like sand of sea-shore) 1 Kings 5:9'

  - where: 'note 4:7 “What Solomon’s government cost”'
    claim: 'David governed with a small staff, to which Solomon added'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'David had governed his new empire almost single-handedly, needing only a commanding general, a chief scribe and a few secretaries. To this basic staff Solomon added Ahishar'
  - where: 'note 4:21 “From the river to the border of Egypt”'
    claim: 'The kingdoms brought tribute'
    key: sc-knowhy-857
    url: 'https://scripturecentral.org/knowhy/why-was-king-solomon-s-kingdom-so-unified-and-large'
    quote: 'The kingdoms in this envelope brought tributes and “served Solomon all the days of his life.”'
  - where: 'note 4:21 “From the river to the border of Egypt”'
    claim: 'Bench tombs were hollowed out of the rock'
    key: sc-knowhy-857
    url: 'https://scripturecentral.org/knowhy/why-was-king-solomon-s-kingdom-so-unified-and-large'
    quote: 'These were tombs which were hollowed out of the rock with stone “benches” on either side'
  - where: christ
    claim: 'Jesus measured Himself against the wisdom of Solomon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/12?lang=eng'
    quote: 'she came from the uttermost parts of the earth to hear the wisdom of Solomon; and, behold, a greater than Solomon is here.'
  - where: christ
    claim: 'James promises wisdom to whoever asks of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/james/1?lang=eng'
    quote: 'If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him.'
  - where: 'note 4:25 “Every man under his vine”'
    claim: 'The Assyrian envoy offered Jerusalem each man his vine and fig tree'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/36?lang=eng'
    quote: 'eat ye every one of his vine, and every one of his fig tree'
  - where: 'note 4:29 “Largeness of heart”'
    claim: 'The footnote to “wisdom” points to 1 Kgs. 3:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/4?lang=eng'
    quote: '“wisdom”: 1 Kgs. 3:12.'
  - where: 'note 4:5 “A priest, a counselor, and the king’s friend”'
    claim: 'BDB groups David’s sons (2 Sam. 8:18) and his grandson Zabud (1 Kgs. 4:5) with chieftains who performed priestly functions'
    key: bdb
    url: 'https://biblehub.com/hebrew/3548.htm'
    quote: 'so also probably the sons of David 2 Samuel 8:18, his grandson 1 Kings 4:5, and Ira the Jairite 2 Samuel 20:26, who as princes performed priestly functions'
  - where: 'note 4:5 “A priest, a counselor, and the king’s friend”'
    claim: 'BDB’s class of chieftains exercising priestly functions includes the priest of Midian'
    key: bdb
    url: 'https://biblehub.com/hebrew/3548.htm'
    quote: 'or a chieftain (exercising priestly functions) כֹּהֵן מִדְיָן Exodus 2:16; Exodus 3:1; Exodus 18:1'
  - where: 'note 4:5 “A priest, a counselor, and the king’s friend”'
    claim: 'BDB: “the king’s friend” is a technical term'
    key: bdb
    url: 'https://biblehub.com/hebrew/7453.htm'
    quote: 'technical term הַמֶּלֶךְ ׳ר 1 Chronicles 27:33'
  - where: 'note 4:5 “A priest, a counselor, and the king’s friend”'
    claim: 'The King James calls David’s sons “chief rulers”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/8?lang=eng'
    quote: 'and David’s sons were chief rulers.'
  - where: 'note 4:5 “A priest, a counselor, and the king’s friend”'
    claim: 'Chronicles calls Hushai the king’s companion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/27?lang=eng'
    quote: 'and Hushai the Archite was the king’s companion'
  - where: 'note 4:26 “Forty thousand, or four thousand?”'
    claim: 'The parallel passages show numbers were hard to transmit accurately'
    key: ot-manual-large-numbers
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/enrichment-section-e-the-problem-of-large-numbers-in-the-old-testament?lang=eng'
    quote: 'There is also evidence from the parallel passages in Samuel, Kings and Chronicles and (especially) in Ezra 2 and Nehemiah 7 that numbers were peculiarly difficult to transmit accurately.'
