chapter: 19
claims:
  - where: 'setting'
    claim: 'After Carmel, Jezebel swore to have Elijah killed within a day; he fled from Israel to Mount Horeb, or Sinai.'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: 'Jezebel swore an oath that she would have Elijah killed within 24 hours. Elijah fled from the land of Israel and traveled many days until he came to Mount Horeb, or Sinai.'
  - where: 'setting'
    claim: 'Chapter 18 ends with the fire, the slaying of the prophets of Baal at Kishon, the rain, and Elijah running before Ahab to Jezreel; the chapter heading gives the sequence of chapter 19.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/19?lang=eng'
    quote: 'Jezebel seeks the life of Elijah—An angel sends him to Horeb—The Lord speaks to Elijah, not in the wind nor the earthquake nor the fire, but in a still, small voice—Elisha joins Elijah.'
  - where: 'setting'
    claim: 'Scripture Helps treats the chapter as 19:1–8, 19:9–12 and 19:19–21.'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: 'See 1 Kings 19:1–8. Both Elijah and Moses experienced divine manifestations from the Lord at Mount Sinai (compare 1 Kings 19:9–12 with Exodus 3:1–4; 24:12–18).'
  - where: 'setting'
    claim: 'The chapter is told as part of a pattern in which Elijah is like Moses.'
    key: sc-knowhy-858
    url: 'https://scripturecentral.org/knowhy/why-is-elijah-like-moses'
    quote: 'Elijah’s actions can be explained when one sees them as part of a larger pattern in 1 Kings 19, in which Elijah is depicted as being similar to Moses.'
  - where: 'thread'
    claim: 'At Horeb the LORD spoke quietly and reassured Elijah that he was not alone.'
    key: sc-knowhy-858
    url: 'https://scripturecentral.org/knowhy/why-is-elijah-like-moses'
    quote: 'he spoke to him in a still, small, voice, and then reassured him that he was not alone and that everything would turn out well for him (1 Kings 19:15-18).'
  - where: 'section 1 plain'
    claim: 'The “juniper tree” is in Hebrew a broom bush.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/19?lang=eng'
    quote: '4a “juniper tree”: HEB broom-bush (a desert shrub); so also in v. 5.'
  - where: 'section 2 plain'
    claim: '“Jealous” in verses 10 and 14 means zealous.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/19?lang=eng'
    quote: '14a “jealous”: OR zealous.'

  - where: 'note 19:3 “Why Elijah fled”'
    claim: 'The received Hebrew text of verse 3 reads wayyar’, “and he saw” (from the verb to see, H7200).'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'וַ/יַּ֗רְא'
  - where: 'note 19:3 “Why Elijah fled”'
    claim: 'The Septuagint reads “And Eliu feared.”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_kings/19.htm'
    quote: '3And Eliu feared, and rose, and departed for his life: and he comes to Bersabee to the land of Juda, and he left his servant there.'
  - where: 'note 19:3 “Why Elijah fled”'
    claim: 'Jezebel threatened by messenger rather than sending soldiers, hinting she knew she could not kill him that way.'
    key: ot-minute-1-kings-19
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-19'
    quote: 'threatening Elijah through a messenger rather than just sending soldiers to kill him hints that perhaps she knew she would not have been able to kill Elijah in that way.'
  - where: 'note 19:3 “Why Elijah fled”'
    claim: '“Belongeth to Judah” tells that Elijah left the Northern Kingdom; Beersheba was the southernmost city, a desert city.'
    key: ot-minute-1-kings-19
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-19'
    quote: 'Pointing out that Beersheba belonged to Judah is the author’s way of telling us Elijah left the Northern Kingdom of Israel to go to the Southern Kingdom of Judah. Beersheba was the southernmost city in the Southern Kingdom.'
  - where: 'note 19:3 “Why Elijah fled”'
    claim: 'A shorter trip into the desert would likely have kept Elijah safe, which raises the question why he went so far.'
    key: sc-knowhy-858
    url: 'https://scripturecentral.org/knowhy/why-is-elijah-like-moses'
    quote: 'One might wonder, at first, why Elijah would travel such a long distance when a much shorter trip into the desert would likely have sufficed to keep him safe from Jezebel.'

  - where: 'note 19:3 “Why Elijah fled”'
    claim: 'The “juniper tree” is in Hebrew a broom bush, a desert shrub.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/19?lang=eng'
    quote: '4a “juniper tree”: HEB broom-bush (a desert shrub); so also in v. 5.'
  - where: 'note 19:8 “Elijah at Moses’ mountain”'
    claim: 'Horeb is Sinai.'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: 'Elijah fled from the land of Israel and traveled many days until he came to Mount Horeb, or Sinai.'
  - where: 'note 19:8 “Elijah at Moses’ mountain”'
    claim: 'Sinai lies further south from Beersheba; the forty days reverse Israel''s forty years with Moses.'
    key: ot-minute-1-kings-19
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-19'
    quote: 'Further south from Beersheba through the Negev Desert lies Sinai, or Horeb as it was called there. Elijah’s journey of forty days and forty nights reflects the reverse journey of the children of Israel with Moses, which took forty years.'
  - where: 'note 19:8 “Elijah at Moses’ mountain”'
    claim: 'The long journey is explained by a pattern in which Elijah is like Moses.'
    key: sc-knowhy-858
    url: 'https://scripturecentral.org/knowhy/why-is-elijah-like-moses'
    quote: 'However, Elijah’s actions can be explained when one sees them as part of a larger pattern in 1 Kings 19, in which Elijah is depicted as being similar to Moses.'
  - where: 'note 19:8 “Elijah at Moses’ mountain”'
    claim: 'The likenesses: Sinai, forty days without food, a cave, the LORD passing by, fire, storm, earthquake, covered faces.'
    key: sc-knowhy-858
    url: 'https://scripturecentral.org/knowhy/why-is-elijah-like-moses'
    quote: 'Each go without food for forty days (1 Kings 19:8; Exodus 24:18; 34:28). Moses and Elijah both wait in a cave in Mt. Sinai … The Lord tells both of them that he will pass them by. … Both cover their faces'
  - where: 'note 19:8 “Elijah at Moses’ mountain”'
    claim: 'The narrator presents Elijah as the prophet like Moses of Deut. 18:15: food and water by miracle, control of the elements, flight, forty days'' fast, summons to Horeb.'
    key: davis-zeal
    url: 'https://mi.byu.edu/old-testament-reflections/zeal-and-the-still-small-voice'
    quote: 'in the narrator’s mind he was the prophet like Moses promised in Deuteronomy 18:15. Like Moses, Elijah provides food and water by miraculous means, demonstrates miraculous control over the elements, flees for his life, fasts forty days in the wilderness'
  - where: 'note 19:8 “Elijah at Moses’ mountain”'
    claim: 'The forty days back to Horeb mirror in reverse the forty years of the exodus.'
    key: davis-zeal
    url: 'https://mi.byu.edu/old-testament-reflections/zeal-and-the-still-small-voice'
    quote: 'journeys forty days back to Horeb, mirroring in reverse, as it were, the exodus of the children of Israel through the wilderness of Sinai over the space of forty years.'
  - where: 'note 19:8 “Elijah at Moses’ mountain”'
    claim: 'Exodus 24:18, 34:28 and 33:21–22 as cited; the site''s Exodus notes set out the same likenesses.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/19?lang=eng'
    quote: '8c “Horeb”: Ex. 3:1; 3 Ne. 25:4.'

  - where: 'note 19:11 “Not in the wind, the earthquake, or the fire”'
    claim: 'A reader expects the loud trumpet and booming voice of Sinai; Deut. 5:22–26 shows God''s voice was loud; instead Elijah hears a still small voice.'
    key: sc-knowhy-858
    url: 'https://scripturecentral.org/knowhy/why-is-elijah-like-moses'
    quote: 'The reader, seeing all these similarities, likely assumes that Ellijah will now experience the loud “sound of a trumpet” as in Exodus 19:16, 19 … Deuteronomy 5:22–26 makes it clear that Gods voice is indeed loud. However, for Elijah, the exact opposite happens.'
  - where: 'note 19:11 “Not in the wind, the earthquake, or the fire”'
    claim: 'God did not speak in a booming voice and slay Elijah''s enemies; He spoke quietly and reassured him.'
    key: sc-knowhy-858
    url: 'https://scripturecentral.org/knowhy/why-is-elijah-like-moses'
    quote: 'He did not speak to Elijah in a booming voice from out of Mt. Sinai and then come down to slay Elijah’s enemies. Instead, he spoke to him in a still, small, voice'
  - where: 'note 19:11 “Not in the wind, the earthquake, or the fire”'
    claim: 'At Sinai there was no mistaking God''s presence; Elijah''s experience inverts that pattern of theophany.'
    key: davis-zeal
    url: 'https://mi.byu.edu/old-testament-reflections/zeal-and-the-still-small-voice'
    quote: 'it inverts the pattern of theophany that has been established already in the record. At Sinai, for example, when the mountain shook, and thunder and smoke came upon it, there was to be no mistake that God was there.'
  - where: 'note 19:11 “Not in the wind, the earthquake, or the fire”'
    claim: 'Horeb contrasts with Carmel, where the Lord manifested Himself dramatically.'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: 'Elijah’s experience with the Lord at Mount Horeb stands in stark contrast to his earlier encounter with the priests of Baal, when the Lord manifested Himself in a dramatic way.'
  - where: 'note 19:11 “Not in the wind, the earthquake, or the fire”'
    claim: 'The Lord was “in” the voice in a sense He was not “in” the wind, earthquake or fire.'
    key: peterson-small-voice
    url: 'https://interpreterfoundation.org/journal/the-small-voice'
    quote: 'Somehow, the Lord was “in” that “still small voice,” and he was “in” it in a sense that he wasn’t “in” the wind, the earthquake, or the fire.'
  - where: 'note 19:11 “Not in the wind, the earthquake, or the fire”'
    claim: 'Sinai''s thunder, fire and quaking (Ex. 19:16–18) and Carmel''s fire (1 Kgs. 18:38), read in the chapters cited.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/19?lang=eng'
    quote: 'The Lord speaks to Elijah, not in the wind nor the earthquake nor the fire, but in a still, small voice'

  - where: 'note 19:12 “A still small voice”'
    claim: 'The Hebrew is qôl dᵉmāmâ daqqâ.'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'דְּמָמָ֥ה'
  - where: 'note 19:12 “A still small voice”'
    claim: 'BDB: dᵉmāmâ, (silence) whisper; Ps. 107:29 the storm settled into a whisper.'
    key: bdb
    url: 'https://biblehub.com/bdb/1827.htm'
    quote: 'דְּמָמָה noun feminine (silence) whisper … יָקֵם סְעָרָה לִדְמָמָ֑ה Psalm 107:29 he settleth storm into whisper.'
  - where: 'note 19:12 “A still small voice”'
    claim: 'BDB: daq, thin, small, fine, of the manna and dust; once of a low whisper, 1 Kgs. 19:12.'
    key: bdb
    url: 'https://biblehub.com/bdb/1851.htm'
    quote: '2 small, fine, of the manna … Exodus 16:14; … of dust … Isaiah 29:5; … once of a low whisper קוֺל דְּמָמָה דַקָּה 1 Kings 19:12.'
  - where: 'note 19:12 “A still small voice”'
    claim: '“Still” is better “quiet”; “small” can be “thin” or “crushed”; qol is also “sound”; a sound so quiet it needs another adjective; it is unclear whether words or a sound; the phrase now describes promptings of the Holy Ghost.'
    key: ot-minute-1-kings-19
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-19'
    quote: 'The word “still” implies a lack of motion, but the Hebrew word is probably better translated as “quiet.” “Small” is an alright translation, but “thin” or “crushed” are also good. … Thus it is a sound that is so quiet it needs another adjective to describe how very like silence it is.'
  - where: 'note 19:12 “A still small voice”'
    claim: 'The phrase has become a primary way to describe promptings of the Holy Ghost.'
    key: ot-minute-1-kings-19
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-19'
    quote: 'The “still small voice” phrase from this verse has become one of the primary ways to describe promptings of the Holy Ghost.'
  - where: 'note 19:12 “A still small voice”'
    claim: 'The text is ambiguous whether a sound or a voice; its quietness was the point; Elijah detected something divine, wrapped his face, and moved to the cave''s entrance in fear and attraction.'
    key: davis-zeal
    url: 'https://mi.byu.edu/old-testament-reflections/zeal-and-the-still-small-voice'
    quote: 'the text is ambiguous as to what there was to be heard—a sound? a voice?—it is clear that its quietness was the point and that Elijah was meant to detect something divine in it. He clearly does, for upon hearing it, Elijah “wrapped his face in his mantle.” Then, in a gesture of both fear and attraction'
  - where: 'note 19:12 “A still small voice”'
    claim: '1 Kgs. 19:12 is quoted in 1 Ne. 17:45.'
    key: sc-knowhy-410
    url: 'https://scripturecentral.org/knowhy/what-parts-of-the-old-testament-were-on-the-plates-of-brass'
    quote: 'and 1 Kings 19:12 is quoted in 1 Nephi 17:45.'
  - where: 'note 19:12 “A still small voice”'
    claim: 'The plates of brass likely held 1–2 Kings as part of the “record of the Jews.”'
    key: sc-knowhy-410
    url: 'https://scripturecentral.org/knowhy/what-parts-of-the-old-testament-were-on-the-plates-of-brass'
    quote: 'The “record of the Jews” was likely Joshua, Judges, 1–2 Samuel, and 1–2 Kings.'
  - where: 'note 19:12 “A still small voice”'
    claim: '1 Ne. 17:45 and Ps. 107:29 read in the Church''s editions; footnote 12a points to Hel. 5:30 and 3 Ne. 11:3.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/17?lang=eng'
    quote: 'he hath spoken unto you in a still small voice, but ye were past feeling, that ye could not feel his words'

  - where: 'note 19:14 “Very jealous for the LORD”'
    claim: '“Jealous” means zealous.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/19?lang=eng'
    quote: '14a “jealous”: OR zealous.'
  - where: 'note 19:14 “Very jealous for the LORD”'
    claim: 'Elijah repeats verse 10; “zealous” is a better translation.'
    key: ot-minute-1-kings-19
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-19'
    quote: 'Elijah repeated his statement from verse 10. As the first footnote in verse 14 says, “zealous” is a better translation than “jealous.”'
  - where: 'note 19:14 “Very jealous for the LORD”'
    claim: 'The repeated question after the object lesson suggests God was conveying a message; Elijah gives the same answer; the zeal is still there.'
    key: davis-zeal
    url: 'https://mi.byu.edu/old-testament-reflections/zeal-and-the-still-small-voice'
    quote: 'Such a pointed question, asked in the exact same words as before, but now after a potent object lesson, suggests that God was trying to convey a message. But Elijah responds with the same answer he gave before'
  - where: 'note 19:14 “Very jealous for the LORD”'
    claim: 'Irony: Elijah complains of prophets slain just after presiding over the killing of hundreds of false prophets.'
    key: davis-zeal
    url: 'https://mi.byu.edu/old-testament-reflections/zeal-and-the-still-small-voice'
    quote: 'Here is some irony, since Elijah himself has just presided over the killing of hundreds of prophets—albeit false ones.'
  - where: 'note 19:14 “Very jealous for the LORD”'
    claim: 'The law could have justified Elijah; the story explores whether zeal is the path of wisdom; a higher wisdom is in restraint and a lowered voice.'
    key: davis-zeal
    url: 'https://mi.byu.edu/old-testament-reflections/zeal-and-the-still-small-voice'
    quote: 'The law of Moses was clear that he could have been justified in doing so (see Deut 13 and 17). That is perhaps why God is not more severe … The issue being quietly explored in this story, however, is whether zeal is the path of wisdom.'
  - where: 'note 19:14 “Very jealous for the LORD”'
    claim: 'Higher wisdom in restraint and truth spoken with a lowered voice.'
    key: davis-zeal
    url: 'https://mi.byu.edu/old-testament-reflections/zeal-and-the-still-small-voice'
    quote: 'There is a wisdom higher than zeal in restraint, in the measured response, in due process, and in truth spoken with the potency of a lowered voice.'
  - where: 'note 19:14 “Very jealous for the LORD”'
    claim: 'The LORD reassured Elijah he was not alone (verses 15–18).'
    key: sc-knowhy-858
    url: 'https://scripturecentral.org/knowhy/why-is-elijah-like-moses'
    quote: 'and then reassured him that he was not alone and that everything would turn out well for him (1 Kings 19:15-18).'

  - where: 'note 19:15 “Three anointings”'
    claim: 'The Bible does not record Elijah anointing Hazael, Jehu or Elisha; he gave Elisha his mantle; Elisha directed a follower to anoint Jehu (2 Kgs. 9:1–2).'
    key: ot-minute-1-kings-19
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-19'
    quote: 'If Elijah anointed Hazael, Jehu, and Elisha, the Bible did not record it. He did give Elisha his mantle (verse 19) but didn’t specifically anoint Elisha … Elisha also did not anoint Jehu but did direct one of his followers to do so (see 2 Kings 9:1–2).'
  - where: 'note 19:15 “Three anointings”'
    claim: 'No account of Elisha''s anointing; it is a symbol of the transfer of the prophetic call.'
    key: seely-messiah
    url: 'https://rsc.byu.edu/approaching-holiness/jesus-messiah-prophet-priest-king'
    quote: 'Elijah was commanded to anoint Elisha as his successor (see 1 Kings 19:16). While no account of the anointing is found, this anointing is clearly to be understood as a symbol of the transfer of the prophetic call from Elijah to his successor.'
  - where: 'note 19:15 “Three anointings”'
    claim: 'Footnote 15a points to 2 Kgs. 8:13; 2 Kgs. 8:12–13 and 9:1–3 read.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/19?lang=eng'
    quote: '15a “king”: 2 Kgs. 8:13.'

  - where: 'note 19:18 “Seven thousand who have not bowed”'
    claim: 'One older reading: seven thousand is an indefinite number, small beside Israel, a holy remnant.'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/1_kings/19.htm'
    quote: 'Used for an indefinite number. … The total was small compared with the whole people of Israel, but they were God’s ‘holy remnant,’ the seed of a purified congregation of the future.'
  - where: 'note 19:18 “Seven thousand who have not bowed”'
    claim: 'Kissing was part of worship of false gods (Hos. 13:2).'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/1_kings/19.htm'
    quote: 'That such was the nature of some part of the worship offered to false gods we can see from Hosea 13:2, ‘Let the men that sacrifice kiss the calves.’'
  - where: 'note 19:18 “Seven thousand who have not bowed”'
    claim: 'The seven thousand undo Elijah''s fantasy of being the last righteous person.'
    key: davis-zeal
    url: 'https://mi.byu.edu/old-testament-reflections/zeal-and-the-still-small-voice'
    quote: 'there are seven thousand others in Israel who have never bowed to Baal (1 Kings 19:18)—a quietly devastating unlacing of the prophet’s fantasy of being the last righteous person standing.'
  - where: 'note 19:18 “Seven thousand who have not bowed”'
    claim: 'Paul quotes the answer and concludes a remnant exists now (Rom. 11:4–5).'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/11?lang=eng'
    quote: 'I have reserved to myself seven thousand men, who have not bowed the knee to the image of Baal. … Even so then at this present time also there is a remnant according to the election of grace.'

  - where: 'note 19:19 “The mantle”'
    claim: 'The mantle was a symbol of authority, first mentioned in 1 Kgs. 19, placed on Elisha to designate him successor; its fall in 2 Kgs. 2 passed the calling.'
    key: scripture-helps-2-kings-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/26-2-kings-2-7?lang=eng'
    quote: 'Elijah’s mantle, or robe, was a symbol of his authority. This mantle is first mentioned in 1 Kings 19, when Elijah placed it upon Elisha to designate him as Elijah’s successor.'
  - where: 'note 19:19 “The mantle”'
    claim: 'The mantle was a visible symbol that Elisha would take up Elijah''s power, authority and mission, message and miracles.'
    key: seely-messiah
    url: 'https://rsc.byu.edu/approaching-holiness/jesus-messiah-prophet-priest-king'
    quote: 'The mantle was a visible symbol of the significance of the anointing—that Elisha would resume the power, authority, and responsibilities of the mission of Elijah and would deliver the same message and perform many of the same miracles'
  - where: 'note 19:19 “The mantle”'
    claim: 'The same word ʾadderet in verses 13 and 19.'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'אַדַּרְתּ֖/וֹ'
  - where: 'note 19:19 “The mantle”'
    claim: 'Footnote 19a points to 2 Kgs. 2:8.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/19?lang=eng'
    quote: '19a “mantle”: 2 Kgs. 2:8.'

  - where: 'note 19:20 “What have I done to thee?”'
    claim: 'One older reading: permission, no constraint, the choice of the prophetic calling left to him.'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/19.htm'
    quote: 'The words "what have I done to thee?" can only mean, I have not wanted to put any constraint upon thee, but leave it to thy free will to decide in favour of the prophetic calling.'
  - where: 'note 19:20 “What have I done to thee?”'
    claim: 'A Latter-day Saint reading: cherish normal moments, for the mantle is a burden heavier than the oxen carry.'
    key: ot-minute-1-kings-19
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-19'
    quote: '“Go back and cherish these normal moments, for what I have just done is place a mantle upon you that will be a burden far heavier than your oxen carry.”'
  - where: 'note 19:20 “What have I done to thee?”'
    claim: 'Burning the harness to cook the oxen symbolized full commitment and implies a sacrificial meal; “ministered” (sharath) implies a servant''s role.'
    key: ot-minute-1-kings-19
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-19'
    quote: 'Elisha burned the oxen harness to cook the meat of the oxen, perhaps as a symbol that he was fully committed to his new role. It also implies a more ritualist meal, a sacrifice offered as Elisha’s life was changed. … sharath and usually implies a servant role.'
  - where: 'christ'
    claim: 'Hel. 5:30 and 3 Ne. 11:3 read; the voice in Hel. 5:30 is the voice of Christ (a reading).'
    key: davis-zeal
    url: 'https://mi.byu.edu/old-testament-reflections/zeal-and-the-still-small-voice'
    quote: '(Hel 5:30; and compare 3 Ne. 11:3–5). The voice, of course, is the voice of Christ'
  - where: 'christ'
    claim: '3 Nephi 8–11 is told with storm, fire, earthquake and a small voice heralding the Savior, crafted to recall Elijah.'
    key: peterson-small-voice
    url: 'https://interpreterfoundation.org/journal/the-small-voice'
    quote: 'the account of the destructions in 3 Nephi 8–11 tells of a great “storm,” “tempest,” “thunder” and “whirlwinds,” as well as of fire and of an earthquake that broke the rocks, ultimately followed by a “small voice” heralding the Savior’s appearance.'
  - where: 'christ'
    claim: 'Hel. 5:30 read in the Church''s edition.'
    key: lds-scriptures
