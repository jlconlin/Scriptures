page: hearing-heart
claims:
  # ---------- opening ----------
  - where: 'opening'
    claim: '“Understanding heart” in 3:9 is lēb šōmēaʿ, the noun lēb (H3820) with the Qal participle of šāmaʿ (H8085), literally a hearing heart'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'לֵ֤ב שֹׁמֵ֨עַ֙'
  - where: 'opening'
    claim: 'šāmaʿ is the ordinary Hebrew verb “hear,” to perceive by ear'
    key: bdb
    url: 'https://biblehub.com/hebrew/8085.htm'
    quote: 'a. hear (perceive by ear), accusative of thing, especially קוֺל Genesis 3:10 (J) + 46 t.'
  - where: 'opening'
    claim: 'šāmaʿ (H8085) occurs fourteen times in chapter 8 (8:28, 29, 30 ×3, 32, 34, 36, 39, 42, 43, 45, 49, 52), as the dossier counted from the WLC'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'וְ/שָׁ֨מַעְתָּ֜'
  - where: 'opening'
    claim: 'Connection made by this page: Solomon asks for a hearing heart (3:9), asks the LORD to hear and to incline Israel’s heart (8:30, 58), is answered “I have heard” with the promise of the LORD’s heart in the house (9:3); his heart is inclined away in the same verb (11:2–4), his son hears not (12:15–16), and the book goes on away from the house: a prayer granted at Bethel (13:6), the LORD hearing in Zidon (17:22), answering by fire on Carmel (18:37) and seeing Ahab in sackcloth (21:29); the text does not say the later scenes answer chapter 8, and the reason prayer far from the house is heard, which Kings does not give, is Zenos’s “because of thy Son” (Alma 33:11)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'and hear thou in heaven thy dwelling place: and when thou hearest, forgive.'

  # ---------- A heart that hears ----------
  - where: 'section “A heart that hears”'
    claim: 'šōmēaʿ in 3:9 is a Qal participle (HVqrmsa), “hearing,” followed by “to judge” (lišpōṭ)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'שֹׁמֵ֨עַ֙'
  - where: 'section “A heart that hears”'
    claim: 'In 3:11 “understanding to discern judgment” is lišmōaʿ mišpāṭ, the same verb šāmaʿ (H8085) as in the request'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'לִ/שְׁמֹ֥עַ'
  - where: 'section “A heart that hears”'
    claim: 'The Student Manual: Solomon’s prayer for an understanding heart was surely granted, as the two harlots show'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'Solomon’s prayer for an “understanding heart” (1 Kings 3:9) was surely granted, as the incident of the two harlots demonstrates.'
  - where: 'section “A heart that hears”'
    claim: 'Combs (Old Testament Minute): the phrase would be better translated “discerning mind”; it is a mistake to read it as a request for empathy'
    key: ot-minute-1-kings-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-3'
    quote: 'It is a mistake to imply that Solomon was seeking greater empathy in his request for an “understanding heart.” The phrase would be better translated as “discerning mind.”'
  - where: 'section “A heart that hears”'
    claim: 'Keil: šōmēaʿ lēb is “a hearing heart, i.e., a heart giving heed to the law and right of God”'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/3.htm'
    quote: 'שׁמע לב, a hearing heart, i.e., a heart giving heed to the law and right of God'

  # ---------- Hear thou in heaven ----------
  - where: 'section “Hear thou in heaven”'
    claim: 'šāmaʿ (H8085) occurs fourteen times in twelve verses of 1 Kings 8 (28, 29, 30 ×3, 32, 34, 36, 39, 42, 43, 45, 49, 52), the dossier’s count from the WLC'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'תִּשְׁמַ֞ע'
  - where: 'section “Hear thou in heaven”'
    claim: 'Come, Follow Me 26 quotes 8:47–48 (“If they … return unto thee with all their heart, … then hear thou their prayer”) as what Solomon pleaded, and its title for the week is “Hear Thou in Heaven Their Prayer”'
    key: cfm-ot-2026-26
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/26?lang=eng'
    quote: 'In dedicating the new holy house, Solomon pleaded with the Lord, “If they … return unto thee with all their heart, … then hear thou their prayer” (1 Kings 8:47–48).'
  - where: 'section “Hear thou in heaven”'
    claim: '“Incline our hearts” in 8:58 is lĕhaṭṭôt (H5186 nāṭâ, Hiphil infinitive) with lĕbābēnû, the LORD as the one inclining'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'לְ/הַטּ֥וֹת לְבָבֵ֖/נוּ'
  - where: 'section “Hear thou in heaven”'
    claim: 'BDB files 8:58 under “incline one’s own heart unto God and his commands,” with the LORD as subject'
    key: bdb
    url: 'https://biblehub.com/hebrew/5186.htm'
    quote: 'd. incline one’s own heart unto (אֶל) God and his commands, Joshua 24:23 (E), compare Proverbs 2:2 (ל); subject ׳י, 1 Kings 8:58'
  - where: 'section “Hear thou in heaven”'
    claim: 'Elder Oaks: the Lord puts His name in a temple because He gives authority for His name to be used in the sacred ordinances of that house'
    key: oaks-name-1985
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1985/04/taking-upon-us-the-name-of-jesus-christ?lang=eng'
    quote: 'The scriptures speak of the Lord’s putting his name in a temple because he gives authority for his name to be used in the sacred ordinances of that house.'
  - where: 'section “Hear thou in heaven”'
    claim: '“Mine heart” in 9:3 is lēb (H3820), the noun of 3:9'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'וְ/לִבִּ֛/י'
  - where: 'section “Hear thou in heaven”'
    claim: 'Connection made by this page: the king who asked for a hearing heart and then asked the LORD to hear is answered with “I have heard” and the promise of the LORD’s own heart in the house (9:3), so the hearing heart Solomon wanted is first of all the LORD’s'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/9?lang=eng'
    quote: 'I have heard thy prayer and thy supplication, that thou hast made before me: I have hallowed this house, which thou hast built, to put my name there for ever; and mine eyes and mine heart shall be there perpetually.'

  # ---------- Inclined ----------
  - where: 'section “Inclined”'
    claim: '“Turn away your heart / his heart” in 11:2, 3, 4 and “his heart was turned” in 11:9 are all nāṭâ (H5186): yaṭṭû, wayyaṭṭû, hiṭṭû, nāṭâ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'הִטּ֣וּ'
  - where: 'section “Inclined”'
    claim: 'BDB lists 11:2, 4 and 3 as “turn (away) heart (cause to apostatize)” in the line before the one that lists 8:58'
    key: bdb
    url: 'https://biblehub.com/hebrew/5186.htm'
    quote: 'c. turn, = influence, heart 2 Samuel 19:15; turn (away) heart (cause to apostatize) 1 Kings 11:2,4 (with אַחֲרֵי), 1 Kings 11:3 (absolute)'
  - where: 'section “Inclined”'
    claim: 'Scripture Helps: Solomon violated the commandment not to marry outside the covenant; some marriages were authorized and many were not; marrying outside the covenant led to his turning his heart from God'
    key: scripture-helps-2-samuel-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/24-2-samuel-11-12-1-kings-3-6-9-11?lang=eng'
    quote: 'When Solomon married “many strange women,” he violated the Lord’s commandment to not marry outside of the covenant.… While some of Solomon’s marriages were authorized by the Lord, many were not.… Solomon’s decision to marry outside of the covenant tragically led to him turning his heart away from God.'
  - where: 'section “Inclined”'
    claim: 'The Church’s footnote 33c prints the JST of 11:33: his heart is become as David his father, and he repenteth not as did David his father, that I may forgive him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: 'JST 1 Kgs. 11:33 … and his heart is become as David his father; and he repenteth not as did David his father, that I may forgive him.'
  - where: 'section “Inclined”'
    claim: 'Connection made by this page: the verb Solomon prayed for the LORD inclining Israel’s heart (8:58) is the verb for what his wives did to his (11:2–4, 9), the other way; and the king who prayed “when thou hearest, forgive” is the one of whom the JST says he did not repent that the LORD might forgive him, the condition of his own petition in 8:47'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: 'his wives turned away his heart after other gods: and his heart was not perfect with the Lord his God, as was the heart of David his father.'

  # ---------- Hearkened not ----------
  - where: 'section “Hearkened not”'
    claim: '“Hearkened not” in 12:15 and 12:16 is šāmaʿ (H8085), negated'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'שָׁמַ֥ע'
  - where: 'section “Hearkened not”'
    claim: '“Turn again” of the heart in 12:27 is wĕšāb (H7725 šûb), the verb of 8:47 (wĕhēšîbû, wĕšābû) and 8:48 (wĕšābû)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'וְ֠/שָׁב לֵ֣ב'
  - where: 'section “Hearkened not”'
    claim: 'Scripture Helps: Jeroboam feared his people would travel south to worship in the temple in Jerusalem and rejoin the Southern Kingdom, and made the calves to prevent it'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: 'Jeroboam feared that his people would travel south to worship in the temple in Jerusalem and eventually rejoin the Southern Kingdom. To prevent this, he had two golden calves made'
  - where: 'section “Hearkened not”'
    claim: 'Connection made by this page: the return Jeroboam fears (12:27) is political, the people’s heart turning back to Rehoboam, and the house is where he expects it to happen; the link to 8:47–48 is the shared verb šûb and the house as the place hearts would turn; by the end of chapter 12 a heart turning back by way of the house is what a king builds idols to prevent, so the prayer must be answered away from the house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/12?lang=eng'
    quote: 'If this people go up to do sacrifice in the house of the Lord at Jerusalem, then shall the heart of this people turn again unto their lord'

  # ---------- Where the LORD heard ----------
  - where: 'section “Where the LORD heard”'
    claim: 'šāmaʿ (H8085) occurs sixty times in fifty-six verses of 1 Kings (the dossier’s count from the WLC); with the LORD as the one hearing only at 9:3 (šāmaʿtî) and 17:22 (wayyišmaʿ YHWH)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'וַ/יִּשְׁמַ֥ע יְהוָ֖ה בְּ/ק֣וֹל אֵלִיָּ֑הוּ'
  - where: 'section “Where the LORD heard”'
    claim: 'Scripture Helps: despite the miraculous signs, Jeroboam did not repent and continued to promote idol worship'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: 'Despite witnessing miraculous signs of the Lord’s power, Jeroboam did not repent and continued to promote idol worship.'
  - where: 'section “Where the LORD heard”'
    claim: 'Scripture Helps: the widow lived in Zarephath, a Phoenician city that worshipped Baal; she was a non-Israelite; the Savior used her example to condemn His own people for their unbelief in Him'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: 'She lived in Zarephath, a Phoenician city where the people worshipped Baal and other false gods. Although she was a non-Israelite, she exercised great faith in Jehovah and His prophet Elijah. During His mortal ministry, the Savior used the widow’s example to condemn His own people for their unbelief in Him.'
  - where: 'section “Where the LORD heard”'
    claim: 'BDB: šāmaʿ bĕqôl, to hear someone’s voice, means hear (and grant)'
    key: bdb
    url: 'https://biblehub.com/hebrew/8085.htm'
    quote: 'e. בְּקוֺל ׳שׁ = hear (and grant) Genesis 30:6 (J) + 6 t.'
  - where: 'section “Where the LORD heard”'
    claim: 'The Church’s footnotes at Luke 4:25 point “widows” to 1 Kgs. 17:9 and “Elias” to 1 Kgs. 17:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/4?lang=eng'
    quote: '1 Kgs. 17:9 (1, 8–10)'
  - where: 'section “Where the LORD heard”'
    claim: 'Connection made by this page: the second and last time the narrator says the LORD heard (17:22) is for a Gentile widow in Zidon who never came to the house, which is larger than Solomon’s petition for the stranger who comes and prays toward it (8:41–43); Luke 4:24–28 records Jesus setting the widow before Nazareth and the town’s anger, and that the hearing went outside Israel to one who did not come is the page’s own reading of it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/17?lang=eng'
    quote: 'And the Lord heard the voice of Elijah; and the soul of the child came into him again, and he revived.'

  # ---------- Thou hast turned their heart back ----------
  - where: 'section “Thou hast turned their heart back”'
    claim: '“Hear me” in 18:37 is ʿănēnî, twice, H6030 ʿānâ “answer,” not šāmaʿ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'עֲנֵ֤/נִי'
  - where: 'section “Thou hast turned their heart back”'
    claim: 'BDB counts 18:37 (twice) among the places where God answers graciously “by deed,” comparing “by fire” at 18:24'
    key: bdb
    url: 'https://biblehub.com/hebrew/6030.htm'
    quote: 'b. of God answering (graciously): usually with accusative of person; by oracle 1 Samuel 14:37; 1 Samuel 28:6,15 +, figurative Habakkuk 2:11; by deed 1 Samuel 7:9; 1 Kings 18:37 (twice in verse), compare בָּאֵשׁ 1 Kings 18:24'
  - where: 'section “Thou hast turned their heart back”'
    claim: 'Keil reads “turnest back their hearts” as back from idols to the LORD'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/18.htm'
    quote: 'Hear me, Jehovah, hear me, that this people may know that Thou Jehovah art God, and turnest back their hearts!" (i.e., back from idols to Thyself.)'
  - where: 'section “Thou hast turned their heart back”'
    claim: 'The Church’s footnote 37b at “heart” points to 1 Ne. 2:16 and Alma 5:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/18?lang=eng'
    quote: '1 Ne. 2:16; Alma 5:7'
  - where: 'section “Thou hast turned their heart back”'
    claim: '“Turned back” of the heart in 18:37 is hăsibbōtā (H5437 sābab), a different verb from nāṭâ in 8:58, šûb in 8:48 and 12:27, and šûb (wĕhēšîb lēb) in Mal. 4:6'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'הֲסִבֹּ֥תָ'
  - where: 'section “Thou hast turned their heart back”'
    claim: 'Mal. 4:6 “turn the heart” is wĕhēšîb lēb, H7725 šûb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'וְ/הֵשִׁ֤יב לֵב'
  - where: 'section “Thou hast turned their heart back”'
    claim: 'Connection made by this page: 8:58 and 18:37 share no verb but a subject, the LORD who turns a heart when a man asks Him to; Mal. 4:6 is different, an errand given to Elijah with no one asking; Elijah’s prayer on Carmel asks for what Solomon asked in 8:58, and the Church’s footnote reads the turning as the LORD’s act on a heart (1 Ne. 2:16; Alma 5:7)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/18?lang=eng'
    quote: 'Hear me, O Lord, hear me, that this people may know that thou art the Lord God, and that thou hast turned their heart back again.'

  # ---------- When Ahab heard ----------
  - where: 'section “When Ahab heard”'
    claim: 'The Bible Dictionary calls Ahab the most wicked and most powerful of the kings of northern Israel'
    key: bd-ahab
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ahab?lang=eng'
    quote: 'Son of Omri, and the most wicked and most powerful of the kings of northern Israel'
  - where: 'section “When Ahab heard”'
    claim: '“When Ahab heard” in 21:27 is kišmōaʿ, H8085 šāmaʿ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'כִ/שְׁמֹ֨עַ'
  - where: 'section “When Ahab heard”'
    claim: '“Seest thou” in 21:29 is hărāʾîtā (H7200 rāʾâ), and “humbleth himself” is niknaʿ (H3665 kānaʿ, Niphal), twice'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'הֲֽ/רָאִ֔יתָ'
  - where: 'section “When Ahab heard”'
    claim: '“Humble themselves” in 2 Chr. 7:14 is wĕyikkānĕʿû, H3665 kānaʿ, followed by “then will I hear” (ʾešmaʿ, H8085) and “forgive” (wĕʾeslaḥ)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'וְ/יִכָּנְע֨וּ'
  - where: 'section “When Ahab heard”'
    claim: 'BDB lists 1 Kgs. 21:29, 2 Chr. 7:14 and 2 Kgs. 22:19 together under the Niphal of kānaʿ, “humble oneself”'
    key: bdb
    url: 'https://biblehub.com/hebrew/3665.htm'
    quote: '1 reflex. humble oneself Leviticus 26:41 (H; subject לְבָבָם), 2 Chronicles 7:14; 12:6,7 (twice in verse); 2Chronicles 12:12; 30:11; 32:26; 33:19,23; before some one, לִפְנֵי2Chronicles 34:27; מִלִּפְנֵי 1 Kings 21:29; 2Chronicles 33:12,23; 34:27; 36:12; מִמְּנֵי 1 Kings 21:29; 2 Kings 22:19.'
  - where: 'section “When Ahab heard”'
    claim: 'In 2 Kgs. 22:19 Josiah “humbled thyself” (wattikkānaʿ, H3665) and the LORD says “I also have heard thee” (šāmaʿtî, H8085)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'וַ/תִּכָּנַ֣ע'
  - where: 'section “When Ahab heard”'
    claim: 'The Student Manual: because Ahab repented, the evil was delayed until his son was king'
    key: ot-manual-5
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-5?lang=eng'
    quote: 'Verses 27 through 29 show the relationship between repentance and the consequences of sin. Because Ahab repented, the “evil” was delayed until Ahab’s son was king.'
  - where: 'section “When Ahab heard”'
    claim: 'Connection made by this page: Ahab’s humbling (21:29) is, in the same verb, the first thing named in the LORD’s answer to Solomon’s prayer in Chronicles (2 Chr. 7:14), and the LORD says He sees it; what the text records is a deferral, not “I have heard thee” (2 Kgs. 22:19), and it does not say he was forgiven; the LORD answers a king with no prophet praying for him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/21?lang=eng'
    quote: 'Seest thou how Ahab humbleth himself before me? because he humbleth himself before me, I will not bring the evil in his days: but in his son’s days will I bring the evil upon his house.'

  # ---------- Because of thy Son ----------
  - where: 'section “Because of thy Son”'
    claim: 'The Church’s footnote 4a at Alma 33:4 points to 1 Kgs. 8:47 (44–52)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/33?lang=eng'
    quote: '1 Kgs. 8:47 (44–52)'
  - where: 'section “Because of thy Son”'
    claim: 'The Church’s footnote 23a at 1 Kgs. 8:23 points to D&C 109:1 (1–80), the Kirtland dedicatory prayer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: '2 Chr. 6:14 (12–42); D&C 109:1 (1–80).'
  - where: 'section “Because of thy Son”'
    claim: 'D&C 110 records the Lord’s appearance in the Kirtland Temple on April 3, 1836'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/110?lang=eng'
    quote: 'Kirtland, Ohio, April 3, 1836'
  - where: 'section “Because of thy Son”'
    claim: 'The Church’s footnote 5a at “forgiven” (D&C 110:5) points to Luke 5:21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/110?lang=eng'
    quote: 'Luke 5:21'
  - where: 'section “Because of thy Son”'
    claim: 'The Church’s footnote 7a at “accepted” (D&C 110:7) points to 2 Chr. 7:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/110?lang=eng'
    quote: '2 Chr. 7:16'
  - where: 'section “Because of thy Son”'
    claim: 'The Church’s footnote 13b at “Elijah” (D&C 110:13) points to 1 Kgs. 17:1, Mal. 4:5, Matt. 17:3 and Luke 4:25'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/110?lang=eng'
    quote: 'Mal. 4:5 (5–6); Matt. 17:3 (1–4); Luke 4:25'
  - where: 'section “Because of thy Son”'
    claim: 'The Bible Dictionary: Jehovah is the premortal Jesus Christ, citing D&C 110:1–10 among its references'
    key: bd-jehovah
