    key: sc-knowhy-451
    url: 'https://scripturecentral.org/knowhy/why-did-some-in-lehis-time-believe-that-jerusalem-could-not-be-destroyed'
    quote: 'Many appear to have misunderstood the nature of the Lord’s covenant with David'
  - where: christ
    claim: 'Modern temples are houses built to the Lord''s name'
    key: oaks-name-1985
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1985/04/taking-upon-us-the-name-of-jesus-christ?lang=eng'
    quote: 'in modern revelations the Lord refers to temples as houses built “unto my holy name.”'
