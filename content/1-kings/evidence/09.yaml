chapter: 9
claims:
  - where: when
    claim: 'The chapter is set at the end of twenty years of building'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/9?lang=eng'
    quote: 'And it came to pass at the end of twenty years, when Solomon had built the two houses, the house of the Lord, and the king’s house,'
  - where: setting
    claim: 'The temple took seven years'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/6?lang=eng'
    quote: 'So was he seven years in building it.'
  - where: setting
    claim: 'Solomon''s own house took thirteen years'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/7?lang=eng'
    quote: 'But Solomon was building his own house thirteen years, and he finished all his house.'
  - where: setting
    claim: 'After the dedication the glory filled the temple as a cloud, and then the Lord appeared to Solomon'
    key: scripture-helps-2-samuel-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/24-2-samuel-11-12-1-kings-3-6-9-11?lang=eng'
    quote: 'the glory of the Lord appeared as a cloud that filled the temple. Following Solomon’s dedication of the temple, the Lord appeared to him'
  - where: setting
    claim: 'Solomon prayed standing before the altar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'And Solomon stood before the altar of the Lord in the presence of all the congregation of Israel, and spread forth his hands toward heaven:'
  - where: setting
    claim: 'Chronicles tells the same account (2 Chr. 7:11 onward)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/7?lang=eng'
    quote: 'Thus Solomon finished the house of the Lord, and the king’s house: and all that came into Solomon’s heart to make in the house of the Lord, and in his own house, he prosperously effected.'
  - where: setting
    claim: 'The chapter heading: Solomon reigns in splendor'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/9?lang=eng'
    quote: 'Solomon reigns in splendor, levies tribute upon the non-Israelites, and builds a navy of ships.'
  - where: thread
    claim: 'The notices are arranged to show Solomon''s resources: Hiram (10–14), tributary labour (15–25), Ophir (26–28)'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/9.htm'
    quote: 'are so arranged as to indicate the resources which enabled Solomon to erect so many and such magnificent buildings. These resources were: (1) his connection with king Hiram … (2) the tributary labour … (3) the maritime expedition to Ophir'
  - where: thread
    claim: '1 Kings 11:9 recalls the two appearances'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: 'And the Lord was angry with Solomon, because his heart was turned from the Lord God of Israel, which had appeared unto him twice,'
  - where: section 3 plain
    claim: 'The Canaanite remnant was levied as a toiling labour gang (mas ʿōbēd)'
    key: bdb
    url: 'https://biblehub.com/hebrew/4522.htm'
    quote: '1 Kings 9:21 and Solomon levied them for a toiling labour-band'
  - where: 'note 9:3 “My name, mine eyes and mine heart”'
    claim: 'The name of the Lord in temple contexts means His authority; Deut. 12:11 and the house for the name'
    key: oaks-name-1985
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1985/04/taking-upon-us-the-name-of-jesus-christ?lang=eng'
    quote: 'the Lord told them that when they entered the promised land there should be a place where the Lord their God would “cause his name to dwell.” … Time after time in succeeding revelations, the Lord and his servants referred to the future temple as a house for “the name”'
  - where: 'note 9:3 “My name, mine eyes and mine heart”'
    claim: 'Oaks: putting His name in a temple means authority for His name to be used in its ordinances'
    key: oaks-name-1985
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1985/04/taking-upon-us-the-name-of-jesus-christ?lang=eng'
    quote: 'something far more significant than a mere inscription of his sacred name on the structure. The scriptures speak of the Lord’s putting his name in a temple because he gives authority for his name to be used in the sacred ordinances of that house.'
  - where: 'note 9:3 “My name, mine eyes and mine heart”'
    claim: 'Oaks sets modern revelation''s temples and D&C 109:26 beside these'
    key: oaks-name-1985
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1985/04/taking-upon-us-the-name-of-jesus-christ?lang=eng'
    quote: 'in modern revelations the Lord refers to temples as houses built “unto my holy name.” … the Prophet Joseph Smith asked the Lord for a blessing upon “thy people upon whom thy name shall be put in this house.” (D&C 109:26.)'
  - where: 'note 9:3 “My name, mine eyes and mine heart”'
    claim: 'Scripture Helps sets Oaks''s statement beside 9:3'
    key: scripture-helps-2-samuel-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/24-2-samuel-11-12-1-kings-3-6-9-11?lang=eng'
    quote: 'Regarding the Lord’s promise that He would “put [His] name there for ever,” President Dallin H. Oaks explained:'
  - where: 'note 9:3 “My name, mine eyes and mine heart”'
    claim: 'The verse''s wording: name for ever, eyes and heart perpetually'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/9?lang=eng'
    quote: 'I have hallowed this house, which thou hast built, to put my name there for ever; and mine eyes and mine heart shall be there perpetually.'
  - where: 'note 9:3 “My name, mine eyes and mine heart”'
    claim: 'Solomon''s prayer asked that the Lord''s eyes be open toward the house where His name would be'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'That thine eyes may be open toward this house night and day, even toward the place of which thou hast said, My name shall be there'
  - where: 'note 9:6 “A house hallowed for ever, on a condition”'
    claim: 'Verse 4 addresses Solomon in the singular, measured by David''s walk; verse 6 turns to the plural'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/9?lang=eng'
    quote: 'And if thou wilt walk before me, as David thy father walked, in integrity of heart, and in uprightness'
  - where: 'note 9:6 “A house hallowed for ever, on a condition”'
    claim: 'Verse 6: ye or your children; serving other gods'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/9?lang=eng'
    quote: 'But if ye shall at all turn from following me, ye or your children, and will not keep my commandments and my statutes which I have set before you, but go and serve other gods'
  - where: 'note 9:6 “A house hallowed for ever, on a condition”'
    claim: 'Many believed the Lord would naturally protect the temple'
    key: sc-knowhy-451
    url: 'https://scripturecentral.org/knowhy/why-did-some-in-lehis-time-believe-that-jerusalem-could-not-be-destroyed'
    quote: 'because the city was God’s holy habitation on earth, the site of His house, the Temple of Jerusalem, He would naturally protect it from desecration and destruction.'
  - where: 'note 9:6 “A house hallowed for ever, on a condition”'
    claim: 'The Davidic covenant was misunderstood; its unconditional part was fulfilled in Jesus as Messiah of David''s line'
    key: sc-knowhy-451
    url: 'https://scripturecentral.org/knowhy/why-did-some-in-lehis-time-believe-that-jerusalem-could-not-be-destroyed'
    quote: 'This part of the Davidic covenant was unconditional and was ultimately fulfilled by the coming of Jesus of Nazareth as the Messiah from the lineage of David'
  - where: 'note 9:6 “A house hallowed for ever, on a condition”'
    claim: 'The promises of protection were conditional, citing 1 Kgs 6:12–13 and 9:6–7'
    key: sc-knowhy-451
    url: 'https://scripturecentral.org/knowhy/why-did-some-in-lehis-time-believe-that-jerusalem-could-not-be-destroyed'
    quote: 'But the Lord had made it clear, through his prophets, that these promises of protection were conditional, depending on the people’s obedience to God’s commandments (1 Kings 6:12–13; 9:6–7).'
  - where: 'note 9:6 “A house hallowed for ever, on a condition”'
    claim: 'Talmage: the decline began soon after Solomon''s death, with rival shrines; Jehovah withdrew His presence'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'but five years subsequent to the death of Solomon, its decline began … some worshipping on the hill-tops, others under green trees … Jehovah withdrew His protecting presence from the place no longer holy.'
  - where: 'note 9:6 “A house hallowed for ever, on a condition”'
    claim: 'Babylon burned the house of the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'And he burnt the house of the Lord, and the king’s house, and all the houses of Jerusalem'
  - where: 'note 9:8 “A house that is high”'
    claim: 'The Hebrew has ʿelyôn, high'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'עֶלְי֔וֹן'
  - where: 'note 9:8 “A house that is high”'
    claim: 'The Septuagint keeps “which is high”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_kings/9.htm'
    quote: '8And this house, which is high, shall be so that every one that passes by it shall be amazed, and shall hiss'
  - where: 'note 9:8 “A house that is high”'
    claim: 'A modern translation reads “heap of ruins”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Kings+9%3A8&version=NRSVUE'
    quote: '8 This house will become a heap of ruins; everyone passing by it will be astonished and will hiss'
  - where: 'note 9:8 “A house that is high”'
    claim: 'That reading follows the Syriac and Old Latin; the Hebrew has “will become high”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Kings+9%3A8&version=NRSVUE'
    quote: '9.8 Syr OL: Heb will become high'
  - where: 'note 9:8 “A house that is high”'
    claim: 'The lexicon marks the Hebrew of 1 Kgs 9:8 with a query and an alternative reading; the same word in Deut 26:19 and 28:1'
    key: bdb
    url: 'https://biblehub.com/hebrew/5945.htm'
    quote: 'I. עֶלְיוֺן22 adjective 1 high; — masculine singular ׳ע Deuteronomy 26:19; Deuteronomy 28:1; 1 Kings 9:8 (? reading ׳הַבַּיִת הַזֶּה הָע as ᵐ5L Benz)'
  - where: 'note 9:8 “A house that is high”'
    claim: 'One older reading: high on its hill, an example of rejection; allusion to Deut 26:19 and 28:1, blessing turned to curse; Deut 29:23–26 transferred to the temple'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/9.htm'
    quote: 'The temple stood upon a high mountain, so that its ruins could not fail to attract the attention of all who went past. The expression עליון is selected with an implied allusion to Deuteronomy 26:19 and Deuteronomy 28:1 … This blessing will be turned into a curse.'
  - where: 'note 9:8 “A house that is high”'
    claim: 'Deuteronomy''s curse is transferred to the temple'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/9.htm'
    quote: 'the curse pronounced upon Israel in Deuteronomy 29:23-26 being transferred to the temple in 1 Kings 9:8, 1 Kings 9:9'
  - where: 'note 9:8 “A house that is high”'
    claim: 'Deut 29:25 answer names the covenant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/29?lang=eng'
    quote: 'Then men shall say, Because they have forsaken the covenant of the Lord God of their fathers, which he made with them when he brought them forth out of the land of Egypt:'
  - where: 'note 9:13 “The land of Cabul”'
    claim: 'Hiram''s words and the name Cabul'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/9?lang=eng'
    quote: 'And he said, What cities are these which thou hast given me, my brother? And he called them the land of Cabul unto this day.'
  - where: 'note 9:13 “The land of Cabul”'
    claim: 'One older reading: “my brother” is a conventional address between princes; the cities were likely chiefly Canaanite and in poor condition'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/9.htm'
    quote: '"What kind of cities are these (מה in a contemptuous sense) which thou hast given me, my brother?" … as a conventional expression used by princes … they were cities occupied chiefly by a heathen population, and in all probability they were in a very bad condition.'
  - where: 'note 9:13 “The land of Cabul”'
    claim: 'Popular etymology of Cabul: as good as nothing; a town Cabul on Asher''s border'
    key: bdb
    url: 'https://biblehub.com/hebrew/3521.htm'
    quote: '2 אֶרֶץ כָּבוּל district in Galilee 1 Kings 9:13 containing 20 cities given by Solomon to Hiram (popular etymology possibly כּ as + בֻּל = בַּל not, i.e. as good as nothing'
  - where: 'note 9:13 “The land of Cabul”'
    claim: 'Cabul, a city on the border of Asher (Josh. 19:27)'
    key: bdb
    url: 'https://biblehub.com/hebrew/3521.htm'
    quote: 'כָּבוּל proper name, of a location 1. city on border of Asher Joshua 19:27'
  - where: 'note 9:13 “The land of Cabul”'
    claim: 'Chronicles: Huram restored the cities to Solomon, who built them and settled Israelites'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/8?lang=eng'
    quote: 'That the cities which Huram had restored to Solomon, Solomon built them, and caused the children of Israel to dwell there.'
  - where: 'note 9:13 “The land of Cabul”'
    claim: 'One older reading: verse 14 as pluperfect, a loan secured by the cities, repaid; the cities of 2 Chr. 8:2 are the twenty given back'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/9.htm'
    quote: '"Hiram had sent the king a hundred and twenty talents of gold." … This is no doubt to be regarded as a loan … which he probably intended to cover by ceding to him twenty cities … the latter will no doubt have repaid the amount borrowed'
  - where: 'note 9:13 “The land of Cabul”'
    claim: 'Verse 14 as the King James has it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/9?lang=eng'
    quote: 'And Hiram sent to the king sixscore talents of gold.'
  - where: 'note 9:15 “What the levy built, and what it cost”'
    claim: 'mas is a labour gang raised by levy on the people for public service, in 5:13 (Heb. 5:27) and 9:15'
    key: bdb
    url: 'https://biblehub.com/hebrew/4522.htm'
    quote: 'labour-band, labour-gang, body of task-workers for public service, formed by levy upon the people by Solomon'
  - where: 'note 9:15 “What the levy built, and what it cost”'
    claim: 'mas ʿōbēd in 9:21: a toiling labour gang'
    key: bdb
    url: 'https://biblehub.com/hebrew/4522.htm'
    quote: '1 Kings 9:21 and Solomon levied them for a toiling labour-band'
  - where: 'note 9:15 “What the levy built, and what it cost”'
    claim: 'The list of works in verse 15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/9?lang=eng'
    quote: 'And this is the reason of the levy which king Solomon raised; for to build the house of the Lord, and his own house, and Millo, and the wall of Jerusalem, and Hazor, and Megiddo, and Gezer.'
  - where: 'note 9:15 “What the levy built, and what it cost”'
    claim: 'Canaanite remnant levied a tribute of bondservice; Israelites made no bondmen'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/9?lang=eng'
    quote: 'upon those did Solomon levy a tribute of bondservice unto this day.'
  - where: 'note 9:15 “What the levy built, and what it cost”'
    claim: 'Megiddo on the caravan route from Egypt to Damascus; fortified by Solomon'
    key: bd-megiddo
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/megiddo?lang=eng'
    quote: 'On the southwestern side of the plain of Esdraelon, and on the caravan route from Egypt to Damascus. … Fortified by Solomon (1 Kgs. 9:15).'
  - where: 'note 9:15 “What the levy built, and what it cost”'
    claim: 'Solomon taxed heavily and used forced labour; resentment grew, especially in the north'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'He taxed the people heavily and used forced labor to complete his massive projects. The people began to complain, and a deep resentment, especially in the northern tribes, began to fester.'
  - where: 'note 9:24 “Pharaoh''s daughter moves out of the city of David”'
    claim: 'She was brought to the city of David until the building was finished'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/3?lang=eng'
    quote: 'took Pharaoh’s daughter, and brought her into the city of David, until he had made an end of building his own house, and the house of the Lord, and the wall of Jerusalem round about.'
  - where: 'note 9:24 “Pharaoh''s daughter moves out of the city of David”'
    claim: 'Solomon built a house for Pharaoh''s daughter (7:8)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/7?lang=eng'
    quote: 'Solomon made also an house for Pharaoh’s daughter, whom he had taken to wife, like unto this porch.'
  - where: 'note 9:24 “Pharaoh''s daughter moves out of the city of David”'
    claim: 'Chronicles gives Solomon''s reason: the places are holy where the ark had come'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/8?lang=eng'
    quote: 'My wife shall not dwell in the house of David king of Israel, because the places are holy, whereunto the ark of the Lord hath come.'
  - where: 'note 9:24 “Pharaoh''s daughter moves out of the city of David”'
    claim: 'The ark was brought up out of the city of David to the temple'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'that they might bring up the ark of the covenant of the Lord out of the city of David, which is Zion.'
  - where: 'note 9:25 “Three times in a year”'
    claim: 'Chronicles names the three feasts, according to the commandment of Moses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/8?lang=eng'
    quote: 'offering according to the commandment of Moses, on the sabbaths, and on the new moons, and on the solemn feasts, three times in the year, even in the feast of unleavened bread, and in the feast of weeks, and in the feast of tabernacles.'
  - where: 'note 9:25 “Three times in a year”'
    claim: 'The law of the three appearances in the place the Lord would choose'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/16?lang=eng'
    quote: 'Three times in a year shall all thy males appear before the Lord thy God in the place which he shall choose'
  - where: 'note 9:25 “Three times in a year”'
    claim: 'Verse 25 ends “So he finished the house”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/9?lang=eng'
    quote: 'and he burnt incense upon the altar that was before the Lord. So he finished the house.'
  - where: 'note 9:28 “Gold from Ophir”'
    claim: 'Ophir, a country of gold, probably a port of southern Arabia'
    key: bd-ophir
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ophir?lang=eng'
    quote: '(2) A country whence gold was brought, probably a port of southern Arabia (1 Kgs. 9:28; 10:11; 22:48'
  - where: 'note 9:28 “Gold from Ophir”'
    claim: 'Chronicles has 450 talents'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/8?lang=eng'
    quote: 'they went with the servants of Solomon to Ophir, and took thence four hundred and fifty talents of gold'
  - where: 'note 9:28 “Gold from Ophir”'
    claim: 'The fleet at Ezion-geber in the land of Edom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/9?lang=eng'
    quote: 'And king Solomon made a navy of ships in Ezion-geber, which is beside Eloth, on the shore of the Red sea, in the land of Edom.'
  - where: 'note 9:28 “Gold from Ophir”'
    claim: 'Job measures precious things by the gold of Ophir'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/28?lang=eng'
    quote: 'It cannot be valued with the gold of Ophir, with the precious onyx, or the sapphire.'
  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: christ
    claim: 'The name in the temple is authority for its ordinances'
    key: oaks-name-1985
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1985/04/taking-upon-us-the-name-of-jesus-christ?lang=eng'
    quote: 'because he gives authority for his name to be used in the sacred ordinances of that house.'
  - where: christ
    claim: 'Taking His name in the sacrament witnesses willingness to receive temple ordinances and blessings'
