chapter: 2
claims:
  - where: setting
    claim: 'Adonijah declared himself king, with Joab and Abiathar helping him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/1?lang=eng'
    quote: 'Then Adonijah the son of Haggith exalted himself, saying, I will be king … And he conferred with Joab the son of Zeruiah, and with Abiathar the priest: and they following Adonijah helped him.'
  - where: setting
    claim: 'Abishag cared for the aged David; Zadok anointed Solomon at Gihon; Adonijah spared on condition'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/1?lang=eng'
    quote: 'and brought him to Gihon. … And Zadok the priest took an horn of oil out of the tabernacle, and anointed Solomon. … If he will shew himself a worthy man, there shall not an hair of him fall to the earth'
  - where: setting
    claim: '1 Kings begins with David''s death around 968 BC'
    key: scripture-helps-2-samuel-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/24-2-samuel-11-12-1-kings-3-6-9-11?lang=eng'
    quote: 'Originally, 1 and 2 Kings were a single book. The division into two books occurred when the Bible was translated into Greek. The book of 1 Kings begins with the death of King David (around 968 BC)'
  - where: setting
    claim: 'Chronicles records a public assembly at which David gave the temple treasure and plans and had Solomon anointed a second time before the tribes'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'the historic gathering is recorded in 1 Chronicles 28:1–29:24. … (2) he presented a vast treasure for the temple; (3) he publicly turned over to Solomon the plans for the temple … (4) he succeeded in having Solomon crowned and anointed a second time'
  - where: thread
    claim: 'Verse 12 is a heading for what follows: Solomon established his reign by punishing the rebels and carrying out his father''s instructions'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/2.htm'
    quote: '1 Kings 2:12 is a heading embracing the substance of what follows … Solomon established his monarchy first of all by punishing the rebels, Adonijah … and his adherents … and by carrying out the final instructions of his father (vv. 36-46).'
  - where: thread
    claim: 'Verse 45 is read with verse 33: the throne established because the king does justice'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/2.htm'
    quote: '"And king Solomon will be blessed, and the throne of David be established before Jehovah for ever," namely, because the king does justice (compare the remark on 1 Kings 2:33).'
  - where: 'note 2:2 “Strong to keep the law”'
    claim: 'The plea for strength was Moses'' counsel to Joshua and the Lord''s to Joshua; it included the courage to obey the law'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'This plea for manhood and strength is a familiar Old Testament theme. It was Moses’ last counsel to Joshua (see Deuteronomy 31:6–7, 23). The Lord gave Joshua the same encouragement (see Joshua 1:5–9). … The courage to obey the law was just as much a part of the plea as to have physical courage.'
  - where: 'note 2:2 “Strong to keep the law”'
    claim: 'Moses to Joshua: Be strong and of a good courage'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/31?lang=eng'
    quote: 'And Moses called unto Joshua, and said unto him in the sight of all Israel, Be strong and of a good courage'
  - where: 'note 2:2 “Strong to keep the law”'
    claim: 'David''s charge (2:2–4) expresses the expectation that kings keep God''s commandments and so qualify for the promise of posterity on the throne; Kings says Israel fell because its kings failed'
    key: halverson-fall-of-israel
    url: 'https://interpreterfoundation.org/journal/why-did-northern-israel-fall-to-the-assyrians-a-weberian-proposal'
    quote: 'expresses in summary form the expectation that Israelite kings will keep God’s commandments and thereby qualify for God’s promises — perpetuity of their posterity as rulers in Israel.'
  - where: 'note 2:2 “Strong to keep the law”'
    claim: 'Kings says Israel fell because its kings failed to be faithful'
    key: halverson-fall-of-israel
    url: 'https://interpreterfoundation.org/journal/why-did-northern-israel-fall-to-the-assyrians-a-weberian-proposal'
    quote: 'the editors of [Page 169]Israel’s theological history claim that Israel fell precisely because the kings failed to exemplify fidelity to God.'
  - where: 'note 2:4 “A promise with a condition”'
    claim: 'David''s promise (2 Samuel 7) was unconditional'
    key: halverson-fall-of-israel
    url: 'https://interpreterfoundation.org/journal/why-did-northern-israel-fall-to-the-assyrians-a-weberian-proposal'
    quote: 'there was a significant difference from the promise that David received: David’s promise was unconditional; Jeroboam’s promise was conditional.'
  - where: 'note 2:4 “A promise with a condition”'
    claim: 'Psalm 132 adds that the earthly kingdom would endure only if the descendants were faithful; it was divided after Solomon and ended under Babylon'
    key: scripture-helps-1-samuel-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/23-1-samuel-17-18-24-26-2-samuel-5-7?lang=eng'
    quote: 'Psalm 132:11–12 adds the important qualification that David’s earthly kingdom would endure only if his descendants remained faithful to the Lord. Because of wickedness, David’s kingdom was divided after Solomon’s death … In the sixth century BC, Judah was taken captive by Babylon'
  - where: 'note 2:4 “A promise with a condition”'
    claim: 'The footnotes at 2:4 point to Psalm 132:12 and 2 Samuel 7:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/2?lang=eng'
    quote: '4a “children”: Ps. 132:12. … 4d “throne”: 2 Sam. 7:12.'
  - where: 'note 2:4 “A promise with a condition”'
    claim: 'The same words are given to Solomon in 9:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/9?lang=eng'
    quote: 'as I promised to David thy father, saying, There shall not fail thee a man upon the throne of Israel.'
  - where: 'note 2:5 “Blood of war in peace”'
    claim: 'Joab murdered the two generals in peacetime as one may slay only in war; girdle and shoes bloodied because he stabbed them while saluting'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/2.htm'
    quote: 'This was the crime therefore: that Joab had murdered the two generals in a time of peace, as one ought only to slay his opponent in time of war. Girdle and shoes, the principal features in oriental attire … were covered with blood, since Joab, while saluting them, had treacherously stabbed both'
  - where: 'note 2:5 “Blood of war in peace”'
    claim: 'David was too weak to punish Joab when Abner was murdered and could only invoke divine retribution'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/2.htm'
    quote: 'David ought to have punished these two crimes; but when Abner was murdered, he felt himself too weak to visit a man like Joab with the punishment he deserved, as he had only just been anointed king, and consequently he did nothing more than invoke divine retribution'
  - where: 'note 2:5 “Blood of war in peace”'
    claim: 'After Amasa, the rebellions had weakened David further, so he passed the punishment to his son; "according to thy wisdom" means the proper opportunity'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/2.htm'
    quote: 'And when Amasa was slain, the rebellions of Absalom and Sheba had crippled the power of David too much … he therefore transferred the punishment … to his son and successor. … Do according to thy wisdom ("mark the proper opportunity of punishing him" - Seb. Schmidt)'
  - where: 'note 2:5 “Blood of war in peace”'
    claim: 'Punishing so powerful a commander required wisdom, to avoid a rebellion in the army'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/2.htm'
    quote: 'The punishment of so powerful a man as Joab the commander-in-chief was, required great wisdom, to avoid occasioning a rebellion in the army, which was devoted to him.'
  - where: 'note 2:5 “Blood of war in peace”'
    claim: 'Joab took Abner aside in the gate to speak quietly and killed him; greeted Amasa and took him by the beard to kiss him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/3?lang=eng'
    quote: 'Joab took him aside in the gate to speak with him quietly, and smote him there under the fifth rib, that he died'
  - where: 'note 2:10 “David''s tomb and Peter''s sermon”'
    claim: 'The footnote at 2:10 points to Acts 2:29'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/2?lang=eng'
    quote: '10a “buried”: Acts 2:29.'
  - where: 'note 2:10 “David''s tomb and Peter''s sermon”'
    claim: 'Peter: David is dead and buried, his sepulchre still there; as a prophet he knew God would raise up Christ on his throne, and spoke of the resurrection of Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/2?lang=eng'
    quote: 'that he is both dead and buried, and his sepulchre is with us unto this day. Therefore being a prophet, and knowing that God had sworn with an oath to him, that of the fruit of his loins, according to the flesh, he would raise up Christ to sit on his throne;'
  - where: 'note 2:22 “Abishag and the kingdom”'
    claim: 'The wives and concubines of a dead king went to his successor; Adonijah''s request was tantamount to a claim on the throne'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: '“Amongst Eastern nations the wives and concubines of a deceased or dethroned king were taken by his successor [see 2 Samuel 12:8; 16:21–22]; and so Adonijah’s request for Abishag was regarded as tantamount to a claim on the throne”'
  - where: 'note 2:22 “Abishag and the kingdom”'
    claim: 'Bath-sheba may have seen an opportunity to rid Solomon of the threat; this was Adonijah''s second attempt'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'Perhaps she, knowing how Solomon would react, recognized an opportunity to rid Solomon of the threat that Adonijah continued to be to the throne of Israel. … this was the second time Adonijah had attempted to take the throne by subtlety.'
  - where: 'note 2:22 “Abishag and the kingdom”'
    claim: 'Adonijah''s request was treason or a plan for treason; he knew the throne was the Lord''s gift to Solomon'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'Solomon meant that Adonijah’s request was either treason or a plan to commit treason and was therefore worthy of death. (Note 1 Kings 2:15, which records that Adonijah knew that the Lord had given the throne to Solomon.)'
  - where: 'note 2:22 “Abishag and the kingdom”'
    claim: 'Abishag passed as David''s concubine; Abiathar and Joab named because they supported the rebellion and wished to rule under Adonijah; Adonijah''s words may have disarmed Bath-sheba''s suspicion'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/2.htm'
    quote: 'because these two men of high rank had supported Adonijah''s rebellion and wished to rule under his name. … Although Abishag had been only David''s nurse, in the eyes of the people she passed as his concubine … as Adonijah''s wily words had disarmed all suspicion, she may not have thought of this'
  - where: 'note 2:22 “Abishag and the kingdom”'
    claim: 'Solomon received his mother with reverence; the right hand was the place of honour'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/2.htm'
    quote: 'he received her with the reverence due to the queen-mother … The seat at the right hand of the king was the place of honour among the Israelites (cf. Psalm 110:1)'
  - where: 'note 2:22 “Abishag and the kingdom”'
    claim: 'Abishag lay in David''s bosom but he knew her not; Absalom and the concubines; the Lord gave David his master''s wives'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/1?lang=eng'
    quote: 'and let her lie in thy bosom, that my lord the king may get heat. … And the damsel was very fair, and cherished the king, and ministered to him: but the king knew her not.'
  - where: 'note 2:22 “Abishag and the kingdom”'
    claim: 'Absalom went in to his father''s concubines in the sight of all Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/16?lang=eng'
    quote: 'So they spread Absalom a tent upon the top of the house; and Absalom went in unto his father’s concubines in the sight of all Israel.'
  - where: 'note 2:27 “The word against Eli''s house”'
    claim: 'Abiathar son of Ahimelech son of Ahitub'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/22?lang=eng'
    quote: 'And one of the sons of Ahimelech the son of Ahitub, named Abiathar, escaped, and fled after David.'
  - where: 'note 2:27 “The word against Eli''s house”'
    claim: 'Ahitub, brother of I-chabod, son of Phinehas, son of Eli the priest in Shiloh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/14?lang=eng'
    quote: 'And Ahiah, the son of Ahitub, I-chabod’s brother, the son of Phinehas, the son of Eli, the Lord’s priest in Shiloh, wearing an ephod.'
  - where: 'note 2:27 “The word against Eli''s house”'
    claim: 'A double high priesthood: Abiathar of Ithamar, Zadok of Eleazar; it continued under David until Abiathar joined Adonijah'
    key: bd-zadok
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zadok?lang=eng'
    quote: 'He belonged to the family of Eleazar (1 Chr. 6:4–8). During the latter years of Saul’s reign there seems to have been a double high priesthood: Abiathar, who belonged to the family of Ithamar … This arrangement continued after David’s accession, but during the rebellion of Adonijah, Abiathar joined the rebels'
  - where: 'note 2:27 “The word against Eli''s house”'
    claim: 'Abiathar escaped Saul, brought the ark back in Absalom''s day, joined Adonijah, was thrust out'
    key: bd-abiathar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abiathar?lang=eng'
    quote: 'he escapes Saul (1 Sam. 22:20); abides with David (23:6, 9; 30:7); brings the ark back to Jerusalem (2 Sam. 15:24–36; 17:15; 19:11); takes part in Adonijah’s rebellion (1 Kgs. 1:7); is thrust out from the priesthood (2:27, 35'
  - where: 'note 2:27 “The word against Eli''s house”'
    claim: 'The prophecy to Eli: no old man in his house; a faithful priest raised up'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/2?lang=eng'
    quote: 'there shall not be an old man in thine house for ever. … And I will raise me up a faithful priest, that shall do according to that which is in mine heart and in my mind'
  - where: 'note 2:27 “The word against Eli''s house”'
    claim: 'Anathoth was among the cities given to the children of Aaron'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/21?lang=eng'
    quote: 'Which the children of Aaron, being of the families of the Kohathites, who were of the children of Levi, had … Anathoth with her suburbs, and Almon with her suburbs; four cities.'
  - where: 'note 2:28 “Joab at the altar”'
    claim: 'Joab favored Adonijah''s succession and for that reason was put to death'
    key: bd-joab
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joab?lang=eng'
    quote: 'After David’s death he was in favor of Adonijah’s succession (1 Kgs. 2:28) and for that reason was put to death by Solomon (2:29–34).'
  - where: 'note 2:28 “Joab at the altar”'
    claim: 'The law: a murderer is to be taken from the altar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/21?lang=eng'
    quote: 'But if a man come presumptuously upon his neighbour, to slay him with guile; thou shalt take him from mine altar, that he may die.'
  - where: 'note 2:28 “Joab at the altar”'
    claim: 'The footnote at 2:31 points to Deuteronomy 19:13, and at 2:33 to 2 Samuel 3:29'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/2?lang=eng'
    quote: '31a “innocent”: Deut. 19:13. … 33a “Joab”: 2 Sam. 3:29.'
  - where: 'note 2:28 “Joab at the altar”'
    claim: 'Deuteronomy 19:13: put away the guilt of innocent blood'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/19?lang=eng'
    quote: 'Thine eye shall not pity him, but thou shalt put away the guilt of innocent blood from Israel, that it may go well with thee.'
  - where: 'note 2:43 “Shimei''s oath”'
    claim: 'David swore to Shimei that he should not die'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/19?lang=eng'
    quote: 'Therefore the king said unto Shimei, Thou shalt not die. And the king sware unto him.'
  - where: christ
    claim: 'The promise of a kingdom for ever was fulfilled through Jesus Christ, a descendant of David'
    key: scripture-helps-1-samuel-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/23-1-samuel-17-18-24-26-2-samuel-5-7?lang=eng'
    quote: 'Though David’s earthly kingdom ended, the promise of a kingdom that would be established forever was ultimately fulfilled through Jesus Christ, a descendant of David.'
  - where: christ
    claim: 'The Church''s footnote at 2:4 “heart” points to D&C 64:34'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/2?lang=eng'
    quote: '4c “heart”: D&C 64:34.'
  - where: christ
    claim: 'D&C 64:34: the Lord requires the heart'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/64?lang=eng'
    quote: 'Behold, the Lord requireth the heart and a willing mind; and the willing and obedient shall eat the good of the land of Zion in these last days.'
  - where: explore
    claim: 'David''s public assembly in 1 Chronicles 28–29'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'First Kings does not record the large assemblage of government administrators and military commanders that David called together when he sensed that his death was near; however, the historic gathering is recorded in 1 Chronicles 28:1–29:24.'
