chapter: 16
claims:
  - where: setting
    claim: 'The Church''s chapter heading: Elah, Zimri, Omri and Ahab reign in wickedness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/16?lang=eng'
    quote: 'Jehu prophesies evil upon Baasha and his house—Elah, Zimri, Omri, and Ahab reign in wickedness—Zimri destroys the house of Baasha—Ahab marries Jezebel, worships Baal, and provokes the Lord to anger.'
  - where: setting
    claim: 'The northern kingdom lasted over 200 years under 19 kings'
    key: bd-israel-kingdom
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/israel-kingdom-of?lang=eng'
    quote: 'After a history of over 200 years and a series of 19 kings, the kingdom was captured by the Assyrians'
  - where: setting
    claim: 'The north soon went into apostasy and adopted Baalism despite Elijah and Amos'
    key: bd-israel-kingdom
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/israel-kingdom-of?lang=eng'
    quote: 'The northern kingdom soon went into apostasy and adopted many practices of Baalism, notwithstanding the ministries of such great prophets as Elijah and Amos.'
  - where: thread
    claim: 'Ahab''s accession was a turning point for the worse, prepared by Omri'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/16.htm'
    quote: 'The ascent of the throne of Israel by Ahab (1 Kings 16:29) formed a turning-point for the worse, though, as a comparison of 1 Kings 16:30 with 1 Kings 16:25 clearly shows, the way had already been prepared by his father Omri.'
  - where: thread
    claim: 'The marriage to Jezebel brought about the downfall of the northern kingdom'
    key: bd-jezebel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jezebel?lang=eng'
    quote: 'This marriage, more than any other single event, caused the downfall of the northern kingdom'
  - where: section 2 plain
    claim: 'The idiom of verse 11 means every male'
    key: ot-manual-4
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-4?lang=eng'
    quote: 'The Hebrew idiom originally meant “every male.”'
  - where: section 2 plain
    claim: '“Vanities” are their nothingnesses, the idols (the calves)'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/16.htm'
    quote: 'בּהבליהם, through their nothingnesses, i.e., their idols, by which the golden calves are meant.'
  - where: section 3 plain
    claim: 'The “palace of the king''s house” is the citadel of the royal palace'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/16.htm'
    quote: 'ארמון does not mean harem (Ewald), but the high castle (from ארם, to be high); here and in 2 Kings 15:25, the citadel of the royal palace'
  - where: section 5 plain
    claim: 'The grove Ahab made was an Asherah'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/16.htm'
    quote: '"And Ahab made את־האשׁרה, i.e., the Asherah belonging to the temple of Baal"'
  - where: section 5 plain
    claim: 'Rendering of verse 34: laid the foundation with his firstborn, set up the gates with his youngest'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/16.htm'
    quote: '"he laid the foundation of it with Abiram his first-born, and set up its gates with Segub his youngest, according to the word of Jehovah,"'

  - where: 'note 16:1 “Jehu the son of Hanani”'
    claim: 'Hanani the seer rebuked Asa for relying on the king of Syria'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/16?lang=eng'
    quote: 'And at that time Hanani the seer came to Asa king of Judah, and said unto him, Because thou hast relied on the king of Syria, and not relied on the Lord thy God'
  - where: 'note 16:1 “Jehu the son of Hanani”'
    claim: 'Jehu son of Hanani rebuked Jehoshaphat for helping the ungodly'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/19?lang=eng'
    quote: 'And Jehu the son of Hanani the seer went out to meet him, and said to king Jehoshaphat, Shouldest thou help the ungodly, and love them that hate the Lord?'
  - where: 'note 16:1 “Jehu the son of Hanani”'
    claim: 'Jehoshaphat''s acts were written in the book of Jehu son of Hanani'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/20?lang=eng'
    quote: 'they are written in the book of Jehu the son of Hanani, who is mentioned in the book of the kings of Israel.'

  - where: 'note 16:2 “Out of the dust and back again”'
    claim: 'Verse 2 rests on a royal formula of enthronement drawn from Gen. 3:19; from dust = raised from obscurity to royal office'
    key: sc-knowhy-715
    url: 'https://scripturecentral.org/knowhy/why-does-lehi-tell-his-sons-to-arise-from-the-dust'
    quote: 'this passage is based on a “royal formula of enthronement” based on the statement in Genesis 3:19 … “to be taken ‘from the dust’ means to be elevated from obscurity to royal office and to return to dust means to be deprived of that office and returned to obscurity.”'
  - where: 'note 16:2 “Out of the dust and back again”'
    claim: 'From dust is to enter covenant; to dust is to have the covenant voided'
    key: sc-knowhy-715
    url: 'https://scripturecentral.org/knowhy/why-does-lehi-tell-his-sons-to-arise-from-the-dust'
    quote: 'he is “accepted as a covenant-partner and treated graciously; to return to the dust means to lose that covenantal relation.” In other words, “to be ‘from dust’ is to enter covenant and to return ‘to dust’ is to have the covenant voided.”'
  - where: 'note 16:2 “Out of the dust and back again”'
    claim: 'The KnoWhy reads 1 Kgs. 16:2–3 beside Lehi''s “arise from the dust”'
    key: sc-knowhy-715
    url: 'https://scripturecentral.org/knowhy/why-does-lehi-tell-his-sons-to-arise-from-the-dust'
    quote: 'One aspect that helps us understand why Lehi focused so much on rising from the dust can be found in Israelite coronations. This theme is clearly present in the Bible, as the Lord tells Baasha'

  - where: 'note 16:4 “No grave for Baasha''s house”'
    claim: 'Being devoured instead of buried was seen as a disgrace and a sign of divine judgment, carrying into the afterlife'
    key: sc-knowhy-586
    url: 'https://scripturecentral.org/knowhy/why-were-the-unburied-dead-so-troubling-to-the-jaredites'
    quote: 'Such a fate was seen by many ancient peoples not only as a tragedy, as it would be today, but a disgrace and an indication of divine judgment. That judgment would carry over into the afterlife'
  - where: 'note 16:4 “No grave for Baasha''s house”'
    claim: 'Identity in the afterlife was bound to the tomb'
    key: sc-knowhy-586
    url: 'https://scripturecentral.org/knowhy/why-were-the-unburied-dead-so-troubling-to-the-jaredites'
    quote: '“The ideal afterlife in the Hebrew Bible was bound to the tomb …. Death was relational, and the tomb was a critical component in defining relationships and establishing the identity of the dead.”'
  - where: 'note 16:4 “No grave for Baasha''s house”'
    claim: 'Modern revelation: lack of burial does not harm spirits; the image symbolizes total annihilation'
    key: sc-knowhy-586
    url: 'https://scripturecentral.org/knowhy/why-were-the-unburied-dead-so-troubling-to-the-jaredites'
    quote: 'it is clear that a lack of burial will not have negative consequences upon departed spirits. The sad fate of these unburied Jaredites is therefore symbolic in nature, a representation of the totality of their annihilation physically, generationally, and spiritually'

  - where: 'note 16:7 “Condemned for doing what was foretold”'
    claim: 'Verse 7 is added to preclude the inference that Baasha killed Nadab''s house by divine command'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/16.htm'
    quote: 'to preclude an erroneous inference that might be drawn from the words, "I (Jehovah) have made thee prince" (1 Kings 16:2), as through Baasha had exterminated Nadab and his house by divine command'
  - where: 'note 16:7 “Condemned for doing what was foretold”'
    claim: 'The prophecy gave Baasha no right to fulfil it himself; continuing Jeroboam''s sin shows he pursued his own ends'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/16.htm'
    quote: 'the prediction of the prophet to Baasha gave him no right to put himself forward arbitrarily as the fulfiller of the prophecy. The very fact that Baasha continued Jeroboam''s sin … showed clearly enough that in exterminating the family of Jeroboam he did not act under divine direction'
  - where: 'note 16:7 “Condemned for doing what was foretold”'
    claim: 'Clarke (in the manual): God is represented as doing what His providence permits'
    key: ot-manual-4
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-4?lang=eng'
    quote: 'God is ever represented in Scripture as doing those things which, in the course of his providence, he permits to be done.'
  - where: 'note 16:7 “Condemned for doing what was foretold”'
    claim: 'Rasmussen (in the manual): Zimri was not ordained to destroy Baasha''s house; prophets can foretell what men bring on themselves'
    key: ot-manual-4
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-4?lang=eng'
    quote: 'it is not to be supposed that he was ordained of the Lord to do so. Prophets can prophesy what men will bring upon themselves without necessitating the Lord’s predestining and controlling them to make it so.'
  - where: 'note 16:7 “Condemned for doing what was foretold”'
    claim: 'Keil reads Jehu''s commanded bloodshed the same way: a commanded act becomes a crime when used as a cloak for selfish motives, shown by his keeping Jeroboam''s sins'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/1.htm'
    quote: 'when he abuses the divine command, and makes it the mere cloak for the lusts of his own evil heart. That Jehu was actuated by such motives as this, is evident enough from the verdict of the historian'
  - where: 'note 16:7 “Condemned for doing what was foretold”'
    claim: 'Baasha destroyed Jeroboam''s house according to the saying of the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/15?lang=eng'
    quote: 'he smote all the house of Jeroboam; he left not to Jeroboam any that breathed, until he had destroyed him, according unto the saying of the LORD'

  - where: 'note 16:21 “Why the north had so many coups”'
    claim: 'Of nineteen northern kings, eight were murdered in coups, one committed suicide, seven died naturally'
    key: halverson-fall-of-israel
    url: 'https://interpreterfoundation.org/journal/why-did-northern-israel-fall-to-the-assyrians-a-weberian-proposal'
    quote: 'of the nineteen kings that ruled, eight were murdered in military coups, one committed suicide, one died from injuries sustained in a fall, one was killed in battle, and one was taken into captivity. Only seven died from natural causes.'
  - where: 'note 16:21 “Why the north had so many coups”'
    claim: 'Five northern kings received prophecies of overthrow; no king of Judah did'
    key: halverson-fall-of-israel
    url: 'https://interpreterfoundation.org/journal/why-did-northern-israel-fall-to-the-assyrians-a-weberian-proposal'
    quote: 'Five of those kings had negative prophecies uttered against them, that they would be overthrown and their household destroyed. No kings of Judah had negative prophecies uttered against them that their dynasty would be overthrown.'
  - where: 'note 16:21 “Why the north had so many coups”'
    claim: 'David''s promise was unconditional, Jeroboam''s conditional'
    key: halverson-fall-of-israel
    url: 'https://interpreterfoundation.org/journal/why-did-northern-israel-fall-to-the-assyrians-a-weberian-proposal'
    quote: 'When Ahijah delivered to Jeroboam the promise of the kingdom and a dynasty, there was a significant difference from the promise that David received: David’s promise was unconditional; Jeroboam’s promise was conditional.'
  - where: 'note 16:21 “Why the north had so many coups”'
    claim: 'In Judah prophetic authority as king-maker or king-breaker was circumscribed, making for stable government'
    key: halverson-fall-of-israel
    url: 'https://interpreterfoundation.org/journal/why-did-northern-israel-fall-to-the-assyrians-a-weberian-proposal'
    quote: 'Prophetic charismatic authority still persisted, but as a force it became greatly circumscribed as a king-maker or king breaker.'
  - where: 'note 16:21 “Why the north had so many coups”'
    claim: 'Jezebel greets Jehu by Zimri''s name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/9?lang=eng'
    quote: 'And as Jehu entered in at the gate, she said, Had Zimri peace, who slew his master?'

  - where: 'note 16:24 “Omri, more than six verses”'
    claim: 'Samaria named from Shemer, built by Omri, the capital; strong hill; three-year Assyrian siege; in NT times the central district'
    key: bd-samaria
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samaria?lang=eng'
    quote: 'So called from Shemer, its first owner (1 Kgs. 16:24); a city built by Omri and made the capital of the kingdom of Israel. It occupied a strong position on a hill, and the Assyrians could not capture it until after a siege of three years'
  - where: 'note 16:24 “Omri, more than six verses”'
    claim: 'By New Testament times Samaria named the whole central district'
    key: bd-samaria
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samaria?lang=eng'
    quote: 'In New Testament times Samaria was the name of the whole of the central district of Palestine west of the Jordan.'
  - where: 'note 16:24 “Omri, more than six verses”'
    claim: 'Omri founded a strong dynasty'
    key: bd-omri
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/omri?lang=eng'
    quote: 'Captain of the host and afterwards king of Israel and founder of a strong dynasty (1 Kgs. 16:16)'
  - where: 'note 16:24 “Omri, more than six verses”'
    claim: 'Samaria remained the capital of the ten tribes until they were carried away'
    key: ot-manual-4
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-4?lang=eng'
    quote: 'The city, located six miles northwest of Shechem, remained the capital of the ten tribes until they were carried away captive.'
  - where: 'note 16:24 “Omri, more than six verses”'
    claim: 'Rasmussen (in the manual): outside sources tell more of Omri; Mesha says he conquered Moab; Assyrian annals call Israel the land of the house of Omri; alliance with Ethbaal'
    key: ot-manual-4
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-4?lang=eng'
    quote: 'Non-Biblical sources tell more about his eleven years of reign than does the Bible. … the stone inscription of Mesha, King of Moab, admits that he [Omri] conquered Moab and exacted tribute all his days.'
  - where: 'note 16:24 “Omri, more than six verses”'
    claim: 'Assyrian annals: “land of the house of Omri,” “sons of Omri” after his dynasty was replaced; alliance with Ethbaal for Ahab'
    key: ot-manual-4
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-4?lang=eng'
    quote: 'designated Israel as the ‘land of the house of Omri,’ and its kings were called in that text ‘sons of Omri’ even after his dynasty had been long replaced by another ruling family. … Omri made an alliance with Ethbaal'
  - where: 'note 16:24 “Omri, more than six verses”'
    claim: 'Samaria was the capital and residence of the kings of the ten tribes until the kingdom''s destruction'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/16.htm'
    quote: 'Samaria continued to be the capital of the kingdom of the ten tribes from that time forward, and the residence of all succeeding kings of Israel until the destruction of this kingdom'
  - where: 'note 16:24 “Omri, more than six verses”'
    claim: 'Micah charges that the statutes of Omri are kept'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/6?lang=eng'
    quote: 'For the statutes of Omri are kept, and all the works of the house of Ahab'

  - where: 'note 16:31 “Worse than Jeroboam”'
    claim: 'Jeroboam''s calves were supposed to be images of Jehovah'
    key: bd-jeroboam
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeroboam?lang=eng'
    quote: 'one of Jeroboam’s first steps after the separation was to set up image worship in Dan and Bethel, the two calves being supposed to be images of Jehovah.'
  - where: 'note 16:31 “Worse than Jeroboam”'
    claim: 'Under Ahab, through Jezebel, Baal and Asherah worship was established, and an attempt made to exterminate the prophets and worship of Jehovah'
    key: bd-ahab
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ahab?lang=eng'
    quote: 'through whose influence the worship of Baal and Asherah was established in Israel (1 Kgs. 16:32–33; 2 Kgs. 3:2); and an attempt was made to exterminate the prophets and the worship of Jehovah (1 Kgs. 18:13).'
  - where: 'note 16:31 “Worse than Jeroboam”'
    claim: 'Omri, like the kings before him, walked in the way of Jeroboam'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/16?lang=eng'
    quote: 'For he walked in all the way of Jeroboam the son of Nebat, and in his sin wherewith he made Israel to sin'

  - where: 'note 16:31 “Jezebel”'
    claim: 'Jezebel a Phoenician princess; her marriage caused the downfall of the north; she brought the worst Phoenician worship'
    key: bd-jezebel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jezebel?lang=eng'
    quote: 'A Phoenician princess, daughter of Ethbaal, king of Zidonians, and wife of Ahab, king of Israel (1 Kgs. 16:31). This marriage, more than any other single event, caused the downfall of the northern kingdom, as Jezebel introduced into Israel the worst forms of Phoenician worship in place of the worship of Jehovah'
  - where: 'note 16:31 “Jezebel”'
    claim: 'Baal was the Canaanite storm god; Elijah''s drought and the fire showed Jehovah''s power over the elements'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: '“Baal was the Canaanite storm god, associated with lightning and rain.” Yet during the contest with Elijah, no fire came when the priests of Baal called upon their false god. The priests of Baal were also powerless to prevent Elijah from causing a drought'
  - where: 'note 16:31 “Jezebel”'
    claim: 'Jehovah''s power over the elements'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: 'To further demonstrate Jehovah’s power over the elements, Elijah then helped bring about a storm that ended the drought.'

  - where: 'note 16:34 “Joshua''s word kept”'
    claim: 'Joshua''s curse concerned restoring Jericho as a fortification'
    key: ot-manual-4
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-4?lang=eng'
    quote: 'The prophecy by Joshua in Joshua 6:26 concerning Jericho referred not just to building houses there but to restoring the city as a fortification'
  - where: 'note 16:34 “Joshua''s word kept”'
    claim: 'The rebuilding is mentioned as proof of how far ungodliness had progressed; the fulfilment shows the LORD will not let His servants'' word be transgressed'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/16.htm'
    quote: 'is mentioned as a proof how far ungodliness had progressed in Israel; whilst the fulfilment of the curse upon the builder shows how the Lord will not allow the word of His servants to be transgressed with impunity.'
  - where: 'note 16:34 “Joshua''s word kept”'
    claim: 'First opinion (Clarke in the manual): the sons died in succession by God''s judgment'
    key: ot-manual-4
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-4?lang=eng'
    quote: 'his eldest son, the hope of his family, died by the hand and judgment of God, and that all his children died in succession'
  - where: 'note 16:34 “Joshua''s word kept”'
    claim: 'Second opinion: a proverbial expression for great delay'
    key: ot-manual-4
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-4?lang=eng'
    quote: 'the expression is of the proverbial kind, intimating greatly protracted labour, occasioned by multitudinous hinderances and delays.'
  - where: 'note 16:34 “Joshua''s word kept”'
    claim: 'Third opinion: he sacrificed them, countenanced by the Chaldee (Targum); the other versions do not say the children were slain'
    key: ot-manual-4
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-4?lang=eng'
    quote: 'This latter opinion seems to be countenanced by the Chaldee, which represents Hiel as slaying his first-born Abiram, and his youngest son Segub.'
  - where: 'note 16:34 “Joshua''s word kept”'
    claim: 'Other ancient versions do not say the sons were slain or died'
    key: ot-manual-4
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-4?lang=eng'
    quote: 'None of these versions [Chaldee, Vulgate, Septuagint, Syriac, or Arabic], the Chaldee excepted, intimates that the children were either slain or died'
  - where: 'note 16:34 “Joshua''s word kept”'
    claim: 'Joshua''s oath at Jericho'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/6?lang=eng'
    quote: 'he shall lay the foundation thereof in his firstborn'

  - where: christ
    claim: 'Raised from the dust: metaphor for enthronement, exaltation and resurrection, tied to covenant; Benjamin''s people called children of Christ'
    key: sc-knowhy-301
    url: 'https://scripturecentral.org/knowhy/how-did-king-benjamins-speech-lead-to-nephite-democracy'
    quote: 'The language of being raised “from the dust” was a metaphor for enthronement, exaltation and resurrection. … This elevated status was tied to the covenant made between God and the king (Psalm 89:19–39).'
  - where: christ
    claim: 'All can arise from the dust by keeping the covenants made at baptism and in the temple'
    key: sc-knowhy-715
    url: 'https://scripturecentral.org/knowhy/why-does-lehi-tell-his-sons-to-arise-from-the-dust'
    quote: 'All God’s children are invited to make and keep sacred covenants with Him, and therefore we can all “arise from the dust” as we stay true to the covenants we make at baptism and in the temple.'
  - where: christ
    claim: 'Arising from the dust by covenant receives the grace God offers those who come unto Christ'
    key: sc-knowhy-715
    url: 'https://scripturecentral.org/knowhy/why-does-lehi-tell-his-sons-to-arise-from-the-dust'
    quote: '“to come forth out of obscurity and arise from the dust as we keep our covenants with God and receive the grace and good gifts God offers those who come unto Christ.”'
