chapter: 20
claims:
  - where: when
    claim: 'The war of chapter 22 follows three years without war between Syria and Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/22?lang=eng'
    quote: 'And they continued three years without war between Syria and Israel.'
  - where: setting
    claim: 'The prophets who speak to Ahab in this chapter are unnamed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/20?lang=eng'
    quote: 'And, behold, there came a prophet unto Ahab king of Israel … And there came a man of God … And a certain man of the sons of the prophets said unto his neighbour in the word of the LORD'
  - where: setting
    claim: 'Syria is Aram, north and northeast of Israel; its people were of the same stock as the Israelites'
    key: bd-syria
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/syria?lang=eng'
    quote: 'Originally known as Aram (or “the highlands”), a general name for the country north and northeast of Palestine. The people were of Semitic origin (Gen. 10:22; 22:21) and were descended from the same stock as the Israelites.'
  - where: setting
    claim: 'Syria was a number of small kingdoms, Damascus among them, as a rule rivals of Israel'
    key: bd-syria
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/syria?lang=eng'
    quote: 'At the beginning of the Hebrew monarchy Syria was divided into a number of small kingdoms, such as Damascus (2 Sam. 8:5–6) … These kingdoms were as a rule rivals of Israel'
  - where: 'note 20:1 “Which Ben-hadad”'
    claim: 'A Ben-hadad of Damascus, son of Tabrimon, had been hired by Asa against Baasha'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/15?lang=eng'
    quote: 'king Asa sent them to Ben-hadad, the son of Tabrimon, the son of Hezion, king of Syria, that dwelt at Damascus'
  - where: setting
    claim: 'Under Ahab Israel was politically strong'
    key: bd-ahab
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ahab?lang=eng'
    quote: 'During Ahab’s reign the kingdom of Israel was politically strong.'
  - where: setting
    claim: 'Chapters 20 and 22 tell Israel''s battles with Syria; Israel won the first and lost the second'
    key: ot-manual-5
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-5?lang=eng'
    quote: 'These chapters detail two separate battles between Israel and Syria. Israel won the first battle but lost the second.'
  - where: setting
    claim: 'The Bible Dictionary calls Ahab the most wicked of the kings of northern Israel'
    key: bd-ahab
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ahab?lang=eng'
    quote: 'Son of Omri, and the most wicked and most powerful of the kings of northern Israel'
  - where: setting
    claim: 'The sentence of verse 42 is carried out in chapter 22 (footnote)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/20?lang=eng'
    quote: '42a “life”: 1 Kgs. 22:37 (34–40); 2 Kgs. 10:24.'
  - where: section 1 plain
    claim: '"Harness" means armor; "pavilions" are booths or shelters'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/20?lang=eng'
    quote: '11a “harness”: OR armor. … 12a “pavilions”: HEB booths, shelters.'
  - where: section 1 plain
    claim: 'The proverb means: do not boast of the deed until it is done'
    key: ot-manual-5
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-5?lang=eng'
    quote: 'This is like saying “Don’t boast of the deed until it is done.”'
  - where: section 2 plain
    claim: 'The young men of the princes of the provinces were servants of the provincial governors'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/20.htm'
    quote: 'Ahab then mustered his fighting men: there were 232 servants of the provincial governors'
  - where: section 2 plain
    claim: '"Numbered" may be read "mustered"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/20?lang=eng'
    quote: '15a “numbered”: OR mustered.'
  - where: section 3 plain
    claim: '"Thou doest" may be read "thou shouldest do"; "were all present" is literally "were supplied with food"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/20?lang=eng'
    quote: '22a “thou doest”: OR thou shouldest do. … 27a “were all present”: HEB were supplied with food.'
  - where: section 4 plain
    claim: '"Streets" means bazaars, trading centers'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/20?lang=eng'
    quote: '34a “streets”: IE bazaars, trading centers.'
  - where: section 5 plain
    claim: '"Ashes upon his face" is in Hebrew a headband over his eyes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/20?lang=eng'
    quote: '38a “ashes upon his face”: HEB headband over his eyes (also v. 41).'
  - where: section 5 plain
    claim: 'The word in verse 42 is ḥērem, "my ban": the man devoted to destruction'
    key: bdb
    url: 'https://biblehub.com/hebrew/2764.htm'
    quote: '2 devotion, ban; — ׳ח absolute Joshua 6:17 24t. … suffix חֶרְמִי 1 Kings 20:42; Isaiah 34:5; — thing devoted to ׳י:'
  - where: 'note 20:1 “Which Ben-hadad”'
    claim: 'Syria is Aram, whose kingdoms included Damascus'
    key: bd-syria
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/syria?lang=eng'
    quote: 'Syria was divided into a number of small kingdoms, such as Damascus (2 Sam. 8:5–6) … These kingdoms were as a rule rivals of Israel (2 Sam. 8:3–6; 1 Kgs. 11:23–25; 15:18; 20:34; 22; 2 Kgs. 6:24–7:20'
  - where: 'note 20:1 “Which Ben-hadad”'
    claim: 'The Church''s footnote at 20:2 points to the Ben-hadad of 2 Kgs. 6:24; 15:18 names Ben-hadad son of Tabrimon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/20?lang=eng'
    quote: '2a “Ben-hadad”: 2 Kgs. 6:24.'
  - where: 'note 20:28 “God of the hills and of the valleys”'
    claim: 'Ancient Near Eastern peoples spoke of gods ruling a particular land and active only in their own territory; Jephthah spoke so'
    key: sc-knowhy-874
    url: 'https://scripturecentral.org/knowhy/why-does-god-s-throne-have-wheels-in-ezekiel'
    quote: 'Most people in the ancient Near East spoke of various gods ruling over a specific land, nation, or similar geographical location. … people spoke of deities only being active in their own “territory.”'
  - where: 'note 20:28 “God of the hills and of the valleys”'
    claim: 'Naaman asked for Israelite earth because he thought the LORD could only be worshipped on Israelite soil'
    key: sc-knowhy-874
    url: 'https://scripturecentral.org/knowhy/why-does-god-s-throne-have-wheels-in-ezekiel'
    quote: 'Naaman believed the God of the Israelites could only be worshipped on Israelite soil, and he therefore asked for a two-mule load of Israelite dirt to take with him'
  - where: 'note 20:28 “God of the hills and of the valleys”'
    claim: 'Jehovah is God over all the earth, not of the hills only'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: 'The Syrians may have believed that the Lord’s power was limited to the hills and mountains because He had visited the Israelites at Sinai. … the scriptures make it clear that Jehovah is God “over all the earth.”'
  - where: 'note 20:28 “God of the hills and of the valleys”'
    claim: 'The man of God gives the Syrians'' words as the reason for the victory'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/20?lang=eng'
    quote: 'Because the Syrians have said, The LORD is God of the hills, but he is not God of the valleys, therefore will I deliver all this great multitude into thine hand, and ye shall know that I am the LORD.'
  - where: 'note 20:30 “A hundred thousand in one day”'
    claim: 'The Hebrew word for "thousand" in verses 29–30 is ʾelep'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'אֶ֛לֶף'
  - where: 'note 20:30 “A hundred thousand in one day”'
    claim: 'ʾeleph can mean family, clan or a military unit, and without vowels looks like ʾalluph, chieftain or commander'
    key: ot-manual-large-numbers
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/enrichment-section-e-the-problem-of-large-numbers-in-the-old-testament?lang=eng'
    quote: '’eleph is the ordinary word for ‘thousand’, but it can also be used in a variety of other senses: e.g. ‘family’ … or ‘clan’ … or perhaps a military unit. ’alluph is used for the ‘chieftains’ of Edom'
  - where: 'note 20:30 “A hundred thousand in one day”'
    claim: 'The word for professional soldier has in places been misread as "thousand"'
    key: ot-manual-large-numbers
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/enrichment-section-e-the-problem-of-large-numbers-in-the-old-testament?lang=eng'
    quote: 'It seems clear that in a number of places the word for professional soldier has been misunderstood as meaning ‘thousand’.'
  - where: 'note 20:30 “A hundred thousand in one day”'
    claim: 'On this proposal 1 Kgs. 20:27–30 counts 100 and 27 soldiers'
    key: ot-manual-large-numbers
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/enrichment-section-e-the-problem-of-large-numbers-in-the-old-testament?lang=eng'
    quote: 'In 1 Kings 20:27–30, the little Israelite army killed 100 (not 100,000) foot-soldiers, and the wall of Aphek killed 27 (not 27,000) more.'
  - where: 'note 20:30 “A hundred thousand in one day”'
    claim: 'The victory was promised by the LORD before the battle (verse 28), to an army like two little flocks of kids (verse 27)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/20?lang=eng'
    quote: 'pitched before them like two little flocks of kids; but the Syrians filled the country.'
  - where: 'note 20:34 “A treaty with the king of Syria”'
    claim: '"Merciful kings" uses ḥesed in the sense of kindness to the lowly, needy and miserable'
    key: bdb
    url: 'https://biblehub.com/hebrew/2617.htm'
    quote: '2 kindness (especially as extended to the lowly, needy and miserable), mercy … ׳מַלְכֵּי ח merciful kings 1 Kings 20:31'
  - where: 'note 20:34 “A treaty with the king of Syria”'
    claim: 'Ahab later went against Syria and died in battle'
    key: bd-ahab
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ahab?lang=eng'
    quote: 'Ahab then made an alliance with Jehoshaphat, king of Judah, against Syria and was killed while attempting to capture Ramoth-gilead (1 Kgs. 22; 2 Chr. 18).'
  - where: 'note 20:34 “A treaty with the king of Syria”'
    claim: 'The terms of the treaty and the trading quarters'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/20?lang=eng'
    quote: 'The cities, which my father took from thy father, I will restore; and thou shalt make streets for thee in Damascus, as my father made in Samaria. … 34a “streets”: IE bazaars, trading centers.'
  - where: 'note 20:36 “The man who would not strike”'
    claim: 'The refusal was disobedience to a revelation; the death warns as in 1 Kings 13:24'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/20.htm'
    quote: 'This occurrence shows with how severe a punishment all opposition to the commandments of God to the prophets was followed, as a warning for others; just as in the similar occurrence in 1 Kings 13:24.'
  - where: 'note 20:36 “The man who would not strike”'
    claim: 'The wound was meant to show Ahab symbolically what to expect from Ben-hadad, not merely to look like a returning soldier'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/20.htm'
    quote: 'nor merely to assume the deceptive appearance of a warrior returning from the battle (Thenius), but to show to Ahab symbolically what he had to expect from Benhadad whom he had released'
  - where: 'note 20:36 “The man who would not strike”'
    claim: 'The request came in the word of the LORD; the refusal is called disobedience'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/20?lang=eng'
    quote: 'Because thou hast not obeyed the voice of the LORD, behold, as soon as thou art departed from me, a lion shall slay thee.'
  - where: 'note 20:40 “A king sentences himself”'
    claim: 'Like Nathan with David, the prophet used a symbolic action that led the king to pronounce sentence on himself'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/20.htm'
    quote: 'as Nathan had formerly done in the case of David (2 Samuel 12:1.), by means of a symbolical action, whereby the king was led to pronounce sentence upon himself.'
  - where: 'note 20:40 “A king sentences himself”'
    claim: 'The Hebrew behind "ashes" is a headband over the eyes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/20?lang=eng'
    quote: '38a “ashes upon his face”: HEB headband over his eyes (also v. 41).'
  - where: 'note 20:40 “A king sentences himself”'
    claim: 'The biblical disguise stories include Saul at Endor, this prophet, Ahab in his last battle, Josiah, and Jeroboam''s wife'
    key: sc-knowhy-310
    url: 'https://scripturecentral.org/knowhy/why-did-abinadi-use-a-disguise'
    quote: '(1) King Saul disguising himself … (2) a prophet disguising himself in order to condemn King Ahab for not executing a Syrian King (1 Kings 20), (3) an Israelite king disguising himself to avoid harm in battle, only to be slain by an archer (1 Kings 22), (4) Josiah'
  - where: 'note 20:40 “A king sentences himself”'
    claim: 'In the disguise stories the disguise is penetrated and God''s will comes in a form unacceptable to the one seeking it'
    key: sc-knowhy-310
    url: 'https://scripturecentral.org/knowhy/why-did-abinadi-use-a-disguise'
    quote: 'one of the parties disguises himself (or in one case herself), but the disguise is penetrated, and God’s will is conveyed in a form which is liable to be quite unacceptable to the one seeking it.'
  - where: 'note 20:40 “A king sentences himself”'
    claim: 'The terms of the story and Ahab''s judgment'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/20?lang=eng'
    quote: 'Keep this man: if by any means he be missing, then shall thy life be for his life, or else thou shalt pay a talent of silver. … So shall thy judgment be; thyself hast decided it.'
  - where: 'note 20:42 “The man of the LORD’s ban”'
    claim: '"Appointed to utter destruction" is ḥermî, "my ḥērem," a thing devoted to the LORD'
    key: bdb
    url: 'https://biblehub.com/hebrew/2764.htm'
    quote: '2 devotion, ban; — ׳ח absolute Joshua 6:17 24t. … suffix חֶרְמִי 1 Kings 20:42; Isaiah 34:5; — thing devoted to ׳י:'
  - where: 'note 20:42 “The man of the LORD’s ban”'
    claim: 'The Hebrew of verse 42 has חרמי'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'חֶרְמִ֖/י'
  - where: 'note 20:42 “The man of the LORD’s ban”'
    claim: 'No captives under the ḥērem; the enemy king was executed after the battle; keeping him alive was keeping a captive'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'there were not supposed to be captives in the first place. … The one exception to this was the enemy king; some passages mention kings being captured and brought to the commander for ritual execution … to keep the king alive afterward … was tantamount to keeping captives.'
  - where: 'note 20:42 “The man of the LORD’s ban”'
    claim: 'Achan, Saul and Ahab are parallel breaches of the ḥērem that brought terrible consequences'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'There is a parallel between Achan’s retention of spoils from Jericho (Joshua 7), Saul’s failure to kill the best of the livestock and King Agag … and Ahab of Israel’s failure to kill the Aramaean king Ben-Hadad (1 Kings 20), each of these being instances of transgression of the ḥērem that bring terrible consequences.'
  - where: 'note 20:42 “The man of the LORD’s ban”'
    claim: 'Ahab spared Ben-hadad in a situation like Saul''s, resulting in his death at Syrian hands'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'This would be similar to Ahab’s failure to kill the Syrian king Ben-Hadad in a similar situation (1 Kings 20:42), resulting in Ahab’s later death at the hand of the Syrians (1 Kings 22).'
  - where: 'note 20:42 “The man of the LORD’s ban”'
    claim: 'The prophecy was fulfilled in the next battle; Ahab''s reward for failing to slay Ben-hadad as commanded'
    key: ot-manual-5
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-5?lang=eng'
    quote: 'The prophecy was fulfilled in the next battle with the Syrians (see 1 Kings 22:34–35). That was his reward for failing to slay Ben-hadad as the Lord had commanded.'
  - where: 'note 20:42 “The man of the LORD’s ban”'
    claim: 'The Church''s footnote at verse 42 points to Ahab''s death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/20?lang=eng'
    quote: '42a “life”: 1 Kgs. 22:37 (34–40); 2 Kgs. 10:24.'
  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: christ
    claim: 'The wheels of God''s throne in Ezekiel taught the exiles that God was still with them wherever they went'
    key: sc-knowhy-874
    url: 'https://scripturecentral.org/knowhy/why-does-god-s-throne-have-wheels-in-ezekiel'
    quote: 'The wheels are likely symbolic, teaching Ezekiel and those in exile, that God was still with them, no matter where they traveled in the world.'
  - where: christ
    claim: 'The KnoWhy sets 1 Kgs. 20:23 beside the territorial view it uses for Ezekiel''s wheels'
    key: sc-knowhy-874
    url: 'https://scripturecentral.org/knowhy/why-does-god-s-throne-have-wheels-in-ezekiel'
    quote: '1 Kings 20 reflects this idea as well.'
