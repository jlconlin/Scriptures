chapter: 1
claims:
  - where: setting
    claim: 'The Jews counted Kings as one book; the Greek divided Samuel and Kings into two parts each, and the English follows'
    key: bd-kings-books-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/kings-books-of?lang=eng'
    quote: 'Regarded by the Jews as forming one book. The Greek version divided the book of Samuel and the book of Kings each into two parts, calling the four portions the four books of the Kings. The Latin and English versions have followed the division'
  - where: setting
    claim: 'The history runs from Adonijah''s rebellion to the final captivity of Judah, with the whole history of the northern kingdom'
    key: bd-kings-books-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/kings-books-of?lang=eng'
    quote: 'The books of Kings narrate the history from the rebellion of Adonijah to the final captivity of Judah, including the whole history of the northern kingdom from the separation till its disappearance in 721 B.C.'
  - where: setting
    claim: 'The writer is unknown and compiled the history from written documents'
    key: bd-kings-books-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/kings-books-of?lang=eng'
    quote: 'The books were compiled by some unknown writer from a variety of written documents, including the state chronicles.'
  - where: setting
    claim: 'More than four hundred years, from David''s death to Jehoiachin'
    key: ot-seminary-1-kings-intro
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-kings?lang=eng'
    quote: 'The books of 1 and 2 Kings cover more than 400 years of Israelite history, starting with the death of King David (approximately 1015 B.C.) and concluding with the death of King Jehoiachin'
  - where: setting
    claim: 'When and where Kings was written is unknown'
    key: ot-seminary-1-kings-intro
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-kings?lang=eng'
    quote: 'It is unclear when and where the books of 1 and 2 Kings were written.'
  - where: setting
    claim: 'The chronicles of the kings of Israel were records kept under the kings'' direction, not the books of Chronicles'
    key: ot-seminary-1-kings-intro
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-kings?lang=eng'
    quote: 'The state chronicles were not the books of 1 and 2 Chronicles but rather a collection of records maintained under the direction of the kings of Israel.'
  - where: setting
    claim: 'The writer names the book of the acts of Solomon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: 'are they not written in the book of the acts of Solomon?'
  - where: setting
    claim: 'The writer names the book of the chronicles of the kings of Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/14?lang=eng'
    quote: 'behold, they are written in the book of the chronicles of the kings of Israel.'
  - where: setting
    claim: 'The brass plates held a record of the Jews'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/5?lang=eng'
    quote: 'And also a record of the Jews from the beginning, even down to the commencement of the reign of Zedekiah, king of Judah;'
  - where: setting
    claim: 'The record of the Jews on the brass plates likely included Samuel and Kings'
    key: sc-knowhy-410
    url: 'https://scripturecentral.org/knowhy/what-parts-of-the-old-testament-were-on-the-plates-of-brass'
    quote: 'The “record of the Jews” was likely Joshua, Judges, 1–2 Samuel, and 1–2 Kings.'
  - where: setting
    claim: 'Nathan''s sentence on David''s house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/12?lang=eng'
    quote: 'Now therefore the sword shall never depart from thine house'
  - where: thread
    claim: 'Adonijah''s claim rested on primogeniture and public acclaim, with officials and brothers'
    key: hudson-irregular-kings
    url: 'https://interpreterfoundation.org/journal/irregular-kings-and-precious-things-viewing-nephi-and-joseph-smith-through-the-lens-of-ancient-near-eastern-kingship'
    quote: 'Adonijah, for example, attempted to force the issue of succession based on his primogeniture and public acclaim, including the support of many of the court officials and nearly all of his brothers.'
  - where: thread
    claim: 'One older reading: the promise to David''s seed is the thread of Kings, and Solomon received the kingdom notwithstanding Adonijah'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/1.htm'
    quote: 'This thoroughly glorious promise forms the red thread which runs through the history of the kings from Solomon to the Babylonian captivity … notwithstanding the usurpation of the throne attempted by Adonijah, Solomon received the whole of his father''s kingdom, as the seed of David promised by the Lord'
  - where: thread
    claim: 'The LORD had chosen Solomon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/28?lang=eng'
    quote: 'he hath chosen Solomon my son to sit upon the throne of the kingdom of the Lord over Israel.'

  - where: 'note 1:4 “Abishag and the failing king”'
    claim: 'David''s age and weakness persuaded Adonijah it was time to show himself the heir'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'David’s old age and feeble condition (see 1 Kings 1:1–4) evidently convinced Adonijah that it was time to show the people that he was the successor to the throne.'
  - where: 'note 1:4 “Abishag and the failing king”'
    claim: 'On one reading, marrying Abishag would burnish Adonijah''s claim to the royal line'
    key: hudson-irregular-kings
    url: 'https://interpreterfoundation.org/journal/irregular-kings-and-precious-things-viewing-nephi-and-joseph-smith-through-the-lens-of-ancient-near-eastern-kingship'
    quote: 'When Adonijah apparently tried to burnish his claim to royal affiliation by marrying David’s young wife, Abishag, Solomon had him killed (see 1 Kings 2:16–25).'
  - where: 'note 1:4 “Abishag and the failing king”'
    claim: 'Solomon hears a claim to the kingdom in the request for Abishag'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/2?lang=eng'
    quote: 'And why dost thou ask Abishag the Shunammite for Adonijah? ask for him the kingdom also; for he is mine elder brother'

  - where: 'note 1:5 “Adonijah''s claim”'
    claim: 'Adonijah, the fourth son, was probably the eldest living; Chileab most likely died young'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/1.htm'
    quote: 'Although he was David''s fourth son (2 Samuel 3:4), yet after the death of Ammon and Absalom he was probably the eldest, as Chileab, David''s second son, had most likely died when a child, since he is never mentioned again.'
  - where: 'note 1:5 “Adonijah''s claim”'
    claim: 'He equipped himself as Absalom had; state carriages and an escort, not war chariots'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/1.htm'
    quote: 'procured chariots and horsemen and fifty runners, as Absalom had done before (2 Samuel 15:1). רכב, in a collective sense, does not mean fighting or war chariots, but state carriages … riders to form an escort whenever he drove out.'
  - where: 'note 1:5 “Adonijah''s claim”'
    claim: 'One older reading: the LORD reserved the choice of king to Himself (Deut. 17:15), for Saul, David and Solomon'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/1.htm'
    quote: 'But in Israel, Jehovah, the God-King of His people, had reserved to Himself the choice of the earthly king (Deuteronomy 17:15), and this right He exercised not only in the case of Saul and David, but in that of Solomon also.'
  - where: 'note 1:5 “Adonijah''s claim”'
    claim: 'In the ancient Near East a kingdom was expected to pass to the eldest son; the Bible often shows younger sons overturning it'
    key: hudson-irregular-kings
    url: 'https://interpreterfoundation.org/journal/irregular-kings-and-precious-things-viewing-nephi-and-joseph-smith-through-the-lens-of-ancient-near-eastern-kingship'
    quote: 'there was an expectation that, in the regular course of events, a kingdom would be passed from the reigning king to his eldest son. … Jacob, Joseph, David, and others are shown overturning the clearly established expectation for the eldest son to lead.'
  - where: 'note 1:5 “Adonijah''s claim”'
    claim: 'Adonijah pressed his claim as eldest with acclaim, officials and brothers; Solomon''s rested on divine election, royal prerogative, younger son'
    key: hudson-irregular-kings
    url: 'https://interpreterfoundation.org/journal/irregular-kings-and-precious-things-viewing-nephi-and-joseph-smith-through-the-lens-of-ancient-near-eastern-kingship'
    quote: 'Adonijah, for example, attempted to force the issue of succession based on his primogeniture and public acclaim, including the support of many of the court officials and nearly all of his brothers. Solomon, on the other hand, made use of the apologetic elements of Divine Election, Royal Prerogative, and Younger Son.'
  - where: 'note 1:5 “Adonijah''s claim”'
    claim: 'Adonijah was David''s fourth son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/3?lang=eng'
    quote: 'And the fourth, Adonijah the son of Haggith'
  - where: 'note 1:5 “Adonijah''s claim”'
    claim: 'Absalom''s chariots and fifty runners'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/15?lang=eng'
    quote: 'Absalom prepared him chariots and horses, and fifty men to run before him.'

  - where: 'note 1:6 “A father who never asked why”'
    claim: 'David''s family feuds ended in rebellion in Absalom and Adonijah, read as fulfilling Nathan''s word'
    key: bd-david
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/david?lang=eng'
    quote: 'There were constant family feuds, which, in the case of Absalom and Adonijah, ended in open rebellion. These incidents are a fulfillment of the pronouncement of Nathan the prophet upon David, because of his sin (2 Sam. 12:7–13).'
  - where: 'note 1:6 “A father who never asked why”'
    claim: 'Nathan''s sentence'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/12?lang=eng'
    quote: 'Now therefore the sword shall never depart from thine house'

  - where: 'note 1:8 “Two parties at court”'
    claim: 'Joab, generally faithful, favored Adonijah and was put to death by Solomon'
    key: bd-joab
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joab?lang=eng'
    quote: 'He was closely associated with all the chief events of David’s reign and was generally faithful to his master. After David’s death he was in favor of Adonijah’s succession (1 Kgs. 2:28) and for that reason was put to death by Solomon'
  - where: 'note 1:8 “Two parties at court”'
    claim: 'Abiathar escaped Saul, stayed with David, and joined Adonijah'
    key: bd-abiathar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abiathar?lang=eng'
    quote: 'he escapes Saul (1 Sam. 22:20); abides with David (23:6, 9; 30:7); brings the ark back to Jerusalem (2 Sam. 15:24–36; 17:15; 19:11); takes part in Adonijah’s rebellion (1 Kgs. 1:7)'
  - where: 'note 1:8 “Two parties at court”'
    claim: 'Abiathar escaped the slaughter of the priests'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/22?lang=eng'
    quote: 'And one of the sons of Ahimelech the son of Ahitub, named Abiathar, escaped, and fled after David.'
  - where: 'note 1:8 “Two parties at court”'
    claim: 'A double high priesthood: Abiathar with David, Zadok at Gibeon where the tabernacle stood'
    key: bd-zadok
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zadok?lang=eng'
    quote: 'During the latter years of Saul’s reign there seems to have been a double high priesthood: Abiathar, who belonged to the family of Ithamar, officiating in David’s camp, and Zadok at Gibeon, where the tabernacle was standing.'
  - where: 'note 1:8 “Two parties at court”'
    claim: 'In the rebellion Abiathar joined the rebels, Zadok stayed faithful, anointed Solomon and replaced Abiathar'
    key: bd-zadok
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zadok?lang=eng'
    quote: 'during the rebellion of Adonijah, Abiathar joined the rebels, while Zadok remained faithful to David (1 Kgs. 1:8, 26). He anointed Solomon (1:32–45); and was finally put in the room of Abiathar.'
  - where: 'note 1:8 “Two parties at court”'
    claim: 'Only Zadok''s descendants held the high priesthood from Solomon to the Hellenistic period'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'Only direct descendants of Zadok served as high priests from Solomon until the Hellenistic Period, when Greek kings in Syria controlled the region.'
  - where: 'note 1:8 “Two parties at court”'
    claim: 'Benaiah was over the Cherethites and Pelethites'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/8?lang=eng'
    quote: 'And Benaiah the son of Jehoiada was over both the Cherethites and the Pelethites'

  - where: 'note 1:17 “The oath David had sworn”'
    claim: 'The promise was to a seed yet to come from David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/7?lang=eng'
    quote: 'I will set up thy seed after thee, which shall proceed out of thy bowels, and I will establish his kingdom.'
  - where: 'note 1:17 “The oath David had sworn”'
    claim: 'The LORD loved Solomon and named him Jedidiah through Nathan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/12?lang=eng'
    quote: 'And he sent by the hand of Nathan the prophet; and he called his name Jedidiah, because of the LORD.'
  - where: 'note 1:17 “The oath David had sworn”'
    claim: 'Chronicles: a son named Solomon promised'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/22?lang=eng'
    quote: 'Behold, a son shall be born to thee, who shall be a man of rest; and I will give him rest from all his enemies round about: for his name shall be Solomon'
  - where: 'note 1:17 “The oath David had sworn”'
    claim: 'Chronicles: the LORD chose Solomon of all David''s sons'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/28?lang=eng'
    quote: 'And of all my sons, (for the Lord hath given me many sons,) he hath chosen Solomon my son to sit upon the throne of the kingdom of the Lord over Israel.'
  - where: 'note 1:17 “The oath David had sworn”'
    claim: 'Adonijah concedes the kingdom was Solomon''s from the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/2?lang=eng'
    quote: 'howbeit the kingdom is turned about, and is become my brother’s: for it was his from the LORD.'
  - where: 'note 1:17 “The oath David had sworn”'
    claim: 'Nathan rebuked David over Bathsheba and anointed Solomon'
    key: bd-nathan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nathan?lang=eng'
    quote: 'rebukes him about Bathsheba (2 Sam. 12; Ps. 51 heading); anoints Solomon (1 Kgs. 1:38–39, 45'

  - where: 'note 1:33 “The king''s own mule”'
    claim: 'One older reading: riding the king''s own animal marked a man as his successor'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/1.htm'
    quote: 'When the king let any one ride upon the animal on which he generally rode himself, this was a sign that he was his successor upon the throne.'
  - where: 'note 1:33 “The king''s own mule”'
    claim: 'David meant the people to see Solomon was his and the Lord''s choice; done at once, in the form of a king''s triumphal entry'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'To clearly show the people that Solomon was David’s choice and the Lord’s, David commanded that the inauguration of his co-regent take place immediately. … in the traditional way that a king made his triumphal entry into a city'
  - where: 'note 1:33 “The king''s own mule”'
    claim: 'Solomon was co-regent; they ruled together until David died'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'When David learned that Adonijah sought to take the throne, he quickly appointed Solomon as co-regent. They ruled together until David died.'
  - where: 'note 1:33 “The king''s own mule”'
    claim: 'Chronicles: Solomon made king the second time'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/29?lang=eng'
    quote: 'And they made Solomon the son of David king the second time, and anointed him unto the Lord to be the chief governor'

  - where: 'note 1:39 “The holy oil and the anointing”'
    claim: 'Kings were anointed to their office by the prophets'
    key: bd-anoint
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/anoint?lang=eng'
    quote: 'Kings were anointed to their office by the prophets (1 Sam. 10:1; 16:13; 2 Sam. 5:3; 1 Kgs. 1:39'
  - where: 'note 1:39 “The holy oil and the anointing”'
    claim: 'The holy anointing oil was olive oil and spices, restricted to set ceremonies'
    key: bd-anoint
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/anoint?lang=eng'
    quote: 'The holy anointing oil used in the law of Moses was composed of olive oil mixed with spices and was to be restricted in use to certain specified ceremonies (Ex. 30:22–33; 37:29).'
  - where: 'note 1:39 “The holy oil and the anointing”'
    claim: 'Nathan anointed Solomon'
    key: bd-nathan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nathan?lang=eng'
    quote: 'anoints Solomon (1 Kgs. 1:38–39, 45'
  - where: 'note 1:39 “The holy oil and the anointing”'
    claim: 'The LORD anoints the king; a priest performs it as His proxy (1 Kgs. 1:39 cited)'
    key: sc-knowhy-642
    url: 'https://scripturecentral.org/knowhy/why-does-the-psalmist-speak-about-grasping-gods-hand'
    quote: 'The Lord says in Psalm 89 that it is He who anoints the king, though it is clear in other texts that this was actually carried out by a priestly proxy (see 1 Samuel 16:1; 1 Kings 1:39).'

  - where: 'note 1:50 “Adonijah at the altar”'
    claim: 'The horns of the altar were at times a refuge for fugitives'
    key: bd-altar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/altar?lang=eng'
    quote: 'At times these horns were also a place of refuge for fugitives (1 Kgs. 1:50; 2:28).'
  - where: 'note 1:50 “Adonijah at the altar”'
    claim: 'The law took a guileful killer from the altar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/21?lang=eng'
    quote: 'But if a man come presumptuously upon his neighbour, to slay him with guile; thou shalt take him from mine altar, that he may die.'
  - where: 'note 1:50 “Adonijah at the altar”'
    claim: 'Solomon''s oath that Adonijah spoke against his own life'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/2?lang=eng'
    quote: 'if Adonijah have not spoken this word against his own life.'

  - where: christ
    claim: 'Messiah means the anointed, the awaited King and Deliverer; Christ is the Greek equivalent'
    key: bd-messiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/messiah?lang=eng'
    quote: 'An Aramaic word meaning “the anointed.” … Used as the title of an office, it denotes the King and Deliverer whose coming the Jews were eagerly expecting. In the New Testament the deliverer is called the Christ, which is the Greek equivalent of Messiah'
  - where: christ
    claim: 'Solomon''s procession at the foot of the Mount of Olives set beside Jesus'' entry'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'King Solomon also rode his donkey at the base of the Mount of Olives, where he was anointed king over Israel (1 Kgs 1:32–37). … Similarly, Jesus’s followers held a procession for him as he rode a donkey from the Mount of Olives to the east gate of Jerusalem'
  - where: christ
    claim: 'The Lord God gives Jesus the throne of David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'and the Lord God shall give unto him the throne of his father David:'
