chapter: 15
claims:
  - where: setting
    claim: 'Asa was the third king of Judah; his reign is told in 1 Kgs. 15–16 and 2 Chr. 14–16'
    key: bd-asa
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/asa?lang=eng'
    quote: 'Third king of Judah; the history of his reign is told in 1 Kgs. 15–16 and 2 Chr. 14–16.'
  - where: setting
    claim: 'Asa strengthened the army, rebuilt fortresses, and led a covenant to seek Jehovah'
    key: bd-asa
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/asa?lang=eng'
    quote: 'He raised the army to a state of efficiency, threw off the Egyptian yoke, and rebuilt the fortresses destroyed by Sheshonk. … and at a national assembly invited the people to make a covenant to seek Jehovah.'
  - where: setting
    claim: 'Chronicles names the prophets Azariah and Hanani in Asa''s reign; Kings refers the rest to the chronicles'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/16?lang=eng'
    quote: 'And at that time Hanani the seer came to Asa king of Judah, and said unto him, Because thou hast relied on the king of Syria, and not relied on the Lord thy God'

  - where: thread
    claim: 'Kings of Israel who did evil were measured against the poor standard set by Jeroboam'
    key: scripture-helps-2-samuel-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/24-2-samuel-11-12-1-kings-3-6-9-11?lang=eng'
    quote: 'In subsequent generations, the kings of Israel who did evil were often measured against the poor standard set by Jeroboam.'

  - where: 'note 15:3 “The measure of every king”'
    claim: 'Jeroboam was promised the Lord''s presence on condition of obedience, led his people into idolatry, and became the poor standard for Israel''s evil kings'
    key: scripture-helps-2-samuel-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/24-2-samuel-11-12-1-kings-3-6-9-11?lang=eng'
    quote: 'The Lord promised Jeroboam that He would be with him if Jeroboam kept the commandments during his reign. Unfortunately, Jeroboam did not keep the commandments and led his people into idolatry. … the kings of Israel who did evil were often measured against the poor standard set by Jeroboam.'
  - where: 'note 15:3 “The measure of every king”'
    claim: 'Mormon relies on the royal “walk/not walk in the ways of X” formula of Israel''s historians'
    key: bowen-putting-down-priests
    url: 'https://interpreterfoundation.org/journal/putting-down-the-priests-a-note-on-royal-evaluations-wehisbit-and-priestly-purges-in-2-kings-235-and-mosiah-115'
    quote: 'Mormon’s adaption and use of ancient Israelite historiographic conventions is evident in his reliance on the royal “walk/not walk in the ways of X” formula'
  - where: 'note 15:3 “The measure of every king”'
    claim: 'Noah “did not walk in the ways of his father” is a negative royal evaluation; Moroni uses the formula of Shez'
    key: bowen-putting-down-priests
    url: 'https://interpreterfoundation.org/journal/putting-down-the-priests-a-note-on-royal-evaluations-wehisbit-and-priestly-purges-in-2-kings-235-and-mosiah-115'
    quote: 'The statement that Noah “did not walk in the ways of his father” levies an immediate and distinctly negative evaluation of h[Page 109]im as a king'
  - where: 'note 15:3 “The measure of every king”'
    claim: 'The rest of Noah''s narrative fleshes out the verdict'
    key: bowen-putting-down-priests
    url: 'https://interpreterfoundation.org/journal/putting-down-the-priests-a-note-on-royal-evaluations-wehisbit-and-priestly-purges-in-2-kings-235-and-mosiah-115'
    quote: 'the rest of Mormon’s King Noah narrative and every mention of him thereafter can be seen, more or less, as a fleshing out of this statement.'
  - where: 'note 15:3 “The measure of every king”'
    claim: 'Bowen holds that Mormon had royal annals on the brass plates'
    key: bowen-putting-down-priests
    url: 'https://interpreterfoundation.org/journal/putting-down-the-priests-a-note-on-royal-evaluations-wehisbit-and-priestly-purges-in-2-kings-235-and-mosiah-115'
    quote: 'Mormon almost certainly had access to royal annals and other historical/chronological material on the Brass Plates of Laban, such as became a part of the biblical history.'
  - where: 'note 15:3 “The measure of every king”'
    claim: 'JST 15:3 and 15:11 read “as the Lord commanded David his father” and “as he commanded David his father”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/15?lang=eng'
    quote: 'JST 1 Kgs. 15:3 … as the Lord commanded David his father.'
  - where: 'note 15:3 “The measure of every king”'
    claim: 'Nyman: chapter 15 has four verses changed regarding David; verse 3 modifies the comparison with David'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'Chapter 15 also has four verses changed regarding the character of David. In verse 3, the KJV compares King Abijam of Judah with David. … The JST modifies the last phrase to read, “As the Lord commanded David his father.”'

  - where: 'note 15:5 “Save only in the matter of Uriah”'
    claim: 'JST 15:5 manuscript wording'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/84'
    quote: 'because David did right in the eyes of the Lord, and turned not aside from all that he commanded him, to sin against the Lord; but repented of the evil all the days of his life, save only in the matter of Uriah the Hittite, wherein the Lord cursed him,'
  - where: 'note 15:5 “Save only in the matter of Uriah”'
    claim: 'JST 15:5 confirms D&C 132:39 and fits David''s period of repentance'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'However, verse 5 in the JST confirms the teachings of the Doctrine and Covenants (132:39) concerning David. It also makes the verse compatible with the period of David’s repentance.'
  - where: 'note 15:5 “Save only in the matter of Uriah”'
    claim: 'D&C 132:39: David did not sin save in the case of Uriah, and fell from his exaltation; the footnote at 15:5 points there'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/132?lang=eng'
    quote: 'in none of these things did he sin against me save in the case of Uriah and his wife; and, therefore he hath fallen from his exaltation, and received his portion'

  - where: 'note 15:12 “The sodomites”'
    claim: 'Hebrew qᵉdēšîm in 15:12'
    key: oshb-wlc
    url: 'https://biblehub.com/hebrew/6945.htm'
    quote: 'Temple prostitute, cult prostitute, male shrine prostitute'
  - where: 'note 15:12 “The sodomites”'
    claim: 'BDB: qādēš is a male temple prostitute; it occurs in Deut. 23 (KJV 23:17), 1 Kgs. 14:24, 22 (KJV 22:46), 15:12, 2 Kgs. 23:7'
    key: bdb
    url: 'https://biblehub.com/hebrew/6945.htm'
    quote: 'noun masculine temple-prostitute (man) … Deuteronomy 23:18; collective 1 Kings 14:24; 1 Kings 22:47; plural קְדֵשִׁים 1 Kings 15:12; 2 Kings 23:7'
  - where: 'note 15:12 “The sodomites”'
    claim: 'JST 15:11–12 adds “and it pleased the Lord” after Asa''s removal of the sodomites and idols'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/84'
    quote: 'and he took away the Sodomites out of the Land, and remooved all the Idols that his fathers had made, and it pleased the Lord.'
  - where: 'note 15:12 “The sodomites”'
    claim: 'Nyman: the JST adds “and it pleased the Lord” to Asa''s removal of the idols'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'Verse 12 states that Asa removed the idols of the land, and the JST adds “and it pleased the Lord.”'

  - where: 'note 15:13 “Maachah the queen mother”'
    claim: 'Hebrew gᵉbîrâ and mipleṣet in 15:13'
    key: oshb-wlc
    url: 'https://biblehub.com/hebrew/1377.htm'
    quote: 'Queen, Mistress, Lady'
  - where: 'note 15:13 “Maachah the queen mother”'
    claim: 'BDB: gᵉbîrâ in 15:13 is queen-mother; he removed her from the position of queen-mother'
    key: bdb
    url: 'https://biblehub.com/hebrew/1377.htm'
    quote: '2 queen-mother, 1 Kings 15:13 2Chronicles 15:16; ׳וַיְסִרֶהָ מִגּ he removed her from (the position of) queen-mother'
  - where: 'note 15:13 “Maachah the queen mother”'
    claim: 'BDB: mipleṣet is a horrid thing, an abominable object of idolatry not precisely known'
    key: bdb
    url: 'https://biblehub.com/hebrew/4656.htm'
    quote: 'noun feminine horrid thing (thing to shudder at); — … (of some abominable object of idolatry, not precisely known)'
  - where: 'note 15:13 “Maachah the queen mother”'
    claim: 'Keil: Asa deposed his grandmother Maacah'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/15.htm'
    quote: 'deposed his grandmother Maacah from the rank of a queen, because she had made herself an idol for the Ashera'
  - where: 'note 15:13 “Maachah the queen mother”'
    claim: 'The Church footnote at 15:13: the grove is Asherah, a Canaanite goddess (also supports section 2 plain, “the goddess Asherah”)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/15?lang=eng'
    quote: 'IE for Asherah (Canaanite goddess).'

  - where: 'note 15:14 “A heart perfect with the LORD”'
    claim: 'Hebrew šālēm in 15:3 (and 15:14)'
    key: oshb-wlc
    url: 'https://biblehub.com/hebrew/8003.htm'
    quote: 'Complete, whole, full, perfect, at peace'
  - where: 'note 15:14 “A heart perfect with the LORD”'
    claim: 'BDB: a heart šālēm with the LORD is a mind at peace with him, keeping covenant relation; listed at 1 Kgs. 8:61; 11:4; 15:3, 14; 2 Chr. 16:9'
    key: bdb
    url: 'https://biblehub.com/hebrew/8003.htm'
    quote: 'a mind at peace with ׳י, keeping covt. relation, hence complete, perfect, 1 Kings 8:61; 1 Kings 11:4; 1 Kings 15:3,14; with אֶל2Chronicles 16:9'
  - where: 'note 15:14 “A heart perfect with the LORD”'
    claim: 'Keil: the high places here were unlawful altars to Jehovah, not idol altars; Asa could not carry their abolition through, which resolves the apparent discrepancy with 2 Chr. 14'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/15.htm'
    quote: 'By the בּמות we are not to understand, according to 1 Kings 15:12, altars of high places dedicated to idols, but unlawful altars to Jehovah.'
  - where: 'note 15:14 “A heart perfect with the LORD”'
    claim: 'Keil: the apparent discrepancy with 2 Chronicles 14 is solved if the kings abolished the altars but did not carry their reforms in the nation thoroughly out'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/15.htm'
    quote: 'The apparent discrepancy between the last-mentioned passages and 2 Chronicles 14:2, 2 Chronicles 14:4, and 2 Chronicles 17:6, may be solved very simply on the supposition that the kings (Asa and Jehoshaphat) did indeed abolish the altars on the high places, but did not carry their reforms in the nation thoroughly out'
  - where: 'note 15:14 “A heart perfect with the LORD”'
    claim: 'Chronicles says the high places were not taken away out of Israel in Asa''s reign'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/15?lang=eng'
    quote: 'But the high places were not taken away out of Israel'
  - where: 'note 15:19 “Break thy league with Baasha”'
    claim: 'Hanani: the Lord shows himself strong for those whose heart is perfect toward him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/16?lang=eng'
    quote: 'For the eyes of the Lord run to and fro throughout the whole earth, to shew himself strong in the behalf of them whose heart is perfect toward him.'

  - where: 'note 15:19 “Break thy league with Baasha”'
    claim: 'Ramah was on the frontier and on the road to Jerusalem, scene of conflicts between Israel and Judah'
    key: bd-ramah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ramah?lang=eng'
    quote: 'in Benjamin, on the border of Ephraim … Being on the frontier and on the road to Jerusalem, it was the scene of several conflicts between Israel and Judah (1 Kgs. 15:17, 21–22; 2 Chr. 16:1, 5–6).'
  - where: 'note 15:19 “Break thy league with Baasha”'
    claim: 'Hanani rebuked Asa for relying on Syria rather than the Lord; Asa imprisoned him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/16?lang=eng'
    quote: 'Herein thou hast done foolishly: therefore from henceforth thou shalt have wars.'
  - where: 'note 15:23 “Diseased in his feet”'
    claim: 'Chronicles dates the disease to the 39th year, says it became exceeding great, and that Asa sought physicians rather than the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/16?lang=eng'
    quote: 'And Asa in the thirty and ninth year of his reign was diseased in his feet, until his disease was exceeding great: yet in his disease he sought not to the Lord, but to the physicians.'

  - where: 'note 15:29 “According unto the saying of the LORD”'
    claim: 'The footnote at 15:29 points to Ahijah''s prophecy at 14:10; 16:7 gives the word against Baasha'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/16?lang=eng'
    quote: 'even for all the evil that he did in the sight of the Lord, in provoking him to anger with the work of his hands, in being like the house of Jeroboam; and because he killed him.'
  - where: 'note 15:29 “According unto the saying of the LORD”'
    claim: 'Halverson: the north rested on conditional covenants and prophetic designation; David''s promise was unconditional'
    key: halverson-fall-of-israel
    url: 'https://interpreterfoundation.org/journal/why-did-northern-israel-fall-to-the-assyrians-a-weberian-proposal'
    quote: 'the Northern Kingdom of Israel was established on conditional covenants and the charismatic double barrel of prophetic pronouncement (in the person of Ahijah) and judge-like military leadership (Jeroboam).'
  - where: 'note 15:29 “According unto the saying of the LORD”'
    claim: 'Halverson: David''s promise was unconditional, Jeroboam''s conditional'
    key: halverson-fall-of-israel
    url: 'https://interpreterfoundation.org/journal/why-did-northern-israel-fall-to-the-assyrians-a-weberian-proposal'
    quote: 'David’s promise was unconditional; Jeroboam’s promise was conditional.'
  - where: 'note 15:29 “According unto the saying of the LORD”'
    claim: 'Halverson: of nineteen northern kings eight were murdered in coups, only seven died naturally; no Judahite king had a prophecy that his dynasty would be overthrown'
    key: halverson-fall-of-israel
    url: 'https://interpreterfoundation.org/journal/why-did-northern-israel-fall-to-the-assyrians-a-weberian-proposal'
    quote: 'of the nineteen kings that ruled, eight were murdered in military coups, one committed suicide, one died from injuries sustained in a fall, one was killed in battle, and one was taken into captivity. Only seven died from natural causes.'
  - where: 'note 15:29 “According unto the saying of the LORD”'
    claim: 'Halverson: five northern kings had negative prophecies of overthrow; none in Judah'
    key: halverson-fall-of-israel
    url: 'https://interpreterfoundation.org/journal/why-did-northern-israel-fall-to-the-assyrians-a-weberian-proposal'
    quote: 'Five of those kings had negative prophecies uttered against them, that they would be overthrown and their household destroyed. No kings of Judah had negative prophecies uttered against them that their dynasty would be overthrown.'

  - where: christ
    claim: 'Hanani''s words on the perfect heart; the Lord at Kirtland as he who liveth and was slain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/16?lang=eng'
    quote: 'For the eyes of the Lord run to and fro throughout the whole earth, to shew himself strong in the behalf of them whose heart is perfect toward him.'
  - where: christ
    claim: 'JST 15:5: David repented of the evil all the days of his life'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/84'
    quote: 'but repented of the evil all the days of his life, save only in the matter of Uriah the Hittite'
