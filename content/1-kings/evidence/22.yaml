chapter: 22
claims:
  - where: 'when'
    claim: 'The text dates the chapter: the third year without war; Ahaziah began in the seventeenth year of Jehoshaphat'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/22?lang=eng'
    quote: 'Ahaziah the son of Ahab began to reign over Israel in Samaria the seventeenth year of Jehoshaphat king of Judah, and reigned two years over Israel.'

  - where: 'setting'
    claim: 'The three years count from the end of the war of chapter 20'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/22.htm'
    quote: 'The length of time given here points back to the end of the war described in 1 Kings 20.'
  - where: 'setting'
    claim: 'Ramoth was a city the king of Syria had kept and ought to have given up under the peace of 20:34'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/22.htm'
    quote: 'Ahab then said to his servants that the king of Syria had kept the city of Ramoth in Gilead (probably situated on the site of the present Szalt: see at Deuteronomy 4:43), which he ought to have given up, according to the conditions of the peace in 1 Kings 20:34'
  - where: 'setting'
    claim: 'Israel and Syria allied against Assyria, were defeated by Shalmaneser III; then Ahab allied with Jehoshaphat against Syria and was killed at Ramoth-gilead'
    key: bd-ahab
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ahab?lang=eng'
    quote: 'Israel and Syria made an alliance for the purpose of opposing Assyria. We learn from Assyrian inscriptions that the united forces were defeated by Shalmaneser Ⅲ, and Ahab then made an alliance with Jehoshaphat, king of Judah, against Syria and was killed while attempting to capture Ramoth-gilead'
  - where: 'setting'
    claim: 'Chronicles tells the same story'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/18?lang=eng'
    quote: 'Jehoshaphat of Judah joins Ahab of Israel to fight Syria—Ahab’s false…'

  - where: 'thread'
    claim: 'The chapter heading: Ahab’s prophets foretell success, Micaiah foretells his death, Ahab is slain and dogs lick his blood'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/22?lang=eng'
    quote: 'Ahab’s prophets foretell success—Micaiah foretells the defeat and death of Ahab—Ahab is slain and dogs lick up his blood'

  - where: 'section 5 plain'
    claim: 'The sodomites of verse 46 are cultic male prostitutes (the Church’s footnote)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/22?lang=eng'
    quote: '“sodomites”: IE cultic male prostitutes.'
  - where: 'section 4 plain'
    claim: 'Verse 38: the harlots bathed at the pool (the Hebrew; see the note at verse 38)'
    key: bdb
    url: 'https://biblehub.com/hebrew/7364.htm'
    quote: '2 intransitive wash, bathe (oneself): Exodus 2:5 (E), 2 Samuel 11:2; 2 Samuel 12:20; 1 Kings 22:38'
  - where: 'section 4 plain'
    claim: 'Verse 35: the king was propped up in his chariot (the Church’s footnote)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/22?lang=eng'
    quote: '“stayed up”: IE propped up.'
  - where: 'section 2 plain'
    claim: 'Verse 10: the void place is a threshing floor (the Church’s footnote)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/22?lang=eng'
    quote: '“void place”: HEB threshing floor.'

  - where: 'note 22:4 “Judah''s king in Ahab''s war”'
    claim: 'Chronicles: Jehoshaphat joined affinity with Ahab; the footnote explains it as an alliance by marriage'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/18?lang=eng'
    quote: '“joined affinity”: IE allied himself by marriage.'
  - where: 'note 22:4 “Judah''s king in Ahab''s war”'
    claim: 'Jehoshaphat’s son Jehoram married Ahab’s daughter and walked in the way of Ahab’s house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/8?lang=eng'
    quote: 'And he walked in the way of the kings of Israel, as did the house of Ahab: for the daughter of Ahab was his wife: and he did evil in the sight of the LORD.'
  - where: 'note 22:4 “Judah''s king in Ahab''s war”'
    claim: 'Jehu the son of Hanani rebuked Jehoshaphat for helping the ungodly'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/19?lang=eng'
    quote: 'And Jehu the son of Hanani the seer went out to meet him, and said to king Jehoshaphat, Shouldest thou help the ungodly, and love them that hate the Lord? therefore is wrath upon thee from before the Lord.'
  - where: 'note 22:4 “Judah''s king in Ahab''s war”'
    claim: 'The Bible Dictionary: in close alliance with Israel’s kings, yet a true worshipper of Jehovah and a reformer'
    key: bd-jehoshaphat
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehoshaphat?lang=eng'
    quote: 'King of Judah, in close alliance with kings of Israel, but still a true worshipper of Jehovah and a religious reformer'

  - where: 'note 22:7 “Four hundred prophets and one more”'
    claim: 'The four hundred were not prophets of Baal: Zedekiah says Thus saith Jehovah and claims the spirit of Jehovah'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/1_kings/22.htm'
    quote: 'These cannot have been the prophets of Baal, for their ringleader, Zedekiah, in 1 Kings 22:11, begins his speech, ‘Thus saith Jehovah,’ and in 1 Kings 22:24 speaks of ‘the spirit of Jehovah’ as being with him.'
  - where: 'note 22:7 “Four hundred prophets and one more”'
    claim: 'Their answer did not satisfy Jehoshaphat, who wanted a true prophet of Jehovah'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/1_kings/22.htm'
    quote: 'Besides what he has heard, he would gladly be told what to do by a true prophet of Jehovah. These men and their answer did not quite satisfy him.'
  - where: 'note 22:7 “Four hundred prophets and one more”'
    claim: 'Ahab’s prophets said whatever the king wanted to hear'
    key: halverson-path
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/path-angels'
    quote: 'Ahab gathers together his hundreds of prophets, who all predict success. However, these prophets are afflicted with a lying spirit—they say whatever the king wants to hear.'

  - where: 'note 22:15 “Micaiah''s first answer”'
    claim: 'The Student Manual: “Go and prosper” was said with great sarcasm, hence the king’s response in verse 16'
    key: ot-manual-5
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-5?lang=eng'
    quote: 'The words of Micaiah in verse 15, “Go and prosper,” were said with great sarcasm. It is as though Micaiah said: “All your false prophets have predicted success. You want me to do the same, so I will: ‘Go and prosper.’”'
  - where: 'note 22:15 “Micaiah''s first answer”'
    claim: 'The manual ties verse 16 to the sarcasm of verse 15'
    key: ot-manual-5
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-5?lang=eng'
    quote: 'This was said scornfully to let King Ahab know that it was contrary to Micaiah’s true advice. Hence the King’s response in verse 16.'
  - where: 'note 22:15 “Micaiah''s first answer”'
    claim: 'A teaching article: Micaiah sarcastically said what Ahab wanted to hear'
    key: bartholomew-follow-prophet
    url: 'https://rsc.byu.edu/vol-9-no-1-2008/follow-prophet-eight-principles-1-2-kings'
    quote: 'When Micaiah was summoned, he sarcastically said what King Ahab wanted to hear (see 1 Kings 22:15).'

  - where: 'note 22:19 “Micaiah in the council of the LORD”'
    claim: 'Scripture Helps: Micaiah described the vision to convey the authority of his message; it is the divine council'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: 'To convey the authority of his message, Micaiah described a vision he had of “the Lord sitting on his throne, and all the host of heaven standing by him” (1 Kings 22:19). This is a description of what biblical scholars call the divine council'
  - where: 'note 22:19 “Micaiah in the council of the LORD”'
    claim: 'Prophets were made privy to the council of God, citing this passage and Jer. 23:18'
    key: sc-knowhy-17
    url: 'https://scripturecentral.org/knowhy/how-did-god-call-his-prophets-in-ancient-times'
    quote: 'They are made privy to the council of God (1 Kings 22:19-23; Jeremiah 23:18), where they read a judgment scroll (Ezekiel 2:10), and, at great personal cost, are called to deliver God’s message to their people'
  - where: 'note 22:19 “Micaiah in the council of the LORD”'
    claim: 'Admission to the heavenly council marked true prophets'
    key: sc-knowhy-17
    url: 'https://scripturecentral.org/knowhy/how-did-god-call-his-prophets-in-ancient-times'
    quote: 'true prophets (including Lehi and Nephi) in ancient Israel were admitted into the heavenly council and saw God or other heavenly beings and received divine assignments or access to heavenly knowledge.'
  - where: 'note 22:19 “Micaiah in the council of the LORD”'
    claim: 'Lehi’s call follows the pattern: he ascended into the heavenly council (1 Ne. 1:8) and learned of judgments against Jerusalem'
    key: sc-knowhy-17
    url: 'https://scripturecentral.org/knowhy/how-did-god-call-his-prophets-in-ancient-times'
    quote: 'Lehi experienced such a call: he pled with God for his people (1 Nephi 1:6), ascended into the heavenly council (1 Nephi 1:8), and learned of impending judgments of God against Jerusalem'
  - where: 'note 22:19 “Micaiah in the council of the LORD”'
    claim: 'Micaiah risked his life to report the council’s decree of Ahab’s death'
    key: halverson-path
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/path-angels'
    quote: 'Micaiah risks his life by sharing the message decreed in God’s heavenly council of Ahab’s physical destruction: Ahab would die in battle.'
  - where: 'note 22:19 “Micaiah in the council of the LORD”'
    claim: 'Jeremiah: had they stood in my counsel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/23?lang=eng'
    quote: 'But if they had stood in my counsel, and had caused my people to hear my words, then they should have turned them from their evil way, and from the evil of their doings.'

  - where: 'note 22:22 “Did the LORD put a lying spirit in them?”'
    claim: 'The JST of 2 Chr. 18:22 reads found; its heading: the Lord does not put a lying spirit into the mouths of prophets'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-2-chr/18?lang=eng'
    quote: 'The Lord does not put a lying spirit into the mouths of prophets. … Now therefore, behold, the Lord hath found a lying spirit in the mouth of these thy prophets, and the Lord hath spoken evil against thee.'
  - where: 'note 22:22 “Did the LORD put a lying spirit in them?”'
    claim: 'The JST of 2 Chr. 18:21 adds: for all these have sinned against me'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/18?lang=eng'
    quote: 'for all these have sinned against me.'
  - where: 'note 22:22 “Did the LORD put a lying spirit in them?”'
    claim: 'The footnotes at 1 Kgs. 22:22 point to the JST of 2 Chr. 18:22'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/22?lang=eng'
    quote: '“lying”: See JST 2 Chr. 18:22 (2 Chr. 18:22 note a). Isa. 19:14 (11–14).'
  - where: 'note 22:22 “Did the LORD put a lying spirit in them?”'
    claim: 'Scripture Helps: the JST clarifies the Lord found a lying spirit among Ahab’s prophets rather than put one in them'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: 'The Joseph Smith Translation of 2 Chronicles 18:20–22 clarifies that the Lord found a lying spirit among Ahab’s prophets rather than put a lying spirit in them.'
  - where: 'note 22:22 “Did the LORD put a lying spirit in them?”'
    claim: 'Scripture Helps: unclear why the Kings passage was not altered; God cannot lie (Ether 3:12)'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: 'It is unclear why Joseph Smith did not alter the same passage in 1 Kings 22:23. However, the scriptures clearly teach that God is “a God of truth, and [cannot] lie” (Ether 3:12'
  - where: 'note 22:22 “Did the LORD put a lying spirit in them?”'
    claim: 'The Student Manual relays Clarke: the Lord permitted a lying spirit; scripture represents God as doing what He permits'
    key: ot-manual-5
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-5?lang=eng'
    quote: 'The Lord does not place a lying spirit in anyone. As Clarke explained, the Hebrew expression means that the Lord “hath permitted or suffered a lying spirit to influence thy prophets. Is it requisite again to remind the reader that the Scriptures repeatedly represent God as doing what, in the course of his providence, he only permits or suffers to be done?'
  - where: 'note 22:22 “Did the LORD put a lying spirit in them?”'
    claim: 'The prophets said whatever the king wanted to hear'
    key: halverson-path
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/path-angels'
    quote: 'these prophets are afflicted with a lying spirit—they say whatever the king wants to hear.'

  - where: 'note 22:30 “A king in disguise”'
    claim: 'Biblical disguise stories include Saul at Endor, the prophet of 1 Kgs. 20, and the king slain by an archer in 1 Kgs. 22'
    key: sc-knowhy-310
    url: 'https://scripturecentral.org/knowhy/why-did-abinadi-use-a-disguise'
    quote: '(1) King Saul disguising himself in order to receive guidance from the witch of Endor (1 Samuel 28), (2) a prophet disguising himself in order to condemn King Ahab for not executing a Syrian King (1 Kings 20), (3) an Israelite king disguising himself to avoid harm in battle, only to be slain by an archer (1 Kings 22)'
  - where: 'note 22:30 “A king in disguise”'
    claim: 'In these stories the disguise is penetrated and God’s will is conveyed'
    key: sc-knowhy-310
    url: 'https://scripturecentral.org/knowhy/why-did-abinadi-use-a-disguise'
    quote: 'one of the parties disguises himself (or in one case herself), but the disguise is penetrated, and God’s will is conveyed in a form which is liable to be quite unacceptable to the one seeking it.'
  - where: 'note 22:30 “A king in disguise”'
    claim: 'The kings or their heirs die and the dynasty fails; Abinadi’s disguise read against these stories'
    key: sc-knowhy-310
    url: 'https://scripturecentral.org/knowhy/why-did-abinadi-use-a-disguise'
    quote: 'All of the kings or their heirs in the biblical disguise stories meet with brutal deaths, and in each case the dynasty fails.'
  - where: 'note 22:30 “A king in disguise”'
    claim: 'The Hebrew of “at a venture” is lᵉtummô'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'תֻמּ֔'
  - where: 'note 22:30 “A king in disguise”'
    claim: 'BDB: tōm, innocence, simplicity; at 1 Kgs. 22:34, without definite aim'
    key: bdb
    url: 'https://biblehub.com/hebrew/8537.htm'
    quote: '2 innocence, simplicity: הלכים לתמם 2 Samuel 15:11; מֶשַׁךְ בַּקֶּשֶׁת לְתֻמּוֺ 1 Kings 22:34 2Chronicles 18:33, i.e. without definite aim.'

  - where: 'note 22:38 “Where the harlots bathed”'
    claim: 'The Hebrew of verse 38 has zōnôt, harlots'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'זֹּנ֖וֹת'
  - where: 'note 22:38 “Where the harlots bathed”'
    claim: 'Strong’s: once regarded as military equipment (hence armour), but evidently the feminine plural participle of zanah, harlots'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/2185.htm'
    quote: 'Regarded by some as if from zuwn or an unused root, and applied to military equipments; but evidently the feminine plural active participle of zanah; harlots -- armour.'
  - where: 'note 22:38 “Where the harlots bathed”'
    claim: 'BDB: rāḥaṣ intransitive, bathe oneself, at 1 Kgs. 22:38'
    key: bdb
    url: 'https://biblehub.com/hebrew/7364.htm'
    quote: '2 intransitive wash, bathe (oneself): Exodus 2:5 (E), 2 Samuel 11:2; 2 Samuel 12:20; 1 Kings 22:38'
  - where: 'note 22:38 “Where the harlots bathed”'
    claim: 'The King James “armour” at 1 Kgs. 22:38 is a mistranslation'
    key: sc-knowhy-745
    url: 'https://scripturecentral.org/knowhy/what-kind-of-armor-did-the-nephites-use'
    quote: 'There are several Hebrew words translated as “armor” in the KJV that can alternately mean vessels (1 Samuel 14:1) … In one instance, it is a mistranslation (1 Kings 22:38).'
  - where: 'note 22:38 “Where the harlots bathed”'
    claim: 'The harlots were bathing in the pool; the word of 21:19 and 20:42 fulfilled; a sign of contempt'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/22.htm'
    quote: 'In this way was the word of the Lord through Elijah (1 Kings 21:19) and the unknown prophet (1 Kings 20:42) fulfilled … is mentioned as a sign of the ignominious contempt which was heaped upon him at his death.'

  - where: 'note 22:48 “Ships that never sailed”'
    claim: 'Chronicles: Jehoshaphat joined with Ahaziah to build the ships; Eliezer prophesied; the ships were broken'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/20?lang=eng'
    quote: 'Then Eliezer the son of Dodavah of Mareshah prophesied against Jehoshaphat, saying, Because thou hast joined thyself with Ahaziah, the Lord hath broken thy works. And the ships were broken, that they were not able to go to Tarshish.'
  - where: 'note 22:48 “Ships that never sailed”'
    claim: 'The footnote sets Ezion-geber beside Solomon’s fleet (1 Kgs. 9:26)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/22?lang=eng'
    quote: '“Ezion-geber”: Num. 33:36; 1 Kgs. 9:26.'

  - where: 'christ'
    claim: 'Jesus saw the multitudes as sheep having no shepherd'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/9?lang=eng'
    quote: 'But when he saw the multitudes, he was moved with compassion on them, because they fainted, and were scattered abroad, as sheep having no shepherd.'
  - where: 'christ'
    claim: 'The good shepherd gives his life for the sheep'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/10?lang=eng'
    quote: 'I am the good shepherd: the good shepherd giveth his life for the sheep.'
  - where: 'christ'
    claim: 'The Topical Guide, under Shepherd, sets 1 Kgs. 22:17 beside Num. 27:17 and lists Matt. 9:36 and John 10:11 in the same entry'
    key: tg-shepherd
    url: 'https://www.churchofjesuschrist.org/study/scriptures/tg/shepherd?lang=eng'
    quote: 'be not as sheep which have no shepherd, Num. 27:17 (1 Kgs. 22:17'
  - where: 'christ'
    claim: 'From 1 Kgs. 22: a prophet’s role is not to agree with us but to warn against evil paths'
    key: bartholomew-follow-prophet
    url: 'https://rsc.byu.edu/vol-9-no-1-2008/follow-prophet-eight-principles-1-2-kings'
    quote: 'It is not the role of our prophets to agree with us—especially when the path we are pursuing could lead to our moral or spiritual destruction. It is the prophet’s responsibility and privilege to warn us against evil paths we might be tempted to pursue.'
  - where: 'christ'
    claim: 'President Lee, quoted there: receive the prophet’s word as if from the Lord’s own mouth (D&C 21:4–5), though it may not be liked'
    key: bartholomew-follow-prophet
    url: 'https://rsc.byu.edu/vol-9-no-1-2008/follow-prophet-eight-principles-1-2-kings'
    quote: 'You may not like what comes from the authority of the Church.'
