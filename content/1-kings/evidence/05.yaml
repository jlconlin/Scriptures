chapter: 5
claims:
  - where: when
    claim: 'The building of the temple began in the fourth year of Solomon''s reign'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/6?lang=eng'
    quote: 'in the fourth year of Solomon’s reign over Israel, in the month Zif, which is the second month, that he began to build the house of the Lord.'
  - where: setting
    claim: 'Chapter 4 ends with Solomon''s peace on every side'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/4?lang=eng'
    quote: 'over all the kings on this side the river: and he had peace on all sides round about him.'
  - where: setting
    claim: 'David gathered materials for the temple; building it was one of the first things Solomon turned to'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'David spent much time and energy in gathering materials for the temple. When Solomon came to the throne, one of the first things he did was direct his attention to building the temple.'
  - where: setting
    claim: 'Chronicles retells the negotiation; Hiram blesses the LORD that made heaven and earth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/2?lang=eng'
    quote: 'Blessed be the Lord God of Israel, that made heaven and earth, who hath given to David the king a wise son'
  - where: thread
    claim: 'One older reading: the wisdom of verse 12 covers both the treaty with Hiram and Solomon''s use of his own subjects, and the verse introduces the verses on the workforce'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/5.htm'
    quote: 'refers not merely to the treaty which Solomon made with Hiram … but also to the wise use which he made of the capacities of his own subjects for this work. For this verse … also forms an introduction to the following verses'
  - where: thread
    claim: 'The wisdom of verse 12 is the wisdom promised at 3:12 (footnote 12a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/5?lang=eng'
    quote: '1 Kgs. 3:12'
  - where: thread
    claim: 'The levy of 5:13 is set beside 12:4 (footnote 13a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/5?lang=eng'
    quote: '1 Kgs. 12:4'

  - where: 'note 5:1 “Hiram, Tyre and the Sidonians”'
    claim: 'Hiram king of Tyre was a friend of David and Solomon, called Huram in Chronicles; a different Hiram was the Tyrian workman'
    key: bd-hiram
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hiram?lang=eng'
    quote: '(1) King of Tyre, a friend of David and Solomon (2 Sam. 5:11; 1 Kgs. 5; 9:11–14, 27; 10:11); called Huram (2 Chr. 2:3–12; 8:2, 18; 9:10, 21). … (2) A Tyrian workman sent to Solomon (1 Kgs. 7:13, 40, 45)'
  - where: 'note 5:1 “Hiram, Tyre and the Sidonians”'
    claim: 'Tyre was an important commercial seaport, in alliance with David and Solomon'
    key: bd-tyre
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tyre?lang=eng'
    quote: 'an important commercial and seaport town of Syria, in alliance with David (2 Sam. 5:11; 1 Chr. 14:1); with Solomon (1 Kgs. 5; 2 Chr. 2:3–16'
  - where: 'note 5:1 “Hiram, Tyre and the Sidonians”'
    claim: 'Zidon was the most important city of Phoenicia in ancient times, so Phoenicians are generally called Zidonians'
    key: bd-zidon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zidon?lang=eng'
    quote: 'In ancient times it was the most important city of Phoenicia (hence Phoenicians are generally called Zidonians in the Old Testament).'
  - where: 'note 5:1 “Hiram, Tyre and the Sidonians”'
    claim: 'Lebanon is a long limestone range rising to eight or nine thousand feet, a land of forests and cedar'
    key: bd-lebanon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/lebanon?lang=eng'
    quote: 'A long range of limestone hills in the extreme north of Palestine, rising to a height of eight or nine thousand feet. It is still a land of forests, though the groves of cedar trees have almost disappeared.'
  - where: 'note 5:1 “Hiram, Tyre and the Sidonians”'
    claim: 'The Phoenicians were masters of the sea; the Israelites were not'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'Hiram’s people, the Phoenicians, were masters of the sea, whereas the Israelites were not.'
  - where: 'note 5:1 “Hiram, Tyre and the Sidonians”'
    claim: 'The cedars were floated to Joppa and hauled nearly forty miles up to Jerusalem, 2,550 feet above sea level'
    key: madsen-solomons-temple
    url: 'https://rsc.byu.edu/eye-faith/solomons-temple-compared-salt-lake-temple'
    quote: 'floating giant cedars of Lebanon from Tyre, a coastal city more than eighty-nine miles north, all the way to Joppa, then hauling them nearly forty miles up the ever-steepening road to Jerusalem. Their arduous overland trek ended 2,550 feet above sea level'
  - where: 'note 5:1 “Hiram, Tyre and the Sidonians”'
    claim: 'Chronicles names Joppa as the landing place for the floats'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/2?lang=eng'
    quote: 'we will bring it to thee in floats by sea to Joppa; and thou shalt carry it up to Jerusalem.'

  - where: 'note 5:1 “Friendship and covenant”'
    claim: 'The Hebrew of “lover” expresses the affection of one friend for another, with 1 Sam. 18:1, 3 as the parallel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/5?lang=eng'
    quote: 'The Hebrew term here expresses the affection held by one friend for another'
  - where: 'note 5:1 “Friendship and covenant”'
    claim: '“League” in verse 12 is Hebrew for covenant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/5?lang=eng'
    quote: 'HEB covenant, pact.'
  - where: 'note 5:1 “Friendship and covenant”'
    claim: 'The Hebrew of verse 1 is the participle of the ordinary verb to love; verse 12 has berit'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'אֹהֵ֗ב'
  - where: 'note 5:1 “Friendship and covenant”'
    claim: 'In the biblical world love often meant covenant devotion and political alliance'
    key: sc-knowhy-186
    url: 'https://scripturecentral.org/knowhy/why-did-samuel-say-the-lord-hated-the-lamanites'
    quote: 'in the biblical world the word love often represented a covenantal devotion to one’s superior, while its opposite, namely hate, at times signified the status of an individual outside of this affiliation.'
  - where: 'note 5:1 “Friendship and covenant”'
    claim: 'Love and hate often carried a connotation of political alliance'
    key: sc-knowhy-186
    url: 'https://scripturecentral.org/knowhy/why-did-samuel-say-the-lord-hated-the-lamanites'
    quote: 'Thus, the words love and hate in the biblical world often carried a deliberate connotation of political alliance (or lack thereof).'
  - where: 'note 5:1 “Friendship and covenant”'
    claim: 'Hiram as “a lover of David” is given as an example of the usage'
    key: sc-knowhy-186
    url: 'https://scripturecentral.org/knowhy/why-did-samuel-say-the-lord-hated-the-lamanites'
    quote: 'In the time of Solomon, for example, Hiram, who was the king of a neighboring state, was described as “a lover of David” (1 Kings 5:1)'

  - where: 'note 5:3 “Why David could not build, and why Solomon could”'
    claim: 'In Chronicles David tells Solomon the word of the LORD gave him a reason (bloodshed) and the promise of a son, a man of rest, named Solomon, with peace in his days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/22?lang=eng'
    quote: 'Behold, a son shall be born to thee, who shall be a man of rest; and I will give him rest from all his enemies round about: for his name shall be Solomon, and I will give peace and quietness unto Israel in his days.'

  - where: 'note 5:4 “No adversary, no mishap”'
    claim: 'The Hebrew of verse 4 has satan and pega'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'שָׂטָ֔ן'
  - where: 'note 5:4 “No adversary, no mishap”'
    claim: 'Satan here means an adversary, personal or national; the lexicon lists 5:4 with 11:14, 23, 25, the LORD raising the adversary in 11:14, 23'
    key: bdb
    url: 'https://biblehub.com/hebrew/7854.htm'
    quote: '1 adversary, in General, personal or national; … ׳שׂ 1 Kings 5:18; 1 Kings 11:25; ל ׳הֵקִים שׂ, subject God 1 Kings 11:14,23'
  - where: 'note 5:4 “No adversary, no mishap”'
    claim: 'Pega means occurrence or chance: “evil occurrence” here, “time and chance” in Ecclesiastes'
    key: bdb
    url: 'https://biblehub.com/hebrew/6294.htm'
    quote: 'noun masculine occurrence, chance; — absolute ׳פ 1 Kings 5:18 evil occurrence; Ecclesiastes 9:11 time and chance.'
  - where: 'note 5:4 “No adversary, no mishap”'
    claim: 'In 1 Kings the word satan occurs only at 5:4 and 11:14, 23, 25'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'שָׂטָן֙'

  - where: 'note 5:11 “Twenty measures, or twenty thousand”'
    claim: 'The Hebrew has twenty kor of beaten oil'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'כָּתִ֑ית'
  - where: 'note 5:11 “Twenty measures, or twenty thousand”'
    claim: 'Beaten oil is made by pounding olives in a mortar, especially fine and costly; the same oil was for the lamp'
    key: bdb
    url: 'https://biblehub.com/hebrew/3795.htm'
    quote: 'beaten oil, i.e. oil made by beating or pounding the olives in a mortar; especially fine and costly … Exodus 27:20 pure beaten olive oil for the lamp'
  - where: 'note 5:11 “Twenty measures, or twenty thousand”'
    claim: 'The lexicon would read “baths of oil” here, comparing the Greek and Chronicles'
    key: bdb
    url: 'https://biblehub.com/hebrew/3734.htm'
    quote: 'in 1 Kings 5:25 b read בַּת שֶׁמֶן for ᵑ0 ׳כֹּר שׁ (compare ᵐ5. and 2 Chron 2:9).'
  - where: 'note 5:11 “Twenty measures, or twenty thousand”'
    claim: 'A cor is said to equal ten baths'
    key: bd-weights-and-measures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/weights-and-measures?lang=eng'
    quote: 'Cor (liquid and dry). Said to equal 10 baths.'
  - where: 'note 5:11 “Twenty measures, or twenty thousand”'
    claim: 'The Greek reads twenty thousand baths of beaten oil'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_kings/5.htm'
    quote: 'And Solomon gave to Chiram twenty thousand measures of wheat as food for his house, and twenty thousand baths of beaten oil thus Solomon gave to Chiram yearly.'
  - where: 'note 5:11 “Twenty measures, or twenty thousand”'
    claim: 'In Chronicles the 20,000 baths of oil are for the hewers'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/2?lang=eng'
    quote: 'I will give to thy servants, the hewers that cut timber, twenty thousand measures of beaten wheat, and twenty thousand measures of barley, and twenty thousand baths of wine, and twenty thousand baths of oil.'
  - where: 'note 5:11 “Twenty measures, or twenty thousand”'
    claim: 'One older reading: the two accounts are different payments, and twenty cors of the finest oil is not out of proportion'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/5.htm'
    quote: 'On the other hand, the payment for the wood delivered by Solomon to Hiram, which is not mentioned in the Chronicles, is stated here in 1 Kings 5:11. … If we bear in mind that this was the finest kind of oil, we cannot speak of disproportion to the quantity of wheat delivered.'

  - where: 'note 5:13 “The levy, and the yoke it became”'
    claim: 'Mas is a labor gang raised by levy for public works; the same word is used of Israel''s gang overseers in Egypt and of conquered peoples put to labor'
    key: bdb
    url: 'https://biblehub.com/hebrew/4522.htm'
    quote: '1 labour-band, labour-gang, body of task-workers for public service, formed by levy upon the people by Solomon … 2. a. of labour-bands, slave-gangs of Israel in Egypt, only שָׂרֵי מִסִּים Exodus 1:11 (J) gang-overseers.'
  - where: 'note 5:13 “The levy, and the yoke it became”'
    claim: 'Conquered populations subject to forced labor (Joshua 16:10)'
    key: bdb
    url: 'https://biblehub.com/hebrew/4522.htm'
    quote: 'b. of conquered populations, subject to forced labour'
  - where: 'note 5:13 “The levy, and the yoke it became”'
    claim: 'Adoniram (Adoram) superintended the forced labor under David, Solomon and Rehoboam and was stoned'
    key: bd-adoniram
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/adoniram?lang=eng'
    quote: 'My Lord is exalted (sometimes abbreviated into Adoram). The officer “over the levy” who superintended the forced labor employed in public works during the reigns of David, Solomon, and Rehoboam'
  - where: 'note 5:13 “The levy, and the yoke it became”'
    claim: 'Chronicles counts the strangers in the land and sets them as bearers of burdens and hewers'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/2?lang=eng'
    quote: 'And Solomon numbered all the strangers that were in the land of Israel'
  - where: 'note 5:13 “The levy, and the yoke it became”'
    claim: 'The footnote sets the levy beside 12:4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/5?lang=eng'
    quote: '1 Kgs. 12:4'

  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: christ
    claim: 'Temples in antiquity and this dispensation are built from the finest materials through the sacrifice and consecration of the people'
    key: sc-knowhy-806
    url: 'https://scripturecentral.org/knowhy/how-does-the-construction-of-the-kirtland-temple-follow-ancient-patterns'
    quote: 'Temples in both antiquity and this dispensation are built from the finest materials available through the sacrifice and consecration of the people.'
  - where: christ
    claim: 'The Lord requires tithing and sacrifice for a house built to Him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/97?lang=eng'
    quote: 'Behold, this is the tithing and the sacrifice which I, the Lord, require at their hands, that there may be a house built unto me for the salvation of Zion—'
