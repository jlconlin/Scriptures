chapter: 12
claims:
  - where: setting
    claim: 'The footnote to “yoke” points to Solomon''s officers (4:7) and the levy (5:13)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/12?lang=eng'
    quote: '4a “yoke”: 1 Kgs. 4:7; 5:13.'
  - where: setting
    claim: 'Samuel''s prophecies about a king were fulfilled in Solomon''s reign; the yoke was the burden of taxes and conscript labor'
    key: ot-manual-4
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-4?lang=eng'
    quote: 'All of Samuel’s prophecies about Israel’s having a king were fulfilled in Solomon’s reign. Israel desired relief from the burdens of Solomon’s extravagance, which had brought upon them exorbitant taxes and conscript labor. The yoke mentioned here was symbolic of that burden.'
  - where: setting
    claim: 'The Northern Kingdom endured about two centuries, was conquered by Assyria, and its tribes became the lost ten tribes'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: 'The Northern Kingdom endured for about two centuries before the Assyrians conquered it and captured many of the people. These tribes were eventually scattered throughout the nations of the earth. They have since become known as the lost ten tribes of Israel.'
  - where: setting
    claim: 'The Southern Kingdom was Judah and Benjamin, at Jerusalem, until Babylon destroyed the city'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: 'The Southern Kingdom was composed of the territory belonging to the tribes of Judah and Benjamin. It was called the Kingdom of Judah and was headquartered in Jerusalem. This kingdom came to an end when the Babylonians destroyed Jerusalem in 586 BC.'
  - where: setting
    claim: 'The division fulfilled Ahijah''s prophecy; the Northern Kingdom was also called Ephraim, its dominant tribe'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: 'These actions fulfilled the prophecy Ahijah made during the reign of Solomon (see 1 Kings 11:29–39 …). The Northern Kingdom was also sometimes called Ephraim because the tribe of Ephraim was the dominant group among the ten tribes'
  - where: setting
    claim: 'Chronicles tells the same events (footnotes 1a and 21a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/12?lang=eng'
    quote: '1a “Rehoboam”: 2 Chr. 10:1 (1–19).'
  - where: setting
    claim: 'Footnote 21a points to 2 Chr. 11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/12?lang=eng'
    quote: '21a “Rehoboam”: 2 Chr. 11:1 (1–17).'
  - where: setting
    claim: 'The footnote links Adoram (verse 18) to the officer over the levy (4:6; 5:14)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/12?lang=eng'
    quote: '18a “Adoram”: 1 Kgs. 4:6; 5:14.'
  - where: setting
    claim: 'Adoniram was over the levy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/5?lang=eng'
    quote: 'and Adoniram was over the levy.'

  - where: thread
    claim: 'The events of the chapter fulfilled Ahijah''s prophecy'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: 'These actions fulfilled the prophecy Ahijah made during the reign of Solomon'
  - where: thread
    claim: 'Jeroboam feared the people would go to the temple and rejoin Judah, and so set up calves, places of worship, feasts and priests'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: 'Jeroboam feared that his people would travel south to worship in the temple in Jerusalem and eventually rejoin the Southern Kingdom. To prevent this, he had two golden calves made, established new places of worship, introduced alternative feasts, and appointed his own priests.'

  - where: 'note 12:1 “Why Shechem and not Jerusalem”'
    claim: 'Shechem: among the mountains of Ephraim; Abram visited; Joshua addressed the people; Joseph''s bones buried; Rehoboam came to conciliate the north'
    key: bd-shechem
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shechem?lang=eng'
    quote: 'situated in a beautiful plain among the mountains of Ephraim … It was visited by Abram on his first arrival in the promised land … Here Joshua addressed the people (Josh. 24:1), and the bones of Joseph were buried (24:32). Here Rehoboam came to be crowned in the hope of conciliating the northern tribes'
  - where: 'note 12:1 “Why Shechem and not Jerusalem”'
    claim: 'The division was mainly the result of an old rivalry between Judah and Ephraim, which Rehoboam tried to pacify by going to Shechem'
    key: bd-rehoboam
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/rehoboam?lang=eng'
    quote: 'During his reign the division took place between north and south (1 Kgs. 12), being mainly the result of an old rivalry between Judah and Ephraim, which Rehoboam tried to pacify by going to Shechem to be crowned.'
  - where: 'note 12:1 “Why Shechem and not Jerusalem”'
    claim: 'The tribes had an old right to make the king God chose (Saul, David, Solomon); Shechem was the old place of national gatherings in Ephraim'
    key: ot-manual-4
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-4?lang=eng'
    quote: 'The right of making king the prince whom God has chosen … was an old traditional right in Israel, and the tribes had exercised it not only in the case of Saul and David … they had gone to Sichem … the place where the ancient national gatherings were held in the tribe of Ephraim'

  - where: 'note 12:7 “A servant to this people”'
    claim: 'Come, Follow Me: Christlike leaders serve; points to verse 7, Matt. 20:25–28 and Mosiah 2:10–21 for the attributes that could have saved Rehoboam''s kingdom'
    key: cfm-ot-2026-27
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/27?lang=eng'
    quote: 'Christlike leaders serve the people they lead. … What Christlike attributes could have helped Rehoboam save his kingdom? (see verse 7; Matthew 20:25–28; Mosiah 2:10–21).'
  - where: 'note 12:7 “A servant to this people”'
    claim: 'Benjamin labored with his own hands so the people would not be laden with taxes or anything grievous'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/2?lang=eng'
    quote: 'And even I, myself, have labored with mine own hands that I might serve you, and that ye should not be laden with taxes, and that there should nothing come upon you which was grievous to be borne'

  - where: 'note 12:10 “The little finger and the scorpions”'
    claim: 'The boast means: I have much greater might than my father; scorpions are whips with barbed points'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/12.htm'
    quote: 'a figurative expression in the sense of, I possess much greater might than my father. … עקרבּים, scorpiones, are whips with barbed points like the point of a scorpion''s sting.'
  - where: 'note 12:10 “The little finger and the scorpions”'
    claim: 'The footnote gives the Hebrew of “scorpions” as stinging whips'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/12?lang=eng'
    quote: '11b “scorpions”: HEB stinging whips.'

  - where: 'note 12:15 “A turn of affairs from the LORD”'
    claim: '“Cause” is sibbâ, a turn of affairs, an ordering from the LORD'
    key: bdb
    url: 'https://biblehub.com/hebrew/5438.htm'
    quote: 'סִבָּה noun feminine turn of affairs; — only absolute ׳הָֽיְתָה סִבָּה מַעִם י 1 Kings 12:15 it was a turn (an ordering) from ׳י'
  - where: 'note 12:15 “A turn of affairs from the LORD”'
    claim: 'The footnote gives the Hebrew as turn of affairs'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/12?lang=eng'
    quote: '15a “cause”: HEB turn of affairs.'
  - where: 'note 12:15 “A turn of affairs from the LORD”'
    claim: 'Rehoboam contributed to the fulfilment of God''s counsel through his own folly'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/12.htm'
    quote: 'i.e., by a divine decree, that Rehoboam contributed to the fulfilment of the counsel of God through his own folly, and brought about the accomplishment of the sentence pronounced upon Solomon.'
  - where: 'note 12:15 “A turn of affairs from the LORD”'
    claim: '“This thing” in verse 24 is the loss of the ten tribes, not their rebellion'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/12.htm'
    quote: 'הזּה הדּבר, "this thing, i.e., his being deprived of the sovereignty over ten tribes, but not their rebellion" (Seb. Schmidt).'

  - where: 'note 12:16 “Sheba''s cry again”'
    claim: 'The footnote at verse 20 gives the Septuagint reading Judah and Benjamin'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/12?lang=eng'
    quote: '20b “Judah”: Septuagint: Judah and Benjamin.'

  - where: 'note 12:17 “Israelites who stayed with Judah”'
    claim: 'Many from the other ten tribes migrated to the Southern Kingdom and became part of Judah'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: 'In the years that followed, many members of the other ten tribes migrated to the Southern Kingdom and became a part of the nation of Judah (see 2 Chronicles 11:13–17; 15:9).'
  - where: 'note 12:17 “Israelites who stayed with Judah”'
    claim: 'This verse and 2 Chr. 11:13–17; 15:9 explain why Lehi, of Manasseh, lived at Jerusalem generations after Rehoboam'
    key: ot-manual-4
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-4?lang=eng'
    quote: 'This passage helps to explain why such men as Lehi and Nephi, who were descendants of Manasseh (see Alma 10:3) … were living in the land of Jerusalem several generations after Rehoboam. … This matter is explained more fully in 2 Chronicles 11:13–17and 15:9'
  - where: 'note 12:17 “Israelites who stayed with Judah”'
    claim: 'The Levites and those who sought the LORD came from all the tribes to Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/11?lang=eng'
    quote: 'And after them out of all the tribes of Israel such as set their hearts to seek the Lord God of Israel came to Jerusalem, to sacrifice unto the Lord God of their fathers.'
  - where: 'note 12:17 “Israelites who stayed with Judah”'
    claim: 'Lehi was a descendant of Manasseh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/10?lang=eng'
    quote: 'Lehi, who came out of the land of Jerusalem, who was a descendant of Manasseh, who was the son of Joseph'

  - where: 'note 12:28 “The calves, and the sin of Jeroboam”'
    claim: 'Jeroboam feared the people would go to Jerusalem''s temple and rejoin Judah; to prevent it he made the calves'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: 'Jeroboam feared that his people would travel south to worship in the temple in Jerusalem and eventually rejoin the Southern Kingdom. To prevent this, he had two golden calves made'
  - where: 'note 12:28 “The calves, and the sin of Jeroboam”'
    claim: 'The calves may have been meant as substitutes for the ark; regardless, they led the people into apostasy'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: 'Jeroboam may have intended for the golden calves to serve as substitutes for the ark of the covenant. Regardless of Jeroboam’s intentions, his actions led his people into apostasy.'
  - where: 'note 12:28 “The calves, and the sin of Jeroboam”'
    claim: 'Jeroboam''s words are exactly Aaron''s in Ex. 32:4'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: 'Jeroboam’s words in 1 Kings 12:28 are exactly those of Aaron’s in Exodus 32:4.'
  - where: 'note 12:28 “The calves, and the sin of Jeroboam”'
    claim: 'The calves were supposed to be images of Jehovah; the sin made Jeroboam''s name proverbial'
    key: bd-jeroboam
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeroboam?lang=eng'
    quote: 'one of Jeroboam’s first steps after the separation was to set up image worship in Dan and Bethel, the two calves being supposed to be images of Jehovah. This sin made his name proverbial (15:34)'
  - where: 'note 12:28 “The calves, and the sin of Jeroboam”'
    claim: 'The footnote at verse 27 points to Deut. 12:5, the place the LORD would choose'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/12?lang=eng'
    quote: '27a “go”: Deut. 12:5 (5–7).'

  - where: 'note 12:29 “Why Bethel and Dan”'
    claim: 'Bethel: house of God, on the border of Benjamin and Ephraim; Abraham''s altar, Jacob''s dream; a sanctuary in Samuel''s day; chosen for the calf worship'
    key: bd-bethel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/bethel?lang=eng'
    quote: 'House of God. (1) Formerly called Luz (Gen. 28:19), on the border between Benjamin and Ephraim, and one of the most sacred spots in Israel. Here Abraham built his altar … here Jacob had his dream … It was a sanctuary in the days of Samuel'
  - where: 'note 12:29 “Why Bethel and Dan”'
    claim: 'Dan was the northern limit and was chosen by Jeroboam for the calf worship'
    key: bd-dan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/dan?lang=eng'
    quote: 'This town is well known as the northern limit of Palestine, which extended “from Dan even to Beer-sheba.” It was chosen by Jeroboam as one of the places in which to establish the calf worship for the northern tribes'
  - where: 'note 12:29 “Why Bethel and Dan”'
    claim: 'Jeroboam did not choose his own residence; Bethel was on the southern border, Dan in the north (Keil, quoted in the manual)'
    key: ot-manual-4
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-4?lang=eng'
    quote: 'He did not select his own place of residence, but Bethel and Dan. Bethel, on the southern border of his kingdom … Dan, in the northern part of the kingdom'
  - where: 'note 12:29 “Why Bethel and Dan”'
    claim: 'The Danites set up a graven image with their own priests'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/18?lang=eng'
    quote: 'And the children of Dan set up the graven image: and Jonathan, the son of Gershom … he and his sons were priests to the tribe of Dan until the day of the captivity of the land.'

  - where: 'note 12:31 “Priests from all the people”'
    claim: '“Of the lowest of the people” is from the whole of, from among, the people'
    key: bdb
    url: 'https://biblehub.com/hebrew/7098.htm'
    quote: '2 מִקְצוֺת הָעָם = from the whole of (from among) the people, 1 Kings 12:31; 1 Kings 13:33'
  - where: 'note 12:31 “Priests from all the people”'
    claim: 'The word in the verse is H7098 with the preposition min'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'קְצ֣וֹת'
  - where: 'note 12:31 “Priests from all the people”'
    claim: 'Jeroboam made priests not of the family of Aaron'
    key: bd-jeroboam
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeroboam?lang=eng'
    quote: 'He also made priests of men who were not of the family of Aaron (1 Kgs. 12:31; 2 Chr. 13:9); he instituted a new feast of his own'
  - where: 'note 12:31 “Priests from all the people”'
    claim: 'The Levites left their lands for Judah because Jeroboam cast them off'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/11?lang=eng'
    quote: 'For the Levites left their suburbs and their possession, and came to Judah and Jerusalem: for Jeroboam and his sons had cast them off from executing the priest’s office unto the Lord'
  - where: 'note 12:31 “Priests from all the people”'
    claim: 'Anyone with a young bullock and seven rams could be consecrated a priest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/13?lang=eng'
    quote: 'whosoever cometh to consecrate himself with a young bullock and seven rams, the same may be a priest of them that are no gods.'

  - where: 'note 12:32 “A feast a month late”'
    claim: 'Tabernacles was held on the 15th to 21st of the seventh month, the greatest and most joyful feast, celebrating the wilderness sojourn'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'The Feast of Tabernacles (Lev. 23:34) or of Ingathering (Ex. 23:16) … reckoned by them to be the greatest and most joyful of all, was celebrated on the 15th to 21st days of the seventh month. … The events celebrated were the sojourning of the children of Israel in the wilderness'
  - where: 'note 12:32 “A feast a month late”'
    claim: 'The Law fixes the feast of tabernacles on the fifteenth day of the seventh month'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/23?lang=eng'
    quote: 'The fifteenth day of this seventh month shall be the feast of tabernacles for seven days unto the Lord.'
  - where: 'note 12:32 “A feast a month late”'
    claim: 'Jeroboam instituted a new feast of his own'
    key: bd-jeroboam
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeroboam?lang=eng'
    quote: 'he instituted a new feast of his own'

  - where: christ
    claim: 'Come, Follow Me sets Matt. 20:25–28 beside verse 7 as the Christlike attribute; leaders in a Church calling'
    key: cfm-ot-2026-27
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/27?lang=eng'
    quote: 'Christlike leaders serve the people they lead. … (see verse 7; Matthew 20:25–28; Mosiah 2:10–21). How can you use these attributes as a leader—whether in a Church calling or as a leader of your own life?'
  - where: christ
    claim: 'Jesus: whoever would be great, let him be your minister; the Son of man came to minister'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/20?lang=eng'
    quote: 'whosoever will be great among you, let him be your minister; … Even as the Son of man came not to be ministered unto, but to minister'
  - where: christ
    claim: 'Benjamin: service of fellow beings is service of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/2?lang=eng'
    quote: 'when ye are in the service of your fellow beings ye are only in the service of your God.'
