chapter: 14
claims:
  - where: setting
    claim: 'The Church''s chapter heading: Ahijah foretells the ruin of Jeroboam''s house and the scattering; Jeroboam dies; Judah under Rehoboam turns to wickedness; Shishak takes the temple''s treasures'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/14?lang=eng'
    quote: 'Ahijah foretells the ruin of Jeroboam’s house, the death of his child, and the scattering of the Israelites because of their idolatry—Jeroboam dies and Nadab reigns—Judah, under Rehoboam, turns to wickedness—Shishak of Egypt takes treasures from the temple'
  - where: setting
    claim: 'Shishak invaded in the fifth year of Rehoboam, 925 B.C. (the manual, quoting the New Bible Dictionary)'
    key: ot-manual-4
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-4?lang=eng'
    quote: 'Late in his reign, Shishak invaded Palestine in the fifth year of Rehoboam, 925 B.C.'
  - where: thread
    claim: 'Ahijah''s prophecy is fulfilled when Baasha destroys the house of Jeroboam'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/15?lang=eng'
    quote: 'he smote all the house of Jeroboam; he left not to Jeroboam any that breathed, until he had destroyed him, according unto the saying of the LORD, which he spake by his servant Ahijah the Shilonite'

  - where: 'note 14:2 “A disguise before a blind prophet”'
    claim: 'Perhaps Jeroboam thought the prophet would yield more to a mother; he knew he was unworthy; the gift was a common citizen''s wife''s, adding to the deception'
    key: ot-manual-4
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-4?lang=eng'
    quote: 'Certainly he knew that he was not worthy to ask for any blessings from the Lord. … He had her take a gift to the prophet, as was considered proper in such instances, but the gift was the kind that a common citizen’s wife would take, thus adding to the deception.'
  - where: 'note 14:2 “A disguise before a blind prophet”'
    claim: '“His eyes were set”: he could not properly focus'
    key: ot-manual-4
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-4?lang=eng'
    quote: 'Ahijah was blind, or at least his eyes had become so weak with his old age that he could hardly see. The phrase “his eyes were set” indicates that he could not properly focus and follow images.'
  - where: 'note 14:2 “A disguise before a blind prophet”'
    claim: 'The Lord''s anointed can draw on revelation to see into hearts'
    key: ot-manual-4
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-4?lang=eng'
    quote: 'the Lord’s anointed can draw upon the gift of revelation and thereby see into the hearts of others or have things made known to them which cannot be obtained through the natural senses'
  - where: 'note 14:2 “A disguise before a blind prophet”'
    claim: 'Jeroboam''s wife is one of several biblical disguise stories; they depict a contest between God and a king and end with the king''s death and the end of his dynasty'
    key: sc-knowhy-310
    url: 'https://scripturecentral.org/knowhy/why-did-abinadi-use-a-disguise'
    quote: 'These stories typically depict a contest between God and an earthly king, and they conclude with the death of the king and the end of his dynasty.'
  - where: 'note 14:2 “A disguise before a blind prophet”'
    claim: 'The list of disguise stories includes Jeroboam''s wife and the blind prophet'
    key: sc-knowhy-310
    url: 'https://scripturecentral.org/knowhy/why-did-abinadi-use-a-disguise'
    quote: '(5) Jeroboam’s wife disguising herself to visit a blind prophet concerning her son’s illness (1 Kings 14).'
  - where: 'note 14:2 “A disguise before a blind prophet”'
    claim: 'A present was brought to a man of God when consulting him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/9?lang=eng'
    quote: 'there is not a present to bring to the man of God: what have we?'

  - where: 'note 14:8 “Not as my servant David”'
    claim: 'Joseph Smith''s manuscript of 1 Kgs. 14:8'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/84'
    quote: 'And rent the kingdom away from the house of David, and gave it thee; because he kept not my commandments, But thou hast not been as my servant David, when he followed me with all his heart, only to do right in mine eyes'
  - where: 'note 14:8 “Not as my servant David”'
    claim: '14:8 is among the Joseph Smith Translation passages that qualify David as the example; not all were revised'
    key: scripture-helps-2-samuel-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/24-2-samuel-11-12-1-kings-3-6-9-11?lang=eng'
    quote: 'Other examples include the Joseph Smith Translation for 1 Kings 11:4, 6, 33, 38–39; 14:8; 15:3, 5, 11 (see Old Testament Revision 2, 76–77, josephsmithpapers.org). It should be noted that not all such passages were revised.'

  - where: 'note 14:10 “Every male of the house”'
    claim: 'The participle phrase means a male person and is used only of exterminating a family'
    key: bdb
    url: 'https://biblehub.com/hebrew/8366.htm'
    quote: 'Participle מַשְׁתִּין בְּקִיר (i.e. a male person) 1 Samuel 25:22,34; 1 Kings 14:10; 1 Kings 16:11; 1 Kings 21:21; 2 Kings 9:8 (all of exterminating a family).'
  - where: 'note 14:10 “Every male of the house”'
    claim: 'The Hebrew of 14:10: maštîn bᵉqîr'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'מַשְׁתִּ֣ין'
  - where: 'note 14:10 “Every male of the house”'
    claim: 'The same words fall on Baasha''s house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/16?lang=eng'
    quote: 'he slew all the house of Baasha: he left him not one that pisseth against a wall'

  - where: 'note 14:13 “The one son who would be buried”'
    claim: 'All of Jeroboam''s posterity would be slain and none buried properly except this son; to be unburied was the worst thing'
    key: ot-manual-4
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-4?lang=eng'
    quote: 'The prophet indicated that all of Jeroboam’s posterity would be slain and none would receive a proper burial except his son … Among the Hebrews, to be unburied is the worst thing that can happen to a dead person'
  - where: 'note 14:13 “The one son who would be buried”'
    claim: 'Being left to dogs and birds (Deut. 28:26) was the worst disgrace for the dead'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/14.htm'
    quote: 'the threat added from Deuteronomy 28:26, that of those cut off not one is to come to the grave, but their bodies are to be devoured by the dogs and birds of prey, - the worst disgrace that could befall the dead.'
  - where: 'note 14:13 “The one son who would be buried”'
    claim: 'He alone would receive the honour of burial; the fulfilment of the sign assured Jeroboam the rest would be fulfilled; the son seems to have been the heir'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/14.htm'
    quote: 'of all the male members of the house of Jeroboam he only would receive the honour of a proper burial … From the fulfilment of this declaration in 1 Kings 14:17, 1 Kings 14:18 Jeroboam was to learn that the threatened destruction of his royal house would also be just as certainly fulfilled. The sick son appears to have been the heir-presumptive'

  - where: 'note 14:14 “But what? even now”'
    claim: 'Keil fills the ellipsis: but what (do I say)? even now (has He raised him up)'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/14.htm'
    quote: '"Jehovah will raise Himself up a king over Israel, who will cut off the house of Jeroboam this day; but what (sc., do I say)? even now," sc., has He raised him up. This appears to be the simplest explanation of the last words of the verse, of which very various interpretations have been given.'
  - where: 'note 14:14 “But what? even now”'
    claim: 'The Cambridge Bible: it will come so soon that it may be called even now'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/1_kings/14.htm'
    quote: 'This elliptic phrase seems to be best filled out somewhat thus. But what (am I saying? Why do I speak of that day? It will so soon come to pass that I may call it) even now.'
  - where: 'note 14:14 “But what? even now”'
    claim: 'Nadab reigned two years; Baasha killed him and the whole house, according to Ahijah''s word'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/15?lang=eng'
    quote: 'Nadab the son of Jeroboam began to reign over Israel in the second year of Asa king of Judah, and reigned over Israel two years.'

  - where: 'note 14:15 “Scattered beyond the river”'
    claim: 'The passage refers to the captivity of the ten tribes by Assyria about 721 B.C.; Ahijah''s prediction was fulfilled; the Ten Tribes were thereafter lost to history (Talmage, quoted in the manual)'
    key: ot-manual-4
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-4?lang=eng'
    quote: 'Thus was the dread prediction of Ahijah to the wife of Jeroboam fulfilled. Israel was scattered beyond the river, probably the Euphrates, and from the time of this event the Ten Tribes are lost to history.'
  - where: 'note 14:15 “Scattered beyond the river”'
    claim: 'The Church''s footnote identifies the river as the Euphrates'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/14?lang=eng'
    quote: '15c “the river”: IE the Euphrates.'
  - where: 'note 14:15 “Scattered beyond the river”'
    claim: 'Kings ties the exile to the sins of Jeroboam, as the prophets had said'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/17?lang=eng'
    quote: 'For the children of Israel walked in all the sins of Jeroboam which he did; they departed not from them; Until the LORD removed Israel out of his sight, as he had said by all his servants the prophets.'

  - where: 'note 14:15 “Groves”'
    claim: 'Asherah: a living tree or a tree-like pole, symbolic of the female or productive principle; every Phoenician altar had one; associated with gross immorality; forbidden by the prophets'
    key: bd-grove
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/grove?lang=eng'
    quote: 'either a living tree or a tree-like pole, set up as an object of worship, being symbolic of the female or productive principle in nature. Every Phoenician altar had an asherah near it. … This “nature worship” became associated with gross immorality'
  - where: 'note 14:15 “Groves”'
    claim: 'The Law forbade planting a grove beside the LORD''s altar; Judah built groves too (14:23)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/16?lang=eng'
    quote: 'Thou shalt not plant thee a grove of any trees near unto the altar of the LORD thy God, which thou shalt make thee.'
  - where: 'note 14:15 “Groves”'
    claim: 'The Church''s footnote: the “sodomites” of 14:24 are, in the Hebrew, male prostitutes devoted to idolatrous fertility worship'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/14?lang=eng'
    quote: '24a “sodomites”: HEB male prostitutes; devotees of idolatrous, paganistic fertility worship.'

  - where: 'note 14:19 “The book of the chronicles”'
    claim: 'Kings was compiled by an unknown writer from written documents, including the state chronicles'
    key: bd-kings-books-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/kings-books-of?lang=eng'
    quote: 'The books were compiled by some unknown writer from a variety of written documents, including the state chronicles.'
  - where: 'note 14:19 “The book of the chronicles”'
    claim: 'The state chronicles were not our books of Chronicles but records kept under the kings'' direction'
    key: ot-seminary-1-kings-intro
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-kings?lang=eng'
    quote: 'The state chronicles were not the books of 1 and 2 Chronicles but rather a collection of records maintained under the direction of the kings of Israel.'
  - where: 'note 14:19 “The book of the chronicles”'
    claim: 'The Church''s footnote: the records are no longer extant; they were source books for Kings'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/14?lang=eng'
    quote: 'It is significant that the kings of Israel and Judah kept official records; these records are no longer extant; they were used as source books by the author(s) of our books of Kings; they are not our books of Chronicles.'
  - where: 'note 14:19 “The book of the chronicles”'
    claim: 'A royal chronicle was already kept under David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/27?lang=eng'
    quote: 'neither was the number put in the account of the chronicles of king David.'
  - where: 'note 14:19 “The book of the chronicles”'
    claim: 'Chronicles names prophets'' records for Rehoboam''s acts'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/12?lang=eng'
    quote: 'Now the acts of Rehoboam, first and last, are they not written in the book of Shemaiah the prophet, and of Iddo the seer concerning genealogies?'

  - where: 'note 14:25 “Shishak”'
    claim: 'Shishak, first king of the 22nd dynasty; a relief of his victory over Rehoboam is on the temple wall at Karnak'
    key: bd-shishak
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shishak?lang=eng'
    quote: 'King of Egypt, being the first of the 22nd dynasty (1 Kgs. 11:40; 14:25–26; 2 Chr. 12:2–9). A pictorial representation of his victory over Rehoboam has been discovered on the wall of the temple of Karnak.'
  - where: 'note 14:25 “Shishak”'
    claim: 'Chronicles gives the reason and Shemaiah''s word: they forsook the LORD, humbled themselves, received some deliverance, and became Shishak''s servants to learn the difference'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/12?lang=eng'
    quote: 'Ye have forsaken me, and therefore have I also left you in the hand of Shishak. … They have humbled themselves; therefore I will not destroy them, but I will grant them some deliverance … Nevertheless they shall be his servants; that they may know my service, and the service of the kingdoms of the countries.'
  - where: 'note 14:25 “Shishak”'
    claim: 'Solomon''s three hundred shields of beaten gold were kept in the house of the forest of Lebanon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/10?lang=eng'
    quote: 'And he made three hundred shields of beaten gold; three pound of gold went to one shield: and the king put them in the house of the forest of Lebanon.'

  - where: christ
    claim: 'The Lord who speaks in D&C 6 is Jesus Christ, and only God knows the thoughts and intents of the heart'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/6?lang=eng'
    quote: 'Behold, I am Jesus Christ, the Son of God.'
  - where: christ
    claim: 'The Lord''s word is a discerner of the thoughts and intents of the heart'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/33?lang=eng'
    quote: 'hearken to the voice of the Lord your God, whose word is quick and powerful … and is a discerner of the thoughts and intents of the heart.'
  - where: christ
    claim: 'The lesson the manual draws: live so as to call on the Lord in a crisis with confidence and faith'
    key: ot-manual-4
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-4?lang=eng'
    quote: 'This incident teaches the great lesson that one should live so that in a crisis he can call upon the Lord with confidence and faith. Jeroboam could not do so, and so he sent his wife instead.'
  - where: explore
    claim: 'KnoWhy 310 sets Abinadi''s disguise beside the biblical disguise stories'
    key: sc-knowhy-310
    url: 'https://scripturecentral.org/knowhy/why-did-abinadi-use-a-disguise'
    quote: 'The story of Abinadi and his use of a disguise is similar to several biblical stories that also deal with prophetic messengers, kings, and disguises.'
