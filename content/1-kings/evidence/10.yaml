chapter: 10
claims:
  - where: setting
    claim: 'The Bible Dictionary lists the Chronicles account and the Isaiah and Jeremiah passages under the queen of Sheba'
    key: bd-sheba
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sheba?lang=eng'
    quote: '(3) Queen of Sheba (1 Kgs. 10:1, 4, 10, 13; 2 Chr. 9:1, 3, 9, 12; also Job 6:19; Ps. 72:10, 15; Isa. 60:6; Jer. 6:20).'
  - where: setting
    claim: 'The Church’s footnote to “queen” points to Jesus’ words in Matthew and Luke'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/10?lang=eng'
    quote: '1a “queen”: Matt. 12:42; Luke 11:31.'
  - where: thread
    claim: 'The Student Manual says Solomon’s love of material things weaned him from his early devotion'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'Solomon allowed his love for material things and his great accomplishments as a builder to wean him from his early devotion to the Lord.'
  - where: thread
    claim: 'The Church’s footnotes to the law of the king point to Solomon’s horses and wives'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/17?lang=eng'
    quote: '16a “horses”: 1 Kgs. 4:26; 2 Chr. 9:28.'

  - where: section 1 plain
    claim: 'The Hebrew of “questions” in verse 3 is matters, concerns, and “meat” in verse 5 is food'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/10?lang=eng'
    quote: '3a “questions”: HEB matters, concerns.'
  - where: section 2 plain
    claim: '“Targets” are shields and the “stays” of the throne are armrests'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/10?lang=eng'
    quote: '19a “stays”: HEB armrests.'
  - where: section 2 plain
    claim: '“Targets” are in Hebrew shields or breastplates'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/10?lang=eng'
    quote: '16a “targets”: HEB shields or breastplates.'
  - where: section 3 plain
    claim: '“Linen yarn” in verse 28 is in Hebrew the country of Kue'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/10?lang=eng'
    quote: '28a “linen yarn”: HEB from Kue (Cilicia). The name of this country is mistakenly translated to be “linen yarn.”'

  - where: 'note 10:1 “The queen of Sheba and her hard questions”'
    claim: 'Sheba’s people gave their name to part of southern Arabia'
    key: bd-sheba
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sheba?lang=eng'
    quote: '(2) Son of Joktan (Gen. 10:28; 1 Chr. 1:22); his descendants gave their name to a portion of southern Arabia (now called Arabia Felix).'
  - where: 'note 10:1 “The queen of Sheba and her hard questions”'
    claim: 'The Hebrew of “concerning the name of the LORD” is lᵉšēm, “for the name,” in this verse'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'לְ/שֵׁ֣ם'
  - where: 'note 10:1 “The queen of Sheba and her hard questions”'
    claim: 'The Septuagint reads the name of Solomon and the name of the Lord, and riddles'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_kings/10.htm'
    quote: 'And the queen of Saba heard of the name of Solomon, and the name of the Lord, and she came to try him with riddles.'
  - where: 'note 10:1 “The queen of Sheba and her hard questions”'
    claim: 'BDB defines ḥîdâ as a riddle or perplexing question, and lists Judges 14:12'
    key: bdb
    url: 'https://biblehub.com/hebrew/2420.htm'
    quote: 'חִידָה noun feminine riddle, enigmatic, perplexing saying or question; — absolute ׳ח Judges 14:12 6t.'
  - where: 'note 10:1 “The queen of Sheba and her hard questions”'
    claim: 'BDB lists this verse as the perplexing questions by which the queen tested Solomon'
    key: bdb
    url: 'https://biblehub.com/hebrew/2420.htm'
    quote: '3 perplexing questions by which queen of Sheba put Solomon to the test (נִסָּה) 1 Kings 10:1 2Chronicles 9:1.'
  - where: 'note 10:9 “To do judgment and justice”'
    claim: 'The Church’s footnote sets the queen’s blessing beside Hiram’s in 1 Kgs. 5:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/10?lang=eng'
    quote: '9a “Blessed”: 1 Kgs. 5:7.'
  - where: 'note 10:9 “To do judgment and justice”'
    claim: 'The Bible Dictionary lists Ps. 72:10, 15 under the queen of Sheba'
    key: bd-sheba
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sheba?lang=eng'
    quote: '(3) Queen of Sheba (1 Kgs. 10:1, 4, 10, 13; 2 Chr. 9:1, 3, 9, 12; also Job 6:19; Ps. 72:10, 15; Isa. 60:6; Jer. 6:20).'
  - where: 'note 10:9 “To do judgment and justice”'
    claim: 'The heading of Psalm 72 reads it as David speaking of Solomon, a type of the Messiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/72?lang=eng'
    quote: 'David speaks of Solomon, who is made a type of the Messiah'

  - where: 'note 10:14 “Where the gold came from, and who paid for it”'
    claim: 'Ophir was probably a port of southern Arabia'
    key: bd-ophir
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ophir?lang=eng'
    quote: '(2) A country whence gold was brought, probably a port of southern Arabia'
  - where: 'note 10:14 “Where the gold came from, and who paid for it”'
    claim: 'The Student Manual says much of the wealth came through economic oppression'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'Part of his wealth came through trading and international commerce, but much of it came through the economic oppression of the people.'
  - where: 'note 10:14 “Where the gold came from, and who paid for it”'
    claim: 'The Student Manual relays that little of the gold reached the average Israelite'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'Certainly more and more money in gold and silver came into Israel every year, but very little of it ever filtered down to the average Israelite, who had to surrender so much of his livelihood to the king’s coffers.'
  - where: 'note 10:14 “Where the gold came from, and who paid for it”'
    claim: 'The Student Manual relays that for the first time Israel had rich and poor'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: '“For the first time in Israel’s history, there began to be a distinct difference between ‘rich’ and ‘poor.’ The king and his household were rich; the common people were poor.'

  - where: thread
    claim: 'The Church’s footnote to “riches” points to 1 Kgs. 3:13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/10?lang=eng'
    quote: '23a “riches”: 1 Kgs. 3:13.'

  - where: 'note 10:28 “Horses out of Egypt”'
    claim: 'The Church’s footnote to “horses” in the law of the king points to 1 Kgs. 4:26 and 2 Chr. 9:28'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/17?lang=eng'
    quote: '16a “horses”: 1 Kgs. 4:26; 2 Chr. 9:28.'
  - where: 'note 10:28 “Horses out of Egypt”'
    claim: 'The Church’s footnote to “wives” in the law of the king points to 1 Kgs. 11:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/17?lang=eng'
    quote: '17a “wives”: 2 Sam. 5:13; 1 Kgs. 11:1; Jacob 1:15; 2:24 (24, 30).'
  - where: 'note 10:28 “Horses out of Egypt”'
    claim: '“Linen yarn” is in Hebrew the country Kue, in Cilicia'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/10?lang=eng'
    quote: '28a “linen yarn”: HEB from Kue (Cilicia). The name of this country is mistakenly translated to be “linen yarn.”'

  - where: christ
    claim: 'The heading of Psalm 72 calls Solomon a type of the Messiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/72?lang=eng'
    quote: 'David speaks of Solomon, who is made a type of the Messiah'
  - where: christ
    claim: 'Matthews: those who heard Jesus did not realize how great their opportunities were'
    key: matthews-jesus-savior-3-nephi
    url: 'https://rsc.byu.edu/book-mormon-3-nephi-9-30-my-gospel/jesus-savior-3-nephi'
    quote: 'Jesus told the unbelieving Jews that they did not appreciate him, nor did they realize how great their opportunities were to be able to see and hear and talk with him daily.'
  - where: christ
    claim: 'Matthews reads Luke 11:31 as Jesus reminding them that the queen came a great distance'
    key: matthews-jesus-savior-3-nephi
    url: 'https://rsc.byu.edu/book-mormon-3-nephi-9-30-my-gospel/jesus-savior-3-nephi'
    quote: 'He reminded them also that the Queen of Sheba came a great distance to hear the wisdom of Solomon, but “behold, a greater than Solomon is here” (Luke 11:31).'
  - where: 'note 10:1 “The queen of Sheba and her hard questions”'
    claim: 'Wherever the house built for the name of the LORD was mentioned, His name would be heard; Israel was known among nations because of the name (Josh. 9:9)'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/1_kings/10.htm'
    quote: 'we may be sure that wherever the grand building was mentioned, there would be heard something about the name of Him to whose honour it was built. In like manner, at an earlier date, the people of Israel were known among other nations ‘because of the name of the Lord.’ See Joshua 9:9'
  - where: 'note 10:1 “The queen of Sheba and her hard questions”'
    claim: 'The Septuagint has she had heard the name of Solomon and the name of the Lord'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/1_kings/10.htm'
    quote: 'the LXX. has ‘she had heard the name of Solomon and the name of the Lord.’'
  - where: 'note 10:1 “The queen of Sheba and her hard questions”'
    claim: 'The same Hebrew, lᵉšēm YHWH, stands in 1 Kgs. 8:20 for the house built for the name of the LORD'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'לְ/שֵׁ֥ם'
