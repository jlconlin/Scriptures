chapter: 3
claims:
  - where: setting
    claim: 'Of the twenty-four verses Joseph Smith changed in 1 Kings, eleven are in chapter 3'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'Of the twenty-four verses changed in 1 Kings, eleven are in chapter 3 and the other thirteen verses (in chapters 11, 13, 14 and 15) all relate to the same topic.'
  - where: setting
    claim: 'All eleven changes in chapter 3 are in verses 1–14'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'There are eleven verses changed in chapter 3 of 1 Kings. All eleven of these changes are in the first half of the chapter, the first fourteen verses.'
  - where: setting
    claim: 'The Church''s footnotes to 1 Kings 3 are cross-references and Hebrew notes; none prints a Joseph Smith Translation reading'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/3?lang=eng'
    quote: '1a “affinity”: HEB a marriage alliance.'
  - where: setting
    claim: 'Scripture Helps quotes the Joseph Smith Translation of 3:14'
    key: scripture-helps-2-samuel-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/24-2-samuel-11-12-1-kings-3-6-9-11?lang=eng'
    quote: 'The Joseph Smith Translation of 1 Kings 3:14 reads, “And if thou wilt walk in my ways to keep my statutes, and my commandments, then I will lengthen thy days'
  - where: setting
    claim: 'Chronicles omits the sacrifice before the ark on Zion and the account of the two women'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/3.htm'
    quote: 'This sacrificial festival upon Zion is omitted in the Chronicles, as well as the following account'
  - where: thread
    claim: 'Saul, David and Solomon all began with promise'
    key: cfm-ot-2026-26
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/26?lang=eng'
    quote: 'Saul, David, and Solomon, the first three kings of Israel, all started out with so much promise.'
  - where: thread
    claim: 'The case of the two women is appended as proof of the wisdom given, a very difficult case'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/3.htm'
    quote: 'As a proof that the Lord had bestowed upon Solomon unusual judicial wisdom, there is appended a decision of his in a very difficult case'
  - where: thread
    claim: 'In the Joseph Smith Translation the Lord is not pleased with the alliance and blesses Solomon for the people''s sake'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/82'
    quote: 'And the Lord was not pleased with Solomon, for he made affinity with Pharaoh, King of Egyp; … and the Lord blessed solomon for the Peoples sake only.'
  - where: section 1 plain
    claim: '“Made affinity” means made a marriage alliance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/3?lang=eng'
    quote: '1a “affinity”: HEB a marriage alliance.'
  - where: section 2 plain
    claim: 'The words rendered “little child” are used of older youths or young men'
    key: scripture-helps-2-kings-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/26-2-kings-2-7?lang=eng'
    quote: 'The same Hebrew words used to describe the youths in this account are also used to describe Solomon after he became king (see 1 Kings 3:7)'
  - where: section 2 plain
    claim: '“Go out or come in” means to lead (JST)'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/82'
    quote: 'and I know not how to lead them, to go out or come in before them'
  - where: section 2 plain
    claim: 'The “understanding heart” is a heart that hears, listens'
    key: bdb
    url: 'https://biblehub.com/hebrew/8085.htm'
    quote: 'f. hear with attention, interest, listen to … absolute לֵב שֹׁמֵעַ 1 Kings 3:9'
  - where: section 3 plain
    claim: 'The mother''s compassion grew warm for her son'
    key: bdb
    url: 'https://biblehub.com/hebrew/3648.htm'
    quote: '1 grow warm and tender, figurative, subject רחמים; ׳רַחֲמָיו אֶלאָֿחִיונ Genesis 43:30 (J), so רַחֲמֶיהָ עַלבְּֿנָהּ ׳נ 1 Kings 3:26'
  - where: section 3 plain
    claim: '“Feared” here is best understood as holding in awe'
    key: ot-minute-1-kings-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-3'
    quote: 'The use of the word “feared” here illustrates perhaps the best way to understand the common Hebrew Bible use for fearing God—“to hold in awe.”'

  - where: 'note 3:1 “A marriage alliance with Egypt”'
    claim: 'Royal marriages were often political, a way of signing a treaty'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'Marriages between royal families were often politically motivated; such a marriage was a way of signing a treaty between two countries.'
  - where: 'note 3:1 “A marriage alliance with Egypt”'
    claim: 'Solomon apparently wished to neutralize Egypt, which had used Canaan as a military base'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'Solomon apparently considered it important to neutralize any hostility on the part of Egypt, for Egypt had been accustomed to using Canaan as a base for military operations.'
  - where: 'note 3:1 “A marriage alliance with Egypt”'
    claim: 'The marriage showed a lack of faith in the Lord'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'the marriage of Solomon to the daughter of the pharaoh showed a lack of faith in the Lord, who had promised to defend Israel and fight her battles'
  - where: 'note 3:1 “A marriage alliance with Egypt”'
    claim: 'This bride is singled out because of Egypt''s standing; Egyptian royalty did not usually marry outside Egypt (Combs)'
    key: ot-minute-1-kings-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-3'
    quote: 'Solomon married many wives to solidify his alliances with various kingdoms, but this unnamed Egyptian princess is noted because of Egypt’s significance as a regional power. Egyptian royalty did not usually wed outside of Egypt'
  - where: 'note 3:1 “A marriage alliance with Egypt”'
    claim: 'JST 3:1: the Lord was not pleased; Solomon took her to wife, into the house of David; the Lord blessed Solomon for the people''s sake only'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/82'
    quote: 'And the Lord was not pleased with Solomon, for he made affinity with Pharaoh, King of Egyp; and took Pharaoh Daughter to wife, and brought her into the house of David'
  - where: 'note 3:1 “A marriage alliance with Egypt”'
    claim: 'Nyman describes the JST additions to verse 1'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'The JST adds at the beginning of the verse that the Lord was not pleased with Solomon for these acts, and further clarifies that Solomon took the Pharaoh’s daughter to wife.'
  - where: 'note 3:1 “A marriage alliance with Egypt”'
    claim: 'Pharaoh''s daughter is named among the strange women Solomon loved'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: 'But king Solomon loved many strange women, together with the daughter of Pharaoh'

  - where: 'note 3:2 “The high places”'
    claim: 'Hilltop altars were an old custom; heathen altars were to be destroyed; altars to Jehovah were built at several high places, local centers of His worship (1 Kgs. 3:2–4 among them)'
    key: bd-high-places
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/high-places?lang=eng'
    quote: 'Altars to Jehovah were built at several high places (Judg. 6:25–26; 1 Sam. 9:12–25; 10:5, 13; 1 Kgs. 3:2–4; 18:30; 1 Chr. 21:26). Such altars became local centers of the worship of Jehovah.'
  - where: 'note 3:2 “The high places”'
    claim: 'When idolatry came in, many were desecrated; Hezekiah and Josiah had them removed, sacrifice only in Jerusalem'
    key: bd-high-places
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/high-places?lang=eng'
    quote: 'When idolatry came in, many of these altars were desecrated and used for heathen worship. Religious reformers like Hezekiah and Josiah tried therefore to centralize the worship more and more in Jerusalem'
  - where: 'note 3:2 “The high places”'
    claim: 'The text is ambiguous whether sacrifice at high places was right; “only” leaves leeway; God appears in the next verse; after the temple, high places were no longer acceptable to the author of Kings (Combs)'
    key: ot-minute-1-kings-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-3'
    quote: 'The text is a little ambiguous about whether it was right for Solomon and the other Israelites to sacrifice on high places. … After the temple was built, high places were no longer acceptable, according to the author of Kings.'
  - where: 'note 3:2 “The high places”'
    claim: '“Only” gives leeway for Solomon''s actions to be justified, since God appears to him in the next verse'
    key: ot-minute-1-kings-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-3'
    quote: '“Only” gives enough leeway in the description for Solomon’s actions at high places to be justified, especially since God appears to Solomon in the next verse.'

  - where: 'note 3:3 “How Solomon came to love the LORD”'
    claim: 'JST 3:3 as Nyman prints it'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'And because the Lord blessed Solomon as he was walking in the statutes of David, his father, he began to love the Lord, and he sacrificed and burnt incense in high places, and he called on the name of the Lord.'
  - where: 'note 3:3 “How Solomon came to love the LORD”'
    claim: 'The manuscript of JST 3:3–5'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/82'
    quote: 'And because the Lord blessed Solomon as he was walking in the statutes of David his Father, he began to Love the Lord; & he sacrifised and burnt incense in high places, and he called on the name of the Lord.'
  - where: 'note 3:3 “How Solomon came to love the LORD”'
    claim: 'JST 3:4–5: Gibeon was in a great high place; the Lord God hearkened unto Solomon'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/82'
    quote: 'for Gibeon was in a great high place; and Solomon offered upon that alter, in Gibeon, a thousand burnt offerings. And the Lord God harkened unto Solomon, and appeared unto him'
  - where: 'note 3:3 “How Solomon came to love the LORD”'
    claim: 'Nyman: Solomon''s love was a growth from blessings given for the people''s righteousness'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'The JST additions show that Solomon’s love for the Lord was a growth process as a result of the blessings which the Lord poured out upon Solomon because of the righteousness of the people'
  - where: 'note 3:3 “How Solomon came to love the LORD”'
    claim: 'Nyman: verse 4 gives the reason Solomon went to Gibeon, “in a great high place”; the appearance answers Solomon''s calling on the Lord'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'It shows that the reason why Solomon went to Gibeon to sacrifice was that Gibeon was in a great high place, rather than that it was the great high place as stated in the KJV. … The JST shows that the Lord’s appearance was in response to Solomon’s calling upon the name of the Lord, which was added to the end of verse 3. It reads, “And the Lord God hearkened unto Solomon, and appeared. . . .”'

  - where: 'note 3:4 “Why Gibeon, and then the ark”'
    claim: 'At Gibeon was the tabernacle Moses made and the brazen altar on which Solomon offered a thousand burnt offerings'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/1?lang=eng'
    quote: 'for there was the tabernacle of the congregation of God, which Moses the servant of the Lord had made in the wilderness.'
  - where: 'note 3:4 “Why Gibeon, and then the ark”'
    claim: 'David had brought the ark to a tent at Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/1?lang=eng'
    quote: 'But the ark of God had David brought up from Kirjath-jearim to the place which David had prepared for it: for he had pitched a tent for it at Jerusalem.'
  - where: 'note 3:4 “Why Gibeon, and then the ark”'
    claim: 'The priests served before the tabernacle in the high place at Gibeon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/16?lang=eng'
    quote: 'And Zadok the priest, and his brethren the priests, before the tabernacle of the Lord in the high place that was at Gibeon,'
  - where: 'note 3:4 “Why Gibeon, and then the ark”'
    claim: 'The great bamah at Gibeon was the Mosaic tabernacle, without the ark'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/3.htm'
    quote: 'At that time the great or principal bamah was at Gibeon … namely, the Mosaic tabernacle (2 Chronicles 1:3), which is called הבּמה, because the ark of the covenant, with which Jehovah had bound up His gracious presence, was not there now.'
  - where: 'note 3:4 “Why Gibeon, and then the ark”'
    claim: 'What was wanting at Gibeon, the ark, was supplied by a direct revelation in a dream'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/3.htm'
    quote: 'The one thing wanting in the place of sacrifice at Gibeon, viz., the ark of the covenant with the gracious presence of Jehovah, was supplied by the Lord in the case of this sacrifice by a direct revelation in a dream'
  - where: 'note 3:4 “Why Gibeon, and then the ark”'
    claim: 'At Jerusalem Solomon thanked the Lord again with offerings before the ark'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/3.htm'
    quote: 'Solomon thanked the Lord again for this promise after his return to Jerusalem, by offering burnt-offerings and thank-offerings before the ark of the covenant'

  - where: 'note 3:7 “A little child who could not go out or come in”'
    claim: 'The same Hebrew words describe the youths of 2 Kgs. 2:23 and Solomon in 3:7'
    key: scripture-helps-2-kings-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/26-2-kings-2-7?lang=eng'
    quote: 'The same Hebrew words used to describe the youths in this account are also used to describe Solomon after he became king (see 1 Kings 3:7)'
  - where: 'note 3:7 “A little child who could not go out or come in”'
    claim: 'The youths of 2 Kgs. 2:23 were older youths or young men'
    key: scripture-helps-2-kings-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/26-2-kings-2-7?lang=eng'
    quote: 'The Hebrew text indicates that these were not young children but older youths or even young men.'
  - where: 'note 3:7 “A little child who could not go out or come in”'
    claim: 'Hunter: Solomon was less than twenty'
    key: hunter-understanding-heart-1962
    url: 'https://scripturecentral.org/archive/periodicals/magazine-article/understanding-heart'
    quote: 'It became the task of this young man, then less than twenty years of age, to weld this great empire into a unity.'
  - where: 'note 3:7 “A little child who could not go out or come in”'
    claim: 'Combs: humility; rabbis twelve, Josephus fourteen; the Rehoboam puzzle'
    key: ot-minute-1-kings-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-3'
    quote: 'We assume that Solomon called himself a little child to express humility. Talmudic rabbis calculate Solomon to have been twelve years old at the beginning of his reign, and Josephus thought he was fourteen.'
  - where: 'note 3:7 “A little child who could not go out or come in”'
    claim: 'Combs: either the passage is out of order or Rehoboam was already born'
    key: ot-minute-1-kings-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-3'
    quote: 'So either this passage is chronologically out of order, or Solomon was old enough to have an infant Rehoboam at this point in the narrative.'
  - where: 'note 3:7 “A little child who could not go out or come in”'
    claim: 'JST 3:7–8: I know not how to lead them; as a little child in the midst of thy people'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/82'
    quote: 'and I know not how to lead them, to go out or come in before them; and thy servant am as a little child, in the mids of thy people'

  - where: 'note 3:9 “A hearing heart”'
    claim: 'The Hebrew is lēb šōmēaʿ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'שֹׁמֵ֨עַ֙'
  - where: 'note 3:9 “A hearing heart”'
    claim: 'BDB lists the phrase under hear with attention, listen'
    key: bdb
    url: 'https://biblehub.com/hebrew/8085.htm'
    quote: 'f. hear with attention, interest, listen to … absolute לֵב שֹׁמֵעַ 1 Kings 3:9'
  - where: 'note 3:9 “A hearing heart”'
    claim: 'Israelites thought the heart the source of thoughts; not a request for empathy; better “discerning mind” (Combs)'
    key: ot-minute-1-kings-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-3'
    quote: 'The ancient Israelites believed the heart was where thoughts came from. … It is a mistake to imply that Solomon was seeking greater empathy in his request for an “understanding heart.” The phrase would be better translated as “discerning mind.”'

  - where: 'note 3:11 “What Solomon did not ask for”'
    claim: 'Hunter: Solomon had enemies without and within'
    key: hunter-understanding-heart-1962
    url: 'https://scripturecentral.org/archive/periodicals/magazine-article/understanding-heart'
    quote: 'Solomon might have asked the Lord to give him power over his enemies, for he had enemies from without the empire, and he had personal enemies within.'
  - where: 'note 3:11 “What Solomon did not ask for”'
    claim: 'Hunter: not material things but a spiritual gift'
    key: hunter-understanding-heart-1962
    url: 'https://scripturecentral.org/archive/periodicals/magazine-article/understanding-heart'
    quote: 'He did not ask for material things of the world, but a spiritual gift—an understanding heart.'

  - where: 'note 3:14 “As thy father David did walk”'
    claim: 'The manuscript of JST 3:14'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/83'
    quote: '14th. And if thou wilt walk in my ways, to keep my stat— uts, & my commandments, then I will lengthen thy days, and thou shalt not walk in unrighteousness as did thy Father David'
  - where: 'note 3:14 “As thy father David did walk”'
    claim: 'Scripture Helps: David righteous and loyal, but not everything righteous, above all with Bathsheba and Uriah'
    key: scripture-helps-2-samuel-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/24-2-samuel-11-12-1-kings-3-6-9-11?lang=eng'
    quote: 'However, there are instances when the Joseph Smith Translation seems to emphasize that not everything David did was righteous. This would certainly be true of his actions with Bathsheba and Uriah.'
  - where: 'note 3:14 “As thy father David did walk”'
    claim: 'Scripture Helps: the Lord used David as an example of what kings should and should not do'
    key: scripture-helps-2-samuel-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/24-2-samuel-11-12-1-kings-3-6-9-11?lang=eng'
    quote: 'The portrayal of David in scripture and the Joseph Smith Translation helps us see that the Lord used David as an example of what future kings should and should not do.'
  - where: 'note 3:14 “As thy father David did walk”'
    claim: 'Scripture Helps lists the other such revisions, and notes that not all were revised'
    key: scripture-helps-2-samuel-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/24-2-samuel-11-12-1-kings-3-6-9-11?lang=eng'
    quote: 'Other examples include the Joseph Smith Translation for 1 Kings 11:4, 6, 33, 38–39; 14:8; 15:3, 5, 11 (see Old Testament Revision 2, 76–77, josephsmithpapers.org). It should be noted that not all such passages were revised.'
  - where: 'note 3:14 “As thy father David did walk”'
    claim: 'JST 3:6: great things according to thy mercy, when he walked before thee in truth'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/82'
    quote: 'thou hast shewed unto thy Servant David my Father, great things according to thy mercy, when he walked before thee in truth'
  - where: 'note 3:14 “As thy father David did walk”'
    claim: 'Nyman: the 3:6 change shows David''s character and that blessings depend on obedience (D&C 130:20–21)'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'This qualifying change shows the true character of David, and also illustrates that blessings are dependent upon obedience to law (see D&C 130:20–21).'
  - where: 'note 3:14 “As thy father David did walk”'
    claim: 'One older reading: the promise of long life was not fulfilled because Solomon did not keep the condition'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/3.htm'
    quote: 'This last promise was not fulfilled, because Solomon did not observe the condition (cf. 1 Kings 11:42).'

  - where: 'note 3:16 “A case with no witness”'
    claim: 'The case is appended as proof of the wisdom given; a very difficult case'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/3.htm'
    quote: 'As a proof that the Lord had bestowed upon Solomon unusual judicial wisdom, there is appended a decision of his in a very difficult case, in which Solomon had shown extraordinary intelligence.'
  - where: 'note 3:16 “A case with no witness”'
    claim: 'Combs: the narrator names them harlots once, then only women; equity regardless of status'
    key: ot-minute-1-kings-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-3'
    quote: 'The narrator tells us right away that both women were harlots but then never mentions that again, only referring to them as women. … It didn’t matter to Solomon that these women were far below his social status.'
  - where: 'note 3:16 “A case with no witness”'
    claim: 'Combs: biblical law''s equitable nature'
    key: ot-minute-1-kings-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-kings-3'
    quote: 'One of the most unique aspects of biblical law that became a foundational point for later law is its equitable nature.'

  - where: 'note 3:26 “Her bowels yearned”'
    claim: 'raḥămîm is compassion, connected by many with reḥem, womb; motherly feeling'
    key: bdb
    url: 'https://biblehub.com/hebrew/7356.htm'
    quote: 'absolute plural intensive compassion (according to many denominative from רֶחֶם, originally brotherhood, brotherly feeling, of those born from same womb … or motherly feeling'
  - where: 'note 3:26 “Her bowels yearned”'
    claim: 'The verb means grow warm and tender; same construction in Gen. 43:30'
    key: bdb
    url: 'https://biblehub.com/hebrew/3648.htm'
    quote: '1 grow warm and tender, figurative, subject רחמים; ׳רַחֲמָיו אֶלאָֿחִיונ Genesis 43:30 (J), so רַחֲמֶיהָ עַלבְּֿנָהּ ׳נ 1 Kings 3:26'
  - where: 'note 3:26 “Her bowels yearned”'
    claim: 'The Hebrew verb of 3:26 is nikmᵉrû'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'נִכְמְר֣וּ'
  - where: 'note 3:26 “Her bowels yearned”'
    claim: 'Student Manual: the woman willing to give up the baby would be the best mother, natural or not'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'The brilliance of Solomon’s strategy is seen when one reflects that the woman who was willing to give up the baby rather than see it killed would be the best mother to the child, whether she was the natural mother or not.'

