chapter: 7
claims:
  - where: 'setting'
    claim: 'Chronicles gives no description of Solomon’s own house; the Septuagint moves verses 1–12 to the end of the chapter'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/1_kings/7.htm'
    quote: 'The LXX. transfers all this section 1–12 to the end of the chapter. In Chronicles, though Solomon’s own house is alluded to (2 Chronicles 7:11; 2 Chronicles 8:1), there is no description of it.'
  - where: 'setting'
    claim: 'Worshippers remained outside the temple; only the priests went within'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'The small size of the temple proper in comparison with modern churches is to be noticed. It is sufficiently accounted for by the fact that the worshippers remained outside; only the priests went within.'
  - where: 'thread'
    claim: 'The brazen sea stood between the altar and the porch; the lavers on each side; the furnishings within were new and of gold'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'In the Holy Place all was new. … Between the altar and the porch was the brazen sea for the washing of the priests.'
  - where: 'thread'
    claim: 'The courtyard was the place of the people’s involvement with the temple; the interior unseen'
    key: meyers-jachin-boaz
    url: 'https://rsc.byu.edu/temple-antiquity/jachin-boaz-religious-political-perspective'
    quote: 'the inside of the temple was essentially off limits, unseen by the population as a whole or even by the general clergy.'
  - where: 'note 7:21 “Jachin and Boaz”'
    claim: 'The pillars can be linked to paired gateposts in Near Eastern royal art'
    key: meyers-jachin-boaz
    url: 'https://rsc.byu.edu/temple-antiquity/jachin-boaz-religious-political-perspective'
    quote: 'These pillars can be linked iconographically to the paired gateposts described above, as known in Near Eastern royal art.'
  - where: 'note 7:21 “Jachin and Boaz”'
    claim: 'The courtyard was the place of sacrifice, song and procession'
    key: meyers-jachin-boaz
    url: 'https://rsc.byu.edu/temple-antiquity/jachin-boaz-religious-political-perspective'
    quote: 'The courtyard of the temple was thus the focus of “public” involvement with the temple, the place of sacrifice, of justice, of song and dance, of procession.'
  - where: 'note 7:1 “Thirteen years for the king’s house”'
    claim: 'The palace took longer because it was larger; the temple was small and had years of preparation behind it'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/1_kings/7.htm'
    quote: 'The longer time occupied by this building, in comparison with the seven years and a half spent on the Temple, is accounted for by the greater extent of this latter work. The Temple was comparatively a small edifice, and for it years of preparation had preceded the actual work'
  - where: 'note 7:1 “Thirteen years for the king’s house”'
    claim: 'The thirteen years followed the seven, twenty years in all; the palace was several connected buildings'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/7.htm'
    quote: 'The thirteen years are to be reckoned after the completion of the temple in seven years, so that the two buildings were executed in twenty years (1 Kings 9:10). The expression כּל־בּיתו is used, because the palace consisted of several buildings connected together'
  - where: 'note 7:1 “Thirteen years for the king’s house”'
    claim: 'The parts of the palace: the forest of Lebanon, the pillar-hall, the throne-room and judgment-hall, the king’s dwelling and the house of Pharaoh’s daughter'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/7.htm'
    quote: '(1) the house of the forest of Lebanon (1 Kings 7:2-5); (2) the pillar-hall with the porch (1 Kings 7:6); (3) the throne-room and judgment-hall (1 Kings 7:7); (4) the king''s dwelling-house and the house of Pharaoh''s daughter (1 Kings 7:8).'
  - where: 'note 7:1 “Thirteen years for the king’s house”'
    claim: 'The house of the forest of Lebanon was named for its forest of cedar pillars, and served also to keep arms'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/7.htm'
    quote: 'This building - so named because it was built, so to speak, of a forest of cedar pillars - is called in the Arabic the "house of his arms," because, according to 1 Kings 10:17, it also served as a keeping-place for arms'
  - where: 'note 7:1 “Thirteen years for the king’s house”'
    claim: 'The temple and the king’s house counted together as twenty years; the house of the forest was a hundred cubits by fifty'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/7?lang=eng'
    quote: 'But Solomon was building his own house thirteen years, and he finished all his house. He built also the house of the forest of Lebanon; the length thereof was an hundred cubits, and the breadth thereof fifty cubits'
  - where: 'note 7:14 “Hiram the craftsman”'
    claim: 'Chronicles makes Hiram’s mother a woman of Dan and widens his skills to gold, silver, iron, stone, timber and cloth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/2?lang=eng'
    quote: 'The son of a woman of the daughters of Dan, and his father was a man of Tyre, skilful to work in gold, and in silver, in brass, in iron, in stone, and in timber, in purple, in blue, and in fine linen'
  - where: 'note 7:14 “Hiram the craftsman”'
    claim: 'The two tribes reconciled: a Danite woman whose first husband was of Naphtali; there was a fitness in a half-Israelite working on the temple'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/1_kings/7.htm'
    quote: 'The two may be reconciled if we suppose the woman to have belonged to Dan, and her first husband to have been of the tribe of Naphtali. … There seems to have been a fitness in the circumstance that Hiram, by birth half an Israelite, should be employed on the work of Solomon’s temple.'
  - where: 'note 7:14 “Hiram the craftsman”'
    claim: 'Hiram’s credentials emphasize the artistry of the pillars; the verse’s “brass” is “bronze” in a modern rendering'
    key: meyers-jachin-boaz
    url: 'https://rsc.byu.edu/temple-antiquity/jachin-boaz-religious-political-perspective'
    quote: 'If there be any doubt as to their striking appearance, the credentials of the artisan, whose Tyrian father was a “worker in bronze . . . full of wisdom, understanding, and skill” (1 Kgs 7:14), serve to emphasize the artistry involved.'
  - where: 'note 7:21 “Jachin and Boaz”'
    claim: 'Jachin can mean “he will establish,” Boaz “in strength”; the pillars may have represented a gate from earthly to holy space'
    key: scripture-helps-2-samuel-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/24-2-samuel-11-12-1-kings-3-6-9-11?lang=eng'
    quote: 'The pillar on the right was inscribed with the name Jachin, which can mean “he will establish” or “he establishes.” The pillar on the left was inscribed with the name Boaz, which can mean “by (his) strength” or “in strength.” These pillars may have represented a gate'
  - where: 'note 7:21 “Jachin and Boaz”'
    claim: 'The pillars were hollow brass, 23 cubits high with their capitals, in front of the porch'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'In front of the porch stood two great pillars of hollow brass, called Jachin and Boaz. These with their capitals were 23 cubits high.'
  - where: 'note 7:21 “Jachin and Boaz”'
    claim: 'The text’s problems make a secure reconstruction of their form and place virtually impossible'
    key: meyers-jachin-boaz
    url: 'https://rsc.byu.edu/temple-antiquity/jachin-boaz-religious-political-perspective'
    quote: 'As a result of these two problems, it has been virtually impossible to establish a secure reconstruction of either their appearance or, equally significant, their architectural placement and function.'
  - where: 'note 7:21 “Jachin and Boaz”'
    claim: 'They are described not with the structure but at the head of Hiram’s bronze vessels; seemingly without structural use'
    key: meyers-jachin-boaz
    url: 'https://rsc.byu.edu/temple-antiquity/jachin-boaz-religious-political-perspective'
    quote: 'Jachin and Boaz stand at the beginning of the series of bronze vessels [4] made by the craftsman Hiram of Tyre, as outlined in 1 Kings 7:13–45. Seemingly without structural significance'
  - where: 'note 7:21 “Jachin and Boaz”'
    claim: 'Such pillars flanked the entrances of other temples, most notably Tell Tainat'
    key: meyers-jachin-boaz
    url: 'https://rsc.byu.edu/temple-antiquity/jachin-boaz-religious-political-perspective'
    quote: 'the existence of such pillars flanking the entrances to other sacred structures of the ancient world was established. The most notable example is the temple of Tell Tainat'
  - where: 'note 7:21 “Jachin and Boaz”'
    claim: 'Jachin and Boaz were considerably larger than the column bases found at other temples’ entrances'
    key: meyers-jachin-boaz
    url: 'https://rsc.byu.edu/temple-antiquity/jachin-boaz-religious-political-perspective'
    quote: 'it becomes clear that Jachin and Boaz were considerably larger.'
  - where: 'note 7:21 “Jachin and Boaz”'
    claim: 'The pillars were publicly visible while the interior was unseen; the courtyard was the place of public involvement'
    key: meyers-jachin-boaz
    url: 'https://rsc.byu.edu/temple-antiquity/jachin-boaz-religious-political-perspective'
    quote: 'the public visibility of the pillars in contrast to the invisibility of the temple’s interior. … The courtyard of the temple was thus the focus of “public” involvement with the temple'
  - where: 'note 7:21 “Jachin and Boaz”'
    claim: 'The pillars signified the LORD’s entry into his house with the ark and heralded the legitimacy of the Davidic dynasty'
    key: meyers-jachin-boaz
    url: 'https://rsc.byu.edu/temple-antiquity/jachin-boaz-religious-political-perspective'
    quote: 'The pillars signified the historic passage of Yahweh, as symbolized by the ark, into the earthly counterpart of his cosmic dwelling. … they heralded the enormously significant fact of the legitimacy of Solomonic rule.'
  - where: 'note 7:23 “Water for washing”'
    claim: 'The lavers washed what was offered for burnt offering; the sea was for the priests to wash in; Chronicles counts three thousand baths'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/4?lang=eng'
    quote: 'it received and held three thousand baths. … such things as they offered for the burnt offering they washed in them; but the sea was for the priests to wash in.'
  - where: 'note 7:23 “Water for washing”'
    claim: 'The sea stood between the altar and the porch; five lavers on each side of the altar'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'Between the altar and the porch was the brazen sea for the washing of the priests. … On each side of the altar were five figured brazen stands for five brazen lavers for washing the sacrifices (1 Kgs. 7:38–39).'
  - where: 'note 7:23 “Water for washing”'
    claim: 'The sea weighed over twenty-five tons and held at least twelve thousand gallons'
    key: cowan-ot-temples
    url: 'https://rsc.byu.edu/ascending-mountain-lord/what-old-testament-temples-can-teach-us-about-our-own-temple-activity'
    quote: 'Another was the “molten sea” or large font of bronze, which … weighed over twenty-five tons, and had a capacity of at least twelve thousand gallons.'
  - where: 'note 7:23 “Water for washing”'
    claim: 'The ten smaller basins were on wheels, for washing the sacrificial animals'
    key: madsen-solomons-temple
    url: 'https://rsc.byu.edu/eye-faith/solomons-temple-compared-salt-lake-temple'
    quote: 'its gigantic yam or sea on the backs of twelve oxen for purification of the priests, and the other ten smaller basins on wheels for washing the sacrificial animals.'
  - where: 'note 7:25 “Twelve oxen”'
    claim: 'The twelve oxen were symbolic of the twelve tribes'
    key: cowan-ot-temples
    url: 'https://rsc.byu.edu/ascending-mountain-lord/what-old-testament-temples-can-teach-us-about-our-own-temple-activity'
    quote: 'It was mounted on the backs of twelve oxen, three facing toward each of the cardinal points of the compass (1 Kings 7:23–26).[22] These twelve oxen were symbolic of the twelve tribes of Israel.'
  - where: 'note 7:25 “Twelve oxen”'
    claim: 'Oxen often represent the twelve tribes in scripture; the twelve oxen given at the tabernacle’s dedication'
    key: brandt-oxen-fonts
    url: 'https://www.churchofjesuschrist.org/study/ensign/1993/03/i-have-a-question/why-are-oxen-used-in-the-design-of-our-temples-baptismal-fonts?lang=eng'
    quote: 'Oxen are often used in the scriptures to represent the twelve tribes of Israel. … Among them were six wagons drawn by twelve oxen for the proper transport of the tabernacle. (See Num. 7:2–8.)'
  - where: 'note 7:25 “Twelve oxen”'
    claim: 'Ahaz removed the oxen; they or replacements may have been restored, since Jeremiah reports Babylon destroyed the twelve bulls'
    key: brandt-oxen-fonts
    url: 'https://www.churchofjesuschrist.org/study/ensign/1993/03/i-have-a-question/why-are-oxen-used-in-the-design-of-our-temples-baptismal-fonts?lang=eng'
    quote: 'King Ahaz of Judah remodeled the “sea” by removing the oxen and setting the font upon a stone foundation. (See 2 Kgs. 16:17.) The original oxen or their replacements may have been restored later'
  - where: 'note 7:25 “Twelve oxen”'
    claim: 'Fonts in latter-day temples since Nauvoo follow the ancient pattern; most stand on twelve oxen'
    key: brandt-oxen-fonts
    url: 'https://www.churchofjesuschrist.org/study/ensign/1993/03/i-have-a-question/why-are-oxen-used-in-the-design-of-our-temples-baptismal-fonts?lang=eng'
    quote: 'Baptismal fonts in latter-day temples since the Nauvoo Temple have followed the ancient pattern wherever possible. … most fonts stand upon the statues representing the twelve oxen.'
  - where: 'christ'
    claim: 'The oxen also signify the strength and power on which God has established his work'
    key: brandt-oxen-fonts
    url: 'https://www.churchofjesuschrist.org/study/ensign/1993/03/i-have-a-question/why-are-oxen-used-in-the-design-of-our-temples-baptismal-fonts?lang=eng'
    quote: 'the twelve oxen represent the tribes of Israel and also signify the strength and power on which God has established his work for the children of mankind.'
  - where: 'note 7:25 “Twelve oxen”'
    claim: 'Fonts in houses of the Lord today rest on twelve oxen representing the twelve tribes'
    key: scripture-helps-2-samuel-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/24-2-samuel-11-12-1-kings-3-6-9-11?lang=eng'
    quote: 'Today, baptismal fonts in houses of the Lord similarly rest upon the backs of 12 oxen sculptures that represent the twelve tribes of Israel.'
  - where: 'note 7:25 “Twelve oxen”'
    claim: 'The chapter heading calls the sea a baptismal font'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/7?lang=eng'
    quote: 'The molten sea (baptismal font) rests on the backs of twelve oxen.'
  - where: 'note 7:48 “Gold within”'
    claim: 'The Church’s footnote at verse 51 ties David’s dedicated things to 2 Sam. 8:11, the spoil of the nations he subdued'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/8?lang=eng'
    quote: 'Which also king David did dedicate unto the LORD, with the silver and gold that he had dedicated of all nations which he subdued'
  - where: 'note 7:48 “Gold within”'
    claim: 'The furniture was like but not the same as the tabernacle’s: a cedar incense altar overlaid with gold; ten candlesticks and ten tables'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'The furniture of the temple was similar to but not identical with that of the tabernacle. … The altar of incense was made of cedarwood overlaid with gold. Instead of one golden candlestick and one table of shewbread there were ten, five on each side.'
  - where: 'note 7:48 “Gold within”'
    claim: 'Only the priests went within; the worshippers remained outside'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'the worshippers remained outside; only the priests went within.'
  - where: 'note 7:48 “Gold within”'
    claim: 'The verses list the gold altar, table, candlesticks and vessels, and David’s dedicated things'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/7?lang=eng'
    quote: 'And Solomon made all the vessels that pertained unto the house of the LORD: the altar of gold, and the table of gold, whereupon the shewbread was'
  - where: 'christ'
    claim: 'Oxen can also represent the strength and power of Jesus Christ'
    key: scripture-helps-2-samuel-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/24-2-samuel-11-12-1-kings-3-6-9-11?lang=eng'
    quote: 'Oxen can also represent the strength and power of Jesus Christ.'
  - where: 'christ'
    claim: 'Joseph Smith taught the font was a similitude of the grave; the faithful are those on whom God’s work rests, as fonts rest on the oxen'
    key: brandt-oxen-fonts
    url: 'https://www.churchofjesuschrist.org/study/ensign/1993/03/i-have-a-question/why-are-oxen-used-in-the-design-of-our-temples-baptismal-fonts?lang=eng'
    quote: 'Those who are obedient and faithful to their covenants are the covenant family chosen to accomplish God’s purposes. They are the ones upon whom his work “rests,” just as the temple fonts rest upon the backs of the oxen.'
