chapter: 13
claims:
  - where: setting
    claim: 'The Lord sent a prophet from Judah to warn Jeroboam; Jeroboam did not repent'
    key: scripture-helps-1-kings
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/25-1-kings-12-13-17-22?lang=eng'
    quote: 'The Lord sent a prophet from Judah to warn Jeroboam about his wickedness and idolatry. Despite witnessing miraculous signs of the Lord’s power, Jeroboam did not repent and continued to promote idol worship.'
  - where: setting
    claim: 'The mission was a protest against Jeroboam''s worship at its first introduction'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/13.htm'
    quote: 'the Lord would enter an energetic protest against the idolatrous worship of Jeroboam at its first introduction, to guard those who feared God in Israel'
  - where: setting
    claim: 'The chapter heading: the man of God is slain by a lion for his disobedience'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/13?lang=eng'
    quote: 'The prophet delivers his message, is led astray by a prophet from Bethel, and is slain by a lion for his disobedience—Jeroboam continues false worship in Israel.'
  - where: thread
    claim: 'The man of God should have obeyed the command God gave him'
    key: ot-manual-4
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-4?lang=eng'
    quote: 'The young prophet should have obeyed God.'
  - where: section 2 plain
    claim: 'JST 13:18 reading'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/13?lang=eng'
    quote: 'JST 1 Kgs. 13:18 … drink water, that I may prove him; and he lied not unto him.'
  - where: 'note 13:2 “A king named before his birth”'
    claim: 'Josiah breaks the altar, burns bones on it and pollutes it according to the word of the man of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng'
    quote: 'took the bones out of the sepulchres, and burned them upon the altar, and polluted it, according to the word of the LORD which the man of God proclaimed, who proclaimed these words.'
  - where: 'note 13:2 “A king named before his birth”'
    claim: 'Josiah''s reformation reached the northern tribes'
    key: bd-josiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/josiah?lang=eng'
    quote: 'he made, under the guidance of Hilkiah, a thorough religious reformation, which extended to the northern tribes.'
  - where: 'note 13:4 “The hand stretched out against the prophet”'
    claim: '“Entreat the face” is to appease, literally to make the face sweet or pleasant'
    key: bdb
    url: 'https://biblehub.com/hebrew/2470.htm'
    quote: 'Pi`el followed by מְּנֵי, מָּנֶיךָ, מָּנַיִךְ = mollify, appease, entreat the favour of, literally make the face of any one sweet or pleasant'
  - where: 'note 13:4 “The hand stretched out against the prophet”'
    claim: 'The verb in 13:6 is chalah (H2470)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'חַל'
  - where: 'note 13:9 “Why he could not eat or drink in Bethel”'
    claim: 'Jeroboam invited him to win him over and make his threat harmless, not to honor him'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/13.htm'
    quote: 'he endeavoured to gain him over to his side by friendliness, that at least he might render his threat harmless in the eyes of the people. For this purpose, and not to do him honour or to make him some acknowledgment for the restoration of his hand'
  - where: 'note 13:9 “Why he could not eat or drink in Bethel”'
    claim: 'The refusal declared God''s rejection of Jeroboam''s worship more strongly; the road so none could delay him'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/13.htm'
    quote: 'But this design was also frustrated, and the rejection of his worship on the part of God was still more strongly declared. … He was not to return by the way by which he came, that no one might look out for him, and force him to a delay which was irreconcilable with his commission'
  - where: 'note 13:18 “The lie, and Joseph Smith''s revision”'
    claim: 'The footnote''s JST reading of 13:18'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/13?lang=eng'
    quote: 'JST 1 Kgs. 13:18 … drink water, that I may prove him; and he lied not unto him.'
  - where: 'note 13:18 “The lie, and Joseph Smith''s revision”'
    claim: 'The manuscript''s reading of 13:18'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/84'
    quote: 'bring him back with thee into thine house, that he may eat bread and drink water, that I may proove him; and he lied not unto him,'
  - where: 'note 13:18 “The lie, and Joseph Smith''s revision”'
    claim: 'Nyman: the JST shows the purpose of the old prophet''s errand and that he lied not'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'The JST adds an additional phrase showing the purpose of the old prophet’s escapade and also adds that the old prophet lied not.'
  - where: 'note 13:21 “Why the man of God died”'
    claim: 'Student Manual: true prophets obey; the revision of v. 18 helps; the young prophet should have obeyed'
    key: ot-manual-4
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-4?lang=eng'
    quote: 'True prophets obey the word of God; false prophets do not. … “There are some problems in this story … Some help is available in the [Joseph Smith Translation] of verse 18 … The young prophet should have obeyed God.”'
  - where: 'note 13:21 “Why the man of God died”'
    claim: 'Not reaching the sepulchre of his fathers means an untimely death and burial away from his homeland, a great tragedy'
    key: ot-manual-4
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-4?lang=eng'
    quote: 'would meet an untimely death and not be buried in his homeland. The ancient Hebrews believed it a great tragedy not to be buried properly.'
  - where: 'note 13:24 “The lion that stood by the body”'
    claim: 'Some biblical passages attribute to Jehovah the use of real lions to execute punishment, 1 Kgs. 13:24–26 and 2 Kgs. 17:25–26'
    key: pike-micah
    url: 'https://rsc.byu.edu/they-shall-grow-together/passages-book-micah-book-mormon'
    quote: 'And some biblical passages attribute to Jehovah the use of real lions to execute his punishment on people (e.g., 1 Kings 13:24–26; 2 Kings 17:25–26).'
  - where: 'note 13:31 “Buried beside the man of God”'
    claim: 'Josiah left the bones of the man of God and of the prophet from Samaria'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng'
    quote: 'And he said, Let him alone; let no man move his bones. So they let his bones alone, with the bones of the prophet that came out of Samaria.'
  - where: 'note 13:32 “Samaria before there was a Samaria”'
    claim: 'Samaria was built by Omri and made the capital of Israel'
    key: bd-samaria
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samaria?lang=eng'
    quote: 'So called from Shemer, its first owner (1 Kgs. 16:24); a city built by Omri and made the capital of the kingdom of Israel.'
  - where: 'note 13:32 “Samaria before there was a Samaria”'
    claim: '“Cities of Samaria” is the author''s, used proleptically; only Bethel and Dan had such shrines then'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/13.htm'
    quote: 'The expression "cities of Samaria" belongs to the author of these books, and is used proleptically of the kingdom of the ten tribes, which did not receive this name till after the building of the city of Samaria … the only other erection at that time beside the one at Bethel was a temple of the high places at Dan.'
  - where: 'note 13:33 “Priests of whoever wished”'
    claim: 'To fill the hand means to consecrate'
    key: bdb
    url: 'https://biblehub.com/hebrew/4390.htm'
    quote: 'consecrate מִלְאוּ יֶדְכֶם ליהוה; (literally fill the hand) Exodus 32:29'
  - where: 'note 13:33 “Priests of whoever wished”'
    claim: 'The Hebrew of 13:33 has “fill his hand”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'יְמַלֵּ֣א'
  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary'
  - where: christ
    claim: 'The young prophet should have obeyed God'
    key: ot-manual-4
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-4?lang=eng'
    quote: 'The young prophet should have obeyed God.'
