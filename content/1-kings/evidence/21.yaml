chapter: 21
claims:
  - where: setting
    claim: 'Ahab made Jezreel, a city on a hill rising out of the plain, his capital'
    key: bd-jezreel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jezreel?lang=eng'
    quote: 'A city on a hill rising out of the plain, belonging to the tribe of Issachar (Josh. 19:18). Ahab made it his capital (1 Kgs. 18:45–46; 21:1, 23; 2 Kgs. 8:29)'
  - where: setting
    claim: 'Ahab was the most wicked and powerful king of the north; the story of Naboth is another instance of Jezebel''s influence over him'
    key: bd-ahab
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ahab?lang=eng'
    quote: 'the most wicked and most powerful of the kings of northern Israel … We have another instance of Jezebel’s evil influence over Ahab in the story of Naboth (1 Kgs. 21).'
  - where: setting
    claim: 'The chapter falls into the seizure (1–15/16), Elijah''s sentence (16–26), and Ahab''s humbling and the deferral (27–29)'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/21.htm'
    quote: 'paved the way for the forcible seizure of the desired possession by the shameful execution of Naboth (1 Kings 21:1-15). … (1 Kings 21:16-26). Ahab was so affected by this, that he humbled himself before God'
  - where: setting
    claim: 'Naboth was avenged in 2 Kings 9'
    key: bd-naboth
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/naboth?lang=eng'
    quote: 'The Jezreelite, murdered by Ahab for his vineyard (1 Kgs. 21); avenged (2 Kgs. 9:21, 25–26).'
  - where: setting
    claim: 'The story is a classic illustration of this corruption in the northern kingdom a century or so before Isaiah; Amos and Micah express similar sentiments'
    key: pike-poor-needy
    url: 'https://rsc.byu.edu/covenant-compassion/poor-needy-book-isaiah'
    quote: 'The story of Naboth, Ahab, and Jezebel provides a classic illustration of this type of corruption in the northern kingdom a century or so before Isaiah (1 Kings 21:1–16). Other prophetic books contain similar sentiments'
  - where: setting
    claim: 'The Church''s lesson frames chapters 20–22 as Ahab sinning until it was too late'
    key: ot-instructor-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-instructors-guide/1-kings-17-22-2-kings-1-2?lang=eng'
    quote: '1 Kings 20–22. Ahab Sinned Against the Lord Until It Was Too Late'

  - where: 'note 21:3 “The inheritance of my fathers”'
    claim: 'Naboth could not sell: the law did not permit the sale of an inheritance except in extreme destitution, and then only until the jubilee; Ahab wanted it permanently'
    key: ot-manual-5
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-5?lang=eng'
    quote: 'the law of Moses did not permit the sale of one’s inheritance, except in cases of extreme destitution, and then it could be sold or mortgaged only until the time of jubilee, when it would be reclaimed. Ahab wished to acquire the land permanently.'
  - where: 'note 21:3 “The inheritance of my fathers”'
    claim: 'Ahab sulking on his bed was miserable because he could not get everything he wanted'
    key: ot-manual-5
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-5?lang=eng'
    quote: 'Ahab’s tantrum over being refused (see v. 4) gives an insight into the character of Ahab. The king owned ten-twelfths of the land of Israel already, but he was miserable because he could not get everything he wanted.'
  - where: 'note 21:3 “The inheritance of my fathers”'
    claim: 'The land belonged to Jehovah, who assigned the inheritances; by divine decree a family''s property was to stay in the family; it was a family''s living'
    key: pike-poor-needy
    url: 'https://rsc.byu.edu/covenant-compassion/poor-needy-book-isaiah'
    quote: 'subsistence farming families needed their property to support themselves. Moreover, the Israelites believed the land of Canaan/Israel belonged to Jehovah. He was the divine land-Lord. … by divine decree, a family’s property was supposed to stay in that family.'
  - where: 'note 21:3 “The inheritance of my fathers”'
    claim: 'Num. 36:7 and 1 Kgs. 20:43 as quoted; Lev. 25:23 explained in its own note'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/36?lang=eng'
    quote: 'for every one of the children of Israel shall keep himself to the inheritance of the tribe of his fathers.'

  - where: 'note 21:7 “Jezebel plays the king”'
    claim: 'One older reading: the Hebrew has no sign of a question, the pronoun is emphatic; the sense is “thou art king, art thou not?”; Jezebel does not urge Ahab to play the despot but plays it for him; her “I” is emphatic'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/1_kings/21.htm'
    quote: 'So that the sense is ‘Thou art king, art thou not? why then let such a matter trouble thee or stand in the way of thy will.’ … For Jezebel does not urge Ahab to act the despot’s part, but plays it for him.'
  - where: 'note 21:7 “Jezebel plays the king”'
    claim: 'The Bible Dictionary names the Naboth story as an instance of Jezebel''s influence over Ahab'
    key: bd-ahab
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ahab?lang=eng'
    quote: 'We have another instance of Jezebel’s evil influence over Ahab in the story of Naboth (1 Kgs. 21).'
  - where: 'note 21:7 “Jezebel plays the king”'
    claim: 'Verse 25 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/21?lang=eng'
    quote: 'But there was none like unto Ahab, which did sell himself to work wickedness in the sight of the LORD, whom Jezebel his wife stirred up.'

  - where: 'note 21:10 “A murder in the forms of a trial”'
    claim: 'One older reading: the royal seal gave the letter the character of a royal command; the fast was ordered as though a public crime rested on the city, to give the appearance of justice; two witnesses as the law required, but worthless men'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/21.htm'
    quote: 'Jezebel ordered the fasting for a sign, as though some public crime or heavy load of guilt rested upon the city, for which it was necessary that it should humble itself before God … To preserve the appearance of justice, two witnesses were appointed, according to the law in Deuteronomy 17:6-7'
  - where: 'note 21:10 “A murder in the forms of a trial”'
    claim: 'God and king named together as in Ex. 22, so that Naboth could be accused under it and stoned as a blasphemer by the penalty for idolatry (Deut. 13:11; 17:5)'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/21.htm'
    quote: 'God and king are mentioned together, like God and prince in Exodus 22:27, to make it possible to accuse Naboth of transgressing this law, and to put him to death as a blasphemer of God, according to Deuteronomy 13:11 and Deuteronomy 17:5'
  - where: 'note 21:10 “A murder in the forms of a trial”'
    claim: 'Belial means worthless; sons of Belial are wicked men'
    key: bd-belial
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/belial?lang=eng'
    quote: 'Worthless. Sometimes translated “wicked” (2 Sam. 23:6); sons of Belial, or wicked men'
  - where: 'note 21:10 “A murder in the forms of a trial”'
    claim: 'Deut. 17:6 and Ex. 22:28 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/17?lang=eng'
    quote: 'At the mouth of two witnesses, or three witnesses, shall he that is worthy of death be put to death'

  - where: 'note 21:19 “Killed, and also taken possession”'
    claim: 'Ahab killed Naboth through Jezebel''s connivance and obtained the vineyard he had coveted; the lesson sets the tenth commandment beside it: covetousness leads to sin'
    key: ot-instructor-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-instructors-guide/1-kings-17-22-2-kings-1-2?lang=eng'
    quote: 'Ahab killed Naboth through the connivance of Jezebel and obtained the vineyard he had coveted (see 1 Kings 21:1–16). … Exodus 20:17. “Thou shalt not covet … any thing that is thy neighbor’s.” … Covetousness leads to sin, as in the case of Ahab and Naboth.'
  - where: 'note 21:19 “Killed, and also taken possession”'
    claim: 'Micah 2:1–2 speaks more explicitly of acquiring others'' property'
    key: pike-poor-needy
    url: 'https://rsc.byu.edu/covenant-compassion/poor-needy-book-isaiah'
    quote: 'In Micah 2:1–2, Isaiah’s contemporary Judahite prophet Micah had something even more explicit to say about this situation'

  - where: 'note 21:19 “The word against Ahab fulfilled”'
    claim: '1 Kgs. 22:38; 2 Kgs. 9:25–26, 36; 10:10, 17 record the fulfillment “according to the word of the LORD”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/22?lang=eng'
    quote: 'And one washed the chariot in the pool of Samaria; and the dogs licked up his blood; and they washed his armour; according unto the word of the LORD which he spake.'
  - where: 'note 21:19 “The word against Ahab fulfilled”'
    claim: 'The Church''s lesson reads 2 Kgs. 9:1–10:17 and 1 Kgs. 22:34–38 as the fulfillment of 21:17–29'
    key: ot-instructor-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-instructors-guide/1-kings-17-22-2-kings-1-2?lang=eng'
    quote: '2 Kings 9:1–10:17. How was the prophecy in 1 Kings 21:17–29 fulfilled? (see also 1 Kings 22:34–38).'
  - where: 'note 21:19 “The word against Ahab fulfilled”'
    claim: 'Naboth avenged in 2 Kgs. 9'
    key: bd-naboth
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/naboth?lang=eng'
    quote: 'murdered by Ahab for his vineyard (1 Kgs. 21); avenged (2 Kgs. 9:21, 25–26).'
  - where: 'note 21:20 “Sold to do evil”'
    claim: 'The Hebrew is the reflexive (hithpael) infinitive of the verb “sell”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: '<w lemma="4376" n="0.1" morph="HVtc/Sp2ms" id="11aCj">הִתְמַכֶּרְ/ךָ֔'
  - where: 'note 21:20 “Sold to do evil”'
    claim: 'BDB: hithpael, sell oneself as slave (Deut. 28:68); figurative in 1 Kgs. 21:20, 25 and 2 Kgs. 17:17, all followed by “to do evil”'
    key: bdb
    url: 'https://biblehub.com/hebrew/4376.htm'
    quote: 'Hithpa`el … sell oneself as slave Deuteronomy 28:68; figurative 1 Kings 21:20,25; 2 Kings 17:17, all followed by לַעֲשׂוֺת הָרַע.'

  - where: 'note 21:22 “Like the house of Jeroboam and of Baasha”'
    claim: 'The earlier sentences on Jeroboam''s and Baasha''s houses (14:10–11; 16:3–4) and their fulfillment (15:29; 16:12)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/15?lang=eng'
    quote: 'he smote all the house of Jeroboam; he left not to Jeroboam any that breathed, until he had destroyed him, according unto the saying of the LORD, which he spake by his servant Ahijah the Shilonite'

  - where: christ
    claim: 'The verses show the relationship between repentance and the consequences of sin; because Ahab repented, the evil was delayed until his son was king'
    key: ot-manual-5
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-5?lang=eng'
    quote: 'Verses 27 through 29 show the relationship between repentance and the consequences of sin. Because Ahab repented, the “evil” was delayed until Ahab’s son was king.'
  - where: 'note 21:29 “Why Ahab''s humbling was heard”'
    claim: 'Ahab fought despite Micaiah''s counsel and was killed as Micaiah had prophesied'
    key: ot-instructor-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-instructors-guide/1-kings-17-22-2-kings-1-2?lang=eng'
    quote: 'Ahab Sinned Against the Lord Until It Was Too Late … The two kings fought against Syria despite Micaiah’s counsel; Ahab disguised himself but was killed as Micaiah had prophesied (see 1 Kings 22:15–40).'

  - where: christ
    claim: 'One older reading compares the worthless witnesses against Naboth to those at the trial of Jesus'
    key: keil-kings
    url: 'https://biblehub.com/commentaries/kad/1_kings/21.htm'
    quote: 'two witnesses were appointed, according to the law in Deuteronomy 17:6-7; Deuteronomy 19:15; Numbers 35:30; but worthless men, as at the trial of Jesus (Matthew 26:60).'
  - where: christ
    claim: 'Two false witnesses came at last against Jesus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/26?lang=eng'
    quote: 'Now the chief priests, and elders, and all the council, sought false witness against Jesus, to put him to death; But found none: yea, though many false witnesses came, yet found they none. At the last came two false witnesses,'
  - where: christ
    claim: 'Covetousness leads to greater sin; the Lord''s word through his prophets will be fulfilled'
    key: ot-instructor-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-instructors-guide/1-kings-17-22-2-kings-1-2?lang=eng'
    quote: 'Covetousness leads to greater sin. Those who sin and do not repent cannot escape the wrath of God. The Lord’s word through his prophets will be fulfilled'
