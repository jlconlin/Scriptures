chapter: 6
claims:
  - where: 'setting'
    claim: 'The temple site was the threshing floor of Araunah, placed on Mount Moriah in 2 Chr. 3:1'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'The exact position of the temple, the threshing floor of Araunah the Jebusite, was indicated by an angel of the Lord … This threshing floor is placed on Mount Moriah in 2 Chr. 3:1.'
  - where: 'setting'
    claim: 'David gathered the materials and planned the house; the accomplishment was Solomon’s'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'The materials of the temple—gold, silver, iron, copper, timber, and stone—had been collected by David (1 Chr. 22:14). He had also planned the house and its furniture to its details … Still, to Solomon belongs the credit of the actual accomplishment of the work.'
  - where: 'setting'
    claim: 'The temple was the central event of Solomon’s reign'
    key: eom-temples
    url: 'https://eom.byu.edu/index.php/Temples'
    quote: 'Thus, it was the central event in the reign of king Solomon, far overshadowing any of his other accomplishments (1 Kgs. 6-8)'
  - where: 'thread'
    claim: 'The Church’s study guide points readers to the promises of 6:11–13 beside 9:1–9'
    key: cfm-ot-2026-26
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/26?lang=eng'
    quote: '(Note also the Lord’s promises in 1 Kings 6:11–13; 9:1–9.)'
  - where: 'note 6:1 “When the house was built”'
    claim: 'One Latter-day Saint reading: the 480 years is almost certainly symbolic, 12 times 40; adding it to about 966 BC gives 1446 BC'
    key: sc-knowhy-847
    url: 'https://scripturecentral.org/knowhy/why-does-contextualizing-the-exodus-story-matter'
    quote: '966 plus 480 years is 1446 BC, so one would assume that it must be the pharaoh at this date. However, 480 years is almost certainly supposed to be a symbolic number—the result of multiplying 12, a significant number in ancient Israel, with 40, the number of years which represented a generation in ancient Israel.'
  - where: 'note 6:1 “When the house was built”'
    claim: 'The building took seven years and a half'
    key: scripture-helps-2-samuel-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/24-2-samuel-11-12-1-kings-3-6-9-11?lang=eng'
    quote: 'He laid the foundation in the fourth year of his reign, and the building was completed within seven years and a half.'
  - where: 'note 6:1 “When the house was built”'
    claim: 'The month names and the palace’s thirteen years are in the text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/7?lang=eng'
    quote: 'But Solomon was building his own house thirteen years, and he finished all his house.'
  - where: 'note 6:2 “The plan of the house”'
    claim: 'Built after the tabernacle, each part double; 60 by 20 by 30 cubits; porch 10 cubits deep'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'The temple was built after the model of the tabernacle, the dimensions of each part being exactly double. The temple proper, or interior, was 60 cubits long, 20 cubits broad, 30 cubits high … It had in addition a porch 10 cubits deep in front.'
  - where: 'note 6:2 “The plan of the house”'
    claim: 'Small beside modern churches because worshippers remained outside'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'The small size of the temple proper in comparison with modern churches is to be noticed. It is sufficiently accounted for by the fact that the worshippers remained outside; only the priests went within.'
  - where: 'note 6:2 “The plan of the house”'
    claim: 'Scripture Helps: the temple doubled the tabernacle'
    key: scripture-helps-2-samuel-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/24-2-samuel-11-12-1-kings-3-6-9-11?lang=eng'
    quote: '“The temple was built after the model of the tabernacle, the dimensions of each part being exactly double. …'
  - where: 'note 6:2 “The plan of the house”'
    claim: 'Two main rooms as in the tabernacle; side chambers on three levels on three sides'
    key: cowan-ot-temples
    url: 'https://rsc.byu.edu/ascending-mountain-lord/what-old-testament-temples-can-teach-us-about-our-own-temple-activity'
    quote: 'The temple itself consisted of two main rooms, as had the tabernacle—the main hall and the inner sanctuary (1 Kings 6:16–20). Surrounding the temple on three sides was a series of small “chambers” on three levels (1 Kings 6:5–6).'
  - where: 'note 6:2 “The plan of the house”'
    claim: 'Brigham Young: the pattern was given to Solomon by revelation; the precise record suggests the facts were significant'
    key: cowan-ot-temples
    url: 'https://rsc.byu.edu/ascending-mountain-lord/what-old-testament-temples-can-teach-us-about-our-own-temple-activity'
    quote: 'were given to Solomon by revelation, through the proper source. And why was this revelation-pattern necessary? Because that Solomon had never built a Temple, and did not know what was necessary in the arrangement of the different apartments, any better than Moses did what was needed in the Tabernacle.'
  - where: 'note 6:2 “The plan of the house”'
    claim: 'The record’s precision suggests the facts were significant'
    key: cowan-ot-temples
    url: 'https://rsc.byu.edu/ascending-mountain-lord/what-old-testament-temples-can-teach-us-about-our-own-temple-activity'
    quote: 'The record in 1 Kings is very precise in giving the dimensions of the temple’s various features, suggesting that these facts were significant.'
  - where: 'note 6:2 “The plan of the house”'
    claim: 'The dimensions in feet'
    key: ot-manual-kings-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-1?lang=eng'
    quote: 'According to the dimensions cited in the Bible, the temple was about one hundred feet long and thirty feet wide. It stood on a platform about nine feet high. The temple itself was about forty-five feet high.'
  - where: 'note 6:7 “Stone made ready at the quarry”'
    claim: 'All materials were prepared before they were brought to the site'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'All the materials for the house were prepared before they were brought to the site.'
  - where: 'note 6:7 “Stone made ready at the quarry”'
    claim: 'The Hebrew word is best taken as the quarry; the RV renders “made ready at the quarry”'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/1_kings/6.htm'
    quote: 'The R.V. renders made ready at the quarry … The best authorities incline to make it a noun signifying ‘the place of hewing,’ ‘the stonequarry.’'
  - where: 'note 6:7 “Stone made ready at the quarry”'
    claim: 'One older reading: the silence was probably derived from the law of the altar'
    key: cambridge-kings
    url: 'https://biblehub.com/commentaries/cambridge/1_kings/6.htm'
    quote: 'The idea of this preparation at a distance, so that there might be as little noise as possible while the building was in progress, was probably derived from the command (Exodus 20:25; Deuteronomy 27:5) that no iron tool should be used in the erection of the altar.'
  - where: 'note 6:7 “Stone made ready at the quarry”'
    claim: 'Chapter 5 has the hewed stones brought'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/5?lang=eng'
    quote: 'And the king commanded, and they brought great stones, costly stones, and hewed stones, to lay the foundation of the house.'
  - where: 'note 6:7 “Stone made ready at the quarry”'
    claim: 'The temple walls were of stone made ready at the quarry'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'The temple walls were composed of hewn stone made ready at the quarry'
  - where: 'note 6:7 “Stone made ready at the quarry”'
    claim: 'massāʿ is a noun, quarry or quarrying; the text is marked dubious and may mean when it was quarried'
    key: bdb
    url: 'https://biblehub.com/hebrew/4551.htm'
    quote: 'stone perfect (at the) quarry (or at quarrying, i.e. when it was quarried; compare Benz; text dubious)'
  - where: 'note 6:13 “The word that came while he built”'
    claim: 'As with Moses, the Lord gave Solomon instructions during the building'
    key: cowan-ot-temples
    url: 'https://rsc.byu.edu/ascending-mountain-lord/what-old-testament-temples-can-teach-us-about-our-own-temple-activity'
    quote: 'As had been the case with Moses building the tabernacle, the Lord gave Solomon specific instructions'
  - where: 'note 6:13 “The word that came while he built”'
    claim: 'The promises of protection were conditional on obedience (6:12–13; 9:6–7)'
    key: sc-knowhy-451
    url: 'https://scripturecentral.org/knowhy/why-did-some-in-lehis-time-believe-that-jerusalem-could-not-be-destroyed'
    quote: 'But the Lord had made it clear, through his prophets, that these promises of protection were conditional, depending on the people’s obedience to God’s commandments (1 Kings 6:12–13; 9:6–7).'
  - where: 'note 6:13 “The word that came while he built”'
    claim: 'The word spoken to David is 2 Sam. 7:13 (footnote 12b); the dwelling promise is Ex. 25:8 (footnote 13a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/25?lang=eng'
    quote: 'And let them make me a sanctuary; that I may dwell among them.'
  - where: 'note 6:16 “The oracle”'
    claim: 'dᵉbîr is the hindmost room, the most holy place of the ark and cherubim; “oracle” follows two Greek versions and the Vulgate on the incorrect derivation from “speak”'
    key: bdb
    url: 'https://biblehub.com/hebrew/1687.htm'
    quote: 'hindmost chamber, innermost room of the temple of Solomon = קדשׁ הקדשׁים holy of holies, most holy place, the place of the ark and the cherubic images, the throne-room of Yahweh … (It is translated oracle in AV RV after Aq Symm χρηματιστήριον, ᵑ9 oraculum, on the incorrect theory that it was derived from דִּבֶּר speak.)'
  - where: 'note 6:27 “Two great cherubim over the ark”'
    claim: 'The cherubim were new, larger, different in posture; wings touched in the middle and reached the walls'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'In the Holy of Holies stood the old Mosaic ark with the mercy seat; but the cherubim overshadowing the mercy seat were new. They were larger in size; their wings touched in the middle and reached each wall of the Holy of Holies. They were also different in posture.'
  - where: 'note 6:27 “Two great cherubim over the ark”'
    claim: 'The inner room was the place of the ark and cherubim, the throne-room'
    key: bdb
    url: 'https://biblehub.com/hebrew/1687.htm'
    quote: 'the place of the ark and the cherubic images, the throne-room of Yahweh'
  - where: 'note 6:27 “Two great cherubim over the ark”'
    claim: 'The ark is set under the cherubim’s wings at the dedication'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'And the priests brought in the ark of the covenant of the LORD unto his place, into the oracle of the house, to the most holy place, even under the wings of the cherubims.'
  - where: 'christ'
    claim: 'The Word dwelt among us: the Son came out from the Holy of Holies into the world and opened the way back'
    key: sc-knowhy-668
    url: 'https://scripturecentral.org/knowhy/how-does-john-portray-jesus-as-the-way-of-the-temple'
    quote: 'In other words, it could be understood that “the Son descended from the presence of God in the Holy of Holies and came out of the temple into the world.” … taking His disciples with Him and opening the way for all of God’s children to enter His presence again.'
  - where: 'christ'
    claim: 'Through covenants made in the Lord’s house, the Lord dwells with me'
    key: cfm-ot-2026-26
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/26?lang=eng'
    quote: '1 Kings 6–8; 9:1–9: Through covenants made in the Lord’s house, the Lord dwells with me.'
  - where: 'explore'
    claim: 'Nephi built a temple after the manner of Solomon’s'
    key: sc-knowhy-716
    url: 'https://scripturecentral.org/knowhy/how-are-ancient-american-temples-similar-to-the-temple-of-solomon'
    quote: 'his people built a temple “after the manner of the temple of Solomon save it were not built of so many precious things.'
