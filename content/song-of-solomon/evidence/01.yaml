  - where: 'note 1:7 “Like one who is veiled”'
    claim: 'A modern translation: like one who is veiled'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+1%3A7&version=NRSVUE'
    quote: 'for why should I be like one who is veiled'
  - where: 'note 1:7 “Like one who is veiled”'
    claim: 'One modern translation gives verse 8 to friends'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+1&version=NIV'
    quote: '8 If you do not know, most beautiful of women,(P)'

  # note 1:10
  - where: 'note 1:10 “Comely: the word that may lie behind Nauvoo”'
    claim: 'Nauvoo transliterates na’vu, “to be pleasing, delightful,” found only in Isa 52:7 and Song 1:10'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: '“Nauvoo,” which is a transliteration of the plural form of a rare Hebrew verb form, na’vu, that means, “to be pleasing, delightful.” This particular form occurs only twice in the Hebrew Bible: Isaiah 52:7 and Song of Songs 1:10'
  - where: 'note 1:10 “Comely: the word that may lie behind Nauvoo”'
    claim: 'Hebrew study in Kirtland with Seixas, Jan.–Mar. 1836; Nauvoo named 1839; the link cannot be proved'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'Professor Joshua Seixas was hired to teach biblical Hebrew in Kirtland from January 6 to March 29, 1836. … In 1839, Nauvoo was named. Although it cannot be proved, this interesting datum provides one more potential link'
  - where: 'note 1:10 “Comely: the word that may lie behind Nauvoo”'
    claim: 'Seixas’s grammar may have encouraged Joseph to name Nauvoo from navu'
    key: pike-eliason-song-scripture
    url: 'https://byustudies.byu.edu/article/is-the-song-of-solomon-scripture'
    quote: 'Reading the latter’s Manual Hebrew Grammar for the Use of the Beginner15 may have encouraged Joseph to name his people’s place of gathering in Illinois Nauvoo from the Hebrew word navu (beautiful)'
  - where: 'note 1:10 “Comely: the word that may lie behind Nauvoo”'
    claim: 'BDB: be comely, of the messenger’s feet (Isa 52:7) and of cheeks (Song 1:10)'
    key: bdb
    url: 'https://biblehub.com/hebrew/4998.htm'
    quote: '1 be comely; of feet of messenger, (figurative) Isaiah 52:7; of cheeks Songs 1:10.'

  # christ
  - where: christ
    claim: 'The husband-wife motif of the prophets likely influenced the allegorical reading; in the New Testament Jesus is the bridegroom and Christians his bride'
    key: pike-eliason-song-scripture
    url: 'https://byustudies.byu.edu/article/is-the-song-of-solomon-scripture'
    quote: 'One factor that likely influenced this interpretation is the husband-wife motif utilized in several prophetic books in the Old Testament, in which Yahweh/Jehovah (the husband) is bound by covenant to Israel (his wife). This motif continues in modified form in the New Testament, with Jesus as the bridegroom and Christians collectively as his bride.'
  - where: christ
    claim: 'Latter-day Saints have never institutionally accepted the allegorical approach'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'Although Latter-day Saints have never institutionally accepted the allegorical approach to the Song of Songs'

