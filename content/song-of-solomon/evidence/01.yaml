    quote: 'The main male and female speakers (identified primarily on the basis of the gender of the relevant Hebrew forms) are indicated by the captions He and She respectively. … In some instances the divisions and their captions are debatable.'

  # note 1:3
  - where: 'note 1:3 “A name like poured perfume”'
    claim: 'The Hebrew has shemen “ointment” and shem “name” side by side'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Song.xml'
    quote: 'שֶׁ֖מֶן תּוּרַ֣ק שְׁמֶ֑/ךָ'
  - where: 'note 1:3 “A name like poured perfume”'
    claim: 'BDB: ‘almah, young woman (maid or newly married); plural in Song 1:3'
    key: bdb
    url: 'https://biblehub.com/hebrew/5959.htm'
    quote: 'עַלְמָה noun feminine young woman (ripe sexually; maid or newly married)'

  # note 1:4
  - where: 'note 1:4 “King and shepherd”'
    claim: 'The woman calls her lover “king” in 1:4 and depicts him as a shepherd in 1:7'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'as well as the fact that the woman refers early on to her lover as a “king” (1:4; although see 1:7, in which she depicts him as a shepherd).'
  - where: 'note 1:4 “King and shepherd”'
    claim: 'A scholar Pike cites takes both depictions as figurative, not historical'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'Longman, Song, 16, who accepts both of these depictions (1:4, 1:7) as “figurative,” providing a basis on which this literary creation was built, but not as “historical” connections.'
  - where: 'note 1:4 “King and shepherd”'
    claim: 'The dramatic reading: a maiden, a shepherd, a king who takes her to Jerusalem and fails to win her; story line and speakers unclear'
    key: mcconkie-poetic-writings
    url: 'https://rsc.byu.edu/joseph-smith-translation/joseph-smith-poetic-writings'
    quote: 'Its story line is unclear as is the matter of which of its characters is speaking in many instances. … The story apparently deals with a virtuous young maiden … who loves a young shepherd to whom she is betrothed.'
  - where: 'note 1:4 “King and shepherd”'
    claim: 'The king fails to win her and sets her free to marry the shepherd'
    key: mcconkie-poetic-writings
    url: 'https://rsc.byu.edu/joseph-smith-translation/joseph-smith-poetic-writings'
    quote: 'The king is so impressed with her beauty that he brings her to his pavillion and eventually takes her to Jerusalem. … When the king realizes he has failed to gain her favor, he sets her free to marry the shepherd.'
  - where: 'note 1:4 “King and shepherd”'
    claim: 'One modern translation gives “we will be glad and rejoice in thee” to friends'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+1&version=NIV'
    quote: 'We rejoice and delight(H) in you;'

  # note 1:5
  - where: 'note 1:5 “Black, but comely”'
    claim: 'The daughters of Jerusalem are a group of women who speak and are spoken to (1:5; 2:7; 5:8–9; 6:1)'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'comments to and by a group of women, who are several times referred to as “daughters of Jerusalem” (e.g., 1:5; 2:7; 5:8–9; 6:1)'
  - where: 'note 1:5 “Black, but comely”'
    claim: 'BDB: shachor, black, here of skin'
    key: bdb
    url: 'https://biblehub.com/hebrew/7838.htm'
    quote: 'שָׁחֹר adjective black; — ׳שׁ of hair Leviticus 13:31,37 (P), so feminine plural שְׁחֹרוֺת Songs 5:11; of skin, feminine singular שְׁחוֺרָה Songs 1:5'
  - where: 'note 1:5 “Black, but comely”'
    claim: 'One older reading: the words express humility without abjectness'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/1.htm'
    quote: '"Black am I, yet comely." These words express humility without abjectness.'
  - where: 'note 1:5 “Black, but comely”'
    claim: 'Kedar a North Arabian Ishmaelite tribe; tents covered with cloth of mostly black goat hair; Solomon’s hangings the other side of the comparison'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/1.htm'
    quote: 'the tents are covered with cloth made of the hair of goats, which are there mostly black-coloured or grey. On the one hand, dark-coloured as the tents of the Kedarenes, she may yet, on the other hand, compare herself to the beautiful appearance of the יריעות of Solomon.'
  - where: 'note 1:5 “Black, but comely”'
    claim: 'Kedar is a tribe of North Arabian Ishmaelites (Gen 25:13)'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/1.htm'
    quote: 'is the name of a tribe of North. Arab. Ishmaelites (Genesis 25:13)'
  - where: 'note 1:5 “Black, but comely”'
    claim: 'Her own vineyard is her own person; she explains why she is sunburnt'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/1.htm'
    quote: 'vine-gardens she had kept, but her own vine-garden, i.e., her own person, she had not kept. … but she certainly seeks to explain why she is so sunburnt.'
  - where: 'note 1:5 “Black, but comely”'
    claim: 'One older reading: Solomon’s yeriʿot are best thought of as a pleasure-tent or pavilion for the king'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/1.htm'
    quote: 'By this word we will have to think of a pleasure-tent or pavilion for the king'

  # note 1:7
  - where: 'note 1:7 “Like one who is veiled”'
    claim: 'The Hebrew is ke‘oteyah, a participle of ‘atah (Strong’s 5844)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Song.xml'
