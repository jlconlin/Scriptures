    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/1.htm'
    quote: 'As for the meaning, instar errabundae (Syr., Symm., Jerome, Venet., Luther) recommends itself; but עטה must then … have been transposed from טעה (תעה)'
  - where: 'note 1:7 “Like one who is veiled”'
