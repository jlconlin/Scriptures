chapter: 1
claims:
  # setting
  - where: setting
    claim: 'The Song has no narrator; it is spoken words, mostly of a male and a female lover'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'Containing no third-person narration, the Song employs only spoken words, primarily those of its two main characters: a male and a female lover.'
  - where: setting
    claim: 'A group of women, the daughters of Jerusalem, speak and are spoken to; her brothers once (8:8–9)'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'The Song also occasionally includes comments to and by a group of women, who are several times referred to as “daughters of Jerusalem” (e.g., 1:5; 2:7; 5:8–9; 6:1), and one short passage presumably representing the comments of the female’s brothers (8:8–9).'
  - where: setting
    claim: 'The seminary manual: a collection of poetry and songs of love and affection'
    key: seminary-ot-teacher-115
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-song-of-solomon/lesson-115-ecclesiastes-and-the-song-of-solomon?lang=eng'
    quote: 'Summarize the Song of Solomon by explaining that this book is a collection of poetry and songs of love and affection.'
  - where: setting
    claim: 'The Bible Dictionary: many beautiful phrases and lyrical prose'
    key: bd-song-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/song-of-solomon?lang=eng'
    quote: 'The composition has many beautiful phrases and lyrical prose, often quoted in nonreligious literature.'
  - where: setting
    claim: 'The Song never names God'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: '(1) the Song is devoid of the name of God, (2) it demonstrates no obvious religious intent'
  - where: setting
    claim: 'The Church’s footnote above 1:1 gives the JST manuscript note'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/song/1?lang=eng'
    quote: 'Note: The JST manuscript states that “the Songs of Solomon are not inspired writings.”'
  - where: setting
    claim: 'The JST makes no revisions to the Song; the note dates to July 1832'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'not only provides no revisions at all to the text of the Song, [15] but contains the comment “The Songs of Solomon are not Inspired writings [sic].” [16] This statement dates to July 1832.'
  - where: setting
    claim: 'No reason was recorded, and there has been no official Church explanation'
    key: pike-eliason-song-scripture
    url: 'https://byustudies.byu.edu/article/is-the-song-of-solomon-scripture'
    quote: 'What is lacking from Joseph Smith and from his contemporaries is any indication of the reason for this pronouncement.12 There has never been any official Church explanation of Joseph Smith’s comment'
  - where: setting
    claim: 'The Church has never published a Bible without the Song'
    key: pike-eliason-song-scripture
    url: 'https://byustudies.byu.edu/article/is-the-song-of-solomon-scripture'
    quote: 'It is after all the institutional Church that has never published an edition of the Bible without the Song of Songs and whose canonical Doctrine and Covenants significantly quotes it.'
  - where: setting
    claim: 'A line of 6:10 occurs three times in the Doctrine and Covenants'
    key: pike-eliason-song-scripture
    url: 'https://byustudies.byu.edu/article/is-the-song-of-solomon-scripture'
    quote: 'variations of this phrase from Song 6:10, “fair as the moon, clear as the sun, and terrible as an army with banners,” occur three times in the Doctrine and Covenants (5:14; 105:31; 109:73)'
  - where: setting
    claim: 'In chapter 1 the woman speaks most of the lines; the speakers are marked by the gender of the Hebrew forms'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+1&version=NIV'
    quote: 'The main male and female speakers (identified primarily on the basis of the gender of the relevant Hebrew forms) are indicated by the captions He and She respectively. The words of others are marked Friends.'

  # thread and sections
  - where: thread
    claim: 'Speakers in chapter 1 as one modern translation assigns them: She 2–4a, Friends 4b, She 5–7, Friends 8, He 9–11, She 12–14, He 15, She 16, He 17'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+1&version=NIV'
    quote: 'In some instances the divisions and their captions are debatable.'
  - where: section 4 plain
    claim: 'Verse 7: like one who is veiled'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+1%3A7&version=NRSVUE'
    quote: 'for why should I be like one who is veiled'

  # note 1:1 The best of songs
  - where: 'note 1:1 “The best of songs, and “not inspired writings””'
    claim: '“Song of songs” is a Hebrew superlative: the best song'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'The expression “song of songs” represents a Hebrew idiom used to express the superlative. Thus the “song of songs” means “the best song, the most wonderful song.”'
  - where: 'note 1:1 “The best of songs, and “not inspired writings””'
    claim: 'The opening phrase presents the book as a great song celebrating human love'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'It presents itself as a great song, celebrating certain aspects of human love.'
  - where: 'note 1:1 “The best of songs, and “not inspired writings””'
    claim: 'From 1979 to 2012 the Bible Dictionary said “not inspired scripture,” an overstatement; the 2013 edition restored “not inspired writings,” which does not touch canonical status directly'
    key: pike-eliason-song-scripture
    url: 'https://byustudies.byu.edu/article/is-the-song-of-solomon-scripture'
    quote: 'From 1979 to 2012, the Bible Dictionary … described the Song of Solomon as “not inspired scripture.”26 This paraphrase was an overstatement of Joseph Smith’s actual notation … This wording does not touch on canonical status directly'
  - where: 'note 1:1 “The best of songs, and “not inspired writings””'
    claim: 'Their reading: “not inspired” means no Spirit-communicated word and no intended allegory'
    key: pike-eliason-song-scripture
    url: 'https://byustudies.byu.edu/article/is-the-song-of-solomon-scripture'
    quote: '“Not inspired” indicates the Song does not contain the Spirit-communicated divine word, nor is it divinely intended allegory.'
  - where: 'note 1:1 “The best of songs, and “not inspired writings””'
    claim: 'In the canon but not institutionally regarded as scripture; no formal Church pronouncement'
    key: pike-eliason-song-scripture
    url: 'https://byustudies.byu.edu/article/is-the-song-of-solomon-scripture'
    quote: 'Even though there has never been a formal Church pronouncement on the status of the Song … the Song of Solomon is in the traditional collection of scripture, the biblical canon, but it is not institutionally regarded as scripture.'
  - where: 'note 1:1 “The best of songs, and “not inspired writings””'
    claim: 'Bible Dictionary: reluctance because of romantic content; permitted as allegory'
    key: bd-song-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/song-of-solomon?lang=eng'
    quote: 'Both Jews and Christians have at times been reluctant to accept it into the canon of scripture because of its romantic content but have permitted it on the basis of its being an allegory of God’s love for Israel and of the Church.'
  - where: 'note 1:1 “The best of songs, and “not inspired writings””'
    claim: 'Widespread acceptance as scripture not until the early second century AD'
    key: pike-eliason-song-scripture
    url: 'https://byustudies.byu.edu/article/is-the-song-of-solomon-scripture'
    quote: 'The limited available evidence suggests that widespread acceptance of the Song as scripture was not achieved until the early second century AD, with Christian acceptance coming after that.'
  - where: 'note 1:1 “The best of songs, and “not inspired writings””'
    claim: 'Latter-day Saints have never institutionally accepted the allegorical approach'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'Although Latter-day Saints have never institutionally accepted the allegorical approach to the Song of Songs, such an approach has been productive for many Jews and traditional Christians over many centuries.'

  - where: 'note 1:1 “The best of songs, and “not inspired writings””'
    claim: 'Holy of holies is another example of the superlative'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'other biblical examples of this type of superlative phrasing include holy of holies (usually translated “most holy” in the KJV, e.g., Exodus 26:33)'
  - where: 'note 1:1 “The best of songs, and “not inspired writings””'
    claim: 'The 2013 edition restored the actual wording “not inspired writings”'
    key: pike-eliason-song-scripture
    url: 'https://byustudies.byu.edu/article/is-the-song-of-solomon-scripture'
    quote: 'the 2013 scripture revisions restore the Prophet’s actual wording of “not inspired writings.”'

  # note 1:1 Solomon's song?
  - where: 'note 1:1 “Solomon’s song?”'
    claim: 'The Bible Dictionary calls Solomon’s authorship doubtful'
    key: bd-song-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/song-of-solomon?lang=eng'
    quote: 'Whether Solomon is actually the author is doubtful.'
  - where: 'note 1:1 “Solomon’s song?”'
    claim: 'The preposition l- in lišlomoh can mark authorship, dedication, or topic; a traditional ascription'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'the Hebrew preposition l- in the phrase lišlomoh, literally “(belonging) to/for Solomon,” can indicate possession or authorship, but also dedication to and topic (about). I agree with their assessment that the ancient intent here was most likely authorship, but that this is a traditional ascription, not proof of actual authorship.'
  - where: 'note 1:1 “Solomon’s song?”'
    claim: 'Solomon composed 1,005 songs (1 Kgs 4:32); allusions to Solomon in 1:5; 3:7, 9, 11; 8:11–12; the regal aura; no reliable way to know the author'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'According to 1 Kings 4:32 (Heb. 5:12), Solomon composed 1,005 songs. … There are, of course, allusions to Solomon and some of his possessions in the Song (1:5; 3:7, 9, 11; 8:11–12)'
  - where: 'note 1:1 “Solomon’s song?”'
    claim: 'Linking the Song to Solomon gave it a regal aura; no reliable way to know who composed it'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'So, while linking the Song to Solomon in antiquity presumably helped provide the text with a regal aura, may have increased its authoritative status, and secured its place in the biblical canon, there is really no reliable way to know who composed it.'
  - where: 'note 1:1 “Solomon’s song?”'
    claim: 'Suggested dates range from the tenth to the third centuries BC'
    key: pike-eliason-song-scripture
    url: 'https://byustudies.byu.edu/article/is-the-song-of-solomon-scripture'
    quote: 'In reality, we do not know who composed this text, nor when it was produced. Suggested dates for the Song’s composition range from the tenth to the third centuries BC'

  # note 1:2
  - where: 'note 1:2 “Love better than wine”'
    claim: 'The word in 1:2 is dodim, plural of dod (Strong’s 1730)'
