chapter: 2
claims:
  # setting
  - where: setting
    claim: 'The daughters of Jerusalem are a group of women addressed in the Song, including at 2:7'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'The Song also occasionally includes comments to and by a group of women, who are several times referred to as “daughters of Jerusalem” (e.g., 1:5; 2:7; 5:8–9; 6:1)'
  - where: setting
    claim: 'A modern translation gives verse 1 to her, verse 2 to him, verses 3–13 to her, 14–15 to him, 16–17 to her'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song%20of%20Songs%202&version=NIV'
    quote: 'Song of Songs 2 NIV - She I am a rose of Sharon, a lily of'
  - where: setting
    claim: 'Elder Henry D. Taylor quoted 2:11–12 in his April 1959 general conference address “Gratitude”'
    key: pike-eliason-song-scripture
    url: 'https://byustudies.byu.edu/article/is-the-song-of-solomon-scripture'
    quote: 'In the April 1959 general conference, Elder Henry D. Taylor observed in his address, entitled “Gratitude,”'
  - where: setting
    claim: 'Joseph Smith used “the little foxes” of 2:15 in teaching the Nauvoo Relief Society in August 1842'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'The Nauvoo Relief Society Minute Book reports that in August 1842 Joseph Smith taught, “The servants of the Lord are required to guard against those things that are calculated to do the most evil—the little foxes spoil the vines'

  # thread
  - where: thread
    claim: 'Speakers of the chapter as a modern translation heads them (She, He, She, She, He, She)'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song%20of%20Songs%202&version=NIV'
    quote: '14 My dove(S) in the clefts of the rock, in the hiding places on the mountainside'

  # sections
  - where: section 2 plain
    claim: '“Flagons” are raisins; “sick of love” is faint with love; “till he please” is love until it is ready'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song%20of%20Songs%202&version=NRSVUE'
    quote: '5 Sustain me with raisins, refresh me with apples, for I am faint with love.(D)'
  - where: section 4 plain
    claim: '“Secret places of the stairs” is the covert of the cliff; verse 15 inside his speech'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song%20of%20Songs%202&version=NRSVUE'
    quote: '14 O my dove, in the clefts of the rock, in the covert of the cliff, let me see your face'
  - where: section 5 plain
    claim: '“Until the day break” is until the day breathes; Bether uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song%20of%20Songs%202&version=NRSVUE'
    quote: '17 Until the day breathes and the shadows flee, turn, my beloved, be like a gazelle or a young stag on the cleft mountains.(O)'

  # note 2:1
  - where: 'note 2:1 “A wildflower, and a lily among thorns”'
    claim: 'A modern translation heads verse 1 “She,” with a footnote “Or He”; the flower is probably of the crocus family; the apple tree possibly an apricot'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song%20of%20Songs%202&version=NIV'
    quote: 'Song of Songs 2:1 Or He … Song of Songs 2:1 Probably a member of the crocus family … Song of Songs 2:3 Or possibly apricot; here and elsewhere in Song of Songs'
  - where: 'note 2:1 “A wildflower, and a lily among thorns”'
    claim: 'His word “my love” in verse 2 is ra‘yati, a feminine noun with “my”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Song.xml'
    quote: 'רַעְיָתִ֖/י'
  - where: 'note 2:1 “A wildflower, and a lily among thorns”'
    claim: 'One older reading suggests the meadow-saffron, a simple and common flower'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/2.htm'
    quote: 'the meadow-saffron, colchicum autumnale … Shulamith compares herself to such a simple and common flower'
  - where: 'note 2:1 “A wildflower, and a lily among thorns”'
    claim: 'The rose is nowhere mentioned in the canonical scriptures'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/2.htm'
    quote: 'It is nowhere mentioned in the canonical Scriptures'
  - where: 'note 2:1 “A wildflower, and a lily among thorns”'
    claim: 'Sharon names more than one region: the best known is the coastal plain between Joppa and Caesarea, and there was also one beyond the Jordan'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/2.htm'
    quote: 'The most celebrated plain of this name is that situated on the Mediterranean coast between Joppa and Caesarea; but there is also a trans-Jordanic Sharon'
  - where: 'note 2:1 “A wildflower, and a lily among thorns”'
    claim: 'She thinks humbly of herself, and he gives her comparison a turn'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/2.htm'
    quote: 'She thinks humbly of herself … but he takes up her comparison of herself, and gives it a notable turn.'
  - where: 'note 2:1 “A wildflower, and a lily among thorns”'
    claim: 'The apple tree joins sweet fruit and shade, where forest trees bear sour fruit'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/2.htm'
    quote: 'where are also found trees bearing fruit, which, however, is for the most part sour and unpalatable. But the apple-tree unites delicious fruit along with a grateful shade'

  # note 2:4
  - where: 'note 2:4 “The house of wine, the banner, and the raisins”'
    claim: 'The “banqueting house” is in Hebrew beit hayyayin, house of the wine'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Song.xml'
    quote: 'הַ/יָּ֔יִן'
  - where: 'note 2:4 “The house of wine, the banner, and the raisins”'
    claim: 'The “banner” is degel (Strong’s 1714)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Song.xml'
    quote: 'וְ/דִגְל֥/וֹ'
  - where: 'note 2:4 “The house of wine, the banner, and the raisins”'
    claim: 'The same word (Strong’s 1714) is the “standard” of each tribe in Num. 2:2'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'דִּגְל֤/וֹ'
  - where: 'note 2:4 “The house of wine, the banner, and the raisins”'
    claim: 'A modern translation renders “his intention toward me was love,” with the note that the Hebrew is “banner above”; it renders verse 5 raisins and faint with love'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song%20of%20Songs%202&version=NRSVUE'
    quote: '4 He brought me to the banqueting house, and his intention toward me was love.(C) 5 Sustain me with raisins, refresh me with apples, for I am faint with love.(D) … 2.4 Heb banner above'
  - where: 'note 2:4 “The house of wine, the banner, and the raisins”'
    claim: 'Another modern translation reads verse 4 as a wish'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song%20of%20Songs%202&version=NIV'
    quote: '4 Let him lead me to the banquet hall,(G) and let his banner(H) over me be love. 5 Strengthen me with raisins,'
  - where: 'note 2:4 “The house of wine, the banner, and the raisins”'
    claim: 'The Church footnote glosses “comfort me” as “refresh me”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/song/2?lang=eng'
    quote: 'IE refresh me.'

  # note 2:7
  - where: 'note 2:7 “Love itself, until it please”'
    claim: 'The Hebrew object is “the love” (ha’ahavah), with the article; the verb after it is feminine'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Song.xml'
    quote: 'הָ/אַהֲבָ֖ה'
  - where: 'note 2:7 “Love itself, until it please”'
    claim: 'The verb “please” is third person feminine singular (Vqi3fs), agreeing with “love”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Song.xml'
    quote: 'שֶׁ/תֶּחְפָּֽץ'
  - where: 'note 2:7 “Love itself, until it please”'
    claim: 'A modern translation: do not stir up or awaken love until it is ready'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song%20of%20Songs%202&version=NRSVUE'
    quote: '7 I charge you, O daughters of Jerusalem, by the gazelles or the wild does: do not stir up or awaken love until it is ready!(F)'
  - where: 'note 2:7 “Love itself, until it please”'
    claim: 'The KJV and a few others read the abstract Hebrew as the lover rather than love itself'
    key: pike-eliason-song-scripture
    url: 'https://byustudies.byu.edu/article/is-the-song-of-solomon-scripture'
    quote: 'a few others, including the King James Version (KJV), render the abstract Hebrew form h’hbh as suggesting letting the lover, rather than love itself, sleep until he or she is done sleeping.'
  - where: 'note 2:7 “Love itself, until it please”'
    claim: 'On one Latter-day Saint reading, the Song may anticipate the dangers of its own reading when it counsels not to awaken love before its proper time'
    key: pike-eliason-song-scripture
    url: 'https://byustudies.byu.edu/article/is-the-song-of-solomon-scripture'
    quote: 'The canonical form of the Song itself may anticipate the dangers of its own reading when it twice counsels not to “awaken or arouse love before its proper time!”'
  - where: 'note 2:7 “Love itself, until it please”'
    claim: 'One older reading: she asks that love not be disturbed, and adjures by the gazelles as animals lovely and free'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/2.htm'
    quote: 'The adjuration is that love should not be disturbed, and therefore it is by the animals that are most lovely and free, which roam through the fields.'
  - where: 'note 2:7 “Love itself, until it please”'
    claim: 'An Israelite swore only by God, but adjuring by what is not God was allowed'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/2.htm'
    quote: 'It is permitted to the Israelites to swear, נשׁבּע, only by God (Genesis 21:23); but to adjure, השׁבּיע, by that which is not God, is also admissible'

  # note 2:8
  - where: 'note 2:8 “She hears him coming, and tells what he said”'
    claim: 'A modern translation puts his words of verses 10–15 in quotation marks inside her speech'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song%20of%20Songs%202&version=NRSVUE'
    quote: '10 My beloved speaks and says to me: “Arise, my love, my fair one, and come away, … for our vineyards are in blossom.”(M)'
  - where: 'note 2:8 “She hears him coming, and tells what he said”'
    claim: 'Another closes his quoted words at verse 13 and heads verses 14–15 “He”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song%20of%20Songs%202&version=NIV'
    quote: 'Arise, come, my darling; my beautiful one, come with me.”'
  - where: 'note 2:8 “She hears him coming, and tells what he said”'
    claim: 'His “rise up” and “come away” are feminine imperatives addressed to her'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Song.xml'
    quote: 'ק֥וּמִי'
  - where: 'note 2:8 “She hears him coming, and tells what he said”'
    claim: 'The Church footnote glosses “hart” as gazelle or fawn'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/song/2?lang=eng'
    quote: 'OR gazelle, fawn.'

  # note 2:11
  - where: 'note 2:11 “The winter is past”'
    claim: 'The Church footnote glosses “turtle” as turtle-dove, with Jer. 8:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/song/2?lang=eng'
    quote: 'IE turtle-dove. Jer. 8:7.'
  - where: 'note 2:11 “The winter is past”'
    claim: 'Elder Taylor quoted 2:11–12 in April 1959 and likened the spring awakening to the Savior’s death and resurrection'
    key: pike-eliason-song-scripture
    url: 'https://byustudies.byu.edu/article/is-the-song-of-solomon-scripture'
    quote: 'This awakening is reminiscent of the death and the resurrection of the Savior and we can appropriately dwell on the great debt of gratitude that we owe him for his atoning sacrifice.'
  - where: 'note 2:11 “The winter is past”'
    claim: 'Elder Taylor introduced the lines with the coming of spring'
    key: pike-eliason-song-scripture
    url: 'https://byustudies.byu.edu/article/is-the-song-of-solomon-scripture'
    quote: 'Springtime is a glorious time of the year as new life begins to stir and the earth seems to awaken from its long winter nap.'
  - where: 'note 2:11 “The winter is past”'
    claim: 'Elder Taylor’s address was entitled “Gratitude”'
    key: pike-eliason-song-scripture
    url: 'https://byustudies.byu.edu/article/is-the-song-of-solomon-scripture'
    quote: 'In the April 1959 general conference, Elder Henry D. Taylor observed in his address, entitled “Gratitude,”'

  # note 2:14
  - where: 'note 2:14 “The dove in the clefts of the rock”'
    claim: 'Another modern translation: the hiding places on the mountainside'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song%20of%20Songs%202&version=NIV'
    quote: '14 My dove(S) in the clefts of the rock, in the hiding places on the mountainside'
  - where: 'note 2:14 “The dove in the clefts of the rock”'
    claim: 'A modern translation renders “the secret places of the stairs” as the covert of the cliff'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song%20of%20Songs%202&version=NRSVUE'
    quote: '14 O my dove, in the clefts of the rock, in the covert of the cliff, let me see your face; let me hear your voice'

  # note 2:15
  - where: 'note 2:15 “The little foxes”'
    claim: 'Who speaks verse 15 is uncertain: one modern translation keeps it in his words, another heads 14–15 “He”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song%20of%20Songs%202&version=NRSVUE'
    quote: '15 Catch us the foxes, the little foxes, that ruin the vineyards— for our vineyards are in blossom.”(M)'
  - where: 'note 2:15 “The little foxes”'
    claim: 'Heading of verses 14–15 in another modern translation'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song%20of%20Songs%202&version=NIV'
    quote: '15 Catch for us the foxes,(U) the little foxes that ruin the vineyards,(V) our vineyards that are in bloom.(W)'
  - where: 'note 2:15 “The little foxes”'
    claim: 'The word covers foxes and jackals'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/2.htm'
    quote: 'שׁעלים comprehends both foxes and jackals, which "destroy or injure the vineyards'
  - where: 'note 2:15 “The little foxes”'
    claim: 'One older reading takes the line as a vine-dresser’s song in her mouth'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/2.htm'
    quote: 'But this is a vine-dresser''s ditty, in accord with Shulamith''s experience as the keeper of a vineyard'
  - where: 'note 2:15 “The little foxes”'
    claim: 'One older reading: the vineyards point to her covenant of love, the foxes to whatever threatens it before it ripens'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/2.htm'
    quote: 'The vineyards, beautiful with fragrant blossom, point to her covenant of love; and the foxes, the little foxes, which might destroy these united vineyards, point to all the great and little enemies and adverse circumstances which threaten to gnaw and destroy love in the blossom'
  - where: 'note 2:15 “The little foxes”'
    claim: 'Joseph Smith to the Nauvoo Relief Society, 31 August 1842'
    key: wjs-1842-08-31
    url: 'https://rsc.byu.edu/words-joseph-smith/31-august-1842-wednesday-grove'
    quote: 'The servants of the Lord are required to guard against those things that are calculated to do the most evil— the little foxes spoil the vines [4]—little evils do the most injury to the church'
  - where: 'note 2:15 “The little foxes”'
    claim: 'Whether he took it from the Song or from a popular saying cannot be determined'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'Whether this indicates that this phrase was a popular saying with which Joseph Smith was familiar or whether he was aware of it from reading the Song of Songs cannot be determined.'
  - where: 'note 2:15 “The little foxes”'
    claim: 'Heber C. Kimball in 1861 called it the old proverb'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'Latter-day Saint Church leader Heber C. Kimball observed in a sermon in 1861, “You know the old proverb says that it is the little foxes that spoil the vines.”'

  # note 2:16
  - where: 'note 2:16 “Mine, and his”'
    claim: 'A modern translation: he pastures his flock among the lilies'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song%20of%20Songs%202&version=NRSVUE'
    quote: '16 My beloved is mine, and I am his; he pastures his flock among the lilies.(N)'
  - where: 'note 2:16 “Mine, and his”'
    claim: 'Another: he browses among the lilies'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song%20of%20Songs%202&version=NIV'
    quote: '16 My beloved is mine and I am his;(X) he browses among the lilies.(Y)'

  # note 2:17
  - where: 'note 2:17 “Until the day breathes, on the mountains of Bether”'
    claim: 'A modern translation: until the day breathes; cleft mountains; Bether’s meaning uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song%20of%20Songs%202&version=NRSVUE'
    quote: '17 Until the day breathes and the shadows flee, turn, my beloved, be like a gazelle or a young stag on the cleft mountains.(O) … 2.17 Or on the mountains of Bether; meaning of Heb uncertain'
  - where: 'note 2:17 “Until the day breathes, on the mountains of Bether”'
    claim: 'Another renders it rugged hills, with the hills of Bether in the margin'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song%20of%20Songs%202&version=NIV'
    quote: 'or like a young stag(AB) on the rugged hills.(AC) … Song of Songs 2:17 Or the hills of Bether'

  # christ
  - where: christ
    claim: 'The refrain read as counsel not to awaken love before its time'
    key: pike-eliason-song-scripture
    url: 'https://byustudies.byu.edu/article/is-the-song-of-solomon-scripture'
    quote: 'it twice counsels not to “awaken or arouse love before its proper time!”'
  - where: christ
    claim: 'The family proclamation on the sacred powers of procreation'
    key: family-proclamation
    url: 'https://www.churchofjesuschrist.org/study/scriptures/the-family-a-proclamation-to-the-world/the-family-a-proclamation-to-the-world?lang=eng'
    quote: 'We further declare that God has commanded that the sacred powers of procreation are to be employed only between man and woman, lawfully wedded as husband and wife.'
