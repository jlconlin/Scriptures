chapter: 5
claims:
  - where: setting
    claim: 'Song 4:16 is the woman’s invitation to her beloved to come into his garden'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/song/4?lang=eng'
    quote: 'Let my beloved come into his garden, and eat his pleasant fruits.'
  - where: setting
    claim: 'A modern translation heads Song 5:2–8 “Another Dream”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+5&version=NRSVUE'
    quote: 'Another Dream'
  - where: setting
    claim: 'The same translation heads the night search of Song 3:1–4 “Love’s Dream”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+3&version=NRSVUE'
    quote: 'Love’s Dream'
  - where: setting
    claim: 'The daughters of Jerusalem are a group of women who speak with the woman, including at 5:8–9'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'The Song also occasionally includes comments to and by a group of women, who are several times referred to as “daughters of Jerusalem” (e.g., 1:5; 2:7; 5:8–9; 6:1)'
  - where: setting
    claim: 'The Song has four descriptions of the body, head to foot (the last foot to head): 4:1–7; 5:10–16; 6:4–7; 7:1–7'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'Such descriptions, found in Song 4:1–7; 5:10–16; 6:4–7; and 7:1–7 (moving in this last passage in reverse order from foot to head)'
  - where: setting
    claim: 'In 4:1–7 the man describes the woman'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'the male’s poetic description of the female, beginning with features of her head and moving down her body'

  - where: 'note 5:1 “He comes into his garden”'
    claim: 'The man’s words answer her invitation in 4:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/song/4?lang=eng'
    quote: 'Let my beloved come into his garden, and eat his pleasant fruits.'
  - where: 'note 5:1 “He comes into his garden”'
    claim: 'The last word of 5:1 is the plural of dod'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Song.xml'
    quote: 'דּוֹדִֽים'
  - where: 'note 5:1 “He comes into his garden”'
    claim: 'BDB: the plural dodim means love in the abstract, or at 5:1 concrete “beloved ones,” as the King James reads'
    key: bdb
    url: 'https://biblehub.com/hebrew/1730.htm'
    quote: 'plural abstract love Proverbs 7:18; Songs 1:2,4; Songs 4:10 (twice in verse); Songs 5:1 (Song of Solomon 5:1 and elsewhere concrete beloved ones, so AV RV'
  - where: 'note 5:1 “He comes into his garden”'
    claim: 'BDB: dod most often means loved one, beloved, the word throughout chapter 5'
    key: bdb
    url: 'https://biblehub.com/hebrew/1730.htm'
    quote: '1 most often loved one, beloved (lover, betrothed)'
  - where: 'note 5:1 “He comes into his garden”'
    claim: 'A modern translation reads the line as love'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+5&version=NRSVUE'
    quote: 'Eat, friends, drink, and be drunk with love.'

  - where: 'note 5:2 “A second night search”'
    claim: '“I sleep” is a feminine form in the Hebrew'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Song.xml'
    quote: 'יְשֵׁנָ֖ה'
  - where: 'note 5:2 “A second night search”'
    claim: 'A modern translation reads the line as sleeping with the heart awake and heads the passage “Another Dream”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+5&version=NRSVUE'
    quote: 'I was sleeping, but my heart was awake.'
  - where: 'note 5:2 “A second night search”'
    claim: 'The same translation heads Song 3:1–4 “Love’s Dream”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+3&version=NRSVUE'
    quote: 'Love’s Dream'
  - where: 'note 5:2 “A second night search”'
    claim: 'Song 3:1–4: she seeks him at night, the watchmen find her, she finds him and holds him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/song/3?lang=eng'
    quote: 'I held him, and would not let him go'

  - where: 'note 5:4 “Her inmost being”'
    claim: 'BDB: me’im is used figuratively as the seat of emotions: pity, God’s compassion (Jer. 31:20), distress, and love at Song 5:4; the verb hamu is used with it in Isa. 16:11 and Jer. 31:20'
    key: bdb
    url: 'https://biblehub.com/hebrew/4578.htm'
    quote: 'figurative = seat of emotions: pity, Isaiah 16:11 ("" קֶרֶב); of God''s compassion, Jeremiah 31:20 ("" רחם; in both subject of verb הָמוּ)'
  - where: 'note 5:4 “Her inmost being”'
    claim: 'BDB lists Song 5:4 under love'
    key: bdb
    url: 'https://biblehub.com/hebrew/4578.htm'
    quote: 'love, מֵעַי הָמוּ עָלָיו Songs 5:4.'
  - where: 'note 5:4 “Her inmost being”'
    claim: 'The Hebrew of 5:4 has me’im with the verb hamu'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Song.xml'
    quote: 'הָמ֥וּ'
  - where: 'note 5:4 “Her inmost being”'
    claim: 'A modern translation: “thrust his hand into the opening, and my inmost being yearned for him”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+5&version=NRSVUE'
    quote: 'My beloved thrust his hand into the opening, and my inmost being yearned for him.'

  - where: 'note 5:6 “Too late at the door”'
    claim: 'One older reading: he came perfumed, and the myrrh he brought dropped on the handles of the bolt'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/5.htm'
    quote: 'He has come perfumed as if for a festival, and the costly ointment which he brought with him has dropped on the handles of the bolts'
  - where: 'note 5:6 “Too late at the door”'
    claim: 'The same reading: her excuses in verse 3 show unwillingness to be troubled for him'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/5.htm'
    quote: 'She is unwilling for his sake to put herself to trouble, or to do that which is disagreeable to her.'

  - where: 'note 5:7 “The watchmen, and a message for him”'
    claim: 'One older reading: the watchmen were rough men who struck her as a common woman'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/5.htm'
    quote: 'These rough, regardless men, … struck (הכה, from נכה, to pierce, hit, strike) and wounded (פּצע, R. פץ, to divide, to inflict wounds in the flesh) the royal spouse as a common woman'
  - where: 'note 5:7 “The watchmen, and a message for him”'
    claim: 'The same reading: they did not care why she was out at night'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/5.htm'
    quote: 'without knowing and without caring to know what might be the motive and the aim of this her nocturnal walk'
  - where: 'note 5:7 “The watchmen, and a message for him”'
    claim: 'The same reading: the redid is a light upper robe'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/5.htm'
    quote: 'a thin and light upper robe'
  - where: 'note 5:7 “The watchmen, and a message for him”'
    claim: 'BDB: radid is a wide wrapper or large veil'
    key: bdb
    url: 'https://biblehub.com/hebrew/7289.htm'
    quote: 'wide wrapper, or large veil'
  - where: 'note 5:7 “The watchmen, and a message for him”'
    claim: 'The Septuagint reads “wounded with love”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/songs/5.htm'
    quote: 'That I am wounded with love.'

  - where: 'note 5:10 “Her portrait of him”'
    claim: 'A modern translation: “all radiant and ruddy, distinguished among ten thousand”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+5&version=NRSVUE'
    quote: 'My beloved is all radiant and ruddy, distinguished among ten thousand.'
  - where: 'note 5:10 “Her portrait of him”'
    claim: 'A modern translation of verse 14'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+5&version=NRSVUE'
    quote: 'His arms are rounded gold, set with jewels. His body is an ivory panel, decorated with sapphires.'
  - where: 'note 5:10 “Her portrait of him”'
    claim: 'The same translation notes the Hebrew is uncertain in verses 12 and 14'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+5&version=NRSVUE'
    quote: '5.14 Meaning of Heb uncertain'
  - where: 'note 5:10 “Her portrait of him”'
    claim: 'The same translation notes the Hebrew is uncertain in verse 12'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+5&version=NRSVUE'
    quote: '5.12 Meaning of Heb uncertain'
  - where: 'note 5:10 “Her portrait of him”'
    claim: 'The same translation reads “mouth” in verse 16 as speech'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+5&version=NRSVUE'
    quote: 'His speech is most sweet,'
  - where: 'note 5:10 “Her portrait of him”'
    claim: 'BDB: me’im at 5:14 is the external belly'
    key: bdb
    url: 'https://biblehub.com/hebrew/4578.htm'
    quote: '6 the external belly, מֵעָיו עֶשֶׁת שֵׁן Songs 5:14.'

  - where: section 1 plain
    claim: 'The plural at the end of 5:1 may be “love” or “beloved ones”'
    key: bdb
    url: 'https://biblehub.com/hebrew/1730.htm'
    quote: 'Songs 5:1 (Song of Solomon 5:1 and elsewhere concrete beloved ones, so AV RV'
  - where: section 2 plain
    claim: 'Plain rendering of 5:4, 5:6 and 5:8'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+5&version=NRSVUE'
    quote: 'My soul failed me when he spoke.'
  - where: section 4 plain
    claim: 'Plain rendering of 5:10, 14 and 16'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+5&version=NRSVUE'
    quote: 'His speech is most sweet,'

  - where: christ
    claim: 'Jeremiah 29:13 and D&C 88:63 promise that those who seek the Lord find Him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: 'seek me diligently and ye shall find me; ask, and ye shall receive; knock, and it shall be opened unto you.'
  - where: explore
    claim: 'The scripture threads named'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/song/3?lang=eng'
    quote: 'By night on my bed I sought him whom my soul loveth: I sought him, but I found him not.'
