    quote: 'נָדִֽיב'
  - where: 'note 6:13 “The dance of the two camps”'
    claim: 'The Hebrew word for dance'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Song.xml'
    quote: 'כִּ/מְחֹלַ֖ת'
  - where: 'note 6:4 “Tirzah and Jerusalem”'
    claim: 'Tirzah: early capital of northern Israel until Omri; in Song 6:4 a simile of beauty, parallel to Jerusalem'
    key: bdb
    url: 'https://biblehub.com/hebrew/8656.htm'
    quote: 'early cap. of Northern Israel (until Omri)'
  - where: 'note 6:4 “Tirzah and Jerusalem”'
