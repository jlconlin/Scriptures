    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Song.xml'
    quote: 'כַּֽ/חַמָּ֔ה'
  - where: 'note 6:10 “Fair as the moon in the revelations”'
    claim: 'The JST note called the Song “not inspired writings”'
    key: pike-reading-song
