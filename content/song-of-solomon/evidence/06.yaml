chapter: 6
claims:
  # setting
  - where: 'setting'
    claim: 'The daughters of Jerusalem are a group of women who speak in the Song, including at 6:1'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'The Song also occasionally includes comments to and by a group of women, who are several times referred to as “daughters of Jerusalem” (e.g., 1:5; 2:7; 5:8–9; 6:1)'
  - where: 'setting'
    claim: '5:10–16 and 6:4–7 are among the Song’s descriptions of the body, with 4:1–7 and 7:1–7'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'Such descriptions, found in Song 4:1–7; 5:10–16; 6:4–7; and 7:1–7 (moving in this last passage in reverse order from foot to head), and which involve metaphorical analogies'
  - where: 'setting'
    claim: 'A modern translation marks the speakers with headings (Friends, She, He)'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+6&version=NIV'
    quote: '§ Friends 6 Where has your beloved gone, most beautiful of women? … § She 2 My beloved has gone down to his garden'
  - where: 'setting'
    claim: 'The language of 6:10 occurs three times in the Doctrine and Covenants'
    key: pike-eliason-song-scripture
    url: 'https://byustudies.byu.edu/article/is-the-song-of-solomon-scripture'
    quote: 'variations of this phrase from Song 6:10, “fair as the moon, clear as the sun, and terrible as an army with banners,” occur three times in the Doctrine and Covenants (5:14; 105:31; 109:73)'
  - where: 'setting'
    claim: 'Verse 13 is 7:1 in the Hebrew'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+6&version=NRSVUE'
    quote: '6.13 7.1 in Heb'
  # thread
  - where: 'thread'
    claim: '“Terrible” is “awe-inspiring,” of a dignified woman; “army with banners” is bannered hosts'
    key: bdb
    url: 'https://biblehub.com/hebrew/366.htm'
    quote: 'of dignified woman, awe-inspiring אֲיֻמָּה כַּנִּדְגָלוֺת Songs 6:4,10.'
  - where: 'thread'
    claim: 'The Hebrew of verse 12 is uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+6&version=NRSVUE'
    quote: '6.12 Cn: Meaning of Heb uncertain'

  # sections
  - where: 'section 4 plain'
    claim: 'Most interpreters give 6:10 to the women'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'There is some debate on who actually speaks the boast of the female’s beauty in 6:10. Most commentators think the group of women say this, while a few suggest it is the man who makes this claim.'
  - where: 'section 5 plain'
    claim: 'A modern translation renders 6:12 “my desire set me among the royal chariots of my people”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+6&version=NIV'
    quote: '12 Before I realized it, my desire set me among the royal chariots of my people.'
  - where: 'section 6 plain'
    claim: '“Company of two armies” is the dance of Mahanaim'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+6&version=NIV'
    quote: 'Why would you gaze on the Shulammite as on the dance of Mahanaim?'

  # note 6:2
  - where: 'note 6:2 “He has gone down to his garden”'
    claim: 'A modern translation’s cross-references send 6:2 back to 4:16 and 5:1'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+6&version=NRSVUE'
    quote: '6.2 : Song 1.7; 2.1; 4.16; 5.1, 13'
  # note 6:4 Tirzah
  - where: 'note 6:4 “Tirzah and Jerusalem”'
    claim: 'Baasha was buried in Tirzah and Elah reigned there'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/16?lang=eng'
    quote: 'So Baasha slept with his fathers, and was buried in Tirzah: and Elah his son reigned in his stead.'
  - where: 'note 6:4 “Tirzah and Jerusalem”'
    claim: 'Omri reigned six years in Tirzah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/16?lang=eng'
    quote: 'began Omri to reign over Israel, twelve years: six years reigned he in Tirzah.'
  # note 6:4 banners
  - where: 'note 6:4 “Terrible as an army with banners”'
    claim: 'ayom: terrible, of the Chaldeans (Hab. 1:7); of a dignified woman, awe-inspiring'
    key: bdb
    url: 'https://biblehub.com/hebrew/366.htm'
    quote: 'אָיֹם adjective terrible, dreadful — terrible, of Chaldeans אָיֹם וְנוֺרָא הוּא Habakkuk 1:7; of dignified woman, awe-inspiring אֲיֻמָּה כַּנִּדְגָלוֺת Songs 6:4,10.'
  - where: 'note 6:4 “Terrible as an army with banners”'
    claim: 'nidgalot: bannered hosts'
    key: bdb
    url: 'https://biblehub.com/hebrew/1713.htm'
    quote: 'Niph`al Participle feminine plural נִדְגָּלוֺת Songs 6:4,10 bannered, supplied with standards, participle as substantive, of bannered hosts'
  - where: 'note 6:4 “Terrible as an army with banners”'
    claim: 'The phrase is two Hebrew words, ayummah and kannidgalot'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Song.xml'
    quote: 'כַּ/נִּדְגָּלֽוֹת'
  - where: 'note 6:4 “Terrible as an army with banners”'
    claim: 'A modern translation: “majestic as troops with banners” (6:4), “majestic as the stars in procession” (6:10)'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+6&version=NIV'
    quote: 'as majestic as troops with banners. 5 Turn your eyes from me; they overwhelm me.'
  # note 6:5
  - where: 'note 6:5 “The same praise again”'
    claim: 'The Song has four such descriptions of the body, 6:4–7 among them'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'Such descriptions, found in Song 4:1–7; 5:10–16; 6:4–7; and 7:1–7 (moving in this last passage in reverse order from foot to head), and which involve metaphorical analogies'
  - where: 'note 6:5 “The same praise again”'
    claim: 'One older reading: the repetition shows his love unchanged; she seems more beautiful than before'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/6.htm'
    quote: 'Shulamith appears to Solomon yet more beautiful than on the day when she was brought to him as his bride. His love is still the same, unchanged'

  # note 6:8
  - where: 'note 6:8 “Sixty queens, and one dove”'
    claim: 'Solomon’s court in 1 Kings 11:3: seven hundred wives and three hundred concubines'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: 'And he had seven hundred wives, princesses, and three hundred concubines: and his wives turned away his heart.'
  - where: 'note 6:8 “Sixty queens, and one dove”'
    claim: 'One older reading compares the far greater numbers of 1 Kings 11:3'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/6.htm'
    quote: 'The number off the women of Solomon''s court, 1 Kings 11:3, is far greater (700 wives and 300 concubines)'
  - where: 'note 6:8 “Sixty queens, and one dove”'
    claim: '“The only one of her mother” means uniquely loved, as in Prov. 4:3, not necessarily an only child'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/6.htm'
    quote: 'That Shulamith was her mother''s only child does not, however, follow from this; אחת, unica, is equivalent to unice dilecta, as יחיד, Proverbs 4:3, is equivalent to unice dilectus'

  # note 6:10 dawn
  - where: 'note 6:10 “Looking out like the dawn”'
    claim: 'Most interpreters give 6:10 to the women, a few to the man'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'Most commentators think the group of women say this, while a few suggest it is the man who makes this claim.'
  - where: 'note 6:10 “Looking out like the dawn”'
    claim: 'A modern translation marks 6:10 as the friends’ words, and reads “majestic as the stars in procession”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+6&version=NIV'
    quote: '§ Friends 10 Who is this that appears like the dawn, fair as the moon, bright as the sun, majestic as the stars in procession?'
  - where: 'note 6:10 “Looking out like the dawn”'
    claim: 'shahar is the dawn; the comparison suggests her radiant beauty'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'The Hebrew word shahar, [42] translated “morning” in the KJV, more specifically designates the “dawn, the first light of the new day.” [43] It is generally accepted that the “comparison [of the female in Song 6:10] to the dawn, moon, and sun suggests the radiant beauty of the woman.”'
  - where: 'note 6:10 “Looking out like the dawn”'
    claim: 'The words for moon and sun are descriptors, “white one” and “hot one,” together also in Isa. 24:23; 30:26'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'The word lebanah, “white one,” represents the moon in this verse, and hemmah, “hot one,” denotes the sun. These two words also appear together in a different context in poetic passages in Isaiah 24:23; 30:26.'
  - where: 'note 6:10 “Looking out like the dawn”'
    claim: 'The Hebrew words: shachar, lebanah, hammah, and the same two words as 6:4 at the end'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Song.xml'
    quote: 'כַ/לְּבָנָ֗ה'
  # note 6:10 revelations
  - where: 'note 6:10 “Fair as the moon in the revelations”'
    claim: 'D&C 5:14 is dated March 1829, before the JST; it applies the line to the Church as the restoration dawned'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'This text is dated to March 1829, and thus precedes Joseph Smith’s work on the JST. As with D&C 109:73, D&C 5:14 employs the description of the female’s radiant and overpowering beauty in Song 6:10 to signify the nature of the restoration as it dawned upon the world.'
  - where: 'note 6:10 “Fair as the moon in the revelations”'
    claim: 'D&C 105:31 dates to June 1834, Zion’s Camp, and applies the line to the Lord’s army'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'the imagery of Song 6:10 does not specifically represent the dawning of Christ’s latter-day Church, but rather is applied to the Lord’s “army.” Dating to June 1834, the historical context for this revelation is the march of Zion’s Camp'
  - where: 'note 6:10 “Fair as the moon in the revelations”'
    claim: 'D&C 109 is the 1836 Kirtland Temple dedicatory prayer; Joseph Smith shows no apparent concern quoting the Song'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'his use of Song 6:10 in the 1836 dedicatory prayer for the temple in Kirtland, Ohio (D&C 109)'
  - where: 'note 6:10 “Fair as the moon in the revelations”'
    claim: 'Joseph Smith shows no apparent concern about quoting the Song'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'Joseph Smith shows no apparent concern about quoting from a biblical book that four years earlier he labeled as “not inspired writings.”'
  - where: 'note 6:10 “Fair as the moon in the revelations”'
    claim: 'The revelations may use the line because female imagery represented God’s people'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'D&C 5:14 and 109:73 may well employ the imagery of Song 6:10 in relation to the coming forth of the latter-day Church because female imagery was sometimes used anciently to represent God’s people in the Old Testament and Christ’s Church in the New Testament (see, for example, Hosea 1–3; Isaiah 54:5; Matthew 25:1–13'
  - where: 'note 6:10 “Fair as the moon in the revelations”'
    claim: 'The last two passages date after the 1832 note; no reason for the note was recorded'
    key: pike-eliason-song-scripture
    url: 'https://byustudies.byu.edu/article/is-the-song-of-solomon-scripture'
    quote: 'with the latter two passages dating after the 1832 statement about the Song being “not inspired.”'
  - where: 'note 6:10 “Fair as the moon in the revelations”'
    claim: 'Joseph Smith gave no reason for the note'
    key: pike-eliason-song-scripture
    url: 'https://byustudies.byu.edu/article/is-the-song-of-solomon-scripture'
    quote: 'What is lacking from Joseph Smith and from his contemporaries is any indication of the reason for this pronouncement.'
  - where: 'note 6:10 “Fair as the moon in the revelations”'
    claim: 'An early D&C commentary proposed a lost inspired source, then allowed the Lord could use the Song’s language'
    key: pike-eliason-song-scripture
    url: 'https://byustudies.byu.edu/article/is-the-song-of-solomon-scripture'
    quote: 'Hyrum M. Smith and Janne M. Sjödahl, in one of the earliest Doctrine and Covenants commentaries, speculated that the uninspired Song was drawing upon some other now lost but truly inspired writing. … there “is no reason why the Lord could not use [this language from the Song] in a revelation given to the Church in our own day.”'

  # note 6:12
  - where: 'note 6:12 “The chariots of Amminadib”'
    claim: 'The Hebrew words of 6:12'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Song.xml'
    quote: 'מַרְכְּב֖וֹת'
  - where: 'note 6:12 “The chariots of Amminadib”'
    claim: 'Hebrew manuscripts differ on writing ammi-nadib as one word or two'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/6.htm'
    quote: 'עמּי־נדיב, thus in D F: עמּי, without the accent and connected with נדיב by Makkeph. On the contrary, P has עמּינדיב as one word'
  - where: 'note 6:12 “The chariots of Amminadib”'
    claim: 'The phrase read as “chariot of my people, a prince” or “my people, a noble (people)”'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/6.htm'
    quote: 'It is a question whether nadiv is related adject. to ammi: my people, a noble (people) … or permutat., so that the first gen. is exchanged for one defining more closely: to the royal chariot of my people, a prince.'
  - where: 'note 6:12 “The chariots of Amminadib”'
    claim: '“My soul” here is the self on the side of desire'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/6.htm'
    quote: 'then naphsi is here her own self, and that on the side of desire'
  - where: 'note 6:12 “The chariots of Amminadib”'
    claim: 'One older reading gives 6:12 to the woman, raised by her own love to the royal chariots'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/6.htm'
    quote: 'she here expressly says that no kind of external force but her own loving soul raised her to the royal chariots of her people and their king'
  - where: 'note 6:12 “The chariots of Amminadib”'
    claim: 'NRSVue: meaning of Hebrew uncertain; “in a chariot beside my prince”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+6&version=NRSVUE'
    quote: '12 Before I was aware, my desire set me in a chariot beside my prince.'
  - where: 'note 6:12 “The chariots of Amminadib”'
    claim: 'NRSVue marks the Hebrew uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+6&version=NRSVUE'
    quote: '6.12 Cn: Meaning of Heb uncertain'
  - where: 'note 6:12 “The chariots of Amminadib”'
    claim: 'NIV: royal chariots of my people; margin Amminadab, or the people of the prince; speaker He'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+6&version=NIV'
    quote: 'Song of Songs 6:12 Or among the chariots of Amminadab; or among the chariots of the people of the prince'
  - where: 'note 6:12 “The chariots of Amminadib”'
    claim: 'NIV gives 6:11–12 to the man'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+6&version=NIV'
    quote: '§ He 11 I went down to the grove of nut trees to look at the new growth in the valley'

  # note 6:13 Shulamite
  - where: 'note 6:13 “Who is the Shulamite?”'
    claim: 'BDB: usually explained as a feminine adjective of a people, with the article as noun; = Shunammite; Greek B Soumaneitis, but Aleph and A Soulamitis'
    key: bdb
    url: 'https://biblehub.com/hebrew/7759.htm'
    quote: 'usually explained as adjective, of a people, feminine Shulammite; — with article as noun ׳הַשּׁ heroine of Songs of Songs Cant 7:1(twice in verse); = Shunammite (from שׁוּנֵם, modern Sulem), B Σουμανεῖτις; but א A Σουλαμιτις'
  # note 6:13 two armies
  - where: 'note 6:13 “The dance of the two camps”'
    claim: 'The Hebrew is mecholat ha-machanayim, the second word dual with the article'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Song.xml'
    quote: 'הַֽ/מַּחֲנָֽיִם'
  - where: 'note 6:13 “The dance of the two camps”'
    claim: 'NRSVue: “a dance before two armies,” margin “dance of Mahanaim”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+6&version=NRSVUE'
    quote: 'Why should you look upon the Shulammite, as upon a dance before two armies?'
  - where: 'note 6:13 “The dance of the two camps”'
    claim: 'NRSVue margin: dance of Mahanaim'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+6&version=NRSVUE'
    quote: '6.13 Or dance of Mahanaim'
  - where: 'note 6:13 “The dance of the two camps”'
    claim: 'NIV: the dance of Mahanaim'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+6&version=NIV'
    quote: 'Why would you gaze on the Shulammite as on the dance of Mahanaim?'
  - where: 'note 6:13 “The dance of the two camps”'
    claim: 'The next description runs from foot to head'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: '7:1–7 (moving in this last passage in reverse order from foot to head)'

  # christ
  - where: 'christ'
    claim: 'The revelations apply the line to the Church as the restoration dawned'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'Of course, Latter-day Saints do accept the scriptural meta-allegory that presents Christ’s Church as a beloved woman, as his “bride.”'
  - where: 'christ'
    claim: 'Ephesians 5:25–27: Christ loved the Church and gave Himself for it, to present it glorious'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/eph/5?lang=eng'
    quote: 'That he might present it to himself a glorious church, not having spot, or wrinkle, or any such thing; but that it should be holy and without blemish.'
  - where: 'christ'
    claim: 'D&C 105:31: the army sanctified, that it may become fair as the sun'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/105?lang=eng'
    quote: 'But first let my army become very great, and let it be sanctified before me, that it may become fair as the sun, and clear as the moon'

  # explore
  - where: 'explore'
    claim: 'Pike’s article discusses the Doctrine and Covenants’ use of 6:10'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'Two other passages in the Doctrine and Covenants contain language from Song 6:10.'

