    claim: 'NIV: my desire set me among the royal chariots of my people'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+6&version=NIV'
    quote: '12 Before I realized it, my desire set me among the royal chariots of my people.'
  - where: 'note 6:12 “The chariots of Amminadib”'
    claim: 'The Hebrew word nadiv'
    key: oshb-wlc
