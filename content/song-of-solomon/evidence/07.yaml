chapter: 7
claims:
  # setting
  - where: 'setting'
    claim: 'The Hebrew numbers the chapter’s verses one higher (7:2–14)'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+7&version=NIV'
    quote: 'Song of Songs 7:1 In Hebrew texts 7:1-13 is numbered 7:2-14.'
  - where: 'setting'
    claim: 'Verses 1–7 are the fourth of the Song’s descriptions of the body, and run from foot to head, the reverse of the others'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'Such descriptions, found in Song 4:1–7; 5:10–16; 6:4–7; and 7:1–7 (moving in this last passage in reverse order from foot to head), and which involve metaphorical analogies'
  - where: 'setting'
    claim: 'A modern translation marks the speakers, and gives the second half of verse 9 on to her'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+7&version=NIV'
    quote: '§ She May the wine go straight to my beloved,(K) flowing gently over lips and teeth. 10 I belong to my beloved'

  # thread
  - where: 'thread'
    claim: 'She finishes his comparison of her mouth to wine, from “for my beloved”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+7&version=NIV'
    quote: '9 and your mouth like the best wine. § She May the wine go straight to my beloved'
  - where: 'thread'
    claim: 'The king caught in her hair (verse 5)'
    key: bdb
    url: 'https://biblehub.com/hebrew/631.htm'
    quote: 'metaphor of king held captive by a woman''s tresses Cant 7:6'

  # sections
  - where: 'section 1 plain'
    claim: 'Rounded thighs; mixed wine; flowing locks; a king held captive in the tresses'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+7&version=NRSVUE'
    quote: 'Your rounded thighs are like jewels, the work of a master hand. 2 Your navel is a rounded bowl; may it never lack mixed wine.'
  - where: 'section 1 plain'
    claim: 'Waist; head crowns you like Mount Carmel'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+7&version=NIV'
    quote: 'Your waist is a mound of wheat encircled by lilies.'
  - where: 'section 2 plain'
    claim: 'The scent of your breath; your mouth like the best wine; the wine for my beloved'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+7&version=NIV'
    quote: 'the fragrance of your breath like apples,(J) 9 and your mouth like the best wine.'
  - where: 'section 2 plain'
    claim: 'The second half of verse 8 as a wish; climbing the palm'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+7&version=NRSVUE'
    quote: '8 I said, “I will climb the palm tree and lay hold of its branches.” O may your breasts be like clusters of the vine'
  - where: 'section 3 plain'
    claim: 'Countryside; spend the night in the villages; stored up for you'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+7&version=NIV'
    quote: '11 Come, my beloved, let us go to the countryside, let us spend the night in the villages.'

  # note 7:1
  - where: 'note 7:1 “Praise from the feet upward”'
    claim: 'This description runs from foot to head, the reverse of the others'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'Such descriptions, found in Song 4:1–7; 5:10–16; 6:4–7; and 7:1–7 (moving in this last passage in reverse order from foot to head)'
  - where: 'note 7:1 “Praise from the feet upward”'
    claim: 'A modern translation gives the end of 6:13 on to the man'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+6&version=NIV'
    quote: '§ He Why would you gaze on the Shulammite as on the dance(U) of Mahanaim?'
  - where: 'note 7:1 “Praise from the feet upward”'
    claim: 'A modern translation gives the second half of verse 9 to her'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+7&version=NIV'
    quote: '§ She May the wine go straight to my beloved'
  - where: 'note 7:1 “Praise from the feet upward”'
    claim: 'Nadib means noble, princely, in rank; bat nadib at 7:1 (Hebrew 7:2)'
    key: bdb
    url: 'https://biblehub.com/hebrew/5081.htm'
    quote: '2 noble, princely, in rank 1 Samuel 2:8 (poem) … ׳בת נ Cant 7:2'
  - where: 'note 7:1 “Praise from the feet upward”'
    claim: 'The Hebrew of 7:1 has nadib'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Song.xml'
    quote: 'נָדִ֑יב'
  - where: 'note 7:1 “Praise from the feet upward”'
    claim: 'A modern translation: “O queenly maiden”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+7&version=NRSVUE'
    quote: '7 How graceful are your feet in sandals, O queenly maiden!'
  # note 7:4
  - where: 'note 7:4 “Pools, a tower and a mountain”'
    claim: 'Heshbon’s site east of the Dead Sea, richly watered, with a great reservoir'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/7.htm'
    quote: 'lay about 5 1/2 hours to the east of the northern point of the Dead Sea … The situation of the town was richly watered. There still exists a huge reservoir of excellent masonry in the valley'
  - where: 'note 7:4 “Pools, a tower and a mountain”'
    claim: 'Eyes like pools: glistening or lovely'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/7.htm'
    quote: '"either thus glistening like a water-mirror, or thus lovely in appearance, for the Arabian knows no greater pleasure than to look upon clear, gently rippling water."'
  - where: 'note 7:4 “Pools, a tower and a mountain”'
    claim: 'Bath-rabbim taken of the populous city'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/7.htm'
    quote: 'At the gate of the populous (city).'
  - where: 'note 7:4 “Pools, a tower and a mountain”'
    claim: 'The tower toward Damascus placed on a spur of Hermon or on Amana, in the northern mountains; symmetrical beauty and dignity'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/7.htm'
    quote: 'designates here "the whole Alpine range of mountains in the north of the land of Israel" … a mark of symmetrical beauty combined with awe-inspiring dignity'
  - where: 'note 7:4 “Pools, a tower and a mountain”'
    claim: 'The tower toward Damascus placed on a spur of Hermon or on Amana'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/7.htm'
    quote: 'is to be thought of as standing on one of the eastern spurs of Hermon, or on the top of Amana'
  - where: 'note 7:4 “Pools, a tower and a mountain”'
    claim: 'Carmel ruling land and sea; wooded'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/7.htm'
    quote: 'as Carmel with its noble and pleasing appearance ruled the land and sea at its feet. From the summit of Carmel, clothed with trees'
  - where: 'note 7:4 “Pools, a tower and a mountain”'
    claim: 'Purple shellfish near Carmel; purple as dark red, almost black'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/7.htm'
    quote: 'for near this promontory is the principal place where purple shell-fish are found … is dark-red, and almost glistening black'

  # note 7:5
  - where: 'note 7:5 “A king caught in her hair”'
    claim: 'Rahat: trough elsewhere; here dubious, lock of hair'
    key: bdb
    url: 'https://biblehub.com/hebrew/7298.htm'
    quote: 'II. [רַ֫הַט] noun [masculine] dubious, Thes and most lock of hair (? from flowing down); — plural רְהָטִים Cant 7:6.'
  - where: 'note 7:5 “A king caught in her hair”'
    claim: 'Rahat as watering trough in Gen. 30:38'
    key: bdb
    url: 'https://biblehub.com/hebrew/7298.htm'
    quote: 'noun [masculine] trough (where water is collected ?); — for watering cattle; — plural רְהָטִים Genesis 30:38,41; Exodus 2:16'
  - where: 'note 7:5 “A king caught in her hair”'
    claim: 'Asar: bind as a prisoner; here a metaphor of a king captive to her tresses'
    key: bdb
    url: 'https://biblehub.com/hebrew/631.htm'
    quote: '3 bind, with cords, fetters, etc., as prisoner … metaphor of king held captive by a woman''s tresses Cant 7:6'
  - where: 'note 7:5 “A king caught in her hair”'
    claim: 'The Hebrew words asur and rehatim'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Song.xml'
    quote: 'אָס֥וּר'
  - where: 'note 7:5 “A king caught in her hair”'
    claim: 'A modern translation: a king held captive in the tresses'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+7&version=NRSVUE'
    quote: 'and your flowing locks are like purple; a king is held captive in the tresses.'
  - where: 'note 7:5 “A king caught in her hair”'
    claim: 'Another modern translation reads the same'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+7&version=NIV'
    quote: 'the king is held captive by its tresses.'

  # note 7:9
  - where: 'note 7:9 “Wine for my beloved, and the lips of sleepers”'
    claim: 'Hebrew “palate”; “to my lover”; Greek, Syriac, Latin read “lips and teeth” for Hebrew “lips of sleepers”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+7&version=NRSVUE'
    quote: '7.9 Heb palate … 7.9 Heb to my lover … 7.9 Gk Syr Vg: Heb lips of sleepers'
  - where: 'note 7:9 “Wine for my beloved, and the lips of sleepers”'
    claim: 'Modern translation: “gliding over lips and teeth”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+7&version=NRSVUE'
    quote: 'and your kisses like the best wine that goes down smoothly, gliding over lips and teeth.'
  - where: 'note 7:9 “Wine for my beloved, and the lips of sleepers”'
    claim: 'A modern translation gives the rest of the verse to her, and notes the ancient versions'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+7&version=NIV'
    quote: '§ She May the wine go straight to my beloved,(K) flowing gently over lips and teeth.'
  - where: 'note 7:9 “Wine for my beloved, and the lips of sleepers”'
    claim: 'The ancient versions behind “lips and teeth”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+7&version=NIV'
    quote: 'Song of Songs 7:9 Septuagint, Aquila, Vulgate and Syriac; Hebrew lips of sleepers'
  - where: 'note 7:9 “Wine for my beloved, and the lips of sleepers”'
    claim: 'The Hebrew has dodi, “my beloved,” and “lips of sleepers”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Song.xml'
    quote: 'יְשֵׁנִֽים'
  - where: 'note 7:9 “Wine for my beloved, and the lips of sleepers”'
    claim: 'The Greek: “suiting my lips and teeth”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/songs/7.htm'
    quote: 'and thy throat as good wine, going well with my kinsman, suiting my lips and teeth.'
  - where: 'note 7:9 “Wine for my beloved, and the lips of sleepers”'
    claim: 'The verb means moving or making to speak; the lips of sleepers move'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/7.htm'
    quote: 'they have the fundamental idea of a soft, noiseless movement generally'
  - where: 'note 7:9 “Wine for my beloved, and the lips of sleepers”'
    claim: 'One older reading’s rendering of the clause'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/7.htm'
    quote: 'Which makes the lips of sleepers move.'
  - where: 'note 7:9 “Wine for my beloved, and the lips of sleepers”'
    claim: 'One older reading: the wine as a figure of love’s responses in dreams'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/7.htm'
    quote: 'But generous wine is a figure of the love-responses of the beloved, sipped in, as it were, with pleasing satisfaction, which hover still around the sleepers in delightful dreams'

  # note 7:10
  - where: 'note 7:10 “His desire is toward me”'
    claim: 'Teshuqah, longing: of woman for man Gen. 3:16, of man for woman here, of a beast to devour Gen. 4:7'
    key: bdb
    url: 'https://biblehub.com/hebrew/8669.htm'
    quote: 'noun feminine longing; — of woman for man, אֶלאִֿישֵׁח תְּשׁוּקָתֵח Genesis 3:16 (J); of man for woman, אֲנִי לְדוֺדִי וְאֵלַי תְּשׁוּקָתוֺ Cant 7:11; of beast to devour, figurative אֵלֶיךָ תְּשׁוּקָתוֺ Genesis 4:7 (J).'
  - where: 'note 7:10 “His desire is toward me”'
    claim: 'The Hebrew word in 7:10'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Song.xml'
    quote: 'תְּשׁוּקָתֽ/וֹ'

  # note 7:12
  - where: 'note 7:12 “Out to the vineyards”'
    claim: 'The vine flourishing and the pomegranates budding, as in 6:11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/song/6?lang=eng'
    quote: 'to see whether the vine flourished, and the pomegranates budded'
  - where: 'note 7:12 “Out to the vineyards”'
    claim: 'Dodai at 7:12 (Hebrew 7:13) is the plural of dod, love, as in 1:2'
    key: bdb
    url: 'https://biblehub.com/hebrew/1730.htm'
    quote: 'plural suffix דֹּדַי Cant 7:13; דֹּדֶיךָ Songs 1:2,4'
  - where: 'note 7:12 “Out to the vineyards”'
    claim: 'The Hebrew dodai in 7:12'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Song.xml'
    quote: 'דֹּדַ֖/י'
  - where: 'note 7:12 “Out to the vineyards”'
    claim: 'Her first lines: thy love is better than wine'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/song/1?lang=eng'
    quote: 'Let him kiss me with the kisses of his mouth: for thy love is better than wine.'

  # note 7:13
  - where: 'note 7:13 “Mandrakes”'
    claim: 'Duda’im may share a root with dodim, love; they were equated in poetry; the only other mention is Genesis'
    key: sc-knowhy-840
    url: 'https://scripturecentral.org/knowhy/why-does-rachel-want-leah-s-mandrakes'
    quote: 'may share the same root with the word dōdîm “love,” allowing a mandrake to be understood as “love plant.” But even if their roots are not the same, they sound similar enough that they were equated in poetry and culture'
  - where: 'note 7:13 “Mandrakes”'
    claim: 'The only other mandrakes in the Bible are in Genesis 30'
    key: sc-knowhy-840
    url: 'https://scripturecentral.org/knowhy/why-does-rachel-want-leah-s-mandrakes'
    quote: 'The only other place mandrakes are mentioned in the Bible is in Song of Songs 7:13'
  - where: 'note 7:13 “Mandrakes”'
    claim: 'Mandrakes as exciting desire and favouring procreation; here the odour'
    key: bdb
    url: 'https://biblehub.com/hebrew/1736.htm'
    quote: 'mandrakes, as exciting sexual desire, and favouring procreation Genesis 30:14 (twice in verse); Genesis 30:15 (twice in verse); Genesis 30:16 (J); also Cant 7:14 where odour referred to.'
  - where: 'note 7:13 “Mandrakes”'
    claim: 'The Hebrew ha-duda’im opens 7:13, right after dodai'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Song.xml'
    quote: 'הַֽ/דּוּדָאִ֣ים'

  # christ
  - where: 'christ'
    claim: 'Paul: one flesh, a great mystery concerning Christ and the church'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/eph/5?lang=eng'
    quote: 'This is a great mystery: but I speak concerning Christ and the church.'
  - where: 'christ'
    claim: 'The Lord’s command to love one’s wife and cleave to her and none else'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/42?lang=eng'
    quote: 'Thou shalt love thy wife with all thy heart, and shalt cleave unto her and none else.'
