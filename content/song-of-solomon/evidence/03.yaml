chapter: 3
claims:
  # setting
  - where: 'setting'
    claim: 'The Song alludes to Solomon and his possessions at 3:7, 9, 11, but its ascription to him is doubtful and its author unknown'
    key: pike-reading-song
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint'
    quote: 'There are, of course, allusions to Solomon and some of his possessions in the Song (1:5; 3:7, 9, 11; 8:11–12) … the LDS Bible Dictionary rightly indicates that the traditional ascription of this book to Solomon “is doubtful.”'

  # note 3:1
  - where: 'note 3:1 “A search by night”'
    claim: 'One older reading: the question to the watchmen, and finding him at once, belong to the nature of a dream, with inner truth if not outward reality'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/3.htm'
    quote: 'It is in the very nature of a dream, also, that things thus quickly follow one another without fixed lineaments. … an occurrence without probable external reality, although not without deep inner truth'
  - where: 'note 3:1 “A search by night”'
    claim: 'The second night search, Song 5:2–8, where the watchmen strike her'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/song/5?lang=eng'
    quote: 'The watchmen that went about the city found me, they smote me, they wounded me'

  # note 3:6
  - where: 'note 3:6 “Who is this?”'
    claim: 'The Hebrew “this” in 3:6 is zot, the feminine demonstrative'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Song.xml'
    quote: 'זֹ֗את'
  - where: 'note 3:6 “Who is this?”'
    claim: 'BDB: zot is the feminine pronoun'
    key: bdb
    url: 'https://biblehub.com/hebrew/2063.htm'
    quote: 'זֹאת pronoun feminine see זֶה.'
  - where: 'note 3:6 “Who is this?”'
    claim: 'BDB: the same question mi zot is asked at Song 3:6, 6:10 and 8:5'
    key: bdb
    url: 'https://biblehub.com/hebrew/2063.htm'
    quote: 'Who is this . . . is admissible: Isaiah 63:1; Jeremiah 46:7; Job 38:2; Job 42:3; compare מִיזֹֿאת Songs 3:6; Songs 6:10; Songs 8:5.'
  - where: 'note 3:6 “Who is this?”'
    claim: 'The same question at 8:5 is asked of a woman leaning on her beloved'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/song/8?lang=eng'
    quote: 'Who is this that cometh up from the wilderness, leaning upon her beloved?'
  - where: 'note 3:6 “Who is this?”'
    claim: 'A modern translation renders 3:6 “Who is this coming up from the wilderness”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+3&version=NIV'
    quote: 'Who is this coming up from the wilderness'
  - where: 'note 3:6 “Who is this?”'
    claim: 'Another modern translation renders 3:6 “What is that coming up,” answered in 3:7 by the litter of Solomon'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+3&version=ESV'
    quote: 'What is that coming up from the wilderness … Behold, it is the litter of Solomon!'
  - where: 'note 3:6 “Who is this?”'
    claim: 'Frankincense was imported from Arabia'
    key: bd-frankincense
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/frankincense?lang=eng'
    quote: 'it was imported into Judea from Arabia'
  - where: 'note 3:6 “Who is this?”'
    claim: 'Frankincense was an ingredient in the holy incense and valued as a perfume'
    key: bd-frankincense
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/frankincense?lang=eng'
    quote: 'It was an ingredient in the holy incense for sacrificial purposes (Ex. 30:34) and was highly valued as a perfume (Matt. 2:11).'

  # note 3:7
  - where: 'note 3:7 “Solomon’s litter”'
    claim: 'BDB: mittah is a couch or bed, used in 3:7 of the seat of King Solomon, sometimes portable'
    key: bdb
    url: 'https://biblehub.com/hebrew/4296.htm'
    quote: 'מִטָּה noun feminine couch, bed … seat of King Solomon Songs 3:7; … sometimes portable'
  - where: 'note 3:7 “Solomon’s litter”'
    claim: 'The Hebrew of 3:9 has appiryon'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Song.xml'
    quote: 'אַפִּרְי֗וֹן'
  - where: 'note 3:7 “Solomon’s litter”'
    claim: 'KnoWhy 126: the rare word afiryon, translated “chariot” in the KJV, was a non-wheeled vehicle carried by servants'
    key: sc-knowhy-126
    url: 'https://scripturecentral.org/knowhy/what-is-the-nature-and-use-of-chariots-in-the-book-of-mormon'
    quote: 'The rare Hebrew word afiryon, meaning litter, palanquin, or sedan chair, is translated as “chariot” in the KJV (Song of Solomon 3:9). This was a non-wheeled vehicle wherein a rider was carried by servants.'

  # note 3:10
  - where: 'note 3:10 “Paved with love”'
    claim: 'BDB: ratsuf ahavah in 3:10, “its interior fitted out (?) with love”; the Greek and others read “ebony”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7528.htm'
    quote: 'Qal Passive participle תּוֺכוֺ רָצוּף אַהֲבָה Songs 3:10 its interior fitted out (?) with love (Gr and others הָבְנִי ebony).'
  - where: 'note 3:10 “Paved with love”'
    claim: 'BDB: the verb means to fit together, if the reading is right; related Aramaic and Late Hebrew words mean pavement'
    key: bdb
    url: 'https://biblehub.com/hebrew/7528.htm'
    quote: 'verb fit together, fit out … Aramaic רְצַף, , arrange in a line; compare … Late Hebrew רְצְפָה, all = pavement'
  - where: 'note 3:10 “Paved with love”'
    claim: 'A modern translation reads “its interior inlaid with love,” with a margin “lovingly inlaid by the daughters of Jerusalem”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+3&version=NIV'
    quote: 'its interior inlaid with love. … Or interior lovingly inlaid / by the daughters of Jerusalem.'
  - where: 'note 3:10 “Paved with love”'
    claim: 'Another modern translation emends to “inlaid with stone,” noting the Hebrew has “with love from the daughters”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+3&version=NRSVUE'
    quote: 'its interior was inlaid with stone. … 3.10 Cn Compare Gk: Heb with love from the daughters'

  # note 3:11
  - where: 'note 3:11 “A wedding crown”'
    claim: 'BDB: atarah is a crown or wreath; in 3:11 a wedding-crown'
    key: bdb
    url: 'https://biblehub.com/hebrew/5850.htm'
    quote: 'עֲטָרָה noun feminine crown, wreath … wedding-crown Songs 3:11.'
  - where: 'note 3:11 “A wedding crown”'
    claim: 'BDB: chathunnah, marriage or wedding, occurs only in Song 3:11'
    key: bdb
    url: 'https://biblehub.com/hebrew/2861.htm'
    quote: 'noun feminine marriage, wedding … — only בְּיוֺם חֲתֻנָּתו Songs 3:11 on the day of his marriage.'
  - where: 'christ'
    claim: 'One older reading: 3:6–11 pictures the bringing-home of the bride'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/3.htm'
    quote: 'We have before us a figure of that which is called in the post-bibl. Heb. כּלה הכנסת (the bringing-home of the bride).'
  - where: 'christ'
    claim: 'One older reading: 3:6–11 pictures the bringing-home of the bride; in one form of the custom the bride was brought to the bridegroom in festal procession and he went out to meet her, the custom on which the parable of the ten virgins is founded'
    key: delitzsch-song
    url: 'https://biblehub.com/commentaries/kad/songs/3.htm'
    quote: 'or she was brought to him in festal procession, and he went forth to meet her, 1 Macc. 9:39 - the prevailing custom, on which the parable of the ten virgins (Matthew 25) is founded.'
  - where: 'christ'
    claim: 'The parable of the ten virgins and the latter-day call to meet the Bridegroom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/133?lang=eng'
    quote: 'Awake and arise and go forth to meet the Bridegroom; behold and lo, the Bridegroom cometh; go ye out to meet him. Prepare yourselves for the great day of the Lord.'

  # section plain
  - where: 'section 1 plain'
    claim: 'A modern translation renders the refrain “by the gazelles … do not stir up or awaken love until it is ready”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+3&version=NRSVUE'
    quote: 'by the gazelles or the wild does: do not stir up or awaken love until it is ready!'
  - where: 'section 2 plain'
    claim: 'A modern translation renders 3:10 with posts of silver, a base of gold and a seat of purple'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Song+of+Songs+3&version=NIV'
    quote: 'Its posts he made of silver, its base of gold. Its seat was upholstered with purple'
