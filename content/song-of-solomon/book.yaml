intro: |
  The Song of Solomon is a book of love poems: “The song of songs, which is Solomon's” ([[Song 1:1]]). A woman and a man speak to each other and about each other, with the “daughters of Jerusalem” as a chorus, in images taken from vineyards, gardens, flocks and spices. It never names God. The Church's edition of the Bible prints a note at its head: “The JST manuscript states that ‘the Songs of Solomon are not inspired writings.’” Joseph Smith changed nothing in its text, and he left no reason for the note.

  The Song has stayed in the Bible, Jewish and Christian, for some two thousand years, long read as an allegory of God's love for His people. Its words also stand in three revelations given through Joseph Smith, two of them after the note: “fair as the moon, clear as the sun, and terrible as an army with banners” ([[Song 6:10]]), used in the Kirtland Temple dedicatory prayer ([[D&C 109:73]]) among others. This companion reads all eight chapters as love poetry. It tries to anticipate the questions a careful reader would ask: who is speaking, what the images meant, why the book is in the Bible, and what Joseph Smith's note does and does not say.

  For how Hebrew poetry is built, see [Hebrew Poetry and the Prophets' Speech](/old-testament/guides/hebrew-poetry/#parallelism); for Solomon's reign, [A Timeline of the Old Testament](/old-testament/guides/israels-story/#united-kingdom).

# No source divides the book; the divisions are the drafter's, at whole chapters, by its own refrain (2:7; 3:5; 8:4)
# and the question “Who is this that cometh … from the wilderness” (3:6; 8:5) (brief, “Divisions”).
# Keys must not repeat another book’s (the colors are global variables).
divisions:
  - key: songwine
    range: [1, 2]
    name: Thy Love Is Better Than Wine
    blurb: The woman, black but comely, longs for her beloved among the daughters of Jerusalem. They praise each other, he comes leaping over the hills in the spring, and she says, “My beloved is mine, and I am his.”
    color: '#8a4a5a'
    darkColor: '#e4a6b8'
  - key: songgarden
    range: [3, 4]
    name: A Garden Inclosed
    blurb: She seeks him by night through the city and finds him. Solomon's procession comes up from the wilderness on his wedding day, and the man praises his bride from head to foot, a garden inclosed and a fountain sealed.
    color: '#5a7a4a'
    darkColor: '#b8d8a6'
  - key: songsought
    range: [5, 6]
    name: I Sought Him, but I Could Not Find Him
    blurb: He knocks in the night and is gone when she opens. The watchmen strike her, she tells the daughters of Jerusalem what her beloved is like, and he praises her again, fair as the moon and clear as the sun.
    color: '#4a5a8a'
    darkColor: '#a8b8e8'
  - key: songwaters
    range: [7, 8]
    name: Many Waters Cannot Quench Love
    blurb: He praises her beauty once more, and she invites him to the fields and vineyards. The closing poems give the seal upon the heart, a love strong as death that many waters cannot quench, her brothers' plans for their little sister, and Solomon's vineyard.
    color: '#7a5a3a'
    darkColor: '#dcbc9a'

