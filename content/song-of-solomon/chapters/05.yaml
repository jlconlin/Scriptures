chapter: 5
title: I Opened to My Beloved
tagline: The man comes into his garden; then, in a night scene, the woman is slow to answer his knock, opens too late, searches the city, is struck by the watchmen, and answers the daughters of Jerusalem with a portrait of him from head to foot.
when: 'Love poems under Solomon’s name'

setting: |
  Chapter 5 opens the third part of the Song (chapters 5–6), and that part begins with a loss: the beloved knocks, is not let in, and is gone. The chapter’s first verse still belongs to the scene before it. At the end of chapter 4 the woman said, “Let my beloved come into his garden, and eat his pleasant fruits” ([[Song 4:16]]); in verse 1 he answers. The garden image is explained at [[Song 4:12]].

  From verse 2 the woman speaks. Verses 2–8 are a night scene: she is slow to open to him, he is gone, and she searches the city for him, as she did once before ([[Song 3:1–4]]; see the note at verse 2). Verses 9–16 are an exchange with the daughters of Jerusalem, the group of women who speak with her in the Song (see [[Song 1:5]]). They ask what makes her beloved better than another, and she answers with a description of him from head to foot, the counterpart of his description of her in [[Song 4:1–7]].

  The book’s status in the Church is explained at [[Song 1:1]]. The chapter is read here as what it is, love poetry: it names no event.

thread: |
  The chapter begins at a high point. The man comes into his garden, the woman he calls “my sister, my spouse,” gathers, eats and drinks, and someone calls on the friends to eat and drink too (verse 1).

  Then it is night, and the mood turns. She is asleep, half awake, when he knocks and asks to be let in, wet with the dew. She puts him off with small excuses: she is undressed, her feet are washed (verses 2–3). His hand at the door stirs her, and she rises, her fingers dripping with myrrh on the lock, but when she opens he is gone (verses 4–6). She searches and calls, and he does not answer. The watchmen who once only met her in the streets now beat her and take her mantle (verse 7). All she can do is send word by the daughters of Jerusalem: tell him I am sick with love (verse 8).

  The daughters’ question turns the search into praise: what is your beloved more than another (verse 9)? She answers by describing him, head, hair, eyes, cheeks, lips, hands, body, legs, his bearing like Lebanon and his sweet speech, and ends, “This is my beloved, and this is my friend” (verses 10–16).

sections:
  - range: 1-1
    heading: 'He: I am come into my garden'
    plain: |
      I have come into my garden, my sister, my bride. I have gathered my myrrh with my spice, eaten my honeycomb with my honey, and drunk my wine with my milk. Eat, friends; drink, and drink deeply, beloved ones (or: drink deeply of love).
  - range: 2-8
    heading: 'She: a knock in the night'
    plain: |
      I was asleep, but my heart was awake. It is the sound of my beloved knocking: “Open to me, my sister, my love, my dove, my perfect one, for my head is wet with dew, my hair with the drops of the night.” I had taken off my robe; must I put it on again? I had washed my feet; must I dirty them? My beloved put his hand in through the opening of the door, and my inmost being yearned for him. I got up to open to my beloved, and my hands dripped with myrrh, my fingers with flowing myrrh, on the handles of the bolt. I opened to my beloved, but he had turned away and was gone. My soul failed me when he spoke. I looked for him and could not find him; I called him, and he gave no answer. The watchmen who go about the city found me; they struck me and wounded me; the guards of the walls took my mantle from me. I charge you, daughters of Jerusalem: if you find my beloved, tell him that I am faint with love.
  - range: 9-9
    heading: 'The daughters of Jerusalem: what is thy beloved?'
    plain: |
      What makes your beloved better than any other, most beautiful of women? What makes your beloved better than any other, that you charge us so?
  - range: 10-16
    heading: 'She: this is my beloved'
    plain: |
      My beloved is radiant and ruddy, outstanding among ten thousand. His head is the finest gold; his hair is wavy and black as a raven. His eyes are like doves by streams of water, washed in milk and set like jewels. His cheeks are like beds of spices, giving off fragrance; his lips are lilies dripping with flowing myrrh. His arms are rods of gold set with jewels; his body is polished ivory overlaid with sapphires. His legs are pillars of marble set on bases of fine gold; his appearance is like Lebanon, choice as its cedars. His speech is sweetness itself, and everything about him is lovely. This is my beloved, and this is my friend, daughters of Jerusalem.

notes:
  - ref: 1
    phrase: I am come into my garden
    kind: symbol
    title: He comes into his garden
    body: |
      Verse 1 is the man’s answer to the woman’s invitation at the end of chapter 4, in her own words. She said, “Let my beloved come into his garden, and eat his pleasant fruits” ([[Song 4:16]]); he says, “I am come into my garden,” and then names what he has taken there with three verbs: gathered, eaten, drunk. He calls her by the titles of chapter 4, “my sister, my spouse” (explained at [[Song 4:9]]), and the garden itself is explained at [[Song 4:12]].

      The last line turns to others, and the text does not mark who speaks it or to whom: “eat, O friends; drink, yea, drink abundantly, O beloved.” The final word is the plural of *dod*, the woman’s word for “beloved” throughout this chapter. The plural can mean “beloved ones,” as the King James reads it here, or “love” in the abstract, as it does elsewhere in the Song. A modern translation takes the second: “Eat, friends, drink, and be drunk with love.” Either way, the scene closes in celebration before the night scene of verse 2 begins.
    sources: [lds-scriptures, oshb-wlc, bdb, nrsvue]

  - ref: 2
    phrase: I sleep, but my heart waketh
    kind: structure
    title: A second night search
    body: |
      Verses 2–8 are a second night search, after the one in [[Song 3:1–4]], and this one ends in loss. “I sleep” is a feminine form in the Hebrew, so the woman is speaking. She is asleep, or half awake, when the knock comes; a modern translation reads “I was sleeping, but my heart was awake” and heads the passage “Another Dream,” after heading the first night search “Love’s Dream” ([[Song 3:1–4]]).

      The two scenes share their words. In both she looks for him at night (“I sought him, but I found him not,” [[Song 3:1]]; “I sought him, but I could not find him,” verse 6), and in both “the watchmen that go about the city found me.” In chapter 3 she asks them for him, passes on, finds him, and “held him, and would not let him go” ([[Song 3:4]]). In chapter 5 she does not find him and he does not answer her call. The search that ended in an embrace the first time ends here in a message sent by others (verse 8).
    sources: [oshb-wlc, nrsvue, lds-scriptures]

  - ref: 4
    phrase: my bowels were moved for him
    kind: words
    title: Her inmost being
    body: |
      “Bowels” is the King James word for the inner parts as the seat of feeling, and the line says that her whole self was stirred with longing for him. The Hebrew *me’im*, the inward parts, is used figuratively as the “seat of emotions”: of pity, of distress, of God’s compassion, and here of love. A modern translation reads the verse, “My beloved thrust his hand into the opening, and my inmost being yearned for him.” The same noun, with the same verb, describes the Lord’s yearning over Ephraim: “therefore my bowels are troubled for him; I will surely have mercy upon him” ([[Jer. 31:20]]).
    sources: [bdb, oshb-wlc, nrsvue]

  - ref: 6
    phrase: my beloved had withdrawn himself, and was gone
    kind: symbol
    title: Too late at the door
    body: |
      She opens, and he is gone; the text does not say why he left. Her excuses are small and domestic (she has taken off her coat for the night and washed her feet), and on one older reading they show that “She is unwilling for his sake to put herself to trouble, or to do that which is disagreeable to her.”

      The myrrh on her hands in verse 5 is, on the same older reading, his: “He has come perfumed as if for a festival, and the costly ointment which he brought with him has dropped on the handles of the bolts.”

      “My soul failed when he spake” looks back to the moment he called to her at the door; a modern translation reads, “My soul failed me when he spoke.” Then she seeks him and calls, as in chapter 3, and this time “he gave me no answer.”
    sources: [delitzsch-song, nrsvue]

  - ref: 7
    phrase: the keepers of the walls took away my veil from me
    kind: history
    title: The watchmen, and a message for him
    body: |
      The watchmen of the city, who in chapter 3 only met her ([[Song 3:3]]), now beat her and take her outer garment, and the text gives no reason. On one older reading they were “rough, regardless men” who struck and wounded her as they would “a common woman” out at night, “without knowing and without caring to know what might be the motive and the aim of this her nocturnal walk.” The “veil” is *radid*, a “wide wrapper, or large veil”; a modern translation reads “they took away my mantle,” and the older reading calls it “a thin and light upper robe.” What is taken is her outer wrap.

      Beaten and still searching, she sends the daughters of Jerusalem a message for him: “I am sick of love” (verse 8), as she said once before ([[Song 2:5]]). To be sick of love is to be weak with longing; a modern translation reads “I am faint with love.” The Greek translation of the Old Testament, the Septuagint, reads it as a wound: “That I am wounded with love.”
    sources: [delitzsch-song, bdb, nrsvue, lxx-rahlfs]

  - ref: 10
    phrase: My beloved is white and ruddy, the chiefest among ten thousand
    kind: symbol
    title: Her portrait of him
    body: |
      Asked what makes her beloved better than another (verse 9), she answers with a portrait of him from head to foot. It is one of the Song’s four descriptions of the body (4:1–7; 5:10–16; 6:4–7; 7:1–7, the last from foot to head), and here the woman describes the man, as he described her in [[Song 4:1–7]]; the form is explained at [[Song 4:1]]. She moves down from his head, hair and eyes to his cheeks, lips, hands, body and legs, then steps back to his whole bearing, “as Lebanon, excellent as the cedars,” and ends with his mouth, which a modern translation reads as his words: “His speech is most sweet.”

      Her likenesses are mostly costly materials: fine gold, beryl, ivory, sapphires, marble, sockets of gold. A modern translation reads verse 14, “His arms are rounded gold, set with jewels. His body is an ivory panel, decorated with sapphires,” and marks the meaning of the Hebrew as uncertain there and in verse 12. The “belly” of verse 14 is the word translated “bowels” in verse 4, used here of the outward body. “White and ruddy” is, in the same translation, “all radiant and ruddy, distinguished among ten thousand.”
    sources: [pike-reading-song, nrsvue, bdb]

christ: |
  The night scene ends with a search that gets no answer: “I sought him, but I could not find him; I called him, but he gave me no answer” (verse 6). Scripture’s promise about seeking the Lord runs the other way. To the exiles in Babylon He said, “And ye shall seek me, and find me, when ye shall search for me with all your heart” ([[Jer. 29:13]]), and in this dispensation, “seek me diligently and ye shall find me; ask, and ye shall receive; knock, and it shall be opened unto you” ([[D&C 88:63]]).

  A disciple who seeks the Lord with the whole heart is not left calling into an empty street. His promise is that the one who seeks Him diligently finds Him.

explore: |
  - **The two night searches.** [[Song 3:1–4]] beside [[Song 5:2–8]].
  - **The descriptions from head to foot.** [[Song 4:1–7]], [[Song 6:4–7]] and [[Song 7:1–7]].
  - **Seeking and finding the Lord.** [[Matt. 7:7–8]] and [[Luke 11:9–10]].

