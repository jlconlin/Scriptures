chapter: 8
title: Love Is Strong as Death
tagline: The woman wishes she could love her beloved openly, then asks to be set as a seal upon his heart, for love is as strong as death and many waters cannot quench it. Her brothers speak of their little sister, she answers that her vineyard is her own, and the book ends with her calling her beloved to make haste, like a roe on the mountains of spices.
when: Love poems under Solomon’s name

setting: |
  Chapter 8 is the last chapter of the Song and closes its fourth part (chapters 7–8). The book’s standing in the Church, and Joseph Smith’s note that “the Songs of Solomon are not inspired writings,” are taken up at [[Song 1:1]]; this chapter reads the poems.

  Much of the chapter brings back lines heard before. The embrace of verse 3 and the charge to the daughters of Jerusalem in verse 4 repeat [[Song 2:6–7]], where the refrain is explained. The question “Who is this that cometh up from the wilderness” was first asked at [[Song 3:6]], and the last verse bids the beloved be like a roe or a young hart, in words close to [[Song 2:17]]. New here is a short passage that is presumably the words of the woman’s brothers (verses 8–9), and the two sayings for which the chapter is best known, “love is strong as death” and “Many waters cannot quench love,” which the Church’s chapter heading takes as its summary.

  As everywhere in the Song, the King James Version marks no speakers. The Hebrew shows them by the gender of its words: the woman speaks most of the chapter, including the plea “Set me as a seal,” which is addressed to a man; the man speaks to her in verse 13; and she has the last word.

thread: |
  The chapter gathers the book’s lines and ends it. The woman wishes she could show her love in the open (verses 1–4), and she recalls where she roused him, under the apple tree (verse 5).

  At the center she asks to be set as a seal on his heart, because love is as strong as death, a fire no flood can put out and no fortune can buy (verses 6–7). What follows is short and practical: her brothers wonder what to do with their little sister when someone comes asking for her, and she answers that she is a wall and that her vineyard is her own (verses 8–12). The man asks to hear her voice, and the book ends with her bidding her beloved make haste, like a roe on the mountains (verses 13–14).

sections:
  - range: 1-4
    heading: 'She: if only you were my brother'
    plain: |
      If only you were like a brother to me, nursed at my own mother’s breasts! Then if I met you outside I could kiss you, and no one would think less of me. I would lead you and bring you into my mother’s house, where she would teach me; I would give you spiced wine to drink, the juice of my pomegranates. His left hand under my head, his right arm around me! Daughters of Jerusalem, I put you under oath: do not stir up or awaken love until it is ready.
  - range: 5
    heading: 'Who is this? She: under the apple tree'
    plain: |
      Who is this coming up from the wilderness, leaning on her beloved? (She, to him:) Under the apple tree I roused you. There your mother was in labor with you; there she who bore you gave you birth.
  - range: 6-7
    heading: 'She: set me as a seal'
    plain: |
      Set me like a seal on your heart, like a seal on your arm. For love is as strong as death, its passion as unyielding as the grave. Its sparks are sparks of fire, a fierce flame. Many waters cannot put out love, and rivers cannot drown it. If a man gave all the wealth of his house for love, he would be utterly scorned.
  - range: 8-9
    heading: 'Her brothers: our little sister'
    plain: |
      We have a little sister, and she has no breasts. What shall we do for our sister on the day someone asks for her in marriage? If she is a wall, we will build a silver battlement on her; if she is a door, we will board her up with cedar.
  - range: 10-12
    heading: 'She: I am a wall; my vineyard is my own'
    plain: |
      I am a wall, and my breasts are like towers; so in his eyes I became one who finds peace. Solomon had a vineyard at Baal-hamon. He let it out to keepers, and each was to bring a thousand pieces of silver for its fruit. My own vineyard, which is mine, is here before me. You, Solomon, may have your thousand, and the keepers of its fruit two hundred.
  - range: 13-14
    heading: 'He: let me hear your voice. She: make haste'
    plain: |
      (He:) You who live in the gardens, the companions are listening for your voice; let me hear it. (She:) Make haste, my beloved, and be like a gazelle or a young stag on the mountains of spices.

notes:
  - ref: 1
    phrase: O that thou wert as my brother
    kind: symbol
    title: If only you were my brother
    body: |
      She wishes he were like a brother born of her own mother, so that she could kiss him when she met him outside and no one would despise her for it. In the Song “brother” and “sister” are words of endearment between lovers (see [[Song 4:9]]). Here she wishes the word were true in its plain sense, of a brother “that sucked the breasts of my mother.”

      Verse 2 carries the wish home: she would bring him “into my mother’s house, who would instruct me.” The Hebrew of that last phrase can mean either “she will teach me” or “you will teach me.” The ancient Greek translation reads instead “into the chamber of her that conceived me,” the words of [[Song 3:4]].
    sources: [pike-reading-song, nrsvue, lxx-rahlfs, lds-scriptures]

  - ref: 5
    phrase: I raised thee up under the apple tree
    kind: words
    title: She wakes him under the apple tree
    body: |
      The second half of the verse is the woman speaking to the man. The King James “thee” hides it, but in Hebrew both “thee” and “thy mother” are masculine, and the lines are rendered “Under the apple tree I awakened you” and “There your mother was in labor with you.” The place where she roused him is the place where he was born.

      “Raised thee up” is the Hebrew verb translated “awake” in the refrain just before it, “stir not up, nor awake my love” (verse 4).
    sources: [oshb-wlc, esv, nrsvue]

  - ref: 6
    phrase: Set me as a seal upon thine heart, as a seal upon thine arm
    kind: symbol
    title: A seal on the heart and on the arm
    body: |
      A seal was a person’s signet, used to attest a document as his own (as Jezebel wrote letters in Ahab’s name “and sealed them with his seal,” [[1 Kgs. 21:8]]), and it was kept on the body. It hung on a cord about the neck, as Judah’s did ([[Gen. 38:18]]), or was worn on the right hand ([[Jer. 22:24]]), perhaps in a later custom. This verse “apparently combined” the two: one on the heart, one on the arm. It was also “a precious article”: the Lord promises to make Zerubbabel “as a signet” ([[Hag. 2:23]]).

      Joseph Smith may have had the line in mind when he wrote from Liberty Jail that the cruelty practiced on the Saints “will only tend to bind our hearts together and seal them together in love.” He did not say so himself.
    sources: [bdb, pike-reading-song]

  - ref: 6
    phrase: love is strong as death; jealousy is cruel as the grave
    kind: symbol
    title: As strong as death
    body: |
      The verse gives the reason for the seal: love holds as death holds. “Jealousy” is the Hebrew *qinʾah*, used elsewhere of a husband’s jealousy but here of “ardent love,” and the line is also rendered “passion fierce as the grave”; “the grave” is *Sheol* in the Hebrew. On one older reading, death is pictured as the assailant “against which nothing can hold its ground, from which nothing can escape,” and Sheol “holds them fast when once they are swallowed up”; love seizes a person with the same force and holds what it has.

      Verse 7 carries the fire of verse 6 further. On the same reading, “no heaping up of adverse circumstances can extinguish true love, as many waters extinguish elemental fire.” Nor can love be bought: a man who offered “all the substance of his house” would only be scorned.
    sources: [esv, bdb, nrsvue, delitzsch-song]

  - ref: 6
    phrase: a most vehement flame
    kind: words
    title: A flame of the Lord?
    body: |
      The last words of the verse, “a most vehement flame,” are one Hebrew word, *shalhebetyah*, whose ending *-yah* may be the divine name. It can be read as a “Yahweh-flame,” that is, a “powerful flame”; it is also rendered “a raging flame” and “flame of the Lord.”

      The Hebrew text leaves the question open. If the ending is the divine name, this is the one place God is named in a book otherwise “devoid of the name of God.”
    sources: [bdb, nrsvue, esv, oshb-wlc, pike-reading-song]

  - ref: 9
    phrase: If she be a wall
    kind: history
    title: The little sister
    body: |
      Verses 8–9 are presumably spoken by the woman’s brothers, in the one short passage the Song gives them. They ask what to do for their young sister “in the day when she shall be spoken for,” that is, when a suitor comes. On one older reading, the phrase is used of courting a wife, as when David “communed with Abigail, to take her to him to wife” ([[1 Sam. 25:39]]). Brothers also spoke for a sister, as Rebekah’s brother did ([[Gen. 24:50, 55]]) and Dinah’s brothers ([[Gen. 34:6–8]]): they were her “nearest guardians and counsellors,” “particularly in the matter of marriage.”

      On the same reading, their two pictures are opposites. A wall “stands firm and withstands every assault”; if she is one, they will build on it in silver (also rendered “battlement of silver”). A door can be opened; if she is one, they will board it with cedar, that is, “watch her in such a manner that no seducer or lover will be able to approach her.”

      In verse 10 she answers for herself: she is a wall, and her breasts are like towers. “As one that found favour” is literally “as one finding *shalom*,” peace; it is also rendered “as one who finds peace” and “as one who brings peace.” On the same older reading, the phrase varies the common Hebrew idiom for finding favour in someone’s eyes, as Esther “obtained grace and favour in his sight” ([[Esth. 2:17]]); it is used “especially of a woman gaining the affections of a man.”
    sources: [pike-reading-song, delitzsch-song, esv, bdb, nrsvue]

  - ref: 12
    phrase: My vineyard, which is mine, is before me
    kind: symbol
    title: Two vineyards
    body: |
      The woman sets her own vineyard against Solomon’s. His is let out to tenants, who pay a thousand pieces of silver for its fruit; hers, she says, “is before me.” On one older reading, “before me” “can mean nothing else than: it stands under my direction,” and her vineyard is herself, “the totality of her personal and mental endowments,” which “she is as free to dispose of as Solomon of his at Baal-hamon.” Solomon may keep his thousand.

      The payment of two hundred to “those that keep the fruit thereof” is harder to explain. The same reading takes the keepers of her vineyard to be her brothers, “the true keepers and protectors of her innocence,” but the verse does not name them. Whether Solomon had anything to do with the Song is taken up at [[Song 1:1]].
    sources: [delitzsch-song]

  - ref: 14
    phrase: Make haste, my beloved
    kind: symbol
    title: The last line
    body: |
      The book ends with the man asking to hear the woman’s voice (the Hebrew “thou that dwellest” is feminine) and her answer, in words close to those that closed chapter 2, where she told him to “turn, my beloved, and be thou like a roe or a young hart upon the mountains of Bether” ([[Song 2:17]]). Here the mountains are “of spices.”

      “Make haste” is the Hebrew imperative “flee,” the same form as in “flee thou to Laban” ([[Gen. 27:43]]), but here it carries the sense “hasten, come quickly.” Whether she calls him to her or bids him run off over the mountains, the verse does not say, and the Song stops there.
    sources: [oshb-wlc, lds-scriptures, bdb]

christ: |
  Scripture sets beside the lovers’ seal and flame a love that does more than match death. The Song says love is as strong as death. Paul claims more for the love of God in Christ: he is “persuaded, that neither death, nor life … shall be able to separate us from the love of God, which is in Christ Jesus our Lord” ([[Rom. 8:38–39]]), and Jesus measured the greatest love by death itself: “Greater love hath no man than this, that a man lay down his life for his friends” ([[John 15:13]]).

  Mormon calls that love charity, “the pure love of Christ, and it endureth forever” ([[Moro. 7:47]]), and tells disciples to “pray unto the Father with all the energy of heart, that ye may be filled with this love, which he hath bestowed upon all who are true followers of his Son, Jesus Christ” ([[Moro. 7:48]]). Death does not part a disciple from that love, and it comes as the Father’s gift to those who follow His Son and ask for it.

