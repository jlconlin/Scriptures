chapter: 6
title: Fair as the Moon, Clear as the Sun
tagline: The woman knows where her beloved has gone, he praises her again as awe-inspiring as an army with banners, the women ask who it is that looks out like the dawn, and they call the Shulamite back to be seen.
when: 'Love poems under Solomon’s name'

setting: |
  Chapter 6 finishes the division that began at 5:2. There the woman opened her door to her beloved at night and found him gone; she sought him and could not find him, the watchmen struck her, and she asked the daughters of Jerusalem, the group of women who speak in the Song (see [[Song 1:5]]), to tell him she was sick with love. They asked what made him better than any other, and she answered with a description of him from head to foot (5:10–16). Chapter 6 opens with their next question: where has he gone?

  The Hebrew gives the speakers no names. The headings below follow a modern translation that marks them, and where a speaker is disputed the note says so. Verses 4–7 are his second praise of her, feature by feature, in nearly the words of 4:1–3 (the form is explained at [[Song 4:1]]). Verse 10, “fair as the moon, clear as the sun, and terrible as an army with banners,” is the line the Doctrine and Covenants takes up three times. Verse 13 is numbered 7:1 in the Hebrew Bible, and it leads into the praise of chapter 7.

  What Joseph Smith’s note on the Song says is at [[Song 1:1]].

thread: |
  The chapter turns on a reversal. At the end of chapter 5 the woman could not find her beloved; when the daughters of Jerusalem offer to help her look (verse 1), she knows at once where he is. He has gone down to his garden, and she says again what she said in chapter 2, with the halves turned around: “I am my beloved’s, and my beloved is mine” (verses 2–3; see [[Song 2:16]]).

  Then he speaks, and what he praises is power as much as loveliness. She is as beautiful as two royal cities and as awe-inspiring as an army under its banners, and her eyes overwhelm him (verses 4–5). He repeats the praise he gave her before (verses 5–7) and sets her, the one, against a court of queens and concubines who praise her themselves (verses 8–9). Their praise becomes a question that reaches the sky: who is this, like the dawn, the moon and the sun (verse 10)?

  The last verses are obscure. Someone goes down to a garden of nuts to see whether the vines have budded and is carried off by desire, in a line whose Hebrew is uncertain (verses 11–12). Then the women call her back by a new name, the Shulamite, so that they may look at her (verse 13), and chapter 7 looks.

sections:
  - range: 1
    heading: 'The daughters of Jerusalem: where has he gone?'
    plain: |
      Where has your beloved gone, most beautiful of women? Which way has your beloved turned, so that we can look for him with you?
  - range: 2-3
    heading: 'She: he has gone down to his garden'
    plain: |
      My beloved has gone down to his garden, to the beds of spices, to graze in the gardens and to gather lilies. I belong to my beloved, and my beloved belongs to me; he grazes among the lilies.
  - range: 4-9
    heading: 'He: beautiful as Tirzah'
    plain: |
      You are beautiful, my love, as Tirzah, lovely as Jerusalem, awe-inspiring as an army under its banners. Turn your eyes away from me, for they overwhelm me. Your hair is like a flock of goats streaming down from Gilead. Your teeth are like a flock of sheep coming up from the washing; every one has its twin, and not one is missing. Your temples within your locks are like a piece of pomegranate. There are sixty queens and eighty concubines, and young women beyond counting; but my dove, my perfect one, is one alone. She is the only one of her mother, the chosen one of the woman who bore her. The young women saw her and called her blessed; the queens and the concubines praised her.
  - range: 10
    heading: 'Probably the daughters of Jerusalem: like the dawn'
    plain: |
      Who is this who looks out like the dawn, beautiful as the moon, bright as the sun, awe-inspiring as an army under its banners?
  - range: 11-12
    heading: 'One of the lovers: the garden of nuts'
    plain: |
      I went down to the grove of nut trees to see the new growth of the valley, to see whether the vine had budded and the pomegranates were in bloom. Before I knew it, my desire set me among the chariots of my noble people (the Hebrew of this line is uncertain).
  - range: 13
    heading: 'The women, then he: come back, O Shulamite'
    plain: |
      Come back, come back, O Shulamite; come back, come back, so that we may look at you. What will you see in the Shulamite? Something like the dance of the two camps.

notes:
  - ref: 2
    phrase: My beloved is gone down into his garden
    kind: symbol
    title: He has gone down to his garden
    body: |
      Her answer is that he is in his garden, though a chapter earlier she searched the city and “could not find him” ([[Song 5:6]]). The garden is not a new place in the poem. In chapter 4 he called her “a garden inclosed” ([[Song 4:12]]; the image is explained there), and she answered, “Let my beloved come into his garden” ([[Song 4:16]]); he replied, “I am come into my garden” ([[Song 5:1]]). A modern translation’s cross-references send this verse back to the last two. Her next words are words of belonging, “I am my beloved’s, and my beloved is mine” (verse 3), the words of [[Song 2:16]] in reverse order (explained there). Why she now knows where he is the text does not say.
    sources: [nrsvue]

  - ref: 4
    phrase: as Tirzah, comely as Jerusalem
    kind: history
    title: Tirzah and Jerusalem
    body: |
      He measures her beauty by two royal cities, and the first is a surprise. Tirzah was an early capital of the northern kingdom of Israel, until Omri: Baasha was buried there and his son Elah reigned there ([[1 Kgs. 16:6–8]]), and Omri reigned there six years ([[1 Kgs. 16:23]]) before he bought the hill of Samaria and built a new capital on it ([[1 Kgs. 16:24]]). Jerusalem was where Solomon’s son Rehoboam “reigned in Judah” ([[1 Kgs. 14:21]]). Here Tirzah is a simile of beauty, set in parallel with Jerusalem; why the poem chose it the text does not say.
    sources: [lds-scriptures, bdb]

  - ref: 4
    phrase: terrible as an army with banners
    kind: words
    title: Terrible as an army with banners
    body: |
      “Terrible” here means awe-inspiring, not ugly or cruel. The Hebrew adjective *ʾāyōm* (here feminine, *ʾăyummāh*) is used of the Chaldean invaders in [[Hab. 1:7]], and here, “of dignified woman, awe-inspiring.” “An army with banners” is one Hebrew word, *nidgālôt*, “bannered hosts,” troops “supplied with standards.” A modern translation has “majestic as troops with banners.”

      The comparison sounds strange for a woman until the next line says what it means: “Turn away thine eyes from me, for they have overcome me” (verse 5). Her beauty overpowers him, and the comparison says so in the language of an army in full array. The same two Hebrew words close verse 10.
    sources: [bdb, oshb-wlc, niv]

  - ref: 5
    phrase: thy hair is as a flock of goats that appear from Gilead
    kind: symbol
    title: The same praise again
    body: |
      Verses 5–7 repeat, nearly word for word, what he said of her hair, her teeth and her temples in [[Song 4:1–3]]. The run belongs to a kind of poem the Song uses four times, a description of the beloved feature by feature (4:1–7; 5:10–16; 6:4–7; 7:1–7), and its images are explained at [[Song 4:1]].

      Why he says it again the text does not say. On one older reading the repetition is itself the message: she seems to him “yet more beautiful” than when he first praised her, and “his love is still the same, unchanged,” so he praises her in the same words.
    sources: [pike-reading-song, delitzsch-song]

  - ref: 8
    phrase: There are threescore queens, and fourscore concubines
    kind: history
    title: Sixty queens, and one dove
    body: |
      He sets her against a whole royal court: sixty queens, eighty concubines, young women without number, and then “my dove, my undefiled is but one” (verse 9). The numbers are a court’s, though one older reading notes that Solomon’s court in [[1 Kgs. 11:3]] was “far greater (700 wives and 300 concubines).”

      “The only one of her mother” need not mean she was an only child. On the same reading the word means uniquely loved, as in Proverbs, where a son was “only beloved in the sight of my mother” ([[Prov. 4:3]]). The last line of verse 9 is the point of the comparison: the women who might be her rivals see her, call her blessed, and praise her.
    sources: [lds-scriptures, delitzsch-song]

  - ref: 10
    phrase: Who is she that looketh forth as the morning
    kind: symbol
    title: Looking out like the dawn
    body: |
      The verse is a question of wonder, and most interpreters hear it from the group of women, though a few give it to the man; a modern translation marks it as the friends’ words. “Morning” is *šaḥar*, “the dawn, the first light of the new day.” “Moon” and “sun” are not the usual Hebrew words but poetic ones, *lĕbānāh*, “white one,” and *ḥammāh*, “hot one,” the same pair as in [[Isa. 24:23]] and [[Isa. 30:26]].

      The comparison is generally taken to suggest “the radiant beauty of the woman”: she appears like the first light and then shines like the moon and the sun. The last phrase repeats verse 4 in the same Hebrew words, though the same modern translation renders them here “majestic as the stars in procession.”
    sources: [pike-reading-song, niv, oshb-wlc]

  - ref: 10
    phrase: fair as the moon, clear as the sun, and terrible as an army with banners
    kind: scripture
    title: Fair as the moon in the revelations
    body: |
      The Doctrine and Covenants uses this line three times: twice of the Church and once of the Lord’s army. In March 1829, before Joseph Smith began his work on the Bible, the Lord spoke of “the coming forth of my church out of the wilderness—clear as the moon, and fair as the sun, and terrible as an army with banners” ([[D&C 5:14]]). In June 1834, during the march of Zion’s Camp to Missouri, He said that His army must first “be sanctified before me, that it may become fair as the sun, and clear as the moon, and that her banners may be terrible unto all nations” ([[D&C 105:31]]). And in 1836 the dedicatory prayer of the Kirtland Temple asked “that thy church may come forth out of the wilderness of darkness, and shine forth fair as the moon, clear as the sun, and terrible as an army with banners” ([[D&C 109:73]]).

      The last two come after 1832, when the Joseph Smith Translation manuscript called the Song “not inspired writings,” a note explained at [[Song 1:1]]. Joseph Smith gave no reason for that note, and four years after it he put the line into the temple prayer with “no apparent concern.” One of the earliest commentaries on the Doctrine and Covenants proposed that the Song had borrowed the line from a lost inspired writing, and then allowed that there “is no reason why the Lord could not use [this language from the Song] in a revelation given to the Church in our own day.” A Latter-day Saint reading suggests the revelations take it up because “female imagery was sometimes used anciently to represent God’s people,” as in [[Isa. 54:5]] and [[Matt. 25:1–13]]. In the poem the line describes a woman’s beauty; in the revelations that beauty describes “the restoration as it dawned upon the world.”
    sources: [pike-reading-song, pike-eliason-song-scripture]

  - ref: 12
    phrase: the chariots of Amminadib
    kind: words
    title: The chariots of Amminadib
    body: |
      No one is sure what this line means, and the translations show it. The Hebrew reads, roughly, *my soul set me, chariots of my people, a noble* (*markĕbôt ʿammî nādîb*), and the King James took the last two words as a man’s name, Amminadib. Hebrew manuscripts differ on whether they are written as one word or two. One modern translation, marking the “meaning of Heb uncertain,” has “my desire set me in a chariot beside my prince”; another has “my desire set me among the royal chariots of my people,” with “the chariots of Amminadab” or “the chariots of the people of the prince” in its margin.

      What the readings share is that desire carried the speaker off unawares: “my soul” (*napšî*) is here the self “on the side of desire.” Who speaks is uncertain too. A modern translation gives verses 11–12 to the man; one older reading gives them to the woman, whose “own loving soul raised her to the royal chariots of her people and their king.”
    sources: [oshb-wlc, delitzsch-song, nrsvue, niv]

  - ref: 13
    phrase: O Shulamite
    kind: history
    title: Who is the Shulamite?
    body: |
      “Shulamite” is usually explained as a description rather than a personal name. In Hebrew it has the article, *the* Shulammite, and the word is commonly taken as an adjective “of a people,” used “with article as noun” for the woman of the Song, and equated with “Shunammite,” a woman from the town of Shunem. One ancient Greek manuscript of the Song reads *Soumaneitis*, the Greek form of “Shunammite,” though others read *Soulamitis*. The poem itself says nothing more about where she came from.
    sources: [bdb]

  - ref: 13
    phrase: the company of two armies
    kind: symbol
    title: The dance of the two camps
    body: |
      The King James “company of two armies” translates a name. The Hebrew is *mĕḥōlat ha-maḥănāyim*, the dance of the Mahanaim, and *Maḥănayim* is a dual form, “two hosts, or camps,” here with the article. It is also the name Jacob gave the place where “the angels of God met him”: “This is God’s host: and he called the name of that place Mahanaim” ([[Gen. 32:1–2]]); the link to that place rests on a modern translation’s cross-references. Modern translations have “a dance before two armies,” with “dance of Mahanaim” in the margin, or “the dance of Mahanaim.”

      So the comparison is to a dance, and chapter 7 goes on to describe her from her feet upward. What dance the name meant to the first hearers the text does not say.
    sources: [oshb-wlc, nrsvue, niv, pike-reading-song, lds-scriptures]

christ: |
  The revelations use this chapter’s picture of a woman looking out like the dawn for the Church of Jesus Christ: it is the Church that comes “out of the wilderness,” fair as the moon and clear as the sun ([[D&C 5:14]]; [[D&C 109:73]]). Scripture describes that Church as the bride whom Christ “loved … and gave himself for,” that He might “present it to himself a glorious church, not having spot, or wrinkle” ([[Eph. 5:25–27]]), so its brightness is His work in it. The revelation to Zion’s Camp gives the condition in plain words: the Lord’s people become “fair as the sun, and clear as the moon” as they are first “sanctified before me” ([[D&C 105:31]]), and a disciple’s own sanctification is part of the light the Church gives the world.

explore: |
  - **The line in the revelations.** Read [[Song 6:10]] with [[D&C 5:14]], [[D&C 105:31]], and [[D&C 109:72–74]].
  - **The praise repeated.** Compare [[Song 6:4–7]] with [[Song 4:1–7]].
  - **Mahanaim.** Read [[Gen. 32:1–2]].
  - **A study.** [“Reading the Song of Solomon as a Latter-day Saint”](https://rsc.byu.edu/vol-15-no-2-2014/reading-song-solomon-latter-day-saint) sets out how the Doctrine and Covenants uses this chapter’s tenth verse.

parallels:
  - ref: D&C 5:14
    note: “Clear as the moon, and fair as the sun, and terrible as an army with banners,” of the Church coming out of the wilderness (March 1829).
  - ref: D&C 105:31
    note: The Lord’s army to become “fair as the sun, and clear as the moon” (June 1834).
  - ref: D&C 109:73
    note: The Kirtland Temple prayer applies verse 10 to the Church (1836).
  - ref: Song 4:1–3
    note: The praise of hair, teeth and temples that verses 5–7 repeat.

sources: [pike-reading-song, pike-eliason-song-scripture, delitzsch-song, bdb, oshb-wlc, niv, nrsvue, lds-scriptures]
