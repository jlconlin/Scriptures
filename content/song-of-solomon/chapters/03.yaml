chapter: 3
title: I Sought Him Whom My Soul Loveth
tagline: The woman seeks her beloved by night through the city and will not let him go when she finds him, and then a royal procession comes up from the wilderness, Solomon's litter guarded by sixty men, on the day of his wedding.
when: "Love poems under Solomon's name"

setting: |
  Chapter 3 opens the second part of the book, “A Garden Inclosed” (chapters 3–4). It holds two poems. In the first (verses 1–5) the woman speaks. By night she seeks the one “whom my soul loveth,” goes out through the streets of the city, asks the watchmen, finds him, and holds him until she has brought him into her mother's house. She ends with the refrain already heard at [[Song 2:7]], “stir not up, nor awake my love, till he please,” which is explained there.

  The second poem (verses 6–11) is a royal procession, and the voice that describes it is not named. Someone comes up from the wilderness in clouds of fragrance; Solomon's litter appears with sixty armed men around it; and the daughters of Zion are called out to see King Solomon wearing the crown his mother gave him on his wedding day. Solomon is named three times in these verses, among the few places the Song brings him into the poem, though whether he wrote any of it is doubtful (see [[Song 1:1]]). The notes read him as the poem presents him: a king on the day of his wedding.

  The question that opens the procession, “Who is this that cometh … out of the wilderness,” is asked again near the end of the book ([[Song 8:5]]).

thread: |
  The chapter moves from absence to a wedding. It begins in the dark with a woman alone, who twice looks for him and does not find him, and asks the watchmen whether they have seen him (verses 1–3). Four times in four verses he is “him whom my soul loveth.” Just past the watchmen she finds him and will not let him go (verse 4). The refrain of [[Song 2:7]] closes the poem: love is not to be stirred up before its time (verse 5).

  The second poem answers the private search with a public celebration. Out of the wilderness comes a procession wrapped in incense (verse 6): Solomon's litter, under armed guard against the dangers of the night (verses 7–8), its inside “paved with love” (verses 9–10). The poem ends by calling the women of the city out to look at the king in his wedding crown, on “the day of the gladness of his heart” (verse 11).

sections:
  - range: 1-5
    heading: 'She: the search by night'
    plain: |
      At night on my bed I looked for the one I love; I looked for him, but I did not find him. I will get up now and go around the city, through the streets and the squares, and look for the one I love; I looked for him, but I did not find him. The watchmen who go around the city found me, and I asked them, “Have you seen the one I love?” I had hardly passed them when I found the one I love. I held on to him and would not let him go until I had brought him into my mother's house, into the room of the woman who conceived me. Daughters of Jerusalem, I charge you by the gazelles and the deer of the field: do not stir up or awaken love until it is ready.
  - range: 6-11
    heading: 'An unnamed voice: Solomon’s wedding procession'
    plain: |
      Who is this coming up from the wilderness like columns of smoke, perfumed with myrrh and frankincense and every fragrant powder the merchants sell? Look: it is Solomon's litter. Sixty warriors surround it, valiant men of Israel, every one holding a sword and trained for battle, each with his sword at his side against the dangers of the night. King Solomon made himself a palanquin of wood from Lebanon. He made its posts of silver, its base of gold, its seat of purple, and its inside fitted out with love for the daughters of Jerusalem. Come out, daughters of Zion, and look at King Solomon, wearing the crown his mother crowned him with on his wedding day, the day his heart was glad.

notes:
  - ref: 1
    phrase: By night on my bed I sought him whom my soul loveth
    kind: symbol
    title: A search by night
    body: |
      The search may be a dream. It begins “on my bed” at night; if she is dreaming, the watchmen could hardly have known whom she meant, and she finds him the moment she has passed them. “It is in the very nature of a dream,” on one older reading, “that things thus quickly follow one another without fixed lineaments,” so that the scene is “an occurrence without probable external reality, although not without deep inner truth.” The text itself does not say whether she dreamed or walked, and the poem does not dwell on the city: its subject is her longing for the one she calls, four times in four verses, “him whom my soul loveth.”

      A second night search comes at [[Song 5:2–8]], and there it goes worse for her: “The watchmen that went about the city found me, they smote me, they wounded me” ([[Song 5:7]]).
    sources: [delitzsch-song, lds-scriptures]

  - ref: 6
    phrase: Who is this that cometh out of the wilderness
    kind: symbol
    title: Who is this?
    body: |
      The verse does not say who or what is coming, and the translations differ. The Hebrew “this” is *zot*, a feminine pronoun. It can be rendered “Who is this coming up from the wilderness,” of a person, or “What is that coming up from the wilderness,” answered in the next line by “Behold, it is the litter of Solomon!” The Song asks the same question, *mi zot*, twice more, and both times of a woman: at [[Song 6:10]], where the King James renders it “Who is she,” and at [[Song 8:5]], “Who is this that cometh up from the wilderness, leaning upon her beloved?”

      What the onlookers see first is smoke and scent. The procession rises “like pillars of smoke,” perfumed with myrrh and frankincense. Frankincense was imported from Arabia, was an ingredient in the holy incense, and “was highly valued as a perfume.”
    sources: [oshb-wlc, bdb, lds-scriptures, niv, esv, bd-frankincense]

  - ref: 7
    phrase: Behold his bed, which is Solomon’s
    kind: history
    title: Solomon’s litter
    body: |
      The “bed” of verse 7 is Solomon's seat, and the “chariot” of verse 9 had no wheels. *Mittah* is the ordinary word for a couch or bed, “sometimes portable.” The word in verse 9, *appiryon*, is rare and means a “litter, palanquin, or sedan chair”: where the King James has “chariot,” this was “a non-wheeled vehicle wherein a rider was carried by servants.”

      So the scene is a king's litter of wood from Lebanon, with silver and gold, carried up with sixty armed men around it “because of fear in the night” (verse 8).
    sources: [bdb, oshb-wlc, sc-knowhy-126]

  - ref: 10
    phrase: the midst thereof being paved with love, for the daughters of Jerusalem
    kind: words
    title: Paved with love
    body: |
      The inside of the litter is “paved with love,” and the Hebrew is as unusual as the English. The verb, *ratsaf*, means to “fit together, fit out,” if the wording has been preserved correctly, and related words in Aramaic and later Hebrew mean “pavement”; the phrase is rendered “its interior fitted out (?) with love,” question mark and all. The last words go with it: in Hebrew the love is “from the daughters” of Jerusalem, where the King James has “for.” It is rendered “its interior inlaid with love,” with the marginal alternative “lovingly inlaid by the daughters of Jerusalem.” A proposed change to the Hebrew gives “inlaid with stone,” and the Greek and others read “ebony.” The King James keeps the Hebrew's word, “love.”
    sources: [bdb, niv, nrsvue]

  - ref: 11
    phrase: the crown wherewith his mother crowned him in the day of his espousals
    kind: history
    title: A wedding crown
    body: |
      The crown is a wedding crown, and “the day of his espousals” is Solomon's wedding day. The crown may be a wreath. The poem does not say whom he marries, or why it is his mother who crowns him. It says only that it was “the day of the gladness of his heart,” and in the next chapter the man begins to call the woman “my spouse” ([[Song 4:8]]).
    sources: [bdb]

christ: |
  Scripture uses a wedding procession for Christ. These verses have been read as “the bringing-home of the bride.” In one form of that custom, the bride “was brought to him in festal procession, and he went forth to meet her,” and this was “the prevailing custom, on which the parable of the ten virgins (Matthew 25) is founded”: “Behold, the bridegroom cometh; go ye out to meet him” ([[Matt. 25:6]]). The Lord gives the latter-day Church the same cry: “Awake and arise and go forth to meet the Bridegroom; behold and lo, the Bridegroom cometh; go ye out to meet him. Prepare yourselves for the great day of the Lord” ([[D&C 133:10]]).

  In the parable, “they that were ready went in with him to the marriage” ([[Matt. 25:10]]). The readiness that counts is the preparation the Lord asks for now, before the Bridegroom comes.

