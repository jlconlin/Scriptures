chapter: 1
title: Thy Love Is Better Than Wine
tagline: The woman longs for her beloved, tells the daughters of Jerusalem that she is black but comely, and asks where he pastures his flock. He praises her, she answers with images of fragrance, and the two end praising each other in a house of cedar.
when: Love poems under Solomon’s name

setting: |
  The Song of Solomon is a book of love poems. It has no narrator: “the Song employs only spoken words,” mostly those of a woman and a man, with a group of women, the “daughters of Jerusalem,” and once, it seems, her brothers (8:8–9). The Church’s helps call it “a collection of poetry and songs of love and affection,” with “many beautiful phrases and lyrical prose.” It does not name God.

  Above its first verse the Church’s Bible prints a note: “The JST manuscript states that ‘the Songs of Solomon are not inspired writings.’” Joseph Smith wrote it in July 1832; he made no change to the text, and he left no reason for the note, nor has the Church given one since. The Church has still never printed its Bible without the Song, and three revelations use one of its lines ([[Song 6:10]]). The note on verse 1 takes up what Joseph Smith’s note does and does not say and why the book is in the Bible; the rest of this companion reads the poems.

  Chapter 1 opens the book’s first part (chapters 1–2). The King James Version marks no speakers; the Hebrew shows them mostly by the gender of its words, and on that evidence the woman speaks most of this chapter.

thread: |
  The chapter moves from the woman’s longing to the two lovers praising each other. It opens on her desire: she speaks of him and then to him (verses 2–4), wishing he would draw her after him. She turns to the daughters of Jerusalem: she is dark from the sun, and lovely (verses 5–6). Then she asks him where he grazes his flock at noon, so that she need not look for him among the flocks of the other shepherds, and is told to follow the tracks of the flock (verses 7–8).

  From verse 9 the two speak to each other. He compares her to the horses of Pharaoh’s chariots, her cheeks and neck set off with jewelry; she answers that he is to her like myrrh and henna blossom; he says she is fair, with eyes like doves; she says he is fair, and the chapter ends with the two of them in a house whose beams are cedar and whose bed is green (verses 15–17).

sections:
  - range: 1
    heading: The title
    plain: |
      The finest of songs, which is Solomon’s.
  - range: 2-4
    heading: 'She: draw me after you'
    plain: |
      If only he would kiss me with the kisses of his mouth! For your love is better than wine. Your perfumes are sweet to smell; your name is perfume poured out, and so the young women love you. Draw me after you, and let us run; the king has brought me into his rooms. We will be glad and rejoice in you, and remember your love more than wine. (In one modern translation these last words belong to her friends.) Rightly do they love you.
  - range: 5-6
    heading: 'She, to the daughters of Jerusalem: dark, and lovely'
    plain: |
      I am dark, but lovely, you daughters of Jerusalem, dark as the tents of Kedar, lovely as Solomon’s curtains. Don’t stare at me because I am dark: the sun has darkened me. My mother’s sons were angry with me and made me keep the vineyards; my own vineyard I have not kept.
  - range: 7-8
    heading: 'She asks where he pastures; the answer'
    plain: |
      Tell me, you whom my soul loves, where you pasture your flock, where you let it rest at noon. Why should I be like a woman who goes veiled among the flocks of your companions? If you do not know, most beautiful of women, follow the tracks of the flock, and pasture your young goats beside the shepherds’ tents.
  - range: 9-11
    heading: 'He: like Pharaoh’s chariot horses'
    plain: |
      I compare you, my love, to the horses of Pharaoh’s chariots. Your cheeks are lovely with rows of ornaments, your neck with strings of jewels. We will make you ornaments of gold, studded with silver.
  - range: 12-14
    heading: 'She: myrrh and henna'
    plain: |
      While the king sat at his table, my spikenard gave out its fragrance. My beloved is to me a bundle of myrrh that lies all night between my breasts. My beloved is to me a cluster of henna blossoms in the vineyards of En-gedi.
  - range: 15-17
    heading: 'He and she: you are fair'
    plain: |
      How beautiful you are, my love, how beautiful; your eyes are like doves. How handsome you are, my beloved, how pleasant; and our bed is green. The beams of our house are cedar, and our rafters are fir.

notes:
  - ref: 1
    phrase: The song of songs
    kind: history
    title: The best of songs, and “not inspired writings”
    body: |
      The book’s title calls it the finest of songs. “Song of songs” is a Hebrew way of saying the superlative, like “holy of holies”: it means “the best song, the most wonderful song,” and with it the book “presents itself as a great song, celebrating certain aspects of human love.”

      Joseph Smith’s note at the head of the book is short, and its wording matters. From 1979 to 2012 the Bible Dictionary paraphrased it as “not inspired scripture,” which was “an overstatement of Joseph Smith’s actual notation”; the 2013 edition restored his words, “not inspired writings,” and that wording “does not touch on canonical status directly.” What it means is a reading. In one Latter-day Saint study, “not inspired” says that the Song “does not contain the Spirit-communicated divine word, nor is it divinely intended allegory,” and the same study judges that for Latter-day Saints today it is “in the traditional collection of scripture, the biblical canon, but it is not institutionally regarded as scripture,” while granting that the question is still open. The Church has made no formal pronouncement on the Song’s status.

      As for why the Song is in the Bible at all, Jews and Christians were at times reluctant to accept it “because of its romantic content but have permitted it on the basis of its being an allegory of God’s love for Israel and of the Church.” Its wide acceptance as scripture probably came only in the early second century after Christ. Latter-day Saints “have never institutionally accepted the allegorical approach,” and the notes in this book read the poems as love poems. Joseph Smith’s later use of one line in the revelations is at [[Song 6:10]].
    sources: [pike-reading-song, pike-eliason-song-scripture, bd-song-of-solomon]

  - ref: 1
    phrase: which is Solomon’s
    kind: history
    title: Solomon’s song?
    body: |
      The title ties the Song to Solomon, but whether he wrote it “is doubtful.” The Hebrew is literally “(belonging) to/for Solomon,” and that preposition can mark the author, but also the one a work is dedicated to or the one it is about; the ancient intent was most likely authorship, but it is “a traditional ascription, not proof of actual authorship.”

      Solomon was remembered as a writer of songs, 1,005 of them ([[1 Kgs. 4:32]]), and he and his possessions appear in the poems (1:5; 3:7–11; 8:11–12). Linking the Song to him “presumably helped provide the text with a regal aura” and may have helped secure its place in the canon, but “there is really no reliable way to know who composed it,” nor when: suggested dates run from the tenth to the third centuries before Christ.
    sources: [bd-song-of-solomon, pike-reading-song, pike-eliason-song-scripture]

  - ref: 2
    phrase: thy love is better than wine
    kind: words
    title: Love better than wine
    body: |
      The “love” she prefers to wine is the plural of the word she uses for the man himself. Hebrew *dod* is “beloved,” the word behind “my beloved” in 1:13, 14 and 16 and all through the book; its plural, *dodim*, means love itself, here, in 1:4 and twice in 4:10.

      The verse also turns from “him” to “thy” in a breath: she speaks about him, then to him. Modern translations divide such lines between the speakers, and one says plainly that some of its divisions “are debatable.”
    sources: [bdb, oshb-wlc, niv]

  - ref: 3
    phrase: thy name is as ointment poured forth
    kind: symbol
    title: A name like poured perfume
    body: |
      She praises his name as she praises his perfume, and the comparison is closer in Hebrew than in English: “ointment” is *shemen* and “name” is *shem*, so that his name and his perfume differ by one letter. The “virgins” who love him are *ʿalamot*, young women of an age to marry, “maid or newly married.”
    sources: [oshb-wlc, bdb]

  - ref: 4
    phrase: the king hath brought me into his chambers
    kind: history
    title: King and shepherd
    body: |
      The woman calls her beloved “the king” here and pictures him as a shepherd three verses later (1:7), and the poem does not explain the difference. One reading that a Latter-day Saint study cites takes both pictures as “figurative,” not “historical.” A story has also been told of the book, of a young maiden betrothed to a shepherd, a king who takes her to Jerusalem to win her, and her release to marry the shepherd; but the Song’s “story line is unclear as is the matter of which of its characters is speaking in many instances,” and this book does not use that story as the frame.

      The verse itself shows how hard the speakers are to fix. The King James does not say who speaks the “we” of “we will be glad and rejoice in thee”; one modern translation gives those words to her friends.
    sources: [pike-reading-song, mcconkie-poetic-writings, niv]

  - ref: 5
    phrase: I am black, but comely
    kind: symbol
    title: Black, but comely
    body: |
      She is dark from the sun, and lovely, and she says both at once to the “daughters of Jerusalem,” the group of women who are spoken to and who speak through the book (2:7; 5:8–9; 6:1). “Black” here describes her skin, and verse 6 gives the cause: “the sun hath looked upon me,” because her brothers made her work in the vineyards. On one older reading her words “express humility without abjectness.”

      Her two comparisons hold the two halves of the line. On the same reading, the tents of Kedar, a tribe of North Arabian Ishmaelites ([[Gen. 25:13]]), were covered “with cloth made of the hair of goats, which are there mostly black-coloured or grey,” and the “curtains” of Solomon are best thought of as “a pleasure-tent or pavilion for the king,” beautiful to look at: dark as the one, lovely as the other.

      In verse 6 the vineyard becomes a picture of herself. Set to keep the family’s vineyards, she has not kept “mine own vineyard,” that is, “her own person”: working outdoors, she could not keep her looks from the sun.
    sources: [pike-reading-song, bdb, delitzsch-song]

  - ref: 7
    phrase: one that turneth aside
    kind: words
    title: Like one who is veiled
    body: |
      She asks where he rests his flock at noon so that she will not have to go looking among the other shepherds like a woman who covers herself. The Hebrew word, *ʿoteyah*, comes from a verb meaning “wrap oneself, enwrap envelop oneself,” and a modern translation renders the line “why should I be like one who is veiled.” The King James “one that turneth aside” is close to an old rendering that makes her a wanderer, found in the Syriac, in Jerome’s Latin and in Luther, which assumes the letters of a different verb, *taʿah*, “to wander.”

      On one older reading, the veil is the impression she wants to avoid: a woman muffled and alone among the flocks might be taken for a harlot, as Tamar was when she “covered her with a veil” and sat by the way ([[Gen. 38:14]]). She wants to know where he is so that she “might not wander about among the flocks of his companions seeking and asking for him.” The answer in verse 8, which one modern translation gives to her friends, sends her after the tracks of the flock.
    sources: [oshb-wlc, bdb, nrsvue, delitzsch-song, niv]

  - ref: 10
    phrase: Thy cheeks are comely
    kind: history
    title: 'Comely: the word that may lie behind Nauvoo'
    body: |
      The Hebrew verb behind “are comely,” *na’vu*, may be the source of the name of the Latter-day Saints’ city on the Mississippi, Nauvoo. The form means “to be pleasing, delightful,” and occurs only twice in the Hebrew Bible: here, of the woman’s cheeks set off by her jewelry, and in Isaiah, of the messenger: “How beautiful upon the mountains are the feet of him that bringeth good tidings” ([[Isa. 52:7]]).

      Joseph Smith and other leaders studied Hebrew in Kirtland with Joshua Seixas from January to March 1836, using his grammar, and Nauvoo was named in 1839. The grammar “may have encouraged” the choice of the word, though the link “cannot be proved.”
    sources: [pike-reading-song, pike-eliason-song-scripture, bdb]

christ: |
  The Church has never institutionally accepted the allegorical reading of the Song, so this chapter’s poems point to Jesus Christ only by comparison. Scripture uses the love of bride and bridegroom as its own image of the covenant: “as the bridegroom rejoiceth over the bride, so shall thy God rejoice over thee” ([[Isa. 62:5]]); the Lord says to Israel, “I will betroth thee unto me for ever” ([[Hosea 2:19]]); and the New Testament makes Jesus the bridegroom ([[Matt. 25:1–13]]) and His people, together, His bride ([[Rev. 19:7]]). That husband-and-wife image in the prophets is one reason the Song came to be read as an allegory, but it is scripture’s image, not the Song’s meaning.

  For a disciple the comparison runs from Christ to the covenant, not from the poem to Christ. The Lord’s love for His people is a betrothal “in righteousness, and in judgment, and in lovingkindness, and in mercies” ([[Hosea 2:19]]), and the love asked of a husband is measured by His: “even as Christ also loved the church, and gave himself for it” ([[Eph. 5:25]]).

