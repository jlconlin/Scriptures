chapter: 7
title: His Desire Is toward Me
tagline: The Shulamite is praised from her sandals to her hair, he likens her to a palm tree he will climb, she answers that she is her beloved's and his desire is toward her, and she invites him out to the vineyards, where the mandrakes give their scent.
when: 'Love poems under Solomon’s name'

setting: |
  Chapter 7 opens the Song's last division, which ends with “many waters cannot quench love” ([[Song 8:7]]). It follows straight on from the last verse of chapter 6, where the Shulamite is called back, “that we may look upon thee,” and the gazing is likened to a dance ([[Song 6:13]]; the dance is explained there). In the Hebrew Bible that verse is 7:1, so the Hebrew numbers this chapter's verses one higher (7:2–14).

  Verses 1–7 are the fourth and last of the Song's descriptions of a lover's body, feature by feature (the form is explained at [[Song 4:1]]). He speaks until partway through verse 9, where the woman seems to take up his words, and verses 10–13 are hers.

  The Hebrew gives the speakers no names; the headings below follow a modern translation that marks them. What Joseph Smith's note on the Song says is at [[Song 1:1]].

thread: |
  The chapter is a praise and an answer. The praise climbs her body from the ground up: sandals, thighs, waist, breasts, neck, eyes, nose, head and hair, each likened to something fine (jewelry, wheat, fawns, a tower, the pools of Heshbon, Mount Carmel). It ends with a king caught in her hair (verse 5). Then the man speaks to her directly: she is as tall as a palm tree, and he will climb it (verses 7–8).

  She seems to take up his last comparison, of her mouth to the best wine, with “for my beloved” (verse 9), and the chapter becomes hers. She says again that she belongs to him, but this time the other half of the line is his desire for her (verse 10). Then she stops answering praise and makes a plan: out to the fields, the villages and the vineyards, to see whether the vines have budded, and there, she says, she will give him her love (verses 11–12). The chapter ends with a store laid up for him, the mandrakes and the fruits, “new and old” (verse 13).

sections:
  - range: 1-5
    heading: 'He: from her sandals to her hair'
    plain: |
      How beautiful your feet are in sandals, noble daughter! Your rounded thighs are like jewels, the work of a master craftsman. Your navel is a rounded bowl that never lacks mixed wine; your waist is a heap of wheat bordered with lilies. Your two breasts are like two fawns, twins of a gazelle. Your neck is like a tower of ivory; your eyes are like the pools of Heshbon by the gate of Bath-rabbim; your nose is like the tower of Lebanon that looks toward Damascus. Your head crowns you like Mount Carmel, and your flowing hair is like purple; a king is held captive in its locks.
  - range: 6-9
    heading: 'He, then she: the palm tree and the wine'
    plain: |
      How beautiful and how pleasant you are, my love, with all your delights! You stand as tall as a palm tree, and your breasts are like its clusters. I said, I will climb the palm tree and take hold of its branches. May your breasts be like clusters of the vine, the scent of your breath like apples, and your mouth like the best wine. (She:) Wine that goes down smoothly for my beloved, making the lips of those who sleep speak.
  - range: 10-13
    heading: 'She: come out to the vineyards'
    plain: |
      I belong to my beloved, and his desire is for me. Come, my beloved, let us go out into the countryside and spend the night in the villages. Let us go early to the vineyards and see whether the vine has budded, whether its blossoms have opened and the pomegranates are in bloom. There I will give you my love. The mandrakes give off their fragrance, and at our doors are all kinds of choice fruits, new and old, which I have stored up for you, my beloved.

notes:
  - ref: 1
    phrase: How beautiful are thy feet with shoes
    kind: symbol
    title: Praise from the feet upward
    body: |
      This praise climbs from her feet to her head, the reverse of the Song's other descriptions of the body, which begin at the head (see [[Song 4:1]]): verses 1–7 move “in reverse order from foot to head.” A modern translation marks the man as the speaker from the end of 6:13 to the middle of verse 9.

      She is called “prince's daughter”; the Hebrew word means “noble, princely, in rank,” and a modern translation renders the title “O queenly maiden.”
    sources: [pike-reading-song, niv, bdb, nrsvue]

  - ref: 4
    phrase: thine eyes like the fishpools in Heshbon
    kind: symbol
    title: Pools, a tower and a mountain
    body: |
      The praise likens her features to named places: pools, a tower, a mountain. On one older reading the tower and the mountain speak of dignity as much as of shape. At Heshbon “there still exists a huge reservoir of excellent masonry in the valley,” and her eyes are like such pools, “either thus glistening like a water-mirror, or thus lovely in appearance.” The gate of Bath-rabbim may be “the gate of the populous (city).”

      The tower “which looketh toward Damascus” is placed “on one of the eastern spurs of Hermon, or on the top of Amana,” in the mountains of the north, and likening her nose to it is “a mark of symmetrical beauty combined with awe-inspiring dignity.” Her head is like Carmel, the wooded headland that “with its noble and pleasing appearance ruled the land and sea at its feet.” Near Carmel, too, “is the principal place where purple shell-fish are found,” which may have brought the “purple” of her hair to mind: a dark red, “almost glistening black.”
    sources: [delitzsch-song]

  - ref: 5
    phrase: the king is held in the galleries
    kind: symbol
    title: A king caught in her hair
    body: |
      “Galleries” renders a rare word whose meaning here is uncertain, given, marked “dubious,” as “lock of hair (? from flowing down)”; the modern translations read the line as a king captured by her hair: “a king is held captive in the tresses.” So the praise that began at her feet ends at her hair, with the king who admires her as its prisoner.
    sources: [bdb, nrsvue, niv]

  - ref: 9
    phrase: causing the lips of those that are asleep to speak
    kind: words
    title: Wine for my beloved, and the lips of sleepers
    body: |
      The end of verse 9 is uncertain, and partway through it the woman seems to take up the man's words. He likens her mouth to the best wine. The next words, “for my beloved,” use her name for him, *dodi* (see [[Song 1:2]]), so she may be the one who speaks the rest of the verse, which a modern translation renders “May the wine go straight to my beloved.”

      The Hebrew of the last clause speaks of the lips of sleepers, with a verb from a root whose basic idea is “a soft, noiseless movement”: “Which makes the lips of sleepers move,” or in the King James, “causing the lips of those that are asleep to speak.” On one older reading the wine is then “a figure of the love-responses of the beloved,” which “hover still around the sleepers in delightful dreams.” The ancient Greek, Syriac and Latin translations read “lips and teeth” instead (the Greek: “suiting my lips and teeth”), and some modern translations follow them: “gliding over lips and teeth.”
    sources: [nrsvue, niv, oshb-wlc, lxx-rahlfs, delitzsch-song]

  - ref: 10
    phrase: his desire is toward me
    kind: words
    title: His desire is toward me
    body: |
      Her third statement of belonging ends with a rare Hebrew word for his desire for her. She said “My beloved is mine, and I am his” in [[Song 2:16]] (the words are explained there) and “I am my beloved's, and my beloved is mine” in [[Song 6:3]]. Here the second half becomes “his desire is toward me.”

      “Desire” is *teshuqah*, “longing,” a word used three times in all: “of woman for man” in [[Gen. 3:16]], “thy desire shall be to thy husband”; “of man for woman” here; and, figuratively, “of beast to devour,” where “sin lieth at the door” ([[Gen. 4:7]]). The text does not say whether the poet meant to recall Eden.
    sources: [bdb, oshb-wlc]

  - ref: 12
    phrase: there will I give thee my loves
    kind: symbol
    title: Out to the vineyards
    body: |
      Her answer to his praise is an invitation into the countryside, where she will give him her love. They are to lodge in the villages, rise early, and go to the vineyards to see whether the vine has budded and the pomegranates bloomed, the words used of the vine and the pomegranates in [[Song 6:11]]. “My loves” is *dodai*, the plural *dodim*, “love,” of her first lines: “thy love is better than wine” ([[Song 1:2]]).
    sources: [oshb-wlc, bdb, lds-scriptures]

  - ref: 13
    phrase: The mandrakes give a smell
    kind: history
    title: Mandrakes
    body: |
      Mandrakes were thought to stir love and help conception, and their Hebrew name sounds like the word for love she has just used. *Duda'im*, “mandrakes,” “may share the same root with the word dōdîm ‘love,’ allowing a mandrake to be understood as ‘love plant,’” and even if the roots differ, “they sound similar enough that they were equated in poetry and culture.” In the Hebrew, “my loves” (*dodai*) at the end of verse 12 is followed at once by “the mandrakes” (*ha-duda'im*).

      The Bible's only other mandrakes are the ones Leah and Rachel bargained over ([[Gen. 30:14–16]]); the note there explains their reputation from Egyptian art, and how that story gives the plant no credit for the births. Here they are part of the store she has kept for her beloved, with “all manner of pleasant fruits, new and old.”
    sources: [sc-knowhy-840, oshb-wlc, bdb]

christ: |
  The chapter's love belongs wholly to one person: “I am my beloved's, and his desire is toward me” (verse 10). Scripture uses that oneness of husband and wife as its own image of Christ and His Church. Paul quotes Genesis, “they two shall be one flesh,” and adds, “This is a great mystery: but I speak concerning Christ and the church” ([[Eph. 5:31–32]]).

  The Lord gives the same wholeness as a commandment in this dispensation: “Thou shalt love thy wife with all thy heart, and shalt cleave unto her and none else” ([[D&C 42:22]]). The Lord asks married disciples to give that love wholly to one spouse.

explore: |
  - **The mandrakes.** Read [[Gen. 30:14–24]].
  - **The four praises.** Read [[Song 4:1–7]], [[Song 5:10–16]], [[Song 6:4–7]], and [[Song 7:1–9]].

parallels:
  - ref: Gen. 30:14–16
    note: The only other mandrakes in the Bible, which Leah and Rachel trade for a night with Jacob.
  - ref: Gen. 3:16
    note: The same word for “desire,” of the woman's desire for her husband.
  - ref: Song 6:11
    note: The same words for the vine flourishing and the pomegranates budding.

sources: [pike-reading-song, delitzsch-song, niv, nrsvue, bdb, oshb-wlc, lxx-rahlfs, sc-knowhy-840, lds-scriptures]
