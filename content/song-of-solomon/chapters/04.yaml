chapter: 4
title: A Garden Locked, a Fountain Sealed
tagline: The man praises the woman from her eyes downward, calls her from the mountains of Lebanon as his bride, and pictures her as a locked garden full of spices and a sealed fountain; she answers by inviting him into the garden.
when: 'Love poems under Solomon’s name'

setting: |
  Chapter 4 closes the second part of the book, chapters 3–4. Chapter 3 ended with King Solomon crowned “in the day of his espousals” ([[Song 3:11]]), and in this chapter the man calls the woman “my spouse,” his bride, for the first time (the word is explained at [[Song 4:9]]). (What the Joseph Smith Translation says of the book is at [[Song 1:1]].)

  Nearly all of the chapter is the man’s. A modern translation gives verses 1–15 to “He” and verse 16 to “She,” and the Hebrew fits that division: verse 1 addresses a woman, and in the last verse the one called “my beloved” is a man. The chapter has three movements. Verses 1–7 are a poem of praise that moves down her body, the first of four such descriptions in the Song (4:1–7; 5:10–16; 6:4–7; 7:1–7). Verses 8–11 call her “my sister, my spouse.” Verses 12–15 picture her as a garden and a fountain, and verse 16 is her reply.

thread: |
  The chapter begins with a man looking at the woman he loves. Eyes, hair, teeth, lips, temples, neck and breasts each get an image from the land around him (verses 1–5), and he ends with a sweeping sentence: “Thou art all fair, my love; there is no spot in thee” (verse 7).

  Then he speaks to her instead of about her. He calls her down from the high, wild mountains of the north, “Come with me from Lebanon, my spouse” (verse 8), and tells her what she has done to him with a single glance (verse 9). Her love is better than wine, her lips drip honey, her clothes smell of Lebanon (verses 10–11).

  The last image gathers the rest. She is a garden locked, a spring shut up, a fountain sealed (verse 12). Inside the wall grows a park of fruit and costly spices (verses 13–14), and the sealed fountain turns out to be a well of living water that runs out to the gardens around it (verse 15). In the final verse she answers him. She calls the winds to stir the scent of “my garden,” and in the same breath she calls it “his garden” and invites him in (verse 16). He answers in [[Song 5:1]].

sections:
  - range: 1-7
    heading: He praises her beauty
    plain: |
      He: How beautiful you are, my love, how beautiful! Your eyes behind your veil are doves. Your hair is like a flock of goats streaming down the slopes of Mount Gilead. Your teeth are like a flock of sheep just shorn and washed, every one with its twin, none of them missing. Your lips are like a scarlet thread, and your mouth is lovely. Your temples behind your veil are like halves of a pomegranate. Your neck is like the tower of David, built as an armoury (the Hebrew word is uncertain), with a thousand shields hung on it, all of them the shields of warriors. Your two breasts are like two young deer, twins, grazing among the lilies. Until the day breaks and the shadows flee, I will go to the mountain of myrrh and the hill of frankincense. You are beautiful in every way, my love; there is no flaw in you.
  - range: 8-11
    heading: He calls his bride
    plain: |
      He: Come with me from Lebanon, my bride, come with me from Lebanon. Look from the top of Amana, from the top of Shenir and Hermon, from the lions’ dens and the mountains of the leopards. You have taken my heart, my sister, my bride; you have taken my heart with one glance of your eyes, with one link of your necklace. How beautiful is your love, my sister, my bride! How much better your love is than wine, and the scent of your perfumes than any spice! Your lips drip sweetness like the honeycomb, my bride; honey and milk are under your tongue, and your garments smell like Lebanon.
  - range: 12-15
    heading: A garden locked
    plain: |
      He: My sister, my bride, is a garden locked, a spring shut up, a fountain sealed. Your plants are a walled park of pomegranates and the choicest fruits, with henna and nard, nard and saffron, calamus and cinnamon, with every tree of frankincense, myrrh and aloes, and all the finest spices. You are a fountain for gardens, a well of living water, streams flowing down from Lebanon.
  - range: 16-16
    heading: She invites him in
    plain: |
      She: Wake up, north wind, and come, south wind! Blow on my garden, so that its fragrance pours out. Let my beloved come into his garden and eat its choice fruits.

notes:
  - ref: 1
    phrase: Behold, thou art fair, my love
    kind: symbol
    title: Praise from head to foot
    body: |
      Verses 1–7 praise the woman feature by feature, from her eyes downward, in a form the Song shares with Egyptian love poetry. Egyptian love songs of about 1300–1150 B.C. (Papyrus Chester Beatty I has some) are, on present evidence, the closest parallels to the Song outside Israel, and one of their traits is the man’s description of the woman “beginning with features of her head and moving down her body.” The Song has three more such descriptions (5:10–16; 6:4–7; and 7:1–7, the last “in reverse order from foot to head”), and each works by “metaphorical analogies.”

      One older reading explains the images one by one. The eyes are like doves “as to their colour, motion, and lustre.” The goats of the region were “for the most part, black, or at least dark coloured,” so a flock spread down a slope of Gilead pictures dark hair falling over her shoulders. Shorn sheep give the teeth their smoothness, washed sheep their whiteness, and the twins their being matched in pairs, “the one above to the one below,” with none missing (verse 2).

      One line is uncertain in the Hebrew. “Builded for an armoury” in verse 4 translates a word whose sense is “doubtful”; one proposal takes it as a poetic word for weapons, and there are “many other conjectures.” A modern translation reads “built with courses of stone” and notes that “the meaning of the Hebrew for this phrase is uncertain.” The rest of the line is clear: a tall tower hung with a thousand warriors’ shields.
    sources: [pike-reading-song, delitzsch-song, bdb, niv]

  - ref: 1
    phrase: within thy locks
    kind: words
    title: Behind thy veil
    body: |
      The Hebrew word the King James renders “locks,” *tsammah*, means a “woman’s veil,” so what the man sees are her eyes, and in verse 3 her temples, behind it. A modern translation reads it this way, with her eyes “behind your veil” in verse 1 and “Your temples behind your veil” in verse 3.
    sources: [bdb, oshb-wlc, niv]

  - ref: 8
    phrase: from the top of Shenir and Hermon
    kind: history
    title: The mountains of the north
    body: |
      The places in verse 8 lie at the northern edge of the land, around Mount Hermon and the Anti-Lebanon. Amana is a river “flowing down from Antilebanon into the plain of Damascus,” and the name is also used for “the region from which it flows.” Shenir is the “Amorite name of Hermon,” probably its northern peaks; Deuteronomy says so in an aside: “(Which Hermon the Sidonians call Sirion; and the Amorites call it Shenir;)” ([[Deut. 3:9]]). The land Israel took under Moses reached “from the river of Arnon unto mount Hermon” ([[Deut. 3:8]]).

      So the man calls his bride down from remote heights, the country of “the lions’ dens” and “the mountains of the leopards,” to be “with me.” The poem gives no reason she is there.
    sources: [bdb, lds-scriptures]

  - ref: 9
    phrase: my sister, my spouse
    kind: symbol
    title: My sister, my spouse
    body: |
      “Sister” is a word of endearment between lovers, and “spouse” is “bride.” In the Egyptian love poems the man and woman “refer to each other … as ‘my sister’ and ‘my brother,’” and the Song does the same: “my sister” in 4:9, 10, 12 and [[Song 5:1–2]], “brother” in [[Song 8:1]]. In both, “these are expressions of endearment,” not words of kinship, and “similar usage appears sporadically in other ancient Near Eastern texts.” The second word, *kallah*, means “daughter-in-law, bride.” A modern translation has “my sister, my bride.”

      “Thou hast ravished my heart” is one verb in Hebrew, made from the word for heart, and it can be read two ways: “thou hast encouraged me,” or, as the King James and several older commentators take it, “ravished my heart.” A modern translation has “You have stolen my heart … with one glance of your eyes.”
    sources: [pike-reading-song, bdb, niv]

  - ref: 12
    phrase: A garden inclosed is my sister, my spouse
    kind: symbol
    title: A garden locked, a fountain sealed
    body: |
      Verse 12 pictures the bride with three images of one thing, which a modern translation renders as a garden “locked up,” “a spring enclosed, a sealed fountain,” and verses 13–15 show what is inside. On one older reading the point is that she is kept for one man: “to a locked garden and spring no one has access but the rightful owner, and a sealed fountain is shut against all impurity.”

      “Orchard” in verse 13 is *pardes*, a loanword meaning “preserve, park,” from the Zend *pairi-daêza*, “enclosure,” a word that also passed into Greek as *paradeisos*; here it is a park of “fruit-trees and costly plants.” The same older reading notes that “most of the plants here named are exotics,” myrrh and frankincense among them (frankincense was bought “from Sheba”), and takes these flowers and fruits as “figures of all that the amata offers to the amator,” all that the beloved woman gives the man who loves her.

      Verse 15 turns the sealed fountain around: it is now “a fountain of gardens, a well of living waters, and streams from Lebanon.” On the same reading, verse 12’s point was the sealing up and verse 15’s is “the inner life and its outward activity,” a fountain that serves “the beds of plants round about.” The garden returns in [[Song 5:1]].
    sources: [niv, delitzsch-song, bdb]

  - ref: 16
    phrase: Let my beloved come into his garden
    kind: symbol
    title: My garden becomes his
    body: |
      In the last verse the woman speaks, and she gives the man the garden he has praised. A modern translation heads verse 16 “She” (and notes in its margin that verse 15 may be hers too), and the Hebrew fits it: the one called “my beloved,” *dodi*, is masculine.

      In one sentence she calls the winds to blow on “my garden” and then invites him into “his garden.” The garden he called locked in verse 12 is opened by her own invitation, and the chapter ends there. He answers at once: “I am come into my garden, my sister, my spouse” ([[Song 5:1]]).
    sources: [niv, oshb-wlc, lds-scriptures]

christ: |
  The word for “spouse” in this chapter, *kallah*, is the word Isaiah uses when he likens the Lord’s joy in His people to a bridegroom’s: “as the bridegroom rejoiceth over the bride, so shall thy God rejoice over thee” ([[Isa. 62:5]]). That is scripture’s image of covenant love, set beside the Song, not the Song’s meaning (see [[Song 1:1]]).

  The garden locked to all but the one it is given to stands beside the Church’s teaching that “the sacred powers of procreation are to be employed only between man and woman, lawfully wedded as husband and wife.” Within that covenant, intimacy “demands special sanctity” and “is—or certainly was ordained to be—a symbol of total union,” and to those who carry scars from going where they ought not, Elder Holland extended “the special peace and promise available through the atoning sacrifice of the Lord Jesus Christ.”

