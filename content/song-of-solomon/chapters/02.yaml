chapter: 2
title: Rise Up, My Love, and Come Away
tagline: The lovers trade praises, she rests in his embrace and charges the daughters of Jerusalem not to awaken love before its time, and he comes over the hills in spring to call her out.
when: 'Love poems under Solomon’s name'

setting: |
  Song of Solomon 2 goes on with the love poems of chapter 1, between a woman and a man, with “the daughters of Jerusalem” as the women who listen and are spoken to (on them, see [[Song 1:5]]). What the Church says of the book's status, with Joseph Smith's note on it, is explained at [[Song 1:1]].

  The King James prints no speakers' names. Modern translations add them, and one gives verse 1 to her, verse 2 to him, verses 3–13 to her (with his words quoted inside them), verses 14–15 to him, and verses 16–17 to her. Where the lines change hands is not always certain, and the notes say so where it matters.

  Three passages reach beyond the chapter. The charge of verse 7, “stir not up, nor awake my love, till he please,” is a refrain that returns at [[Song 3:5]] and [[Song 8:4]], and it is explained here. Elder Henry D. Taylor quoted the spring song of verses 11–12 in general conference in April 1959. And Joseph Smith used “the little foxes” of verse 15 in teaching the Nauvoo Relief Society in August 1842.

thread: |
  Song of Solomon 2 moves from praise, to presence, to distance again.

  It opens with an exchange of comparisons (verses 1–3). She calls herself a common flower; he answers that she is a lily among thorns; she answers that he is an apple tree among the trees of the forest, and she sits in his shade. Then she is with him in the house of wine, faint with love and held in his arms, and she turns to the daughters of Jerusalem with the charge that love not be stirred up before its time (verses 4–7).

  The second poem begins with his voice outside (verses 8–9). He comes bounding over the hills like a gazelle and stands behind the wall, looking in through the lattice. She tells what he said: rise up and come away, for the winter is over and the land is in flower (verses 10–13). He calls her his dove hidden in the rock and asks to see her face and hear her voice; then comes the line about the little foxes in the blossoming vineyards (verses 14–15).

  She closes with the words of belonging, “My beloved is mine, and I am his,” and calls on him, “turn, my beloved,” to be like a gazelle on the mountains until the day breathes and the shadows flee (verses 16–17). The next chapter opens with her seeking him by night ([[Song 3:1]]).

sections:
  - range: 1-3
    heading: 'She and he: the flower and the apple tree'
    plain: |
      She: I am a wildflower of Sharon, a lily of the valleys.

      He: Like a lily among thorns, so is my love among the young women.

      She: Like an apple tree among the trees of the forest, so is my beloved among the young men. I delighted to sit in his shade, and his fruit was sweet to my taste.
  - range: 4-7
    heading: 'She: the house of wine, and the charge to the daughters'
    plain: |
      He brought me into the house of wine, and his banner over me was love. Strengthen me with raisins, refresh me with apples, for I am faint with love. His left hand is under my head, and his right arm embraces me.

      Daughters of Jerusalem, I put you under oath, by the gazelles and the does of the field: do not stir up or awaken love until it is ready.
  - range: 8-13
    heading: 'She: he comes in the spring'
    plain: |
      Listen! My beloved! Here he comes, leaping over the mountains, bounding over the hills. My beloved is like a gazelle or a young stag. There he stands behind our wall, looking in at the windows, peering through the lattice.

      My beloved spoke and said to me: “Get up, my love, my beautiful one, and come away. The winter is over; the rains are past and gone. Flowers appear in the land, the time of singing has come, and the voice of the turtledove is heard in our land. The fig tree is ripening its first figs, and the vines in blossom give off their fragrance. Get up, my love, my beautiful one, and come away.”
  - range: 14-15
    heading: 'He: the dove in the rock'
    plain: |
      My dove, hidden in the clefts of the rock, in the hiding places of the cliff, let me see your face, let me hear your voice; for your voice is sweet, and your face is lovely.

      Catch the foxes for us, the little foxes that ruin the vineyards, for our vineyards are in blossom. (Who says this line is uncertain.)
  - range: 16-17
    heading: 'She: mine and his'
    plain: |
      My beloved is mine, and I am his; he feeds among the lilies. Until the day breathes and the shadows flee, turn, my beloved, and be like a gazelle or a young stag on the mountains of Bether (a name whose meaning is uncertain).

notes:
  - ref: 1
    phrase: I am the rose of Sharon, and the lily of the valleys
    kind: symbol
    title: A wildflower, and a lily among thorns
    body: |
      The “rose of Sharon” is a wild meadow flower, and in verses 1–3 the lovers trade comparisons with it. The Hebrew word is not our rose: a modern translation notes that it is “probably a member of the crocus family,” and one older reading observes that the rose “is nowhere mentioned in the canonical Scriptures” and suggests the meadow-saffron, “a simple and common flower.” Sharon is a place name borne by more than one region; the best known is the plain “on the Mediterranean coast between Joppa and Caesarea,” but there was “also a trans-Jordanic Sharon.”

      The speaker is probably the woman (one modern translation heads the verse “She,” with the note “Or He”). If so, on that older reading “she thinks humbly of herself” as one wildflower among many, “but he takes up her comparison of herself, and gives it a notable turn”: she is a lily, yes, but a lily among thorns (verse 2, where his “my love” is a feminine word in the Hebrew). She answers in kind. He is an apple tree (or “possibly apricot,” the same translation notes) among the trees of the forest (verse 3), and in a forest whose fruit is “for the most part sour and unpalatable,” the apple tree “unites delicious fruit along with a grateful shade.”
    sources: [niv, oshb-wlc, delitzsch-song]

  - ref: 4
    phrase: He brought me to the banqueting house, and his banner over me was love
    kind: symbol
    title: The house of wine, the banner, and the raisins
    body: |
      Verses 4–5 place her at a feast, under his love, and faint from it. The “banqueting house” is in the Hebrew *beit hayyayin*, the house of wine. The “banner” (*degel*) is the word for the standard each tribe of Israel camped by ([[Num. 2:2]]), and the line is hard to translate: one modern translation has “his intention toward me was love,” noting that the Hebrew is “banner above”; another makes the verse a wish, the banner of his love still to be raised over her. Either way, the image puts his love over her as openly as a standard over a camp.

      Verse 5 asks for food, not drink: where the King James has “flagons,” modern translations have raisins (“Sustain me with raisins” in one, “Strengthen me with raisins” in another), and the Church's footnote glosses “comfort me” as “refresh me.” To be “sick of love” is to be “faint with love”: she asks for food to revive her because love has overcome her.
    sources: [oshb-wlc, nrsvue, niv, lds-scriptures]

  - ref: 7
    phrase: that ye stir not up, nor awake my love, till he please
    kind: words
    title: Love itself, until it please
    body: |
      The refrain asks that love itself not be awakened before its time. In the Hebrew the thing not to be stirred up is “the love” (*ha'ahavah*), the abstract noun, and the verb after it is feminine to agree with it: “until it please.” So a modern translation reads, “do not stir up or awaken love until it is ready!” The King James, with a few others, reads it as the lover, “my love… till he please,” “rather than love itself.” The same charge returns at [[Song 3:5]] and [[Song 8:4]].

      What the charge means is a reading. On one Latter-day Saint reading, the Song here “may anticipate the dangers of its own reading” when it “counsels not to ‘awaken or arouse love before its proper time.’” She puts the daughters under oath by gazelles and does. An Israelite swore only by God, but to adjure others “by that which is not God” was allowed, and on one older reading she chooses “the animals that are most lovely and free, which roam through the fields.”
    sources: [oshb-wlc, nrsvue, pike-eliason-song-scripture, delitzsch-song]

  - ref: 8
    phrase: The voice of my beloved! behold, he cometh leaping upon the mountains
    kind: symbol
    title: She hears him coming, and tells what he said
    body: |
      Verses 8–13 are her words, and in them she quotes his. She hears him before she sees him, coming over the hills like a “roe or a young hart” (the Church's footnote: “OR gazelle, fawn”), the animal of the refrain just before. Then he is outside the house, looking in through the window lattice, and calling her out. His “Rise up… and come away” is addressed to a woman in the Hebrew, and modern translations set it in quotation marks inside her speech.

      Where his words end is uncertain. One modern translation keeps them running through verse 15 (“for our vineyards are in blossom”); another closes the quotation at verse 13 and gives verses 14–15 to him speaking directly. Either way the speaker of verses 10–15 is the man.
    sources: [lds-scriptures, oshb-wlc, nrsvue, niv]

  - ref: 11
    phrase: For, lo, the winter is past, the rain is over and gone
    kind: symbol
    title: The winter is past
    body: |
      His reason for “come away” is that spring has come, and every line of verses 11–13 is a sign of it: the rain gone, the flowers out, the figs forming, the vines in blossom. The “turtle” is the turtledove, as the Church's footnote says, and the footnote points to the prophet's turtledove that, like the stork and the crane, observes “the time of their coming” ([[Jer. 8:7]]): its voice in the land is one more mark of the season.

      Elder Henry D. Taylor quoted verses 11–12 in a general conference address on gratitude in April 1959, introducing them with “Springtime is a glorious time of the year as new life begins to stir,” and adding: “This awakening is reminiscent of the death and the resurrection of the Savior and we can appropriately dwell on the great debt of gratitude that we owe him for his atoning sacrifice.”
    sources: [lds-scriptures, pike-eliason-song-scripture]

  - ref: 14
    phrase: O my dove, that art in the clefts of the rock, in the secret places of the stairs
    kind: symbol
    title: The dove in the clefts of the rock
    body: |
      He calls her a dove hidden in the rock, and asks to see her face and hear her voice. The “secret places of the stairs” are the hiding places of a cliff (“the covert of the cliff” in a modern translation; “the hiding places on the mountainside” in another), the kind of ledge Jeremiah has in mind when he tells Moab to “be like the dove that maketh her nest in the sides of the hole's mouth” ([[Jer. 48:28]]). The picture is of someone hidden from him, and his plea is to be shown her: “let me see thy countenance, let me hear thy voice.”
    sources: [nrsvue, niv]

  - ref: 15
    phrase: Take us the foxes, the little foxes, that spoil the vines
    kind: prophets
    title: The little foxes
    body: |
      The little foxes are small animals that ruin a vineyard just as it blossoms, and Joseph Smith used the line as a proverb about little evils. Who says verse 15 is uncertain: one modern translation keeps it inside his invitation, another gives it to him directly, and one older reading gives it to her as “a vine-dresser's ditty.” The Hebrew word covers “both foxes and jackals,” which “destroy or injure the vineyards,” and where the King James has “tender grapes” modern translations have vineyards “in blossom” or “in bloom.” On one older reading the vineyards “point to her covenant of love,” and the foxes to “all the great and little enemies and adverse circumstances which threaten to gnaw and destroy love in the blossom.”

      On 31 August 1842, the minutes of the Nauvoo Relief Society record Joseph Smith teaching: “The servants of the Lord are required to guard against those things that are calculated to do the most evil— the little foxes spoil the vines—little evils do the most injury to the church.” Whether he had the line from the Song or from a saying of his day “cannot be determined”; Heber C. Kimball called it in 1861 “the old proverb.”
    sources: [nrsvue, niv, delitzsch-song, wjs-1842-08-31, pike-reading-song]

  - ref: 16
    phrase: My beloved is mine, and I am his
    kind: symbol
    title: Mine, and his
    body: |
      The line says that the two belong to each other equally, each the other's. It returns twice, with the halves turned around, “I am my beloved's, and my beloved is mine” ([[Song 6:3]]), and at last as “I am my beloved's, and his desire is toward me” ([[Song 7:10]]).

      “He feedeth among the lilies” is read two ways. A modern translation has “he pastures his flock among the lilies,” which makes him a shepherd; another has “he browses among the lilies,” which pictures him grazing.
    sources: [nrsvue, niv]

  - ref: 17
    phrase: Until the day break, and the shadows flee away, turn, my beloved
    kind: words
    title: Until the day breathes, on the mountains of Bether
    body: |
      The last verse is uncertain in more than one phrase. Where the King James has “until the day break,” a modern translation reads “until the day breathes.” The meaning of “Bether” is uncertain: the same translation renders “the cleft mountains,” noting “meaning of Heb uncertain,” and another has “the rugged hills,” with “the hills of Bether” in the margin. What is clear is the picture: the beloved as a gazelle on broken hills.
    sources: [nrsvue, niv]

christ: |
  The Song names neither God nor Christ, but its picture of a beloved who comes over the hills and calls, “Rise up, my love, my fair one, and come away” (verses 8–13), sits beside scripture's own image of the Lord's coming as a bridegroom's: “Behold, the bridegroom cometh; go ye out to meet him” ([[Matt. 25:6]]), a cry renewed to the latter-day Church: “prepare ye for the coming of the Bridegroom; go ye, go ye out to meet him” ([[D&C 133:19]]). Those who are ready when He comes go in with Him to the marriage ([[Matt. 25:10]]).

  The refrain of verse 7, read as counsel not to awaken love before its time, stands beside the Church's teaching that “the sacred powers of procreation are to be employed only between man and woman, lawfully wedded as husband and wife.” For a disciple, the waiting the refrain asks for is kept within covenant: love's time to be awakened is marriage.

explore: |
  - **The refrain.** Read [[Song 3:5]] and [[Song 8:4]] beside verse 7.
  - **Belonging.** Follow verse 16 through [[Song 6:3]] and [[Song 7:10]].
  - **The bridegroom's coming.** Read [[Matt. 25:1–13]] with [[D&C 133:10, 19]].

sources: [niv, nrsvue, oshb-wlc, delitzsch-song, lds-scriptures, pike-reading-song, pike-eliason-song-scripture, wjs-1842-08-31, family-proclamation]
