summary: >-
  The Song of Solomon is a book of love poems that never names God, and its steadiest
  images are of a love that is kept and that lasts: a garden inclosed, a spring shut up, and
  at the end a love that many waters cannot quench. The image is a small walled garden with
  its spring sealed, in the green of spring, above broad quiet waters that do not reach it.
  It makes no claim about what the poems stand for.
motifs:
  - "Most important: a small garden inclosed by a low wall of pale stone, its wooden gate shut, with a round stone wellhead at its center closed by a flat capstone, and white lilies and spice shrubs growing inside; a thin stream of water runs out under the wall and down the slope (Song of Solomon 4:12, 15)."
  - "Supporting: a broad, calm river in the valley below, running away into the distance under the low sun, never reaching the garden (Song of Solomon 8:7)."
  - "Supporting: a fig tree with small green figs at the upper left, and vines on a dry-stone terrace on the slope above (Song of Solomon 2:13)."
composition: >-
  A wide hillside in warm low light from the sun on the right. The walled garden sits left of
  center on the slope, its lilies and covered spring the brightest point; the river runs
  through the valley at the right toward the sun. Terraced vines climb the slope behind the
  garden; a fig tree frames the upper left; wildflowers and shrubs cover the foreground.
key:
  - '**The walled garden with its shut gate and covered spring** is the man''s picture of the woman he loves: “A garden inclosed is my sister, my spouse; a spring shut up, a fountain sealed” ([[Song 4:12]]).'
  - '**The water running out under the wall** is the same spring in the next lines: “A fountain of gardens, a well of living waters, and streams from Lebanon” ([[Song 4:15]]).'
  - '**The lilies** inside the garden are where her beloved is found: “My beloved is mine, and I am his: he feedeth among the lilies” ([[Song 2:16]]).'
  - '**The broad river** below, which does not reach the garden, shows the book''s last word on love: “Many waters cannot quench love, neither can the floods drown it” ([[Song 8:7]]).'
  - '**The fig tree and the terraced vines** show the springtime he calls her into: “The fig tree putteth forth her green figs, and the vines with the tender grape give a good smell. Arise, my love, my fair one, and come away” ([[Song 2:13]]).'
