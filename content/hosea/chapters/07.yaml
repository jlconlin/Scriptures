chapter: 7
title: A Cake Not Turned
tagline: The Lord moves to heal Israel, and its guilt comes to light. A court burns like an oven and consumes its own kings, a nation flutters between Egypt and Assyria like a dove, and through all of it no one calls on Him.
when: 'Undated; the northern kingdom’s last decades, in the 700s B.C.'

setting: |
  Chapter 7 belongs to the long run of oracles (chapters 4–10) in which the Lord argues His case against Israel, and it has no date. Hosea prophesied in the northern kingdom in the latter half of the eighth century B.C., when Assyria was close to conquering it.

  The first half of the chapter looks at the king and his princes, and the book of Kings supplies the names Hosea leaves out. After Jeroboam Ⅱ, the king in whose reign Hosea began, one king after another was killed by the man who took his throne ([[2 Kgs. 15:8–30]]; the note on verse 7 counts them). Those conspiracies weakened the kingdom, and it looked to Assyria and to Egypt for help. Verses 3–7 speak of the court and its fallen kings, and verses 8–16 of Ephraim among the nations.

  “Ephraim” is the northern kingdom, called by the name of its leading tribe (see the note on [[Hos. 4:17]]).

  The chapter moves quickly from picture to picture, as this part of the book does: an oven, an unturned cake, gray hair, a dove, a net, and a bow, in sixteen verses. Each makes a charge of its own.

thread: |
  The chapter is about a people who cannot see what is happening to them, and its key sentence comes twice in verse 9: “he knoweth it not.” The Lord moves to heal, and Israel’s guilt comes into view (verse 1). The people “consider not in their hearts” that He remembers what they do (verse 2). Kings fall one after another, and “there is none among them that calleth unto me” (verse 7). Foreigners eat up the nation’s strength, its hair turns gray, and it does not notice.

  The first half (verses 1–7) looks inward, at the palace. The court entertains its king with wickedness, drinks itself sick on his feast day, and smolders all night like an oven until it blazes in the morning; “all their kings are fallen.” The second half (verses 8–16) looks outward. Ephraim has mixed himself in among the nations and flies like a dove from Egypt to Assyria, and the Lord says the net waiting for him is His own.

  One question runs through both halves: to whom do they call? No one calls on the Lord (verse 7). They call to Egypt (verse 11), and the Hebrew verb is the same in both verses. They howl, but they do not cry to Him from the heart (verse 14). They turn, but not upward (verse 16).

sections:
  - range: 1-2
    heading: “When I would have healed Israel”
    plain: |
      When the Lord would have healed Israel, the guilt of Ephraim and the evils of Samaria came into view. They deal in falsehood; thieves break in, and bands of robbers plunder in the open. They do not stop to think that He remembers all their wickedness. Their own deeds now surround them, and they are before His face.
  - range: 3-7
    heading: Hot as an oven
    plain: |
      They please the king with their wickedness and the princes with their lies. All of them are adulterers, like an oven that the baker has heated and then leaves alone from the kneading of the dough until it has risen. On the king’s day the princes are sick with the heat of wine, and he joins hands with scoffers. They have made their heart ready like an oven while they lie in wait; all night their baker sleeps, and in the morning it blazes like a flame. They are all hot as an oven, and they have devoured their judges. All their kings have fallen, and not one of them calls on the Lord.
  - range: 8-10
    heading: A cake not turned
    plain: |
      Ephraim has mixed himself in among the peoples; Ephraim is a cake left unturned. Strangers have eaten up his strength, and he does not know it. Gray hairs are scattered on him, and he does not know it. The pride of Israel testifies to his face, and for all this they do not return to the Lord their God or seek Him.
  - range: 11-13
    heading: A silly dove
    plain: |
      Ephraim is like a simple dove with no sense: they call to Egypt, they go to Assyria. As they go, the Lord will spread His net over them and bring them down like the birds of the air, and He will chastise them as their congregation has heard. Woe to them, for they have fled from Him; destruction to them, for they have transgressed against Him. He would have redeemed them, but they have spoken lies against Him.
  - range: 14-16
    heading: A deceitful bow
    plain: |
      They have not cried to Him with their heart when they howled on their beds. They gather for grain and wine, and they rebel against Him. He trained and strengthened their arms, and still they plan evil against Him. They turn, but not to the Most High; they are like a bow that cannot be trusted. Their princes will fall by the sword for the rage of their tongue, and in the land of Egypt they will be mocked for it.

notes:
  - ref: 1
    phrase: When I would have healed Israel
    kind: words
    title: Healing that uncovers the wound
    body: |
      When the Lord moves to heal Israel, its guilt comes to light. “Discovered” here is uncovered: the Hebrew verb means to “be disclosed, discovered,” and modern translations have “the corruption of Ephraim is revealed” and “the sins of Ephraim are exposed.” The clause also finishes the last sentence of chapter 6, which is why those translations begin this chapter in the middle of a sentence (see the note on [[Hos. 6:11]]).

      The thought is a physician’s: “As the dangerous nature of a wound is often first brought out by the attempt to heal it, so was the corruption of Israel only brought truly to light by the effort to stem it.” On that reading the healing is not in the future. It is what the Lord had already been doing, “partly by the preaching of repentance and the reproofs of the prophets, and partly by chastisements designed to promote reformation.” Each attempt showed how deep the trouble went.

      Healing has come up in each of the last two chapters. Ephraim took his sickness to the Assyrian, “yet could he not heal you” ([[Hos. 5:13]]), and the people said of the Lord, “he will heal us” ([[Hos. 6:1]]). Here the Lord says that He was willing, and names what He found when He tried: falsehood, and theft inside the house and outside it. In a modern rendering, “the thief breaks in, and the bandits raid outside.”
    sources: [bdb, nrsvue, niv, keil-hosea, lds-scriptures]

  - ref: 4
    phrase: as an oven heated by the baker
    kind: symbol
    title: The oven that needs no stirring
    body: |
      The oven is a picture of heat that holds without tending, and by verse 7 the heat is a plot that ends in the death of kings. The King James wording of verse 4 is hard to follow. “Raising” is not usually taken of the dough. The Hebrew word is read as “stirring up (a fire),” though the text here is “dubious,” and a modern translation has an oven “whose baker does not need to stir the fire from the kneading of the dough until it is leavened.” The scene is “a furnace which a baker heats in the evening, and leaves burning all night while the dough is leavening,” to flare up in the morning when the bread is ready to go in.

      The figure comes three times, and it moves. In verse 4 the people are the oven. In verse 6 their heart is the oven “whiles they lie in wait,” which is the language of ambush, and “in the morning it burneth as a flaming fire.” Verse 7 sets the figure down and states the fact: “They are all hot as an oven, and have devoured their judges; all their kings are fallen.” Modern translations bring the plot forward in verse 6. Where the King James has “their baker sleepeth all the night,” they have “all night their anger smolders,” or “they approach him with intrigue. Their passion smolders all night.”

      The baker has sometimes been identified with one or another of the men who seized the throne in [[2 Kgs. 15]]. That is not secure: “all their kings” reaches past any single conspiracy, and the text names no one.

      “Adulterers” in verse 4 is most likely the book’s figure for a people unfaithful to the Lord, “spiritual adultery, apostasy from the Lord,” though the worship of Baal also “promoted licentiousness” (see the note on [[Hos. 4:14]]).
    sources: [bdb, nrsvue, niv, keil-hosea, lds-scriptures]

  - ref: 5
    phrase: In the day of our king
    kind: words
    title: The day of our king
    body: |
      “The day of our king” is some occasion of the king’s own, and the verse shows his princes sick with wine at it and the king in the company of scorners. The text does not say what the day was; one translation supplies “the day of the festival of our king.” Hosea does not name the king.

      “Bottles of wine” is not what the Hebrew says. The word is “heat,” and the phrase means “fever from wine, wine-fever.” The King James has the princes making the king sick. Modern translations have the officials themselves made ill: they “became sick with the heat of wine.”

      The last clause, “he stretched out his hand with scorners,” is “difficult.” The usual sense, that the king “maketh common cause with” mockers, has been judged hardly possible and the text “probably corrupt”; a modern translation keeps that sense all the same: “he joins hands with the mockers.” In that translation’s next verse they “approach him with intrigue.”

      Isaiah’s woe on the north is on “the drunkards of Ephraim” ([[Isa. 28:1]]).
    sources: [bdb, niv, nrsvue, lds-scriptures]

  - ref: 7
    phrase: all their kings are fallen
    kind: history
    title: Four kings killed by their successors
    body: |
      Kings tells what “all their kings are fallen” looked like: of the six kings who followed Jeroboam Ⅱ, four were murdered by their successors. Zachariah, Jeroboam’s son, had reigned six months when Shallum “smote him before the people, and slew him, and reigned in his stead” ([[2 Kgs. 15:10]]). Shallum lasted “a full month” ([[2 Kgs. 15:13]]) before Menahem killed him. Menahem died in his bed, but his son Pekahiah reigned only two years and was killed in the palace by Pekah, one of his own captains ([[2 Kgs. 15:25]]). Pekah fell in turn to “a conspiracy” led by Hoshea ([[2 Kgs. 15:30]]). Hoshea was the last king; in his ninth year “the king of Assyria took Samaria” ([[2 Kgs. 17:6]]). (The last king’s name is the prophet’s own, “Hosea, or Hoshea”; they are different men.)

      Hosea names none of these kings, and the chapter has no date, so it cannot be said how many of the murders lay behind him when he spoke. If he “probably died before the accession of Pekah,” as the Bible Dictionary judges, the last two came after his time. A modern translation’s cross-references set all four beside this verse.

      “Judges” here means rulers. Modern translations have “they devour their rulers,” and the next line is about kings.

      The weight of the verse is in its last clause. Through one overthrow after another, “there is none among them that calleth unto me.” The Lord’s own judgment on these reigns comes in the next chapter, “They have set up kings, but not by me” ([[Hos. 8:4]]), and again in [[Hos. 13:10–11]].
    sources: [lds-scriptures, bd-hosea, esv, nrsvue]

  - ref: 8
    phrase: Ephraim is a cake not turned
    kind: symbol
    title: Burnt on one side, raw on the other
    body: |
      An unturned cake is a flat loaf left too long on one side, and it is ruined. The word is the one for the “cake baken on the coals” that Elijah found at his head ([[1 Kgs. 19:6]]), a “cake of hot-stones i.e. baked on them.” The figure here is “a cake not turned (i.e. burnt, ruined),” or in a modern translation “a flat loaf not turned over.”

      The first half of the verse says what made Ephraim so: “he hath mixed himself among the people.” “The people” is plural in Hebrew, and the mixing is Ephraim’s own doing: “Ephraim, among the peoples doth he mix himself.” A psalm tells of the same mixing: Israel “were mingled among the heathen, and learned their works” ([[Ps. 106:35]]).

      Two Latter-day Saint readings of the cake differ in emphasis. One looks to what Israel took in: Ephraim “had mixed with other nations, worshiped their idols, and learned their ways,” and so was only half baked. The other looks to verses 9–10 and to “the leaders of Israel entering foreign alliances rather than trusting in the Lord for protection”; on that reading Ephraim “is burning on one side but is spiritually doughy or undeveloped on the other.”

      The figure “is explained by ver. 9”: strangers have devoured his strength.
    sources: [bdb, niv, ot-manual-10, schade-hosea-family, lds-scriptures]

  - ref: 9
    phrase: gray hairs are here and there upon him
    kind: symbol
    title: Old without knowing it
    body: |
      Gray hair is a sign of age that others see before the man himself does, and that is the charge: Ephraim is failing and “knoweth it not.” Modern translations have “gray hairs are sprinkled upon him” or “His hair is sprinkled with gray.”
      The verse says “he knoweth it not” twice, with the same Hebrew verb at the end of each half. Knowing is what the book has said Israel lacks from the start of these oracles: “no truth, nor mercy, nor knowledge of God in the land” ([[Hos. 4:1]]). A modern translation’s cross-references set this verse beside “My people are destroyed for lack of knowledge” ([[Hos. 4:6]]).

      The “strangers” who have “devoured his strength” are foreigners. Hosea does not say which, or how.

      Verse 10 gathers the passage up in three words, “for all this.” With every sign in front of them, “they do not return to the Lord their God, nor seek him.”
    sources: [bdb, oshb-wlc, nrsvue, niv, lds-scriptures]

  - ref: 11
    phrase: like a silly dove without heart
    kind: symbol
    title: A dove between Egypt and Assyria
    body: |
      The dove is a picture of a kingdom with no settled direction, flying to Egypt and then to Assyria. “Silly” here means simple, and one translation has “easily deceived and senseless.” “Without heart” is “without sense” or “without understanding.” The book has already said what took the heart away: “Whoredom and wine and new wine take away the heart” ([[Hos. 4:11]]).

      The history is in Kings. “In desperation the people alternately sought aid from Assyria and Egypt, paying tribute to both, with the result that they lost their independence and national autonomy.” The last king did both. Hoshea “became his servant, and gave him presents” when Shalmaneser of Assyria came against him ([[2 Kgs. 17:3]]). Then he “sent messengers to So king of Egypt, and brought no present to the king of Assyria” ([[2 Kgs. 17:4]]), and for that he was imprisoned and Samaria was besieged. Hosea does not say which embassy he means, and the verse may describe a habit and no single event.

      The charge is not poor statecraft. Alliances “would not remedy the real cause of their trouble,” which was “moral disease and rebellion against God.”

      The two powers stand together throughout the book ([[Hos. 5:13]]; [[Hos. 8:9]]; [[Hos. 12:1]]; [[Hos. 14:3]]). The dove comes back once, and by then it is flying home: “They shall tremble as a bird out of Egypt, and as a dove out of the land of Assyria: and I will place them in their houses” ([[Hos. 11:11]]).
    sources: [bdb, niv, nrsvue, esv, ot-manual-10, oshb-wlc, lds-scriptures]

  - ref: 12
    phrase: I will spread my net upon them
    kind: symbol
    title: The fowler’s net, and what the congregation had heard
    body: |
      The Lord takes the part of the fowler: the dove on its way to Egypt or Assyria is flying under a net He calls “my net.” Ezekiel uses the same picture of Judah’s king, and there the net is plainly exile: “My net also will I spread upon him, and he shall be taken in my snare: and I will bring him to Babylon” ([[Ezek. 12:13]]).

      “As their congregation hath heard” is the hard clause. One modern translation has “I will discipline them according to the report made to their assembly” and adds the note “Meaning of Heb uncertain”; another goes a different way altogether: “When I hear them flocking together, I will catch them.”

      On the King James reading, the punishment is one the people had been told of beforehand. What they had heard, on this reading, is “the threatening already contained in the law” and repeated by the prophets: the warnings attached to the covenant in Leviticus 26 and Deuteronomy 28, where Moses said that if Israel would not hearken, “all these curses shall come upon thee, and overtake thee” ([[Deut. 28:15]]). So read, the verse announces nothing new: what the law had warned of “would now be fulfilled upon Ephraim.”

      “Chastise” is a word for discipline and correction more than for destruction, and its sense here is to “chasten.” The same verb comes back in verse 15.
    sources: [lds-scriptures, oshb-wlc, nrsvue, niv, esv, bdb, keil-hosea]

  - ref: 13
    phrase: though I have redeemed them
    kind: words
    title: “I would redeem them”
    body: |
      The line can be read as a wish rather than a memory: the Lord says He would redeem them, and that their lies stand in the way. The Church edition’s footnote gives “would have redeemed them,” and modern translations have “I would redeem them” and “I long to redeem them.” The King James past tense looks back, and the footnote on “redeemed” points to the verse where the Lord says He “redeemed thee out of the house of servants” ([[Micah 6:4]]). The other reading is about the present.

      Two modern translations’ cross-references set the verse beside verse 1: “When I would have healed Israel” and “would have redeemed them.”

      The Hebrew word for “redeem” stands in only one other verse of Hosea, in exactly the same form: “I will ransom them from the power of the grave” ([[Hos. 13:14]]), which the King James reads as a promise.

      The verse does not say what the “lies against me” were.
    sources: [lds-scriptures, oshb-wlc, nrsvue, niv, esv]

  - ref: 14
    phrase: they assemble themselves for corn and wine
    kind: words
    title: Wailing on their beds
    body: |
      The verse describes loud distress that is not prayer: they howl, but “they have not cried unto me with their heart.” The Church edition’s footnote sets beside it Mormon’s words about the mourning of his own people: “their sorrowing was not unto repentance, because of the goodness of God; but it was rather the sorrowing of the damned” ([[Morm. 2:13]]).

      What they want is in the next clause. “Corn and wine” are grain and new wine, the gifts of which chapter 2 said, “she did not know that I gave her corn, and wine, and oil” ([[Hos. 2:8]]).

      “Assemble themselves” has an old rival. Some Hebrew manuscripts and the Septuagint, the ancient Greek translation, have a verb that differs from it by one letter and means to cut oneself, and the usual text has been judged “probably error.” Modern translations follow that reading: “they gash themselves for grain and wine,” or “They slash themselves, appealing to their gods for grain and new wine.” This was “religious (heathen) practice.” The prophets of Baal on Carmel “cut themselves after their manner with knives and lancets” ([[1 Kgs. 18:28]]), and the law forbade it to Israel ([[Deut. 14:1]]).

      On that reading the verse is sharper. In want, they turn to heathen rites for the harvest. On the King James reading, they crowd together for food and drink. In either case the cry is for grain and not for the Lord, and the verse ends, “they rebel against me.”
    sources: [lds-scriptures, bdb, niv, nrsvue]

  - ref: 15
    phrase: bound and strengthened their arms
    kind: words
    title: One word for training and for chastening
    body: |
      “Bound” is “trained,” as the Church edition’s footnote says, and the Hebrew verb is the one translated “chastise” in verse 12. One verb covers both: in verse 15 it is used “of training arms,” and in verse 12 it means to “chasten.” Hosea uses the same word for what the Lord did for Israel and for what He is about to do to it.

      A modern translation makes the Lord’s part emphatic: “It was I who trained and strengthened their arms, yet they plot evil against me.” The strength Israel has is strength He gave, and it is turned against Him.

      Chapter 11 comes back to the arms, with a father and a small child: “I taught Ephraim also to go, taking them by their arms; but they knew not that I healed them” ([[Hos. 11:3]]).
    sources: [lds-scriptures, bdb, nrsvue, esv]

  - ref: 16
    phrase: they are like a deceitful bow
    kind: symbol
    title: A bow that cannot be trusted
    body: |
      A deceitful bow is one that fails the archer who relies on it, and it is the chapter’s last picture of Ephraim. The lexicon has “treacherous bow,” one “failing him who trusts to it”; the translations have “a defective bow,” “a faulty bow,” and “a treacherous bow.” It has been explained in two ways. It may be a bow that “flies back to its curved position while the archer is stringing it or breaks while he has it drawn,” so that “the archer can be wounded.” Or it is one whose string “has lost its elasticity, so that the arrows do not hit the mark.”

      The second explanation has been joined to the clause before it. “They return, but not to the most High” is in Hebrew very short, closer to “they return (but) not upwards (i.e. not God-wards).” One translation keeps this, “but not upward.” The same word stands in [[Hos. 11:7]]. There is plenty of turning in the chapter, to Egypt and to Assyria, and none of it goes up.

      Psalm 78 has the same phrase for Israel’s unfaithfulness, “they were turned aside like a deceitful bow” ([[Ps. 78:57]]), in a psalm that begins its charge with this tribe: “The children of Ephraim, being armed, and carrying bows, turned back in the day of battle” ([[Ps. 78:9]]).

      The verse ends in Egypt. The princes will fall by the sword, and “this shall be their derision in the land of Egypt.” On one reading the ally will be the one to mock: “because they put their trust in Egypt, the derision of Egypt will come upon them when they are overthrown.” Isaiah warned Judah of the same end to the same policy: “the strength of Pharaoh be your shame” ([[Isa. 30:3]]).
    sources: [bdb, ot-manual-10, keil-hosea, nrsvue, niv, esv, lds-scriptures]

christ: |
  Twice in this chapter the Lord says what He wanted to do for Israel: “When I would have healed Israel” (verse 1), and, in the reading the Church edition’s footnote gives for verse 13, “would have redeemed them.” The LORD who speaks is Jehovah, the premortal Jesus Christ. In both verses what stands in the way is Israel’s own: its iniquity in the first, its lies in the second.

  Modern translations’ cross-references set beside verse 13 what He said over Jerusalem in His mortal ministry: “how often would I have gathered thy children together, even as a hen gathereth her chickens under her wings, and ye would not!” ([[Matt. 23:37]]).

explore: |
  - **The kings behind verses 3–7.** [[2 Kgs. 15:8–31]] and [[2 Kgs. 17:1–6]].
  - **The Lord’s judgment on those kings.** [[Hos. 8:4]] and [[Hos. 13:9–11]].
  - **Egypt and Assyria through the book.** [[Hos. 5:13]]; [[Hos. 8:9]]; [[Hos. 12:1]]; the prayer of [[Hos. 14:3]]; and the dove’s return in [[Hos. 11:10–11]].
  - **The same warning in Judah.** [[Isa. 30:1–5]].
  - **Sorrow that is not repentance.** [[Morm. 2:10–15]].
  - **The deceitful bow.** [[Ps. 78:9–11]] and [[Ps. 78:56–58]].

