chapter: 1
title: The Prophet’s Household as a Sign
tagline: The Lord’s first word through Hosea is a command to marry, and the three children of the marriage are named for what is coming on the northern kingdom. Then, with one word, “Yet,” the names begin to turn.
when: 'The eighth century B.C., in the northern kingdom’s last decades. The heading dates Hosea by five kings (verse 1), and the first child is named while Jehu’s descendants still rule Israel, the line to which Jeroboam the son of Joash belonged.'

setting: |
  Hosea belonged to the northern kingdom of Israel and is “the only prophet of the northern kingdom who has left written prophecies.” He began “during the latter part of the reign of Jeroboam Ⅱ,” who was “the most successful in war” of Israel’s kings and under whom both kingdoms were prosperous. Estimates of how long Hosea’s ministry lasted differ. One estimate has him die “before the accession of Pekah, 736 B.C.”; another dates his ministry “from about 755 B.C. to 725 B.C.”; and the heading itself reaches to Hezekiah. On any reckoning he spoke to the last generations of a kingdom that ended when the king of Assyria “took Samaria, and carried Israel away” ([[2 Kgs. 17:6]]). Isaiah prophesied in Judah under the same four kings ([[Isa. 1:1]]).

  This chapter opens the first part of the book, chapters 1–3, which concern the prophet’s marriage and children; chapters 4–14 are his warnings and promises to Israel. Here the story is told about Hosea, in the third person; in chapter 3 he tells it himself.

  Paul quotes verse 10 together with [[Hosea 2:23]] ([[Rom. 9:25–26]]).

thread: |
  The chapter is built on four commands. Take a wife; call his name Jezreel; call her name Lo-ruhamah; call his name Lo-ammi. Each carries its reason in a clause that begins with “for,” and none of the reasons is about the family: “for the land hath committed great whoredom,” “for … I will avenge the blood of Jezreel,” “for I will no more have mercy upon the house of Israel,” “for ye are not my people.” The household is the sign, and the nation is the subject.

  The names have been read as three stages: the scattering of Israel, the withdrawal of the Lord’s mercy, and Israel’s separation from Him. The first name concerns a king’s house and an army, the second the Lord’s compassion, the third the covenant itself. With the third the Lord stops speaking about Israel and speaks to it: “ye are not my people.”

  Then verse 10 begins with “Yet,” and the names are answered. Those called Not My People will be called “the sons of the living God,” and the day of Jezreel will be “great.” The daughter’s name waits for the next chapter ([[Hosea 2:1]]). Here, as throughout the book, Hosea “interweaves the promise of destruction or a curse with the promise of future restoration to favor.”

sections:
  - range: 1
    heading: The heading
    plain: |
      This is the word of the Lord that came to Hosea the son of Beeri in the days of four kings of Judah, Uzziah, Jotham, Ahaz, and Hezekiah, and of Jeroboam the son of Joash, king of Israel.
  - range: 2-3
    heading: The command to marry
    plain: |
      When the Lord first spoke through Hosea, He said to him: Go, take a wife of whoredoms and children of whoredoms, because the land commits great whoredom in turning away from the Lord. So he went and took Gomer the daughter of Diblaim, and she conceived and bore him a son.
  - range: 4-5
    heading: Jezreel
    plain: |
      The Lord said: Name him Jezreel. In a little while I will punish the house of Jehu for the blood of Jezreel, and I will bring the kingdom of the house of Israel to an end. On that day I will break Israel’s bow in the valley of Jezreel.
  - range: 6-7
    heading: Lo-ruhamah
    plain: |
      She conceived again and bore a daughter. God said: Name her Lo-ruhamah, for I will no longer have mercy on the house of Israel; I will utterly take them away. But I will have mercy on the house of Judah. I will save them by the Lord their God, and not by bow, sword, battle, horses, or horsemen.
  - range: 8-9
    heading: Lo-ammi
    plain: |
      When she had weaned Lo-ruhamah she conceived and bore a son. God said: Name him Lo-ammi, for you are not my people, and I will not be your God.
  - range: 10-11
    heading: “Yet”
    plain: |
      Yet the children of Israel will be as many as the sand of the sea, beyond measuring or counting. In the very place where they were told, “You are not my people,” they will be told, “You are the sons of the living God.” The children of Judah and the children of Israel will be gathered together and will appoint one head for themselves, and they will come up out of the land; for the day of Jezreel will be great.

notes:
  - ref: 1
    phrase: in the days of Jeroboam the son of Joash, king of Israel
    kind: history
    title: One king of Israel named, six left unnamed
    body: |
      The heading names four kings of Judah and only one king of Israel, although Hosea was a prophet of the north and the list of Judah’s kings runs on long after that one was dead (his line had ended before Uzziah’s reign was over, [[2 Kgs. 15:13]]). Jeroboam the son of Joash is Jeroboam Ⅱ, “of the dynasty of Jehu, the ablest of the kings of Israel.” He is not Jeroboam the son of Nebat, who had divided the kingdom about two centuries earlier and “set up image worship in Dan and Bethel.”

      After Jeroboam Ⅱ the book of Kings counts six more kings of Israel before Samaria fell: Zachariah, Shallum, Menahem, Pekahiah, Pekah, and Hoshea ([[2 Kgs. 15:8–30]]; [[2 Kgs. 17:1–6]]). Four of the six were killed by the men who took their thrones. None is named here. The last of them, Hoshea, bears the prophet’s own name in another spelling (the name is given as “Hosea, or Hoshea”); they are different men.

      The text does not explain why the list is lopsided. One inference drawn from the kings of Judah standing first is that the book “was meant to be read and reread by diverse audiences (including Judah).”
    sources: [lds-scriptures, bd-jeroboam, bd-hosea, jackson-hosea-marriage, schade-hosea-family]
  - ref: 2
    phrase: The beginning of the word of the LORD by Hosea
    kind: words
    title: The first thing the Lord said through Hosea
    body: |
      This clause says that what follows was the Lord’s first word through Hosea, so that his ministry opens with the command to marry. In Hebrew the second word is a verb, *dibber*, “spoke,” where the King James has the noun “word”: literally, the beginning of the Lord’s speaking by Hosea. One newer translation makes it a clause of time, “When the Lord first spoke through Hosea.”

      Nothing else is told of a call. “We do not know the details of how or where Hosea received this word,” and the household is the only account of his beginning that the book gives. That is part of why one reading takes the marriage itself as a figure of the prophet’s call (see the note on “a wife of whoredoms”).
    sources: [oshb-wlc, nrsvue, schade-hosea-family]
  - ref: 2
    phrase: a wife of whoredoms and children of whoredoms
    kind: history
    title: Was the marriage literal?
    body: |
      Whether the Lord literally commanded His prophet to marry an immoral woman has not been settled, and Latter-day Saint scholars have answered it differently. Scholars “have long debated” the matter, and “Either way, the central message of the book of Hosea is not the marriage itself but what it symbolizes: the covenant relationship between God and Israel.”

      Three readings cover most of the ground.

      - **An actual marriage to such a woman.** This takes the account as it stands. The objection raised is that it “would be imputing to God a command inconsistent with His holy character.” The answer given is that setting aside an episode because it disturbs us “opens a Pandora’s box of issues surrounding the historicity of the scriptures.”
      - **An actual marriage to a woman who became unfaithful afterward.** Here “wife of whoredoms” describes what she became: Hosea wrote looking back, or the phrase “anticipates her later behavior.” The difficulty is that the phrase stands in the command itself. One Latter-day Saint treatment of the three readings inclines against the first and finds merit in this one and the next.
      - **A figure of the prophet’s call.** Here there was no such marriage. The command “represents the prophet’s call to the ministry—a ministry to an apostate and covenant-breaking people,” and the children are the judgments he was sent to announce.

      Two details of the wording bear on the question without settling it. “Whoredoms” (*zenunim*) is an abstract plural, “fornication”; it names an attribute and “does not represent a profession.” And the command gives its own reason, which is about the land and not the woman. In Hebrew that clause looks forward (the ancient Greek translation has “the land will surely go a-whoring”), and on one reading the wife and children “represent the kingdom of Israel and its inhabitants.” “Children of whoredoms” returns in [[Hosea 2:4]], where the mother is the nation.

      The readings agree on what the marriage means. Hosea and his wife stand for the Lord and unfaithful Israel, as Jeremiah’s yoke stood for bondage and Ezekiel’s journey from home for exile: “Whether we assume that an actual marriage of Hosea was involved or not is irrelevant to the purposes of the book; either way the greater message comes through.”
    sources: [scripture-helps-hosea, ot-manual-10, jackson-hosea-marriage, schade-hosea-family, parry-symbolic-action, bdb, lxx-rahlfs, lds-scriptures]
  - ref: 3
    phrase: Gomer the daughter of Diblaim
    kind: history
    title: What the text says of Gomer
    body: |
      Hosea’s wife is named only in this verse, and the book tells nothing of her beyond her father’s name and the births of three children. The woman Hosea is told to love in [[Hosea 3:1]] is not named.

      Because the children’s names are messages, a message has been looked for in hers. One proposal is that *Gomer* “may have originally meant ‘perfection’ or ‘complete’” and is turned here to mean finished, which would suit a kingdom near its end. The opposite judgment has also been given: “The name does not seem to be symbolic; there is no wordplay on it as there is on the names of the children.” The Lord explains each child’s name in this chapter and says nothing of hers.
    sources: [bdb, schade-hosea-family, lds-scriptures]
  - ref: 4
    phrase: Call his name Jezreel
    kind: symbol
    title: A son named for a place
    body: |
      To Hosea’s neighbours the first child’s name was a place with a history. Jezreel was the “Plain of Esdraelon” and also “a city on a hill rising out of the plain,” which “Ahab made … his capital.” Naboth’s vineyard lay there, “hard by the palace of Ahab” ([[1 Kgs. 21:1]]), and there Jehu slew “all that remained of the house of Ahab in Jezreel” ([[2 Kgs. 10:11]]).

      Hosea is not the only prophet whose children carried a message. Isaiah, in Judah in the same years, says of his own, “I and the children whom the LORD hath given me are for signs and for wonders in Israel” ([[Isa. 8:18]]).

      The name itself is not harsh. It means “God soweth,” and in this verse the Lord explains it by the place alone. How the name is played on comes at verse 11 (see the note on “great shall be the day of Jezreel”).
    sources: [bd-jezreel, lds-scriptures, bdb, parry-symbolic-action]
  - ref: 4
    phrase: I will avenge the blood of Jezreel upon the house of Jehu
    kind: history
    title: Why Jehu’s house answers for Jezreel
    body: |
      The blood of Jezreel is the blood Jehu shed there in taking the throne, and the difficulty is that he shed it at the Lord’s word. A prophet anointed him to “smite the house of Ahab” ([[2 Kgs. 9:7]]). He killed Ahab’s son the king, then Jezebel, then Ahab’s seventy sons and the rest of the house (2 Kings 9–10). The Lord commended him for it and promised, “thy children of the fourth generation shall sit on the throne of Israel” ([[2 Kgs. 10:30]]).

      Kings itself supplies the other half. The verses on either side of that promise say that Jehu kept the golden calves of Bethel and Dan ([[2 Kgs. 10:29]]) and “took no heed to walk in the law of the LORD God of Israel with all his heart” ([[2 Kgs. 10:31]]). One explanation is simply that the blood would “be avenged upon his dynasty, whose kings were wicked like their ancestor.” An older commentary goes further and separates the act from the man: the destruction of Ahab’s house was commanded, but a commanded act becomes a crime when the one who does it makes the command “the mere cloak for the lusts of his own evil heart.” Both are explanations; Hosea gives none.

      The Hebrew verb is also less pointed than “avenge.” It is the word for the Lord’s visiting a sin upon someone, the verb of “visiting the iniquity of the fathers upon the children” ([[Ex. 20:5]]).

      Jeroboam Ⅱ, on the throne when the book opens, was of Jehu’s dynasty, and the end came quickly after him. His son Zachariah reigned six months before Shallum “smote him before the people, and slew him” ([[2 Kgs. 15:10]]), and Kings adds: “Thy sons shall sit on the throne of Israel unto the fourth generation. And so it came to pass” ([[2 Kgs. 15:12]]).
    sources: [lds-scriptures, keil-hosea, jackson-hosea-marriage, bdb, bd-jeroboam]
  - ref: 5
    phrase: I will break the bow of Israel in the valley of Jezreel
    kind: history
    title: Three threats, and how they came
    body: |
      Verses 4 and 5 threaten the end of Jehu’s house, the end of the kingdom, and the breaking of Israel’s bow, and all three came within a few decades. Jehu’s line ended with Zachariah ([[2 Kgs. 15:8–12]]). The bow, “representing Israel’s military might, was broken in Jezreel when the Assyrians seized this valley.” Kings does not name the valley; the campaign to which the Church’s footnote on the verse points is Tiglath-pileser’s, in which he took “Gilead, and Galilee, all the land of Naphtali” ([[2 Kgs. 15:29]]). The kingdom ceased when Samaria was taken and Israel carried away ([[2 Kgs. 17:5–6]]).
    sources: [lds-scriptures, sc-hosea-family, schade-hosea-family]
  - ref: 6
    phrase: Lo-ruhamah
    kind: words
    title: A daughter named Not Pitied
    body: |
      *Lo-ruhamah* is a sentence used as a name: “not,” and a passive form of the verb “have compassion,” so that it says she is not shown compassion. The verb is used “usually of God” toward His people, which is what makes the name hard to hear. It takes the word for what the Lord does for Israel and puts “not” in front of it. One modern translation simply prints the name in English: “No Mercy.”

      What the Lord says He will do is less certain than the King James suggests. Where it has “I will utterly take them away,” newer translations read the same Hebrew as “or forgive them” and “to forgive them at all,” and the ancient Greek translators read “but will surely set myself in array against them.” The sense of the name holds in each: the mercy the Lord had extended through the “hundreds of years since the Exodus” is withdrawn.

      It is “withdrawn for a time.” The name is taken back in [[Hosea 2:1]] and [[Hosea 2:23]].

      [“I Will Betroth Thee unto Me”](/hosea/themes/betroth-thee/) follows the mercy this name withholds through the book, to the betrothal and the last prayer.
    sources: [bdb, esv, nrsvue, lxx-rahlfs, schade-hosea-family, scripture-helps-hosea, lds-scriptures]
  - ref: 7
    phrase: will save them by the LORD their God
    kind: history
    title: Judah spared, and not by arms
    body: |
      The aside about Judah promises a rescue in which no weapon has a part, and the Church’s footnotes on the verse find it in Hezekiah’s day, when an Assyrian army stood before Jerusalem. The Lord said, “I will defend this city, to save it, for mine own sake” ([[2 Kgs. 19:34]]), and that night “the angel of the LORD went out, and smote in the camp of the Assyrians an hundred fourscore and five thousand” ([[2 Kgs. 19:35]]). Hezekiah is the last king named in this book’s heading.
    sources: [lds-scriptures]
  - ref: 9
    phrase: for ye are not my people, and I will not be your God
    kind: words
    title: The covenant sentence reversed
    body: |
      The third name takes back the sentence by which the Lord first claimed Israel. He had said, “I will take you to me for a people, and I will be to you a God” ([[Ex. 6:7]]), and again, “will be your God, and ye shall be my people” ([[Lev. 26:12]]). The two halves belong together wherever the covenant is stated, and here both are negated: “A more explicit and clear reversal of covenant language could not be made.”

      The Hebrew is starker than the English. Its last clause has no word for “God.” Word for word it runs: and I, not *ehyeh* to you, where *ehyeh* is “I am” or “I will be,” and translators’ notes give the clause as “I am not yours” and as “your I am.” The possible renderings “all mean the same thing and carry the same covenant allusion.”

      The person changes as well. The first two names were explained about Israel (“them”); this one is explained to Israel (“ye”).

      The sentence is not the Lord’s last word to Israel. It has been described as “more of a temporary separation” than a divorce, since “the Lord clearly wants Israel back.” The next word in the chapter is “Yet.”

      [“I Will Betroth Thee unto Me”](/hosea/themes/betroth-thee/) follows the two names to their reversal in chapter 2.
    sources: [lds-scriptures, oshb-wlc, esv, niv, muhlestein-everlasting-covenant, jackson-hosea-marriage, schade-hosea-family]
  - ref: 10
    phrase: Yet the number of the children of Israel shall be as the sand of the sea
    kind: scripture
    title: Abraham’s promise to a people just disowned
    body: |
      The promise that answers “not my people” is the oldest one Israel had: the sand of the sea is the language of the covenant with Abraham. The Lord swore to multiply Abraham’s seed “as the sand which is upon the sea shore” ([[Gen. 22:17]]), and Jacob held Him to it in words Hosea nearly repeats: “as the sand of the sea, which cannot be numbered for multitude” ([[Gen. 32:12]]). A people told that they are no longer the Lord’s are told in the next breath that the promise to their fathers stands. The covenant of Abraham “lies at the heart of the promised restoration.”

      The Hebrew Bible divides the chapters differently. Its chapter 1 ends with Lo-ammi, and these two verses open chapter 2, so that there the first chapter closes on its darkest word. The King James division keeps the three names and their answer together.
    sources: [lds-scriptures, schade-hosea-family, muhlestein-everlasting-covenant, niv]
  - ref: 10
    phrase: Ye are the sons of the living God
    kind: scripture
    title: From not-my-people to sons
    body: |
      In Hosea the people renamed are the people who were disowned: the new name is spoken “in the place where it was said unto them, Ye are not my people.” The promise is first to the northern tribes, cast off and brought back. “Sons” is read as the language of covenant. All are children of God, but “we become so in a different way as we make and keep the Abrahamic covenant,” and those who covenant with the Lord are “called the children of Christ, his sons, and his daughters” ([[Mosiah 5:7]]).

      The New Testament widens the promise. Paul quotes this verse with [[Hosea 2:23]] for those whom God has called “not of the Jews only, but also of the Gentiles” ([[Rom. 9:24–26]]). Hosea’s words were spoken to disowned Israel; Paul applies them to all whom God calls, Gentiles with Jews.
    sources: [lds-scriptures, scripture-helps-hosea, muhlestein-everlasting-covenant, schade-hosea-family]
  - ref: 11
    phrase: appoint themselves one head
    kind: christ
    title: One head over Judah and Israel
    body: |
      The “one head” has been read as the Messiah, under whom the two kingdoms divided since Rehoboam are gathered into one. Two chapters on, Israel will “seek the LORD their God, and David their king” ([[Hosea 3:5]]), and Ezekiel says of the same reunion, “one king shall be king to them all: and they shall be no more two nations” ([[Ezek. 37:22]]). Ezekiel’s theme page [One Shepherd](/ezekiel/themes/one-shepherd/) follows that figure.

      The people also “come up out of the land.” An older commentary hears the Exodus both in that phrase and in the appointing of a head: the appointing points back to Moses ([[Num. 14:4]]), and the going up is borrowed from [[Ex. 1:10]]. On that reading the gathering is pictured as a second coming out of Egypt, which is the picture chapter 2 draws ([[Hosea 2:14–15]]).

      The reading that sees the Messiah in the one head places the reunion in the latter days, in “the day of gathering,” when “the gathering will include a fulfillment in the latter days of the promises God made to Abraham.” No such reunion has been shown to have taken place in the Persian period that followed the exile.
    sources: [schade-hosea-family, keil-hosea, lds-scriptures]
  - ref: 11
    phrase: great shall be the day of Jezreel
    kind: words
    title: Jezreel, said a second time
    body: |
      The chapter’s last word is its first child’s name, and it no longer sounds like a threat. Jezreel means “God soweth,” and the name is played both ways: “God shall scatter” in verse 4, and here “God shall sow,” with the stress on “the Lord’s preservation of Israel and the preparations necessary to disperse, grow, and gather her.”

      The name that opened the judgments closes the promise, and the next chapter completes it: “I will sow her unto me in the earth” ([[Hosea 2:23]]).
    sources: [bdb, schade-hosea-family, lds-scriptures]

christ: |
  In this household the prophet stands in the Lord’s place. His name, *Hoshea*, means “salvation,” and it “is derived from the same root as the names of Joshua and Jesus.”

  Both promises at the end of the chapter are read of Christ. The “sons of the living God” are those who covenant with the Lord (see the note on verse 10), for whom “Jesus Christ becomes the Father of their new lives.” And the one head under whom Judah and Israel are gathered is the shepherd who “gathereth his children from the four quarters of the earth” ([[1 Ne. 22:25]]), “the God of Israel, even Jehovah.”

explore: |
  - **The names taken back.** [[Hosea 2:1]]; [[Hosea 2:21–23]].
  - **Jehu at Jezreel.** [[2 Kgs. 9–10]], and the end of his house in [[2 Kgs. 15:8–12]].
  - **The marriage figure in the later prophets.** [[Isa. 54:5–8]]; [[Jer. 3:1–14]]; [[Ezek. 16]]. Hosea “deeply influenced succeeding writers.”
  - **One nation under one king.** [[Ezek. 37:15–28]]; [[Hosea 3:4–5]].
  - **Paul’s use of the reversed names.** [[Rom. 9:24–26]].
  - **A fuller study.** “The Imagery of Hosea’s Family and the Restoration of Israel” reads chapters 1–2 together as a prophecy of the scattering and gathering of Israel.

parallels:
  - ref: Rom. 9:25–26
    note: Paul quotes verse 10 with Hosea 2:23 for those God has called from among Jews and Gentiles.
  - ref: Ezek. 37:22
    note: Ezekiel promises the same reunion of the two kingdoms under one king.

