chapter: 14
title: Take with You Words
tagline: The prophet calls Israel back one last time and gives them the prayer to bring. The Lord answers that He will heal them and love them freely, and the book closes by asking its reader to be wise.
when: 'Undated; the northern kingdom’s last decades, in the 700s B.C.'

setting: |
  This is the end of the book. The prophet “concludes his addresses with a call to thorough conversion to the Lord, and the promise that the Lord will bestow His grace once more upon those who turn to Him.” The book has promised restoration before ([[Hos. 2:14–23]]; [[Hos. 11:8–11]]). Here Israel is given the words of its own part.

  The chapter carries no date. Hosea prophesied when Israel was close to being conquered by Assyria, and the chapter before this one ends with that conquest foretold: “Samaria shall become desolate” ([[Hos. 13:16]]). (Hebrew Bibles number verses 1–9 of this chapter as 2–10, and some commentaries follow them.)

  The heading in the Church’s edition places the fulfilment late: “In the last days, Ephraim will repent and return unto the Lord.” “Ephraim” is the book’s name for the northern kingdom (see the note on [[Hos. 4:17]]). An earlier promise used the same verb and the same horizon: the children of Israel will return “in the latter days” ([[Hos. 3:5]]). On one Latter-day Saint reading of the book’s scattering and return, the return has begun: “To some extent, the tribe of Joseph is being gathered again to Jehovah’s covenant in The Church of Jesus Christ of Latter-day Saints.”

thread: |
  The chapter is a conversation, and the prophet supplies Israel’s half of it. He calls the people back (verse 1), tells them to bring words, and then dictates the words (verses 2–3). The Lord answers (verses 4–8). A last verse turns from Israel to whoever is reading (verse 9).

  Israel asks that its iniquity be taken away and gives up, by name, the three things it trusted instead of the Lord. The Lord promises to heal the turning away and to love freely. Then the answer becomes a garden: dew, a lily, roots, an olive tree, grain, a vine, and at last an evergreen tree that is the Lord Himself.

  Two verbs frame it. “Return” runs from the first verse to the seventh (see the note on verse 1). “Stumble” stands in the first verse and the last: Israel has stumbled by its iniquity, and the book ends by saying where people stumble.

sections:
  - range: 1-3
    heading: The call, and the words to bring
    plain: |
      Israel, come back to the LORD your God, for your iniquity has made you stumble. Bring words with you and turn to the LORD. Say to Him: Take away all iniquity and accept what is good, and we will offer our lips as our young bulls. Assyria will not save us; we will not ride on horses; we will never again call what our own hands have made our gods; for in You the fatherless finds mercy.
  - range: 4-7
    heading: The Lord’s answer
    plain: |
      I will heal their turning away; I will love them of My own free will, for My anger has turned from them. I will be like the dew to Israel. He will blossom like the lily and strike root like Lebanon. His shoots will spread; he will have the beauty of the olive tree and the fragrance of Lebanon. Those who live in his shade will come back. They will flourish like grain and blossom like the vine, and their fame will be like the wine of Lebanon.
  - range: 8-8
    heading: No more idols
    plain: |
      Ephraim will say, What have I to do with idols any more? I have answered him, and I watch over him. I am like an evergreen tree; your fruit comes from Me.
  - range: 9-9
    heading: A word to the reader
    plain: |
      Whoever is wise will understand these things, and whoever is discerning will know them. The ways of the LORD are straight. The righteous walk in them, and transgressors stumble in them.

notes:
  - ref: 1
    phrase: return unto the LORD thy God
    kind: words
    title: The book’s verb, one last time
    body: |
      “Return” is the verb the book of Hosea turns on, and this chapter uses it four times in nine verses. The Hebrew verb stands 22 times in the book. Israel has refused it: “they refused to return” ([[Hos. 11:5]]). The people have said it of themselves, “Come, and let us return unto the LORD” ([[Hos. 6:1]]; the Lord’s answer to them is in [[Hos. 6:4]]).

      Here the prophet says it twice, in verses 1 and 2. In verse 4 the Lord says His anger “is turned away,” and the verb is the same one. In verse 7 those who live in Israel’s shade “shall return.” Even “backsliding” in verse 4 is a noun made from this verb, a “turning back.” One word covers the fault and its remedy: Israel turned away, Israel is told to turn back, and the Lord’s anger turns from them.

      “Fallen” is more exactly stumbled: “you have stumbled because of your iniquity.” The same Hebrew verb is the last verb in the book (see the note on verse 9).
    sources: [oshb-wlc, bdb, nrsvue]

  - ref: 2
    phrase: Take with you words
    kind: symbol
    title: Words in place of an offering
    body: |
      Israel is told to come before the Lord carrying words, where a worshipper would have brought an animal. The law said of the feasts, “none shall appear before me empty” ([[Ex. 23:15]]), and this command has been read against that rule: “do not appear before the Lord empty,” but for this “ye do not require outward sacrifices, but simply words,” the words of confession.

      Then the prophet supplies the words, to the end of verse 3. They open with a request in two halves. “Take away all iniquity” is plain. “Receive us graciously” is, in Hebrew, “take good,” which a modern translation gives as “accept that which is good.” On one reading the good thing is the prayer itself, “the only good thing that we are able to bring, viz., the sacrifices of our lips.” The Hebrew uses one verb for both sides: Israel is to “take” words, and asks the Lord to “take” what is good.
    sources: [keil-hosea, nrsvue, oshb-wlc]

  - ref: 2
    phrase: the calves of our lips
    kind: words
    title: Young bulls, or fruit
    body: |
      The “calves of our lips” are prayers offered where young bulls would have been, and the ancient Greek translation reads the word as “fruit.” The Hebrew word is *parim*, young bulls, and the line is, woodenly, “we will pay (as with) bullocks, our lips.” Sincere prayer is offered “as precious as the best offerings in the Mosaic law, which were young oxen or bullocks.” “Render” is to pay, and one modern translation keeps both ideas: “we will pay with bulls” what it calls “the vows of our lips.”

      That Greek translation, the Septuagint, has “we will render in return the fruit of our lips.” The difference is small in Hebrew. The received Hebrew text “understands the Hebrew consonants prym as ‘calves,’” and the Greek translators took those consonants as fruit. The Greek reading has been preferred to the Hebrew, and a modern translation prints “the fruit of our lips” with a note that the Hebrew has “bulls.”

      The New Testament alludes to the Greek wording. Hebrews asks Christians to offer “the sacrifice of praise to God continually, that is, the fruit of our lips giving thanks to his name” ([[Heb. 13:15]]). With either word the offering is speech. Scripture elsewhere names the sacrifice the Lord asks: “The sacrifices of God are a broken spirit” ([[Ps. 51:17]]), and in this dispensation the Lord asks a sacrifice “even that of a broken heart and a contrite spirit” ([[D&C 59:8]]).
    sources: [oshb-wlc, bdb, ot-manual-10, esv, lxx-rahlfs, bowen-fruit-of-loins, nrsvue, keil-hosea]

  - ref: 3
    phrase: Asshur shall not save us
    kind: history
    title: Three helps given up by name
    body: |
      The prayer gives up the three things Israel had trusted in place of the Lord: a foreign power, its own arms, and its idols. Asshur is Assyria. That was where the kingdom had gone with its wound: “then went Ephraim to the Assyrian” ([[Hos. 5:13]]; see the note there). It had hurried between two powers, “they call to Egypt, they go to Assyria” ([[Hos. 7:11]]).

      The horses are war horses; a modern translation has “we will not mount warhorses.” Two other verses speak of trusting in horses. Isaiah has it of Egypt’s: “Woe to them that go down to Egypt for help; and stay on horses” ([[Isa. 31:1]]). And at the book’s beginning the Lord said He would save Judah, but not “by bow, nor by sword, nor by battle, by horses, nor by horsemen” ([[Hos. 1:7]]).

      “The work of our hands” is the idols. Of Samaria’s calf the book said, “the workman made it; therefore it is not God” ([[Hos. 8:6]]; see the note on [[Hos. 8:5]]).
    sources: [lds-scriptures, niv]

  - ref: 3
    phrase: in thee the fatherless findeth mercy
    kind: words
    title: Lo-ruhamah’s word, without the “not”
    body: |
      “Findeth mercy” is the verb in the name Lo-ruhamah, which says that she is not shown mercy, and here the “not” is gone. The Lord gave that name to Hosea’s daughter as a sentence on the kingdom ([[Hos. 1:6]]; see the note there) and promised to take it back ([[Hos. 2:23]]). The same verb is used of the children of Israel in chapter 2 and of the fatherless here. The verb stands seven times in Hosea, and this is the last. The clause has been read as a deliberate play on the daughter’s name.

      Why “the fatherless”? An orphan has no protector, and scripture gives that place to the Lord: “thou art the helper of the fatherless” ([[Ps. 10:14]]). A modern translation has “In you the orphan finds mercy.”

      [“I Will Betroth Thee unto Me”](/hosea/themes/betroth-thee/) follows this word from the daughter’s name to this prayer.
    sources: [bdb, oshb-wlc, bowen-fruit-of-loins, nrsvue]

  - ref: 4
    phrase: I will love them freely
    kind: words
    title: Love given of His own accord
    body: |
      “Freely” is a Hebrew noun for voluntariness: the Lord’s love is given of His own accord. The word is *nedavah*, “voluntariness, freewill-offering,” and it is also the name of the offering a worshipper brought voluntarily. The reason the Lord gives is “for mine anger is turned away.”

      “Backsliding” is “turning back, apostasy,” which a modern translation gives as “I will heal their disloyalty.” The Lord speaks of it as something to be healed. The verb “heal” stands five times in Hosea, and its uses show why this one matters. Assyria “could … not heal you” ([[Hos. 5:13]]). The people expected healing: “he hath torn, and he will heal us” ([[Hos. 6:1]]). The Lord had in fact healed them, and “they knew not that I healed them” ([[Hos. 11:3]]). Here at last He promises it outright.

      Jeremiah has the same promise in nearly the same words: “Return, ye backsliding children, and I will heal your backslidings” ([[Jer. 3:22]]).

      [“I Will Heal Their Backsliding”](/hosea/themes/heal-their-backsliding/) follows the book’s five uses of “heal” to this verse.
    sources: [bdb, nrsvue, oshb-wlc]

  - ref: 5
    phrase: I will be as the dew unto Israel
    kind: symbol
    title: The Lord as the dew
    body: |
      Dew has been the book’s picture of what does not last, and here the Lord takes it for Himself. Israel’s goodness was “as the early dew it goeth away” ([[Hos. 6:4]]; see the note there), and Ephraim itself would be “as the early dew that passeth away” ([[Hos. 13:3]]).

      Dew could carry both meanings. It was “of great importance in Palestine owing to the want of rain during a large portion of the year; hence spoken of as a source of fertility,” and in poetry it stands for “any beneficial effect produced by quiet means.” Hebrew usage has it both ways: dew “as transitory” in chapter 6, and as a figure of the Lord’s “kindness” here.

      What grows under it is drawn in two strokes. Israel will “blossom like the lily.” And he will root “as Lebanon,” which is all the Hebrew says; translators fill it in as “like a cedar of Lebanon” or “like the forests of Lebanon.”

      Joseph Smith used the same picture: “As the dews of Carmel, so shall the knowledge of God descend upon them!” ([[D&C 128:19]]).
    sources: [bd-dew, bdb, nrsvue, niv]

  - ref: 6
    phrase: his beauty shall be as the olive tree
    kind: scripture
    title: Israel as an olive tree
    body: |
      Israel as an olive tree is a figure other prophets use too, and Zenos’s allegory gives it in full. Jeremiah has it with a threat attached: “The Lord called thy name, A green olive tree, fair, and of goodly fruit,” and in the same verse fire is kindled on its branches ([[Jer. 11:16]]). Zenos likens the whole house of Israel to the tree: “I will liken thee, O house of Israel, like unto a tame olive tree” ([[Jacob 5:3]]).

      Hosea’s verses have been placed among the passages that dwell on the Lord planting, tending, and blessing the tree, over against those that tell of its uprooting and burning. “Both dimensions are found, combined seamlessly into one whole, in Zenos’s allegory.” Hosea’s picture here is of roots, spreading branches, beauty, and fragrance.

      Whose shade is it in verse 7? The Hebrew has “his shadow,” which the King James keeps, as does a modern translation: “People will dwell again in his shade.” Another prints “They shall again live beneath my shadow,” with a note that the Hebrew has “his”; the shade is then the Lord’s.
    sources: [lds-scriptures, sc-knowhy-440, niv, nrsvue]

  - ref: 8
    phrase: From me is thy fruit found
    kind: words
    title: Who is speaking, and Ephraim’s name
    body: |
      The Hebrew of this verse does not mark its speakers, and its last line plays on Ephraim’s name. “Shall say” is supplied by the King James translators. The Hebrew has only the name “Ephraim” and then the question. So the King James gives the question to Ephraim, who is done with idols. Other translations take the name as an address and the Lord as the speaker: “O Ephraim, what have I to do with idols?” The Septuagint has a third form, “What has he to do any more with idols?” Each form of the question puts idols aside, though the speaker changes.

      The rest is the Lord’s. “I have heard him” is the verb for answering, used of God answering graciously, as in the chain of answers in [[Hos. 2:21–22]] (see the note there). “Observed him” is to “regard with watchful care.” A modern translation has “It is I who answer and look after you.”

      The tree is a “cypress or fir,” and “green” is “luxuriant, fresh,” so that translators write “an evergreen cypress.” The simile has been taken as one of “productiveness,” and the last line says so: the fruit is found on Him.

      That line is aimed at a name. To an Israelite ear Ephraim “sounded like or connoted” something close to doubly fruitful, and the book has used the name against the kingdom: “Ephraim is smitten, their root is dried up, they shall bear no fruit” ([[Hos. 9:16]]). On one reading the book’s plays on the name come to their height here, where the Lord tells Ephraim that “he himself is source” of its fruitfulness. The same reading takes the promise to “presuppose a time and a situation in which Israel and Ephraim” have become fruitful again after apostasy, scattering, and exile.
    sources: [oshb-wlc, nrsvue, lxx-rahlfs, bdb, bowen-fruit-of-loins]

  - ref: 9
    phrase: Who is wise, and he shall understand these things?
    kind: structure
    title: A last word to the reader
    body: |
      The last verse speaks not to Israel but to whoever has read the book. It “contains the epilogue to the whole book,” and “these things” are everything the prophet has said. A psalm has nearly the same words: “Whoso is wise, and will observe these things, even they shall understand the lovingkindness of the Lord” ([[Ps. 107:43]]).

      What the wise will understand is put in one sentence: “the ways of the LORD are right.” “Right” is straight, as the Septuagint has it, “the ways of the Lord are straight.” The sentence “points back to” the song of Moses, where the Lord is the Rock and “just and right is he” ([[Deut. 32:4]]).

      Then the verse divides its readers. There is one road, and two things happen on it: the just walk in it, and the transgressors “fall therein.” “Fall” is the verb of verse 1, to stumble, and modern translations show the link: “but transgressors stumble in them.” The chapter began by telling Israel that it had stumbled. It ends by saying that people stumble on the Lord’s own ways. The same ways “lead some to life and others to death, according to the different attitudes which men assume towards God.”
    sources: [keil-hosea, lxx-rahlfs, oshb-wlc, nrsvue]

christ: |
  The writer of Hebrews alludes to the Greek form of Israel’s prayer (see the note on verse 2) and says through whom such an offering is made. “Jesus also, that he might sanctify the people with his own blood, suffered without the gate” ([[Heb. 13:12]]), and a few sentences later, “By him therefore let us offer the sacrifice of praise.”

  The book’s hard pictures stand in the chapters before this one. Those who teach them have been pointed here: students find joy again by “seeing the future redemption and reconciliation of God’s people to him through Jesus Christ,” and “Hosea’s book concludes this way,” with the Lord’s promise to heal and to love freely.

explore: |
  - **Words as sacrifice.** [[Ps. 51:15–17]], [[Heb. 13:10–16]], and [[D&C 59:8]].
  - **The olive tree.** [[Jacob 5:3]] and the allegory that follows, read beside verses 5–7.
  - **Horses and Egypt.** [[Isa. 31:1–3]].
  - **The children’s names answered.** [[Hos. 2:21–23]], where Lo-ruhamah’s name is first taken back.
  - **Ephraim’s name.** [[Gen. 41:52]], where Joseph names his son for the Lord’s having “caused [him] to be fruitful.” The essay “‘Thou Art the Fruit of My Loins’” (*Interpreter* 28) follows the play on the name through Hosea.

