chapter: 5
title: Judgment on Priests, People, and King; the Lord Withdraws
tagline: The Lord summons Israel’s priests, people, and royal house to judgment and draws Judah into the same sentence. He is moth, rot, and lion to both kingdoms, and He goes back to His place until they seek His face.
when: 'Undated; the northern kingdom’s last decades, in the 700s B.C.'

setting: |
  Chapter 5 is the second of two oracles that open with a call to hear ([[Hos. 4:1]]; 5:1). The prophecies of chapters 4–14 sometimes stand as separate episodes, “each started with an exhortation for the audience to hear or hearken (such as chapters 4 and 5),” and sometimes build on one another, as “chapter 6 draws on the imagery in 5.” Chapter 4 spoke to the “children of Israel” and then to the priests; this one summons priests, people, and the royal house together.

  Nothing in it is dated, and no king of Israel is named. “Ephraim” is the northern kingdom and “Judah” the southern, each called by its leading tribe ([[Hos. 4:17]]). Hosea was a prophet of the north, but Judah is drawn in from verse 5 on: “Judah also shall fall with them.” The one foreign power named is Assyria (verse 13). The book of Kings tells of an Israelite king, Menahem, who bought Assyria’s support ([[2 Kgs. 15:19]]), and the going to Assyria in verse 13 has been referred to him, but Hosea does not say which approach to Assyria he means.

  [[D&C 101:7–8]] speaks of the Saints in the terms of verses 6 and 15. Several lines of the chapter are hard in Hebrew (verses 2, 7, 8, 11, and 13), and the notes give the main renderings.

thread: |
  Hosea 5 is about seeking and not finding, and about who knows whom. The Lord knows Ephraim (verse 3); Ephraim has “not known the LORD” (verse 4). The people go to seek Him with flocks and herds and do not find Him, because “he hath withdrawn himself from them” (verse 6). When the sickness shows, Ephraim looks for a healer in Assyria, who cannot heal (verse 13). The chapter closes with the Lord withdrawn again, until they “seek my face” (verse 15). The Hebrew verb for “know” is the same in verses 3 and 4, and the verb for “seek” is the same in verses 6 and 15.

  Between those points the chapter widens. It opens as a charge against the north’s leaders, who have trapped their own people (verses 1–2). By verse 5 Judah is falling “with them,” and from verse 10 the two kingdoms are named side by side: Judah’s princes and Ephraim, moth and rottenness, sickness and wound, lion and young lion. The pictures of the Lord in these verses are of judgment: wrath poured out like water, a moth, rot, a lion. They are not the last word. Verse 15 sets a term to the Lord’s absence, and the first three verses of chapter 6 take up the images and reverse them ([[Hos. 6:1–3]]).

sections:
  - range: 1-2
    heading: Priests, people, and king are summoned
    plain: |
      The Lord calls three groups to hear: the priests, the house of Israel, and the king’s house. The judgment is theirs, because they have been a snare at Mizpah and a net spread on Tabor. Verse 2 is hard in Hebrew. In the King James the revolters have gone deep in slaughter, though the Lord has rebuked them all.
  - range: 3-7
    heading: A people who cannot return
    plain: |
      The Lord knows Ephraim, and Israel is not hidden from Him. Ephraim has committed whoredom and Israel is defiled. Their deeds do not let them return to their God, for a spirit of whoredoms is in them and they have not known the Lord. Israel’s pride testifies against him. Israel and Ephraim will fall in their iniquity, and Judah with them. They will go with flocks and herds to seek the Lord and will not find Him, for He has withdrawn. They have dealt treacherously with Him and borne strange children. Now a month (or a new moon) will devour them and their portions.
  - range: 8-9
    heading: The alarm in Benjamin
    plain: |
      Blow the ram’s horn in Gibeah and the trumpet in Ramah. Raise the cry at Beth-aven: “after thee, O Benjamin.” Ephraim will become a desolation in the day of rebuke. What the Lord has made known among the tribes of Israel is sure.
  - range: 10-11
    heading: Judah’s princes and Ephraim’s choice
    plain: |
      Judah’s princes have become like men who move a boundary marker, and the Lord will pour out His wrath on them like water. Ephraim is oppressed and crushed in judgment, because he chose to walk after “the commandment” (or “filth”).
  - range: 12-14
    heading: Moth, rot, and lion
    plain: |
      So the Lord is like a moth to Ephraim and like rottenness to the house of Judah. Ephraim saw his sickness and Judah his wound, and Ephraim went to Assyria and sent to king Jareb, who cannot heal them or cure the wound. For the Lord will be a lion to Ephraim and a young lion to Judah. He Himself will tear and go away; He will carry off, and no one will rescue.
  - range: 15
    heading: Until they seek my face
    plain: |
      The Lord will go back to His place until they acknowledge their offence and seek His face. In their affliction they will seek Him early.

notes:
  - ref: 1
    phrase: ye have been a snare on Mizpah, and a net spread upon Tabor
    kind: symbol
    title: The snare and the net
    body: |
      The charge against Israel’s leaders is that they have hunted the people they were set over. The summons names three groups, the priests, the house of Israel, and the house of the king. They are “the religious leadership, the people, and the political leadership of Israel.” The judgment is “toward you,” and the reason given fits the leaders. The word for “snare” (*pach*) is a “bird-trap.” Hosea uses the same picture later of a prophet who is “a snare of a fowler in all his ways” ([[Hos. 9:8]]). Read so, the rulers and the priests are “the hunters who spiritually killed their prey, Israel.”

      Why Mizpah and Tabor are named, Hosea does not say. Tabor is the mountain where Barak gathered Israel’s army ([[Judg. 4:6]]), and several places were called Mizpah, “Watchtower.” The two have been explained as mountains “famous for hunting,” which would make the snare and the net the natural words. The verse does not say which king’s house is meant.
    sources: [hord-not-fragile, bdb, ot-manual-10, bd-mizpah, lds-scriptures]
  - ref: 2
    phrase: the revolters are profound to make slaughter
    kind: words
    title: A hard line, read three ways
    body: |
      Verse 2 is one of the hard lines of the book, and the versions divide over it. In the King James, rebels are sunk deep in killing. The ESV keeps that sense in plainer English, the revolters “have gone deep into slaughter,” and the NIV has “The rebels are knee-deep in slaughter.” The Hebrew as it stands can mean that, but the rendering is marked “dubious,” and it has been proposed to read the words as “the pit of Shittim they have made deep.”

      The NRSVUE adopts that proposal: “and a pit dug deep in Shittim,” with the note “Meaning of Heb uncertain.” Read so, the verse adds a third trap to the snare and the net of verse 1, and a third place. The Septuagint (the ancient Greek translation) also continues the hunt of verse 1: the net is one “which they that hunt the prey have fixed.” So does the explanation of the King James wording that takes the “revolters” as “those who drove animals into a pit that had been camouflaged.”

      The second half of the verse is steadier. The Lord is the one who corrects “them all,” whether the correcting is already past, as in the King James, or still to come: “I will discipline all of them” (NIV).
    sources: [esv, niv, bdb, nrsvue, lxx-rahlfs, ot-manual-10]
  - ref: 4
    phrase: they have not known the LORD
    kind: words
    title: The Lord knows Ephraim, and Ephraim does not know the Lord
    body: |
      Verses 3 and 4 turn on one verb: the Lord says “I know Ephraim,” and He says of Ephraim, “they have not known the LORD.” The Hebrew verb is the same in both (*yada‘*). Nothing about Israel is hidden from the Lord, and Israel has lost the knowledge of Him. That knowledge is what this part of the book says is missing: “there is no truth, nor mercy, nor knowledge of God in the land” ([[Hos. 4:1]]), and what the Lord desires is “the knowledge of God more than burnt offerings” ([[Hos. 6:6]]).

      The first clause of verse 4 says why they do not come back. The King James, “They will not frame their doings to turn unto their God,” makes it unwillingness. The Hebrew can also be read with the deeds as the subject, so that their behavior does not allow them to return, and the NRSVUE, NIV, and ESV all translate it that way: “Their deeds do not permit them to return to their God.” On that reading what they have done holds them where they are.

      The reason follows: “the spirit of whoredoms is in the midst of them.” The phrase comes from [[Hos. 4:12]], where this spirit “hath caused them to err.” “Whoredoms” is the word of the command that opens the book ([[Hos. 1:2]]), so the marriage figure of chapters 1–3 stands behind it.
    sources: [oshb-wlc, lds-scriptures, nrsvue, niv, esv]
  - ref: 6
    phrase: They shall go with their flocks and with their herds to seek the LORD
    kind: history
    title: Seeking the Lord with flocks and herds
    body: |
      The flocks and herds are animals for sacrifice, and the verse says that sacrifice will not find the Lord. “The offering of sacrifices will be no help to them, because God has withdrawn Himself from them.” God “has no pleasure in sacrifices which are offered in an impenitent state of mind.” The people in view are not irreligious. They come with offerings, and the Lord is not there to be found: He “hath withdrawn himself,” a verb (*chalats*) that means to “draw off or out, withdraw.” Hosea states the principle a chapter later: “I desired mercy, and not sacrifice” ([[Hos. 6:6]]).

      The verb “seek” (*baqash*) comes twice in this chapter. Here they seek and do not find. In verse 15 the Lord waits “till they acknowledge their offence, and seek my face.” The same verb returns in [[Hos. 7:10]], where Israel does not “seek him for all this.” In verse 15 the seeking has something before it that verse 6 does not mention, the acknowledgment of the offence.
    sources: [keil-hosea, bdb, oshb-wlc, lds-scriptures]
  - ref: 7
    phrase: now shall a month devour them with their portions
    kind: words
    title: Strange children, and a month that devours
    body: |
      “Strange children” continues the marriage figure: a wife who has “dealt treacherously” bears children who are not her husband’s. Israel “ought to have begotten children of God in the maintenance of the covenant with the Lord,” and instead raised a generation “whom the Lord could not acknowledge as His own.” The NRSVUE has “illegitimate children,” the ESV “alien children.” The expression amounts to the “children of whoredoms” of the book’s opening chapters ([[Hos. 2:4]]).

      The last clause is uncertain, and it changes with one word. The Hebrew *chodesh* means both “new moon” and “month.” Taken as “month,” the line is about time: they and their property will be destroyed within a month. Taken as “new moon,” it is about worship: “Now the new moon shall devour them with their fields” (ESV). The word here has been taken of the new moon “as religious festival,” and the NIV makes the feast the occasion of the loss: “When they celebrate their New Moon feasts.” The new moon is one of the feasts the Lord has already said He will end ([[Hos. 2:11]]). The Septuagint has neither sense: there “the cankerworm” devours them. “Portions” is “fields” in the modern versions.
    sources: [keil-hosea, ot-manual-10, nrsvue, esv, niv, bdb, lxx-rahlfs, lds-scriptures]
  - ref: 8
    phrase: after thee, O Benjamin
    kind: history
    title: The alarm sounds in Benjamin
    body: |
      The horn and the trumpet are the signal of invasion, and the first two towns named stand on Benjamin’s northern boundary. The “cornet” is the *shofar*, the ram’s horn, and blowing it was “a signal by which the invasion of foes” was announced. Gibeah and Ramah were “two elevated places on the northern boundary of the tribe of Benjamin, which were well adapted for signals.” Ramah lay “in Benjamin, on the border of Ephraim,” and “on the frontier and on the road to Jerusalem.” Gibeah is the town of [[Judg. 20:4]], which Hosea returns to in [[Hos. 9:9]] and [[Hos. 10:9]]. Beth-aven is his name for Bethel ([[Hos. 4:15]]). One reading takes the choice of these towns to mean that the prophet sees the enemy as having “already conquered the kingdom of the ten tribes” and reached Judah. The verse does not name the enemy.

      “After thee, O Benjamin” is a phrase of Deborah’s song, “after thee, Benjamin, among thy people” ([[Judg. 5:14]]), where the words have been read of Benjamin, who “marched behind Ephraim” to battle. What it means here is disputed, and the versions show the range: a warning, “look behind you, Benjamin!” (NRSVUE); a battle cry, “lead on, Benjamin” (NIV); or “we follow you, O Benjamin!” (ESV, with the note “Or after you”). The reading that keeps the alarm takes it as the warning: “the foe is coming behind Benjamin.”
    sources: [lds-scriptures, keil-hosea, bd-ramah, nrsvue, niv, esv]
  - ref: 11
    phrase: he willingly walked after the commandment
    kind: words
    title: Walking after the commandment, or after filth
    body: |
      The last word of verse 11 is rare and its meaning is uncertain, so the verse names Ephraim’s fault differently from version to version. The word is *tsav*. It stands only here in Hosea, and elsewhere only in Isaiah 28, where the King James has “precept upon precept” ([[Isa. 28:10]]; [[Isa. 28:13]]). It is a “dubious word,” usually taken here as “command, ordinance.” That gives the King James: Ephraim “willingly walked after the commandment.” The ESV’s note keeps that sense as an alternative rendering, with the command a human one: “to follow human precepts.”

      The versions read otherwise. The Septuagint has “he began to go after vanities,” and the NRSVUE follows the Greek, “determined to go after vanity,” with the note “Meaning of Heb uncertain.” The NIV has “intent on pursuing idols,” and the ESV “determined to go after filth,” which is the alternative offered in the Latter-day Saint edition of the Bible.

      The readings agree on the shape of the charge. Ephraim is “oppressed and broken in judgment” for something he chose: “willingly” is “was determined” in the NRSVUE and ESV.
    sources: [oshb-wlc, bdb, esv, lxx-rahlfs, nrsvue, niv, lds-scriptures]
  - ref: 12
    phrase: as a moth
    kind: symbol
    title: The Lord as moth and as rottenness
    body: |
      The Lord compares Himself to two things that waste and consume. The moth is named in Hebrew as a “waster, consumer,” and “rottenness” is “decay,” in this verse apparently the “ravages of worm.” Job joins the two in the same way: “he, as a rotten thing, consumeth, as a garment that is moth eaten” ([[Job 13:28]]). The NRSVUE has “maggots” for the first image, and the Septuagint has other figures altogether.

      The images are meant to startle. “It is not often that a prophet speaks of God as a destructive deluge, a rot that cannot be cured, or a lion that tears its prey.” What the figure says is that the wasting of the two kingdoms is the Lord’s own act. Verse 13 goes on to Ephraim’s “sickness” and Judah’s “wound.” The question the image puts is “in what ways God is like a devastating rot to those who have turned away from him and turned toward other sources for healing or relief.”
    sources: [bdb, nrsvue, lxx-rahlfs, hord-not-fragile, lds-scriptures]
  - ref: 13
    phrase: sent to king Jareb
    kind: history
    title: King Jareb
    body: |
      “King Jareb” is not the name of a known king; it is read as a title or a byname for the king of Assyria. The word stands only here and in [[Hos. 10:6]], where the calf of Beth-aven is carried to Assyria “for a present to king Jareb.” It is explained as a byname from a verb meaning to contend (“let him contend, or (one who) contends”), and the king has been identified as Tiglath-pileser Ⅲ. Another proposal reads the letters as an Assyrian royal title. The NRSVUE, NIV, and ESV translate “the great king,” and their notes keep the other reading: “Heb to a king who will contend” (NRSVUE), “Or to King Jareb” (ESV). The Septuagint treats it as a name, “king Jarim.”

      Hosea names no occasion for the embassy. Ephraim sees that he is sick and goes to Assyria, and “yet could he not heal you.” The solution is “to turn to the Lord for deliverance—not other sources, as they are impotent for what is required.” The prayer the book ends with gives up this very remedy: “Asshur shall not save us” ([[Hos. 14:3]]).
    sources: [bdb, nrsvue, niv, esv, lxx-rahlfs, hord-not-fragile, lds-scriptures]
  - ref: 14
    phrase: I, even I, will tear and go away
    kind: structure
    title: The lion that tears, and the reversal in chapter 6
    body: |
      The lion is the last of the chapter’s images of the Lord in judgment, and those images are answered at the opening of chapter 6. Verses 10–14 picture wrath poured out “like water,” rot and sickness, and a lion that tears. In [[Hos. 6:1–3]] the same things come back reversed: “the lion becomes a healer instead of a tearer (or terror), sickness is reversed in revival, and torrential rain becomes spring rain.” The link is in the words. “I, even I, will tear” and “he hath torn, and he will heal us” ([[Hos. 6:1]]) have the same verb (*taraph*), which Hosea uses nowhere else.

      The Lord says the tearing is His own, “I, even I,” and that “none shall rescue.” What stands between the tearing and the healing is verse 15, the verse that “transforms the Lord from an executor of justice into a minister of mercy.” Whether the people’s words in 6:1–3 are yet the seeking that verse 15 waits for is a question for [[Hos. 6:4]]. The lion returns in [[Hos. 13:7–8]].
    sources: [hord-not-fragile, oshb-wlc, lds-scriptures]
  - ref: 15
    phrase: I will go and return to my place
    kind: scripture
    title: The Lord returns to His place, until
    body: |
      The chapter ends with the Lord gone, and with a limit set on His going: “till.” The NIV carries the lion of verse 14 into this verse and makes the “place” a den: “Then I will return to my lair.” It is the withdrawal of verse 6 again, now with its end stated.

      Two things end it. The first is that they “acknowledge their offence.” The Hebrew verb (*asham*) means to “offend, be guilty,” and the versions differ on whether it is confession or the bearing of punishment: “until they acknowledge their guilt” (NRSVUE, ESV), “until they have borne their guilt” (NIV). The second is that they “seek my face,” with the verb of verse 6. “Seek me early” is a different verb (*shachar*), to “look early, diligently for,” in origin to “look for dawn.”

      The Lord speaks in like terms of Saints who had been “cast out from the land of their inheritance” ([[D&C 101:1]]). “They were slow to hearken unto the voice of the Lord their God; therefore, the Lord their God is slow to hearken unto their prayers” ([[D&C 101:7]]), and “in the day of their trouble, of necessity they feel after me” ([[D&C 101:8]]).

      The chapter division falls in the middle of the thought. The next words are the reply, “Come, and let us return unto the LORD” ([[Hos. 6:1]]), and a reader who stops here stops “before receiving the rest (and most important part) of God’s message.”
    sources: [niv, bdb, nrsvue, esv, oshb-wlc, lds-scriptures, hord-not-fragile]

christ: |
  The LORD who speaks in this chapter is Jehovah, and “Jehovah is the premortal Jesus Christ.” He says of Himself here that He is the moth, the rot, and the lion, and that He goes away. The going has a limit, “till they acknowledge their offence, and seek my face,” and the people’s next words name the same Lord as the healer: “he hath torn, and he will heal us; he hath smitten, and he will bind us up” ([[Hos. 6:1]]). Read with those words, the chapter’s images carry a “future assurance of hope in a God who seeks to gather his people to him.” In the book’s last chapter He says it in His own voice: “I will heal their backsliding, I will love them freely” ([[Hos. 14:4]]).

explore: |
  - **The answer to verse 15.** [[Hos. 6:1–3]] takes up the tearing, the sickness, and the water of this chapter; [[Hos. 6:4]] is the Lord’s reply.
  - **The lion again.** [[Hos. 13:7–8]], and the Lord who will “roar like a lion” in [[Hos. 11:10]].
  - **The prayer that gives up Assyria.** [[Hos. 14:1–4]]: “Asshur shall not save us,” and the Lord’s “I will heal their backsliding.”
  - **Seeking the Lord in the day of trouble.** [[D&C 101:7–8]].
  - **The severe images of God in Hosea.** Seth N. Hord, [“God Is Not Fragile”](https://rsc.byu.edu/vol-23-no-1-2022/god-not-fragile), *Religious Educator* 23, no. 1 (2022), sets the judgments of 5:10–15 beside 6:1–3.

