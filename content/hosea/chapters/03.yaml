chapter: 3
title: Bought Back, and the Many Days
tagline: The Lord sends Hosea to love an unfaithful woman again. He buys her and sets her a long time of waiting, and the Lord says what it means. Israel will wait many days without king or altar, and afterward will seek the Lord and David their king.
when: 'Undated; the northern kingdom’s last decades, in the 700s B.C.'

setting: |
  Chapter 3 has five verses and closes the three chapters about the prophet’s household. It carries no date. Hosea’s ministry “is generally placed in the turbulent third quarter of the eighth century B.C.,” between the last years of Jeroboam Ⅱ and the fall of Samaria, and his charge “was primarily to the Northern Kingdom.” The phrase “the children of Israel” comes three times in these five verses.

  Chapter 1 told of the marriage and the three children in the third person, and chapter 2 was the Lord’s speech to His unfaithful wife, ending in a promise of betrothal ([[Hosea 2:19–20]]). Now the prophet speaks for himself: “Then said the LORD unto me.” The Lord sends him a second time, and he tells in three verses what he did and in two what it meant.

  This is prophecy by action, of the kind Isaiah, Jeremiah, and Ezekiel also used, and as often happens the explanation stands beside the act. From chapter 4 on, “the marriage of Hosea is no longer a factor in his prophecy,” though “marriage remains the image through which his message is conveyed.”

  The king promised in the last verse, “David their king,” appears again in Jeremiah and Ezekiel ([[Jer. 30:9]]; [[Ezek. 34:23–24]]).

thread: |
  The chapter starts from one word. In the Hebrew of verse 1 the root for *love* comes four times: Hosea is to love a woman who is loved and is unfaithful, as the Lord loves the children of Israel, who love raisin cakes. The prophet’s love is measured against the Lord’s.

  What follows has two halves joined by a repeated line. In verses 1–3 the prophet acts: he loves, he buys, and he sets a term, “Thou shalt abide for me many days.” In verses 4–5 the Lord explains, beginning with “For”: “the children of Israel shall abide many days.” The verb is the same in both lines, a word for sitting or staying. The woman’s waiting is Israel’s waiting, and the sign has been summed up in one sentence: “As Hosea once more shows love for his wife, so the Lord will once more show love to Israel.”

  The waiting takes things away. She is to have no lovers, and Israel is to have no king, no sacrifice, no ephod, and no teraphim. Nothing in the chapter says how the woman answered. The only answer given is Israel’s, and it lies in the future: “Afterward shall the children of Israel return.” A chapter that began with a command to love ends with a people coming to the Lord “and his goodness.”

sections:
  - range: 1-3
    heading: “Go yet, love a woman”
    plain: |
      The Lord said to me, “Go again and love a woman who is loved by her friend and is an adulteress, as the Lord loves the children of Israel, though they turn to other gods and love raisin cakes.” So I bought her for fifteen pieces of silver and a homer and a half of barley. I told her, “You will stay as mine for many days. You will not play the harlot or belong to another man, and so will I be for you.”
  - range: 4-5
    heading: Many days, and afterward
    plain: |
      For the children of Israel will stay many days with no king and no prince, no sacrifice and no sacred pillar, no ephod and no teraphim. Afterward they will return and seek the Lord their God and David their king, and in the latter days they will come trembling to the Lord and to His goodness.

notes:
  - ref: 1
    phrase: Go yet, love a woman
    kind: history
    title: The woman is not named
    body: |
      The woman of this chapter is given no name, and the text does not say whether she is Gomer. Chapter 1 named “Gomer the daughter of Diblaim” ([[Hosea 1:3]]); here she is only “a woman.” Some scholars find a second wife in the chapter. She is more often taken to be Gomer: on that reading the chapter “presents the same story of Hosea and his wife, but with different details and additional information,” though “the relationship between the two accounts is problematic.” These notes say “the woman,” as the verse does. Whether the marriage was an event or a figure is a question for [[Hosea 1:2]].

      Two words set this command apart from the first. “Yet” is the Hebrew *‘od*, a word that can mean “again,” and modern translations take it so here: “Go again, love a woman” (ESV), or, taking it with the first verb, “The Lord said to me again” (NRSVUE). And the command is no longer “take unto thee a wife” ([[Hosea 1:2]]). It is “love.”
    sources: [lds-scriptures, jackson-hosea-marriage, parry-symbolic-action, scripture-helps-hosea, oshb-wlc, bdb, esv, nrsvue]
  - ref: 1
    phrase: beloved of her friend
    kind: words
    title: The friend who loves her
    body: |
      The “friend” who loves the woman may be a lover or her own husband; the Hebrew word allows both. It is *rea‘*, a companion or intimate. In this verse it has been classed with the “paramours” of [[Jer. 3:1]], and modern translations agree: “a woman who has a lover” (NRSVUE), “loved by another man” (ESV). But the same word is the “husband” of [[Jer. 3:20]], “as a wife treacherously departeth from her husband.” The case for a husband here is that a woman is an adulteress only against a husband who loves her, so that the friend “could only be her husband, i.e., the prophet himself.” The Septuagint, the ancient Greek translation, has neither: “a woman that loves evil things.”

      On either reading she is loved while she is unfaithful, and that is the comparison the verse draws: “according to the love of the LORD toward the children of Israel, who look to other gods.”
    sources: [bdb, keil-hosea, lxx-rahlfs, nrsvue, esv, oshb-wlc, lds-scriptures]
  - ref: 1
    phrase: flagons of wine
    kind: words
    title: Raisin cakes at the feasts
    body: |
      The “flagons of wine” that Israel loves are cakes of pressed raisins, a food of the feasts. The Hebrew is *’ashishe ‘anavim*, cakes of grapes, and *’ashishah* is a “(pressed) raisin-cake.” The King James has a vessel of wine in its place, here and in [[2 Sam. 6:19]], where David gives one to every person at the feast for the ark. In this verse the cakes are those “used in sacrificial feasts,” and in fertility rites.

      They stand in the sentence beside the “other gods”: Israel turns to the gods and loves what is eaten at their feasts. Chapter 2 made the charge at length, where the wife credits her lovers with her bread and her vines ([[Hosea 2:5]]; [[Hosea 2:12]]).
    sources: [bdb, oshb-wlc, lds-scriptures]
  - ref: 2
    phrase: fifteen pieces of silver, and for an homer of barley, and an half homer of barley
    kind: history
    title: The price and what it bought
    body: |
      The price is fifteen shekels of silver and a homer and a half of barley, and the text does not say to whom it was paid or what it released the woman from. “Bought” is a verb meaning to “get by trade, buy.” A homer was a dry measure of ten ephahs ([[Ezek. 45:11]]), by one estimate about six and a half bushels. The “half homer” is a *lethek*, a measure named only here. That it was half a homer rests on later tradition, and “this tradition is uncertain.” The Septuagint has “a flagon of wine” in its place, and the NRSVUE follows it with “a measure of wine.”

      One reckoning makes the total thirty shekels, the sum the law sets for a slave gored by an ox ([[Ex. 21:32]]): fifteen in silver, and fifteen ephahs of barley at a shekel each. It depends on the price of barley, which is not known: “a very natural supposition,” but a supposition. If it holds, the prophet paid a slave’s price, half of it in grain.

      What the payment was is also disputed. “Much scholarly discussion has been generated over the issue of whether she is being purchased out of slavery or redeemed out of prostitution,” and “the meaning is quite unclear.” A third proposal makes it a marriage present, given “not to the parents, but to the bride herself.” What is clear is that the purchase gives Hosea “the right to stipulate their relationship,” and in the next verse he does.
    sources: [bdb, bd-weights-and-measures, lxx-rahlfs, nrsvue, keil-hosea, jackson-hosea-marriage, lds-scriptures]
  - ref: 3
    phrase: so will I also be for thee
    kind: words
    title: What Hosea promises in return
    body: |
      Hosea’s own part in the arrangement is three Hebrew words, literally *and also I to you*, and translators fill them out in two ways. The King James leaves them open: “so will I also be for thee.” Some modern translations make the clause a second restriction, laid on him as on her: “you shall not have intercourse with a man, nor I with you” (NRSVUE), “I will behave the same way toward you” (NIV). Another reading hears a pledge of his faithfulness set beside hers. On that reading it is “his statement of his responsibility,” and it shows “the reciprocal nature of the covenant, both partners being bound to obligations of faithfulness.”

      Either way the purchase is followed by “many days,” and the wait has been read of the covenant: even after the price is paid, “there is a time of testing, of waiting and preparing, before one is reinstated to all the blessings of the covenant.”
    sources: [oshb-wlc, nrsvue, niv, jackson-hosea-marriage, ot-manual-10]
  - ref: 4
    phrase: without an image, and without an ephod, and without teraphim
    kind: history
    title: Six things Israel will do without
    body: |
      Israel is to lose its government and its worship, and the list of worship names lawful things beside forbidden ones. King and prince are the government. The “image” beside “sacrifice” is a *matstsebah*, a sacred stone or pillar set up by an altar, and the law forbids it under the same English word: “Neither shalt thou set thee up any image; which the LORD thy God hateth” ([[Deut. 16:22]]).

      The last two are harder to place. The ephod was part of the high priest’s dress, and the breastplate that held the Urim and Thummim was fastened to it ([[Ex. 28:30]]); David tells the priest, “bring me hither the ephod” ([[1 Sam. 30:7]]). But an ephod was at one time itself worshipped, and in those passages the name may possibly mean an image of some kind. Teraphim were images, “a kind of idol, object of reverence, and means of divination,” and to use them “was probably not to worship strange gods but to worship the true God in a corrupt manner.” A private shrine in the days of the judges had the pair together: its owner “made an ephod, and teraphim” ([[Judg. 17:5]]).

      The ephod is read here as standing for revelation, and the forbidden things are thought to be listed with the commanded ones “to show the people that the worship of idols would also be lost.” The Septuagint has other things in place of the last three: “without an altar, and without a priesthood, and without manifestations.”

      The verse looks to Israel’s captivity, when “the king of Assyria took Samaria, and carried Israel away into Assyria” ([[2 Kgs. 17:6]]). It has been summed up as a long separation with “neither direction from a king nor divine instruction through revelation.”
    sources: [bdb, bd-ephod, bd-teraphim, ot-manual-10, lxx-rahlfs, jackson-hosea-marriage, lds-scriptures]
  - ref: 5
    phrase: David their king
    kind: christ
    title: David their king is the Messiah
    body: |
      “David their king” is a title of the Messiah, Jesus Christ. Jeremiah has the same words, “David their king, whom I will raise up unto them” ([[Jer. 30:9]]), and the Church’s heading to that chapter adds “(the Messiah)” after them. Ezekiel has “my servant David” as the one shepherd; the note on [[Ezek. 34:23]] gives the case in full. David’s reign was remembered afterward as “the type of the more glorious age to which the nation looked forward when Messiah should come.”

      For Hosea’s hearers the name carried a history. He spoke to the northern kingdom, and that kingdom began, about two centuries before him, when the tribes left David’s house with the cry “What portion have we in David? neither have we inheritance in the son of Jesse: to your tents, O Israel” ([[1 Kgs. 12:16]]). On one reading, a promise that Israel will seek “David their king” “clearly points to the falling away of the ten tribes from the house of David,” so that “the true return to the Lord cannot take place without a return to David their king.”
    sources: [lds-scriptures, bd-david, jackson-hosea-marriage, keil-hosea]
  - ref: 5
    phrase: fear the LORD and his goodness
    kind: words
    title: A fear that comes toward the Lord
    body: |
      This “fear” is a trembling that comes toward the Lord. The verb is *pachad*, to be in dread, and it is followed here by the Hebrew preposition “to,” so that the dread has a direction; in this verse the sense is “submitting to” the Lord. Modern translations supply the motion: “they shall come in awe to the Lord and to his goodness” (NRSVUE), “they shall come in fear to the Lord and to his goodness” (ESV). The Septuagint has “shall be amazed at the Lord and at his goodness.”
    sources: [bdb, oshb-wlc, nrsvue, esv, lxx-rahlfs]
  - ref: 5
    phrase: in the latter days
    kind: words
    title: The end of the days
    body: |
      “The latter days” is the last period a prophet sees, and how far off that is depends on the passage. The Hebrew is *be’acharit hayyamim*, “in the end of the days,” “a prophetic phrase denoting the final period of the history so far as the speaker’s perspective reaches”; its sense “varies with the context, but it often = the ideal or Messianic future.” Moses used the phrase for the same turn: “When thou art in tribulation, and all these things are come upon thee, even in the latter days, if thou turn to the LORD thy God” ([[Deut. 4:30]]), a verse that speaks “of the period of Israel’s return to God after adversity.”
    sources: [lds-scriptures, bdb, oshb-wlc]

christ: |
  Verse 1 sets the prophet’s love beside the Lord’s: Hosea is to love “according to the love of the LORD toward the children of Israel.” Two things in the chapter point to Jesus Christ.

  The first is the king at its end. “David their king,” whom Israel will seek together with the Lord their God, “is one of the titles of the Messiah or Jesus Christ” (see the note on verse 5).

  The second is the price. In verse 2 the prophet buys the woman, and the purchase has been read as a figure of redemption: Hosea sought to buy his wife out of slavery “just as Heavenly Father seeks after His children to redeem them from Satan’s power with the blood of His Son Jesus Christ.” (The note on verse 2 says what is uncertain about the purchase.) The wording of verse 1 recalls a sentence of Moses in which the Lord’s love and a redemption stand together: “because the LORD loved you… hath the LORD brought you out with a mighty hand, and redeemed you out of the house of bondmen” ([[Deut. 7:8]]).

explore: |
  - **The first command and the promise before this one.** [[Hosea 1:2–9]]; [[Hosea 2:14–23]].
  - **The same king.** [[Jer. 30:9]]; [[Ezek. 34:23–24]]; [[Ezek. 37:24–25]].
  - **The unfaithful wife in Jeremiah.** [[Jer. 3:1]]; [[Jer. 3:20]].
  - **An ephod and teraphim in one house.** [[Judg. 17:5]].
  - **Israel’s return in Restoration scripture.** [[2 Ne. 6:11]]; [[D&C 113:10]].
  - **What comes next.** In [[Hosea 4:1]] the household is left behind and the Lord’s “controversy” with the land begins.

