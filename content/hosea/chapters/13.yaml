chapter: 13
title: No Saviour Beside Me
tagline: Ephraim died when it turned to Baal, and the king it asked for cannot save it. The Lord, who has been its God since Egypt, says there is no saviour but Him, and then speaks to death and the grave.
when: 'Undated; the northern kingdom’s last decades, in the 700s B.C.'

setting: |
  Chapter 13 has no date. Hosea prophesied in the northern kingdom in the later 700s B.C., when Israel was close to being conquered by Assyria, and this chapter looks straight at the end. Its last verse names the capital, Samaria, and says that its people will fall by the sword. Kings records it: “the king of Assyria took Samaria, and carried Israel away into Assyria” ([[2 Kgs. 17:6]]). “Ephraim” is the book’s name for that kingdom (see the note on [[Hos. 4:17]]).

  This is the last chapter of judgment in the book. Chapter 14 is a call to return, with a promise of healing. In the Hebrew Bible the break between the two comes one verse earlier, so that verse 16 here is the first verse of chapter 14.

  The chapter argues from Israel’s own history. It goes back to Egypt and the wilderness (verses 4–5), to the land where Israel was fed and grew full (verse 6), and to the day the people asked Samuel for a king (verse 10).

  Verse 14 is its best-known line. Paul takes up its words to death and the grave in his chapter on the Resurrection ([[1 Cor. 15:55]]), and Abinadi’s words in [[Mosiah 16:7–8]] are close to both. The King James wording is hard to follow in verses 1, 2, 9, 10, and 14, and the notes on those verses set other translations beside it.

thread: |
  The chapter asks who can save Israel, and it begins and ends with death. It opens with a death already past: Ephraim “offended in Baal” and “died” (verse 1). The nation is still standing, but a people that kisses the work of its own craftsmen will pass like morning cloud, dew, chaff, and smoke (verse 3), four things that do not last. The first two were the Lord’s picture of Israel’s devotion: “your goodness is as a morning cloud” ([[Hos. 6:4]]). Now they are the picture of Israel.

  Against that stands verse 4: “there is no saviour beside me.” The rest of the chapter tests the sentence. The Lord fed Israel and was forgotten, so He Himself comes as lion, leopard, and bear (verses 7–8). Israel is destroyed, though its help is in Him (verse 9). The king Israel asked for cannot save (verses 10–11). The pains of birth come, but the child does not come to be born (verse 13).

  Then the Lord speaks to death itself (verse 14). The King James reads His words as a promise to ransom and redeem, and it comes without preparation between verses of judgment. The east wind and the sword follow at once (verses 15–16). On that reading the chapter lets both stand: Samaria will fall, and the grave will not keep what it takes.

sections:
  - range: 1-3
    heading: Ephraim died, and goes on sinning
    plain: |
      When Ephraim spoke there was trembling, and he was exalted in Israel; but he became guilty through Baal, and he died. Now they sin more and more. They cast images from their silver, idols of their own devising, all of it the work of craftsmen, and it is said of them that those who sacrifice kiss calves. So they will be like the morning cloud and the dew that is gone early, like chaff blown from the threshing floor and smoke from a chimney.
  - range: 4-8
    heading: The only Saviour, forgotten
    plain: |
      Yet the Lord has been their God since the land of Egypt. They are to know no god but Him, and there is no saviour besides Him. He knew them in the wilderness, in the land of drought. When they had pasture they were filled; being filled, they grew proud; and so they forgot Him. Therefore He will be to them like a lion, and like a leopard He will watch by the road. He will meet them like a bear robbed of her cubs and tear open their breast; there He will devour them like a lion, and the wild beasts will tear them.
  - range: 9-11
    heading: Where is your king?
    plain: |
      Israel has destroyed itself, though its help is in the Lord. Where now is the king who might save them in all their cities, and where are the rulers of whom they said, “Give me a king and princes”? The Lord gave them a king in His anger and took him away in His wrath.
  - range: 12-14
    heading: Birth pangs, and the grave
    plain: |
      Ephraim’s iniquity is tied up and his sin is kept in store. The pains of a woman in labor come upon him, but he is an unwise son: when it is time, he does not come to the mouth of the womb. The Lord will ransom them from the power of the grave and redeem them from death. Death, where are your plagues? Grave, where is your destruction? Repentance will be hidden from His eyes.
  - range: 15-16
    heading: The east wind and the sword
    plain: |
      Though Ephraim is fruitful among his brothers, an east wind will come, the wind of the Lord rising from the wilderness. His spring will dry up and his fountain fail, and his storehouse of precious things will be plundered. Samaria will bear her guilt, because she has rebelled against her God. Her people will fall by the sword, and neither the infants nor the women with child will be spared.

notes:
  - ref: 1
    phrase: When Ephraim spake trembling
    kind: words
    title: When Ephraim spoke, others trembled
    body: |
      The trembling is probably other people’s and not Ephraim’s: the line remembers a time when the tribe’s word carried weight in Israel. The King James can be read the other way, as humility rewarded, with Ephraim speaking in fear and being raised up for it. The Hebrew has only Ephraim’s speaking and then the one word “trembling.” Both renderings have their defenders, “when Ephraim spoke trembling” and “spoke, there was trembling,” and the text itself is doubtful. Modern translations take the second: “When Ephraim spoke, there was trembling.” On that reading “men listened with fear and trembling,” and “exalted himself” is a statement of rank. Ephraim “raised itself to the government,” which ended in a kingdom of its own beside Judah’s.

      The second half of the verse says how that ended: “when he offended in Baal, he died.” Hosea says this while the kingdom still stands; its fall is foretold in the chapter’s last verse. Said of a state, “died” is “given up to destruction,” and on this reading “the dying commenced with the introduction of the unlawful worship,” which includes “the worship of the calves under Jeroboam” at the kingdom’s founding as well as the later worship of Baal. Read so, Ephraim has been dying for as long as there has been a northern kingdom.

      “Offended” is a word about guilt, and the chapter comes back to it in its last verse (see the note on [[Hos. 13:16]]).
    sources: [bdb, nrsvue, keil-hosea]

  - ref: 2
    phrase: Let the men that sacrifice kiss the calves
    kind: history
    title: Kissing the calves
    body: |
      Kissing an image was an act of worship, and the calves are the golden calves of the northern kingdom (see the note on [[Hos. 8:5]]). When the Lord told Elijah how many in Israel were still His, He counted “all the knees which have not bowed unto Baal, and every mouth which hath not kissed him” ([[1 Kgs. 19:18]]). In Hebrew the words for “man” and “calves” stand side by side in this line. The verse has just said where such images come from: their makers’ silver, their makers’ ideas, and a craftsman’s hands. People are kissing a thing that people made.

      The words before it are harder, and they may carry a second charge. The Hebrew is literally *sacrificers of man*. The King James takes that as “the men that sacrifice,” the worshippers. It can also mean those who sacrifice human beings, and several translations read it so: “Those who offer human sacrifice,” or, “They offer human sacrifices!” with the King James sense in a note. The ancient Greek translation, the Septuagint, has “Sacrifice men, for the calves have come to an end.” Another modern translation avoids the charge. It has the people say only that sacrifice should be made to the idols, exclaims, “People are kissing calves!”, and notes that it has corrected the Hebrew.

      The charge of human sacrifice therefore rests on a doubtful line. The charge of worshipping the calves does not depend on it.
    sources: [lds-scriptures, oshb-wlc, esv, niv, nrsvue, lxx-rahlfs]

  - ref: 4
    phrase: there is no saviour beside me
    kind: christ
    title: The first commandment, with a Saviour in it
    body: |
      Verse 4 has the two parts with which the Ten Commandments open, and it adds a word, “saviour.” At Sinai the Lord said, “I am the LORD thy God, which have brought thee out of the land of Egypt, out of the house of bondage. Thou shalt have no other gods before me” ([[Ex. 20:2–3]]). Hosea has the same two parts, the God of the Exodus and the exclusion of every other, and then gives the reason: no one else saves.

      “Know” is the book’s word for the covenant bond. It is “used to describe the exclusive intimacy of the covenant bond,” and these two verses tell of “the establishment of the covenant between Jehovah and Israel, expressed in the vocabulary of marriage,” where “Egypt is where Jehovah found Israel, his bride.” The knowing runs both ways. “Thou shalt know no god but me” is followed by “I did know thee in the wilderness,” with the same Hebrew verb.

      Isaiah records the same sentence from the Lord: “I, even I, am the LORD; and beside me there is no saviour” ([[Isa. 43:11]]).

      Latter-day Saints understand the LORD who speaks here to be Jesus Christ before His birth. Two later witnesses say the same of Him by name. Nephi swears by “the Lord God … that brought Israel up out of the land of Egypt” that “there is none other name given under heaven save it be this Jesus Christ, of which I have spoken, whereby man can be saved” ([[2 Ne. 25:20]]). Peter told the council in Jerusalem, “Neither is there salvation in any other” ([[Acts 4:12]]).
    sources: [lds-scriptures, jackson-hosea-marriage, bd-jehovah, oshb-wlc]

  - ref: 6
    phrase: they were filled, and their heart was exalted
    kind: scripture
    title: Fed, full, proud, forgetful
    body: |
      Verse 6 is Moses’ warning in Deuteronomy 8 come true, in nearly his words. Moses told Israel what could happen once they were settled, when they had eaten and were full and their herds and flocks had multiplied: “Then thine heart be lifted up, and thou forget the LORD thy God, which brought thee forth out of the land of Egypt, from the house of bondage” ([[Deut. 8:14]]). He reminded them who had led them through the wilderness with its “drought, where there was no water” ([[Deut. 8:15]]) and “fed thee in the wilderness with manna” ([[Deut. 8:16]]). Hosea’s verses 4–6 have every piece of it: Egypt, the wilderness, the drought, the feeding, the heart lifted up, the forgetting. What Moses gave as a warning, Hosea reports as having happened.

      The picture is of a flock. “Pasture” is a word for pasturing or shepherding, used in the Bible only as a figure, and one modern translation keeps the animal in view: “when they had grazed, they became full.” The Septuagint carries the picture back into verse 5, “I tended thee as a shepherd in the wilderness,” and a modern translation follows it there with “It was I who fed you,” noting that the Hebrew has “knew.”

      Being fed is not the fault, since the pasture was the Lord’s gift. The verse counts three steps from the gift to the sin: they were filled, their heart was exalted, and they forgot.
    sources: [lds-scriptures, bdb, esv, lxx-rahlfs, nrsvue]

  - ref: 7
    phrase: I will be unto them as a lion
    kind: symbol
    title: The shepherd comes as the beasts
    body: |
      The four animals continue the picture of verse 6: Israel is a flock that has grown fat on good pasture, and the one who fed it now comes at it as a lion, a leopard, and a bear.

      Each animal adds something. The leopard waits: for “observe,” modern translations have “like a leopard I will lurk beside the way.” The bear is a mother “bereaved of her whelps.” The attack reaches the heart. “The caul of their heart” is what encloses it; the Church edition’s footnote gives “chamber,” and one modern translation has simply, “I will tear open their breast.”

      This is the second time the book has made the Lord a lion against Ephraim (see the note on [[Hos. 5:14]]).
    sources: [lds-scriptures, nrsvue, esv]

  - ref: 9
    phrase: thou hast destroyed thyself; but in me is thine help
    kind: words
    title: Destroyed, and by whom
    body: |
      The King James gives the gentlest of several readings of a very short Hebrew line. Word for word it is close to *it has destroyed you, Israel, for in me, in your help*. The verb has no stated subject, and nothing joins the two halves but “for.”

      The King James supplies “thyself” and “is”: Israel is its own destroyer, and its help is in the Lord. Others take “in me” as “against me,” so that the second half gives the cause of the ruin: “He destroys you, O Israel, for you are against me,” or, “You are destroyed, Israel, because you are against me,” and both go on to call the Lord Israel’s helper. The Septuagint has a question, “O Israel, who will aid thee in thy destruction?” One modern translation follows it, “I will destroy you, O Israel; who can help you?” and puts the Hebrew in a note: “for in me is your help.”

      The renderings from the Hebrew keep two things: Israel is ruined, and the Lord is its helper. They differ on whether the help is still held out, as in the King James, or is named as what Israel turned against. The Septuagint’s question names no helper. The King James reading is the one in the Church’s edition.
    sources: [oshb-wlc, esv, niv, nrsvue, lxx-rahlfs, lds-scriptures]

  - ref: 10
    phrase: I will be thy king
    kind: words
    title: The King James promise is a question in Hebrew
    body: |
      The first word of this verse almost certainly means “where,” so the line is a taunt and not a promise: the Lord is asking where Israel’s king is. The Hebrew word, *ehi*, is found in this verse and twice in verse 14 and nowhere else, and it is an adverb, “where?” The ancient Greek, Syriac, and Latin translations all read it so. It has the same letters as a form of the verb “to be,” and “many of the older interpreters” took it as “I would be,” a reading “less suited to the context.” The King James reads it that way in its first clause, “I will be thy king.” Modern translations begin, “Where now is your king, that he may save you?”

      The question fits the chapter better than the promise does. Verse 4 said there is no saviour beside the Lord, and “save” in this verse is the same Hebrew verb. The Lord asks where the king is who might save Israel in all its cities.

      What the King James says is true elsewhere in scripture. When Israel first asked for a king, the Lord told Samuel, “they have rejected me, that I should not reign over them” ([[1 Sam. 8:7]]). But this verse does not make that promise.

      The same word decides how verse 14 is read (see the notes there).
    sources: [bdb, oshb-wlc, nrsvue, lds-scriptures]

  - ref: 11
    phrase: I gave thee a king in mine anger
    kind: history
    title: The king given and the king taken
    body: |
      The words recall Saul, the king Israel asked Samuel for; another reading takes them of the northern kingdom’s own kings. “Give me a king and princes” echoes the elders who came to Samuel: “Give us a king to judge us” ([[1 Sam. 8:6]]). The Lord granted the request and said what it was: “they have rejected me, that I should not reign over them” ([[1 Sam. 8:7]]). The king He gave them was Saul, and Saul was removed: “the LORD hath rejected thee from being king over Israel” ([[1 Sam. 15:26]]).

      The other reading starts from the Hebrew verbs, which are not in the past tense. Their form is one that can “denote an action that is repeated again and again,” and the line can be rendered, “I give thee kings in my anger, and take them away in my wrath.” Read so, it speaks not of Saul but of “all the kings that the kingdom of the ten tribes had received and was receiving still, and to their removal,” beginning with Jeroboam the son of Nebat. That takes in “the kings who followed one another so rapidly through conspiracy and murder” (see the notes on [[Hos. 7:7]] and [[Hos. 8:4]]), and it looks ahead to the end of the monarchy, when “God took away this government from them” by “giving them into the power of the heathen.”

      The verse names no king. Kings tells how the last one was taken: the king of Assyria found that Hoshea had been sending to Egypt, and “shut him up, and bound him in prison” ([[2 Kgs. 17:4]]). The siege of Samaria is the next verse.
    sources: [lds-scriptures, oshb-wlc, keil-hosea]

  - ref: 12
    phrase: his sin is hid
    kind: words
    title: Sin kept in store
    body: |
      “Hid” here means put away for safekeeping, as valuables are. It does not mean covered over or lost from sight. The Hebrew verb is to “hide, treasure up,” and modern translations have “his sin is kept in store” and “his sins are kept on record.”

      An English reader could take a hidden sin for a forgiven one. The line says the reverse. Nothing Ephraim has done has been dropped or forgotten, and the reckoning is still ahead. The next verse says that it is arriving.
    sources: [bdb, nrsvue, niv]

  - ref: 13
    phrase: he is an unwise son
    kind: symbol
    title: The child who will not be born
    body: |
      Ephraim is the mother in labor at the start of this verse and the child by the end of it, and the charge is against the child: when the moment of birth comes, he will not come out. Modern translations are blunter than the King James: “at the proper time he does not present himself at the mouth of the womb,” or, “he doesn’t have the sense to come out of the womb.” Hezekiah used the same picture when Assyria stood outside Jerusalem: “the children are come to the birth, and there is not strength to bring forth” ([[Isa. 37:3]]). There the trouble is weakness. In Hosea it is folly, and so the son is called “unwise.”

      The Hebrew word for “sorrows” here, *hevel*, can mean “cord, rope, band, snare” or “pain, pang, travail.” (It is the word for the “cords of a man” by which the Lord drew Israel in [[Hos. 11:4]].) These verses have been listed with others that share “childbirth and atonement/redemption imagery,” most of which “speak of the people of Israel going through a time of crisis (which is compared to a woman in the pain of childbirth) and then being delivered by the promised king, the Messiah.”

      In this verse the birth does not come. With the pains already on him, Ephraim stays where he is.
    sources: [nrsvue, niv, lds-scriptures, sc-knowhy-93, oshb-wlc]

  - ref: 14
    phrase: I will ransom them from the power of the grave
    kind: words
    title: A promise, or a question
    body: |
      The King James reads these two lines as a promise, and the heading of this chapter in the Church’s edition reads them the same way: the Lord “ransoms from the grave and redeems from death.” A reader with another translation may find questions instead: “Shall I ransom them from the power of Sheol? Shall I redeem them from Death?” Printed so, the lines no longer promise anything.

      The difference is not in the Hebrew words. These lines have no question word. The two verbs are first-person forms, “I will ransom them” and “I will redeem them.” (“The grave” is *sheol* in Hebrew, which some translations leave as a name.) Some translations print them as questions. Others keep the statements, “I shall ransom them from the power of Sheol,” and give the questions in a note as an alternative.

      Read as a promise, the verse stands between two judgments, verse 13 and verse 15: “In the midst of death and destruction is the Lord’s promise.”

      What is promised is, first, Israel’s return. The verse “uses the figures of resurrection as a metaphor that promises the gathering and restoration of Israel,” as Ezekiel’s vision does: “I will open your graves, and cause you to come up out of your graves, and bring you into the land of Israel” ([[Ezek. 37:12]]). That does not make it any less a witness of the Resurrection, “for a metaphor of this type loses its force if the type or figure used is not real.”
    sources: [lds-scriptures, nrsvue, esv, oshb-wlc, ot-manual-10, hord-not-fragile]

  - ref: 14
    phrase: O death, I will be thy plagues; O grave, I will be thy destruction
    kind: scripture
    title: Paul and Abinadi take up the words to death
    body: |
      These are the words behind Paul’s “O death, where is thy sting? O grave, where is thy victory?” ([[1 Cor. 15:55]]). The King James “I will be” is the Hebrew word of verse 10, which means “where” (see the note on [[Hos. 13:10]]), and Paul’s verse has been set beside the ancient translations that read it so. With that word the line runs, “O Death, where are your plagues? O Sheol, where is your destruction?” The Septuagint has “where is thy penalty, O death? O Hades, where is thy sting?”

      Paul joins Hosea’s line to one from Isaiah. When the dead are raised, he writes, “then shall be brought to pass the saying that is written, Death is swallowed up in victory” ([[1 Cor. 15:54]]), which is [[Isa. 25:8]], and Hosea’s two questions follow. In Hosea the words are spoken over Israel, a nation going down to the grave. Paul applies them to the resurrection of the dead.

      Abinadi spoke of the Resurrection in words close to Paul’s, long before Paul wrote: “But there is a resurrection, therefore the grave hath no victory, and the sting of death is swallowed up in Christ” ([[Mosiah 16:8]]). One explanation of the likeness is that the two had the same older scripture in front of them: “it is likely that both Paul and Abinadi were borrowing from Old Testament passages such as Isaiah 25:8” and this verse. That is a proposal, and the Book of Mormon does not name Hosea.
    sources: [lds-scriptures, bdb, nrsvue, lxx-rahlfs, sc-knowhy-533]

  - ref: 14
    phrase: repentance shall be hid from mine eyes
    kind: words
    title: No change of mind, or no pity
    body: |
      The “repentance” in this line is the Lord’s own, and what it refers to is uncertain in two ways: what the word means, and which way the sentence points. The Hebrew noun means “sorrow, repentance,” and this verse is the one place cited for it. The Church edition’s footnote gives “compassion,” and modern translations agree: “Compassion is hidden from my eyes.” One makes it the opening of a new sentence, “I will have no compassion,” which runs on into verse 15.

      If the word is “compassion,” the line turns from the promise back to the judgment. Pity is withheld, and the east wind of verse 15 comes.

      If it is “repentance” in the older sense of a change of mind (see the note on [[Hos. 11:8]] for the King James use of the word of the Lord), the line says that the Lord will not go back on what He has said. It can seal the sentence on Samaria: it “could mean that the Lord will not swerve in His purpose even though Israel may cry out for deliverance.” An older reading takes it the other way, as sealing the promise: “my purpose of salvation will be irrevocably accomplished,” in the manner of the oath in the Psalms, “The LORD hath sworn, and will not repent” ([[Ps. 110:4]]).
    sources: [bdb, lds-scriptures, nrsvue, niv, keil-hosea, ot-manual-10]

  - ref: 15
    phrase: an east wind shall come
    kind: symbol
    title: The east wind on the fruitful one
    body: |
      Ephraim’s name sounds like “fruitful” (see the note on [[Hos. 9:16]]), and the verse sends against the fruitful one the wind that kills fruit. In that country the east wind blows off the desert, as the verse says: it comes “up from the wilderness.” Such winds are “capable of reducing green crops to dry, brown husks in a single day.” It is the wind of Pharaoh’s dream, where the thin ears are “blasted with the east wind” ([[Gen. 41:23]]). Hosea calls it “the wind of the LORD,” and the east wind was indeed “viewed as an instrument of God’s judgment.”

      Ephraim had been running after this wind (see the note on [[Hos. 12:1]]). Now it arrives, and it goes for the water: the spring and the fountain dry up, and with them everything that made the fruitful one fruitful.

      The last clause speaks of plunder: “He shall spoil the treasure of all pleasant vessels,” or in one modern translation, “His storehouse will be plundered.” The verse does not say who “he” is. The next verse names Samaria and the sword.
    sources: [sc-knowhy-560, lds-scriptures, niv]

  - ref: 16
    phrase: Samaria shall become desolate
    kind: history
    title: Samaria bears her guilt
    body: |
      “Become desolate” translates the Hebrew verb that was “offended” in verse 1, so the chapter ends on the word it began with. Both verses stand under the one verb, the first in the sense “be or become guilty” and this one in the sense “be held guilty, bear punishment.” Modern translations have, “Samaria shall bear her guilt because she has rebelled against her God.” Ephraim became guilty through Baal in the first verse, and in the last the capital carries what that guilt has earned.

      The rest of the verse says what the fall of the city will be for those least able to defend themselves. Hosea said the same at [[Hos. 10:14]], and the note there tells what armies of that time did and how such lines are to be read. Here “Hosea’s language evokes the realities and horrors of wartime atrocities against women and children to emphasize the consequences of Israel’s failure to turn to God.” It came as he said. The king of Assyria “went up to Samaria, and besieged it three years” ([[2 Kgs. 17:5]]).

      The verse gives one cause, rebellion “against her God,” and it does not stand last in the Hebrew Bible’s arrangement. There it is the first verse of chapter 14, and the words that follow it directly are, “O Israel, return unto the LORD thy God; for thou hast fallen by thine iniquity” ([[Hos. 14:1]]).
    sources: [bdb, oshb-wlc, nrsvue, niv, hord-not-fragile, lds-scriptures]

christ: |
  The Lord who says in this chapter that there is no saviour beside Him is, in Latter-day Saint understanding, Jesus Christ before He was born (see the note on verse 4). The promise of verse 14 is therefore one He made about His own work. He says there what He will do to death and the grave, and Paul ends his use of the line with thanks “to God, which giveth us the victory through our Lord Jesus Christ” ([[1 Cor. 15:57]]).

explore: |
  - **Death swallowed up.** [[Isa. 25:8]], [[1 Cor. 15:54–57]], and [[Mosiah 16:7–9]], read beside verse 14.
  - **Graves opened and a people brought home.** [[Ezek. 37:1–14]], where the valley of dry bones “conveys the same message” as verse 14.
  - **Full, and forgetting.** [[Deut. 8:10–18]], the warning that verses 4–6 report as fulfilled.
  - **The king Israel asked for.** [[1 Sam. 8:4–22]].
  - **The answer to this chapter.** [[Hos. 14:1–4]]. Israel’s prayer there takes up this chapter’s word: “Asshur shall not save us” ([[Hos. 14:3]]) uses the verb of “saviour” in verse 4.

