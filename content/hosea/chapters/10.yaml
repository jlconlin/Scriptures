chapter: 10
title: Sow in Righteousness, Reap in Mercy
tagline: Israel is a vine that spent its fruit on altars. The Lord takes away the altars, the calf, and the king, offers one more season for sowing, and says what harvest is already in.
when: 'Undated; the northern kingdom’s last decades, in the 700s B.C.'

setting: |
  Chapter 10 belongs to the prophetic oracles that fill chapters 4–14, and like the rest it carries no date. These oracles sometimes stand alone and sometimes “build on one another by drawing on the imagery from the preceding chapter”; this one returns to “the days of Gibeah,” named in [[Hos. 9:9]].

  It speaks to the northern kingdom under each of its names: Israel, Ephraim, Samaria (the capital), and Jacob. Judah, the southern kingdom, is mentioned once, in verse 11. Assyria is named as the place where the calf of Bethel will be carried (verse 6), and the chapter twice foresees the end of Israel’s king (verses 7 and 15). The book of Kings tells that end. Shalmaneser, king of Assyria from 727 to 722 B.C., made Hoshea of Israel his servant ([[2 Kgs. 17:3]]) and then besieged Samaria, which was taken after three years, and Israel was carried away to Assyria ([[2 Kgs. 17:6]]). Hosea names no king of Israel here, and the one foreign name he gives, Shalman (verse 14), is uncertain.

  Two of the chapter’s lines are taken up later in scripture. Jeremiah gives Judah the command of verse 12, “Break up your fallow ground” ([[Jer. 4:3]]), and the Savior speaks the words of verse 8 on the way to the cross ([[Luke 23:30]]).

thread: |
  The chapter is told in the language of a farm. It begins with a vine and its fruit and goes on to weeds in the furrows, thorns and thistles on the altars, a heifer at the threshing floor, the plow and the harrow, sowing, reaping, fallow ground, and rain. The argument runs through those pictures in order. Israel had a good land and a large yield, and spent the yield on altars and standing stones (verses 1–2). So the things it trusted are taken away one at a time: the altars are broken (verses 2 and 8), the calf of Bethel is carried to Assyria as a present (verses 5–6), and the king, already useless in verse 3, is swept off like a chip on the water (verse 7; in verse 15 he is “cut off” with the same Hebrew verb). What grows in place of them is poison in the plowed rows and thorns on the shrines.

  Verse 12 is the one invitation. It asks Israel to plow ground it has left unplowed, to sow righteousness, and to seek the Lord until He comes with rain. Verse 13 answers that the other crop has already been plowed, reaped, and eaten, and gives the cause: “thou didst trust in thy way, in the multitude of thy mighty men.” The last two verses say what that trust will be worth on the day of battle.

sections:
  - range: 1-2
    heading: A vine and its altars
    plain: |
      Israel is a vine that bears fruit for himself. The more fruit he had, the more altars he built; the better his land, the finer the sacred stones he set up. Their heart is divided, and now they will be found guilty. The Lord will break down their altars and ruin their stones.
  - range: 3-8
    heading: No king, no calf, no altars
    plain: |
      Now they will say, “We have no king, because we did not fear the Lord; and what could a king do for us?” They speak words, swearing falsely as they make a covenant, so judgment springs up like a poisonous weed in the furrows of the field. The people of Samaria will be afraid for the calves of Beth-aven. Its people will mourn over it, and so will the priests who rejoiced over it, because its glory is gone from it. It will be carried to Assyria as a present for king Jareb, and Israel will be ashamed of his own counsel. Samaria’s king is cut off like foam on the water. The high places of Aven, the sin of Israel, will be destroyed, and thorns and thistles will grow on their altars. They will say to the mountains, “Cover us,” and to the hills, “Fall on us.”
  - range: 9-11
    heading: Since the days of Gibeah
    plain: |
      Israel has sinned since the days of Gibeah, and there they have stood. The Lord means to chastise them, and peoples will be gathered against them when they are bound for their two iniquities. Ephraim is a trained heifer that loves to thresh, but the Lord has passed over her fair neck: Ephraim will be driven, Judah will plow, and Jacob will break up the clods.
  - range: 12-13
    heading: The one invitation
    plain: |
      Sow for yourselves in righteousness and reap in mercy. Break up your fallow ground, for it is time to seek the Lord, until He comes and rains righteousness on you. You have plowed wickedness and reaped iniquity, and you have eaten the fruit of lies, because you trusted in your own way and in the number of your mighty men.
  - range: 14-15
    heading: The fortresses fall
    plain: |
      So the noise of war will rise among your people, and all your fortresses will be destroyed, as Shalman destroyed Beth-arbel in the day of battle, when mothers were killed with their children. Beth-el will bring this on you because of your great wickedness. In a morning the king of Israel will be utterly cut off.

notes:
  - ref: 1
    phrase: Israel is an empty vine
    kind: words
    title: An empty vine, or a spreading one
    body: |
      The Hebrew word behind “empty” more likely means the opposite, luxuriant or spreading, and the rest of the verse fits that sense. Hebrew has two verbs spelled alike. One means to “empty, lay waste land,” which is the King James’s sense. The other means to be luxuriant, and the standard lexicon puts this verse under it: “luxuriant Hosea 10:1 (figurative of Israel as vine).” The Septuagint, the ancient Greek translation, had already read it that way (“Israel is a vine with goodly branches, her fruit is abundant”), and so do the NRSVUE (“Israel is a luxuriant vine”) and the NIV (“Israel was a spreading vine”).

      The verse goes on to speak of a multitude of fruit and a good land, so the charge is not that Israel was barren. Israel bore, and bore “unto himself” and “not unto God.” The second half of the verse says where the yield went: the more fruit, the more altars; the better the land, the finer the “images,” which the NRSVUE calls “pillars” and the NIV “sacred stones.”
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue, niv, hord-not-fragile]
  - ref: 2
    phrase: Their heart is divided
    kind: words
    title: A divided heart, or a smooth one
    body: |
      The word translated “divided” can also mean smooth, and on that reading the charge is deceit, not indecision. The lexicon takes the verb here as smooth or slippery, said of the heart of faithless Israel, and notes that the same verb is used of smooth words that deceive. The NRSVUE has “Their heart is false” and the NIV “Their heart is deceitful.” “Divided” is the reading of the Septuagint (“They have divided their hearts”) and of the King James, and the Church’s footnote on the word sends the reader to Elijah’s question on Carmel ([[1 Kgs. 18:21]]).

      Either way the sentence that follows is the same. They are now “found faulty,” which the footnote gives as “guilty,” and the one who breaks down the altars is the Lord. The Hebrew says only “he,” and the NRSVUE supplies the name: “The Lord will break down their altars.”
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue, niv, lds-scriptures]
  - ref: 4
    phrase: judgment springeth up as hemlock in the furrows of the field
    kind: symbol
    title: Justice that comes up as a poison weed
    body: |
      “Judgment” here can be read as Israel’s own justice, its lawsuits and sworn agreements, and two modern translations read it so. The first half of the verse is about false oaths sworn in making a covenant, and the second half says what grows from them. The NRSVUE translates, “so litigation springs up like poisonous weeds,” and the NIV, “therefore lawsuits spring up.”

      The plant is *rosh*, “a bitter and poisonous herb,” which the King James calls hemlock here and gall elsewhere. Amos uses the same two Hebrew words together when he says, “ye have turned judgment into gall” ([[Amos 6:12]]). A furrow is where a farmer looks for his crop. In this picture the field has been plowed and something has come up in the rows, and it is poison.
    sources: [oshb-wlc, bdb, nrsvue, niv, lds-scriptures]
  - ref: 5
    phrase: the calves of Beth-aven
    kind: history
    title: The calf goes into exile
    body: |
      The “calves of Beth-aven” are the golden calf that Jeroboam the son of Nebat set up at Bethel, and verses 5 and 6 say what will become of it. He made two, and “he set the one in Beth-el, and the other put he in Dan” ([[1 Kgs. 12:29]]); Beth-aven is a derogatory name for Bethel (the note on [[Hos. 4:15]] explains it). The Hebrew has an unexpected feminine plural, “heifers,” used only here of the calves, though the rest of the sentence speaks of “it.” The Septuagint has one calf, “the calf of the house of On.”

      The wording shows what the prophet thinks of it. Its priests are named with a word the Old Testament uses “only of idol-priests,” not the ordinary word for a priest. Its glory “is departed,” which the NIV translates “taken from them into exile,” so the idol itself goes into captivity. It goes to Assyria “for a present to king Jareb,” that is, “as tribute to the great king” (the note on [[Hos. 5:13]] explains the title, in the verse where Ephraim sent to that king to be healed). Of the calf of Samaria Hosea has already said, “the workman made it; therefore it is not God” ([[Hos. 8:6]]).

      In the King James the priests “rejoiced on it.” The NRSVUE reads “its idolatrous priests shall wail over it,” which matches the mourning of the people in the same line.
    sources: [lds-scriptures, oshb-wlc, bdb, lxx-rahlfs, niv, nrsvue]
  - ref: 7
    phrase: her king is cut off as the foam upon the water
    kind: symbol
    title: The king as a chip on the water
    body: |
      The picture is of something light on moving water, carried off without resistance, and it is a picture of Samaria’s king. The King James has “foam.” The Hebrew noun is more likely a splinter or chip, from a root meaning to “break, snap off,” and it is explained as a “simile of helpless king.” The Septuagint, which makes Samaria the one who acts, has “Samaria has cast off her king as a twig on the surface of the water,” the NRSVUE “like a chip on the face of the waters,” and the NIV a twig.

      The king is in this chapter three times. In verse 3 the people will say, “We have no king,” and add that a king could have done nothing for a people who did not fear the Lord. Here he is swept away. In verse 15 he is cut off again, with the same Hebrew verb as here, and it happens in a single morning. The chapter names no king. The book of Kings tells how the last one ended: Hoshea withheld his tribute, and the king of Assyria “shut him up, and bound him in prison” ([[2 Kgs. 17:4]]) before Samaria itself fell after its three-year siege. Later in the book the Lord says of Israel’s kings, “I gave thee a king in mine anger, and took him away in my wrath” ([[Hos. 13:11]]).
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue, niv, lds-scriptures, bd-shalmaneser]
  - ref: 8
    phrase: they shall say to the mountains, Cover us; and to the hills, Fall on us
    kind: scripture
    title: Words the Savior spoke on the way to the cross
    body: |
      The cry to the mountains and the hills is the one line of this chapter that Jesus Himself spoke, and other scripture uses it of judgments still to come. In Hosea it belongs to the fall of the northern kingdom. The shrines are destroyed, thorns and thistles grow over the altars, and the people ask the hills to bury them.

      As Jesus was led out to be crucified He turned to the women who wept for Him: “Daughters of Jerusalem, weep not for me, but weep for yourselves, and for your children” ([[Luke 23:28]]). Days were coming, He said, when people would “begin to say to the mountains, Fall on us; and to the hills, Cover us” ([[Luke 23:30]]). The two requests are in the opposite order from Hosea’s, but the words are the same. What Hosea said of Samaria the Savior says to the daughters of Jerusalem. The Joseph Smith Translation adds an explanation after the next verse: “This he spake, signifying the scattering of Israel, and the desolation of the heathen, or in other words, the Gentiles.”

      John hears the same cry at the opening of the sixth seal, when kings and bondmen alike say “to the mountains and rocks, Fall on us, and hide us from the face of him that sitteth on the throne” ([[Rev. 6:16]]). Alma uses it of the unrepentant at the judgment, who “would fain be glad if we could command the rocks and the mountains to fall upon us to hide us from his presence” ([[Alma 12:14]]). Revelation and Alma both name what the speakers want to be hidden from, and it is the face of God.
    sources: [lds-scriptures]
  - ref: 9
    phrase: thou hast sinned from the days of Gibeah
    kind: history
    title: What happened at Gibeah
    body: |
      Gibeah is the town of the crime and the war told in Judges 19–20, and Hosea says Israel has sinned ever since. Men of “Gibeah, which belongeth to Benjamin” ([[Judg. 19:14]]) abused a Levite’s concubine through the night. When the tribe of Benjamin refused to hand over the guilty men, the rest of Israel made war on it until twenty-five thousand of its fighting men had fallen and six hundred were left ([[Judg. 20:46–47]]). The note on [[Hos. 9:9]], where Hosea first names those days, tells the story.

      The rest of the verse is hard. In the King James, “there they stood” and the battle “did not overtake them” seem to say that Israel came through that war untouched. The NRSVUE and the NIV take the first clause of Israel’s persistence in the sin, “there they have continued” and “there you have remained,” and the second as a question about the present: “Shall not war overtake them in Gibeah?” Read that way, war is coming to them again, and verse 10 goes on, “the people shall be gathered against them.”
    sources: [lds-scriptures, nrsvue, niv]
  - ref: 10
    phrase: when they shall bind themselves in their two furrows
    kind: words
    title: Two furrows, or two iniquities
    body: |
      “Furrows” is the King James’s attempt at a difficult word, and the Hebrew reading tradition and the other versions have “iniquities.” At this word the Hebrew Bible records two forms: what the consonants say as written (called the *ketiv*) and what the scribes directed to be read aloud (the *qere*). The form to be read is glossed “of their transgressions.” The Septuagint has “for their two sins,” the NRSVUE “double iniquity,” and the NIV “double sin.”

      The verse does not say which two. One older proposal is “the calves in Dan and Beth-el,” and it is not the only one. The sentence around the word is clearer. The Lord Himself intends to chastise Israel, and He will do it by gathering peoples against them.
    sources: [oshb-wlc, biblehub-interlinear, lxx-rahlfs, nrsvue, niv, clarke-commentary]
  - ref: 11
    phrase: an heifer that is taught, and loveth to tread out the corn
    kind: symbol
    title: The heifer that liked threshing
    body: |
      Ephraim is pictured as a trained heifer that has had the pleasant work and is about to be given the hard work. Treading out the grain was the pleasant work: the heifer “is pleased because, not being muzzled, she eats of the corn.” That is the work Ephraim “loveth.”

      The next clause is read two ways. The NRSVUE takes it of the past, “I spared her fair neck.” The King James’s “passed over upon” has also been understood as “I brought the yoke upon it,” and the NIV translates it so, with a yoke “on her fair neck.” The versions agree about what follows. For “make Ephraim to ride” the NIV has “I will drive Ephraim” and the NRSVUE “I will make Ephraim break the ground.” The heifer is harnessed to the plow and the harrow, and one older reading names the yoke as “that of the Assyrians.” Judah, the southern kingdom, is put to the plow as well.
    sources: [bdb, clarke-commentary, niv, nrsvue]
  - ref: 12
    phrase: Sow to yourselves in righteousness, reap in mercy
    kind: words
    title: The harvest is hesed
    body: |
      This is the chapter’s one invitation, and the harvest it offers is *hesed*, the covenant love the book keeps returning to. “Mercy” translates that Hebrew word, which the NRSVUE gives as “steadfast love” and the NIV as “unfailing love”; the note on [[Hos. 2:19]] explains it. It is what the Lord found missing in the land ([[Hos. 4:1]]) and what He said He desired more than sacrifice ([[Hos. 6:6]]).

      The verse has been read as a statement of law. Mercy is granted “to those who comply with the law upon which its receipt is predicated,” so that “those who sow righteousness, reap mercy.” Hosea has already given the other half of that law, “they have sown the wind, and they shall reap the whirlwind” ([[Hos. 8:7]]), and verse 13 applies it. They plowed wickedness, reaped iniquity, and ate “the fruit of lies,” because they trusted their own way and the number of their warriors. “What one does is a result of where one puts one’s trust.”

      “Fallow ground” is ground left unplowed (“your unplowed ground,” in the NIV), so the plowing has to come before the sowing. Jeremiah later gave Judah the same command: “Break up your fallow ground, and sow not among thorns” ([[Jer. 4:3]]). In this chapter the cry “to sow righteousness in order to reap mercy” comes just before the picture of a city destroyed, as the offer that was made first.
    sources: [oshb-wlc, nrsvue, niv, ot-manual-10, hord-not-fragile, lds-scriptures]
  - ref: 12
    phrase: till he come and rain righteousness upon you
    kind: symbol
    title: Until He comes and rains righteousness
    body: |
      The verse ends with the Lord coming as rain, and what He rains is righteousness, the same thing Israel was told to sow. A farmer plows and sows, and then waits for rain he cannot make. So the command does not leave Israel to produce righteousness by itself. One reading puts it this way: “God causes righteousness to rain, inasmuch as He not only gives strength to secure it, like rain for the growth of the seed,” but must also create it in a person by His Spirit. Israel’s part is to seek the Lord “till he come.”

      The Hebrew verb is from the root of the “former rain” in [[Hos. 6:3]], where the people said, “he shall come unto us as the rain.” Those are the only two places in the book where the root is found. The same verb can also mean to teach, and the Septuagint has no rain in the line at all (“seek the Lord till the fruits of righteousness come upon you”), but the lexicon reads “rain righteousness for you” here, and the NRSVUE translates “that he may come and rain righteousness upon you.”
    sources: [oshb-wlc, bdb, keil-hosea, lxx-rahlfs, nrsvue, lds-scriptures]
  - ref: 14
    phrase: as Shalman spoiled Beth-arbel in the day of battle
    kind: history
    title: Shalman and Beth-arbel are not known
    body: |
      Neither the man nor the battle can be identified with confidence. One guess is that Shalman is Shalmaneser, the Assyrian king of [[2 Kgs. 17:3]], which is where the Church’s footnote points, and that Beth-arbel is a city called Arbela: “Shalman may be Shalmaneser and Beth-arbel may be the Armenian city Arbela.” That guess has been set beside another, Gideon’s victory over the Midianite Zalmunna, with the verdict, “I think the history to which this refers is unknown.” The lexicon counts the name doubtful. It records a Moabite prince “Salamanu” in Assyrian records as another candidate, and it places Beth-arbel not in Armenia but “perhaps” east of the Jordan, or else “in Galilee.” The Septuagint’s translators read different names altogether: “as a prince Solomon departed out of the house of Jeroboam.”

      Whatever the event was, the verse suggests that it was “distinguished by some remarkable ferocities,” and Hosea uses it as the measure of what is coming on all Israel’s fortresses.
    sources: [ot-manual-10, clarke-commentary, bdb, lxx-rahlfs, lds-scriptures]
  - ref: 14
    phrase: the mother was dashed in pieces upon her children
    kind: history
    title: The mother and her children
    body: |
      The last clause describes the killing of mothers together with their children when a town was taken, and Hosea says this is what is coming on Israel. Assyria’s armies were “savage and brutal,” and an Israelite king, Menahem, did not spare the pregnant women of a town that would not open its gates to him ([[2 Kgs. 15:16]]). Verse 13 gives the reason in terms of trust. Israel relied on “the multitude of thy mighty men,” and “therefore” it is the army and the fortresses that fail, and the people they were meant to protect who suffer.

      Hosea says the same of Samaria at [[Hos. 13:16]]. Such images “are not justifications of violence against women.” They describe what the cities “will face if they continue on their current trajectory.” And in this book they stand beside “depictions of God’s love and faithfulness to his people”: the sentence of verse 14 comes two verses after the invitation of verse 12.
    sources: [ot-manual-kings-d, hord-not-fragile, lds-scriptures]

christ: |
  Verse 8 is the line of this chapter that Jesus took up Himself, as He was led out to be crucified (the note on [[Hos. 10:8]] gives the passage). He followed it with a saying of His own: “For if they do these things in a green tree, what shall be done in the dry?” ([[Luke 23:31]]). The green tree “represents the time of Jesus Christ’s mortal ministry,” and the dry tree is the time after He was gone. In John’s vision those who call on the mountains and rocks ask to be hidden “from the wrath of the Lamb” ([[Rev. 6:16]]).

explore: |
  - **The Savior’s use of verse 8.** [[Luke 23:27–31]]; [[Rev. 6:12–17]]; [[Alma 12:14]].
  - **Sowing and reaping.** [[Hos. 8:7]]; [[Gal. 6:7–8]]; [[D&C 6:33]].
  - **Fallow ground.** [[Jer. 4:3–4]].
  - **Israel as the Lord’s vine.** [[Isa. 5:1–7]]; [[Ps. 80:8–16]]; and Jacob 5, which the Church’s footnote on “fruit” in verse 1 points to.
  - **The heifer and the yoke.** [[Hos. 4:16]]; [[Hos. 11:1–4]].
  - **The days of Gibeah.** [[Judg. 19:1–30]]; [[Judg. 20:1–48]]; [[Hos. 9:9]].
  - **The fruit at the end of the book.** [[Hos. 14:4–8]].

parallels:
  - ref: Luke 23:30
    note: On the way to the cross the Savior speaks the words of verse 8 to the daughters of Jerusalem.
  - ref: Rev. 6:16
    note: At the sixth seal the same cry is made by those who would hide from the wrath of the Lamb.
  - ref: Jer. 4:3
    note: Jeremiah gives Judah the command of verse 12, “Break up your fallow ground.”

