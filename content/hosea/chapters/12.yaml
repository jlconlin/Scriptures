chapter: 12
title: Jacob’s Children and Jacob’s Way
tagline: The Lord sets the patriarch beside the nation that carries his names. Jacob strove, wept, and found God at Bethel; Ephraim trades with false scales and counts its wealth as innocence. Between the two stands the appeal to turn, keep mercy, and wait.
when: 'Undated; the northern kingdom’s last decades, in the 700s B.C.'

setting: |
  Chapter 12 belongs to the book’s last division, where the Lord asks, “How shall I give thee up, Ephraim?” ([[Hos. 11:8]]). It carries no date. Hosea prophesied in the northern kingdom in the latter half of the 700s B.C., when Assyria was close to conquering it. The Hebrew Bible begins this chapter one verse earlier, at “Ephraim compasseth me about with lies” ([[Hos. 11:12]]), so commentaries that follow the Hebrew give each verse of this chapter a number one higher.

  The chapter is addressed to Ephraim, the northern kingdom (see the note on [[Hos. 4:17]]), with a word for Judah in verse 2. Its one piece of politics is in verse 1: a treaty with Assyria while oil goes to Egypt. The book has charged this before ([[Hos. 5:13]]; [[Hos. 7:11]]).

  What sets the chapter apart is that it retells Genesis. In a few lines it gives the birth of Jacob ([[Gen. 25:26]]), the wrestle at Peniel ([[Gen. 32:24–30]]), the meeting at Bethel ([[Gen. 28:10–19]]; [[Gen. 35:9–15]]), and the flight to Laban and the years of service for a wife ([[Gen. 28:5]]; [[Gen. 29:20]]), and then passes to Moses and the Exodus. The chapters of Genesis on this site tell those stories; here they are used as evidence in the Lord’s case against Jacob’s descendants.

thread: |
  The chapter argues from a name. The people are called “Jacob” in verse 2, and the Lord at once tells Jacob’s story: he took hold in the womb, strove with God as a man, wept and pleaded, and found God at Bethel. Verse 6 draws the conclusion for his children: turn to your God, keep mercy and justice, wait.

  Then the nation is shown as it is. Its name in verse 7 is not Jacob but, in Hebrew, Canaan: a trader with rigged scales, who says that he has found wealth and that no one will find guilt in him. The Lord answers with His own name and history. He has been their God since Egypt, He can put them back in tents, and He has never stopped speaking through prophets, by word, vision, and similitude. The altars of Gilead and Gilgal are likened to heaps of stones.

  The close goes back to Jacob once more, this time to the fugitive who herded sheep for a wife, and sets beside him the nation that the Lord brought out of Egypt and kept by a prophet. Ephraim has answered that care with provocation. One Hebrew verb frames the whole: the Lord will “recompense” (verse 2), Israel is asked to “turn” (verse 6), and Ephraim’s reproach will “return” upon him (verse 14).

sections:
  - range: 1-2
    heading: Herding the wind
    plain: |
      Ephraim tends the wind and chases the east wind all day long, piling up lies and violence. They make a treaty with Assyria, and at the same time oil is carried to Egypt. The Lord has a case against Judah as well, and He will punish Jacob according to his ways and repay him according to his deeds.
  - range: 3-6
    heading: Jacob at the heel, at Peniel, at Bethel
    plain: |
      In the womb he took his brother by the heel, and as a grown man he strove with God. He strove with the angel and prevailed; he wept and sought his favor. He found Him at Bethel, and there He spoke with us: the LORD, the God of hosts, the LORD is the name by which He is remembered. So you, turn to your God. Keep mercy and justice, and wait for your God always.
  - range: 7-11
    heading: The merchant, and the Lord’s answer
    plain: |
      A merchant holds false balances in his hand and loves to oppress. Ephraim says, “I have grown rich; I have found wealth for myself; in all that I have gained no one will find in me any guilt that would be sin.” But I am the LORD your God ever since the land of Egypt, and I will make you live in tents again, as in the days of the appointed feast. I have spoken to the prophets, I have multiplied visions, and through the prophets I have given similitudes. Is there iniquity in Gilead? Surely they come to nothing. In Gilgal they sacrifice bulls, and their altars are like heaps of stones along the furrows of a field.
  - range: 12-14
    heading: Kept by a prophet
    plain: |
      Jacob fled to the land of Aram; Israel served to get a wife, and for a wife he kept sheep. By a prophet the LORD brought Israel up out of Egypt, and by a prophet Israel was kept. Ephraim has provoked Him bitterly. So his Lord will leave his bloodguilt upon him and turn his reproach back on him.

notes:
  - ref: 1
    phrase: Ephraim feedeth on wind, and followeth after the east wind
    kind: symbol
    title: Feeding on wind, chasing the east wind
    body: |
      Ephraim feeding on wind is a picture of a man living on air, and the verse sets beside it a treaty with Assyria and oil carried to Egypt. The Hebrew participle is the shepherd’s word, used literally for one who will “pasture, tend” a flock, so one modern translation has “Ephraim herds the wind.” The King James sense has a parallel in Isaiah’s idolater: “He feedeth on ashes” ([[Isa. 44:20]]). Either way, Ephraim is living on “that which has not truth or substance.”

      The second wind is worse than empty. The east wind of that country blows off the desert, “violent and scorching,” and at the end of the book it comes for Ephraim: “an east wind shall come, the wind of the LORD shall come up from the wilderness” ([[Hos. 13:15]]).

      The two alliances are the substance of the charge. Sending oil to Egypt “represents the attempt to get protection through tribute from an alliance with Egypt,” and it is done while a covenant with Assyria stands. The verse is undated and names no king.
    sources: [bdb, nrsvue, ot-manual-10]

  - ref: 3
    phrase: He took his brother by the heel in the womb
    kind: words
    title: The verbs behind Jacob’s two names
    body: |
      The two halves of verse 3 use the verbs behind the patriarch’s two names, Jacob and Israel, and readers differ on whether the first half blames him or commends him. “Took by the heel” is the verb *aqab*, made from the word for heel, and it is the sound of the name Jacob: at his birth “his hand took hold on Esau’s heel; and his name was called Jacob” ([[Gen. 25:26]]). “Had power with God” is the verb *sarah*, to “persist, exert oneself, persevere,” which is the verb in the explanation of the name Israel: “as a prince hast thou power with God and with men, and hast prevailed” ([[Gen. 32:28]]). Hosea’s line can be rendered “he persevered with God,” and in his telling of the story, as in Genesis, struggle is the sense that fits. “By his strength” is “manly vigour,” that is, as a grown man, set against “in the womb.” The note on [[Gen. 32:28]] gives the meanings of the name.

      The question is how to hear the grasping. The same verb can mean to cheat. Esau used it bitterly, “Is not he rightly named Jacob? for he hath supplanted me these two times” ([[Gen. 27:36]]), and Hosea’s line has been rendered “he attacked his brother at the heel.” Coming straight after “will punish Jacob according to his ways” (verse 2), it can be heard as the first count in an indictment. One modern translation prints it so, “In the womb he tried to supplant his brother,” under the heading “The Long History of Rebellion.”

      The other reading notes that the grasping is paired with the wrestle and concludes that his conduct “is not held up before the people for a warning” but “is set before them for their imitation,” as a reaching after the birthright and its blessing. However verse 3 is heard, verse 4 turns the struggle into weeping and prayer, and verse 6 gives the conclusion the hearers are to draw: “turn thou to thy God.”
    sources: [oshb-wlc, bdb, bowen-wrestled-man, nrsvue, keil-hosea, lds-scriptures]

  - ref: 4
    phrase: 'he had power over the angel, and prevailed: he wept, and made supplication unto him'
    kind: scripture
    title: The wrestle at Peniel, with weeping added
    body: |
      Hosea tells the night at Peniel in one line and adds what Genesis does not record: Jacob wept and pleaded. Genesis has the hold and the words, “I will not let thee go, except thou bless me” ([[Gen. 32:26]]). Hosea names the tears and calls the asking “supplication”; a modern translation has “he wept and sought his favor.” The one who “prevailed” in this verse is the one weeping and asking. The note on [[Gen. 32:26]] takes up the wrestle as prayer.

      He also names the wrestler differently. Genesis says “there wrestled a man with him” ([[Gen. 32:24]]). Hosea says “the angel,” and then, with no change of person marked, “the LORD God of hosts” (verse 5). Hosea’s “angel” has been classed as “the theophanic angel,” the angel in whom God appears, together with the “Angel which redeemed me” of [[Gen. 48:16]]. Faithful readers have identified the wrestler in more than one way, and the note on [[Gen. 32:24]] sets the readings out; this chapter does not settle the matter. What Hosea contributes is his own wording, which moves from “the angel” to the divine name.
    sources: [lds-scriptures, nrsvue, bdb]

  - ref: 4
    phrase: he found him in Beth-el, and there he spake with us
    kind: history
    title: Bethel, and who was spoken to there
    body: |
      Bethel is where God met Jacob, and Hosea’s hearers knew it as the place of a golden calf. Genesis tells two meetings there. The first is the dream of the ladder as Jacob fled ([[Gen. 28:10–19]]), to which the Church edition’s footnote points. The second came after the wrestle, on his return, when God repeated the name Israel and the promises, “And Jacob called the name of the place where God spake with him, Beth-el” ([[Gen. 35:15]]). One reading takes the finding at Bethel as the fruit of the wrestle and so holds that Hosea means the second: this “does not refer to the appearance of God to Jacob on his flight” but to the time “when God confirmed his name of Israel, and renewed the promises of His blessing.”

      “Us” is what the Hebrew has. The footnote offers “OR him,” and translations divide: one prints “there he spoke with him” and notes that the Hebrew reads “us,” while another keeps “there God spoke with us.” If “us” stands, the prophet counts himself and his hearers among those addressed, on the ground that “what He there said to Jacob applies to us.”

      Bethel was in the northern kingdom, and Jeroboam the son of Nebat had set one of his calves there ([[1 Kgs. 12:28–29]]). Hosea elsewhere calls the town Beth-aven (see the note on [[Hos. 4:15]]). Here he uses the old name.
    sources: [lds-scriptures, keil-hosea, oshb-wlc, nrsvue, esv]

  - ref: 5
    phrase: the LORD is his memorial
    kind: words
    title: The name by which He is remembered
    body: |
      “Memorial” here means the name by which God is called to mind, and the line borrows it from the burning bush. There the Lord gave Moses His name and said, “this is my name for ever, and this is my memorial unto all generations” ([[Ex. 3:15]]). Hosea’s word is the same Hebrew noun, *zeker*, “remembrance, memorial,” and modern translations render the line “the Lord is his name” or “the Lord is his memorial name.”

      The verse is there to say who it was that Jacob found. Bethel in Hosea’s day housed a calf (see the note on verse 4); the One who spoke there to Jacob was the LORD, the God of hosts, known by the name given to Moses. The name comes twice more in the chapter. The Lord’s reply to Ephraim begins, “I that am the LORD thy God from the land of Egypt” (verse 9), and the chapter’s last look at history is “by a prophet the LORD brought Israel out of Egypt” (verse 13).
    sources: [lds-scriptures, bdb, oshb-wlc, nrsvue, esv]

  - ref: 6
    phrase: 'turn thou to thy God: keep mercy and judgment, and wait on thy God continually'
    kind: words
    title: Turn, keep, and wait
    body: |
      Verse 6 applies Jacob’s story to his children, and it asks three things of them: to turn, to keep, and to wait. The Hebrew begins with the pronoun “you,” which modern translations bring out: “But as for you, return to your God.” Where the King James has “to thy God,” one translation has “by the help of your God, return.” The same verb opens the book’s last appeal: “O Israel, return unto the LORD thy God” ([[Hos. 14:1]]).

      “Mercy” is *hesed* (see the note on [[Hos. 2:19]]), and “judgment” is justice. To “keep” them is to “observe = follow dictates of” kindness and justice. The verb is *shamar*, and the chapter uses it twice more at its end (see the note on verse 12).

      “Wait” stands against verse 1, where Ephraim “followeth after” the wind. The Church edition’s chapter heading names this as the chapter’s failure: the people “become rich and will not wait on the Lord.”
    sources: [oshb-wlc, bdb, nrsvue, esv, lds-scriptures]

  - ref: 7
    phrase: He is a merchant
    kind: words
    title: The merchant’s name is Canaan
    body: |
      In Hebrew this verse begins with a single word, *Kena’an*, Canaan; “he is a merchant” is the translators’ explanation of it. The word had come to mean a trader, “because Canaanites, especially Phoenicians, were traders,” and the King James chose that sense. But the word is first a proper name, and in this verse Canaan “is personified” as “apostate Israel.” The ancient Greek translation, the Septuagint, keeps the name: “As for Chanaan, in his hand is a balance of unrighteousness.”

      So the nation is called by the name of the land’s earlier people, and the name is also the ordinary word for a dealer, which the rest of the verse takes up.

      The charge is a concrete one. “Balances of deceit” are rigged scales, which the law forbade, “Thou shalt not have in thy bag divers weights, a great and a small” ([[Deut. 25:13]]), and which Amos describes in use: “making the ephah small, and the shekel great, and falsifying the balances by deceit” ([[Amos 8:5]]). “To oppress” is to “defraud” in one modern rendering. Verse 6 asked for mercy and justice; verse 7 shows what was in Ephraim’s hand.
    sources: [oshb-wlc, bdb, lxx-rahlfs, niv, lds-scriptures]

  - ref: 8
    phrase: I am become rich, I have found me out substance
    kind: words
    title: What Ephraim found
    body: |
      Ephraim’s boast uses two words that the verses about Jacob have just used, each with a different object. “Substance” is the Hebrew noun *on*, the same word as Jacob’s “strength” in verse 3; it has both senses, “manly vigour” there and “wealth” here. “Found” is the verb of verse 4. Jacob “found him in Beth-el”; Ephraim says, “I have found me out substance.”

      Ephraim is also sure of what will not be found. In a modern translation the second half says that in all his gain “no offense has been found in me” that would be sin: prosperity is offered as the proof of innocence. The Septuagint heard the second half as the verdict on the boast and not part of it: “None of his labours shall be found available to him, by reason of the sins which he has committed.”

      On either reading the Lord’s reply comes in the next verse: “I that am the LORD thy God from the land of Egypt.”
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs]

  - ref: 9
    phrase: will yet make thee to dwell in tabernacles, as in the days of the solemn feast
    kind: symbol
    title: Back to the tents
    body: |
      The Lord answers the boast of wealth with tents: a threat, and on one reading a mercy within it. “Tabernacles” here are ordinary tents (the footnote has “OR tents”), and “the solemn feast” is in Hebrew an appointed “sacred season.” The season with tents in it was the Feast of Tabernacles, whose “characteristic rite” was “the dwelling in booths made of the boughs of trees.” The law gave the reason: “That your generations may know that I made the children of Israel to dwell in booths, when I brought them out of the land of Egypt” ([[Lev. 23:43]]). For one week a year a settled people camped out in order to remember the wilderness.

      Now the week is to become their way of life: “I will make you live in tents again.” The nation that says “I am become rich” is to live in tents. That is the threat.

      The mercy lies in what the feast remembered. On one reading the booths were meant “not so much to remind the people of the privations” of the desert “as to call to their remembrance the shielding and sheltering care and protection of God,” so that Israel is “not threatened with utter rejection on the part of God, but only with temporary banishment.” The wilderness has carried both meanings earlier in the book (see the note on [[Hos. 2:14]]).
    sources: [lds-scriptures, bdb, bd-feasts, nrsvue, keil-hosea]

  - ref: 10
    phrase: used similitudes
    kind: words
    title: Similitudes by the hand of the prophets
    body: |
      A similitude is a likeness, and the verse says the Lord has taught Israel by likenesses as well as by plain speech and by visions. The Hebrew verb is *damah*, “liken, compare,” used here by itself for to “use comparisons or similitudes (parables, symbols, etc.)”; one modern translation has “told parables.” “By the ministry of” is literally *by the hand of*.

      Hosea’s own book is the nearest example. In its opening chapters “Hosea and his wife represented Jehovah and unfaithful Israel respectively.” The oracles after them are built of pictures: “Each chapter contains at least one metaphor,” and all of them “need to be seen against the background of Israel’s history and tradition to be understood.”

      The Church edition’s chapter heading follows the King James and reads the verse of the Lord guiding His people by prophets, visions, and similitudes. One modern translation renders the last clause as a threat, “through the prophets I will bring destruction.”
    sources: [oshb-wlc, bdb, niv, nrsvue, parry-symbolic-action, ot-manual-10, lds-scriptures]

  - ref: 11
    phrase: their altars are as heaps in the furrows of the fields
    kind: words
    title: Gilead, Gilgal, and heaps of stones
    body: |
      Two places are named, one on each side of the Jordan, and the verse ends by likening their altars to rubble in a field. Gilead, the hill country “east of Jordan,” was “a city of them that work iniquity” in [[Hos. 6:8]]. Here the Hebrew calls it outright *aven*, a word that in this verse means “idolatry,” and it is the word inside Hosea’s name Beth-aven. Gilgal, “near Jericho,” was the first camp in the promised land and had become a place of false worship (see the note on [[Hos. 4:15]]); the book says later, “All their wickedness is in Gilgal” ([[Hos. 9:15]]).

      “Heaps” is *gallim*, the plural of the word for a “heap of stones,” and its sound is close to both names, Gilgal and Gilead.

      In one modern translation the opening question becomes a statement, “In Gilead there is iniquity” and “they shall surely come to nothing,” and the present tense becomes a sentence still to come: “so their altars shall be like stone heaps” on the furrows of the field.
    sources: [oshb-wlc, bdb, bd-gilgal, nrsvue, lds-scriptures]

  - ref: 12
    phrase: for a wife he kept sheep
    kind: structure
    title: Jacob kept sheep, and Israel was kept
    body: |
      Verses 12 and 13 are built as a pair and joined by one verb: Jacob “kept” sheep, and by a prophet Israel was “preserved,” which in Hebrew is *was kept*. The first is to “tend flock” and the second to “be kept, guarded,” and the word in verse 12 may have been “chosen for parallelism” with the one in verse 13. A modern translation shows it: “for a wife he guarded sheep,” and “by a prophet he was guarded.”

      One reading explains the pairing as a contrast between a low beginning and the Lord’s care. Jacob’s years in Aram are recalled as hardship. He was a fugitive and a hired man, and herding was “one of the hardest and lowest descriptions of servitude”; Jacob himself said of it, “in the day the drought consumed me, and the frost by night” ([[Gen. 31:40]]). Against that, “the guarding of cattle by Jacob is placed in contrast with the guarding of Israel on the part of God through the prophet Moses.” The purpose is to recall “that elevation from the lowest condition” which Israel confessed every year with the firstfruits: “A Syrian ready to perish was my father” ([[Deut. 26:5]]).

      The prophet is Moses, of whom it was written, “there arose not a prophet since in Israel like unto Moses” ([[Deut. 34:10]]). “By a prophet” is said twice, and verse 10 has just said that the Lord still speaks by the prophets. The verb, too, has been heard before in the chapter: it is the “keep” of verse 6, “keep mercy and judgment.”
    sources: [oshb-wlc, bdb, nrsvue, keil-hosea, lds-scriptures]

  - ref: 14
    phrase: his reproach shall his Lord return unto him
    kind: structure
    title: The chapter ends on the verb it began with
    body: |
      The last clause repeats the verb of the Lord’s sentence in verse 2, which is also the verb of the chapter’s central appeal. Verse 2 said, “according to his doings will he recompense him”; verse 14 says, “his reproach shall his Lord return unto him.” “Recompense” and “return” are the same Hebrew word in the same form, *yashiv*, and it is the verb of verse 6, “turn thou to thy God.” The verb of the appeal is also the verb of the sentence.

      “Leave his blood upon him” means that his guilt stays on him: the footnote has “IE guilt,” and a modern translation, “will leave on him the guilt of his bloodshed.” And “his Lord” is not the divine name here. It is a title, the Hebrew word rendered “Lord” where the name itself is not written, and it is used only this once in the chapter; the Church edition prints it without the small capitals of “LORD.”
    sources: [oshb-wlc, niv, lds-scriptures]

christ: |
  The God whom Jacob found at Bethel and the God who speaks in verse 9 have one name, “the LORD,” and Latter-day Saints understand that name of the Savior, the premortal Jesus Christ. Nephi says that it is “the God of our fathers, who were led out of Egypt, out of bondage, and also were preserved in the wilderness by him” who “yieldeth himself” ([[1 Ne. 19:10]]) to be lifted up. In the next chapter of Hosea the same LORD says, “there is no saviour beside me” ([[Hos. 13:4]]).

  Genesis leaves the wrestler at Peniel unnamed, and the note on verse 4 does not go past what the text says. It is to the LORD God of hosts, who spoke at Bethel, that verse 6 calls Jacob’s children to turn.

explore: |
  - **Jacob’s story where Genesis tells it.** [[Gen. 25:21–26]], [[Gen. 28:10–22]], [[Gen. 32:24–30]], and [[Gen. 35:9–15]], read beside verses 3–5 and 12.
  - **Assyria and Egypt together.** [[2 Kgs. 17:3–4]], where King Hoshea pays tribute to Assyria and then sends messengers to Egypt; an older commentary places verse 1 in his reign.
  - **False balances.** [[Amos 8:4–6]] and [[Micah 6:10–11]], with [[Prov. 11:1]].
  - **The feast of tents.** [[Lev. 23:39–43]] and [[Neh. 8:14–17]].
  - **Prophets who acted their message.** The essay “Symbolic Action as Prophecy in the Old Testament” (in *Sperry Symposium Classics: The Old Testament*) gathers the prophets’ acted similitudes, Hosea’s among them.
  - **The prophet by whom Israel was kept.** [[Deut. 18:15–18]] and [[1 Ne. 17:23–30]].

