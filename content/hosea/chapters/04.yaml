chapter: 4
title: 'The Lord’s Controversy'
tagline: 'The household story is over and a courtroom opens. The Lord charges Israel with having no truth, no mercy, and no knowledge of God, and He lays the last of these at the door of the priests.'
when: 'Undated; the northern kingdom’s last decades, in the 700s B.C.'

setting: |
  With chapter 4 the book changes form. Chapters 1–3 are narrative, the story of the prophet’s household; chapters 4–14 are oracles, spoken messages with no story around them and no dates. Hosea’s own marriage is not mentioned again, though marriage “remains the image” through which the message is given: unfaithfulness to the Lord is still called whoredom.

  The hearers are the “children of Israel” of the northern kingdom, which the chapter also calls Ephraim. Hosea prophesied there in the days of Jeroboam Ⅱ, when the kingdom took its prosperity for a sign of God’s favor and was “sliding rapidly toward her destruction” by Assyria. He and Amos “denounced the idolatry, licentiousness, and oppression that prevailed throughout the kingdom.”

  Two things from the kingdom’s first days stand behind the chapter. Its first king, Jeroboam the son of Nebat (a different king from Jeroboam Ⅱ), set up golden calves at Bethel and Dan, and he “made priests of the lowest of the people, which were not of the sons of Levi” ([[1 Kgs. 12:31]]). The shrine at Bethel, which verse 15 calls Beth-aven, began there.

  No king or year can be attached to the chapter. It opens the long middle of the book, and it sets out the charge that the later chapters go on to argue.

thread: |
  The chapter is a case at law, and its key word is *knowledge*.

  It opens like a court, with a summons, a charge, and a sentence. The charge has three counts. There is no truth, no mercy, and no knowledge of God in the land. Verse 2 shows what a people looks like when those are gone, in a list of things the Ten Commandments forbid.

  Then the Lord narrows the case. No one else is to do the accusing, and by verse 6 the one addressed is a priest. “My people are destroyed for lack of knowledge,” and the knowledge was the priests’ to give. They rejected it; they are rejected. They forgot the law; their children are forgotten. Worse, they have come to live off the people’s sins.

  The middle of the chapter shows where the people go for counsel instead: to a piece of wood, a diviner’s rod, hilltop shrines under shady trees. The scene closes, “the people that doth not understand shall fall.”

  The last verses turn aside to warn Judah away from the northern shrines and then pass sentence. Israel has been a stubborn heifer. Ephraim is bound to its idols, and the Lord says to leave him to them. A wind has already caught the nation up.

sections:
  - range: 1-3
    heading: 'The charge'
    plain: |
      Hear the word of the LORD, children of Israel. The LORD has a case against the people who live in this land: there is no truth in it, no mercy, and no knowledge of God. There is cursing, lying, murder, theft, and adultery. They break all bounds, and bloodshed follows bloodshed. So the land mourns and everything living in it wastes away: the wild animals, the birds of the sky, and even the fish of the sea are taken away.
  - range: 4-10
    heading: 'The priests who rejected knowledge'
    plain: |
      But let no one bring a charge or rebuke another; your people are like those who contend with the priest. You will stumble by day, and the prophet will stumble with you by night, and I will destroy your mother. My people are destroyed for lack of knowledge. Because you have rejected knowledge, I reject you from being a priest to Me. Because you have forgotten the law of your God, I will forget your children.

      The more they multiplied, the more they sinned against Me, and I will turn their glory into shame. They feed on the sin of My people and set their hearts on its iniquity. So it will be the same for people and priest: I will punish them for their ways and pay them back for what they have done. They will eat and not be filled; they will give themselves to whoredom and not increase, because they have stopped paying heed to the LORD.
  - range: 11-14
    heading: 'Where the people go instead'
    plain: |
      Whoredom, wine, and new wine take away the understanding. My people ask a piece of wood for counsel, and their rod gives them answers. A spirit of whoredom has led them astray, and they have left their God to be unfaithful. They sacrifice on the mountaintops and burn incense on the hills, under oak and poplar and terebinth, because the shade is pleasant.

      So your daughters turn to whoredom and your brides to adultery. I will not punish your daughters for it, or your brides, because the men themselves go off with prostitutes and sacrifice with harlots. A people without understanding will come to ruin.
  - range: 15-19
    heading: 'A warning to Judah, and Ephraim left alone'
    plain: |
      Though you, Israel, are unfaithful, do not let Judah become guilty. Do not go to Gilgal. Do not go up to Beth-aven. Do not swear, “As the LORD lives.” Israel has been stubborn like a stubborn heifer; now the LORD will pasture them like a lamb in a wide open place.

      Ephraim is bound to idols. Leave him alone. Their drink is gone sour; they give themselves to whoredom continually; her rulers dearly love shame. A wind has wrapped her in its wings, and they will be ashamed because of their sacrifices.

notes:
  - ref: 1
    phrase: 'the LORD hath a controversy with the inhabitants of the land'
    kind: words
    title: 'A controversy is a lawsuit'
    body: |
      “Controversy” translates the Hebrew *rib*, a courtroom word: a “dispute, controversy, case at law.” The Lord is not debating Israel. He is the injured party bringing a charge, and here He “brings legal proceedings against her for breach of covenant.”

      The form was a known one among the prophets, and it has been called a “prophetic lawsuit.” These three verses are regularly identified as an example of it, with the opening of Isaiah and the Lord’s case in Micah: “the LORD hath a controversy with his people, and he will plead with Israel” ([[Micah 6:2]]).

      The verses have the parts of a trial. The summons is “Hear the word of the LORD.” The charge is verses 1 and 2. The sentence comes with the “Therefore” of verse 3. The noun *rib* returns only once in the book, when the case is taken up against Judah too ([[Hosea 12:2]]).
    sources: [bdb, jackson-hosea-marriage, sc-knowhy-179, oshb-wlc, lds-scriptures]

  - ref: 1
    phrase: 'no truth, nor mercy, nor knowledge of God'
    kind: words
    title: 'The three things missing'
    body: |
      The charge names three things absent from the land, and each is a covenant word with more in it than the English shows.

      “Truth” is *emet*, which is truthfulness and also “honesty, integrity, stability, and permanence”: being someone whose word holds. “Mercy” is *hesed*, the loyal love of a covenant, “loving–kindness or unfailing love” that shows itself in what a person does. It is in the book six times, first in the betrothal promise; the note on [[Hosea 2:19]] says more of it.

      “Knowledge of God” is the one the chapter goes on to press (verse 6). The Hebrew *da’at* is not information about God. Here it has its “highest sense, knowledge of God (including obedience),” and it is tied to the way scripture uses “know” for the closeness of husband and wife: in Hosea it stands for “the exclusive intimacy of the covenant bond.” To know the Lord is to live in the relationship, and Israel has stopped.

      The three belong together. “When they are present, the covenant faith is intact. When they are gone, the covenant faith is lost.”
    sources: [jackson-hosea-marriage, bdb, oshb-wlc, lds-scriptures]

  - ref: 2
    phrase: 'swearing, and lying, and killing, and stealing, and committing adultery'
    kind: scripture
    title: 'The commandments, broken one after another'
    body: |
      Verse 2 is the evidence for verse 1, and it is drawn from the Ten Commandments: “All five of these are prohibited in the Ten Commandments.” For three of them the match is exact. The Hebrew verbs for killing, stealing, and committing adultery are the verbs of “Thou shalt not kill. Thou shalt not commit adultery. Thou shalt not steal” ([[Ex. 20:13–15]]).

      “Swearing” here is not coarse language. The verb means to utter a curse, “to pronounce a curse on” someone.

      The order of the two verses is the argument. When truth, loyal love, and the knowledge of God are gone from the covenant, these are the things that “come to the fore.”
    sources: [jackson-hosea-marriage, oshb-wlc, niv, lds-scriptures]

  - ref: 3
    phrase: 'Therefore shall the land mourn'
    kind: scripture
    title: 'Why the land suffers for the people'
    body: |
      The land mourns because the covenant tied its fruitfulness to Israel’s faithfulness. The terms were written in Leviticus 26 and Deuteronomy 28, where the bounty of the land rises and falls with the righteousness of the people. If Israel would not hearken, “your land shall not yield her increase, neither shall the trees of the land yield their fruits” ([[Lev. 26:20]]).

      So the sentence falls first on the ground and on everything that lives from it. Beasts, birds, and fish go together; the fish “shall be taken away,” a verb that means to “be taken away, removed, perish.” The line can also be rendered “the land dries up.”
    sources: [ot-manual-10, lds-scriptures, bdb, niv]

  - ref: 4
    phrase: 'for thy people are as they that strive with the priest'
    kind: words
    title: 'Who is on trial in verses 4–6'
    body: |
      Verse 4 either compares the people to those who defy a priest or addresses the priest directly; the Hebrew is hard, and both readings end with the priests in the dock.

      As the King James has it, the people are compared to “they that strive with the priest.” The comparison may look to the law that made defiance of the priest’s ruling a capital matter: “the man that will do presumptuously, and will not hearken unto the priest that standeth to minister there before the LORD thy God, or unto the judge, even that man shall die” ([[Deut. 17:12]]). On this reading the people are compared to those whom the law condemned for defying their judges.

      The line can also be read as an address: “for with you is my contention, O priest.” The meaning of the Hebrew is uncertain, and the King James sense remains possible. On this reading the Lord silences every other accuser because the case is His, and it is against the priest.

      Either way the next words are spoken to a single “thou,” who by verse 6 is told he will be “no priest to me,” and a prophet is to fall “with thee.” “Thy mother” in verse 5 is Israel itself under the figure of a mother (compare [[Hosea 2:2]]); the verb “destroy” is to “cut off, destroy,” and the same verb opens verse 6: “My people are destroyed.”
    sources: [esv, nrsvue, bdb, oshb-wlc, lds-scriptures]

  - ref: 6
    phrase: 'My people are destroyed for lack of knowledge'
    kind: scripture
    title: 'Said to the priests'
    body: |
      “My people are destroyed for lack of knowledge” is a charge against the priests, though it is easily read alone as a warning against ignorance in general. The knowledge is the knowledge of God named in verse 1 (the Hebrew noun has the article, *the* knowledge).

      The rest of the verse is spoken to “thou”: “because thou hast rejected knowledge, I will also reject thee, that thou shalt be no priest to me.” Teaching was the priest’s work. Of Levi, Moses said, “They shall teach Jacob thy judgments, and Israel thy law” ([[Deut. 33:10]]), and a later prophet put it as a rule: “the priest’s lips should keep knowledge, and they should seek the law at his mouth” ([[Mal. 2:7]]). The people perish for want of what their teachers refused to carry. The book holds Israel’s leaders responsible in this way more than once; they are “frequently castigated for not instilling in the people a knowledge of God and his laws.”

      The penalty mirrors the offense, and the Hebrew repeats the verbs to show it. Thou hast *rejected*; I will *reject*. Thou hast *forgotten*; I will *forget*.

      Another reading takes “thou” as the whole nation, which had been called “a kingdom of priests” ([[Ex. 19:6]]) and would now lose “the privilege of being a priestly nation.”
    sources: [lds-scriptures, oshb-wlc, hord-not-fragile, keil-hosea]

  - ref: 8
    phrase: 'They eat up the sin of my people'
    kind: words
    title: 'Priests who live off sin'
    body: |
      The priests are charged with profiting from the sins they were meant to cure. How they “eat” sin is read in two ways, and the two agree on the charge.

      The Hebrew word for “sin” here, *chattat*, is also the word for the “sin offering.” The priest who offered a sin offering was to eat of it: “The priest that offereth it for sin shall eat it” ([[Lev. 6:26]]). On this reading the verse plays on the word’s two senses. More sin meant more offerings, and more offerings meant more meat, so the priests “wished the sins of the people to be increased, in order that they might receive a good supply of sacrificial meat to eat.”

      The sin offering may not be meant, since the term is not used that way elsewhere in the early prophets. The phrase is then more general: the priests “gain their daily food by means of it.” The people’s sin is their living.

      The second half of the verse fits both: “they set their heart on their iniquity.” The men appointed to turn Israel from sin had an interest in its going on. Verse 9 puts them under the same sentence as the people: “like people, like priest.”
    sources: [keil-hosea, bdb, esv, oshb-wlc, lds-scriptures]

  - ref: 12
    phrase: 'My people ask counsel at their stocks, and their staff declareth unto them'
    kind: history
    title: 'Asking wood for answers'
    body: |
      “Stocks” and “staff” are an idol and a diviner’s rod. The first word is simply “wood” or “tree,” used of wooden idols; the second is an ordinary walking stick, here the “wand of diviner.” The stocks were wooden images, and the staffs were divining rods used to foretell the future or find what was hidden. The line can be rendered plainly, “a diviner’s rod speaks to them,” or, with some scorn, “their walking staff gives them oracles.”

      Verse 11 says what lies behind it. Whoredom and wine “take away the heart,” and the heart in Hebrew is the seat of thought: the phrase is “take away the understanding.” Verse 12 speaks of “the spirit of whoredoms,” a phrase the next chapter repeats: “the spirit of whoredoms is in the midst of them, and they have not known the LORD” ([[Hosea 5:4]]).
    sources: [ot-manual-10, bdb, niv, esv, nrsvue, lds-scriptures]

  - ref: 13
    phrase: 'upon the tops of the mountains'
    kind: history
    title: 'The hilltop shrines'
    body: |
      The worship described is that of the “high places,” and here the chapter’s “whoredom” stops being only a figure. Altars on hilltops were an old custom, and some had been altars to the Lord. But the law had ordered Israel to destroy the places where the nations of Canaan served their gods “upon the high mountains, and upon the hills, and under every green tree” ([[Deut. 12:2]]), and when idolatry came in, many high places were given over to it.

      Hosea names the trees (oak, poplar, and the terebinth, which the King James calls an elm) and gives the worshippers’ reason with some dryness: “because the shadow thereof is good.”

      Phoenician altars had beside them a sacred tree or pole, which the King James often calls a “grove.” It stood for the productive power of nature, and that worship “became associated with gross immorality.” The verse itself runs straight from sacrifice to the conduct of daughters and brides. Through most of the book “whoredom” is a picture of leaving the Lord for other gods. In verses 13 and 14 it is also what happened at the shrines.
    sources: [bd-high-places, bd-grove, nrsvue, lds-scriptures]

  - ref: 14
    phrase: 'I will not punish your daughters when they commit whoredom'
    kind: words
    title: 'Why the daughters are not singled out'
    body: |
      The Lord declines to single out the young women because the men are guilty of the same thing. “Themselves” in the King James is the men: “the men themselves go aside with prostitutes.”

      The second word translated “harlots” is not the ordinary one. It is *qedeshot*, women attached to a shrine, a “temple-prostitute” in the lexicon. The law used the same word to forbid the thing: “There shall be no whore of the daughters of Israel” ([[Deut. 23:17]]).
    sources: [bdb, oshb-wlc, nrsvue, lds-scriptures]

  - ref: 15
    phrase: 'come not ye unto Gilgal, neither go ye up to Beth-aven, nor swear, The LORD liveth'
    kind: history
    title: 'Gilgal, Beth-aven, and an oath'
    body: |
      The verse is an aside to Judah, the southern kingdom: Israel is lost to these places, so stay away from them. Both were holy ground once.

      Gilgal was Israel’s first camp in the promised land, where Joshua set up the twelve stones taken from the Jordan ([[Josh. 4:20]]). It was a sacred place in Saul’s day and later “the scene of idolatrous worship.” Amos, who prophesied in the same reign, mocks the pilgrims: “Come to Beth-el, and transgress; at Gilgal multiply transgression” ([[Amos 4:4]]).

      Beth-aven is Bethel under another name. Bethel means “house of God”; it was where Jacob dreamed ([[Gen. 28:19]]) and where Jeroboam the son of Nebat set one of his golden calves ([[1 Kgs. 12:28–29]]). *Aven* means trouble, wickedness, or idolatry, and Hosea uses the name “because Bethel, house of God, is given over to idolatry.” Amos makes the same play on the name: Bethel “shall come to nought” ([[Amos 5:5]]), where “nought” is this same word *aven*. Hosea uses the name again at 5:8 and 10:5.

      The third prohibition is the surprising one, since the law commanded Israel to swear by the Lord’s name, and Jeremiah gives the oath its condition: “thou shalt swear, The LORD liveth, in truth, in judgment, and in righteousness” ([[Jer. 4:2]]). The command belongs with the two before it. Worship at those shrines and an oath by the Lord’s life “cannot go together”: His name in the mouth of one who worships idols is hypocrisy.
    sources: [bd-gilgal, bd-bethel, bd-jeroboam, bdb, oshb-wlc, keil-hosea, lds-scriptures]

  - ref: 16
    phrase: 'as a backsliding heifer'
    kind: symbol
    title: 'A stubborn heifer and a lamb in a wide place'
    body: |
      The heifer is a picture of a people that will not be led. “Backsliding” does not mean drifting; the Hebrew word is to “be stubborn, rebellious,” the word the law uses for the stubborn son ([[Deut. 21:18]]). It is the young cow under the yoke who “refuses to follow when led and sets her feet and slides in the dirt.” She will not pull with her partner or answer the driver.

      The second half of the verse answers the first with a sentence fitted to the offense. Israel wanted no yoke, so it will have open country: “a helpless animal lost in a large open area with no protection,” a lamb that in a wide field “becomes the prey of wolves and wild beasts.” On this reading the freedom it insisted on is the scattering among the nations.

      The line can also be read as a question, whether the Lord can now feed them “like a lamb in a broad pasture?” The King James and the ancient Greek translation read a statement. Hosea returns to the heifer, more hopefully, in [[Hosea 10:11]].
    sources: [ot-manual-10, bdb, keil-hosea, nrsvue, lxx-rahlfs, lds-scriptures]

  - ref: 17
    phrase: 'Ephraim is joined to idols: let him alone'
    kind: history
    title: 'Ephraim, and what “let him alone” means'
    body: |
      “Ephraim” is the northern kingdom, named for its leading tribe, and this is the first time the book uses the name. Ephraim and Judah were the two dominant tribes, so each came to stand for its whole kingdom. Ephraim’s rivalry with Judah had done much to divide the kingdoms in the first place.

      “Joined” is a word used of allies: Ephraim is bound to its idols. “Let him alone” is a command to one person, and the verse does not say to whom. The same Hebrew verb is in David’s word about a man who was cursing him: “let him alone, and let him curse” ([[2 Sam. 16:11]]). It means to leave a person to what he is doing.

      It is not the book’s last word on Ephraim. The Lord says later, “How shall I give thee up, Ephraim?” ([[Hosea 11:8]]), and the book ends with the attachment broken from Ephraim’s side: “Ephraim shall say, What have I to do any more with idols?” ([[Hosea 14:8]]).
    sources: [ot-manual-10, bd-ephraim, bdb, oshb-wlc, hord-not-fragile, lds-scriptures]

  - ref: 19
    phrase: 'The wind hath bound her up in her wings'
    kind: symbol
    title: 'Carried off by the wind'
    body: |
      The chapter ends with Israel already caught up by a wind, a picture of being swept out of the land; the line can be rendered, “A whirlwind will sweep them away.” “Her” is the nation, spoken of as a woman, as in “her rulers” in the verse before.

      Verse 18, between the verdict on Ephraim and this image, is a hard line, and the meaning of its Hebrew is uncertain. The sense that can be recovered is a scene of drink and unfaithfulness, ending with the leaders: “her rulers” is literally her “shields,” and they “deeply love dishonor.”

      “They shall be ashamed because of their sacrifices” is the chapter’s last word. The Greek translation reads “altars” for “sacrifices.” Either way it is their worship that will shame them.
    sources: [niv, nrsvue, esv, lxx-rahlfs, lds-scriptures]

christ: |
  The three things the Lord finds missing in verse 1 are the three He promises to bring to a new betrothal: “I will betroth thee unto me in righteousness, and in judgment, and in lovingkindness, and in mercies. I will even betroth thee unto me in faithfulness: and thou shalt know the LORD” ([[Hosea 2:19–20]]). “Lovingkindness” there is the “mercy” of this chapter, “faithfulness” is from the root of its “truth,” and knowing the Lord is its “knowledge of God.”

  Latter-day Saints understand the LORD who speaks in the Old Testament to be the premortal Jesus Christ. He is the one who brings the case in this chapter, and the knowledge of God whose loss destroys a people is knowledge of Him.

explore: |
  - The Lord’s other lawsuit, with the mountains called to hear it: [[Micah 6:1–8]].
  - What a priest is for, and what happens when he fails at it: [[Mal. 2:1–9]].
  - Knowledge of God set above sacrifice: [[Hosea 6:6]].
  - The calves and the priests at the kingdom’s beginning: [[1 Kgs. 12:25–33]].
  - Kent P. Jackson’s “The Marriage of Hosea and Jehovah’s Covenant with Israel” calls this chapter’s first verse “one of the most important verses in the book.”

