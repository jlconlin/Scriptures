chapter: 8
title: Sowing the Wind
tagline: An alarm sounds over the Lord’s house. Israel has made its own kings, its own calf, its own allies, and its own altars, and has forgotten the One who made Israel. What it sowed as wind comes back as a storm.
when: 'Undated; the northern kingdom’s last decades, in the 700s B.C.'

setting: |
  Chapter 8 opens with an alarm, as [[Hos. 5:8]] did: a ram’s horn at the lips and a bird of prey overhead. Nothing in it is dated and no king is named. The Lord speaks through nearly all of it (“my covenant,” “my law,” “not by me”); verses 1 and 13 name Him in the third person. “Ephraim” is the northern kingdom, called by its leading tribe ([[Hos. 4:17]]), and Samaria was the city where its kings reigned. Judah enters only in the last verse.

  The charges match what the book of Kings tells of the north’s last decades. Four men took Israel’s throne by killing the king before them ([[2 Kgs. 15:10–30]]; see the note on [[Hos. 7:7]]). Hosea still speaks of the golden calves that Jeroboam the son of Nebat set up at Bethel and Dan ([[1 Kgs. 12:28–30]]). King Menahem paid Assyria for its support ([[2 Kgs. 15:19]]), and King Hoshea (not the prophet) sent to Egypt ([[2 Kgs. 17:4]]). Then “the king of Assyria took Samaria, and carried Israel away into Assyria” ([[2 Kgs. 17:6]]), in 721 B.C. Hosea does not say which of these events he has in view.

  Two later scriptures take up the chapter’s words. King Limhi gives a saying close to verse 7 as the word of the Lord ([[Mosiah 7:30]]), and the Savior closes the Sermon on the Mount with a scene like verse 2 ([[Matt. 7:21–23]]). Several lines are hard in Hebrew (verses 1, 5, 10, 12, and 13), and the notes give the main renderings.

thread: |
  Hosea 8 is a list of things Israel has made for itself, and its last verse says what was forgotten in the making. They set up kings “but not by me” (verse 4). From their silver and gold they “made them idols” (verse 4). Of the calf, “the workman made it; therefore it is not God” (verse 6). They hired allies (verses 9–10), multiplied altars (verse 11), and built great houses (verse 14). Then the last charge: “Israel hath forgotten his Maker.” One Hebrew verb, “make” (*‘asah*), runs through the list: it stands in verses 4 and 6, it is the verb behind “yield” in verse 7, and “Maker” in verse 14 comes from it.

  The chapter says what comes of each. The calf casts Samaria off, or is cast off. The crop has no grain, and what grain there might be, strangers eat. The hired lovers end, in the King James reading, as a burden. The altars built for sin become places of sinning. Three times the sentence falls with the word “now” (verses 8, 10, and 13).

  A second word runs beside the first. Israel cries, “My God, we know thee” (verse 2), and two verses later the Lord says of their princes, “I knew it not.” The Hebrew verb is the same. The people who claim to know Him have counted His written law “a strange thing” (verse 12).

sections:
  - range: 1-3
    heading: The alarm, and a claim to know God
    plain: |
      Put the ram’s horn to your mouth. Something like an eagle is coming against the Lord’s house, because they have broken His covenant and rebelled against His law. Israel will cry to Him, “My God, we know thee.” But Israel has thrown away what is good, and the enemy will chase him.
  - range: 4-6
    heading: Kings and a calf of their own making
    plain: |
      They set up kings, but not from the Lord, and made princes He did not acknowledge. From their silver and gold they made idols, and the end of it is that they are cut off. Samaria’s calf is rejected, and the Lord’s anger burns against them. How long before they can be clean? The calf came from Israel. A craftsman made it, so it is not God, and it will be broken to pieces.
  - range: 7-10
    heading: Wind sown, and Israel swallowed
    plain: |
      They have sown wind and will harvest a storm. The grain has no stalk, and the sprout gives no flour. If it did, foreigners would swallow it. Israel itself is swallowed, and is now among the nations like a pot nobody wants. They went up to Assyria like a wild ass off by itself, and Ephraim paid for lovers. Though they hire among the nations, the Lord will now gather them, and they will suffer under the burden of the king of princes.
  - range: 11-14
    heading: Altars, the written law, and the Maker forgotten
    plain: |
      Ephraim multiplied altars for sin, and they became altars for sinning. The Lord wrote for him the great things of His law, and they were treated as something foreign. They sacrifice and eat the meat, but the Lord does not accept them. Now He will remember their iniquity and punish their sins, and they will go back to Egypt. Israel has forgotten his Maker and built great houses, and Judah has multiplied fortified cities. The Lord will send fire on those cities, and it will consume their palaces.

notes:
  - ref: 1
    phrase: He shall come as an eagle against the house of the LORD
    kind: symbol
    title: A bird of prey over the Lord’s house
    body: |
      The alarm is a broken exclamation in Hebrew, and its picture is a bird of prey above a people. The line “is an exclamation, and therefore has no verb”: a horn to the mouth, then “like an eagle upon the house of Jehovah.” The King James supplies “He shall come.” The NRSVUE supplies less, “One like a vulture is over the house of the Lord,” with the note “Meaning of Heb uncertain.” The bird is the *nesher*, a “griffon-vulture, eagle”: the word is used of both birds. The trumpet is the *shofar*, the ram’s horn, as in the alarm of chapter 5 (see the note on [[Hos. 5:8]]).

      The eagle comes out of the covenant itself. Among the curses Moses set before Israel is this one: “The LORD shall bring a nation against thee from far, from the end of the earth, as swift as the eagle flieth” ([[Deut. 28:49]]). Hosea’s simile “points back to the threat of Moses,” and the verse gives its reason in the covenant’s terms: “because they have transgressed my covenant, and trespassed against my law.” The enemy is not named here. Verse 9 names Assyria.

      “The house of the LORD” is a surprising phrase in a prophecy to the north, whose shrines held Jeroboam’s calves. One reading takes it of the people, not of a building: “Israel was the house of Jehovah,” as when the Lord says, “I will drive them out of mine house” ([[Hos. 9:15]]). Read so, the bird is over the nation.
    sources: [keil-hosea, nrsvue, bdb, lds-scriptures]
  - ref: 2
    phrase: My God, we know thee
    kind: words
    title: Israel’s claim to know the Lord
    body: |
      Israel’s cry claims the one thing this part of the book says Israel lacks. The Lord’s case against the land was that “there is no truth, nor mercy, nor knowledge of God in the land” ([[Hos. 4:1]]). Now, with the enemy in sight, the people say, “My God, we know thee.”

      In Hebrew the name “Israel” stands at the end of the cry, and the ESV keeps it inside the people’s words: “My God, we—Israel—know you.” The Septuagint (the ancient Greek translation) does not have the name, and the NRSVUE follows it, with the note “Heb adds Israel.”

      The next verse is the reply: “Israel hath cast off the thing that is good.” The verb “know” then comes back from the Lord’s side. Of the princes Israel made He says, “I knew it not,” with the same Hebrew verb (*yada‘*). That does not mean He was uninformed. The alternative given in the Latter-day Saint edition is “I acknowledged them not,” and the NIV translates the people’s cry with the same English word: “Our God, we acknowledge you!” They say they acknowledge Him, and He says He never acknowledged what they set up.
    sources: [lds-scriptures, oshb-wlc, esv, lxx-rahlfs, nrsvue, niv]
  - ref: 4
    phrase: They have set up kings, but not by me
    kind: history
    title: Kings the Lord did not choose
    body: |
      The charge is that Israel chose its rulers without the Lord, against a law that left the choice to Him: “Thou shalt in any wise set him king over thee, whom the LORD thy God shall choose” ([[Deut. 17:15]]). The Kings account of Hosea’s time shows what replaced that choice. Shallum “conspired against” the king, “and slew him, and reigned in his stead.” Menahem “smote Shallum” and “reigned in his stead.” Pekah, a captain, “conspired against” his king and “killed him, and reigned in his room.” Hoshea “made a conspiracy against Pekah.” Hosea says, “all their kings are fallen: there is none among them that calleth unto me” ([[Hos. 7:7]]).

      A reader of Kings will object that the northern throne began with a prophet’s word. Ahijah told Jeroboam the son of Nebat, “I will rend the kingdom out of the hand of Solomon, and will give ten tribes to thee” ([[1 Kgs. 11:31]]). One answer is that Hosea’s words refer “chiefly to the founding of the kingdom by Jeroboam” and take in every later seizure of power, and that the promise did not warrant “forcibly seizing upon the government.” In Kings it is the people who act: they “made him king over all Israel” ([[1 Kgs. 12:20]]). Hosea himself holds both sides together later: “I gave thee a king in mine anger, and took him away in my wrath” ([[Hos. 13:11]]).

      The verse joins the kings to the idols in one sentence. The silver and gold made into idols were the Lord’s gifts, as He said of Israel earlier: He “multiplied her silver and gold, which they prepared for Baal” ([[Hos. 2:8]]).
    sources: [lds-scriptures, keil-hosea]
  - ref: 5
    phrase: Thy calf, O Samaria, hath cast thee off
    kind: history
    title: The calf of Samaria
    body: |
      Samaria’s calf is one of the two that Jeroboam the son of Nebat made and set up at Bethel and Dan ([[1 Kgs. 12:28–29]]; see the note on [[Hos. 4:15]]). Kings puts them in those two towns, not in the capital, and Hosea joins Samaria to the calf at Bethel, which he calls Beth-aven: “The inhabitants of Samaria shall fear because of the calves of Beth-aven” ([[Hos. 10:5]]).

      Who rejects whom in the first clause is uncertain. The verb is the one from verse 3 (*zanach*, to “reject, spurn”), where Israel “cast off the thing that is good.” As the Hebrew stands it can mean that “Samaria’s calf rejects her,” which is the King James reading: the idol fails its worshippers. Others take the Lord as the one rejecting, so the ESV, “I have spurned your calf, O Samaria,” with the note “Hebrew He has.” The NIV and the Septuagint read a command: “Samaria, throw out your calf-idol!”

      Verse 6 gives the argument against the calf in a line. It came “from Israel,” and “the workman made it; therefore it is not God.” Hosea says the same of the idols later, “all of it the work of the craftsmen” ([[Hos. 13:2]]). The calf’s end is to be “broken in pieces,” and Hosea says elsewhere that it will leave the land: “It shall be also carried unto Assyria for a present to king Jareb” ([[Hos. 10:6]]).
    sources: [lds-scriptures, bdb, oshb-wlc, esv, niv, lxx-rahlfs]
  - ref: 7
    phrase: they have sown the wind
    kind: symbol
    title: A crop of wind
    body: |
      The proverb says that what Israel has worked at is empty, and that the return on it will be the same thing grown large. What is sown is “wind” (*ruach*). What is reaped is a *suphah*, a “storm-wind,” a word used elsewhere as a figure of the Lord’s judgments. Scripture often describes the Lord’s justice as “a magnified return for what was meted out, just as one kernel of corn sown will produce hundreds of kernels in the day of harvest.” The verse begins with “For,” which joins it to what verses 4–6 have just listed: the kings, the idols, and the calf.

      The rest of the verse follows the failed crop through three stages. There is no standing stalk. If there were, “the bud shall yield no meal.” And if there were flour, “the strangers shall swallow it up.” The verb “yield” is “make” (*‘asah*), the verb of verses 4 and 6.

      Verse 8 repeats the last verb, now of the sower. “Israel is swallowed up” has the same Hebrew verb as “swallow” in verse 7, and Israel is left among the nations as “a useless vessel” (NRSVUE).
    sources: [oshb-wlc, bdb, hord-not-fragile, nrsvue]
  - ref: 7
    phrase: they shall reap the whirlwind
    kind: scripture
    title: King Limhi and the whirlwind
    body: |
      King Limhi gives a saying very close to this one as the word of the Lord, and he speaks it to a people already in bondage. His people had killed a prophet who “prophesied of many things which are to come, yea, even the coming of Christ” ([[Mosiah 7:26]]), and Limhi asks, “who wondereth that they are in bondage, and that they are smitten with sore afflictions?” ([[Mosiah 7:28]]). He then cites three sayings, the first introduced by “the Lord hath said” ([[Mosiah 7:29]]). The second is “If my people shall sow filthiness they shall reap the chaff thereof in the whirlwind; and the effect thereof is poison” ([[Mosiah 7:30]]). The third is “If my people shall sow filthiness they shall reap the east wind, which bringeth immediate destruction” ([[Mosiah 7:31]]). The Latter-day Saint edition of the Bible points from Hosea’s “reap” to Mosiah 7:30.

      Limhi’s wording is not Hosea’s. Filthiness is sown, where Hosea has wind, and the harvest is chaff and poison. Limhi does not name the prophet he is citing. Whether he has Hosea’s line in another form or a saying of the Lord that the Bible does not preserve, the text does not say.

      Limhi does say what is left for such a people to do. He goes on: “if ye will turn to the Lord with full purpose of heart” ([[Mosiah 7:33]]), He will deliver them. The Latter-day Saint edition also points from Hosea’s verse to modern revelation, which states the rule in both directions: “whatsoever ye sow, that shall ye also reap; therefore, if ye sow good ye shall also reap good for your reward” ([[D&C 6:33]]).
    sources: [lds-scriptures]
  - ref: 9
    phrase: a wild ass alone by himself
    kind: symbol
    title: A wild ass alone, and lovers for hire
    body: |
      The wild ass is a picture of wilfulness: Israel goes to Assyria on its own account. “Alone by himself” is “going alone for itself,” and Israel would go alone into Assyria and be swallowed up by the Gentiles. Jeremiah later uses the same animal for Judah, “A wild ass used to the wilderness” ([[Jer. 2:24]]).

      “Ephraim hath hired lovers” keeps the book’s figure of the unfaithful wife (chapters 1–3), and here she is the one who pays. The NRSVUE has “Ephraim has bargained for lovers,” and the NIV “Ephraim has sold herself to lovers.” Ezekiel says the same of Jerusalem: “They give gifts to all whores: but thou givest thy gifts to all thy lovers, and hirest them” ([[Ezek. 16:33]]).

      The lovers are nations. They stand for Israel’s “continued attempt to find security and friends through political alliances rather than through obedience to God.” Kings records the price of one such arrangement: “Menahem gave Pul a thousand talents of silver, that his hand might be with him” ([[2 Kgs. 15:19]]). See the note on [[Hos. 5:13]].
    sources: [bdb, ot-manual-10, nrsvue, niv, lds-scriptures]
  - ref: 10
    phrase: they shall sorrow a little for the burden of the king of princes
    kind: words
    title: The burden of the king of princes
    body: |
      The last line of verse 10 is uncertain in Hebrew, and the versions differ over what comes of the hiring. The King James reading, that they “shall be in anguish a little for the burden,” is one of several laid out for the Hebrew verb. Another is that they “begin to be minished by reason of the burden.” The NIV is close to that one: “They will begin to waste away” under “the oppression of the mighty king.” The NRSVUE has “They shall soon writhe under the burden of kings and princes,” and the ESV makes the rulers the ones who suffer: “the king and princes” are those who “shall soon writhe because of the tribute.”

      Another is the Septuagint’s, which reflects different Hebrew letters: “they shall cease a little to anoint a king and princes.” This reading has been preferred as “probably best,” though none of the English versions above follows it. If it is right, the anointing of kings and princes (verse 4) stops.

      In the King James text “the king of princes” has been read as the king of Assyria, “who boasted, according to Isaiah 10:8, that his princes were all kings”: “Are not my princes altogether kings?” ([[Isa. 10:8]]).

      “Now will I gather them” is read here as a threat, not a promise, as in the next chapter: “Egypt shall gather them up, Memphis shall bury them” ([[Hos. 9:6]]).
    sources: [bdb, niv, nrsvue, esv, lxx-rahlfs, keil-hosea, lds-scriptures]
  - ref: 11
    phrase: altars shall be unto him to sin
    kind: words
    title: Altars for sin that became altars for sinning
    body: |
      The verse ends both of its halves with the same Hebrew phrase, “to sin,” and the turn between them is that more altars produced more sin. The ESV keeps the repetition flat: Ephraim “has multiplied altars for sinning, they have become to him altars for sinning.” The NRSVUE and the NIV hear two senses in the one phrase, altars built to deal with sin that became the place of it: “When Ephraim multiplied altars to expiate sin, they became to him altars for sinning” (NRSVUE); “altars for sin offerings” that “have become altars for sinning” (NIV).

      Verse 13 says how the Lord regards the offerings. Its first words are obscure (the word translated “mine offerings” is of “dubious” meaning, and the NRSVUE notes “Meaning of Heb uncertain”), but the end of the line is plain: they “eat it; but the LORD accepteth them not.” Hosea later ties the number of altars to prosperity: “according to the multitude of his fruit he hath increased the altars” ([[Hos. 10:1]]).
    sources: [oshb-wlc, esv, nrsvue, niv, bdb, lds-scriptures]
  - ref: 12
    phrase: the great things of my law
    kind: words
    title: Ten thousand things of the law, counted as foreign
    body: |
      The Lord says that He Himself wrote His law for Ephraim, in abundance, and that Ephraim treats it as someone else’s. “Great things” stands for a Hebrew word that the text gives in two forms. The written text (the *ketiv*, what is written) has *ribbo*, “ten thousand, myriad.” The form that the scribes marked to be read aloud (the *qere*, what is read) is a word for “multitudes.” Either form is a word of abundance.

      The versions differ more over the verb. The King James takes it as a statement of fact, and so does the chapter heading in the Latter-day Saint edition. The NIV agrees: “I wrote for them the many things of my law.” On that reading, which is the one followed here, the verse speaks of a written law in the northern kingdom in Hosea’s day. The ESV and the NRSVUE make it a supposition instead: “Were I to write for him my laws by the ten thousands, they would be regarded as a strange thing” (ESV). The Septuagint has a future, “I will write down a multitude of commands for him.” In all of them the law is a written thing and the Lord is its writer.

      “A strange thing” is a foreign thing: the Hebrew word (*zar*) is the one translated “strangers” in verse 7. The chapter began with the same law, “trespassed against my law” (verse 1), and Hosea has already said to the priests, “thou hast forgotten the law of thy God” ([[Hos. 4:6]]).
    sources: [oshb-wlc, bdb, keil-hosea, niv, esv, nrsvue, lxx-rahlfs, lds-scriptures]
  - ref: 13
    phrase: they shall return to Egypt
    kind: history
    title: Back to Egypt
    body: |
      Egypt is where Israel’s history as a people began, and the sentence is that the history runs backward. It is the last of the covenant curses in Deuteronomy: “the LORD shall bring thee into Egypt again with ships” ([[Deut. 28:68]]). The chapter opened with the eagle of that same list of curses (verse 1) and passes sentence with its final line.

      Hosea’s other uses of the phrase set Egypt and Assyria side by side: “Ephraim shall return to Egypt, and they shall eat unclean things in Assyria” ([[Hos. 9:3]]). Later he says outright, “He shall not return into the land of Egypt, but the Assyrian shall be his king” ([[Hos. 11:5]]). In verse 13 itself the Septuagint has the Assyrian line as well: “they have returned to Egypt, and they shall eat unclean things among the Assyrians.” So “Egypt” is taken here as a name for captivity in general: “Assyria is the new Egypt.” Kings tells the event: “the king of Assyria took Samaria, and carried Israel away into Assyria” ([[2 Kgs. 17:6]]).

      Egypt was also a real temptation in these years. Of Ephraim’s envoys Hosea says, “they call to Egypt, they go to Assyria” ([[Hos. 7:11]]), and Israel’s last king lost his throne when the Assyrians learned that “he had sent messengers to So king of Egypt” ([[2 Kgs. 17:4]]).

      [“Out of Egypt Have I Called My Son”](/hosea/themes/out-of-egypt/) sets this threat beside the calling out of Egypt and the calling home.
    sources: [lds-scriptures, lxx-rahlfs, ot-manual-10]
  - ref: 14
    phrase: Israel hath forgotten his Maker, and buildeth temples
    kind: words
    title: The Maker forgotten, and the builders
    body: |
      The last verse makes its charge with the chapter’s recurring verb: Israel has forgotten the One who made him. “Maker” is a form of the Hebrew verb “make” (*‘asah*), the verb used when they “made them idols” (verse 4) and when “the workman made” the calf (verse 6).

      “Temples” is misleading in modern English. The Hebrew *hekal* means “palace, temple,” and this verse is listed among its uses for a royal palace, “in Northern Israel.” The alternative in the Latter-day Saint edition is “palaces or great buildings,” and the NRSVUE has “built palaces.” The Septuagint took the other sense and translated “fanes,” that is, shrines. The second line sets beside them Judah, who “hath multiplied fenced cities.” This is the only place where the chapter turns to Judah.

      The sentence on the buildings is worded as Amos, Hosea’s contemporary, words it: “I will send a fire upon Judah, and it shall devour the palaces of Jerusalem” ([[Amos 2:5]]).
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs, vandyke-ogden-twelve, lds-scriptures]

christ: |
  The Savior ends the Sermon on the Mount with a scene like that of verse 2. “Not every one that saith unto me, Lord, Lord, shall enter into the kingdom of heaven; but he that doeth the will of my Father which is in heaven” ([[Matt. 7:21]]). The people in His scene have a case to make, as Israel does: “have we not prophesied in thy name?” ([[Matt. 7:22]]). His answer is “I never knew you: depart from me, ye that work iniquity” ([[Matt. 7:23]]). Hosea 8:1–2 “uses language similar to that of 3 Nephi 14” and Matthew 7, and on one reading Jesus was, like Hosea, speaking of people who acted in God’s name illegitimately, perhaps because they had broken their covenants. His name alone, without righteousness and a faithful covenant relationship, does not open the kingdom.

explore: |
  - **Knowing the Lord.** [[Hos. 4:1]] and [[Hos. 4:6]] for the charge; [[Hos. 6:6]] for what the Lord desires; [[Matt. 7:21–23]] for the Savior’s use of the scene.
  - **The sowing turned around.** [[Hos. 10:12]]; [[Gal. 6:7–8]]; [[D&C 6:33]].
  - **Limhi’s three sayings.** [[Mosiah 7:26–33]], spoken to a people in bondage.
  - **The calf to its end.** [[1 Kgs. 12:28–30]]; [[Hos. 10:5–6]]; [[Hos. 13:2]].
  - **The covenant curses behind the chapter.** [[Deut. 28:49]] and [[Deut. 28:68]], the eagle and the return to Egypt.
  - **Kings without the Lord.** [[2 Kgs. 15:8–31]]; [[Hos. 7:7]]; [[Hos. 13:10–11]].

