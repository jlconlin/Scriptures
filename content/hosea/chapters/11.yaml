chapter: 11
title: A Father Who Cannot Give Up His Son
tagline: The Lord remembers Israel as a child He called out of Egypt, taught to walk, and fed. The child has turned away and the Assyrian will be his king, yet the Lord asks how He can give Ephraim up, and promises to call His children home.
when: 'Undated; the northern kingdom’s last decades, in the 700s B.C.'

setting: |
  Chapter 11 carries no date. Hosea prophesied in the northern kingdom in the later 700s B.C., when Israel was close to being conquered by Assyria, and this chapter names the conqueror: “the Assyrian shall be his king.” So it turned out, when “the king of Assyria took Samaria, and carried Israel away into Assyria” ([[2 Kgs. 17:6]]). The chapter calls Israel “Ephraim” as well (see the note on [[Hos. 4:17]]).

  The chapter begins the book’s last part. In chapters 1–3 the Lord was a husband to an unfaithful wife; here He speaks as a father of a son. As in [[Hos. 9:10]], the book goes back to Israel’s beginnings, this time to the Exodus.

  Verse 1 is the best-known line of the chapter because Matthew quotes it of the child Jesus ([[Matt. 2:15]]). The rest is less read, partly because the King James wording is hard to follow; in verses 1–4 a modern translation set beside it helps.

thread: |
  Verses 1–11 are one speech by a father about a son, and it turns in the middle. It opens with memory: the child loved, called out of Egypt, taught to walk, led gently, fed (verses 1–4). Each kindness is set against what the child did with it. He went away from those who called him, and he never knew who had healed him.

  The sentence follows (verses 5–7). The son who was called out of bondage will go into bondage again, under Assyria, “because they refused to return.”

  Then the speech breaks off in four questions: “How shall I give thee up, Ephraim?” (verses 8–9). The Lord will not carry out the fierceness of His anger, and the reason He gives is what He is: “I am God, and not man.”

  One Hebrew verb, “return,” runs through all of it. Israel will not return to Egypt and has refused to return to the Lord (verse 5); the Lord will not return to destroy Ephraim (verse 9). The chapter’s promise finishes the movement without the word: the children come trembling out of Egypt and Assyria, and He settles them in their houses (verses 10–11). The speech began with the Lord calling a son out of Egypt, and it ends with Him calling again.

sections:
  - range: 1-4
    heading: A father remembers
    plain: |
      When Israel was a child, the Lord loved him and called His son out of Egypt. But as they were called, so they went away; they sacrificed to the Baalim and burned incense to carved images. It was the Lord who taught Ephraim to walk, taking them by the arms, and they did not know that He had healed them. He drew them with a man’s cords, with bands of love; He was to them like one who eases the yoke on an animal’s jaws, and He set food before them.
  - range: 5-7
    heading: The Assyrian shall be his king
    plain: |
      He will not go back to the land of Egypt; the Assyrian will be his king, because they refused to return. The sword will stay upon his cities, consume his branches, and devour, because of their own counsels. The Lord’s people are bent on turning away from Him; though they are called to the Most High, none at all will exalt Him.
  - range: 8-9
    heading: “How shall I give thee up?”
    plain: |
      How can the Lord give Ephraim up, or hand Israel over? How can He make them like Admah and Zeboim? His heart is turned within Him, and all His compassion is kindled. He will not carry out the fierceness of His anger, and He will not turn back to destroy Ephraim, for He is God and not man, the Holy One in their midst, and He will not enter into the city.
  - range: 10-11
    heading: The children come home
    plain: |
      They will walk after the Lord. He will roar like a lion, and when He roars His children will come trembling from the west. They will come trembling like a bird out of Egypt and like a dove out of the land of Assyria, and He will settle them in their houses, says the Lord.
  - range: 12-12
    heading: Lies around the Lord
    plain: |
      Ephraim surrounds the Lord with lies and the house of Israel with deceit; but Judah still rules with God and is faithful with the holy ones.

notes:
  - ref: 1
    phrase: called my son out of Egypt
    kind: scripture
    title: Israel the son, and Matthew’s use of the line
    body: |
      In Hosea the son is the nation of Israel and the calling is the Exodus; Matthew sees the same thing happen again in the childhood of Jesus. The line rests on what Moses was sent to say to Pharaoh: “Israel is my son, even my firstborn” ([[Ex. 4:22]]), and “Let my son go, that he may serve me” ([[Ex. 4:23]]). “Son” was covenant language. In the treaties of the ancient Near East the parties “often employed familial language to describe the diplomatic relationships between themselves, including ‘father,’ ‘son,’ and ‘brother,’” and the opening verses of this chapter are a place where Israel is called the Lord’s covenant “son.”

      On its face, then, Hosea’s sentence is “a statement that spoke to Israel’s past experiences.” The next verse confirms it, because this son went on to sacrifice to Baalim.

      Matthew tells how Joseph took the young child and His mother into Egypt by night and stayed there until Herod died, “that it might be fulfilled which was spoken of the Lord by the prophet, saying, Out of Egypt have I called my son” ([[Matt. 2:15]]). His wording matches the Hebrew, which has “my son.” The ancient Greek translation, the Septuagint, has “out of Egypt have I called his children.”

      How can a line about Israel’s past be fulfilled in Jesus? The heading of this chapter in the Church’s edition answers with one word: Israel was called out of Egypt “in similitude of our Lord, as a child, coming out of Egypt.” Matthew saw Israel’s coming out as “a type or pattern.” He chose “to interpret the Hosea passage typologically,” in a Gospel that sets the infant Jesus beside Moses, both of them “spared from infanticide while most around them were not.” On this reading, what the Lord did for His son Israel was a likeness of what would happen to His Son.
    sources: [lds-scriptures, sc-knowhy-131, griffin-matthew-portrayal, lxx-rahlfs, oshb-wlc, ot-manual-10]

  - ref: 2
    phrase: As they called them, so they went from them
    kind: words
    title: Who called, and who went away
    body: |
      The Hebrew of this line says only that they called to them, without saying who the callers are, and it has been filled in two ways.

      The King James keeps the Hebrew as it stands. On one reading of it the callers are the prophets: “as the prophets called, so the Israelites drew back from them, and served idols.” Verse 7 would then say the same thing again, “they called them to the most High.”

      The Septuagint has the Lord Himself calling: “As I called them, so they departed from my presence.” One modern translation follows it, “The more I called them, the more they went from me,” and notes that the Hebrew has “they”; another follows it for “from me,” where the Hebrew has “them.”

      The two readings come to much the same charge. The verb is the one in verse 1, where the Lord “called” His son out of Egypt. The calling did not stop at the Exodus, whether it came in His own voice or through His prophets, and the more Israel was called, the farther it went.
    sources: [oshb-wlc, keil-hosea, lxx-rahlfs, nrsvue, niv]

  - ref: 3
    phrase: I taught Ephraim also to go
    kind: symbol
    title: A father teaching a child to walk
    body: |
      “To go” here is to walk: the Lord pictures Himself as a parent holding a small child up by the arms while it learns its first steps. A modern translation has, “Yet it was I who taught Ephraim to walk; I took them up in my arms.” Read that way, “the entire passage takes on a striking poignancy as God compares his love for Israel to the tender care of a father for a toddler.”

      The complaint is in the second half of the verse: “they knew not that I healed them.” The book has made this charge before in nearly the same words. Of the wife in chapter 2 the Lord said, “she did not know that I gave her corn, and wine, and oil” ([[Hos. 2:8]]), with the same Hebrew verb for knowing.
    sources: [nrsvue, sears-study-bibles, oshb-wlc]

  - ref: 4
    phrase: as they that take off the yoke on their jaws
    kind: symbol
    title: The yoke lifted so the ox can eat
    body: |
      The picture changes from a child to a working animal whose master lifts its yoke so that it can eat. It is “an agricultural simile, and refers to the custom of raising the yoke from the neck and cheeks of the oxen so that they can more readily eat their food.” One modern translation keeps that sense: “I became to them as one who eases the yoke on their jaws.” The last clause, “I laid meat unto them,” finishes it, and is rendered “I bent down to them and fed them.”

      The first half of the verse prepares for this. “Cords of a man” are the cords one would use for a person and not for a beast, so that modern translations have “I led them with cords of human kindness”; a translators’ note gives “humaneness” and says that the Hebrew is simply “man.” The Lord led Israel, but not as cattle are driven.

      Some translations take the middle of the verse differently and stay with the child of verse 3: “I was to them like those who lift infants to their cheeks.” The Hebrew text as it stands has the word for a yoke, *ol*. On either reading the Lord is the one who stoops and feeds.
    sources: [freeman-handbook, esv, nrsvue, niv, oshb-wlc, bdb]

  - ref: 5
    phrase: He shall not return into the land of Egypt
    kind: words
    title: Egypt, or not Egypt
    body: |
      This verse says that Israel will not go back to Egypt, though the book has already said that it will: “they shall return to Egypt” ([[Hos. 8:13]]), and “Ephraim shall return to Egypt” ([[Hos. 9:3]]). Translators handle the difficulty differently. One drops the negative, “They shall return to the land of Egypt.” Another makes the line a question, “Will they not return to Egypt.” A third keeps “They shall not return to the land of Egypt,” with a note offering “surely” in place of “not.” The Septuagint has “Ephraim dwelt in Egypt.”

      The Hebrew can be kept as it is. On one explanation, in the earlier verses “Egypt is a type of the land of bondage,” a name for captivity wherever it happens, while here Egypt is the country itself, set against Assyria and answering verse 1. “Into the land from which Jehovah called His people, Israel shall not return.” The Exodus will not be undone on the map. “But it is to be brought into another bondage,” and that is what happened when “the king of Assyria took Samaria, and carried Israel away into Assyria” ([[2 Kgs. 17:6]]).

      The verse turns on one verb. “Return” stands twice in it, once of going back to Egypt and once in “because they refused to return,” where a modern translation fills in “to me.” The one verb serves here for a journey back and for turning back to the Lord. Because Israel refused to turn back to the Lord, the Assyrian would be his king.
    sources: [lds-scriptures, nrsvue, niv, esv, lxx-rahlfs, keil-hosea, oshb-wlc]

  - ref: 7
    phrase: bent to backsliding
    kind: words
    title: Hung upon turning away
    body: |
      “Bent to backsliding” translates a Hebrew word that means hung or suspended, and the line is among the hardest in the chapter. Word for word it is “my people is hung up to my backsliding,” which the King James takes as “swung toward turning from me,” a sense that is “very dubious.” Modern translations stay near the King James: “My people are bent on turning away from me.”

      The second half is read in two ways. In the King James the people are called up to the Most High and none of them will exalt Him. In others the calling is the people’s own and it goes unanswered: “To the Most High they call, but he does not raise them up at all,” or, “Even though they call me God Most High, I will by no means exalt them.”
    sources: [bdb, nrsvue, niv]

  - ref: 8
    phrase: how shall I make thee as Admah
    kind: history
    title: Admah and Zeboim
    body: |
      Admah and Zeboim were destroyed with Sodom and Gomorrah, so to be made like them is to be ended, with nothing left. Genesis lists them among the cities of the plain, “Bera king of Sodom … Birsha king of Gomorrah, Shinab king of Admah, and Shemeber king of Zeboiim” ([[Gen. 14:2]]), and tells the overthrow of the plain in [[Gen. 19:24–25]], where Sodom and Gomorrah “stand alone.”

      Hosea names only the last two of the four, and Deuteronomy is where they are named in the destruction. Moses warned Israel that its land could become “like the overthrow of Sodom, and Gomorrah, Admah, and Zeboim, which the Lord overthrew in his anger, and in his wrath” ([[Deut. 29:23]]), and that the nations would be told why: “Because they have forsaken the covenant of the Lord God of their fathers” ([[Deut. 29:25]]). Hosea speaks “with evident reference to this passage,” where an idolatrous Israel is threatened with the same end. The fate the Lord asks how He can bring on Ephraim is the one Moses had threatened.
    sources: [lds-scriptures, keil-hosea]

  - ref: 8
    phrase: my repentings are kindled together
    kind: words
    title: Repentings are compassions
    body: |
      “Repentings” here are feelings of compassion, not repentance from wrong: the Hebrew noun in this verse means “compassion,” and the verb with it is to “grow warm and tender.” It is the verb used of Joseph when he saw Benjamin, “his bowels did yearn upon his brother” ([[Gen. 43:30]]), and of the true mother before Solomon, “her bowels yearned upon her son” ([[1 Kgs. 3:26]]). A modern translation has, “My heart recoils within me; my compassion grows warm and tender.”

      The King James word could still mislead. Other books on the site take up the Lord “repenting” (see the notes on [[Gen. 6:6]] and [[Jer. 18:8]]). Here the Joseph Smith Translation changes the line: the Lord’s heart is turned “toward thee, and my mercies are extended to gather thee.” Three things change. The heart turns toward Ephraim. “Repentings” become “mercies,” which is close to what the Hebrew word means. And where the King James has compassions “kindled together,” the new reading has mercies extended “to gather,” which is what verses 10–11 go on to promise.
    sources: [bdb, nrsvue, lds-scriptures]

  - ref: 9
    phrase: for I am God, and not man
    kind: words
    title: Why being God is the reason for mercy
    body: |
      The “for” gives the reason for sparing Ephraim and not the reason for punishing: because He is God and not a man, He will not carry out the fierceness of His anger. Both of the verse’s refusals come before the “for.”

      The verse does not cancel verses 5–6. The questions of verse 8 are asked in “agony over the impending captivity,” and the captivity came. What is refused is the end of Ephraim, the fate of Admah. “I will not return to destroy” is rendered “I will not again destroy Ephraim.”

      The last clause, “I will not enter into the city,” is obscure as it stands. The Church edition’s footnote offers “come in anger,” and one modern translation has “I will not come in wrath,” keeping “into the city” in a note; another has “I will not come against their cities.” In each of these readings the line repeats the promise. The Holy One is “in the midst” of Israel, and He will not come as a destroyer.
    sources: [lds-scriptures, ot-manual-10, nrsvue, esv, niv]

  - ref: 10
    phrase: he shall roar like a lion
    kind: symbol
    title: The roar that calls the children home
    body: |
      The lion that tore Ephraim earlier in the book roars here to call his children back. In chapter 5 the Lord said, “I will be unto Ephraim as a lion,” and, “I, even I, will tear and go away” ([[Hos. 5:14]]; see the note there), and He says the like in [[Hos. 13:7–8]]. A lion’s roar is elsewhere a figure “of invaders and foes”; in this verse it is the Lord, like a lion, “calling scattered Israel.”

      “Tremble” needs a word supplied in English. With “from” the Hebrew verb means to “go or come trembling,” so that the line is “his children shall come trembling from the west.”

      The dove has been in the book before too. Ephraim was “like a silly dove without heart: they call to Egypt, they go to Assyria” ([[Hos. 7:11]]). Here the dove comes out of those same two lands, and the Lord says, “I will place them in their houses.”
    sources: [lds-scriptures, bdb, nrsvue]

  - ref: 12
    phrase: Judah yet ruleth with God
    kind: words
    title: Is Judah praised or blamed?
    body: |
      The Hebrew of this line can be read as praise of Judah or as blame, and translations go both ways. The King James reads praise. The Church edition’s footnote offers “walks” for “ruleth,” and two modern translations agree: “but Judah still walks with God and is faithful to the Holy One.” A third reads the same words as a charge: “And Judah is unruly against God.” The Septuagint is different again and puts Judah beside Israel in its ungodliness.

      “Saints” is a plural in Hebrew, “holy ones.” The translations above take it as a title of God, “the Holy One,” as in verse 9.

      Where the verse stands bears on it. In the Hebrew Bible it is the first verse of chapter 12, and that chapter soon says, “The Lord hath also a controversy with Judah” ([[Hos. 12:2]]).
    sources: [lds-scriptures, nrsvue, esv, niv, lxx-rahlfs, oshb-wlc]

christ: |
  Matthew found the Savior in the first verse: Israel’s coming out of Egypt as a child was a similitude of His. The note on verse 1 gives that reading.

  The master of verse 4 lifts the yoke from his animal so that it can eat, a picture to compare “with what Jesus says about his yoke”: “my yoke is easy, and my burden is light” ([[Matt. 11:30]]).

  In verses 8–9 the Lord will not give Ephraim up, and in the Joseph Smith Translation His mercies are extended to gather him.

explore: |
  - **The son called out of Egypt.** [[Ex. 4:22–23]] and [[Matt. 2:13–15]]. The essay “Matthew’s Portrayal of Jesus: Son of David, a New Moses, and Son of God” (in *Thou Art the Christ: The Son of the Living God*) follows the likeness between Moses and Jesus through the rest of that Gospel.
  - **The cities of the plain as a covenant warning.** [[Deut. 29:22–28]], read beside verse 8.
  - **The gathering from Egypt and Assyria.** [[Isa. 11:11–12]], where the Lord recovers the remnant of His people “from Assyria, and from Egypt.”
  - **The Lord’s love at the book’s end.** [[Hos. 14:4]], “I will love them freely.”

