chapter: 6
title: Mercy, and Not Sacrifice
tagline: The people speak of returning to the Lord, sure that He will heal them as certainly as morning and rain come. The Lord answers that their devotion is gone as quickly as a morning cloud, says what He wants in place of their offerings, and names the places where His covenant was broken.
when: 'Undated; the northern kingdom’s last decades, in the 700s B.C.'

setting: |
  Chapter 6 stands in the long run of oracles (chapters 4–10) in which the Lord argues His case against Israel, and it carries no date of its own. Hosea’s ministry is placed in the northern kingdom in the latter half of the eighth century B.C., when Israel was close to being conquered by Assyria. The chapter speaks to both kingdoms by the names of their leading tribes, as the book has since [[Hos. 4:17]]: Ephraim for the north and Judah for the south.

  The chapter division falls in an awkward place. Verses 1–3 finish the oracle of chapter 5, which ended with the Lord withdrawing “till they acknowledge their offence, and seek my face” ([[Hos. 5:15]]); the ancient Greek translation, the Septuagint, joins the two with the word “saying.” A new address begins at verse 4.

  Two lines here are among the best known in the book. Verse 2, with its “third day,” has long been read of resurrection. Verse 6, “I desired mercy, and not sacrifice,” the Savior quoted twice to the Pharisees ([[Matt. 9:13]]; [[Matt. 12:7]]). The verses after it are less read and harder. They name places where the covenant was broken (Gilead, the road to Shechem, perhaps a town called Adam), and the King James wording hides two of them.

thread: |
  The chapter sets a confident return beside the Lord’s unsatisfied answer, and so asks what returning to Him is. The people say that He who tore them will heal them, and that His coming is as sure as the dawn and the rains. The Lord replies with a question, “what shall I do unto thee?”, and with a picture taken from the same morning sky: their devotion is a cloud that is gone before the day is warm.

  What He wants is constancy. He names it in verse 6 with two words, mercy and the knowledge of God, which are the very things [[Hos. 4:1]] said were missing from the land. The people had proposed to press on to know the Lord; He says that knowing Him matters more to Him than their burnt offerings.

  Then come the charges: a covenant transgressed, blood in Gilead, priests who kill on the road, and “the whoredom of Ephraim,” the book’s name for Israel’s unfaithfulness to the Lord in the worship of other gods ([[Hos. 1:2]]). Judah is told that a harvest is set for it too. How verses 1–3 are to be taken is read more than one way (see the note on verse 4); verses 4–6 ask of any return whether it lasts.

sections:
  - range: 1-3
    heading: “Come, and let us return”
    plain: |
      The people call one another to return to the Lord. He has torn them, and He will heal them; He has struck them, and He will bind up the wound. After two days He will revive them, and on the third day He will raise them up to live before Him. They will press on to know the Lord. His coming is as certain as the morning, and He will come to them like the rain, like the two rains of the year on the land.
  - range: 4-6
    heading: “What shall I do unto thee?”
    plain: |
      The Lord asks Ephraim and Judah what He is to do with them. Their goodness is like a morning cloud and like the early dew, which goes away. That is why He has hewn them by the prophets and slain them by the words of His mouth. What He desired was mercy, and not sacrifice, and the knowledge of God more than burnt offerings.
  - range: 7-11
    heading: The covenant broken
    plain: |
      But they have transgressed the covenant and dealt treacherously with the Lord. Gilead is a city of evildoers, marked with blood. As bands of robbers lie in wait for a man, so a company of priests murders on the road, for they do wickedness. The Lord has seen a horrible thing in the house of Israel: Ephraim’s whoredom is there, and Israel is defiled. For Judah too a harvest is set.

notes:
  - ref: 1
    phrase: he hath torn, and he will heal us
    kind: structure
    title: An answer to the lion of chapter 5
    body: |
      Verses 1–3 take back, image for image, the threats that close chapter 5. There the Lord said, “I, even I, will tear and go away” ([[Hos. 5:14]]); here “he hath torn, and he will heal us,” with the same Hebrew verb for tearing. There Ephraim carried his sickness to the Assyrian, “yet could he not heal you” ([[Hos. 5:13]]); here the Lord will heal and revive. There His wrath was poured out “like water” ([[Hos. 5:10]]); here He comes as rain. Set side by side, the two passages are a reversal: “the lion becomes a healer instead of a tearer,” sickness becomes revival, and “torrential rain becomes spring rain.”

      The hinge between them is [[Hos. 5:15]], and it turns on one verb. The Lord says He will “return” to His place until they seek Him; the first thing the people say is “let us return.” Hebrew uses the same verb for both.

      The verses do not name their speaker. The Septuagint supplies one by running the two chapters together: “In their affliction they will seek me early, saying, Let us go, and return to the Lord our God.” On that reading these are the people’s words in their trouble. They are also read as Hosea’s own call, the “prophet’s exhortation to the people of Israel.” Either way, the verses belong with the end of chapter 5, and the chapter break hides it. How the Lord receives the words is the subject of the note on verse 4.
    sources: [lds-scriptures, oshb-wlc, hord-not-fragile, lxx-rahlfs]

  - ref: 2
    phrase: in the third day he will raise us up
    kind: words
    title: After two days, and in the third day
    body: |
      In its first sense this line is a nation’s hope of quick recovery, spoken in the language of rising from death. The speakers are a people (“us”), and on one reading the two numbers are not a count at all: “Two and three days are very short periods of time,” and setting one number after the next expresses certainty, so that “the speedy and certain revival of Israel is set before them.”

      The verbs, though, are the verbs of life from death. The Church edition’s footnote on “revive us” offers “restore us to life; i.e., resurrect us,” and “raise us up” is a verb used elsewhere of raising the dead. Two further readings start from that.

      One takes the days as ages. The verse “may be a symbolic reference to the gathering of Israel and the Millennium,” on the reckoning that a day is a thousand years. That is offered with a “may,” and it is best left with one.

      The other is very old: many of the church fathers and of the early Lutheran commentators “found in them a prediction of the death of Christ and His resurrection on the third day.” A more cautious form of that reading takes the words as said of Israel and applies them to Him. Israel’s restoration comes only through faith in “the atoning death of Christ, and His resurrection from the grave; so that the words of the prophet may be applied to this great fact,” and, like Ezekiel’s valley of dry bones ([[Ezek. 37:1–14]]), the verse holds “the germ of the hope of a life after death.”
    sources: [lds-scriptures, ot-manual-10, keil-hosea]

  - ref: 3
    phrase: if we follow on to know the LORD
    kind: words
    title: Let us press on to know the Lord
    body: |
      The King James makes this a condition (“if we follow on”), but modern translations read it as a call that continues verse 1: “Let us know, let us press on to know the Lord.” The verb behind “follow on” means to pursue or chase.

      Knowledge of God, which they propose to pursue, is what the book says the land lacks, “no truth, nor mercy, nor knowledge of God in the land” ([[Hos. 4:1]]), and it is what the Lord will say in verse 6 that He desires.

      The next line gives the ground of their confidence. “His going forth is prepared as the morning” is, in a modern rendering, “his appearing is as sure as the dawn.” They expect the Lord as they expect the sunrise. His answer in verse 4 also begins from the morning.
    sources: [lds-scriptures, nrsvue, esv, bdb]

  - ref: 3
    phrase: as the latter and former rain unto the earth
    kind: symbol
    title: The two rains
    body: |
      The “former” and “latter” rains were the two ends of the farmer’s wet season, and a crop needed both. The former, or early, rain “falls in Palestine from the last of October until the first of December”; the latter rain is the “showers of March-April,” important “as strengthening and maturing crops.” The first softened the ground so that it could be plowed and sown, and the second “gave the crop its growth.” After that “rain hardly ever falls until the end of September.”

      So the people are saying more than that the Lord will refresh them. They compare His coming to the thing the whole year’s food depended on and that came, in a good year, in its season. In the law the rains were themselves among the Lord’s promises to Israel: “I will give you the rain of your land in his due season, the first rain and the latter rain” ([[Deut. 11:14]]).
    sources: [bdb, ot-manual-10, bd-rain, lds-scriptures]

  - ref: 4
    phrase: your goodness is as a morning cloud
    kind: symbol
    title: Goodness that is gone by mid-morning
    body: |
      “Goodness” here is the same Hebrew word as “mercy” in verse 6, *hesed*, and the Lord’s complaint is that Israel’s does not last. The lexicon’s first gloss is “goodness, kindness,” and it allows, as a possibility, that in this verse the word is Israel’s devotion to God: “your piety is like a morning cloud (fleeting).” Modern translations have “Your love is like a morning cloud.” *Hesed* is a covenant word, the loyal and constant love that binds two parties in a covenant; the note on [[Hos. 2:19]] says more of it, and it is the “mercy” of [[Hos. 4:1]] as well.

      The picture is the cloud and the dew of an early morning. On the high ground of that country “the dews at night are often heavy,” and the verse says what becomes of them: they go away. The people had likened the Lord’s coming to the dawn and the rain; He likens their devotion to the cloud and dew of the same morning.

      Whether this is His answer to the words of verses 1–3 is read both ways, and the headings in the translations show it: one heads those verses “A Call to Repentance,” another “Israel Unrepentant.” The verse itself has been read as “a prophetic critique of the ultimate lack of depth and staying power of self-justifying righteousness.”

      The image comes back twice. In judgment, Ephraim itself “shall be as the morning cloud, and as the early dew that passeth away” ([[Hos. 13:3]]). In promise, the Lord is Himself the dew: “I will be as the dew unto Israel” ([[Hos. 14:5]]).
    sources: [oshb-wlc, bdb, nrsvue, niv, ot-manual-10, bd-rain, lane-hostility, lds-scriptures]

  - ref: 5
    phrase: hewed them by the prophets
    kind: words
    title: Hewn by the prophets
    body: |
      The prophets’ words are the tool: the Lord says He has cut at His people with what His prophets said. The verb is the one for hewing stone or wood, used here as a figure, to “hew in pieces,” of the Lord striking the people through His prophets. The next line says the same thing without the figure: “I have slain them by the words of my mouth.” The “therefore” ties it to verse 4: because their devotion did not hold, He sent the word that cuts.

      The last clause is awkward in the King James, “thy judgments are as the light that goeth forth,” because the Lord is the one speaking and it is His judgment that is in view. The Hebrew as it stands does read “thy judgments.” For this clause the Septuagint has “my judgment shall go forth as the light,” and modern translations read it the same way: “my judgment goes forth as the light,” or “then my judgments go forth like the sun.” On that reading the judgment is the Lord’s own.
    sources: [bdb, oshb-wlc, lxx-rahlfs, nrsvue, niv]

  - ref: 6
    phrase: I desired mercy, and not sacrifice
    kind: scripture
    title: The Savior quotes this line twice
    body: |
      Jesus twice sent the Pharisees back to this verse, each time when they had faulted someone on a point of observance. The first time He was at table with “many publicans and sinners” ([[Matt. 9:10]]), and the Pharisees asked His disciples why. He answered, “go ye and learn what that meaneth, I will have mercy, and not sacrifice: for I am not come to call the righteous, but sinners to repentance” ([[Matt. 9:13]]). The second time His disciples had plucked ears of corn on the Sabbath and were charged with doing what was not lawful. He answered, “if ye had known what this meaneth, I will have mercy, and not sacrifice, ye would not have condemned the guiltless” ([[Matt. 12:7]]), having just said that “in this place is one greater than the temple” ([[Matt. 12:6]]).

      In Hosea the line is spoken to a people who went “with their flocks and with their herds to seek the Lord” ([[Hos. 5:6]]) while they broke His covenant. The Savior turns it on the Pharisees, who, on one reading, had “placed their self justifying obedience over compassion for the less obedient”; His “go ye and learn” challenges their reading of scripture itself. The next note is on what Hosea’s sentence says.
    sources: [lds-scriptures, lane-hostility, scripture-helps-hosea]

  - ref: 6
    phrase: the knowledge of God more than burnt offerings
    kind: words
    title: Not sacrifice, or more than sacrifice?
    body: |
      “Not sacrifice” does not abolish sacrifice. The second line of the verse is a comparison, “more than burnt offerings,” and the Septuagint translates both lines that way: “I will have mercy rather than sacrifice, and the knowledge of God rather than whole-burnt-offerings.” Sacrifices were “still important.” The fault was that the people “were offering animal sacrifices, but they were breaking more important commandments,” so that of their offerings Hosea says, “the Lord accepteth them not” ([[Hos. 8:13]]).

      Samuel had said the same to Saul in the same form: “to obey is better than sacrifice, and to hearken than the fat of rams” ([[1 Sam. 15:22]]). Isaiah says the like to Judah (see the note on [[Isa. 1:11]]).

      What the Lord wants ahead of the offerings is a pair, mercy (*hesed*; see the note on verse 4) and “the knowledge of God.” It is the pair [[Hos. 4:1]] said the land had lost, and this verse “connects directly” with that one. In chapter 4 the lack of this knowledge is laid to the priests, who have “rejected knowledge” and “forgotten the law of thy God” ([[Hos. 4:6]]); there it stands beside the law. It is also what the people had just proposed to pursue (verse 3).
    sources: [lds-scriptures, lxx-rahlfs, scripture-helps-hosea, cfm-ot-2026-47]

  - ref: 7
    phrase: like men
    kind: words
    title: Like men, like Adam, or at Adam
    body: |
      The Hebrew behind “like men,” *ke-adam*, can be read three ways.

      The King James takes *adam* as the common noun, mankind: they have broken the covenant as people do. The Septuagint is close to it: “they are as a man transgressing a covenant.”

      The second reading takes it as the name. The Church edition’s footnote offers “OR Adam,” and some translations print “like Adam.” The Hebrew “could just as easily be read as” the name, and so read, this is one of a handful of Old Testament passages taken as looking back to Adam’s transgression.

      The third takes Adam as a place: “at Adam they transgressed the covenant,” or “As at Adam.” Its strength is the next word. “There have they dealt treacherously” points to a location; the word “functions as a locative, identifying where the covenant transgression occurred,” and the verses that follow name Gilead and the road to Shechem. A town called Adam stood by the Jordan, where the waters “rose up upon an heap” when Israel crossed ([[Josh. 3:16]]), and it “would lie along this route.”

      Between the name and the place, “the general tendency of scholars” has been toward the town on the Jordan, though some still hold to Adam’s name. The two need not exclude one another: Hosea may have singled out that town because of “the symbolic link between Adam’s transgression in Eden and Israel’s priests who acted wickedly at the place Adam.” That is a suggestion and not a finding. On any of the three, the charge is the same: a covenant was made with them, and they crossed it.
    sources: [lds-scriptures, oshb-wlc, lxx-rahlfs, esv, nrsvue, niv, sc-knowhy-28, pritchett-fall]

  - ref: 8
    phrase: polluted with blood
    kind: words
    title: Gilead tracked with blood
    body: |
      “Polluted with blood” is closer to “tracked with blood,” and Gilead, called a city here, is elsewhere the name of a region. The Hebrew word behind “polluted” is glossed “foot-tracked” in this verse, and modern translations have “tracked with blood” and “stained with footprints of blood.” Gilead is a “highland district east of the Jordan”; the verse calls it a city of evildoers.

      The verse does not say what bloodshed it means.
    sources: [bd-gilead, bdb, nrsvue, niv]

  - ref: 9
    phrase: murder in the way by consent
    kind: history
    title: Priests on the road to Shechem
    body: |
      Where the King James has “by consent,” the Hebrew names a place: the priests “murder on the road to Shechem.” The Church edition’s footnote gives that rendering, and the Hebrew word is the name Shechem with the ending that means “toward.”

      Shechem was the “most ancient of the sacred towns of the children of Israel,” in the hill country of Ephraim, and it “became a Levitical city and a city of refuge.” Joshua names it among the cities of refuge ([[Josh. 20:7]]) and gives it to the Levites “to be a city of refuge for the slayer” ([[Josh. 21:21]]). The priests are compared to “troops of robbers” lying in wait on the way to it.

      What happened there is not recorded, and two explanations have been drawn from the verse. Some infer that priests of Shechem, “using the privileges of their city to cover crimes of their own,” killed people on their way to it. Against that, Shechem was a city of the Levites and not of the priests, and the northern kingdom’s priests had been “taken by Jeroboam from the people generally,” with no cities assigned them. The other points out that the road from the north to Bethel, “the principal place of worship” of the northern kingdom, “lay through this city.” “Pilgrims to the feasts for the most part took this road,” it reasons, and the priests “appear to have lain in wait for them, either to rob, or, in case of resistance, to murder.” Both are inferences.

      “Lewdness” at the end of the verse is wider in Hebrew than the English suggests. The Hebrew word here is “wickedness in act,” with murder as its context, and a modern translation has “they commit a monstrous crime.” The priests have been the book’s target since chapter 4; chapter 5 opened, “Hear ye this, O priests” ([[Hos. 5:1]]).
    sources: [lds-scriptures, oshb-wlc, bd-shechem, keil-hosea, bdb, nrsvue]

  - ref: 11
    phrase: he hath set an harvest for thee
    kind: symbol
    title: A harvest for Judah too
    body: |
      Judah is not let off: the “harvest” set for it is read here as a judgment, and modern translations join the second half of the verse to the next chapter. They make the first half passive, “For you also, O Judah, a harvest is appointed.” Harvest is taken as “a figurative term for the judgment,” because Judah “has sinned as well as Israel, it cannot escape the punishment”; the book has turned aside to Judah in this way before, promising to be “as a young lion to the house of Judah” ([[Hos. 5:14]]). It has also been read as “a harvest of joy.”

      The second half, “when I returned the captivity of my people,” is past tense in the King James but not in the Hebrew, which is closer to “when I turn the imprisonment of my people.” Kept with the first half, it says when Judah’s harvest comes. Modern translations instead start a new sentence with it, “When I would restore the fortunes of my people,” and run it into the next verse: “whenever I would heal Israel,” the sins of Ephraim are exposed. The King James itself begins the next chapter, “When I would have healed Israel” ([[Hos. 7:1]]). The phrase means more than bringing captives home; it is “to turn the captivity” in the figurative sense of a full restoration.
    sources: [keil-hosea, nrsvue, niv, lds-scriptures]

christ: |
  Jesus made verse 6 His own. He twice told the Pharisees to go and learn what “I will have mercy, and not sacrifice” means, and on the second occasion He said of Himself, “in this place is one greater than the temple” ([[Matt. 12:6]]).

  The sacrifices of Hosea’s day pointed to Him as well. The true purpose of the law of sacrifice, which Israel’s conduct did not fulfill, was “to turn people to Jesus Christ so that they would repent,” and from the beginning an angel had called sacrifice “a similitude of the sacrifice of the Only Begotten of the Father” ([[Moses 5:7]]).

  Verse 2, with its third day, has long been read of His Resurrection as well; the note on that verse gives the reading.

explore: |
  - **The two occasions in Matthew.** [[Matt. 9:10–13]] and [[Matt. 12:1–8]], read with verse 6 in mind. The essay “Hostility toward Jesus: Prelude to the Passion” (in *Celebrating Easter*) is especially good on what the Pharisees’ table rules had to do with sacrifice.
  - **Obedience and sacrifice before Hosea.** [[1 Sam. 15:19–24]], where Samuel says it to Saul.
  - **The same charge in Judah.** [[Isa. 1:11–17]].
  - **The morning cloud and the dew again.** [[Hos. 13:3]] and [[Hos. 14:5]].
  - **Israel raised from death.** [[Ezek. 37:1–14]], the valley of dry bones.

