chapter: 9
title: No Harvest Joy; Ephraim Bears No Fruit
tagline: Israel is told not to rejoice at the harvest, for the land, the feasts, and the children will all be lost. The Lord who once found Israel like grapes in the wilderness names Gibeah, Baal-peor, and Gilgal, and Ephraim will wander among the nations.
when: 'Undated; the northern kingdom’s last decades, in the 700s B.C.'

setting: |
  Chapter 9 is undated, like every oracle after the book’s first verse, and it names no king. It belongs to the book’s long run of oracles against the northern kingdom, and it begins where chapter 8 stopped: “they shall return to Egypt” ([[Hos. 8:13]]) is taken up in verse 3.

  The opening words suggest an occasion. Israel is told not to rejoice, and the next verse names the threshing floor and the winepress, so the joy in view is “rejoicing at a plentiful harvest.” Verse 5 asks what the people will do on “the day of the feast of the LORD.” The law itself commanded joy at the feast of tabernacles, which was kept “after that thou hast gathered in thy corn and thy wine” ([[Deut. 16:13]]): “thou shalt rejoice in thy feast” ([[Deut. 16:14]]). Whether Hosea spoke at such a feast the text does not say.

  Two voices alternate. The prophet speaks of “my God” (verses 8 and 17) and prays in verse 14. The Lord speaks as “I” in verses 10–13 and 15–16. “Ephraim” is the northern kingdom ([[Hos. 4:17]]). What the chapter foretells came when the king of Assyria “took Samaria, and carried Israel away into Assyria” ([[2 Kgs. 17:6]]). Verses 8 and 13 are hard in Hebrew, and the notes give the main renderings.

thread: |
  Hosea 9 forbids a harvest celebration and then takes the harvest away. Nearly every picture in it is of fruitfulness: the threshing floor and the winepress (verses 1–2), wine poured out at the feast (verse 4), grapes found in the wilderness and the first figs of the season (verse 10), a planting in a pleasant place (verse 13), a root and its fruit (verse 16). Each is lost. The floor will not feed them, the wine cannot be offered, and the root dries up. In verses 11–16 the loss reaches the children. Joseph explained the name Ephraim as fruitfulness ([[Gen. 41:52]]), and the chapter ends with Ephraim bearing no fruit.

  A second argument runs beside this one, from history. The chapter names three places where Israel had gone wrong before: Gibeah (verse 9), Baal-peor (verse 10), and Gilgal (verse 15). It also sends the people back the way they came: out of “the LORD’s land” (verse 3), back to “Egypt,” and at last to be “wanderers among the nations” (verse 17). The Lord who “found Israel like grapes in the wilderness” says at Gilgal, “I will love them no more.”

sections:
  - range: 1-6
    heading: No joy at this harvest
    plain: |
      Israel is not to rejoice as other nations do, for it has been unfaithful to its God and has loved a prostitute’s pay on every threshing floor. The floor and the winepress will not feed them, and the new wine will fail. They will not stay in the Lord’s land. Ephraim will return to Egypt and eat unclean food in Assyria. They will pour out no wine to the Lord, and their sacrifices will not please Him. Their bread will be like mourners’ bread, which defiles whoever eats it. It will feed them and will not come into the Lord’s house. What will they do on the feast day? They have gone because of destruction. Egypt will gather them and Memphis will bury them. Nettles will take their treasures of silver, and thorns will grow in their tents.
  - range: 7-9
    heading: The days of reckoning, and the prophet
    plain: |
      The days of punishment have come, and the days of repayment, and Israel will know it. “The prophet is a fool, the man of the spirit is mad,” because of great iniquity and great hostility. The watchman of Ephraim was with God, but the prophet is a fowler’s snare on all his ways, and there is hatred in the house of his God. They have sunk deep in corruption, as in the days of Gibeah. God will remember their iniquity and punish their sins.
  - range: 10-14
    heading: Grapes in the wilderness, and Baal-peor
    plain: |
      The Lord says: I found Israel like grapes in the wilderness. I saw your fathers like the first ripe figs of the season. But they went to Baal-peor and devoted themselves to that shame, and became as detestable as what they loved. Ephraim’s glory will fly away like a bird: no birth, no pregnancy, no conception. Even if they raise children, I will bereave them until no one is left. Woe to them when I depart from them. Ephraim was planted in a pleasant place, as Tyre was, yet Ephraim will bring his children out to the slayer. The prophet prays: Give them, Lord (what will you give?), wombs that miscarry and breasts that are dry.
  - range: 15-17
    heading: Gilgal, and the sentence
    plain: |
      The Lord says: All their wickedness is at Gilgal, and there I hated them. For the evil of their deeds I will drive them out of my house. I will love them no more. All their princes are rebels. Ephraim is struck down. Their root is dried up, and they will bear no fruit. Even if they bear children, I will slay the cherished offspring of their womb. The prophet says: My God will cast them away, because they did not listen to Him, and they will be wanderers among the nations.

notes:
  - ref: 1
    phrase: thou hast loved a reward upon every cornfloor
    kind: symbol
    title: A harlot’s pay on the threshing floor
    body: |
      The “reward” is a prostitute’s fee, and the charge is that Israel has taken its harvest as payment from other gods. The modern versions translate the word plainly: “You have loved a prostitute’s pay” (NRSVUE). The footnote in the Latter-day Saint edition gives the same sense, and makes the “cornfloor” a threshing floor.

      The charge repeats chapter 2. There the unfaithful wife says, “I will go after my lovers, that give me my bread and my water, my wool and my flax, mine oil and my drink” ([[Hos. 2:5]]), and she calls her vines and fig trees “my rewards that my lovers have given me” ([[Hos. 2:12]]). Read with those verses, the line means that Israel did not take the harvest on its threshing floors as the gift of its God, “but as presents from the Baals.” The Lord’s answer in chapter 2 is that “she did not know that I gave her corn, and wine, and oil” ([[Hos. 2:8]]).

      That is why the joy is forbidden. Other peoples rejoiced at harvest, and the modern versions name them: “Do not exult as other nations do.” The threat follows from the charge. In chapter 2 the Lord had said He would “take away my corn in the time thereof, and my wine in the season thereof” ([[Hos. 2:9]]). Here the floor and the winepress “shall not feed them.”
    sources: [nrsvue, keil-hosea, lds-scriptures]
  - ref: 3
    phrase: Ephraim shall return to Egypt
    kind: history
    title: Back to Egypt, by way of Assyria
    body: |
      “Egypt” in this verse can be read as a name for captivity in general, and the place the exiles were actually taken was Assyria (see the note on [[Hos. 8:13]]). The two countries stand side by side in the verse.

      Egypt the country is close by in these years as well. Israel’s last king, Hoshea (his name is the prophet’s name in another spelling), “sent messengers to So king of Egypt” and sent no present to the king of Assyria ([[2 Kgs. 17:4]]), and verse 6 pictures fugitives dying there: “Egypt shall gather them up, Memphis shall bury them.” Memphis was the “ancient capital of Egypt.” The Septuagint, the ancient Greek translation, puts the clause in the past: “Ephraim dwelt in Egypt.” Hosea’s other mentions of the two powers begin at [[Hos. 7:11]].

      The second half of the verse says what exile costs. The land is “the LORD’s land,” and outside it Israel’s food is unclean. Ezekiel says the same of the exiles, who “eat their defiled bread among the Gentiles” ([[Ezek. 4:13]]).
    sources: [lds-scriptures, bd-hosea, bd-noph, lxx-rahlfs]
  - ref: 4
    phrase: as the bread of mourners
    kind: history
    title: Mourners’ bread, and a feast day with nothing to bring
    body: |
      Mourners’ bread is “the bread eaten at funeral meals,” and it “was regarded as unclean, because the corpse defiled the house.” The law said that when a person died in a tent, “all that come into the tent, and all that is in the tent, shall be unclean seven days” ([[Num. 19:14]]). An Israelite who brought his tithe had to declare, “I have not eaten thereof in my mourning” ([[Deut. 26:14]]).

      Hosea says that all of Israel’s food in exile will be like that. The last clause gives the reason, and the modern versions make it clearer than the King James does: “their bread shall be for their hunger only” (NRSVUE), and none of it comes to the Lord’s house. In the land, the firstfruits of a harvest were presented to the Lord, and food “not sanctified to the Lord by the presentation of the first-fruits” was unclean to Israel. In exile that offering stops, and bread only fills the stomach.

      Verse 5 asks its question from there: “What will ye do in the solemn day?” With “the temple and ritual” both “wanting in their exile, they will be unable to observe any of the feasts of the Lord.” The chapter began by forbidding joy at the harvest, and by verse 5 there are no feasts to keep.
    sources: [keil-hosea, nrsvue, lds-scriptures]
  - ref: 7
    phrase: the prophet is a fool, the spiritual man is mad
    kind: words
    title: Who calls the prophet a fool
    body: |
      These words can be read as Hosea’s verdict on Israel’s false prophets or as the people’s taunt at a true prophet, and several modern versions print them the second way. The Hebrew has no verb of saying. It sets the words side by side: fool, the prophet; mad, the man of the spirit.

      Taken as Hosea’s verdict, the line is about the prophets who had promised safety. He “was referring to false prophets who were saying that all was well in Israel and that their enemies would not come against them.” When the days of punishment come, Israel will know what those prophets were worth.

      The other reading makes the words what the people say about a true prophet such as Hosea. The NRSVUE supplies “Israel will cry out” and prints the line as a quotation. The NIV has “the prophet is considered a fool,” and “the inspired person a maniac.” The word for “mad” gives this reading some support: in the lexicon its use here is said “of prophets, contemptuously,” and it stands with two other places where a prophet is called mad. Jehu’s officers asked about a prophet sent by Elisha, “wherefore came this mad fellow to thee?” ([[2 Kgs. 9:11]]), and a letter in Jeremiah’s day speaks of “every man that is mad, and maketh himself a prophet” ([[Jer. 29:26]]).

      Verse 8 is rendered both ways as well. In the King James the watchman of Ephraim “was with my God” while the prophet is a snare. In the ESV the prophet is “the watchman of Ephraim with my God,” and the fowler’s snare is laid for him. The NIV agrees: snares “await him on all his paths.” Hosea had already used the snare of Israel’s leaders (see the note on [[Hos. 5:1]]).
    sources: [ot-manual-10, oshb-wlc, bdb, nrsvue, niv, esv, lds-scriptures]
  - ref: 9
    phrase: as in the days of Gibeah
    kind: history
    title: The days of Gibeah
    body: |
      Gibeah is the town of a crime that Israel itself judged the worst since the Exodus, and Hosea uses it as the measure of how far Israel has fallen. A Levite and his concubine stopped for the night at “Gibeah, which belongeth to Benjamin” ([[Judg. 19:14]]). Men of the town surrounded the house and abused the woman through the night, and in the morning she lay fallen at the door ([[Judg. 19:25–27]]). When word went through the tribes, “all that saw it said, There was no such deed done nor seen from the day that the children of Israel came up out of the land of Egypt unto this day” ([[Judg. 19:30]]).

      A war followed. The tribe of Benjamin “would not hearken” when Israel demanded the guilty men ([[Judg. 20:13]]). In the war that came of it twenty-five thousand Benjamites fell, and six hundred men were left of the tribe ([[Judg. 20:46–47]]).

      Hosea says the present generation has gone as deep. The sentence that follows, “he will remember their iniquity, he will visit their sins,” repeats [[Hos. 8:13]]. Hosea comes back to the place: “O Israel, thou hast sinned from the days of Gibeah” ([[Hos. 10:9]]).
    sources: [lds-scriptures]
  - ref: 10
    phrase: I found Israel like grapes in the wilderness
    kind: symbol
    title: Grapes in the wilderness, first figs on the tree
    body: |
      The two fruits are pictures of the Lord’s delight in Israel at the beginning. He “wants to find joy in his people as a wanderer who finds grapes in the wilderness and gathers them in.” The second image is “the first fruit on the fig tree” (NRSVUE), the earliest figs of the season. Jeremiah’s good basket holds “very good figs, even like the figs that are first ripe” ([[Jer. 24:2]]).

      Here the Lord begins to speak for Himself. The charge in the rest of the verse is measured against that delight: “like finding grapes in the wilderness, he had found Israel to be his people, but the joy did not last as Israel turned to abominations.”
    sources: [hord-not-fragile, nrsvue, lds-scriptures]
  - ref: 10
    phrase: separated themselves unto that shame
    kind: history
    title: 'Baal-peor: consecrated to shame'
    body: |
      Baal-peor is the place where, in Moses’s day, Israel joined itself to a Baal, and Hosea names it as where the fathers turned from the Lord who had found them. Numbers tells it: “Israel abode in Shittim, and the people began to commit whoredom with the daughters of Moab” ([[Num. 25:1]]), and “Israel joined himself unto Baal-peor” ([[Num. 25:3]]). Unfaithfulness of the body and unfaithfulness to God came together in that one episode.

      Hosea’s verb is a pointed one. “Separated themselves” is the Hebrew *nazar*, to “devote, dedicate oneself unto,” and it is the root that gives the Nazarite his name. A Nazarite vowed “to separate themselves unto the LORD” ([[Num. 6:2]]). At Peor Israel set itself apart to something else: they “consecrated themselves to the thing of shame” (ESV). “Shame” (*bosheth*) stands where the name Baal would. This verse is counted among the places where the word is a “shameful thing, substituted for” the god’s name.

      The last clause of the verse states the result. The King James has “their abominations were according as they loved.” The modern versions make the people the subject: they “became detestable like the thing they loved” (NRSVUE), “as vile as the thing they loved” (NIV).
    sources: [lds-scriptures, bdb, esv, nrsvue, niv]
  - ref: 13
    phrase: as I saw Tyrus
    kind: words
    title: Like Tyre, like a palm, or like prey
    body: |
      The first half of verse 13 is uncertain in Hebrew, and the versions give three different pictures. The King James and the NIV keep the city: Ephraim, “like Tyre,” is “planted in a pleasant place.” On this reading “Tyre was renowned for its glory and splendor. God had chosen Ephraim for similar blessings.”

      The NRSVUE and the ESV take the word as a tree: “Once I saw Ephraim as a young palm planted in a lovely meadow.” The NRSVUE adds “Meaning of Heb uncertain,” and the ESV keeps the other reading in its note: “Or like Tyre.” The Septuagint has neither a city nor a tree. There Ephraim “gave their children for a prey.” The Hebrew word in this verse has been judged “probably corrupt.”

      The second half of the verse is plainer: “Ephraim shall bring forth his children to the murderer.”
    sources: [ot-manual-10, niv, nrsvue, esv, lxx-rahlfs, bdb, lds-scriptures]
  - ref: 14
    phrase: give them a miscarrying womb and dry breasts
    kind: symbol
    title: The prophet’s prayer
    body: |
      Verse 14 is the prophet’s own voice breaking in on the Lord’s speech, and readers have understood the prayer in three ways. He begins, “Give them, O LORD,” stops to ask “what wilt thou give?” and then asks for barrenness.

      Some take it as a plea for the lesser evil, that God would “condemn them to barrenness rather than to the loss of the young men.” The Lord has just said that Ephraim will lead his children out to the slayer. Others hear an intercession that is cut short: the prophet “begins to make intercession for them,” and then “the prophetic light discovered to him that the petition would not be answered.” A third view denies that the prophet is pleading at all and takes the words as “expressive of holy indignation at the deep corruption of the people.” The text does not settle it.

      The verse should be read with the ones around it. Verses 11–16 say again and again that Ephraim’s children will be lost, and in verse 16 the Lord says, “yet will I slay even the beloved fruit of their womb.” These are “symbolic judgments of miscarrying wombs, dried-up breasts, and slain children.” They are also a description of what conquest did. Hosea’s language “evokes the realities and horrors of wartime atrocities against women and children to emphasize the consequences of Israel’s failure to turn to God.” Kings records such an act by one of Israel’s own kings, Menahem, against a town that would not open its gates ([[2 Kgs. 15:16]]).
    sources: [clarke-commentary, keil-hosea, hord-not-fragile, lds-scriptures]
  - ref: 15
    phrase: for there I hated them
    kind: words
    title: Hated at Gilgal, driven from the house
    body: |
      “Hated” and “love them no more” can be read in this verse as covenant words more than words of feeling. In the ancient world the terms love and hate “had less to do with emotion and more to do with a vassal’s covenantal relationship with a lord.” Those “who violated the covenant and were unfaithful to their Lord were described as ‘hated.’” This verse is one of the examples given: by their deeds “the Ephraimites were removed from God’s covenantal house or family.” Samuel the Lamanite speaks the same way of his own people before their conversion: “the Lamanites hath he hated because their deeds have been evil continually” ([[Hel. 15:4]]).

      Gilgal is named for the worship carried on there, though Hosea does not say here what was done. The place had been “a sacred city in the time of Saul; but later it was the scene of idolatrous worship,” and Hosea says of his own day, “they sacrifice bullocks in Gilgal” ([[Hos. 12:11]]). The note on [[Hos. 4:15]] tells the place’s earlier history.
    sources: [sc-knowhy-186, bd-gilgal, lds-scriptures]
  - ref: 16
    phrase: they shall bear no fruit
    kind: words
    title: Ephraim, the fruitful one, bears no fruit
    body: |
      The verse plays on Ephraim’s name, which sounds like the Hebrew for “fruit” (*peri*). Joseph named his second son Ephraim, “For God hath caused me to be fruitful in the land of my affliction” ([[Gen. 41:52]]), and Genesis there connects the name with the Hebrew verb for being fruitful. So the line says, in effect, that the fruitful one will bear no fruit. The wordplay has been pointed out in this verse, where the unfruitfulness is “deprivation of posterity.” The fruit in question is children.

      That explains the form of the judgment in verses 11–16. A tribe named for fruitfulness is punished in its fruitfulness. Verse 11 runs the stages of life backward: “no birth, no pregnancy, no conception!” (NRSVUE). Ephraim’s “glory” that flies away like a bird is its children.

      Hosea returns to the word. Besides this verse, “fruit” stands in [[Hos. 10:1]], [[Hos. 10:13]], and the book’s closing promise, where the Lord says to Ephraim, “From me is thy fruit found” ([[Hos. 14:8]]). There the Lord Himself is the source of Ephraim’s fruitfulness.
    sources: [bdb, bowen-fruit-of-loins, oshb-wlc, nrsvue, lds-scriptures]
  - ref: 17
    phrase: they shall be wanderers among the nations
    kind: scripture
    title: Wanderers among the nations
    body: |
      The chapter’s last line is the scattering of Israel, in the terms of the covenant curses. Moses had warned that “among these nations shalt thou find no ease, neither shall the sole of thy foot have rest” ([[Deut. 28:65]]).

      “Wanderers” is from *nadad*, to wander or stray, used here “of scattered Israel.” Hosea uses the verb one other time, of Israel leaving the Lord: “Woe unto them! for they have fled from me” ([[Hos. 7:13]]).

      The verse gives the reason in one clause: “because they did not hearken unto him.”

      The scattering has an end. Israel “will remain scattered until she repents and comes back to Jehovah,” and “to some extent, the tribe of Joseph is being gathered again to Jehovah’s covenant in The Church of Jesus Christ of Latter-day Saints.” Two chapters on, Hosea pictures a return from the two lands this chapter names: “They shall tremble as a bird out of Egypt, and as a dove out of the land of Assyria: and I will place them in their houses” ([[Hos. 11:11]]).
    sources: [lds-scriptures, keil-hosea, bdb, oshb-wlc, jackson-hosea-marriage]

christ: |
  The LORD who speaks in this chapter is Jehovah, whom Latter-day Saint scripture identifies as Jesus Christ before His birth. It is He who says, “I found Israel like grapes in the wilderness,” and His delight in that find stands in the same speech as His severest words. The book’s hard images are placed that way throughout: “interspersed between each of these grotesque images of consequences and judgment are depictions of God’s love and faithfulness to his people.”

  “I will love them no more” is not His last word in the book. At its end the same Lord says, “I will heal their backsliding, I will love them freely” ([[Hos. 14:4]]).

explore: |
  - **The places behind the chapter.** Baal-peor in [[Num. 25:1–5]]; Gibeah in Judges 19–20, with [[Hos. 10:9]].
  - **The answers later in the book.** Fruit in [[Hos. 14:5–8]]; love in [[Hos. 14:4]]; the return from Egypt and Assyria in [[Hos. 11:10–11]].
  - **Ephraim’s name in Hosea.** Matthew L. Bowen and Loren Blake Spendlove, [“‘Thou Art the Fruit of My Loins’: The Interrelated Symbolism and Meanings of the Names Joseph and Ephraim in Ancient Scripture”](https://interpreterfoundation.org/journal/thou-art-the-fruit-of-my-loins-the-interrelated-symbolism-and-meanings-of-the-names-joseph-and-ephraim-in-ancient-scripture), *Interpreter* 28 (2018), has a section on Hosea’s plays on the name.

