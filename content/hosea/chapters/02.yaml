chapter: 2
title: 'The Unfaithful Wife and the Betrothal'
tagline: 'The Lord brings His charge against Israel as a husband against a wife, takes back the gifts she credited to Baal, and then, where the sentence is expected, leads her into the wilderness to win her again.'
when: 'Undated. The northern kingdom’s last decades, in the 700s B.C.; the book’s only dates are in 1:1.'

setting: |
  Chapter 1 gave Hosea a wife and three children whose names were sentences on Israel: Jezreel, Lo-ruhamah (“not having obtained mercy”), and Lo-ammi (“not my people”) (see [[Hosea 1:4–9]]). Chapter 2 is a speech that begins with that household and does not stay with it. It opens in the voice of a husband speaking of his wife and children. By verse 13 it is signed “saith the LORD,” and the wife has vines, fig trees, feast days, and Baals. She is Israel, the northern kingdom, and the husband is the Lord. Hosea and Gomer are not named in the chapter.

  Verse 1 belongs with the promise that ends chapter 1. The Hebrew Bible closes its first chapter at our 1:9, so that the promise (1:10–2:1) stands at the head of the accusation, and its verse numbers run two ahead of the King James through the rest of the chapter.

  Hosea’s ministry began under Jeroboam Ⅱ, “when both kingdoms were prosperous and wealthy.” The chapter speaks of grain, wine, oil, silver, and gold in plenty (verse 8).

  The Church’s chapter heading places the reconciliation of the second half “in the last days.” Isaiah, Jeremiah, and Ezekiel take up the same figure of the Lord as husband ([[Isa. 54:5]]; [[Jer. 3:1]]; [[Ezek. 16]]).

thread: |
  The chapter is built on the word “Therefore,” which comes three times, each after a charge. Israel has thanked her lovers for the Lord’s gifts (verse 5), and “Therefore” He will hedge up her way (verse 6). She did not know who gave her the grain and the wine (verse 8), and “Therefore” He will take them back (verse 9). She “went after her lovers, and forgat me” (verse 13), and the third “Therefore” (verse 14) is the same Hebrew word as the first two. What follows it is “I will allure her.”

  From there to the end, each promise takes up something from the first half. The wilderness that was a threat (verse 3) becomes the place where He speaks to her (verse 14). The vines given to the beasts (verse 12) are given back (verse 15), and the beasts are brought into a covenant (verse 18). The Baalim to whom she burned incense (verse 13) lose even their names (verse 17). The wife who “did not know” (verse 8) is told, “thou shalt know the LORD” (verse 20). The grain, wine, and oil withdrawn in verse 9 are named again in verse 22. The three children’s names, which opened the book as judgments, close the chapter as promises (verses 22–23).

  In the second half nearly every verb is the Lord’s: “I will allure,” “I will give,” “I will take away,” “I will make a covenant,” “I will betroth,” “I will hear,” “I will sow,” “I will have mercy,” “I will say.”

sections:
  - range: 1-5
    heading: 'The case against the mother'
    plain: |
      Say to your brothers, My people, and to your sisters, You have received mercy. Plead with your mother, plead, for she is not my wife and I am not her husband. Let her put away her unfaithfulness from her face and her adulteries from between her breasts. Otherwise I will strip her naked, as bare as on the day she was born, and make her like a wilderness and a dry land, and let her die of thirst. I will have no mercy on her children, because they are children of unfaithfulness. Their mother has played the harlot; she who conceived them has acted shamefully. She said, I will go after my lovers, who give me my bread and my water, my wool and my flax, my oil and my drink.
  - range: 6-13
    heading: 'What the Lord takes back'
    plain: |
      Therefore I will block her way with thorns and build a wall, and she will not find her paths. She will chase her lovers and not catch them; she will look for them and not find them. Then she will say, I will go back to my first husband, for I was better off then than now. She did not know that it was I who gave her the grain, the wine, and the oil, and multiplied her silver and gold, which they used for Baal. Therefore I will take back my grain at harvest and my wine in its season, and take away my wool and my flax, which were given to cover her nakedness. I will uncover her lewdness in the sight of her lovers, and no one will rescue her from my hand. I will end all her rejoicing: her feasts, her new moons, her sabbaths, and all her appointed festivals. I will destroy her vines and her fig trees, which she called the wages her lovers gave her. I will make them a thicket, and the wild animals will eat them. I will punish her for the days of the Baalim, when she burned incense to them, put on her earrings and jewels, went after her lovers, and forgot me, says the Lord.
  - range: 14-17
    heading: 'Back to the wilderness'
    plain: |
      Therefore I will allure her, and bring her into the wilderness, and speak tenderly to her. From there I will give her back her vineyards, and make the valley of Achor a door of hope. She will sing there as in the days of her youth, as on the day she came up out of the land of Egypt. In that day, says the Lord, you will call me Ishi, My husband, and no longer call me Baali, My master. I will take the names of the Baalim out of her mouth, and they will not be mentioned by name again.
  - range: 18-23
    heading: 'The betrothal'
    plain: |
      In that day I will make a covenant for them with the beasts of the field, the birds of heaven, and the creeping things of the ground. I will break the bow, the sword, and battle out of the earth, and make them lie down in safety. I will betroth you to me for ever. I will betroth you to me in righteousness and in judgment, in lovingkindness and in mercies. I will betroth you to me in faithfulness, and you will know the Lord. In that day, says the Lord, I will answer the heavens, and they will answer the earth. The earth will answer the grain, the wine, and the oil, and they will answer Jezreel. I will sow her for myself in the earth. I will have mercy on her who had not obtained mercy. I will say to those who were not my people, You are my people, and they will say, You are my God.

notes:
  - ref: 2
    phrase: 'Plead with your mother, plead'
    kind: words
    title: 'A charge to bring, not an appeal'
    body: |
      “Plead” is a word of accusation here: the children are told to bring a charge against their mother. The Hebrew verb is *rib*, to strive or contend with words. Its noun is the “controversy” the Lord has with the whole land later in the book ([[Hosea 4:1]]), and “plead” has been called an inadequate translation of it, since the verb “never describes an appeal or call to repentance, but always a hostile confrontation, an accusation.” The plural “Say ye” of verse 1 “speaks to all Israel and all readers,” so that the mother is the nation and “her children are the people of Israel.” The people are asked to take the Lord’s side against what the nation has become.

      “She is not my wife, neither am I her husband” does not end the marriage. What the Lord taught through Hosea is that, though Israel had been unfaithful, He “would still not divorce them (cast them off) if they would but turn back.” So here “the Lord is not trying to divorce Israel, he is trying to reclaim her,” and the words “are not attested anywhere else in the Hebrew Bible as a formula of divorce.” Some Latter-day Saint scholars do call the sentence “essentially an announcement of divorce,” or speak of a “temporary divorce.” Either way the separation is not the last word: the chapter ends in a betrothal “for ever” (verse 19).

      The verse itself goes straight on to a demand, “let her therefore put away her whoredoms,” and the threat that follows begins with “Lest.” The third child’s name had said as much of the people: “ye are not my people, and I will not be your God” ([[Hosea 1:9]]). That repudiation of the people “is like a repudiation of a faithless wife.”
    sources: [bdb, oshb-wlc, ot-manual-10, jackson-hosea-marriage, schade-hosea-family, muhlestein-everlasting-covenant, lds-scriptures]

  - ref: 3
    phrase: 'Lest I strip her naked'
    kind: symbol
    title: 'The stripping of the wife'
    body: |
      The stripping is the husband taking back what he gave, and it pictures a land losing its harvests and a people losing their home. Verse 9 says what the clothing was: “my wool and my flax given to cover her nakedness.” Verse 3 slides from the woman to the country in the middle of a sentence (“make her as a wilderness, and set her like a dry land”), because the wife is “the prosperous and productive land of Israel,” which “sins and is punished, drying up and losing its fertility.” The rest of the list is a nation’s losses too: grain and wine at harvest (verse 9), the feasts and sabbaths (verse 11), which is “the loss of opportunity to participate in sacred acts of worship,” and the vines and fig trees (verse 12).

      “As in the day that she was born” has been read of Israel’s beginning as a people, at the Exodus, “a time when Israel had nothing and needed to rely on the Lord or perish.” Ezekiel later tells that birth at length (see the note on [[Ezek. 16:4]]). The wilderness of verse 3 has been read as the captivity, and Assyria’s destruction of the kingdom as the beginning of the fulfilment.

      These verses are hard to read: “the treatment of the cheating wife in the parable is distressing.” Three things help. The imagery is symbolic. The shame answers the offence: “Just as Israel had exposed her nakedness to others, God would strip her naked, making her an object of shame.” And the threats are not to be read without the grief that stands beside them in the same speech, in “she did not know that I gave her” (verse 8) and “forgat me” (verse 13): the two “must be set side by side and evaluated together.”
    sources: [schade-hosea-family, hord-not-fragile, ot-manual-10, lds-scriptures]

  - ref: 5
    phrase: 'I will go after my lovers'
    kind: history
    title: 'Who the lovers are'
    body: |
      The lovers are the Baals, the gods of Canaan, whom Israel thanked for her harvests. The chapter names them itself: the “days of Baalim” on which she burned incense (verse 13) and “the names of Baalim” in her mouth (verse 17). Baal was “the male or generative principle in nature,” worshipped “with different ideas and rites (compare the plural Baalim) in different places.”

      The appeal was practical. In Canaanite religion “the productivity of land and cattle is assured through worship of the deified forces of nature,” and it was the fertility of the Canaanites’ flocks and fields, “apparently elicited from the gods and goddesses of fertility,” that drew Israel’s farmers. So the list in this verse is a farmer’s list: bread and water, wool and flax, oil and drink. In verse 12 she calls her vines and fig trees “my rewards that my lovers have given me,” which a modern translation renders “my wages.” The figure is of a woman who is paid, “not only as an adulteress but as a prostitute.” What she took as pay were “blessings that come only from the true husband.”

      The lovers have also been read more widely: as “the priests, priestesses, and idols of the Canaanite temples,” and as foreign powers, since the warning “refers not only to idolatry but also to political alliances not sanctioned by the Lord.” Hosea does use the word that way later: “they are gone up to Assyria, a wild ass alone by himself: Ephraim hath hired lovers” ([[Hosea 8:9]]). In this chapter the Baals are the ones named.
    sources: [bd-baal, jackson-hosea-marriage, ot-manual-10, schade-hosea-family, esv, lds-scriptures]

  - ref: 8
    phrase: 'she did not know that I gave her corn, and wine, and oil'
    kind: scripture
    title: 'Gifts the covenant had promised'
    body: |
      The grain, wine, and oil that Israel credited to Baal are the three things Moses had named as the Lord’s blessing on the land. If Israel kept the covenant, He would “bless the fruit of thy womb, and the fruit of thy land, thy corn, and thy wine, and thine oil” ([[Deut. 7:13]]), and would send rain “that thou mayest gather in thy corn, and thy wine, and thine oil” ([[Deut. 11:14]]). Hosea uses the same three Hebrew words in the same order. Moses had also said what would follow if they turned to other gods: the Lord would “shut up the heaven, that there be no rain, and that the land yield not her fruit” ([[Deut. 11:17]]). In verse 9 the grain and the wine are taken back, and each is called “my.”

      “Which they prepared for Baal” is, in a modern translation, “which they used for Baal.” The book says later what was done with the metal: “of their silver and their gold have they made them idols” ([[Hosea 8:4]]).

      The charge in this verse is that she “did not know” the giver. It has been heard as a lament and not only an indictment (“Hear the heartache of Israel’s God!”). The same verb comes back as the last word of the betrothal (see the note on [[Hosea 2:20]]).
    sources: [lds-scriptures, oshb-wlc, esv, hord-not-fragile]

  - ref: 14
    phrase: 'I will allure her, and bring her into the wilderness'
    kind: symbol
    title: 'Courtship in the wilderness'
    body: |
      After the third “Therefore” the Lord does not sentence Israel but courts her, in the place where He first made her His. The verb “allure” (*pathah*) is used of persuading a woman, and in this verse it means “persuade.” “Speak comfortably unto her” is in Hebrew to speak upon her heart, and a modern translation has “speak tenderly to her.” The same phrase is used of a husband who went after a wife who had left him, “to speak friendly unto her, and to bring her again” ([[Judg. 19:3]]), and it is the phrase that opens Isaiah’s message of comfort (see the note on [[Isa. 40:2]]).

      The wilderness is the surprise. In verse 3 it was the threat. But the wilderness was also where the marriage began: it “refers to the Sinai desert, where God established the covenant with the Israelites. The marriage was performed there and the honeymoon took place there.” Jeremiah has the Lord remember it so: “the love of thine espousals, when thou wentest after me in the wilderness” ([[Jer. 2:2]]). Verse 15 makes the comparison itself, “as in the day when she came up out of the land of Egypt,” and the promise is that “just as in the days of the Exodus, Israel will be led to safety and back into the covenant.”

      The loss of everything in verses 9–13 serves the courtship of verse 14. The Lord takes Israel to the wilderness “where he will remind them of what kind of love is possible when they turn to him.” This is one of the verses behind the summary that in Hosea “all His chastisements are inflicted in love.”
    sources: [bdb, oshb-wlc, esv, jackson-hosea-marriage, schade-hosea-family, hord-not-fragile, bd-hosea, lds-scriptures]

  - ref: 15
    phrase: 'the valley of Achor for a door of hope'
    kind: history
    title: 'The valley of trouble'
    body: |
      Achor means “trouble,” and the valley was named for Achan’s sin, just after Israel entered the promised land. After Jericho fell, Achan “took of the accursed thing: and the anger of the LORD was kindled against the children of Israel” ([[Josh. 7:1]]), and the army was beaten at Ai. Achan was found out and taken with all he had to this valley, where he was put to death. “So the LORD turned from the fierceness of his anger. Wherefore the name of that place was called, The valley of Achor, unto this day” ([[Josh. 7:26]]). The word is found in the Old Testament only as this valley’s name.

      Hosea mentions the place “with an evident allusion to the occurrence described in Joshua 7.” When Israel comes up from the wilderness a second time, the valley whose name recalled trouble at the threshold of the land will be the way in. On one reading the valley was already a memorial of “how the Lord restores His favour” after guilt has been dealt with. Another reading sets the door of hope after Israel’s “purging and repentance.”

      The vineyards given “from thence” are the vines of verse 12, “the vineyards which it formerly possessed.” Isaiah later makes the same valley a pasture: “the valley of Achor a place for the herds to lie down in, for my people that have sought me” ([[Isa. 65:10]]).
    sources: [lds-scriptures, bdb, keil-hosea, jackson-hosea-marriage]

  - ref: 16
    phrase: 'thou shalt call me Ishi; and shalt call me no more Baali'
    kind: words
    title: 'Why the name Baali had to go'
    body: |
      Both names mean “my husband,” but *baal* was also the god’s name. *Ishi* is from the ordinary word for a man or husband; it is the word in verse 2, “neither am I her husband.” *Baal* meant “possessor, lord,” and *Baali* “also means ‘my husband’ but means as well ‘my Baal.’”

      Verse 17 makes the reason explicit: “I will take away the names of Baalim out of her mouth.” The law had asked for exactly that: “make no mention of the name of other gods, neither let it be heard out of thy mouth” ([[Ex. 23:13]]). Israel’s own names show the same aversion at work. The word became “utterly abominable from its associations,” so that “its use was abjured and Bosheth (shame) was substituted in names compounded with it.”

      The word *baal* “expresses the relation between lord and slave.” The name the Lord keeps is the other one.
    sources: [bd-baal, jackson-hosea-marriage, oshb-wlc, lds-scriptures]

  - ref: 18
    phrase: 'a covenant for them with the beasts of the field'
    kind: scripture
    title: 'Peace with the animals'
    body: |
      The covenant with the animals has been read as reaching back to the Creation, and it takes in “the beasts of the field” that ate Israel’s ruined vines in verse 12. The list (beasts, birds, creeping things) follows the order of the creation account, and on that reading the verse is “a return to the harmony that existed in creation” and “points to the millennial reign of the Lord and the earth’s paradisiacal glory.”
    sources: [schade-hosea-family]

  - ref: 19
    phrase: 'I will betroth thee unto me for ever'
    kind: symbol
    title: 'A betrothal and its bride-gift'
    body: |
      The Lord betroths Israel as a man betrothed a bride, and the five things named after “in” are what He brings to the marriage. The verb (*aras*) is used of a man betrothing a woman, and in Israel a betrothal was a binding commitment, the last step before the marriage itself. David uses the verb of Michal, “which I espoused to me for an hundred foreskins of the Philistines” ([[2 Sam. 3:14]]). The “for” there and the “in” here are the same Hebrew preposition. In David’s sentence it marks the “price paid to father,” and in Hosea’s the “gift to bride.” Righteousness, judgment, lovingkindness, mercies, and faithfulness stand where the bride-gift stands. They are what the Bridegroom gives, a description of “the attributes which God would thereby unfold” to make the covenant last, and the faithfulness is God’s.

      “I will betroth” is said three times, and the first adds “for ever.” The reunion is “permanent,” and what is promised is “the new and everlasting covenant restored to Israel in the latter days.”

      The verb has also been taken to say something about the bride. On one reading it “is only applied to the wooing of a maiden, not to the restoration of a wife who has been divorced,” and so points “to an entirely new marriage.”
    sources: [bdb, oshb-wlc, keil-hosea, scripture-helps-hosea, jackson-hosea-marriage, ot-manual-10, lds-scriptures]

  - ref: 19
    phrase: 'in lovingkindness'
    kind: prophets
    title: 'Hesed, the love inside a covenant'
    body: |
      “Lovingkindness” translates *hesed*, the love that belongs to a covenant. President Russell M. Nelson taught that the word “has no adequate English equivalent,” and described it this way: “Hesed is a unique term describing a covenant relationship in which both parties are bound to be loyal and faithful to each other.” Latter-day Saint scholars have called it “a kind of mercy and love available only within a covenant,” and “the kind of love that translates into action, a key requirement of a successful marriage.”

      In this verse the Lord gives it. Later in the book He looks for it in Israel and does not find it: the same Hebrew word is the “mercy” of “there is no truth, nor mercy, nor knowledge of God in the land” ([[Hosea 4:1]]).

      The word beside it, “mercies,” is a different one, “compassion,” used “usually of God.”
    sources: [nelson-everlasting-covenant, muhlestein-everlasting-covenant, jackson-hosea-marriage, oshb-wlc, bdb, lds-scriptures]

  - ref: 20
    phrase: 'thou shalt know the LORD'
    kind: words
    title: 'To know the Lord'
    body: |
      To “know” the Lord here is the knowing that belongs to a marriage, and it is what the first half of the chapter said was missing. The wife “did not know that I gave her” (verse 8) and “forgat me” (verse 13). The betrothal ends with the same verb turned around.

      In this book the word carries more than information. It is “used to describe the exclusive intimacy of the covenant bond,” the closest relationship there is between two persons, and Hosea uses it of the Lord and Israel at the beginning: “I did know thee in the wilderness, in the land of great drought” ([[Hosea 13:5]]).

      The betrothal also answers the charge that opens chapter 4, “there is no truth, nor mercy, nor knowledge of God in the land” ([[Hosea 4:1]]). “Each of the three terms” of that charge is found in verses 19–20: “mercy” there is the *hesed* translated “lovingkindness” here; “faithfulness” here “comes from the same root, and means essentially the same thing, as ‘truth’” there; and the knowing of God is in both.
    sources: [jackson-hosea-marriage, oshb-wlc, lds-scriptures]

  - ref: 21
    phrase: 'I will hear the heavens, and they shall hear the earth'
    kind: words
    title: 'A chain of answers'
    body: |
      “Hear” is the Hebrew verb “answer,” and these two verses are a chain of answers that begins with the Lord. A modern translation keeps the verb, “I will answer the heavens,” and so down the chain. It is the verb used “of God answering (graciously).” The Lord answers the heavens, and they answer the earth; the earth answers the grain, the wine, and the oil; and they answer Jezreel.

      The verses do not explain the figure. The grain, the wine, and the oil are the three gifts Israel had credited to Baal in verse 8 and lost in verse 9 (see the note on [[Hosea 2:8]]).
    sources: [oshb-wlc, bdb, esv]

  - ref: 22
    phrase: 'they shall hear Jezreel'
    kind: symbol
    title: 'Jezreel, the name turned around'
    body: |
      Jezreel means “God sows,” and the next words, “I will sow her unto me in the earth,” turn a name of judgment into a promise. When the first child was named, Jezreel meant blood to be avenged and a bow broken in a valley (see [[Hosea 1:4–5]]). Here the name is taken at its meaning. The verb in “I will sow her” is the verb inside the name, used of the Lord’s “sowing (planting) Israel in the land.”

      Scattering has been heard in the name as well: Hosea “plays on the name Jezreel, meaning both ‘God shall scatter’ … and ‘God shall sow.’” On this reading the scattering of Israel was a planting from the start: “Israel will be sown with the intent to be gathered, obtain mercy, and become the Lord’s people once again through the covenant.” Another reading keeps to the land: the name is used “to depict the restoration of Israel in the land.”

      She is sown “unto me.” Chapter 1 had already promised this turn: “great shall be the day of Jezreel” ([[Hosea 1:11]]).
    sources: [bdb, oshb-wlc, schade-hosea-family, jackson-hosea-marriage, lds-scriptures]

  - ref: 23
    phrase: 'I will say to them which were not my people, Thou art my people'
    kind: scripture
    title: 'The last two names, and how Paul and Peter use them'
    body: |
      The chapter ends by taking the “not” off the other two children’s names, and the New Testament applies the words to Gentiles brought into the covenant. In Hebrew the verse says the names outright: mercy for Lo-ruhamah, and Lo-ammi told that he is Ammi. The answer, “Thou art my God,” completes the pair of sentences that scripture uses again and again for the covenant itself, so that the relationship at “the core of God’s dealings with Israel is now restored once again.” Verse 1 had already told the children to use the new names of each other.

      In Hosea the people addressed are the northern kingdom, cast off in [[Hosea 1:9]] and gathered again. Paul quotes the verse of a wider company, those God has called “not of the Jews only, but also of the Gentiles” ([[Rom. 9:24]]): “I will call them my people, which were not my people; and her beloved, which was not beloved” ([[Rom. 9:25]]), and he goes on to quote the companion verse (see [[Hosea 1:10]]). Peter uses the same words: “Which in time past were not a people, but are now the people of God: which had not obtained mercy, but now have obtained mercy” ([[1 Pet. 2:10]]).
    sources: [jackson-hosea-marriage, oshb-wlc, lds-scriptures]

christ: |
  President Henry B. Eyring said of these chapters that “the husband was a metaphor for Jehovah, Jesus Christ.” Isaiah says who the husband is: “thy Maker is thine husband; the LORD of hosts is his name; and thy Redeemer the Holy One of Israel” ([[Isa. 54:5]]).

  What the chapter shows of Him is how He acts toward a people who have left: when the charges are finished, He is the one who goes after her (verse 14). The gifts of the betrothal are His: righteousness, judgment, lovingkindness, mercies, and faithfulness (see the note on [[Hosea 2:19]]), and what she receives is to know Him (verse 20). Israel’s restoration “shall be due to His love.”

explore: |
  - The names as they were first given, and the promise that already reversed them: [[Hosea 1:2–11]].
  - The same story told as a purchase: [[Hosea 3:1–5]].
  - The charge that the betrothal answers: [[Hosea 4:1–6]].
  - The wife in the later prophets: [[Jer. 2:2]]; [[Jer. 3:1–14]]; [[Ezek. 16]]; and Isaiah’s theme page [Zion and Her Husband](/isaiah/themes/zion-and-her-husband/).
  - A new covenant in which “they shall all know me”: [[Jer. 31:31–34]].
  - Paul and Peter on “not my people”: [[Rom. 9:22–26]]; [[1 Pet. 2:9–10]].

