summary: >-
  Hosea charges a people whose devotion has passed like morning cloud and early dew,
  and he calls them to break up their fallow ground. The book ends with the Lord's
  answer, that He will heal them, love them freely, and be as the dew to Israel, so
  that Israel blossoms like the lily. The image rests on that turn from what vanishes
  to what is given.
motifs:
  - A small cluster of white lilies in bloom at the foot of the olive tree, with only a soft sheen of dew on the leaves (Hosea 14:5).
  - An old, gnarled olive tree with silver-green leaves, the one large form in the scene (Hosea 14:6).
  - A grapevine heavy with grapes along a low dry-stone terrace wall (Hosea 14:7).
  - Dry, crumbly red-brown earth around the lilies, loosened by hand, with dry grass and small wildflowers and a few half-buried stones (Hosea 10:12).
  - Morning cloud lying along distant low hills at sunrise, the vanishing goodness of Hosea 6:4.
  - A single plain dove in flight, coming in from the far hills (Hosea 11:11).
composition: >-
  A stony terraced hillside in ancient Israel at first light. The olive tree fills
  the left of the frame with the lilies at its foot as the focal point, lit by low
  gold light; the terrace wall and its vine run across the middle ground. Low hills
  with cloud lying in their folds sit far behind, the sun rising at the right, and
  the dove small against the open sky. Nothing modern, no buildings, no figures.
alt: White lilies bloom beneath an old olive tree on a stony hillside at sunrise, beside red earth and dry grass; a vine with grapes runs along a stone wall, a dove flies in, and morning cloud lies along the distant hills.
