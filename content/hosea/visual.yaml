summary: >-
  Hosea charges a people whose devotion has passed like morning cloud and early dew,
  and he calls them to break up their fallow ground. The book ends with the Lord's
  answer, that He will heal them, love them freely, and be as the dew to Israel, so
  that Israel blossoms like the lily. The image rests on that turn from what vanishes
  to what is given.
motifs:
  - A small cluster of white lilies in bloom, bright with dew, rising from the ground at the center of the scene (Hosea 14:5).
  - Freshly broken furrows of dark clay soil in the foreground, soft and open, as ground made ready (Hosea 10:12).
  - A thin morning cloud lifting and thinning above distant low hills, the vanishing goodness of Hosea 6:4, while the dew stays on the lilies.
composition: >-
  A wide, quiet field at first light. Warm broken furrows lead the eye from the lower
  left toward the lilies, which stand just off center in the middle ground as the one
  clear focal point, lit by low gold light. Low, rounded hills sit far behind, with a
  single pale cloud thinning above them. No buildings, trees, or figures; most of the
  frame is open sky and open ground.
alt: White lilies with dew on their petals bloom in a plowed field at sunrise, with low hills and a thin morning cloud behind them.
status: proposed
