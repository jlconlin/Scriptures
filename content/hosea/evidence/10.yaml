  # ---------- note 10:11 ----------
  - where: 'note 10:11 “The heifer that liked threshing”'
    claim: 'The lexicon: a trained heifer, a simile of Ephraim; heifers were used in threshing and ploughing'
    key: bdb
    url: 'https://biblehub.com/hebrew/5697.htm'
    quote: 'a trained heifer (simile of Ephraim)'
  - where: 'note 10:11 “The heifer that liked threshing”'
    claim: 'The threshing animal was not muzzled, so it ate as it worked'
    key: clarke-commentary
    url: 'https://biblehub.com/commentaries/clarke/hosea/10.htm'
    quote: 'Goes peaceably in the yoke; and is pleased because, not being muzzled, she eats of the corn.'
  - where: 'note 10:11 “The heifer that liked threshing”'
    claim: 'The passing over the neck is read as bringing the yoke on it, for plough and harrow; the yoke is taken to be Assyria’s'
    key: clarke-commentary
    url: 'https://biblehub.com/commentaries/clarke/hosea/10.htm'
    quote: 'I brought the yoke upon it, that she should not tread out the corn merely, but draw the plough and drag the harrow.'
  - where: 'note 10:11 “The heifer that liked threshing”'
    claim: 'The yoke as that of the Assyrians'
    key: clarke-commentary
    url: 'https://biblehub.com/commentaries/clarke/hosea/10.htm'
    quote: 'be put under the yoke, namely, that of the Assyrians'
  - where: 'note 10:11 “The heifer that liked threshing”'
    claim: 'NIV: “so I will put a yoke on her fair neck. I will drive Ephraim”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2010&version=NIV'
    quote: 'I will drive Ephraim'
  - where: 'note 10:11 “The heifer that liked threshing”'
    claim: 'NIV: a yoke on her fair neck'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2010&version=NIV'
    quote: 'on her fair neck'
  - where: 'note 10:11 “The heifer that liked threshing”'
    claim: 'NRSVUE: “and I spared her fair neck, but I will make Ephraim break the ground”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2010&version=NRSVUE'
    quote: 'and I spared her fair neck'
  - where: 'note 10:11 “The heifer that liked threshing”'
    claim: 'NRSVUE: “I will make Ephraim break the ground”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2010&version=NRSVUE'
    quote: 'but I will make Ephraim break the ground'
