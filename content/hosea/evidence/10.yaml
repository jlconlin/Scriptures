    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'That law is the law of righteousness; those who sow righteousness, reap mercy. (Hos. 10:12.)'
  - where: 'note 10:12 “The harvest is hesed”'
    claim: 'The manual: what one receives depends on where one put one’s trust'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'What one does is a result of where one puts one’s trust.'
  - where: 'note 10:12 “The harvest is hesed”'
    claim: 'Jeremiah 4:3 has the same command'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/4?lang=eng'
