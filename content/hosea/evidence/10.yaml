  - where: 'note 10:12 “The harvest is hesed”'
    claim: 'The manual prints Elder McConkie: mercy is granted to those who comply with the law'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'to those who comply with the law upon which its receipt is predicated'

  # ---------- note 10:12 (rain) ----------
  - where: 'note 10:12 “Until He comes and rains righteousness”'
    claim: 'God gives the rain of righteousness as rain for the seed, and must create righteousness in a person by His Spirit'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/10.htm'
    quote: 'God causes righteousness to rain, inasmuch as He not only gives strength to secure it, like rain for the growth of the seed'
  - where: 'note 10:12 “Until He comes and rains righteousness”'
    claim: 'He must also create it in man by His Spirit'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/10.htm'
    quote: 'but must also generate and create it in man by His Spirit'
  - where: 'note 10:12 “Until He comes and rains righteousness”'
    claim: 'The verb is yarah (H3384), which in Hosea stands only in 6:3 and 10:12 (hebrew.mjs hosea --word 3384)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'יֹרֶ֥ה'
  - where: 'note 10:12 “Until He comes and rains righteousness”'
    claim: 'In Hosea 6:3 the same root is the noun for the former rain'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'י֥וֹרֶה'
  - where: 'note 10:12 “Until He comes and rains righteousness”'
    claim: 'The lexicon reads the verb here as “rain”'
    key: bdb
    url: 'https://biblehub.com/hebrew/3384.htm'
    quote: 'Hosea 10:12 and rain righteousness for you'
  - where: 'note 10:12 “Until He comes and rains righteousness”'
    claim: 'The same verb commonly means to teach or instruct'
    key: bdb
    url: 'https://biblehub.com/hebrew/3384.htm'
    quote: 'To throw, shoot, cast, direct, instruct, teach'
  - where: 'note 10:12 “Until He comes and rains righteousness”'
    claim: 'The Septuagint reads the verse differently and has no rain in it'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/hosea/10.htm'
    quote: 'seek the Lord till the fruits of righteousness come upon you'
  - where: 'note 10:12 “Until He comes and rains righteousness”'
    claim: 'NRSVUE: “that he may come and rain righteousness upon you”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2010&version=NRSVUE'
    quote: 'that he may come and rain righteousness upon you'
  - where: 'note 10:12 “Until He comes and rains righteousness”'
    claim: 'Hosea 6:3, the people’s words about the Lord coming as rain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/6?lang=eng'
    quote: 'he shall come unto us as the rain'

  # ---------- note 10:14 (Shalman) ----------
  - where: 'note 10:14 “Shalman and Beth-arbel are not known”'
    claim: 'Another guess: Gideon’s victory over Zalmunna, general of the Midianites'
    key: clarke-commentary
    url: 'https://biblehub.com/commentaries/clarke/hosea/10.htm'
    quote: "Some think that this refers to Jerubbaal, or Gideon's victory over Zalmunna, general of the Midianites"
  - where: 'note 10:14 “Shalman and Beth-arbel are not known”'
    claim: 'The manual gives the guess that Shalman is Shalmaneser and Beth-arbel the city Arbela'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'Shalman may be Shalmaneser and Beth-arbel may be the Armenian city Arbela, which Shalmaneser destroyed while still a general under Tiglath-pileser'
  - where: 'note 10:14 “Shalman and Beth-arbel are not known”'
    claim: 'The commentary the manual cites reports that guess and another (Gideon and Zalmunna) and judges the history unknown'
    key: clarke-commentary
    url: 'https://biblehub.com/commentaries/clarke/hosea/10.htm'
    quote: 'I think the history to which this refers is unknown. It seems that it was distinguished by some remarkable ferocities.'
  - where: 'note 10:14 “Shalman and Beth-arbel are not known”'
    claim: 'The same commentary on the mother and children: when, where and by whom is unknown'
    key: clarke-commentary
    url: 'https://biblehub.com/commentaries/clarke/hosea/10.htm'
    quote: 'But when, where, how, and by whom, still remain unknown.'
  - where: 'note 10:14 “Shalman and Beth-arbel are not known”'
    claim: 'The lexicon calls the name doubtful and records a Moabite prince Salamanu in Assyrian records as another candidate'
    key: bdb
    url: 'https://biblehub.com/hebrew/8020.htm'
    quote: 'Assyrian Salamanu, of Moabite prince'
  - where: 'note 10:14 “Shalman and Beth-arbel are not known”'
    claim: 'The lexicon on Beth-arbel: perhaps Arbel near Pella east of the Jordan, or in Galilee'
    key: bdb
    url: 'https://biblehub.com/hebrew/1009.htm'
    quote: 'perhaps Arbel near Pella (east of Jordan)'
  - where: 'note 10:14 “Shalman and Beth-arbel are not known”'
    claim: 'The Septuagint reads the names as Solomon and Jeroboam'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/hosea/10.htm'
    quote: 'as a prince Solomon departed out of the house of Jeroboam'
  - where: 'note 10:14 “Shalman and Beth-arbel are not known”'
    claim: 'The Church’s footnote on “Shalman” points to 2 Kings 17:3, Shalmaneser’s coming against Hoshea'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/17?lang=eng'
    quote: 'Against him came up Shalmaneser king of Assyria'

  - where: 'note 10:14 “Shalman and Beth-arbel are not known”'
    claim: 'The lexicon marks the name as doubtful'
    key: bdb
    url: 'https://biblehub.com/hebrew/8020.htm'
    quote: 'dubious'
  - where: 'note 10:14 “Shalman and Beth-arbel are not known”'
    claim: 'Or Beth-arbel in Galilee'
    key: bdb
    url: 'https://biblehub.com/hebrew/1009.htm'
    quote: 'but in Galilee'

  # ---------- note 10:14 (mother and children) ----------
  - where: 'note 10:14 “The mother and her children”'
    claim: 'The images describe what the cities will face on their present course'
    key: hord-not-fragile
    url: 'https://rsc.byu.edu/vol-23-no-1-2022/god-not-fragile'
    quote: 'will face if they continue on their current trajectory'
  - where: 'note 10:14 “The mother and her children”'
    claim: 'Assyria’s armies were savage and brutal'
    key: ot-manual-kings-d
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-d?lang=eng'
    quote: 'They were savage and brutal as well.'
  - where: 'note 10:14 “The mother and her children”'
    claim: 'An Israelite king, Menahem, ripped up the women with child at Tiphsah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'all the women therein that were with child he ripped up'
  - where: 'note 10:14 “The mother and her children”'
    claim: 'The severe images are set between depictions of God’s love and of the relationship He wants and Israel rejects'
    key: hord-not-fragile
    url: 'https://rsc.byu.edu/vol-23-no-1-2022/god-not-fragile'
    quote: 'interspersed between each of these grotesque images of consequences and judgment are depictions of God’s love and faithfulness to his people—the relationship that he wants but that Israel rejects'
  - where: 'note 10:14 “The mother and her children”'
    claim: 'The article names 10:12–15 among the passages on the destruction of women and children and says such symbols do not justify violence'
    key: hord-not-fragile
    url: 'https://rsc.byu.edu/vol-23-no-1-2022/god-not-fragile'
    quote: 'These symbols are not justifications of violence against women'
  - where: 'note 10:14 “The mother and her children”'
    claim: 'Hosea 13:16 says the same of Samaria (the Church’s footnote on “dashed” points to it)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/10?lang=eng'
    quote: 'Hosea 13:16 (15–16)'

