chapter: 8
claims:
  # ---------- when ----------
  - where: 'when'
    claim: 'Hosea lived in the northern kingdom’s time of decline'
    key: bd-hosea
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hosea?lang=eng'
    quote: 'He lived during a time of national decline and ruin, the result of the sin of Israel.'
  - where: 'when'
    claim: 'He began to prophesy late in the reign of Jeroboam Ⅱ (the 700s B.C.); the Bible Dictionary places his death before 736 B.C.'
    key: bd-hosea
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hosea?lang=eng'
    quote: 'He probably died before the accession of Pekah, 736 B.C.'

  # ---------- setting ----------
  - where: 'setting'
    claim: 'Chapter 5 has an alarm with horn and trumpet at verse 8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/5?lang=eng'
    quote: 'Blow ye the cornet in Gibeah, and the trumpet in Ramah'
  - where: 'setting'
    claim: 'The trumpet of verse 1 is the shofar, the ram’s horn'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/8?lang=eng'
    quote: 'HEB shofar, or ram’s horn.'
  - where: 'setting'
    claim: 'Ephraim stands for the northern kingdom, after its dominant tribe'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'Thus, as used here, Judah means the Southern Kingdom, and Ephraim the Northern Kingdom.'
  - where: 'setting'
    claim: 'The kings of the north reigned in Samaria'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'began Menahem the son of Gadi to reign over Israel, and reigned ten years in Samaria'
  - where: 'setting'
    claim: 'Shallum took the throne by killing the king'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'And Shallum the son of Jabesh conspired against him, and smote him before the people, and slew him, and reigned in his stead.'
  - where: 'setting'
    claim: 'Menahem took the throne by killing Shallum'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'smote Shallum the son of Jabesh in Samaria, and slew him, and reigned in his stead'
  - where: 'setting'
    claim: 'Pekah took the throne by killing the king'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'But Pekah the son of Remaliah, a captain of his, conspired against him, and smote him in Samaria'
  - where: 'setting'
    claim: 'Hoshea the son of Elah (the king) took the throne by killing Pekah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'And Hoshea the son of Elah made a conspiracy against Pekah the son of Remaliah, and smote him, and slew him, and reigned in his stead'
  - where: 'setting'
    claim: 'Hosea the prophet is the son of Beeri, so a different man from king Hoshea the son of Elah'
    key: bd-hosea
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hosea?lang=eng'
    quote: 'Son of Beeri, and the only prophet of the northern kingdom who has left written prophecies.'
  - where: 'setting'
    claim: 'Jeroboam (the son of Nebat) made two golden calves and set them at Bethel and Dan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/12?lang=eng'
    quote: 'And he set the one in Beth-el, and the other put he in Dan.'
  - where: 'setting'
    claim: 'Hosea still speaks of the calves'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/10?lang=eng'
    quote: 'The inhabitants of Samaria shall fear because of the calves of Beth-aven'
  - where: 'setting'
    claim: 'Menahem paid the king of Assyria for his support'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'Menahem gave Pul a thousand talents of silver, that his hand might be with him to confirm the kingdom in his hand.'
  - where: 'setting'
    claim: 'King Hoshea sent messengers to Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/17?lang=eng'
    quote: 'for he had sent messengers to So king of Egypt, and brought no present to the king of Assyria'
  - where: 'setting'
    claim: 'Assyria took Samaria and carried Israel away'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/17?lang=eng'
    quote: 'In the ninth year of Hoshea the king of Assyria took Samaria, and carried Israel away into Assyria'
  - where: 'setting'
    claim: 'The rest of Israel was carried captive in 721 B.C.'
    key: bd-captivities
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng'
    quote: 'in 721 B.C. Sargon Ⅱ carried into captivity the rest of Israel (2 Kgs. 17:3), placing them at Halah, Habor, etc.'
  - where: 'setting'
    claim: 'King Limhi gives a saying about sowing and reaping the whirlwind as the Lord’s word'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/7?lang=eng'
    quote: 'And again, he saith: If my people shall sow filthiness they shall reap the chaff thereof in the whirlwind; and the effect thereof is poison.'
  - where: 'setting'
    claim: 'The Savior closes the Sermon on the Mount with people who claim Him and are not known by Him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/7?lang=eng'
    quote: 'And then will I profess unto them, I never knew you: depart from me, ye that work iniquity.'
  - where: 'setting'
    claim: 'Verses 1 and 13 are marked as uncertain in Hebrew by a modern translation'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%208&version=NRSVUE'
    quote: 'Meaning of Heb uncertain'

  # ---------- thread ----------
  - where: 'thread'
    claim: 'The verb “make” (asah, H6213) stands in verse 4, “made them idols” (hebrew.mjs hosea 8:4; --word 6213)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'עָשׂ֤וּ'
  - where: 'thread'
    claim: 'The same verb stands in verse 6, “the workman made it” (hebrew.mjs hosea 8:6)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'עָשָׂ֔/הוּ'
  - where: 'thread'
    claim: 'The same verb is behind “yield” in verse 7, twice (hebrew.mjs hosea 8:7)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'יַֽעֲשֶׂה'
  - where: 'thread'
    claim: '“His Maker” in verse 14 is a participle of the same verb, with a suffix (hebrew.mjs hosea 8:14: H6213a, HVqrmsc/Sp3ms)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'עֹשֵׂ֗/הוּ'
  - where: 'thread'
    claim: 'The verb “know” (yada, H3045) is in verse 2, “we know thee” (hebrew.mjs hosea 8:2)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'יְֽדַעֲנ֖וּ/ךָ'
  - where: 'thread'
    claim: 'The same verb is in verse 4, “I knew it not” (hebrew.mjs hosea 8:4)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'יָדָ֑עְתִּי'

  # ---------- sections ----------
  - where: 'section 2 plain'
    claim: '“I knew it not” means that He did not acknowledge them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/8?lang=eng'
    quote: 'IE I acknowledged them not.'
  - where: 'section 2 plain'
    claim: 'The calf is rejected (one rendering of the first clause of verse 5)'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%208&version=NRSVUE'
    quote: 'Your calf is rejected, O Samaria.'
  - where: 'section 2 plain'
    claim: '“Ere they attain to innocency” can be “before they become clean”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/8?lang=eng'
    quote: 'OR before they become clean.'
  - where: 'section 4 plain'
    claim: '“Temples” in verse 14 can be palaces or great buildings'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/8?lang=eng'
    quote: 'OR palaces or great buildings.'
  - where: 'section 4 plain'
    claim: '“Fenced” cities are fortified cities'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/8?lang=eng'
    quote: 'OR fortified.'
  - where: 'section 4 plain'
    claim: '“Visit their sins” is to punish them; the “palaces” the fire devours are strongholds'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%208&version=NRSVUE'
    quote: 'and it shall devour his strongholds.'

  # ---------- note 8:1 ----------
  - where: 'note 8:1 “A bird of prey over the Lord’s house”'
    claim: 'The first sentence of verse 1 is an exclamation without a verb'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/8.htm'
    quote: 'The first sentence of Hosea 5:1 is an exclamation, and therefore has no verb.'
  - where: 'note 8:1 “A bird of prey over the Lord’s house”'
    claim: 'Keil’s literal rendering of the second clause'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/8.htm'
    quote: 'Like an eagle upon the house of Jehovah!'
  - where: 'note 8:1 “A bird of prey over the Lord’s house”'
    claim: 'The NRSVUE renders the clause with a vulture over the house'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%208&version=NRSVUE'
    quote: 'One like a vulture is over the house of the Lord,'
  - where: 'note 8:1 “A bird of prey over the Lord’s house”'
    claim: 'The NRSVUE marks verse 1 as uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%208&version=NRSVUE'
    quote: '8.1 Meaning of Heb uncertain'
  - where: 'note 8:1 “A bird of prey over the Lord’s house”'
    claim: 'The Hebrew nesher (H5404) is a griffon-vulture or eagle'
    key: bdb
    url: 'https://biblehub.com/hebrew/5404.htm'
    quote: 'griffon-vulture, eagle'
  - where: 'note 8:1 “A bird of prey over the Lord’s house”'
    claim: 'The trumpet is the shofar, the ram’s horn'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/8?lang=eng'
    quote: 'HEB shofar, or ram’s horn.'
  - where: 'note 8:1 “A bird of prey over the Lord’s house”'
    claim: 'The eagle is one of the covenant curses of Deuteronomy 28'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/28?lang=eng'
    quote: 'The Lord shall bring a nation against thee from far, from the end of the earth, as swift as the eagle flieth'
  - where: 'note 8:1 “A bird of prey over the Lord’s house”'
    claim: 'The simile points back to Deuteronomy 28:49'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/8.htm'
    quote: 'points back to the threat of Moses in Deuteronomy 28:49'
  - where: 'note 8:1 “A bird of prey over the Lord’s house”'
    claim: 'The shrines of the north held Jeroboam’s calves'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/12?lang=eng'
    quote: 'So did he in Beth-el, sacrificing unto the calves that he had made'
  - where: 'note 8:1 “A bird of prey over the Lord’s house”'
    claim: 'One reading: the house of the Lord is Israel itself, as in Hosea 9:15'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/8.htm'
    quote: 'but Israel was the house of Jehovah, as being a portion of the congregation of the Lord, as in Hosea 9:15'
  - where: 'note 8:1 “A bird of prey over the Lord’s house”'
    claim: 'Hosea 9:15 has the Lord driving Israel out of His house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/9?lang=eng'
    quote: 'I will drive them out of mine house'

  # ---------- note 8:2 ----------
  - where: 'note 8:2 “Israel’s claim to know the Lord”'
    claim: 'Chapter 4 charged the land with having no knowledge of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/4?lang=eng'
    quote: 'because there is no truth, nor mercy, nor knowledge of God in the land'
  - where: 'note 8:2 “Israel’s claim to know the Lord”'
    claim: 'In Hebrew “Israel” is the last word of verse 2 (hebrew.mjs hosea 8:2, word 5)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'יִשְׂרָאֵֽל'
  - where: 'note 8:2 “Israel’s claim to know the Lord”'
    claim: 'The ESV keeps “Israel” inside the people’s cry'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%208&version=ESV'
    quote: '“My God, we—Israel—know you.”'
  - where: 'note 8:2 “Israel’s claim to know the Lord”'
    claim: 'The Septuagint has no “Israel” in the cry'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/hosea/8.htm'
    quote: 'They shall soon cry out to me, saying, O God, we know thee.'
  - where: 'note 8:2 “Israel’s claim to know the Lord”'
    claim: 'The NRSVUE follows the Greek and Syriac and notes that the Hebrew adds “Israel”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%208&version=NRSVUE'
    quote: 'Gk Syr: Heb adds Israel'
  - where: 'note 8:2 “Israel’s claim to know the Lord”'
    claim: 'The verb “know” in verse 2 is yada (H3045) (hebrew.mjs hosea 8:2)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'יְֽדַעֲנ֖וּ/ךָ'
  - where: 'note 8:2 “Israel’s claim to know the Lord”'
    claim: '“I knew it not” in verse 4 is the same verb (H3045) (hebrew.mjs hosea 8:4)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'יָדָ֑עְתִּי'
  - where: 'note 8:2 “Israel’s claim to know the Lord”'
    claim: 'The Latter-day Saint edition’s alternative for “I knew it not”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/8?lang=eng'
    quote: 'IE I acknowledged them not.'
  - where: 'note 8:2 “Israel’s claim to know the Lord”'
    claim: 'The NIV translates the cry with “acknowledge”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%208&version=NIV'
    quote: 'Our God, we acknowledge you!'

  # ---------- note 8:4 ----------
  - where: 'note 8:4 “Kings the Lord did not choose”'
    claim: 'The law left the choice of a king to the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/17?lang=eng'
    quote: 'Thou shalt in any wise set him king over thee, whom the Lord thy God shall choose'
  - where: 'note 8:4 “Kings the Lord did not choose”'
    claim: 'Shallum conspired, killed the king, and reigned'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'And Shallum the son of Jabesh conspired against him, and smote him before the people, and slew him, and reigned in his stead.'
  - where: 'note 8:4 “Kings the Lord did not choose”'
    claim: 'Menahem killed Shallum and reigned'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'smote Shallum the son of Jabesh in Samaria, and slew him, and reigned in his stead'
  - where: 'note 8:4 “Kings the Lord did not choose”'
    claim: 'Pekah, a captain, conspired against his king, killed him, and reigned'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'and he killed him, and reigned in his room'
  - where: 'note 8:4 “Kings the Lord did not choose”'
    claim: 'Pekah was a captain who conspired'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'But Pekah the son of Remaliah, a captain of his, conspired against him'
  - where: 'note 8:4 “Kings the Lord did not choose”'
    claim: 'Hoshea conspired against Pekah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'And Hoshea the son of Elah made a conspiracy against Pekah the son of Remaliah'
  - where: 'note 8:4 “Kings the Lord did not choose”'
    claim: 'Hosea 7:7 on the fallen kings'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/7?lang=eng'
    quote: 'all their kings are fallen: there is none among them that calleth unto me'
  - where: 'note 8:4 “Kings the Lord did not choose”'
    claim: 'Ahijah promised Jeroboam ten tribes in the Lord’s name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: 'I will rend the kingdom out of the hand of Solomon, and will give ten tribes to thee'
  - where: 'note 8:4 “Kings the Lord did not choose”'
    claim: 'One reading: the verse refers chiefly to the founding of the kingdom by Jeroboam Ⅰ, and to later usurpations'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/8.htm'
    quote: 'refers chiefly to the founding of the kingdom by Jeroboam I. It is not to be restricted to this, however'
  - where: 'note 8:4 “Kings the Lord did not choose”'
    claim: 'The promise did not warrant seizing the government'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/8.htm'
    quote: 'For neither the divine promise of the throne, nor the anointing performed by the command of God, warranted their forcibly seizing upon the government'
  - where: 'note 8:4 “Kings the Lord did not choose”'
    claim: 'In Kings the people made Jeroboam king'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/12?lang=eng'
    quote: 'they sent and called him unto the congregation, and made him king over all Israel'
  - where: 'note 8:4 “Kings the Lord did not choose”'
    claim: 'Hosea 13:11: the Lord gave a king in anger and took him away in wrath'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/13?lang=eng'
    quote: 'I gave thee a king in mine anger, and took him away in my wrath.'
  - where: 'note 8:4 “Kings the Lord did not choose”'
    claim: 'The silver and gold were the Lord’s gifts, used for Baal'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/2?lang=eng'
    quote: 'and multiplied her silver and gold, which they prepared for Baal'

  # ---------- note 8:5 ----------
  - where: 'note 8:5 “The calf of Samaria”'
    claim: 'Jeroboam made two calves of gold'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/12?lang=eng'
    quote: 'Whereupon the king took counsel, and made two calves of gold'
  - where: 'note 8:5 “The calf of Samaria”'
    claim: 'He set them at Bethel and Dan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/12?lang=eng'
    quote: 'And he set the one in Beth-el, and the other put he in Dan.'
  - where: 'note 8:5 “The calf of Samaria”'
    claim: 'Hosea joins Samaria’s people to the calves of Beth-aven'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/10?lang=eng'
    quote: 'The inhabitants of Samaria shall fear because of the calves of Beth-aven'
  - where: 'note 8:5 “The calf of Samaria”'
    claim: 'The verb of verse 5 is zanach (H2186), the verb of verse 3 (hebrew.mjs hosea 8:3, 8:5)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'זָנַח֙'
  - where: 'note 8:5 “The calf of Samaria”'
    claim: 'Verse 3 has the same verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'זָנַ֥ח'
  - where: 'note 8:5 “The calf of Samaria”'
    claim: 'zanach means reject, spurn'
    key: bdb
    url: 'https://biblehub.com/hebrew/2186.htm'
    quote: 'verb reject, spurn'
  - where: 'note 8:5 “The calf of Samaria”'
    claim: 'As the Hebrew stands, the calf rejects Samaria; others make the Lord the subject'
    key: bdb
    url: 'https://biblehub.com/hebrew/2186.htm'
    quote: 'Samaria''s calf rejects her Hosea 8:5 (others make'
  - where: 'note 8:5 “The calf of Samaria”'
    claim: 'The ESV makes the Lord the one who spurns the calf'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%208&version=ESV'
    quote: 'I have spurned your calf, O Samaria.'
  - where: 'note 8:5 “The calf of Samaria”'
    claim: 'The ESV notes that the Hebrew has the third person'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%208&version=ESV'
    quote: 'Hosea 8:5 Hebrew He has'
  - where: 'note 8:5 “The calf of Samaria”'
    claim: 'The NIV reads a command'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%208&version=NIV'
    quote: 'Samaria, throw out your calf-idol!'
  - where: 'note 8:5 “The calf of Samaria”'
    claim: 'The Septuagint reads a command'
    key: lxx-rahlfs
