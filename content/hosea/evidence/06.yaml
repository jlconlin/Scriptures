chapter: 6
claims:
  # ---- when ----
  - where: 'when'
    claim: 'Hosea ministered in the northern kingdom in the latter half of the eighth century B.C., shortly before the Assyrian conquest'
    key: scripture-helps-hosea
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/45-hosea-1-6-10-14-joel?lang=eng'
    quote: 'His ministry took place in the Northern Kingdom of Israel during the latter half of the eighth century BC.'

  # ---- setting ----
  - where: 'setting'
    claim: 'When and where Hosea ministered'
    key: scripture-helps-hosea
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/45-hosea-1-6-10-14-joel?lang=eng'
    quote: 'His ministry took place in the Northern Kingdom of Israel during the latter half of the eighth century BC. Hosea prophesied during a time of great wickedness, when Israel was close to being conquered by the Assyrian empire.'
  - where: 'setting'
    claim: 'Ephraim stands for the northern kingdom and Judah for the southern'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'Thus, as used here, Judah means the Southern Kingdom, and Ephraim the Northern Kingdom.'
  - where: 'setting'
    claim: 'Verses 1–3 belong with the end of chapter 5; the chapter division separates them'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/6.htm'
    quote: 'The separation of these three verses from the preceding one, by the division of the chapters, is at variance with the close connection in the actual contents'
  - where: 'setting'
    claim: 'Chapter 5 ends with the Lord withdrawing until they seek Him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/5?lang=eng'
    quote: 'I will go and return to my place, till they acknowledge their offence, and seek my face: in their affliction they will seek me early.'
  - where: 'setting'
    claim: 'The Septuagint joins 5:15 to 6:1 with “saying”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/hosea/6.htm'
    quote: 'In their affliction they will seek me early, saying, Let us go, and return to the Lord our God'
  - where: 'setting'
    claim: 'A new address begins at verse 4'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/6.htm'
    quote: 'Hosea 6:4-11 form the first strophe.'
  - where: 'setting'
    claim: 'Verse 2 has long been read of resurrection, and of Christ’s on the third day'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/6.htm'
    quote: 'Many of the fathers, on the other hand, and many of the early Lutheran commentators, have found in them a prediction of the death of Christ and His resurrection on the third day.'
  - where: 'setting'
    claim: 'The Savior quotes verse 6 in Matthew 9:13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/9?lang=eng'
    quote: 'But go ye and learn what that meaneth, I will have mercy, and not sacrifice'
  - where: 'setting'
    claim: 'The Savior quotes verse 6 in Matthew 12:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/12?lang=eng'
    quote: 'But if ye had known what this meaneth, I will have mercy, and not sacrifice, ye would not have condemned the guiltless.'
  - where: 'setting'
    claim: 'The Hebrew names Shechem in verse 9, which the King James does not show'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%206&version=NRSVUE'
    quote: 'they murder on the road to Shechem'
  - where: 'setting'
    claim: 'Verse 7 may name a town called Adam'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%206&version=NRSVUE'
    quote: 'But at Adam they transgressed the covenant'

  # ---- thread ----
  - where: 'thread'
    claim: 'Mercy and knowledge of God are what 4:1 says the land lacks'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/4?lang=eng'
    quote: 'because there is no truth, nor mercy, nor knowledge of God in the land.'
  - where: 'thread'
    claim: 'Verse 3 is the people’s resolve to press on to know the Lord'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%206&version=NRSVUE'
    quote: 'Let us know, let us press on to know the Lord;'
  - where: 'thread'
    claim: '“Whoredom” in Hosea is the land’s departing from the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/1?lang=eng'
    quote: 'for the land hath committed great whoredom, departing from the Lord.'
  - where: 'thread'
    claim: 'Idolatry is called whoredom and adultery: unfaithfulness to the Lord in the worship of false gods'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'When the Lord’s people forsake him and worship false gods, their infidelity to Jehovah is described as whoredoms and adultery.'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: '“Prepared as the morning” means as certain as the dawn'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%206&version=NRSVUE'
    quote: 'his appearing is as sure as the dawn;'
  - where: 'section 3 plain'
    claim: '“Polluted with blood” rendered as marked with blood'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%206&version=NRSVUE'
    quote: 'tracked with blood.'
  - where: 'section 3 plain'
    claim: '“Lewdness” rendered as wickedness'
    key: bdb
    url: 'https://biblehub.com/hebrew/2154.htm'
    quote: 'wickedness in act'
  - where: 'section 3 plain'
    claim: 'The second half of verse 11 is left to the note: modern translations attach it to 7:1'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%206&version=NRSVUE'
    quote: 'For you also, O Judah, a harvest is appointed.'

  # ---- note 6:1 ----
  - where: 'note 6:1 “An answer to the lion of chapter 5”'
    claim: 'In 5:14 the Lord says He will tear and go away'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/5?lang=eng'
    quote: 'I, even I, will tear and go away; I will take away, and none shall rescue him.'
  - where: 'note 6:1 “An answer to the lion of chapter 5”'
    claim: 'The verb “tear” in 5:14 is Strong’s 2963'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'אֶטְרֹף֙'
  - where: 'note 6:1 “An answer to the lion of chapter 5”'
    claim: 'The verb “torn” in 6:1 is the same verb (Strong’s 2963)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'טָרָ֖ף'
  - where: 'note 6:1 “An answer to the lion of chapter 5”'
    claim: 'In 5:13 the Assyrian could not heal Ephraim'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/5?lang=eng'
    quote: 'yet could he not heal you, nor cure you of your wound.'
  - where: 'note 6:1 “An answer to the lion of chapter 5”'
    claim: 'In 5:10 wrath is poured out like water'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/5?lang=eng'
    quote: 'therefore I will pour out my wrath upon them like water.'
  - where: 'note 6:1 “An answer to the lion of chapter 5”'
    claim: 'The images of 5:10–15 are reversed in 6:1–3: lion to healer, sickness to revival, destructive water to spring rain'
    key: hord-not-fragile
    url: 'https://rsc.byu.edu/vol-23-no-1-2022/god-not-fragile'
    quote: 'the lion becomes a healer instead of a tearer (or terror), sickness is reversed in revival, and torrential rain becomes spring rain with all the promise of nourishing the land instead of destroying it.'
  - where: 'note 6:1 “An answer to the lion of chapter 5”'
    claim: 'The study pairs 5:10 with 6:3'
    key: hord-not-fragile
    url: 'https://rsc.byu.edu/vol-23-no-1-2022/god-not-fragile'
    quote: '“I will pour out my wrath upon them like water” (Hosea 5:10)'
  - where: 'note 6:1 “An answer to the lion of chapter 5”'
    claim: 'In 5:15 the Lord will return to His place until they seek Him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/5?lang=eng'
    quote: 'I will go and return to my place, till they acknowledge their offence, and seek my face'
  - where: 'note 6:1 “An answer to the lion of chapter 5”'
    claim: '“Return” in 5:15 is Strong’s 7725'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'אָשׁ֨וּבָה֙'
  - where: 'note 6:1 “An answer to the lion of chapter 5”'
    claim: '“Let us return” in 6:1 is the same verb (Strong’s 7725)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'וְ/נָשׁ֣וּבָה'
  - where: 'note 6:1 “An answer to the lion of chapter 5”'
    claim: 'The Septuagint supplies a speaker by joining the chapters with “saying”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/hosea/6.htm'
    quote: 'In their affliction they will seek me early, saying, Let us go, and return to the Lord our God'
  - where: 'note 6:1 “An answer to the lion of chapter 5”'
    claim: 'Others take 6:1 as the prophet’s own exhortation'
    key: hord-not-fragile
    url: 'https://rsc.byu.edu/vol-23-no-1-2022/god-not-fragile'
    quote: 'The prophet’s exhortation to the people of Israel is “Come, and let us return unto the Lord” (Hosea 6:1a).'

  # ---- note 6:2 ----
  - where: 'note 6:2 “After two days, and in the third day”'
    claim: 'Two and three days are short periods; consecutive numbers express certainty'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/6.htm'
    quote: 'Two and three days are very short periods of time; and the linking together of two numbers following one upon the other, expresses the certainty of what is to take place within this space of time'
  - where: 'note 6:2 “After two days, and in the third day”'
    claim: 'The numbers set out a speedy and certain revival of Israel'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/6.htm'
    quote: 'the speedy and certain revival of Israel is set before them'
  - where: 'note 6:2 “After two days, and in the third day”'
    claim: 'The footnote on “revive us” gives resurrection'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/6?lang=eng'
    quote: 'OR restore us to life; i.e., resurrect us.'
  - where: 'note 6:2 “After two days, and in the third day”'
    claim: '“Raise up” is a verb used of raising the dead'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/6.htm'
    quote: 'to raise the dead (Job 14:12; Psalm 88:11; Isaiah 26:14, Isaiah 26:19)'
  - where: 'note 6:2 “After two days, and in the third day”'
    claim: 'The verse may refer symbolically to the gathering and the Millennium, a day being a thousand years'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'Hosea 6:2 may be a symbolic reference to the gathering of Israel and the Millennium. If a day is a thousand years'
  - where: 'note 6:2 “After two days, and in the third day”'
    claim: 'Many early Christian writers found here a prediction of Christ’s death and resurrection on the third day'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/6.htm'
    quote: 'Many of the fathers, on the other hand, and many of the early Lutheran commentators, have found in them a prediction of the death of Christ and His resurrection on the third day.'
  - where: 'note 6:2 “After two days, and in the third day”'
    claim: 'The words first speak of Israel’s quickening from a death-like state'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/6.htm'
    quote: 'The words primarily hold out nothing more than the quickening of Israel out of its death-like state of rejection from the face of God'
  - where: 'note 6:2 “After two days, and in the third day”'
    claim: 'Israel’s restoration rests on Christ’s death and resurrection, so the words may be applied to it though it is not predicted'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/6.htm'
    quote: 'the atoning death of Christ, and His resurrection from the grave; so that the words of the prophet may be applied to this great fact in the history of salvation, but without its being either directly or indirectly predicted'
  - where: 'note 6:2 “After two days, and in the third day”'
    claim: 'The passage holds the germ of the hope of life after death, as Ezekiel 37 does'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/6.htm'
    quote: 'contain the germ of the hope of a life after death, as in Isaiah 26:19-21, and in the vision of Ezekiel in Ezekiel 37:1-14'

  # ---- note 6:3 (know) ----
  - where: 'note 6:3 “Let us press on to know the Lord”'
    claim: 'Modern translations read verse 3 as an exhortation'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%206&version=NRSVUE'
    quote: 'Let us know, let us press on to know the Lord;'
  - where: 'note 6:3 “Let us press on to know the Lord”'
    claim: 'The ESV reads it the same way'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%206&version=ESV'
    quote: 'let us press on to know the Lord;'
  - where: 'note 6:3 “Let us press on to know the Lord”'
    claim: 'The verb behind “follow on” means pursue, chase'
    key: bdb
    url: 'https://biblehub.com/hebrew/7291.htm'
    quote: 'verb pursue, chase, persecute'
  - where: 'note 6:3 “Let us press on to know the Lord”'
    claim: 'The land lacks knowledge of God (4:1)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/4?lang=eng'
    quote: 'because there is no truth, nor mercy, nor knowledge of God in the land.'
  - where: 'note 6:3 “Let us press on to know the Lord”'
    claim: '“Prepared as the morning” rendered “as sure as the dawn”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%206&version=NRSVUE'
    quote: 'his appearing is as sure as the dawn;'

  # ---- note 6:3 (rain) ----
  - where: 'note 6:3 “The two rains”'
    claim: 'The former (early) rain falls from late October to early December'
    key: bdb
    url: 'https://biblehub.com/hebrew/3138.htm'
    quote: 'early rain, which falls in Palestine from the last of October until the first of December'
  - where: 'note 6:3 “The two rains”'
    claim: 'The latter rain is the showers of March and April that mature the crops'
    key: bdb
    url: 'https://biblehub.com/hebrew/4456.htm'
    quote: 'latter-rain, spring-rain (i.e. showers of March-April; important, as strengthening and maturing crops)'
  - where: 'note 6:3 “The two rains”'
    claim: 'The former rain softened the ground for plowing and planting; the latter gave the crop its growth'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'The former (or first) rains softened the earth so that he could plow it and plant the seed; the latter (or second) rains gave the crop its growth.'
  - where: 'note 6:3 “The two rains”'
    claim: 'After the latter rain almost none falls until the end of September'
    key: bd-rain
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/rain?lang=eng'
    quote: 'Showers may occur in May, but after this, rain hardly ever falls until the end of September'
  - where: 'note 6:3 “The two rains”'
    claim: 'The law promised Israel the first and latter rain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/11?lang=eng'
    quote: 'That I will give you the rain of your land in his due season, the first rain and the latter rain'

  # ---- note 6:4 ----
  - where: 'note 6:4 “Goodness that is gone by mid-morning”'
    claim: '“Goodness” in 6:4 is hesed (Strong’s 2617)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'וְ/חַסְדְּ/כֶם֙'
  - where: 'note 6:4 “Goodness that is gone by mid-morning”'
    claim: '“Mercy” in 6:6 is the same word, hesed'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'חֶ֥סֶד'
  - where: 'note 6:4 “Goodness that is gone by mid-morning”'
    claim: 'The lexicon’s first gloss of hesed is goodness, kindness'
    key: bdb
    url: 'https://biblehub.com/hebrew/2617.htm'
    quote: 'goodness, kindness'
  - where: 'note 6:4 “Goodness that is gone by mid-morning”'
    claim: 'The lexicon lists 6:4, as possible, under hesed as Israel’s love to God, piety'
    key: bdb
    url: 'https://biblehub.com/hebrew/2617.htm'
    quote: 'Hosea 6:4 your piety is like a morning cloud (fleeting)'
  - where: 'note 6:4 “Goodness that is gone by mid-morning”'
    claim: 'Modern translations render it “love”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%206&version=NRSVUE'
    quote: 'Your love is like a morning cloud,'
  - where: 'note 6:4 “Goodness that is gone by mid-morning”'
    claim: 'Hesed is a covenant word for loyal love'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'It is a covenant word that refers to the faithfulness or loyal love that binds two parties together in covenant.'
  - where: 'note 6:4 “Goodness that is gone by mid-morning”'
    claim: 'Hesed has the quality of constancy'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'Such covenant love has the quality of constancy, firmness, steadfastness.'
  - where: 'note 6:4 “Goodness that is gone by mid-morning”'
    claim: 'Hesed also occurs at 2:19'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'וּ/בְ/חֶ֖סֶד'
  - where: 'note 6:4 “Goodness that is gone by mid-morning”'
    claim: 'Hesed also occurs at 4:1 (“mercy”)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/4?lang=eng'
    quote: 'because there is no truth, nor mercy, nor knowledge of God in the land.'
  - where: 'note 6:4 “Goodness that is gone by mid-morning”'
    claim: 'On the high ground the dews at night are often heavy'
    key: bd-rain
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/rain?lang=eng'
    quote: 'though on the high ground the dews at night are often heavy'
  - where: 'note 6:4 “Goodness that is gone by mid-morning”'
    claim: 'One translation heads verses 1–3 “A Call to Repentance”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%206&version=NRSVUE'
    quote: 'A Call to Repentance'
  - where: 'note 6:4 “Goodness that is gone by mid-morning”'
    claim: 'Another heads the passage “Israel Unrepentant”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%206&version=NIV'
    quote: 'Israel Unrepentant'
  - where: 'note 6:4 “Goodness that is gone by mid-morning”'
    claim: 'Verse 4 is a critique of righteousness that lacks depth and staying power'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'a prophetic critique of the ultimate lack of depth and staying power of self-justifying righteousness'
  - where: 'note 6:4 “Goodness that is gone by mid-morning”'
    claim: 'In 13:3 Ephraim itself becomes the morning cloud and early dew'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/13?lang=eng'
    quote: 'Therefore they shall be as the morning cloud, and as the early dew that passeth away'
  - where: 'note 6:4 “Goodness that is gone by mid-morning”'
    claim: 'In 14:5 the Lord will be as the dew to Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/14?lang=eng'
    quote: 'I will be as the dew unto Israel'

  # ---- note 6:5 ----
  - where: 'note 6:5 “Hewn by the prophets”'
    claim: 'The verb means hew; here figuratively, the Lord attacking the people by the agency of prophets'
