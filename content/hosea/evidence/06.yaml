  - where: 'note 6:5 “Hewn by the prophets”'
    claim: 'The Septuagint reads “my judgment”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/hosea/6.htm'
    quote: 'my judgment shall go forth as the light'
  - where: 'note 6:5 “Hewn by the prophets”'
    claim: 'The NRSVUE reads “my judgment goes forth as the light”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%206&version=NRSVUE'
    quote: 'and my judgment goes forth as the light.'
  - where: 'note 6:5 “Hewn by the prophets”'
    claim: 'The NIV reads “then my judgments go forth like the sun”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%206&version=NIV'
    quote: 'then my judgments go forth like the sun.'

  # ---- note 6:6 (Savior) ----
  - where: 'note 6:6 “The Savior quotes this line twice”'
    claim: 'The setting of the first quotation: Jesus at table with publicans and sinners'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/9?lang=eng'
    quote: 'many publicans and sinners came and sat down with him and his disciples.'
  - where: 'note 6:6 “The Savior quotes this line twice”'
    claim: 'The Pharisees ask the disciples why'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/9?lang=eng'
    quote: 'Why eateth your Master with publicans and sinners?'
  - where: 'note 6:6 “The Savior quotes this line twice”'
    claim: 'Matthew 9:13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/9?lang=eng'
    quote: 'But go ye and learn what that meaneth, I will have mercy, and not sacrifice: for I am not come to call the righteous, but sinners to repentance.'
