  # ---------- note 5:12 ----------
  - where: 'note 5:12 “The Lord as moth and as rottenness”'
    claim: 'The moth (ash, H6211) is named as waster, consumer; the lexicon lists Hosea 5:12 and Job 13:28'
    key: bdb
    url: 'https://biblehub.com/hebrew/6211.htm'
    quote: 'moth (as waster, consumer)'
  - where: 'note 5:12 “The Lord as moth and as rottenness”'
    claim: 'Raqab (H7538) is rottenness, decay, in Hosea 5:12 apparently the ravages of worm'
    key: bdb
    url: 'https://biblehub.com/hebrew/7538.htm'
    quote: 'rottenness, decay (always figurative)'
  - where: 'note 5:12 “The Lord as moth and as rottenness”'
    claim: 'Of the ravages of worm in this verse'
    key: bdb
    url: 'https://biblehub.com/hebrew/7538.htm'
    quote: 'apparently of ravages of worm'
  - where: 'note 5:12 “The Lord as moth and as rottenness”'
    claim: 'The NRSVUE: maggots'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%205&version=NRSVUE'
    quote: 'Therefore I am like maggots to Ephraim'
  - where: 'note 5:12 “The Lord as moth and as rottenness”'
    claim: 'The Septuagint has other figures'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/hosea/5.htm'
    quote: 'Therefore I will be as consternation to Ephraim, and as a goad to the house of Juda.'
  - where: 'note 5:12 “The Lord as moth and as rottenness”'
    claim: 'Such images of God are rare and startling'
    key: hord-not-fragile
    url: 'https://rsc.byu.edu/vol-23-no-1-2022/god-not-fragile'
    quote: 'It is not often that a prophet speaks of God as a destructive deluge, a rot that cannot be cured, or a lion that tears its prey and ensures it cannot be rescued.'
  - where: 'note 5:12 “The Lord as moth and as rottenness”'
