page: out-of-egypt
claims:
  - where: 'opening'
    claim: 'Egypt (Mitsrayim, H4714) is named in thirteen verses of Hosea (occurrences.mjs hosea --hebrew 4714: 13 occurrences in 13 verses: 2:15; 7:11, 16; 8:13; 9:3, 6; 11:1, 5, 11; 12:1, 9, 13; 13:4)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'מִצְרַ֥יִם'
  - where: 'opening'
    claim: 'Hosea 12:1 names a present alliance: a covenant with the Assyrians and oil carried into Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/12?lang=eng'
    quote: 'they do make a covenant with the Assyrians, and oil is carried into Egypt.'
  - where: 'opening'
    claim: 'Hosea 7:11 names a present alliance: the dove that calls to Egypt and goes to Assyria'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/7?lang=eng'
    quote: 'Ephraim also is like a silly dove without heart: they call to Egypt, they go to Assyria.'
  - where: 'section ““I loved him, and called my son””'
    claim: 'The LORD tells Moses to say to Pharaoh that Israel is His son, His firstborn (the Church footnote at Hos. 11:1 “son” gives Ex. 4:22 (22–23))'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/4?lang=eng'
    quote: 'And thou shalt say unto Pharaoh, Thus saith the Lord, Israel is my son, even my firstborn:'
  - where: 'section ““I loved him, and called my son””'
    claim: 'The immediate context of Hosea 11:1 is the relationship between Jehovah and Israel'
    key: frederick-ot-in-nt-gospels
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: 'The immediate context of Hosea 11:1 is the relationship between Jehovah and Israel.'
  - where: 'section ““I loved him, and called my son””'
    claim: 'In love God redeemed them from Egypt (Hosea 11:1)'
    key: bd-hosea
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hosea?lang=eng'
    quote: 'In love God redeemed them from Egypt (Hosea 11:1)'
  - where: 'section ““I loved him, and called my son””'
    claim: 'The picture of a father and a son is drawn by “my son” (11:1) and by what the LORD does in 11:1–4 (teaches to go, heals, draws with bands of love)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/11?lang=eng'
    quote: 'I taught Ephraim also to go, taking them by their arms; but they knew not that I healed them.'
  - where: 'section “Back toward Egypt”'
    claim: 'Deuteronomy 28:68, the last curse, is the Church footnote at Hos. 8:13 “Egypt” (which also gives Hos. 9:3 and 11:5)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/28?lang=eng'
    quote: 'And the Lord shall bring thee into Egypt again with ships, by the way whereof I spake unto thee, Thou shalt see it no more again'
  - where: 'section “Back toward Egypt”'
    claim: 'Hosea 8:13 and the footnote chain: 8:13 footnote 13c gives Deut. 28:68, Hosea 9:3 and 11:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/8?lang=eng'
    quote: '13c ‘Egypt’: Deut. 28:68 (58–59, 68); Hosea 9:3 (1–3); 11:5.'
  - where: 'section “Back toward Egypt”'
    claim: 'Connection made by this page: the verb “called” in 11:1 (qara, H7121) is the verb of “they call” in 7:11 (same lemma, plural form)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'קָרָ֥אתִי'
  - where: 'section “Back toward Egypt”'
    claim: 'Connection made by this page: the same verb in 7:11 (qara, “they call to Egypt”); it is also in 11:2 and 11:7 (occurrences.mjs hosea --hebrew 7121)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'קָרָ֖אוּ'
  - where: 'section “Back toward Egypt”'
    claim: 'Hosea 11:5 says he shall not return into the land of Egypt but the Assyrian shall be his king'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/11?lang=eng'
    quote: 'He shall not return into the land of Egypt, but the Assyrian shall be his king, because they refused to return.'
  - where: 'section ““How shall I give thee up?””'
    claim: 'The picture of a loving parent holding a toddler’s arms to teach her to walk'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'First, He is like a loving parent of Israel who, bent over and anxious, holds on to the arms of His toddler to teach her to walk.'
  - where: 'section ““How shall I give thee up?””'
    claim: 'The Joseph Smith Translation of Hosea 11:8 reads “my mercies are extended to gather thee” (Church footnote 8b)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/11?lang=eng'
    quote: 'JST Hosea 11:8 … toward thee, and my mercies are extended to gather thee.'
  - where: 'section ““How shall I give thee up?””'
    claim: 'Hosea 11:3–4, 8–9 as quoted: bands of love; How shall I give thee up; I am God, and not man'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/11?lang=eng'
    quote: 'How shall I give thee up, Ephraim? how shall I deliver thee, Israel?'
  - where: 'section “Called home”'
    claim: 'Connection made by this page: “children” in 11:10 (banim) is the plural of the noun (ben, H1121) for “son” in 11:1; ben stands in chapter 11 only at verses 1 and 10 (occurrences.mjs hosea --hebrew 1121)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'בָנִ֖ים'
  - where: 'section “Called home”'
    claim: 'Connection made by this page: the noun for “son” in 11:1 (ben, H1121, with the preposition l-)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'לִ/בְנִֽ/י'
  - where: 'section “Called home”'
    claim: 'Connection made by this page: the dove (yonah) of 7:11 that calls to Egypt and goes to Assyria (occurrences.mjs hosea --hebrew 3123: 2 occurrences in 2 verses)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'כְּ/יוֹנָ֥ה'
  - where: 'section “Called home”'
    claim: 'Connection made by this page: the dove (yonah) of 11:11 comes out of the land of Assyria, the bird (tsippor) out of Egypt'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'וּ/כְ/יוֹנָ֖ה'
  - where: 'section “Called home”'
    claim: 'Hosea 2:15: she shall sing there as in the day when she came up out of the land of Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/2?lang=eng'
    quote: 'and she shall sing there, as in the days of her youth, and as in the day when she came up out of the land of Egypt.'
  - where: 'section “The Son called out of Egypt”'
    claim: 'Matthew 2:13–15: the flight into Egypt, and the quotation “Out of Egypt have I called my son”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/2?lang=eng'
    quote: 'And was there until the death of Herod: that it might be fulfilled which was spoken of the Lord by the prophet, saying, Out of Egypt have I called my son.'
  - where: 'section “The Son called out of Egypt”'
    claim: 'The Church’s chapter heading for Hosea 11: Israel was called out of Egypt in similitude of our Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/11?lang=eng'
    quote: 'Israel, as a child, was called out of Egypt in similitude of our Lord, as a child, coming out of Egypt'
  - where: 'section “The Son called out of Egypt”'
    claim: 'Matthew chooses to interpret the Hosea passage typologically'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Matthew chooses to interpret the Hosea passage typologically, seeing Hosea’s statement as being consummated in the story of Joseph’s taking Jesus and Mary to (and later from) Egypt (see Matthew 2:13–15).'
  - where: 'section “The Son called out of Egypt”'
    claim: 'Matthew’s interpretation is an example of typological prophecy'
    key: frederick-ot-in-nt-gospels
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: 'As for the Hosea passage, Matthew’s interpretation can be seen as an example of typological prophecy'
  - where: 'section “The Son called out of Egypt”'
    claim: 'For Matthew, Jesus does not simply fulfill a prediction from Hosea'
    key: rsc-combs-ahaz-sign
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/king-ahazs-sign-christ-jesus'
    quote: 'For Matthew, Jesus does not simply fulfill a prediction from Hosea rather, he fills out the divine message that Hosea had conveyed about Israel’s deliverance.'
  - where: 'section “The Son called out of Egypt”'
    claim: 'Matthew’s use depends on the reader’s recognition of the original sense (Richard Hays, as Combs quotes him)'
    key: rsc-combs-ahaz-sign
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/king-ahazs-sign-christ-jesus'
    quote: 'Matthew’s use of the quotation depends upon the reader’s recognition of its original sense'
  - where: 'section “The Son called out of Egypt”'
    claim: 'Hosea 13:4: the LORD thy God from the land of Egypt; no saviour beside me'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/13?lang=eng'
    quote: 'Yet I am the LORD thy God from the land of Egypt, and thou shalt know no god but me: for there is no saviour beside me.'
  - where: 'section “The Son called out of Egypt”'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ'
  - where: 'section “The Son called out of Egypt”'
    claim: 'Connection made by this page: Hosea 13:4 (the LORD from the land of Egypt) set beside Matthew 2:15 (the child called out of Egypt)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/2?lang=eng'
    quote: 'Out of Egypt have I called my son.'
  - where: 'section “The Son called out of Egypt”'
    claim: 'Nephi swears by the Lord God who brought Israel up out of Egypt; none other name save Jesus Christ (Church footnote 4b at Hos. 13:4 gives 2 Ne. 25:20)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/25?lang=eng'
    quote: 'And as the Lord God liveth that brought Israel up out of the land of Egypt'
  - where: 'section ““I loved him, and called my son””'
    claim: 'H1 (ab, father) occurs once in Hosea, at 9:10, of the ancestors (occurrences.mjs hosea --hebrew 1: 1 occurrence in 1 verse); the LORD is nowhere called father in the book'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'אֲבֽוֹתֵי/כֶ֑ם'
  - where: 'section “The Son called out of Egypt”'
    claim: 'On the typological reading Matthew sees Jesus retracing Israel’s being called by God out of Egypt'
    key: frederick-ot-in-nt-gospels
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: 'Understood typologically, Matthew understands Jesus retracing'
