page: betroth-thee
claims:
  - where: 'opening'
    claim: 'Lo-ruhamah means “not pitied” or “not having obtained mercy”; Lo-ammi means “not my people”'
    key: scripture-helps-hosea
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/45-hosea-1-6-10-14-joel?lang=eng'
    quote: 'The second child was named Lo-Ruhamah, meaning “not pitied” or “not having obtained mercy,” signifying that the Lord''s compassion toward Israel would be withdrawn for a time.'
  - where: 'opening'
    claim: 'Lo-ammi means “not my people”'
    key: scripture-helps-hosea
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/45-hosea-1-6-10-14-joel?lang=eng'
    quote: 'The third was named Lo-Ammi, meaning “not my people,” representing how Israel had broken their covenant as God''s chosen people through their unfaithfulness.'
  - where: 'opening'
    claim: 'The verb of Lo-ruhamah (racham) stands in 1:6'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'אֲרַחֵם֙'
  - where: 'opening'
    claim: 'The same verb (racham) stands in 14:3, the last prayer'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'יְרֻחַ֥ם'
  - where: 'section “Named for a broken covenant”'
    claim: 'The names stand for compassion withdrawn'
    key: scripture-helps-hosea
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/45-hosea-1-6-10-14-joel?lang=eng'
    quote: 'The second child was named Lo-Ruhamah, meaning “not pitied” or “not having obtained mercy,” signifying that the Lord''s compassion toward Israel would be withdrawn for a time.'
  - where: 'section “Named for a broken covenant”'
    claim: 'The names stand for a covenant broken'
    key: scripture-helps-hosea
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/45-hosea-1-6-10-14-joel?lang=eng'
    quote: 'The third was named Lo-Ammi, meaning “not my people,” representing how Israel had broken their covenant as God''s chosen people through their unfaithfulness.'
  - where: 'section “Named for a broken covenant”'
    claim: 'Whether the command to marry “a wife of whoredoms” was literal or symbolic is debated; the manual does not settle it'
    key: scripture-helps-hosea
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/45-hosea-1-6-10-14-joel?lang=eng'
    quote: 'Scholars have long debated whether the Lord''s command for Hosea to marry “a wife of whoredoms” was literal or symbolic.'
  - where: 'section “The betrothal”'
    claim: '“Lovingkindness” is hesed, the Lord''s covenantal love, loyalty, and mercy'
    key: scripture-helps-hosea
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/45-hosea-1-6-10-14-joel?lang=eng'
    quote: 'The Hebrew word translated as “lovingkindness” is hesed, which is used to describe the Lord''s covenantal love, loyalty, and mercy.'
  - where: 'section “The betrothal”'
    claim: '“Mercies” in 2:19 is the plural noun rachamim (H7356)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'וּֽ/בְ/רַחֲמִֽים'
  - where: 'section “The betrothal”'
    claim: 'Connection made by this page: the verb in the name Lo-ruhamah (1:6), the noun “mercies” (2:19) and the verb in 2:23 are built on the same three letters (r-ch-m): 1:6'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'אֲרַחֵם֙'
  - where: 'section “The betrothal”'
    claim: 'Connection made by this page: the noun “mercies” of 2:19, set beside 1:6 and 2:23'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'וּֽ/בְ/רַחֲמִֽים'
  - where: 'section “The betrothal”'
    claim: 'Connection made by this page: the verb in 2:23, set beside 1:6 and 2:19'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'וְ/רִֽחַמְתִּ֖י'
  - where: 'section “The betrothal”'
    claim: 'Connection made by this page: the English of 2:19, “in mercies”, set beside 1:6 and 2:23'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/2?lang=eng'
    quote: 'in lovingkindness, and in mercies'
  - where: 'section “The betrothal”'
    claim: 'Connection made by this page: “she did not know” (2:8) is the verb yada, set beside 2:20'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'יָֽדְעָ֔ה'
  - where: 'section “The betrothal”'
    claim: 'Connection made by this page: “thou shalt know” (2:20) is the same verb yada, set beside 2:8'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'וְ/יָדַ֖עַתְּ'
  - where: 'section ““Many days””'
    claim: 'Connection made by this page: the charge of 4:12 stands after the promise of 2:19–23'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/4?lang=eng'
    quote: 'the spirit of whoredoms hath caused them to err'
  - where: 'section ““Many days””'
    claim: 'Connection made by this page: the charge of 5:7 stands after the promise of 2:19–23'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/5?lang=eng'
    quote: 'They have dealt treacherously against the LORD'
  - where: 'section ““Many days””'
    claim: 'Connection made by this page: the charge of 9:1 stands after the promise of 2:19–23'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/9?lang=eng'
    quote: 'thou hast gone a whoring from thy God'
  - where: 'section “In thee the fatherless findeth mercy”'
    claim: '“Findeth mercy” (14:3) is the verb racham, as in Lo-ruhamah'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'יְרֻחַ֥ם'
  - where: 'section “In thee the fatherless findeth mercy”'
    claim: 'The verb is the Pual (passive) stem: “be shewn compassion… of orphans Hosea 14:4”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7355.htm'
    quote: 'be shewn compassion, compassionated: of orphans Hosea 14:4'
  - where: 'section “In thee the fatherless findeth mercy”'
    claim: 'The phrase plays on the name Lo-ruhamah'
    key: bowen-fruit-of-loins
    url: 'https://interpreterfoundation.org/journal/thou-art-the-fruit-of-my-loins-the-interrelated-symbolism-and-meanings-of-the-names-joseph-and-ephraim-in-ancient-scripture'
    quote: '“in thee the fatherless find mercy” play on the names Hosea and Lo-ruhamah, respectively.'
  - where: 'section “The husband”'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ'
  - where: 'section “The husband”'
    claim: 'The husband of these chapters stands for Jehovah, Jesus Christ'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'the husband was a metaphor for Jehovah, Jesus Christ'
  - where: 'section “The husband”'
    claim: 'Paul quotes the reversed names (Rom. 9:24–25)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/9?lang=eng'
    quote: 'I will call them my people, which were not my people; and her beloved, which was not beloved'
  - where: 'section “The husband”'
    claim: 'The Church''s footnote at Rom. 9:25 names Hosea 2:23'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/9?lang=eng'
    quote: 'Hosea 2:23; Zech. 13:9'
  - where: 'section “The husband”'
    claim: 'Those who covenant become “children of Christ”; this is how the promise of “sons of the living God” is read'
    key: scripture-helps-hosea
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/45-hosea-1-6-10-14-joel?lang=eng'
    quote: 'those who are spiritually reborn and make covenants with the Lord become “children of Christ.”'
  - where: 'section “The husband”'
    claim: 'Hosea deeply influenced Isa. 40–66, Jer. 2–3, Ezek. 16'
    key: bd-hosea
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hosea?lang=eng'
    quote: 'deeply influenced succeeding writers (see Isa. 40–66; Jer. 2–3; Ezek. 16; 33)'
  - where: 'section “The husband”'
    claim: 'Connection made by this page: Isa. 54:7 has the noun rachamim, as Hosea 2:19'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'וּ/בְ/רַחֲמִ֥ים'
  - where: 'section “The husband”'
    claim: 'Connection made by this page: Isa. 54:8 has hesed, as Hosea 2:19'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'וּ/בְ/חֶ֥סֶד'
  - where: 'section “The husband”'
    claim: 'Connection made by this page: Isa. 54:8 has the verb racham, as Hosea 2:23'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'רִֽחַמְתִּ֑י/ךְ'
  - where: 'section “The husband”'
    claim: 'Connection made by this page: Isa. 54:5–8 quoted beside Hosea 2:19, 2:23'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/54?lang=eng'
    quote: 'with everlasting kindness will I have mercy on thee, saith the LORD thy Redeemer'
  - where: 'section “Named for a broken covenant”'
    claim: '“My people” and “your God” are the covenant’s own words; Scripture Helps’ endnote gives Exodus 6:7 and Leviticus 26:12'
    key: scripture-helps-hosea
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/45-hosea-1-6-10-14-joel?lang=eng'
    quote: 'they would be His people and He would be their God (see Exodus 6:7; 19:5–6; Leviticus 26:12)'
  - where: 'section ““Many days””'
    claim: 'The Lord still says “my people” in 4:12, the verse of the first later charge'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/4?lang=eng'
    quote: 'My people ask counsel at their stocks'
  - where: 'section ““Many days””'
    claim: 'The promise of the covenant and betrothal is dated “in that day” (2:18)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/2?lang=eng'
    quote: 'And in that day will I make a covenant for them'
