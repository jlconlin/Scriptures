page: mercy-not-sacrifice
claims:
  - where: 'opening'
    claim: 'Hesed (H2617) is in six verses of Hosea'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'חֶ֥סֶד'
  - where: 'opening'
    claim: 'Primary meaning of hesed is covenant loyalty'
    key: sc-archive-hesed
    url: 'https://scripturecentral.org/archive/books/book-chapter/hesed'
    quote: 'the primary meaning of ḥesed is something like “covenant loyalty,” referring to the proper behavior in a covenant relationship'
  - where: 'opening'
    claim: 'Jesus quoted the statement twice'
    key: scripture-helps-hosea
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/45-hosea-1-6-10-14-joel?lang=eng'
    quote: 'Twice during His mortal ministry, Jesus Christ quoted this statement from the book of Hosea.'
  - where: 'section “One word, three English words”'
    claim: 'Hesed rendered lovingkindness at 2:19'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'וּ/בְ/חֶ֖סֶד'
  - where: 'section “One word, three English words”'
    claim: 'Hesed rendered mercy at 4:1'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'חֶ֛סֶד'
  - where: 'section “One word, three English words”'
    claim: 'Hesed rendered goodness at 6:4'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'וְ/חַסְדְּ/כֶם֙'
  - where: 'section “One word, three English words”'
    claim: 'Hesed at 10:12 and 12:6 (mercy)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'חֶ֔סֶד'
  - where: 'section “One word, three English words”'
    claim: 'KJV text: lovingkindness (2:19)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/2?lang=eng'
    quote: 'in righteousness, and in judgment, and in lovingkindness, and in mercies'
  - where: 'section “One word, three English words”'
    claim: 'KJV text: goodness (6:4)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/6?lang=eng'
    quote: 'your goodness is as a morning cloud, and as the early dew it goeth away'
  - where: 'section “One word, three English words”'
    claim: 'Nelson: no adequate English equivalent; covenant relationship, both parties loyal'
    key: nelson-everlasting-covenant
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/10/04-the-everlasting-covenant?lang=eng'
    quote: 'Hesed has no adequate English equivalent.'
  - where: 'section “One word, three English words”'
    claim: 'Nelson: both parties bound to be loyal and faithful'
    key: nelson-everlasting-covenant
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/10/04-the-everlasting-covenant?lang=eng'
    quote: 'Hesed is a unique term describing a covenant relationship in which both parties are bound to be loyal and faithful to each other.'
  - where: 'section “One word, three English words”'
    claim: 'The mercy of 1:6 is racham, a different word'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'אֲרַחֵם֙'
  - where: 'section “One word, three English words”'
    claim: 'The mercy of 14:3 is racham'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'יְרֻחַ֥ם'
  - where: 'section “Promised, then missing”'
    claim: '4:1 is a legal charge for breach of covenant, with three charges'
    key: jackson-hosea-marriage
    url: 'https://rsc.byu.edu/isaiah-prophets/marriage-hosea-jehovahs-covenant-israel'
    quote: 'He brings legal proceedings against her for breach of covenant and takes her to divorce court. The specific charges brought against Israel are threefold'
  - where: 'section “Promised, then missing”'
    claim: 'The three terms of 4:1 recur in 2:19–20: hesed is the lovingkindness of 2:19, and knowing the Lord is in both'
    key: jackson-hosea-marriage
    url: 'https://rsc.byu.edu/isaiah-prophets/marriage-hosea-jehovahs-covenant-israel'
    quote: 'Each of the three terms defined above is found in Hosea 2:19–20'
  - where: 'section “Promised, then missing”'
    claim: 'Same: lovingkindness is hesed, rendered mercy in 4:1; knowing the Lord in both'
    key: jackson-hosea-marriage
    url: 'https://rsc.byu.edu/isaiah-prophets/marriage-hosea-jehovahs-covenant-israel'
    quote: '“Loving kindness” is translated from hesed; the same word is rendered “mercy” in Hosea 4:1.'
  - where: 'section “A morning cloud”'
    claim: 'The Hebrew word for mercy in 4:1 and 6:6 is hesed'
    key: scripture-helps-hosea
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/45-hosea-1-6-10-14-joel?lang=eng'
    quote: 'The Hebrew word for “mercy” in both Hosea 4:1 and 6:6 is hesed'
  - where: 'section “A morning cloud”'
    claim: 'The Church footnote glosses mercy at 6:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/6?lang=eng'
    quote: 'HEB charity, or lovingkindness. Matt. 12:7.'
  - where: 'section “A morning cloud”'
    claim: 'While sacrifices were still important, the Lord placed more value on devotion and compassion'
    key: scripture-helps-hosea
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/45-hosea-1-6-10-14-joel?lang=eng'
    quote: 'While sacrifices were still important, the Lord placed more value on their heartfelt devotion to Him and compassion for others'
  - where: 'section “Sow, reap, keep”'
    claim: 'Connection made by this page: in 10:12 righteousness is sown and the word of 6:6 (mercy) is the harvest, set beside 6:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/10?lang=eng'
    quote: 'Sow to yourselves in righteousness, reap in mercy'
  - where: 'section “Sow, reap, keep”'
    claim: 'Connection made by this page: the word of 6:6 appears in 12:6 as something to keep, set beside 6:6 and 10:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/12?lang=eng'
    quote: 'keep mercy and judgment, and wait on thy God continually'
  - where: 'section “Sow, reap, keep”'
    claim: 'Hesed stands in 10:12 and 12:6'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'חֶ֤סֶד'
  - where: 'section “Go ye and learn what that meaneth”'
    claim: 'Each time the Savior rebuked the Pharisees for observance over repentance and loving others'
    key: scripture-helps-hosea
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/45-hosea-1-6-10-14-joel?lang=eng'
    quote: 'In each case, the Savior rebuked the Pharisees for prioritizing religious observance over repentance and loving others.'
  - where: 'section “Go ye and learn what that meaneth”'
    claim: 'Lane on Matt. 9:13: self-justifying obedience over compassion'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'placed their self justifying obedience over compassion for the less obedient'
  - where: 'section “Go ye and learn what that meaneth”'
    claim: 'Lane on Matt. 12:7: mercy above the temple and Sabbath regulations'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'Here again something is being put above the temple and, by extension, above regulations about the Sabbath: mercy.'
  - where: 'section “Go ye and learn what that meaneth”'
    claim: 'McClellan: the critique applied to other situations (context for the generalization)'
    key: mcclellan-go-ye-learn
    url: 'https://rsc.byu.edu/covenant-compassion/go-ye-learn-what-meaneth'
    quote: 'in neither case was Jesus directly defending the poor or the oppressed'
  - where: 'section “Go ye and learn what that meaneth”'
    claim: 'McClellan: generalization of the critique to where law obstructs duties to God and neighbor'
    key: mcclellan-go-ye-learn
    url: 'https://rsc.byu.edu/covenant-compassion/go-ye-learn-what-meaneth'
    quote: 'Jesus deploys a generalization of the prophetic critique of temple sacrifice and applies it to other situations where the priority of the law might undermine or obstruct more important duties toward God and neighbor.'
  - where: 'section “Go ye and learn what that meaneth”'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'section “Go ye and learn what that meaneth”'
    claim: 'In quoting the prophets Jesus was often quoting Himself'
    key: ensign-2002-saviors-use-ot
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/07/the-saviors-use-of-the-old-testament?lang=eng'
    quote: 'when Jesus quoted the words of the prophets He was often actually quoting Himself!'
  - where: 'section “A morning cloud”'
    claim: 'Connection made by this page: 1 Sam. 15:22 set beside Hos. 6:6 (obedience better than sacrifice)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/15?lang=eng'
    quote: 'Behold, to obey is better than sacrifice, and to hearken than the fat of rams.'
  - where: 'section “A morning cloud”'
    claim: 'Connection made by this page: Micah 6:6–8 asks about burnt offerings and answers with justice, mercy, humility; set beside Hos. 6:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/6?lang=eng'
    quote: 'shall I come before him with burnt offerings, with calves of a year old?'
  - where: 'section “A morning cloud”'
    claim: 'Micah 6:8 answer: do justly, love mercy, walk humbly'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/6?lang=eng'
    quote: 'what doth the Lord require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?'
  - where: 'section “Sow, reap, keep”'
    claim: 'The calves of our lips are prayers offered where young bulls would have been'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'To present the sincere prayers of one’s lips as an offering to the Lord was as precious as the best offerings in the Mosaic law, which were young oxen or bullocks'
