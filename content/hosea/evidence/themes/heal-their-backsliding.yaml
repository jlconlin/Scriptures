    key: cambridge-hosea
    url: 'https://biblehub.com/commentaries/cambridge/hosea/5.htm'
    quote: 'Both states are conscious of the destroying cancer, but neither of them adopts the only possible means of arresting its progress.'
  - where: 'section “Yet could he not heal you”'
    claim: 'Student Manual 10-24 (quoting Sperry): “Political alliances would not remedy the real cause of their trouble—moral disease and rebellion against God.”'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'Political alliances would not remedy the real cause of their trouble—moral disease and rebellion against God.'
  - where: 'section “Yet could he not heal you”'
    claim: 'Asshur (H804) 9 verses in Hosea: 5:13; 7:11; 8:9; 9:3; 10:6; 11:5; 11:11; 12:1; 14:3; sought as help at 5:13, 7:11, 8:9, 12:1'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'אַשּׁ֔וּר'
  - where: 'section “Yet could he not heal you”'
    claim: 'Hosea 5:14–15 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/5?lang=eng'
    quote: 'till they acknowledge their offence, and seek my face'

  # ---------- section “He hath torn, and he will heal us” ----------
  - where: 'section “He hath torn, and he will heal us”'
    claim: '6:1 wĕyirpāʾēnû, first person plural speech with no speaker named'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'וְ/יִרְפָּאֵ֑/נוּ'
  - where: 'section “He hath torn, and he will heal us”'
    claim: 'Keil on 6:1: “The Assyrian cannot heal (Hosea 5:13); but the Lord, who manifested Himself as Israel’s physician in the time of Moses (Exodus 15:26), and promised His people healing in the future also (Deuteronomy 32:39), surely can.”'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/6.htm'
    quote: 'The Assyrian cannot heal (Hosea 5:13); but the Lord, who manifested Himself as Israel''s physician in the time of Moses (Exodus 15:26), and promised His people healing in the future also (Deuteronomy 32:39), surely can.'
  - where: 'section “He hath torn, and he will heal us”'
    claim: 'Barnes on 6:1: “They are words put into their mouth by God Himself”'
    key: barnes-hosea
    url: 'https://biblehub.com/commentaries/barnes/hosea/6.htm'
    quote: 'They are words put into their mouth by God Himself'
  - where: 'section “He hath torn, and he will heal us”'
    claim: 'Cambridge on 6:1–3: “the only too quickly repentant Israelites”; “a hasty resolution, from which a full and free confession of sin was fatally absent (contrast penitent Israel’s words in Hosea 14:2). Hence the complaint of the omniscient Holy One which follows in Hosea 6:4.”'
    key: cambridge-hosea
    url: 'https://biblehub.com/commentaries/cambridge/hosea/6.htm'
    quote: 'a hasty resolution, from which a full and free confession of sin was fatally absent (contrast penitent Israel’s words in Hosea 14:2). Hence the complaint of the omniscient Holy One which follows in Hosea 6:4.'
  - where: 'section “He hath torn, and he will heal us”'
    claim: 'Cambridge: “the only too quickly repentant Israelites”'
    key: cambridge-hosea
    url: 'https://biblehub.com/commentaries/cambridge/hosea/6.htm'
    quote: 'the only too quickly repentant Israelites'
  - where: 'section “He hath torn, and he will heal us”'
    claim: 'Ellicott on ch. 6: “The words of imperfect penitence (Hosea 6:1-3) are put by the prophet into the lips of those who are in trouble, and are counting too soon on the boundless compassion of Jehovah.”'
    key: ellicott-hosea
    url: 'https://biblehub.com/commentaries/ellicott/hosea/6.htm'
    quote: 'are put by the prophet into the lips of those who are in trouble, and are counting too soon on the boundless compassion of Jehovah'
  - where: 'section “He hath torn, and he will heal us”'
    claim: 'Keil on 6:4: “The verse does not contain an answer from Jehovah”; “God has already tried all kinds of punishment to bring the people back to fidelity to Himself, but all in vain”'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/6.htm'
    quote: 'God has already tried all kinds of punishment to bring the people back to fidelity to Himself, but all in vain'
  - where: 'section “He hath torn, and he will heal us”'
    claim: 'Keil: “The verse does not contain an answer from Jehovah”'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/6.htm'
    quote: 'The verse does not contain an answer from Jehovah'

  # ---------- section “When I would have healed Israel” ----------
  - where: 'section “When I would have healed Israel”'
    claim: '7:1 kĕrāpĕʾî, kĕ- + infinitive + 1cs suffix; no “would” in the Hebrew'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'כְּ/רָפְאִ֣/י'
  - where: 'section “When I would have healed Israel”'
    claim: 'Keil on 7:1: “As the dangerous nature of a wound is often first brought out by the attempt to heal it, so was the corruption of Israel only brought truly to light by the effort to stem it.”'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/7.htm'
    quote: 'As the dangerous nature of a wound is often first brought out by the attempt to heal it, so was the corruption of Israel only brought truly to light by the effort to stem it.'
  - where: 'section “When I would have healed Israel”'
    claim: 'Keil, same paragraph: “the preaching of repentance and the reproofs of the prophets, and partly by chastisements designed to promote reformation”'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/7.htm'
    quote: 'the preaching of repentance and the reproofs of the prophets, and partly by chastisements designed to promote reformation'
  - where: 'section “When I would have healed Israel”'
    claim: 'Cambridge on 7:1, an emendation: “it is expedient to read thus, with Ewald, When I turn the fortunes of my people, when I heal Israel, then will be manifest Ephraim’s guilt and Samaria’s wickedness”'
    key: cambridge-hosea
    url: 'https://biblehub.com/commentaries/cambridge/hosea/7.htm'
    quote: 'it is expedient to read thus, with Ewald, When I turn the fortunes of my people, when I heal Israel'
  - where: 'section “When I would have healed Israel”'
    claim: 'Ellicott on 7:1: “Translate, When I heal Israel (referring to a cessation in the attacks of the menacing foe, or to such a thrill of finer feeling as that which is recorded in 2Chronicles 28:8-15), then is revealed the iniquity of Ephraim”'
    key: ellicott-hosea
    url: 'https://biblehub.com/commentaries/ellicott/hosea/7.htm'
    quote: 'referring to a cessation in the attacks of the menacing foe, or to such a thrill of finer feeling as that which is recorded in 2Chronicles 28:8-15'
  - where: 'section “When I would have healed Israel”'
    claim: 'Hosea 7:11, 16 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/7?lang=eng'
    quote: 'They return, but not to the most High'

