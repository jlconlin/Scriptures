page: heal-their-backsliding
claims:
  - where: 'opening'
    claim: 'The Hebrew verb rapha (H7495) stands in exactly five verses of Hosea (5:13; 6:1; 7:1; 11:3; 14:4); at 5:13 the subject is Assyria (infinitive, "to heal")'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'לִ/רְפֹּ֣א'
  - where: 'opening'
    claim: 'rapha at 6:1 (the people: he will heal us)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'וְ/יִרְפָּאֵ֑/נוּ'
  - where: 'opening'
    claim: 'rapha at 7:1 (the Lord: when I would have healed)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'כְּ/רָפְאִ֣/י'
  - where: 'opening'
    claim: 'rapha at 11:3 (the Lord: I healed them)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'רְפָאתִֽי/ם'
  - where: 'opening'
    claim: 'rapha at 14:4 (the Lord: I will heal)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'אֶרְפָּא֙'
  - where: 'section “The wound, and where Ephraim took it”'
    claim: 'The images of 5:10–15 sit inside a familiar message of prophetic warning and future assurance of hope in a God who seeks to gather his people'
    key: hord-not-fragile
    url: 'https://rsc.byu.edu/vol-23-no-1-2022/god-not-fragile'
    quote: 'a conscientious reading of these passages reveals a familiar message of prophetic warning and future assurance of hope in a God who seeks to gather his people to him.'
  - where: 'section ““He hath torn, and he will heal us””'
    claim: 'The lion of chapter 5 becomes a healer in 6:1–3; judgment in 5:10–15, redemption in 6:1–3'
    key: hord-not-fragile
    url: 'https://rsc.byu.edu/vol-23-no-1-2022/god-not-fragile'
    quote: 'the lion becomes a healer instead of a tearer (or terror), sickness is reversed in revival'
  - where: 'section ““He hath torn, and he will heal us””'
    claim: 'The Church footnote at 6:2 gives “revive us” the alternative reading “restore us to life; i.e., resurrect us”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/6?lang=eng'
    quote: 'OR restore us to life; i.e., resurrect us.'
  - where: 'section ““They knew not that I healed them””'
    claim: 'The Church footnote at 11:3 “healed” gives 1 Ne. 17:41 and Alma 33:20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/11?lang=eng'
    quote: '1 Ne. 17:41 (40–41); Alma 33:20 (18–23).'
  - where: 'section ““They knew not that I healed them””'
    claim: '1 Ne. 17:41: after they were bitten he prepared a way that they might be healed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/17?lang=eng'
    quote: 'after they were bitten he prepared a way that they might be healed'
  - where: 'section ““They knew not that I healed them””'
    claim: 'Alma 33:20: they did not believe that it would heal them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/33?lang=eng'
    quote: 'they did not believe that it would heal them.'
  - where: 'section ““They knew not that I healed them””'
    claim: 'Connection made by this page: 11:3, “they knew not that I healed them,” is set beside 5:13, where Ephraim went to the Assyrian, “yet could he not heal you”: Ephraim goes to another for healing without knowing who had been healing him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/11?lang=eng'
    quote: 'but they knew not that I healed them.'
  - where: 'section ““They knew not that I healed them””'
    claim: 'Connection made by this page (5:13 side): Ephraim went to the Assyrian, “yet could he not heal you”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/5?lang=eng'
    quote: 'yet could he not heal you, nor cure you of your wound.'
  - where: 'section ““They knew not that I healed them””'
    claim: 'shuv is the root meaning to turn back or return; meshuvah (“backsliding”) is a noun from it with the exact opposite meaning, turned away from God'
    key: spendlove-turning-whole-heart
    url: 'https://interpreterfoundation.org/journal/turning-to-the-lord-with-the-whole-heart-the-doctrine-of-repentance-in-the-bible-and-the-book-of-mormon'
    quote: 'Meshuvah (משובה), also derived from the root shuv (שוב), is a Hebrew noun with the exact opposite meaning from teshuvah.'
  - where: 'section ““They knew not that I healed them””'
    claim: 'The root-verb shuv generally means to turn back or to return'
    key: spendlove-turning-whole-heart
    url: 'https://interpreterfoundation.org/journal/turning-to-the-lord-with-the-whole-heart-the-doctrine-of-repentance-in-the-bible-and-the-book-of-mormon'
    quote: 'The root-verb שוב (shub) generally means to turn back or to return.'
  - where: 'section ““Take with you words””'
    claim: 'The Church footnote at 5:13 “heal” gives Hosea 14:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/5?lang=eng'
    quote: '“heal”: Hosea 14:3 (1–3).'
  - where: 'section ““Take with you words””'
    claim: 'The Church footnote at 14:3 “save” gives Hosea 5:13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/14?lang=eng'
    quote: '“save”: Hosea 5:13.'
  - where: 'section ““I will heal their backsliding””'
    claim: 'Hebrew meshuvah, “backsliding” (14:4), is glossed turning back, apostasy'
    key: bdb
    url: 'https://biblehub.com/hebrew/4878.htm'
    quote: 'noun feminine turning back, apostasy'
  - where: 'section ““I will heal their backsliding””'
    claim: 'The verb of 14:4 is “I will heal” and its object is meshuvah'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'מְשׁ֣וּבָתָ֔/ם'
  - where: 'section ““I will heal their backsliding””'
    claim: 'Chapter 14 looks forward to the return of Ephraim to the Lord and its healing'
    key: bowen-fruit-of-loins
    url: 'https://interpreterfoundation.org/journal/thou-art-the-fruit-of-my-loins-the-interrelated-symbolism-and-meanings-of-the-names-joseph-and-ephraim-in-ancient-scripture'
    quote: 'Still another of Hosea’s prophecies, one that looks forward to the return of Ephraim (tribe and nation) to the Lord and its healing'
  - where: 'section ““I will heal their backsliding””'
    claim: 'Bowen and Spendlove’s note 35 gives 5:13 as the example of wordplay between Ephraim and “heal” and goes on to quote 6:1, 7:1 and 11:3 (the page no longer makes the claim; row kept for the reviewer)'
    key: bowen-fruit-of-loins
    url: 'https://interpreterfoundation.org/journal/thou-art-the-fruit-of-my-loins-the-interrelated-symbolism-and-meanings-of-the-names-joseph-and-ephraim-in-ancient-scripture'
    quote: 'The pun here emphasizes Ephraim’s sickness.'
  - where: 'section ““I will heal their backsliding””'
    claim: 'Israel’s restoration shall be due to His love (2:19; 14:4)'
    key: bd-hosea
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hosea?lang=eng'
    quote: 'their restoration shall be due to His love (2:19; 14:4).'
  - where: 'section ““I will heal their backsliding””'
    claim: 'Connection made by this page: Jer. 3:22, “Return, ye backsliding children, and I will heal your backslidings,” is set beside Hosea 14:4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/3?lang=eng'
    quote: 'Return, ye backsliding children, and I will heal your backslidings.'
  - where: 'section ““I will heal their backsliding””'
    claim: 'Jer. 3:22 has the same Hebrew verb (rapha, first person) and noun (meshuvah) as Hosea 14:4'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'מְשׁוּבֹֽתֵי/כֶ֑ם'
  - where: 'section ““I will heal their backsliding””'
    claim: 'The Church footnote at Jer. 3:22 “heal” gives 3 Ne. 9:13; 18:32 (a footnote at Jeremiah, not at Hosea)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/3?lang=eng'
    quote: '“heal”: 3 Ne. 9:13; 18:32.'
  - where: 'section ““I will heal their backsliding””'
    claim: 'Connection made by this page (3 Ne. 9:13 side): the risen Savior says, will ye not now return unto me … that I may heal you'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/9?lang=eng'
    quote: 'will ye not now return unto me, and repent of your sins, and be converted, that I may heal you?'
  - where: 'section “Through Jesus Christ”'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'section “Through Jesus Christ”'
    claim: 'The Church footnote at Hosea 13:4 “saviour” gives Acts 4:12 and 2 Ne. 25:20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/13?lang=eng'
    quote: '“saviour”: Acts 4:12; 2 Ne. 25:20.'
  - where: 'section “Through Jesus Christ”'
    claim: '2 Ne. 25:20 joins the healing of the serpent-bitten with none other name save it be this Jesus Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/25?lang=eng'
    quote: 'there is none other name given under heaven save it be this Jesus Christ'
  - where: 'section “Through Jesus Christ”'
    claim: 'The book’s ending shows the redemption and reconciliation of God’s people through Jesus Christ'
    key: hord-not-fragile
    url: 'https://rsc.byu.edu/vol-23-no-1-2022/god-not-fragile'
    quote: 'seeing the future redemption and reconciliation of God’s people to him through Jesus Christ'
  - where: 'section ““He hath torn, and he will heal us””'
    claim: 'Connection made by this page: 6:1, “he will heal us” (the people, of the Lord), is set beside 14:4, “I will heal” (the Lord, of Himself), the same Hebrew verb; 6:4 and 7:1 stand between them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/14?lang=eng'
    quote: 'I will heal their backsliding'
  - where: 'section ““I will heal their backsliding””'
    claim: 'meshuvah (H4878) is in Hosea only at 11:7 and 14:4 (occurrences.mjs hosea --hebrew 4878: 2 occurrences); 11:7 “bent to backsliding from me”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'לִ/מְשֽׁוּבָתִ֑/י'
