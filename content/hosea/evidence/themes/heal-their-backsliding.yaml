page: heal-their-backsliding
claims:
  # ---------- opening ----------
  - where: 'opening'
    claim: 'rāpāʾ (H7495) occurs 5 times in Hosea in 5 forms: 5:13 lirpōʾ (infinitive, Assyria/Jareb “could not”), 6:1 wĕyirpāʾēnû (the people, “he will heal us”), 7:1 kĕrāpĕʾî (the LORD, infinitive), 11:3 rĕpāʾtîm (the LORD, perfect), 14:4 ʾerpāʾ (the LORD, imperfect)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'אֶרְפָּא֙'
  - where: 'opening'
    claim: 'Footnote Hosea 5:13d “heal” → Hosea 14:3 (1–3); footnote 14:3b “save” → Hosea 5:13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/5?lang=eng'
    quote: 'yet could he not heal you, nor cure you of your wound.'
  - where: 'opening'
    claim: 'Cambridge on 11:3: “The same figure as in Hosea 5:13, Hosea 6:1, Hosea 7:1.”'
    key: cambridge-hosea
    url: 'https://biblehub.com/commentaries/cambridge/hosea/11.htm'
    quote: 'The same figure as in Hosea 5:13, Hosea 6:1, Hosea 7:1.'
  - where: 'opening'
    claim: 'Bowen and Spendlove, note 35, quote 5:13, 6:1, 7:1 and 11:3 in sequence for the Ephraim/rpʾ wordplay'
    key: bowen-fruit-of-loins
    url: 'https://interpreterfoundation.org/journal/thou-art-the-fruit-of-my-loins-the-interrelated-symbolism-and-meanings-of-the-names-joseph-and-ephraim-in-ancient-scripture'
    quote: 'but they knew not that I healed them [rĕpāʾtîm]'
  - where: 'opening'
    claim: 'Connection made by this page: the five uses of rāpāʾ read as the book’s one argument about where healing comes from; 6:1 (answered by complaint) against 14:1–4 (answered by “I will heal”), the difference being the confession that names Assyria; the object of 14:4 being the backsliding itself. Cambridge draws the 6:1/14:2 contrast; no source reads the five as a sequence.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/14?lang=eng'
    quote: 'I will heal their backsliding, I will love them freely: for mine anger is turned away from him.'

