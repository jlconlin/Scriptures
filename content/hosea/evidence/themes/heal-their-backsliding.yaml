    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/5.htm'
    quote: 'The real disease of the two kingdoms was apostasy from the Lord'
  - where: 'section “Yet could he not heal you”'
    claim: 'Keil: “a festering wound, an abscess”'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/5.htm'
    quote: 'a festering wound, an abscess'
  - where: 'section “Yet could he not heal you”'
