chapter: 1
claims:
  # ---------- when ----------
  - where: 'when'
    claim: 'Hosea’s ministry is generally placed in the eighth century B.C., its third quarter'
    key: jackson-hosea-marriage
    url: 'https://rsc.byu.edu/isaiah-prophets/marriage-hosea-jehovahs-covenant-israel'
    quote: 'The ministry of the prophet Hosea is generally placed in the turbulent third quarter of the eighth century B.C.'
  - where: 'when'
    claim: 'Jehu’s descendants still ruled Israel when the first child was named'
    key: jackson-hosea-marriage
    url: 'https://rsc.byu.edu/isaiah-prophets/marriage-hosea-jehovahs-covenant-israel'
    quote: 'Jehu’s descendants still ruled Israel in Hosea’s day.'
  - where: 'when'
    claim: 'Jeroboam the son of Joash (Jeroboam Ⅱ) was of the dynasty of Jehu'
    key: bd-jeroboam
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeroboam?lang=eng'
    quote: 'Jeroboam Ⅱ, of the dynasty of Jehu, the ablest of the kings of Israel, and the most successful in war'

  # ---------- setting ----------
  - where: 'setting'
    claim: 'Hosea is the only prophet of the northern kingdom who left written prophecies'
    key: bd-hosea
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hosea?lang=eng'
    quote: 'Son of Beeri, and the only prophet of the northern kingdom who has left written prophecies.'
  - where: 'setting'
    claim: 'He began to prophesy late in the reign of Jeroboam Ⅱ'
    key: bd-hosea
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hosea?lang=eng'
    quote: 'He began to prophesy during the latter part of the reign of Jeroboam Ⅱ.'
  - where: 'setting'
    claim: 'The Bible Dictionary has him probably dying before Pekah’s accession in 736 B.C.'
    key: bd-hosea
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hosea?lang=eng'
    quote: 'He probably died before the accession of Pekah, 736 B.C.'
  - where: 'setting'
    claim: 'Jeroboam Ⅱ was the most successful in war of the kings of Israel'
    key: bd-jeroboam
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeroboam?lang=eng'
    quote: 'Jeroboam Ⅱ, of the dynasty of Jehu, the ablest of the kings of Israel, and the most successful in war'
  - where: 'setting'
    claim: 'Both kingdoms were prosperous when Hosea’s ministry began under Jeroboam Ⅱ'
    key: jackson-hosea-marriage
    url: 'https://rsc.byu.edu/isaiah-prophets/marriage-hosea-jehovahs-covenant-israel'
    quote: 'His ministry began during the reign of Jeroboam II, when both kingdoms were prosperous and wealthy.'
  - where: 'setting'
    claim: 'The Student Manual prints a reckoning of about 755 to 725 B.C. for the ministry'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'We may not be far off from the truth if we date Hosea’s ministry, therefore, from about 755 B.C. to 725 B.C.'
  - where: 'setting'
    claim: 'Assyria took Samaria and carried Israel away'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/17?lang=eng'
    quote: 'In the ninth year of Hoshea the king of Assyria took Samaria, and carried Israel away into Assyria'
  - where: 'setting'
    claim: 'Isaiah prophesied in Judah under the same four kings'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/1?lang=eng'
    quote: 'in the days of Uzziah, Jotham, Ahaz, and Hezekiah, kings of Judah'
  - where: 'setting'
    claim: 'Scripture Helps divides the book into chapters 1–3 (the command to marry, the children) and 4–14 (warnings and promises)'
    key: scripture-helps-hosea
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/45-hosea-1-6-10-14-joel?lang=eng'
    quote: 'Hosea 4–14: Hosea’s prophetic warnings and promises to Israel.'
  - where: 'setting'
    claim: 'Chapters 1 and 2 are told in the third person, chapter 3 in the first'
    key: jackson-hosea-marriage
    url: 'https://rsc.byu.edu/isaiah-prophets/marriage-hosea-jehovahs-covenant-israel'
    quote: 'The narrative in chapter 3 is in the first person, while that in chapters 1 and 2 is in third person.'
  - where: 'setting'
    claim: 'Paul quotes Hosea 2:23 and 1:10 together'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/9?lang=eng'
    quote: 'As he saith also in Osee, I will call them my people, which were not my people; and her beloved, which was not beloved.'

  # ---------- thread ----------
  - where: 'thread'
    claim: 'The three names are read as three stages: scattering, the withdrawal of mercy, and separation'
    key: schade-hosea-family
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/imagery-hoseas-family-restoration-israel'
    quote: 'oracles of the scattering of Israel, the withdrawal of the Lord’s mercy until she repents, and Israel’s separation from the Lord (as is depicted in the names of the children Jezreel, Lo-ruhamah, and Lo-ammi)'
  - where: 'thread'
    claim: 'The “for” of verse 2 gives the reason for the command: the land’s unfaithfulness'
    key: schade-hosea-family
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/imagery-hoseas-family-restoration-israel'
    quote: 'Here, the word for introduces a causal clause'
  - where: 'thread'
    claim: 'Hosea interweaves judgment and the promise of restoration through the book'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'Throughout the book, Hosea interweaves the promise of destruction or a curse with the promise of future restoration to favor.'
  - where: 'thread'
    claim: 'Hosea 2:1 calls the children Ammi and Ruhamah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/2?lang=eng'
    quote: 'Say ye unto your brethren, Ammi; and to your sisters, Ruhamah.'

  # ---------- sections ----------
  - where: 'section 2 plain'
    claim: 'The opening clause of verse 2 can be rendered as a time clause'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%201&version=NRSVUE'
    quote: 'When the Lord first spoke through Hosea, the Lord said to Hosea'
  - where: 'section 3 plain'
    claim: '“Avenge the blood of Jezreel upon the house of Jehu” is rendered “punish the house of Jehu for the blood of Jezreel”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%201&version=NRSVUE'
    quote: 'for in a little while I will punish the house of Jehu for the blood of Jezreel, and I will put an end to the kingdom of the house of Israel.'

  # ---------- note 1:1 ----------
  - where: 'note 1:1 “One king of Israel named, six left unnamed”'
    claim: 'Jeroboam the son of Joash is Jeroboam Ⅱ, of Jehu’s dynasty'
    key: bd-jeroboam
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeroboam?lang=eng'
    quote: 'Jeroboam Ⅱ, of the dynasty of Jehu, the ablest of the kings of Israel, and the most successful in war'
  - where: 'note 1:1 “One king of Israel named, six left unnamed”'
    claim: 'Jeroboam the son of Nebat was the first king of the divided kingdom and set up the calves at Dan and Bethel'
    key: bd-jeroboam
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeroboam?lang=eng'
    quote: 'one of Jeroboam’s first steps after the separation was to set up image worship in Dan and Bethel'
  - where: 'note 1:1 “One king of Israel named, six left unnamed”'
    claim: 'The kingdom had divided about two centuries before Hosea'
    key: jackson-hosea-marriage
    url: 'https://rsc.byu.edu/isaiah-prophets/marriage-hosea-jehovahs-covenant-israel'
    quote: 'Approximately two centuries earlier, the great Israelite empire of David and Solomon had divided into two rival nations, Israel in the north and Judah in the south.'
  - where: 'note 1:1 “One king of Israel named, six left unnamed”'
    claim: 'Zachariah, Jeroboam’s son, reigned six months'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'did Zachariah the son of Jeroboam reign over Israel in Samaria six months'
  - where: 'note 1:1 “One king of Israel named, six left unnamed”'
    claim: 'Shallum killed Zachariah and reigned'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'And Shallum the son of Jabesh conspired against him, and smote him before the people, and slew him, and reigned in his stead.'
  - where: 'note 1:1 “One king of Israel named, six left unnamed”'
    claim: 'Menahem killed Shallum and reigned'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'smote Shallum the son of Jabesh in Samaria, and slew him, and reigned in his stead'
  - where: 'note 1:1 “One king of Israel named, six left unnamed”'
    claim: 'Pekahiah followed Menahem, and Pekah killed him and reigned'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'But Pekah the son of Remaliah, a captain of his, conspired against him, and smote him in Samaria'
  - where: 'note 1:1 “One king of Israel named, six left unnamed”'
    claim: 'Hoshea killed Pekah and reigned'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'And Hoshea the son of Elah made a conspiracy against Pekah the son of Remaliah, and smote him, and slew him, and reigned in his stead'
  - where: 'note 1:1 “One king of Israel named, six left unnamed”'
    claim: 'Hoshea was the last king; Samaria was taken in his ninth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/17?lang=eng'
    quote: 'In the ninth year of Hoshea the king of Assyria took Samaria, and carried Israel away into Assyria'
  - where: 'note 1:1 “One king of Israel named, six left unnamed”'
    claim: 'The prophet’s name is the same as King Hoshea’s: the Bible Dictionary heads its entry “Hosea, or Hoshea”'
    key: bd-hosea
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hosea?lang=eng'
    quote: 'Hosea, or Hoshea'
  - where: 'note 1:1 “One king of Israel named, six left unnamed”'
    claim: 'Some infer from the Judahite kings being listed first that the book was meant for Judah’s readers too'
    key: schade-hosea-family
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/imagery-hoseas-family-restoration-israel'
    quote: 'The listing of Judahite kings first has led some to believe that Hosea was meant to be read and reread by diverse audiences (including Judah) over the years.'

  - where: 'note 1:1 “One king of Israel named, six left unnamed”'
    claim: 'Jeroboam’s line had ended (Zachariah killed, Shallum reigning) by Uzziah’s thirty-ninth year, so the later kings of Judah in the heading reigned after Jeroboam'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'Shallum the son of Jabesh began to reign in the nine and thirtieth year of Uzziah king of Judah'

  # ---------- note 1:2 beginning ----------
  - where: 'note 1:2 “The first thing the Lord said through Hosea”'
    claim: 'In Hebrew the second word of verse 2 is a verb (piel perfect, third masculine singular: “spoke”), where the King James has the noun “word”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'דִּבֶּר'
  - where: 'note 1:2 “The first thing the Lord said through Hosea”'
    claim: 'The Updated NRSV makes the clause a time clause'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%201&version=NRSVUE'
    quote: 'When the Lord first spoke through Hosea, the Lord said to Hosea'
  - where: 'note 1:2 “The first thing the Lord said through Hosea”'
    claim: 'The book does not tell how or where Hosea received the word'
    key: schade-hosea-family
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/imagery-hoseas-family-restoration-israel'
    quote: 'We do not know the details of how or where Hosea received this word'
  - where: 'note 1:2 “The first thing the Lord said through Hosea”'
    claim: 'One reading takes the command to marry as a figure of the prophet’s call'
    key: schade-hosea-family
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/imagery-hoseas-family-restoration-israel'
    quote: 'the Lord’s call to Hosea to take a harlotrous woman to wife represents the prophet’s call to the ministry'

  # ---------- note 1:2 marriage ----------
  - where: 'note 1:2 “Was the marriage literal?”'
    claim: 'Scripture Helps leaves open whether the command was literal or symbolic'
    key: scripture-helps-hosea
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/45-hosea-1-6-10-14-joel?lang=eng'
    quote: 'Scholars have long debated whether the Lord’s command for Hosea to marry “a wife of whoredoms” was literal or symbolic.'
  - where: 'note 1:2 “Was the marriage literal?”'
    claim: 'Scripture Helps: the message is what the marriage symbolizes'
    key: scripture-helps-hosea
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/45-hosea-1-6-10-14-joel?lang=eng'
    quote: 'Either way, the central message of the book of Hosea is not the marriage itself but what it symbolizes: the covenant relationship between God and Israel.'
  - where: 'note 1:2 “Was the marriage literal?”'
    claim: 'The first line of interpretation: an actual marriage, as recorded'
    key: jackson-hosea-marriage
    url: 'https://rsc.byu.edu/isaiah-prophets/marriage-hosea-jehovahs-covenant-israel'
    quote: 'The marriage described refers to the actual condition of Hosea’s marrying, by a commandment of God, a promiscuous, immoral woman. This interpretation takes the account literally as recorded.'
  - where: 'note 1:2 “Was the marriage literal?”'
    claim: 'Hosea and his wife are listed among the prophets’ symbolic signs, with Jeremiah’s yoke and Ezekiel’s journey'
    key: parry-symbolic-action
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/symbolic-action-prophecy-old-testament'
    quote: 'Jeremiah’s yoke signified bondage (see Jeremiah 27–28); Ezekiel’s journey from home symbolized an exile of Israel (see Ezekiel 12:1–16); Hosea and his wife represented Jehovah and unfaithful Israel respectively (see Hosea 1; 3:1–5)'
  - where: 'note 1:2 “Was the marriage literal?”'
    claim: 'The same study lists the marriage and births as a symbolic action'
    key: parry-symbolic-action
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/symbolic-action-prophecy-old-testament'
    quote: 'Symbolic action: Hosea marries Gomer, and they have three children'
  - where: 'note 1:2 “Was the marriage literal?”'
    claim: 'The objection to a literal command, as the Student Manual prints Sidney B. Sperry'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'Sidney B. Sperry said that this “would be imputing to God a command inconsistent with His holy character.'
  - where: 'note 1:2 “Was the marriage literal?”'
    claim: 'The reply to that objection, as Schade prints Brent L. Top'
    key: schade-hosea-family
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/imagery-hoseas-family-restoration-israel'
    quote: 'opens a Pandora’s box of issues surrounding the historicity of the scriptures'
  - where: 'note 1:2 “Was the marriage literal?”'
    claim: 'The second line: the woman became unfaithful later, and the phrase anticipates it'
    key: jackson-hosea-marriage
    url: 'https://rsc.byu.edu/isaiah-prophets/marriage-hosea-jehovahs-covenant-israel'
    quote: 'Possibly the woman was not immoral when Hosea married her but became so later. In this case Hosea 1:2 mistakenly records that she was originally “a wife of whoredoms,” or possibly it anticipates her later behavior.'
  - where: 'note 1:2 “Was the marriage literal?”'
    claim: 'On the second reading Hosea wrote looking back'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'later in life, Hosea, looking back on his experiences and all that he had suffered and learned through them, recorded incidents that helped illustrate his teachings'
  - where: 'note 1:2 “Was the marriage literal?”'
    claim: 'The difficulty with the second reading: the phrase is in the command'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'The difficulty with this interpretation is that the Lord commanded Hosea to take a “wife of whoredoms” (v. 2).'
  - where: 'note 1:2 “Was the marriage literal?”'
    claim: 'Jackson inclines against the literal reading and finds merit in the other two'
    key: jackson-hosea-marriage
    url: 'https://rsc.byu.edu/isaiah-prophets/marriage-hosea-jehovahs-covenant-israel'
    quote: 'My inclination is to reject number one, the literal interpretation. I believe there may be merit in either number two or number three.'
  - where: 'note 1:2 “Was the marriage literal?”'
    claim: 'The third reading, as the Student Manual prints Sperry: the marriage represents the prophet’s call'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'The Lord’s call to Hosea to take a harlotrous woman to wife represents the prophet’s call to the ministry—a ministry to an apostate and covenant-breaking people.'
  - where: 'note 1:2 “Was the marriage literal?”'
    claim: 'On the third reading the children represent the judgments the prophet announced'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'children of this apparent union represent the coming of the judgments of the Lord upon Israel'
  - where: 'note 1:2 “Was the marriage literal?”'
    claim: 'Schade agrees with the third reading'
    key: schade-hosea-family
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/imagery-hoseas-family-restoration-israel'
    quote: 'I believe there is ample evidence in the scriptures to demonstrate that Hosea’s marriage is a metaphor of his message to the people.'
  - where: 'note 1:2 “Was the marriage literal?”'
    claim: 'Zenunim is an abstract plural, “fornication”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2183.htm'
    quote: 'noun [masculine] fornication, plural abstract intensive'
  - where: 'note 1:2 “Was the marriage literal?”'
    claim: 'The word names an attribute, not a profession'
    key: schade-hosea-family
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/imagery-hoseas-family-restoration-israel'
    quote: 'It does not represent a profession.'
  - where: 'note 1:2 “Was the marriage literal?”'
    claim: 'The Hebrew of “hath committed great whoredom” looks to the future'
    key: schade-hosea-family
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/imagery-hoseas-family-restoration-israel'
    quote: 'the Hebrew reflects a condition that is certain in regards to the future (“for the land will surely”)'
  - where: 'note 1:2 “Was the marriage literal?”'
    claim: 'The Septuagint renders the clause as future'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/hosea/1.htm'
    quote: 'for the land will surely go a-whoring in departing from the Lord.'
  - where: 'note 1:2 “Was the marriage literal?”'
    claim: 'Schade reads the wife and children as the kingdom and its people'
    key: schade-hosea-family
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/imagery-hoseas-family-restoration-israel'
    quote: 'The language is metaphoric, and the wife and children Hosea refers to represent the kingdom of Israel and its inhabitants.'
  - where: 'note 1:2 “Was the marriage literal?”'
    claim: '“Children of whoredoms” recurs in Hosea 2:4, of the children of the mother who is the nation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/2?lang=eng'
    quote: 'for they be the children of whoredoms'
  - where: 'note 1:2 “Was the marriage literal?”'
    claim: 'In chapter 2 the mother is the nation and her children its people'
    key: schade-hosea-family
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/imagery-hoseas-family-restoration-israel'
    quote: 'Thus the “mother” is the nation; her children are the people of Israel.'
  - where: 'note 1:2 “Was the marriage literal?”'
    claim: 'Literal or not, the book’s message is the same'
    key: jackson-hosea-marriage
    url: 'https://rsc.byu.edu/isaiah-prophets/marriage-hosea-jehovahs-covenant-israel'
    quote: 'Whether we assume that an actual marriage of Hosea was involved or not is irrelevant to the purposes of the book; either way the greater message comes through.'

  # ---------- note 1:3 ----------
  - where: 'note 1:3 “What the text says of Gomer”'
    claim: 'The lexicon lists the woman Gomer only at Hosea 1:3'
    key: bdb
    url: 'https://biblehub.com/hebrew/1586.htm'
    quote: '2. feminine wife of Hosea, Hosea 1:3.'
  - where: 'note 1:3 “What the text says of Gomer”'
    claim: 'The woman of chapter 3 is not named'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/3?lang=eng'
    quote: 'Go yet, love a woman beloved of her friend, yet an adulteress'
  - where: 'note 1:3 “What the text says of Gomer”'
    claim: 'Schade’s proposal that the name Gomer is turned to mean “done”'
    key: schade-hosea-family
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/imagery-hoseas-family-restoration-israel'
    quote: 'The name Gomer may have originally meant “perfection” or “complete” but has here become a pejorative “complete,” as in “done.”'
  - where: 'note 1:3 “What the text says of Gomer”'
    claim: 'The contrary judgment, as Schade prints Andersen and Freedman'
    key: schade-hosea-family
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/imagery-hoseas-family-restoration-israel'
    quote: 'The name does not seem to be symbolic; there is no wordplay on it as there is on the names of the children'

  # ---------- note 1:4 Jezreel ----------
  - where: 'note 1:4 “A son named for a place”'
    claim: 'Jezreel is the plain of Esdraelon'
    key: bd-jezreel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jezreel?lang=eng'
    quote: '(1) Plain of Esdraelon'
  - where: 'note 1:4 “A son named for a place”'
    claim: 'Jezreel is also a city on a hill in the plain, Ahab’s capital'
    key: bd-jezreel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jezreel?lang=eng'
    quote: 'A city on a hill rising out of the plain, belonging to the tribe of Issachar (Josh. 19:18). Ahab made it his capital'
  - where: 'note 1:4 “A son named for a place”'
    claim: 'Naboth’s vineyard was in Jezreel beside Ahab’s palace'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/21?lang=eng'
    quote: 'Naboth the Jezreelite had a vineyard, which was in Jezreel, hard by the palace of Ahab king of Samaria'
  - where: 'note 1:4 “A son named for a place”'
