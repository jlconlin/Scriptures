chapter: 14
claims:
  # ---- when ----
  - where: 'when'
    claim: 'Hosea ministered in the northern kingdom in the latter half of the eighth century B.C.'
    key: scripture-helps-hosea
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/45-hosea-1-6-10-14-joel?lang=eng'
    quote: 'His ministry took place in the Northern Kingdom of Israel during the latter half of the eighth century BC.'

  # ---- setting ----
  - where: 'setting'
    claim: 'Hosea prophesied when Israel was close to being conquered by Assyria'
    key: scripture-helps-hosea
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/45-hosea-1-6-10-14-joel?lang=eng'
    quote: 'Hosea prophesied during a time of great wickedness, when Israel was close to being conquered by the Assyrian empire.'
  - where: 'setting'
    claim: 'Hebrew Bibles number verses 1–9 of this chapter as 2–10'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2014&version=NIV'
    quote: 'In Hebrew texts 14:1-9 is numbered 14:2-10.'
  - where: 'setting'
    claim: 'The chapter is the conclusion of the prophet’s addresses: a call to conversion and a promise of grace'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/14.htm'
    quote: 'he concludes his addresses with a call to thorough conversion to the Lord, and the promise that the Lord will bestow His grace once more upon those who turn to Him'
  - where: 'setting'
    claim: 'The Church edition’s chapter heading places Ephraim’s return in the last days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/14?lang=eng'
    quote: 'In the last days, Ephraim will repent and return unto the Lord.'
  - where: 'setting'
    claim: 'Hosea 3:5 promises a return in the latter days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/3?lang=eng'
    quote: 'Afterward shall the children of Israel return, and seek the Lord their God, and David their king; and shall fear the Lord and his goodness in the latter days.'
  - where: 'setting'
    claim: 'One Latter-day Saint reading: the tribe of Joseph is to some extent being gathered again to the covenant in the Church'
    key: jackson-hosea-marriage
    url: 'https://rsc.byu.edu/isaiah-prophets/marriage-hosea-jehovahs-covenant-israel'
    quote: 'To some extent, the tribe of Joseph is being gathered again to Jehovah’s covenant in The Church of Jesus Christ of Latter-day Saints.'

  # ---- thread ----
  - where: 'thread'
    claim: 'The verb “return” (H7725) stands in verse 1 and in verse 7'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'יָשֻׁ֨בוּ֙'
  - where: 'thread'
    claim: 'The verb “stumble” (H3782) stands in verse 1 (“fallen”) and in verse 9 (“fall”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'יִכָּ֥שְׁלוּ'
  - where: 'thread'
    claim: 'The tree of verse 8 is evergreen'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2014&version=NRSVUE'
    quote: 'I am like an evergreen cypress;'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: '“Fallen” is stumbled'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2014&version=NRSVUE'
    quote: 'for you have stumbled because of your iniquity.'
  - where: 'section 1 plain'
    claim: '“Receive us graciously” is “accept what is good”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2014&version=NRSVUE'
    quote: 'accept that which is good,'
  - where: 'section 1 plain'
    claim: '“Calves” are young bulls, offered as the lips'
    key: bdb
    url: 'https://biblehub.com/hebrew/6499.htm'
    quote: 'we will pay (as with) bullocks, our lips'
  - where: 'section 1 plain'
    claim: 'Asshur is Assyria (the Church edition’s footnote)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/14?lang=eng'
    quote: 'IE Assyria.'
  - where: 'section 1 plain'
    claim: '“Neither will we say any more” is never again'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2014&version=NIV'
    quote: 'to what our own hands have made,'
  - where: 'section 2 plain'
    claim: '“Backsliding” is turning back'
    key: bdb
    url: 'https://biblehub.com/hebrew/4878.htm'
    quote: 'noun feminine turning back, apostasy'
  - where: 'section 2 plain'
    claim: '“Freely” is of His own free will'
    key: bdb
    url: 'https://biblehub.com/hebrew/5071.htm'
    quote: 'I (׳י) will love them freely'
  - where: 'section 2 plain'
    claim: '“Grow as the lily” is blossom; “cast forth his roots” is strike root'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2014&version=NRSVUE'
    quote: 'he shall blossom like the lily;'
  - where: 'section 2 plain'
    claim: '“Branches” are shoots; “smell” is fragrance'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2014&version=NRSVUE'
    quote: 'His shoots shall spread out;'
  - where: 'section 2 plain'
    claim: '“Revive as the corn” is flourish like grain'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2014&version=ESV'
    quote: 'they shall flourish like the grain;'
  - where: 'section 2 plain'
    claim: '“The scent thereof” is their fame'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2014&version=ESV'
    quote: 'their fame shall be like the wine of Lebanon.'
  - where: 'section 2 plain'
    claim: '“Shadow” is shade, and the Hebrew “his” is kept'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2014&version=NIV'
    quote: 'People will dwell again in his shade;'
  - where: 'section 3 plain'
    claim: '“Heard” is answered, and “observed” is watched over'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2014&version=NRSVUE'
    quote: 'It is I who answer and look after you.'
  - where: 'section 3 plain'
    claim: 'The green fir tree is an evergreen, and the fruit comes from the Lord'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2014&version=NRSVUE'
    quote: 'your fruit comes from me.'
  - where: 'section 4 plain'
    claim: '“Prudent” is discerning, and “fall” is stumble'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2014&version=NRSVUE'
    quote: 'those who are discerning know them.'
  - where: 'section 4 plain'
    claim: '“Right” is straight'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/hosea/14.htm'
    quote: 'for the ways of the Lord are straight'

  # ---- note 14:1 ----
  - where: 'note 14:1 “The book’s verb, one last time”'
    claim: 'The verb “return” (H7725) stands 22 times in Hosea, and in this chapter in verses 1, 2, 4 and 7 (count from scripts/hebrew.mjs hosea --word 7725); verse 4, “is turned away,” is this form'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'שָׁ֥ב'
  - where: 'note 14:1 “The book’s verb, one last time”'
    claim: 'Verse 2 (“turn to the LORD”) has the same verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'וְ/שׁ֖וּבוּ'
  - where: 'note 14:1 “The book’s verb, one last time”'
    claim: '“Backsliding” is a noun meaning a turning back'
    key: bdb
    url: 'https://biblehub.com/hebrew/4878.htm'
    quote: 'noun feminine turning back, apostasy'
  - where: 'note 14:1 “The book’s verb, one last time”'
    claim: 'The noun “backsliding” is formed from the verb “return” (the lexicon page’s word-origin line)'
    key: bdb
    url: 'https://biblehub.com/hebrew/4878.htm'
    quote: 'Word Origin: [from H7725 (שׁוּב - return)]'
  - where: 'note 14:1 “The book’s verb, one last time”'
    claim: '“Fallen” is stumbled'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2014&version=NRSVUE'
    quote: 'for you have stumbled because of your iniquity.'
  - where: 'note 14:1 “The book’s verb, one last time”'
    claim: 'The verb of “fallen” (H3782) is the last verb in the book (14:9, “shall fall”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'יִכָּ֥שְׁלוּ'

  # ---- note 14:2 words ----
  - where: 'note 14:2 “Words in place of an offering”'
    claim: 'The command is read against the rule not to appear before the Lord empty; what is needed is words of confession'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/14.htm'
    quote: 'do not appear before the Lord empty (Exodus 23:15; Exodus 34:20); but for this ye do not require outward sacrifices, but simply words, sc. those of confession of your guilt'
  - where: 'note 14:2 “Words in place of an offering”'
    claim: '“Receive us graciously” is “accept that which is good”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2014&version=NRSVUE'
    quote: 'accept that which is good,'
  - where: 'note 14:2 “Words in place of an offering”'
    claim: 'One reading: the good thing is the prayer itself'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/14.htm'
    quote: 'Accept the only good thing that we are able to bring, viz., the sacrifices of our lips.'
  - where: 'note 14:2 “Words in place of an offering”'
    claim: 'The Hebrew has “take” (H3947) with “words” and again with “good”: the first is this form'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'קְח֤וּ'
  - where: 'note 14:2 “Words in place of an offering”'
    claim: 'The second “take,” with “good” (H2896)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'וְ/קַח'

  # ---- note 14:2 calves ----
  - where: 'note 14:2 “Young bulls, or fruit”'
    claim: 'The Hebrew word is parim (H6499), young bulls'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'פָרִ֖ים'
  - where: 'note 14:2 “Young bulls, or fruit”'
    claim: 'The lexicon’s rendering of the line, and its preference for the Greek reading “fruit”'
    key: bdb
    url: 'https://biblehub.com/hebrew/6499.htm'
    quote: 'we will pay (as with) bullocks, our lips, but read'
  - where: 'note 14:2 “Young bulls, or fruit”'
    claim: 'The prayers of the lips are offered as the best offerings of the Mosaic law, young bullocks'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'To present the sincere prayers of one’s lips as an offering to the Lord was as precious as the best offerings in the Mosaic law, which were young oxen or bullocks'
  - where: 'note 14:2 “Young bulls, or fruit”'
    claim: '“Render” is to pay; one translation has paying vows with bulls'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2014&version=ESV'
    quote: 'and we will pay with bulls'
  - where: 'note 14:2 “Young bulls, or fruit”'
    claim: 'The same translation ends the line with the vows of our lips'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2014&version=ESV'
    quote: 'the vows of our lips.'
  - where: 'note 14:2 “Young bulls, or fruit”'
    claim: 'The Septuagint reads “fruit of our lips”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/hosea/14.htm'
    quote: 'we will render in return the fruit of our lips.'
  - where: 'note 14:2 “Young bulls, or fruit”'
    claim: 'Hebrews 13:15 alludes to the Septuagint’s rendering “fruit of lips”'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/14.htm'
    quote: 'to which there is an allusion in Hebrews 13:15'
  - where: 'note 14:2 “Young bulls, or fruit”'
    claim: 'The Hebrew text reads the consonants prym as calves; the Greek translators took the same consonants as fruit'
    key: bowen-fruit-of-loins
    url: 'https://interpreterfoundation.org/journal/thou-art-the-fruit-of-my-loins-the-interrelated-symbolism-and-meanings-of-the-names-joseph-and-ephraim-in-ancient-scripture'
    quote: 'understands the Hebrew consonants prym as “calves” (pārîm), while the lxx renders the same consonants in Greek as karpon “fruit.”'
  - where: 'note 14:2 “Young bulls, or fruit”'
    claim: 'A modern translation prints “the fruit of our lips”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2014&version=NRSVUE'
    quote: 'the fruit of our lips.'
  - where: 'note 14:2 “Young bulls, or fruit”'
    claim: 'Its note says the Greek and Syriac have fruit and the Hebrew has bulls'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2014&version=NRSVUE'
    quote: '14.2 Gk Syr: Heb bulls'

  # ---- note 14:3 Asshur ----
  - where: 'note 14:3 “Three helps given up by name”'
    claim: 'Asshur is Assyria (the Church edition’s footnote)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/14?lang=eng'
    quote: 'IE Assyria.'
  - where: 'note 14:3 “Three helps given up by name”'
    claim: 'The horses are war horses'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2014&version=NIV'
    quote: 'we will not mount warhorses.'
  - where: 'note 14:3 “Three helps given up by name”'
    claim: 'The Church edition’s footnote on “horses” gives Isaiah 31:1 and Hosea 1:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/14?lang=eng'
    quote: 'Isa. 31:1; Hosea 1:7'

  # ---- note 14:3 fatherless ----
  - where: 'note 14:3 “Lo-ruhamah’s word, without the “not””'
    claim: 'The passive of the verb means to be shown compassion: of orphans here, of the children of Israel in chapter 2, compared with the name Lo-ruhamah'
    key: bdb
    url: 'https://biblehub.com/hebrew/7355.htm'
    quote: 'be shewn compassion, compassionated: of orphans Hosea 14:4; children of Israel wife of Yahweh Hosea 2:3; Hosea 2:25'
  - where: 'note 14:3 “Lo-ruhamah’s word, without the “not””'
    claim: 'The verb (H7355) stands seven times in Hosea, last in 14:3 (count from scripts/hebrew.mjs hosea --word 7355)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'יְרֻחַ֥ם'
  - where: 'note 14:3 “Lo-ruhamah’s word, without the “not””'
    claim: 'The clause has been read as a play on the name Lo-ruhamah'
    key: bowen-fruit-of-loins
    url: 'https://interpreterfoundation.org/journal/thou-art-the-fruit-of-my-loins-the-interrelated-symbolism-and-meanings-of-the-names-joseph-and-ephraim-in-ancient-scripture'
    quote: 'the phrases “Asshur will not save us” and “in thee the fatherless find mercy” play on the names Hosea and Lo-ruhamah, respectively.'
  - where: 'note 14:3 “Lo-ruhamah’s word, without the “not””'
    claim: 'Modern translations have “orphan”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2014&version=NRSVUE'
    quote: 'In you the orphan finds mercy.'
  - where: 'note 14:4 “Love given of His own accord”'
    claim: 'Nedavah means voluntariness and a freewill offering'
    key: bdb
    url: 'https://biblehub.com/hebrew/5071.htm'
    quote: 'noun feminine voluntariness, freewill-offering'
  - where: 'note 14:4 “Love given of His own accord”'
    claim: 'The second sense is the voluntary offering'
    key: bdb
    url: 'https://biblehub.com/hebrew/5071.htm'
    quote: '2 freewill, voluntary, offering:'
  - where: 'note 14:4 “Love given of His own accord”'
    claim: '“Backsliding” is turning back, apostasy'
    key: bdb
    url: 'https://biblehub.com/hebrew/4878.htm'
    quote: 'noun feminine turning back, apostasy'
  - where: 'note 14:4 “Love given of His own accord”'
    claim: 'A modern translation: “I will heal their disloyalty”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2014&version=NRSVUE'
    quote: 'I will heal their disloyalty;'
  - where: 'note 14:4 “Love given of His own accord”'
    claim: 'The verb “heal” (H7495) stands five times in Hosea: 5:13; 6:1; 7:1; 11:3; 14:4 (count from scripts/hebrew.mjs hosea --word 7495)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'אֶרְפָּא֙'

  # ---- note 14:5 ----
  - where: 'note 14:5 “The Lord as the dew”'
    claim: 'Dew mattered in that land because of the long rainless season'
    key: bd-dew
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/dew?lang=eng'
    quote: 'Of great importance in Palestine owing to the want of rain during a large portion of the year; hence spoken of as a source of fertility'
  - where: 'note 14:5 “The Lord as the dew”'
    claim: 'In poetry dew stands for a benefit that comes quietly'
    key: bd-dew
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/dew?lang=eng'
    quote: 'typical of any beneficial effect produced by quiet means'
  - where: 'note 14:5 “The Lord as the dew”'
    claim: 'The lexicon: dew as transitory in Hosea 6:4'
    key: bdb
    url: 'https://biblehub.com/hebrew/2919.htm'
    quote: 'as transitory'
  - where: 'note 14:5 “The Lord as the dew”'
    claim: 'The lexicon: dew as a figure of the Lord’s kindness in Hosea 14:5 (Hebrew 14:6)'
    key: bdb
    url: 'https://biblehub.com/hebrew/2919.htm'
    quote: 'kindness Hosea 14:6'
  - where: 'note 14:5 “The Lord as the dew”'
    claim: '“Grow as the lily” is blossom like the lily'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2014&version=NRSVUE'
    quote: 'he shall blossom like the lily;'
  - where: 'note 14:5 “The Lord as the dew”'
    claim: 'The Hebrew has only “like Lebanon”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2014&version=NRSVUE'
    quote: '14.5 Cn: Heb like Lebanon'
  - where: 'note 14:5 “The Lord as the dew”'
    claim: 'One translation supplies “the forests of Lebanon”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2014&version=NRSVUE'
    quote: 'he shall strike root like the forests of Lebanon.'
  - where: 'note 14:5 “The Lord as the dew”'
    claim: 'Another supplies “a cedar of Lebanon”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2014&version=NIV'
    quote: 'Like a cedar of Lebanon'

  # ---- note 14:6 ----
  - where: 'note 14:6 “Israel as an olive tree”'
    claim: 'Jeremiah 11:16 calls Israel a green olive tree and kindles fire on its branches'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/11?lang=eng'
    quote: 'with the noise of a great tumult he hath kindled fire upon it, and the branches of it are broken.'
  - where: 'note 14:6 “Israel as an olive tree”'
    claim: 'Zenos likens the house of Israel to a tame olive tree'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/jacob/5?lang=eng'
    quote: 'I will liken thee, O house of Israel, like unto a tame olive tree'
  - where: 'note 14:6 “Israel as an olive tree”'
    claim: 'Hosea 14:4–8 is among the passages that dwell on the Lord planting, tending and blessing the tree'
    key: sc-knowhy-440
    url: 'https://scripturecentral.org/knowhy/did-prophets-such-as-ezekiel-know-the-writings-of-zenos'
    quote: 'focus primarily on the positive aspects of the Lord planting, taking care of, and blessing the tree.'
  - where: 'note 14:6 “Israel as an olive tree”'
    claim: 'Other passages tell of the tree’s uprooting and burning'
    key: sc-knowhy-440
    url: 'https://scripturecentral.org/knowhy/did-prophets-such-as-ezekiel-know-the-writings-of-zenos'
    quote: 'feature the uprooting, burning, destruction, and cursing of the tree.'
  - where: 'note 14:6 “Israel as an olive tree”'
    claim: 'Zenos’s allegory has both'
    key: sc-knowhy-440
    url: 'https://scripturecentral.org/knowhy/did-prophets-such-as-ezekiel-know-the-writings-of-zenos'
    quote: 'Both dimensions are found, combined seamlessly into one whole, in Zenos’s allegory.'
  - where: 'note 14:6 “Israel as an olive tree”'
    claim: 'One translation keeps the Hebrew “his” in verse 7'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2014&version=NIV'
    quote: 'People will dwell again in his shade;'
  - where: 'note 14:6 “Israel as an olive tree”'
    claim: 'Another reads “my shadow”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2014&version=NRSVUE'
    quote: 'They shall again live beneath my shadow;'
  - where: 'note 14:6 “Israel as an olive tree”'
    claim: 'Its note says the Hebrew has “his”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2014&version=NRSVUE'
    quote: '14.7 Heb his'

  # ---- note 14:8 ----
  - where: 'note 14:8 “Who is speaking, and Ephraim’s name”'
    claim: 'The Hebrew of verse 8 begins with the bare name Ephraim, with no verb of saying (scripts/hebrew.mjs hosea 14:8)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'אֶפְרַ֕יִם'
  - where: 'note 14:8 “Who is speaking, and Ephraim’s name”'
    claim: 'Some translations take the name as an address and the Lord as the speaker'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2014&version=NRSVUE'
    quote: 'O Ephraim, what have I to do with idols?'
