chapter: 11
claims:
  # ---- when ----
  - where: 'when'
    claim: 'Hosea ministered in the northern kingdom in the latter half of the eighth century B.C.'
    key: scripture-helps-hosea
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/45-hosea-1-6-10-14-joel?lang=eng'
    quote: 'His ministry took place in the Northern Kingdom of Israel during the latter half of the eighth century BC.'

  # ---- setting ----
  - where: 'setting'
    claim: 'Hosea ministered in the north in the later 700s B.C., when Assyria was close to conquering Israel'
    key: scripture-helps-hosea
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/45-hosea-1-6-10-14-joel?lang=eng'
    quote: 'Hosea prophesied during a time of great wickedness, when Israel was close to being conquered by the Assyrian empire.'
  - where: 'setting'
    claim: 'This is the third time in three chapters that the book goes back to Israel’s beginnings (9:10; 10:1; 11:1)'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/11.htm'
    quote: 'The prophet goes back a third time (cf. Hosea 10:1; Hosea 9:10) to the early times of Israel'
  - where: 'setting'
    claim: 'Assyria took Samaria and carried Israel away'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/17?lang=eng'
    quote: 'In the ninth year of Hoshea the king of Assyria took Samaria, and carried Israel away into Assyria'
  - where: 'setting'
    claim: 'Matthew quotes verse 1 of the child Jesus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/2?lang=eng'
    quote: 'that it might be fulfilled which was spoken of the Lord by the prophet, saying, Out of Egypt have I called my son.'
  - where: 'setting'
    claim: 'Hosea 11:1–4 is a passage where the King James Version is hard to follow and a clearer translation helps'
    key: sears-study-bibles
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/study-bibles'
    quote: 'As an example of a passage in which the King James Version falls short, consider Hosea 11:1–4:'

  # ---- thread ----
  - where: 'thread'
    claim: 'The verb “return” in verse 5 (Israel will not return to Egypt; they refused to return) is Strong’s 7725'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'יָשׁוּב֙'
  - where: 'thread'
    claim: 'The verb “return” in verse 9 (“I will not return to destroy Ephraim”) is the same verb (Strong’s 7725)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'אָשׁ֖וּב'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: '“Taught … to go” is taught to walk'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2011&version=NRSVUE'
    quote: 'Yet it was I who taught Ephraim to walk;'
  - where: 'section 1 plain'
    claim: 'The yoke is eased and the Lord feeds them'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2011&version=ESV'
    quote: 'I became to them as one who eases the yoke on their jaws,'
  - where: 'section 1 plain'
    claim: '“Laid meat unto them” is fed them'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2011&version=NRSVUE'
    quote: 'I bent down to them and fed them.'
  - where: 'section 2 plain'
    claim: '“Branches” in verse 6 are the bars of the gates'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2011&version=ESV'
    quote: 'consume the bars of their gates,'
  - where: 'section 2 plain'
    claim: 'The lexicon gives the word in 11:6 as bars of a fortress'
    key: bdb
    url: 'https://biblehub.com/hebrew/905.htm'
    quote: '(d) more Generally bars (of fortress) Hosea 11:6'
  - where: 'section 3 plain'
    claim: '“Repentings” are compassion, and “kindled” is grown warm'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2011&version=NRSVUE'
    quote: 'my compassion grows warm and tender.'
  - where: 'section 3 plain'
    claim: 'The footnote on “enter” in verse 9 gives “come in anger”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/11?lang=eng'
    quote: 'OR come in anger.'
  - where: 'section 4 plain'
    claim: '“Tremble from” is to come trembling'
    key: bdb
    url: 'https://biblehub.com/hebrew/2729.htm'
    quote: '4 with prepositions pregnantly = go or come trembling'
  - where: 'section 5 plain'
    claim: 'The footnote on “ruleth” in verse 12 gives “walks”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/11?lang=eng'
    quote: 'OR walks.'

  # ---- note 11:1 ----
  - where: 'note 11:1 “Israel the son, and Matthew’s use of the line”'
    claim: 'The line rests on Exodus 4:22–23, where Israel is the Lord’s son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/4?lang=eng'
    quote: 'And thou shalt say unto Pharaoh, Thus saith the Lord, Israel is my son, even my firstborn:'
  - where: 'note 11:1 “Israel the son, and Matthew’s use of the line”'
    claim: 'Family terms were treaty language in the ancient Near East, and Israel is the Lord’s covenant son in Hosea 11:1–4'
    key: sc-knowhy-131
    url: 'https://scripturecentral.org/knowhy/why-did-converted-lamanites-call-themselves-anti-nephi-lehies'
    quote: 'the participating powers often employed familial language to describe the diplomatic relationships between themselves, including “father,” “son,” and “brother.” Israel is called Jehovah’s covenant “son” in such places as the book of Hosea (cf. Hosea 11:1–4).'
  - where: 'note 11:1 “Israel the son, and Matthew’s use of the line”'
    claim: 'In Hosea the line looks back on Israel’s past'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'This statement could be interpreted by seeing Israel collectively as the son that was called out of Egypt, and thus a statement that spoke to Israel’s past experiences.'
  - where: 'note 11:1 “Israel the son, and Matthew’s use of the line”'
    claim: 'Matthew reads the line typologically of Joseph taking Jesus and Mary to and from Egypt'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Matthew chooses to interpret the Hosea passage typologically, seeing Hosea’s statement as being consummated in the story of Joseph’s taking Jesus and Mary to (and later from) Egypt'
  - where: 'note 11:1 “Israel the son, and Matthew’s use of the line”'
    claim: 'Matthew’s account sets Jesus beside Moses; both were spared when other infants were killed'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Both were spared from infanticide while most around them were not.'
  - where: 'note 11:1 “Israel the son, and Matthew’s use of the line”'
    claim: 'Matthew 2:13–15: the flight to Egypt and the quotation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/2?lang=eng'
    quote: 'And was there until the death of Herod: that it might be fulfilled which was spoken of the Lord by the prophet, saying, Out of Egypt have I called my son.'
  - where: 'note 11:1 “Israel the son, and Matthew’s use of the line”'
    claim: 'The Septuagint reads “his children,” not “my son”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/hosea/11.htm'
    quote: 'for Israel is a child, and I loved him, and out of Egypt have I called his children.'
  - where: 'note 11:1 “Israel the son, and Matthew’s use of the line”'
    claim: 'The Hebrew has “my son”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'קָרָ֥אתִי'
  - where: 'note 11:1 “Israel the son, and Matthew’s use of the line”'
    claim: 'The Church’s chapter heading calls the Exodus a similitude of the Lord’s coming out of Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/11?lang=eng'
    quote: 'Israel, as a child, was called out of Egypt in similitude of our Lord, as a child, coming out of Egypt'
  - where: 'note 11:1 “Israel the son, and Matthew’s use of the line”'
    claim: 'Matthew saw Israel’s Exodus as a type or pattern'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'Matthew saw the emergence of Israel from Egypt as a type or pattern of Jesus’ coming out of Egypt (see Matthew 2:15).'

  # ---- note 11:2 ----
  - where: 'note 11:2 “Who called, and who went away”'
    claim: 'The Hebrew verb is “they called,” with no subject named; it is the verb of verse 1 (Strong’s 7121)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'קָרְא֖וּ'
  - where: 'note 11:2 “Who called, and who went away”'
    claim: 'One reading: the callers are the prophets'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/11.htm'
    quote: 'as the prophets called, so the Israelites drew back from them, and served idols.'
  - where: 'note 11:2 “Who called, and who went away”'
    claim: 'The Septuagint has the Lord calling and Israel leaving His presence'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/hosea/11.htm'
    quote: 'As I called them, so they departed from my presence'
  - where: 'note 11:2 “Who called, and who went away”'
    claim: 'The NRSVUE follows the Greek'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2011&version=NRSVUE'
    quote: 'The more I called them, the more they went from me;'
  - where: 'note 11:2 “Who called, and who went away”'
    claim: 'The NRSVUE notes that the Hebrew has “they” and “them”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2011&version=NRSVUE'
    quote: '11.2 Gk: Heb they'
  - where: 'note 11:2 “Who called, and who went away”'
    claim: 'The NIV likewise follows the Septuagint for “from me”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2011&version=NIV'
    quote: 'Hosea 11:2 Septuagint; Hebrew them'

  # ---- note 11:3 ----
  - where: 'note 11:3 “A father teaching a child to walk”'
    claim: '“To go” is to walk, and the Lord takes them up in His arms'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2011&version=NRSVUE'
    quote: 'Yet it was I who taught Ephraim to walk; I took them up in my arms,'
  - where: 'note 11:3 “A father teaching a child to walk”'
    claim: 'Read in a clearer translation, the passage is a father’s care for a toddler'
    key: sears-study-bibles
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/study-bibles'
    quote: 'The entire passage takes on a striking poignancy as God compares his love for Israel to the tender care of a father for a toddler.'
  - where: 'note 11:3 “A father teaching a child to walk”'
    claim: '“Knew” in 11:3 is Strong’s 3045'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'יָדְע֖וּ'
  - where: 'note 11:3 “A father teaching a child to walk”'
    claim: '“Know” in 2:8 is the same verb (Strong’s 3045)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'יָֽדְעָ֔ה'

  # ---- note 11:4 ----
  - where: 'note 11:4 “The yoke lifted so the ox can eat”'
    claim: 'The custom behind the image: the yoke is raised so the ox can eat'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'This is an agricultural simile, and refers to the custom of raising the yoke from the neck and cheeks of the oxen so that they can more readily eat their food.'
  - where: 'note 11:4 “The yoke lifted so the ox can eat”'
    claim: 'The ESV keeps the yoke'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2011&version=ESV'
    quote: 'I became to them as one who eases the yoke on their jaws,'
  - where: 'note 11:4 “The yoke lifted so the ox can eat”'
    claim: 'The ESV note: “kindness” is “man” in Hebrew'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2011&version=ESV'
    quote: 'Hosea 11:4 Or humaneness; Hebrew man'
  - where: 'note 11:4 “The yoke lifted so the ox can eat”'
    claim: '“Cords of a man” rendered “cords of human kindness”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2011&version=NRSVUE'
    quote: 'I led them with cords of human kindness,'
  - where: 'note 11:4 “The yoke lifted so the ox can eat”'
    claim: '“Laid meat unto them” is fed them'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2011&version=NRSVUE'
    quote: 'I bent down to them and fed them.'
  - where: 'note 11:4 “The yoke lifted so the ox can eat”'
    claim: 'The NRSVUE reads infants lifted to the cheek, not a yoke'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2011&version=NRSVUE'
    quote: 'I was to them like those who lift infants to their cheeks.'
  - where: 'note 11:4 “The yoke lifted so the ox can eat”'
    claim: 'The NIV reads a little child lifted to the cheek'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2011&version=NIV'
    quote: 'a little child to the cheek,'
  - where: 'note 11:4 “The yoke lifted so the ox can eat”'
    claim: 'The Hebrew text has the word for yoke (Strong’s 5923)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'עֹ֖ל'
  - where: 'note 11:4 “The yoke lifted so the ox can eat”'
    claim: 'The word ol is a yoke for cattle, and the lexicon lists its use here'
    key: bdb
    url: 'https://biblehub.com/hebrew/5923.htm'
    quote: 'yoke, for cattle'

  # ---- note 11:5 ----
  - where: 'note 11:5 “Egypt, or not Egypt”'
    claim: 'The NRSVUE drops the negative'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2011&version=NRSVUE'
    quote: 'They shall return to the land of Egypt,'
  - where: 'note 11:5 “Egypt, or not Egypt”'
    claim: 'The NRSVUE supplies “to me” after “return”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2011&version=NRSVUE'
    quote: 'because they have refused to return to me.'
  - where: 'note 11:5 “Egypt, or not Egypt”'
    claim: 'The NIV makes the line a question'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2011&version=NIV'
    quote: 'Will they not return to Egypt'
  - where: 'note 11:5 “Egypt, or not Egypt”'
    claim: 'The ESV keeps the negative'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2011&version=ESV'
    quote: 'They shall not return to the land of Egypt,'
  - where: 'note 11:5 “Egypt, or not Egypt”'
    claim: 'The ESV note offers “surely”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2011&version=ESV'
    quote: 'Hosea 11:5 Or surely'
  - where: 'note 11:5 “Egypt, or not Egypt”'
    claim: 'The Septuagint has Ephraim dwelling in Egypt'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/hosea/11.htm'
    quote: 'Ephraim dwelt in Egypt; and as for the Assyrian, he was his king, because he would not return.'
  - where: 'note 11:5 “Egypt, or not Egypt”'
    claim: 'One resolution: in 8:13 and 9:3 Egypt is a figure for bondage; here it is the country itself'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/11.htm'
    quote: 'Egypt is a type of the land of bondage; whereas here the typical interpretation is precluded partly by the contrast to Asshur, and still more by the correspondence in which the words stand to Hosea 11:1.'
  - where: 'note 11:5 “Egypt, or not Egypt”'
    claim: 'On that reading Israel does not go back to the land it was called from'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/11.htm'
    quote: 'Into the land from which Jehovah called His people, Israel shall not return'
  - where: 'note 11:5 “Egypt, or not Egypt”'
    claim: 'It goes into another bondage'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/11.htm'
    quote: 'But it is to be brought into another bondage.'
  - where: 'note 11:5 “Egypt, or not Egypt”'
    claim: 'The verb “return” stands twice in the verse (Strong’s 7725)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'יָשׁוּב֙'
  - where: 'note 11:5 “Egypt, or not Egypt”'
    claim: 'Assyria took Samaria and carried Israel away'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/17?lang=eng'
    quote: 'the king of Assyria took Samaria, and carried Israel away into Assyria'

  # ---- note 11:7 ----
  - where: 'note 11:7 “Hung upon turning away”'
    claim: 'The Hebrew word is “hung up,” and the lexicon calls the King James sense very dubious'
    key: bdb
    url: 'https://biblehub.com/hebrew/8511.htm'
    quote: 'Hosea 11:7 my people is hung up to my backsliding'
  - where: 'note 11:7 “Hung upon turning away”'
    claim: 'The lexicon on the King James rendering'
    key: bdb
    url: 'https://biblehub.com/hebrew/8511.htm'
    quote: 'AV bent to backsliding from me, i.e. huge or swung toward turning from me, compare GASm, but very dubious'
  - where: 'note 11:7 “Hung upon turning away”'
    claim: 'The NRSVUE rendering of the verse'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2011&version=NRSVUE'
    quote: 'My people are bent on turning away from me. To the Most High they call, but he does not raise them up at all.'
  - where: 'note 11:7 “Hung upon turning away”'
    claim: 'The NIV rendering of the second half'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2011&version=NIV'
    quote: 'Even though they call me God Most High, I will by no means exalt them.'

  # ---- note 11:8 Admah ----
  - where: 'note 11:8 “Admah and Zeboim”'
    claim: 'Admah and Zeboiim are named with Sodom and Gomorrah among the cities of the plain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/14?lang=eng'
    quote: 'Bera king of Sodom, and with Birsha king of Gomorrah, Shinab king of Admah, and Shemeber king of Zeboiim'
  - where: 'note 11:8 “Admah and Zeboim”'
    claim: 'Deuteronomy names all four in the overthrow'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/29?lang=eng'
    quote: 'like the overthrow of Sodom, and Gomorrah, Admah, and Zeboim, which the Lord overthrew in his anger, and in his wrath'
  - where: 'note 11:8 “Admah and Zeboim”'
    claim: 'In Deuteronomy 29 that ruin is what comes of forsaking the covenant for other gods'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/29?lang=eng'
    quote: 'Because they have forsaken the covenant of the Lord God of their fathers'
  - where: 'note 11:8 “Admah and Zeboim”'
    claim: 'Hosea names the two with evident reference to Deuteronomy 29'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/11.htm'
    quote: 'With evident reference to this passage, in which Moses threatens idolatrous Israel with the same punishment, Hosea simply mentions the last two as quite sufficient for his purpose'

  - where: 'note 11:8 “Admah and Zeboim”'
    claim: 'Genesis 19:24 names only Sodom and Gomorrah; Deuteronomy names Admah and Zeboim with them'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/11.htm'
    quote: 'where Admah and Zeboim are expressly mentioned along with the cities of Sodom and Gomorrha, which stand alone in Genesis 19:24'

  # ---- note 11:8 repentings ----
  - where: 'note 11:8 “Repentings are compassions”'
    claim: 'The noun means compassion in this verse'
    key: bdb
    url: 'https://biblehub.com/hebrew/5150.htm'
    quote: '2 compassion, suffix'
  - where: 'note 11:8 “Repentings are compassions”'
    claim: '“Kindled” is to grow warm and tender; the lexicon lists Genesis 43:30, 1 Kings 3:26 and this verse'
    key: bdb
    url: 'https://biblehub.com/hebrew/3648.htm'
    quote: '1 grow warm and tender, figurative, subject'
  - where: 'note 11:8 “Repentings are compassions”'
    claim: 'A modern rendering of the two lines'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2011&version=NRSVUE'
    quote: 'My heart recoils within me; my compassion grows warm and tender.'
  - where: 'note 11:8 “Repentings are compassions”'
    claim: 'The Joseph Smith Translation of the end of the verse, as the footnote gives it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/11?lang=eng'
    quote: 'toward thee, and my mercies are extended to gather thee.'

  # ---- note 11:9 ----
  - where: 'note 11:9 “Why being God is the reason for mercy”'
    claim: 'The captivity is still coming when verse 8 is spoken'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'Note God’s agony over the impending captivity.'
  - where: 'note 11:9 “Why being God is the reason for mercy”'
    claim: '“Not return to destroy” is “not again destroy”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2011&version=NRSVUE'
    quote: 'I will not again destroy Ephraim,'
  - where: 'note 11:9 “Why being God is the reason for mercy”'
    claim: 'The footnote on “enter”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/11?lang=eng'
    quote: 'OR come in anger.'
  - where: 'note 11:9 “Why being God is the reason for mercy”'
    claim: 'The ESV has “come in wrath”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2011&version=ESV'
    quote: 'and I will not come in wrath.'
