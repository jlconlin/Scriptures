chapter: 4
claims:
  # ---------- when ----------
  - where: 'when'
    claim: 'Hosea ministered as the northern kingdom slid toward destruction by Assyria (the article gives 721 BC for the fall)'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Under these circumstances, Amos, Hosea, Jonah, and Micah ministered.'

  # ---------- setting ----------
  - where: 'setting'
    claim: 'Chapters 1–3 are narrative; chapters 4–14 are prophetic oracles'
    key: hord-not-fragile
    url: 'https://rsc.byu.edu/vol-23-no-1-2022/god-not-fragile'
    quote: 'Chapters 1–3 are narrative in form, whereas chapters 4–14 are prophetic oracles.'
  - where: 'setting'
    claim: 'From chapter 4 Hosea’s marriage is no longer mentioned, but marriage remains the image'
    key: jackson-hosea-marriage
    url: 'https://rsc.byu.edu/isaiah-prophets/marriage-hosea-jehovahs-covenant-israel'
    quote: 'Beginning in chapter 4 the marriage of Hosea is no longer a factor in his prophecy. But marriage remains the image through which his message is conveyed.'
  - where: 'setting'
    claim: 'Israel took prosperity for God’s favor while sliding toward destruction by Assyria'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'material prosperity was an absolute sign of God’s pleasure resting upon them, yet the northern kingdom of Israel was sliding rapidly toward her destruction at the hands of Assyrian forces'
  - where: 'setting'
    claim: 'Hosea and Amos prophesied in the reign of Jeroboam Ⅱ and denounced the kingdom’s idolatry, licentiousness and oppression'
    key: bd-jeroboam
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeroboam?lang=eng'
    quote: 'Amos and Hosea prophesied during his reign, and denounced the idolatry, licentiousness, and oppression that prevailed throughout the kingdom.'
  - where: 'setting'
    claim: 'Jeroboam the son of Nebat, first king of the divided kingdom, set up the calves at Dan and Bethel and made priests not of Aaron’s family; he is a different king from Jeroboam Ⅱ'
    key: bd-jeroboam
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeroboam?lang=eng'
    quote: 'one of Jeroboam’s first steps after the separation was to set up image worship in Dan and Bethel'
  - where: 'setting'
    claim: 'Jeroboam made priests who were not Levites'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/12?lang=eng'
    quote: 'made priests of the lowest of the people, which were not of the sons of Levi'
  - where: 'setting'
    claim: 'The hearers are the children of Israel; the chapter heading'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/4?lang=eng'
    quote: 'Israel loses all truth, mercy, and knowledge of God and goes whoring after false gods.'

  # ---------- thread ----------
  - where: 'thread'
    claim: 'The chapter opens as a case at law'
    key: bdb
    url: 'https://biblehub.com/hebrew/7379.htm'
    quote: 'especially dispute, controversy, case at law'
  - where: 'thread'
    claim: 'The five offenses of verse 2 are prohibited in the Ten Commandments'
    key: jackson-hosea-marriage
    url: 'https://rsc.byu.edu/isaiah-prophets/marriage-hosea-jehovahs-covenant-israel'
    quote: 'All five of these are prohibited in the Ten Commandments'
  - where: 'thread'
    claim: 'The staff of verse 12 is a diviner’s rod'
    key: bdb
    url: 'https://biblehub.com/hebrew/4731.htm'
    quote: 'wand of diviner Hosea 4:12'

  # ---------- sections ----------
  - where: 'section 1 plain'
    claim: '“Break out” means break all bounds; “blood toucheth blood” means bloodshed follows bloodshed (the Church’s footnotes)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/4?lang=eng'
    quote: 'IE break all bounds.'
  - where: 'section 1 plain'
    claim: '“Blood toucheth blood” rendered bloodshed follows bloodshed; “swearing” as cursing'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%204&version=NIV'
    quote: 'bloodshed follows bloodshed'
  - where: 'section 2 plain'
    claim: '“Fall” rendered stumble; “no priest to me” as rejected from being a priest'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%204&version=ESV'
    quote: 'I reject you from being a priest to me'
  - where: 'section 2 plain'
    claim: '“Eat up the sin” rendered feed on the sin'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%204&version=ESV'
    quote: 'They feed on the sin of my people'
  - where: 'section 3 plain'
    claim: '“Take away the heart” rendered take away the understanding'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%204&version=NRSVUE'
    quote: 'take away the understanding'
  - where: 'section 3 plain'
    claim: '“Stocks” rendered a piece of wood; “spouses” rendered brides; “elms” terebinth'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%204&version=ESV'
    quote: 'and your brides commit adultery'
  - where: 'section 3 plain'
    claim: 'The “harlots” they sacrifice with are women of the shrines (qedeshot)'
    key: bdb
    url: 'https://biblehub.com/hebrew/6945.htm'
    quote: 'plural קְדֵשׁוֺת Hosea 4:14'
  - where: 'section 4 plain'
    claim: '“Backsliding” rendered stubborn'
    key: bdb
    url: 'https://biblehub.com/hebrew/5637.htm'
    quote: 'Hosea 4:16 Israel is stubborn'
  - where: 'section 4 plain'
    claim: '“With shame do love” means deeply love dishonor (the Church’s footnote); rulers dearly love shame'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/4?lang=eng'
    quote: 'OR deeply love dishonor.'
  - where: 'section 4 plain'
    claim: '“Bound her up in her wings” rendered wrapped in its wings'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%204&version=ESV'
    quote: 'A wind has wrapped them in its wings'

  # ---------- note 4:1 controversy ----------
  - where: 'note 4:1 “A controversy is a lawsuit”'
    claim: 'The Hebrew of “controversy” in 4:1 is rib (H7379)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'רִ֤יב'
  - where: 'note 4:1 “A controversy is a lawsuit”'
    claim: 'Rib is a dispute, a controversy, a case at law, and is so used of the Lord in Hosea 4:1 and Micah 6:2'
    key: bdb
    url: 'https://biblehub.com/hebrew/7379.htm'
    quote: 'especially dispute, controversy, case at law'
  - where: 'note 4:1 “A controversy is a lawsuit”'
    claim: 'In 4:1 the Lord accuses Israel and brings legal proceedings for breach of covenant'
    key: jackson-hosea-marriage
    url: 'https://rsc.byu.edu/isaiah-prophets/marriage-hosea-jehovahs-covenant-israel'
    quote: 'He brings legal proceedings against her for breach of covenant'
  - where: 'note 4:1 “A controversy is a lawsuit”'
    claim: 'The form in which a prophet brings a people to trial has been called a prophetic lawsuit'
    key: sc-knowhy-179
    url: 'https://scripturecentral.org/knowhy/why-did-nephi-rely-on-earlier-testimonies-of-christ'
    quote: 'This is an example of an ancient practice called a “prophetic lawsuit.”'
  - where: 'note 4:1 “A controversy is a lawsuit”'
    claim: 'Hosea 4:1–3 is among the passages regularly identified as prophetic lawsuits, with Isaiah 1 and Micah 6'
    key: sc-knowhy-179
    url: 'https://scripturecentral.org/knowhy/why-did-nephi-rely-on-earlier-testimonies-of-christ'
    quote: 'Hosea 4:1–3'
  - where: 'note 4:1 “A controversy is a lawsuit”'
    claim: 'Micah 6:2 has the Lord’s controversy with His people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/6?lang=eng'
    quote: 'the Lord hath a controversy with his people, and he will plead with Israel'
  - where: 'note 4:1 “A controversy is a lawsuit”'
    claim: 'Rib occurs twice in Hosea, at 4:1 and 12:2 (hebrew.mjs hosea --word 7379)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'וְ/רִ֥יב'

  # ---------- note 4:1 three things ----------
  - where: 'note 4:1 “The three things missing”'
    claim: 'Emet means more than truth: honesty, integrity, stability, permanence'
    key: jackson-hosea-marriage
    url: 'https://rsc.byu.edu/isaiah-prophets/marriage-hosea-jehovahs-covenant-israel'
    quote: 'It means also honesty, integrity, stability, and permanence.'
  - where: 'note 4:1 “The three things missing”'
    claim: 'Mercy is hesed, loving-kindness or unfailing love that translates into action'
    key: jackson-hosea-marriage
    url: 'https://rsc.byu.edu/isaiah-prophets/marriage-hosea-jehovahs-covenant-israel'
    quote: 'It means loving–kindness or unfailing love. It is the kind of love that translates into action'
  - where: 'note 4:1 “The three things missing”'
    claim: 'Hesed (H2617) is in Hosea six times: 2:19; 4:1; 6:4, 6; 10:12; 12:6 (hebrew.mjs hosea --word 2617)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'חֶ֛סֶד'
  - where: 'note 4:1 “The three things missing”'
    claim: 'Da’at in 4:1 and 4:6 is set under the highest sense, knowledge of God including obedience'
    key: bdb
    url: 'https://biblehub.com/hebrew/1847.htm'
    quote: 'in highest sense, knowledge of God (including obedience) Hosea 4:1,6'
  - where: 'note 4:1 “The three things missing”'
    claim: 'Knowledge is connected with “know” used of husband and wife, and describes the exclusive intimacy of the covenant bond'
    key: jackson-hosea-marriage
    url: 'https://rsc.byu.edu/isaiah-prophets/marriage-hosea-jehovahs-covenant-israel'
    quote: 'The concept of “knowledge,” used to describe the exclusive intimacy of the covenant bond, is very important.'
  - where: 'note 4:1 “The three things missing”'
    claim: 'The same three terms are in Hosea 2:19–20; when they are present the covenant faith is intact'
    key: jackson-hosea-marriage
    url: 'https://rsc.byu.edu/isaiah-prophets/marriage-hosea-jehovahs-covenant-israel'
    quote: 'When they are present, the covenant faith is intact. When they are gone, the covenant faith is lost.'
  - where: 'note 4:1 “The three things missing”'
    claim: 'Hosea 2:19–20 promises betrothal in lovingkindness and faithfulness, and knowing the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/2?lang=eng'
    quote: 'I will even betroth thee unto me in faithfulness: and thou shalt know the Lord.'

  # ---------- note 4:2 ----------
  - where: 'note 4:2 “The commandments, broken one after another”'
    claim: 'The five offenses are prohibited in the Ten Commandments'
    key: jackson-hosea-marriage
    url: 'https://rsc.byu.edu/isaiah-prophets/marriage-hosea-jehovahs-covenant-israel'
    quote: 'All five of these are prohibited in the Ten Commandments'
  - where: 'note 4:2 “The commandments, broken one after another”'
    claim: 'When the three qualities are absent the conditions of verse 2 come to the fore'
    key: jackson-hosea-marriage
    url: 'https://rsc.byu.edu/isaiah-prophets/marriage-hosea-jehovahs-covenant-israel'
    quote: 'when those fundamentals are absent, the conditions described in the next verse come to the fore'
  - where: 'note 4:2 “The commandments, broken one after another”'
    claim: 'Hosea 4:2 has the verbs ratsach (H7523), ganab (H1589) and na’aph (H5003), as bare infinitives joined by “and”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'וְ/רָצֹ֥חַ'
  - where: 'note 4:2 “The commandments, broken one after another”'
    claim: 'Exodus 20:13–15 uses the same three verbs (H7523, H5003, H1589) (hebrew.mjs exodus 20:13-15)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'תִּרְצָֽח'
  - where: 'note 4:2 “The commandments, broken one after another”'
    claim: 'The commandments against killing, adultery and stealing'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/20?lang=eng'
    quote: 'Thou shalt not commit adultery.'
  - where: 'note 4:2 “The commandments, broken one after another”'
    claim: '“Swearing” is cursing: to pronounce a curse on'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%204&version=NIV'
    quote: 'That is, to pronounce a curse on'

  # ---------- note 4:3 ----------
  - where: 'note 4:3 “Why the land suffers for the people”'
    claim: 'Leviticus 26 and Deuteronomy 28 set out the tie between the bounty of the land and the people’s righteousness'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'the Lord outlines the relationship between the bounties of the land and the righteousness or wickedness of the people'
  - where: 'note 4:3 “Why the land suffers for the people”'
    claim: 'Leviticus 26:20: the land will not yield its increase'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'for your land shall not yield her increase, neither shall the trees of the land yield their fruits'
  - where: 'note 4:3 “Why the land suffers for the people”'
    claim: 'The verb for the fish (asaph, niphal) means be taken away, removed, perish'
    key: bdb
    url: 'https://biblehub.com/hebrew/622.htm'
    quote: 'be taken away, removed, perish, of men Isaiah 57:1 (twice in verse) ("" אבד); fish Hosea 4:3'
  - where: 'note 4:3 “Why the land suffers for the people”'
    claim: 'A modern translation renders “mourn” as dries up'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%204&version=NIV'
    quote: 'Because of this the land dries up'

  # ---------- note 4:4 ----------
  - where: 'note 4:4 “Who is on trial in verses 4–6”'
    claim: 'The ESV reads the line as an address to the priest'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%204&version=ESV'
    quote: 'for with you is my contention, O priest'
  - where: 'note 4:4 “Who is on trial in verses 4–6”'
    claim: 'The ESV keeps the King James sense in a footnote and cross-refers 4:4 to Deuteronomy 17:12'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%204&version=ESV'
    quote: 'Or for your people are like those who contend with the priest'
  - where: 'note 4:4 “Who is on trial in verses 4–6”'
    claim: 'The ESV cross-refers Hosea 4:4 to Deuteronomy 17:12'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%204&version=ESV'
    quote: 'Hosea 4:4 : [Deut. 17:12]'
  - where: 'note 4:4 “Who is on trial in verses 4–6”'
    claim: 'The NRSVUE reads the same address and marks the Hebrew uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%204&version=NRSVUE'
    quote: 'Meaning of Heb uncertain'
  - where: 'note 4:4 “Who is on trial in verses 4–6”'
    claim: 'The NRSVUE text of 4:4'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%204&version=NRSVUE'
    quote: 'for with you is my contention, O priest'
  - where: 'note 4:4 “Who is on trial in verses 4–6”'
    claim: 'The law made refusal to hearken to the priest or judge a capital offense'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/17?lang=eng'
    quote: 'will not hearken unto the priest that standeth to minister there before the Lord thy God, or unto the judge, even that man shall die'
  - where: 'note 4:4 “Who is on trial in verses 4–6”'
    claim: '“Destroy” (damah) is to cut off, destroy; in 4:5 its object is Israel under the figure of “thy mother”'
    key: bdb
    url: 'https://biblehub.com/hebrew/1820.htm'
    quote: 'cause to cease, cut off, destroy, with accusative Israel (under figure of בתצֿיון) Jeremiah 6:2; (under figure of אִמֶּ֑ךָ) Hosea 4:5'
  - where: 'note 4:4 “Who is on trial in verses 4–6”'
    claim: 'The same verb (H1820) stands in 4:5 “I will destroy” and 4:6 “are destroyed”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'נִדְמ֥וּ'
  - where: 'note 4:4 “Who is on trial in verses 4–6”'
    claim: 'Hosea 2:2 speaks of “your mother”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/2?lang=eng'
    quote: 'Plead with your mother, plead: for she is not my wife'

  # ---------- note 4:6 ----------
  - where: 'note 4:6 “Said to the priests”'
    claim: 'In 4:6 “knowledge” has the article both times (the knowledge), and da’at in the book is at 4:1, 4:6 and 6:6 (hebrew.mjs hosea --word 1847)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'הַ/דָּ֑עַת'
  - where: 'note 4:6 “Said to the priests”'
    claim: 'The verb “reject” (H3988) is used twice in 4:6: thou hast rejected, I will reject'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'מָאַ֗סְתָּ'
  - where: 'note 4:6 “Said to the priests”'
    claim: 'The verb “forget” (H7911) is used twice in 4:6: thou hast forgotten, I will forget'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'אֶשְׁכַּ֥ח'
  - where: 'note 4:6 “Said to the priests”'
    claim: 'Levi was to teach Israel the law'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/33?lang=eng'
    quote: 'They shall teach Jacob thy judgments, and Israel thy law'
  - where: 'note 4:6 “Said to the priests”'
    claim: 'The priest’s lips should keep knowledge'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/2?lang=eng'
    quote: 'For the priest’s lips should keep knowledge, and they should seek the law at his mouth'
  - where: 'note 4:6 “Said to the priests”'
    claim: 'In Hosea the religious and political leaders are often castigated for not instilling knowledge of God in the people'
    key: hord-not-fragile
    url: 'https://rsc.byu.edu/vol-23-no-1-2022/god-not-fragile'
    quote: 'the political and religious leadership are frequently castigated for not instilling in the people a knowledge of God and his laws'
  - where: 'note 4:6 “Said to the priests”'
    claim: 'Keil takes “thou” as the whole nation, which would lose the privilege of being a priestly nation (Ex. 19:6)'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/4.htm'
    quote: 'would deprive it of the privilege of being a priestly nation (Exodus 19:6)'
  - where: 'note 4:6 “Said to the priests”'
    claim: 'Israel was called a kingdom of priests'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/19?lang=eng'
    quote: 'And ye shall be unto me a kingdom of priests, and an holy nation.'

  # ---------- note 4:8 ----------
  - where: 'note 4:8 “Priests who live off sin”'
    claim: 'The word for “sin” in 4:8 is chattat (H2403)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'חַטַּ֥את'
  - where: 'note 4:8 “Priests who live off sin”'
    claim: 'The ESV notes “sin offering” as an alternative'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%204&version=ESV'
    quote: 'Or sin offering'
  - where: 'note 4:8 “Priests who live off sin”'
    claim: 'The priest who offered the sin offering was to eat it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/6?lang=eng'
    quote: 'The priest that offereth it for sin shall eat it'
  - where: 'note 4:8 “Priests who live off sin”'
    claim: 'Keil: the word means both sin and sin offering and is used in a double sense; the priests wished sins increased for the meat'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/4.htm'
    quote: 'they wished the sins of the people to be increased, in order that they might receive a good supply of sacrificial meat to eat'
  - where: 'note 4:8 “Priests who live off sin”'
    claim: 'Keil: the prophet uses chattat in a double sense'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/4.htm'
    quote: 'which signifies both sin and sin-offering, in a double sense'
  - where: 'note 4:8 “Priests who live off sin”'
    claim: 'BDB takes the phrase generally (they gain their daily food by it) and doubts “sin-offering,” which is not found elsewhere in the early prophets'
    key: bdb
    url: 'https://biblehub.com/hebrew/2403.htm'
    quote: 'gain their daily food by means of it'
  - where: 'note 4:8 “Priests who live off sin”'
    claim: 'BDB: sin-offering is not elsewhere in the early prophets'
    key: bdb
    url: 'https://biblehub.com/hebrew/2403.htm'
    quote: 'others sin-offering, but this not elsewhere in early prophets'

  # ---------- note 4:12 ----------
  - where: 'note 4:12 “Asking wood for answers”'
    claim: 'The stocks were wooden idols and the staffs divining rods'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'The stocks were wooden idols. The staffs were divining rods, instruments used to foretell the future, to find lost or hidden objects, and so forth.'
  - where: 'note 4:12 “Asking wood for answers”'
    claim: 'Ets (wood, tree) is used of idols, alone in Hosea 4:12'
    key: bdb
    url: 'https://biblehub.com/hebrew/6086.htm'
    quote: 'so עֵץ alone Hosea 4:12'
  - where: 'note 4:12 “Asking wood for answers”'
    claim: 'Maqqel is a rod or staff used in journeying; in Hosea 4:12 the wand of a diviner'
    key: bdb
    url: 'https://biblehub.com/hebrew/4731.htm'
    quote: 'wand of diviner Hosea 4:12'
  - where: 'note 4:12 “Asking wood for answers”'
    claim: 'Maqqel is an ordinary staff for walking'
    key: bdb
    url: 'https://biblehub.com/hebrew/4731.htm'
    quote: 'staff, used in journeying'
  - where: 'note 4:12 “Asking wood for answers”'
