chapter: 12
claims:
  # ---- when ----
  - where: 'when'
    claim: 'Hosea ministered in the northern kingdom in the latter half of the eighth century B.C.'
    key: scripture-helps-hosea
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/45-hosea-1-6-10-14-joel?lang=eng'
    quote: 'His ministry took place in the Northern Kingdom of Israel during the latter half of the eighth century BC.'

  # ---- setting ----
  - where: 'setting'
    claim: 'When and where Hosea ministered'
    key: scripture-helps-hosea
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/45-hosea-1-6-10-14-joel?lang=eng'
    quote: 'His ministry took place in the Northern Kingdom of Israel during the latter half of the eighth century BC. Hosea prophesied during a time of great wickedness, when Israel was close to being conquered by the Assyrian empire.'
  - where: 'setting'
    claim: 'The Hebrew Bible’s chapter 12 begins at the English 11:12, so its verses are numbered one higher'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/12.htm'
    quote: 'Hosea 12:1-14 (Eng. V. 11:12-12:14)'
  - where: 'setting'
    claim: 'The chapter is addressed to Ephraim, with Judah named in verse 2, and charges a covenant with Assyria and oil sent to Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/12?lang=eng'
    quote: 'they do make a covenant with the Assyrians, and oil is carried into Egypt.'

  # ---- thread ----
  - where: 'thread'
    claim: 'The first word of verse 7 in Hebrew is the name Canaan'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'כְּנַ֗עַן'
  - where: 'thread'
    claim: 'The same Hebrew verb form (yashiv, H7725) stands in verse 2 (“recompense”) and verse 14 (“return”), and the same verb in verse 6 (“turn”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'יָשִׁ֥יב'
  - where: 'thread'
    claim: 'The Lord uses prophets, visions and similitudes: the chapter heading'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/12?lang=eng'
    quote: 'The Lord uses prophets, visions, and similitudes to guide His people'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: '“Desolation” rendered as violence; “covenant” as a treaty'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2012&version=NRSVUE'
    quote: 'they multiply falsehood and violence'
  - where: 'section 1 plain'
    claim: '“Controversy” as a case or charge against Judah'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2012&version=NIV'
    quote: 'he will punish'
  - where: 'section 2 plain'
    claim: '“By his strength” as in his manhood; “had power” as strove; “made supplication” as sought his favor'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2012&version=NRSVUE'
    quote: 'he wept and sought his favor'
  - where: 'section 2 plain'
    claim: '“His memorial” as the name by which He is remembered'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2012&version=ESV'
    quote: 'the Lord is his memorial name'
  - where: 'section 3 plain'
    claim: '“Balances of deceit” as false balances; Ephraim’s boast'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2012&version=NRSVUE'
    quote: 'A trader in whose hands are false balances'
  - where: 'section 3 plain'
    claim: '“Dwell in tabernacles” as living in tents again; “solemn feast” as the appointed festival'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2012&version=NRSVUE'
    quote: 'I will make you live in tents again'
  - where: 'section 3 plain'
    claim: 'The altars will be like heaps of stones'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2012&version=NIV'
    quote: 'Their altars will be like piles of stones'
  - where: 'section 4 plain'
    claim: '“Syria” is Aram; “preserved” is kept or guarded'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2012&version=NRSVUE'
    quote: 'Jacob fled to the land of Aram'
  - where: 'section 4 plain'
    claim: '“Leave his blood upon him” as leaving his bloodguilt on him'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2012&version=NIV'
    quote: 'his Lord will leave on him the guilt of his bloodshed'

  # ---- note 12:1 ----
  - where: 'note 12:1 “Feeding on wind, chasing the east wind”'
    claim: 'The Hebrew participle is the verb for pasturing or tending a flock'
    key: bdb
    url: 'https://biblehub.com/hebrew/7462.htm'
    quote: 'pasture, tend (pascere), literal'
  - where: 'note 12:1 “Feeding on wind, chasing the east wind”'
    claim: 'The lexicon keeps “feedeth on wind” and sets it beside Isaiah 44:20 (it cites the verse by its Hebrew number, 12:2)'
    key: bdb
    url: 'https://biblehub.com/hebrew/7462.htm'
    quote: 'figurative of idolater, Isaiah 44:20 he feedeth on ashes'
  - where: 'note 12:1 “Feeding on wind, chasing the east wind”'
    claim: 'One modern translation has Ephraim herding the wind'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2012&version=NRSVUE'
    quote: 'Ephraim herds the wind'
  - where: 'note 12:1 “Feeding on wind, chasing the east wind”'
    claim: 'Feeding on wind is believing what has no substance'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'is believing that which has not truth or substance'
  - where: 'note 12:1 “Feeding on wind, chasing the east wind”'
    claim: 'The east wind is the violent, scorching wind from the desert'
    key: bdb
    url: 'https://biblehub.com/hebrew/6921.htm'
    quote: 'often as violent and scorching, from desert on southeast'
  - where: 'note 12:1 “Feeding on wind, chasing the east wind”'
    claim: 'Oil carried to Egypt is tribute for an alliance'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'Carrying oil into Egypt (see v. 1) represents the attempt to get protection through tribute from an alliance with Egypt.'
  - where: 'explore'
    claim: 'An older commentary places the oil carried to Egypt in the reign of King Hoshea'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/12.htm'
    quote: 'This actually took place during the reign of Hoshea, who endeavoured to liberate himself from the oppression of Assyria by means of a treaty with Egypt (2 Kings 17:4).'
  - where: 'explore'
    claim: 'Hoshea paid Assyria and then sent messengers to Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/17?lang=eng'
    quote: 'he had sent messengers to So king of Egypt, and brought no present to the king of Assyria, as he had done year by year'

  # ---- note 12:3 ----
  - where: 'note 12:3 “The verbs behind Jacob’s two names”'
    claim: '“Took by the heel” is the verb aqab (H6117)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'עָקַ֣ב'
  - where: 'note 12:3 “The verbs behind Jacob’s two names”'
    claim: '“Had power” is the verb sarah (H8280)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'שָׂרָ֥ה'
  - where: 'note 12:3 “The verbs behind Jacob’s two names”'
    claim: 'aqab is formed from the word for heel; the lexicon’s rendering of Hosea’s line, and the sense “overreach” in Genesis 27:36 (the lexicon cites the verse by its Hebrew number, 12:4)'
    key: bdb
    url: 'https://biblehub.com/hebrew/6117.htm'
    quote: 'he attacked his brother at the heel'
  - where: 'note 12:3 “The verbs behind Jacob’s two names”'
    claim: 'The same verb means to overreach in Genesis 27:36'
    key: bdb
    url: 'https://biblehub.com/hebrew/6117.htm'
    quote: 'and he hath overreached me now twice'
  - where: 'note 12:3 “The verbs behind Jacob’s two names”'
    claim: 'sarah means to persist or persevere'
    key: bdb
    url: 'https://biblehub.com/hebrew/8280.htm'
    quote: 'persist, exert oneself, persevere'
  - where: 'note 12:3 “The verbs behind Jacob’s two names”'
    claim: 'The lexicon’s rendering of Hosea’s line, and the same verb in Genesis 32:28 (Hebrew 32:29)'
    key: bdb
    url: 'https://biblehub.com/hebrew/8280.htm'
    quote: 'he persevered with God'
  - where: 'note 12:3 “The verbs behind Jacob’s two names”'
    claim: 'In Hosea’s version of the story, the sense “struggle” fits the verb'
    key: bowen-wrestled-man
    url: 'https://journal.interpreterfoundation.org/and-there-wrestled-a-man-with-him-genesis-3224-enoss-adaptations-of-the-onomastic-wordplay-of-genesis'
    quote: 'Compare Hosea 12:3-4 version of this story, where the sense of the verb as “struggle” better fits the narrative context as well.'
  - where: 'note 12:3 “The verbs behind Jacob’s two names”'
    claim: '“By his strength” is manly vigour'
    key: bdb
    url: 'https://biblehub.com/hebrew/202.htm'
    quote: 'manly vigour'
  - where: 'note 12:3 “The verbs behind Jacob’s two names”'
    claim: 'One modern translation reads the line as an attempt to supplant'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2012&version=NRSVUE'
    quote: 'In the womb he tried to supplant his brother'
  - where: 'note 12:3 “The verbs behind Jacob’s two names”'
    claim: 'That translation heads the passage as a history of rebellion'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2012&version=NRSVUE'
    quote: 'The Long History of Rebellion'
  - where: 'note 12:3 “The verbs behind Jacob’s two names”'
    claim: 'The other reading: Jacob’s conduct is set before Israel for imitation, as a reaching for the birthright and blessing'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/12.htm'
    quote: 'is not held up before the people for a warning'
  - where: 'note 12:3 “The verbs behind Jacob’s two names”'
    claim: 'The other reading, continued'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/12.htm'
    quote: 'is set before them for their imitation, as an eager attempt to secure the birthright and the blessing connected with it'
  - where: 'note 12:3 “The verbs behind Jacob’s two names”'
    claim: 'Jacob named for the heel at his birth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/12?lang=eng'
    quote: 'He took his brother by the heel in the womb, and by his strength he had power with God'

  # ---- note 12:4 wrestle ----
  - where: 'note 12:4 “The wrestle at Peniel, with weeping added”'
    claim: 'Hosea’s line adds weeping and supplication to the wrestle, and names the angel and then the LORD God of hosts'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/12?lang=eng'
    quote: 'Yea, he had power over the angel, and prevailed: he wept, and made supplication unto him'
  - where: 'note 12:4 “The wrestle at Peniel, with weeping added”'
    claim: 'A modern rendering of the weeping and asking'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2012&version=NRSVUE'
    quote: 'he wept and sought his favor'
  - where: 'note 12:4 “The wrestle at Peniel, with weeping added”'
    claim: 'The lexicon lists this verse (Hebrew 12:5) and Genesis 48:16 under the theophanic angel'
    key: bdb
    url: 'https://biblehub.com/hebrew/4397.htm'
    quote: 'the theophanic angel'

  # ---- note 12:4 Bethel ----
  - where: 'note 12:4 “Bethel, and who was spoken to there”'
    claim: 'The footnote on “Beth-el” points to the first meeting (Genesis 28); the footnote on “us” offers “him”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/12?lang=eng'
    quote: 'OR him.'
  - where: 'note 12:4 “Bethel, and who was spoken to there”'
    claim: 'At the second meeting God repeated the name Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/35?lang=eng'
    quote: 'thy name shall not be called any more Jacob, but Israel shall be thy name'
  - where: 'note 12:4 “Bethel, and who was spoken to there”'
    claim: 'One commentary takes Hosea to mean the second meeting at Bethel (Genesis 35)'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/12.htm'
    quote: 'This does not refer to the appearance of God to Jacob on his flight to Mesopotamia (Genesis 28:11), but to that recorded in Genesis 35:9., when God confirmed his name of Israel, and renewed the promises of His blessing.'
  - where: 'note 12:4 “Bethel, and who was spoken to there”'
    claim: 'The Hebrew has “with us” (first person plural suffix)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'עִמָּֽ/נוּ'
  - where: 'note 12:4 “Bethel, and who was spoken to there”'
    claim: 'One translation prints “him”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2012&version=NRSVUE'
    quote: 'and there he spoke with him'
  - where: 'note 12:4 “Bethel, and who was spoken to there”'
    claim: 'That translation notes that the Hebrew reads “us”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2012&version=NRSVUE'
    quote: 'Gk Syr: Heb us'
  - where: 'note 12:4 “Bethel, and who was spoken to there”'
    claim: 'Another translation keeps “us”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2012&version=ESV'
    quote: 'and there God spoke with us'
  - where: 'note 12:4 “Bethel, and who was spoken to there”'
    claim: 'With “us,” what God said to Jacob at Bethel applies to his descendants'
    key: keil-hosea
    url: 'https://biblehub.com/commentaries/kad/hosea/12.htm'
    quote: '"there did He speak to us through Jacob," i.e., what He there said to Jacob applies to us.'

  # ---- note 12:5 ----
  - where: 'note 12:5 “The name by which He is remembered”'
    claim: 'The Hebrew word is zeker, remembrance or memorial, the word of Exodus 3:15 (the lexicon cites the verse by its Hebrew number, 12:6)'
    key: bdb
    url: 'https://biblehub.com/hebrew/2143.htm'
    quote: 'remembrance, memorial'
  - where: 'note 12:5 “The name by which He is remembered”'
    claim: 'The word in the Hebrew text of the verse'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'זִכְרֽ/וֹ'
  - where: 'note 12:5 “The name by which He is remembered”'
    claim: 'One modern rendering'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2012&version=NRSVUE'
    quote: 'the Lord is his name'
  - where: 'note 12:5 “The name by which He is remembered”'
    claim: 'Another modern rendering'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2012&version=ESV'
    quote: 'the Lord is his memorial name'
  - where: 'note 12:5 “The name by which He is remembered”'
    claim: 'The footnote on “memorial” gives Exodus 3:15; the name recurs in verses 9 and 13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/12?lang=eng'
    quote: 'And I that am the Lord thy God from the land of Egypt'

  # ---- note 12:6 ----
  - where: 'note 12:6 “Turn, keep, and wait”'
    claim: 'The verse begins with the pronoun “you”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'וְ/אַתָּ֖ה'
  - where: 'note 12:6 “Turn, keep, and wait”'
    claim: 'The preposition before “thy God” is b (in, by)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'בֵּ/אלֹהֶ֣י/ךָ'
  - where: 'note 12:6 “Turn, keep, and wait”'
    claim: '“Turn” is the verb shuv (H7725), which also opens Hosea 14:1; “mercy” is hesed (H2617); “keep” is shamar (H8104)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'חֶ֤סֶד'
  - where: 'note 12:6 “Turn, keep, and wait”'
    claim: 'A modern rendering brings out the emphatic “you”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2012&version=NRSVUE'
    quote: 'But as for you, return to your God'
  - where: 'note 12:6 “Turn, keep, and wait”'
    claim: 'One translation takes the preposition as the means of returning'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2012&version=ESV'
    quote: 'by the help of your God, return'
  - where: 'note 12:6 “Turn, keep, and wait”'
    claim: 'To keep mercy and judgment is to follow the dictates of kindness and justice (the lexicon cites the verse by its Hebrew number, 12:7)'
    key: bdb
    url: 'https://biblehub.com/hebrew/8104.htm'
    quote: 'observe = follow dictates of (prudence, justice, kindness, wisdom) Hosea 12:7'
  - where: 'note 12:6 “Turn, keep, and wait”'
    claim: 'The chapter heading: the people become rich and will not wait on the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/12?lang=eng'
    quote: 'but they become rich and will not wait on the Lord'

  # ---- note 12:7 ----
  - where: 'note 12:7 “The merchant’s name is Canaan”'
    claim: 'The verse begins with the word Canaan (H3667)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'כְּנַ֗עַן'
  - where: 'note 12:7 “The merchant’s name is Canaan”'
    claim: 'The word came to mean a merchant because Canaanites were traders'
    key: bdb
    url: 'https://biblehub.com/hebrew/3667.htm'
    quote: 'merchant (s) (because Canaanites, especially Phoenicians, were traders)'
  - where: 'note 12:7 “The merchant’s name is Canaan”'
    claim: 'The lexicon lists this verse (Hebrew 12:8) under the proper name, personified as apostate Israel; Canaan as the land Israel came into'
    key: bdb
    url: 'https://biblehub.com/hebrew/3667.htm'
    quote: 'is personified Hosea 12:8 = apostate Israel'
  - where: 'note 12:7 “The merchant’s name is Canaan”'
    claim: 'Canaan is the land into which the Hebrews came, subduing its inhabitants'
    key: bdb
    url: 'https://biblehub.com/hebrew/3667.htm'
    quote: 'land, west of Jordan, into which Hebrews came, and where they settled, subduing the inhabitants'
  - where: 'note 12:7 “The merchant’s name is Canaan”'
    claim: 'The Septuagint keeps the name'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/hosea/12.htm'
    quote: 'As for Chanaan, in his hand is a balance of unrighteousness'
  - where: 'note 12:7 “The merchant’s name is Canaan”'
    claim: '“To oppress” rendered as to defraud'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2012&version=NIV'
    quote: 'and loves to defraud'
  - where: 'note 12:7 “The merchant’s name is Canaan”'
    claim: 'The verse’s charge of false balances; the footnote gives Micah 6:11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/12?lang=eng'
    quote: 'He is a merchant, the balances of deceit are in his hand: he loveth to oppress.'

  # ---- note 12:8 ----
  - where: 'note 12:8 “What Ephraim found”'
    claim: '“Substance” is the noun on (H202), the word for “strength” in verse 3'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'א֖וֹן'
  - where: 'note 12:8 “What Ephraim found”'
    claim: '“Found” is the verb matsa (H4672), as in verse 4'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'מָצָ֥אתִי'
  - where: 'note 12:8 “What Ephraim found”'
    claim: 'The lexicon gives the noun as manly vigour in verse 3 (Hebrew 12:4)'
    key: bdb
    url: 'https://biblehub.com/hebrew/202.htm'
    quote: 'manly vigour'
  - where: 'note 12:8 “What Ephraim found”'
    claim: 'The lexicon gives the noun as wealth in verse 8 (Hebrew 12:9)'
    key: bdb
    url: 'https://biblehub.com/hebrew/202.htm'
    quote: 'wealth Job 20:10; Hosea 12:9'
  - where: 'note 12:8 “What Ephraim found”'
    claim: 'A modern rendering of the second half of the boast'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2012&version=NRSVUE'
    quote: 'no offense has been found in me'
  - where: 'note 12:8 “What Ephraim found”'
    claim: 'The Septuagint reads the second half as a verdict'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/hosea/12.htm'
    quote: 'None of his labours shall be found available to him, by reason of the sins which he has committed.'

  # ---- note 12:9 ----
  - where: 'note 12:9 “Back to the tents”'
    claim: 'The footnote on “tabernacles” offers tents and points to Leviticus 23:34'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/12?lang=eng'
    quote: 'OR tents.'
  - where: 'note 12:9 “Back to the tents”'
    claim: '“Solemn feast” is mo‘ed, an appointed sacred season (the lexicon cites the verse by its Hebrew number, 12:10)'
    key: bdb
    url: 'https://biblehub.com/hebrew/4150.htm'
    quote: 'sacred season'
  - where: 'note 12:9 “Back to the tents”'
    claim: 'Dwelling in booths was the characteristic rite of the Feast of Tabernacles'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'The characteristic rite of the Feast of Tabernacles was the dwelling in booths made of the boughs of trees.'
  - where: 'note 12:9 “Back to the tents”'
    claim: 'A modern rendering: tents again'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Hosea%2012&version=NRSVUE'
    quote: 'I will make you live in tents again'
  - where: 'note 12:9 “Back to the tents”'
    claim: 'The feast in view is Tabernacles, and the threat is a repeated wilderness'
    key: keil-hosea
