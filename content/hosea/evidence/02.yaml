chapter: 2
claims:
  # ---- when, setting, thread ----
  - where: 'when'
    claim: 'Hosea’s ministry is placed in the third quarter of the eighth century B.C.'
    key: jackson-hosea-marriage
    url: 'https://rsc.byu.edu/isaiah-prophets/marriage-hosea-jehovahs-covenant-israel'
    quote: 'The ministry of the prophet Hosea is generally placed in the turbulent third quarter of the eighth century B.C.'
  - where: 'when'
    claim: 'Hosea lived in the northern kingdom’s time of decline'
    key: bd-hosea
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hosea?lang=eng'
    quote: 'He lived during a time of national decline and ruin, the result of the sin of Israel.'
  - where: 'setting'
    claim: 'The meanings of the second and third children’s names'
    key: scripture-helps-hosea
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/45-hosea-1-6-10-14-joel?lang=eng'
    quote: 'The second child was named Lo-Ruhamah, meaning “not pitied” or “not having obtained mercy,”'
  - where: 'setting'
    claim: 'Lo-ammi means “not my people”'
    key: scripture-helps-hosea
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/45-hosea-1-6-10-14-joel?lang=eng'
    quote: 'The third was named Lo-Ammi, meaning “not my people,”'
  - where: 'setting'
    claim: 'The three children and their names are given in Hosea 1:4–9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/1?lang=eng'
    quote: 'Call his name Lo-ammi: for ye are not my people, and I will not be your God.'
  - where: 'setting'
    claim: 'The mother is the nation and the children are its people'
    key: schade-hosea-family
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/imagery-hoseas-family-restoration-israel'
    quote: 'Thus the “mother” is the nation; her children are the people of Israel.'
  - where: 'setting'
    claim: 'In the Hebrew text chapter 1 ends with verse 9'
    key: schade-hosea-family
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/imagery-hoseas-family-restoration-israel'
    quote: 'In the Hebrew text, chapter 1 ends with verse 9.'
  - where: 'setting'
    claim: 'King James 2:1 is 2:3 in the Hebrew numbering, two verses ahead'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%202&version=ESV'
    quote: 'Hosea 2:1 Ch 2:3 in Hebrew'
  - where: 'setting'
    claim: 'Hosea’s ministry began under Jeroboam II, in a time of prosperity'
    key: jackson-hosea-marriage
    url: 'https://rsc.byu.edu/isaiah-prophets/marriage-hosea-jehovahs-covenant-israel'
    quote: 'His ministry began during the reign of Jeroboam II, when both kingdoms were prosperous and wealthy.'
  - where: 'setting'
    claim: 'The Church’s chapter heading places the reconciliation in the last days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/2?lang=eng'
    quote: 'In the last days, Israel will be reconciled to God and become His people.'
  - where: 'thread'
    claim: 'The same Hebrew word, lakhen (H3651, “therefore”), opens 2:6, 2:9 and 2:14 (scripts/hebrew.mjs hosea --word 3651)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'לָ/כֵ֗ן'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: '“Out of her sight” is literally “from her face”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%202&version=ESV'
    quote: 'from her face'
  - where: 'section 1 plain'
    claim: 'Ammi and Ruhamah mean “my people” and “she has received mercy”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%202&version=ESV'
    quote: 'Hosea 2:1 Hebrew ruhama, which means she has received mercy'
  - where: 'section 2 plain'
    claim: '“Corn” is grain; “prepared for Baal” is rendered “used for Baal”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%202&version=ESV'
    quote: 'which they used for Baal'
  - where: 'section 2 plain'
    claim: '“Discover her lewdness” is “uncover”; “rewards” is “wages”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%202&version=ESV'
    quote: 'I will uncover her lewdness'
  - where: 'section 3 plain'
    claim: '“Speak comfortably” is rendered “speak tenderly”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%202&version=ESV'
    quote: 'speak tenderly to her'
  - where: 'section 3 plain'
    claim: 'Ishi is “my husband” and Baali “my master”'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'Ishi (Hebrew for “my husband”) and Baali (Hebrew for “my master”)'
  - where: 'section 4 plain'
    claim: '“Hear” in verses 21–22 is rendered “answer”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%202&version=ESV'
    quote: 'and the earth shall answer the grain, the wine, and the oil'

  # ---- note 2:2 ----
  - where: 'note 2:2 “A charge to bring, not an appeal”'
    claim: '“Plead” is the Qal imperative masculine plural of rib (H7378), twice in the verse'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'רִ֤יבוּ'
  - where: 'note 2:2 “A charge to bring, not an appeal”'
    claim: 'rib is to strive with words; BDB lists this verse (Hebrew 2:4) under that sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/7378.htm'
    quote: 'so (in figurative) Hosea 2:4'
  - where: 'note 2:2 “A charge to bring, not an appeal”'
    claim: 'The noun in “the LORD hath a controversy” (4:1) is rib (H7379), of the same root'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'רִ֤יב'
  - where: 'note 2:2 “A charge to bring, not an appeal”'
    claim: '“Controversy” in 4:1 is from the root of “plead” in 2:2, and “plead” is an inadequate translation'
    key: jackson-hosea-marriage
    url: 'https://rsc.byu.edu/isaiah-prophets/marriage-hosea-jehovahs-covenant-israel'
    quote: '“Controversy” here is from the same root as the word inadequately translated “plead” in Hosea 2:2.'
  - where: 'note 2:2 “A charge to bring, not an appeal”'
    claim: 'The verb describes accusation, not appeal (a study the article quotes)'
    key: jackson-hosea-marriage
    url: 'https://rsc.byu.edu/isaiah-prophets/marriage-hosea-jehovahs-covenant-israel'
    quote: 'The verb rib never describes an appeal or call to repentance, but always a hostile confrontation, an accusation.'
  - where: 'note 2:2 “A charge to bring, not an appeal”'
    claim: 'The plural command “say ye” (verse 1) addresses all Israel; mother is the nation, children the people'
    key: schade-hosea-family
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/imagery-hoseas-family-restoration-israel'
    quote: 'The plural command “say ye” speaks to all Israel and all readers in a powerful manner. Thus the “mother” is the nation; her children are the people of Israel.'
  - where: 'note 2:2 “A charge to bring, not an appeal”'
    claim: 'One reading: the verse announces a divorce'
    key: jackson-hosea-marriage
    url: 'https://rsc.byu.edu/isaiah-prophets/marriage-hosea-jehovahs-covenant-israel'
    quote: 'This is essentially an announcement of divorce; Jehovah has divorced Israel.'
  - where: 'note 2:2 “A charge to bring, not an appeal”'
    claim: 'Another: a temporary divorce'
    key: muhlestein-everlasting-covenant
    url: 'https://rsc.byu.edu/vol-21-no-2-2020/recognizing-everlasting-covenant-scriptures'
    quote: 'It was followed by Hosea’s temporary divorce of his wife'
  - where: 'note 2:2 “A charge to bring, not an appeal”'
    claim: 'A third: not a divorce but an effort to reclaim'
    key: schade-hosea-family
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/imagery-hoseas-family-restoration-israel'
    quote: 'the Lord is not trying to divorce Israel, he is trying to reclaim her.'
  - where: 'note 2:2 “A charge to bring, not an appeal”'
    claim: 'The article prints a study’s finding that the words are not a known divorce formula'
    key: schade-hosea-family
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/imagery-hoseas-family-restoration-israel'
    quote: 'are not attested anywhere else in the Hebrew Bible as a formula of divorce'
  - where: 'note 2:2 “A charge to bring, not an appeal”'
    claim: 'The repudiation of the people in 1:9 is like the repudiation of a wife'
    key: muhlestein-everlasting-covenant
    url: 'https://rsc.byu.edu/vol-21-no-2-2020/recognizing-everlasting-covenant-scriptures'
    quote: 'His temporary repudiation of Israel as no longer being his people is like a repudiation of a faithless wife.'
  - where: 'note 2:2 “A charge to bring, not an appeal”'
    claim: 'Hosea 4:1 has “controversy”; 1:9 has the parallel sentence'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/1?lang=eng'
    quote: 'for ye are not my people, and I will not be your God.'
  - where: 'note 2:2 “A charge to bring, not an appeal”'
    claim: 'The Lord taught through Hosea that He would not divorce Israel if they would turn back'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'He would still not divorce them (cast them off) if they would but turn back'

  # ---- note 2:3 ----
  - where: 'note 2:3 “The stripping of the wife”'
    claim: 'The wife of 2:3–13 is the land of Israel losing its fertility'
    key: schade-hosea-family
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/imagery-hoseas-family-restoration-israel'
    quote: 'Hosea 2:3–13 contains an image in which the prosperous and productive land of Israel sins and is punished, drying up and losing its fertility.'
  - where: 'note 2:3 “The stripping of the wife”'
    claim: 'Verse 11 is the loss of worship'
    key: schade-hosea-family
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/imagery-hoseas-family-restoration-israel'
    quote: 'We read of the loss of opportunity to participate in sacred acts of worship (v. 11)'
  - where: 'note 2:3 “The stripping of the wife”'
    claim: '“The day that she was born” read of Israel’s birth at the Exodus'
    key: schade-hosea-family
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/imagery-hoseas-family-restoration-israel'
    quote: 'The symbolism in 2:3 takes us back to the birth of Israel during the Exodus'
  - where: 'note 2:3 “The stripping of the wife”'
    claim: 'At the Exodus Israel had nothing'
    key: schade-hosea-family
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/imagery-hoseas-family-restoration-israel'
    quote: 'It was a time when Israel had nothing and needed to rely on the Lord or perish.'
  - where: 'note 2:3 “The stripping of the wife”'
    claim: 'Assyria’s destruction of the kingdom began the fulfilment'
    key: schade-hosea-family
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/imagery-hoseas-family-restoration-israel'
    quote: 'In 722 BC the Assyrians would destroy the kingdom of Israel and begin to fulfill this prophecy.'
  - where: 'note 2:3 “The stripping of the wife”'
    claim: 'The wilderness of verse 3 read as the captivity'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'Verse 3 | wilderness | The captivity'
  - where: 'note 2:3 “The stripping of the wife”'
    claim: 'The treatment of the wife is distressing to readers'
    key: hord-not-fragile
    url: 'https://rsc.byu.edu/vol-23-no-1-2022/god-not-fragile'
    quote: 'the treatment of the cheating wife in the parable is distressing'
  - where: 'note 2:3 “The stripping of the wife”'
    claim: 'The imagery is symbolic'
    key: hord-not-fragile
    url: 'https://rsc.byu.edu/vol-23-no-1-2022/god-not-fragile'
    quote: 'Religious educators may assist students in evaluating these images by reminding students that the imagery is symbolic.'
  - where: 'note 2:3 “The stripping of the wife”'
    claim: 'The shame answers the offence (a study the article quotes in its note 20)'
    key: hord-not-fragile
    url: 'https://rsc.byu.edu/vol-23-no-1-2022/god-not-fragile'
    quote: 'Just as Israel had exposed her nakedness to others, God would strip her naked, making her an object of shame.'
  - where: 'note 2:3 “The stripping of the wife”'
    claim: 'The threats and the Lord’s grief are to be read together'
    key: hord-not-fragile
    url: 'https://rsc.byu.edu/vol-23-no-1-2022/god-not-fragile'
    quote: 'They must be set side by side and evaluated together.'
  - where: 'note 2:3 “The stripping of the wife”'
    claim: 'Ezekiel 16:4 tells Jerusalem’s birth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/2?lang=eng'
    quote: 'my wool and my flax given to cover her nakedness'

  # ---- note 2:5 ----
  - where: 'note 2:5 “Who the lovers are”'
    claim: 'What Baal was'
    key: bd-baal
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/baal?lang=eng'
    quote: 'The Sun-god and the male or generative principle in nature.'
  - where: 'note 2:5 “Who the lovers are”'
    claim: 'Baal was worshipped in many local forms, hence the plural Baalim'
    key: bd-baal
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/baal?lang=eng'
    quote: 'He was worshipped with different ideas and rites (compare the plural Baalim) in different places'
  - where: 'note 2:5 “Who the lovers are”'
    claim: 'Canaanite worship was meant to secure the land’s productivity'
    key: jackson-hosea-marriage
    url: 'https://rsc.byu.edu/isaiah-prophets/marriage-hosea-jehovahs-covenant-israel'
    quote: 'In Canaanite religion, the productivity of land and cattle is assured through worship of the deified forces of nature.'
  - where: 'note 2:5 “Who the lovers are”'
    claim: 'The Canaanites’ fertile flocks and fields drew Israel’s farmers'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'the fertility of their flocks and fields (apparently elicited from the gods and goddesses of fertility) attracted the Israelite farmers'
  - where: 'note 2:5 “Who the lovers are”'
    claim: '“Rewards” in verse 12 is rendered “wages”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%202&version=ESV'
    quote: 'my wages'
  - where: 'note 2:5 “Who the lovers are”'
    claim: 'Israel is pictured as a woman who is paid'
    key: jackson-hosea-marriage
    url: 'https://rsc.byu.edu/isaiah-prophets/marriage-hosea-jehovahs-covenant-israel'
    quote: 'Hosea characterized Israel not only as an adulteress but as a prostitute, since she accepted bread, water, wool, flax, oil, drink'
  - where: 'note 2:5 “Who the lovers are”'
    claim: 'The good things came only from the Lord'
    key: jackson-hosea-marriage
    url: 'https://rsc.byu.edu/isaiah-prophets/marriage-hosea-jehovahs-covenant-israel'
    quote: 'blessings that come only from the true husband, Jehovah'
  - where: 'note 2:5 “Who the lovers are”'
    claim: 'The lovers read as priests, priestesses and idols'
    key: ot-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng'
    quote: 'The priests, priestesses, and idols of the Canaanite temples'
  - where: 'note 2:5 “Who the lovers are”'
    claim: 'The lovers read as political alliances too'
    key: schade-hosea-family
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/imagery-hoseas-family-restoration-israel'
    quote: 'refers not only to idolatry but also to political alliances not sanctioned by the Lord'
  - where: 'note 2:5 “Who the lovers are”'
    claim: 'Hosea 8:9 uses “lovers” of Assyria; 2:13 and 2:17 name the Baalim'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/8?lang=eng'
    quote: 'For they are gone up to Assyria, a wild ass alone by himself: Ephraim hath hired lovers.'

  # ---- note 2:8 ----
  - where: 'note 2:8 “Gifts the covenant had promised”'
    claim: 'Deuteronomy 7:13 names corn, wine and oil as the Lord’s blessing'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/7?lang=eng'
    quote: 'he will also bless the fruit of thy womb, and the fruit of thy land, thy corn, and thy wine, and thine oil'
  - where: 'note 2:8 “Gifts the covenant had promised”'
    claim: 'Deuteronomy 11:14 and 11:17: rain for corn, wine and oil; heaven shut if they serve other gods'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/11?lang=eng'
    quote: 'he shut up the heaven, that there be no rain, and that the land yield not her fruit'
  - where: 'note 2:8 “Gifts the covenant had promised”'
    claim: 'Hosea 2:8 has dagan, tirosh, yitshar (H1715, H8492, H3323) in that order'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'וְ/הַ/תִּיר֣וֹשׁ'
  - where: 'note 2:8 “Gifts the covenant had promised”'
    claim: 'Deuteronomy 7:13 and 11:14 have the same three words (H1715, H8492, H3323) in the same order'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'וְ/תִֽירֹשְׁ/ךָ֖'
  - where: 'note 2:8 “Gifts the covenant had promised”'
    claim: '“Prepared for Baal” rendered “used for Baal”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%202&version=ESV'
    quote: 'which they used for Baal'
  - where: 'note 2:8 “Gifts the covenant had promised”'
    claim: 'Hosea 8:4: silver and gold made into idols'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/8?lang=eng'
    quote: 'of their silver and their gold have they made them idols'
  - where: 'note 2:8 “Gifts the covenant had promised”'
    claim: 'The verse heard as a lament (a study the article quotes)'
    key: hord-not-fragile
    url: 'https://rsc.byu.edu/vol-23-no-1-2022/god-not-fragile'
    quote: 'Hear the heartache of Israel’s God!'
  - where: 'note 2:8 “Gifts the covenant had promised”'
    claim: '“Know” (yada, H3045) is the verb of 2:8 and of 2:20'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'יָֽדְעָ֔ה'

  # ---- note 2:14 ----
  - where: 'note 2:14 “Courtship in the wilderness”'
    claim: 'Students told the story expected a divorce'
    key: hord-not-fragile
    url: 'https://rsc.byu.edu/vol-23-no-1-2022/god-not-fragile'
    quote: 'They expected the husband to divorce his wife and be done.'
  - where: 'note 2:14 “Courtship in the wilderness”'
    claim: '“Allure” is a Piel participle of pathah (H6601)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'מְפַתֶּ֔י/הָ'
  - where: 'note 2:14 “Courtship in the wilderness”'
    claim: 'BDB glosses the Piel here (Hebrew 2:16) as “persuade,” of a woman'
    key: bdb
    url: 'https://biblehub.com/hebrew/6601.htm'
    quote: 'persuade, woman Hosea 2:16'
  - where: 'note 2:14 “Courtship in the wilderness”'
    claim: '“Comfortably unto her” is “upon her heart”: al (H5921) and leb (H3820) with a feminine suffix'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'לִבָּֽ/הּ'
  - where: 'note 2:14 “Courtship in the wilderness”'
    claim: 'leb is “heart”'
    key: bdb
    url: 'https://biblehub.com/hebrew/3820.htm'
    quote: 'my heart and my flesh cry out'
  - where: 'note 2:14 “Courtship in the wilderness”'
    claim: 'A modern translation: “speak tenderly to her”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Hosea%202&version=ESV'
    quote: 'speak tenderly to her'
  - where: 'note 2:14 “Courtship in the wilderness”'
    claim: 'Judges 19:3 has the same words: dabber (H1696) al (H5921) libbah (H3820)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'לִבָּ/הּ֙'
  - where: 'note 2:14 “Courtship in the wilderness”'
    claim: 'Judges 19:3: a husband goes after his wife to speak friendly to her'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/19?lang=eng'
    quote: 'And her husband arose, and went after her, to speak friendly unto her, and to bring her again'
  - where: 'note 2:14 “Courtship in the wilderness”'
    claim: 'Isaiah 40:2 has the same idiom: dabberu (H1696) al (H5921) leb (H3820)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'לֵ֤ב'
  - where: 'note 2:14 “Courtship in the wilderness”'
    claim: 'The wilderness is where the covenant marriage was made'
    key: jackson-hosea-marriage
    url: 'https://rsc.byu.edu/isaiah-prophets/marriage-hosea-jehovahs-covenant-israel'
    quote: 'The wilderness refers to the Sinai desert, where God established the covenant with the Israelites. The marriage was performed there and the honeymoon took place there.'
  - where: 'note 2:14 “Courtship in the wilderness”'
    claim: 'The passage draws on the Exodus'
    key: schade-hosea-family
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/imagery-hoseas-family-restoration-israel'
    quote: 'Just as in the days of the Exodus, Israel will be led to safety and back into the covenant with the Lord'
  - where: 'note 2:14 “Courtship in the wilderness”'
    claim: 'The wilderness as the place where the Lord reminds Israel of His love'
    key: hord-not-fragile
    url: 'https://rsc.byu.edu/vol-23-no-1-2022/god-not-fragile'
