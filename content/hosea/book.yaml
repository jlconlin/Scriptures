description: A phrase-by-phrase companion to the book of Hosea, grounded in the restored gospel of Jesus Christ.
divisionsBlurb: The book opens with a household, a wife who leaves and children with hard names, and then turns to the nation that household stands for. Warning and promise alternate to the end, and the last word is a promise.
home:
  blurb: A prophet of the northern kingdom in its last years, whose marriage became a picture of the Lord’s love for a people who had left Him.

intro: |
  Hosea prophesied in the northern kingdom of Israel in the eighth century B.C., from the last years of Jeroboam the son of Joash into the decades when that kingdom came apart and was taken by Assyria. He is the only prophet of the northern kingdom whose written prophecies have come down to us. The kingdom he speaks to he most often calls Ephraim, after its leading tribe.

  The book begins with the Lord’s command that Hosea take “a wife of whoredoms” ([[Hosea 1:2]]), and with three children whose names are sentences passed on Israel. From that household the book reads the whole history of the covenant as a marriage: a bride who went after other lovers, and a husband who will not give her up. Chapters 4–14 carry the same charge and the same promise to the nation, in a rush of images from the farm, the oven, the hunt, and the nursery. This companion goes through all fourteen chapters and tries to anticipate the questions a careful reader asks: *Did Hosea really marry such a woman? Who is Ephraim? What does that image mean? Where is Christ in this?*

# Scripture Helps divides the book in two (1–3, Hosea’s marriage and children; 4–14, warnings and promises to Israel).
# The split of 4–14 at chapter 11 is the site’s own: at 11:1 the picture changes from a wife to a child the Lord raised.
# Keys must not repeat another book’s (the colors are global variables).
divisions:
  - key: gomer
    range: [1, 3]
    name: The Prophet’s Household
    blurb: Hosea is told to take a wife of whoredoms, and her three children are named for what is coming on Israel. The Lord pleads with His unfaithful bride, promises to betroth her to Him for ever, and sends Hosea to love and buy back a woman who has left him.
    color: '#a04a5c'
    darkColor: '#e39aab'
  - key: controversy
    range: [4, 10]
    name: The Lord’s Controversy with Israel
    blurb: There is no truth, mercy, or knowledge of God in the land. Priests, princes, and people are charged with idols, with kings set up and cut down, and with running to Egypt and Assyria for help. They have sown the wind and will reap the whirlwind.
    color: '#8a6a2a'
    darkColor: '#dcbc74'
  - key: freely
    range: [11, 14]
    name: “I Will Love Them Freely”
    blurb: The Lord remembers Israel as a child He called out of Egypt and taught to walk, and cannot give him up. He recalls Jacob, promises to ransom His people from the grave, and calls them to return with words of repentance.
    color: '#3f7f6a'
    darkColor: '#8fd0b9'

