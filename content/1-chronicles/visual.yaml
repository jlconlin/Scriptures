summary: >-
  First Chronicles retells the history from Adam to David for a people home from exile and asking
  whether they are still the LORD's. Its center is the ark brought to Jerusalem the right way,
  carried by the Levites on its poles after the first attempt failed, and set "in the midst of the
  tent that David had pitched for it," with singers and the call to "seek the LORD and his strength,
  seek his face continually," and David's last labor, a house he may not build but prepares for,
  its pattern received in writing. It points to Jesus Christ, whom the LORD's presence, sought and
  approached by his appointed order, finally brings near.
motifs:
  - "Primary: the ark of the covenant, as the Bible describes it (Ex. 25:10–22; 37:1–9; 1 Chr. 13:6; 15:15; 28:18): a chest of acacia wood two and a half cubits long and a cubit and a half wide and high, overlaid with pure gold within and without, with a crown of gold round about; four rings of gold, with staves of acacia wood overlaid with gold in the rings to bear it; a mercy seat of pure gold on top; and two cherubims of beaten gold, one on each end of the mercy seat, that 'stretch forth their wings on high, covering the mercy seat with their wings, and their faces shall look one to another; toward the mercy seat shall the faces of the cherubims be.' Draw it as you understand that description."
  - "Supporting: on a woven mat in front of the ark, set down and unplayed, a small ancient lyre of dark wood with a yoke and ten strings (a kinnor, not a modern harp), and a pair of round bronze cymbals lying together (1 Chr. 15:16, 19; 16:5)."
  - "Supporting: beside the instruments, a single closed scroll of plain cream parchment tied with a cord, with no writing or marks visible on it (1 Chr. 28:12, 19; 9:1)."
composition: >-
  Inside a simple tent of plain undyed woven curtains, its front flaps drawn back and tied, seen
  from just outside the opening at eye level with the ark (1 Chr. 16:1). The ark stands in the
  center of the tent on a low step of fitted stone, the brightest thing in the picture. Morning
  sunlight comes in through the open flaps from the left and behind the viewer, falling across the
  ark's gold and the cherubim's wings, and the shadows fall to the right and back into the tent's
  warm dim interior. In the near foreground on the mat, the lyre, the cymbals and the scroll, small
  beside the ark. Through the opening at the edges, a glimpse of pale stone and a band of indigo
  sky. No people, no human faces, no animals, no altar, fire, smoke, crowns, weapons, writing or
  other objects.
