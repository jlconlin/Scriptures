alt: The ark of the covenant, gold all over with a gold crown round its rim, stands on a stone step inside a plain tent with its front flaps tied back; two golden cherubim kneel at the ends of its lid facing each other, heads bowed, their wings raised and arched over the lid until the tips nearly meet, and two gold poles run through rings on its side; in front of it a lyre, a pair of bronze cymbals and a cord-tied scroll lie on a woven mat.
key:
  - '**The ark, in the tent David pitched for it,** is where chapter 16 leaves it: “they brought the ark of God, and set it in the midst of the tent that David had pitched for it” ([[1 Chr. 16:1]]). It is the ark “of God the LORD, that dwelleth between the cherubims, whose name is called on it” ([[1 Chr. 13:6]]), and David gave Solomon gold for “the chariot of the cherubims, that spread out their wings, and covered the ark of the covenant of the LORD” ([[1 Chr. 28:18]]).'
  - '**The poles through its rings** are the lesson of its coming. The first time, on a cart, Uzza died, and David said why: “the LORD our God made a breach upon us, for that we sought him not after the due order” ([[1 Chr. 15:13]]). The second time “the children of the Levites bare the ark of God upon their shoulders with the staves thereon, as Moses commanded according to the word of the LORD” ([[1 Chr. 15:15]]). The LORD is approached as He appointed.'
  - '**The lyre and the cymbals,** set down before the ark, are the Levite singers David appointed “with instruments of musick, psalteries and harps and cymbals” ([[1 Chr. 15:16]]), Heman, Asaph and Ethan “to sound with cymbals of brass” ([[1 Chr. 15:19]]), “to minister before the ark of the LORD, and to record, and to thank and praise the LORD God of Israel” ([[1 Chr. 16:4]]). Their psalm calls, “Seek the LORD and his strength, seek his face continually” ([[1 Chr. 16:11]]).'
  - '**The tied scroll** is the book’s two written things: the genealogies by which “all Israel were reckoned,” “written in the book of the kings of Israel and Judah” ([[1 Chr. 9:1]]), and the pattern of the temple David gave Solomon, of which he said, “the LORD made me understand in writing by his hand upon me” ([[1 Chr. 28:19]]).'
status: approved
