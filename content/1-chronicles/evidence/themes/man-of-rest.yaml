page: man-of-rest
claims:
  - where: 'opening'
    claim: '1 Chr. 28:3 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/28?lang=eng'
    quote: 'Thou shalt not build an house for my name, because thou hast been a man of war, and hast shed blood.'
  - where: 'opening'
    claim: '1 Chr. 22:9 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/22?lang=eng'
    quote: 'Behold, a son shall be born to thee, who shall be a man of rest; and I will give him rest from all his enemies round about'
  - where: 'opening'
    claim: 'Connection made by this page: “man of war” (28:3) and “man of rest” (22:9), set in one speech at 22:8–9, are a pair that divides one work between two men: the one whose wars won the rest and furnished the house may not build it, and the one who builds it is given a peace he did not win'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/22?lang=eng'
    quote: 'thou shalt not build an house unto my name, because thou hast shed much blood upon the earth in my sight. Behold, a son shall be born to thee, who shall be a man of rest'
  - where: 'opening'
    claim: 'Connection made by this page: the two halves Chronicles divides between David and Solomon meet in Jesus Christ, who made peace by blood and builds a temple on it, the blood being His own (argued in section “The blood of his cross”)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/col/1?lang=eng'
    quote: 'And, having made peace through the blood of his cross, by him to reconcile all things unto himself'
  - where: 'opening'
    claim: 'No Church, Scripture Central, RSC or Interpreter source found (as searched) calls Solomon a type of Christ in this respect, treats “man of war” and “man of rest” as a pair, or ties the bar on David to Christ; what was searched: BD, Guide to the Scriptures, seminary manuals, Come, Follow Me 2026, KnoWhys, RSC, Interpreter. The one Bible Dictionary entry on Solomon names no such reading'
    key: bd-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/solomon?lang=eng'
    quote: 'Peaceable. Son of David and Bathsheba.'
  - where: 'opening'
    claim: 'Ps. 132:14 as quoted: the LORD calls the rest “my rest”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/132?lang=eng'
    quote: 'This is my rest for ever: here will I dwell; for I have desired it.'

  - where: 'section ““I will subdue all thine enemies””'
    claim: '2 Sam. 7:1 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/7?lang=eng'
    quote: 'And it came to pass, when the king sat in his house, and the Lord had given him rest round about from all his enemies;'
  - where: 'section ““I will subdue all thine enemies””'
    claim: '2 Sam. 7:11 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/7?lang=eng'
    quote: 'and have caused thee to rest from all thine enemies'
  - where: 'section ““I will subdue all thine enemies””'
    claim: '1 Chr. 17:1 has David sitting in his house with no clause of rest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/17?lang=eng'
    quote: 'Now it came to pass, as David sat in his house, that David said to Nathan the prophet'
  - where: 'section ““I will subdue all thine enemies””'
    claim: '1 Chr. 17:10 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/17?lang=eng'
    quote: 'Moreover I will subdue all thine enemies.'
  - where: 'section ““I will subdue all thine enemies””'
    claim: '2 Sam. 7:1 hēnîaḥ and 7:11 wahănîḥōtî are both H5117 (node scripts/hebrew.mjs 2-samuel 7:1, 7:11; occurrences.mjs 2-samuel --hebrew H5117: 7:1, 7:11, 17:12, 21:10)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'וַ/הֲנִיחֹ֥תִי'
  - where: 'section ““I will subdue all thine enemies””'
    claim: '1 Chr. 17:10 “I will subdue” is wĕhiknaʿtî (H3665), and 1 Chr. 17 has no H5117 (node scripts/hebrew.mjs 1-chronicles 17:1, 17:10)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: 'וְ/הִכְנַ֖עְתִּי'
  - where: 'section ““I will subdue all thine enemies””'
    claim: 'Cambridge: the Chronicler omits Samuel’s words of rest probably because chapters 18–20 are devoted to wars'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/17.htm'
    quote: 'The Chronicler omits these words probably because his next three chapters (18–20) are devoted to wars (cp. 2 Samuel 8, 10).'
  - where: 'section ““I will subdue all thine enemies””'
    claim: 'Keil: the clause is omitted to avoid an apparent contradiction, since the greatest wars are narrated in the following chapter'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/17.htm'
    quote: 'has been omitted by the chronicler to avoid the apparent contradiction which would have arisen in case the narrative were taken chronologically, seeing that the greatest of David''s wars'
  - where: 'section ““I will subdue all thine enemies””'
    claim: 'H5117 (nûaḥ, give rest) occurs three times in 1 Chronicles, at 22:9, 22:18 and 23:25, each with the LORD as giver (node scripts/occurrences.mjs 1-chronicles --hebrew H5117: “Total: 3 occurrences in 3 verses”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: 'וְ/הֵנִ֥יחַ'
  - where: 'section ““I will subdue all thine enemies””'
    claim: 'Connection made by this page: the result of Chronicles’ wording (17:1, 10 against 2 Sam. 7:1, 11) is a David to whom the LORD’s rest is never said to be given; it is given in his days, to Solomon, to the leaders and to the people. Stated as the result, not the writer’s purpose'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/23?lang=eng'
    quote: 'The Lord God of Israel hath given rest unto his people, that they may dwell in Jerusalem for ever'
  - where: 'section ““I will subdue all thine enemies””'
    claim: '1 Chr. 18:8 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/18?lang=eng'
    quote: 'brought David very much brass, wherewith Solomon made the brasen sea, and the pillars, and the vessels of brass.'
  - where: 'section ““I will subdue all thine enemies””'
    claim: '1 Chr. 18:11 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/18?lang=eng'
    quote: 'Them also king David dedicated unto the Lord, with the silver and the gold that he brought from all these nations; from Edom, and from Moab, and from the children of Ammon, and from the Philistines, and from Amalek.'

  - where: 'section ““Thou shalt not build””'
    claim: '1 Chr. 22:8 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/22?lang=eng'
    quote: 'Thou hast shed blood abundantly, and hast made great wars: thou shalt not build an house unto my name, because thou hast shed much blood upon the earth in my sight.'
  - where: 'section ““Thou shalt not build””'
    claim: '1 Chr. 22:9 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/22?lang=eng'
    quote: 'for his name shall be Solomon, and I will give peace and quietness unto Israel in his days.'
  - where: 'section ““Thou shalt not build””'
    claim: 'In 1 Chr. 22:9 the clause that gives the name Šĕlōmōh (H8010; šĕlōmōh yihyeh šĕmô, “Solomon shall be his name”) goes straight on with wĕšālôm (H7965), “and peace”; “a man of rest” is ʾîš mĕnûḥâ (H376, H4496) (node scripts/hebrew.mjs 1-chronicles 22:9)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: 'וְ/שָׁל֥וֹם'
  - where: 'section ““Thou shalt not build””'
    claim: 'The name Solomon means “Peaceable”'
    key: bd-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/solomon?lang=eng'
    quote: 'Peaceable. Son of David and Bathsheba.'
  - where: 'section ““Thou shalt not build””'
    claim: 'H4496 mĕnûḥâ occurs in 1 Chronicles twice, at 22:9 (ʾîš mĕnûḥâ) and 28:2 (bêt mĕnûḥâ) (node scripts/occurrences.mjs 1-chronicles --hebrew H4496: “Total: 2 occurrences in 2 verses”; hebrew.mjs 1-chronicles 28:2)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: 'מְנוּחָ֜ה'
