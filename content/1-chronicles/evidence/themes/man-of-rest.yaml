  - where: 'section ““Thou shalt not build””'
    claim: 'David collected the temple’s materials and planned the house and its furniture'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'had been collected by David (1 Chr. 22:14). He had also planned the house and its furniture to its details (1 Chr. 28:11–20)'
  - where: 'section ““Thou shalt not build””'
    claim: 'Keil: wars are unavoidable and necessary for the kingdom of God but not consonant with its nature as embodied in the temple; the kingdom is in essence a kingdom of peace'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/22.htm'
    quote: 'are unavoidable and necessary in this earth for the establishment of the kingdom of God in opposition to its enemies, but are not consonant with its nature, as it was to receive a visible embodiment and expression in the temple.'
  - where: 'section ““Thou shalt not build””'
    claim: 'Keil: the kingdom of God is in its essence a kingdom of peace'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/22.htm'
