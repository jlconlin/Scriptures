chapter: 25
claims:
  - where: 'when'
    claim: 'The orders of chapters 23–26 were given when David was old and had made Solomon king'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/23?lang=eng'
    quote: 'So when David was old and full of days, he made Solomon his son king over Israel.'
  - where: 'setting'
    claim: 'Chapter 23 set four thousand Levites to praise the LORD with David''s instruments'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/23?lang=eng'
    quote: 'four thousand praised the LORD with the instruments which I made, said David, to praise therewith.'
  - where: 'setting'
    claim: 'At the ark''s coming the Levites appointed Heman, Asaph and Ethan; Asaph led before the ark, Heman and Jeduthun gave thanks at Gibeon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/16?lang=eng'
    quote: 'And with them Heman and Jeduthun, and the rest that were chosen, who were expressed by name, to give thanks to the LORD, because his mercy endureth for ever'
  - where: 'setting'
    claim: 'Asaph from Gershon, Heman from Kohath, Jeduthun (Ethan) from Merari: all Levi''s families among the singers'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/25.htm'
    quote: 'Since Asaph was, according to 1 Chronicles 6:39-43, a descendant of Gershon, Heman, according to 1 Chronicles 6:33-38, a descendant of Kohath, and Jeduthun ( equals Ethan) a descendant of Merari (1 Chronicles 6:44-47), all the chief families of Levi had representatives among the singers.'
  - where: 'setting'
    claim: 'Heman was the son of Joel the son of Samuel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/6?lang=eng'
    quote: 'Of the sons of the Kohathites: Heman a singer, the son of Joel, the son of Shemuel'
  - where: 'setting'
    claim: 'The sons of Asaph and Heman and Jeduthun sang at the dedication of Solomon''s temple'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/5?lang=eng'
    quote: 'Also the Levites which were the singers, all of them of Asaph, of Heman, of Jeduthun, with their sons and their brethren'
  - where: 'thread'
    claim: 'Jeduthun prophesied with a harp to give thanks and praise; Heman was the king''s seer; the lots fell small and great alike'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/25?lang=eng'
    quote: 'And they cast lots, ward against ward, as well the small as the great, the teacher as the scholar.'
  - where: 'note 25:5 “The king''s seer, and the lifted horn”'
    claim: 'The Masoretic accent joins "to lift up the horn" to the words before it; Keil joins it to what follows'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/25.htm'
    quote: 'the Masoretes have connected with the preceding, by placing Athnach under the'
  - where: 'note 25:5 “The king''s seer, and the lifted horn”'
    claim: 'To lift up the horn means to raise Heman''s strength, through the sons God gave him'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/25.htm'
    quote: '"to elevate the horn," i.e., to give power, God gave Heman fourteen sons and three daughters'
  - where: 'section 2 plain'
    claim: '“Ward against ward” is rendered by the Revised Version “for their charges,” i.e. duties'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/25.htm'
    quote: 'ward against ward] R.V. (guessing the sense rightly) for their charges (i.e. duties), all alike. The Hebrew text however is faulty.'
  - where: 'section 2 plain'
    claim: 'The word rendered teacher means one skilled; scholar a learner'
    key: bdb
    url: 'https://biblehub.com/hebrew/995.htm'
    quote: 'מֵבִין teacher 1 Chronicles 15:22; 1 Chronicles 25:7,8; 1 Chronicles 27:32; Ezra 8:16.'
  - where: 'note 25:1 “Prophesying with harps”'
    claim: 'The lexicon puts the prophesying of 1 Chr. 25:1–3 with the song of Samuel''s company of prophets'
    key: bdb
    url: 'https://biblehub.com/hebrew/5012.htm'
    quote: 'a. in the ecstatic state, with song 1 Samuel 10:11; 1 Samuel 19:20 and music 1 Chronicles 25:1,2,3.'
  - where: 'note 25:1 “Prophesying with harps”'
    claim: 'The company of prophets came down with instruments and prophesied; Elisha prophesied when the minstrel played'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/10?lang=eng'
    quote: 'thou shalt meet a company of prophets coming down from the high place with a psaltery, and a tabret, and a pipe, and a harp, before them; and they shall prophesy'
  - where: 'note 25:1 “Prophesying with harps”'
    claim: 'When the minstrel played, the hand of the LORD came upon Elisha'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/3?lang=eng'
    quote: 'But now bring me a minstrel. And it came to pass, when the minstrel played, that the hand of the LORD came upon him.'
  - where: 'note 25:4 “Twenty-four names, and a sentence among them”'
    claim: 'Jeduthun''s six sons have five names; the Greek (Codex B) inserts Shimei, the tenth lot of verse 17'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/25.htm'
    quote: 'After this LXX. B inserts the name “Shimei” (Σεμεεὶ), no doubt rightly for (1) six sons are reckoned in this verse, (2) the “Shimei” of 1 Chronicles 25:17 is otherwise unmentioned in 1 Chronicles 25:2-4'
  - where: 'note 25:4 “Twenty-four names, and a sentence among them”'
    claim: 'Names differ in form between the two lists (Uzziel and Azareel); the difference in Hebrew consonants is small'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/25.htm'
    quote: 'Uzziel] In 1 Chronicles 25:18 “Azarel.” (R.V.) The variation between the two words when written with Hebrew consonants is small.'
  - where: 'note 25:4 “Twenty-four names, and a sentence among them”'
    claim: 'Heman''s last names are arranged to suggest a sentence'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/25.htm'
    quote: 'Most Hebrew names are significant, and many can be used as mottoes. In this place the Chronicler (or the authority from whom he drew the list) has so arranged the names as to suggest a sentence (extending to the end of the verse)'
  - where: 'note 25:4 “Twenty-four names, and a sentence among them”'
    claim: 'The sentence the names suggest'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/25.htm'
    quote: 'Have mercy upon me, O Lord, have mercy upon me; I have magnified and exalted [thy] help; I spake of it sitting in affliction; grant us still [thy] visions.'
  - where: 'note 25:4 “Twenty-four names, and a sentence among them”'
    claim: 'The lots fell four to Asaph, six to Jeduthun, the rest to Heman'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/25.htm'
    quote: 'the first, third, fifth and seventh lots fell to Asaph, the second, fourth, eighth, tenth, twelfth and fourteenth to Jeduthun, and the rest (fourteen in number) to Heman.'
  - where: 'note 25:5 “The king''s seer, and the lifted horn”'
    claim: 'A seer is one authorized of God to see with spiritual eyes; anciently a prophet was often called a seer'
    key: gs-seer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/seer?lang=eng'
    quote: 'A person authorized of God to see with spiritual eyes things that God has hidden from the world (Moses 6:35–38). He is a revelator and a prophet'
  - where: 'note 25:5 “The king''s seer, and the lifted horn”'
    claim: 'Heman had the prophetic gift with his gift of song and made known revelations to the king'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/25.htm'
    quote: 'because he, along with his gift of song, was endowed also with the prophetic gift, and as seer made known to the king revelations of God. In 2 Chronicles 35:15 the same thing is predicated also of Jeduthun'
  - where: 'note 25:5 “The king''s seer, and the lifted horn”'
    claim: 'Chronicles calls Gad David''s seer and Asaph the seer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/29?lang=eng'
    quote: 'commanded the Levites to sing praise unto the LORD with the words of David, and of Asaph the seer.'
  - where: 'note 25:5 “The king''s seer, and the lifted horn”'
    claim: 'Heman was Samuel''s grandson: Samuel''s firstborn was Joel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/8?lang=eng'
    quote: 'Now the name of his firstborn was Joel; and the name of his second, Abiah'
  - where: 'note 25:5 “The king''s seer, and the lifted horn”'
    claim: 'A lifted horn denotes increase of might and dignity, perhaps so here; an alternative reads it as blowing loudly'
    key: bdb
    url: 'https://biblehub.com/hebrew/7161.htm'
    quote: 'especially as lifted up (רום, as of a lordly animal, compare Dr1Samuel 2. 1), denoting increase of might, dignity 1 Samuel 2:1,10; … so perhaps 1 Chronicles 25:5 (see Kau; > Be blow loudly [compare 1c])'
  - where: 'note 25:5 “The king''s seer, and the lifted horn”'
    claim: 'The horn was not a Levites'' instrument; the phrase goes with what follows: God gave Heman many children to make his house mighty for praise'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/25.htm'
    quote: 'not only because the Levites under Heman''s direction did not blow horns, the horn not being one of the instruments played by the Levites in connection with the worship … to make Heman''s race mighty for the praise of God, God gave him so many sons and daughters.'
  - where: 'note 25:6 “The king''s order, and the LORD''s”'
    claim: 'Hezekiah set the Levites with instruments by the commandment of David, Gad and Nathan, which was the LORD''s commandment by his prophets'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/29?lang=eng'
    quote: 'according to the commandment of David, and of Gad the king’s seer, and Nathan the prophet: for so was the commandment of the LORD by his prophets.'
  - where: 'note 25:6 “The king''s order, and the LORD''s”'
    claim: 'At Josiah''s Passover the singers stood by the commandment of David, Asaph, Heman and Jeduthun'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/35?lang=eng'
    quote: 'And the singers the sons of Asaph were in their place, according to the commandment of David, and Asaph, and Heman, and Jeduthun the king’s seer'
  - where: 'note 25:6 “The king''s order, and the LORD''s”'
    claim: 'After the return the singers kept their ward by David''s commandment'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/12?lang=eng'
    quote: 'And both the singers and the porters kept the ward of their God, and the ward of the purification, according to the commandment of David, and of Solomon his son. … For in the days of David and Asaph of old there were chief of the singers, and songs of praise and thanksgiving unto God.'
  - where: 'note 25:8 “The small as the great, the teacher as the scholar”'
    claim: 'Each of the twenty-four lots was a group of twelve; the porters too cast lots small and great'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/26?lang=eng'
    quote: 'And they cast lots, as well the small as the great, according to the house of their fathers, for every gate.'
  - where: 'note 25:8 “The small as the great, the teacher as the scholar”'
    claim: '“Cunning” in verse 7 and “teacher” in verse 8 are one Hebrew word, which the lexicon renders teacher'
    key: bdb
    url: 'https://biblehub.com/hebrew/995.htm'
    quote: 'מֵבִין teacher 1 Chronicles 15:22; 1 Chronicles 25:7,8; 1 Chronicles 27:32; Ezra 8:16.'
  - where: 'note 25:8 “The small as the great, the teacher as the scholar”'
    claim: 'The word rendered scholar means a pupil'
    key: bdb
    url: 'https://biblehub.com/hebrew/8527.htm'
    quote: 'תַּלְמִיד noun [masculine] scholar (late; Late Hebrew) 1 Chronicles 25:8.'
  - where: 'note 25:8 “The small as the great, the teacher as the scholar”'
    claim: 'The Greek renders the pair as the perfect ones and the learners'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_chronicles/25.htm'
    quote: '8And they also cast lots for the daily courses, for the great and the small of them, of the perfect ones and the learners.'
  - where: 'christ'
    claim: 'Latter-day Saints may read the psalms as prophesying of Christ in a way that also reflects his people''s experience'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'This combined understanding of the Psalms see them as prophesying of Christ in a way that also reflects the experiences of his people'
  - where: 'christ'
    claim: 'The First Presidency: some of the greatest sermons are preached by singing hymns'
    key: hymns-first-presidency-preface
    url: 'https://www.churchofjesuschrist.org/study/manual/hymns/first-presidency-preface?lang=eng'
    quote: 'Some of the greatest sermons are preached by the singing of hymns. Hymns move us to repentance and good works, build testimony and faith, comfort the weary, console the mourning, and inspire us to endure to the end.'
  - where: 'note 25:1 “Prophesying with harps”'
    claim: 'On one Latter-day Saint reading the singing at the temple''s dedication led to the presence of God entering the house'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'This passage points to the music and singing itself as the behavior that directly led to the presence of God entering into the temple.'
