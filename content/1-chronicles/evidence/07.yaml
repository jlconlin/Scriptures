chapter: 7
claims:
  - where: 'when'
    claim: 'Chronicles was likely written after the Babylonian exile'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'The authorship of Chronicles remains uncertain, but most scholars suggest that the books were likely written after the Babylonian exile, possibly in the fourth century BC.'
  - where: 'setting'
    claim: 'The book was written after the exile'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'most scholars suggest that the books were likely written after the Babylonian exile'
  - where: 'setting'
    claim: 'Chapter 7 covers Issachar, Benjamin, Naphtali, Manasseh again, Ephraim and Asher in 40 verses; Judah had 102 verses; Benjamin again in chapter 8; Zebulun and perhaps Dan omitted'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/7.htm'
    quote: '1 Chronicles 2:1 to 1 Chronicles 4:23. Judah (102 verses). … 1 Chronicles 7:1-40. Issachar, Benjamin, Naphtali, Eastern Manasseh (again), Ephraim, and Asher (40 verses). 1 Chronicles 8:1-40. Benjamin, though already noticed in 1 Chronicles 7:6-11 (40 verses). Zebulun and (perhaps) Dan'
  - where: 'setting'
    claim: 'Dan and Zebulun are among the sons of Israel in 1 Chr. 2:1; Hushim is Dan''s son in Gen. 46:23'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/46?lang=eng'
    quote: 'And the sons of Dan; Hushim.'
  - where: 'setting'
    claim: 'Zebulun is named among the sons of Israel at 1 Chr. 2:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/2?lang=eng'
    quote: 'These are the sons of Israel; Reuben, Simeon, Levi, and Judah, Issachar, and Zebulun,'
  - where: 'setting'
    claim: 'One older reading: Aher ("another") replaces Dan, the Chronicler or a copyist having found Dan illegible'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/7.htm'
    quote: 'In Genesis 46:23 (cp. Numbers 26:42), the sons of Dan; Hushim. In Chron. the word Dan is replaced by Aher, either the Chronicler himself or some copyist having found Dan illegible. The word Aher (lit. “another”)'
  - where: 'setting'
    claim: 'Another older reading: Hushim sons of Aher are another Benjamite family, and Dan is omitted along with Zebulun'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/7.htm'
    quote: 'we might, notwithstanding the want of the conjunction w, take the Hushim sons of Aher to be another Benjamite family. In that case, certainly, the tribe of Dan would be omitted from our chapter; … not only Dan but also Zebulun is omitted.'
  - where: 'setting'
    claim: 'Issachar''s number in David''s day probably rests on the results of David''s census'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/7.htm'
    quote: 'As David caused the people to be numbered by Joab (2 Samuel 24; 1 Chronicles 21:1), this statement probably rests on the results of that census.'
  - where: 'setting'
    claim: 'Beth-el counted as Ephraimite as in the northern kingdom implies the register was prepared after that kingdom came into existence'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/7.htm'
    quote: 'is here mentioned as an Ephraimite city on the southern frontier of the Ephraimite territory, as it belonged to the kingdom of the ten tribes; whence we gather that this register was prepared after that kingdom had come into existence.'
  - where: 'note 7:15 “The daughters of Zelophehad”'
    claim: 'Zelophehad had no sons but daughters, named in Numbers'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/17?lang=eng'
    quote: 'But Zelophehad, the son of Hepher, the son of Gilead, the son of Machir, the son of Manasseh, had no sons, but daughters: and these are the names of his daughters, Mahlah, and Noah, Hoglah, Milcah, and Tirzah.'
  - where: 'note 7:15 “The daughters of Zelophehad”'
    claim: 'The land was divided according to the number of names counted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/26?lang=eng'
    quote: 'Unto these the land shall be divided for an inheritance according to the number of names.'
  - where: 'note 7:15 “The daughters of Zelophehad”'
    claim: 'The LORD ruled for the daughters and made the law of a daughter''s inheritance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/27?lang=eng'
    quote: 'If a man die, and have no son, then ye shall cause his inheritance to pass unto his daughter.'
  - where: 'note 7:15 “The daughters of Zelophehad”'
    claim: 'Manasseh had ten portions because the daughters had an inheritance among his sons'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/17?lang=eng'
    quote: 'Because the daughters of Manasseh had an inheritance among his sons: and the rest of Manasseh’s sons had the land of Gilead.'
  - where: 'note 7:22 “Ephraim''s loss, and a son named for it”'
    claim: 'Ephraim was born to Joseph in Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/41?lang=eng'
    quote: 'And the name of the second called he Ephraim: For God hath caused me to be fruitful in the land of my affliction.'
  - where: 'note 7:22 “Ephraim''s loss, and a son named for it”'
    claim: '"Came down" suits a descent from Mount Ephraim to Gath, not a march from Egypt; the patriarch Ephraim was dead long before the Exodus; one reading: a later Ephraimite bore Ephraim''s name, as a second Shuthelah appears in the sixth generation'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/7.htm'
    quote: 'went down from Mount Ephraim into the low-lying Gath, for a march out of Egypt into Canaan is irreconcilable with the verb ירד. … just as a descendant of Shuthelah in the sixth generation was also called Shuthelah, so also might a descendant of the patriarch Ephraim, living at a much later time, have received the name'
  - where: 'note 7:22 “Ephraim''s loss, and a son named for it”'
    claim: 'Beriah named because he was born when misfortune was in the house; the patriarch Ephraim was dead before the Exodus'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/7.htm'
    quote: 'since the patriarch Ephraim was dead long before the Israelites came forth out of Egypt. … to whom he gave the name Beriah, "because it was in misfortune in his house," i.e., because this son was born when misfortune was in his house.'
  - where: 'note 7:22 “Ephraim''s loss, and a son named for it”'
    claim: 'Other reading: "came down" suits descent from Ephraim''s hills; event probably after settlement; Ephraim is the tribe personified; the clan Beriah rose after disaster to Ezer and Elead'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/7.htm'
    quote: 'This phrase suits a descent from the hills of Ephraim, but not an invasion from Goshen. It therefore occurred probably after Israel was settled in Canaan … must be understood of the tribe personified in its ancestor. The clan Beriah became prominent after disaster had befallen the clans Ezer and Elead.'
  - where: 'note 7:22 “Ephraim''s loss, and a son named for it”'
    claim: 'Beriah / beraah is a play on the sound of the name'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/7.htm'
    quote: 'Heb. Beriah because it went beraah, a play on the sound of the name.'
  - where: 'note 7:22 “Ephraim''s loss, and a son named for it”'
    claim: 'Building the Beth-horons meant enlarging and fortifying them; Uzzen-sherah probably named after her'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/7.htm'
    quote: '"And his daughter Sherah," the daughter of the above-mentioned Ephraim, … "and Uzzen-sherah," a place not elsewhere referred to, which she probably founded, and which was called after her. The building of the two Beth-horons is merely an enlarging and fortifying of these towns.'
  - where: 'note 7:22 “Ephraim''s loss, and a son named for it”'
    claim: 'Beth-horon the nether and the upper lie on the border of Ephraim'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/16?lang=eng'
    quote: 'the border of the children of Ephraim according to their families was thus: even the border of their inheritance on the east side was Ataroth-addar, unto Beth-horon the upper;'
  - where: 'note 7:27 “Ephraim''s line reaches Joshua”'
    claim: 'Moses named Oshea son of Nun Jehoshua; the chapter footnote ties Jehoshua here to Num. 13:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/7?lang=eng'
    quote: 'Num. 11:28; 13:16.'
  - where: 'note 7:27 “Ephraim''s line reaches Joshua”'
    claim: 'Joshua son of Nun, born in Egypt before the Exodus, Moses'' minister, one of the twelve spies, his successor; the book of Joshua tells his conquest'
    key: bd-joshua
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joshua?lang=eng'
    quote: 'son of Nun, and successor of Moses; born in Egypt before the Exodus (Num. 14:26–31); fought with Amalek (Ex. 17:13–14); was Moses’ minister (24:13; 32:17; 33:11); one of the 12 spies (Num. 13:8); appointed Moses’ successor'
  - where: 'christ'
    claim: 'Jesus is the Greek form of Joshua, "God is help" or "Savior"; Joshua son of Nun so called in Acts 7:45 and Heb. 4:8; the name given the Savior by the angel''s direction'
    key: bd-jesus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jesus?lang=eng'
    quote: 'The Greek form of the name Joshua or Jeshua, “God is help” or “Savior.” Joshua son of Nun is so spoken of in Acts 7:45 and Heb. 4:8. … The name given by Joseph to the Savior of the world at His circumcision (Matt. 1:25; Luke 2:21), in accordance with the direction of the angel Gabriel'
  - where: 'christ'
    claim: 'The name occurs as Jehoshua and Jesus'
    key: bd-joshua
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joshua?lang=eng'
    quote: 'God is help. The name also occurs in the Old Testament under the various forms Jehoshua, Hoshea, Jeshua, and Jesus'
  - where: 'note 7:27 “Ephraim''s line reaches Joshua”'
    claim: 'The book of Joshua contains the history of his conquest'
    key: bd-joshua
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joshua?lang=eng'
    quote: 'The book of Joshua (see below) contains the history of his conquest of Palestine.'
  - where: 'note 7:27 “Ephraim''s line reaches Joshua”'
    claim: 'Moses called Oshea the son of Nun Jehoshua'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/13?lang=eng'
    quote: 'And Moses called Oshea the son of Nun Jehoshua.'
  - where: 'note 7:27 “Ephraim''s line reaches Joshua”'
    claim: 'Numbers names the prince of Ephraim Elishama the son of Ammihud'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/1?lang=eng'
    quote: 'Of the children of Joseph: of Ephraim; Elishama the son of Ammihud: of Manasseh; Gamaliel the son of Pedahzur.'
  - where: 'note 7:15 “The daughters of Zelophehad”'
    claim: 'Zelophehad of Machir''s line had no sons but daughters'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/26?lang=eng'
    quote: 'And Zelophehad the son of Hepher had no sons, but daughters'
