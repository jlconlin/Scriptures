chapter: 6
claims:
  - where: 'when'
    claim: 'Chronicles was written after the Babylonian exile'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'The authorship of Chronicles remains uncertain, but most scholars suggest that the books were likely written after the Babylonian exile, possibly in the fourth century BC.'
  - where: 'setting'
    claim: 'Most scholars hold the book was written after the return from Babylon'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'most scholars suggest that the books were likely written after the Babylonian exile'
  - where: 'setting'
    claim: 'The chapter is Levi’s: its sons, the singers, Aaron’s duties, the Levite cities among the tribes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/6?lang=eng'
    quote: 'The sons of Levi, including David’s singers, are listed—The responsibilities of Aaron and his descendants are given—Levite cities are designated in the areas of the various tribes.'
  - where: 'setting'
    claim: 'The parts of the chapter: the high priests to Jehozadak (1–15), the families of Levi’s sons (16–30)'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/6.htm'
    quote: '(1.) the genealogy of the high-priestly family of Aaron, down to Jehozadak, who was led away into exile by Nebuchadnezzar (1 Chronicles 6:1-15); (2.) a short register of the families of Gershon, Kohath, and Merari'
  - where: 'setting'
    claim: 'The singers’ genealogies (31–47), the Levites’ and priests’ service (48–49), the high priests to Ahimaaz again (50–53), the cities (54–81)'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/6.htm'
    quote: '(3.) the genealogies of the musicians Heman, Asaph, and Ethan (1 Chronicles 6:31-47), with remarks on the service of the other Levites (1 Chronicles 6:48, 1 Chronicles 6:49); (4.) a register of the high priests from Eleazar to Ahimaaz the son of Zadok (1 Chronicles 6:50-53), with a register of the cities'
  - where: 'setting'
    claim: 'The Hebrew counts verses 1–15 as 5:27–41; verse 16 is its 6:1'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: '<verse osisID="1Chr.5.27"> … <verse osisID="1Chr.5.41">'
  - where: 'thread'
    claim: 'A priest had to show his descent from Aaron'
    key: bd-genealogy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genealogy?lang=eng'
    quote: 'Where certain offices or blessings are restricted to particular families, genealogies become of great importance; for example, a priest must be able to show his descent from Aaron'
  - where: 'thread'
    claim: 'Levi had no inheritance of its own'
    key: bd-levites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levites?lang=eng'
    quote: 'They had no inheritance in Canaan (18:23–24); but they had the tithe (18:21), 48 cities (35:6)'
  - where: 'section 1 plain'
    claim: 'Eleazar succeeded Aaron, and the office came to his line'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/6.htm'
    quote: 'After Aaron''s death, his eldest son Eleazar was chosen by God to be his successor in the high priest''s office, and thus the line of Eleazar came into possession of the high-priestly dignity.'
  - where: 'note 6:3 “From Aaron to the captivity”'
    claim: 'Aaron’s line continued only through Eleazar and Ithamar; Eleazar succeeded Aaron, and his line held the office'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/6.htm'
    quote: 'As Nadab and Abihu were slain when they offered strange fire before Jahve (Leviticus 10:1.), Aaron''s race was continued only by his sons Eleazar and Ithamar. After Aaron''s death, his eldest son Eleazar was chosen by God to be his successor'
  - where: 'note 6:3 “From Aaron to the captivity”'
    claim: 'One older reading: the list gives the succession of high priests from Eleazar to Jehozadak'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/6.htm'
    quote: 'the purpose of the enumeration in 1 Chronicles 6:4-15 was to communicate the succession of high priests from Eleazar, who died shortly after Joshua (Joshua 24:33), to Jehozadak, whom Nebuchadnezzar caused to be carried away into Babylon.'
  - where: 'note 6:3 “From Aaron to the captivity”'
    claim: 'A priest had to show his descent from Aaron'
    key: bd-genealogy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genealogy?lang=eng'
    quote: 'Where certain offices or blessings are restricted to particular families, genealogies become of great importance; for example, a priest must be able to show his descent from Aaron'
  - where: 'note 6:3 “From Aaron to the captivity”'
    claim: 'Eli descended from Ithamar; the office stayed in his family until Abiathar, then passed back to Eleazar’s family'
    key: bd-eli
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/eli?lang=eng'
    quote: 'High priest and judge, a descendant of Aaron through Ithamar, his younger son. He was probably the first high priest of this line, and the office remained in his family till the deprivation of Abiathar (1 Kgs. 2:26–27), when it passed back to the family of Eleazar'
  - where: 'note 6:3 “From Aaron to the captivity”'
    claim: 'Jehoiada is missing; most probably his name fell out in transcription'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/6.htm'
    quote: 'The only possibilities in his case are, either that he occurs in our register under another name … or that the name יהוידע has fallen out through an old error in the transcription of the genealogical list. The latter supposition … is the more probable.'
  - where: 'note 6:3 “From Aaron to the captivity”'
    claim: 'Jewish commentators connected the remark of verse 10 with Azariah and Uzziah (2 Chr. 26:17); with Jehoiada restored the chronology allows it'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/6.htm'
    quote: 'R. Sal. and Kimchi have connected this remark with the events narrated in 2 Chronicles 26:17 … But if the name Jehoiada has been dropped out before Johanan … the chronological objection to the above-mentioned explanation … is removed.'
  - where: 'note 6:3 “From Aaron to the captivity”'
    claim: 'Jehozadak was the father of Joshua, who returned with Zerubbabel as the first high priest of the restored community'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/6.htm'
    quote: 'Jehozadak is the father of Joshua who returned from exile with Zerubbabel, and was the first high priest in the restored community (Ezra 3:2; Ezra 5:2; Haggai 1:1).'
  - where: 'note 6:3 “From Aaron to the captivity”'
    claim: 'Nadab and Abihu had no children'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/3?lang=eng&id=p4#p4'
    quote: 'And Nadab and Abihu died before the Lord, when they offered strange fire before the Lord, in the wilderness of Sinai, and they had no children'
  - where: 'note 6:28 “Samuel among the Levites”'
    claim: 'Samuel’s lineage is unclear; he and Elkanah are in the Levite genealogy of 1 Chr. 6'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'Samuel’s lineage is unclear; he and his father, Elkanah, are listed in the Levite genealogy recorded in 1 Chronicles 6:27–28.'
  - where: 'note 6:28 “Samuel among the Levites”'
    claim: 'One Latter-day Saint reading: Samuel’s dual descent may have qualified him to serve as priest as well as prophet and judge'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: '1 Chronicles 6:27 identifies Jeroham, Samuel’s paternal grandfather, as a Levite. Thus, Samuel’s dual descent may have qualified him, in terms of his lineage, to serve as priest as well as prophet and judge during his ministry.'
  - where: 'note 6:28 “Samuel among the Levites”'
    claim: 'A modern translation reads “Joel his firstborn, the second Abijah”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Chronicles+6%3A28&version=NRSVUE'
    quote: '28 The sons of Samuel: Joel his firstborn, the second Abijah.'
  - where: 'note 6:28 “Samuel among the Levites”'
    claim: 'The Greek and Syriac have Joel, which the Hebrew lacks'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Chronicles+6%3A28&version=NRSVUE'
    quote: '6.28 Gk Syr: Heb lacks Joel'
  - where: 'note 6:28 “Samuel among the Levites”'
    claim: 'One form of the Greek (Lucianic) and the Syriac read “the second” where the Hebrew has “Vashni, and Abijah”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Chronicles+6%3A28&version=NRSVUE'
    quote: '6.28 Lucianic Syr: Heb Vashni, and Abijah'
  - where: 'note 6:28 “Samuel among the Levites”'
    claim: 'Samuel’s sons were Joel and Abiah; Elkanah of mount Ephraim'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/8?lang=eng&id=p2#p2'
    quote: 'Now the name of his firstborn was Joel; and the name of his second, Abiah: they were judges in Beer-sheba.'
  - where: 'note 6:31 “Singers in a list of Levites”'
    claim: 'Chronicles ties Israel’s music to the Levites’ office and the temple; scholars disagree whether it reflects David’s day or the Second Temple; the temple connection is not debated'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'connect Israelite music directly to the office of the Levites and a temple setting. Although scholars disagree whether these accounts reflect an accurate understanding of the use of psalms in David’s day or if they instead are more indicative of temple usage during the Second Temple, the connection with temple worship is not under debate.'
  - where: 'note 6:31 “Singers in a list of Levites”'
    claim: 'When the ark came, Levites were appointed to minister before it with music (1 Chr. 16)'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'The backdrop for David’s psalm includes the music of the Levitical priests, who had been appointed “to minister before the ark of the Lord” (1 Chronicles 16:37)'
  - where: 'note 6:31 “Singers in a list of Levites”'
    claim: 'One Latter-day Saint reading: the singing led to God’s presence entering the temple at its dedication'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'This passage points to the music and singing itself as the behavior that directly led to the presence of God entering into the temple.'
  - where: 'note 6:31 “Singers in a list of Levites”'
    claim: 'The psalm titles naming Asaph may have been added later'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'Although they may have been added later, subtitles such as those found in Psalms 83 and 84 connected various psalms to figures such as Asaph or the sons of Korah'
  - where: 'note 6:31 “Singers in a list of Levites”'
    claim: 'The Levites sang in the tabernacle and temple, a tradition that continued into Nephite worship'
    key: sc-knowhy-251
    url: 'https://scripturecentral.org/knowhy/why-was-singing-hymns-a-part-of-nephite-worship-services'
    quote: 'The Bible indicates that one of the functions of the priestly tribe of Israel, the Levites, was to sing in the tabernacle and, later, the temple in Jerusalem.'
  - where: 'note 6:31 “Singers in a list of Levites”'
    claim: 'The tradition of ancient Israel continued into Book of Mormon practice'
    key: sc-knowhy-251
    url: 'https://scripturecentral.org/knowhy/why-was-singing-hymns-a-part-of-nephite-worship-services'
    quote: 'It was clearly part of the religious tradition of ancient Israel that continued not only into Book of Mormon practice, but also into that of later Jewish and Christian groups.'
  - where: 'note 6:31 “Singers in a list of Levites”'
    claim: 'Singing hymns was believed to be inspired by the Spirit and to bring the Spirit, which fits Moroni 6:9'
    key: sc-knowhy-251
    url: 'https://scripturecentral.org/knowhy/why-was-singing-hymns-a-part-of-nephite-worship-services'
    quote: 'Composing and singing hymns was believed to be inspired by the Spirit and also to bring the Spirit. … These notions fit well with Moroni’s comment that the church sang hymns “as the power of the Holy Ghost led them” (Moroni 6:9).'
  - where: 'note 6:31 “Singers in a list of Levites”'
    claim: 'Korah son of Izhar son of Kohath rebelled'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/16?lang=eng&id=p1#p1'
    quote: 'Now Korah, the son of Izhar, the son of Kohath, the son of Levi'
  - where: 'note 6:49 “Levites and priests”'
    claim: 'The lesser priesthood only in Levi; only Aaron and his sons priests'
    key: bd-aaronic-priesthood
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/aaronic-priesthood?lang=eng'
    quote: 'the lesser priesthood was conferred only upon men of the tribe of Levi. However, within the tribe, only Aaron and his sons could hold the office of priest. And, still further, from the firstborn of Aaron’s sons (after Aaron) was selected the high priest'
  - where: 'note 6:49 “Levites and priests”'
    claim: 'Priests offered sacrifice, burned incense and taught; Levites kept the tabernacle and lamps, carried the ark; Korah’s rebellion shows the difference'
    key: bd-aaronic-priesthood
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/aaronic-priesthood?lang=eng'
    quote: 'The priests could offer sacrifices for the people, burn incense on the altar, and teach the law, whereas the other Levites were employed in … the housekeeping of the tabernacle, keeping oil in the lamps, transporting the Ark of the Covenant … The account of Korah’s rebellion … delineates some of the differences'
  - where: 'note 6:49 “Levites and priests”'
    claim: 'Levites assisted the priests, were musicians, slaughtered sacrifices, and were given in place of the firstborn'
    key: bd-levites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levites?lang=eng'
    quote: 'The work of the Levites was to assist the priests (Num. 3:5–10; 18:1–7). They acted as musicians (1 Chr. 6:16, 31; 15:16; Neh. 11:17, 22); slaughtered the sacrifices … they thus became God’s peculiar property, given to Him in place of the firstborn (8:16).'
  - where: 'note 6:49 “Levites and priests”'
    claim: 'Zadok and Ahimaaz in David’s day; Solomon set Zadok in Abiathar’s place'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/2?lang=eng&id=p35#p35'
    quote: 'and Zadok the priest did the king put in the room of Abiathar.'
  - where: 'note 6:54 “Castles, coasts and suburbs”'
    claim: '“Castles” renders a word for an encampment, and so a habitation, used here generally beside “dwelling places”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2918.htm'
    quote: '1 encampment, especially of circular encampment of nomad tribes … encampment (poetry) = habitation Psalm 69:26 … more Generally, 1 Chronicles 6:39 ("" מושׁבות).'
  - where: 'note 6:54 “Castles, coasts and suburbs”'
    claim: '“Coasts” renders a word for border or territory'
    key: bdb
    url: 'https://biblehub.com/hebrew/1366.htm'
    quote: 'גְּבוּל240 noun masculineNumbers 34:3 border, boundary, territory'
  - where: 'note 6:54 “Castles, coasts and suburbs”'
    claim: 'Levi had no inheritance but forty-eight cities'
    key: bd-levites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levites?lang=eng'
    quote: 'They had no inheritance in Canaan (18:23–24); but they had the tithe (18:21), 48 cities (35:6)'
  - where: 'note 6:54 “Castles, coasts and suburbs”'
    claim: 'In Joshua the priests had the first lot'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/21?lang=eng&id=p10#p10'
    quote: 'Which the children of Aaron, being of the families of the Kohathites, who were of the children of Levi, had: for theirs was the first lot.'
  - where: 'christ'
    claim: 'The sacrifices were symbolic of Christ’s death, offered by faith in Him'
    key: bd-atonement
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/atonement?lang=eng'
    quote: 'These sacrifices were symbolic of the forthcoming death of Jesus Christ and were done by faith in Him (Moses 5:5–8).'
  - where: 'christ'
    claim: 'Christ the only one capable of making an atonement; the Day of Atonement foreshadowed His work'
    key: bd-atonement
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/atonement?lang=eng'
    quote: 'Jesus Christ … was the only one capable of making an atonement for mankind. … The services of the Day of Atonement foreshadowed the atoning work of Christ (Lev. 4; 23:26–32; Heb. 9).'
  - where: 'christ'
    claim: 'The faithful in the two priesthoods become the sons of Moses and of Aaron'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng&id=p33-p34#p33'
    quote: 'They become the sons of Moses and of Aaron and the seed of Abraham, and the church and kingdom, and the elect of God.'
  - where: 'note 6:3 “From Aaron to the captivity”'
    claim: 'Seraiah the chief priest was put to death at Riblah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng&id=p18-p21#p18'
    quote: 'And the king of Babylon smote them, and slew them at Riblah in the land of Hamath.'
  - where: 'note 6:3 “From Aaron to the captivity”'
    claim: 'Solomon thrust out Abiathar and put Zadok in his place'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/2?lang=eng&id=p27-p35#p27'
    quote: 'Zadok the priest did the king put in the room of Abiathar.'
  - where: 'note 6:3 “From Aaron to the captivity”'
    claim: 'Jeshua son of Jozadak led the priests at the return'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/3?lang=eng&id=p2#p2'
    quote: 'Then stood up Jeshua the son of Jozadak, and his brethren the priests'
  - where: 'note 6:28 “Samuel among the Levites”'
    claim: 'Vashni is pointed as a name, but the lexicon reads “the firstborn Joel, and the second Abijah,” with the Lucianic Greek and 1 Sam. 8:2'
    key: bdb
    url: 'https://biblehub.com/hebrew/2059.htm'
    quote: 'וַשְׁנִי according to ᵑ0 apparently proper name, masculine son of Samuel, only הַבְּכֹר וַשְׁנִי וַאֲבִיָּה 1 Chronicles 6:13, but read הַבְּכֹר יוֺאֵל וְהַשֵּׁנִי אביה compare ᵐ5L, and "" 1 Samuel 8:2'
  - where: 'note 6:31 “Singers in a list of Levites”'
    claim: 'Asaph is named in the titles of Psalms 50 and 73–83'
    key: bd-asaph
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/asaph?lang=eng'
    quote: 'mentioned in the titles of various Psalms. See 1 Chr. 6:39; 15:17, 19; 16:4–7, 37; 25:1–9; 2 Chr. 5:12; 20:14; Ezra 2:41; 3:10; Neh. 7:44; Ps. 50; 73–83.'
  - where: 'note 6:54 “Castles, coasts and suburbs”'
    claim: '“Suburbs” renders a word for common land around a town, perhaps originally pasture, especially around the Levites’ cities'
    key: bdb
    url: 'https://biblehub.com/hebrew/4054.htm'
    quote: 'common, common-land, open land (perhaps originally pasture-land, as place of [cattle] driving)'
