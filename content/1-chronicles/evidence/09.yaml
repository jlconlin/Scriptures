chapter: 9
claims:
  - where: 'setting'
    claim: 'Verse 1 closes the genealogies of chapters 2–8 and makes the transition to the inhabitants of Jerusalem'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/9.htm'
    quote: 'That 1 Chronicles 9:1 forms the transition from the genealogies to the enumeration of the inhabitants of Jerusalem, and so is properly the conclusion of the genealogies in 1 Chronicles 2-8, is so manifest'
  - where: 'setting'
    claim: 'Modern translations read verse 2 as the first to live again in their possessions, and head the list as Jerusalem''s inhabitants after the exile'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Chronicles+9&version=NRSVUE'
    quote: '2 Now the first to live again in their possessions in their towns were Israelites, priests, Levites, and temple servants.(B) … Inhabitants of Jerusalem after the Exile'
  - where: 'setting'
    claim: 'The registers of 1 Chr. 9 and Neh. 11 are alike in plan where they list the chiefs dwelling in Jerusalem'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/9.htm'
    quote: 'if we turn our attention only to the enumeration of chiefs dwelling in Jerusalem, then the registers in 1 Chronicles 9:4-17 of our chapter and in Nehemiah 11:3-19 are identical in plan.'
  - where: 'setting'
    claim: 'The two registers agree in only a few names; the other names are different'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/9.htm'
    quote: 'Of the other names in our register only the following are identical: of the Benjamites, Sallu the son of Meshullam … of the priests, Adaiah … and of the Levites, Shemaiah and Mattaniah … All the other names are different'
  - where: 'setting'
    claim: 'The remarks on the porters'' service (9:18–26) and the Levites'' duties have no counterpart in Nehemiah''s register'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/9.htm'
    quote: 'Here the agreement between the two registers ceases. In the Chronicle there follows first of all, in 1 Chronicles 9:18-26, some remarks on the service of the doorkeepers; and then in 1 Chronicles 9:26-32 the duties of the Levites in general are spoken of'
  - where: 'setting'
    claim: 'The register of Saul''s family is repeated from 8:29–38 to introduce the narrative of Saul''s death in chapter 10'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/9.htm'
    quote: 'This register has already occurred in 1 Chronicles 8:29-38 … and is repeated here only to connect the following history of the kingship with the preceding genealogical lists. It forms here the introduction to the narrative of Saul''s death in 1 Chronicles 10:1-14'
  - where: 'setting'
    claim: 'The passage 9:35–38 repeats 8:29–32, probably to introduce the story of Saul''s death'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/9.htm'
    quote: '35–38 (= 1 Chronicles 8:29-32). Benjamites living in Gibeon and in Jerusalem See notes on 1 Chronicles 8:29 ff. The passage is probably repeated here in ler to serve as an introduction to the story of the death of Saul.'
  - where: 'section 1 plain'
    claim: 'Verse 1 read with the break after "kings of Israel": Judah was carried away for their unfaithfulness'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Chronicles+9&version=NRSVUE'
    quote: 'So all Israel was enrolled by genealogies, and these are written in the Book of the Kings of Israel. And Judah was taken into exile in Babylon because of their unfaithfulness.'
  - where: 'section 2 plain'
    claim: 'Verse 2: the first to live again in their possessions'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Chronicles+9&version=NRSVUE'
    quote: 'Now the first to live again in their possessions in their towns were Israelites, priests, Levites, and temple servants.'
  - where: 'section 5 plain'
    claim: 'Verses 18–22 rendered: gatekeepers of the camp of the Levites; their ancestors over the camp of the Lord; established in their office of trust'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Chronicles+9&version=NRSVUE'
    quote: 'These were the gatekeepers of the camp of the Levites.(F) 19 … as their ancestors had been in charge of the camp of the Lord, guardians of the entrance. … David and the seer Samuel established them in their office of trust.'
  - where: 'section 6 plain'
    claim: 'Verse 33 rendered: the singers lived in the chambers of the temple free from other service'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Chronicles+9&version=NRSVUE'
    quote: 'Now these are the singers, the heads of ancestral houses of the Levites, living in the chambers of the temple free from other service, for they were on duty day and night.'
  - where: 'note 9:1 “Carried away for their unfaithfulness”'
    claim: 'The Hebrew word for "transgression" in 9:1 is maʿal'
    key: oshb-wlc
    url: 'https://biblehub.com/hebrew/4604.htm'
    quote: 'Strong''s Hebrew: 4604. מָ֫עַל (maal) -- Unfaithfulness, treachery, trespass, transgression'
  - where: 'note 9:1 “Carried away for their unfaithfulness”'
    claim: 'maʿal means an unfaithful, treacherous act; in 1 Chr. 9:1 it is used of unfaithfulness against God'
    key: bdb
    url: 'https://biblehub.com/hebrew/4604.htm'
    quote: 'מַ֫עַל noun masculineEzra 9:2 unfaithful, treacherous act … 2 elsewhere ag. God, with בְּ, Joshua 22:22 (P); without בְּ, 1 Chronicles 9:1'
  - where: 'note 9:1 “Carried away for their unfaithfulness”'
    claim: 'The ESV renders the word "breach of faith" and divides the verse after "Kings of Israel"'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=1+Chronicles+9&version=ESV'
    quote: 'So all Israel was recorded in genealogies, and these are written in the Book of the Kings of Israel. And (A)Judah was taken into exile in Babylon because of their breach of faith.'
  - where: 'note 9:1 “Carried away for their unfaithfulness”'
    claim: 'The NRSVue renders the word "unfaithfulness" and divides the verse after "Kings of Israel"'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Chronicles+9&version=NRSVUE'
    quote: 'these are written in the Book of the Kings of Israel. And Judah was taken into exile in Babylon because of their unfaithfulness.'
  - where: 'note 9:1 “Carried away for their unfaithfulness”'
    claim: 'Chronicles cites "the book of the kings of Israel and Judah" again for a king of Judah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/27?lang=eng'
    quote: 'Now the rest of the acts of Jotham, and all his wars, and his ways, lo, they are written in the book of the kings of Israel and Judah.'
  - where: 'note 9:2 “The first to dwell again”'
    claim: 'Modern translations read verse 2 as those who first lived again in their possessions'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Chronicles+9&version=NRSVUE'
    quote: 'Now the first to live again in their possessions in their towns were Israelites, priests, Levites, and temple servants.'
  - where: 'note 9:2 “The first to dwell again”'
    claim: 'The ESV likewise: the first to dwell again in their possessions'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=1+Chronicles+9&version=ESV'
    quote: '(B)Now the first to (C)dwell again in their possessions in their cities were Israel, the priests, the Levites, and the (D)temple servants.'
  - where: 'note 9:2 “The first to dwell again”'
    claim: 'Nehemiah''s register opens with the same four classes and a fifth, the children of Solomon''s servants, and names only Judah and Benjamin in Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/11?lang=eng'
    quote: 'in the cities of Judah dwelt every one in his possession in their cities, to wit, Israel, the priests, and the Levites, and the Nethinims, and the children of Solomon’s servants … And at Jerusalem dwelt certain of the children of Judah, and of the children of Benjamin.'
  - where: 'note 9:2 “The first to dwell again”'
    claim: 'Nehemiah has Sallu son of Meshullam with other ancestors, and 928 Benjamites'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/11?lang=eng'
    quote: 'Sallu the son of Meshullam, the son of Joed, the son of Pedaiah … And after him Gabbai, Sallai, nine hundred twenty and eight.'
  - where: 'note 9:2 “The first to dwell again”'
    claim: 'Nehemiah also names Adaiah son of Jeroham, Shemaiah, Mattaniah of Asaph, Akkub and Talmon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/11?lang=eng'
    quote: 'Adaiah the son of Jeroham … Shemaiah the son of Hashub … Mattaniah the son of Micha, the son of Zabdi, the son of Asaph … Moreover the porters, Akkub, Talmon, and their brethren'
  - where: 'note 9:3 “Ephraim and Manasseh in Jerusalem”'
    claim: 'Verse 3 names Ephraim and Manasseh among Jerusalem''s people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/9?lang=eng'
    quote: 'And in Jerusalem dwelt of the children of Judah, and of the children of Benjamin, and of the children of Ephraim, and Manasseh;'
  - where: 'note 9:3 “Ephraim and Manasseh in Jerusalem”'
    claim: 'People of the northern tribes moved to Judah under Asa and after Assyria conquered the north in 722 BC, so that a large population of them lived in the south; Lehi''s ancestors among them'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'during King Asa’s reign, many people from the northern tribes relocated to Judah … Another large-scale migration took place after Assyria conquered the Northern Kingdom in 722 BC. As a result, a large population of people from the northern tribes resided in the Southern Kingdom.'
  - where: 'note 9:3 “Ephraim and Manasseh in Jerusalem”'
    claim: 'Lehi was probably descended from Manassite refugees who fled south in 724–722 BC'
    key: sc-knowhy-708
    url: 'https://scripturecentral.org/knowhy/why-did-lehi-live-in-jerusalem'
    quote: 'Lehi was probably a descendant of Manassite refugees who had fled south to Judah with others of the northern kingdom when the Assyrians attacked, destroyed, and deported Israel in 724–722 BC.'
  - where: 'note 9:3 “Ephraim and Manasseh in Jerusalem”'
    claim: 'Archaeology suggests these refugees were integrated into the upper levels of Judahite society'
    key: sc-knowhy-708
    url: 'https://scripturecentral.org/knowhy/why-did-lehi-live-in-jerusalem'
    quote: 'the discovery of numerous seals from the same time period suggests that descendants of these refugees were indeed integrated into the upper echelons of Judahite society and government.'
  - where: 'note 9:3 “Ephraim and Manasseh in Jerusalem”'
    claim: 'Lehi was a descendant of Manasseh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/10?lang=eng'
    quote: 'Lehi, who came out of the land of Jerusalem, who was a descendant of Manasseh'
  - where: 'note 9:22 “Ordained by David and Samuel the seer”'
    claim: 'The Hebrew behind "in their set office" is be-emunatam'
    key: oshb-wlc
    url: 'https://biblehub.com/hebrew/530.htm'
    quote: 'Strong''s Hebrew: 530. אֱמוּנָה, (emunah) -- Faithfulness, fidelity, steadfastness, trust, faith'
  - where: 'note 9:22 “Ordained by David and Samuel the seer”'
    claim: 'BDB: emunah is faithfulness, trust; the phrase in 9:22, 26, 31 means "in trust"'
    key: bdb
    url: 'https://biblehub.com/hebrew/530.htm'
    quote: '3.faithfulness, trust: a. of human conduct … in office 2 Kings 22:7 … (על) בֶּאֱמוּנָה in trust (over) 1 Chronicles 9:22,26,31'
  - where: 'note 9:22 “Ordained by David and Samuel the seer”'
    claim: 'NRSVue: established them in their office of trust'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Chronicles+9&version=NRSVUE'
    quote: 'David and the seer Samuel established them in their office of trust.'
  - where: 'note 9:22 “Ordained by David and Samuel the seer”'
    claim: 'Samuel died before David''s reign; no other record has him arranging the Levites'' service'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/9.htm'
    quote: 'Nowhere else do we find any record of Samuel''s having taken any part in David''s arrangement of the service of the Levites in the holy place. Samuel, moreover, was no longer living … for he died before Saul'
  - where: 'note 9:22 “Ordained by David and Samuel the seer”'
    claim: 'Keil: Samuel prepared the way by restoring the worship neglected under Eli and ordaining trustworthy men; David named first because the organization was his'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/9.htm'
    quote: 'David is named first on account of his connection with the matter in hand … Samuel had prepared the way in his struggle for the restoration of the theocracy, and of the worship which had fallen into desuetude under Eli and his profligate sons. To do this in any measure, he must have, without doubt, ordained trustworthy men'
  - where: 'note 9:22 “Ordained by David and Samuel the seer”'
    claim: 'Keil: the fathers'' houses performed the same service from generation to generation, so the present generation could be said to be appointed by David'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/9.htm'
    quote: 'their fathers''-houses were not extinguished at the death of their temporary heads, and performed the same service from generation to generation, it might well be said of the generation performing the service at the time of the preparation of our register, that David had appointed them'
  - where: 'note 9:22 “Ordained by David and Samuel the seer”'
    claim: 'Cambridge: Samuel perhaps named because he himself kept the doors (1 Sam. 3:15); no evidence outside Chronicles of his organising work'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/9.htm'
    quote: 'Samuel the seer is here associated with David in the work, perhaps as having himself exercised the doorkeeper’s office (1 Samuel 3:15). We have however no evidence outside Chron. of Samuel’s organising work for the sanctuary.'
  - where: 'note 9:22 “Ordained by David and Samuel the seer”'
    claim: 'Cambridge: the entry kept was that of the camp, which Phinehas avenged at Peor'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/9.htm'
    quote: 'probably in the present passage the entry to the camp, not to the tabernacle, is meant. With this view agrees the mention of Phinehas (1 Chronicles 9:20), for it was the profanation of the camp, not of the tabernacle, which Phinehas avenged (Numbers 25:6-8)'
  - where: 'note 9:22 “Ordained by David and Samuel the seer”'
    claim: 'The Hebrew behind "host" in 9:19 is encampment'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/9?lang=eng'
    quote: 'HEB encampment'
  - where: 'note 9:22 “Ordained by David and Samuel the seer”'
    claim: 'Phinehas, Aaron''s grandson, later high priest'
    key: bd-phinehas
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/phinehas?lang=eng'
    quote: '(1) Grandson of Aaron (Ex. 6:25); kills the two offenders at Peor (Num. 25:7, 11; 31:6; Ps. 106:30) … high priest (Judg. 20:28; 1 Chr. 6:4, 50; 9:20)'
  - where: 'note 9:33 “Free for the work day and night”'
    claim: 'The singers lived in the chambers free from other service, on duty day and night'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Chronicles+9&version=NRSVUE'
    quote: 'living in the chambers of the temple free from other service, for they were on duty day and night.'
  - where: 'note 9:33 “Free for the work day and night”'
    claim: 'The Church''s footnote on "night" points to Ps. 134:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/134?lang=eng'
    quote: 'Behold, bless ye the Lord, all ye servants of the Lord, which by night stand in the house of the Lord.'
  - where: 'christ'
    claim: 'Chronicles written to give hope and to answer whether they are still God''s people'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'the question Chronicles appears to address is “Are we still God''s people and does the covenant still stand?" The Chronicler writes to give hope'
  - where: 'christ'
    claim: 'The risen Lord, teaching the Nephites: I will remember the covenant with my people; give them again the land of Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/20?lang=eng'
    quote: 'And I will remember the covenant which I have made with my people; … that I would give unto them again the land of their fathers for their inheritance, which is the land of Jerusalem'
  - where: 'christ'
    claim: 'Names taken to be remembered and nourished'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/moro/6?lang=eng'
    quote: 'their names were taken, that they might be remembered and nourished by the good word of God'
