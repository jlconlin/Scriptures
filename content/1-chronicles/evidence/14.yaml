chapter: 14
claims:
  - where: 'setting'
    claim: 'Samuel tells the same events: Hiram, the sons born in Jerusalem, the two Philistine battles'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/5?lang=eng'
    quote: 'And Hiram king of Tyre sent messengers to David, and cedar trees, and carpenters, and masons: and they built David an house.'
  - where: 'setting'
    claim: 'Samuel ends the second battle at Geba, where Chronicles has Gibeon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/5?lang=eng'
    quote: 'And David did so, as the Lord had commanded him; and smote the Philistines from Geba until thou come to Gazer.'
  - where: 'setting'
    claim: 'Chronicles sets the chapter between the two attempts to move the ark, which Samuel tells in immediate succession'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/14.htm'
    quote: 'In Samuel the two attempts to remove the ark to the city of David, the first unsuccessful, the second successful, are related in immediate succession; the Chronicler interposes between them the double repulse of the Philistines.'
  - where: 'setting'
    claim: 'The register in 1 Chr. 3 also has Nogah and a second Eliphelet among the sons born in Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/3?lang=eng'
    quote: 'Ibhar also, and Elishama, and Eliphelet, And Nogah, and Nepheg, and Japhia, And Elishama, and Eliada, and Eliphelet, nine.'
  - where: 'setting'
    claim: 'Beeliada is Baaliada, a name with Baal in it, where Samuel has Eliada'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/3.htm'
    quote: 'Eliada] so in 2 Samuel 5:16, but in 1 Chronicles 14:7 Beeliada (i.e. Baaliada).'
  - where: 'thread'
    claim: 'Verse 17 is not in Samuel; it closes the account of the victories by saying they exalted David''s name among the nations, a kind of remark Chronicles makes again'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/14.htm'
    quote: 'In 1 Chronicles 14:17, which is wanting in Samuel, the author concludes the account of these victories by the remark that they tended greatly to exalt the name of David among the nations. For similar reflections, cf. 2 Chronicles 17:10; 2 Chronicles 20:29; 2 Chronicles 14:13'
  - where: 'thread'
    claim: 'Jehoshaphat: the fear of the LORD fell on the kingdoms round about'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/17?lang=eng'
    quote: 'And the fear of the Lord fell upon all the kingdoms of the lands that were round about Judah, so that they made no war against Jehoshaphat.'
  - where: 'section 4 plain'
    claim: 'The "mulberry trees" are balsam trees'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/14.htm'
    quote: 'mulberry trees] R.V. mg. balsam trees. Some kind of tree or shrub from which gum exudes seems to be meant.'
  - where: 'section 4 plain'
    claim: '"A sound of going" is the sound of marching'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/14.htm'
    quote: '15. a sound of going] R.V. the sound of marching.'
  - where: 'note 14:1 “Between the ark''s two journeys”'
    claim: 'Chronicles places the chapter between the removal of the ark and its being brought to Jerusalem; this does not mean the events happened in the three months; the Chronicler wanted the ark to stand as David''s first undertaking'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/14.htm'
    quote: 'The position in which the narrative of these events stands, between the removal of the ark from Kirjath-jearim and its being brought to Jerusalem, is not to be supposed to indicate that they happened in the interval of three months'
  - where: 'note 14:1 “Between the ark''s two journeys”'
    claim: 'Keil: the Chronicler desired to represent the ark as David''s first undertaking after winning Jerusalem, and so brought these events in later'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/14.htm'
    quote: 'desired to represent David''s design to bring the ark into the capital city of his kingdom as his first undertaking after he had won Jerusalem, and was consequently compelled to bring in the events of our chapter at a later period'
  - where: 'note 14:1 “Between the ark''s two journeys”'
    claim: 'To agree with Samuel the chapter would follow 11:9 and precede 13:1; Samuel tells the two attempts to move the ark together'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/14.htm'
    quote: 'The Chronicler derives this ch. from Samuel but gives it in a setting of his own. To agree with Samuel it should immediately follow 1 Chronicles 11:9 and should immediately precede 1 Chronicles 13:1.'
  - where: 'note 14:1 “Between the ark''s two journeys”'
    claim: 'The ark stayed three months in Obed-edom''s house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/13?lang=eng'
    quote: 'And the ark of God remained with the family of Obed-edom in his house three months. And the Lord blessed the house of Obed-edom, and all that he had.'
  - where: 'note 14:1 “Between the ark''s two journeys”'
    claim: 'Chapter 15 resumes with David making houses and preparing a place for the ark'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/15?lang=eng'
    quote: 'And David made him houses in the city of David, and prepared a place for the ark of God, and pitched for it a tent.'
  - where: 'note 14:1 “Between the ark''s two journeys”'
    claim: 'Samuel''s ark story begins in chapter 6, after the events of 2 Sam. 5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/6?lang=eng'
    quote: 'And David arose, and went with all the people that were with him from Baale of Judah, to bring up from thence the ark of God'
  - where: 'note 14:3 “More wives, and the concubines”'
    claim: 'Samuel''s verse has concubines and wives'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/5?lang=eng'
    quote: 'And David took him more concubines and wives out of Jerusalem, after he was come from Hebron: and there were yet sons and daughters born to David.'
  - where: 'note 14:3 “More wives, and the concubines”'
    claim: 'Chronicles'' own register of David''s sons mentions the concubines'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/3?lang=eng'
    quote: 'These were all the sons of David, beside the sons of the concubines, and Tamar their sister.'
  - where: 'note 14:12 “Burned, as the law commanded”'
    claim: 'Samuel''s verse (KJV) says David and his men burned the images'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/5?lang=eng'
    quote: 'And there they left their images, and David and his men burned them.'
  - where: 'note 14:12 “Burned, as the law commanded”'
    claim: 'The law commands that graven images be burned with fire'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/7?lang=eng'
    quote: 'The graven images of their gods shall ye burn with fire: thou shalt not desire the silver or gold that is on them, nor take it unto thee, lest thou be snared therein'
  - where: 'note 14:12 “Burned, as the law commanded”'
    claim: 'Deut. 7:5 also commands burning graven images'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/7?lang=eng'
    quote: 'ye shall destroy their altars, and break down their images, and cut down their groves, and burn their graven images with fire.'
  - where: 'note 14:12 “Burned, as the law commanded”'
    claim: '1 Chr. 14:12 uses the verb saraph (H8313) with ba''esh, "with fire"'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: '<w lemma="c/8313" n="0.0" morph="HC/VNw3mp" id="13Nr9">וַ/יִּשָּׂרְפ֖וּ</w>'
  - where: 'note 14:12 “Burned, as the law commanded”'
    claim: 'Deut. 7:25 uses the same verb and phrase'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: '<w lemma="8313" morph="HVqi2mp/Sn" id="05MzY">תִּשְׂרְפ֣וּ/ן</w>'
  - where: 'note 14:12 “Burned, as the law commanded”'
    claim: 'Samuel (RV) says David and his men took them away; the law enjoined that graven images be burnt'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/14.htm'
    quote: 'In 2 Samuel 5:21 (R.V.) David and his men took them away. The Law (Deuteronomy 7:5; Deuteronomy 7:25) enjoined that graven images were to be burnt with fire.'
  - where: 'note 14:12 “Burned, as the law commanded”'
    claim: '1 Chr. 14:12 and Deut. 7:25 both have ba''esh, "with fire"'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: '<w lemma="b/784" n="0" morph="HRd/Ncbsa" id="13Njp">בָּ/אֵֽשׁ</w>'
  - where: 'note 14:12 “Burned, as the law commanded”'
    claim: 'Deut. 7:25 has ba''esh'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: '<w lemma="b/784" n="1" morph="HRd/Ncbsa" id="05kXM">בָּ/אֵ֑שׁ</w>'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'The Lord promises to go before those He sends'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'And whoso receiveth you, there I will be also, for I will go before your face. I will be on your right hand and on your left, and my Spirit shall be in your hearts, and mine angels round about you, to bear you up.'
  - where: 'explore'
    claim: 'Similar closing remarks on the fear of the LORD upon the nations in 2 Chronicles'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/14.htm'
    quote: 'For similar reflections, cf. 2 Chronicles 17:10; 2 Chronicles 20:29; 2 Chronicles 14:13'
  - where: 'explore'
    claim: 'Asa: the fear of the LORD came upon the cities'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/14?lang=eng'
    quote: 'for the fear of the Lord came upon them'
  - where: 'explore'
    claim: 'Jehoshaphat: the fear of God on all the kingdoms'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/20?lang=eng'
    quote: 'And the fear of God was on all the kingdoms of those countries, when they had heard that the Lord fought against the enemies of Israel.'
  - where: 'setting'
    claim: 'Samuel lists eleven sons born in Jerusalem, without Nogah and Elpalet'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/5?lang=eng'
    quote: 'Ibhar also, and Elishua, and Nepheg, and Japhia, And Elishama, and Eliada, and Eliphalet.'
  - where: 'setting'
    claim: 'Chronicles lists thirteen, with Elpalet and Nogah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/14?lang=eng'
    quote: 'And Ibhar, and Elishua, and Elpalet, And Nogah, and Nepheg, and Japhia,'
  - where: 'setting'
    claim: 'Samuel has David inquire of the LORD where Chronicles has God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/5?lang=eng'
    quote: 'And David inquired of the Lord, saying, Shall I go up to the Philistines?'
  - where: 'setting'
    claim: 'Chronicles has David inquire of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/14?lang=eng'
    quote: 'Therefore David inquired again of God; and God said unto him'
  - where: 'note 14:12 “Burned, as the law commanded”'
    claim: 'The Hebrew of 2 Sam. 5:21 says they carried the images away'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/5?lang=eng'
    quote: '21b “burned them”: HEB carried them away.'
  - where: 'explore'
    claim: 'Isaiah: the LORD shall rise up as in mount Perazim'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/28?lang=eng'
    quote: 'For the Lord shall rise up as in mount Perazim'
