chapter: 1
claims:
  - where: setting
    claim: 'Chronicles is one book in the Hebrew canon, a short history from the Creation to the proclamation of Cyrus'
    key: bd-chronicles
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/chronicles?lang=eng'
    quote: 'The two books of Chronicles counted as one in the Hebrew canon. They give a short history of events from the Creation down to the proclamation of Cyrus allowing the Jews to return to their homeland.'
  - where: setting
    claim: 'The Greek translation divided Chronicles into two volumes'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'Though originally written as a single work, Chronicles was divided into two separate volumes in the Greek translation of the Bible.'
  - where: setting
    claim: 'The first book closes with the end of David''s reign; the Hebrew name means "events of the days"'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/1.htm'
    quote: 'The first book closes, 1 Chronicles 29:29., with the end of the reign of David … verba, or more correctly res gestae dierum, events of the days'
  - where: setting
    claim: 'The Greek name marks the book as holding history not found in the earlier books'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/1.htm'
    quote: 'in order to mark more exactly the relation of our work to the earlier historical books of the Old Testament, as containing much historical information which is not to be found in them'
  - where: setting
    claim: 'The named sources were written by men generally of the prophetic order; with Samuel and Kings they were the material compiled; the writers dwell on religion and temple worship'
    key: bd-chronicles
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/chronicles?lang=eng'
    quote: 'writers living amid the events described, and generally of the prophetic order, recorded the history of their own times. These records along with Samuel and Kings formed the material out of which our books of Chronicles were compiled, the compilers choosing such portions as suited the purpose of their composition.'
  - where: setting
    claim: 'The writers dwell on the religious aspects and the temple worship in Jerusalem'
    key: bd-chronicles
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/chronicles?lang=eng'
    quote: 'the writers dwell with most satisfaction upon the ecclesiastical and religious aspects of the history, and the progress of temple worship in Jerusalem'
  - where: setting
    claim: 'Author uncertain; most scholars date it after the exile, possibly in the fourth century BC'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'The authorship of Chronicles remains uncertain, but most scholars suggest that the books were likely written after the Babylonian exile, possibly in the fourth century BC.'
  - where: setting
    claim: 'Ezra–Nehemiah may be regarded as a sequel to Chronicles'
    key: bd-chronicles
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/chronicles?lang=eng'
    quote: 'The books of Ezra and Nehemiah, originally forming one book in the Hebrew canon, may be regarded as a sequel to 1 and 2 Chr.'
  - where: setting
    claim: 'Chronicles assumes its readers know Samuel and Kings and leaves out David''s struggles with Saul, Bath-sheba and his family trials'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'It appears that the author or authors of Chronicles assumed that readers would be familiar with the books of Samuel and Kings. Chronicles leaves out, for example, David’s struggles with Saul, his sin with Bathsheba, and other family trials'
  - where: setting
    claim: 'Chronicles keeps the word that David shed blood and could not build'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/22?lang=eng'
    quote: 'Thou hast shed blood abundantly, and hast made great wars: thou shalt not build an house unto my name'
  - where: setting
    claim: 'Kings asks why God let the nation and temple be destroyed; Chronicles whether they are still God''s people and the covenant stands'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'In contrast, the question Chronicles appears to address is “Are we still God''s people and does the covenant still stand?" The Chronicler writes to give hope, to create an identity based on worship and the ideals of the kingdom'
  - where: setting
    claim: 'The question of Joshua–2 Kings'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'appears to address is "Why did God let our nation get destroyed and our temple burned?"'
  - where: when
    claim: 'Written after the exile'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'most scholars suggest that the books were likely written after the Babylonian exile'
  - where: thread
    claim: 'Chapter 1 lists the generations from Adam to Abraham and his sons from Genesis, to connect Israel''s tribal ancestors with the peoples of the earth'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/1.htm'
    quote: 'In order to show the connection of the tribal ancestors of Israel with the peoples of the earth, in 1 Chronicles 1 are enumerated the generations of the primeval world, from Adam till the Flood, and those of the post-diluvians to Abraham and his sons, according to the accounts in Genesis'
  - where: thread
    claim: 'Verses 1–4 are bare names, with no link; the reader is assumed to know Genesis'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/1.htm'
    quote: 'grouped together without any link of connection whatever: it is assumed as known from Genesis, that the first ten names denote generations succeeding one another, and that the last three, on the contrary, are the names of brethren.'
  - where: thread
    claim: 'The Chronicler compresses Genesis to the smallest limits'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/1.htm'
    quote: 'These verses are compressed within the smallest limits from Genesis 11:10-26. For another example of this extreme compression compare 1 Chronicles 1:1-4.'
  - where: thread
    claim: 'Chapter 1 groups Adam to Abraham, Isaac and his sons Edom and Israel, with Edom''s posterity; the sons of Israel follow'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/1.htm'
    quote: '(1) The families of primeval and ancient times, from Adam to the patriarchs Abraham, Isaac, and his sons Edom and Israel, together with the posterity of Edom (1 Chronicles 1); (2) the sons of Israel and the families of Judah'
  - where: note 1:1 “Why the history begins with Adam”
    claim: 'Chapters 1–9 are genealogies; chapter 10 tells Saul''s death'
    key: gs-chronicles
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/chronicles?lang=eng'
    quote: 'Chapters 1–9 list genealogies from Adam to Saul. Chapter 10 chronicles the death of Saul.'
  - where: note 1:1 “Why the history begins with Adam”
    claim: 'A genealogy of the Lord''s people from Adam to the Babylonian captivity'
    key: ot-seminary-lesson-102
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-books-of-1-and-2-chronicles/lesson-102-1-and-2-chronicles?lang=eng'
    quote: 'this book provides a genealogy of the Lord’s people from the time of Adam to the time of the Babylonian captivity'
  - where: note 1:1 “Why the history begins with Adam”
    claim: 'Biblical genealogies start at the beginning and run to the present'
    key: sc-knowhy-235
    url: 'https://scripturecentral.org/knowhy/why-does-the-book-of-ether-begin-with-such-a-long-genealogy'
    quote: 'Genealogies in the Bible usually start at the beginning and document descendants until arriving in the present.'
  - where: note 1:1 “Why the history begins with Adam”
    claim: 'Where offices or blessings belong to families, genealogies matter: priest from Aaron, Messiah from David, Jew from Abraham; Ezra 2:62 among the genealogies'
    key: bd-genealogy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genealogy?lang=eng'
    quote: 'Where certain offices or blessings are restricted to particular families, genealogies become of great importance; for example, a priest must be able to show his descent from Aaron, the Messiah from David, while every Jew must be able to show his descent from Abraham.'
  - where: note 1:1 “Why the history begins with Adam”
    claim: 'The lists end with all Israel reckoned by genealogies and carried to Babylon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/9?lang=eng'
    quote: 'So all Israel were reckoned by genealogies; and, behold, they were written in the book of the kings of Israel and Judah, who were carried away to Babylon for their transgression.'
  - where: note 1:3 “Sheth, Jered and Henoch are Seth, Jared and Enoch”
    claim: 'Sheth in 1 Chr. 1:1 is the same Hebrew name (H8352) as Seth in Gen. 5:3'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: 'שֵׁ֖ת'
  - where: note 1:3 “Sheth, Jered and Henoch are Seth, Jared and Enoch”
    claim: 'Seth in Gen. 5:3 is lemma H8352; Enoch in Gen. 5:21 is H2585; Jared in Gen. 5:18 is H3382'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'חֲנ֔וֹךְ'
  - where: note 1:3 “Sheth, Jered and Henoch are Seth, Jared and Enoch”
    claim: 'Henoch in 1 Chr. 1:3 is lemma H2585, Jered in 1:2 is H3382'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: 'חֲנ֥וֹךְ'
  - where: note 1:3 “Sheth, Jered and Henoch are Seth, Jared and Enoch”
    claim: 'Genesis spells the names after Seth as Enos and Cainan, where 1 Chr. 1:1–2 has Enosh and Kenan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/5?lang=eng'
    quote: 'And Enos lived ninety years, and begat Cainan:'
  - where: note 1:1 “Why the history begins with Adam”
    claim: 'The lists end with the families who dwelt in Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/9?lang=eng'
    quote: 'And in Jerusalem dwelt of the children of Judah, and of the children of Benjamin, and of the children of Ephraim, and Manasseh;'
  - where: note 1:1 “Why the history begins with Adam”
    claim: 'The Chronicler appears to write to create an identity based on worship and the kingdom'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'The Chronicler writes to give hope, to create an identity based on worship and the ideals of the kingdom'
  - where: note 1:1 “Why the history begins with Adam”
    claim: 'David''s line is given in chapter 3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/3?lang=eng'
    quote: 'Now these were the sons of David, which were born unto him in Hebron'
  - where: note 1:1 “Why the history begins with Adam”
    claim: 'Aaron''s line is given in chapter 6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/6?lang=eng'
    quote: 'The sons also of Aaron; Nadab, and Abihu, Eleazar, and Ithamar.'
  - where: setting
    claim: 'Chronicles keeps Uzza''s death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/13?lang=eng'
    quote: 'And the anger of the LORD was kindled against Uzza, and he smote him, because he put his hand to the ark: and there he died before God.'
  - where: setting
    claim: 'Chronicles keeps the plague after the census'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/21?lang=eng'
    quote: 'So the LORD sent pestilence upon Israel: and there fell of Israel seventy thousand men.'
  - where: christ
    claim: 'Luke''s genealogy runs through Phalec, Heber and Sala'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/3?lang=eng'
    quote: 'which was the son of Phalec, which was the son of Heber, which was the son of Sala,'
  - where: christ
    claim: 'Luke''s genealogy ends with Enos, Seth, Adam and God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/3?lang=eng'
    quote: 'Which was the son of Enos, which was the son of Seth, which was the son of Adam, which was the son of God.'
  - where: note 1:28 “Isaac named first, followed last”
    claim: 'Isaac named first as the son of promise, then Ishmael''s posterity, Keturah''s sons, and finally Isaac''s sons'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/1.htm'
    quote: 'In 1 Chronicles 1:28 only Isaac and Ishmael are so called; Isaac first, as the son of the promise. Then, in 1 Chronicles 1:29-31, follow the posterity of Ishmael'
  - where: note 1:28 “Isaac named first, followed last”
    claim: 'Verse 34 resumes with "Abraham begat Isaac" as Gen. 25:19 does; the lists come from Genesis 25'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/1.htm'
    quote: 'But here the continuation of the genealogy of Abraham is prefaced by the remark that Abraham begat Isaac, just as in Genesis 25:19'
  - where: note 1:28 “Isaac named first, followed last”
    claim: 'Genesis opens Isaac''s generations with the same words'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/25?lang=eng'
    quote: 'And these are the generations of Isaac, Abraham’s son: Abraham begat Isaac:'
  - where: christ
    claim: 'Matthew descends from Abraham for Jewish readers; Luke ascends from Jesus to Adam and to God, for the world in general'
    key: bd-genealogy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genealogy?lang=eng'
    quote: 'that in Matt. 1:1–17 descends from Abraham to Jesus, being intended for Jewish readers; while that in Luke 3:23–38 ascends from Jesus to Adam, and to God, this Gospel being written for the world in general'
  - where: christ
    claim: 'Luke''s genealogy runs through Phalec, Heber, Sala and Mathusala, Enoch, Jared'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/3?lang=eng'
    quote: 'Which was the son of Mathusala, which was the son of Enoch, which was the son of Jared, which was the son of Maleleel, which was the son of Cainan,'
  - where: christ
    claim: 'Members do vicarious temple ordinances for ancestors; the dead must be identified (D&C 127–128)'
    key: bd-genealogy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genealogy?lang=eng'
    quote: 'Members of the Church are privileged to do vicarious ordinance work in the temple for their deceased ancestors, who, they believe, would have received the gospel if they had had the opportunity in this life. In order to do this, the dead must be properly identified.'
