chapter: 26
claims:
  - where: 'setting'
    claim: 'The chapter heading: porters, treasures, officers and judges, outward business'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/26?lang=eng'
    quote: 'The Levites are assigned as porters—They have charge of the treasures, serve as officers and judges, and conduct the outward business pertaining to the Israelites.'
  - where: 'setting'
    claim: 'Chronicles describes the temple personnel at length, the porters especially in chapters 9 and 26'
    key: shannon-guarded
    url: 'https://rsc.byu.edu/ascending-mountain-lord/come-near-unto-me-guarded-space-its-mediators-jerusalem-temple'
    quote: 'One of the types of personnel mentioned particularly in 1 Chronicles chapters 9 and 26 is the shoʽar, which is translated in the King James Version as “porters.”'
  - where: 'when'
    claim: 'The fortieth year of David''s reign'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/26?lang=eng'
    quote: 'In the fortieth year of the reign of David they were sought for, and there were found among them mighty men of valour at Jazer of Gilead.'
  - where: 'thread'
    claim: 'The work moves from the gates to the outward business over Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/26?lang=eng'
    quote: 'Of the Izharites, Chenaniah and his sons were for the outward business over Israel, for officers and judges.'
  - where: 'section 2 plain'
    claim: 'Asuppim rendered “storehouse”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Chronicles+26&version=NRSVUE'
    quote: 'Obed-edom’s came out for the south, and to his sons was allotted the storehouse.'
  - where: 'section 4 plain'
    claim: 'Outside duties for Israel; search was made in the fortieth year'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Chronicles+26&version=NRSVUE'
    quote: 'Chenaniah and his sons were appointed to outside duties for Israel, as officers and judges.'

  - where: 'note 26:1 “Gatekeepers of the house”'
    claim: 'Porter translates shoʽar, gatekeeper, from the root of shaʽar, gate; they controlled access through the gates'
    key: shannon-guarded
    url: 'https://rsc.byu.edu/ascending-mountain-lord/come-near-unto-me-guarded-space-its-mediators-jerusalem-temple'
    quote: 'The New Revised Standard Version has “gatekeepers,” a translation which better represents in Modern English the sense of the Hebrew word, which shares the same root as the Hebrew word for “gate,” shaʽar. These officers were therefore responsible for maintaining the boundaries within the temple'
  - where: 'note 26:1 “Gatekeepers of the house”'
    claim: 'Gatekeepers mediate who may enter; the unprepared kept out, the prepared admitted'
    key: shannon-guarded
    url: 'https://rsc.byu.edu/ascending-mountain-lord/come-near-unto-me-guarded-space-its-mediators-jerusalem-temple'
    quote: 'The Lord does not create borders and guardians in order to merely keep people out—rather, the gatekeepers are there to mediate who may and may not enter into God’s presence.'
  - where: 'note 26:1 “Gatekeepers of the house”'
    claim: 'They were a kind of temple police and were trusted with temple funds (2 Kgs. 22:4; 1 Chr. 9:26–27)'
    key: shannon-guarded
    url: 'https://rsc.byu.edu/ascending-mountain-lord/come-near-unto-me-guarded-space-its-mediators-jerusalem-temple'
    quote: 'They served, for example, as kind of a police force for the temple. They also oversaw physical aspects of the day-to-day running of the temple, as may be seen by their appearance in 2 Kings 22:4, where they are entrusted with temple funds'
  - where: 'note 26:1 “Gatekeepers of the house”'
    claim: 'The doorkeeper of Ps. 84:10 is a different word; that office was important'
    key: shannon-guarded
    url: 'https://rsc.byu.edu/ascending-mountain-lord/come-near-unto-me-guarded-space-its-mediators-jerusalem-temple'
    quote: 'The difference in vocabulary, however, suggests that this verse does not refer to the specific office of gatekeepers in the temple, for that office served an important role in the practice and ritual of the Israelite temple.'
  - where: 'note 26:1 “Gatekeepers of the house”'
    claim: 'The Korahites were keepers of the gates of the tabernacle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/9?lang=eng'
    quote: 'the Korahites, were over the work of the service, keepers of the gates of the tabernacle: and their fathers, being over the host of the Lord, were keepers of the entry.'

  - where: 'note 26:1 “Asaph, or Ebiasaph?”'
    claim: 'Read Ebiasaph, per 9:19: the Korahites are from Kohath, Asaph from Gershon'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/26.htm'
    quote: 'Instead of אסף מן־בּני we should read, according to 1 Chronicles 9:19, אביסף מן־בּני, for the Korahites are descended from Kohath (Exodus 6:21; Exodus 18:16), but Asaph is a descendant of Gershon (1 Chronicles 6:39.).'
  - where: 'note 26:1 “Asaph, or Ebiasaph?”'
    claim: 'Chapter 9 gives the same family as Kore son of Ebiasaph son of Korah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/9?lang=eng'
    quote: 'And Shallum the son of Kore, the son of Ebiasaph, the son of Korah, and his brethren, of the house of his father, the Korahites'

  - where: 'note 26:5 “For God blessed him”'
    claim: 'The LORD blessed the house of Obed-edom while the ark stayed there (the Church footnote at 26:5 points to 13:14)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/13?lang=eng'
    quote: 'And the ark of God remained with the family of Obed-edom in his house three months. And the Lord blessed the house of Obed-edom, and all that he had.'
  - where: 'note 26:5 “For God blessed him”'
    claim: 'Eight sons, for God blessed him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/26?lang=eng'
    quote: 'Ammiel the sixth, Issachar the seventh, Peulthai the eighth: for God blessed him.'

  - where: 'note 26:13 “A watch on every side”'
    claim: 'The porters cast lots for every gate, small and great'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/26?lang=eng'
    quote: 'And they cast lots, as well the small as the great, according to the house of their fathers, for every gate.'
  - where: 'note 26:13 “A watch on every side”'
    claim: 'The four quarters of 9:24 are detailed in 26:13–19; whatever direction one approaches the Lord''s presence, one meets a gatekeeper'
    key: shannon-guarded
    url: 'https://rsc.byu.edu/ascending-mountain-lord/come-near-unto-me-guarded-space-its-mediators-jerusalem-temple'
    quote: 'This is described in further detail in 1 Chronicles 26:13–19, where several gatekeepers are set in the various directions. … no matter what direction one approaches the presence of the Lord, one is met by a gatekeeper'
  - where: 'note 26:13 “A watch on every side”'
    claim: 'The fourfold placing is a symbol of an ordered cosmos with the temple at its center (Shannon''s reading)'
    key: shannon-guarded
    url: 'https://rsc.byu.edu/ascending-mountain-lord/come-near-unto-me-guarded-space-its-mediators-jerusalem-temple'
    quote: 'having gatekeepers stationed at each of the “four quarters,” representing the four cardinal directions, creates a powerful symbol of the ordered cosmos and places the temple at the center of that cosmos.'

  - where: 'note 26:15 “Asuppim, Shallecheth and Parbar”'
    claim: 'Asuppim is a storehouse for temple goods near the south gate'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/26.htm'
    quote: 'i.e., house of collections or provisions (cf. Nehemiah 12:25), we can say nothing further than that it was a building used for the storing of the temple goods, situated in the neighbourhood of the southern door of the temple in the external court'
  - where: 'note 26:15 “Asuppim, Shallecheth and Parbar”'
    claim: 'A modern translation renders it “the storehouse”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Chronicles+26&version=NRSVUE'
    quote: 'Obed-edom’s came out for the south, and to his sons was allotted the storehouse.'
  - where: 'note 26:15 “Asuppim, Shallecheth and Parbar”'
    claim: 'Shuppim is probably an accidental repetition of Asuppim'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/26.htm'
    quote: 'The word “Shuppim” (LXX. B, εἰς δεύτερον) seems to be an accidental repetition (in a corrupt form) of “Asuppim” (1 Chronicles 26:15), and so should be omitted from the text.'
  - where: 'note 26:15 “Asuppim, Shallecheth and Parbar”'
    claim: 'Shallecheth appears nowhere else; the margin gives “casting forth”'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/26.htm'
    quote: 'R.V. Hosah westward, by the gate of Shallecheth (mg. “casting forth”), at the causeway that goeth up. There is no other mention in the Bible of a gate “Shallecheth,”'
  - where: 'note 26:15 “Asuppim, Shallecheth and Parbar”'
    claim: 'The causeway led from the lower city up to the temple site'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/26.htm'
    quote: 'העולה המסלּה is the way which led from the lower city up to the more lofty temple site.'
  - where: 'note 26:15 “Asuppim, Shallecheth and Parbar”'
    claim: 'Parbar is probably the parvarim of 2 Kgs. 23:11, a building on the temple area''s west side, perhaps a colonnade'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/26.htm'
    quote: 'This word, apparently the same as parvarim, 2 Kings 23:11 (R.V. “precincts”; cp. R.V. mg. here), seems to denote some building built on the Temple area on the west side. It may have been a colonnade.'
  - where: 'note 26:15 “Asuppim, Shallecheth and Parbar”'
    claim: 'Parbar is of uncertain meaning, an out-building on the western side'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/26.htm'
    quote: 'probably identical with פּרורים, 2 Kings 23:11, a word of uncertain meaning, was the name of an out-building on the western side, the back of the outer court of the temple by the door Shallecheth'

  - where: 'note 26:28 “What Samuel, Saul, Abner and Joab had dedicated”'
    claim: 'Everything dedicated by Samuel, Saul, Abner, Joab and anyone else was under Shelomith'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/26?lang=eng'
    quote: 'And all that Samuel the seer, and Saul the son of Kish, and Abner the son of Ner, and Joab the son of Zeruiah, had dedicated; and whosoever had dedicated any thing, it was under the hand of Shelomith, and of his brethren.'
  - where: 'note 26:28 “What Samuel, Saul, Abner and Joab had dedicated”'
    claim: 'Solomon brought what David had dedicated into the treasures of the finished house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/7?lang=eng'
    quote: 'And Solomon brought in the things which David his father had dedicated; even the silver, and the gold, and the vessels, did he put among the treasures of the house of the Lord.'

  - where: 'note 26:29 “Levites at work outside the house”'
    claim: 'Six thousand Levites were officers and judges'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/23?lang=eng'
    quote: 'Of which, twenty and four thousand were to set forward the work of the house of the Lord; and six thousand were officers and judges:'
  - where: 'note 26:29 “Levites at work outside the house”'
    claim: 'A modern translation: outside duties for Israel; oversight for the work of the LORD and the service of the king'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Chronicles+26&version=NRSVUE'
    quote: 'had the oversight of Israel west of the Jordan for all the work of the Lord and for the service of the king.'

  - where: 'note 26:31 “The fortieth year”'
    claim: 'David reigned forty years'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/29?lang=eng'
    quote: 'And the time that he reigned over Israel was forty years; seven years reigned he in Hebron, and thirty and three years reigned he in Jerusalem.'
  - where: 'note 26:31 “The fortieth year”'
    claim: 'Search was made by genealogy in the fortieth year, and able men found at Jazer'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Chronicles+26&version=NRSVUE'
    quote: '(In the fortieth year of David’s reign search was made of whatever genealogy or family and men of great ability among them were found at Jazer in Gilead.)'

  - where: 'christ'
    claim: 'All gatekeepers represent the final gatekeeper, the Lord, who employs no servant there; only Christ fully mediates'
    key: shannon-guarded
    url: 'https://rsc.byu.edu/ascending-mountain-lord/come-near-unto-me-guarded-space-its-mediators-jerusalem-temple'
    quote: 'Ultimately, all of these gatekeepers serve as representatives of the final gatekeeper, whom Jacob identifies as the Lord of Hosts himself. … In the end, only Jesus Christ is able to fully mediate for us and bring us finally into the presence of God.'
  - where: 'christ'
    claim: 'Jacob: the keeper of the gate is the Holy One of Israel, who employs no servant there'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/9?lang=eng'
    quote: 'and the keeper of the gate is the Holy One of Israel; and he employeth no servant there; and there is none other way save it be by the gate; for he cannot be deceived'
  - where: 'christ'
    claim: 'Modern temples have gatekeepers who check a recommend from ecclesiastical authorities'
    key: shannon-guarded
    url: 'https://rsc.byu.edu/ascending-mountain-lord/come-near-unto-me-guarded-space-its-mediators-jerusalem-temple'
    quote: 'In order to enter the temple, modern worshipper must first prove his ethical worthiness by presenting a document from their ecclesiastical authorities, recommending they be allowed to enter.'
  - where: 'note 26:1 “Gatekeepers of the house”'
    claim: 'The keepers share the root used of the cherubim guarding in Genesis 3'
    key: shannon-guarded
    url: 'https://rsc.byu.edu/ascending-mountain-lord/come-near-unto-me-guarded-space-its-mediators-jerusalem-temple'
    quote: 'The Hebrew root translated here as “keepers” (shamar) is the same as that used of the cherubim in Genesis 3, which, as we have already seen, indicates guarding or protecting in addition to being responsible for something.'
  - where: 'note 26:15 “Asuppim, Shallecheth and Parbar”'
    claim: 'Shuppim probably came in by repeating the last syllables of the preceding word'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/26.htm'
    quote: 'The word לשׁפּים is unintelligible, and probably has come into the text merely by a repetition of the two last syllables of the preceding word'
  - where: 'note 26:29 “Levites at work outside the house”'
    claim: 'A modern translation renders the outward business as outside duties for Israel'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Chronicles+26&version=NRSVUE'
    quote: 'Chenaniah and his sons were appointed to outside duties for Israel, as officers and judges.'
  - where: 'note 26:31 “The fortieth year”'
    claim: 'The Hebronites were reckoned by the generations of their fathers, and sought for in the fortieth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/26?lang=eng'
    quote: 'Among the Hebronites was Jerijah the chief, even among the Hebronites, according to the generations of his fathers.'
  - where: 'thread'
    claim: 'The lots were cast for every gate, small and great alike'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/26?lang=eng'
    quote: 'And they cast lots, as well the small as the great, according to the house of their fathers, for every gate.'
