chapter: 21
claims:
  - where: 'setting'
    claim: 'The census and plague are told also in 2 Samuel 24'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/21?lang=eng'
    quote: '1b “provoked”: 2 Sam. 24:1 (1–25).'
  - where: 'setting'
    claim: 'Chronicles records only the results of the numbering, adds that Levi and Benjamin were not included, and gives a fuller account of David''s offering at the threshing floor than Samuel'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/21.htm'
    quote: 'in the Chronicle, 1 Chronicles 21:4-6, only the results are recorded, with the remark that Joab did not complete the numbering, Levi and Benjamin not being included … the Chronicle, in 1 Chronicles 21:19-27, narrates the purchase of Araunah''s threshing-floor for a place of sacrifice, and gives … a more circumstantial account'
  - where: 'setting'
    claim: 'The description of the angel and the elders in sackcloth, Ornan''s sons hiding, and the fire from heaven are details Chronicles preserves that Samuel passes over'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/21.htm'
    quote: 'In 1 Chronicles 21:16, the description of the angel''s appearance, that he had a drawn sword in his hand stretched out over Jerusalem, and the statement that David and the elders, clad in sackcloth … in 1 Chronicles 21:20, the mention of Ornan''s (Araunah''s) sons, who hid themselves'
  - where: 'setting'
    claim: 'Samuel offers seven years of famine'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/24?lang=eng'
    quote: 'Shall seven years of famine come unto thee in thy land?'
  - where: 'setting'
    claim: 'The compilers chose what suited their purpose and dwelt on the religious aspects and the progress of temple worship'
    key: bd-chronicles
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/chronicles?lang=eng'
    quote: 'the compilers choosing such portions as suited the purpose of their composition. Though secular events are not excluded from the compilations thus formed, the writers dwell with most satisfaction upon the ecclesiastical and religious aspects of the history, and the progress of temple worship in Jerusalem.'
  - where: 'thread'
    claim: 'On an older reading the Chronicler told the story to show how God chose and consecrated the spot as the future place of worship, by the angel, the command through Gad, and fire on the offering'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/21.htm'
    quote: 'with the design of showing how God Himself had chosen and consecrated this spot to be the future place of worship for Israel, by the appearance of the angel, the command given to David through the prophet Gad to build an altar where the angel had appeared'
  - where: 'thread'
    claim: '21:28 runs into 22:1, with 21:29–30 a parenthesis; the chapter division is unfortunate; David took his answered plea as a sign that this was God''s approved site for the temple'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/21.htm'
    quote: 'Ch. 1 Chronicles 21:28 is a protasis to which ch. 1 Chronicles 22:1 is the apodosis, 1 Chronicles 21:29-30 of ch. 21 being a parenthesis. The division of chapters here is unfortunate. … David regarded the success of his intercession at the floor of Ornan as an indication that this floor was God’s approved site for the Temple.'
  - where: 'note 21:1 “Satan, where Samuel has the LORD”'
    claim: 'The Church''s footnote at 2 Sam. 24:1 says something is apparently missing and that Satan should be the antecedent of "he", pointing to 1 Chr. 21:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/24?lang=eng'
    quote: '1a “he”: Apparently something is missing, and “Satan” should be the antecedent of “he.” See 1 Chr. 21:1.'
  - where: 'note 21:1 “Satan, where Samuel has the LORD”'
    claim: 'The footnote on "Satan" at this verse points to the Topical Guide, Devil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/21?lang=eng'
    quote: '1a “Satan”: TG Devil.'
  - where: 'note 21:1 “Satan, where Samuel has the LORD”'
    claim: 'The Hebrew at 1 Chr. 21:1 is śāṭān without the article'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: '<w lemma="7854" n="1.0" morph="HNcmsa" id="13Fdw">שָׂטָ֖ן</w>'
  - where: 'note 21:1 “Satan, where Samuel has the LORD”'
    claim: 'Job 1:6 has the word with the article, "the satan"'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: '<w lemma="d/7854" n="0.0" morph="HTd/Ncmsa" id="18QwM">הַ/שָּׂטָ֖ן</w>'
  - where: 'note 21:1 “Satan, where Samuel has the LORD”'
    claim: 'Zech. 3:1 has the word with the article'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: '<w lemma="c/d/7854" n="0.0.0" morph="HC/Td/Ncmsa" id="388Js">וְ/הַ/שָּׂטָ֛ן</w>'
  - where: 'note 21:1 “Satan, where Samuel has the LORD”'
    claim: 'śāṭān means adversary and is also the name of the superhuman adversary of God'
    key: bdb
    url: 'https://biblehub.com/hebrew/7854.htm'
    quote: 'adversary, also the name of the superhuman adversary of God'
  - where: 'note 21:3 “A cause of trespass to Israel”'
    claim: '"Trespass" in 21:3 is ʾašmâ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: '<w lemma="l/819" n="0.0" morph="HR/Ncfsa" id="13CzW">לְ/אַשְׁמָ֖ה</w>'
  - where: 'note 21:3 “A cause of trespass to Israel”'
    claim: 'ʾašmâ means wrongdoing, guiltiness'
    key: bdb
    url: 'https://biblehub.com/hebrew/819.htm'
    quote: 'wrongdoing, guiltiness'
  - where: 'note 21:3 “A cause of trespass to Israel”'
    claim: 'The text: God smote Israel, seventy thousand died, and David asks that the hand be not on the people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/21?lang=eng'
    quote: 'And God was displeased with this thing; therefore he smote Israel.'
  - where: 'note 21:6 “Levi and Benjamin not counted”'
    claim: 'Num. 1:49 forbids numbering Levi, i.e. as liable to military service; the Levites were numbered separately; Samuel has nothing corresponding to this verse'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/21.htm'
    quote: '6. Levi] In Numbers 1:49 it is ordained that Levi is not to be numbered among the children of Israel, i.e. treated as liable to military service. The Levites were, however, numbered separately; Numbers 3:15; Numbers 26:57. in 2 Sam. there is nothing to correspond with this verse.'
  - where: 'note 21:6 “Levi and Benjamin not counted”'
    claim: 'On Keil''s reading Benjamin was not numbered because David, conscious of his sin, stopped the count before it was complete'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/21.htm'
    quote: 'the tribe of Levi was by law (cf. Numbers 1:47-54) exempted from the censuses of the people taken for political purposes; and the tribe of Benjamin was not numbered, because David, having become conscious of his sin, stopped the numbering before it was completed'
  - where: 'note 21:6 “Levi and Benjamin not counted”'
    claim: 'Chronicles later says Joab began to number but did not finish'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/27?lang=eng'
    quote: 'Joab the son of Zeruiah began to number, but he finished not, because there fell wrath for it against Israel'
  - where: 'note 21:15 “Who repented? The Joseph Smith Translation”'
    claim: 'The JST of 1 Chr. 21:15: the Lord beheld Israel, that he repented him of the evil; therefore the Lord stayed the angel'
    key: jst-1-chr-21
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-1-chr/21?lang=eng'
    quote: 'and God said to the angel, Stay now thine hand, it is enough; for as he was destroying, the Lord beheld Israel, that he repented him of the evil; therefore the Lord stayed the angel that destroyed'
  - where: 'note 21:15 “Who repented? The Joseph Smith Translation”'
    claim: 'The footnote at 2 Sam. 24:16 gives the JST there ("for the people repented") and says the Hebrew root means "to sigh," therefore "to feel sorrow"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/24?lang=eng'
    quote: 'The Hebrew root means “to sigh,” therefore “to feel sorrow.” Gen. 6:6; 1 Sam. 15:11; Joel 2:13. See also 1 Chr. 21:15. JST 2 Sam. 24:16 … the Lord said unto him, Stay now thine hand, it is enough; for the people repented, and the Lord stayed the hand of the angel'
  - where: 'note 21:15 “Who repented? The Joseph Smith Translation”'
    claim: 'Nyman: three changes in 1 Chronicles, word changes for readability; this one also corrects the concept of the Lord repenting'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'There are three changes, all of which are, like those in 2 Kings, word changes to make it more readable. One of these changes, however, also corrects the concept of the Lord repenting'
  - where: 'note 21:25 “Six hundred shekels of gold”'
    claim: 'On Cambridge''s reading Chronicles prices the floor alone and Samuel the floor and oxen; Samuel''s text is probably corrupt and may once have given both sums; the threshing floor seems to have included the Temple Mount'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/21.htm'
    quote: 'The former seems to say that 600 shekels were paid for the threshing floor alone, the latter that only 50 shekels were paid for the floor and oxen taken together. But the text of 2 Sam. is probably corrupt and should perhaps run, bought the threshing floor for money, even six hundred shekels, and the oxen for money, even fifty shekels. The “threshing floor” seems to have included the Temple Mount'
  - where: 'note 21:25 “Six hundred shekels of gold”'
    claim: 'The footnote on 21:25 points to 2 Sam. 24:24 for the other price'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/21?lang=eng'
    quote: '25a “six hundred”: 2 Sam. 24:24.'
  - where: 'note 21:26 “Answered from heaven by fire”'
    claim: 'The Church''s footnote on "fire" points to Lev. 9:24 and 2 Chr. 7:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/21?lang=eng'
    quote: '26b “fire”: Lev. 9:24; 2 Chr. 7:1.'
  - where: 'note 21:29 “Why David sacrificed at Ornan’s floor”'
    claim: 'The footnotes on 21:29 point to the tabernacle at Gibeon in 1 Chr. 16:39 and 1 Kgs. 3:4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/21?lang=eng'
    quote: '29a “tabernacle”: 1 Chr. 16:39.'
  - where: 'note 21:29 “Why David sacrificed at Ornan’s floor”'
    claim: 'David left Zadok and the priests before the tabernacle at Gibeon to offer the burnt offerings'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/16?lang=eng'
    quote: 'And Zadok the priest, and his brethren the priests, before the tabernacle of the LORD in the high place that was at Gibeon, To offer burnt offerings unto the LORD upon the altar of the burnt offering continually morning and evening'
  - where: 'note 21:29 “Why David sacrificed at Ornan’s floor”'
    claim: 'Bowen: sacrifice at this site arrested the slaughter, and the temple had to be built there; the angel''s theophany indicated where the Lord wanted the temple built'
    key: bowen-mount-lord-provided
    url: 'https://interpreterfoundation.org/journal/in-the-mount-of-the-lord-it-shall-be-seen-and-provided-theophany-and-sacrifice-as-the-etiological-foundation-of-the-temple-in-israelite-and-latter-day-saint-tradit'
    quote: 'not only was vicarious sacrifice at this specific site necessary for the slaughter of Israel and Jerusalem to be permanently “arrested,” but the temple had to be built at this specific site, hence the “theophany” of the destroying angel indicating where the Lord wanted the temple built.'
  - where: 'note 21:29 “Why David sacrificed at Ornan’s floor”'
    claim: 'Theophany is seeing a manifestation of God; the threshing floor points to the temple site as the place of theophany and sacrifice'
    key: bowen-mount-lord-provided
    url: 'https://interpreterfoundation.org/journal/in-the-mount-of-the-lord-it-shall-be-seen-and-provided-theophany-and-sacrifice-as-the-etiological-foundation-of-the-temple-in-israelite-and-latter-day-saint-tradit'
    quote: 'the threshing-floor of Araunah/Ornan, these pointing to the future location of the Jerusalem temple as the place of theophany and sacrifice par excellence'
  - where: 'christ'
    claim: 'Bowen: the Lord arrests the slaughter at the future temple site; David intercedes; Jesus, one of David''s father''s house, later suffers and dies near this site for David''s sins and all humanity''s'
    key: bowen-mount-lord-provided
    url: 'https://interpreterfoundation.org/journal/in-the-mount-of-the-lord-it-shall-be-seen-and-provided-theophany-and-sacrifice-as-the-etiological-foundation-of-the-temple-in-israelite-and-latter-day-saint-tradit'
    quote: 'Jesus, one of David’s “father’s house,” later suffers and dies very near this site both for David’s sins and the sins of all humanity'
  - where: 'christ'
    claim: 'Bowen: the temple''s sacrifices anticipated Jesus''s "un-arrested" sacrifice'
    key: bowen-mount-lord-provided
    url: 'https://interpreterfoundation.org/journal/in-the-mount-of-the-lord-it-shall-be-seen-and-provided-theophany-and-sacrifice-as-the-etiological-foundation-of-the-temple-in-israelite-and-latter-day-saint-tradit'
    quote: 'Isaac’s arrested sacrifice and the vicarious animal sacrifices of the temple anticipated Jesus’s later “un-arrested” sacrifice'
  - where: 'explore'
    claim: 'Bowen follows theophany and sacrifice from Isaac to latter-day temples'
    key: bowen-mount-lord-provided
    url: 'https://interpreterfoundation.org/journal/in-the-mount-of-the-lord-it-shall-be-seen-and-provided-theophany-and-sacrifice-as-the-etiological-foundation-of-the-temple-in-israelite-and-latter-day-saint-tradit'
    quote: 'These narratives also help us better understand events pertaining to the establishment of latter-day temples, beginning with the Kirtland Temple'
