chapter: 3
claims:
  # ---- when / setting / thread ----
  - where: 'when'
    claim: 'Chronicles was written after the Babylonian exile'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'The authorship of Chronicles remains uncertain, but most scholars suggest that the books were likely written after the Babylonian exile, possibly in the fourth century BC.'
  - where: 'setting'
    claim: 'Chapter 3 takes up again the line of Ram, traced in 2:10–17 only to Jesse'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/3.htm'
    quote: 'the genealogy of Ram the second son of Hezron, which in 1 Chronicles 2:10-17 was only traced down to Jesse, the father of the royal race of David, is in 1 Chronicles 3 again taken up and further followed out.'
  - where: 'setting'
    claim: 'The chapter falls into four parts: David''s sons, the kings to Jeconiah and Zedekiah, Jeconiah''s descendants to Zerubbabel''s grandsons, Shechaniah''s descendants to the fourth generation'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/3.htm'
    quote: 'In 1 Chronicles 3:1-9 all the sons of David are enumerated; in 1 Chronicles 3:10-16, the line of kings of the house of David from Solomon to Jeconiah and Zedekiah; in 1 Chronicles 3:17-21, the descendants of Jeconiah to the grandsons of Zerubbabel; and finally, in 1 Chronicles 3:22-24 …'
  - where: 'setting'
    claim: 'The Church''s footnote sends verse 1 to 2 Sam. 3:2–5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/3?lang=eng'
    quote: '“sons”: 2 Sam. 3:2 (2–5).'
  - where: 'setting'
    claim: 'The Jerusalem sons parallel 1 Chr. 14:4–7 and 2 Sam. 5:14–16'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/3.htm'
    quote: '5–9 (= ch. 1 Chronicles 14:4-7 and 2 Samuel 5:14-16). The Sons born to David in Jerusalem'
  - where: 'setting'
    claim: 'The families of the last verses (21–24) are otherwise unknown'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/3.htm'
    quote: 'Nothing further can be said of these families, as they are otherwise quite unknown.'
  - where: 'setting'
    claim: 'Chronicles was written after the exile, possibly in the fourth century BC, in most scholars'' view'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'most scholars suggest that the books were likely written after the Babylonian exile, possibly in the fourth century BC.'
  - where: 'thread'
    claim: 'One older reading: the regular succession ceased with Josiah, and David''s independent kingship ended at his death'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/3.htm'
    quote: 'because with Josiah the regular succession to the throne in the house of David ceased … and the independent kingship of David came properly to an end with the death of Josiah.'
  - where: 'thread'
    claim: 'Genealogies mattered where blessings were restricted to families; the Bible Dictionary gives the Messiah from David as an example'
    key: bd-genealogy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genealogy?lang=eng'
    quote: 'Where certain offices or blessings are restricted to particular families, genealogies become of great importance; for example, a priest must be able to show his descent from Aaron, the Messiah from David'

  # ---- sections ----
  - where: 'section 2 plain'
    claim: 'Bath-shua is Bathsheba'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/3?lang=eng'
    quote: '“Ammiel”: Bath-shua is Bathsheba; and the name Eliam is the same as Ammiel with its syllables transposed.'
  - where: 'section 4 plain'
    claim: 'The word read as Assir may be read “Jeconiah the captive”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Chronicles+3%3A17&version=NRSVUE'
    quote: '17 and the sons of Jeconiah the captive: Shealtiel his son,'
  - where: 'section 4 plain'
    claim: 'Verse 22 counts six sons of Shemaiah but names five'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/3.htm'
    quote: 'In 1 Chronicles 3:22 again the sons of Shemaiah are reckoned to be six, but only five names are given both in Heb. and LXX.'

  # ---- notes ----
  - where: 'note 3:11 “The kings Matthew passes over”'
    claim: 'Matthew has Joram begetting Ozias'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/1?lang=eng'
    quote: 'And Asa begat Josaphat; and Josaphat begat Joram; and Joram begat Ozias;'
  - where: 'note 3:11 “The kings Matthew passes over”'
    claim: 'Matthew has Josiah begetting Jeconiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/1?lang=eng'
    quote: 'And Josias begat Jechonias and his brethren, about the time they were carried away to Babylon:'
  - where: 'note 3:11 “The kings Matthew passes over”'
    claim: 'Ozias in Matthew is Uzziah, also called Azariah'
    key: bd-uzziah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/uzziah?lang=eng'
    quote: 'Strength of the Lord. Called Azariah (2 Kgs. 14:21); king of Judah (2 Chr. 26:1); … called Ozias (Matt. 1:8).'
  - where: 'note 3:11 “The kings Matthew passes over”'
    claim: 'Matthew gives fifteen names between David and Zerubbabel, Luke twenty-one, through two different lines'
    key: bd-genealogy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genealogy?lang=eng'
    quote: 'We notice also that Luke gives 21 names between David and Zerubbabel, and Matthew gives only 15; … The probable explanation is that the descent may be traced through two different lines.'
  - where: 'note 3:11 “The kings Matthew passes over”'
    claim: 'Matthew organizes the ancestors into three groups of fourteen to show Jesus is a son of David; David''s name has the value fourteen'
    key: sc-knowhy-654
    url: 'https://scripturecentral.org/knowhy/why-do-we-have-multiple-accounts-of-jesuss-birth'
    quote: 'Matthew is attempting to show how Jesus is a son of David through a careful organization of the Savior’s ancestors into three groups of fourteen individuals (Matthew 1:1–17). … David’s name in Hebrew had the value of fourteen'
  - where: 'note 3:15 “Josiah''s four sons”'
    claim: 'Shallum, Josiah''s fourth son, is the king called Jehoahaz'
    key: bd-shallum
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shallum?lang=eng'
    quote: '(4) Fourth son of Josiah, king of Judah (1 Chr. 3:15; Jer. 22:11); called Jehoahaz in 2 Kgs. 23:30; 2 Chr. 36:1.'
  - where: 'note 3:15 “Josiah''s four sons”'
    claim: 'King Zedekiah was Mattaniah, the uncle of Jehoiachin, made king by Nebuchadnezzar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'And the king of Babylon made Mattaniah his father’s brother king in his stead, and changed his name to Zedekiah.'
  - where: 'note 3:15 “Josiah''s four sons”'
    claim: 'Pharaoh-nechoh made Jehoiakim king in place of Jehoahaz'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng'
    quote: 'Pharaoh-nechoh made Eliakim the son of Josiah king in the room of Josiah his father, and turned his name to Jehoiakim, and took Jehoahaz away'
  - where: 'note 3:17 “Assir, or the captive”'
    claim: 'The Westminster Leningrad Codex tags the word in 1 Chr. 3:17 as a common noun'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: 'lemma="617" n="0.1" morph="HNcmsa"'
  - where: 'note 3:17 “Assir, or the captive”'
    claim: 'In the OSHB morphology codes, noun type c is common and p is a proper name'
    key: oshb-wlc
    url: 'https://hb.openscriptures.org/parsing/HebrewMorphologyCodes.html'
    quote: 'c common … p proper name'
  - where: 'note 3:17 “Assir, or the captive”'
    claim: 'NRSVue translates “the sons of Jeconiah the captive: Shealtiel his son”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Chronicles+3%3A17&version=NRSVUE'
    quote: '17 and the sons of Jeconiah the captive: Shealtiel his son,'
  - where: 'note 3:17 “Assir, or the captive”'
    claim: 'ESV translates “the captive”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=1+Chronicles+3%3A17&version=ESV'
    quote: '17 and the sons of Jeconiah, the (A)captive: (B)Shealtiel his son,'
  - where: 'note 3:17 “Assir, or the captive”'
    claim: 'The word can be taken as an appellative, “prisoner,” in apposition to Jeconiah'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/3.htm'
    quote: 'it is doubtful if אסּר be the name of a son, or should be considered, as it is by Luther and others, an appellative, "prisoner," in apposition to יכניה'
  - where: 'note 3:17 “Assir, or the captive”'
    claim: 'One older commentary: the missing article rules out the appellative reading'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/3.htm'
    quote: 'Against the appellative interpretation of the word, on the contrary, the want of the article is decisive; as apposition to יכניה, it should have the article.'
  - where: 'note 3:17 “Assir, or the captive”'
    claim: 'Jehoiachin is also called Jeconiah and Coniah'
    key: bd-jehoiachin
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehoiachin?lang=eng'
    quote: 'Jehovah shall establish. King of Judah (598 B.C.), also known as Jeconiah, Joachin, Coniah'
  - where: 'note 3:17 “Assir, or the captive”'
    claim: 'The Church''s footnote sets Zerubbabel “son of Shealtiel” in Ezra and Haggai beside Matt. 1:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/3?lang=eng'
    quote: '“Zerubbabel”: According to these verses, Zerubbabel was the grandson of Jeconiah through Pedaiah; elsewhere he is called the son of Shealtiel. Ezra 3:2; 5:2; Hag. 1:1; Matt. 1:12.'
  - where: 'note 3:19 “Zerubbabel, governor of Judah”'
    claim: 'Zerubbabel, grandson of Jehoiachin through Pedaiah, was governor'
    key: bd-zerubbabel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zerubbabel?lang=eng'
    quote: 'Born in Babylon … Grandson of Jehoiachin, king of Judah, and son of Pedaiah (1 Chr. 3:16–19); in Ezra 3:2 and elsewhere he is called “son of Shealtiel,” probably his nephew or legal heir. … appointed pekhah or governor, as the representative of the Jewish royal house'
  - where: 'note 3:19 “Zerubbabel, governor of Judah”'
    claim: 'He set up an altar and rebuilt the temple, helped by Haggai and Zechariah'
    key: bd-zerubbabel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zerubbabel?lang=eng'
    quote: 'He set up an altar in Jerusalem and rebuilt the temple (see Temple of Zerubbabel) (Ezra 3:2, 8; 4:2–3; 5:2); being helped by Haggai (Hag. 1:1–14; 2) and Zechariah (Zech. 4:6–10).'
  - where: 'note 3:19 “Zerubbabel, governor of Judah”'
    claim: 'The Church''s footnote sets the two parentages side by side'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/3?lang=eng'
    quote: 'According to these verses, Zerubbabel was the grandson of Jeconiah through Pedaiah; elsewhere he is called the son of Shealtiel.'
  - where: 'note 3:21 “How far past the exile the line runs”'
    claim: 'The Septuagint reads “his son” in verse 21, and one commentary prefers it'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/3.htm'
    quote: 'The LXX. reads … “and Jesaiah his son, Rephaiah his son, Arnan his son, Obadiah his son, Shechaniah his son,” thus adding five steps to the genealogy. … Probably the LXX. is to be followed.'
  - where: 'note 3:21 “How far past the exile the line runs”'
    claim: 'The Hebrew seems to count six generations after Zerubbabel, the Septuagint eleven'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/3.htm'
    quote: 'the Heb. seems to reckon but one generation between Hananiah and Shemaiah, the LXX. on the contrary reckons six; the result on the whole genealogy being that the LXX. counts eleven generations after Zerubbabel as against six in the Heb.'
  - where: 'note 3:21 “How far past the exile the line runs”'
    claim: 'One older commentary: the families are branches of David''s house of unknown connection, the list perhaps a later fragment'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/3.htm'
    quote: 'The sons of Rephaiah, the sons of Arnan, etc., were, it may be supposed, branches of the family of David, whose descent or connection with Zerubbabel is for us unascertainable. The list … is a genealogical fragment, which has perhaps come into the text of the Chronicle at a later time.'
  - where: 'note 3:21 “How far past the exile the line runs”'
    claim: 'One older commentary: the text is corrupt and cannot be restored'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/3.htm'
    quote: 'has no meaning, and is clearly corrupt, as has been recognised by Heidegger, Vitringa, Carpzov, and others. Owing, however, to want of information from other sources regarding these families and their connection with the descendants of Zerubbabel, we have no means whatever of restoring the original text.'
  - where: 'note 3:21 “How far past the exile the line runs”'
    claim: 'A Hattush of the sons of David went up from Babylon with Ezra'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/8?lang=eng'
    quote: 'of the sons of David; Hattush.'
  - where: 'note 3:21 “How far past the exile the line runs”'
    claim: 'One older reading: other men bore the name Hattush, and the families of 3:22–24 did not descend from Zerubbabel in a direct line, since none of their names is among his descendants in Matthew 1'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/3.htm'
    quote: 'not a single one of the names of descendants of Zerubbabel there enumerated coincides with the names given in our verses, we may conclude that the descendants of Shecaniah enumerated in 1 Chronicles 3:22-24 did not descend from Zerubbabel in a direct line.'
  - where: 'note 3:21 “How far past the exile the line runs”'
    claim: 'Other men, priests among them, bore the name Hattush'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/3.htm'
    quote: 'Other men too, even priests, have borne the name Hattush; cf. Nehemiah 3:10; Nehemiah 10:5; Nehemiah 12:2.'

  # ---- christ ----
  - where: 'christ'
    claim: 'Luke traces Jesus through Zorobabel and Salathiel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/3?lang=eng'
    quote: 'Which was the son of Joanna, which was the son of Rhesa, which was the son of Zorobabel, which was the son of Salathiel, which was the son of Neri,'
  - where: 'christ'
    claim: 'Luke traces Jesus to David through Nathan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/3?lang=eng'
    quote: 'Which was the son of Melea, which was the son of Menan, which was the son of Mattatha, which was the son of Nathan, which was the son of David,'
  - where: 'christ'
    claim: 'Matthew gives a legal descent, Luke a natural one'
    key: bd-genealogy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genealogy?lang=eng'
    quote: 'Matthew gives a legal descent and includes several adopted children, such adoption carrying with it legal rights, while Luke gives a natural descent through actual parentage.'
  - where: 'christ'
    claim: 'The angel promised Mary''s son the throne of David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'the Lord God shall give unto him the throne of his father David'
  - where: 'christ'
    claim: 'The Lord''s word shall all be fulfilled'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/1?lang=eng'
    quote: 'and though the heavens and the earth pass away, my word shall not pass away, but shall all be fulfilled'
