chapter: 29
claims:
  - where: 'setting'
    claim: 'Chapter 28 opens the assembly of Israel''s princes and officers at Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/28?lang=eng'
    quote: 'And David assembled all the princes of Israel, the princes of the tribes, and the captains of the companies that ministered to the king by course'
  - where: 'setting'
    claim: '1 Kings tells Solomon''s accession through Adonijah''s bid and Zadok''s anointing at the tabernacle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/1?lang=eng'
    quote: 'And Zadok the priest took an horn of oil out of the tabernacle, and anointed Solomon. And they blew the trumpet; and all the people said, God save king Solomon.'
  - where: 'setting'
    claim: 'In 1 Kings David''s last charge includes Joab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/2?lang=eng'
    quote: 'Moreover thou knowest also what Joab the son of Zeruiah did to me … Do therefore according to thy wisdom, and let not his hoar head go down to the grave in peace.'
  - where: 'setting'
    claim: '1 and 2 Chronicles are one book in the Hebrew canon'
    key: bd-chronicles
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/chronicles?lang=eng'
    quote: 'The two books of Chronicles counted as one in the Hebrew canon.'
  - where: 'setting'
    claim: '2 Chronicles opens with Solomon strengthened in his kingdom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/1?lang=eng'
    quote: 'And Solomon the son of David was strengthened in his kingdom, and the Lord his God was with him, and magnified him exceedingly.'
  - where: 'setting'
    claim: 'Chronicles was most likely written after the exile, possibly in the fourth century BC'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'The authorship of Chronicles remains uncertain, but most scholars suggest that the books were likely written after the Babylonian exile, possibly in the fourth century BC.'
  - where: 'setting'
    claim: 'The word behind "drams" in verse 7 is rare and late'
    key: bdb
    url: 'https://biblehub.com/hebrew/150.htm'
    quote: 'noun [masculine] unit (apparently of weight, certainly) of value, rare & late, perhaps drachma, others daric'
  - where: 'note 29:1 “A palace for the LORD”'
    claim: 'Bîrâ means castle or palace, is late and probably a loanword, and is used of the temple only in 29:1, 19, of the fortress by the temple, and of Shushan'
    key: bdb
    url: 'https://biblehub.com/hebrew/1002.htm'
    quote: 'בִּירָה noun feminine castle, palace (late & probably loan-word … 1 of temple at Jerusalem 1 Chronicles 29:1,19 הַבִּירָה; of for-tress near temple Nehemiah 2:8 … 2 בְּשׁוּשַׁן הַבִּירָה Nehemiah 1:1; Esther 1:2,5'
  - where: 'note 29:1 “A palace for the LORD”'
    claim: 'The word in 29:1 is bîrâ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: 'הַ/בִּירָ֔ה'
  - where: 'note 29:5 “To fill his hand”'
    claim: 'Behind "consecrate his service" is the infinitive of mālēʾ, "fill," with "his hand"'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: '<w lemma="l/4390" morph="HR/Vpc" id="13Uw1">לְ/מַלֹּ֥אות</w>'
  - where: 'note 29:5 “To fill his hand”'
    claim: '"Fill the hand" is the idiom for installing a priest, and BDB lists 1 Chr. 29:5 and 2 Chr. 29:31 under it'
    key: bdb
    url: 'https://biblehub.com/hebrew/4390.htm'
    quote: '׳מִלֵּא יַד מּ figurative for institute to a priestly office, consecrate Exodus 28:41; Exodus 29:9,29,33,35; Leviticus 8:33 … 1 Kings 13:33; Ezekiel 43:26 (altar), 1 Chronicles 29:5; 2Chronicles 13:9; 29:31'
  - where: 'note 29:5 “To fill his hand”'
    claim: 'The verb of "willing" is to volunteer, to present spontaneously'
    key: bdb
    url: 'https://biblehub.com/hebrew/5068.htm'
    quote: '2. (hence) to volunteer (as a soldier), to present spontaneously'
  - where: 'note 29:5 “To fill his hand”'
    claim: 'Exodus 28:41 renders the same idiom "consecrate them" for Aaron and his sons'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/28?lang=eng'
    quote: 'and shalt anoint them, and consecrate them, and sanctify them, that they may minister unto me in the priest’s office.'
  - where: 'note 29:5 “To fill his hand”'
    claim: 'Hezekiah uses the same words of a congregation bringing sacrifices'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/29?lang=eng'
    quote: 'Now ye have consecrated yourselves unto the Lord, come near and bring sacrifices and thank offerings into the house of the Lord.'
  - where: 'note 29:7 “Darics in David''s day”'
    claim: 'ʾădarkōnîm is a rare, late unit of value, perhaps drachma or daric, used also in Ezra and Nehemiah'
    key: bdb
    url: 'https://biblehub.com/hebrew/150.htm'
    quote: 'noun [masculine] unit (apparently of weight, certainly) of value, rare & late, perhaps drachma, others daric, see below: — only plural דַּרְכְּמוֺנִים of gold Ezra 2:69'
  - where: 'note 29:7 “Darics in David''s day”'
    claim: 'Keil takes the word as the daric, a Persian gold coin, as the Syriac shows'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/29.htm'
    quote: 'does not correspond to the Greek δραχμή, Arab. dirhem, but to the Greek δαρεικός, as the Syrian translation derîkônā'', Ezra 8:27, shows; a Persian gold coin'
  - where: 'note 29:7 “Darics in David''s day”'
    claim: 'Keil quotes an earlier commentator with approval: the historian used the coin of his own day without assuming darics in David''s time; Keil takes the darics as gold given in coin, distinct from the talents'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/29.htm'
    quote: '"Our historian uses the words used in his time to designate the current gold coins, without intending to assume that there were darics in use in the time of David … This perfectly correct remark … Probably the sum in darics is the amount which they contributed in gold pieces received as coins'
  - where: 'note 29:7 “Darics in David''s day”'
    claim: 'Cambridge: the daric was a Persian gold coin, though "drams" may be right; the talents are uncoined gold by weight'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/29.htm'
    quote: '7. five thousand talents] i.e. of uncoined gold by weight. ten thousand drams] R.V. ten thousand darics. A daric was a Persian gold coin worth about 22 shillings. The translation of A.V. drams (i.e. drachmæ) may however be right.'
  - where: 'note 29:7 “Darics in David''s day”'
    claim: 'Chronicles was most likely written after the exile'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'most scholars suggest that the books were likely written after the Babylonian exile, possibly in the fourth century BC.'
  - where: 'note 29:14 “Out of thine hand”'
    claim: '"Of thine own" is literally "and from your hand"'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: '<w lemma="c/m/3027" n="0.0" morph="HC/R/Ncbsc/Sp2ms" id="13y91">וּ/מִ/יָּדְ/ךָ֖</w>'
  - where: 'note 29:14 “Out of thine hand”'
    claim: 'The verb "offer willingly" means to volunteer, to present spontaneously'
    key: bdb
    url: 'https://biblehub.com/hebrew/5068.htm'
    quote: 'nadab: To volunteer, to offer willingly, to incite, to impel'
  - where: 'note 29:14 “Out of thine hand”'
    claim: 'A KnoWhy counts David''s joy at his people''s willingness to build the temple among the scriptures that tie joy to the temple'
    key: sc-knowhy-372
    url: 'https://scripturecentral.org/knowhy/why-is-joy-associated-with-temple-work-in-the-scriptures'
    quote: 'Like this woman, many ancient Saints spoke of the joy they experienced while being in or near the temple. … King David spoke of the joy that he felt at merely witnessing his people’s willingness to help build God’s temple (1 Chronicles 29:17'
  - where: 'note 29:20 “Bowing before the LORD and the king”'
    claim: '"Worshipped" is the verb to bow down, prostrate oneself'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: 'וַ/יִּֽשְׁתַּחֲו֛וּ'
  - where: 'note 29:20 “Bowing before the LORD and the king”'
    claim: 'The verb means to bow down before a monarch or superior in homage, and before God in worship; BDB lists 1 Kings 1:31'
    key: bdb
    url: 'https://biblehub.com/hebrew/7812.htm'
    quote: '1 bow down, prostrate oneself, before a monarch or superior, in homage, etc.: … 1 Samuel 24:9; Genesis 43:28 (J) 2 Samuel 14:4,22; Ruth 2:10; 1 Kings 1:31 … 2 before God, in worship, etc.:'
  - where: 'note 29:22 “King the second time”'
    claim: '"The second time" refers back to 23:1 and the first anointing in 1 Kings 1; "unto the LORD" means according to His will in choosing Solomon'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/29.htm'
    quote: 'The שׁנית refers back to 1 Chronicles 23:1, and the first anointing of Solomon narrated in 1 Kings 1:32. ליהיה, not: before Jahve, which ל cannot signify, but: "to Jahve," in accordance with His will expressed in His choice of Solomon (1 Chronicles 28:4).'
  - where: 'note 29:22 “King the second time”'
    claim: 'The first time Solomon was hastily anointed against Adonijah'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/29.htm'
    quote: '22. the second time] Cp. 1 Chronicles 23:1. The first time is described in 1 Kings 1:39 (Solomon hastily anointed in order to assert his claim to the throne against his brother Adonijah).'
  - where: 'note 29:22 “King the second time”'
    claim: 'From the latter years of Saul''s reign there seems to have been a double high priesthood, Abiathar in David''s camp and Zadok at Gibeon, continuing after David''s accession'
    key: bd-zadok
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zadok?lang=eng'
    quote: 'During the latter years of Saul''s reign there seems to have been a double high priesthood: Abiathar … officiating in David''s camp, and Zadok at Gibeon, where the tabernacle was standing. This arrangement continued after David''s accession'
  - where: 'note 29:22 “King the second time”'
    claim: 'Abiathar joined Adonijah, Zadok stayed with David, anointed Solomon and replaced Abiathar'
    key: bd-zadok
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zadok?lang=eng'
    quote: 'there seems to have been a double high priesthood: Abiathar … and Zadok at Gibeon … during the rebellion of Adonijah, Abiathar joined the rebels, while Zadok remained faithful to David (1 Kgs. 1:8, 26). He anointed Solomon (1:32–45); and was finally put in the room of Abiathar.'
  - where: 'note 29:22 “King the second time”'
    claim: 'Kings says Solomon sat on the throne of David his father'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/2?lang=eng'
    quote: 'Then sat Solomon upon the throne of David his father; and his kingdom was established greatly.'
  - where: 'note 29:22 “King the second time”'
    claim: 'David says Solomon was chosen to sit on the throne of the kingdom of the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/28?lang=eng'
    quote: 'he hath chosen Solomon my son to sit upon the throne of the kingdom of the Lord over Israel.'
  - where: 'note 29:22 “King the second time”'
    claim: 'The Chronicler regards the king as the deputy of the LORD (on 28:5 and 29:23)'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/28.htm'
    quote: 'the throne of the kingdom of the Lord] Cp. 1 Chronicles 29:23, the throne of the Lord. The Chronicler speaks as one who regards the king as the deputy of the Lord.'
  - where: 'note 29:29 “The books of Samuel, Nathan and Gad”'
    claim: 'The books of Samuel the seer, Gad the seer and Nathan the prophet are among the lost books, mentioned as authentic and valuable but not in the Bible'
    key: bd-lost-books
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/lost-books?lang=eng'
    quote: 'those documents that are mentioned in the Bible in such a way that it is evident they were considered authentic and valuable but that are not found in the Bible today. … book of Samuel the seer (1 Chr. 29:29); book of Gad the seer (1 Chr. 29:29); book of Nathan the prophet (1 Chr. 29:29; 2 Chr. 9:29)'
  - where: 'note 29:29 “The books of Samuel, Nathan and Gad”'
    claim: 'Writers mostly of the prophetic order recorded their own times; with Samuel and Kings these were the Chronicler''s material'
    key: bd-chronicles
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/chronicles?lang=eng'
    quote: 'writers living amid the events described, and generally of the prophetic order, recorded the history of their own times. These records along with Samuel and Kings formed the material out of which our books of Chronicles were compiled'
  - where: 'note 29:29 “The books of Samuel, Nathan and Gad”'
    claim: 'The three titles are three Hebrew words: rōʾeh, nāḇîʾ, ḥōzeh'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: '<w lemma="d/7200" n="0.2" morph="HTd/Ncmsa" id="13Mqr">הָ/רֹאֶ֔ה</w> … <w lemma="d/5030" n="0.1" morph="HTd/Ncmsa" id="13VgD">הַ/נָּבִ֔יא</w> … <w lemma="d/2374" n="0" morph="HTd/Ncmsa" id="13KHG">הַ/חֹזֶֽה</w>'
  - where: 'christ'
    claim: 'The Church''s footnotes set Matt. 6:13 beside verse 11 and Mosiah 2:25; 4:22 beside verse 12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/29?lang=eng'
    quote: 'Matt. 6:13 (9–13); D&C 65:6. … Mosiah 2:25; 4:22.'
