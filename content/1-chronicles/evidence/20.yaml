chapter: 20
claims:
  - where: 'setting'
    claim: 'Chapter 19 ends with the Syrians refusing to help Ammon any more'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/19?lang=eng'
    quote: 'they made peace with David, and became his servants: neither would the Syrians help the children of Ammon any more.'
  - where: 'setting'
    claim: 'Rabbah was the chief city of the Ammonites; its ruins are at modern Amman'
    key: bd-rabbah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/rabbah?lang=eng'
    quote: 'Chief city of the Ammonites, in the deep fertile valley of the Upper Jabbock … taken by David (2 Sam. 11:1; 12:26–27, 29; 17:27; 1 Chr. 20:1) … There are still extensive ruins at the modern Amman.'
  - where: 'setting'
    claim: 'The Church''s footnotes send verses 1, 3 and 4 to 2 Sam. 11:1; 12:26; 12:31; 21:18'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/20?lang=eng'
    quote: '1a “Joab”: 2 Sam. 11:1; 12:26. … 3a “cut”: 2 Sam. 12:31. TG Cruelty. … 4a “war”: 2 Sam. 21:18.'
  - where: 'setting'
    claim: 'These are the last of David''s wars that Chronicles tells; between the two sections it omits 2 Sam. 13:1–21:14'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/20.htm'
    quote: 'This section is the last in which the Chronicler notices David’s wars. … Between the two sections of this chapter the Chronicler omits the account of the rebellions of Absalom and of Sheba, and the story of the Gibeonite vengeance on the house of Saul (2 Samuel 13:1 to 2 Samuel 21:14).'
  - where: 'setting'
    claim: 'Chapters 21–22 turn to the census and the place of the house of the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/22?lang=eng'
    quote: 'Then David said, This is the house of the LORD God, and this is the altar of the burnt offering for Israel.'
  - where: 'section 1 plain'
    claim: '“After the year was expired” means at the return of the year, in the spring'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/20.htm'
    quote: 'after the year was expired] R.V. at the time of the return of the year, i.e. in the spring, 2 Samuel 11:1; 1 Kings 20:22.'
  - where: 'thread'
    claim: 'Chronicles assumes its readers know Samuel and Kings and leaves out Bath-sheba and David''s family trials'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'It appears that the author or authors of Chronicles assumed that readers would be familiar with the books of Samuel and Kings. Chronicles leaves out, for example, David’s struggles with Saul, his sin with Bathsheba, and other family trials'
  - where: 'thread'
    claim: 'These are the last of David''s wars in Chronicles'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/20.htm'
    quote: 'This section is the last in which the Chronicler notices David’s wars.'
  - where: 'note 20:1 “Where Bath-sheba is”'
    claim: 'In Samuel “But David tarried still at Jerusalem” opens the story of David and Bath-sheba'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/11?lang=eng'
    quote: 'and besieged Rabbah. But David tarried still at Jerusalem. And it came to pass in an eveningtide, that David arose from off his bed, and walked upon the roof of the king’s house'
  - where: 'note 20:1 “Where Bath-sheba is”'
    claim: 'Chronicles leaves out the sin with Bath-sheba because it assumes readers know Samuel and Kings'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'It appears that the author or authors of Chronicles assumed that readers would be familiar with the books of Samuel and Kings. Chronicles leaves out, for example, David’s struggles with Saul, his sin with Bathsheba, and other family trials'
  - where: 'note 20:1 “Where Bath-sheba is”'
    claim: 'Chronicles asks whether Israel is still God''s people and writes to give hope and an identity based on worship'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'the question Chronicles appears to address is “Are we still God''s people and does the covenant still stand?" The Chronicler writes to give hope, to create an identity based on worship and the ideals of the kingdom, and to legitimize their newly rebuilt temple.'
  - where: 'note 20:1 “Where Bath-sheba is”'
    claim: 'Chronicles keeps Uriah on the roll, the census and its plague, and the word that David shed blood abundantly'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/22?lang=eng'
    quote: 'Thou hast shed blood abundantly, and hast made great wars: thou shalt not build an house unto my name'
  - where: 'note 20:1 “Where Bath-sheba is”'
    claim: 'Chronicles tells the census and the plague'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/21?lang=eng'
    quote: 'So the LORD sent pestilence upon Israel: and there fell of Israel seventy thousand men.'
  - where: 'note 20:1 “Who took Rabbah”'
    claim: 'In Samuel Joab took the royal city and the city of waters and sent for David lest the city be called after him; David came and took it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/12?lang=eng'
    quote: 'And Joab fought against Rabbah of the children of Ammon, and took the royal city. And Joab sent messengers to David, and said, I have fought against Rabbah, and have taken the city of waters. Now therefore gather the rest of the people together, and encamp against the city, and take it: lest I take the city'
  - where: 'note 20:1 “Who took Rabbah”'
    claim: 'Rabbah was the Ammonites'' chief city, taken by David'
    key: bd-rabbah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/rabbah?lang=eng'
    quote: '(2) Chief city of the Ammonites, in the deep fertile valley of the Upper Jabbock (Deut. 3:11; Josh. 13:25); taken by David (2 Sam. 11:1; 12:26–27, 29'
  - where: 'note 20:2 “Their king, or Milcom?”'
    claim: 'The Hebrew is malkām, pointed as “king” with the suffix “their”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: '<w lemma="4428" morph="HNcmsc/Sp3mp" id="13qbK">מַלְכָּ/ם֩</w>'
  - where: 'note 20:2 “Their king, or Milcom?”'
    claim: 'The same letters stand for the god''s name in Zeph. 1:5 (KJV “Malcham”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zeph.xml'
    quote: '<w lemma="b/4445 b" n="0" morph="HR/Ncmsc/Sp3mp" id="369qY">בְּ/מַלְכָּֽ/ם</w>'
  - where: 'note 20:2 “Their king, or Milcom?”'
    claim: 'The Septuagint reads “the crown of Molchom their king”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_chronicles/20.htm'
    quote: 'And David took the crown of Molchom their king off his head, and the weight of it was found to be a talent of gold, and on it were precious stones'
  - where: 'note 20:2 “Their king, or Milcom?”'
    claim: 'Milcom is the god of Ammon, worshipped by passing children through fire; Solomon followed him'
    key: bd-molech
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/molech?lang=eng'
    quote: 'The abomination of the children of Ammon, a fire god, worshipped by passing children through or burning them in fire (Deut. 18:10; 2 Chr. 28:3). Molech worship was practiced by Solomon (1 Kgs. 11:5, 7)'
  - where: 'note 20:3 “Cut, or put to work?”'
    claim: 'Chronicles'' verb is wayyāśar'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: '<w lemma="c/7787" morph="HC/Vqw3ms" id="13LPs">וַ/יָּ֨שַׂר</w>'
  - where: 'note 20:3 “Cut, or put to work?”'
    claim: 'Samuel''s verb is wayyāśem, “and he put”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: '<w lemma="c/7760 a" morph="HC/Vqw3ms" id="108qh">וַ/יָּ֣שֶׂם</w>'
  - where: 'note 20:3 “Cut, or put to work?”'
    claim: 'BDB gives the verb as “saw,” occurring only here, and refers the reader to śîm, “put”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7787.htm'
    quote: '[שׂוּר] verb saw … Qal Imperfect3masculine singular וַיָּשַׂר 1 Chronicles 20:3 (but see שׂים 1a).'
  - where: 'note 20:3 “Cut, or put to work?”'
    claim: 'One older commentary reads Chronicles as “put them to work with saws,” task-work not massacre, and ties the harshness to the insult to David''s ambassadors'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/20.htm'
    quote: 'Read (cp. 2 Samuel 12:31, R.V. mg.) and put them with saws, i.e. put them to work with saws, etc. … suggest task-work, not massacre. … The exceptionally harsh treatment of the Ammonites was doubtless due to the exceptional insults which David’s ambassadors had received from them.'
  - where: 'note 20:3 “Cut, or put to work?”'
    claim: 'The Ammonites shamed David''s messengers'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/19?lang=eng'
    quote: 'Wherefore Hanun took David’s servants, and shaved them, and cut off their garments in the midst hard by their buttocks, and sent them away.'
  - where: 'note 20:4 “Eight chapters of Samuel passed over”'
    claim: 'Verse 4 is 2 Sam. 21:18; Samuel''s battle is at Gob and the giant is Saph'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/21?lang=eng'
    quote: 'And it came to pass after this, that there was again a battle with the Philistines at Gob: then Sibbechai the Hushathite slew Saph, which was of the sons of the giant.'
  - where: 'note 20:4 “Eight chapters of Samuel passed over”'
    claim: 'Just before, Samuel tells David waxing faint, Ishbi-benob, Abishai, and the oath that David go no more to battle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/21?lang=eng'
    quote: 'and David waxed faint. And Ishbi-benob, which was of the sons of the giant … thought to have slain David. But Abishai the son of Zeruiah succoured him … Thou shalt go no more out with us to battle, that thou quench not the light of Israel.'
  - where: 'note 20:4 “Eight chapters of Samuel passed over”'
    claim: 'The chapter of the giants in Samuel opens with the famine for Saul''s slaying of the Gibeonites'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/21?lang=eng'
    quote: 'Then there was a famine in the days of David three years, year after year; and David inquired of the LORD. And the LORD answered, It is for Saul, and for his bloody house, because he slew the Gibeonites.'
  - where: 'note 20:4 “Eight chapters of Samuel passed over”'
    claim: '“The giant” in verse 8 is hārāpāʾ, “the Rapha”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: '<w lemma="l/d/7497 a" n="1.0" morph="HR/Td/Ngmsa" id="13NpM">לְ/הָ/רָפָ֖א</w>'
  - where: 'note 20:5 “Lahmi the brother of Goliath”'
    claim: 'Chronicles reads ʾet laḥmî ʾăḥî golyāt, “Lahmi the brother of Goliath”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: '<w lemma="3902" n="0.2.1" morph="HNp" id="13zcE">לַחְמִי֙</w> … <w lemma="251" n="0.2.0" morph="HNcmsc" id="13rj8">אֲחִי֙</w>'
  - where: 'note 20:5 “Lahmi the brother of Goliath”'
    claim: 'Samuel reads bêt hallaḥmî, “the Beth-lehemite,” and names Elhanan''s father Jaare-oregim'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: '<w lemma="3296+" morph="HNp" id="10K8b">יַעְרֵ֨י</w> … <w lemma="1022+" morph="HNgmsc" id="10rPV">בֵּ֣ית</w> … <w lemma="1022" n="0.2.1" morph="HNgmsa" id="10tM6">הַלַּחְמִ֗י</w>'
  - where: 'note 20:5 “Lahmi the brother of Goliath”'
    claim: 'The King James of 2 Sam. 21:19 reads “slew the brother of Goliath”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/21?lang=eng'
    quote: 'where Elhanan the son of Jaare-oregim, a Beth-lehemite, slew the brother of Goliath the Gittite, the staff of whose spear was like a weaver’s beam.'
  - where: 'note 20:5 “Lahmi the brother of Goliath”'
    claim: 'The Bible Dictionary: Goliath killed by David; 2 Sam. 21:19 probably another man of the same name, or an error'
    key: bd-goliath
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/goliath?lang=eng'
    quote: 'The Philistine giant killed by David (1 Sam. 17). In 2 Sam. 21:19 the reference is probably to a different man of the same name, or some error may have crept into the text.'
  - where: 'christ'
    claim: 'David told Goliath the battle is the LORD''s'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/17?lang=eng'
    quote: 'the LORD saveth not with sword and spear: for the battle is the LORD’s, and he will give you into our hands.'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'The Lord promised the Saints, “I will fight your battles”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/105?lang=eng'
    quote: 'For behold, I do not require at their hands to fight the battles of Zion; for, as I said in a former commandment, even so will I fulfil—I will fight your battles.'
  - where: 'note 20:1 “Who took Rabbah”'
    claim: 'Joab''s message to David, and David taking the city'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/12?lang=eng'
    quote: 'gather the rest of the people together, and encamp against the city, and take it: lest I take the city, and it be called after my name. And David gathered all the people together, and went to Rabbah'
