chapter: 16
claims:
  - where: 'setting'
    claim: 'Chapter 15: the first attempt failed because they sought him not after the due order'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/15?lang=eng'
    quote: 'For because ye did it not at the first, the Lord our God made a breach upon us, for that we sought him not after the due order.'
  - where: 'setting'
    claim: 'In chapter 15 the Levites carried the ark upon their shoulders'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/15?lang=eng'
    quote: 'the children of the Levites bare the ark of God upon their shoulders with the staves thereon'
  - where: 'setting'
    claim: 'Verses 1–3 and 43 are told in 2 Sam. 6:17–20: the gifts, the people going home, David returning to bless his household'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/6?lang=eng'
    quote: 'to every one a cake of bread, and a good piece of flesh, and a flagon of wine. So all the people departed every one to his house.'
  - where: 'setting'
    claim: 'The song is made of Ps. 105:1–15, Ps. 96, and Ps. 106:1, 47–48'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/16.htm'
    quote: 'the first half of it (1 Chronicles 16:8-22) recurs in Psalm 105:1-15, the second (1 Chronicles 16:23-33) in Psalm 96:1-13, and the conclusion (1 Chronicles 16:34-36) in Ps.Psa 106:1, Psalm 106:47-48'
  - where: 'thread'
    claim: 'The daily service at Gibeon: burnt offerings continually morning and evening'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/16?lang=eng'
    quote: 'And Zadok the priest, and his brethren the priests, before the tabernacle of the Lord in the high place that was at Gibeon,'
  - where: 'note 16:3 “A loaf, a portion, and a cake of raisins”'
    claim: 'The Hebrew words of the gift: ʾešpār and ʾăšîšâ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: 'וְ/אֶשְׁפָּ֖ר וַ/אֲשִׁישָֽׁה'
  - where: 'note 16:3 “A loaf, a portion, and a cake of raisins”'
    claim: 'ʾăšîšâ is a pressed raisin-cake, distributed to the people here and in 2 Sam. 6:19; used in sacrificial feasts (Hos. 3:1)'
    key: bdb
    url: 'https://biblehub.com/hebrew/809.htm'
    quote: '׳א 2 Samuel 6:19; 1 Chronicles 16:3 distributed, with other viands, to people; especially as stimulating, plural אֲשִׁישׁוֺת Songs 2:5; more explicitly אֲשִׁישֵׁי עֲנָבִים Hosea 3:1 used in sacrificial feasts'
  - where: 'note 16:3 “A loaf, a portion, and a cake of raisins”'
    claim: 'ʾešpār occurs only here and in 2 Sam. 6:19; Greek and Aquila, Symmachus: cake or roll; meaning unknown'
    key: bdb
    url: 'https://biblehub.com/hebrew/829.htm'
    quote: 'אֶשְׁמָּר 2 Samuel 6:19 = 1 Chronicles 16:3; ᵐ5 2 Samuel 6:19 Aq Symm. cake or roll; other Verss. ancient & modern have various conjectures, but actual etymology & meaning unknown'
  - where: 'note 16:3 “A loaf, a portion, and a cake of raisins”'
    claim: 'The King James has flagons of wine at Hosea 3:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/3?lang=eng'
    quote: 'love flagons of wine'
  - where: 'note 16:3 “A loaf, a portion, and a cake of raisins”'
    claim: 'A modern translation: a loaf of bread, a portion of meat, and a cake of raisins'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Chronicles+16&version=NRSVUE'
    quote: 'he distributed to every person in Israel—man and woman alike—to each a loaf of bread, a portion of meat, and a cake of raisins.'
  - where: 'note 16:4 “To record, that is, to call to remembrance in praise”'
    claim: '“To record” is the hiphil infinitive of zakar; verses 12 and 15 have the qal imperative of the same verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: 'וּ/לְ/הַזְכִּיר֙'
  - where: 'note 16:4 “To record, that is, to call to remembrance in praise”'
    claim: 'Verses 12 and 15 open with the plain imperative of zakar'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: 'זִכְר֤וּ'
  - where: 'note 16:4 “To record, that is, to call to remembrance in praise”'
    claim: 'In 1 Chr. 16:4 the hiphil apparently means commemorate, praise, apparently a Levitical function; perhaps also in the titles of Ps. 38 and 70'
    key: bdb
    url: 'https://biblehub.com/hebrew/2142.htm'
    quote: 'd. absolute commemorate, praise 1 Chronicles 16:4 (׳לְהַז, apparently Levitical function, followed by ולהודות ולהלל ליהוה), so perhaps also לְהַזְכִּיר in titles Psalm 38:1; Psalm 70:1'
  - where: 'note 16:4 “To record, that is, to call to remembrance in praise”'
    claim: 'A modern translation: to invoke, to thank, and to praise'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Chronicles+16&version=NRSVUE'
    quote: 'He appointed certain of the Levites as ministers before the ark of the Lord, to invoke, to thank, and to praise the Lord, the God of Israel.'
  - where: 'note 16:4 “To record, that is, to call to remembrance in praise”'
    claim: 'The title of Ps. 38 in the King James: to bring to remembrance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/38?lang=eng'
    quote: 'A Psalm of David, to bring to remembrance.'
  - where: 'note 16:7 “The first thanksgiving given to Asaph”'
    claim: 'The Hebrew of verse 7 has no word for “this psalm”: on that day David gave at the first to give thanks to the LORD into the hand of Asaph'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: 'אָ֣ז נָתַ֤ן דָּוִיד֙ בָּ/רֹ֔אשׁ לְ/הֹד֖וֹת לַ/יהוָ֑ה'
  - where: 'note 16:7 “The first thanksgiving given to Asaph”'
    claim: 'A modern translation: David first appointed the singing of praises by Asaph'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Chronicles+16&version=NRSVUE'
    quote: '7 Then on that day David first appointed the singing of praises to the Lord by Asaph and his kindred.'
  - where: 'note 16:7 “The first thanksgiving given to Asaph”'
    claim: 'David committed the thanksgiving to Asaph; “at first” shows liturgical singing was then first introduced; the song describes the service'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/16.htm'
    quote: 'בּראשׁ, "at the beginning," "at first," to bring out the fact that liturgical singing was then first introduced.'
  - where: 'note 16:7 “The first thanksgiving given to Asaph”'
    claim: 'It is not said that David composed the song'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/16.htm'
    quote: 'It is not expressly said that this song was composed by David for this purpose'
  - where: 'note 16:7 “The first thanksgiving given to Asaph”'
    claim: 'One older reading nevertheless judges it very probable that David composed the song for the liturgical worship'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/16.htm'
    quote: 'These considerations render it very probable that the following psalm was a hymn composed by David for the liturgical song in the public worship.'
  - where: 'note 16:7 “The first thanksgiving given to Asaph”'
    claim: 'The song is Ps. 105:1–15, Ps. 96 and Ps. 106:1, 47–48'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/16?lang=eng'
    quote: 'Then on that day David delivered first this psalm to thank the Lord into the hand of Asaph and his brethren.'
  - where: 'note 16:35 “A prayer to be gathered”'
    claim: 'Ps. 106 confesses Israel''s sins and says the LORD gave them into the hand of the heathen; its end is 1 Chr. 16:35'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/16?lang=eng'
    quote: 'And say ye, Save us, O God of our salvation, and gather us together, and deliver us from the heathen'
  - where: 'note 16:35 “A prayer to be gathered”'
    claim: 'One older commentary: the prayer shows Ps. 106 is post-exilic'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/16.htm'
    quote: 'From this prayer one would judge that Psalms 106 is not Davidic but post-exilic; and such no doubt is the case.'
  - where: 'note 16:35 “A prayer to be gathered”'
    claim: 'Another: the prayer presupposes only captives of war after a defeat, the cases of Solomon''s prayer'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/16.htm'
    quote: 'do not presuppose that the people had been previously led away into the Chaldean exile, but only the dispersion of prisoners of war, led away captive into an enemy''s land after a defeat. This usually occurred after each defeat of Israel by their enemies, and it was just such cases Solomon had in view in his prayer, 1 Kings 8:46-50.'
  - where: 'note 16:39 “Two places of worship”'
    claim: 'The tabernacle: forsaken at Shiloh, the ark never returned to it; at Nob; with its altar at Gibeon under Zadok; disappears after the temple'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'The ark never returned to the tabernacle. It was removed from Shiloh; we find it some years later with its priests and its table of shewbread at Nob (1 Sam. 21:1), and in Solomon’s reign with its altar of burnt offering and ministered at by Zadok the high priest at Gibeon (1 Chr. 16:39–40). After the building of the temple it entirely disappears from the history.'
  - where: 'note 16:39 “Two places of worship”'
    claim: 'The law''s daily offering: two lambs day by day continually'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/29?lang=eng'
    quote: 'Now this is that which thou shalt offer upon the altar; two lambs of the first year day by day continually.'
  - where: 'note 16:39 “Two places of worship”'
    claim: 'Solomon brought the ark and the tabernacle of the congregation up into the temple'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/5?lang=eng'
    quote: 'And they brought up the ark, and the tabernacle of the congregation, and all the holy vessels that were in the tabernacle, these did the priests and the Levites bring up.'
  - where: 'note 16:43 “Home to bless his house, without Michal''s quarrel”'
    claim: 'In Samuel, David''s return to bless his household is followed by Michal''s coming out'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/6?lang=eng'
    quote: 'Then David returned to bless his household. And Michal the daughter of Saul came out to meet David'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'The Lord called Emma Smith to select hymns and said the song of the righteous is a prayer to Him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/25?lang=eng'
    quote: 'For my soul delighteth in the song of the heart; yea, the song of the righteous is a prayer unto me, and it shall be answered with a blessing upon their heads.'
