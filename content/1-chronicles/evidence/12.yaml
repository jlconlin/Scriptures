chapter: 12
claims:
  - where: 'setting'
    claim: 'Verses 1–22 are not in Samuel; on one older reading they explain Saul''s weakening through desertion, and a divided Israel could not stand'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/12.htm'
    quote: 'Ch. 1 Chronicles 12:1-22 (not in Samuel). David’s Adherents in exile … The king, it seems, after his rupture with David grew continually weaker through the desertion of some of the boldest spirits of the nation who joined the exiled hero. … An Israel divided against itself could not stand.'
  - where: 'setting'
    claim: 'The chapter holds two registers: those who went over to David before Saul''s death (at Ziklag, in the mountain hold, and Manassites on his return to Ziklag), and those who made him king at Hebron'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/12.htm'
    quote: 'This chapter contains two somewhat long registers, viz.: (1) a register of the valiant men who before Saul''s death went over to David, vv. 1-22; and (2) a register of the fighting men who anointed him king in Hebron.'
  - where: 'setting'
    claim: 'The hold was the strongholds of the wilderness of Judah, in the first years of David''s flight'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/12.htm'
    quote: 'David''s sojourn in the mountain hold falls in the first years of his flight from Saul, 1 Samuel 22:1. … so that מצד here is to be understood, as המּצוּדה, 1 Samuel 24:3, also is, generally of the fastnesses in the mountains of Judah.'
  - where: 'setting'
    claim: 'Chronicles assumes readers know Samuel and leaves out David''s struggles with Saul'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'It appears that the author or authors of Chronicles assumed that readers would be familiar with the books of Samuel and Kings. Chronicles leaves out, for example, David’s struggles with Saul, his sin with Bathsheba, and other family trials'
  - where: 'when'
    claim: 'The men came while David was at Ziklag and in the mountain hold, before Saul''s death, and then at Hebron'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/12.htm'
    quote: 'that of the valiant Benjamites who came to David during his stay in Ziklag (1 Chronicles 12:1-7); (b) that of the Gadites and the men of Judah and Benjamin who went over to him while he remained in the mountain fastnesses'
  - where: 'thread'
    claim: '"Helpers of the war" are those who helped David, as in verses 17 and 21–22'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/12.htm'
    quote: 'and they were among the heroes, i.e., belonged to the heroes, the helpers of the war, i.e., to those who helped him in his former wars; cf. 1 Chronicles 12:17., 21f.'
  - where: 'thread'
    claim: 'The verb "to turn" the kingdom in verse 23 is compared with 10:14'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/12.htm'
    quote: 'In regard to להסב מ, cf. 1 Chronicles 10:14; and as to יהוה כּפי, see the remark on יהוה כּדבר, 1 Chronicles 11:3'
  - where: 'thread'
    claim: 'The feasting probably began with a covenant meal'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/12.htm'
    quote: '39. eating and drinking] The feasting probably began with the sacrificial meal with which a covenant was usually ratified; cp. Genesis 31:46; Genesis 31:54.'
  - where: 'thread'
    claim: 'The northern tribes sent provisions out of joy'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/12.htm'
    quote: 'the men of Issachar, Zebulun, and Naphtali, those on the northern frontier of Canaan as well as those who bordered upon Judah, had sent provisions upon beasts of burden, "for joy was in Israel."'
  - where: 'section 1 plain'
    claim: '"Kept himself close" means confined'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/12?lang=eng'
    quote: '1a “close”: OR confined.'
  - where: 'section 4 plain'
    claim: 'The "band of the rovers" was, on one older reading, the Amalekite band that burned Ziklag'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/12.htm'
    quote: 'helped David הגּדוּד על, against the detachment of Amalekites, who during David''s absence had surprised and burnt Ziklag, and led captive the women and children (1 Samuel 30:1-10).'
  - where: 'section 5 plain'
    claim: '"Which could keep rank" means that could set the battle in array'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/12.htm'
    quote: 'which could keep rank: they were not of double heart] R.V. that could order the battle array and were not of double heart; i.e. who moved as one man in battle array'
  - where: 'note 12:15 “Across the Jordan in flood”'
    claim: 'The first month is the month of harvest, when melting snow fills the streams, as Joshua 3:15; the valley people sought in Saul''s interest to bar their march'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/12.htm'
    quote: '15. in the first month] In Nisan (the month of harvest) when the snow was melting and filling all streams; cp. Joshua 3:15. all them of the valleys] i.e. all inhabitants of the valleys who in the interest of Saul sought to bar their march westward to join David.'
  - where: 'note 12:15 “Across the Jordan in flood”'
    claim: 'The Gadites separated themselves from the other Gadites on Saul''s side; the lion and roe language recalls 2 Sam. 1:23 and 2:18 and was drawn from the original documents'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/12.htm'
    quote: 'נבדּלוּ, they separated themselves from the other Gadites who were on Saul''s side … Lions'' faces their faces, i.e., lion-like in appearance, thoroughly warlike figures; cf. 2 Samuel 1:23. "As roes running swiftly on the mountains;" cf. 2 Samuel 2:18.'
  - where: 'note 12:15 “Across the Jordan in flood”'
    claim: 'The description recalls expressions used of heroes of David''s time and was drawn from the original documents'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/12.htm'
    quote: 'This description of the strength and swiftness of these warriors recalls, as Bertheau remarks, the similar expressions used in the historical books concerning heroes of David''s time. It has manifestly been drawn from the original documents, not added by the chronicler.'
  - where: 'note 12:18 “The Spirit clothed Amasai”'
    claim: 'The verb is lābaš, "clothe," in the figurative sense of the spirit clothing itself with a man, as Judges 6:34 and 2 Chronicles 24:20, and here'
    key: bdb
    url: 'https://biblehub.com/hebrew/3847.htm'
    quote: 'f. figurative: — לָֽבְשָׁה אֶתגִּֿדְע֑וֺן ׳וְרוּחַ י Judges 6:34 and the spirit of ׳י clothed itself with Gideon, i.e. (GFM) took possession of him (compare possessed); so 1 Chronicles 12:18; 2Chronicles 24:20'
  - where: 'note 12:18 “The Spirit clothed Amasai”'
    claim: 'The Hebrew verb in 12:18 (Hebrew 12:19) is lābəšâ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: '<w lemma="3847" n="1.3.1" morph="HVqp3fs" id="13TP4">לָבְשָׁ֗ה</w>'
  - where: 'note 12:18 “The Spirit clothed Amasai”'
    claim: 'The Church''s footnote at "Amasai" points to Amasa in 2 Samuel 17:25'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/12?lang=eng'
    quote: '18a “Amasai”: 2 Sam. 17:25.'
  - where: 'note 12:18 “The Spirit clothed Amasai”'
    claim: 'Amasa was the son of Abigail, sister of Jesse''s sons'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/2?lang=eng'
    quote: 'Whose sisters were Zeruiah, and Abigail. … And Abigail bare Amasa: and the father of Amasa was Jether the Ishmeelite.'
  - where: 'note 12:24 “Six thousand from Judah, fifty thousand from Zebulun”'
    claim: 'The Student Manual relays a reading of the Hebrew thousands as captains, giving about 2,000 famous men instead of some 340,800'
    key: ot-manual-large-numbers
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/enrichment-section-e-the-problem-of-large-numbers-in-the-old-testament?lang=eng'
    quote: 'David’s feast in Hebron in 1 Chronicles 12 appears to be attended by enormous numbers, not of ordinary men, but of distinguished leaders—some 340,800 of them. … When these figures are unscrambled, we get a total of roughly 2,000 ‘famous men’, which seems eminently reasonable.'
  - where: 'note 12:24 “Six thousand from Judah, fifty thousand from Zebulun”'
    claim: 'The Hebrew ʾlp can mean thousand or other things, including a professional soldier'
    key: ot-manual-large-numbers
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/enrichment-section-e-the-problem-of-large-numbers-in-the-old-testament?lang=eng'
    quote: 'The absence of vowels made it possible to confuse two words which are crucial to this problem: ’eleph and ’alluph. Without vowel points these words look identical: ’lp.'
  - where: 'note 12:24 “Six thousand from Judah, fifty thousand from Zebulun”'
    claim: 'Judah sent few because David had already been its king seven years; Simeon likewise; the numbers are estimates of detachments'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/12.htm'
    quote: 'Judah''s being represented by a number of warriors relatively so small, is accounted for simply by the fact that David had already been king over Judah for seven years … the numbers, which are stated only in hundreds, are not the result of an enumeration of the individual persons, but only of an estimate of the various detachments'
  - where: 'note 12:24 “Six thousand from Judah, fifty thousand from Zebulun”'
    claim: 'Simeon''s domain lay within Judah''s'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/12.htm'
    quote: 'The same remark applies to the tribe of Simeon, whose domain was enclosed by that of Judah, and which had consequently recognised David as king at the same time as the larger tribe.'
  - where: 'note 12:24 “Six thousand from Judah, fifty thousand from Zebulun”'
    claim: 'The Church''s footnote at verse 23 points to David''s anointings at Hebron, over Judah and then over Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/12?lang=eng'
    quote: '23a “David”: 2 Sam. 2:4 (3–4); 5:3 (1–3).'
  - where: 'note 12:28 “Zadok, a young man”'
    claim: 'The Bible Dictionary lists 1 Chr. 12:28 for Zadok the priest, of Eleazar''s family; double high priesthood with Abiathar; anointed Solomon; replaced Abiathar'
    key: bd-zadok
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zadok?lang=eng'
    quote: 'He belonged to the family of Eleazar (1 Chr. 6:4–8). During the latter years of Saul’s reign there seems to have been a double high priesthood: Abiathar, who belonged to the family of Ithamar, officiating in David’s camp, and Zadok at Gibeon, where the tabernacle was standing.'
  - where: 'note 12:28 “Zadok, a young man”'
    claim: 'The arrangement continued; Abiathar joined Adonijah, Zadok anointed Solomon and took Abiathar''s place; the entry lists 1 Chr. 12:28'
    key: bd-zadok
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zadok?lang=eng'
    quote: 'This arrangement continued after David’s accession, but during the rebellion of Adonijah, Abiathar joined the rebels, while Zadok remained faithful to David (1 Kgs. 1:8, 26). He anointed Solomon (1:32–45); and was finally put in the room of Abiathar. See 1 Kgs. 2:35; 4:2, 4; 1 Chr. 6:8, 53; 12:28'
  - where: 'note 12:32 “Understanding of the times”'
    claim: 'The plural ʿittîm of 1 Chr. 12:32 belongs under ʿēt in the sense of the proper, suitable time, with Ecclesiastes 3:2–8'
    key: bdb
    url: 'https://biblehub.com/hebrew/6256.htm'
    quote: 'b. proper, suitable time: … עֵת לַעֲשׂוֺת Psalm 119:126, compare Ecclesiastes 3:2-8 (26 t.); … hence (late) יוֺדְעֵי בִינָה לָעִתִּים 1 Chronicles 12:32'
  - where: 'note 12:32 “Understanding of the times”'
    claim: 'The Hebrew word is lāʿittîm'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: '<w lemma="l/6256" n="1.1" morph="HRd/Ncbpa" id="13imA">לַֽ/עִתִּ֔ים</w>'
  - where: 'note 12:38 “A perfect heart, not a double heart”'
    claim: '"Not of double heart" is literally "heart and heart" (verse 33, Hebrew 12:34)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: '<w lemma="3820 a" morph="HNcmsa" id="13PFr">לֵ֥ב</w> … <w lemma="c/3820 a" n="0" morph="HC/Ncmsa" id="13YKm">וָ/לֵֽב</w>'
  - where: 'note 12:38 “A perfect heart, not a double heart”'
    claim: 'BDB: "heart and heart" means a double heart, as in Psalm 12'
    key: bdb
    url: 'https://biblehub.com/hebrew/3820.htm'
    quote: 'בלב ולב with a double heart Psalm 12:3 etc.'
  - where: 'note 12:38 “A perfect heart, not a double heart”'
    claim: 'A perfect heart is a mind at peace with the LORD, keeping covenant, hence complete; BDB lists 1 Chr. 12:38, 28:9, 29:9'
    key: bdb
    url: 'https://biblehub.com/hebrew/8003.htm'
    quote: '׳לֵבָב שָׁלֵם עִם י a mind at peace with ׳י, keeping covt. relation, hence complete, perfect, 1 Kings 8:61 … 1 Chronicles 12:38; 2Chronicles 15:17; 19:9; 25:2; לֵב 1 Chronicles 28:9; 1 Chronicles 29:9.'
  - where: 'note 12:38 “A perfect heart, not a double heart”'
    claim: 'The Hebrew of verse 38 (Hebrew 12:39) has lēbāb šālēm and lēb ʾeḥād'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: '<w lemma="b/8003" morph="HR/Ncmsa" id="13nVn">בְּ/לֵבָ֤ב</w> <w lemma="3824" n="1.1.0" morph="HAamsa" id="13rN2">שָׁלֵם֙</w> … <w lemma="259" n="0.0" morph="HAcmsa" id="13y4p">אֶחָ֖ד</w>'
  - where: 'christ'
    claim: 'Messiah means "the anointed"; Christ is its Greek equivalent'
    key: bd-messiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/messiah?lang=eng'
    quote: 'An Aramaic word meaning “the anointed.” … In the New Testament the deliverer is called the Christ, which is the Greek equivalent of Messiah'
  - where: 'christ'
    claim: 'A perfect heart is a mind at peace with the LORD, keeping covenant; BDB lists 1 Chr. 12:38'
    key: bdb
    url: 'https://biblehub.com/hebrew/8003.htm'
    quote: '׳לֵבָב שָׁלֵם עִם י a mind at peace with ׳י, keeping covt. relation, hence complete, perfect, 1 Kings 8:61 … 1 Chronicles 12:38'
