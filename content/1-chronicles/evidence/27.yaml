chapter: 27
claims:
  - where: 'setting'
    claim: 'The lists of the army, princes, stewards and counsellors follow the Levites because David, at the end of his reign, gave form to the political constitution as well'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/27.htm'
    quote: 'The information on these points immediately succeeds the arrangement of the service of the Levites, because, as we learn from 1 Chronicles 27:23., David attempted in the last year of his reign to give a more stable form to the political constitution of the kingdom also.'
  - where: 'setting'
    claim: 'The army courses are not mentioned elsewhere in the Old Testament'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/27.htm'
    quote: 'These “courses” are not mentioned elsewhere in the O.T.'
  - where: 'setting'
    claim: 'The last list names the king''s chief counsellors, a companion piece to the lists of officials in 2 Sam. 8, 2 Sam. 20 and 1 Chr. 18'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/27.htm'
    quote: 'This catalogue of the king''s officials forms a supplementary companion piece to the catalogues of the public officials, 1 Chronicles 18:15-17, and 2 Samuel 8:15-18 and 2 Samuel 20:25-26. … it is not the chief public officials who are enumerated, but only the first councillors of the king, who formed as it were his senate'
  - where: 'setting'
    claim: 'The princes are named for Levi and Aaron apart and for both halves of Manasseh; Gad and Asher have none'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/27?lang=eng'
    quote: 'Of the Levites, Hashabiah the son of Kemuel: of the Aaronites, Zadok: … of the half tribe of Manasseh, Joel the son of Pedaiah: Of the half tribe of Manasseh in Gilead, Iddo the son of Zechariah'
  - where: 'thread'
    claim: 'The captains of the courses are the mighty men of chapter 11'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/27.htm'
    quote: 'As to Jashobeam, see on 1 Chronicles 11:11 and 2 Samuel 23:8.'
  - where: 'thread'
    claim: 'Verses 23–24: David did not number the young, because of the promise; Joab''s count was not finished or recorded'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/27?lang=eng'
    quote: 'But David took not the number of them from twenty years old and under: because the LORD had said he would increase Israel like to the stars of the heavens.'
  - where: 'note 27:1 “A month on duty”'
    claim: 'Came in and went out means came on and went off duty'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/27.htm'
    quote: 'came in and went out] Came on duty and went off duty; cp. 2 Chronicles 23:8.'
  - where: 'note 27:1 “A month on duty”'
    claim: 'Solomon''s workers in Lebanon also served by courses, though the Hebrew word there is different'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/27.htm'
    quote: 'but in 1 Kings 5:14 (5:28 Heb.), where however the Heb. word is different, courses of Israelites engaged on Solomon’s building works are mentioned.'
  - where: 'note 27:1 “A month on duty”'
    claim: 'The division on duty was not necessarily summoned to the capital and kept under arms, but ready to obey while the rest could be gathered'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/27.htm'
    quote: 'But the words are hardly to be understood to mean that the classes which were in service each month were ordered from various parts of the kingdom to the capital, and there remained under arms; but rather, as Clericus, that they paratae essent ducum imperiis parere, si quid contigisset'
  - where: 'note 27:1 “A month on duty”'
    claim: 'Keil ties the division of the army to the census of chapter 21, to leave Solomon a strong kingdom'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/27.htm'
    quote: 'David caused the people to be numbered in order to perfect the military constitution of the kingdom, and to leave his kingdom to his son strong within and mighty without.'
  - where: 'note 27:1 “A month on duty”'
    claim: 'The army''s "courses" (27:1) and the priests'' "divisions" (24:1) are the same Hebrew word, maḥălōqet'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: '<w lemma="d/4256" n="0.1.0" morph="HTd/Ncfsa" id="13xJC">הַֽ/מַּחֲלֹ֨קֶת֙</w>'
  - where: 'note 27:1 “A month on duty”'
    claim: 'The priests'' divisions at 24:1 are the same word'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: '<w lemma="4256" n="1" morph="HNcfpc/Sp3mp" id="13MrT">מַחְלְקוֹתָ֑/ם</w>'
  - where: 'note 27:1 “A month on duty”'
    claim: 'Solomon''s levy served a month in Lebanon and two at home'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/5?lang=eng'
    quote: 'ten thousand a month by courses: a month they were in Lebanon, and two months at home'
  - where: 'note 27:7 “Asahel''s course, and his son after him”'
    claim: 'Asahel was killed by Abner at the start of David''s reign, long before this division; "his son after him" points to his death; the course kept his name'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/27.htm'
    quote: 'was slain by Abner (2 Samuel 2:18-23) in the beginning of David''s reign, and consequently long before the division of the army here recorded. The words, "and Zebadiah his son after him," point to his death, as they mention his son as his successor'
  - where: 'note 27:7 “Asahel''s course, and his son after him”'
    claim: 'Asahel was one of the thirty, a commander in the army, slain by Abner, and avenged by Joab'
    key: bd-asahel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/asahel?lang=eng'
    quote: 'Youngest son of Zeruiah, one of David’s 30 heroes (2 Sam. 23:24) and a commander in his army (1 Chr. 27:7); celebrated for his swiftness of foot, an accomplishment much valued in ancient times; slain by Abner (2 Sam. 2:18–32); Joab’s revenge (3:27–30'
  - where: 'note 27:7 “Asahel''s course, and his son after him”'
    claim: 'Asahel died at Gibeon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/2?lang=eng'
    quote: 'he fell down there, and died in the same place: and it came to pass, that as many as came to the place where Asahel fell down and died stood still.'
  - where: 'note 27:18 “Elihu, or Eliab”'
    claim: 'The Septuagint reads Eliab for Elihu'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_chronicles/27.htm'
    quote: '18for Juda, Eliab of the brethren of David: for Issachar, Ambri the son of Michael:'
  - where: 'note 27:18 “Elihu, or Eliab”'
    claim: 'Eliab was Jesse''s firstborn'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/2?lang=eng'
    quote: 'And Jesse begat his firstborn Eliab, and Abinadab the second'
  - where: 'note 27:18 “Elihu, or Eliab”'
    claim: 'Eliab was the son Samuel saw first'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/16?lang=eng'
    quote: 'he looked on Eliab, and said, Surely the LORD’s anointed is before him.'
  - where: 'christ'
    claim: 'The Church''s footnote sends "stars" to Gen. 15:5 and D&C 132:30'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/27?lang=eng'
    quote: '23a “stars”: Gen. 15:5; D&C 132:30 (30–31).'
  - where: 'christ'
    claim: 'D&C 132:30: Abraham''s seed to continue as innumerable as the stars'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/132?lang=eng'
    quote: 'both in the world and out of the world should they continue as innumerable as the stars; or, if ye were to count the sand upon the seashore ye could not number them.'
  - where: 'christ'
    claim: 'The promise to Abraham included that Christ would come through his lineage; renewed with Isaac and Jacob'
    key: bd-abraham-covenant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abraham-covenant-of?lang=eng'
    quote: 'Included in the divine promises to Abraham were the assurances that (1) Christ would come through his lineage, and that (2) Abraham’s posterity would receive certain lands as an eternal inheritance (Gen. 17; 22:15–18; Gal. 3; Abr. 2). … It was renewed with Isaac (Gen. 26:1–4, 24) and again with Jacob'
  - where: 'note 27:24 “A count that never reached the record”'
    claim: 'Joab gave David a sum, and left out Levi and Benjamin'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/21?lang=eng'
    quote: 'And Joab gave the sum of the number of the people unto David. … But Levi and Benjamin counted he not among them: for the king’s word was abominable to Joab.'
  - where: 'note 27:24 “A count that never reached the record”'
    claim: '"Chronicles" is literally "the acts (words) of the days," a daily record of events; BDB cites this verse'
    key: bdb
    url: 'https://biblehub.com/hebrew/1697.htm'
    quote: 'and the rest of the acts of . . . in the book of the chronicles (daily record of events) of 1 Kings 14:29 32t. Kings; … compare also במספר דברי הימים 1 Chronicles 27:24'
  - where: 'note 27:24 “A count that never reached the record”'
    claim: 'The Church''s footnote sends "wrath" in this verse to the census of 1 Chr. 21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/27?lang=eng'
    quote: '24a “wrath”: 1 Chr. 21:7 (1–7).'
  - where: 'note 27:33 “Two counsellors, before the revolt”'
    claim: 'Ahithophel''s counsel was overthrown by Hushai and he hanged himself'
    key: bd-ahithophel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ahithophel?lang=eng'
    quote: 'Brother of folly (2 Sam. 15:12, 31, 34). His counsel overthrown by Hushai, he hangs himself (16:15–17:23).'
  - where: 'note 27:33 “Two counsellors, before the revolt”'
    claim: 'Ahithophel was David''s counsellor and joined Absalom; Hushai is "David''s friend"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/15?lang=eng'
    quote: 'And Absalom sent for Ahithophel the Gilonite, David’s counsellor, from his city … So Hushai David’s friend came into the city'
  - where: 'christ'
    claim: 'Christ would come through Abraham''s lineage; Gentiles become heirs of the covenant through the ordinances; its promises of eternal increase are renewed with each who receives celestial marriage'
    key: bd-abraham-covenant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abraham-covenant-of?lang=eng'
    quote: 'The portions of the covenant that pertain to personal salvation and eternal increase are renewed with each individual who receives the ordinance of celestial marriage (see D&C 132:29–33). Those of non-Israelite lineage … become heirs of the covenant and the seed of Abraham through the ordinances of the gospel'
  - where: 'christ'
    claim: 'Gal. 3:29'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/gal/3?lang=eng'
    quote: 'And if ye be Christ’s, then are ye Abraham’s seed, and heirs according to the promise.'
  - where: 'explore'
    claim: 'Other lists of David''s officials'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/27.htm'
    quote: 'the catalogues of the public officials, 1 Chronicles 18:15-17, and 2 Samuel 8:15-18 and 2 Samuel 20:25-26'
