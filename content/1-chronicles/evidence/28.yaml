chapter: 28
claims:
  - where: setting
    claim: 'The chapter heading: David assembles the leaders, Solomon appointed to build, the pattern given; the footnotes send the princes, captains and stewards of verse 1 to chapter 27 and give no parallel in Samuel or Kings'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/28?lang=eng'
    quote: 'David assembles the leaders of Israel—Solomon is appointed to build the temple—David exhorts Solomon and the people to keep the commandments—David gives Solomon the pattern and materials for the temple.'
  - where: setting
    claim: 'What David says in verses 3–7 he had said in substance to Solomon in 22:7–13'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/28.htm'
    quote: 'What David here says (1 Chronicles 28:3-7) of the temple building, he had in substance already (1 Chronicles 22:7-13) said to his son Solomon'
  - where: setting
    claim: 'The same assembly continues in chapter 29: the voluntary offering, the prayer, and the repeated anointing of Solomon'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/28.htm'
    quote: 'called upon the chiefs of the people and kingdom for a voluntary contribution for the same purpose; and on their freely answering this call, concluded with a solemn prayer of thanks … and by the repeated anointing of Solomon to be king'
  - where: setting
    claim: 'Chronicles was written after the exile, in part to legitimize the rebuilt temple'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'The Chronicler writes to give hope, to create an identity based on worship and the ideals of the kingdom, and to legitimize their newly rebuilt temple.'
  - where: thread
    claim: '“Be constant” (verse 7), “be strong” (verses 10, 20) are the same Hebrew verb, ḥāzaq (H2388)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: 'יֶחֱזַ֗ק … חֲזַ֥ק … חֲזַ֤ק'

  - where: 'note 28:3 “Not only the gift, but the giver”'
    claim: 'In declining David''s offer the LORD made plain that the giver as well as the gift must be worthy; Talmage quotes 28:2–3'
    key: talmage-house-of-the-lord
    url: 'https://www.gutenberg.org/ebooks/45149.html.images'
    quote: 'making plain the fact that to be acceptable unto Him it was not enough that the gift be appropriate, but that the giver must also be worthy.'
  - where: 'note 28:3 “Not only the gift, but the giver”'
    claim: 'Talmage: David had sinned, and his sin had not yet found atonement'
    key: talmage-house-of-the-lord
    url: 'https://www.gutenberg.org/ebooks/45149.html.images'
    quote: 'David, king of Israel, though in many respects a man after God''s own heart, had sinned; and his sin had not yet found atonement.'
  - where: 'note 28:3 “Not only the gift, but the giver”'
    claim: 'Cowan repeats Talmage''s principle at 1 Chr. 28:3 and sets it beside the promise that Solomon would build (28:6)'
    key: cowan-ot-temples
    url: 'https://rsc.byu.edu/ascending-mountain-lord/what-old-testament-temples-can-teach-us-about-our-own-temple-activity'
    quote: 'Thus, as Elder Talmage pointed out, “it was not enough that the gift be appropriate, but that the giver must also be worthy.”[5] Nevertheless, the Lord assured David that his son, Solomon, who would succeed him as king, would be permitted to build the temple (see 1 Chronicles 28:6).'

  - where: 'note 28:5 “Whose throne it is”'
    claim: 'Chronicles calls the throne the LORD''s at Solomon''s crowning; Judah prevailed and of him came the chief ruler (5:2)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/29?lang=eng'
    quote: 'Then Solomon sat on the throne of the LORD as king instead of David his father, and prospered; and all Israel obeyed him.'

  - where: 'note 28:6 “The king as God''s son”'
    claim: '1 Chr. 28:6, like 2 Sam. 7:14, describes the special relationship between God and the king'
    key: sc-knowhy-865
    url: 'https://scripturecentral.org/knowhy/why-does-god-declare-jesus-to-be-his-son'
    quote: 'In several verses of the Old Testament, God declares the king of Israel to be his son, showing the special relationship between God and the king. … 1 Chronicles 28:6 similarly states, “I have chosen him to be my son, and I will be his father.”'
  - where: 'note 28:6 “The king as God''s son”'
    claim: '“Son of God” was understood as a title for the king; declaring someone God''s son was a way of declaring him king'
    key: sc-knowhy-865
    url: 'https://scripturecentral.org/knowhy/why-does-god-declare-jesus-to-be-his-son'
    quote: 'the phrase “son of God” would have been understood as a title for the king. Thus, declaring someone to be a “son of God” would have been one way of declaring them to be the king.'
  - where: 'note 28:6 “The king as God''s son”'
    claim: 'Jesus is the Son of God in two ways: the Only Begotten in the flesh and the true King'
    key: sc-knowhy-865
    url: 'https://scripturecentral.org/knowhy/why-does-god-declare-jesus-to-be-his-son'
    quote: 'Jesus truly is the Son of God in two ways: the only begotten Son of God in the flesh, as well as the ultimate King.'
  - where: 'note 28:6 “The king as God''s son”'
    claim: 'The kings of Israel and Judah failed; Jesus would not fail'
    key: sc-knowhy-865
    url: 'https://scripturecentral.org/knowhy/why-does-god-declare-jesus-to-be-his-son'
    quote: 'The earthly kings of Israel and Judah ultimately failed to do everything they were supposed to do, but Jesus would not fail'
  - where: 'note 28:6 “The king as God''s son”'
    claim: 'Hebrews 1:5 applies Psalm 2:7 and Nathan''s promise to the Son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/1?lang=eng'
    quote: 'For unto which of the angels said he at any time, Thou art my Son, this day have I begotten thee? And again, I will be to him a Father, and he shall be to me a Son?'

  - where: 'note 28:7 “The condition on the promise”'
    claim: '“Be constant” is the verb ḥāzaq (H2388), the same as “be strong” in verses 10 and 20'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: 'יֶחֱזַ֗ק … חֲזַ֥ק … חֲזַ֤ק'
  - where: 'note 28:7 “The condition on the promise”'
    claim: 'As with Moses, the Lord gave Solomon specific instructions while building, with the condition of 1 Kgs. 6:11–12'
    key: cowan-ot-temples
    url: 'https://rsc.byu.edu/ascending-mountain-lord/what-old-testament-temples-can-teach-us-about-our-own-temple-activity'
    quote: 'As had been the case with Moses building the tabernacle, the Lord gave Solomon specific instructions: “And the word of the Lord came to Solomon, saying, concerning this house which thou art in building, if thou wilt walk in my statutes'
  - where: 'note 28:7 “The condition on the promise”'
    claim: 'The condition repeated after the dedication, and the kingdom rent from Solomon for not keeping the covenant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: 'Wherefore the LORD said unto Solomon, Forasmuch as this is done of thee, and thou hast not kept my covenant and my statutes, which I have commanded thee, I will surely rend the kingdom from thee, and will give it to thy servant.'
  - where: 'note 28:7 “The condition on the promise”'
    claim: 'Talmage: when Solomon was led astray, the gift was depreciated by the giver and the LORD withdrew from the house'
    key: talmage-house-of-the-lord
    url: 'https://www.gutenberg.org/ebooks/45149.html.images'
    quote: 'Solomon the king, the man of wisdom, the master-builder, had been led astray by the wiles of idolatrous women … The gift became depreciated by the perfidy of the giver, and Jehovah withdrew His protecting presence from the place no longer holy.'

  - where: 'note 28:9 “A whole heart and a willing soul”'
    claim: 'The Hebrew of “perfect heart” is lēḇ šālēm; “willing mind” is nep̄eš ḥăpēṣâ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: 'בְּ/לֵ֤ב … שָׁלֵם֙ … וּ/בְ/נֶ֣פֶשׁ … חֲפֵצָ֔ה'
  - where: 'note 28:9 “A whole heart and a willing soul”'
    claim: 'šālēm means complete, whole (full weight, unhewn stones); with heart, a mind at peace with the LORD, keeping covenant relation; 1 Chr. 28:9 listed'
    key: bdb
    url: 'https://biblehub.com/hebrew/8003.htm'
    quote: 'לֵבָב שָׁלֵם עִם י a mind at peace with ׳י, keeping covt. relation, hence complete, perfect, 1 Kings 8:61; 1 Kings 11:4; … לֵב 1 Chronicles 28:9; 1 Chronicles 29:9.'
  - where: 'note 28:9 “A whole heart and a willing soul”'
    claim: 'šālēm: complete, full weight, whole (unhewn) stones'
    key: bdb
    url: 'https://biblehub.com/hebrew/8003.htm'
    quote: 'a. full, perfect: אָבָן שְׁלֵמָה full weight Deuteronomy 25:15 … of stones, whole (in natural condition, unhewn) Deuteronomy 27:6'
  - where: 'note 28:9 “A whole heart and a willing soul”'
    claim: 'ḥāpēṣ: delighting in, having pleasure in; nepeš ḥăpēṣâ “willing soul” at 1 Chr. 28:9'
    key: bdb
    url: 'https://biblehub.com/hebrew/2655.htm'
    quote: 'חָפֵץ verbal adjective delighting in, having pleasure in; … נֶפֶשׁ חֲפֵצָה willing soul 1 Chronicles 28:9'
  - where: 'note 28:9 “A whole heart and a willing soul”'
    claim: 'A modern translation: “with single mind and willing heart”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Chronicles+28&version=NRSVUE'
    quote: '“And you, my son Solomon, know the God of your father, and serve him with single mind and willing heart, for the Lord searches every mind and understands every plan and thought.'

  - where: 'note 28:12 “By the spirit, in writing”'
    claim: 'The Hebrew is bārûaḥ ʿimmô, “in the spirit with him”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: 'בָ/ר֨וּחַ֙ … עִמּ֔/וֹ'
  - where: 'note 28:12 “By the spirit, in writing”'
    claim: 'One older reading: what came to David by revelation and rested with him; “in his spirit” less likely'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/28.htm'
    quote: 'that he had by the spirit] i.e. that had come to him by revelation and rested with him waiting for realisation. R.V. marg., that he had in his spirit, a less likely translation.'
  - where: 'note 28:12 “By the spirit, in writing”'
    claim: 'Another older reading: what David''s own spirit had designed'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/28.htm'
    quote: 'And the pattern, i.e., the description of all that was in the spirit with him, i.e., what his spirit had designed'
  - where: 'note 28:12 “By the spirit, in writing”'
    claim: 'A modern translation: “all that he had in mind”; verse 19 “in writing at the Lord''s direction”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Chronicles+28&version=NRSVUE'
    quote: '12 and the plan of all that he had in mind for the courts of the house of the Lord'
  - where: 'note 28:12 “By the spirit, in writing”'
    claim: 'Keil reads verse 19 by the idiom of the LORD''s hand on a prophet (2 Kgs. 3:15; Ezek. 1:3): a writing by divine revelation; David had not invented the pattern but drew it up under inspiration'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/28.htm'
    quote: 'according to the analogy of the phrase עלי יהוה יד היתה (2 Kings 3:15; Ezekiel 1:3; Ezekiel 3:14, etc.), a writing coming by divine revelation … he had not himself invented the pattern which he had committed to writings'
  - where: 'note 28:12 “By the spirit, in writing”'
    claim: 'Cambridge on verse 19: probably not a book but a plan or patterns shown in vision; compares Ex. 25:9'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/28.htm'
    quote: 'The “writing” here mentioned probably means not a book, but a plan or series of patterns shewn to him in a vision. Cp. Exodus 25:9.'

  - where: 'note 28:18 “The chariot of the cherubims”'
    claim: 'The cherubim, not the ark, are the chariot on which God is throned; from Ps. 18 (rode upon a cherub); LXX and Vulgate made it a cherubim-chariot; nothing in the sculptured cherubim suggests a chariot'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/28.htm'
    quote: 'The cherubim, not the ark, are the chariot upon which God enters or is throned; cf. Psalm 18:11; Psalm 99:1; Exodus 25:22. … the lxx and Vulg. have made a cherubim-chariot out of the words'
  - where: 'note 28:18 “The chariot of the cherubims”'
    claim: 'Keil: the idea of a chariot does not appear in the two sculptured cherubim'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/28.htm'
    quote: 'the idea of a chariot of the cherubim does not at all appear in the two sculptured cherubim upon the ark, nor yet in our passage'
  - where: 'note 28:18 “The chariot of the cherubims”'
    claim: 'The Revised Version: “the chariot, even the cherubim”'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/28.htm'
    quote: 'the chariot of the cherubims] R.V. the chariot, even the cherubim. Cp. Ezekiel 1:5-10; Ezekiel 1:15-17.'

  - where: 'note 28:19 “Temples built to a revealed pattern”'
    claim: 'In all ages the Savior has revealed the patterns for his houses; Moses told to build after the pattern'
    key: cowan-ot-temples
    url: 'https://rsc.byu.edu/ascending-mountain-lord/what-old-testament-temples-can-teach-us-about-our-own-temple-activity'
    quote: 'In all ages the Savior has revealed the patterns according to which his sacred houses were to be built.'
  - where: 'note 28:19 “Temples built to a revealed pattern”'
    claim: 'Kirtland: not after the manner of the world; design shown to three; the building appeared in vision as they prayed; the hall matched'
    key: cowan-ot-temples
    url: 'https://rsc.byu.edu/ascending-mountain-lord/what-old-testament-temples-can-teach-us-about-our-own-temple-activity'
    quote: 'On an occasion when Joseph Smith invited his counselors in the First Presidency to kneel with him in prayer, the building appeared before them in vision. … he affirmed that the hall in which they were convened coincided in every detail with the vision given to the Prophet.'
  - where: 'note 28:19 “Temples built to a revealed pattern”'
    claim: 'Nauvoo: Joseph Smith saw the building in vision and would have it built according to the pattern shown him'
    key: cowan-ot-temples
    url: 'https://rsc.byu.edu/ascending-mountain-lord/what-old-testament-temples-can-teach-us-about-our-own-temple-activity'
    quote: '“‘I have seen in vision the splendid appearance of that building illuminated, and will have it built according to the pattern shown me.’”'
  - where: 'note 28:19 “Temples built to a revealed pattern”'
    claim: 'D&C 95:14: built after the manner shown to three'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/95?lang=eng'
    quote: 'Therefore, let it be built after the manner which I shall show unto three of you, whom ye shall appoint and ordain unto this power.'

  - where: christ
    claim: 'Jesus the Son of God in the flesh and the true King, who does not fail'
    key: sc-knowhy-865
    url: 'https://scripturecentral.org/knowhy/why-does-god-declare-jesus-to-be-his-son'
    quote: 'Unlike earthly rulers who fail, everyone can trust Christ to live up to what kings were always supposed to be.'
  - where: christ
    claim: 'Jesus is the Son of God in two ways: the Only Begotten in the flesh and the ultimate King'
    key: sc-knowhy-865
    url: 'https://scripturecentral.org/knowhy/why-does-god-declare-jesus-to-be-his-son'
    quote: 'Jesus truly is the Son of God in two ways: the only begotten Son of God in the flesh, as well as the ultimate King.'
  - where: christ
    claim: 'D&C 64:34: the Lord requireth the heart and a willing mind'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/64?lang=eng'
    quote: 'Behold, the Lord requireth the heart and a willing mind; and the willing and obedient shall eat the good of the land of Zion in these last days.'
  - where: explore
    claim: 'D&C 124:42: the Lord will show Joseph all things pertaining to the house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/124?lang=eng'
    quote: 'And I will show unto my servant Joseph all things pertaining to this house, and the priesthood thereof, and the place whereon it shall be built.'
