chapter: 2
claims:
  - where: when
    claim: 'Chronicles was written after the Babylonian exile'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'The authorship of Chronicles remains uncertain, but most scholars suggest that the books were likely written after the Babylonian exile, possibly in the fourth century BC.'
  - where: setting
    claim: 'Written after the Babylonian exile'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'most scholars suggest that the books were likely written after the Babylonian exile, possibly in the fourth century BC.'
  - where: setting
    claim: 'One older reading: the order of the tribes is at first geographical, Judah and Simeon the southern tribes, then the eastern tribes Reuben, Gad, Manasseh'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/2.htm'
    quote: 'The order in which the tribes are mentioned is at first geographical, Judah and Simeon the southern tribes first, then the eastern tribes Reuben, Gad, Manasseh; the rest follow in no fixed order.'
  - where: setting
    claim: 'Judah''s five sons follow Genesis 38 and 46:12; the sons of Pharez Genesis 46:12 and Numbers 26:21'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/2.htm'
    quote: 'The five sons of Judah are given according to Genesis 38, as the remark on Er which is quoted from Genesis 38:7 of that chapter shows, while the names of the five sons are to be found also in Genesis 46:12. The two sons of Pharez are according to Genesis 46:12, cf. Numbers 26:21.'
  - where: setting
    claim: 'The line from Ram to Jesse is also in Ruth 4; only here is Nahshon marked as prince of Judah, which he was at the exodus'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/2.htm'
    quote: 'This genealogy is also to be found in Ruth 1 Chronicles Ruth 4:19-21; but only here is Nahshon made more prominent than the others, by the addition, "prince of the sons of Judah." Nahshon was a prince of Judah at the exodus of the Israelites from Egypt (Numbers 1:7; Numbers 2:3; Numbers 7:12).'
  - where: thread
    claim: 'Chelubai is another form of Caleb; Ram''s line, given before that of his older brother Jerahmeel, includes David'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/2.htm'
    quote: 'The descendants of his younger brother Ram are given first because they include David and his family. Chelubai] Another form of “Caleb”; see 1 Chronicles 2:42.'
  - where: thread
    claim: 'Jerahmeel was Hezron''s firstborn'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/2?lang=eng'
    quote: 'And the sons of Jerahmeel the firstborn of Hezron were, Ram the firstborn, and Bunah, and Oren, and Ozem, and Ahijah.'
  - where: note 2:3 “Why Er's death is in the list”
    claim: 'Verse 3 repeats Genesis 38:7 on Er'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/38?lang=eng'
    quote: 'And Er, Judah’s firstborn, was wicked in the sight of the Lord; and the Lord slew him.'
  - where: note 2:3 “Why Er's death is in the list”
    claim: 'Numbers records that Er and Onan died in Canaan; Judah''s families are from Shelah, Pharez and Zerah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/26?lang=eng'
    quote: 'The sons of Judah were Er and Onan: and Er and Onan died in the land of Canaan.'
  - where: note 2:6 “Ethan and Heman, the Ezrahites”
    claim: 'Ezrahite means of the family of Zerah; the lexicon takes Ethan and Heman of 1 Kgs 4:31 (Heb. 5:11) and the psalm titles as the sons of Zerah of 1 Chr. 2:6'
    key: bdb
    url: 'https://biblehub.com/hebrew/250.htm'
    quote: 'אֶזְרָחִי adjective, of a people i.e. of family of זֶרַח, only in ׳אֵיתָן הָא 1 Kings 5:11 (ᵐ5L Ἰσραηλίτης), Psalm 89:1 (ᵐ5 id.), and Psalm 88:1 ׳הֵימָן הָא both sons of זֶרַח (1 Chronicles 2:6).'
  - where: note 2:6 “Ethan and Heman, the Ezrahites”
    claim: 'Solomon was wiser than Ethan the Ezrahite, Heman, Chalcol and Darda, the sons of Mahol'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/4?lang=eng'
    quote: 'than Ethan the Ezrahite, and Heman, and Chalcol, and Darda, the sons of Mahol'
  - where: note 2:7 “Achar, the troubler of Israel”
    claim: 'In Hebrew the name Achar (H5917) is followed by the participle of the verb ʿākar (H5916); “the thing accursed” is ḥērem (H2764)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: 'עָכָר֙ עוֹכֵ֣ר יִשְׂרָאֵ֔ל'
  - where: note 2:7 “Achar, the troubler of Israel”
    claim: 'ʿākar means stir up, disturb, trouble; the participle is used of Achar in 1 Chr. 2:7 and in 1 Kgs. 18:17; the verb in Josh. 7:25'
    key: bdb
    url: 'https://biblehub.com/hebrew/5916.htm'
    quote: 'עָכַר verb stir up, disturb, trouble'
  - where: note 2:7 “Achar, the troubler of Israel”
    claim: 'The participle of the verb in 1 Kgs 18:17 and 1 Chr 2:7; with accusative of person in Josh 7:25'
    key: bdb
    url: 'https://biblehub.com/hebrew/5916.htm'
    quote: 'Participle עֹכֵר 1 Kings 18:17 3t., עוֺכֵר 1 Chronicles 2:7'
  - where: note 2:7 “Achar, the troubler of Israel”
    claim: 'Chronicles identifies Achan as Achar, the troubler of Israel, ʿakhar ʿokher Yisrael; the accursed thing is the ḥērem, the dedicated spoil of Jericho; the valley of Achor puns on Achan and on “trouble”'
    key: ot-minute-josh-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-7'
    quote: 'Compare 1 Chronicles 2:7, which identifies Achan as “Achar, the troubler of Israel” (ꜥakhar ꜥokher Yisrael).'
  - where: note 2:7 “Achar, the troubler of Israel”
    claim: 'Achan coveted and withheld dedicated war booty from Jericho; the valley of Achor is a pun on his name and on Joshua''s “troubled”'
    key: ot-minute-josh-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-7'
    quote: 'His crime was having coveted and withheld some of the dedicated war booty from the spoils of Jericho (verses 16–26).'
  - where: note 2:7 “Achar, the troubler of Israel”
    claim: 'Achan was a man of Judah whose theft of Jericho''s spoil brought defeat at Ai'
    key: bd-achan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/achan?lang=eng'
    quote: 'A man of the tribe of Judah who seized and attempted to hide the spoils from the battle of Jericho, against the counsel of Joshua. His disobedience resulted in Israel’s defeat at Ai.'
  - where: note 2:7 “Achar, the troubler of Israel”
    claim: 'Joshua gives Achan''s line as son of Carmi, son of Zabdi, son of Zerah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/7?lang=eng'
    quote: 'for Achan, the son of Carmi, the son of Zabdi, the son of Zerah, of the tribe of Judah, took of the accursed thing'
  - where: note 2:15 “David the seventh”
    claim: 'Samuel gives Jesse eight sons'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/17?lang=eng'
    quote: 'Now David was the son of that Ephrathite of Beth-lehem-judah, whose name was Jesse; and he had eight sons'
  - where: note 2:15 “David the seventh”
    claim: 'Seven of Jesse''s sons passed before Samuel before David was sent for'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/16?lang=eng'
    quote: 'Again, Jesse made seven of his sons to pass before Samuel. And Samuel said unto Jesse, The Lord hath not chosen these.'
  - where: note 2:15 “David the seventh”
    claim: 'Samuel names Jesse''s three eldest Eliab, Abinadab and Shammah (Chronicles'' Shimma)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/16?lang=eng'
    quote: 'Then Jesse made Shammah to pass by.'
  - where: note 2:15 “David the seventh”
    claim: 'One older reading: one son seems deliberately passed over, perhaps because he had no children; Elihu of 27:18 is probably Eliab, not an eighth brother'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/2.htm'
    quote: 'Jesse had eight sons (1 Samuel 17:12; cp. 1 Samuel 16:10-11). Here one seems deliberately passed over, perhaps because he had no children. (The Elihu “one of David’s brethren” of 1 Chronicles 27:18 is probably to be identified with Eliab and not to be regarded as an eighth brother.)'
  - where: note 2:18 “Caleb the son of Hezron”
    claim: 'Chelubai (2:9) is a form of Caleb; nothing shows how this Caleb is related to Caleb son of Jephunneh; perhaps they are one; both of Judah'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/2.htm'
    quote: 'Called Chelubai (1 Chronicles 2:9) and Caleb the son of Hezron (1 Chronicles 2:18). There is nothing to shew what relationship existed between this Caleb and Caleb son of Jephunneh (1 Chronicles 4:15 and Numbers 13:6). Perhaps they are to be identified; cp. 1 Chronicles 2:49, note. Both are assigned to the tribe of Judah.'
  - where: note 2:18 “Caleb the son of Hezron”
    claim: 'Caleb son of Jephunneh also had a daughter Achsah'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/2.htm'
    quote: 'The Caleb of Jdg 1:12 (who according to Joshua 15:13-19 was Caleb son of Jephunneh) also had a daughter Achsah.'
  - where: note 2:18 “Caleb the son of Hezron”
    claim: 'Caleb son of Jephunneh was a spy who brought back a true report and later received Hebron'
    key: bd-caleb
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/caleb?lang=eng'
    quote: 'Son of Jephunneh, of the tribe of Judah; one of the princes or heads of tribes sent by Moses to search the land of Canaan in the second year after the Exodus. He and Joshua alone brought back a true report'
  - where: note 2:18 “Caleb the son of Hezron”
    claim: 'Chronicles lists the sons of Caleb son of Jephunneh separately'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/4?lang=eng'
    quote: 'And the sons of Caleb the son of Jephunneh; Iru, Elah, and Naam: and the sons of Elah, even Kenaz.'
  - where: note 2:18 “Caleb the son of Hezron”
    claim: 'Caleb gave his daughter Achsah to the man who took Kirjath-sepher'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/15?lang=eng'
    quote: 'And Caleb said, He that smiteth Kirjath-sepher, and taketh it, to him will I give Achsah my daughter to wife.'
  - where: note 2:18 “Caleb the son of Hezron”
    claim: 'Bezaleel the tabernacle builder is son of Uri son of Hur of Judah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/31?lang=eng'
    quote: 'See, I have called by name Bezaleel the son of Uri, the son of Hur, of the tribe of Judah:'
  - where: note 2:51 “Father of Beth-lehem”
    claim: 'Among the senses of ʾāb the lexicon lists ruler, chief (late), citing 1 Chr. 2:24, 42'
    key: bdb
    url: 'https://biblehub.com/hebrew/1.htm'
    quote: '9 specifically, ruler, chief (late) 1 Chronicles 2:24,42 (twice in verse); etc.'
  - where: note 2:51 “Father of Beth-lehem”
    claim: 'Verse 51 calls Salma father of Beth-lehem with the word ʾăḇî'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: 'שַׂלְמָא֙ אֲבִ֣י בֵֽית לָ֔חֶם'
  - where: note 2:55 “Kenites in Judah's list”
    claim: 'The Kenites were probably a Midianite tribe; Moses'' marriage into Jethro''s family made for long friendship with Israel; the Rechabites belonged to this tribe (1 Chr. 2:55)'
    key: bd-kenites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/kenites?lang=eng'
    quote: 'Probably a Midianite tribe, descended from Abraham by his wife Keturah. Moses’ marriage with the daughter of Jethro, a prince and priest of Midian, was also a cause of the long-standing friendship between the Kenites and Israelites'
  - where: note 2:55 “Kenites in Judah's list”
    claim: 'The Bible Dictionary takes 1 Chr. 2:55 as placing the Rechabites among the Kenites'
    key: bd-kenites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/kenites?lang=eng'
    quote: 'The Rechabites were a sect or family belonging to this tribe (1 Chr. 2:55).'
  - where: note 2:55 “Kenites in Judah's list”
    claim: 'The Kenites went up with Judah and dwelt among the people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/1?lang=eng'
    quote: 'And the children of the Kenite, Moses’ father in law, went up out of the city of palm trees with the children of Judah into the wilderness of Judah'
  - where: christ
    claim: 'Matthew''s genealogy of Jesus runs through Pharez, Hezron and Ram'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/1?lang=eng'
    quote: 'And Judas begat Phares and Zara of Thamar; and Phares begat Esrom; and Esrom begat Aram;'
  - where: christ
    claim: 'The Bible Dictionary reads John the Baptist''s rebuke as against using lineage as a substitute for righteousness'
    key: bd-genealogy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genealogy?lang=eng'
    quote: 'See Matt. 3:9 and Luke 3:8, wherein John the Baptist rebuked those who put too much emphasis on ancestry and attempted to use lineage as a substitute for righteousness'
  - where: parallels
    claim: 'The line from Pharez to David stands also in Ruth 4 and Matthew 1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/1?lang=eng'
    quote: 'And Judas begat Phares and Zara of Thamar; and Phares begat Esrom; and Esrom begat Aram;'
