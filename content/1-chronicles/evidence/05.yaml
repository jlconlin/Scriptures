chapter: 5
claims:
  - where: 'setting'
    claim: 'Reuben settled east of the Jordan and the tribe dwindled to political unimportance'
    key: bd-reuben
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/reuben?lang=eng'
    quote: 'settled east of Jordan (Num. 32); … The tribe’s numbers gradually diminished, and though it continued to exist as a tribe, it became politically unimportant.'
  - where: 'setting'
    claim: 'Verses 25–26 conclude the register of the two and a half tribes east of the Jordan'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/5.htm'
    quote: '1 Chronicles 5:25 and 1 Chronicles 5:26 form the conclusion of the register of the two and a half trans-Jordanic tribes.'
  - where: 'setting'
    claim: 'The Church''s chapter heading summarizes the captivity'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/5?lang=eng'
    quote: 'The Assyrians carry the Reubenites, Gadites, and half of Manasseh into captivity.'
  - where: 'thread'
    claim: 'Chronicles and Kings agree on blessings for righteousness and punishment for sin, but in Chronicles results usually come promptly'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'Both Chronicles and the Deuteronomistic History are in broad agreement on the issue of blessings for righteousness and punishment for unrighteousness … rewards and punishments are not usually delayed in Chronicles'
  - where: 'note 5:1 “Why Joseph''s sons had Reuben''s birthright”'
    claim: 'The birthright included land inheritance and authority to preside, and could be lost for unrighteousness, as by Esau and Reuben'
    key: bd-birthright
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/birthright?lang=eng'
    quote: 'This generally included a land inheritance as well as the authority to preside. … one who was the firstborn losing his birthright because of unrighteousness … such is the case with Esau (Gen. 25:24–34; 27) and Reuben (1 Chr. 5:1–2; Jer. 31:9).'
  - where: 'note 5:1 “Why Joseph''s sons had Reuben''s birthright”'
    claim: 'Joseph, firstborn of the second wife Rachel, was second in line for the birthright though eleventh born; Reuben''s sin was with Bilhah'
    key: ludlow-birthright
    url: 'https://www.churchofjesuschrist.org/study/ensign/1980/09/i-have-a-question/what-laws-governed-the-inheritance-of-birthright-in-the-old-testament?lang=eng'
    quote: 'When Reuben proved to be unworthy by committing adultery with Bilhah … the birthright went to the firstborn son of the second wife—Joseph, the son of Rachel (see 1 Chr. 5:1). Although Joseph was the eleventh-born son … he was second in line'
  - where: 'note 5:1 “Why Reuben is still listed first”'
    claim: 'The subject of the verb is Joseph, who was not registered as firstborn; the rabbis (Kimchi) saw this'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/5.htm'
    quote: '"he was not to register," i.e., "he was not to be registered." The subject is Joseph, as the Rabbins, e.g., Kimchi, have perceived. The clauses after הוּא כּי form a parenthesis'
  - where: 'note 5:1 “Why Reuben is still listed first”'
    claim: 'Joseph''s genealogy is not put before Reuben''s; in the confusion of claims the natural order is followed'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/5.htm'
    quote: 'though the birthright of Reuben has been given to Joseph, yet the genealogy of Joseph is not to be given before that of Reuben. … In this confusion of claims the natural order is followed and the genealogy of Reuben is given first.'
  - where: 'note 5:2 “The ruler from Judah”'
    claim: 'nagid means leader, ruler, prince, literally probably one in front'
    key: bdb
    url: 'https://biblehub.com/hebrew/5057.htm'
    quote: 'נָגִיד noun masculine leader (literally probably one in front), ruler, prince'
  - where: 'note 5:2 “The ruler from Judah”'
    claim: 'The Church''s footnote to “ruler” points to Micah 5:2 and Matt. 2:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/5?lang=eng'
    quote: '2b “ruler”: Micah 5:2; Matt. 2:6; John 7:42.'
  - where: 'note 5:10 “Who the Hagarites were”'
    claim: 'Psalm 83 names the Hagarenes beside the Ishmaelites among Israel''s enemies'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/83?lang=eng'
    quote: 'The tabernacles of Edom, and the Ishmaelites; of Moab, and the Hagarenes;'
  - where: 'note 5:10 “Who the Hagarites were”'
    claim: 'Jetur and Naphish are named among the sons of Ishmael in 1 Chr. 1:31'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/1?lang=eng'
    quote: 'Jetur, Naphish, and Kedemah'
  - where: 'note 5:10 “Who the Hagarites were”'
    claim: 'Jetur and Naphish are named among the sons of Ishmael in Gen. 25:15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/25?lang=eng'
    quote: 'Hadar, and Tema, Jetur, Naphish, and Kedemah'
  - where: 'note 5:20 “Helped because they trusted”'
    claim: 'Righteousness leads to success against enemies'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'The Deuteronomistic History sometimes takes the idea that Judah will be blessed for righteousness and cursed for unrighteousness and applies it to whether people will be victorious against invaders. … Thus, righteousness leads to success against enemies.'
  - where: 'note 5:20 “Helped because they trusted”'
    claim: 'In Chronicles rewards and punishments usually come immediately'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'rewards and punishments are not usually delayed in Chronicles, and people are often punished for sins or rewarded for righteousness immediately.'
  - where: 'note 5:20 “Helped because they trusted”'
    claim: 'The Church''s footnote to “helped” points to Alma 57:26; Helaman ascribes the preservation to God''s power and their faith; they trust God continually'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/57?lang=eng'
    quote: 'And we do justly ascribe it to the miraculous power of God, because of their exceeding faith … they are young, and their minds are firm, and they do put their trust in God continually.'
  - where: 'note 5:20 “Helped because they trusted”'
    claim: 'The footnote to “helped” in 1 Chr. 5:20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/5?lang=eng'
    quote: '20a “helped”: Alma 57:26 (25–27).'
  - where: 'note 5:20 “Helped because they trusted”'
    claim: 'The Church''s footnote to “entreated” points to Gen. 25:21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/5?lang=eng'
    quote: '20b “entreated”: Gen. 25:21.'
  - where: 'note 5:20 “Helped because they trusted”'
    claim: 'Isaac entreated the LORD and the LORD was entreated of him, and Rebekah conceived'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/25?lang=eng'
    quote: 'And Isaac entreated the LORD for his wife, because she was barren: and the LORD was entreated of him, and Rebekah his wife conceived.'
  - where: 'note 5:1 “Why Joseph''s sons had Reuben''s birthright”'
    claim: 'The blessing came upon Joseph, the firstborn of Jacob and Rachel'
    key: bd-reuben
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/reuben?lang=eng'
    quote: 'The blessing therefore came upon Joseph, the firstborn of Jacob and Rachel (1 Chr. 5:1–2).'
  - where: 'note 5:1 “Why Joseph''s sons had Reuben''s birthright”'
    claim: 'Joseph''s double portion was shared by Ephraim and Manasseh, adopted by Jacob, each a separate tribe'
    key: scripture-helps-gen-42-50
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/11-genesis-42-50?lang=eng'
    quote: 'Joseph’s double portion was shared by his sons, Ephraim and Manasseh. Because of their adoption by Jacob, Joseph’s sons were now counted as children of Israel, and each son’s descendants became a separate tribe of Israel.'
  - where: 'note 5:2 “The ruler from Judah”'
    claim: 'nagid is used of David as leader over Israel, and 1 Chr. 5:2 is listed with those uses'
    key: bdb
    url: 'https://biblehub.com/hebrew/5057.htm'
    quote: '2 Samuel 7:8; 1 Chronicles 11:2; 1 Chronicles 17:7; compare also 1 Chronicles 5:2'
  - where: 'note 5:2 “The ruler from Judah”'
    claim: 'nagid is used of Judah at 1 Chr. 28:4'
    key: bdb
    url: 'https://biblehub.com/hebrew/5057.htm'
    quote: 'of Judah 1 Chronicles 28:4'
  - where: 'note 5:2 “The ruler from Judah”'
    claim: 'The chapter heading: Judah and his descendants became rulers in Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/5?lang=eng'
    quote: 'Judah and his descendants became rulers in Israel'
  - where: 'note 5:2 “The ruler from Judah”'
    claim: 'Micah 5:2: out of Beth-lehem shall come forth the ruler in Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/5?lang=eng'
    quote: 'yet out of thee shall he come forth unto me that is to be ruler in Israel'
  - where: 'note 5:2 “The ruler from Judah”'
    claim: 'John 7:42: Christ comes of the seed of David and out of Bethlehem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/7?lang=eng'
    quote: 'Christ cometh of the seed of David, and out of the town of Bethlehem, where David was'
  - where: 'note 5:26 “Why the eastern tribes went into exile”'
    claim: 'Pul is most likely another name of Tiglath-pileser III'
    key: bd-pul
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pul?lang=eng'
    quote: 'King of Assyria, most likely another name of Tiglath-pileser Ⅲ'
  - where: 'note 5:26 “Why the eastern tribes went into exile”'
    claim: 'The Church''s footnote to “carried” points to 2 Kgs. 15:29'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/5?lang=eng'
    quote: '26a “carried”: 2 Kgs. 15:29.'
  - where: 'note 5:26 “Why the eastern tribes went into exile”'
    claim: 'zanah figuratively of intercourse with other deities considered as harlotry, citing 1 Chr. 5:25'
    key: bdb
    url: 'https://biblehub.com/hebrew/2181.htm'
    quote: '3 of intercourse with other deities, considered as harlotry … Judges 2:17; Judges 8:27,33; 1 Chronicles 5:25'
  - where: 'christ'
    claim: 'Reuben lost the birthright because of unrighteousness'
    key: bd-birthright
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/birthright?lang=eng'
    quote: 'one who was the firstborn losing his birthright because of unrighteousness'
  - where: 'christ'
    claim: 'The footnote to “ruler” points to Micah 5:2 and Matt. 2:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/5?lang=eng'
    quote: '2b “ruler”: Micah 5:2; Matt. 2:6; John 7:42.'
  - where: 'explore'
    claim: 'The same phrase “stirred up the spirit” at 2 Chr. 36:22'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/5.htm'
    quote: '26. stirred up the spirit] Cp. 2 Chronicles 21:16; 2 Chronicles 36:22.'
  - where: 'note 5:1 “Why Joseph''s sons had Reuben''s birthright”'
    claim: 'The birthright son was entitled to a double portion'
    key: ludlow-birthright
    url: 'https://www.churchofjesuschrist.org/study/ensign/1980/09/i-have-a-question/what-laws-governed-the-inheritance-of-birthright-in-the-old-testament?lang=eng'
    quote: 'The birthright son was entitled to a double portion (that is, twice as much as any other son) of the father’s inheritance'
  - where: 'note 5:1 “Why Joseph''s sons had Reuben''s birthright”'
    claim: 'Jacob adopted Ephraim and Manasseh as his own, as Reuben and Simeon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/48?lang=eng'
    quote: 'And now thy two sons, Ephraim and Manasseh, which were born unto thee in the land of Egypt before I came unto thee into Egypt, are mine; as Reuben and Simeon, they shall be mine.'
  - where: 'note 5:2 “The ruler from Judah”'
    claim: 'David says the LORD chose Judah to be the ruler and David from it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/28?lang=eng'
    quote: 'for he hath chosen Judah to be the ruler; and of the house of Judah, the house of my father; and among the sons of my father he liked me to make me king over all Israel'
  - where: 'note 5:26 “Why the eastern tribes went into exile”'
    claim: 'Pul or Pulu took the throne name Tiglath-pileser'
    key: sc-knowhy-536
    url: 'https://scripturecentral.org/knowhy/why-did-benjamin-give-multiple-names-for-jesus-at-the-coronation-of-his-son-mosiah'
    quote: 'The Mesopotamian king Pul or Pulu took the throne name Tiglath-Pileser, meaning “my trust is the heir of [the temple of the god] Esharra” (cf. 2 Kings 15:19, 29; 16:7, 10; 1 Chronicles 5:26).'
  - where: 'note 5:26 “Why the eastern tribes went into exile”'
    claim: 'The chapter heading: the Assyrians carried the eastern tribes into captivity'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/5?lang=eng'
    quote: 'The Assyrians carry the Reubenites, Gadites, and half of Manasseh into captivity.'
