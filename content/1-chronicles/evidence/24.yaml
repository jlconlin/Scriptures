chapter: 24
claims:
  - where: 'when'
    claim: 'David ordered the Levites when old, after making Solomon king'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/23?lang=eng'
    quote: 'So when David was old and full of days, he made Solomon his son king over Israel.'
  - where: 'setting'
    claim: 'Chapter 23 divides the Levites into courses by their three families'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/23?lang=eng'
    quote: 'And David divided them into courses among the sons of Levi, namely, Gershon, Kohath, and Merari.'
  - where: 'setting'
    claim: 'The Church''s footnote at verse 1 points to 2 Chr. 35:4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/24?lang=eng'
    quote: '1a “divisions”: 2 Chr. 35:4.'
  - where: 'setting'
    claim: 'David divided the priests into twenty-four courses; four houses returned and were divided again into twenty-four; each served a week'
    key: bd-priests
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/priests?lang=eng'
    quote: 'David divided the priestly families into twenty-four courses. Four only returned from the captivity, and these were again subdivided into twenty-four. Each course officiated for a week at a time'
  - where: 'thread'
    claim: 'The Church''s chapter heading: divided into groups and assigned duties by lot'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/24?lang=eng'
    quote: 'The sons of Aaron and the rest of the sons of Levi are divided into groups and assigned their duties by lot.'
  - where: 'thread'
    claim: 'Verse 19: the priestly service as a whole was prescribed by the LORD in the law'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/24.htm'
    quote: 'according to the lawful arrangement which was made by Aaron for their official service, as Jahve the God of Israel had commanded. This last clause refers to the fact that the priestly service in all its parts was prescribed by Jahve in the law.'
  - where: 'note 24:3 “Two houses of priests”'
    claim: 'Nadab and Abihu offered strange fire and died before the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/10?lang=eng'
    quote: 'And there went out fire from the Lord, and devoured them, and they died before the Lord.'
  - where: 'note 24:3 “Two houses of priests”'
    claim: 'Eleazar and Ithamar were Aaron''s chief assistants after Nadab and Abihu died; high priests from Eleazar except Eli to Abiathar, of Ithamar'
    key: bd-eleazar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/eleazar?lang=eng'
    quote: 'Eleazar and Ithamar were Aaron’s chief assistants after the death of Nadab and Abihu by fire … All the high priests until the Maccabean period were descended from Eleazar, with the exception of those from Eli to Abiathar, inclusive, who belonged to the family of Ithamar.'
  - where: 'note 24:3 “Two houses of priests”'
    claim: 'The high priesthood passed to Ithamar''s family in Eli and returned to Eleazar''s in Zadok'
    key: bd-ithamar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ithamar?lang=eng'
    quote: 'The high priesthood passed into his family in the person of Eli but returned to the family of Eleazar, Ithamar’s elder brother, in the person of Zadok'
  - where: 'note 24:3 “Two houses of priests”'
    claim: 'Zadok and Abiathar served side by side from Saul''s last years until Abiathar joined Adonijah and Zadok was put in his room'
    key: bd-zadok
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zadok?lang=eng'
    quote: 'During the latter years of Saul’s reign there seems to have been a double high priesthood: Abiathar, who belonged to the family of Ithamar, officiating in David’s camp, and Zadok at Gibeon, where the tabernacle was standing. This arrangement continued after David’s accession, but during the rebellion of Adonijah, Abiathar joined the rebels'
  - where: 'note 24:3 “Two houses of priests”'
    claim: 'Ahimelech and Abiathar are probably interchanged in this chapter, 2 Sam. 8:17 and 1 Chr. 18:16'
    key: bd-abiathar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abiathar?lang=eng'
    quote: 'Ahimelech and Abiathar are probably interchanged in 2 Sam. 8:17; 1 Chr. 18:16; 24:3, 31.'
  - where: 'note 24:5 “Why the order was drawn by lot”'
    claim: 'Lots used in scripture to make a choice; Proverbs 16:33 on the Lord''s hand'
    key: bd-lots-casting-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/lots-casting-of?lang=eng'
    quote: 'There are many instances in scripture of the use of lots for the purpose of making a choice (… Josh. 13:6; 14:1–2; … 1 Chr. 24:5, 31; 25:8; 26:13–14; Acts 1:26). Prov. 16:33 expresses a feeling on the subject of the Lord’s hand in the matter.'
  - where: 'note 24:5 “Why the order was drawn by lot”'
    claim: 'Verses 4–6 as the text gives them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/24?lang=eng'
    quote: 'And there were more chief men found of the sons of Eleazar than of the sons of Ithamar; and thus were they divided.'
  - where: 'note 24:10 “The course of Abijah, and Zacharias”'
    claim: 'Zacharias was of the course of Abia and served in the order of his course; the Church''s footnote at 1 Chr. 24:10 points to Luke 1:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'And it came to pass, that while he executed the priest’s office before God in the order of his course,'
  - where: 'note 24:10 “The course of Abijah, and Zacharias”'
    claim: 'The Church''s footnote at verse 10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/24?lang=eng'
    quote: '10a “Abijah”: Luke 1:5.'
  - where: 'note 24:10 “The course of Abijah, and Zacharias”'
    claim: 'Each course served a week, changing on the Sabbath; all at festivals'
    key: bd-priests
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/priests?lang=eng'
    quote: 'Each course officiated for a week at a time, the change being made on the Sabbath, between the morning and the evening sacrifices. All the courses officiated together at the great festivals.'
  - where: 'note 24:10 “The course of Abijah, and Zacharias”'
    claim: 'Abia is another spelling of Abijah'
    key: brown-tamid
    url: 'https://interpreterfoundation.org/journal/tamid-zacharias-and-the-second-temple'
    quote: 'Also spelled Abiah (see 1 Samuel 8:2; 1 Chronicles 2:24, 6:8, 7:8) or Abijah (see 1 Chronicles 24:10; 2 Chronicles 1:22, 12:16; 13:1, 17, 20, 21, 22; Nehemiah 10:7) in the King James Old Testament.'
  - where: 'note 24:10 “The course of Abijah, and Zacharias”'
    claim: 'About 7,200 priests in twenty-four courses; a priest served once every twenty-four weeks, about twice a year, besides the festivals'
    key: brown-tamid
    url: 'https://interpreterfoundation.org/journal/tamid-zacharias-and-the-second-temple'
    quote: 'These 24 courses involved about 7,200 priests … a priest like Zachariah would have had the opportunity to serve in the temple only once every 24 weeks, or approximately twice a year.'
  - where: 'note 24:10 “The course of Abijah, and Zacharias”'
    claim: 'Within a course duties were assigned by lot, giving each priest an equal opportunity'
    key: brown-tamid
    url: 'https://interpreterfoundation.org/journal/tamid-zacharias-and-the-second-temple'
    quote: 'each avodah (assignment or service) was assigned during one of four lotteries. … The lotteries allowed each priest an equal opportunity to participate in the day’s temple services.'
  - where: 'note 24:20 “The rest of the Levites, a generation on”'
    claim: 'Chapter 23 names Shebuel as chief of the sons of Gershom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/23?lang=eng'
    quote: 'Of the sons of Gershom, Shebuel was the chief.'
  - where: 'note 24:20 “The rest of the Levites, a generation on”'
    claim: 'Chapter 23 names Michah and Jesiah as the heads under Uzziel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/23?lang=eng'
    quote: 'Of the sons of Uzziel; Michah the first, and Jesiah the second.'
  - where: 'note 24:20 “The rest of the Levites, a generation on”'
    claim: 'Jehdeiah is Shubael''s son, head of the class'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/24.htm'
    quote: 'that is, of the chief Shubael, descended from Moses'' son Gershon (1 Chronicles 23:16), his son Jehdeiah, who as head and representative of the class made up of his sons, and perhaps also of his brothers, is alone mentioned.'
  - where: 'note 24:20 “The rest of the Levites, a generation on”'
    claim: 'No Gershonites in the list; Gershonite houses were over the treasures, so the list need not be incomplete (one older reading)'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/24.htm'
    quote: 'Several fathers''-houses of the Gershonites were, according to 1 Chronicles 26:20., entrusted with the oversight of the treasures of the sanctuary. … from the fact that the Gershonites are omitted from our section, we cannot conclude that our catalogue is mutilated.'
  - where: 'note 24:20 “The rest of the Levites, a generation on”'
    claim: 'Verse 31: the head of a house and his younger brother drew alike (one older reading)'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/24.htm'
    quote: 'the oldest among the brethren as his younger brethren. The Vulgate gives the meaning correctly: tam majores quam minores; omnes sors aequaliter dividebat.'
  - where: 'christ'
    claim: 'John the Baptist was a priest in the Aaronic order who prepared the way for and baptized Jesus, and conferred the Aaronic Priesthood in 1829'
    key: bd-aaronic-priesthood
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/aaronic-priesthood?lang=eng'
    quote: 'from Aaron until John the Baptist, who was a priest in the Aaronic order (D&C 84:26–27), and by this authority he prepared the way for and baptized Jesus. Nineteen centuries later this same John was sent'
  - where: 'christ'
    claim: 'D&C 13: John conferred the Priesthood of Aaron on Joseph and Oliver, never to be taken again'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/13?lang=eng'
    quote: 'Upon you my fellow servants, in the name of Messiah I confer the Priesthood of Aaron, which holds the keys of the ministering of angels, and of the gospel of repentance, and of baptism by immersion for the remission of sins'
  - where: 'setting'
    claim: 'Solomon appointed the courses of the priests according to the order of David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/8?lang=eng'
    quote: 'And he appointed, according to the order of David his father, the courses of the priests to their service'
  - where: 'setting'
    claim: 'Josiah told the Levites to prepare after their courses, according to the writing of David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/35?lang=eng'
    quote: 'after your courses, according to the writing of David king of Israel'
  - where: 'note 24:3 “Two houses of priests”'
    claim: 'Nadab and Abihu offered strange fire'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/10?lang=eng'
    quote: 'offered strange fire before the Lord, which he commanded them not.'
  - where: 'note 24:5 “Why the order was drawn by lot”'
    claim: 'Proverbs 16:33'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/16?lang=eng'
    quote: 'The lot is cast into the lap; but the whole disposing thereof is of the Lord.'
  - where: 'note 24:10 “The course of Abijah, and Zacharias”'
    claim: 'Luke 1:5: Zacharias of the course of Abia'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'a certain priest named Zacharias, of the course of Abia'
  - where: 'note 24:10 “The course of Abijah, and Zacharias”'
    claim: 'Luke 1:9: his lot was to burn incense'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'his lot was to burn incense when he went into the temple of the Lord.'
  - where: 'note 24:10 “The course of Abijah, and Zacharias”'
    claim: 'Luke 1:11: the angel by the altar of incense'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'standing on the right side of the altar of incense.'
  - where: 'note 24:10 “The course of Abijah, and Zacharias”'
    claim: 'The third lottery chose the priest to burn incense in the Holy Room'
    key: brown-tamid
    url: 'https://interpreterfoundation.org/journal/tamid-zacharias-and-the-second-temple'
    quote: 'It was to select the priest who would enter the Holy Room and burn incense on the Inner Altar.'
  - where: 'note 24:10 “The course of Abijah, and Zacharias”'
    claim: 'No priest drew again for the incense until the others had had the opportunity; essentially once in a lifetime'
    key: brown-tamid
    url: 'https://interpreterfoundation.org/journal/tamid-zacharias-and-the-second-temple'
    quote: 'all of the priests of the daily course had to have this opportunity before any other priests who had previously served had the opportunity to participate again in the lottery. This meant that this was essentially a once-in-a-lifetime opportunity.'
  - where: 'note 24:10 “The course of Abijah, and Zacharias”'
    claim: 'Brown reads Zacharias as winning the incense lottery'
    key: brown-tamid
    url: 'https://interpreterfoundation.org/journal/tamid-zacharias-and-the-second-temple'
    quote: 'When Zacharias won the lottery, he turned to the priest to his right'
  - where: 'christ'
    claim: 'Luke 1:13: the angel promises Zacharias a son, John'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'thy wife Elisabeth shall bear thee a son, and thou shalt call his name John.'
