chapter: 13
claims:
  - where: 'setting'
    claim: 'Samuel tells David''s building, wives, children and Philistine victories before the ark; Chronicles tells them after (ch. 14), and gives the ark''s removal at greater length'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/13.htm'
    quote: 'There, however, the contents of our chapter 14, David''s building, wives and children, and victories over the Philistines, immediately follow … the account of the conquest of the citadel of Zion … and then in 2 Samuel 6 the removal of the ark … are narrated consecutively, but much more shortly than in the Chronicle.'
  - where: 'setting'
    claim: 'One older reading: Chronicles has the religious significance of the ark''s removal mainly in view, Samuel its importance to David as king'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/13.htm'
    quote: 'The author of our Chronicle, on the contrary, has had mainly in view the religious significance of this design of David to restore the Levitic cultus prescribed in the Mosaic law'
  - where: 'setting'
    claim: 'The ark had stood at Kirjath-jearim in the house of Abinadab since the Philistines sent it back'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/7?lang=eng'
    quote: 'And the men of Kirjath-jearim came, and fetched up the ark of the LORD, and brought it into the house of Abinadab in the hill … while the ark abode in Kirjath-jearim, that the time was long; for it was twenty years'
  - where: 'setting'
    claim: 'The ark''s journey from Kirjath-jearim to Jerusalem was interrupted at Perez-uzzah'
    key: bd-ark-of-the-covenant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ark-of-the-covenant?lang=eng'
    quote: 'whence it was taken to Kirjath-jearim or Baale of Judah (6:21–7:2). Thence it was brought by David to Jerusalem, the journey being interrupted at Perezuzzah (2 Sam. 6; 1 Chr. 13:11).'
  - where: 'thread'
    claim: 'The verb of 13:3 (“inquired”) is the verb of 15:13 (“sought”) and of 10:14, listed under one sense in the lexicon'
    key: bdb
    url: 'https://biblehub.com/hebrew/1875.htm'
    quote: '1 Chronicles 15:13; 1 Chronicles 21:30; … the ark of God 1 Chronicles 13:3; … with בְּ Yahweh 1 Chronicles 10:14'
  - where: 'note 13:2 “David asks all Israel, and the LORD”'
    claim: 'Samuel opens with David gathering thirty thousand chosen men'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/6?lang=eng'
    quote: 'Again, David gathered together all the chosen men of Israel, thirty thousand.'
  - where: 'note 13:2 “David asks all Israel, and the LORD”'
    claim: 'Samuel''s introduction is very brief; “if it be of the LORD” means if the matter is willed and approved by God'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/13.htm'
    quote: 'The introduction to this event is in 2 Samuel 6:1 and 2 Samuel 6:2 very brief … "If it seem good to you, and if it come from Jahve our God," i.e., if the matter be willed of and approved by God, we will send as speedily as possible.'
  - where: 'note 13:2 “David asks all Israel, and the LORD”'
    claim: 'One older reading: the Chronicler likes to join the people with the king in religious measures (13:4; 2 Chr. 30:2, 4)'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/13.htm'
    quote: 'The Chronicler is fond of associating the people with the king in religious measures so as to minimise the appearance of arbitrary power which is suggested by the language of the books of Samuel and of Kings; cp. 1 Chronicles 13:4'
  - where: 'note 13:2 “David asks all Israel, and the LORD”'
    claim: '“Send abroad” means a wide invitation; Samuel does not mention the Levites in the removal of the ark'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/13.htm'
    quote: 'let us send abroad widely, let the invitation be no limited one! … In Samuel no mention of the Levites is made in the account of the removal of the ark.'
  - where: 'note 13:2 “David asks all Israel, and the LORD”'
    claim: 'Only after Uzza''s death does David say that none but the Levites ought to carry the ark'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/15?lang=eng'
    quote: 'Then David said, None ought to carry the ark of God but the Levites: for them hath the LORD chosen to carry the ark of God, and to minister unto him for ever.'
  - where: 'note 13:3 “Not sought in the days of Saul”'
    claim: 'The verb is dāraš, “seek, consult, inquire of”; the lexicon lists this verse (the ark of God) among seeking God, with 10:14 and 15:13'
    key: bdb
    url: 'https://biblehub.com/hebrew/1875.htm'
    quote: '2 seek, consult, inquire of: … 1 Chronicles 15:13; 1 Chronicles 21:30; … the ark of God 1 Chronicles 13:3; … with בְּ Yahweh 1 Chronicles 10:14'
  - where: 'note 13:3 “Not sought in the days of Saul”'
    claim: 'The Hebrew of 13:3 has the verb dāraš (Strong''s 1875)'
    key: oshb-wlc
    url: 'https://biblehub.com/hebrew/1875.htm'
    quote: 'Strong''s Hebrew: 1875. דָּרַשׁ (darash) -- To seek, inquire, require, investigate, demand'
  - where: 'note 13:3 “Not sought in the days of Saul”'
    claim: 'A modern translation renders “we did not seek it”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Chronicles+13&version=NRSVUE'
    quote: 'Then let us bring again the ark of our God to us, for we did not seek it in the days of Saul.'
  - where: 'note 13:3 “Not sought in the days of Saul”'
    claim: 'David says of the first attempt that they sought him not after the due order'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/15?lang=eng'
    quote: 'For because ye did it not at the first, the LORD our God made a breach upon us, for that we sought him not after the due order.'
  - where: 'note 13:5 “From the border of Egypt to Hamath”'
    claim: 'Hamath was a city of Syria in the Orontes valley; the entering in of Hamath was the northern limit of the Promised Land'
    key: bd-hamath
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hamath?lang=eng'
    quote: 'An important city of Syria, in the valley of the Orontes; the “entering in of Hamath” was the northern limit of the Promised Land (Num. 34:8; Josh. 13:5).'
  - where: 'note 13:5 “From the border of Egypt to Hamath”'
    claim: 'Joshua names Sihor, “before Egypt,” at the southern end of the land yet to be taken, and the entering into Hamath at its north'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/13?lang=eng'
    quote: 'From Sihor, which is before Egypt, even unto the borders of Ekron northward … from Baal-gad under mount Hermon unto the entering into Hamath.'
  - where: 'note 13:6 “Enthroned on the cherubim”'
    claim: 'The Mercy Seat that covered the ark was regarded as Jehovah''s earthly dwelling place'
    key: bd-ark-of-the-covenant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ark-of-the-covenant?lang=eng'
    quote: 'It was the oldest and most sacred of the religious symbols of the Israelites, and the Mercy Seat which formed its covering was regarded as the earthly dwelling place of Jehovah (Ex. 25:22).'
  - where: 'note 13:6 “Enthroned on the cherubim”'
    claim: 'Cherubim are figures of heavenly creatures, on the Mercy Seat of the ark'
    key: bd-cherubim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/cherubim?lang=eng'
    quote: 'Figures representing heavenly creatures, the exact form being unknown. They are found in the Holy of Holies, on the Mercy Seat of the Ark'
  - where: 'note 13:6 “Enthroned on the cherubim”'
    claim: 'A modern translation renders the phrase “who is enthroned on the cherubim, which is called by his name”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Chronicles+13&version=NRSVUE'
    quote: 'to bring up from there the ark of God, the Lord, who is enthroned on the cherubim, which is called by his name.'
  - where: 'note 13:6 “Enthroned on the cherubim”'
    claim: 'Samuel''s form of the verse says the ark''s name is called by the name of the LORD of hosts'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/6?lang=eng'
    quote: 'to bring up from thence the ark of God, whose name is called by the name of the LORD of hosts that dwelleth between the cherubims.'
  - where: 'note 13:10 “Why Uzza died”'
    claim: 'The law forbade the Kohathites who carried the holy things to touch them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/4?lang=eng'
    quote: 'after that, the sons of Kohath shall come to bear it: but they shall not touch any holy thing, lest they die.'
  - where: 'note 13:10 “Why Uzza died”'
    claim: 'The sons of Kohath were given no wagons, because they were to bear the holy things on their shoulders'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/7?lang=eng'
    quote: 'But unto the sons of Kohath he gave none: because the service of the sanctuary belonging unto them was that they should bear upon their shoulders.'
  - where: 'note 13:10 “Why Uzza died”'
    claim: 'At the second attempt the Levites bore the ark on their shoulders, as Moses commanded'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/15?lang=eng'
    quote: 'And the children of the Levites bare the ark of God upon their shoulders with the staves thereon, as Moses commanded according to the word of the LORD.'
  - where: 'note 13:10 “Why Uzza died”'
    claim: 'Samuel gives the reason for Uzzah''s death as his error'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/6?lang=eng'
    quote: 'and God smote him there for his error; and there he died by the ark of God.'
  - where: 'note 13:11 “The breach, and David''s fear”'
    claim: '“Was displeased” is the impersonal “it burned for him,” he burned with anger'
    key: bdb
    url: 'https://biblehub.com/hebrew/2734.htm'
    quote: 'b. impersonal, אף omitted; חרה לְ it was kindled for (him) he burned with anger … 2 Samuel 6:8 = 1 Chronicles 13:11'
  - where: 'note 13:11 “The breach, and David''s fear”'
    claim: '“Made a breach” is pāraṣ, used of the LORD breaking out in sudden judgment, with Ex. 19:22, 24, 1 Chr. 15:13 and 14:11'
    key: bdb
    url: 'https://biblehub.com/hebrew/6555.htm'
    quote: '6 break put (violently) upon, of ׳י in sudden judgment, with accusative of person 2 Samuel 5:20 = 1 Chronicles 14:11; Psalm 60:3; c, ב person Exodus 19:22,24 (J), I Chron Exodus 15:13'
  - where: 'note 13:11 “The breach, and David''s fear”'
    claim: 'At Sinai priests who come near are to sanctify themselves lest the LORD break forth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/19?lang=eng'
    quote: 'And let the priests also, which come near to the LORD, sanctify themselves, lest the LORD break forth upon them.'
  - where: 'note 13:11 “The breach, and David''s fear”'
    claim: 'David tells the Levites to sanctify themselves and names the breach'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/15?lang=eng'
    quote: 'sanctify yourselves, both ye and your brethren, that ye may bring up the ark of the LORD God of Israel unto the place that I have prepared for it.'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'The Mercy Seat was regarded as the earthly dwelling place of Jehovah'
    key: bd-ark-of-the-covenant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ark-of-the-covenant?lang=eng'
    quote: 'the Mercy Seat which formed its covering was regarded as the earthly dwelling place of Jehovah (Ex. 25:22).'
  - where: 'christ'
    claim: 'The Lord''s promise to those who seek Him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: 'Draw near unto me and I will draw near unto you; seek me diligently and ye shall find me'
