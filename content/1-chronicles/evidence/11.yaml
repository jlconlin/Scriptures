chapter: 11
claims:
  - where: 'setting'
    claim: 'Chapter 10 ends with the LORD turning the kingdom to David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/10?lang=eng'
    quote: 'And inquired not of the LORD: therefore he slew him, and turned the kingdom unto David the son of Jesse.'
  - where: 'setting'
    claim: 'Jebus was the ancient name of Jerusalem, a hill fortress independent until David stormed it'
    key: bd-jebus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jebus?lang=eng'
    quote: 'Ancient name of Jerusalem (Judg. 19:10; 1 Chr. 11:4–5); it was a hill fortress, which maintained its independence until stormed by David (2 Sam. 5:6–9).'
  - where: 'setting'
    claim: 'Samuel keeps the roll near the end, after David''s last words'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/23?lang=eng'
    quote: 'Now these be the last words of David. … These be the names of the mighty men whom David had'
  - where: 'setting'
    claim: 'Chapter 12 continues with the valiant men of all the tribes who came to David at Ziklag and Hebron'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/11.htm'
    quote: 'Among David''s גּבּרים who helped to establish his kingdom, are not merely those who are mentioned by name in the following register, but also, as we learn from 1 Chronicles 12, the great number of valiant men of all the tribes'
  - where: 'thread'
    claim: 'Saul died for the word of the LORD which he kept not'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/10?lang=eng'
    quote: 'So Saul died for his transgression which he committed against the LORD, even against the word of the LORD, which he kept not'
  - where: 'note 11:1 “From Saul''s death straight to all Israel”'
    claim: 'Samuel tells seven and a half years of David''s reign over Judah alone, and a long war with Saul''s house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/2?lang=eng'
    quote: 'And the time that David was king in Hebron over the house of Judah was seven years and six months.'
  - where: 'note 11:1 “From Saul''s death straight to all Israel”'
    claim: 'Samuel records the long war between the two houses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/3?lang=eng'
    quote: 'Now there was long war between the house of Saul and the house of David'
  - where: 'note 11:1 “From Saul''s death straight to all Israel”'
    claim: 'Chronicles counts the Hebron years at the end of the book'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/29?lang=eng'
    quote: 'seven years reigned he in Hebron, and thirty and three years reigned he in Jerusalem.'
  - where: 'note 11:1 “From Saul''s death straight to all Israel”'
    claim: 'Chapter 12 speaks of men who came to Hebron to turn Saul''s kingdom to David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/12?lang=eng'
    quote: 'came to David to Hebron, to turn the kingdom of Saul to him, according to the word of the LORD.'
  - where: 'note 11:1 “From Saul''s death straight to all Israel”'
    claim: 'Chronicles assumes readers know Samuel and Kings and leaves out David''s struggles with Saul, Bath-sheba, and family trials'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'It appears that the author or authors of Chronicles assumed that readers would be familiar with the books of Samuel and Kings. Chronicles leaves out, for example, David’s struggles with Saul, his sin with Bathsheba, and other family trials'
  - where: 'note 11:6 “How Joab became chief”'
    claim: 'Chronicles simplifies the difficult phrase of 2 Sam. 5:8; Joab was already in command during the civil war; perhaps first formally acknowledged as commander at Jebus'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/11.htm'
    quote: 'The Chronicler has simplified the very difficult phrase which occurs in the parallel passage (2 Samuel 5:8). … It is not said in Samuel that Joab first became commander-in-chief on this occasion; on the contrary he appears in command (2 Samuel 2:13) … Perhaps he was first formally acknowledged as commander at the capture of Jebus.'
  - where: 'note 11:6 “How Joab became chief”'
    claim: 'Joab is left out of the roll because he has already been named in verse 6'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/11.htm'
    quote: 'Joab is not included in the formal list because he has been already mentioned (1 Chronicles 11:6).'
  - where: 'note 11:6 “How Joab became chief”'
    claim: 'Joab, son of David''s sister Zeruiah, was captain of the army, generally faithful, and put to death by Solomon for backing Adonijah'
    key: bd-joab
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joab?lang=eng'
    quote: 'Eldest son of Zeruiah, David’s sister, and captain of David’s army. He was closely associated with all the chief events of David’s reign and was generally faithful to his master. After David’s death he was in favor of Adonijah’s succession (1 Kgs. 2:28) and for that reason was put to death by Solomon'
  - where: 'note 11:6 “How Joab became chief”'
    claim: 'Joab and his brothers were sons of Zeruiah, David''s sister'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/2?lang=eng'
    quote: 'Whose sisters were Zeruiah, and Abigail. And the sons of Zeruiah; Abishai, and Joab, and Asahel, three.'
  - where: 'note 11:8 “The Millo, and Joab''s share”'
    claim: 'Millo is a citadel in Jerusalem; the name is taken as a fill of earth, earthwork, compared with Assyrian mulu, earthwork, mound, terrace'
    key: bdb
    url: 'https://biblehub.com/hebrew/4407.htm'
    quote: 'proper name, of a location (Thes '' fill '' of earth, earthwork … compare Assyrian mulu = earthwork, mound, terrace … 2 citadel in Jerusalem הַמִּלּוֺא 2 Samuel 5:9; 1 Kings 9:15,24; 1 Kings 11:27; 1 Chronicles 11:8'
  - where: 'note 11:8 “The Millo, and Joab''s share”'
    claim: 'Solomon''s levy built the Millo and the wall of Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/9?lang=eng'
    quote: 'to build the house of the LORD, and his own house, and Millo, and the wall of Jerusalem'
  - where: 'note 11:10 “The roll moved to the beginning”'
    claim: 'Samuel''s roll opens simply with the names, with no heading on making David king'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/23?lang=eng'
    quote: 'These be the names of the mighty men whom David had: The Tachmonite that sat in the seat, chief among the captains'
  - where: 'note 11:10 “The roll moved to the beginning”'
    claim: 'Names of the roll return as captains of the monthly courses of twenty-four thousand'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/27?lang=eng'
    quote: 'Over the first course for the first month was Jashobeam the son of Zabdiel: and in his course were twenty and four thousand.'
  - where: 'note 11:13 “Where Shammah went”'
    claim: 'Lines were omitted by the copyist''s eye wandering between two mentions of the Philistines gathering, dropping Shammah''s name so his deed reads as Eleazar''s; the plural verbs of v. 14 came in afterward'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/11.htm'
    quote: 'have been, through wandering of the copyist''s eye, omitted; and with them the name of the third hero, שׁמּה, has also been dropped, so that the heroic deed done by him, 1 Chronicles 11:13, 1 Chronicles 11:14, appears, according to our present text, to have been performed by Eleazar.'
  - where: 'note 11:13 “Where Shammah went”'
    claim: 'The plurals of v. 14 were probably introduced by a reader who referred the deed to Eleazar and David'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/11.htm'
    quote: 'The plurals were probably introduced into the text after the missing lines had been dropped out by a reader or copyist, who, on account of the דּייד עם היה הוּא (1 Chronicles 11:13), understood the three clauses of 1 Chronicles 11:14 to refer to Eleazar and David.'
  - where: 'note 11:13 “Where Shammah went”'
    claim: 'Chronicles has two heroes where Samuel has three; barley and lentils look alike in Hebrew; Pas-dammim is Ephes-dammim of 1 Sam. 17:1'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/11.htm'
    quote: 'The same place under the name “Ephes-dammim” is mentioned in 1 Samuel 17:1 as the gathering-place of the Philistines. … barley] Samuel “lentils.” The two words resemble each other in Heb. and might be confused by an unwary scribe.'
  - where: 'note 11:13 “Where Shammah went”'
    claim: 'Two incidents are confounded and Shammah''s name omitted'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/11.htm'
    quote: 'two incidents are confounded, and the name of a hero (Shammah) is omitted, his exploit being ascribed to Eleazar.'
  - where: 'note 11:13 “Where Shammah went”'
    claim: 'In Samuel the Philistines gather a second time and Shammah stands in a field of lentils'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/23?lang=eng'
    quote: 'And after him was Shammah the son of Agee the Hararite. And the Philistines were gathered together into a troop, where was a piece of ground full of lentiles'
  - where: 'note 11:41 “Uriah, and sixteen names more”'
    claim: 'Samuel''s roll ends with Uriah and the count'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/23?lang=eng'
    quote: 'Uriah the Hittite: thirty and seven in all.'
  - where: 'note 11:41 “Uriah, and sixteen names more”'
    claim: 'Chronicles leaves out the sin with Bath-sheba and assumes readers know Samuel'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'Chronicles leaves out, for example, David’s struggles with Saul, his sin with Bathsheba, and other family trials'
  - where: 'christ'
    claim: 'The “one shepherd … my servant David” of Ezek. 34:23 is Jesus Christ, the Good Shepherd, a descendant of David'
    key: scripture-helps-ezek
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'This does not refer to King David, who died about four centuries before Ezekiel’s ministry. Rather, it is a reference to Jesus Christ, the Good Shepherd, who was a descendant of David.'
  - where: 'christ'
    claim: 'Gabriel promises Jesus the throne of David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'and the Lord God shall give unto him the throne of his father David:'
  - where: 'note 11:13 “Where Shammah went”'
    claim: 'In Samuel Eleazar fights until his hand is weary'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/23?lang=eng'
    quote: 'He arose, and smote the Philistines until his hand was weary'
  - where: 'note 11:8 “The Millo, and Joab''s share”'
    claim: 'Samuel says only that David built from Millo inward'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/5?lang=eng'
    quote: 'And David built round about from Millo and inward.'
