chapter: 15
claims:
  - where: 'when'
    claim: 'The ark stayed three months with Obed-edom before this chapter'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/13?lang=eng'
    quote: 'And the ark of God remained with the family of Obed-edom in his house three months. And the LORD blessed the house of Obed-edom, and all that he had.'
  - where: 'setting'
    claim: 'Verse 1 is the transition from David''s palace-building in chapter 14 to the bringing in of the ark'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/15.htm'
    quote: 'the remark that David, while building his house in Jerusalem, prepared a place for the ark of God, and erected a tent for it, forms the transition from the account of his palace-building (1 Chronicles 14:1.) to the bringing in of the ark'
  - where: 'setting'
    claim: 'Samuel gives Obed-edom''s blessing as the motive for the second journey'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/6?lang=eng'
    quote: 'And it was told king David, saying, The LORD hath blessed the house of Obed-edom, and all that pertaineth unto him, because of the ark of God.'
  - where: 'setting'
    claim: 'Verses 1–24 have no parallel in Samuel, and Chronicles omits the reason Samuel gives for the renewed attempt'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/15.htm'
    quote: 'There is no parallel in Samuel to this section; on the other hand Chronicles omits the reason given in 2 Samuel 6:12 for the renewal of David’s attempt to bring home the ark'
  - where: 'setting'
    claim: 'Where Samuel narrates the main facts briefly, Chronicles portrays the religious side of the event'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/15.htm'
    quote: 'only the main facts as to the transfer of the holy ark to Jerusalem … are shortly narrated; but the author of the Chronicle elaborately portrays the religious side of this solemn act'
  - where: 'setting'
    claim: 'Chronicles dwells on the progress of temple worship in Jerusalem'
    key: bd-chronicles
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/chronicles?lang=eng'
    quote: 'the writers dwell with most satisfaction upon the ecclesiastical and religious aspects of the history, and the progress of temple worship in Jerusalem'
  - where: 'setting'
    claim: 'The tent David pitched was new, not the old tabernacle'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/15.htm'
    quote: 'a tent] a new tent, not the old tabernacle (1 Chronicles 16:39).'
  - where: 'thread'
    claim: 'Where Samuel speaks of six paces, Chronicles names the safe start God''s help'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/15.htm'
    quote: 'when God helped the Levites] In 2 Samuel 6:13, when they that bare the ark of the Lord had gone six paces. The Chronicler interprets the safe start as a sign of Divine assistance.'
  - where: 'note 15:2 “What the law said about carrying the ark”'
    claim: 'The LORD separated Levi to bear the ark and minister to Him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/10?lang=eng'
    quote: 'At that time the LORD separated the tribe of Levi, to bear the ark of the covenant of the LORD, to stand before the LORD to minister unto him'
  - where: 'note 15:2 “What the law said about carrying the ark”'
    claim: 'The Kohathites received no wagons because they bore the sanctuary''s things on their shoulders'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/7?lang=eng'
    quote: 'But unto the sons of Kohath he gave none: because the service of the sanctuary belonging unto them was that they should bear upon their shoulders.'
  - where: 'note 15:2 “What the law said about carrying the ark”'
    claim: 'The first time the ark went on a new cart driven by Uzza and Ahio'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/13?lang=eng'
    quote: 'And they carried the ark of God in a new cart out of the house of Abinadab: and Uzza and Ahio drave the cart.'
  - where: 'note 15:5 “Six families, four of them Kohath''s”'
    claim: 'Hebron and Uzziel were sons of Kohath, and Elzaphan a son of Uzziel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/6?lang=eng'
    quote: 'And the sons of Kohath; Amram, and Izhar, and Hebron, and Uzziel … And the sons of Uzziel; Mishael, and Elzaphan, and Zithri.'
  - where: 'note 15:5 “Six families, four of them Kohath''s”'
    claim: 'Elizaphan son of Uzziel was chief of the Kohathites, whose charge was the ark'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/3?lang=eng'
    quote: 'And the chief of the house of the father of the families of the Kohathites shall be Elizaphan the son of Uzziel. And their charge shall be the ark'
  - where: 'note 15:13 “Not sought “after the due order””'
    claim: 'The first clause means that it was not the Levites who brought the ark up the first time; the breach is Uzza''s slaying'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/15.htm'
    quote: '"For because in the beginning (i.e., when the ark was removed from the house of Amminadab, 1 Chronicles 13:1-14) it was not you (sc., who brought it up), did Jahve our God made a breach upon us," sc. by the slaying of Uzza'
  - where: 'note 15:13 “Not sought “after the due order””'
    claim: 'The ordinance was that the ark be carried by Levites and touched by no unholy person'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/15.htm'
    quote: 'which required that the ark, upon which Jehovah sits enthroned, should be carried by Levites, and touched by no unholy person, or one who is not a priest (Numbers 4:15).'
  - where: 'note 15:13 “Not sought “after the due order””'
    claim: 'BDB lists mishpat in this verse among the Levitical ordinances'
    key: bdb
    url: 'https://biblehub.com/hebrew/4941.htm'
    quote: '3 ordinance promulgated by שֹׁפֵט: … Levitical ordinances Leviticus 5:10; Leviticus 9:16 13t. P, 1 Chronicles 15:13'
  - where: 'note 15:13 “Not sought “after the due order””'
    claim: 'BDB lists dāraš in 15:13 with 13:3 (the ark) and 10:14 (of the LORD), in the sense of seeking God'
    key: bdb
    url: 'https://biblehub.com/hebrew/1875.htm'
    quote: '1 Chronicles 15:13; 1 Chronicles 21:30; … the ark of God 1 Chronicles 13:3; … with בְּ Yahweh 1 Chronicles 10:14'
  - where: 'note 15:13 “Not sought “after the due order””'
    claim: 'The breach of 13:11 gave the place the name Perez-uzza; 13:3 says the ark was not inquired at in Saul''s days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/13?lang=eng'
    quote: 'And David was displeased, because the LORD had made a breach upon Uzza: wherefore that place is called Perez-uzza to this day.'
  - where: 'note 15:16 “Music made a Levite office”'
    claim: 'In Samuel David and all Israel played on all manner of instruments'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/6?lang=eng'
    quote: 'And David and all the house of Israel played before the LORD on all manner of instruments made of fir wood, even on harps, and on psalteries, and on timbrels, and on cornets, and on cymbals.'
  - where: 'note 15:16 “Music made a Levite office”'
    claim: 'Alamoth and Sheminith stand in the titles of Psalms 46 and 6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/46?lang=eng'
    quote: 'To the chief Musician for the sons of Korah, A Song upon Alamoth.'
  - where: 'note 15:16 “Music made a Levite office”'
    claim: '1 Chronicles 15 shows David leading a procession in song and dance with the ark, the central symbol of God''s presence; the psalm joins music to seeking the LORD''s face'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'First Chronicles 15 shows David leading a procession in song and dance as they brought the ark of the covenant, the most central symbol of God’s presence in Israel, back among the Israelites'
  - where: 'note 15:16 “Music made a Levite office”'
    claim: 'David connected music with seeking the face of the Lord'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'David thus connected music with the temple activity of seeking the face of the Lord, as found symbolically at the ark.'
  - where: 'note 15:22 “Chenaniah, over the song or over the carrying?”'
    claim: 'BDB puts massa in 15:22 and 15:27 probably in the sense of bearing, the word used of the Kohathites'' burden in Num. 4'
    key: bdb
    url: 'https://biblehub.com/hebrew/4853.htm'
    quote: '3 verbal noun, bearing, carrying, … so probably 1 Chronicles 15:22 (twice in verse); 1 Chronicles 15:27 … especially of responsibility and duty of bearing sacred vessels … Numbers 4:15,19,27'
  - where: 'note 15:22 “Chenaniah, over the song or over the carrying?”'
    claim: 'The word comes from the verb to lift'
    key: bdb
    url: 'https://biblehub.com/hebrew/4853.htm'
    quote: 'Word Origin: [from H5375 (נָשָׂא נָסָה - lifted)]'
  - where: 'note 15:22 “Chenaniah, over the song or over the carrying?”'
    claim: 'The Greek translation calls Chenaniah master of the bands, and master of the band of singers in verse 27'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_chronicles/15.htm'
    quote: '22And Chonenia chief of the Levites was master of the bands, because he was skilful.'
  - where: 'note 15:22 “Chenaniah, over the song or over the carrying?”'
    claim: 'Num. 4:15 calls the Kohathites'' load their burden'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/4?lang=eng'
    quote: 'These things are the burden of the sons of Kohath in the tabernacle of the congregation.'
  - where: 'note 15:22 “Chenaniah, over the song or over the carrying?”'
    claim: 'BDB notes that others take massa in 15:22 and 27 as singing, the lifting up of the voice'
    key: bdb
    url: 'https://biblehub.com/hebrew/4853.htm'
    quote: '1 Chronicles 15:27 (compare Be Kau; > singing, uplifting of voice, e.g. Öttli)'
  - where: 'note 15:16 “Music made a Levite office”'
    claim: 'Chronicles connects Israelite music directly to the office of the Levites'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'connect Israelite music directly to the office of the Levites and a temple setting'
  - where: 'note 15:29 “Michal, and what Chronicles leaves out”'
    claim: 'Samuel has Michal see David dancing "before the LORD" and goes on to her words to him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/6?lang=eng'
    quote: 'And as the ark of the LORD came into the city of David, Michal Saul’s daughter looked through a window, and saw king David leaping and dancing before the LORD; and she despised him in her heart.'
  - where: 'christ'
    claim: 'The ark was the central symbol of God''s presence in Israel'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'the ark of the covenant, the most central symbol of God’s presence in Israel'
