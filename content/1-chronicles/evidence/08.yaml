chapter: 8
claims:
  - where: 'when'
    claim: 'Chronicles mentions the decree of Cyrus, which suggests it was compiled after the return from exile'
    key: ot-seminary-chronicles-intro
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-books-of-1-and-2-chronicles?lang=eng'
    quote: 'This inclusion may suggest that the books of Chronicles, or at least a portion of them, were compiled sometime after 537 B.C., when King Cyrus made this decree.'
  - where: 'setting'
    claim: 'Genesis names ten sons of Benjamin'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/46?lang=eng'
    quote: 'And the sons of Benjamin were Belah, and Becher, and Ashbel, Gera, and Naaman, Ehi, and Rosh, Muppim, and Huppim, and Ard.'
  - where: 'setting'
    claim: 'The sense of verses 6–7 is uncertain; words have probably fallen out'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/8.htm'
    quote: 'Probably some words have fallen out; we cannot say who carried whom captive.'
  - where: 'section 2 plain'
    claim: 'Words have probably fallen out of verses 6–7, and who carried whom away is uncertain'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/8.htm'
    quote: 'Probably some words have fallen out; we cannot say who carried whom captive.'
  - where: 'setting'
    claim: 'One older reading: chapter 8 comes from a different genealogical document from chapter 7 and supplements 7:6–11'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/8.htm'
    quote: 'all the registers which are grouped together in 1 Chronicles 7 were taken from another genealogical document than that from which the registers in our chapter, which form a supplement to the short fragments in 1 Chronicles 7:6-11, have been derived.'
  - where: 'setting'
    claim: 'Benjamin''s sons in 8:1–2 follow the family heads of Num. 26:38 rather than Gen. 46:21; Nohah and Rapha are found nowhere else'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/8.htm'
    quote: 'In אחרח we can easily recognise the אחירם of Numbers 26:38, whence the enumeration in 1 Chronicles 8:1. harmonizes with the order in Numbers 26:38. … The names נוחה and רפא are nowhere else met with among the sons of Benjamin'
  - where: 'setting'
    claim: 'The text of the chapter has suffered in copying; verse 14 is probably corrupt'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/8.htm'
    quote: '14. And Ahio] LXX., and his brother. This verse is probably corrupt.'
  - where: 'setting'
    claim: 'The register of Saul''s house in chapter 8 had suffered considerably in its text'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/9.htm'
    quote: 'derived from another document in more complete preservation than that in 1 Chronicles 8, which had been handed down in connection with other genealogies of the Benjamite families, and had suffered considerably in its text.'
  - where: 'setting'
    claim: 'Benjamin gave Israel its first king, Saul, and its nearness to Jerusalem drew it gradually into the kingdom of Judah'
    key: bd-benjamin
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/benjamin?lang=eng'
    quote: 'The tribe provided the first king in the person of Saul (1 Sam. 9:1–2). … the nearness to Jerusalem seems to have caused Benjamin gradually to become part of the kingdom of Judah.'
  - where: 'setting'
    claim: 'Saul''s register is repeated in 9:35–44 to introduce the story of Saul''s death'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/9.htm'
    quote: 'The passage is probably repeated here in ler to serve as an introduction to the story of the death of Saul.'
  - where: 'thread'
    claim: 'Saul''s register is repeated in chapter 9 to connect the genealogies with the history of the kingship, introducing Saul''s death in chapter 10'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/9.htm'
    quote: 'is repeated here only to connect the following history of the kingship with the preceding genealogical lists. It forms here the introduction to the narrative of Saul''s death in 1 Chronicles 10:1-14'
  - where: 'section 2 plain'
    claim: 'The verb rendered "removed" in 8:6–7 is the Hiphil of galah, carry away into exile'
    key: bdb
    url: 'https://biblehub.com/hebrew/1540.htm'
    quote: 'הֶגְלָם 1 Chronicles 8:7 … יַגְלוּם 1 Chronicles 8:6: … — carry away into exile, take into exile 2 Kings 15:29'
  - where: 'section 3 plain'
    claim: 'Shaharaim had children in Moab after he had sent away his wives Hushim and Baara'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/8.htm'
    quote: 'he begat "in the country of Moab after he had sent them, Hushim and Baara his wives, away; (1 Chronicles 8:9) there begat he with Hodesh his wife, Jobab," etc.'
  - where: 'section 4 plain'
    claim: 'A new list of Benjamite heads begins with Beriah in verse 13; the names to verse 27 fall into five groups'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/8.htm'
    quote: 'we must conclude that with וּבריעה, 1 Chronicles 8:13, a new list of heads of Benjamite fathers''-houses begins. This view is supported by the fact that the names from 1 Chronicles 8:14 or 1 Chronicles 8:15 to 1 Chronicles 8:27 are divided into five groups of families'
  - where: 'section 5 plain'
    claim: 'Verses 29–32 are the genealogy of Jeiel, the father of Gibeon, named in 9:35'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/8.htm'
    quote: '29–32 (= ch. 1 Chronicles 9:35-38). The Genealogy of Jeiel 29. the father of Gibeon] R.V. the father of Giboon Jeiel; cp. 1 Chronicles 9:35, R.V.'
  - where: 'section 6 plain'
    claim: 'Verses 33–40 are the genealogy of the house of Saul, repeated at 9:39–44'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/8.htm'
    quote: '33–40 (cp. 1 Chronicles 9:39-44). The Genealogy of the House of Saul'
  - where: 'note 8:6 “The sons of Ehud, carried into exile”'
    claim: 'The Bible Dictionary lists 1 Chr. 8:6 under Ehud the son of Gera, the left-handed Benjamite who delivered Israel from Moab'
    key: bd-ehud
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ehud?lang=eng'
    quote: 'Son of Gera, a left-handed Benjamite, who by a feat of valor delivered Israel from Eglon, king of Moab, after an oppression of 18 years (Judg. 3:15–4:1; see also 1 Chr. 7:10; 8:6).'
  - where: 'note 8:6 “The sons of Ehud, carried into exile”'
    claim: 'Judges names Ehud the son of Gera, a Benjamite'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/3?lang=eng'
    quote: 'the Lord raised them up a deliverer, Ehud the son of Gera, a Benjamite, a man lefthanded'
  - where: 'note 8:6 “The sons of Ehud, carried into exile”'
    claim: 'The verb of 8:6–7 is the causative of galah, "carry away into exile," the same as in 1 Chr. 5:26 and (passive) 9:1'
    key: bdb
    url: 'https://biblehub.com/hebrew/1540.htm'
    quote: 'וַיַּגְלֵם 2 Kings 15:29; 1 Chronicles 5:26, יַגְלוּם 1 Chronicles 8:6 … — carry away into exile, take into exile … 1 Chronicles 5:6,26; 1 Chronicles 5:41; 1 Chronicles 8:6,7'
  - where: 'note 8:6 “The sons of Ehud, carried into exile”'
    claim: 'The passive of the same verb is used at 1 Chr. 9:1'
    key: bdb
    url: 'https://biblehub.com/hebrew/1540.htm'
    quote: 'Hoph`al Perfect הָגְלָה Esther 2:6; feminine הָגְלְתָה Esther 2:6, הָגְלוּ 1 Chronicles 9:1'
  - where: 'note 8:28 “Benjamin and Jerusalem”'
    claim: 'Joshua counts Jerusalem among Benjamin''s cities'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/18?lang=eng'
    quote: 'And Zelah, Eleph, and Jebusi, which is Jerusalem, Gibeath, and Kirjath; fourteen cities with their villages. This is the inheritance of the children of Benjamin according to their families.'
  - where: 'note 8:28 “Benjamin and Jerusalem”'
    claim: 'Benjamin did not drive out the Jebusites of Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/1?lang=eng'
    quote: 'And the children of Benjamin did not drive out the Jebusites that inhabited Jerusalem; but the Jebusites dwell with the children of Benjamin in Jerusalem unto this day.'
  - where: 'note 8:28 “Benjamin and Jerusalem”'
    claim: 'Jerusalem lay on the frontier between Judah and Benjamin; a Jebusite city until David captured it and made it his capital'
    key: bd-jerusalem
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jerusalem?lang=eng'
    quote: 'a Jebusite city until it was captured by David (2 Sam. 5:6–9); … It lay on the frontier line between Judah and Benjamin and was chosen by David to be his capital.'
  - where: 'note 8:28 “Benjamin and Jerusalem”'
    claim: 'Benjamin''s nearness to Jerusalem drew it gradually into the kingdom of Judah'
    key: bd-benjamin
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/benjamin?lang=eng'
    quote: 'the nearness to Jerusalem seems to have caused Benjamin gradually to become part of the kingdom of Judah.'
  - where: 'note 8:28 “Benjamin and Jerusalem”'
    claim: 'After the exile Judah and Benjamin dwelt in Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/9?lang=eng'
    quote: 'And in Jerusalem dwelt of the children of Judah, and of the children of Benjamin, and of the children of Ephraim, and Manasseh;'
  - where: 'note 8:33 “Saul''s house, and the names with Baal in them”'
    claim: 'The register of Saul''s house is repeated in chapter 9 to introduce Saul''s death in chapter 10'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/9.htm'
    quote: 'This register has already occurred in 1 Chronicles 8:29-38, along with those of other families of the tribe of Benjamin, and is repeated here only to connect the following history of the kingship with the preceding genealogical lists.'
  - where: 'note 8:33 “Saul''s house, and the names with Baal in them”'
    claim: '1 Samuel makes Kish the son of Abiel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/9?lang=eng'
    quote: 'Now there was a man of Benjamin, whose name was Kish, the son of Abiel, the son of Zeror, the son of Bechorath, the son of Aphiah, a Benjamite, a mighty man of power.'
  - where: 'note 8:33 “Saul''s house, and the names with Baal in them”'
    claim: '1 Samuel makes Ner, Abner''s father, a son of Abiel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/14?lang=eng'
    quote: 'And Kish was the father of Saul; and Ner the father of Abner was the son of Abiel.'
  - where: 'note 8:33 “Saul''s house, and the names with Baal in them”'
    claim: 'One older reading: intermediate names are passed over, and Ner is named as the progenitor of Saul''s line; Ishui is another name for Abinadab; Eshbaal is Ishbosheth'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/8.htm'
    quote: 'in our verse intermediate names mentioned in 1 Samuel 9:1, and probably others besides, are passed over, and Ner the son of Abi-Gibeon is named only because he was the progenitor of the line by which Saul was descended from him. … Ishui is another name for Abinadab.'
  - where: 'note 8:33 “Saul''s house, and the names with Baal in them”'
    claim: 'Ner has dropped out of the list of Jeiel''s sons in 8:30 and stands in 9:36'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/8.htm'
    quote: 'a comparison of the two passages shows that in our verse two names have been dropped out, - Ner between Baal and Nadab, and Mikloth at the end, which must have originally stood in our register also'
  - where: 'note 8:33 “Saul''s house, and the names with Baal in them”'
    claim: '1 Samuel 14:49 names Saul''s sons Jonathan, Ishui and Melchi-shua'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/14?lang=eng'
    quote: 'Now the sons of Saul were Jonathan, and Ishui, and Melchi-shua'
  - where: 'note 8:33 “Saul''s house, and the names with Baal in them”'
    claim: 'Merib-baal was Mephibosheth''s true name; later Israelites would not pronounce Baal and substituted bosheth, "shameful thing"'
    key: bd-mephibosheth
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/mephibosheth?lang=eng'
    quote: 'His true name was Merib-baal; but later Israelites were unwilling to pronounce the name Baal (Ex. 23:13) and substituted for it bosheth (“shameful thing”).'
  - where: 'note 8:33 “Saul''s house, and the names with Baal in them”'
    claim: 'Baal means possessor, lord; Bosheth was substituted in names compounded with it'
    key: bd-baal
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/baal?lang=eng'
    quote: 'Possessor, lord. … Becoming utterly abominable from its associations, its use was abjured and Bosheth (shame) was substituted in names compounded with it. (Compare Ishbosheth and Jerubbesheth'
  - where: 'note 8:33 “Saul''s house, and the names with Baal in them”'
    claim: 'Eshbaal "Man of Baal" was changed in Samuel to Ishbosheth but left standing in Chronicles; one older reading: Baal ("Lord") was applied in Saul''s day to Israel''s God, later objected to by the prophets (Hosea 2:17)'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/8.htm'
    quote: 'the offensive name Eshbaal “Man of Baal” has been changed to Ishbosheth … but it has been left standing in the less-used text of Chron. The title Baal (“Lord”) was applied in early days (e.g. in the days of Saul) to the national God of Israel'
  - where: 'note 8:33 “Saul''s house, and the names with Baal in them”'
    claim: 'Cambridge: to Saul the name meant "Man of the Lord"; the prophets objected because the title was applied to heathen gods'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/8.htm'
    quote: 'but in later days (cp. Hosea 2:17) the prophets objected to it because it was freely applied to Heathen gods. Thus to Saul and Samuel the name Eshbaal was acceptable as meaning “Man of the Lord,” i.e. of Jehovah'
  - where: 'note 8:33 “Saul''s house, and the names with Baal in them”'
    claim: 'The meaning of Merib-baal is uncertain (perhaps "Baal is advocate")'
    key: bdb
    url: 'https://biblehub.com/hebrew/4807.htm'
    quote: 'מְרִיב בַּ֫עַל proper name, masculine (baal is (our, my, his) advocate (?)'
  - where: 'note 8:33 “Saul''s house, and the names with Baal in them”'
    claim: 'Hosea: Israel will call the LORD Ishi and no more Baali'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/2?lang=eng'
    quote: 'And it shall be at that day, saith the Lord, that thou shalt call me Ishi; and shalt call me no more Baali.'
  - where: 'note 8:40 “Jonathan''s line goes on”'
    claim: 'Micah son of Merib-baal in 1 Chr. 8:34 is the Micha of 2 Sam. 9:12'
    key: bdb
    url: 'https://biblehub.com/hebrew/4318.htm'
    quote: '4 son of Meribbaal (Mephibosheth) 1 Chronicles 8:34f. (ᵐ5 Μιχια), 1 Chronicles 9:40f. (ᵐ5 Μειχα), called מִיכָא 2 Samuel 9:12.'
  - where: 'note 8:40 “Jonathan''s line goes on”'
    claim: 'Mephibosheth was the lame son of Jonathan to whom David showed kindness and whom he spared'
    key: bd-mephibosheth
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/mephibosheth?lang=eng'
    quote: 'A lame son of Jonathan (2 Sam. 4:4); with Machir at Lodebar (9:6); David’s kindness to him (9:5–13); Ziba’s slander (16:1–4); his defense (19:24–28); David spares him (21:7).'
  - where: 'note 8:40 “Jonathan''s line goes on”'
    claim: 'Mephibosheth had a young son named Micha; David showed him kindness for Jonathan''s sake'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/9?lang=eng'
    quote: 'And Mephibosheth had a young son, whose name was Micha.'
  - where: 'note 8:40 “Jonathan''s line goes on”'
    claim: 'David spared Mephibosheth because of the oath with Jonathan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/21?lang=eng'
    quote: 'But the king spared Mephibosheth, the son of Jonathan the son of Saul, because of the Lord’s oath that was between them, between David and Jonathan the son of Saul.'
  - where: 'christ'
    claim: 'Paul, a Benjamite, preached Saul, then David, then Jesus of David''s seed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/13?lang=eng'
    quote: 'God gave unto them Saul the son of Cis, a man of the tribe of Benjamin, by the space of forty years.'
  - where: 'christ'
    claim: 'Paul named his tribe and counted his gains loss for Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/philip/3?lang=eng'
    quote: 'Circumcised the eighth day, of the stock of Israel, of the tribe of Benjamin, an Hebrew of the Hebrews'
  - where: 'christ'
    claim: 'The most distinguished Benjamite was the Apostle Paul'
    key: bd-benjamin
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/benjamin?lang=eng'
    quote: 'The most distinguished Benjamite was the Apostle Paul (Rom. 11:1).'
  - where: 'explore'
    claim: 'Ehud''s story is told in Judges 3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/3?lang=eng'
    quote: 'But when the children of Israel cried unto the Lord, the Lord raised them up a deliverer, Ehud the son of Gera, a Benjamite'
  - where: 'note 8:33 “Saul''s house, and the names with Baal in them”'
    claim: 'The copy of Saul''s register in chapter 9 is better preserved than that in chapter 8'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/9.htm'
    quote: 'The deviations of this register from that in 1 Chronicles 8:29-38, show that it has been derived from another document in more complete preservation than that in 1 Chronicles 8'
  - where: 'christ'
    claim: 'Paul ended with Jesus, of David''s seed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/13?lang=eng'
    quote: 'Of this man’s seed hath God according to his promise raised unto Israel a Saviour, Jesus:'
