chapter: 18
claims:
  - where: 'setting'
    claim: 'Chapter 17 ends with the LORD''s promise to build David a house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/17?lang=eng'
    quote: 'the LORD will build thee an house'
  - where: 'setting'
    claim: 'Chapters 18–20 tell the wars in the same order as Samuel: a general view of all the wars with the officers, then the Ammonite-Syrian war'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/18.htm'
    quote: 'there are grouped together in our 18th chapter, and in 2 Samuel 8, in such a manner as to afford a general view of the whole, all the wars which David carried on victoriously … followed by a catalogue of David''s chief public officials.'
  - where: 'setting'
    claim: 'The sections between the wars in Samuel are left out of Chronicles'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/18.htm'
    quote: 'contain sketches of David''s family life, which the author of the Chronicle has, in accordance with his plan, omitted.'
  - where: 'setting'
    claim: '“After this” is taken from Samuel, probably from older annals, and does not date the conquest'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/18.htm'
    quote: 'The phrase is adopted from 2 Samuel 8:1 and probably came originally from a still earlier book of annals, in which the context may have been different. We cannot therefore say at what period of David’s reign the conquest of Gath took place.'
  - where: 'setting'
    claim: 'Chronicles turns Samuel''s figurative Metheg-ammah into prose, “Gath and her towns”'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/18.htm'
    quote: 'In 2 Samuel 8:1, took the bridle of the mother city (R.V.), a poetical expression which the Chronicler has turned into prose.'
  - where: 'setting'
    claim: 'Chronicles paraphrases, omits, reads differently and adds notes of its own'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/18.htm'
    quote: 'The Chronicler paraphrases (1 Chronicles 18:1; 1 Chronicles 18:17), omits (1 Chronicles 18:2), has a different reading (1 Chronicles 18:4; 1 Chronicles 18:8; 1 Chronicles 18:10; 1 Chronicles 18:12).'
  - where: 'setting'
    claim: 'Samuel''s list of officers names the sons of David priests; Chronicles “chief about the king”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/8?lang=eng'
    quote: 'Ahimelech the son of Abiathar, were the priests; and Seraiah was the scribe'
  - where: 'when'
    claim: 'The chapter''s opening does not date the wars'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/18.htm'
    quote: 'We cannot therefore say at what period of David’s reign the conquest of Gath took place.'
  - where: 'thread'
    claim: '“Preserved” means gave victory'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/18.htm'
    quote: 'preserved David] R.V. gave victory to David.'
  - where: 'thread'
    claim: 'The note about Solomon''s use of Hadadezer''s brass is the Chronicler''s own, not in Samuel'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/18.htm'
    quote: 'the chronicler has several historical notes peculiar to himself, which are wanting in the text of Samuel … Such, e.g., is the statement in 1 Chronicles 18:8, that Solomon caused the brazen sea and the pillars and vessels of the court of the temple to be made of the brass'
  - where: 'thread'
    claim: 'The LORD told David he had made great wars and should not build'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/22?lang=eng'
    quote: 'Thou hast shed blood abundantly, and hast made great wars: thou shalt not build an house unto my name'
  - where: 'section 1 plain'
    claim: '“Brought gifts” means paid tribute'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/18.htm'
    quote: 'brought gifts] R.V. brought presents, i.e. tribute. It is the action of an inferior acknowledging the superiority of another.'
  - where: 'section 1 plain'
    claim: '“Zobah unto Hamath” is Zobah by Hamath'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/18.htm'
    quote: 'Zobah unto Hamath] Render as R.V. mg. Zobah by Hamath, the position of Zobah being fixed by the note that it was near Hamath.'
  - where: 'section 1 plain'
    claim: '“Houghed” means hamstrung'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/18.htm'
    quote: 'Houghed = “hamstrung.”'
  - where: 'section 1 plain'
    claim: 'The “brass” is bronze'
    key: bdb
    url: 'https://biblehub.com/hebrew/5178.htm'
    quote: 'copper, bronze'
  - where: 'section 1 plain'
    claim: '“Preserved” rendered “gave victory”'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/18.htm'
    quote: 'preserved David] R.V. gave victory to David.'
  - where: 'section 3 plain'
    claim: '“Chief about the king” is the chief at the king''s hand, his executive'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/18.htm'
    quote: 'chief about the king] Lit., the chief at the king’s hand, i.e. formed the executive to carry out his commands'
  - where: 'section 3 plain'
    claim: 'The Cherethites and Pelethites were David''s bodyguard'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/18.htm'
    quote: 'the Cherethites and the Pelethites] David’s bodyguard.'
  - where: 'note 18:2 “What Chronicles leaves out of Moab''s defeat”'
    claim: 'Samuel tells of Moab''s prisoners measured with a line, two lines to die and one to live'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/8?lang=eng'
    quote: 'And he smote Moab, and measured them with a line, casting them down to the ground; even with two lines measured he to put to death, and with one full line to keep alive.'
  - where: 'note 18:2 “What Chronicles leaves out of Moab''s defeat”'
    claim: 'The Chronicler often omits obscure words of Samuel; Samuel''s verse seems to mean two thirds of the warriors were killed, but its meaning is uncertain'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/18.htm'
    quote: 'The Chronicler at this point omits, as he often omits, some obscure words of Samuel. 2 Samuel 8:2 seems to say that David put two thirds of the Moabites (presumably the warriors) to death, but the meaning of the verse is uncertain.'
  - where: 'note 18:2 “What Chronicles leaves out of Moab''s defeat”'
    claim: 'No reason for the omission is discoverable; the idea that it spares David is refuted by 20:3, which Chronicles keeps'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/18.htm'
    quote: 'the omission of David''s harsh treatment of the Moabites who were taken prisoners is surprising, no reason for it being discoverable; for the assertion that the chronicler has purposely omitted it in order to free David from the charge of such barbarous conduct, is disposed of by the fact that he does not pass over in silence the similar treatment of the conquered inhabitants of Rabbah in 1 Chronicles 20:3.'
  - where: 'note 18:2 “What Chronicles leaves out of Moab''s defeat”'
    claim: 'Chronicles tells how David dealt with the people of Rabbah and the Ammonite cities'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/20?lang=eng'
    quote: 'Even so dealt David with all the cities of the children of Ammon.'
  - where: 'note 18:4 “Seventeen hundred horsemen, or seven thousand?”'
    claim: 'Samuel''s Hebrew reads a thousand and seven hundred horsemen; the King James supplies “chariots” in italics (brackets)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/2_samuel/8-4.htm'
    quote: 'Young''s Literal Translation and David captureth from him a thousand and seven hundred horsemen … King James Bible And David took from him a thousand [chariots], and seven hundred horsemen'
  - where: 'note 18:4 “Seventeen hundred horsemen, or seven thousand?”'
    claim: 'The Septuagint of Samuel has a thousand chariots and seven thousand horsemen'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_samuel/8.htm'
    quote: 'And David took a thousand of his chariots, and seven thousand horsemen, and twenty thousand footmen'
  - where: 'note 18:4 “Seventeen hundred horsemen, or seven thousand?”'
    claim: 'Samuel''s King James reads a thousand chariots and seven hundred horsemen; houghed and kept for a hundred chariots'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/8?lang=eng'
    quote: 'And David took from him a thousand chariots, and seven hundred horsemen, and twenty thousand footmen: and David houghed all the chariot horses, but reserved of them for an hundred chariots.'
  - where: 'note 18:8 “Bronze for Solomon''s sea”'
    claim: 'Samuel says only that David took much brass from Betah and Berothai'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/8?lang=eng'
    quote: 'And from Betah, and from Berothai, cities of Hadadezer, king David took exceeding much brass.'
  - where: 'note 18:8 “Bronze for Solomon''s sea”'
    claim: 'The metal is copper hardened with an alloy into bronze, used especially in the tabernacle and temple'
    key: bdb
    url: 'https://biblehub.com/hebrew/5178.htm'
    quote: 'material — doubtless hardened with alloy, probably tin, making bronze … especially in description of tabernacle and temple'
  - where: 'note 18:8 “Bronze for Solomon''s sea”'
    claim: 'The sea was for the priests to wash in'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/4?lang=eng'
    quote: 'but the sea was for the priests to wash in'
  - where: 'note 18:8 “Bronze for Solomon''s sea”'
    claim: 'The pillars were Jachin and Boaz in the porch'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/7?lang=eng'
    quote: 'And he set up the pillars in the porch of the temple: and he set up the right pillar, and called the name thereof Jachin: and he set up the left pillar, and called the name thereof Boaz.'
  - where: 'note 18:8 “Bronze for Solomon''s sea”'
    claim: 'The weight of the brass could not be found out'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/4?lang=eng'
    quote: 'Thus Solomon made all these vessels in great abundance: for the weight of the brass could not be found out.'
  - where: 'note 18:12 “Abishai in the valley of salt”'
    claim: 'Samuel gives the victory to David, against the Syrians; the title of Psalm 60 to Joab, twelve thousand'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/60?lang=eng'
    quote: 'when Joab returned, and smote of Edom in the valley of salt twelve thousand.'
  - where: 'note 18:12 “Abishai in the valley of salt”'
    claim: 'Abishai and Joab were sons of Zeruiah, David''s sister'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/2?lang=eng'
    quote: 'Whose sisters were Zeruiah, and Abigail. And the sons of Zeruiah; Abishai, and Joab, and Asahel, three.'
  - where: 'christ'
    claim: 'Jeremiah''s righteous Branch shall execute judgment and justice'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/23?lang=eng'
    quote: 'I will raise unto David a righteous Branch, and a King shall reign and prosper, and shall execute judgment and justice in the earth.'
