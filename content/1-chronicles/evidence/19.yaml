chapter: 19
claims:
  - where: 'setting'
    claim: 'The war with Ammon was already referred to in 1 Chr. 18:11'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/19.htm'
    quote: 'The war with Ammon has already been referred to by anticipation in 1 Chronicles 18:11.'
  - where: 'setting'
    claim: 'On one older reading, chapter 19 is the later stages of the war with Zobah begun in 18:3–8: auxiliaries of Ammon, then a final campaign ending in formal peace'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/19.htm'
    quote: 'Three stages are apparent in the war with Zobah, (a) that in which David secured a position on the Euphrates, 1 Chronicles 18:3-8, (b) the stage during which troops from Zobah acted as auxiliaries to the Ammonites, 1 Chronicles 19:6-15, (c) the final stage which ended la the conclusion of a formal peace'
  - where: 'setting'
    claim: 'Chronicles omits David''s kindness to Mephibosheth (2 Sam. 9) and passes over the court history of David, which occupies an important place in 2 Samuel'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/19.htm'
    quote: 'Chron. here omits the story of David’s kindness in seeking out and befriending Mephibosheth (Meribbaal) the son of Jonathan (2 Samuel 9); the Court History of David which occupies an important place in 2 Sam. is passed over altogether in Chron.'
  - where: 'setting'
    claim: 'Chronicles omits Helam, where Samuel says the Syrians came; its site is unknown'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/19.htm'
    quote: '2 Samuel 10:16 adds, and they came to Helam; the position of Helam however is unknown'
  - where: 'setting'
    claim: 'Samuel names Helam twice, where the Syrians came and where David came'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/10?lang=eng'
    quote: 'he gathered all Israel together, and passed over Jordan, and came to Helam'
  - where: 'thread'
    claim: 'On one older reading, “the cities of our God” are the cities God gave Israel and in which He was worshipped'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/19.htm'
    quote: 'the cities of our God] The cities which our God has given us and in which He is worshipped.'
  - where: 'thread'
    claim: 'The next chapter opens with Joab''s siege of Rabbah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/20?lang=eng'
    quote: 'Joab led forth the power of the army, and wasted the country of the children of Ammon, and came and besieged Rabbah.'
  - where: 'note 19:6 “A thousand talents of silver”'
    claim: 'Samuel says only that the Ammonites sent and hired the Syrians, naming Beth-rehob, Zoba, Maacah and Ish-tob, with no price'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/10?lang=eng'
    quote: 'the children of Ammon sent and hired the Syrians of Beth-rehob, and the Syrians of Zoba, twenty thousand footmen, and of king Maacah a thousand men, and of Ish-tob twelve thousand men.'
  - where: 'note 19:6 “A thousand talents of silver”'
    claim: 'A talent was about 75.6 pounds or 34.272 kilograms'
    key: bd-weights-and-measures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/weights-and-measures?lang=eng'
    quote: 'Talent. (Hebrew kikkar); equivalent to 3,000 shekels (see Ex. 38:25, 26); about 75.6 pounds, or 34.272 kilograms.'
  - where: 'note 19:6 “A thousand talents of silver”'
    claim: 'The Hebrew behind “Mesopotamia” in 1 Chr. 19:6 is Aram Naharayim'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: '<w lemma="763" n="0.1.0.0" morph="HNp" id="13yA5">נַהֲרַ֜יִם</w>'
  - where: 'note 19:6 “A thousand talents of silver”'
    claim: 'Aram Naharayim means Aram of the two rivers (Euphrates and Tigris), rendered Mesopotamia in the King James'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/763.htm'
    quote: 'From ''Aram and the dual of nahar; Aram of (the) two rivers (Euphrates and Tigris) or Mesopotamia -- Aham-naharaim, Mesopotamia.'
  - where: 'note 19:7 “Thirty-two thousand chariots”'
    claim: 'On one older reading, Samuel reckons the army with Maacah at 33,000, and “chariots” probably slipped in from verse 6 in place of “men”'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/19.htm'
    quote: 'Cp. 2 Samuel 10:6, which reckons the army (including Maacah) at 33,000, of whom 20,000 are expressly described as footmen. The word “chariots” has probably slipped in from 1 Chronicles 19:6 instead of “men.”'
  - where: 'note 19:7 “Thirty-two thousand chariots”'
    claim: 'Samuel''s figures for the last battle: seven hundred chariots and forty thousand horsemen'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/10?lang=eng'
    quote: 'David slew the men of seven hundred chariots of the Syrians, and forty thousand horsemen'
  - where: 'note 19:7 “Thirty-two thousand chariots”'
    claim: 'Medeba lay in the plain given by Moses to Reuben'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/13?lang=eng'
    quote: 'And Moses gave unto the tribe of the children of Reuben inheritance according to their families. And their coast was from Aroer, that is on the bank of the river Arnon, and the city that is in the midst of the river, and all the plain by Medeba'
  - where: 'christ'
    claim: 'The Church''s chapter heading reads Isaiah 50 of the Messiah, who gives His back to the smiters'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/50?lang=eng'
    quote: 'Isaiah speaks as the Messiah—He will have the tongue of the learned—He will give His back to the smiters'
  - where: 'christ'
    claim: 'The shaving of the envoys was a great insult, compared with Isa. 50:6'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/19.htm'
    quote: 'shaved them] 2 Samuel 10:4, shaved off the one half of iheir beards. Of course a great insult; cp. Isaiah 50:6.'
