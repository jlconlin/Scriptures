chapter: 4
claims:
  - where: when
    claim: 'Chronicles was most likely written after the Babylonian exile, possibly in the fourth century BC'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'The authorship of Chronicles remains uncertain, but most scholars suggest that the books were likely written after the Babylonian exile, possibly in the fourth century BC.'
  - where: setting
    claim: 'Judah has 102 verses (2:1–4:23), Simeon 20 (4:24–43)'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/4.htm'
    quote: '1 Chronicles 2:1 to 1 Chronicles 4:23. Judah (102 verses).'
  - where: setting
    claim: 'One older reading: the order of the tribes begins geographically, with the southern tribes Judah and Simeon'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/4.htm'
    quote: 'It may easily be seen that the tribes in which the Chronicler is really interested are the three southern tribes, Judah, Simeon, and Benjamin, together with the priestly tribe, Levi. The order in which the tribes are mentioned is at first geographical, Judah and Simeon the southern tribes first'
  - where: setting
    claim: 'The book gives a genealogy of the Lord’s people from Adam to the captivity'
    key: ot-seminary-lesson-102
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-books-of-1-and-2-chronicles/lesson-102-1-and-2-chronicles?lang=eng'
    quote: 'this book provides a genealogy of the Lord’s people from the time of Adam to the time of the Babylonian captivity'
  - where: setting
    claim: 'Verse 1 is a line of five or six generations, not five brothers'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/4.htm'
    quote: 'As Hezron was the son of Perez (ch. 1 Chronicles 2:5) and (if the LXX. be right) Shobal was the son of Hur (1 Chronicles 2:50, note), we have in this verse five, if not six, generations.'
  - where: setting
    claim: 'How the family of verses 8–10 joins the sons of Judah in chapter 2 is not clear'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/4.htm'
    quote: '1 Chronicles 4:8-10 contain a fragment, the connection of which with the sons of Judah mentioned in 1 Chronicles 2 is not clear.'
  - where: setting
    claim: 'Of the men of Rechah’s connection with Judah’s larger families nothing is known'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/4.htm'
    quote: 'The genealogy of the men of Rechah. - As to their connection with the larger families of Judah, nothing has been handed down to us.'
  - where: setting
    claim: 'Simeon’s towns in verses 28–33 parallel Joshua 19:1–8'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/4.htm'
    quote: '28–33 (= Joshua 19:1-8). The Territory of Simeon'
  - where: setting
    claim: 'Written after the exile, most scholars think in the fourth century BC'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'most scholars suggest that the books were likely written after the Babylonian exile, possibly in the fourth century BC.'
  - where: thread
    claim: 'The names introduced as “father of” are names of towns'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/4.htm'
    quote: 'The names introduced by אבי are the names of towns.'
  - where: section 1 plain
    claim: '“Father of” a place: the families that derived from it, its founder'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/4.htm'
    quote: 'Etam (1 Chronicles 4:32) was a place; the “sons of Etam” would be families which derived their origin from the place.'
  - where: section 1 plain
    claim: '“Father of” introduces the names of towns'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/4.htm'
    quote: 'The names introduced by אבי are the names of towns.'
  - where: section 1 plain
    claim: 'Ephratah was one of Caleb’s wives, Hur her firstborn'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/4.htm'
    quote: 'Hur] the first-born of Ephratah (R.V. Ephrathah = Ephrath) one of the wives of Caleb (1 Chronicles 2:19).'
  - where: section 3 plain
    claim: 'Shelah was Judah’s third son'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/4.htm'
    quote: 'Descendants of Shelah, the third son of Judah, 1 Chronicles 2:3, and Genesis 38:5.'
  - where: section 3 plain
    claim: '“These are ancient things”: the records are old'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/4.htm'
    quote: 'these are ancient things] R.V. the records are ancient.'
  - where: section 3 plain
    claim: '“Plants and hedges” as the villages Netaim and Gederah, whose people worked for the king'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/4.htm'
    quote: 'those that dwelt amongst plants and hedges] R.V. The inhabitants of Netaim and Gederah. there they dwelt with the king for his work] In the days of the kingdom the inhabitants of these villages were clients of the king and did his work'
  - where: 'note 4:9 “Jabez, the son of sorrow”'
    claim: 'The name Jabez is interpreted in 4:10 as akin to the root ʿṣb'
    key: bdb
    url: 'https://biblehub.com/hebrew/3258.htm'
    quote: 'masculine person Jabez, a man of the Calebites, 1 Chronicles 4:9 (twice in verse); 1 Chronicles 4:10 (where interpreted as akin to עצב'
  - where: 'note 4:9 “Jabez, the son of sorrow”'
    claim: 'ʿōṣeb in 4:9 is pain, of childbirth'
    key: bdb
    url: 'https://biblehub.com/hebrew/6090.htm'
    quote: 'I. עֹ֫צֶב noun [masculine] pain; — ׳ע 1 Chronicles 4:9 (of travail)'
  - where: 'note 4:9 “Jabez, the son of sorrow”'
    claim: '“That it may not grieve me” in 4:10 is the verb of the same root: that it may not pain me'
    key: bdb
    url: 'https://biblehub.com/hebrew/6087.htm'
    quote: 'Infinitive construct suffix לְבִלְתִּי עָצְבִּי 1 Chronicles 4:10 that it (רָעָה) may not pain me'
  - where: 'note 4:9 “Jabez, the son of sorrow”'
    claim: '“Coast” in 4:10 is the boundary of an individual’s territory'
    key: bdb
    url: 'https://biblehub.com/hebrew/1366.htm'
    quote: 'c. boundary of territory belonging to an individual, — of field, piece of ground, etc. Genesis 23:17 (P) Deuteronomy 19:14; Deuteronomy 27:17; Joshua 24:30 (E) = Judges 2:9; 1 Chronicles 4:10'
  - where: 'note 4:18 “A daughter of Pharaoh in Judah’s line”'
    claim: 'Bithiah is counted as the mother of Miriam, Shammai and Ishbah'
    key: hilton-motherhood-ot
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/motherhood-old-testament'
    quote: 'Bithiah. Mother of Miriam, Shammai, and Ishbah (1 Chronicles 4:17–18).'
  - where: 'note 4:18 “A daughter of Pharaoh in Judah’s line”'
    claim: 'Hilton’s appendix lists every mother named in the Old Testament, eighty-four'
    key: hilton-motherhood-ot
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/motherhood-old-testament'
    quote: 'Eighty-four mothers are mentioned by name in the Old Testament (see the appendix for a complete list).'
  - where: 'note 4:18 “A daughter of Pharaoh in Judah’s line”'
    claim: 'In the King James order “she bare” in 4:17 has no woman named before it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/4?lang=eng'
    quote: 'And the sons of Ezra were, Jether, and Mered, and Epher, and Jalon: and she bare Miriam, and Shammai, and Ishbah the father of Eshtemoa.'
  - where: 'note 4:27 “Simeon, a small tribe inside Judah”'
    claim: 'Genesis 46:10 names six sons of Simeon, Ohad among them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/46?lang=eng'
    quote: 'And the sons of Simeon; Jemuel, and Jamin, and Ohad, and Jachin, and Zohar, and Shaul the son of a Canaanitish woman.'
  - where: 'note 4:27 “Simeon, a small tribe inside Judah”'
    claim: 'Numbers 26 gives Simeon five families, without Ohad'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/26?lang=eng'
    quote: 'The sons of Simeon after their families: of Nemuel, the family of the Nemuelites: of Jamin, the family of the Jaminites: of Jachin, the family of the Jachinites:'
  - where: 'note 4:27 “Simeon, a small tribe inside Judah”'
    claim: 'Simeon’s inheritance was taken out of Judah’s, because Judah’s part was too much for them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/19?lang=eng'
    quote: 'Out of the portion of the children of Judah was the inheritance of the children of Simeon: for the part of the children of Judah was too much for them'
  - where: 'note 4:41 “Simeon on the move in Hezekiah’s day”'
    claim: '“They of Ham”: Canaanites never dispossessed, who expected no disturbance'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/4.htm'
    quote: '40. they of Ham] Canaanites who had not been dispossessed at the Conquest and therefore expected no disturbance at a later time.'
  - where: 'note 4:41 “Simeon on the move in Hezekiah’s day”'
    claim: '“The habitations” may be the Meunim; “destroyed them utterly” is “devoted them,” as at Jericho'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/4.htm'
    quote: '41. and the habitations] R.V. and the Meunim. Cp. 2 Chronicles 20:1 (note) and 1 Chronicles 26:7, R.V. destroyed them utterly] R.V. mg., devoted them (cp. Joshua 6:18; Joshua 6:21, R.V.).'
  - where: 'note 4:41 “Simeon on the move in Hezekiah’s day”'
    claim: 'One older reading: the remnant of Amalek descended from those who escaped Saul, and had apparently found refuge in Edom'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/4.htm'
    quote: 'the rest of the Amalekites] R.V. the remnant of the Amalekites i.e. the descendants of those who had escaped from Saul (1 Samuel 15). They had apparently found refuge in some part of the Edomite territory, for Mount Seir is a synonym for the land of Edom.'
  - where: 'note 4:41 “Simeon on the move in Hezekiah’s day”'
    claim: 'Saul utterly destroyed the Amalekites from Havilah to Shur'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/15?lang=eng'
    quote: 'And Saul smote the Amalekites from Havilah until thou comest to Shur, that is over against Egypt.'
  - where: christ
    claim: 'Ephratah is the name of the town Bethlehem (Gen. 35:19; Micah 5:2)'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/4.htm'
    quote: 'Hur was father of Bethlehem through his son Salma (1 Chronicles 2:50-51, LXX.). For the name of the city cp. Genesis 35:19 (Ephrath the same is Bethlehem) and Micah 5:2 (R.V. Thou, Bethlehem Ephrathah).'
  - where: christ
    claim: 'Prayer brings the child’s will into correspondence with the Father’s; it secures blessings God is willing to grant but has made conditional on asking'
    key: bd-prayer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/prayer?lang=eng'
    quote: 'Prayer is the act by which the will of the Father and the will of the child are brought into correspondence with each other. The object of prayer is not to change the will of God but to secure for ourselves and for others blessings that God is already willing to grant but that are made conditional on our asking for them.'
