chapter: 17
claims:
  - where: 'setting'
    claim: 'The ark was set in the tent David had pitched for it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/16?lang=eng'
    quote: 'So they brought the ark of God, and set it in the midst of the tent that David had pitched for it'
  - where: 'setting'
    claim: 'Chronicles, like Samuel, puts the design to build right after the ark comes to Jerusalem, though the events were some years apart'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/17.htm'
    quote: 'In the Chronicle, as in 2 Samuel 7, the account of the removal of the ark to the city of David is immediately followed by the narrative of David''s design to build a temple to the Lord; … though the events must have been separated by a period of several years.'
  - where: 'setting'
    claim: 'The differences from Samuel are mostly formal: later words such as God for the LORD, simpler expressions'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/17.htm'
    quote: 'The difference between the two narratives are in great part of a merely formal kind; the author of the Chronicle having sought to make the narrative more intelligible to his contemporaries, partly by using later phrases current in his own time, such as אלהים for יהוה'
  - where: 'setting'
    claim: 'Chronicles reproduces 2 Samuel 7 with some omissions and variations; its text is generally smoother'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/17.htm'
    quote: 'This passage is a reproduction with some omissions … and variations … of 2 Samuel 7. The text Is generally smoother in Chron.'
  - where: 'setting'
    claim: 'Samuel asks a question where Chronicles states the refusal'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/7?lang=eng'
    quote: 'Go and tell my servant David, Thus saith the LORD, Shalt thou build me an house for me to dwell in?'
  - where: 'setting'
    claim: 'Chronicles later gives bloodshed and wars as the reason David could not build'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/22?lang=eng'
    quote: 'Thou hast shed blood abundantly, and hast made great wars: thou shalt not build an house unto my name, because thou hast shed much blood upon the earth in my sight.'
  - where: 'setting'
    claim: 'Chronicles appears to address whether the covenant still stands'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'In contrast, the question Chronicles appears to address is “Are we still God''s people and does the covenant still stand?” The Chronicler writes to give hope, to create an identity based on worship and the ideals of the kingdom'
  - where: 'thread'
    claim: 'The house the LORD will build David is a dynasty, not a building'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/17.htm'
    quote: 'build thee a house] Sam. make thee an house, the house meant being a dynasty, and not a building.'
  - where: 'thread'
    claim: 'The LORD will build David a house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/17?lang=eng'
    quote: 'Furthermore I tell thee that the LORD will build thee an house.'
  - where: 'note 17:1 “No rest yet”'
    claim: 'Samuel dates the wish to a time of rest from all his enemies, and says the LORD caused David to rest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/7?lang=eng'
    quote: 'And it came to pass, when the king sat in his house, and the LORD had given him rest round about from all his enemies; … and have caused thee to rest from all thine enemies.'
  - where: 'note 17:1 “No rest yet”'
    claim: 'Chapter 18 opens with David subduing the Philistines'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/18?lang=eng'
    quote: 'Now after this it came to pass, that David smote the Philistines, and subdued them, and took Gath and her towns out of the hand of the Philistines.'
  - where: 'note 17:1 “No rest yet”'
    claim: 'The Chronicler probably omits the rest because chapters 18–20 are devoted to wars; v. 10 has subdue for cause to rest'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/17.htm'
    quote: 'Samuel adds, and the Lord had given him rest round about from all his enemies. The Chronicler omits these words probably because his next three chapters (18–20) are devoted to wars'
  - where: 'note 17:1 “No rest yet”'
    claim: 'Verse 10 has subdue where Samuel has cause to rest'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/17.htm'
    quote: 'subdue all thine enemies] Sam. (R.V.) cause thee to rest from all thine enemies.'
  - where: 'note 17:1 “No rest yet”'
    claim: 'The wars against the Philistines, Syrians and Ammonites are told only after; the clause omitted to avoid an apparent contradiction'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/17.htm'
    quote: 'This clause, which fixes the time, has been omitted by the chronicler to avoid the apparent contradiction which would have arisen in case the narrative were taken chronologically, seeing that the greatest of David''s wars, those against the Philistines, Syrians, and Ammonites, are narrated only in the succeeding chapter.'
  - where: 'note 17:11 “What Chronicles changes in the promise”'
    claim: 'Samuel''s wording of the promise: out of thy bowels; the rod; Saul; thine house and thy kingdom before thee'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/7?lang=eng'
    quote: 'which shall proceed out of thy bowels … If he commit iniquity, I will chasten him with the rod of men … as I took it from Saul, whom I put away before thee. And thine house and thy kingdom shall be established for ever before thee'
  - where: 'note 17:11 “What Chronicles changes in the promise”'
    claim: 'Chronicles later names Solomon as the son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/22?lang=eng'
    quote: 'for his name shall be Solomon, and I will give peace and quietness unto Israel in his days. He shall build an house for my name; and he shall be my son, and I will be his father'
  - where: 'note 17:11 “What Chronicles changes in the promise”'
    claim: 'David''s later statement of the promise carries a condition'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/28?lang=eng'
    quote: 'Moreover I will establish his kingdom for ever, if he be constant to do my commandments and my judgments, as at this day.'
  - where: 'note 17:17 “A man of high degree”'
    claim: 'The Hebrew words of the clause'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: 'הַֽ/מַּעֲלָ֖ה'
  - where: 'note 17:17 “A man of high degree”'
    claim: 'BDB: ma''alah is a step or stair; the phrase in 1 Chr 17:17 is corrupt'
    key: bdb
    url: 'https://biblehub.com/hebrew/4609.htm'
    quote: 'II. מַעֲלָה46 noun feminine step, stair … כְּתוֺר האדם המעלה 1 Chronicles 17:17 is corrupt, see Commentaries on the passage (and on "" 2 Samuel 7:19).'
  - where: 'note 17:17 “A man of high degree”'
    claim: 'Samuel''s parallel clause'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/7?lang=eng'
    quote: 'but thou hast spoken also of thy servant’s house for a great while to come. And is this the manner of man, O Lord GOD?'
  - where: 'christ'
    claim: 'Hebrews quotes the words of the promise of the Son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/1?lang=eng'
    quote: 'And again, I will be to him a Father, and he shall be to me a Son?'
  - where: 'christ'
    claim: 'Gabriel promises the throne of David and an endless kingdom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'the Lord God shall give unto him the throne of his father David: … and of his kingdom there shall be no end.'
  - where: 'christ'
    claim: 'Earthly kings failed; everyone can trust Christ to be what kings were meant to be'
    key: sc-knowhy-865
    url: 'https://scripturecentral.org/knowhy/why-does-god-declare-jesus-to-be-his-son'
    quote: 'Unlike earthly rulers who fail, everyone can trust Christ to live up to what kings were always supposed to be.'
  - where: 'christ'
    claim: 'Isaiah offers the sure mercies of David to everyone who thirsts'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/55?lang=eng'
    quote: 'Ho, every one that thirsteth, come ye to the waters … I will make an everlasting covenant with you, even the sure mercies of David.'
  - where: 'christ'
    claim: 'The word for mercy in verse 13 is ḥesed'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: 'וְ/חַסְדִּ/י֙'
  - where: 'christ'
    claim: 'Isaiah 55:3 has the same word, the mercies (ḥasdê) of David'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'חַֽסְדֵ֥י'
  - where: 'christ'
    claim: 'Paul taught that the sure mercies of David were given when God raised Jesus from the dead'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/13?lang=eng'
    quote: 'And as concerning that he raised him up from the dead, now no more to return to corruption, he said on this wise, I will give you the sure mercies of David.'
