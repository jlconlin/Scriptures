chapter: 22
claims:
  - where: 'when'
    claim: 'The preparations belong to the last years of David''s reign'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/22.htm'
    quote: 'the account of the preparations, dispositions, and arrangements which he made in the last years of his reign for the establishment of his kingdom in the future under his successors.'
  - where: 'setting'
    claim: 'Chapter 21 ends at Ornan''s floor: fire from heaven, David afraid to go to Gibeon, sacrifices there'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/21?lang=eng'
    quote: 'But David could not go before it to inquire of God: for he was afraid because of the sword of the angel of the LORD.'
  - where: 'setting'
    claim: 'With chapter 22 a new section of David''s reign begins, the preparations of his last years; all of them concerned the establishment of the public worship of the Lord'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/22.htm'
    quote: 'With this chapter commences the second section of the history of David''s kingship … All these preparations and dispositions had reference to the firm establishment of the public worship of the Lord'
  - where: 'setting'
    claim: 'Kings: Solomon''s letter to Hiram, and the dedicated things Solomon brought in'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/7?lang=eng'
    quote: 'And Solomon brought in the things which David his father had dedicated; even the silver, and the gold, and the vessels, did he put among the treasures of the house of the LORD.'
  - where: 'setting'
    claim: 'Solomon is charged by his father in 1 Kgs 2:1–9 and in 1 Chr 22:6–19 and 28:9–21'
    key: bd-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/solomon?lang=eng'
    quote: 'is charged by his father (1 Kgs. 2:1–9; 1 Chr. 22:6–19; 28:9–21)'
  - where: 'setting'
    claim: 'One reading: the Chronicler wrote in part to legitimize the rebuilt temple'
    key: sc-knowhy-861
    url: 'https://scripturecentral.org/knowhy/why-is-chronicles-in-the-bible'
    quote: 'The Chronicler writes to give hope, to create an identity based on worship and the ideals of the kingdom, and to legitimize their newly rebuilt temple.'
  - where: 'thread'
    claim: 'The chapter''s three parts: workers and materials (2–5), the charge to Solomon (6–16), the call to the chiefs (17–19)'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/22.htm'
    quote: 'David provided the necessary labour and materials for the building of the temple (1 Chronicles 22:2-5), committed the execution of the work in a solemn way to his son Solomon (1 Chronicles 22:6-16), and called upon the chiefs of the people to give him their support'
  - where: 'thread'
    claim: 'David''s preparations were to make the work easier for his successor'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/22.htm'
    quote: 'The grey-haired king accordingly made preparations, after the site of the house of God which should be built had been pointed out to him, such as would facilitate the execution of the work by his successor.'
  - where: 'section 2 plain'
    claim: 'The strangers are non-Israelites living in the land'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/22.htm'
    quote: 'הגּרים, the strangers, are the descendants of the Canaanites whom the Israelites had not destroyed when they took possession of the land, but had reduced to bondage'
  - where: 'section 2 plain'
    claim: '"Joinings" are couplings'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/22.htm'
    quote: '3. the joinings] R.V. the couplings.'
  - where: 'section 2 plain'
    claim: '"Exceeding magnifical": the house is to be made exceedingly great; "young and tender" means very young'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/22.htm'
    quote: 'and the house which is to be built to the Lord is to be made great exceedingly'
  - where: 'section 3 plain'
    claim: '"Cunning men" are men skilled in any kind of work'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/22.htm'
    quote: '15. all manner of cunning men for every manner of work] R.V. all men that are cunning in any manner of work.'
  - where: 'section 3 plain'
    claim: '"In my trouble": the Hebrew noun means affliction or poverty'
    key: bdb
    url: 'https://biblehub.com/hebrew/6040.htm'
    quote: 'עֳנִי noun masculine affliction, poverty'
  - where: 'note 22:1 “The place the LORD had marked”'
    claim: 'The temple''s exact place was indicated by the angel during the plague and the command through Gad'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'The exact position of the temple, the threshing floor of Araunah the Jebusite, was indicated by an angel of the Lord during the plague and the command received through the prophet Gad to build an altar there (1 Chr. 21:15, 18, 26–28).'
  - where: 'note 22:1 “The place the LORD had marked”'
    claim: 'The fire, Gibeon, and David''s fear of the angel''s sword (1 Chr 21:26–30); Solomon builds at Ornan''s floor (2 Chr 3:1)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/3?lang=eng'
    quote: 'Then Solomon began to build the house of the LORD at Jerusalem in mount Moriah, where the LORD appeared unto David his father, in the place that David had prepared in the threshingfloor of Ornan the Jebusite.'
  - where: 'note 22:1 “The place the LORD had marked”'
    claim: 'Bowen: the census and threshing-floor narratives explain the temple''s site as the place of theophany and sacrifice'
    key: bowen-mount-lord-provided
    url: 'https://interpreterfoundation.org/journal/in-the-mount-of-the-lord-it-shall-be-seen-and-provided-theophany-and-sacrifice-as-the-etiological-foundation-of-the-temple-in-israelite-and-latter-day-saint-tradit'
    quote: 'census of Israel (2 Samuel 24; 1 Chronicles 21) served as etiological narratives—explanations of “cause” or “origin”—for the location of the Jerusalem temple and its sacrifices.'
  - where: 'note 22:1 “The place the LORD had marked”'
    claim: 'Bowen: the temple had to be built at the place where the slaughter was stayed by sacrifice'
    key: bowen-mount-lord-provided
    url: 'https://interpreterfoundation.org/journal/in-the-mount-of-the-lord-it-shall-be-seen-and-provided-theophany-and-sacrifice-as-the-etiological-foundation-of-the-temple-in-israelite-and-latter-day-saint-tradit'
    quote: 'not only was vicarious sacrifice at this specific site necessary for the slaughter of Israel and Jerusalem to be permanently “arrested,” but the temple had to be built at this specific site'
  - where: 'note 22:2 “Strangers set to hew stone”'
    claim: 'Solomon numbered the strangers after David''s numbering, 153,600, and set them to the work'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/2?lang=eng'
    quote: 'And Solomon numbered all the strangers that were in the land of Israel, after the numbering wherewith David his father had numbered them; and they were found an hundred and fifty thousand and three thousand and six hundred.'
  - where: 'note 22:8 “Why David could not build”'
    claim: 'David repeats the reason before the leaders: a man of war who shed blood'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/28?lang=eng'
    quote: 'But God said unto me, Thou shalt not build an house for my name, because thou hast been a man of war, and hast shed blood.'
  - where: 'note 22:8 “Why David could not build”'
    claim: 'Skinner: warfare is incongruous with the Lord''s nature; David was forbidden to build for his warfare'
    key: skinner-renounce-war
    url: 'https://rsc.byu.edu/nineteenth-century-saints-war/renounce-war-proclaim-peace'
    quote: 'Warfare is fundamentally incongruous with the Lord’s nature and personality. For example, in ancient Israel, King David was forbidden to build a permanent temple of the Lord in Jerusalem because of his involvement in much warfare'
  - where: 'note 22:8 “Why David could not build”'
    claim: 'Skinner: war hardened David, a man after the Lord''s own heart, until he had Uriah killed'
    key: skinner-renounce-war
    url: 'https://rsc.byu.edu/nineteenth-century-saints-war/renounce-war-proclaim-peace'
    quote: 'As a youth, David was characterized as being a man after the Lord’s “own heart” (1 Samuel 13:14). But war desensitized and hardened David to the point that he killed Uriah the Hittite by sending him to “the forefront of the hottest battle”'
  - where: 'note 22:9 “Solomon, the man of rest”'
    claim: 'The Hebrew name is Šĕlōmōh'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: 'שְׁלֹמֹה֙'
  - where: 'note 22:9 “Solomon, the man of rest”'
    claim: '"A man of rest" is ʾîš mĕnûḥâ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: 'מְנוּחָ֔ה'
  - where: 'note 22:9 “Solomon, the man of rest”'
    claim: 'The Bible Dictionary glosses Solomon as "Peaceable"'
    key: bd-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/solomon?lang=eng'
    quote: 'Peaceable. Son of David and Bathsheba.'
  - where: 'note 22:9 “Solomon, the man of rest”'
    claim: 'Kings: Solomon had peace on all sides; later the LORD stirred up adversaries'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: 'And the LORD stirred up an adversary unto Solomon, Hadad the Edomite: he was of the king’s seed in Edom.'
  - where: 'note 22:9 “Solomon, the man of rest”'
    claim: 'Kings: Solomon''s heart was turned from the LORD, and God stirred up a second adversary, Rezon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: 'because his heart was turned from the LORD God of Israel'
  - where: 'note 22:9 “Solomon, the man of rest”'
    claim: 'A second adversary, Rezon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: 'And God stirred him up another adversary, Rezon the son of Eliadah'
  - where: 'note 22:13 “In the words given to Joshua”'
    claim: 'The speech is full of echoes of the law; the exhortation to be strong recalls Deut 31:6 and Josh 1:7, 9; success depends on keeping the commands'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/22.htm'
    quote: 'The condition of obtaining the result is the faithful observing of the commands of the Lord. The speech is filled with reminiscences of the law, cf. Deuteronomy 7:11; Deuteronomy 11:32; and for the exhortation to be strong and of good courage, cf. Deuteronomy 31:6; Joshua 1:7, Joshua 1:9, etc.'
  - where: 'note 22:13 “In the words given to Joshua”'
    claim: 'Keil compares "prosper" in verse 11 with Josh 1:8'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/22.htm'
    quote: 'והצלחתּ, ut prospere agas et felici successu utaris (J. M. Mich.), cf. Joshua 1:8.'
  - where: 'note 22:13 “In the words given to Joshua”'
    claim: 'Cambridge compares Josh 1:9'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/22.htm'
    quote: '13. be strong, and of good courage] Cp. Joshua 1:9.'
  - where: 'note 22:13 “In the words given to Joshua”'
    claim: 'Joshua''s commission: be strong, keep the law, prosper'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/1?lang=eng'
    quote: 'Only be thou strong and very courageous, that thou mayest observe to do according to all the law, which Moses my servant commanded thee: turn not from it to the right hand or to the left, that thou mayest prosper whithersoever thou goest.'
  - where: 'note 22:14 “Gold and silver beyond counting”'
    claim: 'BDB lists this verse under "poverty"'
    key: bdb
    url: 'https://biblehub.com/hebrew/6040.htm'
    quote: '2 poverty, בְּעָנְיִי הכינותי זהב 1 Chronicles 22:14.'
  - where: 'note 22:14 “Gold and silver beyond counting”'
    claim: 'The Septuagint reads "according to my poverty"'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_chronicles/22.htm'
    quote: '14And, behold, I according to my poverty have prepared for the house of the Lord a hundred thousand talents of gold, and a million talents of silver'
  - where: 'note 22:14 “Gold and silver beyond counting”'
    claim: 'Keil: not poverty but painful labour, compare 29:2; he grants the sums seem enormous yet points to ancient treasure and David''s dedicated spoil, and concludes they need not be incredible'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/22.htm'
    quote: 'בּעניי, not, in my poverty (lxx, Vulg., Luth.), but, by my painful labour (magna molestia et labore, Lavat.); cf. Genesis 31:42, and the corresponding בּכל־כּוחי, 1 Chronicles 29:2.'
  - where: 'note 22:14 “Gold and silver beyond counting”'
    claim: 'Keil: even halved, the sum seems enormously large'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/22.htm'
    quote: 'But even this sum seems enormously large, for it is five times the annual expenditure of the greatest European states in our day.'
  - where: 'note 22:14 “Gold and silver beyond counting”'
    claim: 'Keil: David consecrated the gold and silver taken from conquered peoples; the sums are not to be regarded as incredible'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/22.htm'
    quote: 'had consecrated all the gold and silver taken as booty from the conquered peoples … We cannot therefore regard the sums mentioned in our verse either as incredible or very much exaggerated'
  - where: 'note 22:14 “Gold and silver beyond counting”'
    claim: 'Cambridge: "in my low estate"; at Solomon''s 666 talents a year David would have amassed only 26,640 in forty years; round and exaggerated numbers'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/22.htm'
    quote: 'in my trouble] Render with R.V. marg. in my low estate. … he received in one year 666 talents of gold, but even at this rate David would have amassed only 26,640 talents in forty years. The tradition from which the Chronicler drew expresses itself here in round and exaggerated numbers.'
  - where: 'note 22:14 “Gold and silver beyond counting”'
    claim: 'The Bible Dictionary: the wealth gathered by David and spent by Solomon was enormous'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'The wealth gathered by David and lavished by Solomon on the temple was enormous.'
  - where: 'christ'
    claim: 'God declares Israel''s king His son in several Old Testament passages'
    key: sc-knowhy-865
    url: 'https://scripturecentral.org/knowhy/why-does-god-declare-jesus-to-be-his-son'
    quote: 'In several verses of the Old Testament, God declares the king of Israel to be his son, showing the special relationship between God and the king.'
  - where: 'christ'
    claim: 'Hebrews 1 applies the words to Christ, the Only Begotten Son above the angels'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/1?lang=eng'
    quote: 'The Son is in the express image of the person of the Father—Christ is the Only Begotten Son and thus above the angels.'
