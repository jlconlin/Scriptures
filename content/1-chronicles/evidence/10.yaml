chapter: 10
claims:
  - where: 'setting'
    claim: 'Scripture Helps divides the history so that 1 Chronicles 10 begins the reigns of David and Solomon'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: '1 Chronicles 10–2 Chronicles 9: The reigns of Kings David and Solomon.'
  - where: 'setting'
    claim: 'Chronicles assumes its readers know Samuel and leaves out David''s struggles with Saul'
    key: scripture-helps-2-chronicles
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/28-2-chronicles-14-20-26-30?lang=eng'
    quote: 'It appears that the author or authors of Chronicles assumed that readers would be familiar with the books of Samuel and Kings. Chronicles leaves out, for example, David’s struggles with Saul, his sin with Bathsheba, and other family trials'
  - where: 'setting'
    claim: 'Saul''s death forms the introduction to the history of David''s kingship (chapters 10–29)'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/10.htm'
    quote: 'The account of the ruin of Saul and his house in 1 Chronicles 10:1-14, cf. 1 Sam, forms the introduction to the history of the kingship of David'
  - where: 'setting'
    claim: 'Verses 13–14 are found only in Chronicles, and such reflections are characteristic of the Chronicler'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/10.htm'
    quote: '13, 14 (peculiar to Chron.). The Moral of the Overthrow of the House of Saul Such reflexions as these are characteristic of the Chronicler'
  - where: 'setting'
    claim: 'The parallel account is 1 Samuel 31 (the Church''s footnote)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/10?lang=eng'
    quote: '1a “Philistines”: 1 Sam. 31:1 (1–13).'
  - where: 'setting'
    claim: 'Samuel has Saul''s body fastened to the wall of Beth-shan (Chronicles: his head in the temple of Dagon)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/31?lang=eng'
    quote: 'And they put his armour in the house of Ashtaroth: and they fastened his body to the wall of Beth-shan.'
  - where: 'setting'
    claim: 'Samuel has the bodies burnt at Jabesh, which Chronicles leaves out'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/31?lang=eng'
    quote: 'took the body of Saul and the bodies of his sons from the wall of Beth-shan, and came to Jabesh, and burnt them there.'
  - where: 'thread'
    claim: 'The Chronicler omits David''s seven years in Hebron and shows how after Saul''s death the LORD bestowed the kingship on David'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/10.htm'
    quote: 'apart from that omission of David''s seven years'' reign over the tribe of Judah in Hebron … he shows, firstly, how after the death of Saul Jahve bestowed the kingship upon David, all Israel coming to Hebron and anointing him king'
  - where: 'thread'
    claim: 'The compilers chose the portions that suited their purpose and dwell on the religious side of the history'
    key: bd-chronicles
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/chronicles?lang=eng'
    quote: 'the compilers choosing such portions as suited the purpose of their composition. Though secular events are not excluded from the compilations thus formed, the writers dwell with most satisfaction upon the ecclesiastical and religious aspects of the history'
  - where: 'note 10:6 “All his house died together”'
    claim: 'Samuel has "his armourbearer and all his men"; "all his house" refers to Saul''s servants rather than his family'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/10.htm'
    quote: '6. all his house] In Samuel “his armourbearer and all his men.” The reference is rather to Saul’s servants than to his family.'
  - where: 'note 10:6 “All his house died together”'
    claim: '"All his house" is another expression for "all his men," the king''s attendants; the Chronicler abridged the account'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/10.htm'
    quote: 'but only all those who were about the king, i.e., the whole of the king''s attendants who had followed him to the war. כּל־בּיתו is only another expression for כּל־אנשׁיו … The author of the Chronicle has merely abridged the account'
  - where: 'note 10:6 “All his house died together”'
    claim: 'The Hebrew of verse 6 has "his house" (beto)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: '<w lemma="1004 b" n="0.0" morph="HNcmsc/Sp3ms" id="13hmj">בֵּית֖/וֹ</w>'
  - where: 'note 10:6 “All his house died together”'
    claim: 'Saul''s son Ish-bosheth lived and was made king by Abner'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/2?lang=eng'
    quote: 'But Abner the son of Ner, captain of Saul’s host, took Ish-bosheth the son of Saul, and brought him over to Mahanaim; And made him king'
  - where: 'note 10:13 “The word of the LORD, which he kept not”'
    claim: 'Maʿal is an unfaithful, treacherous act, used of acts against God, including at 1 Chr. 9:1'
    key: bdb
    url: 'https://biblehub.com/hebrew/4604.htm'
    quote: 'מַ֫עַל noun masculineEzra 9:2 unfaithful, treacherous act … 2 elsewhere ag. God, with בְּ, Joshua 22:22 (P); without בְּ, 1 Chronicles 9:1'
  - where: 'note 10:13 “The word of the LORD, which he kept not”'
    claim: 'Verse 13 has the noun maʿal with its verb, "his maʿal which he committed against the LORD"'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: '<w lemma="b/4604" n="1.1.0" morph="HR/Ncmsc/Sp3ms" id="1389i">בְּ/מַֽעֲל/וֹ֙</w>'
  - where: 'note 10:13 “The word of the LORD, which he kept not”'
    claim: 'The Bible Dictionary lists Saul''s sacrifice, the war against Amalek and his rejection, and sums up his downfall'
    key: bd-saul
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/saul?lang=eng'
    quote: 'offers sacrifice (13:9); his oath (14:24–45); war against Amalekites (15:1–9); rejected from being king (15:23) … Saul’s downfall shows the consequences of uncontrolled self-will and disobedience to counsel.'
  - where: 'note 10:13 “The word of the LORD, which he kept not”'
    claim: 'The sentence at Endor names the disobedience over Amalek'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/28?lang=eng'
    quote: 'Because thou obeyedst not the voice of the LORD, nor executedst his fierce wrath upon Amalek, therefore hath the LORD done this thing unto thee this day.'
  - where: 'note 10:14 “Inquired not of the LORD”'
    claim: 'The verb of "inquired not of the LORD" (v. 14) is darash (lemma 1875), as is "to inquire of it" in v. 13 (l/1875)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: '<w lemma="1875" morph="HVqp3ms" id="134HS">דָרַ֥שׁ</w>'
  - where: 'note 10:14 “Inquired not of the LORD”'
    claim: 'BDB lists 1 Chr. 10:14 (the LORD) and 10:13 (heathen gods and necromancers) under the same sense, seek, consult, inquire of'
    key: bdb
    url: 'https://biblehub.com/hebrew/1875.htm'
    quote: '2 seek, consult, inquire of: … the ark of God 1 Chronicles 13:3 … with בְּ Yahweh 1 Chronicles 10:14 … b. heathen gods and necromancers … בָּאוֺב 1 Chronicles 10:13'
  - where: 'note 10:14 “Inquired not of the LORD”'
    claim: 'Saul had tried every legitimate means, but having departed from the Lord, the Lord had departed from him'
    key: jfsmith-endor-1962
    url: 'https://storage.googleapis.com/scripturecentral-prod-strapi-uploads/f_endor_and_samuel_august_1962_566_567_600_601_e4adc4ea02/f_endor_and_samuel_august_1962_566_567_600_601_e4adc4ea02.pdf'
    quote: 'Saul had tried every legitimate means to obtain supernatural guidance, but, as he had departed from the Lord, the Lord had departed from him. There was no answer from heaven to his inquiries'
  - where: 'note 10:14 “Inquired not of the LORD”'
    claim: 'Samuel''s account says Saul inquired of the LORD and was not answered'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/28?lang=eng'
    quote: 'And when Saul inquired of the LORD, the LORD answered him not, neither by dreams, nor by Urim, nor by prophets.'
  - where: 'note 10:14 “The LORD slew him, and turned the kingdom”'
    claim: 'The Church''s footnote at "David" points to 1 Sam. 13:14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/10?lang=eng'
    quote: '14a “David”: 1 Sam. 13:14.'
  - where: 'note 10:14 “The LORD slew him, and turned the kingdom”'
    claim: 'Samuel''s account of the battle ends with the burial and the fast at Jabesh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/31?lang=eng'
    quote: 'And they took their bones, and buried them under a tree at Jabesh, and fasted seven days.'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'David''s charge to Solomon promises that the LORD is found by those who seek him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/28?lang=eng'
    quote: 'if thou seek him, he will be found of thee; but if thou forsake him, he will cast thee off for ever.'
