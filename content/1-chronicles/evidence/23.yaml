chapter: 23
claims:
  - where: 'setting'
    claim: 'Chapters 23–26 give a connected view of the Levites toward the end of David''s reign, in its fortieth year, by divisions and duties'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/23.htm'
    quote: 'These four chapters give a connected view of the condition of the Levites towards the end, i.e., in the fortieth year, of David''s reign (cf. 1 Chronicles 23:1 and 1 Chronicles 26:31), and of the sections into which they were divided according to their various services.'
  - where: 'setting'
    claim: 'The fortieth year of David''s reign is named in 26:31'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/26?lang=eng'
    quote: 'In the fortieth year of the reign of David they were sought for'
  - where: 'setting'
    claim: 'Scholars disagree whether Chronicles'' accounts of the use of psalms reflect David''s day or Second Temple usage; the connection with temple worship is not debated'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'Although scholars disagree whether these accounts reflect an accurate understanding of the use of psalms in David’s day or if they instead are more indicative of temple usage during the Second Temple, the connection with temple worship is not under debate.'
  - where: 'setting'
    claim: 'Chronicles was likely written during the time of the Second Temple'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'First and Second Chronicles—likely written by a temple Levite around 350 BC during the time of the Second Temple—connect Israelite music directly to the office of the Levites and a temple setting.'
  - where: 'thread'
    claim: 'The Hebrew of 23:25 has a singular verb, "and he dwelt," of the LORD'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/1_chronicles/23-25.htm'
    quote: 'way·yiš·kōn וַיִּשְׁכֹּ֥ן that they may dwell Conj‑w ¦ V‑Qal‑ConsecImperf‑3ms'
  - where: 'note 23:1 “Solomon made king, and Adonijah left out”'
    claim: 'The Church''s footnote sends the verse to 1 Kgs. 1:34 and 1 Chr. 29:22'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/23?lang=eng'
    quote: '1a “Solomon”: 1 Kgs. 1:34 (33–39); 1 Chr. 29:22.'
  - where: 'note 23:3 “Thirty, and then twenty”'
    claim: 'Cambridge: two accounts; thirty in Numbers 4; twenty the later custom (2 Chr. 31:17; Ezra 3:8); the difference probably arises from an actual variation in practice'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/23.htm'
    quote: 'the Levites were taken from twenty years old and upwards; this was apparently the later custom; cp. 2 Chronicles 31:17; Ezra 3:8. The discrepancy probably arises from an actual variation in practice.'
  - where: 'note 23:3 “Thirty, and then twenty”'
    claim: 'Cambridge: the age was probably lowered to twenty because the Levites were too few'
    key: cambridge-chronicles
    url: 'https://biblehub.com/commentaries/cambridge/1_chronicles/23.htm'
    quote: 'The original age of admission for Levites was probably thirty, but owing to the scarcity of their numbers it seems to have been necessary to reduce the limit of age to twenty.'
  - where: 'note 23:3 “Thirty, and then twenty”'
    claim: 'Keil: thirty in verse 3 crept into the text by a copyist thinking of the Mosaic census; twenty is confirmed by 2 Chr. 31:17 and Ezra 3:8'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/23.htm'
    quote: 'it cannot be doubtful that the statement in 1 Chronicles 23:3, "from thirty years and upwards," is incorrect, and that, as has been already remarked on 1 Chronicles 23:3, שׁלשׁים has crept into the text by an error of the copyist, who was thinking of the Mosaic census.'
  - where: 'note 23:3 “Thirty, and then twenty”'
    claim: 'Keil reads "the last words of David" as David''s last commands'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/23.htm'
    quote: 'Cler. and Mich., with the Vulg. juxta praecepta, have already correctly translated the words: "according to the last commands of David."'
  - where: 'note 23:3 “Thirty, and then twenty”'
    claim: 'Numbers 4 counts the Kohathites to bear the sanctuary when the camp sets forward'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/4?lang=eng'
    quote: 'as the camp is to set forward; after that, the sons of Kohath shall come to bear it: but they shall not touch any holy thing, lest they die.'
  - where: 'note 23:4 “To oversee the work”'
    claim: 'The verb is Piel "act as overseer, superintendent, director"; its participle names the overseers of the builders (2 Chr. 2:18, Hebrew 2:17) and its infinitive occurs at 1 Chr. 15:21'
    key: bdb
    url: 'https://biblehub.com/hebrew/5329.htm'
    quote: 'Piel = act as overseer, superintendent, director, only Chronicles and Psalm-titles; — Infinitive לְנַצֵּחַ 1 Chronicles 15:21 4t.; participle לַמְנַצֵּחַ Habakkuk 3:19; Psalm 4:1 54t. Psalms'
  - where: 'note 23:5 “The instruments which I made”'
    claim: 'Hezekiah''s Levites stood with "the instruments of David"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/29?lang=eng'
    quote: 'And the Levites stood with the instruments of David, and the priests with the trumpets.'
  - where: 'note 23:5 “The instruments which I made”'
    claim: 'The trained singers of chapter 25 numbered 288'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/25?lang=eng'
    quote: 'So the number of them, with their brethren that were instructed in the songs of the Lord, even all that were cunning, was two hundred fourscore and eight.'
  - where: 'note 23:14 “Moses'' sons among the Levites”'
    claim: 'The lesser priesthood was conferred only on Levites, and within the tribe only Aaron and his sons could hold the office of priest'
    key: bd-aaronic-priesthood
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/aaronic-priesthood?lang=eng'
    quote: 'the lesser priesthood was conferred only upon men of the tribe of Levi. However, within the tribe, only Aaron and his sons could hold the office of priest.'
  - where: 'note 23:14 “Moses'' sons among the Levites”'
    claim: 'The priests could offer sacrifices, burn incense and teach the law'
    key: bd-aaronic-priesthood
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/aaronic-priesthood?lang=eng'
    quote: 'The priests could offer sacrifices for the people, burn incense on the altar, and teach the law'
  - where: 'note 23:14 “Moses'' sons among the Levites”'
    claim: 'The text: Aaron separated to sanctify the most holy things, burn incense, minister, bless in his name; Moses'' sons named of the tribe of Levi'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/23?lang=eng'
    quote: 'Now concerning Moses the man of God, his sons were named of the tribe of Levi.'
  - where: 'note 23:22 “Eleazar''s daughters”'
    claim: 'The law: a daughter who inherits is to marry within her father''s tribe so that each keeps his fathers'' inheritance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/36?lang=eng'
    quote: 'And every daughter, that possesseth an inheritance in any tribe of the children of Israel, shall be wife unto one of the family of the tribe of her father, that the children of Israel may enjoy every man the inheritance of his fathers.'
  - where: 'note 23:22 “Eleazar''s daughters”'
    claim: 'Keil: Eleazar''s daughters married their cousins according to the law for heiresses, so Mahli''s descendants were counted in the one father''s house of Kish'
    key: keil-chronicles
    url: 'https://biblehub.com/commentaries/kad/1_chronicles/23.htm'
    quote: 'who were married to the sons of Kish (אחיהם, i.e., their cousins), according to the law as to daughters who were heiresses (Numbers 26:6-9). The descendants of Mahli, therefore, were comprehended in the one father''s-house of Kish'
  - where: 'note 23:25 “The LORD dwells, so the Levites no longer carry”'
    claim: 'The Hebrew verb in 23:25 is third person masculine singular: "and he dwelt," with the LORD as subject'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/1_chronicles/23-25.htm'
    quote: 'way·yiš·kōn וַיִּשְׁכֹּ֥ן that they may dwell Conj‑w ¦ V‑Qal‑ConsecImperf‑3ms'
  - where: 'note 23:25 “The LORD dwells, so the Levites no longer carry”'
    claim: 'The Septuagint reads that the LORD has taken up his abode in Jerusalem'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_chronicles/23.htm'
    quote: '25For David said, The Lord God of Israel has given rest to his people, and has taken up his abode in Jerusalem for ever.'
  - where: 'note 23:25 “The LORD dwells, so the Levites no longer carry”'
    claim: 'NRSVue: he resides in Jerusalem forever; the Levites no longer need to carry the tabernacle'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1%20Chronicles%2023&version=NRSVUE'
    quote: '“The Lord, the God of Israel, has given rest to his people, and he resides in Jerusalem forever. 26 And so the Levites no longer need to carry the tabernacle or any of the things for its service”'
  - where: 'note 23:28 “At the priests'' hand”'
    claim: 'NRSVue renders the Levites'' office as assisting the descendants of Aaron, and verse 31 as "whenever burnt offerings are offered"'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1%20Chronicles%2023&version=NRSVUE'
    quote: '“but their duty shall be to assist the descendants of Aaron for the service of the house of the Lord'
  - where: 'note 23:28 “At the priests'' hand”'
    claim: 'NRSVue verse 31: whenever burnt offerings are offered'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1%20Chronicles%2023&version=NRSVUE'
    quote: '31 and whenever burnt offerings are offered to the Lord on Sabbaths, new moons, and appointed festivals, according to the number required of them, regularly before the Lord.'
  - where: 'note 23:28 “At the priests'' hand”'
    claim: 'The Bible Dictionary cites 1 Chr. 23:27–32 for the Levites'' tasks assisting the priests'
    key: bd-aaronic-priesthood
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/aaronic-priesthood?lang=eng'
    quote: 'the other Levites were employed in more menial tasks, such as the housekeeping of the tabernacle, keeping oil in the lamps, transporting the Ark of the Covenant, taking down and setting up the tabernacle when moving, and related tasks in assisting the priests (Num. 3:5–10; 18:1–7; 1 Chr. 23:27–32).'
  - where: 'note 23:28 “At the priests'' hand”'
    claim: 'Levites acted as musicians and slaughtered the sacrifices'
    key: bd-levites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levites?lang=eng'
    quote: 'They acted as musicians (1 Chr. 6:16, 31; 15:16; Neh. 11:17, 22); slaughtered the sacrifices (2 Chr. 29:34; 35:11; Ezra 6:20); and generally assisted in the temple'
  - where: 'christ'
    claim: 'John the Baptist was a priest in the Aaronic order and by that authority prepared the way for and baptized Jesus; restored to Joseph Smith and Oliver Cowdery in 1829'
    key: bd-aaronic-priesthood
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/aaronic-priesthood?lang=eng'
    quote: 'from Aaron until John the Baptist, who was a priest in the Aaronic order (D&C 84:26–27), and by this authority he prepared the way for and baptized Jesus. Nineteen centuries later this same John was sent from heaven'
  - where: 'christ'
    claim: 'The lineal restriction of the lesser priesthood was lifted, and offices are conferred without limitation to Levi in the restored Church'
    key: bd-aaronic-priesthood
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/aaronic-priesthood?lang=eng'
    quote: 'The lineal restrictions of that Aaronic (Levitical) Priesthood were lifted when the law of Moses was fulfilled, and thereafter the offices of the priesthood were conferred upon worthy men without limitation to the tribe of Levi.'
  - where: 'christ'
    claim: 'D&C 84:33–34: the faithful who obtain the two priesthoods become the sons of Moses and of Aaron'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'They become the sons of Moses and of Aaron and the seed of Abraham, and the church and kingdom, and the elect of God.'
