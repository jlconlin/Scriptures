chapter: 14
title: God Is Gone Forth before Thee
tagline: Hiram of Tyre builds David a house, sons are born to him in Jerusalem, and twice the Philistines come up against him; twice David asks God, and twice God goes before him. Chronicles sets it all between the ark's two journeys and closes with David's fame among the nations.
when: 'Early in David’s reign over all Israel at Jerusalem; Chronicles tells it while the ark waits in the house of Obed-edom (13:14).'

setting: |
  Chapter 14 retells [[2 Sam. 5:11–25]] almost word for word: Hiram king of Tyre sends cedar and craftsmen to build David a house, David's family grows in Jerusalem, and twice the Philistines come up into the valley of Rephaim and twice David asks God and wins. The site's notes on that chapter explain what David perceived in Hiram's gift, the sons Nathan and Solomon, the name Baal-perazim, the idols left on the field, the second asking and the sound in the mulberry trees; this chapter's notes go to what Chronicles changes.

  The largest change is where the chapter stands: Chronicles sets these events between the ark's first, failed journey (chapter 13) and its second (chapters 15–16), where Samuel tells them first and the two journeys together (the note at verse 1). Smaller changes run through the wording. Verse 3 has “more wives” without Samuel's concubines. The list of sons has thirteen names where Samuel has eleven, adding Elpalet and Nogah; the register at [[1 Chr. 3:6–8]] likewise has Nogah and a second Eliphelet. This list also has Beeliada, a name with Baal in it, where Samuel has Eliada (names of that kind are explained at [[1 Chr. 8:33]]). In the battles Chronicles mostly says “God” where Samuel says “the LORD,” the idols are burned (verse 12), the rout runs from Gibeon where Samuel has Geba (verse 16), and a last verse on David's fame has no counterpart in Samuel.

thread: |
  The chapter shows what verse 2 says David perceived: “that the LORD had confirmed him king over Israel.” A foreign king sends builders, sons are born in the new capital, and when “all the Philistines” come up to seek him, David asks God before he moves, twice, and does “as God commanded him” (verse 16). The first time God breaks through the enemy “by mine hand”; the second time the signal to attack is that “God is gone forth before thee.” The note at [[2 Sam. 5:23]] explains the second asking.

  Verse 17 is Chronicles' own close, missing in Samuel: “the fame of David went out into all lands; and the LORD brought the fear of him upon all nations.” It sums up what the victories did for David's name among the nations, and Chronicles makes the same kind of remark later, as when “the fear of the LORD fell upon all the kingdoms of the lands that were round about Judah” in Jehoshaphat's day ([[2 Chr. 17:10]]). The fame is David's, but the verse says who brought the fear.

sections:
  - range: 1-2
    heading: A house of cedar
    plain: |
      Hiram king of Tyre sent messengers to David, with cedar timber, stonemasons and carpenters, to build him a house. And David understood that the LORD had established him as king over Israel, for his kingdom had been raised high for the sake of His people Israel.
  - range: 3-7
    heading: Sons born in Jerusalem
    plain: |
      In Jerusalem David took more wives, and more sons and daughters were born to him. These are the names of the children born to him in Jerusalem: Shammua, Shobab, Nathan, Solomon, Ibhar, Elishua, Elpalet, Nogah, Nepheg, Japhia, Elishama, Beeliada and Eliphalet.
  - range: 8-12
    heading: The breaking forth at Baal-perazim
    plain: |
      When the Philistines heard that David had been anointed king over all Israel, all the Philistines went up to hunt for him. David heard of it and went out against them. The Philistines came and spread out in the valley of Rephaim. David asked God, “Shall I go up against the Philistines? Will You give them into my hand?” The LORD answered, “Go up, for I will give them into your hand.” So they went up to Baal-perazim, and David struck them down there. David said, “God has burst through my enemies by my hand, like water bursting through.” That is why the place was called Baal-perazim. The Philistines left their gods there, and at David's command they were burned.
  - range: 13-17
    heading: The sound in the treetops
    plain: |
      Once more the Philistines spread out in the valley. Again David asked God, and God told him, “Do not go up after them. Turn away from them and come at them opposite the balsam trees. When you hear the sound of movement in the tops of the trees, then go out to battle, for God has gone out before you to strike the Philistine army.” David did as God commanded him, and they struck down the Philistine army from Gibeon all the way to Gezer. David's fame spread through every land, and the LORD made all the nations fear him.

notes:
  - ref: 1
    phrase: Now Hiram king of Tyre sent messengers to David
    kind: history
    title: Between the ark's two journeys
    body: |
      Chronicles moves this whole chapter to a new place: between the ark's failed journey and its successful one. In Samuel, Hiram's builders, David's sons and the two Philistine battles come right after the taking of Jerusalem ([[2 Sam. 5:11–25]]), and the ark story follows in the next chapter, its two attempts told one after the other ([[2 Sam. 6]]). Chronicles tells the first attempt and Uzza's death in chapter 13, ending with the ark left “with the family of Obed-edom in his house three months” ([[1 Chr. 13:14]]); then it gives this chapter; then it takes up the ark again, with David preparing “a place for the ark of God” ([[1 Chr. 15:1]]).

      The order is the Chronicler's arrangement, not a claim about dates. One older reading cautions against taking it to mean these things happened during the three months: on that reading, Chronicles wanted David's plan to bring the ark to his capital to stand as his first undertaking once Jerusalem was his, and so brought in the events of this chapter later, at the pause that suited them best. So in Chronicles the ark comes first ([[1 Chr. 13:1–4]]), and David's house and victories come in the pause of its story.
    sources: [keil-chronicles, cambridge-chronicles, lds-scriptures]

  - ref: 3
    phrase: And David took more wives at Jerusalem
    kind: history
    title: More wives, and the concubines
    body: |
      Chronicles says David took “more wives,” where Samuel's verse has “more concubines and wives” ([[2 Sam. 5:13]]). The book does not hide the concubines: its own register of David's sons ends, “These were all the sons of David, beside the sons of the concubines” ([[1 Chr. 3:9]]).

      Whether David did right in taking more wives is weighed in the note at [[2 Sam. 12:8]], in the light of [[Jacob 2:23–24]] and [[D&C 132:38–39]].
    sources: [lds-scriptures]

  - ref: 12
    phrase: David gave a commandment, and they were burned with fire
    kind: history
    title: Burned, as the law commanded
    body: |
      Chronicles tells the end of the Philistines' gods in the words of the law of Moses. The law commanded, “The graven images of their gods shall ye burn with fire” ([[Deut. 7:25]]; also [[Deut. 7:5]]), and Chronicles has David give a command so that “they were burned with fire”: in the Hebrew the same verb, *śārap*, “burn,” with the same phrase, *bāʾēš*, “with fire.” Samuel's verse has David and his men “burned them,” where the Hebrew says they “carried them away” ([[2 Sam. 5:21]], whose note tells what the scene meant after the Philistines had once captured the ark).
    sources: [lds-scriptures, oshb-wlc, cambridge-chronicles]

christ: |
  The signal for David's second battle was that “God is gone forth before thee” (verse 15), and David moved when God moved. The God who went before Israel's king is Jehovah, the premortal Jesus Christ ([[Ex. 3:14]]), and He makes a like promise to those He sends now: “I will go before your face. I will be on your right hand and on your left, and my Spirit shall be in your hearts, and mine angels round about you, to bear you up” ([[D&C 84:88]]). A disciple who asks Him and then does as He commands goes into the work He gives with Him already ahead.

explore: |
  - **The same events in Samuel.** [[2 Sam. 5:11–25]], with the site's notes on Baal-perazim, the second asking and the sound in the trees.
  - **The ark's two journeys, on either side of this chapter.** [[1 Chr. 13:1–14]]; [[1 Chr. 15:1–3]].
  - **David asking before he fought.** [[1 Sam. 23:2–4]]; [[1 Sam. 30:8]].
  - **The fear of the LORD on the nations, as Chronicles tells it later.** [[2 Chr. 14:14]]; [[2 Chr. 17:10]]; [[2 Chr. 20:29]].
  - **The LORD rising up “as in mount Perazim.”** [[Isa. 28:21]].

