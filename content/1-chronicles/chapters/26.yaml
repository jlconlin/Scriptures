chapter: 26
title: For Every Gate
tagline: David's last orders for the Levites. The families of the porters, Obed-edom's among them, cast lots for the gates on every side of the house; others keep its treasures and all that Israel's leaders had dedicated; and Levites go out over all Israel as officers and judges, in the business of the LORD and the service of the king.
when: 'The fortieth year of David’s reign, his last (verse 31), as he ordered the service of the house Solomon would build.'

setting: |
  Chapters 23–26 are David's orders for the Levites and priests, given when he was old and had made Solomon king. Chapter 23 numbered the Levites and named their four kinds of work, among them “four thousand were porters” and “six thousand were officers and judges” ([[1 Chr. 23:4–5]]; the Church's footnote at verse 1 points there); chapter 24 divided the priests into courses, and chapter 25 the singers. This chapter finishes the Levites, as the Church's heading summarizes it: the porters (verses 1–19), the keepers of the treasures (verses 20–28), and the Levites who served “for the outward business over Israel” (verses 29–32). None of it is told in Samuel or Kings, and what scholars debate about the date of these lists is said once in the setting of [[1 Chr. 23]].

  Chronicles describes the porters at length twice, in chapter 9 and again here. Chapter 9 places them at the gates of the house after the exile, traces their office to “David and Samuel the seer” (the note at [[1 Chr. 9:22]]), and names the four chief porters trusted with the chambers and treasuries. Chapter 26 shows how David assigned them, family by family and gate by gate. Chapter 27 turns from the Levites to the army and the king's officers.

thread: |
  The chapter moves outward. It begins at the gates, where the Levites of Korah's and Merari's lines stand guard on every side of the house, and the lot, cast for “the small as the great,” decides who stands where (verse 13). It goes inside to the treasuries, where everything dedicated to the LORD, from the spoils of David's wars back to what Samuel and Saul had given, lies “under the hand of Shelomith” (verse 28). And it ends far from the house, with Levites set over Israel west and east of Jordan “for every matter pertaining to God, and affairs of the king” (verse 32).

  Each of these is a charge to keep something: an entrance, a treasure, the people's judgment. The verse that stands out in the lists says why one family had so many hands for the work: Obed-edom's sons were eight, “for God blessed him” (verse 5).

sections:
  - range: 1-11
    heading: The families of the porters
    plain: |
      These are the divisions of the gatekeepers. From the Korahites: Meshelemiah the son of Kore, of the sons of Asaph. Meshelemiah's sons were Zechariah the firstborn, Jediael the second, Zebadiah the third, Jathniel the fourth, Elam the fifth, Jehohanan the sixth and Elioenai the seventh. Obed-edom's sons were Shemaiah the firstborn, Jehozabad the second, Joah the third, Sacar the fourth, Nethaneel the fifth, Ammiel the sixth, Issachar the seventh and Peulthai the eighth, for God had blessed him. Shemaiah also had sons who were leaders in their father's house, for they were capable, strong men: Othni, Rephael, Obed and Elzabad, and their kinsmen Elihu and Semachiah, also able men. All these were descendants of Obed-edom, they and their sons and kinsmen, able and strong for the work: sixty-two of Obed-edom. Meshelemiah had sons and kinsmen, able men, eighteen. Hosah, of the sons of Merari, had sons: Simri the chief (he was not the firstborn, but his father made him chief), Hilkiah the second, Tebaliah the third, Zechariah the fourth. Hosah's sons and kinsmen were thirteen.
  - range: 12-19
    heading: The lot for every gate
    plain: |
      These divisions of the gatekeepers, by their chief men, had duties alongside their kinsmen, serving in the house of the LORD. They cast lots for each gate, small and great alike, by their fathers' houses. The lot for the east fell to Shelemiah. They cast lots for his son Zechariah, a wise counselor, and his lot came out for the north. Obed-edom's came out for the south, and the storehouse fell to his sons. To Shuppim and Hosah the lot fell for the west, with the gate Shallecheth on the road that goes up, guard beside guard. On the east were six Levites, on the north four each day, on the south four each day, and at the storehouse two and two. At Parbar on the west, four at the road and two at Parbar. These were the divisions of the gatekeepers among the sons of Korah and the sons of Merari.
  - range: 20-28
    heading: The treasures and the dedicated things
    plain: |
      Of the Levites, Ahijah was over the treasuries of the house of God and the treasuries of the dedicated gifts. Of the sons of Laadan the Gershonite, heads of fathers' houses, came Jehieli; his sons Zetham and Joel his brother were over the treasuries of the house of the LORD. From the Amramites, Izharites, Hebronites and Uzzielites: Shebuel the son of Gershom, the son of Moses, was chief officer over the treasuries. His kinsmen through Eliezer were Rehabiah, Jeshaiah, Joram, Zichri and Shelomith, each the son of the one before. Shelomith and his kinsmen were over all the treasuries of the dedicated gifts that King David, the heads of fathers' houses, the commanders of thousands and hundreds, and the commanders of the army had dedicated. They had dedicated part of the spoil won in battle to maintain the house of the LORD. Everything that Samuel the seer, Saul the son of Kish, Abner the son of Ner and Joab the son of Zeruiah had dedicated, and anything anyone had dedicated, was in the care of Shelomith and his kinsmen.
  - range: 29-32
    heading: Officers and judges over Israel
    plain: |
      Of the Izharites, Chenaniah and his sons were appointed to duties outside the house, over Israel, as officers and judges. Of the Hebronites, Hashabiah and his kinsmen, seventeen hundred capable men, had oversight of Israel west of the Jordan in all the work of the LORD and in the service of the king. Jerijah was chief of the Hebronites by their family lines. In the fortieth year of David's reign a search was made among them, and capable men were found at Jazer in Gilead. King David set Jerijah and his kinsmen, twenty-seven hundred capable men, heads of families, over the Reubenites, the Gadites and the half tribe of Manasseh, in every matter that concerned God and in the affairs of the king.

notes:
  - ref: 1
    phrase: Concerning the divisions of the porters
    kind: history
    title: Gatekeepers of the house
    body: |
      The “porters” were the gatekeepers of the house of the LORD, and their work was to decide who might enter. The Hebrew word, *shoʿer*, comes from the same root as *shaʿar*, “gate,” which is why modern translations say “gatekeepers.” Like the cherubim set to “keep the way of the tree of life” ([[Gen. 3:24]]), they guarded the boundaries of holy space. Their purpose was not merely to keep people out: they kept the unprepared from sacred things and admitted those who were ready to come into the LORD's presence. Their duties went beyond the door. They acted as a kind of police for the temple, the four chief porters were over its chambers and treasuries ([[1 Chr. 9:26]]), and in Josiah's day “the keepers of the door” gathered the silver brought for the house's repair ([[2 Kgs. 22:4]]).

      The office belonged to Levites of two lines, Korah's and Merari's (verse 19); chapter 9 calls the Korahites “keepers of the gates of the tabernacle” ([[1 Chr. 9:19]]). Psalm 84's “I had rather be a doorkeeper in the house of my God” ([[Ps. 84:10]]) can make the post sound like the humblest in the temple, but the psalm uses a different word, closer to “standing at the threshold” (the note at [[Ps. 84:10]]), and the difference suggests it does not describe the office of these chapters, which was a responsible one.
    sources: [shannon-guarded, lds-scriptures]

  - ref: 1
    phrase: of the sons of Asaph
    kind: words
    title: Asaph, or Ebiasaph?
    body: |
      “Asaph” here is best read as Ebiasaph the Korahite, not Asaph the singer. Meshelemiah is a Korahite, and the Korahites came from Levi's son Kohath through Izhar and Korah ([[Ex. 6:21]]), while Asaph the singer descended from Gershon ([[1 Chr. 6:39–43]]). Chapter 9 gives the same porter family as “Shallum the son of Kore, the son of Ebiasaph, the son of Korah” ([[1 Chr. 9:19]]), and Ebiasaph stands in Korah's line in [[1 Chr. 6:37]]. One older reading corrects the text to Ebiasaph on that basis. The reading changes nothing in the chapter except the name: these porters are of the house of Korah, as verse 19 says.
    sources: [keil-chronicles, lds-scriptures]

  - ref: 5
    phrase: for God blessed him
    kind: history
    title: For God blessed him
    body: |
      The comment looks back to the ark. When Uzza died, David left the ark in the house of Obed-edom for three months, “and the LORD blessed the house of Obed-edom, and all that he had” ([[1 Chr. 13:14]]; the Church's footnote at this verse points there). Here the blessing is counted in sons: eight of them, then grandsons who “ruled throughout the house of their father,” and sixty-two men of Obed-edom's house “able men for strength for the service” (verses 6–8). The family that once kept the ark now keeps the south gate and the storehouse (verse 15).

      Chronicles already had an Obed-edom among the Levites when the ark came up to Jerusalem, as a doorkeeper for the ark ([[1 Chr. 15:24]]) and a porter ([[1 Chr. 16:38]]). Whether he is the same man as “Obed-edom the Gittite” of [[1 Chr. 13:13]] is weighed in the note at [[2 Sam. 6:10]].
    sources: [lds-scriptures]

  - ref: 13
    phrase: for every gate
    kind: symbol
    title: A watch on every side
    body: |
      The porters were placed on all four sides of the house, and the lot set each family at its gate. Chapter 9 says the porters stood “in four quarters … toward the east, west, north, and south” ([[1 Chr. 9:24]]), and verses 14–18 show how the quarters were filled: the east to Shelemiah, the north to his son Zechariah, the south to Obed-edom, the west to Hosah. The lots were cast “as well the small as the great,” as for the priests and the singers (the note at [[1 Chr. 24:5]] explains why the order was drawn by lot). Verses 17–18 then give the daily posts: six on the east, four on the north, four on the south, two and two at the storehouse, four at the causeway and two at Parbar, twenty-four in all.

      The guard on every side has been read as more than a matter of staffing. On one Latter-day Saint reading, gatekeepers at the four cardinal points made the temple a symbol of the ordered cosmos with the house at its center, so that “no matter what direction one approaches the presence of the Lord, one is met by a gatekeeper.” That is one reading; the text itself gives the arrangement without comment.
    sources: [shannon-guarded, lds-scriptures]

  - ref: 15
    phrase: the house of Asuppim
    kind: words
    title: Asuppim, Shallecheth and Parbar
    body: |
      The strange words of verses 15–18 are not men's names but parts of the temple grounds, and some of them are uncertain. The “house of Asuppim” is a storehouse, as modern translations render it: the word is related to collecting provisions, and it was most likely a building for storing the temple's goods near the south gate in the outer court, which needed two posts (“two and two,” verse 17).

      “Shuppim” in verse 16 is probably not a person. No such porter is named in the families of verses 1–11, and both older commentaries take the word as probably an accidental repeat of the end of “Asuppim” in the verse before; on that reading the west fell to Hosah alone. The gate Shallecheth is mentioned nowhere else; an older translation's margin renders the name “casting forth.” “The causeway of the going up” was the road that climbed from the lower city to the higher temple site.

      Parbar (verse 18) is the most obscure. It is probably the same word as the one behind “the suburbs” in [[2 Kgs. 23:11]], where Josiah removed the horses of the sun from the entrance of the house, and it seems to name a building on the west side of the temple area, perhaps a colonnade. Neither commentary claims more certainty than that.
    sources: [keil-chronicles, cambridge-chronicles, nrsvue]

  - ref: 28
    phrase: And all that Samuel the seer, and Saul the son of Kish, and Abner the son of Ner, and Joab the son of Zeruiah, had dedicated
    kind: history
    title: What Samuel, Saul, Abner and Joab had dedicated
    body: |
      The treasury of dedicated things held what Israel's leaders had given to the LORD from Samuel's day to David's. What David and his captains gave came from war: David dedicated the silver and gold of the nations he subdued ([[2 Sam. 8:11]], the Church's footnote at verse 27; [[1 Chr. 18:11]]), and his captains gave from “the spoils won in battles … to maintain the house of the LORD” (verse 27). Verse 28 reaches back further, to Samuel the seer and to Saul, and to the two commanders of the armies, Abner for Saul and Joab for David. Whatever anyone had dedicated came “under the hand of Shelomith, and of his brethren.”

      The house of God had two treasuries: one in the charge of the Gershonites Zetham and Joel (verse 22), the other, of the dedicated things, in the charge of Shelomith, of Moses' line through his son Eliezer (verses 25–26; [[1 Chr. 23:15–17]]). Shebuel, of Moses' line through Gershom, was chief over the treasures (verse 24; the note at [[1 Chr. 23:14]]). The gifts did not stay put away. When the house was finished, Solomon brought in “the things which David his father had dedicated” and placed them among its treasures ([[1 Kgs. 7:51]]).
    sources: [lds-scriptures]

  - ref: 29
    phrase: for the outward business over Israel, for officers and judges
    kind: history
    title: Levites at work outside the house
    body: |
      Not every Levite served at the house: some were sent out over Israel as officers and judges. Chapter 23 counted six thousand of the Levites as “officers and judges” ([[1 Chr. 23:4]]), and these verses name the families given that work. Chenaniah's family of Izharites had “the outward business over Israel,” which a modern translation calls “outside duties for Israel”; seventeen hundred Hebronites under Hashabiah had oversight west of the Jordan, and twenty-seven hundred under Jerijah over Reuben, Gad and the half tribe of Manasseh to the east (verses 30–32).

      The text twice gives the scope of their work as both sacred and civil: “in all the business of the LORD, and in the service of the king” (verse 30), “for every matter pertaining to God, and affairs of the king” (verse 32).
    sources: [lds-scriptures, nrsvue]

  - ref: 31
    phrase: In the fortieth year of the reign of David they were sought for
    kind: history
    title: The fortieth year
    body: |
      The fortieth year was David's last: “the time that he reigned over Israel was forty years” ([[1 Chr. 29:27]]). The Hebronites were reckoned “according to the generations of his fathers,” and the search that year found capable men living at Jazer in Gilead, one of the Levites' cities in the tribe of Gad ([[Josh. 21:39]]). These Levites of the east were the ones David set over the tribes east of the Jordan (verse 32). The date belongs to the search at Jazer, and it agrees with the setting chapter 23 gives all these orders: the end of David's life, when he “was old and full of days” ([[1 Chr. 23:1]]).
    sources: [lds-scriptures, nrsvue]

christ: |
  The gatekeepers kept the way into the LORD's house, and Jacob names the One who keeps the last gate: “the keeper of the gate is the Holy One of Israel; and he employeth no servant there” ([[2 Ne. 9:41]]). All the temple's gatekeepers stand for that final Gatekeeper, and in the end only Jesus Christ can bring a person fully into the presence of God. The house of the Lord still has its gate and its keepers, and those who enter now present a recommend from their ecclesiastical leaders; behind every such gate stands Christ, who “cannot be deceived.”

