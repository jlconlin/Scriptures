chapter: 12
title: Thine Are We, David
tagline: Before all Israel crowned David, men came over to him one band at a time, Benjamites, Gadites, men of Judah and captains of Manasseh, and then the armed men of every tribe came to Hebron with one heart to make him king.
when: 'From David''s years as a fugitive from Saul, in the strongholds of the wilderness and at Ziklag, to the day the tribes made him king at Hebron.'

setting: |
  Chronicles has already crowned David. Chapter 11 brought all Israel to him at Hebron, where they anointed him king “according to the word of the LORD by Samuel” ([[1 Chr. 11:3]]), and then told of Jerusalem and listed his mighty men. Chapter 12, which is not in Samuel, steps back to tell who had come to him before that day.

  It holds two registers. The first (verses 1–22) names the warriors who went over to David while Saul was still alive: Benjamites who came to him at Ziklag, the Philistine town where he lived “a full year and four months” ([[1 Sam. 27:7]]); Gadites and men of Benjamin and Judah who came to “the hold,” the strongholds in the wilderness of Judah where he hid in the first years of his flight ([[1 Sam. 22:1–2]]); and captains of Manasseh who joined him as he came back from the Philistine army ([[1 Sam. 29:11]]). The second (verses 23–40) counts the armed men of every tribe who came to Hebron to make him king.

  Chronicles leaves out David's struggles with Saul, which it expects its readers to know from Samuel. What it keeps of those years is this list of the men who chose David while Saul still reigned. On one older reading, the list also helps explain Saul's defeat on Gilboa: the king grew weaker as some of the boldest men of the nation left him for David, and “an Israel divided against itself could not stand.”

thread: |
  The chapter's word is “help.” The first men are “helpers of the war” (verse 1); David asks the men at the hold whether they have come “to help me” (verse 17); Amasai answers, “peace be to thine helpers; for thy God helpeth thee” (verse 18); the captains of Manasseh “helped David” (verse 21); and “day by day there came to David to help him, until it was a great host, like the host of God” (verse 22). Amasai's line puts God among David's helpers.

  The chapter moves from a few men slipping away to the outlaw to a whole nation. It begins with Benjamites from Saul's own tribe and ends with every tribe at Hebron, “of one heart to make David king” (verse 38). Verse 23 says what they came to do: “to turn the kingdom of Saul to him, according to the word of the LORD.” Chronicles closed Saul's death with the same verb, “he slew him, and turned the kingdom unto David” ([[1 Chr. 10:14]]); this chapter shows the turning done by men who came over, band by band.

  It ends at a table. For three days the tribes ate and drank with David, the feasting perhaps beginning with the meal that sealed a covenant, and the northern tribes sent food on asses, camels, mules and oxen, “for there was joy in Israel.”

sections:
  - range: 1-7
    heading: Benjamites at Ziklag
    plain: |
      These are the men who came to David at Ziklag while he was still confined there, unable to move freely because of Saul son of Kish. They were among the warriors who helped him in battle. They were archers who could sling stones and shoot arrows with either the right hand or the left, and they were Saul's own kinsmen of the tribe of Benjamin. Their leader was Ahiezer, then Joash, sons of Shemaah of Gibeah; then come the other names: Jeziel and Pelet, sons of Azmaveth; Berachah; Jehu of Anathoth; Ismaiah of Gibeon, a warrior ranked with the thirty and over them; Jeremiah, Jahaziel, Johanan and Josabad of Gederah; Eluzai, Jerimoth, Bealiah, Shemariah and Shephatiah the Haruphite; Elkanah, Jesiah, Azareel, Joezer and Jashobeam, of the family of Korah; and Joelah and Zebadiah, sons of Jeroham of Gedor.
  - range: 8-15
    heading: Gadites from across the Jordan
    plain: |
      Some Gadites also broke away and went over to David at his stronghold in the wilderness: strong men, trained for war, who could handle shield and buckler, with faces like lions' faces and feet as swift as deer on the mountains. Ezer was first, then Obadiah, Eliab, Mishmannah, Jeremiah, Attai, Eliel, Johanan, Elzabad, Jeremiah and Machbanai, eleven in all. These Gadites were officers of the army; the least of them was over a hundred men and the greatest over a thousand. They crossed the Jordan in the first month of the year, when it was flooding over all its banks, and they drove off everyone in the valleys to the east and to the west.
  - range: 16-18
    heading: Amasai's answer
    plain: |
      Men of Benjamin and Judah also came to David at the stronghold. David went out to meet them and said, “If you have come in peace to help me, my heart will be bound to you. But if you have come to betray me to my enemies, though I have done no wrong, may the God of our fathers see it and judge it.” Then the Spirit came upon Amasai, the chief of the captains, and he said, “We are yours, David, and on your side, son of Jesse! Peace, peace to you, and peace to those who help you, for your God helps you.” So David received them and made them officers of his band.
  - range: 19-22
    heading: Captains of Manasseh
    plain: |
      Some men of Manasseh deserted to David when he marched with the Philistines to fight Saul. In the end he did not help the Philistines, because their lords consulted together and sent him away, saying, “He will go back to his master Saul, and it will cost us our heads.” As David went back to Ziklag, these men of Manasseh went over to him: Adnah, Jozabad, Jediael, Michael, Jozabad, Elihu and Zilthai, commanders of thousands in Manasseh. They helped David against the raiding band (on one older reading, the Amalekites who had burned Ziklag), for they were all brave warriors and became officers in his army. Day after day men kept coming to help David, until he had a great army, like an army of God.
  - range: 23-37
    heading: The tribes come to Hebron
    plain: |
      These are the numbers of the armed men who came to David at Hebron to turn Saul's kingdom over to him, as the LORD had said. From Judah, 6,800 armed with shield and spear. From Simeon, 7,100 brave warriors. From Levi, 4,600; Jehoiada, leader of the family of Aaron, came with 3,700, and Zadok, a brave young warrior, with 22 officers from his father's family. From Benjamin, Saul's own tribe, 3,000, for until then most of them had stayed loyal to Saul's house. From Ephraim, 20,800 brave warriors, famous in their clans. From the half tribe of Manasseh, 18,000, chosen by name to come and make David king. From Issachar, 200 chiefs, men who understood the times and knew what Israel should do, with all their kinsmen under their command. From Zebulun, 50,000 seasoned soldiers with every kind of weapon, who could set the battle in order and were wholehearted. From Naphtali, 1,000 officers with 37,000 men bearing shield and spear. From Dan, 28,600 trained for battle. From Asher, 40,000 seasoned soldiers. From beyond the Jordan, from Reuben, Gad and the other half of Manasseh, 120,000 armed with every kind of weapon.
  - range: 38-40
    heading: One heart, and three days of feasting
    plain: |
      All these warriors, ready in their ranks, came to Hebron with whole hearts to make David king over all Israel, and all the rest of Israel were of one mind to make David king. They stayed there with David three days, eating and drinking, for their kinsmen had provided for them. Their neighbors too, as far away as Issachar, Zebulun and Naphtali, brought food on donkeys, camels, mules and oxen: flour, cakes of figs, clusters of raisins, wine, oil, cattle and sheep in plenty, for there was joy in Israel.

notes:
  - ref: 15
    phrase: when it had overflown all his banks
    kind: history
    title: Across the Jordan in flood
    body: |
      The Gadites crossed to David at the worst time of year to cross. Gad lived east of the Jordan, and David's stronghold was in the wilderness of Judah to the west. “The first month” was the month of harvest, when melting snow fills the streams; Joshua's crossing names the same season, “for Jordan overfloweth all his banks all the time of harvest” ([[Josh. 3:15]]). On one older reading, the people of the valleys they “put to flight” were men who tried, in Saul's interest, to bar their way west.

      The rest of the description says the same thing in other words: these were men who would get through. They “separated themselves” from the rest of their tribe, which on one older reading still held with Saul, to join an outlaw in his hiding places. Their faces “were like the faces of lions,” and they were “as swift as the roes upon the mountains.” On the same reading, these expressions recall those used of heroes of David's time, as Saul and Jonathan “were stronger than lions” ([[2 Sam. 1:23]]) and Asahel “was as light of foot as a wild roe” ([[2 Sam. 2:18]]), and the description was drawn from the old records, not added by the Chronicler.
    sources: [cambridge-chronicles, keil-chronicles, lds-scriptures]

  - ref: 18
    phrase: Then the spirit came upon Amasai
    kind: history
    title: The Spirit clothed Amasai
    body: |
      Amasai's pledge to David was given by the Spirit. David could not tell whether the men of Benjamin and Judah at his stronghold had come to join him or to betray him, and he met them with a test: if they came in peace, his heart would be “knit” to them; if they came to betray him, “the God of our fathers look thereon, and rebuke it” (verse 17). The answer came by the Spirit. “The spirit came upon” Amasai: the Hebrew is *lāḇəšâ*, the spirit “clothed itself with” him, that is, took possession of him. It is the expression used when “the Spirit of the LORD came upon Gideon” ([[Judg. 6:34]]) and when the Spirit came on Zechariah the son of Jehoiada to testify against Judah ([[2 Chr. 24:20]]).

      What the Spirit gave him to say is a declaration of allegiance, “Thine are we, David, and on thy side, thou son of Jesse,” with peace to David and to all who help him, “for thy God helpeth thee.” David took them in and made them officers.

      Who Amasai was is not certain. The Church's footnote sends the reader to [[2 Sam. 17:25]], to Amasa, the son of David's sister Abigail, whom Absalom later made captain of his host (the note there tells his story); the names are close, but the text does not say they are the same man.
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 24
    phrase: six thousand and eight hundred
    kind: history
    title: Six thousand from Judah, fifty thousand from Zebulun
    body: |
      The numbers of verses 24–37 are very large, and their proportions are surprising. They add up to more than three hundred thousand armed men (some 340,800 by one count), and David's own tribe sends the fewest: Judah 6,800, against 50,000 from Zebulun, 37,000 from Naphtali and 120,000 from beyond the Jordan.

      One proposal reads the Hebrew *ʾlp* in these verses, which without its vowels can stand for more than one word, as officers rather than thousands of men, so that the feast at Hebron was attended by “roughly 2,000 ‘famous men’” rather than hundreds of thousands. The general case for reading *ʾlp* this way is set out in the note at [[2 Sam. 24:9]].

      Some of the proportions have plainer reasons. Benjamin's 3,000 are explained in verse 29: until then most of the tribe had stayed loyal to Saul's house. On one older reading, Judah sent few because it did not need to come: David had already reigned over Judah for seven years ([[2 Sam. 2:4]]; [[2 Sam. 5:5]]), so a small company stood witness for the tribe while the others did him homage, and Simeon, whose land lay within Judah's, had done the same. That reading takes the totals as they stand, as estimates of the tribes' companies rather than a head count. Neither reading is settled; the figures above are the text's.
    sources: [ot-manual-large-numbers, keil-chronicles, lds-scriptures]

  - ref: 28
    phrase: And Zadok, a young man mighty of valour
    kind: history
    title: Zadok, a young man
    body: |
      The young warrior who came to Hebron with twenty-two captains of his family is, on the Bible Dictionary's reading, Zadok the priest, who later anointed David's son Solomon. The dictionary lists this verse among those for the priest, of the family of Aaron's son Eleazar. In the last years of Saul's reign there seems to have been “a double high priesthood”: Abiathar, of the family of Ithamar, served in David's camp, and Zadok at Gibeon, where the tabernacle stood. Both continued after David became king.

      The arrangement ended in a test of loyalty. When Adonijah tried to take the throne, Abiathar joined him and Zadok stayed with David; Zadok anointed Solomon ([[1 Kgs. 1:39]]) and was put in Abiathar's place ([[1 Kgs. 2:35]]). Chronicles' genealogy has already named him in Eleazar's line ([[1 Chr. 6:8]], [[1 Chr. 6:53]]); this is his first appearance in its story, already with David on the day the tribes made him king.
    sources: [bd-zadok, lds-scriptures]

  - ref: 32
    phrase: men that had understanding of the times, to know what Israel ought to do
    kind: words
    title: Understanding of the times
    body: |
      The men of Issachar knew what time it was: what the moment called for, and so what Israel should do. “Times” is *ʿittîm*, the plural of *ʿēt*, “time,” and in this verse it carries the sense of the proper or suitable time, beside the Preacher's “a time to” of [[Eccl. 3:1–8]]. Their “understanding of the times” was an understanding of the season for acting. The verse defines it in its next words, “to know what Israel ought to do,” and the men of Issachar had come with the rest “to make David king” (verse 38).

      Issachar is also counted differently from every other tribe. Chronicles gives no number of its warriors, only its two hundred heads, “and all their brethren were at their commandment.”
    sources: [bdb, oshb-wlc]

  - ref: 38
    phrase: came with a perfect heart to Hebron
    kind: words
    title: A perfect heart, not a double heart
    body: |
      The chapter ends by describing the men at Hebron by their hearts, three ways, and all three say the same thing: they were undivided. Zebulun's warriors “were not of double heart” (verse 33); the Hebrew is *bəlōʾ lēḇ wālēḇ*, “without a heart and a heart,” the same pairing that [[Ps. 12:2]] uses of those who speak “with a double heart.” All the warriors came “with a perfect heart,” *lēḇāḇ šālēm*: a heart that is whole, at peace with the LORD and keeping covenant with Him, and so complete. And the rest of Israel, who stayed home, “were of one heart,” *lēḇ ʾeḥāḏ*, to make David king.

      “Perfect” here is *šālēm*, “complete.” The same phrase stands in David's charge to his son, “serve him with a perfect heart and with a willing mind” ([[1 Chr. 28:9]]), and in the people's offering for the temple ([[1 Chr. 29:9]]).
    sources: [bdb, oshb-wlc, lds-scriptures]

christ: |
  David came to the throne as the LORD's anointed, “according to the word of the LORD” (verse 23), and “Messiah,” the title the Savior bears, means “the anointed”; its Greek equivalent is “Christ.” The men in this chapter chose David's side before he had a crown, and Amasai's “Thine are we” came by the Spirit. At Hebron they came to the LORD's anointed “with a perfect heart,” a heart at peace with the LORD and keeping covenant with Him (the note at verse 38). The Savior asks the same undivided heart of a disciple now: the commandment He called the first and great one ([[Matt. 22:38]]) is Moses' “thou shalt love the LORD thy God with all thine heart” ([[Deut. 6:5]]).

explore: |
  - **David's years as a fugitive in Samuel.** The band at the cave and the hold, [[1 Sam. 22:1–5]]; Ziklag, [[1 Sam. 27:1–7]]; sent back from the Philistine army and the raid on Ziklag, [[1 Sam. 29–30]].
  - **David made king.** Over Judah at Hebron, [[2 Sam. 2:1–4]]; over all Israel, [[2 Sam. 5:1–3]] and [[1 Chr. 11:1–3]].
  - **The Spirit that “clothed” a man.** [[Judg. 6:34]]; [[2 Chr. 24:20]].
  - **A perfect heart in Chronicles.** [[1 Chr. 28:9]]; [[1 Chr. 29:9]], [[1 Chr. 29:17–19]].

