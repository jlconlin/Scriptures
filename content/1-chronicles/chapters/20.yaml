chapter: 20
title: The Crown of Their King
tagline: Joab takes Rabbah, the crown of Ammon is set on David's head, and David's servants kill three champions of the giant's line at Gezer and Gath. Between those two stories Samuel tells Bath-sheba, Absalom and Sheba; Chronicles goes straight from one to the other.
when: 'David’s reign at Jerusalem: the spring campaign in which Rabbah fell, and later battles with the Philistines.'

setting: |
  Chapter 19 told how the Ammonites shamed David's messengers and hired the Syrians against him, and ended with the Syrians unwilling to “help the children of Ammon any more” ([[1 Chr. 19:19]]). Chapter 20 finishes that war. In the spring Joab took the army back into Ammon and besieged Rabbah, the Ammonites' chief city, whose ruins lie at modern Amman. The city fell, the crown of Ammon was set on David's head, and the people of Rabbah and of the other Ammonite towns were put under saws and axes (the note at verse 3). The Church's footnotes send verses 1–3 to [[2 Sam. 11:1]] and [[2 Sam. 12:26–31]], with everything between those passages left out.

  Verses 4–8 then tell three battles with the Philistines in which David's men killed champions descended from “the giant” of Gath, the stories of [[2 Sam. 21:18–22]]. Between verse 3 and verse 4 Chronicles passes over eight chapters of Samuel: Absalom's rebellion, Sheba's revolt and the Gibeonites' vengeance on Saul's house (the note at verse 4). These are the last of David's wars that Chronicles tells. From chapter 21 the book turns to the census, the threshing floor, and the place David names as “the house of the LORD God” ([[1 Chr. 22:1]]).

thread: |
  The chapter is two short pieces cut from Samuel, a siege and a list of giants, and it brings David's wars in Chronicles to their end. The crown of Ammon comes to David's head, and the last of Goliath's kin fall “by the hand of David, and by the hand of his servants” (verse 8). What Samuel sets between and around those victories is gone: the line “But David tarried at Jerusalem” stays, but the story it opens in Samuel, of Bath-sheba and Uriah and Nathan's rebuke, does not follow it, and neither do Absalom, Sheba, nor the day David nearly died at a giant's hand.

  Chronicles appears to assume that its readers knew Samuel and Kings, and so leaves out David's sin with Bath-sheba and his family trials (the note at verse 1).

sections:
  - range: 1-1
    heading: The siege of Rabbah
    plain: |
      In the spring, when the year had turned and kings go out to war, Joab led out the army, ravaged the land of the Ammonites, and came and besieged Rabbah. But David stayed in Jerusalem. Joab struck Rabbah and destroyed it.
  - range: 2-3
    heading: The crown and the captives
    plain: |
      David took the crown of their king from his head and found that it weighed a talent of gold, and there were precious stones in it; and it was set on David's head. He also brought a very great deal of plunder out of the city. He brought out the people who were in it and cut them with saws, with iron harrows, and with axes. David did the same to all the cities of the Ammonites. Then David and all the people returned to Jerusalem.
  - range: 4-8
    heading: The sons of the giant
    plain: |
      After this, war broke out with the Philistines at Gezer, and Sibbechai the Hushathite killed Sippai, one of the descendants of the giant, and the Philistines were subdued. There was war with the Philistines again, and Elhanan the son of Jair killed Lahmi the brother of Goliath the Gittite, the shaft of whose spear was like a weaver's beam. There was yet another war at Gath, where there was a huge man with six fingers on each hand and six toes on each foot, twenty-four in all; he too was descended from the giant. When he taunted Israel, Jonathan the son of Shimea, David's brother, killed him. These were descendants of the giant in Gath, and they fell by the hand of David and by the hand of his servants.

notes:
  - ref: 1
    phrase: But David tarried at Jerusalem
    kind: history
    title: Where Bath-sheba is
    body: |
      Chronicles keeps the sentence with which Samuel begins the story of Bath-sheba, and then leaves the story out. In Samuel, “But David tarried still at Jerusalem” ([[2 Sam. 11:1]]) is followed at once by the king rising from his bed and walking on his roof; the adultery, Uriah's death, Nathan's parable and the death of the child fill the next chapter and a half, and the siege of Rabbah comes back only at [[2 Sam. 12:26]]. Chronicles goes straight from the line to the fall of the city. The site's note at [[2 Sam. 11:1]] says what the line means in Samuel, where the king who stays home is the beginning of his fall.

      Chronicles appears to assume that its readers knew Samuel and Kings, and among what it “leaves out” are “David's struggles with Saul, his sin with Bathsheba, and other family trials.” The question it appears to address is “Are we still God's people and does the covenant still stand?”, and it writes “to give hope, to create an identity based on worship,” for a people with a newly rebuilt temple.

      What Chronicles leaves out is not every fault of David's. It keeps Uriah the Hittite on the roll of the mighty men ([[1 Chr. 11:41]]), tells the census and the seventy thousand who died of the plague ([[1 Chr. 21]]), and gives the LORD's reason David could not build the house: “Thou hast shed blood abundantly, and hast made great wars” ([[1 Chr. 22:8]]).
    sources: [lds-scriptures, scripture-helps-2-chronicles, sc-knowhy-861]

  - ref: 1
    phrase: And Joab smote Rabbah, and destroyed it
    kind: history
    title: Who took Rabbah
    body: |
      Chronicles gives Joab the fall of Rabbah and then, with no word of David coming to the city, sets the Ammonite crown on David's head; Samuel tells what happened between. Rabbah was the Ammonites' chief city, in the valley of the upper Jabbok. In [[2 Sam. 12:26–29]] Joab takes “the royal city” and “the city of waters,” then sends to David: “gather the rest of the people together, and encamp against the city, and take it: lest I take the city, and it be called after my name.” David comes, fights against Rabbah, and takes it. Chronicles keeps the result, Joab's victory and David's crown, without the message that brought the king from Jerusalem to the siege.
    sources: [lds-scriptures, bd-rabbah]

  - ref: 2
    phrase: the crown of their king
    kind: words
    title: Their king, or Milcom?
    body: |
      The Hebrew for “their king,” *malkām*, has the same letters as the name of the Ammonites' god, and the Greek translation gives both the name and “their king”: “the crown of Molchom their king.” The Hebrew text, as the vowel marks later added to its letters read it, has “their king,” and the King James follows it. But the same letters stand for the god in [[Zeph. 1:5]], where the King James has “swear by Malcham,” and the god himself is “Milcom the abomination of the Ammonites,” whom Solomon would later follow ([[1 Kgs. 11:5]]), a fire god whose worship passed children through fire. Read as the Greek reads it, the crown David took was Milcom's.

      The text does not settle which is meant. On either reading the gold crown of Ammon, set with precious stones, was taken from its former wearer and set on David's head, as [[2 Sam. 12:30]] tells it too.
    sources: [oshb-wlc, lxx-rahlfs, bd-molech]

  - ref: 3
    phrase: cut them with saws
    kind: words
    title: Cut, or put to work?
    body: |
      Chronicles says David “cut them with saws,” where Samuel says he “put them under saws” ([[2 Sam. 12:31]]), and the two Hebrew verbs differ by one letter: Chronicles has *wayyāśar*, Samuel *wayyāśem*, “and he put.” Chronicles’ verb means “saw” and occurs only here; its derivation is uncertain, and it may stand for Samuel’s verb “put.” The site's note at [[2 Sam. 12:31]] weighs the two readings that follow: older commentaries read Samuel by Chronicles and saw torture, and modern translations read the verses as forced labor with saws, picks and axes.

      On the second view this verse too would be read as Samuel's, “put them to work with saws,” since the tools “suggest task-work, not massacre.” That reading explains the harsh treatment, whichever it was, by the Ammonites' insult to David's messengers, whose beards and garments they had cut ([[1 Chr. 19:4]]). The sources divide, and the Church's footnote to this verse simply points to Samuel and to the Topical Guide's “Cruelty.”
    sources: [oshb-wlc, bdb, cambridge-chronicles, lds-scriptures]

  - ref: 4
    phrase: And it came to pass after this
    kind: history
    title: Eight chapters of Samuel passed over
    body: |
      “After this” joins verse 3 to a passage that stands eight chapters later in Samuel. The battles of verses 4–8 are [[2 Sam. 21:18–22]], and in Samuel they come after Absalom's rebellion and death, Sheba's revolt, and the famine for Saul's broken oath with the Gibeonites ([[2 Sam. 13:1–21:14]]). Chronicles passes over all of it, as it passed over Bath-sheba (the note at verse 1).

      It also leaves out the scene just before these battles in Samuel. There David “waxed faint” fighting the Philistines, the giant Ishbi-benob “thought to have slain David,” and Abishai saved him, after which David's men swore that he would go no more to battle, “that thou quench not the light of Israel” ([[2 Sam. 21:15–17]]; the note at [[2 Sam. 21:17]]). In Chronicles only the summary of the giants' end remains: they “fell by the hand of David, and by the hand of his servants” (verse 8).

      The names differ a little from Samuel's: the battle there is “at Gob,” here at Gezer, and the giant there is Saph, here Sippai. The note at [[2 Sam. 21:16]] says who “the giant” was.
    sources: [lds-scriptures]

  - ref: 5
    phrase: Lahmi the brother of Goliath the Gittite
    kind: history
    title: Lahmi the brother of Goliath
    body: |
      Chronicles names the man Elhanan killed as Goliath's brother, where the Hebrew of [[2 Sam. 21:19]] names Goliath himself. There Elhanan is “the son of Jaare-oregim, a Beth-lehemite,” and the King James takes the words “the brother of” in that verse from this one (the note at [[2 Sam. 21:19]]). Here his father is Jair, and where Samuel has *bêt hallaḥmî*, “a Beth-lehemite,” Chronicles has *laḥmî ʾăḥî*, “Lahmi the brother of.”

      Two explanations of Samuel’s verse are possible: “the reference is probably to a different man of the same name, or some error may have crept into the text.” The note at [[2 Sam. 21:19]] gives one older reading that finds a copying slip between the two verses, a reading that also allows that another giant may have borne Goliath's name. Chronicles' reading leaves David the slayer of Goliath himself, as [[1 Sam. 17]] tells it.
    sources: [oshb-wlc, lds-scriptures, bd-goliath]

christ: |
  The giants of Gath fall here to David's servants, Sibbechai, Elhanan and Jonathan, as Goliath once fell to David, who had told him that “the battle is the LORD's” ([[1 Sam. 17:47]]). The LORD who gave Israel those victories is Jehovah, the premortal Jesus Christ ([[Ex. 3:14]]), and in this dispensation He told the Saints, “I will fight your battles” ([[D&C 105:14]]). A disciple's victories are His, whether they come by a leader's hand or by a servant's, as the last of the giants fell “by the hand of David, and by the hand of his servants” (verse 8).

