chapter: 13
title: How Shall I Bring the Ark of God Home to Me?
tagline: David takes counsel with all Israel to bring back the ark that was not sought in the days of Saul. It comes from Kirjath-jearim on a new cart with all Israel's music, until Uzza puts out his hand to it and dies, and the ark is left three months in the house of Obed-edom, which the LORD blesses.
when: 'David’s reign over all Israel, after the gathering at Hebron and the taking of Jerusalem (chapters 11–12); the ark stays three months with Obed-edom (verse 14).'

setting: |
  Chronicles goes straight from the gathering of all Israel to David (chapters 11–12) to his plan to bring the ark of the covenant to Jerusalem. Samuel tells the same day in [[2 Sam. 6:1–11]], but there David's palace, his wives and children, and his victories over the Philistines come first; Chronicles tells those afterward, in chapter 14, where they fall between this failed attempt and the successful one in chapters 15–16, and it tells the ark's journey at greater length. One older commentary reads the difference as one of interest: Samuel tells what the ark's coming meant for David as king, and Chronicles what it meant for the worship of Israel.

  The ark had been out of the way for a long time. When the Philistines sent it back, the men of Kirjath-jearim took it to the house of Abinadab, where it stayed for many years ([[1 Sam. 7:1–2]]); the journey that begins here was broken off at Perez-uzza (verse 11). The site's notes on [[2 Sam. 6]] explain the new cart, what Uzzah's “error” was, the latter-day use of “steadying the ark,” and who Obed-edom the Gittite was. The notes here go to what Chronicles adds: the council that opens the chapter (verses 1–4, only here), David's reason, and the words that look ahead to chapter 15.

thread: |
  The chapter begins with a confession: “we inquired not at it in the days of Saul” (verse 3). Chronicles has just said that Saul died because he “inquired not of the LORD” ([[1 Chr. 10:14]]). Everything about the first attempt looks right. The leaders and the congregation agree, the invitation goes from one border of the land to the other, and all Israel plays before God “with all their might” (verse 8).

  Then the oxen stumble, Uzza takes hold of the ark, and the LORD makes “a breach” upon him. David's anger turns to fear and to the question of verse 12: “How shall I bring the ark of God home to me?” Chronicles answers it two chapters later in David's own words: “the LORD our God made a breach upon us, for that we sought him not after the due order” ([[1 Chr. 15:13]]). “Sought” is the same Hebrew verb as “inquired” in verse 3: the word that names the neglect of Saul's days is the word David uses for what went wrong on this one. Meanwhile the ark waits in the house of Obed-edom, and the house that keeps it is blessed (verse 14).

sections:
  - range: 1-4
    heading: David takes counsel
    plain: |
      David consulted with the captains of thousands and of hundreds, with every leader. Then he said to the whole assembly of Israel, “If it seems good to you, and if it is the will of the LORD our God, let us send word far and wide to our kinsmen who remain in all the land of Israel, and with them to the priests and Levites in their cities and the lands around them, so that they gather to us. And let us bring the ark of our God back to us, for we did not seek it in the days of Saul.” The whole assembly said they would do it, because it seemed right to all the people.
  - range: 5-8
    heading: From Kirjath-jearim
    plain: |
      So David gathered all Israel, from Shihor at the border of Egypt to the entrance of Hamath, to bring the ark of God from Kirjath-jearim. David and all Israel went up to Baalah, that is, Kirjath-jearim, which belonged to Judah, to bring up from there the ark of God, the LORD, who is enthroned on the cherubim, the ark that is called by His name. They carried the ark of God on a new cart from the house of Abinadab, and Uzza and Ahio drove the cart. David and all Israel celebrated before God with all their might, with singing, harps, psalteries, timbrels, cymbals and trumpets.
  - range: 9-12
    heading: The breach upon Uzza
    plain: |
      When they came to the threshing floor of Chidon, Uzza put out his hand to hold the ark, because the oxen stumbled. The LORD's anger burned against Uzza, and He struck him down because he had put his hand on the ark; and he died there before God. David was angry because the LORD had broken out against Uzza, and that place is called Perez-uzza (“the breach of Uzza”) to this day. David was afraid of God that day and said, “How can I bring the ark of God home to me?”
  - range: 13-14
    heading: The house of Obed-edom
    plain: |
      So David did not take the ark home with him to the city of David, but turned aside and took it to the house of Obed-edom the Gittite. The ark of God stayed with Obed-edom's family in his house for three months, and the LORD blessed the house of Obed-edom and everything he had.

notes:
  - ref: 2
    phrase: If it seem good unto you, and that it be of the LORD our God
    kind: history
    title: David asks all Israel, and the LORD
    body: |
      Chronicles begins the ark's journey with a council that Samuel does not have. Samuel's account opens in a sentence: “David gathered together all the chosen men of Israel, thirty thousand” ([[2 Sam. 6:1]]). Here David first consults the captains and every leader, then puts the plan to the whole congregation with two conditions: that it seem good to them, and that it “be of the LORD our God,” that is, if the LORD wills and approves it. Only when the congregation agrees, “for the thing was right in the eyes of all the people” (verse 4), does he act. One older commentary notes that Chronicles likes to join the people with the king in religious acts in just this way, as when Hezekiah takes counsel with the congregation before his Passover ([[2 Chr. 30:2]]).

      The invitation is as wide as it can be (“send abroad” means send far and wide), and it names the priests and Levites, whom Samuel's account of the ark's removal does not mention. Yet in this chapter the Levites are only invited. Their charge, to carry the ark, comes into the story after Uzza's death, when David says, “None ought to carry the ark of God but the Levites” ([[1 Chr. 15:2]]).
    sources: [lds-scriptures, keil-chronicles, cambridge-chronicles]

  - ref: 3
    phrase: for we inquired not at it in the days of Saul
    kind: words
    title: Not sought in the days of Saul
    body: |
      “Inquired not at it” means “did not seek it.” The Hebrew verb is *dāraš*, “seek, consult, inquire of,” and here its object is “the ark of God,” where elsewhere it is God Himself; a modern translation has “we did not seek it in the days of Saul.”

      The verb ties the chapter to the ones on either side, and the lexicon sets all three places under the same sense. It is the verb of Chronicles' verdict on Saul, who “inquired not of the LORD” ([[1 Chr. 10:14]]; the note there explains it). And it is the verb David uses of this very day in chapter 15, “we sought him not after the due order” ([[1 Chr. 15:13]]).
    sources: [bdb, oshb-wlc, nrsvue, lds-scriptures]

  - ref: 5
    phrase: from Shihor of Egypt even unto the entering of Hemath
    kind: history
    title: From the border of Egypt to Hamath
    body: |
      The two names reach from the border of Egypt to the northern limit of the land. Joshua's list of the land still to be taken begins “from Sihor, which is before Egypt” and reaches “unto the entering into Hamath” ([[Josh. 13:3]], [[Josh. 13:5]]). Hamath was a city of Syria in the valley of the Orontes, and the “entering in of Hamath” was the northern limit of the Promised Land ([[Num. 34:8]]). Where Samuel counts the men who came, thirty thousand ([[2 Sam. 6:1]]), Chronicles names instead the land they were gathered from.
    sources: [bd-hamath, lds-scriptures]

  - ref: 6
    phrase: that dwelleth between the cherubims, whose name is called on it
    kind: symbol
    title: Enthroned on the cherubim
    body: |
      The phrase says what the ark was: the place of the LORD's presence, bearing His name. The cherubim were figures of heavenly creatures set on the Mercy Seat, the ark's cover, and that Mercy Seat “was regarded as the earthly dwelling place of Jehovah”; there the LORD had promised Moses, “I will commune with thee from above the mercy seat, from between the two cherubims” ([[Ex. 25:22]]). “Dwelleth between the cherubims” can be rendered “is enthroned on the cherubim,” and “whose name is called on it” as “which is called by his name.” Samuel's form of the verse has the ark “whose name is called by the name of the LORD of hosts” ([[2 Sam. 6:2]]).
    sources: [bd-ark-of-the-covenant, bd-cherubim, nrsvue, lds-scriptures]

  - ref: 10
    phrase: because he put his hand to the ark
    kind: history
    title: Why Uzza died
    body: |
      Chronicles names Uzza's act plainly, where Samuel says “God smote him there for his error” (the note at [[2 Sam. 6:7]] explains that word). The law had said that the sons of Kohath were to carry the holy things, “but they shall not touch any holy thing, lest they die” ([[Num. 4:15]]), and that they were to “bear upon their shoulders” ([[Num. 7:9]]); here the ark was riding on a cart. The second attempt carries it the other way: “the children of the Levites bare the ark of God upon their shoulders with the staves thereon, as Moses commanded” ([[1 Chr. 15:15]]). David's own account of what went wrong is at [[1 Chr. 15:13]], and the latter-day use of “steadying the ark” is explained at [[2 Sam. 6:6]].
    sources: [lds-scriptures]

  - ref: 11
    phrase: because the LORD had made a breach upon Uzza
    kind: words
    title: The breach, and David's fear
    body: |
      “Displeased” is too mild: the Hebrew says that it burned for David, that he burned with anger, though the text does not say at whom. The “breach” is from the verb *pāraṣ*, used here, as in a few other places, of the LORD breaking out upon someone in sudden judgment. It has that sense in the warning at Sinai, “let the priests also, which come near to the LORD, sanctify themselves, lest the LORD break forth upon them” ([[Ex. 19:22]]), and David's own words at [[1 Chr. 15:13]]. The place keeps the word in its name, Perez-uzza, “the breach of Uzza.”

      Anger turned to fear, and fear to the question of verse 12: “How shall I bring the ark of God home to me?” The answer comes in chapter 15, when David tells the Levites, “sanctify yourselves, both ye and your brethren, that ye may bring up the ark” ([[1 Chr. 15:12]]). The same verb returns in the next chapter, at Baal-perazim, where David says, “God hath broken in upon mine enemies by mine hand” ([[1 Chr. 14:11]]).
    sources: [bdb, lds-scriptures]

christ: |
  The LORD whom Israel brought home in this chapter, “the LORD, that dwelleth between the cherubims” (verse 6), is Jehovah, the premortal Jesus Christ, and the Mercy Seat of the ark was regarded as His earthly dwelling place. Israel learned in this chapter and the next that His presence was not to be neglected, as in the days of Saul (verse 3), nor sought in a way He had not appointed ([[1 Chr. 15:13]]), and that the house that kept the ark was blessed (verse 14). His promise to those who seek Him still stands: “Draw near unto me and I will draw near unto you; seek me diligently and ye shall find me” ([[D&C 88:63]]).

