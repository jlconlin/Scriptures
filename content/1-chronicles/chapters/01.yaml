chapter: 1
title: From Adam to Israel
tagline: Chronicles opens with names, not events. In bare lists drawn from Genesis it runs from Adam to Noah's sons and the nations that came from them, from Shem to Abraham, and through Abraham's sons to Esau and Israel, ending with the kings and dukes of Edom.
when: 'Written after the exile; this list runs from Adam to Israel and the kings of Edom'

setting: |
  Chronicles is one book in the Hebrew Bible; the Greek translation divided it into two, and the first ends with the close of David's reign. It is a short history from the Creation to the proclamation of Cyrus that let the Jews go home. Its Hebrew name means “events of the days,” and the Greek translators named it for the history it holds that the earlier books do not.

  The writer is not named; the site calls him the Chronicler. He worked from named records by writers “generally of the prophetic order” and from Samuel and Kings, choosing what suited his purpose and dwelling on the religious side of the history and the worship of the temple in Jerusalem. The book ends with Cyrus's decree ([[2 Chr. 36:22–23]]) and was written after the exile, by most scholars' reckoning “possibly in the fourth century BC.” Ezra and Nehemiah may be read as its sequel.

  The Chronicler expects his readers to know Samuel and Kings. He leaves out David's struggles with Saul, his sin with Bath-sheba and the troubles of his family, yet he keeps Uzza's death (chapter 13), the census and its plague (chapter 21), and the LORD's word that David could not build the temple: “Thou hast shed blood abundantly” ([[1 Chr. 22:8]]). Kings asks why God let the nation fall and the temple burn; Chronicles asks whether a people back from exile were “still God's people” and whether the covenant still stood. This chapter begins the answer.

thread: |
  The chapter narrows from all mankind to the door of Israel's own story. Where it follows Genesis's lines of fathers it compresses them “within the smallest limits”: verses 1–4 give the ten fathers from Adam to Noah and then Noah's three sons as bare names, with no “begat” between them, because the reader is expected to know from Genesis which names are fathers and sons and which are brothers, and verses 24–27 do the same with Genesis 11. On one older reading the purpose is to show Israel's tribal ancestors joined to all the peoples of the earth.

  Then the list follows the peoples that came from Noah's sons (verses 5–23), runs Shem's line again down to Abram (24–27), and turns to Abraham's sons, giving Ishmael's and Keturah's sons before Isaac's and Esau's family before Israel's (see the note on verse 28). The chapter ends with Edom's kings “before any king reigned over the children of Israel” (verse 43), and Israel, named in verse 34, waits for chapter 2, where the sons of Israel are counted ([[1 Chr. 2:1–2]]).

sections:
  - range: 1-4
    heading: From Adam to Noah's sons
    plain: |
      Verses 1–4: the ten fathers from Adam through Seth, Enos, Cainan, Mahalaleel, Jared, Enoch, Methuselah and Lamech to Noah, and Noah's three sons, Shem, Ham and Japheth, as in Genesis 5.
  - range: 5-23
    heading: The nations from Noah's sons
    plain: |
      Verses 5–23: the peoples descended from Noah's sons, as in Genesis 10. First Japheth's sons and grandsons. Then Ham's: Cush, the father of Nimrod, who “began to be mighty upon the earth”; Mizraim (Egypt), from whose sons came the Philistines; Put; and Canaan, the father of Zidon, Heth and the peoples of the land of Canaan. Then Shem's sons, and his line through Arphaxad and Shelah to Eber. Eber had two sons: Peleg, so named because in his days the earth was divided, and Joktan, whose thirteen sons are listed.
  - range: 24-27
    heading: From Shem to Abraham
    plain: |
      Verses 24–27: Shem's line again, ten names from Shem to Abram, who is Abraham, as in Genesis 11.
  - range: 28-33
    heading: The sons of Ishmael and of Keturah
    plain: |
      Verses 28–33: Abraham's sons were Isaac and Ishmael. Ishmael's twelve sons are listed, beginning with his firstborn, Nebaioth. Then the six sons whom Keturah, Abraham's concubine, bore him, with the sons of Jokshan and of Midian, as in Genesis 25.
  - range: 34-42
    heading: Isaac's sons, Esau and the sons of Seir
    plain: |
      Verses 34–42: Abraham fathered Isaac, and Isaac's sons were Esau and Israel. Esau's five sons are listed, with the sons of Eliphaz (among them Amalek) and of Reuel; then the sons of Seir and their sons, as in Genesis 36.
  - range: 43-54
    heading: The kings and dukes of Edom
    plain: |
      Verses 43–54: these are the kings who reigned in Edom before any king reigned over Israel. Eight of them reigned in turn, each after the one before him died, from Bela the son of Beor, whose city was Dinhabah, to Hadad, whose city was Pai and whose wife was Mehetabel. After Hadad died, Edom was led by dukes, eleven of whom are named.

notes:
  - ref: 1
    phrase: Adam
    kind: history
    title: Why the history begins with Adam
    body: |
      Chronicles begins with Adam because its lists run unbroken from the first man to the families who lived in Jerusalem after the return ([[1 Chr. 9:1–3]]). The story proper waits until Saul's death in chapter 10. First come nine chapters of names, a genealogy of the Lord's people “from the time of Adam to the time of the Babylonian captivity,” which ends with all Israel “reckoned by genealogies.” Biblical genealogies usually work this way: they “start at the beginning and document descendants until arriving in the present.” The Chronicler appears to have written “to create an identity based on worship and the ideals of the kingdom,” and these lists place his own people in that line.

      The names also decided practical questions. Where offices or blessings belong to particular families, a genealogy decides who holds them: a priest had to show his descent from Aaron, the Messiah from David, and every Jew from Abraham. Ezra's list of the returning exiles shows what was at stake for a priest. Some sought their register “among those that were reckoned by genealogy, but they were not found: therefore were they, as polluted, put from the priesthood” ([[Ezra 2:62]]).

      So the book about David's kingdom does not open on Israel at all. It opens on the first man, and the lines that matter later in the book, David's in chapter 3 and Aaron's in chapter 6, are reached from him.
    sources: [gs-chronicles, ot-seminary-lesson-102, sc-knowhy-235, sc-knowhy-861, bd-genealogy, lds-scriptures]

  - ref: 3
    phrase: Henoch
    kind: words
    title: Sheth, Jered and Henoch are Seth, Jared and Enoch
    body: |
      The first names in the chapter are the patriarchs of Genesis 5 under spellings a reader may not recognize. Sheth is Seth, Jered is Jared and Henoch is Enoch; Enosh and Kenan are Genesis's Enos and Cainan. The Hebrew has the same names in both books (*Shet*, *Yered*, *Ḥanokh*); only the King James spellings differ. So the Henoch of verse 3 is the Enoch who “walked with God” ([[Gen. 5:24]]), and whose people the Lord called Zion ([[Moses 7:18]]).
    sources: [oshb-wlc, lds-scriptures]

  - ref: 28
    phrase: Isaac, and Ishmael
    kind: structure
    title: Isaac named first, followed last
    body: |
      Isaac is named first in verse 28 and followed last, and the order shows which line the book is tracing. Ishmael was the elder son ([[Gen. 16:16]]; [[Gen. 21:5]]), but on one older reading the list puts Isaac first as the son of the promise. It then gives Ishmael's twelve sons, then Keturah's sons and grandsons, and only in verse 34 comes back to him: “And Abraham begat Isaac.” Those are the words with which Genesis opens Isaac's story once Ishmael's is told ([[Gen. 25:19]]).

      Isaac's sons come in the same order: Esau's line, with the sons of Seir and Edom's kings and dukes, fills verses 35–54, and the sons of Israel follow only in chapter 2.
    sources: [keil-chronicles, lds-scriptures]

christ: |
  Luke's genealogy of Jesus climbs back through the names of this chapter (Phalec, Heber and Sala, Sem and Noe, Mathusala, Enoch, Jared, Seth and Enos) and ends “which was the son of Adam, which was the son of God” ([[Luke 3:38]]). Matthew traces Jesus' line down from Abraham, for Jewish readers; Luke traces it up from Jesus to Adam and to God, for the world at large. The family that Chronicles opens with all mankind is, in Luke, the family into which the Son of God was born.

  Latter-day Saints keep family records for a further reason: they identify their kindred dead so that the ordinances of the temple can be done for them, and Joseph Smith taught that “their salvation is necessary and essential to our salvation” ([[D&C 128:15]]). A disciple's own list of names belongs to that work, “a welding link of some kind or other between the fathers and the children” ([[D&C 128:18]]).

