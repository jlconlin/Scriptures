chapter: 5
title: Because They Put Their Trust in Him
tagline: The tribes east of the Jordan. Reuben's lost birthright, a victory won because the men of Gad, Reuben and Manasseh cried to God in the battle, and a land lost when they went after other gods.
when: 'Written after the exile; the lists run from Reuben, Jacob’s firstborn, to the Assyrian captivity of the tribes beyond the Jordan.'

setting: |
  Chronicles opens with nine chapters of genealogy, and what those lists are for is said once, at [[1 Chr. 1:1]]. After Judah (chapters 2–4) and Simeon ([[1 Chr. 4:24–43]]), chapter 5 turns to the two and a half tribes who lived east of the Jordan: Reuben, Gad and the half tribe of Manasseh. They had asked Moses for that country because they “had a very great multitude of cattle” and Gilead was “a place for cattle” ([[Num. 32:1]]), and Reuben in particular is remembered as a tribe whose numbers dwindled until it was “politically unimportant.”

  The chapter is a register with stories set into it. Reuben's line (verses 1–10) opens with an explanation of why the firstborn's tribe does not hold the firstborn's place; Gad's (verses 11–17) is tied to registers made in the days of Jotham of Judah and Jeroboam of Israel; a war of all three tribes against the desert peoples called Hagarites (verses 18–22) is followed by the half tribe of Manasseh (verses 23–24). Verses 25–26 close the register of all two and a half tribes with their exile to Assyria, a deportation under Tiglath-pileser told in [[2 Kgs. 15:29]].

thread: |
  The thread is what a tribe gains and loses before God. The chapter opens with a firstborn who lost his birthright for what he did, “forasmuch as he defiled his father's bed” (verse 1), and ends with three tribes who lost their land for what they did, “they transgressed against the God of their fathers” (verse 25). Between the two stands the one story in the chapter, told to give its reason: the eastern tribes were helped against the Hagarites “for they cried to God in the battle, and he was entreated of them; because they put their trust in him” (verse 20). The chapter names the cause of both its outcomes: the war was won “because the war was of God” (verse 22), and the land won was held “until the captivity” that followed their transgression (verses 25–26).

sections:
  - range: 1-3
    heading: Reuben, the firstborn without the birthright
    plain: |
      These are the sons of Reuben, Israel's firstborn. (He was the firstborn, but because he defiled his father's bed his birthright was given to the sons of Joseph, Israel's son; and the genealogy is not reckoned by the birthright. For Judah grew strong among his brothers and the ruler came from him, though the birthright was Joseph's.) The sons of Reuben, Israel's firstborn, were Hanoch, Pallu, Hezron and Carmi.
  - range: 4-10
    heading: Reuben's line and lands
    plain: |
      Verses 4–6 trace a line from Joel down seven generations to Beerah, prince of the Reubenites, whom Tiglath-pileser king of Assyria carried away captive. Verses 7–9 name the chief men of their families and Bela, who lived in Aroer and as far as Nebo and Baal-meon, and eastward to the edge of the desert that runs to the Euphrates, because their cattle had multiplied in Gilead. In Saul's day they made war on the Hagarites, defeated them, and lived in their tents throughout the eastern land of Gilead.
  - range: 11-17
    heading: Gad in Bashan
    plain: |
      The people of Gad lived beside them in Bashan as far as Salchah. Verses 12–15 name their chief men and the families of their fathers' houses. They lived in Gilead and Bashan and their towns, and in the pasturelands of Sharon to their borders. All of these were entered in the registers in the days of Jotham king of Judah and of Jeroboam king of Israel.
  - range: 18-22
    heading: The war with the Hagarites
    plain: |
      Reuben, Gad and the half tribe of Manasseh had 44,760 valiant men who could carry shield and sword, shoot with the bow and were skilled in war. They fought the Hagarites with Jetur, Nephish and Nodab, and they were helped against them, and the Hagarites and all who were with them were given into their hand, because they cried to God in the battle and He answered their plea, for they trusted in Him. They took their livestock (fifty thousand camels, two hundred fifty thousand sheep, two thousand donkeys) and a hundred thousand people. Many fell slain, because the war was of God, and they lived in their place until the captivity.
  - range: 23-26
    heading: The half tribe of Manasseh, and the captivity
    plain: |
      The half tribe of Manasseh lived in the land and spread from Bashan to Baal-hermon, Senir and mount Hermon. Verse 24 names the heads of their fathers' houses, mighty and famous men. But they were unfaithful to the God of their fathers and went after the gods of the peoples of the land, whom God had destroyed before them. So the God of Israel stirred up the spirit of Pul king of Assyria and of Tiglath-pileser king of Assyria, and he carried away the Reubenites, the Gadites and the half tribe of Manasseh to Halah, Habor, Hara and the river Gozan, where they are to this day.

notes:
  - ref: 1
    phrase: his birthright was given unto the sons of Joseph
    kind: history
    title: Why Joseph's sons had Reuben's birthright
    body: |
      Reuben lost the birthright by his own act, and it passed to Joseph as the next in line. The birthright was the firstborn's inheritance, which “generally included a land inheritance as well as the authority to preside,” and it could be forfeited “because of unrighteousness,” as it was by Esau and by Reuben. Reuben's offense was lying with Bilhah, his father's concubine ([[Gen. 35:22]]; [[Gen. 49:3–4]]; see the note on [[Gen. 35:22]]).

      Why Joseph rather than Simeon, the second son? Joseph was the firstborn son of Rachel, Jacob's second wife, and so, though he was the eleventh son to be born, he stood second in line for the birthright after Leah's firstborn: “the blessing therefore came upon Joseph, the firstborn of Jacob and Rachel.” It reached “the sons of Joseph” through Jacob's adoption of them: Jacob made Ephraim and Manasseh his own, “as Reuben and Simeon” ([[Gen. 48:5]]). The birthright son was owed a double portion of the inheritance, “twice as much as any other son,” and “Joseph's double portion was shared by his sons, Ephraim and Manasseh,” each of whose descendants became a separate tribe. The note on [[Gen. 48:5]] tells that adoption in full; this chapter's half tribe of Manasseh (verses 23–24) is one of the two.
    sources: [bd-birthright, ludlow-birthright, bd-reuben, scripture-helps-gen-42-50, lds-scriptures]

  - ref: 1
    phrase: the genealogy is not to be reckoned after the birthright
    kind: words
    title: Why Reuben is still listed first
    body: |
      This clause explains why the list begins with Reuben when the birthright was Joseph's. One older reading, which the rabbis had already given, takes Joseph as the subject of the Hebrew verb: Joseph, though he held the birthright, “was not to be registered” as the firstborn. On that reading verse 2 gives the reason: the firstborn's privileges were divided, Judah taking the rule and Joseph the birthright, and amid those divided claims the list keeps the natural order and begins with Reuben. The text itself marks verses 1–2 as a parenthesis, and verse 3 resumes the list with the words of verse 1: “The sons, I say, of Reuben the firstborn of Israel.”
    sources: [keil-chronicles, cambridge-chronicles]

  - ref: 2
    phrase: of him came the chief ruler
    kind: christ
    title: The ruler from Judah
    body: |
      The “chief ruler” is the leader who came from Judah's line, the kings of David's house; the cross-references on the word also set it beside the promises of Christ. The Hebrew word, *nagid*, is the one used of David as the LORD's appointed leader over Israel ([[2 Sam. 7:8]]; [[1 Chr. 17:7]]), and this verse is counted with those uses: “Judah and his descendants became rulers in Israel.” Chronicles uses the word once more of the tribe itself, when David says the LORD “hath chosen Judah to be the ruler; and of the house of Judah, the house of my father; and among the sons of my father he liked me to make me king over all Israel” ([[1 Chr. 28:4]]).

      The footnote to “ruler” is a list of cross-references, not an explanation, and the link to Christ rests on it: [[Micah 5:2]], the promise that out of Beth-lehem in Judah “shall he come forth unto me that is to be ruler in Israel”; [[Matt. 2:6]], where the scribes cite that promise to Herod as the place of Christ's birth; and [[John 7:42]], “Christ cometh of the seed of David, and out of the town of Bethlehem, where David was.”
    sources: [bdb, lds-scriptures]

  - ref: 10
    phrase: they made war with the Hagarites
    kind: history
    title: Who the Hagarites were
    body: |
      The Hagarites were a tent-dwelling people on the eastern border of Gilead, allied with tribes that bore the names of Ishmael's sons. Psalm 83 names “the Hagarenes” beside “the Ishmaelites” among Israel's enemies ([[Ps. 83:6]]), and two of their allies in verse 19, Jetur and Nephish, carry the names of sons of Ishmael in the Chronicler's own list, “Jetur, Naphish, and Kedemah” ([[1 Chr. 1:31]]; [[Gen. 25:15]]).

      The chapter tells of war with them twice. In Saul's day (verse 10) Reuben took the Hagarites' tents “throughout all the east land of Gilead.” In verses 18–22, with no date given, all three eastern tribes fought them and held the land “until the captivity.”
    sources: [lds-scriptures]

  - ref: 20
    phrase: for they cried to God in the battle, and he was entreated of them; because they put their trust in him
    kind: history
    title: Helped because they trusted
    body: |
      The Chronicler gives the outcome of the war a reason, and the reason is prayer and trust. The men “cried to God in the battle,” and God “was entreated of them,” the words used when “Isaac entreated the LORD for his wife” and “the LORD was entreated of him, and Rebekah his wife conceived” ([[Gen. 25:21]]): the plea was heard and granted. Verse 20 does not name who helped them; verse 22 does: “the war was of God.”

      This is how Chronicles reads history. Like the books of Joshua through Kings, it holds that righteousness brings success against enemies and sin brings punishment, but in Chronicles rewards and punishments “are not usually delayed.” Here trust in verse 20 wins the war, and unfaithfulness in verse 25 brings the captivity of verse 26. Helaman gave the same kind of reason for his young soldiers' preservation, which he ascribed “to the miraculous power of God, because of their exceeding faith,” and who “put their trust in God continually” ([[Alma 57:25–27]]).
    sources: [sc-knowhy-861, lds-scriptures]

  - ref: 26
    phrase: the God of Israel stirred up the spirit of Pul king of Assyria
    kind: history
    title: Why the eastern tribes went into exile
    body: |
      Chronicles says that God Himself moved the Assyrian kings against the eastern tribes, and verse 25 gives the reason. To go “a whoring after the gods of the people of the land” is the Bible's figure for the worship of other gods, counted as harlotry, and the gods were those of the peoples God had driven out before Israel.

      Pul and Tiglath-pileser read like two kings, here as in [[2 Kgs. 15:19]] and [[2 Kgs. 15:29]], but Pul is “most likely another name of Tiglath-pileser III”: on that identification, Pul, or Pulu, took the throne name Tiglath-pileser (see the note on [[2 Kgs. 15:19]]). The deportation itself is told in [[2 Kgs. 15:29]] (see the note there); Halah, Habor and the river Gozan are named again when the rest of Israel is taken after Samaria falls ([[2 Kgs. 17:6]]).
    sources: [bdb, bd-pul, sc-knowhy-536, lds-scriptures]

christ: |
  The cross-references on “ruler” in verse 2 tie the ruler who came from Judah to the ruler born in Beth-lehem of David's line, Jesus Christ (see the note on verse 2). The same chapter shows how blessings that come through a family are kept: Reuben was the firstborn and lost the birthright “because of unrighteousness,” and the eastern tribes held the land they won by trusting God only until they “transgressed against the God of their fathers” (verse 25). Blessings received through a covenant family are kept by faithfulness, and the God who “was entreated” of men who cried to Him in battle (verse 20) still hears those who put their trust in Him.

