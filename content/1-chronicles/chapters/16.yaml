  - **The same day in Samuel.** [[2 Sam. 6:12–23]].
  - **The ark carried after the due order.** [[1 Chr. 15:1–29]].
  - **The singers' courses under David.** [[1 Chr. 25:1–7]].
  - **The refrain sung again.** [[2 Chr. 5:11–14]]; [[2 Chr. 7:3]]; [[Ezra 3:10–11]].
  - **Hymns as prayer in this dispensation.** [[D&C 25:11–12]].

