chapter: 16
title: Give Thanks unto the LORD
tagline: The ark is set in David's tent, and David blesses the people and feeds them. Then he appoints Levites to praise before the ark and gives Asaph the first song of thanks, and he leaves singers and priests to serve at two places, the ark in Jerusalem and the tabernacle at Gibeon.
when: 'The day the ark came to Jerusalem, early in David’s reign there; the song is the thanksgiving David “delivered first” to Asaph that day (verse 7).'

setting: |
  Chapter 15 brought the ark up to Jerusalem the second time, carried now by Levites “upon their shoulders” ([[1 Chr. 15:15]]), because the first attempt had failed when “we sought him not after the due order” ([[1 Chr. 15:13]]). Chapter 16 sets it down. Verses 1–3 and 43 tell what [[2 Sam. 6:17–20]] tells: the ark placed in the tent David had pitched for it (the note at [[2 Sam. 6:17]] explains that this tent was not the tabernacle of Moses), the offerings, the king's blessing and his gifts to the people, and David going home.

  Everything between is Chronicles' own. Verses 4–6 name the Levites David appointed to praise before the ark, with Asaph at their head; verses 7–36 give the song of thanks committed to them that day, made of the opening of Psalm 105, the whole of Psalm 96, and the first and last lines of Psalm 106; and verses 37–42 leave Asaph's company before the ark and Zadok's priests, with Heman and Jeduthun, at the old tabernacle in Gibeon. Who the singers were, and why Chronicles counts them among Levi's sons, is the note at [[1 Chr. 6:31]].

thread: |
  The chapter turns the ark's arrival into an order of worship that is to go on. The day itself brings burnt offerings, a blessing in the LORD's name and bread for every man and woman; but what David establishes is daily: Levites “to minister before the ark continually, as every day’s work required” (verse 37), and priests to offer “continually morning and evening” at Gibeon (verse 40).

  The song says what that service is for. Its first word is thanks, and its first half is a call to remember: “Remember his marvellous works” (verse 12), “Be ye mindful always of his covenant” (verse 15), the covenant with Abraham, Isaac and Jacob that kept a few wanderers safe among the nations. Its second half turns outward to “all the earth” and to the LORD who “cometh to judge the earth” (verses 23, 33). It ends with the refrain the singers at Gibeon were set to sing, “his mercy endureth for ever” (verses 34, 41), and with a prayer to be gathered from among the nations. The center of the song, “Seek the LORD and his strength, seek his face continually” (verse 11), gives this part of the book its title.

sections:
  - range: 1-3
    heading: The ark in its tent
    plain: |
      They brought the ark of God and set it inside the tent David had pitched for it, and they offered burnt offerings and peace offerings before God. When David had finished offering them, he blessed the people in the name of the LORD. Then he gave every person in Israel, man and woman alike, a loaf of bread, a portion of meat, and a cake of raisins.
  - range: 4-6
    heading: Levites to praise
    plain: |
      He appointed some of the Levites to serve before the ark of the LORD, to celebrate, to thank and to praise the LORD God of Israel. Asaph was the chief, and next to him Zechariah, Jeiel, Shemiramoth, Jehiel, Mattithiah, Eliab, Benaiah, Obed-edom and Jeiel, with harps and lyres; Asaph sounded the cymbals. Benaiah and Jahaziel the priests blew trumpets regularly before the ark of the covenant of God.
  - range: 7-22
    heading: Remember his covenant
    plain: |
      On that day David first entrusted the giving of thanks to the LORD to Asaph and his brethren. Give thanks to the LORD, call on His name, and make His deeds known among the peoples. Sing to Him, sing psalms to Him, and tell of all His wonders. Glory in His holy name; let the hearts of those who seek the LORD rejoice. Seek the LORD and His strength; seek His face always. Remember the wonders He has done and the judgments He has spoken, you descendants of Israel His servant, you children of Jacob, His chosen ones. He is the LORD our God; His judgments are in all the earth. Remember His covenant always, the word He commanded to a thousand generations: the covenant He made with Abraham, His oath to Isaac, confirmed to Jacob as a law and to Israel as an everlasting covenant, saying, “To you I will give the land of Canaan as your inheritance.” You were few then, very few, and strangers in it, wandering from nation to nation and from one kingdom to another. He let no one oppress them; He rebuked kings for their sake: “Do not touch My anointed ones, and do My prophets no harm.”
  - range: 23-36
    heading: Sing unto the LORD, all the earth
    plain: |
      Sing to the LORD, all the earth; proclaim His salvation day after day. Declare His glory among the nations and His wonders among all peoples. For the LORD is great and greatly to be praised, and He is to be feared above all gods, for the gods of the peoples are idols, but the LORD made the heavens. Glory and honor are in His presence, strength and gladness in His place. Give to the LORD, you families of the peoples, give to the LORD glory and strength, the glory His name deserves; bring an offering and come before Him; worship the LORD in the beauty of holiness. Tremble before Him, all the earth; the world is set firm and will not be moved. Let the heavens be glad and the earth rejoice, and let them say among the nations, “The LORD reigns.” Let the sea roar and all that fills it, let the fields rejoice and all that is in them; then the trees of the forest will sing for joy before the LORD, for He comes to judge the earth. Give thanks to the LORD, for He is good; His steadfast love endures forever. And say, “Save us, O God of our salvation; gather us and deliver us from the nations, so that we may give thanks to Your holy name and glory in Your praise.” Blessed be the LORD God of Israel forever and ever. And all the people said “Amen” and praised the LORD.
  - range: 37-43
    heading: The ark at Jerusalem, the tabernacle at Gibeon
    plain: |
      So David left Asaph and his brethren there before the ark of the covenant of the LORD to serve before it continually, as each day's work required, with Obed-edom and his brethren, sixty-eight of them; Obed-edom the son of Jeduthun and Hosah were gatekeepers. He left Zadok the priest and his fellow priests before the tabernacle of the LORD at the high place in Gibeon, to offer burnt offerings to the LORD on the altar of burnt offering continually, morning and evening, according to everything written in the law the LORD gave Israel. With them were Heman and Jeduthun and the others chosen by name to give thanks to the LORD, “for His mercy endures forever,” with trumpets and cymbals for those who were to sound them and with instruments for the songs of God. The sons of Jeduthun were gatekeepers. Then all the people went home, each to his house, and David returned to bless his household.

notes:
  - ref: 3
    phrase: a flagon of wine
    kind: words
    title: A loaf, a portion, and a cake of raisins
    body: |
      David's gift to every man and woman was food for a feast, and the third item was not wine at all. The Hebrew word, *ʾăšîšâ*, is a pressed raisin-cake, here and in its twin in [[2 Sam. 6:19]]. The King James has “flagons of wine” for the same word at [[Hosea 3:1]], where raisin-cakes belong to sacrificial feasts. A modern translation gives the whole gift plainly: “a loaf of bread, a portion of meat, and a cake of raisins.”

      The middle item, the King James “good piece of flesh,” is less certain. Its Hebrew word, *ʾešpār*, occurs only here and in the parallel in Samuel, and its “actual etymology & meaning” are unknown; at [[2 Sam. 6:19]] the Greek translation and two other ancient Greek versions took it as a cake or a roll, and a modern translation has a portion of meat.
    sources: [oshb-wlc, bdb, nrsvue]

  - ref: 4
    phrase: and to record
    kind: words
    title: To record, that is, to call to remembrance in praise
    body: |
      The Levites' first duty before the ark was to call the LORD to remembrance in praise. The verb translated “to record” is a causative form of *zāḵar*, “remember,” that is, to cause to remember, and in this verse it apparently means to “commemorate, praise,” a function of the Levites, joined to the two verbs that follow it. A modern translation has “to invoke, to thank, and to praise the LORD.” The same form may stand in the titles of [[Ps. 38:1]] and [[Ps. 70:1]], where the King James has “to bring to remembrance.”

      The song given to these Levites in verse 7 uses the same verb twice: “Remember his marvellous works” (verse 12) and “Be ye mindful always of his covenant” (verse 15) are both the plain imperative of *zāḵar*. Who those singers were, and how Chronicles ties them to the house of the LORD, is the note at [[1 Chr. 6:31]].
    sources: [oshb-wlc, bdb, nrsvue, lds-scriptures]

  - ref: 7
    phrase: David delivered first this psalm to thank the LORD
    kind: scripture
    title: The first thanksgiving given to Asaph
    body: |
      What David “delivered first” to Asaph was a charge, the giving of thanks, and the song that follows shows what that charge sounded like. The words “this psalm” are not in the Hebrew, which reads that on that day David first committed the thanksgiving to the LORD into the hand of Asaph and his brethren; a modern translation has “David first appointed the singing of praises to the LORD by Asaph and his kindred.” Read at its word, “first” would serve “to bring out the fact that liturgical singing was then first introduced.”

      The song (verses 8–36) is made of three psalms: verses 8–22 are [[Ps. 105:1–15]], verses 23–33 are [[Ps. 96:1–13]], and verses 34–36 are the first verse of Psalm 106 and its last two ([[Ps. 106:1]], [[Ps. 106:47–48]]). The site's notes on those psalms set the two texts side by side: at [[Ps. 105:1]], how Chronicles turns the psalm's statement that God remembered His covenant into a command to the congregation; at [[Ps. 96:6]], how the lines that mention a sanctuary and courts read differently here, before there was a temple, and whether the song in Chronicles or the psalms came first, which the comparison does not settle; and at [[Ps. 106:47]], the ending and the people's “Amen.” The text does not say that David composed the song, only that he gave the thanksgiving to Asaph that day, though one reading judges it “very probable that the following psalm was a hymn composed by David for the liturgical song in the public worship.”
    sources: [oshb-wlc, nrsvue, keil-chronicles, lds-scriptures]

  - ref: 35
    phrase: gather us together, and deliver us from the heathen
    kind: scripture
    title: A prayer to be gathered
    body: |
      The song ends, on the day the ark came home, by asking God to gather His people and deliver them from the nations, and readers differ on whether the prayer looks back from the exile. The line is the close of Psalm 106 ([[Ps. 106:47]]), a psalm that confesses Israel's sins from Egypt onward and remembers that the LORD gave them “into the hand of the heathen” ([[Ps. 106:41]]). On one reading, the prayer shows that Psalm 106 “is not Davidic but post-exilic.” On another, the words presuppose no exile in Babylon at all, only “the dispersion of prisoners of war, led away captive into an enemy's land after a defeat,” which “usually occurred after each defeat of Israel”; Solomon's prayer at the temple's dedication asks for the same mercy on captives carried away ([[1 Kgs. 8:46–50]]).

      Either way the prayer stands in Chronicles as part of the song first given to the singers. How the covenant that warned of scattering also promised a gathering is the note at [[Ps. 106:45]].
    sources: [lds-scriptures, cambridge-chronicles, keil-chronicles]

  - ref: 39
    phrase: before the tabernacle of the LORD in the high place that was at Gibeon
    kind: history
    title: Two places of worship
    body: |
      Chronicles says plainly that under David Israel's worship was divided between two places, and that David staffed both. The tabernacle Moses had made was no longer with the ark. It had stood at Shiloh until the ark was taken in battle, and the ark never returned to it; the tabernacle was later at Nob, and then at Gibeon, with its altar of burnt offering, where Zadok the priest ministered. So David left Asaph's Levites to sing before the ark in its tent “as every day’s work required” (verse 37), and Zadok with the priests to keep the daily sacrifice at Gibeon, “morning and evening,” as the law commanded: “two lambs of the first year day by day continually” ([[Ex. 29:38]]).

      Song went with both. Heman and Jeduthun were set at Gibeon to give thanks “because his mercy endureth for ever” (verse 41), the refrain whose later singing at Solomon's temple and at the foundation of the second temple is the note at [[Ps. 136:1]]. The division lasted until Solomon, who sacrificed at Gibeon (the note at [[1 Kgs. 3:4]]) and who brought the ark and “the tabernacle of the congregation” together into the temple ([[2 Chr. 5:5]]); after that, the tabernacle disappears from the history.
    sources: [bd-tabernacle, lds-scriptures]

  - ref: 43
    phrase: David returned to bless his house
    kind: history
    title: Home to bless his house, without Michal's quarrel
    body: |
      Chronicles ends the day where Samuel turns to Michal's quarrel with David, and it stops there. In Samuel the same sentence goes on: “Then David returned to bless his household. And Michal the daughter of Saul came out to meet David” ([[2 Sam. 6:20]]). What follows in Samuel, and how much of Michal Chronicles keeps, is the note at [[1 Chr. 15:29]]. Here the chapter's last word is the king's blessing on his house, as earlier David blessed the people (verse 2).
    sources: [lds-scriptures]

christ: |
  The LORD of this song, whose “mercy endureth for ever” (verse 34) and who “cometh to judge the earth” (verse 33), is Jehovah, the premortal Jesus Christ (see [[Ex. 3:14]]). In this dispensation the same Lord called Emma Smith “to make a selection of sacred hymns” for His Church and told her why: “my soul delighteth in the song of the heart; yea, the song of the righteous is a prayer unto me, and it shall be answered with a blessing upon their heads” ([[D&C 25:11–12]]). The thanks David gave the Levites to sing is still worship of Christ when the Saints sing it, and He receives such a song as a prayer and answers it with blessing.

explore: |
