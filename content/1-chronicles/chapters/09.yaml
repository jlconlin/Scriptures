chapter: 9
title: These Dwelt at Jerusalem
tagline: The genealogies end with Judah carried away for its unfaithfulness and the families who came back. Jerusalem's heads, its priests and Levites, the porters at its gates and the singers in its chambers, and Saul's house once more, to open the story.
when: 'After the exile: verse 1 tells of Judah carried away to Babylon, the list names those who dwelt in Jerusalem, and the porters’ office is traced to “David and Samuel the seer” (verse 22).'

setting: |
  Chapter 9 ends the genealogies and turns toward the history. Its first verse closes the lists of chapters 2–8, whose purpose is explained once at [[1 Chr. 1:1]], and in the same breath it names the break in the line: Judah was carried away to Babylon. What follows, as modern translations read verse 2, is the people who came back to live again in their possessions.

  Nehemiah keeps a register of the same kind ([[Neh. 11:3–19]]), and where the two name the chiefs who lived in Jerusalem they follow the same plan: Judah, Benjamin, the priests, the Levites, the porters. Only a few of their names are the same. Chronicles then goes on where Nehemiah does not, with the porters' service and the duties of the Levites in the house of God (verses 18–34).

  The chapter closes by giving again, from [[1 Chr. 8:29–38]], the families of Gibeon and the house of Saul. The list is repeated to join the genealogies to the history, as the introduction to Saul's death in chapter 10. Its names, Esh-baal and Merib-baal among them, are explained at [[1 Chr. 8:33]].

thread: |
  The genealogies that began with Adam end in a city. Verse 1 names the reason the line was broken, Judah carried away “for their transgression,” and verse 2 starts again with the families who came back to their possessions. The chapter then places them by where they stand around the house of God: the heads of Judah and Benjamin, and of Ephraim and Manasseh, then the priests, then the Levites, the porters who open the house every morning, the men who count its vessels and bake its bread, and the singers who are at their work day and night.

  Those offices have a history, and the chapter gives it. The porters were set in their office by David and Samuel the seer, their fathers were “keepers of the entry” over the LORD's host, with Phinehas over them, and “they and their children had the oversight of the gates” (verse 23). The last list, Saul's house, turns the book from names to its story.

sections:
  - range: 1-1
    heading: All Israel reckoned
    plain: |
      So all Israel was registered by genealogies, and they are written in the book of the kings of Israel. And Judah was carried away to Babylon because of their unfaithfulness.
  - range: 2-9
    heading: Judah, Benjamin, Ephraim and Manasseh in Jerusalem
    plain: |
      The first to live again on their own land in their towns were Israelites, priests, Levites and the temple servants called the Nethinims. In Jerusalem lived some of the people of Judah, Benjamin, Ephraim and Manasseh. From Judah: Uthai, of the line of Pharez; Asaiah the firstborn and his sons, of the Shilonites; and Jeuel, of the sons of Zerah, with their kinsmen, 690. From Benjamin: Sallu son of Meshullam, Ibneiah son of Jeroham, Elah son of Uzzi, and Meshullam son of Shephathiah, with their kinsmen by their generations, 956. All these men were heads of their fathers' houses.
  - range: 10-13
    heading: The priests
    plain: |
      Of the priests: Jedaiah, Jehoiarib and Jachin; Azariah son of Hilkiah, of the line of Zadok, the officer in charge of the house of God; Adaiah son of Jeroham, of the line of Malchijah; and Maasiai son of Adiel, of the line of Immer. With their kinsmen, heads of their fathers' houses, they were 1,760, able men for the work of the service of the house of God.
  - range: 14-16
    heading: The Levites
    plain: |
      Of the Levites: Shemaiah son of Hasshub, of the sons of Merari; Bakbakkar, Heresh and Galal; Mattaniah son of Micah, of the line of Asaph; Obadiah son of Shemaiah, of the line of Jeduthun; and Berechiah son of Asa, who lived in the villages of the Netophathites.
  - range: 17-27
    heading: The porters at the gates
    plain: |
      The porters were Shallum, Akkub, Talmon and Ahiman, with their kinsmen, and Shallum was the chief. Until then they had stood at the king's gate on the east; they were the gatekeepers of the camp of the Levites. Shallum the Korahite and his kinsmen were over the work of the service, keepers of the thresholds of the tabernacle, as their fathers had been over the camp of the LORD, keepers of its entrance. Phinehas son of Eleazar had been over them in former times, and the LORD was with him. Zechariah son of Meshelemiah kept the door of the tabernacle of the congregation.

      Those chosen to keep the gates were 212, registered by genealogy in their villages; David and Samuel the seer had set them in their office of trust. They and their children kept the gates of the house of the LORD, the house of the tabernacle, by watches, on all four sides, east, west, north and south. Their kinsmen in the villages came in every seven days to serve with them. The four chief porters, who were Levites, held an office of trust over the chambers and treasuries of the house of God. They spent the night around the house, because the watch was theirs, and they opened it every morning.
  - range: 28-34
    heading: Vessels, bread and song
    plain: |
      Some of them had charge of the vessels used in the service and counted them as they were brought in and taken out. Others were appointed over the furnishings and all the holy vessels, and over the fine flour, the wine, the oil, the frankincense and the spices; some of the priests made the ointment of the spices. Mattithiah, a Levite, the firstborn of Shallum the Korahite, was trusted with what was baked in pans, and some of their kinsmen of the Kohathites prepared the shewbread every sabbath. The singers, heads of Levite families, lived in the chambers free from other service, for they were at their work day and night. These heads of Levite families, chief men through their generations, lived in Jerusalem.
  - range: 35-44
    heading: The house of Saul, again
    plain: |
      In Gibeon lived Jehiel, the father of Gibeon, whose wife was Maachah. His sons were Abdon the firstborn, Zur, Kish, Baal, Ner, Nadab, Gedor, Ahio, Zechariah and Mikloth, who fathered Shimeam; they too lived in Jerusalem beside their kinsmen. Ner fathered Kish, Kish fathered Saul, and Saul fathered Jonathan, Malchi-shua, Abinadab and Esh-baal. Jonathan's son was Merib-baal, who fathered Micah, and verses 41–44 follow Micah's line from father to son down to Azel and his six sons, as in [[1 Chr. 8:35–38]].

notes:
  - ref: 1
    phrase: who were carried away to Babylon for their transgression
    kind: words
    title: Carried away for their unfaithfulness
    body: |
      The verse names the exile's cause in one word: Judah went to Babylon for its *maʿal*, an “unfaithful, treacherous act,” a word used of a breach of faith against God. The English Standard Version renders it “breach of faith,” the New Revised Standard Version “unfaithfulness.” Both also divide the verse differently from the King James: the genealogies “are written in the Book of the Kings of Israel. And Judah was taken into exile in Babylon.” Read that way, it is Judah, not the kings, that was carried away. The book named is one Chronicles cites again for the kings of Judah ([[2 Chr. 27:7]]); the histories it draws on are taken up at [[1 Kgs. 14:19]].

      Chronicles gives the cause in that single word and goes straight on, in the next verse, to the people who came back to their possessions; the question the book asks of its history is set out at [[1 Chr. 1:1]].
    sources: [oshb-wlc, bdb, esv, nrsvue, lds-scriptures]

  - ref: 2
    phrase: Now the first inhabitants that dwelt in their possessions in their cities
    kind: history
    title: The first to dwell again
    body: |
      The “first inhabitants” of verse 2 are the families who resettled the land after the exile, not its earliest settlers. Modern translations make the time plain: “the first to live again in their possessions” (the New Revised Standard Version), “dwell again” (the English Standard Version). They are counted in four kinds, laymen of Israel, priests, Levites and Nethinims, the temple servants whose name and office are explained at [[Ezra 2:43]].

      Nehemiah's register of Jerusalem's people ([[Neh. 11:3–19]]) opens with the same four kinds and adds a fifth, “the children of Solomon's servants,” and some of its men are the same as here: Sallu son of Meshullam, Adaiah son of Jeroham, Shemaiah of the Levites, Mattaniah of the line of Asaph, Akkub and Talmon. But Sallu's ancestors are different there, most of the other names differ, and so do the totals: 956 Benjamites here, 928 in [[Neh. 11:8]]. Chronicles also names men of Ephraim and Manasseh, which Nehemiah does not (the next note). How the city came to be peopled, by lot and by volunteers, is Nehemiah's story; see the notes at [[Neh. 11:1]].
    sources: [nrsvue, esv, lds-scriptures]

  - ref: 3
    phrase: and of the children of Ephraim, and Manasseh
    kind: history
    title: Ephraim and Manasseh in Jerusalem
    body: |
      Chronicles counts men of Ephraim and Manasseh among Jerusalem's people, where Nehemiah's register names only Judah and Benjamin ([[Neh. 11:4]]). The two tribes of Joseph had belonged to the northern kingdom, but many of their people had moved south long before. Some came to Judah in Asa's day, when they saw that the LORD was with him ([[2 Chr. 15:9]]). Many more came after Assyria conquered the north in 722 BC, so that a large population from the northern tribes lived in the kingdom of Judah. Seals of the following century suggest that the refugees' descendants rose into the upper levels of Judah's society and government.

      Lehi, “a descendant of Manasseh” ([[Alma 10:3]]) who “dwelt at Jerusalem in all his days” ([[1 Ne. 1:4]]), was probably descended from such refugees. Verse 3 shows families of the north still counted among Jerusalem's people after the return.
    sources: [scripture-helps-2-chronicles, sc-knowhy-708, lds-scriptures]

  - ref: 22
    phrase: whom David and Samuel the seer did ordain in their set office
    kind: history
    title: Ordained by David and Samuel the seer
    body: |
      The porters, or gatekeepers, get more room than anyone else in the register (verses 17–27), and verse 22 gives their office its pedigree. “In their set office” means an office of trust. The Hebrew *beʾĕmûnātām* is literally *in their faithfulness*, that is, “in trust,” and the same word, without “their,” in verses 26 and 31 marks the four chief porters and Mattithiah as men trusted with the chambers, the treasuries and the baked offerings.

      Samuel's name raises a question. He died before Saul did, and so before David reigned ([[1 Sam. 25:1]]), and no other record has him ordering the sanctuary's service. Older readings answer it in two ways. Samuel may be named with David because he had once kept the doors himself: as a boy in the house of the LORD he “opened the doors of the house of the LORD” ([[1 Sam. 3:15]]). Or Samuel, restoring the worship neglected under Eli's sons, must have appointed trustworthy men to its offices and so prepared the way for David, who is named first because the full organization was his. On that reading the porters' families kept the same service from generation to generation, and the men at the gates in the register's own day could be said to have been appointed by David.

      Verses 19–20 trace the charge back further still. The porters' fathers had been “keepers of the entry” over the “host of the LORD,” where the Hebrew is the LORD's encampment, and Phinehas son of Eleazar, Aaron's grandson and later high priest, had been over them, “and the LORD was with him.” One older reading takes the entry to be that of the camp in the wilderness, whose defilement Phinehas avenged at Peor ([[Num. 25:6–13]]; the notes there tell the story).
    sources: [oshb-wlc, bdb, nrsvue, keil-chronicles, cambridge-chronicles, bd-phinehas, lds-scriptures]

  - ref: 33
    phrase: who remaining in the chambers were free
    kind: words
    title: Free for the work day and night
    body: |
      “Free” means free from other duties; in the New Revised Standard Version the singers lived “in the chambers of the temple free from other service, for they were on duty day and night.” Their families and leaders are given in Levi's genealogy at [[1 Chr. 6:31–47]], where the note “Singers in a list of Levites” explains why singers stand in that list, and their courses are set out at [[1 Chr. 25:1]]. A psalm is addressed to such servants: “all ye servants of the LORD, which by night stand in the house of the LORD” ([[Ps. 134:1]]).
    sources: [nrsvue, lds-scriptures]

christ: |
  Chronicles was written, on one reading, to tell a people back from exile that they were still God's people and that the covenant still stood, and this chapter says it with names: families in their possessions again and Levites keeping the house of the LORD day and night. The risen Lord, teaching Lehi's descendants, spoke of that covenant with Israel: “I will remember the covenant which I have made with my people,” to “give unto them again the land of their fathers for their inheritance, which is the land of Jerusalem” ([[3 Ne. 20:29]]). Among the Nephites who joined His Church, “their names were taken, that they might be remembered and nourished by the good word of God” ([[Moro. 6:4]]); a disciple numbered among His people is known by name, to be remembered and nourished in the same way.

explore: |
  - **The same city in Nehemiah's register.** [[Neh. 11:1–24]].
  - **The first who came back to their cities.** [[Ezra 2:68–70]].
  - **The porters' courses under David.** [[1 Chr. 26:1–19]].
  - **Saul's house, and his death.** [[1 Chr. 8:29–40]]; [[1 Chr. 10]].

