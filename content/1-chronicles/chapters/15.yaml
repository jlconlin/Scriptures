  - **The ark in its tent, and David's psalm.** [[1 Chr. 16:1–43]].
  - **The singers' courses.** [[1 Chr. 25:1–31]].
  - **The ark brought into Solomon's temple with the same singers.** [[2 Chr. 5:2–14]].

