chapter: 15
title: As Moses Commanded
tagline: Three months after Uzza's death, David tries again to bring the ark to Jerusalem, and this time in the order the law had given. Only Levites may carry it; the priests and Levites sanctify themselves, bear it on their shoulders, and go up singing, while Michal watches from a window.
when: 'David’s reign at Jerusalem, after the ark had stayed three months in the house of Obed-edom (13:14), when David had built houses for himself in the city of David (15:1).'

setting: |
  Three months separate this chapter from the death of Uzza. David's first attempt to bring the ark from Kirjath-jearim ended with a breach and a place named Perez-uzza, and the ark stayed in the house of Obed-edom, whose household the LORD blessed ([[1 Chr. 13:9–14]]). Chapter 14 sets David's house of cedar, his family and his victories over the Philistines between the two attempts, and the first verse here passes from the king's house to a place for the ark.

  Samuel tells this second journey in a few verses ([[2 Sam. 6:12–16]]) and gives David's motive as the report of Obed-edom's blessing. Chronicles leaves that report out and has instead twenty-four verses that Samuel does not: a tent for the ark, David's rule that only Levites may carry it, the roll of the priests and Levites he gathered, and the singers, players and doorkeepers they appointed. It rejoins Samuel's account at verse 25, and the procession goes on into [[1 Chr. 16:1–3]]. Where Samuel gives the main facts, Chronicles “elaborately portrays the religious side of this solemn act,” as a book that dwells on “the progress of temple worship in Jerusalem” would. The tent David pitched was a new one, not the tabernacle of Moses, which stood at Gibeon ([[1 Chr. 16:39]]; the note at [[2 Sam. 6:17]]).

thread: |
  The chapter runs from a breach to help. David names what went wrong the first time: “the LORD our God made a breach upon us, for that we sought him not after the due order” (verse 13). The preparations put that order right: a place prepared, the Levites alone to carry, the priests and Levites sanctified, and the ark borne on their shoulders “as Moses commanded according to the word of the LORD” (verse 15). When the bearers set out, what comes is not a breach but help: “God helped the Levites that bare the ark,” and seven bullocks and seven rams were offered (verse 26). Where Samuel says only that the bearers had gone six paces ([[2 Sam. 6:13]], whose note tells of that offering), Chronicles names what carried them: God's help.

  The order did not make the day quiet. The Levites were set to sing “by lifting up the voice with joy” (verse 16), David and the elders went up “with joy” (verse 25), and all Israel brought the ark “with shouting” and every instrument (verse 28), David among them in fine linen and a linen ephod (the note at [[2 Sam. 6:14]] explains his dress). One person looked on and despised it (verse 29).

sections:
  - range: 1-3
    heading: A place, and the right bearers
    plain: |
      David built houses for himself in the city of David, and he prepared a place for the ark of God and pitched a tent for it. Then David said, “No one is to carry the ark of God except the Levites, because the LORD chose them to carry the ark of God and to serve Him forever.” David assembled all Israel at Jerusalem to bring the ark of the LORD up to the place he had prepared for it.
  - range: 4-15
    heading: The priests and Levites sanctify themselves
    plain: |
      David gathered the descendants of Aaron and the Levites. Of the sons of Kohath, Uriel the chief and 120 of his kinsmen; of the sons of Merari, Asaiah the chief and 220; of the sons of Gershom, Joel the chief and 130; of the sons of Elizaphan, Shemaiah the chief and 200; of the sons of Hebron, Eliel the chief and 80; of the sons of Uzziel, Amminadab the chief and 112.

      David called Zadok and Abiathar the priests, and the Levites Uriel, Asaiah, Joel, Shemaiah, Eliel and Amminadab, and said to them, “You are the heads of the Levites' families. Sanctify yourselves, you and your kinsmen, so that you may bring up the ark of the LORD God of Israel to the place I have prepared for it. Because you did not bring it up the first time, the LORD our God broke out against us, for we did not seek Him according to His ordinance.” So the priests and the Levites sanctified themselves to bring up the ark of the LORD God of Israel. And the Levites carried the ark of God on their shoulders with its poles, as Moses had commanded by the word of the LORD.
  - range: 16-24
    heading: Singers, players and doorkeepers
    plain: |
      David told the chiefs of the Levites to appoint some of their kinsmen as singers with instruments, lyres, harps and cymbals, to play aloud and lift up their voices with joy. So the Levites appointed Heman the son of Joel; from his kinsmen, Asaph the son of Berechiah; and from the sons of Merari, Ethan the son of Kushaiah. With them were their kinsmen of the second rank: Zechariah, Ben, Jaaziel, Shemiramoth, Jehiel, Unni, Eliab, Benaiah, Maaseiah, Mattithiah, Elipheleh, Mikneiah, and Obed-edom and Jeiel, the doorkeepers.

      The singers Heman, Asaph and Ethan were to sound bronze cymbals. Zechariah, Aziel, Shemiramoth, Jehiel, Unni, Eliab, Maaseiah and Benaiah played lyres set to Alamoth, and Mattithiah, Elipheleh, Mikneiah, Obed-edom, Jeiel and Azaziah played harps set to the Sheminith, to lead. Chenaniah, a chief of the Levites, was over the song and instructed the others in it, because he was skilled. Berechiah and Elkanah were doorkeepers for the ark. The priests Shebaniah, Jehoshaphat, Nethaneel, Amasai, Zechariah, Benaiah and Eliezer blew trumpets before the ark of God, and Obed-edom and Jehiah were doorkeepers for the ark.
  - range: 25-29
    heading: The ark brought up with joy
    plain: |
      So David, the elders of Israel and the commanders of thousands went to bring up the ark of the covenant of the LORD from the house of Obed-edom with joy. When God helped the Levites who carried the ark of the covenant of the LORD, they offered seven bulls and seven rams. David was dressed in a robe of fine linen, as were all the Levites who carried the ark, the singers, and Chenaniah, the master of the song, with the singers; David also wore a linen ephod. So all Israel brought up the ark of the covenant of the LORD with shouting and with the sound of the horn, trumpets and cymbals, playing loudly on lyres and harps. As the ark of the covenant of the LORD came into the city of David, Michal the daughter of Saul looked out of a window and saw King David dancing and celebrating, and she despised him in her heart.

notes:
  - ref: 2
    phrase: None ought to carry the ark of God but the Levites
    kind: scripture
    title: What the law said about carrying the ark
    body: |
      David's new rule is the law's own, the rule the first procession had broken. Moses had written that the LORD separated the tribe of Levi “to bear the ark of the covenant of the LORD, to stand before the LORD to minister unto him” ([[Deut. 10:8]]), and David's reason repeats it: the LORD chose them “to carry the ark of God, and to minister unto him for ever.” Within Levi the bearing fell to the sons of Kohath. When wagons were given to the other Levites for the tabernacle's heavy parts, the Kohathites received none, “because the service of the sanctuary belonging unto them was that they should bear upon their shoulders” ([[Num. 7:9]]), and they were to carry the holy things without touching them, “lest they die” ([[Num. 4:15]]; the site's note there).

      The first time, the ark had gone “in a new cart,” driven by Uzza and Ahio ([[1 Chr. 13:7]]). Samuel, telling the second journey, mentions only “they that bare the ark” ([[2 Sam. 6:13]]); Chronicles names the bearers and gives the reason they were chosen. Verse 15 shows the rule kept to the letter: the Levites bore the ark “upon their shoulders with the staves thereon, as Moses commanded according to the word of the LORD.”
    sources: [lds-scriptures]

  - ref: 5
    phrase: Of the sons of Kohath
    kind: history
    title: Six families, four of them Kohath's
    body: |
      The six chiefs David summoned head Levi's three great families and three more houses of Kohath, and most of the company came from the family whose charge the ark had always been. Kohath, Merari and Gershom (verses 5–7) are Levi's three sons. Hebron and Uzziel were sons of Kohath ([[Ex. 6:18]]), and Elizaphan was Uzziel's son ([[Ex. 6:22]], where the name is spelled Elzaphan), named in the wilderness as “the chief of the house of the father of the families of the Kohathites,” whose “charge shall be the ark” ([[Num. 3:30–31]]). Four of the six houses, with 512 of the 862 men counted in verses 5–10, came from Kohath.
    sources: [lds-scriptures]

  - ref: 13
    phrase: for that we sought him not after the due order
    kind: words
    title: Not sought “after the due order”
    body: |
      David's diagnosis of Uzza's death looks past Uzza's hand to the way the whole company had come: they had not sought the LORD according to His ordinance, and the breach fell “upon us.” The first clause is compressed in Hebrew, and its sense comes from the context: “it was not you” who brought the ark up the first time, so the Levites had not been the bearers. The “breach” is the word of [[1 Chr. 13:11]], where the place was named Perez-uzza. The note at [[2 Sam. 6:7]] weighs Uzza's own fault; Chronicles' answer is about the procession.

      “Due order” translates *mishpat*, a word for judgment and for an ordinance laid down, here one of the ordinances of the Levites' service: the law that the ark “should be carried by Levites, and touched by no unholy person,” as [[Num. 4:15]] provides. “Sought” is *dāraš*, the verb for seeking or inquiring of God, and it is the same verb as in David's proposal at the start, “we inquired not at it in the days of Saul” ([[1 Chr. 13:3]]), and in Saul's own failure, that he “inquired not of the LORD” ([[1 Chr. 10:14]]). In David's own words the first attempt had not sought the LORD as He had ordained; verse 15 shows what seeking Him after the due order looked like.

      The theme page [Seek My Face … and I Will Heal](/2-chronicles/themes/seek-my-face/) sets this breach beside the Passover of 2 Chronicles 30, where people who sought God outside the written order were healed.
    sources: [bdb, keil-chronicles, lds-scriptures]

  - ref: 16
    phrase: to be the singers with instruments of musick
    kind: history
    title: Music made a Levite office
    body: |
      Chronicles connects the music of the day “directly to the office of the Levites.” In Samuel the music is the whole people's: “David and all the house of Israel played before the LORD on all manner of instruments” ([[2 Sam. 6:5]]) and brought the ark up “with shouting, and with the sound of the trumpet” ([[2 Sam. 6:15]]). Here David has the chiefs of the Levites appoint singers, with three leaders, a second rank of players, a chief over the song or the carrying, and priests with trumpets before the ark (verses 17–24). The three leaders, Heman, Asaph and Ethan, came one from each of Levi's families, as the note at [[1 Chr. 6:31]] explains; “on Alamoth” and “on the Sheminith” (verses 20–21) are the musical directions found in the titles of [[Ps. 46]] and [[Ps. 6]], explained in the notes there. Obed-edom, here a player and a doorkeeper (verses 21, 24), bears the name of the man who kept the ark, and whether they are one man is weighed at [[2 Sam. 6:10]].

      Once the ark was set in its tent, David made the arrangement lasting, appointing Levites “to minister before the ark of the LORD, and to record, and to thank and praise the LORD God of Israel” ([[1 Chr. 16:4]]). The chapter shows David “leading a procession in song and dance” as the ark, “the most central symbol of God's presence in Israel,” came among the people, and the psalm of thanksgiving that follows joins music to seeking “his face continually” ([[1 Chr. 16:11]]).
    sources: [lds-scriptures, hopkin-psalms-sung]

  - ref: 22
    phrase: And Chenaniah, chief of the Levites, was for song
    kind: words
    title: Chenaniah, over the song or over the carrying?
    body: |
      Chenaniah's office turns on one Hebrew word, *massa*, and it may have been the carrying of the ark rather than the singing. The word comes from the verb “to lift” and usually means a burden or load. The Greek translation took it of music, calling Chenaniah “master of the bands,” and the King James likewise has “song” here and “master of the song” in verse 27.

      The word's sense of bearing points the other way. *Massa* here and in verse 27 is “probably” bearing or carrying, the word the law uses for the Kohathites' load: “These things are the burden of the sons of Kohath” ([[Num. 4:15]]). Others have taken it as singing, the lifting up of the voice. The chapter around him is about bearing the ark (verses 2, 15, 26), and on the carrying reading the skill that put him in charge was skill in what the bearing required. Either way, verse 22 puts a man in charge because he understood the work; “song” is a possible reading but not a certain one.
    sources: [bdb, lxx-rahlfs, lds-scriptures]

  - ref: 29
    phrase: she despised him in her heart
    kind: history
    title: Michal, and what Chronicles leaves out
    body: |
      Chronicles keeps Michal's look from the window and her contempt, and leaves out everything Samuel tells after it. Samuel says she saw David “leaping and dancing before the LORD” ([[2 Sam. 6:16]]); Chronicles has “dancing and playing,” without “before the LORD.” Samuel goes on to her bitter words when David came home, his answer, and the note that she had no child to the day of her death ([[2 Sam. 6:20–23]]); Chronicles ends the scene with her despising him and turns to the offerings in the tent ([[1 Chr. 16:1]]). The text does not say why it stops there. The note at [[2 Sam. 6:20]] discusses what she said and what David answered.
    sources: [lds-scriptures]

christ: |
  The ark was the sign of the LORD's presence among His people, and this chapter brings it home only after its bearers had sanctified themselves and carried it in the way He had appointed (verses 12–15). Hebrews says that the holiest place, where the ark stood ([[Heb. 9:3–4]]), is now open to believers, who may “enter into the holiest by the blood of Jesus” ([[Heb. 10:19]]), “a new and living way, which he hath consecrated for us” ([[Heb. 10:20]]), and that “we are sanctified through the offering of the body of Jesus Christ once for all” ([[Heb. 10:10]]). A disciple comes into the LORD's presence by the way Christ opened and is made holy by His offering.

