chapter: 6
title: The Sons of Levi
tagline: Levi’s line runs to Aaron and to the high priest carried into captivity; then come the singers David set over the song, the priests who made atonement, and the Levites’ cities among all the tribes.
when: 'Written after the exile; the lists run from Levi to the day “the LORD carried away Judah and Jerusalem” (verse 15)'

setting: |
  Chapters 2–5 gave the lines of Judah, Simeon and the tribes east of the Jordan; chapters 7 and 8 take up the remaining tribes. Between them, chapter 6 belongs entirely to Levi, the tribe of the priests and of the service of the house of God. What the genealogies are for is explained at [[1 Chr. 1:1]].

  The chapter has five parts. Verses 1–15 give the high priests’ family from Aaron down to Jehozadak, who was led away into exile by Nebuchadnezzar. Verses 16–30 are a short register of the families of Levi’s three sons, Gershom, Kohath and Merari. Verses 31–47 trace the descent of the three singers David appointed, Heman, Asaph and Ethan. Verses 48–53 add a word on what the Levites and the priests did and give the high priests’ line a second time, as far as Zadok’s son Ahimaaz. Verses 54–81 list the cities the Levites received among the tribes, the list already given in [[Josh. 21]].

  Two times run through the chapter. The lists reach from Levi, who went down into Egypt with Jacob ([[Gen. 46:11]]), to the fall of Jerusalem; the book itself was written, as most scholars hold, after the return from Babylon. A reader comparing a modern translation will find the numbering different: the Hebrew Bible counts verses 1–15 as the end of chapter 5 (5:27–41), so that verse 16 is its 6:1.

thread: |
  The chapter is a register of who could serve at the house of the LORD, and in what. Where an office belongs to one family, the family’s record decides who may hold it: “a priest must be able to show his descent from Aaron,” and the community that came back from Babylon put out of the priesthood the men who could not find their register ([[Ezra 2:62]]). So the chapter first follows one line, from Levi to Aaron and through Aaron’s son Eleazar to the high priest who went into captivity (verses 1–15).

  Then the whole tribe is laid out in its three families (verses 16–30), and two men a reader already knows appear in it: Samuel, counted among Kohath’s descendants (verse 28), and his grandson Heman, the first of the singers David “set over the service of song” (verses 31–47). Next the chapter draws the line inside the tribe. Every Levite served the tabernacle, but only Aaron and his sons offered at the altars “to make an atonement for Israel” (verses 48–53). Last, the tribe that had no inheritance of its own receives cities in every part of the land (verses 54–81).

sections:
  - range: 1-15
    heading: From Levi to Aaron, and Aaron’s line to the captivity
    plain: |
      Levi’s sons were Gershon, Kohath and Merari. Kohath’s sons were Amram, Izhar, Hebron and Uzziel, and Amram’s children were Aaron, Moses and Miriam. Aaron’s sons were Nadab, Abihu, Eleazar and Ithamar. Verses 4–15 then follow one line from father to son: Eleazar, Phinehas and their descendants through Zadok, the priest of David’s time, and on to Hilkiah, Azariah, Seraiah and Jehozadak. One Azariah in the line served as priest in the temple Solomon built. Jehozadak went into captivity when the LORD let Nebuchadnezzar carry Judah and Jerusalem away.
  - range: 16-30
    heading: The families of Gershom, Kohath and Merari
    plain: |
      Again, Levi’s sons were Gershom, Kohath and Merari, and these were their sons, the heads of the Levites’ families. Then a line is traced for each: from Gershom through seven generations; from Kohath through Korah and Assir, with a separate line from Elkanah that runs down to Samuel and his sons; and from Merari through seven generations.
  - range: 31-47
    heading: The singers David appointed
    plain: |
      These are the men David put in charge of the singing in the house of the LORD once the ark had a resting place. They served with song before the tabernacle until Solomon built the LORD’s house in Jerusalem, and then they carried out their duties in the order set for them. With their sons they were: Heman the singer, of Kohath’s family, whose ancestry runs back through Samuel and Korah to Levi and Israel; his kinsman Asaph, who stood at his right hand, of Gershom’s family; and on the left their kinsmen of Merari’s family, led by Ethan.
  - range: 48-53
    heading: The Levites’ service and the priests’
    plain: |
      The other Levites were assigned all the other work of the tabernacle, the house of God. But Aaron and his descendants made the offerings on the altar of burnt offering and the altar of incense, did all the work of the most holy place, and made atonement for Israel, just as Moses the servant of God had commanded. Aaron’s descendants were Eleazar, Phinehas and the rest of the line down to Zadok and his son Ahimaaz.
  - range: 54-81
    heading: The Levites’ cities
    plain: |
      These are the places where the Levites lived within the tribes’ territories. The first lot fell to Aaron’s descendants, of the Kohathite family. They received Hebron in Judah with its pasture land, though the city’s fields and villages had gone to Caleb, and with it Libnah, Jattir, Eshtemoa, Hilen, Debir, Ashan and Beth-shemesh, and from Benjamin Geba, Alemeth and Anathoth: thirteen towns in all. The rest of Kohath’s families received ten towns, Gershom’s families thirteen, and Merari’s families twelve, all by lot from the tribes named. Then the towns are listed family by family: Shechem, Gezer and others from Ephraim and Manasseh for the rest of Kohath; Golan, Kedesh and others from Manasseh in Bashan, Issachar, Asher and Naphtali for Gershom; and from Zebulun, and across the Jordan from Reuben and Gad, Bezer, Ramoth in Gilead, Heshbon and others for Merari, each town with its pasture land.

notes:
  - ref: 3
    phrase: The sons also of Aaron; Nadab, and Abihu, Eleazar, and Ithamar.
    kind: history
    title: From Aaron to the captivity
    body: |
      Verses 1–15 are the line of the high priests, traced through Aaron’s son Eleazar from the wilderness to the fall of Jerusalem. The list narrows at every step: of Levi’s grandsons only Kohath’s sons, of theirs only Amram’s children, of Aaron’s four sons only Eleazar. Nadab and Abihu died before the LORD and “had no children” ([[Num. 3:4]]), and after Aaron’s death Eleazar succeeded him, so the office came to Eleazar’s line. On one older reading the purpose of the list is “to communicate the succession of high priests from Eleazar … to Jehozadak.” Such a record mattered because the office passed by descent; a priest had to be able to show his descent from Aaron.

      It is a line, not a full roll of the office. Eli, the high priest at Shiloh, is not in it, because he descended from Aaron’s younger son Ithamar; he was probably the first high priest of that line, and the office stayed in his family until Solomon “thrust out Abiathar from being priest” ([[1 Kgs. 2:27]]). It then passed back to Eleazar’s family, in Zadok, whom Solomon put “in the room of Abiathar” ([[1 Kgs. 2:35]]). Jehoiada, the high priest who crowned the boy Joash ([[2 Kgs. 11:4–12]]), is missing too, and the same older reading judges it most probable that his name “has fallen out through an old error in the transcription.” With Jehoiada restored, the remark in verse 10, that this Azariah “executed the priest’s office in the temple that Solomon built,” could refer, as some Jewish commentators took it, to the Azariah who withstood King Uzziah when he went in to burn incense ([[2 Chr. 26:17–18]]).

      The line stops where Judah’s kingdom stopped: “Jehozadak went into captivity” (verse 15). His father Seraiah was the chief priest put to death at Riblah (see [[2 Kgs. 25:18]]). His son was Joshua, or Jeshua, who came back with Zerubbabel and was the first high priest of the restored community ([[Ezra 3:2]]; [[Hag. 1:1]]). Ezra, a priest of the same family, gives his own descent in these names ([[Ezra 7:1–5]], where the site explains the shortened list).
    sources: [keil-chronicles, bd-genealogy, bd-eli, lds-scriptures]

  - ref: 28
    phrase: the firstborn Vashni, and Abiah
    kind: history
    title: Samuel among the Levites
    body: |
      Chronicles counts Samuel among the Levites, although the book that bears his name introduces his father Elkanah as a man of mount Ephraim. The site’s note at [[1 Sam. 1:1]] weighs the two records: Samuel’s lineage is called “unclear,” with this chapter as the reason, and one Latter-day Saint reading takes the double descent as what may have qualified Samuel to serve as a priest as well as a prophet and judge. This chapter is the evidence for that reading, and it gives it twice. Verses 26–28 run down from Elkanah through Zophai, Nahath, Eliab and Jeroham to Elkanah the father of Samuel and to Samuel’s sons. Verses 33–38 run up from Heman the singer through “Joel, the son of Shemuel,” and a chain of nearly the same names (Zuph, Toah, Eliel, Jeroham, Elkanah) to Kohath and Levi.

      The two passages also account for the unfamiliar name in this verse. Samuel’s firstborn was Joel and his second son Abiah ([[1 Sam. 8:2]]), and verse 33 makes Heman “the son of Joel, the son of Shemuel.” The Hebrew of verse 28 has no Joel, and the word that follows, *vashni*, is pointed as a name, which the King James follows. Read instead as naming Joel the firstborn and Abijah the second, the verse agrees with [[1 Sam. 8:2]], and *vashni* is then what remains of the Hebrew for *and the second*. The Greek and Syriac versions have Joel, and one form of the Greek text, with the Syriac, reads “the second” where the Hebrew has “Vashni, and Abijah,” so a modern translation gives the verse as “Joel his firstborn, the second Abijah.” On that reading Vashni is not a separate son of Samuel, and the prophet’s grandson is Heman, the first of the singers named in the verses that follow.
    sources: [scripture-helps-ruth-samuel, olsen-birth-samuel, bdb, nrsvue, lds-scriptures]

  - ref: 31
    phrase: whom David set over the service of song in the house of the LORD, after that the ark had rest
    kind: history
    title: Singers in a list of Levites
    body: |
      The singers stand in Levi’s genealogy because Chronicles ties the music of Israel’s worship directly to the office of the Levites and to the house of God. When David brought the ark to Jerusalem he appointed Levites “to minister before the ark of the LORD, and to record, and to thank and praise the LORD God of Israel,” with Asaph at their head, and he set Heman and Jeduthun to give thanks at the tabernacle in Gibeon ([[1 Chr. 16:4–5]]; [[1 Chr. 16:37–42]]). Verse 32 says they served “until Solomon had built the house of the LORD.” Each of Levi’s three families gave one leader: Heman of Kohath (verses 33–38), Asaph of Gershom “on his right hand” (verses 39–43), and Ethan of Merari “on the left hand” (verses 44–47). Heman’s line runs back to Korah son of Izhar son of Kohath (verses 37–38), the Levite who rebelled against Moses and Aaron ([[Num. 16:1]]); how his descendants came to sing in the sanctuary is the note at [[Ps. 42]]. Asaph’s name stands in the titles of Psalms 50 and 73–83, and a Heman and an Ethan give theirs to Psalms 88 and 89, though which Heman is meant is weighed at [[Ps. 88]]; such titles may have been added later.

      Scholars disagree whether Chronicles’ accounts of the singers reflect how psalms were used in David’s day or in the Second Temple of the writer’s own time, but “the connection with temple worship is not under debate.” On one Latter-day Saint reading the music was more than ornament: when Solomon’s temple was dedicated, the singing itself led to the presence of God filling the house ([[2 Chr. 5:12–14]]). Another traces the hymns of the Nephite church to this tradition of the Levites’ singing in the tabernacle and the temple. Singing hymns was believed to be inspired by the Spirit and to bring the Spirit, which fits Moroni’s account that the church sang “as the power of the Holy Ghost led them” ([[Moro. 6:9]]).
    sources: [hopkin-psalms-sung, sc-knowhy-251, bd-asaph, lds-scriptures]

  - ref: 49
    phrase: But Aaron and his sons offered upon the altar of the burnt offering, and on the altar of incense
    kind: history
    title: Levites and priests
    body: |
      Verses 48–49 draw the line that runs through the whole tribe: every Levite served the house of God, but only Aaron’s family were priests. The lesser priesthood was conferred only on men of the tribe of Levi, and within the tribe only Aaron and his sons could hold the office of priest; the high priest came from Aaron’s firstborn line. The priests offered the sacrifices, burned incense and taught the law. The other Levites, “appointed unto all manner of service” (verse 48), assisted them: they kept the tabernacle and its lamps, carried the ark, slaughtered sacrifices, and, as the chapter has just shown, sang. They had been given to the LORD in place of Israel’s firstborn ([[Num. 8:16]]), and Korah’s rebellion is scripture’s account of Levites who reached for the priest’s office ([[Num. 16:8–10]]).

      Having drawn the line, the chapter gives Aaron’s descendants once more (verses 50–53), now only as far as Zadok, David’s priest, whom Solomon made high priest, and Zadok’s son Ahimaaz ([[2 Sam. 8:17]]; [[2 Sam. 15:27]]; [[1 Kgs. 2:35]]).
    sources: [bd-aaronic-priesthood, bd-levites, lds-scriptures]

  - ref: 54
    phrase: throughout their castles in their coasts
    kind: words
    title: Castles, coasts and suburbs
    body: |
      The King James words in verse 54 describe ordinary towns. “Castles” renders a Hebrew word for an encampment, and so a habitation, used here, beside “dwelling places,” for where people lived. “Coasts,” as often in the King James, means borders, the territory a tribe held, not a seashore. “Suburbs,” repeated with every town that follows, renders a word for the open common land around a town, perhaps first the pasture where cattle were driven; the law gave the Levites such land around their cities “for their cattle” ([[Num. 35:2–3]]). The verse says the priests’ dwellings lay inside the other tribes’ territories, since Levi had no inheritance of its own but was given forty-eight cities.

      Verses 54–81 give again the list of [[Josh. 21]], family by family. Aaron’s sons come first because “theirs was the lot”: in Joshua, “theirs was the first lot” ([[Josh. 21:10]]). Hebron (verse 57) and Shechem (verse 67) were also cities of refuge (on which see [[Deut. 19:2]]). Why the tribe was scattered through all the others, rather than given one territory, is the note at [[Num. 35:7]].
    sources: [bdb, bd-levites, lds-scriptures]

christ: |
  The priests of this chapter offered “to make an atonement for Israel” (verse 49). Those sacrifices were symbolic of the coming death of Jesus Christ and were offered by faith in Him, and the services of the Day of Atonement foreshadowed His atoning work: “by his own blood he entered in once into the holy place, having obtained eternal redemption for us” ([[Heb. 9:12]]). He alone could make that atonement.

  What this chapter traces by birth, the Lord now gives by covenant: those who are faithful in obtaining the two priesthoods and magnifying their callings “become the sons of Moses and of Aaron and the seed of Abraham” ([[D&C 84:33–34]]). A place in the Lord’s service, which a priest returning from Babylon had to prove from a register, rests for a disciple now on covenants received and kept.

explore: |
  - **The high priests after the exile.** [[Ezra 3:2]], [[Ezra 7:1–5]] and [[Neh. 12:10–11]] carry the line of verses 4–15 on from Jehozadak.
  - **Samuel’s family.** [[1 Sam. 1:1]], [[1 Sam. 8:1–3]] and Heman’s sons in [[1 Chr. 25:4–6]].
  - **The singers’ psalms.** [[Ps. 50]], [[Ps. 73]], [[Ps. 88]] and [[Ps. 89]], and the dedication of the temple in [[2 Chr. 5:12–14]].
  - **The Levites’ cities.** [[Num. 35:1–8]] and [[Josh. 21]].
  - **Priests and Levites.** The *Temple and Worship* guide, [The priests and Levites](/old-testament/guides/temple-and-worship/#priests).

