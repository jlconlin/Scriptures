chapter: 8
title: All These Are of the Sons of Benjamin
tagline: Benjamin's second register. Ehud's sons carried away to Manahath, the families who dwelt in Jerusalem, and the house of Saul, with the names Samuel changed and Jonathan's line traced long after the kingdom passed to David.
when: 'Written after the exile; the lists run from Benjamin, Jacob’s youngest son, to the descendants of Saul’s house.'

setting: |
  Chapter 8 is the tribe of Benjamin, and it is Benjamin's second register: a short one stood at [[1 Chr. 7:6–12]]. What the lists of chapters 1–9 are for is said once, at [[1 Chr. 1:1]]. One older reading takes this chapter to come from a different genealogical document from chapter 7's, filling out its short fragments. Its first names already differ from Genesis: Benjamin's sons in verses 1–2 are not the ten of [[Gen. 46:21]] but follow the family heads of [[Num. 26:38]], and Nohah and Rapha appear nowhere else among Benjamin's sons. The text has also suffered in copying, and in places (verses 6–7, verse 14) the sense is uncertain.

  Benjamin gave Israel its first king, Saul, and its land lay against Jerusalem, so near that over time Benjamin seems to have become part of the kingdom of Judah. The register follows that map. It passes through Geba, Ono, Lod and Aijalon to families who “dwelt in Jerusalem” (verses 28 and 32), and it closes with the house of Saul. That last list is given again at [[1 Chr. 9:35–44]], where it introduces the story of Saul's death.

thread: |
  The chapter narrows from a tribe to a city and a house. It begins with Benjamin's sons and grandsons, notes the families of Geba carried away and a Benjamite who fathered children in Moab, and then gathers its heads of families into Jerusalem (verse 28). Its last section is Saul's: Ner, Kish, Saul and his four sons. Chronicles is about to tell Israel's story from Saul's fall, and chapter 9 repeats this list to join the genealogies to that history.

  The list does not end with Saul. It follows Jonathan's son and grandson for generation after generation, and closes on a hundred and fifty sons and grandsons of Ulam, “mighty men of valour, archers.” The kingdom went to David, but Saul's house is still counted among Israel: “All these are of the sons of Benjamin.”

sections:
  - range: 1-5
    heading: Benjamin and Bela
    plain: |
      Benjamin's sons were Bela his firstborn, Ashbel the second, Aharah the third, Nohah the fourth and Rapha the fifth. Bela's sons were Addar, Gera, Abihud, Abishua, Naaman, Ahoah, Gera, Shephuphan and Huram.
  - range: 6-7
    heading: Ehud's sons, carried to Manahath
    plain: |
      These are the sons of Ehud, heads of the fathers' houses of the people of Geba, and they were carried into exile to Manahath. Naaman, Ahiah and Gera are named, and “he removed them”; he fathered Uzza and Ahihud. Words seem to have fallen out of these verses, and who carried whom away is uncertain.
  - range: 8-12
    heading: Shaharaim's sons, born in Moab
    plain: |
      Shaharaim had children in the land of Moab after he had sent away his wives Hushim and Baara. By his wife Hodesh he had Jobab, Zibia, Mesha, Malcham, Jeuz, Shachia and Mirma, all heads of fathers' houses. By Hushim he had Abitub and Elpaal. Elpaal's sons were Eber, Misham and Shamed, who built Ono and Lod with their villages.
  - range: 13-28
    heading: Heads of families in Aijalon and Jerusalem
    plain: |
      Beriah and Shema were heads of the fathers' houses of the people of Aijalon, and they drove out the people of Gath. Verses 14–27 name the families of Beriah, Elpaal, Shimhi, Shashak and Jeroham. These were heads of fathers' houses through their generations, chief men, and they lived in Jerusalem.
  - range: 29-32
    heading: The father of Gibeon
    plain: |
      The father of Gibeon lived at Gibeon, and his wife's name was Maachah. His sons were Abdon the firstborn, Zur, Kish, Baal, Nadab, Gedor, Ahio and Zacher, and Mikloth, who fathered Shimeah. These too lived in Jerusalem alongside their kinsmen.
  - range: 33-40
    heading: The house of Saul
    plain: |
      Ner fathered Kish, Kish fathered Saul, and Saul fathered Jonathan, Malchi-shua, Abinadab and Esh-baal. Jonathan's son was Merib-baal, and Merib-baal fathered Micah. Micah's sons were Pithon, Melech, Tarea and Ahaz, and verses 36–37 trace Ahaz's line through Jehoadah and Zimri down to Azel. Azel had six sons: Azrikam, Bocheru, Ishmael, Sheariah, Obadiah and Hanan. His brother Eshek's sons were Ulam the firstborn, Jehush and Eliphelet. Ulam's sons were valiant warriors and archers, with many sons and grandsons, a hundred and fifty in all. All these were descendants of Benjamin.

notes:
  - ref: 6
    phrase: these are the sons of Ehud
    kind: history
    title: The sons of Ehud, carried into exile
    body: |
      The Ehud of verse 6 is counted as the judge. Judges introduces the deliverer from Moab as “Ehud the son of Gera, a Benjamite” ([[Judg. 3:15]]), Gera is a name this register gives to Bela's family (verses 3 and 5), and this verse is counted among the references to the judge himself. The chapter tells no story of him; it names his sons and the town they headed, Geba.

      What it does record is a removal. The King James says “they removed them to Manahath” and, in verse 7, “he removed them.” The Hebrew verb is *gālâ* in its causative form, “carry away into exile”: the verb used when the king of Assyria carried away the tribes east of the Jordan ([[1 Chr. 5:26]]), and, in the passive, of the people “carried away to Babylon” in [[1 Chr. 9:1]]. As the King James reads it, the heads of Geba's families were the ones carried away to Manahath, though the verses are broken and the sense is not certain (see the plain words above).
    sources: [bd-ehud, bdb, lds-scriptures]

  - ref: 28
    phrase: These dwelt in Jerusalem
    kind: history
    title: Benjamin and Jerusalem
    body: |
      Jerusalem was one of Benjamin's own cities. Joshua's allotment counts “Jebusi, which is Jerusalem” among Benjamin's fourteen cities ([[Josh. 18:28]]), and the city lay on the frontier line between Judah and Benjamin. Benjamin did not drive out its people: “the Jebusites dwell with the children of Benjamin in Jerusalem unto this day” ([[Judg. 1:21]]). It remained a Jebusite city until David captured it and made it his capital.

      Afterward Benjamin's nearness to Jerusalem seems to have made it, gradually, part of the kingdom of Judah. So the chapter twice brings Benjamin's families into the city (verses 28 and 32), and the next chapter's list of those who lived in Jerusalem after the exile names “the children of Judah, and of the children of Benjamin” together ([[1 Chr. 9:3]]; that list is taken up at [[1 Chr. 9:2]]).
    sources: [bd-jerusalem, bd-benjamin, lds-scriptures]

  - ref: 33
    phrase: Ner begat Kish, and Kish begat Saul, and Saul begat Jonathan, and Malchi-shua, and Abinadab, and Esh-baal
    kind: history
    title: Saul's house, and the names with Baal in them
    body: |
      The house of Saul is the one list in Benjamin's register that Chronicles gives twice. It returns at [[1 Chr. 9:35–44]], from a better-preserved copy, as the bridge from the genealogies to the story of Saul's death in chapter 10. Its first names do not match 1 Samuel line for line. There Kish is “the son of Abiel” ([[1 Sam. 9:1]]) and Ner, Abner's father, is another son of Abiel ([[1 Sam. 14:51]]); here “Ner begat Kish.” One older reading takes Chronicles to pass over the names between them and to name Ner as the forefather through whom Saul's line ran. Ner himself is missing from the list of the father of Gibeon's sons in verse 30, where the copy in chapter 9 has him ([[1 Chr. 9:36]]). Of Saul's four sons, Abinadab is named among those who died with Saul ([[1 Sam. 31:2]]), and Samuel's earlier list of Saul's sons has Ishui in his place ([[1 Sam. 14:49]]); on the same reading, two names for one man.

      The last name is the one a reader of Samuel stops at. Esh-baal is Ish-bosheth, the son Abner made king ([[2 Sam. 2:8]]), and in verse 34 Merib-baal is Jonathan's son Mephibosheth. Merib-baal was his true name, and Samuel changed Esh-baal the same way. Later Israelites would not pronounce the name Baal and put *bōšet*, “shameful thing,” in its place, as the note at [[2 Sam. 2:8]] explains; Samuel carries the substitutes, and Chronicles has left the names as they were given. Esh-baal means “man of Baal”; what Merib-baal meant is uncertain, perhaps that Baal is an advocate.

      Why would Israel's first king give his son such a name? *Baal* meant “possessor, lord.” One older reading holds that in Saul's day the title was used of Israel's own God, so that to Saul the name meant “man of the Lord,” and that the prophets later refused it because heathen gods bore it. It points to Hosea, where the LORD promises that Israel “shalt call me Ishi; and shalt call me no more Baali” ([[Hosea 2:16]]; the change is explained in the note there).
    sources: [keil-chronicles, cambridge-chronicles, bd-mephibosheth, bd-baal, bdb, lds-scriptures]

  - ref: 40
    phrase: had many sons, and sons’ sons, an hundred and fifty
    kind: history
    title: Jonathan's line goes on
    body: |
      Saul's kingdom passed to David, but Jonathan's line went on, and the register follows it for many generations. The Micah of verse 34 is the son of Mephibosheth named in [[2 Sam. 9:12]], “a young son, whose name was Micha.” His father was Jonathan's lame son, whom David brought to his table, “for Jonathan thy father's sake” ([[2 Sam. 9:7]]), and whom the king spared “because of the LORD’s oath that was between them, between David and Jonathan the son of Saul” ([[2 Sam. 21:7]]). The kindness behind that oath is explained at [[2 Sam. 9:1]].

      From Micah the register runs through Ahaz and Zimri to Azel and his brother Eshek, and ends with Eshek's firstborn Ulam, whose sons were “mighty men of valour, archers,” with sons and grandsons numbering a hundred and fifty.
    sources: [bdb, bd-mephibosheth, lds-scriptures]

christ: |
  The register ends with Saul's house, and the New Testament's best-known Benjamite, Saul who is also called Paul ([[Acts 13:9]]), told that story through to Christ. Preaching at Antioch he began with “Saul the son of Cis, a man of the tribe of Benjamin,” went on to David, and ended, “Of this man’s seed hath God according to his promise raised unto Israel a Saviour, Jesus” ([[Acts 13:21–23]]). Paul named his own descent, “of the stock of Israel, of the tribe of Benjamin,” and then wrote, “what things were gain to me, those I counted loss for Christ” ([[Philip. 3:5–7]]). A disciple's standing before God rests on Christ, not on descent: the line that mattered in Paul's sermon ran to the Saviour God raised up “according to his promise.”

explore: |
  - **Ehud, the Benjamite deliverer.** [[Judg. 3:15–30]].
  - **Benjamin's land, and Jerusalem on its border.** [[Josh. 18:11–28]]; [[Judg. 1:21]].
  - **Saul's house after Saul.** [[2 Sam. 2:8–11]]; [[2 Sam. 9]]; [[2 Sam. 21:7]]; the same list again at [[1 Chr. 9:35–44]].
  - **Paul the Benjamite.** [[Rom. 11:1]]; [[Philip. 3:4–9]].

