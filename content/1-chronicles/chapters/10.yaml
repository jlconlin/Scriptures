chapter: 10
title: So Saul Died
tagline: The history after the genealogies opens with one battle. Saul and his sons fall on mount Gilboa, the Philistines carry his head and armour to their gods, the men of Jabesh bury him, and Chronicles says why he died.
when: 'The end of Saul''s reign: the battle on mount Gilboa and the day after it (verse 8).'

setting: |
  The genealogies end with Saul's family at Gibeon ([[1 Chr. 9:35–44]]), and the history begins with Saul's death. 1 Chronicles 10 through 2 Chronicles 9 tell the reigns of David and Solomon, and on an older reading this chapter is the introduction to David's: everything after it in 1 Chronicles is his.

  Verses 1–12 tell the battle as [[1 Sam. 31:1–13]] tells it, closely, and the site's notes there explain Saul's death by his own sword, the trophies in the Philistines' temples, and the men of Jabesh-gilead who buried him. A few details differ. Chronicles says the Philistines fastened Saul's head in the temple of Dagon, where Samuel has his body on the wall of Beth-shan (see the note at [[1 Sam. 31:10]]), and it leaves out the burning of the bodies at Jabesh (see [[1 Sam. 31:12]]).

  What is Chronicles' own is the last two verses, a verdict on why Saul died. Such reflections are characteristic of the Chronicler. The rest of Saul's reign, including David's years as Saul's fugitive, is left out: the book assumes its readers know Samuel.

thread: |
  Chronicles has no story of Saul's reign to tell. Of the first king it tells only his death and what followed it, and then the reason: he was unfaithful to the LORD, he did not keep His word, and he went to a medium for counsel instead of seeking the LORD, “therefore he slew him, and turned the kingdom unto David the son of Jesse.” The chapter is less about Saul than about the kingdom passing. Chronicles goes on to show how, after Saul's death, the LORD gave the kingship to David, with all Israel coming to Hebron to anoint him ([[1 Chr. 11:1–3]]); David's seven years over Judah alone are not told.

  The battle itself is told as Samuel told it. Saul's sons fall, the archers find him, he falls on his own sword, the Philistines make a show of his head and armour, and the valiant men of Jabesh take the bodies away and mourn seven days. Only the verdict at the end is new. The compilers of Chronicles chose from their sources what suited their purpose and dwelt most on the religious side of the history, and the one thing they add to this account is the reason Saul died: Saul was unfaithful, and he did not seek the LORD.

sections:
  - range: 1-7
    heading: The battle on mount Gilboa
    plain: |
      The Philistines fought against Israel, and the men of Israel fled before them and fell dead on mount Gilboa. The Philistines pressed hard after Saul and his sons, and killed Jonathan, Abinadab and Malchi-shua. The battle went heavily against Saul, and the archers found him and wounded him. Saul said to his armourbearer, “Draw your sword and run me through, so that these uncircumcised men do not come and make sport of me.” But his armourbearer would not, for he was terrified. So Saul took a sword and fell on it. When the armourbearer saw that Saul was dead, he too fell on his sword and died. So Saul died, with his three sons, and all his house died together. When the Israelites in the valley saw that the army had fled and that Saul and his sons were dead, they abandoned their towns and fled, and the Philistines came and lived in them.
  - range: 8-10
    heading: Trophies for the Philistines' gods
    plain: |
      The next day, when the Philistines came to strip the dead, they found Saul and his sons fallen on mount Gilboa. They stripped him, took his head and his armour, and sent word throughout the land of the Philistines to carry the news to their idols and to the people. They put his armour in the house of their gods and fastened his head in the temple of Dagon.
  - range: 11-12
    heading: The men of Jabesh-gilead
    plain: |
      When all Jabesh-gilead heard what the Philistines had done to Saul, all its valiant men set out, took away the bodies of Saul and his sons, and brought them to Jabesh. They buried their bones under the oak there and fasted seven days.
  - range: 13-14
    heading: Why Saul died
    plain: |
      So Saul died for his unfaithfulness to the LORD: he did not keep the word of the LORD, and he sought counsel from a medium, and did not seek counsel from the LORD. Therefore the LORD put him to death and turned the kingdom over to David son of Jesse.

notes:
  - ref: 6
    phrase: and all his house died together
    kind: history
    title: All his house died together
    body: |
      “All his house” cannot mean every member of Saul's family, because some of them outlived the battle. After Gilboa, Abner, Saul's captain, took “Ish-bosheth the son of Saul” and made him king over Israel ([[2 Sam. 2:8–9]]; the note “Abner and Ish-bosheth” there tells the story, and Chronicles' own list of Saul's sons is explained at [[1 Chr. 8:33]]). Chronicles itself traces Saul's line for generations after him, through Jonathan's son Merib-baal ([[1 Chr. 8:33–40]]).

      Samuel's account suggests what the phrase means. Where Chronicles has “all his house,” Samuel has “his armourbearer, and all his men, that same day together” ([[1 Sam. 31:6]]). Older readings take “house” here as simply another way of saying “all his men,” the king's attendants who followed him to the war: the reference “is rather to Saul's servants than to his family,” and Chronicles has only shortened the account.
    sources: [cambridge-chronicles, keil-chronicles, oshb-wlc, lds-scriptures]

  - ref: 13
    phrase: for his transgression which he committed against the LORD, even against the word of the LORD, which he kept not
    kind: history
    title: The word of the LORD, which he kept not
    body: |
      The first charge Chronicles brings against Saul is unfaithfulness. “Transgression which he committed” translates a noun and its verb from the same root, *maʿal … māʿal*, an “unfaithful, treacherous act,” used of acts against God. Chronicles used the same noun a chapter earlier for the sin that sent Judah into exile (see the note at [[1 Chr. 9:1]]): Saul is charged with a breach of faith, not with a misstep.

      Chronicles does not say which “word of the LORD” Saul did not keep, since it tells none of his reign. Samuel's account uses the same language at the two places where Samuel told Saul that his kingdom would not stand. At Gilgal Saul offered the sacrifice himself rather than wait for Samuel, and Samuel told him, “thou hast not kept the commandment of the LORD thy God” ([[1 Sam. 13:13]]). After the war with Amalek he spared what he had been told to destroy, and Samuel said, “Because thou hast rejected the word of the LORD, he hath also rejected thee from being king” ([[1 Sam. 15:23]]). The sentence at Endor named the disobedience over Amalek: “Because thou obeyedst not the voice of the LORD, nor executedst his fierce wrath upon Amalek, therefore hath the LORD done this thing unto thee this day” ([[1 Sam. 28:18]]). In sum, “Saul's downfall shows the consequences of uncontrolled self-will and disobedience to counsel.”
    sources: [oshb-wlc, bdb, bd-saul, lds-scriptures]

  - ref: 14
    phrase: And inquired not of the LORD
    kind: words
    title: Inquired not of the LORD
    body: |
      Chronicles' verdict sets two kinds of seeking against each other with one verb. Saul died “for asking counsel of one that had a familiar spirit, to inquire of it; and inquired not of the LORD”: “inquire” is *dāraš* in both places. Both uses belong to one sense of the verb, “seek, consult, inquire of”: in verse 14 the one sought is the LORD, in verse 13 one of the “heathen gods and necromancers.” Saul did seek counsel in the end; he sought it from the wrong place. What a familiar spirit was, and what came at Endor, are explained at [[1 Sam. 28:3]] and [[1 Sam. 28:12]].

      The verdict seems at first to contradict Samuel's account, which says that “when Saul inquired of the LORD, the LORD answered him not, neither by dreams, nor by Urim, nor by prophets” ([[1 Sam. 28:6]]). The note there explains the silence: Saul had departed from the Lord, and so the Lord had departed from him. Chronicles does not mention that unanswered asking; its verdict names only the counsel Saul did take.
    sources: [oshb-wlc, bdb, jfsmith-endor-1962, lds-scriptures]

  - ref: 14
    phrase: therefore he slew him, and turned the kingdom unto David the son of Jesse
    kind: history
    title: The LORD slew him, and turned the kingdom
    body: |
      Saul died by his own sword (verse 4), yet Chronicles says that the LORD “slew him.” Samuel's account had already put the defeat in the LORD's hands: the sentence at Endor was that “the LORD will also deliver Israel with thee into the hand of the Philistines: and to morrow shalt thou and thy sons be with me” ([[1 Sam. 28:19]]; the note there follows it to Gilboa). Samuel's account of the battle itself ends with the burial and the fast at Jabesh ([[1 Sam. 31:13]]); the verdict of verses 13–14, that the death was the LORD's judgment, is Chronicles' own.

      The kingdom was not Saul's to pass on. The LORD “turned” it to David, as He had said He would. At Gilgal Samuel had told Saul that “the LORD hath sought him a man after his own heart” ([[1 Sam. 13:14]]), and at Endor the sentence was the same, “the LORD hath rent the kingdom out of thine hand, and given it to thy neighbour, even to David” ([[1 Sam. 28:17]]). The next chapter opens with all Israel coming to David at Hebron to make him king “according to the word of the LORD by Samuel” ([[1 Chr. 11:3]]).
    sources: [lds-scriptures]

christ: |
  The LORD whom Saul did not seek is Jehovah, the premortal Jesus Christ ([[Ex. 3:14]]). Chronicles closes Saul's life with the warning side of a promise that David gives his son later in the book: “if thou seek him, he will be found of thee; but if thou forsake him, he will cast thee off for ever” ([[1 Chr. 28:9]]). The Lord who searches every heart is still found by those who seek Him, and a silence from heaven is not a reason to seek counsel anywhere else.

