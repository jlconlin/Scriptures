chapter: 3
title: These Were All the Sons of David
tagline: David's sons born in Hebron and in Jerusalem, the kings of Judah from Solomon to the exile, and David's house carried on in Babylon and after the return.
when: 'Written after the exile; the list runs from the sons born to David in Hebron to the generations after Zerubbabel.'

setting: |
  Chapter 2 traced Judah's line through Hezron's son Ram down to Jesse and his sons ([[1 Chr. 2:10–17]]), then turned aside to the families of Ram's brothers. Chapter 3 takes up Ram's line again and follows it to its end: all of David's sons (verses 1–9), the kings of his house from Solomon to Jeconiah and Zedekiah (10–16), Jeconiah's descendants down to Zerubbabel's grandsons (17–21), and further families to a fourth generation (22–24). What the genealogies as a whole are for is explained at [[1 Chr. 1:1]].

  Much of the list is drawn from stories told at length elsewhere. The six sons born in Hebron are those of [[2 Sam. 3:2–5]], to which the Church's footnote sends the reader; the sons born in Jerusalem are those of [[2 Sam. 5:14–16]], listed again at [[1 Chr. 14:4–7]]; and verses 10–16 compress the kings whose reigns fill 1 and 2 Kings into a column of names. From verse 17 the list follows David's house into captivity and back; Shealtiel and Zerubbabel are named again in Ezra and Haggai, but the families of the last verses are otherwise unknown.

  Two times are in play. The people named lived from David's reign to several generations after the return from Babylon. The book that names them was written after the Babylonian exile, most scholars suggest possibly in the fourth century BC.

thread: |
  The chapter tells the history of David's house as a family register, and its shape carries the story. It opens wide, with nineteen sons by name and a reign of seven years and a half in Hebron and thirty-three in Jerusalem. Then it narrows to one name a generation, “Solomon’s son was Rehoboam, Abia his son, Asa his son” ([[1 Chr. 3:10]]), the line by which the throne passed from father to son. At Josiah it widens again into brothers, and one older reading explains why: with him “the regular succession to the throne in the house of David ceased,” and “the independent kingship of David came properly to an end with the death of Josiah.” From verse 17 the list goes on with no throne at all: a captive king's sons, a grandson who governed the returned exiles, and his descendants in the land.

  The register does not stop when the kingdom did. Why Chronicles keeps such lists is said at [[1 Chr. 1:1]]; where blessings belonged to particular families, descent had to be shown, and among the Bible Dictionary's examples is “the Messiah from David.” Chapter 3 carries that line from David's sons in Hebron into the generations after Zerubbabel.

sections:
  - range: 1-4
    heading: The sons born in Hebron
    plain: |
      These are the sons born to David in Hebron. The firstborn was Amnon, whose mother was Ahinoam of Jezreel; the second, Daniel, whose mother was Abigail of Carmel; the third, Absalom, son of Maachah, the daughter of Talmai king of Geshur; the fourth, Adonijah, son of Haggith; the fifth, Shephatiah, son of Abital; the sixth, Ithream, by David's wife Eglah. These six were born to him in Hebron, where he reigned seven years and six months. In Jerusalem he reigned thirty-three years.
  - range: 5-9
    heading: The sons born in Jerusalem
    plain: |
      These were born to him in Jerusalem: Shimea, Shobab, Nathan and Solomon, four sons of Bath-shua (Bathsheba), the daughter of Ammiel; and nine more, Ibhar, Elishama, Eliphelet, Nogah, Nepheg, Japhia, Elishama, Eliada and Eliphelet. These were all of David's sons, besides the sons of his concubines; and Tamar was their sister.
  - range: 10-16
    heading: The kings from Solomon to the exile
    plain: |
      Solomon's son was Rehoboam, and the line ran from father to son: Abia, Asa, Jehoshaphat, Joram, Ahaziah, Joash, Amaziah, Azariah, Jotham, Ahaz, Hezekiah, Manasseh, Amon and Josiah. Josiah's sons were Johanan the firstborn, Jehoiakim the second, Zedekiah the third and Shallum the fourth. Jehoiakim's sons were Jeconiah and Zedekiah.
  - range: 17-24
    heading: David's house in exile and after
    plain: |
      The sons of Jeconiah: Assir (or, as the word may be read, “Jeconiah the captive”), and Salathiel his son; also Malchiram, Pedaiah, Shenazar, Jecamiah, Hoshama and Nedabiah. Pedaiah's sons were Zerubbabel and Shimei. Zerubbabel's children were Meshullam and Hananiah, with their sister Shelomith; five more names follow, Hashubah, Ohel, Berechiah, Hasadiah and Jushab-hesed. Hananiah's sons were Pelatiah and Jesaiah; then come the families of Rephaiah, Arnan, Obadiah and Shechaniah. Shechaniah's line is followed four generations: his son Shemaiah; Shemaiah's sons Hattush, Igeal, Bariah, Neariah and Shaphat (the verse counts six, though five are named); Neariah's three sons, Elioenai, Hezekiah and Azrikam; and Elioenai's seven, Hodaiah, Eliashib, Pelaiah, Akkub, Johanan, Dalaiah and Anani.

notes:
  - ref: 11
    phrase: Ahaziah his son, Joash his son
    kind: scripture
    title: The kings Matthew passes over
    body: |
      Matthew's genealogy of Jesus follows this column of kings, but not name for name. Where verses 11–12 run Joram, Ahaziah, Joash, Amaziah, Azariah, Matthew writes, “Joram begat Ozias” ([[Matt. 1:8]]), and Ozias is Azariah, the king better known as Uzziah. Three kings in this list are not in his. Where verses 15–16 put Jehoiakim between Josiah and Jeconiah, Matthew has “Josias begat Jechonias and his brethren” ([[Matt. 1:11]]). Between David and Zerubbabel, Matthew gives fifteen names, where Luke, following another line, gives twenty-one.

      Matthew says himself what shaped his list: “from David until the carrying away into Babylon are fourteen generations” ([[Matt. 1:17]]). His genealogy is “a careful organization of the Savior’s ancestors into three groups of fourteen individuals,” written to show “how Jesus is a son of David”; in that reading the number itself points to David, whose name in Hebrew “had the value of fourteen.” Chronicles runs the line king by king; Matthew arranges the same line to say who Jesus is.
    sources: [lds-scriptures, bd-uzziah, bd-genealogy, sc-knowhy-654]

  - ref: 15
    phrase: the firstborn Johanan
    kind: history
    title: Josiah's four sons
    body: |
      Verse 15 does not list Josiah's sons in the order they reigned, and Johanan, the firstborn, is not among the kings who followed Josiah. Shallum, named fourth, is the king that Kings and 2 Chronicles call Jehoahaz, whom the people made king when Josiah fell ([[2 Kgs. 23:30]]). Pharaoh-nechoh then set Jehoiakim, the second son, in his place ([[2 Kgs. 23:34]]); Jehoiakim's son Jeconiah followed him ([[2 Kgs. 24:6]]); and last came Zedekiah, the third son, whom the king of Babylon put on the throne in place of his nephew ([[2 Kgs. 24:17]]). So the line that verses 10–14 ran from father to son ends with three brothers and a grandson reigning in turn.

      Verse 16 then names a second Zedekiah, a son of Jehoiakim beside Jeconiah. In Kings the king Zedekiah is Jeconiah's “father's brother” ([[2 Kgs. 24:17]]), and the list does not say whether this Zedekiah is another man of the name.
    sources: [bd-shallum, lds-scriptures]

  - ref: 17
    phrase: Assir, Salathiel his son
    kind: words
    title: Assir, or the captive
    body: |
      The word the King James Version reads as the name of Jeconiah's first son, Assir, can also be read as a title for Jeconiah himself, “prisoner,” and some modern translations take it so: “the sons of Jeconiah the captive: Shealtiel his son.” The Westminster Leningrad Codex tags the Hebrew *ʾassir* as a common noun, not a proper name. The question is open: one older commentary kept it as a son's name, because a title set beside Jeconiah's name would need the article, which the word lacks. Read as a title, the verse calls the king by what he became. Jeconiah, also called Jehoiachin and Coniah, reigned three months before Nebuchadnezzar carried him to Babylon ([[2 Kgs. 24:8]], [[2 Kgs. 24:15]]), and he was still a prisoner there thirty-seven years later, when a new king of Babylon “did lift up the head of Jehoiachin king of Judah out of prison” ([[2 Kgs. 25:27]]).

      On either reading the captive king had sons, though Jeremiah had said, “Write ye this man childless”; the note at [[Jer. 22:30]] explains the word by the rest of the verse, that no son of his would sit on David’s throne. His sons and grandsons in verses 17–19 are an heir's line without a throne. Salathiel, the first of them, is the Shealtiel whom Ezra and Haggai name as Zerubbabel's father and the Salathiel of [[Matt. 1:12]].
    sources: [oshb-wlc, nrsvue, esv, keil-chronicles, bd-jehoiachin, lds-scriptures]

  - ref: 19
    phrase: the sons of Pedaiah were, Zerubbabel
    kind: history
    title: Zerubbabel, governor of Judah
    body: |
      Zerubbabel, Jeconiah's grandson, is the governor who led the returned exiles in setting up the altar and rebuilding the temple ([[Ezra 3:2]], [[Ezra 3:8]]; [[Zech. 4:6–10]]), and here he stands in David's line. Who he was, and why Ezra and Haggai call him “son of Shealtiel” where this verse makes him a son of Pedaiah, Shealtiel's brother in verses 17–18, is explained at [[Hag. 1:1]]; the Lord's promise to make him a signet is at [[Hag. 2:23]]. What Chronicles alone gives is his family: Meshullam and Hananiah, their sister Shelomith, and five more names in verse 20. Hananiah's sons carry the line on in verse 21.
    sources: [bd-zerubbabel, lds-scriptures]

  - ref: 21
    phrase: the sons of Rephaiah, the sons of Arnan
    kind: history
    title: How far past the exile the line runs
    body: |
      The chapter's last verses are its hardest text, and how they are read decides how many generations past Zerubbabel the line runs. As the Hebrew stands, verse 21 names Hananiah's two sons and then the sons of four men, Rephaiah, Arnan, Obadiah and Shechaniah, with nothing to say how they join what came before. The Septuagint reads “his son” each time, making one chain of fathers and sons. By one count the Hebrew seems to reckon six generations after Zerubbabel, the Greek eleven. Older commentators divided: one preferred the Greek; another judged the text corrupt, with no means of restoring it, took the four families as branches of David's house whose link to Zerubbabel cannot now be traced, and thought the closing verses “perhaps” a fragment added later.

      A Hattush “of the sons of David” came up from Babylon with Ezra ([[Ezra 8:2]]), and he may be the Hattush of verse 22, but the link is uncertain. Other men bore the name ([[Neh. 3:10]]; [[Neh. 12:2]]), and in one older reading the families of verses 22–24 did not descend from Zerubbabel in a direct line, since none of their names is among his descendants in [[Matt. 1:13–16]].

      Some of the names carry a meaning: Jushab-hesed is “Mercy is restored,” and Elioenai “Mine eyes are towards Jehovah.” Many such names, in one older reading, belong to the period of the return.
    sources: [cambridge-chronicles, keil-chronicles, lds-scriptures]

christ: |
  This chapter is the line through which the New Testament traces Jesus Christ. Matthew follows it through Solomon and the kings to “Jechonias” and, after the carrying away, to “Salathiel” and “Zorobabel” ([[Matt. 1:12]]); Luke reaches David through Nathan, the third of Bath-shua's sons in verse 5, and passes through Zorobabel and Salathiel as well ([[Luke 3:27]], [[Luke 3:31]]). The two are probably different lines, Matthew's “a legal descent” and Luke's “a natural descent through actual parentage.”

  The list after Jeconiah names no king, yet the angel's word to Mary was that “the Lord God shall give unto him the throne of his father David” ([[Luke 1:32]]). The same Lord says of all His word that it “shall not pass away, but shall all be fulfilled” ([[D&C 1:38]]); what He has promised a disciple is as sure as what He promised David's house, even when its fulfillment is long in coming.

