chapter: 19
title: Let Us Behave Ourselves Valiantly
tagline: David sends comforters to the new king of Ammon; Hanun's princes call them spies, and he shaves them and cuts their garments. The Ammonites buy an army of Syrians with a thousand talents of silver, Joab and Abishai beat it before the city, and David defeats the Syrians from beyond the river until Hadarezer's servants make peace.
when: 'David''s reign in Jerusalem: when Nahash king of Ammon died (“after this,” verse 1), in the years of David''s wars; not dated in the text.'

setting: |
  Chapter 18 summed up David's wars in a few lines; this chapter tells one of them at length, the war with Ammon and its Syrian allies, as [[2 Sam. 10]] tells it. Chronicles has already named Ammon among the nations whose silver and gold David dedicated ([[1 Chr. 18:11]]), and on one older reading this chapter is the later course of the same war with Zobah begun in [[1 Chr. 18:3–8]]: first Syrians hired as Ammon's auxiliaries, then a last campaign that ended in a formal peace. Between Samuel's chapters 8 and 10 stands David's kindness to Jonathan's son Mephibosheth ([[2 Sam. 9]]), which Chronicles leaves out, as it passes over the whole history of David's court that fills so much of 2 Samuel.

  The site's notes on 2 Samuel 10 explain most of what is here: the kindness David meant to return to Nahash's son ([[2 Sam. 10:2]]), the shaving and cutting of the envoys and why the insult was David's ([[2 Sam. 10:4]]), the Ammonites who “stank” before David, here “made themselves odious” ([[2 Sam. 10:6]]), Joab's call to courage ([[2 Sam. 10:12]]), and the figures for the last battle ([[2 Sam. 10:18]]). The notes here go to what Chronicles tells differently. It also leaves out Helam, where Samuel says the Syrians came and David came against them ([[2 Sam. 10:16–17]]); where Helam lay is unknown.

thread: |
  The chapter turns on a kindness misread. David sends comforters to a new king whose father had been kind to him; Hanun's princes call them spies, and Hanun sends them home shaved and half naked. Everything after follows from that act. The Ammonites know they have made themselves odious to David and buy an army against him. Joab, caught between the Ammonites at their city gate and the Syrians in the field, divides his men, promises Abishai help, and leaves the outcome with God: “let us behave ourselves valiantly for our people, and for the cities of our God: and let the LORD do that which is good in his sight” (verse 13). The cities were God's, on one older reading, because He had given them to Israel and was worshipped in them.

  Both enemies flee. The Syrians come again, joined by the Syrians beyond the river, David himself crosses the Jordan to meet them, and Hadarezer's servants make peace and serve him. The chapter ends with Ammon alone: “neither would the Syrians help the children of Ammon any more.” Ammon is beaten in the field but not conquered; its army has gone back into its city (verse 15), and the next chapter opens with Joab's siege of Rabbah ([[1 Chr. 20:1]]).

sections:
  - range: 1-5
    heading: Comfort taken for spying
    plain: |
      Some time after this Nahash king of the Ammonites died, and his son became king in his place. David said, “I will show kindness to Hanun the son of Nahash, because his father showed kindness to me.” So David sent messengers to comfort him over his father, and David's servants came to Hanun in the land of the Ammonites to comfort him. But the Ammonite princes said to Hanun, “Do you think David is honoring your father by sending you comforters? Haven't his servants come to you to search out the land, to overthrow it and to spy it out?” So Hanun took David's servants, shaved them, cut their garments off at the middle, up to their buttocks, and sent them away. Some people went and told David how the men had been treated, and he sent to meet them, for the men were deeply ashamed. The king said, “Stay at Jericho until your beards have grown, and then come back.”
  - range: 6-9
    heading: An army bought with silver
    plain: |
      When the Ammonites saw that they had made themselves hateful to David, Hanun and the Ammonites sent a thousand talents of silver to hire chariots and horsemen from Mesopotamia, from Syria-maachah and from Zobah. They hired thirty-two thousand chariots, and the king of Maachah with his army, who came and camped before Medeba; and the Ammonites gathered from their cities and came out to fight. When David heard of it, he sent Joab and the whole army of fighting men. The Ammonites came out and drew up for battle at the gate of their city, while the kings who had come stood by themselves in the open country.
  - range: 10-15
    heading: Joab and Abishai before the city
    plain: |
      When Joab saw that the battle faced him in front and behind, he chose some of Israel's best men and drew them up against the Syrians, and he put the rest of the army under his brother Abishai, drawn up against the Ammonites. He said, “If the Syrians are too strong for me, you come and help me; but if the Ammonites are too strong for you, I will help you. Be strong, and let us show ourselves brave for our people and for the cities of our God; and may the LORD do what is good in His sight.” So Joab and the men with him advanced to fight the Syrians, and they fled before him. When the Ammonites saw that the Syrians had fled, they too fled before Abishai, Joab's brother, and went into the city. Then Joab came back to Jerusalem.
  - range: 16-19
    heading: The Syrians from beyond the river
    plain: |
      When the Syrians saw that Israel had beaten them, they sent messengers and brought out the Syrians who lived beyond the river, with Shophach the commander of Hadarezer's army at their head. When David was told, he gathered all Israel, crossed the Jordan, came upon them and drew up his army against them; and when David had drawn up for battle against the Syrians, they fought with him. But the Syrians fled before Israel, and David killed seven thousand of their men who fought in chariots and forty thousand foot soldiers, and he killed Shophach the commander. When Hadarezer's servants saw that Israel had beaten them, they made peace with David and became his subjects; and the Syrians would not help the Ammonites any more.

notes:
  - ref: 6
    phrase: a thousand talents of silver to hire them chariots and horsemen out of Mesopotamia
    kind: history
    title: A thousand talents of silver
    body: |
      Chronicles alone says what the Ammonites paid for their army, and the sum is enormous. Samuel says only that they “sent and hired the Syrians” ([[2 Sam. 10:6]]). A talent was about 75.6 pounds (34 kilograms), so a thousand talents was some thirty-four metric tons of silver. The verse ties the payment to what the Ammonites understood about themselves: it was when they saw “that they had made themselves odious to David” that they sent it.

      The army the silver bought is named differently too. Samuel names the Syrians of Beth-rehob and Zoba, the king of Maacah and the men of Ish-tob; Chronicles names Mesopotamia, Syria-maachah and Zobah. “Mesopotamia” translates the Hebrew *ʾĂram Nahărayim*, “Aram of the two rivers,” the Euphrates and the Tigris.
    sources: [bd-weights-and-measures, oshb-wlc, strongs-concordance, lds-scriptures]

  - ref: 7
    phrase: So they hired thirty and two thousand chariots
    kind: history
    title: Thirty-two thousand chariots
    body: |
      Chronicles' thirty-two thousand chariots stand where Samuel counts some thirty-three thousand men. Samuel lists twenty thousand footmen from Beth-rehob and Zoba, a thousand men with the king of Maacah, and twelve thousand men of Ish-tob ([[2 Sam. 10:6]]); Chronicles has thirty-two thousand chariots “and the king of Maachah and his people.” On one older reading the word “chariots” has slipped in from the verse before in place of “men.”

      The figures for the last battle differ as well: Chronicles has seven thousand men who fought in chariots and forty thousand footmen (verse 18), where Samuel has seven hundred chariots and forty thousand horsemen. The note at [[2 Sam. 10:18]] sets those side by side, and the note at [[2 Sam. 24:9]] gives one explanation offered for such large figures.

      Chronicles also says where the hired army camped, which Samuel does not: “before Medeba,” a town in “the plain by Medeba” that Moses gave to Reuben east of the Jordan ([[Josh. 13:15–16]]), while the Ammonites gathered from their own cities to join them.
    sources: [cambridge-chronicles, lds-scriptures]

christ: |
  The shame Hanun put on David's servants, the beard shorn and the garments cut away, is the kind of insult Isaiah's Servant says he gave himself to: “I gave my back to the smiters, and my cheeks to them that plucked off the hair” ([[Isa. 50:6]]). The chapter heading reads that verse as speaking of the Messiah, and the note there follows it to the mocking of Jesus Christ. David's servants suffered the insult; the Savior offered Himself to it, and “endured the cross, despising the shame” ([[Heb. 12:2]]). Shame borne for His name is therefore no disgrace to a disciple: the apostles, beaten before the council, departed “rejoicing that they were counted worthy to suffer shame for his name” ([[Acts 5:41]]).

