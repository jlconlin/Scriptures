chapter: 11
title: To Make Him King
tagline: All Israel comes to Hebron and anoints David king, as the LORD had said by Samuel; he takes the stronghold of Zion, and Joab wins the command. Then the roll of the mighty men who held with him to make him king, from the three to the sixteen names only Chronicles keeps.
when: 'The beginning of David’s reign over all Israel, at Hebron and then Jerusalem; the roll gathers men who served him “to make him king” (verse 10).'

setting: |
  Chronicles begins David's story the moment Saul's ends. Chapter 10 closes with the LORD turning “the kingdom unto David the son of Jesse” ([[1 Chr. 10:14]]), and chapter 11 opens with all Israel at Hebron. Verses 1–9 tell what [[2 Sam. 5:1–10]] tells: the covenant and the anointing at Hebron, and the taking of the Jebusite stronghold that became the city of David. The site's notes on that chapter explain the tribes' words, the shepherd's charge, the boast of the blind and the lame, and Zion; this chapter's notes go to what Chronicles changes. Jebus, the name verse 4 gives, was the city's ancient name, a hill fortress that kept its independence until David stormed it.

  Verses 10–47 are the roll of David's mighty men. Samuel keeps the same roll near the end of its account, after David's last words ([[2 Sam. 23:8–39]]); Chronicles sets it here, at the start of the reign, gives it a heading of its own, and carries it on with sixteen names Samuel does not have. Chapter 12 goes on with the men of every tribe who came to David at Ziklag and at Hebron, so that chapters 11 and 12 together are the gathering of Israel to its king.

thread: |
  The chapter keeps saying that David's kingdom came by the word of the LORD. Saul died for “the word of the LORD, which he kept not” ([[1 Chr. 10:13]]); the tribes now quote what the LORD said to David, “Thou shalt feed my people Israel” (verse 2); they anoint him “according to the word of the LORD by Samuel” (verse 3); and the mighty men stand with him “to make him king, according to the word of the LORD concerning Israel” (verse 10). Between those words comes the summary of the reign's beginning: “David waxed greater and greater: for the LORD of hosts was with him” (verse 9).

  The roll then shows what that kingdom was made of: men. Eleazar standing in a field of barley, and the LORD saving Israel “by a great deliverance”; three men breaking through a Philistine camp for a drink of water, which David would not drink and poured out to the LORD (the note at [[2 Sam. 23:16]] explains the offering); Abishai and Benaiah; and then name after name, Uriah the Hittite among them. Chronicles leaves out the seven divided years that Samuel tells, but it keeps the roll of the men who stood with him.

sections:
  - range: 1-3
    heading: All Israel at Hebron
    plain: |
      Then all Israel gathered to David at Hebron and said, “We are your own flesh and blood. Even in the past, while Saul was king, you were the one who led Israel out to battle and brought them home. And the LORD your God said to you, ‘You shall shepherd My people Israel, and you shall be ruler over My people Israel.’” So all the elders of Israel came to the king at Hebron, and David made a covenant with them in Hebron before the LORD, and they anointed David king over Israel, as the LORD had said through Samuel.
  - range: 4-9
    heading: The stronghold of Zion
    plain: |
      David and all Israel went to Jerusalem, that is, Jebus, where the Jebusites lived, the people of the land. The people of Jebus told David, “You will not come in here.” But David took the stronghold of Zion, which is the city of David. David said, “Whoever strikes the Jebusites first shall be chief and commander.” Joab the son of Zeruiah went up first, and he became chief. David lived in the stronghold, so it was called the city of David. He built up the city all around, from the Millo around to the rest, and Joab restored the rest of the city. And David grew greater and greater, for the LORD of hosts was with him.
  - range: 10-14
    heading: The chief of the mighty men
    plain: |
      These are the chiefs of David's mighty men, who held strongly with him in his kingdom, together with all Israel, to make him king, as the LORD had spoken concerning Israel. This is the roll of David's mighty men. Jashobeam, a Hachmonite, chief of the captains: he raised his spear against three hundred and killed them at one time. After him was Eleazar the son of Dodo, the Ahohite, one of the three mighty men. He was with David at Pas-dammim, where the Philistines had gathered for battle. There was a plot of ground full of barley, and the people fled from the Philistines. But they took their stand in the middle of the plot, defended it, and struck down the Philistines, and the LORD saved them with a great victory.
  - range: 15-19
    heading: The water of Beth-lehem
    plain: |
      Three of the thirty chiefs went down to the rock, to David at the cave of Adullam, while the Philistine army was camped in the valley of Rephaim. David was then in the stronghold, and a Philistine garrison was in Beth-lehem. David longed for water and said, “If only someone would give me a drink of water from the well of Beth-lehem by the gate!” So the three broke through the Philistine camp, drew water from the well of Beth-lehem by the gate, and brought it to David. But David would not drink it; he poured it out to the LORD and said, “My God forbid that I should do this! Shall I drink the blood of these men who put their lives at risk? They brought it at the risk of their lives.” So he would not drink it. These are the things the three mighty men did.
  - range: 20-25
    heading: Abishai and Benaiah
    plain: |
      Abishai the brother of Joab was chief of the three. He raised his spear against three hundred and killed them, and he won a name among the three. Of the three he was more honored than the other two, for he was their captain, but he did not reach the rank of the first three.

      Benaiah the son of Jehoiada, the son of a valiant man of Kabzeel who had done great deeds, killed two lionlike men of Moab. He also went down and killed a lion in a pit on a snowy day. He killed an Egyptian, a huge man five cubits tall, with a spear like a weaver's beam in his hand. Benaiah went down to him with a staff, snatched the spear from the Egyptian's hand, and killed him with his own spear. These are the things Benaiah the son of Jehoiada did, and he won a name among the three mighty men. He was honored among the thirty, but he did not reach the rank of the first three, and David put him in charge of his guard.
  - range: 26-47
    heading: The valiant men of the armies
    plain: |
      The valiant men of the armies were Asahel the brother of Joab; Elhanan the son of Dodo of Beth-lehem; Shammoth the Harorite; Helez the Pelonite; Ira the son of Ikkesh the Tekoite; Abi-ezer the Antothite; Sibbecai the Hushathite; Ilai the Ahohite; Maharai the Netophathite; Heled the son of Baanah the Netophathite; Ithai the son of Ribai, of Gibeah in Benjamin; Benaiah the Pirathonite; Hurai of the brooks of Gaash; Abiel the Arbathite; Azmaveth the Baharumite; Eliahba the Shaalbonite; the sons of Hashem the Gizonite; Jonathan the son of Shage the Hararite; Ahiam the son of Sacar the Hararite; Eliphal the son of Ur; Hepher the Mecherathite; Ahijah the Pelonite; Hezro the Carmelite; Naarai the son of Ezbai; Joel the brother of Nathan; Mibhar the son of Haggeri; Zelek the Ammonite; Naharai the Berothite, the armor-bearer of Joab the son of Zeruiah; Ira the Ithrite; Gareb the Ithrite; Uriah the Hittite; Zabad the son of Ahlai.

      Then Adina the son of Shiza the Reubenite, a captain of the Reubenites, and thirty with him; Hanan the son of Maachah; Joshaphat the Mithnite; Uzzia the Ashterathite; Shama and Jehiel the sons of Hothan the Aroerite; Jediael the son of Shimri and Joha his brother, the Tizite; Eliel the Mahavite; Jeribai and Joshaviah the sons of Elnaam; Ithmah the Moabite; Eliel, Obed, and Jasiel the Mesobaite.

notes:
  - ref: 1
    phrase: Then all Israel gathered themselves to David unto Hebron
    kind: history
    title: From Saul's death straight to all Israel
    body: |
      Chronicles moves from Saul's death to all Israel at Hebron with nothing between, and in doing so it leaves out seven and a half years that Samuel tells at length. In Samuel the men of Judah anoint David king over Judah alone ([[2 Sam. 2:4]]), Abner makes Saul's son Ish-bosheth king over the rest of Israel ([[2 Sam. 2:8–9]]), and “there was long war between the house of Saul and the house of David” ([[2 Sam. 3:1]]) until Abner and Ish-bosheth are dead. Only then do the tribes come to Hebron ([[2 Sam. 5:1]]). The note at [[2 Sam. 2:4]] explains those two kingdoms.

      Chronicles does not deny those years. It counts them in David's reign at the end of the book: “seven years reigned he in Hebron, and thirty and three years reigned he in Jerusalem” ([[1 Chr. 29:27]]). And the next chapter speaks of men who came to Hebron “to turn the kingdom of Saul to him” ([[1 Chr. 12:23]]). Chronicles appears to assume that its readers know Samuel and Kings, and it leaves out David's struggles with Saul, his sin with Bath-sheba and his family's troubles in the same way. Here the result is that the first thing Chronicles says of David as king is that all Israel came to him.
    sources: [lds-scriptures, scripture-helps-2-chronicles]

  - ref: 6
    phrase: So Joab the son of Zeruiah went first up, and was chief
    kind: history
    title: How Joab became chief
    body: |
      Joab won the chief command by leading the assault on Jebus, and only Chronicles says so. Samuel's form of David's offer is hard to follow, and the King James supplies its end from this verse (the note at [[2 Sam. 5:8]]); Chronicles words it simply and names the man who went up first. Joab was David's nephew, a son of his sister Zeruiah ([[1 Chr. 2:16]]), and he became the captain of David's army, close to every major event of the reign and generally faithful to his master until he backed Adonijah and was put to death by Solomon ([[1 Kgs. 2:28–34]]).

      A reader of Samuel will notice that Joab was already leading David's men years before this, at the pool of Gibeon ([[2 Sam. 2:13]]). Samuel does not say that he became commander on this occasion, and one older reading suggests he was first formally acknowledged as commander at the capture of Jebus. The same reading explains why his name is missing from the roll that follows: he has already been named, though his brothers Abishai (verse 20) and Asahel (verse 26) and his armor-bearer (verse 39) are on it.
    sources: [cambridge-chronicles, bd-joab, lds-scriptures]

  - ref: 8
    phrase: 'even from Millo round about: and Joab repaired the rest of the city'
    kind: words
    title: The Millo, and Joab's share
    body: |
      “Millo” is the name of a fortification in Jerusalem, a citadel or earthwork; the word is related to filling, and an Assyrian word of the same kind means an earthwork, mound or terrace. Solomon's levy later built the Millo with the wall of Jerusalem ([[1 Kgs. 9:15]]; the note there).

      Samuel says only that “David built round about from Millo and inward” ([[2 Sam. 5:9]]). Chronicles adds that “Joab repaired the rest of the city,” giving the new commander a share in the work after David's.
    sources: [bdb, lds-scriptures]

  - ref: 10
    phrase: These also are the chief of the mighty men whom David had
    kind: history
    title: The roll moved to the beginning
    body: |
      Chronicles moves the roll of the mighty men from the end of David's story to its beginning, and gives it a heading that says why it is there. In Samuel the roll comes in the closing chapters, after David's last words, and opens simply, “These be the names of the mighty men whom David had” ([[2 Sam. 23:8]]). Chronicles has its own form of that opening in verse 11 (“this is the number of the mighty men whom David had”) and sets this verse before it: these are the men “who strengthened themselves with him in his kingdom, and with all Israel, to make him king.” The site's note on [[2 Sam. 23:8]] explains how the roll is ranked, the three, the second class, and the thirty, and its setting notes that this placement suggests the roll belongs, at least in substance, to the early years of the reign.

      Nine of the roll's names return in [[1 Chr. 27:2–15]] (the Church's footnote at verse 26 points there) as the captains of the twelve courses of David's army, each over twenty-four thousand for a month of the year: Jashobeam, Benaiah the son of Jehoiada, Asahel, Ira the son of Ikkesh, Helez the Pelonite, Sibbecai the Hushathite, Abiezer, Maharai the Netophathite and Benaiah the Pirathonite. And the next chapter widens the circle from these chiefs to the men of every tribe who came to David at Ziklag and at Hebron ([[1 Chr. 12:1]], [[1 Chr. 12:23]]).
    sources: [lds-scriptures]

  - ref: 13
    phrase: where was a parcel of ground full of barley
    kind: words
    title: Where Shammah went
    body: |
      Chronicles gives Eleazar a deed that Samuel gives to another man, Shammah, whose name is missing here. In [[2 Sam. 23:9–12]] Eleazar fights the Philistines “until his hand was weary,” and then a third hero, Shammah the son of Agee, stands alone in “a piece of ground full of lentiles.” The older commentaries agree that the two deeds have run together and Shammah's name has dropped out of Chronicles. One of them explains how: Samuel has the Philistines “gathered together” twice (verses 9 and 11), and a copyist's eye may have passed from the first to the second, so that the lines between, with the end of Eleazar's deed and Shammah's name, were lost and Shammah's stand now reads as Eleazar's.

      On that reading the plural verbs of verse 14 (“they set themselves … and delivered it”) probably came in afterward, from a reader who took the deed to be Eleazar's and David's together. Where Samuel has lentils, Chronicles has barley; the two Hebrew words look alike and might have been confused by a copyist. Pas-dammim is the place Samuel calls Ephes-dammim, where the Philistines had gathered against Saul when Goliath came out ([[1 Sam. 17:1]]). The roll's first name differs as well: verse 11 has Jashobeam and three hundred slain, where Samuel has the Tachmonite and eight hundred (the note at [[2 Sam. 23:8]]).
    sources: [keil-chronicles, cambridge-chronicles, lds-scriptures]

  - ref: 41
    phrase: Uriah the Hittite
    kind: history
    title: Uriah, and sixteen names more
    body: |
      In Samuel the roll ends with Uriah the Hittite and the count, “thirty and seven in all” ([[2 Sam. 23:39]]); in Chronicles his name is followed by sixteen more, from Zabad the son of Ahlai to Jasiel the Mesobaite (verses 41–47), that Samuel does not have. Where they come from, the text does not say (the note at [[2 Sam. 23:8]] gives two suggestions). The new names include a captain of the Reubenites “and thirty with him” (verse 42) and a Moabite (verse 46).

      Chronicles keeps Uriah on the roll, though it leaves out the story of David's sin with Bath-sheba and of Uriah's death ([[2 Sam. 11]]), as it leaves out the divided years (the note at verse 1). The site's note at [[2 Sam. 23:39]] says what it means that the roll of David's heroes names the man David had killed, and the note at [[1 Chr. 20:1]] treats what Chronicles leaves out of David's reign.
    sources: [lds-scriptures, scripture-helps-2-chronicles]

christ: |
  The chapter founds David's kingdom on the word of the LORD and on a charge to shepherd: “Thou shalt feed my people Israel” (verse 2). The prophets promised a greater David, “one shepherd … even my servant David” ([[Ezek. 34:23]]), who is Jesus Christ, the Good Shepherd and David's descendant, and Gabriel told Mary that “the Lord God shall give unto him the throne of his father David” and “of his kingdom there shall be no end” ([[Luke 1:32–33]]). The charge David was given, to feed the LORD's people, is the charge that Shepherd keeps for His people now: “he shall feed them, and he shall be their shepherd” ([[Ezek. 34:23]]).

