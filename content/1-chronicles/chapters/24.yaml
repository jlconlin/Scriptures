chapter: 24
title: Divided by Lot
tagline: David divides the sons of Aaron into twenty-four courses, and the lot sets the order in which each house will come into the house of the LORD; the eighth lot falls to Abijah. Then the rest of the Levites cast lots in the same way.
when: 'The last years of David’s reign, when he “was old and full of days” and had made Solomon king ([[1 Chr. 23:1]]), ordering the service of the house that Solomon would build.'

setting: |
  Chapters 23–26 are David's orders for the people who would serve in the temple, given when he was old and had made Solomon king. Chapter 23 numbers the Levites and divides them “into courses” by their three families ([[1 Chr. 23:6]]). Chapter 24 turns to the priests, the sons of Aaron, and divides them into twenty-four courses; chapter 25 orders the singers and chapter 26 the porters and treasurers.

  The order lasted. Solomon appointed “the courses of the priests to their service” “according to the order of David his father” ([[2 Chr. 8:14]]), and Josiah told the Levites to prepare themselves “after your courses, according to the writing of David” ([[2 Chr. 35:4]]; the Church's footnote at verse 1 points there). It outlasted the exile as well: only four houses of priests came back from the captivity, and they were divided again into twenty-four (the site's note at [[Neh. 12:7]] shows those houses after the return). Luke could still name a priest by his course (the note at verse 10).

thread: |
  The chapter is about order, and the order is drawn by lot: the priests and Levites “are divided into groups and assigned their duties by lot.” The priests come first: Aaron's two surviving houses, Eleazar's with sixteen courses and Ithamar's with eight, draw for their places in front of the king and both chief priests (verses 1–6), and the twenty-four names that follow are the order in which the lots came out (verses 7–18).

  Verse 19 says what the whole arrangement served: the courses were “to come into the house of the LORD, according to their manner, under Aaron their father, as the LORD God of Israel had commanded him.” David arranged the turns; the priesthood and its service were the LORD's command to Aaron. Then the rest of the Levites cast lots in the same way and in the same presence (verses 20–31).

sections:
  - range: 1-6
    heading: The sons of Aaron divided
    plain: |
      These are the divisions of the sons of Aaron. Aaron's sons were Nadab, Abihu, Eleazar and Ithamar. But Nadab and Abihu died before their father and had no children, so Eleazar and Ithamar served as priests. David, with Zadok of the descendants of Eleazar and Ahimelech of the descendants of Ithamar, divided them according to their appointed duties. More leading men were found among Eleazar's descendants than among Ithamar's, so they were divided this way: sixteen heads of fathers' houses for Eleazar's descendants, and eight for Ithamar's.

      They divided them by lot, the one group alongside the other, because there were officers of the sanctuary and officers of God among both Eleazar's descendants and Ithamar's. Shemaiah the son of Nethaneel, the scribe, a Levite, wrote them down in the presence of the king and the princes, Zadok the priest, Ahimelech the son of Abiathar, and the heads of the fathers' houses of the priests and the Levites, one father's house being drawn for Eleazar and then one for Ithamar.
  - range: 7-19
    heading: The twenty-four lots
    plain: |
      The first lot fell to Jehoiarib, the second to Jedaiah, the third to Harim, the fourth to Seorim, the fifth to Malchijah, the sixth to Mijamin, the seventh to Hakkoz, the eighth to Abijah, the ninth to Jeshua, the tenth to Shecaniah, the eleventh to Eliashib, the twelfth to Jakim, the thirteenth to Huppah, the fourteenth to Jeshebeab, the fifteenth to Bilgah, the sixteenth to Immer, the seventeenth to Hezir, the eighteenth to Aphses, the nineteenth to Pethahiah, the twentieth to Jehezekel, the twenty-first to Jachin, the twenty-second to Gamul, the twenty-third to Delaiah, and the twenty-fourth to Maaziah.

      This was their order of service for coming into the house of the LORD, according to the way laid down for them under Aaron their forefather, as the LORD God of Israel had commanded him.
  - range: 20-31
    heading: The rest of the Levites
    plain: |
      As for the rest of the descendants of Levi: of the sons of Amram, Shubael, and of Shubael's sons, Jehdeiah. Of Rehabiah's sons, Isshiah was the first. Of the Izharites, Shelomoth, and of Shelomoth's sons, Jahath. Of Hebron's sons, Jeriah was the first, Amariah the second, Jahaziel the third and Jekameam the fourth. Of Uzziel's sons, Michah, and of Michah's sons, Shamir. Michah's brother was Isshiah, and of Isshiah's sons, Zechariah.

      The sons of Merari were Mahli and Mushi, and of Jaaziah, Beno. The sons of Merari through Jaaziah were Beno, Shoham, Zaccur and Ibri. From Mahli came Eleazar, who had no sons. From Kish came Kish's son Jerahmeel. The sons of Mushi were Mahli, Eder and Jerimoth. These were the Levites by their fathers' houses. They too cast lots, just as their kinsmen the sons of Aaron did, in the presence of King David, Zadok, Ahimelech, and the heads of the fathers' houses of the priests and Levites, the heads of the fathers' houses alongside their younger brothers.

notes:
  - ref: 3
    phrase: both Zadok of the sons of Eleazar, and Ahimelech of the sons of Ithamar
    kind: history
    title: Two houses of priests
    body: |
      Every priest in Israel descended from one of two sons of Aaron, and David's arrangement kept both houses in view. Aaron had four sons, but Nadab and Abihu died “before the LORD” for offering strange fire ([[Lev. 10:1–2]]; the site's note at [[Lev. 10:1]] explains their fault), and verse 2 adds that they “had no children.” Eleazar and Ithamar became Aaron's chief assistants, and the priesthood ran through them alone.

      The two houses had not been equal in honor. The high priests descended from Eleazar, except for a line from Eli to Abiathar, who belonged to Ithamar's family; the office then returned to Eleazar's house in Zadok. Zadok of Eleazar's house and Abiathar of Ithamar's had served side by side since the last years of Saul's reign, until Abiathar joined Adonijah's rebellion and Zadok was put in his place ([[1 Kgs. 2:35]]; the note at [[2 Sam. 8:17]] tells the story). So the chapter names a man of each house at David's side. The names Ahimelech and Abiathar are probably interchanged here and in verse 31, as in [[2 Sam. 8:17]] and [[1 Chr. 18:16]], for Abiathar was Ahimelech's son (the same note explains).
    sources: [lds-scriptures, bd-eleazar, bd-ithamar, bd-zadok, bd-abiathar]

  - ref: 5
    phrase: Thus were they divided by lot, one sort with another
    kind: history
    title: Why the order was drawn by lot
    body: |
      The number of courses followed the size of each house, but the order of service was left to the lot, and verse 5 gives the reason: “the governors of the sanctuary, and governors of the house of God” had come from both houses. One older reading explains why that called for the lot: both lines had produced men of the highest priestly rank, and Ithamar's had held the high priesthood for a time in the days of the judges, so “neither of the lines was to have an advantage, but the order was to be determined by lot for both.” Eleazar's house had more heads of families and received sixteen courses to Ithamar's eight (verse 4). The order was drawn, one father's house taken for Eleazar and one for Ithamar (verse 6), in the presence of the king, the princes and both chief priests, and a Levite scribe wrote each result down.

      The same method orders the rest of David's arrangement. The Levites cast lots “over against their brethren the sons of Aaron” (verse 31); the singers “cast lots, ward against ward, as well the small as the great, the teacher as the scholar” ([[1 Chr. 25:8]]); the porters cast lots “as well the small as the great” for every gate ([[1 Chr. 26:13]]). Scripture uses lots many times to make a choice, from dividing the land under Joshua to choosing an apostle in place of Judas ([[Acts 1:26]]), and Proverbs expresses a feeling about the LORD's hand in it: “The lot is cast into the lap; but the whole disposing thereof is of the LORD” ([[Prov. 16:33]]).
    sources: [lds-scriptures, bd-lots-casting-of, keil-chronicles]

  - ref: 10
    phrase: the eighth to Abijah
    kind: scripture
    title: The course of Abijah, and Zacharias
    body: |
      The eighth lot, Abijah's, names the course of a priest in the New Testament. Luke opens his Gospel with “a certain priest named Zacharias, of the course of Abia” ([[Luke 1:5]]), Abia being another spelling of Abijah, and the Church's footnote at this verse points there. The angel came to him while he “executed the priest's office before God in the order of his course” ([[Luke 1:8]]).

      The courses were still working in Zacharias's day, re-formed after the exile (see the Background above). Each course served for a week at a time, changing on the Sabbath between the morning and evening sacrifices, and all the courses served together at the great festivals. By the first century the twenty-four courses held something like 7,200 priests, so that a priest like Zacharias could serve in the temple only once every twenty-four weeks, about twice a year, besides the festivals. Within a course the day's duties were again assigned by lot, which gave each priest an equal opportunity to serve. The lot to burn incense in the Holy Place was the one that mattered most: no priest drew for it again until the others serving with him had had their turn, so that it was essentially a once-in-a-lifetime service. That was Zacharias's lot: “his lot was to burn incense when he went into the temple of the Lord” ([[Luke 1:9]]), and the angel appeared to him “standing on the right side of the altar of incense” ([[Luke 1:11]]).
    sources: [lds-scriptures, bd-priests, brown-tamid]

  - ref: 20
    phrase: And the rest of the sons of Levi were these
    kind: history
    title: The rest of the Levites, a generation on
    body: |
      Verses 20–31 go back to the Levites of chapter 23 and, under most of the same heads, name the next man of the house. Chapter 23 stopped at Shebuel, Rehabiah, Shelomith, Michah and Jesiah ([[1 Chr. 23:16–20]]); here each is followed by a son: Shubael by Jehdeiah, Rehabiah by Isshiah, Shelomoth by Jahath, Michah by Shamir, and Isshiah, Michah's brother, by Zechariah. Merari's line gains the house of Jaaziah (verses 26–27), and Kish's line is carried on by his son Jerahmeel (verse 29). The Kohathite and Merarite houses that served beside the priests are here; the Gershonites are not, but Gershonite houses appear later over the treasures of the sanctuary ([[1 Chr. 26:21–22]]), so the list need not be thought incomplete.

      Verse 31 ends with the lot, for these Levites cast lots in the same presence as the priests had, “the principal fathers over against their younger brethren.” One older reading takes the head of a father's house and his younger brother to have drawn on the same terms, the lot dividing the eldest and the youngest alike.
    sources: [lds-scriptures, keil-chronicles]

christ: |
  The eighth lot names the course in which Zacharias was serving when the angel promised him a son, John ([[Luke 1:13]]): John the Baptist, a priest in the Aaronic order who by that authority “prepared the way for and baptized Jesus.” In 1829 the same John conferred the Priesthood of Aaron on Joseph Smith and Oliver Cowdery, with “the keys of the ministering of angels, and of the gospel of repentance, and of baptism by immersion for the remission of sins” ([[D&C 13:1]]). The priesthood David ordered by courses is on the earth now, and the repentance and baptism John offered to prepare the way for Christ are offered by its authority still.

