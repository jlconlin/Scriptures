chapter: 2
title: The Sons of Judah
tagline: Israel's twelve sons are named, and Judah's family is traced through Tamar's son Pharez and through Hezron to David, the seventh son of Jesse, and out into the clans and towns of Caleb and Jerahmeel.
when: 'Written after the exile; the line of Judah from the sons of Israel to David and the clans of Judah'

setting: |
  Chapter 1 carried the line from Adam to Israel; chapter 2 begins the twelve tribes, and it begins with Judah. What the genealogies of chapters 1–9 are for is explained at [[1 Chr. 1:1]]. The book was written after the Babylonian exile (its date is taken up in the setting of chapter 1), so two times are in play here: the names reach from Jacob's sons to David and the clans who held Judah's towns, and the readers are their descendants, generations after the return.

  Verses 1–2 name the twelve sons of Israel, but the tribes that follow are not taken in that order. Judah comes first and Simeon after it ([[1 Chr. 4:24]]), then Reuben, Gad and the half tribe of Manasseh (chapter 5), then the rest. One older reading calls the order geographical at first: the southern tribes, then those east of the Jordan. Judah has the most room of any tribe: its genealogy runs from 2:3 to [[1 Chr. 4:23]].

  Much of the chapter's first half is drawn from earlier scripture. Judah's five sons follow [[Gen. 38]] and [[Gen. 46:12]], and the two sons of Pharez [[Num. 26:21]]. The line from Ram to Jesse is the one that closes the book of Ruth ([[Ruth 4:19–22]]), with one addition: Nahshon is called “prince of the children of Judah,” as he was in the wilderness ([[Num. 2:3]]).

thread: |
  The chapter is Judah's family drawn with David at its center. From the twelve sons of Israel it goes straight to Judah, and through the sons of Judah who left families to Hezron, whose three sons, Jerahmeel, Ram and Chelubai (a form of the name Caleb), give the rest of the chapter its order. Jerahmeel was Hezron's firstborn (verse 25), yet the younger Ram's line comes first, and it is the line that leads to David: Ram to Jesse, Jesse's seven sons with David last, then the sisters whose sons were David's captains (verses 10–17). Caleb's family follows (18–24), then Jerahmeel's (25–41), then Caleb's again (42–55), spreading out into the clans and towns of Judah.

  Along the way the list stops for a few men the reader already knows: Er, whom the LORD slew; Achar, who troubled Israel; Nahshon, prince of Judah; Bezaleel, who built the tabernacle. And it ends with Kenites, probably a people not descended from Jacob, counted among Judah's families.

sections:
  - range: 1-2
    heading: The sons of Israel
    plain: |
      These are the sons of Israel: Reuben, Simeon, Levi, Judah, Issachar, Zebulun, Dan, Joseph, Benjamin, Naphtali, Gad and Asher.
  - range: 3-8
    heading: Judah, Tamar, and the line of Zerah
    plain: |
      Judah's sons by the daughter of Shua, a Canaanite woman, were Er, Onan and Shelah. Er, Judah's firstborn, was wicked in the LORD's sight, and the LORD put him to death. Tamar, Judah's daughter-in-law, bore him Pharez and Zerah, so that Judah had five sons in all. Pharez's sons were Hezron and Hamul. Zerah's were Zimri, Ethan, Heman, Calcol and Dara, five in all. Carmi's son was Achar, who brought trouble on Israel when he transgressed in the thing devoted to the LORD. Ethan's son was Azariah.
  - range: 9-17
    heading: From Hezron to David
    plain: |
      Hezron's sons were Jerahmeel, Ram and Chelubai. Ram fathered Amminadab, and Amminadab fathered Nahshon, prince of the tribe of Judah. Nahshon fathered Salma, Salma fathered Boaz, Boaz fathered Obed, and Obed fathered Jesse. Jesse's firstborn was Eliab; then came Abinadab, Shimma, Nethaneel, Raddai and Ozem, and David the seventh. Their sisters were Zeruiah and Abigail. Zeruiah had three sons, Abishai, Joab and Asahel. Abigail bore Amasa, whose father was Jether the Ishmeelite.
  - range: 18-24
    heading: Caleb, and Hezron's last sons
    plain: |
      Caleb the son of Hezron had children by his wife Azubah and by Jerioth; her sons were Jesher, Shobab and Ardon. When Azubah died, Caleb married Ephrath, who bore him Hur. Hur fathered Uri, and Uri fathered Bezaleel. Later Hezron, at sixty, married the daughter of Machir, the father of Gilead, and she bore him Segub. Segub fathered Jair, who held twenty-three towns in the land of Gilead. He took Geshur and Aram, with the towns of Jair, from them, and Kenath with its villages, sixty towns in all; all these belonged to the descendants of Machir, Gilead's father. After Hezron died in Caleb-ephratah, his wife Abiah bore him Ashur, the father of Tekoa.
  - range: 25-41
    heading: The line of Jerahmeel
    plain: |
      The sons of Jerahmeel, Hezron's firstborn, were Ram his firstborn, Bunah, Oren, Ozem and Ahijah. By another wife, Atarah, he had Onam. Ram's sons were Maaz, Jamin and Eker. Onam's sons were Shammai and Jada, and Shammai's were Nadab and Abishur. Abishur's wife Abihail bore him Ahban and Molid. Nadab's sons were Seled, who died without children, and Appaim. Appaim's son was Ishi, Ishi's was Sheshan, and Sheshan's child was Ahlai. Jada's sons were Jether, who died without children, and Jonathan, whose sons were Peleth and Zaza. These were Jerahmeel's descendants. Sheshan had daughters but no sons. He had an Egyptian servant named Jarha, and he gave him his daughter as wife, and she bore Attai. From Attai the line runs through Nathan, Zabad, Ephlal, Obed, Jehu, Azariah, Helez, Eleasah, Sisamai, Shallum and Jekamiah to Elishama.
  - range: 42-55
    heading: Caleb's clans and Judah's towns
    plain: |
      The sons of Caleb, Jerahmeel's brother, were Mesha his firstborn, the father of Ziph, and the sons of Mareshah, the father of Hebron. Hebron's sons were Korah, Tappuah, Rekem and Shema. Shema fathered Raham, the father of Jorkoam, and Rekem fathered Shammai, whose son Maon was the father of Beth-zur. Ephah, Caleb's concubine, bore Haran, Moza and Gazez, and Haran fathered Gazez. Jahdai's sons were Regem, Jotham, Geshan, Pelet, Ephah and Shaaph. Maachah, Caleb's concubine, bore Sheber and Tirhanah, and also Shaaph the father of Madmannah, and Sheva the father of Machbenah and of Gibea. Caleb's daughter was Achsah.

      These were the descendants of Caleb the son of Hur, the firstborn of Ephratah: Shobal the father of Kirjath-jearim, Salma the father of Beth-lehem, and Hareph the father of Beth-gader. Shobal's descendants were Haroeh and half of the Manahethites, and the families of Kirjath-jearim were the Ithrites, Puhites, Shumathites and Mishraites; from them came the Zareathites and the Eshtaulites. Salma's descendants were Beth-lehem, the Netophathites, Ataroth, the house of Joab, half of the Manahethites, and the Zorites, with the families of scribes who lived at Jabez: the Tirathites, Shimeathites and Suchathites. These are the Kenites who came from Hemath, the father of the house of Rechab.

notes:
  - ref: 3
    phrase: Er, the firstborn of Judah, was evil in the sight of the LORD; and he slew him
    kind: scripture
    title: Why Er's death is in the list
    body: |
      Judah's line runs through Tamar's sons because his first two sons died, and verse 3 keeps the first of those deaths in nearly the words of Genesis: “And Er, Judah's firstborn, was wicked in the sight of the LORD; and the LORD slew him” ([[Gen. 38:7]]). Onan, the second, died for refusing to raise up seed to his dead brother (see the note at [[Gen. 38:9]]). Numbers counts the tribe the same way. “Er and Onan died in the land of Canaan” ([[Num. 26:19]]), and Judah's families descend from the three who lived, Shelah, Pharez and Zerah ([[Num. 26:20]]).

      Two of those three were Tamar's sons (verse 4), so the line that reaches David in verses 9–15 passes through the story of [[Gen. 38]]. Judah's own verdict on Tamar, and her place in the line of Christ, are taken up at [[Gen. 38:26]] and [[Gen. 38:29]].
    sources: [lds-scriptures]

  - ref: 6
    phrase: Zimri, and Ethan, and Heman, and Calcol, and Dara
    kind: history
    title: Ethan and Heman, the Ezrahites
    body: |
      Four of Zerah's sons have nearly the names, and in the same order, of the wise men Solomon surpassed: he was wiser “than Ethan the Ezrahite, and Heman, and Chalcol, and Darda, the sons of Mahol” ([[1 Kgs. 4:31]]). Kings calls them sons of Mahol, a name this list does not have, but it gives Ethan a title that points to Zerah: *Ezrahite* (*ʾezrāḥî*) means “of the family of Zerah.” The same title stands on two psalms, Heman's ([[Ps. 88]]) and Ethan's ([[Ps. 89]]), and the Ethan and Heman of those titles and of Kings may be the sons of Zerah in this verse.

      That leaves a puzzle, because Chronicles also has a Heman and an Ethan among the Levite singers ([[1 Chr. 6:33]], [[1 Chr. 6:44]]). Whether the Heman of Psalm 88's title is this man of Judah or the singer is weighed in the note on the psalm's title at [[Ps. 88]].
    sources: [bdb, lds-scriptures]

  - ref: 7
    phrase: Achar, the troubler of Israel, who transgressed in the thing accursed
    kind: history
    title: Achar, the troubler of Israel
    body: |
      Achar is Achan, the man of Judah whose theft from the spoil of Jericho brought Israel's defeat at Ai ([[Josh. 7]]), and Chronicles spells his name so that it says what he did. The Hebrew reads *ʿākār ʿôkēr yiśrāʾēl*, “Achar, the troubler of Israel”: the name and the word for “troubler,” a form of the verb *ʿākar*, “stir up, disturb, trouble,” sound alike. It is the verb of Joshua's sentence on him, “Why hast thou troubled us? the LORD shall trouble thee this day” ([[Josh. 7:25]]), and it gave its name to the valley where he died, Achor; the play on Achan, Achor and trouble is set out at [[Josh. 7:26]]. Ahab would later throw the same title at Elijah: “Art thou he that troubleth Israel?” ([[1 Kgs. 18:17]]).

      “The thing accursed” is the *ḥērem*, the spoil of Jericho dedicated to the LORD, which Achan coveted and hid. Joshua gives his descent more fully, “Achan, the son of Carmi, the son of Zabdi, the son of Zerah, of the tribe of Judah” ([[Josh. 7:1]]).
    sources: [oshb-wlc, bdb, ot-minute-josh-7, bd-achan, lds-scriptures]

  - ref: 15
    phrase: David the seventh
    kind: history
    title: David the seventh
    body: |
      Chronicles counts David the seventh of Jesse's sons, where Samuel gives Jesse eight. Jesse “had eight sons” ([[1 Sam. 17:12]]), and at the anointing he “made seven of his sons to pass before Samuel” before David was fetched from the sheep ([[1 Sam. 16:10]]), which makes David the eighth. Verses 13–15 name seven, beginning with the three eldest that Samuel also names (Shimma is Samuel's Shammah). Neither book says who the missing son was. One older reading holds that one son “seems deliberately passed over, perhaps because he had no children,” and it takes Elihu, “one of the brethren of David,” who was over Judah in [[1 Chr. 27:18]], to be Eliab rather than an eighth brother.

      Verse 16 adds that Zeruiah and Abigail were David's sisters, so that Joab, Abishai, Asahel and Amasa, the commanders of 2 Samuel, were his nephews. How this verse and [[2 Sam. 17:25]] differ over Amasa's father is taken up in the note there.
    sources: [cambridge-chronicles, lds-scriptures]

  - ref: 18
    phrase: Caleb the son of Hezron
    kind: history
    title: Caleb the son of Hezron
    body: |
      The Caleb of verses 18–20 and 42–49 is a son of Hezron, Judah's grandson, and is not plainly the Caleb who spied out the land. Verse 9 calls him Chelubai, another form of the name, and verse 42 the brother of Jerahmeel. The spy was “Caleb the son of Jephunneh” ([[Num. 13:6]]), one of the two who brought back a true report and later received Hebron, and Chronicles lists his sons separately ([[1 Chr. 4:15]]). One older reading finds “nothing to shew what relationship existed between this Caleb and Caleb son of Jephunneh,” though both belong to Judah and they may be one man. The reason it gives for thinking so is verse 49, “the daughter of Caleb was Achsah”: the son of Jephunneh also had a daughter Achsah, whom he gave to the man who took Kirjath-sepher ([[Josh. 15:16–17]]).

      Caleb's line pauses on one great-grandson. Hur's son Uri fathered Bezaleel (verse 20), the craftsman the LORD “called by name” to build the tabernacle, “Bezaleel the son of Uri, the son of Hur, of the tribe of Judah” ([[Ex. 31:2]]; see the note there).
    sources: [cambridge-chronicles, bd-caleb, lds-scriptures]

  - ref: 51
    phrase: Salma the father of Beth-lehem
    kind: words
    title: Father of Beth-lehem
    body: |
      A man called the *father* of a town may be its chief rather than the man who begot its people. One sense of the Hebrew *ʾāḇ* is “ruler, chief,” a late use, found in this chapter at verse 24, Ashur “the father of Tekoa,” and verse 42, Mesha “the father of Ziph.” The same phrase, a man as father of a town, runs on through verses 45 and 49–51: Maon “the father of Beth-zur,” Shobal “the father of Kirjath-jearim,” and Salma “the father of Beth-lehem.”
    sources: [bdb, oshb-wlc]

  - ref: 55
    phrase: These are the Kenites that came of Hemath, the father of the house of Rechab
    kind: history
    title: Kenites in Judah's list
    body: |
      Judah's genealogy ends with families that were probably not Israelites. The Kenites were most likely a Midianite tribe, descended from Abraham through Keturah, and Moses' marriage into the family of Jethro, the priest of Midian, made for a long friendship between them and Israel. When Judah took its land, “the children of the Kenite, Moses' father in law, went up out of the city of palm trees with the children of Judah” ([[Judg. 1:16]]; see the note there) and lived among them. Here they are counted among Judah's families.

      This verse is the ground for counting the Rechabites, the family whose faithfulness to their father's word Jeremiah set before Judah ([[Jer. 35]]), as a family of the Kenites. The note at [[Jer. 35:2]] holds that link loosely, since it rests on this one verse.
    sources: [bd-kenites, lds-scriptures]

christ: |
  The line of verses 4–15, from Pharez through Hezron, Ram, Amminadab, Nahshon, Salma, Boaz, Obed and Jesse to David, is the line Matthew gives for Jesus Christ: “Judas begat Phares and Zara of Thamar; and Phares begat Esrom; and Esrom begat Aram” ([[Matt. 1:3]]), and so on to “David the king” ([[Matt. 1:6]]). Why Matthew names Tamar is taken up at [[Gen. 38:29]], and Ruth's place in the same line at [[Ruth 4:18]].

  A place in that line was never a substitute for faithfulness: John the Baptist's warning, “We have Abraham to our father” ([[Matt. 3:9]]), rebuked those who tried “to use lineage as a substitute for righteousness.” A disciple's place in the Savior's family comes by covenant: “because of the covenant which ye have made ye shall be called the children of Christ, his sons, and his daughters” ([[Mosiah 5:7]]).

explore: |
