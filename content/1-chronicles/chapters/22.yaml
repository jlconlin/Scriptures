chapter: 22
title: Prepared Abundantly
tagline: David names the threshing floor as the place of the LORD's house, gathers stonecutters, iron, brass and cedar, and charges Solomon to build what he himself may not. Then he commands Israel's princes to help, to seek the LORD, and to build.
when: 'The last years of David''s reign, after the plague was stayed at the threshing floor of Ornan; David prepares “before his death” (verse 5).'

setting: |
  Chapter 21 ended at the threshing floor of Ornan. There the LORD answered David's offering “from heaven by fire” ([[1 Chr. 21:26]]), and David, afraid to go before the tabernacle at Gibeon “because of the sword of the angel of the LORD” ([[1 Chr. 21:30]]), sacrificed where he stood. Chapter 22 opens with David naming that place, and with it the last part of 1 Chronicles begins. Through chapter 29, David spends the last years of his reign on a house he will not build: workers and materials, the charge to Solomon, the courses of priests and Levites, the singers, porters and officers, and the pattern of the house. On one older reading, all of it served “the firm establishment of the public worship of the Lord.”

  In Kings, Solomon tells Hiram that his father's wars kept him from building ([[1 Kgs. 5:3]]), and when the house is finished he brings in “the things which David his father had dedicated” ([[1 Kgs. 7:51]]). David's charge to Solomon in Kings is a deathbed charge to keep the law and settle accounts ([[1 Kgs. 2:1–9]]); Chronicles gives a charge to build, here and again in chapter 28. The book's first readers had a rebuilt temple of their own, and one reading of Chronicles holds that it was written in part “to legitimize their newly rebuilt temple.”

thread: |
  David may not build the house, so he does everything short of building it. He names the place (verse 1), sets foreigners to cut stone and lays in iron, brass and cedar “in abundance” (verses 2–4), and gives his reason: Solomon is “young and tender,” and the house must be “exceeding magnifical” (verse 5). On one older reading the point of it all was to make the work easier for the son who would finish it.

  The charge to Solomon (verses 6–16) explains why the work passes from father to son. The word of the LORD barred the man who had shed blood and promised a son who would be “a man of rest,” whose very name meant peace. David then gives Solomon what he has gathered, and the courage Moses and the LORD gave Joshua, and sends him out: “Arise therefore, and be doing, and the LORD be with thee” (verse 16).

  The last verses (17–19) widen the charge to all the princes of Israel. The rest the LORD promised is already theirs (“hath he not given you rest on every side?”), and David asks two things of them: “set your heart and your soul to seek the LORD your God,” and “arise therefore, and build ye the sanctuary of the LORD God,” so that the ark can come home to the house built for His name (verse 19).

sections:
  - range: 1-1
    heading: The house of the LORD God
    plain: |
      Then David said, “This is the house of the LORD God, and this is the altar of burnt offering for Israel.”
  - range: 2-5
    heading: Stone, iron, brass and cedar
    plain: |
      David ordered the foreigners living in the land of Israel to be gathered, and he set stonecutters to hew dressed stones for building the house of God. He laid in iron in abundance for the nails of the doors of the gates and for the couplings, more brass than could be weighed, and cedar in abundance, because the Sidonians and the people of Tyre brought David great quantities of cedar. David said, “My son Solomon is young and inexperienced, and the house to be built for the LORD must be exceedingly great, famous and glorious in every land. So I will make preparations for it now.” So David prepared abundantly before his death.
  - range: 6-16
    heading: The charge to Solomon
    plain: |
      Then he called for his son Solomon and charged him to build a house for the LORD God of Israel. David said to Solomon, “My son, I had it in my heart to build a house for the name of the LORD my God. But the word of the LORD came to me: ‘You have shed much blood and fought great wars. You shall not build a house for My name, because you have shed so much blood on the earth in My sight. But a son will be born to you who will be a man of rest, and I will give him rest from all his enemies around him. His name will be Solomon, and I will give Israel peace and quiet in his days. He will build a house for My name. He will be My son, and I will be his father, and I will establish the throne of his kingdom over Israel forever.’

      “Now, my son, the LORD be with you. May you succeed in building the house of the LORD your God, as He said you would. Only may the LORD give you wisdom and understanding, and put you in charge of Israel, so that you keep the law of the LORD your God. Then you will prosper, if you are careful to keep the statutes and judgments that the LORD gave Moses for Israel. Be strong and courageous; do not be afraid or dismayed.

      “See, through hardship I have prepared for the house of the LORD a hundred thousand talents of gold and a million talents of silver, and brass and iron beyond weighing, there is so much of it. I have prepared timber and stone as well, and you may add to them. You have workmen in abundance, stonecutters, masons and carpenters, and men skilled in every kind of work. The gold, the silver, the brass and the iron are past counting. So get up and get to work, and the LORD be with you.”
  - range: 17-19
    heading: The princes charged to help
    plain: |
      David also commanded all the leaders of Israel to help his son Solomon. “Is not the LORD your God with you? Has He not given you rest on every side? He has given the people of the land into my hand, and the land is subdued before the LORD and before His people. Now set your heart and your soul to seek the LORD your God. Get up and build the sanctuary of the LORD God, so that the ark of the covenant of the LORD and the holy vessels of God can be brought into the house built for the name of the LORD.”

notes:
  - ref: 1
    phrase: This is the house of the LORD God, and this is the altar of the burnt offering for Israel
    kind: history
    title: The place the LORD had marked
    body: |
      David's words make the threshing floor of Ornan the place of the temple, but the LORD had chosen it first ([[1 Chr. 21:18]]). The temple's exact position “was indicated by an angel of the Lord during the plague and the command received through the prophet Gad to build an altar there.” David built the altar on that command, and the LORD answered by fire. David, who could not go to the altar at Gibeon for fear of the angel's sword ([[1 Chr. 21:29–30]]), now says that this altar is “the altar of the burnt offering for Israel.” When the house went up, Chronicles says Solomon built it “in mount Moriah, where the LORD appeared unto David his father, in the place that David had prepared in the threshingfloor of Ornan the Jebusite” ([[2 Chr. 3:1]]).

      One Latter-day Saint reading takes the census and the threshing floor as the story that explains the temple's location: the place where the LORD was seen and where sacrifice stayed the slaughter, so that “the temple had to be built at this specific site.” The note at [[2 Sam. 24:18]] tells how the floor was bought, and whether the hill is the Moriah of Abraham's offering is a tradition weighed in the note at [[Gen. 22:2]].
    sources: [bd-temple-of-solomon, bowen-mount-lord-provided, lds-scriptures]

  - ref: 2
    phrase: gather together the strangers that were in the land of Israel
    kind: history
    title: Strangers set to hew stone
    body: |
      The cutting of the temple's stone began in David's day, and he gave it to the “strangers,” the foreigners who lived in the land, not to Israel. Chronicles counts them again when the building starts: Solomon “numbered all the strangers that were in the land of Israel, after the numbering wherewith David his father had numbered them,” found 153,600, and set them to carry, to quarry and to oversee ([[2 Chr. 2:17–18]]).

      Kings says who they were: on the Canaanite peoples who remained Solomon laid “a tribute of bondservice,” but “of the children of Israel did Solomon make no bondmen” ([[1 Kgs. 9:21–22]]). What Solomon's labor gangs later cost is the subject of the note at [[1 Kgs. 5:13]].
    sources: [lds-scriptures]

  - ref: 8
    phrase: Thou hast shed blood abundantly, and hast made great wars
    kind: history
    title: Why David could not build
    body: |
      Chronicles gives the reason that the LORD's answer in Samuel leaves unsaid: David had shed much blood. In Samuel the LORD turns David's offer aside with a question and no reason (the note at [[2 Sam. 7:5]]). Here David tells Solomon what the word of the LORD said, and later he repeats it before all Israel's leaders: “Thou shalt not build an house for my name, because thou hast been a man of war, and hast shed blood” ([[1 Chr. 28:3]]). Kings gives the same fact in a simpler form, in Solomon's letter to Hiram: David “could not build an house unto the name of the LORD his God for the wars which were about him on every side” ([[1 Kgs. 5:3]]; the note there sets the two reasons side by side).

      The contrast the LORD draws is between two kinds of men: the man of war who shed blood “in my sight” does not build, and the son who will be “a man of rest” does (verse 9). One Latter-day Saint reading finds in the verse a principle about the Lord himself: “Warfare is fundamentally incongruous with the Lord’s nature and personality.” The same reading notes what war did to David, who as a youth was a man after the Lord's “own heart” and was so hardened by war that he sent Uriah to “the forefront of the hottest battle.” Chronicles does not tell that story (the note at [[1 Chr. 20:1]]), but it keeps the reason the house passed to his son.
    sources: [lds-scriptures, skinner-renounce-war]

  - ref: 9
    phrase: for his name shall be Solomon, and I will give peace and quietness unto Israel in his days
    kind: words
    title: Solomon, the man of rest
    body: |
      The promised son's name carries the promise. In Hebrew he is *Šĕlōmōh*, and the next words are *wĕšālôm*, “and peace”: “his name shall be Solomon, and I will give peace and quietness unto Israel in his days.” The name is glossed “Peaceable.” He is called “a man of rest” because the LORD will “give him rest from all his enemies round about.”

      Kings tells the promise kept. Solomon “had peace on all sides round about him” ([[1 Kgs. 4:24]]), and he told Hiram, “now the LORD my God hath given me rest on every side” ([[1 Kgs. 5:4]]). Kings also tells that when Solomon's “heart was turned from the LORD” ([[1 Kgs. 11:9]]), “the LORD stirred up an adversary unto Solomon” ([[1 Kgs. 11:14]]), and then another ([[1 Kgs. 11:23]]). The other name Nathan gave the child, Jedidiah, is discussed in the note at [[2 Sam. 12:25]]; the promise of verse 10, “he shall be my son, and I will be his father,” is discussed in the note at [[1 Chr. 17:11]].
    sources: [oshb-wlc, bd-solomon, lds-scriptures]

  - ref: 13
    phrase: 'be strong, and of good courage; dread not, nor be dismayed'
    kind: scripture
    title: In the words given to Joshua
    body: |
      David charges Solomon in the words of Joshua's commission, and he attaches the same condition to them. Moses told Joshua, “Be strong and of a good courage” ([[Deut. 31:7]]), and the LORD told him, “Be strong and of a good courage; be not afraid, neither be thou dismayed” ([[Josh. 1:9]]). David's words echo them, and the whole speech is full of echoes of the law.

      In Joshua the courage had a purpose: “that thou mayest observe to do according to all the law, which Moses my servant commanded thee … that thou mayest prosper whithersoever thou goest” ([[Josh. 1:7]]). David's charge has the same shape. Solomon will “prosper” (verses 11, 13) if he takes heed “to fulfil the statutes and judgments which the LORD charged Moses with concerning Israel”; success, on that older reading, depends on “the faithful observing of the commands of the Lord.” David says it again when he gives Solomon the pattern of the house, with a promise: the LORD “will not fail thee, nor forsake thee, until thou hast finished all the work” ([[1 Chr. 28:20]]).
    sources: [keil-chronicles, cambridge-chronicles, lds-scriptures]

  - ref: 14
    phrase: in my trouble I have prepared for the house of the LORD an hundred thousand talents of gold, and a thousand thousand talents of silver
    kind: history
    title: Gold and silver beyond counting
    body: |
      David's sums are enormous, and he says he gathered them “in my trouble.” “Trouble” renders the Hebrew *ʿŏnî*, affliction or poverty, and here the sense is given as “poverty”; the Septuagint reads “according to my poverty.” One older reading takes it instead as “by my painful labour,” and sets beside it David's later words, “I have prepared with all my might” ([[1 Chr. 29:2]]); another reading prefers “in my low estate.”

      The sums are a hundred thousand talents of gold and a million of silver, with brass and iron “without weight.” The wealth David gathered and Solomon spent on the temple was “enormous,” and the figures have been read two ways. One reading sets them beside Solomon's revenue of 666 talents of gold in a year ([[1 Kgs. 10:14]]), at which rate David would have gathered only 26,640 talents in forty years, and judges the numbers round and exaggerated. The other grants that, valued in money, the sum “seems enormously large,” then points to the treasure gathered in ancient capitals and to the gold and silver David dedicated from the spoil of his wars ([[2 Sam. 8:11]]), and concludes that the sums are not “incredible or very much exaggerated.” The note at [[2 Sam. 24:9]] gives one explanation of how such numbers may have changed in copying; the chapter gives its figures as they stand.
    sources: [bdb, lxx-rahlfs, keil-chronicles, cambridge-chronicles, bd-temple-of-solomon]

christ: |
  The son to whom David hands the work carries a promise larger than Solomon: “he shall be my son, and I will be his father; and I will establish the throne of his kingdom over Israel for ever” (verse 10). Hebrews takes the same promise, “I will be to him a Father, and he shall be to me a Son” ([[Heb. 1:5]]), as the Father's word to Christ, the Only Begotten Son, above the angels; the note at [[1 Chr. 28:6]] says how the king was called God's son, and the notes at [[2 Sam. 7:13]] and [[2 Sam. 7:14]] follow that line. David gathered stone, cedar and gold for a house he would not live to see, and handed it on with “the LORD be with thee” (verse 16). A disciple's part in the Lord's work is often, like David's, to prepare what another will finish, and the Lord's word to His Saints is “be not weary in well-doing, for ye are laying the foundation of a great work” ([[D&C 64:33]]).

