chapter: 17
title: The LORD Will Build Thee an House
tagline: David wants to build a house for the ark; through Nathan the LORD answers that David's son will build it, and that He will build David a house and settle that son in His own house and kingdom for ever. David sits before the LORD and asks Him to do as He has said.
when: 'David in his house of cedars at Jerusalem, after the ark was brought into the city of David'

setting: |
  Chapters 15 and 16 brought the ark into Jerusalem and set it “in the midst of the tent that David had pitched for it” ([[1 Chr. 16:1]]). Now David, living in a house of cedars, wants to build the ark a house. Samuel tells the story in the same place, right after the ark's coming, though the two events must have been some years apart. Verses 1–27 retell [[2 Sam. 7:1–29]] closely. The differences are mostly small: smoother wording, or the later word “God” where Samuel has “the LORD.” Where Samuel's LORD asks, “Shalt thou build me an house for me to dwell in?” ([[2 Sam. 7:5]]), Chronicles has Him say plainly, “Thou shalt not build me an house” (verse 4).

  The site's notes on 2 Samuel 7 explain the chapter itself: why David was not to build ([[2 Sam. 7:5]]; Chronicles later gives the reason as the blood David had shed, [[1 Chr. 22:8]]), the double sense of “house” ([[2 Sam. 7:11]]), the son who builds ([[2 Sam. 7:13]]), and David's prayer ([[2 Sam. 7:18]]). The notes here go to what Chronicles changes. One reading of the book holds that it was written for a people asking whether the covenant still stood (see the note on [[1 Chr. 20:1]]), and this is the chapter where the LORD gives David that covenant.

thread: |
  The chapter turns on the word “house.” David sits in his house of cedars and wants to build the LORD one (verse 1). The LORD answers that David will not build Him a house, but “the LORD will build thee an house” (verse 10). That house is a line of descendants, not a building: David's son will build the house of God, and his throne will be established for ever (verses 11–12).

  Chronicles keeps the thread and draws it tighter around the son. In verses 11–14 the promise speaks of a seed “of thy sons,” leaves out the warning of the rod, and ends by setting that son “in mine house and in my kingdom for ever.” David's prayer then takes up the LORD's word and asks that it be kept: “let the thing that thou hast spoken concerning thy servant and concerning his house be established for ever, and do as thou hast said” (verse 23). His last words rest on the LORD's: “for thou blessest, O LORD, and it shall be blessed for ever” (verse 27).

sections:
  - range: 1-2
    heading: David's wish
    plain: |
      When David was living in his house, he said to Nathan the prophet, “Look, I live in a house of cedar, but the ark of the covenant of the LORD stays under tent curtains.” Nathan told David, “Do whatever you have in mind, for God is with you.”
  - range: 3-10
    heading: The LORD's answer
    plain: |
      That same night the word of God came to Nathan: “Go and tell My servant David, ‘This is what the LORD says: You are not the one to build Me a house to live in. I have not lived in a house from the day I brought Israel up until today; I have gone from tent to tent and from one dwelling to another. Wherever I went with all Israel, did I ever say to any of the judges of Israel, whom I commanded to shepherd My people, “Why have you not built Me a house of cedar?”’

      “Now tell My servant David, ‘This is what the LORD of hosts says: I took you from the pasture, from following the sheep, to be ruler over My people Israel. I have been with you wherever you went. I have cut off all your enemies before you, and I have made your name like the names of the great men of the earth. I will provide a place for My people Israel and plant them there, so that they can live in their own place and not be moved again. The wicked will not wear them down anymore, as they did at first and ever since I appointed judges over My people Israel. I will subdue all your enemies. And I tell you that the LORD will build you a house.’”
  - range: 11-15
    heading: A son, and a throne for ever
    plain: |
      “When your days are over and you go to be with your fathers, I will raise up your offspring after you, one of your sons, and I will establish his kingdom. He will build Me a house, and I will establish his throne for ever. I will be his father, and he will be My son. I will not take My mercy away from him as I took it from the one who was before you. I will set him in My house and in My kingdom for ever, and his throne will be established for ever.”

      Nathan told David all these words and all this vision.
  - range: 16-22
    heading: Who am I?
    plain: |
      Then King David went in and sat before the LORD and said, “Who am I, LORD God, and what is my family, that You have brought me this far? And as if this were a small thing in Your eyes, O God, You have also spoken about Your servant's house far into the future, and You have looked on me as on a man of high rank, LORD God. What more can David say to You about the honor You have done Your servant? You know Your servant. LORD, for Your servant's sake and according to Your own heart, You have done this great thing and made all these great things known.

      “LORD, there is no one like You, and there is no God besides You, by all we have heard with our ears. And what other nation on earth is like Your people Israel, whom God went to redeem as His own people, to make a name for Yourself by great and awesome deeds, driving out nations before Your people whom You redeemed from Egypt? You made Your people Israel Your own people for ever, and You, LORD, became their God.”
  - range: 23-27
    heading: Do as thou hast said
    plain: |
      “And now, LORD, let the word You have spoken about Your servant and his house be established for ever, and do as You have said. Let it be established, so that Your name will be great for ever, and people will say, ‘The LORD of hosts is the God of Israel, a God to Israel,’ and let the house of Your servant David be established before You. For You, my God, have revealed to Your servant that You will build him a house; that is why Your servant has found the courage to pray before You. And now, LORD, You are God, and You have promised this good thing to Your servant. So may it please You to bless the house of Your servant, that it may continue before You for ever; for when You bless, LORD, it is blessed for ever.”

notes:
  - ref: 1
    phrase: as David sat in his house
    kind: history
    title: No rest yet
    body: |
      Chronicles leaves out the rest that Samuel gives David here. Samuel dates David's wish to the time “when the king sat in his house, and the LORD had given him rest round about from all his enemies” ([[2 Sam. 7:1]]), and in the LORD's answer says that He “caused thee to rest from all thine enemies” ([[2 Sam. 7:11]]). Chronicles keeps the house and drops the rest in both places; where Samuel's answer has the rest, verse 10 here has “Moreover I will subdue all thine enemies.”

      The next chapter begins, “Now after this it came to pass, that David smote the Philistines, and subdued them” ([[1 Chr. 18:1]]), and chapters 18–20 tell his wars with the Philistines, the Syrians and the Ammonites. Chronicles gives no reason for the change. The wars probably explain it: the words of rest were left out because the wars are told next, and, read in order, the clause would have seemed to contradict the chapters after it. The note at [[2 Sam. 7:2]] explains why rest and a house for the LORD went together in the law.
    sources: [lds-scriptures, cambridge-chronicles, keil-chronicles]

  - ref: 11
    phrase: which shall be of thy sons
    kind: scripture
    title: What Chronicles changes in the promise
    body: |
      Chronicles gives the LORD's promise in nearly Samuel's words, but changes it in three places in verses 11–14. First, the seed Samuel calls the one “which shall proceed out of thy bowels” ([[2 Sam. 7:12]]) is here the one “which shall be of thy sons.” Second, after “he shall be my son” (verse 13) Chronicles has nothing of Samuel's warning, “If he commit iniquity, I will chasten him with the rod of men” ([[2 Sam. 7:14]]), and Saul, “whom I put away before thee” ([[2 Sam. 7:15]]), is only “him that was before thee.” Third, where Samuel promises David, “thine house and thy kingdom shall be established for ever before thee” ([[2 Sam. 7:16]]), Chronicles says of the son, “I will settle him in mine house and in my kingdom for ever” (verse 14). The house and the kingdom in which the son is settled are called the LORD's, not David's.

      Chronicles does not say why it words the promise this way, and it names the son as Solomon. David tells him that the word of the LORD said, “his name shall be Solomon … He shall build an house for my name; and he shall be my son, and I will be his father” ([[1 Chr. 22:9–10]]). When David repeats the promise before Israel's leaders, a condition comes with it: “I will establish his kingdom for ever, if he be constant to do my commandments and my judgments” ([[1 Chr. 28:7]]). The site's notes on 2 Samuel 7 explain how the promise was kept in Solomon and how it reaches past him to Christ ([[2 Sam. 7:13]], [[2 Sam. 7:14]], [[2 Sam. 7:16]]).
    sources: [lds-scriptures]

  - ref: 17
    phrase: according to the estate of a man of high degree
    kind: words
    title: A man of high degree
    body: |
      No one knows for certain what the Hebrew behind “a man of high degree” means. The clause is *kĕtôr hāʾādām hammaʿălāh*, and its last word, *maʿălāh*, elsewhere means a step or stair or a going up. The phrase is probably corrupt. Samuel's parallel, “And is this the manner of man, O Lord GOD?” ([[2 Sam. 7:19]]), is just as uncertain; the note there sets out how modern translations read it. Both verses agree on what comes just before: the LORD has spoken of David's house “for a great while to come.”
    sources: [oshb-wlc, bdb, lds-scriptures]

christ: |
  Hebrews quotes the words of verse 13, “I will be to him a Father, and he shall be to me a Son” ([[Heb. 1:5]]), of Jesus Christ (the note at [[2 Sam. 7:14]]), and Gabriel promised Mary that “the Lord God shall give unto him the throne of his father David” and that “of his kingdom there shall be no end” ([[Luke 1:32–33]]). The kings of David's line failed, but Christ is the King everyone can trust to be what kings were always meant to be. The word for the mercy the LORD would not take from David's son (verse 13), *ḥesed*, is the word Isaiah uses when he offers “every one that thirsteth” an everlasting covenant, “even the sure mercies of David” ([[Isa. 55:1–3]]), and Paul taught that God gave those mercies in raising Jesus from the dead ([[Acts 13:34]]). The covenant love the LORD promised David's son is offered, through the risen Christ, to every disciple who comes to Him.

explore: |
  - **The same chapter in Samuel.** [[2 Sam. 7:1–29]].
  - **The promise repeated to Solomon.** [[1 Chr. 22:6–10]]; [[1 Chr. 28:2–7]].
  - **The promise in the Psalms.** [[Ps. 89:19–37]]; [[Ps. 132:11–12]].
  - **Fulfilled in Christ.** [[Luke 1:30–33]]; [[Heb. 1:5]].

