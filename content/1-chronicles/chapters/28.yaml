chapter: 28
title: Be Strong, and Do It
tagline: Before all Israel's leaders David tells why he did not build the LORD's house and why Solomon will, charges his son to serve the LORD with a perfect heart and a willing mind, and hands him the pattern of the house, which he says the LORD made him understand in writing.
when: 'The end of David’s reign, when he was old and had made Solomon king ([[1 Chr. 23:1]]): an assembly of Israel’s leaders at Jerusalem.'

setting: |
  The Church's footnotes to this chapter point to no parallel in Samuel or Kings. Chapter 23 opened with David, old and full of days, making Solomon king, and chapters 23–27 set in order the priests, Levites, singers, porters, captains and officers. The assembly of verse 1 is made of those men; the footnotes send its princes of the tribes, captains of the courses and stewards of the king's possessions back to their lists in chapter 27.

  What David says here before them all he had said in substance to Solomon alone in [[1 Chr. 22:7–16]], and the notes there explain why David could not build, the son who would be “a man of rest,” and the charge in the words given to Joshua. The same assembly goes on in chapter 29 with the people's free offerings, David's prayer, and Solomon made king “the second time” ([[1 Chr. 29:22]]).

  Two times are in play. The speech is set at the end of David's life; the book was written for a people back from the exile, and one Latter-day Saint reading of its purpose is that the Chronicler wrote “to give hope, to create an identity based on worship and the ideals of the kingdom, and to legitimize their newly rebuilt temple.”

thread: |
  The chapter is a handing over, and at each step David says that what he hands over is not his own. He meant to build, and God said no (verses 2–3). The kingdom is not his to bequeath: the LORD chose Judah, then Jesse's house, then David, then Solomon out of many sons, to sit on “the throne of the kingdom of the LORD” (verses 4–5). Even the plan of the house came from elsewhere: “All this, said David, the LORD made me understand in writing by his hand upon me” (verse 19). What is left to the people and to Solomon is the response: “keep and seek for all the commandments of the LORD your God” (verse 8), “serve him with a perfect heart and with a willing mind” (verse 9), and “be strong, and do it” (verse 10).

  The condition of the promise, “if he be constant” (verse 7), and the charge to the builder, “be strong, and do it” (verses 10, 20), are one Hebrew word (the note at verse 7). The chapter closes on what will make the work possible: the LORD, who “will not fail thee, nor forsake thee, until thou hast finished all the work,” the courses of priests and Levites, every willing skilful man, and a people “wholly at thy commandment” (verses 20–21).

sections:
  - range: 1-1
    heading: The leaders gathered
    plain: |
      David assembled at Jerusalem all the leaders of Israel: the princes of the tribes, the captains of the divisions that served the king in turn, the commanders of thousands and of hundreds, the stewards over all the property and possessions of the king and his sons, with the officials, the mighty men and all the valiant warriors.
  - range: 2-7
    heading: The LORD chose Solomon
    plain: |
      King David rose to his feet and said, “Hear me, my brothers and my people. I had it in my heart to build a house of rest for the ark of the covenant of the LORD and for the footstool of our God, and I had made preparations to build. But God said to me, ‘You shall not build a house for My name, because you have been a man of war and have shed blood.’ Yet the LORD God of Israel chose me out of all my father's house to be king over Israel for ever. He chose Judah to be the ruler, and in Judah my father's house, and among my father's sons He was pleased to make me king over all Israel. And of all my sons (for the LORD has given me many) He has chosen Solomon my son to sit on the throne of the LORD's kingdom over Israel. He said to me, ‘Solomon your son shall build My house and My courts, for I have chosen him to be My son, and I will be his father. I will establish his kingdom for ever, if he holds firm in keeping My commandments and My judgments, as he does today.’”
  - range: 8-10
    heading: Seek the LORD, and build
    plain: |
      “Now, in the sight of all Israel, the LORD's congregation, and in the hearing of our God: keep and seek out all the commandments of the LORD your God, so that you may possess this good land and leave it as an inheritance to your children after you for ever. And you, Solomon my son, know the God of your father, and serve Him with a whole heart and a willing soul, for the LORD searches every heart and understands every purpose of the thoughts. If you seek Him, He will be found by you; but if you forsake Him, He will cast you off for ever. Take heed now, for the LORD has chosen you to build a house for the sanctuary. Be strong, and do it.”
  - range: 11-19
    heading: The pattern of the house
    plain: |
      Then David gave Solomon his son the plan of the porch and its buildings, its treasuries, its upper rooms, its inner rooms, and the room of the mercy seat; and the plan of all that he had by the spirit for the courts of the LORD's house and all the rooms around them, the treasuries of God's house and the treasuries for dedicated gifts. He gave him the plan for the divisions of the priests and Levites, for all the work of service in the LORD's house, and for all its vessels. He set the weight of gold for every gold vessel and of silver for every silver vessel; the weight for the gold lampstands and their lamps and for the silver lampstands and theirs, according to the use of each; gold by weight for each table of showbread and silver for the silver tables; pure gold for the forks, bowls and cups, and gold and silver by weight for each basin; refined gold by weight for the altar of incense; and gold for the plan of the chariot, the cherubim that spread their wings and cover the ark of the covenant of the LORD. “All this,” David said, “the LORD made me understand in writing by His hand upon me, all the works of this pattern.”
  - range: 20-21
    heading: He will not fail thee
    plain: |
      David said to Solomon his son, “Be strong and of good courage, and do it. Do not be afraid or dismayed, for the LORD God, my God, is with you. He will not fail you or forsake you until you have finished all the work for the service of the LORD's house. Here are the divisions of the priests and Levites for all the service of God's house; with you in all the work will be every willing man skilled in any kind of service; and the leaders and all the people will be wholly at your command.”

notes:
  - ref: 3
    phrase: because thou hast been a man of war, and hast shed blood
    kind: prophets
    title: Not only the gift, but the giver
    body: |
      The LORD's refusal of David's offer has been read in the Restoration as a principle about every offering made to God: it is measured by the one who gives it as well as by the gift. Why David's wars kept him from building is the note at [[1 Chr. 22:8]], where David first told Solomon the reason; here he repeats it before all Israel's leaders, with the words of his own heart that came before it: “I had in mine heart to build an house of rest for the ark” (verse 2). David had the desire and had made ready, and still the LORD said no.

      Elder James E. Talmage drew the lesson from these two verses: in declining David's offer the LORD made plain “that to be acceptable unto Him it was not enough that the gift be appropriate, but that the giver must also be worthy.” He gave a further reason: David, “though in many respects a man after God's own heart, had sinned; and his sin had not yet found atonement.” That is his reading of the reason; the verse itself names the bloodshed of war. A later Latter-day Saint study of Old Testament temples quotes the same principle at this verse and sets beside it the LORD's assurance that Solomon would build (verse 6).
    sources: [talmage-house-of-the-lord, cowan-ot-temples, lds-scriptures]

  - ref: 5
    phrase: to sit upon the throne of the kingdom of the LORD over Israel
    kind: history
    title: Whose throne it is
    body: |
      David calls the throne Solomon will sit on “the throne of the kingdom of the LORD”: the king of Israel reigns on a throne that belongs to the LORD. Chronicles says the same in two other places. Where Samuel has the LORD promise David “thine house and thy kingdom shall be established for ever” ([[2 Sam. 7:16]]), Chronicles has “I will settle him in mine house and in my kingdom for ever” ([[1 Chr. 17:14]]; the note at [[1 Chr. 17:11]]); and when Solomon is crowned in the next chapter, “Solomon sat on the throne of the LORD as king instead of David his father” ([[1 Chr. 29:23]]).

      Verse 4 builds the same point by a chain of the LORD's choices, Judah (“of him came the chief ruler,” [[1 Chr. 5:2]]), then Jesse's house, then David, so that David never presents his son as simply his heir: the LORD “hath chosen Solomon.”
    sources: [lds-scriptures]

  - ref: 6
    phrase: for I have chosen him to be my son, and I will be his father
    kind: christ
    title: The king as God's son
    body: |
      David repeats the LORD's promise in the form that joins Israel's king to God as a son to his father, a form the New Testament carries to Jesus Christ. The words are those of the promise through Nathan, “I will be his father, and he shall be my son” ([[1 Chr. 17:13]]), and here they come with the LORD's choosing: “I have chosen him to be my son.” In the Old Testament such words describe the special relationship between God and the king, so that “son of God” could be heard as a title for the king, and to declare someone God's son was one way of declaring him king. Psalm 2 says it of the LORD's anointed, “Thou art my Son” ([[Ps. 2:7]]), and Hebrews sets that line and Nathan's promise side by side as words spoken to Christ and to no angel ([[Heb. 1:5]]).

      Read that way, the voice at Jesus' baptism could declare two things: that He is the literal Only Begotten Son of God in the flesh, and that He is the true King of Israel. The promise to Solomon came with a condition (verse 7), and Kings tells how Solomon failed it. The kings of Israel and Judah “ultimately failed to do everything they were supposed to do,” and the Son who is also the King does not fail.
    sources: [sc-knowhy-865, lds-scriptures]

  - ref: 7
    phrase: if he be constant to do my commandments and my judgments
    kind: scripture
    title: The condition on the promise
    body: |
      David names a condition that the promise of chapter 17 did not state, and Kings records the LORD saying it to Solomon himself, twice. In chapter 17 the promise to David's son has no “if”; Chronicles there leaves out even Samuel's warning of the rod (the note at [[1 Chr. 17:11]]). Here the LORD will establish the kingdom for ever “if he be constant.” The Hebrew behind “be constant” is *ḥāzaq*, “be strong,” the verb David uses when he tells Solomon “be strong, and do it” (verse 10) and “Be strong and of good courage” (verse 20).

      Kings gives the condition in the LORD's own words. While the house was being built, the word of the LORD came to Solomon, “if thou wilt walk in my statutes … then will I perform my word with thee, which I spake unto David thy father” ([[1 Kgs. 6:12]]). After the dedication it came again: “if thou wilt walk before me, as David thy father walked … Then I will establish the throne of thy kingdom upon Israel for ever” ([[1 Kgs. 9:4–5]]). Kings also tells how it ended. When Solomon was old his heart turned, and the LORD said, “Forasmuch as this is done of thee, and thou hast not kept my covenant and my statutes … I will surely rend the kingdom from thee” ([[1 Kgs. 11:11]]). Elder Talmage measured the temple's decline by the rule he drew from verse 3, that the giver must be worthy: when Solomon was led astray, “The gift became depreciated by the perfidy of the giver, and Jehovah withdrew His protecting presence from the place no longer holy.”
    sources: [oshb-wlc, cowan-ot-temples, lds-scriptures, talmage-house-of-the-lord]

  - ref: 9
    phrase: serve him with a perfect heart and with a willing mind
    kind: words
    title: A whole heart and a willing soul
    body: |
      “Perfect” here means whole, not flawless. The Hebrew is *lēḇ šālēm*, and *šālēm* is the adjective for what is complete: a full weight, an uncut stone. Joined to “heart,” as in this verse, it describes a mind at peace with the LORD and keeping covenant relation with Him. A modern translation renders the pair “with single mind and willing heart.” “Willing mind” is *nep̄eš ḥăpēṣâ*, a soul that delights in what it does, a “willing soul.” David asks for undivided loyalty given gladly.

      The words come back in the next chapter. When the people bring their gifts for the house, “with perfect heart they offered willingly to the LORD” ([[1 Chr. 29:9]]), and David prays, “give unto Solomon my son a perfect heart” ([[1 Chr. 29:19]]). Kings uses the same measure for Solomon's end: when he was old, “his heart was not perfect with the LORD his God” ([[1 Kgs. 11:4]]; the note there gives the Joseph Smith Translation of that verse). What David asks for is what Kings says Solomon at last did not have.
    sources: [oshb-wlc, bdb, nrsvue, lds-scriptures]

  - ref: 12
    phrase: the pattern of all that he had by the spirit
    kind: words
    title: By the spirit, in writing
    body: |
      The King James “by the spirit” is one of two ways to read the Hebrew, and verse 19 says where the pattern came from on either reading. The Hebrew speaks of the pattern of all that was *bārûaḥ ʿimmô*, “in the spirit with him.” Read as the King James reads it, these are things that had come to David by revelation and rested with him until they could be carried out; on that reading the other rendering, “in his spirit,” is less likely. Read the other way, they are what David's own spirit had designed, and a modern translation has “all that he had in mind.”

      Verse 19 settles where the design began: “the LORD made me understand in writing by his hand upon me.” Even the reading that takes verse 12 as David's own design hears in verse 19 the phrase used when “the hand of the LORD” came upon a prophet ([[2 Kgs. 3:15]]; [[Ezek. 1:3]]), and so reads it as a writing given by divine revelation: David “had not himself invented the pattern which he had committed to writings,” but had drawn it up under inspiration. The reading that follows the King James holds that the writing “probably means not a book, but a plan or series of patterns shewn to him in a vision,” and compares the pattern Moses was shown for the tabernacle ([[Ex. 25:9]]). The two readings differ on how the pattern reached David, and agree that it came from the LORD.
    sources: [oshb-wlc, cambridge-chronicles, keil-chronicles, nrsvue]

  - ref: 18
    phrase: the pattern of the chariot of the cherubims
    kind: symbol
    title: The chariot of the cherubims
    body: |
      Why the golden cherubim over the ark are called a chariot the verse does not say; one older reading takes the word from scripture's picture of the LORD enthroned on the cherubim and riding upon them. The figures are those of the tabernacle, two cherubim of gold whose wings covered the mercy seat ([[Ex. 25:18–20]]), and there the LORD promised, “I will commune with thee from above the mercy seat, from between the two cherubims” ([[Ex. 25:22]]). A psalm says, “The LORD reigneth … he sitteth between the cherubims” ([[Ps. 99:1]]), and another, “he rode upon a cherub, and did fly” ([[Ps. 18:10]]).

      On that reading, “chariot” and “cherubims” here name one thing, “the chariot, even the cherubim,” as a revised translation of the King James has it: the cherubim, not the ark, are the chariot on which God is enthroned, and the image comes from the psalm of the LORD riding on a cherub, not from the two carved figures over the ark, in which nothing suggests a chariot. The ancient Greek and Latin translations made the phrase a “cherubim-chariot.” Ezekiel's cherubim, which bear the glory away from the temple, are the note at [[Ezek. 10:20]].
    sources: [keil-chronicles, cambridge-chronicles, lds-scriptures]

  - ref: 19
    phrase: even all the works of this pattern
    kind: scripture
    title: Temples built to a revealed pattern
    body: |
      David's plan stands in a line of houses whose design the LORD revealed, from the tabernacle to the temples of the Restoration. “In all ages the Savior has revealed the patterns according to which his sacred houses were to be built.” Moses was told to make the tabernacle “after the pattern” ([[Ex. 25:9]]) “which was shewed thee in the mount” ([[Ex. 25:40]]; the note at [[Ex. 25:9]] gives what Hebrews makes of it), and the note at [[1 Kgs. 6:2]] gives the teaching that the plan of Solomon's house was revealed and the exactness with which Kings records it.

      The Restoration repeats the pattern. In 1833 the Lord said that the house at Kirtland should be built “after the manner which I shall show unto three of you” ([[D&C 95:14]]); when Joseph Smith and his counselors in the First Presidency knelt in prayer, the building appeared to them in vision, and one of them later testified that the finished hall matched the vision in every detail. At Nauvoo the Prophet insisted to the architect, “I have seen in vision the splendid appearance of that building illuminated, and will have it built according to the pattern shown me.” David's “all the works of this pattern,” made known by the LORD's hand, stands in that line.
    sources: [cowan-ot-temples, lds-scriptures]

christ: |
  The chapter points to Jesus Christ through its Son-king. Solomon was chosen “to be my son,” and the promise that his kingdom would be established came with a condition (verses 6–7) that Kings says he did not keep; the same royal words, heard at Jesus' baptism, name Him the Son of God and the King (the note at verse 6), and unlike earthly rulers who fail, He can be trusted to be what kings were always meant to be. The charge David gave beside it, “serve him with a perfect heart and with a willing mind: for the LORD searcheth all hearts” (verse 9), is still the measure of a disciple's service, for “the Lord requireth the heart and a willing mind” ([[D&C 64:34]]).

explore: |
