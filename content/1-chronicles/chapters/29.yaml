chapter: 29
title: Of Thine Own Have We Given Thee
tagline: David gives his own treasure for the house of God, and the leaders of Israel give willingly after him. David blesses the LORD, who owns all they gave; the people make Solomon king the second time, and the story of David's reign ends with its length and the books of the prophets who recorded it.
when: 'The last days of David''s reign, at the assembly in Jerusalem begun in chapter 28; David reigned forty years, seven in Hebron and thirty-three in Jerusalem (verse 27).'

setting: |
  Chapter 29 finishes the assembly that David called at Jerusalem in chapter 28, where the princes of the tribes, the captains and the king's stewards heard him give Solomon the charge and the pattern of the house ([[1 Chr. 28:1]]). Now David turns from his son to the assembly: he lays out what he has given and asks who else will give. The offering, David's blessing of the LORD, the feast and the second anointing of Solomon (verses 1–22) are found only in Chronicles. The close of the chapter (verses 23–30) covers the ground of [[1 Kgs. 1:1–2:12]], but differently. Kings tells of Adonijah's bid for the throne, Zadok's anointing of Solomon, and David's last charge to his son, which includes what Solomon is to do with Joab. Chronicles has none of that. Its David leaves the stage praying for his son and his people, and dies “in a good old age.”

  Here 1 Chronicles ends, though it is only half a book: the Hebrew canon counts 1 and 2 Chronicles as one, and the story goes straight on with Solomon “strengthened in his kingdom” ([[2 Chr. 1:1]]). Two times are in view. The events are David's last days. The writing came much later, most likely after the exile, possibly in the fourth century BC, and one word in verse 7 belongs to that later time (the note there).

thread: |
  The chapter turns on one verb and one prayer. The verb is “offer willingly”: David asks “who then is willing” (verse 5), the leaders “offered willingly” (verse 6), the people rejoiced “for that they offered willingly, because with perfect heart they offered willingly to the LORD” (verse 9), and David says it twice more in his prayer (verses 14 and 17). The prayer explains why the manner of giving matters: “all that is in the heaven and in the earth is thine” (verse 11), and so “of thine own have we given thee” (verse 14). The gold was the LORD's before anyone brought it, and what the givers brought of their own was their willingness.

  The same reckoning carries into the change of king. The house is “not for man, but for the LORD God” (verse 1), and the throne Solomon takes is “the throne of the LORD” (verse 23). Then David's reign is summed up, and its records are left with the prophets who stood beside him.

sections:
  - range: 1-5
    heading: What David gave
    plain: |
      Then King David said to the whole assembly: “My son Solomon, the one God has chosen, is still young and inexperienced, and the work is great, because this palace is not for a man but for the LORD God. With all my strength I have prepared for the house of my God: gold for the things of gold, silver for the things of silver, bronze for bronze, iron for iron, and wood for wood; onyx and stones for setting, glittering stones of many colors, every kind of precious stone, and marble in abundance. And besides all that I have prepared for the holy house, because my heart is set on the house of my God, I have given from my own treasure of gold and silver: three thousand talents of gold, gold of Ophir, and seven thousand talents of refined silver, to overlay the walls of the buildings, gold for the things of gold and silver for the things of silver, and for all the work the craftsmen will do. Now who will come forward willingly today and fill his hand for the LORD?”
  - range: 6-9
    heading: The leaders give willingly
    plain: |
      Then the heads of the fathers' houses, the princes of the tribes of Israel, the captains of thousands and of hundreds, and the officers over the king's work gave willingly. For the service of the house of God they gave five thousand talents of gold and ten thousand drams, ten thousand talents of silver, eighteen thousand talents of bronze, and a hundred thousand talents of iron. Whoever had precious stones gave them to the treasury of the house of the LORD, in the care of Jehiel the Gershonite. The people rejoiced because they had given willingly, for they had given to the LORD with a whole heart, and King David also rejoiced greatly.
  - range: 10-19
    heading: David blesses the LORD
    plain: |
      So David blessed the LORD before the whole assembly: “Blessed are You, LORD, God of Israel our father, for ever and ever. Yours, LORD, are the greatness and the power, the glory, the victory and the majesty, for everything in heaven and on earth is Yours. Yours is the kingdom, LORD, and You are exalted as head over all. Riches and honor come from You, and You rule over all. In Your hand are power and might, and it is in Your hand to make anyone great and strong. Now, our God, we thank You and praise Your glorious name.

      “But who am I, and who are my people, that we should be able to give so willingly? Everything comes from You, and we have given You only what came from Your hand. We are strangers and sojourners before You, as all our fathers were; our days on earth are like a shadow, and nothing stays. LORD our God, all this abundance that we have prepared to build You a house for Your holy name comes from Your hand and is all Your own. I know, my God, that You test the heart and delight in uprightness. In the uprightness of my heart I have given all these things willingly, and now I have seen with joy Your people here giving willingly to You. LORD, God of Abraham, Isaac and Israel, our fathers, keep this purpose for ever in the thoughts of Your people's hearts, and turn their hearts to You. Give my son Solomon a whole heart to keep Your commandments, Your testimonies and Your statutes, to do all these things, and to build the palace for which I have made provision.”
  - range: 20-25
    heading: Solomon king the second time
    plain: |
      Then David said to the whole assembly, “Now bless the LORD your God.” And the whole assembly blessed the LORD, the God of their fathers; they bowed their heads and prostrated themselves before the LORD and before the king. The next day they offered sacrifices and burnt offerings to the LORD, a thousand bulls, a thousand rams and a thousand lambs, with their drink offerings and sacrifices in abundance for all Israel. They ate and drank before the LORD that day with great gladness. They made Solomon the son of David king a second time and anointed him for the LORD as ruler, and Zadok as priest. So Solomon sat on the throne of the LORD as king in place of his father David, and he prospered, and all Israel obeyed him. All the princes, the mighty men, and all King David's other sons submitted to King Solomon. The LORD made Solomon exceedingly great in the sight of all Israel and gave him royal majesty such as no king in Israel had had before him.
  - range: 26-30
    heading: The end of David's reign
    plain: |
      So David the son of Jesse reigned over all Israel. He reigned over Israel forty years: seven years in Hebron and thirty-three years in Jerusalem. He died at a good old age, full of days, riches and honor, and his son Solomon reigned in his place. The acts of King David, from first to last, are written in the records of Samuel the seer, of Nathan the prophet and of Gad the seer, with all his reign and his might, and the events that passed over him, over Israel, and over all the kingdoms of the lands.

notes:
  - ref: 1
    phrase: the palace is not for man, but for the LORD God
    kind: symbol
    title: A palace for the LORD
    body: |
      David calls the temple a palace, a word for a castle or a fortress rather than a house of worship. It is *bîrâ*. Elsewhere it names the fortress beside the temple in Nehemiah's day ([[Neh. 2:8]]) and, most often, the citadel of Shushan in Nehemiah, Esther and Daniel, “Shushan the palace” ([[Esth. 1:2]]). Only here and in verse 19 is it used of the temple.

      The word fits the sentence David puts it in. Having given the temple so grand a name, David says at once whose house this is: “not for man, but for the LORD God.” That, David says, is why the work is great. The chapter ends the same way, with Solomon sitting on “the throne of the LORD” (verse 23; the note at verse 22).
    sources: [bdb, oshb-wlc]

  - ref: 5
    phrase: who then is willing to consecrate his service this day unto the LORD
    kind: words
    title: To fill his hand
    body: |
      David's question borrows the words the law uses for installing a priest. “Consecrate his service” renders a Hebrew idiom, literally *to fill his hand* for the LORD, and that idiom is how the law speaks of a priest's consecration. When Aaron and his sons are set apart, the King James has “anoint them, and consecrate them, and sanctify them, that they may minister unto me in the priest's office” ([[Ex. 28:41]]). There “consecrate” is the same *fill the hand* that stands in this verse. “Is willing” is a verb for volunteering, giving of one's own accord.

      So David's appeal for gold is put in the words of consecration. The same words come back when Hezekiah restores the temple and tells the whole congregation, “Now ye have consecrated yourselves unto the LORD, come near and bring sacrifices” ([[2 Chr. 29:31]]). Verse 6 gives the answer to David's question: the leaders “offered willingly.”
    sources: [oshb-wlc, bdb, lds-scriptures]

  - ref: 7
    phrase: ten thousand drams
    kind: history
    title: Darics in David's day
    body: |
      The coin named in verse 7 belongs to a later age than David's. “Drams” renders *ʾădarkōnîm*, a rare and late word for a unit of value that turns up otherwise only in Ezra and Nehemiah, in the gifts and treasures of the returned exiles ([[Ezra 2:69]]; [[Ezra 8:27]]). The word may name the Greek drachma or the Persian daric. The daric, a Persian gold coin, is the likelier, and the Syriac translation of Ezra renders the word with the coin's name. (The King James “drams,” that is drachmas, may still be right.)

      Either way the word belongs to the writer's world, not David's. Chronicles was most likely written after the exile, and the writer probably named the gold coin current in his own time to make the gift intelligible to his readers, “without intending to assume that there were darics in use in the time of David.” The two figures for gold are then probably different gifts: five thousand talents of gold by weight, and ten thousand darics given as coin. On the size of such sums, see the note at [[1 Chr. 22:14]].
    sources: [bdb, keil-chronicles, cambridge-chronicles, scripture-helps-2-chronicles]

  - ref: 14
    phrase: for all things come of thee, and of thine own have we given thee
    kind: words
    title: Out of thine hand
    body: |
      David's prayer turns the offering around: the gifts were the LORD's before they were given. “Of thine own” is in Hebrew *and from thy hand*, and verse 16 says it again, of the whole store prepared for the house: it “cometh of thine hand, and is all thine own.” Verses 11–12 have already given the ground: everything in heaven and earth is the LORD's, and riches and honor come from Him. David's question, “who am I, and what is my people,” asks how they could give at all, and verse 14 answers it: they gave what had come from His hand.

      What the chapter praises in the gift is the manner of giving. The verb behind “offer willingly,” which runs through the chapter (verses 5, 6, 9, 14, 17), means to volunteer, to give of one's own accord; and the note at [[Ex. 35:5]] traces it back to the offering for the tabernacle. Verse 15 gives the other reason David is humble: “we are strangers before thee, and sojourners, as were all our fathers: our days on the earth are as a shadow,” the pair of words Abraham used of himself at Hebron (the note at [[Gen. 23:4]]). And the giving brought joy. The people rejoiced, David “rejoiced with great joy” (verse 9), and he says he has “seen with joy” his people give (verse 17). David's joy at his people's willingness to help build God's house stands among the scriptures' witnesses that the temple and joy belong together.
    sources: [oshb-wlc, bdb, sc-knowhy-372, lds-scriptures]

  - ref: 20
    phrase: worshipped the LORD, and the king
    kind: history
    title: Bowing before the LORD and the king
    body: |
      One verb serves for both the LORD and the king because it means to bow down. “Worshipped” renders the Hebrew verb for bowing down, prostrating oneself, and the same verb covers homage paid to a king or a superior and worship paid to God. Bath-sheba “did reverence to the king” with it ([[1 Kgs. 1:31]]), and Ruth with it bowed before Boaz ([[Ruth 2:10]]). So the people blessed the LORD at David's word, “bowed down their heads,” and then prostrated themselves, one act of reverence before the LORD and before His king.
    sources: [oshb-wlc, bdb]

  - ref: 22
    phrase: they made Solomon the son of David king the second time
    kind: history
    title: King the second time
    body: |
      “The second time” looks back to the first, which Chronicles gave in one line: David, “old and full of days,” made Solomon king ([[1 Chr. 23:1]]; the note there says what is left out). That first making is the anointing told in [[1 Kgs. 1:32–40]], where Solomon was anointed in haste to secure the throne against his brother Adonijah. Here the anointing is done again, before the whole assembly and in a feast, and “unto the LORD,” probably meaning by His will, since the LORD had chosen Solomon ([[1 Chr. 28:4–5]]).

      Zadok is anointed with him “to be priest.” He had served alongside Abiathar, and when Adonijah rebelled, Abiathar joined him, and Zadok, who stayed faithful to David and anointed Solomon, was put in Abiathar's place ([[1 Kgs. 2:35]]; the note at [[1 Chr. 24:3]] tells of the two priests). This chapter tells none of that and simply names Zadok.

      Then Solomon “sat on the throne of the LORD” (verse 23), where Kings says, “Then sat Solomon upon the throne of David his father” ([[1 Kgs. 2:12]]). Chronicles calls the throne the LORD's, as David did in the assembly (the note at [[1 Chr. 28:5]] gathers the places where it does). On one reading, the wording shows that the Chronicler regards the king as the LORD's deputy.
    sources: [keil-chronicles, cambridge-chronicles, bd-zadok, lds-scriptures]

  - ref: 29
    phrase: they are written in the book of Samuel the seer, and in the book of Nathan the prophet, and in the book of Gad the seer
    kind: history
    title: The books of Samuel, Nathan and Gad
    body: |
      Chronicles closes David's reign by naming its sources, the records of three prophets whose lives crossed his. Samuel anointed him ([[1 Sam. 16:13]]), Nathan brought him the LORD's covenant and rebuked his sin ([[1 Chr. 17:1–15]]; [[2 Sam. 12:1–14]]), and Gad was “David's seer” ([[1 Chr. 21:9]]). None of their books is in the Bible as we have it: all three are among the lost books, works the Bible names in a way that shows they were “considered authentic and valuable” but that are “not found in the Bible today.” The Chronicler's material was the record kept by writers “living amid the events described, and generally of the prophetic order,” together with Samuel and Kings.

      The three titles are three different Hebrew words. Samuel is the *rōʾeh*, Nathan the *nāḇîʾ*, Gad the *ḥōzeh*; the first and last are both rendered “seer,” and the note at [[1 Sam. 9:9]] explains how the old word gave way to the new. Gad has his own note at [[1 Sam. 22:5]], and the note at [[1 Kgs. 14:19]] treats the books that Kings cites in the same way.
    sources: [bd-lost-books, bd-chronicles, oshb-wlc, lds-scriptures]

christ: |
  David's blessing ascribes everything to the LORD: “thine is the kingdom, O LORD, and thou art exalted as head above all” (verse 11). The Church's footnote sets beside these words the close of the prayer the Savior taught, “For thine is the kingdom, and the power, and the glory, for ever” ([[Matt. 6:13]]). Beside verse 12 it sets King Benjamin, who asked his people, “can ye say aught of yourselves? I answer you, Nay” ([[Mosiah 2:25]]). A disciple's offerings of means, time and service are given out of what God first gave, “your substance, which doth not belong to you but to God” ([[Mosiah 4:22]]), and the LORD who “triest the heart” (verse 17) looks in them for the willingness David saw with joy.

