chapter: 18
title: The LORD Preserved David Whithersoever He Went
tagline: David subdues the Philistines, Moab, Zobah, Damascus and Edom; the gifts of Hamath and the spoil of the nations are dedicated to the LORD, and the bronze of Hadarezer's cities becomes the metal of Solomon's sea. Then the roll of the officers of a king who reigned with judgment and justice.
when: 'David''s reign in Jerusalem: a summary of the wars of the reign, not dated in the text (“after this,” verse 1).'

setting: |
  Chapter 17 ended with the LORD's promise to build David a house, and chapters 18–20 turn to David's wars, told in the same order as in Samuel: first this chapter's general view of all the wars David won against the nations around him, with a list of his chief officers ([[2 Sam. 8]]); then the longer war with Ammon and Syria ([[2 Sam. 10]]; [[2 Sam. 12:26–31]]). What stands between those wars in Samuel, David's kindness to Jonathan's son Mephibosheth ([[2 Sam. 9]]) and the story of Bath-sheba ([[2 Sam. 11]]–12), Chronicles leaves out; the note at [[1 Chr. 20:1]] takes up those omissions. The opening “after this” is taken over from Samuel and probably came from an older book of annals, so it does not date the conquests.

  The site's notes on [[2 Sam. 8]] explain most of what this chapter holds: the figure of speech behind Samuel's “Metheg-ammah,” which Chronicles turns into plain prose as “Gath and her towns” (verse 1); the Euphrates as the edge of the land promised to Abraham; the refrain that the LORD gave David the victory; Syria or Edom in the valley of salt; the reversed names of the priests Ahimelech and Abiathar (here “Abimelech,” verse 16); and the sons of David, whom Samuel calls priests and Chronicles calls “chief about the king” (verse 17). The notes here go to what Chronicles leaves out, reads differently, or adds of its own.

thread: |
  The chapter is a list of victories, and twice it stops to say whose they are: “Thus the LORD preserved David whithersoever he went” (verses 6 and 13), a verb that means the LORD gave him the victory (the note at [[2 Sam. 8:6]]). Between those lines the spoil of the nations comes to Jerusalem, shields of gold and silver and gold from Edom, Moab, Ammon, the Philistines and Amalek, with the vessels the king of Hamath sent as a gift, and David dedicates it all to the LORD.

  Chronicles adds one line that shows where some of the spoil was going. The bronze taken from Hadarezer's cities is the bronze “wherewith Solomon made the brasen sea, and the pillars, and the vessels of brass” (verse 8). So the spoil of David's wars becomes metal for the house he himself will not build, and later the LORD gives those wars as the reason he will not build it: “Thou hast shed blood abundantly, and hast made great wars” ([[1 Chr. 22:8]], where the note explains it). The chapter ends at home, with the kingdom secure: “David reigned over all Israel, and executed judgment and justice among all his people” (verse 14).

sections:
  - range: 1-8
    heading: Victories on every side
    plain: |
      After this David struck the Philistines and subdued them, and he took Gath and its towns from the Philistines. He struck Moab, and the Moabites became David's subjects and paid him tribute.

      David struck Hadarezer king of Zobah, near Hamath, as he went to establish his rule at the Euphrates River. David captured from him a thousand chariots, seven thousand horsemen and twenty thousand foot soldiers; he hamstrung all the chariot horses, but kept back enough for a hundred chariots. When the Syrians of Damascus came to help Hadarezer king of Zobah, David killed twenty-two thousand of them. Then David put garrisons in Syria of Damascus, and the Syrians became David's subjects and paid tribute. So the LORD gave David victory wherever he went.

      David took the shields of gold that Hadarezer's servants carried and brought them to Jerusalem. And from Tibhath and from Chun, cities of Hadarezer, David took a great quantity of bronze, from which Solomon made the bronze sea, the pillars, and the bronze vessels.
  - range: 9-13
    heading: Gifts dedicated to the LORD
    plain: |
      When Tou king of Hamath heard that David had defeated the whole army of Hadarezer king of Zobah, he sent his son Hadoram to King David to greet him and congratulate him on fighting Hadarezer and defeating him, for Hadarezer had been at war with Tou. Hadoram brought all kinds of vessels of gold, silver and bronze. King David dedicated these to the LORD too, with the silver and gold he had taken from all the nations: from Edom, Moab, the Ammonites, the Philistines and Amalek.

      Abishai the son of Zeruiah killed eighteen thousand Edomites in the Valley of Salt. He put garrisons in Edom, and all the Edomites became David's subjects. So the LORD gave David victory wherever he went.
  - range: 14-17
    heading: David's officers
    plain: |
      So David reigned over all Israel, and he did what was just and right for all his people. Joab the son of Zeruiah commanded the army; Jehoshaphat the son of Ahilud was recorder; Zadok the son of Ahitub and Abimelech the son of Abiathar were the priests; Shavsha was scribe; Benaiah the son of Jehoiada was over the Cherethites and the Pelethites; and David's sons were the chief officials at the king's side.

notes:
  - ref: 2
    phrase: And he smote Moab; and the Moabites became David’s servants
    kind: history
    title: What Chronicles leaves out of Moab's defeat
    body: |
      Chronicles tells Moab's defeat in a single line and leaves out what Samuel tells of the prisoners. In Samuel David “measured them with a line, casting them down to the ground,” two lines to die and one to live ([[2 Sam. 8:2]]), which seems to mean that two thirds of the Moabite fighting men were put to death; the note there gives the readings of that verse and the question of why David dealt so harshly with Moab, where he had once left his father and mother in safety ([[1 Sam. 22:3–4]]).

      Why Chronicles drops it, no source can say for certain. One older reading observes that the Chronicler often leaves out obscure words of Samuel, and the meaning of Samuel's verse is uncertain. Another finds no reason for the omission at all, and rejects the idea that the Chronicler left it out to spare David the charge of cruelty: two chapters later Chronicles tells, without softening it, how David dealt with the captives of Rabbah and the cities of Ammon ([[1 Chr. 20:3]]).
    sources: [lds-scriptures, cambridge-chronicles, keil-chronicles]

  - ref: 4
    phrase: seven thousand horsemen
    kind: history
    title: Seventeen hundred horsemen, or seven thousand?
    body: |
      Chronicles counts seven thousand horsemen where Samuel's Hebrew has seventeen hundred, and an ancient form of Samuel agrees with Chronicles. The Hebrew of [[2 Sam. 8:4]] reads “a thousand and seven hundred horsemen,” with no word for chariots; the King James there supplies “chariots” in italics, to read “a thousand chariots, and seven hundred horsemen.” Chronicles has a thousand chariots and seven thousand horsemen, and the Septuagint, the ancient Greek translation, has the same in Samuel: “David took a thousand of his chariots, and seven thousand horsemen.”

      The texts do not settle which figure is original, and neither does this note. Why the numbers in Samuel and Chronicles so often differ, and how a word for “thousand” could be misread in copying, is explained at [[2 Sam. 24:9]]. The rest of the verse is the same in both books: David hamstrung (“houghed”) the chariot horses and kept enough for a hundred chariots; the note at [[Josh. 11:6]] explains why Israel crippled captured horses.
    sources: [biblehub-interlinear, lxx-rahlfs, lds-scriptures]

  - ref: 8
    phrase: wherewith Solomon made the brasen sea, and the pillars, and the vessels of brass
    kind: history
    title: Bronze for Solomon's sea
    body: |
      Chronicles alone says where the bronze of Hadarezer's cities went: into the great basin, the pillars and the vessels of Solomon's temple. Samuel names the cities Betah and Berothai, where Chronicles has Tibhath and Chun, and says only that “king David took exceeding much brass” ([[2 Sam. 8:8]]). The metal is copper, hardened with an alloy into bronze, the metal of much of the temple's furniture; the King James calls it brass. The “brasen sea” was the great cast basin in the temple court where the priests washed ([[2 Chr. 4:2–6]]; the note at [[1 Kgs. 7:23]]), and the pillars are Jachin and Boaz, which stood in the porch ([[1 Kgs. 7:21]]).

      Bronze in great quantity runs through the rest of Chronicles' story of the house. David prepares “brass in abundance without weight” ([[1 Chr. 22:3]]) and tells Solomon he has gathered “of brass and iron without weight; for it is in abundance” ([[1 Chr. 22:14]]), and when Solomon cast the temple's vessels, “the weight of the brass could not be found out” ([[2 Chr. 4:18]]). Verse 8 puts the spoil of a war in Syria among the metal of that house. The note at [[2 Sam. 8:11]] follows the silver and gold David dedicated to the same house.
    sources: [lds-scriptures, bdb]

  - ref: 12
    phrase: Abishai the son of Zeruiah slew of the Edomites in the valley of salt
    kind: history
    title: Abishai in the valley of salt
    body: |
      Chronicles gives the victory over Edom to Abishai, where Samuel gives it to David and the title of Psalm 60 to Joab. Samuel says that “David gat him a name when he returned from smiting of the Syrians in the valley of salt, being eighteen thousand men” ([[2 Sam. 8:13]]), and the psalm's title says that Joab struck twelve thousand of Edom there ([[Ps. 60:0]]). Abishai and Joab were brothers, sons of David's sister Zeruiah ([[1 Chr. 2:16]]), and Abishai was chief of the three among the mighty men ([[1 Chr. 11:20]]).

      Chronicles also names the enemy as Edom, where Samuel's Hebrew has Syria; the note at [[2 Sam. 8:13]] explains how the two names are confused in Hebrew writing. The note on the psalm's title ([[Ps. 60:0]]) sets the three accounts side by side and weighs how they fit together.
    sources: [lds-scriptures]

christ: |
  The chapter's last word on David's reign is that he “executed judgment and justice among all his people” (verse 14). Jeremiah used those words of the King to come from David's line, a “righteous Branch” who “shall execute judgment and justice in the earth” ([[Jer. 23:5]]), and the close of [[2 Sam. 8]] on the site follows them to Jesus Christ. David gave his people judgment and justice for the years of his reign; the throne of the King from his line is established “with judgment and with justice from henceforth even for ever” ([[Isa. 9:7]]), and that is the justice a disciple lives under now.

