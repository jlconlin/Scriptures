chapter: 25
title: Prophesying with Harps
tagline: David sets apart the sons of Asaph, Heman and Jeduthun to “prophesy with harps, with psalteries, and with cymbals”; Heman is the king's seer. Then two hundred eighty-eight skilled singers cast lots for twenty-four courses, the teacher on the same terms as the scholar.
when: 'The last years of David’s reign, when he “was old and full of days” and had made Solomon king ([[1 Chr. 23:1]]), ordering the service of the house that Solomon would build.'

setting: |
  Chapter 25 is the third of David's four chapters of orders for the people who would serve at the house Solomon would build. Chapter 23 numbered the Levites and set four thousand of them to praise the LORD “with the instruments which I made” ([[1 Chr. 23:5]]); chapter 24 drew lots for the twenty-four courses of priests; this chapter draws lots for the singers, and chapter 26 for the porters. None of it is told in Samuel or Kings.

  The singers were not new. When the ark came to Jerusalem the Levites appointed Heman, Asaph and Ethan to lead the music ([[1 Chr. 15:17–19]]); afterward Asaph led the praise before the ark, and Heman and Jeduthun gave thanks at the tabernacle in Gibeon ([[1 Chr. 16:4–5]]; [[1 Chr. 16:37–42]]). Asaph descended from Gershon, Heman from Kohath, and Jeduthun, whom one older reading takes to be the Ethan of the earlier lists, from Merari ([[1 Chr. 6:33–47]]), so that every chief family of Levi had its leader among the singers. Heman was Samuel's grandson (the note at [[1 Chr. 6:31]]). Their families sang at the dedication of Solomon's temple ([[2 Chr. 5:12]]), and the order lasted long after (the note at verse 6).

thread: |
  The chapter makes music an office, and an inspired one. Its first verse says what the singers were set apart to do: to “prophesy with harps, with psalteries, and with cymbals.” Verse 3 says what that prophesying was, giving thanks and praising the LORD, and verse 5 puts a seer at the head of the largest family. The music came under “the order of the king” (verse 2), and later Chronicles calls David's commandment for the Levites' instruments “the commandment of the LORD by his prophets” (the note at verse 6).

  Then comes the lot, as it came for the priests in chapter 24. Twenty-four leaders, each with eleven others, drew their turns, and the lot made no difference between them: “the small as the great, the teacher as the scholar” (verse 8). The chapter is a list of names, but the names are of men whose work was to praise, and Heman's, read in order, may themselves make a prayer (the note at verse 4).

sections:
  - range: 1-7
    heading: The singers' families
    plain: |
      David and the commanders of the army set apart for the service some of the sons of Asaph, of Heman and of Jeduthun, who were to prophesy with harps, psalteries and cymbals. This is the list of the men who did the work. Of Asaph's sons: Zaccur, Joseph, Nethaniah and Asarelah, under Asaph's direction, who prophesied under the king's direction. Of Jeduthun's sons: Gedaliah, Zeri, Jeshaiah, Hashabiah and Mattithiah, six, under the direction of their father Jeduthun, who prophesied with the lyre in giving thanks and praising the LORD. Of Heman's sons: Bukkiah, Mattaniah, Uzziel, Shebuel, Jerimoth, Hananiah, Hanani, Eliathah, Giddalti, Romamti-ezer, Joshbekashah, Mallothi, Hothir and Mahazioth.

      All these were sons of Heman, the king's seer in the words of God, to lift up the horn. God gave Heman fourteen sons and three daughters. All of them served under their fathers' direction in the music of the house of the LORD, with cymbals, psalteries and harps, for the service of the house of God, by the king's order to Asaph, Jeduthun and Heman. Their number, with their kinsmen trained in singing to the LORD, all of them skilled, was two hundred eighty-eight.
  - range: 8-31
    heading: The twenty-four lots
    plain: |
      They cast lots for their turns of duty, the lesser alongside the greater, the teacher alongside the pupil.

      The first lot fell for Asaph to Joseph; the second to Gedaliah; the third to Zaccur; the fourth to Izri; the fifth to Nethaniah; the sixth to Bukkiah; the seventh to Jesharelah; the eighth to Jeshaiah; the ninth to Mattaniah; the tenth to Shimei; the eleventh to Azareel; the twelfth to Hashabiah; the thirteenth to Shubael; the fourteenth to Mattithiah; the fifteenth to Jeremoth; the sixteenth to Hananiah; the seventeenth to Joshbekashah; the eighteenth to Hanani; the nineteenth to Mallothi; the twentieth to Eliathah; the twenty-first to Hothir; the twenty-second to Giddalti; the twenty-third to Mahazioth; and the twenty-fourth to Romamti-ezer. Each man, with his sons and his kinsmen, made twelve.

notes:
  - ref: 1
    phrase: who should prophesy with harps, with psalteries, and with cymbals
    kind: words
    title: Prophesying with harps
    body: |
      The singers “prophesy” because their music was inspired worship, and the chapter itself says so. The verb is the one used of Israel's prophets, and the lexicon places its three uses here (verses 1–3) beside the prophesying of the company Samuel led, who came down from the high place with psaltery, tabret, pipe and harp and prophesied as they came ([[1 Sam. 10:5]]; the site's note “A company of prophets” there). Verse 3 defines the word for this chapter: Jeduthun “prophesied with a harp, to give thanks and to praise the LORD.” What the singers uttered was praise, not prediction, but the lexicon files it under the same heading as the prophesying with song of Samuel's company ([[1 Sam. 10:11]]; [[1 Sam. 19:20]]).

      Scripture shows the same joining of music and revelation in Elisha, who asked for a minstrel, “and it came to pass, when the minstrel played, that the hand of the LORD came upon him” ([[2 Kgs. 3:15]]). At the dedication of the temple, on one Latter-day Saint reading, it was the singing itself that brought the cloud of the LORD's presence into the house ([[2 Chr. 5:12–14]]; the note at [[1 Chr. 6:31]]). So when David set these men apart, he was not hiring an orchestra; he was setting apart men whose music was a kind of prophesying, led, as verse 5 shows, by a seer.
    sources: [bdb, lds-scriptures, hopkin-psalms-sung]

  - ref: 4
    phrase: Hananiah, Hanani, Eliathah, Giddalti, and Romamti-ezer, Joshbekashah, Mallothi, Hothir, and Mahazioth
    kind: history
    title: Twenty-four names, and a sentence among them
    body: |
      Verses 2–4 name the twenty-four leaders whose lots are drawn in verses 9–31: four sons of Asaph, six of Jeduthun and fourteen of Heman. The two lists do not quite agree. Verse 3 counts Jeduthun's sons as “six” but names five; the Shimei who draws the tenth lot (verse 17) appears nowhere else, and one Greek manuscript inserts his name in verse 3, almost certainly rightly. Several names change form between the lists (Zeri and Izri, Asarelah and Jesharelah, Uzziel and Azareel, Shebuel and Shubael, Jerimoth and Jeremoth), and for Uzziel and Azareel the difference in Hebrew letters is small. The lots themselves ran by family at first: the first, third, fifth and seventh fell to Asaph's sons, the even numbers through the fourteenth to Jeduthun's, and the rest to Heman's.

      Heman's last nine names are stranger, and one older reading finds a reason. Most Hebrew names have a meaning, and these, read in order from Hananiah to Mahazioth, seem to have been arranged to make a sentence, roughly: “Have mercy upon me, O Lord, have mercy upon me; I have magnified and exalted [thy] help; I spake of it sitting in affliction; grant us still [thy] visions.” If so, whoever set down the list made the names of a family of singers into a small psalm; the names only suggest such a sentence, and the reading stays a reading.
    sources: [cambridge-chronicles]

  - ref: 5
    phrase: the king’s seer in the words of God, to lift up the horn
    kind: words
    title: The king's seer, and the lifted horn
    body: |
      Heman led the largest family of singers and was also a seer, a man to whom God revealed what others could not see. A seer is “a person authorized of God to see with spiritual eyes things that God has hidden from the world,” and anciently a prophet was often called by that name. Chronicles gives the same title to Gad, “David's seer” ([[1 Chr. 21:9]]), to Asaph ([[2 Chr. 29:30]]) and to Jeduthun ([[2 Chr. 35:15]]). One older reading takes it at its word: along with his gift of song, Heman had the prophetic gift and made known to the king the revelations of God. He was Samuel's grandson, for his father Joel was Samuel's firstborn ([[1 Chr. 6:33]]; [[1 Sam. 8:2]]).

      “To lift up the horn” is probably an image of strength raised up rather than a direction to blow one. Hannah sang “mine horn is exalted in the LORD” ([[1 Sam. 2:1]]), and the lexicon takes the lifted horn as increase of might and dignity, “so perhaps” here, while recording the other reading, that the singers were to blow loudly. Against that reading, one older commentary notes that the horn was not one of the Levites' instruments. The Hebrew accents join the phrase to the words before it, as the King James does; the same commentary joins it instead to what follows: to raise up Heman's horn, God gave him fourteen sons and three daughters, a house made strong for the praise of God. Read that way, the large family in verse 5 is the LORD's blessing on His seer, and the fourteen sons fill fourteen of the twenty-four courses (verses 13–31).
    sources: [gs-seer, keil-chronicles, bdb, lds-scriptures]

  - ref: 6
    phrase: according to the king’s order to Asaph, Jeduthun, and Heman
    kind: scripture
    title: The king's order, and the LORD's
    body: |
      The singers served under their fathers, and their fathers under the king; later Chronicles says that David's commandment for the Levites' music came from the LORD. When Hezekiah restored the temple's worship, he set the Levites in the house “with cymbals, with psalteries, and with harps, according to the commandment of David, and of Gad the king's seer, and Nathan the prophet: for so was the commandment of the LORD by his prophets” ([[2 Chr. 29:25]]). By that account, the order for the Levites' instruments that David gives in this chapter was the LORD's, given through Gad and Nathan.

      The order outlasted the kingdom. At Josiah's Passover “the singers the sons of Asaph were in their place, according to the commandment of David, and Asaph, and Heman, and Jeduthun the king's seer” ([[2 Chr. 35:15]]). After the exile the singers who came home still kept their ward “according to the commandment of David, and of Solomon his son,” remembering that “in the days of David and Asaph of old there were chief of the singers, and songs of praise and thanksgiving unto God” ([[Neh. 12:45–46]]), and the sons of Asaph praised the LORD with cymbals when the foundation of the second temple was laid (the note at [[Ezra 3:10]]).
    sources: [lds-scriptures]

  - ref: 8
    phrase: as well the small as the great, the teacher as the scholar
    kind: history
    title: The small as the great, the teacher as the scholar
    body: |
      The lot set the singers' turns without regard to age or skill. Verse 7 counts two hundred eighty-eight trained singers, and verses 9–31 divide them into twenty-four courses of twelve, “he, his sons, and his brethren,” the same number of courses as the priests had (the note at [[1 Chr. 24:5]] explains why the order was drawn by lot). The porters drew their gates the same way, “as well the small as the great” ([[1 Chr. 26:13]]).

      The pair at the end of verse 8 is a master and his pupil. The word the King James renders “cunning” in verse 7 and “teacher” here is one Hebrew word, *mēḇîn*, one who understands, which the lexicon takes as “teacher” in both verses; “scholar” is *talmîd*, a pupil. The Greek translation has “the perfect ones and the learners.” So the chapter that names the skilled men also says that skill bought no precedence: the teacher's course and the learner's were drawn alike, and the turn to sing in the house of the LORD fell where the lot put it.
    sources: [lds-scriptures, bdb, lxx-rahlfs]

christ: |
  The singers prophesied “to give thanks and to praise the LORD” (verse 3), and the psalms that bear Asaph's and Jeduthun's names ([[Ps. 50]]; [[Ps. 77]]) belong to the book the risen Lord named when He said that all things must be fulfilled “which were written … in the psalms, concerning me” ([[Luke 24:44]]). Latter-day Saints may read the psalms as prophesying of Christ in a way that also reflects the experiences of His people. The music of worship still carries that witness: “Some of the greatest sermons are preached by the singing of hymns,” and a hymn sung in a meeting can turn a disciple to repentance and build testimony and faith, as the singers' praise once did in the house of the LORD.

