chapter: 7
title: Valiant Men of Might
tagline: Six tribes of the north counted as fighting men, two tribes missing, and one story set into the list of Ephraim, of sons killed at Gath, a father comforted, and a son named for the trouble. Ephraim's line runs on to Joshua.
when: 'Written after the exile. The lists count men “in the days of David” (verse 2) and run in Ephraim’s line to Joshua the son of Nun (verse 27).'

setting: |
  Chapter 7 gathers six tribes in forty verses: Issachar, Benjamin, Naphtali, Manasseh (for the second time, after [[1 Chr. 5:23–24]]), Ephraim and Asher. Judah alone had 102 verses, and Benjamin, given here in seven, is taken up again at length in chapter 8. What the lists as a whole are for is explained at [[1 Chr. 1:1]].

  Two tribes are missing. Dan and Zebulun are among Israel's sons in [[1 Chr. 2:1–2]], but neither has a genealogy in these chapters. Verse 12 may hold a trace of Dan: “Hushim” is the name of Dan's son in [[Gen. 46:23]], and on one older reading the word Aher, literally “another,” stands where Dan's name stood before the Chronicler or a copyist found it illegible. On another older reading Hushim and Aher are one more family of Benjamin, and Dan is left out with Zebulun. Why the two tribes are missing, the chapter does not say.

  The registers come from more than one time. Issachar's, Benjamin's and Asher's count the men fit for war, and Issachar's figure is dated “in the days of David” (verse 2), probably from the count Joab made for him ([[2 Sam. 24:1–9]]). Ephraim's list counts Beth-el as Ephraim's (verse 28), as it was in the northern kingdom, which suggests that register was drawn up after the kingdom divided. The book itself was written after the exile.

thread: |
  This chapter reads like a muster roll. Its refrain is the men of war: “valiant men of might” (verses 2, 5), “mighty men of valour” (verses 7, 9, 11, 40), men “fit to go out for war and battle” (verse 11) and “apt to the war and to battle” (verse 40), the strength of Issachar, Benjamin and Asher given in numbers.

  Into Ephraim's list the Chronicler sets the chapter's one story, and it is a story of loss rather than strength. Two of Ephraim's sons were killed by the men of Gath over their cattle; their father “mourned many days, and his brethren came to comfort him” (verse 22); the next son was named Beriah, “because it went evil with his house” (verse 23). Then comes “his daughter” Sherah, who built towns (verse 24), and Ephraim's list then runs on to “Jehoshua his son” (verse 27), Joshua the son of Nun. The register closes with where Joseph's children lived (verses 28–29), and Asher's count ends the chapter as it began, with the men “apt to the war.”

sections:
  - range: 1-5
    heading: Issachar
    plain: |
      Issachar's four sons were Tola, Puah, Jashub and Shimron. Tola's six sons were heads of their fathers' houses, valiant men; in David's day their descendants numbered 22,600. Tola's grandson Izrahiah and his sons Michael, Obadiah, Joel and Ishiah, five in all, were chiefs, and their families furnished 36,000 men for war, because they had many wives and sons. Counting all the clans of Issachar, the valiant men registered were 87,000.
  - range: 6-12
    heading: Benjamin
    plain: |
      Benjamin's sons were Bela, Becher and Jediael. Bela's five sons were heads of their fathers' houses, mighty men, and their registered men were 22,034. Becher had nine sons, among them Anathoth and Alameth, and their registered men were 20,200. Jediael's line ran through Bilhan to seven grandsons, whose families furnished 17,200 soldiers ready for battle. Shuppim and Huppim were sons of Ir, and Hushim the sons of Aher (on these names, see the Background).
  - range: 13
    heading: Naphtali
    plain: |
      Naphtali's sons were Jahziel, Guni, Jezer and Shallum, descendants of Bilhah.
  - range: 14-19
    heading: Manasseh
    plain: |
      Manasseh's sons: Ashriel, whom she bore (the verse does not name her); Manasseh's Aramean concubine bore Machir, the father of Gilead. Machir married Maachah, a sister of Huppim and Shuppim. The name of the second was Zelophehad, and Zelophehad had daughters. Maachah bore Peresh, whose brother was Sheresh, and his sons were Ulam and Rakem; Ulam's son was Bedan. These were the descendants of Gilead son of Machir, son of Manasseh. His sister Hammoleketh bore Ishod, Abiezer and Mahalah, and Shemida's sons were Ahian, Shechem, Likhi and Aniam.
  - range: 20-29
    heading: Ephraim, and the land of Joseph's sons
    plain: |
      Ephraim's line ran from Shuthelah through Bered, Tahath, Eladah, Tahath, Zabad and a second Shuthelah. Ezer and Elead were killed by the men of Gath, natives of that land, because they had come down to take their cattle. Ephraim their father mourned for many days, and his relatives came to comfort him. Then he lay with his wife, and she bore a son, whom he named Beriah, because misfortune had come on his house. His daughter Sherah built lower and upper Beth-horon, and Uzzen-sherah. The line went on through Rephah and Resheph, Telah, Tahan, Laadan, Ammihud, Elishama and Non to Joshua.

      Their lands and towns were Beth-el and its villages, Naaran to the east, Gezer and its villages to the west, and Shechem and its villages as far as Gaza and its villages; and along Manasseh's border Beth-shean, Taanach, Megiddo and Dor, each with its villages. In these lived the descendants of Joseph son of Israel.
  - range: 30-40
    heading: Asher
    plain: |
      Asher's sons were Imnah, Isuah, Ishuai and Beriah, and their sister was Serah. Beriah's sons were Heber and Malchiel, the father of Birzavith. Heber fathered Japhlet, Shomer, Hotham and their sister Shua. Verses 33–39 name the sons of Japhlet, of Shomer (Shamer), of his brother Helem, and of Zophah, Jether and Ulla. All these were Asher's descendants, heads of their fathers' houses, choice and mighty men, chief among the princes; the men registered as fit for war numbered 26,000.

notes:
  - ref: 15
    phrase: and Zelophehad had daughters
    kind: scripture
    title: The daughters of Zelophehad
    body: |
      Zelophehad is the man of Machir's line in Manasseh who had “no sons, but daughters” ([[Josh. 17:3]]; [[Num. 26:33]]), and his five daughters are the women whose case changed Israel's law of inheritance. The land was to be divided “according to the number of names” ([[Num. 26:53]]); the daughters brought their father's case to Moses, and the LORD made it law: “If a man die, and have no son, then ye shall cause his inheritance to pass unto his daughter” ([[Num. 27:8]]; the full story is in the note at [[Num. 27:1]]). Under Joshua they received their portion, and Manasseh's land was counted in ten portions “because the daughters of Manasseh had an inheritance among his sons” ([[Josh. 17:6]]; see the note on [[Josh. 17:5]]). Chronicles names no daughter here, though Numbers and Joshua name them.
    sources: [lds-scriptures]

  - ref: 22
    phrase: And Ephraim their father mourned many days
    kind: history
    title: Ephraim's loss, and a son named for it
    body: |
      The raid on Gath in verses 21–24, the chapter's one story, probably happened after Israel had settled in Canaan, so the “Ephraim” who mourned raises a question. Joseph's son Ephraim was born in Egypt ([[Gen. 41:52]]) and was dead long before Israel came out of it, yet here his sons are killed by “the men of Gath that were born in that land.” The verb points to where the raid happened: if Ezer and Elead are the ones who “came down” to take the cattle, the phrase suits a descent from the hill country of Ephraim to the lowland of Gath, not a march out of Egypt.

      Who, then, mourned? Two older readings answer differently. One takes “Ephraim their father” as a later Ephraimite who bore his ancestor's name, as the list itself has a second Shuthelah six generations down (verses 20–21); he mourned his sons, was comforted, and fathered another. The other reads the tribe personified in its ancestor: the clans of Ezer and Elead were cut off, and the clan of Beriah rose after the disaster.

      On either reading the new son carries the loss in his name. *Beriah* sounds like the Hebrew *beraah*, “in evil” or “in misfortune,” and verse 23 makes the play on the sound explicit: he was named so “because it went evil with his house,” that is, he was born while misfortune lay on the family. The house did not end there. “His daughter” Sherah is credited with building the lower and upper Beth-horon, towns on Ephraim's border ([[Josh. 16:3]], [[Josh. 16:5]]), and Uzzen-sherah, a place named nowhere else that probably took its name from her; on one older reading, “built” means she enlarged and fortified the Beth-horons.
    sources: [keil-chronicles, cambridge-chronicles, lds-scriptures]

  - ref: 27
    phrase: Non his son, Jehoshua his son
    kind: history
    title: Ephraim's line reaches Joshua
    body: |
      Ephraim's list ends with the best-known man of the tribe, Joshua the son of Nun. “Non” is Nun and “Jehoshua” is the name Moses gave him: “Moses called Oshea the son of Nun Jehoshua” ([[Num. 13:16]]); what the name means is explained at [[Ex. 17:9]]. The verse before names “Ammihud his son, Elishama his son,” and Numbers gives the same pair of names to Ephraim's prince in the wilderness, “Elishama the son of Ammihud” ([[Num. 1:10]]; [[Num. 7:48]]).

      Joshua was born in Egypt before the Exodus, was Moses' minister and one of the twelve spies, and became his successor, the leader under whom Israel conquered the land.
    sources: [lds-scriptures, bd-joshua]

christ: |
  Ephraim's line ends in Jehoshua (verse 27), and Jesus is the Greek form of that name, “God is help” or “Savior”; the New Testament calls Joshua the son of Nun by it ([[Acts 7:45]]; [[Heb. 4:8]]), and it is the name given the Savior of the world at the direction of an angel. Hebrews, which calls Joshua by that name, says the rest he gave Israel in the land was not the last: “There remaineth therefore a rest to the people of God” ([[Heb. 4:8–9]]), and “we which have believed do enter into rest” ([[Heb. 4:3]]). That rest is open now to those who believe in Him.

