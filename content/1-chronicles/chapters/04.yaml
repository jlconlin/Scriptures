chapter: 4
title: More Honourable than His Brethren
tagline: The genealogy of Judah ends in clans named for their towns and their trades, and pauses for Jabez, whose prayer was granted. Simeon follows, a small tribe whose families went out in Hezekiah’s days to find pasture.
when: 'Written after the exile. The lists run from Judah’s sons to the days of Hezekiah king of Judah (verse 41).'

setting: |
  Chapter 4 finishes the genealogy of Judah that began at [[1 Chr. 2:3]] and then gives Simeon’s. Judah has more room than any other tribe, 102 verses from 2:1 to 4:23, against Simeon’s twenty. In one older reading, the order of the tribes begins with geography: Judah and Simeon, the southern tribes, come first. What the lists as a whole are for, a genealogy of the Lord’s people from Adam to the captivity, is explained at [[1 Chr. 1:1]].

  The Judah material here reads as a set of fragments. Verse 1 is not five brothers but a line of five or six generations (Perez, his son Hezron, and on down). How the family of verses 8–10 joins the sons of Judah in chapter 2 is not clear, and of the men of Rechah’s connection with Judah’s larger families nothing has come down. Simeon’s towns in verses 28–33 follow Simeon’s lot in [[Josh. 19:1–8]], though not name for name: several are spelled differently (Bilhah for Balah, Tolad for Eltolad), and the last group has five towns, with Etam and Tochen, where Joshua has four.

  Two times are in play. The latest event the chapter names is in the reign of Hezekiah (verse 41); the book itself was written after the exile, most scholars think in the fourth century BC.

thread: |
  The chapter is mostly names tied to places. Many of Judah’s “fathers” are fathers of towns, Etam, Gedor, Beth-lehem, Tekoa, Eshtemoa, Socho, Zanoah, Mareshah: the names are the clans that settled them. Some families are known by their work, the craftsmen of the valley of Charashim, the house of linen-workers, the potters who worked for the king. Simeon’s list closes in the text’s own words, “These were their habitations, and their genealogy” (verse 33): who a family was and where it lived are one record.

  Twice the list stops for a story, and both are about land. Jabez, whose name echoed his mother’s pain, asked God to bless him and “enlarge my coast,” and “God granted him that which he requested” (verse 10). Simeon’s families, few beside Judah’s (verse 27), grew under their princes and in Hezekiah’s days went out for pasture and found a land “wide, and quiet, and peaceable” (verse 40).

sections:
  - range: 1-8
    heading: Families of Judah from Hur and Ashur
    plain: |
      Judah’s line ran through Perez, Hezron, Carmi, Hur and Shobal. Shobal’s son Reaiah fathered Jahath, and Jahath fathered Ahumai and Lahad: these were the clans of the Zorathites. From Etam came Jezreel, Ishma and Idbash, and their sister Hazelelponi. Penuel was the founder of Gedor, and Ezer of Hushah. These all came from Hur, the firstborn of Ephratah, the founder of Bethlehem.

      Ashur, the founder of Tekoa, had two wives, Helah and Naarah. Naarah bore him Ahuzam, Hepher, Temeni and Haahashtari; Helah bore Zereth, Jezoar and Ethnan. Coz fathered Anub and Zobebah, and the clans of Aharhel son of Harum.
  - range: 9-10
    heading: Jabez
    plain: |
      Jabez was more honoured than his brothers. His mother had named him Jabez, saying, “I bore him in pain.” Jabez called on the God of Israel: “Bless me indeed, widen my border, let your hand be with me, and keep me from harm, so that it does not bring me pain.” And God granted what he asked.
  - range: 11-23
    heading: More families of Judah, and Shelah’s line
    plain: |
      Chelub, Shuah’s brother, fathered Mehir, the father of Eshton. Eshton fathered Beth-rapha, Paseah, and Tehinnah the founder of Ir-nahash: these were the men of Rechah. Kenaz’s sons were Othniel and Seraiah, and Othniel’s son was Hathath. Meonothai fathered Ophrah, and Seraiah fathered Joab, the founder of the valley of Charashim, named for its craftsmen. Caleb son of Jephunneh had sons Iru, Elah and Naam, and Elah’s son was Kenaz. Jehaleleel’s sons were Ziph, Ziphah, Tiria and Asareel.

      Ezra’s sons were Jether, Mered, Epher and Jalon. Mered had two wives: Bithiah, a daughter of Pharaoh, and Jehudijah. The list names Miriam, Shammai, and Ishbah the founder of Eshtemoa, and Jehudijah’s sons Jered the founder of Gedor, Heber the founder of Socho, and Jekuthiel the founder of Zanoah (see the note on verse 18). Then come the sons of Hodiah, Naham’s sister: the founder of Keilah the Garmite, and Eshtemoa the Maachathite. Shimon’s sons were Amnon, Rinnah, Ben-hanan and Tilon; Ishi’s were Zoheth and Ben-zoheth.

      Shelah, Judah’s third son, had descendants: Er the founder of Lecah, Laadah the founder of Mareshah, the clans of linen-workers of the house of Ashbea, Jokim, the men of Chozeba, and Joash and Saraph, who ruled in Moab, and Jashubi-lehem. These records are old. They were the potters and the people of Netaim and Gederah (the King James “plants and hedges”), and they lived there in the king’s service.
  - range: 24-33
    heading: Simeon’s sons and towns
    plain: |
      Simeon’s sons were Nemuel, Jamin, Jarib, Zerah and Shaul. The line ran on through Shallum, Mibsam and Mishma, and from Mishma through Hamuel, Zacchur and Shimei. Shimei had sixteen sons and six daughters, but his brothers had few children, and their clans as a whole did not grow as Judah’s did.

      They lived at Beer-sheba, Moladah, Hazar-shual, Bilhah, Ezem, Tolad, Bethuel, Hormah, Ziklag, Beth-marcaboth, Hazar-susim, Beth-birei and Shaaraim; these were their towns until David became king. They also had five towns, Etam, Ain, Rimmon, Tochen and Ashan, with the villages around them as far as Baal. These were where they lived, and this was their family record.
  - range: 34-43
    heading: Simeon’s princes in Hezekiah’s day
    plain: |
      Thirteen men are named, from Meshobab to Ziza, princes in their clans, whose fathers’ houses grew greatly. They went to the entrance of Gedor, to the east side of the valley, looking for pasture for their flocks. They found rich, good pasture and a broad land, quiet and at peace, where people descended from Ham had lived before.

      In the days of Hezekiah king of Judah these men came and struck their tents and the dwellings there, destroyed them completely, and settled in their place, as they are to this day, because there was pasture for their flocks. Five hundred Simeonites, led by Pelatiah, Neariah, Rephaiah and Uzziel, sons of Ishi, went to mount Seir, struck down the last of the Amalekites who had escaped, and have lived there ever since.

notes:
  - ref: 9
    phrase: Because I bare him with sorrow
    kind: words
    title: Jabez, the son of sorrow
    body: |
      Jabez’s name is his mother’s pain turned into a word, and the same word returns at the end of his prayer. The verse explains the name *Yaʿbēṣ* by *ʿōṣeb*, “pain,” the word used here of the pain of childbirth: “his mother called his name Jabez, saying, Because I bare him with sorrow.” The same root comes back in verse 10: “that it may not grieve me” is, word for word, *that it may not pain me*, said of the evil he asks to be kept from.

      The rest of the prayer asks for a blessing, for God’s hand, and for room: “enlarge my coast” means widen my border, the boundary of the land that is his.

      Why a prayer stands in a list of names, the text answers in its own two clauses. It begins with the outcome, “Jabez was more honourable than his brethren,” and it ends with the reason, “God granted him that which he requested.” A man named for sorrow is remembered for honour, and the list keeps him because he asked and was heard.
    sources: [bdb]

  - ref: 18
    phrase: Bithiah the daughter of Pharaoh, which Mered took
    kind: history
    title: A daughter of Pharaoh in Judah’s line
    body: |
      Judah’s genealogy counts an Egyptian king’s daughter among its mothers. Mered, a son of Ezra, had two wives, Bithiah “the daughter of Pharaoh” and Jehudijah. The King James order leaves the two verses tangled: in verse 17 “she bare Miriam, and Shammai, and Ishbah” with no woman named before it, and in verse 18 “these are the sons of Bithiah” stands with no sons after it. Bithiah is counted as the mother of Miriam, Shammai and Ishbah in a list of all eighty-four mothers named in the Old Testament, which joins the two loose ends.

      The verse does not say which Pharaoh, or how a princess of Egypt came to be married into Judah. It says only that Mered took her, and that her son Ishbah founded Eshtemoa, a town of Judah.
    sources: [hilton-motherhood-ot, lds-scriptures]

  - ref: 27
    phrase: neither did all their family multiply, like to the children of Judah
    kind: history
    title: Simeon, a small tribe inside Judah
    body: |
      Simeon’s families lived inside Judah’s land, and its list is short because, as this verse says, the tribe did not grow as Judah did. The sons in verse 24 are the five whose families are counted in [[Num. 26:12–14]], with Jarib where Numbers has Jachin; [[Gen. 46:10]] names a sixth, Ohad, who has no family in Numbers. The towns that follow (verses 28–33) were Simeon’s lot in Joshua, taken “out of the portion of the children of Judah… for the part of the children of Judah was too much for them” ([[Josh. 19:9]]). Why Simeon had towns but no border of its own, and the older reading that ties it to Jacob’s word “I will divide them in Jacob, and scatter them in Israel,” are at [[Josh. 19:1]] and [[Gen. 49:7]].

      What Chronicles adds is the tribe’s later story: a remark that these were their cities “unto the reign of David” (verse 31), and the princes who went out in Hezekiah’s day (see the note on verse 41).
    sources: [lds-scriptures]

  - ref: 41
    phrase: came in the days of Hezekiah king of Judah
    kind: history
    title: Simeon on the move in Hezekiah’s day
    body: |
      The chapter ends with two expeditions in which Simeonite families, whose fathers’ houses had “increased greatly” (verse 38), took new land in Hezekiah’s reign. The first went for pasture toward Gedor and found people “of Ham” living quietly, most likely Canaanites who had never been driven out at the conquest and so expected no one. Where the King James has “the habitations,” the Revised Version reads a people’s name, the Meunim. “Destroyed them utterly” renders the word for devoting a people to destruction, used of Jericho ([[Josh. 6:21]]).

      The second party, five hundred men, went to mount Seir, another name for Edom, and struck “the rest of the Amalekites that were escaped”: in one older reading, the descendants of those who had escaped Saul when he “smote the Amalekites from Havilah until thou comest to Shur” ([[1 Sam. 15:7]]), who had apparently found refuge in Edom. Why Amalek was under sentence at all, and the limits on reading such accounts, are at [[1 Sam. 15:3]].
    sources: [cambridge-chronicles, lds-scriptures]

christ: |
  Verse 4 names Hur, “the father of Beth-lehem,” the firstborn of Ephratah, a name the town itself carried: Micah promised that out of “Beth-lehem Ephratah” would come the one “that is to be ruler in Israel; whose goings forth have been from of old, from everlasting” ([[Micah 5:2]]), and the chief priests and scribes gave Herod that verse when he asked where the Christ would be born ([[Matt. 2:4–6]]). Jabez’s prayer (verse 10) shows the other side of the chapter: a man who asked, and “God granted him that which he requested.” For a disciple, prayer is where the will of the child and the will of the Father are brought together, and some blessings God is already willing to give are made conditional on being asked for.

