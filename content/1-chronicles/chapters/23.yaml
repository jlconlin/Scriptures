chapter: 23
title: No More Carry the Tabernacle
tagline: David, old and full of days, makes Solomon king and gathers the princes, priests and Levites. He numbers the Levites, sets their families in order, and gives them a new work, because the LORD now dwells in Jerusalem and the tribe that carried His tent will serve at His house.
when: 'The last years of David’s reign, “in the fortieth year of the reign of David” ([[1 Chr. 26:31]]), as Solomon is made king.'

setting: |
  Chapter 22 ends with David's charge to Solomon and to the princes to build the house. Chapter 23 begins four chapters (23–26) on the Levites as David left them toward the end of his reign, in its fortieth year ([[1 Chr. 26:31]]): first their number and their four kinds of work (verses 2–5), then the heads of their families (verses 6–23), then their duties at the house (verses 24–32). Chapter 24 does the same for the priests, the sons of Aaron, in twenty-four courses; chapter 25 for the singers; chapter 26 for the porters, the treasurers and the officers outside the house; and chapter 27 for the army and the king's officials.

  Chronicles gives the orders as David's own (verse 6). The book was likely written in the time of the Second Temple, and scholars disagree whether its accounts of the Levites' music reflect the use of psalms in David's day or temple practice in the writer's own, but “the connection with temple worship is not under debate.” For the tribe of Levi and its families, the singers' lines and the difference between priests and Levites, see the notes at [[1 Chr. 6:31]] and [[1 Chr. 6:49]]; for the Levites who carried the ark to Jerusalem, chapter 15.

thread: |
  The chapter turns a tribe of carriers into a tribe of servants at a house. In the wilderness the Levites were counted to “bear” the tabernacle and its vessels from camp to camp ([[Num. 4:15]]), and David had only lately learned that none but they could carry the ark ([[1 Chr. 15:2]]). Now David gives the reason that work is over: “The LORD God of Israel hath given rest unto his people,” and, as the Hebrew has it, He “dwells in Jerusalem for ever” (verse 25). So “they shall no more carry the tabernacle” (verse 26). The Levites are numbered again, from a younger age, and given work that stays in one place: the courts and chambers, the bread and the offerings, and praise “every morning … and likewise at even” (verse 30).

  The chapter opens with Solomon made king (verse 1), and David's orders for the Levites follow it, so the worship of the house his son will build is arranged before the house is begun.

sections:
  - range: 1-5
    heading: The Levites numbered
    plain: |
      When David was old and had lived a full life, he made his son Solomon king over Israel. He gathered all the leaders of Israel, together with the priests and the Levites. The Levites thirty years old and older were counted, man by man, and they numbered thirty-eight thousand. Of these, twenty-four thousand were to oversee the work of the house of the LORD, six thousand were to be officers and judges, four thousand were to be gatekeepers, and four thousand were to praise the LORD with the instruments “which I made,” David said, “for giving praise.”
  - range: 6-11
    heading: The families of Gershon
    plain: |
      David divided the Levites into divisions by the sons of Levi: Gershon, Kohath and Merari. Of the Gershonites were Laadan and Shimei. The sons of Laadan were Jehiel the chief, Zetham and Joel, three. The sons of Shimei were Shelomith, Haziel and Haran, three; these were the heads of the families of Laadan. The sons of Shimei were Jahath, Zina, Jeush and Beriah, four. Jahath was the chief and Zizah the second, but Jeush and Beriah did not have many sons, so they were counted together as one family.
  - range: 12-20
    heading: The families of Kohath
    plain: |
      The sons of Kohath were Amram, Izhar, Hebron and Uzziel, four. The sons of Amram were Aaron and Moses. Aaron was set apart, he and his sons forever, to consecrate the most holy things, to burn incense before the LORD, to minister to Him, and to bless in His name forever. But the sons of Moses, the man of God, were counted with the tribe of Levi. The sons of Moses were Gershom and Eliezer. Of the sons of Gershom, Shebuel was the chief. Eliezer's son was Rehabiah the chief; Eliezer had no other sons, but Rehabiah's sons were very many. Of the sons of Izhar, Shelomith was the chief. Of the sons of Hebron: Jeriah the first, Amariah the second, Jahaziel the third and Jekameam the fourth. Of the sons of Uzziel: Michah the first and Jesiah the second.
  - range: 21-23
    heading: The families of Merari
    plain: |
      The sons of Merari were Mahli and Mushi. The sons of Mahli were Eleazar and Kish. Eleazar died with no sons, only daughters, and their kinsmen the sons of Kish married them. The sons of Mushi were Mahli, Eder and Jeremoth, three.
  - range: 24-32
    heading: Their work at the house
    plain: |
      These were the sons of Levi by their fathers' houses, the heads of the families as they were counted by name, man by man, who did the work of the service of the house of the LORD, from twenty years old and up. For David said, “The LORD God of Israel has given rest to His people, and He dwells in Jerusalem forever. So the Levites will no longer need to carry the tabernacle or any of its vessels for its service.” By David's last words the Levites were counted from twenty years old and up.

      Their place was at the side of the sons of Aaron, for the service of the house of the LORD: over the courts and the chambers, the purifying of every holy thing, and the work of the service of the house of God; the showbread, the fine flour for the grain offering, the unleavened wafers, what is baked in the pan and what is fried, and every kind of measure and size. They were to stand every morning to thank and praise the LORD, and likewise in the evening, and to serve at all the burnt offerings to the LORD on the sabbaths, the new moons and the set feasts, in the number commanded for them, continually before the LORD. So they were to keep the charge of the tabernacle of the congregation, the charge of the holy place, and the charge of their brethren the sons of Aaron, in the service of the house of the LORD.

notes:
  - ref: 1
    phrase: he made Solomon his son king over Israel
    kind: history
    title: Solomon made king, and Adonijah left out
    body: |
      Chronicles says in one line that David made Solomon king, and leaves out the struggle 1 Kings tells: Adonijah's bid for the throne, Nathan and Bath-sheba's appeal, and Solomon's hurried anointing at Gihon ([[1 Kgs. 1:5–40]]; the notes there). It comes back to the crowning at the end of David's story, where the people make Solomon king “the second time” ([[1 Chr. 29:22]]), and the Church's footnote here points to both places. Here the line serves as the heading to David's last arrangements, which fill the chapters that follow.
    sources: [lds-scriptures]

  - ref: 3
    phrase: the Levites were numbered from the age of thirty years and upward
    kind: history
    title: Thirty, and then twenty
    body: |
      Verse 3 counts the Levites from thirty years old, the age the law of Moses had set for the men who carried the tabernacle ([[Num. 4:3]]), and verses 24 and 27 count them from twenty. The site's note at [[Num. 4:3]] sets out the ages the law gave (thirty there, twenty-five in [[Num. 8:24]]). For the twenty, verses 25–27 give David's reason: the LORD has given rest and dwells in Jerusalem, so the Levites no longer have to carry the tabernacle, and “by the last words of David” (one older reading takes this as his last commands) they were counted from twenty. Later practice agrees with twenty ([[2 Chr. 31:17]]; [[Ezra 3:8]]).

      How the thirty of verse 3 fits is less certain, and the older commentaries divide. One takes the two figures as two stages, an actual change in practice from thirty to twenty, made, it suggests, because there were too few Levites. The other holds that the chapter describes one census of thirty-eight thousand, and that “thirty” in verse 3 crept into the text from a copyist who had the census of Numbers in mind. The text does not settle it; either way, the age that stands at the end of the chapter is twenty, and the reason the chapter itself gives is the LORD's rest in Jerusalem.
    sources: [lds-scriptures, cambridge-chronicles, keil-chronicles]

  - ref: 4
    phrase: to set forward the work of the house of the LORD
    kind: words
    title: To oversee the work
    body: |
      “Set forward” here means to oversee: twenty-four thousand Levites were to direct the work of the house. The Hebrew verb, *niṣṣaḥ*, means to “act as overseer, superintendent, director.” The same verb names the overseers of Solomon's builders ([[2 Chr. 2:18]]) and, in [[1 Chr. 15:21]], the Levites who were to “excel” on the harps, leading the music.
    sources: [bdb]

  - ref: 5
    phrase: the instruments which I made, said David
    kind: history
    title: The instruments which I made
    body: |
      David's own voice breaks into the count: the four thousand were to praise the LORD “with the instruments which I made.” Chronicles remembers the temple's instruments as David's long after him. When Hezekiah restored the worship, “the Levites stood with the instruments of David” ([[2 Chr. 29:26]]), and at the dedication of Jerusalem's wall the singers played “with the musical instruments of David the man of God” ([[Neh. 12:36]]). The singers were first appointed when the ark came up to Jerusalem (the note at [[1 Chr. 15:16]]). Their families and courses are in chapter 25, where the trained leaders, “instructed in the songs of the LORD,” number two hundred eighty-eight ([[1 Chr. 25:7]]). What it meant that they “prophesy” with their instruments is the note at [[1 Chr. 25:1]].
    sources: [lds-scriptures]

  - ref: 14
    phrase: Now concerning Moses the man of God, his sons were named of the tribe of Levi
    kind: history
    title: Moses' sons among the Levites
    body: |
      The sons of Moses were counted as Levites, not priests, and the chapter says so plainly. Of Amram's two sons, Aaron “was separated” with his sons forever to sanctify the most holy things, burn incense, minister and bless in the LORD's name (verse 13), the priest's work. Within the tribe of Levi only Aaron and his sons could hold the office of priest; the priests offered sacrifices, burned incense and taught the law (the note at [[1 Chr. 6:49]] draws the line). So the family of Moses, the lawgiver and “the man of God,” stands among the Levites' fathers' houses, Gershom's line under Shebuel and Eliezer's under Rehabiah (verses 15–17). One of Moses' descendants, Shebuel, appears again as ruler of the treasures ([[1 Chr. 26:24]]).
    sources: [bd-aaronic-priesthood, lds-scriptures]

  - ref: 22
    phrase: their brethren the sons of Kish took them
    kind: history
    title: Eleazar's daughters
    body: |
      Eleazar's daughters married their cousins, the sons of his brother Kish; Chronicles gives no reason, and one older reading supplies it: they were heiresses, and the law set the marriage of daughters who inherited. When Zelophehad died with daughters and no sons, the LORD commanded that “every daughter, that possesseth an inheritance” marry “one of the family of the tribe of her father,” so that each house kept its inheritance ([[Num. 36:8]]), and Zelophehad's daughters “were married unto their father's brothers' sons” ([[Num. 36:11]]). On that reading Eleazar's line was not lost: Mahli's descendants were counted in the one father's house of Kish.
    sources: [keil-chronicles, lds-scriptures]

  - ref: 25
    phrase: that they may dwell in Jerusalem for ever
    kind: words
    title: The LORD dwells, so the Levites no longer carry
    body: |
      The Hebrew of verse 25 says that the LORD, not the people, dwells in Jerusalem forever, and that is the reason the Levites no longer carry the tabernacle. The verb is singular, *wayyiškōn*, *and he dwelt*; the King James' “that they may dwell” reads it of the people. The Septuagint takes the LORD as its subject, “has taken up his abode in Jerusalem for ever,” and a modern translation reads the same way: the LORD “resides in Jerusalem forever. And so the Levites no longer need to carry the tabernacle.”

      Read that way, verse 26 follows from verse 25: because the LORD now dwells in Jerusalem, the men who bore His tent are free for other work at His house. The tabernacle itself still stood at Gibeon ([[1 Chr. 21:29]]; the note at [[1 Chr. 16:39]]).
    sources: [biblehub-interlinear, lxx-rahlfs, nrsvue]

  - ref: 28
    phrase: their office was to wait on the sons of Aaron
    kind: history
    title: At the priests' hand
    body: |
      Verses 28–32 set the Levites' new work beside the priests: their duty was to assist the sons of Aaron, not to do the priests' part: the housekeeping of the sanctuary and “related tasks in assisting the priests.” They kept the courts and chambers and the purifying of the holy things; they saw to the showbread and the flour and cakes of the grain offerings and kept the measures; they stood morning and evening to give thanks and praise; and they were present whenever burnt offerings were offered on the sabbaths, new moons and feasts.

      That last duty is easy to misread in the King James, which says the Levites were “to offer all burnt sacrifices.” A modern translation reads verse 31 as “whenever burnt offerings are offered,” and offering on the altar remained the priests' (the note at verse 14). The Levites slaughtered sacrifices and sang; the priests offered. The chapter's closing words sum up the whole: the Levites kept the charge of the tabernacle, of the holy place, and “of the sons of Aaron their brethren” (verse 32).
    sources: [bd-aaronic-priesthood, bd-levites, nrsvue]

christ: |
  The chapter orders a priesthood of service: Aaron's sons set apart “to bless in his name for ever” (verse 13), and the Levites at their side. That lesser priesthood continued in Aaron's house until John the Baptist, a priest in that order (his part is told with Zacharias's course, [[1 Chr. 24:10]]), who restored it in 1829, “until the sons of Levi do offer again an offering unto the Lord in righteousness” ([[D&C 13:1]]). It is no longer limited to one tribe, and the Lord says of those faithful in obtaining the priesthood and magnifying their callings that “they become the sons of Moses and of Aaron” ([[D&C 84:34]]). The Levites of this chapter show what that calling looked like: plain, daily work at the side of others, keeping the house, preparing its bread and giving thanks morning and evening before the LORD.

