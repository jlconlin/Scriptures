chapter: 21
title: Stay Now Thine Hand
tagline: Satan provokes David to number Israel, and the LORD smites the land with pestilence. At Jerusalem the angel's sword is stayed over the threshing floor of Ornan, where David buys the place, builds an altar, and is answered from heaven by fire.
when: 'David''s reign, just before he begins to prepare for the temple ([[1 Chr. 22:1–5]]).'

setting: |
  The census and the plague are told also in [[2 Sam. 24:1–25]], and the site's notes there explain what Chronicles assumes: why the numbering was a sin, the totals (see [[2 Sam. 24:9]] for why the two accounts' figures differ), Gad the seer, David's choice of the LORD's hand, “these sheep,” and the price of the threshing floor.

  Chronicles tells the numbering itself briefly, giving only its results, and adds that Joab did not count Levi and Benjamin; it tells David's offering at the threshing floor more fully than Samuel. It names Satan where Samuel names the LORD, offers three years of famine where Samuel has seven, shows the angel with a drawn sword over Jerusalem and the elders in sackcloth, calls Araunah “Ornan” and tells of his four sons hiding, sets the price at six hundred shekels of gold, and ends with fire from heaven on the altar.

  The compilers of Chronicles chose from their sources what suited their purpose and dwelt most on the religious side of the history and “the progress of temple worship in Jerusalem.” In 1 Chronicles this chapter stands where the story turns to the temple: the next chapter opens with David naming the place, and Solomon later builds “in the place that David had prepared in the threshingfloor of Ornan the Jebusite” ([[2 Chr. 3:1]]).

thread: |
  Chronicles tells the census mainly for where it ends. The numbering takes six verses and the reckoning of it only a few more; the chapter's weight falls on the angel stayed over Jerusalem, the altar David is told to build at the very spot, the field bought for its full price, and the fire from heaven that answers David's offering. On an older reading, the Chronicler told the story to show how God Himself chose and consecrated this spot as Israel's future place of worship: by the angel's appearing there, by the command through Gad to build an altar where the angel stood, and by accepting the offering with fire.

  The chapter's last three verses explain why David kept sacrificing there rather than at the tabernacle in Gibeon, and they run straight into the next chapter's first words: “This is the house of the LORD God, and this is the altar of the burnt offering for Israel” ([[1 Chr. 22:1]]). The chapter division falls in the middle of that thought. David took the success of his plea at Ornan's floor as a sign that this was God's chosen site for the temple. From here the book turns to David's preparations for that house (chapters 22–29).

sections:
  - range: 1-6
    heading: The numbering, against Joab's protest
    plain: |
      Satan rose up against Israel and stirred David to count Israel. David said to Joab and the leaders of the people, “Go, count Israel from Beer-sheba to Dan, and bring me the number so that I may know it.” Joab answered, “May the LORD make His people a hundred times as many as they are! But, my lord the king, are they not all my lord's servants? Why does my lord want this? Why should he bring guilt on Israel?”

      But the king's word overruled Joab. So Joab went out through all Israel and came back to Jerusalem, and gave David the total: in all Israel 1,100,000 men who drew the sword, and in Judah 470,000. But he did not count Levi and Benjamin among them, for the king's command was abhorrent to Joab.
  - range: 7-13
    heading: Three things offered
    plain: |
      God was displeased with this, and He struck Israel. David said to God, “I have sinned greatly by doing this. Now, I beg You, take away Your servant's guilt, for I have acted very foolishly.”

      The LORD spoke to Gad, David's seer: “Go and tell David, ‘This is what the LORD says: I offer you three things. Choose one of them, and I will do it to you.’” So Gad came to David and said, “This is what the LORD says: Choose either three years of famine; or three months of being swept away before your foes while your enemies' sword overtakes you; or three days of the sword of the LORD, pestilence in the land, with the angel of the LORD destroying throughout all Israel's territory. Now decide what answer I should take back to the One who sent me.” David said to Gad, “I am in great distress. Let me fall into the hand of the LORD, for His mercies are very great; but do not let me fall into the hand of man.”
  - range: 14-17
    heading: The angel over Jerusalem
    plain: |
      So the LORD sent a pestilence on Israel, and seventy thousand men of Israel died. God sent an angel to Jerusalem to destroy it, and as he was destroying, the LORD looked, and He relented of the evil, and said to the destroying angel, “Enough! Now hold back your hand.” The angel of the LORD was standing by the threshing floor of Ornan the Jebusite.

      David looked up and saw the angel of the LORD standing between earth and heaven, with a drawn sword in his hand stretched out over Jerusalem. Then David and the elders of Israel, clothed in sackcloth, fell on their faces. David said to God, “Was it not I who ordered the people to be counted? I am the one who has sinned and done great wrong. But these sheep, what have they done? O LORD my God, let Your hand be against me and my father's house, but not against Your people, that they should be struck by the plague.”
  - range: 18-27
    heading: The threshing floor of Ornan
    plain: |
      Then the angel of the LORD commanded Gad to tell David to go up and set up an altar to the LORD on the threshing floor of Ornan the Jebusite. David went up at Gad's word, which he spoke in the name of the LORD. Ornan was threshing wheat; he turned and saw the angel, and his four sons with him hid. When David came to him, Ornan looked, saw David, came out of the threshing floor and bowed down before him with his face to the ground.

      David said to Ornan, “Let me have the site of this threshing floor, so that I may build an altar there to the LORD. Let me have it for the full price, so that the plague may be stopped from the people.” Ornan said, “Take it, and let my lord the king do whatever seems good to him. I will give the oxen for burnt offerings, the threshing sledges for wood, and the wheat for the grain offering. I give it all.” But King David said to Ornan, “No, I will buy it for the full price. I will not take what is yours for the LORD, or offer burnt offerings that cost me nothing.” So David paid Ornan six hundred shekels of gold by weight for the place.

      David built an altar to the LORD there, offered burnt offerings and peace offerings, and called on the LORD, and the LORD answered him from heaven with fire on the altar of burnt offering. Then the LORD spoke to the angel, and he put his sword back into its sheath.
  - range: 28-30
    heading: Why David sacrificed at the threshing floor
    plain: |
      At that time, when David saw that the LORD had answered him at the threshing floor of Ornan the Jebusite, he sacrificed there. For the tabernacle of the LORD that Moses made in the wilderness, and the altar of burnt offering, were then at the high place at Gibeon; but David could not go there to inquire of God, because he was terrified of the sword of the angel of the LORD.

notes:
  - ref: 1
    phrase: And Satan stood up against Israel
    kind: history
    title: Satan, where Samuel has the LORD
    body: |
      Chronicles names Satan as the one who moved David to the census, where Samuel's account opens with the anger of the LORD and says “he moved David against them” ([[2 Sam. 24:1]]). The Church's footnotes read the two verses together. At Samuel's verse the footnote judges that “apparently something is missing” and that Satan should be the one meant by “he,” pointing here; at this verse the footnote on “Satan” sends the reader to the Topical Guide's “Devil.” The site's note at [[2 Sam. 24:1]] follows what that reading does to Samuel's verse, and agrees.

      The Hebrew word is *śāṭān*, “adversary,” which is also the name of the superhuman adversary of God; the Church's footnote takes it here as the devil.
    sources: [lds-scriptures, oshb-wlc, bdb]

  - ref: 3
    phrase: why will he be a cause of trespass to Israel?
    kind: words
    title: A cause of trespass to Israel
    body: |
      Joab's last question, found only in Chronicles, names who would pay for the king's census: Israel. “Trespass” is *ʾašmâ*, “wrongdoing, guiltiness”; Joab asks why the king would bring guilt on the whole people.

      The chapter bears Joab out. “God was displeased with this thing; therefore he smote Israel” (verse 7), and seventy thousand of the people died (verse 14), while David pleads that the hand be on him and his father's house, “but not on thy people” (verse 17). Why the census itself was a sin is weighed at [[2 Sam. 24:3]].
    sources: [oshb-wlc, bdb, lds-scriptures]

  - ref: 6
    phrase: But Levi and Benjamin counted he not among them
    kind: history
    title: Levi and Benjamin not counted
    body: |
      Joab's count left out two tribes, and Chronicles gives his reason: “the king's word was abominable to Joab.” Samuel has nothing that corresponds to this verse. Levi was set apart by the law: “Only thou shalt not number the tribe of Levi, neither take the sum of them among the children of Israel” ([[Num. 1:49]]), that is, not counted as liable to military service, though the Levites were numbered separately ([[Num. 3:15]]).

      For Benjamin the text gives no reason of its own. Chronicles says later that the count was never finished: “Joab the son of Zeruiah began to number, but he finished not, because there fell wrath for it against Israel” ([[1 Chr. 27:24]]). On one older reading, that is why Benjamin was left out: David, conscious of his sin, stopped the numbering before it was complete.
    sources: [cambridge-chronicles, keil-chronicles, lds-scriptures]

  - ref: 15
    phrase: the LORD beheld, and he repented him of the evil
    kind: scripture
    title: Who repented? The Joseph Smith Translation
    body: |
      The Joseph Smith Translation moves the repenting from the LORD to Israel. The King James says that as the angel was destroying, “the LORD beheld, and he repented him of the evil.” The revision reads: “and God said to the angel, Stay now thine hand, it is enough; for as he was destroying, the Lord beheld Israel, that he repented him of the evil; therefore the Lord stayed the angel that destroyed.” What the Lord saw was Israel's repentance, and the staying of the angel follows from it (“therefore”).

      Samuel's account of the same moment ([[2 Sam. 24:16]]) has the same change, worded more plainly: “for the people repented, and the Lord stayed the hand of the angel, that he destroyed not the people.” The revision makes only three changes in 1 Chronicles, all of them word changes that make the text more readable; this one “also corrects the concept of the Lord repenting.” It agrees with what the revision does elsewhere with the same phrase, explained at [[Gen. 6:6]].
    sources: [jst-1-chr-21, nyman-jst-historical, lds-scriptures]

  - ref: 25
    phrase: six hundred shekels of gold by weight
    kind: history
    title: Six hundred shekels of gold
    body: |
      Chronicles' price is much larger than Samuel's, and on one older reading the two figures belong to one sale. Samuel says David “bought the threshingfloor and the oxen for fifty shekels of silver” ([[2 Sam. 24:24]]); Chronicles says he gave six hundred shekels of gold “for the place.” That reading takes Chronicles to price the floor alone and Samuel the floor and oxen together, and judges Samuel's text probably damaged: it may once have read “bought the threshing floor for money, even six hundred shekels, and the oxen for money, even fifty shekels.” It also takes the “threshing floor” to have included the temple mount ([[1 Chr. 22:1]]). The site's note at [[2 Sam. 24:24]] gives David's reason for paying at all.
    sources: [cambridge-chronicles, lds-scriptures]

  - ref: 26
    phrase: he answered him from heaven by fire upon the altar of burnt offering
    kind: history
    title: Answered from heaven by fire
    body: |
      The fire is Chronicles' own: Samuel says only that “the LORD was entreated for the land, and the plague was stayed from Israel” ([[2 Sam. 24:25]]). David “called upon the LORD; and he answered him,” and the answer came as fire on the altar, followed at once by the angel sheathing his sword (verse 27): the LORD's answer and the end of the plague come together.

      Two other accounts tell of fire consuming the offering on a new altar. At the tabernacle's first offerings “there came a fire out from before the LORD, and consumed upon the altar the burnt offering” ([[Lev. 9:24]]), and when Solomon finished praying at the temple's dedication “the fire came down from heaven, and consumed the burnt offering and the sacrifices” ([[2 Chr. 7:1]]). Fire fell at the beginning of the altar's service in the wilderness, here, and at the temple built on this spot. Fire from heaven on Elijah's altar at Carmel is the note at [[1 Kgs. 18:38]].
    sources: [lds-scriptures]

  - ref: 29
    phrase: were at that season in the high place at Gibeon
    kind: history
    title: Why David sacrificed at Ornan’s floor
    body: |
      Verses 28–30 explain why David went on offering sacrifice at the threshing floor rather than at the tabernacle's altar. The tabernacle Moses made, with its altar of burnt offering, stood at Gibeon, where David had left Zadok and the priests to offer the burnt offerings ([[1 Chr. 16:39]]–40; the note there). David “could not go before it to inquire of God,” because he was terrified of the angel's sword. So he worshipped where the LORD had answered him.

      Read with the chapter that follows, the verses tell how a temple site was found. The destroying angel stood at the threshing floor, Gad's command sent David to build there, and the slaughter was stayed by the sacrifice offered on that spot. One Latter-day Saint reading takes the angel's appearing at that place as a revelation of where the Lord wanted His temple: the threshing floor was a place of theophany, of seeing a divine being, and of sacrifice, and the temple had to be built there. David drew the same conclusion in his own words: “This is the house of the LORD God, and this is the altar of the burnt offering for Israel” ([[1 Chr. 22:1]]).
    sources: [bowen-mount-lord-provided, lds-scriptures]

christ: |
  At Ornan's threshing floor the slaughter of Jerusalem was stopped where David's sacrifice was offered, after David asked that the LORD's hand fall “on me, and on my father's house; but not on thy people” (verse 17). One Latter-day Saint reading notes that Jesus was one of that “father's house”: the Son of David later suffered and died very near this site for David's sins and the sins of all, and the temple's sacrifices, later offered on this site ([[2 Chr. 3:1]]), looked forward to His sacrifice, which, unlike the slaughter at Ornan's floor, was not stopped. The mercy David trusted when he chose to “fall now into the hand of the LORD; for very great are his mercies” (verse 13) rests for a disciple now on that offering, and it is received as David received it: by confessing “I have sinned greatly” ([[1 Chr. 21:8]]) and calling on the LORD, who answered from heaven.

explore: |
  - **The same story in Samuel.** [[2 Sam. 24:1–25]], with the site's notes on the census, the numbers, Gad, and the price.
  - **The place named.** [[1 Chr. 22:1]]; [[2 Chr. 3:1]]; Abraham's offering on Moriah, [[Gen. 22:1–14]].
  - **Fire on the altar.** [[Lev. 9:24]]; [[1 Kgs. 18:38]]; [[2 Chr. 7:1]].
  - **The census unfinished.** [[1 Chr. 27:23–24]].
  - **Theophany and sacrifice at the temple's site.** An *Interpreter* article on the temple's founding stories follows the threshing floor from Isaac's offering to the latter-day temples (in this chapter's sources).

