chapter: 27
title: Month by Month
tagline: The last of David's orders turns from the house of the LORD to the kingdom. Twelve captains, most of them his mighty men, each lead a course of the army for a month of the year; a prince stands over each tribe; stewards keep the king's fields and flocks; counsellors stand at his side. And the one number the chapter will not give is the people's.
when: 'The last years of David’s reign, closing the orders he set when he “was old and full of days” ([[1 Chr. 23:1]]); verses 23–24 look back to the census of [[1 Chr. 21]].'

setting: |
  Chapters 23–26 set the Levites, the priests, the singers, the porters and the treasurers in order for the house Solomon would build. Chapter 27 does the same for the rest of the kingdom, in four lists: the army in twelve monthly courses (verses 1–15), the princes of the tribes (16–22), with a remark on the census (23–24), the stewards of the king's own property (25–31), and the men closest to him (32–34). One older reading explains why these lists stand here, right after the Levites: at the end of his reign David set out to give the kingdom's civil and military order a settled form as well. The courses of the army are named nowhere else in the Old Testament. The last list overlaps the lists of David's officials in Samuel and in [[1 Chr. 18:15–17]], but it names the king's inner circle of counsellors rather than the officers of state.

  The princes' list counts thirteen: it gives Levi a prince and Aaron's house another (Zadok), and gives Manasseh two, one for “the half tribe of Manasseh” and one for “the half tribe of Manasseh in Gilead.” It has no prince for Gad or for Asher, and the text does not say why.

thread: |
  The chapter shows, in lists, what the kingdom David would hand to Solomon was made of. Its captains are the men who had stood with him from the start: Jashobeam, Benaiah, Asahel and most of the rest come from the roll of mighty men in chapter 11, now each over twenty-four thousand for a month of the year. Each tribe the list names has its prince, the king's fields, vineyards, olive groves and herds each have a keeper, and the king has his counsellors.

  The army is numbered course by course, but the people as a whole go uncounted. In the middle of the lists the Chronicler stops to say that David did not number those under twenty, “because the LORD had said he would increase Israel like to the stars of the heavens” (verse 23), and that the count Joab began was never finished and never written into the king's record (verse 24). The kingdom is ordered down to the camels and the cellars of oil, but its people are left to the LORD's promise.

sections:
  - range: 1-15
    heading: Twelve courses for twelve months
    plain: |
      This is the list of the Israelites by their numbers: the heads of families and the commanders of thousands and of hundreds, and their officers, who served the king in everything to do with the divisions that came on duty and went off duty month by month through the whole year. Each division had twenty-four thousand men.

      Over the first division, for the first month, was Jashobeam the son of Zabdiel. He was of the family of Perez, and the chief of all the army's commanders for the first month. For the second month, Dodai the Ahohite, with Mikloth also a leader in his division. For the third month, Benaiah the son of Jehoiada, a chief priest; this is the Benaiah who was a mighty man among the thirty and over the thirty, and his son Ammizabad was in his division. For the fourth month, Asahel the brother of Joab, and after him Zebadiah his son. For the fifth, Shamhuth the Izrahite; for the sixth, Ira the son of Ikkesh the Tekoite; for the seventh, Helez the Pelonite, of Ephraim; for the eighth, Sibbecai the Hushathite, of the family of Zerah; for the ninth, Abiezer of Anathoth, of Benjamin; for the tenth, Maharai the Netophathite, of the family of Zerah; for the eleventh, Benaiah the Pirathonite, of Ephraim; for the twelfth, Heldai the Netophathite, of Othniel's family. In each division were twenty-four thousand.
  - range: 16-24
    heading: The princes of the tribes
    plain: |
      Over the tribes of Israel: over Reuben, Eliezer the son of Zichri; over Simeon, Shephatiah the son of Maachah; over Levi, Hashabiah the son of Kemuel; over Aaron's house, Zadok; over Judah, Elihu, one of David's brothers; over Issachar, Omri the son of Michael; over Zebulun, Ishmaiah the son of Obadiah; over Naphtali, Jerimoth the son of Azriel; over Ephraim, Hoshea the son of Azaziah; over the half tribe of Manasseh, Joel the son of Pedaiah; over the half tribe of Manasseh in Gilead, Iddo the son of Zechariah; over Benjamin, Jaasiel the son of Abner; over Dan, Azareel the son of Jeroham. These were the princes of the tribes of Israel.

      David did not count those twenty years old and under, because the LORD had said He would make Israel as many as the stars of the sky. Joab the son of Zeruiah began to count, but he did not finish, because wrath came on Israel for it, and the number was never entered in the record of King David's reign.
  - range: 25-31
    heading: The keepers of the king's property
    plain: |
      Azmaveth the son of Adiel was over the king's treasuries, and Jehonathan the son of Uzziah over the storehouses in the country, the cities, the villages and the towers. Ezri the son of Chelub was over the field workers who tilled the ground. Shimei the Ramathite was over the vineyards, and Zabdi the Shiphmite over the produce of the vineyards for the wine cellars. Baal-hanan the Gederite was over the olive and sycamore trees in the lowlands, and Joash over the stores of oil. Shitrai the Sharonite was over the herds that grazed in Sharon, and Shaphat the son of Adlai over the herds in the valleys. Obil the Ishmaelite was over the camels, Jehdeiah the Meronothite over the donkeys, and Jaziz the Hagerite over the flocks. All these were the officials over King David's property.
  - range: 32-34
    heading: The king's counsellors
    plain: |
      Jonathan, David's uncle, was a counsellor, a man of understanding and a scribe, and Jehiel the son of Hachmoni was with the king's sons. Ahithophel was the king's counsellor, and Hushai the Archite was the king's friend. After Ahithophel came Jehoiada the son of Benaiah, and Abiathar. And the commander of the king's army was Joab.

notes:
  - ref: 1
    phrase: which came in and went out month by month throughout all the months of the year
    kind: history
    title: A month on duty
    body: |
      The army in this chapter is a rotation: twelve divisions of twenty-four thousand, each on duty for one month of the year. “Came in and went out” is the language of coming on duty and going off it, as the priests and Levites do in [[2 Chr. 23:8]]. One older reading doubts that the division on duty was marched to Jerusalem and kept under arms there for its month; it takes the course to be a force ready to answer its commanders if anything happened, while the rest of the army could be called up if needed. The courses are named nowhere else in the Old Testament, but Solomon would run his levy of workers the same way: “ten thousand a month by courses: a month they were in Lebanon, and two months at home” ([[1 Kgs. 5:14]]), though the Hebrew word there is a different one.

      The army is ordered in the same terms as the priests. The army's “course” (*maḥălōqet*) is the Hebrew word the King James renders “divisions” when David sets the sons of Aaron in their twenty-four orders ([[1 Chr. 24:1]]): the men who kept the kingdom and the men who served at the altar were both divided into courses that took their turns. The same older reading ties the courses to the census of chapter 21, taken, on its reading, to leave the kingdom to Solomon “strong within and mighty without.” The chapter itself points back to that census in verses 23–24.
    sources: [cambridge-chronicles, keil-chronicles, oshb-wlc, lds-scriptures]

  - ref: 7
    phrase: Asahel the brother of Joab, and Zebadiah his son after him
    kind: history
    title: Asahel's course, and his son after him
    body: |
      Asahel heads the fourth course, though Abner had killed him at the beginning of David's reign. He was one of the thirty and Joab's youngest brother, swift of foot, and Abner killed him in the pursuit after the fight at the pool of Gibeon ([[2 Sam. 2:18–23]]), a death Joab later avenged ([[2 Sam. 3:27]]). That was in the years of the two kingdoms, long before David divided his army into courses. One older reading takes “Zebadiah his son after him” as the sign of his death: the son held the command, and the course kept the father's name in his honor.

      Nine of the twelve captains come from the roll of mighty men in chapter 11 (the note at [[1 Chr. 11:10]] names them). The chapter adds a son in two places: Asahel's Zebadiah here, and Benaiah's son Ammizabad in his father's course (verse 6).
    sources: [keil-chronicles, bd-asahel, lds-scriptures]

  - ref: 18
    phrase: Elihu, one of the brethren of David
    kind: history
    title: Elihu, or Eliab
    body: |
      The prince of Judah was one of David's own brothers, and the Septuagint names him Eliab: “for Juda, Eliab of the brethren of David.” The Hebrew has Elihu. Eliab was Jesse's firstborn ([[1 Chr. 2:13]]), the son Samuel first took for the LORD's anointed before the LORD chose David ([[1 Sam. 16:6]]).
    sources: [lxx-rahlfs, lds-scriptures]

  - ref: 24
    phrase: neither was the number put in the account of the chronicles of king David
    kind: history
    title: A count that never reached the record
    body: |
      Chronicles comes back to the census of chapter 21 to say why it stopped: Joab “began to number, but he finished not, because there fell wrath for it against Israel.” In chapter 21 Joab, to whom “the king's word was abominable,” left Levi and Benjamin out of his count ([[1 Chr. 21:6]]), and “God was displeased with this thing; therefore he smote Israel” ([[1 Chr. 21:7]]); the note at [[1 Chr. 21:6]] gives one older reading that takes this unfinished count as the reason Benjamin was left out. Chapter 21 reports the sum Joab gave David ([[1 Chr. 21:5]]); this verse adds that the number was not put in the chronicles of King David. Samuel's figures for the same census differ, and the site's note at [[2 Sam. 24:9]] treats them.

      The “chronicles of king David” are in Hebrew *diḇrê hayyāmîm*, the acts of the days: a daily record of events, the same phrase that names the royal records Kings cites. Such records are the subject of the note at [[1 Kgs. 14:19]].
    sources: [lds-scriptures, bdb]

  - ref: 33
    phrase: 'And Ahithophel was the king’s counsellor: and Hushai the Archite was the king’s companion'
    kind: history
    title: Two counsellors, before the revolt
    body: |
      Chronicles never tells Absalom's revolt, but its list of David's counsellors names the two counsellors who took opposite sides in it. Ahithophel, “David's counsellor” ([[2 Sam. 15:12]]), went over to Absalom; Hushai, “David's friend” ([[2 Sam. 15:37]]), went back to Jerusalem and defeated Ahithophel's counsel. Ahithophel then went home and hanged himself ([[2 Sam. 17:23]]). The site tells that story at [[2 Sam. 15:31]] and [[2 Sam. 17:14]], and explains at [[2 Sam. 15:37]] that “the king's companion” here, “David's friend” there, is a title held at court. In this list they stand side by side, and verse 34 names the men who came after Ahithophel.
    sources: [bd-ahithophel, lds-scriptures]

christ: |
  The promise Chronicles gives as the reason David did not count the young, that the LORD “would increase Israel like to the stars of the heavens” (verse 23), is the promise to Abraham ([[Gen. 15:5]]), and among that covenant's assurances was that Christ would come through Abraham's lineage. Through Christ that promise reaches past Abraham's descendants by birth: “if ye be Christ's, then are ye Abraham's seed, and heirs according to the promise” ([[Gal. 3:29]]). Those who come to Christ through the ordinances of the gospel are made heirs of that covenant, and its promise of posterity “as innumerable as the stars” is renewed with each individual who receives the ordinance of celestial marriage ([[D&C 132:29–33]]).

