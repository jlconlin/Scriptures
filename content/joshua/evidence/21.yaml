chapter: 21
claims:
  - where: 'when'
    claim: 'The request is made at Shiloh, after the division of the land by lot was ended'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/19?lang=eng'
    quote: 'divided for an inheritance by lot in Shiloh before the LORD, at the door of the tabernacle of the congregation. So they made an end of dividing the country.'
  - where: 'setting'
    claim: 'The Levites had been given no landed inheritance; they were custodians of the tabernacle'
    key: ot-minute-josh-21
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-21'
    quote: 'Elsewhere in the book of Joshua, the Levites were given no landed inheritance but rather were assigned to be the custodians of the tabernacle.'
  - where: 'setting'
    claim: 'The Levites came to Eleazar the priest, their chief, not only to Joshua the commander'
    key: ot-minute-josh-21
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-21'
    quote: 'Appropriately, the heads of the Levitical families came not to Joshua, the military commander, but rather to Eleazar, the priest (effectively their chief).'
  - where: 'setting'
    claim: 'Moses had been commanded to give the Levites cities and suburbs (Num. 35:2); Chronicles repeats the list (1 Chr. 6:54)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/6?lang=eng'
    quote: 'Now these are their dwelling places throughout their castles in their coasts, of the sons of Aaron, of the families of the Kohathites: for theirs was the lot.'
  - where: 'thread'
    claim: 'Forty-eight is probably a deliberately symbolic number, a multiple of twelve (Smoot)'
    key: ot-minute-josh-21
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-21'
    quote: 'A total of forty-eight towns were so designated (verses 41–42), probably a deliberately symbolic number (forty-eight being a multiple of twelve).'
  - where: 'thread'
    claim: 'The book demonstrates the Lord''s faithfulness in keeping His covenant with Abraham'
    key: scripture-helps-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/19-joshua-1-8-23-24?lang=eng'
    quote: 'This book demonstrates the Lord’s faithfulness in keeping His covenant with Abraham to give the Israelites the promised land.'
  - where: 'section 1 plain'
    claim: '“Suburbs” rendered as pasture land: the Hebrew migrash is common land, perhaps originally pasture-land, especially around the Levitical cities'
    key: bdb
    url: 'https://biblehub.com/hebrew/4054.htm'
    quote: 'common, common-land, open land (perhaps originally pasture-land, as place of [cattle] driving) … especially as surrounding Levitical cities Numbers 35:2,3,4,5,7; Joshua 14:4; Joshua 21:2'
  - where: 'note 21:4 “The priests'' towns in the south”'
    claim: 'One older reading (quoting Calvin): God placed the priests where He would choose for His temple'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/21.htm'
    quote: '"This did not happen by chance; but God, according to His wonderful counsel, placed them just in that situation which He had determined to select for His own temple" (Calvin).'
  - where: 'note 21:4 “The priests'' towns in the south”'
    claim: 'Judah, Simeon and Benjamin later lay within the southern kingdom; priesthood authority remained in the south (Smoot)'
    key: ot-minute-josh-21
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-21'
    quote: 'Importantly, all three of these territories would later be subsumed under the Southern Kingdom of Judah at the time of the divided monarchy. The implications are clear: priesthood authority remained in the south.'
  - where: 'note 21:12 “Hebron for the priests, its fields for Caleb”'
    claim: 'Hebron given to Caleb because he wholly followed the LORD (Josh. 14:14)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/14?lang=eng'
    quote: 'Hebron therefore became the inheritance of Caleb the son of Jephunneh the Kenezite unto this day, because that he wholly followed the LORD God of Israel.'
  - where: 'note 21:43 “All the land, and the land not yet taken”'
    claim: 'The land sworn to the fathers was the promise to Joshua at the start of the book'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/1?lang=eng'
    quote: 'for unto this people shalt thou divide for an inheritance the land, which I sware unto their fathers to give them.'
  - where: 'note 21:43 “All the land, and the land not yet taken”'
    claim: 'Smoot: verses 44–45 are contradicted by Judges and by Josh. 15:63; 16:10'
    key: ot-minute-josh-21
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-21'
    quote: 'This, however, is plainly contradicted not only by the book of Judges, which picks up narratively where Joshua ends and features protracted difficulties with various Canaanite petty kings, but also by certain passages within the book of Joshua itself (for example, 15:63; 16:10).'
  - where: 'note 21:43 “All the land, and the land not yet taken”'
    claim: 'Smoot: the overstatement may be deliberate irony, building tension with what follows'
    key: ot-minute-josh-21
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-21'
    quote: 'This overstatement might be an attempt at deliberate irony on the part of the author, perhaps attempting to convey what the Israelites thought was their situation at the time in order to ratchet up the narrative tension with what comes next'
  - where: 'note 21:45 “Not one word failed”'
    claim: 'Solomon at the temple dedication: not one word of the LORD''s promise by Moses had failed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'that hath given rest unto his people Israel, according to all that he promised: there hath not failed one word of all his good promise, which he promised by the hand of Moses his servant.'
  - where: 'note 21:45 “Not one word failed”'
    claim: 'Joshua turns the words into a warning (Josh. 23:15)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/23?lang=eng'
    quote: 'so shall the LORD bring upon you all evil things, until he have destroyed you from off this good land which the LORD your God hath given you.'
  - where: 'note 21:45 “Not one word failed”'
    claim: 'Joshua says at the end of his life that not one good thing has failed (Josh. 23:14)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/23?lang=eng'
    quote: 'not one thing hath failed of all the good things which the LORD your God spake concerning you'
  - where: 'note 21:43 “All the land, and the land not yet taken”'
    claim: 'Josh. 13:1: very much land remained to be possessed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/13?lang=eng'
    quote: 'there remaineth yet very much land to be possessed'
  - where: 'christ'
    claim: 'Hebrews: if Joshua had given them rest, God would not afterward have spoken of another day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/4?lang=eng'
    quote: 'For if Jesus had given them rest, then would he not afterward have spoken of another day.'
  - where: 'christ'
    claim: 'Hebrews: a rest remains to the people of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/4?lang=eng'
    quote: 'There remaineth therefore a rest to the people of God.'
  - where: 'christ'
    claim: 'The Lord''s word shall all be fulfilled, by His own voice or His servants'''
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/1?lang=eng'
    quote: 'though the heavens and the earth pass away, my word shall not pass away, but shall all be fulfilled, whether by mine own voice or by the voice of my servants, it is the same.'
