chapter: 17
claims:
  - where: when
    claim: 'The land is divided by lot before Eleazar the priest and Joshua'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/17?lang=eng'
    quote: 'And they came near before Eleazar the priest, and before Joshua the son of Nun, and before the princes'
  - where: setting
    claim: 'Chapter 16 opens the lot of the children of Joseph and says Manasseh and Ephraim took their inheritance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/16?lang=eng'
    quote: 'So the children of Joseph, Manasseh and Ephraim, took their inheritance.'
  - where: setting
    claim: 'Ephraim is described first, Manasseh in chapter 17, tersely'
    key: ot-minute-josh-16
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-16'
    quote: 'Ephraim’s inheritance is described first (16:5–10), followed by a description of Manasseh’s inheritance (chapter 17). Unlike the description he gave of Judah’s territory, which is extensive, the author’s description of the Josephites’ inheritance is fragmentary and terse.'
  - where: setting
    claim: 'Machir took Gilead under Moses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/32?lang=eng'
    quote: 'And the children of Machir the son of Manasseh went to Gilead, and took it, and dispossessed the Amorite which was in it.'
  - where: thread
    claim: 'Manasseh could not drive out the cities and later put them to forced labor'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/17?lang=eng'
    quote: 'Yet the children of Manasseh could not drive out the inhabitants of those cities; but the Canaanites would dwell in that land.'
  - where: section 2 plain
    claim: '“Tribute” rendered as forced labor'
    key: bdb
    url: 'https://biblehub.com/hebrew/4522.htm'
    quote: 'b. of conquered populations, subject to forced labour'
  - where: 'note 17:4 “The daughters’ promise kept”'
    claim: 'The daughters asked for a possession because their father had no son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/27?lang=eng'
    quote: 'Why should the name of our father be done away from among his family, because he hath no son? Give unto us therefore a possession among the brethren of our father.'
  - where: 'note 17:4 “The daughters’ promise kept”'
    claim: 'The LORD told Moses to give the daughters an inheritance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/27?lang=eng'
    quote: 'The daughters of Zelophehad speak right: thou shalt surely give them a possession of an inheritance among their father’s brethren'
  - where: 'note 17:4 “The daughters’ promise kept”'
    claim: 'Heiresses were to marry within the tribe; the daughters married into Manasseh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/36?lang=eng'
    quote: 'And they were married into the families of the sons of Manasseh the son of Joseph, and their inheritance remained in the tribe of the family of their father.'
  - where: 'note 17:5 “Why ten portions”'
    claim: 'One older reading: five male families received five shares, and Hepher’s went to the five daughters'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/17.htm'
    quote: 'The male descendants consisted of five families, and these five received five shares. The sixth family, that of Hepher, was again subdivided into five families, viz., those of his five granddaughters, the daughters of Zelophehad. … each now received her special share of the land.'
  - where: 'note 17:5 “Why ten portions”'
    claim: 'Zelophehad was of Hepher and had only daughters'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/26?lang=eng'
    quote: 'And Zelophehad the son of Hepher had no sons, but daughters'
  - where: 'note 17:13 “Forced labor in place of driving out”'
    claim: 'The goal was to drive out the Canaanites; Josh 17:12, 18 among the passages'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'The goal, expressed repeatedly throughout the Pentateuch and Joshua, was to “drive out” the wicked Canaanites (Exodus 23:28; 33:2; 34:11; Numbers 33:52, 55; Deuteronomy 4:38; 11:23; Joshua 3:10; 13:6; 17:12, 18).'
  - where: 'note 17:13 “Forced labor in place of driving out”'
    claim: 'Tribute cities were permitted in contradiction of the commandments'
    key: brandt-conquest
    url: 'https://www.churchofjesuschrist.org/study/ensign/1973/10/the-conquest-of-canaan?lang=eng'
    quote: 'Some that remained were permitted, in further contradiction of the Lord’s commandments, as tribute cities to Israel. (Judg. 1:27–28.)'
  - where: 'note 17:13 “Forced labor in place of driving out”'
    claim: 'Judges 1:27 tells the same of Manasseh’s cities'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/1?lang=eng'
    quote: 'Neither did Manasseh drive out the inhabitants of Beth-shean and her towns, nor Taanach and her towns'
  - where: 'note 17:14 “Joseph asks Joshua for more”'
    claim: 'The Church’s footnote on “great people” points to Gen. 48:19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/17?lang=eng'
    quote: '14a “great people”: Gen. 48:19.'
  - where: 'note 17:14 “Joseph asks Joshua for more”'
    claim: 'Josh 17:14–18 shows the conquest continued slowly, as Judges 1 also describes'
    key: sc-knowhy-852
    url: 'https://scripturecentral.org/knowhy/why-was-the-conquest-of-jericho-more-important-than-what-some-in-israel-may-have-realized'
    quote: 'Joshua 17:14-18 and 19:47 states that the conquest continued slowly over time, something also described in Judges 1.'
  - where: 'note 17:18 “Iron chariots and a promise”'
    claim: 'The Church’s footnote on “chariots” in 17:18 points to Deut. 20:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/17?lang=eng'
    quote: '18b “chariots”: Deut. 20:1.'
  - where: 'note 17:18 “Iron chariots and a promise”'
    claim: 'Judah could not drive out the valley because of iron chariots'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/1?lang=eng'
    quote: 'And the Lord was with Judah; and he drave out the inhabitants of the mountain; but could not drive out the inhabitants of the valley, because they had chariots of iron.'
  - where: christ
    claim: 'The law of war: be not afraid of chariots, for the LORD is with thee'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/20?lang=eng'
    quote: 'When thou goest out to battle against thine enemies, and seest horses, and chariots, and a people more than thou, be not afraid of them: for the Lord thy God is with thee'
