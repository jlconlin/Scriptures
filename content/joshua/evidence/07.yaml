chapter: 7
claims:
  - where: when
    claim: 'Joshua sends men from Jericho to Ai, after Jericho has fallen'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/7?lang=eng'
    quote: 'And Joshua sent men from Jericho to Ai, which is beside Beth-aven, on the east side of Beth-el'
  - where: setting
    claim: 'Joshua had warned that taking the accursed thing would make the camp a curse and trouble it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/6?lang=eng'
    quote: 'And ye, in any wise keep yourselves from the accursed thing, lest ye make yourselves accursed, when ye take of the accursed thing, and make the camp of Israel a curse, and trouble it.'
  - where: setting
    claim: 'Ai was the next city targeted after Jericho; it took two attempts, 7:2–5 and 8:1–29'
    key: ot-minute-josh-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-7'
    quote: 'After the destruction of Jericho, the city next targeted by the Israelites was Ai. … It took the children of Israel two attempts to capture Ai, narrated in Joshua 7:2–5 and then in 8:1–29.'
  - where: setting
    claim: 'Achan was of Judah, seized and hid spoil, caused the defeat at Ai, and was detected through revelation'
    key: bd-achan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/achan?lang=eng'
    quote: 'A man of the tribe of Judah who seized and attempted to hide the spoils from the battle of Jericho, against the counsel of Joshua. His disobedience resulted in Israel’s defeat at Ai.'
  - where: setting
    claim: 'Later scripture remembers Achan: Josh. 22:20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/22?lang=eng'
    quote: 'Did not Achan the son of Zerah commit a trespass in the accursed thing, and wrath fell on all the congregation of Israel? and that man perished not alone in his iniquity.'
  - where: setting
    claim: 'Chronicles names him Achar, the troubler of Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/2?lang=eng'
    quote: 'And the sons of Carmi; Achar, the troubler of Israel, who transgressed in the thing accursed.'
  - where: thread
    claim: 'Achan acted alone, yet the Lord attributed the sin to all Israel; they lost His protection and were defeated, and it would not be restored until the accursed thing was removed'
    key: scripture-helps-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/19-joshua-1-8-23-24?lang=eng'
    quote: 'Even though Achan acted alone, the Lord attributed the sin to all of Israel. As a result, they lost the Lord’s protection and were defeated by the small army of Ai. The Lord told Joshua that His strength and protection would not be restored until “the accursed thing” was removed'
  - where: thread
    claim: 'The fate of Achan and his family is an ironic inversion of that of Rahab and hers'
    key: ot-minute-josh-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-7'
    quote: 'The fate of Achan and his family, presumably faithful Israelites, is a somewhat ironic inversion of the fate of Rahab and her family, all Canaanites.'
  - where: thread
    claim: 'Rahab and Achan show the herem testing Israelites and Canaanites; the herem is about one''s attitude toward God, not ethnicity'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'The essential message of these contrasting cases is that the ḥērem is not primarily about ethnicity or nationality but about one’s personal attitude toward God.'
  - where: 'note 7:1 “One man took it; Israel trespassed”'
    claim: 'Though Achan acted alone, the Lord attributed the sin to all Israel'
    key: scripture-helps-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/19-joshua-1-8-23-24?lang=eng'
    quote: 'Since any items retained from Jericho were to be consecrated to the Lord, Achan’s actions amounted to stealing from the Lord. Even though Achan acted alone, the Lord attributed the sin to all of Israel.'
  - where: 'note 7:1 “One man took it; Israel trespassed”'
    claim: 'Having covenanted publicly, Israel was responsible as individuals and as a community; the whole community bore the consequences of an individual''s unresolved sin (Achan)'
    key: seely-covenant-renewal
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal'
    quote: 'This corporate responsibility is the foundation for the enforcement of the Mosaic law, since the entire community would bear the consequences of the sin of an individual that went unresolved (see, for example, the story of Achan in Joshua 7).'
  - where: 'note 7:1 “One man took it; Israel trespassed”'
    claim: 'Seely: Israel had publicly committed itself to the covenant and became responsible as individuals and as a community'
    key: seely-covenant-renewal
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal'
    quote: 'The children of Israel, since they had publicly committed themselves to the covenant, became responsible both as individuals as well as a community to obey its stipulations.'
  - where: 'note 7:1 “One man took it; Israel trespassed”'
    claim: 'Joshua 22:20 recalls that wrath fell on all the congregation and that Achan perished not alone'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/22?lang=eng'
    quote: 'Did not Achan the son of Zerah commit a trespass in the accursed thing, and wrath fell on all the congregation of Israel? and that man perished not alone in his iniquity.'
  - where: 'note 7:2 “Ai, the ruin”'
    claim: 'Ai (modern et-Tell) means "ruin," foreshadowing its fate; mentioned at Gen. 12:8 and 13:3 with Abraham'
    key: ot-minute-josh-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-7'
    quote: 'Already mentioned at Genesis 12:8 and 13:3 in connection with Abraham’s sojourning, Ai (modern et-Tell) means simply “ruin” or “desolation,” not so subtly foreshadowing its fate.'
  - where: 'note 7:2 “Ai, the ruin”'
    claim: 'Abraham built an altar between Bethel and Hai'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/12?lang=eng'
    quote: 'having Beth-el on the west, and Hai on the east: and there he builded an altar unto the Lord, and called upon the name of the Lord.'
  - where: 'note 7:9 “What wilt thou do unto thy great name?”'
    claim: 'One older reading: Joshua''s complaint almost amounts to murmuring like Num. 14:2–3, but is faith wrestling with God in prayer, not unbelief'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/7.htm'
    quote: 'almost amounts to murmuring, and sounds very much like the complaint which the murmuring people brought against Moses and Aaron in the desert (Numbers 14:2-3); but … it by no means arose from unbelief, but was simply the bold language of faith wrestling with God in prayer'
  - where: 'note 7:9 “What wilt thou do unto thy great name?”'
    claim: 'The question of v. 9 has its parallels in Moses'' pleas, Ex. 32:11–12; Num. 14:13; Deut. 9:28: how will God preserve His name before the nations'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/7.htm'
    quote: 'The question, "What wilt Thou do with regard to Thy great name?" signifies, according to the parallel passages, Exodus 32:11-12; Numbers 14:13., Deuteronomy 9:28, "How wilt Thou preserve Thy great name … from being misunderstood and blasphemed among the heathen?"'
  - where: 'note 7:9 “What wilt thou do unto thy great name?”'
    claim: 'Moses pleaded that the Egyptians would hear of it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/14?lang=eng'
    quote: 'And Moses said unto the Lord, Then the Egyptians shall hear it, (for thou broughtest up this people in thy might from among them;)'
  - where: 'note 7:19 “Found by the LORD, convicted by his own words”'
    claim: 'One older reading: the guilty man was discovered by lot, the people coming before God by tribes, families, households and men'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/7.htm'
    quote: 'then to cause them to come before God according to their tribes, families, households, and men, that the guilty men might be discovered by lot'
  - where: 'note 7:19 “Found by the LORD, convicted by his own words”'
    claim: 'Achan''s transgression was detected through revelation to Joshua'
    key: bd-achan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/achan?lang=eng'
    quote: 'His transgression was detected through revelation to Joshua, and he was stoned to death.'
  - where: 'note 7:19 “Found by the LORD, convicted by his own words”'
    claim: 'At each step of the identification Achan was given an opportunity to come forward, but refused until exposed'
    key: morgan-achan
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/04/the-sin-of-achan?lang=eng'
    quote: 'At each step in the identification process, the Lord had given Achan an opportunity to come forward and admit his sin, but he had refused until he was directly exposed.'
  - where: 'note 7:19 “Found by the LORD, convicted by his own words”'
    claim: 'One older reading: "give glory to the Lord" is a solemn formula of adjuration to confess the truth before God (cf. John 9:24)'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/7.htm'
    quote: '"Give glory to the Lord:" this is a solemn formula of adjuration, by which a person was summoned to confess the truth before the face of God (cf. John 9:24).'
  - where: 'note 7:19 “Found by the LORD, convicted by his own words”'
    claim: 'The two-witness law (Deut. 17:6) seems not to be met in Achan''s case, condemned though he was the only witness'
    key: sc-knowhy-180
    url: 'https://scripturecentral.org/knowhy/why-could-seantum-be-convicted-without-any-witnesses'
    quote: 'In both Seantum’s and Achan’s cases, a person was condemned for a capital crime, even though he was the only witness.'
  - where: 'note 7:19 “Found by the LORD, convicted by his own words”'
    claim: 'Achan, like Seantum, was detected by revelation, confessed spontaneously out of court, and physical evidence corroborated it; these likely stood in place of witnesses'
    key: sc-knowhy-180
    url: 'https://scripturecentral.org/knowhy/why-could-seantum-be-convicted-without-any-witnesses'
    quote: 'Just as in the case of Achan, Seantum had been detected through revelation, he had confessed to the crime spontaneously and out of court, and obvious physical evidence corroborated that he had committed this criminal act.'
  - where: 'note 7:19 “Found by the LORD, convicted by his own words”'
    claim: 'These factors could likely stand in place of the two or three witnesses'
    key: sc-knowhy-180
    url: 'https://scripturecentral.org/knowhy/why-could-seantum-be-convicted-without-any-witnesses'
    quote: 'Because the case met all of these conditions, it is likely that these factors could stand in the place of the two or three witnesses normally required.'
  - where: 'note 7:21 “Had he only waited”'
    claim: 'Achan covets and retains a fine Mesopotamian mantle, silver and a bar of gold under the herem'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'During the attack on Jericho, he covets and retains some of the spoils that are under the ḥērem: a fine Mesopotamian mantle, a quantity of silver, and a bar of gold (Joshua 7:1, 21).'
  - where: 'note 7:21 “Had he only waited”'
    claim: 'The irony noted (after Younger): had Achan waited until Ai he would have received the plunder God granted; the lesson is trusting and waiting on Jehovah'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'if he had only waited until the battle of Ai in the following chapter, he would have received the plunder that God granted to the Israelites in that case. The lesson, writes Younger, is one of trusting or waiting on Jehovah and obeying his word.'
  - where: 'note 7:21 “Had he only waited”'
    claim: 'Quoted: faith in God would have brought different results'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: '“God’s goodness and fairness were at issue with Achan. He did not believe that God was being fair to him in Jericho’s ḥerem and seized what belonged to God. Faith in God would have brought different results.”'
  - where: 'note 7:21 “Had he only waited”'
    claim: 'At Ai the LORD let Israel take the spoil and cattle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/8?lang=eng'
    quote: 'only the spoil thereof, and the cattle thereof, shall ye take for a prey unto yourselves'
  - where: 'note 7:24 “Why his sons and daughters died with him”'
    claim: 'Because Achan was accursed, he, his household and belongings were destroyed as Jericho was; the scriptures do not clearly explain why his family shared his punishment'
    key: scripture-helps-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/19-joshua-1-8-23-24?lang=eng'
    quote: 'Because Achan was now accursed, he, his household, and his belongings were destroyed, just as the city and people of Jericho were. The scriptures do not clearly explain why Achan’s family shared his punishment.'
  - where: 'note 7:24 “Why his sons and daughters died with him”'
    claim: 'Endnote 36: some suggest the children were brought to view the punishment; others that the family knew and did not report it'
    key: scripture-helps-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/19-joshua-1-8-23-24?lang=eng'
    quote: 'Some have suggested that rather than Achan’s children being killed, they were brought to view his punishment. Others have suggested that his family may have been aware of Achan’s crime and did not report it'
  - where: 'note 7:24 “Why his sons and daughters died with him”'
    claim: 'Smoot: harsh to modern readers but makes sense in an ancient mindset; the Israelites sought to quarantine the effects of the violation'
    key: ot-minute-josh-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-7'
    quote: 'The punishment seems overly harsh to modern readers, but in an ancient mindset it makes some sense. By eliminating Achan and everyone connected to him, the Israelites basically sought to “quarantine” the effects of the violation of the ḥerem in the wider community.'
  - where: 'note 7:24 “Why his sons and daughters died with him”'
    claim: 'Calabro: Achan and his family become objects of the herem themselves'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'His transgression leads to the failure of the first attack on Ai (Joshua 7:1–5). As a result, Achan and his family become objects of the ḥērem themselves (Joshua 7:22–26; compare Deuteronomy 7:25–26).'
  - where: 'note 7:24 “Why his sons and daughters died with him”'
    claim: 'Calabro: Rahab takes the place of Achan in the same tribe of Judah'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Rahab is thus revealed in the end to be the true insider, essentially taking the place of Achan in the very same tribe of Judah.'
  - where: 'note 7:24 “Why his sons and daughters died with him”'
    claim: 'Deuteronomy 24:16 forbids putting children to death for their fathers'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/24?lang=eng'
    quote: 'The fathers shall not be put to death for the children, neither shall the children be put to death for the fathers: every man shall be put to death for his own sin.'
  - where: 'note 7:26 “Achan, Achor, and trouble”'
    claim: 'Achor forms a pun on Achan''s name and on Joshua''s "troubled ... trouble" (ʿkhr); 1 Chr. 2:7 calls him Achar, the troubler of Israel'
    key: ot-minute-josh-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-7'
    quote: 'The sentence was carried out in the valley of Achor (Hebrew ꜥakhor), which forms a pun both on Achan’s name (ꜥakhan) and on Joshua’s question to the guilty party: “Why hast thou troubled [ꜥkhr] us? the Lord shall trouble [ꜥkhr] thee this day” (verse 25).'
  - where: 'note 7:26 “Achan, Achor, and trouble”'
    claim: 'Smoot''s footnote: 1 Chr. 2:7 identifies Achan as Achar, the troubler of Israel'
    key: ot-minute-josh-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-7'
    quote: 'Compare 1 Chronicles 2:7, which identifies Achan as “Achar, the troubler of Israel” (ꜥakhar ꜥokher Yisrael).'
  - where: 'note 7:26 “Achan, Achor, and trouble”'
    claim: 'The verb in Josh. 6:18 "trouble it" is the same verb (H5916) as in 7:25'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'עֲכַרְתָּ֔/נוּ'
  - where: 'note 7:26 “Achan, Achor, and trouble”'
    claim: 'Hosea promises the valley of Achor for a door of hope'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/2?lang=eng'
    quote: 'And I will give her her vineyards from thence, and the valley of Achor for a door of hope'
  - where: 'note 7:26 “Achan, Achor, and trouble”'
    claim: 'Isaiah makes the valley of Achor a place for herds to lie down'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/65?lang=eng'
    quote: 'and the valley of Achor a place for the herds to lie down in, for my people that have sought me.'
  - where: christ
    claim: 'The valley of Achor becomes a door of hope'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/2?lang=eng'
    quote: 'and the valley of Achor for a door of hope'
  - where: christ
    claim: 'After repentance and forgiveness one may succeed where one first failed, through the redemptive work of Jesus Christ'
    key: morgan-achan
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/04/the-sin-of-achan?lang=eng'
    quote: 'After we have participated in the process of repentance and forgiveness, we may have power to succeed where we first have failed. This blessing is made possible through the redemptive work of Jesus Christ.'
  - where: christ
    claim: 'The sins of a few can affect a family, congregation or nation'
    key: morgan-achan
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/04/the-sin-of-achan?lang=eng'
    quote: 'So also can the sins of even a few individuals in a family, a congregation, or a nation have a negative, even calamitous, effect on others.'
  - where: christ
    claim: 'Alma 60:23: the inward vessel cleansed first'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/60?lang=eng'
    quote: 'God has said that the inward vessel shall be cleansed first, and then shall the outer vessel be cleansed also.'
  - where: explore
    claim: 'Calabro''s study treats Rahab and Achan as contrasting responses to the herem'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Rahab and Achan demonstrate contrasting responses to the ḥērem, the one turning to God and obtaining mercy, and the other turning away and suffering destruction.'
  - where: explore
    claim: 'KnoWhy 180 sets Seantum''s conviction (Hel. 9) beside Achan''s'
    key: sc-knowhy-180
    url: 'https://scripturecentral.org/knowhy/why-could-seantum-be-convicted-without-any-witnesses'
    quote: 'Thankfully, a story in the book of Joshua set a precedent that helps explain what happened in Helaman 9.'
  - where: thread
    claim: 'Joshua was not aware of what Achan had done'
    key: morgan-achan
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/04/the-sin-of-achan?lang=eng'
    quote: 'Joshua was not aware of what Achan had done or that his presence in the camp had caused the Lord to withdraw His support from the people.'
  - where: 'note 7:26 “Achan, Achor, and trouble”'
    claim: 'The same verb (H5916) stands in Josh. 6:18, "trouble it"'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'וַ/עֲכַרְתֶּ֖ם'
  - where: 'note 7:24 “Why his sons and daughters died with him”'
    claim: 'After stoning Achan, they burned them and stoned them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/7?lang=eng'
    quote: 'And all Israel stoned him with stones, and burned them with fire, after they had stoned them with stones.'
