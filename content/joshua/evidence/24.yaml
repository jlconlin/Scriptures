chapter: 24
claims:
  - where: 'when'
    claim: 'The farewell is late in Joshua''s life; the assembly is at Shechem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/24?lang=eng'
    quote: 'And Joshua gathered all the tribes of Israel to Shechem'
  - where: 'setting'
    claim: 'Chapter 23 is an address to the elders; chapter 24 a concluding speech to all Israel and a covenant renewal at Shechem'
    key: ot-minute-josh-24
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-24'
    quote: 'While the previous chapter records Joshua’s address to the elders and captains of Israel, the final chapter of the book of Joshua features both Joshua’s concluding speech to Israel as a whole and a covenant renewal ceremony at Shechem (24:1).'
  - where: 'setting'
    claim: 'Shechem lay in a plain close to Ebal and Gerizim'
    key: bd-shechem
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shechem?lang=eng'
    quote: 'situated in a beautiful plain among the mountains of Ephraim, close to the two hills Ebal and Gerizim'
  - where: 'setting'
    claim: 'The speech follows the parts of a covenant: preamble, historical prologue, stipulations, witnesses, deposit'
    key: seely-covenant-renewal
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal'
    quote: 'The Preamble “thus saith the Lord God of Israel” (Joshua 24:2) is followed by the Historical Prologue (see Joshua 24:2–18) … The Stipulations (see Joshua 24:14, 18, 23) … the List of Witnesses includes the people themselves'
  - where: 'setting'
    claim: '“The flood” means the river, the Euphrates, beyond which Abraham''s fathers practiced idolatry'
    key: scripture-helps-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/19-joshua-1-8-23-24?lang=eng'
    quote: 'The word translated as flood in the King James Version actually means “river.” Specifically, it refers to the Euphrates River.'
  - where: 'setting'
    claim: 'The chapter''s last verses tell of the deaths of Joshua and Eleazar and end the book'
    key: ot-minute-josh-24
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-24'
    quote: 'The final section of this chapter, and the concluding postscript to the book of Joshua as a whole, narrates the deaths of Joshua and Eleazar, which mark the passing of a generation (verses 29–33).'
  - where: 'section 1 plain'
    claim: '“The flood” rendered “the River,” the Euphrates'
    key: scripture-helps-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/19-joshua-1-8-23-24?lang=eng'
    quote: 'The word translated as flood in the King James Version actually means “river.”'
  - where: 'section 2 plain'
    claim: '“Sincerity” rendered as wholehearted, complete service'
    key: bdb
    url: 'https://biblehub.com/hebrew/8549.htm'
    quote: 'what is complete, entirely in accord with truth and fact'
  - where: 'thread'
    claim: 'Joshua''s history of God''s dealings emphasizes God''s faithfulness to His covenant'
    key: ot-minute-josh-24
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-24'
    quote: 'The speech therefore served as a sweeping overview of God’s dealings that led Israel to its current situation. This rhetorically served to emphasize God’s faithfulness in upholding His covenant with Israel.'
  - where: 'thread'
    claim: 'The speech has two parts: Joshua speaks (2–15), the people respond (16–18), then a dialogue (19–28)'
    key: ot-minute-josh-24
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-24'
    quote: 'First, Joshua spoke with the people (verses 2–15), who responded (verses 16–18). Joshua then gave a second, concluding speech that was more of a dialogue with the assembly (verses 19–28).'
  - where: 'thread'
    claim: 'The deaths mark the passing of a generation'
    key: ot-minute-josh-24
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-24'
    quote: 'narrates the deaths of Joshua and Eleazar, which mark the passing of a generation (verses 29–33)'

  - where: 'note 24:1 “Why Shechem”'
    claim: 'Shechem was the most ancient sacred town; Abram visited it first, Jacob bought land there'
    key: bd-shechem
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shechem?lang=eng'
    quote: 'The most ancient of the sacred towns of the children of Israel … It was visited by Abram on his first arrival in the promised land (Gen. 12:6); Jacob bought land here (33:18–19; see also Gen. 35:4'
  - where: 'note 24:1 “Why Shechem”'
    claim: 'Abram built an altar at Shechem where the LORD appeared; Jacob hid the gods under the oak by Shechem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/35?lang=eng'
    quote: 'and Jacob hid them under the oak which was by Shechem'
  - where: 'note 24:1 “Why Shechem”'
    claim: 'Older reading: Shechem sanctified by patriarchal memories; chosen because the act renounced idolatry'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/24.htm'
    quote: 'Shechem, a place which was sanctified as no other was for such a purpose as this by the most sacred reminiscences from the times of the patriarchs'
  - where: 'note 24:1 “Why Shechem”'
    claim: 'Older reading: Joshua chose the place because the act renounced idolatry, as verse 23 states'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/24.htm'
    quote: 'so Joshua chose the same place for the renewal of the covenant, because this act involved a practical renunciation on the part of Israel of all idolatry. Joshua expressly states this in Joshua 24:23'
  - where: 'note 24:1 “Why Shechem”'
    claim: 'Older reading: “before God” marks the religious character of the act, not that the ark was there'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/24.htm'
    quote: 'From the expression "before God," it by no means follows that the ark had been brought to Shechem … "Before God" simply denotes in a general sense the religious character of an act'

  - where: 'note 24:14 “Wholehearted service”'
    claim: 'The Hebrew behind “sincerity” is tamim, with emet “truth”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'בְּ/תָמִ֣ים'
  - where: 'note 24:14 “Wholehearted service”'
    claim: 'Tamim means complete, whole, perfect, blameless; in Josh. 24:14 what is complete, entirely in accord with truth'
    key: bdb
    url: 'https://biblehub.com/hebrew/8549.htm'
    quote: 'as neuter adjective = substantive what is complete, entirely in accord with truth and fact … Joshua 24:14'
  - where: 'note 24:14 “Wholehearted service”'
    claim: 'The lexicon heading: complete, whole, perfect, blameless'
    key: bdb
    url: 'https://biblehub.com/hebrew/8549.htm'
    quote: 'Complete, whole, perfect, blameless, without blemish'
  - where: 'note 24:14 “Wholehearted service”'
    claim: 'KnoWhy: the word in Josh. 24:14 means “completely”; the people covenant to serve the Lord rather than other gods'
    key: sc-knowhy-335
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-to-be-perfect'
    quote: 'In this case, God commanded the people to covenant to serve the Lord rather than serving other gods.'
  - where: 'note 24:14 “Wholehearted service”'
    claim: 'KnoWhy: a covenant to follow God''s way is one way to understand perfection'
    key: sc-knowhy-335
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-to-be-perfect'
    quote: 'Thus, a covenant to follow God’s way, rather than any other way, is one possible way to understand perfection.'
  - where: 'note 24:14 “Wholehearted service”'
    claim: 'KnoWhy sets Joshua 24 beside 3 Nephi 12:48'
    key: sc-knowhy-335
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-to-be-perfect'
    quote: 'Just as the people in Joshua 24 covenanted to devote themselves to the Lord and reject paganism completely, so in 3 Nephi people were commanded to reject Mosaic customs in favor of Christ’s new way.'
  - where: 'note 24:14 “Wholehearted service”'
    claim: 'The same Hebrew word, also translated “perfect,” connects with covenants'
    key: sc-knowhy-335
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-to-be-perfect'
    quote: 'The Hebrew equivalent of this word, also translated as “perfect” can sometimes be connected to covenants.'

  - where: 'note 24:15 “Choose you this day”'
    claim: 'Older reading: worship must come from the heart and cannot be forced; the appeal was the strongest admonition to stay faithful'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/24.htm'
    quote: 'as the true worship of the living God must have its roots in the heart, and spring from the heart, and therefore cannot be forced by prohibitions and commands'
  - where: 'note 24:15 “Choose you this day”'
    claim: 'Older reading: the appeal did not release them but admonished them to stay faithful'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/24.htm'
    quote: 'this appeal was not intended to release them from the obligation to serve Jehovah, but rather contained the strongest admonition to remain faithful to the Lord'
  - where: 'note 24:15 “Choose you this day”'
    claim: 'Alma 30 quotes the verse in describing Nephite law: no law against belief'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/30?lang=eng'
    quote: 'For thus saith the scripture: Choose ye this day, whom ye will serve.'
  - where: 'note 24:15 “Choose you this day”'
    claim: 'Alma 30:7: there was no law against a man''s belief'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/30?lang=eng'
    quote: 'Now there was no law against a man’s belief; for it was strictly contrary to the commands of God that there should be a law which should bring men on to unequal grounds.'
  - where: 'note 24:15 “Choose you this day”'
    claim: 'Seely calls the challenge dramatic, after the stipulations'
    key: seely-covenant-renewal
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal'
    quote: 'After Joshua introduced the stipulations of the covenant, he dramatically challenged the people, “Choose you this day whom ye will serve” (Joshua 24:15)'

  - where: 'note 24:19 “Ye cannot serve the LORD”'
    claim: 'From verse 19 the speech is more a dialogue; the covenant renewal occurs in it'
    key: ot-minute-josh-24
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-24'
    quote: 'Joshua then gave a second, concluding speech that was more of a dialogue with the assembly (verses 19–28). The covenant renewal occurred during this second speech, and the people of Israel affirmed their allegiance to Jehovah (verses 20–24).'
  - where: 'note 24:19 “Ye cannot serve the LORD”'
    claim: 'In the covenant pattern the blessings and curses are alluded to in 24:19–29'
    key: seely-covenant-renewal
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal'
    quote: 'The Blessings and Curses are alluded to in Joshua 24:19–29'
  - where: 'note 24:19 “Ye cannot serve the LORD”'
    claim: 'The people''s answers, verses 16, 21, 22, 24'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/24?lang=eng'
    quote: 'And the people said unto Joshua, Nay; but we will serve the LORD.'

  - where: 'note 24:23 “Strange gods among them”'
    claim: 'Josh. 24:23 has haseru et elohe hanekar asher b-, nearly the words of Gen. 35:2'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'הַ/נֵּכָ֖ר'
  - where: 'note 24:23 “Strange gods among them”'
    claim: 'Gen. 35:2 has the same command, hasiru et elohe hanekar asher b-'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'הַ/נֵּכָר֙'
  - where: 'note 24:23 “Strange gods among them”'
    claim: 'The stipulations call the people to repent and put away their strange gods'
    key: seely-covenant-renewal
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal'
    quote: 'The Stipulations (see Joshua 24:14, 18, 23) call for the people to repent and put away their strange gods and renew their exclusive allegiance to the Lord God.'
  - where: 'note 24:23 “Strange gods among them”'
    claim: 'Older reading: no gross idolatry in this generation, which the book shows serving the LORD'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/24.htm'
    quote: 'This appeal does not presuppose any gross idolatry on the part of the existing generation, which would have been at variance with the rest of the book, in which Israel is represented as only serving Jehovah during the lifetime of Joshua.'
  - where: 'note 24:23 “Strange gods among them”'
    claim: 'Older reading: the idols to put away were idols of the heart, that Israel give its heart wholly'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/24.htm'
    quote: 'the idols of the heart, which it was to put away, that it might give its heart entirely to the Lord, who is not content with divided affections, but requires the whole heart'

  - where: 'note 24:25 “The covenant renewed”'
    claim: 'Covenant renewals: the people assembled by their leader, after apostasy or at crisis or transition, to rededicate themselves; Joshua 24 one of them'
    key: seely-covenant-renewal
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal'
    quote: 'when the covenant children—typically following periods of apostasy, or at times of crisis or transition—are assembled by their leader to publicly rededicate themselves to the conditions of the covenant. Among these accounts are the assemblies recorded in Joshua 8:30–35 and chapter 24'
  - where: 'note 24:25 “The covenant renewed”'
    claim: 'The people''s answer in verse 24 is the covenant oath ceremony'
    key: seely-covenant-renewal
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal'
    quote: 'a few verses later we read the rest of the Covenant Oath Ceremony when the people responded to Joshua’s challenge, “The Lord our God will we serve, and his voice will we obey” (Joshua 24:24).'
  - where: 'note 24:25 “The covenant renewed”'
    claim: 'Narrator makes the covenant explicit in verse 25'
    key: ot-minute-josh-24
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-24'
    quote: 'The covenant aspect of the episode was made explicit by the narrator in verse 25'
  - where: 'note 24:25 “The covenant renewed”'
    claim: 'Latter-day Saint scholars showed Benjamin''s assembly fits the biblical pattern; a chart sets Joshua 24 beside Mosiah 1–6'
    key: seely-covenant-renewal
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal'
    quote: 'they have persuasively demonstrated that King Benjamin’s address, and the accompanying assembly, fit the biblical pattern remarkably well … a useful chart of these specific elements in the treaty-covenant pattern in Exodus 19:3–8; Exodus 20–24; the book of Deuteronomy as a whole; Joshua 24; and Mosiah 1–6.'

  - where: 'note 24:26 “A stone that heard”'
    claim: 'Ancient covenants named witnesses, usually deities but often natural phenomena'
    key: seely-covenant-renewal
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal'
    quote: '(5) List of Witnesses: Usually the local deities, but often natural phenomena as well (mountains, rivers, springs, heavens, earth, etc.), are cited as witnesses to the covenant'
  - where: 'note 24:26 “A stone that heard”'
    claim: 'At Shechem the witnesses are the people and the great stone; the writing is the deposit'
    key: seely-covenant-renewal
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal'
    quote: 'the List of Witnesses includes the people themselves (see Joshua 24:22) and the great stone that Joshua erected there (see Joshua 24:26–27). The Deposit and Public Reading is referred to when “Joshua wrote these words in the book of the law of God”'
  - where: 'note 24:26 “A stone that heard”'
    claim: 'Moses'' altar and pillars at Sinai may have served as witnesses as Joshua''s stone; Moses wrote all the words'
    key: seely-covenant-renewal
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal'
    quote: 'it is possible that the altar and the twelve stone pillars erected earlier by Moses (see Exodus 24:4) were invoked to stand as witnesses much as the stone later erected by Joshua (see Joshua 24:27)'
  - where: 'note 24:26 “A stone that heard”'
    claim: 'Moses wrote the words at Sinai: the deposit'
    key: seely-covenant-renewal
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal'
    quote: 'The Deposit and Public Reading occurs when Moses “wrote all the words . . . and . . . took the book of the covenant, and read in the audience of the people” (Exodus 24:4–7).'

  - where: 'note 24:29 “Joshua, the servant of the LORD”'
    claim: 'Joshua lived 110 years like Joseph; 110 the ideal age'
    key: ot-minute-josh-24
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-24'
    quote: 'As did his righteous predecessor Joseph,[1] Joshua lived to be 110 years old, the ideal age in biblical reckoning.'
  - where: 'note 24:29 “Joshua, the servant of the LORD”'
    claim: 'Moses'' 120 years may show his slightly elevated status'
    key: ot-minute-josh-24
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-24'
    quote: 'Note also how Moses lived to be 120 years old (Deuteronomy 34:7), perhaps indicating his (slightly) elevated status over Joshua in the eyes of the biblical historian.'
  - where: 'note 24:29 “Joshua, the servant of the LORD”'
    claim: 'Elsewhere in Joshua “the servant of the LORD” is always Moses; only 24:29 gives it to Joshua (occurrences.mjs: 13 verses)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/1?lang=eng'
    quote: 'Now after the death of Moses the servant of the Lord it came to pass, that the Lord spake unto Joshua the son of Nun, Moses’ minister'
  - where: 'note 24:29 “Joshua, the servant of the LORD”'
    claim: 'Judges retells his death in the same words'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/2?lang=eng'
    quote: 'And Joshua the son of Nun, the servant of the Lord, died, being an hundred and ten years old.'

  - where: 'note 24:31 “While the elders lived”'
    claim: 'Judges: Israel served the LORD while Joshua and the elders lived; then a generation that knew not the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/2?lang=eng'
    quote: 'And the people served the Lord all the days of Joshua, and all the days of the elders that outlived Joshua, who had seen all the great works of the Lord, that he did for Israel.'
  - where: 'note 24:31 “While the elders lived”'
    claim: 'Judges 2:10: another generation which knew not the LORD nor his works'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/2?lang=eng'
    quote: 'And also all that generation were gathered unto their fathers: and there arose another generation after them, which knew not the Lord, nor yet the works which he had done for Israel.'
  - where: 'note 24:31 “While the elders lived”'
    claim: 'The deaths mark the passing of a generation'
    key: ot-minute-josh-24
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-24'
    quote: 'which mark the passing of a generation (verses 29–33)'

  - where: 'christ'
    claim: 'In the New Testament the covenant is embodied in Jesus of Nazareth, its author'
    key: seely-covenant-renewal
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal'
    quote: 'it becomes apparent that indeed “the Word was made flesh” (John 1:14) and that the covenant was embodied in the personage of its author, Jesus of Nazareth.'
  - where: 'christ'
    claim: 'The sacrament is periodic covenant renewal for ourselves'
    key: seely-covenant-renewal
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal'
    quote: 'May we participate often in the covenantal oath ceremonies—the sacrament for periodic covenant renewal for ourselves, and temple work for our dead'
  - where: 'christ'
    claim: 'Renlund: God will not force us; we need to choose whom we will serve'
    key: renlund-choose-you-this-day
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2018/10/choose-you-this-day?lang=eng'
    quote: 'Indeed, God desires, expects, and directs that each of His children choose for himself or herself. He will not force us.'
  - where: 'christ'
    claim: 'Renlund: we need to choose whom we will serve'
    key: renlund-choose-you-this-day
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2018/10/choose-you-this-day?lang=eng'
    quote: 'We need to choose whom we will serve. The magnitude of our eternal happiness depends on choosing the living God and joining Him in His work.'
  - where: 'explore'
    claim: 'Seely''s study sets out the covenant pattern in Joshua 24'
    key: seely-covenant-renewal
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal'
    quote: 'Covenant Renewal: Joshua at Shechem (Joshua 24)'
