chapter: 19
claims:
  - where: when
    claim: 'The chapter ends with the dividing of the land finished at Shiloh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/19?lang=eng'
    quote: 'divided for an inheritance by lot in Shiloh before the LORD, at the door of the tabernacle of the congregation. So they made an end of dividing the country.'
  - where: setting
    claim: 'Chapters 18–19 give the seven remaining lots: Benjamin, Simeon, Zebulun, Issachar, Asher, Naphtali, Dan'
    key: ot-minute-josh-18
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-18'
    quote: 'Seven such remaining allotments are described in chapters 18–19: those belonging to Benjamin (18:11–28), Simeon (19:1–9), Zebulun (19:10–16), Issachar (19:17–23), Asher (19:24–31), Naphtali (19:32–39), and finally Dan (19:40–48).'
  - where: setting
    claim: 'In New Testament times Galilee included the territories of Issachar, Naphtali, Zebulun and Asher'
    key: bd-galilee
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/galilee?lang=eng'
    quote: 'In New Testament times it was the most northerly of the three divisions into which Palestine west of the Jordan was divided and included the territories of Issachar, Naphtali, Zebulun, and Asher.'
  - where: setting
    claim: 'The location of several of Simeon''s towns is unknown'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/19.htm'
    quote: 'we cannot decide this point with any certainty, as the situation of several of the towns is still unknown.'
  - where: setting
    claim: 'The final allotment was given to Joshua; Caleb had already received his'
    key: ot-minute-josh-19
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-19'
    quote: 'The final allotment was given to Joshua himself (Joshua 19:49–50). Caleb, his fellow spy from the previous generation, had already received his inheritance along with the rest of Judah (see 14:6–15), leaving only Joshua to receive his portion.'
  - where: setting
    claim: 'Simeon''s first group of towns lay in the Negeb, the south country'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/19.htm'
    quote: 'the first (Joshua 19:2-6) consisting of thirteen or fourteen towns, all situated in the Negeb (or south country)'
  - where: setting
    claim: 'Dan''s district adjoined Ephraim, Benjamin and Judah'
    key: bd-dan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/dan?lang=eng'
    quote: 'the district assigned to the tribe of Dan was small in area but had an admirable situation, adjoining Ephraim, Benjamin, and Judah'
  - where: thread
    claim: 'Verse 51 is the closing formula of the whole distribution, reaching back to 18:1 and including chapters 14–17'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/19.htm'
    quote: 'Closing formula to the account of the distribution of the land, which refers primarily to Joshua 18:1., as the expression "in Shiloh" shows, but which also includes Joshua 14-17.'
  - where: thread
    claim: 'The chapter ends noting the tabernacle at Shiloh when the allotments were completed'
    key: ot-minute-josh-19
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-19'
    quote: 'The chapter concludes by noting how the tabernacle was stationed at Shiloh at the time of the completion of the allotments (19:51).'
  - where: thread
    claim: 'The division began with the same three parties named in 14:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/14?lang=eng'
    quote: 'which Eleazar the priest, and Joshua the son of Nun, and the heads of the fathers of the tribes of the children of Israel, distributed for inheritance to them.'
  - where: section 4 plain
    claim: '"Coast" renders the Hebrew for border'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/19?lang=eng'
    quote: 'HEB border (also vv. 29, 33–34, 41, 47, 49)'
  - where: section 5 plain
    claim: '"Fenced" renders the Hebrew for fortified'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/19?lang=eng'
    quote: 'HEB fortified'
  - where: section 6 plain
    claim: 'A modern translation reads verse 47 as the Danites losing their territory'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Joshua%2019%3A47&version=NRSVUE'
    quote: 'When the territory of the Danites was lost to them, the Danites went up and fought against Leshem'

  - where: 'note 19:1 “Simeon inside Judah”'
    claim: 'Simeon''s towns lay inside Judah because Judah''s land was more than it needed; the towns were already listed among Judah''s'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/19.htm'
    quote: 'All these eighteen towns have already been enumerated among the towns of Judah (Joshua 15:26-32, Joshua 15:42), and are mentioned again in 1 Chronicles 4:28-32, in just the same order'
  - where: 'note 19:1 “Simeon inside Judah”'
    claim: 'Keil reads it as Jacob''s word of dispersion fulfilled'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/19.htm'
    quote: 'Thus the curse pronounced upon Simeon by Jacob of dispersion in Israel (Genesis 49:7) was fulfilled upon this tribe in a very peculiar manner, and in a different manner from that pronounced upon Levi.'
  - where: 'note 19:1 “Simeon inside Judah”'
    claim: 'Judah''s tract was too large and exposed; Simeon was a fellow son of Leah'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/19.htm'
    quote: 'Judah discovered that the tract allotted to him was too large (see Joshua 19:9), and too much exposed to marauders on the west and south even for his great powers. To Simeon accordingly was allotted a district out of the territory of his kinsman, whose ancestor like his had been the child of Leah'
  - where: 'note 19:1 “Simeon inside Judah”'
    claim: 'Simeon had little later influence and is not mentioned in Moses'' blessing'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/19.htm'
    quote: 'the tribe was destined to have little influence on the subsequent history, to be divided in Jacob and scattered in Israel (Genesis 49:5-7). In the prophecy of Moses he is not even mentioned (Deuteronomy 33)'
  - where: 'note 19:1 “Simeon inside Judah”'
    claim: 'Beer-sheba and Hazar-shual appear in Judah''s list'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/15?lang=eng'
    quote: 'And Hazar-shual, and Beer-sheba, and Bizjothjah,'

  - where: 'note 19:15 “Another Bethlehem”'
    claim: 'There is a second Bethlehem, in Zebulun, named again in Judges 12'
    key: bd-bethlehem
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/bethlehem?lang=eng'
    quote: '(2) In Zebulun (Josh. 19:15; Judg. 12:8, 10).'
  - where: 'note 19:47 “Dan''s lost border and the city it took”'
    claim: '"Too little" is supplied by the KJV; the Hebrew says the border went out from them'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/19.htm'
    quote: 'The words “too little” are inserted in our Version. They are not found in the original Hebrew, which literally means, the border of the children of Dan went out from them, i.e. the border of the children of Dan was extended.'
  - where: 'note 19:47 “Dan''s lost border and the city it took”'
    claim: 'The Hebrew reads "went out ... from them"'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'מֵ/הֶ֑ם'
  - where: 'note 19:47 “Dan''s lost border and the city it took”'
    claim: 'A modern translation: the territory was lost to them'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Joshua%2019%3A47&version=NRSVUE'
    quote: 'When the territory of the Danites was lost to them, the Danites went up and fought against Leshem'
  - where: 'note 19:47 “Dan''s lost border and the city it took”'
    claim: 'Dan''s district was small but well placed; Amorites and Philistines pressed it; the Danites settled at Laish and named it Dan; "from Dan even to Beer-sheba"'
    key: bd-dan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/dan?lang=eng'
    quote: 'the district assigned to the tribe of Dan was small in area but had an admirable situation … There was a good deal of difficulty in holding it against the Amorites (Judg. 1:34) and against the Philistines … Consequently the Danites made for themselves a settlement in the north of Palestine (Judg. 18), around Laish'
  - where: 'note 19:47 “Dan''s lost border and the city it took”'
    claim: 'Dan became the northern limit, "from Dan even to Beer-sheba"'
    key: bd-dan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/dan?lang=eng'
    quote: 'This town is well known as the northern limit of Palestine, which extended “from Dan even to Beer-sheba.”'
  - where: 'note 19:47 “Dan''s lost border and the city it took”'
    claim: 'The move took place after Joshua''s death; Dan is the northernmost city in contrast with Beersheba in the south'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/19.htm'
    quote: 'the Danites of Zorea and Eshtaol went, after Joshua''s death, and conquered the town of Leshem or Laish … it is frequently mentioned as the northernmost city of the Israelites, in contrast with Beersheba, which was in the extreme south of the land'
  - where: 'note 19:47 “Dan''s lost border and the city it took”'
    claim: 'Leshem or Laish lay at the central source of the Jordan'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/19.htm'
    quote: 'Leshem or Laish (Judges 18:7, Judges 18:27), i.e., Dan, which the Onom. describes as viculus quarto a Paneade milliario euntibus Tyrum, was the present Tell el Kadi, or el Leddan, the central source of the Jordan'
  - where: 'note 19:47 “Dan''s lost border and the city it took”'
    claim: 'Dan could not control its land and migrated north'
    key: brandt-conquest
    url: 'https://www.churchofjesuschrist.org/study/ensign/1973/10/the-conquest-of-canaan?lang=eng'
    quote: 'The tribe of Dan was so unable to control the people within its boundaries that they eventually migrated northward and took an inheritance. (Judg. 1:34–35; Judg. 17–18; Josh. 19:47.)'
  - where: 'note 19:47 “Dan''s lost border and the city it took”'
    claim: '19:47 shows the conquest continued slowly over time'
    key: sc-knowhy-852
    url: 'https://scripturecentral.org/knowhy/why-was-the-conquest-of-jericho-more-important-than-what-some-in-israel-may-have-realized'
    quote: 'Joshua 17:14-18 and 19:47 states that the conquest continued slowly over time, something also described in Judges 1.'
  - where: 'note 19:47 “Dan''s lost border and the city it took”'
    claim: 'Judges 18 gives the city''s first name as Laish'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/18?lang=eng'
    quote: 'And they called the name of the city Dan, after the name of Dan their father, who was born unto Israel: howbeit the name of the city was Laish at the first.'
  - where: 'note 19:47 “Dan''s lost border and the city it took”'
    claim: 'The Amorites forced Dan into the hills'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/1?lang=eng'
    quote: 'And the Amorites forced the children of Dan into the mountain: for they would not suffer them to come down to the valley:'

  - where: 'note 19:50 “Joshua''s own city, last of all”'
    claim: 'Joshua received the final allotment; Caleb had already received his'
    key: ot-minute-josh-19
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-19'
    quote: 'The final allotment was given to Joshua himself (Joshua 19:49–50). Caleb, his fellow spy from the previous generation, had already received his inheritance along with the rest of Judah (see 14:6–15), leaving only Joshua to receive his portion.'
  - where: 'note 19:50 “Joshua''s own city, last of all”'
    claim: 'No such divine injunction is found in the Pentateuch; a promise like Caleb''s is inferred'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/19.htm'
    quote: 'We do not find any Divine injunction in the Pentateuch to the effect that Joshua was to receive a special portion in the Land of Canaan. But as Caleb had received a definite promise of the same kind, which is not to be found in its literal form in the Pentateuch, we may conclude that a like promise had been been made to Joshua.'
  - where: 'note 19:50 “Joshua''s own city, last of all”'
    claim: 'Keil: a promise probably received at Kadesh with Caleb''s, not an oracle through the high priest'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/19.htm'
    quote: '"According to the word of the Lord" (lit. "at the mouth of Jehovah") does not refer to a divine oracle communicated through the high priest, but to a promise which Joshua had probably received from God at the same time as Caleb, viz., in Kadesh'
  - where: 'note 19:50 “Joshua''s own city, last of all”'
    claim: 'Timnath-serah was in Joshua''s own tribe; the law of inheritance was not set aside for him'
    key: pulpit-joshua
    url: 'https://biblehub.com/commentaries/pulpit/joshua/19.htm'
    quote: 'He asked for a city, certainly. But the law of the inheritance was not to be set aside for him any more than for the meanest in Israel. Timnath-serah was in his own tribe.'
  - where: 'note 19:50 “Joshua''s own city, last of all”'
    claim: 'Timnath means allotted portion; Judges 2:9 has Timnath-heres; "built" perhaps fortified'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/19.htm'
    quote: 'In Jdg 2:9 the name of the city given to the Israelitish leader is altered to Timnath-heres = “portion of the sun.” … The word Timnath, or Timnah, means “allotted portion,” and was given to several places. … and he built the city] or perhaps rather, fortified it.'
  - where: 'note 19:50 “Joshua''s own city, last of all”'
    claim: 'Joshua and Caleb named as the two of their generation to enter the land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/14?lang=eng'
    quote: 'save Caleb the son of Jephunneh, and Joshua the son of Nun.'
  - where: 'note 19:50 “Joshua''s own city, last of all”'
    claim: 'Judges gives the burial place as Timnath-heres'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/2?lang=eng'
    quote: 'And they buried him in the border of his inheritance in Timnath-heres, in the mount of Ephraim, on the north side of the hill Gaash.'

  - where: christ
    claim: 'Galilee included Zebulun and Naphtali'
    key: bd-galilee
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/galilee?lang=eng'
    quote: 'included the territories of Issachar, Naphtali, Zebulun, and Asher.'
  - where: christ
    claim: 'Jesus dwelt in Capernaum in the borders of Zabulon and Nephthalim'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/4?lang=eng'
    quote: 'And leaving Nazareth, he came and dwelt in Capernaum, which is upon the sea coast, in the borders of Zabulon and Nephthalim:'
