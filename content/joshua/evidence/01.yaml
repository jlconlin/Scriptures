chapter: 1
claims:
  - where: setting
    claim: 'The book is named for Joshua as its principal figure, not its author'
    key: bd-joshua-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joshua-book-of?lang=eng'
    quote: 'So called not because he is the author, but because he is the principal figure in it.'
  - where: setting
    claim: 'Counted by the Jews among the former prophets; more properly a continuation of the five books'
    key: bd-joshua-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joshua-book-of?lang=eng'
    quote: 'The book was regarded by the Jews as the first of the “former prophets,” but it is more properly a continuation of the first Five Books.'
  - where: setting
    claim: 'The chapter is four speeches, and the first frames the book'
    key: ot-minute-josh-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-1'
    quote: 'The opening chapter of the book of Joshua is a series of four speeches: first by God (verses 2–9), then two by Joshua (verses 10–11, 12–15), and finally a response by the Israelites (verses 16–18). The first speech, given by the Lord, acts to frame the ensuing narrative'
  - where: christ
    claim: 'The Church footnote to verse 5 points to Hebrews 13:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/1?lang=eng'
    quote: '“forsake”: 1 Kgs. 6:13; Heb. 13:5; D&C 88:83.'
  - where: thread
    claim: 'The book shows the Lord keeping His covenant to give the land, and Israel''s responsibility to keep His commandments'
    key: scripture-helps-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/19-joshua-1-8-23-24?lang=eng'
    quote: 'This book demonstrates the Lord’s faithfulness in keeping His covenant with Abraham to give the Israelites the promised land. It also describes Israel’s covenant responsibility to remember the Lord and keep His commandments.'

  - where: 'note 1:1 “Moses’ minister”'
    claim: 'Joshua''s earlier life: born in Egypt, fought Amalek, Moses'' minister, one of the spies, appointed successor'
    key: bd-joshua
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joshua?lang=eng'
    quote: 'born in Egypt before the Exodus (Num. 14:26–31); fought with Amalek (Ex. 17:13–14); was Moses’ minister (24:13; 32:17; 33:11); one of the 12 spies (Num. 13:8); appointed Moses’ successor (27:18–19'
  - where: 'note 1:1 “Moses’ minister”'
    claim: '“After the death of Moses” means after the thirty days of mourning'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/1.htm'
    quote: '"After the death of Moses," i.e., after the expiration of the thirty days of general mourning for him (vid., Deuteronomy 34:8).'
  - where: 'note 1:1 “Moses’ minister”'
    claim: 'Already called and installed, Joshua receives the word a second time, to enter on the office'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/1.htm'
    quote: 'the word of the Lord came to him a second time after the death of Moses, with the command to enter upon the office to which he had been called'
  - where: 'note 1:1 “Moses’ minister”'
    claim: 'What was needed was courage and strength, not only knowledge of God''s will'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/1.htm'
    quote: 'the thing required here was not merely that the will of God should be made known to him, but that he should be inspired with courage and strength for the fulfilment of it'

  - where: 'note 1:4 “The land of the Hittites”'
    claim: '“The Hittites” is used here in a broad sense for the Canaanites in general'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/1.htm'
    quote: 'The expression "the Hittites" (see at Genesis 10:15) is used here in a broader sense for Canaanites in general, as in 1 Kings 10:29; 2 Kings 7:6; Ezekiel 16:3.'
  - where: 'note 1:4 “The land of the Hittites”'
    claim: '“This Lebanon” because it could be seen from the camp'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/1.htm'
    quote: 'The demonstrative pronoun "this," in connection with Lebanon, may be explained from the fact that Lebanon, or at all events Anti-libanus, was visible from the Israelitish camp.'
  - where: 'note 1:4 “The land of the Hittites”'
    claim: 'Verses 3–4 follow Deut. 11:24, and “as I said unto Moses” points to Ex. 23:30–31'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/1.htm'
    quote: 'These words, which are connected with Deuteronomy 11:24, so far as the form is concerned, rest upon the promise of God in Exodus 23:30-31, to which the words "as I said unto Moses" refer.'
  - where: 'note 1:4 “The land of the Hittites”'
    claim: 'The boundaries claim the whole land promised to Abraham''s family'
    key: ot-minute-josh-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-1'
    quote: 'The narrative leaves no doubt as to what Israel is owed as a result of God’s promises to its ancestors; the family of Abraham claims the entirety of the land.'

  - where: 'note 1:5 “As I was with Moses”'
    claim: 'The book is a record of God keeping His promise to be with Joshua and the people; it draws parallels between Moses and Joshua'
    key: esplin-as-with-moses
    url: 'https://mi.byu.edu/old-testament-reflections/as-i-was-with-moses'
    quote: 'Indeed, the book of Joshua is a record of God keeping His promise to be with His prophet and people. Repeatedly, the book emphasizes parallels between Moses and his successor, demonstrating God’s guiding both men.'
  - where: 'note 1:5 “As I was with Moses”'
    claim: 'The parallels show God''s consistency, not a human comparison'
    key: esplin-as-with-moses
    url: 'https://mi.byu.edu/old-testament-reflections/as-i-was-with-moses'
    quote: 'Parallels like these, demonstrating God’s consistency, may be different from imperfect human comparisons.'
  - where: 'note 1:5 “As I was with Moses”'
    claim: 'The parallels named: the Jordan, the shoes, victories, power over the sun'
    key: esplin-as-with-moses
    url: 'https://mi.byu.edu/old-testament-reflections/as-i-was-with-moses'
    quote: 'For both men, God was instrumental in providing miraculous military victories (see Exodus 17 and Joshua 6), and through both men, God demonstrated power over the sun (see Exodus 10 and Joshua 10).'
  - where: 'note 1:6 “Three times, and then a fourth”'
    claim: 'The people echo the LORD''s words in verse 18'
    key: ot-minute-josh-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-1'
    quote: 'The Israelites likewise echo the reassurance given by God earlier in verse 9: “Only be strong and of a good courage” (verse 18).'

  - where: 'note 1:8 “Which book of the law”'
    claim: 'The book of the law is most likely an early form of Deuteronomy; Joshua–2 Kings called the Deuteronomistic History'
    key: ot-minute-josh-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-1'
    quote: 'The “book of the law” mentioned by the Lord in verse 8 is most likely an early form of the book of Deuteronomy. Indeed, the books of Joshua through 2 Kings are widely understood as being the Deuteronomistic History (DtrH).'
  - where: 'note 1:8 “Prosperous, and wise”'
    claim: 'The verb of “make thy way prosperous” takes “way” as its object at Josh. 1:8'
    key: bdb
    url: 'https://biblehub.com/hebrew/6743.htm'
    quote: 'human subject with accusative דֶּרֶךְ Deuteronomy 28:29; Joshua 1:8 (D)'
  - where: 'note 1:8 “Prosperous, and wise”'
    claim: 'The causative (Hiphil) of the verb behind “make thy way prosperous” means make prosperous, bring to successful issue'
    key: bdb
    url: 'https://biblehub.com/hebrew/6743.htm'
    quote: 'make prosperous, bring to successful issue'
  - where: 'note 1:8 “Prosperous, and wise”'
    claim: 'The verb of “have good success” first means to be prudent, circumspect'
    key: bdb
    url: 'https://biblehub.com/hebrew/7919.htm'
    quote: 'be prudent, circumspect'
  - where: 'note 1:8 “Prosperous, and wise”'
    claim: 'BDB lists Josh. 1:8 and 1:7 under prosper, have success'
    key: bdb
    url: 'https://biblehub.com/hebrew/7919.htm'
    quote: '6 prosper, have success (compare Dr 1 Samuel 18:5): absolute 1 Samuel 18:15; Isaiah 52:13; Jeremiah 10:21; Jeremiah 20:11; Jeremiah 23:5; Joshua 1:8 (D); with ב, Joshua 1:7 (D)'
  - where: 'note 1:8 “Prosperous, and wise”'
    claim: 'The same verb (taśkîl) stands in verse 8'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'תַּשְׂכִּֽיל'
  - where: 'note 1:11 “Within three days”'
    claim: 'The three days are the latest time to prepare, not a prediction of when the crossing happened'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/1.htm'
    quote: 'is not to be regarded as a prediction of the time when the crossing actually took place, but to be taken as the latest time that could be allowed to the people to prepare for crossing'
  - where: 'note 1:11 “Within three days”'
    claim: 'Counting the spies'' three days in hiding and the three days at the river, at least eight days passed'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/1.htm'
    quote: 'so that at least 4 + 1 + 3, i.e., eight whole days must have intervened between the day when the spies were sent out and the day on which the people crossed the river.'

  - where: 'note 1:15 “Possess it, and enjoy it”'
    claim: '“Enjoy it” renders yrš in its sense “to enjoy possession of,” at Josh. 1:15'
    key: bowen-yrs
    url: 'https://journal.interpreterfoundation.org/we-might-have-enjoyed-our-possessions-and-the-land-of-our-inheritance-hebrew-yrs-and-1-nephi-1721/'
    quote: 'reflects a use of the Hebrew verb yrš in its progressive aspect, “to enjoy possession of.”'
  - where: 'note 1:15 “Possess it, and enjoy it”'
    claim: '“Possessed” in the same verse is the same verb'
    key: bowen-yrs
    url: 'https://journal.interpreterfoundation.org/we-might-have-enjoyed-our-possessions-and-the-land-of-our-inheritance-hebrew-yrs-and-1-nephi-1721/'
    quote: 'they also have possessed [wĕyārĕšû] the land [ʾet-hāʾāreṣ]'
  - where: 'note 1:15 “Possess it, and enjoy it”'
    claim: 'Bowen reads Laman and Lemuel''s complaint in 1 Ne. 17:21 through this use of the verb, and the land of inheritance as an Abrahamic covenant concept'
    key: bowen-yrs
    url: 'https://journal.interpreterfoundation.org/we-might-have-enjoyed-our-possessions-and-the-land-of-our-inheritance-hebrew-yrs-and-1-nephi-1721/'
    quote: 'Examining Laman and Lemuel’s complaint in a legal context helps us better appreciate “land[s] of … inheritance” as expressing a seminal Abrahamic Covenant concept.'

  - where: 'note 1:16 “As they followed Moses”'
    claim: 'Smoot hears the answer as Israel''s, ratifying Joshua as Moses'' successor'
    key: ot-minute-josh-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-1'
    quote: 'The Israelite response to Joshua ratifies his status as Moses’s successor.'
  - where: 'note 1:16 “As they followed Moses”'
    claim: 'Esplin reads the pledge as sustaining the new leader'
    key: esplin-as-with-moses
    url: 'https://mi.byu.edu/old-testament-reflections/as-i-was-with-moses'
    quote: 'Seeking to sustain him, they pledged, “All that thou commandest us we will do'

  - where: christ
    claim: 'Joshua means “Jehovah is salvation,” became “Jesus”; Joshua leading Israel recalls Christ leading the faithful into the celestial kingdom'
    key: scripture-helps-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/19-joshua-1-8-23-24?lang=eng'
    quote: 'In Hebrew, Joshua means “Jehovah is salvation,” and the name eventually evolved through Greek and Latin into English as Jesus. Joshua leading Israel into the promised land can remind us of Jesus Christ leading all the faithful into the ultimate land of promise, the celestial kingdom.'
  - where: christ
    claim: 'The name occurs in the Old Testament in several forms, among them Jesus'
    key: bd-joshua
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joshua?lang=eng'
    quote: 'The name also occurs in the Old Testament under the various forms Jehoshua, Hoshea, Jeshua, and Jesus'
  - where: christ
    claim: 'The Church footnote to “rest” in verse 13 points to D&C 84:24'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/1?lang=eng'
    quote: '“rest”: 2 Ne. 24:3 (1–3); D&C 84:24.'
