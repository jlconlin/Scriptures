chapter: 16
claims:
  - where: when
    claim: 'The chapter is part of the division of the land by lot; Joseph''s lot follows Judah''s'
    key: ot-minute-josh-16
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-16'
    quote: 'After describing the allotment of Judah’s territory, the book of Joshua next describes the allotment of the tribe of Joseph (chapters 16–17).'
  - where: setting
    claim: 'Joseph''s allotment (16–17) follows Judah''s and is divided into Ephraim and Manasseh; Ephraim first, Manasseh in chapter 17'
    key: ot-minute-josh-16
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-16'
    quote: 'This tribe, however, is divided into two separate subdivisions: Ephraim and Manasseh. Ephraim’s inheritance is described first (16:5–10), followed by a description of Manasseh’s inheritance (chapter 17).'
  - where: setting
    claim: 'The description of Joseph''s inheritance is terse compared with Judah''s'
    key: ot-minute-josh-16
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-16'
    quote: 'Unlike the description he gave of Judah’s territory, which is extensive, the author’s description of the Josephites’ inheritance is fragmentary and terse.'
  - where: setting
    claim: 'The land of Joseph''s sons was rich and held Shechem, Ebal, Gerizim and Shiloh'
    key: bd-ephraim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ephraim?lang=eng'
    quote: 'After the settlement in Canaan, the district assigned to the two sons of Joseph included some of the richest land in the country, crossed by several important highways, and having within its limits historic sites like Shechem, Ebal, Gerizim, and Shiloh.'
  - where: thread
    claim: 'Verses 1–4 outline Joseph''s whole territory and frame the allotments of Ephraim and Manasseh'
    key: ot-minute-josh-16
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-16'
    quote: 'Chapter 16 begins by giving a general outline of Joseph’s territory (verses 1–4). This outline frames the overall following description of Ephraim’s and Manasseh’s respective allotments.'
  - where: thread
    claim: 'The chapter ends, like Judah''s, with Canaanites not driven out'
    key: ot-minute-josh-16
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-16'
    quote: 'The chapter also ends with a similar description to one seen previously in the overview of Judah’s territory'
  - where: section 1 plain
    claim: 'Verses 1–3 trace the southern boundary of Joseph''s whole territory'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/16.htm'
    quote: 'Accordingly we find the southern boundary of the whole territory described first of all in Joshua 16:1-4'
  - where: section 1 plain
    claim: 'The sea of verse 3 is the Mediterranean'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/16.htm'
    quote: '"And the goings out thereof are at the sea" (the Mediterranean)'
  - where: section 3 plain
    claim: 'The "separate cities" are towns set apart for Ephraim inside Manasseh''s land'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/16.htm'
    quote: 'And the separate cities] Or, the places which were portioned off.'
  - where: section 3 plain
    claim: '"Serve under tribute" renders mas, forced labor'
    key: bdb
    url: 'https://biblehub.com/hebrew/4522.htm'
    quote: 'b. of conquered populations, subject to forced labour: יִהְיוּ לְךָ לָמַס וַעֲבָדוּךָ Deuteronomy 20:11 compare Judges 1:30,33,35 … so ויהי לְמַס עֹבֵד Joshua 16:10'
  - where: 'note 16:5 “Ephraim, the younger son’s tribe”'
    claim: 'Ephraim was Joseph''s second son, set before Manasseh at Jacob''s blessing; Joshua was of this tribe'
    key: bd-ephraim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ephraim?lang=eng'
    quote: 'The second son of Joseph (Gen. 41:52; 46:20); but at the blessing by Jacob, Ephraim was set before Manasseh, the elder son (48:19–20). Joshua belonged to this tribe, and to him was due much of its subsequent greatness.'
  - where: 'note 16:5 “Ephraim, the younger son’s tribe”'
    claim: 'Ephraim was given the birthright; in the last days its privilege is to bear the message of the Restoration and gather Israel'
    key: bd-ephraim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ephraim?lang=eng'
    quote: 'Ephraim was given the birthright in Israel (1 Chr. 5:1–2; Jer. 31:9), and in the last days it has been the tribe of Ephraim’s privilege first to bear the message of the Restoration of the gospel to the world and to gather scattered Israel'
  - where: 'note 16:5 “Ephraim, the younger son’s tribe”'
    claim: 'Chronicles says Reuben''s birthright was given to the sons of Joseph'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/5?lang=eng'
    quote: 'his birthright was given unto the sons of Joseph the son of Israel'
  - where: 'note 16:5 “Ephraim, the younger son’s tribe”'
    claim: 'Joshua (Oshea) was of Ephraim'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/13?lang=eng'
    quote: 'Of the tribe of Ephraim, Oshea the son of Nun.'
  - where: 'note 16:9 “Towns set apart inside Manasseh”'
    claim: 'The "separate cities" are places portioned off; "were" is supplied by the KJV, and the verse continues Ephraim''s inheritance'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/16.htm'
    quote: 'Or, the places which were portioned off. were] This verb, introduced into our Version, should be omitted … The author intended us to add to “the inheritance of the children of Ephraim” the “separate” or “single” cities allotted to the tribe within the borders of Manasseh.'
  - where: 'note 16:9 “Towns set apart inside Manasseh”'
    claim: 'It is supposed that Ephraim''s territory proved too small for its strength'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/16.htm'
    quote: 'It is supposed that after their relative boundaries had been fixed—though the subdivision of the territory assigned to the two brother tribes does not seem to have been very definite—it was found that the territory of Ephraim was too small in proportion to its strength.'
  - where: 'note 16:9 “Towns set apart inside Manasseh”'
    claim: 'Keil reports the same explanation as quite possible, allows other reasons now unknown, and notes Manasseh had the same (17:11)'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/16.htm'
    quote: 'it was found that Ephraim had received too small a possession. This is quite possible; at the same time there may have been other reasons which we cannot discover now, as precisely the same thing occurs in the case of Manasseh (Joshua 17:11).'
  - where: 'note 16:9 “Towns set apart inside Manasseh”'
    claim: 'Tappuah is one of these towns (17:8)'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/16.htm'
    quote: 'The tribe of Ephraim also received some scattered towns in the territory of the tribe of Manasseh, in fact all those towns to which Tappuah belonged, according to Joshua 17:8'
  - where: 'note 16:10 “Gezer, a labor gang instead of a conquest”'
    claim: 'Hebrew mas, rendered "tribute," is a labor band; of conquered populations subject to forced labor, including Josh. 16:10 and Deut. 20:11'
    key: bdb
    url: 'https://biblehub.com/hebrew/4522.htm'
    quote: 'b. of conquered populations, subject to forced labour: יִהְיוּ לְךָ לָמַס וַעֲבָדוּךָ Deuteronomy 20:11 compare Judges 1:30,33,35 … so ויהי לְמַס עֹבֵד Joshua 16:10'
  - where: 'note 16:10 “Gezer, a labor gang instead of a conquest”'
    claim: 'BDB treats "tribute" as a late sense, not the biblical Hebrew one'
    key: bdb
    url: 'https://biblehub.com/hebrew/4522.htm'
    quote: 'collective body of forced labourers, task-workers, labour-band or gang, also (late) forced service, task-work, serfdom ( ᵑ7 מִסָּא, especially in phrase מַסְּקֵי מִיסִּין (implying late and [for Biblical Hebrew] false sense ''tribute,'''
  - where: 'note 16:10 “Gezer, a labor gang instead of a conquest”'
    claim: 'The verse echoes 15:63; the failure will feature in Judges as a reason for strife (Judg. 1:29)'
    key: ot-minute-josh-16
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-16'
    quote: 'The Josephites’ failure to drive out the lingering Canaanite populace in the territory will feature later, in the book of Judges, as part of the reason for continual strife between the two nations (see Judges 1:29).'
  - where: 'note 16:10 “Gezer, a labor gang instead of a conquest”'
    claim: 'Pharaoh took Gezer, slew its Canaanites and gave it to his daughter, Solomon''s wife'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/9?lang=eng'
    quote: 'For Pharaoh king of Egypt had gone up, and taken Gezer, and burnt it with fire, and slain the Canaanites that dwelt in the city, and given it for a present unto his daughter, Solomon’s wife.'
  - where: 'note 16:10 “Gezer, a labor gang instead of a conquest”'
    claim: 'Judges repeats that Ephraim did not drive out Gezer''s Canaanites'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/1?lang=eng'
    quote: 'Neither did Ephraim drive out the Canaanites that dwelt in Gezer; but the Canaanites dwelt in Gezer among them.'
  - where: christ
    claim: 'Ephraim set before Manasseh at Jacob''s blessing; its latter-day privilege is to bear the Restoration''s message and gather Israel'
    key: bd-ephraim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ephraim?lang=eng'
    quote: 'in the last days it has been the tribe of Ephraim’s privilege first to bear the message of the Restoration of the gospel to the world and to gather scattered Israel (Deut. 33:13–17; D&C 64:36; 133:26–34).'
  - where: christ
    claim: 'The Lord''s servants, the children of Ephraim, crown the gathered in Zion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/133?lang=eng'
    quote: 'And there shall they fall down and be crowned with glory, even in Zion, by the hands of the servants of the Lord, even the children of Ephraim.'
  - where: 'note 16:5 “Ephraim, the younger son’s tribe”'
    claim: 'Ephraim''s inheritance is described first, then Manasseh''s'
    key: ot-minute-josh-16
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-16'
    quote: 'Ephraim’s inheritance is described first (16:5–10), followed by a description of Manasseh’s inheritance (chapter 17).'
