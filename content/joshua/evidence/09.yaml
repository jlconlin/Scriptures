chapter: 9
claims:
  - where: when
    claim: 'The Gibeonites come to Joshua at the camp at Gilgal'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/9?lang=eng'
    quote: 'And they went to Joshua unto the camp at Gilgal, and said unto him, and to the men of Israel, We be come from a far country'
  - where: setting
    claim: 'Joshua 9 opens the second stage of the conquest (9:1–11:15); the kings formed a coalition of a kind that arose against an emerging power'
    key: ot-minute-josh-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-9'
    quote: 'Joshua 9 opens the narrative of the second stage of the conquest of Canaan (9:1–11:15). … usually arose in response to a perceived regional threat by an emerging or dominant superpower.'
  - where: setting
    claim: 'Gibeon was a Hivite city on the hills of Benjamin about five miles north of Jerusalem'
    key: bd-gibeon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gibeon?lang=eng'
    quote: 'Formerly a city of the Hivites, on one of the hills of Benjamin, about five miles north of Jerusalem'
  - where: setting
    claim: 'Gibeon lay near the center of the land'
    key: brandt-conquest
    url: 'https://www.churchofjesuschrist.org/study/ensign/1973/10/the-conquest-of-canaan?lang=eng'
    quote: 'Shortly thereafter, Joshua discovered that Gibeon was located near the center of the land'
  - where: setting
    claim: 'Five kings attack Gibeon for making peace; Gibeon the one city that made peace; the famine for Saul slaying the Gibeonites'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/21?lang=eng'
    quote: 'And the Lord answered, It is for Saul, and for his bloody house, because he slew the Gibeonites.'
  - where: thread
    claim: 'The Israelites who tricked Ai are themselves tricked'
    key: ot-minute-josh-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-9'
    quote: 'Their plan was instead to trick the Israelites with a clever ruse—ironic enough given how the Israelites themselves successfully tricked the inhabitants of Ai with their own subterfuge in the previous chapter.'
  - where: thread
    claim: 'Peace could be made with far cities, not with the cities of the land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/20?lang=eng'
    quote: 'Thus shalt thou do unto all the cities which are very far off from thee, which are not of the cities of these nations.'
  - where: 'note 9:4 “Why pretend to come from far away”'
    claim: 'The plan exploited the law''s instructions on foreign cities (Deut. 20:10–20)'
    key: ot-minute-josh-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-9'
    quote: 'The idea behind the plan was to take advantage of the instructions in the law of Moses to treat aliens and foreign cities equitably (see Deuteronomy 20:10–20).'
  - where: 'note 9:4 “Why pretend to come from far away”'
    claim: 'Covenants of peace and vassalship could be offered to far cities, though the command was to destroy the peoples of Canaan'
    key: brandt-conquest
    url: 'https://www.churchofjesuschrist.org/study/ensign/1973/10/the-conquest-of-canaan?lang=eng'
    quote: 'although the command of the Lord had been to utterly destroy the wicked peoples of Canaan (Deut. 7). Covenants of peace and vassalship could be offered, however, to cities far removed from Canaan. (Deut. 20:10–15.)'
  - where: 'note 9:4 “Why pretend to come from far away”'
    claim: 'Deuteronomy: far cities may become tributaries; the Hivites among the cities to be destroyed; no covenant with them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/20?lang=eng'
    quote: 'But thou shalt utterly destroy them; namely, the Hittites, and the Amorites, the Canaanites, and the Perizzites, the Hivites, and the Jebusites'
  - where: 'note 9:9 “The report Rahab had heard”'
    claim: 'The Church''s footnote at 9:9 points to Josh. 2:10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/9?lang=eng'
    quote: '9a “heard”: Josh. 2:10.'
  - where: 'note 9:9 “The report Rahab had heard”'
    claim: 'The deception was undertaken out of desperation to save their lives'
    key: ot-minute-josh-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-9'
    quote: 'The reasoning the Gibeonites gave at verses 24–25 for their deception is self-evident: it was undertaken out of desperation to save their lives.'
  - where: 'note 9:9 “The report Rahab had heard”'
    claim: 'The herem tested the Canaanites; Gibeon and Rahab''s family are the only ones who ask for mercy, and obtain it'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'The ḥērem also tested the Canaanites. … with the exception of Gibeon … Rahab and her family … are the only other known exception. These are the only ones who ask for mercy in the text, and they obtain it.'
  - where: 'note 9:14 “They asked not counsel”'
    claim: 'The Church''s footnote at 9:14 gives Num. 27:21, where Eleazar asks counsel by Urim for Joshua'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/9?lang=eng'
    quote: '14a “counsel”: Num. 27:21; Jacob 4:10; Alma 37:37; D&C 3:4.'
  - where: 'note 9:14 “They asked not counsel”'
    claim: 'The plan worked through Israel''s credulity and failure to consult the Lord'
    key: ot-minute-josh-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-9'
    quote: 'Remarkably, the plan worked due to the Israelites’ credulity and their failure to consult the Lord (Joshua 9:14).'
  - where: 'note 9:14 “They asked not counsel”'
    claim: 'Joshua 9:14 among examples of poor choices by good people who did not ask, with Hezekiah and the Jaredites'
    key: ball-judge-not
    url: 'https://rsc.byu.edu/vol-12-no-1-2011/judge-not-ye-be-not-judged-approach-teaching-matthew-7'
    quote: 'The scriptures contain many examples of poor choices made by good people simply because they did not bother to ask. Joshua was deceived by the Gibeonites … Righteous King Hezekiah naively showed the wealth of his kingdom to greedy Babylonians … The Jaredites spent four years sitting on the beach'
  - where: 'note 9:19 “Why the oath was kept”'
    claim: 'The alliance was accepted through covenant'
    key: brandt-conquest
    url: 'https://www.churchofjesuschrist.org/study/ensign/1973/10/the-conquest-of-canaan?lang=eng'
    quote: 'This alliance was accepted through covenant by Joshua (Josh. 9:1–15)'
  - where: 'note 9:19 “Why the oath was kept”'
    claim: 'Despite the deceit the treaty, considered sacred, was honored'
    key: brandt-conquest
    url: 'https://www.churchofjesuschrist.org/study/ensign/1973/10/the-conquest-of-canaan?lang=eng'
    quote: 'despite their deceit, the treaty, which was considered sacred, was honored. (Josh. 9:16–27.)'
  - where: 'note 9:19 “Why the oath was kept”'
    claim: 'Joshua, faithful to the treaty, fought for Gibeon'
    key: brandt-conquest
    url: 'https://www.churchofjesuschrist.org/study/ensign/1973/10/the-conquest-of-canaan?lang=eng'
    quote: 'Faithful to the treaty, Joshua led the armies of Israel against the forces of the southern league of kings.'
  - where: 'note 9:19 “Why the oath was kept”'
    claim: 'One older reading: strict justice might free them, but they kept the oath to keep God''s name from contempt; they sinned in swearing without asking, and could not repair it by a fresh sin'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/9.htm'
    quote: 'from the stand-point of strict justice this view appears to be a right one. … they were afraid of bringing the name of the God of Israel into contempt among the Canaanites'
  - where: 'note 9:19 “Why the oath was kept”'
    claim: 'One older reading: breaking the oath would be committing a fresh sin'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/9.htm'
    quote: 'They had done this without asking the mouth of Jehovah (Joshua 9:14), and thus had sinned against the Lord their God. But they could not repair this fault by breaking the oath … by committing a fresh sin; … (vid., Psalm 15:4).'
  - where: 'note 9:19 “Why the oath was kept”'
    claim: 'Saul in his zeal broke the promise and killed many Gibeonites'
    key: belnap-fell-tree
    url: 'https://rsc.byu.edu/they-shall-grow-together/they-did-fell-tree'
    quote: 'Though not recorded elsewhere, the text in 2 Samuel 21 recounts that Saul had, at some point, “in his zeal” broken that promise and killed many in the community (see v. 2).'
  - where: 'note 9:19 “Why the oath was kept”'
    claim: 'The famine of three years; the Gibeonites ask for seven of Saul''s sons'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/21?lang=eng'
    quote: 'Then there was a famine in the days of David three years, year after year … Let seven men of his sons be delivered unto us'
  - where: 'note 9:23 “Servants of the house of God”'
    claim: 'The Church''s footnote at 9:27 points to Deut. 31:11, "the place which he shall choose"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/9?lang=eng'
    quote: '27a “place”: Deut. 31:11 (9–13).'
  - where: 'note 9:23 “Servants of the house of God”'
    claim: 'Verse 27 gives the author''s etiology for Gibeonite menial labor in his day'
    key: ot-minute-josh-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-9'
    quote: 'The concluding verse of the chapter gives the author’s etiology for why Gibeonites served in menial labor roles in his day.'
  - where: 'note 9:23 “Servants of the house of God”'
    claim: 'The Gibeonite covenant of tribute lasted hundreds of years'
    key: brandt-conquest
    url: 'https://www.churchofjesuschrist.org/study/ensign/1973/10/the-conquest-of-canaan?lang=eng'
    quote: 'The Gibeonite covenant of tribute to the Israelites lasted for hundreds of years.'
  - where: 'note 9:23 “Servants of the house of God”'
    claim: 'The covenant with Gibeon incorporated them into the house of Israel, with the strangers at Ebal and Deut. 29:10–13'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'Moses renewed God’s covenant with them and with the foreigners who dwelt among them (see Deuteronomy 29:10–13). Resident aliens were among the group with whom Joshua reestablished that covenant at Mount Ebal … Shortly thereafter he made a covenant with the Gibeonites that incorporated them into the house of Israel (see Joshua 9).'
  - where: 'note 9:23 “Servants of the house of God”'
    claim: 'Deut. 29:11 lists the hewer of wood and drawer of water among those in the covenant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/29?lang=eng'
    quote: 'Your little ones, your wives, and thy stranger that is in thy camp, from the hewer of thy wood unto the drawer of thy water:'
  - where: christ
    claim: 'Counsel with the Lord in all thy doings'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/37?lang=eng'
    quote: 'Counsel with the Lord in all thy doings, and he will direct thee for good'
