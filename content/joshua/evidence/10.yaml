chapter: 10
claims:
  - where: setting
    claim: 'Chapter 9 opens the second stage of the conquest, 9:1–11:15, against the south (chapter 10) and the north (chapter 11)'
    key: ot-minute-josh-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-9'
    quote: 'Joshua 9 opens the narrative of the second stage of the conquest of Canaan (9:1–11:15). This stage of the war pitted Israel against both the south (see chapter 10) and the north (see chapter 11) of Canaan.'
  - where: setting
    claim: 'Gibeon was a Hivite city in the hills of Benjamin about five miles north of Jerusalem'
    key: bd-gibeon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gibeon?lang=eng'
    quote: 'Formerly a city of the Hivites, on one of the hills of Benjamin, about five miles north of Jerusalem'
  - where: setting
    claim: 'Recognizing Israel''s strength, five southern kings allied to destroy Gibeon, Israel''s ally'
    key: brandt-conquest
    url: 'https://www.churchofjesuschrist.org/study/ensign/1973/10/the-conquest-of-canaan?lang=eng'
    quote: 'Recognizing the strength of the children of Israel, five kings of the southern part of Canaan allied themselves with the intent of destroying the Gibeonite allies of Israel. This league of kings was from the cities of Jerusalem, Hebron, Jarmuth, Lachish, and Eglon.'
  - where: setting
    claim: 'Such coalitions are known from the Bible (Gen. 14) and the ancient Near East and arose against a perceived regional threat; here Israel'
    key: ot-minute-josh-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-9'
    quote: 'These sorts of military alliances are known from both biblical (for example, Genesis 14) and secular history of the ancient Near East and usually arose in response to a perceived regional threat … In this instance, that threat was Israel.'
  - where: setting
    claim: 'The chapter has two narrative sections, 1–15 and 16–43, each ending with the same statement (15, 43)'
    key: ot-minute-josh-10
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-10'
    quote: 'It is divided into two narrative sections. The first runs from verse 1 to verse 15, describing the initial battle, and the second from verse 16 to verse 43 … Each section ends with the same statement, reinforcing the sections’ thematic continuity (see verses 15, 43).'
  - where: thread
    claim: 'The conquest narrative emphasizes Jehovah''s miraculous intervention, including the stones and the sun, and shows God fulfilling covenant promises as Israel is faithful; 10:14 sums it up'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'the conquest narrative of Joshua places a heavy emphasis on Jehovah’s miraculous intervention, including … raining down stones on the enemy (10:11), and making the sun and moon stand still (10:12–14). … Joshua shows how he fulfills those promises to the degree that the Israelites remain faithful.'
  - where: note 10:6 “Joshua keeps faith with Gibeon”
    claim: 'Despite the Gibeonites'' deceit the treaty was considered sacred and honored'
    key: brandt-conquest
    url: 'https://www.churchofjesuschrist.org/study/ensign/1973/10/the-conquest-of-canaan?lang=eng'
    quote: 'Shortly thereafter, Joshua discovered that Gibeon was located near the center of the land, and despite their deceit, the treaty, which was considered sacred, was honored.'
  - where: note 10:6 “Joshua keeps faith with Gibeon”
    claim: 'Faithful to the treaty, Joshua led Israel against the southern league to defend Gibeon'
    key: brandt-conquest
    url: 'https://www.churchofjesuschrist.org/study/ensign/1973/10/the-conquest-of-canaan?lang=eng'
    quote: 'The Gibeonites, under siege, sent an appeal for assistance to the Israelites. Faithful to the treaty, Joshua led the armies of Israel against the forces of the southern league of kings.'
  - where: note 10:12 “The sun and moon stand still”
    claim: 'Verse 12 is poetry, a parallelistic declaration, obscured by the King James typography'
    key: ot-minute-josh-10
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-10'
    quote: 'Although obscured by the typography of the King James Version Bible, Joshua’s speech at verse 12 is poetry with a parallelistic declaration'
  - where: note 10:12 “The sun and moon stand still”
    claim: 'The phenomenon is difficult to ascertain; elsewhere (3 Ne. 1) God shows His power in cosmological displays'
    key: ot-minute-josh-10
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-10'
    quote: 'The precise phenomenon described in this scene is difficult to fully ascertain, but elsewhere in scripture (most notably in the Book of Mormon with the sign of Christ’s birth as described in 3 Nephi 1) God manifests His power in cosmological displays.'
  - where: note 10:12 “The sun and moon stand still”
    claim: 'The Student Manual reads the Book of Mormon as making clear it was the earth, not the sun'
    key: ot-manual-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/joshua-1-24-the-entry-into-the-promised-land?lang=eng'
    quote: 'The Book of Mormon makes it clear that it was the earth, not the sun, that was involved in Joshua’s miracle.'
  - where: note 10:12 “The sun and moon stand still”
    claim: 'The manual quotes a commentary that God can and would stop the earth''s rotation to lengthen a day'
    key: ot-manual-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/joshua-1-24-the-entry-into-the-promised-land?lang=eng'
    quote: '“So here we have the words of a Book of Mormon prophet confirming the fact that God can—and would, when necessary—cause that the earth should stop in its rotation to lengthen a day.'
  - where: note 10:12 “The sun and moon stand still”
    claim: 'Mormon probably had the Joshua story in mind in Hel. 12'
    key: grandy-helaman
    url: 'https://byustudies.byu.edu/article/why-things-move-a-new-look-at-helaman-12-15'
    quote: 'Although we cannot say for sure, it is probable that Mormon, from his reading of the plates of brass, had the Joshua story specifically in mind when he wrote about the earth’s motion.'
  - where: note 10:12 “The sun and moon stand still”
    claim: 'Mormon invokes Joshua''s event not to correct it scientifically but to teach obedience'
    key: grandy-helaman
    url: 'https://byustudies.byu.edu/article/why-things-move-a-new-look-at-helaman-12-15'
    quote: 'this verse suggests that Mormon is invoking Joshua’s event, not because Joshua’s account is scientifically inaccurate and therefore in need of correction, but because it reinforces Mormon’s own admonition that humans … should follow the many examples of responsive obedience'
  - where: note 10:12 “The sun and moon stand still”
    claim: 'The central point was the Lord''s power and miraculous intercession'
    key: grandy-helaman
    url: 'https://byustudies.byu.edu/article/why-things-move-a-new-look-at-helaman-12-15'
    quote: 'The absolutely central point—the turn of events that sparked saving faith—was the Lord’s power and miraculous intercession.'
  - where: note 10:13 “The book of Jasher”
    claim: 'Verse 13 is a rare case of a biblical narrator naming his source; probably war poems or epic tales, now lost; same book as 2 Sam. 1:18'
    key: ot-minute-josh-10
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-10'
    quote: 'The reference to the book of Jasher at verse 13 is one rare instance when a biblical narrator identifies his source. This book, probably a collection of war poems or epic tales, is now lost but presumably is the same book referenced elsewhere in the Bible'
  - where: note 10:13 “The book of Jasher”
    claim: 'The Bible Dictionary: an early collection of national songs and deeds of valor from about Solomon''s time; modern books of that name do not appear to be the biblical one'
    key: bd-jasher
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jasher-book-of?lang=eng'
    quote: 'An early collection of Jewish national songs and stories of deeds of valor, put together about the time of Solomon. Various other collections of the book of Jasher are available today and may be of some worth but do not appear to be the one spoken of in the Bible.'
  - where: note 10:13 “The book of Jasher”
    claim: 'The Hebrew name literally means the book of the upright'
    key: brandt-jasher
    url: 'https://rsc.byu.edu/apocryphal-writings-latter-day-saints/book-jasher-latter-day-saints'
    quote: 'since it is literally translated “the book of the upright” (i.e., righteous men, Israelites).'
  - where: note 10:13 “The book of Jasher”
    claim: 'The 1840 Book of Jasher has a parallel to 10:13 but not the promised further information, and is not the lost scriptural book'
    key: brandt-jasher
    url: 'https://rsc.byu.edu/apocryphal-writings-latter-day-saints/book-jasher-latter-day-saints'
    quote: 'although it contains a parallel account of Joshua 10:13, the promised additional information … does not even appear in its pages. … the Jewish Sefer Hayashar, translated and published in English as The Book of Jasher (1840/1877), is not the lost scriptural book mentioned in the Old Testament.'
  - where: note 10:13 “The book of Jasher”
    claim: 'Reprints of the 1840 edition are the source of Latter-day Saint interest in it'
    key: brandt-jasher
    url: 'https://rsc.byu.edu/apocryphal-writings-latter-day-saints/book-jasher-latter-day-saints'
    quote: 'A series of reprints of the 1840 edition have been the source of Latter-day Saint interest in this unique Jewish writing.'
  - where: note 10:24 “The five kings humbled and hanged”
    claim: 'Feet on the neck is a common ancient Near Eastern image of submission; Joshua included his captains probably to raise morale'
    key: ot-minute-josh-10
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-10'
    quote: 'The practice of placing feet on the neck (see verse 24) is a common ancient Near Eastern image of submission or subjugation. Joshua included his captains in this quasi-ritualized taunt of Israel’s enemies probably to raise morale in the army (verses 24–25).'
  - where: note 10:24 “The five kings humbled and hanged”
    claim: 'The kings shared the fate of the king of Ai; bodies removed by sundown per Deuteronomy; the cave became their tomb in irony or poetic justice'
    key: ot-minute-josh-10
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-10'
    quote: 'In line with the Deuteronomic injunction, Joshua removed the bodies of the executed kings from the tree by sundown. In a final act of irony or poetic justice, the cave where the five kings concealed themselves earlier in the narrative became their tomb'
  - where: note 10:24 “The five kings humbled and hanged”
    claim: 'The enemies were ritually humiliated alive and dead, without long-term mutilation, and interred at evening'
    key: belnap-fell-tree
    url: 'https://rsc.byu.edu/they-shall-grow-together/they-did-fell-tree'
    quote: 'the hanging takes place within a war scene, with the defeated enemies ritually humiliated, both while alive and then while dead, yet there was no long-term corpse mutilation, and the corpse was interred at evening.'
  - where: note 10:40 “All that breathed”
    claim: 'Verses 28–42 repeat formulaically that Joshua smote and utterly destroyed each city; only the slaying of humans is mentioned'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'The passage repeats in formulaic fashion the statement that Joshua smote the city with the sword and “utterly destroyed” (heḥĕrīm) the inhabitants. In this passage, only the slaying of humans is mentioned; other aspects, such as the burning of the city or the handling of the spoils, are not discussed.'
  - where: note 10:40 “All that breathed”
    claim: '“All that breathe” (10:40) does not include livestock'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'several passages specify the killing of “all that breathe” (Hebrew kol-nəšāmâ): Deuteronomy 20:16; Joshua 10:40; 11:11, 14. … However, there is no indication in any of these passages that the phrase includes livestock as well as humans.'
  - where: note 10:40 “All that breathed”
    claim: 'Peoples consigned to herem (Josh. 10:20, 39; 15:13–14) later needed reconquering, a sign the herem did not involve total extermination in practice; absolute war language was the regional idiom'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'there are several indications that the ḥērem did not involve total extermination in actual practice. Some passages describe people consigned to ḥērem later needing to be reconquered—for example, the Anakites and other Canaanite groups in the time of Joshua … (Joshua 10:20, 39; 11:21; 15:13–14'
  - where: note 10:40 “All that breathed”
    claim: 'The language of 28–43 is totalizing, which bears on how Joshua relates to Judges'
    key: ot-minute-josh-10
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-10'
    quote: 'The language is also totalizing, depicting Joshua and the Israelites as having totally dominated their Canaanite foes. This will factor into how the book of Joshua relates to the book of Judges'
  - where: christ
    claim: 'In Restoration revelations the Lord of Hosts is the same being who in the Old Testament was a man of war who fights for his people'
    key: muhlestein-savior-sword
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/savior-sword'
    quote: 'Because this phrase is used in the Old Testament in connection with Jehovah being a man of war who fights for his people (e.g., Genesis 32:2; Joshua 5:14 …), it seems clear that in these Restoration revelations, that same being intends for himself to be seen in the same way'
  - where: christ
    claim: 'His mercy is possible only because he fought battles for us in Gethsemane and on the cross'
    key: muhlestein-savior-sword
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/savior-sword'
    quote: 'The mercy we rightly love to see in our Savior is possible only because he has fought battles for us in Gethsemane and on the cross and thus has set us free.'
  - where: christ
    claim: 'The Church''s footnote to “fought” in Josh. 10:14 points to D&C 105:14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/10?lang=eng'
    quote: '“fought”: Deut. 1:30 (29–30); D&C 105:14.'
