chapter: 14
claims:
  - where: when
    claim: 'Caleb comes to Joshua at Gilgal forty-five years after Kadesh-barnea'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/14?lang=eng'
    quote: 'Then the children of Judah came unto Joshua in Gilgal … the LORD hath kept me alive, as he said, these forty and five years'
  - where: setting
    claim: 'Chapter 14 turns from the eastern allotments of chapter 13 to the western ones, detailed through chapter 19'
    key: ot-minute-josh-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-14'
    quote: 'After describing the territorial allotments on the east side of the Jordan River previously secured under Moses (Joshua 13), the fourteenth chapter of the book of Joshua shifts focus to the western allotments. These allotments are detailed on through chapter 19.'
  - where: setting
    claim: 'Verses 1–5 introduce the division of the land west of the Jordan among nine and a half tribes'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/14.htm'
    quote: 'In this section, from Joshua 14:1-5, we have an introduction to the division of the country west of the Jordan among the nine and a half remaining tribes.'
  - where: setting
    claim: 'The first allotment, Judah''s, is claimed by Caleb, one of the twelve spies'
    key: ot-minute-josh-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-14'
    quote: 'The first allotment was given to Judah, which is described in the remainder of chapter fourteen, running into the next chapter. … Judah’s territorial allotment was claimed by Caleb, one of the twelve spies sent to scout the land of Canaan.'
  - where: setting
    claim: 'Caleb and Joshua alone brought back a true report and alone survived the forty years; Caleb obtained Hebron'
    key: bd-caleb
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/caleb?lang=eng'
    quote: 'He and Joshua alone brought back a true report (Num. 13:6, 30; 14:6–38); they alone of all the people who left Egypt survived the 40 years in the wilderness (Num. 26:65; 32:12; Deut. 1:36). After the entrance into Canaan, Caleb obtained Hebron'
  - where: thread
    claim: 'The division follows what the LORD commanded Moses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/14?lang=eng'
    quote: 'As the LORD commanded Moses, so the children of Israel did, and they divided the land.'
  - where: thread
    claim: 'The closing formula about rest from war is a transition to the peaceful distribution'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/14.htm'
    quote: 'This formula is repeated here to furnish a point of transition to the history of the peaceful distribution of the country.'
  - where: 'note 14:2 “By lot, as the LORD commanded”'
    claim: 'The lot, under Eleazar, emphasized a divinely ordered distribution; casting lots was believed to determine God''s will'
    key: ot-minute-josh-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-14'
    quote: 'thereby emphasizing the divinely ordered manner of distribution. Casting lots was an important divinatory practice, called cleromancy, that anciently was believed to be a means of determining God’s will'
  - where: 'note 14:4 “Twelve tribes without Levi”'
    claim: 'Jacob claims Ephraim and Manasseh as his own'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/48?lang=eng'
    quote: 'And now thy two sons, Ephraim and Manasseh … are mine; as Reuben and Simeon, they shall be mine.'
  - where: 'note 14:6 “Caleb the Kenezite”'
    claim: 'Smoot: Caleb was not a Judahite nor an Israelite but a Kenezite, counted among Judah; the tribes mixed biological and adopted members'
    key: ot-minute-josh-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-14'
    quote: 'Ironically, however, Caleb himself was not a Judahite nor even an Israelite but a Kenezite (see verse 14). That he was nevertheless counted among Judah is clear indication that the tribes of Israel anciently (as today) were composed of a mix of both biological and adopted members.'
  - where: 'note 14:6 “Caleb the Kenezite”'
    claim: 'Keil: Kenaz was a descendant of Hezron of Judah, a person not a tribe'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/14.htm'
    quote: 'Kenaz was a descendant of Hezron, the son of Perez and grandson of Judah (1 Chronicles 2:5, 1 Chronicles 2:18, 1 Chronicles 2:25), of whom nothing further is known. Consequently it was not the name of a tribe, but of a person'
  - where: 'note 14:6 “Caleb the Kenezite”'
    claim: 'Cambridge sets out both views: a proselyte from the tribe of Gen. 15:19 incorporated into Judah, or a Kenaz of Judah''s line; Othniel also called son of Kenaz'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/14.htm'
    quote: 'His younger brother Othniel, afterwards the first Judge, is also called “the son of Kenaz” … (a) some have thought he was a foreigner by birth, descended from the Edomite tribe spoken of in Genesis 15:19, a proselyte who had been incorporated into the tribe of Judah'
  - where: 'note 14:6 “Caleb the Kenezite”'
    claim: 'Cambridge''s second view: Kenaz probably of Judah''s posterity'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/14.htm'
    quote: '(b) others hold that even if Jephunneh was on the father’s side descended from this people, on the mother’s he came from Judah, and that this Kenaz probably belonged to the posterity of Judah of whom nothing further is known.'
  - where: 'note 14:6 “Caleb the Kenezite”'
    claim: 'The Kenizzites are among the peoples of the land promised to Abraham''s seed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/15?lang=eng'
    quote: 'The Kenites, and the Kenizzites, and the Kadmonites,'
  - where: 'note 14:9 “An oath not told in Numbers”'
    claim: 'Deuteronomy records the promise of the land Caleb had trodden'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'Save Caleb the son of Jephunneh; he shall see it, and to him will I give the land that he hath trodden upon, and to his children, because he hath wholly followed the LORD.'
  - where: 'note 14:10 “Forty-five years, and the length of the wars”'
    claim: 'Thirty-eight years passed from Kadesh-barnea to the brook Zered'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/2?lang=eng'
    quote: 'And the space in which we came from Kadesh-barnea, until we were come over the brook Zered, was thirty and eight years'
  - where: 'note 14:10 “Forty-five years, and the length of the wars”'
    claim: 'Keil, following Theodoret: the conquest took seven years, since the promise came thirty-eight years before the entrance'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/14.htm'
    quote: 'Theodoret justly infers, that the conquest of Canaan by Joshua was completed in seven years, since God spake these words towards the end of the second year after the exodus from Egypt, and therefore thirty-eight years before the entrance into Canaan.'
  - where: 'note 14:10 “Forty-five years, and the length of the wars”'
    claim: 'Keil: the years of conquest are counted with the wandering'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/14.htm'
    quote: 'the years occupied in the conquest of Canaan, during which Israel had not yet entered into peaceful possession of the promised land, are reckoned as forming part of the years of wandering in the desert.'
  - where: 'note 14:10 “Forty-five years, and the length of the wars”'
    claim: 'God fulfilled His promise by keeping Caleb alive and strong'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/14.htm'
    quote: 'God had fulfilled His promise, and not only prolonged his life forty-five years, but had preserved his strength in such full vigour, that, though now in his eighty-fifth year, he felt as strong, and as well able to engage in war, as when he was forty years old.'
  - where: 'note 14:12 “Give me this mountain”'
    claim: 'Kimball: Caleb''s request a challenge with which his heart finds full sympathy; the Anakims still had to be overcome'
    key: kimball-mountain
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1979/10/give-me-this-mountain?lang=eng'
    quote: 'Caleb concluded his moving declaration with a request and a challenge with which my heart finds full sympathy. The Anakims, the giants, were still inhabiting the promised land, and they had to be overcome.'
  - where: 'note 14:12 “Give me this mountain”'
    claim: 'Kimball: as Caleb strove to gain his inheritance, we must strive constantly to be worthy of the promised place in the kingdom'
    key: kimball-mountain
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1979/10/give-me-this-mountain?lang=eng'
    quote: 'Just as Caleb had to struggle and remain true and faithful to gain his inheritance, so we must remember that, while the Lord has promised us a place in his kingdom, we must ever strive constantly and faithfully so as to be worthy to receive the reward.'
  - where: 'note 14:14 “Because he wholly followed the LORD”'
    claim: 'The fields and villages of Hebron went to Caleb'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/21?lang=eng'
    quote: 'But the fields of the city, and the villages thereof, gave they to Caleb the son of Jephunneh for his possession.'
  - where: 'note 14:12 “Give me this mountain”'
    claim: 'Kimball''s general conference address is titled with the verse'
    key: kimball-mountain
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1979/10/give-me-this-mountain?lang=eng'
    quote: 'Said Caleb, now at 85 years, “Give me this mountain” (Josh. 14:12).'
  - where: christ
    claim: 'For their faith Caleb and Joshua were promised they and their children would inhabit the land'
    key: kimball-mountain
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1979/10/give-me-this-mountain?lang=eng'
    quote: 'For their faith, they were promised that they and their children would live to inhabit the promised land.'
  - where: christ
    claim: 'The LORD kept Caleb alive as He said'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/14?lang=eng'
    quote: 'And now, behold, the LORD hath kept me alive, as he said, these forty and five years'
  - where: explore
    claim: 'Caleb takes Hebron and gives Achsah, and Judges retells it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/15?lang=eng'
    quote: 'And Caleb drove thence the three sons of Anak, Sheshai, and Ahiman, and Talmai, the children of Anak.'
  - where: 'note 14:12 “Give me this mountain”'
    claim: 'BDB: ulay means perhaps, usually expressing a hope'
    key: bdb
    url: 'https://biblehub.com/hebrew/194.htm'
    quote: '1 peradventure, perhaps; usually expressing a hope, as Genesis 16:2; Numbers 22:6,11'
  - where: 'note 14:12 “Give me this mountain”'
    claim: 'The Hebrew of 14:12 has ulay for "if so be"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/14?lang=eng'
    quote: 'if so be the LORD will be with me, then I shall be able to drive them out, as the LORD said.'
