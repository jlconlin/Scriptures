chapter: 20
claims:
  - where: when
    claim: 'The division of the land by lot ended at Shiloh before this chapter'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/19?lang=eng'
    quote: 'divided for an inheritance by lot in Shiloh before the Lord, at the door of the tabernacle of the congregation. So they made an end of dividing the country.'
  - where: setting
    claim: 'The division of the land ended at Shiloh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/19?lang=eng'
    quote: 'So they made an end of dividing the country.'
  - where: setting
    claim: 'The command had been given to Moses; it fell to Joshua to carry it out'
    key: ot-minute-josh-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-20'
    quote: 'The Lord had already commanded Moses to establish such cities once the Israelites were settled in the land of Canaan (see Numbers 35:9–34; Deuteronomy 19:1–13), but it fell upon Joshua to constitute the practice.'
  - where: setting
    claim: 'Moses had already appointed the three eastern cities; they are named again for completeness'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/20.htm'
    quote: 'The cities in the land on the other side had already been appointed by Moses (Deuteronomy 4:41-43). For the sake of completeness, they are mentioned here again'
  - where: setting
    claim: 'Moses set apart Bezer, Ramoth and Golan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/4?lang=eng'
    quote: 'Namely, Bezer in the wilderness, in the plain country, of the Reubenites; and Ramoth in Gilead, of the Gadites; and Golan in Bashan, of the Manassites.'
  - where: setting
    claim: 'All six were Levitical cities, listed in Joshua 21'
    key: ot-minute-josh-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-20'
    quote: 'All six of these cities were Levitical cities (that is, cities allotted to the Levites per Joshua 21:1, 11, 27, 32, 36, 38)'
  - where: setting
    claim: 'Joshua 21 names the cities again as cities of refuge for the slayer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/21?lang=eng'
    quote: 'Thus they gave to the children of Aaron the priest Hebron with her suburbs, to be a city of refuge for the slayer'
  - where: thread
    claim: 'After the tribal allotments, the chapter provides for people in compromising legal situations'
    key: ot-minute-josh-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-20'
    quote: 'there remained one demographic that needed to be accounted for: marginalized or otherwise disenfranchised persons, specifically persons in compromising legal situations. Their allotment is described in chapter 20, which regulates cities of refuge.'
  - where: thread
    claim: 'The chapter falls into two parts, verses 1–6 and 7–9'
    key: ot-minute-josh-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-20'
    quote: 'Joshua 20 is structured broadly in two parts: verses 1–6 detail the protocols for those who flee to a city of refuge after committing involuntary manslaughter, while verses 7–9 specify which cities were set apart as places of refuge.'
  - where: thread
    claim: 'Setting up the cities right after the inheritances showed moral emphasis on justice and care for the disadvantaged'
    key: ot-minute-josh-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-20'
    quote: 'That these cities of refuge were established immediately after the allotment of Israel’s own inheritances showed the clear moral emphasis the covenant people placed on matters of the law and justice. It also demonstrated the need to watch over those that might be socially disadvantaged'
  - where: section 2 plain
    claim: 'The verb of verse 7 means to set apart, consecrate (rendered "set apart as holy")'
    key: bdb
    url: 'https://biblehub.com/hebrew/6942.htm'
    quote: '1 set apart, devote, consecrate: … a. places, temple2Chron 2:3, city Joshua 20:7 (P).'
  - where: 'note 20:4 “A hearing at the gate”'
    claim: 'The city gate was a place for public business, as in Ruth 4'
    key: bd-gate
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gate?lang=eng'
    quote: 'The gate of a city was often a place for public business (Deut. 21:19; Ruth 4:1–11'
  - where: 'note 20:4 “A hearing at the gate”'
    claim: 'Boaz went to the gate and called ten elders of the city'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/4?lang=eng'
    quote: 'Then went Boaz up to the gate, and sat him down there … And he took ten men of the elders of the city, and said, Sit ye down here.'
  - where: 'note 20:6 “Two "untils"”'
    claim: 'One reading: if the high priest died before the case was resolved, the accused was cleared and could return home'
    key: ot-minute-josh-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-20'
    quote: 'If the high priest died before the case could be resolved, the accused party was cleared of any wrongdoing and could return home.'
  - where: 'note 20:6 “Two "untils"”'
    claim: 'Numbers gives the congregation judging and restoring the slayer to his refuge until the high priest dies'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/35?lang=eng'
    quote: 'And the congregation shall deliver the slayer out of the hand of the revenger of blood, and the congregation shall restore him to the city of his refuge, whither he was fled: and he shall abide in it unto the death of the high priest'
  - where: 'note 20:7 “Set apart as holy”'
    claim: 'The verb of verse 7 is qadash (H6942), hiphil'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'וַ/יַּקְדִּ֜שׁוּ'
  - where: 'note 20:7 “Set apart as holy”'
    claim: 'Verse 2 says "give to you," i.e., appoint for yourselves'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/20.htm'
    quote: 'לכם תּנוּ, "give to you," i.e., appoint for yourselves, "cities of refuge," etc.'
  - where: 'note 20:7 “Set apart as holy”'
    claim: 'The hiphil of qadash means set apart, devote, consecrate; Josh 20:7 is cited for a city'
    key: bdb
    url: 'https://biblehub.com/hebrew/6942.htm'
    quote: '1 set apart, devote, consecrate: … a. places, temple2Chron 2:3, city Joshua 20:7 (P).'
  - where: 'note 20:7 “Set apart as holy”'
    claim: 'One older reading: "they sanctified," to preserve the land from blood-guiltiness'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/20.htm'
    quote: 'And they appointed] Rather, they sanctified, set apart for a sacred purpose. The Cities of Refuge were intended to preserve the People and the Land of Jehovah from blood-guiltiness.'
  - where: 'note 20:7 “Set apart as holy”'
    claim: 'Three cities on each side of the Jordan gave an effective distribution of refuge cities'
    key: ot-minute-josh-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-20'
    quote: 'In order to have an effective distribution of refuge cities, three towns were allotted on both sides of the Jordan'
  - where: 'note 20:7 “Set apart as holy”'
    claim: 'Kedesh in the north, Shechem in the centre, Hebron in the south'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/20.htm'
    quote: 'In the north, Kedesh (see at Joshua 12:22), in Galil, on the mountains of Naphtali. … In the centre of the land, Shechem, upon the mountains of Ephraim … And in the south, Kirjath-arba, i.e., Hebron'
  - where: 'note 20:9 “The stranger too”'
    claim: 'Numbers already opened the cities to the stranger and sojourner'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/35?lang=eng'
    quote: 'These six cities shall be a refuge, both for the children of Israel, and for the stranger, and for the sojourner among them: that every one that killeth any person unawares may flee thither.'
  - where: 'note 20:9 “The stranger too”'
    claim: 'The cities were a place for aliens to seek judicial oversight; care for those with no other recourse'
    key: ot-minute-josh-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-20'
    quote: 'The cities of refuge were also a place for aliens in the land of Canaan to seek judicial oversight or refuge (20:9).'
  - where: 'note 20:9 “The stranger too”'
    claim: 'The cities showed the need to watch over the disadvantaged, especially aliens'
    key: ot-minute-josh-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-20'
    quote: 'It also demonstrated the need to watch over those that might be socially disadvantaged, especially aliens who might not have any other judicial recourse.'
