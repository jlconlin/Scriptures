page: rest-round-about
claims:
  - where: 'section “Rest before the Jordan”'
    claim: 'Moses'' condition to the eastern tribes: armed until the LORD has driven out his enemies (the note at Josh. 1:13, Num. 32:20–22)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/32?lang=eng'
    quote: 'until he hath driven out his enemies from before him'
  - where: 'section “Rest before the Jordan”'
    claim: '“Given rest” is the Hiphil (causative) of nûaḥ (H5117), the LORD the subject: 1:13 mēnîaḥ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'מֵנִ֣יחַ'
  - where: 'section “Rest before the Jordan”'
    claim: 'nûaḥ in the Hiphil with the LORD as subject is in five verses of Joshua: 1:13, 1:15, 21:44, 22:4, 23:1 (occurrences.mjs joshua --hebrew H5117 also lists 3:13, the priests'' feet, which is not the theme); 23:1 hēnîaḥ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'הֵנִ֨יחַ'
  - where: 'section “Rest before the Jordan”'
    claim: 'The rest Israel lost in the wilderness is “the fulness of his glory” (D&C 84:24; the Church''s note at Josh. 1:13 points to it)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'swore that they should not enter into his rest while in the wilderness, which rest is the fulness of his glory'
  - where: 'section “Rest before the Jordan”'
    claim: 'Connection made by this page: Josh. 1:13–15 set beside Moro. 7:3 — a rest entered “from this time henceforth” that leads on to a rest “with him in heaven,” beside the rest already given in Josh. 1:13; in both, a rest given is not yet the last rest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/moro/7?lang=eng'
    quote: 'enter into the rest of the Lord, from this time henceforth until ye shall rest with him in heaven'
  - where: 'section “Rest before the Jordan”'
    claim: 'Connection made by this page: the charge in Josh. 1:15 (“Until the LORD have given your brethren rest”), the rest already given and still to be shared, the other side of the comparison with Moro. 7:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/1?lang=eng'
    quote: 'Until the Lord have given your brethren rest, as he hath given you'
  - where: 'section “The land rested, and very much land remained”'
    claim: '“The land rested” (11:23) and “had rest” (14:15) are šāqaṭ (H8252, “was quiet”), found in Joshua only at these two verses (occurrences.mjs joshua --hebrew H8252)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'שָׁקְטָ֖ה'
  - where: 'section “The land rested, and very much land remained”'
    claim: 'Josh. 11:23 closes the wars with “the land rested from war”; Josh. 13:1 follows with “very much land to be possessed”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/11?lang=eng'
    quote: 'And the land rested from war.'
  - where: 'section “The land rested, and very much land remained”'
    claim: 'Josh. 13:1: very much land remains'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/13?lang=eng'
    quote: 'there remaineth yet very much land to be possessed'
  - where: 'section “Rest round about”'
    claim: 'Deut. 3:20, Moses'' words to the eastern tribes with “Until the Lord have given rest unto your brethren” (Church''s cross-reference at Josh. 21:44)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/3?lang=eng'
    quote: 'Until the Lord have given rest unto your brethren, as well as unto you'
  - where: 'section “Rest round about”'
    claim: '1 Kgs. 8:56, Solomon: the LORD “hath given rest unto his people Israel” and no word has failed (Church''s cross-reference at Josh. 21:45)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'hath given rest unto his people Israel, according to all that he promised: there hath not failed one word'
  - where: 'section “Rest round about”'
    claim: 'Josh. 22:4 uses the words of Josh. 1:15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/22?lang=eng'
    quote: 'the Lord your God hath given rest unto your brethren, as he promised them'
  - where: 'section “The farewell”'
    claim: 'Josh. 23:1 opens the farewell on the rest in 21:44''s words'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/23?lang=eng'
    quote: 'a long time after that the Lord had given rest unto Israel from all their enemies round about'
  - where: 'section “The farewell”'
    claim: 'Josh. 23:13: snares and traps until Israel perishes from the good land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/23?lang=eng'
    quote: 'they shall be snares and traps unto you, and scourges in your sides, and thorns in your eyes, until ye perish from off this good land'
  - where: 'section “The farewell”'
    claim: 'Josh. 23:14–16: every good word has come, and the evil will come as surely if Israel transgresses the covenant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/23?lang=eng'
    quote: 'as all good things are come upon you, which the Lord your God promised you; so shall the Lord bring upon you all evil things'
  - where: 'section “The farewell”'
    claim: 'Josh. 23:16: the condition, transgressing the covenant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/23?lang=eng'
    quote: 'When ye have transgressed the covenant of the Lord your God'
  - where: 'section “The farewell”'
    claim: 'Connection made by this page: three rests followed at once by what remains or a condition (1:13 by 1:15; 11:23 by 13:1; 23:1 by 23:4, 23:13), and 21:44–45 turned to warning in 23:14–16; Hebrews'' sentence read beside that shape (the page''s comparison, not Hebrews'' argument)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/23?lang=eng'
    quote: 'I have divided unto you by lot these nations that remain'
  - where: 'section “The farewell”'
    claim: 'Connection made by this page (Hebrew lists behind it): the verb šāʾar “remain” (H7604) is in Josh. 13:1, 13:2, 23:4, 23:7, 23:12; 13:1 nišʾărâ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'נִשְׁאֲרָ֥ה'
  - where: 'section “If Jesus had given them rest”'
    claim: '“Jesus” in Heb. 4:8 is Joshua: the Church''s cross-reference is Acts 7:45 (and Ex. 17:9)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/7?lang=eng'
    quote: 'Which also our fathers that came after brought in with Jesus into the possession of the Gentiles'
  - where: 'section “If Jesus had given them rest”'
    claim: 'Heb. 4:7: Hebrews reasons from the Psalm''s later “To day,” spoken in David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/4?lang=eng'
    quote: 'Again, he limiteth a certain day, saying in David, To day, after so long a time'
  - where: 'section “If Jesus had given them rest”'
    claim: 'Heb. 4:8–9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/4?lang=eng'
    quote: 'For if Jesus had given them rest, then would he not afterward have spoken of another day. [v.9] There remaineth therefore a rest to the people of God.'
  - where: 'section “If Jesus had given them rest”'
    claim: 'The rest ancient Israel failed to enter was symbolically represented by the land of Canaan'
    key: nt-manual-hebrews-1-6
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/hebrews/chapter-48-hebrews-1-6?lang=eng'
    quote: 'which was symbolically represented by the land of Canaan'
  - where: 'section “If Jesus had given them rest”'
    claim: 'Joshua leading Israel can remind us of Jesus Christ leading the faithful to the celestial kingdom'
    key: scripture-helps-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/19-joshua-1-8-23-24?lang=eng'
    quote: 'Joshua leading Israel into the promised land can remind us of Jesus Christ leading all the faithful into the ultimate land of promise, the celestial kingdom.'
  - where: 'section “If Jesus had given them rest”'
    claim: 'Connection made by this page: Josh. 23:13 (“until ye perish from off this good land”) set beside Heb. 4:1 (“lest any of you should seem to come short of it”); Joshua''s last word on the rest is how it could be lost, Hebrews'' first word on the rest that remains is the same fear'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/4?lang=eng'
    quote: 'Let us therefore fear, lest, a promise being left us of entering into his rest, any of you should seem to come short of it.'
  - where: 'section “If Jesus had given them rest”'
    claim: 'Alma 12:34 (the Church''s cross-reference at Alma 12:34 is D&C 84:24)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/12?lang=eng'
    quote: 'whosoever repenteth, and hardeneth not his heart, he shall have claim on mercy through mine Only Begotten Son, unto a remission of his sins; and these shall enter into my rest.'
  - where: 'section “If Jesus had given them rest”'
    claim: 'Alma 13:12, 13:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/13?lang=eng'
    quote: 'there were many, exceedingly great many, who were made pure and entered into the rest of the Lord their God.'
  - where: 'section “If Jesus had given them rest”'
    claim: 'To enter into the rest of the Lord is to be won over to Him and feel at rest in Christ'
    key: jfs-teachings-48
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-f-smith/chapter-48?lang=eng'
    quote: 'through the love of God I have been won over to Him, so that I can feel at rest in Christ'
  - where: 'section “Where this reaches now”'
    claim: 'Matt. 11:28'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/11?lang=eng'
    quote: 'Come unto me, all ye that labour and are heavy laden, and I will give you rest.'
  - where: 'section “Where this reaches now”'
    claim: 'The Lord''s promised rest in this life and the place of rest in the next'
    key: gs-rest
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/rest?lang=eng'
    quote: 'The Lord has promised such rest to His faithful followers during this life. He has also prepared a place of rest for them in the next life.'
  - where: 'section “Where this reaches now”'
    claim: 'Josh. 23:8 “cleave unto the LORD your God”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/23?lang=eng'
    quote: 'But cleave unto the Lord your God, as ye have done unto this day.'
  - where: 'section “Where this reaches now”'
    claim: 'Rest from the world''s intensity, uncertainty and anguish is found by overcoming the world through covenants with God'
    key: nelson-overcome-world
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2022/10/47nelson?lang=eng'
    quote: 'Find rest from the intensity, uncertainty, and anguish of this world by overcoming the world through your covenants with God.'
