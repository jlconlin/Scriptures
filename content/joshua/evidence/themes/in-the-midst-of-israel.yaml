    claim: '9:7 bĕqirbî, 9:22 bĕqirbēnû, 9:16 ûbĕqirbô, 10:1 bĕqirbām'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'בְּ/קִרְבֵּ֥/נוּ'
  - where: 'section “Ye dwell among us”'
    claim: 'Josh. 10:1 “were among them”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/10?lang=eng'
