    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/29?lang=eng'
    quote: 'and thy stranger that is in thy camp, from the hewer of thy wood unto the drawer of thy water'
  - where: 'section “Ye dwell among us”'
    claim: 'Deut. 29:12 “That thou shouldest enter into covenant with the Lord thy God”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/29?lang=eng'
    quote: 'That thou shouldest enter into covenant with the Lord thy God, and into his oath'
  - where: 'section “Ye dwell among us”'
    claim: 'Muhlestein: “Shortly thereafter he made a covenant with the Gibeonites that incorporated them into the house of Israel (see Joshua 9).”'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
