    claim: '13:13 and 16:10 bĕqereb with yāšab, as 6:25'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'בְּ/קֶ֤רֶב'
  - where: 'section “Until this day”'
    claim: 'Josh. 23:7, 12, 13 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/23?lang=eng'
