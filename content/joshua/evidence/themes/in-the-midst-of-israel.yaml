page: in-the-midst-of-israel
claims:
  # ---------- opening ----------
  - where: 'opening'
    claim: 'qereb (H7130) 20 occurrences in 19 verses of Joshua; 3:5, 3:10 bĕqirbĕkem; 6:25 bĕqereb yiśrāʾēl; 7:12–13 bĕqirbĕkā / miqqirbĕkem; 8:35; 9:7, 16, 22; 10:1; 13:13; 16:10; 24:23'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'בְּ/קֶ֣רֶב'
  - where: 'opening'
    claim: 'Josh. 3:5, 10 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/3?lang=eng'
    quote: 'Hereby ye shall know that the living God is among you'
  - where: 'opening'
    claim: 'Josh. 6:23, 25 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/6?lang=eng'
    quote: 'and they brought out all her kindred, and left them without the camp of Israel.'
  - where: 'opening'
    claim: 'Josh. 7:1, 12, 13 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/7?lang=eng'
    quote: 'There is an accursed thing in the midst of thee, O Israel'
  - where: 'opening'
    claim: 'Josh. 7:12 “neither will I be with you any more, except ye destroy the accursed from among you”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/7?lang=eng'
    quote: 'neither will I be with you any more, except ye destroy the accursed from among you.'
  - where: 'opening'
    claim: 'Josh. 8:35; 9:7, 22; 13:13; 24:23 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/13?lang=eng'
    quote: 'but the Geshurites and the Maachathites dwell among the Israelites until this day.'
  - where: 'opening'
    claim: 'Josh. 24:23 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/24?lang=eng'
    quote: 'put away, said he, the strange gods which are among you, and incline your heart unto the Lord God of Israel.'
  - where: 'opening'
    claim: 'Deut. 23:14 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/23?lang=eng'
    quote: 'For the Lord thy God walketh in the midst of thy camp, to deliver thee, and to give up thine enemies before thee; therefore shall thy camp be holy: that he see no unclean thing in thee, and turn away from thee.'
  - where: 'opening'
    claim: 'Calabro: “Rahab is thus revealed in the end to be the true insider, essentially taking the place of Achan in the very same tribe of Judah.”'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Rahab is thus revealed in the end to be the true insider, essentially taking the place of Achan in the very same tribe of Judah.'
  - where: 'opening'
    claim: 'Old Testament Minute on Josh. 7: “a somewhat ironic inversion of the fate of Rahab and her family, all Canaanites”'
    key: ot-minute-josh-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-7'
    quote: 'a somewhat ironic inversion of the fate of Rahab and her family, all Canaanites'
  - where: 'opening'
    claim: 'Connection made by this page: the noun qereb carries the Rahab/Achan reversal (6:25 in the midst; 7:13 in/from the midst) and runs to 24:23, where the strange gods are put out of the midst with the verb of 7:13; birth neither kept Achan in nor Rahab out, and what the midst holds decides whether the LORD stays in it (7:12; Deut. 23:14). Calabro and the Old Testament Minute make the Rahab/Achan contrast without the word; no source read joins 7:13 to 24:23'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'הָסִ֛ירוּ'
  # ---------- section “The living God is among you” ----------
  - where: 'section “The living God is among you”'
    claim: '3:5 and 3:10 bĕqirbĕkem'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'בְּ/קִרְבְּ/כֶ֑ם'
  - where: 'section “The living God is among you”'
    claim: 'Josh. 3:10 as quoted (the seven nations)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/3?lang=eng'
    quote: 'and that he will without fail drive out from before you the Canaanites, and the Hittites, and the Hivites'
  - where: 'section “The living God is among you”'
    claim: 'Deut. 23:14 bĕqereb maḥănekā, the noun of Josh. 6:25'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'בְּ/קֶ֥רֶב'
  - where: 'section “The living God is among you”'
    claim: 'Num. 5:2 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/5?lang=eng'
    quote: 'that they put out of the camp every leper, and every one that hath an issue, and whosoever is defiled by the dead'
  - where: 'section “The living God is among you”'
    claim: 'Num. 31:19 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/31?lang=eng'
    quote: 'And do ye abide without the camp seven days: whosoever hath killed any person, and whosoever hath touched any slain, purify both yourselves and your captives'
  # ---------- section “Without the camp, then in the midst” ----------
  - where: 'section “Without the camp, then in the midst”'
    claim: 'Josh. 2:11, 12–13 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/2?lang=eng'
    quote: 'swear unto me by the Lord, since I have shewed you kindness, that ye will also shew kindness unto my father’s house'
  - where: 'section “Without the camp, then in the midst”'
    claim: 'Josh. 2:11 “the Lord your God, he is God in heaven above, and in earth beneath”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/2?lang=eng'
    quote: 'for the Lord your God, he is God in heaven above, and in earth beneath.'
  - where: 'section “Without the camp, then in the midst”'
    claim: '6:23 miḥûṣ lĕmaḥănēh yiśrāʾēl, the only miḥûṣ with maḥăneh in Joshua; verb wayyanniḥûm (nûaḥ hiphil, “caused them to rest”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'מִ/ח֖וּץ'
  - where: 'section “Without the camp, then in the midst”'
    claim: 'Cambridge on 6:23: “As heathen, they were unclean, and must therefore remain a specified time, probably seven days, “without the camp.””'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/6.htm'
    quote: 'As heathen, they were unclean, and must therefore remain a specified time, probably seven days'
  - where: 'section “Without the camp, then in the midst”'
    claim: 'Pulpit on 6:23: “They were as yet, as Gentiles, unclean (cf. Numbers 5:2; Numbers 31:19).”'
    key: pulpit-joshua
    url: 'https://biblehub.com/commentaries/pulpit/joshua/6.htm'
    quote: 'They were as yet, as Gentiles, unclean (cf. Numbers 5:2; Numbers 31:19).'
  - where: 'section “Without the camp, then in the midst”'
    claim: 'Keil on 6:22–23: “a place of safety outside the camp of Israel”'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/6.htm'
    quote: 'a place of safety outside the camp of Israel'
  - where: 'section “Without the camp, then in the midst”'
    claim: 'Josh. 6:25 as quoted; 6:25 bĕqereb yiśrāʾēl'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/6?lang=eng'
    quote: 'and she dwelleth in Israel even unto this day; because she hid the messengers, which Joshua sent to spy out Jericho.'
  - where: 'section “Without the camp, then in the midst”'
    claim: 'Fisher: “much stronger in the original Hebrew than in the King James English”; “a root signifying the inward parts of a body”; “she dwelled “in the midst” of Israel, or even thickly in the midst, utterly embedded within the people, a far cry from her marginal existence in Jericho”'
    key: fisher-rahab
    url: 'https://rsc.byu.edu/vol-25-no-1-2024/rahab-perpetuation-deliverance'
    quote: 'utterly embedded within the people, a far cry from her marginal existence in Jericho'
  - where: 'section “Without the camp, then in the midst”'
    claim: 'Fisher: “much stronger in the original Hebrew than in the King James English”; “the inward parts of a body”'
    key: fisher-rahab
    url: 'https://rsc.byu.edu/vol-25-no-1-2024/rahab-perpetuation-deliverance'
    quote: 'is much stronger in the original Hebrew than in the King James English'
  - where: 'section “Without the camp, then in the midst”'
    claim: 'Scripture Helps: “Rahab and her family became part of the Israelite nation in the promised land.” “she is mentioned in Matthew as an ancestor of Jesus Christ”'
    key: scripture-helps-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/19-joshua-1-8-23-24?lang=eng'
    quote: 'Rahab and her family became part of the Israelite nation in the promised land.'
  - where: 'section “Without the camp, then in the midst”'
    claim: 'Student Manual 21-5 quoting Fallows: her marriage to Salmon “implies her previous conversion to Judaism”'
    key: ot-manual-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/joshua-1-24-the-entry-into-the-promised-land?lang=eng'
    quote: 'this implies her previous conversion to Judaism'
  # ---------- section “An accursed thing in the midst of thee” ----------
  - where: 'section “An accursed thing in the midst of thee”'
    claim: 'Josh. 7:1, 12, 13, 24, 26 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/7?lang=eng'
    quote: 'thou canst not stand before thine enemies, until ye take away the accursed thing from among you.'
  - where: 'section “An accursed thing in the midst of thee”'
    claim: '7:13 bĕqirbĕkā and miqqirbĕkem'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'בְּ/קִרְבְּ/ךָ֙'
  - where: 'section “An accursed thing in the midst of thee”'
    claim: 'Keil on 7:12: “until this ban had been removed from their midst, the Lord would not help them any further”'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/7.htm'
    quote: 'until this ban had been removed from their midst, the Lord would not help them any further'
  - where: 'section “An accursed thing in the midst of thee”'
    claim: 'Scripture Helps on Achan: “Even though Achan acted alone, the Lord attributed the sin to all of Israel. As a result, they lost the Lord’s protection”'
    key: scripture-helps-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/19-joshua-1-8-23-24?lang=eng'
    quote: 'Even though Achan acted alone, the Lord attributed the sin to all of Israel. As a result, they lost the Lord’s protection'
  - where: 'section “An accursed thing in the midst of thee”'
    claim: 'Josh. 7:24 “unto the valley of Achor”; 7:26 “unto this day”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/7?lang=eng'
    quote: 'and they brought them unto the valley of Achor.'
  - where: 'section “An accursed thing in the midst of thee”'
    claim: 'Calabro: Achan “appears at first to be the quintessential insider: an Israelite soldier of the tribe of Judah”'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Achan appears at first to be the quintessential insider: an Israelite soldier of the tribe of Judah.'
  - where: 'section “An accursed thing in the midst of thee”'
    claim: 'Calabro: Rahab “a Canaanite harlot and thus the quintessential outsider, distinguishes herself as one who truly sees God’s work”'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'a Canaanite harlot and thus the quintessential outsider, distinguishes herself as one who truly sees God’s work'
  - where: 'section “An accursed thing in the midst of thee”'
    claim: 'Connection made by this page: one word, qereb, names where Rahab comes to dwell (6:25) and where the accursed thing must not stay (7:13); read side by side the two verses say what the midst will and will not hold; Calabro and the Minute make the reversal without the word'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'מִֽ/קִּרְבְּ/כֶֽם'
  # ---------- section “Ye dwell among us” ----------
  - where: 'section “Ye dwell among us”'
    claim: 'Josh. 9:7, 15, 16, 19, 22, 23 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/9?lang=eng'
    quote: 'Wherefore have ye beguiled us, saying, We are very far from you; when ye dwell among us?'
