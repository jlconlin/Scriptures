  # ---------- section “Put away the strange gods which are among you” ----------
  - where: 'section “Put away the strange gods which are among you”'
    claim: 'Josh. 24:23 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/24?lang=eng'
    quote: 'the strange gods which are among you'
  - where: 'section “Put away the strange gods which are among you”'
    claim: '24:23 hāsîrû … bĕqirbĕkem and 7:13 hăsîrĕkem … miqqirbĕkem share the verb sûr (hiphil, H5493) and the noun qereb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'הֲסִירְ/כֶ֥ם'
  - where: 'section “Put away the strange gods which are among you”'
    claim: 'Connection made by this page: 7:13 and 24:23 are the book’s two commands to remove something from Israel’s midst, with one verb and one noun; both name things Israel brought in (devoted spoil, foreign gods), never a person who confessed the LORD; no commentary read joins the verses'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'בְּ/קִרְבְּ/כֶ֑ם'
  # ---------- section “No more strangers and foreigners” ----------
  - where: 'section “No more strangers and foreigners”'
    claim: 'Heb. 11:31 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/11?lang=eng'
    quote: 'By faith the harlot Rahab perished not with them that believed not, when she had received the spies with peace.'
  - where: 'section “No more strangers and foreigners”'
    claim: 'Matt. 1:5 “Salmon begat Booz of Rachab”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/1?lang=eng'
    quote: 'And Salmon begat Booz of Rachab'
  - where: 'section “No more strangers and foreigners”'
    claim: 'Scripture Helps: “she is mentioned in Matthew as an ancestor of Jesus Christ”'
    key: scripture-helps-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/19-joshua-1-8-23-24?lang=eng'
    quote: 'she is mentioned in Matthew as an ancestor of Jesus Christ'
  - where: 'section “No more strangers and foreigners”'
    claim: 'Fisher: “Nothing demonstrates Rahab’s complete assimilation and unification into her new community more than her marriage and prestigious place in the genealogies of the people.”'
    key: fisher-rahab
    url: 'https://rsc.byu.edu/vol-25-no-1-2024/rahab-perpetuation-deliverance'
    quote: 'Nothing demonstrates Rahab’s complete assimilation and unification into her new community more than her marriage and prestigious place in the genealogies of the people.'
  - where: 'section “No more strangers and foreigners”'
