page: in-the-midst-of-israel
claims:
  - where: 'opening'
    claim: 'The household is let live and set outside the camp, then “in the midst”: Josh. 6:23 and 6:25 (the narrative the opening summarizes)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/6?lang=eng'
    quote: 'and left them without the camp of Israel'
  - where: 'section “Outside the camp, then in the midst”'
    claim: '“Without the camp of Israel” occurs only at Josh. 6:23 (occurrences.mjs joshua "without the camp": 1 verse, 1 occurrence, in 1 chapter)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/6?lang=eng'
    quote: 'and they brought out all her kindred, and left them without the camp of Israel.'
  - where: 'section “Outside the camp, then in the midst”'
    claim: 'The Hebrew behind “dwelleth in Israel” (6:25) is vattēšeb bĕqereb yiśrāʾēl, “in the midst of Israel” (H7130)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'וַ/תֵּ֨שֶׁב֙ בְּ/קֶ֣רֶב'
  - where: 'section “Outside the camp, then in the midst”'
    claim: 'The King James Version translates bĕqereb merely “in” Israel; “a far cry from her marginal existence in Jericho”'
    key: fisher-rahab
    url: 'https://rsc.byu.edu/vol-25-no-1-2024/rahab-perpetuation-deliverance'
    quote: 'translated merely “in” Israel in the King James Version, actually comes from a root signifying the inward parts of a body. A more accurate translation here would be that she dwelled “in the midst” of Israel'
  - where: 'section “Outside the camp, then in the midst”'
    claim: '“a far cry from her marginal existence in Jericho”'
    key: fisher-rahab
    url: 'https://rsc.byu.edu/vol-25-no-1-2024/rahab-perpetuation-deliverance'
    quote: 'utterly embedded within the people, a far cry from her marginal existence in Jericho.'
  - where: 'section “Outside the camp, then in the midst”'
    claim: 'Rahab and her family became part of the Israelite nation'
    key: scripture-helps-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/19-joshua-1-8-23-24?lang=eng'
    quote: 'Rahab and her family became part of the Israelite nation in the promised land.'
  - where: 'section “Outside the camp, then in the midst”'
    claim: 'Connection made by this page: Josh. 6:23 “left them without the camp of Israel” set beside 6:25 “she dwelleth in Israel”; the two verses stand two sentences apart (6:23 and 6:25 quoted; no source read comments on them together)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/6?lang=eng'
    quote: 'And Joshua saved Rahab the harlot alive, and her father’s household, and all that she had; and she dwelleth in Israel even unto this day'
  - where: 'section “What the midst cannot hold”'
    claim: 'The noun in “in the midst of thee” and “from among you” (7:13) is qereb (H7130), the noun of 6:25'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'בְּ/קִרְבְּ/ךָ֙'
  - where: 'section “What the midst cannot hold”'
    claim: 'Achan was of the tribe of Judah'
    key: bd-achan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/achan?lang=eng'
    quote: 'A man of the tribe of Judah who seized and attempted to hide the spoils from the battle of Jericho'
  - where: 'section “What the midst cannot hold”'
    claim: 'Connection made by this page: Rahab (6:25, bĕqereb, “in the midst of Israel”) and Achan (7:13, “in the midst of thee”) set side by side, the one brought in from outside the camp, the other taken out to Achor'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'בְּ/קִרְבְּ/ךָ֙'
  - where: 'section “The stranger at the ark”'
    claim: 'gēr (H1616), “stranger,” occurs in Joshua in 3 verses only: 8:33, 8:35, 20:9 (occurrences.mjs joshua --hebrew H1616: 3 occurrences in 3 verses)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'וְ/לַ/גֵּר֙'
  - where: 'section “The stranger at the ark”'
    claim: 'The stranger is “a man of non-Israelite birth, resident in the promised land with the permission of the Israelite authorities”'
    key: bd-stranger
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/stranger?lang=eng'
    quote: 'a man of non-Israelite birth, resident in the promised land with the permission of the Israelite authorities'
  - where: 'section “The stranger at the ark”'
    claim: 'The gēr did not share full membership in the covenant community; the Lord commanded equal treatment'
    key: seely-cry-widow
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/cry-widow-fatherless-stranger'
    quote: 'did not share full membership in the covenant community'
  - where: 'section “The stranger at the ark”'
    claim: 'Equal treatment commanded'
    key: seely-cry-widow
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/cry-widow-fatherless-stranger'
    quote: 'the Lord commanded the children of Israel to give the strangers equal treatment'
  - where: 'section “The stranger at the ark”'
    claim: 'A foreigner could, through covenant, become part of Israel'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'indicates that the foreigner could, through covenant, become part of Israel.'
  - where: 'section “Let them live, and go up to save them”'
    claim: 'The Gibeonites became perpetual slaves of Israel'
    key: ot-manual-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/joshua-1-24-the-entry-into-the-promised-land?lang=eng'
    quote: 'the people of Gibeon became the perpetual slaves of Israel.'
  - where: 'section “Let them live, and go up to save them”'
    claim: 'The Gibeonites were not of the children of Israel; Israel had sworn to them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/21?lang=eng'
    quote: 'now the Gibeonites were not of the children of Israel, but of the remnant of the Amorites; and the children of Israel had sworn unto them'
  - where: 'section “Let them live, and go up to save them”'
    claim: 'Joshua, faithful to the treaty, led Israel’s armies against the five kings'
    key: brandt-conquest
    url: 'https://www.churchofjesuschrist.org/study/ensign/1973/10/the-conquest-of-canaan?lang=eng'
    quote: 'Faithful to the treaty, Joshua led the armies of Israel against the forces of the southern league of kings.'
  - where: 'section “Let them live, and go up to save them”'
    claim: 'Connection made by this page: the verb ḥāyâ (H2421), “let live,” is the same in Rahab’s 2:13, 6:17, 6:25 and Gibeon’s 9:15, 9:20, 9:21; Joshua uses it in 8 verses (2:13, 5:8, 6:17, 6:25, 9:15, 9:20, 9:21, 14:10; occurrences.mjs joshua --hebrew H2421); both oaths sworn by the LORD (2:12; 9:19)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'לְ/חַיּוֹתָ֑/ם'
  - where: 'section “Let them live, and go up to save them”'
    claim: 'The Hebrew of 6:25 uses the same root: “saved … alive” (heḥĕyâ, H2421)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'הֶחֱיָ֣ה'
  - where: 'section “A refuge for the stranger”'
    claim: 'The cities of refuge are for the stranger too (20:9; Num. 35:15)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/35?lang=eng'
    quote: 'These six cities shall be a refuge, both for the children of Israel, and for the stranger, and for the sojourner among them'
  - where: 'section “A refuge for the stranger”'
    claim: 'In 20:9 “among them” is bĕtôkām (tôk, H8432), not qereb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'בְּ/תוֹכָ֔/ם'
  - where: 'section “A refuge for the stranger”'
    claim: 'The cities served aliens who might not have any other judicial recourse'
    key: ot-minute-josh-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-20'
    quote: 'especially aliens who might not have any other judicial recourse.'
  - where: 'section “No more strangers”'
    claim: 'Heb. 11:31 on Rahab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/11?lang=eng'
    quote: 'By faith the harlot Rahab perished not with them that believed not, when she had received the spies with peace.'
  - where: 'section “No more strangers”'
    claim: 'Rahab is mentioned in Matthew as an ancestor of Jesus Christ (Matt. 1:5 “Booz of Rachab”)'
    key: scripture-helps-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/19-joshua-1-8-23-24?lang=eng'
    quote: 'she is mentioned in Matthew as an ancestor of Jesus Christ.'
  - where: 'section “No more strangers”'
    claim: 'Matt. 1:5 names Booz of Rachab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/1?lang=eng'
    quote: 'And Salmon begat Booz of Rachab'
  - where: 'section “No more strangers”'
    claim: '3 Ne. 9:17: as many as received Him become sons of God; by Him redemption cometh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/9?lang=eng'
    quote: 'And as many as have received me, to them have I given to become the sons of God'
  - where: 'section “No more strangers”'
    claim: 'A non-Israelite becomes a member of the house of Israel through faith in Jesus Christ, with baptism and the Holy Ghost'
    key: bd-adoption
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/adoption?lang=eng'
    quote: 'A person who is of non-Israelite lineage becomes a member of the house of Israel through faith in Jesus Christ when it is accompanied by baptism in water and the reception of the Holy Ghost.'
  - where: 'section “No more strangers”'
    claim: 'Connection made by this page: Rahab brought from outside the camp into the midst by an oath Israel kept (6:23–25), the stranger at Ebal (8:33–35), Gibeon as servants (9:23), set beside Eph. 2:12–19 (“strangers … made nigh by the blood of Christ … no more strangers and foreigners, but fellowcitizens”)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/eph/2?lang=eng'
    quote: 'Now therefore ye are no more strangers and foreigners, but fellowcitizens with the saints, and of the household of God'
  - where: 'section “No more strangers”'
    claim: 'Eph. 2:12–13 wording'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/eph/2?lang=eng'
    quote: 'But now in Christ Jesus ye who sometimes were far off are made nigh by the blood of Christ.'
  - where: 'section “Gathered into his family”'
    claim: 'Blessings to the literal seed and those gathered by adoption, predicated on acceptance of the Lord and obedience'
    key: nelson-1995-children-of-the-covenant
    url: 'https://www.churchofjesuschrist.org/study/ensign/1995/05/children-of-the-covenant?lang=eng'
    quote: 'The literal seed of Abraham and those who are gathered into his family by adoption receive these promised blessings—predicated upon acceptance of the Lord and obedience to his commandments.'
  - where: 'section “Gathered into his family”'
    claim: 'Ex. 22:21 as Muhlestein quotes it'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: '“Thou shalt neither vex a stranger, nor oppress him: for ye were strangers in the land of Egypt” (Exodus 22:21).'
