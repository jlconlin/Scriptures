    key: pulpit-joshua
    url: 'https://biblehub.com/commentaries/pulpit/joshua/9.htm'
    quote: 'equality of rights had never been promised them'
  - where: 'section “Ye dwell among us”'
    claim: 'Student Manual 21-19: “the people of Gibeon became the perpetual slaves of Israel”'
    key: ot-manual-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/joshua-1-24-the-entry-into-the-promised-land?lang=eng'
    quote: 'the people of Gibeon became the perpetual slaves of Israel'
  - where: 'section “Ye dwell among us”'
    claim: 'Keil on 9:18–20: “they were not justified in taking the oath”; bound to observe it'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/9.htm'
