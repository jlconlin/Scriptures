  - where: 'section “Ye dwell among us”'
    claim: 'Josh. 8:33, 35 as quoted; 8:35 bĕqirbām; gēr (H1616) only at 8:33, 8:35, 20:9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/8?lang=eng'
    quote: 'with the women, and the little ones, and the strangers that were conversant among them.'
  - where: 'section “Ye dwell among us”'
    claim: '8:35 wĕhaggēr hahōlēk bĕqirbām'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'וְ/הַ/גֵּ֖ר'
  - where: 'section “Ye dwell among us”'
    claim: 'Seely and Seely: the gēr “did not share full membership in the covenant community”'
    key: seely-cry-widow
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/cry-widow-fatherless-stranger'
