page: no-part-in-the-lord
claims:
  # ---------- opening ----------
  - where: 'opening'
    claim: 'ḥēleq (H2506) 9 occurrences in 9 verses of Joshua: 14:4; 15:13; 18:5, 6, 7, 9; 19:9; 22:25, 27'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'חֵ֤לֶק'
  - where: 'opening'
    claim: 'Josh. 15:13; 19:9; 18:5–9; 14:4; 18:7 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/18?lang=eng'
    quote: 'But the Levites have no part among you; for the priesthood of the Lord is their inheritance'
  - where: 'opening'
    claim: 'Josh. 14:4 “they gave no part unto the Levites in the land”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/14?lang=eng'
    quote: 'therefore they gave no part unto the Levites in the land, save cities to dwell in'
  - where: 'opening'
    claim: 'Josh. 22:24–25, 27 as quoted; no footnote at 22:25 or 22:27'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/22?lang=eng'
    quote: 'ye have no part in the Lord: so shall your children make our children cease from fearing the Lord.'
  - where: 'opening'
    claim: 'BDB files Josh. 22:25, 27 under 1c “share or interest in … of right (privilege) in YHWH,” and 14:4; 15:13; 18:5–7, 9; 19:9 under 2a “portion, tract, of land”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2506.htm'
    quote: 'of right (privilege) in ביהוה ׳ח Joshua 22:25,27'
  - where: 'opening'
    claim: 'BDB 2a: “portion, tract, of land”; “as distributive at conquest Joshua 19:9, seven portions Joshua 18:5,6,9”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2506.htm'
    quote: 'as distributive at conquest Joshua 19:9, seven portions Joshua 18:5,6,9'
  - where: 'opening'
    claim: 'Connection made by this page: Joshua uses ḥēleq of a share of the land and of a share in the LORD, and gives them to different tribes: Levi has no part in the land and has the LORD; the eastern tribes have land and fear having no part in the LORD; so a part in the LORD is not located where the ground is. No commentary read pairs 18:7 with 22:25; the lexicon’s two senses are the warrant'
    key: bdb
    url: 'https://biblehub.com/hebrew/2506.htm'
    quote: 'share or interest in'
  # ---------- section “Seven parts” ----------
  - where: 'section “Seven parts”'
    claim: 'Josh. 18:5–9, 15:13, 19:9 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/18?lang=eng'
    quote: 'and described it by cities into seven parts in a book'
  - where: 'section “Seven parts”'
    claim: 'Josh. 15:13 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/15?lang=eng'
    quote: 'he gave a part among the children of Judah, according to the commandment of the Lord to Joshua'
  - where: 'section “Seven parts”'
    claim: 'Josh. 19:9 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/19?lang=eng'
    quote: 'for the part of the children of Judah was too much for them'
  - where: 'section “Seven parts”'
    claim: 'naḥălâ (H5159) 50 occurrences in 43 verses of Joshua; almost every tribe’s section closes “This is the inheritance of the children of …” (not Manasseh’s, 13:29–31; 17:1–13)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'נַחֲלָ֑ה'
  # ---------- section “The LORD God of Israel was their inheritance” ----------
  - where: 'section “The LORD God of Israel was their inheritance”'
    claim: 'Josh. 13:14, 33 as quoted; footnote 13:14a “inheritance”: Num. 18:20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/13?lang=eng'
    quote: 'the Lord God of Israel was their inheritance, as he said unto them.'
  - where: 'section “The LORD God of Israel was their inheritance”'
    claim: 'Josh. 13:14 “the sacrifices of the Lord God of Israel made by fire are their inheritance”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/13?lang=eng'
    quote: 'the sacrifices of the Lord God of Israel made by fire are their inheritance, as he said unto them.'
  - where: 'section “The LORD God of Israel was their inheritance”'
    claim: 'Cambridge on 18:7: “Notice the change here as compared with ch. Joshua 13:14. There “the sacrifices of Jehovah” are said to be the portion of Levi, and in Joshua 13:33, “Jehovah, God of Israel” is said to be their portion. Here we have “the priesthood of Jehovah””'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/18.htm'
    quote: 'Here we have “the priesthood of Jehovah,” as in Numbers 3:10'
  - where: 'section “The LORD God of Israel was their inheritance”'
    claim: 'Num. 18:20 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/18?lang=eng'
    quote: 'Thou shalt have no inheritance in their land, neither shalt thou have any part among them: I am thy part and thine inheritance among the children of Israel.'
  - where: 'section “The LORD God of Israel was their inheritance”'
    claim: 'Keil on 13:14: “so that the God of Israel himself is called the inheritance of Levi in Joshua 13:33 as in Numbers 18:20”'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/13.htm'
    quote: 'so that the God of Israel himself is called the inheritance of Levi in Joshua 13:33 as in Numbers 18:20'
  - where: 'section “The LORD God of Israel was their inheritance”'
    claim: 'Student Manual (Numbers 18): “They were not given land as the other tribes were because their inheritance was the priesthood instead (see v. 20).”'
    key: ot-manual-numbers-13-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-13-36-wilderness-wanderings-part-2?lang=eng'
    quote: 'They were not given land as the other tribes were because their inheritance was the priesthood instead'
  - where: 'section “The LORD God of Israel was their inheritance”'
    claim: 'Bible Dictionary, Levites: “They had no inheritance in Canaan (18:23–24); but they had the tithe (18:21), 48 cities”; “a claim on the alms of the people”'
    key: bd-levites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levites?lang=eng'
    quote: 'but they had the tithe'
  - where: 'section “The LORD God of Israel was their inheritance”'
    claim: 'Bible Dictionary, Levites: “a claim on the alms of the people”'
    key: bd-levites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levites?lang=eng'
    quote: 'a claim on the alms of the people'
  - where: 'section “The LORD God of Israel was their inheritance”'
    claim: 'Deut. 12:12; 14:27, 29 “no part nor inheritance”; Deut. 10:9 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/12?lang=eng'
    quote: 'forasmuch as he hath no part nor inheritance with you.'
  - where: 'section “The LORD God of Israel was their inheritance”'
    claim: 'Deut. 10:9 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/10?lang=eng'
    quote: 'Wherefore Levi hath no part nor inheritance with his brethren; the Lord is his inheritance'
  - where: 'section “The LORD God of Israel was their inheritance”'
    claim: 'Deut. 12:12 ʾên lô ḥēleq wĕnaḥălâ: the ʾên + ḥēleq construction of Josh. 18:7 and 22:25, 27, with naḥălâ beside it in 18:7 and in every Levite verse of Deuteronomy, and absent in 22:25, 27 (Josh. 14:4 has ḥēleq without naḥălâ)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'חֵ֥לֶק'
  # ---------- section “Out of their inheritance” ----------
  - where: 'section “Out of their inheritance”'
    claim: 'Josh. 21:3 as quoted; Levite cities east of Jordan at 21:27, 36–39'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/21?lang=eng'
    quote: 'And the children of Israel gave unto the Levites out of their inheritance, at the commandment of the Lord, these cities and their suburbs.'
  - where: 'section “Out of their inheritance”'
    claim: 'Josh. 21:27 Golan in Manasseh; 21:36–39 Bezer, Jahazah, Kedemoth, Mephaath in Reuben, Ramoth, Mahanaim, Heshbon, Jazer in Gad'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/21?lang=eng'
    quote: 'out of the tribe of Reuben, Bezer with her suburbs'
  - where: 'section “Out of their inheritance”'
    claim: 'Old Testament Minute on ch. 21: “the heads of the Levitical families came not to Joshua, the military commander, but rather to Eleazar, the priest”; “assigned not their own territory but rather certain cities within the territories given to the other tribes of Israel”'
    key: ot-minute-josh-21
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-21'
    quote: 'came not to Joshua, the military commander, but rather to Eleazar, the priest'
  - where: 'section “Out of their inheritance”'
    claim: 'Old Testament Minute: “the Levites were assigned not their own territory but rather certain cities within the territories given to the other tribes of Israel”'
    key: ot-minute-josh-21
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-21'
    quote: 'assigned not their own territory but rather certain cities within the territories given to the other tribes of Israel'
  # ---------- section “Ye have no part in the LORD” ----------
  - where: 'section “Ye have no part in the LORD”'
    claim: 'Num. 32:5, 7, 19 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/32?lang=eng'
    quote: 'For we will not inherit with them on yonder side Jordan, or forward; because our inheritance is fallen to us on this side Jordan eastward.'
  - where: 'section “Ye have no part in the LORD”'
    claim: 'Num. 32:7 “wherefore discourage ye the heart of the children of Israel”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/32?lang=eng'
    quote: 'And wherefore discourage ye the heart of the children of Israel from going over into the land which the Lord hath given them?'
  - where: 'section “Ye have no part in the LORD”'
    claim: 'Pulpit on 22:24: “For their own advantage these tribes had chosen to remain in the trans-Jordanic territory conquered by Moses.”'
    key: pulpit-joshua
    url: 'https://biblehub.com/commentaries/pulpit/joshua/22.htm'
    quote: 'For their own advantage these tribes had chosen to remain in the trans-Jordanic territory conquered by Moses.'
  - where: 'section “Ye have no part in the LORD”'
    claim: 'Josh. 22:1–6, 10, 12, 24–25 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/22?lang=eng'
    quote: 'What have ye to do with the Lord God of Israel?'
  - where: 'section “Ye have no part in the LORD”'
    claim: 'Josh. 22:10 “a great altar to see to”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/22?lang=eng'
    quote: 'a great altar to see to'
  - where: 'section “Ye have no part in the LORD”'
    claim: '22:24 mah-lākem wĕla-YHWH, “what to you and to the LORD”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'וְ/לַֽ/יהוָ֖ה'
  - where: 'section “Ye have no part in the LORD”'
    claim: 'Keil on 22:24: “What have ye to do with Jehovah, the God of Israel?” i.e., He does not concern you; He is our God'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/22.htm'
    quote: 'He does not concern you; He is our God'
  - where: 'section “Ye have no part in the LORD”'
    claim: 'Keil on 22:24–25: “There was some reason for this anxiety. For, inasmuch as in all the promises and laws Canaan alone … is always mentioned as the land which Jehovah would give to His people for their inheritance, it was quite a possible thing that at some future time the false conclusion might be drawn from this, that only the tribes who dwelt in Canaan proper were the true people of Jehovah.”'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/22.htm'
    quote: 'the false conclusion might be drawn from this, that only the tribes who dwelt in Canaan proper were the true people of Jehovah'
  - where: 'section “Ye have no part in the LORD”'
    claim: 'Keil: “There was some reason for this anxiety.”'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/22.htm'
    quote: 'There was some reason for this anxiety.'
  - where: 'section “Ye have no part in the LORD”'
    claim: 'Pulpit on 22:24–25: “It was quite possible that in future ages they might be regarded as outside the blessings and privileges of the Mosaic covenant.”'
    key: pulpit-joshua
    url: 'https://biblehub.com/commentaries/pulpit/joshua/22.htm'
    quote: 'It was quite possible that in future ages they might be regarded as outside the blessings and privileges of the Mosaic covenant.'
  - where: 'section “Ye have no part in the LORD”'
    claim: '18:7 kî ʾên ḥēleq lal-lĕwiyyim bĕqirbĕkem; 22:25, 27 ʾên lākem ḥēleq ba-YHWH: the same ʾên + ḥēleq, different order and preposition, and no naḥălâ in 22:25, 27'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'אֵין'
  - where: 'section “Ye have no part in the LORD”'
    claim: 'Connection made by this page: Joshua sets Levi beside the eastern tribes four times (13:8–14; 13:32–33; 14:3; 18:7); carrying the pairing to the fear of 22:25, 27 is the page’s: Levi has no part in the land and has the LORD, the eastern tribes have land and fear having no part in the LORD, and what they feared losing is what the tribe without ground was given; BDB’s two senses of ḥēleq are the warrant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/22?lang=eng'
    quote: 'that your children may not say to our children in time to come, Ye have no part in the Lord.'
  # ---------- section “Behold the pattern of the altar of the LORD” ----------
  - where: 'section “Behold the pattern of the altar of the LORD”'
    claim: 'Josh. 22:26–28, 31, 34 as quoted; footnote 22:31a “among”: Lev. 26:12 (11–12); D&C 101:18'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/22?lang=eng'
    quote: 'Behold the pattern of the altar of the Lord, which our fathers made, not for burnt offerings, nor for sacrifices; but it is a witness between us and you.'
  - where: 'section “Behold the pattern of the altar of the LORD”'
    claim: 'Josh. 22:31 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/22?lang=eng'
    quote: 'This day we perceive that the Lord is among us, because ye have not committed this trespass against the Lord'
  - where: 'section “Behold the pattern of the altar of the LORD”'
    claim: 'Josh. 22:34 “a witness between us that the Lord is God”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/22?lang=eng'
    quote: 'for it shall be a witness between us that the Lord is God.'
  - where: 'section “Behold the pattern of the altar of the LORD”'
    claim: 'Keil on 22:26–27: “before His face (i.e., before the tabernacle in which Jehovah was enthroned)”'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/22.htm'
    quote: 'before the tabernacle in which Jehovah was enthroned'
  - where: 'section “Behold the pattern of the altar of the LORD”'
    claim: 'Cambridge on 22:27: “a monument to future ages of the connection between the tribes divided by the river”; if Israel should “declare that the people beyond the river “had no part in the Lord,” this monument might be pointed to”'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/22.htm'
