page: no-part-in-the-lord
claims:
  - where: 'section “A part of the ground”'
    claim: 'ḥēleq (H2506) is in Joshua nine times in nine verses (14:4; 15:13; 18:5, 6, 7, 9; 19:9; 22:25, 27); 18:5, 6, 9 are the plural, ''seven parts'''
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'חֲלָקִ֑ים'
  - where: 'section “No part, because the LORD is their inheritance”'
    claim: '''As he said unto them'' (13:14) points to Num. 18:20; the Church''s footnote at 13:14 is Num. 18:20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/18?lang=eng'
    quote: 'Thou shalt have no inheritance in their land, neither shalt thou have any part among them: I am thy part and thine inheritance among the children of Israel.'
  - where: 'section “No part, because the LORD is their inheritance”'
    claim: 'The Levites had no inheritance in Canaan but the tithe, 48 cities and a claim on alms'
    key: bd-levites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levites?lang=eng'
    quote: 'They had no inheritance in Canaan (18:23–24); but they had the tithe (18:21), 48 cities (35:6), and a claim on the alms of the people at feast times (Deut. 12:18–19; 14:27–29).'
  - where: 'section “Out of their inheritance”'
    claim: 'The Levite heads came to Eleazar the priest, not to Joshua'
    key: ot-minute-josh-21
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-21'
    quote: 'Appropriately, the heads of the Levitical families came not to Joshua, the military commander, but rather to Eleazar, the priest (effectively their chief).'
  - where: 'section “Ye have no part in the LORD”'
    claim: 'The eastern tribes'' answer: what have ye to do with the LORD, one older reading: ''He does not concern you; He is our God'''
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/22.htm'
    quote: 'i.e., He does not concern you; He is our God.'
  - where: 'section “Ye have no part in the LORD”'
    claim: 'The lexicon lists Josh. 22:25, 27 under ''share or interest in'', of right (privilege) in the LORD, apart from the distributive sense (share of land)'
    key: bdb
    url: 'https://biblehub.com/hebrew/2506.htm'
    quote: 'of right (privilege) in ביהוה ׳ח Joshua 22:25,27 (P)'
  - where: 'section “Ye have no part in the LORD”'
    claim: 'Josh. 18:7 has ʾên + ḥēleq (''no part'') of the Levites; 22:25 has ʾên + ḥēleq of the eastern tribes in the LORD (same noun, same negative)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'חֵ֤לֶק'
  - where: 'section “Ye have no part in the LORD”'
    claim: 'Connection made by this page: Josh. 18:7 (“the Levites have no part among you”) set beside Josh. 22:25 (“ye have no part in the LORD”), on the same negative and noun, the object changed from the tribes'' midst to the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/22?lang=eng'
    quote: 'ye have no part in the LORD'
  - where: 'section “The inheritance that is the Lord Himself”'
    claim: 'Psalm 16 uses the same noun as the Levites'' (not a claim of deliberate allusion): ''portion'' in Ps. 16:5 is ḥēleq (H2506)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חֶלְקִ֥/י'
  - where: 'section “The inheritance that is the Lord Himself”'
    claim: 'Psalm 16 is headed ''A messianic psalm of David'''
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/16?lang=eng'
    quote: 'A messianic psalm of David'
  - where: 'section “The inheritance that is the Lord Himself”'
    claim: 'Peter quotes Psalm 16:8–11 in Acts 2 (the Church''s footnote at 2:25 is Ps. 16:8 (8–11)) and says David spoke of the resurrection of Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/2?lang=eng'
    quote: 'He seeing this before spake of the resurrection of Christ, that his soul was not left in hell, neither his flesh did see corruption.'
  - where: 'section “The inheritance that is the Lord Himself”'
    claim: 'Connection made by this page: Josh. 18:7 (“the priesthood of the LORD is their inheritance”) set beside D&C 84:35–38 (“all they who receive this priesthood receive me… all that my Father hath shall be given unto him”); D&C 84:34 names “the sons of Moses and of Aaron”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'And he that receiveth my Father receiveth my Father’s kingdom; therefore all that my Father hath shall be given unto him.'
  - where: 'section “The inheritance that is the Lord Himself”'
    claim: 'The LORD of the Old Testament, who was Levi''s inheritance, is Jehovah, the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'section “The LORD is my portion”'
    claim: 'The blessings of the oath and covenant of the priesthood are not just for priesthood holders'
    key: dc-student-manual-2017-84
    url: 'https://www.churchofjesuschrist.org/study/manual/doctrine-and-covenants-student-manual-2017/chapter-31-doctrine-and-covenants-84?lang=eng'
    quote: 'Therefore, the blessings of the oath and covenant of the priesthood are not just for priesthood holders.'
  - where: 'section “The LORD is my portion”'
    claim: '''All that my Father hath'' is for men and women sealed in the temple'
    key: dc-student-manual-2017-84
    url: 'https://www.churchofjesuschrist.org/study/manual/doctrine-and-covenants-student-manual-2017/chapter-31-doctrine-and-covenants-84?lang=eng'
    quote: 'God’s greatest blessings come to men and women who are sealed to each other in the temple.'
  - where: 'section “The LORD is my portion”'
    claim: 'President Nelson (quoted in the manual): no earthly reward could compensate for what the Lord will bestow on those who love Him, keep His commandments and endure to the end'
    key: dc-student-manual-2017-84
    url: 'https://www.churchofjesuschrist.org/study/manual/doctrine-and-covenants-student-manual-2017/chapter-31-doctrine-and-covenants-84?lang=eng'
    quote: 'It means that no earthly reward—no other success—could compensate for the bounties the Lord will bestow upon those who love Him, keep His commandments (see Moro. 4:3), and endure to the end (see D&C 14:7)”'
