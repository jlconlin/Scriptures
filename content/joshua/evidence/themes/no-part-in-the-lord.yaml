  - where: 'section “Behold the pattern of the altar of the LORD”'
    claim: 'Student Manual 21-28: “This chapter demonstrates the critical balance between true worship and apostate idolatry.”'
    key: ot-manual-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/joshua-1-24-the-entry-into-the-promised-land?lang=eng'
    quote: 'This chapter demonstrates the critical balance between true worship and apostate idolatry.'
  - where: 'section “Behold the pattern of the altar of the LORD”'
    claim: 'Old Testament Minute on ch. 22: “After hearing out the issue, Phinehas determined that the altar was legitimate.”'
    key: ot-minute-josh-22
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-22-0'
    quote: 'After hearing out the issue, Phinehas determined that the altar was legitimate.'
