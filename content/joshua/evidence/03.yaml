chapter: 3
claims:
- where: "setting"
  claim: "The crossing of the Jordan marks Israel's move from wandering tribes to a people in the land; the point of no return"
  key: "ot-minute-josh-3"
  url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-3'
  quote: 'Israel crossed over from its old identity as a group of wandering tribes in the wilderness to a new identity as conquering heroes in the land of promise. Like for Julius Caesar crossing the Rubicon, the crossing of the Jordan was the point of no return for Israel.'
- where: "setting"
  claim: "Scripture Helps says the crossing on dry ground was one way the Lord kept His promise to be with Joshua as with Moses"
  key: "scripture-helps-josh"
  url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/19-joshua-1-8-23-24?lang=eng'
  quote: 'One way the Lord fulfilled this promise was by helping the Israelites cross the Jordan River on dry ground, as they had crossed the Red Sea.'
- where: 'note 3:4 “Two thousand cubits behind the ark”'
  claim: "Two thousand cubits is about 3,000 feet"
  key: "cambridge-joshua"
  url: 'https://biblehub.com/commentaries/cambridge/joshua/3.htm'
  quote: 'two thousand cubits] a Sabbath day’s journey (Acts 1:12) = 3000 feet.'
- where: 'note 3:4 “Two thousand cubits behind the ark”'
  claim: "One older reading: the space was for reverence and so the ark could be watched as it led; the ark takes the place of the pillar of cloud"
  key: "cambridge-joshua"
  url: 'https://biblehub.com/commentaries/cambridge/joshua/3.htm'
  quote: 'Partly for the sake of reverence, partly that it might be observed and marked as it led the way.'
- where: 'note 3:4 “Two thousand cubits behind the ark”'
  claim: "In the wilderness the pillar of cloud led; now the ark takes its place"
  key: "cambridge-joshua"
  url: 'https://biblehub.com/commentaries/cambridge/joshua/3.htm'
  quote: 'In the wilderness the Pillar of Cloud had led the way, now the Ark of the Covenant takes its place.'
- where: 'note 3:10 “A sign of what lay across the river”'
  claim: "Calabro: the goal stated repeatedly, including Josh. 3:10, was to drive out the Canaanites; the herem applied to fortified cities in battle"
  key: "calabro-herem"
  url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
  quote: 'The war ḥērem was a ritualized form of destruction employed in battle, not a goal of conquest. The goal, expressed repeatedly throughout the Pentateuch and Joshua, was to “drive out” the wicked Canaanites (Exodus 23:28; … Joshua 3:10; 13:6; 17:12, 18).'
- where: 'note 3:10 “A sign of what lay across the river”'
  claim: "Calabro: the actual application was limited to specific fortified cities during battle"
  key: "calabro-herem"
  url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
  quote: 'the actual application was limited to specific fortified cities during battle.'
- where: 'note 3:15 “A river in flood”'
  claim: "The Jordan is comparatively narrow and shallow, but Israel crossed in its seasonal flood, the most perilous moment; this amplifies the miracle and shows Jehovah's mastery of the elements and, implicitly, of the Canaanite gods"
  key: "ot-minute-josh-3"
  url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-3'
  quote: 'Although the Jordan is a comparatively narrow and shallow river, the text informs us that the Israelites crossed during its seasonal flooding after the winter rains (verse 15).'
- where: 'note 3:15 “A river in flood”'
  claim: "Smoot: crossing at the most perilous moment shows Jehovah's mastery of the elements and implicitly of the Canaanite gods"
  key: "ot-minute-josh-3"
  url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-3'
  quote: 'the Israelites were crossing at the most perilous moment, demonstrating beyond question Jehovah’s mastery of the elements (and thereby, implicitly, of the Canaanite gods believed to control various aspects of nature).'
- where: 'note 3:16 “Upon an heap, at Adam”'
  claim: "BDB: nēd is a heap of waters, used of the Red Sea (Ex. 15:8; Ps. 78:13), of the Jordan (Josh. 3:13, 16) and in simile (Ps. 33:7)"
  key: "bdb"
  url: 'https://biblehub.com/hebrew/5067.htm'
  quote: 'נֵד noun masculineJoshua 3:13 heap of waters; of Red Sea Exodus 15:8 (song), Psalm 78:13; of Jordan Joshua 3:13,16; Psalm 33:7 (simile). נֵד קָצִיר Isaiah 17:11 harvest-heap is perhaps corrupt'
- where: 'note 3:16 “Upon an heap, at Adam”'
  claim: "Smoot glosses ned as 'dam, obstruction' and compares Ex. 15:8"
  key: "ot-minute-josh-3"
  url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-3'
  quote: 'Joshua 3:13; Hebrew ned, “dam, obstruction”; compare Exodus 15:8.'
- where: 'note 3:16 “Upon an heap, at Adam”'
  claim: "The written text reads 'at Adam'; the Keri (read) 'from Adam'; Keil keeps 'at Adam': the waters stood very far from the crossing, by the town of Adam"
  key: "keil-joshua"
  url: 'https://biblehub.com/commentaries/kad/joshua/3.htm'
  quote: 'so that they stood still as a heap "very far," sc., from the place of crossing, "by the town of Adam" (בּאדם must not be altered into מאדם, from Adam, according to the Keri), "which is by the side of Zarthan."'
- where: 'note 3:16 “Upon an heap, at Adam”'
  claim: "Keil: the city of Adam is not mentioned anywhere else"
  key: "keil-joshua"
  url: 'https://biblehub.com/commentaries/kad/joshua/3.htm'
  quote: 'The city of Adam, which is not mentioned anywhere else'
- where: 'note 3:16 “Upon an heap, at Adam”'
  claim: "BDB: tammu nikratu in 3:16 = were wholly cut off"
  key: "bdb"
  url: 'https://biblehub.com/hebrew/8552.htm'
  quote: 'as auxil. + finite verb = completely, wholly, entirely, תַּמּוּ נִבְתָ֑וּ Joshua 3:16 (E) were wholly cut off'
- where: 'note 3:16 “Upon an heap, at Adam”'
  claim: "BDB: tāmam, be finished, completed; with infinitive in 3:17, were entirely passed over"
  key: "bdb"
  url: 'https://biblehub.com/hebrew/8552.htm'
  quote: 'followed by ל infinitive: תַּמּוּ לעבור were finished in regard to, etc., i.e. were entirely passed over Joshua 3:17'
- where: "christ"
  claim: "Muhlestein: Israel crossed following behind the seat of atonement, trusting the delivering power of Him whom it symbolized"
  key: "muhlestein-exodus-deliverance"
  url: 'https://www.churchofjesuschrist.org/study/ensign/2018/03/israels-exodus-and-deliverance-then-and-now?lang=eng'
  quote: 'After this demonstration of faith, following squarely behind the seat of atonement and trusting fully in the delivering power of Him whom it symbolized, Israel finally entered into its land of inheritance.'
- where: "christ"
  claim: "Student Manual: in both crossings Israel passed through the water into newness of life; Paul's baptism in the cloud and sea; each a new covenant"
  key: "ot-manual-josh"
  url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/joshua-1-24-the-entry-into-the-promised-land?lang=eng'
  quote: 'In both instances Israel passed through the water into a newness of life. This passage may have been what Paul had in mind when he spoke of Israel’s baptism “in the cloud and in the sea” (1 Corinthians 10:2; see also vv. 1, 3–4).'
- where: "christ"
  claim: "Lund: one enters a new life when born again through baptism; Joshua's name is Jesus' Hebrew name, so 'Jesus' led Israel into the promised land"
  key: "lund-types-symbols"
  url: 'https://rsc.byu.edu/literature-belief/old-testament-types-symbols'
  quote: 'one also enters a new land (or life) when he is born again through baptism (see Alma 37:45).'
- where: "christ"
  claim: "Lund: 'Jesus' led Israel into the promised land"
  key: "lund-types-symbols"
  url: 'https://rsc.byu.edu/literature-belief/old-testament-types-symbols'
  quote: 'So “Jesus” led Israel into the promised land.'
- where: "christ"
  claim: "Lund reads 'sanctify yourselves' (3:5) as the cleansing needed to enter a new life with God"
  key: "lund-types-symbols"
  url: 'https://rsc.byu.edu/literature-belief/old-testament-types-symbols'
  quote: 'Joshua called upon the people to “sanctify” themselves so they would be worthy to go into the promised land (Josh. 3:5). One must be sanctified, or cleansed from sin, in order to enter a new life with God.'
- where: "christ"
  claim: "Muhlestein: most believers are between Sinai (covenants made) and the Jordan (the celestial kingdom)"
  key: "muhlestein-exodus-deliverance"
  url: 'https://www.churchofjesuschrist.org/study/ensign/2018/03/israels-exodus-and-deliverance-then-and-now?lang=eng'
  quote: 'Most believers find themselves somewhere in between Sinai (having made sacred covenants with the Lord) and crossing the river Jordan (entering the true promised land, or the celestial kingdom).'
- where: "christ"
  claim: "Jehovah is the premortal Jesus Christ"
  key: "bd-jehovah"
  url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
  quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
