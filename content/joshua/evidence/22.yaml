chapter: 22
claims:
  - where: when
    claim: 'The eastern tribes leave Shiloh for Gilead after the division of the land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/22?lang=eng'
    quote: 'departed from the children of Israel out of Shiloh, which is in the land of Canaan, to go unto the country of Gilead'
  - where: setting
    claim: 'Chapters 22–24 are an epilogue to the conquest (1–12) and allotment (13–21): the dispute, the exhortation, the covenant renewal'
    key: ot-minute-josh-22
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-22-0'
    quote: 'It constitutes a sort of epilogue to the main narrative, which itself is composed of the conquest (chapters 1–12) and allotment (chapters 13–21) subsections. This epilogue highlights a dispute that arose between the children of Israel (22:10–34), a final exhortation by Joshua (chapter 23), and a covenant renewal ceremony'
  - where: setting
    claim: 'The LORD gave Israel rest round about'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/21?lang=eng'
    quote: 'And the LORD gave them rest round about, according to all that he sware unto their fathers'
  - where: setting
    claim: 'The tabernacle was set up at Shiloh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/18?lang=eng'
    quote: 'And the whole congregation of the children of Israel assembled together at Shiloh, and set up the tabernacle of the congregation there.'
  - where: setting
    claim: 'Phinehas, who had intervened at Peor (Num. 25), leads the embassy'
    key: ot-minute-josh-22
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-22-0'
    quote: 'Phinehas had already intervened in a previous episode involving apostate Israelites (see Numbers 25)'
  - where: setting
    claim: 'The eastern tribes later transgressed and were carried away by the kings of Assyria'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/5?lang=eng'
    quote: 'And they transgressed against the God of their fathers, and went a whoring after the gods of the people of the land … and he carried them away, even the Reubenites, and the Gadites, and the half tribe of Manasseh'
  - where: thread
    claim: 'The western tribes gather at Shiloh to go to war'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/22?lang=eng'
    quote: 'the whole congregation of the children of Israel gathered themselves together at Shiloh, to go up to war against them.'
  - where: thread
    claim: 'The eastern tribes built the altar for fear their children would be told they had no part in the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/22?lang=eng'
    quote: 'And if we have not rather done it for fear of this thing, saying, In time to come your children might speak unto our children'
  - where: thread
    claim: 'The altar is a witness, not for burnt offering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/22?lang=eng'
    quote: 'But that it may be a witness between us, and you, and our generations after us'
  - where: thread
    claim: 'The delegation heard the words and was pleased'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/22?lang=eng'
    quote: 'heard the words that the children of Reuben and the children of Gad and the children of Manasseh spake, it pleased them.'
  - where: thread
    claim: 'The three tribes insisted the altar was for memorial purposes'
    key: ot-minute-josh-22
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-22-0'
    quote: 'insisted that the altar was for memorial purposes and was not a place of actual sacrifice (verses 26–27).'
  - where: 'note 22:3 “A promise kept to the letter”'
    claim: 'Moses gave the land on the condition that they go armed until the land was subdued'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/32?lang=eng'
    quote: 'And Moses said unto them, If ye will do this thing, if ye will go armed before the LORD to war'
  - where: 'note 22:3 “A promise kept to the letter”'
    claim: 'Then they shall return guiltless'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/32?lang=eng'
    quote: 'then afterward ye shall return, and be guiltless before the LORD, and before Israel'
  - where: 'note 22:3 “A promise kept to the letter”'
    claim: 'Joshua had repeated the terms: until the LORD gives your brethren rest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/1?lang=eng'
    quote: 'Until the LORD have given your brethren rest, as he hath given you'
  - where: 'note 22:3 “A promise kept to the letter”'
    claim: 'Joshua now says the LORD has given rest, and charges them to divide the spoil; on the terms of Num. 32 they return guiltless'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/22?lang=eng'
    quote: 'And now the LORD your God hath given rest unto your brethren, as he promised them … divide the spoil of your enemies with your brethren.'
  - where: 'note 22:10 “Why an altar alarmed Israel”'
    claim: 'Deuteronomy 12 forbids burnt offerings in every place'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/12?lang=eng'
    quote: 'Take heed to thyself that thou offer not thy burnt offerings in every place that thou seest: But in the place which the LORD shall choose'
  - where: 'note 22:10 “Why an altar alarmed Israel”'
    claim: 'Leviticus 17: whoever does not bring an offering to the tabernacle door is cut off'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/17?lang=eng'
    quote: 'And bringeth it not unto the door of the tabernacle of the congregation, to offer it unto the LORD; even that man shall be cut off from among his people.'
  - where: 'note 22:10 “Why an altar alarmed Israel”'
    claim: 'The debate hinged on whether the law allowed multiple sacred sites; supervision was a concern'
    key: ot-minute-josh-22
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-22-0'
    quote: 'The debate hinged on whether the law of Moses allowed for multiple sacred sites besides the one authorized central site … it is more difficult to ensure a proper mode of worship with multiple sites.'
  - where: 'note 22:10 “Why an altar alarmed Israel”'
    claim: 'The western tribes read it as rebellion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/22?lang=eng'
    quote: 'in that ye have builded you an altar, that ye might rebel this day against the LORD?'
  - where: 'note 22:17 “Peor, Achan, and Phinehas”'
    claim: 'Israel joined Baal-peor'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/25?lang=eng'
    quote: 'And Israel joined himself unto Baal-peor: and the anger of the LORD was kindled against Israel.'
  - where: 'note 22:17 “Peor, Achan, and Phinehas”'
    claim: 'Twenty-four thousand died in the plague'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/25?lang=eng'
    quote: 'And those that died in the plague were twenty and four thousand.'
  - where: 'note 22:17 “Peor, Achan, and Phinehas”'
    claim: 'Achan: wrath fell on all the congregation; tomorrow he will be wroth with the whole congregation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/22?lang=eng'
    quote: 'Did not Achan the son of Zerah commit a trespass in the accursed thing, and wrath fell on all the congregation of Israel?'
  - where: 'note 22:17 “Peor, Achan, and Phinehas”'
    claim: 'Verse 18: tomorrow he will be wroth with the whole congregation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/22?lang=eng'
    quote: 'that to morrow he will be wroth with the whole congregation of Israel.'
  - where: 'note 22:17 “Peor, Achan, and Phinehas”'
    claim: 'Why not Eleazar is unclear, probably his age; Phinehas had intervened before, so not surprising'
    key: ot-minute-josh-22
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-22-0'
    quote: 'Why they did not turn to Eleazar himself, who was still alive, is unclear, but it probably had something to do with his advanced age. … so his return here to resolve this new dispute wasn’t surprising.'
  - where: 'note 22:17 “Peor, Achan, and Phinehas”'
    claim: 'Phinehas had already intervened in a previous episode involving apostate Israelites'
    key: ot-minute-josh-22
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-22-0'
    quote: 'Phinehas had already intervened in a previous episode involving apostate Israelites (see Numbers 25)'
  - where: 'note 22:17 “Peor, Achan, and Phinehas”'
    claim: 'The harsh language of 16–20 reveals lingering intertribal jealousies'
    key: ot-minute-josh-22
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-22-0'
    quote: 'The harsh language of the tribes on the west side of the Jordan River at Joshua 22:16–20 reveals that intertribal jealousies, suspicions, and prejudices lingered even after the settlement in Canaan.'
  - where: 'note 22:19 “An offer to share the land”'
    claim: 'Unclean means without an altar and among heathen; antithesis of the two possessions'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/22.htm'
    quote: '19. if the land of your possession be unclean] i. e. without an altar to the Lord, and in the midst of many heathen dwelling amongst them. the land of the possession of the Lord] the land of your possession. Observe the antithesis.'
  - where: 'note 22:19 “An offer to share the land”'
    claim: 'If they thought an altar necessary to expiate uncleanness, they should settle among the western tribes'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/22.htm'
    quote: 'so that you think it necessary to have an altar in the neighbourhood to expiate your sins and wipe away your uncleanness, "pass over into the land of Jehovah''s possession, where His dwelling-place stands, and settle in the midst of us'
  - where: 'note 22:19 “An offer to share the land”'
    claim: 'The verse offers land among them and sets the two possessions side by side'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/22?lang=eng'
    quote: 'then pass ye over unto the land of the possession of the LORD, wherein the LORD’s tabernacle dwelleth, and take possession among us'
  - where: 'note 22:22 “An oath in three names”'
    claim: 'The Hebrew is El, Elohim, YHWH, twice'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'אֵל֩'
  - where: 'note 22:22 “An oath in three names”'
    claim: 'Elohim follows El in the verse'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'אֱלֹהִ֨ים'
  - where: 'note 22:22 “An oath in three names”'
    claim: 'The three names strengthen the invocation, further strengthened by repetition; im is the oath particle'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/22.htm'
    quote: 'serves to strengthen the invocation of God, as in Psalm 50:1; and this is strengthened still further by the repetition of these three names. … The אם which follows is the usual particle used in an oath.'
  - where: 'note 22:22 “An oath in three names”'
    claim: 'The oath form: save us not this day; let the LORD himself require it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/22?lang=eng'
    quote: 'if it be in rebellion, or if in transgression against the LORD, (save us not this day,)'
  - where: 'note 22:22 “An oath in three names”'
    claim: 'Verse 23: let the LORD himself require it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/22?lang=eng'
    quote: 'let the LORD himself require it'
  - where: 'note 22:28 “A copy of the LORD''s altar”'
    claim: 'tabnit: construction, structure; Josh 22:28 tabnit of the altar'
    key: bdb
    url: 'https://biblehub.com/hebrew/8403.htm'
    quote: '1 apparently originally construction, structure, yet only P & late: ׳תַּבְנִית מִזְבַּה י Joshua 22:28'
  - where: 'note 22:28 “A copy of the LORD''s altar”'
    claim: 'tabnit derives from banah, build'
    key: bdb
    url: 'https://biblehub.com/hebrew/8403.htm'
    quote: 'Word Origin: [from H1129 (בָּנָה - built)]'
  - where: 'note 22:28 “A copy of the LORD''s altar”'
    claim: 'The copy shows they worship before the tabernacle; not for sacrifice'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/22?lang=eng'
    quote: 'Behold the pattern of the altar of the LORD, which our fathers made, not for burnt offerings, nor for sacrifices; but it is a witness between us and you.'
  - where: 'note 22:31 “A hearing before a war”'
    claim: 'Phinehas: ye have delivered the children of Israel out of the hand of the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/22?lang=eng'
    quote: 'now ye have delivered the children of Israel out of the hand of the LORD.'
  - where: 'note 22:31 “A hearing before a war”'
    claim: 'Israel blessed God and did not intend battle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/22?lang=eng'
    quote: 'and the children of Israel blessed God, and did not intend to go up against them in battle'
  - where: 'note 22:31 “A hearing before a war”'
    claim: 'Phinehas determined that the altar was legitimate'
    key: ot-minute-josh-22
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-22-0'
    quote: 'After hearing out the issue, Phinehas determined that the altar was legitimate.'
  - where: 'note 22:31 “A hearing before a war”'
    claim: 'The chapter shows the balance between true worship and apostate idolatry; without knowing why, one would judge it an adulteration'
    key: ot-manual-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/joshua-1-24-the-entry-into-the-promised-land?lang=eng'
    quote: 'This chapter demonstrates the critical balance between true worship and apostate idolatry. Without a knowledge of why the 2½ tribes had built the altar on the other side of Jordan, one would judge the action to be an adulteration of the holy worship in the tabernacle.'
  - where: 'note 22:34 “Ed, “witness””'
    claim: 'Ed is the Hebrew word for witness or testimony, as the declaration makes clear'
    key: ot-minute-josh-22
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-22-0'
    quote: 'The name bestowed upon the altar, Ed (ꜥed), is merely the Hebrew word for “witness” or “testimony,” as is made clear in the declaration at the end of the chapter'
  - where: 'note 22:34 “Ed, “witness””'
    claim: 'In the Hebrew, “the altar” is followed directly by “for a witness is it between us”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'לַ/מִּזְבֵּ֑חַ'
  - where: 'note 22:34 “Ed, “witness””'
    claim: 'The Septuagint has Joshua name the altar, a testimony in the midst of them'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/joshua/22.htm'
    quote: 'And Joshua gave a name to the altar of the children of Ruben, and the children of Gad, and the half tribe of Manasse; and said, It is a testimony in the midst of them, that the Lord is their God.'
  - where: 'note 22:34 “Ed, “witness””'
    claim: 'BDB: ed of things, the heap of stones Gen 31, the altar east of Jordan with bein, compare Isa 19:20'
    key: bdb
    url: 'https://biblehub.com/hebrew/5707.htm'
    quote: '1 witness, testimony, evidence, of things: heap of stones Genesis 31:44,48,52 (JE) … altar east of Jordan, with בֵּין, Joshua 22:27,28,34 (P), compare Isaiah 19:20'
  - where: 'note 22:34 “Ed, “witness””'
    claim: 'The heap of stones a witness between me and thee'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/31?lang=eng'
    quote: 'And Laban said, This heap is a witness between me and thee this day.'
  - where: christ
    claim: 'The altar witnesses that the LORD is God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/22?lang=eng'
    quote: 'for it shall be a witness between us that the LORD is God.'
  - where: christ
    claim: 'Joshua’s charge repeats Moses’ words in Deut. 6:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/6?lang=eng'
    quote: 'And thou shalt love the LORD thy God with all thine heart, and with all thy soul, and with all thy might.'
  - where: christ
    claim: 'Jesus called it the first and great commandment'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/22?lang=eng'
    quote: 'This is the first and great commandment.'
  - where: christ
    claim: 'Those who embark in God’s service are to serve with all heart, might, mind and strength'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/4?lang=eng'
    quote: 'Therefore, O ye that embark in the service of God, see that ye serve him with all your heart, might, mind and strength'
