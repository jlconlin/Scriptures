chapter: 4
claims:
  - where: setting
    claim: 'The crossing is told in sections: briefly in 3:14–17, more fully in 4:1–11, supplementary notices in 4:12–17, and the conclusion'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/4.htm'
    quote: 'Thus the history of the crossing is related in sections: (a) first briefly, Joshua 3:14-17; (b) then more completely, Joshua 4:1-11; (c) some supplementary notices, Joshua 4:12-17; (d) finally, the conclusion'
  - where: setting
    claim: 'The miracle confirmed Joshua as the people had feared Moses, the fulfillment of the promise of 3:7'
    key: scripture-helps-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/19-joshua-1-8-23-24?lang=eng'
    quote: 'One way the Lord fulfilled this promise was by helping the Israelites cross the Jordan River on dry ground, as they had crossed the Red Sea.'
  - where: setting
    claim: 'Micah 6:5 names the way from Shittim to Gilgal'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/6?lang=eng'
    quote: 'remember now what Balak king of Moab consulted, and what Balaam the son of Beor answered him from Shittim unto Gilgal; that ye may know the righteousness of the Lord.'
  - where: thread
    claim: 'The stone monument recalls the national triumph; Joshua reiterates its purpose in verses 21–24, and the link with the Exodus is made explicit'
    key: ot-minute-josh-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-4'
    quote: 'Joshua reiterated the purpose of the stone monument: to remind future Israelite generations of their national triumph at the Jordan (verses 21–24). The symbolic link with the Exodus tradition is also explicitly reiterated'
  - where: setting
    claim: 'The eastern tribes kept the promise they had given in 1:16–17'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/4.htm'
    quote: 'it was necessary that it should be expressly mentioned that these tribes performed the promise they had given (Joshua 1:16-17), and in what manner they did so.'
  - where: thread
    claim: 'The waters returning when the priests left the riverbed shows that it was the ark that held back the stream'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/4.htm'
    quote: 'This affirms as clearly as possible that it was the ark which kept back the stream.'
  - where: 'note 4:3 “Twelve stones from where the ark stood”'
    claim: 'The patriarchs set up pillars of stones (matzevot) at key moments; they served as memorials, monuments and ritual objects'
    key: ot-minute-josh-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-4'
    quote: 'Joshua’s actions here recall the practice of the patriarchs Jacob and Moses of setting up “pillars” of stones (Hebrew matzevot) at key narrative moments. These sacred pillars served a variety of functions, including as memorials, as monuments, and as ritual or cultic objects.'
  - where: 'note 4:3 “Twelve stones from where the ark stood”'
    claim: 'Joshua 4 does not use matsevah but ʾôt, “sign,” yet the stones serve the same purpose as a memorial for future generations'
    key: turley-smoot-record-keeping
    url: 'https://interpreterfoundation.org/journal/record-keeping-technology-among-gods-people-in-ancient-and-modern-times'
    quote: 'Although the text does not employ the familiar Hebrew noun מצבה to describe this stone memorial (instead it uses the Hebrew word אות—“sign,” “token,” or “omen”), as it does with the accounts of Jacob’s covenant ceremonies with Laban and God, the stones in this passage effectively serve the same purpose.'
  - where: 'note 4:6 “A memorial made to be asked about”'
    claim: 'The stones signified the importance of the event for future generations'
    key: turley-smoot-record-keeping
    url: 'https://interpreterfoundation.org/journal/record-keeping-technology-among-gods-people-in-ancient-and-modern-times'
    quote: 'They served as a memorial for the occasion, or otherwise to signify the importance of the event for future generations, as is made clear in the text.'
  - where: 'note 4:6 “A memorial made to be asked about”'
    claim: 'The same question is asked in Exodus at the Passover and in Deuteronomy of the law'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/12?lang=eng'
    quote: 'And it shall come to pass, when your children shall say unto you, What mean ye by this service?'
  - where: 'note 4:9 “Another twelve stones, or the same?”'
    claim: 'One older reading takes verse 9 as a second set of stones, set up by Joshua in the riverbed; the Vulgate reads “twelve other stones”'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/4.htm'
    quote: '“Alios quoque duodecim lapides,” Vulg. Another set of stones is here intended than that just mentioned.'
  - where: 'note 4:9 “Another twelve stones, or the same?”'
    claim: 'Keil also reads a second memorial in the river, not likely to have lasted centuries but meant for that generation and its children'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/4.htm'
    quote: 'It is not likely that they remained there for centuries; but they were intended rather as a memorial for the existing generation and their children'
  - where: 'note 4:9 “Another twelve stones, or the same?”'
    claim: '“Unto this day” means the time when the account was written'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/4.htm'
    quote: 'which stones were there "to this day," i.e., the time when the account was written.'
  - where: 'note 4:9 “Another twelve stones, or the same?”'
    claim: 'A modern translation reads the same twelve stones that had been in the Jordan, with “also set up” as an alternative in its footnote'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Joshua+4%3A9&version=NIV'
    quote: '9 Joshua set up the twelve stones(A) that had been in the middle of the Jordan at the spot where the priests who carried the ark of the covenant had stood. … Joshua 4:9 Or Joshua also set up twelve stones'
  - where: 'note 4:9 “Another twelve stones, or the same?”'
    claim: 'Another modern translation keeps “twelve stones” and puts the verse in parentheses'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Joshua+4%3A9&version=NRSVUE'
    quote: '9 (Joshua set up twelve stones in the middle of the Jordan, in the place where the feet of the priests bearing the ark of the covenant had stood, and they are there to this day.)'
  - where: 'note 4:19 “The day the Passover lamb was chosen”'
    claim: 'The lamb is taken on the tenth day and kept until the fourteenth; Israel keeps the Passover at Gilgal on the fourteenth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/5?lang=eng'
    quote: 'And the children of Israel encamped in Gilgal, and kept the passover on the fourteenth day of the month at even in the plains of Jericho.'
  - where: 'note 4:19 “Gilgal, the first camp in the land”'
    claim: 'Gilgal means a wheel or circle of stones; it was the first camp, where the stones were set up; sacred in Saul’s time; later a scene of idolatry'
    key: bd-gilgal
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gilgal?lang=eng'
    quote: 'A wheel or circle of stones. (1) The place near Jericho at which the Israelite camp was made on the first night after crossing the Jordan … It was a sacred city in the time of Saul … but later it was the scene of idolatrous worship'
  - where: 'note 4:19 “Gilgal, the first camp in the land”'
    claim: 'The circumcision at Gilgal in chapter 5 gives the site and its monument a ritual or covenant component'
    key: ot-minute-josh-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-4'
    quote: 'The next chapter indicates that the male Israelites born in the wilderness were also circumcised at Gilgal, thus introducing a ritual or covenant component to the site and its monument (5:1–9).'
  - where: 'note 4:19 “The day the Passover lamb was chosen”'
    claim: 'Israel crossed the Jordan on the first day of the Passover (compare Ex. 12:3)'
    key: ot-manual-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/joshua-1-24-the-entry-into-the-promised-land?lang=eng'
    quote: 'Israel passed over the River Jordan on the first day of the Passover'
  - where: 'note 4:19 “The day the Passover lamb was chosen”'
    claim: 'Abib, a green head of grain, the harvest month, known after the Captivity as Nisan'
    key: bd-abib
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abib?lang=eng'
    quote: 'A green head of grain. The name of the harvest month (Ex. 13:4; 23:15; 34:18; Deut. 16:1). After the Captivity it was known as Nisan (Neh. 2:1).'
  - where: christ
    claim: 'The LORD of the Old Testament is Jehovah, the premortal Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/3?lang=eng'
    quote: 'And God said unto Moses, I AM THAT I AM'
  - where: christ
    claim: 'Israel crossed following behind the seat of atonement and trusting the delivering power of Him whom it symbolized'
    key: muhlestein-exodus-deliverance
    url: 'https://www.churchofjesuschrist.org/study/ensign/2018/03/israels-exodus-and-deliverance-then-and-now?lang=eng'
    quote: 'After this demonstration of faith, following squarely behind the seat of atonement and trusting fully in the delivering power of Him whom it symbolized, Israel finally entered into its land of inheritance.'
  - where: christ
    claim: 'The Jordan can be likened to the veil at death, the promised land to the celestial kingdom'
    key: muhlestein-exodus-deliverance
    url: 'https://www.churchofjesuschrist.org/study/ensign/2018/03/israels-exodus-and-deliverance-then-and-now?lang=eng'
    quote: 'Eventually they were brought to the river Jordan (which can be likened to the veil we pass through at death) and crossed it, entering into the promised land (which can symbolize the celestial kingdom).'
  - where: christ
    claim: 'Most believers are between Sinai and the Jordan'
    key: muhlestein-exodus-deliverance
    url: 'https://www.churchofjesuschrist.org/study/ensign/2018/03/israels-exodus-and-deliverance-then-and-now?lang=eng'
    quote: 'Most believers find themselves somewhere in between Sinai (having made sacred covenants with the Lord) and crossing the river Jordan (entering the true promised land, or the celestial kingdom).'
  - where: explore
    claim: 'At Shechem Joshua set up a stone as a witness of the covenant'
    key: turley-smoot-record-keeping
    url: 'https://interpreterfoundation.org/journal/record-keeping-technology-among-gods-people-in-ancient-and-modern-times'
    quote: 'Joshua wrote both the words of the covenant and the people’s response on a ספר or scroll, as well as commissioned a stone memorial to act as a witness of the event.'
