chapter: 15
claims:
  - where: when
    claim: 'The land is divided by lot after the wars, under Joshua'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/14?lang=eng'
    quote: 'By lot was their inheritance, as the Lord commanded by the hand of Moses, for the nine tribes, and for the half tribe.'
  - where: setting
    claim: 'Chapter 14 opens the division by lot and gives Caleb Hebron'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/14?lang=eng'
    quote: 'The land is divided by lot among 9½ tribes—Caleb inherits Hebron as a special reward for his faithfulness.'
  - where: setting
    claim: 'The chapter continues Judah''s allotment from chapter 14: boundaries (1–12, 20–62) and Caleb''s narrative (13–19)'
    key: ot-minute-josh-15
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-15'
    quote: 'the fifteenth chapter of the book of Joshua provides further descriptions of Judah’s inheritance (verses 1–12, 20–62) and a brief narrative detailing how Caleb and the Judahites secured their territorial claim from lingering threats (verses 13–19).'
  - where: setting
    claim: 'The southern border given to Moses runs from the wilderness of Zin by Edom to the Salt Sea'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/34?lang=eng'
    quote: 'Then your south quarter shall be from the wilderness of Zin along by the coast of Edom, and your south border shall be the outmost coast of the salt sea eastward:'
  - where: setting
    claim: 'The boundaries may be more ideal than historical; the description runs counterclockwise from the south'
    key: ot-minute-josh-15
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-15'
    quote: 'The territorial boundaries described in verses 1–12 appear to be more idealistic than concretely historical, reflecting what the author of Joshua probably thought deservedly belonged to Judah. It begins in the south (verses 2–4) and works its way counterclockwise'
  - where: thread
    claim: 'The LORD charged Joshua to divide the land for an inheritance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/1?lang=eng'
    quote: 'Be strong and of a good courage: for unto this people shalt thou divide for an inheritance the land, which I sware unto their fathers to give them.'
  - where: thread
    claim: 'Caleb asked for Hebron trusting that the LORD would be with him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/14?lang=eng'
    quote: 'if so be the Lord will be with me, then I shall be able to drive them out, as the Lord said.'
  - where: section 2 plain
    claim: '"Blessing" here is a gift; "south land" is dry land'
    key: bdb
    url: 'https://biblehub.com/hebrew/1293.htm'
    quote: '5 a gift, present Genesis 33:11 (E) Joshua 15:19 (J) Judges 1:15'
  - where: section 2 plain
    claim: '"South land" is the dry or arid land'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/15.htm'
    quote: 'negeb is not to be taken as a proper name, signifying the southernmost district of Canaan (as in Joshua 15:21, etc.), but as an appellative, "the dry or arid land," as in Psalm 126:4.'
  - where: note 15:8 “Jerusalem on the line”
    claim: 'The valley of Hinnom lies south and west of Jerusalem; later the site of Moloch worship, a refuse place, and called Gehenna'
    key: bd-hinnom-valley-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hinnom-valley-of?lang=eng'
    quote: 'South and west of Jerusalem, it was the scene of the idolatrous worship of the fire-god Moloch (2 Chr. 28:3; 33:6; Jer. 7:31; 32:35; see also 2 Kgs. 16:3; 21:6), and was afterwards used as a place of refuse (2 Kgs. 23:10–14). In New Testament times it was called Gehenna'
  - where: note 15:8 “Jerusalem on the line”
    claim: 'Benjamin''s border follows the same valley, and Jerusalem is listed among Benjamin''s cities'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/18?lang=eng'
    quote: 'and descended to the valley of Hinnom, to the side of Jebusi on the south, and descended to En-rogel, … And Zelah, Eleph, and Jebusi, which is Jerusalem, Gibeath, and Kirjath'
  - where: note 15:14 “The giants the ten spies feared”
    claim: 'The spies found the same three sons of Anak at Hebron'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/13?lang=eng'
    quote: 'And they ascended by the south, and came unto Hebron; where Ahiman, Sheshai, and Talmai, the children of Anak, were.'
  - where: note 15:14 “The giants the ten spies feared”
    claim: 'Joshua had already cut off the Anakims from Hebron and Debir'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/11?lang=eng'
    quote: 'And at that time came Joshua, and cut off the Anakims from the mountains, from Hebron, from Debir, from Anab, and from all the mountains of Judah'
  - where: note 15:14 “The giants the ten spies feared”
    claim: 'Though Judah''s claim was settled, Caleb and other Judahites still had to deal with lingering threats'
    key: ot-minute-josh-15
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-15'
    quote: 'Although Caleb was afforded Judah’s territorial claim in the previous chapter, in verses 13–19 he and other Judahite heroes nevertheless had to deal with lingering Canaanite threats.'
  - where: note 15:14 “The giants the ten spies feared”
    claim: 'Judges 1 tells of Judah slaying the three and Caleb expelling them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/1?lang=eng'
    quote: 'And Judah went against the Canaanites that dwelt in Hebron: (now the name of Hebron before was Kirjath-arba:) and they slew Sheshai, and Ahiman, and Talmai.'
  - where: note 15:14 “The giants the ten spies feared”
    claim: 'Caleb obtained Hebron; it was still his family''s in David''s time'
    key: bd-caleb
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/caleb?lang=eng'
    quote: 'After the entrance into Canaan, Caleb obtained Hebron (Josh. 14:6–14; 15:13–19; 21:12; Judg. 1:12–15, 20; 3:9); this district was still in the possession of his family in the time of David (1 Sam. 25:3; 30:14).'
  - where: note 15:17 “A daughter promised, and the first judge”
    claim: 'Debir must have been strong; Caleb offered a prize as Saul later did for Goliath'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/15.htm'
    quote: 'must have been very strong and hard to conquer; for Caleb offered a prize to the conqueror, promising to give his daughter Achzah for a wife to any one that should take it, just as Saul afterwards promised to give his daughter to the conqueror of Goliath'
  - where: note 15:17 “A daughter promised, and the first judge”
    claim: 'The Hebrew can be read two ways; Judges makes Othniel Caleb''s younger brother'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/15.htm'
    quote: 'either "the son of Kenaz (and) brother of Caleb," or "the son of Kenaz the brother of Caleb." … for this the Masorites have decided … According to Judges 1:13 and Judges 3:9, Othniel was Caleb''s younger brother.'
  - where: note 15:17 “A daughter promised, and the first judge”
    claim: 'Judges calls Othniel Caleb''s younger brother and the deliverer the LORD raised up'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/3?lang=eng'
    quote: 'the Lord raised up a deliverer to the children of Israel, who delivered them, even Othniel the son of Kenaz, Caleb’s younger brother.'
  - where: note 15:17 “A daughter promised, and the first judge”
    claim: 'Othniel later served as the first of Israel''s judges'
    key: ot-minute-josh-15
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-15'
    quote: 'Caleb’s brother Othniel (verse 17) later served as the first of Israel’s judges (see Judges 3:7–11).'
  - where: note 15:19 “Give me a blessing”
    claim: 'Blessing (berakah) can mean a gift or present, as in Gen. 33:11, Josh. 15:19 and Judg. 1:15'
    key: bdb
    url: 'https://biblehub.com/hebrew/1293.htm'
    quote: '5 a gift, present Genesis 33:11 (E) Joshua 15:19 (J) Judges 1:15; 1 Samuel 25:27; 1 Samuel 30:26; 2 Kings 5:15'
  - where: note 15:19 “Give me a blessing”
    claim: 'The Hebrew of verse 19 has berakah and ha-negeb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'בְרָכָ֗ה'
  - where: note 15:19 “Give me a blessing”
    claim: 'Negeb here is the dry land, not the district name; alighting was a sign of reverence; she asked for land with springs'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/15.htm'
    quote: 'Alighting from an animal was a special sign of reverence, from which Caleb inferred that his daughter had some particular request to make of him … "Give me springs of water," i.e., a piece of land with springs of water in it.'
  - where: note 15:19 “Give me a blessing”
    claim: 'The upper and nether springs may be an old place name'
    key: bdb
    url: 'https://biblehub.com/hebrew/1543.htm'
    quote: '1 basin (pool, well ?) מַיִם ׳ג Joshua 15:19 = Judges 1:15; omit ׳מ Joshua 15:19 (twice in verse) = Judges 1:15 (twice in verse) (probably old proper name, of a location, compare Di).'
  - where: note 15:19 “Give me a blessing”
    claim: 'Judges 1 repeats the request'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/1?lang=eng'
    quote: 'And she said unto him, Give me a blessing: for thou hast given me a south land; give me also springs of water. And Caleb gave her the upper springs and the nether springs.'
  - where: note 15:63 “The city Judah could not take”
    claim: 'Judges 1 says Judah took and burned Jerusalem, and that Benjamin did not drive out the Jebusites'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/1?lang=eng'
    quote: 'Now the children of Judah had fought against Jerusalem, and had taken it, and smitten it with the edge of the sword, and set the city on fire. … And the children of Benjamin did not drive out the Jebusites that inhabited Jerusalem'
  - where: note 15:63 “The city Judah could not take”
    claim: 'Jebus was a hill fortress that kept its independence until David stormed it'
    key: bd-jebus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jebus?lang=eng'
    quote: 'Ancient name of Jerusalem (Judg. 19:10; 1 Chr. 11:4–5); it was a hill fortress, which maintained its independence until stormed by David (2 Sam. 5:6–9).'
  - where: note 15:63 “The city Judah could not take”
    claim: 'David went up against the Jebusites at Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/5?lang=eng'
    quote: 'And the king and his men went to Jerusalem unto the Jebusites, the inhabitants of the land'
  - where: note 15:63 “The city Judah could not take”
    claim: '"Unto this day" shows time passed; at face value the book was written before David took Jerusalem, or it may be a formulaic postscript'
    key: ot-minute-josh-15
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-15'
    quote: 'If taken at face value, it may mean that the book (or an early version of it) was composed sometime after the events described in it but before David’s capture of Jerusalem … It could also be merely the same kind of formulaic postscript that occurs elsewhere'
  - where: christ
    claim: 'The LORD promised Caleb the land and that his seed would possess it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/14?lang=eng'
    quote: 'But my servant Caleb, because he had another spirit with him, and hath followed me fully, him will I bring into the land whereinto he went; and his seed shall possess it.'
  - where: note 15:19 “Give me a blessing”
    claim: 'One older reading takes negeb here as the dry or arid land'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/15.htm'
    quote: 'negeb is not to be taken as a proper name, signifying the southernmost district of Canaan (as in Joshua 15:21, etc.), but as an appellative, "the dry or arid land," as in Psalm 126:4.'
