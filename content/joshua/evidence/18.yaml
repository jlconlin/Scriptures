chapter: 18
claims:
  - where: when
    claim: 'The congregation gathers at Shiloh once the land is subdued'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/18?lang=eng'
    quote: 'And the land was subdued before them.'
  - where: setting
    claim: 'Judah and Joseph were allotted in 15–17; chapters 18–19 give the seven remaining lots, Benjamin first'
    key: ot-minute-josh-18
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-18'
    quote: 'The allotments of Judah and Joseph were described previously in chapters 15–17. Seven such remaining allotments are described in chapters 18–19: those belonging to Benjamin (18:11–28), Simeon (19:1–9), Zebulun (19:10–16), Issachar (19:17–23), Asher (19:24–31), Naphtali (19:32–39), and finally Dan (19:40–48).'
  - where: setting
    claim: 'The camp had been at Gilgal; by chapter 18 Shiloh is the place of assembly'
    key: ot-minute-josh-18
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-18'
    quote: 'Previously the children of Israel had stationed their camp at Gilgal (Joshua 14:6), but by chapter 18 Shiloh was the place of assembly (18:1–10).'
  - where: setting
    claim: 'The division is finished at Shiloh at the door of the tabernacle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/19?lang=eng'
    quote: 'at the door of the tabernacle of the congregation. So they made an end of dividing the country.'
  - where: section 1 plain
    claim: 'The Hebrew for "tabernacle" is tent'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/18?lang=eng'
    quote: 'HEB tent'
  - where: section 2 plain
    claim: '"Describe" renders the Hebrew "write"'
    key: ot-minute-josh-18
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-18'
    quote: 'the King James Version renders the Hebrew ktv, “write,” as “describe”'
  - where: section 3 plain
    claim: '"Coast" is border; "nether" is lower; the salt sea is the Dead Sea'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/18?lang=eng'
    quote: 'IE the Dead Sea'
  - where: 'note 18:1 “The tabernacle comes to Shiloh”'
    claim: 'This is the first mention of Shiloh as a place in Israel''s history'
    key: ot-minute-josh-18
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-18'
    quote: 'This is the first reference to Shiloh in the context of the historical setting of ancient Israel.'
  - where: 'note 18:1 “The tabernacle comes to Shiloh”'
    claim: 'The camp moved from Gilgal to Shiloh'
    key: ot-minute-josh-18
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-18'
    quote: 'Previously the children of Israel had stationed their camp at Gilgal (Joshua 14:6), but by chapter 18 Shiloh was the place of assembly (18:1–10).'
  - where: 'note 18:1 “The tabernacle comes to Shiloh”'
    claim: 'Shiloh lay in Ephraim north of Bethel; the tabernacle stayed there through most of the judges until the ark was lost'
    key: bd-shiloh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shiloh?lang=eng'
    quote: 'A sacred city of the Holy Land, 9¼ miles north from Bethel and 11½ miles south from Shechem, in the tribe of Ephraim (Josh. 18:1; Judg. 18:31). The tabernacle was here during the greater part of the period of the Judges'
  - where: 'note 18:1 “The tabernacle comes to Shiloh”'
    claim: 'Shiloh remained the religious center until the ark was lost'
    key: bd-shiloh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shiloh?lang=eng'
    quote: 'the place continued to be the religious center of the nation (1 Sam. 1:3) until after the loss of the Ark in the disastrous battle of Ebenezer'
  - where: 'note 18:1 “The tabernacle comes to Shiloh”'
    claim: 'Shiloh was in Ephraim, Joshua''s own tribe'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/18.htm'
    quote: 'the people removed to Shiloh, which was situated within the territory of Ephraim, Joshua’s own tribe'
  - where: 'note 18:1 “The tabernacle comes to Shiloh”'
    claim: 'One older reading: Shiloh suited the tabernacle and the allotment by its central situation'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/18.htm'
    quote: 'Shiloh was appropriate, we have already seen, from its central situation, for the site of the Tabernacle and this apportionment of the tribes.'
  - where: 'note 18:1 “The tabernacle comes to Shiloh”'
    claim: 'One older reading: Joshua did not choose Shiloh by his own judgment but on the LORD''s choice of the place'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/18.htm'
    quote: 'Joshua did not follow his own judgment in selecting Shiloh for this purpose, but acted in simple accordance with the instructions of God, as the Lord had expressly reserved to himself the choice of the place where His name should dwell (Deuteronomy 12:11).'
  - where: 'note 18:3 “Subdued, but not possessed”'
    claim: 'The Hebrew verb for "subdued" in verse 1 is kabash (Strong''s 3533)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'נִכְבְּשָׁ֖ה'
  - where: 'note 18:3 “Subdued, but not possessed”'
    claim: 'The word for "subdued" means to tread under foot, the word of Gen. 1:28'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/18.htm'
    quote: 'The word rendered “subdued” denotes to “tread under the feet.” Comp. Genesis 1:28, “Be fruitful and multiply, and replenish the earth, and subdue it;”'
  - where: 'note 18:3 “Subdued, but not possessed”'
    claim: 'The seven tribes were slack not only to conquer but to have the land divided and take possession'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/18.htm'
    quote: 'i.e., not merely to conquer it, but to have it divided by lot, and to enter in and take possession'
  - where: 'note 18:3 “Subdued, but not possessed”'
    claim: 'The seven tribes were backward in conquering and in sharing out the land'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/18.htm'
    quote: 'These seven tribes appear to have been backward and indolent not only in conquering the land still unsubdued, but even in sharing it out amongst them.'
  - where: 'note 18:3 “Subdued, but not possessed”'
    claim: 'The Hebrew of "slack" is a reflexive form, "showing oneself slack"'
    key: bdb
    url: 'https://biblehub.com/hebrew/7503.htm'
    quote: 'Participle מִתְרַמֶּה Proverbs 18:9 one shewing himself slack, plural מִתְרַמִּים Joshua 18:3.'
  - where: 'note 18:6 “The land written in a book”'
    claim: 'The KJV "describe" renders the Hebrew ktv, "write"; Israel was instructed to preserve the description in writing'
    key: ot-minute-josh-18
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-18'
    quote: 'The children of Israel were divinely instructed to preserve in writing a description of the allotted territories (see 18:6; the King James Version renders the Hebrew ktv, “write,” as “describe”).'
  - where: 'note 18:6 “The land written in a book”'
    claim: 'The written description reinforced record keeping and may hint at a source for the book''s territorial descriptions'
    key: ot-minute-josh-18
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-18'
    quote: 'This not only reinforced the importance of record keeping among God’s covenant people[1] but also perhaps gives a hint about one of the sources of information used by the composer or compiler of the book of Joshua for his description of the territories.'
  - where: 'note 18:6 “The land written in a book”'
    claim: 'The verb in verse 6 is katab (Strong''s 3789)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'תִּכְתְּב֤וּ'
  - where: 'note 18:6 “The land written in a book”'
    claim: 'One older reading: not a formal measurement but lists of the towns with their size and character'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/18.htm'
    quote: 'the description required by Joshua in all probability consisted simply in the preparation of lists of the towns in the different parts of the land, with an account of their size and character'
  - where: 'note 18:6 “The land written in a book”'
    claim: 'Twenty-one men, three from each tribe, report to Joshua at Shiloh'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/18.htm'
    quote: 'Joshua therefore directs the tribes to appoint a commission of twenty-one members, three from each tribe, who should undertake the duty and report to him at Shiloh.'
  - where: 'note 18:10 “Lots cast before the LORD”'
    claim: 'The allotment at Shiloh is ritual, done before the assembly'
    key: ot-minute-josh-18
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-18'
    quote: 'Once again, the ritual nature of the allotment is clear, with Joshua casting lots in the presence of the assemblage (Joshua 18:8–10).'
  - where: 'note 18:10 “Lots cast before the LORD”'
    claim: 'The division is completed by lot at Shiloh at the door of the tabernacle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/19?lang=eng'
    quote: 'at the door of the tabernacle of the congregation. So they made an end of dividing the country.'
  - where: 'note 18:11 “Benjamin between Judah and Joseph”'
    claim: 'Benjamin provided the first king, Saul'
    key: bd-benjamin
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/benjamin?lang=eng'
    quote: 'The tribe provided the first king in the person of Saul (1 Sam. 9:1–2).'
  - where: 'note 18:11 “Benjamin between Judah and Joseph”'
    claim: 'Benjamin first joined the north at the division, but its nearness to Jerusalem drew it into Judah'
    key: bd-benjamin
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/benjamin?lang=eng'
    quote: 'At the division of the kingdom Benjamin joined the northern tribes (1 Kgs. 12:21), but the nearness to Jerusalem seems to have caused Benjamin gradually to become part of the kingdom of Judah.'
  - where: 'note 18:16 “Jerusalem on the border”'
    claim: 'Jerusalem lay on the frontier line between Judah and Benjamin and was a Jebusite city until David captured it'
    key: bd-jerusalem
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jerusalem?lang=eng'
    quote: 'a Jebusite city until it was captured by David (2 Sam. 5:6–9); for its earlier history see Josh. 10:1–5, 23; 12:10; 15:8; 18:16, 28; Judg. 1:7–8; 19:10; 1 Sam. 17:54. It lay on the frontier line between Judah and Benjamin'
  - where: 'note 18:16 “Jerusalem on the border”'
    claim: 'Judah''s northern border runs by the valley of Hinnom to the south side of the Jebusite city'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/15?lang=eng'
    quote: 'And the border went up by the valley of the son of Hinnom unto the south side of the Jebusite; the same is Jerusalem'
  - where: 'note 18:16 “Jerusalem on the border”'
    claim: 'Judah could not drive out the Jebusites of Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/15?lang=eng'
    quote: 'As for the Jebusites the inhabitants of Jerusalem, the children of Judah could not drive them out'
  - where: 'note 18:16 “Jerusalem on the border”'
    claim: 'Benjamin did not drive out the Jebusites of Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/1?lang=eng'
    quote: 'And the children of Benjamin did not drive out the Jebusites that inhabited Jerusalem; but the Jebusites dwell with the children of Benjamin in Jerusalem unto this day.'
  - where: christ
    claim: 'A gift bestowed and not received profits nothing'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: 'For what doth it profit a man if a gift is bestowed upon him, and he receive not the gift?'
  - where: explore
    claim: 'Shiloh was the religious center in Eli''s and Samuel''s day until the ark was lost'
    key: bd-shiloh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shiloh?lang=eng'
    quote: 'the place continued to be the religious center of the nation (1 Sam. 1:3) until after the loss of the Ark in the disastrous battle of Ebenezer'
  - where: 'note 18:11 “Benjamin between Judah and Joseph”'
    claim: 'Judah abides on the south and Joseph on the north; Benjamin''s towns include Jericho, Bethel and Gibeon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/18?lang=eng'
    quote: 'Judah shall abide in their coast on the south, and the house of Joseph shall abide in their coasts on the north.'
  - where: 'note 18:10 “Lots cast before the LORD”'
    claim: 'Joshua cast lots before the LORD in Shiloh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/18?lang=eng'
    quote: 'And Joshua cast lots for them in Shiloh before the'
  - where: 'note 18:16 “Jerusalem on the border”'
    claim: 'Judah fought against Jerusalem, took it and set it on fire'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/1?lang=eng'
    quote: 'Now the children of Judah had fought against Jerusalem, and had taken it, and smitten it with the edge of the sword, and set the city on fire.'
