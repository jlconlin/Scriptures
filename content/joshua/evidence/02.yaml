chapter: 2
claims:
  - where: 'setting'
    claim: 'Jericho was a walled city in the Jordan valley near the crossing'
    key: bd-jericho
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jericho?lang=eng'
    quote: 'A walled city in the valley of the Jordan, 800 feet below the Mediterranean, near the place where the Israelites crossed the river on their first entry into the promised land'
  - where: 'setting'
    claim: 'Jericho was a main obstacle to the conquest and stays central through chapter 6'
    key: ot-minute-josh-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-2'
    quote: 'one of the main obstacles to the Israelite conquest and settlement of Canaan. Its geographical importance is seen in the city’s central role not only in this chapter but also in subsequent parts of the conquest narrative (for example, Joshua 5:13–6:27).'
  - where: 'setting'
    claim: 'Sending spies recalls Moses'' spies in Numbers 13 and ties Joshua to Moses'
    key: ot-minute-josh-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-2'
    quote: 'this activity recalls Moses’s dispatch of spies into the land of Canaan previously in Numbers 13, thereby reinforcing Joshua’s association with Moses as a literary figure.'
  - where: 'thread'
    claim: 'The story turns on the least likely person playing a saving role'
    key: ot-minute-josh-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-2'
    quote: 'the story is infused with the powerful theme of the least likely person—a woman, a prostitute on the margins of society—playing a salvific role for herself and her family (compare Hebrews 11:31).'
  - where: 'thread'
    claim: 'The spies report what Rahab told them'
    key: ot-minute-josh-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-2'
    quote: 'The spies used Rahab as in informant in their subsequent report to Joshua (2:22–24)'
  - where: 'thread'
    claim: 'Rahab''s request for kindness (hesed) is covenant language'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Her request for mercy employs covenant language: “Now therefore, I pray you, swear unto me by the Lord, since I have shewed you kindness (ḥesed), that ye will also shew kindness (ḥesed) unto my father’s house'
  - where: 'section 2 plain'
    claim: 'Verses 8–13 give Rahab''s reason for helping'
    key: ot-minute-josh-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-2'
    quote: 'Rahab’s motivation for assisting the Israelites is given at Joshua 2:8–13.'
  - where: 'section 2 plain'
    claim: '“Faint” is in Hebrew “melt away,” with fear'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/2?lang=eng'
    quote: '9b “faint”: HEB melt away; i.e., with fear. Ex. 15:15.'

  - where: 'note 2:1 “A harlot named Rahab”'
    claim: 'The Hebrew word is zonah'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'זוֹנָ֛ה'
  - where: 'note 2:1 “A harlot named Rahab”'
    claim: 'The plain reading is that she was a prostitute; the Targum gave her a respectable trade'
    key: ot-minute-josh-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-2'
    quote: 'This is also how her occupation was interpreted in the Aramaic Targum of this verse, which calls Rahab an “innkeeper woman.” The ordinary and straightforward reading of the Hebrew text is that she was a prostitute.'
  - where: 'note 2:1 “A harlot named Rahab”'
    claim: 'The innkeeper reading seems to begin with Josephus'
    key: fisher-rahab
    url: 'https://rsc.byu.edu/vol-25-no-1-2024/rahab-perpetuation-deliverance'
    quote: 'This tradition seems to originate around the beginning of the Common Era when Josephus, a Jewish historian, identified Rahab as an innkeeper'
  - where: 'note 2:1 “A harlot named Rahab”'
    claim: 'Everywhere else in the Bible zonah means fornication'
    key: fisher-rahab
    url: 'https://rsc.byu.edu/vol-25-no-1-2024/rahab-perpetuation-deliverance'
    quote: 'in all other biblical contexts zonah refers unambiguously to fornication, making it almost certain that Rahab was literally a harlot in the plain sense of the word.'
  - where: 'note 2:1 “A harlot named Rahab”'
    claim: 'Her trade may explain her knowledge and why the spies came to her house on the wall'
    key: fisher-rahab
    url: 'https://rsc.byu.edu/vol-25-no-1-2024/rahab-perpetuation-deliverance'
    quote: 'her professional dealings likely explain her heightened access to the male gossip of the city … It may also explain how the spies ended up in her home, situated as it was on an outer wall of the city, where skulking men from both within and without might come without detection'

  - where: 'note 2:4 “Rahab’s words to the king’s men”'
    claim: 'Her words were courageous deceits; the narrator has already told the reader she hid them'
    key: fisher-rahab
    url: 'https://rsc.byu.edu/vol-25-no-1-2024/rahab-perpetuation-deliverance'
    quote: 'Thus her first spoken words are not actually innocent shrugs of ignorance, but carefully chosen and courageous deceits uttered in a tense and potentially life-threatening moment, for what if the king discovers her treason?'
  - where: 'note 2:4 “Rahab’s words to the king’s men”'
    claim: 'Fisher sets her beside the midwives of Exodus, who also misled the king'
    key: fisher-rahab
    url: 'https://rsc.byu.edu/vol-25-no-1-2024/rahab-perpetuation-deliverance'
    quote: 'Rather than admit their dereliction, they, like Rahab, misdirect, inventing the excuse that Israelite mothers are especially fit for childbearing and do not require midwives to deliver.'

  - where: 'note 2:9 “The Song of the Sea come true”'
    claim: '“Terror” in Josh. 2:9 is ʾêmâ with the verb nāpal'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'אֵֽימַתְ/כֶם֙'
  - where: 'note 2:9 “The Song of the Sea come true”'
    claim: 'Ex. 15:16 has the same noun and verb, “fear … shall fall”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'אֵימָ֨תָ/ה֙'
  - where: 'note 2:9 “The Song of the Sea come true”'
    claim: 'Ex. 15:15 “melt away” is nāmōg, the word behind “faint” in Josh. 2:9'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'נָמֹ֕גוּ'
  - where: 'note 2:9 “The Song of the Sea come true”'
    claim: 'The Church''s footnote gives “melt away” and points to Ex. 15:15–16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/2?lang=eng'
    quote: '9b “faint”: HEB melt away; i.e., with fear. Ex. 15:15.'
  - where: 'note 2:9 “The Song of the Sea come true”'
    claim: 'The Exodus echoes in Rahab''s story orient readers forward to a successful campaign'
    key: fisher-rahab
    url: 'https://rsc.byu.edu/vol-25-no-1-2024/rahab-perpetuation-deliverance'
    quote: 'Together, the Exodus recollections throughout Rahab’s story “orient” readers forward, allowing us to anticipate a campaign that will be as successful in Canaan as it was in Egypt.'

  - where: 'note 2:11 “Rahab’s confession”'
    claim: 'The Church''s footnote points from her words to Deut. 4:39'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/2?lang=eng'
    quote: '11c “God”: Deut. 4:39; 2 Ne. 10:14; D&C 20:17; 65:6.'
  - where: 'note 2:11 “Rahab’s confession”'
    claim: 'Rahab, the outsider, truly sees God''s work'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Rahab, a Canaanite harlot and thus the quintessential outsider, distinguishes herself as one who truly sees God’s work.'
  - where: 'note 2:11 “Rahab’s confession”'
    claim: 'Only Gibeon and Rahab ask for mercy, and they obtain it'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Rahab and her family, who are not mentioned in Joshua 11:18–20, are the only other known exception. These are the only ones who ask for mercy in the text, and they obtain it.'
  - where: 'note 2:11 “Rahab’s confession”'
    claim: 'She came to believe Israel''s God acts in human affairs and has power to save'
    key: fisher-rahab
    url: 'https://rsc.byu.edu/vol-25-no-1-2024/rahab-perpetuation-deliverance'
    quote: 'has come to believe that unlike the idols the people of Jericho worshiped, the Israelites’ God is actually acting in the affairs of men. He has true power, specifically to save; they have none.'

  - where: 'note 2:12 “Kindness for kindness”'
    claim: '“Kindness” in verse 12 is ḥesed, twice, and “true token” is ʾôt ʾĕmet'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'חָ֑סֶד … חֶ֔סֶד … א֥וֹת אֱמֶֽת'
  - where: 'note 2:12 “Kindness for kindness”'
    claim: '“Kindly and truly” in verse 14 is ḥesed and ʾĕmet'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'חֶ֥סֶד וֶ/אֱמֶֽת'
  - where: 'note 2:12 “Kindness for kindness”'
    claim: 'Her request for mercy employs covenant language'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Her request for mercy employs covenant language'
  - where: 'note 2:12 “Kindness for kindness”'
    claim: 'Her request uses covenant language and was granted; through her came David''s line'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'The kindness she asks for is granted, and Rahab and her father’s family are allowed to remain in the land; through her descent comes the royal line of David.'

  - where: 'note 2:18 “A Passover at Rahab’s window”'
    claim: 'A color is rarely named without relevance; scarlet is named twice'
    key: fisher-rahab
    url: 'https://rsc.byu.edu/vol-25-no-1-2024/rahab-perpetuation-deliverance'
    quote: 'Rarely does the Old Testament provide physical description for people or objects without some significant relevance. That the thread at Rahab’s window is described as scarlet both here and again in verse 21 is something to note.'
  - where: 'note 2:18 “A Passover at Rahab’s window”'
    claim: 'The two mentions of the line enclose the two mentions of blood'
    key: fisher-rahab
    url: 'https://rsc.byu.edu/vol-25-no-1-2024/rahab-perpetuation-deliverance'
    quote: 'Two instances of the phrase “to bind the scarlet line in the window” enclose exactly two repetitions of the word blood in a typical textual envelope structure.'
  - where: 'note 2:18 “A Passover at Rahab’s window”'
    claim: 'Fisher''s table: scarlet at a threshold, a token, a whole household, death through the door'
    key: fisher-rahab
    url: 'https://rsc.byu.edu/vol-25-no-1-2024/rahab-perpetuation-deliverance'
    quote: 'Scarlet at a threshold … As a token of a relationship of protection … Protecting a full household … But egress through the door brings death'
  - where: 'note 2:18 “A Passover at Rahab’s window”'
    claim: '“Token” in Ex. 12:13 is ʾôt, as in Josh. 2:12'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'לְ/אֹ֗ת'
  - where: 'note 2:18 “A Passover at Rahab’s window”'
    claim: 'The line is a second passover; Israel keeps the Passover just before Jericho'
    key: fisher-rahab
    url: 'https://rsc.byu.edu/vol-25-no-1-2024/rahab-perpetuation-deliverance'
    quote: 'situate the token as part of a second passover, this time uniquely arranged for Rahab and her household under covenant … the tribes of Israel perform the Passover for the first time since entering the promised land (see Joshua 5:10).'
  - where: 'note 2:18 “A Passover at Rahab’s window”'
    claim: 'This Passover is for one believing woman and her family'
    key: fisher-rahab
    url: 'https://rsc.byu.edu/vol-25-no-1-2024/rahab-perpetuation-deliverance'
    quote: 'here the new Passover is individual, on behalf of one believing woman and her immediate family.'

  - where: 'note 2:24 “A different report from the spies”'
    claim: 'Sending spies recalls Numbers 13 and ties Joshua to Moses'
    key: ot-minute-josh-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-2'
    quote: 'this activity recalls Moses’s dispatch of spies into the land of Canaan previously in Numbers 13, thereby reinforcing Joshua’s association with Moses as a literary figure.'
  - where: 'note 2:24 “A different report from the spies”'
    claim: 'The report built on Rahab''s word gave Israel confidence'
    key: ot-minute-josh-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-2'
    quote: 'The spies used Rahab as in informant in their subsequent report to Joshua (2:22–24), thus securing the Israelites the confidence they needed at the outset of their assault'

  - where: 'christ'
    claim: 'Rahab''s story is a pattern for all gathered into God''s family'
    key: fisher-rahab
    url: 'https://rsc.byu.edu/vol-25-no-1-2024/rahab-perpetuation-deliverance'
    quote: 'With such a culmination, Rahab’s story becomes a pattern for all peoples of the world who will one day be gathered forever into the family of God (see Ephesians 1:10).'
  - where: 'christ'
    claim: 'Fisher reads the adoption through 3 Ne. 9:17'
    key: fisher-rahab
    url: 'https://rsc.byu.edu/vol-25-no-1-2024/rahab-perpetuation-deliverance'
    quote: 'The Book of Mormon goes further to acknowledge that patriarchal redemption (again, one of the key blessings of family relationship) is available for the faithful who become the children of God'
  - where: 'christ'
    claim: 'Softening her past reflects a belief that God''s saving reach is limited'
    key: fisher-rahab
    url: 'https://rsc.byu.edu/vol-25-no-1-2024/rahab-perpetuation-deliverance'
    quote: 'Though it seems tempting to whitewash Rahab’s past, the reading is unsound and inadvertently reflects a belief that God’s saving reach is limited and can’t possibly extend as far as harlotry.'
  - where: 'explore'
    claim: 'Fisher traces the allusions to the Exodus through Rahab''s account'
    key: fisher-rahab
    url: 'https://rsc.byu.edu/vol-25-no-1-2024/rahab-perpetuation-deliverance'
    quote: 'This study will attempt to expound these variations, exploring how carefully crafted allusions to the Exodus throughout Rahab’s biblical account have implications for our understanding of how God’s deliverance perpetuates.'
