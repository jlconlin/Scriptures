chapter: 6
claims:
  - where: when
    claim: 'Israel kept the Passover at Gilgal in the plains of Jericho, and Joshua was then by Jericho'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/5?lang=eng'
    quote: 'And the children of Israel encamped in Gilgal, and kept the passover on the fourteenth day of the month at even in the plains of Jericho.'
  - where: setting
    claim: 'The captain of the LORD''s host was possibly Jehovah Himself'
    key: scripture-helps-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/19-joshua-1-8-23-24?lang=eng'
    quote: 'This response suggests that the captain may have been a heavenly being, possibly Jehovah Himself.'
  - where: setting
    claim: 'Jericho was a walled city in the Jordan valley, 800 feet below the Mediterranean, near the crossing'
    key: bd-jericho
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jericho?lang=eng'
    quote: 'A walled city in the valley of the Jordan, 800 feet below the Mediterranean, near the place where the Israelites crossed the river on their first entry into the promised land'
  - where: setting
    claim: 'Jericho''s spring, Ein es-Sultan, produces 1,000 gallons a minute, enough for many nearby settlements; taking such cities would have let Israel found many settlements across the hill country'
    key: sc-knowhy-852
    url: 'https://scripturecentral.org/knowhy/why-was-the-conquest-of-jericho-more-important-than-what-some-in-israel-may-have-realized'
    quote: 'This spring, now known as the Ein es-Sultan Spring, is particularly impressive. It produces 1,000 gallons of water per minute, which would have been more than enough water to sustain not only Jericho but many other nearby settlements. This means that the conquest of Jericho and other spring-fed cities of Canaan would have allowed the Israelites to create many settlements across the hill country.'
  - where: setting
    claim: 'The narrative presents Jericho as beyond Israel''s natural means and portrays God as the one behind the victory'
    key: ot-minute-josh-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-6'
    quote: 'The narrative presents Jericho as a walled and fortified city that would have been beyond the Israelite’s natural means to capture (6:1) … The thrust of the narrative is to portray God as ultimately the one behind Israel’s victories, not any human ingenuity.'
  - where: setting
    claim: 'Hebrews names the fall of the walls as an act of faith'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/11?lang=eng'
    quote: 'By faith the walls of Jericho fell down, after they were compassed about seven days.'
  - where: thread
    claim: 'The instructions focus on symbolic ritual and faith rather than military strategy'
    key: scripture-helps-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/19-joshua-1-8-23-24?lang=eng'
    quote: 'The Lord’s instructions for conquering Jericho focused more on symbolic rituals and the faith of the Israelites than on military strategy.'
  - where: thread
    claim: 'The narrative''s thrust is that God, not human ingenuity, wins Israel''s victories'
    key: ot-minute-josh-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-6'
    quote: 'The thrust of the narrative is to portray God as ultimately the one behind Israel’s victories, not any human ingenuity.'
  - where: thread
    claim: 'Rahab and Achan, both centered on Jericho, show how the herem tested both Canaanites and Israelites'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'The contrasting reactions of Rahab and Achan, both centered around the battle of Jericho (Joshua 2; 6–7), serve as an illustration of how the ḥērem simultaneously tested the Israelites and the Canaanites.'
  - where: section 5 plain
    claim: 'The curse''s "in his firstborn" read as "at the cost of" his firstborn'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/6.htm'
    quote: 'he shall lay the foundation thereof at the price of his first-born, and set up its gates at the price of his youngest son'
  - where: 'note 6:17 “Devoted whole to the LORD”'
    claim: 'At Jericho the city and all in it are herem; inhabitants and livestock killed, spoil to the treasury, city burned, rebuilding cursed'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'The city and everything in it are said to be ḥērem, and the verb heḥĕrīm is also used (Joshua 6:17–19, 21, 24, 26). All inhabitants of the city are killed, along with the livestock. The valuable material spoils are put in the treasury'
  - where: 'note 6:17 “Devoted whole to the LORD”'
    claim: 'One reading counts three gradations of herem in Joshua; the study suggests the practices were applied ad hoc by oracle given beforehand'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'three different “gradations” of ḥērem: in descending order of severity, “absolute” (Jericho), “intermediate” (Ai, Hazor), and “extenuated” (all other cities). … various practices related to ḥērem … were applied ad hoc.'
  - where: 'note 6:17 “Devoted whole to the LORD”'
    claim: 'At Ai a divine oracle let Israel keep the livestock and spoil'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'The oracle also specifies that the livestock and the material spoil of the city are to be kept by the Israelites and that the city is to be burned (Joshua 8:1–8).'
  - where: 'note 6:17 “Devoted whole to the LORD”'
    claim: 'Calabro lists 6:17–18 as the status of Jericho and its property, and the result for those who take of it'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Joshua 6:17–18 accursed; the accursed thing; ye make yourselves accursed status of the city of Jericho and the property in it, result for people who take property from it'
  - where: 'note 6:20 “Jericho’s wall and the excavations”'
    claim: 'Talmage: the captain of the Lord''s host and his heavenly train leveled the walls, sustained by Israel''s faith and obedience'
    key: ot-manual-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/joshua-1-24-the-entry-into-the-promised-land?lang=eng'
    quote: 'May we not believe that when Israel encompassed Jericho, the captain of the Lord’s host and his heavenly train were there, and that before their super-mortal agency, sustained by the faith and obedience of the human army, the walls were leveled?'
  - where: 'note 6:20 “Jericho’s wall and the excavations”'
    claim: 'Excavations at Tell es-Sultan (Jericho) in the 1950s and et-Tell (Ai) in the 1960s found no fortified occupation in the late Late Bronze Age, where those who see a historical kernel place the conquest'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'the excavations of Kathleen Kenyon at Tell es-Sultan (identified with ancient Jericho) in the 1950s and of Joseph A. Callaway at et-Tell (thought to be the site of Ai) in the 1960s showed an absence of fortified occupation levels at these sites during the latter part of the Late Bronze Age.'
  - where: 'note 6:20 “Jericho’s wall and the excavations”'
    claim: 'Those who see a historical kernel place the conquest at the end of the Late Bronze Age'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Scholars who believe that the biblical account of Joshua’s conquest of the promised land has a historical kernel generally place the events at the end of the Late Bronze Age'
  - where: 'note 6:20 “Jericho’s wall and the excavations”'
    claim: 'Most scholars now question the battle''s historicity, with a minority arguing against'
    key: ot-minute-josh-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-6'
    quote: 'This has led most scholars to abandon or at least question the historicity of the battle of Jericho as described in Joshua 6, with a minority of scholars arguing against this negative consensus.'
  - where: 'note 6:20 “Jericho’s wall and the excavations”'
    claim: 'Some read the evidence as showing the account fabricated or greatly exaggerated'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Some interpreters have taken the archaeological evidence to mean that the account of the conquest in Joshua 1–11, including the descriptions of the ḥērem, is either fabricated or greatly exaggerated.'
  - where: 'note 6:20 “Jericho’s wall and the excavations”'
    claim: 'One defender argues Jericho and Ai were fortresses, explaining the missing destruction layers; Calabro calls some of his readings strained'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'argues on the basis of a close reading of the biblical text that Jericho and Ai were both fortresses, not cities with large populations. This would solve the issue of the lack of destruction layers … Hess’s interpretation of some of the biblical texts, however, is strained.'
  - where: 'note 6:20 “Jericho’s wall and the excavations”'
    claim: 'Conclusion: archaeology cannot yet prove or disprove the account, but the evidence could fit aspects of it'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Ultimately, evidence from archaeology is still insufficient to prove or disprove that the ḥērem was actually carried out as described in the conquest narrative of Joshua, but there are various ways in which the evidence could fit with aspects of the biblical account.'
  - where: 'note 6:20 “Jericho’s wall and the excavations”'
    claim: 'Hebrews reads the fall of the walls as faith'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/11?lang=eng'
    quote: 'By faith the walls of Jericho fell down, after they were compassed about seven days.'
  - where: 'note 6:21 “Why all Jericho was destroyed”'
    claim: 'The Church teaches the destruction was a consequence of the Canaanites'' rebellion, after prolonged opportunity to repent'
    key: scripture-helps-violence
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/52-violence-and-destruction-in-the-old-testament?lang=eng'
    quote: 'From the Book of Mormon we learn that the destruction of the Canaanites was a consequence of their rebellion against the Lord.'
  - where: 'note 6:21 “Why all Jericho was destroyed”'
    claim: 'God offered prolonged opportunities to repent; the destruction answered generations of rebellion'
    key: scripture-helps-violence
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/52-violence-and-destruction-in-the-old-testament?lang=eng'
    quote: 'Instead, he offered prolonged opportunities for them to repent. … It was a response to generations of rebellion against God'
  - where: 'note 6:21 “Why all Jericho was destroyed”'
    claim: 'Nephi: the Lord esteems all flesh in one; the Canaanites had rejected every word of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/17?lang=eng'
    quote: 'Behold, the Lord esteemeth all flesh in one; he that is righteous is favored of God. But behold, this people had rejected every word of God, and they were ripe in iniquity'
  - where: 'note 6:21 “Why all Jericho was destroyed”'
    claim: 'The herem tested the Canaanites; Rahab and Gibeon are the only ones who ask for mercy, and they obtain it'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'The ḥērem also tested the Canaanites. … Rahab and her family, who are not mentioned in Joshua 11:18–20, are the only other known exception. These are the only ones who ask for mercy in the text, and they obtain it.'
  - where: 'note 6:21 “Why all Jericho was destroyed”'
    claim: 'The herem had nothing to do with ethnicity and everything to do with personal righteousness'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'we can see that the ḥērem had nothing to do with ethnic or national affiliation and everything to do with personal righteousness and willingness to maintain a covenant relationship with the Lord.'
  - where: 'note 6:21 “Why all Jericho was destroyed”'
    claim: 'Achan took spoil under the herem and he and his family became objects of it'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'he covets and retains some of the spoils that are under the ḥērem … As a result, Achan and his family become objects of the ḥērem themselves (Joshua 7:22–26'
  - where: 'note 6:21 “Why all Jericho was destroyed”'
    claim: 'The narrative presents the herem as a divinely ordered act and leaves its moral implications unaddressed'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'the ḥērem is depicted as a divinely ordered act in which God himself participates; … while the technical workings of the practice and its moral implications are not explicitly addressed.'
  - where: 'note 6:21 “Why all Jericho was destroyed”'
    claim: 'Many Canaanites likely fled'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'What actually played out was likely not wholesale extermination, though still more violent than typical conflict. Many Canaanites likely fled and sought refuge elsewhere.'
  - where: 'note 6:25 “Rahab dwells in Israel”'
    claim: 'Rabbinic commentators read "she dwelleth in Israel" as her full conversion; Fisher sets it beside Jeremiah 12:16'
    key: fisher-rahab
    url: 'https://rsc.byu.edu/vol-25-no-1-2024/rahab-perpetuation-deliverance'
    quote: 'Rabbinic commentators have long interpreted this phrase to mean that Rahab cast off her prior ways and joined Israel with full heart and conviction, a supposition supported perhaps by this later promise from Jeremiah'
  - where: 'note 6:25 “Rahab dwells in Israel”'
    claim: 'Christian tradition, from Matthew, makes Rahab wife of Salmon and mother of Boaz, who married Ruth; David and Jesus Christ come through this line; her place in the genealogies shows her full assimilation'
    key: fisher-rahab
    url: 'https://rsc.byu.edu/vol-25-no-1-2024/rahab-perpetuation-deliverance'
    quote: 'Christian tradition, drawn from Matthew chapter one, recognizes Rahab instead as the wife of Salmon and mother of Boaz … David … comes through this line, as does Jesus Christ … Nothing demonstrates Rahab’s complete assimilation and unification into her new community more than her marriage and prestigious place in the genealogies of the people.'
  - where: 'note 6:25 “Rahab dwells in Israel”'
    claim: 'Jewish tradition has Rahab marry Joshua'
    key: fisher-rahab
    url: 'https://rsc.byu.edu/vol-25-no-1-2024/rahab-perpetuation-deliverance'
    quote: 'Jewish tradition, developed from a series of nuanced textual extrapolations, claims that Rahab married Joshua'
  - where: christ
    claim: 'In Christian tradition Rahab of Jericho is the Rachab of Matthew''s genealogy'
    key: fisher-rahab
    url: 'https://rsc.byu.edu/vol-25-no-1-2024/rahab-perpetuation-deliverance'
    quote: 'Christian tradition, drawn from Matthew chapter one, recognizes Rahab instead as the wife of Salmon and mother of Boaz'
  - where: 'note 6:25 “Rahab dwells in Israel”'
    claim: 'Matthew names a Rachab as mother of Boaz in Jesus'' genealogy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/1?lang=eng'
    quote: 'And Salmon begat Booz of Rachab; and Booz begat Obed of Ruth; and Obed begat Jesse;'
  - where: 'note 6:26 “The price of rebuilding Jericho”'
    claim: 'One older reading: the Hebrew preposition marks the price; the builder loses all his sons; "buildeth" means refortify, since Jericho existed in David''s time'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/6.htm'
    quote: '(בּ denoting the price of a thing) … The two last clauses express the thought that the builder of the town would pay for its restoration by the loss of all his sons, from the first-born to the very youngest.'
  - where: 'note 6:26 “The price of rebuilding Jericho”'
    claim: 'Building here means restoring the town as a fortification'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/6.htm'
    quote: 'The word "buildeth," however, does not refer to the erection of houses upon the site of the town that had been burnt to ashes, but to the restoration of the town as a fortification'
  - where: 'note 6:26 “The price of rebuilding Jericho”'
    claim: 'Jericho existed in the time of David and of the judges'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/6.htm'
    quote: 'he began to build the town of Jericho, which existed, according to 2 Samuel 10:5 and Judges 3:13, in the time of David, and even of the judges'
  - where: 'note 6:26 “The price of rebuilding Jericho”'
    claim: 'The curse was fulfilled by Hiel in Ahab''s days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/16?lang=eng'
    quote: 'In his days did Hiel the Beth-elite build Jericho: he laid the foundation thereof in Abiram his firstborn, and set up the gates thereof in his youngest son Segub, according to the word of the Lord, which he spake by Joshua the son of Nun.'
  - where: 'note 6:26 “The price of rebuilding Jericho”'
    claim: 'The curse belongs to the herem applied to Jericho'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'The city itself is burned. Joshua curses any who would rebuild the city in the future.'
  - where: christ
    claim: 'The captain of the LORD''s host was possibly Jehovah Himself'
    key: scripture-helps-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/19-joshua-1-8-23-24?lang=eng'
    quote: 'This response suggests that the captain may have been a heavenly being, possibly Jehovah Himself.'
  - where: christ
    claim: 'Israel received God''s power only as they obeyed His instructions, though they seemed strange'
    key: scripture-helps-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/19-joshua-1-8-23-24?lang=eng'
    quote: 'The Israelites received God’s power only as they obeyed His instructions. … The instructions no doubt seemed strange, but his faith in the outcome urged him on.'
  - where: christ
    claim: 'Hebrews names Rahab''s survival as faith'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/11?lang=eng'
    quote: 'By faith the harlot Rahab perished not with them that believed not, when she had received the spies with peace.'
  - where: explore
    claim: 'Calabro''s study treats the herem through Joshua 6–7'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Jericho (Joshua 6). The city and everything in it are said to be ḥērem'
