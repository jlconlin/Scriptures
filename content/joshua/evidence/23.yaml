chapter: 23
claims:
  - where: when
    claim: 'The speech comes a long time after the LORD gave Israel rest, when Joshua was old'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/23?lang=eng'
    quote: 'And it came to pass a long time after that the Lord had given rest unto Israel from all their enemies round about, that Joshua waxed old and stricken in age.'
  - where: setting
    claim: 'Chapters 23–24 are Joshua''s valedictory speech; the time after the allotments is not specified'
    key: ot-minute-josh-23
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-23'
    quote: 'Joshua 23–24 records Joshua’s valedictory speech to the children of Israel just before Joshua’s death, which is narrated here and in the next (and final) chapter of the book. The setting for this speech was “a long time after” the territorial allotments, but the exact amount of time is not specified'
  - where: setting
    claim: 'The eastern tribes were sent home after the LORD gave rest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/22?lang=eng'
    quote: 'And now the Lord your God hath given rest unto your brethren, as he promised them: therefore now return ye, and get you unto your tents'
  - where: setting
    claim: 'Joshua received Timnath-serah as his city'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/19?lang=eng'
    quote: 'they gave him the city which he asked, even Timnath-serah in mount Ephraim: and he built the city, and dwelt therein.'
  - where: setting
    claim: 'The immediate audience is the leaders; in chapter 24 it is Israel as a whole'
    key: ot-minute-josh-23
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-23'
    quote: 'The immediate audience for this speech was the elders, judges, and officers of Israel (verse 2), whereas Joshua’s audience in the next chapter was Israel as a whole.'
  - where: setting
    claim: 'In chapter 24 all the tribes gather at Shechem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/24?lang=eng'
    quote: 'And Joshua gathered all the tribes of Israel to Shechem, and called for the elders of Israel, and for their heads, and for their judges, and for their officers'
  - where: setting
    claim: 'The speech bookends the LORD''s speech at 1:2–9, an inclusio around the story'
    key: ot-minute-josh-23
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-23'
    quote: 'This concluding speech bookends the speech the Lord gave at the outset of the conquest of Canaan (1:2–9), thus acting as a sort of narrative inclusio that envelops the overarching story.'
  - where: setting
    claim: 'The speech is comparable to the farewells of Jacob (Gen. 49) and Moses (Deut. 31–33)'
    key: ot-minute-josh-23
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-23'
    quote: 'Joshua’s speech might be comparable to those given by Jacob (Genesis 49) and Moses (Deuteronomy 31–33) just before their own respective deaths, thereby linking Joshua back to these figures.'
  - where: setting
    claim: 'One older reading: the address consists of reminiscences from the Pentateuch, especially Deuteronomy'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/23.htm'
    quote: 'so his address consists entirely of reminiscences from the Pentateuch, more especially from Deuteronomy'
  - where: thread
    claim: 'The speech has two parts, 2–13 and 14–16, each opening with Joshua''s age and approaching death'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/23.htm'
    quote: 'Joshua 23:2-13 and Joshua 23:14-16. In both parts Joshua commences with a reference to his age and his approaching death'
  - where: thread
    claim: 'The main emphasis of the speech is covenant faithfulness'
    key: ot-minute-josh-23
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-23'
    quote: 'The main emphasis of Joshua’s speech to the elders of Israel was the importance of covenant faithfulness.'
  - where: thread
    claim: 'As the good words had not failed, so the evil words would come if they transgressed'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/23.htm'
    quote: 'But it was just as certain that the Lord would bring upon them every evil word that He spake through Moses'
  - where: 'section 1 plain'
    claim: 'Joshua had divided by lot the remaining nations as the tribes'' inheritance'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/23.htm'
    quote: 'He (Joshua) had now divided by lot among the tribes of Israel as their inheritance these still remaining (Canaanitish) nations'
  - where: 'note 23:4 “The nations that remain”'
    claim: 'The LORD told Joshua to divide by lot land he had not yet driven out'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/13?lang=eng'
    quote: 'them will I drive out from before the children of Israel: only divide thou it by lot unto the Israelites for an inheritance, as I have commanded thee.'
  - where: 'note 23:4 “The nations that remain”'
    claim: 'Smoot: the warning against the remaining nations'' gods is odd if the claims of annihilation are taken at face value'
    key: ot-minute-josh-23
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-23'
    quote: 'Joshua then stressed how crucial it was for Israel not to turn to the foreign gods of their remaining Canaanite neighbors (verses 7, 12)—an odd comment indeed if we take at face value the totalizing claims made in the book about the Canaanites’ supposed annihilation.'
  - where: 'note 23:4 “The nations that remain”'
    claim: 'Judges speaks of the nations Joshua left when he died'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/2?lang=eng'
    quote: 'I also will not henceforth drive out any from before them of the nations which Joshua left when he died:'
  - where: 'note 23:6 “The charge Joshua received, passed on”'
    claim: 'Joshua 1:7: the LORD''s charge to Joshua to be very courageous and keep the law, not turning right or left'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/1?lang=eng'
    quote: 'Only be thou strong and very courageous, that thou mayest observe to do according to all the law, which Moses my servant commanded thee: turn not from it to the right hand or to the left'
  - where: 'note 23:6 “The charge Joshua received, passed on”'
    claim: 'The speech bookends the LORD''s speech at 1:2–9'
    key: ot-minute-josh-23
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-23'
    quote: 'This concluding speech bookends the speech the Lord gave at the outset of the conquest of Canaan (1:2–9)'
  - where: 'note 23:7 “Four acts of worship”'
    claim: 'One older reading: naming, swearing, serving, bowing are the four outward forms of worship'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/23.htm'
    quote: 'To make mention of the names of the idols (Exodus 23:13), to swear by them, to serve them (by sacrifices), and to bow down to them (to invoke them in prayer), are the four outward forms of divine worship (see Deuteronomy 6:13; Deuteronomy 10:20).'
  - where: 'note 23:7 “Four acts of worship”'
    claim: 'Exodus 23:13 forbids mentioning other gods'' names'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/23?lang=eng'
    quote: 'make no mention of the name of other gods, neither let it be heard out of thy mouth.'
  - where: 'note 23:7 “Four acts of worship”'
    claim: 'Deut. 10:20: serve, cleave and swear by the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/10?lang=eng'
    quote: 'Thou shalt fear the Lord thy God; him shalt thou serve, and to him shalt thou cleave, and swear by his name.'
  - where: 'note 23:8 “Cleave”'
    claim: 'The verb in 23:8 and 23:12 is dābaq (H1692)'
    key: oshb-wlc
    url: 'https://biblehub.com/hebrew/1692.htm'
    quote: 'dabaq: To cling, cleave, adhere, stick, join'
  - where: 'note 23:8 “Cleave”'
    claim: 'BDB defines it cling, cleave, keep close'
    key: bdb
    url: 'https://biblehub.com/hebrew/1692.htm'
    quote: 'verb cling, cleave, keep close'
  - where: 'note 23:8 “Cleave”'
    claim: 'BDB lists Gen. 2:24, 1 Kgs. 11:2 and Josh. 23:12 under the figurative sense of loyalty and affection'
    key: bdb
    url: 'https://biblehub.com/hebrew/1692.htm'
    quote: 'figurative of loyalty, affection etc., sometimes with idea of physical proximity retained'
  - where: 'note 23:8 “Cleave”'
    claim: 'BDB lists 1 Kgs. 11:2 and Josh. 23:12 together'
    key: bdb
    url: 'https://biblehub.com/hebrew/1692.htm'
    quote: '1 Kings 11:2; Joshua 23:12 (D)'
  - where: 'note 23:8 “Cleave”'
    claim: 'BDB lists Josh. 23:8 among verses of cleaving to the LORD'
    key: bdb
    url: 'https://biblehub.com/hebrew/1692.htm'
    quote: 'Deuteronomy 10:20; Deuteronomy 13:5; Joshua 23:8 (all D)'
  - where: 'note 23:8 “Cleave”'
    claim: 'Cleave and love are covenant language in the speech'
    key: ot-minute-josh-23
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-23'
    quote: 'covenant language abounds in this speech, including the specific injunctions for the Israelites to “cleave unto” and “love” Jehovah (verses 8, 11)'
  - where: 'note 23:8 “Cleave”'
    claim: '1 Kgs. 11:2: Solomon clave unto the foreign women in love'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: 'for surely they will turn away your heart after their gods: Solomon clave unto these in love.'
  - where: 'note 23:10 “One against a thousand”'
    claim: 'Lev. 26:8 promise of five chasing a hundred'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'And five of you shall chase an hundred, and an hundred of you shall put ten thousand to flight'
  - where: 'note 23:10 “One against a thousand”'
    claim: 'One older reading: 23:10 describes the blessing of fidelity, as in Deut. 32:30, on the basis of Lev. 26:7–8, and repeats 23:3'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/23.htm'
    quote: 'In Joshua 23:10, the blessing of fidelity to the law which Israel had hitherto experienced, is described, as in Deuteronomy 32:30, upon the basis of the promise in Leviticus 26:7-8, and Deuteronomy 28:7, and in Joshua 23:10 the thought of Joshua 23:3 is repeated.'
  - where: 'note 23:10 “One against a thousand”'
    claim: 'Deut. 32:30: one chasing a thousand because their Rock had sold them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/32?lang=eng'
    quote: 'How should one chase a thousand, and two put ten thousand to flight, except their Rock had sold them, and the Lord had shut them up?'
  - where: 'note 23:12 “Why marriage with the nations was forbidden”'
    claim: 'Deut. 7:4 gives the reason: they will turn away thy son to serve other gods'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/7?lang=eng'
    quote: 'For they will turn away thy son from following me, that they may serve other gods'
  - where: 'note 23:12 “Why marriage with the nations was forbidden”'
    claim: 'Israel was forbidden to intermarry with Canaanites lest they abandon their covenants'
    key: sc-knowhy-110
    url: 'https://scripturecentral.org/knowhy/why-did-book-of-mormon-prophets-discourage-nephite-lamanite-intermarriage'
    quote: 'the children of Israel were forbidden from intermarrying with Canaanites as they came to repossesses the land of promise, lest they abandon their covenants with the Lord.'
  - where: 'note 23:12 “Why marriage with the nations was forbidden”'
    claim: 'Joshua repeated the prohibition, warning of snares and traps'
    key: sc-knowhy-110
    url: 'https://scripturecentral.org/knowhy/why-did-book-of-mormon-prophets-discourage-nephite-lamanite-intermarriage'
    quote: 'Moses’ successor Joshua repeated this prohibition, warning that intermarriage with Canaanites or other non-Israelites would result in “snares and traps” for the Israelites (Joshua 23:11–13).'
  - where: 'note 23:13 “Snares, scourges and thorns”'
    claim: 'Num. 33:55: pricks in your eyes and thorns in your sides'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/33?lang=eng'
    quote: 'those which ye let remain of them shall be pricks in your eyes, and thorns in your sides'
  - where: 'note 23:13 “Snares, scourges and thorns”'
    claim: 'Judg. 2:1–3: the angel at Bochim; thorns in your sides, their gods a snare'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/2?lang=eng'
    quote: 'Wherefore I also said, I will not drive them out from before you; but they shall be as thorns in your sides, and their gods shall be a snare unto you.'
  - where: 'note 23:13 “Snares, scourges and thorns”'
    claim: 'Judg. 2:22: the nations left to prove Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/2?lang=eng'
    quote: 'That through them I may prove Israel, whether they will keep the way of the Lord to walk therein'
  - where: 'note 23:13 “Snares, scourges and thorns”'
    claim: '1 Ne. 2:21, 24: rebellious brothers a scourge to stir Nephi''s seed to remembrance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/2?lang=eng'
    quote: 'And if it so be that they rebel against me, they shall be a scourge unto thy seed, to stir them up in the ways of remembrance.'
  - where: 'note 23:15 “Good things and evil things”'
    claim: 'Josh. 21:45: there failed not ought of any good thing'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/21?lang=eng'
    quote: 'There failed not ought of any good thing which the Lord had spoken unto the house of Israel; all came to pass.'
  - where: 'note 23:15 “Good things and evil things”'
    claim: 'One older reading: as none of the good words failed, it was as certain the evil words of Lev. 26 and Deut. 28 would come if they transgressed the covenant'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/23.htm'
    quote: 'But it was just as certain that the Lord would bring upon them every evil word that He spake through Moses (Leviticus 26:14-33; Deuteronomy 28:15-68, and Deuteronomy 29:14-28), if they transgressed His covenant.'
  - where: 'note 23:15 “Good things and evil things”'
    claim: 'Verse 16 echoes Deut. 11:17'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/23.htm'
    quote: 'they would be quickly destroyed from the good land which He had given them (vid., Deuteronomy 11:17).'
  - where: 'note 23:15 “Good things and evil things”'
    claim: 'Deut. 11:17 wording'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/11?lang=eng'
    quote: 'and lest ye perish quickly from off the good land which the Lord giveth you.'
  - where: 'note 23:15 “Good things and evil things”'
    claim: 'The Church''s footnote to “good” in 23:16 points to 1 Kgs. 14:15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/23?lang=eng'
    quote: '“good”: 1 Kgs. 14:15.'
  - where: 'note 23:15 “Good things and evil things”'
    claim: 'Ahijah: the LORD will root Israel out of this good land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/14?lang=eng'
    quote: 'he shall root up Israel out of this good land, which he gave to their fathers, and shall scatter them beyond the river'
  - where: christ
    claim: 'D&C 82:10: the Lord is bound when ye do what I say'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/82?lang=eng'
    quote: 'I, the Lord, am bound when ye do what I say; but when ye do not what I say, ye have no promise.'
  - where: christ
    claim: 'Jacob 6:5: cleave unto God as he cleaveth unto you'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/jacob/6?lang=eng'
    quote: 'and cleave unto God as he cleaveth unto you.'
  - where: christ
    claim: 'The Church''s footnote to “cleave” in 23:8 points to Jacob 6:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/23?lang=eng'
    quote: '“cleave”: 2 Kgs. 18:6; Jacob 6:5; Hel. 4:25; D&C 11:19.'
  - where: christ
    claim: 'The Church''s footnote to “good” in 23:14 points to D&C 82:10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/23?lang=eng'
    quote: '“good”: D&C 82:10.'
