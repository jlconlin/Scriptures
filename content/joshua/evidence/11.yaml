chapter: 11
claims:
  - where: when
    claim: 'The battle is at the waters of Merom, then Hazor; it follows the southern campaign'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/11?lang=eng'
    quote: 'So Joshua took the whole land, according to all that the Lord said unto Moses; and Joshua gave it for an inheritance unto Israel according to their divisions by their tribes. And the land rested from war.'
  - where: setting
    claim: 'The northern campaign follows the southern and mirrors chapter 10 in broad structure'
    key: ot-minute-josh-11
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-11'
    quote: 'Having pacified the southern Canaanite coalition, the Israelites switched their focus to northern Canaan to deal with the lingering threat in that part of the land of promise. The northern campaign spans Joshua 11:1–15 and mirrors in broad structure the previous chapter'
  - where: setting
    claim: 'News of the southern victories warned the northern kings, who allied under the king of Hazor and met Israel at the waters of Merom'
    key: brandt-conquest
    url: 'https://www.churchofjesuschrist.org/study/ensign/1973/10/the-conquest-of-canaan?lang=eng'
    quote: 'The reports of Israel’s success in the southern portion of Canaan served as a warning to the city kings of the north. These northern rulers, allied under the direction of the king of Hazor, met the Israelites in battle in the heart of their own territory at the waters of Merom.'
  - where: setting
    claim: 'Chapters 1–12 are the conquest; 13–24 the allotment and Joshua''s final exhortations'
    key: bd-joshua-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joshua-book-of?lang=eng'
    quote: 'It describes (1) the conquest of Canaan (Josh. 1–12); (2) the allotment of the land among the tribes and Joshua’s final exhortations (Josh. 13–24).'
  - where: setting
    claim: 'The summary of verses 16–23 heavily emphasizes the totality of the conquest'
    key: ot-minute-josh-11
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-11'
    quote: 'The totality of the conquest is emphasized heavily in this summary, which goes to pains to map out the specific range of the Israelites’ victories.'
  - where: thread
    claim: 'The defeat is told quickly, the victory decisive and total, the cities under the same herem as in the south'
    key: ot-minute-josh-11
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-11'
    quote: 'The defeat of the northern Canaanite federation is described quickly (verses 10–15). The Israelites’ victory is depicted as being decisive and total, with the cities being subjected to the same ḥerem applied to the southern sites.'
  - where: thread
    claim: 'The herem is represented as the way Jehovah''s armies cooperate with Him as He fights for Israel'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'In all these scenarios, the ḥērem is consistently represented as a means by which Jehovah’s armies cooperate with him as he fights for Israel.'
  - where: section 3 plain
    claim: 'The cities stood on their mounds (tel), not "in their strength"'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Joshua+11%3A13&version=ESV'
    quote: '13 But none of the cities that stood on mounds did Israel burn, except Hazor alone; that Joshua burned.'
  - where: 'note 11:1 “Jabin, king of Hazor”'
    claim: 'Another Canaanite king named Jabin appears in Judges 4 and Psalm 83:9; whether he is the same is unclear'
    key: ot-minute-josh-11
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-11'
    quote: 'The northern Canaanite coalition was led by King Jabin of Hazor (verses 1–5). Another Canaanite king by the same name appears in Judges 4[1] and is mentioned again in Psalm 83:9. Whether this is the same Jabin as the one mentioned here in Joshua 11 is unclear'
  - where: 'note 11:1 “Jabin, king of Hazor”'
    claim: 'Judges 4 names Jabin king of Canaan reigning in Hazor, with Sisera as captain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/4?lang=eng'
    quote: 'And the Lord sold them into the hand of Jabin king of Canaan, that reigned in Hazor; the captain of whose host was Sisera, which dwelt in Harosheth of the Gentiles.'
  - where: 'note 11:1 “Jabin, king of Hazor”'
    claim: 'The battle at Merom did not secure all the land but gave a basis for settlement'
    key: brandt-conquest
    url: 'https://www.churchofjesuschrist.org/study/ensign/1973/10/the-conquest-of-canaan?lang=eng'
    quote: 'This major conflict did not secure all of the land for Israel, but it did provide a basis for the settlement of the people.'
  - where: 'note 11:1 “Jabin, king of Hazor”'
    claim: 'Evidence from Hazor points to a violent destruction at the end of the Late Bronze Age, which can be read as consistent with the account'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Scholars who believe that the biblical account of Joshua’s conquest of the promised land has a historical kernel generally place the events at the end of the Late Bronze Age (ca. 1200 BC).[21] Evidence from Hazor, a city mentioned in the biblical account, points to a violent destruction around this time and can thus be interpreted as consistent with the biblical account.'
  - where: 'note 11:1 “Jabin, king of Hazor”'
    claim: 'Archaeology is insufficient to prove or disprove the account, though evidence could fit aspects of it'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Ultimately, evidence from archaeology is still insufficient to prove or disprove that the ḥērem was actually carried out as described in the conquest narrative of Joshua, but there are various ways in which the evidence could fit with aspects of the biblical account.'
  - where: 'note 11:6 “Why the horses were hamstrung”'
    claim: 'To hough is to cut the leg tendons, making the horse useless; Israel were foot soldiers; the fear was that using horses and chariots Israel would trust the arm of flesh (2 Sam. 8:4; Isa. 31:1)'
    key: ot-manual-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/joshua-1-24-the-entry-into-the-promised-land?lang=eng'
    quote: 'To hough a horse is to cut the leg tendons above and behind the tarsal joint or ankle, thus rendering the horse useless. The Israelites were foot soldiers rather than charioteers. The fear seems to have been that should the horses and chariots be used as vehicles of war, Israel would turn from faith in God and trust in the arm of flesh (see 2 Samuel 8:4; Isaiah 31:1).'
  - where: 'note 11:6 “Why the horses were hamstrung”'
    claim: 'One older reading: the command was to keep Israel from trusting in horses and chariots (Ps. 20:7; 147:10; Deut. 17:16), and it kept them from conquest beyond Canaan'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/11.htm'
    quote: 'The command, to render the horses useless, was intended to lead Israel not to place its confidence in horses and chariots (Psalm 20:7; Psalm 147:10), and wisely incapacitated them from extending their conquests beyond the borders of Canaan. See Deuteronomy 17:16.'
  - where: 'note 11:6 “Why the horses were hamstrung”'
    claim: 'The horses and chariots were especially formidable to Israel, who had none'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/11.htm'
    quote: 'thou shalt hough their horses] So especially formidable to the Israelites, who had none.'
  - where: 'note 11:13 “Cities left standing on their mounds”'
    claim: 'The Hebrew of "in their strength" is "on their mound" (tillam, from tel)'
    key: oshb-wlc
    url: 'https://biblehub.com/hebrew/8510.htm'
    quote: 'Original Word: תֵּל … Transliteration: tel … KJV: heap, X strength'
  - where: 'note 11:13 “Cities left standing on their mounds”'
    claim: 'tel means a mound or hill on which a city stood; the same word with suffix in Jer. 30:18'
    key: bdb
    url: 'https://biblehub.com/hebrew/8510.htm'
    quote: '2 mound or hill on which city stood: suffix תִּלָּם Joshua 11:18 (D), תִּלָּתּ Jeremiah 30:18.'
  - where: 'note 11:13 “Cities left standing on their mounds”'
    claim: 'A modern translation reads "the cities that stood on mounds"'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Joshua+11%3A13&version=ESV'
    quote: '13 But none of the cities that stood on mounds did Israel burn, except Hazor alone; that Joshua burned.'
  - where: 'note 11:13 “Cities left standing on their mounds”'
    claim: 'Only Jericho gets the most extreme form; elsewhere only Ai and Hazor are burned; in every case but Jericho livestock and spoils are kept'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Only Jericho seems to get the most extreme form of destruction, including not only the killing of human inhabitants but also the burning of the city, the slaying of livestock, and the proclamation not to rebuild the city … Elsewhere in Joshua, only Ai and Hazor are burned, and only Ai receives the devastation pronouncement; in every case other than Jericho, the livestock and spoils are kept'
  - where: 'note 11:13 “Cities left standing on their mounds”'
    claim: 'The variation may have been applied ad hoc, by oracle'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'it may be the case that various practices related to ḥērem, such as the burning of the city or the desolation pronouncement, were applied ad hoc. In the conquest of Ai, the burning of the city and the treatment of the spoils are specified in a divine oracle prior to the confrontation'
  - where: 'note 11:18 “How long the war lasted”'
    claim: 'The record preserves only summary accounts; the conquest extended over many years'
    key: brandt-conquest
    url: 'https://www.churchofjesuschrist.org/study/ensign/1973/10/the-conquest-of-canaan?lang=eng'
    quote: 'The record preserves only summary accounts of the major campaigns of the Israelites; however, the conquest extended over many years and was never fully completed on the terms the Lord had originally specified.'
  - where: 'note 11:18 “How long the war lasted”'
    claim: 'Caleb was forty when sent from Kadesh-barnea and eighty-five, forty-five years later, at the division'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/14?lang=eng'
    quote: 'the Lord hath kept me alive, as he said, these forty and five years, even since the Lord spake this word unto Moses, while the children of Israel wandered in the wilderness: and now, lo, I am this day fourscore and five years old.'
  - where: 'note 11:18 “How long the war lasted”'
    claim: 'One older reading: judging from 14:7, 10, as much as seven years'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/11.htm'
    quote: 'Joshua made war with the kings of Canaan a long time; judging from Joshua 14:7, Joshua 14:10, as much as seven years, though Josephus (Ant. v. 1, 19) speaks of five'
  - where: 'note 11:20 “Whose hearts were hardened”'
    claim: 'The Joseph Smith Translation manuscript reads that the Canaanites hardened their own hearts'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/80'
    quote: 'Verse 20th For it was of the Lord to distroy them utterly, because they hardened there hearts, that they should come against Israel in battle; that they might have no faver, that they might destroy them in battle, as the lord commanded Moses,'
  - where: 'note 11:20 “Whose hearts were hardened”'
    claim: 'The manuscript marks the rest of Joshua as correct'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/80'
    quote: '" All correct up to the XI Chapter—— … All the rest of the Chapters in Joshua are Correct'
  - where: 'note 11:20 “Whose hearts were hardened”'
    claim: 'This is the only JST change in Joshua, the same kind as in Exodus; it shows the people hardened their hearts, not the Lord'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'The only change in the book of Joshua is the same kind of change that was made repeatedly in the book of Exodus, concerning the Lord hardening a person’s heart … The change shows that it was the people who had hardened their hearts and not the Lord.'
  - where: 'note 11:20 “Whose hearts were hardened”'
    claim: 'The Exodus changes clarify a Hebrew word; the Joshua change corrected the historical record of the people''s condition'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'The purpose in Exodus was to clarify the translation of a Hebrew word. … While these changes in Exodus seemingly drew his attention to the verse in Joshua, the change in Joshua corrected the historical record of the people’s condition.'
  - where: 'note 11:20 “Whose hearts were hardened”'
    claim: 'Verse 20 is a narrative nod to Moses and Pharaoh, casting the Canaanites in the Egyptians'' role'
    key: ot-minute-josh-11
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-11'
    quote: 'The comment in verse 20 that the Lord hardened the hearts of the inhabitants of Canaan serves as both a narrative nod to Moses and Pharaoh[3] and thereby casts the Canaanites in a similar role as the Egyptians in the Exodus tradition.'
  - where: 'note 11:20 “Whose hearts were hardened”'
    claim: '11:18–20 implies the cities could have made peace; only Gibeon and Rahab asked for mercy, and they obtained it'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Joshua 11:18–20 implies that the Canaanite cities had the possibility of making peace with the Israelites; however, they hardened their hearts, with the exception of Gibeon … These are the only ones who ask for mercy in the text, and they obtain it.'
  - where: 'note 11:21 “The Anakims cut off, and still remaining”'
    claim: 'Those consigned to herem, the Anakites among them, later needed to be reconquered (11:21; 15:13–14), a sign the herem did not mean total extermination in practice'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'there are several indications that the ḥērem did not involve total extermination in actual practice. Some passages describe people consigned to ḥērem later needing to be reconquered—for example, the Anakites and other Canaanite groups in the time of Joshua'
  - where: 'note 11:21 “The Anakims cut off, and still remaining”'
    claim: 'Hebron, the city of Arba the father of Anak, is later given to Caleb'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/15?lang=eng'
    quote: 'And unto Caleb the son of Jephunneh he gave a part among the children of Judah, according to the commandment of the Lord to Joshua, even the city of Arba the father of Anak, which city is Hebron.'
  - where: christ
    claim: 'The JST makes the Canaanites the ones who hardened their hearts'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/80'
    quote: 'For it was of the Lord to distroy them utterly, because they hardened there hearts'
  - where: christ
    claim: 'Gibeon and Rahab''s household are the only ones who ask for mercy in the text, and they obtain it'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'These are the only ones who ask for mercy in the text, and they obtain it.'
  - where: christ
    claim: 'The fear seems to have been that Israel would trust in the arm of flesh'
    key: ot-manual-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/joshua-1-24-the-entry-into-the-promised-land?lang=eng'
    quote: 'Israel would turn from faith in God and trust in the arm of flesh'
  - where: explore
    claim: 'Judges 4 tells of Jabin who reigned in Hazor and his captain Sisera'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/4?lang=eng'
    quote: 'Howbeit Sisera fled away on his feet to the tent of Jael the wife of Heber the Kenite: for there was peace between Jabin the king of Hazor and the house of Heber the Kenite.'
