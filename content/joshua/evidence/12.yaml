chapter: 12
claims:
  - where: when
    claim: 'The wars ended and the land rested before it was divided'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/11?lang=eng'
    quote: 'So Joshua took the whole land, according to all that the LORD said unto Moses; and Joshua gave it for an inheritance unto Israel according to their divisions by their tribes. And the land rested from war.'
  - where: setting
    claim: 'Chapter 11 closes the wars with a summary that Joshua took the whole land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/11?lang=eng'
    quote: 'So Joshua took the whole land, according to all that the LORD said unto Moses'
  - where: setting
    claim: 'The Bible Dictionary divides the book into the conquest (1–12) and the allotment (13–24)'
    key: bd-joshua-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joshua-book-of?lang=eng'
    quote: 'It describes (1) the conquest of Canaan (Josh. 1–12); (2) the allotment of the land among the tribes and Joshua’s final exhortations (Josh. 13–24).'
  - where: setting
    claim: 'The chapter summarizes the kings defeated by Moses as well as by Joshua'
    key: ot-minute-josh-12
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-12'
    quote: 'The twelfth chapter of Joshua summarizes the kings defeated by not just Joshua but also his predecessor, Moses.'
  - where: setting
    claim: 'Moses gave the land of Sihon and Og to Reuben, Gad and half Manasseh; the next chapter says much land remains'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/13?lang=eng'
    quote: 'Now Joshua was old and stricken in years; and the LORD said unto him, Thou art old and stricken in years, and there remaineth yet very much land to be possessed.'
  - where: thread
    claim: 'The narrative attributes the victories to the LORD fighting for Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/10?lang=eng'
    quote: 'And all these kings and their land did Joshua take at one time, because the LORD God of Israel fought for Israel.'
  - where: thread
    claim: 'The western bounds of 12:7 repeat those of 11:17'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/11?lang=eng'
    quote: 'Even from the mount Halak, that goeth up to Seir, even unto Baal-gad in the valley of Lebanon under mount Hermon'
  - where: section 1 plain
    claim: 'The sea of Chinneroth is the Sea of Galilee; Ashdoth-pisgah is the slopes of Pisgah'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/12.htm'
    quote: 'over the eastern side of the Ghor, between the Sea of Galilee and the Dead Sea (see at Deuteronomy 3:17). "By the way to Bethjeshimoth, and towards the south below the slopes of Pisgah"'
  - where: 'note 12:1 “A roll of the conquered kings”'
    claim: 'The Bible Dictionary counts the list as the close of the conquest narrative'
    key: bd-joshua-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joshua-book-of?lang=eng'
    quote: 'This narrative concludes with a general statement of the results of the conquest and a list of conquered cities.'
  - where: 'note 12:1 “A roll of the conquered kings”'
    claim: 'Egyptian and Mesopotamian kings recorded victories in lists of conquered lands and cities on royal monuments'
    key: ot-minute-josh-12
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-12'
    quote: 'Egyptian and Mesopotamian monarchs likewise recorded their military victories in the form of long lists of conquered lands and cities on royal monuments as a way to either legitimate their reign or glorify the gods (or both).'
  - where: 'note 12:1 “A roll of the conquered kings”'
    claim: 'The list lays claim to Israel''s territory and glorifies the Lord as divine warrior'
    key: ot-minute-josh-12
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-12'
    quote: 'The rhetorical thrust of the list presented here is clearly intended to do something similar: to lay claim to Israel’s territory and legitimate its emergence as a nation and to glorify the Lord as Israel’s divine warrior.'
  - where: 'note 12:1 “A roll of the conquered kings”'
    claim: 'The narrative gives the victory to the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/10?lang=eng'
    quote: 'because the LORD God of Israel fought for Israel.'
  - where: 'note 12:6 “Moses'' kings and Joshua''s in one list”'
    claim: 'Naming Sihon and Og expands the scope of the conquests east of the Jordan'
    key: ot-minute-josh-12
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-12'
    quote: 'These two kings occupied territory east of the Jordan (compare Joshua 12:1–2). The text thus expands the scope of Israel’s conquests into the land east of the Jordan River.'
  - where: 'note 12:6 “Moses'' kings and Joshua''s in one list”'
    claim: 'Psalm 135 remembers Sihon, Og and the kingdoms of Canaan together as one heritage'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/135?lang=eng'
    quote: 'Sihon king of the Amorites, and Og king of Bashan, and all the kingdoms of Canaan: And gave their land for an heritage, an heritage unto Israel his people.'
  - where: 'note 12:23 “Which Gilgal, and what nations”'
    claim: 'This Gilgal is not the Gilgal on the Jordan but Jiljilieh, west of Ebal and Gerizim, in the coastal plain; "nations" compared with Gen. 14:1'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/12.htm'
    quote: 'Genesis 14:1, “Tidal king of nations.” The Gilgal here mentioned is not the Gilgal on the Jordan, but the modern Jiljilieh, west of Ebal and Gerizim, in the plain along the Mediterranean.'
  - where: 'note 12:23 “Which Gilgal, and what nations”'
    claim: 'Goyim is a proper name as in Gen. 14:1; Gilgal in all probability near Antipatris, at Jiljule (a different site from Cambridge''s)'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/12.htm'
    quote: 'Gilgal: the seat of the king of the Goyim (a proper name, as in Genesis 14:1), in all probability the same place as the villa nomine Galgulis mentioned in the Onom. … to the north of Antipatris, which still exists in the Moslem village of Jiljule'
  - where: 'note 12:23 “Which Gilgal, and what nations”'
    claim: 'The Hebrew word rendered "nations" is goyim'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'גּוֹיִ֥ם'
  - where: 'note 12:23 “Which Gilgal, and what nations”'
    claim: 'The Septuagint reads "the king of Gei of Galilee"'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/joshua/12.htm'
    quote: 'the king of Gei of Galilee'
  - where: 'note 12:23 “Which Gilgal, and what nations”'
    claim: 'Tidal is called king of nations in Gen. 14:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/14?lang=eng'
    quote: 'Tidal king of nations'
  - where: 'note 12:24 “More kings than the story told”'
    claim: 'The narrative says in general that Joshua smote all the kings of the south and north'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/10?lang=eng'
    quote: 'So Joshua smote all the country of the hills, and of the south, and of the vale, and of the springs, and all their kings: he left none remaining'
  - where: 'note 12:24 “More kings than the story told”'
    claim: 'The list expands on the narrative, suggesting the compiler had more sources; the narrative is selective and much is unknown'
    key: ot-minute-josh-12
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-12'
    quote: 'The list given here greatly expands the number of conquered cities or kings that was described in the narrative of the previous eleven chapters. This suggests that the author or compiler of the book of Joshua had at his disposal more sources for the conquest than what made it into the final version of the story'
  - where: 'note 12:24 “More kings than the story told”'
    claim: 'The narrated conquests were selected for theological purposes; much remains unknown'
    key: ot-minute-josh-12
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-12'
    quote: 'The conquests depicted narratively in the book of Joshua were thus selected for specific ideological or theological purposes, and much of the history of the underlying events of the conquest remains unknown.'
  - where: christ
    claim: 'Psalm 136 recounts the kings smitten, Sihon and Og among them, with a refrain of mercy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/136?lang=eng'
    quote: 'To him which smote great kings: for his mercy endureth for ever'
  - where: christ
    claim: 'Not any good thing the LORD spoke failed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/21?lang=eng'
    quote: 'There failed not ought of any good thing which the LORD had spoken unto the house of Israel; all came to pass.'
