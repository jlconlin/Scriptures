chapter: 5
claims:
  - where: when
    claim: 'The crossing and the arrival at Gilgal were on the tenth day of the first month; the Passover on the fourteenth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/5?lang=eng'
    quote: 'kept the passover on the fourteenth day of the month at even in the plains of Jericho'
  - where: setting
    claim: 'Gilgal was the site of three ritual or covenant ceremonies before the conquest: circumcision, Passover, eating the produce of the land'
    key: ot-minute-josh-5
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-5'
    quote: 'Gilgal was also the site where the children of Israel participated in three important ritual or covenant ceremonies before commencing the conquest of Canaan: the circumcision of all the men born in the wilderness (Joshua 5:2–9), the celebration of the Passover (verse 10), and the eating of the produce of the land (verses 11–12).'
  - where: setting
    claim: 'The book divides the crossing (1:1–5:12) from the conquest (5:13–12:24)'
    key: ot-minute-josh-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-1'
    quote: 'follows a thematic pattern (for example, the crossing of the Jordan [1:1–5:12]; the conquest [5:13–12:24]; and the allotment of land [13:1–22:34]).'
  - where: setting
    claim: 'The stage set for the conquest; Joshua has his divine commission as Moses''s successor'
    key: ot-minute-josh-5
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-5'
    quote: 'The stage was set for the conquest to commence. Israel was prepared for war, and Joshua had his divine commission as Moses’s successor. The first battle will commence at Jericho in the next chapter.'
  - where: thread
    claim: 'Circumcision at Gilgal renewed the Abrahamic covenant and marked a new, faithful generation before the conquest'
    key: ot-minute-josh-5
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-5'
    quote: 'The circumcision of the Israelite men at Gilgal was meant to renew that covenant and demarcate a new, faithful generation of men who were about to undertake the conquest of Canaan.'
  - where: thread
    claim: 'The captain''s appearance likely reminded Joshua that the Lord would fight for Israel'
    key: scripture-helps-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/19-joshua-1-8-23-24?lang=eng'
    quote: 'This interaction with the captain of the Lord’s host likely reminded Joshua and the Israelites that the Lord would fight for Israel as they sought to conquer the promised land.'
  - where: thread
    claim: 'The crossing ends at 5:12 and the conquest begins at 5:13'
    key: ot-minute-josh-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-1'
    quote: 'the crossing of the Jordan [1:1–5:12]; the conquest [5:13–12:24]'

  - where: 'note 5:1 “Until we were passed over”'
    claim: 'The Hebrew as written (ketiv) has “we passed”; the reading (qere) has “they passed”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'עבר/נו'
  - where: 'note 5:1 “Until we were passed over”'
    claim: 'The Greek translation reads “when they passed over”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/joshua/5.htm'
    quote: 'that the Lord God had dried up the river Jordan from before the children of Israel when they passed over, that their hearts failed'
  - where: 'note 5:2 “The second time”'
    claim: '“The second time” is not a second cut but the first circumcision of those born in the wilderness'
    key: wessel-circumcision
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/circumcision-old-testament'
    quote: 'The text of Joshua 5:7 makes clear that this second circumcision is also not a reference to another cut on the already circumcised but is a first circumcision of those born in the wilderness.'
  - where: 'note 5:2 “The second time”'
    claim: 'The second time God''s people were circumcised as a group, the first with Abraham; a collective rededication'
    key: wessel-circumcision
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/circumcision-old-testament'
    quote: 'It seems that this second circumcision is the second time God’s chosen people had been circumcised as a group, the first being when the rite was instituted with Abraham and his family. This episode is an example of collective rededication.'
  - where: 'note 5:2 “The second time”'
    claim: 'Circumcision renewed the Abrahamic covenant and marked a new generation'
    key: ot-minute-josh-5
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-5'
    quote: 'Circumcision, of course, was the sign of the covenant God made with Abraham (see Genesis 17:10–14). The circumcision of the Israelite men at Gilgal was meant to renew that covenant and demarcate a new, faithful generation'
  - where: 'note 5:2 “The second time”'
    claim: 'Smoot contrasts the circumcision at Gilgal with that of Shechem in Genesis 34'
    key: ot-minute-josh-5
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-5'
    quote: 'In the case of the faithful Israelites at Gilgal, the text implies that they will prosper militarily because of their faithfulness in keeping the commandment to be circumcised, whereas the men of Shechem met their demise'

  - where: 'note 5:5 “Why the wilderness generation went uncircumcised”'
    claim: 'Explanations offered; some consensus for divine disfavor after unbelief; others nonnecessity or difficulty; scripture does not say'
    key: wessel-circumcision
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/circumcision-old-testament'
    quote: 'There seems to be some consensus around the explanation that circumcision was temporarily discontinued as a mark of divine disfavor precipitated by their disbelief in God’s promise that they could oust the inhabitants of the promised land.'
  - where: 'note 5:5 “Why the wilderness generation went uncircumcised”'
    claim: 'Other explanations and that scripture does not state why'
    key: wessel-circumcision
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/circumcision-old-testament'
    quote: 'Other explanations for not circumcising while wandering include nonnecessity (there was no need to distinguish between Israel and other nations) and divine favor (circumcision would have been difficult while traveling). Ultimately the scriptures do not state directly why the practice was discontinued.'
  - where: 'note 5:5 “Why the wilderness generation went uncircumcised”'
    claim: 'The Student Manual: not faithful in the covenant, they failed to continue its symbol; the Lord required it reinstituted on the ground denied their fathers'
    key: ot-manual-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/joshua-1-24-the-entry-into-the-promised-land?lang=eng'
    quote: 'Israel had wandered forty years in the wilderness because they were not faithful in their covenant with God. It is not surprising, then, that during that period they had failed to continue the practice of circumcision, which was the symbol of their covenant.'
  - where: 'note 5:5 “Why the wilderness generation went uncircumcised”'
    claim: 'The manual: after the Jordan, onto ground denied their fathers, the Lord required the token reinstituted'
    key: ot-manual-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/joshua-1-24-the-entry-into-the-promised-land?lang=eng'
    quote: 'onto the sacred ground that had been denied their fathers, the Lord required them to reinstitute the physical token of the covenant.'
  - where: 'note 5:9 “The reproach rolled away”'
    claim: 'Pun: gll “to roll away” and Gilgal; an etiology, the narrator explaining a name'
    key: ot-minute-josh-5
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-5'
    quote: 'There is a pun in the Hebrew of this verse: the Lord said He “rolled away” (Hebrew gll, “to roll away”) the reproach of Israel at the place of Gilgal (which etymologically seems to be related to the word for wheel or circle).'
  - where: 'note 5:9 “The reproach rolled away”'
    claim: 'Etiology defined'
    key: ot-minute-josh-5
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-5'
    quote: 'one of the rare moments in the text where the narrator injected himself into the story to explain the origins of something to his readers, a feature called etiology, common in ancient storytelling.'
  - where: 'note 5:9 “The reproach rolled away”'
    claim: 'BDB: galal, roll away; figurative of reproach from upon the people at Josh. 5:9'
    key: bdb
    url: 'https://biblehub.com/hebrew/1556.htm'
    quote: 'verb roll, roll away … roll away stone from upon (מֵעַל) the mouth of a well Genesis 29:3,8 … figurative reproach from upon (מֵעַל) the people Joshua 5:9'
  - where: 'note 5:9 “The reproach rolled away”'
    claim: 'Two older explanations of “the reproach of Egypt”: slavery, or the Egyptians'' taunts'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/5.htm'
    quote: '(i) the reproach, which had attached to the people all the way from Egypt, where the nation had been a people of slaves … (ii) referring to the taunts and reproaches actually levelled by the Egyptians against the Israelites, because of their long wanderings in the desert'
  - where: 'note 5:9 “The reproach rolled away”'
    claim: 'Keil: the Egyptians'' saying that Jehovah brought Israel out to destroy them in the desert; rolled away as a pledge the land would be given'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/5.htm'
    quote: 'the reproach involved in the thoughts and sayings of the Egyptians, that Jehovah had brought the Israelites out of Egypt to destroy them in the desert (Exodus 32:12; Numbers 14:13-16; Deuteronomy 9:28), which rested upon Israel as long as it was condemned to wander restlessly about and to die in the wilderness.'
  - where: 'note 5:9 “The reproach rolled away”'
    claim: 'Keil: the circumcision a declaration of the restored covenant and a pledge of the land'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/5.htm'
    quote: 'this act was a practical declaration of the perfect restoration of the covenant, and a pledge that the Lord would now give them the land of Canaan for their inheritance.'
  - where: 'note 5:9 “The reproach rolled away”'
    claim: '“You” is plural in Hebrew; God reaccepted the people'
    key: wessel-circumcision
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/circumcision-old-testament'
    quote: 'In Joshua 5:9, when God “rolled away the reproach of Egypt from off you,” the “you” is plural in Hebrew. It seems that at Gilgal, God not only reaccepted the persons, he reaccepted the people'

  - where: 'note 5:10 “The Passover in the land”'
    claim: 'Keil: kept the Passover after the nation had been received again into covenant; it had been suspended since Sinai (Num. 9:1)'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/5.htm'
    quote: 'When the whole nation had been received again into covenant with the Lord by circumcision, they kept the passover, which had no doubt been suspended from the time that they left Sinai (Numbers 9:1.)'
  - where: 'note 5:10 “The Passover in the land”'
    claim: 'Smoot: the Gilgal Passover a narrative inverse of the first; Joshua presiding as a Moses-like figure; manna''s ending anticipated at Ex. 16:35'
    key: ot-minute-josh-5
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-5'
    quote: 'In a sort of narrative inverse, the Passover held at Gilgal is also connected with death (this time of the Canaanites) and Israel’s entry into the land of promise. Joshua’s presiding over the Passover once again signifies his status as a Moses-like figure.'
  - where: 'note 5:10 “The Passover in the land”'
    claim: 'Passover first mentioned in Exodus 12 with the tenth plague'
    key: ot-minute-josh-5
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-5'
    quote: 'This festival is first mentioned in Exodus 12 in connection with the tenth plague (the death of the firstborns) and Israel’s flight from Egypt.'
  - where: 'note 5:10 “The Passover in the land”'
    claim: 'The manna''s end was anticipated at Exodus 16:35'
    key: ot-minute-josh-5
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-5'
    quote: 'That manna stopped being given to the Israelites on that day was anticipated at Exodus 16:35.'
  - where: 'note 5:10 “The Passover in the land”'
    claim: 'Num. 9:1–5 records the Passover kept in the wilderness of Sinai'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/9?lang=eng'
    quote: 'And they kept the passover on the fourteenth day of the first month at even in the wilderness of Sinai'

  - where: 'note 5:14 “The captain of the host of the LORD”'
    claim: 'Joshua''s question is natural: the drawn sword like Balaam''s and David''s visions'
    key: ot-minute-josh-5
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-5'
    quote: 'As earlier with the vision of Balaam (Numbers 22:23, 31) and, later, of David (1 Chronicles 21:16), in his vision Joshua saw a man with a drawn sword, whom he at first did not recognize.'
  - where: 'note 5:14 “The captain of the host of the LORD”'
    claim: 'Joshua worshipped on recognizing deity; 6:2–5 confirms the Lord was speaking'
    key: ot-minute-josh-5
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-5'
    quote: 'He accordingly “fell on his face to the earth, and did worship,” since he now recognized that he was in the presence of deity (Joshua 5:14). … That the Lord was speaking to Joshua in this vision is confirmed by Joshua 6:2–5'
  - where: 'note 5:14 “The captain of the host of the LORD”'
    claim: 'The Greek has no “Nay”: “And he said to him, I am now come, the chief captain”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/joshua/5.htm'
    quote: '14And he said to him, I am now come, the chief captain of the host of the Lord.'
  - where: 'note 5:14 “The captain of the host of the LORD”'
    claim: 'Scripture Helps: the captain may have been a heavenly being, possibly Jehovah'
    key: scripture-helps-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/19-joshua-1-8-23-24?lang=eng'
    quote: 'This response suggests that the captain may have been a heavenly being, possibly Jehovah Himself.'
  - where: 'note 5:14 “The captain of the host of the LORD”'
    claim: 'Muhlestein: “hosts” means armies; the phrase is used of Jehovah as a man of war who fights for his people, including Josh. 5:14; the Savior uses it in the Restoration'
    key: muhlestein-savior-sword
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/savior-sword'
    quote: 'Because this phrase is used in the Old Testament in connection with Jehovah being a man of war who fights for his people (e.g., Genesis 32:2; Joshua 5:14; 1 Samuel 4:4 …), it seems clear that in these Restoration revelations, that same being intends for himself to be seen in the same way'
  - where: 'note 5:14 “The captain of the host of the LORD”'
    claim: 'Sabaoth means “of war,” translated “hosts” or “armies”'
    key: muhlestein-savior-sword
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/savior-sword'
    quote: 'Because the Hebrew word Sabaoth comes from the word for “fighting” or “war” and literally means men “of war,” it is usually translated as “hosts,” or “armies.”'

  - where: 'note 5:14 “The captain of the host of the LORD”'
    claim: '“Captain of the host” (śar ṣəbā’) is the same two words as “prince of the host” in Dan. 8:11'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'הַ/צָּבָ֖א'
  - where: 'note 5:14 “The captain of the host of the LORD”'
    claim: 'Josh. 5:14 has śar ṣəbā’ YHWH'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'צְבָֽא'
  - where: 'note 5:15 “Joshua at his own burning bush”'
    claim: 'The command parallels Jehovah''s to Moses on Sinai; Joshua now stood in sacred space'
    key: ot-minute-josh-5
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-5'
    quote: 'The response the man gave Joshua parallels Jehovah’s response to Moses on Sinai at the beginning of his own theophany (see Exodus 3:5). Joshua now stood in sacred space.'
  - where: 'note 5:15 “Joshua at his own burning bush”'
    claim: 'Joshua now had his divine commission as Moses''s successor'
    key: ot-minute-josh-5
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-5'
    quote: 'Israel was prepared for war, and Joshua had his divine commission as Moses’s successor.'
  - where: 'note 5:15 “Joshua at his own burning bush”'
    claim: 'Removing shoes on holy ground is a symbolic action, with meaning rather than a practical purpose'
    key: parry-symbolic-action
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/symbolic-action-prophecy-old-testament'
    quote: 'For example, Moses and Joshua removed their shoes while standing upon holy ground (see Exodus 3:5; Joshua 5:15) … Their unconventional action, gesture, movement, or posture of itself may not have had an immediate practical purpose but had symbolic meaning or metaphoric application.'
  - where: 'note 5:15 “Joshua at his own burning bush”'
    claim: 'The LORD would magnify Joshua so Israel would know He was with him as with Moses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/3?lang=eng'
    quote: 'that they may know that, as I was with Moses, so I will be with thee'
  - where: 'note 5:15 “Joshua at his own burning bush”'
    claim: 'Esplin: the book''s Moses parallels, the shoe at 5:15 among them, are a record of God keeping His promise to be with His prophet'
    key: esplin-as-with-moses
    url: 'https://mi.byu.edu/old-testament-reflections/as-i-was-with-moses'
    quote: 'the book of Joshua is a record of God keeping His promise to be with His prophet and people. … Joshua was commanded, like Moses before him, to “loose thy shoe from off thy foot, for the place whereon thou standest is holy.” And Joshua, like Moses before him, “did so”'

  - where: christ
    claim: 'The captain possibly Jehovah; the Lord would fight for Israel'
    key: scripture-helps-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/19-joshua-1-8-23-24?lang=eng'
    quote: 'This response suggests that the captain may have been a heavenly being, possibly Jehovah Himself. This interaction with the captain of the Lord’s host likely reminded Joshua and the Israelites that the Lord would fight for Israel'
  - where: christ
    claim: 'Lund: Israel followed Jesus, in the types of Joshua and the ark, into the land and was again the covenant people'
    key: lund-types-symbols
    url: 'https://rsc.byu.edu/literature-belief/old-testament-types-symbols'
    quote: 'Now that they had sanctified themselves and followed Jesus (seen in the types of Joshua and the ark of the covenant) into the promised land, they were once again the true covenant people and therefore the token was reinstituted.'
  - where: christ
    claim: 'Muhlestein: the Lord will conquer our oppressors of death and hell (2 Ne. 9), and what oppresses us in life'
    key: muhlestein-savior-sword
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/savior-sword'
    quote: 'In some ways, we are being assured that the Lord will conquer our great oppressors of death and hell (see 2 Nephi 9).'
  - where: christ
    claim: 'Wessel: the circumcision at Gilgal as collective rededication of the people'
    key: wessel-circumcision
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/circumcision-old-testament'
    quote: 'The idea of collective rededication is intriguing, and many other examples exist.'
  - where: explore
    claim: 'Smoot sets the drawn sword beside Balaam''s and David''s visions and reads 6:2–5 as the captain''s message'
    key: ot-minute-josh-5
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-5'
    quote: 'That the Lord was speaking to Joshua in this vision is confirmed by Joshua 6:2–5, which contains the details of the speech after the brief parenthetical aside at 6:1.'
