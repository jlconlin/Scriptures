chapter: 8
claims:
  - where: when
    claim: 'Ai lay near Beth-el; the first attempt on it had failed'
    key: brandt-conquest
    url: 'https://www.churchofjesuschrist.org/study/ensign/1973/10/the-conquest-of-canaan?lang=eng'
    quote: 'Next came the campaign against the fortress city of Ai, near Bethel. After the initial attempt of active siege with a limited force had failed, Joshua employed the military strategy of decoy to destroy the city.'
  - where: setting
    claim: 'The second attempt on Ai came with the Lord''s assurance of victory'
    key: ot-minute-josh-8
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-8'
    quote: 'Having failed to take the city at first (see Joshua 7:2–5), the Israelites attempted a second time to capture Ai, this time with the Lord’s assurance of their victory (8:1–2).'
  - where: setting
    claim: 'Ai was a fortress city near Beth-el'
    key: brandt-conquest
    url: 'https://www.churchofjesuschrist.org/study/ensign/1973/10/the-conquest-of-canaan?lang=eng'
    quote: 'Next came the campaign against the fortress city of Ai, near Bethel.'
  - where: setting
    claim: 'Ai is already named in Abraham''s sojourning; its name means ruin'
    key: ot-minute-josh-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-7'
    quote: 'Already mentioned at Genesis 12:8 and 13:3 in connection with Abraham’s sojourning, Ai (modern et-Tell) means simply “ruin” or “desolation,” not so subtly foreshadowing its fate.'
  - where: setting
    claim: 'Shechem between Gerizim and Ebal is about thirty miles from Ai'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/8.htm'
    quote: 'The distance from Ai to Shechem between Gerizim and Ebal is about thirty miles in a straight line.'
  - where: setting
    claim: 'The Ebal verses are a narrative sequel or postscript, a covenant renewal ceremony'
    key: ot-minute-josh-8
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-8'
    quote: 'The events narrated on Mount Ebal at the end of the chapter act as a narrative sequel or postscript (Joshua 8:30–35). Here the text specifies that Joshua led Israel in a covenant renewal ceremony.'
  - where: setting
    claim: 'Moses commanded a covenant-renewal ceremony at Shechem on Ebal and Gerizim, carried out in Josh. 8:30–35'
    key: seely-covenant-renewal
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal'
    quote: 'Moses commanded the children of Israel to renew their commitment to the covenant—as soon as they passed over the Jordan … in a formal covenant-renewal ceremony that was to take place at Shechem and on the mountains of Ebal and Gerizim'
  - where: thread
    claim: 'Jehovah''s involvement in the herem appears through revealed directives (8:1, 18) and Joshua''s ritual gesture at Ai'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Jehovah’s involvement is manifest through frequent revealed directives (6:2–5; 7:10–15; 8:1, 18; 10:8), through attendant miracles (6:20; 10:11–14), and through ritual practices like the circumambulation of Jericho (6:6–16) and Joshua’s ritual gesture at the battle of Ai (8:18, 26).'
  - where: thread
    claim: 'The five elements of the region''s herem accounts, ending in the founding of a cult installation, appear most clearly at Ai'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: '(4) taking of booty; and (5) founding of a cult installation.[60] Of the various cities mentioned in the conquest narrative of Joshua, the five elements appear most clearly in the account of the conquest of Ai (Joshua 8).'
  - where: thread
    claim: 'One older reading: the Ebal ceremony acknowledged the victories as a pledge of the rest of the land, provided Israel kept covenant faithfulness'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/8.htm'
    quote: 'a practical acknowledgement, that in the overthrow of the Canaanites thus far it had received a strong pledge of the conquest of the foes that still remained and the capture of the whole of the promised land, provided only it persevered in covenant faithfulness'
  - where: note 8:1 “Fear not, after the defeat”
    claim: 'This time Israel goes up with the Lord''s assurance of victory, after the first failure'
    key: ot-minute-josh-8
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-8'
    quote: 'Having failed to take the city at first (see Joshua 7:2–5), the Israelites attempted a second time to capture Ai, this time with the Lord’s assurance of their victory (8:1–2).'
  - where: note 8:1 “Fear not, after the defeat”
    claim: 'Joshua 1:9 has the same charge, “be not afraid, neither be thou dismayed”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/1?lang=eng'
    quote: 'Have not I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the LORD thy God is with thee whithersoever thou goest.'
  - where: note 8:1 “Fear not, after the defeat”
    claim: '“I have given into thy hand” is the formula of the divine oracle in the region''s war accounts'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: '(1) receipt of a divine oracle ordering the conquest of the city, including in Hebrew texts the formula “I have delivered X into your hand(s)” (Numbers 21:34; Joshua 8:1; 10:8; compare Judges 1:2; 7:9)'
  - where: note 8:2 “Ai's spoil given to Israel”
    claim: 'At Ai the Israelites were allowed to keep some of the booty, a key difference from Jericho'
    key: ot-minute-josh-8
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-8'
    quote: 'One of the key differences this time, however, is that the Israelites were allowed to retain some of the confiscated booty (verse 27).'
  - where: note 8:2 “Ai's spoil given to Israel”
    claim: 'The oracle specifies before the battle that livestock and spoil are kept and the city burned'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'The oracle also specifies that the livestock and the material spoil of the city are to be kept by the Israelites and that the city is to be burned (Joshua 8:1–8).'
  - where: note 8:2 “Ai's spoil given to Israel”
    claim: 'Only Jericho gets the most extreme form; in every case other than Jericho the livestock and spoil are kept'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Only Jericho seems to get the most extreme form of destruction … in every case other than Jericho, the livestock and spoils are kept by the Israelites (see table 2).'
  - where: note 8:2 “Ai's spoil given to Israel”
    claim: 'Direction by oracle may explain the variation in the herem'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'In the conquest of Ai, the burning of the city and the treatment of the spoils are specified in a divine oracle prior to the confrontation; this practice of obtaining direction by oracle may have been the general rule and may explain the variation'
  - where: note 8:2 “Ai's spoil given to Israel”
    claim: 'Had Achan waited until Ai he would have received the plunder; the lesson is trusting and waiting on Jehovah'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'if he had only waited until the battle of Ai in the following chapter, he would have received the plunder that God granted to the Israelites in that case. The lesson, writes Younger, is one of trusting or waiting on Jehovah and obeying his word.'
  - where: note 8:2 “An ambush the LORD commands”
    claim: 'The plan was to feint a retreat and draw Ai''s army into an ambush, a classic military tactic'
    key: ot-minute-josh-8
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-8'
    quote: 'This second time, Joshua devised a plan to feint a retreat in order to trick the army of Ai out of the city, thereby trapping it in an ambush (verses 3–9; compare verses 10–22). It is a classic military tactic'
  - where: note 8:2 “An ambush the LORD commands”
    claim: 'Joshua used the strategy of decoy at Ai, compared with Alma 52:19–26'
    key: brandt-conquest
    url: 'https://www.churchofjesuschrist.org/study/ensign/1973/10/the-conquest-of-canaan?lang=eng'
    quote: 'After the initial attempt of active siege with a limited force had failed, Joshua employed the military strategy of decoy to destroy the city. (Josh. 7–8; cf. Alma 52:19–26.)'
  - where: note 8:12 “Thirty thousand, or five thousand”
    claim: 'One older reading notes the apparent discrepancy and three possible explanations'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/8.htm'
    quote: 'There is an apparent discrepancy between this statement and that in Joshua 8:10-12. But possibly (a) while 30000 were selected for the ambush, 5000 were actually employed when the decisive moment came; or (b) Joshua may have sent two distinct bodies of men, one of 30000, the other of 5000'
  - where: note 8:12 “Thirty thousand, or five thousand”
    claim: 'The third explanation: the 5,000 sent from Joshua''s force to encourage the 30,000'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/8.htm'
    quote: 'or (c) as Bp Wordsworth suggests, on the day after the 30000 had taken up their position the 5000 may have been sent from Joshua’s own force to encourage and assure them.'
  - where: note 8:18 “The spear held out”
    claim: 'The spear recalls Moses in the battle with Amalek'
    key: ot-minute-josh-8
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-8'
    quote: 'Joshua’s holding out his spear towards Ai (verse 18) recalls the actions of Moses in Israel’s battle with Amalek (see Exodus 17:8–13).'
  - where: note 8:18 “The spear held out”
    claim: 'Joshua, at a distance, extends a sickle sword and holds it until the herem is done; the gesture resembles Moses''; the verb is attributed to Joshua alone; a ritual exertion of power'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Joshua, who is standing at some distance from the city, extends his hand with a sickle sword toward the city and does not withdraw it until he has devoted to destruction (heḥĕrīm) all the men of the city (Joshua 8:18–19, 26).'
  - where: note 8:18 “The spear held out”
    claim: 'The action of the verb in 8:26 is attributed solely to Joshua; the herem involved a supernatural exertion of power through ritual'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'The action of the verb heḥĕrīm in Joshua 8:26 is attributed solely to Joshua, and his ritual gesture is part of the means by which the ḥērem is carried out.'
  - where: note 8:18 “The spear held out”
    claim: 'The stretched-out spear is a prophetic symbolic action that spelled out judgment, fulfilled when Israel slew the men of Ai'
    key: parry-symbolic-action
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/symbolic-action-prophecy-old-testament'
    quote: 'Joshua’s stretching out of the spear toward the city of Ai spelled out an ominous judgment against the city, which was immediately fulfilled when the Israelites ambushed the city and “slew the men of Ai” (Joshua 8:21).'
  - where: note 8:18 “The spear held out”
    claim: 'Joshua''s spear is among prophetic symbolic gestures with Ahijah''s torn garment and Jeremiah''s stones'
    key: parry-symbolic-action
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/symbolic-action-prophecy-old-testament'
    quote: 'For example, Joshua stretched a spear toward the city of Ai (see Joshua 8:18–19); Ahijah tore a new garment into twelve pieces (see 1 Kings 11:29–31); … Jeremiah placed stones in a brick kiln (see Jeremiah 43:8–13)'
  - where: note 8:28 “A heap for ever, and what was found there”
    claim: '“Heap” is Hebrew tel, “mound”; the narrator writes some time afterward'
    key: ot-minute-josh-8
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-8'
    quote: 'the site of Ai (the Hebrew word for “ruin” or “desolation”) is “an heap [Hebrew tel, “mound”] for ever, even a desolation unto this day,” indicating also that the story is describing the events some time afterwards.'
  - where: note 8:28 “A heap for ever, and what was found there”
    claim: 'The words may be read as a lasting effect, or as a devastation pronouncement like the curse on Jericho'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Since there is no mention of a formal curse as there is in the case of Jericho, it is possible to read this simply as a statement of the long-lasting effect of Joshua’s total destruction of the city.[18] However … Kyle C. Dunham is likely correct in regarding this as an example of the “devastation pronouncement.”'
  - where: note 8:28 “A heap for ever, and what was found there”
    claim: 'Probably Joshua ritually pronounces the city a perpetual desolation'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Joshua makes the city “forever a heap of ruins” (v. 28), probably meaning that he ritually pronounces the city a perpetual desolation, an act similar to the curse pronounced on Jericho.'
  - where: note 8:28 “A heap for ever, and what was found there”
    claim: 'Ai is modern et-Tell'
    key: ot-minute-josh-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-7'
    quote: 'Ai (modern et-Tell) means simply “ruin” or “desolation,”'
  - where: note 8:28 “A heap for ever, and what was found there”
    claim: 'Excavations at et-Tell in the 1960s showed no fortified occupation in the latter Late Bronze Age; those who see a historical kernel place the events about 1200 BC'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'the excavations of Kathleen Kenyon at Tell es-Sultan (identified with ancient Jericho) in the 1950s and of Joseph A. Callaway at et-Tell (thought to be the site of Ai) in the 1960s showed an absence of fortified occupation levels at these sites during the latter part of the Late Bronze Age.'
  - where: note 8:28 “A heap for ever, and what was found there”
    claim: 'Scholars who see a historical kernel place the events at the end of the Late Bronze Age'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Scholars who believe that the biblical account of Joshua’s conquest of the promised land has a historical kernel generally place the events at the end of the Late Bronze Age (ca. 1200 BC).'
  - where: note 8:28 “A heap for ever, and what was found there”
    claim: 'Some take the evidence to mean the account is fabricated or greatly exaggerated'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Some interpreters have taken the archaeological evidence to mean that the account of the conquest in Joshua 1–11, including the descriptions of the ḥērem, is either fabricated or greatly exaggerated.'
  - where: note 8:28 “A heap for ever, and what was found there”
    claim: 'Hess: Jericho and Ai were fortresses, not populous cities; the study calls some of his readings strained'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Richard S. Hess, for example, argues on the basis of a close reading of the biblical text that Jericho and Ai were both fortresses, not cities with large populations. … Hess’s interpretation of some of the biblical texts, however, is strained.'
  - where: note 8:28 “A heap for ever, and what was found there”
    claim: 'Wood: Ai is misidentified; the actual site is Khirbet el-Maqatir'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Bryant G. Wood takes a different position, arguing that the generally accepted identifications of Bethel and Ai with Beitin and et-Tell are faulty and that the actual sites are el-Bira and Khirbet el-Maqatir respectively.'
  - where: note 8:28 “A heap for ever, and what was found there”
    claim: 'Archaeology is insufficient to prove or disprove the account, but the evidence could fit aspects of it'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Ultimately, evidence from archaeology is still insufficient to prove or disprove that the ḥērem was actually carried out as described in the conquest narrative of Joshua, but there are various ways in which the evidence could fit with aspects of the biblical account.'
  - where: note 8:29 “The king taken down at sunset”
    claim: 'The first execution by hanging associated with Israel; it follows Deuteronomy 21; the body is down at dusk and put in a cairn'
    key: belnap-fell-tree
    url: 'https://rsc.byu.edu/they-shall-grow-together/they-did-fell-tree'
    quote: 'Joshua 8 records the first execution by hanging associated with ancient Israel. … Comparable to the legal injunction, Joshua keeps the corpse on the tree for only the day, taking the body down at dusk. Moreover, there is no further corpse defilement because it is interred in a cairn'
  - where: note 8:29 “The king taken down at sunset”
    claim: 'The king''s hanging recalls Zemnarihah''s; perhaps the latter was meant to mimic it'
    key: ot-minute-josh-8
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-8'
    quote: 'The fate of the king of Ai—being hanged on a tree—recalls that of the notorious Gadianton leader Zemnarihah in the Book of Mormon (verse 29; compare 3 Nephi 4:28), and, perhaps, the latter’s execution was deliberately meant to mimic the former’s.'
  - where: note 8:29 “The king taken down at sunset”
    claim: 'Taking the body down was in keeping with Deuteronomy 21:22–23'
    key: ot-minute-josh-8
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-8'
    quote: 'Joshua’s actions in taking the body of the king of Ai off the tree after his execution were in keeping with the injunction of Deuteronomy 21:22–23'
  - where: note 8:30 “Why an altar on Ebal now”
    claim: 'Ebal is about thirty miles from Ai; obedience to God''s command was why Joshua did not postpone it'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/8.htm'
    quote: 'we simply reply, that obedience to the command of God was not a matter of such indifference to the servant of the Lord as Knobel imagines. There was no valid reason after the capture of Ai for postponing any longer the solemn ceremony'
  - where: note 8:30 “Why an altar on Ebal now”
    claim: 'Shechem lay further north, where Joshua had not yet beaten the Canaanites'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/8.htm'
    quote: 'by no means involves the impossibility or even the improbability of a march to Shechem, which was situated further north, where he had not yet beaten the Canaanites, and had not effected any conquests.'
  - where: note 8:30 “Why an altar on Ebal now”
    claim: 'Ebal is about thirty miles from Ai'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/8.htm'
    quote: 'The distance from Ai to Shechem between Gerizim and Ebal is about thirty miles in a straight line.'
  - where: note 8:30 “Why an altar on Ebal now”
    claim: 'The altar on Ebal stands where the region''s war accounts have the founding of a cult installation'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Founding of a cult installation “And I built this high place for Kemosh in the citadel” (line 3) … “Then Joshua built an altar unto the Lord God of Israel in mount Ebal” (v. 30)'
  - where: note 8:30 “Why an altar on Ebal now”
    claim: 'Ebal is roughly equidistant from Hazor and Debir; the altar may have stood for all the cities under the herem'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Mount Ebal is a considerable distance north of Ai. However, as it is approximately equidistant from Hazor and Debir … the altar on Mount Ebal may have been set up as a cult installation for all the cities consigned to the ḥērem.'
  - where: note 8:30 “Why an altar on Ebal now”
    claim: 'Joshua 8:31 paraphrases Deuteronomy 27:5'
    key: ot-minute-josh-8
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-8'
    quote: 'as the text explicitly paraphrases Deuteronomy 27:5 at Joshua 8:31 in its description of the altar built at the site.'
  - where: note 8:33 “The stranger, the women and the little ones”
    claim: 'One older commentary points from “as well the stranger” to Deuteronomy 31:12'
    key: cambridge-joshua
    url: 'https://biblehub.com/commentaries/cambridge/joshua/8.htm'
    quote: '33. as well the stranger] See Deuteronomy 31:12.'
  - where: note 8:33 “The stranger, the women and the little ones”
    claim: 'One older reading: the stranger as well as the native means without any exception'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/8.htm'
    quote: 'stood on both sides of the ark before the Levitical priests, the stranger as well as the native, i.e., without any exception'
  - where: note 8:33 “The stranger, the women and the little ones”
    claim: '“All Israel” means not only representatives or men but the whole congregation with women, little ones and strangers'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/8.htm'
    quote: 'the expression "all Israel," in v. 33, is more fully explained as signifying not merely the congregation in its representatives, or even the men of the nation, but "all the congregation of Israel, with the women, and the little ones, and the strangers'
  - where: note 8:33 “The stranger, the women and the little ones”
    claim: 'Deuteronomy 31:12 commands gathering men, women, children and the stranger to hear the law'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/31?lang=eng'
    quote: 'Gather the people together, men, and women, and children, and thy stranger that is within thy gates, that they may hear, and that they may learn, and fear the LORD your God'
  - where: christ
    claim: 'Covenant-renewal assemblies typically follow periods of apostasy or times of crisis'
    key: seely-covenant-renewal
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal'
    quote: 'These are the accounts of the periodic covenant-renewal assemblies and ceremonies, when the covenant children—typically following periods of apostasy, or at times of crisis or transition—are assembled by their leader to publicly rededicate themselves'
  - where: christ
    claim: 'The Doctrine and Covenants provides for the covenant''s periodic renewal through the sacrament'
    key: seely-covenant-renewal
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal'
    quote: 'The Doctrine and Covenants also provides specific instructions for the actual Covenant Oath Ceremonies … as well as instructions for its periodic renewal through the sacrament.'
