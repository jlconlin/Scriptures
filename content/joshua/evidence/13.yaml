chapter: 13
claims:
  - where: 'setting'
    claim: 'Chapter 13 begins the second major section of the book, the allotment of the land'
    key: ot-minute-josh-13
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-13'
    quote: 'Joshua 13 begins the second major section of the eponymous book, which extends to the book’s close. This portion of the text describes the allotment of land to the various tribes of Israel'
  - where: 'setting'
    claim: 'Verses 8–33 describe the land east of the Jordan already conquered and divided among the two and a half tribes'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/13.htm'
    quote: 'to this there is appended a description of the land on the east of the Jordan which had already been conquered and divided among the two tribes and a half (Joshua 13:8-33)'
  - where: 'thread'
    claim: 'The eastern allotments are a flashback to Moses'' conquests'
    key: ot-minute-josh-13
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-13'
    quote: 'This section acts, in effect, as a sort of flashback to the territories conquered by Moses while Israel wandered in the wilderness.'
  - where: 'thread'
    claim: 'Levi received no land but was attached to the tabernacle as its ritual custodians'
    key: ot-minute-josh-13
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-13'
    quote: 'verse 14 states that the tribe of Levi received no land inheritance but instead was attached to the portable tabernacle as its ritual custodians (compare Leviticus 7:29–36)'
  - where: 'thread'
    claim: 'Joshua 18:7 calls the priesthood the Levites'' inheritance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/18?lang=eng'
    quote: 'But the Levites have no part among you; for the priesthood of the Lord is their inheritance'
  - where: 'section 3 plain'
    claim: '“coast” means border; “dukes” means vassal princes (the Church''s footnotes)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/13?lang=eng'
    quote: '16a “coast”: OR border (also vv. 25, 30). … 21b “dukes”: OR vassal princes.'
  - where: 'note 13:1 “The whole land, and very much land remaining”'
    claim: 'Some territory stayed under Canaanite control, which complicates the idealized portrayal; the Philistine coast and Geshur reportedly came under Israel only under David'
    key: ot-minute-josh-13
    url: 'https://scripturecentral.org/archive/books/book-chapter/joshua-13'
    quote: 'These portions of Canaan would reportedly only come under Israelite control during the rule of King David (see 2 Samuel 3:1–3; 8:1–2). That some territory remained under Canaanite control … seems to contradict or at least complicate the idealized portrayal of the conquest by the narrator (compare Joshua 13:13).'
  - where: 'note 13:1 “The whole land, and very much land remaining”'
    claim: 'The conquest did not happen overnight; Judges 1 describes it continuing slowly'
    key: sc-knowhy-852
    url: 'https://scripturecentral.org/knowhy/why-was-the-conquest-of-jericho-more-important-than-what-some-in-israel-may-have-realized'
    quote: 'The conquest of Canaan did not happen overnight, or even over the course of a few months, as one might think if one only read the first half of Joshua. … the conquest continued slowly over time, something also described in Judges 1.'
  - where: 'note 13:1 “The whole land, and very much land remaining”'
    claim: 'The campaigns won the hill country and Transjordan and destroyed the major powers'
    key: brandt-conquest
    url: 'https://www.churchofjesuschrist.org/study/ensign/1973/10/the-conquest-of-canaan?lang=eng'
    quote: 'The conquests of Israel were successful in obtaining the main hill regions and the Trans-Jordan areas for the tribes. The major military powers had also been destroyed, removing the threat of expulsion from the land.'
  - where: 'note 13:1 “The whole land, and very much land remaining”'
    claim: 'The conquest took many years and was never completed on the Lord''s terms'
    key: brandt-conquest
    url: 'https://www.churchofjesuschrist.org/study/ensign/1973/10/the-conquest-of-canaan?lang=eng'
    quote: 'The record preserves only summary accounts of the major campaigns of the Israelites; however, the conquest extended over many years and was never fully completed on the terms the Lord had originally specified.'
  - where: 'note 13:1 “The whole land, and very much land remaining”'
    claim: 'Joshua 11:23 and the later chapters (15:63; 16:10; 17:12) as quoted and cited'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/11?lang=eng'
    quote: 'So Joshua took the whole land, according to all that the Lord said unto Moses'
  - where: 'note 13:3 “The five lords of the Philistines”'
    claim: 'The Philistines came from Caphtor, held the coastal lowland, five cities each with its lord; power at height at Saul''s death, declining under David'
    key: bd-philistines
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/philistines?lang=eng'
    quote: 'A tribe that originally came from Caphtor (Crete, or perhaps part of Egypt) (Amos 9:7) and occupied … the rich lowland on the Mediterranean coast from Joppa to the Egyptian desert. They formed a confederation of five chief cities, namely, Ashdod, Gaza, Ashkelon, Gath, and Ekron, each governed by its “lord.”'
  - where: 'note 13:3 “The five lords of the Philistines”'
    claim: 'Philistine power at its height at Saul''s death, declining under David'
    key: bd-philistines
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/philistines?lang=eng'
    quote: 'Philistine power being at its height at the time of Saul’s death but rapidly declining during the reign of David.'
  - where: 'note 13:6 “Dividing land not yet taken”'
    claim: 'Joshua divided the whole land, conquered or not, by God''s command (one older reading)'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/13.htm'
    quote: 'the false assumption, that the only towns which Joshua distributed by lot among the tribes of Israel were those which he permanently conquered, whereas, according to the command of God, he divided the whole land among the Israelites, whether it was conquered or not'
  - where: 'note 13:6 “Dividing land not yet taken”'
    claim: 'The LORD promised to drive out the Canaanites from the unconquered portions'
    key: keil-joshua
    url: 'https://biblehub.com/commentaries/kad/joshua/13.htm'
    quote: 'promised him at the same time that He would drive out the Canaanites from those portions of the land that were not yet conquered (Joshua 13:6)'
  - where: 'note 13:6 “Dividing land not yet taken”'
    claim: 'The Philistines and Sidonians of Josh. 13:2–6 had not been removed (Judg. 3:1–4)'
    key: brandt-conquest
    url: 'https://www.churchofjesuschrist.org/study/ensign/1973/10/the-conquest-of-canaan?lang=eng'
    quote: 'Some primary groups had not been destroyed or removed from the borders of the inheritances of the tribes of Israel (i.e., Philistines and Sidionians or Phoenicians, Josh. 11:23; Josh. 13:2–6; Judg. 3:1–4).'
  - where: 'note 13:6 “Dividing land not yet taken”'
    claim: 'Judges 3:1–4: the nations left to prove Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/3?lang=eng'
    quote: 'Now these are the nations which the Lord left, to prove Israel by them … Namely, five lords of the Philistines, and all the Canaanites, and the Sidonians, and the Hivites that dwelt in mount Lebanon'
  - where: 'christ'
    claim: 'Joshua 23:14: not one thing has failed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/23?lang=eng'
    quote: 'not one thing hath failed of all the good things which the Lord your God spake concerning you'
