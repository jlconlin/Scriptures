summary: >-
  Joshua is the book of a promise kept: Israel crosses the Jordan on dry ground, receives the
  land the Lord swore to give, and at the end chooses whom to serve. At its quiet center are memorial stones, set up so that children who ask "What mean ye by these stones?" are told
  that the Lord brought His people through. It points to Jehovah, who goes before His people and fights for them, and whose name is part of Joshua's own.
motifs:
  - "Primary: a cairn of twelve rough, unhewn river stones of different sizes, stacked in one low heap on the grassy near bank of the Jordan (Josh. 4:3, 20–22)."
  - "Supporting: the Jordan flowing again, full to its banks, running across the picture just behind the cairn (Josh. 4:18)."
  - "Supporting: on a green hill at the right, one single large upright stone set beneath one old spreading oak (Josh. 24:26–27)."
composition: >-
  A wide, calm landscape in late light, seen from the grassy near bank of the Jordan. The
  cairn of twelve stones sits in the foreground, left of center, and is the clearest and most
  strongly lit shape in the picture. Just behind it the river runs from left to right across
  the whole picture, full and moving, its ripples catching the sun, with willows and reeds
  along the far bank. Beyond, soft green and olive hills; at the right, on a green hill in the
  middle distance, one great upright stone stands under one old oak, small but readable
  against the sky. Low warm sun from the right; the stones' tops catch gold. Open sky shading
  from blue to gold. No figures, buildings, walls, ark, fire, smoke, animals or weapons.
key:
  - '**The pile of twelve stones** is the memorial Israel took out of the Jordan: “those twelve stones, which they took out of Jordan, did Joshua pitch in Gilgal” ([[Josh. 4:20]]). They were set up “that when your children ask their fathers in time to come, saying, What mean ye by these stones?” they could be told, “Israel came over this Jordan on dry land” ([[Josh. 4:6]]; [[Josh. 4:22]]).'
  - '**The river flowing behind them** is the Jordan after the crossing, when “the waters of Jordan returned unto their place, and flowed over all his banks, as they did before” ([[Josh. 4:18]]). The stones stand where the miracle no longer shows.'
  - '**The great stone under the oak** on the hill is the witness of the covenant at Shechem: Joshua “took a great stone, and set it up there under an oak,” and said, “this stone shall be a witness unto us; for it hath heard all the words of the LORD” ([[Josh. 24:26–27]]).'
