chapter: 12
title: All the Kings Thirty and One
tagline: The conquest closes with a roll of the defeated kings, Moses' two east of the Jordan and Joshua's thirty-one on the west.
when: 'After the wars, when "the land rested from war," before it is divided'

setting: |
  Joshua 12 ends the first half of the book, the conquest of Canaan in chapters 1–12; the allotment of the land begins in chapter 13. Chapter 11 closed the wars with a summary: “So Joshua took the whole land, according to all that the LORD said unto Moses … And the land rested from war” ([[Josh. 11:23]]). This chapter adds the record that goes with such a summary, a list of the kings Israel had defeated (see the note at verse 1).

  The list has two parts. Verses 1–6 name the two kings defeated under Moses east of the Jordan, Sihon and Og, whose land Moses gave to Reuben, Gad and half of Manasseh (see [[Num. 32:33]]). Verses 7–24 count the kings Joshua defeated west of the river, thirty-one of them. So the chapter “summarizes the kings defeated by not just Joshua but also his predecessor, Moses.”

  The next chapter opens on the other half of the story: Joshua is old, “and there remaineth yet very much land to be possessed” ([[Josh. 13:1]]). How the book's two pictures of the land fit together is taken up in that note.

thread: |
  The chapter is a count, and the count is the LORD's. Its form is a royal list of kings and their lands, the kind of record ancient kings made of their wars (see the note at verse 1), but the narrative before it had already said where the victories came from: Joshua took these kings and their land “because the LORD God of Israel fought for Israel” ([[Josh. 10:42]]).

  The two halves are built alike. Moses and the children of Israel smote the eastern kings, and Moses “gave it for a possession” (verse 6); Joshua and the children of Israel smote the western kings, and Joshua “gave unto the tribes of Israel for a possession” (verse 7). The western bounds of verse 7, from Baal-gad to “the mount Halak, that goeth up to Seir,” are the bounds of [[Josh. 11:17]]. Then the kings are counted one by one, Jericho and Ai first, as the story told them, down to “all the kings thirty and one” (verse 24). With that the book turns from taking the land to dividing it.

sections:
  - range: 1-6
    heading: The kings east of the Jordan
    plain: |
      These are the kings of the land that the Israelites defeated and whose land they took, east of the Jordan, from the Arnon gorge to Mount Hermon, with all the eastern side of the Jordan valley. Sihon king of the Amorites lived in Heshbon. He ruled from Aroer on the edge of the Arnon gorge, from the middle of the gorge, and over half of Gilead as far as the Jabbok River, the border of the Ammonites. He also ruled the eastern Jordan valley from the Sea of Galilee to the Salt Sea (the Dead Sea), toward Beth-jeshimoth, and southward below the slopes of Pisgah. Then there was the territory of Og king of Bashan, one of the last of the giants, who lived at Ashtaroth and Edrei. He ruled Mount Hermon, Salcah and all Bashan, as far as the border of the Geshurites and the Maachathites, and half of Gilead, up to the border of Sihon king of Heshbon. Moses the servant of the LORD and the Israelites defeated them, and Moses gave their land as a possession to the Reubenites, the Gadites and half the tribe of Manasseh.
  - range: 7-8
    heading: The country west of the Jordan
    plain: |
      These are the kings of the country west of the Jordan whom Joshua and the Israelites defeated, from Baal-gad in the valley of Lebanon to Mount Halak, which rises toward Seir. Joshua gave this land to the tribes of Israel as their possession, by their divisions: the hill country, the lowlands, the Jordan valley, the springs, the wilderness and the south country, the land of the Hittites, Amorites, Canaanites, Perizzites, Hivites and Jebusites.
  - range: 9-24
    heading: Thirty-one kings
    plain: |
      The king of Jericho; the king of Ai, near Bethel; the king of Jerusalem; the king of Hebron; the king of Jarmuth; the king of Lachish; the king of Eglon; the king of Gezer; the king of Debir; the king of Geder; the king of Hormah; the king of Arad; the king of Libnah; the king of Adullam; the king of Makkedah; the king of Bethel; the king of Tappuah; the king of Hepher; the king of Aphek; the king of Lasharon; the king of Madon; the king of Hazor; the king of Shimron-meron; the king of Achshaph; the king of Taanach; the king of Megiddo; the king of Kedesh; the king of Jokneam in Carmel; the king of Dor on the coast of Dor; the king of the nations at Gilgal; the king of Tirzah. Each is counted as one: thirty-one kings in all.

notes:
  - ref: 1
    phrase: Now these are the kings of the land, which the children of Israel smote
    kind: history
    title: A roll of the conquered kings
    body: |
      The chapter is a summary roll of the conquest, the kind of record kings of the ancient Near East kept of their wars. The Bible Dictionary counts it as the close of the conquest narrative, which “concludes with a general statement of the results of the conquest and a list of conquered cities.” Lists like it were common: “Egyptian and Mesopotamian monarchs likewise recorded their military victories in the form of long lists of conquered lands and cities on royal monuments as a way to either legitimate their reign or glorify the gods (or both).”

      The same reading takes Joshua's list to do both: to lay claim to the land as Israel's, and “to glorify the Lord as Israel’s divine warrior.” The narrative the list sums up has already given the victory to the LORD ([[Josh. 10:42]]).
    sources: [bd-joshua-book, ot-minute-josh-12, lds-scriptures]

  - ref: 6
    phrase: Them did Moses the servant of the LORD and the children of Israel smite
    kind: scripture
    title: Moses' kings and Joshua's in one list
    body: |
      The list begins with Moses' victories, so that the land on both sides of the Jordan is counted as one gift. Sihon and Og were defeated before Moses died, and their land was already settled by two and a half tribes (who they were, and how the wars began, is told at [[Ps. 135:11]]). By naming them first the chapter “expands the scope of Israel’s conquests into the land east of the Jordan River.”

      The text sets the two leaders side by side in matching sentences: Moses “gave it for a possession unto the Reubenites, and the Gadites, and the half tribe of Manasseh” (verse 6); Joshua “gave unto the tribes of Israel for a possession according to their divisions” (verse 7). Psalm 135 likewise names the eastern and western kings together: the LORD slew “Sihon king of the Amorites, and Og king of Bashan, and all the kingdoms of Canaan: and gave their land for an heritage, an heritage unto Israel his people” ([[Ps. 135:11–12]]).
    sources: [ot-minute-josh-12, lds-scriptures]

  - ref: 23
    phrase: the king of the nations of Gilgal
    kind: words
    title: Which Gilgal, and what nations
    body: |
      This Gilgal is not Israel's camp by the Jordan ([[Josh. 4:19]]) on the reading of two older commentaries, which place it far to the west, though not at the same spot: one at the modern Jiljilieh, west of Ebal and Gerizim, “in the plain along the Mediterranean”; the other, “in all probability,” near Antipatris, at the village of Jiljule. Since the two disagree on the site, the identification is uncertain.

      “Nations” is the Hebrew *gôyim*. One older reading takes it as a proper name, the king “of the Goyim,” as with Tidal “king of nations” at [[Gen. 14:1]]. The Septuagint read the place differently, as “the king of Gei of Galilee.”
    sources: [cambridge-joshua, keil-joshua, oshb-wlc, lxx-rahlfs, lds-scriptures]

  - ref: 24
    phrase: all the kings thirty and one
    kind: history
    title: More kings than the story told
    body: |
      The count of thirty-one includes kings the narrative never names. Chapters 6–11 tell of Jericho, Ai, the five kings of the south, and the northern league under Hazor, and they say only in general that Joshua smote the rest: “all their kings: he left none remaining” ([[Josh. 10:40]]); “all their kings he took, and smote them” ([[Josh. 11:17]]). Here those kings are counted one by one.

      The difference has been read as a clue to how the book was made. The list “greatly expands the number of conquered cities or kings that was described in the narrative,” which on this reading suggests that the book's compiler “had at his disposal more sources for the conquest than what made it into the final version of the story.” On that reading the stories in chapters 6–11 were chosen for what they teach, “and much of the history of the underlying events of the conquest remains unknown.”

      The chapter that follows begins with the LORD telling Joshua that “there remaineth yet very much land to be possessed”; the two pictures are set side by side at [[Josh. 13:1]].
    sources: [ot-minute-josh-12, lds-scriptures]

christ: |
  The kings in this list fell, the narrative says, “because the LORD God of Israel fought for Israel” ([[Josh. 10:42]]), and the LORD who fought is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]). Psalm 136 remembers the same victories, Sihon’s and Og’s among them ([[Ps. 136:19–20]]), as worship, a line for each deed of His and the same answer after every line: “To him which smote great kings: for his mercy endureth for ever … And gave their land for an heritage: for his mercy endureth for ever” ([[Ps. 136:17]], [[Ps. 136:21]]).

  A disciple's record of what the Lord has done is a list of the same kind. Counted one by one, His kept promises become a witness that “there failed not ought of any good thing which the LORD had spoken” ([[Josh. 21:45]]), and the reason for each is His mercy.

explore: |
  - [[Num. 21:21–35]] and [[Deut. 2:24–3:11]]: the wars with Sihon and Og that verses 1–6 sum up.
  - [[Josh. 10]] and [[Josh. 11]]: the campaigns behind most of the names in verses 9–24.
  - [[Ps. 135]] and [[Ps. 136]]: the same victories remembered as praise.
  - [[Josh. 13:1–6]]: what was still to be possessed when the list was made.

