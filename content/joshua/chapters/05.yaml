chapter: 5
title: The Reproach of Egypt Rolled Away
tagline: Across the Jordan, before a single battle, the new generation is circumcised, keeps the Passover and eats the grain of the land; the manna stops, and a man with a drawn sword meets Joshua by Jericho.
when: 'At Gilgal, in the first month, after the crossing of the Jordan'

setting: |
  Israel has crossed the Jordan and camped at Gilgal, “in the east border of Jericho” ([[Josh. 4:19]], where the camp is explained). The kings west of the river have heard of the crossing, and their courage is gone (verse 1).

  Nothing in the chapter is a battle. Gilgal was “the site where the children of Israel participated in three important ritual or covenant ceremonies before commencing the conquest of Canaan”: circumcision (verses 2–9), the Passover (verse 10), and eating the produce of the land (verses 11–12). Only then does Joshua go out toward Jericho and meet the captain of the LORD's host (verses 13–15).

  The chapter sits on a seam of the book. One reading of Joshua's plan divides “the crossing of the Jordan [1:1–5:12]” from “the conquest [5:13–12:24],” so the last three verses open the war that chapter 6 begins. When they end, “The stage was set for the conquest to commence. Israel was prepared for war, and Joshua had his divine commission as Moses’s successor.”

thread: |
  The chapter puts covenant before conquest. The enemy is terrified (verse 1), yet before any battle the LORD has the fighting men circumcised and laid up in camp “till they were whole” (verse 8). The generation that died in the wilderness had not given their sons the sign of Abraham's covenant, and the rite at Gilgal renews it in a new generation (see the notes on verses 2 and 5). The LORD names what it means: “This day have I rolled away the reproach of Egypt from off you” (verse 9).

  The covenant people then keep the Passover, the feast of the night they left Egypt, now in the land itself, and eat its grain; the manna that fed them for forty years stops the next day (verse 12; see [[Ex. 16:35]]). The wilderness is over.

  Only then does the war begin, and it begins with a man holding a drawn sword who answers Joshua's “Art thou for us?” with “Nay” and names himself “captain of the host of the LORD” (verses 13–15). The encounter “likely reminded Joshua and the Israelites that the Lord would fight for Israel.” Joshua takes off his shoe as Moses did, and on that holy ground he receives his orders for Jericho (6:2–5).

sections:
  - range: 1-1
    heading: Their heart melted
    plain: |
      When all the Amorite kings on the west side of the Jordan and all the Canaanite kings along the sea heard that the LORD had dried up the Jordan in front of the children of Israel until we had crossed, their courage melted away, and they had no spirit left to face Israel.
  - range: 2-9
    heading: Circumcise again the children of Israel
    plain: |
      At that time the LORD told Joshua, “Make sharp knives and circumcise the children of Israel again, a second time.” Joshua made the knives and circumcised them at the hill of the foreskins.

      This is why: all the males who came out of Egypt, all the men of war, had died in the wilderness on the way. Those who came out had all been circumcised, but none of those born in the wilderness along the way had been. Israel walked forty years in the wilderness until all the fighting men who left Egypt were gone, because they did not obey the LORD; He swore that they would not see the land He had sworn to their fathers to give us, a land flowing with milk and honey. Their children, whom He raised up in their place, Joshua circumcised, for they had not been circumcised on the way. When it was done, the whole people stayed where they were in the camp until they had healed. Then the LORD said to Joshua, “Today I have rolled away the reproach of Egypt from you.” So the place is called Gilgal to this day.
  - range: 10-12
    heading: The manna ceased
    plain: |
      Camped at Gilgal on the plains of Jericho, the children of Israel kept the Passover on the evening of the fourteenth day of the month. The day after the Passover they ate food grown in the land, unleavened cakes and roasted grain, that same day. The manna stopped the day after they ate the grain of the land; Israel never had manna again, and that year they ate the produce of Canaan.
  - range: 13-15
    heading: Captain of the host of the LORD
    plain: |
      When Joshua was near Jericho, he looked up and saw a man standing in front of him with a drawn sword in his hand. Joshua went to him and asked, “Are you for us, or for our enemies?” He answered, “No; I have come now as captain of the LORD's army.” Joshua fell face down on the ground and worshipped, and said, “What does my lord say to his servant?” The captain of the LORD's army said, “Take your sandal off your foot, for the place where you are standing is holy.” And Joshua did.

notes:
  - ref: 1
    phrase: until we were passed over
    kind: words
    title: Until we were passed over
    body: |
      The sudden “we” is in the Hebrew as it is written, and the Hebrew text itself offers a correction. The written form (the *ketiv*) has until *we* passed over; the form supplied to be read in its place (the *qere*) has until *they* passed over. The Greek translation has the third person, “when they passed over,” and so do other ancient versions and some Hebrew manuscripts.

      The King James translators kept the written “we.” Either way the sense of the verse is the same: the kings' hearts melted at the news of the crossing, as Rahab had said theirs already had (see [[Josh. 2:11]]).
    sources: [oshb-wlc, lxx-rahlfs]

  - ref: 2
    phrase: circumcise again the children of Israel the second time
    kind: history
    title: The second time
    body: |
      “The second time” does not mean that any man was circumcised twice; it means the people as a whole were circumcised a second time. Verse 7 makes plain that this “is a first circumcision of those born in the wilderness.” What is repeated is a whole people receiving the sign together: “It seems that this second circumcision is the second time God’s chosen people had been circumcised as a group, the first being when the rite was instituted with Abraham and his family” ([[Gen. 17:11]] explains the sign itself). One Latter-day Saint reading calls it “an example of collective rededication.”

      Circumcision was “the sign of the covenant God made with Abraham,” and the rite at Gilgal “was meant to renew that covenant and demarcate a new, faithful generation” about to undertake the conquest. Set beside [[Gen. 34]], where the men of Shechem were attacked while sore from circumcision, the outcome is reversed: at Gilgal “the text implies that they will prosper militarily because of their faithfulness in keeping the commandment.”
    sources: [wessel-circumcision, ot-minute-josh-5]

  - ref: 5
    phrase: them they had not circumcised
    kind: history
    title: Why the wilderness generation went uncircumcised
    body: |
      The text says that the sons born in the wilderness were not circumcised, and it does not say why: “Ultimately the scriptures do not state directly why the practice was discontinued.” Verse 6 sets the fact beside the judgment on their fathers, who died “because they obeyed not the voice of the LORD.”

      The explanation most often given follows that judgment: there is “some consensus” that circumcision “was temporarily discontinued as a mark of divine disfavor precipitated by their disbelief in God’s promise that they could oust the inhabitants of the promised land” (see [[Num. 14:26–35]]). Others suggest it was not needed in the desert, with no other nation to be distinguished from, or that it would have been hard on a people always on the move. Another reading makes it a lapse in the covenant itself: Israel “were not faithful in their covenant with God,” so it is “not surprising” they “failed to continue the practice of circumcision, which was the symbol of their covenant.” Once they stood “onto the sacred ground that had been denied their fathers, the Lord required them to reinstitute the physical token of the covenant.”
    sources: [wessel-circumcision, ot-manual-josh]

  - ref: 9
    phrase: This day have I rolled away the reproach of Egypt from off you
    kind: words
    title: The reproach rolled away
    body: |
      The LORD's words make a pun on the camp's name: He has “rolled away” (*gallôtî*, from *gālal*, “roll, roll away”) the reproach, at Gilgal. The verb is the one used for rolling a stone from the mouth of a well ([[Gen. 29:3]]), here used figuratively of “reproach from upon the people.” “Gilgal” “etymologically seems to be related to the word for wheel or circle.” Explaining a place name from an event, as the narrator does with “unto this day,” is “a feature called etiology, common in ancient storytelling” (on Gilgal and its later history see [[Josh. 4:19]]).

      What was “the reproach of Egypt”? The text does not say, and the older commentaries differ. One allows either the shame that clung to Israel “all the way from Egypt, where the nation had been a people of slaves,” or the taunts of the Egyptians themselves; another sets the first aside and takes only the taunts. That reading points to the very words Moses feared Egypt would say: that the LORD brought Israel out “to slay them in the mountains” ([[Ex. 32:12]]; [[Num. 14:13–16]]; [[Deut. 9:28]]). That reproach “rested upon Israel as long as it was condemned to wander restlessly about and to die in the wilderness,” and the circumcision lifted it as “a pledge that the Lord would now give them the land of Canaan for their inheritance.”

      The “you” is plural in the Hebrew. “It seems that at Gilgal, God not only reaccepted the persons, he reaccepted the people.”
    sources: [ot-minute-josh-5, bdb, cambridge-joshua, keil-joshua, wessel-circumcision]

  - ref: 10
    phrase: kept the passover on the fourteenth day of the month
    kind: history
    title: The Passover in the land
    body: |
      The first thing the newly circumcised people do is keep the Passover, on its appointed day. The last Passover the text records was kept at Sinai in the second year ([[Num. 9:1–5]]). One older reading draws the link with verse 9: only “When the whole nation had been received again into covenant with the Lord by circumcision, they kept the passover, which had no doubt been suspended from the time that they left Sinai.”

      The feast remembered the night of the tenth plague and the flight from Egypt ([[Ex. 12]]). Kept now on the plains of Jericho, it is “a sort of narrative inverse”: this Passover too “is also connected with death (this time of the Canaanites) and Israel’s entry into the land of promise.” And it is Joshua who presides, which “once again signifies his status as a Moses-like figure.”

      The next day they eat the grain of the land, and the day after that the manna stops for good, as Exodus had said it would when Israel “came to a land inhabited” ([[Ex. 16:35]]; that verse's note says what the ending meant).
    sources: [lds-scriptures, keil-joshua, ot-minute-josh-5]

  - ref: 14
    phrase: Nay; but as captain of the host of the LORD am I now come
    kind: christ
    title: The captain of the host of the LORD
    body: |
      Joshua asks whose side the armed man is on, and the answer begins “Nay” and gives instead who he is: the captain of the LORD's army. Like Balaam ([[Num. 22:23]], [[Num. 22:31]]) and later David ([[1 Chr. 21:16]]), Joshua sees a man with a drawn sword whom he does not at first recognize. The Greek translation has instead “And he said to him,” without the “Nay.”

      The title “captain of the host” is made of the same two Hebrew words that Daniel's vision gives to “the prince of the host” ([[Dan. 8:11]]); on the host of heaven and the angel who camps like an army, see [[Ps. 34:7]]. “Hosts” itself means armies, and the phrase is used “in connection with Jehovah being a man of war who fights for his people,” with this verse among the examples; the Savior still calls Himself “the Lord of Sabaoth” ([[D&C 87:7]]).

      Who the captain is the text does not say outright. Joshua falls on his face and worships, “since he now recognized that he was in the presence of deity,” and when the captain's message resumes after the aside of 6:1 it is the LORD who speaks: “See, I have given into thine hand Jericho” ([[Josh. 6:2]]). The Church's newest reading is that he may have been “a heavenly being, possibly Jehovah Himself.”
    sources: [ot-minute-josh-5, lxx-rahlfs, oshb-wlc, muhlestein-savior-sword, scripture-helps-josh]

  - ref: 15
    phrase: Loose thy shoe from off thy foot
    kind: scripture
    title: Joshua at his own burning bush
    body: |
      The captain's first command is the LORD's first command to Moses at the bush ([[Ex. 3:5]]; that verse's note says what the gesture meant), and with it “Joshua now stood in sacred space.” Removing the shoes is a symbolic action, done not for “an immediate practical purpose” but for its “symbolic meaning.”

      The echo shows a promise kept. At the Jordan the LORD said He would magnify Joshua “that they may know that, as I was with Moses, so I will be with thee” ([[Josh. 3:7]]), and the book's parallels between the two men make it “a record of God keeping His promise to be with His prophet and people”: Joshua, “like Moses before him,” takes off his shoe and “did so.” When the scene ends he has “his divine commission as Moses’s successor.”
    sources: [ot-minute-josh-5, parry-symbolic-action, esplin-as-with-moses, lds-scriptures]

christ: |
  The captain who meets Joshua may have been Jehovah Himself (see the note on verse 14), and the LORD of the Old Testament is the premortal Christ (see [[Ex. 3:14]]). In one Latter-day Saint reading of types, Israel crossed the Jordan behind Joshua, whose name is the name Jesus (see [[Num. 13:16]]), and behind the ark, and having “followed Jesus (seen in the types of Joshua and the ark of the covenant) into the promised land, they were once again the true covenant people,” so the token of the covenant was given again at Gilgal.

  The same Lord of hosts fights for His people now: one Latter-day Saint reading of the divine warrior hears in the title the assurance “that the Lord will conquer our great oppressors of death and hell,” the “awful monster” from which God “prepareth a way for our escape” ([[2 Ne. 9:10]]). A covenant is renewed by a people together as well as by each person, and at Gilgal it was renewed before the first battle was fought.

explore: |
  - [[Ex. 3:1–6]]: Moses at the bush, the scene Joshua's meeting repeats.
  - [[Num. 14:26–35]]: the sentence on the generation that died in the wilderness, behind verses 4–7.
  - [[Gen. 17:9–14]]: circumcision as the token of Abraham's covenant.
  - [[Num. 22:22–35]] and [[1 Chr. 21:16]]: two other figures with a drawn sword.
  - [[Josh. 6:1–5]]: what the captain of the LORD's host came to say.

