chapter: 14
title: Give Me This Mountain
tagline: The land west of the Jordan begins to be divided by lot, and the first to receive his portion is Caleb, eighty-five years old, who asks for the hill country of the Anakims.
when: 'At Gilgal, as the land is divided, forty-five years after the spies were sent from Kadesh-barnea'

setting: |
  Chapter 13 described the land east of the Jordan that Moses had already given to two and a half tribes. Chapter 14 “shifts focus to the western allotments,” which are “detailed on through chapter 19.” Verses 1–5 are the introduction to that whole division “among the nine and a half remaining tribes”: who divided the land, how, and why the count of tribes still comes to twelve.

  Then the story begins with Judah, and with one man. Caleb son of Jephunneh had been Judah's spy at Kadesh-barnea, where he and Joshua “alone brought back a true report” (the story is told at [[Num. 13:30]]). They alone of the people who left Egypt lived through the forty years. Caleb had also been named to help divide the land ([[Num. 34:19]]). Now he comes to Joshua at Gilgal, the camp by the Jordan ([[Josh. 4:19]]), and claims what he was promised. Judah's allotment, “claimed by Caleb,” runs on into the next chapter, where he takes Hebron ([[Josh. 15:13–14]]).

  Hebron and its older name, Kirjath-arba, are explained at [[Gen. 23:2]]; the Anakims at [[Deut. 1:28]]; the lot at [[Num. 26:55]].

thread: |
  The chapter is about promises carried out. The division is done as the LORD had said: “As the LORD commanded Moses, so the children of Israel did, and they divided the land” (verse 5). Caleb's claim also rests on what the LORD said: “the thing that the LORD said unto Moses … concerning me and thee” (verse 6). Three times the chapter gives the reason for that promise: Caleb “wholly followed the LORD” (verses 8, 9, 14). The proof that the LORD keeps His word is Caleb himself: “The LORD hath kept me alive, as he said” (verse 10), and as strong at eighty-five as at forty (verse 11).

  So the first portion of the land west of the Jordan goes to the man who had believed it could be taken when ten others said it could not, and it is the very place they feared: “this mountain … how the Anakims were there” (verse 12). The chapter closes with the words that closed the wars, “And the land had rest from war” (verse 15; [[Josh. 11:23]]), a formula repeated here as “a point of transition” to the peaceful division that follows.

sections:
  - range: 1-5
    heading: The division by lot
    plain: |
      These are the territories the Israelites received as their inheritance in the land of Canaan, which Eleazar the priest, Joshua son of Nun, and the heads of the tribal families divided among them. Their inheritance was assigned by lot, as the LORD had commanded through Moses, for the nine and a half tribes. Moses had already given two and a half tribes their inheritance east of the Jordan, and to the Levites he gave no inheritance among them. The descendants of Joseph were two tribes, Manasseh and Ephraim. The Levites received no share of the land, only towns to live in, with their pasturelands for their cattle and their goods. The Israelites did as the LORD had commanded Moses, and they divided the land.
  - range: 6-12
    heading: Caleb's claim
    plain: |
      Then men of Judah came to Joshua at Gilgal, and Caleb son of Jephunneh the Kenezite said to him: You know what the LORD said to Moses the man of God about you and me at Kadesh-barnea. I was forty years old when Moses the servant of the LORD sent me from Kadesh-barnea to explore the land, and I brought back an honest report, as I believed it. My companions who went up with me made the people lose heart, but I followed the LORD my God completely. That day Moses swore to me, “The land you have walked on will be your inheritance and your children's forever, because you have followed the LORD my God completely.” Now look: the LORD has kept me alive, as He promised, these forty-five years since He said this to Moses, while Israel wandered in the wilderness. Here I am today, eighty-five years old. I am still as strong as I was the day Moses sent me; I have the same strength now for war and for going out and coming in. So give me this hill country that the LORD spoke of that day. You heard then that the Anakims live there, in large fortified cities. Perhaps the LORD will be with me, and I will drive them out, as the LORD said.
  - range: 13-15
    heading: Hebron for Caleb
    plain: |
      Joshua blessed him and gave Hebron to Caleb son of Jephunneh as his inheritance. So Hebron has belonged to Caleb son of Jephunneh the Kenezite to this day, because he followed the LORD God of Israel completely. Hebron used to be called Kirjath-arba, after Arba, a great man among the Anakims. And the land had rest from war.

notes:
  - ref: 2
    phrase: By lot was their inheritance, as the LORD commanded by the hand of Moses
    kind: history
    title: By lot, as the LORD commanded
    body: |
      The lot made the division the LORD's rather than a matter of human choice. Casting lots under Eleazar the priest (verse 1) stressed “the divinely ordered manner of distribution”: casting lots was a practice “anciently … believed to be a means of determining God’s will,” though today it is usually thought of as random. Moses had been told to divide the land this way (see the note at [[Num. 26:55]], which explains how the lot and the size of a tribe worked together).
    sources: [ot-minute-josh-14, lds-scriptures]

  - ref: 4
    phrase: For the children of Joseph were two tribes, Manasseh and Ephraim
    kind: history
    title: Twelve tribes without Levi
    body: |
      Verses 3–4 explain how nine and a half tribes remain west of the Jordan when Levi receives no land. Two and a half tribes already had their land east of the Jordan, and Levi had none. But Jacob had adopted Joseph's two sons as his own (“Ephraim and Manasseh … are mine; as Reuben and Simeon, they shall be mine,” [[Gen. 48:5]]), so Joseph counts as two tribes, and nine and a half remain to receive land west of the river.

      The Levites' “suburbs” are the pasture land around their towns (explained at [[Num. 35:2]]); why Levi's inheritance is the LORD is told at [[Num. 18:20]], and the Levites' cities are given in [[Josh. 21]].

      The theme page [“No Part in the LORD”](/joshua/themes/no-part-in-the-lord/) follows the Levites' “no part” in the land to the eastern tribes' fear of “no part in the LORD” (22:25).
    sources: [lds-scriptures]

  - ref: 6
    phrase: Caleb the son of Jephunneh the Kenezite
    kind: history
    title: Caleb the Kenezite
    body: |
      “The Kenezite” may mean that Caleb was born outside Israel and joined Judah; readers differ, and the text does not settle it. On one reading, Caleb “was not a Judahite nor even an Israelite but a Kenezite,” and the fact that he was “nevertheless counted among Judah” shows that the tribes “anciently (as today) were composed of a mix of both biological and adopted members.” The Kenizzites are named among the peoples whose land was promised to Abraham's seed ([[Gen. 15:19]]).

      Others take Kenaz to be a man of Judah's own line, a descendant of Hezron, so that the name is “not the name of a tribe, but of a person.” Between the two, Caleb was either “a proselyte who had been incorporated into the tribe of Judah,” or this Kenaz “probably belonged to the posterity of Judah of whom nothing further is known.” Caleb's younger brother Othniel is called “the son of Kenaz” too ([[Josh. 15:17]]). Numbers counts Caleb as Judah's man throughout, its spy and its prince ([[Num. 13:6]]; [[Num. 34:19]]).
    sources: [ot-minute-josh-14, keil-joshua, cambridge-joshua, lds-scriptures]

  - ref: 9
    phrase: And Moses sware on that day
    kind: scripture
    title: An oath not told in Numbers
    body: |
      Caleb quotes a promise of land that Numbers does not record in these words. In Numbers the LORD swears that the faithless generation will not enter the land, “save Caleb the son of Jephunneh, and Joshua the son of Nun,” and promises that Caleb's seed “shall possess it” ([[Num. 14:24]]; [[Num. 14:30]]). Deuteronomy comes closer: “to him will I give the land that he hath trodden upon, and to his children” ([[Deut. 1:36]]). In both the oath is the LORD's; neither passage mentions an oath of Moses.

      Caleb does not appeal to a written record. He appeals to Joshua, the other faithful spy, who was there: “Thou knowest” (verse 6), “thou heardest in that day” (verse 12).
    sources: [lds-scriptures]

  - ref: 10
    phrase: these forty and five years
    kind: history
    title: Forty-five years, and the length of the wars
    body: |
      Caleb's ages let a reader estimate how long the conquest took. He was forty when he was sent from Kadesh-barnea (verse 7) and is eighty-five now (verse 10). Deuteronomy counts thirty-eight years from Kadesh-barnea to the crossing of the brook Zered ([[Deut. 2:14]]). Reckoned this way, “the conquest of Canaan by Joshua was completed in seven years”; on that reading Caleb counts the years of the wars with the years of wandering, since Israel was not yet in “peaceful possession of the promised land.” The figure is an inference from the numbers, not a date the text gives.

      For Caleb the number is a testimony. “The LORD hath kept me alive, as he said”: God had kept His promise, and “not only prolonged his life forty-five years, but had preserved his strength in such full vigour” that at eighty-five he was as ready for war as at forty (verse 11).
    sources: [keil-joshua, cambridge-joshua, lds-scriptures]

  - ref: 12
    phrase: Now therefore give me this mountain
    kind: prophets
    title: Give me this mountain
    body: |
      Caleb asks for the very country that had frightened the other spies. “This mountain” is the hill country of Hebron (verse 13), where the spies had seen the children of Anak ([[Num. 13:22]]) and the walled cities that made the ten say “We be not able” ([[Num. 13:31]]). His “if so be the LORD will be with me” is the Hebrew *ʾûlay*, “perhaps,” a word that “usually” expresses a hope. He rests the request on the LORD's word: “as the LORD said.”

      President Spencer W. Kimball made the verse the title of a conference address. He called it “a request and a challenge with which my heart finds full sympathy,” since “the Anakims, the giants, were still inhabiting the promised land, and they had to be overcome.” From it he drew a lesson about inheritance: “Just as Caleb had to struggle and remain true and faithful to gain his inheritance, so we must remember that, while the Lord has promised us a place in his kingdom, we must ever strive constantly and faithfully so as to be worthy to receive the reward.” How he applied Caleb's words to the work before the Church is quoted at [[Num. 13:30]] (in that chapter's closing section).
    sources: [bdb, kimball-mountain, lds-scriptures]

  - ref: 14
    phrase: because that he wholly followed the LORD God of Israel
    kind: scripture
    title: Because he wholly followed the LORD
    body: |
      That Caleb wholly followed the LORD is the one reason given for his inheritance: Caleb says it of himself (verse 8), Moses' oath says it (verse 9), and the narrator says it here, as the reason the gift held. The phrase is the same one Numbers and Deuteronomy use for Caleb ([[Num. 32:12]]; [[Deut. 1:36]]; “followed me fully,” [[Num. 14:24]]).

      The gift stood. Hebron became Caleb's “unto this day,” and its fields and villages stayed his even when the city itself was later given to the priests (see the note at [[Josh. 21:12]]).
    sources: [lds-scriptures]

christ: |
  The LORD who “kept me alive, as he said” (verse 10) is Jehovah, the premortal Christ (see [[Ex. 3:14]]). At Kadesh He promised that Caleb and his children would live to inhabit the land, and forty-five years later, through the deaths of a whole generation, He kept that promise. The man who “wholly followed” received Hebron, the hill country he had walked through as a spy ([[Num. 13:22]]).

  The Lord has promised His followers a place in His kingdom, and, as with Caleb, it is received by remaining true and striving faithfully until the promise is fulfilled (see the note at verse 12). Caleb's words at eighty-five show that the promise and the strength to claim it come from the same Lord.

explore: |
  - [[Num. 13:17–33]] and [[Num. 14:6–38]]: Kadesh-barnea, where Caleb's promise was made.
  - [[Deut. 1:19–40]]: Moses' retelling, with the promise of “the land that he hath trodden upon.”
  - [[Josh. 15:13–19]] and [[Judg. 1:10–15]]: Caleb takes Hebron and gives his daughter Achsah a field and springs.
  - [[Num. 34:16–29]]: the men named to divide the land, Caleb among them.

sources: [lds-scriptures, ot-minute-josh-14, cambridge-joshua, keil-joshua, bd-caleb, kimball-mountain, bdb]
