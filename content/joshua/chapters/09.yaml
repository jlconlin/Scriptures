chapter: 9
title: We Have Sworn unto Them
tagline: The people of Gibeon win a league with Israel by pretending to come from a far country, and when the ruse is found out the princes keep the oath they swore by the LORD.
when: 'After Ai, at the camp at Gilgal'

setting: |
  Joshua 9 turns from Ai to the rest of the land. Israel has taken Jericho and Ai and read the law at Ebal and Gerizim ([[Josh. 8:30–35]]), and the camp is at Gilgal (verse 6; see the note at [[Josh. 4:19]]). The chapter opens the second stage of the conquest, which runs to [[Josh. 11:15]]: the kings west of the Jordan join to fight Israel (verses 1–2), an alliance of the kind that “usually arose in response to a perceived regional threat by an emerging or dominant superpower.”

  Gibeon chooses another way. It was “formerly a city of the Hivites, on one of the hills of Benjamin, about five miles north of Jerusalem,” which Israel reached from Gilgal on the third day (verse 17), near the center of the land Israel was to take. Its people send envoys who pretend to come from far away, and the league they win shapes what follows. Chapter 10 begins when five kings attack Gibeon for making peace with Israel and Joshua marches to its rescue ([[Josh. 10:1–6]]); chapter 11 remembers it as the one city that made peace ([[Josh. 11:19]]); and in David's day a famine is laid to Saul's breaking of the oath ([[2 Sam. 21:1–2]]).

thread: |
  The chapter turns on a failure to ask the LORD and a faithfulness to an oath sworn in His name. The envoys' bread, wineskins and sandals are evidence staged for a test the law of Moses set: peace could be made with cities “very far off,” but not with the cities of the land ([[Deut. 20:15–16]]). Israel's leaders look at the evidence and take of the bread, but they “asked not counsel at the mouth of the LORD” (verse 14). The irony is pointed, since the Israelites who had just taken Ai by a ruse are now taken in by one.

  Then the oath, made in error, holds. When the truth comes out three days later the congregation murmurs, and the princes answer with the reason the chapter gives for all that follows: “We have sworn unto them by the LORD God of Israel” (verse 19). The Gibeonites live, and Joshua's sentence makes them servants of the congregation and of the altar of the LORD (verses 23, 27).

sections:
  - range: 1-2
    heading: The kings gather
    plain: |
      When all the kings west of the Jordan heard what had happened (the kings of the hill country, the lowlands and the whole coast of the Great Sea as far as Lebanon: Hittites, Amorites, Canaanites, Perizzites, Hivites and Jebusites), they joined forces to fight Joshua and Israel together.
  - range: 3-15
    heading: The envoys from a far country
    plain: |
      But when the people of Gibeon heard what Joshua had done to Jericho and Ai, they acted with cunning. They set out posing as envoys, with worn-out sacks on their donkeys, old wineskins cracked and tied up, worn and patched sandals on their feet, and old clothes on their backs; all the bread they carried was dry and crumbling. They came to Joshua in the camp at Gilgal and said to him and to the men of Israel, “We have come from a distant country; make a treaty with us.” The men of Israel said to these Hivites, “Perhaps you live among us; then how can we make a treaty with you?” They said to Joshua, “We are your servants.” Joshua asked, “Who are you, and where do you come from?” They answered, “Your servants have come from a very distant country because of the name of the LORD your God. We have heard of His fame and of all He did in Egypt, and all He did to the two Amorite kings east of the Jordan, Sihon king of Heshbon and Og king of Bashan, who lived at Ashtaroth. So our elders and all the people of our country told us, ‘Take provisions for the journey, go and meet them, and say, We are your servants; make a treaty with us.’ This bread of ours was warm when we packed it at home on the day we left to come to you, and look, now it is dry and crumbling. These wineskins were new when we filled them, and look, they are split. Our clothes and our sandals are worn out from the very long journey.” The men of Israel took some of their provisions, but did not ask the LORD for counsel. Joshua made peace with them and a treaty to let them live, and the leaders of the congregation swore an oath to them.
  - range: 16-21
    heading: The ruse found out, the oath kept
    plain: |
      Three days after making the treaty, Israel heard that these people were neighbors who lived among them. The Israelites set out and on the third day reached their cities: Gibeon, Chephirah, Beeroth and Kirjath-jearim. But they did not attack them, because the leaders of the congregation had sworn to them by the LORD, the God of Israel. The whole congregation grumbled against the leaders, and the leaders answered them all, “We have sworn to them by the LORD, the God of Israel, so we may not touch them. This is what we will do: we will let them live, so that wrath will not fall on us because of the oath we swore to them. Let them live, but let them be woodcutters and water carriers for the whole congregation.” So it was, as the leaders had said.
  - range: 22-27
    heading: Joshua's sentence
    plain: |
      Joshua summoned them and said, “Why did you deceive us by saying, ‘We live very far from you,’ when you live among us? Now you are under a curse: you will never cease to be slaves, woodcutters and water carriers for the house of my God.” They answered Joshua, “Your servants were told for certain that the LORD your God commanded His servant Moses to give you the whole land and to destroy all its inhabitants before you. We feared greatly for our lives because of you, and that is why we did this. Now we are in your hands; do with us whatever seems good and right to you.” So Joshua did, and he saved them from the Israelites, who did not kill them. That day he made them woodcutters and water carriers for the congregation and for the altar of the LORD, at the place the LORD would choose, as they are to this day.

notes:
  - ref: 4
    phrase: They did work wilily
    kind: history
    title: Why pretend to come from far away
    body: |
      The worn sacks, split wineskins and crumbling bread were staged to fit the law of Moses. A city that made peace with Israel became tributary and served it ([[Deut. 20:11]]), but only “all the cities which are very far off from thee, which are not of the cities of these nations” ([[Deut. 20:15]]); the cities of the land, the Hivites among them, were to be destroyed ([[Deut. 20:17]]), and with them Israel was to “make no covenant” ([[Deut. 7:2]]). So the envoys' case rests on distance: “We be come from a far country” (verse 6), and the bread that was “hot” when they left home is now dry (verse 12). Their plan was “to take advantage of the instructions in the law of Moses to treat aliens and foreign cities equitably”; covenants of peace and vassalship “could be offered, however, to cities far removed from Canaan.”

      Israel's first suspicion was the right one: “Peradventure ye dwell among us” (verse 7). Why the cities of the land were treated differently from the far cities is the subject of the notes at [[Deut. 20:16]] and [[Deut. 7:2]].
    sources: [ot-minute-josh-9, brandt-conquest, lds-scriptures]

  - ref: 9
    phrase: for we have heard the fame of him
    kind: scripture
    title: The report Rahab had heard
    body: |
      The Gibeonites had heard of the same deeds as Rahab. She told the spies, “we have heard how the LORD dried up the water of the Red sea for you … and what ye did unto the two kings of the Amorites, that were on the other side Jordan, Sihon and Og” ([[Josh. 2:10]]); the envoys name Egypt and “the two kings of the Amorites, that were beyond Jordan” (verse 10). When they are found out they say plainly what moved them: they had been told that the LORD commanded Moses “to destroy all the inhabitants of the land,” and “we were sore afraid of our lives” (verse 24). Their deception was “undertaken out of desperation to save their lives.”

      Like Rahab's household, Gibeon asks for mercy and receives it; what one Latter-day Saint reading makes of the two, that the herem tested the Canaanites as well as Israel, is given at [[Josh. 6:21]]. Chapter 11 bears it out, where the cities of the land fought, and “There was not a city that made peace with the children of Israel, save the Hivites the inhabitants of Gibeon” ([[Josh. 11:19]]).
    sources: [lds-scriptures, ot-minute-josh-9, calabro-herem]

  - ref: 14
    phrase: asked not counsel at the mouth of the LORD
    kind: scripture
    title: They asked not counsel
    body: |
      Israel's leaders had a way to ask the LORD and did not use it. The law provided it: Joshua was to “stand before Eleazar the priest, who shall ask counsel for him after the judgment of Urim before the LORD” ([[Num. 27:21]]). Instead “the men took of their victuals.” The ruse “worked due to the Israelites’ credulity and their failure to consult the Lord.”

      It is one of the scriptures' “many examples of poor choices made by good people simply because they did not bother to ask,” beside Hezekiah showing his treasures to the envoys of Babylon ([[Isa. 39:2–7]]) and the Jaredites' four years on the seashore ([[Ether 2:14]]).
    sources: [lds-scriptures, ot-minute-josh-9, ball-judge-not]

  - ref: 19
    phrase: We have sworn unto them by the LORD God of Israel
    kind: history
    title: Why the oath was kept
    body: |
      The princes kept the oath because it was sworn in the LORD's name, and later scripture shows the LORD holding Israel to it. The league was a covenant, “accepted through covenant by Joshua,” and “despite their deceit, the treaty, which was considered sacred, was honored.” The princes give their own reason: “lest wrath be upon us, because of the oath which we sware unto them” (verse 20).

      One objection is that a treaty won by fraud need not bind. One older reading grants that “from the stand-point of strict justice” the princes might have counted themselves free, but holds that they kept the oath so as not to bring “the name of the God of Israel into contempt” among the Canaanites. They had sinned in swearing without asking the LORD, and they could not repair that fault by breaking the oath, “by committing a fresh sin.”

      Scripture records the oath kept, and generations later broken. In the next chapter Gibeon sends to Joshua, “come up to us quickly, and save us” ([[Josh. 10:6]]), and Joshua, “faithful to the treaty,” goes up to fight for it. Generations later Saul, “in his zeal,” broke the promise and killed many Gibeonites. In David's day the LORD answered that a three-year famine was “for Saul, and for his bloody house, because he slew the Gibeonites” ([[2 Sam. 21:1]]), and the narrator explains, “the children of Israel had sworn unto them” ([[2 Sam. 21:2]]). The Gibeonites asked for seven of Saul's sons, who were put to death ([[2 Sam. 21:6–9]]).

      The theme page [“In the Midst of Israel”](/joshua/themes/in-the-midst-of-israel/) follows what Israel owed those it let live, from Rahab to Gibeon and the stranger at the cities of refuge.
    sources: [brandt-conquest, keil-joshua, belnap-fell-tree, lds-scriptures]

  - ref: 23
    phrase: hewers of wood and drawers of water for the house of my God
    kind: history
    title: Servants of the house of God
    body: |
      Joshua's curse is the servitude named in the same sentence: the Gibeonites would never be freed from being bondmen, cutting wood and carrying water for the sanctuary. It was menial work; Moses' list of those who entered the covenant at Moab ends with “the hewer of thy wood unto the drawer of thy water” ([[Deut. 29:11]]; see the note at [[Deut. 29:15]]). Verse 27 places the service at “the altar of the LORD … in the place which he should choose.” Deuteronomy uses those words for the place where all Israel would “appear before the LORD” to hear the law ([[Deut. 31:11]]).

      “Even unto this day” (verse 27) is the narrator's later vantage: the verse gives the author's explanation “for why Gibeonites served in menial labor roles in his day.” The Gibeonite covenant of tribute “lasted for hundreds of years.”

      One Latter-day Saint study reads Joshua's covenant with Gibeon as one “that incorporated them into the house of Israel,” beside the strangers who stood with Israel at Ebal ([[Josh. 8:33]]) and those Moses brought into the covenant ([[Deut. 29:10–13]]).
    sources: [ot-minute-josh-9, brandt-conquest, muhlestein-ruth, lds-scriptures]

christ: |
  The LORD by whose name the princes swore is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]). The Gibeonites came “because of the name of the LORD thy God” (verse 9), and they were spared and assigned to serve at His altar (verse 27).

  Israel's leaders judged by what they could see and “asked not counsel at the mouth of the LORD” (verse 14); the Book of Mormon counsels, “Counsel with the Lord in all thy doings, and he will direct thee for good” ([[Alma 37:37]]). And a promise binds a disciple even when keeping it costs, as the psalm says of the one who “sweareth to his own hurt, and changeth not” ([[Ps. 15:4]]).

explore: |
  - [[Josh. 10:1–14]]: the oath kept in battle, when Joshua goes up to save Gibeon.
  - [[2 Sam. 21:1–14]]: the oath broken by Saul, and what it cost.
  - [[Deut. 20:10–18]]: the law of the far cities and the near ones, which the Gibeonites played upon.

sources: [lds-scriptures, ot-minute-josh-9, bd-gibeon, brandt-conquest, calabro-herem, ball-judge-not, keil-joshua, belnap-fell-tree, muhlestein-ruth]
