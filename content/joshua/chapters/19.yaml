chapter: 19
title: So They Made an End of Dividing the Country
tagline: The last six lots fall to Simeon, Zebulun, Issachar, Asher, Naphtali and Dan; Joshua receives his own city last, and the division is finished at Shiloh.
when: 'At Shiloh, as the dividing of the land is finished'

setting: |
  Joshua 19 finishes what chapter 18 began. Seven tribes were still without land when the congregation gathered at Shiloh and the land was written down “by cities into seven parts in a book” ([[Josh. 18:9]]; see the notes at [[Josh. 18:1]] and [[Josh. 18:6]]). Benjamin's lot came up first; this chapter gives the other six in order. Simeon receives towns in the far south, inside Judah (verses 1–9). Four northern tribes, Zebulun, Issachar, Asher and Naphtali, receive the land that later made up the region the New Testament calls Galilee (verses 10–39). Dan receives land beside Judah, Benjamin and Ephraim (verses 40–48). Then Joshua receives his own city (verses 49–50), and the division closes (verse 51).

  The lists mostly name borders and towns, and some of them, several of Simeon's towns among them, cannot be placed. Why the land was divided by lot is at [[Num. 26:55]]; where each tribe lay is set out in the guide [The Land](/old-testament/guides/the-land/#inheritance). The notes take up Simeon with no border of its own, a second Bethlehem, Dan's move to the north, and the leader who took his inheritance last.

thread: |
  The last lots show the promise kept and the work still unfinished side by side. One tribe gets a list of towns and no border line: Simeon lives “within the inheritance of the children of Judah” (verse 1). Another gets a border and loses it: Dan's border “went out too little for them,” and the tribe takes a city far to the north (verse 47). Between them the four northern tribes receive their borders and their towns with no comment at all.

  Only when every tribe has its lot does Joshua receive his, a city he asked for in his own tribe (verses 49–50). The chapter then closes the whole division in one sentence, naming the same three parties who began it at [[Josh. 14:1]]: “Eleazar the priest, and Joshua the son of Nun, and the heads of the fathers of the tribes,” dividing “by lot in Shiloh before the LORD, at the door of the tabernacle of the congregation” (verse 51). That closing formula looks back to the gathering at Shiloh in [[Josh. 18:1]] and takes in chapters 14–17 as well, and it leaves the tabernacle standing at Shiloh as the allotment is finished.

sections:
  - range: 1-9
    heading: Simeon
    plain: |
      The second lot came out for the tribe of Simeon, clan by clan, and their inheritance lay inside the inheritance of Judah. Their towns were Beer-sheba (or Sheba), Moladah, Hazar-shual, Balah, Azem, Eltolad, Bethul, Hormah, Ziklag, Beth-marcaboth, Hazar-susah, Beth-lebaoth and Sharuhen: thirteen towns with their villages. Then Ain, Remmon, Ether and Ashan: four towns with their villages. With them went all the villages around these towns as far as Baalath-beer, Ramah of the south. This was the inheritance of the tribe of Simeon, clan by clan. Simeon's inheritance was taken out of Judah's share, because Judah's share was more than Judah needed; so Simeon received its inheritance within Judah's.
  - range: 10-16
    heading: Zebulun
    plain: |
      The third lot came up for Zebulun, clan by clan. The border of their inheritance ran as far as Sarid. From there it went up westward to Maralah, touched Dabbasheth and the river that faces Jokneam. From Sarid it turned east, toward the sunrise, to the border of Chisloth-tabor, out to Daberath and up to Japhia; on eastward to Gittah-hepher and Ittah-kazin, out to Remmon-methoar and around to Neah. On the north the border went around to Hannathon and ended in the valley of Jiphthah-el. Their towns included Kattath, Nahallal, Shimron, Idalah and Beth-lehem: twelve towns with their villages. This was the inheritance of Zebulun, clan by clan, these towns with their villages.
  - range: 17-23
    heading: Issachar
    plain: |
      The fourth lot came out for Issachar, clan by clan. Their territory took in Jezreel, Chesulloth, Shunem, Hapharaim, Shion, Anaharath, Rabbith, Kishion, Abez, Remeth, En-gannim, En-haddah and Beth-pazzez. The border touched Tabor, Shahazimah and Beth-shemesh and ended at the Jordan: sixteen towns with their villages. This was the inheritance of the tribe of Issachar, clan by clan, the towns and their villages.
  - range: 24-31
    heading: Asher
    plain: |
      The fifth lot came out for the tribe of Asher, clan by clan. Their border took in Helkath, Hali, Beten, Achshaph, Alammelech, Amad and Misheal, and reached Carmel on the west and Shihor-libnath. It turned east toward Beth-dagon, touched Zebulun and the valley of Jiphthah-el, north of Beth-emek and Neiel, and went out to Cabul on the north; then Hebron, Rehob, Hammon and Kanah, as far as Great Zidon. The border turned to Ramah and to the fortified city of Tyre, turned to Hosah, and ended at the sea, from the coast to Achzib; with Ummah, Aphek and Rehob: twenty-two towns with their villages. This was the inheritance of the tribe of Asher, clan by clan, these towns with their villages.
  - range: 32-39
    heading: Naphtali
    plain: |
      The sixth lot came out for Naphtali, clan by clan. Their border ran from Heleph, from Allon to Zaanannim, by Adami, Nekeb and Jabneel to Lakum, and ended at the Jordan. Then it turned west to Aznoth-tabor and out to Hukkok, touching Zebulun on the south, Asher on the west, and Judah at the Jordan on the east. The fortified towns were Ziddim, Zer, Hammath, Rakkath, Chinnereth, Adamah, Ramah, Hazor, Kedesh, Edrei, En-hazor, Iron, Migdal-el, Horem, Beth-anath and Beth-shemesh: nineteen towns with their villages. This was the inheritance of the tribe of Naphtali, clan by clan, the towns and their villages.
  - range: 40-48
    heading: Dan
    plain: |
      The seventh lot came out for the tribe of Dan, clan by clan. The territory of their inheritance took in Zorah, Eshtaol, Ir-shemesh, Shaalabbin, Ajalon, Jethlah, Elon, Thimnathah, Ekron, Eltekeh, Gibbethon, Baalath, Jehud, Bene-berak, Gath-rimmon, Me-jarkon and Rakkon, with the territory facing Japho. But the Danites' territory slipped out of their hands, so they went up and fought against Leshem, took it, put it to the sword, possessed it and settled there, and they renamed Leshem Dan, after their ancestor Dan. This was the inheritance of the tribe of Dan, clan by clan, these towns with their villages.
  - range: 49-51
    heading: Joshua's city, and the end of the division
    plain: |
      When they had finished dividing the land by its borders, the Israelites gave Joshua son of Nun an inheritance among them. As the LORD had said, they gave him the town he asked for, Timnath-serah in the hill country of Ephraim, and he built up the town and lived there. These are the inheritances that Eleazar the priest, Joshua son of Nun, and the heads of the tribes of Israel distributed by lot at Shiloh before the LORD, at the entrance of the tabernacle. So they finished dividing the land.

notes:
  - ref: 1
    phrase: their inheritance was within the inheritance of the children of Judah
    kind: history
    title: Simeon inside Judah
    body: |
      Simeon receives towns rather than a territory marked out by borders: its lot is carved out of Judah's, and verse 9 gives the reason, “the part of the children of Judah was too much for them.” The towns bear it out. Beer-sheba, Moladah, Hazar-shual and the rest had already been counted among Judah's ([[Josh. 15:26–32]]): “All these eighteen towns have already been enumerated among the towns of Judah,” and they appear again, in the same order, in [[1 Chr. 4:28–32]]. One older reading adds that Judah's land was not only too large but “too much exposed to marauders on the west and south,” and that Simeon, like Judah, descended from Leah.

      One older reading sees behind the arrangement Jacob's word over Simeon and Levi, “I will divide them in Jacob, and scatter them in Israel” ([[Gen. 49:7]]); how that word was borne out in both tribes is told at [[Gen. 34:31]]. Moses' blessing of the tribes in Deuteronomy 33 does not name Simeon, and the tribe was afterward “destined to have little influence on the subsequent history.”
    sources: [lds-scriptures, keil-joshua, cambridge-joshua]

  - ref: 15
    phrase: Beth-lehem
    kind: history
    title: Another Bethlehem
    body: |
      The Beth-lehem of Zebulun is a different town from David's Bethlehem Ephratah in Judah, the town of Rachel's grave ([[Gen. 35:19]]) and of [[Micah 5:2]]. It appears again in the story of the judge Ibzan ([[Judg. 12:8, 10]]).
    sources: [bd-bethlehem]

  - ref: 47
    phrase: went out too little for them
    kind: words
    title: Dan's lost border and the city it took
    body: |
      Dan could not hold the land its lot gave it, and part of the tribe moved to the far north. The King James words “too little” are supplied: the Hebrew says only that the border of the children of Dan “went out from them,” and a modern translation reads, “When the territory of the Danites was lost to them.” (One older reading took the phrase the other way, that the border “was extended.”) The district “was small in area but had an admirable situation,” and “there was a good deal of difficulty in holding it against the Amorites… and against the Philistines.” Judges says it plainly: “the Amorites forced the children of Dan into the mountain” ([[Judg. 1:34]]).

      The verse tells in a sentence what Judges 18 tells at length, an event that came after Joshua's death. Leshem is the Laish of that chapter ([[Judg. 18:29]]), at the sources of the Jordan. Renamed Dan, it became Israel's northern limit, and the land was measured “from Dan even to Beer-sheba.” On one Latter-day Saint reading the verse is evidence that “the conquest continued slowly over time,” as Judges 1 also shows. The book's own two pictures of the conquest, finished and unfinished, are set side by side at [[Josh. 13:1]].
    sources: [cambridge-joshua, oshb-wlc, nrsvue, bd-dan, keil-joshua, sc-knowhy-852, lds-scriptures]

  - ref: 50
    phrase: According to the word of the LORD they gave him the city which he asked
    kind: history
    title: Joshua's own city, last of all
    body: |
      Joshua receives his inheritance only after every tribe has its lot: Caleb, the other faithful spy, “had already received his inheritance along with the rest of Judah,” “leaving only Joshua to receive his portion.” The two of them had been named together years before, at Kadesh, as the only men of their generation who would enter the land, “save Caleb the son of Jephunneh, and Joshua the son of Nun” ([[Num. 14:30]]).

      The text does not record what “word of the LORD” is meant. “We do not find any Divine injunction in the Pentateuch to the effect that Joshua was to receive a special portion,” and older readings infer a promise like the one made to Caleb (see [[Josh. 14:6]]), and one places it at Kadesh, where Caleb's was given. Joshua asked for a town in mount Ephraim, the territory of his own tribe (“Of the tribe of Ephraim, Oshea the son of Nun,” [[Num. 13:8]]), and the request did not set aside the lot; “the law of the inheritance was not to be set aside for him any more than for the meanest in Israel.” He “built the city,” or perhaps fortified it. He was buried there ([[Josh. 24:30]]); Judges calls the place Timnath-heres ([[Judg. 2:9]]).
    sources: [ot-minute-josh-19, lds-scriptures, cambridge-joshua, keil-joshua, pulpit-joshua]

christ: |
  The LORD before whom the lots were cast at Shiloh is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]), and two of the lots in this chapter became the land where He later lived and taught. Zebulun and Naphtali lay in what the New Testament calls Galilee, and Jesus “dwelt in Capernaum, which is upon the sea coast, in the borders of Zabulon and Nephthalim” ([[Matt. 4:13]]); Matthew reads it as Isaiah's promise fulfilled, that “the people which sat in darkness saw great light” ([[Matt. 4:16]]; see the note at [[Isa. 9:1]]).

  The Giver of the land came Himself to live within its borders, and the light He brought there is offered to every disciple: “he that followeth me shall not walk in darkness, but shall have the light of life” ([[John 8:12]]).

explore: |
  - [[Judg. 1:3, 34]] and [[Judg. 18]]: Simeon fighting beside Judah, and Dan's journey north to Laish.
  - [[Gen. 49:5–7, 13–21]] and [[Deut. 33:18–25]]: Jacob's and Moses' blessings on the tribes of this chapter.
  - [[Isa. 9:1–2]] and [[Matt. 4:12–16]]: the land of Zebulun and Naphtali, and the light that came to it.
  - [[Josh. 24:29–30]]: Joshua's death and burial in his own inheritance.

