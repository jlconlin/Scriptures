chapter: 20
title: Cities of Refuge
tagline: With the land divided, Joshua sets apart the six cities where a man who has killed by accident can flee from the avenger of blood.
when: 'After the land was divided by lot at Shiloh, before the Levites receive their cities'

setting: |
  Joshua 20 follows the division of the land. The lots for the tribes were cast at Shiloh, and with the last of them “they made an end of dividing the country” ([[Josh. 19:51]]). Before the Levites receive their towns in chapter 21, the LORD has Joshua carry out one more of the laws Moses gave for the land. The command was not new: the LORD had given it to Moses ([[Num. 35:9–34]]; [[Deut. 19:1–13]]), “but it fell upon Joshua to constitute the practice.” Moses had already set apart the three cities east of the Jordan ([[Deut. 4:41–43]]); this chapter names them again beside the three in the land, so that the list of six is complete.

  The chapter takes the law as already explained. What a city of refuge was is at [[Deut. 19:2]]; who the avenger of blood was, at [[Deut. 19:6]]; why the refuges were Levites' cities, at [[Num. 35:6]]; why the slayer went home at the high priest's death, at [[Num. 35:25]]. All six reappear in chapter 21 among the Levites' cities, each one “to be a city of refuge for the slayer” ([[Josh. 21:13]]).

thread: |
  The chapter is a commandment carried out. The tribes had their inheritances, and on one reading one group was still to be provided for: people “in compromising legal situations,” whose “allotment is described in chapter 20.” Setting up the cities directly after the inheritances showed “the clear moral emphasis the covenant people placed on matters of the law and justice.” The LORD gives the law again (verses 1–6) and Israel names the cities (verses 7–9), the two parts into which the chapter falls.

  The refuge does two things, and the chapter keeps both in view. It holds back the avenger: the city's elders “shall not deliver the slayer up into his hand” (verse 5). And it does not set aside judgment: the slayer stays “until he stand before the congregation for judgment” (verse 6), and the chapter's last words repeat it, “until he stood before the congregation” (verse 9).

sections:
  - range: 1-6
    heading: The law of refuge given again
    plain: |
      The LORD spoke to Joshua: Tell the Israelites to set aside the cities of refuge I told you about through Moses, so that a person who kills someone by accident, without meaning to, can flee there. They will be your refuge from the dead man's kinsman who seeks to avenge his blood. The one who flees to one of these cities is to stand at the entrance of the city gate and state his case to the city's elders. They are to take him into the city and give him a place to live among them. If the avenger pursues him, they must not hand him over, because he killed his neighbour by accident and had not hated him before. He is to stay in that city until he stands trial before the congregation, and until the death of the high priest who is serving then. After that he may go back to his own town and his own home, the town he fled from.
  - range: 7-9
    heading: The six cities
    plain: |
      So they set apart as holy Kedesh in Galilee, in the hill country of Naphtali; Shechem, in the hill country of Ephraim; and Kirjath-arba, that is, Hebron, in the hill country of Judah. East of the Jordan, opposite Jericho, they designated Bezer in the wilderness on the plateau, from the tribe of Reuben; Ramoth in Gilead, from the tribe of Gad; and Golan in Bashan, from the tribe of Manasseh. These were the cities designated for all the Israelites and for the foreigners living among them, so that anyone who killed a person by accident could flee there and not die at the hand of the avenger of blood before he had stood trial before the congregation.

notes:
  - ref: 4
    phrase: shall declare his cause in the ears of the elders of that city
    kind: history
    title: A hearing at the gate
    body: |
      The slayer's first hearing was at the gate of the city of refuge, before its elders, and the gate was where a town did its public business. When Boaz settled the kinsman's claim to Ruth, he went up to the gate and called “ten men of the elders of the city” to sit with him there ([[Ruth 4:1–2]]).

      If the elders accepted the slayer's account, they took him in and gave him “a place, that he may dwell among them,” and from then on the city stood between him and the avenger (verse 5).
    sources: [bd-gate, lds-scriptures]

  - ref: 6
    phrase: until he stand before the congregation for judgment, and until the death of the high priest
    kind: history
    title: Two "untils"
    body: |
      Verse 6 sets two limits on the slayer's stay, and Numbers, which gives the law in full, puts them in order. The first is the trial: “the congregation shall judge between the slayer and the revenger of blood” ([[Num. 35:24]]). A man who had killed with intent was a murderer, and “the revenger of blood himself shall slay the murderer” ([[Num. 35:19]]). A man who had killed by accident was taken back to the city of refuge, “and he shall abide in it unto the death of the high priest” ([[Num. 35:25]]).

      The second limit is that death, after which he was free to go home. One reading lets it come before the first: “If the high priest died before the case could be resolved, the accused party was cleared of any wrongdoing and could return home.” The text gives no reason for the term; the two older readings of it are set out at [[Num. 35:25]].
    sources: [lds-scriptures, ot-minute-josh-20]

  - ref: 7
    phrase: And they appointed
    kind: words
    title: Set apart as holy
    body: |
      The verb for what Israel did to the six cities means to make holy. In verse 2 the LORD says “give to you,” that is, “appoint for yourselves.” But verse 7 uses *qādash*, the verb of holiness, in the form that means to “set apart, devote, consecrate,” used here of a city as it is elsewhere of the temple. One older reading renders it “they sanctified, set apart for a sacred purpose,” because the cities “were intended to preserve the People and the Land of Jehovah from blood-guiltiness.”

      The three cities in the land lay in the north (Kedesh), the centre (Shechem) and the south (Hebron), and with the three east of the Jordan they made “an effective distribution of refuge cities.”
    sources: [oshb-wlc, keil-joshua, bdb, cambridge-joshua, ot-minute-josh-20]

  - ref: 9
    phrase: and for the stranger that sojourneth among them
    kind: history
    title: The stranger too
    body: |
      The refuge was open to foreigners living in Israel as well as to Israelites. Numbers had already said so (“both for the children of Israel, and for the stranger, and for the sojourner among them,” [[Num. 35:15]]), and the chapter's closing summary repeats it. The cities were “a place for aliens in the land of Canaan to seek judicial oversight or refuge,” and setting them up showed “the need to watch over those that might be socially disadvantaged, especially aliens who might not have any other judicial recourse.”
    sources: [lds-scriptures, ot-minute-josh-20]

christ: |
  The LORD who commands the cities of refuge (verse 1) is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]). Hebrews describes believers in Him as those “who have fled for refuge to lay hold upon the hope set before us” ([[Heb. 6:18]]); how that line is read beside the cities of refuge, and how Amulek reasons from the law's justice to Christ's atonement, is at the close of [[Num. 35]].

  That refuge is open now to everyone who flees to Christ, and the hope it gives holds: it is “an anchor of the soul, both sure and steadfast” ([[Heb. 6:19]]).

explore: |
  - [[Num. 35:9–34]] and [[Deut. 19:1–13]]: the law of refuge as the LORD gave it to Moses.
  - [[Deut. 4:41–43]]: Moses sets apart the three cities east of the Jordan.
  - [[Josh. 21]]: the six cities given to the Levites with the rest of their towns.
  - [[Heb. 6:13–20]]: fleeing for refuge to the hope set before us.

sources: [lds-scriptures, ot-minute-josh-20, keil-joshua, cambridge-joshua, bd-gate, bdb, oshb-wlc]
