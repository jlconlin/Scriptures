chapter: 13
title: Very Much Land to Be Possessed
tagline: Joshua is old and much of Canaan is still unconquered, but the LORD tells him to divide it anyway; the chapter then looks back at what Moses had already given east of the Jordan.
when: 'When Joshua was old, before the land west of the Jordan is divided'

setting: |
  Joshua 13 begins the second half of the book, the dividing of the land among the tribes, which runs to the book's close. The first half ended with a summary of the wars ([[Josh. 11:23]]) and a roll of the kings defeated (chapter 12). Now Joshua is “old and stricken in years,” and the LORD's first words are about what is still unconquered (verses 1–6). The note at verse 1 takes up how the book's two pictures of the land fit together.

  The rest of the chapter (verses 8–33) adds a description of the land east of the Jordan “which had already been conquered and divided among the two tribes and a half.” Why Reuben, Gad and half of Manasseh asked for land there, and the terms Moses set, are told at [[Num. 32:6]]; the wars with Sihon and Og are at [[Ps. 135:11]]. The division west of the Jordan begins in chapter 14, with Caleb ([[Josh. 14:6]]).

thread: |
  The division of the land begins with what is unfinished. The LORD names the land that “yet remaineth,” promises “them will I drive out,” and tells Joshua to divide it by lot anyway (verses 1–7): the division rests on His promise, not on what Israel holds (see the note at verse 6).

  Then the chapter looks back. Verses 8–33 act “as a sort of flashback” to what Moses had won and given: Reuben's towns (15–23), Gad's (24–28), and half Manasseh's (29–31), each “according to their families.” Verse 32 sums up what Moses distributed “in the plains of Moab.” Even here the record admits what was left undone: “the children of Israel expelled not the Geshurites, nor the Maachathites” (verse 13). Balaam's death (verse 22) is told in a line; what later scripture makes of him is at [[Num. 31:16]].

  Twice the list stops for the one tribe with no land. Levi's inheritance is “the sacrifices of the LORD God of Israel made by fire” (verse 14) and “the LORD God of Israel” Himself (verse 33); a later verse says “the priesthood of the LORD” ([[Josh. 18:7]]). The tribe was attached to the tabernacle as its custodians, and why the LORD was its share is explained at [[Num. 18:20]].

sections:
  - range: 1-7
    heading: The land that remains
    plain: |
      Joshua was now old, far along in years, and the LORD said to him: You are old and far along in years, and a great deal of land is still left to be taken. This is the land that remains: all the districts of the Philistines and all of Geshuri, from the Sihor, which faces Egypt, north to the border of Ekron, which is counted as Canaanite land; the five lords of the Philistines, those of Gaza, Ashdod, Ashkelon, Gath and Ekron; and the Avites. From the south, all the land of the Canaanites, and Mearah, beside the Sidonians, as far as Aphek and the border of the Amorites; the land of the Giblites, and all Lebanon toward the east, from Baal-gad below Mount Hermon to the entrance of Hamath. All the people of the hill country from Lebanon to Misrephoth-maim, all the Sidonians, I will drive out before the Israelites. You need only divide the land by lot to Israel as their inheritance, as I commanded you. So now divide this land as an inheritance for the nine tribes and the half tribe of Manasseh.
  - range: 8-14
    heading: What Moses gave east of the Jordan
    plain: |
      The Reubenites and the Gadites, with the other half of Manasseh, had already received their inheritance from Moses the servant of the LORD, east of the Jordan. It ran from Aroer on the bank of the river Arnon, and the city in the middle of the river, and all the plain of Medeba as far as Dibon. It took in all the cities of Sihon king of the Amorites, who reigned in Heshbon, to the border of the Ammonites; Gilead, the territory of the Geshurites and the Maachathites, all Mount Hermon, and all Bashan as far as Salcah. It took in the whole kingdom of Og in Bashan, who reigned in Ashtaroth and Edrei and was one of those who remained of the giants. Moses defeated these kings and drove them out. Yet the Israelites did not drive out the Geshurites or the Maachathites; they live among Israel to this day. Only to the tribe of Levi he gave no inheritance: the offerings made by fire to the LORD God of Israel are their inheritance, as He told them.
  - range: 15-23
    heading: Reuben
    plain: |
      Moses gave the tribe of Reuben its inheritance, clan by clan. Their border ran from Aroer on the bank of the river Arnon, and the city in the middle of the river, and all the plain by Medeba: Heshbon and all its towns on the plain, Dibon, Bamoth-baal, Beth-baal-meon, Jahazah, Kedemoth, Mephaath, Kirjathaim, Sibmah, Zareth-shahar on the hill in the valley, Beth-peor, Ashdoth-pisgah and Beth-jeshimoth, all the towns of the plain, and the whole kingdom of Sihon king of the Amorites, who reigned in Heshbon. Moses defeated him along with the princes of Midian, Evi, Rekem, Zur, Hur and Reba, the vassal princes of Sihon who lived in that country. The Israelites also killed Balaam son of Beor, the soothsayer, with the sword, among the others they killed. The Jordan was Reuben's border. This was the inheritance of the Reubenites by their clans, the towns and their villages.
  - range: 24-28
    heading: Gad
    plain: |
      Moses gave the tribe of Gad its inheritance, clan by clan. Their territory was Jazer, all the towns of Gilead, and half the land of the Ammonites, as far as Aroer near Rabbah; from Heshbon to Ramath-mizpeh and Betonim, and from Mahanaim to the border of Debir; and in the valley, Beth-aram, Beth-nimrah, Succoth and Zaphon, the rest of the kingdom of Sihon king of Heshbon, with the Jordan as the border, up to the end of the sea of Chinnereth, east of the Jordan. This was the inheritance of the Gadites by their clans, the towns and their villages.
  - range: 29-33
    heading: Half of Manasseh, and Levi
    plain: |
      Moses gave an inheritance to the half tribe of Manasseh, clan by clan. Their territory ran from Mahanaim through all Bashan, the whole kingdom of Og king of Bashan, and all the towns of Jair in Bashan, sixty cities. Half of Gilead, with Ashtaroth and Edrei, cities of Og's kingdom in Bashan, went to the descendants of Machir son of Manasseh, to half of Machir's descendants by their clans. These are the lands Moses distributed as inheritances on the plains of Moab, east of the Jordan across from Jericho. But to the tribe of Levi Moses gave no inheritance: the LORD God of Israel was their inheritance, as He told them.

notes:
  - ref: 1
    phrase: there remaineth yet very much land to be possessed
    kind: history
    title: The whole land, and very much land remaining
    body: |
      The book says both that Joshua took the whole land and that very much land remained, and it sets the two statements two chapters apart. Chapter 11 closes the wars with “So Joshua took the whole land, according to all that the LORD said unto Moses … And the land rested from war” ([[Josh. 11:23]]). Here the LORD tells the aged Joshua that “very much land” remains, and verses 2–6 name it: the Philistine coast in the south, Lebanon and the Sidonians in the north. Verse 13 adds peoples east of the Jordan whom Israel “expelled not,” and the chapters that follow keep the same record for Jerusalem, Gezer and the cities of Manasseh ([[Josh. 15:63]]; [[Josh. 16:10]]; [[Josh. 17:12]]).

      The book leaves the two side by side without explaining them. In one Latter-day Saint reading, the land left in Canaanite hands “seems to contradict or at least complicate the idealized portrayal of the conquest,” and the Philistine coast and Geshur reportedly came under Israel only in David's reign. The campaigns won “the main hill regions and the Trans-Jordan areas” and destroyed “the major military powers,” but the record “preserves only summary accounts,” and “the conquest extended over many years and was never fully completed on the terms the Lord had originally specified”; Judges 1 tells it continuing slowly.

      The borders the LORD drew in Numbers, and how far Israel ever held them, are at [[Num. 34:2]]; the book's own summary, that “there failed not ought of any good thing” ([[Josh. 21:45]]), is read in the note at [[Josh. 21:43]].
    sources: [ot-minute-josh-13, brandt-conquest, sc-knowhy-852, lds-scriptures]

  - ref: 3
    phrase: five lords of the Philistines
    kind: history
    title: The five lords of the Philistines
    body: |
      The Philistines formed “a confederation of five chief cities, namely, Ashdod, Gaza, Ashkelon, Gath, and Ekron, each governed by its ‘lord’”; verse 3 names their people city by city, the Gazathites, the Ashdothites and the rest. They were a people “that originally came from Caphtor (Crete, or perhaps part of Egypt),” settled on “the rich lowland on the Mediterranean coast from Joppa to the Egyptian desert.”

      Their coast is the first land on the LORD's list of what remains. Philistine power was still “at its height at the time of Saul’s death but rapidly declining during the reign of David”; when their coast came under Israel is in the note at verse 1.
    sources: [bd-philistines]

  - ref: 6
    phrase: 'them will I drive out from before the children of Israel: only divide thou it by lot unto the Israelites for an inheritance'
    kind: scripture
    title: Dividing land not yet taken
    body: |
      The LORD has Joshua divide land Israel does not yet hold and promises to clear it Himself: “them will I drive out” is His part, “only divide thou it by lot” is Joshua's: “according to the command of God, he divided the whole land among the Israelites, whether it was conquered or not.” In his farewell Joshua speaks of the division in the same terms: “I have divided unto you by lot these nations that remain … And the LORD your God, he shall expel them from before you” ([[Josh. 23:4–5]]). How the lot worked is at [[Num. 26:55]].

      Two of the peoples named in verses 2–6, the Philistines and the Sidonians, had still not been removed in Judges, and there scripture gives a reason: “these are the nations which the LORD left, to prove Israel by them … Namely, five lords of the Philistines, and all the Canaanites, and the Sidonians, and the Hivites that dwelt in mount Lebanon,” left “to know whether they would hearken unto the commandments of the LORD” ([[Judg. 3:1–4]]).
    sources: [keil-joshua, brandt-conquest, lds-scriptures]

christ: |
  The promise “them will I drive out” (verse 6) is the LORD's, and the LORD of Joshua is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]). He had Joshua divide by lot a land Israel did not yet hold, and at the end of his life Joshua told the people the outcome: “not one thing hath failed of all the good things which the LORD your God spake concerning you” ([[Josh. 23:14]]). The tribe that received no land had “the LORD God of Israel” Himself for its inheritance (verse 33).

  What the Lord has promised and not yet given remains His to give. Joshua's witness is that His word did not fail in one thing, and the Lord says the same of His word now: “though the heavens and the earth pass away, my word shall not pass away, but shall all be fulfilled, whether by mine own voice or by the voice of my servants, it is the same” ([[D&C 1:38]]).

explore: |
  - [[Josh. 15:63]], [[Josh. 16:10]] and [[Josh. 17:12–18]]: the land the tribes did not take, recorded as the division goes on.
  - [[Judg. 1]]: the unfinished conquest after Joshua, tribe by tribe.
  - [[Num. 32]]: the eastern tribes' request and Moses' terms, behind verses 8–33.
  - [[Josh. 23:4–14]]: Joshua's farewell on the nations that remain and the promise that did not fail.

sources: [lds-scriptures, ot-minute-josh-13, keil-joshua, brandt-conquest, sc-knowhy-852, bd-philistines]
