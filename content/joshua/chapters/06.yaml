chapter: 6
title: The Wall Fell Down Flat
tagline: Israel marches seven days around Jericho behind the ark, the wall falls at the shout, the city is devoted to the LORD, and Rahab's household alone is saved.
when: 'At Jericho, after the first Passover in the land'

setting: |
  Joshua 6 is Israel's first battle in the land, and it begins where chapter 5 ended. Israel has crossed the Jordan and kept the Passover at Gilgal “in the plains of Jericho” ([[Josh. 5:10]]), and the captain of the LORD's host, “possibly Jehovah Himself,” has met Joshua by the city with his sword drawn (see the note at [[Josh. 5:14]]). Now the LORD speaks to Joshua (verse 2), and the chapter is His plan carried out.

  Jericho was a walled city in the Jordan valley, some 800 feet below the Mediterranean, near the place where Israel crossed the river. It was also a spring-fed city: its spring, today called Ein es-Sultan, produces about 1,000 gallons of water a minute, more than enough for Jericho and many settlements around it, so that taking Jericho and the other spring-fed cities would have let Israel found many settlements across the hill country. The narrative presents the city as beyond Israel's own means to capture, and its thrust is “to portray God as ultimately the one behind Israel’s victories, not any human ingenuity.”

  Inside the wall waits Rahab, who had hidden Joshua's two spies and been promised her family's lives (chapter 2). Later scripture remembers both outcomes of the day together, the wall and Rahab, as works of faith ([[Heb. 11:30–31]]).

thread: |
  The LORD gives Jericho before Israel takes a step. “See, I have given into thine hand Jericho,” He says (verse 2), and on the seventh day Joshua repeats it to the people: “Shout; for the LORD hath given you the city” (verse 16). Between the two sentences priests carry the ark, seven trumpets sound, the people walk in silence, once a day for six days and seven times on the seventh. The instructions turn on ritual and faith rather than on military strategy, and the point of the story is that the victory is God's.

  Then the gift is given back. The city and everything in it are devoted to the LORD (verses 17–19): its people and animals are destroyed, its metal goes into His treasury, and nothing is plunder. Two exceptions frame what comes next. Rahab the Canaanite lives, “because she hid the messengers” (verses 17, 25), and Israel is warned that anyone who takes what is devoted will make himself and the camp accursed (verse 18), which chapter 7 tells of Achan. The outsider who sought mercy and the insider who took the devoted thing, both at Jericho, show the herem testing Canaanite and Israelite alike.

  The chapter closes on the promise of chapter 1 kept: “as I was with Moses, so I will be with thee” ([[Josh. 1:5]]) becomes “So the LORD was with Joshua” (verse 27).

sections:
  - range: 1-5
    heading: The LORD's instructions
    plain: |
      Jericho was shut tight against Israel: no one went out and no one came in. The LORD said to Joshua, “See, I have given Jericho into your hand, with its king and its warriors. All your fighting men are to march around the city once a day for six days. Seven priests are to carry seven ram's-horn trumpets in front of the ark. On the seventh day march around the city seven times, with the priests blowing the trumpets. When they sound a long blast on the horn and you hear the trumpet, all the people are to give a great shout. The city wall will collapse, and the people will go straight in, every man from where he stands.”
  - range: 6-14
    heading: Six days around the city
    plain: |
      Joshua son of Nun called the priests and told them to take up the ark of the covenant, with seven priests carrying seven trumpets in front of it. He told the people to march around the city, with the armed men going ahead of the ark. So they went: the armed men first, then the seven priests blowing their trumpets, then the ark of the covenant, then the rear guard, the trumpets sounding the whole time. Joshua had ordered the people not to shout or make any sound, not to let a word out of their mouths, until the day he told them to shout. The ark went around the city once, and they came back to the camp for the night. Joshua rose early the next morning, the priests took up the ark, and they did the same. On the second day too they marched around the city once and came back to camp, and so they did for six days.
  - range: 15-21
    heading: The seventh day
    plain: |
      On the seventh day they rose at dawn and marched around the city in the same way, but that day seven times. At the seventh time, as the priests blew the trumpets, Joshua said to the people, “Shout, for the LORD has given you the city! The city and everything in it are devoted to the LORD. Only Rahab the harlot shall live, with everyone in her house, because she hid the messengers we sent. But keep away from the devoted things: if you take any of them, you bring the ban on yourselves, make the camp of Israel a cursed thing and bring trouble on it. All the silver and gold, and the vessels of brass and iron, are consecrated to the LORD and go into His treasury.” The people shouted as the trumpets sounded; at the great shout the wall collapsed, and the people went straight up into the city and took it. They put everything in it to the sword, men and women, young and old, cattle, sheep and donkeys.
  - range: 22-25
    heading: Rahab and her household saved
    plain: |
      Joshua told the two men who had spied out the land, “Go into the harlot's house and bring the woman out, with everything she has, as you swore to her.” The young men went in and brought out Rahab, her father, mother and brothers, everything she had and all her family, and settled them outside Israel's camp. Then they burned the city and everything in it, except the silver and gold and the vessels of brass and iron, which they put into the treasury of the LORD's house. Joshua spared Rahab the harlot, her father's household and all that was hers, and she lives in Israel to this day, because she hid the messengers Joshua sent to spy out Jericho.
  - range: 26-27
    heading: The curse, and Joshua's fame
    plain: |
      Then Joshua put the people under oath: “Cursed before the LORD is the man who sets out to rebuild this city of Jericho. He will lay its foundation at the cost of his firstborn and set up its gates at the cost of his youngest son.” So the LORD was with Joshua, and his fame spread through all the land.

notes:
  - ref: 17
    phrase: the city shall be accursed, even it, and all that are therein, to the LORD
    kind: words
    title: Devoted whole to the LORD
    body: |
      At Jericho the whole city, its people and its goods, is declared *ḥērem*, handed over to the LORD, so that nothing in it could be taken as plunder. “Accursed” and “the accursed thing” (verses 17–18) are forms of the same Hebrew word as “utterly destroyed” in verse 21; the word itself is explained at [[Deut. 7:2]]. At Jericho everything the herem could demand is done: the inhabitants and the livestock are killed, the valuable spoil goes into the treasury of the house of the LORD (verse 24), the city is burned, and Joshua curses anyone who would rebuild it (see the note at verse 26).

      Not every city is treated so. At Jericho nothing may be kept; at Ai, the next city, the LORD lets Israel keep the cattle and the spoil ([[Josh. 8:2]]). One reading sorts the conquest into three “gradations” of herem, “absolute” (Jericho), “intermediate” (Ai, Hazor) and “extenuated” (all other cities); the Latter-day Saint study that reports it suggests instead that the practices “were applied ad hoc,” by direction given before each battle. Jericho's direction is verse 19: its metal is “consecrated unto the LORD.” To take any of it is to take what is His.

      Verse 18's warning follows from that, and chapter 7 tells how Achan brought it on himself and on Israel (see the note at [[Josh. 7:1]]).
    sources: [calabro-herem]

  - ref: 20
    phrase: the wall fell down flat
    kind: history
    title: Jericho’s wall and the excavations
    body: |
      The text says the wall fell because the LORD gave the city, and the excavations at Jericho have found no fortified city from the period in which the conquest is usually placed; faithful readers and others account for that gap in different ways. Hebrews reads the fall as faith: “By faith the walls of Jericho fell down, after they were compassed about seven days” ([[Heb. 11:30]]). Elder James E. Talmage answered how in terms of the chapter before: “May we not believe that when Israel encompassed Jericho, the captain of the Lord’s host and his heavenly train were there, and that before their super-mortal agency, sustained by the faith and obedience of the human army, the walls were leveled?” (see the note at [[Josh. 5:14]]).

      Jericho is identified with Tell es-Sultan. Its excavation in the 1950s, like that of et-Tell (thought to be Ai) in the 1960s, “showed an absence of fortified occupation levels at these sites during the latter part of the Late Bronze Age,” the period in which those who see a historical core in the account generally place the conquest. That finding has led most scholars to question the historicity of the battle, “with a minority of scholars arguing against this negative consensus.” Some take the evidence to mean the account is “either fabricated or greatly exaggerated.” One defender argues from the text that Jericho and Ai were fortresses rather than populous cities, which would explain the missing destruction layers, though the Latter-day Saint study that reports him finds some of his readings “strained.”

      On present evidence, archaeology “is still insufficient to prove or disprove” the account, “but there are various ways in which the evidence could fit with aspects of the biblical account.” Ai's own case is taken up at [[Josh. 8:28]].
    sources: [lds-scriptures, ot-manual-josh, calabro-herem, ot-minute-josh-6]

  - ref: 21
    phrase: they utterly destroyed all that was in the city
    kind: history
    title: Why all Jericho was destroyed
    body: |
      The verse says plainly that Israel killed everyone in Jericho, of every age, with its animals; the Church reads this as the LORD's judgment on a people long in rebellion against Him, and the chapter itself shows mercy given to the one household in the city that sought it. The Church's reading, drawn from the Book of Mormon, is that the destruction followed the Canaanites' long rebellion against the Lord, after He had given them every chance to repent; it is set out in full at [[Deut. 7:2]], in the second note there.

      What Joshua 6 adds is its own counterweight. Nephi, explaining this conquest to his brothers, begins: “the Lord esteemeth all flesh in one; he that is righteous is favored of God” ([[1 Ne. 17:35]]). In the chapter that tells of the slaughter, a Canaanite family is brought out alive (verses 22–25). On one Latter-day Saint reading the herem tested the Canaanites as well as Israel: Gibeon, and Rahab with her family, “are the only ones who ask for mercy in the text, and they obtain it.” The same study sets Rahab beside Achan, the Israelite who kept spoil from Jericho, so that “Achan and his family become objects of the ḥērem themselves” (chapter 7), and concludes that the herem had “nothing to do with ethnic or national affiliation and everything to do with personal righteousness.”

      How far “all that was in the city” is meant literally is less certain. The narrative presents the herem as “a divinely ordered act in which God himself participates” and leaves its “moral implications” unaddressed. The same study reads the absolute language of the region's war texts as the idiom of the time and judges that “Many Canaanites likely fled and sought refuge elsewhere”; the fuller argument, with the study's own caution about what it does not resolve, is at [[Deut. 7:2]].
    sources: [scripture-helps-violence, lds-scriptures, calabro-herem]

  - ref: 25
    phrase: she dwelleth in Israel even unto this day
    kind: scripture
    title: Rahab dwells in Israel
    body: |
      The spies' oath to Rahab is kept to the letter: she and the whole household she asked for live, and she is still in Israel when the account is written. Verse 23 names them, father, mother, brethren and “all her kindred,” the very people of her request, “my father, and my mother, and my brethren, and my sisters” ([[Josh. 2:13]]). The oath and the scarlet line are explained at [[Josh. 2:12]] and [[Josh. 2:18]].

      To dwell in Israel is more than to survive. Rabbinic commentators read the phrase “to mean that Rahab cast off her prior ways and joined Israel with full heart and conviction,” and one Latter-day Saint study sets it beside the LORD's promise through Jeremiah that those of the nations who learn to swear by His name “shall they be built in the midst of my people” ([[Jer. 12:16]]).

      Matthew's genealogy of Jesus names a Rachab as the mother of Boaz: “Salmon begat Booz of Rachab” ([[Matt. 1:5]]). Christian tradition, drawn from that verse, takes her to be Rahab of Jericho, and so an ancestor through Boaz, who married Ruth, of David and of Jesus Christ; Jewish tradition instead has Rahab marry Joshua. “Nothing demonstrates Rahab’s complete assimilation and unification into her new community more than her marriage and prestigious place in the genealogies of the people.” Why Matthew names her among four women is taken up at [[Gen. 38:29]]; what scripture says of her is gathered in [Women and Marriage](/old-testament/guides/women-and-marriage/#the-women).
    sources: [fisher-rahab, lds-scriptures]

  - ref: 26
    phrase: he shall lay the foundation thereof in his firstborn
    kind: scripture
    title: The price of rebuilding Jericho
    body: |
      Joshua's oath puts a price on rebuilding Jericho, the builder's own sons, and 1 Kings records it coming true. The curse completes the herem on the city (see the note at verse 17). One older reading takes the Hebrew “in” as marking the price of a thing, so that the builder would pay for the city “by the loss of all his sons, from the first-born to the very youngest.” The same reading takes “buildeth” as restoring Jericho as a fortified town, its foundation and its gates, not as living on the site, since a town of Jericho stood in David's day ([[2 Sam. 10:5]]).

      In Ahab's reign Hiel of Bethel rebuilt Jericho at the cost of his firstborn Abiram and his youngest son Segub, and 1 Kings counts Joshua's curse as “the word of the LORD” ([[1 Kgs. 16:34]]).
    sources: [keil-joshua, calabro-herem, lds-scriptures]

christ: |
  The LORD who gives Jericho into Joshua's hand is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]), and the captain of His host who met Joshua outside the city was “possibly Jehovah Himself” (see the note at [[Josh. 5:14]]). Hebrews counts the day's two outcomes as faith: the wall that fell, and the woman who “perished not with them that believed not, when she had received the spies with peace” ([[Heb. 11:31]]). The Canaanite who turned to Him is, in Christian tradition, the Rachab of Matthew's genealogy of the Savior (see the note at verse 25).

  Israel received the LORD's power at Jericho only as it did what He instructed, though the instructions must have seemed strange. A disciple receives His power the same way, by obedience to directions whose purpose is not yet plain. And His mercy at Jericho followed no line of birth: it went to the one household that sought it, as it goes to anyone who seeks Him (see the note at verse 21).

explore: |
  - [[Josh. 2]] and [[Josh. 7]]: Rahab and Achan, the outsider who sought mercy and the insider who took the devoted thing, on either side of Jericho.
  - [[Heb. 11:30–31]] and [[James 2:25]]: the New Testament's reading of the walls and of Rahab.
  - [“Thou Shalt Utterly Destroy”: Understanding the Biblical Ḥērem](https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy) (Religious Studies Center, 2025): the fullest Latter-day Saint study of the herem, with a section on Jericho, Rahab and Achan.

