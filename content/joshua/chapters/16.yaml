chapter: 16
title: The Lot of the Children of Joseph
tagline: Joseph's house draws one lot, Ephraim's border is traced first, and the chapter ends with Canaanites still living in Gezer as Ephraim's laborers.
when: 'As the land is divided by lot, after Judah’s portion'

setting: |
  Joshua 16 is the second allotment in the book's list of the tribes' lands. Judah's portion fills chapter 15; then comes the house of Joseph, told over two chapters, Ephraim here and Manasseh in chapter 17. Joseph's lot is drawn as one and divided between his two sons' tribes (why Joseph counts as two tribes is explained at [[Gen. 48:5]]), and the description of it is “fragmentary and terse” beside Judah's long list of towns.

  The land itself was some of the best in Canaan: the country of Joseph's sons “included some of the richest land in the country, crossed by several important highways,” with Shechem, Ebal, Gerizim and Shiloh inside it. Joshua himself was of Ephraim ([[Num. 13:8]]), and he will receive his own city “in mount Ephraim” at the end of the allotment ([[Josh. 19:50]]).

  Why the book gives these lists at all, and how its picture of a land fully taken fits with land still to be possessed, are taken up at [[Josh. 13:1]].

thread: |
  The chapter moves from the whole to the part, and then to what was left undone. Verses 1–4 trace the southern edge of the land of Joseph, from the Jordan by Jericho up through the hills of Bethel and down to the sea; that outline “frames” the two allotments that follow. Verses 5–8 then give Ephraim's own border, “according to their families.”

  The last two verses add what a map line cannot show. Ephraim also held towns set apart inside Manasseh's land (verse 9), and in Gezer, on the border traced in verse 3, the Canaanites were not driven out but stayed on as forced laborers (verse 10). Like Judah's chapter, which ends with the Jebusites still in Jerusalem ([[Josh. 15:63]]), Ephraim's ends with an inheritance received but not fully possessed.

sections:
  - range: 1-4
    heading: Joseph's lot
    plain: |
      The lot of Joseph's descendants ran from the Jordan at Jericho, east of the waters of Jericho, through the wilderness that climbs from Jericho into the hill country of Bethel. From Bethel it went on to Luz, passed along the border of Archi to Ataroth, and went down westward to the border of Japhleti, as far as Lower Beth-horon and Gezer, ending at the Mediterranean Sea. So Joseph's descendants, Manasseh and Ephraim, received their inheritance.
  - range: 5-8
    heading: Ephraim's border
    plain: |
      This was the territory of the Ephraimites, clan by clan. On the east their border ran from Ataroth-addar to Upper Beth-horon, and on to the sea. On the north it went from Michmethah around eastward to Taanath-shiloh, passed it on the east to Janohah, then went down from Janohah to Ataroth and Naarath, reached Jericho, and came out at the Jordan. From Tappuah the border went west to the river Kanah and ended at the sea. This was the inheritance of the tribe of Ephraim, clan by clan.
  - range: 9-10
    heading: Towns in Manasseh, and Gezer
    plain: |
      Ephraim also had towns set apart for it within Manasseh's inheritance, all those towns with their villages. But the Ephraimites did not drive out the Canaanites who lived in Gezer. The Canaanites live among the Ephraimites to this day, made to serve as forced laborers.

notes:
  - ref: 5
    phrase: the border of the children of Ephraim according to their families
    kind: history
    title: Ephraim, the younger son’s tribe
    body: |
      Ephraim, whose border verses 5–8 trace, was the tribe of “the second son of Joseph,” whom Jacob “set before Manasseh, the elder son”: “his younger brother shall be greater than he… and he set Ephraim before Manasseh” ([[Gen. 48:19–20]]). Chronicles says that Reuben's “birthright was given unto the sons of Joseph the son of Israel” ([[1 Chr. 5:1]]), and Ephraim “was given the birthright in Israel.” Joshua was of this tribe, and “to him was due much of its subsequent greatness.” The text gives no reason for describing Ephraim's border before Manasseh's, though verse 4 names Manasseh first.
    sources: [bd-ephraim, ot-minute-josh-16, lds-scriptures]

  - ref: 9
    phrase: the separate cities for the children of Ephraim
    kind: words
    title: Towns set apart inside Manasseh
    body: |
      The “separate cities” are towns portioned off for Ephraim within Manasseh's land, added to Ephraim's inheritance. One older reading renders the phrase “the places which were portioned off,” and notes that the King James translators supplied the word “were”: read without it, the verse continues verse 8, so that to “the inheritance of the children of Ephraim” are added “the ‘separate’ or ‘single’ cities allotted to the tribe within the borders of Manasseh.” Tappuah was one of them: “Tappuah on the border of Manasseh belonged to the children of Ephraim” ([[Josh. 17:8]]).

      The text gives no reason. Two older commentaries report the suggestion that Ephraim's territory was found “too small in proportion to its strength”; one of them calls it “quite possible” but adds that “there may have been other reasons which we cannot discover now,” since Manasseh likewise received towns inside Issachar and Asher ([[Josh. 17:11]]).
    sources: [cambridge-joshua, keil-joshua, lds-scriptures]

  - ref: 10
    phrase: they drave not out the Canaanites that dwelt in Gezer
    kind: history
    title: Gezer, a labor gang instead of a conquest
    body: |
      Ephraim left the Canaanites of Gezer in place and put them to forced labor. “Serve under tribute” is a matter of labor in the Hebrew: *mas* is a “labour-band” or “body of forced labourers,” used “of conquered populations, subject to forced labour,” in this verse as in the terms the law offered a city that made peace ([[Deut. 20:11]]). “Tribute” is a late sense of the word, not its biblical one.

      The verse gives no reason why Ephraim did not drive them out. The failure “will feature later, in the book of Judges, as part of the reason for continual strife,” and Judges repeats it: “Neither did Ephraim drive out the Canaanites that dwelt in Gezer; but the Canaanites dwelt in Gezer among them” ([[Judg. 1:29]]). Scripture's last word on Gezer's Canaanites comes in Solomon's reign, when Pharaoh “had gone up, and taken Gezer, and burnt it with fire, and slain the Canaanites that dwelt in the city, and given it for a present unto his daughter, Solomon’s wife” ([[1 Kgs. 9:16]]). How land left unpossessed fits with the book's statement that Joshua “took the whole land” is taken up at [[Josh. 13:1]].
    sources: [bdb, ot-minute-josh-16, lds-scriptures]

christ: |
  The LORD who divided the land by lot is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]). Joseph's lot is one entry in the book's account of His promise kept: “There failed not ought of any good thing which the LORD had spoken unto the house of Israel; all came to pass” ([[Josh. 21:45]]).

  Ephraim's place among the tribes did not end with a border. In the last days it has been the tribe's privilege “first to bear the message of the Restoration of the gospel to the world and to gather scattered Israel.” In the revelation on that gathering, the returning tribes are “crowned with glory, even in Zion, by the hands of the servants of the Lord, even the children of Ephraim” ([[D&C 133:32]]). Disciples who carry the restored gospel to others share in that work of gathering.

explore: |
  - [[Gen. 48]] and [[Deut. 33:13–17]]: the blessings of Jacob and Moses on Joseph and his sons.
  - [[Josh. 17]]: Manasseh's half of Joseph's lot, and the house of Joseph asking for more land.
  - [[Josh. 15:63]], [[Josh. 17:12–13]] and [[Judg. 1:27–35]]: the Canaanites left in the land, tribe by tribe.
  - [[D&C 133:26–34]]: the latter-day gathering and the “richer blessing” on Ephraim.

sources: [lds-scriptures, ot-minute-josh-16, bd-ephraim, keil-joshua, cambridge-joshua, bdb]
