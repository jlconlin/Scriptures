chapter: 15
title: The Lot of the Tribe of the Children of Judah
tagline: Judah's borders and towns are drawn first; inside the list, Caleb takes Hebron, his daughter asks for springs, and Jerusalem stays unconquered.
when: 'After the wars, when the land is divided by lot'

setting: |
  Chapter 14 opened the division of the land west of the Jordan, made “by lot” ([[Josh. 14:2]]; on the lot, see [[Num. 26:55]]), and gave Caleb Hebron as the LORD had promised him (how Caleb asked for it is told at [[Josh. 14:6]]). Chapter 15 carries Judah's allotment on: a border traced all the way round the tribe (verses 1–12), a short story of how Caleb's house secured its share (13–19), and a list of Judah's towns by region (20–62). The last verse names a city Judah could not take, Jerusalem (63).

  Judah's south border runs through the same places as the south border of the land the LORD described to Moses, from “the wilderness of Zin along by the coast of Edom” and “the outmost coast of the salt sea eastward” ([[Num. 34:3]]) past Kadesh-barnea and Azmon to “the river of Egypt” ([[Num. 34:4–5]]). The description runs counterclockwise, south, east, north and then west, and the boundaries “appear to be more idealistic than concretely historical,” what the writer “probably thought deservedly belonged to Judah.” How the book's two pictures of the land, taken and still to be taken, fit together is set out at [[Josh. 13:1]]; the guide [The Land](/old-testament/guides/the-land/#inheritance) has the tribes and their territories.

thread: |
  The list is the LORD's promise made concrete. He had told Joshua, “unto this people shalt thou divide for an inheritance the land, which I sware unto their fathers to give them” ([[Josh. 1:6]]), and here Judah's share is drawn line by line and town by town, “according to their families” (verses 12, 20).

  Two passages break the list, and they face each other. In the middle, Caleb, who had asked for the mountain where the Anakims were, with the words “if so be the LORD will be with me, then I shall be able to drive them out” ([[Josh. 14:12]]), does drive them out, and his daughter asks for and receives springs of water for her dry land (verses 13–19). At the end, the tribe “could not drive them out” of Jerusalem (verse 63). The chapter that gives Judah its whole inheritance by lot closes on a city still to be taken.

sections:
  - range: 1-12
    heading: Judah's borders
    plain: |
      This was the lot that fell to the tribe of Judah, family by family. Its southern edge reached the border of Edom and the wilderness of Zin, at the far south. The south border began at the southern tip of the Salt Sea (the Dead Sea), went out on the south side to Maaleh-acrabbim, on to Zin, up to the south of Kadesh-barnea, past Hezron, up to Adar, and curved round to Karkaa. From there it passed Azmon and went out to the river of Egypt and on to the Mediterranean; that was the south border. The east border was the Salt Sea, up to where the Jordan flows in. The north border started at that bay, where the Jordan enters the sea, climbed to Beth-hogla, passed north of Beth-arabah, and went up to the Stone of Bohan, son of Reuben. It went up toward Debir from the valley of Achor (see [[Josh. 7:26]]), turned north toward Gilgal, opposite the ascent of Adummim south of the river, passed the waters of En-shemesh and came out at En-rogel. Then it climbed the valley of the son of Hinnom along the southern slope of the Jebusite city, that is, Jerusalem, up to the top of the hill west of the valley of Hinnom, at the north end of the valley of the giants. From that hilltop it ran to the spring of the waters of Nephtoah, out to the towns of Mount Ephron, and to Baalah, that is, Kirjath-jearim. It turned west from Baalah to Mount Seir, along the north slope of Mount Jearim (Chesalon), down to Beth-shemesh and on to Timnah, out to the slope north of Ekron, to Shicron, past Mount Baalah, out to Jabneel, and ended at the sea. The west border was the Mediterranean and its coast. These were Judah's borders all around, family by family.
  - range: 13-19
    heading: Caleb, Othniel and Achsah
    plain: |
      As the LORD had commanded Joshua, he gave Caleb son of Jephunneh a portion within Judah: Kirjath-arba (the city of Arba, father of Anak), which is Hebron. Caleb drove out from there the three sons of Anak, Sheshai, Ahiman and Talmai. From there he went up against the people of Debir, which used to be called Kirjath-sepher. Caleb said, “Whoever attacks Kirjath-sepher and takes it, I will give him my daughter Achsah as his wife.” Othniel son of Kenaz, Caleb's brother, took it, and Caleb gave him Achsah as his wife. When she came to him, she urged him to ask her father for a field. She got down from her donkey, and Caleb asked her, “What do you want?” She answered, “Give me a gift. Since you have given me dry country in the south, give me springs of water too.” So he gave her the upper springs and the lower springs.
  - range: 20-62
    heading: The towns of Judah
    plain: |
      This is the inheritance of the tribe of Judah, family by family. The towns are listed by region. In the far south, toward Edom, from Kabzeel to Ain and Rimmon, with Beer-sheba, Hormah and Ziklag among them, the count is twenty-nine towns with their villages (verses 21–32). In the valley come groups of fourteen, sixteen and nine towns, among them Zoreah, Adullam, Azekah, Lachish and Keilah (verses 33–44), and then Ekron, Ashdod and Gaza with their towns and villages, as far as the river of Egypt and the Mediterranean (verses 45–47). In the hill country come groups of eleven, nine, ten, six and two towns, among them Debir, Hebron, Carmel, Ziph and Kirjath-jearim (verses 48–60). In the wilderness, toward the Dead Sea, there are six, among them the City of Salt and En-gedi (verses 61–62).
  - range: 63
    heading: Jerusalem not taken
    plain: |
      As for the Jebusites who lived in Jerusalem, the people of Judah could not drive them out, and the Jebusites still live among the people of Judah in Jerusalem to this day.

notes:
  - ref: 8
    phrase: the valley of the son of Hinnom unto the south side of the Jebusite; the same is Jerusalem
    kind: history
    title: Jerusalem on the line
    body: |
      Judah's northern border runs right under Jerusalem, up the valley of Hinnom “unto the south side of the Jebusite,” the city the verse identifies as Jerusalem. The valley lies “South and west of Jerusalem.” It is the valley that later became the scene of “the idolatrous worship of the fire-god Moloch,” then a place of refuse, and in New Testament times “was called Gehenna.” The full story is at [[Jer. 7:31]].

      Benjamin's border, drawn in chapter 18, follows the same valley “to the side of Jebusi on the south” ([[Josh. 18:16]]), and the list of Benjamin's cities includes “Jebusi, which is Jerusalem” ([[Josh. 18:28]]). Both tribes are named with the city when it is not taken: Judah here at verse 63, Benjamin at [[Judg. 1:21]].
    sources: [bd-hinnom-valley-of, lds-scriptures]

  - ref: 14
    phrase: Caleb drove thence the three sons of Anak, Sheshai, and Ahiman, and Talmai
    kind: scripture
    title: The giants the ten spies feared
    body: |
      The three names are the ones the spies found at Hebron forty-five years before: “Ahiman, Sheshai, and Talmai, the children of Anak” ([[Num. 13:22]]; who the Anakims were is explained at [[Deut. 1:28]]). The spies who brought the evil report said Israel could not face them ([[Num. 13:31–33]]). Caleb, now eighty-five ([[Josh. 14:10]]), asked for their city on the strength of the LORD's word ([[Josh. 14:12]]), and here he drives them out.

      The book has already said that Joshua “cut off the Anakims from the mountains, from Hebron, from Debir” ([[Josh. 11:21]]; see also [[Josh. 10:36–39]]). Though Judah's claim was settled, Caleb and other Judahite heroes “nevertheless had to deal with lingering Canaanite threats”; why cities said to be utterly destroyed had to be taken again is discussed at [[Josh. 11:21]] and [[Josh. 10:40]]. Judges tells the same victory as Judah's: “they slew Sheshai, and Ahiman, and Talmai,” and Hebron was given to Caleb, “and he expelled thence the three sons of Anak” ([[Judg. 1:10]], [[Judg. 1:20]]). Hebron stayed in his family's hands: it was “still in the possession of his family in the time of David.”
    sources: [lds-scriptures, ot-minute-josh-15, bd-caleb]

  - ref: 17
    phrase: Othniel the son of Kenaz, the brother of Caleb
    kind: history
    title: A daughter promised, and the first judge
    body: |
      Caleb's prize, his daughter, is read by one older commentary as a sign of how hard Debir was to take: the town “must have been very strong and hard to conquer,” and Saul would later make the same kind of promise to the man who killed Goliath ([[1 Sam. 17:25]]).

      The man who won her was Caleb's own brother, and later a hero in his own right. The Hebrew phrase can be read two ways, “the son of Kenaz (and) brother of Caleb” or “the son of Kenaz the brother of Caleb,” so that Othniel could be Caleb's brother or his nephew; Judges settles it: “Othniel the son of Kenaz, Caleb's younger brother” ([[Judg. 1:13]]). Othniel “later served as the first of Israel's judges.” When Israel cried to the LORD, He “raised up a deliverer … even Othniel” ([[Judg. 3:9]]), and “the Spirit of the LORD came upon him, and he judged Israel” ([[Judg. 3:10]]).
    sources: [keil-joshua, ot-minute-josh-15, lds-scriptures]

  - ref: 19
    phrase: Give me a blessing; for thou hast given me a south land; give me also springs of water
    kind: words
    title: Give me a blessing
    body: |
      Achsah asks her father for a gift, and the gift is water. In this verse, as in Jacob's gift to Esau ([[Gen. 33:11]]), the Hebrew *berakah*, “blessing,” means “a gift, present.” “A south land” is *ha-negeb*, which is also the name of the dry country south of Judah (verse 21). One older reading takes it here not as the region's name but as “the dry or arid land,” so that what she asks for is “a piece of land with springs of water in it.” “The upper springs, and the nether springs” may be an old place name.

      The same reading notices how she asks. She gets down from her donkey, and on that reading “Alighting from an animal was a special sign of reverence,” so that Caleb knew she had a request and asked, “What wouldest thou?” (verse 18). The text says she “moved him,” her new husband, to ask for a field, but it is she who speaks. [[Judg. 1:14–15]] tells the story again nearly word for word. The guide [Women and Marriage](/old-testament/guides/women-and-marriage/#the-women) sets her beside the other women of these books.
    sources: [bdb, oshb-wlc, keil-joshua, lds-scriptures]

  - ref: 63
    phrase: the children of Judah could not drive them out
    kind: history
    title: The city Judah could not take
    body: |
      Jerusalem was a Jebusite city until David took it. Judges says both that Judah “had fought against Jerusalem, and had taken it, and smitten it with the edge of the sword, and set the city on fire” ([[Judg. 1:8]]), and that Benjamin “did not drive out the Jebusites that inhabited Jerusalem” ([[Judg. 1:21]]). David took it in the end ([[2 Sam. 5:6–9]]): the city was “a hill fortress, which maintained its independence until stormed by David.” (On the border that runs past the city, see the note at verse 8.)

      “Unto this day” shows that some time has passed between the events and the writing. Taken at face value, it may mean that the book, or an early version of it, was written before David took Jerusalem; it could also be “merely the same kind of formulaic postscript that occurs elsewhere” (the same words close [[Josh. 16:10]]). Neither reading is certain. The chapter that measured out Judah's inheritance so fully closes, then, on the one city the tribe could not take; [[Josh. 13:1]] sets the book's two pictures of the land side by side.
    sources: [lds-scriptures, bd-jebus, ot-minute-josh-15]

christ: |
  The LORD who gave Judah its lot is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]). When the spies returned, He had said of Caleb, “because he had another spirit with him, and hath followed me fully, him will I bring into the land whereinto he went; and his seed shall possess it” ([[Num. 14:24]]). In this chapter both halves of that promise are kept: Caleb takes the city of the giants, and his daughter receives land and springs of water.

  The Lord's word to a disciple is kept in the same way, even when, as with Caleb's forty-five years ([[Josh. 14:10]]), the keeping comes long after the promise: “I, the Lord, am bound when ye do what I say” ([[D&C 82:10]]).

explore: |
  - [[Josh. 14:6–15]]: Caleb asks for Hebron.
  - [[Num. 34:1–12]]: the borders of the land given to Moses, which Judah's south border follows.
  - [[Judg. 1:8–21]]: Hebron, Debir, Achsah and Jerusalem told again.
  - [[Judg. 3:7–11]]: Othniel, the first judge.
  - [[2 Sam. 5:6–9]]: David takes Jerusalem from the Jebusites.

sources: [lds-scriptures, ot-minute-josh-15, keil-joshua, bd-hinnom-valley-of, bd-caleb, bd-jebus, bdb, oshb-wlc]
