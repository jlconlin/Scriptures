chapter: 4
title: What Mean Ye by These Stones?
tagline: 'Twelve men carry twelve stones out of the riverbed, the ark comes up last, the Jordan flows back over its banks, and at Gilgal Joshua sets up the stones and gives the fathers their answer for the children who will ask.'
when: 'At the Jordan and at Gilgal, on the tenth day of the first month'

setting: |
  Chapter 4 finishes the crossing that chapter 3 began. The story is told in layers: the crossing “first briefly” in [[Josh. 3:14–17]], “then more completely” in 4:1–11, with “supplementary notices” in 4:12–17 and the river's return to close it. So the people are already over in verse 1, and the ark is still standing in the riverbed until verse 18. How the waters stood “upon an heap” is explained at [[Josh. 3:16]].

  The chapter keeps two promises. The LORD had told Joshua, “This day will I begin to magnify thee in the sight of all Israel, that they may know that, as I was with Moses, so I will be with thee” ([[Josh. 3:7]]); verse 14 reports it done. And the eastern tribes cross armed before their brethren, as they had pledged to Moses ([[Num. 32:20–22]]; [[Josh. 1:16]]).

  Later scripture remembers the day. The Psalms sing, “Jordan was driven back” ([[Ps. 114:3]]), and Micah's “from Shittim unto Gilgal” ([[Micah 6:5]]) runs from the last camp east of the river ([[Josh. 3:1]]) to the first camp west of it (see the note at [[Micah 6:5]]). Gilgal, where the chapter ends, is the camp to which Joshua will return from his wars ([[Josh. 10:15]]).

thread: |
  The chapter is about **a memorial, and the question it is meant to raise.** The LORD commands it before anyone has left the riverbed: twelve stones from the spot where the priests stood, one for each tribe, carried on twelve men's shoulders to the night's camp (verses 1–8). Their purpose is stated in advance: “when your children ask their fathers in time to come, saying, What mean ye by these stones?” (verse 6).

  The answer is given twice. At the river it is about the ark: “the waters of Jordan were cut off before the ark of the covenant of the LORD” (verse 7), and the narrative bears it out, since the water returns only when the priests' feet touch the dry bank (verse 18). At Gilgal, with the stones set up, Joshua gives the fuller answer: “Israel came over this Jordan on dry land,” as their fathers had crossed the Red Sea, so that the nations “might know the hand of the LORD” and Israel “might fear the LORD your God for ever” (verses 22–24). The Exodus is the pattern; the monument makes the new crossing into a story to be told “to remind future Israelite generations of their national triumph.”

sections:
  - range: 1-8
    heading: Twelve stones from the riverbed
    plain: |
      When the whole nation had finished crossing the Jordan, the LORD said to Joshua: Choose twelve men from the people, one from each tribe, and tell them to take twelve stones from the middle of the Jordan, from the very place where the priests' feet stood firm, carry them over, and set them down in the camp where you will spend tonight.

      Joshua called the twelve men he had appointed, one from each tribe, and told them: Go ahead of the ark of the LORD your God into the middle of the Jordan, and each of you lift a stone onto his shoulder, one for each tribe of Israel. They will be a sign among you. In time to come, when your children ask, “What do these stones mean to you?” tell them that the waters of the Jordan were cut off in front of the ark of the LORD's covenant; when it crossed the Jordan, the waters were cut off. These stones are to be a memorial for Israel forever. The Israelites did as Joshua commanded, as the LORD had told him: they took twelve stones out of the Jordan, one for each tribe, carried them to the camp, and set them down there.
  - range: 9-14
    heading: The ark waits until all have crossed
    plain: |
      Joshua set up twelve stones in the middle of the Jordan, where the feet of the priests carrying the ark of the covenant had stood, and they are there to this day. The priests who carried the ark stood in the middle of the Jordan until everything the LORD had commanded Joshua to tell the people was done, just as Moses had charged Joshua; and the people hurried across. When all the people had crossed, the ark of the LORD and the priests crossed over in the sight of the people.

      The men of Reuben, Gad and the half tribe of Manasseh crossed over armed ahead of the rest of Israel, as Moses had told them: about forty thousand men ready for war crossed before the LORD to the plains of Jericho for battle. That day the LORD made Joshua great in the eyes of all Israel, and they revered him all his life as they had revered Moses.
  - range: 15-18
    heading: The river returns
    plain: |
      The LORD said to Joshua, Command the priests who carry the ark of the testimony to come up out of the Jordan. So Joshua commanded them, Come up out of the Jordan. As soon as the priests carrying the ark of the LORD's covenant came up out of the riverbed and their feet stepped onto dry ground, the waters of the Jordan came back to their place and overflowed all its banks as before.
  - range: 19-24
    heading: The stones at Gilgal
    plain: |
      The people came up out of the Jordan on the tenth day of the first month and camped at Gilgal, on the eastern edge of Jericho's land. There Joshua set up the twelve stones they had taken from the Jordan, and he said to the Israelites: In time to come, when your children ask their fathers, “What do these stones mean?” tell them, “Israel crossed this Jordan on dry ground.” For the LORD your God dried up the Jordan in front of you until you had crossed, just as He dried up the Red Sea in front of us until we had crossed, so that all the peoples of the earth would know how strong the LORD's hand is, and so that you would always fear the LORD your God.

notes:
  - ref: 3
    phrase: out of the place where the priests’ feet stood firm, twelve stones
    kind: symbol
    title: Twelve stones from where the ark stood
    body: |
      The stones are one for each tribe, and one man from each tribe carries one (verses 2, 5, 8). Setting up stones to mark what God had done was already an old practice in Israel's story. Jacob raised a pillar at Bethel and a heap with Laban ([[Gen. 28:18]]; [[Gen. 31:45–48]]), and Moses set up twelve pillars at Sinai ([[Ex. 24:4]]). Such “pillars” (Hebrew *matzevot*) “served a variety of functions, including as memorials, as monuments, and as ritual or cultic objects.” Joshua 4 does not call its stones pillars but a “sign” (verse 6), Hebrew *ʾôt*; even so, the stones “effectively serve the same purpose.”
    sources: [ot-minute-josh-4, turley-smoot-record-keeping, lds-scriptures]

  - ref: 6
    phrase: when your children ask their fathers in time to come
    kind: scripture
    title: A memorial made to be asked about
    body: |
      The stones are meant to make a child ask, and the answer the fathers are given is the story of what the LORD did. The words are almost those of the Passover: “when your children shall say unto you, What mean ye by this service?” ([[Ex. 12:26]]); Deuteronomy asks the same of the law ([[Deut. 6:20]]), and there the father answers, “We were Pharaoh's bondmen in Egypt; and the LORD brought us out” ([[Deut. 6:21]]). Here the answer is that the waters “were cut off before the ark” (verse 7), and at Gilgal that Israel “came over this Jordan on dry land” (verses 21–22).

      Each time a child asked, the story of the miracle would be told again; the stones were set up “to signify the importance of the event for future generations.” The children's question in Exodus, with its answers, is followed on the theme page [When Your Children Ask](/exodus/themes/when-your-children-ask/#question).
    sources: [turley-smoot-record-keeping, lds-scriptures]

  - ref: 9
    phrase: Joshua set up twelve stones in the midst of Jordan
    kind: words
    title: Another twelve stones, or the same?
    body: |
      Read as it stands in the King James, verse 9 sounds like a second monument, raised by Joshua in the riverbed itself, and that is how the older commentaries take it: the Latin Vulgate makes them other stones (“Alios quoque duodecim lapides”), and “Another set of stones is here intended than that just mentioned.” A modern translation reads it instead as the same stones, the ones “that had been in the middle of the Jordan,” and gives the other reading in its footnote, “Or Joshua also set up twelve stones”; another keeps “twelve stones” and sets the whole verse in parentheses. Translators read it both ways.

      “They are there unto this day” is the narrator's voice, writing later than the events (see the setting of [[Josh. 1:1]]); the phrase means “the time when the account was written.” On the older reading, a pile of stones in a riverbed was not likely to stand for centuries, but it was meant “as a memorial for the existing generation and their children.”
    sources: [cambridge-joshua, keil-joshua, niv, nrsvue]

  - ref: 19
    phrase: on the tenth day of the first month
    kind: history
    title: The day the Passover lamb was chosen
    body: |
      The date ties the crossing to the Exodus: Israel crossed the Jordan “on the first day of the Passover.” The tenth day of the first month is the day the law set for choosing the Passover lamb, “In the tenth day of this month they shall take to them every man a lamb” ([[Ex. 12:3]]), to be kept until the fourteenth ([[Ex. 12:6]]). Four days later, at Gilgal, Israel “kept the passover on the fourteenth day of the month” ([[Josh. 5:10]]). The first month is the one called Abib ([[Ex. 13:4]]), “A green head of grain,” the harvest month, known after the Captivity as Nisan.
    sources: [ot-manual-josh, bd-abib, lds-scriptures]

  - ref: 19
    phrase: encamped in Gilgal
    kind: history
    title: Gilgal, the first camp in the land
    body: |
      Gilgal was Israel's first camp west of the Jordan, and the place where the twelve stones stood. The name means “A wheel or circle of stones.” The name itself is explained at [[Josh. 5:9]], where the LORD gives the reason for it.

      The camp became more than a campsite. In the next chapter the men born in the wilderness are circumcised there and the Passover is kept, “thus introducing a ritual or covenant component to the site and its monument.” Gilgal was “a sacred city in the time of Saul,” but “later it was the scene of idolatrous worship,” and Hosea warns Judah away from it (see the note at [[Hos. 4:15]]).
    sources: [bd-gilgal, ot-minute-josh-4]

christ: |
  The LORD who held back the Jordan is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]). In this chapter the ark of His covenant goes into the river first and comes out last: it stands in the riverbed “until every thing was finished” and “all the people were clean passed over” (verses 10–11), and only when it leaves do the waters return (verse 18). Israel crossed “following squarely behind the seat of atonement and trusting fully in the delivering power of Him whom it symbolized.”

  The Jordan “can be likened to the veil we pass through at death,” and the land beyond it can symbolize the celestial kingdom. “Most believers find themselves somewhere in between Sinai (having made sacred covenants with the Lord) and crossing the river Jordan,” and their crossing is made as Israel's was, behind the One the ark symbolized, trusting His power to deliver.

explore: |
  - [[Ex. 14:21–31]] with verse 23: the Red Sea crossing that the Jordan repeats.
  - [[Josh. 5:1–12]]: what was done at Gilgal before Jericho.
  - [[Josh. 24:26–27]]: the great stone Joshua set up at Shechem as a witness of the covenant.
  - [[Ps. 114]] and [[Micah 6:5]]: the crossing remembered in song and in prophecy.

