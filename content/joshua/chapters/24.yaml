chapter: 24
title: Choose You This Day
tagline: At Shechem Joshua recites what the LORD has done for Israel, sets the choice before the people, and binds them by covenant; then he dies, and Joseph's bones are buried in the land.
when: 'Late in Joshua''s life, at Shechem'

setting: |
  Joshua 24 is the book's last scene. In chapter 23 Joshua, old, spoke to Israel's elders and leaders; here he gathers all the tribes to Shechem for a concluding speech to the whole people and a ceremony renewing the covenant. Shechem lay “in a beautiful plain among the mountains of Ephraim, close to the two hills Ebal and Gerizim,” where Israel had already set the blessings and cursings before the people after Ai ([[Josh. 8:30–35]]). Why the place suited is the note at verse 1.

  Joshua speaks in the LORD's name, “Thus saith the LORD God of Israel,” and the speech follows the order of an ancient covenant: an opening that names who makes it, a history of what He has done, the terms, witnesses, and a written record. That pattern, and its use at Shechem, is set out at [[Deut. 27:9]] and in the guide [The Law and the Covenant](/old-testament/guides/law-and-covenant/#renewals). “The other side of the flood” (verses 2, 3, 14, 15) means beyond the River: the word “actually means ‘river,’” here the Euphrates, where Abraham's fathers worshiped other gods; Terah and his gods are explained at [[Gen. 11:31]].

  The chapter, and the book, end with three burials: Joshua in his own inheritance, Joseph's bones in the field Jacob bought at Shechem (see [[Ex. 13:19]] and [[Gen. 33:19]]), and Eleazar the priest. Judges opens by retelling Joshua's death ([[Judg. 2:6–10]]).

thread: |
  Joshua 24 is **a choice made with the whole history in view.** For twelve verses the LORD speaks through Joshua in the first person, from Terah beyond the River to the land Israel now lives in: “I took your father Abraham… I sent Moses also… I brought you into the land… I have given you a land for which ye did not labour.” The survey of God's dealings serves “to emphasize God’s faithfulness in upholding His covenant with Israel,” and then comes the turn, “Now therefore” (verse 14): what the LORD has done is the reason to serve Him and to put away every other god.

  The rest is a conversation. Joshua sets out the choice and makes his own (verse 15); the people answer (verses 16–18); and from verse 19 the speech becomes “more of a dialogue with the assembly,” in which Joshua presses and the people answer three times more, until the covenant is made, written and given a witness in stone (verses 25–27). The last verses bury a generation, and verse 31 says how long the covenant they had made held.

sections:
  - range: 1-13
    heading: What the LORD has done
    plain: |
      Joshua gathered all the tribes of Israel to Shechem and summoned the elders of Israel, its heads, its judges and its officers, and they presented themselves before God. Joshua said to all the people, “This is what the LORD, the God of Israel, says: ‘Long ago your fathers, Terah the father of Abraham and of Nahor, lived beyond the River, and they served other gods. I took your father Abraham from beyond the River, led him through all the land of Canaan, multiplied his descendants and gave him Isaac. To Isaac I gave Jacob and Esau. I gave Esau the hill country of Seir to possess, but Jacob and his children went down into Egypt. I sent Moses and Aaron, and I struck Egypt with plagues by what I did among them, and afterward I brought you out.

      “‘I brought your fathers out of Egypt, and you came to the sea, and the Egyptians pursued your fathers with chariots and horsemen to the Red Sea. When they cried to the LORD, He put darkness between you and the Egyptians and brought the sea over them and covered them. You saw with your own eyes what I did in Egypt. Then you lived in the wilderness a long time. I brought you into the land of the Amorites who lived east of the Jordan; they fought you, and I gave them into your hand, and you took their land, and I destroyed them before you. Then Balak son of Zippor, king of Moab, set out to fight Israel and sent for Balaam son of Beor to curse you. But I would not listen to Balaam, and so he blessed you instead; I delivered you out of his hand.

      “‘You crossed the Jordan and came to Jericho, and the men of Jericho fought against you, as did the Amorites, Perizzites, Canaanites, Hittites, Girgashites, Hivites and Jebusites, and I gave them into your hand. I sent the hornet ahead of you, which drove them out before you, the two kings of the Amorites too; it was not by your sword or your bow. I gave you a land you had not worked for and cities you had not built, and you live in them; you eat from vineyards and olive groves you did not plant.’”
  - range: 14-24
    heading: Choose you this day
    plain: |
      “So now fear the LORD and serve Him wholeheartedly and faithfully. Put away the gods your fathers served beyond the River and in Egypt, and serve the LORD. If serving the LORD seems wrong to you, then choose today whom you will serve: the gods your fathers served beyond the River, or the gods of the Amorites, in whose land you are living. But as for me and my household, we will serve the LORD.”

      The people answered, “Far be it from us to forsake the LORD to serve other gods! For it is the LORD our God who brought us and our fathers up out of the land of Egypt, out of the house of slavery, who did those great signs before our eyes, and who protected us all along the way we went and among all the peoples we passed through. The LORD drove out before us all the peoples, the Amorites who lived in the land. So we too will serve the LORD, for He is our God.”

      Joshua said to the people, “You cannot serve the LORD, for He is a holy God; He is a jealous God; He will not forgive your transgressions and your sins. If you forsake the LORD and serve foreign gods, He will turn and bring harm on you and consume you, after having done you good.” The people said to Joshua, “No! We will serve the LORD.” Joshua said to the people, “You are witnesses against yourselves that you have chosen the LORD, to serve Him.” They said, “We are witnesses.” “Then put away the foreign gods that are among you,” he said, “and turn your hearts to the LORD, the God of Israel.” The people said to Joshua, “We will serve the LORD our God, and we will obey His voice.”
  - range: 25-28
    heading: A covenant at Shechem
    plain: |
      So Joshua made a covenant with the people that day, and there at Shechem he set a statute and an ordinance for them. Joshua wrote these words in the book of the law of God. He took a large stone and set it up there under the oak that was by the sanctuary of the LORD. Joshua said to all the people, “See, this stone will be a witness to us, for it has heard all the words the LORD spoke to us. It will be a witness to you, so that you do not deny your God.” Then Joshua sent the people away, each to his own inheritance.
  - range: 29-33
    heading: Three burials
    plain: |
      After these things Joshua son of Nun, the servant of the LORD, died at the age of a hundred and ten. They buried him within the border of his inheritance at Timnath-serah, in the hill country of Ephraim, north of the hill of Gaash. Israel served the LORD all the days of Joshua and all the days of the elders who outlived him and who had known all the works the LORD had done for Israel.

      The bones of Joseph, which the Israelites had brought up from Egypt, they buried at Shechem, in the piece of ground Jacob had bought from the sons of Hamor, the father of Shechem, for a hundred pieces of silver; it became an inheritance of Joseph's descendants. Eleazar son of Aaron died, and they buried him on the hill that belonged to his son Phinehas, which had been given to him in the hill country of Ephraim.

notes:
  - ref: 1
    phrase: gathered all the tribes of Israel to Shechem
    kind: history
    title: Why Shechem
    body: |
      Joshua gathers Israel at Shechem because it was holy ground long before Israel came. It was “the most ancient of the sacred towns of the children of Israel”: Abram, on his first arrival in the land, built an altar there where the LORD appeared to him ([[Gen. 12:6–7]]); Jacob bought ground there ([[Gen. 33:19]]), and before going up to Beth-el he buried his household's foreign gods, “and Jacob hid them under the oak which was by Shechem” ([[Gen. 35:4]]).

      One older reading holds that the place itself carried Joshua's message. Shechem was “sanctified as no other was for such a purpose as this by the most sacred reminiscences from the times of the patriarchs,” and Joshua chose it “because this act involved a practical renunciation on the part of Israel of all idolatry,” the renunciation he asks for in verse 23. The same reading takes “before God” to mark the assembly as a religious act done in God's name, not to show that the ark had been brought there.
    sources: [bd-shechem, lds-scriptures, keil-joshua]

  - ref: 14
    phrase: serve him in sincerity and in truth
    kind: words
    title: Wholehearted service
    body: |
      “Sincerity” here means wholeness: Joshua asks for service that keeps nothing back for another god. The Hebrew is *bĕtāmîm*, from *tāmîm*, “complete, whole, perfect, blameless”; paired with *ʾĕmet*, “truth,” it describes what is “complete, entirely in accord with truth and fact.” The next words say what it excludes: “put away the gods which your fathers served.”

      The same Hebrew word is also translated “perfect,” and one study reads it as covenant language: in this verse “God commanded the people to covenant to serve the Lord rather than serving other gods,” and “a covenant to follow God’s way, rather than any other way, is one possible way to understand perfection.” It sets the Savior's command to the Nephites, “I would that ye should be perfect even as I, or your Father who is in heaven is perfect” ([[3 Ne. 12:48]]), beside Shechem: “Just as the people in Joshua 24 covenanted to devote themselves to the Lord and reject paganism completely, so in 3 Nephi people were commanded to reject Mosaic customs in favor of Christ’s new way.”
    sources: [oshb-wlc, bdb, sc-knowhy-335]

  - ref: 15
    phrase: choose you this day whom ye will serve
    kind: scripture
    title: Choose you this day
    body: |
      Joshua puts the choice to the people openly, and he makes his own before they answer. “If it seem evil unto you to serve the LORD,” they may choose between the gods their fathers served beyond the River and the gods of the Amorites; whatever they choose, “as for me and my house, we will serve the LORD.” It comes, in the covenant's order, right after the terms: Joshua “dramatically challenged the people.” One older reading explains why he would put it so: worship “must have its roots in the heart, and spring from the heart, and therefore cannot be forced by prohibitions and commands,” and the appeal “was not intended to release them from the obligation to serve Jehovah, but rather contained the strongest admonition to remain faithful to the Lord.” Moses set the same choice before Israel on the plains of Moab (see [[Deut. 30:19]]).

      The Book of Mormon quotes the verse as scripture. Describing the law under the Nephite judges, when “there was no law against a man’s belief,” Mormon writes, “For thus saith the scripture: Choose ye this day, whom ye will serve” ([[Alma 30:7–8]]).
    sources: [seely-covenant-renewal, keil-joshua, lds-scriptures]

  - ref: 19
    phrase: Ye cannot serve the LORD
    kind: history
    title: Ye cannot serve the LORD
    body: |
      Joshua's “Ye cannot serve the LORD” draws three more answers from a people who have already promised. They had said, “God forbid that we should forsake the LORD” (verse 16). Joshua answers that the LORD “is an holy God; he is a jealous God,” and that forsaking Him will bring ruin “after that he hath done you good” (verse 20). The people answer: “Nay; but we will serve the LORD” (verse 21); “We are witnesses” (verse 22); “The LORD our God will we serve, and his voice will we obey” (verse 24). The covenant is renewed within this exchange, as the people affirm their allegiance.

      In the covenant's order the warning stands where the blessings and curses do; they “are alluded to in Joshua 24:19–29.”
    sources: [lds-scriptures, ot-minute-josh-24, seely-covenant-renewal]

  - ref: 23
    phrase: put away, said he, the strange gods which are among you
    kind: history
    title: Strange gods among them
    body: |
      Joshua's command implies that Israel still had other gods to give up, and the text does not say what they were. In verse 14 they are “the gods which your fathers served on the other side of the flood, and in Egypt”; here they are “among you,” in Hebrew nearly the words Jacob spoke to his household before he buried their gods at Shechem (*hāsîrû ʾet-ʾĕlōhê hannēkār*, “put away the foreign gods”; see [[Gen. 35:4]] and the note at verse 1). In the covenant's order this is Israel's term of the agreement: the stipulations “call for the people to repent and put away their strange gods and renew their exclusive allegiance to the Lord God.”

      One older reading doubts that this generation kept idols at all, since the book shows Israel “only serving Jehovah during the lifetime of Joshua”; on that reading what was to be put away were “the idols of the heart,” so that Israel “might give its heart entirely to the Lord, who is not content with divided affections, but requires the whole heart.” The text leaves the question open. The second half of the verse gives the other side of the command: “incline your heart unto the LORD God of Israel.”
    sources: [oshb-wlc, seely-covenant-renewal, keil-joshua]

  - ref: 25
    phrase: Joshua made a covenant with the people that day
    kind: scripture
    title: The covenant renewed
    body: |
      Verse 25 names what the dialogue has been: a covenant, made “that day” and bound with “a statute and an ordinance.” Scripture records several such assemblies, in which the covenant people, “typically following periods of apostasy, or at times of crisis or transition,” are gathered by their leader “to publicly rededicate themselves to the conditions of the covenant.” Shechem is one, at the transition from Joshua to the generation after him. The people's last answer, “The LORD our God will we serve, and his voice will we obey” (verse 24), is the covenant's oath.

      The Book of Mormon has an assembly of the same kind. King Benjamin's (Mosiah 1–6) has been compared with the biblical accounts and found to fit “the biblical pattern remarkably well”; one chart of the pattern sets Joshua 24 beside Exodus, Deuteronomy and Mosiah 1–6. Benjamin's people, too, end by entering a covenant: “we are willing to enter into a covenant with our God to do his will, and to be obedient to his commandments” ([[Mosiah 5:5]]).
    sources: [seely-covenant-renewal, ot-minute-josh-24]

  - ref: 26
    phrase: took a great stone, and set it up there under an oak
    kind: symbol
    title: A stone that heard
    body: |
      The stone is one of the covenant's witnesses, set up so that Israel could not later deny what it had promised. Ancient covenants named their witnesses, “usually the local deities, but often natural phenomena as well (mountains, rivers, springs, heavens, earth, etc.)”; at Shechem the witnesses are the people themselves (verse 22) and “the great stone that Joshua erected there.” Joshua speaks of it as though it had ears: it “hath heard all the words of the LORD which he spake unto us,” and so it will testify “lest ye deny your God” (verse 27). Moses may have done the same at Sinai ([[Ex. 24:4]]), where it is possible that the altar and twelve pillars “were invoked to stand as witnesses much as the stone later erected by Joshua.”

      Joshua also writes “these words in the book of the law of God,” the written record of the covenant, as Moses at Sinai “wrote all the words of the LORD” ([[Ex. 24:4]]) and read the book of the covenant to the people. Whether the oak “by the sanctuary of the LORD” is the tree of Abraham's and Jacob's Shechem is taken up at [[Gen. 12:6]] and [[Gen. 35:4]].
    sources: [seely-covenant-renewal]

  - ref: 29
    phrase: being an hundred and ten years old
    kind: history
    title: Joshua, the servant of the LORD
    body: |
      Joshua dies at the age of Joseph, and the book gives him at last the title it has given Moses. Joseph also died at 110 ([[Gen. 50:26]]), and Moses at 120 ([[Deut. 34:7]]). One reading calls 110 “the ideal age in biblical reckoning,” and Moses' longer life perhaps a sign of “his (slightly) elevated status over Joshua in the eyes of the biblical historian.” The book opened with him as “Moses’ minister” ([[Josh. 1:1]]), and everywhere else in the book “the servant of the LORD” is Moses; here, for the only time, the title is Joshua's (the title is taken up at [[Ps. 36:0]]; his name, which is the Savior's, at [[Num. 13:16]]). He is buried in Timnath-serah, the city he asked for at the end of the allotment ([[Josh. 19:49–50]]), and Judges repeats the verse almost word for word ([[Judg. 2:8]]).
    sources: [ot-minute-josh-24, lds-scriptures]

  - ref: 31
    phrase: Israel served the LORD all the days of Joshua
    kind: scripture
    title: While the elders lived
    body: |
      The covenant held for a generation. Israel served the LORD while Joshua lived “and all the days of the elders that overlived Joshua, and which had known all the works of the LORD.” With the deaths of Joshua and Eleazar the chapter marks “the passing of a generation,” and Judges takes the story on from there. It repeats this verse ([[Judg. 2:7]]) and then says what came next: “there arose another generation after them, which knew not the LORD, nor yet the works which he had done for Israel” ([[Judg. 2:10]]).
    sources: [lds-scriptures, ot-minute-josh-24]

christ: |
  Joshua bears the Savior's name (see [[Num. 13:16]] and the witness of Christ in [[Josh. 1]]), and the LORD whom Israel chose at Shechem is Jehovah, the premortal Christ (see [[Ex. 3:14]]). The covenant Joshua renewed points to Him: in the New Testament “the covenant was embodied in the personage of its author, Jesus of Nazareth.”

  The choice Joshua put to Israel is put to every disciple: “He will not force us,” and “We need to choose whom we will serve.” The covenant Israel renewed at Shechem a disciple renews in the sacrament, given for “periodic covenant renewal for ourselves.”

