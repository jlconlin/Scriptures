chapter: 21
title: Cities for the Levites
tagline: 'The Levites receive forty-eight cities among the tribes, as Moses commanded, and the book sums up the gift of the land: not one good word of the LORD failed.'
when: 'At Shiloh, after the land had been divided by lot'

setting: |
  The division of the land ended at Shiloh, where Eleazar, Joshua and the heads of the tribes cast the lots “before the LORD, at the door of the tabernacle” ([[Josh. 19:51]]; on Shiloh, see [[Josh. 18:1]]). One tribe was still waiting. Levi had been given no land of its own ([[Josh. 13:14]], [[Josh. 13:33]]; [[Josh. 18:7]]); its men “were assigned to be the custodians of the tabernacle.” Now their leaders come to claim what Moses had promised them, “cities to dwell in” with pasture for their cattle ([[Num. 35:2]]), and they come first to Eleazar, “the priest (effectively their chief).”

  Chapter 20 has just named the six cities of refuge, and all six are among the Levites' towns: five are called cities of refuge again here (verses 13, 21, 27, 32, 38), and the sixth, Bezer, is listed without the title (verse 36). What a city of refuge was is at [[Deut. 19:2]]. Chronicles gives the same list again, family by family ([[1 Chr. 6:54–81]]).

thread: |
  The chapter is a list, and the list is an obedience. It opens and closes with the cities given as “the LORD commanded by the hand of Moses” (verses 2, 8), and between them “at the commandment of the LORD” (verse 3), and the gift is made “by lot” (verses 4–8), as the tribes' land was (see the note at [[Josh. 14:2]]). The order follows Levi's families: the priests, Aaron's sons, first (verses 9–19), then the rest of Kohath (20–26), Gershon (27–33) and Merari (34–40). Each town is given “with her suburbs,” the common pasture around it (the word is explained at [[Num. 35:2]]), and the total, forty-eight, is the number Moses set ([[Num. 35:7]]), on one reading “probably a deliberately symbolic number (forty-eight being a multiple of twelve).” Why Levi was scattered through the tribes rather than given a territory is the note at [[Num. 35:7]].

  The last three verses lift the eye from the list to the book. The land sworn to the fathers is given, Israel has rest, and “There failed not ought of any good thing which the LORD had spoken unto the house of Israel; all came to pass” (verse 45). The book itself, on the Church's reading, “demonstrates the Lord’s faithfulness in keeping His covenant with Abraham to give the Israelites the promised land.”

sections:
  - range: 1-8
    heading: The Levites ask for their cities
    plain: |
      The heads of the Levite families came to Eleazar the priest, to Joshua son of Nun, and to the heads of the tribes of Israel at Shiloh in the land of Canaan, and said, “The LORD commanded through Moses that we be given towns to live in, with their pasture lands for our livestock.” So, as the LORD commanded, the Israelites gave the Levites towns and pasture lands out of their own inheritance. The first lot fell to the Kohathite families: the descendants of Aaron the priest received thirteen towns from Judah, Simeon and Benjamin. The rest of Kohath's descendants received ten towns from Ephraim, Dan and half of Manasseh. Gershon's descendants received thirteen towns from Issachar, Asher, Naphtali and the half of Manasseh in Bashan. Merari's descendants received twelve towns from Reuben, Gad and Zebulun. So the Israelites gave these towns and their pasture lands to the Levites by lot, as the LORD had commanded through Moses.
  - range: 9-19
    heading: The towns of the priests
    plain: |
      From Judah and Simeon they gave the towns named here to Aaron's descendants among the Kohathites, since theirs was the first lot. They gave them Kiriath-arba, that is, Hebron, in the hill country of Judah, with the pasture land around it; but the town's fields and villages they had given to Caleb son of Jephunneh as his property. To the descendants of Aaron they gave Hebron, a city of refuge for one who had killed someone, and Libnah, Jattir, Eshtemoa, Holon, Debir, Ain, Juttah and Beth-shemesh, each with its pasture land: nine towns from those two tribes. From Benjamin they gave Gibeon, Geba, Anathoth and Almon: four towns. In all, the priests, Aaron's descendants, had thirteen towns with their pasture lands.
  - range: 20-26
    heading: The rest of Kohath
    plain: |
      The other Kohathite families of the Levites received their towns by lot from Ephraim: Shechem in the hill country of Ephraim, a city of refuge, and Gezer, Kibzaim and Beth-horon, four towns. From Dan they received Eltekeh, Gibbethon, Aijalon and Gath-rimmon, four towns; and from half Manasseh, Taanach and Gath-rimmon, two towns. In all, the remaining Kohathite families had ten towns with their pasture lands.
  - range: 27-33
    heading: Gershon
    plain: |
      The Gershonite families received from the other half of Manasseh Golan in Bashan, a city of refuge, and Beeshterah, two towns; from Issachar, Kishon, Dabareh, Jarmuth and En-gannim, four towns; from Asher, Mishal, Abdon, Helkath and Rehob, four towns; and from Naphtali, Kedesh in Galilee, a city of refuge, and Hammoth-dor and Kartan, three towns. In all, the Gershonites had thirteen towns with their pasture lands.
  - range: 34-42
    heading: Merari, and the total
    plain: |
      The Merarite families, the rest of the Levites, received from Zebulun Jokneam, Kartah, Dimnah and Nahalal, four towns; from Reuben, Bezer, Jahaz, Kedemoth and Mephaath, four towns; and from Gad, Ramoth in Gilead, a city of refuge, and Mahanaim, Heshbon and Jazer, four towns. In all, the Merarites received twelve towns by lot. The Levites' towns within the Israelites' land came to forty-eight, each with its pasture lands around it.
  - range: 43-45
    heading: Every promise kept
    plain: |
      So the LORD gave Israel all the land He had sworn to give their ancestors, and they took possession of it and settled there. The LORD gave them rest on every side, as He had sworn to their ancestors. Not one of their enemies could stand against them; the LORD handed all of them over to Israel. Not one of all the good promises the LORD had made to the house of Israel failed; every one came true.

notes:
  - ref: 4
    phrase: the children of Aaron the priest, which were of the Levites, had by lot out of the tribe of Judah
    kind: history
    title: The priests' towns in the south
    body: |
      The first lot put all thirteen of the priests' towns in Judah, Simeon and Benjamin (verses 9–19), and the text does not say why. Two readings look ahead. One older reading says that it “did not happen by chance; but God, according to His wonderful counsel, placed them just in that situation which He had determined to select for His own temple.” One Latter-day Saint reading looks to the later division of the kingdom: these territories “would later be subsumed under the Southern Kingdom of Judah,” and so “priesthood authority remained in the south.” Both are readings of a list that gives no reason of its own.
    sources: [keil-joshua, ot-minute-josh-21]

  - ref: 12
    phrase: But the fields of the city, and the villages thereof, gave they to Caleb the son of Jephunneh for his possession
    kind: history
    title: Hebron for the priests, its fields for Caleb
    body: |
      Hebron was Caleb's, given him “because that he wholly followed the LORD God of Israel” ([[Josh. 14:14]]), and here it becomes a priests' town and a city of refuge (verse 13); verse 12 explains how both can be true. The priests received the town itself “with the suburbs thereof round about it” (verse 11), the pasture at its edge; “the fields of the city, and the villages thereof” stayed with Caleb. How much of a town the Levites held is the note at [[Num. 35:2]].
    sources: [lds-scriptures]

  - ref: 43
    phrase: the LORD gave unto Israel all the land which he sware to give unto their fathers
    kind: history
    title: All the land, and the land not yet taken
    body: |
      Verses 43–45 close the account of the land as the promise of the book's first chapter kept: the LORD had sworn to give the land “unto their fathers” ([[Josh. 1:6]]), and now “they possessed it, and dwelt therein.” The summary stands beside the book's other picture, of “very much land to be possessed” ([[Josh. 13:1]]) and peoples not driven out; the two are set side by side, with the Latter-day Saint readings of them, at [[Josh. 13:1]].

      One Latter-day Saint reading takes the tension head on. Verses 44–45, it says, are “plainly contradicted not only by the book of Judges … but also by certain passages within the book of Joshua itself (for example, 15:63; 16:10),” and it suggests that “This overstatement might be an attempt at deliberate irony on the part of the author,” conveying “what the Israelites thought was their situation at the time” to heighten the tension with what follows. That is one reading; the chapter itself gives the summary without comment.
    sources: [ot-minute-josh-21, lds-scriptures]

  - ref: 45
    phrase: There failed not ought of any good thing which the LORD had spoken unto the house of Israel
    kind: scripture
    title: Not one word failed
    body: |
      The sentence of verse 45 is said twice more in scripture, and the first time it carries a warning. Joshua says it again at the end of his life, “not one thing hath failed of all the good things which the LORD your God spake concerning you” ([[Josh. 23:14]]), and turns it at once: as every good thing has come, “so shall the LORD bring upon you all evil things, until he have destroyed you from off this good land” if they turn to other gods ([[Josh. 23:15–16]]).

      Solomon says nearly the same words when he dedicates the temple: “there hath not failed one word of all his good promise, which he promised by the hand of Moses his servant” ([[1 Kgs. 8:56]]).
    sources: [lds-scriptures]

christ: |
  The LORD who kept every good word to Israel is Jehovah, the premortal Christ (see [[Ex. 3:14]]). The rest He gave in the land was not the last: Hebrews says that if Joshua had “given them rest,” God would not “afterward have spoken of another day,” and so “There remaineth therefore a rest to the people of God” ([[Heb. 4:8–9]]; see the note at [[Ps. 95:11]]).

  What the Lord has spoken to a disciple is as sure as what He spoke to Israel: “my word shall not pass away, but shall all be fulfilled, whether by mine own voice or by the voice of my servants, it is the same” ([[D&C 1:38]]). It is also given on the same terms Joshua set out, within a covenant that asks for faithfulness in return ([[Josh. 23:14–16]]).

explore: |
  - [[Num. 35:1–8]]: Moses' command for the Levites' cities and their pasture lands.
  - [[Josh. 13:14]], [[Josh. 13:33]] and [[Josh. 18:7]]: why Levi had no land of its own.
  - [[1 Chr. 6:54–81]]: Chronicles' list of the same cities.

