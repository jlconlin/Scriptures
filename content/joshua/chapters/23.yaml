chapter: 23
title: Not One Thing Hath Failed
tagline: Old and near death, Joshua gathers Israel's leaders, reminds them that the LORD fought for them and kept every promise, and warns that He will keep His warnings as surely if they cleave to the nations left in the land.
when: 'Late in Joshua''s life, “a long time after” the LORD gave Israel rest'

setting: |
  Joshua 23 and 24 are Joshua's farewell to Israel, given “a long time after” the LORD had given Israel rest (verse 1); how long, the text does not say. The land has been divided by lot (chapters 13–21), the tribes east of the Jordan have been sent home ([[Josh. 22:4]]), and Joshua has received his own city, Timnath-serah ([[Josh. 19:50]]). He calls for “all Israel” and its elders, heads, judges and officers. The leaders are the immediate audience of this chapter's speech; in the next, all the tribes gather at Shechem and renew the covenant ([[Josh. 24:1]]).

  The speech closes the book as the LORD's charge to Joshua opened it ([[Josh. 1:2–9]]), so that the two speeches frame the story between them. It also sets Joshua beside Jacob and Moses, who gave their last counsel before they died (Genesis 49; Deuteronomy 31–33). On one older reading the address “consists entirely of reminiscences from the Pentateuch, more especially from Deuteronomy,” and several of the notes below follow its lines back to Moses.

thread: |
  The speech has two parts, each opening with Joshua's age and his approaching death (verses 2 and 14), and its emphasis throughout is faithfulness to the covenant. The first part runs from what the LORD has done to what Israel must do and what will follow if it does not. The LORD “hath fought for you” (verse 3) and will drive out the nations still left (verse 5); so Israel must keep the law, refuse the nations' gods, and “cleave unto the LORD” and love Him (verses 6–11). If Israel cleaves to the nations instead, the LORD will stop driving them out, and they will become traps and thorns (verses 12–13).

  The second part turns on one fact. Israel knows “in all your hearts and in all your souls” that “not one thing hath failed” of the LORD's good words (verse 14). The same faithfulness makes the warnings as certain as the promises: if Israel breaks the covenant, every evil word spoken through Moses will come as surely as the good ones did (verses 15–16). The LORD who kept His promises is the LORD who will keep His warnings.

sections:
  - range: 1-5
    heading: The LORD has fought for you
    plain: |
      A long time after the LORD had given Israel rest from all the enemies around it, when Joshua was old and far on in years, he called for all Israel, its elders, heads, judges and officers, and said to them: “I am old and far on in years. You have seen everything the LORD your God has done to all these nations for your sake, because it is the LORD your God who has fought for you. I have given you by lot, as an inheritance for your tribes, the nations that are still left, together with all the nations I have destroyed, from the Jordan to the Great Sea in the west. The LORD your God will push them out ahead of you and drive them out of your sight, and you will possess their land, as the LORD your God promised you.
  - range: 6-11
    heading: Keep the law, and cleave unto the LORD
    plain: |
      “So be very courageous to keep and do everything written in the book of the law of Moses, without turning aside from it to the right or to the left. Do not mix with these nations that are left among you. Do not speak the names of their gods, or make anyone swear by them, or serve them, or bow down to them. Hold fast to the LORD your God, as you have done to this day. The LORD has driven out great and strong nations ahead of you, and to this day no one has been able to stand against you. One of you will put a thousand to flight, because it is the LORD your God who fights for you, as He promised you. So take great care to love the LORD your God.
  - range: 12-13
    heading: If ye go back
    plain: |
      “But if you turn back and hold fast to what is left of these nations still among you, and marry among them and mix with them, and they with you, then know for certain that the LORD your God will no longer drive these nations out ahead of you. They will be a snare and a trap to you, a whip on your sides and thorns in your eyes, until you perish from this good land the LORD your God has given you.
  - range: 14-16
    heading: All good things, and all evil things
    plain: |
      “Now I am about to go the way of all the earth. You know with all your heart and soul that not one of all the good things the LORD your God promised you has failed. Every one has come true for you; not one has failed. But just as every good thing the LORD your God promised you has come to you, so the LORD will bring on you every evil thing, until He has destroyed you from this good land the LORD your God has given you. When you break the covenant the LORD your God commanded you, and go and serve other gods and bow down to them, the LORD's anger will burn against you, and you will quickly perish from the good land He has given you.”

notes:
  - ref: 4
    phrase: these nations that remain
    kind: history
    title: The nations that remain
    body: |
      Joshua's farewell assumes that nations are still living in the land. He speaks of “these nations that remain” ([[Josh. 23:4]]) and warns Israel not to come among “these that remain among you” ([[Josh. 23:7]]) or to cleave to “the remnant of these nations” ([[Josh. 23:12]]). He has already divided their land among the tribes, as the LORD told him to do while it was still unconquered: “them will I drive out from before the children of Israel: only divide thou it by lot unto the Israelites for an inheritance” ([[Josh. 13:6]]). Driving them out is still a promise: “the LORD your God, he shall expel them from before you” ([[Josh. 23:5]]).

      On one Latter-day Saint reading, the warning against these neighbors' gods is “an odd comment indeed if we take at face value the totalizing claims made in the book about the Canaanites’ supposed annihilation.” The book's two pictures of the conquest, the whole land taken and very much land remaining, are set side by side in the note at [[Josh. 13:1]]. Verse 13 makes the promise of verse 5 depend on Israel's faithfulness, and the book of Judges goes on to speak of “the nations which Joshua left when he died” ([[Judg. 2:21]]).
    sources: [lds-scriptures, ot-minute-josh-23]

  - ref: 6
    phrase: Be ye therefore very courageous
    kind: scripture
    title: The charge Joshua received, passed on
    body: |
      Joshua hands Israel's leaders the charge the LORD gave him at the start of the book: “Only be thou strong and very courageous, that thou mayest observe to do according to all the law, which Moses my servant commanded thee: turn not from it to the right hand or to the left” ([[Josh. 1:7]]). The words come back almost unchanged, but what was said to one man is now said to all who lead Israel. On the book of the law, see the note at [[Josh. 1:8]]; on the charge to be strong, the note at [[Josh. 1:6]].
    sources: [lds-scriptures]

  - ref: 7
    phrase: neither make mention of the name of their gods
    kind: history
    title: Four acts of worship
    body: |
      The verse forbids four acts which, on one older reading, were “the four outward forms of divine worship”: making mention of a god's name; swearing by him; serving him, which that reading takes as serving “by sacrifices”; and bowing down to him, which it takes as bowing “to invoke them in prayer.” The first comes from the law given at Sinai: “make no mention of the name of other gods, neither let it be heard out of thy mouth” ([[Ex. 23:13]]). The law gave the same acts to the LORD alone: “Thou shalt fear the LORD thy God; him shalt thou serve, and to him shalt thou cleave, and swear by his name” ([[Deut. 10:20]]). To name, swear by, serve or bow to the gods of the nations was to give them the worship Israel owed the LORD, and verse 8 names the alternative: to cleave to Him.
    sources: [keil-joshua, lds-scriptures]

  - ref: 8
    phrase: cleave unto the LORD your God
    kind: words
    title: Cleave
    body: |
      To cleave to the LORD is to hold to Him in loyalty. The verb is *dābaq*, “cling, cleave, keep close,” the word for a man who “shall cleave unto his wife” ([[Gen. 2:24]]); used figuratively, it speaks of “loyalty, affection,” as in that verse, and above all of cleaving to the LORD, as here. Joshua uses it twice in the speech, in opposite directions: Israel is to cleave to the LORD, and not to “cleave unto the remnant of these nations” ([[Josh. 23:12]]), where the next words speak of marriage and the verb again means loyalty. With “love the LORD your God” ([[Josh. 23:11]]), it is part of the covenant language that runs through the speech.

      Solomon's story shows the danger in the same word. His foreign wives came from nations of which the LORD had said, “surely they will turn away your heart after their gods: Solomon clave unto these in love” ([[1 Kgs. 11:2]]), with the same verb.
    sources: [oshb-wlc, bdb, ot-minute-josh-23, lds-scriptures]

  - ref: 10
    phrase: One man of you shall chase a thousand
    kind: scripture
    title: One against a thousand
    body: |
      One man chasing a thousand echoes the covenant's blessing. The law had promised that if Israel kept it, “five of you shall chase an hundred, and an hundred of you shall put ten thousand to flight” ([[Lev. 26:8]]); on one older reading, verse 10 describes “the blessing of fidelity to the law which Israel had hitherto experienced,” on the basis of that promise. Joshua gives the reason in the same breath, repeating what he said in verse 3: “the LORD your God, he it is that fighteth for you” ([[Josh. 23:10]]). The strength belongs to the LORD who fights, not to the one man.

      Moses' song uses the same figure for the day the LORD would leave Israel to its enemies: “How should one chase a thousand, and two put ten thousand to flight, except their Rock had sold them, and the LORD had shut them up?” ([[Deut. 32:30]]). Isaiah later reverses the promise in the same way (see the note at [[Isa. 30:16]]).
    sources: [lds-scriptures, keil-joshua]

  - ref: 12
    phrase: shall make marriages with them
    kind: history
    title: Why marriage with the nations was forbidden
    body: |
      The law had already forbidden these marriages ([[Deut. 7:3]]) and given its reason: “For they will turn away thy son from following me, that they may serve other gods” ([[Deut. 7:4]]). The danger was to the covenant: Israel was forbidden to intermarry with the Canaanites “lest they abandon their covenants with the Lord.”
    sources: [lds-scriptures, sc-knowhy-110]

  - ref: 13
    phrase: snares and traps unto you
    kind: scripture
    title: Snares, scourges and thorns
    body: |
      Joshua's images are close to Moses' warning that the peoples Israel let remain would be “pricks in your eyes, and thorns in your sides” ([[Num. 33:55]]; the note at [[Num. 33:56]] explains it). What Joshua adds is the condition: if Israel goes back, the LORD “will no more drive out” the nations, and they will stay as traps to fall into rather than enemies to defeat.

      In the book of Judges the angel at Bochim speaks in nearly the same words after Israel has failed to obey: “I will not drive them out from before you; but they shall be as thorns in your sides, and their gods shall be a snare unto you” ([[Judg. 2:3]]). The LORD then leaves the nations “That through them I may prove Israel, whether they will keep the way of the LORD to walk therein” ([[Judg. 2:22]]).

      The theme page [“Rest Round About”](/joshua/themes/rest-round-about/) follows how the book's rest, given and declared, ends here on how it could be lost.
    sources: [lds-scriptures]

  - ref: 15
    phrase: so shall the LORD bring upon you all evil things
    kind: scripture
    title: Good things and evil things
    body: |
      Verse 14 repeats the book's own summary of the conquest (see the note on [[Josh. 21:45]]), and verse 15 turns it into a warning: as every good thing came, so will every evil thing. On one older reading, the evil things are the curses of the covenant in Leviticus 26 and Deuteronomy 28, which would come if Israel transgressed it: since none of the good words had failed, “it was just as certain that the Lord would bring upon them every evil word that He spake through Moses.” Verse 16 ends as Moses had warned: “lest ye perish quickly from off the good land which the LORD giveth you” ([[Deut. 11:17]]).

      The Church's footnote to the “good land” of verse 16 points ahead to Ahijah's prophecy against the northern kingdom: the LORD “shall root up Israel out of this good land, which he gave to their fathers, and shall scatter them beyond the river” ([[1 Kgs. 14:15]]).
    sources: [lds-scriptures, keil-joshua]

christ: |
  The LORD who “hath fought for you” ([[Josh. 23:3]]) and of whose good words “not one thing hath failed” ([[Josh. 23:14]]) is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]). Joshua's last witness is to His faithfulness: He keeps His word, the promise and the warning alike.

  He binds Himself the same way to those in covenant with Him now: “I, the Lord, am bound when ye do what I say; but when ye do not what I say, ye have no promise” ([[D&C 82:10]]). Jacob's teaching on cleaving runs both ways, “cleave unto God as he cleaveth unto you” ([[Jacob 6:5]]): a disciple who holds fast to Christ is held fast by Him.

explore: |
  - [[Josh. 24]]: the covenant Joshua's warnings lead to, renewed by all the tribes at Shechem.
  - [[Deut. 11:13–17]] and [[Deut. 28]]: the blessings and curses Joshua calls to mind.
  - [[Judg. 2:1–23]]: the nations left in the land, and what they became to Israel.
  - [[2 Ne. 1:1–12]]: Lehi's farewell and the conditions of another promised land.

sources: [lds-scriptures, ot-minute-josh-23, keil-joshua, oshb-wlc, bdb, sc-knowhy-110]
