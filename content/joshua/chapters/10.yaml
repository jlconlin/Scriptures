chapter: 10
title: Sun, Stand Thou Still
tagline: Five Amorite kings attack Gibeon, Joshua marches all night to defend it, the LORD sends hailstones and lengthens the day, and the cities of the south fall.
when: 'From Gilgal to Gibeon and the south, soon after the treaty with Gibeon'

setting: |
  Joshua 10 follows straight from the treaty of chapter 9. Chapter 9 opens the second stage of the conquest (9:1–11:15), which “pitted Israel against both the south (see chapter 10) and the north (see chapter 11) of Canaan.” Gibeon, a Hivite city in the hills about five miles north of Jerusalem, had tricked Israel into a covenant of peace, and Israel had kept its oath when the trick came out (see the note at [[Josh. 9:19]]).

  Now Adoni-zedek, king of Jerusalem, answers the treaty. Recognizing Israel's strength, five kings of the south (Jerusalem, Hebron, Jarmuth, Lachish and Eglon) allied themselves to destroy Israel's new ally. Coalitions of this kind are known from the Bible (Genesis 14) and from the ancient Near East, where they “usually arose in response to a perceived regional threat”; here the threat was Israel.

  The chapter tells the result in two movements, the battle at Gibeon (verses 1–15) and the capture and execution of the kings and the taking of the southern cities (verses 16–43), and each movement ends with the same sentence: Joshua “returned, and all Israel with him, unto the camp to Gilgal” (verses 15, 43). Its best-known lines, the sun standing still, are a poem the narrator says he took from an older book (verses 12–13).

thread: |
  The chapter says who won the battle at Gibeon, and it is not Joshua. Before the march the LORD says, “I have delivered them into thine hand” (verse 8); in the battle it is the LORD who “discomfited them” and “cast down great stones from heaven,” so that more died of hailstones than by Israel's sword (verses 10–11); and the long day ends with the sentence that sums up the LORD's part in the conquest: “for the LORD fought for Israel” (verse 14). The conquest narrative “places a heavy emphasis on Jehovah’s miraculous intervention,” the stones and the sun among them, and Joshua shows God fulfilling His covenant promises “to the degree that the Israelites remain faithful.” The last verses say it again: the kings and their land fell “at one time, because the LORD God of Israel fought for Israel” (verse 42).

  What Israel brings is faithfulness to its word and to its orders. Joshua marches all night to keep an oath made to people who had deceived him (verses 6–9), and at Makkedah he gives his captains the LORD's charge to him, “be strong and of good courage” (verse 25; see the note at [[Josh. 1:6]]), with the reason: “thus shall the LORD do to all your enemies.” The list of southern cities that follows (verses 28–39) is told in the same few phrases, city by city, and closes on “as the LORD God of Israel commanded” (verse 40).

sections:
  - range: 1-5
    heading: Five kings against Gibeon
    plain: |
      Adoni-zedek, king of Jerusalem, heard that Joshua had taken Ai and destroyed it, as he had Jericho, and had done to Ai's king what he had done to Jericho's. He also heard that the people of Gibeon had made peace with Israel and were living among them. He and his people were badly frightened, because Gibeon was a large city, like one of the royal cities, larger than Ai, and its men were all warriors. So Adoni-zedek sent word to Hoham king of Hebron, Piram king of Jarmuth, Japhia king of Lachish and Debir king of Eglon: “Come and help me attack Gibeon, because it has made peace with Joshua and the Israelites.” So the five Amorite kings, of Jerusalem, Hebron, Jarmuth, Lachish and Eglon, joined forces, marched up with all their armies, camped against Gibeon and attacked it.
  - range: 6-11
    heading: The LORD fights at Gibeon
    plain: |
      The men of Gibeon sent word to Joshua in the camp at Gilgal: “Don't abandon your servants! Come quickly and save us. Help us, because all the Amorite kings of the hill country have joined forces against us.” So Joshua went up from Gilgal with his whole army, all his best fighting men. The LORD said to Joshua, “Do not be afraid of them. I have given them into your hand; not one of them will be able to stand against you.” After marching all night from Gilgal, Joshua took them by surprise. The LORD threw them into a panic before Israel, and Israel struck them down in a great slaughter at Gibeon, chased them up the road to Beth-horon, and cut them down all the way to Azekah and Makkedah. As they fled down the slope from Beth-horon, the LORD hurled great stones from the sky on them all the way to Azekah, and they died. More of them died from the hailstones than the Israelites killed with the sword.
  - range: 12-15
    heading: The sun stands still
    plain: |
      On the day the LORD gave the Amorites over to Israel, Joshua spoke to the LORD, and in the presence of Israel he said:

      “Sun, stand still over Gibeon,
      and you, moon, over the valley of Aijalon.”

      So the sun stood still and the moon stopped until the nation had taken vengeance on its enemies. Is it not written in the book of Jasher? The sun stopped in the middle of the sky and did not hurry to set for about a whole day. There has never been a day like it, before or since, when the LORD listened to the voice of a man, because the LORD was fighting for Israel. Then Joshua returned with all Israel to the camp at Gilgal.
  - range: 16-27
    heading: The five kings at Makkedah
    plain: |
      The five kings had fled and hidden in a cave at Makkedah. When Joshua was told that they had been found hiding there, he said, “Roll large stones against the mouth of the cave and post men to guard it. But don't stop yourselves: pursue your enemies, attack them from the rear, and don't let them get back to their cities, because the LORD your God has given them into your hand.” Joshua and the Israelites struck them down in a very great slaughter until they were almost destroyed, and the few who survived reached their fortified cities. The whole army came back safely to Joshua in the camp at Makkedah, and no one dared say a word against the Israelites. Then Joshua said, “Open the mouth of the cave and bring those five kings out to me.” So they brought out the kings of Jerusalem, Hebron, Jarmuth, Lachish and Eglon. When they had brought them to Joshua, he called all the men of Israel together and told the army commanders who had gone with him, “Come here and put your feet on the necks of these kings,” and they did. Joshua said to them, “Do not be afraid or discouraged. Be strong and courageous, because this is what the LORD will do to all the enemies you fight.” Then Joshua put the kings to death and hung their bodies on five trees, where they stayed until evening. At sunset Joshua gave the order, and they were taken down and thrown into the cave where they had hidden. Large stones were placed at the cave's mouth, and they are there to this day.
  - range: 28-39
    heading: The cities of the south
    plain: |
      That day Joshua took Makkedah and put it to the sword. He utterly destroyed its king and everyone in it, leaving no survivors, and did to the king of Makkedah what he had done to the king of Jericho. Then Joshua and all Israel moved on from Makkedah to Libnah and attacked it. The LORD gave it and its king into Israel's hand too, and Joshua put the city and everyone in it to the sword, leaving no survivors, and did to its king what he had done to the king of Jericho. From Libnah Joshua and all Israel moved on to Lachish, besieged it and attacked it. The LORD gave Lachish into Israel's hand, and they took it on the second day and put it and everyone in it to the sword, as they had done to Libnah. Meanwhile Horam king of Gezer came up to help Lachish, but Joshua defeated him and his army, leaving no survivors. From Lachish Joshua and all Israel moved on to Eglon, besieged it and attacked it. They took it that same day, put it to the sword and utterly destroyed everyone in it, as they had done to Lachish. Then Joshua and all Israel went up from Eglon to Hebron and attacked it. They took it with its king and its villages and put it and everyone in it to the sword, leaving no survivors, as they had done to Eglon; they utterly destroyed it and everyone in it. Then Joshua and all Israel turned back to Debir and attacked it. They took the city, its king and its villages, put them to the sword and utterly destroyed everyone in it, leaving no survivors. They did to Debir and its king what they had done to Hebron, and to Libnah and its king.
  - range: 40-43
    heading: The whole south
    plain: |
      So Joshua conquered the whole region, the hill country, the Negev, the western foothills and the slopes, with all their kings. He left no survivors but utterly destroyed every living person, as the LORD, the God of Israel, had commanded. Joshua struck them from Kadesh-barnea to Gaza, and the whole region of Goshen as far as Gibeon. All these kings and their lands Joshua took in a single campaign, because the LORD, the God of Israel, fought for Israel. Then Joshua returned with all Israel to the camp at Gilgal.

notes:
  - ref: 6
    phrase: Slack not thy hand from thy servants
    kind: history
    title: Joshua keeps faith with Gibeon
    body: |
      Joshua answers Gibeon's call because Israel had sworn peace with it, and the chapter shows the oath kept. The Gibeonites had won that oath by deceit, posing as men from a distant country (chapter 9); “despite their deceit, the treaty, which was considered sacred, was honored” (see the note at [[Josh. 9:19]]). It is the treaty itself that brings war: the five kings march against Gibeon because it has made peace with Joshua (verse 4). Gibeon pleads as “thy servants,” and Joshua, “faithful to the treaty,” leads Israel's army through the night to defend it (verses 7–9).

      The LORD sends him with a promise: “Fear them not: for I have delivered them into thine hand” (verse 8). The book later sets Gibeon apart: “There was not a city that made peace with the children of Israel, save the Hivites the inhabitants of Gibeon” ([[Josh. 11:19]]).
    sources: [brandt-conquest]

  - ref: 12
    phrase: Sun, stand thou still upon Gibeon; and thou, Moon, in the valley of Ajalon
    kind: scripture
    title: The sun and moon stand still
    body: |
      The verse reports a miracle, and the Church's Student Manual reads it as one, but scripture does not say how the day was lengthened, and faithful readers describe it differently. Joshua's words are a poem: although the King James page sets them as prose, verse 12 is “poetry with a parallelistic declaration,” sun answering moon and Gibeon answering the valley of Ajalon, and the narrator says it is written in the book of Jasher (see the note at verse 13).

      The *Old Testament Student Manual* reads the Book of Mormon as settling the mechanism: it “makes it clear that it was the earth, not the sun, that was involved in Joshua’s miracle.” Mormon wrote that if the Lord says to the earth, “Thou shalt go back, that it lengthen out the day for many hours—it is done” ([[Hel. 12:14]]), and the manual quotes a commentary on Joshua that concludes God “can—and would, when necessary—cause that the earth should stop in its rotation to lengthen a day.” A Latter-day Saint study of Helaman 12 reads Mormon another way. It thinks it “probable” that Mormon had Joshua's story in mind, but that he invoked it “not because Joshua’s account is scientifically inaccurate and therefore in need of correction” but to teach obedience, the earth itself obeying the word of God. On that reading what mattered in Joshua's story was not how the day was lengthened: “The absolutely central point—the turn of events that sparked saving faith—was the Lord’s power and miraculous intercession.” A third Latter-day Saint commentary says simply that “the precise phenomenon described in this scene is difficult to fully ascertain,” and sets it beside other scripture in which God shows His power in the heavens, such as the night without darkness at Christ's birth ([[3 Ne. 1:15]]).

      The chapter puts its own weight on the next verse: “there was no day like that before it or after it, that the LORD hearkened unto the voice of a man” (verse 14). Habakkuk's echo of the scene is taken up at [[Hab. 3:11]].
    sources: [ot-minute-josh-10, ot-manual-josh, grandy-helaman]

  - ref: 13
    phrase: Is not this written in the book of Jasher?
    kind: history
    title: The book of Jasher
    body: |
      The book of Jasher was an older Israelite collection, now lost, which the narrator names as the place Joshua's words are written. It is “one rare instance when a biblical narrator identifies his source.” The same book is cited once more, for David's lament over Saul and Jonathan ([[2 Sam. 1:18]]). It was “an early collection of Jewish national songs and stories of deeds of valor, put together about the time of Solomon,” or “probably a collection of war poems or epic tales.” The Hebrew name is “literally translated ‘the book of the upright.’”

      Several books printed in modern times carry the name. Such collections “may be of some worth but do not appear to be the one spoken of in the Bible.” The one best known among Latter-day Saints, a Jewish work published in English in 1840, has a parallel to this verse, but the fuller account Joshua points to “does not even appear in its pages,” and the Latter-day Saint study of it concludes that it “is not the lost scriptural book mentioned in the Old Testament.”
    sources: [bd-jasher, ot-minute-josh-10, brandt-jasher]

  - ref: 24
    phrase: put your feet upon the necks of these kings
    kind: history
    title: The five kings humbled and hanged
    body: |
      Joshua's treatment of the five kings is a public sign of their defeat, and their bodies were not left on the trees overnight. Putting a foot on a conquered enemy's neck is “a common ancient Near Eastern image of submission or subjugation,” and Joshua had his captains do it with his charge to them, probably “to raise morale in the army” (verses 24–25). He then had the kings put to death and their bodies hung on five trees until evening (verse 26), as he had done with the king of Ai ([[Josh. 8:29]]).

      The bodies came down at sunset, as the law required (verse 27; see the note at [[Deut. 21:22]]): the enemies were “ritually humiliated, both while alive and then while dead, yet there was no long-term corpse mutilation, and the corpse was interred at evening.” The cave where the kings had hidden became their tomb, “a final act of irony or poetic justice,” and the stones at its mouth were still there when the account was written.
    sources: [ot-minute-josh-10, belnap-fell-tree]

  - ref: 40
    phrase: utterly destroyed all that breathed, as the LORD God of Israel commanded
    kind: history
    title: All that breathed
    body: |
      Verses 28–40 say that Joshua carried out the herem (“utterly destroyed”) on the people of each southern city, as the LORD commanded; the same book shows that some of their people had to be fought again. Why the LORD commanded it, and how the Church reads it, is set out at [[Josh. 6:21]] and [[Deut. 7:2]]. What this passage adds is its form and its scope. It repeats “in formulaic fashion” that Joshua struck each city with the sword and destroyed its inhabitants, and it speaks only of “the slaying of humans,” not of burning or of spoil. “All that breathed” refers to people: “there is no indication in any of these passages that the phrase includes livestock as well as humans.”

      The language is total, “depicting Joshua and the Israelites as having totally dominated their Canaanite foes.” Yet the chapter itself says that survivors “entered into fenced cities” (verse 20). One Latter-day Saint study counts this verse and the Debir of verse 39 among the signs that the herem “did not involve total extermination in actual practice,” since people consigned to it were “later needing to be reconquered,” as the Anakites at Hebron are when Caleb drives them out and Othniel takes Debir ([[Josh. 15:13–17]]); it reads the absolute words as the idiom of war texts in that region (see the note at [[Josh. 6:21]]). How the book's two pictures of the conquest fit together is taken up at [[Josh. 13:1]].
    sources: [calabro-herem, ot-minute-josh-10]

christ: |
  “The LORD fought for Israel” (verse 14): the LORD who fought at Gibeon is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]). In the Restoration He still names Himself “the Lord of Hosts,” the same being who in the Old Testament was “a man of war who fights for his people,” and the mercy His disciples love in Him is possible only because “he has fought battles for us in Gethsemane and on the cross and thus has set us free.” At Gibeon He also “hearkened unto the voice of a man” (verse 14), Joshua's, spoken in the middle of the battle.

  The Church's footnote to “fought” in verse 14 sets beside it the promise He gave Zion in this dispensation: “I will fight your battles” ([[D&C 105:14]]). He has fought the decisive battles for His disciples, in Gethsemane and on the cross, as He fought at Gibeon for Israel; what Joshua brought to Gibeon was faithfulness to an oath he had made, and that is the part a disciple's covenants leave to the disciple.

explore: |
  - [[Hel. 12:7–17]]: Mormon's reflection on the obedient earth, with its words on the lengthened day.
  - [[2 Sam. 1:17–27]]: the other passage scripture says was “written in the book of Jasher.”
  - [[Josh. 11]]: the northern campaign, told in the same pattern, and its summary of Gibeon's peace (11:19).
  - [[Josh. 15:13–19]]: Hebron and Debir taken again, by Caleb and Othniel.

