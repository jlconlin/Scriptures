chapter: 2
title: The LORD Hath Given You the Land
tagline: Two spies hide in a harlot's house in Jericho; she confesses the LORD, and they swear to save her household by a scarlet line in the window.
when: 'Before the crossing of the Jordan; spies sent from the camp at Shittim to Jericho'

setting: |
  Chapter 1 ended with the order to be ready, “for within three days ye shall pass over this Jordan” ([[Josh. 1:11]]). Before the crossing, Joshua sends two men from the camp at Shittim across the river to look at the land and above all at Jericho. Jericho was “a walled city in the valley of the Jordan… near the place where the Israelites crossed the river,” one of the main obstacles to the conquest, and it stays at the center of the story through chapter 6.

  Sending spies recalls the twelve Moses sent from the wilderness of Paran ([[Num. 13:17]]), and the echo ties Joshua to Moses. Joshua had been one of those twelve ([[Num. 13:8]], [[Num. 13:16]]). This time the report comes out the other way (see the note on verse 24).

  Rahab is a Canaanite of Jericho. The New Testament remembers her for her faith ([[Heb. 11:31]]) and for her works ([[James 2:25]]), and Matthew names her in the line of Jesus ([[Matt. 1:5]]; see [[Josh. 6:25]]). What became of her household is told when the city falls ([[Josh. 6:22–25]]). What the Old Testament says of its women is gathered in the guide [Women and marriage in the Old Testament](/old-testament/guides/women-and-marriage/#the-women).

thread: |
  Joshua 2 is **the story of one report and two ways of hearing it.** All Jericho has heard what the LORD did at the Red Sea and to Sihon and Og, and the hearing has left the city without courage: “our hearts did melt” (verse 11). One woman draws a confession from the same news: “the LORD your God, he is God in heaven above, and in earth beneath.” One reading finds in the story the theme of “the least likely person—a woman, a prostitute on the margins of society—playing a salvific role for herself and her family.”

  The middle of the chapter is an oath. Rahab has shown the spies kindness (*ḥesed*) and asks kindness back, sworn by the LORD and confirmed with a token (verses 12–14); one reading calls her request “covenant language.” The spies set the terms: the scarlet line in the window, the household inside, the secret kept (verses 17–21). At the end the two men come home with her words in their mouths (verse 24), and Israel's first report from the land of promise is what a woman of Jericho told them.

sections:
  - range: 1-7
    heading: Spies in Rahab's house
    plain: |
      Joshua the son of Nun secretly sent two men out of Shittim as spies. “Go,” he said, “look over the land, and Jericho especially.” They went and came to the house of a prostitute named Rahab, and stayed there. The king of Jericho was told, “Men of Israel have come here tonight to search out the country.” So the king sent to Rahab: “Bring out the men who came to you and went into your house, for they have come to search out the whole country.” But the woman had taken the two men and hidden them. She said, “Yes, men came to me, but I did not know where they were from. At dark, when the gate was about to be shut, the men went out. I do not know where they went. Go after them quickly, and you will catch them.” In fact she had taken them up to the roof and hidden them under the stalks of flax she had laid out there. So the king's men chased them along the road to the Jordan, as far as the fords, and as soon as the pursuers had gone out, the gate was shut.
  - range: 8-14
    heading: What Rahab knew
    plain: |
      Before the men lay down for the night, she came up to them on the roof and said, “I know that the LORD has given you the land. Dread of you has fallen on us, and everyone who lives in the land is melting away in fear because of you. We have heard how the LORD dried up the water of the Red Sea for you when you came out of Egypt, and what you did to the two kings of the Amorites east of the Jordan, Sihon and Og, whom you utterly destroyed. When we heard it, our hearts melted, and no one has any courage left because of you; for the LORD your God is God in heaven above and on the earth below. So now, swear to me by the LORD that, since I have shown you kindness, you will show kindness to my father's house too, and give me a true sign. Spare my father and mother, my brothers and sisters and all that they have, and save us from death.” The men answered, “Our lives for yours, if you do not tell about this business of ours. When the LORD gives us the land, we will deal with you kindly and faithfully.”
  - range: 15-21
    heading: The scarlet line
    plain: |
      Then she let them down by a rope through the window, for her house was on the town wall, and she lived on the wall. She told them, “Go up into the hills, so the pursuers do not find you, and hide there three days until they have come back; then go on your way.” The men said to her, “We will be free of this oath you made us swear unless you do as follows. When we come into the land, tie this cord of scarlet thread in the window you let us down through, and gather your father, your mother, your brothers and all your father's household into your house. If anyone goes out of the doors of your house into the street, his blood will be on his own head, and we will not be to blame; but if a hand is laid on anyone who is with you in the house, his blood will be on our heads. And if you tell about this business of ours, we will be free of the oath you made us swear.” She said, “As you say, so be it.” She sent them away, and they left; and she tied the scarlet cord in the window.
  - range: 22-24
    heading: The spies' report
    plain: |
      They went into the hills and stayed there three days, until the pursuers had gone back; the pursuers searched all along the road but did not find them. Then the two men came back down from the hills, crossed the river, came to Joshua the son of Nun, and told him everything that had happened to them. They said to Joshua, “The LORD has truly given the whole land into our hands; everyone who lives in the country is melting away in fear because of us.”

notes:
  - ref: 1
    phrase: an harlot’s house, named Rahab
    kind: words
    title: A harlot named Rahab
    body: |
      Rahab was a prostitute, and the text says so before it gives her name. The Hebrew word is *zônâ*, and “the ordinary and straightforward reading of the Hebrew text is that she was a prostitute.” Readers uneasy with a harlot for a heroine softened it early: the innkeeper reading seems to begin with Josephus, and the Aramaic Targum of the verse also gives her a respectable trade. But everywhere else in the Bible *zônâ* “refers unambiguously to fornication,” and the New Testament keeps the word: “the harlot Rahab” ([[Heb. 11:31]]), “Rahab the harlot” ([[James 2:25]]).

      Her trade may explain the story's first moves, on one reading. It likely gave her “heightened access to the male gossip of the city,” which would be how she knew Jericho's fears (verses 9–11). It may also explain why two strangers lodged in a house on the wall, “where skulking men from both within and without might come without detection” (verse 15). The text itself says only that they went there.
    sources: [oshb-wlc, ot-minute-josh-2, fisher-rahab]

  - ref: 4
    phrase: I wist not whence they were
    kind: history
    title: Rahab’s words to the king’s men
    body: |
      Rahab deceived the king's men, and the chapter records it without comment. The narrator has already said that she hid the spies, so the reader knows that her answer is false, and so is what follows: that the men left at dusk and could still be caught (verse 5). One reading calls her words “carefully chosen and courageous deceits uttered in a tense and potentially life-threatening moment.” It sets her beside the Hebrew midwives, who also misled a king to save Israelite lives ([[Ex. 1:17–19]]).

      The New Testament praises Rahab twice, and both times for what she did with the men: by faith she “received the spies with peace” ([[Heb. 11:31]]); by works she “received the messengers, and had sent them out another way” ([[James 2:25]]). Neither verse mentions her words to the king.
    sources: [fisher-rahab, lds-scriptures]

  - ref: 9
    phrase: your terror is fallen upon us
    kind: scripture
    title: The Song of the Sea come true
    body: |
      Rahab's first words to the spies echo the song Israel sang at the Red Sea, to which the Church's footnotes point. Moses and the children of Israel had sung that “all the inhabitants of Canaan shall melt away. Fear and dread shall fall upon them… till thy people pass over, O LORD” ([[Ex. 15:15–16]]). What the song foretold, a Canaanite in Jericho now reports. The Hebrew shows how close the echo is: “terror” is *ʾêmâ*, the first word of the song's pair, fear and dread, with the same verb for “fall”; “faint” is *nāmōg*, the song's “melt away.”

      On one reading the Exodus echoes all through Rahab's story “orient” readers forward, to a campaign that will go as well in Canaan as it went in Egypt. What Jericho had heard, and how that news was promised, is at [[Deut. 2:25]].
    sources: [oshb-wlc, lds-scriptures, fisher-rahab]

  - ref: 11
    phrase: for the LORD your God, he is God in heaven above, and in earth beneath
    kind: scripture
    title: Rahab’s confession
    body: |
      Rahab's confession is the turning point of the chapter: the news that took the courage out of Jericho brought her to faith in Israel's God. Her words stand close to Moses' charge to Israel, to which the Church's footnote points: “the LORD he is God in heaven above, and upon the earth beneath: there is none else” ([[Deut. 4:39]]). One reading sees in her “the quintessential outsider,” who “distinguishes herself as one who truly sees God’s work.” Another holds that she has come to believe that Israel's God, unlike the idols of Jericho, “is actually acting in the affairs of men. He has true power, specifically to save.”

      Of the Canaanites in the book, only her household and the Gibeonites ask for mercy, “and they obtain it” (the Gibeonites at [[Josh. 9:19]]). Hebrews puts it as faith against unbelief: she “perished not with them that believed not” ([[Heb. 11:31]]).
    sources: [lds-scriptures, calabro-herem, fisher-rahab]

  - ref: 12
    phrase: since I have shewed you kindness
    kind: words
    title: Kindness for kindness
    body: |
      Rahab asks the spies to return the kindness she has shown them. “Kindness” here is *ḥesed*, twice: she has shown it, and she asks it back for her father's house (the word is explained at [[Gen. 24:12]]). With it she asks for an oath by the LORD and for “a true token,” *ʾôt ʾĕmet*. The spies answer with the same two words: “we will deal kindly and truly with thee” (verse 14), *ḥesed* and *ʾĕmet*.

      Her request for mercy, on one reading, “employs covenant language,” and what she asked was granted: she and her father's family were allowed to remain in the land, and “through her descent comes the royal line of David.”
    sources: [oshb-wlc, calabro-herem]

  - ref: 18
    phrase: thou shalt bind this line of scarlet thread in the window
    kind: symbol
    title: A Passover at Rahab’s window
    body: |
      The scarlet line has been read as making Rahab's house a Passover house, a reading built from the text's own details. The Old Testament seldom describes an object “without some significant relevance,” and the scarlet is named twice (verses 18, 21); the two mentions of the line in the window enclose the two mentions of blood in verse 19. Set beside the first Passover, the parts line up: a scarlet mark at the opening of the house, as the blood was on the door posts ([[Ex. 12:7]]); a “token” of protection (verse 12), the word the LORD used of that blood, “the blood shall be to you for a token” ([[Ex. 12:13]]), *ʾôt* in both; a whole household gathered inside ([[Ex. 12:3]]); and death for anyone who goes out the door, as “none of you shall go out at the door of his house until the morning” ([[Ex. 12:22]]).

      On this reading the line is “a second passover, this time uniquely arranged for Rahab and her household,” and Israel keeps the Passover in the plains of Jericho just before the city falls ([[Josh. 5:10]]). The first Passover saved a nation; this one is “on behalf of one believing woman and her immediate family.”
    sources: [fisher-rahab, oshb-wlc]

  - ref: 24
    phrase: Truly the LORD hath delivered into our hands all the land
    kind: scripture
    title: A different report from the spies
    body: |
      The spies' report comes out the other way from the one brought back to Moses by the spies he sent, whom this mission recalls ([[Num. 13]]). Of those twelve, ten had said, “We be not able to go up against the people; for they are stronger than we” ([[Num. 13:31]]); Joshua had been one of the two who answered, “the LORD is with us: fear them not” ([[Num. 14:9]]).

      These two bring back Rahab's own words. She had said, “all the inhabitants of the land faint because of you” (verse 9); they tell Joshua, “all the inhabitants of the country do faint because of us.” Their report, resting on what she told them, gave Israel “the confidence they needed at the outset of their assault.”
    sources: [ot-minute-josh-2, lds-scriptures]

christ: |
  The LORD whom Rahab confesses, God “in heaven above, and in earth beneath,” is Jehovah, the premortal Christ (see [[Ex. 3:14]]). Rahab asked only that her household be spared, and she was taken into Israel; Matthew names her in the line of Jesus ([[Matt. 1:5]]; see [[Josh. 6:25]]). Her story has been read as “a pattern for all peoples of the world who will one day be gathered forever into the family of God,” the adoption Christ offers: “as many as have received me, to them have I given to become the sons of God… for behold, by me redemption cometh” ([[3 Ne. 9:17]]).

  On the same reading, to make her an innkeeper instead “inadvertently reflects a belief that God’s saving reach is limited.” A person's past does not set the limit of that reach: the Canaanite whom Jericho knew as a harlot stands among the faithful in Hebrews ([[Heb. 11:31]]), and all who are born of God are, in the Lord's words to Alma, “redeemed of God, becoming his sons and daughters” ([[Mosiah 27:25]]).

