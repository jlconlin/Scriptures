chapter: 22
title: A Witness Between Us
tagline: Joshua sends the eastern tribes home with a blessing; their altar by the Jordan nearly brings war, until they explain that it is a witness that the LORD is God.
when: 'After the land was divided, on the road from Shiloh to the Jordan'

setting: |
  Joshua 22 opens the book's last three chapters: a dispute among the tribes (22), Joshua's farewell (23), and the covenant at Shechem (24). They may be read as “a sort of epilogue” to the conquest (chapters 1–12) and the allotment (chapters 13–21). The land has been divided, and the LORD has given Israel “rest round about” ([[Josh. 21:44]]).

  That rest was the term Moses had set for Reuben, Gad and half of Manasseh, who had chosen land east of the Jordan and promised to cross armed before their brethren (see [[Num. 32:16–22]], [[Deut. 3:18]] and the note at verse 3). Now, at Shiloh, where the tabernacle had been set up ([[Josh. 18:1]]), Joshua sends them home.

  On the way they build an altar by the Jordan, and the rest of the chapter is the story of a war that did not happen. Phinehas, who had turned back the plague at Peor ([[Num. 25:11]]), leads the embassy sent to them.

  Later scripture records what became of these tribes: they “transgressed against the God of their fathers,” and the kings of Assyria carried them away ([[1 Chr. 5:25–26]]).

thread: |
  The eastern tribes keep faith twice in this chapter, first with their swords and then with an altar that is misunderstood. Joshua praises them for having “kept the charge of the commandment of the LORD” (verse 3) and charges them to go on keeping it (verse 5). The altar seems to undo that. Built by the river that divides the tribes, it looks like a second altar beside the one at the tabernacle. The western tribes gather for war (verse 12), and their envoys argue from Peor and Achan that one group's rebellion brings the LORD's wrath on the whole congregation (verses 16–20).

  The eastern tribes answer that the altar was built “for fear” that the Jordan would one day be taken as a line between those who had a part in the LORD and those who had none (verses 24–25). Its purpose is the word the chapter keeps returning to: a “witness” (verses 27, 28, 34). The war is averted because the delegation heard the eastern tribes out before it went to battle (verse 30).

sections:
  - range: 1-9
    heading: The eastern tribes sent home
    plain: |
      Joshua called the Reubenites, the Gadites and the half tribe of Manasseh and said to them, “You have done everything Moses the LORD's servant commanded you, and you have obeyed me in everything I commanded you. All this long time, to this very day, you have not deserted your brethren; you have kept the charge the LORD your God gave you. Now the LORD your God has given your brethren rest, as he promised them. So go back to your homes, to the land Moses the LORD's servant gave you on the other side of the Jordan. But be very careful to keep the commandment and the law that Moses charged you with: to love the LORD your God, to walk in all his ways, to keep his commandments, to hold fast to him, and to serve him with all your heart and all your soul.” Then Joshua blessed them and sent them away, and they went home. (Moses had given half the tribe of Manasseh land in Bashan; Joshua had given the other half land with their brethren west of the Jordan.) When Joshua sent them home he blessed them and said, “Go back with great wealth: many cattle, silver, gold, bronze, iron and much clothing. Share the spoil of your enemies with your brethren.” So Reuben, Gad and the half tribe of Manasseh left the rest of Israel at Shiloh in Canaan and set out for Gilead, the land they had been given by the LORD's word through Moses.
  - range: 10-20
    heading: The altar and the accusation
    plain: |
      When they reached the region of the Jordan in the land of Canaan, they built an altar there by the river, a great altar, imposing to look at. The rest of Israel heard that the eastern tribes had built an altar facing the land of Canaan, in the region of the Jordan, at the Israelites' crossing, and the whole congregation gathered at Shiloh to go to war against them. They sent Phinehas son of Eleazar the priest to Gilead, with ten leaders, one from each tribe, each the head of his father's house. They said to the eastern tribes, “The whole congregation of the LORD says this: What is this treachery against the God of Israel? Today you have turned away from following the LORD by building yourselves an altar in rebellion against him. Was the sin of Peor not enough for us? We are not clean of it even now, though a plague struck the LORD's congregation for it. And now you turn away from the LORD? If you rebel against the LORD today, tomorrow he will be angry with all Israel. If your land is unclean, then come over to the LORD's own land, where his tabernacle stands, and take land among us. Only do not rebel against the LORD, or against us, by building an altar besides the altar of the LORD our God. When Achan son of Zerah broke faith over the devoted thing, did not wrath fall on all Israel? He was not the only one who died for his sin.”
  - range: 21-29
    heading: The eastern tribes answer
    plain: |
      The eastern tribes answered the heads of Israel's clans: “The Mighty One, God, the LORD! The Mighty One, God, the LORD! He knows, and let Israel know too. If this was rebellion or treachery against the LORD, do not spare us today. If we built this altar to turn away from the LORD, or to offer burnt offerings, grain offerings or peace offerings on it, let the LORD himself hold us to account. We did it because we were afraid that someday your children would say to ours, ‘What do you have to do with the LORD God of Israel? The LORD made the Jordan a border between us and you, Reubenites and Gadites. You have no share in the LORD.’ So your children might stop ours from fearing the LORD. That is why we decided to build an altar, not for burnt offerings or sacrifices, but as a witness between us and you and the generations after us that we do serve the LORD before him with our burnt offerings, sacrifices and peace offerings; then your children can never say to ours, ‘You have no share in the LORD.’ If they ever say that to us or our descendants, we will answer, ‘Look at this copy of the LORD's altar that our fathers made, not for burnt offerings or sacrifices, but as a witness between us and you.’ Far be it from us to rebel against the LORD and turn away from him today by building an altar for burnt offerings, grain offerings or sacrifices besides the altar of the LORD our God that stands before his tabernacle.”
  - range: 30-34
    heading: War averted
    plain: |
      When Phinehas the priest and the leaders with him heard what the eastern tribes said, they were satisfied. Phinehas said to them, “Today we know that the LORD is among us, because you have not committed this treachery against him. You have saved Israel from the LORD's hand.” Then Phinehas and the leaders went back from Gilead to Canaan and reported to the Israelites. The Israelites were glad, praised God, and spoke no more of going to war to destroy the land where Reuben and Gad lived. And the Reubenites and Gadites named the altar: “It is a witness between us that the LORD is God.”

notes:
  - ref: 3
    phrase: Ye have not left your brethren these many days unto this day
    kind: history
    title: A promise kept to the letter
    body: |
      Joshua's first words release the eastern tribes from a promise they had kept. Moses had given them their land on a condition: “If ye will go armed before the LORD to war,” and the land is subdued, “then afterward ye shall return, and be guiltless before the LORD, and before Israel” ([[Num. 32:20–22]]). Joshua had repeated the terms before the crossing: they were to help their brethren “Until the LORD have given your brethren rest” ([[Josh. 1:15]]).

      Now he speaks in the same words: the LORD “hath given rest unto your brethren, as he promised them” (verse 4). The condition is met, and on Moses' terms the tribes go home “guiltless,” with their share of the spoil and a charge to divide it with their brethren (verse 8).
    sources: [lds-scriptures]

  - ref: 10
    phrase: a great altar to see to
    kind: history
    title: Why an altar alarmed Israel
    body: |
      An altar meant sacrifice, and the law allowed sacrifice at one place only, so a second altar looked like a break with the LORD. Moses had commanded, “offer not thy burnt offerings in every place that thou seest: But in the place which the LORD shall choose” ([[Deut. 12:13–14]]; see the note at [[Deut. 12:5]]), and whoever offered elsewhere than at “the door of the tabernacle of the congregation” was to be “cut off from among his people” ([[Lev. 17:9]]). The tabernacle now stood at Shiloh.

      The dispute “hinged on whether the law of Moses allowed for multiple sacred sites besides the one authorized central site,” and part of the concern was practical: “it is more difficult to ensure a proper mode of worship with multiple sites.” The western tribes' words in verse 16 show how they read it: an altar built “that ye might rebel this day against the LORD.”
    sources: [lds-scriptures, ot-minute-josh-22]

  - ref: 17
    phrase: Is the iniquity of Peor too little for us
    kind: scripture
    title: Peor, Achan, and Phinehas
    body: |
      The delegation argues from Israel's own history: when some in Israel sinned, the whole congregation suffered. At Peor, “Israel joined himself unto Baal-peor,” and “those that died in the plague were twenty and four thousand” ([[Num. 25:3]]; [[Num. 25:9]]). Phinehas, who now leads the delegation, had turned that plague back by his zeal (see the note at [[Num. 25:11]]). At Ai, Achan alone took of the devoted thing, yet “wrath fell on all the congregation of Israel” (verse 20; see the note at [[Josh. 7:1]]). Verse 18 draws the conclusion for the present: rebel today, and “to morrow he will be wroth with the whole congregation of Israel.”

      Why Phinehas went rather than his father Eleazar the priest “is unclear,” and Eleazar's age may explain it, but since Phinehas “had already intervened in a previous episode involving apostate Israelites,” his part here “wasn’t surprising.” The “harsh language” of verses 16–20 suggests that “intertribal jealousies, suspicions, and prejudices lingered even after the settlement in Canaan.”
    sources: [lds-scriptures, ot-minute-josh-22]

  - ref: 19
    phrase: if the land of your possession be unclean
    kind: history
    title: An offer to share the land
    body: |
      The western tribes add an offer to their accusation: if the land east of the river seemed unfit for the LORD's worship, its people could cross over and take land among their brethren. “Unclean” here, in one older reading, means “without an altar to the Lord, and in the midst of many heathen dwelling amongst them,” and the verse sets “the land of your possession” against “the land of the possession of the LORD, wherein the LORD’s tabernacle dwelleth.” Another older reading carries the thought further: if they felt they needed an altar near them “to expiate your sins and wipe away your uncleanness,” the answer was to come and live by the one altar, not to build a second.

    sources: [cambridge-joshua, keil-joshua, lds-scriptures]

  - ref: 22
    phrase: The LORD God of gods, the LORD God of gods, he knoweth
    kind: words
    title: An oath in three names
    body: |
      The eastern tribes answer with an oath. The King James “The LORD God of gods” is three Hebrew names side by side, *El*, *Elohim* and the divine name, as at [[Ps. 50:1]] (see the note there), and here the three are said twice. In one older reading, combining the three names “serves to strengthen the invocation of God,” and the repetition strengthens it further.

      What follows has the form of an oath, with the penalty the speakers accept if they acted in rebellion: “if it be in rebellion, or if in transgression against the LORD, (save us not this day,)” and, in verse 23, “let the LORD himself require it.” They appeal to the LORD, who “knoweth,” and ask Israel to learn what He already knows.
    sources: [oshb-wlc, keil-joshua, lds-scriptures]

  - ref: 28
    phrase: Behold the pattern of the altar of the LORD
    kind: symbol
    title: A copy of the LORD's altar
    body: |
      The altar by the Jordan was built as a copy of the altar at the tabernacle, to point to it rather than to replace it.

      An altar in the shape of the LORD's own that was never used for sacrifice (verses 26, 28) pointed to the one where sacrifice was offered. That is the tribes' argument: the copy would show their descendants that their fathers worshiped “before his tabernacle” (verse 29), and that they had a part in the LORD as much as the tribes west of the river.
    sources: [lds-scriptures]

  - ref: 31
    phrase: This day we perceive that the LORD is among us
    kind: history
    title: A hearing before a war
    body: |
      Phinehas reads the outcome of the hearing as a sign that the LORD was with Israel. When they “heard the words” of the eastern tribes, “it pleased them” (verse 30), and Phinehas declared that by not committing the trespass the tribes had “delivered the children of Israel out of the hand of the LORD.”

      The chapter “demonstrates the critical balance between true worship and apostate idolatry”: without knowing why the altar was built, “one would judge the action to be an adulteration of the holy worship in the tabernacle.” The congregation that had gathered at Shiloh “to go up to war” (verse 12) “blessed God, and did not intend to go up against them in battle” (verse 33).
    sources: [ot-manual-josh, lds-scriptures]

  - ref: 34
    phrase: called the altar Ed
    kind: words
    title: Ed, “witness”
    body: |
      *ʿĒd* is the Hebrew word for “witness” or “testimony,” and the verse gives the altar's name and its meaning in one sentence. In the Hebrew the word stands only once, in the explanation: literally, *they called the altar: for a witness is it between us that the LORD is God*. The altar takes its name from this explanation. The King James sets *Ed* after “altar” as the name and then gives the clause. The Greek Septuagint has Joshua name the altar and reads, “It is a testimony in the midst of them, that the Lord is their God.”

      The heap of stones Jacob and Laban raised was also “a witness between me and thee” ([[Gen. 31:48]]). Isaiah later foresees an altar to the LORD in Egypt with a pillar at its border, “for a sign and for a witness” ([[Isa. 19:20]]; see the note at [[Isa. 19:19]]).
    sources: [ot-minute-josh-22, oshb-wlc, lxx-rahlfs, bdb, lds-scriptures]

christ: |
  The altar's witness was “that the LORD is God” (verse 34), and the LORD of this chapter is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]). Joshua's parting charge, “to love the LORD your God… and to serve him with all your heart and with all your soul” (verse 5), repeats Moses' words, “thou shalt love the LORD thy God with all thine heart, and with all thy soul” ([[Deut. 6:5]]). Jesus called that commandment “the first and great commandment” ([[Matt. 22:37–38]]).

  The same charge is given to those who “embark in the service of God” now: “see that ye serve him with all your heart, might, mind and strength” ([[D&C 4:2]]). The eastern tribes kept it on the far side of a river from the house of the LORD, and built their altar so that no one could tell their children, “Ye have no part in the LORD” (verse 27).

explore: |
  - [[Num. 32]] and [[Josh. 1:12–18]]: the promise the eastern tribes made to Moses and Joshua, and kept.
  - [[Num. 25]]: the iniquity of Peor that the delegation names, and Phinehas's part in ending the plague.
  - [[Deut. 12]]: the law of one place of sacrifice that the altar seemed to break.
  - [[Gen. 31:44–52]] and [[Isa. 19:19–20]]: other witnesses set up between two parties.
  - [[1 Chr. 5:18–26]]: what became of the eastern tribes.

sources: [lds-scriptures, ot-minute-josh-22, cambridge-joshua, keil-joshua, oshb-wlc, bdb, lxx-rahlfs, ot-manual-josh]
