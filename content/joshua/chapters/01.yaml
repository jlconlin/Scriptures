chapter: 1
title: As I Was with Moses, So I Will Be with Thee
tagline: Moses is dead, and the LORD sends Joshua over the Jordan with a promise, a book and a threefold charge to be strong; the people pledge to follow him as they followed Moses.
when: 'After the death of Moses, in the camp east of the Jordan'

setting: |
  Joshua begins where Deuteronomy ends. Moses has died ([[Deut. 34:5]]), and Israel is still camped east of the Jordan. The book is named for Joshua “not because he is the author, but because he is the principal figure in it.” Jewish tradition counted it the first of the “former prophets,” but it is “more properly a continuation of the first Five Books.” It does not name its writer, and its narrator looks back from a later day: the stones set up in the Jordan are there “unto this day” ([[Josh. 4:9]]). For the period, and for the dating the Church's pages offer, see [The Conquest, the Judges, and One Kingdom](/old-testament/guides/the-conquest-judges-and-kingdom/#rulers).

  The chapter is four speeches: the LORD to Joshua (verses 2–9), Joshua to the officers (10–11), Joshua to the tribes settled east of the Jordan (12–15), and the people's answer (16–18). The first speech frames the rest of the book.

thread: |
  The LORD gives Joshua a promise and a condition, and at the end of the chapter the people say both back to him. The promise is the LORD's presence: “as I was with Moses, so I will be with thee” (verse 5), and again, “the LORD thy God is with thee whithersoever thou goest” (verse 9). The condition is courage and the law: “Be strong and of a good courage” three times (verses 6, 7, 9), and between them, “observe to do according to all the law” (verse 7). The book that follows holds both sides. It shows “the Lord’s faithfulness in keeping His covenant with Abraham to give the Israelites the promised land,” and it “describes Israel’s covenant responsibility to remember the Lord and keep His commandments.”

  Then the people take up the LORD's words. Joshua's orders run through the camp, and the people answer with the promise turned into a wish, “only the LORD thy God be with thee, as he was with Moses” (verse 17), and end with the charge itself (verse 18).

sections:
  - range: 1-9
    heading: Arise, go over this Jordan
    plain: |
      After the death of Moses, the LORD's servant, the LORD spoke to Joshua son of Nun, who had served Moses. He said: “Moses My servant is dead. So now get up and cross this Jordan, you and all this people, into the land I am giving them, the children of Israel. Every place where you set your foot I have given you, as I promised Moses. Your territory will run from the wilderness and this Lebanon to the great river Euphrates, all the land of the Hittites, and west to the Mediterranean. No one will be able to stand against you as long as you live. As I was with Moses, so I will be with you; I will not fail you or abandon you.

      “Be strong and courageous, for you will lead this people to inherit the land I swore to their fathers to give them. Only be strong and very courageous, and be careful to do everything in the law My servant Moses commanded you. Do not turn from it to the right or the left, so that you will prosper wherever you go. Keep this book of the law always on your lips; meditate on it day and night, so that you will be careful to do everything written in it. Then your way will prosper and you will succeed. Have I not commanded you? Be strong and courageous. Do not be afraid or dismayed, for the LORD your God is with you wherever you go.”
  - range: 10-11
    heading: Prepare you victuals
    plain: |
      Then Joshua gave orders to the officers of the people: “Go through the camp and tell the people, ‘Get your provisions ready, for within three days you will cross this Jordan to go in and take possession of the land the LORD your God is giving you.’”
  - range: 12-15
    heading: Ye shall pass before your brethren armed
    plain: |
      To the Reubenites, the Gadites and the half-tribe of Manasseh Joshua said: “Remember what Moses the LORD's servant commanded you: the LORD your God has given you rest and has given you this land. Your wives, your children and your livestock shall remain in the land Moses gave you on this side of the Jordan, but all your mighty men of valour must cross over armed ahead of your brethren and help them, until the LORD gives them rest as He has given you, and they too have taken the land the LORD your God is giving them. Then you may return to the land that is yours and enjoy it, the land Moses the LORD's servant gave you east of the Jordan, toward the sunrise.”
  - range: 16-18
    heading: Only be strong and of a good courage
    plain: |
      They answered Joshua: “Everything you command us we will do, and wherever you send us we will go. Just as we heeded Moses in everything, so we will heed you. Only may the LORD your God be with you as He was with Moses! Anyone who rebels against your command and does not heed your words in all you command him shall be put to death. Only be strong and courageous.”

notes:
  - ref: 1
    phrase: Joshua the son of Nun, Moses’ minister
    kind: history
    title: Moses’ minister
    body: |
      The LORD speaks here to a man already appointed: Joshua had been “Moses’ minister” since the wilderness ([[Ex. 24:13]]; [[Ex. 33:11]]) and was set apart as his successor by the laying on of hands ([[Num. 27:18–23]]; [[Deut. 34:9]]); those events are explained where they happen, and Moses' death at [[Deut. 34:5]].

      Why then does the LORD speak again? One older reading takes “after the death of Moses” as after the thirty days of mourning ([[Deut. 34:8]]), and the word as a second call: Joshua, already installed, now receives “the command to enter upon the office to which he had been called.” What he needed, on that reading, “was not merely that the will of God should be made known to him, but that he should be inspired with courage and strength for the fulfilment of it,” which is what the rest of the speech gives him.
    sources: [bd-joshua, keil-joshua]

  - ref: 4
    phrase: all the land of the Hittites
    kind: history
    title: The land of the Hittites
    body: |
      On one older reading, “the Hittites” here names the peoples of Canaan as a whole, the expression used “in a broader sense for Canaanites in general,” as in [[1 Kgs. 10:29]] and [[Ezek. 16:3]]; the same reading explains “this Lebanon” by the mountains being “visible from the Israelitish camp.”

      The borders are the promise already made. Verses 3–4 follow Moses' words in [[Deut. 11:24]], and the same reading takes “as I said unto Moses” to point back to the promise of [[Ex. 23:30–31]]. The Euphrates is the border already named to Abraham, “unto the great river, the river Euphrates” ([[Gen. 15:18]]), and the boundary gives the full reach of the promises to Israel's ancestors: “the family of Abraham claims the entirety of the land.” When Israel's border actually reached the Euphrates is said at [[Deut. 11:24]].
    sources: [keil-joshua, ot-minute-josh-1]

  - ref: 5
    phrase: as I was with Moses, so I will be with thee
    kind: scripture
    title: As I was with Moses
    body: |
      The promise of verse 5 is the one the book goes on to show kept. Its words are Moses' own to Israel and to Joshua: no man would “stand before you” ([[Deut. 11:25]]), and “he will not fail thee, neither forsake thee” ([[Deut. 31:8]]).

      The LORD repeats the comparison with Moses at the Jordan, “that they may know that, as I was with Moses, so I will be with thee” ([[Josh. 3:7]]), and the narrator confirms it: “they feared him, as they feared Moses, all the days of his life” ([[Josh. 4:14]]). The book sets Joshua's acts beside Moses': the river parted, the shoes loosed on holy ground ([[Josh. 5:15]]), the victories, the sun. The book is “a record of God keeping His promise to be with His prophet and people,” and the parallels between the two men show it, “demonstrating God’s consistency.”
    sources: [esplin-as-with-moses, lds-scriptures]

  - ref: 6
    phrase: Be strong and of a good courage
    kind: structure
    title: Three times, and then a fourth
    body: |
      The LORD says “be strong” three times, and each time the words around the charge are different. Verse 6 joins it to the promise: Joshua will divide the land “which I sware unto their fathers to give them” ([[Josh. 1:6]]). Verse 7 ties it to the law: “Only be thou strong and very courageous, that thou mayest observe to do according to all the law” ([[Josh. 1:7]]). Verse 9 gives the LORD's presence as its reason: “for the LORD thy God is with thee whithersoever thou goest” ([[Josh. 1:9]]).

      The words were Moses' first (see the note at [[Deut. 31:7]]). The fourth time they come from the people: their answer ends, “only be strong and of a good courage” ([[Josh. 1:18]]), so that the people “echo the reassurance given by God.” The charge Joshua received is the one his people give back to him.
    sources: [ot-minute-josh-1, lds-scriptures]

  - ref: 8
    phrase: This book of the law shall not depart out of thy mouth
    kind: history
    title: Which book of the law
    body: |
      “This book of the law” is most likely an early form of the book of Deuteronomy. The phrase is Deuteronomy's own for the book Moses wrote and had laid beside the ark: “Take this book of the law, and put it in the side of the ark” ([[Deut. 31:26]]; see [[Deut. 31:9]]). Scholars call Joshua through 2 Kings the “Deuteronomistic History,” a name for the books that tell Israel's story in Deuteronomy's terms.

      The note at [[Ps. 1:2]], which shares this verse's words, explains what “meditate” means in Hebrew and why meditating may be half spoken aloud, so that the book does not “depart out of thy mouth.”
    sources: [ot-minute-josh-1, lds-scriptures]

  - ref: 8
    phrase: then thou shalt have good success
    kind: words
    title: Prosperous, and wise
    body: |
      “Good success” translates a Hebrew verb whose root sense is prudence, though here it means to prosper. Verse 8 has two verbs. “Make thy way prosperous” is from a verb whose causative form means “make prosperous, bring to successful issue,” used here with “way” as its object. “Have good success” is *taśkîl*, from *śākal*, “be prudent, circumspect,” though in this verse, and in the “prosper” of verse 7, it carries its sense “prosper, have success.”

      Both verses make success the result of keeping the law: “that thou mayest observe to do according to all that is written therein: for then…” ([[Josh. 1:8]]).
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 11
    phrase: within three days ye shall pass over this Jordan
    kind: history
    title: Within three days
    body: |
      On one older reading, the three days of verse 11 are the time allowed to prepare, not the date of the crossing, which the next two chapters put later. The spies Joshua sends to Jericho hide in the mountains three days before returning ([[Josh. 2:22]]), and when Israel reaches the river, it waits three days more ([[Josh. 3:1–2]]). On that reading the three days of verse 11 are “not to be regarded as a prediction of the time when the crossing actually took place,” but as “the latest time that could be allowed to the people to prepare”; the spies' delay stretched the time, so that “at least … eight whole days” passed between their sending and the crossing. The text itself dates only the crossing, on “the tenth day of the first month” ([[Josh. 4:19]]).
    sources: [keil-joshua]

  - ref: 15
    phrase: then ye shall return unto the land of your possession, and enjoy it
    kind: words
    title: Possess it, and enjoy it
    body: |
      “Enjoy it” translates the same Hebrew verb as “possessed” earlier in the verse, used in its sense “to enjoy possession of.” The tribes of Reuben, Gad and half of Manasseh had their land already, on the condition that their fighting men cross over and help the rest (the bargain is told at [[Num. 32:6]] and repeated at [[Deut. 3:18]]). Their brothers must first “have possessed” (*wĕyārĕšû*) the land; only then may these tribes go home and, with the same verb, “enjoy” it (*wîrištem*).

      One reading hears this use of the verb in the Book of Mormon's “we might have enjoyed our possessions and the land of our inheritance” ([[1 Ne. 17:21]]): Laman and Lemuel's complaint, on that reading, speaks the language of Israel's inheritance, a land of inheritance being “a seminal Abrahamic Covenant concept.”
    sources: [bowen-yrs]

  - ref: 16
    phrase: All that thou commandest us we will do
    kind: history
    title: As they followed Moses
    body: |
      The people's answer pledges to follow Joshua as Israel had followed Moses, and so confirms him in Moses' place: “The Israelite response to Joshua ratifies his status as Moses’s successor.” It is also an act of sustaining: “Seeking to sustain him, they pledged” obedience in everything.

      The penalty of death for anyone who rebels against his command ([[Josh. 1:18]]) is in the people's own words; Joshua had not named it.
    sources: [ot-minute-josh-1, esplin-as-with-moses]

christ: |
  Joshua bears the Savior's name. In Hebrew it means “Jehovah is salvation,” and through Greek and Latin it became Jesus in English. The King James New Testament gives Joshua himself that name ([[Acts 7:45]]; [[Heb. 4:8]]), as the note at [[Num. 13:16]] and the witness of Christ at [[Deut. 3:28]] explain. The LORD who promises to be with him is Jehovah, the premortal Christ (see [[Ex. 3:14]]). Joshua leading Israel into the land “can remind us of Jesus Christ leading all the faithful into the ultimate land of promise, the celestial kingdom.” The rest the LORD gives in verses 13 and 15 is land. The Church's footnote at verse 13 points to the rest Israel lost in the wilderness, “which rest is the fulness of his glory” ([[D&C 84:24]]).

  Hebrews takes up the promise of verse 5, “I will never leave thee, nor forsake thee” ([[Heb. 13:5]]), for every believer, and from it draws the believer's courage now: “So that we may boldly say, The Lord is my helper, and I will not fear what man shall do unto me” ([[Heb. 13:6]]).

explore: |
  - [[Deut. 31:1–8]] and [[Deut. 31:23]]: Moses' charge to Joshua, which this chapter repeats.
  - [[Ps. 1]]: the man who meditates on the law day and night.
  - [[Heb. 4:1–11]]: the rest Joshua gave, and the rest that remains.
  - [[Num. 32]]: the bargain with the tribes east of the Jordan that verses 12–15 call in.

