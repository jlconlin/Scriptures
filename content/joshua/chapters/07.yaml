chapter: 7
title: The Accursed Thing in the Midst of Thee
tagline: Israel is routed at Ai because Achan has taken from the devoted spoil of Jericho; the LORD finds him out, and he and his household die in the valley of Achor.
when: 'After the fall of Jericho, on the way up to Ai'

setting: |
  Joshua 7 follows straight on from the fall of Jericho. Before the wall fell Joshua had warned the people to keep themselves “from the accursed thing, lest ye make yourselves accursed… and make the camp of Israel a curse, and trouble it” ([[Josh. 6:18]]); the word and the warning are explained at [[Josh. 6:17]] and [[Deut. 7:2]]. One man of Judah ignored it. Ai, the next city after Jericho, took Israel two attempts: the rout of this chapter (verses 2–5) and the victory of chapter 8 ([[Josh. 8:1–29]]).

  Later scripture does not forget the chapter. When Israel later fears a new trespass, the people remember Achan ([[Josh. 22:20]]; see the note at verse 1), and Chronicles lists him in Judah's genealogy as the troubler of Israel ([[1 Chr. 2:7]]). The prophets turn the valley where he died into a promise ([[Hos. 2:15]]; [[Isa. 65:10]]; see the note at verse 26).

thread: |
  The chapter's first verse tells the reader what Joshua does not yet know: one man took of the devoted thing, and “the children of Israel committed a trespass.” Everything after follows from that sentence. Though Achan acted alone, the Lord counted the sin to all Israel, and Israel lost His protection: three thousand men flee from a small town (verses 4–5), and the LORD says He will not be with them again “except ye destroy the accursed from among you” (verse 12).

  So the story moves inward, from the battlefield to the camp, from the nation to a tribe, a family, a household and a man (verses 14–18), until the thing hidden “in the earth in the midst of my tent” (verse 21) is laid out “before the LORD” (verse 23). Only then does the LORD turn “from the fierceness of his anger” (verse 26).

  Set beside chapters 2 and 6, the story reads as an inversion of Rahab's: Rahab, a Canaanite, sought mercy and lived with her family; Achan, an Israelite of Judah, hid what he took and died with his. The herem, on one Latter-day Saint reading, “is not primarily about ethnicity or nationality but about one’s personal attitude toward God.”

sections:
  - range: 1-5
    heading: The trespass and the rout at Ai
    plain: |
      But Israel broke faith over the devoted things. Achan son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, took some of what was devoted, and the LORD's anger burned against Israel. Joshua sent men from Jericho to Ai, near Beth-aven, east of Bethel, to scout the country, and they did. They came back and told him, “Don't send the whole army. Two or three thousand men can take Ai; don't wear everyone out going up there, because there are only a few of them.” So about three thousand men went up, and they ran from the men of Ai. The men of Ai killed about thirty-six of them, chasing them from the city gate as far as Shebarim and cutting them down on the slope. The people's courage melted and turned to water.
  - range: 6-9
    heading: Joshua's prayer
    plain: |
      Joshua tore his clothes and lay face down on the ground before the ark of the LORD until evening, he and the elders of Israel, with dust on their heads. Joshua said, “Ah, Lord GOD, why did you ever bring this people across the Jordan, only to hand us over to the Amorites to be destroyed? If only we had been content to stay on the other side of the Jordan! O Lord, what can I say, now that Israel has turned and run from its enemies? The Canaanites and everyone in the land will hear of it, surround us, and wipe our name from the earth. And then what will you do for your own great name?”
  - range: 10-15
    heading: The LORD's answer
    plain: |
      The LORD said to Joshua, “Get up! Why are you lying on your face? Israel has sinned. They have broken the covenant I commanded them: they have taken some of the devoted things, stolen them, lied about it, and put them among their own belongings. That is why Israel cannot stand before its enemies but turns and runs: they have become devoted to destruction themselves. I will not be with you any longer unless you destroy the devoted thing from among you. Get up, consecrate the people, and tell them: Consecrate yourselves for tomorrow, for the LORD God of Israel says, There is a devoted thing among you, Israel, and you cannot stand before your enemies until you remove it. In the morning come forward tribe by tribe. The tribe the LORD takes will come forward clan by clan, the clan the LORD takes household by household, and the household the LORD takes man by man. Whoever is taken with the devoted thing shall be burned, he and all he has, because he has broken the LORD's covenant and done a shameful thing in Israel.”
  - range: 16-23
    heading: Achan found out
    plain: |
      Early the next morning Joshua brought Israel forward tribe by tribe, and the tribe of Judah was taken. He brought the clans of Judah, and the clan of the Zarhites was taken; he brought the Zarhites man by man, and Zabdi was taken; he brought Zabdi's household man by man, and Achan son of Carmi, son of Zabdi, son of Zerah, of Judah, was taken. Joshua said to Achan, “My son, give glory to the LORD God of Israel and confess to him. Tell me what you have done; don't hide it from me.” Achan answered, “It's true. I have sinned against the LORD God of Israel. This is what I did. Among the spoil I saw a beautiful Babylonian robe, two hundred shekels of silver and a bar of gold weighing fifty shekels. I wanted them and took them. They are buried in the ground inside my tent, with the silver underneath.” Joshua sent messengers, who ran to the tent, and there it was, hidden in the tent with the silver underneath. They took the things out of the tent, brought them to Joshua and all Israel, and spread them out before the LORD.
  - range: 24-26
    heading: The valley of Achor
    plain: |
      Then Joshua, and all Israel with him, took Achan son of Zerah, with the silver, the robe and the bar of gold, his sons and daughters, his cattle, donkeys and sheep, his tent and everything he had, and brought them up to the valley of Achor. Joshua said, “Why have you brought trouble on us? The LORD will bring trouble on you today.” All Israel stoned him, and after they had stoned them they burned them. They raised a great heap of stones over him, which is there to this day. Then the LORD turned from his fierce anger. That is why the place is still called the valley of Achor, the valley of trouble.

notes:
  - ref: 1
    phrase: the children of Israel committed a trespass in the accursed thing
    kind: history
    title: One man took it; Israel trespassed
    body: |
      The verse names one thief and charges the whole people, and the rest of the chapter holds to both: Achan acted alone, yet the Lord counted the sin to all Israel (on the devoted things of Jericho, see the note at [[Josh. 6:17]]). The LORD's own charge in verse 11 is in the plural, “Israel hath sinned, and they have also transgressed my covenant,” and the cost falls on the nation: thirty-six men die at Ai, and the army cannot stand.

      The reason lies in the covenant. Israel, “since they had publicly committed themselves to the covenant, became responsible both as individuals as well as a community to obey its stipulations.” That corporate responsibility underlay the enforcement of the law of Moses, “since the entire community would bear the consequences of the sin of an individual that went unresolved,” and Achan is the case in point. The LORD makes the same point: His strength would not return until the accursed thing was taken away (verses 12–13).

      Israel remembered the lesson in those terms. When the tribes later feared another trespass, they asked, “Did not Achan the son of Zerah commit a trespass in the accursed thing, and wrath fell on all the congregation of Israel? and that man perished not alone in his iniquity” ([[Josh. 22:20]]).
    sources: [scripture-helps-josh, seely-covenant-renewal, lds-scriptures]

  - ref: 2
    phrase: Ai, which is beside Beth-aven, on the east side of Beth-el
    kind: history
    title: Ai, the ruin
    body: |
      Ai lay east of Bethel, where Abraham had built an altar, “having Beth-el on the west, and Hai on the east” ([[Gen. 12:8]]). The name means simply “ruin” or “desolation,” which foreshadows its fate in chapter 8. It is identified with modern et-Tell; what the excavations there have and have not found is taken up at [[Josh. 8:28]].
    sources: [ot-minute-josh-7, lds-scriptures]

  - ref: 9
    phrase: what wilt thou do unto thy great name?
    kind: scripture
    title: What wilt thou do unto thy great name?
    body: |
      Joshua's appeal to the LORD's “great name” is, on one older reading, the plea Moses made in the wilderness: how will the LORD keep His name, made known through His wonders for Israel, from being “blasphemed among the heathen” if Israel is wiped out? Moses had pleaded, when the LORD threatened to destroy Israel after the spies' report, “Then the Egyptians shall hear it” ([[Num. 14:13]]), and argued the same after the golden calf ([[Ex. 32:11–12]]; [[Deut. 9:28]]).

      Verse 7 sounds harder. “Would to God we had been content, and dwelt on the other side Jordan” is, on the same reading, close to the complaint of the murmuring people in [[Num. 14:2–3]]: it “almost amounts to murmuring,” yet it is not unbelief but “the bold language of faith wrestling with God in prayer.”

      The LORD's answer takes up neither the complaint nor the question. “Get thee up; wherefore liest thou thus upon thy face? Israel hath sinned” (verses 10–11). The cause of the defeat was in the camp.
    sources: [keil-joshua, lds-scriptures]

  - ref: 19
    phrase: give, I pray thee, glory to the LORD God of Israel, and make confession unto him
    kind: history
    title: Found by the LORD, convicted by his own words
    body: |
      Achan is found by the LORD, step by step, and condemned on his own confession and the evidence in his tent. His transgression “was detected through revelation to Joshua.” The text says only that the LORD “taketh” a tribe, a family, a household and a man (verses 14–18); one older reading understands a lot cast as each group came before the LORD. On one devotional reading, the slow narrowing was mercy as well as search: “At each step in the identification process, the Lord had given Achan an opportunity to come forward and admit his sin, but he had refused until he was directly exposed.”

      Joshua calls him “My son” and charges him to “give glory to the LORD,” which was, on the same older reading, “a solemn formula of adjuration, by which a person was summoned to confess the truth before the face of God,” the phrase the Pharisees use with the man born blind ([[John 9:24]]). Achan confesses fully (verses 20–21), and the messengers find the things where he said (verse 22).

      That sequence matters because the law asked for two or three witnesses before a man could be put to death ([[Deut. 17:6]]), and here the only witness was Achan. One Latter-day Saint reading judges it likely that revelation, a free confession and physical evidence together “could stand in the place of the two or three witnesses normally required,” and finds the same pattern centuries later in the Book of Mormon, when Seantum was exposed by Nephi's prophecy and confessed ([[Hel. 9:35–38]]).
    sources: [keil-joshua, bd-achan, morgan-achan, sc-knowhy-180, lds-scriptures]

  - ref: 21
    phrase: then I coveted them, and took them
    kind: history
    title: Had he only waited
    body: |
      Achan took a fine mantle from Mesopotamia, some silver and a bar of gold, spoil he could soon have had lawfully. In the next battle the LORD tells Joshua that at Ai “the spoil thereof, and the cattle thereof, shall ye take for a prey unto yourselves” ([[Josh. 8:2]]). Had Achan “only waited until the battle of Ai in the following chapter, he would have received the plunder that God granted,” and the lesson, on one Latter-day Saint reading, is one of “trusting or waiting on Jehovah and obeying his word”: “He did not believe that God was being fair to him in Jericho’s ḥerem and seized what belonged to God. Faith in God would have brought different results.”
    sources: [calabro-herem, lds-scriptures]

  - ref: 24
    phrase: his sons, and his daughters
    kind: history
    title: Why his sons and daughters died with him
    body: |
      The text says that Achan's sons and daughters, his animals, his tent and all he had were taken to the valley of Achor, and that after Achan was stoned they “burned them with fire, after they had stoned them with stones” ([[Josh. 7:25]]); it does not say why the children shared his end. Because Achan had become accursed, he and his household and belongings were destroyed as Jericho was, but “The scriptures do not clearly explain why Achan’s family shared his punishment.” Two suggestions have been offered: that the children were not killed but “brought to view his punishment,” or that the family “may have been aware of Achan’s crime and did not report it.”

      Two Latter-day Saint readings place the story in its world. One grants that the punishment “seems overly harsh to modern readers, but in an ancient mindset it makes some sense”: removing Achan and everyone connected with him was meant to “quarantine” the violation of the herem from the community. The other reads it through the herem itself: by taking what was devoted, “Achan and his family become objects of the ḥērem themselves,” and Rahab the Canaanite, who sought mercy, ends by “taking the place of Achan in the very same tribe of Judah.”

      The law of Moses itself says, “The fathers shall not be put to death for the children, neither shall the children be put to death for the fathers: every man shall be put to death for his own sin” ([[Deut. 24:16]]). How that law bears on Achan's household is a question the chapter leaves open.
    sources: [scripture-helps-josh, ot-minute-josh-7, calabro-herem, lds-scriptures]

  - ref: 26
    phrase: The valley of Achor
    kind: words
    title: Achan, Achor, and trouble
    body: |
      The place is named for what happened there, in a play on words that runs through the chapter. Joshua's sentence on Achan uses the verb *ʿākar*, “trouble,” twice: “Why hast thou troubled us? the LORD shall trouble thee this day” (verse 25). The valley is *ʿĀkôr*, and both echo the name Achan, *ʿĀkān*. It is the same verb Joshua had used at Jericho, when he warned that taking the devoted thing would “make the camp of Israel a curse, and trouble it” ([[Josh. 6:18]]). Chronicles calls him “Achar, the troubler of Israel” ([[1 Chr. 2:7]]), in Hebrew *ʿākār ʿôkēr yiśrāʾēl*, name and verb sounding alike.

      The heap and the name stood “unto this day.” The prophets later take up the name as a promise. Hosea promises Israel “the valley of Achor for a door of hope” ([[Hos. 2:15]]; see the note there), and Isaiah makes it “a place for the herds to lie down in, for my people that have sought me” ([[Isa. 65:10]]).
    sources: [ot-minute-josh-7, oshb-wlc, lds-scriptures]

christ: |
  The LORD who would not go with Israel while the devoted thing lay hidden in the camp is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]). He searched out what was hidden, and when it was brought into the open and put away, He “turned from the fierceness of his anger” (verse 26). The valley of trouble became, in His later promise, “a door of hope” ([[Hos. 2:15]]).

  Hidden sin in a disciple's life still weakens more than the one who hides it; the sins of a few can have “a negative, even calamitous, effect on others,” in a family or a congregation, and “the inward vessel shall be cleansed first” ([[Alma 60:23]]). With the devoted thing put away, Israel takes Ai in the next chapter ([[Josh. 8:1]]); through repentance a disciple “may have power to succeed where we first have failed,” a blessing “made possible through the redemptive work of Jesus Christ.”

explore: |
  - [[Josh. 6:17–19]] and [[Josh. 8:1–2]]: the devoted spoil of Jericho, and the spoil the LORD gave freely at Ai.
  - [[Josh. 2]] and [[Josh. 6:22–25]]: Rahab, the Canaanite who sought mercy, set against Achan the Israelite.
  - [[Josh. 22:20]], [[Hos. 2:15]] and [[Isa. 65:10]]: how later scripture remembers Achan and the valley of Achor.
  - [[Hel. 9:35–38]]: Seantum, the Book of Mormon's case of a man exposed by revelation and his own confession.
  - [“Thou Shalt Utterly Destroy”: Understanding the Biblical Ḥērem](https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy) (Religious Studies Center, 2025): a Latter-day Saint study of the herem that sets Rahab and Achan side by side as contrasting responses to it.

