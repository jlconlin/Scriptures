chapter: 18
title: Before the LORD in Shiloh
tagline: The tabernacle is set up at Shiloh, seven slack tribes are sent to write down the land, and Benjamin's lot comes up first.
when: 'At Shiloh, after "the land was subdued before them"'

setting: |
  Joshua 18 stands in the middle of the allotment chapters (13–21). Judah's inheritance was given in chapter 15, and Joseph's, for Ephraim and half of Manasseh, in chapters 16–17. Seven tribes remained, and chapters 18–19 give their lots: Benjamin's in this chapter (verses 11–28), then Simeon, Zebulun, Issachar, Asher, Naphtali and Dan in chapter 19.

  Before the lots are cast the scene moves. Judah had come to Joshua “in Gilgal” ([[Josh. 14:6]]); now the whole congregation gathers at Shiloh and sets up the tabernacle there (see the note at verse 1). The division ends at the same place, “by lot in Shiloh before the LORD, at the door of the tabernacle of the congregation” ([[Josh. 19:51]]).

  Division by lot had been commanded through Moses (see [[Num. 26:55]]), and [[Num. 18:20]] explains why the Levites had no land. Moses had also given the land east of the Jordan to Reuben, Gad and half of Manasseh ([[Num. 32:33]]). What this chapter adds is a rebuke, a written survey of what was left, and the first of the seven lots. Where the tribes lay is set out in the guide [The Land](/old-testament/guides/the-land/#inheritance).

thread: |
  The land has been given and subdued, and it still has to be possessed. Verse 1 says that “the land was subdued before them”; two verses later Joshua asks seven tribes, “How long are ye slack to go to possess the land, which the LORD God of your fathers hath given you?” (verse 3). His answer is work done in order and done before the LORD: twenty-one men walk through the land and write it down “by cities into seven parts in a book” (verse 9), and then the lots are cast “in Shiloh before the LORD” (verse 10), at the tabernacle the chapter has just set up (see the note at verse 10).

  The first lot falls to Benjamin, between Judah and Joseph (verse 11). The chapter traces Benjamin's border (verses 12–20), then lists its towns in two groups (verses 21–28). The second group ends with “Jebusi, which is Jerusalem,” the border city whose people neither Benjamin nor Judah drove out (see the note at verse 16).

sections:
  - range: 1-2
    heading: The tabernacle at Shiloh
    plain: |
      The whole congregation of Israel gathered at Shiloh and set up the tabernacle, the tent of meeting, there. The land had been subdued before them. But seven tribes had not yet received their inheritance.
  - range: 3-10
    heading: The land written down and divided by lot
    plain: |
      Joshua said to the Israelites, “How long will you hold back from going in to take possession of the land the LORD, the God of your fathers, has given you? Choose three men from each tribe. I will send them out to go through the land and write a description of it, with your inheritances in view, and they will come back to me. They will divide it into seven parts. Judah will stay in its territory in the south, and the house of Joseph in its territory in the north. Write a description of the land in seven parts and bring it here to me, and I will cast lots for you here before the LORD our God. The Levites have no share among you, because the priesthood of the LORD is their inheritance; and Gad, Reuben and half the tribe of Manasseh have already received their inheritance east of the Jordan, which Moses the servant of the LORD gave them.” So the men set out. Joshua charged them, “Go, walk through the land and write a description of it, and come back to me, so that I may cast lots for you here before the LORD in Shiloh.” The men went through the land and wrote it down in a book, town by town, in seven parts, and came back to Joshua at the camp in Shiloh. Joshua cast lots for them in Shiloh before the LORD, and there he divided the land among the Israelites by their divisions.
  - range: 11-20
    heading: Benjamin's border
    plain: |
      The lot of the tribe of Benjamin came up, clan by clan, and their territory lay between Judah and Joseph. Their northern border began at the Jordan, went up the slope north of Jericho and westward through the hill country, and came out at the wilderness of Beth-aven. From there it crossed toward Luz, which is Bethel, on its south side, and went down to Ataroth-adar, near the hill south of Lower Beth-horon. Then the border turned southward along the western side, from the hill that faces Beth-horon, and ended at Kirjath-baal, which is Kirjath-jearim, a town of Judah: that was the western side. The southern side began at the edge of Kirjath-jearim and ran west to the spring of the waters of Nephtoah. It went down to the foot of the mountain that faces the valley of the son of Hinnom, at the north end of the valley of the giants, down the valley of Hinnom along the south side of the Jebusite city, and down to En-rogel. It turned north to En-shemesh, on to Geliloth opposite the ascent of Adummim, and down to the stone of Bohan the son of Reuben. It passed along the slope north of the Arabah and went down into the Arabah, passed the north side of Beth-hoglah, and ended at the northern bay of the Salt Sea (the Dead Sea), at the southern end of the Jordan: that was the southern border. The Jordan was its border on the east. This was the inheritance of Benjamin, by its borders all around, clan by clan.
  - range: 21-28
    heading: Benjamin's towns
    plain: |
      The towns of the tribe of Benjamin, clan by clan, were Jericho, Beth-hoglah, Emek-keziz, Beth-arabah, Zemaraim, Bethel, Avim, Parah, Ophrah, Chephar-haammonai, Ophni and Gaba: twelve towns with their villages. Then Gibeon, Ramah, Beeroth, Mizpeh, Chephirah, Mozah, Rekem, Irpeel, Taralah, Zelah, Eleph, Jebusi (that is, Jerusalem), Gibeath and Kirjath: fourteen towns with their villages. This was the inheritance of Benjamin, clan by clan.

notes:
  - ref: 1
    phrase: assembled together at Shiloh, and set up the tabernacle of the congregation there
    kind: history
    title: The tabernacle comes to Shiloh
    body: |
      Israel's place of assembly moves from the camp at Gilgal to Shiloh, and the tabernacle set up there stays for generations. Until now the camp had been at Gilgal ([[Josh. 14:6]]); with this verse Shiloh becomes the place of assembly, and this is “the first reference to Shiloh in the context of the historical setting of ancient Israel.” The town lay north of Bethel “in the tribe of Ephraim,” Joshua's own tribe, and “the tabernacle was here during the greater part of the period of the Judges,” until the ark was lost in battle.

      The text does not say why Shiloh was chosen. In one older reading its “central situation” suited both the tabernacle and the apportioning of the tribes; in another, “Joshua did not follow his own judgment in selecting Shiloh,” but acted on the LORD's having reserved to Himself the choice of the place where His name would dwell. What that chosen place meant is taken up at [[Deut. 12:5]], and how Shiloh was later lost at [[Jer. 7:12]].
    sources: [ot-minute-josh-18, bd-shiloh, cambridge-joshua, keil-joshua]

  - ref: 3
    phrase: How long are ye slack to go to possess the land
    kind: words
    title: Subdued, but not possessed
    body: |
      Joshua rebukes seven tribes for standing still in a land already given and already subdued. Verse 1 has just said that “the land was subdued before them,” with the Hebrew verb *kābaš*, which “denotes to ‘tread under the feet,’” the word of “replenish the earth, and subdue it” ([[Gen. 1:28]]). Now Joshua asks how long they will be “slack,” the verb used of “one shewing himself slack.”

      The chapter does not say why they waited. In one older reading the slackness was about more than fighting: the tribes were slow “not merely to conquer it, but to have it divided by lot, and to enter in and take possession.” Joshua's answer in verses 4–10 is a survey and the lot. The land is still the LORD's gift, the land “which the LORD God of your fathers hath given you”; what is wanting is the people going in to take it.
    sources: [oshb-wlc, cambridge-joshua, bdb, keil-joshua]

  - ref: 6
    phrase: Ye shall therefore describe the land into seven parts
    kind: words
    title: The land written in a book
    body: |
      To “describe” the land here is to write it down: “the King James Version renders the Hebrew *ktv*, ‘write,’ as ‘describe.’” The twenty-one men, three from each tribe, are to go through the land and return with a written record, and verse 9 says they did, describing it “by cities into seven parts in a book.” The Israelites were thus “divinely instructed to preserve in writing a description of the allotted territories,” and on one reading this “reinforced the importance of record keeping among God’s covenant people.” The record may also hint at one of the sources the compiler of Joshua drew on for his description of the territories.

      In one older reading the survey was not a formal measurement but, in all probability, “the preparation of lists of the towns in the different parts of the land, with an account of their size and character,” which fits verse 9's “by cities.”
    sources: [ot-minute-josh-18, oshb-wlc, keil-joshua, cambridge-joshua]

  - ref: 10
    phrase: Joshua cast lots for them in Shiloh before the LORD
    kind: history
    title: Lots cast before the LORD
    body: |
      The land is divided as an act done in the LORD's presence, at His tent. The lot itself was commanded through Moses (see [[Num. 26:55]]); what this chapter adds is the place, said three times: “here before the LORD our God” (verse 6), “before the LORD in Shiloh” (verse 8), “in Shiloh before the LORD” (verse 10). The repetition makes plain “the ritual nature of the allotment,” with the lots cast in front of the assembled people. When the last tribe's lot has been drawn, the book closes the division at the same spot, “at the door of the tabernacle of the congregation” ([[Josh. 19:51]]).
    sources: [ot-minute-josh-18, lds-scriptures]

  - ref: 11
    phrase: the coast of their lot came forth between the children of Judah and the children of Joseph
    kind: history
    title: Benjamin between Judah and Joseph
    body: |
      Benjamin's lot falls between the two tribes already settled, Judah to the south and Joseph to the north. Within it lay Jericho ([[Josh. 6]]), Bethel ([[Josh. 8:17]]) and Gibeon ([[Josh. 9]]) (verses 21–25).

      Benjamin “provided the first king in the person of Saul.” When the kingdom divided, “Benjamin joined the northern tribes (1 Kgs. 12:21), but the nearness to Jerusalem seems to have caused Benjamin gradually to become part of the kingdom of Judah”: Benjamin's place between Judah and Joseph shaped its history.
    sources: [bd-benjamin, lds-scriptures]

  - ref: 16
    phrase: to the side of Jebusi on the south
    kind: history
    title: Jerusalem on the border
    body: |
      Jerusalem sits on the line between Benjamin and Judah, and verse 28 counts it among Benjamin's towns: “Jebusi, which is Jerusalem.” Benjamin's southern border runs down the valley of Hinnom past the south side of the Jebusite city, the same line as Judah's northern border (see the note on [[Josh. 15:8]]).

      It was assigned, but its people stayed: “the children of Benjamin did not drive out the Jebusites that inhabited Jerusalem; but the Jebusites dwell with the children of Benjamin in Jerusalem unto this day” ([[Judg. 1:21]]). Judah's failure to take the city, and its history until David, are in the note on [[Josh. 15:63]].
    sources: [lds-scriptures]

christ: |
  The land in this chapter is apportioned “before the LORD,” at His tabernacle, and the LORD who gives each tribe its lot is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]). Joshua's question in verse 3 assumes the gift is already made: the land is one “which the LORD God of your fathers hath given you.”

  What the seven tribes lacked was not the LORD's giving but their going in to receive what He had given. Latter-day revelation states the principle for every gift of God: “what doth it profit a man if a gift is bestowed upon him, and he receive not the gift?” ([[D&C 88:33]]). A blessing the Lord has already granted a disciple still has to be received.

explore: |
  - [[Josh. 19]]: the other six lots, Joshua's own city, and the division finished at Shiloh.
  - [[Josh. 15:1–12]] and [[Josh. 15:63]]: Judah's border, the other side of Benjamin's, and the Jebusites left in Jerusalem.
  - [[1 Sam. 1–4]]: the tabernacle at Shiloh in the days of Eli and Samuel, and the loss of the ark.
  - [[Gen. 49:27]] and [[Deut. 33:12]]: Jacob's and Moses' blessings on Benjamin.

sources: [lds-scriptures, ot-minute-josh-18, bd-shiloh, cambridge-joshua, keil-joshua, oshb-wlc, bdb, bd-benjamin]
