chapter: 8
title: The LORD Gave Ai into Their Hand
tagline: After the defeat that Achan's theft brought, the LORD sends Israel against Ai again, gives the plan and the signal, and Joshua ends the campaign at an altar on Mount Ebal, reading the law to all Israel.
when: 'After the first defeat at Ai, near Beth-el; then at Shechem, between Ebal and Gerizim'

setting: |
  Joshua 8 is the second attempt on Ai. In chapter 7 a small force went up against the city and fled, about thirty-six men died ([[Josh. 7:5]]), and the cause was found in Achan, who had taken of the devoted things of Jericho (see the notes at [[Josh. 7:1]] and [[Josh. 7:24]]). With the trespass put away, the LORD speaks to Joshua again, and this time Israel goes up “with the Lord’s assurance of their victory.”

  Ai was “the fortress city of Ai, near Bethel,” a place already named when Abraham pitched his tent between Beth-el and Hai ([[Gen. 12:8]]); its name is explained at [[Josh. 7:2]].

  The last six verses move about thirty miles north, to Shechem between Mount Ebal and Mount Gerizim, where Moses had commanded an altar, the law written on stones, and the blessings and curses ([[Deut. 27:1–13]]; the place is described at [[Deut. 11:29]]). These verses are a postscript to the battle and a covenant-renewal ceremony, Moses' command carried out. Joshua will gather the people at Shechem once more near the end of his life ([[Josh. 24:1]]).

thread: |
  Chapter 7 ended in defeat; chapter 8 begins with the words of chapter 1. “Fear not, neither be thou dismayed,” the LORD tells Joshua (verse 1), and then gives him everything: the city, the terms for its spoil, the plan of the ambush (verse 2), and at the decisive moment the signal (verse 18). Joshua's orders end “according to the commandment of the LORD shall ye do” (verse 8), and the spoil is taken “according unto the word of the LORD which he commanded Joshua” (verse 27). In the battle the LORD's part shows “through frequent revealed directives” and through “Joshua’s ritual gesture at the battle of Ai.”

  The war accounts of Israel and its neighbors share five elements, the oracle, the taking of the city, the devoting of its people, the booty, and “founding of a cult installation,” and in Joshua they “appear most clearly” at Ai. In Joshua the last of them is an altar to the LORD on Ebal, and on it the law. So the campaign that began in defeat ends with Israel hearing every word of the covenant read (verses 30–35). One older reading takes the ceremony as Israel's acknowledgment that its victories were a pledge of the rest of the land, “provided only it persevered in covenant faithfulness.”

sections:
  - range: 1-2
    heading: The LORD sends Joshua again
    plain: |
      The LORD said to Joshua, “Don't be afraid or discouraged. Take all the fighting men and go up to Ai. I have given you the king of Ai, his people, his city and his land. Do to Ai and its king what you did to Jericho and its king, except that this time you may keep the spoil and the livestock for yourselves. Set an ambush behind the city.”
  - range: 3-13
    heading: The ambush is set
    plain: |
      Joshua and the army set out. He chose thirty thousand of his best men and sent them off by night with orders: “Hide behind the city, not far from it, and be ready. I and the rest of the people will come up to the city. When they come out against us as they did the first time, we will run from them, and they will chase us, saying, ‘They are running from us as before.’ Then you rise from hiding and take the city, for the LORD your God will give it to you. When you have taken it, set it on fire. Do as the LORD has commanded. These are my orders.” They went and hid between Beth-el and Ai, west of Ai, and Joshua spent the night with the people. Early the next morning he mustered the army and went up with the elders of Israel at its head. They camped north of Ai with a valley between them and the city. He set about five thousand men in ambush between Beth-el and Ai, west of the city, and that night Joshua went down into the valley.
  - range: 14-23
    heading: The city is taken
    plain: |
      When the king of Ai saw them, he and all his men hurried out early to fight Israel at the appointed time, facing the plain, not knowing there was an ambush behind the city. Joshua and Israel pretended to be beaten and fled toward the wilderness. All the men of Ai were called out to chase them, and they were drawn away from the city; not a man was left in Ai or Beth-el, and they left the city open. Then the LORD said to Joshua, “Stretch out the spear in your hand toward Ai, for I will give it to you,” and Joshua did. As soon as he stretched out his hand, the ambush rose, ran into the city, took it, and set it on fire. The men of Ai looked back and saw the smoke of their city going up to the sky, and they had nowhere to run, for the Israelites who had fled turned on them. When Joshua and Israel saw the smoke, they turned and struck down the men of Ai, and the men from the ambush came out of the city against them, so that Ai's army was caught between them and none escaped. The king of Ai was taken alive and brought to Joshua.
  - range: 24-29
    heading: Ai is destroyed
    plain: |
      When Israel had finished killing the people of Ai in the open country where they had chased them, they went back and struck the city. Twelve thousand men and women fell that day, all the people of Ai, for Joshua did not lower the hand that held out the spear until they were all destroyed. Israel kept only the livestock and the spoil, as the LORD had told Joshua. Joshua burned Ai and made it a ruin mound forever, desolate to this day. He hanged the king of Ai on a tree until evening; at sunset he had the body taken down and thrown at the city gate, and a great pile of stones was raised over it, which is still there.
  - range: 30-35
    heading: The law on Mount Ebal
    plain: |
      Then Joshua built an altar to the LORD God of Israel on Mount Ebal, as Moses the servant of the LORD had commanded and as the book of the law of Moses describes: an altar of uncut stones that no iron tool had touched. On it they offered burnt offerings and peace offerings to the LORD. There, while Israel watched, Joshua wrote on the stones a copy of the law of Moses. All Israel, with their elders, officers and judges, foreigners and native-born alike, stood on either side of the ark, facing the Levitical priests who carried it, half of them in front of Mount Gerizim and half in front of Mount Ebal, as Moses had commanded for the blessing of Israel. Then Joshua read all the words of the law, the blessings and the curses, just as they are written in the book of the law. There was not a word Moses had commanded that Joshua did not read to the whole assembly of Israel, with the women, the children, and the foreigners living among them.

notes:
  - ref: 1
    phrase: Fear not, neither be thou dismayed
    kind: scripture
    title: Fear not, after the defeat
    body: |
      The LORD's first words after Achan's sin is put away are the words of His first charge to Joshua: “be not afraid, neither be thou dismayed” ([[Josh. 1:9]]). Nothing has been withdrawn. The commission of chapter 1 stands, and Israel goes back to the city that defeated it with the LORD's promise of victory.

      The promise comes in a fixed form: “see, I have given into thy hand the king of Ai, and his people, and his city, and his land.” The war accounts of Israel and its neighbors open with an oracle ordering the conquest of the city, and in the Hebrew texts that oracle takes the formula “I have delivered X into your hand(s)” (compare [[Josh. 10:8]]). The LORD speaks of the city as already given, before Israel has taken a step toward it, as He did of Jericho ([[Josh. 6:2]]).
    sources: [lds-scriptures, ot-minute-josh-8, calabro-herem]

  - ref: 2
    phrase: only the spoil thereof, and the cattle thereof, shall ye take for a prey unto yourselves
    kind: history
    title: Ai's spoil given to Israel
    body: |
      At Ai the LORD lets Israel keep the livestock and the goods, the very thing forbidden at Jericho. Ai's people and its king fall under the same devoting as Jericho's (“as thou didst unto Jericho and her king”; the herem is explained at [[Josh. 6:21]]), but “one of the key differences this time” is the booty, and the text twice says the permission was the LORD's word (verses 2, 27).

      Jericho was the exception, not Ai. Across the conquest, “Only Jericho seems to get the most extreme form of destruction,” and “in every case other than Jericho, the livestock and spoils are kept by the Israelites.” At Ai the terms were set “in a divine oracle prior to the confrontation,” and such direction by oracle “may have been the general rule and may explain the variation.” What was devoted and what was given was the LORD's to say, city by city.

      The difference also sharpens chapter 7. In one reading, if Achan “had only waited until the battle of Ai in the following chapter, he would have received the plunder that God granted,” so that the lesson is “trusting or waiting on Jehovah and obeying his word.”
    sources: [ot-minute-josh-8, calabro-herem]

  - ref: 2
    phrase: lay thee an ambush for the city behind it
    kind: scripture
    title: An ambush the LORD commands
    body: |
      The plan of attack is the LORD's own command, given in the same breath as the promise of victory. Joshua's orders to the ambush end, “according to the commandment of the LORD shall ye do” (verse 8). The plan was “to feint a retreat in order to trick the army of Ai out of the city, thereby trapping it in an ambush,” “a classic military tactic.” The plan counts on the first defeat: Joshua expects Ai's men to say “They flee before us, as at the first” (verse 6).

      The same “military strategy of decoy” is set beside the Book of Mormon's account of the Nephites drawing the Lamanites out of the city of Mulek ([[Alma 52:19–26]]).
    sources: [lds-scriptures, ot-minute-josh-8, brandt-conquest]

  - ref: 12
    phrase: about five thousand men
    kind: history
    title: Thirty thousand, or five thousand
    body: |
      The text gives two numbers for the ambush, thirty thousand sent by night (verse 3) and about five thousand set between Beth-el and Ai (verse 12), and it does not say how they relate. One older reading names the “apparent discrepancy” and offers three possibilities: of the thirty thousand chosen, five thousand were “actually employed when the decisive moment came”; Joshua sent “two distinct bodies of men”; or the five thousand were sent the next day “from Joshua’s own force to encourage and assure them.” None of these is in the text, and the story is clear either way: a hidden force waits west of the city while Joshua draws its army out.
    sources: [cambridge-joshua]

  - ref: 18
    phrase: Stretch out the spear that is in thy hand toward Ai
    kind: symbol
    title: The spear held out
    body: |
      Joshua's outstretched spear sets the ambush moving (verse 19), and it does more: he holds it out until the city's people are destroyed, as Moses held up his hand until Amalek was defeated ([[Ex. 17:11]], where the raised hand is explained). The text says so itself: “Joshua drew not his hand back, wherewith he stretched out the spear, until he had utterly destroyed all the inhabitants of Ai” (verse 26). The gesture “recalls the actions of Moses in Israel’s battle with Amalek.”

      In one reading the weapon is a sickle sword, and Joshua, “standing at some distance from the city,” does not withdraw it “until he has devoted to destruction (heḥĕrīm) all the men of the city.” The verb “utterly destroyed” in verse 26 “is attributed solely to Joshua,” and the study reads his gesture as “part of the means by which the ḥērem is carried out.”

      Another reading takes it as a prophetic act, like Ahijah's torn garment or Jeremiah's stones: the spear “spelled out an ominous judgment against the city, which was immediately fulfilled when the Israelites ambushed the city.”
    sources: [lds-scriptures, ot-minute-josh-8, calabro-herem, parry-symbolic-action]

  - ref: 28
    phrase: made it an heap for ever
    kind: history
    title: A heap for ever, and what was found there
    body: |
      “An heap for ever” is the Hebrew *tel*, “mound,” the word for a ruin hill, and “unto this day” shows the narrator writing “some time afterwards.” The city's own name already meant “ruin” (see [[Josh. 7:2]]). The words can be read “simply as a statement of the long-lasting effect” of the destruction, but it is “likely” a “devastation pronouncement,” Joshua “ritually” declaring the city “a perpetual desolation, an act similar to the curse pronounced on Jericho.” Joshua's curse on Jericho is explained at [[Josh. 6:26]].

      Ai is usually identified with et-Tell, near Beth-el, and what was dug there is the hard question. Scholars who find a historical kernel in Joshua place the conquest at the end of the Late Bronze Age, but the excavations at et-Tell in the 1960s, like those at Jericho, “showed an absence of fortified occupation levels” for that period. The responses differ. Some take the evidence to mean the account “is either fabricated or greatly exaggerated.” Others defend it: one scholar argues that Jericho and Ai were “fortresses, not cities with large populations” (a reading the study finds “strained” in places), and another that the usual identification is wrong and Ai lay at Khirbet el-Maqatir, where, by his account, the evidence would fit. Weighed together, archaeology “is still insufficient to prove or disprove” the account, “but there are various ways in which the evidence could fit with aspects of the biblical account.” Jericho's side of the question is at [[Josh. 6:20]].
    sources: [ot-minute-josh-8, ot-minute-josh-7, calabro-herem]

  - ref: 29
    phrase: the king of Ai he hanged on a tree until eventide
    kind: scripture
    title: The king taken down at sunset
    body: |
      The king of Ai was put to death and his body displayed on a tree for the day, then taken down at sunset, as the law of Moses required ([[Deut. 21:22–23]], where the law is explained). Joshua 8 “records the first execution by hanging associated with ancient Israel,” and it keeps the law closely: the body is on the tree “for only the day,” and buried under a cairn, so “there is no further corpse defilement.”

      The Nephites hanged the Gadianton leader Zemnarihah on a tree and then felled it ([[3 Ne. 4:28]]), an execution that recalls the king of Ai's; “perhaps, the latter’s execution was deliberately meant to mimic the former’s.”
    sources: [belnap-fell-tree, ot-minute-josh-8]

  - ref: 30
    phrase: Then Joshua built an altar unto the LORD God of Israel in mount Ebal
    kind: history
    title: Why an altar on Ebal now
    body: |
      Joshua builds the altar Moses commanded as soon as Ai has fallen, before the rest of the land is taken. Moses had charged Israel to do it once they crossed the Jordan ([[Deut. 27:2–8]]; the plastered stones are explained at [[Deut. 27:2]], the uncut altar at [[Ex. 20:25]]), and verse 31 paraphrases his words. Ebal is about thirty miles north of Ai, in country Israel had not yet taken. One older reading answers the question of why Joshua would not wait for safer days: “obedience to the command of God was not a matter of such indifference to the servant of the Lord,” and there was “no valid reason after the capture of Ai for postponing any longer.”

      The altar also stands where the war accounts of the region end, with the founding of a sanctuary (the pattern is in the thread above). One reading goes further: since Ebal lies “approximately equidistant from Hazor and Debir,” the northernmost and southernmost cities of the conquest, “the altar on Mount Ebal may have been set up as a cult installation for all the cities.” The text itself says only that it was done “as Moses the servant of the LORD commanded.”
    sources: [lds-scriptures, keil-joshua, ot-minute-josh-8, calabro-herem]

  - ref: 33
    phrase: as well the stranger, as he that was born among them
    kind: scripture
    title: The stranger, the women and the little ones
    body: |
      The covenant was read to everyone in the camp, the foreigners living among Israel included. The chapter says it twice: the stranger stood with the native-born on the slopes (verse 33), and Joshua read the law “before all the congregation of Israel, with the women, and the little ones, and the strangers” (verse 35). One older reading takes “the stranger as well as the native” to mean “without any exception,” and “all Israel” to mean not “the congregation in its representatives, or even the men of the nation,” but all of them.

      That is what Moses had commanded for the reading of the law: “Gather the people together, men, and women, and children, and thy stranger that is within thy gates, that they may hear, and that they may learn” ([[Deut. 31:12]]; see the note at [[Deut. 31:10]]), a link one older commentary draws at this verse.
    sources: [keil-joshua, cambridge-joshua, lds-scriptures]

christ: |
  The LORD who gives Ai into Joshua's hand is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]). Once the sin at Jericho was put away and He “turned from the fierceness of his anger” ([[Josh. 7:26]]), He did not begin again with Israel; He spoke the words He had spoken at the start, “Fear not, neither be thou dismayed,” and the people who had broken the covenant stood before His altar and heard it read again. Such renewals typically come “following periods of apostasy, or at times of crisis or transition.”

  The restored covenant has “its periodic renewal through the sacrament,” whose prayers are given in [[D&C 20:77–79]]. For a disciple the pattern of Joshua 7 and 8 holds: once sin is put away, the Lord's first word is not a new and harder charge but the old promise spoken again, and the covenant is renewed rather than begun over.

explore: |
  - [[Josh. 7]]: the defeat and its cause, which chapter 8 reverses.
  - [[Deut. 27:1–26]] and [[Josh. 24:1–28]]: the ceremony at Ebal as Moses commanded it, and Joshua's last covenant at Shechem.
  - [[Ex. 17:8–13]]: Moses' raised hand against Amalek, beside Joshua's spear.

sources: [lds-scriptures, ot-minute-josh-8, ot-minute-josh-7, brandt-conquest, keil-joshua, seely-covenant-renewal, calabro-herem, cambridge-joshua, parry-symbolic-action, belnap-fell-tree]
