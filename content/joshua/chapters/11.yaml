chapter: 11
title: Hazor Beforetime Was the Head
tagline: The kings of the north gather at the waters of Merom, the LORD tells Joshua not to fear them, Hazor is burned, and the account of the conquest closes with the whole land taken and at rest.
when: 'After the southern campaign, in the north of Canaan, at the waters of Merom and at Hazor'

setting: |
  Chapter 10 ended with the south of Canaan in Israel’s hands; chapter 11 turns north. Israel’s success in the south “served as a warning to the city kings of the north,” who allied under the king of Hazor and met Israel “in the heart of their own territory at the waters of Merom.” The northern campaign (verses 1–15) mirrors chapter 10 in its broad shape: a coalition gathers, the LORD promises victory, Israel strikes, the cities fall.

  Verses 16–23 sum up all Joshua’s wars, south and north, and the summary “goes to pains to map out the specific range of the Israelites’ victories.” This summary ends the first part of the book, the conquest of Canaan (chapters 1–12); chapter 12 lists the kings defeated, and chapter 13 turns to the allotment of the land among the tribes. Chapter 13 also opens with the other side of the picture, “there remaineth yet very much land to be possessed” ([[Josh. 13:1]]), and the two are set side by side there.

thread: |
  The chapter is told as obedience. The LORD speaks once, “Be not afraid because of them” (verse 6), with a promise and a command, and Joshua does “as the LORD bade him” (verse 9). Then the narrator repeats the point until it cannot be missed: the cities are destroyed “as Moses the servant of the LORD commanded” (verse 12); “As the LORD commanded Moses his servant, so did Moses command Joshua, and so did Joshua; he left nothing undone” (verse 15); and the whole land is taken “according to all that the LORD said unto Moses” (verse 23).

  The battles themselves are told quickly. The victory is “decisive and total,” and the cities fall under the same herem as in the south; the Church’s reading of it is given at [[Josh. 6:21]]. Throughout Joshua the herem is shown as the way Jehovah’s armies “cooperate with him as he fights for Israel,” and the chapter keeps the LORD at the center: He delivers the enemy (verse 8), and in the King James wording of verse 20 it was “of the LORD” that the Canaanites’ hearts were hardened. The chapter ends at the goal the book has pointed to since [[Josh. 1:6]]: the land taken, given “for an inheritance,” and at rest from war (verse 23).

sections:
  - range: 1-5
    heading: The kings of the north
    plain: |
      When Jabin king of Hazor heard what had happened, he sent to Jobab king of Madon, to the kings of Shimron and Achshaph, to the kings in the northern hill country, in the valley south of the Sea of Chinnereth, in the lowland, and in the heights of Dor on the west; to the Canaanites east and west, to the Amorites, Hittites, Perizzites and Jebusites in the hills, and to the Hivites below Mount Hermon in the land of Mizpeh. They came out with all their armies, a horde as many as the sand on the seashore, with a great number of horses and chariots. All these kings joined forces and camped together at the waters of Merom to fight Israel.
  - range: 6-9
    heading: The waters of Merom
    plain: |
      The LORD said to Joshua, “Do not be afraid of them. By this time tomorrow I will hand all of them over to Israel, slain. You are to hamstring their horses and burn their chariots.” So Joshua and all his fighting men came on them suddenly at the waters of Merom and attacked. The LORD gave them into Israel’s hand. Israel struck them down and chased them as far as Great Sidon, Misrephoth-maim, and the valley of Mizpeh to the east, until none was left. Joshua did to them as the LORD had told him: he hamstrung their horses and burned their chariots.
  - range: 10-15
    heading: Hazor burned
    plain: |
      Then Joshua turned back and took Hazor and killed its king, for Hazor had once been the head of all those kingdoms. They put everyone in it to the sword, devoting them to destruction, and no one who breathed was left; and Joshua burned Hazor. Joshua took all the cities of those kings and their kings, and put them to the sword and destroyed them, as Moses the servant of the LORD had commanded. But Israel did not burn the cities still standing on their mounds, except Hazor; that one Joshua burned. The Israelites kept the plunder and the livestock of these cities for themselves, but the people they put to the sword until they had destroyed them all. As the LORD had commanded Moses, so Moses commanded Joshua, and so Joshua did; he left nothing undone of all the LORD had commanded Moses.
  - range: 16-23
    heading: The whole land
    plain: |
      So Joshua took the whole land: the hill country, all the Negev, all the land of Goshen, the lowland, the Arabah, and the hill country of Israel with its lowland, from Mount Halak that rises toward Seir as far as Baal-gad in the valley of Lebanon below Mount Hermon. He captured all their kings and put them to death. Joshua fought against all these kings for a long time. Not one city made peace with Israel except the Hivites of Gibeon; all the others were taken in battle. For it was the LORD’s doing to harden their hearts to meet Israel in battle, so that they would be destroyed without mercy, as the LORD had commanded Moses. At that time Joshua also wiped out the Anakims from the hill country, from Hebron, Debir and Anab, and from all the hills of Judah and of Israel, and destroyed them with their cities. No Anakims were left in Israel’s land; only in Gaza, Gath and Ashdod did some remain. So Joshua took the whole land, just as the LORD had told Moses, and gave it to Israel as an inheritance, divided by tribes. And the land had rest from war.

notes:
  - ref: 1
    phrase: Jabin king of Hazor
    kind: history
    title: Jabin, king of Hazor
    body: |
      Jabin leads the north because his city did: “Hazor beforetime was the head of all those kingdoms” (verse 10). The battle he gathered at Merom “did not secure all of the land for Israel, but it did provide a basis for the settlement of the people.”

      The name returns in Judges, where “Jabin king of Canaan, that reigned in Hazor” oppresses Israel and his captain Sisera falls to Deborah, Barak and Jael ([[Judg. 4:2]]; Psalm 83:9 remembers him). Whether he is the same king as the Jabin of Joshua 11 is unclear; Joshua says Hazor was burned and its king killed (verses 10–11), and Judges finds a king reigning there again.

      Hazor is also a place where the digging speaks to the account. Scholars who think the conquest has a historical kernel generally place it at the end of the Late Bronze Age, and “Evidence from Hazor … points to a violent destruction around this time and can thus be interpreted as consistent with the biblical account.” For the conquest as a whole, the same study concludes that the evidence is “still insufficient to prove or disprove” the account, “but there are various ways in which the evidence could fit with aspects of the biblical account.” What was found at Jericho and Ai is taken up at [[Josh. 6:20]] and [[Josh. 8:28]].
    sources: [lds-scriptures, ot-minute-josh-11, brandt-conquest, calabro-herem]

  - ref: 6
    phrase: thou shalt hough their horses, and burn their chariots with fire
    kind: history
    title: Why the horses were hamstrung
    body: |
      Israel was to disable the horses and burn the chariots rather than keep them, and though the verse gives no reason, it seems Israel was to rely on the LORD, not on weapons it had won. To hough a horse was to cut its leg tendons, “thus rendering the horse useless.” The enemy came “with horses and chariots very many” (verse 4), while Israel had none of its own: its men were “foot soldiers rather than charioteers.” The fear “seems to have been” that, with horses and chariots in its wars, “Israel would turn from faith in God and trust in the arm of flesh.” David later houghed the chariot horses he took, keeping back enough for a hundred chariots ([[2 Sam. 8:4]]).

      One older reading takes the command the same way, as meant “to lead Israel not to place its confidence in horses and chariots,” pointing to the law of the king, who is not to “multiply horses to himself” ([[Deut. 17:16]]), and to the psalm, “Some trust in chariots, and some in horses” ([[Ps. 20:7]]); it adds that the command also kept Israel from carrying its wars beyond Canaan.
    sources: [ot-manual-josh, cambridge-joshua, lds-scriptures]

  - ref: 13
    phrase: the cities that stood still in their strength
    kind: words
    title: Cities left standing on their mounds
    body: |
      The Hebrew says the cities stood on their mound (*tillam*), not “in their strength”: Israel left the towns of the north standing on their sites and burned only Hazor. The root word, *tel*, is a “mound or hill on which city stood,” and the King James “in their strength” hides it. The same word gives Jeremiah’s promise that the city “shall be builded upon her own heap” ([[Jer. 30:18]]).

      So the herem did not take the same form everywhere. Only Jericho seems to have received it in full, with the city burned, its animals killed and its rebuilding forbidden; elsewhere in Joshua “only Ai and Hazor are burned,” and “in every case other than Jericho, the livestock and spoils are kept,” as here (verse 14). The details may have been set case by case, by the LORD’s direction, as at Ai (8:2). What “neither left they any to breathe” means is taken up at [[Deut. 20:16]].
    sources: [oshb-wlc, bdb, calabro-herem, lds-scriptures]

  - ref: 18
    phrase: Joshua made war a long time with all those kings
    kind: history
    title: How long the war lasted
    body: |
      Verse 18 tells the reader that the quick battle accounts of chapters 10 and 11 cover wars that lasted years. “The record preserves only summary accounts of the major campaigns,” and the conquest “extended over many years and was never fully completed on the terms the Lord had originally specified.”

      The book itself gives one measure. Caleb was forty when Moses sent him from Kadesh-barnea and eighty-five when the land was divided, “these forty and five years” later ([[Josh. 14:7]], [[Josh. 14:10]]). One older reading reckons from these verses that Joshua’s wars lasted “as much as seven years.” However long it was, the summary of verses 16–23 gathers a long war into a few lines.
    sources: [brandt-conquest, lds-scriptures, keil-joshua]

  - ref: 20
    phrase: For it was of the LORD to harden their hearts
    kind: scripture
    title: Whose hearts were hardened
    body: |
      The Joseph Smith Translation makes the Canaanites the ones who hardened their hearts. Its manuscript passes over the first ten chapters (“All correct up to the XI Chapter”) and changes this one verse: “For it was of the Lord to distroy them utterly, because they hardened there hearts, that they should come against Israel in battle.” It is the only change in the book; the manuscript calls the rest of Joshua “Correct.” The change is the same kind Joseph Smith made again and again in Exodus about Pharaoh (see the note at [[Ex. 4:21]]), and “shows that it was the people who had hardened their hearts and not the Lord.” Where the Exodus changes clarify a word, this one “corrected the historical record of the people’s condition.”

      The King James wording recalls Pharaoh: the verse is “a narrative nod to Moses and Pharaoh” that casts the Canaanites in the Egyptians’ role. Read with verse 19, it answers why every city fought. “There was not a city that made peace with the children of Israel, save the Hivites the inhabitants of Gibeon,” and on one reading verses 18–20 imply that the cities “had the possibility of making peace” and hardened their hearts instead; Gibeon and Rahab’s household asked for mercy and received it (see the note at [[Josh. 6:21]]). How Israel came to swear to Gibeon, and why the oath held, is at [[Josh. 9:14]] and [[Josh. 9:19]].
    sources: [jsp-ot2, nyman-jst-historical, ot-minute-josh-11, calabro-herem, lds-scriptures]

  - ref: 21
    phrase: cut off the Anakims from the mountains
    kind: history
    title: The Anakims cut off, and still remaining
    body: |
      The Anakims, the people whose size had frightened the spies ([[Num. 13:33]]), are driven from Hebron and the hill country, yet the next verse says some remained: “only in Gaza, in Gath, and in Ashdod, there remained.” Who the Anakims were is at [[Deut. 1:28]].

      Hebron itself had to be taken from them again. “The city of Arba the father of Anak” is later given to Caleb, who drives out “the three sons of Anak” himself ([[Josh. 15:13–14]]). The Anakites are among the peoples “consigned to ḥērem later needing to be reconquered,” and on one reading this is one of several signs that the herem’s absolute language “did not involve total extermination in actual practice.” Caleb’s own claim to Hebron is at [[Josh. 14:6]].
    sources: [lds-scriptures, calabro-herem]

christ: |
  The LORD who told Joshua “Be not afraid because of them” (verse 6) is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]). In the Joseph Smith Translation the hearts hardened in verse 20 are the Canaanites’ own, and those the account shows asking for mercy, Gibeon here and Rahab’s household at Jericho, obtained it (see the note at [[Josh. 6:21]]).

  Read so, His judgment falls on hearts hardened by their own choosing, and His mercy reaches those who ask for it; that holds for a disciple now as it did for the cities of Canaan. Israel burned the chariots rather than keep them, it seems lest it “trust in the arm of flesh”; so a disciple’s safety rests in the Lord, not in the strength he can gather for himself (see the note at verse 6).

explore: |
  - [[Judg. 4]]: another Jabin reigning in Hazor, and Deborah, Barak and Jael against his captain Sisera.
  - [[Josh. 13:1–6]]: “very much land” still to be possessed, set beside “Joshua took the whole land” (verse 23).
  - [[Ex. 4:21]]: the Joseph Smith Translation on Pharaoh’s heart, the change that verse 20 repeats.

