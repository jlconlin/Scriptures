chapter: 17
title: Thou Shalt Not Have One Lot Only
tagline: Manasseh receives its lot west of the Jordan, the daughters of Zelophehad receive theirs, and the house of Joseph asks for more land than it has the courage to take.
when: 'While the land is divided by lot, before Eleazar the priest and Joshua'

setting: |
  Joshua 17 is the second half of the lot of the house of Joseph. Chapter 16 opened it, “the lot of the children of Joseph” ([[Josh. 16:1]]), and told how “the children of Joseph, Manasseh and Ephraim, took their inheritance” ([[Josh. 16:4]]). Its account of Ephraim's land comes first, and Manasseh's follows here.

  Manasseh was already half settled. Under Moses, “the children of Machir the son of Manasseh went to Gilead, and took it” ([[Num. 32:39]]), so this chapter gives the rest of the tribe its share west of the river. The five daughters of Zelophehad, whose case Moses had taken to the LORD ([[Num. 27:1–11]]), now receive the land promised them. Then come the borders, the Canaanite cities Manasseh could not take, and the complaint of Ephraim and Manasseh together that one lot was too small.

  Why the land was divided by lot, and by Eleazar and Joshua together, is explained at [[Num. 26:55]] and [[Num. 34:17]]; why Joseph's sons became two tribes, at [[Gen. 48:5]]. The guide [The Land](/old-testament/guides/the-land/#inheritance) has the tribes and their territories.

thread: |
  The chapter is about how an inheritance is received. Some of it already belongs to those who receive it: Machir has Gilead and Bashan because he won them (verse 1), and the daughters of Zelophehad receive theirs simply by asking for what “the LORD commanded Moses” (verse 4). Some of it has to be taken: Manasseh's cities in the plain stay Canaanite, because the tribe “could not drive out the inhabitants” (verse 12), and later, grown strong, it puts them to forced labor instead of driving them out (verse 13).

  The last scene sets the two side by side: the house of Joseph asks for more land because the LORD has blessed it, and Joshua tells them to clear the forest and drive out the Canaanites of the plain (verses 14–18). The blessing is real, and so is the work it asks for.

sections:
  - range: 1-6
    heading: Manasseh's families and Zelophehad's daughters
    plain: |
      The tribe of Manasseh also received a lot, since Manasseh was Joseph's firstborn. Machir, Manasseh's firstborn and the father of Gilead, had already received Gilead and Bashan because he was a warrior. Now the rest of Manasseh's descendants received a lot by their families: the clans of Abiezer, Helek, Asriel, Shechem, Hepher and Shemida, the male descendants of Manasseh son of Joseph. But Zelophehad, of the line of Hepher, Gilead, Machir and Manasseh, had no sons, only daughters: Mahlah, Noah, Hoglah, Milcah and Tirzah. They came before Eleazar the priest, Joshua son of Nun and the leaders and said, “The LORD commanded Moses to give us an inheritance among our brothers.” So, as the LORD had commanded, Joshua gave them an inheritance among their father's brothers. Manasseh received ten shares west of the Jordan besides Gilead and Bashan on the east, because Manasseh's daughters received an inheritance along with its sons; the rest of Manasseh's descendants had the land of Gilead.
  - range: 7-13
    heading: Manasseh's border and the cities not taken
    plain: |
      Manasseh's border ran from Asher to Michmethah, which faces Shechem, and then south to the people of En-tappuah. The land of Tappuah belonged to Manasseh, but the town of Tappuah on Manasseh's border belonged to Ephraim. The border went down to the brook Kanah; the towns south of the brook belonged to Ephraim, though they lay among Manasseh's towns, and Manasseh's border ran along the north side of the brook and ended at the sea. Ephraim lay to the south and Manasseh to the north. Manasseh's western border was the sea; its land touched Asher on the north and Issachar on the east. Within Issachar and Asher, Manasseh also had Beth-shean, Ibleam, Dor, En-dor, Taanach and Megiddo, each with its towns, three countries in all. But the people of Manasseh could not drive out the inhabitants of these cities; the Canaanites kept living in that land. When the Israelites grew strong, they made the Canaanites do forced labor, but they did not drive them out.
  - range: 14-18
    heading: The house of Joseph asks for more
    plain: |
      The descendants of Joseph said to Joshua, “Why have you given us only one lot and one share as an inheritance? We are a numerous people, because the LORD has blessed us so far.” Joshua answered, “If you are so numerous, go up into the forest and clear land for yourselves there, in the land of the Perizzites and of the giants, if the hill country of Ephraim is too small for you.” They said, “The hill country is not enough for us, and all the Canaanites who live in the valley have iron chariots, both those in Beth-shean and its towns and those in the valley of Jezreel.” Joshua said to the house of Joseph, Ephraim and Manasseh, “You are a numerous people with great strength; you will not have only one lot. The hill country will be yours. It is forest, and you will clear it, and its farthest reaches will be yours, for you will drive out the Canaanites, even though they have iron chariots and are strong.”

notes:
  - ref: 4
    phrase: The LORD commanded Moses to give us an inheritance among our brethren
    kind: scripture
    title: The daughters’ promise kept
    body: |
      The daughters of Zelophehad receive here what the LORD had promised them through Moses. Because their father had died with no son, they had asked for “a possession among the brethren of our father” ([[Num. 27:4]]), and the LORD had answered that they “speak right” ([[Num. 27:7]]); the case is told at [[Num. 27:5]].

      They had also kept the condition added later, that such heiresses marry within their tribe so that the land would not pass to another: they “were married into the families of the sons of Manasseh the son of Joseph, and their inheritance remained in the tribe of the family of their father” ([[Num. 36:12]]). What the law provided for women more generally is in the guide [Women and Marriage](/old-testament/guides/women-and-marriage/#the-law).
    sources: [lds-scriptures]

  - ref: 5
    phrase: there fell ten portions to Manasseh
    kind: history
    title: Why ten portions
    body: |
      The ten portions are the shares of Manasseh's families west of the Jordan, with the daughters of Zelophehad counted among them. Verse 2 names six clans. On one older reading the arithmetic is simple: Hepher's share had passed to Zelophehad, who had only daughters; the five male families “received five shares,” and Hepher's share went instead to Zelophehad's five daughters, each of whom “now received her special share of the land.”

      Verse 6 gives the reason in a sentence: “Because the daughters of Manasseh had an inheritance among his sons.”
    sources: [cambridge-joshua, lds-scriptures]

  - ref: 13
    phrase: they put the Canaanites to tribute; but did not utterly drive them out
    kind: words
    title: Forced labor in place of driving out
    body: |
      “Tribute” here is not a payment of money but forced labor, as with Ephraim at Gezer (see the note on [[Josh. 16:10]]). When Israel “were waxen strong,” they made the Canaanites workers instead of driving them out.

      That was not what they had been told to do. The commanded goal throughout the five books of Moses and Joshua “was to ‘drive out’ the wicked Canaanites,” and this chapter's verses 12 and 18 are among those that say so. The Canaanite cities left “as tribute cities” were permitted “in further contradiction of the Lord’s commandments,” and the failure of the house of Joseph to drive them out returns in Judges (see [[Judg. 1:27–29]]). How the book's picture of a land fully taken fits with this one is taken up at [[Josh. 13:1]].
    sources: [calabro-herem, brandt-conquest, lds-scriptures]

  - ref: 14
    phrase: Why hast thou given me but one lot and one portion to inherit
    kind: history
    title: Joseph asks Joshua for more
    body: |
      The house of Joseph, Ephraim and Manasseh together, complains that its lot is too small for a people the LORD has blessed. The Church's footnote sets their words beside Jacob's blessing of Joseph's sons, that Manasseh too “shall become a people” and Ephraim's seed “a multitude of nations” ([[Gen. 48:19]]).

      Joshua answers with their own words. If they are a great people, they can clear the forest and take it (verse 15). When they answer that the hills are not enough and the plain has chariots, he says it again: “Thou art a great people, and hast great power: thou shalt not have one lot only” (verse 17). The land is theirs, but they must take it.

      This scene shows that “the conquest continued slowly over time, something also described in Judges 1.”
    sources: [lds-scriptures, sc-knowhy-852]

  - ref: 18
    phrase: thou shalt drive out the Canaanites, though they have iron chariots, and though they be strong
    kind: scripture
    title: Iron chariots and a promise
    body: |
      Joshua's promise answers the very fear the house of Joseph names. The Church's footnote sets it beside the law of war: “When thou goest out to battle against thine enemies, and seest horses, and chariots, and a people more than thou, be not afraid of them: for the LORD thy God is with thee” ([[Deut. 20:1]]). The chariots are the reason the tribes give for staying out of the plain (verse 16); the LORD's presence is the reason the law gives for not being afraid of them.

      Judges shows the fear was not idle. Judah “drave out the inhabitants of the mountain; but could not drive out the inhabitants of the valley, because they had chariots of iron” ([[Judg. 1:19]]), and Manasseh's cities of the plain stayed Canaanite (see the note at verse 13).
    sources: [lds-scriptures]

christ: |
  The inheritance in this chapter comes from the LORD, Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]), and it reaches His people in two ways. The daughters of Zelophehad receive theirs by coming to His servants with His word, “The LORD commanded Moses to give us an inheritance” (verse 4). The house of Joseph receives the promise of more in land it must clear and win. The law gives the assurance that, against “horses, and chariots, and a people more than thou,” “the LORD thy God is with thee” ([[Deut. 20:1]]).

  In these two accounts a disciple can see two ways of receiving what the Lord promises: asked for on the strength of His word, as the daughters asked, and worked for in the confidence the law gave Israel, that He is present in the work.

explore: |
  - [[Num. 27:1–11]] and [[Num. 36:1–12]]: the daughters of Zelophehad, their request and its conditions.
  - [[Gen. 48]]: Jacob's blessing of Ephraim and Manasseh, which the Church's footnote sets beside verse 14.
  - [[Judg. 1:19–35]]: the cities each tribe did not drive out, Manasseh's among them.
  - [[Alma 10:3]]: Lehi, a descendant of Manasseh.

sources: [lds-scriptures, cambridge-joshua, bdb, calabro-herem, brandt-conquest, ot-minute-josh-16, sc-knowhy-852]
