chapter: 3
title: The Ark Goes Before the People
tagline: The priests carry the ark into a river in flood, the waters stand in a heap far upstream, and all Israel passes clean over Jordan on dry ground.
when: 'At the Jordan, opposite Jericho, in the first month'

setting: |
  Israel has been camped at Shittim ([[Num. 25:1]]; [[Josh. 2:1]]), “in the plains of Moab on this side Jordan by Jericho” ([[Num. 22:1]]). The spies have returned from Rahab's house with the report that “all the inhabitants of the country do faint because of us” ([[Josh. 2:24]]). Chapter 3 moves the camp to the river's edge and takes the people across. The next chapter gives the date: they came up out of Jordan “on the tenth day of the first month” ([[Josh. 4:19]]), when the river was in flood (verse 15).

  The crossing can be read as a turning point, where Israel “crossed over from its old identity as a group of wandering tribes in the wilderness to a new identity” in the land of promise, and the river as “the point of no return.” The account runs on into chapter 4, where the twelve men chosen in verse 12 carry stones up from the riverbed (see [[Josh. 4:6]]).

  The Lord's word to Joshua in verse 7, “as I was with Moses, so I will be with thee,” repeats the promise of [[Josh. 1:5]]. The crossing on dry ground, “as they had crossed the Red Sea,” is one way the Lord kept it. Later scripture remembers the two waters together: “The sea saw it, and fled: Jordan was driven back” ([[Ps. 114:3]]); “they went through the flood on foot” ([[Ps. 66:6]]).

thread: |
  Joshua 3 is about **what goes before the people**. Everything waits on the ark of the covenant. The people move when they see it (verse 3), keep two thousand cubits behind it (verse 4), and cross only after the priests carrying it have stepped into the flooded river (verses 13–15).

  Joshua's words in the middle of the chapter say what the ark means. “The ark of the covenant of the Lord of all the earth passeth over before you into Jordan” (verse 11), and by what happens there Israel will “know that the living God is among you” (verse 10). The crossing is offered as a pledge that the Lord will drive out the nations on the far bank.

  Then it happens as he said. The waters coming down stand in a heap far upstream, the waters going down to the Salt Sea run out, and the priests stand on dry ground in the middle of the riverbed until the whole nation is “passed clean over Jordan” (verses 16–17). Two promises are kept at the river: the Lord begins to “magnify” Joshua as He had Moses (verse 7), and He shows the people a sign of what He will do across it (verse 10). The chapter ends with the people over and the priests still standing in the river; chapter 4 brings them up ([[Josh. 4:18]]).

sections:
  - range: 1-6
    heading: Following the ark
    plain: |
      Joshua got up early, and he and all Israel left Shittim and came to the Jordan, where they camped before crossing. After three days the officers went through the camp and gave the people their orders: “When you see the ark of the covenant of the LORD your God, carried by the Levitical priests, leave your place and follow it. But keep a distance of about two thousand cubits between you and it; do not come near it. Then you will know which way to go, because you have never been this way before.” Joshua told the people, “Make yourselves holy, because tomorrow the LORD will do wonders among you.” And he told the priests, “Take up the ark of the covenant and cross ahead of the people.” So they took it up and went ahead of them.
  - range: 7-13
    heading: '“Hereby ye shall know”'
    plain: |
      The LORD said to Joshua, “Today I will begin to magnify you in the sight of all Israel, so they will know that I am with you as I was with Moses. Tell the priests who carry the ark: when you reach the edge of the Jordan's water, stand still in the river.” Joshua said to the Israelites, “Come here and listen to the words of the LORD your God. This is how you will know that the living God is among you, and that He will surely drive out the Canaanites, Hittites, Hivites, Perizzites, Girgashites, Amorites and Jebusites ahead of you: the ark of the covenant of the Lord of all the earth is going ahead of you into the Jordan. Now choose twelve men, one from each tribe. As soon as the priests carrying the ark of the LORD, the Lord of all the earth, set their feet in the Jordan, its water flowing down from upstream will be cut off and will stand in a heap.”
  - range: 14-17
    heading: Clean over Jordan
    plain: |
      So the people left their tents to cross the Jordan, with the priests carrying the ark ahead of them. The Jordan overflows all its banks the whole time of harvest. Yet as soon as the priests carrying the ark came to the Jordan and dipped their feet in the edge of the water, the water flowing down from upstream stopped and piled up in a heap a great way off, at the town of Adam, which is beside Zaretan. The water flowing down to the Sea of the Arabah, the Salt Sea, was completely cut off, and the people crossed opposite Jericho. The priests carrying the ark of the covenant of the LORD stood firm on dry ground in the middle of the Jordan, while all Israel crossed on dry ground, until the whole nation had finished crossing.

notes:
  - ref: 4
    phrase: 'about two thousand cubits by measure: come not near unto it'
    kind: history
    title: Two thousand cubits behind the ark
    body: |
      The people were kept about three thousand feet behind the ark so that they could see it lead. Two thousand cubits is “3000 feet,” well over half a mile, and the verse gives its own reason: “that ye may know the way by which ye must go: for ye have not passed this way heretofore.”

      One older reading adds reverence to that reason. The distance was kept “partly for the sake of reverence, partly that it might be observed and marked as it led the way,” and “in the wilderness the Pillar of Cloud had led the way, now the Ark of the Covenant takes its place.”
    sources: [cambridge-joshua]
  - ref: 10
    phrase: Hereby ye shall know that the living God is among you, and that he will without fail drive out from before you
    kind: history
    title: A sign of what lay across the river
    body: |
      Joshua tells the people beforehand what the crossing will prove: that the living God is among them, and that He will drive out the nations on the far bank. The seven nations are the list Moses gave in [[Deut. 7:1]], and what Joshua promises is that the Lord will “drive out” them.

      On one Latter-day Saint reading of the conquest, driving out, not destruction, was “the goal, expressed repeatedly throughout the Pentateuch and Joshua,” with this verse among the places that say so, and the “utterly destroy” of the war chapters was in practice “limited to specific fortified cities during battle.” The Hebrew term *ḥērem* is explained at [[Deut. 7:2]], and the Church's reading of the destruction of the Canaanites, with this one beside it, at [[Josh. 6:21]].
    sources: [calabro-herem]
  - ref: 15
    phrase: for Jordan overfloweth all his banks all the time of harvest
    kind: history
    title: A river in flood
    body: |
      The aside tells the reader that the Jordan was crossed at its most dangerous. “Although the Jordan is a comparatively narrow and shallow river,” Israel came to it “during its seasonal flooding after the winter rains,” and crossed “at the most perilous moment, demonstrating beyond question Jehovah's mastery of the elements (and thereby, implicitly, of the Canaanite gods believed to control various aspects of nature).”
    sources: [ot-minute-josh-3]
  - ref: 16
    phrase: stood and rose up upon an heap very far from the city Adam, that is beside Zaretan
    kind: words
    title: Upon an heap, at Adam
    body: |
      The “heap” ties the two crossings together: the same Hebrew word, *nēd*, is used of the Red Sea. It means a “heap of waters”: “of Red Sea Exodus 15:8 (song), Psalm 78:13; of Jordan Joshua 3:13,16; Psalm 33:7 (simile).” It is a “dam, obstruction,” the word of the Song of the Sea: “the floods stood upright as an heap” ([[Ex. 15:8]]). Joshua sets the two side by side himself: the Jordan was dried up “as the LORD your God did to the Red sea” ([[Josh. 4:23]]); see [[Ps. 114:3]].

      Where the waters stood is less certain. The Hebrew text has two readings here: the *ketiv*, the consonants as written, and the *qere*, the reading the scribes marked in the margin to be read aloud instead. The *ketiv* says the waters stood “very far,” “by the town of Adam”; the *qere* reads “from Adam,” and the King James follows the *qere*. One older reading keeps the *ketiv*: the heap stood “very far … from the place of crossing, ‘by the town of Adam.’” On that reading the river was stopped far upstream, at a town that, on the same reading, is “not mentioned anywhere else”; whether Hosea's “like men” refers to it is discussed at [[Hos. 6:7]].

      Below the heap, the waters going down to the Salt Sea “failed, and were cut off,” two Hebrew verbs that together mean “were wholly cut off.” The same Hebrew verb is behind “clean” in verse 17, where the people “were entirely passed over”: “clean” means completely.
    sources: [bdb, ot-minute-josh-3, keil-joshua]

christ: |
  The LORD who stopped the Jordan is Jehovah, “the premortal Jesus Christ” (see [[Ex. 3:14]]). The ark that went first into the water bore the mercy seat (“put the mercy seat above upon the ark,” [[Ex. 25:21]]), and Israel crossed by “following squarely behind the seat of atonement and trusting fully in the delivering power of Him whom it symbolized.” The man who led them bore the name later given to the Savior (see [[Num. 13:16]]); on one reading, “‘Jesus’ led Israel into the promised land.” Paul called Israel's passage through the sea a baptism ([[1 Cor. 10:1–2]]). At the sea and at the Jordan alike Israel “passed through the water into a newness of life,” and “one also enters a new land (or life) when he is born again through baptism.” On that reading Joshua's command to “sanctify yourselves” (verse 5) is the cleansing that comes before: “One must be sanctified, or cleansed from sin, in order to enter a new life with God.”

  The crossing still lies ahead for most disciples: “Most believers find themselves somewhere in between Sinai (having made sacred covenants with the Lord) and crossing the river Jordan.” For them the way over is the one Israel took: the Lord goes into the water first, and His people follow behind Him until all are passed clean over.

explore: |
  - **The two crossings.** The Red Sea in [[Ex. 14:21–22]] and [[Ex. 15:8]], beside verses 13–17; Joshua's own comparison in [[Josh. 4:21–24]].
  - **The river remembered.** [[Ps. 114:1–8]], [[Ps. 66:6]] and [[Ps. 74:15]] sing of the Jordan driven back.
  - **The Jordan parted again.** Elijah and Elisha cross on dry ground ([[2 Kgs. 2:8]]; [[2 Kgs. 2:14]]).
  - **The Jordan and baptism.** [[Matt. 3:13–17]]; [[1 Cor. 10:1–4]].

parallels:
  - ref: 1 Ne. 17:32
    note: Nephi recalls that after Israel “had crossed the river Jordan” the Lord made them mighty to drive out the people of the land.
  - ref: Ps. 114:3
    note: “Jordan was driven back,” set beside the sea that fled.
  - ref: Ps. 66:6
    note: The Jordan crossed on foot.

