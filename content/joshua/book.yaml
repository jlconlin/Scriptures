description: A phrase-by-phrase companion to the book of Joshua, grounded in the restored gospel of Jesus Christ.
divisionsBlurb: Twenty-four chapters in four parts. Israel crosses the Jordan and camps at Gilgal. Then come Jericho, the campaigns in the hill country and the list of conquered kings, the land divided among the tribes, and Joshua's farewell and the covenant at Shechem.
home:
  blurb: Israel enters the promised land under Moses' successor. The Jordan parts, the walls of Jericho fall, the land is divided among the tribes, and Joshua calls on Israel to choose whom they will serve.

intro: |
  Joshua begins where Deuteronomy ends: “Moses my servant is dead; now therefore arise, go over this Jordan” ([[Josh. 1:2]]). The man who had been Moses' minister since the wilderness now leads Israel across the river into the land promised to Abraham. The Lord tells him three times to “be strong and of a good courage” ([[Josh. 1:9]]).

  The book has two halves. The first tells how Israel crossed the Jordan, camped at Gilgal and took Jericho. Then come shorter accounts of the campaigns in the hill country, center, south and north, and a list of the kings defeated. The second half divides the land among the tribes and sets apart the cities of refuge and the cities of the Levites. It closes with two farewell speeches, and the people's covenant at Shechem: “choose you this day whom ye will serve … but as for me and my house, we will serve the LORD” ([[Josh. 24:15]]). The name Joshua is the Hebrew form of the name Jesus. This companion goes through all twenty-four chapters and tries to anticipate the questions a careful reader would ask, the hard ones included: why whole cities were destroyed, what became of Rahab, and what the long lists of boundaries are for.

  For the period, see [The Conquest, the Judges, and One Kingdom](/old-testament/guides/the-conquest-judges-and-kingdom/) and [A Timeline of the Old Testament](/old-testament/guides/israels-story/#judges); for the land and the tribes' inheritances, see [The Land](/old-testament/guides/the-land/#inheritance).

# The divisions follow the Bible Dictionary (“Joshua, book of”): 1–12 the conquest, 13–24 the land divided and
# Joshua's farewell. The conquest is split where Israel turns from the crossing and its ceremonies to war (the
# Old Testament Minute's 1:1–5:12 and 5:13–12:24, with chapter 5 kept whole), and 22–24 stand together as the
# Bible Dictionary and the Old Testament Minute have them (brief, “Divisions”).
# Keys must not repeat another book’s (the colors are global variables).
divisions:
  - key: joshcrossing
    range: [1, 5]
    name: Over This Jordan
    blurb: The Lord charges Joshua to be strong and of a good courage. Rahab hides the spies, the Jordan stops before the ark, and twelve stones are set up at Gilgal. Israel is circumcised and keeps the Passover, the manna ceases, and the captain of the Lord's host appears.
    color: '#3f6f8c'
    darkColor: '#9cc8e2'
  - key: joshconquest
    range: [6, 12]
    name: The LORD Fought for Israel
    blurb: The walls of Jericho fall, and Rahab's house is spared. Achan's theft brings defeat at Ai before the city is taken, and the law is written on stones at Mount Ebal. The Gibeonites trick Israel into a covenant, the sun stands still at Gibeon, and the kings of the south and the north are defeated. The part ends with a list of the kings Israel overcame.
    color: '#8a4b2f'
    darkColor: '#e6a98c'
  - key: joshland
    range: [13, 21]
    name: Divided for an Inheritance
    blurb: The land is divided by lot among the tribes. Reuben, Gad and half of Manasseh have theirs east of the Jordan, and Caleb asks for his mountain. Then come the portions of Judah, of the children of Joseph, and of the seven tribes at Shiloh. Six cities of refuge are set apart, and forty-eight cities for the Levites.
    color: '#5f7a3a'
    darkColor: '#b5d38f'
  - key: joshcovenant
    range: [22, 24]
    name: Choose You This Day
    blurb: The eastern tribes build an altar by the Jordan and nearly bring on a war. In his old age Joshua warns Israel to cleave to the Lord. At Shechem he retells their history from Abraham and has them choose whom they will serve, and they make a covenant. Joshua is buried, and Joseph's bones are laid at Shechem.
    color: '#6b4a7a'
    darkColor: '#cbb0dc'

