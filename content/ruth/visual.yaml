summary: >-
  Ruth is a short story of a family emptied by famine and filled again. Naomi goes out
  full and comes home empty, and Ruth gleans barley behind the reapers in the field of
  Boaz, who has handfuls let fall on purpose for her. He is the kinsman who redeems,
  and the book ends at the gate of Bethlehem with a restored household and a line that
  runs to David. The image rests on that provision: grain left in the open for the
  poor, the LORD's wings as the shelter she came to trust, and the town waiting beyond.
motifs:
  - "Handfuls of cut barley lying loose on the stubble (Ruth 2:16): the one large focal form, in the near middle ground at the left, a few pale golden ears dropped in a loose scatter across the field between standing rows of ripe barley and a few tied sheaves, with no gleaner and no reaper."
  - "A mother bird sheltering her young under spread wings (Ruth 2:12): small, at the field's edge in the right foreground, a plain brown field bird with wings half open over three chicks in the grass."
  - "The gate of Bethlehem (Ruth 4:1): far off on a low ridge in the right background, a small town of pale flat-roofed clay houses with one open arched gate, lit by the first gold light and with no figures at it."
composition: >-
  A wide landscape of a barley field in early morning, seen from a low viewpoint at the
  edge of the stubble. The loose handfuls of barley lie in the foreground at left as the
  focal point, the standing barley and sheaves run back across the middle ground, and
  the bird with her chicks sits small at the lower right. A low ridge in the distance
  carries the small town and its gate, under a warm clear sky with the sun low on the
  right, so the grain and the roofs glow gold and the shadows fall to the left. Calm
  and spacious, with generous empty sky. No people, no tools, no animals but the
  bird.
alt: A field of ripe barley in early morning light, with loose golden ears scattered across the cut stubble in the foreground and tied sheaves beyond. A brown bird with half-open wings sits over three chicks at the field's edge, and a small town of pale clay houses with an open gate stands on a distant ridge.
status: proposed
