summary: >-
  Ruth is a short story of a family emptied by famine and filled again. Naomi goes out
  full and comes home empty, and Ruth gleans barley behind the reapers in the field of
  Boaz, who has handfuls let fall on purpose for her. He is the kinsman who redeems,
  and the book ends at the gate of Bethlehem with a restored household and a line that
  runs to David. The image rests on that provision: grain left in the open for the
  poor, the LORD's wings as the shelter she came to trust, and the town waiting beyond.
motifs:
  - "Primary: loose ears of cut barley lying across the stubble in the left foreground, beside the standing barley (Ruth 2:16)."
  - "Supporting: two tied sheaves standing in the cut field (Ruth 2:15)."
  - "Supporting: a brown field bird with half-spread wings over three chicks in the grass at the lower right (Ruth 2:12)."
  - "Supporting: a walled town with an open arched gate on the ridge at the right, beside the low sun (Ruth 4:1)."
composition: >-
  A wide landscape of a barley field in early morning, seen from a low viewpoint at the
  edge of the stubble. Tall ripe barley stands at the left, and loose ears lie across the
  stubble in the foreground; two sheaves stand in the cut field beyond. The bird and her
  chicks sit in the grass at the lower right by two stones. Rolling hills run back to a
  ridge at the right with a walled town and an open gate, the sun low beside it, so the
  grain glows gold and the shadows fall to the left. Clear sky, no people, no tools, no
  animals but the birds.
key:
  - '**The loose ears of barley on the stubble** are the handfuls Boaz had dropped for Ruth: “let fall also some of the handfuls of purpose for her, and leave them, that she may glean them” ([[Ruth 2:16]]).'
  - '**The two sheaves** are the bound grain among which Boaz let Ruth gather: “Let her glean even among the sheaves, and reproach her not” ([[Ruth 2:15]]).'
  - '**The bird with her chicks under her wings** shows the shelter in Boaz''s blessing on Ruth: “a full reward be given thee of the LORD God of Israel, under whose wings thou art come to trust” ([[Ruth 2:12]]).'
  - '**The town and its open gate** on the far ridge are Bethlehem, where the redemption is settled before the elders: “Then went Boaz up to the gate, and sat him down there” ([[Ruth 4:1]]).'
