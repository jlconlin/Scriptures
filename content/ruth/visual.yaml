alt: A field of ripe barley in early morning light, with loose golden ears scattered across the cut stubble in the foreground and two tied sheaves beyond. A brown bird with half-open wings shelters three chicks in the grass at the lower right, and a walled town with an open arched gate stands on a distant ridge beside the rising sun.
