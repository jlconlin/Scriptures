chapter: 4
claims:
  # ---- setting / thread ----
  - where: 'setting'
    claim: 'Naomi is sure Boaz will settle the matter at once'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'In Naomi’s mind there is no doubt that once Boaz has set his mind to doing this thing, it will be accomplished in short order.'
  - where: 'setting'
    claim: 'In chapter 4 Boaz moves to center stage and combines two customs usually discussed separately'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'In chapter 4 Boaz moves to center stage in the narrative as he examines the best way to redeem Ruth (and Naomi). What is unique in this chapter is that Boaz acts as gōʾēl with a combination of legal customs that are usually discussed separately'
  - where: 'setting'
    claim: 'The book appears intended to connect David with earlier times'
    key: bd-ruth
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ruth?lang=eng'
    quote: 'The book appears to be intended to connect the history of David with the earlier times'
  - where: 'thread'
    claim: 'The story traces an arc from emptiness to fullness, from 1:21 to 4:15'
    key: welch-costly-love
    url: 'https://mi.byu.edu/old-testament-reflections/the-beauty-and-risks-of-costly-love'
    quote: 'The story traces a hopeful arc from emptiness to fullness. Naomi’s lament that “the Lord hath brought me home again empty” (Ruth 1:21) has, by the end, become joy in the chosen grandchild she clasps to her breast'
  - where: 'thread'
    claim: 'Neither redeeming the land nor the levirate marriage was required of Boaz by law'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Technically, neither of these actions were required of Boaz by law.'
  - where: 'thread'
    claim: 'God is named acting in only two verses, 1:6 and 4:13, yet his ḥesed pervades the story'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'In the book of Ruth, God is specifically mentioned in only two verses (Ruth 1:6; 4:13), yet if the reader looks closely, his ḥesed pervades the story.'
  - where: 'thread'
    claim: 'The Lord kept his covenantal hesed through the hesed of others'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'These women aptly point out that the Lord had honored his covenantal hesed and had done so by the hesed of others, most especially Ruth.'

  # ---- notes ----
  - where: 'note 4:1 “The kinsman comes by”'
    claim: 'The meeting is not meant as coincidence; the Lord brought the right person to the right place'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'Our writer did not intend for us to think of this fortuitous meeting between Boaz and Naomi’s nearest relative as coincidence. Instead, as Boaz set about his task in the early hours, the Lord assisted him by bringing the right person to the right place'
  - where: 'note 4:1 “The kinsman comes by”'
    claim: 'The gate functioned as the town square; legal and business transactions there; witnesses available'
    key: ot-minute-ruth-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/ruth-4'
    quote: 'In biblical times, the gates of town functioned as the town square. Every public act of significance, including business and legal transaction, happened there. … This meant witnesses were readily available and business could be easily accomplished.'
  - where: 'note 4:1 “The kinsman comes by”'
    claim: 'The ten elders sit as witnesses and judges'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'There Boaz gathers ten elders of the city and asks them to sit as witnesses and judges.'

  - where: 'note 4:3 “What land Naomi had”'
    claim: 'Naomi still owned land but had no access to it; possible reasons; the author gives no details'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Apparently, Naomi still owned land in the region (Ruth 4:3), but she didn’t have access to it, perhaps because Elimelech had “sold” it before fleeing to Moab, or “left it in the hands of a relative to look after in his absence,” or the land had simply not been prepared and planted, although the author does not give any details.'
  - where: 'note 4:3 “What land Naomi had”'
    claim: 'Ancestral land was to remain in the family; a relative redeemed it, as Boaz did'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Under those circumstances the ancestral land was to remain within the family through inheritances. If a person’s economic situation necessitated its sale, then the law allowed for the land to be leased but mandated that it eventually be returned to the family either by a relative redeeming the land, as Boaz did in chapter 4'
  - where: 'note 4:3 “What land Naomi had”'
    claim: 'Without its harvest the women had to rely on the provisions for the poor'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Without access to any harvest from Elimelech’s (now Naomi’s) land, the two women needed to take advantage of other provisions in the Mosaic law designed to provide for the poor, the widows, and the strangers in need.'
  - where: 'note 4:3 “What land Naomi had”'
    claim: 'The sons inherited the land and died without heirs, so Naomi inherited it; hence 4:9'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'It appears that Naomi’s sons inherited their father’s land, but since they had both died without heirs, Naomi inherited it from them; thus Boaz says that he bought “all that was Elimelech’s, and all that was Chilion’s and Mahlon’s, of the hand of Naomi” (Ruth 4:9).'
  - where: 'note 4:3 “What land Naomi had”'
    claim: 'Two possibilities: Naomi needed funds and the goel buys to keep it in the family; or Elimelech had sold it and the goel buys it back'
    key: ot-minute-ruth-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/ruth-4'
    quote: 'First, Naomi needed funds from the land to survive, and it was part of the responsibility of the go‘el to purchase the property so that it would stay in the family and provide the widow money to live on. The second possibility is that Elimelech had sold the land before he left for Moab'

  - where: 'note 4:4 “Advertise: uncover thine ear”'
    claim: 'The Hebrew is “I will uncover thine ear”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ruth.xml'
    quote: 'אֶגְלֶ֧ה'
  - where: 'note 4:4 “Advertise: uncover thine ear”'
    claim: 'To uncover the ear of one is to reveal to him; used at 1 Sam. 9:15 and Ruth 4:4'
    key: bdb
    url: 'https://biblehub.com/hebrew/1540.htm'
    quote: 'גָּלָה אֹזֶן uncover the ear of one, i.e. reveal to him 1 Samuel 9:15'

  - where: 'note 4:5 “Land and widow together”'
    claim: 'Levirate marriage: a widow marrying her husband’s brother or sometimes a near heir; a major aspect of Ruth'
    key: bd-levirate-marriage
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levirate-marriage?lang=eng'
    quote: 'The custom of a widow marrying her deceased husband’s brother or sometimes a near heir. … it also forms a major aspect of the story of Ruth (Ruth 4:1–12).'
  - where: 'note 4:5 “Land and widow together”'
    claim: 'The nearer kinsman’s right came according to Deut. 25:5–10'
    key: bd-ruth
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ruth?lang=eng'
    quote: 'if a nearer kinsman, to whom the right belonged according to the law in Deut. 25:5–10, declined.'
  - where: 'note 4:5 “Land and widow together”'
    claim: 'Ruth uniquely joins the kinsman redeemer to the levirate law; Boaz redeems by buying the land and marrying Ruth'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'The book of Ruth uniquely associates the kinsman redeemer with the levirate law of marriage. … Boaz would do this not only by purchasing Elimelech’s land but also by following levirate customs to marry Ruth.'
  - where: 'note 4:5 “Land and widow together”'
    claim: 'Levirate duty could apply beyond brothers'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'Apparently, levirate duty could apply to relatives beyond immediate brothers.'
  - where: 'note 4:5 “Land and widow together”'
    claim: 'From Ruth we learn levirate marriage and redemption were connected'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'It is from the book of Ruth we learn that levirate marriage and the right of redemption were connected.'
  - where: 'note 4:5 “Land and widow together”'
    claim: 'The law invokes the levirate for brothers who dwell together; neither man qualified; Boaz generously interpreted his responsibilities'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'It appears that neither Boaz nor the “nearer gōʾēl” qualified as levirate candidates under these precise stipulations. … Once again Boaz has generously interpreted any legal responsibilities he might have had in these cases.'

  - where: 'note 4:6 “Why the nearer kinsman declined”'
    claim: 'Only after the kinsman agreed did Boaz tell him that care of Ruth came with the land; a son would take the inheritance from his family; his means would go to Ruth’s child'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'It is only after the kinsman has agreed to buy land that Boaz informs him that with the land comes the care of both Naomi and Ruth. … it added the care of a child he must sire who would eventually take Naomi’s land inheritance away from his family.'
  - where: 'note 4:6 “Why the nearer kinsman declined”'
    claim: 'Boaz was willing to sacrifice his estate'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'Boaz then claims his right to redemption, being willing to sacrifice his estate in order to support Ruth, Naomi, and their heritage.'
  - where: 'note 4:6 “Why the nearer kinsman declined”'
    claim: 'Scripture Helps gives the reason: he did not want the land inherited by Ruth’s sons instead of his own family'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'This concern suggests that he did not want the land he purchased to be inherited by Ruth’s future sons instead of members of his own family.'

  - where: 'note 4:7 “The shoe”'
    claim: 'Giving a sandal asserted that the giver offered property rights to the recipient'
    key: ot-minute-ruth-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/ruth-4'
    quote: 'Taking off a sandal and giving it to someone was a ritual that asserted the giver was offering their property rights to the recipient.'
  - where: 'note 4:7 “The shoe”'
    claim: 'A man renouncing property rights removed a sandal and gave it to the new holder; binding if witnessed by the elders'
    key: ot-manual-judges-13-21
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-13-21-ruth-1-4-the-reign-of-the-judges-part-2?lang=eng'
    quote: 'A man renouncing property rights removed a sandal and presented it to the new property holder, a gesture that everyone understood and considered binding if witnessed by the elders.'
  - where: 'note 4:7 “The shoe”'
    claim: 'The foot symbolized possession and territorial claims (Josh. 1:3); the shoe the perfect symbol of the right of possession'
    key: gaskill-shoe
    url: 'https://rsc.byu.edu/our-rites-worship/ceremony-shoe-ritual-gods-ancient-covenant-people'
    quote: 'the shoe served as the perfect symbol of the right of possession. [41] Anciently, the foot symbolized power or possession (see Psalm 8:6; Psalm 36:11; Joshua 10:24) as well as territorial claims (see Deuteronomy 1:36; 11:24; Joshua 1:3; 14:9).'
  - where: 'note 4:7 “The shoe”'
    claim: 'Wearing shoes denotes readiness (Ex. 12:11); removing them, refusal of a duty'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'When shoes are used symbolically in the Old Testament, wearing them denotes a readiness, a preparation to do what needs to be done (see Exodus 12:11; 1 Kings 2:5; and Isaiah 5:27).'
  - where: 'note 4:7 “The shoe”'
    claim: 'Differences from Deuteronomy: no spitting, the man removes his own shoe'
    key: gaskill-shoe
    url: 'https://rsc.byu.edu/our-rites-worship/ceremony-shoe-ritual-gods-ancient-covenant-people'
    quote: 'Second, in the story of Ruth and Boaz it is not the woman who removes the man’s shoe. Rather, the unnamed male kinsman-redeemer (gō’ēl) is depicted as removing his own shoe.'
  - where: 'note 4:7 “The shoe”'
    claim: 'The rite is likely the ceremony of the shoe rather than levirate'
    key: gaskill-shoe
    url: 'https://rsc.byu.edu/our-rites-worship/ceremony-shoe-ritual-gods-ancient-covenant-people'
    quote: 'Although the common assumption that the rite depicted in Ruth 4 is traditionally seen as an example of levirate marriage, it appears likely that it is instead a prime example of the ceremony of the shoe.'

  - where: 'note 4:10 “Ruth taken as wife before the elders”'
    claim: '“Bought” in 4:9 is qānâ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ruth.xml'
    quote: 'קָנִ֨יתִי֙'
  - where: 'note 4:10 “Ruth taken as wife before the elders”'
    claim: '“Purchased” in 4:10 is the same verb qānâ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ruth.xml'
    quote: 'קָנִ֧יתִי'
  - where: 'note 4:10 “Ruth taken as wife before the elders”'
    claim: 'Rights to the land and to Elimelech’s daughter-in-law were transferred together'
    key: gaskill-shoe
    url: 'https://rsc.byu.edu/our-rites-worship/ceremony-shoe-ritual-gods-ancient-covenant-people'
    quote: 'Here the removal of a shoe symbolizes the fact that rights to the land Elimelech once owned—and rights to his daughter-in-law (who might provide a legal heir)—are now being transferred.'
  - where: 'note 4:10 “Ruth taken as wife before the elders”'
    claim: 'The levirate purpose: the dead man’s name not put out of Israel (Deut. 25:6; Ruth 4:5, 10)'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'The levirate marriage ensured that the deceased man’s name “be not put out of Israel” (Deuteronomy 25:6; see Ruth 4:5, 10).'
  - where: 'note 4:10 “Ruth taken as wife before the elders”'
    claim: 'Until 4:10 the author keeps emphasizing Ruth’s Moabite identity'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Up until Ruth 4:10, the author repeatedly emphasizes Ruth’s Moabite identity (Ruth 1:4, 6, 22; 2:2, 6, 21; 4:5, 10).'
  - where: 'note 4:10 “Ruth taken as wife before the elders”'
    claim: 'Ruth married again and was fully accepted as an Israelite'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'Ruth eventually married again, was fully accepted as an Israelite, and was blessed with children.'

  - where: 'note 4:11 “The blessing at the gate”'
    claim: 'The blessing is the greatest blessing of marriage; “do worthily” means get power by begetting worthy children'
    key: keil-ruth
    url: 'https://biblehub.com/commentaries/kad/ruth/4.htm'
    quote: 'The blessing desired is the greatest blessing of marriage … חיל עשׂה does not mean "get property or wealth," as in Deuteronomy 8:17, but get power, as in Psalm 60:14 (cf. Proverbs 31:29), sc., by begetting and training worthy sons and daughters.'
  - where: 'note 4:11 “The blessing at the gate”'
    claim: 'Boaz’s ancestors descended from Perez'
    key: keil-ruth
    url: 'https://biblehub.com/commentaries/kad/ruth/4.htm'
    quote: 'It was from Perez that the ancestors of Boaz, enumerated in Ruth 4:18. and 1 Chronicles 2:5., were descended.'
  - where: 'note 4:11 “The blessing at the gate”'
    claim: 'The blessing is fulfilled in the genealogy at the close of the book'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'This blessing is fulfilled when the author (or a later redactor) added the genealogy from Boaz to King David at the close of the book (4:18–22).'
  - where: 'note 4:11 “The blessing at the gate”'
    claim: 'Text of 4:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/4?lang=eng'
    quote: 'And let thy house be like the house of Pharez, whom Tamar bare unto Judah'

  - where: 'note 4:13 “The LORD gave her conception”'
    claim: 'God is named acting in only two verses, 1:6 and 4:13'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'In the book of Ruth, God is specifically mentioned in only two verses (Ruth 1:6; 4:13)'
  - where: 'note 4:13 “The LORD gave her conception”'
    claim: 'After ten years of marriage Ruth and Orpah apparently had no children'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Ruth and Orpah because their husbands have died and (even after ten years of marriage) these two women had apparently not given birth to any children (Ruth 1:4).'
  - where: 'note 4:13 “The LORD gave her conception”'
    claim: 'The verb of 1:9 is the verb of 4:13; the only time it is used of conception; Naomi’s wish fulfilled'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'The verb that Naomi uses when she wishes that her daughters-in-law will be given rest is the same verb used when the Lord gives Ruth conception. This is the only time in the Hebrew Bible when that verb is used to describe conception.'
  - where: 'note 4:13 “The LORD gave her conception”'
    claim: 'Ruth has found rest in the house of her husband'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'Instead the author is highlighting that Naomi’s wish has been fulfilled. By the grace of God, Ruth has found rest in the house of her new husband.'
  - where: 'note 4:13 “The LORD gave her conception”'
    claim: '“Grant” in 1:9 is nātan (H5414)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ruth.xml'
    quote: 'יִתֵּ֤ן'
  - where: 'note 4:13 “The LORD gave her conception”'
    claim: '“Gave” in 4:13 is nātan (H5414)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ruth.xml'
    quote: 'וַ/יִּתֵּ֨ן'

  - where: 'note 4:14 “A redeemer for Naomi”'
    claim: 'The KJV “kinsman” for Boaz translates gōʾēl from chapter 3 on, 4:14 among the verses counted'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Throughout the story, the King James text frequently refers to Boaz as a “kinsman.” … beginning in chapter 3, the rest of the citations are translations of the word gōʾēl (Ruth 3:9, 12, 13; 4:14), which has the more nuanced meaning of a “redeemer.”'
  - where: 'note 4:14 “A redeemer for Naomi”'
    claim: 'The redeemer is the son; as Ruth’s son he was Naomi’s and would remove her childlessness and tend her old age'
    key: keil-ruth
    url: 'https://biblehub.com/commentaries/kad/ruth/4.htm'
    quote: 'This redeemer was not Boaz, but the son just born. … because as the son of Ruth he was also the son of Naomi (Ruth 4:17), and as such would take away the reproach of childlessness from her, would comfort her, and tend her in her old age'
  - where: 'note 4:14 “A redeemer for Naomi”'
    claim: '“Restorer of thy life”: shûb with nepeš'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ruth.xml'
    quote: 'לְ/מֵשִׁ֣יב'
  - where: 'note 4:14 “A redeemer for Naomi”'
    claim: 'The verb with nepeš as object means refresh, Ruth 4:15'
    key: bdb
    url: 'https://biblehub.com/hebrew/7725.htm'
    quote: 'b. accusative נֶפֶשׁ = refresh Lamentations 1:11,16,19; Psalm 19:8; Proverbs 25:13; Ruth 4:15.'
  - where: 'note 4:14 “A redeemer for Naomi”'
    claim: 'Refresher of the soul; seven denotes a large number of sons from God’s blessing (1 Sam. 2:5)'
    key: keil-ruth
    url: 'https://biblehub.com/commentaries/kad/ruth/4.htm'
    quote: '"And may the boy come to thee a refresher of the soul, and a nourisher of thine old age … Seven, as the number of the works of God, is used to denote a large number of sons of a mother whom God has richly blessed with children (vid., 1 Samuel 2:5).'

  - where: 'note 4:17 “A son born to Naomi”'
    claim: 'Naomi adopted the grandson'
    key: keil-ruth
    url: 'https://biblehub.com/commentaries/kad/ruth/4.htm'
    quote: 'Naomi therefore adopted this grandson as her own child; she took the boy into her bosom, and became his nurse.'
  - where: 'note 4:17 “A son born to Naomi”'
    claim: 'Obed means Servant'
    key: bd-obed
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/obed?lang=eng'
    quote: 'Servant. Son of Boaz and Ruth, and father of Jesse'
  - where: 'note 4:17 “A son born to Naomi”'
    claim: 'The name was given with reference to what he would be to his grandmother'
    key: keil-ruth
    url: 'https://biblehub.com/commentaries/kad/ruth/4.htm'
    quote: 'This name was given to the boy (the context suggests this) evidently with reference to what he was to become to his grandmother. Obed, therefore, does not mean "servant of Jehovah" (Targum), but "the serving one," as one who lived entirely for his grandmother'
  - where: 'note 4:17 “A son born to Naomi”'
    claim: 'Emptiness gives way to fulness at Obed’s birth; God’s ḥesed poured out on Naomi'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'parallels Naomi’s initial feelings of emptiness as she returns to Bethlehem with the fulness that she experiences when Ruth gives birth to Obed at the conclusion of the story and the women declare him to be “a son born to Naomi” (4:17). Thus, God’s ḥesed was indeed poured out upon her.'

  - where: 'note 4:18 “From Pharez to David”'
    claim: 'The book appears intended to connect David’s history with earlier times'
    key: bd-ruth
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ruth?lang=eng'
    quote: 'The book appears to be intended to connect the history of David with the earlier times'
  - where: 'note 4:18 “From Pharez to David”'
    claim: 'Obed is spoken of as Boaz’s son, not Mahlon’s, which one study takes as against levirate marriage'
    key: gaskill-shoe
    url: 'https://rsc.byu.edu/our-rites-worship/ceremony-shoe-ritual-gods-ancient-covenant-people'
    quote: 'Fifth, Obed—the son born to Boaz and Ruth—is spoken of as the son of Boaz rather than as the son of Ruth’s deceased husband, Mahlon (see Ruth 4:18–22; Septuagint Ruth 4:13). This would be contrary to levirate marriage, which is primarily for the purpose of raising seed up to a deceased brother.'
  - where: 'note 4:18 “From Pharez to David”'
    claim: 'The marriage makes Israelites and Moabites ancestors of David and of Jesus'
    key: strathearn-ruth
