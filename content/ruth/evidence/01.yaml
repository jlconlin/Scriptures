chapter: 1
claims:
  - where: 'setting'
    claim: 'The story is set in the days of the judges'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/1?lang=eng'
    quote: 'Now it came to pass in the days when the judges ruled, that there was a famine in the land.'
  - where: 'setting'
    claim: 'In the English Bible Ruth follows Judges; in the Hebrew Bible it is among the Writings'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'In the Septuagint, Latin, and English versions, the book of Ruth is found following the book of Judges. In the Hebrew version, however, the book is separated from Judges and found in the Writings section (the Ketuvim).'
  - where: 'setting'
    claim: 'The Hebrew of Ruth has features of both earlier and later Hebrew; an early version may have been redacted later'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'The book of Ruth contains elements from both Standard and Late Biblical Hebrew … However, the elements of Standard Biblical Hebrew may allow for the notion of an early version of the text that was later redacted into its present form.'
  - where: 'setting'
    claim: 'The author is unknown'
    key: ot-seminary-intro-ruth
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-ruth?lang=eng'
    quote: 'The author of the book of Ruth is unknown.'
  - where: 'setting'
    claim: 'It may have been written after David or Solomon, likely after the exile, and balances the view that Jews should separate from all non-Israelites: faithfulness more important than ethnicity'
    key: ot-seminary-intro-ruth
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-ruth?lang=eng'
    quote: 'the book of Ruth may have been written after David’s or Solomon’s time, likely following the Babylonian exile. … The book of Ruth seems to provide valuable balance … One of the main messages of the book of Ruth is that such faithfulness is more important than ethnicity.'
  - where: 'setting'
    claim: 'The book connects David with earlier times and contrasts with the disorders of Judges'
    key: bd-ruth
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ruth?lang=eng'
    quote: 'The book appears to be intended to connect the history of David with the earlier times, and also to form a contrast, in its peaceful and pastoral simplicity, to the disorders of which we read so continually in the Book of Judges.'
  - where: 'setting'
    claim: 'The writer and date are unknown, but the writer’s skill does not take away from the reality of the people'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'While we do not know who the author of Ruth is nor when he wrote the book, we can recognize in this writer an extraordinary talent. Realizing this does not take away from the potency of the message, nor from the reality of Ruth’s, Naomi’s, and Boaz’s lives.'
  - where: 'thread'
    claim: 'Bethlehem means house of bread'
    key: bd-bethlehem
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/bethlehem?lang=eng'
    quote: 'House of bread. (1) Bethlehem-Judah, also called Ephrath'
  - where: 'thread'
    claim: 'The rest of the story shows the empty Naomi filled again'
    key: ot-minute-ruth-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/ruth-1'
    quote: 'The rest of the story shows how the empty Naomi became full once more and that the Lord had not abandoned her'
  - where: 'thread'
    claim: 'God is named acting in only two verses, 1:6 and 4:13; his ḥesed comes through the actions of people'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'In the book of Ruth, God is specifically mentioned in only two verses (Ruth 1:6; 4:13), yet if the reader looks closely, his ḥesed pervades the story.'
  - where: 'thread'
    claim: 'God’s ḥesed comes through disciples who minister to one another; Ruth ministered to Naomi'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Ruth ministered to Naomi; Naomi ministered to Ruth; and Boaz ministered to both'
  - where: 'thread'
    claim: 'Naomi, unable to show ḥesed herself, asks the LORD to'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'Being aware that she was incapable of performing hesed for them, she asks the Lord to do so.'
  - where: 'thread'
    claim: 'Naomi asks the LORD for ḥesed on her daughters-in-law (1:8)'
    key: belnap-hesed
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/how-excellent-thy-lovingkindness'
    quote: 'The first reference is in chapter 1, verse 8, as Naomi gives the following blessing upon both of her daughters-in-law'
  - where: 'note 1:1 “Refugees from the famine”'
    claim: 'Famines were frequent and moved families; Elimelech’s family migrated as refugees like Abraham and Jacob to the pastures of Moab, which apparently escaped the famine'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Famines were a frequent reality in the biblical record. They often resulted in the migration of nomadic families and tribes seeking food for themselves and pasture for their flocks. The famine in Judea caused Elimelech and his family, like Abraham and Jacob before them, to migrate as refugees to the pastures of Moab, which had apparently escaped the famine.'
  - where: 'note 1:1 “Refugees from the famine”'
    claim: 'No evidence the author viewed the migration negatively; Moab helped the family for over a decade'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'There is no evidence that the author negatively viewed Elimelech’s migration to Moab with his family. Rather, it seems that the people of Moab helped this refugee family for over a decade (Ruth 1:4).'
  - where: 'note 1:1 “Refugees from the famine”'
    claim: 'Moab lay east of the Dead Sea'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'The land of Moab was east of the Dead Sea, in present-day Jordan.'
  - where: 'note 1:1 “Refugees from the famine”'
    claim: 'Abraham went down to Egypt because of famine'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/12?lang=eng'
    quote: 'And there was a famine in the land: and Abram went down into Egypt to sojourn there; for the famine was grievous in the land.'
  - where: 'note 1:4 “Moabite wives”'
    claim: 'The book stresses Ruth’s Moabite identity throughout'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Up until Ruth 4:10, the author repeatedly emphasizes Ruth’s Moabite identity (Ruth 1:4, 6, 22; 2:2, 6, 21; 4:5, 10).'
  - where: 'note 1:4 “Moabite wives”'
    claim: 'The book focuses on the Abrahamic blessings extended to the Moabites; Deuteronomy’s prohibition highlights the strained relationship'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'it focuses on the notion that blessings of the Abrahamic covenant could be extended to the Moabites, who had traditionally experienced strained relationships with the Israelites.'
  - where: 'note 1:4 “Moabite wives”'
    claim: 'A social reality not envisioned in Deuteronomy'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Thus the book of Ruth portrays “a social reality that is not envisioned in Deuteronomy.”'
  - where: 'note 1:4 “Moabite wives”'
    claim: 'After ten years of marriage the wives apparently had no children'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Ruth and Orpah because their husbands have died and (even after ten years of marriage) these two women had apparently not given birth to any children (Ruth 1:4).'
  - where: 'note 1:4 “Moabite wives”'
    claim: 'The law barred the Moabite from the congregation to the tenth generation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/23?lang=eng'
    quote: 'An Ammonite or Moabite shall not enter into the congregation of the LORD; even to their tenth generation shall they not enter into the congregation of the LORD for ever'
  - where: 'note 1:6 “The LORD visited his people”'
    claim: 'God is named acting in only two verses, 1:6 and 4:13'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'In the book of Ruth, God is specifically mentioned in only two verses (Ruth 1:6; 4:13)'
  - where: 'note 1:6 “The LORD visited his people”'
    claim: 'Bethlehem means house of bread'
    key: bd-bethlehem
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/bethlehem?lang=eng'
    quote: 'House of bread.'
  - where: 'note 1:6 “The LORD visited his people”'
    claim: 'Naomi left the house of bread in famine and returned when God’s favor returned bread'
    key: ot-minute-ruth-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/ruth-1'
    quote: 'Bethlehem means “house of bread,” and Naomi, having left the land of promise while there was famine, returned to the house of bread when God’s favor returned bread to the land.'
  - where: 'note 1:6 “The LORD visited his people”'
    claim: 'The LORD gave her conception (4:13)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/4?lang=eng'
    quote: 'the LORD gave her conception, and she bare a son.'
  - where: 'note 1:6 “The LORD visited his people”'
    claim: 'Elsewhere the characters name the LORD in blessings, oaths and complaints (1:8, 17, 20)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/1?lang=eng'
    quote: 'the LORD deal kindly with you, as ye have dealt with the dead, and with me.'
  - where: 'note 1:6 “The LORD visited his people”'
    claim: 'God’s ḥesed comes, not usually through epiphanies, but through disciples who minister to one another'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'not usually through divine epiphanies, but through the actions of his disciples who minister to one another.'
  - where: 'note 1:8 “Deal kindly: ḥesed”'
    claim: '“Deal kindly” is ḥesed, hard to translate; the KJV renders it many ways, none capturing its covenantal aspect'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'The Hebrew word translated here as “deal kindly” in verse 8 is ḥesed, a word that describes a divine characteristic but does not easily translate into English. … none of these translations quite capture its covenantal aspect'
  - where: 'note 1:8 “Deal kindly: ḥesed”'
    claim: 'Naomi invokes it on two non-covenant Moabite women who had shown ḥesed; she did not withdraw it from Orpah'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Naomi is invoking it upon two non-covenant Moabite women who themselves had each exhibited ḥesed for their husbands and were then willing to sacrifice their own happiness to provide for Naomi.'
  - where: 'note 1:8 “Deal kindly: ḥesed”'
    claim: 'Unable to show ḥesed herself, Naomi asks the Lord; he will do it through Boaz'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'Being aware that she was incapable of performing hesed for them, she asks the Lord to do so. At least in the case of Ruth, the Lord will eventually show hesed, but he will do this through the acts of a mortal: Boaz.'
  - where: 'note 1:8 “Deal kindly: ḥesed”'
    claim: 'Three uses in Ruth, for Ruth and God explicitly and Boaz implicitly'
    key: belnap-hesed
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/how-excellent-thy-lovingkindness'
    quote: 'Mentioned three times in the book of Ruth, the term is used to describe the acts of Ruth and God explicitly and the works of Boaz implicitly.'
  - where: 'note 1:9 “Rest in the house of a husband”'
    claim: 'Rest is mǝnûḥā, “security”'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'The Lord grant you that ye may find rest (Hebrew mǝnûḥā, “security”), each of you in the house of her husband'
  - where: 'note 1:9 “Rest in the house of a husband”'
    claim: 'Women relied on fathers and husbands for support'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'With only rare exceptions, women were reliant on their fathers and later their husbands for economic support.'
  - where: 'note 1:9 “Rest in the house of a husband”'
    claim: 'In 3:1 rest (mānôaḥ) denotes freedom from the anxiety of exile or of a widow without family'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Here the word rest can refer to absence of work, but it also denotes a freedom from the anxiety that comes from living in exile (Deuteronomy 28:65; Lamentations 1:3), or, as in Ruth and Naomi’s case, someone who was a widow and had no family.'
  - where: 'note 1:9 “Rest in the house of a husband”'
    claim: 'The verb “grant” (1:9) is the verb of “gave her conception” (4:13), the only use of it for conception; Naomi’s wish fulfilled'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'The verb that Naomi uses when she wishes that her daughters-in-law will be given rest is the same verb used when the Lord gives Ruth conception. This is the only time in the Hebrew Bible when that verb is used to describe conception.'
  - where: 'note 1:9 “Rest in the house of a husband”'
    claim: 'The verb in 1:9 (natan, H5414)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ruth.xml'
    quote: 'יִתֵּ֤ן'
  - where: 'note 1:11 “Sons in my womb”'
    claim: 'Naomi had no husband and was too old to bear sons for them to marry under the levirate law, and they would have to wait'
    key: ot-minute-ruth-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/ruth-1'
    quote: 'Naomi explained that she had no husband and even if she did, she was too old to bear more sons for Ruth and Orpah to marry under the levirate law. And even if she could bear sons, it would be a long time before they were of marriageable age.'
  - where: 'note 1:11 “Sons in my womb”'
    claim: 'In chapter 1 Naomi’s emphasis on sons is the support of widowed mothers, not the father’s house'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'chapter 1 focuses on Naomi’s emphasis on bearing sons, which is not to ensure the longevity of the father’s house but to ensure the ongoing support of their widowed mothers.'
  - where: 'note 1:11 “Sons in my womb”'
    claim: 'With her sons dead Naomi had no one to support her'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Even after her husband died, her sons would have provided for their mother, but when they also died, Naomi was left without anyone to support her, and as a result she became vulnerable.'
  - where: 'note 1:14 “Orpah’s kiss and Ruth’s cleaving”'
    claim: 'The narrative does not portray Orpah badly; her goodness contrasted with Ruth’s greatness'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'the narrative is not written in a way that portrays Orpah in a bad light. … It is not a shortcoming on the part of Orpah that is highlighted here, but instead Orpah’s goodness is contrasted with Ruth’s greatness.'
  - where: 'note 1:14 “Orpah’s kiss and Ruth’s cleaving”'
    claim: 'Naomi urges them three times to return'
    key: welch-costly-love
    url: 'https://mi.byu.edu/old-testament-reflections/the-beauty-and-risks-of-costly-love'
    quote: 'she urges them three times to return home with her blessing (Ruth 1:8,11,12).'
  - where: 'note 1:14 “Orpah’s kiss and Ruth’s cleaving”'
    claim: 'Since Naomi freely released them, Orpah’s return is honorable'
    key: welch-costly-love
    url: 'https://mi.byu.edu/old-testament-reflections/the-beauty-and-risks-of-costly-love'
    quote: 'Given that Naomi freely and sincerely relieves her daughters-in-law of their obligation, I find Orpah’s decision to return home to be an honorable one.'
  - where: 'note 1:14 “Orpah’s kiss and Ruth’s cleaving”'
    claim: '“Cleaving” in 1:14 is the word of Genesis 2:24'
    key: welch-costly-love
    url: 'https://mi.byu.edu/old-testament-reflections/the-beauty-and-risks-of-costly-love'
    quote: 'the word used in 1:14 for Ruth’s “cleaving” to Naomi is the same used in Genesis 2:24 to describe the two-as-one relationship of husband and wife.'
  - where: 'note 1:14 “Orpah’s kiss and Ruth’s cleaving”'
    claim: 'Naomi’s blessing was not withdrawn from Orpah'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'the text gives no indication that Naomi withdrew the petition when Orpah chose to return home to her family and, presumably, her Moabite god(s).'
  - where: 'note 1:14 “Orpah’s kiss and Ruth’s cleaving”'
    claim: 'Staying seemed to mean Ruth would not remarry or have children; she takes Naomi’s fate on herself, an emulation of the Savior'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'in staying with Naomi, which seems to dictate that Ruth will not remarry nor have children, Ruth insures that it is she who will face old age all alone. … This emulation of the Savior is not an accidental message of the story—it is one of its main themes.'
  - where: 'note 1:16 “Thy God my God”'
    claim: 'The story illustrates the conversion of a non-Israelite, giving up her former god'
    key: bd-ruth
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ruth?lang=eng'
    quote: 'The story of Ruth beautifully illustrates the conversion of a non-Israelite into the fold of Israel, giving up her former god and former life to unite with the household of faith in the service of the God of Israel (see Ruth 1:16).'
  - where: 'note 1:16 “Thy God my God”'
    claim: 'Two verses, 1:16 and 2:12, indicate Ruth was converted'
    key: ot-manual-judges-13-21
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-13-21-ruth-1-4-the-reign-of-the-judges-part-2?lang=eng'
    quote: 'two verses say that Ruth was converted to the true God of Israel. … Both of these passages indicate that Ruth was converted.'
  - where: 'note 1:16 “Thy God my God”'
    claim: 'She chose to follow Jehovah and was fully accepted as an Israelite'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'Despite her circumstances, she chose to follow Jehovah and become part of His covenant people. Ruth eventually married again, was fully accepted as an Israelite, and was blessed with children.'
  - where: 'note 1:16 “Thy God my God”'
    claim: 'Her conversion is not in doubt, though the covenant and rite are unknown'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'While we are unaware of what covenant and rite must have accompanied the formalization of these thoughts, we are left in no doubt as to the actuality of Ruth’s conversion.'
  - where: 'note 1:16 “Thy God my God”'
    claim: '“Conversion” in today’s sense is probably anachronistic; little evidence of gentile conversion; no rite for women until later; wife presumed to adopt husband’s god'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'it is probably anachronistic to talk about “conversion” in this context—at least conversion in the sense that we think about it today. … we don’t know of any set conversion rituals for women until much later. In the ancient world, it was presumed that a woman adopted the god(s) of her husband when she married.'
  - where: 'note 1:16 “Thy God my God”'
    claim: 'Ruth assumed the role of a covenantal daughter, to worship Naomi’s God and care for her'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'with this oath Ruth assumed the role of a covenantal daughter with the inherent responsibility to not just worship Naomi’s God but to also care for her as a daughter would care for her mother.'
  - where: 'note 1:17 “The LORD do so to me”'
    claim: 'Oaths in Israel could be a matter of life and death and were often accompanied by threats of divine curses; Ruth 1:16–17 among the examples cited'
    key: sc-knowhy-98
    url: 'https://scripturecentral.org/knowhy/why-did-the-lamanites-break-their-treaty-with-king-limhi'
    quote: 'in the ancient world, including in ancient Israel, oaths and treaty-covenants were of such importance that breaking one’s oath could literally become a matter of life and death. … often accompanied with threats of divine and temporal curses (including death) for breaking such (cf. … Ruth 1:16–17'
  - where: 'note 1:17 “The LORD do so to me”'
    claim: 'Ruth swore allegiance to Naomi in the name of Israel’s God'
    key: ot-minute-ruth-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/ruth-1'
    quote: 'Ruth, however, swore her allegiance to Naomi in the name of Israel’s God'
  - where: 'note 1:17 “The LORD do so to me”'
    claim: 'The oath formalizes the commitment and forged an emotional and legal attachment'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'This oath of commitment is formalized when Ruth concludes with “the Lord do so to me, and more also, if ought but death part thee and me” (1:17). … Thus, the oath forged both an emotional and a legal attachment between the two women.'
  - where: 'note 1:20 “Naomi and Mara”'
    claim: 'A play on words: Naomi “pleasant,” Mara “bitter”; not an accusation'
    key: ot-manual-judges-13-21
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-13-21-ruth-1-4-the-reign-of-the-judges-part-2?lang=eng'
    quote: 'Naomi here used a play on words based on her name. In Hebrew Naomi means “sweet or pleasant” and Mara means “bitter.” … This reply was not an accusation, only Naomi’s way of saying that she had endured much tragedy while in Moab.'
  - where: 'note 1:20 “Naomi and Mara”'
    claim: 'BDB: Ruth 1:13 “it is very bitter to me on your account”'
    key: bdb
    url: 'https://biblehub.com/hebrew/4843.htm'
    quote: 'impersonal מַרלִֿי מְאֹד מִכֶּם Ruth 1:13 it is very bitter to me on your account (I am much distressed)'
  - where: 'note 1:20 “Naomi and Mara”'
    claim: 'BDB: the Hiphil of the same verb in Ruth 1:20, beside Job 27:2, “Shadday, who hath embittered my soul”'
    key: bdb
    url: 'https://biblehub.com/hebrew/4843.htm'
    quote: '1 שַׁדַּי הֵמַר נַפְשִׁי Job 27:2 Shadday, who hath embittered my soul; הֵמַר שַׁדַּי לִי מְאֹד Ruth 1:20.'
  - where: 'note 1:20 “Naomi and Mara”'
    claim: 'Ruth 1:13 and 1:20 use the verb H4843'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ruth.xml'
    quote: 'הֵמַ֥ר'
  - where: 'note 1:20 “Naomi and Mara”'
    claim: 'Job-like anguish; struggling to understand why a God of ḥesed caused the bitterness'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'as she exclaimed to the Bethlehemites in Job-like anguish … In this cry we feel Naomi’s very real pain and anguish as she struggled to understand why a God of ḥesed had caused this bitterness to come upon her.'
  - where: 'note 1:20 “Naomi and Mara”'
    claim: 'Her complaint is not answered at this point in the story but is answered later'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'While Naomi’s lament does not accuse God directly, it certainly complains of the unjustness of her situation and implicates God is unjust. Her complaint is not addressed at this point in the story but will receive a resounding answer'
  - where: 'note 1:21 “Out full, home empty”'
    claim: 'The rest of the story shows the empty Naomi filled again'
    key: ot-minute-ruth-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/ruth-1'
    quote: 'Naomi complained that when she left Bethlehem she had been full, but she was now returning empty. The rest of the story shows how the empty Naomi became full once more'
  - where: 'note 1:21 “Out full, home empty”'
    claim: 'The famine–harvest contrast parallels her emptiness and the fulness at Obed’s birth, “a son born to Naomi”'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'The contrast between famine and harvest that is woven throughout the narrative parallels Naomi’s initial feelings of emptiness as she returns to Bethlehem with the fulness that she experiences when Ruth gives birth to Obed'
  - where: 'note 1:21 “Out full, home empty”'
    claim: 'The book moves from emptiness to fulness'
    key: ot-seminary-intro-ruth
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-ruth?lang=eng'
    quote: 'describing Ruth and Naomi’s journey from sadness to happiness and from emptiness to fulness.'
  - where: 'note 1:21 “Out full, home empty”'
    claim: 'Barley harvest in April and May, wheat a few weeks later; arriving at harvest reinforces the theme of being filled'
    key: ot-minute-ruth-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/ruth-1'
    quote: 'In ancient Israel, the barley harvest took place in April and May. The wheat harvest occurred a few weeks later. The fact that the women arrived at harvesttime reinforces the theme of Naomi’s coming at a time when she could be filled once more.'
