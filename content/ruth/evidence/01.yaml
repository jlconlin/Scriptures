  - where: 'christ'
    claim: 'God’s ḥesed does not remove trials but is available, usually through disciples who minister to one another'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'although God’s ḥesed will not remove our trials and periods of darkness, it will always be available to us, not usually through divine epiphanies, but through the actions of his disciples who minister to one another.'
  - where: 'christ'
    claim: 'Ruth taking Naomi’s fate on herself is an emulation of the Savior'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'Ruth is fully willing to take Naomi’s potential suffering upon herself, providing relief for a loved one by experiencing that fate instead. This emulation of the Savior is not an accidental message of the story'
  - where: 'explore'
