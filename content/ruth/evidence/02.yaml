    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/129?lang=eng'
    quote: 'Neither do they which go by say, The blessing of the Lord be upon you: we bless you in the name of the Lord.'
  - where: explore
