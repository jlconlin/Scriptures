chapter: 2
claims:
  - where: setting
    claim: 'With no harvest of their own, the widows turned to the law''s other provisions for the poor'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Apparently, Naomi still owned land in the region (Ruth 4:3), but she didn’t have access to it … Without access to any harvest from Elimelech’s (now Naomi’s) land, the two women needed to take advantage of other provisions in the Mosaic law'
  - where: setting
    claim: 'They had come home in poverty in the midst of a bountiful harvest'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Naomi had originally journeyed to Moab because of a famine in Bethlehem. Now she returned in the midst of a bountiful harvest, but she still had no access to food.'
  - where: setting
    claim: 'Matthew names Boaz (Booz) in the line of Jesus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/1?lang=eng'
    quote: 'And Salmon begat Booz of Rachab; and Booz begat Obed of Ruth; and Obed begat Jesse;'
  - where: setting
    claim: 'God is named acting in only two verses of the book (1:6; 4:13), yet his hesed pervades the story'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'In the book of Ruth, God is specifically mentioned in only two verses (Ruth 1:6; 4:13), yet if the reader looks closely, his ḥesed pervades the story.'
  - where: thread
    claim: 'The reader is told who Boaz is before Ruth knows; she and Boaz act without thought of a goel relationship'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'We benefit from understanding this while reading of the interactions between Ruth and Boaz, but Ruth has no idea. The actions of these two characters are not influenced by any thought of a possible gō’el relationship; instead we see them acting out of true intent.'
  - where: thread
    claim: 'Boaz becomes the human instrument of the divine shelter he invokes at 2:12'
    key: welch-costly-love
    url: 'https://mi.byu.edu/old-testament-reflections/the-beauty-and-risks-of-costly-love'
    quote: 'Boaz grants her request and becomes the human instrument of the divine shelter he earlier invokes. His costly love is the means by which God''s hesed arrives for Ruth and Naomi.'
  - where: thread
    claim: 'Naomi took the harvest as confirmation that God had not abandoned her, as she had charged in 1:21'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Naomi understood this bounteous harvest as a confirmation that God had not abandoned her in her time of loss and poverty, as she had charged him in 1:21.'
  - where: 'note 2:1 “A kinsman, and a man of worth”'
    claim: 'The kinsman of 2:1 is moda‘, a distant relative, unlike the goel of chapters 3–4'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'The first reference in 2:1 is a translation of the Hebrew word moda‘, which simply refers to a distant relative. However, beginning in chapter 3, the rest of the citations are translations of the word gōʾēl'
  - where: 'note 2:1 “A kinsman, and a man of worth”'
    claim: 'BDB defines moda‘ as kinsman, with Ruth 2:1 and Prov. 7:4'
    key: bdb
    url: 'https://biblehub.com/hebrew/4129.htm'
    quote: 'noun masculine kinsman, מידע לְ Ruth 2:1 Kt, but Qr מוֺדַע a kinsman of her husband; figurative מֹדָע לַבִּינָה תִקְרָא Proverbs 7:4 a kinsman shalt thou call understanding'
  - where: 'note 2:1 “A kinsman, and a man of worth”'
    claim: 'Ḥayil marks a landowner with honor and responsibility in the community'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'The Hebrew word translated as “wealth” (ḥayil) indicates a landowner who, because of his landholdings, held a place of honor and responsibility in his community.'
  - where: 'note 2:1 “A kinsman, and a man of worth”'
    claim: 'Boaz is a man of great worth, with a double meaning: means and character'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'It is crucial to the plot for us to know that Boaz is a man of great worth—a double meaning implied, for he is a man of means and character—and that he is a kinsman of Naomi.'
  - where: 'note 2:1 “A kinsman, and a man of worth”'
    claim: 'The same word ḥayil describes Ruth as “virtuous” at 3:11'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'The word translated as “virtuous” (Hebrew ḥayil) here is the same word used by the narrator to describe Boaz in 2:1.'
  - where: 'note 2:2 “What gleaning was, and who it was for”'
    claim: 'A reaper''s swing left the corners; the law forbade the extra step; it let the poor provide for themselves by hard labor; the laws were for poor, stranger, widow and orphan, and Ruth was a poor foreign widow'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'When reaping with a scythe, the swinging-arm movement naturally created a circular motion which would leave the square corners of fields untouched without an extra step. … Ruth, a poor, foreign widow, would look to these laws in her efforts to provide for herself and Naomi.'
  - where: 'note 2:2 “What gleaning was, and who it was for”'
    claim: 'Gleaning was a way for the poor to provide for themselves if willing to labor'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'Through these practices, Israel furnished a way for the impoverished to provide for themselves as long as they were willing and able to engage in some arduous labor.'
  - where: 'note 2:2 “What gleaning was, and who it was for”'
    claim: 'The commands obligated people of means to create opportunities for the poor, at a real cost, like a sacrifice'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'These commands implied that in Israel, people with means had an obligation to create opportunities for the poor. … this commandment was just as much a sacrifice for Israelites as was the offering of their animals on the altar.'
  - where: 'note 2:2 “What gleaning was, and who it was for”'
    claim: 'Ruth''s decision to glean shows her willingness to work and her poverty'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Her decision to glean in the fields (2:2) highlights both her willingness to work and her commitment to support herself and Naomi, but it also reminds readers of her abject poverty'
  - where: 'note 2:3 “Her hap: chance or providence?”'
    claim: 'Whether by design or provident luck is unclear in the text'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Whether by design or provident luck—it is unclear in the text—Ruth ended up in one of the fields that belonged to Elimelech’s relative, Boaz (Ruth 2:1, 3).'
  - where: 'note 2:3 “Her hap: chance or providence?”'
    claim: 'The writer does not mean pure luck; the happenstances bring about the Lord''s purposes'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'Plainly, when the writer says of Ruth that “her hap” was to come to Boaz’s field (Ruth 2:3), he does not intend for us to understand that it was pure luck. The story is full of happenstances which bring about the Lord’s purposes'
  - where: 'note 2:3 “Her hap: chance or providence?”'
    claim: 'God is named acting in only two verses (1:6; 4:13)'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'In the book of Ruth, God is specifically mentioned in only two verses (Ruth 1:6; 4:13), yet if the reader looks closely, his ḥesed pervades the story.'
  - where: 'note 2:7 “A hard phrase in the servant’s report”'
    claim: 'Literally “her dwelling in the house is but short”; not Boaz''s house; the text is probably corrupt; the Greek and Latin read differently'
    key: cambridge-ruth
    url: 'https://biblehub.com/commentaries/cambridge/ruth/2.htm'
    quote: 'lit. ‘her dwelling in the house is (but) short’: not the house of Boaz, which is out of the question … the text is probably corrupt. The LXX. reads ‘and she hath not rested in the field (even) a little time’'
  - where: 'note 2:7 “A hard phrase in the servant’s report”'
    claim: 'The Septuagint: she rested not even a little in the field'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/ruth/2.htm'
    quote: 'and she came and stood from morning till evening, and rested not even a little in the field.'
  - where: 'note 2:7 “A hard phrase in the servant’s report”'
    claim: 'A Latter-day Saint reading: she had worked since morning and stopped only for a short rest in the shelter'
    key: ot-minute-ruth-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/ruth-2'
    quote: 'His servant not only told Boaz who Ruth was but also added that she had worked hard since the morning and had stopped only for a short rest in the shelter.'
  - where: 'note 2:9 “Protection in the field”'
    claim: 'nāga‘ and kālam carry connotations of violence, nāga‘ of sexual assault; the danger was real for a foreign woman alone'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'probably understanding the inherent dangers for a foreign Moabite woman to work alone in the fields, Boaz specifically instructed his young men to “not touch” her (2:9) nor to “reproach her” (2:15). The Hebrew words … carry connotations of violence, with naga‘ also indicating sexual assault.'
  - where: 'note 2:9 “Protection in the field”'
    claim: 'Water drawn for his workers was an important commodity in an arid land; she worked under the watchful eye of his men'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'He instructs her to stay in his fields and to work with his maidens under the watchful eye of his men (see Ruth 2:8–9) … He also tells her to partake of the water drawn for his workers, an important commodity in an arid land during heavy work'
  - where: 'note 2:9 “A well scene turned around”'
    claim: 'The meeting alludes to the well type-scene (Gen. 24; 29; Ex. 2), with differences: Ruth is a woman traveling to Israel'
    key: sc-knowhy-854
    url: 'https://scripturecentral.org/knowhy/why-does-boaz-allude-to-a-well-in-connection-with-his-meeting-ruth'
    quote: 'For example, it is usually men who are the travelers coming from Israel, whereas Ruth is a woman traveling to Israel. Nevertheless, the similarities of Ruth to these other stories likely exist because the author is utilizing an ancient pattern of storytelling, called a “type-scene“'
  - where: 'note 2:9 “A well scene turned around”'
    claim: 'Young men draw water for her, a reversal; the meal recalls the feast of such scenes'
    key: sc-knowhy-854
    url: 'https://scripturecentral.org/knowhy/why-does-boaz-allude-to-a-well-in-connection-with-his-meeting-ruth'
    quote: 'In Ruth 2:9, Boaz tells Ruth that the young men will draw water from the well for her, a reversal of some of the scenes in which the young women draw water. … Boaz invited Ruth to eat a meal with him, reminiscent of the feast at the end of similar type-scenes.'
  - where: 'note 2:9 “A well scene turned around”'
    claim: 'In Ruth a Gentile woman comes to Israel for her betrothal'
    key: sc-knowhy-854
    url: 'https://scripturecentral.org/knowhy/why-does-boaz-allude-to-a-well-in-connection-with-his-meeting-ruth'
    quote: 'The fact that the destination is reversed and Ruth, a gentile woman, comes to Israel for her betrothal can also be a metaphor'
  - where: 'note 2:11 “She left as Abraham left”'
    claim: 'Ruth the Moabite, of a group historically at odds with Israel, is compared favorably with the patriarchs'
    key: sc-knowhy-854
    url: 'https://scripturecentral.org/knowhy/why-does-boaz-allude-to-a-well-in-connection-with-his-meeting-ruth'
    quote: 'In the Book of Ruth, Ruth the Moabite, a member of a group with whom the Israelites were historically at odds, is compared favorably with the patriarchs.'
  - where: 'note 2:16 “More than the law asked”'
    claim: 'Gleaning among the sheaves meant not waiting until the grain went to the threshing floor'
    key: ot-minute-ruth-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/ruth-2'
    quote: 'Boaz instructed his servants to let Ruth glean among the sheaves, which meant she didn’t have to wait until the grain had been transported to the threshing floor to glean.'
  - where: 'note 2:10 “A foreigner, and less than a handmaid”'
    claim: 'A gēr was a displaced person, Israelite or Gentile, with protected status'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'We have noted earlier that gēr refers to both Israelite and gentile peoples who were displaced but enjoyed a protected status within a community.'
  - where: 'note 2:10 “A foreigner, and less than a handmaid”'
    claim: 'Nokrîyâ, unlike gēr, is a foreigner without legal protection; it stresses otherness'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'the KJV translates both gēr (singular of gērîm) and nokrîya as “stranger.” … A nokrîya, however, emphasizes a foreigner without the legal protection of the gērîm. Thus, it emphasized “the person’s otherness and separateness from the dominant culture.”'
  - where: 'note 2:10 “A foreigner, and less than a handmaid”'
    claim: 'At 2:13 she calls herself a šipḥâ, a slave girl, the lowest rank, not equal even to the other servants'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Ruth further emphasized her “otherness” and lack of social status by describing herself as a šipḥa—a slave girl, the lowest rank of servants—who doesn’t even have the same status as the other slaves (2:13).'
  - where: 'note 2:10 “A foreigner, and less than a handmaid”'
    claim: 'The narrator keeps calling her a Moabitess (1:4, 6, 22; 2:2, 6, 21; 4:5, 10)'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Up until Ruth 4:10, the author repeatedly emphasizes Ruth’s Moabite identity (Ruth 1:4, 6, 22; 2:2, 6, 21; 4:5, 10). She is never considered to be an Israelite in the story, and Ruth is very aware of her marginal status.'
  - where: 'note 2:11 “She left as Abraham left”'
    claim: 'Ruth 2:11 is a clear allusion to Gen. 12:1; Ruth becomes like the patriarchs'
    key: sc-knowhy-854
    url: 'https://scripturecentral.org/knowhy/why-does-boaz-allude-to-a-well-in-connection-with-his-meeting-ruth'
    quote: 'Ruth 2:11 is a clear allusion to Genesis 12:1, in which Abraham is told to leave for a new land … Ruth therefore becomes like the patriarchs who left everything to follow God.'
  - where: 'note 2:11 “She left as Abraham left”'
    claim: 'God accepts anyone who comes to Him, whatever the ethnicity'
    key: sc-knowhy-854
    url: 'https://scripturecentral.org/knowhy/why-does-boaz-allude-to-a-well-in-connection-with-his-meeting-ruth'
    quote: 'In a world that was often hostile to outsiders, this text is a refreshing reminder that God is willing to accept anyone who comes to Him and keeps the commandments, no matter his or her ethnicity or cultural background.'
  - where: 'note 2:11 “She left as Abraham left”'
    claim: 'The reason Boaz gives for his kindness is what Ruth had done'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'To me the most impressive thing about Boaz is the reason he did all of this for Ruth. He tells her plainly, “It hath fully been shewed me, all that thou hast done unto thy mother in law'
  - where: 'note 2:11 “She left as Abraham left”'
    claim: 'Genesis 12:1 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/12?lang=eng'
    quote: 'Now the Lord had said unto Abram, Get thee out of thy country, and from thy kindred, and from thy father’s house, unto a land that I will shew thee:'
  - where: 'note 2:12 “Under the LORD’s wings”'
    claim: 'Kānāp is used figuratively of the LORD as protector of his people, Ps. 17, 36, 57, 61, 63, 91 and Ruth 2:12'
    key: bdb
    url: 'https://biblehub.com/hebrew/3671.htm'
    quote: 'h. figurative of ׳י, as protector of his people Psalm 17:8; Psalm 36:8; Psalm 57:2; Psalm 61:5; Psalm 63:3; Psalm 91:4; Ruth 2:12.'
  - where: 'note 2:12 “Under the LORD’s wings”'
    claim: '“Come to trust” is ḥāsâ, to seek refuge; kānāp is the word for the cherubim''s wings over the mercy seat (Ex. 25:20)'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'under whose wings thou art come to trust (Hebrew ḥāsâ, ‘to seek refuge’)” (2:12). The Hebrew word translated as “wings” in the KJV is kānāp, which is the same word used to describe the wings of the cherubim that covered the mercy seat'
  - where: 'note 2:12 “Under the LORD’s wings”'
    claim: 'Boaz becomes part of fulfilling his own wish; the image returns later in the story'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'We find not only that Boaz is part of fulfilling this wish but that the picture of coming under God’s wing is both a moving image and an important phrase that will come to play later in the story.'
  - where: 'note 2:12 “Under the LORD’s wings”'
    claim: 'The book likens Boaz''s generosity to the Lord''s hesed: 2:12 wings of the LORD, 3:9 his wing'
    key: welch-costly-love
    url: 'https://mi.byu.edu/old-testament-reflections/the-beauty-and-risks-of-costly-love'
    quote: 'The book of Ruth directly likens Boaz’s generosity and the Lord’s hesed: in Ruth 2:12, Boaz blesses Ruth for taking refuge under the “wings” of “the LORD God of Israel.” Then at the threshing floor, Ruth asks Boaz to spread his “wing” over her'
  - where: 'note 2:14 “A place at the meal”'
    claim: 'Parched grain: harvested just before ripe and roasted; costly for the owner; given to workers at midday for energy'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'Some of the grain is harvested just before it is ripe. It is then roasted, producing a carmelized food that is both tasty and serves as a high-energy food source … While the preharvest production and preparation of this meal is expensive for the owner of a field'
  - where: 'note 2:14 “A place at the meal”'
    claim: 'The meal fed her when she had nothing with which to prepare one'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'it not only provides her with food (see Ruth 2:14) but does so when she is not in a position to have aught with which to prepare any meal for herself.'
  - where: 'note 2:14 “A place at the meal”'
    claim: 'She sat not in the shadows but beside the workers'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Fifth, after a full day of work (2:7, 17), Boaz invited Ruth to join in a meal where she sat not in the shadows but beside the other workers (2:14).'
  - where: 'note 2:16 “More than the law asked”'
    claim: 'Gleaning among the sheaves and near his maidens gave her the full field, not the leftovers'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Both of these invitations meant that she had access to the full field, not just to the leftovers, so she was able to gather more grain.'
  - where: 'note 2:16 “More than the law asked”'
    claim: 'Boaz charged the workers secretly; zealous for the spirit of the law'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'Moreover, Boaz secretly charged his workers to leave extra grain for Ruth (see Ruth 2:16). Thus, without her knowledge, her workload was made lighter … we see in Boaz someone not only willing to do what the law required but also zealous in keeping the spirit of the law.'
  - where: 'note 2:16 “More than the law asked”'
    claim: 'Living only the letter of the law is often not enough to help people in need'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'His actions are examples of how biblical laws could be interpreted in expanded ways and are a reminder that when dealing with social issues, it is often not enough to simply live the letter of the law.'
  - where: 'note 2:16 “More than the law asked”'
    claim: 'Hesed exceeds the bounds of law or custom'
    key: welch-costly-love
    url: 'https://mi.byu.edu/old-testament-reflections/the-beauty-and-risks-of-costly-love'
    quote: 'Hesed is a kind of loving faithfulness that exceeds the bounds of law or custom: it gives whatever is needful for the well being of the beloved regardless of conventional duty.'
  - where: 'note 2:17 “An ephah in a day”'
    claim: 'An ephah of barley is about 23 liters or 30 pounds (13.5 kg)'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'she brought back about an ephah of barley—approximately 23 liters or about 30 pounds (13.5 kg).'
  - where: 'note 2:17 “An ephah in a day”'
    claim: 'At that rate she could gather food for nearly a year over the harvest'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'When we calculate how much she gathered in one day against known ration amounts and extrapolate that rate to the entire harvest season, it appears that she would have been able to gather enough food for nearly a year while spending time in Boaz’s fields.'
  - where: 'note 2:17 “An ephah in a day”'
    claim: 'An ephah was much more than most gleaners collected in a day'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'This was much more than what most gleaners would typically collect in a day.'
  - where: 'note 2:17 “An ephah in a day”'
    claim: 'Naomi guessed a benefactor from the quantity of barley and the food brought home'
    key: keil-ruth
    url: 'https://biblehub.com/commentaries/kad/ruth/2.htm'
    quote: 'praised the benefactor, who, as she conjecture from the quantity of barley collected and the food brought home, had taken notice of Ruth'
  - where: 'note 2:20 “Whose kindness?”'
    claim: 'Naomi credits the LORD; Boaz performed the act but the honor was given to God'
    key: belnap-hesed
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/how-excellent-thy-lovingkindness'
    quote: 'In this case, while Boaz may have performed the act of hesed, the honor of it was given to God, as it was he who was truly aware of Naomi’s condition.'
  - where: 'note 2:20 “Whose kindness?”'
    claim: 'Living = Naomi and Ruth, dead = husband and sons; God gracious to the dead through care for their widows; the phrase as at Gen. 24:27'
    key: keil-ruth
    url: 'https://biblehub.com/commentaries/kad/ruth/2.htm'
    quote: 'On חסדּו עזב see Genesis 24:27. … in which Naomi thought of herself and Ruth, and of her husband and sons, to whom God still showed himself gracious, even after their death, through His care for their widows.'
  - where: 'note 2:20 “Whose kindness?”'
    claim: '“To the dead”: Naomi sees the possibility of a levirate marriage continuing her husband''s and son''s seed; her lament answered'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'The possibility of a levirate marriage leading to the continuation of her husband’s and son’s seed is the reason she states that the Lord is showing hesed to the dead. Furthermore, Naomi’s lament in the first chapter … seems to be fully satisfied in her mind.'
  - where: 'note 2:20 “Whose kindness?”'
    claim: 'Muhlestein''s own translation: “who hath not abandoned his hesed”'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: '“May he be blessed by the Lord, who hath not abandoned his hesed to the living and to the dead. And Naomi said to her, the man is near of kin to us, he is one of our redeemers” (see Ruth 2:20; author’s translation).'
  - where: 'note 2:20 “Whose kindness?”'
    claim: 'God''s hesed is often accomplished through the acts of other people'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Naomi’s use of the word ḥesed reminds readers of the recurring theme of God’s lovingkindness to his children, which is often accomplished through the acts of other people.'
  - where: 'note 2:20 “A redeemer among the kin”'
    claim: 'Goel occurs here for the first time in the story'
    key: cambridge-ruth
    url: 'https://biblehub.com/commentaries/cambridge/ruth/2.htm'
    quote: '20. one of our near kinsmen] See marg. and note on Ruth 3:9. Here the word go’el occurs for the first time in the story.'
  - where: 'note 2:20 “A redeemer among the kin”'
    claim: 'BDB: act as kinsman, do the part of next of kin; goel kinsman, Ruth 2:20'
    key: bdb
    url: 'https://biblehub.com/hebrew/1350.htm'
    quote: '1 act as kinsman, do the part of next of kin (chiefly in D H P Ruth), גֹּאֵל kinsman Leviticus 25:25 (H) Numbers 5:8; Numbers 35:12 (P) Ruth 2:20'
  - where: 'note 2:20 “A redeemer among the kin”'
    claim: 'A goel was a close relative responsible to rescue family from unpayable debts: freeing them from bondage, buying back family land'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'a redeemer referred to a close relative who had responsibility to rescue family members from debts they could not pay on their own. This included freeing family members from bondage or purchasing family land'
  - where: 'note 2:20 “A redeemer among the kin”'
    claim: 'Naomi identified Boaz as one who could redeem them from their destitute condition'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'she was identifying Boaz as one who could redeem them from their destitute condition.'
  - where: 'note 2:20 “A redeemer among the kin”'
    claim: 'Lev. 25:25 kinsman buys back sold land; Lev. 25:47–49 kin may redeem a brother sold to a stranger'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/25?lang=eng'
    quote: 'if any of his kin come to redeem it, then shall he redeem that which his brother sold. … Either his uncle, or his uncle’s son, may redeem him'
  - where: 'note 2:20 “A redeemer among the kin”'
    claim: 'God is often called goel; in Ruth the goel is human, but readers would recognize the Redeemer of Israel (Isa. 49:7); Boaz the instrument of God''s hesed'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'In the book of Ruth, gōʾēl is always a reference to a human being, but readers would easily recognize the connection with the “familiar epithet for God,” the Redeemer of Israel (gōʾēl yiśrāēl; Isaiah 49:7).'
  - where: 'note 2:20 “A redeemer among the kin”'
    claim: 'Naomi saw Boaz as someone who could help with long-term security'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Naomi then recognized that Boaz was not just an answer to their immediate need for food, but someone who could also help with her and Ruth’s long-term security.'
  - where: christ
    claim: 'Boaz as goel is a type of Christ, Redeemer, Bridegroom, Friend'
    key: welch-costly-love
    url: 'https://mi.byu.edu/old-testament-reflections/the-beauty-and-risks-of-costly-love'
    quote: 'And Boaz’s role as go’el, or “redeeming kinsman,” is, for Christian readers, a powerful type of Christ our Redeemer, Bridegroom, and generous Friend.'
  - where: christ
    claim: 'In chapter 2 Boaz shares food and water (2:14) and lets her gather full stalks rather than leavings (2:15)'
    key: welch-costly-love
    url: 'https://mi.byu.edu/old-testament-reflections/the-beauty-and-risks-of-costly-love'
    quote: 'First, he shares food and water with Ruth (Ruth 2:14), and then he allows her to gather full stalks of wheat rather than the meager field leavings (Ruth 2:15).'
  - where: christ
    claim: 'The book likens Boaz''s generosity to the Lord''s hesed; at 3:9 he becomes the human instrument of the shelter invoked at 2:12'
    key: welch-costly-love
    url: 'https://mi.byu.edu/old-testament-reflections/the-beauty-and-risks-of-costly-love'
    quote: 'The book of Ruth directly likens Boaz’s generosity and the Lord’s hesed: in Ruth 2:12, Boaz blesses Ruth for taking refuge under the “wings” of “the LORD God of Israel.” … Boaz grants her request and becomes the human instrument of the divine shelter he earlier invokes.'
  - where: christ
    claim: 'God''s hesed comes usually through the actions of his disciples who minister to one another'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'although God’s ḥesed will not remove our trials and periods of darkness, it will always be available to us, not usually through divine epiphanies, but through the actions of his disciples who minister to one another.'
