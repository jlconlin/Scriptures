chapter: 3
claims:
  - where: setting
    claim: 'Widowed and childless, Naomi had no one to support her'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'when they also died, Naomi was left without anyone to support her, and as a result she became vulnerable.'
  - where: setting
    claim: 'Naomi had two objectives: food first, then long-term security (chapter 3)'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Naomi’s second objective, as detailed in Ruth 3, was to ensure long-term security for both her and Ruth.'
  - where: setting
    claim: 'The night scene is set in darkness and secrecy, against the public light of the following day'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'In contrast to the public lights of the following day, this climactic scene is set in seclusion and dramatic suspense.'
  - where: thread
    claim: 'Ruth asks Boaz to be the Lord’s wings, the fulfillment of the blessing of 2:12'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'By asking Boaz to spread his wing over her, Ruth draws upon Boaz’s own imagery, implying that he is the fulfillment of Ruth’s coming under the Lord’s wings.'
  - where: thread
    claim: 'Boaz does nothing out of its proper order'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'the carefully chosen words demonstrate that Boaz does not do anything out of its proper order.'
  - where: thread
    claim: 'Ruth asks Boaz to be the human conduit of God’s ḥesed'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Ruth was asking Boaz to be the human conduit of God’s ḥesed that he had invoked upon her.'
  - where: 'note 3:1 “Rest: a secure home”'
    claim: '“Rest” at 3:1 is mānôaḥ, freedom from the anxiety of a widow without family'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'shall I not seek rest (Hebrew mānôaḥ) for thee … it also denotes a freedom from the anxiety that comes from living in exile (Deuteronomy 28:65; Lamentations 1:3), or, as in Ruth and Naomi’s case, someone who was a widow and had no family.'
  - where: 'note 3:1 “Rest: a secure home”'
    claim: 'At 1:9 Naomi wished them “rest” (mǝnûḥā, security) in the house of a husband'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'The Lord grant you that ye may find rest (Hebrew mǝnûḥā, “security”), each of you in the house of her husband” (Ruth 1:8–9).'
  - where: 'note 3:2 “Why the threshing floor”'
    claim: 'The threshing gave Ruth a private audience with Boaz; Naomi waited for it'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'This time of rejoicing and import, along with its assurance that Ruth could find a private audience with Boaz, seemed to be the perfect opportunity for Naomi’s plan to be put into motion.'
  - where: 'note 3:2 “Why the threshing floor”'
    claim: 'Naomi’s plan was already hatching after 2:20; she waited for the time'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'It seems that Naomi’s plan for Ruth was already hatching. She merely waited for the perfect time to put it into effect.'
  - where: 'note 3:2 “Why the threshing floor”'
    claim: 'The landowner and sometimes servants slept at the threshing floor to guard the grain'
    key: ot-minute-ruth-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/ruth-3'
    quote: 'During the harvest the landowner and sometimes some of the men servants slept in the threshing barns to protect the grain from thieves.'
  - where: 'note 3:2 “Why the threshing floor”'
    claim: 'Naomi used a stratagem; Boaz would work late sorting barley'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'she directed Ruth to go to the threshing floor, where Boaz would work late into the night sorting the harvested barley. Using a stratagem, to be sure, Naomi instructed Ruth to not make herself known'
  - where: 'note 3:3 “Washed, anointed, dressed”'
    claim: 'Naomi had Ruth prepare herself like a bride (Ezek. 16:9–12)'
    key: ot-minute-ruth-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/ruth-3'
    quote: 'Naomi instructed Ruth to prepare herself like a bride (see Ezekiel 16:9–12)'
  - where: 'note 3:3 “Washed, anointed, dressed”'
    claim: 'Ruth washed and dressed, presumably in her best clothes'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'had Ruth prepare herself by washing and dressing (presumably in the best clothes she had), and then let events unfold.'
  - where: 'note 3:4 “Uncover his feet”'
    claim: 'margǝlōt is “place of the feet”; at 3:8, 14 adverbially “at his feet”'
    key: bdb
    url: 'https://biblehub.com/hebrew/4772.htm'
    quote: 'plural denominative place of the feet, feet … suffix מַרְגְּםתָיו place of his feet Ruth 3:4,7; adverb = at his feet Ruth 3:8 + Ruth 3:14'
  - where: 'note 3:4 “Uncover his feet”'
    claim: 'Lying at his feet suggests a humble supplicant'
    key: ot-minute-ruth-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/ruth-3'
    quote: 'Lying at his feet suggests the position of a humble supplicant.'
  - where: 'note 3:4 “Uncover his feet”'
    claim: 'The words for lying down, uncovering and feet can be euphemisms; the writer raises the thought only to show nothing of the kind happened'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'The Hebrew words employed by the writer for lying down, uncovering, and feet are words often used as sexual euphemisms … it seems most likely that our writer only did so in order that he might crush the idea, using the potential of impropriety to contrast the reality that nothing of the kind happened.'
  - where: 'note 3:4 “Uncover his feet”'
    claim: 'The suggestive setting highlights that Ruth and Boaz choose valiantly'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'Time and again our story presents Ruth or Boaz with choices, and each time they choose valiantly.'
  - where: 'note 3:4 “Uncover his feet”'
    claim: 'Ruth lay at his feet in order to ask him to marry her'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'In making this request, Ruth was essentially asking Boaz to marry her so he could take her under his protection and provide for her.'
  - where: 'note 3:8 “Unnamed in the dark”'
    claim: '“Afraid” (ḥārad) may mean he shivered with cold or was startled'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'The KJV says that at midnight he awoke and was “afraid” (3:8), but this could also mean that he had shivered because of the cold or was startled (Hebrew ḥārad) to find Ruth lying at his feet.'
  - where: 'note 3:8 “Unnamed in the dark”'
    claim: 'The narrator uses “the man” and “a woman” instead of names, part of the scene’s secrecy; neither Boaz nor Naomi recognizes Ruth at first'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'Phrases such as “the man” and “a woman” (Ruth 3:8, 16, 18) used in place of their names are further devices of the shroud of secrecy contrived by the writer.'
  - where: 'note 3:8 “Unnamed in the dark”'
    claim: 'Neither Boaz nor Naomi at first recognizes Ruth (3:9, 16)'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'coupled with his and Naomi’s initial inabilities to recognize Ruth (see Ruth 3:9, 16)'
  - where: 'note 3:9 “Spread thy wing”'
    claim: '“Skirt” is kānāp, the same word as “wings” in 2:12'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'The KJV uses the word skirt, but the Hebrew word is kānāp, the same word Boaz used in his earlier invocation, there translated as “wings.”'
  - where: 'note 3:9 “Spread thy wing”'
    claim: 'Ruth asks Boaz to be the Lord’s wings; people are the Lord’s means of hesed'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'One of the major motifs of the book of Ruth is that people are often the Lord’s means for pouring forth his blessings, or hesed. Here Ruth asks Boaz to be the Lord’s wings.'
  - where: 'note 3:9 “Spread thy wing”'
    claim: 'Naomi conceived the plan, but Ruth approached Boaz and asked for redemption'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'While Naomi conceives the plan, Ruth is the one who puts it into action. While Boaz is generous and willing, Ruth is the one who approaches him and who asks for redemption.'
  - where: 'note 3:9 “Spread thy wing”'
    claim: 'The request was a proposal of marriage, asking for protection and provision'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'A more literal translation would be, “Spread thy wing over thy handmaid, for thou art a redeemer.” In making this request, Ruth was essentially asking Boaz to marry her'
  - where: 'note 3:9 “Spread thy wing”'
    claim: 'Boaz becomes the human instrument of the divine shelter he invoked'
    key: welch-costly-love
    url: 'https://mi.byu.edu/old-testament-reflections/the-beauty-and-risks-of-costly-love'
    quote: 'Boaz grants her request and becomes the human instrument of the divine shelter he earlier invokes.'
  - where: 'note 3:10 “Her latter kindness”'
    claim: 'The “beginning” ḥesed was leaving home for Naomi; the “latter” her action at the threshing floor; bāḥûrîm are eligible young men'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Her “beginning” ḥesed was a reference to her decision to leave home and family so that she could look after Naomi. The context suggests that Ruth’s “latter” ḥesed refers to her actions at the threshing floor.'
  - where: 'note 3:10 “Her latter kindness”'
    claim: 'bāḥûrîm means eligible, choice young men; Ruth could have chosen among them'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'bāḥûrîm refers to eligible, and particularly choice, young men. Boaz understood that Ruth could have had her pick of any of the young, eligible bachelors, and yet she (and Naomi) had chosen him.'
  - where: 'note 3:10 “Her latter kindness”'
    claim: 'Her final ḥesed was choosing Boaz as the family’s redeemer, on his true worth, not appearance'
    key: belnap-hesed
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/how-excellent-thy-lovingkindness'
    quote: 'her final act of hesed led to her choosing Boaz as the family’s redeemer, demonstrating her awareness of his true worth, based not on appearances or simple physical attractiveness'
  - where: 'note 3:10 “Her latter kindness”'
    claim: 'Ruth’s ḥesed to Naomi led her to ask Boaz to redeem, which was ḥesed to him; Boaz probably older'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'she has also shown hesed to Boaz for asking him to be her redeemer and levirate husband. This implies that Boaz was older and probably even unmarried and childless, though we cannot be sure of the latter suppositions.'
  - where: 'note 3:11 “A woman of worth”'
    claim: '“Virtuous” is ḥayil, the word used of Boaz at 2:1; the couple equally yoked'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'The word translated as “virtuous” (Hebrew ḥayil) here is the same word used by the narrator to describe Boaz in 2:1. … it conveys to the reader that this couple would be equally yoked together.'
  - where: 'note 3:11 “A woman of worth”'
    claim: 'Since Ruth was not wealthy, ḥayil shows Boaz too was a man of strength or virtue, not only wealth'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'since Ruth was not a wealthy woman, its use reinforces that Boaz was not just a man of wealth but also a man of strength or virtue.'
  - where: 'note 3:13 “The nearer kinsman and the oath”'
    claim: 'BDB: gāʾal at 3:13 is doing the kinsman’s part in taking a kinsman’s widow'
    key: bdb
    url: 'https://biblehub.com/hebrew/1350.htm'
    quote: 'a. in taking a kinsman''s widow … if he will do thee the kinsman''s part (raise up children by the widow) well, let him do the kinsman''s part'
  - where: 'note 3:13 “The nearer kinsman and the oath”'
    claim: 'Naomi was probably aware of a closer kinsman'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'she was probably even aware that there was a kinsman closer to her than Boaz.'
  - where: 'note 3:13 “The nearer kinsman and the oath”'
    claim: 'Boaz does nothing out of its proper order'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'Boaz proves himself to be a man who does things exactly the way they should be done or even better.'
  - where: 'note 3:13 “The nearer kinsman and the oath”'
    claim: 'Boaz committed to redeem Naomi’s land but acknowledged a nearer gōʾēl'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Boaz committed to help Ruth by redeeming Naomi’s land (Leviticus 25:23–30) but acknowledged that there was a gōʾēl who was “nearer than I.”'
  - where: 'note 3:13 “The nearer kinsman and the oath”'
    claim: 'Scripture Helps: the book uniquely joins the kinsman redeemer to the levirate law'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'The book of Ruth uniquely associates the kinsman redeemer with the levirate law of marriage.'
  - where: 'note 3:14 “Gone before dawn”'
    claim: 'Boaz sent her away early to protect her reputation'
    key: ot-minute-ruth-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/ruth-3'
    quote: 'To protect Ruth’s reputation, Boaz told Ruth to leave before anyone saw her.'
  - where: 'note 3:14 “Gone before dawn”'
    claim: 'The trip home in full dark was likely too dangerous; she stayed until grey morning'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'Most likely the trip home would have been too dangerous a journey for Ruth to undertake in the full dark of night, and hence Boaz instructs her to lodge until the grey hours of the morning.'
  - where: 'note 3:14 “Gone before dawn”'
    claim: 'BDB lists 3:13 “tarry” (lîn) under lodging for the night'
    key: bdb
    url: 'https://biblehub.com/hebrew/3885.htm'
    quote: 'with הַלַּיְלָה (accusative temporal), Numbers 22:8; Joshua 4:3; 2 Samuel 17:16; 2 Samuel 19:8; Ruth 3:13'
  - where: 'note 3:17 “Go not empty”'
    claim: 'The measure is not given; Ruth carried the barley in her cloak; one older reading: Ruth could not have carried two ephahs home'
    key: keil-ruth
    url: 'https://biblehub.com/commentaries/kad/ruth/3.htm'
    quote: 'Six (measures of) barley: the measure is not given. According to the Targum and the Rabbins, it was six seahs equals two ephahs. This is certainly incorrect; for Ruth would not have been able to carry that quantity of barley home.'
  - where: 'note 3:17 “Go not empty”'
    claim: 'The six measures were an immensely, even hyperbolically, generous gift'
    key: welch-costly-love
    url: 'https://mi.byu.edu/old-testament-reflections/the-beauty-and-risks-of-costly-love'
    quote: 'After their nighttime encounter at the threshing floor, Boaz gives Ruth an immensely, even hyperbolically, generous gift of six measures of barley (Ruth 3:15).'
  - where: 'note 3:17 “Go not empty”'
    claim: 'The barley emphasized his intent to keep his promise'
    key: ot-minute-ruth-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/ruth-3'
    quote: 'Before she left, Boaz filled her shawl with barley to take home to Naomi, which further emphasized his intent to fulfill the promises he had made to her.'
  - where: 'note 3:18 “He will not rest”'
    claim: 'BDB: šāqaṭ “be quiet, undisturbed”; of Boaz at 3:18, he will not be quiet until he has finished'
    key: bdb
    url: 'https://biblehub.com/hebrew/8252.htm'
    quote: 'of Boaz Ruth 3:18 he will not be quiet until he has finished the matter'
  - where: 'note 3:18 “He will not rest”'
    claim: 'Naomi has no doubt Boaz will accomplish it in short order'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'In Naomi’s mind there is no doubt that once Boaz has set his mind to doing this thing, it will be accomplished in short order.'
  - where: 'note 3:18 “He will not rest”'
    claim: 'The next morning the nearer kinsman comes by; the writer means the Lord’s hand, not coincidence'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'Our writer did not intend for us to think of this fortuitous meeting between Boaz and Naomi’s nearest relative as coincidence.'
  - where: christ
    claim: 'Ruth’s virtue, courage and action are the engine of the events'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'Her virtue, courage, and action are the engine of the events.'
  - where: christ
    claim: 'Boaz as gōʾēl is, for Christian readers, a type of Christ the Redeemer and Bridegroom'
    key: welch-costly-love
    url: 'https://mi.byu.edu/old-testament-reflections/the-beauty-and-risks-of-costly-love'
    quote: 'Boaz’s role as go’el, or “redeeming kinsman,” is, for Christian readers, a powerful type of Christ our Redeemer, Bridegroom, and generous Friend.'
  - where: christ
    claim: 'With all her character Ruth must depend upon another; she needs redemption herself'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'it is symbolically significant that with all of her character, charisma, and drive, Ruth must depend upon another to find full resolution. She is in need of redemption herself.'
  - where: christ
    claim: 'Like Naomi and Ruth, we cannot save ourselves but rely on the Redeemer'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'Like Naomi and Ruth, we cannot save ourselves but must rely on our Redeemer Jesus Christ, who has “purchased [us] with his own blood.”'
  - where: explore
    claim: 'Muhlestein’s study is especially good on Ruth 3–4'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'Perhaps the most meaningful lines of the story take place there, in the middle of the night, on the threshing floor.'
  - where: explore
    claim: 'BDB lists the Psalms where kānāp is the LORD’s protecting wing'
    key: bdb
    url: 'https://biblehub.com/hebrew/3671.htm'
    quote: 'h. figurative of ׳י, as protector of his people Psalm 17:8; Psalm 36:8; Psalm 57:2; Psalm 61:5; Psalm 63:3; Psalm 91:4; Ruth 2:12.'
  - where: 'note 3:9 “Spread thy wing”'
    claim: 'BDB: kānāp is wing, extremity'
    key: bdb
    url: 'https://biblehub.com/hebrew/3671.htm'
    quote: 'כָּנָף109 noun feminine1Kings 6:27 … wing, extremity'
  - where: 'note 3:10 “Her latter kindness”'
    claim: 'Everywhere else in Ruth “young men” is nǝʿārîm, young men or servants'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'In every other case where the phrase “young men” is used in Ruth, the KJV translates the Hebrew word nĕ‘ārîm, which refers to young men or servants'
  - where: 'note 3:11 “A woman of worth”'
    claim: 'ḥayil refers to strength, ability and wealth'
    key: ot-minute-ruth-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/ruth-3'
    quote: 'The Hebrew word used here for “virtuous” is chayil and refers to traits of “strength, ability, and wealth.”'
  - where: 'note 3:11 “A woman of worth”'
    claim: 'From different backgrounds, both strong in keeping covenant obligations: Ruth her oath, Boaz his duty to poor, widows, strangers'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Although they came from different social, economic, political, and religious backgrounds, they were both strong in their desires to keep their covenantal obligations … Ruth made an oath to look after Naomi, and Boaz understood his covenantal obligations to look after the poor, the widows, and the strangers'
  - where: 'note 3:8 “Unnamed in the dark”'
    claim: 'The secluded night scene contrasts with the public light of the next day'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'In contrast to the public lights of the following day, this climactic scene is set in seclusion and dramatic suspense.'
  - where: 'note 3:14 “Gone before dawn”'
    claim: 'The secluded night scene contrasts with the public light of the next day'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'In contrast to the public lights of the following day, this climactic scene is set in seclusion and dramatic suspense.'
  - where: 'note 3:18 “He will not rest”'
    claim: 'The Lord brought the nearer kinsman to the gate at the right time'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'Instead, as Boaz set about his task in the early hours, the Lord assisted him by bringing the right person to the right place at that same early time.'
