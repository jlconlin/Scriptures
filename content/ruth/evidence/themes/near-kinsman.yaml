page: near-kinsman
claims:
  - where: 'opening'
    claim: '“Near kinsman” in 3:9 is gōʾēl'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'for thou art a near kinsman [gōʾēl].'
  - where: 'opening'
    claim: 'Connection made by this page: in Ruth redemption makes kin in both directions; the redeemer must be kin before he can redeem (2:1, 20; 3:12), and the stranger becomes kin by being redeemed (2:10; 4:10–13); the nearer kinsman shows that kinship gives the right but not the will; read with Heb. 2 and Eph. 2, this is the shape of Christ’s redemption; no source states the two directions together'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/4?lang=eng'
    quote: 'have I purchased to be my wife'
  - where: 'section “Only a kinsman”'
    claim: 'The gōʾēl’s redemption was based on family relationship, not done by anyone for anyone'
    key: lane-redemption-gaal
    url: 'https://rsc.byu.edu/finding-christ-covenant-path/redemption-gaal'
    quote: 'It could not be done by anyone for anyone. It is based on familial relationship.'
  - where: 'section “Only a kinsman”'
    claim: 'The redemption was at a price, which the gōʾēl paid'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'this was deliverance at a price, and the gō’el paid that price.'
  - where: 'section “Only a kinsman”'
    claim: '“Next kinsmen” in 2:20 is gōʾēl'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'The phrase “next kinsmen” in the King James Version of the Old Testament comes from the Hebrew word gō’el, which means “redeemer.”'
  - where: 'section “Only a kinsman”'
    claim: 'Ruth calls herself a nokrîyâ, a foreigner without the gēr’s legal protection'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'A nokrîya, however, emphasizes a foreigner without the legal protection of the gērîm.'
  - where: 'section “Only a kinsman”'
    claim: '“Take knowledge of me” in 2:10 is the verb nākar (H5234); “stranger” is nokrîyâ (H5237)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ruth.xml'
    quote: 'הַכִּירֵ֔'
  - where: 'section “Only a kinsman”'
    claim: 'The word for a foreigner comes from nākar'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/5236.htm'
    quote: 'From nakar; foreign, or (concretely) a foreigner'
  - where: 'section “Only a kinsman”'
    claim: 'At 2:13 Ruth calls herself a šipḥâ, the lowest rank of servants, below his other servants'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'describing herself as a šipḥa—a slave girl, the lowest rank of servants'
  - where: 'section “Only a kinsman”'
    claim: 'Ruth’s covenant gave her a right to a redeemer; without it she was not eligible'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'These covenants gave her access to blessings from the Lord and a right to a redeemer. Without this covenant, Ruth was not eligible for redemption.'
  - where: 'section “Only a kinsman”'
    claim: 'The duties of kinship could be extended through covenant'
    key: spackman-atonement
    url: 'https://byustudies.byu.edu/article/the-israelite-roots-of-atonement-terminology'
    quote: 'could be extended to those outside the tribe, clan, or family through covenant'
  - where: 'section “Only a kinsman”'
    claim: 'Connection made by this page: Ruth comes to her redeemer with a claim but as an outsider; her marriage tied her to Elimelech’s house (2:20; 4:5, 10) and her covenant (1:16) gave her the right to a redeemer, and the redemption (4:10–13) brings the foreign widow into the house of Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/1?lang=eng'
    quote: 'thy people shall be my people, and thy God my God'
  - where: 'section “Thine handmaid”'
    claim: '“Handmaid” at 3:9 is ʾāmâ (H519), not the šipḥâ (H8198) of 2:13'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ruth.xml'
    quote: 'אֲמָתֶ֔'
  - where: 'section “Thine handmaid”'
    claim: '“Handmaid” at 2:13 is šipḥâ (H8198)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ruth.xml'
    quote: 'שִׁפְחָתֶ֑'
  - where: 'section “Thine handmaid”'
    claim: 'The lexicon Strathearn and Cothran cite distinguishes šipḥâ (a girl serving the woman of the house) from ʾāmâ (a woman not free who could be a secondary wife)'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'while an ’āmā refers to “a woman who is not free, and who could be a man’s secondary wife.”'
  - where: 'section “Thine handmaid”'
    claim: 'BDB treats ʾāmâ at 3:9 as humble self-address'
    key: bdb
    url: 'https://biblehub.com/hebrew/519.htm'
    quote: 'in token of humility'
  - where: 'section “Thine handmaid”'
    claim: 'At 3:9 Ruth was essentially asking Boaz to marry her'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'Ruth was essentially asking Boaz to marry her'
  - where: 'section “Thine handmaid”'
    claim: '“Wings” at 2:12 is kānāp (H3671)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ruth.xml'
    quote: 'כְּנָפָֽי'
  - where: 'section “Thine handmaid”'
    claim: '“Skirt” at 3:9 is the same word, kānāp (H3671)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ruth.xml'
    quote: 'כְנָפֶ֨'
  - where: 'section “Thine handmaid”'
    claim: 'Ruth asks Boaz to be the Lord’s wings'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'Here Ruth asks Boaz to be the Lord’s wings.'
  - where: 'section “Able, and unwilling”'
    claim: '“Such a one” (peloni) is “a certain unnamed one”'
    key: bdb
    url: 'https://biblehub.com/hebrew/6423.htm'
    quote: 'a certain unnamed one'
  - where: 'section “Able, and unwilling”'
    claim: 'The Church’s footnote at 4:1 gives “Mr. So & So”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/4?lang=eng'
    quote: 'In Hebrew a manner of address to a certain unnamed person as “Mr. So & So.”'
  - where: 'section “Able, and unwilling”'
    claim: 'One older reading: the historian had not heard the name or did not think it necessary to give it'
    key: keil-ruth
    url: 'https://biblehub.com/commentaries/kad/ruth/4.htm'
    quote: 'Boaz would certainly call him by his name; but the historian had either not heard the name, or did not think it necessary to give it.'
  - where: 'section “Able, and unwilling”'
    claim: 'The kinsman did not want the land inherited by Ruth’s future sons instead of his own family'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'he did not want the land he purchased to be inherited by Ruth’s future sons instead of members of his own family'
  - where: 'section “Able, and unwilling”'
    claim: 'His means would go to Ruth’s child, not his own children, so he refused, showing his unwillingness'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'Not wanting to siphon these means away from his own children’s inheritance, the kinsman refuses his right of redemption.'
  - where: 'section “Able, and unwilling”'
    claim: 'The shoe demonstrated his unwillingness to perform the duty'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'demonstrating his unwillingness to perform the duty of the redeemer'
  - where: 'section “Able, and unwilling”'
    claim: 'His means would not go to the children he already had'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'these means would not go to the children he already had'
  - where: 'section “Able, and unwilling”'
    claim: 'Neither action was required of Boaz by law; neither man qualified under the levirate law; the nearer gōʾēl formally recused himself'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Technically, neither of these actions were required of Boaz by law.'
  - where: 'section “Able, and unwilling”'
    claim: 'Neither Boaz nor the nearer gōʾēl qualified as levirate candidates; he formally recused himself'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'he formally recused himself and passed on the responsibility to Boaz'
  - where: 'section “Able, and unwilling”'
    claim: 'The unnamed kinsman incurs no disgrace when he declines'
    key: gaskill-shoe
    url: 'https://rsc.byu.edu/our-rites-worship/ceremony-shoe-ritual-gods-ancient-covenant-people'
    quote: 'incurs no disgrace when he declines to play his part'
  - where: 'section “Able, and unwilling”'
    claim: 'The Church’s footnote at 4:6 “redeem” points to TG Selfishness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/4?lang=eng'
    quote: 'TG Selfishness'
  - where: 'section “Able, and unwilling”'
    claim: 'The 2014 seminary manual quotes Rasmussen: he said selfishly “I cannot redeem it”; the writer did not preserve his name'
    key: ot-seminary-teacher-80
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-ruth/lesson-80-ruth-3-4?lang=eng'
    quote: 'hence he said selfishly, ‘I cannot redeem it, lest I mar mine own inheritance’'
  - where: 'section “Able, and unwilling”'
    claim: 'The writer has not preserved the name of the kinsman'
    key: ot-seminary-teacher-80
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-ruth/lesson-80-ruth-3-4?lang=eng'
    quote: 'has not even preserved the name of that kinsman who was willing to redeem the property but not to marry the widow'
  - where: 'section “Able, and unwilling”'
    claim: 'Ruth’s redeemer was a righteous man both able and willing'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'the Lord put in place a righteous man who was both able and willing to serve as Ruth’s redeemer'
  - where: 'section “Able, and unwilling”'
    claim: 'Connection made by this page: the nearer kinsman had the right (kin, nearer) and the means (4:4), and the redemption still did not happen; redemption needs a third thing, willingness to pay with one’s own for another’s gain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/4?lang=eng'
    quote: 'I cannot redeem it for myself, lest I mar mine own inheritance'
  - where: 'section “Able, and unwilling”'
    claim: 'Connection made by this page: the man who would not raise up the name of the dead is left nameless, while Boaz, who paid from his own estate for another man’s name, is named in the line of David (4:21) and of Christ (Matt. 1:5); no intent is attributed to the narrator'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/4?lang=eng'
    quote: 'Salmon begat Boaz, and Boaz begat Obed'
  - where: 'section “That the name of the dead be not cut off”'
    claim: 'Boaz was willing to sacrifice his estate for Ruth, Naomi and their heritage'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'being willing to sacrifice his estate in order to support Ruth, Naomi, and their heritage'
  - where: 'section “That the name of the dead be not cut off”'
    claim: 'Boaz generously interpreted his legal responsibilities'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Once again Boaz has generously interpreted any legal responsibilities he might have had in these cases.'
  - where: 'section “That the name of the dead be not cut off”'
    claim: 'Up to 4:10 the author repeatedly emphasizes Ruth’s Moabite identity'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Up until Ruth 4:10, the author repeatedly emphasizes Ruth’s Moabite identity'
  - where: 'section “That the name of the dead be not cut off”'
    claim: '“Famous” in 4:11 and 4:14 renders phrases with šēm, “name” (H8034)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ruth.xml'
    quote: 'שְׁמ֖'
  - where: 'section “That the name of the dead be not cut off”'
    claim: '“Be famous” in 4:11 has šēm'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ruth.xml'
    quote: 'שֵׁ֖ם'
  - where: 'section “That the name of the dead be not cut off”'
    claim: 'Connection made by this page: “Moabitess” is last used in the sentence that makes her Boaz’s wife (4:10), and the elders then bless her to be like Rachel and Leah (4:11): the stranger becomes kin by being redeemed; nothing is claimed about Deut. 23:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/4?lang=eng'
    quote: 'like Rachel and like Leah, which two did build the house of Israel'
  - where: 'section “Better than seven sons”'
    claim: 'The “kinsman” of 4:14 is gōʾēl'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ruth.xml'
    quote: 'גֹּאֵ֖ל'
  - where: 'section “Better than seven sons”'
    claim: 'The name better than son or daughter shows the true inclusion of the eunuch into the household of God'
    key: belnap-outcasts
    url: 'https://rsc.byu.edu/vol-19-no-3-2018/lord-god-which-gathereth-outcasts'
    quote: 'the claim that it was even better than son or daughter indicates that it would demonstrate the true inclusion of the eunuch into the household of God'
  - where: 'section “Better than seven sons”'
    claim: 'Isaiah’s word for the stranger (56:3) is nēkār'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'נֵּכָ֗ר'
  - where: 'section “Better than seven sons”'
    claim: 'Strong’s derives nokri from neker, and nēkār from the same'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/5237.htm'
    quote: 'From neker (second form)'
  - where: 'section “Better than seven sons”'
    claim: '“Cut off” in Ruth 4:10 is yikkārēt (kārat, Niphal)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ruth.xml'
    quote: 'יִכָּרֵ֧ת'
  - where: 'section “Better than seven sons”'
    claim: '“Cut off” in Isa. 56:5 is the same form, yikkārēt'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'יִכָּרֵֽת'
  - where: 'section “Better than seven sons”'
    claim: 'Connection made by this page: Ruth 4 acts out in one family what Isa. 56:3–7 promises its two outsiders: the stranger joined to the LORD is brought into the house, and the house that had no son keeps a name that is not cut off (the same verb form, Ruth 4:10 and Isa. 56:5), better than sons (Ruth 4:15; Isa. 56:5, in meaning, not a shared Hebrew phrase); no source joins the passages, and no intent is attributed to Isaiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/56?lang=eng'
    quote: 'a name better than of sons and of daughters'
  - where: 'section “The Kinsman who was able and willing”'
    claim: 'Jesus’s role as brother in Hebrews stands within the kinsman-redeemer frame'
    key: bowen-brethren-hebrews-2
    url: 'https://rsc.byu.edu/household-god/he-not-ashamed-call-them-brethren'
    quote: 'stands within same conceptual frame work to the older Israelite-Jewish kinsman-redeemer concept'
  - where: 'section “The Kinsman who was able and willing”'
    claim: 'The 2014 seminary manual calls Boaz a type of the Savior who redeemed all without thought for His own benefit'
    key: ot-seminary-teacher-80
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-ruth/lesson-80-ruth-3-4?lang=eng'
    quote: 'Boaz is a type of the Savior, who redeemed all of mankind without thought for His own benefit'
  - where: 'section “The Kinsman who was able and willing”'
    claim: 'As Boaz redeemed his kinsman, Christ offered redemption to His kin'
    key: liahona-2026-redemption-ruth
    url: 'https://www.churchofjesuschrist.org/study/liahona/2026/06/07-the-redemption-of-ruth?lang=eng'
    quote: 'fulfilled the law to offer redemption to His kin through His great atoning sacrifice'
  - where: 'section “The Kinsman who was able and willing”'
    claim: 'Spackman reads 2 Ne. 2:3 against Ruth’s unreliable kinsman: human kinsmen not always reliable, God righteous'
    key: spackman-atonement
    url: 'https://byustudies.byu.edu/article/the-israelite-roots-of-atonement-terminology'
    quote: 'unlike human kinsman-redeemers who are not always reliable and faithful in carrying out covenantal obligations, God is righteous'
  - where: 'section “The Kinsman who was able and willing”'
    claim: 'Bowen asks what the Son’s being heir of all things means for the many sons and daughters'
    key: bowen-brethren-hebrews-2
    url: 'https://rsc.byu.edu/household-god/he-not-ashamed-call-them-brethren'
    quote: 'If a royal “son”[20] will be heir of all things (1:2) including God’s name (1:4),[21] what are the implications for “many sons and daughters”?'
  - where: 'section “The Kinsman who was able and willing”'
    claim: 'Connection made by this page: Christ meets the three conditions Ruth sets for a redeemer, kin (Heb. 2:14, 17), able (Alma 34:11–14) and willing (John 10:17–18); and where the nearer kinsman refused to let what he paid from his estate go to an heir counted to another man’s name (Ruth 4:6), Christ, heir of all things (Heb. 1:2), makes the redeemed His seed and joint-heirs (Rom. 8:17; Mosiah 15:10–11); no source joins Ruth 4:6 to these verses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/15?lang=eng'
    quote: 'these are his seed, or they are the heirs of the kingdom of God'
  - where: 'section “Brought into His house”'
    claim: 'Christ gives His name to His covenant people; a covenant creates family relationships (Mosiah 5:7–8)'
    key: lane-grand-design
    url: 'https://rsc.byu.edu/raising-standard-truth/redemptions-grand-design-both-living-dead'
    quote: 'As we become his covenant people, Christ gives us his name.'
  - where: 'section “Brought into His house”'
    claim: 'A covenant is the creation of family relationships'
    key: lane-grand-design
    url: 'https://rsc.byu.edu/raising-standard-truth/redemptions-grand-design-both-living-dead'
    quote: 'a covenant as the creation of family relationships'
  - where: 'section “Brought into His house”'
    claim: 'Connection made by this page: Mosiah 5:7–11 gives the order of Ruth’s story, covenant, then family (the name differs: in Ruth the name kept is the dead man’s, in Mosiah it is Christ’s, given to His family); in Ruth both movements meet at the gate, while in the gospel the Redeemer first comes into our family (Heb. 2:11, 14) and then brings us into His (Eph. 2:13, 19)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/5?lang=eng'
    quote: 'because of the covenant which ye have made ye shall be called the children of Christ'
  - where: 'section “Kin, in both directions”'
    claim: 'Caussé: Eph. 2:19 is a promise made to everyone who becomes a member'
    key: causse-no-more-strangers
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2013/10/ye-are-no-more-strangers?lang=eng'
    quote: 'A promise has been made to everyone who becomes a member of the Church'
  - where: 'section “Kin, in both directions”'
    claim: 'Temple work makes us like Christ in working vicariously for others; we take on His name and nature as a kinsman-redeemer'
    key: lane-grand-design
    url: 'https://rsc.byu.edu/raising-standard-truth/redemptions-grand-design-both-living-dead'
    quote: 'As we become instruments in his hands, we more fully take on Christ’s name and nature as a kinsman-redeemer.'
  - where: 'section “Kin, in both directions”'
    claim: 'We become like him in vicariously working for the redemption of others'
    key: lane-grand-design
    url: 'https://rsc.byu.edu/raising-standard-truth/redemptions-grand-design-both-living-dead'
    quote: 'because we are becoming like him in vicariously working for the redemption of others'
  - where: 'section “Kin, in both directions”'
    claim: 'Connection made by this page: Boaz’s act “to raise up the name of the dead” (4:10) is the kind of work Latter-day Saints do for their dead in the temple; Lane joins the kinsman-redeemer to the redemption of the dead but not to Ruth 4:10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/4?lang=eng'
    quote: 'to raise up the name of the dead upon his inheritance'
