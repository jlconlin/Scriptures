chapter: 2
title: Under Whose Wings
tagline: Ruth gleans in the field of Boaz, a kinsman of Elimelech, who shelters a foreigner beyond what the law required, and Naomi blesses the LORD for a redeemer.
when: 'At the beginning of barley harvest, through to the end of the wheat harvest'

setting: |
  Naomi and Ruth reached Bethlehem “in the beginning of barley harvest” ([[Ruth 1:22]]). The town that famine had emptied was now full of grain, and the two widows had none, so they turned to the provisions the law of Moses made for the poor. The chapter covers the whole season, barley and then wheat (verse 23), in one day told in detail and a summary of the weeks that followed.

  The chapter introduces Boaz, the third person in the story. Matthew names him in the line of Jesus: “Booz begat Obed of Ruth” ([[Matt. 1:5]]). The LORD is not said to act anywhere in the chapter (on the two verses of the book where the narrator says He does, see the note on [[Ruth 1:6]]). Yet His name is on every lip: in the greeting of the reapers (verse 4), in Boaz's blessing (verse 12), in Naomi's praise (verse 20). The chapter closes the book's first half. Naomi, who came home saying the LORD had brought her back empty ([[Ruth 1:21]]), ends it by blessing Him.
thread: |
  The chapter moves from need to provision, and from a stranger's hope to a widow's praise. Ruth goes out asking only for someone “in whose sight I shall find grace” (verse 2), and finds him without knowing who he is. The narrator has told the reader in verse 1, but Ruth has no idea. Neither she nor Boaz acts with an eye to what a kinsman might owe; their kindness is unforced.

  The middle of the chapter is the conversation in the field (verses 8–13). Boaz has heard what Ruth did for Naomi, and he blesses her in the LORD's name as one who has come to shelter under His wings (verse 12). The rest of the chapter shows him becoming the means of that shelter: water, a place at the meal, grain dropped on purpose (verses 14–16). In chapter 3 Ruth will ask him to spread his own “wing” over her ([[Ruth 3:9]]).

  The day ends at home. The amount of barley tells Naomi that someone has been generous, and the name tells her more. She blesses the LORD, who has not abandoned His kindness, and names Boaz as one of their redeemers (verse 20). She takes the harvest as a sign that the God she had said brought her home empty had not abandoned her after all.

sections:
  - range: 1-3
    heading: Ruth goes out to glean
    plain: |
      Naomi had a relative on her husband's side, a man of standing and wealth from Elimelech's family. His name was Boaz. Ruth the Moabite said to Naomi, “Let me go out to the fields and gather the leftover grain behind someone who will be kind to me.” Naomi said, “Go, my daughter.” So Ruth went and gathered grain in a field behind the harvesters, and it happened that the part of the field she came to belonged to Boaz, of Elimelech's family.
  - range: 4-7
    heading: Boaz asks who she is
    plain: |
      Just then Boaz arrived from Bethlehem and greeted the harvesters: “The Lord be with you.” “The Lord bless you,” they answered. Boaz asked the servant in charge of the harvesters, “Whose young woman is this?” The servant answered, “She is the Moabite woman who came back from Moab with Naomi. She asked, ‘Please let me gather among the sheaves behind the harvesters.’ She came and has kept at it from morning until now, except for a short rest in the shelter.”
  - range: 8-13
    heading: Boaz speaks to Ruth
    plain: |
      Then Boaz said to Ruth, “Listen, my daughter. Don't go to glean in any other field, and don't leave this one. Stay close to my young women. Watch which field they are harvesting and follow them. I have told the young men not to lay a hand on you. When you are thirsty, go and drink from the jars the young men have filled.” Ruth bowed down with her face to the ground and said, “Why have you been so kind as to notice me, when I am a foreigner?” Boaz answered, “I have been told everything you have done for your mother-in-law since your husband died: how you left your father and mother and the land where you were born, and came to a people you did not know before. May the Lord repay you for what you have done. May you be richly rewarded by the Lord, the God of Israel, under whose wings you have come to take refuge.” She said, “May I continue to find favor with you, my lord. You have comforted me and spoken kindly to me, though I am not even one of your servants.”
  - range: 14-17
    heading: A meal, and grain left on purpose
    plain: |
      At mealtime Boaz said to her, “Come over here. Have some bread and dip it in the vinegar.” She sat down beside the harvesters, and he handed her some roasted grain. She ate all she wanted and had some left over. When she got up to glean, Boaz told his young men, “Let her gather even among the sheaves, and don't shame her. Pull out some stalks from the bundles on purpose and leave them for her to pick up, and don't scold her.” So Ruth gleaned in the field until evening. Then she beat out what she had gathered, and it came to about an ephah of barley.
  - range: 18-23
    heading: Naomi names a redeemer
    plain: |
      She carried it back to town, and her mother-in-law saw how much she had gathered. Ruth also brought out and gave her what she had left over from her meal. Naomi asked her, “Where did you glean today? Where did you work? Blessed be the man who took notice of you!” Ruth told her whose field she had worked in: “The man I worked with today is named Boaz.” Naomi said to her daughter-in-law, “May he be blessed by the Lord, who has not stopped showing His kindness to the living and the dead.” She added, “That man is a close relative of ours, one of our redeemers.” Ruth the Moabite said, “He even told me, ‘Stay close to my workers until they have finished all my harvest.’” Naomi said to Ruth, “It is good, my daughter, for you to go out with his young women, so that no one bothers you in another field.” So Ruth stayed close to Boaz's young women and gleaned until the barley and wheat harvests were finished. And she lived with her mother-in-law.

notes:
  - ref: 1
    phrase: a kinsman of her husband’s, a mighty man of wealth
    kind: words
    title: A kinsman, and a man of worth
    body: |
      The narrator tells the reader two things about Boaz before Ruth meets him: he is family, and he is a man of substance. “Kinsman” here is *mōdaʿ*, a relative. It names a distant relative; the word *gōʾēl*, the redeeming kinsman, first comes at verse 20 and runs through chapters 3–4.

      The word behind “wealth” is *ḥayil*. Here it marks a landowner whose land gave him standing and responsibility in the town. The phrase carries a double meaning: means and character. The same word comes back when Boaz calls Ruth “a virtuous woman” ([[Ruth 3:11]]), so the poor widow and the rich landowner are described with one word.
    sources: [strathearn-ruth, bdb, muhlestein-ruth]
  - ref: 2
    phrase: glean ears of corn
    kind: history
    title: What gleaning was, and who it was for
    body: |
      Gleaning was the law's way of feeding people with no field of their own by letting them work in someone else's. A reaper's swinging arm naturally left the square corners of a field uncut; the law forbade the extra step of cutting them, and forbade going back for what fell ([[Lev. 19:9–10]]; [[Deut. 24:19]]). Those laws named the poor, the stranger, the widow and the fatherless. Ruth was poor, foreign and widowed. The provision was not a handout: it required the hard labor of following the reapers all day. It also cost the owner. Leaving grain in the field was, for the landowner, a real sacrifice, a little like an offering on the altar.

      Ruth's going out shows her readiness to work, and how poor the two women were. The site's note at [[Lev. 19:9]] has the law in full; what Boaz adds to it is at verse 16.
    sources: [muhlestein-ruth, strathearn-ruth]
  - ref: 3
    phrase: her hap was to light on a part of the field belonging unto Boaz
    kind: history
    title: 'Her hap: chance or providence?'
    body: |
      The narrator says it happened by chance. Latter-day Saint readers take this in two ways. It can be left open: whether design or providential luck, “it is unclear in the text.” Or the writer can be read as not meaning pure luck, since the story is full of such happenstances, and through them the Lord works out His purposes and pours out His kindness on the family.

      That fits how the book tells of God: the narrator never says the LORD acts in this chapter. At verse 20 it is Naomi who sees the hand of God in the turn of events.
    sources: [strathearn-ruth, muhlestein-ruth]
  - ref: 7
    phrase: that she tarried a little in the house
    kind: words
    title: A hard phrase in the servant’s report
    body: |
      The end of the servant's answer is obscure in Hebrew. Literally it reads “her dwelling in the house is (but) short.” What house is meant is uncertain; one older reading rules out Boaz's and judges that the text is probably corrupt. The Greek translators read “and rested not even a little in the field.” In the King James' sense, she worked hard from the morning and stopped only for a short rest in the shelter; the plain-words paraphrase above follows it. On any reading, what the verse says plainly stands: she asked leave, she came, and she has kept at it “from the morning until now.”
    sources: [cambridge-ruth, lxx-rahlfs, ot-minute-ruth-2]
  - ref: 9
    phrase: have I not charged the young men that they shall not touch thee?
    kind: history
    title: Protection in the field
    body: |
      Boaz's orders protect a foreign woman working alone among strangers. The verb “touch” here, and “reproach” in verse 15, carry the sense of violence, and “touch” can mean sexual assault. That Boaz forbids it in so many words shows the danger was real. Naomi says the same thing at verse 22: better that Ruth stay with Boaz's young women than be found “in any other field.”

      His other provisions are practical. She works beside his young women under his men's eye, and she may drink from the water his workers have drawn, no small thing in heavy work in a dry land.
    sources: [strathearn-ruth, muhlestein-ruth]
  - ref: 9
    phrase: drink of that which the young men have drawn
    kind: scripture
    title: A well scene turned around
    body: |
      Water drawn for a traveler from far away recalls the scenes where a future husband and wife meet at a well: Abraham's servant and Rebekah, Jacob and Rachel, Moses and Zipporah. The likeness most likely comes from the writer's use of that old pattern of storytelling, which scholars call a type-scene; the site's note at [[Gen. 29:10]] explains it. In Ruth it is turned around. The traveler is a woman coming *to* Israel, not a man going out from it, and the young men draw the water for her instead of the young women drawing it for him. The meal at verse 14 recalls the feast that ends such scenes. The pattern belongs to betrothals, and here it is a Gentile woman who comes to Israel for hers.
    sources: [sc-knowhy-854]
  - ref: 10
    phrase: seeing I am a stranger
    kind: history
    title: A foreigner, and less than a handmaid
    body: |
      Ruth names herself with a word that puts her outside Israel's protections. The King James uses “stranger” for two Hebrew words. The *gēr* was a displaced person, Israelite or Gentile, with a protected place in the community. Ruth calls herself a *nokrîyâ*, a foreigner without that legal protection, a word that stresses her otherness. At verse 13 she goes lower still. She calls herself “thine handmaid” ([[Ruth 2:13]]), *šipḥâ*, the word for a slave girl, the lowest servant, and then says she does not have even the standing of his other servants.

      The narrator keeps the point before the reader too, calling her “Ruth the Moabitess” again and again ([[Ruth 2:2]]; [[Ruth 2:21]]; [[Ruth 4:10]]). What the law of Moses said about Moabites, and how the book lets that stand beside Ruth's welcome, is at [[Ruth 1:4]]. Boaz's “spoken friendly” (verse 13) is explained at [[Isa. 40:2]].
    sources: [strathearn-ruth]
  - ref: 11
    phrase: how thou hast left thy father and thy mother, and the land of thy nativity
    kind: scripture
    title: She left as Abraham left
    body: |
      Boaz explains his kindness by what Ruth has done, and he describes it in the words of Abraham's call. The LORD told Abram, “Get thee out of thy country, and from thy kindred, and from thy father's house” ([[Gen. 12:1]]); Ruth has left father, mother and the land of her birth for “a people which thou knewest not heretofore.” Boaz's words echo that call. Read so, they set a Moabite woman, of a people long at odds with Israel, beside the patriarchs who left everything to follow God. In that reading the story is a reminder that God accepts anyone who comes to Him and keeps His commandments, whatever people they come from. Her vow on the road is at [[Ruth 1:16]].
    sources: [sc-knowhy-854, muhlestein-ruth, lds-scriptures]
  - ref: 12
    phrase: under whose wings thou art come to trust
    kind: symbol
    title: Under the LORD’s wings
    body: |
      To come under the LORD's wings is to take refuge with Him. The verb behind “trust” is *ḥāsâ*, to seek refuge, and the wings (*kānāp*) are a picture the Psalms use of the LORD protecting His people: “hide me under the shadow of thy wings” ([[Ps. 17:8]]); “under his wings shalt thou trust” ([[Ps. 91:4]]). Boaz is saying that Ruth, the foreigner, has come to Israel's God for shelter, and he asks the LORD to repay her in full.

      The blessing does not stay a wish. Boaz himself becomes part of the answer, and the image comes back at the turning point of the book: on the threshing floor Ruth will ask him to spread his *kānāp*, his “skirt” or wing, over her ([[Ruth 3:9]]). The book likens Boaz's generosity to the LORD's kindness; the note there takes up what her request meant.
    sources: [strathearn-ruth, bdb, muhlestein-ruth, welch-costly-love]
  - ref: 14
    phrase: he reached her parched corn
    kind: history
    title: A place at the meal
    body: |
      The meal gives Ruth food she had no means to prepare, and a seat among the workers. Parched grain was grain cut a little before it ripened and roasted, a tasty, high-energy food still given to harvesters at midday in parts of the Middle East to carry them through the hot afternoon. Cutting and roasting grain before the harvest was costly for the owner. Boaz hands it to her himself, and she sits not apart but “beside the reapers,” eats until she is satisfied, and keeps what is left for Naomi (verse 18).
    sources: [muhlestein-ruth, strathearn-ruth]
  - ref: 16
    phrase: let fall also some of the handfuls of purpose for her
    kind: history
    title: More than the law asked
    body: |
      The law required Boaz to leave his corners and his fallen grain; verses 15–16 go well beyond that. He lets Ruth glean “even among the sheaves,” where the cut grain lay before it was carried off, and so gives her the whole field rather than its leftovers. He tells his young men to pull stalks from their bundles on purpose and leave them for her. He tells them twice not to shame or scold her. The orders seem to have been given to his men alone, so that her work was made lighter without her knowing it.

      This is the chapter's picture of what Naomi will call kindness (verse 20). Boaz keeps the letter of the gleaning law, and then the spirit of it: living the letter of the law is often not enough to help someone in need. The kindness the book prizes, *ḥesed*, goes past what law or custom requires and gives what the other person needs (on the word, see [[Ruth 1:8]]).
    sources: [strathearn-ruth, muhlestein-ruth, welch-costly-love, ot-minute-ruth-2]
  - ref: 17
    phrase: it was about an ephah of barley
    kind: history
    title: An ephah in a day
    body: |
      An ephah of barley is about 23 liters, or some 30 pounds (13.5 kg), far more than a gleaner usually gathered in a day. At that rate, over the weeks of the barley and wheat harvests (verse 23), Ruth could have gathered food for most of a year. Naomi's first words (verse 19) seem to guess the cause from the size of the load and the food Ruth brought home: “blessed be he that did take knowledge of thee” ([[Ruth 2:19]]).
    sources: [scripture-helps-ruth-samuel, muhlestein-ruth, keil-ruth]
  - ref: 20
    phrase: who hath not left off his kindness to the living and to the dead
    kind: words
    title: Whose kindness?
    body: |
      Naomi's words are read as crediting the kindness to the LORD and seeing it reach her through Boaz: while Boaz did the kind act, the honor of it goes to God, who knew Naomi's need. Her “his” is taken as the LORD's, “who hath not abandoned his hesed,” and the phrase is like the blessing of Abraham's servant, who blesses the LORD “who hath not left destitute my master of his mercy” ([[Gen. 24:27]]). The word for kindness is *ḥesed* (see [[Ruth 1:8]], where Naomi asked the LORD to show it to Ruth and Orpah). The book shows God's *ḥesed* reaching people through the acts of others.

      “The living” are Naomi and Ruth; “the dead” are Elimelech, Mahlon and Chilion. Kindness to the dead is most likely the hope of a kinsman's marriage, through which the dead men's line could go on, as chapter 4 works out ([[Ruth 4:5]]); one older reading takes it more simply as God's care for their widows. Naomi had said the LORD had testified against her ([[Ruth 1:21]]). Now she blesses Him.
    sources: [belnap-hesed, keil-ruth, muhlestein-ruth, strathearn-ruth]
  - ref: 20
    phrase: one of our next kinsmen
    kind: christ
    title: A redeemer among the kin
    body: |
      “Next kinsmen” is *gōʾēl*, and this is the first time the word appears in the story. Boaz was already called a “kinsman” in verse 1, but with the plain word for a relative. The verb behind *gōʾēl* means to act as kinsman, to do the part of next of kin, and the part was concrete: the close relative had the responsibility to rescue family members from debts they could not pay, buying back land sold out of poverty ([[Lev. 25:25]]; see the note there) and freeing a relative sold into bondage ([[Lev. 25:47–49]]). Naomi now uses that word for Boaz. She sees in him not only food for the season but someone who could redeem two widows from their destitute condition and help with their long-term security.

      The word reaches past Boaz. In Ruth *gōʾēl* always means a human relative, but readers would easily recognize in it the LORD's own title, “the Redeemer of Israel” ([[Isa. 49:7]]). What he will do, at the threshing floor and the gate, is in chapters 3 and 4 ([[Ruth 3:9]]; [[Ruth 4:5]], where the land and the widow are joined).
    sources: [cambridge-ruth, bdb, scripture-helps-ruth-samuel, strathearn-ruth]

christ: |
  Boaz, the *gōʾēl* who shelters a foreigner and provides for two widows, is “for Christian readers, a powerful type of Christ our Redeemer, Bridegroom, and generous Friend.” In this chapter the generosity is concrete: he shares his food and water with Ruth and lets her gather from the sheaves, not only the field's leavings (verses 14–15). The book itself likens that generosity to the Lord's *ḥesed*: Boaz blesses Ruth for trusting under the LORD's “wings” (verse 12), and at the threshing floor ([[Ruth 3:9]]) he becomes “the human instrument of the divine shelter he earlier invokes.” The Redeemer type in full is at the close of [[Ruth 4]].

  God's kindness still comes the way it came to Ruth and Naomi through Boaz: not usually through divine epiphanies, but through the actions of His disciples who minister to one another.

explore: |
  - **The harvest blessing.** [[Ruth 2:4]] beside [[Ps. 129:8]], the blessing the passers-by do not give.
  - **The gleaning laws in practice.** [[Lev. 19:9–10]] and [[Deut. 24:19–22]], then verses 2, 7 and 15–16 here.
  - **A study.** “Naomi, Ruth, and Boaz: Borders, Relationships, Law, and Hesed” (*Covenant of Compassion*, Religious Studies Center, 2021) reads Boaz as a model of welcoming a refugee into a community.

