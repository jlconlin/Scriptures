chapter: 1
title: Whither Thou Goest, I Will Go
tagline: A famine drives a family of Bethlehem to Moab, where the father and both sons die. Naomi turns for home and tells her two Moabite daughters-in-law to go back; Orpah goes, and Ruth binds herself to Naomi, her people and her God.
when: 'In the days when the judges ruled'

setting: |
  The story is set “in the days when the judges ruled,” the centuries between Joshua and the first kings that [The Conquest, the Judges, and One Kingdom](/old-testament/guides/the-conquest-judges-and-kingdom/#rulers) sets out. It follows one family of Bethlehem through a famine, ten years in Moab, three deaths and a return, and it ends with a child who will be David’s grandfather ([[Ruth 4:17]]). In the English Bible, as in the Greek and Latin, Ruth follows Judges; in the Hebrew Bible it stands apart, among the Writings.

  Who wrote the book, and when, is not known. It seems meant to connect David’s history with the earlier times, and to set its “peaceful and pastoral simplicity” against the disorders of Judges. Because David’s genealogy is included, the book “may have been written after David’s or Solomon’s time,” perhaps after the exile, when some held that Israel should separate itself from every foreign people; beside that belief, a faithful woman of Moab as David’s great-grandmother teaches that faithfulness matters more than ethnicity. The Hebrew has both earlier and later features, so the present text may be a later telling of an older story. None of this makes the people less real: the writer’s skill takes nothing from “the reality of Ruth’s, Naomi’s, and Boaz’s lives.”

thread: |
  Chapter 1 empties Naomi. A famine drives the family out of Bethlehem, whose name means “house of bread.” In Moab her husband dies, then both her sons, and she is left with two foreign daughters-in-law and no grandchild. She gives the verdict herself at the end: “I went out full, and the LORD hath brought me home again empty” (verse 21). The rest of the book fills her again.

  Two things in this chapter already work against that verdict. The narrator names the LORD acting in only two verses of the book, and the first is here: He “visited his people in giving them bread” (verse 6); the other is the son of [[Ruth 4:13]]. And Naomi, unable to show it herself, asks the LORD to show *ḥesed*, covenant kindness, to the two women who have shown it to her (verse 8). In this story His kindness comes through people who minister to one another, and here it is Ruth who ministers to Naomi. She will not go back. She binds herself with an oath to Naomi, her people and her God, and the two women come to Bethlehem as the barley harvest begins.

sections:
  - range: 1-5
    heading: Famine, Moab and three graves
    plain: |
      In the days when the judges ruled, there was a famine in the land, and a man of Bethlehem in Judah went to live for a while in the country of Moab, with his wife and his two sons. The man was Elimelech, his wife was Naomi, and his sons were Mahlon and Chilion, Ephrathites of Bethlehem in Judah. They came to Moab and stayed. Then Elimelech, Naomi’s husband, died, and she was left with her two sons. They married Moabite women, one named Orpah and the other Ruth, and they lived there about ten years. Then Mahlon and Chilion died too, and Naomi was left without her two sons and without her husband.
  - range: 6-14
    heading: Go, return each to her mother’s house
    plain: |
      In Moab Naomi heard that the LORD had come to the help of His people and given them bread, so she set out with her daughters-in-law to go back. As they went on the road toward Judah, Naomi said to them, “Go back, each of you, to your mother’s house. May the LORD show you kindness, as you have shown it to the dead and to me. May the LORD grant that each of you find rest in the house of a husband.” She kissed them, and they wept aloud. “No,” they said, “we will go back with you to your people.” But Naomi said, “Turn back, my daughters. Why would you come with me? Have I any more sons in my womb who could become your husbands? Turn back, my daughters, go; I am too old to have a husband. Even if I said I had hope, even if I had a husband tonight and bore sons, would you wait for them to grow up? Would you shut yourselves away from marrying for them? No, my daughters. It is very bitter for me, for your sakes, that the hand of the LORD has gone out against me.” They wept aloud again. Then Orpah kissed her mother-in-law goodbye, but Ruth held fast to her.
  - range: 15-18
    heading: Thy people shall be my people
    plain: |
      Naomi said, “Look, your sister-in-law has gone back to her people and to her gods. Go back with her.” But Ruth said, “Do not urge me to leave you or to turn back from following you. Where you go, I will go, and where you stay, I will stay. Your people will be my people, and your God my God. Where you die, I will die, and there I will be buried. May the LORD do so to me, and more, if anything but death parts you and me.” When Naomi saw that Ruth was determined to go with her, she said no more.
  - range: 19-22
    heading: Call me Mara
    plain: |
      So the two of them went on until they came to Bethlehem. When they arrived, the whole town was stirred by them, and the women said, “Is this Naomi?” She answered, “Do not call me Naomi, Pleasant. Call me Mara, Bitter, for the Almighty has made my life very bitter. I went away full, and the LORD has brought me back empty. Why call me Naomi, when the LORD has testified against me and the Almighty has brought calamity on me?” So Naomi came back, and with her Ruth the Moabite, her daughter-in-law, who came back from the country of Moab. They arrived in Bethlehem at the beginning of the barley harvest.

notes:
  - ref: 1
    phrase: went to sojourn in the country of Moab
    kind: history
    title: Refugees from the famine
    body: |
      Elimelech’s family went to Moab as refugees from a famine, as Abraham had gone down into Egypt when “the famine was grievous in the land” ([[Gen. 12:10]]), and Jacob after him. Famines were frequent in the biblical world, and they often set families moving in search of food and of pasture for their flocks. Moab, east of the Dead Sea, had apparently escaped this one. The Moabites were descendants of Lot ([[Gen. 19:37]]); their country is on the map in [The Land](/old-testament/guides/the-land/#neighbors).

      Was it wrong to go? The text does not say so, and it gives no cause for the deaths that follow. There is no evidence that the writer thought badly of the move. The people of Moab, it seems, gave this refugee family a home for more than ten years (verse 4).
    sources: [strathearn-ruth, scripture-helps-ruth-samuel, lds-scriptures]

  - ref: 4
    phrase: they took them wives of the women of Moab
    kind: history
    title: Moabite wives
    body: |
      Both sons married Moabite women, though the law of Moses kept the Moabite out of Israel’s assembly: “An Ammonite or Moabite shall not enter into the congregation of the LORD; even to their tenth generation shall they not enter into the congregation of the LORD for ever” ([[Deut. 23:3]]). The book never mentions the law and never explains how the two fit together. What it does is keep Ruth’s origin in front of the reader. She is “Ruth the Moabitess” as she arrives in Bethlehem (verse 22) and again and again after that ([[Ruth 2:2]]; [[Ruth 2:21]]; [[Ruth 4:5]]; [[Ruth 4:10]]).

      On one reading, the book’s interest is in the blessings of the Abrahamic covenant reaching the Moabites, long Israel’s uneasy neighbors, and so it portrays “a social reality that is not envisioned in Deuteronomy.” The note at [[Deut. 23:3]] gives the rest. For now the marriages end in loss. They lasted about ten years and, it seems, produced no children, so that Ruth and Orpah, like Naomi, are left widowed and childless.
    sources: [lds-scriptures, strathearn-ruth]

  - ref: 6
    phrase: the LORD had visited his people in giving them bread
    kind: history
    title: The LORD visited his people
    body: |
      The famine ends because the LORD ends it. Here the narrator names Him acting, one of only two verses in Ruth that do; the other is [[Ruth 4:13]], where “the LORD gave her conception.” Elsewhere the LORD is named by the characters, in blessings, oaths and complaints (verses 8, 17, 20), and His kindness reaches them not through visions but through what people do for one another.

      The bread comes back to Bethlehem, whose name means “house of bread.” Naomi left the house of bread in a famine, and she turns home when God’s favor has brought bread back to the land.
    sources: [strathearn-ruth, bd-bethlehem, ot-minute-ruth-1, lds-scriptures]

  - ref: 8
    phrase: the LORD deal kindly with you, as ye have dealt with the dead, and with me
    kind: words
    title: 'Deal kindly: ḥesed'
    body: |
      Naomi asks the LORD to do for her daughters-in-law what she can no longer do herself: show them *ḥesed*. “Deal kindly” translates that word, which describes a quality of God and has no easy English equivalent. The King James renders it kindness, mercy, goodness and more, and none of these quite catches its covenant sense (the word is explained at [[Gen. 24:12]]). Here a widow of Israel asks it for two Moabite women outside that covenant. Her reason is that they have already shown it, to their husbands and to her. She asks it for Orpah as well as for Ruth.

      In Ruth’s case the LORD will answer the prayer, through the acts of a man, Boaz. The word comes three times in the book: here, at [[Ruth 2:20]] and at [[Ruth 3:10]]. It names the acts of Ruth and of God outright, and Boaz’s by implication.
    sources: [strathearn-ruth, muhlestein-ruth, belnap-hesed]

  - ref: 9
    phrase: that ye may find rest, each of you in the house of her husband
    kind: words
    title: Rest in the house of a husband
    body: |
      The “rest” Naomi wishes them is a husband’s household. The Hebrew *mǝnûḥâ* here means “security.” Women in ancient Israel relied, with rare exceptions, on their fathers and then their husbands for support. Naomi uses a related word when she sets out to find that rest for Ruth herself, “shall I not seek rest for thee” ([[Ruth 3:1]]); there it means freedom from the anxiety of an exile, or of a widow with no family.

      Her prayer has a second echo: the verb of “The LORD grant you” returns when “the LORD gave her conception” (see the note on [[Ruth 4:13]]).
    sources: [strathearn-ruth, muhlestein-ruth, oshb-wlc]

  - ref: 11
    phrase: are there yet any more sons in my womb, that they may be your husbands?
    kind: history
    title: Sons in my womb
    body: |
      Naomi’s argument assumes the custom that a dead man’s brother marries his widow ([[Deut. 25:5]]). She has no more sons, she is too old to marry and bear them, and even if she bore sons that night the two women could not wait for them to grow up. The custom, and whether the book applies it to a more distant kinsman, are taken up at [[Ruth 4:5]].

      In this chapter, though, Naomi’s concern with sons is not to keep a father’s house going but to provide for widowed mothers. Her sons would have supported her after her husband died; when they died too, she was left without anyone to support her, and vulnerable.
    sources: [ot-minute-ruth-1, strathearn-ruth]

  - ref: 14
    phrase: Orpah kissed her mother in law; but Ruth clave unto her
    kind: history
    title: Orpah’s kiss and Ruth’s cleaving
    body: |
      Orpah does what Naomi asked; Ruth does more. Naomi has urged them three times to go home (verses 8, 11, 12), and Orpah’s kiss is her farewell. The narrative does not put Orpah in a bad light: “Orpah’s goodness is contrasted with Ruth’s greatness.” Naomi had freely released both women, and on that ground Orpah’s choice to go home has been called “an honorable one.” Nothing in the text says Naomi took back the blessing she had asked on her (verse 8).

      Ruth “clave unto her” (on the word, see [[Ps. 63:8]]). The same verb describes the bond of husband and wife: a man “shall cleave unto his wife” ([[Gen. 2:24]]). What it cost her is plain from what Naomi has just said. Staying seemed to mean no new marriage and no children, so Ruth took on herself the lonely old age Naomi was facing. In one reading, taking that lonely future on herself is an emulation of the Savior, and the emulation is not an accidental message of the story but “one of its main themes.”
    sources: [muhlestein-ruth, welch-costly-love, strathearn-ruth]

  - ref: 16
    phrase: thy people shall be my people, and thy God my God
    kind: history
    title: Thy God my God
    body: |
      Ruth’s words mark her conversion. The story “beautifully illustrates the conversion of a non-Israelite into the fold of Israel,” as she gives up her former god to serve the God of Israel. Two verses show her conversion: this one, and [[Ruth 2:12]], where Boaz blesses her as one who has come to trust under the wings of the LORD God of Israel. She chose to follow Jehovah, and in the end she was fully accepted as an Israelite.

      What the verse does not say is how. Her conversion is not in doubt, though what covenant or rite went with it is not known. Conversion in today’s sense is “probably anachronistic” here. The Hebrew Bible shows little of how a Gentile joined Israel, and no set rite for women is known until much later; a wife was presumed to take her husband’s god, as Ruth may already have done when she married Mahlon.

      Her words reach beyond religion. She takes Naomi’s road, her lodging, her people and her grave. In doing so she takes up a covenant daughter’s duty: to worship Naomi’s God, and to care for Naomi as a daughter cares for her mother.
    sources: [bd-ruth, ot-manual-judges-13-21, scripture-helps-ruth-samuel, muhlestein-ruth, strathearn-ruth]

  - ref: 17
    phrase: the LORD do so to me, and more also, if ought but death part thee and me
    kind: history
    title: The LORD do so to me
    body: |
      Ruth seals her promise with an oath in the name of Israel’s God. She calls on the LORD to deal with her, and worse, if anything but death parts them. In ancient Israel an oath was weighty enough that breaking it “could literally become a matter of life and death,” and oaths sworn in God’s name were often accompanied by threats of divine curses on the one who broke them. Ruth’s “the LORD do so to me, and more also” is an oath of that kind.

      The Moabite woman swears by the LORD, not by the gods Orpah has gone back to (verse 15). Her oath turns a promise into a bond, “both an emotional and a legal attachment between the two women,” and Naomi hears it and stops arguing (verse 18).
    sources: [sc-knowhy-98, ot-minute-ruth-1, strathearn-ruth]

  - ref: 20
    phrase: Call me not Naomi, call me Mara
    kind: words
    title: Naomi and Mara
    body: |
      Naomi renames herself by a play on her own name: Naomi is “pleasant,” and Mara is “bitter.” Her reason uses the same Hebrew verb, *mārar*, “to be bitter.” “The Almighty hath dealt very bitterly with me” is, more literally, the Almighty “has made it very bitter for me,” and the lexicon sets it beside Job’s complaint in [[Job 27:2]], which it renders “Shadday, who hath embittered my soul.” She had already used the word on the road. “It grieveth me much for your sakes” (verse 13) is in Hebrew “it is very bitter to me on your account.” (On “the Almighty,” see [[Gen. 17:1]].)

      Is she accusing God? Her reply “was not an accusation,” only her way of saying how much she had suffered in Moab. It is also the cry of “Job-like anguish,” a woman struggling to understand why a God of *ḥesed* had brought this on her. The story leaves her complaint unanswered for now. The answer comes later, when Naomi herself blesses the LORD in [[Ruth 2:20]], and when the women of Bethlehem bless Him in [[Ruth 4:14]].
    sources: [ot-manual-judges-13-21, bdb, oshb-wlc, strathearn-ruth, muhlestein-ruth]

  - ref: 21
    phrase: I went out full, and the LORD hath brought me home again empty
    kind: structure
    title: Out full, home empty
    body: |
      Naomi’s “full” and “empty” are the measure of the whole book. She left Bethlehem with a husband and two sons and comes home without them. The rest of the story shows the empty Naomi filled again. The famine she fled gives way to harvest, and the book ends with a son “born to Naomi” laid in her bosom ([[Ruth 4:16–17]]). The book is a journey “from emptiness to fulness.”

      The chapter’s last verse already points that way. The two women come to Bethlehem “in the beginning of barley harvest,” the spring harvest of April and May, with the wheat a few weeks behind it. Coming home at harvest suggests that Naomi has arrived at a time when she can be filled again. The fields of that harvest are the scene of chapter 2 (gleaning is explained at [[Ruth 2:2]]).
    sources: [ot-minute-ruth-1, strathearn-ruth, ot-seminary-intro-ruth]

christ: |
  The LORD of this chapter, who visits His people with bread and in whose name Ruth swears, is Jehovah, the premortal Jesus Christ ([[Ex. 3:14]]). The Church reads Ruth as a book of redemption: a foreign widow with no support chose to follow Jehovah, and the Redeemer of the world was her descendant ([[Matt. 1:5]]). Ruth herself, taking Naomi’s lonely future on herself, has been read as an emulation of the Savior (see the note on verse 14).

  God’s *ḥesed* does not take trials away, but it is always available; in this chapter it reaches Naomi through Ruth, who will not leave her.

