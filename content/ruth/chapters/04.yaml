chapter: 4
title: A Son Born to Naomi
tagline: At the gate of Bethlehem the nearer kinsman gives up his right, and Boaz redeems Elimelech’s land and takes Ruth as his wife before the elders. The LORD gives her a son, the women call him Naomi’s redeemer, and the book ends with the line to David.
when: 'The next morning, at the gate of Bethlehem'

setting: |
  The chapter follows the night on the threshing floor into the next morning. Ruth has asked Boaz to act as her redeemer, and he has promised to, if the nearer kinsman will not ([[Ruth 3:12–13]]). Naomi expects him to settle it the same day ([[Ruth 3:18]]), and her confidence is well placed: in her mind “there is no doubt that once Boaz has set his mind to doing this thing, it will be accomplished in short order.”

  Boaz now moves to the center of the story, and what he does at the gate is unusual. He acts as redeemer “with a combination of legal customs that are usually discussed separately”: he buys back the family’s land, and he marries the dead man’s widow to raise up his name.

  The chapter also finishes what the book appears to have been written for: to “connect the history of David with the earlier times.” It closes with a son, Obed, who is “the father of Jesse, the father of David” ([[Ruth 4:17]]), and a genealogy from Pharez to David. Matthew and Luke carry the same names into the genealogy of Jesus ([[Matt. 1:5]]; [[Luke 3:32]]). When and by whom the book was written is discussed at [[Ruth 1:1]].

thread: |
  Naomi went out full and came home empty ([[Ruth 1:21]]), and this chapter fills her again. The story traces “a hopeful arc from emptiness to fullness,” and here it arrives: Elimelech’s field is redeemed, Ruth is married, and Naomi holds a grandson while the women bless the LORD for her redeemer (verses 14–17).

  The redemption comes in two steps. The nearer kinsman holds the first right and gives it up when he learns that Ruth comes with the land (verses 3–8). Boaz takes both, though “Technically, neither of these actions were required of Boaz by law.” Then the LORD acts, giving Ruth conception (verse 13), and His *ḥesed*, His covenant kindness, “pervades the story.” In one Latter-day Saint reading, the women’s praise shows that the Lord kept His covenant kindness “by the hesed of others, most especially Ruth.”

  The last verses widen the frame from one family to a king. The child of a Moabite widow and a man of Bethlehem is David’s grandfather, and the book ends with David’s name.

sections:
  - range: 1-8
    heading: The nearer kinsman gives up his right
    plain: |
      Boaz went up to the town gate and sat down there, and just then the kinsman he had spoken of came by. Boaz called to him, “Come over here, friend, and sit down,” and he came and sat. Boaz took ten of the town’s elders and said, “Sit down here,” and they sat. Then he said to the kinsman, “Naomi, who has come back from the country of Moab, is selling the piece of land that belonged to our relative Elimelech. I thought I should tell you: buy it in front of those sitting here and the elders of my people. If you will redeem it, redeem it. If you will not, tell me, so that I know, for no one but you has the right to redeem it, and I come after you.” He said, “I will redeem it.” Boaz said, “On the day you buy the field from Naomi, you must also buy it from Ruth the Moabitess, the dead man’s widow, to keep the dead man’s name on his inheritance.” The kinsman said, “Then I cannot redeem it for myself, or I would harm my own inheritance. Take my right of redemption for yourself, for I cannot redeem it.” In earlier times in Israel this was how a redemption or an exchange was made final: a man took off his sandal and gave it to the other, and that was the way of attesting it in Israel. So the kinsman said to Boaz, “Buy it for yourself,” and he took off his sandal.
  - range: 9-12
    heading: Boaz redeems before witnesses
    plain: |
      Boaz said to the elders and to all the people, “You are witnesses today that I have bought from Naomi everything that belonged to Elimelech, Chilion and Mahlon. I have also acquired Ruth the Moabitess, Mahlon’s widow, to be my wife, to keep the dead man’s name on his inheritance, so that his name will not be cut off from among his kin or from the gate of his town. You are witnesses today.” All the people at the gate and the elders said, “We are witnesses. May the LORD make the woman who is coming into your house like Rachel and Leah, the two who built the house of Israel. May you do well in Ephratah and be renowned in Bethlehem. And through the children the LORD gives you by this young woman, may your house be like the house of Pharez, whom Tamar bore to Judah.”
  - range: 13-17
    heading: A son for Naomi
    plain: |
      So Boaz took Ruth, and she became his wife. He went in to her, the LORD gave her conception, and she bore a son. The women said to Naomi, “Blessed be the LORD, who has not left you today without a redeemer. May his name be renowned in Israel. He will bring your life back and sustain you in your old age, for your daughter-in-law who loves you, who is better to you than seven sons, has borne him.” Naomi took the child, held him to her breast, and cared for him. The women who were her neighbors gave him a name, saying, “A son has been born to Naomi.” They named him Obed. He was the father of Jesse, the father of David.
  - range: 18-22
    heading: From Pharez to David
    plain: |
      These are the descendants of Pharez. Pharez was the father of Hezron, Hezron of Ram, Ram of Amminadab, Amminadab of Nahshon, Nahshon of Salmon, Salmon of Boaz, Boaz of Obed, Obed of Jesse, and Jesse of David.

notes:
  - ref: 1
    phrase: behold, the kinsman of whom Boaz spake came by
    kind: history
    title: The kinsman comes by
    body: |
      The nearer kinsman passes just as Boaz sits down, and the narrator’s “behold” marks the timing. One Latter-day Saint reading takes it as the Lord’s doing: the writer “did not intend for us to think of this fortuitous meeting between Boaz and Naomi’s nearest relative as coincidence,” but shows the Lord bringing “the right person to the right place.” The text names no cause. It puts the man on the road at the hour Boaz needs him and leaves the reader to notice.

      The place was chosen for the business. The gate of a town “functioned as the town square,” where legal and business transactions were done and “witnesses were readily available” (see [[Josh. 20:4]]). So Boaz has ten elders sit down with him, to serve “as witnesses and judges” (verse 2). Whatever is settled here is settled in public, and in verse 11 the people at the gate say so.
    sources: [muhlestein-ruth, ot-minute-ruth-4]

  - ref: 3
    phrase: selleth a parcel of land, which was our brother Elimelech’s
    kind: history
    title: What land Naomi had
    body: |
      This is the first time in the story that Naomi’s land is mentioned, and the book does not explain why a widow with a field had to send her daughter-in-law out to glean. Naomi apparently still owned the land but was not receiving a harvest from it. Perhaps Elimelech had sold its use before leaving for Moab, perhaps he had left it with a relative to look after, or perhaps it had simply not been planted; “the author does not give any details.” Without its harvest the two women had to live on the law’s provisions for the poor. How the field came to be hers is less uncertain: it appears that her sons inherited it from their father and, dying without heirs, left it to her, which is why Boaz buys “all that was Elimelech’s, and all that was Chilion’s and Mahlon’s, of the hand of Naomi” ([[Ruth 4:9]]).

      What *selleth* means depends on what had become of the field. If Naomi needed money to live on, the kinsman’s part was to buy the field so that it stayed in the family and she had something to live on. If Elimelech had sold it before he left, the kinsman would buy it back for Elimelech’s family. Either way the law behind it is [[Lev. 25:25]]: ancestral land “was to remain within the family,” and when poverty forced a sale a relative redeemed it. Jeremiah later redeems his cousin’s field under the same law (see [[Jer. 32:7]]).
    sources: [strathearn-ruth, ot-minute-ruth-4]

  - ref: 4
    phrase: I thought to advertise thee
    kind: words
    title: 'Advertise: uncover thine ear'
    body: |
      *Advertise* translates a Hebrew idiom, literally *I will uncover thine ear*, which means to reveal something to a person. The same idiom is used when the LORD tells Samuel in his ear that Saul is coming ([[1 Sam. 9:15]]). Boaz is letting the kinsman know, in front of the elders, that the field is for sale and that the first right is his. Then he puts the choice plainly: redeem it or say that you will not, because Boaz is next in line.
    sources: [bdb, oshb-wlc]

  - ref: 5
    phrase: thou must buy it also of Ruth the Moabitess, the wife of the dead
    kind: history
    title: Land and widow together
    body: |
      Boaz ties the field to Ruth, and through her to the purpose of the law of a widow’s marriage: to raise up the name of the dead upon his inheritance, words that recall [[Deut. 25:6]]. That law, of levirate marriage, lays the duty on a husband’s brother, and neither Boaz nor the nearer kinsman is Mahlon’s brother. The scene is still read as levirate. Levirate marriage is the custom of a widow marrying her husband’s brother “or sometimes a near heir,” and it “forms a major aspect of the story of Ruth”; the nearer kinsman’s right came “according to the law in Deut. 25:5–10.” Apparently the duty “could apply to relatives beyond immediate brothers.” Ruth is the one book that joins the kinsman redeemer to the levirate law, and so the evidence that the two went together: “It is from the book of Ruth we learn that levirate marriage and the right of redemption were connected.” Boaz redeems in both ways, by buying Elimelech’s land and by marrying Ruth.

      Reading it that way also shows how generous Boaz was. The law speaks of brothers who “dwell together” ([[Deut. 25:5]]), and by that wording it appears that neither man qualified. Boaz “generously interpreted any legal responsibilities he might have had” and took on more than the law laid on him. One Latter-day Saint study argues that the scene is more likely a property ceremony than a levirate marriage (see the notes on verses 7 and 18). The custom itself is described in [Women and marriage in the Old Testament](/old-testament/guides/women-and-marriage/#levirate-marriage).
    sources: [bd-levirate-marriage, bd-ruth, scripture-helps-ruth-samuel, muhlestein-ruth, strathearn-ruth]

  - ref: 6
    phrase: lest I mar mine own inheritance
    kind: history
    title: Why the nearer kinsman declined
    body: |
      The kinsman says only that he would mar his inheritance; the likely reason turns on heirs and money. He has already agreed to buy the field, and “It is only after the kinsman has agreed to buy land that Boaz informs him that with the land comes the care of both Naomi and Ruth.” A son by Ruth would count as Elimelech’s heir, and so would be a child “who would eventually take Naomi’s land inheritance away from his family.” The price of the field would come out of the kinsman’s own estate, while the land would pass to Ruth’s son, not to his own children.

      He hands his right to the next in line: redeem thou my right to thyself. Boaz takes it, “being willing to sacrifice his estate in order to support Ruth, Naomi, and their heritage.”
    sources: [muhlestein-ruth]

  - ref: 7
    phrase: Now this was the manner in former time in Israel
    kind: history
    title: The shoe
    body: |
      The narrator stops the story to explain a custom of former time. To make a redemption or an exchange binding, a man took off his shoe and gave it to the other party, and that was the testimony. Latter-day Saint sources read the shoe as a sign of a right in property. Handing it over “asserted the giver was offering their property rights to the recipient”; a man giving up rights in property “removed a sandal and presented it to the new property holder,” and the elders’ witness made it binding. The foot stood for possession, as in the promise of every place “that the sole of your foot shall tread upon” ([[Josh. 1:3]]), and so “the shoe served as the perfect symbol of the right of possession.”

      Another reading starts from the shoe on the foot: at the Passover Israel ate with shoes on ([[Ex. 12:11]]), and wearing shoes “denotes a readiness, a preparation to do what needs to be done,” so a shoe taken off marks a duty declined. That reading was made of [[Deut. 25:9]], and the note there gives it in full.

      The scene here differs from Deuteronomy’s. The kinsman takes off his own shoe, no one spits, and no shame is named. Those differences lead one Latter-day Saint study to conclude that, though the scene is commonly taken as a levirate marriage, the rite here is likely “a prime example of the ceremony of the shoe”: the giving up of a right of possession described above. The note on [[Deut. 25:9]] sets the two passages side by side.
    sources: [ot-minute-ruth-4, ot-manual-judges-13-21, gaskill-shoe, muhlestein-ruth]

  - ref: 10
    phrase: Ruth the Moabitess, the wife of Mahlon, have I purchased to be my wife
    kind: history
    title: Ruth taken as wife before the elders
    body: |
      Boaz uses one verb for the field and for Ruth. “Bought” in verse 9 and “purchased” in verse 10 are both the Hebrew *qānâ*, to acquire. The word belongs to a public transaction in which the rights to Elimelech’s land and the rights to his daughter-in-law, who might bear him an heir, passed together from one kinsman to another. But Boaz names his purpose: “to raise up the name of the dead upon his inheritance, that the name of the dead be not cut off from among his brethren” ([[Ruth 4:10]]), the aim the levirate law gives, that a dead man’s name “be not put out of Israel.”

      He also calls her what the narrator has called her all along: Ruth the Moabitess. Until this verse the book keeps calling her a Moabite, and she called herself a stranger ([[Ruth 2:10]]). Now the Moabitess is declared Boaz’s wife before the elders and all the people, and in marrying again she was “fully accepted as an Israelite.” How that fits the law of [[Deut. 23:3]] is discussed at [[Ruth 1:4]].
    sources: [oshb-wlc, gaskill-shoe, strathearn-ruth, scripture-helps-ruth-samuel]

  - ref: 11
    phrase: like Rachel and like Leah, which two did build the house of Israel
    kind: scripture
    title: The blessing at the gate
    body: |
      The witnesses answer Boaz with a blessing whose first wish is for children. In one older reading “The blessing desired is the greatest blessing of marriage”: that Ruth be like the two sisters who built Israel (the verb *build* is explained at [[Gen. 30:3]]), and that Boaz do well in Ephratah and make a name in Bethlehem. The same reading takes that second wish to mean that he “get power” there “by begetting and training worthy sons and daughters.”

      The house of Pharez is named because Boaz’s family came from him. Pharez was the son “whom Tamar bare unto Judah” ([[Ruth 4:12]]; see [[Gen. 38:29]]). The book answers the blessing itself: the genealogy at its close, from Pharez to David (verses 18–22), is where the elders’ wish comes true.
    sources: [keil-ruth, strathearn-ruth, lds-scriptures]

  - ref: 13
    phrase: the LORD gave her conception
    kind: words
    title: The LORD gave her conception
    body: |
      Here, for the second and last time, the narrator says that the LORD acted; the first was when He gave His people bread (see the note on [[Ruth 1:6]]). Ruth had been married about ten years in Moab and had apparently borne no child.

      The verb is the one Naomi used on the road from Moab: “The LORD grant you that ye may find rest, each of you in the house of her husband” ([[Ruth 1:9]]). *Grant* there and *gave* here are the same Hebrew verb, *nātan*. Read that way, the verse answers Naomi’s prayer of the first chapter: Ruth has found rest in the house of a husband, and the LORD has given it.
    sources: [strathearn-ruth, muhlestein-ruth, oshb-wlc]

  - ref: 14
    phrase: which hath not left thee this day without a kinsman
    kind: words
    title: A redeemer for Naomi
    body: |
      The “kinsman” the women praise the LORD for is a *gōʾēl*, a redeemer (the word is explained at [[Ruth 2:20]]), and the verse does not say plainly who he is. Read one way he is Boaz, and on that reading this is one of the verses where the King James “kinsman” for Boaz translates *gōʾēl*. In an older reading he is the newborn child instead: “This redeemer was not Boaz, but the son just born,” for as Ruth’s son he counted as Naomi’s, and he would take away her childlessness, comfort her, and care for her in her old age.

      Verse 15, at least, speaks of the child Ruth has borne, and says what his coming means for Naomi. *A restorer of thy life* means one who refreshes the soul: the boy will be “a refresher of the soul, and a nourisher of thine old age.” The woman who said the LORD had brought her home empty ([[Ruth 1:21]]) now has her life brought back.

      The praise ends with Ruth. In Hannah’s song the barren bears seven ([[1 Sam. 2:5]]), and seven sons stood for “a large number of sons of a mother whom God has richly blessed with children”; the women tell Naomi that Ruth, who loves her, is worth more to her than that.
    sources: [strathearn-ruth, keil-ruth, bdb]

  - ref: 17
    phrase: There is a son born to Naomi
    kind: history
    title: A son born to Naomi
    body: |
      The son is Ruth’s and Boaz’s, yet the women of the town name him as Naomi’s. Naomi takes the child into her bosom and becomes his nurse (verse 16), and in one older reading “Naomi therefore adopted this grandson as her own child.” His name, Obed, means “Servant,” and the same reading takes it as given “with reference to what he was to become to his grandmother”: the one who would care for her.

      For Naomi this answers the beginning of the book. The emptiness of her return to Bethlehem gives way to “the fulness that she experiences when Ruth gives birth to Obed,” and through that birth “God’s ḥesed was indeed poured out upon her.”
    sources: [keil-ruth, bd-obed, strathearn-ruth]

  - ref: 18
    phrase: Now these are the generations of Pharez
    kind: scripture
    title: From Pharez to David
    body: |
      The book ends with a genealogy that leads to David. It “appears to be intended to connect the history of David with the earlier times,” and its last word is David.

      The list bears on two points in the story. First, it counts Obed as the son of Boaz ([[Ruth 4:21]]), not of Mahlon, though verse 10 spoke of raising up the dead man’s name. A levirate son was counted the dead husband’s, and one Latter-day Saint study takes this as a sign that the marriage was not a levirate marriage in the strict sense (see the note on verse 7). Second, read with the story before it, it places a Moabite woman among David’s ancestors: through the marriage, King David and Jesus descend from both Israel and Moab.

      The New Testament keeps the line: “Salmon begat Booz of Rachab; and Booz begat Obed of Ruth” ([[Matt. 1:5]]), and Luke names Booz and Obed ([[Luke 3:32]]). Why Matthew names Ruth among four women is discussed at [[Gen. 38:29]]. David was “born into a context of ḥesed as a descendant of Ruth and Boaz, two models of loving-kindness.”
    sources: [bd-ruth, gaskill-shoe, strathearn-ruth, taggart-sworn-david, lds-scriptures]

christ: |
  The chapter ends in the family of the Redeemer. Redemption is the book’s central theme, and “Jesus Christ, the Redeemer of the world, was a direct descendant of Ruth.” In one Latter-day Saint reading, Ruth was redeemed, first, because she chose to enter a covenant with Naomi and with the Lord. Her conversion is plain in “thy God my God” ([[Ruth 1:16]]), though what covenant or rite went with it is not known; only close family could act as redeemer, but where no family tie existed a covenant could create one, so her covenant gave her “a right to a redeemer,” and once she had made it, “Boaz was obligated to redeem her.” On that reading the obligation came from the covenant, not from the law: the law did not require the purchase or the marriage of him (see the thread above).

  She was redeemed also because the Lord built into His plan for Israel a way “to deliver those who could not deliver themselves,” and because a righteous man was “both able and willing to serve as Ruth’s redeemer.” “It is not coincidence that our Redeemer descended from a line of redemption.” One Latter-day Saint study applies Alma’s words to these events: they happened “in a manner that thereby the people might know in what manner to look forward to his Son for redemption” ([[Alma 13:2]]).

  Boaz the *gōʾēl* is the type of Christ the Redeemer introduced at the close of [[Ruth 2]]. The theme page [Thou Art a Near Kinsman](/ruth/themes/near-kinsman/) argues from this chapter that the nearer kinsman had the right and the means but not the will, that Ruth is last called “the Moabitess” in the sentence that redeems her, and that Christ does what the nearer kinsman would not, sharing His inheritance with those who are not heirs in their own right.

  Like Ruth, a disciple cannot redeem herself or himself, and relies on a Redeemer from Bethlehem, who lifts the fallen into His own family. His kindness still reaches people usually “through the actions of his disciples who minister to one another,” as Ruth, Naomi and Boaz ministered to each other.

explore: |
  - **Redeeming a field.** [[Lev. 25:23–28]]; [[Jer. 32:6–15]].
  - **The LORD as Israel’s Redeemer.** [[Isa. 41:14]]; [[Isa. 54:5]]; [[Job 19:25]].
  - **The line to Christ.** [[1 Chr. 2:9–15]]; [[Matt. 1:1–6]].
  - **The story as a type of Christ.** “Ruth, Redemption, Covenant, and Christ,” a Religious Studies Center study, reads the whole story closely and finds that numerous elements of the story serve as a type of Christ.
  - **The shoe.** “The ‘Ceremony of the Shoe’,” a Religious Studies Center study, examines the rite of [[Ruth 4:7–8]] and its meanings.

