chapter: 3
title: Spread Therefore Thy Skirt
tagline: At Naomi’s word Ruth goes by night to the threshing floor and asks Boaz to cover her as her redeemer; he blesses her, promises, and sends her home before dawn with barley for Naomi.
when: 'At the end of the harvests'

setting: |
  Chapter 2 closed with Ruth gleaning “unto the end of barley harvest and of wheat harvest” and living with her mother-in-law ([[Ruth 2:23]]). Gleaning met the first need of two widows: food. It could not meet the second. With her husband and sons dead, Naomi had no one to support her. Chapter 3 turns from the next meal to a lasting security, and Naomi, who had already recognized Boaz as “one of our next kinsmen” ([[Ruth 2:20]]), now acts on it.

  The chapter opens the book’s second movement, the redemption itself, which happens in two places and two lights. This chapter is the night, on the threshing floor, with no one else knowing of it; the next is the morning, in the city gate before ten elders ([[Ruth 4:1–2]]). The narrator keeps the night in darkness and seclusion, and sets it against the public business of the day that follows: what Boaz promises privately here, he does openly there.

  The law behind the chapter, the *gōʾēl* or kinsman-redeemer and his duty to a dead kinsman’s land and widow, is explained at [[Ruth 2:20]] and [[Ruth 4:5]]. This chapter needs only that Boaz was such a kinsman, and not the nearest.

thread: |
  Ruth 3 is a request and a promise, made at midnight.

  Naomi plans it: she will seek “rest” for Ruth, and she sends her to the threshing floor washed and dressed, to lie at Boaz’s feet and wait for him to tell her what to do (verses 1–5). Ruth does all of it, and then does more. When Boaz wakes, she does not wait to be told. She names herself and asks him, in his own words from the harvest field, to spread his “wing” over her, because he is a redeemer (verse 9). In chapter 2 Boaz had blessed her as one who had come to trust under the wings of the LORD God of Israel ([[Ruth 2:12]]); now she asks him to be the means by which that blessing comes true, the human conduit of the LORD’s *ḥesed*, His covenant kindness.

  Boaz answers with a blessing, a compliment and an oath (verses 10–13). He calls her request a greater kindness than her first, calls her a woman of worth whom the whole town knows, and swears “as the LORD liveth” that she will be redeemed. But there is a nearer kinsman, and Boaz will not step past him; he does nothing out of its proper order. Before dawn he sends her home, unseen, with six measures of barley, so that she does not come back to Naomi empty (verses 14–17). Naomi, who began the chapter seeking rest for Ruth, ends it sure that Boaz himself will not rest until the matter is settled “this day” (verse 18).

sections:
  - range: 1-5
    heading: Naomi’s plan
    plain: |
      Naomi said to her, “My daughter, shouldn’t I look for a secure home for you, where you will be well cared for? Boaz is our relative, the one whose young women you worked with. Tonight he is winnowing barley at the threshing floor. So wash, put on perfume, put on your best clothes, and go down to the threshing floor. But don’t let him know you are there until he has finished eating and drinking. When he lies down, note the place where he lies. Then go, uncover the place at his feet, and lie down there. He will tell you what to do.” Ruth answered, “I will do everything you say.”
  - range: 6-13
    heading: At midnight on the threshing floor
    plain: |
      She went down to the threshing floor and did just as her mother-in-law had told her. When Boaz had eaten and drunk and was in good spirits, he went to lie down at the end of the grain pile. She came quietly, uncovered the place at his feet, and lay down. At midnight the man was startled and turned over, and there was a woman lying at his feet. “Who are you?” he asked. She answered, “I am Ruth, your servant. Spread your wing over your servant, for you are a redeemer.” He said, “The LORD bless you, my daughter. This kindness is greater than the first, because you have not gone after the young men, poor or rich. Now, my daughter, don’t be afraid. I will do for you all you ask, for everyone in the town knows you are a woman of worth. It is true that I am a redeemer, but there is a redeemer closer than I am. Stay here tonight. In the morning, if he will redeem you, good; let him redeem. But if he is not willing, then as surely as the LORD lives, I will redeem you. Lie down until morning.”
  - range: 14-18
    heading: Before dawn
    plain: |
      So she lay at his feet until morning, and got up before anyone could recognize another, because he said, “No one must know that the woman came to the threshing floor.” He also said, “Bring the shawl you are wearing and hold it out.” When she held it, he measured out six measures of barley and put it on her, and she went into the town. When she came to her mother-in-law, Naomi asked, “How did it go, my daughter?” Ruth told her everything the man had done for her, and said, “He gave me these six measures of barley, for he said, ‘Don’t go back to your mother-in-law empty-handed.’” Naomi said, “Wait, my daughter, until you learn how the matter turns out. The man will not rest until he has settled it today.”

notes:
  - ref: 1
    phrase: shall I not seek rest for thee
    kind: history
    title: 'Rest: a secure home'
    body: |
      The “rest” Naomi seeks is a home where Ruth will be safe: a husband, and with him an end to the exposure of a widow without family. The Hebrew *mānôaḥ* can mean the absence of work, but it also names freedom from the anxiety of the exiled ([[Deut. 28:65]]; [[Lam. 1:3]]) and of a widow with no family. It takes up Naomi’s blessing on the road from Moab, that each daughter-in-law would find “rest” (there *mǝnûḥâ*, “security”) “in the house of her husband” ([[Ruth 1:9]]). There Naomi could only pray for it and send them away; here, with a redeemer in the family, she sets out to bring it about.
    sources: [strathearn-ruth]
  - ref: 2
    phrase: he winnoweth barley to night in the threshingfloor
    kind: history
    title: Why the threshing floor
    body: |
      The threshing floor gave Naomi what the harvest field never could: a private word with Boaz. In the field Ruth was one gleaner among his workers; at the floor the owner stayed through the night to guard the grain from thieves, sometimes with a few of his men, and Boaz would be working late sorting his barley. Naomi’s plan seems to have been forming since she recognized him as a kinsman (2:20), and she waited for this night to use it. It was, to be sure, a stratagem, and she planned it with care: Ruth was not to make herself known until he had eaten and lain down.
    sources: [muhlestein-ruth, ot-minute-ruth-3, strathearn-ruth]
  - ref: 3
    phrase: Wash thyself therefore, and anoint thee, and put thy raiment upon thee
    kind: symbol
    title: Washed, anointed, dressed
    body: |
      Ruth is to go to Boaz prepared as a bride is prepared: washed, anointed with oil, and in her best clothes, presumably the best she had. The Lord describes making Jerusalem His bride in like terms, “Then washed I thee with water … and I anointed thee with oil. I clothed thee also” ([[Ezek. 16:9–10]]). Ruth goes to the threshing floor not as a gleaner asking for grain but as a woman seeking marriage.
    sources: [ot-minute-ruth-3, muhlestein-ruth]
  - ref: 4
    phrase: uncover his feet, and lay thee down
    kind: words
    title: Uncover his feet
    body: |
      “His feet” is *margǝlōt*, “place of the feet”: Ruth is to uncover the place at Boaz’s feet where he sleeps and lie down there, and the same word in verses 8 and 14 simply means “at his feet.” Lying at a man’s feet is the posture of a humble petitioner, and the petition, as verse 9 shows, was for marriage, so that he would take her under his protection and provide for her.

      A careful reader may notice that the words for lying down, uncovering and feet can each serve elsewhere in the Hebrew Bible as euphemisms for intimacy, and the night setting adds to the suspense. If the writer meant the reader to wonder, it was only to answer the question: the scene contrasts the possibility of impropriety with “the reality that nothing of the kind happened.” Boaz’s own verdict closes the matter: she is “a virtuous woman” (verse 11). At each turn of the story Ruth and Boaz face a choice, and each time they choose well.
    sources: [bdb, ot-minute-ruth-3, scripture-helps-ruth-samuel, muhlestein-ruth]
  - ref: 8
    phrase: the man was afraid, and turned himself
    kind: history
    title: Unnamed in the dark
    body: |
      Boaz wakes at midnight startled: the verb *ḥārad* can mean that he shivered with the cold or that he started at finding someone at his feet. In the dark he cannot see who she is, and the narrator keeps the darkness in the words. At verses 8, 16 and 18 the narrator says “the man” and “a woman” in place of their names, part of the secrecy that covers the night; Boaz has to ask who she is, and Naomi asks again when she comes home (verse 16).
    sources: [strathearn-ruth, muhlestein-ruth]
  - ref: 9
    phrase: 'spread therefore thy skirt over thine handmaid; for thou art a near kinsman'
    kind: symbol
    title: Spread thy wing
    body: |
      Ruth asks Boaz to marry her, and she asks in words that recall his own blessing. The King James “skirt” is *kānāp*, “wing,” and by extension the edge or corner of a garment; to ask a man to spread it over her was to ask him to take her under his protection as his wife (compare the Lord and Jerusalem in [[Ezek. 16:8]]). “Near kinsman” is *gōʾēl*, “redeemer” (see [[Ruth 2:20]]).

      The word *kānāp* is the point. In the harvest field Boaz had prayed that Ruth be rewarded by “the LORD God of Israel, under whose wings thou art come to trust” ([[Ruth 2:12]]). Now Ruth asks Boaz to spread his own wing over her, implying that he is the one through whom the LORD will answer his prayer. In the book of Ruth the LORD’s kindness reaches people through other people, and here, in a phrase, “Ruth asks Boaz to be the Lord’s wings.” He will become the human instrument of the shelter he had invoked.

      Naomi had said that Boaz “will tell thee what thou shalt do” (verse 4). Instead Ruth tells him. Naomi made the plan, but it is Ruth who comes to him and asks for redemption.
    sources: [strathearn-ruth, bdb, muhlestein-ruth, scripture-helps-ruth-samuel, welch-costly-love]
  - ref: 10
    phrase: thou hast shewed more kindness in the latter end than at the beginning
    kind: words
    title: Her latter kindness
    body: |
      “Kindness” is *ḥesed*, the covenant loyalty that goes beyond what is owed (explained at [[Ruth 1:8]]), and Boaz is comparing two of Ruth’s acts. Her first *ḥesed* was leaving her home and family to look after Naomi. Her latter *ḥesed*, the context suggests, is what she does this night at the threshing floor. The young men she did not follow are *bāḥûrîm*, not the *nǝʿārîm*, the young men and servants of the harvest field, but eligible and choice young men; a young widow could have married one of them. Instead she, and Naomi with her, chose Boaz, who was probably older, and chose him as the family’s redeemer, on the strength of his worth rather than his looks.

      That is why Boaz counts her request as kindness to him: her loyalty to Naomi led her to ask for a covenant act from Boaz, and asking was itself a covenant kindness shown to him. Whether he was also unmarried and childless the text does not say.
    sources: [strathearn-ruth, belnap-hesed, muhlestein-ruth]
  - ref: 11
    phrase: thou art a virtuous woman
    kind: words
    title: A woman of worth
    body: |
      “Virtuous” is *ḥayil*, a word of “strength, ability, and wealth” (see also [Women and marriage in the Old Testament](/old-testament/guides/women-and-marriage/#valued) and [[Prov. 31:10]]). The narrator used the same word of Boaz, “a mighty man of wealth” ([[Ruth 2:1]]). Ruth was not wealthy, so the word said of her reinforces that Boaz’s own *ḥayil* was more than money: he was a man of strength and virtue too. The word marks them as equally yoked. Ruth and Boaz come from different peoples, fortunes and faiths, but both are strong in keeping their obligations to those in need: she her oath to Naomi, he his duty to the poor, the widow and the stranger.
    sources: [strathearn-ruth, ot-minute-ruth-3]
  - ref: 13
    phrase: then will I do the part of a kinsman to thee, as the LORD liveth
    kind: history
    title: The nearer kinsman and the oath
    body: |
      Boaz swears to redeem Ruth, but only after the nearer kinsman has had his chance. “The part of a kinsman” is the verb *gāʾal*, used here of taking a kinsman’s widow and raising up children by her; the book of Ruth uniquely joins the redeemer’s duty to the custom of levirate marriage, and how the two fit is explained at [[Ruth 4:5]]. With the widow went the redemption of Naomi’s land ([[Ruth 4:3]]).

      Naomi had called Boaz “one of our next kinsmen” ([[Ruth 2:20]]), and she was probably aware that there was a closer one. Boaz knows it too (verse 12), and he will not set him aside, though he has just promised Ruth “all that thou requirest.” He binds himself with an oath, “as the LORD liveth” (on Israelite oaths, see [[Ruth 1:17]]), and leaves the nearer man the first right. That is like him: throughout the story Boaz does things exactly as they should be done, or better.
    sources: [bdb, scripture-helps-ruth-samuel, muhlestein-ruth, strathearn-ruth]
  - ref: 14
    phrase: Let it not be known that a woman came into the floor
    kind: history
    title: Gone before dawn
    body: |
      Boaz keeps Ruth until morning to keep her safe, and sends her off before light to keep her name. The road back to the town in full darkness would likely have been too dangerous, so he tells her to “tarry,” lodge for the night (*lîn*, the ordinary word for staying the night), until the grey hours before dawn. Then she leaves before anyone could recognize another, and he asks that no one know a woman had come to the threshing floor, to protect her reputation. What was begun in secret at night would be finished in public, at the gate, in the light of the next day.
    sources: [muhlestein-ruth, bdb, ot-minute-ruth-3]
  - ref: 17
    phrase: Go not empty unto thy mother in law
    kind: history
    title: Go not empty
    body: |
      The six measures of barley are a present for Naomi and a sign of Boaz’s intent. The text does not say what measure he used; one older reading rejects the later Jewish figure of two ephahs because Ruth could not have carried so much home in her shawl. Whatever the amount, it was an immensely, even extravagantly, generous gift, and Boaz gives his reason: she must not return to her mother-in-law empty-handed. Sent with Ruth to Naomi, the grain further showed that he meant to keep the promise he had just made.
    sources: [keil-ruth, welch-costly-love, ot-minute-ruth-3]
  - ref: 18
    phrase: the man will not be in rest, until he have finished the thing this day
    kind: history
    title: He will not rest
    body: |
      Naomi knows her kinsman: once Boaz has set his mind to it, he will not be quiet until it is done, and done today. Her “rest” here is a different Hebrew word from the “rest” she sought for Ruth in verse 1; *šāqaṭ* means to be quiet, undisturbed. Ruth is to “sit still”; Boaz will not.

      Her confidence is well placed. The next morning, as Boaz sits down in the gate, the nearer kinsman happens to pass by ([[Ruth 4:1]]), and the writer seems not to mean that meeting as chance: the Lord brings the right man to the right place at the right time.
    sources: [bdb, muhlestein-ruth]

christ: |
  Ruth comes to Boaz by night, calls herself his servant, and asks him to cover her because he is her redeemer; and Boaz, bound by an oath in the LORD’s name, promises to redeem her and does not rest until it is done. For Christian readers Boaz the *gōʾēl* is a type of Christ, the Redeemer and the Bridegroom. Ruth’s virtue, courage and action drive the whole story, and yet she has to depend on another to finish what she cannot: she needs redemption herself.

  So does every disciple. Like Naomi and Ruth, a disciple cannot save himself or herself, and relies on the Redeemer, Jesus Christ, who “purchased with his own blood” those He redeems ([[Acts 20:28]]).

explore: |
  - **The covering wing.** [[Ruth 2:12]] with [[Ruth 3:9]], then [[Ezek. 16:8]], where the Lord spreads His “skirt” over Jerusalem in covenant, and [[Ps. 17:8]] and [[Ps. 91:4]].
  - **A woman of strength.** [[Ruth 2:1]], [[Ruth 3:11]] and [[Prov. 31:10–31]].
  - **Night and morning.** Read chapter 3 straight into [[Ruth 4:1–13]], the private promise and the public redemption.
  - **A study.** Kerry Muhlestein, [“Ruth, Redemption, Covenant, and Christ”](https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ), is especially good on the threshing-floor scene and what follows.

sources: [strathearn-ruth, muhlestein-ruth, scripture-helps-ruth-samuel, ot-minute-ruth-3, bdb, welch-costly-love, belnap-hesed, keil-ruth]
