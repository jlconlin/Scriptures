  blurb: In the days of the judges, a Moabite widow follows her mother-in-law to Bethlehem, gleans in the field of a kinsman, and becomes the great-grandmother of King David.

intro: |
  The book of Ruth is set “in the days when the judges ruled” ([[Ruth 1:1]]), and it reads like the answer to them. Judges ends with every man doing “that which was right in his own eyes”; Ruth tells of three people in Bethlehem who each do more than the law asks of them. A famine sends Elimelech and Naomi to Moab with their two sons. The men die there, and Naomi comes home with nothing but her Moabite daughter-in-law, who will not leave her: “thy people shall be my people, and thy God my God” ([[Ruth 1:16]]).

  The first half follows the two widows home and into the barley harvest, where Ruth gleans in the field of Boaz, a kinsman of Elimelech's, and finds him kind. The second half turns on a night at the threshing floor and a morning at the city gate, where Boaz takes on the duty of a kinsman, redeems Elimelech's land and marries Ruth. Their son Obed is the grandfather of David, so the book ends with a genealogy that runs to Israel's king, and through him to Christ. This companion goes through all four chapters and tries to anticipate the questions a careful reader would ask: why a Moabite was welcomed, what gleaning and the kinsman's right were, what happened at the threshing floor, and why the story ends with a list of names.

  For the period, see [The Conquest, the Judges, and One Kingdom](/old-testament/guides/the-conquest-judges-and-kingdom/) and [A Timeline of the Old Testament](/old-testament/guides/israels-story/#judges); for widows, marriage and the kinsman's duty, see [Women and Marriage in the Old Testament](/old-testament/guides/women-and-marriage/#levirate-marriage).

# Proposed (BRIEF.md, "Divisions"): the story's own two halves, the road and the field (1-2), the threshing
# floor and the gate (3-4). Keys must not repeat another book's (the colors are global variables).
divisions:
  - key: ruthroad
    range: [1, 2]
    name: Thy People Shall Be My People
    blurb: Famine drives a family of Bethlehem to Moab, where the men die. Naomi comes home bitter and empty, and Ruth will not leave her. In the barley harvest Ruth gleans in the field of Boaz, a kinsman, who has heard what she has done and shelters her under the Lord's wings.
    color: '#9a6a2a'
    darkColor: '#e3bd84'
  - key: ruthredeemer
    range: [3, 4]
    name: A Restorer of Thy Life
    blurb: Naomi sends Ruth to the threshing floor, and Ruth asks Boaz to spread his skirt over her as a near kinsman. At the gate of Bethlehem a nearer kinsman declines, and Boaz buys Elimelech's land and takes Ruth as his wife. Their son Obed is the grandfather of David.
    color: '#7a3e4e'
    darkColor: '#dba4b3'

