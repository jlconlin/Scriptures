summary: >-
  Near the end of Luke, the risen Lord joins two disciples on the road to Emmaus, opens the
  scriptures to them, and is known to them "in breaking of bread." The book's center is
  Jesus, who comes alongside the ones who are leaving in sorrow; when He is gone, they
  return the same hour to Jerusalem. The picture is the room at Emmaus the moment after He vanished, seen from the table, with the door open on the road back to Jerusalem.
look: >-
  A realistic painted illustration, as a skilled landscape illustrator would paint a
  full-page plate in gouache for a fine book: true proportions and scale, natural color,
  believable light and cast shadows, real-looking cloth, bronze, rock and water. It is
  plainly a painting and not a photograph: forms are slightly simplified, surfaces are
  smooth washes of color with little fine texture (no gravel, pebbles or grain picked out
  one by one), and edges are clean and soft. It is not a cartoon or a flat poster either:
  no outlines, no faceted or stylized shapes, no exaggerated color.
motifs:
  - "Primary, and the viewpoint: inside a plain village house at Emmaus toward evening, seen from beside the table where the meal was eaten (Luke 24:29–30). On the low wooden table in the foreground lies one round flat loaf torn in two, the halves a little apart with the soft inside showing, beside a small lit clay oil lamp, a clay cup and a folded striped cloth. The broken loaf is the focus of the picture."
  - "Primary: signs that the two rose and left at once ('they rose up the same hour', Luke 24:33): two plain stools pushed back from the table, one of them tipped over on its side, and the pegs on the wall left bare. No one is in the room; it is a room left in a hurry, not a room abandoned."
  - "Supporting: the wooden door standing wide open, and through it a stony track with a low dry-stone wall curving down into the valley toward Jerusalem, small and lit gold on a far ridge under the evening sky (Luke 24:29, 33)."
composition: >-
  Seen from beside the table, at the height of a seated person. The table with the broken
  loaf, lamp and cup fills the lower foreground, left of center; behind it the stools, one
  tipped over. The far wall runs across the middle of the picture with the open doorway at
  the right, and through it the road leading down and away to Jerusalem on the far ridge.
  Two lights, both natural: the lamp, which lights the loaf and the table warmly, and the
  evening light coming in through the doorway and laying a pale wedge across the floor.
  Palette of warm clay, plaster cream and wood brown inside, olive and dusky blue on the
  hills, gold and rose in the sky beyond the door. No figures or animals.
# “What's in this picture” under the image on the book page: one line for each thing, with the verse it shows.
key:
  - '**The loaf broken in two** stands for the bread He broke at their table: “he took bread, and blessed it, and brake, and gave to them” ([[Luke 24:30]]). Then “their eyes were opened, and they knew him; and he vanished out of their sight” ([[Luke 24:31]]).'
  - '**The lamp still burning** stands for what the two said to each other when He was gone: “Did not our heart burn within us, while he talked with us by the way, and while he opened to us the scriptures?” ([[Luke 24:32]]).'
  - '**The stools pushed back, one tipped over, and the empty pegs** show how quickly they left: “they rose up the same hour, and returned to Jerusalem” ([[Luke 24:33]]).'
  - '**The open door and the evening light** recall why they asked Him in: “Abide with us: for it is toward evening, and the day is far spent” ([[Luke 24:29]]).'
  - '**The road down the valley to the city on the far ridge** is the way back to Jerusalem, where they “told what things were done in the way, and how he was known of them in breaking of bread” ([[Luke 24:35]]).'
