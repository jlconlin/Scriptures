alt: Inside a plain stone house toward evening, a round flat loaf lies torn in two on a low wooden table beside a lit oil lamp, a clay cup and a folded striped cloth; two stools are pushed back, one tipped over, the pegs on the wall are empty, and through the open door a stony road with a low stone wall curves down the valley toward a walled city lit gold on a far ridge.
