chapter: 18
title: God Be Merciful to Me a Sinner
tagline: Jesus tells of a widow who will not stop asking an unjust judge and of a Pharisee and a publican at prayer, welcomes infants, sets a rich ruler a choice he will not make, foretells His death to the Twelve, and gives sight to a blind man near Jericho.
when: 'On the journey to Jerusalem, as it nears Jericho ([[Luke 18:35]]); in this site’s chronology, the Perean and Judean ministry'

setting: |
  Luke 18 comes near the end of the long journey that began when Jesus “steadfastly set his face to go to Jerusalem” ([[Luke 9:51]]). Luke does not trace a route. His journey is one of discipleship, in which Jesus marks the path by word and deed, and Luke keeps naming the city along the way, here once more as Jesus takes the Twelve aside (verse 31). The chapter ends on the road outside Jericho, the last stop before Jerusalem.

  The two parables that open the chapter are told only by Luke. The first answers the teaching on the coming of the Son of man at the end of chapter 17 ([[Luke 17:20–37]]), and its closing question returns to that coming (verse 8). With the children brought to Jesus (verse 15), Luke rejoins Matthew and Mark, and from there the three tell the same stories in the same order: the children, the rich ruler, the foretelling of His death to the Twelve, and the blind man at Jericho ([[Matt. 19:13–20:34]]; [[Mark 10:13–52]]). Luke has no request of James and John, and he places the healing as Jesus came near Jericho rather than as He left it.

thread: |
  **Luke 18 asks who enters the kingdom of God, and answers with the powerless.**

  The language of entering is the chapter’s own. Whoever does not receive the kingdom as a little child “shall in no wise enter therein” (verse 17), and a camel goes through a needle’s eye more easily than a rich man enters (verse 25). Around those two sayings Luke sets a row of figures. A widow with no standing keeps coming to a judge who cares for no one. A publican stands far off and asks only for mercy. Infants are carried to Jesus, too small to do anything but be brought. A ruler who says he has kept the commandments since his youth is left very sorrowful when asked to part with his wealth. A blind beggar shouts over the crowd after he is told to be quiet. The powerless are received; the one who came with the most is left sorrowing.

  Read in order, the chapter is a path of discipleship: prayer that does not give up, humility, becoming as a child, willingness to leave all, understanding why Jesus goes to Jerusalem, and seeing as one ought to see. In the middle of it Jesus tells the Twelve plainly what waits for Him there, and they cannot take it in (verse 34). The blind man, healed, does what they are still learning to do: he follows Him, glorifying God.

sections:
  - range: 1-8
    heading: The widow and the unjust judge
    plain: |
      Jesus told them a parable to show that they should always pray and not lose heart. “In a certain city there was a judge who did not fear God or care what people thought. A widow in that city kept coming to him and saying, ‘Give me justice against my opponent.’ For a while he refused. But afterward he said to himself, ‘Though I don’t fear God or care about people, this widow keeps bothering me, so I will see that she gets justice, or by her endless coming she will wear me out.’”

      And the Lord said, “Listen to what the unjust judge says. Will not God see justice done for His chosen ones, who cry to Him day and night, though He is patient with them? I tell you, He will see justice done for them, and quickly. But when the Son of man comes, will He find faith on the earth?”
  - range: 9-14
    heading: The Pharisee and the publican
    plain: |
      He also told this parable to some who were sure of their own righteousness and looked down on everyone else. “Two men went up to the temple to pray, one a Pharisee and the other a tax collector. The Pharisee stood and prayed this way with himself: ‘God, I thank you that I am not like other people, swindlers, cheats, adulterers, or even like this tax collector. I fast twice a week; I give a tenth of everything I get.’ But the tax collector stood at a distance. He would not even raise his eyes to heaven, but beat his breast and said, ‘God, be merciful to me, a sinner.’ I tell you, this man went home justified rather than the other. For everyone who exalts himself will be humbled, and whoever humbles himself will be exalted.”
  - range: 15-17
    heading: Infants brought to Jesus
    plain: |
      People were also bringing babies to Jesus for Him to touch them, and when the disciples saw it they scolded them. But Jesus called the children to Him and said, “Let the little children come to me, and do not stop them, for the kingdom of God belongs to such as these. Truly I tell you, whoever does not receive the kingdom of God as a little child will never enter it.”
  - range: 18-30
    heading: The rich ruler
    plain: |
      A certain ruler asked Him, “Good Teacher, what must I do to inherit eternal life?” Jesus said, “Why do you call me good? No one is good but One, God. You know the commandments: Do not commit adultery, do not kill, do not steal, do not bear false witness, honor your father and your mother.” He said, “I have kept all these since I was young.” When Jesus heard this He said, “You still lack one thing. Sell everything you have and give to the poor, and you will have treasure in heaven; and come, follow me.” When he heard that, he became very sad, for he was very rich.

      Seeing his sorrow, Jesus said, “How hard it is for those who have riches to enter the kingdom of God! It is easier for a camel to go through the eye of a needle than for a rich man to enter the kingdom of God.” Those who heard Him asked, “Then who can be saved?” He said, “What is impossible for men is possible for God.”

      Peter said, “Look, we have left everything and followed you.” Jesus told them, “Truly I tell you, no one who has left house, or parents, or brothers, or wife, or children for the sake of the kingdom of God will fail to receive many times more in this life, and in the world to come, eternal life.”
  - range: 31-34
    heading: His death foretold to the Twelve
    plain: |
      Then He took the Twelve aside and said, “Listen: we are going up to Jerusalem, and everything the prophets wrote about the Son of man will be fulfilled. He will be handed over to the Gentiles; He will be mocked, insulted and spat on; they will flog Him and kill Him, and on the third day He will rise again.” But they understood none of this. Its meaning was hidden from them, and they did not grasp what He was saying.
  - range: 35-43
    heading: A blind man near Jericho
    plain: |
      As Jesus came near Jericho, a blind man was sitting by the road begging. Hearing a crowd going by, he asked what was happening, and they told him Jesus of Nazareth was passing. He shouted, “Jesus, Son of David, have mercy on me!” Those at the front of the crowd told him sharply to be quiet, but he shouted all the more, “Son of David, have mercy on me!” Jesus stopped and ordered him brought over. When he came near, Jesus asked him, “What do you want me to do for you?” He said, “Lord, let me receive my sight.” Jesus said, “Receive your sight; your faith has saved you.” At once he could see, and he followed Jesus, glorifying God; and all the people, when they saw it, praised God.

notes:
  - ref: 1
    phrase: that men ought always to pray, and not to faint
    kind: words
    title: Always to pray, and not to faint
    body: |
      The parable teaches prayer that does not lose heart, and Luke says so before he tells it, one of the few parables introduced by a statement of its aim; the next one is another (verse 9). The verb rendered “faint,” *ekkakeō*, means to fail in heart, to lose heart or grow weary.

      The parable follows directly on Jesus’s teaching about the days of the Son of man ([[Luke 17:22–37]]), and verse 8 comes back to it. Read with that teaching, the cry of God’s elect “day and night” (verse 7) can be taken to look ahead to trials the disciples did not yet know, when the world and its rulers would seem to be against them and God far off. Modern revelation gives the same counsel to elders sent out to preach: “Praying always that they faint not; and inasmuch as they do this, I will be with them even unto the end” ([[D&C 75:11]]).
    sources: [thayer, ellicott-luke, lds-scriptures]
  - ref: 2
    phrase: There was in a city a judge, which feared not God, neither regarded man
    kind: scripture
    title: The parable given again in Missouri
    body: |
      The Lord gave this parable again to Latter-day Saints driven from their homes. Mobs had driven them out of Jackson County, Missouri, and in December 1833, in the revelation now [[D&C 101]], He said, “I will liken them unto the parable of the woman and the unjust judge,” quoted verses 2–5 almost as Luke has them, and turned the story into counsel: “Let them importune at the feet of the judge” ([[D&C 101:81–86]]). If the judge would not hear them, they were to go to the governor, and if not to the governor, to the president. If none would hear, “then will the Lord arise and come forth out of his hiding place, and in his fury vex the nation” ([[D&C 101:89]]).

      So the Saints were to do what the widow did, plead at one door after another, and leave the outcome to the Lord, who “in his time” will cut off the unjust ([[D&C 101:90]]). Even then their prayers were to reach those who wronged them: “Pray ye, therefore, that their ears may be opened unto your cries, that I may be merciful unto them” ([[D&C 101:92]]).
    sources: [lds-scriptures]
  - ref: 3
    phrase: Avenge me of mine adversary
    kind: words
    title: Avenge me
    body: |
      The widow is not asking for revenge. The verb, *ekdikeō*, began with vengeance but came to mean deciding a legal case or bringing someone to judgment, and that is its sense here. Her “adversary” is her opponent at law. Her plea is for justice against her opponent, and the tense of “came” is one of repeated action: she came to him again and again.

      Whether the judge was a Jew or a gentile is debated, and what little Jesus says of him cannot settle it; but the law of Moses gave widows strong protection ([[Ex. 22:22–24]]; [[Deut. 24:17]]), so a widow in the story probably points to a Jewish judge, bound to hear her. In her society she stood among the most vulnerable and least noticed, and a judge who regards no one could easily ignore her. Jesus does not say why he delayed. The case may have been tangled, since laws on widows could involve “many people, technical rules, and contested claims,” or her opponent may have been rich and powerful. What moves the judge in the end is not a better argument. She simply keeps coming.
    sources: [brown-testimony-luke, sc-knowhy-662]
  - ref: 5
    phrase: lest by her continual coming she weary me
    kind: words
    title: She will wear me out
    body: |
      The judge’s word for “weary” comes from the boxing ring. *Hypōpiazō* is properly to beat black and blue, to strike a blow that leaves a livid bruise on an opponent’s face; Paul uses it of buffeting his own body like a boxer ([[1 Cor. 9:27]]). From the arena it passed into common speech for wearing someone out with endless entreaty, as the King James renders it here. The picture is of blow after blow, none of them a knock-down, matching her coming again and again, until he would give in at any price. A man who fears neither God nor anyone else gives way to a powerless widow because she will not stop coming.
    sources: [thayer, ellicott-luke]
  - ref: 6
    phrase: Hear what the unjust judge saith
    kind: christ
    title: The Lord and the unjust judge
    body: |
      The parable does not compare God to the judge; it sets them against each other. If a corrupt man who cares for no one will give a widow justice to be rid of her, God will do far more for those who cry to Him. The friend at midnight in [[Luke 11:5–8]] makes the same argument: the friend and the judge both act from self-interest, and against them stands the love and mercy of the Father who answers sincere prayer.

      Luke calls the speaker “the Lord” as the parable is applied, a title that in his Gospel virtually equates Jesus with Jehovah, so the application carries divine authority. Jesus also names the judge “unjust,” turning the man’s boast that he regards no one into a charge against him.
    sources: [brown-testimony-luke, sc-knowhy-662]
  - ref: 8
    phrase: when the Son of man cometh, shall he find faith on the earth?
    kind: scripture
    title: Will He find faith?
    body: |
      The Joseph Smith Translation makes verse 8 speak of the Second Coming in so many words: “I tell you that he will come, and when he does come, he will avenge his saints speedily” (JST Luke 18:8, in the footnote). It also changes “them” at the end of verse 7 to “men,” so that God bears long with men. That forbearance is what tries the elect who cry to Him day and night, and Peter’s explanation of the Lord’s delay answers it: “The Lord is not slack concerning his promise, as some men count slackness; but is longsuffering to us-ward, not willing that any should perish” ([[2 Pet. 3:9]]).

      The closing question is a warning: read as it stands, it implies that faith will be hard to find when He comes. It does not settle who will have it. An Apostle has held out the hope that, as members trust with all their hearts and turn belief into action, the answer “perhaps” will be “Yes, He will find faith. He will find faith among those who take upon themselves His name.” The warning is why the parable is about prayer that does not give up, and the prayer is how the answer can be yes.
    sources: [lds-scriptures, ellicott-luke, wirthlin-find-faith-2002]
  - ref: 9
    phrase: trusted in themselves that they were righteous, and despised others
    kind: history
    title: Pharisees and publicans
    body: |
      Jesus casts the two religious extremes of His society. The Pharisees were a religious party whose name means “separatists.” They prided themselves on strict observance of the law and kept apart from things gentile, and their teaching tended to encourage self-sufficiency and spiritual pride. Publicans, the tax collectors (see the note on [[Luke 15:2]]), stood at the other end: their countrymen ranked them with thieves and robbers, and saw a Jew who collected for Rome as a traitor selling his services to a foreign conqueror.

      Luke names the audience before the story: people sure of their own righteousness who looked down on everyone else. The parable is not a verdict on Pharisees or publicans as such: it “was not intended for Pharisees or publicans expressly, but for the benefit of the self-righteous who lack the virtues of humility and who use self-righteousness as a claim to exaltation.”
    sources: [bd-pharisees, hunter-pharisee-publican]
  - ref: 11
    phrase: stood and prayed thus with himself
    kind: words
    title: Prayed thus with himself
    body: |
      “With himself” may mean that he stood by himself as he prayed, apart from the others at worship; standing was the custom for prayer. Read that way, both men stood apart: the Pharisee because he believed he was better than other men, the publican because he felt himself unworthy. In form the Pharisee thanks God, but his thoughts are on his own goodness, and he “asked nothing of God, but relied upon his own self-righteousness.”

      His practices are demanding. The only fast the law of Moses ordered was the Day of Atonement, but by Jesus’s day fasting had become a regular custom, and this man fasts twice a week. He tithes “all that I possess,” a word the footnote gives as “acquire, gain, or possess”: he seems to pay a tenth not only of what he grows but of what he buys, a mark of the Pharisees’ high standards. In his prayer those standards become his grounds for standing above “this publican,” where the word “this” likely carries contempt.
    sources: [brown-testimony-luke, hunter-pharisee-publican, bd-fasts, lds-scriptures]
  - ref: 13
    phrase: God be merciful to me a sinner
    kind: words
    title: Be merciful to me, the sinner
    body: |
      The publican asks God for one thing, mercy. His verb, *hilaskomai*, means to appease or conciliate; in the passive form he uses, it is “be propitious, be gracious, be merciful” to me. He offers nothing in exchange, and he calls himself “the sinner,” with the article, perhaps as if there were no other.

      Everything about him says the same. He stands far off, perhaps out in the Court of the Gentiles where he would draw no attention; he will not raise his eyes; he beats his breast, “feeling the weight of his iniquities pressing down upon him.” The Book of Mormon has prayers that echo his. Alma, remembering his conversion, pleaded, “O Jesus, thou Son of God, have mercy on me” ([[Alma 36:18]]), and his counsel to his son Shiblon sets two such prayers side by side: “Do not say: O God, I thank thee that we are better than our brethren; but rather say: O Lord, forgive my unworthiness” ([[Alma 38:14]]).
    sources: [thayer, brown-testimony-luke, hunter-pharisee-publican, lds-scriptures]
  - ref: 14
    phrase: this man went down to his house justified rather than the other
    kind: christ
    title: Justified
    body: |
      “Justified” is *dikaioō*, the word Paul appeals to: God reckons a person upright, or stands him upright before Him, which no one can do for himself. In the Lord’s verdict, the publican “was absolved, forgiven, or vindicated.”

      The verdict is Jesus’s own. In telling the story He sits as judge. He weighs the two men’s ways of coming to God, declares the publican justified, and so shows already the office He will hold as judge of all. The saying that closes the parable He had spoken before, almost word for word, at the table of a chief Pharisee ([[Luke 14:11]]): the one who comes to God in humility is the one He justifies.
    sources: [brown-testimony-luke, hunter-pharisee-publican]
  - ref: 15
    phrase: they brought unto him also infants
    kind: history
    title: Infants, after the publican
    body: |
      Luke’s word is *brephē*, babies in arms; Matthew and Mark use the ordinary word for children ([[Matt. 19:13]]; [[Mark 10:13]]). They were brought so that Jesus would touch them, and for Luke such a touch is for the blessing it brings.

      Luke sets this scene right after the publican, and read after him it carries the same lesson of humility, now in children too small to come unless they are carried. The disciples show the opposite. Their verb for scolding the parents is a strong one, often used in scripture of God’s own rebuke, and they had no authority to use it here. Jesus’s answer, “Suffer little children to come unto me, and forbid them not,” is meant for them as much as for the parents. Restoration scripture says why the kingdom is “of such”: “little children are holy, being sanctified through the atonement of Jesus Christ” ([[D&C 74:7]]). What it means to receive the kingdom “as a little child” (verse 17) is the subject of the note on [[Mark 10:15]].
    sources: [korth-reed-little-children, brown-testimony-luke, lds-scriptures]
  - ref: 18
    phrase: a certain ruler
    kind: history
    title: A ruler asks the lawyer’s question
    body: |
      Only Luke calls him a ruler, which may mean a presiding officer of the local synagogue or possibly a member of the Sanhedrin; Matthew says he was young ([[Matt. 19:20]]). His question is word for word the lawyer’s before the parable of the good Samaritan, “what shall I do to inherit eternal life?” ([[Luke 10:25]]), and the footnote joins the two. The spirit is different. The lawyer asked to tempt Jesus; this man asked in earnest.

      He seems to call Jesus “Good Master” as a polite compliment, not in recognition that He is God, and Jesus declines the word in that sense; “none is good, save one, that is, God” is no denial of His own sinlessness (see the note on [[Matt. 19:17]]). The man has kept the commandments Jesus names. What he lacks is the one thing Jesus asks: to sell all, give to the poor, “and come, follow me.” Love of worldly things was his besetting weakness, and the remedy was prescribed for his case, not for every case. What he lacked was the willingness to place the kingdom of God above all he owned.
    sources: [talmage-jesus-christ-27, lds-scriptures]
  - ref: 27
    phrase: The things which are impossible with men are possible with God
    kind: scripture
    title: Those who trust in riches
    body: |
      The camel and the needle’s eye is a deliberate impossibility (see the note on [[Matt. 19:24]]), and the hearers take it at full strength: who then can be saved?

      Joseph Smith’s translation of verse 27 says who is shut out and who is not: “It is impossible for them who trust in riches, to enter into the kingdom of God; but he who forsaketh the things which are of this world, it is possible with God, that he should enter in” (JST Luke 18:27). The barrier is trust in riches, not riches as such. Wealth is a temptation to which many give way, but no insurmountable barrier to the kingdom; had the ruler done what Jesus asked, his riches could have made possible a service few are able to render.
    sources: [jst-luke-18, talmage-jesus-christ-27]
  - ref: 31
    phrase: all things that are written by the prophets concerning the Son of man shall be accomplished
    kind: christ
    title: Written by the prophets
    body: |
      Jesus had told the Twelve before what was coming ([[Luke 9:22]]; [[Luke 9:44]]); now He spoke in absolute plainness, without figure. Only Luke has Him tie it to what “the prophets” wrote, and the risen Lord will do it again: “all things must be fulfilled, which were written in the law of Moses, and in the prophets, and in the psalms, concerning me” ([[Luke 24:44]]). The footnote to “written” points to prophets of the Book of Mormon who saw it plainly: Nephi saw Him “lifted up upon the cross and slain for the sins of the world” ([[1 Ne. 11:33]]), and King Benjamin was told that men “shall scourge him, and shall crucify him” ([[Mosiah 3:9]]).

      The Twelve understood none of it; Luke says so three ways in verse 34. The word for “hid” means veiled: they heard the words but did not take them in. They knew Him to be the Christ and could not see how such a One could be made subject and slain; they may have looked instead for the open proclamation of His kingship. Luke alone dwells on it, perhaps because it explains their bewilderment after the Crucifixion and their slowness to believe that He had risen ([[Luke 24:11]]; [[Luke 24:25]]). John says the same of the triumphal entry: “These things understood not his disciples at the first: but when Jesus was glorified, then remembered they that these things were written of him” ([[John 12:16]]).
    sources: [talmage-jesus-christ-29, ellicott-luke, lds-scriptures]
  - ref: 38
    phrase: Jesus, thou Son of David, have mercy on me
    kind: christ
    title: Jesus of Nazareth, Son of David
    body: |
      The crowd tells the blind man that “Jesus of Nazareth” is passing; he answers with another name. His cry, and above all the title “Son of David,” shows that he knew of the Teacher, trusted His power to heal, and had faith in Him as the promised King and Deliverer of Israel. Those who went before, probably not the disciples but part of the crowd ahead of Jesus, tried to silence him, and he cried all the louder.

      Mark sets the healing as Jesus went out of Jericho, and Matthew has two blind men ([[Mark 10:46]]; [[Matt. 20:30]]); Luke has one, as Jesus came near the town (see the note on [[Matt. 20:30]]).
    sources: [talmage-jesus-christ-29, ellicott-luke, lds-scriptures]
  - ref: 42
    phrase: thy faith hath saved thee
    kind: words
    title: Thy faith hath saved thee
    body: |
      Jesus has said the same words before in Luke, though the King James Version renders them two ways: “thy faith hath saved thee” to the woman who washed His feet with her tears, and “thy faith hath made thee whole” to the woman healed of the issue of blood and to the Samaritan leper ([[Luke 7:50]]; [[Luke 8:48]]; [[Luke 17:19]]). Each time the verb is *sōzō*, which means both to make well and to save (see the note on [[Luke 17:19]]). Here the first sense is plain, for his sight is restored. Beyond it, the restored sight can be read as a type and pledge of salvation, the health of spiritual vision. He “followed him” in the imperfect tense, going on following, glorifying God, and the praise of the man and of all the people is told only by Luke.

      The healing is one of the works Jesus announced in the synagogue at Nazareth when He read from Isaiah that He was sent to preach “recovering of sight to the blind” ([[Luke 4:18]]); healing the blind was one of the ways He fulfilled that prophecy.
    sources: [thayer, ellicott-luke, greek-nt, sc-knowhy-656]

christ: |
  Luke 18 shows Jesus Christ as the judge who justifies. He tells of the publican and pronounces him justified, and then goes up to Jerusalem to fulfil all that the prophets wrote of the Son of man: to be mocked and scourged and killed, and to rise the third day. He is the Son of man who, when He comes, will avenge those who cry to God day and night, and the Son of David who stops on the road for a beggar the crowd wanted silenced.

  The way to Him in this chapter is the publican’s, and modern revelation joins humility and prayer as the chapter does: “Be thou humble; and the Lord thy God shall lead thee by the hand, and give thee answer to thy prayers” ([[D&C 112:10]]). The Saints driven from their homes in Missouri were given the widow’s parable for their own trouble, because “men ought always to pray and not to faint” ([[D&C 101:81]]). And the parable of the two men at prayer describes no distant people: “On every busy street there are Pharisees and publicans. It may be that one of them bears our name.”

explore: |
  - **The other tellings.** [[Matt. 19:13–20:34]] and [[Mark 10:13–52]], with the request of James and John that Luke leaves out.
  - **Persistence in prayer.** [[Luke 11:5–13]], the friend at midnight, told earlier on the journey with the same lesson.
  - **The parable in this dispensation.** [[D&C 101:76–95]], given to the Saints in Missouri in December 1833.
  - **A prayer like the Pharisee’s.** [[Alma 31:12–23]], the Zoramites on the Rameumptom, and Alma’s counsel against it in [[Alma 38:13–14]].
  - **A rich publican saved.** [[Luke 19:1–10]], Zacchaeus, in the next chapter.

