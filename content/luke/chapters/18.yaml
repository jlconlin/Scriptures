chapter: 18
title: God Be Merciful to Me a Sinner
tagline: Jesus tells of a widow who will not stop asking an unjust judge and of a Pharisee and a publican at prayer, welcomes infants, sets a rich ruler a choice he will not make, foretells His death to the Twelve, and gives sight to a blind man near Jericho.
when: 'On the journey to Jerusalem, as it nears Jericho ([[Luke 18:35]]); in this site’s chronology, the Perean and Judean ministry'

setting: |
  Luke 18 comes near the end of the long journey that began when Jesus “steadfastly set his face to go to Jerusalem” ([[Luke 9:51]]). Luke does not trace a route. His journey is one of discipleship, in which Jesus marks the path by word and deed, and Luke keeps naming the city along the way, here once more as Jesus takes the Twelve aside (verse 31). The chapter ends on the road outside Jericho, the last stop before Jerusalem.

  The two parables that open the chapter are told only by Luke. The first answers the teaching on the coming of the Son of man at the end of chapter 17 ([[Luke 17:20–37]]), and its closing question returns to that coming (verse 8). With the children brought to Jesus (verse 15), Luke rejoins Matthew and Mark, and from there the three tell the same stories in the same order: the children, the rich ruler, the third foretelling of the death, and the blind man at Jericho ([[Matt. 19:13–20:34]]; [[Mark 10:13–52]]). Luke has no request of James and John, and he places the healing as Jesus came near Jericho rather than as He left it.

thread: |
  **Luke 18 asks who enters the kingdom of God, and answers with the powerless.**

  The language of entering is the chapter’s own. Whoever does not receive the kingdom as a little child “shall in no wise enter therein” (verse 17), and a camel goes through a needle’s eye more easily than a rich man enters (verse 25). Around those two sayings Luke sets a row of figures. A widow with no standing keeps coming to a judge who cares for no one. A publican stands far off and asks only for mercy. Infants are carried to Jesus, too small to do anything but be brought. A ruler who has kept the commandments since his youth cannot let go of his wealth. A blind beggar shouts over the crowd after he is told to be quiet. The powerless are received; the one who came with the most goes away sorrowing.

  Read in order, the chapter is a path of discipleship: prayer that does not give up, humility, becoming as a child, willingness to leave all, understanding why Jesus goes to Jerusalem, and seeing as one ought to see. In the middle of it Jesus tells the Twelve plainly what waits for Him there, and they cannot take it in (verse 34). The blind man, healed, does what they are still learning to do: he follows Him, glorifying God.

sections:
  - range: 1-8
    heading: The widow and the unjust judge
    plain: |
      Jesus told them a parable to show that they should always pray and not lose heart. “In a certain city there was a judge who did not fear God or care what people thought. A widow in that city kept coming to him and saying, ‘Give me justice against my opponent.’ For a while he refused. But afterward he said to himself, ‘Though I don’t fear God or care about people, this widow keeps bothering me, so I will see that she gets justice, or by her endless coming she will wear me out.’”

      And the Lord said, “Listen to what the unjust judge says. Will not God see justice done for His chosen ones, who cry to Him day and night, though He is patient with them? I tell you, He will see justice done for them, and quickly. But when the Son of man comes, will He find faith on the earth?”
  - range: 9-14
    heading: The Pharisee and the publican
    plain: |
      He also told this parable to some who were sure of their own righteousness and looked down on everyone else. “Two men went up to the temple to pray, one a Pharisee and the other a tax collector. The Pharisee stood by himself and prayed: ‘God, I thank you that I am not like other people, swindlers, cheats, adulterers, or even like this tax collector. I fast twice a week; I give a tenth of everything I get.’ But the tax collector stood at a distance. He would not even raise his eyes to heaven, but beat his breast and said, ‘God, be merciful to me, a sinner.’ I tell you, this man went home justified rather than the other. For everyone who exalts himself will be humbled, and whoever humbles himself will be exalted.”
  - range: 15-17
    heading: Infants brought to Jesus
    plain: |
      People were also bringing babies to Jesus for Him to touch them, and when the disciples saw it they scolded them. But Jesus called the children to Him and said, “Let the little children come to me, and do not stop them, for the kingdom of God belongs to such as these. Truly I tell you, whoever does not receive the kingdom of God as a little child will never enter it.”
  - range: 18-30
    heading: The rich ruler
    plain: |
      A certain ruler asked Him, “Good Teacher, what must I do to inherit eternal life?” Jesus said, “Why do you call me good? No one is good but One, God. You know the commandments: Do not commit adultery, do not kill, do not steal, do not bear false witness, honor your father and your mother.” He said, “I have kept all these since I was young.” When Jesus heard this He said, “You still lack one thing. Sell everything you have and give to the poor, and you will have treasure in heaven; and come, follow me.” When he heard that, he became very sad, for he was very rich.

      Seeing his sorrow, Jesus said, “How hard it is for those who have riches to enter the kingdom of God! It is easier for a camel to go through the eye of a needle than for a rich man to enter the kingdom of God.” Those who heard Him asked, “Then who can be saved?” He said, “What is impossible for men is possible for God.”

      Peter said, “Look, we have left everything and followed you.” Jesus told them, “Truly I tell you, no one who has left house, or parents, or brothers, or wife, or children for the sake of the kingdom of God will fail to receive many times more in this life, and in the world to come, eternal life.”
  - range: 31-34
    heading: His death foretold to the Twelve
    plain: |
      Then He took the Twelve aside and said, “Listen: we are going up to Jerusalem, and everything the prophets wrote about the Son of man will be fulfilled. He will be handed over to the Gentiles; He will be mocked, insulted and spat on; they will flog Him and kill Him, and on the third day He will rise again.” But they understood none of this. Its meaning was hidden from them, and they did not grasp what He was saying.
  - range: 35-43
    heading: A blind man near Jericho
    plain: |
      As Jesus came near Jericho, a blind man was sitting by the road begging. Hearing a crowd going by, he asked what was happening, and they told him Jesus of Nazareth was passing. He shouted, “Jesus, Son of David, have mercy on me!” Those at the front of the crowd told him sharply to be quiet, but he shouted all the more, “Son of David, have mercy on me!” Jesus stopped and ordered him brought over. When he came near, Jesus asked him, “What do you want me to do for you?” He said, “Lord, let me see again.” Jesus said, “Receive your sight; your faith has saved you.” At once he could see, and he followed Jesus, glorifying God; and all the people, when they saw it, praised God.

notes:
  - ref: 1
    phrase: that men ought always to pray, and not to faint
    kind: words
    title: Always to pray, and not to faint
    body: |
      Luke states this parable’s point, persistence in prayer, before he tells it, as he does again with the next one (verse 9). To “faint” is to grow weary and lose heart, here in praying for deliverance.

      The parable follows straight on from Jesus’s warnings about the days of the Son of man ([[Luke 17:22–37]]), and verse 8 comes back to them, so the troubles of the last days are a main reason for the praying. Modern revelation uses nearly the same words, with the same sense of praying for help in the latter days, to elders sent out in this dispensation: “Praying always that they faint not; and inasmuch as they do this, I will be with them even unto the end” ([[D&C 75:11]]).
    sources: [brown-testimony-luke, lds-scriptures]
  - ref: 2
    phrase: There was in a city a judge, which feared not God, neither regarded man
    kind: scripture
    title: The parable given again in Missouri
    body: |
      The Lord gave this parable again to Latter-day Saints driven from their homes in Missouri. In December 1833 mobs had driven them out of Jackson County, and in the revelation now [[D&C 101]] He quoted verses 2–5 nearly word for word and said, “Thus will I liken the children of Zion. Let them importune at the feet of the judge” ([[D&C 101:85–86]]). If the judge would not hear them, they were to go to the governor, and if not to the governor, to the president. If none would hear, “then will the Lord arise and come forth out of his hiding place, and in his fury vex the nation” ([[D&C 101:89]]).

      The Lord’s own use of the parable keeps the widow’s persistence at the center and turns it into counsel: the Saints were to plead at one door after another, judge, governor, president, as she kept coming back to the judge. It keeps Luke’s tie to the end of days as well. The Lord will cut off the unjust “in his time” ([[D&C 101:90]]), as Jesus promised that God would avenge His elect (verse 7).
    sources: [lds-scriptures, brown-testimony-luke]
  - ref: 3
    phrase: Avenge me of mine adversary
    kind: words
    title: Avenge me
    body: |
      The widow is not asking for revenge. The verb, *ekdikeō*, began with vengeance but came to mean deciding a legal case or bringing someone to judgment, and that is its sense here. Her “adversary” is her opponent at law. Her plea is for justice against her opponent, and the tense of “came” is one of repeated action: she came to him again and again.

      Whether the judge was a Jew or a gentile is debated, and what little Jesus says of him cannot settle it; but the law of Moses gave widows strong protection ([[Ex. 22:22–24]]; [[Deut. 24:17]]), so a widow in the story probably points to a Jewish judge, bound to hear her. In her society she stood among the most vulnerable and least noticed, and a judge who regards no one could easily ignore her. Jesus does not say why he delayed. The case may have been tangled, since laws on widows could involve “many people, technical rules, and contested claims,” or her opponent may have been rich and powerful. What moves the judge in the end is not a better argument. She simply keeps coming.
    sources: [brown-testimony-luke, sc-knowhy-662]
  - ref: 5
    phrase: lest by her continual coming she weary me
    kind: words
    title: She will wear me out
    body: |
      The judge’s word for “weary” comes from the boxing ring. *Hypōpiazō* means to strike under the eye, to beat black and blue; Paul uses it of buffeting his own body like a boxer ([[1 Cor. 9:27]]). Figuratively it means to wear someone out with endless entreaty, as the King James renders it here; it may instead mean that the judge fears a blackened reputation rather than a black eye, a sense some prefer. Either way, a man who fears neither God nor anyone else gives way to a powerless widow because she will not stop coming.
    sources: [thayer, brown-testimony-luke]
  - ref: 6
    phrase: Hear what the unjust judge saith
    kind: christ
    title: The Lord and the unjust judge
    body: |
      The parable does not compare God to the judge; it sets them against each other. If a corrupt man who cares for no one will give a widow justice to be rid of her, God will do far more for those who cry to Him. The friend at midnight in [[Luke 11:5–8]] makes the same argument: the friend and the judge both act from self-interest, and against them stands the love and mercy of the Father who answers sincere prayer.

      Luke calls the speaker “the Lord” as the parable is applied, a title that in his Gospel virtually equates Jesus with Jehovah, so the application carries divine authority. Jesus also names the judge “unjust,” turning the man’s boast that he regards no one into a charge against him.
    sources: [brown-testimony-luke, sc-knowhy-662]
  - ref: 8
    phrase: when the Son of man cometh, shall he find faith on the earth?
    kind: scripture
    title: Will He find faith?
    body: |
      The Joseph Smith Translation makes verse 8 speak of the Second Coming in so many words: “I tell you that he will come, and when he does come, he will avenge his saints speedily” (JST Luke 18:8, in the footnote). It also changes “them” at the end of verse 7 to “men,” so that God’s patience reaches all people, not only His elect. That patience is the delay the faithful must endure: God may not answer as quickly as His chosen ones want, and they go on crying to Him day and night. “Speedily” is most often taken to mean soon, but after the delay of verse 7 it may mean suddenly, as the lightning of [[Luke 17:24]].

      The closing question can be read on two levels: as pointing to the apostasy that would come between His ministry and His return, and to troubles in the last days so severe that even the faith of the faithful might fail. Either way, such troubles are why the parable is about prayer that does not give up.
    sources: [lds-scriptures, brown-testimony-luke]
  - ref: 9
    phrase: trusted in themselves that they were righteous, and despised others
    kind: history
    title: Pharisees and publicans
    body: |
      Jesus casts the two religious extremes of His society. The Pharisees were a religious party whose name means “separatists.” They prided themselves on strict observance of the law and kept apart from things gentile, and their teaching tended to encourage self-sufficiency and spiritual pride. Publicans collected taxes and tolls for Rome, or in Galilee often for Herod. They were detested; their countrymen ranked them with thieves and robbers, and saw a Jew who collected for Rome as a traitor selling his services to a foreign conqueror. Yet the Gospels speak again and again of how readily publicans received the gospel ([[Luke 15:1]]).

      Luke names the audience before the story: people sure of their own righteousness who looked down on everyone else. The parable is not a verdict on Pharisees or publicans as such: it “was not intended for Pharisees or publicans expressly, but for the benefit of the self-righteous who lack the virtues of humility and who use self-righteousness as a claim to exaltation.”
    sources: [bd-pharisees, bd-publicans, hunter-pharisee-publican]
  - ref: 11
    phrase: stood and prayed thus with himself
    kind: words
    title: Prayed thus with himself
    body: |
      “With himself” may mean that he stood by himself as he prayed, apart from the others at worship; standing was the custom for prayer. Both men stood apart: the Pharisee because he believed he was better than other men, the publican because he felt himself unworthy. In form the Pharisee thanks God, but his thoughts are on his own goodness, and he “asked nothing of God, but relied upon his own self-righteousness.”

      His practices are demanding. The only fast the law of Moses ordered was the Day of Atonement, but by Jesus’s day fasting had become a regular custom, and this man fasts twice a week. He tithes “all that I possess,” a word the footnote gives as “acquire, gain, or possess”: he seems to pay a tenth not only of what he grows but of what he buys, a mark of the Pharisees’ high standards. In his prayer those standards become his grounds for standing above “this publican,” where the word “this” likely carries contempt.
    sources: [brown-testimony-luke, hunter-pharisee-publican, bd-fasts, lds-scriptures]
  - ref: 13
    phrase: God be merciful to me a sinner
    kind: words
    title: Be merciful to me, the sinner
    body: |
      The publican asks God for one thing, mercy. His verb, *hilaskomai*, means to appease or conciliate; in the passive form he uses, it is “be propitious, be gracious, be merciful” to me. He offers nothing in exchange, and he calls himself “the sinner,” with the article, perhaps as if there were no other.

      Everything about him says the same. He stands far off, perhaps out in the Court of the Gentiles where he would draw no attention; he will not raise his eyes; he beats his breast, “feeling the weight of his iniquities pressing down upon him.” The Book of Mormon knows this cry. Alma, remembering his conversion, pleaded, “O Jesus, thou Son of God, have mercy on me” ([[Alma 36:18]]), and his counsel to his son Shiblon sets two such prayers side by side: “Do not say: O God, I thank thee that we are better than our brethren; but rather say: O Lord, forgive my unworthiness” ([[Alma 38:14]]).
    sources: [thayer, brown-testimony-luke, hunter-pharisee-publican, lds-scriptures]
  - ref: 14
    phrase: this man went down to his house justified rather than the other
    kind: christ
    title: Justified
    body: |
      “Justified” is *dikaioō*, the word Paul appeals to: God reckons a person upright, or stands him upright before Him, which no one can do for himself. In the Lord’s verdict, the publican “was absolved, forgiven, or vindicated.”

      The verdict is Jesus’s own. In telling the story He sits as judge. He weighs the two men’s ways of coming to God, declares the publican justified, and so shows already the office He will hold as judge of all. The saying that closes the parable He had spoken before, almost word for word, at the table of a chief Pharisee ([[Luke 14:11]]): the one who comes to God in humility is the one He justifies.
    sources: [brown-testimony-luke, hunter-pharisee-publican]
  - ref: 15
    phrase: they brought unto him also infants
    kind: history
    title: Infants, after the publican
    body: |
      Luke’s word is *brephē*, babies in arms; Matthew and Mark use the ordinary word for children ([[Matt. 19:13]]; [[Mark 10:13]]). They were brought so that Jesus would touch them, and for Luke such a touch is for the blessing it brings.

      Luke sets this scene right after the publican, and read after him it carries the same lesson of humility, now in children too small to come unless they are carried. The disciples show the opposite. Their verb for scolding the parents is a strong one, often used in scripture of God’s own rebuke, and they had no authority to use it here. Jesus’s answer, “Suffer little children to come unto me, and forbid them not,” is meant for them as much as for the parents. Restoration scripture says why the kingdom is “of such”: “little children are holy, being sanctified through the atonement of Jesus Christ” ([[D&C 74:7]]). What it means to receive the kingdom “as a little child” (verse 17) is the subject of the note on [[Mark 10:15]].
    sources: [korth-reed-little-children, brown-testimony-luke, lds-scriptures]
  - ref: 18
    phrase: a certain ruler
    kind: history
    title: A ruler asks the lawyer’s question
    body: |
      Only Luke calls him a ruler. The Greek *archōn* covers many kinds of official and points to none in particular, though it can mean an officer of a synagogue or a member of a local council. Matthew says he was young ([[Matt. 19:20]]). He asks exactly what the lawyer asked before the parable of the good Samaritan, “what shall I do to inherit eternal life?” ([[Luke 10:25]]), as though one task done quickly would open the door.

      “Good Master” seems to be flattery, a word that strictly belongs to God spent as a compliment. Jesus’s reply, “none is good, save one, that is, God,” is no admission of sin on His part; it states the old teaching of Israel’s scriptures that goodness belongs to God (see the note on [[Matt. 19:17]]). He answers with the commandments that govern how a person treats others, and the man has kept them. Then comes the one thing lacking, and the heart of it is the invitation, “come, follow me.” Jesus told him to sell all. Whether he would in fact have had to give up everything as his first step toward eternal life cannot be known, because he turned away before he began; what the command required of him in any case was to be wholly willing.
    sources: [brown-testimony-luke]
  - ref: 27
    phrase: The things which are impossible with men are possible with God
    kind: scripture
    title: Those who trust in riches
    body: |
      The camel and the needle is deliberate overstatement, the great beast of burden set against a needle’s eye. A few late manuscripts read “rope” for “camel,” a scribe’s attempt to tone it down (see also [[Mark 10:25]]). The hearers take it at full strength and ask who then can be saved.

      Joseph Smith’s translation of verse 27 says who is shut out and who is not: “It is impossible for them who trust in riches, to enter into the kingdom of God; but he who forsaketh the things which are of this world, it is possible with God, that he should enter in” (JST Luke 18:27). The barrier is trust in riches, and the door opens, by God’s power, to the one who forsakes the world. Luke shows it opening in the next chapter, where Zacchaeus, a rich chief publican, gives half his goods to the poor and hears that salvation has come to his house ([[Luke 19:1–10]]).
    sources: [jst-luke-18, brown-testimony-luke]
  - ref: 31
    phrase: all things that are written by the prophets concerning the Son of man shall be accomplished
    kind: christ
    title: Written by the prophets
    body: |
      Jesus had told the Twelve before what was coming ([[Luke 9:22]]; [[Luke 9:44]]), but this time He ties it to what the prophets wrote. His death in Jerusalem is not an accident of the road but scripture fulfilled, brought to pass by the Father. Isaiah’s servant seems to lie just beneath His words: the servant says, “I gave my back to the smiters, and my cheeks to them that plucked off the hair: I hid not my face from shame and spitting” ([[Isa. 50:6]]), and sets his face “like a flint” ([[Isa. 50:7]]), words that recall how Jesus set His face to go to Jerusalem ([[Luke 9:51]]). “The prophets” may include those of the Book of Mormon, who saw His suffering plainly: they “shall scourge him, and shall crucify him” ([[Mosiah 3:9]]).

      The Twelve understood none of it; Luke says so three ways in verse 34. The saying “was hid from them,” which tells against blaming them for willful dullness. Their not understanding can also be seen to make their later witness more secure: they did not go into the last week expecting His death, and when it came it devastated them. Only after He rose did He open “their understanding, that they might understand the scriptures” ([[Luke 24:45]]).
    sources: [brown-testimony-luke, lds-scriptures]
  - ref: 38
    phrase: Jesus, thou Son of David, have mercy on me
    kind: christ
    title: Jesus of Nazareth, Son of David
    body: |
      The crowd tells the blind man that “Jesus of Nazareth” is passing, the name by which a known teacher and healer went. He answers with another name. “Son of David” carries messianic meaning, and Jesus’s plain acceptance of the title points to His being the Messiah. Those at the head of the procession try to silence him, as the disciples had tried to keep the children away (verse 15), and he cries all the louder.

      Matthew and Mark set the healing as Jesus left Jericho, and Matthew has two blind men ([[Matt. 20:29–30]]; [[Mark 10:46]]); Luke has one, as Jesus came near the town (see the note on [[Matt. 20:30]]).
    sources: [brown-testimony-luke]
  - ref: 42
    phrase: thy faith hath saved thee
    kind: words
    title: Thy faith hath saved thee
    body: |
      Jesus has said these words before in Luke: to the woman who washed His feet with her tears, to the woman healed of the issue of blood, and to the Samaritan leper ([[Luke 7:50]]; [[Luke 8:48]]; [[Luke 17:19]]). Each time the verb is *sōzō*, which means both to heal and to save (see the note on [[Luke 17:19]]), and here both senses fit: his sight is restored, and his faith has brought him salvation. He then “followed him,” in a tense of continuing action: he kept following, glorifying God.

      The healing fulfils what Jesus announced in the synagogue at Nazareth at the start of His ministry, that He was sent to preach “recovering of sight to the blind” ([[Luke 4:18]]).
    sources: [thayer, brown-testimony-luke]

christ: |
  Luke 18 shows Jesus Christ as the judge who justifies. He tells of the publican and pronounces him justified, and then goes up to Jerusalem to fulfil all that the prophets wrote of the Son of man: to be mocked and scourged and killed, and to rise the third day. He is the Son of man who, when He comes, will avenge those who cry to God day and night, and the Son of David who stops on the road for a beggar the crowd wanted silenced.

  The way to Him in this chapter is the publican’s, and modern revelation joins humility and prayer as the chapter does: “Be thou humble; and the Lord thy God shall lead thee by the hand, and give thee answer to thy prayers” ([[D&C 112:10]]). The Saints driven from their homes in Missouri were given the widow’s parable for their own trouble, because “men ought always to pray and not to faint” ([[D&C 101:81]]). And the parable of the two men at prayer describes no distant people: “On every busy street there are Pharisees and publicans. It may be that one of them bears our name.”

explore: |
  - **The other tellings.** [[Matt. 19:13–20:34]] and [[Mark 10:13–52]], with the request of James and John that Luke leaves out.
  - **Persistence in prayer.** [[Luke 11:5–13]], the friend at midnight, told earlier on the journey with the same lesson.
  - **The parable in this dispensation.** [[D&C 101:76–95]], given to the Saints in Missouri in December 1833.
  - **A prayer like the Pharisee’s.** [[Alma 31:12–23]], the Zoramites on the Rameumptom, and Alma’s counsel against it in [[Alma 38:13–14]].
  - **A rich publican saved.** [[Luke 19:1–10]], Zacchaeus, in the next chapter.

