chapter: 24
title: The Lord Is Risen Indeed
tagline: Women find the tomb empty and hear angels say that Jesus is risen; He walks unrecognized with two disciples to Emmaus and is known in the breaking of bread; He stands among the eleven with a body of flesh and bones, opens the scriptures, commissions them as witnesses, and is carried up into heaven.
when: 'The first day of the week after the Crucifixion, from dawn to evening, and the Ascension (see the note on verse 51); the order this site follows'

setting: |
  Luke 24 is the first day of the week, “the third day” since the Crucifixion as Cleopas counts it (verse 21). The women who had watched Jesus buried come at dawn with the spices they had prepared ([[Luke 23:55–56]]) and find the tomb empty; that afternoon two of His followers meet Him on the road to Emmaus; that evening He stands among the eleven and those with them in Jerusalem; and the chapter closes with His ascension and the disciples in the temple.

  All four Gospels tell of the empty tomb ([[Matt. 28:1–8]]; [[Mark 16:1–8]]; [[John 20:1–10]]), and John also tells of the evening appearance ([[John 20:19–23]]). The Emmaus story, which Mark sums up in two verses ([[Mark 16:12–13]]), Luke tells in full. His account of the Resurrection is richer in detail than Matthew’s or Mark’s, and more effective in showing that the Resurrection was bodily. Luke had his account from those who “from the beginning were eyewitnesses” ([[Luke 1:2]]). On one Latter-day Saint reading, he learned the morning’s events from one of the women while he was in Jerusalem with Paul ([[Acts 21:15–18]]), and the Emmaus story comes from Cleopas, who saw and heard it.

  The chapter is also a hinge between Luke’s two books. He tells the ascension again at the start of Acts, where the risen Lord teaches the apostles for forty days ([[Acts 1:1–12]]).

thread: |
  **Luke 24 moves from not finding to knowing.** The women “found not the body” (verse 3), and the two on the road report that “him they saw not” (verse 24). The empty tomb alone brings no one to knowledge: the women need the angels to remind them of His words (verses 6–8), and the rest come to know Him as He Himself opens what was closed, in three ways the chapter joins with one verb. On the road He opened the scriptures to the two (verse 32); at the table their eyes were opened (verse 31); in Jerusalem He opened the understanding of the eleven (verse 45). Luke uses the same Greek word (*dianoigō*) for all three, so that seeing Him and understanding Him belong together, and it is His to open both.

  What He opens to them is a necessity they had missed. The angels remind the women that the Son of man “must” be delivered, crucified and raised (verse 7); Jesus asks the two whether it was not necessary for Christ to suffer and enter His glory (verse 26); and He tells the eleven that all things written of Him “must be fulfilled” (verse 44). The disciples had heard Him say so in Galilee and had not understood. Now the risen Christ, in a body they can handle and that eats before them, makes them witnesses of it (verse 48) and sends them to all nations. Luke ends where he began, in the temple, with great joy.

sections:
  - range: 1-12
    heading: The empty tomb
    plain: |
      Very early on the first day of the week the women came to the tomb, bringing the spices they had prepared, and some others came with them. They found the stone rolled away from the tomb, and when they went in they did not find the body of the Lord Jesus. While they were at a loss about it, two men in dazzling clothes suddenly stood beside them. Terrified, the women bowed their faces to the ground, and the men said to them, “Why are you looking for the living among the dead? He is not here; he has been raised. Remember what he told you while he was still in Galilee: ‘The Son of Man must be handed over to sinful men, be crucified, and on the third day rise again.’” Then they remembered his words.

      They came back from the tomb and told all this to the eleven and to everyone else. The women were Mary Magdalene, Joanna, Mary the mother of James, and the others with them, and they kept telling the apostles. But their words seemed nonsense to the apostles, who would not believe them. Peter, though, got up and ran to the tomb. Stooping to look in, he saw only the linen cloths lying by themselves, and he went away, wondering to himself at what had happened.
  - range: 13-35
    heading: The road to Emmaus
    plain: |
      That same day two of them were going to a village called Emmaus, about seven miles from Jerusalem, talking with each other about everything that had happened. While they talked and argued, Jesus himself came up and walked with them, but their eyes were kept from recognizing him. He asked them, “What are you discussing with each other as you walk along, looking so sad?” One of them, named Cleopas, answered, “Are you the only visitor in Jerusalem who does not know what has happened there these last few days?” “What things?” he asked. They told him: “About Jesus of Nazareth, a prophet mighty in deed and word before God and all the people, and how our chief priests and rulers handed him over to be sentenced to death and crucified him. We had hoped that he was the one who would set Israel free. Besides all this, it is now the third day since it happened. And some women of our group astonished us. They were at the tomb early this morning, and when they did not find his body they came back saying they had even seen a vision of angels, who said he was alive. Some of those with us went to the tomb and found it just as the women had said; but him they did not see.”

      Then he said to them, “How foolish you are, and how slow of heart to believe all that the prophets have spoken! Was it not necessary that the Christ should suffer these things and then enter into his glory?” And beginning with Moses and all the prophets, he explained to them what was said about himself in all the scriptures.

      As they came near the village they were going to, he went on as though he meant to go farther. But they urged him, “Stay with us, for it is nearly evening and the day is almost over.” So he went in to stay with them. When he was at table with them, he took bread, blessed it, broke it, and gave it to them. Then their eyes were opened and they recognized him, and he vanished from their sight. They said to each other, “Were not our hearts burning within us while he talked with us on the road and opened the scriptures to us?” They got up that very hour and went back to Jerusalem, where they found the eleven gathered together with the others, who were saying, “The Lord has really risen, and he has appeared to Simon!” Then the two told what had happened on the road, and how he had been made known to them in the breaking of the bread.
  - range: 36-49
    heading: The risen Lord appears to the disciples
    plain: |
      While they were still talking about this, Jesus himself stood among them and said, “Peace be with you.” They were startled and terrified, thinking they were seeing a ghost. He said to them, “Why are you troubled, and why do doubts rise in your hearts? Look at my hands and my feet; it is I myself. Touch me and see, for a spirit does not have flesh and bones, as you see that I have.” When he had said this, he showed them his hands and feet. While they still could not believe it for joy, and were amazed, he asked them, “Do you have anything here to eat?” They gave him a piece of broiled fish and some honeycomb, and he took it and ate it in front of them.

      Then he said to them, “This is what I told you while I was still with you: everything written about me in the law of Moses, the prophets and the psalms must be fulfilled.” Then he opened their minds to understand the scriptures, and said to them, “This is what is written: the Christ must suffer and rise from the dead on the third day, and repentance and forgiveness of sins must be preached in his name to all nations, beginning at Jerusalem. You are witnesses of these things. And see, I am sending upon you what my Father promised. But stay in the city of Jerusalem until you are clothed with power from on high.”
  - range: 50-53
    heading: He was carried up into heaven
    plain: |
      He led them out toward Bethany, lifted up his hands and blessed them. While he was blessing them, he parted from them and was carried up into heaven. They worshipped him and went back to Jerusalem with great joy, and they were continually in the temple, praising and blessing God. Amen.

notes:
  - ref: 1
    phrase: bringing the spices which they had prepared
    kind: history
    title: Bringing the spices which they had prepared
    body: |
      The “they” of verse 1 are the women of the end of chapter 23, who had come with Jesus from Galilee, watched Joseph of Arimathea lay Him in the tomb, and gone home to prepare spices and ointments before the Sabbath ([[Luke 23:55–56]]). Luke has known them since [[Luke 8:2–3]], so their witness spans almost the whole of His ministry, only a little less than that of the Twelve. They come to dress His body, and perhaps also to mourn Him properly, which Friday afternoon had given them no chance to do.

      They also knew what it would cost them. To enter a tomb and handle the dead made a person ritually unclean for seven days under the law of Moses ([[Num. 19:11–20]]), and the women came knowing it.
    sources: [brown-testimony-luke]
  - ref: 4
    phrase: two men stood by them in shining garments
    kind: scripture
    title: Two men … in shining garments
    body: |
      Luke calls them “two men”; only later do the women report “a vision of angels” (verse 23). Joseph Smith’s translation names them at once and moves them outside: the women “found the stone rolled away from the sepulcher, and two angels standing by it in shining garments” (JST Luke 24:2). That fits the scene. Tombs of this kind were small, usually with only one place where a person could stand upright, and the women could hardly all have bowed their faces to the earth (verse 5) inside one, so they most likely met the angels outside.

      Matthew and Mark each tell of one angel ([[Matt. 28:2]]; [[Mark 16:5]]), and Joseph Smith’s translation consistently changes both to two, in accord with Luke. The law of Moses required at least two witnesses in matters of life and death ([[Deut. 17:6]]; [[Deut. 19:15]]), and the first word of the Resurrection meets that requirement. And angels close Luke’s Gospel as they opened it, with Zacharias, Mary and the shepherds ([[Luke 1:11]]; [[Luke 1:26]]; [[Luke 2:9]]).
    sources: [jst-luke-24, brown-testimony-luke]
  - ref: 5
    phrase: Why seek ye the living among the dead?
    kind: words
    title: Why seek ye the living among the dead?
    body: |
      The angels’ question is Luke’s alone. “The living” (Greek *ton zōnta*, “the one who lives”) can be heard as a title, “the Living One,” the name scripture gives to the living God ([[Ps. 42:2]]; [[Jer. 10:10]]); heard so, on the angels’ lips it marks the role Jesus has newly won as the one raised from death. “Is risen” is a passive verb, “has been raised,” which points to the Father as the one who raised Him.

      Then, instead of the message in Matthew and Mark that He would go before the disciples into Galilee ([[Matt. 28:7]]; [[Mark 16:7]]), the angels send the women back to what He had told them in Galilee, that the Son of man “must” be delivered, crucified and raised ([[Luke 9:22]]; [[Luke 9:44]]). That “must” (*dei*) is the word of divine necessity that runs through the Gospel and comes back in verses 26, 44 and 46; the angels present the Resurrection as prophecy fulfilled. “And they remembered his words” (verse 8): the women had plainly been among the disciples in Galilee when He said it.
    sources: [brown-testimony-luke, huntsman-easter-sunday]
  - ref: 11
    phrase: their words seemed to them as idle tales
    kind: words
    title: As idle tales
    body: |
      “Idle tales” is one Greek word, *lēros*, “nonsense.” The verbs make it a scene that went on. The women “told” the apostles (an imperfect tense: they kept telling them), and the apostles “believed them not,” in the same tense: the more the women insisted on what they had seen, the more the men dismissed it, though the news came from women they knew.

      The disbelief is easy to understand. “In all human experience, this had never happened before. It was completely unprecedented”: the young man of Nain and Lazarus had come back to mortal life and died again, but Jesus “would never die again.” And though He had foretold His death and rising plainly, Luke says that the Twelve “understood none of these things” ([[Luke 18:34]]). Their slowness has a value of its own. Men who refused the first reports, and believed only when He stood before them (verses 36–43), make the more credible witnesses.
    sources: [huntsman-easter-sunday, brown-testimony-luke, faust-supernal-gift-atonement, draper-he-has-risen]
  - ref: 16
    phrase: their eyes were holden that they should not know him
    kind: words
    title: Their eyes were holden
    body: |
      “Holden” is the old past participle of “hold.” The Greek verb (*krateō*, “to seize, to hold”) is passive, so the two disciples’ sight was being held back by someone else, by God, and its tense is continuous: it lasted as long as the three walked together. The opening in verse 31 is its reverse, sudden and also passive: “their eyes were opened.” Joseph Smith’s translation reads “were holden, or covered.”

      Why they were kept from knowing Him Luke does not say. One Latter-day Saint reading takes the covering to mean that the two were not yet ready to see the risen Lord in His glory, and so saw Him as through a veil, as He had looked in mortality.
    sources: [brown-testimony-luke, sc-knowhy-677]
  - ref: 18
    phrase: whose name was Cleopas
    kind: history
    title: Cleopas and his companion
    body: |
      Of the two only Cleopas is named, probably because he was the source of this story. He was not one of the eleven, who were all in Jerusalem when the pair returned (verse 33). Cleopas may be the Greek form of Clopas, and if so he may have been the husband of the Mary who stood by the cross, “Mary the wife of Cleophas” ([[John 19:25]], the cross-reference the footnote gives). His companion is not named. Some suggest the second traveler was his wife, the two going home after the Passover; others take “certain women also of our company” (verse 22) as the words of two men. Where Emmaus lay is not certain either; several sites west of Jerusalem have been proposed.

      They are two, the number the law required for witnesses ([[Deut. 19:15]]), and they are ordinary disciples, not apostles. The first appearance Luke tells in full is to two followers of no rank, and so the good news of the Resurrection reaches beyond the apostles from its first day.
    sources: [huntsman-easter-sunday, brown-testimony-luke, huntsman-lukes-jesus]
  - ref: 21
    phrase: we trusted that it had been he which should have redeemed Israel
    kind: history
    title: He which should have redeemed Israel
    body: |
      The sadness of the two (verse 17) comes from a hope they thought had died with Jesus. The verb “redeem” (*lytroumai*) can mean paying a ransom, as it does of Christ’s sacrifice elsewhere ([[Titus 2:14]]; [[1 Pet. 1:18–19]]). On their lips it seems to mean something else: a rescue of Israel as a nation, by power, the widespread expectation of a Messiah who would deliver his people. That is why they still call Jesus only “a prophet mighty in deed and word” (verse 19), the title the crowds had given Him (see the note on [[Luke 7:16]]). A crucified deliverer made no sense to them, and that misunderstanding is what Jesus sets out to correct on the road.
    sources: [brown-testimony-luke, sc-knowhy-677]
  - ref: 26
    phrase: Ought not Christ to have suffered these things, and to enter into his glory?
    kind: christ
    title: Ought not Christ to have suffered these things?
    body: |
      “Ought not” is the same *dei* of divine necessity the angels used in verse 7: “Was it not necessary?” The suffering the two took for defeat was the road that had to come before the glory.

      And here, for the first time in Luke’s Gospel, Jesus calls Himself “Christ.” In His mortal ministry His name for Himself was “the Son of man,” the one who must suffer, die and rise ([[Luke 9:22]]; [[Luke 18:31–33]]). Now, risen, He takes the title “the Christ” (the Greek has the article: the Messiah, the Anointed One), and names His sufferings as the way into His glory as God’s anointed. He uses it again to the eleven in verse 46. It was Cleopas, an eyewitness, who remembered that the Lord had spoken of Himself so.
    sources: [brown-testimony-luke, huntsman-lukes-jesus]
  - ref: 27
    phrase: beginning at Moses and all the prophets
    kind: scripture
    title: Beginning at Moses and all the prophets
    body: |
      “Moses and all the prophets” are the first two parts of Israel’s scriptures, the Law and the Prophets ([[Luke 16:29]]), with Moses counted as a prophet; the third part, which includes the Psalms, Jesus names in verse 44 and may be assumed here. His point is that all of it speaks of Him, “in all the scriptures.” Luke does not say which passages He chose. The Book of Mormon makes the same claim of the whole prophetic record: “none of the prophets have written, nor prophesied, save they have spoken concerning this Christ” ([[Jacob 7:11]]).

      It was not the first time He had taught so. At Nazareth He read Isaiah and said, “This day is this scripture fulfilled in your ears” ([[Luke 4:21]]), and on the way to Jerusalem He told the Twelve that “all things that are written by the prophets concerning the Son of man shall be accomplished” ([[Luke 18:31]]). They had heard and not understood. That is the sting of “O fools” in verse 25 (the footnote’s “unwise”), a severe word in the speech of the day, and meant not only for these two but for all who still mistook the kind of Messiah He was. On the road He taught them to recognize Him in the scriptures before they recognized Him at the table.
    sources: [brown-testimony-luke, sc-knowhy-677]
  - ref: 28
    phrase: he made as though he would have gone further
    kind: words
    title: He made as though he would have gone further
    body: |
      The King James phrase can sound like a pretense, but the text gives no hint of one; the plain reading is that He meant to keep going, and that it was the earnest urging of the two (“they constrained him,” verse 29) that made Him stop, probably at the home of one of them, since the village was where they were going.
    sources: [brown-testimony-luke]
  - ref: 30
    phrase: he took bread, and blessed it, and brake, and gave to them
    kind: symbol
    title: He took bread, and blessed it, and brake
    body: |
      The verbs are the ones Luke used at the feeding of the five thousand ([[Luke 9:16]]) and at the Last Supper ([[Luke 22:19]]), and the two would tell the eleven that He “was known of them in breaking of bread” (verse 35). Jesus says no words that make this supper the sacrament, but the meal becomes sacramental, holy in character, because of who He is. It is also a proof that touches the senses: the two saw Him and heard Him, took the bread from His hands, and presumably tasted it.

      Then “their eyes were opened,” again passive: it is the Savior who opens them, with the verb (*dianoigō*) Luke also uses for the scriptures opened on the road (verse 32) and the understanding of the eleven (verse 45).
    sources: [brown-testimony-luke, bowen-our-hands-have-handled]
  - ref: 32
    phrase: Did not our heart burn within us
    kind: scripture
    title: Did not our heart burn within us?
    body: |
      The Greek is a continuing past, “was burning”: the burning lasted as long as He spoke, and the two recognized it only afterward, when they knew who had been speaking. It is the language of spiritual quickening. The Lord used the same image in this dispensation for the witness of the Spirit, when He told Oliver Cowdery, “I will cause that your bosom shall burn within you; therefore, you shall feel that it is right” ([[D&C 9:8]]). It describes too what those who hear the message of the gospel from missionaries may feel. Joseph Smith’s translation makes the noun plural, “hearts.”
    sources: [brown-testimony-luke, lds-scriptures]
  - ref: 34
    phrase: The Lord is risen indeed, and hath appeared to Simon
    kind: history
    title: Hath appeared to Simon
    body: |
      Before the two can tell their story, the eleven tell theirs: the Lord has appeared to Simon Peter. Luke never narrates that meeting. Paul puts it first in his list of the risen Lord’s appearances, “he was seen of Cephas, then of the twelve” ([[1 Cor. 15:5]]), and it makes Peter the chief witness of the Resurrection. The verb is literally “was seen,” which puts the weight on what Peter himself saw: a direct encounter with the risen Lord, not a vision like the one Paul later had in the temple ([[Acts 22:17–21]]).

      Luke has prepared for it. Peter ran to the tomb (verse 12) and went away “wondering in himself,” and that wondering may well have grown into the faith that let the risen Lord appear to him. Some ancient manuscripts leave verse 12 out, but most keep it, including the earliest, the papyrus P75; the omission seems to come from the difficulty of fitting it with John’s account, where Peter and another disciple run to the tomb together ([[John 20:3–7]]). Coming so soon after his denial ([[Luke 22:54–62]]), the appearance seems to have restored Peter to full fellowship with the Lord and readied him to lead the infant Church again.
    sources: [brown-testimony-luke, huntsman-easter-sunday]
  - ref: 39
    phrase: a spirit hath not flesh and bones, as ye see me have
    kind: scripture
    title: A spirit hath not flesh and bones
    body: |
      The disciples “supposed that they had seen a spirit” (verse 37), something close to what we would call a ghost, the spirit of someone dead, and the light of small oil lamps may have made Him hard to make out. Jesus answers with proof they could touch. “Handle me” (Greek *psēlaphaō*) is an unusual verb: to touch in order to find out something not yet known. Luke does not mention the wounds, but with the crucifixion so recent, and with John’s account of the hands and side ([[John 20:20]]), the hands and feet He shows them may well have borne the marks of the nails.

      Put negatively, His words teach what a resurrected body is: flesh and bones, not a disembodied spirit. (Scripture’s “flesh and blood,” as in [[1 Cor. 15:50]], is a term for mortality.) Restoration scripture builds on this verse. Joseph Smith quoted it to explain that angels who are “resurrected personages” have “bodies of flesh and bones” ([[D&C 129:1–2]]), and taught that “the Father has a body of flesh and bones as tangible as man’s; the Son also” ([[D&C 130:22]]). The footnote joins the verse to the risen Lord’s visit at Bountiful, where He gave the same proof to a whole multitude and said what it was for: “that ye may know that I am the God of Israel, and the God of the whole earth, and have been slain for the sins of the world” ([[3 Ne. 11:14]]).
    sources: [brown-testimony-luke, huntsman-easter-sunday, lds-scriptures]
  - ref: 43
    phrase: he took it, and did eat before them
    kind: history
    title: And did eat before them
    body: |
      The risen Lord eats not for sustenance but as proof that He has come back to life in a real body, and everyone in the room becomes an eyewitness of it. Their joy had outrun their belief (“they yet believed not for joy,” verse 41), and the meal settles the matter: it left no one who saw it a coherent argument that the risen Jesus was not real. Peter later made the same point to the Gentile Cornelius: the witnesses were “us, who did eat and drink with him after he rose from the dead” ([[Acts 10:41]]). It was a detail that would matter to Gentile converts, whose Greek background inclined them to misunderstand what a resurrection was.

      “And of an honeycomb” is found only in later manuscripts; the earlier and better ones have the fish alone, and it may be a scribe’s addition, though that is disputed.
    sources: [brown-testimony-luke, bowen-our-hands-have-handled]
  - ref: 44
    phrase: in the law of Moses, and in the prophets, and in the psalms
    kind: scripture
    title: The law of Moses, the prophets, and the psalms
    body: |
      To the eleven Jesus names all three parts of the scriptures as they were coming to be known in His day: the Law (*Torah*), the Prophets (*Nevi’im*), and the Writings (*Ketuvim*), for which “the psalms” stands as the part for the whole. Jews still divide their Bible this way. The point is breadth: the whole of scripture concerns Him, and what it says of Him “must be fulfilled.”

      “Then opened he their understanding” (verse 45) may be the start of a longer course. In Acts Luke says that Jesus was seen by the apostles for forty days, “speaking of the things pertaining to the kingdom of God” ([[Acts 1:3]]). On one Latter-day Saint reading, verses 44–49 give the broad outline of that teaching, which began on this night.
    sources: [huntsman-easter-sunday, brown-testimony-luke]
  - ref: 47
    phrase: among all nations, beginning at Jerusalem
    kind: scripture
    title: Among all nations, beginning at Jerusalem
    body: |
      The commission sends the message to every people: the word for “nations” (*ethnē*) also means “Gentiles.” It foreshadows His last charge before the Ascension, to be witnesses “unto the uttermost part of the earth” ([[Acts 1:8]]). What they are to preach is “repentance and remission of sins … in his name,” and what fits them to preach it is verse 48: “ye are witnesses of these things.” Their calling was to be personal witnesses of His ministry and teaching and, above all, of His bodily resurrection.
    sources: [brown-testimony-luke, huntsman-easter-sunday, draper-he-has-risen]
  - ref: 49
    phrase: until ye be endued with power from on high
    kind: scripture
    title: Endued with power from on high
    body: |
      “The promise of my Father” is the Holy Ghost, which Jesus says He Himself will send (“I send”) and which came in power at Pentecost ([[Acts 2:1–4]]). “Endued” is the Greek *endyō*, “to clothe, to put on,” in a passive form: they were to be clothed with power, and the Father is the one who clothes them.

      The Lord gave the command again in this dispensation, in nearly the same words. He sent the Saints to Ohio, where “you shall be endowed with power from on high” ([[D&C 38:32]]), and when He commanded them to build the house “in the which house I design to endow those whom I have chosen with power from on high,” He said, “this is the promise of the Father unto you; therefore I command you to tarry, even as mine apostles at Jerusalem” ([[D&C 95:8–9]]).
    sources: [brown-testimony-luke, lds-scriptures]
  - ref: 51
    phrase: he was parted from them, and carried up into heaven
    kind: history
    title: Carried up into heaven
    body: |
      Read on its own, the chapter seems to fit everything into one day: the tomb at dawn, Emmaus that afternoon, the eleven that evening (verses 13, 33, 36), and then, with no break in the telling, the walk toward Bethany and the Ascension. Luke’s second book says that the risen Lord was seen by the apostles for forty days before He ascended from the Mount of Olives ([[Acts 1:3]]; [[Acts 1:9–12]]). One Latter-day Saint reading takes the ascent here as a different, interim one, the next morning, about a day after the Resurrection: Luke describes the two with different verbs, and no angels attend this one, as they do the ascension in [[Acts 1:10–11]]. “As far as to Bethany” means toward Bethany, which puts the group on the Mount of Olives, perhaps near the place of the later ascension. A few manuscripts leave out “and carried up into heaven,” but the earliest, P75, has it.

      Whichever ascent Luke describes, his Gospel ends differently from the others. Matthew’s and John’s close with Jesus still with His disciples ([[Matt. 28:20]]; [[John 21:22]]); Luke’s closes with the risen Lord ascended into heaven, where He awaits those who will follow Him. With this parting, the time of His mortal ministry, “while I was yet with you” (verse 44), gives way to His ministry from heaven.
    sources: [sc-knowhy-678, brown-testimony-luke, huntsman-lukes-jesus]
  - ref: 53
    phrase: were continually in the temple, praising and blessing God
    kind: structure
    title: Continually in the temple
    body: |
      Luke’s Gospel ends where it began. It opened in the temple, with Zacharias burning incense ([[Luke 1:9]]); it closes with the disciples there continually, and in Acts they keep meeting in the temple and in their houses ([[Acts 2:46]]). Their worship of Jesus (verse 52) is something new: no one in Luke’s Gospel has worshipped Him before. Their “great joy” answers the angel’s “good tidings of great joy” at His birth ([[Luke 2:10]]): the heavens that opened to announce Him have opened again to receive Him.

      The joy is also the end Luke wrote for. He had promised Theophilus “the certainty” of what he had been taught ([[Luke 1:4]]), and this chapter, with its witnesses who saw, handled and ate with the risen Lord, is where that certainty rests. He closes with disciples who know, and in hope that his readers will come to the same joy.
    sources: [brown-testimony-luke, huntsman-lukes-jesus, bowen-our-hands-have-handled]

christ: |
  Luke 24 shows Jesus Christ risen in the body that was crucified, with hands and feet the disciples could handle and a mouth that ate before them (verses 39–43). He is the Christ who had to suffer before entering His glory (verse 26), the one all the scriptures speak of (verse 27), and the Lord who is known in the breaking of bread (verse 35). Disciples now meet the same Lord where the two at Emmaus met Him, in the scriptures He opens and in the bread blessed and broken “in remembrance” of Him ([[Luke 22:19]]), and the Spirit’s witness that He lives comes as He promised, as a bosom that burns within ([[D&C 9:8]]).

explore: |
  - **The other tellings.** [[Matt. 28:1–20]], [[Mark 16:1–20]] and [[John 20:1–29]], with [[John 21:1–14]] for the meal by the Sea of Galilee.
  - **The witnesses.** Paul’s list of those who saw the risen Lord, beginning with Cephas, in [[1 Cor. 15:3–8]]; Peter’s witness to Cornelius in [[Acts 10:39–43]].
  - **The forty days and the Ascension.** [[Acts 1:1–12]], where Luke takes up the story again.
  - **Another people who handled Him.** [[3 Ne. 11:1–17]], the risen Lord’s appearance at the temple in Bountiful.
  - **Emmaus.** The KnoWhy “Why Did Christ Appear to Two Disciples on the Road to Emmaus?” (Scripture Central, 2024) reads the walk as a lesson in recognizing Christ in the scriptures.

