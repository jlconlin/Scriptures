chapter: 15
title: This Man Receiveth Sinners
tagline: When the Pharisees and scribes murmur that Jesus welcomes sinners and eats with them, He answers with three stories of the lost and found, a sheep, a coin and a son, and ends with an elder brother who will not come in to the feast.
when: 'On the journey to Jerusalem; in this site’s chronology, the Perean and Judean ministry'

setting: |
  Luke 15 goes on from the meal in a Pharisee’s house in chapter 14, where Jesus taught that a host should share his table with the poor, the maimed, the lame and the blind ([[Luke 14:12–14]]), and told of a feast filled from the streets and the highways ([[Luke 14:21–23]]). Now the complaint is that He does exactly that. Chapter 14 was about what it costs to become a disciple; chapter 15 is about holding on to what a disciple has received, and about recovering what is lost.

  The whole chapter is told only by Luke. From chapter 13 to the middle of chapter 18 only small portions of Luke’s account are found in Matthew or Mark. Matthew does have a parable of a sheep lost from a hundred ([[Matt. 18:12–14]]), but there Jesus tells it to the disciples, about “these little ones.” Here He tells it to His critics, about sinners. The settings are different enough to justify reading Jesus as telling a similar story on two occasions to make a fresh point.

  Joseph Smith preached on this chapter on the floor of the unfinished temple in January 1843 and gave a rule for reading it that the notes below follow: ask what question drew the parable out.

thread: |
  **Three lost things, one answer to one complaint.**

  The Pharisees and scribes grumble that “this man receiveth sinners, and eateth with them” (verse 2). Jesus answers with three stories that turn on the same pair of words, *lost* and *found*, and end the same way, in a celebration someone is invited to share. They also climb. One sheep is lost from a hundred, one coin from ten, one son from two; the loss grows dearer each time. The sheep strays, the coin is lost through carelessness, the son walks out of his own will, and yet each is searched for or waited for until it comes home.

  The third story does not stop when the lost son is found. It turns to the son who never left and now will not come in, and the father goes out to plead with him as he ran out to meet the other. Joseph Smith saw in that son the men who murmured in verse 2 (see the note on verse 3). Jesus does not say how it ends: the story stops before the elder brother goes in or turns away.

sections:
  - range: 1-2
    heading: He receiveth sinners
    plain: |
      All the tax collectors and sinners were coming near to listen to Jesus. And the Pharisees and the scribes kept grumbling, “This man welcomes sinners and eats with them.”
  - range: 3-7
    heading: The lost sheep
    plain: |
      So He told them this parable: “Which of you, if he has a hundred sheep and loses one of them, doesn’t leave the ninety-nine in the open country and go after the lost one until he finds it? And when he finds it, he puts it on his shoulders, rejoicing. When he gets home, he calls his friends and neighbors together and says, ‘Rejoice with me; I have found my sheep that was lost.’ I tell you, in the same way there will be more joy in heaven over one sinner who repents than over ninety-nine righteous people who need no repentance.”
  - range: 8-10
    heading: The lost coin
    plain: |
      “Or what woman who has ten silver coins, if she loses one, doesn’t light a lamp, sweep the house and search carefully until she finds it? And when she has found it, she calls her friends and neighbors together and says, ‘Rejoice with me; I have found the coin I lost.’ In the same way, I tell you, there is joy in the presence of the angels of God over one sinner who repents.”
  - range: 11-24
    heading: The son who left
    plain: |
      Then He said, “A man had two sons. The younger one said to his father, ‘Father, give me the share of the property that will come to me.’ So the father divided his estate between them. Not many days later the younger son gathered up everything he had and went off to a distant country, and there he squandered his property in reckless living.

      “When he had spent it all, a severe famine struck that country, and he began to go hungry. So he went and hired himself out to one of its citizens, who sent him into his fields to feed pigs. He longed to fill his stomach with the carob pods the pigs were eating, and no one gave him anything.

      “When he came to his senses, he said, ‘How many of my father’s hired workers have more than enough bread, and here I am dying of hunger! I will get up and go to my father and say to him, “Father, I have sinned against heaven and against you. I am no longer worthy to be called your son. Treat me like one of your hired workers.”’ So he got up and went to his father.

      “While he was still a long way off, his father saw him and was filled with compassion. He ran to his son, threw his arms around his neck and kissed him. The son said to him, ‘Father, I have sinned against heaven and against you. I am no longer worthy to be called your son.’ But the father said to his servants, ‘Bring the best robe and put it on him. Put a ring on his hand and sandals on his feet. Bring the fattened calf and kill it, and let us eat and celebrate. For this son of mine was dead and is alive again; he was lost and is found.’ And they began to celebrate.”
  - range: 25-32
    heading: The son who stayed
    plain: |
      “Meanwhile the elder son was out in the field. As he came near the house, he heard music and dancing. He called one of the servants and asked what was going on. ‘Your brother has come home,’ he told him, ‘and your father has killed the fattened calf, because he has him back safe and well.’ The elder brother was angry and refused to go in. So his father came out and pleaded with him.

      “But he answered his father, ‘Look! All these years I have served you and never disobeyed your command, and you never gave me even a young goat so I could celebrate with my friends. But when this son of yours comes home, who has eaten up your property with prostitutes, you kill the fattened calf for him!’

      “‘My son,’ the father said, ‘you are always with me, and everything I have is yours. But we had to celebrate and be glad, because this brother of yours was dead and is alive again; he was lost and is found.’”

notes:
  - ref: 2
    phrase: This man receiveth sinners, and eateth with them
    kind: history
    title: Sinners at His table
    body: |
      The complaint is about meals, and to a Pharisee meals were holy ground. Pharisees and their scribes treated the home table almost as a temple: they tithed the smallest herbs, prepared food and vessels by rule, washed before eating, and would not share a table with guests whose uncleanness would make the table and its food unclean. “Publicans” were tax collectors, but the word stood for all who worked in despised trades; “sinners” were people known for immoral lives, such as harlots, adulterers and swindlers, cut off from respectable society. Such people had little access to the word of God read aloud in the synagogue, which is why Luke says they came near “for to hear him.”

      So when the Pharisees say Jesus “eateth with them,” they mean He has taken outcasts fully into His company. Without meaning to, they bear witness that His actions match His teaching. “This man” is contemptuous in the Greek, and “murmured” is the word the Greek Old Testament uses for Israel’s grumbling against Moses and the Lord in the wilderness, which puts the critics in unflattering company. Luke’s tense suggests they kept it up.
    sources: [brown-testimony-luke]
  - ref: 3
    phrase: he spake this parable unto them
    kind: prophets
    title: The question that drew out the parable
    body: |
      Joseph Smith took this chapter as his text on 29 January 1843 and used it to teach how to read a parable. Elders in his day, he said, preached it with no rule of interpretation and strained to find nations in it, Abraham’s seed or Ephraim. His rule was different: “I have [a] Key by which I understand the scripture—I enquire what was the question which drew out the answer.” Here the question is verse 2. “Pharisees & scribes murmurred! this man receives sinners & eatheth with them this is the key word.” William Clayton summed up the sermon in his diary: the parable “did not refer to any nation, but was mearly an answer to the remark ‘he recieveth the sinners and eateth with them.’”

      Read that way, the three stories are one reply. In the notes of the sermon, Jesus is telling the Pharisees that if they are safe in the sheepfold, He has no mission to them; He was sent to look for the lost. The elder son is the Pharisees and Sadducees, “murmuring & complaining—because Jesus sat with publicans & sinners.” The father who comes out and entreats him is set beside John, who baptized all who came to him; yet when Jesus came, the notes say, the Pharisees “were angry & would not go in,” as the elder son would not. Joseph Smith turned the point back on the nation reading: “If we interpret this to national, view where is the eldest son?”

      The reports are brief notes taken by those who heard him, not Joseph Smith’s words as he spoke them, but the reading is plain in them, and it is the one this chapter follows.
    sources: [ehat-cook-words-1843-01-29]
  - ref: 4
    phrase: leave the ninety and nine in the wilderness
    kind: history
    title: Leaving the ninety and nine
    body: |
      Jesus’s hearers would have assumed that no owner walks off and abandons ninety-nine sheep to look for one. The scene pictured is a shepherd counting his flock as he brings it in for the night, so the missing sheep would be noticed late in the day and the search would go on into the dark; the others would most likely be left in the care of another shepherd whose flock shared the fold. “Wilderness” is not a desert here, only the open hill country where sheep grazed.

      The Joseph Smith Translation moves the words: the man leaves the ninety and nine “and go into the wilderness after that which is lost” (JST Luke 15:4, in the footnote). Read that way, the flock is left safe, and it is the seeker who goes into the wild. And he goes “until he find it,” a clause only Luke has: the owner does not give up.
    sources: [brown-testimony-luke, lds-scriptures]
  - ref: 6
    phrase: I have found my sheep which was lost
    kind: christ
    title: My sheep
    body: |
      The man in the story is not a hired shepherd, a despised job in that society, but the owner: he has a hundred sheep, and the lost one is “my sheep.” That points back to Ezekiel. There the Lord condemned Israel’s shepherds, who fed themselves and let the flock scatter with none to “search or seek after them” ([[Ezek. 34:6]]), and promised to do the work Himself: “Behold, I, even I, will both search my sheep, and seek them out” ([[Ezek. 34:11]]), and “I will seek that which was lost” ([[Ezek. 34:16]]). The parable’s seeker is God, who looks for His own one by one.

      The detail of the shoulders fits. The picture is of a sheep too tired to follow its owner back to the fold, so that his care goes to one of the weaker of his flock. Then he calls in friends and neighbors, and the words assume a celebration meal: the parable ends at a table, as the complaint in verse 2 began at one.
    sources: [brown-testimony-luke, lds-scriptures]
  - ref: 7
    phrase: ninety and nine just persons, which need no repentance
    kind: words
    title: Just persons, which need no repentance
    body: |
      Jesus may be speaking with irony. Everyone needs repentance; those who “need no repentance” are those who, in their own minds, do not.

      Does heaven then rejoice more over the repentant sinner than over the faithful? Possibly, in the way the father rejoices over his son who came home. But the joy in heaven does not seem to spell out a reward, one withheld from those who never left. The chapter gives its own answer at its end, where the father tells the son who stayed, “all that I have is thine” (verse 31), words he does not say to the one who came back.
    sources: [brown-testimony-luke]
  - ref: 8
    phrase: ten pieces of silver
    kind: history
    title: The lost coin
    body: |
      The coin was a drachma, about a day’s wage, so the woman has lost a tenth of a small store. There may be more to it. Women are known to have worn such coins in their scarves as a sign of marriage, perhaps given at the wedding, and if this is such a coin its worth to her is more than its price. The house is a poor one: she lights a little clay lamp to see into the corners of a dark room that may have no windows, and searches every surface of a dirt floor. Luke pairs her with the man who owns a hundred sheep, a man and a woman doing what God does, as he pairs men and women elsewhere in his Gospel.

      Elder James E. Talmage drew a lesson from how the coin is lost: not by straying, like the sheep, but through someone’s lack of care. In his reading the woman stands for the Church in any dispensation. The coins, each bearing the image of the King, are the souls committed to its care. The lost one stands for souls neglected and “lost sight of, by the authorized ministers of the Gospel of Christ.” It is an application; the parable’s own conclusion is the joy of verse 10 over one sinner who repents.
    sources: [brown-testimony-luke, talmage-jesus-christ-27]
  - ref: 12
    phrase: give me the portion of goods that falleth to me
    kind: history
    title: The portion that falleth to me
    body: |
      Under the law of Moses the firstborn received a double portion ([[Deut. 21:17]]), so with two sons the younger’s share was a third of the estate. A father could leave property by will, or give it to his children while he lived and keep the income from it until his death. This father seems to have done the second. He divides his living between them, but he still runs the farm, gives orders to the servants and speaks of “all that I have” (verse 31): the elder son’s two thirds are his on paper, not yet in hand.

      The younger son turns his third into money (“gathered all together” means he sold up) and leaves. In doing so he also walks away from the duty of a son to honor and care for his parents in their old age, which the elder son stays to fulfill.
    sources: [brown-testimony-luke]
  - ref: 13
    phrase: wasted his substance with riotous living
    kind: words
    title: Riotous living
    body: |
      The Greek adverb behind “riotous,” *asōtōs*, means dissolutely, profligately; the Greek does not say whether the son lived wildly or simply squandered his money on luxuries, and both fit. The older brother will say it went on harlots (verse 30).

      “Substance” is the same word as “goods” in verse 12, *ousia*, property. He has turned his share into cash, but it is still his father’s living he is throwing away, which is how his brother will put it. The title tradition has given the parable, “Prodigal Son,” is not Luke’s; “prodigal” means wasteful, the least important thing in the story. It is the story of a lost son.
    sources: [thayer, brown-testimony-luke, holzapfel-jackson-least-last-lost]
  - ref: 15
    phrase: he sent him into his fields to feed swine
    kind: history
    title: To feed swine
    body: |
      This is as low as a young Jew could fall. Swine were unclean under the law ([[Lev. 11:7]]), and the man who keeps them is a Gentile. The son has hired himself out to him, no longer in charge of his own life, and he envies the pigs their feed. The “husks” were carob pods (the footnote gives the Greek), fodder for animals and food for the poor. “No man gave unto him” likely means two things: the famine may have left no one able to spare even a little, and whatever friends he had made in the far country did not stay with him.

      Jesus chose the lowest picture He could, and it sharpens the question the whole chapter asks: can someone sunk this far, a keeper of pigs, be received, forgiven and welcomed home?
    sources: [brown-testimony-luke, jensen-two-sons]
  - ref: 17
    phrase: when he came to himself
    kind: prophets
    title: He came to himself
    body: |
      The Greek says it literally: he came to himself. Hunger and want humbled him from outside, but repentance began inside, when he woke to what he had done and to whom. Elder Robert D. Hales described the moment: “He remembered who he was, realized what he had been missing, and began to desire the blessings freely available in his father’s house.” What comes first in the son’s mind is not his guilt but his father’s house, where even the hired men have bread to spare.

      His prepared speech names both those he has wronged: “I have sinned against heaven, and before thee.” Sin against God is also sin against the people it hurts, and forgiveness is to be sought from both. Elder Jeffrey R. Holland added the limit of what the son can do: “When we are lost, we can ‘come to ourselves,’ but we may not always be able to ‘find ourselves,’ and, worlds without end, we cannot ‘save ourselves.’ Only the Father and His Only Begotten Son can do that.”
    sources: [brown-testimony-luke, hales-coming-to-ourselves, holland-other-prodigal]
  - ref: 20
    phrase: his father saw him, and had compassion, and ran, and fell on his neck, and kissed him
    kind: christ
    title: The father ran
    body: |
      The father sees his son “a great way off.” Luke uses the same word for distance as for the “far country” of verse 13: the son is closing the gap he opened. Then the father’s compassion becomes a string of actions: he ran, fell on his neck, kissed him. Compassion in this story is something done, not only felt. Falling on the neck is how Joseph greeted his father Jacob after long separation ([[Gen. 46:29]]).

      The son starts the speech he rehearsed and does not finish it. In verse 21 he confesses that he is not worthy to be called a son, but he never asks to be made a hired servant. Elder Talmage read it as the son’s own change: overcome by undeserved affection, he would not mar his father’s joy with that request, and would put himself wholly at his father’s disposal. Elder Holland called the father running and showering his son with kisses one of the most moving scenes in scripture: “It tells every child of God, wayward or otherwise, how much God wants us back in the protection of His arms.”
    sources: [brown-testimony-luke, talmage-jesus-christ-27, holland-other-prodigal]
  - ref: 22
    phrase: Bring forth the best robe, and put it on him; and put a ring on his hand, and shoes on his feet
    kind: symbol
    title: Robe, ring and shoes
    body: |
      Each gift answers the son’s “make me as one of thy hired servants” with a sign of sonship. The best robe was kept for honored guests. A ring marked dignity and his acceptance back into the family. Shoes said it plainest: slaves went barefoot, so sandals on his feet said he was a son, not a servant.

      The son does not dress himself; he is clothed by another, as the priests were robed at the sanctuary ([[Ex. 29:5–6]]; [[Lev. 16:23–24]]). And the robing readies him for the feast, as a guest at a wedding needed the right garment ([[Matt. 22:11–12]]): the son who came asking to be a servant is made fit to sit at his father’s table. The fatted calf was reserved for special occasions, and killing a young animal from the herd cost a farm its future increase: only a man of means could do it.
    sources: [jensen-two-sons, brown-testimony-luke]
  - ref: 24
    phrase: this my son was dead, and is alive again; he was lost, and is found
    kind: words
    title: Dead, and alive again
    body: |
      The son was not literally dead, but his father had counted him gone from the family for good, so that to the father his return was like a raising from the dead. The verb for “alive again,” *anazaō*, carries the sense of resurrection, and the story has already hinted at it: “I will arise” (verse 18) and “he arose” (verse 20) use *anistēmi*, the verb Luke uses of rising from the dead.

      The second pair of verbs ties the three stories together. “Lost” is the same word as for the sheep and the coin, and “found” here means not stumbled upon but recovered after a search. The father’s sentence is the chapter’s refrain, and he says it twice, once to the servants and once, in verse 32, to the son who stayed.
    sources: [brown-testimony-luke]
  - ref: 28
    phrase: 'he was angry, and would not go in: therefore came his father out, and entreated him'
    kind: prophets
    title: The other prodigal
    body: |
      The father leaves his own feast twice: once running down the road, and now going out to the son who will not come in. He did not have to, and the tense says he kept pleading. Both sons, in the end, need their father to come out to them. Elder Holland put it this way: the opening line “A certain man had two sons” might have gone on, “both of whom were lost and both of whom needed to come home.” The elder son is not so much angry that his brother is back as that his father is glad. He forgets “that every calf on the ranch is already his and so are all the robes in the closet and every ring in the drawer.” He “feels taken for granted by his father and disenfranchised by his brother, when neither is the case.”

      Elder Talmage, like Joseph Smith (see the note on verse 3), saw the Pharisees and scribes in this son: faithful to routine, unwilling to welcome a repentant publican, ready to call him “this thy son” but never a brother. He added at once that the parable was not for them alone but “a living perennial” for all time.
    sources: [jensen-two-sons, brown-testimony-luke, holland-other-prodigal, talmage-jesus-christ-27]
  - ref: 31
    phrase: Son, thou art ever with me, and all that I have is thine
    kind: scripture
    title: All that I have is thine
    body: |
      The father answers both of the elder son’s complaints. To “these many years do I serve thee” he says, “thou art ever with me”; to “thou never gavest me a kid” he says, “all that I have is thine.” “Son” is *teknon*, an affectionate word. The elder son has lost nothing. The younger son’s share was spent in the far country, and in the story the father cannot give it again; what is left is the elder son’s inheritance. The welcome home does not undo the loss.

      Elder Talmage warned against praising the prodigal’s repentance above his brother’s faithful service: “The devoted son was the heir; the father did not disparage his worth, nor deny his deserts.” The father’s words hold true of God’s promise to the faithful in modern revelation: whoever receives the Father receives His kingdom, “therefore all that my Father hath shall be given unto him” ([[D&C 84:38]], the footnote here).
    sources: [brown-testimony-luke, talmage-jesus-christ-27, lds-scriptures]
  - ref: 32
    phrase: this thy brother was dead, and is alive again
    kind: words
    title: This thy brother
    body: |
      The elder son would not call him a brother. “This thy son” (verse 30) is contemptuous in Greek as in English. The father answers with “this thy brother,” giving the elder son back the relationship he tried to disown. “It was meet” is the strong Greek *dei*, “it was necessary”: the father sets out the celebration as the needed response to a lost one’s return, not an indulgence.

      Then the parable stops. Jesus does not say whether the elder son went in, whether he forgave his brother, or whether the younger son kept to his new life. The hearers are left to finish it themselves, and the first hearers were the Pharisees and scribes of verse 2, who had complained of a table shared with sinners. In Joseph Smith’s reading they, like the elder son, “were angry & would not go in.”
    sources: [brown-testimony-luke, ehat-cook-words-1843-01-29]

christ: |
  The Pharisees meant it as an accusation: “This man receiveth sinners, and eateth with them.” It is the chapter’s witness of Jesus Christ. In Ezekiel the Lord promised to seek His lost sheep Himself, and here Jesus does it in front of His critics, so that His welcome of publicans and sinners is a living parable and the three stories only put it into words. He is the owner who carries the sheep home, and He shows the Father who sees the son a great way off, runs to the son who returns, and goes out to plead with the son who will not come in.

  A disciple can come to himself, but cannot save himself; only the Father and His Son can do that, and they come out to meet the one who turns toward home ([[Luke 15:20]]). The same Father’s compassion toward one child takes nothing from another; He is generous to both sons. His last words count the son who stayed among those who should make merry, so the faithful have a place at the feast beside the brother or sister who was lost and is found ([[Luke 15:31–32]]).

explore: |
