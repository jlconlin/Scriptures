  - **The shepherd who seeks his own.** [[Ezek. 34:1–16]], the promise behind the first parable.
  - **The elder brother.** Jeffrey R. Holland, “The Other Prodigal” (general conference, April 2002).
  - **The parable verse by verse.** “The Parable of the Two Sons: A Revelation about God,” in *Sperry Symposium Classics: The New Testament* (Religious Studies Center, 2006).
  - **Joseph Smith’s sermon.** The reports of 29 January 1843 in *The Words of Joseph Smith*, his key for reading parables.

