chapter: 15
title: This Man Receiveth Sinners
tagline: When the Pharisees and scribes murmur that Jesus welcomes sinners and eats with them, He answers with three stories of the lost and found, a sheep, a coin and a son, and ends with an elder brother who will not come in to the feast.
when: 'On the journey to Jerusalem; in this site’s chronology, the Perean and Judean ministry'

setting: |
  Luke 15 goes on from the meal in a Pharisee’s house in chapter 14, where Jesus taught that a host should share his table with the poor, the maimed, the lame and the blind ([[Luke 14:12–14]]), and told of a feast filled from the streets and the highways ([[Luke 14:21–23]]). Now the complaint is that He does exactly that.

  No other Gospel tells this chapter’s stories on this occasion; from chapter 13 to the middle of chapter 18 only small portions of Luke’s account are found in Matthew or Mark. Matthew does have a parable of a sheep lost from a hundred ([[Matt. 18:12–14]]), but there Jesus tells it to the disciples, about “these little ones.” Here He tells it to His critics, about sinners. The settings are different enough to justify reading Jesus as telling a similar story on two occasions to make a fresh point.

  Joseph Smith preached on this chapter on the floor of the unfinished temple in January 1843 and gave a rule for reading it that the notes below follow: ask what question drew the parable out.

thread: |
  **Three lost things, one answer to one complaint.**

  The Pharisees and scribes grumble that “this man receiveth sinners, and eateth with them” (verse 2). Jesus answers with three stories that turn on the same pair of words, *lost* and *found*, and end the same way, in a celebration someone is invited to share. They also climb. One sheep is lost from a hundred, one coin from ten, one son from two; the loss grows dearer each time. The sheep and the coin are lost; the son leaves of his own will; and each is sought or waited for until it is found.

  The third story does not stop when the lost son is found. It turns to the son who never left and now will not come in, and the father goes out to plead with him as he ran out to meet the other. Joseph Smith saw in that son the men who murmured in verse 2 (see the note on verse 3). Jesus does not say how it ends: the story stops before the elder brother goes in or turns away.

sections:
  - range: 1-2
    heading: He receiveth sinners
    plain: |
      All the tax collectors and sinners were coming near to listen to Jesus. And the Pharisees and the scribes kept grumbling, “This man welcomes sinners and eats with them.”
  - range: 3-7
    heading: The lost sheep
    plain: |
      So He told them this parable: “Which of you, if he has a hundred sheep and loses one of them, doesn’t leave the ninety-nine in the open country and go after the lost one until he finds it? And when he finds it, he puts it on his shoulders, rejoicing. When he gets home, he calls his friends and neighbors together and says, ‘Rejoice with me; I have found my sheep that was lost.’ I tell you, in the same way there will be more joy in heaven over one sinner who repents than over ninety-nine righteous people who need no repentance.”
  - range: 8-10
    heading: The lost coin
    plain: |
      “Or what woman who has ten silver coins, if she loses one, doesn’t light a lamp, sweep the house and search carefully until she finds it? And when she has found it, she calls her friends and neighbors together and says, ‘Rejoice with me; I have found the coin I lost.’ In the same way, I tell you, there is joy in the presence of the angels of God over one sinner who repents.”
  - range: 11-24
    heading: The son who left
    plain: |
      Then He said, “A man had two sons. The younger one said to his father, ‘Father, give me the share of the property that will come to me.’ So the father divided his estate between them. Not many days later the younger son gathered up everything he had and went off to a distant country, and there he squandered his property in reckless living.

      “When he had spent it all, a severe famine struck that country, and he began to go hungry. So he went and hired himself out to one of its citizens, who sent him into his fields to feed pigs. He longed to fill his stomach with the carob pods the pigs were eating, and no one gave him anything.

      “When he came to his senses, he said, ‘How many of my father’s hired workers have more than enough bread, and here I am dying of hunger! I will get up and go to my father and say to him, “Father, I have sinned against heaven and against you. I am no longer worthy to be called your son. Treat me like one of your hired workers.”’ So he got up and went to his father.

      “While he was still a long way off, his father saw him and was filled with compassion. He ran to his son, threw his arms around his neck and kissed him. The son said to him, ‘Father, I have sinned against heaven and against you. I am no longer worthy to be called your son.’ But the father said to his servants, ‘Bring the best robe and put it on him. Put a ring on his hand and sandals on his feet. Bring the fattened calf and kill it, and let us eat and celebrate. For this son of mine was dead and is alive again; he was lost and is found.’ And they began to celebrate.”
  - range: 25-32
    heading: The son who stayed
    plain: |
      “Meanwhile the elder son was out in the field. As he came near the house, he heard music and dancing. He called one of the servants and asked what was going on. ‘Your brother has come home,’ he told him, ‘and your father has killed the fattened calf, because he has him back safe and well.’ The elder brother was angry and refused to go in. So his father came out and pleaded with him.

      “But he answered his father, ‘Look! All these years I have served you and never disobeyed your command, and you never gave me even a young goat so I could celebrate with my friends. But when this son of yours comes home, who has eaten up your property with prostitutes, you kill the fattened calf for him!’

      “‘My son,’ the father said, ‘you are always with me, and everything I have is yours. But we had to celebrate and be glad, because this brother of yours was dead and is alive again; he was lost and is found.’”

notes:
  - ref: 2
    phrase: This man receiveth sinners, and eateth with them
    kind: history
    title: Sinners at His table
    body: |
      “Publicans” were the men who collected taxes, for Rome or, in Galilee, often for Herod. The Jews detested them, and a Jew who took up the work was excommunicated; yet the Gospels note again and again how readily publicans received the gospel, and this chapter’s first verse is one of those places. Their critics lumped them together with “sinners,” a label meant to disparage. The complaint was not new. In Galilee scribes and Pharisees had objected that He ate with publicans and sinners ([[Mark 2:16]]), and He had answered that it is the sick who need a physician.

      What offended was the meal. The men who murmured may well have been guests at the Pharisee’s table in chapter 14 who had followed to see what He would do, and they were shocked to find a teacher who had spoken so sternly to the professedly godly not only talking with those counted ungodly but eating with them. Jesus never defended the ways of the people He ate with. He treated them as a physician treats the sick, and as a shepherd who wants to find the strays and bring them home, which is where His answer begins.
    sources: [bd-publicans, lds-scriptures, talmage-jesus-christ-27, ellicott-luke]
  - ref: 3
    phrase: he spake this parable unto them
    kind: prophets
    title: The question that drew out the parable
    body: |
      Joseph Smith took this chapter as his text on 29 January 1843 and used it to teach how to read a parable. Elders in his day, he said, preached it with “no rule of interpretation,” and some made it about nations and Abraham; but the parable says “nothing about Ephraim Abraham.” His rule was different: “I have [a] Key by which I understand the scripture—I enquire what was the question which drew out the answer.” Here the question is verse 2. “Pharisees & scribes murmurred! this man receives sinners & eatheth with them this is the key word.” William Clayton summed up the sermon in his diary: the parable “did not refer to any nation, but was mearly an answer to the remark ‘he recieveth the sinners and eateth with them.’”

      Read that way, the three stories are one reply. In the notes of the sermon, Jesus is telling the Pharisees that if they are safe in the sheepfold, He has no mission to them; He was sent to look for the lost. The elder son is the Pharisees and Sadducees, “murmuring & complaining—because Jesus sat with publicans & sinners.” Joseph Smith turned the point back on the nation reading: “If we interpret this to national, view where is the eldest son?”

      The reports are brief notes taken by those who heard him, not Joseph Smith’s words as he spoke them, but the reading is plain in them, and it is the one this chapter follows.
    sources: [ehat-cook-words-1843-01-29]
  - ref: 4
    phrase: leave the ninety and nine in the wilderness
    kind: history
    title: Leaving the ninety and nine
    body: |
      The story need not mean that the owner abandons the ninety and nine to save one. The Joseph Smith Translation moves the words, so that the man leaves the ninety and nine “and go into the wilderness after that which is lost” (JST Luke 15:4, in the footnote): the wilderness is where the seeker goes, not where the flock is left. In Matthew’s telling, on another occasion, he likewise goes alone “into the mountains,” and the flock, it is fair to assume, is left pastured or folded in safety (see the note on [[Matt. 18:12]]).

      The point is where his care goes. Its first application is the scene around Him: love that sets all its thought and energy on one soul among the publicans and sinners gathered there. And he goes “until he find it.”
    sources: [lds-scriptures, talmage-jesus-christ-24, ellicott-luke]
  - ref: 6
    phrase: I have found my sheep which was lost
    kind: christ
    title: My sheep
    body: |
      Behind the lost sheep stands Ezekiel 34 (the footnote at verse 4 points there), where shepherds and sheep stand for the leaders and the people of Israel. Israel’s shepherds fed themselves and let the flock scatter, with none to “search or seek after them” ([[Ezek. 34:6]]), so the Lord promised to do the work Himself: “Behold, I, even I, will both search my sheep, and seek them out” ([[Ezek. 34:11]]), and “I will seek that which was lost” ([[Ezek. 34:16]]). Luke’s word “lost” carries that picture: the people neglected by their religious teachers and left to themselves, and Christ the shepherd who reclaims them, who came “to seek and to save that which was lost” ([[Luke 19:10]]).

      The Lord Himself is the solicitous Shepherd of the story, seeking what is His own, and by plain implication His example is the one the Pharisees and scribes, as leaders of the people, ought to have followed. That reading puts them in the place of shepherds rather than of sheep (the note on verse 7 gives the other). The shepherd who finds his sheep “thinks not at the time of reprimand or punishment”: he lays it on his shoulders, rejoicing.
    sources: [lds-scriptures, pike-shepherd, thayer, talmage-jesus-christ-27]
  - ref: 7
    phrase: ninety and nine just persons, which need no repentance
    kind: words
    title: Just persons, which need no repentance
    body: |
      No one is beyond the need of repentance. The call to repent went to all, and scripture says plainly that all have sinned ([[Rom. 3:23]]; [[1 Jn. 1:8]]). So the words can be heard as a protest veiled as a concession, aimed at the Pharisees’ conviction that they were the just persons who needed none: the ninety and nine who “by self-estimation had strayed not.” Some readers hear “just sarcasm” here. The other reading puts the Pharisees among the shepherds rather than the sheep (see the note on verse 6); Elder James E. Talmage judged both tenable.

      Heaven does not care less for the faithful. On Matthew’s telling, the shepherd has a steady joy in the ninety and nine who are safe, and a new joy, brighter for the grief before it, when the one comes back (see the note on [[Matt. 18:12]]).
    sources: [ellicott-luke, talmage-jesus-christ-27, talmage-jesus-christ-24]
  - ref: 8
    phrase: ten pieces of silver
    kind: history
    title: The lost coin
    body: |
      The coin was a drachma, about a day’s wage, so the woman has lost a tenth of a small store. There may be more to it. Women are known to have worn such coins in their scarves as a sign of marriage, perhaps given at the wedding, and if this is such a coin its worth to her is more than its price. The picture is of a poor woman: she lights a little clay lamp to see into the corners of a dark home that may have no windows, and searches every surface of a dirt floor. Luke pairs her with the man who owns a hundred sheep, as he pairs men and women in companion stories elsewhere in his Gospel.

      How the coin is lost invites an application: not by straying, like the sheep, but through someone’s lack of care. In Elder James E. Talmage’s reading the woman may be taken for the Church in any dispensation, the coins, each bearing the image of the King, for the souls committed to its care, and the lost one for souls neglected and “lost sight of, by the authorized ministers of the Gospel of Christ.” It is an application; the parable’s own conclusion is the joy of verse 10 over one sinner who repents.
    sources: [brown-testimony-luke, talmage-jesus-christ-27]
  - ref: 12
    phrase: give me the portion of goods that falleth to me
    kind: history
    title: The portion that falleth to me
    body: |
      Under the law of Moses the firstborn received “a double portion of all that he hath” ([[Deut. 21:17]]), so with two sons the elder’s share would be two thirds and the younger’s the rest. Luke says the father “divided unto them his living,” to both sons, which was within the law of the time. Yet afterward the father still runs the household: he gives orders to the servants and tells the elder son “all that I have is thine” (verse 31). The two hold the estate, as it were, in common, and the father keeps the direction of it.

      What was wrong was the asking. To demand his portion while his father lived was “an instance of deliberate and unfilial desertion”: in Elder Talmage’s reading, the duties of the family had grown distasteful to the young man and the discipline of home irksome, and he meant to break every tie with it.
    sources: [lds-scriptures, ellicott-luke, jensen-two-sons, talmage-jesus-christ-27]
  - ref: 13
    phrase: wasted his substance with riotous living
    kind: words
    title: Riotous living
    body: |
      The Greek adverb behind “riotous,” *asōtōs*, means dissolutely, profligately: without restraint and without thrift. The Greek does not say whether the son lived wildly or simply squandered his money on luxuries, and both fit. The older brother will say it went on harlots (verse 30).

      “Substance” is the same word as “goods” in verse 12, *ousia*, property: what he wastes is still the share of his father’s estate, though he has turned it into cash, so he is throwing away his father’s money and not only his own. His brother will put it the same way: “thy living” (verse 30). The title tradition has given the parable, “Prodigal Son,” is not Luke’s; “prodigal” means wasteful, the least important thing in the story. It is the story of a lost son.
    sources: [thayer, brown-testimony-luke, holzapfel-jackson-least-last-lost]
  - ref: 15
    phrase: he sent him into his fields to feed swine
    kind: history
    title: To feed swine
    body: |
      This is as low as a young Jew could fall. Swine were unclean under the law ([[Lev. 11:7]]), and the man who keeps them is a Gentile. The son has hired himself out to him, no longer in charge of his own life, and he envies the pigs their feed. The “husks” of verse 16 were carob pods, fodder for animals and food for the poor. “No man gave unto him” may point to the famine, which left no one able to spare even a little, and to whatever friendships he had formed in the far country, which did not last.

      Jesus chose the lowest picture He could, and it sharpens the question the whole chapter asks: can someone sunk this far, a keeper of pigs, be received, forgiven and welcomed home?
    sources: [brown-testimony-luke, jensen-two-sons]
  - ref: 17
    phrase: when he came to himself
    kind: prophets
    title: He came to himself
    body: |
      The son’s repentance began inside him: the Greek says literally that he “came to himself.” Hunger and want humbled him from outside, but he woke to what he had done and to whom. He remembered who he was and what he had been missing, and began to want what his father’s house freely gave. What comes first in his mind is not his guilt but that house, where even the hired men have bread to spare.

      His prepared speech names both those he has wronged: “I have sinned against heaven, and before thee.” Sin against God is also sin against the people it hurts, and forgiveness is to be sought from both.
    sources: [brown-testimony-luke, hales-coming-to-ourselves]
  - ref: 20
    phrase: his father saw him, and had compassion, and ran, and fell on his neck, and kissed him
    kind: christ
    title: The father ran
    body: |
      The father sees his son “a great way off.” Luke uses the same word for distance as for the “far country” of verse 13: the son is closing the gap he opened. Then the father’s compassion becomes a string of actions: he ran, fell on his neck, kissed him. Compassion in this story is something done, not only felt. Falling on the neck is how Joseph greeted his father Jacob after long separation ([[Gen. 46:29]]).

      The son starts the speech he rehearsed and does not finish it. In verse 21 he confesses that he is not worthy to be called a son, but he never asks to be made a hired servant. In Elder Talmage’s reading the change is the son’s own: overcome by undeserved affection, he would not mar his father’s joy with that request, and would put himself wholly at his father’s disposal. The father running and showering his son with kisses is one of the most moving scenes in scripture, and “it tells every child of God, wayward or otherwise, how much God wants us back in the protection of His arms.”
    sources: [brown-testimony-luke, talmage-jesus-christ-27, holland-other-prodigal]
  - ref: 22
    phrase: Bring forth the best robe, and put it on him; and put a ring on his hand, and shoes on his feet
    kind: symbol
    title: Robe, ring and shoes
    body: |
      Each gift answers the son’s “make me as one of thy hired servants” with a sign of sonship. The best robe was kept for honored guests. A ring marked dignity and his acceptance back into the family. Shoes said it plainest: a slave went barefoot, so shoes on his feet marked him as a son, the opposite of the place he had come to ask for.

      The son does not dress himself; he is clothed by another, and the robing seems to ready him for the feast, as a guest at a wedding needed the right garment ([[Matt. 22:11–12]]): the son who came asking to be a servant is made fit to sit at his father’s table. The fatted calf was reserved for special occasions, and killing a young animal from the herd cost a farm its future increase: only a man of means could do it.
    sources: [jensen-two-sons, brown-testimony-luke]
  - ref: 24
    phrase: this my son was dead, and is alive again; he was lost, and is found
    kind: words
    title: Dead, and alive again
    body: |
      The son had not died; the feast is for “the son, once counted as dead, now alive.” “Is alive again” is used here in a figurative sense, of one who had been dead in that way and is restored to a right life. Spiritually, repentance is that passing from the death of sin to the life of righteousness, and the son had spent years “in a state of spiritual death.”

      “Lost” and “found” tie this story to the two before it and make the three one. The father says the sentence twice, once to the servants and once, in verse 32, to the son who stayed.
    sources: [ellicott-luke, talmage-jesus-christ-27, thayer, sc-knowhy-669]
  - ref: 28
    phrase: 'he was angry, and would not go in: therefore came his father out, and entreated him'
    kind: prophets
    title: The other prodigal
    body: |
      The father goes out to each son: first running down the road to meet the younger, and now leaving the feast for the elder, who will not come in. He did not have to, and the tense says he kept pleading. Both sons, in the end, need their father to come out to them. In Elder Jeffrey R. Holland’s words, the opening line “A certain man had two sons” might have gone on, “both of whom were lost and both of whom needed to come home.” The elder son is not so much angry that his brother is back as that his father is glad. He forgets “that every calf on the ranch is already his and so are all the robes in the closet and every ring in the drawer.” He “feels taken for granted by his father and disenfranchised by his brother, when neither is the case.”

      Elder Talmage, like Joseph Smith (see the note on verse 3), saw the Pharisees and scribes in this son: faithful to routine, unwilling to welcome a repentant publican, ready to call him “this thy son” but never a brother. He added at once that the parable was not for them alone but “a living perennial” for all time.
    sources: [jensen-two-sons, brown-testimony-luke, holland-other-prodigal, talmage-jesus-christ-27]
  - ref: 31
    phrase: Son, thou art ever with me, and all that I have is thine
    kind: scripture
    title: All that I have is thine
    body: |
      The father answers both of the elder son’s complaints. To “these many years do I serve thee” he says, “thou art ever with me”; to “thou never gavest me a kid” he says, “all that I have is thine.” His address, “Son,” is affectionate. The elder son has lost nothing: the younger son’s share was spent in the far country, and what remains is the elder son’s inheritance. The welcome home restores the younger son to the family, not to his place as an heir.

      So the prodigal’s repentance is not praised above his brother’s faithful service: “The devoted son was the heir; the father did not disparage his worth, nor deny his deserts.” The father’s words hold true of God’s promise to the faithful in modern revelation: whoever receives the Father receives His kingdom, “therefore all that my Father hath shall be given unto him” ([[D&C 84:38]]).
    sources: [brown-testimony-luke, talmage-jesus-christ-27, lds-scriptures]
  - ref: 32
    phrase: this thy brother was dead, and is alive again
    kind: words
    title: This thy brother
    body: |
      The elder son would not call him a brother. “This thy son” (verse 30) is contemptuous in Greek as in English. The father answers with “this thy brother,” giving the elder son back the relationship he tried to disown. “It was meet” is a strong word of necessity, “it was necessary”: the father sets out the celebration as the needed response to a lost one’s return, not an indulgence.

      Then the parable stops. Jesus does not say whether the elder son went in, whether he forgave his brother, or whether the younger son kept to his new life. The ending leaves those questions open for the hearers, and the first hearers were the Pharisees and scribes of verse 2, who had complained of a table shared with sinners. In Joseph Smith’s reading they, like the elder son, “were angry & would not go in.”
    sources: [brown-testimony-luke, ehat-cook-words-1843-01-29]

christ: |
  The Pharisees meant it as an accusation: “This man receiveth sinners, and eateth with them.” It is the chapter’s witness of Jesus Christ. In Ezekiel the Lord promised to seek His lost sheep Himself, and here Jesus does it in front of His critics, so that His welcome of publicans and sinners is a living parable and the three stories only put it into words. He is the owner who carries the sheep home, and He shows the Father who sees the son a great way off, runs to the son who returns, and goes out to plead with the son who will not come in.

  A disciple can come to himself, but “we cannot ‘save ourselves.’ Only the Father and His Only Begotten Son can do that,” and they come out to meet the one who turns toward home ([[Luke 15:20]]) and bring him into the feast they have prepared. The same Father’s compassion toward one child takes nothing from another; He is generous to both sons, and His last words to the son who stayed are “all that I have is thine” ([[Luke 15:31]]).

explore: |
