chapter: 6
title: Lord of the Sabbath, and the Sermon on the Plain
tagline: Jesus defends His disciples in the grainfields and heals a withered hand on the Sabbath; after a night of prayer He chooses the Twelve, comes down to a level place, and teaches blessings and woes, love of enemies, mercy like the Father’s, and the house built on the rock.
when: 'During Jesus’s ministry in Galilee'

setting: |
  Luke 6 opens with two Sabbath disputes that Matthew, Mark and Luke all tell one after the other: grain plucked in the fields, and a withered hand healed in a synagogue. Since the cleansing of the leper ([[Luke 5:12]]) Luke has told events in the same order as Mark. After the withered hand the two part company. Luke follows Jesus up a mountain, where He prays through the night and chooses the Twelve, and then down to a level place, where He heals a great crowd and preaches.

  The sermon that follows (verses 20–49) is Luke’s own. Many of its sayings are also in the Sermon on the Mount ([[Matt. 5]]; [[Matt. 7]]), but Luke sets it in another place, before another audience, with blessings balanced by woes; this site reads the two as separate sermons (the note on verse 17). The notes here explain each saying as Luke gives it, and link the notes on Matthew where those go further. One reading of the sermon’s plan finds three parts: blessings and woes on the conditions of this life (verses 20–26), love of enemies as an imitation of what the Father does (27–38), and how disciples treat others, down to the house built on the rock (39–49).

thread: |
  **Mercy that does what it asks.** Luke 6 turns on the moment the opposition to Jesus becomes open. In the synagogue He calls the man with the withered hand into the middle of the room and restores his hand, His own answer to the question whether the Sabbath is for doing good, and those who had watched Him “were filled with madness” (verse 11). Luke’s next sentence takes Jesus up a mountain to pray all night.

  In the morning He chooses the Twelve, comes down, and teaches: “Love your enemies, do good to them which hate you, Bless them that curse you, and pray for them which despitefully use you” (verses 27–28). Jesus does not ask His followers to do what He does not do, and from that one reading holds that in that night He was already praying for the men who had just turned against Him, a prayer heard aloud at the end from the cross ([[Luke 23:34]]). The middle of the sermon turns on the same mercy: the Father “is kind unto the unthankful and to the evil,” and the disciple is to “be merciful, as your Father also is merciful” (verses 35–36), until, fully trained, he is like his Master (verse 40).

sections:
  - range: 1-5
    heading: Grain plucked on the Sabbath
    plain: |
      One Sabbath, as Jesus was walking through the grainfields, His disciples picked heads of grain, rubbed them in their hands and ate the kernels. Some of the Pharisees said to them, “Why are you doing what is not lawful on the Sabbath?” Jesus answered them, “Have you never read what David did when he and the men with him were hungry? He went into the house of God, took the holy bread and ate it, and gave some to the men with him, though it is lawful only for the priests to eat it.” And He said to them, “The Son of Man is Lord even of the Sabbath.”
  - range: 6-11
    heading: A withered hand healed on the Sabbath
    plain: |
      On another Sabbath He went into the synagogue and taught, and a man was there whose right hand was withered. The scribes and Pharisees watched Him closely to see whether He would heal on the Sabbath, so that they could find something to accuse Him of. But He knew what they were thinking, and said to the man with the withered hand, “Get up and stand here in the middle.” The man got up and stood there. Then Jesus said to them, “Let me ask you one thing: is it lawful on the Sabbath to do good or to do harm, to save a life or to destroy it?” He looked around at them all and said to the man, “Stretch out your hand.” He did, and his hand was restored, as sound as the other. But they were filled with fury and began discussing with one another what they might do to Jesus.
  - range: 12-19
    heading: The Twelve chosen, and the crowd on the plain
    plain: |
      In those days He went out to a mountain to pray, and spent the whole night in prayer to God. When day came He called His disciples to Him and chose twelve of them, whom He also named apostles: Simon, whom He named Peter, and Andrew his brother; James and John; Philip and Bartholomew; Matthew and Thomas; James the son of Alphaeus and Simon called the Zealot; Judas the brother of James, and Judas Iscariot, who became the traitor. He came down with them and stood on a level place, with a large company of His disciples and a great multitude of people from all Judea and Jerusalem and from the coast of Tyre and Sidon, who had come to hear Him and to be healed of their diseases. Those troubled by unclean spirits were healed, and the whole crowd tried to touch Him, because power was going out from Him and healing them all.
  - range: 20-26
    heading: Blessings and woes
    plain: |
      Then He looked up at His disciples and said: “Blessed are you who are poor, for the kingdom of God is yours. Blessed are you who are hungry now, for you will be filled. Blessed are you who weep now, for you will laugh. Blessed are you when people hate you, shut you out, insult you, and reject your name as evil because of the Son of Man. Rejoice on that day and leap for joy, because your reward in heaven is great; that is how their fathers treated the prophets. But woe to you who are rich, for you have already received your comfort in full. Woe to you who are full, for you will be hungry. Woe to you who laugh now, for you will mourn and weep. Woe to you when everyone speaks well of you, for that is how their fathers treated the false prophets.
  - range: 27-36
    heading: Love your enemies
    plain: |
      “But I say to you who are listening: love your enemies, do good to those who hate you, bless those who curse you, pray for those who mistreat you. If someone strikes you on one cheek, offer the other as well; if someone takes your cloak, do not keep back your coat. Give to everyone who asks of you, and if someone takes what is yours, do not demand it back. Treat others as you would want them to treat you. If you love only those who love you, what credit is that to you? Even sinners love those who love them. If you do good only to those who do good to you, what credit is that? Even sinners do that. If you lend only to those you expect to repay you, what credit is that? Even sinners lend to sinners to get back as much again. Love your enemies instead, do good, and lend expecting nothing in return. Then your reward will be great, and you will be children of the Most High, for He is kind to the ungrateful and the wicked. Be merciful, just as your Father is merciful.
  - range: 37-42
    heading: Judge not, and the blind guide
    plain: |
      “Do not judge, and you will not be judged. Do not condemn, and you will not be condemned. Forgive, and you will be forgiven. Give, and it will be given to you: a good measure, pressed down, shaken together and running over, will be poured into the fold of your robe. The measure you use is the measure you will receive.” He also told them a parable: “Can a blind man lead a blind man? Will they not both fall into a pit? A disciple is not above his teacher, but everyone who is fully trained will be like his teacher. Why do you look at the speck in your brother’s eye and pay no attention to the beam in your own? How can you say to your brother, ‘Brother, let me take the speck out of your eye,’ when you yourself do not see the beam in your own eye? You hypocrite, first take the beam out of your own eye, and then you will see clearly to take the speck out of your brother’s eye.
  - range: 43-49
    heading: Trees, the heart, and the house on the rock
    plain: |
      “A good tree does not bear bad fruit, and a bad tree does not bear good fruit. Every tree is known by its own fruit: people do not pick figs from thornbushes or grapes from a bramble. A good person brings good things out of the good stored up in his heart, and an evil person brings evil things out of the evil stored up in his heart, for the mouth speaks what fills the heart. Why do you call me ‘Lord, Lord,’ and not do what I say? I will show you what everyone is like who comes to me, hears my words, and does them. He is like a man building a house, who dug deep and laid the foundation on the rock. When a flood came, the torrent burst against that house and could not shake it, because it was founded on the rock. But the one who hears and does not do is like a man who built a house on the ground with no foundation. The torrent burst against it, and at once it collapsed, and its ruin was great.”

notes:
  - ref: 1
    phrase: on the second sabbath after the first
    kind: words
    title: Which Sabbath?
    body: |
      The King James “second sabbath after the first” stands for one rare Greek word, *deuteroprōtos*, “second-first.” The lexicon’s best guess at its meaning is “the second of the first sabbaths after the feast of the Passover.” But the word itself is doubtful. It is missing from what are judged the best manuscripts of Luke, and modern critical editions of the Greek print simply “on a sabbath”; the King James translators found it in the Greek text they used, the Textus Receptus.

      With the word, the date is one no one can now fix with confidence; without it, Luke names no particular Sabbath at all. On that shorter reading, one view holds that by lifting the story away from a datable day Luke drives home that Jesus is Lord of every Sabbath (verse 5).
    sources: [thayer, greek-nt, brown-testimony-luke]
  - ref: 1
    phrase: rubbing them in their hands
    kind: history
    title: Reaping and threshing on a Sabbath
    body: |
      Only Luke says the disciples rubbed the ears in their hands, and the detail shows what the objection was. The law let a passer-by pluck grain by hand from a neighbor’s field, so long as he put no sickle to it ([[Deut. 23:25]]), but that was not something to do on the Sabbath. Plucking counted as reaping, and the scruple was not a Pharisaic peculiarity: nearly anyone would have thought it out of place on the holy day. Rubbing the heads so that the husks fell away added threshing and winnowing, works the Mishnah, a later code of Jewish law, forbids on the Sabbath. To a careful observer the disciples were harvesting, threshing and winnowing as they walked.

      In Luke the Pharisees put their question to the disciples themselves (“said unto them, Why do ye”), and it is Jesus who answers for them.
    sources: [lane-sabbath-synoptic, brown-testimony-luke]
  - ref: 5
    phrase: the Son of man is Lord also of the sabbath
    kind: christ
    title: Lord of the Sabbath, and its maker
    body: |
      Jesus’s answer about David (verses 3–4) does not speak to the Sabbath directly. David took the shewbread, which only priests might eat ([[Lev. 24:9]]; [[1 Sam. 21:6]]), and gave it to his hungry men; as king he had authority to eat what would otherwise have been off limits. Jesus invokes that same kingly authority for His disciples, and the saying that follows names where His own authority lies. Luke then goes straight to the conclusion, with none of the further arguments Mark and Matthew set between David and the saying ([[Mark 2:27]]; [[Matt. 12:5–7]]): “the Son of man is Lord also of the sabbath.” The weight of the story falls on who Jesus is.

      The Joseph Smith Translation of the same saying in Mark gives the reason: “For the Son of man made the Sabbath day, therefore the Son of man is Lord also of the Sabbath” (JST Mark 2:27). He is Lord of the day because He is its maker. The change keeps Jesus’s way of speaking of Himself in the third person, and makes “Son of man” a title of divinity. The note on [[Matt. 12:8]] goes further on the Sabbath and its rest.
    sources: [lane-sabbath-synoptic, jst-mark-2, lefevre-christology-jst]
  - ref: 9
    phrase: to save life, or to destroy it?
    kind: history
    title: A healing on trial
    body: |
      Saving a life on the Sabbath was unquestionably allowed. A withered hand threatened no one’s life, and Pharisees of the time would very likely have held that healing a lasting condition like this one was forbidden on the holy day. That is what the scribes and Pharisees were watching for (verse 7).

      Luke alone says it was the man’s right hand, and the detail shows how much the man had lost. A man who had to do everything with his left hand, the unclean hand, was an outcast at table and in greeting, and by the customs of the day he probably could not take part in some temple ceremonies. When his hand was “restored whole as the other,” he was made whole in his social and religious life as well as in his body.

      Jesus does not wait to be accused. He calls the man into the middle of the room and puts the question to His accusers. On one reading the synagogue becomes a kind of courtroom, and the restored hand is the evidence that acts of mercy belong on the Sabbath. Luke’s account of the response is sometimes read as milder than Mark’s, where Pharisees take counsel to destroy Him ([[Mark 3:6]]), but it is not mild. Before the healing they were seeking an accusation; afterward they were “filled with madness” (verse 11), a word (*anoia*) that here means less folly than unthinking fury.
    sources: [lane-sabbath-synoptic, brown-testimony-luke]
  - ref: 12
    phrase: continued all night in prayer to God
    kind: christ
    title: A night of prayer before the choosing
    body: |
      Only Luke says that Jesus spent the whole night in prayer before He chose the Twelve. He has shown Jesus withdrawing to pray before ([[Luke 3:21]]; [[Luke 5:16]]), and the all-night vigil marks this choice as one of special weight. The setting fits: in scripture mountains are places of communion with God, from Sinai to the mountain where Nephi was carried away in the Spirit ([[Ex. 19:20]]; [[1 Ne. 11:1]]).

      Luke does not say what Jesus prayed. Set where it is, just after His enemies “communed one with another what they might do to Jesus” (verse 11), one reading takes it as a prayer about the Twelve and on behalf of those enemies, the men He would soon command His disciples to pray for (verse 28).
    sources: [brown-testimony-luke]
  - ref: 13
    phrase: whom also he named apostles
    kind: words
    title: Named apostles
    body: |
      “Apostle” means “one sent forth,” and the name came from Jesus Himself. Luke’s phrase records the title the Lord gave the Twelve, the disciples He chose to be closest to Him during His ministry and sent out to represent Him after His ascension. Their calling was to be special witnesses of His name in all the world, above all of His divinity and His bodily resurrection.

      Luke cares about the word more than the other Gospel writers do. Matthew and Mark each use it once; Luke uses it six times in his Gospel and twenty-eight times in Acts. Today twelve men with the same calling and ordination form the Quorum of the Twelve Apostles.
    sources: [bd-apostle, brown-testimony-luke]
  - ref: 16
    phrase: Judas the brother of James
    kind: history
    title: Simon the Zealot and the two named Judas
    body: |
      Two names in Luke’s list differ from Matthew’s and Mark’s. “Simon called Zelotes” (verse 15) is the man they call “the Canaanite” ([[Matt. 10:4]]), a word that should read Cananean: it comes from the Aramaic *kanan*, of which Zelotes is the Greek and “Zealot” the English. The Zealots, named for their zeal for the law, were a party among the Jews determined to resist Roman or any foreign rule.

      “Judas the brother of James” is the apostle John calls “Judas … not Iscariot” ([[John 14:22]]). The Greek can mean son or brother of James, and he is probably the one Matthew and Mark call Thaddaeus. The other Judas, “Iscariot,” was “belonging to Kerioth,” a town of Judah, which made him the only one of the Twelve who was not a Galilean.
    sources: [bd-zelotes, bd-judas]
  - ref: 17
    phrase: stood in the plain
    kind: history
    title: A level place, and another sermon
    body: |
      “The plain” is in Greek a “level place,” and the word recalls the promise Luke quoted when John the Baptist began to preach, that before the Lord “the rough ways shall be made smooth” ([[Luke 3:5]]). The likely spot is the broad, flat ground between the Sea of Galilee and the steep hills along its northwest shore, about three miles west of Capernaum. Jesus has come down from the mountain with the Twelve, and one reading hears in it an echo of Sinai: as Israel received the law through Moses, the hearers on the plain receive a new law through Jesus, and a new people of God takes shape around twelve.

      Is this the Sermon on the Mount told again? Many of the sayings are the same, but the setting is not. Matthew has Jesus seated on a mountain, teaching the disciples who came to Him ([[Matt. 5:1]]); Luke has Him standing on level ground before a great multitude from Judea, Jerusalem, Tyre and Sidon. Some readers take the two as versions of one discourse. An older Latter-day Saint reading has Jesus teach at length on the mountainside and then repeat parts of it to the crowd below. The reading this site follows is that they are two sermons, tied to places about three miles apart, whose content does not hang together as one discourse retold: the beatitudes are completely different and carry different messages (the note on verse 20), and Luke sets against his four woes that Matthew’s sermon does not have. The note on [[Matt. 5:1]] gives both readings more fully.
    sources: [brown-testimony-luke, talmage-jesus-christ-17, sc-knowhy-659]
  - ref: 20
    phrase: Blessed be ye poor
    kind: words
    title: The poor, and those who weep now
    body: |
      Luke’s beatitudes are spoken to the hearers (“ye”), and they name conditions: poor, hungry “now,” weeping “now.” Matthew’s “poor in spirit” ([[Matt. 5:3]]) is narrower. Luke’s word is simply “the poor,” the people Jesus said at Nazareth He was anointed to preach to ([[Luke 4:18]]). Destitution can grind people down until they are humble and open to God, who is their only hope. Poverty is not a virtue in itself, though, and the Lord drew the line in this dispensation: “Wo unto you poor men, whose hearts are not broken,” whose hands reach for other men’s goods and who will not work, but “blessed are the poor who are pure in heart, whose hearts are broken, and whose spirits are contrite” ([[D&C 56:17–18]]).

      The “now” looks forward. Each blessing promises a reversal: the hungry filled, the weeping laughing, the hated and cast out with a great reward in heaven. In Christ’s kingdom the customary order, in which contentment comes from wealth and influence, is turned over, and those who suffer wrongfully in this life will see their lot reversed in the next.
    sources: [brown-testimony-luke, lds-scriptures]
  - ref: 24
    phrase: for ye have received your consolation
    kind: words
    title: Woes, and comfort paid in full
    body: |
      Luke sets four woes against the four blessings, and they answer them line for line: rich against poor, full against hungry, laughing now against weeping now, spoken well of against hated. “Woe” is less a curse than a cry. It seems to render the Hebrew *’oy*, a cry of pain or of terror at coming disaster, with a note of lament, and Jesus may be lamenting over hearers who take their comfortable lives for a reward. The verb in “ye have received” (*apechō*) is the word written on receipts for payment in full: the rich have their consolation already, and nothing more is owed them.

      Blessings set against woes is an old pattern of covenant. When Israel renewed its covenant at Mount Ebal, blessings and cursings were pronounced together ([[Deut. 27]]; [[Deut. 28]]), and on one reading Jesus follows that pattern on the plain.
    sources: [brown-testimony-luke, sc-knowhy-35]
  - ref: 29
    phrase: offer also the other
    kind: scripture
    title: Better than to revile again
    body: |
      Read alone, the command to offer the other cheek can sound like a call to invite abuse, and the blow is a hard one: Luke’s verb (*tuptō*) suggests a blow to the jaw, not merely a slap. The Joseph Smith Translation answers the question the verse raises. It adds, “or, in other words, it is better to offer the other, than to revile again,” and to the next verse, “For it is better that thou suffer thine enemy to take these things, than to contend with him. Verily I say unto you, Your heavenly Father who seeth in secret, shall bring that wicked one into judgment” (JST Luke 6:29–30). The disciple is not told that the wrong does not matter. He is told not to answer insult with insult or loss with a quarrel, and to leave the judgment of the wrongdoer to the Father.

      The Lord gave the same law in latter-day revelation: “if men will smite you, or your families, once, and ye bear it patiently and revile not against them, neither seek revenge, ye shall be rewarded” ([[D&C 98:23]]), with the reward growing each time the wrong is borne ([[D&C 98:24–27]]). The note on [[Matt. 5:39]] explains the cloak and the coat.
    sources: [jst-luke-6, brown-testimony-luke, lds-scriptures]
  - ref: 32
    phrase: what thank have ye?
    kind: words
    title: What thank have ye?
    body: |
      “Thank” here is the Greek *charis*, a word for a gift or favor, and the question is literally “What sort of gift is it to you?” Loving those who love you, doing good to those who do good to you, lending where you expect repayment: these are exchanges, and sinners make them too. Jesus moves the weight from what comes back to giving without expecting a return. The Joseph Smith Translation reads “what reward have you?” in verses 32 and 34, close to Matthew’s wording ([[Matt. 5:46]]), a change that keeps the sense of Luke’s Greek. Verse 35 completes the thought: “lend, hoping for nothing again,” where the verb, which usually means to despair, means to expect nothing in return.
    sources: [brown-testimony-luke]
  - ref: 36
    phrase: Be ye therefore merciful, as your Father also is merciful
    kind: christ
    title: Merciful, as your Father is
    body: |
      Where Matthew’s sermon reaches “Be ye therefore perfect” ([[Matt. 5:48]]), Luke’s reaches “Be ye therefore merciful,” at the same point in the teaching on love of enemies. The two may come from two sermons, but the likeness of wording and place suggests a link between growing in mercy and becoming perfect. The “therefore” points back to verse 35: the Highest “is kind unto the unthankful and to the evil,” and those who love their enemies and give without hope of return “shall be the children of the Highest.” That phrase is nearly a title. It echoes the angel’s words that Mary’s son would be called “the Son of the Highest” ([[Luke 1:32]]), and it implies a close bond with the Father and the Son, like that of King Benjamin’s people, born of Christ to become “his sons and his daughters” ([[Mosiah 5:7]]).

      On one reading, imitating the Father’s mercy lies at the center of what Jesus teaches here. To love an enemy is to do what the Savior does: to give love and mercy where justice would demand something harsher.
    sources: [frederick-merciful, brown-testimony-luke]
  - ref: 37
    phrase: Judge not, and ye shall not be judged
    kind: words
    title: Judge not, condemn not, forgive
    body: |
      Luke gives the command not to judge three companions: condemn not, forgive, give. The judging forbidden is the final judgment of another person, which belongs to the Lord, not the intermediate judgments disciples are directed to make on righteous principles, and forgiveness, which this verse names, is the command’s companion (the note on [[Matt. 7:1]] explains the distinction). The promise attached to it is firm. The Greek is an emphatic negation: those who do not judge or condemn will not be judged or condemned at all.

      The measure of verse 38 is a measure of grain, pressed down and shaken until it can hold no more and then heaped until it runs over, poured into the fold of the robe over the chest, which served as a pocket. And the measure works both ways. Those who judge and condemn, holding grudges and withholding forgiveness, will be met with the same judgment; those who forgive will receive mercy heaped up.
    sources: [oaks-judge-not, frederick-merciful, ellicott-luke]
  - ref: 40
    phrase: every one that is perfect shall be as his master
    kind: words
    title: Fully trained, like the teacher
    body: |
      “Perfect” here is not the word for complete in [[Matt. 5:48]] (*teleios*) but a verb, *katartizō*, that means properly prepared or fully trained. A pupil does not rise above his teacher; one who is fully trained becomes like him.

      The saying stands between the blind guide (verse 39) and the man with a beam in his eye (verses 41–42). Luke does not say how the three connect, but the saying’s place in the middle suggests a reading: the blind man cannot lead, the hypocrite cannot take the speck from his brother’s eye, and the disciple cannot become as his master, each for the same reason, that he has not dealt with his own weakness. Read with the rest of the sermon, the Master is Jesus. A disciple who calls Him Lord (verse 46) takes on the task of becoming like Him.
    sources: [brown-testimony-luke, belnap-wise-man, frederick-merciful]
  - ref: 46
    phrase: why call ye me, Lord, Lord, and do not the things which I say?
    kind: christ
    title: Calling Him Lord
    body: |
      The trees of verses 43–45 lead to this question. Luke turns the image to the heart: a good man brings good out of “the good treasure of his heart,” and “of the abundance of the heart his mouth speaketh.” What a person says comes out of what he intends. A rotten tree will not bear good fruit, and a rotten heart will not produce good works; Jesus looks for right desires as well as right acts.

      Then He asks about words that do not match deeds. To call Him “Lord, Lord” and not do what He says is to own His lordship with the lips and deny it in action. The parable that follows (verses 47–49) shows where that leads.
    sources: [belnap-wise-man, frederick-merciful, brown-testimony-luke]
  - ref: 48
    phrase: digged deep, and laid the foundation on a rock
    kind: symbol
    title: Digging down to the rock
    body: |
      Luke’s builder does more than choose good ground. Two Greek verbs stand together, “dug” and “went deep,” and he digs until he reaches the rock. Jesus’s words imply that the other man too had come and heard (verses 47, 49); the difference lies only in the doing. Luke’s telling does not call him foolish, as Matthew’s does ([[Matt. 7:26]]), and leaves the parable to carry its own force.

      One Latter-day Saint reading takes the two tellings as two lessons for two audiences. Disciples already on the covenant path were to look up to the rock already given them; those new to the path, like the mixed crowd on the plain, had first to dig down, laying a foundation of basic gospel knowledge and first covenants centered in Christ. The note on [[Matt. 7:24]] says who the rock is.
    sources: [brown-testimony-luke, sc-knowhy-659]

christ: |
  Luke 6 shows Jesus Christ as Lord of the Sabbath because He made it (JST Mark 2:27), who uses its hours to make a man whole and then teaches the mercy He practices: to love enemies, to pray for those who mistreat you, to be “merciful, as your Father also is merciful.” He promises that the disciple who is fully trained will be like his Master. The same law binds disciples now: “of you it is required to forgive all men” ([[D&C 64:10]]); and whoever comes to Him, hears His sayings and does them builds on the rock that the flood cannot shake.

explore: |
  - **The same stories in Matthew and Mark.** [[Matt. 12:1–14]]; [[Mark 2:23–28]]; [[Mark 3:1–19]]; [[Matt. 10:1–4]].
  - **The Sermon on the Mount, and at Bountiful.** [[Matt. 5]]; [[Matt. 6]]; [[Matt. 7]]; [[3 Ne. 12]]; [[3 Ne. 13]]; [[3 Ne. 14]].
  - **Blessings and woes in the covenant.** [[Deut. 27]]; [[Deut. 28]]; [[2 Ne. 9:27–38]].
  - **Bearing wrong without reviling.** [[D&C 98:23–48]]; [[D&C 64:9–11]].
  - S. Kent Brown’s *The Testimony of Luke* (BYU Studies, 2015), chapter 6, reads the sermon phrase by phrase and traces its three broad subjects.

