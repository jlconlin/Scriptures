chapter: 23
title: This Man Hath Done Nothing Amiss
tagline: Pilate and Herod find no fault in Jesus, the crowd chooses Barabbas, and Jesus is crucified between two criminals, praying for those who crucify Him and promising one of the criminals paradise before He commends His spirit to the Father and is laid in Joseph’s tomb.
when: 'Friday of the last week, from early morning until the Sabbath began at sundown, in Jerusalem and at Calvary outside it'

setting: |
  The council questioned Jesus at daybreak ([[Luke 22:66–71]]), and Luke 23 opens as they bring Him to Pontius Pilate, the Roman prefect of Judea from AD 26 to 36. Pilate governed from Caesarea on the coast and came up to Jerusalem only at the festivals, and this was Passover. By one reckoning the accusers reached him around eight in the morning. By noon Jesus was on the cross, and He died about three in the afternoon, with only a few hours left before the Sabbath began at sundown.

  All four Gospels tell this day. Mark gives the basic order of the Roman trial, and each of the others adds episodes of its own: Matthew the death of Judas, John a longer conversation between Jesus and Pilate, and Luke the hearing before Herod Antipas. Luke has more that no one else records: Jesus’s words to the women of Jerusalem on the road, His prayer for those who crucified Him, the second criminal who asks to be remembered, and the last words “Father, into thy hands I commend my spirit.” Luke also leaves things out, among them the scourging.

  The chapter ends with the body in the tomb and the women of Galilee resting through the Sabbath. Chapter 24 opens with those same women at the tomb at dawn on the first day of the week ([[Luke 24:1]]).

thread: |
  **Luke tells the death of Jesus as the condemnation of an innocent King who, to the end, is saving others.**

  Again and again someone declares Jesus innocent. The accusers begin, “We found this fellow perverting the nation” (verse 2), and Pilate answers them with the same verb, *find*: “I find no fault in this man” (verse 4). He says it again after Herod has found nothing worthy of death (verses 14–15), and a third time (verse 22). A crucified criminal says “this man hath done nothing amiss” (verse 41), and the centurion who watched Him die says “Certainly this was a righteous man” (verse 47). Luke’s point is that even under Roman justice Jesus stands guiltless.

  The chapter also keeps calling Him king, and nearly always in mockery: the charge “Christ a King,” Herod’s mockery, the soldiers’ “If thou be the king of the Jews,” the sign over the cross. Those who say it don’t believe it, and it is true. The taunt that goes with the title is “save thyself,” and that is the one thing this King will not do. Instead He goes on saving others. On the road He warns the women of the city; nailed to the cross He prays for the soldiers; dying, He promises a criminal paradise that same day.

sections:
  - range: 1-12
    heading: Before Pilate and Herod
    plain: |
      Then the whole council rose and led Him to Pilate. They began to accuse Him: “We found this man misleading the nation, forbidding the payment of tribute to Caesar, and saying that he himself is Christ, a king.” Pilate asked Him, “Are you the King of the Jews?” He answered, “It is as you say.” Pilate said to the chief priests and the crowd, “I find no fault in this man.” But they insisted all the more fiercely: “He stirs up the people with his teaching all through Judea, starting in Galilee and right up to here.”

      When Pilate heard Galilee mentioned, he asked whether the man was a Galilean. Learning that He came under Herod’s jurisdiction, he sent Him to Herod, who was also in Jerusalem at the time. Herod was very glad to see Jesus. He had wanted to see Him for a long time, because he had heard so much about Him, and he hoped to see Him perform some sign. He questioned Him at length, but Jesus gave him no answer at all. The chief priests and scribes stood there accusing Him fiercely. Herod and his soldiers treated Him with contempt and mocked Him; they dressed Him in a shining robe and sent Him back to Pilate. That same day Herod and Pilate became friends; before this they had been enemies.
  - range: 13-25
    heading: Barabbas chosen and Jesus condemned
    plain: |
      Pilate called together the chief priests, the rulers and the people, and said to them, “You brought me this man as one who misleads the people. I have examined him in front of you and found no fault in him on any of the charges you bring. Neither has Herod, for I sent you to him, and he has found nothing he has done that deserves death. So I will have him punished and then release him.” (He was obliged to release one prisoner to them at the feast.)

      But they all shouted together, “Away with this man! Release Barabbas to us!” Barabbas had been thrown into prison for a rebellion in the city and for murder. Pilate, wanting to release Jesus, spoke to them again, but they kept shouting, “Crucify him, crucify him!” A third time he said to them, “Why? What evil has he done? I have found no reason in him for the death penalty. I will have him punished and then let him go.” But they kept pressing him with loud shouts, demanding that he be crucified, and their voices and those of the chief priests won out. Pilate ruled that their demand should be granted. He released the man they asked for, the one in prison for rebellion and murder, and he handed Jesus over to their will.
  - range: 26-38
    heading: Crucified at Calvary
    plain: |
      As they led Him away, they seized a man named Simon from Cyrene, who was coming in from the country, and laid the cross on him to carry behind Jesus. A great crowd of people followed Him, among them women who were mourning and wailing for Him. Jesus turned to them and said, “Daughters of Jerusalem, do not weep for me; weep for yourselves and for your children. For the days are coming when people will say, ‘Blessed are the women who never had children, the wombs that never bore and the breasts that never nursed.’ Then they will begin to say to the mountains, ‘Fall on us,’ and to the hills, ‘Cover us.’ For if they do these things when the tree is green, what will happen when it is dry?”

      Two others, both criminals, were led out with Him to be executed. When they came to the place called the Skull, they crucified Him there, and the criminals with Him, one on His right and one on His left. Then Jesus said, “Father, forgive them, for they do not know what they are doing.” And they divided His clothes by casting lots. The people stood watching, and the rulers sneered at Him: “He saved others; let him save himself, if he is the Christ, God’s chosen one.” The soldiers mocked Him too. They came up and offered Him sour wine and said, “If you are the king of the Jews, save yourself.” Over Him was a notice written in Greek, Latin and Hebrew: THIS IS THE KING OF THE JEWS.
  - range: 39-43
    heading: The criminal who asked to be remembered
    plain: |
      One of the criminals hanging there kept hurling insults at Him: “If you are the Christ, save yourself and us!” But the other rebuked him: “Don’t you fear God, when you are under the same sentence? We are punished justly; we are getting what our deeds deserve. But this man has done nothing wrong.” Then he said to Jesus, “Lord, remember me when you come into your kingdom.” Jesus answered him, “Truly I tell you, today you will be with me in paradise.”
  - range: 44-49
    heading: The death of Jesus
    plain: |
      It was now about noon, and darkness came over the whole land until about three in the afternoon. The sun was darkened, and the veil of the temple was torn down the middle. Jesus cried out with a loud voice, “Father, into your hands I commit my spirit,” and having said this He breathed His last.

      When the centurion saw what had happened, he praised God and said, “Surely this was a righteous man.” All the crowds who had gathered for the sight, when they saw what had happened, beat their breasts and went home. But all who knew Him, and the women who had followed Him from Galilee, stood at a distance, watching these things.
  - range: 50-56
    heading: The burial
    plain: |
      There was a man named Joseph, a member of the council, a good and upright man, who had not agreed with the council’s decision and what they had done. He came from Arimathaea, a Jewish town, and he was waiting for the kingdom of God. He went to Pilate and asked for Jesus’s body. He took it down, wrapped it in linen, and laid it in a tomb cut in the rock, where no one had yet been laid. It was the day of preparation, and the Sabbath was about to begin.

      The women who had come with Him from Galilee followed and saw the tomb and how His body was laid. Then they went home and prepared spices and perfumed ointments, and on the Sabbath they rested, as the commandment requires.

notes:
  - ref: 2
    phrase: forbidding to give tribute to Cæsar
    kind: history
    title: Charges for a Roman ear
    body: |
      The charges the council brings to Pilate are not the question it settled at daybreak. In its own hearing the question was whether Jesus claimed to be the Son of God ([[Luke 22:70–71]]). Before the governor, and only Luke records the words, they accuse Him of misleading the nation, of forbidding the tribute to Caesar, and of claiming to be “Christ a King.” The accusation seems to have moved from religion to politics, onto ground a Roman governor would have to act on: his duties were to keep the peace and to collect the taxes.

      Luke’s reader knows the second charge is false. A few days earlier spies had put exactly this question to Jesus, and He had answered, “Render therefore unto Cæsar the things which be Cæsar’s” ([[Luke 20:20–25]]). His accusers knew His answer and twisted it. By recording both scenes, Luke shows their charges for what they were.

      Jesus’s reply to Pilate, “Thou sayest it,” is neither a denial nor a boast. He gave the council the same answer ([[Luke 22:70]]), and in neither case did He deny the title, though He meant something very different by “King of the Jews” than Pilate could. Pilate evidently heard no threat in it. His next words are “I find no fault in this man.”
    sources: [huntsman-good-friday, brown-testimony-luke]
  - ref: 4
    phrase: I find no fault in this man
    kind: history
    title: No fault in this man
    body: |
      Pilate’s verdict is the first of several in the chapter, and Luke numbers them. Pilate says it again after Herod’s hearing, adding that Herod too found “nothing worthy of death” (verses 14–15), and once more “the third time” (verse 22), now asking, “Why, what evil hath he done?” The criminal on the cross and the centurion will say the same (verses 41 and 47).

      Why, then, does Pilate twice offer to “chastise him, and release him” (verses 16 and 22)? The verb first meant to correct a child, and here it is a flogging, offered so that Pilate could then let Jesus go; it may have been meant as a lighter punishment than the scourging John reports ([[John 19:1]]). The offer shows a governor convinced of the prisoner’s innocence and afraid to oppose the crowd, hoping that the sight of Jesus treated as guilty of some minor offence would content them. Pilate’s wish to save Jesus from death was genuine, but to punish a man he had just declared innocent was a shameful concession to His accusers. It did not content them, and the governor who had declared Jesus guiltless three times “gave sentence that it should be as they required” (verse 24).
    sources: [huntsman-good-friday, ellicott-luke, talmage-jesus-christ-34]
  - ref: 7
    phrase: he sent him to Herod
    kind: history
    title: Why Pilate sent Him to Herod
    body: |
      Pilate seems to have seen in Galilee a way out. When the accusers said that Jesus had begun His work there, sending the prisoner to its ruler would presumably give Pilate a legal opinion, since the Herodians regularly advised the Romans on Jewish law and custom, and might rid him of the problem altogether. Only Luke tells of this hearing. Herod here is Herod Antipas, a son of Herod the Great and the tetrarch, or ruler, of Galilee, who had beheaded John the Baptist and had wondered who Jesus was ([[Luke 9:7–9]]). He was in Jerusalem for the Passover.

      Jesus had lived in Herod’s territory all His life, and Herod had apparently once sought His death ([[Luke 13:31]]); yet this was the first and only time the two met. Herod found nothing in Him worthy of death either, and Pilate cites that finding in verse 15. That is what the scene does for Luke’s story: two rulers under Rome, not one, have now found Jesus innocent. Verse 12 adds that Pilate and Herod became friends that day. No ancient source says why they had been enemies.
    sources: [brown-testimony-luke, huntsman-good-friday]
  - ref: 9
    phrase: he answered him nothing
    kind: scripture
    title: He answered him nothing
    body: |
      Jesus’s silence answered a ruler who wanted a show. Herod had “hoped to have seen some miracle,” literally a sign, and that puts him with the crowds who had demanded a sign from heaven and been refused ([[Luke 11:16, 29]]). The Greek tense of “questioned” shows him asking question after question for a long time, and getting nothing.

      The silence is not weakness. Herod, surrounded by accusers and soldiers and outranking the prisoner on paper, wanted words and a sign, and Jesus gave him neither; by refusing, it is Jesus and not the ruler who decides what this interview will be. For Luke the silence also fulfills the prophecy of the suffering servant, who “was oppressed, and he was afflicted, yet he opened not his mouth” ([[Isa. 53:7]]), the prophecy Abinadi quoted to King Noah’s court ([[Mosiah 14:7]]).
    sources: [brown-testimony-luke, huntsman-good-friday, lds-scriptures]
  - ref: 11
    phrase: arrayed him in a gorgeous robe
    kind: symbol
    title: A shining robe
    body: |
      “Gorgeous” translates a Greek word meaning shining or radiant, and the robe was possibly white, in contrast to Jesus’s own clothing. Two readings of the gesture have been offered, and they may both be true. It was mockery: Herod and his soldiers dressing a prisoner as a king, as Pilate’s soldiers would dress Him in purple in the other Gospels ([[Mark 15:17]]). It may also have been a verdict. Replacing His tattered clothes with clean ones could have signaled that Herod found Him innocent of the charges. Either way, Herod sent back a prisoner dressed as a king, and Luke’s reader knows that He is one.
    sources: [brown-testimony-luke, huntsman-good-friday]
  - ref: 18
    phrase: release unto us Barabbas
    kind: history
    title: Barabbas
    body: |
      Luke sets the guilty Barabbas beside the innocent Jesus. Barabbas had been imprisoned for “sedition” and murder, and Luke says so twice (verses 19 and 25). He had done in fact what the council accused Jesus of: rebellion against Rome. His name adds an irony. In Aramaic, Barabbas means “son of the father,” so that “one godless ‘son of the father’ was set free while a truly divine Son of His Heavenly Father moved on to crucifixion.”

      Verse 17, the explanation that Pilate “of necessity” had to release a prisoner at the feast, is missing from many important manuscripts, among them the earliest copy of Luke, P75, so some modern translations leave it out. The custom itself is in the other three Gospels ([[Matt. 27:15]]; [[Mark 15:6]]; [[John 18:39]]), though whether it was Pilate’s own practice, a governor’s, or a Jewish custom Pilate had adopted is unclear.
    sources: [brown-testimony-luke, huntsman-good-friday, holland-none-with-him]
  - ref: 23
    phrase: the voices of them and of the chief priests prevailed
    kind: history
    title: Whose voices prevailed
    body: |
      Luke is careful about who shouted. Pilate called together “the chief priests and the rulers and the people” (verse 13), and it was their voices and the chief priests’ that prevailed. Who “the people” were is not known. The crowd in the governor’s court may have been made up largely of the chief priests’ own retainers and supporters, who would shout as their leaders wished. Luke himself does not let the moment stand for a whole nation. At the cross he separates “the people,” who “stood beholding,” from “the rulers,” who derided Him (verse 35), and “all the people that came together to that sight” go home beating their breasts (verse 48).

      Nor does Luke let Rome off. The crowd shares the guilt with Pilate, and Pilate shares it with the authorities who delivered Jesus to him. But the question of blame does not end with Jews or Romans, because it has a second, theological side. Jesus had to die to complete His atoning work, and the sins He died for were those of every person; in that sense, beyond the guilt of those who acted that morning, all share responsibility for the circumstances of that day.
    sources: [brown-testimony-luke, huntsman-good-friday]
  - ref: 26
    phrase: that he might bear it after Jesus
    kind: symbol
    title: Bearing the cross after Jesus
    body: |
      A condemned man usually carried his own cross to the place of execution, and Jesus probably carried only the crossbeam. Luke does not say why He could not carry even that far, but He had been weakened by Gethsemane and by the scourging Luke does not describe, and the soldiers forced a passerby to do it. Simon came from Cyrene, the capital of the Roman province of Cyrenaica in North Africa, which had a community of Jews. All three Synoptic Gospels remember his name, which suggests he became well known among the disciples, perhaps a believer himself.

      Luke’s wording turns the scene into a picture. Simon carries the cross “after Jesus,” and the only other places Luke speaks of a cross are two sayings of Jesus about discipleship: “take up his cross daily, and follow me” ([[Luke 9:23]]) and “whosoever doth not bear his cross, and come after me, cannot be my disciple” ([[Luke 14:27]]). Here a man does what the sayings describe, literally.
    sources: [huntsman-good-friday, brown-testimony-luke]
  - ref: 28
    phrase: Daughters of Jerusalem, weep not for me
    kind: history
    title: Daughters of Jerusalem
    body: |
      Jesus calls them “Daughters of Jerusalem”: women of the city, though women from Galilee were in the crowd as well (verse 49). They may have belonged to the groups of women in Jerusalem who eased the sufferings of condemned men with a drink to dull the pain. Luke records no man speaking up for Him on the road, but the women wailed aloud. Only Luke has the scene.

      Jesus had been silent before the priests, under Herod’s mockery and under the soldiers’ blows. These are the first words Luke records from Him after He left Pilate, and they are about the sufferings of others, not His own. He turns their pity toward their own future. The footnote points to His warning on the Mount of Olives, “woe unto them that are with child” ([[Matt. 24:19]]; Luke has the same words at [[Luke 21:23]]), and this was His last testimony of the destruction to come. Motherhood was the glory of a Jewish woman’s life, yet in those days the childless would count themselves blessed, with fewer to weep over. The words of verse 30 come from [[Hosea 10:8]], and they return in John’s Revelation ([[Rev. 6:16]]), so the warning may also look to a judgment still future.
    sources: [ellicott-luke, talmage-jesus-christ-35, lds-scriptures]
  - ref: 31
    phrase: if they do these things in a green tree, what shall be done in the dry?
    kind: symbol
    title: The green tree and the dry
    body: |
      A green tree is still living and can bear fruit; a dry one is withered and fit only for the axe ([[Luke 13:7]]). The footnote at “green tree” points to modern scripture, where the account of the martyrdom of Joseph and Hyrum Smith uses the same figure of the righteous put to death: “if the fire can scathe a green tree for the glory of God, how easy it will burn up the dry trees to purify the vineyard of corruption” ([[D&C 135:6]]). Read that way, the green tree is Jesus, who offered the fruit of eternal life. If this could be done to Him, what would be done to the dry tree, when the destruction He had just foretold came upon the city? Another reading hears Rome behind “they”: if Pilate could send to death a man in whom he found no fault, what would his successors do to a people in revolt?

      The Joseph Smith Translation widens the saying beyond Jerusalem. It adds: “This he spake, signifying the scattering of Israel, and the desolation of the heathen, or in other words, the Gentiles” (JST Luke 23:32, in the footnote). In Joseph Smith’s reading the saying looks past the fall of one city to the scattering of all Israel and to what would come upon the Gentiles.
    sources: [lds-scriptures, ellicott-luke, talmage-jesus-christ-35]
  - ref: 34
    phrase: Father, forgive them; for they know not what they do
    kind: christ
    title: Whom He asked the Father to forgive
    body: |
      Jesus prays for His executioners at the moment they are crucifying Him. A reader naturally asks whom “them” means: the soldiers with the nails, the council that delivered Him, Pilate, everyone? The Joseph Smith Translation answers: “(Meaning the soldiers who crucified him,)” (JST Luke 23:35). The prayer that afternoon names the soldiers. On one Latter-day Saint reading, then, what Jesus asked at that moment was forgiveness for the soldiers alone, and not yet for the rulers, who stand by the cross deriding Him in the next verse; “not yet” leaves their case open rather than closed.

      That need not shut the door on anyone else. One Latter-day Saint reading finds the door in what God told Enoch about those who would perish in the Flood: the Chosen One would plead for them and suffer for their sins, and they could repent in the day He returned to the Father ([[Moses 7:38–39]]). On that reading the Savior returned to His Father with the right to plead for all who will repent, even in the next life. Whether His accusers would receive forgiveness, only He knows.

      In a survey of Church leaders’ teachings on the words from the cross, these were the words quoted most often, usually to teach that a disciple forgives those who wrong him. Leaders have applied the prayer more broadly than the JST’s soldiers: “as our advocate with the Father, He is still making that same plea today—in your behalf and in mine.” The JST says whom the prayer named that afternoon. It does not limit the Savior’s mercy.

      The earliest manuscript of Luke, P75, and many others lack this prayer. It is in keeping with Luke’s language, though, and Stephen’s dying prayer seems to echo it ([[Acts 7:60]]), which supports its being a genuine saying of Jesus, whether or not it stood in Luke’s first text. The Joseph Smith Translation keeps it and adds the clarification above.
    sources: [jst-luke-23, brown-testimony-luke, hilton-final-seven-statements, holland-peaceable-things]
  - ref: 35
    phrase: He saved others; let him save himself
    kind: christ
    title: He saved others
    body: |
      On the cross Jesus is mocked three times, in Luke by the rulers, the soldiers and one of the criminals, and each taunt says the same thing: save yourself (verses 35, 37 and 39). The taunts fit a popular idea of the Messiah as one who could deliver himself and others by a physical, perhaps military, rescue, a Messiah more like Barabbas. The soldiers’ and the criminal’s “If thou be” also echoes the devil in the wilderness: “If thou be the Son of God” ([[Luke 4:3, 9]]).

      The rulers do not hear what they are saying. “He saved others” is true, and Luke has shown it all through his Gospel: Jesus healed and saved people according to their faith ([[Luke 7:50]]; [[Luke 18:42]]). That He does not save Himself is not a failure of that power. The salvation He offers is not deliverance from the cross but through it.
    sources: [huntsman-good-friday, brown-testimony-luke]
  - ref: 42
    phrase: remember me when thou comest into thy kingdom
    kind: words
    title: Remember me
    body: |
      The two criminals answer Jesus differently. One joins the taunt, “If thou be Christ, save thyself and us.” The other, perhaps softened by the uncomplaining endurance of the man suffering beside him, rebukes him: “we indeed justly; for we receive the due reward of our deeds.” Then he gives the chapter’s next verdict on Jesus, “this man hath done nothing amiss.” His confession of his own guilt, and his admission that his sentence was just, were the beginning of repentance, and they led him to faith in Jesus.

      With a person as its object, the verb “remember” means to remember for good, to remember and care for. Even so, he asks for no special honor, no place at the King’s right hand. He is content not to be forgotten, sure that if the King remembers him at all it will be with mercy. The answer he receives goes beyond what he asked: not at some far-off coming but “to day,” and not only remembered but “with me” (verse 43).
    sources: [talmage-jesus-christ-35, thayer, ellicott-luke]
  - ref: 43
    phrase: To day shalt thou be with me in paradise
    kind: prophets
    title: With me in paradise
    body: |
      “Paradise” is a Persian loanword that came to mean a garden, and came to name the realm of departed spirits, specifically of the redeemed. Joseph Smith taught in 1843 that the word does not carry what Jesus meant, which was the world of spirits. As Wilford Woodruff recorded his words: “what is Paradise it is a modern word it does not answer at all to the original that Jesus made use of … But it was this day I will be with thee in the world of spirits & will teach thee.” In the same sermon, as Woodruff recorded it: “Hades shaole paradise, spirits in prision is all one it is a world of spirits.”

      Restoration scripture says what that world is: the righteous and the wicked wait there in their separate states until the resurrection ([[Alma 40:12–14]]; see the note on [[Luke 16:22]]). In the vision given to Joseph F. Smith, the Savior, between His death and resurrection, appeared among the righteous dead and preached the gospel there ([[D&C 138:18–19]]), and from among them sent messengers to the rest (see the note on [[Luke 16:26]]). So the promise to the thief is real and immediate: that same day he would be with the Lord in the world of spirits, and there he would be taught.

      It is not a promise of more than that. Church leaders who have spoken of this verse have most often been clarifying the thief’s state, and several rebutted the claim that the promise made baptism unnecessary for him. What the verse shows is mercy: Jesus, dying, gently gathers in a condemned man who turned to Him at the last.
    sources: [brown-testimony-luke, ehat-cook-words-1843-06-11, lds-scriptures, hilton-final-seven-statements]
  - ref: 44
    phrase: there was a darkness over all the earth until the ninth hour
    kind: symbol
    title: Darkness at noon
    body: |
      The darkness falls at the sixth hour, about noon, and lasts until the ninth, about three in the afternoon. It was not an eclipse, which cannot happen at the full moon of Passover. It has been taken as a miracle and as a fitting sign of the earth’s mourning over the death of her Creator. The Greek word for “earth” can also mean the land or region, and the footnote gives that sense.

      The footnotes point to the prophets who foresaw it. Amos, writing of the darkness of the day of the Lord, has God say, “I will cause the sun to go down at noon, and I will darken the earth in the clear day” ([[Amos 8:9]]). Samuel the Lamanite foretold that “in that day that he shall suffer death the sun shall be darkened and refuse to give his light” ([[Hel. 14:20]]), and in the Americas it came to pass: “it did last for the space of three days that there was no light seen” ([[3 Ne. 8:19–23]]). The Book of Mormon and latter-day Church leaders suggest that the darkness represented the life of Jesus, the Light of the World, ebbing out.
    sources: [talmage-jesus-christ-35, huntsman-good-friday, lds-scriptures]
  - ref: 45
    phrase: the veil of the temple was rent in the midst
    kind: symbol
    title: The veil torn
    body: |
      The veil was the curtain that closed off the Holy of Holies, the room that stood for the presence of God. No one passed through it but the high priest, once a year on the Day of Atonement. Its tearing has been read in several ways, and they are not exclusive: as mourning, the temple tearing its garment for the dying Messiah; as the barrier between God and humankind opened, because Christ as the great High Priest has entered once and for all by His own blood ([[Heb. 9:11–12]]; [[Heb. 10:19–20]]); and as a sign that the old temple worship was ending and the temple itself would fall.

      Luke places the tearing just before Jesus dies, where Matthew and Mark place it just after. Luke also frames his whole Gospel with the sanctuary. It began there, with Zacharias at the altar of incense ([[Luke 1:9]]); at the cross the story returns to it.
    sources: [huntsman-good-friday, brown-testimony-luke]
  - ref: 46
    phrase: Father, into thy hands I commend my spirit
    kind: christ
    title: Into thy hands
    body: |
      Luke does not give the cry of Psalm 22 that Matthew and Mark record. Instead he gives what Jesus said with that loud voice, perhaps the cry itself, and it is a prayer from another psalm: “Into thine hand I commit my spirit” ([[Ps. 31:5]]), with “Father” added at the front. Where the cry of Psalm 22 could sound like abandonment, these words speak of unshaken trust. Jesus begins and ends His suffering on the cross by addressing the Father (verses 34 and 46).

      And He gave His spirit up; no one took it. The footnote points to His own words: “No man taketh it from me, but I lay it down of myself” ([[John 10:18]]). He bowed His head and gave up His life of His own will. “Gave up the ghost” translates a verb meaning to breathe out, to breathe one’s last.
    sources: [ellicott-luke, talmage-jesus-christ-35, thayer, lds-scriptures]
  - ref: 47
    phrase: Certainly this was a righteous man
    kind: words
    title: A righteous man
    body: |
      In Matthew and Mark the centurion says, “Truly this was the Son of God” ([[Matt. 27:54]]; [[Mark 15:39]]). Luke’s word is *dikaios*, “righteous” or “just,” and when Gentiles in the Gospels use it of Jesus it means innocent, guiltless, as when Pilate’s wife calls Him “that just man” ([[Matt. 27:19]]). Luke’s wording may give the exact measure of what the centurion meant by the higher words the others record. It joins the verdicts of Pilate, Herod and the criminal: the last word on Jesus from a Roman is that He was innocent.

      Luke says only that the centurion “saw what was done.” What most likely moved him was the death itself. Soldiers at an execution had probably watched many men die slowly on a cross, but never one who seemed to die by his own will, crying with a loud voice at the end; that, with the earthquake Matthew records, may well have brought him to glorify God.

      The crowds went home beating their breasts (verse 48), awed by the darkness and by the manner of His death. The gesture is the publican’s, who “smote upon his breast” in the temple ([[Luke 18:13]]), a sign of repentance, and some who made it may have been among the thousands baptized seven weeks later ([[Acts 2:41]]).
    sources: [thayer, ellicott-luke, talmage-jesus-christ-35, brown-testimony-luke]
  - ref: 51
    phrase: The same had not consented to the counsel and deed of them
    kind: history
    title: Joseph of Arimathæa
    body: |
      A “counsellor,” the footnote explains, is a member of the Sanhedrin, the council that had just condemned Jesus. Luke had reported that they all put the question to Him and heard His answer ([[Luke 22:70–71]]), so how had Joseph not consented? The natural inference is that he opposed his colleagues when they condemned Jesus, or at least did not vote with them. Luke’s words are broad, and on one reading “the counsel” takes in all the council had planned, from Caiaphas’s advice that one man should die for the people ([[John 11:49–50]]) to the final sentence, and “the deed” what was done outside the court, the bargain with Judas and the handing over to Pilate.

      Matthew calls Joseph rich and a disciple, and John a secret disciple ([[Matt. 27:57]]; [[John 19:38]]). Luke describes him instead as “a good man, and a just,” who “waited for the kingdom of God,” as Mark also says ([[Mark 15:43]]). What he did mattered: but for him, the body of Jesus might have been thrown into the common grave of executed criminals. He asked the governor for it and buried it in haste, because the Sabbath was about to begin (verse 54).
    sources: [lds-scriptures, talmage-jesus-christ-35, ellicott-luke, huntsman-good-friday]
  - ref: 56
    phrase: rested the sabbath day according to the commandment
    kind: history
    title: The women and the Sabbath
    body: |
      The women from Galilee had followed Jesus since His ministry there ([[Luke 8:2–3]]). Most of the men drop out of sight on this day, but the women “stayed as close to Him as they could”: they watched the crucifixion from a distance (verse 49), followed Joseph to the tomb, and noted where it was and how the body was laid (verse 55).

      Jesus died about three in the afternoon, and the Sabbath began at sundown, so little time remained to prepare the body. The Sabbath did not forbid the work itself: preparing spices for the dead was allowed on the Sabbath. What had to wait was the market. Anything the women still had to buy could be bought only when the shops opened after the Sabbath ended on Saturday evening. Meanwhile they rested “according to the commandment,” keeping the Sabbath as Jesus Himself had kept it ([[Luke 4:16]]). The same women came to the tomb at first light on Sunday and became the first witnesses of the Resurrection ([[Luke 24:1–10]]).
    sources: [brown-testimony-luke, holland-none-with-him]

christ: |
  Luke 23 shows Jesus Christ as the innocent King whom every judge in the chapter found guiltless and who was crucified anyway, and as the Savior who would not save Himself because He was saving others: the women on the road, the soldiers at the cross, the criminal beside Him. He did not lose His life; He gave His spirit into the Father’s hands, as He had said no one could take it from Him ([[John 10:18]]).

  His prayer from the cross reaches a disciple’s life now. Forgiving others as we are forgiven is a share in the very essence of His Atonement, and the One who prayed for His executioners still pleads with the Father, as our advocate, on our behalf ([[1 Jn. 2:1]]).

