chapter: 9
title: Who Is This?
tagline: Jesus sends out the Twelve, feeds five thousand, hears Peter confess Him the Christ of God, foretells His death, is transfigured on the mount, heals a boy His disciples could not, and sets His face to go to Jerusalem.
when: 'The close of the ministry in Galilee: the towns of Galilee, a desert place near Bethsaida, a mountain, and at the chapter’s end the road toward Jerusalem through a village of the Samaritans'

setting: |
  Luke 9 is the last chapter of the ministry in Galilee and the hinge of the Gospel. It begins with the Twelve sent out to preach and heal, and passes through the feeding of the five thousand, the first prediction of Jesus's death and the Transfiguration to the verse where He turns toward Jerusalem ([[Luke 9:51]]). From that verse to His arrival at the city's outskirts in [[Luke 19:28]], Luke tells a long final journey, and much of what is told only in Luke stands inside it. The Transfiguration is dated to about October, some six months before His death.

  Matthew and Mark tell most of these stories too, but Luke tells them in a closer sequence. Between the feeding and Peter's confession Luke has nothing of [[Mark 6:45–8:26]] (the walking on the water, the dispute over washing, the Syrophoenician woman, the four thousand), so in Luke the confession follows the loaves directly. He also tells the death of John the Baptist only in Herod's own words (verse 9), having told John's imprisonment earlier ([[Luke 3:19–20]]). Several things are told only here: Jesus praying before the confession and on the mount, what Moses and Elias spoke of, the disciples' sleep, the Samaritan village, and the third would-be follower.

thread: |
  **Who is this?** Herod asks the chapter's question (verse 9), and most of the chapter answers it. The Twelve go out with His power; He feeds a multitude in the wilderness as God once fed Israel; Peter names Him “The Christ of God”; on the mountain the Father names Him “my beloved Son.” The highest of these answers are joined at once to the cross. After Peter's confession He says the Son of man must suffer; on the mount Moses and Elias speak of His departure at Jerusalem; coming down He says it again. Luke sets the glory of the Transfiguration between those two predictions, so that the one Herod wonders about is seen as the Son who goes to die.

  The other half of the answer is what it asks of those who follow. Discipleship comes at the chapter's beginning (the Twelve leave at once), in its middle (take up the cross daily), and at its end, where three would-be followers meet a Lord who has set His face to go to Jerusalem and does not look back.

sections:
  - range: 1-6
    heading: The Twelve sent out
    plain: |
      Jesus called the Twelve together and gave them power and authority over all devils and to cure diseases, and sent them out to preach the kingdom of God and to heal the sick. “Take nothing for the road,” He told them: “no staff, no bag, no bread, no money, and not two coats each. Whatever house you enter, stay there until you leave that town. And wherever people will not receive you, when you leave that town shake the very dust off your feet as a testimony against them.” So they went out through the villages, preaching the good news and healing everywhere.
  - range: 7-9
    heading: Herod’s question
    plain: |
      Herod the tetrarch heard of all that was being done, and he was at a loss, because some were saying that John had been raised from the dead, some that Elijah had appeared, and others that one of the ancient prophets had risen. Herod said, “John I beheaded. But who is this, about whom I hear such things?” And he tried to see Him.
  - range: 10-17
    heading: The feeding of the five thousand
    plain: |
      When the apostles came back, they told Jesus all they had done. He took them and withdrew privately to a deserted place belonging to the town called Bethsaida. But the crowds learned of it and followed, and He welcomed them, spoke to them of the kingdom of God, and healed those who needed healing. As the day began to end, the Twelve came to Him and said, “Send the crowd away, so they can go to the villages and farms around and find lodging and food, for we are in a deserted place here.” But He said to them, “You give them something to eat.” They said, “We have no more than five loaves and two fish, unless we are to go and buy food for all these people.” For there were about five thousand men. He told His disciples, “Have them sit down in groups of about fifty.” They did so and had them all sit down. Then He took the five loaves and the two fish, looked up to heaven, blessed them, broke them, and gave them to the disciples to set before the crowd. They all ate and were filled, and what was left over was gathered up, twelve baskets of broken pieces.
  - range: 18-21
    heading: Peter’s confession
    plain: |
      Once, when Jesus was praying alone and His disciples were with Him, He asked them, “Who do the crowds say that I am?” They answered, “John the Baptist; others say Elijah; and others that one of the ancient prophets has risen.” He said to them, “But who do you say that I am?” Peter answered, “The Christ of God.” He strictly charged and commanded them to tell this to no one,
  - range: 22-27
    heading: The Son of man must suffer; taking up the cross
    plain: |
      saying, “The Son of man must suffer many things, be rejected by the elders, the chief priests and the scribes, be killed, and on the third day be raised.” Then He said to all of them, “If anyone wants to come after Me, let him deny himself, take up his cross every day, and follow Me. For whoever wants to save his life will lose it, but whoever loses his life for My sake will save it. What does it profit a man to gain the whole world and lose or forfeit himself? Whoever is ashamed of Me and My words, of him the Son of man will be ashamed when He comes in His own glory and the glory of the Father and of the holy angels. I tell you truly, some standing here will not taste death until they see the kingdom of God.”
  - range: 28-36
    heading: The Transfiguration
    plain: |
      About eight days after He said these things, He took Peter, John and James and went up on the mountain to pray. As He was praying, the appearance of His face was changed, and His clothing became dazzling white. Two men were talking with Him, Moses and Elijah, who appeared in glory and spoke of His departure, which He was about to bring to fulfillment at Jerusalem. Peter and those with him were weighed down with sleep, but when they were fully awake they saw His glory and the two men standing with Him. As the men were leaving Him, Peter said to Jesus, “Master, it is good for us to be here. Let us make three shelters, one for You, one for Moses and one for Elijah,” not knowing what he was saying. While he was saying this, a cloud came and overshadowed them, and they were afraid as they entered the cloud. And a voice came out of the cloud: “This is My beloved Son. Hear Him.” When the voice had spoken, Jesus was found alone. They kept silent, and in those days told no one anything of what they had seen.
  - range: 37-42
    heading: The boy the disciples could not heal
    plain: |
      The next day, when they had come down from the mountain, a great crowd met Him. A man in the crowd shouted, “Teacher, I beg You to look at my son, for he is my only child. A spirit seizes him and he suddenly cries out; it throws him into convulsions until he foams at the mouth, and it will hardly leave him, battering him as it goes. I begged Your disciples to cast it out, and they could not.” Jesus answered, “O faithless and perverse generation, how long must I be with you and bear with you? Bring your son here.” Even while the boy was coming, the devil threw him down in a convulsion. But Jesus rebuked the unclean spirit, healed the boy, and gave him back to his father.
  - range: 43-45
    heading: His death foretold a second time
    plain: |
      And they were all astonished at the majesty of God. While everyone was marveling at all that Jesus did, He said to His disciples, “Let these words sink into your ears: the Son of man is going to be delivered into the hands of men.” But they did not understand this saying; it was hidden from them so that they did not grasp it, and they were afraid to ask Him about it.
  - range: 46-50
    heading: Who is the greatest; forbid him not
    plain: |
      An argument arose among them over which of them was the greatest. Jesus, knowing the thoughts of their hearts, took a child and stood him beside Him, and said to them, “Whoever receives this child in My name receives Me, and whoever receives Me receives the One who sent Me. For he who is least among you all is the one who is great.” John answered, “Master, we saw someone casting out devils in Your name, and we tried to stop him, because he does not follow with us.” Jesus said to him, “Do not stop him, for whoever is not against us is for us.”
  - range: 51-56
    heading: He sets His face toward Jerusalem; a Samaritan village
    plain: |
      When the days drew near for Him to be taken up, He resolutely set His face to go to Jerusalem. He sent messengers ahead of Him, and they went into a village of the Samaritans to make ready for Him. But the people there would not receive Him, because He was set on going to Jerusalem. When His disciples James and John saw this, they said, “Lord, do You want us to command fire to come down from heaven and consume them, as Elijah did?” But He turned and rebuked them: “You do not know what kind of spirit you are of. For the Son of man has not come to destroy people’s lives, but to save them.” And they went on to another village.
  - range: 57-62
    heading: The cost of following
    plain: |
      As they were going along the road, a man said to Him, “Lord, I will follow You wherever You go.” Jesus said to him, “Foxes have dens and the birds of the air have nests, but the Son of man has nowhere to lay His head.” To another He said, “Follow Me.” But he said, “Lord, let me first go and bury my father.” Jesus said to him, “Let the dead bury their own dead; but you go and proclaim the kingdom of God.” Another said, “I will follow You, Lord, but let me first go and say farewell to those at my home.” Jesus said to him, “No one who puts his hand to the plough and then looks back is fit for the kingdom of God.”

notes:
  - ref: 1
    phrase: gave them power and authority
    kind: words
    title: Power and authority
    body: |
      Luke names two gifts where Matthew and Mark name one. In their accounts the Twelve receive *exousia*, authority over unclean spirits, which the King James Version renders “power” ([[Matt. 10:1]]; [[Mark 6:7]]). Luke gives them *dynamis* and *exousia* together, and the two words are not the same: *dynamis* is the capacity to act, *exousia* the right to act. Luke sets them side by side again when the Seventy return: “I give unto you power to tread on serpents and scorpions, and over all the power of the enemy” ([[Luke 10:19]]). The Twelve go out with both, and verse 6 shows them at work: they preached and healed “every where.”
    sources: [cambridge-luke, thayer]
  - ref: 3
    phrase: neither staves
    kind: history
    title: Neither staves
    body: |
      A reader who has just read Mark finds a contradiction: Mark has Jesus command them to take nothing “save a staff only” ([[Mark 6:8]]), and Luke has “neither staves.” Forbidding a staff seems to mean that they were to carry no means of defending themselves: they go harmless and peaceful, and unlike the wandering preachers of the day. The accounts can be held together by hearing one point in both, “Go as you are,” rather than two rules about a staff. What the list does in every account is plain from the next verse: with no money, no bread and no spare coat, the Twelve depend wholly on the hospitality of the houses that take them in.
    sources: [brown-testimony-luke, belnap-dust-feet]
  - ref: 5
    phrase: shake off the very dust from your feet for a testimony against them
    kind: symbol
    title: Shake off the very dust
    body: |
      Shaking off the dust is the reverse of washing a guest's feet. A host who “received” a traveler took him in, saw to his needs and gave him shelter, and the Greek word for “receive” here (*dexomai*) was one of the terms for that duty in Greek and Roman hospitality. When the guest was an envoy sent by another, receiving him also meant receiving his message. Shaking off the dust answers a town that has refused both: the envoys have not been received, and they show it.

      The Lord gave the same charge again in this dispensation, recalling the instructions He gave “my friends in days when I was with them”: “He that receiveth you not, go away from him alone by yourselves, and cleanse your feet even with water, pure water, whether in heat or in cold, and bear testimony of it unto your Father which is in heaven, and return not again unto that man” ([[D&C 84:77]]; [[D&C 84:92]]). The testimony is borne to the Father, and He sets the time and the measure of what follows.
    sources: [belnap-dust-feet, brown-testimony-luke]
  - ref: 9
    phrase: 'but who is this, of whom I hear such things? And he desired to see him'
    kind: history
    title: Who is this?
    body: |
      Herod the tetrarch is Herod Antipas (see the note on [[Luke 3:1]]). He had taken Herodias, and John had reproved him for it ([[Luke 3:19–20]]). Luke tells no story of John's death; it comes only in Herod's own words, “John have I beheaded.”

      Luke says only that Herod was “perplexed.” One reading sees a guilty man's fear in it: he had given the order that killed John, and his courtiers tried to quiet him with the gentler rumors that Jesus was Elijah or another prophet. Elijah is said to have “appeared” rather than risen because he had been taken to heaven without dying ([[2 Kgs. 2:11]]), and his coming was expected from Malachi's prophecy ([[Mal. 4:5]]). Herod's wish to see Jesus may have come from the fascination of fear, or from a faint hope that the sight would quiet his dread that John had come back. Luke tells how it was granted: when Jesus at last stood before him in Jerusalem, Herod “was desirous to see him of a long season,” hoped for a miracle, and got no answer at all ([[Luke 23:8–9]]).
    sources: [bd-herod, talmage-jesus-christ-21, cambridge-luke]
  - ref: 13
    phrase: Give ye them to eat
    kind: christ
    title: Give ye them to eat
    body: |
      “Give ye them to eat” hands the problem back to the Twelve. They have just come back from preaching and healing, and they would send the crowd away to find food; five loaves and two fishes are all they have, and that seems to have been the plain food they had brought for themselves, barley loaves being the bread of the poor ([[John 6:9]]). Jesus takes what they have, blesses it, and gives it back to them to set before the crowd, so the miracle passes through their hands. How it happened is beyond explanation. It was an act of creative power, and the broken pieces left over, twelve baskets of them, were more than the whole of the little store they began with.

      The loaves have also been read as a figure of what ordinary disciples bring: many have “only talents equal to five loaves and two fishes” to offer the Savior “to help feed the multitudes,” and under the Master's touch such small gifts bless hundreds, even thousands, when the givers overcome ego and pride.
    sources: [cambridge-luke, talmage-jesus-christ-21, faust-five-loaves]
  - ref: 18
    phrase: as he was alone praying
    kind: history
    title: Alone praying
    body: |
      Only Luke says Jesus was praying when He asked the disciples who He was, and only Luke says He went up the mountain “to pray” and was transfigured “as he prayed” (verses 28–29). Luke dwells on His prayer again and again: at His baptism, when the heavens opened ([[Luke 3:21–22]]); in the wilderness ([[Luke 5:16]]); all night before He chose the Twelve ([[Luke 6:12–13]]). The stress is characteristic of him, and it reads as though he saw what follows as the result of the prayer before it; here what follows is the question that draws Peter's confession.
    sources: [ellicott-luke]
  - ref: 20
    phrase: The Christ of God
    kind: christ
    title: The Christ of God
    body: |
      “The Christ of God” is God's anointed, the one whose authority and mission come from God and from no human commissioning (on the title “Christ” and how seldom Luke uses it in the ministry, see the note on [[Luke 2:11]]). Apart from devils ([[Luke 4:41]]), Peter is the only one in the whole ministry who confesses Jesus as the Christ.

      Matthew's Peter says more: “the Son of the living God” ([[Matt. 16:16]]). In Luke no human being calls Jesus the Son of God during His ministry; that witness comes from the Father (verse 35). In Joseph Smith's revision, which the Church's edition does not print at this verse, Peter says “The Christ, the Son of God,” joining the two titles in his mouth.
    sources: [huntsman-lukes-jesus, brown-testimony-luke]
  - ref: 22
    phrase: The Son of man must suffer many things
    kind: christ
    title: The Son of man must suffer
    body: |
      The word “must” (*dei*) is Luke's word for divine necessity: the boy in the temple “must be about my Father's business” ([[Luke 2:49]]), and the risen Lord explains that “it behoved Christ to suffer” ([[Luke 24:46]]). His suffering is not an accident that overtakes the Christ; it is what being the Christ requires. This is the first of seven times in Luke that Jesus speaks of His coming death.

      A reader who knows Matthew and Mark will miss what follows there: Peter's protest and Jesus's rebuke, “Get thee behind me, Satan” ([[Mark 8:32–33]]). Luke leaves both out and goes straight on to the teaching about the cross. It seems to fit a pattern in his Gospel: he passes lightly over the failings of the disciples, so that he need not show Jesus being harsh with them. Their failure in Luke is quieter: “they understood not this saying, … and they feared to ask him” (verse 45).
    sources: [brown-testimony-luke, huntsman-lukes-jesus]
  - ref: 23
    phrase: take up his cross daily
    kind: scripture
    title: Take up his cross daily
    body: |
      The cross was no abstract figure to those who first heard this. Crucifixion was part of their world, and they knew what it cost; Jesus used the image more than once as an invitation to discipleship ([[Luke 14:27]]). To deny oneself, in that setting, is to submit one's will to the Father's, as Jesus would in Gethsemane: “not my will, but thine, be done” ([[Luke 22:42]]). “Daily” is Luke's word alone; Matthew and Mark have the cross without it ([[Matt. 16:24]]; [[Mark 8:34]]).

      What the cross means for a disciple who will not be crucified, Joseph Smith's translation of Matthew says plainly: “And now for a man to take up his cross, is to deny himself all ungodliness, and every worldly lust, and keep my commandments” (JST Matt. 16:26).
    sources: [strathearn-crucifixion, jst-matt-16]
  - ref: 24
    phrase: For whosoever will save his life shall lose it
    kind: scripture
    title: Willing to lose it
    body: |
      The saying turns on two senses of the one word “life” (*psychē*): in one half it is the life lived on earth, in the other the blessed life of God's eternal kingdom. Whoever clutches the first loses the second.

      Joseph Smith's translation reworks verses 24 and 25 (printed in the appendix): “For whosoever will save his life, must be willing to lose it for my sake; and whosoever will be willing to lose his life for my sake, the same shall save it.” And: “For what doth it profit a man if he gain the whole world, and yet he receive him not whom God hath ordained, and he lose his own soul, and he himself be a castaway?” The first change asks for willingness to lose one's life for His sake. The second ties the loss of the soul to a refusal: the man who gains the world “and yet he receive him not whom God hath ordained” loses his own soul. To be saved one must receive Him, and the phrase makes plain both Jesus's place in salvation and the source of His authority, which the same revision had stressed when He ordained the Twelve (JST Luke 8:1).
    sources: [thayer, jst-luke-9, lefevre-christology-jst]
  - ref: 27
    phrase: there be some standing here, which shall not taste of death, till they see the kingdom of God
    kind: scripture
    title: Some standing here
    body: |
      The promise is hard if the kingdom means the Lord's coming in glory, for nearly all who stood there have long since died. Joseph Smith's translation of the verse before it speaks of that coming: the Son of man will be ashamed of the ashamed “when he shall come in his own kingdom, clothed in the glory of his Father, with the holy angels” (JST Luke 9:26, in the footnote). That coming is still future. At least a partial fulfillment of the promise is John the apostle, who was standing there and who, at his own desire, still lives in the flesh. To him the Lord said, “thou shalt tarry until I come in my glory, and shalt prophesy before nations, kindreds, tongues and people” ([[D&C 7:3]]; compare [[John 21:20–23]] and [[3 Ne. 28:6–8]], to which the footnote at verse 27 points).
    sources: [talmage-jesus-christ-22, lds-scriptures]
  - ref: 28
    phrase: about an eight days after these sayings
    kind: history
    title: About an eight days
    body: |
      Matthew and Mark say “after six days” ([[Matt. 17:1]]; [[Mark 9:2]]); Luke says “about an eight days.” The two are probably one interval counted two ways: the six days leave out the day of Peter's confession and the day they went up the mountain, and Luke's eight count both. Counting the days at both ends is the same inclusive reckoning by which the chief priests could quote Jesus as saying He would rise “after three days” ([[Matt. 27:63]]) of a rising on “the third day” (verse 22). Read that way, the accounts do not disagree.

      The season matters more than the count. The Transfiguration seems to have come as the Feast of Tabernacles approached, and Peter's wish to build three tabernacles (verse 33) suggests the apostles had it in mind: at the feast each worshipper put up a little booth of boughs, into which he could retire for devotion ([[Lev. 23:42]]). So far as Peter had a purpose, it seems to have been to keep the visitors from leaving.
    sources: [talmage-jesus-christ-23, cambridge-luke, skinner-life-jesus]
  - ref: 30
    phrase: Moses and Elias
    kind: history
    title: Moses and Elias
    body: |
      Elias is Elijah (see the note on [[Luke 1:17]]). Moses, who gave the law, and Elijah, the prophet taken up without dying ([[2 Kgs. 2:11]]), were both translated beings, and they came to the mount in that state. Latter-day revelation adds what the Gospels leave unsaid: on the mount the Savior, Moses and Elias gave Peter, James and John the keys of the priesthood that Jesus had promised Peter ([[Matt. 16:19]]), keys by which they could carry on the work of the kingdom after Jesus had gone. A like event came in the Kirtland Temple on April 3, 1836, when Moses, Elias and Elijah conferred keys on Joseph Smith and Oliver Cowdery ([[D&C 110:11–16]]).
    sources: [bd-transfiguration]
  - ref: 31
    phrase: spake of his decease which he should accomplish at Jerusalem
    kind: christ
    title: His decease
    body: |
      Only Luke says what Moses and Elias spoke of. The word behind “decease” is *exodos*, “exodus” or “departure” (the footnote's gloss), the close of a life's course; Peter uses it of his own coming death ([[2 Pet. 1:15]]). The verb “accomplish” speaks of filling out a task to its completion, not of simply dying. What the visitors discussed, then, was not a death He would suffer but a departure He would accomplish: the consummation of His mortal mission, recognized by the law in Moses and by the prophets in Elijah, and the voluntary surrender of His life for a purpose exalted and foreordained.

      Joseph Smith's translation names what the departure takes in: Moses and Elias “spake of his death, and also his resurrection” (JST Luke 9:31, in the footnote).
    sources: [thayer, talmage-jesus-christ-23, lds-scriptures]
  - ref: 32
    phrase: heavy with sleep
    kind: history
    title: Heavy with sleep
    body: |
      Only Luke says the three were weighed down with sleep, and the Greek behind “when they were awake” (*diagrēgoreō*) can be taken two ways. It can mean that they stayed awake, overcoming the sleep that weighed on them; or that they came fully awake, starting up in the middle of the vision, roused, as one reading has it, by its splendor. Either way, Luke's stress falls on what they saw once awake: His glory and the two men standing with Him. The same three had been chosen as the only witnesses at Jairus's house ([[Luke 8:51]]), and they would be the only witnesses of His agony in Gethsemane ([[Mark 14:33]]); here they are made witnesses of His glory.
    sources: [cambridge-luke, thayer, talmage-jesus-christ-23]
  - ref: 35
    phrase: 'This is my beloved Son: hear him'
    kind: christ
    title: Hear him
    body: |
      In Luke the surest witness that Jesus is the Son of God comes from God Himself: at the baptism and here. At the baptism the voice spoke to Jesus, “Thou art my beloved Son” ([[Luke 3:22]]); on the mount it speaks to the disciples, “This is my beloved Son,” and gives them a command. To “hear” Him is to obey Him.

      The Father has introduced His Son to mortals with remarkably few words each time: on this mount; to the Nephites at Bountiful, “Behold my Beloved Son, in whom I am well pleased, in whom I have glorified my name—hear ye him” ([[3 Ne. 11:7]]); and to Joseph Smith in the grove, “This is My Beloved Son. Hear Him!” ([[JS—H 1:17]]).
    sources: [huntsman-lukes-jesus, bd-transfiguration, nelson-hear-him]
  - ref: 43
    phrase: the mighty power of God
    kind: words
    title: The mighty power of God
    body: |
      “Mighty power” is one Greek word, *megaleiotēs*, “majesty” or “magnificence”; the footnote glosses it “majesty, glory.” The crowd is astonished at the majesty of God shown in the healing of the boy. It is the word Peter would use for what he saw on the mount: “we … were eyewitnesses of his majesty” ([[2 Pet. 1:16]]), the visible splendor of the divine majesty in the Transfiguration. The word for the crowd's wonder below is the word Peter used for what the three saw above.
    sources: [thayer, lds-scriptures]
  - ref: 45
    phrase: it was hid from them, that they perceived it not
    kind: history
    title: It was hid from them
    body: |
      Only Luke says the saying “was hid from them,” and he piles up their failure: they understood not, perceived not, and feared to ask. One explanation is offered for the failure: the thought of what His words might mean was terrifying to men who loved Him, and the mind is loath to search into what it does not want to believe.

      Understanding came afterward. John says the same of the disciples at the triumphal entry: “These things understood not his disciples at the first: but when Jesus was glorified, then remembered they” ([[John 12:16]], the footnote's cross-reference here). Luke tells how the risen Lord “opened … their understanding” ([[Luke 24:45]]). Set beside what they would later know and preach, the incapacity so humbly admitted here shows the change the Resurrection and the gift of the Holy Ghost worked in them.
    sources: [talmage-jesus-christ-24, cambridge-luke, lds-scriptures]
  - ref: 48
    phrase: he that is least among you all, the same shall be great
    kind: symbol
    title: The least among you
    body: |
      The quarrel over greatness comes straight after a saying about His death that they did not understand. The disciples did not yet see how suffering, death and resurrection fit His mission as the Messiah; they likely expected Him to take David's throne, and may have been arguing over their places in such a kingdom. Jesus answers with a little child set beside Him: whoever receives such a child in His name receives Him, and through Him the Father who sent Him. Those called to lead are to serve, not to be served.

      In the last line the better manuscripts read “the same *is* great.” To be least, as the child is least, looks like humiliation; the greatness is not a reward put off to a distant future for it, but is reached in that humiliation itself, and by means of it. (On the child and Joseph Smith's revision of this saying, see the note on [[Mark 9:36]].)
    sources: [korth-reed-little-children, ellicott-luke]
  - ref: 50
    phrase: he that is not against us is for us
    kind: scripture
    title: Forbid him not
    body: |
      Jesus will not have the man stopped. John's interruption seems to have been prompted by the words “in my name” that Jesus had just spoken (verse 48). The man was evidently a sincere believer, and he may have been one of the kind from whom the Lord would soon choose the Seventy ([[Luke 10:1]]); how John's zeal turned to intolerance is in the note on [[Mark 9:38]]. In the divided opinion of that moment, those who were not opposed to Jesus could fairly be counted at least tentatively on His side. A reader of Luke will soon meet the opposite saying, “He that is not with me is against me”; the note on [[Luke 11:23]] sets the two side by side.
    sources: [cambridge-luke, talmage-jesus-christ-24]
  - ref: 51
    phrase: when the time was come that he should be received up, he steadfastly set his face to go to Jerusalem
    kind: words
    title: He steadfastly set his face
    body: |
      This verse turns the Gospel. Two of its words carry the weight. “Received up” is the noun *analēmpsis*, “a taking up,” found only here in the New Testament. It can include His death, but it points beyond it to His ascension into heaven (its related verb is used of the Ascension in [[Acts 1:2]], [[Acts 1:11]]), and it names something done to Him: He does not exalt Himself; the Father takes Him up. So the verse that starts Him on the road to the cross already names its end in glory.

      “Steadfastly set his face” renders a Hebrew idiom carried into Greek, to fix the face toward a place (the prophets use it, as in [[Ezek. 6:2]]). The verb, *stērizō*, means to fix or make firm, and it marks an unshakeable decision. The words suggest that He chose the moment to begin the journey with His death in view. From here to [[Luke 19:28]] Luke tells a journey toward Jerusalem, naming the city again and again, though he does not trace a straight route; the road is a journey of discipleship, and Jesus walks it first.
    sources: [thayer, brown-testimony-luke, olson-final-trek]
  - ref: 53
    phrase: because his face was as though he would go to Jerusalem
    kind: history
    title: They did not receive him
    body: |
      Luke ties the refusal to where Jesus was going. Samaritans disliked and distrusted Jews and worshipped at their own temple on Mount Gerizim rather than at Jerusalem ([[John 4:20]]), and a Jewish teacher openly on his way to Jerusalem stirred their resentment. The villagers evidently withheld the food and lodging a traveler could expect, and James and John answered with a proposal of fire. Jesus did not retaliate; He simply went on to another village.
    sources: [brown-testimony-luke, olson-final-trek]
  - ref: 54
    phrase: even as Elias did
    kind: scripture
    title: Even as Elias did
    body: |
      James and John virtually quote the story of Elijah and the captains sent by King Ahaziah: “let fire come down from heaven, and consume thee and thy fifty” ([[2 Kgs. 1:10]]). If the words are Luke's own, the two brothers who had just seen Elijah on the mount may still have carried that vision with them. Mark records that Jesus had named them Boanerges, “sons of thunder” ([[Mark 3:17]]).

      Jesus turned and rebuked them. In the King James text He says, “Ye know not what manner of spirit ye are of. For the Son of man is not come to destroy men's lives, but to save them.” Most early manuscripts lack these words, and some, the earliest among them, lack “even as Elias did” as well; a modern edition of the Greek ends the verse at “rebuked them.” But Marcion, a second-century teacher, had the saying in his text of Luke, which cautions against quickly dismissing it as a later scribe's addition; and whether or not the words are original, they breathe the spirit of the Lord who came “to seek and to save that which was lost” ([[Luke 19:10]]). It is of a piece with Luke's portrait of Him, who will heal all who need it and will not call down fire on a village that would not receive Him.
    sources: [brown-testimony-luke, greek-nt, huntsman-lukes-jesus]
  - ref: 57
    phrase: Lord, I will follow thee whithersoever thou goest
    kind: history
    title: I will follow thee
    body: |
      Three short exchanges follow, and the word “follow” is in each of them (verses 57, 59, 61). They seem to answer the teaching of verse 23, “If any man will come after me, … follow me,” and they happen “in the way,” on the road to Jerusalem, so that to follow, here, is to walk with Him toward Jerusalem. Matthew has the first two in another place, beside the sea ([[Matt. 8:18–22]]); only Luke has the third.

      To the first man, who offers exactly the right words, Jesus answers with His own homelessness: foxes and birds have shelter, “but the Son of man hath not where to lay his head.” Following Him means loosening one's hold on this world and its ordinary cares, which are not to stand first in a disciple's list of needs.
    sources: [olson-final-trek, brown-testimony-luke]
  - ref: 60
    phrase: Let the dead bury their dead
    kind: words
    title: Let the dead bury their dead
    body: |
      The second man's request was reasonable, an act of deep family loyalty. Burying a parent was among the strongest duties a son had; the law let even a priest, who had to avoid the defilement of a corpse, defile himself to bury his father or mother ([[Lev. 21:1–3]]). Jesus's answer sets a higher loyalty above even that one: devotion to the Lord comes first.

      The saying can be read two ways. It may play on two senses of “dead”: let the spiritually dead, who do not follow Him, bury the physically dead. Or the man may have meant a later rite: a year after a body was laid in a tomb, the family commonly returned to place the bones in a stone box, an ossuary. If that was his errand, he was putting a family custom ahead of the chance to walk to Jerusalem with the Son of God. Either way, the man himself is given something else to do: “go thou and preach the kingdom of God.” That is a commission to carry the same message Jesus carries.
    sources: [brown-testimony-luke, olson-final-trek]
  - ref: 62
    phrase: No man, having put his hand to the plough, and looking back, is fit for the kingdom of God
    kind: symbol
    title: Hand to the plough
    body: |
      The third man's request recalls Elisha, called from his ploughing to follow Elijah: “Let me, I pray thee, kiss my father and my mother, and then I will follow thee” ([[1 Kgs. 19:20]]), and he may have had that precedent in mind. Jesus asks more than Elijah did. The word for bidding farewell may point to a farewell celebration at home, and Jesus's answer allows not even a look back.

      The figure comes from the field. A plowman cuts a straight furrow by keeping his eyes on a fixed point ahead; if he looks back to see where he has been, he is likelier to stray, and the furrow runs crooked. For this man the lesson was to follow the Savior's example: Jesus has just set His face to go to Jerusalem (verse 51), and He does not look back.
    sources: [hunter-living-member, brown-testimony-luke, olson-final-trek]

christ: |
  Luke 9 answers Herod's question with Jesus Christ Himself: the Christ of God, the beloved Son on the mount, and in the same breath the Son of man who must suffer, whose departure is to be accomplished at Jerusalem, and who sets His face toward it to save men's lives, not to destroy them. The glory and the cross are one disclosure. For those who follow, taking up the cross is denying oneself ungodliness and keeping the commandments (JST Matt. 16:26), and Luke's “daily” makes it the work of every day rather than of one decision. Like the plowman's eyes, a disciple's energies are focused not behind but ahead, on eternal life and the joy of salvation.

explore: |
  - **The other tellings.** [[Matt. 10:1–15]]; [[Matt. 14:1–21]]; [[Matt. 16:13–28]]; [[Matt. 17:1–23]]; [[Matt. 18:1–5]]; [[Mark 6:7–44]]; [[Mark 8:27–9:41]]; [[John 6:1–14]].
  - **The mount remembered.** Peter's own witness, [[2 Pet. 1:16–18]]; the earth to be transfigured “according to the pattern which was shown unto mine apostles upon the mount,” [[D&C 63:20–21]]; Moses and Elijah again, in the Kirtland Temple, [[D&C 110:11–16]].
  - **Herod sees Him at last.** [[Luke 23:6–12]].
  - **The road to Jerusalem.** The article “The Savior's Teachings on Discipleship during His Final Trek to Jerusalem” (*Religious Educator*, 2012) follows the journey that begins at verse 51.

