chapter: 13
title: Except Ye Repent
tagline: Jesus turns news of sudden deaths into a call to repent, tells of a fig tree given one more year, looses a woman bound for eighteen years, answers whether few will be saved, and laments over Jerusalem.
when: 'On the journey to Jerusalem ([[Luke 13:22]]); in this site’s chronology, the Perean and Judean ministry'

setting: |
  Luke 13 goes on from chapter 12 without a break. “At that season,” while Jesus is still warning the crowd to read the signs of the times and to settle with an adversary before the judge ([[Luke 12:54–59]]), some of them bring Him news of Galileans killed by Pilate. The chapter belongs to the long journey Luke began at [[Luke 9:51]]. Luke names no town in this chapter, and his journey is not a road map; what he keeps in view is the destination, and twice in this chapter he names Jerusalem (verses 22 and 34). The warning that Herod wants to kill Jesus (verse 31) suggests He is in Herod’s territory, perhaps Perea, east of the Jordan, which Herod Antipas ruled along with Galilee.

  Most of the chapter is told only by Luke: the two tragedies, the barren fig tree, the bent woman healed in a synagogue, the warning about Herod. Its sayings on the mustard seed and the leaven, the strait gate, the shut door, the guests from east and west, and the lament over Jerusalem are in Matthew too, in other settings ([[Matt. 13:31–33]]; [[Matt. 7:13–14]]; [[Matt. 7:21–23]]; [[Matt. 8:11–12]]; [[Matt. 23:37–39]]). Luke’s chapter puts them in its own order, and the lament over the city closes it.

thread: |
  **Luke 13 is about time: the time a person is given to repent, and the time Jesus has before Jerusalem.**

  It opens with news of sudden death, and Jesus will not read the dead as worse sinners than anyone else. He reads their deaths as a warning to the living: repent, for no one knows how long he has. The fig tree that has borne nothing for three years is given one more year, and that is a limit as well as a mercy. Later the door of the master’s house is open, and then it is shut, and those who knock too late are left outside.

  Between the warnings stands a healing that shows what the time is for. On the Sabbath Jesus looses a woman Satan had bound for eighteen years, the deliverance He announced in the synagogue at Nazareth ([[Luke 4:18]]). Two short parables follow on a kingdom that grows until it shelters and feeds.

  The chapter ends with Jesus’s own time. Herod cannot hurry Him or stop Him. He will go on casting out devils and healing today and tomorrow, and on the third day be “perfected,” and He must die in Jerusalem, the city He would have gathered and which “would not.”

sections:
  - range: 1-5
    heading: Repent, or perish
    plain: |
      At that time some who were there told Jesus about the Galileans whose blood Pilate had mixed with their sacrifices. Jesus answered them, “Do you think these Galileans were worse sinners than all the other Galileans, because they suffered this? No, I tell you. But unless you repent, you will all perish too. Or those eighteen who were killed when the tower in Siloam fell on them: do you think they were more guilty than everyone else who lived in Jerusalem? No, I tell you. But unless you repent, you will all perish too.”
  - range: 6-9
    heading: The barren fig tree
    plain: |
      Then He told this parable: “A man had a fig tree planted in his vineyard. He came looking for fruit on it and found none. So he said to the man who tended the vineyard, ‘Look, for three years now I have come looking for fruit on this fig tree and found none. Cut it down. Why should it use up the ground?’ The man answered, ‘Sir, leave it alone one more year, until I dig around it and put manure on it. If it bears fruit, good. If not, then you can cut it down.’”
  - range: 10-17
    heading: A daughter of Abraham loosed
    plain: |
      Jesus was teaching in one of the synagogues on the Sabbath. A woman was there who had been crippled by a spirit for eighteen years. She was bent over and could not straighten herself at all. When Jesus saw her, He called her over and said, “Woman, you are set free from your infirmity.” He laid His hands on her, and at once she stood up straight and praised God.

      The ruler of the synagogue was indignant because Jesus had healed on the Sabbath. He told the people, “There are six days for work. Come and be healed on those days, not on the Sabbath.” The Lord answered him, “Hypocrite! Doesn’t each of you untie his ox or his donkey from the stall on the Sabbath and lead it away to water? And this woman, a daughter of Abraham, whom Satan has kept bound for eighteen long years: shouldn’t she be set free from this bond on the Sabbath day?” When He said this, all His opponents were put to shame, and the whole crowd rejoiced at all the wonderful things He was doing.
  - range: 18-21
    heading: The mustard seed and the leaven
    plain: |
      Then He said, “What is the kingdom of God like? What shall I compare it to? It is like a mustard seed that a man took and planted in his garden. It grew and became a tree, and the birds of the air nested in its branches.” And again He said, “What shall I compare the kingdom of God to? It is like leaven that a woman took and mixed into three measures of flour, until all of it was leavened.”
  - range: 22-30
    heading: The strait gate and the shut door
    plain: |
      Jesus went on through towns and villages, teaching as He made His way toward Jerusalem. Someone asked Him, “Lord, are only a few going to be saved?” He said to them, “Strive to enter through the narrow gate. For many, I tell you, will try to enter and will not be able. Once the master of the house gets up and shuts the door, you will stand outside knocking and saying, ‘Lord, Lord, open to us.’ He will answer, ‘I do not know where you come from.’ Then you will say, ‘We ate and drank with you, and you taught in our streets.’ But he will say, ‘I tell you, I do not know where you come from. Go away from me, all you who do evil.’ There will be weeping and grinding of teeth when you see Abraham, Isaac and Jacob and all the prophets in the kingdom of God, and yourselves thrown out. People will come from east and west, from north and south, and take their places at table in the kingdom of God. And indeed, some who are last will be first, and some who are first will be last.”
  - range: 31-35
    heading: That fox, and Jerusalem
    plain: |
      That same day some Pharisees came and told Him, “Get away from here, for Herod wants to kill you.” He said to them, “Go and tell that fox, ‘Look, I am casting out devils and healing today and tomorrow, and on the third day I will be made perfect.’ Still, I must keep going today and tomorrow and the day after, for it cannot be that a prophet should die anywhere but in Jerusalem.

      “O Jerusalem, Jerusalem, you who kill the prophets and stone those sent to you! How often I wanted to gather your children together as a hen gathers her chicks under her wings, and you would not! Look, your house is left to you desolate. And I tell you, you will not see me until the time comes when you say, ‘Blessed is he who comes in the name of the Lord.’”

notes:
  - ref: 1
    phrase: whose blood Pilate had mingled with their sacrifices
    kind: history
    title: Blood mingled with sacrifices
    body: |
      No other ancient writer records either tragedy Jesus speaks of. The first was a killing at the temple. Pilate, prefect of Judea from A.D. 26 to 36, usually came up to Jerusalem at feast time, and he had a well-earned name for contempt toward the Jews’ religion. Luke says only that their blood was mingled with their sacrifices, which puts the killing at the altar, during a sacrifice; Galileans came up regularly for the feasts. The rest is reconstruction. Most likely soldiers came into the temple courts during an outbreak at one of the feasts: perhaps the Galileans had joined some violent show of resentment against Rome, which Pilate took for the start of an insurrection. The Roman fortress of Antonia overlooked the temple grounds, and its soldiers could be in the courts at the first sign of trouble. Killings like this were common enough under the Romans that Josephus did not record this one.

      The second tragedy, the tower at Siloam, was no one’s crime. Siloam was a pool fed by the city’s conduits. An old conjecture, still often repeated, holds that the eighteen were working on the aqueduct Pilate built with money taken from the temple’s sacred treasury, so that some would have seen their death as a judgment on sacrilege; it is no more than a guess. Either way, Jesus sets a ruler’s cruelty beside an accident, and in both the dead were simply where disaster fell.
    sources: [bd-pilate, talmage-jesus-christ-26, cambridge-luke, ellicott-luke]
  - ref: 3
    phrase: except ye repent, ye shall all likewise perish
    kind: scripture
    title: Repent, or likewise perish
    body: |
      Jesus refuses to read disaster as a verdict on the dead. The belief He corrects is old: Job’s friends were sure his suffering proved his guilt, and the disciples would ask of a man born blind, “who did sin, this man, or his parents?” Jesus’s answer there was the same as here: “Neither hath this man sinned, nor his parents” ([[John 9:2–3]]). The Galileans and the eighteen were not worse sinners than their neighbors, and how they died says nothing about their guilt.

      Then Jesus turns the question around, twice and in nearly the same words. What happened to them is not a measure of their sin, but it is a warning to everyone who heard the news: death comes without notice, and no one should meet God unrepentant. “Perish” here most likely reaches past dying, which comes to all, to what follows it in the world to come.

      For that generation the warning had a nearer edge as well. While Jesus spoke, destruction hung over the temple, the city and the nation, and unless the people repented and received the Messiah among them, it would fall. The fig tree that follows (verses 6–9) makes the same point as a parable.
    sources: [brown-testimony-luke, talmage-jesus-christ-26, lds-scriptures]
  - ref: 7
    phrase: these three years I come seeking fruit on this fig tree
    kind: symbol
    title: A fig tree with no fruit
    body: |
      A fig tree in a vineyard was nothing unusual; fruit trees often grew among the vines. What the owner wants is plain: a tree is planted to bear, and in the Old Testament a fruitless tree is a sign of God’s judgment ([[Jer. 8:13]]). The “three years” most likely mean three seasons in which a mature tree has borne nothing, not the years of Jesus’s ministry, for which Luke gives no length. A tree only three years old would not be expected to bear, and the law forbade eating its fruit in those first years ([[Lev. 19:23]]). “Why cumbereth it the ground?” asks why the tree should go on wasting ground that could be put to good use. A fig tree draws a great deal from the soil around it.

      The owner’s verdict, “cut it down,” uses the verb John the Baptist used when he warned that “every tree therefore which bringeth not forth good fruit is hewn down” ([[Luke 3:9]]). The fig tree was a common figure for the nation of Israel. Read that way, the tree is the covenant people and the vineyard the world, and the parable bears on Israel then and on every soul since.
    sources: [brown-testimony-luke, talmage-jesus-christ-26]
  - ref: 8
    phrase: let it alone this year also
    kind: christ
    title: One more year
    body: |
      The vinedresser pleads for the tree, and Latter-day Saint readers have seen the Savior in him: “the Son of God, who by personal ministry and solicitous care makes intercession for the barren tree, in the hope that it may yet bear fruit.” Modern revelation shows Him pleading in just this way, as the advocate with the Father: “Father, spare these my brethren that believe on my name, that they may come unto me and have everlasting life” ([[D&C 45:5]]).

      The year is not idle. He will dig around the tree and manure it, doing everything a gardener can to bring it to fruit. That is the purpose of the time given to every life, which Lehi taught was “prolonged, according to the will of God, that they might repent while in the flesh” ([[2 Ne. 2:21]]). The Joseph Smith Translation makes the hope explicit: if it bears fruit, “the tree is saved” (JST Luke 13:9).

      But the mercy has a limit. If the tree is still barren, it will be cut down, and the one who gives that judgment is the owner, not the vinedresser. Zenos’s allegory of the olive tree tells the same kind of story: the Lord of the vineyard is ready to burn the bad branches, and his servant persuades him to wait, “Spare it a little longer” ([[Jacob 5:50]]), digging and nourishing it so “that perhaps it may bring forth good fruit” ([[Jacob 5:27]]). The two stories need not share an origin to share their message: in both, the one who pleads for the tree also works on it, judgment waits while the vineyard is tended, and it does not wait forever.
    sources: [talmage-jesus-christ-26, brown-testimony-luke, lds-scriptures]
  - ref: 11
    phrase: a spirit of infirmity
    kind: words
    title: A spirit of infirmity
    body: |
      “A spirit of infirmity” joins the language of disease to the language of evil powers. Luke’s word for “infirmity” is his ordinary word for a disease, and what he describes seems most like a disease of the spine: for eighteen years she had been bent and could not straighten herself. He never says a devil was cast out, and Jesus does not rebuke a spirit; He speaks a word, lays on His hands, and she stands up straight.

      Yet Luke does use the language of deliverance from evil for this healing. Jesus says she is “loosed” and that “Satan hath bound” her (verse 16), and Luke treats a physical ailment here as a bondage from which she has to be freed. How Satan was involved is not explained. Jesus’s words present her suffering as more than a bent back: a bondage under Satan’s power, from which He frees her. That deliverance can be read as a type of how He redeems all of us from the power of the Fall.
    sources: [huntsman-lukes-jesus, brown-testimony-luke]
  - ref: 14
    phrase: said unto the people, There are six days in which men ought to work
    kind: history
    title: The ruler of the synagogue
    body: |
      The ruler of the synagogue was its chief officer, usually a scribe, who cared for the building and oversaw the services. Luke says he answered “with indignation,” a strong word for personal resentment, and yet he did not speak to Jesus. He spoke to the people, and above all to the woman who had just been healed, though the rebuke was meant for Jesus. He may have been afraid of Jesus’s power; and if there was any work in the healing, Jesus had done it, not the woman.

      His text is the fourth commandment, “Six days shalt thou labour” ([[Ex. 20:9]]). Behind his use of it stood a rule of tradition: a physician might practice his art on the Sabbath when a life was at stake, but not for a chronic illness like hers, which could wait for a weekday. Jesus answers him to his face: “Thou hypocrite” (verse 15).
    sources: [bd-synagogue, cambridge-luke, talmage-jesus-christ-26, ellicott-luke, lds-scriptures]
  - ref: 16
    phrase: being a daughter of Abraham, whom Satan hath bound
    kind: christ
    title: A daughter of Abraham, loosed
    body: |
      Jesus answers the ruler from his own practice, and the word “loose” carries the argument. Every one of them unties an ox or a donkey from the stall on the Sabbath and leads it to water. That is not a rescue in an emergency, like lifting a sheep out of a pit ([[Matt. 12:11]]), but the ordinary care of every Sabbath, done for their own animals. If an ox may be loosed, how much more a daughter of Abraham, who is worth more than an ox, bound by Satan “these eighteen years.” Jesus also gives the ruler back his own word: the ruler said there are six days in which men “ought” to work; Jesus asks whether this woman “ought” not to be loosed. The ruler’s “ought” came from the rules of the day; Jesus’s comes from love.

      He had acted first, too. She asked nothing; He saw her, called her to Him, and, “without waiting for petition or request,” declared her loosed. The title may itself have been a kindness. Her neighbors would likely have taken her condition, as Elisabeth’s had taken her barrenness ([[Luke 1:25]]), as a sign of God’s disfavor, and by calling her a daughter of Abraham before the whole synagogue, Jesus would have given her back her place of honor.
    sources: [ellicott-luke, cambridge-luke, talmage-jesus-christ-26, brown-testimony-luke, lds-scriptures]
  - ref: 19
    phrase: it grew, and waxed a great tree; and the fowls of the air lodged in the branches of it
    kind: symbol
    title: The mustard tree
    body: |
      The mustard of the parable is most likely black mustard, a common plant in Galilee that can grow to ten feet. Strictly it is an annual herb, not a true tree, but a full-grown plant is sturdy enough for small birds to perch on and eat its seeds. Unlike Matthew and Mark ([[Matt. 13:31–32]]; [[Mark 4:30–32]]), Luke says nothing about the seed’s being the smallest of all. His emphasis is on how it ends: a tree that gives the birds a home. In the Old Testament a great tree with birds lodging in its branches pictured many nations and peoples sheltered beneath it ([[Ezek. 31:6]]; [[Dan. 4:12]]).

      Joseph Smith read the mustard seed as “the church as it shall come forth in the last days.” He saw its small beginning in the Book of Mormon, “hid in his field” until it sprang up, and the birds in its branches as the “powers, gifts and angels” God was sending down to lodge there.
    sources: [ball-plants-nt, brown-testimony-luke, jsp-letter-elders-1835-12, lds-scriptures]
  - ref: 21
    phrase: leaven, which a woman took and hid in three measures of meal
    kind: symbol
    title: Leaven in three measures
    body: |
      Leaven usually stands for something bad in the New Testament. Only a chapter earlier Jesus warned, “Beware ye of the leaven of the Pharisees, which is hypocrisy” ([[Luke 12:1]]). Here it is the other way: leaven is the hidden working of the kingdom, spreading through the dough until every part has risen. The amount is startling. Three measures is about fifty pounds of flour, enough bread for perhaps a hundred and fifty people, though it may simply be the traditional quantity Sarah baked for her guests ([[Gen. 18:6]]).

      Luke gives the two parables as a pair: a man plants a seed and a woman leavens dough, two household tasks, one for each. Coming just after Jesus has named the bent woman “a daughter of Abraham,” the pairing can be read as pointing to a kingdom in which women stand as full members beside men.

      Joseph Smith saw the parable fulfilled in the Restoration: the Church “has taken its rise from a little leaven that was put into three witnesses,” and is leavening the whole lump.
    sources: [bd-leaven, brown-testimony-luke, jsp-letter-elders-1835-12, lds-scriptures]
  - ref: 24
    phrase: Strive to enter in at the strait gate
    kind: words
    title: Strive to enter in at the strait gate
    body: |
      The man asks how many, and Jesus answers what to do. He does not say that few will be saved or that many will; He gives a command, and the warnings that follow show “that neglect or procrastination in obeying the requirements for salvation may result in the soul’s loss.”

      The verb, *agōnizomai*, is the word for an athlete’s contest: to struggle, to compete for a prize, to fight. It is the word of “Fight the good fight of faith” ([[1 Tim. 6:12]]), and where Matthew has simply “Enter ye in at the strait gate” ([[Matt. 7:13]]), Luke has the wrestler’s strain. Several manuscripts read “the narrow door” for “the strait gate.” Many “will seek to enter in, and shall not be able”; the verse does not say why, and one explanation is that they only seek and do not strive.

      Restoration scripture names the gate: “the gate by which ye should enter is repentance and baptism by water; and then cometh a remission of your sins by fire and by the Holy Ghost” ([[2 Ne. 31:17]]). The risen Lord’s words to the Nephites also speak to the man’s question of how many: “strait is the gate, and narrow is the way that leads to life, and few there be that find it” ([[3 Ne. 27:33]]).
    sources: [thayer, talmage-jesus-christ-26, ellicott-luke, cambridge-luke, lds-scriptures]
  - ref: 25
    phrase: I know you not whence ye are
    kind: words
    title: I know you not whence ye are
    body: |
      The shut door means the time to enter is over. Those outside plead that they knew the master: “We have eaten and drunk in thy presence, and thou hast taught in our streets” (verse 26). Many had eaten with Jesus and heard Him teach without taking His message to heart, and having been near Him does not open the door.

      “I know you not whence ye are” is a puzzle in the King James. In Luke, Jesus knows people’s very thoughts ([[Luke 5:22]]), so how can He not know where they come from? The Joseph Smith Translation turns the sentence around: “I will not receive you, for ye know not from whence ye are” (JST Luke 13:25), and it calls the door “the door of the kingdom.” The change moves the not-knowing from the Lord to them: He knows who they are, and it is they who do not know where they come from. One reading takes that as their own divine origin, which they never came to know because the understanding could come only from Him, and they had turned their backs on Him.
    sources: [brown-testimony-luke]
  - ref: 29
    phrase: they shall come from the east, and from the west
    kind: scripture
    title: From the east and the west
    body: |
      The guests who come from every direction are above all the Gentiles, though Jews scattered abroad and returning may be meant as well. The scene is a banquet: “sit down” means to recline at table, and the company is Abraham, Isaac, Jacob and all the prophets. It is the feast Isaiah foresaw, when “in this mountain shall the Lord of hosts make unto all people a feast of fat things” ([[Isa. 25:6]]).

      For Jesus’s hearers the warning is sharp: their descent from Israel would not save them; many not of the covenant people would believe and be saved, while unworthy Israelites would be thrust out. That is the sense of “there are last which shall be first” (verse 30). The Joseph Smith Translation ends the verse with “and shall be saved therein” (JST Luke 13:30). The passage began with the question whether few would be saved (verse 23); with those words it ends by naming some who will be, the people who come from every quarter to sit down in the kingdom, though it still gives no number.
    sources: [brown-testimony-luke, talmage-jesus-christ-26, lds-scriptures]
  - ref: 31
    phrase: there came certain of the Pharisees
    kind: history
    title: A warning from Pharisees
    body: |
      Pharisees warning Jesus to save His life is not what a reader of Luke expects. Some have suspected a trick, to frighten Him out of Herod’s territory or drive Him toward Jerusalem and the council there. A more charitable judgment is just as possible: these men may have acted from humane motives and may even have believed in Him at heart. In this scene, at least, they seem well disposed.

      The danger was real. Herod Antipas ruled Galilee and Perea, and he had already beheaded John the Baptist ([[Luke 9:9]]). Jesus took the warning seriously, as His answer shows, but He did not take the advice.
    sources: [talmage-jesus-christ-26, brown-testimony-luke, bd-herod, olson-final-trek]
  - ref: 32
    phrase: tell that fox
    kind: words
    title: That fox
    body: |
      “That fox” is contempt, and it suggests that Jesus had no fear of the man who held His life in his territory. In Greek writing the fox is the crafty animal; in the Old Testament, Israel’s false prophets are “like the foxes in the deserts” ([[Ezek. 13:4]]), so the word can mean foolish as well as sly, and Jesus seems to mean both. The Joseph Smith Translation simply puts Herod’s name in its place (JST Luke 13:32).

      The message itself hardly concerns Herod. Jesus will go on doing what He came to do, casting out devils and healing, and nothing Herod plans will change when His work ends.
    sources: [olson-final-trek, brown-testimony-luke, lds-scriptures]
  - ref: 32
    phrase: the third day I shall be perfected
    kind: christ
    title: The third day I shall be perfected
    body: |
      “Perfected” means brought to completion. The Greek verb, *teleioō*, is to carry a thing through to its end and finish it. In the middle voice (the subject acting for himself), the verb would mean that Jesus finishes what He was given to do; in the passive, as the King James translators read it, “I am perfected,” something done to Him. On one Latter-day Saint reading of the passive, the Father is the one who brings His work to its end.

      “To day and to morrow” is the present and the near future, the months of ministry still ahead of Him. “The third day” looks further, and points to the resurrection, which Jesus has already foretold for “the third day” ([[Luke 9:22]]). The Joseph Smith Translation sharpens the point in the next verse, where “the day following” becomes “the third day” (JST Luke 13:33). His work will not be finished by Herod’s sword but by His death in Jerusalem and His rising.
    sources: [thayer, brown-testimony-luke, talmage-jesus-christ-26]
  - ref: 33
    phrase: it cannot be that a prophet perish out of Jerusalem
    kind: christ
    title: A prophet perish out of Jerusalem
    body: |
      “I must walk” uses the Greek word Luke uses for divine necessity, the “must” of “The Son of man must suffer many things” ([[Luke 9:22]]). Jesus is not running from Herod; He is keeping an appointment. Nothing shows that the saying about prophets was a known proverb, and it has history behind it: Jerusalem had seen prophets put to death, among them Zechariah, stoned in the temple court ([[2 Chr. 24:20–22]]), and Urijah, killed by King Jehoiakim ([[Jer. 26:20–23]]). By dying there Jesus would be counted among them.

      The Joseph Smith Translation adds an explanation: “This he spake, signifying of his death. And in this very hour he began to weep over Jerusalem” (JST Luke 13:33–34). The verse belongs to a thread that runs through Luke, from His rejection at Nazareth to His steady going up to Jerusalem: Jesus as the servant of the Lord who suffers in order to restore God’s people.
    sources: [brown-testimony-luke, lds-scriptures, huntsman-lukes-jesus]
  - ref: 34
    phrase: as a hen doth gather her brood under her wings
    kind: symbol
    title: As a hen gathers her brood
    body: |
      A hen gathers her chicks under her wings to shield them with her own body, and Jesus chose that picture for what He wanted for Jerusalem. The image carries both His desire to protect His people and the condition that they must want His protection. That is the grief in “ye would not.” The verb is about will: the city chose not to come.

      “How often” implies more visits to Jerusalem than Luke records, and the long labor of Israel’s Lord to bring His people to Himself. Matthew gives these words in the temple in the last week ([[Matt. 23:37–39]]), and Jesus may well have spoken them more than once. The Joseph Smith Translation’s words at verse 33 put the lament in the same hour as the warning about Herod (see the note there), which strengthens Luke’s setting.

      The risen Lord used the same image to the Nephites, in three tenses, past, present and future: “how oft have I gathered you,” “how oft would I have gathered you … and ye would not,” and “how oft will I gather you as a hen gathereth her chickens under her wings, if ye will repent and return unto me with full purpose of heart” ([[3 Ne. 10:4–6]]).
    sources: [sc-knowhy-200, brown-testimony-luke, lds-scriptures]
  - ref: 35
    phrase: Ye shall not see me, until the time come
    kind: christ
    title: Until ye shall say, Blessed
    body: |
      “Your house” is, on its face, the temple, for “house” often names the temple, and Jesus’s words echo Jeremiah’s warnings against it: “I have forsaken mine house, I have left mine heritage” ([[Jer. 12:7]]); “this house shall become a desolation” ([[Jer. 22:5]]). The pronoun may itself carry the sentence: the temple is called “your house,” left to them, and no longer spoken of as God’s.

      The last sentence is the hope in the lament. “Blessed is he that cometh in the name of the Lord” is from [[Ps. 118:26]], and the crowds will cry nearly these words as He comes down the Mount of Olives ([[Luke 19:38]]). But the promise looks past that day, to a time when Jerusalem’s people will turn and greet Him as the One who comes; the stern warning ends on a door of hope. The Joseph Smith Translation makes the order plain: “Ye shall not know me, until ye have received from the hand of the Lord a just recompense for all your sins; until the time …” (JST Luke 13:36). The desolation comes first, and the knowing after.
    sources: [brown-testimony-luke, cambridge-luke, lds-scriptures]

christ: |
  Luke 13 shows Jesus Christ as the vinedresser who pleads for one more year for a fruitless tree and labors over it, and as the Lord who would have gathered Jerusalem as a hen gathers her chicks. He goes toward the city knowing He must die there and be “perfected” on the third day. He still pleads as the advocate with the Father, “Father, spare these my brethren that believe on my name” ([[D&C 45:5]]), and the days of each life are “prolonged, according to the will of God, that they might repent while in the flesh” ([[2 Ne. 2:21]]). The gathering Jerusalem refused is still offered: “how oft will I gather you as a hen gathereth her chickens under her wings, if ye will repent and return unto me with full purpose of heart” ([[3 Ne. 10:6]]).

