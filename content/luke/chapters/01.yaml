chapter: 1
title: Two Announcements
tagline: Luke sets out to write in order; Gabriel promises a son to an aged priest at the altar of incense and the Son of God to a virgin in Nazareth; two mothers meet, Mary sings, and Zacharias, his tongue loosed, prophesies of the dawn from on high.
when: 'In the days of Herod the Great, who died in 4 BC: the months before the birth of Jesus'

setting: |
  Luke is named three times in the New Testament, once as “the beloved physician” ([[Col. 4:14]]), and he wrote both this Gospel and the book of Acts; where Acts says “we,” he was traveling with Paul. He was born of Gentile parents, and his Gospel was written especially for Gentile readers. When and where he wrote is uncertain; a date between AD 70 and 80 fits the evidence best, though all of it is circumstantial. The Joseph Smith Translation names the book “The Testimony of St. Luke,” and in it Luke opens with his credential: “As I am a messenger of Jesus Christ” (JST Luke 1:1, in the footnotes).

  Only Luke tells the stories of this chapter. Where Mark begins at the Jordan and Matthew with a genealogy, Luke begins in the temple at Jerusalem, at the altar of incense, one of the most sacred places on earth. His first two chapters work as an overture to the whole Gospel, and their chief purpose is to show that Jesus was the Son of God from His conception. Restoration scripture knows these events too. The Lord speaks of the angel who visited Zacharias, calling him Elias ([[D&C 27:7]]) and tells how John was ordained when eight days old ([[D&C 84:27–28]]), and Nephi, Benjamin and Alma had seen or named Mary centuries before Gabriel came to her ([[1 Ne. 11:13–20]]; [[Mosiah 3:8]]; [[Alma 7:10]]).

thread: |
  **Two announcements, two answers, and a priest who learns to believe.**

  Gabriel comes twice, with the same “Fear not” (verses 13, 30) and the promise of a son each time, and Luke sets the two responses against each other. The first visit is to a blameless priest at the holiest altar in Jerusalem, and he doubts. The second is to a young woman in a Galilean town, and she believes (verses 38, 45). Zacharias asks for proof and goes out speechless; Mary asks how, and answers, “be it unto me according to thy word.”

  Then the story moves from the temple into a home. In Zacharias’s house in the hill country the two women meet, the unborn John leaps, Elisabeth prophesies and Mary sings. At the naming of the child the silent priest writes “His name is John,” his tongue is loosed, and his first words can be read as the priestly prayer the angel’s visit had kept him from offering at the incense altar. By the end of the chapter the house has become a place of holiness beside the temple, and the song that closes it looks past John to the One whose way he prepares: the dawn from on high.

sections:
  - range: 1-4
    heading: Luke’s preface
    plain: |
      Many have already undertaken to write an account of the things that have been fulfilled among us, just as they were handed down to us by those who were eyewitnesses from the beginning and servants of the word. So I too, having carefully investigated everything from the start, have decided to write it out for you in order, most excellent Theophilus, so that you may know for certain the truth of what you have been taught.
  - range: 5-25
    heading: Gabriel appears to Zacharias
    plain: |
      In the days of Herod, king of Judea, there was a priest named Zacharias, of the priestly division of Abia. His wife Elisabeth was also descended from Aaron. Both were righteous before God, keeping all the Lord’s commandments and ordinances blamelessly. But they had no child, because Elisabeth was barren, and both were advanced in years.

      Once, when his division was on duty and he was serving as priest before God, he was chosen by lot, as the priests’ custom was, to go into the temple of the Lord and burn incense. The whole crowd of people was praying outside at the hour of incense. Then an angel of the Lord appeared to him, standing on the right side of the altar of incense. Zacharias was shaken when he saw him, and fear seized him. But the angel said, “Don’t be afraid, Zacharias: your prayer has been heard. Your wife Elisabeth will bear you a son, and you are to name him John. He will be your joy and gladness, and many will rejoice at his birth, for he will be great in the Lord’s sight. He must never drink wine or strong drink, and he will be filled with the Holy Ghost even before he is born. He will turn many of the children of Israel back to the Lord their God. He will go before the Lord in the spirit and power of Elijah, to turn the hearts of the fathers to the children and the disobedient to the wisdom of the righteous, and to make ready a people prepared for the Lord.”

      Zacharias said to the angel, “How can I be sure of this? I am an old man, and my wife is advanced in years.” The angel answered, “I am Gabriel. I stand in the presence of God, and I was sent to speak to you and bring you this good news. Now, because you did not believe my words, which will come true in their time, you will be silent and unable to speak until the day these things happen.”

      Meanwhile the people were waiting for Zacharias and wondering why he stayed so long in the temple. When he came out he could not speak to them, and they realized he had seen a vision in the temple; he kept making signs to them and remained speechless. When his days of service were over, he went home. Some time later his wife Elisabeth conceived, and for five months she kept herself in seclusion. “The Lord has done this for me,” she said. “In these days He has looked on me with favor and taken away my disgrace among people.”
  - range: 26-38
    heading: Gabriel appears to Mary
    plain: |
      In the sixth month the angel Gabriel was sent from God to a town in Galilee called Nazareth, to a virgin engaged to a man named Joseph, of the house of David. The virgin’s name was Mary. The angel came in to her and said, “Greetings, you who are highly favored! The Lord is with you; you are blessed among women.” She was deeply troubled by his words and wondered what kind of greeting this could be. The angel said to her, “Don’t be afraid, Mary, for you have found favor with God. You will conceive and give birth to a son, and you are to name Him Jesus. He will be great, and will be called the Son of the Most High. The Lord God will give Him the throne of His father David, and He will reign over the house of Jacob forever; His kingdom will never end.”

      Mary said to the angel, “How will this be, since I have not been with a man?” The angel answered, “The Holy Ghost will come upon you, and the power of the Most High will overshadow you. So the holy child to be born of you will be called the Son of God. And your relative Elisabeth has also conceived a son in her old age; she who was called barren is now in her sixth month. For nothing is impossible with God.” Mary said, “I am the Lord’s servant. Let it be to me as you have said.” Then the angel left her.
  - range: 39-55
    heading: Mary visits Elisabeth
    plain: |
      In those days Mary got ready and hurried to a town in the hill country of Judah, where she entered Zacharias’s house and greeted Elisabeth. When Elisabeth heard Mary’s greeting, the baby leaped in her womb, and Elisabeth was filled with the Holy Ghost. She cried out with a loud voice: “You are blessed among women, and blessed is the child you will bear! But why am I so favored, that the mother of my Lord should come to me? As soon as the sound of your greeting reached my ears, the baby in my womb leaped for joy. Blessed is she who believed, for what the Lord has told her will be fulfilled.”

      And Mary said: “My soul magnifies the Lord, and my spirit rejoices in God my Savior, for He has looked on the humble state of His servant. From now on all generations will call me blessed, for the Mighty One has done great things for me, and holy is His name. His mercy is on those who fear Him, from generation to generation. He has shown the strength of His arm; He has scattered those who are proud in the thoughts of their hearts. He has brought down rulers from their thrones and lifted up the humble. He has filled the hungry with good things and sent the rich away empty. He has helped His servant Israel, remembering His mercy, as He promised our fathers, Abraham and his descendants forever.”
  - range: 56-66
    heading: John is born and named
    plain: |
      Mary stayed with Elisabeth about three months and then went home. When the time came for Elisabeth to give birth, she had a son. Her neighbors and relatives heard how the Lord had shown her great mercy, and they rejoiced with her. On the eighth day they came to circumcise the child, and they were going to name him Zacharias, after his father. But his mother spoke up: “No; he is to be called John.” They said to her, “None of your relatives has that name.” So they made signs to his father to find out what he wanted him named. He asked for a writing tablet and wrote, “His name is John,” and they were all amazed. Immediately his mouth was opened and his tongue freed, and he began to speak, praising God. Awe came over all their neighbors, and throughout the hill country of Judea people were talking about all these things. Everyone who heard of them kept thinking about it and asked, “What then will this child become?” For the Lord’s hand was with him.
  - range: 67-80
    heading: Zacharias prophesies
    plain: |
      His father Zacharias was filled with the Holy Ghost and prophesied: “Blessed be the Lord God of Israel, for He has come to His people and redeemed them. He has raised up a horn of salvation for us in the house of His servant David, as He promised long ago through the mouth of His holy prophets: salvation from our enemies and from the power of all who hate us. So He has shown the mercy promised to our fathers and remembered His holy covenant, the oath He swore to our father Abraham: to rescue us from our enemies’ hands and let us serve Him without fear, in holiness and righteousness before Him all our days.

      “And you, my child, will be called the prophet of the Most High, for you will go before the Lord to prepare His ways, to give His people the knowledge of salvation through the forgiveness of their sins. Because of the tender mercy of our God, the dawn from on high has come to us, to give light to those who sit in darkness and in the shadow of death, and to guide our feet into the way of peace.”

      And the child grew and became strong in spirit, and he lived in the wilderness until the day he appeared publicly to Israel.

notes:
  - ref: 1
    phrase: Forasmuch as many have taken in hand to set forth in order a declaration of those things
    kind: history
    title: A messenger who wrote after others
    body: |
      Luke opens by saying how he worked, and he says it frankly: others had already written, and he writes after them. The “many” who had “taken in hand” to tell the story are not named; Mark is surely among them, Matthew may be, and so may accounts that never entered the New Testament. Luke does not disparage them. He writes because they had not exhausted the story and his own inquiries let him add to it. His opening sentence is more finished than the plain openings of the other Gospels, which shows in English and still more in the Greek. And what he reports are not opinions “most surely believed” but, as the footnote reads the Greek, things “fulfilled,” accomplished among us.

      Verse 2 is easy to misread in the King James wording. The eyewitnesses and “ministers of the word” are “they,” not “us”: better, “they who were eyewitnesses from the beginning delivered them unto us.” Luke says plainly that he was not an eyewitness, and that he wrote from sources that went back to those who were. “Delivered” is the word Paul uses for handing on the account of the Lord’s Supper and of the Resurrection ([[1 Cor. 11:23]]; [[1 Cor. 15:3]]), very nearly the technical term for the church’s oral teaching about the Lord.

      Joseph Smith’s translation changes the first words: “As I am a messenger of Jesus Christ, and knowing that many have …” (JST Luke 1:1, in the footnotes). It gives Luke “a high calling as a ‘messenger of Jesus Christ.’” The man who says he had the story from others opens, in that reading, by naming the One who sent him.
    sources: [farnes-synoptic-gospels, ellicott-luke, strathearn-gospels, bd-luke, lds-scriptures]
  - ref: 3
    phrase: most excellent Theophilus
    kind: history
    title: Who Theophilus was
    body: |
      Theophilus is the man to whom Luke addressed both his Gospel and the Acts ([[Acts 1:1]]). His name means “friend of God,” but the title “most excellent” seems to show that he was a real person and not a figure for every reader. It is the title given the governor Felix ([[Acts 24:3]]), and it implies a man of high standing, perhaps of official rank. Joseph Smith’s translation names him a third time, in an aside that explains to him a custom of the Jews’ treasury (JST Luke 3:19–20). He had already been taught: “instructed” (verse 4) is the verb from which “catechize” comes, and it refers to oral teaching. Luke writes so that what Theophilus had heard he might “know the certainty” of.

      “Having had perfect understanding of all things from the very first” is better rendered “having traced (or investigated) all things from their source,” following the events step by step, and “in order” aims at a sequence in time.
    sources: [bd-theophilus, ellicott-luke, jst-luke-3, lds-scriptures]
  - ref: 5
    phrase: of the course of Abia
    kind: history
    title: A priest of the eighth course
    body: |
      Zacharias belonged to one of the twenty-four divisions of priests that David had set up to take turns at the sanctuary; Abia (Abijah) was the eighth ([[1 Chr. 24:10]]). Each course served in rotation, and between their turns the priests lived and worked in their own towns among the people, as Zacharias did in the hill country (verses 23, 39).

      The verse gives both parents a priestly lineage: Zacharias is a priest, and Elisabeth is “of the daughters of Aaron.” Both were Levites of Aaron’s family, and that mattered, for the priesthood of the temple came by descent: a priest had to prove he was a literal descendant of Aaron.
    sources: [brown-tamid, benson-matthews-john-baptist, lds-scriptures]
  - ref: 9
    phrase: his lot was to burn incense
    kind: history
    title: Once in a lifetime
    body: |
      To be chosen by lot to burn the incense was the most honored service of a priest’s day, and it came to a priest once in his life at most. The priests of the day’s course drew several lots for the morning’s duties, and the lot for the incense was open only to men who had never offered it; a priest could serve all his life and never be chosen. The chosen priest entered the Holy Room, the first room of the sanctuary, where the incense altar stood before the veil; a friend or relative came in with him to pour the incense into his hands and then withdrew, leaving him alone at the altar. Only the high priest went beyond the veil, into the Holy of Holies.

      Verse 10 shows what the moment meant to everyone else. While the incense burned, the people in the courts outside lay prostrate toward the sanctuary, praying. The priest at the altar stood for all of them: his prayer was Israel’s prayer, and the rising smoke was a figure of it going up to God. So the delay in verse 21 was noticed. A priest might pause after the offering for a short silent prayer, but Zacharias stayed far longer than that.
    sources: [brown-tamid, mcconkie-special-witnesses]
  - ref: 13
    phrase: thy prayer is heard
    kind: prophets
    title: Which prayer was heard
    body: |
      Joseph Smith taught that Zacharias had been praying for a son, and that more than a family’s hope was at stake: “Zachariah having no children, knew that the promise of God must fail, consequently he went into the Temple to wrestle with God according to the order of the preisthood to obtain a promise of a son.” Elsewhere he named the promise: the Lord had promised Zacharias a son descended from Aaron, having promised “that the priesthood should continue with Aaron and his seed throughout their generations.”

      The hour also made the priest’s prayer a public one, the prayer of all Israel waiting outside (see the note on verse 9). The angel’s answer begins with the son (verse 13) and ends with the son’s mission, to “make ready a people prepared for the Lord” (verse 17).
    sources: [jsp-discourse-1843-07-23-burgess, tpjs-2007-ch-6]
  - ref: 15
    phrase: shall drink neither wine nor strong drink
    kind: history
    title: Set apart from birth
    body: |
      The rule against wine and strong drink is one part of the Nazarite vow ([[Num. 6:2–8]]), by which a person was separated from others and consecrated to the Lord’s service. Gabriel’s instruction suggests, though it does not say outright, that John was to be consecrated as a Nazarite from birth.

      The second promise is the more remarkable: John will be “filled with the Holy Ghost, even from his mother’s womb.” Luke shows it happening. When Mary’s greeting reaches Elisabeth, the unborn child leaps (verse 41), and the promise of this verse is kept before John has drawn a breath. Modern revelation repeats the promise ([[D&C 84:27]]) and adds that he was ordained when eight days old ([[D&C 84:28]]; see the note on verse 59).
    sources: [benson-matthews-john-baptist, lds-scriptures]
  - ref: 17
    phrase: in the spirit and power of Elias
    kind: scripture
    title: The spirit and power of Elias
    body: |
      “Elias” is the Greek spelling of Elijah, and the angel is quoting Malachi’s last prophecy: Elijah would come before the great day of the Lord to “turn the heart of the fathers to the children” ([[Mal. 4:5–6]]). Gabriel does not say that John is Elijah. He says John will go in Elijah’s “spirit and power,” which can rest on someone other than Elijah himself.

      Restoration scripture uses the word in that larger sense. Elias is also a title for a forerunner, and the Joseph Smith Translation shows that two Eliases were spoken of anciently, one who prepares and one who restores; John was the first kind, sent to prepare the way for Jesus. The Lord’s own words about this verse are that the angel promised Zacharias a son who “should be filled with the spirit of Elias” ([[D&C 27:7]]).

      John’s work in that spirit did not end with his death. He was the first of the ancient messengers to return to Joseph Smith and Oliver Cowdery, conferring the Aaronic Priesthood in 1829 ([[JS—H 1:68–72]]). Elijah himself came later, in the Kirtland Temple, to turn the hearts of the fathers and children as Malachi said ([[D&C 110:13–16]]).
    sources: [brown-testimony-luke, bd-elias, sc-knowhy-591, benson-matthews-john-baptist, lds-scriptures]
  - ref: 19
    phrase: I am Gabriel, that stand in the presence of God
    kind: prophets
    title: Who Gabriel is
    body: |
      Gabriel, “man of God,” is the angel sent to explain Daniel’s visions ([[Dan. 8:16]]; [[Dan. 9:21]]). Latter-day revelation adds who he was in mortality. Joseph Smith taught in 1839, as reported, that the priesthood was given first to Adam, “he is Michael the Archangel spoken of in the scriptures— Then to Noah who is Gabriel he stands next in authority to Adam, in the preasthood.”

      So the messenger who announced the births of John and Jesus was Noah. The Lord calls this same messenger “Elias” in [[D&C 27:6–7]], the angel who visited Zacharias and promised him his son; there the word is a title for one sent on a mission of preparing and restoring, as the note on verse 17 explains.
    sources: [bd-gabriel, jsp-discourse-1839-a, bd-elias, lds-scriptures]
  - ref: 20
    phrase: thou shalt be dumb, and not able to speak
    kind: history
    title: Why Zacharias was struck dumb
    body: |
      Zacharias and Mary both question the angel, but they ask different questions. Zacharias asks for proof, “Whereby shall I know this?” (verse 18), and the reason he gives, his age and his wife’s, shows that he doubts the promise can be kept. Mary asks how it will happen (verse 34), and accepts the answer. Joseph Smith named the cause as unbelief: “when the Angel told him that his promise was granted he because of unbelief was struck dumb.” So in the most sacred room he knew, a priest whom Luke has just called blameless (verse 6) doubted the power of God, and he carried the mark of it out to the waiting crowd.

      He seems to have lost his hearing too, since his neighbors later have to make signs to him (verse 62). Yet he did not leave the temple; he finished his days of service (verse 23). He began badly and ended well: the first words he speaks after his silence are praise, then prophecy (verses 64, 67).
    sources: [brown-testimony-luke, jsp-discourse-1843-07-23-burgess]
  - ref: 25
    phrase: to take away my reproach among men
    kind: history
    title: The reproach of barrenness
    body: |
      In Elisabeth’s world a childless wife was commonly thought to have offended God, so her barrenness was a disgrace before others and, it may be, a cloud of doubt within herself, though Luke has called her righteous and blameless (verse 6). Her words show what the child meant to her: the Lord had looked on her and lifted the shame. Why she “hid herself five months” (verse 24) Luke does not say. It may have been a season of withdrawal for spiritual preparation, at home beside a husband who could no longer speak.

      Her story is an old one in scripture. Sarah, Rebekah and Rachel were all barren before God gave them sons, and so were the mothers of Samson and Samuel. Each such birth was a sign that God keeps His promises, in time as well as in eternity. Gabriel draws the same lesson for Mary when he tells her of Elisabeth: “with God nothing shall be impossible” (verses 36–37).
    sources: [brown-testimony-luke, sc-knowhy-705]
  - ref: 28
    phrase: thou that art highly favoured
    kind: words
    title: Favoured with grace
    body: |
      “Highly favoured” is one Greek word, *kecharitōmenē*, from *charitoō*, built on *charis*, “grace.” In this verse it means “to pursue with grace, compass with favor; to honor with blessings”: Mary is the one on whom God has bestowed His favor. The verb has the same sense where Paul says God “hath made us accepted in the beloved” ([[Eph. 1:6]]): favor given. The angel says it again in plain terms in verse 30: “thou hast found favour with God.”

      The Joseph Smith Translation of this verse, which the footnotes do not print, names the giver and gives the reason: “Hail, thou virgin who art highly favoured of the Lord. The Lord is with thee, for thou art chosen and blessed among women.” The favor is the Lord’s, and it rests on His choice of her. That Nephi, Benjamin and Alma knew of her centuries earlier is noted in the setting above.
    sources: [thayer, jst-parallel-luke]
  - ref: 32
    phrase: shall be called the Son of the Highest
    kind: christ
    title: Son of the Highest, heir of David
    body: |
      “The Son of the Highest” means the Son of the Most High God, and the title is meant literally. The child to be born of Mary “was begotten of Elohim, the Eternal Father,” and so “was of right to be called the ‘Son of the Highest.’” The angel uses the same name for God again when Mary asks how it can be: “the power of the Highest shall overshadow thee” (verse 35).

      The kingship follows from the promise to David, that his house and throne would be established for ever ([[2 Sam. 7:16]]; [[Isa. 9:7]]). Luke has already said that Joseph was “of the house of David” (verse 27), and Mary too was of David’s lineage, so the child was David’s heir. The angel’s words reach past a restored kingdom of David: the reign is “for ever,” and “of his kingdom there shall be no end” (verse 33). The footnote to “throne” points to the Lord’s millennial reign.
    sources: [talmage-jesus-christ-7, lds-scriptures]
  - ref: 35
    phrase: the power of the Highest shall overshadow thee
    kind: christ
    title: How shall this be?
    body: |
      Mary’s question in verse 34 is about means, not about whether: she is betrothed and has not been with a man, and she asks how she will conceive. The angel answers with the Holy Ghost and the power of the Most High, and says no more than that. “Overshadow” (*episkiazō*) means to cast a shade over, and so to protect. The other scriptures that speak of the conception are just as reserved: Matthew says only that the child was “of the Holy Ghost” ([[Matt. 1:20]]), Nephi that the virgin “was carried away in the Spirit” ([[1 Ne. 11:19]]), and Alma that she would “be overshadowed and conceive by the power of the Holy Ghost” ([[Alma 7:10]]).

      What the angel does state is the consequence: “therefore also that holy thing which shall be born of thee shall be called the Son of God.” In Luke 1–2 that sonship is literal. Why that matters is taken up in the note on [[Matt. 1:20]].
    sources: [brown-testimony-luke, sc-knowhy-865, lds-scriptures]
  - ref: 43
    phrase: the mother of my Lord
    kind: christ
    title: Elisabeth’s witness
    body: |
      Elisabeth knows who Mary’s child is before Mary has told her anything. Her words leave no room for an earlier conversation: as soon as she hears the greeting, her own child leaps, she is filled with the Holy Ghost, and she calls the young woman at her door “the mother of my Lord.” The unborn John’s response seems to have brought the Spirit to his mother, and Elisabeth then does what her son will do as a man: she announces the Messiah.

      Her blessing, “Blessed is she that believed: for there shall be a performance of those things which were told her from the Lord” (verse 45), shows that she also knows what the angel promised Mary. Knowing by the Spirit both who the child is and how He was promised, she is the first witness of the virgin birth. The same words set Mary’s faith beside her husband’s doubt: Zacharias did not believe the angel’s words (verse 20); Mary did.
    sources: [brown-testimony-luke, benson-matthews-john-baptist]
  - ref: 46
    phrase: My soul doth magnify the Lord
    kind: scripture
    title: Mary’s song
    body: |
      Mary’s song, known as the Magnificat, is close kin to the song of Hannah, the barren woman who received Samuel and praised God for exalting the lowly and bringing down the proud ([[1 Sam. 2:1–10]]). Mary’s “low estate of his handmaiden” (verse 48) echoes Hannah’s prayer in the Greek Old Testament, where she asks the Lord to “look upon the humiliation of thine handmaid” (1 Samuel 1:11 in the Septuagint). “Handmaid” is a bondservant: Mary names herself God’s servant, as she had to the angel (verse 38).

      The song moves by reversals. The proud are scattered and the humble lifted, the mighty put down from their seats and those of low degree exalted, the hungry filled and the rich sent away empty (verses 51–53). They can be read as setting the tone for the whole of Luke’s Gospel, a story of God’s mercy reaching the poor and downtrodden and withheld from those who do not fear Him.

      Mary also calls God “my Saviour” (verse 47). The title is rare in the Gospels, and on her lips, following the Old Testament models, it means first the deliverer Israel hoped for: a national deliverer, and perhaps by extension a spiritual one. Its meaning widens the next time Luke uses it, when an angel announces to the shepherds “a Saviour, which is Christ the Lord” ([[Luke 2:11]]).
    sources: [brown-testimony-luke, lxx-rahlfs, huntsman-lukes-jesus, lds-scriptures]
  - ref: 59
    phrase: on the eighth day they came to circumcise the child
    kind: prophets
    title: Named and ordained on the eighth day
    body: |
      The relatives expected the boy to carry a family name, his father’s. His name had instead been given from heaven before his conception (verse 13), and both parents hold to it: Elisabeth says “John,” and Zacharias, unable to speak, writes it. John means “Jehovah is gracious,” fitting for a son given to an aged, barren couple. The moment Zacharias obeys the angel’s word, his tongue is loosed (verses 63–64).

      Modern revelation adds what Luke does not tell. John “was baptized while he was yet in his childhood, and was ordained by the angel of God at the time he was eight days old unto this power, to overthrow the kingdom of the Jews, and to make straight the way of the Lord” ([[D&C 84:28]]). That was an ordination to his mission, not to the priesthood itself, which a son of Aaron received by birth and began to exercise as a grown man ([[Num. 4:3]]). Eight days old is the age at which Luke has him circumcised and named (verse 59).
    sources: [benson-matthews-john-baptist, lds-scriptures]
  - ref: 69
    phrase: an horn of salvation
    kind: symbol
    title: A horn of salvation
    body: |
      Zacharias takes the phrase from the Psalms. In the Old Testament a horn stands for power and strength ([[1 Sam. 2:1]]; [[Ps. 89:17]]), an image drawn from the horns of the bull or the stag, and David called the Lord “my buckler, and the horn of my salvation” ([[Ps. 18:2]]). Zacharias follows Psalm 132, where the Lord promises, “There will I make the horn of David to bud: I have ordained a lamp for mine anointed” ([[Ps. 132:17]]). There the horn stands for the one who represents David’s house, the counterpart of the anointed in the verse’s other line. So “an horn of salvation … in the house of his servant David” names the coming Christ, raised up in David’s line as God’s saving strength. Verse 71 says what that salvation is: “that we should be saved from our enemies,” in the Greek simply “salvation from our enemies,” set beside the horn as its meaning.

      On a priest’s lips the word may carry one more echo. The altar of sacrifice and the altar of incense had raised horns at their corners, and Zacharias had stood beside the second when the angel came. On that reading his song speaks the temple’s language throughout, down to the “remission of their sins” (verse 77), the purpose of the burnt offering made every morning and evening.
    sources: [frederick-paradoxical-lamb, ellicott-luke, brown-testimony-luke]
  - ref: 78
    phrase: the dayspring from on high hath visited us
    kind: words
    title: The dawn from on high
    body: |
      “Dayspring” is *anatolē*, “a rising,” as of the sun or a star, and the footnote’s “dawn” is the plain sense: through God’s tender mercy a sunrise has come “from on high,” from God’s throne. The word carried messianic echoes for a reader of the Greek Old Testament, which uses related words for the star rising out of Jacob ([[Num. 24:17]]) and the Sun of Righteousness ([[Mal. 4:2]]), and *anatolē* itself for the righteous Branch, the shoot of David ([[Jer. 23:5]]; [[Zech. 6:12]]). For such a reader the word gathers a cluster of messianic meanings at once.

      Verse 79 says what the dawn is for. Its words come from [[Isa. 9:2]], the people who walked in darkness and saw a great light, and light here is a figure of salvation. The footnotes to the verse carry the promise beyond the living, to the spirits in prison to whom Christ preached ([[1 Pet. 3:19]]) and the dead who awaited Him ([[D&C 138:50–51]]).
    sources: [thayer, brown-testimony-luke, huntsman-lukes-jesus, lds-scriptures]
  - ref: 80
    phrase: was in the deserts till the day of his shewing unto Israel
    kind: history
    title: In the deserts until his showing
    body: |
      Luke leaves John’s youth in a sentence, and it cannot be said whether he lived in the wilderness east or west of the Jordan. Evidently he did not follow his father into the temple’s service as a priest. “The child grew, and waxed strong in spirit” echoes what was said of the young Samuel, “the child Samuel grew before the Lord” ([[1 Sam. 2:21]]), and sets John beside the earlier prophet.

      “His shewing” (*anadeixis*) is both his commissioning and his public appearance to Israel, which Luke tells in [[Luke 3:1–6]]. Joseph Smith described that day as the moment John took up his priesthood: “he came bounding out of the wilderness saying repent ye for the kingdom of heaven is at hand.”
    sources: [brown-testimony-luke, jsp-discourse-1843-07-23-burgess]

christ: |
  Luke’s first chapter points to Jesus before He is born. The angel calls Him the Son of the Highest and gives Him David’s throne for ever (verses 32–33); Elisabeth calls Him “my Lord” (verse 43); Mary rejoices in “God my Saviour” (verse 47); and Zacharias sees in Him the dawn from on high, come to give light to those who sit in darkness and the shadow of death (verses 78–79). Born of an immortal Father and a mortal mother, He inherited both the power to live forever and the capacity to die, and His Atonement made the Resurrection a reality and eternal life possible for all who obey His teachings.

  The chapter’s two answers to an angel are the two answers open to a disciple when God’s word seems impossible. “With God nothing shall be impossible” (verse 37), and the blessing Elisabeth speaks is for “she that believed,” because what the Lord has said will be performed (verse 45). Even a doubting priest’s silence ended in praise once he obeyed the word he had been given (verses 63–64).

explore: |
  - **Mary, known before her birth.** [[1 Ne. 11:13–21]], [[Mosiah 3:8]] and [[Alma 7:10]].
  - **Hannah beside Elisabeth and Mary.** Hannah’s prayer for a son and her song after his birth, in [[1 Sam. 1:9–28]] and [[1 Sam. 2:1–10]].
  - **The angel and the child in modern revelation.** [[D&C 27:6–8]] and [[D&C 84:26–28]]; John’s own return to restore the priesthood he held, [[JS—H 1:68–72]].
  - **Zacharias’s day in the temple.** “Tamid: Zacharias and the Second Temple,” in *Interpreter* 48 (2021), follows Zacharias’s life from his entry into the priesthood to the day the angel appeared to him.
  - **The story goes on.** The birth of Jesus and His presentation in the same temple, [[Luke 2]].

