chapter: 22
title: Not My Will, but Thine, Be Done
tagline: Judas bargains with the chief priests; Jesus eats the Passover with the Twelve, gives them the bread and the cup, settles their strife over who is greatest, warns Peter, and prays on the Mount of Olives until His sweat falls like blood; He is arrested, denied three times, mocked, and at dawn questioned by the council.
when: 'The last evening of Jesus’s mortal life and the dawn after it, at the Passover in Jerusalem; the evening falls on Thursday of the last week in the devotional calendar, the dawn on Friday'

setting: |
  Luke 22 opens the Gospel’s last division. Through chapter 21 Jesus has taught in the temple by day and gone out to the Mount of Olives by night ([[Luke 21:37–38]]). Now the feast of unleavened bread comes, and in one evening and the dawn after it He eats the Passover with the Twelve, gives them the sacrament, prays on the Mount of Olives, is arrested, and is questioned by the council. The devotional calendar sets that evening on the Thursday of the last week, so the council meets at Friday’s dawn.

  Matthew 26, Mark 14 and John 13 and 18 tell the same night. Luke follows the same outline but has much of his own: the strife over who is greatest, Jesus’s prayer that Peter’s faith fail not, the two swords, the angel and the sweat like drops of blood, the healing of the servant’s ear, the Lord’s look at Peter, and a council that meets only when it is day. Two short passages, the teaching on greatness (verses 24–30) and the warning to Peter (verses 31–34), have their nearest parallels in John 13. Throughout, Luke shortens what shows the disciples at their worst, even Judas, and shows Jesus at His most compassionate.

thread: |
  **Luke 22 is the hour of darkness, and Jesus walks into it in command of every scene.** Luke traces Satan’s reach through the night. He enters Judas (verse 3); he asks to sift the Apostles as wheat (verse 31), so that his reach goes past Judas to Peter, the rest of the Twelve and all who turn to the Savior; and at the arrest Jesus tells the men with swords, “this is your hour, and the power of darkness” (verse 53).

  Against him, Jesus gives. At the table He gives His body and His blood as a new covenant (verses 19–20) and answers His disciples’ quarrel by calling Himself the one who serves (verse 27). He prays for Peter before Peter falls (verse 32), gives His will to the Father in the garden (verse 42), heals a man who came out to take Him (verse 51), and turns to look at Peter as the cock crows (verse 61). At dawn He is His own only witness (verses 67–70). Judas is not in charge of these events. Jesus goes, “as he was wont,” to the place where Judas will find Him (verse 39), and the Son of Man goes “as it was determined” (verse 22): willingly.

sections:
  - range: 1-6
    heading: The plot and Judas’s bargain
    plain: |
      The feast of unleavened bread, called the Passover, was drawing near. The chief priests and the scribes were looking for a way to put Jesus to death, for they were afraid of the people. Then Satan entered into Judas, called Iscariot, who was one of the Twelve. He went off and talked with the chief priests and the officers of the temple guard about how he could hand Jesus over to them. They were glad and agreed to give him money. He consented, and from then on he looked for a chance to hand Jesus over to them when no crowd was present.
  - range: 7-13
    heading: The Passover prepared
    plain: |
      Then came the day of unleavened bread, when the Passover lamb had to be sacrificed. Jesus sent Peter and John: “Go and prepare the Passover for us, so that we may eat it.” “Where do you want us to prepare it?” they asked. He told them, “When you have gone into the city, a man carrying a jar of water will meet you. Follow him into the house he enters, and say to the master of the house, ‘The Master asks you, Where is the guest room where I may eat the Passover with my disciples?’ He will show you a large upstairs room, furnished. Make it ready there.” They went and found everything as He had told them, and they prepared the Passover.
  - range: 14-23
    heading: The Last Supper and the sacrament
    plain: |
      When the hour came, He took His place at the table, and the apostles with Him. He said to them, “I have longed with all my heart to eat this Passover with you before I suffer. For I tell you, I will not eat it again until it is fulfilled in the kingdom of God.” He took a cup, gave thanks, and said, “Take this and share it among yourselves. For I tell you, I will not drink of the fruit of the vine again until the kingdom of God comes.”

      Then He took bread, gave thanks, broke it and gave it to them, saying, “This is my body, which is given for you. Do this in remembrance of me.” In the same way, after the supper, He took the cup, saying, “This cup is the new covenant in my blood, which is shed for you.

      “But look: the hand of the man who is handing me over is with me on the table. The Son of Man goes as it has been decreed, but woe to that man by whom He is handed over!” And they began to ask one another which of them it could be who would do this.
  - range: 24-30
    heading: Who is greatest
    plain: |
      A quarrel also broke out among them over which of them should be thought the greatest. Jesus said to them, “The kings of the nations lord it over them, and those who hold authority over them are called Benefactors. You are not to be like that. Rather, let the greatest among you be like the youngest, and the leader like one who serves. Which is greater, the one who reclines at the table or the one who serves? Is it not the one at the table? But I am among you as one who serves.

      “You are the ones who have stood by me in my trials. And I give you a kingdom, as my Father has given one to me, so that you may eat and drink at my table in my kingdom, and sit on thrones judging the twelve tribes of Israel.”
  - range: 31-38
    heading: Peter warned, and the two swords
    plain: |
      And the Lord said, “Simon, Simon, Satan has asked to have all of you, to sift you like wheat. But I have prayed for you, Simon, that your faith will not fail. And when you have turned back, strengthen your brethren.” Peter answered, “Lord, I am ready to go with you both to prison and to death.” Jesus said, “I tell you, Peter, the cock will not crow today before you have denied three times that you know me.”

      Then He said to them all, “When I sent you out without a purse, a traveling bag or sandals, did you lack anything?” “Nothing,” they said. “But now,” He told them, “whoever has a purse should take it, and a bag as well; and whoever has no sword should sell his cloak and buy one. For I tell you, this scripture must be fulfilled in me: ‘And he was counted among the lawless.’ What is written about me is coming to its end.” They said, “Lord, look, here are two swords.” “That is enough,” He said.
  - range: 39-46
    heading: On the Mount of Olives
    plain: |
      He went out and made His way, as He usually did, to the Mount of Olives, and His disciples followed Him. When He reached the place, He told them, “Pray that you do not come into temptation.” He withdrew from them about a stone’s throw, knelt down and prayed: “Father, if you are willing, take this cup away from me. Yet not my will, but yours, be done.”

      An angel from heaven appeared to Him and gave Him strength. And being in anguish, He prayed more earnestly still, and His sweat became like great drops of blood falling to the ground. When He rose from prayer and came back to the disciples, He found them asleep from sorrow. “Why are you sleeping?” He asked them. “Get up and pray, so that you do not come into temptation.”
  - range: 47-53
    heading: The arrest
    plain: |
      While He was still speaking, a crowd appeared, and the man called Judas, one of the Twelve, was leading them. He came up to Jesus to kiss Him. But Jesus said to him, “Judas, are you handing over the Son of Man with a kiss?” When those around Him saw what was about to happen, they said, “Lord, shall we strike with the sword?” And one of them struck the high priest’s servant and cut off his right ear. But Jesus said, “Let it be,” and He touched the man’s ear and healed him.

      Then Jesus said to the chief priests, the officers of the temple guard and the elders who had come out against Him, “Have you come out with swords and clubs as if I were a bandit? Day after day I was with you in the temple, and you did not lay a hand on me. But this is your hour, and the power of darkness.”
  - range: 54-62
    heading: Peter’s denials
    plain: |
      They seized Him, led Him away and brought Him into the high priest’s house, and Peter followed at a distance. They lit a fire in the middle of the courtyard and sat down together, and Peter sat among them. A servant girl saw him sitting in the firelight, looked hard at him and said, “This man was with him too.” But he denied it: “Woman, I do not know him.” A little later someone else saw him and said, “You are one of them too.” “Man, I am not,” Peter said. About an hour later another man insisted, “Certainly this fellow was with him, for he is a Galilean.” Peter said, “Man, I do not know what you are talking about.” At that moment, while he was still speaking, the cock crowed.

      The Lord turned and looked at Peter. And Peter remembered the word the Lord had spoken to him: “Before the cock crows, you will deny me three times.” He went outside and wept bitterly.
  - range: 63-71
    heading: Mocked, and questioned by the council
    plain: |
      The men who were holding Jesus mocked Him and beat Him. They blindfolded Him, struck Him in the face and demanded, “Prophesy! Who hit you?” And they said many other insulting things against Him.

      As soon as day came, the elders of the people, the chief priests and the scribes gathered and brought Him before their council. “If you are the Christ,” they said, “tell us.” He answered, “If I tell you, you will not believe; and if I ask you a question, you will not answer me or let me go. But from now on the Son of Man will be seated at the right hand of the power of God.” They all said, “Are you, then, the Son of God?” He told them, “You say that I am.” Then they said, “What further testimony do we need? We have heard it ourselves from his own mouth.”

notes:
  - ref: 3
    phrase: Then entered Satan into Judas
    kind: history
    title: Then entered Satan into Judas
    body: |
      Luke gives the betrayal a cause beyond money. Mark says only that the priests promised Judas money ([[Mark 14:11]]); Luke and John say that Satan drove him (here and [[John 13:2]], [[John 13:27]]). The words say that Satan himself entered Judas, and in one Latter-day Saint reading this is the adversary’s own errand: with the chance to strike at the Savior through one of His trusted friends and to send Him to the cross, Satan sends no lieutenant but comes to Jerusalem himself (compare verses 31 and 53). On the same reading, Judas probably felt loyalty and love for the Savior, so that it took Satan’s enticement to bring him to betray Him. Yet the enticement does not lessen his guilt in the least ([[John 17:12]]).

      What Judas sells is opportunity. The chief priests and scribes “feared the people” (verse 2), so what they need is a time and place to take Jesus “in the absence of the multitude” (verse 6), away from the public gaze. The word behind “betray” in verses 4 and 6 is the ordinary verb for “hand over” (*paradidōmi*), used of Judas in all the Gospels rather than the technical word for betraying. What Judas promises is to deliver Jesus into their hands.
    sources: [huntsman-wednesday, brown-testimony-luke]
  - ref: 15
    phrase: With desire I have desired
    kind: words
    title: With desire I have desired
    body: |
      The doubled wording is an emphatic idiom: “I have most earnestly desired.” It sets a verb beside a word from its own root, a pattern most scholars take as the language of the Septuagint, the Greek Old Testament, and many as a Hebrew or Aramaic turn of phrase; if the words are Jesus’s own, they keep something of the color of His speech at the table. What He longed for was this meal with these men “before I suffer.” It is the first time at the supper that He says His death is at hand.

      Matthew, Mark and Luke make the supper a Passover meal, and Luke’s “this passover” says so outright; on one Latter-day Saint reading the words mean that the Passover lamb lay on the table before them. John times the feast differently: by his account the Passover began at sunset the next day, after the Crucifixion ([[John 18:28]]). Another Latter-day Saint proposal starts from the same words: Jesus’s earnest wish to eat “this passover” with His friends before He suffered may mean that He chose to keep the Passover, or at least its central parts, with them that night, whether or not a lamb was on the table.
    sources: [brown-testimony-luke, huntsman-thursday]
  - ref: 16
    phrase: until it be fulfilled in the kingdom of God
    kind: scripture
    title: Until it be fulfilled
    body: |
      Jesus says He will not eat the Passover again “until it be fulfilled in the kingdom of God,” and the promise looks toward a meal still to come. His words over the wine in verse 18 point the same way: not to drink of the fruit of the vine until the kingdom comes alludes to the messianic banquet, the feast that stands in the prophets for eternal fellowship with God at the end of time ([[Isa. 25:6–8]]). Latter-day revelation names the guests. The Lord will drink of the fruit of the vine on the earth with Moroni, Elias, John the son of Zacharias, Elijah, Joseph, Jacob, Isaac and Abraham, Michael or Adam, and Peter, James and John, “and also with all those whom my Father hath given me out of the world” ([[D&C 27:5–14]]).

      “Fulfilled” may also point nearer. One reading takes the Passover as fulfilled first in His sacrifice on the cross, and then in every remembrance of that sacrifice in the ordinance He is about to give them. The Joseph Smith Translation names what must be fulfilled first: “until it be fulfilled which is written in the prophets concerning me. Then I will partake with you.” What the prophets wrote of Him comes first; the feast comes after.
    sources: [huntsman-thursday, ellicott-luke, lds-scriptures]
  - ref: 17
    phrase: he took the cup, and gave thanks
    kind: history
    title: Two cups
    body: |
      Luke alone has two cups, one before the bread (verse 17) and one “after supper” (verse 20), and the first was probably part of the Passover meal itself. A blessing spoken by the host over a cup of wine, which was then passed around the table to each in turn, was the customary way to begin the Passover supper, and at this meal Jesus appears to have kept the essentials of the feast. This cup was probably the first of the cups of wine that Jewish custom had added to the Passover ritual. It is a separate act from the cup of verse 20, and Jesus says nothing over it of His body or blood: Jesus hands it to the Twelve to divide among themselves and speaks over it of the feast still to come (verse 18).

      The second cup comes “after supper,” where Paul also places it ([[1 Cor. 11:25]]). So the meal itself stands between the bread and the cup of the sacrament. Matthew and Mark tell only of the one cup that becomes the sacrament ([[Matt. 26:27–28]]; [[Mark 14:23–24]]).
    sources: [talmage-jesus-christ-33, ellicott-luke]
  - ref: 19
    phrase: this do in remembrance of me
    kind: scripture
    title: This do in remembrance of me
    body: |
      Luke’s words over the bread are nearly those Paul received and passed on to the Corinthians ([[1 Cor. 11:24]]), and among the four accounts Luke and Paul agree most closely; Luke, by tradition Paul’s missionary companion, appears to draw on Paul’s account as well as on Mark’s. Only these two have “this do in remembrance of me.”

      “This do” asks the Twelve to do again what He has just done: on one Latter-day Saint reading, both to administer the ordinance with authority, as He has, and to partake of it in faith. When the Risen Lord gave the sacrament to the Nephites He said the same and more: “this shall ye do in remembrance of my body, which I have shown unto you. And it shall be a testimony unto the Father that ye do always remember me” ([[3 Ne. 18:7]]). The Joseph Smith Translation of Matthew and Mark gives the fuller form too, “in remembrance of my body.”

      That is still what the ordinance is for. The word that dominates the sacramental prayers is *remember*: those who partake witness that they will always remember Him, that they may always have His Spirit to be with them ([[D&C 20:77]], [[D&C 20:79]]).
    sources: [huntsman-thursday, brown-testimony-luke, lds-scriptures, holland-remembrance]
  - ref: 20
    phrase: This cup is the new testament in my blood
    kind: words
    title: The new testament in my blood
    body: |
      “Testament” translates *diathēkē*, a word with two senses, and here it is the covenant. In classical Greek *diathēkē* was a last will and testament; in the Septuagint, the Greek Old Testament, it translated the Hebrew *bərît*, the covenant between God and His people. A “new” covenant calls up Jeremiah’s promise that the Lord would make a new covenant to replace the one Israel had broken, written this time in their hearts ([[Jer. 31:31–33]]).

      The blood belongs to the covenant as well. Moses sealed the covenant at Sinai with the blood of sacrifices, “the blood of the covenant” ([[Ex. 24:8]]), and Jesus’s blood “shed for you” ties this cup both to God’s earlier covenant with His people and to His own death. The new covenant will take its life from His blood, not from the blood of animals on the temple’s altar.
    sources: [huntsman-thursday, brown-testimony-luke, lds-scriptures]
  - ref: 21
    phrase: the hand of him that betrayeth me is with me on the table
    kind: history
    title: The betrayer at the table
    body: |
      Luke has Jesus speak of the betrayer only after the bread and the cup (verses 21–23); Matthew and Mark put the warning before the sacrament is given ([[Matt. 26:21–26]]; [[Mark 14:18–22]]), and John, who does not tell of the institution, leaves the order open. So whether Judas partook of the sacrament cannot be said for certain; if Matthew’s and Mark’s order is followed, he probably did not. Either way, the hand of the man who will hand Jesus over is on the same table, and John records that Jesus saw in it the fulfillment of [[Ps. 41:9]]: “He that eateth bread with me hath lifted up his heel against me” ([[John 13:18]]). Here Jesus knows who it is and does not say his name.

      “As it was determined” is a word Luke uses often, and it is the one Peter uses at Pentecost when he tells the crowd that Jesus was delivered “by the determinate counsel and foreknowledge of God” ([[Acts 2:23]]). The appointment that the Christ should suffer did not make men any less free, nor lessen the guilt of treachery, and the “woe” that follows holds Judas answerable.
    sources: [ellicott-luke, ellicott-matthew, thayer, lds-scriptures]
  - ref: 24
    phrase: there was also a strife among them, which of them should be accounted the greatest
    kind: history
    title: Strife at the supper
    body: |
      Only Luke tells of this quarrel, and he sets it at the Last Supper, just after the bread and the cup. Matthew and Mark tell of a dispute over greatness on another day, after James and John asked for the seats beside Jesus in His kingdom ([[Matt. 20:20–28]]; [[Mark 10:35–45]]). The scenes differ, and Jesus ends His answer differently each time: there with His life given “a ransom for many” ([[Matt. 20:28]]), here with Himself as the one who serves (verse 27). That He taught a like lesson twice to the same men is not surprising.

      Luke does not hide the disciples’ faults, even here, on the holiest night of their lives. The teaching that answers the quarrel is the teaching John attaches to the washing of the disciples’ feet that same evening ([[John 13:12–17]]): Luke does not tell of the washing, but he keeps what it taught.
    sources: [brown-testimony-luke, huntsman-thursday]
  - ref: 25
    phrase: are called benefactors
    kind: words
    title: Called benefactors
    body: |
      “Benefactor” (*euergetēs*) was a formal title of honor, not a passing compliment. It was conferred on those who had done their country a service, and on princes, and kings bore it: Antiochus VII of Syria and Ptolemy III of Egypt were each called Euergetes. When Jesus taught the same lesson on another occasion, Matthew and Mark have “their great ones exercise authority upon them” ([[Mark 10:42]]); here Luke has the title instead.

      The point is in “are called,” set against “let him be” in the next verse. The world could give the name of benefactor to those whose greatness was power alone; in Christ’s kingdom greatness is reached by doing good to others in the humblest service. Luke’s own writings later give the verb of the title to Jesus, who “went about doing good” ([[Acts 10:38]]).
    sources: [thayer, ellicott-luke]
  - ref: 27
    phrase: I am among you as he that serveth
    kind: christ
    title: As he that serveth
    body: |
      Jesus turns the world’s order upside down with an image from the room they are sitting in. The quarrel may itself have been over who should take which place at the table, a question of precedence that scribes, Pharisees and Gentiles alike often fought over. “Let him be as the younger” (verse 26) asks the greatest to take the place that carried the work: the younger were the ones who served, and in the early Church “the young men” appear as a group with tasks like those of later deacons ([[Acts 5:6]]). Then He asks who is greater, the guest at the table or the one who waits on him. The answer anyone would give is the guest. Yet He, their Lord, is among them as the one who serves, and John tells how that very evening He had girded Himself with a towel and washed their feet ([[John 13:4–5]]).

      Luke has already heard Him promise that in the coming kingdom the master will gird himself and serve his faithful servants ([[Luke 12:37]]). King Benjamin, unlike the kings of verse 25, asks his people, “if I, whom ye call your king, do labor to serve you, then ought not ye to labor to serve one another?” ([[Mosiah 2:18]]).
    sources: [talmage-jesus-christ-33, ellicott-luke, lds-scriptures]
  - ref: 29
    phrase: I appoint unto you a kingdom, as my Father hath appointed unto me
    kind: scripture
    title: I appoint unto you a kingdom
    body: |
      Having told the Apostles to serve, Jesus promises them a kingdom, for they have stood by Him in His trials (verse 28). The verb for “appoint” (*diatithēmi*) means to assign something to another as his own; it is also the verb for disposing of property by will and for making a covenant, and the noun formed from it is the “testament,” the covenant, of verse 20. The shared root suggests that the kingdom is part of the new covenant made at this table. They are to share His glory as they have shared His trials, and “as my Father hath appointed unto me” suggests that His own throne came on the same terms: the sufferings first, then the glory. The promise holds on a condition. If they proved faithful, they would sit on thrones as the judges of Israel.

      The promise that the Twelve will judge Israel is kept in Restoration scripture. The Lord declares that “mine apostles, the Twelve which were with me in my ministry at Jerusalem,” will stand at His right hand at His coming, “with crowns upon their heads,” to judge the whole house of Israel, “even as many as have loved me and kept my commandments” ([[D&C 29:12]]). Mormon adds that the Nephites too will be judged by the twelve Jesus chose among them, and those twelve by the Twelve of Jerusalem ([[Morm. 3:18–19]]).
    sources: [thayer, ellicott-luke, talmage-jesus-christ-33, lds-scriptures]
  - ref: 31
    phrase: Satan hath desired to have you, that he may sift you as wheat
    kind: words
    title: Sift you as wheat
    body: |
      Jesus speaks to Simon, but the “you” Satan wants is plural in Greek (*hymas*): the whole company of the disciples. The verb (*exaiteō*) means to ask that someone be handed over out of another’s power, for good or, as here, for trial; here Satan asks for the Apostles out of God’s keeping, to be tried by afflictions, as he asked for Job ([[Job 1:6–12]]). Both Satan’s “hath desired” and Jesus’s “I have prayed” are in the tense of an act already done, which one reading takes to mean that Jesus spoke of a scene like the one in Job, in which He had already pleaded for them against the accuser.

      To sift (*siniazō*) is to shake in a sieve, and the figure means to try one’s faith to the verge of overthrow. It is the harvest image of the winnowing fan ([[Matt. 3:12]]) on a smaller scale, and it hides an encouragement: they are to be sifted *as wheat*. The good grain is there. The Risen Lord gave the Nephites the same warning, “Satan desireth to have you, that he may sift you as wheat” ([[3 Ne. 18:18]]), and the Joseph Smith Translation widens the circle still further: “Satan hath desired you, that he may sift the children of the kingdom as wheat.”

      Then the pronoun turns singular. “I have prayed for thee” (verse 32) is for Peter alone.
    sources: [greek-nt, thayer, ellicott-luke, lds-scriptures]
  - ref: 32
    phrase: when thou art converted, strengthen thy brethren
    kind: words
    title: When thou art converted
    body: |
      Peter had followed Jesus for years and confessed Him as the Christ ([[Luke 9:20]]), so “converted” can puzzle a reader. The Greek *epistrephō* means to turn back again; one modern translation has “once you have recovered.” Jesus is foretelling a fall and a return in one breath. His prayer is not that Peter will be spared the test but that his faith will not fail in it, and the words held out hope for the hour when Peter fell: he could turn back, and once recovered be a greater strength to his brethren.

      Luke gives Peter’s answer at its best, “I am ready to go with thee, both into prison, and to death” (verse 33), and in his later ministry Peter did both. One Latter-day Saint reading holds that the strength came after the Cross, when the completed Atonement brought grace sufficient to let him keep the charge, which the Risen Lord seems to renew on the shore of the Sea of Galilee: “Feed my sheep” ([[John 21:15–17]]).
    sources: [huntsman-peters-denial, brown-testimony-luke]
  - ref: 36
    phrase: he that hath no sword, let him sell his garment, and buy one
    kind: history
    title: Buy a sword
    body: |
      “But now” marks a new order of things for the Apostles. When Jesus sent them out before, they took nothing and lacked nothing ([[Luke 9:3]]; [[Luke 10:4]]). Now persecution awaits them, and they are about to lose the Master’s sustaining presence. The purse and the bag would counsel only ordinary prudence in place of the simple trust of before; the sword is the hard word. Jesus’s own command at the arrest shows that they were not to use it in His defense (“Put up again thy sword into his place,” [[Matt. 26:52]]), and it is not likely that He meant them to use it in their own as they preached. A probable explanation is that He put His warning in the terms of their own fears: if they meant to trust in swords, a time was coming when they would sorely need them.

      The reason He gives is His own death: “he was reckoned among the transgressors,” the line of [[Isa. 53:12]]. Isaiah’s picture of the righteous sufferer seems to have been in His mind all along as the one He had to fulfill. He is about to be hurried to death as a criminal among criminals, and His disciples will be regarded as followers of an executed man. Some of them took the sword literally and produced two then and there. His “It is enough” can be heard as a curt “Enough of this”: He had spoken of no present need for weapons, least of all to defend Him. They had missed His meaning, but experience would teach them.
    sources: [talmage-jesus-christ-33, ellicott-luke]
  - ref: 42
    phrase: remove this cup from me
    kind: symbol
    title: This cup
    body: |
      The cup Jesus asks the Father to take away is the suffering now upon Him, and Restoration scripture says what was in it. When the Risen Lord appeared to the Nephites, He spoke of it as soon as He had named Himself: “I have drunk out of that bitter cup which the Father hath given me, and have glorified the Father in taking upon me the sins of the world” ([[3 Ne. 11:11]]). There He first calls it the “bitter cup,” words Alma had used of what the wicked drink as the consequence of their sins ([[Alma 40:26]]). The Savior drank that consequence on behalf of all, so that those who repent need not drink it themselves. His own account to Joseph Smith remembers the hour from within: the suffering caused Him “to tremble because of pain, and to bleed at every pore, and to suffer both body and spirit—and would that I might not drink the bitter cup, and shrink” ([[D&C 19:18]]).

      The prayer never asks for the cup to pass apart from the Father’s will. “If thou be willing” comes first and “not my will, but thine, be done” last, an echo of the prayer He had taught His disciples, “Thy will be done” ([[Luke 11:2]]). What that prayer always carried implicitly, the request here makes explicit. In Matthew the second prayer has already yielded: “if this cup may not pass away from me, except I drink it, thy will be done” ([[Matt. 26:42]]).
    sources: [sc-knowhy-341, ellicott-luke, lds-scriptures]
  - ref: 43
    phrase: there appeared an angel unto him from heaven, strengthening him
    kind: history
    title: An angel strengthening him
    body: |
      Only Luke tells of the angel and of the sweat like blood, and these two verses have a question of their own. They are missing from the earliest manuscript of Luke, a papyrus called P75, and from other important manuscripts, and many scholars doubt that Luke wrote them; a few manuscripts put them after [[Matt. 26:39]] instead. But early Christian writers knew them (Justin and Irenaeus cite the bleeding, and Tatian includes the angel), and in every manuscript that has them the two verses stand together. Scholars, a Latter-day Saint among them, have found that early copyists hesitated to portray Jesus as needing an angel’s help or as shrinking from His fate, which may explain why some left the verses out. Latter-day Saint scholars judge that they may well be original to Luke and were dropped over doctrinal concerns, and that there is reason enough to accept them, while the manuscript question stays open. Restoration scripture speaks of the same suffering (see the next note).

      The angel’s coming shows the truth of what Jesus has just told the disciples, to pray (verses 40, 46): prayer brings heaven’s help in trial, and He receives that help Himself. The scene echoes the Transfiguration, where Moses and Elias came to speak with Him of His death while Peter, James and John slept ([[Luke 9:30–32]]). Who the angel was, scripture does not say; an apostle offered no more than a supposition: “we suppose it was mighty Michael, who foremost fell that mortal man might be.”
    sources: [brown-testimony-luke, huntsman-thursday, sc-knowhy-520, mcconkie-gethsemane-1985]
  - ref: 44
    phrase: his sweat was as it were great drops of blood falling down to the ground
    kind: christ
    title: As it were great drops of blood
    body: |
      “Agony” (*agōnia*) first meant a contest or struggle, the strain of an athlete before a contest or a soldier before a battle, and Luke shows Jesus in that struggle praying “more earnestly.” Then comes the sweat “as it were” (*hōsei*) great drops of blood. The Greek particle can mean “like” or “as,” and scholars divide over it: most read a simile, sweat pouring as though it were blood, while a minority read actual bleeding. The word for “drops” (*thrombos*), found nowhere else in the New Testament, can mean a clot or a small amount of blood, so the word leaves both readings open.

      Restoration scripture tips the balance toward the second reading. The angel told King Benjamin that “blood cometh from every pore, so great shall be his anguish for the wickedness and the abominations of his people” ([[Mosiah 3:7]]), and the Lord Himself said that His suffering caused Him “to bleed at every pore” ([[D&C 19:18]]). Neither passage names Gethsemane, and the Joseph Smith Translation keeps Luke’s “as it were” (“he sweat as it were great drops of blood”). Read beside Luke, though, they describe the same suffering. Whatever the bodily process, the cause was what Benjamin’s angel names: anguish “for the wickedness and the abominations of his people.”
    sources: [huntsman-thursday, brown-testimony-luke, sc-knowhy-520, lds-scriptures]
  - ref: 45
    phrase: he found them sleeping for sorrow
    kind: words
    title: Sleeping for sorrow
    body: |
      Matthew and Mark tell of three prayers and three returns to sleeping disciples ([[Mark 14:37–41]]); Luke tells of one, and he alone gives a reason for their sleep. “For sorrow” means “from grief”: they were worn out by it. Luke’s spare account, here as elsewhere, seems meant to soften the disciples’ failure rather than dwell on it. It also recalls the mount of Transfiguration, where Peter and those with him were heavy with sleep while heavenly messengers spoke with Jesus of His death ([[Luke 9:32]]).
    sources: [brown-testimony-luke, huntsman-thursday]
  - ref: 48
    phrase: betrayest thou the Son of man with a kiss?
    kind: history
    title: Betrayest thou the Son of man with a kiss?
    body: |
      A kiss was usually a disciple’s token of respect and devotion to his master, and Jesus’s question seems to name what Judas has made of it: the token of loyalty turned into the signal for an arrest. Matthew and Mark say Judas kissed Him ([[Matt. 26:49]]; [[Mark 14:45]]); Luke says only that he drew near to do it, and leaves it unclear whether he did, perhaps because he would not picture the betrayer in intimate contact with Jesus. Jesus calls Himself “the Son of man,” the title of His prophecies of suffering ([[Luke 9:44]]; [[Luke 18:31–33]]), at the very moment Satan seems to triumph.
    sources: [huntsman-thursday, brown-testimony-luke]
  - ref: 51
    phrase: he touched his ear, and healed him
    kind: christ
    title: He touched his ear, and healed him
    body: |
      Only Luke records this healing. The man was a servant of the high priest, not an officer, and he had come out with the crowd to take Jesus. Luke, whose portrait of Jesus is everywhere compassionate, lets the act speak: the love Jesus had taught (“Love your enemies, do good to them which hate you,” [[Luke 6:27]]) He gives to a man who came against Him, as He will soon pray for those who crucify Him ([[Luke 23:34]]).

      What “Suffer ye thus far” means is unclear. It may be spoken to the disciples, “No more of this!”, or to the arresting party, “Let them have their way.” Either way, the healing fits His refusal to let the swordplay go on.
    sources: [huntsman-thursday, brown-testimony-luke]
  - ref: 53
    phrase: this is your hour, and the power of darkness
    kind: symbol
    title: Your hour, and the power of darkness
    body: |
      Jesus sets day against night. “Daily” He taught in the temple and no one laid a hand on Him; they feared the people (verse 2; [[Luke 20:19]]). So they have come at night, with swords and staves as if for a thief. Though He gives Himself up without resistance, His question protests the way they have come: by night, armed, as against a thief.

      “The power of darkness” names whose power is at work in their hour. The words are Luke’s alone in this scene, but Paul uses the same phrase of the power from which the Father has delivered the Saints ([[Col. 1:13]]), and John records Jesus saying that same night, “the prince of this world cometh, and hath nothing in me” ([[John 14:30]]). In calling the power that worked through these men darkness, Jesus may in effect be claiming to be the Light ([[John 8:12]]).
    sources: [talmage-jesus-christ-33, ellicott-luke]
  - ref: 61
    phrase: the Lord turned, and looked upon Peter
    kind: christ
    title: The Lord turned, and looked upon Peter
    body: |
      Only Luke has this look, and it makes the moment almost unbearable: Jesus, being led past at that very instant, turns and looks at Peter as the cock crows. Luke tells the denials more gently than Matthew and Mark. All three take place by the fire; the first is the flat “I know him not” that comes last in the other Gospels, the last is the softest, “I know not what thou sayest,” and there is no cursing or swearing. What Peter denies is knowing Jesus and being one of His followers; he never denies his testimony, given him earlier by revelation, that Jesus is the Christ.

      The look may hold hope as well as reproach. The Lord’s turning may recall the turning back Jesus had foretold in verse 32 (“when thou art converted”), and Peter’s repentance begins here, with that look. He goes out and weeps bitterly. His healing, it seems, will not be complete until he has met the Risen Lord ([[Luke 24:34]]) and been given charge of His sheep ([[John 21:15–17]]).
    sources: [huntsman-thursday, huntsman-peters-denial, brown-testimony-luke]
  - ref: 64
    phrase: Prophesy, who is it that smote thee?
    kind: history
    title: Prophesy, who is it that smote thee?
    body: |
      The men holding Jesus make a game of His claim to be a prophet. They blindfold Him, strike Him and demand that He name the striker, as though prophecy were a trick of seeing what cannot be seen. The irony is Luke’s arrangement of the scenes. A few moments earlier, in the courtyard, Jesus’s prophecy that Peter would deny Him three times before the cock crowed has come true to the letter (verses 34, 60–61). He is mocked as a false prophet just as His word is fulfilled, and it is His tormentors, not He, who cannot see.
    sources: [huntsman-peters-denial, brown-testimony-luke]
  - ref: 66
    phrase: as soon as it was day
    kind: history
    title: As soon as it was day
    body: |
      Matthew and Mark tell of a hearing before the high priest in the night, with false witnesses who could not agree ([[Mark 14:55–64]]), and John of a questioning before Annas ([[John 18:13]]; [[John 18:19–24]]). In Luke Jesus is only held through the night at the high priest’s house, mocked and beaten, and nobody questions Him until morning, when the elders, chief priests and scribes take Him into “their council,” the Sanhedrin.

      Luke’s morning has no witnesses but Jesus. Their “What need we any further witness?” implies that others had been heard, but Luke names no false accusers, only the council’s question and His answer, and their conclusion fits it exactly: “we ourselves have heard of his own mouth” (verse 71). In Luke’s telling, the only testimony against Him is His testimony of Himself.
    sources: [huntsman-thursday, brown-testimony-luke, lds-scriptures]
  - ref: 70
    phrase: Ye say that I am
    kind: words
    title: Ye say that I am
    body: |
      “Ye say that I am” is an answer, not an evasion. In Matthew His like reply to the high priest, “Thou hast said,” meant “I am what thou hast said,” an unqualified avowal of His divine Sonship. The answer here is complete in itself and implies the same confession: He is what they asked. The Greek closes with *egō eimi*, “I am,” words that may carry something of the weight they have when He says in John, “Before Abraham was, I am” ([[John 8:58]]). Only Luke has the whole council ask, “Art thou then the Son of God?”, and they took His answer as testimony from His own mouth (verse 71). He will give Pilate a like answer ([[Luke 23:3]]).

      Their question follows verse 69. His “if I also ask you, ye will not answer me” (verse 68) recalls the question about David’s Lord that they had been unable to answer in the temple, where He quoted [[Ps. 110:1]] ([[Luke 20:41–44]]). Now He claims the seat that psalm gives: “Hereafter,” from now on, the Son of man will sit at the right hand of the power of God. Matthew and Mark have “ye shall see” Him there, coming in the clouds ([[Mark 14:62]]); Luke has only that He “shall sit,” as though even in the suffering just ahead He is already glorified. On that reading the cross was His throne.
    sources: [talmage-jesus-christ-34, ellicott-luke, greek-nt, lds-scriptures]

christ: |
  Luke 22 shows Jesus Christ giving Himself before anything is taken from Him. At the table He gives His body and blood as a new covenant; in the garden He gives His will to the Father and drinks the bitter cup He had asked to be spared ([[D&C 19:18]]); at the arrest He heals; in the courtyard He looks on the friend who has just denied Him. The bread and water of the sacrament are given so that His disciples “always remember him” ([[D&C 20:77]]), and the cup recalls the suffering that began in Gethsemane. Because He walked that night’s path alone, betrayed, abandoned and denied, no disciple has to walk a dark hour alone.

explore: |
  - **The other tellings.** [[Matt. 26:17–75]] and [[Mark 14:12–72]] for the supper, Gethsemane and the denials; [[John 13:1–38]] for the washing of feet that Luke’s teaching on service answers, and [[John 18:1–27]] for the arrest and the questioning before Annas.
  - **The Savior’s own account of Gethsemane.** [[D&C 19:15–20]], beside the angel’s prophecy to King Benjamin, [[Mosiah 3:7]], and Alma’s, [[Alma 7:11–13]].
  - **The sacrament given again.** [[3 Ne. 18:1–14]], where the Risen Lord gives the bread and wine to the Nephites “in remembrance of my body.”
  - **Peter turned back.** [[John 21:15–17]], where the charge to strengthen the brethren is given again.
  - **Further reading.** The chapter “Thursday” in *Greater Love Hath No Man* (Religious Studies Center) follows the night from the supper through Gethsemane to the arrest; “The Accounts of Peter’s Denial,” in *The Ministry of Peter, the Chief Apostle*, sets the four tellings of Peter’s fall side by side.

