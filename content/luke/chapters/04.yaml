chapter: 4
title: The Spirit of the Lord Is upon Me
tagline: Full of the Holy Ghost, Jesus turns back the devil’s offer of power, reads Isaiah’s promise of deliverance in the synagogue at Nazareth and says it is fulfilled, is driven to the edge of a cliff by His own townspeople, and then shows in Capernaum the authority He had claimed.
when: 'The opening of the ministry in Galilee, after the baptism and the forty days in the wilderness'

setting: |
  Luke 4 follows straight on from the baptism, where the Holy Ghost came down on Jesus and the Father called Him His beloved Son ([[Luke 3:21–22]]), and from the genealogy that ends “which was the son of God” ([[Luke 3:38]]). The chapter has two halves. The first, the temptation in the wilderness, Luke shares with Matthew and Mark. The second opens with a scene only Luke tells: Jesus reads from Isaiah in the synagogue of the town where He grew up and announces that the prophecy is fulfilled in Him. In many ways this reading is the program of the whole Gospel, which the rest of the book carries out.

  Matthew and Mark tell of a visit to Nazareth much later ([[Matt. 13:54–58]]; [[Mark 6:1–6]]). The chronology this site follows counts two visits, and the accounts differ enough to bear that out: in Mark the disciples are with Him and the Twelve are sent out straight afterward, and the town's unbelief is quiet, where in Luke He comes alone and the town tries to kill Him. Luke tells the Nazareth visit before the scenes in Capernaum, but the townspeople's words in verse 23 show that Jesus had already been at work in Capernaum during the tour of Galilee's synagogues in verses 14–15, so the miracles told at the end of the chapter may belong to that earlier tour.

thread: |
  **The Spirit that came upon Jesus at His baptism drives the whole chapter, and the question it settles is who holds authority.**

  Luke marks the Spirit at every turn. Jesus returns from the Jordan “full of the Holy Ghost” and is led by the Spirit into the wilderness (verse 1); He comes back to Galilee “in the power of the Spirit” (verse 14); and His first words in a synagogue are Isaiah’s: “The Spirit of the Lord is upon me” (verse 18).

  The devil raises the question of authority. He claims that the kingdoms of the world and their “power” have been handed to him, to give to whom he will (verse 6). Jesus does not argue the claim; He answers with scripture and walks away. The answer comes later, in synagogues. At Nazareth He reads that He has been anointed and sent, and the town will not accept Him. At Capernaum His word comes “with power,” the same word the devil had used (verse 32), and an unclean spirit obeys (verses 33–36). Fever and every kind of disease give way at His hand (verses 38–40).

  The chapter ends where Isaiah’s program points: not settled in one grateful town, but on the road. “I must preach the kingdom of God to other cities also: for therefore am I sent” (verse 43).

sections:
  - range: 1-13
    heading: Tempted in the wilderness
    plain: |
      Full of the Holy Ghost, Jesus came back from the Jordan, and the Spirit led Him into the wilderness, where for forty days the devil tempted Him. He ate nothing in those days, and when they were over He was hungry. The devil said, “If you are the Son of God, tell this stone to become bread.” Jesus answered, “It is written: a person does not live by bread alone, but by every word of God.” Then He was taken up a high mountain and shown all the kingdoms of the world in an instant. The devil said, “I will give you all this authority and all their glory, for it has been handed over to me, and I give it to whomever I choose. If you will worship me, it will all be yours.” Jesus answered, “Get behind me, Satan. It is written: worship the Lord your God, and serve Him only.” Then He was brought to Jerusalem and set on the highest point of the temple, and the devil said, “If you are the Son of God, throw yourself down from here. For it is written: He will command His angels to guard you, and they will lift you up in their hands so that you do not strike your foot against a stone.” Jesus answered, “It has been said: do not put the Lord your God to the test.” When the devil had finished every temptation, he left Him for a time.
  - range: 14-15
    heading: Back to Galilee in the power of the Spirit
    plain: |
      Jesus returned to Galilee in the power of the Spirit, and word about Him spread through the whole region. He taught in their synagogues, and everyone praised Him.
  - range: 16-30
    heading: The scripture fulfilled at Nazareth
    plain: |
      He came to Nazareth, where He had grown up, and on the Sabbath He went to the synagogue as He always did, and stood up to read. The scroll of the prophet Isaiah was handed to Him. He unrolled it and found the place where it was written: “The Spirit of the Lord is upon me, because He has anointed me to bring good news to the poor. He has sent me to heal the brokenhearted, to proclaim release to the captives and sight to the blind, to set the broken free, to proclaim the year of the Lord’s favor.” He rolled up the scroll, gave it back to the attendant, and sat down, and every eye in the synagogue was fixed on Him. He began: “Today this scripture has been fulfilled as you heard it.” They all spoke well of Him and marveled at the gracious words He spoke, and they said, “Isn’t this Joseph’s son?” He said to them, “No doubt you will quote me the proverb, ‘Doctor, heal yourself’: do here in your hometown what we heard you did in Capernaum.” And He said, “Truly, no prophet is accepted in his own hometown. There were many widows in Israel in Elijah’s day, when the sky was shut for three and a half years and there was a great famine through all the land, yet Elijah was sent to none of them, only to a widow at Zarephath in the land of Sidon. And there were many lepers in Israel in the time of the prophet Elisha, yet none of them was cleansed except Naaman the Syrian.” When they heard this, everyone in the synagogue was furious. They got up, drove Him out of the town, and led Him to the brow of the hill on which their town was built, to throw Him off the cliff. But He walked right through the middle of them and went on His way.
  - range: 31-37
    heading: Authority in the synagogue at Capernaum
    plain: |
      He went down to Capernaum, a town in Galilee, and taught the people on the Sabbath. They were astonished at His teaching, because His word carried authority. In the synagogue was a man with the spirit of an unclean devil, who cried out with a loud voice, “Leave us alone! What have we to do with you, Jesus of Nazareth? Have you come to destroy us? I know who you are: the Holy One of God.” Jesus rebuked him: “Be silent, and come out of him.” The devil threw the man down in the middle of them and came out of him without hurting him. Everyone was amazed and said to one another, “What kind of word is this? With authority and power He gives orders to unclean spirits, and they come out.” And the report about Him went out into every place in the region.
  - range: 38-41
    heading: Healing at Simon’s house and at sunset
    plain: |
      He left the synagogue and went into Simon’s house. Simon’s mother-in-law was suffering from a high fever, and they asked Him to help her. He stood over her and rebuked the fever, and it left her; she got up at once and began to serve them. As the sun was setting, everyone who had anyone sick with various diseases brought them to Him, and He laid His hands on each one of them and healed them. Devils also came out of many, shouting, “You are the Christ, the Son of God!” But He rebuked them and would not let them speak, because they knew He was the Christ.
  - range: 42-44
    heading: Sent to other cities
    plain: |
      At daybreak He left and went to a solitary place. The crowds looked for Him, came to Him, and tried to keep Him from leaving them. But He said, “I must proclaim the good news of the kingdom of God to the other towns too, because that is why I was sent.” And He kept preaching in the synagogues of Galilee.

notes:
  - ref: 1
    phrase: being full of the Holy Ghost
    kind: christ
    title: Full of the Holy Ghost
    body: |
      Luke’s first word about Jesus after the baptism is that He was full of the Holy Ghost, and the order matters. The Spirit came upon Him as He prayed after John baptized Him ([[Luke 3:21–22]]), and only then does Luke say the Holy Ghost was His companion. Nephi had seen the same sequence and drawn the lesson from it: Jesus was baptized and the Holy Ghost descended upon Him, and the Father will give the Holy Ghost to whoever is baptized “like unto me” ([[2 Ne. 31:8–12]]). Held up as the exemplar, as Nephi holds Him up, Jesus shows that the Holy Ghost comes after baptism and then goes with a person back into ordinary life, which for Him meant first the wilderness and then the towns of Galilee.

      Luke emphasizes that the spreading of the Savior’s message was not left to chance but was God’s will carried out by the power of the Holy Spirit, and this chapter shows it three times over: the Spirit leads Jesus into the wilderness (verse 1), He returns “in the power of the Spirit” (verse 14), and He reads of Himself, “The Spirit of the Lord is upon me” (verse 18). The authority He shows in the rest of the chapter rests on that presence.
    sources: [brown-testimony-luke, strathearn-gospels, lds-scriptures]
  - ref: 2
    phrase: Being forty days tempted of the devil
    kind: scripture
    title: Tempted after the forty days
    body: |
      Joseph Smith’s translation changes when the temptation began. The King James verse has Jesus tempted throughout the forty days; the Joseph Smith Translation reads, “And after forty days, the devil came unto him, to tempt him” (JST Luke 4:2, in the footnotes). The devil does not come near Him during the forty days. The translation of Matthew says what the days were for instead: Jesus was led into the wilderness not “to be tempted of the devil” but “to be with God” (JST Matt. 4:1; see the note at [[Matt. 4:1]]).

      The same translation changes who carries Jesus from place to place. “The Spirit taketh him up into a high mountain” (JST Luke 4:5), and “the Spirit brought him to Jerusalem, and set him on a pinnacle of the temple. And the devil came unto him” (JST Luke 4:9). The devil tempts, but he does not lead: it is the Spirit that takes Jesus from place to place.

      The forty days themselves set Jesus beside Moses, who also spent forty days apart with God and without food ([[Ex. 34:28]]); Luke, like Matthew, includes the forty-day period before the temptations.
    sources: [lds-scriptures, brown-testimony-luke, huntsman-lukes-jesus]
  - ref: 6
    phrase: for that is delivered unto me; and to whomsoever I will I give it
    kind: prophets
    title: An authority the devil claimed
    body: |
      Only Luke has the devil explain his offer: the power and glory of the kingdoms “is delivered unto me; and to whomsoever I will I give it.” The claim was false at its root. Satan does keep a kind of realm; Jesus Himself would speak later of Satan’s “kingdom” ([[Luke 11:18]]). But the kingdoms of the world “were not his to give,” yet Satan offered them all to Jesus, “to him who had lived as a modest village carpenter.” And Satan wants to be worshipped, as he demanded of Moses, who refused him because he had no glory ([[Moses 1:12–15]]).

      The word “power” here is *exousia*, which can and perhaps should be read “authority.” Jesus does not dispute the devil’s claim to it in the wilderness. He answers with scripture, “it is written,” and leaves the question standing. Luke answers it in the rest of the chapter, when Jesus’s word in a synagogue comes “with power,” the same word (verse 32), and the people marvel at His “authority” (verse 36).
    sources: [hunter-temptations, brown-testimony-luke]
  - ref: 9
    phrase: And he brought him to Jerusalem
    kind: structure
    title: The last temptation in Jerusalem
    body: |
      Luke gives the same three temptations as Matthew in a different order, and his order ends in Jerusalem. Matthew’s last temptation is on a high mountain ([[Matt. 4:8–10]]); Luke puts the mountain second and finishes at the pinnacle of the temple. The change fits Luke’s whole Gospel, which keeps Jerusalem and its temple at the center: it opens with Gabriel appearing to Zacharias as he served in the temple ([[Luke 1:5–22]]), and where the other Gospels end with the risen Lord in Galilee, Luke ends in Jerusalem ([[Luke 24:49–53]]).

      The order also points ahead. Jesus meets His last temptation in Jerusalem, and it is in Jerusalem that He will meet His last trial, suffering and death. Matthew’s reasons for his own order are in the note at [[Matt. 4:8]].
    sources: [strathearn-gospels, brown-testimony-luke]
  - ref: 12
    phrase: It is said, Thou shalt not tempt the Lord thy God
    kind: scripture
    title: Scripture against scripture
    body: |
      At the temple the devil changes tactics and quotes scripture himself. Twice he has opened with “If thou be the Son of God” (verses 3 and 9), throwing doubt on His standing with His Father, who had just named Him His Son at the baptism ([[Luke 3:22]]). Now he adds a psalm: God “shall give his angels charge over thee” ([[Ps. 91:11–12]]). In his hands the promise of protection passes for a prophecy of how the Messiah would announce Himself: a dazzling feat, a leap from the temple’s height to land unhurt, that would bring crowds and make many believe the Messiah had come. “But faith is to precede the miracle; miracles are not to precede the faith.”

      Jesus answers every temptation from Deuteronomy ([[Deut. 8:3]]; [[Deut. 6:13]]; [[Deut. 6:16]]), and His last answer is worded with care. The devil said “it is written”; Jesus says “It is said,” as though the words came from the living voice of God, though they stand only in writing in Deuteronomy. On one reading there is also a ranking in the answer: a command of the law outweighs a verse of the Psalms, as the order in which Jesus Himself names the scriptures at the end of the Gospel suggests, “the law of Moses, and … the prophets, and … the psalms” ([[Luke 24:44]]). The command means not to test the Lord into doing what He would not otherwise do, such as spending divine power on the spectacular, and Jesus had already chosen the road of humility when He came to John for baptism. The words may also be aimed at the tempter himself: a command to tempt Him no more.
    sources: [brown-testimony-luke, hunter-temptations]
  - ref: 13
    phrase: he departed from him for a season
    kind: words
    title: Until the appointed time
    body: |
      Only Luke says the devil left “for a season,” and the phrase looks toward a set moment. In Greek it is “until a (certain) time,” and the word for time, *kairos*, is used of a critical or decisive moment. The devil’s withdrawal is a pause before other moments of testing, and very possibly before the last days of Jesus’s life.

      One such moment comes in Jerusalem, days before the crucifixion: “Then entered Satan into Judas surnamed Iscariot, being of the number of the twelve” ([[Luke 22:3]]). The devil who left Jesus at the temple in Jerusalem returns in the same city, to work through one of the Savior’s closest companions.
    sources: [brown-testimony-luke]
  - ref: 16
    phrase: stood up for to read
    kind: history
    title: Standing to read, sitting to teach
    body: |
      Every gesture Luke records at Nazareth belongs to a Sabbath service in the synagogue. The Sabbath morning service was the most important of the week. It included a fixed lesson and two readings for the day, one from the law and one from the prophets, and a sermon was usually given to explain one of them. Whether the readings already followed a set schedule in Jesus’s day is not known; the fullest description of the service, in the Mishnah, was compiled almost two centuries later. An attendant performed the synagogue’s clerical duties; he is the “minister” who hands Jesus the book of Isaiah and takes it back (verses 17 and 20).

      Luke is the first ancient writer to mention the custom of standing to read scripture and sitting to comment on it, and the custom had a meaning. The reader stood because the scripture was lofty; he sat to explain it because his own views stood lower than its divine dignity. So when Jesus “closed the book … and sat down” (verse 20), the synagogue knew He was about to teach, and every eye fastened on Him. “The book” was a scroll, and “opened” means He unrolled it. Luke’s wording suggests that Jesus chose the passage Himself, going straight to Isaiah 61.
    sources: [bd-synagogue, brown-testimony-luke]
  - ref: 18
    phrase: The Spirit of the Lord is upon me, because he hath anointed me
    kind: christ
    title: 'Anointed: the Christ'
    body: |
      The passage Jesus read announces the Messiah, and in saying it was fulfilled He named Himself as that Messiah. The speaker in Isaiah 61 says the Lord has anointed him, and that is what both “Messiah” and “Christ” mean (see the note on [[Luke 2:11]]). The passage was understood as a messianic prophecy partly for that reason. Luke’s reader has just watched the anointing: the Holy Ghost descending on Jesus at the baptism while the Father declared Him His Son ([[Luke 3:22]]). So the first words of the first sermon Luke reports say where His authority comes from: the Father, who sent the Spirit upon Him.

      The rest of the reading says what the Anointed One was sent to do: good news for the poor, healing for the brokenhearted, sight for the blind, freedom for the captive and the crushed. When Jesus declares it fulfilled “this day” (verse 21), Luke presents Him as chosen, authorized and sent to preach the kingdom through a ministry to the poor, the sick and the overlooked, and He went on to fulfill what Isaiah declared, preaching to the poor and giving sight to the blind ([[Luke 6:20]]; [[Luke 18:35–43]]).

      Luke’s wording follows the Greek Old Testament (the Septuagint) of [[Isa. 61:1–2]], with small differences, and one line is not from Isaiah 61 at all: “to set at liberty them that are bruised,” literally “to send forth the broken into freedom,” comes from [[Isa. 58:6]], perhaps added from memory.
    sources: [huntsman-lukes-jesus, sc-knowhy-656, brown-testimony-luke]
  - ref: 18
    phrase: to preach deliverance to the captives
    kind: scripture
    title: Deliverance to the captives
    body: |
      “Deliverance” translates *aphesis*, the word the New Testament usually uses for forgiveness (it is “remission” in [[Luke 3:3]] and [[Luke 24:47]]; the footnote here gives “remission”). The release Jesus proclaims is the language of freeing slaves, and the sense of forgiveness lies just beneath it: His release includes freedom from sin, and it reaches past death to the spirits of the dead who repent.

      Restoration scripture shows the promise kept in the world of spirits. Joseph F. Smith saw the righteous dead waiting, and “the Son of God appeared, declaring liberty to the captives who had been faithful” ([[D&C 138:18]]); His messengers then went “to declare the acceptable day of the Lord and proclaim liberty to the captives who were bound, even unto all who would repent of their sins and receive the gospel” ([[D&C 138:31]]), the words of Isaiah’s prophecy. Among the prophets present for that visit was Isaiah himself, “who declared by prophecy that the Redeemer was anointed to bind up the broken-hearted, to proclaim liberty to the captives” ([[D&C 138:42]]). The prophecy Jesus read at Nazareth was fulfilled in His mortal ministry and again after His death.
    sources: [brown-testimony-luke, sc-knowhy-656, lds-scriptures]
  - ref: 19
    phrase: To preach the acceptable year of the Lord
    kind: history
    title: Where He stopped reading
    body: |
      Jesus stopped in the middle of a sentence. Isaiah’s verse goes on: “To proclaim the acceptable year of the Lord, and the day of vengeance of our God” ([[Isa. 61:2]]), and the rest of the chapter turns to the redemption of Zion and the Lord’s judgments on the wicked. By ending where He did, Jesus in effect separated the two halves of the prophecy: the coming of the Messiah, which He declared fulfilled that day, and the judgment the Messiah will bring in the last days, which He left for later. The Messiah He announced brought healing and freedom from death and hell, not deliverance from Rome.

      “The acceptable year” would have stirred memories in Nazareth. Isaiah’s images come from the Jubilee, the year in the law of Moses when debts were forgiven, slaves went free, and land returned to its families ([[Lev. 25:8–24]]), and a Jubilee year had likely ended shortly before Jesus began to preach. The word “acceptable” (*dektos*) is the same word Jesus uses five verses later, and the echo is pointed: He has come to proclaim the acceptable year, and “No prophet is accepted in his own country” (verse 24).
    sources: [sc-knowhy-656, brown-testimony-luke]
  - ref: 23
    phrase: Physician, heal thyself
    kind: words
    title: Prove it here
    body: |
      The proverb Jesus puts in the townspeople’s mouths is a demand for proof. Where the saying came from is not known, and its sense is harder to pin down than its words. It might echo “to heal the brokenhearted” (verse 18) and mean healing others, but the “thyself” resists that reading; more likely it means “Establish the proofs of your own claims” or “Show yourself really to be the person we hear about.” The second half says what proof they had in mind: do here what we heard you did in Capernaum.

      Behind the demand, on this reading, lay disbelief, which Matthew and Mark name outright in the later visit: “because of their unbelief” ([[Matt. 13:58]]; [[Mark 6:6]]). The question just before it, “Is not this Joseph’s son?” (verse 22), shows how the town saw Him: they took Joseph for His father, and Jesus’s true origin had evidently remained a family secret. It is the irony of the chapter that He would go on to do the very things Isaiah named, preaching to the poor, healing the brokenhearted and the blind, but not in Nazareth.
    sources: [brown-testimony-luke, sc-knowhy-656]
  - ref: 26
    phrase: unto a woman that was a widow
    kind: scripture
    title: A widow of Sidon and a Syrian leper
    body: |
      Jesus answers the demand for a sign with two stories from the books of Kings, and both turn on outsiders. In Elijah’s famine there were widows enough in Israel, yet the prophet was sent to a widow of Zarephath in Sidon, and her meal and oil did not fail ([[1 Kgs. 17:8–16]]). In Elisha’s day there were lepers enough in Israel, yet the one cleansed was Naaman, commander of the Syrian army ([[2 Kgs. 5:1–14]]). Both stories show God’s blessings given to Gentiles, and the congregation reacted against them.

      The stories carry more than that. They are stories of a prophet’s power over famine and disease, and Jesus was claiming powers of His own that would match Elijah’s and Elisha’s, which He held back in Nazareth; Luke shows the first of them in the synagogue at Capernaum (verses 33–35). The widow, too, is chosen with care: a woman barely noticed in her own society, and an image of the little-noticed and vulnerable He had come to serve. Luke, it appears, means the scene as more than a lesson about Gentiles: the sermon tested the spiritual character of those in the synagogue that day, and their fury (verse 28) was their answer.
    sources: [brown-testimony-luke]
  - ref: 30
    phrase: But he passing through the midst of them went his way
    kind: history
    title: Thrust out, and passing through
    body: |
      The townspeople meant to kill Him, and they went about it in the form of an execution. Under the law of Moses a condemned man was taken outside the settlement to be put to death ([[Lev. 24:14]]; [[Num. 15:35–36]]), as Naboth was ([[1 Kgs. 21:13]]), and so they “thrust him out of the city.” Nazareth sits in a hollow among hills; cliffs overhang the town on the north, but the likeliest “brow” lies about a mile to the southeast, where a shove down the slope could cause severe injury or death. If that is the place, reaching it took them farther than a Sabbath day’s journey, an irony in a congregation that had just kept the Sabbath together.

      Luke does not say how Jesus escaped; he says only that He passed through the middle of them and went on His way. The account seems to imply an unusual power that let Him walk away untouched, as He did when a crowd took up stones against Him in the temple ([[John 8:59]]). But the rejection at Nazareth is the first of many in Luke, and they lead to His steady decision to go up to Jerusalem, for “it cannot be that a prophet perish out of Jerusalem” ([[Luke 13:33]]).
    sources: [brown-testimony-luke, huntsman-lukes-jesus]
  - ref: 36
    phrase: with authority and power he commandeth the unclean spirits
    kind: words
    title: With authority and power
    body: |
      The Capernaum synagogue settles the question the devil raised in the wilderness. There the devil claimed the “power” of the kingdoms, *exousia*, authority (verse 6). Here the people are astonished because Jesus’s word was “with power” (verse 32), and the footnote gives the Greek sense, “authority”: it is the same word. Mark adds what they were comparing it with: He taught “as one that had authority, and not as the scribes” ([[Mark 1:22]]). The scribes taught by memorization, passing on accurately the words of the wise rather than teaching on their own authority.

      Then the word was tested. In a synagogue, a place of worship, Jesus rebuked an unclean spirit, and it left the man. The people’s amazed question joins the two words, “with authority and power” (*exousia* and *dynamis*): His rebuke came with authority, and in it His miraculous power came into view. The devil had offered Jesus an authority that was not his to give; the synagogue at Capernaum saw that Jesus already had one, and that the unclean spirits obeyed it.
    sources: [brown-testimony-luke, bd-scribe, lds-scriptures]
  - ref: 40
    phrase: he laid his hands on every one of them, and healed them
    kind: history
    title: At sunset, hands on every one
    body: |
      The crowd came at sunset because the Sabbath ended then. Jesus had taught in the synagogue and healed Simon’s mother-in-law on the Sabbath (verses 31–39), and the rabbis allowed no travel beyond the Sabbath limit of 2,000 cubits, about 1,000 yards. When the sun set, the sick could be carried to Him from farther off.

      Luke alone says that He laid His hands on every one of them. The detail is missing from Mark’s account ([[Mark 1:32–34]]), and it points to a practice Luke follows through both his books: Jesus heals and blesses by the laying on of hands, and His followers continue to do it after Him ([[Acts 9:17]]; [[Acts 28:8]]). The healing of the fever just before shows the same authority as the scene in the synagogue: He “rebuked” the fever (verse 39) with the verb He had used to rebuke the unclean spirit (verse 35), and would use again for the devils that evening (verse 41).
    sources: [brown-testimony-luke]
  - ref: 41
    phrase: he rebuking them suffered them not to speak
    kind: christ
    title: Why He silenced the devils
    body: |
      The devils spoke the truth, “Thou art Christ the Son of God,” and Jesus would not let them say it. He did not want testimony to His messiahship from demons. There is irony in it: the unclean spirits knew who Jesus was, when the religious authorities did not.

      In Luke the silencing is not a way of keeping His identity secret, for Jesus had already announced who He was in the synagogue at Nazareth (verses 18–21). Their crying out also seems meant to throw His ministry into commotion, and on that view He was controlling the scene, bringing order and quiet, as He would later put the noisy mourners out of Jairus’s house ([[Luke 8:51–55]]). The title the devils shouted, “Christ,” is seldom spoken of Jesus during His ministry: apart from the devils here, the only one to confess Him as the Christ is Peter ([[Luke 9:20]]).
    sources: [keller-mark-luke, brown-testimony-luke, huntsman-lukes-jesus]
  - ref: 43
    phrase: 'I must preach the kingdom of God to other cities also: for therefore am I sent'
    kind: christ
    title: Sent to other cities
    body: |
      The people wanted to keep Him, and Jesus answered with His commission. “I must” translates the Greek *dei*, the word of divine necessity, the same “must” that runs through Luke to the cross and the empty tomb (“The Son of man must suffer many things,” [[Luke 9:22]]). “Therefore am I sent” speaks of a formal commissioning, and it takes the chapter back to Nazareth, where He read, “he hath sent me” (verse 18).

      The healings had drawn the crowds, but they were not His foremost purpose on earth. He had something more important to do: proclaim the kingdom of God. So the chapter that began with the Spirit sending Him into the wilderness ends with the Anointed One sent on, town after town, and Luke’s next scene has Him preaching from a boat on the lake ([[Luke 5:1–3]]).
    sources: [brown-testimony-luke, keller-mark-luke]

christ: |
  Luke 4 shows Jesus Christ as the Anointed One of Isaiah’s prophecy, full of the Holy Ghost, who turned down the devil’s offer of a borrowed authority and showed instead an authority of His own over unclean spirits and disease. At Nazareth He read that He was sent to the brokenhearted and the captives, and He declared the words fulfilled; Restoration scripture shows the same deliverance reaching the captives in the world of spirits ([[D&C 138:18]]). Through His Atonement broken hearts are healed and the chains of death and hell are broken. The Spirit that rested on Him after His baptism is promised to every disciple who follows Him into the water: “to him will the Father give the Holy Ghost, like unto me” ([[2 Ne. 31:12]]).

explore: |
  - **The prophecy He read.** [[Isa. 61:1–3]], with the line from [[Isa. 58:6]], and its fulfilment among the dead in [[D&C 138:18–31]], [[D&C 138:42]].
  - **The two stories He cited.** Elijah and the widow of Zarephath, [[1 Kgs. 17:8–24]]; Elisha and Naaman, [[2 Kgs. 5:1–14]].
  - **Moses and the adversary.** [[Moses 1:12–22]] beside [[Luke 4:5–8]].
  - **The other tellings.** [[Matt. 4:1–11]] and [[Mark 1:12–13]] for the temptation; [[Mark 1:21–39]] for the Sabbath at Capernaum; the later visit to Nazareth, [[Matt. 13:54–58]] and [[Mark 6:1–6]].
  - “Luke’s Jesus: The Compassionate and Saving Son of God” (*Thou Art the Christ*, 2018) follows the titles Luke gives Jesus through the Gospel, with the Nazareth sermon as its program.

