chapter: 16
title: Ye Cannot Serve God and Mammon
tagline: Jesus tells His disciples of a dishonest steward who used his last days in office to provide for his future, answers the scoffing of covetous Pharisees, and tells of a rich man and a beggar named Lazarus who meet again in the world of spirits.
when: 'On the journey to Jerusalem, in the same scene as the parables of Luke 15; in this site’s chronology, the Perean and Judean ministry'

setting: |
  Luke 16 goes on with the scene of chapter 15. Publicans and sinners had come to hear Jesus, and Pharisees and scribes murmured that He received them ([[Luke 15:1–2]]); He answered with the lost sheep, the lost coin and the lost son. Now He turns to His disciples, probably a wider circle than the Twelve and including some publicans, while Pharisees listen at the edge of the crowd (verse 14).

  Money and property run through this chapter as they ran through the last. Its two stories, both told only by Luke, open with the same words, “There was a certain rich man” (verses 1 and 19), and in each the rich man’s wealth is the hinge of the story.

  Between the two stories stand short sayings that seem at first to have no order: two masters, the law and the prophets until John, the tittle of the law, divorce. Here the Joseph Smith Translation adds more than anywhere else in the chapter. It supplies the Pharisees’ side of an argument (JST Luke 16:16–23, in the appendix), and with it the reason each saying is spoken and the reason the second story is told. Matthew records several of these sayings in the Sermon on the Mount, given on another occasion ([[Matt. 5:18]]; [[Matt. 5:32]]; [[Matt. 6:24]]).

thread: |
  **Luke 16 is about what a person does with goods that are not finally his own.**

  The steward is caught wasting what belongs to another, and he uses the little time left to him to make friends for his future. Jesus does not praise his dishonesty; He holds up his urgency, and then draws the lesson. Worldly wealth is a trust, and how it is handled decides whether God will commit “the true riches” (verse 11). At the center stands the saying the chapter turns on: “Ye cannot serve God and mammon” (verse 13).

  The Pharisees, lovers of money, scoff. In the Joseph Smith Translation they claim the law and the prophets while refusing the One the law and the prophets testify of, and Jesus ends His answer, “I will liken you unto the rich man.” The second story shows the same choice made the other way. The rich man clothed and fed himself and did nothing for the beggar at his gate, choosing mammon over God, and in the world of spirits he learns too late what Moses and the prophets could have taught him, the same scriptures that, heard rightly, lead to Christ.

sections:
  - range: 1-13
    heading: The unjust steward
    plain: |
      Jesus also told His disciples this story: “A rich man had a steward who managed his estate, and he was told that the man was wasting his property. So he called him in and said, ‘What is this I hear about you? Turn in the accounts of your management, for you cannot be my steward any longer.’ The steward said to himself, ‘What am I going to do, now that my master is taking my position away? I am not strong enough to dig, and I am ashamed to beg. I know what I will do, so that when I am put out of my position, people will welcome me into their homes.’

      “So he called in each of his master’s debtors. He asked the first, ‘How much do you owe my master?’ ‘A hundred measures of olive oil,’ he said. The steward told him, ‘Take your bill, sit down quickly and write fifty.’ He asked another, ‘And how much do you owe?’ ‘A hundred measures of wheat.’ He told him, ‘Take your bill and write eighty.’

      “And the master praised the dishonest steward because he had acted shrewdly. For the people of this world are shrewder in dealing with their own kind than the children of light are. I tell you, use the wealth of this unrighteous world to make friends for yourselves, so that when it fails, they may welcome you into eternal dwellings.

      “Whoever is faithful in a very little is faithful also in much, and whoever is dishonest in a very little is dishonest also in much. So if you have not been faithful with unrighteous wealth, who will trust you with the true riches? And if you have not been faithful with what belongs to someone else, who will give you what is your own? No servant can serve two masters. Either he will hate the one and love the other, or he will be devoted to the one and despise the other. You cannot serve God and money.”
  - range: 14-18
    heading: The Pharisees scoff
    plain: |
      The Pharisees, who loved money, heard all this and sneered at Him. He said to them, “You are the ones who make yourselves look righteous before others, but God knows your hearts. What people prize highly is detestable in God’s sight.

      “The law and the prophets were until John. Since then the good news of the kingdom of God is preached, and everyone is pressing into it. Yet it is easier for heaven and earth to pass away than for the smallest stroke of a letter of the law to fail. Whoever divorces his wife and marries another commits adultery, and whoever marries a woman divorced from her husband commits adultery.”
  - range: 19-31
    heading: The rich man and Lazarus
    plain: |
      “There was a rich man who dressed in purple and fine linen and feasted in luxury every day. At his gate lay a beggar named Lazarus, covered with sores, who longed to eat what fell from the rich man’s table. Even the dogs came and licked his sores.

      “The beggar died, and the angels carried him to Abraham’s side. The rich man also died and was buried. In the world of the dead, where he was in torment, he looked up and saw Abraham far away, with Lazarus at his side. He called out, ‘Father Abraham, have mercy on me. Send Lazarus to dip the tip of his finger in water and cool my tongue, for I am in agony in this flame.’ But Abraham said, ‘Son, remember that in your lifetime you received your good things, and Lazarus bad things. Now he is comforted here, and you are in agony. Besides all this, between us and you a great chasm has been fixed, so that those who want to cross from here to you cannot, and no one can cross from there to us.’

      “He said, ‘Then I beg you, father, send him to my father’s house, for I have five brothers. Let him warn them, so that they will not also come to this place of torment.’ Abraham said, ‘They have Moses and the prophets; let them listen to them.’ ‘No, father Abraham,’ he said, ‘but if someone from the dead goes to them, they will repent.’ Abraham said to him, ‘If they will not listen to Moses and the prophets, they will not be persuaded even if someone rises from the dead.’”

notes:
  - ref: 1
    phrase: which had a steward
    kind: history
    title: A steward
    body: |
      A steward was not a household servant but the manager of a rich man’s estate: here a free man who kept his master’s accounts and was his master’s legal agent, able to act in his name, much as someone holding a power of attorney does today. That is why what he does next binds his master. The charge is that he “wasted” the goods, the verb Luke used of the prodigal son, who “wasted his substance” ([[Luke 15:13]]). It means to scatter, and it ties this story to the three Jesus has just told.

      The steward does not deny the charge. “Thou mayest be no longer steward” is not a warning but a dismissal; the decision is made, and he must hand in the accounts. His words to himself are candid. He cannot dig, and he is ashamed to beg, not from remorse but because begging would tell everyone he had been caught.
    sources: [brown-testimony-luke, talmage-jesus-christ-27]
  - ref: 6
    phrase: Take thy bill, and sit down quickly, and write fifty
    kind: history
    title: Write fifty
    body: |
      The steward cuts two large debts, but what he took off the bills is uncertain. A hundred measures of oil is about 900 gallons, and a hundred measures of wheat more than a hundred bushels. He has each debtor rewrite his own bill, and quickly, while the steward still has the authority to approve it.

      One reading takes the scene as it stands: the steward authorized the debtors to show a much smaller debt, defrauding his employer to put them in his own debt, and he could do it because he was still steward, though morally guilty. Another reading starts from how such bills were written. The law of Moses forbade lending at interest to a fellow Israelite ([[Ex. 22:25]]; [[Lev. 25:36–37]]), so a promissory note gave only the total owed, with the interest hidden inside it. On that reading the fifty measures were what the debtor had actually received and the rest was interest, though no ancient source confirms that such a share was usual.
    sources: [brown-testimony-luke, talmage-jesus-christ-27]
  - ref: 8
    phrase: the lord commended the unjust steward, because he had done wisely
    kind: words
    title: The lord commended the unjust steward
    body: |
      Jesus does not praise the steward’s dishonesty, and the verse does not say He does. The “lord” who commends him is the master in the story, not the Lord telling it; nothing in the parable makes the rich man stand for God. What the master praises is not goodness but shrewdness: the Greek adverb behind “wisely” means something like “shrewdly” here, and in the same breath the man is still “the unjust steward.” He is commended for one thing. When his future was at stake he saw it and acted, at once and with his whole mind: “It was not the steward’s dishonesty that was extolled; his prudence and foresight were commended.”

      Jesus’s own comment draws the contrast. “The children of this world,” whose horizon is this present age, plan for their future with a care and singleness of purpose that “the children of light” often do not bring to theirs. “In their generation” limits the compliment: their shrewdness works only in this world. “Children of light,” or sons of light, belonged to the religious language of Jesus’s day, as the Dead Sea Scrolls show, and it means those who belong to the kingdom and have received its light. Modern revelation uses the phrase of those who will be ready for the Lord’s coming ([[D&C 106:5]]).
    sources: [brown-testimony-luke, talmage-jesus-christ-27]
  - ref: 9
    phrase: Make to yourselves friends of the mammon of unrighteousness
    kind: words
    title: The mammon of unrighteousness
    body: |
      Mammon is an Aramaic word for wealth or property, and “the mammon of unrighteousness” is wealth as this world gets and holds it, often for the wrong reasons. Jesus’s counsel is to put it to work for good while it lasts. That is the steward’s lesson turned to a disciple’s purposes. He used his master’s goods to secure a welcome in other men’s houses; a disciple uses this world’s goods so as to be received “into everlasting habitations.” Money will fail one day, and only what was done with it will endure.

      “When ye fail” is the reading of the later texts the King James translators followed. The earlier manuscripts, which modern editions print, read “when it fails,” that is, when mammon fails. That may mean the end of a life, when property no longer matters, or the plain fact that wealth by itself cannot carry a righteous purpose.

      The Lord gave the same counsel in this dispensation, in slightly different words: “make unto yourselves friends with the mammon of unrighteousness, and they will not destroy you” ([[D&C 82:22]]). “With” puts the weight on using the world’s goods rightly, and the promise suggests that, rightly used, they can even protect.
    sources: [brown-testimony-luke, talmage-jesus-christ-27, greek-nt, lds-scriptures]
  - ref: 11
    phrase: who will commit to your trust the true riches?
    kind: prophets
    title: The true riches
    body: |
      Verses 10 to 12 say why the steward’s story matters to a disciple. Worldly wealth does not finally belong to anyone; it comes as a trust, and handling it is a test. “That which is least” is money. “Much” and “the true riches” are what God has to give, and the question “who will commit to your trust” points to God as the Giver. Verse 12 presses the point. Whatever a person manages in this life is “another man’s,” God’s own or held for others, and “that which is your own” is what God gives at last to those who were faithful with what was lent.

      The lesson runs from the lesser trust to the greater: “If you have not learned wisdom and prudence in the use of ‘unrighteous mammon,’ how can you be trusted with the more enduring riches?” Verse 13 adds the last step: “let not wealth become your master; keep it to its place as a servant.”
    sources: [brown-testimony-luke, talmage-jesus-christ-27]
  - ref: 14
    phrase: who were covetous
    kind: history
    title: Who were covetous
    body: |
      Luke’s word for “covetous” means literally “fond of silver,” a lover of money, and this is the only place in the New Testament where Pharisees are described that way. The word ties these listeners to the parable they have overheard. Their answer is contempt: “derided” is to turn up the nose at someone, the verb Luke uses again when the rulers mock Jesus on the cross ([[Luke 23:35]]). Their sneer can be put into words: what did this Galilean, who owned nothing but the clothes He wore, know about managing wealth?

      Jesus’s reply in verse 15 goes beneath money to the heart. These men could look upright before others. What others “highly esteem” usually takes the form of possessions or power, and that is where the love of money takes hold. God sees the heart, and calls that esteem an abomination. The judgment falls on these hearers in this scene; Luke also shows Jesus at table with Pharisees who invited Him ([[Luke 7:36]]; [[Luke 14:1]]).
    sources: [brown-testimony-luke, talmage-jesus-christ-27]
  - ref: 16
    phrase: The law and the prophets were until John
    kind: scripture
    title: The law and the prophets were until John
    body: |
      Verses 16 to 18 read like three unrelated sayings, and the King James text does not show why they stand here. The Joseph Smith Translation supplies the missing exchange. After Jesus’s rebuke, the Pharisees answer, “We have the law, and the prophets; but as for this man we will not receive him to be our ruler; for he maketh himself to be a judge over us” (JST Luke 16:16). The phrase “the law and the prophets” is first theirs, and Jesus takes it up: “The law and the prophets testify of me; yea, and all the prophets who have written, even until John, have foretold of these days” (JST Luke 16:17). The Pharisees understand what He claims, and they refuse it.

      In Luke’s text the saying marks a turn in time: the law and the prophets ran until John, and since then the kingdom of God has been preached. “Every man presseth into it” could mean that people force their way in, or that whoever enters must do it with energy and firm intent. The Joseph Smith Translation leans toward the second sense by adding three words: “every man who seeketh truth presseth into it” (JST Luke 16:18).
    sources: [jst-luke-16, brown-testimony-luke]
  - ref: 17
    phrase: one tittle of the law to fail
    kind: words
    title: One tittle of the law
    body: |
      A tittle is the small hook or horn on a stroke that tells one Hebrew letter from another of similar shape, one of the smallest parts of a letter. Heaven and earth will pass away more easily than that. Jesus is not loosening the law, and the Joseph Smith Translation shows why He says so to these hearers: “why teach ye the law, and deny that which is written; and condemn him whom the Father hath sent to fulfill the law, that ye might all be redeemed?” (JST Luke 16:20). The Pharisees teach the law and reject the One it points to. Jesus upholds it to the last stroke because He is its fulfillment.

      The added verses then condemn these men in terms among the most sweeping in scripture: they “pervert the right way,” persecute the meek, seek to destroy the kingdom by violence, and are “adulterers” (JST Luke 16:21). The plain text carries the same irony. These teachers of the law had tried to nullify it by their own additions and interpretations, and divorce, the subject of the next verse, is the example.
    sources: [jst-luke-16, brown-testimony-luke, talmage-jesus-christ-27]
  - ref: 18
    phrase: Whosoever putteth away his wife, and marrieth another
    kind: history
    title: Whosoever putteth away his wife
    body: |
      In the King James text the saying on divorce seems to come from nowhere. In the Joseph Smith Translation it answers an outburst. Jesus has called His accusers “adulterers,” they revile Him for it, “But he continued, saying, Whosoever putteth away his wife, and marrieth another, committeth adultery” (JST Luke 16:22–23). The saying explains the charge.

      Its words are aimed at men. The law’s certificate of divorce ([[Deut. 24:1–4]]) protected a woman who was put away from being accused of adultery if she married again, but in Jesus’s day some teachers allowed a man to divorce his wife for almost any cause, even “if she spoiled a dish for him.” By joining “putteth away” to “marrieth another,” Jesus strikes at the man who divorces in order to take another wife, and takes away the whim that left women unprotected. Matthew records His fuller teaching on divorce, with its exception, on other occasions; the note on [[Matt. 5:32]] explains it.

      In the Church’s present teaching, the marriage required for exaltation “does not contemplate divorce,” but the Lord “does not currently enforce the consequences of the celestial standard,” and permits divorced persons “to marry again without the stain of immorality specified in the higher law.”
    sources: [jst-luke-16, brown-testimony-luke, oaks-divorce]
  - ref: 19
    phrase: clothed in purple and fine linen
    kind: history
    title: Clothed in purple and fine linen
    body: |
      Purple dye came from sea snails and was costly enough that purple was worn mostly by royalty and the aristocracy, and fine linen was a further mark of wealth. “Fared sumptuously every day” is a lavish meal every day. The rich man has every comfort, and the story never gives him a name. Later tradition called him Dives, which is only the Latin word for “rich.”

      His fault is not his wealth but what he does with it. He clothes and feeds himself and does nothing for the man at his gate. The Lord applied the story to the Latter-day Saints: one who takes of the abundance He has made, “and impart not his portion, according to the law of my gospel, unto the poor and the needy, he shall, with the wicked, lift up his eyes in hell, being in torment” ([[D&C 104:18]]), the words of verse 23. In the manuscript of that revelation the phrase was “with Dives”; when it was printed in 1835 it became “the wicked,” which makes plain that wickedness, not riches as such, is what shuts the door.
    sources: [brown-testimony-luke, harper-rich-man-lazarus]
  - ref: 20
    phrase: a certain beggar named Lazarus
    kind: history
    title: A certain beggar named Lazarus
    body: |
      Lazarus is the only person Jesus ever names in a parable, and the naming may be ironic: the poor man has a name and the rich man has none. Lazarus is a form of Eleazar, “God has helped,” and by the end of the story the name fits.

      He “was laid” at the gate; the passive verb suggests he was carried there because he could not get there himself. The gate that kept him outside is the first distance between the two men; the “great gulf” of verse 26 is the last. He hoped for what fell from the table, and his only company was the dogs that scavenged there. They paid attention to his sores; the rich man paid none.
    sources: [brown-testimony-luke, talmage-jesus-christ-27]
  - ref: 22
    phrase: Abraham’s bosom
    kind: symbol
    title: Abraham’s bosom
    body: |
      “Abraham’s bosom” is a figure for the resting place of the righteous dead, and the picture is of Lazarus with Abraham himself, perhaps held in his arms. The beggar no one at the gate would help is carried by angels to the father of the faithful. The rich man “was buried,” and no angels are mentioned.

      The place is paradise, “the resting place of the blessed,” which is what Alma calls it: the spirits of the righteous “are received into a state of happiness, which is called paradise, a state of rest, a state of peace” ([[Alma 40:12]]), and they remain there, as the wicked remain in theirs, until the resurrection ([[Alma 40:14]]). It is not the end of the journey. Paradise, in Elder James E. Talmage’s words, “is not the place of final glory, any more than the hell to which the rich man’s spirit was consigned is the final habitation of the condemned.”
    sources: [talmage-jesus-christ-27, brown-testimony-luke, lds-scriptures]
  - ref: 23
    phrase: in hell he lift up his eyes
    kind: prophets
    title: In hell he lift up his eyes
    body: |
      The King James “hell” is *Hades* in the Greek, and here it is not the final hell of the damned but the place where the spirits of the dead wait for the resurrection and the judgment, as the Book of Mormon describes the state of the dead ([[Alma 40:11–14]]). Joseph Smith taught the same in 1843. As Wilford Woodruff recorded his words, hell “is annother modern term it is taken from hades the greek, or shaole, the (hebrew) & the true signification is a world of spirits”; “Hades shaole paradise, spirits in prision is all one it is a world of spirits, the righteous & the wicked all go to the same world of spirits.” Lazarus and the rich man are in different places within that one world of spirits, within sight of each other.

      Is this a description of that world, or only a story? It is a parable, and much of it is figurative, and doctrine is not as a rule to be drawn from a parable’s incidents. But “we cannot admit that Christ would teach falsely even in parable,” and so its portrayal of the righteous and the wicked dwelling apart between death and resurrection is to be accepted as true. The dead in it are conscious; they see, remember and speak, and they are still the persons they were. The rich man still treats Lazarus as someone to be sent on errands for him. Nothing in the story says that this flame burns forever.
    sources: [brown-testimony-luke, ehat-cook-words-1843-06-11, talmage-jesus-christ-27]
  - ref: 26
    phrase: there is a great gulf fixed
    kind: prophets
    title: A great gulf fixed
    body: |
      Abraham’s answer describes a real separation. Between the abode of the righteous and the abode of the wicked “a great gulf” is fixed, and no one crosses it in either direction; Lazarus cannot bring even a drop of water. In this world of spirits before the resurrection, the parable allows no passage at all.

      Jesus told the parable before His death, and latter-day revelation records what He did in the world of spirits between His death and His resurrection. In the vision given to President Joseph F. Smith in October 1918, the Savior did not go Himself among the wicked, “But behold, from among the righteous, he organized his forces and appointed messengers, clothed with power and authority, and commissioned them to go forth and carry the light of the gospel to them that were in darkness” ([[D&C 138:30]]; see [[D&C 138:18–37]]). Spirits in prison who accept the gospel, and the ordinances performed for them in temples, may leave prison and dwell in paradise.
    sources: [talmage-jesus-christ-27, brown-testimony-luke, lds-scriptures, topics-spirit-world]
  - ref: 31
    phrase: though one rose from the dead
    kind: christ
    title: Though one rose from the dead
    body: |
      Abraham’s last words reach past the story. The rich man thinks a messenger from the dead would move his brothers where scripture has not. Abraham answers that people who will not hear Moses and the prophets will not be persuaded by a spectacle; a real change of heart does not come from outside. “Though one rose from the dead” points, in the long view, to Jesus’s own resurrection.

      The Joseph Smith Translation has already said why the scriptures are enough: “The law and the prophets testify of me” (JST Luke 16:17). Moses and the prophets, heard rightly, prepare a hearer to receive Jesus. The parable was addressed to the Pharisees who had scoffed at His warning about mammon, and they are the hearers this ending is for: they claimed the law and the prophets and refused the One they testified of.
    sources: [brown-testimony-luke, jst-luke-16, talmage-jesus-christ-27]

christ: |
  The chapter points to Jesus Christ as the One “whom the Father hath sent to fulfill the law, that ye might all be redeemed” (JST Luke 16:20), the One of whom the law and the prophets testify, and the One who did rise from the dead. Between His death and His resurrection He sent messengers from among the righteous to “carry the light of the gospel to them that were in darkness” ([[D&C 138:30]]).

  Everything a disciple manages is His: “all things therein are mine” ([[D&C 104:14]]). Faithfulness with that least thing, money held as His and shared with the poor and the needy, is how the true riches are entrusted ([[Luke 16:10–11]]), and a portion withheld from the poor is the rich man’s choice made again ([[D&C 104:18]]).

