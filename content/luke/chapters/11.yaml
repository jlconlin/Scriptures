chapter: 11
title: Lord, Teach Us to Pray
tagline: Jesus teaches a disciple to pray and promises that the Father gives to those who ask, answers the charge that He casts out devils by Beelzebub, offers His generation only the sign of Jonas, and at a Pharisee’s table pronounces woes on Pharisees and lawyers who keep the key of knowledge.
when: 'On Jesus’s journey toward Jerusalem; Luke names no place or time ([[Luke 9:51]])'

setting: |
  Luke 10 ended in the house of Martha and Mary, with Mary sitting at Jesus’s feet ([[Luke 10:38–42]]), and chapter 11 picks up the same two concerns, prayer and the home. It belongs to the long journey that began when Jesus “steadfastly set his face to go to Jerusalem” ([[Luke 9:51]]). Luke ties little of that journey to a place or a day. “A certain place” (verse 1) is all he gives, and much of this part of his Gospel seems to be drawn from teachings remembered without their time and place.

  Much of the chapter will sound familiar to a reader of Matthew. The Lord’s Prayer, “ask, and it shall be given you,” the lamp and the eye all stand in the Sermon on the Mount; the Beelzebub dispute and the sign of Jonas are in [[Matt. 12:22–45]]; and woes like these fall on the scribes and Pharisees in the temple in [[Matt. 23:1–36]]. Luke sets them differently. Nothing requires that Jesus said such things only once, since teachers repeat themselves, and the settings differ so much that they point to different occasions and similar instruction.

  The chapter ends at a Pharisee’s table, and the meal is a turning point. The opposition that broke out in Galilee ([[Luke 6:11]]) had grown quiet; after this dinner it takes new life.

thread: |
  **Luke 11 sets the Father who gives beside people who withhold, and light received beside light hidden.**

  It opens with prayer. A disciple asks to be taught; Jesus gives him a pattern, then tells of a neighbor who will not get out of bed for a friend and finally gives only because he is pestered. The Father is far better than that neighbor. If fathers who are evil give their children food, “how much more” will He give the Holy Spirit. From there the chapter turns to a contest over power. Some say Jesus casts out devils by Beelzebub; He answers that a stronger one has come upon the strong man, and that a house swept clean and left empty does not stay empty. A crowd wants a sign, and He offers the one Nineveh had, a preacher of repentance. A lamp is lit to be seen, and an eye that is single fills the whole body with light.

  The last scene shows the reverse. At a Pharisee’s table Jesus finds men careful about the outside of the cup and the tithe on garden herbs, who build tombs for the prophets their fathers killed and keep the key of knowledge from those who would enter. Those who should have been receiving light have hidden it, and the chapter ends in judgment.

sections:
  - range: 1-13
    heading: Teach us to pray
    plain: |
      Once Jesus was praying in a certain place. When He finished, one of His disciples said to Him, “Lord, teach us to pray, as John also taught his disciples.” He said to them, “When you pray, say: Our Father in heaven, may your name be kept holy. May your kingdom come. May your will be done on earth as it is in heaven. Give us day by day our daily bread. Forgive us our sins, for we also forgive everyone who owes us anything. And do not lead us into temptation, but deliver us from evil.”

      He went on: “Suppose one of you has a friend, and you go to him at midnight and say, ‘Friend, lend me three loaves of bread. A friend of mine on a journey has come to me, and I have nothing to set before him.’ And he answers from inside, ‘Do not bother me. The door is already shut, and my children are in bed with me. I cannot get up and give you anything.’ I tell you, even if he will not get up and give him the bread because he is his friend, yet because of his shameless persistence he will get up and give him as much as he needs.

      “So I say to you: ask, and it will be given to you; seek, and you will find; knock, and the door will be opened to you. For everyone who asks receives, whoever seeks finds, and to whoever knocks the door will be opened. Which of you fathers, if your son asks for bread, will give him a stone? Or if he asks for a fish, will give him a snake instead? Or if he asks for an egg, will give him a scorpion? If you, then, though you are evil, know how to give good gifts to your children, how much more will your Father in heaven give the Holy Spirit to those who ask Him?”
  - range: 14-28
    heading: A stronger than the strong man
    plain: |
      Jesus was casting a devil out of a man who could not speak. When the devil had gone out, the man spoke, and the crowds were amazed. But some of them said, “He casts out devils by Beelzebub, the chief of the devils.” Others, to test Him, demanded a sign from heaven. He knew what they were thinking and said to them, “Every kingdom divided against itself is laid waste, and a house divided against a house falls. If Satan is divided against himself, how will his kingdom stand? For you say that I cast out devils by Beelzebub. And if I cast out devils by Beelzebub, by whom do your own sons cast them out? So they will be your judges. But if I cast out devils by the finger of God, then the kingdom of God has come upon you.

      “When a strong man, fully armed, guards his own house, his goods are safe. But when someone stronger than he attacks and overpowers him, he takes away the armor the man trusted in and divides up the spoils. Whoever is not with me is against me, and whoever does not gather with me scatters.

      “When an unclean spirit has gone out of a man, it wanders through dry places looking for rest. Finding none, it says, ‘I will go back to the house I left.’ When it comes, it finds the house swept and put in order. Then it goes and brings seven other spirits more wicked than itself, and they go in and live there. And the last state of that man is worse than the first.”

      As He was saying this, a woman in the crowd called out to Him, “Blessed is the womb that bore you, and the breasts that nursed you!” But He said, “Blessed rather are those who hear the word of God and keep it.”
  - range: 29-36
    heading: The sign of Jonas, and the lamp
    plain: |
      As the crowds kept growing, He began to say, “This is an evil generation. It looks for a sign, but no sign will be given it except the sign of Jonah the prophet. For as Jonah was a sign to the people of Nineveh, so the Son of Man will be to this generation. The queen of the south will rise up at the judgment with the people of this generation and condemn them, for she came from the ends of the earth to hear the wisdom of Solomon; and look, someone greater than Solomon is here. The people of Nineveh will rise up at the judgment with this generation and condemn it, for they repented at Jonah’s preaching; and look, someone greater than Jonah is here.

      “No one lights a lamp and puts it in a hidden place or under a bushel, but on a lampstand, so that those who come in may see the light. Your eye is the lamp of your body. When your eye is single, your whole body is full of light; but when it is evil, your body is full of darkness. So take care that the light in you is not darkness. If your whole body is full of light, with no part dark, it will all be full of light, as when a lamp shines on you with its bright rays.”
  - range: 37-44
    heading: At a Pharisee’s table
    plain: |
      While He was speaking, a Pharisee invited Him to eat with him, so He went in and took His place at the table. The Pharisee was surprised to see that He had not first washed before the meal. The Lord said to him, “You Pharisees clean the outside of the cup and the dish, but inside you are full of plunder and wickedness. Foolish people! Did not the One who made the outside make the inside too? Rather, give alms from what you have, and then everything is clean for you.

      “But woe to you, Pharisees! You pay tithes of mint and rue and every garden herb, and you pass over judgment and the love of God. These you should have done, without leaving the others undone. Woe to you, Pharisees! You love the best seats in the synagogues and greetings in the marketplaces. Woe to you, scribes and Pharisees, hypocrites! You are like unmarked graves, and people walk over them without knowing it.”
  - range: 45-54
    heading: Woes on the lawyers
    plain: |
      One of the lawyers answered Him, “Teacher, when you say these things, you insult us too.” He said, “Woe to you lawyers also! You load people with burdens hard to carry, and you yourselves will not touch those burdens with one of your fingers. Woe to you! You build the tombs of the prophets, and your fathers killed them. So you are witnesses that you approve of what your fathers did: they killed the prophets, and you build their tombs. That is why the wisdom of God said, ‘I will send them prophets and apostles, and some of them they will kill and persecute,’ so that the blood of all the prophets shed since the foundation of the world may be required of this generation, from the blood of Abel to the blood of Zacharias, who was killed between the altar and the temple. Yes, I tell you, it will be required of this generation. Woe to you lawyers! You have taken away the key of knowledge. You did not go in yourselves, and you hindered those who were going in.”

      As He said these things to them, the scribes and the Pharisees began to press Him hard and to provoke Him to speak about many things, lying in wait for Him and trying to catch Him in something He might say, so that they could accuse Him.

notes:
  - ref: 1
    phrase: teach us to pray, as John also taught his disciples
    kind: history
    title: The prayer taught a second time
    body: |
      Matthew sets the Lord’s Prayer in the Sermon on the Mount, spoken to a multitude ([[Matt. 6:9–13]]). Luke sets it on the road, after Jesus has been praying, in answer to one disciple’s request. The request itself suggests why the prayer comes again: a disciple who had heard the Sermon on the Mount would hardly need to ask. This one seems not to have followed Jesus from early in His ministry, and so had evidently not heard the earlier model prayer.

      The two could be taken as one tradition that Matthew and Luke each placed where it suited them, but the settings are very unlike: a sermon to a crowd on a mountain, and a reply to a single disciple who has just watched Jesus pray. They point to two occasions and similar instruction. Read that way, Luke’s prayer is not a shortened copy of Matthew’s but the same pattern given to a new hearer, in somewhat different words.
    sources: [brown-testimony-luke]
  - ref: 4
    phrase: And lead us not into temptation
    kind: words
    title: Forgiveness asked, and temptation
    body: |
      Luke’s prayer asks the Father to “forgive us our sins,” where Matthew’s asks forgiveness of “debts” ([[Matt. 6:12]]). Luke names sin itself, whose forgiveness is one of the miracles of the Atonement; Matthew’s word is broader, the debts owed to another, God included. The next clause gives the ground of the request: “for we also forgive every one that is indebted to us.” The disciple asks for mercy as one who has already shown it, and that forgiving is very much a prerequisite of the appeal.

      The last petition raises a harder question: does God lead people into temptation? The Greek word, *peirasmos*, can mean either temptation to sin or trial, and the petition is best taken as “preserve us from severe trial.” The Joseph Smith Translation answers the question directly: “And let us not be led unto temptation; but deliver us from evil; for thine is the kingdom and power. Amen.” God does not lead anyone into temptation; He is the refuge from it. The added words of praise resemble the close of the prayer in Matthew without being identical to it, which suggests that they restore what Luke meant rather than copy Matthew.
    sources: [brown-testimony-luke, lds-scriptures]
  - ref: 5
    phrase: Friend, lend me three loaves
    kind: history
    title: A knock at midnight
    body: |
      The story turns on hospitality, and on how near a friend stood to a man in that world, almost as close as a brother. Outside the homes of the wealthy, village life ran by the sun, and the middle of the night was the worst possible hour to knock. But a friend had arrived from a journey, and a traveler who was also a friend had a claim on his host that went beyond a guest’s needs. The host had no bread, so he went to another friend. The answer from inside, “Trouble me not,” was completely out of character for a neighbor in that world. It is also evasive: the man does not say he has no bread, only that the door is shut and the children are asleep.

      The Joseph Smith Translation tells the reader how to take the story before it begins. It adds a sentence on Jesus’s lips and calls what follows a parable: “Your heavenly Father will not fail to give unto you whatsoever ye ask of him. And he spake a parable, saying …” The story illustrates God’s way of answering prayer, and it does so by contrast. Its point comes in verse 13: the Father gives far better than people give one another.
    sources: [brown-testimony-luke, lds-scriptures]
  - ref: 8
    phrase: because of his importunity
    kind: words
    title: Shameless persistence
    body: |
      “Importunity” translates *anaideia*, literally “shamelessness,” here of a man who keeps up his pleading with no regard for what is proper. Friendship would carry the man in bed only so far; it would not get him up. The insistent knocking would. The commands that follow carry the thought on: “ask,” “seek” and “knock” are present imperatives in Greek, with the sense of continuing, sustained action rather than a single try.

      The story does not mean that God has to be worn down. Jesus argues from the lesser to the greater: if a grudging neighbor gives in to persistence, the Father who is not grudging will give far better (verse 13). The asking matters for another reason: “The object of prayer is not to change the will of God but to secure for ourselves and for others blessings that God is already willing to grant but that are made conditional on our asking for them.” That is why prayer is itself “a form of work,” and why the asking is meant to go on.
    sources: [thayer, brown-testimony-luke, bd-prayer]
  - ref: 13
    phrase: how much more shall your heavenly Father give the Holy Spirit to them that ask him
    kind: scripture
    title: The best gift
    body: |
      Jesus moves the lesson from a neighbor’s door into a father’s house. No father hands his son a snake when he asks for a fish, or a scorpion for an egg. The good gifts are ordinary food and the evil ones creatures no one could eat, and the exaggeration is what makes the lesson stick. If fathers who are “evil,” unable of themselves to be wholly good, still give good gifts, the heavenly Father will give far better ones.

      In the Sermon on the Mount the same comparison, with a different list of gifts, ends with “good things” ([[Matt. 7:11]]). Luke ends with the Holy Spirit, the best gift saved for last. The Joseph Smith Translation joins the two readings: the Father gives “good gifts, through the Holy Spirit,” which makes Him the real source of every good gift and the Spirit the way it comes. The differences between the two lists are one more reason to take this as a lesson Jesus gave on more than one occasion.
    sources: [brown-testimony-luke, lds-scriptures]
  - ref: 15
    phrase: Beelzebub the chief of the devils
    kind: history
    title: Beelzebub
    body: |
      Beelzebub was the name of a Philistine god, spelled Baalzebub in [[2 Kgs. 1:1–6]], and in Jesus’s day it served as a title for Satan, “the chief of the devils.” The name is a corruption of a Semitic title, *Baalzebul*, “Baal the Prince” or “Baal of the exalted abode,” and most early manuscripts of Luke read “Beelzebul”; “Beelzebub” means “lord of flies.”

      The accusers cannot deny that a man who could not speak now speaks. They can only argue about where the power came from. The charge had been foretold more than a century and a half before, in the angel’s words to King Benjamin: “they shall consider him a man, and say that he hath a devil” ([[Mosiah 3:9]]).
    sources: [bd-beelzebub, brown-testimony-luke]
  - ref: 20
    phrase: the finger of God
    kind: scripture
    title: The finger of God
    body: |
      Jesus’s answer goes in steps. Satan would not fight against himself. Others besides Jesus cast out devils, among the accusers’ own people, and those “sons” will judge them, though He does not say how (verse 19). Then the claim itself: “if I with the finger of God cast out devils, no doubt the kingdom of God is come upon you.”

      The phrase comes from Exodus. When Pharaoh’s magicians could not copy the plague of lice, they said, “This is the finger of God” ([[Ex. 8:19]]). On Jesus’s lips it may mean that He works by no charm or incantation, only by God’s power. Elsewhere the phrase reaches further: the heavens are “the work of thy fingers” ([[Ps. 8:3]]), and the tables of the law were “written with the finger of God” ([[Ex. 31:18]]). Read with those, Jesus’s words set His casting out of devils alongside God’s creating and His giving of the law, as works of the same divine power. Matthew has “by the Spirit of God” at this point ([[Matt. 12:28]]).

      The verb in “is come upon you” is past tense and means to arrive, or to come before one expects. The kingdom has already arrived, with Jesus’s preaching and works.
    sources: [brown-testimony-luke]
  - ref: 22
    phrase: a stronger than he
    kind: christ
    title: The stronger man
    body: |
      The strong man of this parable is Satan, armed and guarding his house, his goods undisturbed. The one “stronger than he,” who comes upon him, overpowers him and strips him of the armor he trusted in, is Jesus Himself. The goods are best taken as the souls the devil has held captive. Once he is overcome he must give them up, whether they are among the living or among the dead.

      The healing that began the dispute shows it on a small scale. The devil had bound the man’s tongue; when the devil was gone out, “the dumb spake” (verse 14). The strong man had lost what he held.
    sources: [brown-testimony-luke]
  - ref: 23
    phrase: He that is not with me is against me
    kind: scripture
    title: With me, or for us?
    body: |
      Two chapters earlier Jesus told John not to forbid a man who cast out devils in His name, “for he that is not against us is for us” ([[Luke 9:50]]). The two sayings do not cancel each other; this one is added to the earlier. That one speaks of “us,” of others doing the Lord’s work, and is generous toward such allies. This one speaks of “me”: it concerns each disciple’s own relationship to the Savior, and there is no neutral ground in that.

      The second half makes the same point, most naturally with a shepherd’s image of gathering and scattering a flock. In scripture it is usually God who scatters His people; one who scatters on his own takes up a role that belongs to God, and Jesus’s words say he does it without God’s direction. There is no neutral way to stand beside the flock: one gathers it with Jesus or drives it apart.
    sources: [brown-testimony-luke]
  - ref: 26
    phrase: the last state of that man is worse than the first
    kind: symbol
    title: Swept, garnished and empty
    body: |
      The story of the unclean spirit carries on the image of a house. The man is the house. The spirit has gone out, and when it comes back it finds the place swept and “garnished,” put in order, with no one living there. It brings seven others worse than itself, and the man ends worse off than before. A person freed of evil influences who does not replace them with good stays exposed, as modern revelation warns: “unto that soul who sinneth shall the former sins return” ([[D&C 82:7]]). The devil and his servants do not give up easily.
    sources: [brown-testimony-luke]
  - ref: 28
    phrase: Yea rather, blessed are they that hear the word of God, and keep it
    kind: scripture
    title: Blessed rather
    body: |
      The woman in the crowd praises Jesus by praising the mother who bore and raised Him. His answer moves the blessing from birth to obedience, as He had done once before when told that His mother and brothers were outside: “My mother and my brethren are these which hear the word of God, and do it” ([[Luke 8:21]]).

      Read with Luke’s first chapters, Mary herself is the great example in this Gospel of hearing the word of God and keeping it. The woman’s cry echoes Mary’s own words at Elisabeth’s house: “from henceforth all generations shall call me blessed” ([[Luke 1:48]]).
    sources: [brown-testimony-luke, lds-scriptures]
  - ref: 30
    phrase: as Jonas was a sign unto the Ninevites
    kind: christ
    title: The sign of Jonas in Luke
    body: |
      In Matthew the sign of Jonas is the three days and nights in the belly of the fish, a figure of Jesus’s burial and resurrection ([[Matt. 12:40]]). Luke gives no such explanation, and his sign is about repentance. Jonah was a sign to Nineveh as a preacher: a Gentile city heard him, repented and escaped its doom ([[Jonah 3:5–10]]). The Son of Man is that kind of sign to His generation. He is Himself the visible sign of the call to repent, and His hearers are resisting what Nineveh accepted.

      The queen of Sheba makes the same point ([[1 Kgs. 10:1–10]]). She came from the ends of the earth to hear Solomon, and the Ninevites repented at Jonah’s word. At the judgment these Gentiles will stand up like witnesses in a courtroom against a generation that had among it someone greater than a king and greater than a prophet. Luke’s Jesus had held up Gentiles in the same way in His first sermon, at Nazareth ([[Luke 4:24–27]]).
    sources: [brown-testimony-luke]
  - ref: 34
    phrase: when thine eye is single
    kind: words
    title: A single eye
    body: |
      The Greek *haplous* means simple or single, with nothing folded or confused in it; of an eye, sound, doing its work. It can mean “healthy” in a physical sense and “pure” in an ethical one (some hold that only the moral sense is warranted), and the saying works on both: an eye that works lets light into the whole body, and a pure one fills the whole person with light. The warning that follows, “take heed therefore that the light which is in thee be not darkness,” holds out the possibility that a person’s inner light can go out and darkness take its place.

      For Latter-day Saints the phrase has a fuller form. In the same saying in Matthew the Joseph Smith Translation reads “single to the glory of God,” and the revelation to which the footnote points makes the same promise: “if your eye be single to my glory, your whole bodies shall be filled with light” ([[D&C 88:67]]). Where Luke places it, the saying gathers up the chapter: the light comes to the one who has done what its earlier scenes describe, praying (verses 1–13), keeping a house undivided (verses 14–28) and honoring the One greater than Jonas (verses 29–32).
    sources: [thayer, brown-testimony-luke, lds-scriptures]
  - ref: 38
    phrase: he had not first washed before dinner
    kind: history
    title: Not washed before the meal
    body: |
      The Pharisees washed their hands before eating as a religious rite ([[Mark 7:2–5]]), a custom that grew out of the ancient washing of a guest’s feet. Luke’s verb is stronger: *baptizō*, “to immerse,” which may point to bathing in a ritual pool. Jesus, a guest in a Pharisee’s house, presumably knew the custom, and He did not follow it.

      It may well have been deliberate. He would have known how the other guests would take it, and it let Him make His point at once, to men of influence: outward acts reveal little of what a person is. What is at issue at this table is public style against inner character, and the cup cleaned on the outside and full of “ravening,” plunder, within (verse 39) puts it in a picture.
    sources: [brown-testimony-luke, lds-scriptures]
  - ref: 41
    phrase: give alms of such things as ye have
    kind: words
    title: Clean from within
    body: |
      The Greek of verse 41 can be read several ways. “Such things as ye have” (*ta enonta*) means “what is inside,” so it may mean give alms from the heart, or give alms from what is in your basket and storeroom. “All things are clean unto you” could mean that alms make a person clean, or that turning from plunder does, or that a gift from the heart makes the hand-washing unnecessary.

      The Joseph Smith Translation settles it with a condition: “But if ye would rather give alms of such things as ye have; and observe to do all things which I have commanded you, then would your inward parts be clean also.” Giving is not a rite that cleans by itself. The inside is made clean by doing what Jesus has commanded, and the words imply that some at that table had heard His commands before.
    sources: [brown-testimony-luke, lds-scriptures]
  - ref: 42
    phrase: ye tithe mint and rue and all manner of herbs
    kind: history
    title: Tithing the herbs
    body: |
      The law of Moses required a tithe of the harvest, and part of it went to the needy ([[Deut. 14:22]]; [[Deut. 26:12–13]]). The Pharisees tithed even the leaves of the kitchen garden, mint and rue, and passed over “judgment and the love of God.” Jesus does not tell them to stop: “these ought ye to have done, and not to leave the other undone.” The saying upholds the outward part of the law while holding to its moral heart, and the principle of tithing with it.

      This is the first of six woes in the scene, three on the Pharisees and three on the lawyers. The Pharisees’ three are for tedious care over small outward duties, for loving the first seats and the greetings, and for being graves no one can see.
    sources: [brown-testimony-luke]
  - ref: 44
    phrase: ye are as graves which appear not
    kind: symbol
    title: Graves no one sees
    body: |
      Under the law, whoever touched a grave was unclean for seven days ([[Num. 19:16]]). A grave “which appear not” was a hazard, since people could walk over it and be defiled without knowing. Jesus turns the purity law on the men most careful to keep it. Those who claimed to be clean were so unclean that they made others unclean by contact, and the people around them could not tell.

      In Matthew’s woes, spoken in the temple, the image is the other way round: there the scribes and Pharisees are “whited sepulchres,” bright and plain to see ([[Matt. 23:27]]).
    sources: [brown-testimony-luke]
  - ref: 45
    phrase: one of the lawyers
    kind: history
    title: The lawyers
    body: |
      The lawyers were the scribes under another name (see the note on [[Luke 7:30]]), and Luke uses the two words for the same men, as verse 53 suggests. Their work was to develop the law of Moses in detail and apply it to their own time, and out of that work grew the oral tradition beside the written law. As a rule they were Pharisees, though some were Sadducees, and this lawyer heard the woes on the Pharisees as falling on him too: “thou reproachest us also.” The verb is strong, to treat with contempt or to insult.

      Jesus does not take it back. His first woe on the lawyers fits their calling: they loaded others with burdens hard to bear and would not touch those burdens with one finger.
    sources: [bd-scribe, brown-testimony-luke]
  - ref: 48
    phrase: ye allow the deeds of your fathers
    kind: words
    title: Tombs for the prophets
    body: |
      Building tombs for the prophets sounds like honoring them, and that is the bite of the woe. The verb rendered “allow” (*syneudokeō*; the footnote gives “agree, accord with”) means to approve of, a far heavier charge than the English suggests. The fathers killed the prophets; the sons build them monuments, and Jesus counts the building itself as their witness that they share their fathers’ mind. The honor is a show: the woe falls on an inner disdain for the prophets of the past hidden under it, and the next verses say what that disdain will do to the prophets and apostles still to be sent.
    sources: [brown-testimony-luke, lds-scriptures]
  - ref: 51
    phrase: unto the blood of Zacharias
    kind: history
    title: From Abel to Zacharias
    body: |
      Abel is the first man slain in scripture ([[Gen. 4:8]]). Zacharias is Zechariah the son of Jehoiada, stoned in the court of the house of the Lord for rebuking the people ([[2 Chr. 24:20–22]]). Chronicles stands last in the Hebrew Bible, so the line runs from the first martyr in scripture to the last. The altar of sacrifice stood just outside the sanctuary and down its steps, to the east, so “between the altar and the temple” likely points to the court where Chronicles says he died. The words Jesus introduces with “the wisdom of God” (verse 49) come from a source that is not known.

      Some Latter-day Saints have taken this Zacharias to be John the Baptist’s father. The story comes from later versions of the Protevangelium of James, a noncanonical writing of the second century, and an unsigned article in the *Times and Seasons* of September 1, 1842, repeated it; from there it entered *Teachings of the Prophet Joseph Smith*. The article is written in the third person and its style is closest to W. W. Phelps’s, and the weight of the evidence is that Joseph Smith did not write it. The two are different men: the Zacharias slain between the temple and the altar is the one of 2 Chronicles 24. Matthew’s account names him “son of Barachias”; [[Matt. 23:35]] takes up that difficulty.
    sources: [brown-testimony-luke, wilson-zacharias, bd-zacharias]
  - ref: 52
    phrase: ye have taken away the key of knowledge
    kind: scripture
    title: The key of knowledge
    body: |
      The Joseph Smith Translation names the key. After “the key of” it reads “knowledge, the fullness of the scriptures; ye enter not in yourselves into the kingdom; and those who were entering in, ye hindered.” What the lawyers had taken away was revelation, contained in the full word of God, and the charge has two parts. They rejected the revelation that would have led them into the kingdom, and they used their influence to keep others from going in. The footnote joins the verse to Zacharias’s prophecy at John’s birth, that John would “give knowledge of salvation unto his people by the remission of their sins” ([[Luke 1:77]]). That knowledge of salvation is what was being blocked.

      The hindering was spiritual and intellectual rather than physical: the lawyers kept the key secret and left the people in ignorance. Jesus seems to mean that they held back not only parts of scripture but also sacred rites they judged too holy for common people. In the Restoration such a key opens the way to heavenly knowledge: the greater priesthood “holdeth the key of the mysteries of the kingdom, even the key of the knowledge of God” ([[D&C 84:19]]).
    sources: [lds-scriptures, flinders-key-knowledge, brown-testimony-luke]

christ: |
  Luke 11 shows Jesus Christ as the stronger one who comes upon the strong man and takes back what he had captured, someone greater than Solomon and greater than Jonas, whose own presence among His generation is the sign that calls it to repent. He is also the Son who teaches others to pray to His Father, and who promises that the Father gives, and gives the Holy Spirit, to those who ask (verse 13). Prayer is the act by which a child’s will is brought into line with the Father’s, and the blessings He is already willing to give are conditional on the asking, so persistence in prayer is not a struggle to change God’s mind.

explore: |
  - **The other tellings.** [[Matt. 6:9–13]] and [[3 Ne. 13:9–13]] for the prayer; [[Matt. 7:7–11]] for asking and the father’s gifts; [[Matt. 12:22–45]] and [[Mark 3:22–30]] for Beelzebub and the sign of Jonas; [[Matt. 23:1–36]] for the woes in the temple.
  - **Persistence in prayer.** [[Luke 18:1–8]], the widow who keeps coming to an unjust judge, which Luke tells later in the journey with the same lesson.
  - **Another meal with Pharisees.** [[Luke 14:1–24]], where Jesus again dines with Pharisees and lawyers and teaches them more gently.

