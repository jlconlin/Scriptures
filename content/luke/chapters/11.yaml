chapter: 11
title: Lord, Teach Us to Pray
tagline: Jesus teaches a disciple to pray and promises that the Father gives to those who ask, answers the charge that He casts out devils by Beelzebub, offers His generation only the sign of Jonas, and at a Pharisee’s table pronounces woes on Pharisees and lawyers who keep the key of knowledge.
when: 'On Jesus’s journey toward Jerusalem; Luke names no place or time ([[Luke 9:51]])'

setting: |
  Luke 10 ended in the house of Martha and Mary, with Mary sitting at Jesus’s feet ([[Luke 10:38–42]]), and chapter 11 picks up the same two concerns, prayer and the home. It belongs to the long journey that began when Jesus “steadfastly set his face to go to Jerusalem” ([[Luke 9:51]]). Luke ties little of that journey to a place or a day. “A certain place” (verse 1) is all he gives, and much of this part of his Gospel seems to be drawn from teachings remembered without their time and place.

  Much of the chapter will sound familiar to a reader of Matthew. The Lord’s Prayer, “ask, and it shall be given you,” the lamp and the eye all stand in the Sermon on the Mount; the Beelzebub dispute and the sign of Jonas are in [[Matt. 12:22–45]]; and woes like these fall on the scribes and Pharisees in the temple in [[Matt. 23:1–36]]. Luke sets them differently. Nothing requires that Jesus said such things only once, since teachers repeat themselves, and the settings differ so much that they point to different occasions and similar instruction.

  The chapter ends at a Pharisee’s table, and the meal is a turning point. The opposition that broke out in Galilee ([[Luke 6:11]]) seems to have grown quiet; after this dinner it takes new life.

thread: |
  **Luke 11 sets the Father who gives beside people who withhold, and light received beside light hidden.**

  It opens with prayer. A disciple asks to be taught; Jesus gives him a pattern, then tells of a neighbor who will not get out of bed for a friend and finally gives only because he is pestered. The Father is far better than that neighbor. If fathers who are evil give their children food, “how much more” will He give the Holy Spirit. From there the chapter turns to a contest over power. Some say Jesus casts out devils by Beelzebub; He answers that a stronger one has come upon the strong man, and that a house swept clean and left empty does not stay empty. A crowd wants a sign, and He offers the one Nineveh had, a preacher of repentance. A lamp is lit to be seen, and an eye that is single fills the whole body with light.

  The last scene shows the reverse. At a Pharisee’s table Jesus finds men careful about the outside of the cup and the tithe on garden herbs, who build tombs for the prophets their fathers killed and keep the key of knowledge from those who would enter. Those who should have been receiving light have hidden it, and the chapter ends in judgment.

sections:
  - range: 1-13
    heading: Teach us to pray
    plain: |
      Once Jesus was praying in a certain place. When He finished, one of His disciples said to Him, “Lord, teach us to pray, as John also taught his disciples.” He said to them, “When you pray, say: Our Father in heaven, may your name be kept holy. May your kingdom come. May your will be done on earth as it is in heaven. Give us day by day our daily bread. Forgive us our sins, for we also forgive everyone who owes us anything. And do not lead us into temptation, but deliver us from evil.”

      He went on: “Suppose one of you has a friend, and you go to him at midnight and say, ‘Friend, lend me three loaves of bread. A friend of mine on a journey has come to me, and I have nothing to set before him.’ And he answers from inside, ‘Do not bother me. The door is already shut, and my children are in bed with me. I cannot get up and give you anything.’ I tell you, even if he will not get up and give him the bread because he is his friend, yet because of his shameless persistence he will get up and give him as much as he needs.

      “So I say to you: ask, and it will be given to you; seek, and you will find; knock, and the door will be opened to you. For everyone who asks receives, whoever seeks finds, and to whoever knocks the door will be opened. Which of you fathers, if your son asks for bread, will give him a stone? Or if he asks for a fish, will give him a snake instead? Or if he asks for an egg, will give him a scorpion? If you, then, though you are evil, know how to give good gifts to your children, how much more will your Father in heaven give the Holy Spirit to those who ask Him?”
  - range: 14-28
    heading: A stronger than the strong man
    plain: |
      Jesus was casting a devil out of a man who could not speak. When the devil had gone out, the man spoke, and the crowds were amazed. But some of them said, “He casts out devils by Beelzebub, the chief of the devils.” Others, to test Him, demanded a sign from heaven. He knew what they were thinking and said to them, “Every kingdom divided against itself is laid waste, and a house divided against a house falls. If Satan is divided against himself, how will his kingdom stand? For you say that I cast out devils by Beelzebub. And if I cast out devils by Beelzebub, by whom do your own sons cast them out? So they will be your judges. But if I cast out devils by the finger of God, then the kingdom of God has come upon you.

      “When a strong man, fully armed, guards his own house, his goods are safe. But when someone stronger than he attacks and overpowers him, he takes away the armor the man trusted in and divides up the spoils. Whoever is not with me is against me, and whoever does not gather with me scatters.

      “When an unclean spirit has gone out of a man, it wanders through dry places looking for rest. Finding none, it says, ‘I will go back to the house I left.’ When it comes, it finds the house swept and put in order. Then it goes and brings seven other spirits more wicked than itself, and they go in and live there. And the last state of that man is worse than the first.”

      As He was saying this, a woman in the crowd called out to Him, “Blessed is the womb that bore you, and the breasts that nursed you!” But He said, “Blessed rather are those who hear the word of God and keep it.”
  - range: 29-36
    heading: The sign of Jonas, and the lamp
    plain: |
      As the crowds kept growing, He began to say, “This is an evil generation. It looks for a sign, but no sign will be given it except the sign of Jonah the prophet. For as Jonah was a sign to the people of Nineveh, so the Son of Man will be to this generation. The queen of the south will rise up at the judgment with the people of this generation and condemn them, for she came from the ends of the earth to hear the wisdom of Solomon; and look, someone greater than Solomon is here. The people of Nineveh will rise up at the judgment with this generation and condemn it, for they repented at Jonah’s preaching; and look, someone greater than Jonah is here.

      “No one lights a lamp and puts it in a hidden place or under a bushel, but on a lampstand, so that those who come in may see the light. Your eye is the lamp of your body. When your eye is single, your whole body is full of light; but when it is evil, your body is full of darkness. So take care that the light in you is not darkness. If your whole body is full of light, with no part dark, it will all be full of light, as when a lamp shines on you with its bright rays.”
  - range: 37-44
    heading: At a Pharisee’s table
    plain: |
      While He was speaking, a Pharisee invited Him to eat with him, so He went in and took His place at the table. The Pharisee was surprised to see that He had not first washed before the meal. The Lord said to him, “You Pharisees clean the outside of the cup and the dish, but inside you are full of plunder and wickedness. Foolish people! Did not the One who made the outside make the inside too? Rather, give alms from what you have, and then everything is clean for you.

      “But woe to you, Pharisees! You pay tithes of mint and rue and every garden herb, and you pass over judgment and the love of God. These you should have done, without leaving the others undone. Woe to you, Pharisees! You love the best seats in the synagogues and greetings in the marketplaces. Woe to you, scribes and Pharisees, hypocrites! You are like unmarked graves, and people walk over them without knowing it.”
  - range: 45-54
    heading: Woes on the lawyers
    plain: |
      One of the lawyers answered Him, “Teacher, when you say these things, you insult us too.” He said, “Woe to you lawyers also! You load people with burdens hard to carry, and you yourselves will not touch those burdens with one of your fingers. Woe to you! You build the tombs of the prophets, and your fathers killed them. So you are witnesses that you approve of what your fathers did: they killed the prophets, and you build their tombs. That is why the wisdom of God said, ‘I will send them prophets and apostles, and some of them they will kill and persecute,’ so that the blood of all the prophets shed since the foundation of the world may be required of this generation, from the blood of Abel to the blood of Zacharias, who was killed between the altar and the temple. Yes, I tell you, it will be required of this generation. Woe to you lawyers! You have taken away the key of knowledge. You did not go in yourselves, and you hindered those who were going in.”

      As He said these things to them, the scribes and the Pharisees began to press Him hard and to provoke Him to speak about many things, lying in wait for Him and trying to catch Him in something He might say, so that they could accuse Him.

notes:
  - ref: 1
    phrase: teach us to pray, as John also taught his disciples
    kind: history
    title: The prayer taught a second time
    body: |
      Jesus had already given this prayer to a multitude in the Sermon on the Mount ([[Matt. 6:9–13]]); Luke shows why a disciple asked for it again. Jesus had been praying, very likely aloud, since that was the common Jewish practice, and the disciples evidently heard Him. His example, and the spirit of prayer they saw in His daily life, moved them to ask how they should pray. The law of Moses gave no form of private prayer, but the Jewish authorities had prescribed formal prayers, and John the Baptist had taught his followers how to pray. That is the comparison the disciple makes.

      At first sight the request suggests that this disciple had not been present at the Sermon on the Mount. He may instead have known that prayer and thought it meant for the multitude, too short and simple beside the devotions John prescribed or the prayers he heard from his Master. Either way, Jesus answered with the same short pattern in nearly the same words: what had been given to the multitude was enough for disciples too. Then He went further than He had on the mountain, and taught in the parable that follows how earnestly and persistently to pray.
    sources: [talmage-jesus-christ-26, ellicott-luke]
  - ref: 4
    phrase: And lead us not into temptation
    kind: words
    title: Forgiveness asked, and temptation
    body: |
      Luke’s prayer asks the Father to “forgive us our sins,” where Matthew’s asks forgiveness of “debts” ([[Matt. 6:12]]). Luke’s word may have been chosen as plainer to Gentile readers, but he keeps Matthew’s picture in the next clause: “for we also forgive every one that is indebted to us.” The disciple asks for mercy as one who has already shown it; the measure this sets is taken up in the note on [[Matt. 6:12]].

      The last petition raises a harder question: does God lead people into temptation? The Greek word, *peirasmos*, covers both the trial that tests a person’s faithfulness and the enticement to sin; in this petition it is the condition or state of mind by which a person is drawn toward sin or away from faith. The Joseph Smith Translation answers the question directly: “And let us not be led unto temptation; but deliver us from evil; for thine is the kingdom and power. Amen.” As in Matthew’s prayer, where the translation makes the same change (see the note on [[Matt. 6:13]]), the one who prays asks not to be led into temptation, and the sentence no longer makes God the one who leads.
    sources: [ellicott-luke, thayer, lds-scriptures]
  - ref: 5
    phrase: Friend, lend me three loaves
    kind: history
    title: A knock at midnight
    body: |
      The story is set in a poor man’s house at the hour when, above all others, people expect to be left to their rest. Parents and children slept in one room, the little ones in the same bed, probably the raised platform that filled much of an Eastern house, so to get up was to wake the household. A traveler has come to him late and weary, and with no bread in the house he makes his guest’s need his own, pleading at his neighbor’s door as though for himself, trusting his friend to honor a claim made for someone else.

      The Joseph Smith Translation tells the reader how to take the story before it begins. It adds a sentence on Jesus’s lips and calls what follows a parable: “Your heavenly Father will not fail to give unto you whatsoever ye ask of him. And he spake a parable, saying …” The added words make it plain that the story is about how God hears and answers prayer, and it teaches by contrast, not likeness. The neighbor finally gives to be rid of the man at the door; nothing in God’s wise waiting is like his selfish refusal. If even such a man will give, the Father will give far more surely (verse 13).
    sources: [ellicott-luke, talmage-jesus-christ-26, sc-knowhy-662, lds-scriptures]
  - ref: 8
    phrase: because of his importunity
    kind: words
    title: Shameless persistence
    body: |
      “Importunity” translates *anaideia*, literally “shamelessness,” a word found nowhere else in the New Testament: the persistence of a man who keeps up his pleading with no regard for what is proper. Friendship would not get the neighbor out of bed (“though he will not rise and give him, because he is his friend”); the knocking that would not stop did. So Jesus follows the story with “ask,” “seek” and “knock.”

      The story does not mean that God has to be worn down. Jesus argues from the lesser to the greater: if a man, for all his selfishness, will grant what is asked and asked again, God will far more surely grant what is persistently asked in faith and with righteous intent. Persistence matters for another reason. The Father sometimes delays the granting “that the asking may be more fervent,” and “the object of prayer is not to change the will of God but to secure for ourselves and for others blessings that God is already willing to grant but that are made conditional on our asking for them.” That is why prayer is itself “a form of work,” and why the asking is meant to go on.
    sources: [thayer, ellicott-luke, talmage-jesus-christ-26, bd-prayer]
  - ref: 13
    phrase: how much more shall your heavenly Father give the Holy Spirit to them that ask him
    kind: scripture
    title: The best gift
    body: |
      Jesus moves the lesson from a neighbor’s door into a father’s house. A father does not hand his son a serpent when he asks for a fish, or a scorpion when he asks for an egg. The scorpion, which Matthew’s list lacks, may have come to mind because Jesus had just paired serpents and scorpions in His promise to the Seventy ([[Luke 10:19]]). If fathers who are “evil” still give good gifts, the heavenly Father will give far better ones.

      In the Sermon on the Mount the same comparison ends with “good things” ([[Matt. 7:11]]; see the note on [[Matt. 7:9]]). Luke ends with the Holy Spirit, the one highest gift in place of the wider and less definite “good things.” The Joseph Smith Translation joins the two readings: the Father gives “good gifts, through the Holy Spirit.” Set against the friend at midnight, the promise is a contrast. People give, even with less than perfect motives; the Father, in love and mercy, gives His good gifts through the Spirit to those who ask.
    sources: [ellicott-luke, sc-knowhy-662, lds-scriptures]
  - ref: 15
    phrase: Beelzebub the chief of the devils
    kind: history
    title: Beelzebub
    body: |
      Beelzebub was the name of a Philistine god, spelled Baalzebub in [[2 Kgs. 1:1–6]], and in Jesus’s day it served as a title for Satan, “the chief of the devils.” What the name meant is not settled. The Greek has *Beelzeboul*, which has been read as “lord of dung,” that is, of filth or idolatry. The King James form, *Beelzebub*, is found in some early authorities but in no Greek one; those who prefer it take it as “lord of flies,” after the god of Ekron in [[2 Kgs. 1:2]], a name the Jews would then have turned on Satan in contempt.

      The accusers cannot deny that a man who could not speak now speaks. They can only argue about where the power came from. The footnote at this verse points to the angel’s words to King Benjamin, which foretold this very charge: “they shall consider him a man, and say that he hath a devil” ([[Mosiah 3:9]]). Matthew’s telling of the charge, and what it could cost the one accused, is in the note on [[Matt. 12:24]].
    sources: [bd-beelzebub, thayer, lds-scriptures]
  - ref: 20
    phrase: the finger of God
    kind: scripture
    title: The finger of God
    body: |
      Jesus’s answer goes in steps. Satan would not fight against himself. The accusers’ own followers cast out devils too, and those “sons” will judge them (verse 19; see the note on [[Matt. 12:27]]). Then the claim itself: “if I with the finger of God cast out devils, no doubt the kingdom of God is come upon you.”

      The phrase reaches back to Exodus. When Pharaoh’s magicians could not copy the plague of lice, they confessed, “This is the finger of God” ([[Ex. 8:19]]), and the tables of the law were “written with the finger of God” ([[Ex. 31:18]]). The prophets spoke of “the hand of the Lord” for God’s power upon them; as the hand stands for power in general, the finger stands for that power concentrated and aimed at one work. Matthew has “by the Spirit of God” at this point ([[Matt. 12:28]]), and the footnote here points to Peter’s summary of the ministry: God anointed Jesus “with the Holy Ghost and with power,” and He went about “healing all that were oppressed of the devil” ([[Acts 10:38]]).

      The verb in “is come upon you” means to arrive, and here it can carry the sense of arriving sooner than expected: read that way, the kingdom of God had come upon them before they looked for it, in the works they were watching.
    sources: [ellicott-luke, thayer, lds-scriptures]
  - ref: 22
    phrase: a stronger than he
    kind: christ
    title: The stronger man
    body: |
      The strong man of this parable is Satan, the master of devils, armed and guarding his palace, his goods undisturbed. Jesus had been attacking his stronghold, driving evil spirits out of the human bodies they had taken over, and He could not have done it had He not first overcome their master. The one “stronger than he” is Jesus Himself, and between the two powers there could be no truce.

      Luke tells the parable more fully than Matthew and Mark ([[Matt. 12:29]]; [[Mark 3:27]]). The strong man is armed, his house is a palace, and the stronger one takes from him “all his armour,” the full armor he trusted in, the same Greek word Paul uses for “the whole armour of God” ([[Eph. 6:13]]), and then divides the spoils.
    sources: [talmage-jesus-christ-18, ellicott-luke]
  - ref: 23
    phrase: He that is not with me is against me
    kind: scripture
    title: With me, or for us?
    body: |
      Two chapters earlier Jesus told John not to forbid a man who cast out devils in His name, “for he that is not against us is for us” ([[Luke 9:50]]; see the note there). The two sayings seem to pull against each other, but they are opposite poles of one truth: in the struggle between God and the enemy of God there is no neutral ground. The man John had stopped was fighting the devil in Christ’s name, and so was with Him. The accusers here were hindering and slandering that same work, and so stood on the other side.

      Spoken to them, the saying was an invitation to judge themselves, each deciding on which side he stood. The second half puts it as a harvest: whoever was not gathering in God’s harvest of souls with Jesus was scattering and wasting it.
    sources: [ellicott-matthew, talmage-jesus-christ-18]
  - ref: 26
    phrase: the last state of that man is worse than the first
    kind: symbol
    title: Swept and garnished
    body: |
      The story of the unclean spirit carries on the image of a house. The man is the house. The spirit has gone out, and when it comes back it finds the place swept and “garnished,” put in order; it brings seven others worse than itself, and the man ends worse off than before. Read as a type, the house stands for those who have received the truth and so been freed from the unclean influences of error and sin, but who afterward renounce the good, open their souls to falsehood and deceit, and become more corrupt than they were.

      Luke tells it more briefly than Matthew. He does not call the house “empty,” and he leaves out Matthew’s application, “Even so shall it be also unto this wicked generation” ([[Matt. 12:45]]). The Joseph Smith Translation of Matthew sets the parable in a dialogue about speaking against the Holy Ghost (see the note on [[Matt. 12:44]]).
    sources: [talmage-jesus-christ-18, ellicott-luke, lds-scriptures]
  - ref: 28
    phrase: Yea rather, blessed are they that hear the word of God, and keep it
    kind: scripture
    title: Blessed rather
    body: |
      The woman in the crowd praises Jesus by praising the mother who bore and nursed Him, and only Luke tells of her. Her cry fulfills Mary’s own words at Elisabeth’s house, to which the footnote points: “from henceforth all generations shall call me blessed” ([[Luke 1:48]]).

      Jesus does not reject the blessing; He extends it, as He had done once before when told that His mother and brothers were outside: “My mother and my brethren are these which hear the word of God, and do it” ([[Luke 8:21]]). “The word of God” here is first the message of the kingdom that Jesus Himself was speaking, though it reaches as well to the written record of that word and to later revelation.
    sources: [ellicott-luke, lds-scriptures]
  - ref: 30
    phrase: as Jonas was a sign unto the Ninevites
    kind: christ
    title: The sign of Jonas in Luke
    body: |
      In Matthew the sign of Jonas is explained: three days and nights in the belly of the fish, a figure of Jesus’s burial and resurrection ([[Matt. 12:40]]; see the note there). Luke gives no such explanation, and he sets the queen of the south between the sign and the men of Nineveh. What he does say is that Jonas was a sign “unto the Ninevites,” who “repented at the preaching of Jonas” (verse 32; [[Jonah 3:5–10]]). One Latter-day Saint reading takes Luke’s sign as a call to repentance: the Son of Man is Himself the visible sign, and His hearers are resisting what Nineveh accepted.

      The queen of the south, who came to hear Solomon ([[1 Kgs. 10:1]]), and the men of Nineveh will “rise up in the judgment” in the sense of standing up as witnesses. They were Gentiles with far poorer opportunities, yet they sought wisdom and repented, and their example puts to shame the slowness and unbelief of a generation that had among it someone greater than Solomon and greater than Jonas.
    sources: [ellicott-luke, ellicott-matthew, brown-testimony-luke]
  - ref: 34
    phrase: when thine eye is single
    kind: words
    title: A single eye
    body: |
      The Greek *haplous* means simple or single, with nothing folded or confused in it; of an eye, sound, doing its work. Some hold that only the word’s moral sense is warranted. Read either way, a sound eye lets light into the whole body, and an undivided one fills the whole person with light. In Luke the saying stands right after the lamp set on its stand for those who come in (verse 33), closer than in Matthew: the lamp is lit so that others may see, and the eye is the body’s own lamp (verse 34). The warning that follows, “take heed therefore that the light which is in thee be not darkness,” calls for self-scrutiny: a person has to test his own light against the Light that comes from Christ’s words and acts.

      For Latter-day Saints the phrase has a fuller form. Joseph Smith’s translation of the same saying in Matthew names what the eye is single to (see the note on [[Matt. 6:22]]), and the revelation to which the footnote here points makes the promise: “if your eye be single to my glory, your whole bodies shall be filled with light” ([[D&C 88:67]]).
    sources: [thayer, ellicott-luke, lds-scriptures]
  - ref: 38
    phrase: he had not first washed before dinner
    kind: history
    title: Not washed before the meal
    body: |
      The Pharisees washed before eating as a religious rite (see the note on [[Mark 7:3]]). Luke’s verb is *baptizō*, here in the sense “to wash oneself,” the verb Mark uses of the Pharisees, who “when they come from the market, except they wash, … eat not” ([[Mark 7:4]]).

      The others at the table had performed the ceremonial washing, and Jesus, it appears, left it undone on purpose. The omission drew at least a murmur of disapproval, and He used the moment to criticize the Pharisees’ religion of externals, which He likened to cleaning the outside of the cup and dish while the inside stays full of “ravening,” plunder (verse 39).
    sources: [talmage-jesus-christ-26, thayer, lds-scriptures]
  - ref: 41
    phrase: give alms of such things as ye have
    kind: words
    title: Clean from within
    body: |
      The Greek of verse 41 can be read several ways. “Such things as ye have” (*ta enonta*) means “what is within.” It may mean the soul, answering to “your inward part” in verse 39, and then the saying is ironic, put in the Pharisees’ own terms: as for what is within you, give alms, and all things are clean, so you think. Most interpreters take it instead as what is inside the cup and the dish, riches wrongly gained, to be given away in charity; others as “the things within your power.” Beneath the saying lies one principle: what defiles is selfishness, and what purifies is the unselfishness of love, of which alms given without seeking praise are the natural expression.

      The Joseph Smith Translation turns the saying into a condition: “But if ye would rather give alms of such things as ye have; and observe to do all things which I have commanded you, then would your inward parts be clean also.” Giving is not a rite that cleans by itself. The inside is made clean by doing all that Jesus commanded.
    sources: [thayer, ellicott-luke, lds-scriptures]
  - ref: 42
    phrase: ye tithe mint and rue and all manner of herbs
    kind: history
    title: Tithing the herbs
    body: |
      The law of the tithe went back to Moses. Read literally it required a tenth of flocks and herds, fruit and grain, but by tradition every product of the soil had been added, down to the leaves of the kitchen garden, mint and rue. Jesus does not tell the Pharisees to stop: “these ought ye to have done, and not to leave the other undone.” He approved the conscientious tithing of everything, even garden herbs; what He condemned was using such care as an excuse for neglecting “judgment and the love of God.”

      Jesus said this again in the temple in His last week, and the wording differs: Matthew has “anise and cummin” and “judgment, mercy, and faith” ([[Matt. 23:23]]; see the note there). The differences point to an independent account, words Jesus repeated rather than one saying moved from its place. This is the first of six woes in the scene, three on the Pharisees (verses 42–44) and three on the lawyers (verses 46–52).
    sources: [talmage-jesus-christ-31, ellicott-luke]
  - ref: 44
    phrase: ye are as graves which appear not
    kind: symbol
    title: Graves no one sees
    body: |
      Under the law, whoever touched a grave was unclean for seven days ([[Num. 19:16]]), and the rabbis made even the slightest contact with a grave a cause of defilement. So tombs were kept white, to stand out and keep anyone from being defiled unawares. A grave “which appear not,” its whitewash worn away, was a hazard: people walked over it and were defiled without knowing what lay beneath. That is what Jesus makes of the Pharisees: those who came near them were defiled and never knew it.

      In the temple, at the end of His ministry, Jesus used the same object the other way round: there the scribes and Pharisees are “whited sepulchres,” bright and plain to see (see the note on [[Matt. 23:27]]).
    sources: [talmage-jesus-christ-31, ellicott-luke]
  - ref: 45
    phrase: one of the lawyers
    kind: history
    title: The lawyers
    body: |
      In the New Testament a lawyer is the same as a scribe (see the note on [[Luke 7:30]]): one who by profession studied and taught the law, both the written law of the five books of Moses and “the traditions of the elders.” Their work was to develop the law in detail and apply it to their own time, and out of that work grew the oral tradition beside the written law. As a rule they were Pharisees, though some were Sadducees, and this lawyer felt that he stood or fell with them: “thou reproachest us also.” The verb is used of wronging someone by speaking evil of him; he heard the woes as an insult.

      Jesus does not take it back. His first woe on the lawyers fits their calling: they loaded others with burdens hard to bear and would not touch those burdens with one finger.
    sources: [bd-lawyer, bd-scribe, ellicott-luke, thayer]
  - ref: 48
    phrase: ye allow the deeds of your fathers
    kind: words
    title: Tombs for the prophets
    body: |
      Building tombs for the prophets sounds like honoring them, and that is the bite of the woe. The verb rendered “allow” (*syneudokeō*; the footnote gives “agree, accord with”) means to approve together with others, to be pleased along with them; it is the word rendered “have pleasure in” those who do evil in [[Rom. 1:32]]. In the King James Bible “allow” always carries that sense of approving. The fathers killed the prophets; the sons build them monuments, and Jesus counts the building itself as their witness that they share their fathers’ mind; the verses that follow say what this generation will do to the prophets and apostles still to be sent. Care for the prophets’ tombs had long been a matter of national pride, and in the temple, near the end, Jesus pressed the same charge further (see the note on [[Matt. 23:30]]).
    sources: [thayer, ellicott-luke, talmage-jesus-christ-31, lds-scriptures]
  - ref: 51
    phrase: unto the blood of Zacharias
    kind: history
    title: From Abel to Zacharias
    body: |
      Abel is the first man slain in scripture ([[Gen. 4:8]]). Zacharias is Zechariah the son of Jehoiada, stoned in the court of the house of the Lord for rebuking the people ([[2 Chr. 24:20–22]]). Chronicles stands last in the Hebrew Bible, so the line runs from the first martyr in scripture to the last. The altar of sacrifice stood just outside the sanctuary and down its steps, to the east, so “between the altar and the temple” likely points to the court where Chronicles says he died. The words Jesus introduces with “the wisdom of God” (verse 49) come from a source that is not known.

      Some Latter-day Saints have taken this Zacharias to be John the Baptist’s father. The story comes from later versions of the Protevangelium of James, a noncanonical writing of the second century, and an unsigned article in the *Times and Seasons* of September 1, 1842, repeated it; from there it entered *Teachings of the Prophet Joseph Smith*. The article is written in the third person and its style is closest to W. W. Phelps’s, and the weight of the evidence is that Joseph Smith did not write it. The evidence points instead to the Zacharias of 2 Chronicles 24, and the Bible Dictionary keeps the two men apart. Matthew’s account names him “son of Barachias”; [[Matt. 23:35]] takes up that difficulty.
    sources: [brown-testimony-luke, wilson-zacharias, bd-zacharias]
  - ref: 52
    phrase: ye have taken away the key of knowledge
    kind: scripture
    title: The key of knowledge
    body: |
      The Joseph Smith Translation names the key. After “the key of” it reads “knowledge, the fullness of the scriptures; ye enter not in yourselves into the kingdom; and those who were entering in, ye hindered.” What the lawyers had taken away was revelation, contained in the full word of God, and the charge has two parts. They rejected the revelation that would have led them into the kingdom, and they used their influence to keep others from going in. The footnote joins the verse to Zacharias’s prophecy at John’s birth, that John would “give knowledge of salvation unto his people by the remission of their sins” ([[Luke 1:77]]). That knowledge of salvation is what was being blocked.

      How they hindered others the verse does not say. One Latter-day Saint reading takes the hindering as spiritual and intellectual rather than physical: the lawyers kept the key to themselves and left the people in ignorance, holding back, perhaps, not only parts of scripture but also sacred rites they judged too holy for common people. In the Restoration such a key opens the way to heavenly knowledge: the greater priesthood “holdeth the key of the mysteries of the kingdom, even the key of the knowledge of God” ([[D&C 84:19]]).
    sources: [lds-scriptures, flinders-key-knowledge, brown-testimony-luke]

christ: |
  Luke 11 shows Jesus Christ as the stronger one who comes upon the strong man and takes from him the armor he trusted in, someone greater than Solomon and greater than Jonas, present among a generation that asked Him for a sign. He is also the Son who teaches others to pray to His Father, and who promises that the Father gives, and gives the Holy Spirit, to those who ask (verse 13). Prayer is the act by which a child’s will is brought into line with the Father’s, and the gift the Father holds out to those who keep asking is His Spirit.

explore: |
  - **The other tellings.** [[Matt. 6:9–13]] and [[3 Ne. 13:9–13]] for the prayer; [[Matt. 7:7–11]] for asking and the father’s gifts; [[Matt. 12:22–45]] and [[Mark 3:22–30]] for Beelzebub and the sign of Jonas; [[Matt. 23:1–36]] for the woes in the temple.
  - **Persistence in prayer.** [[Luke 18:1–8]], the widow who keeps coming to an unjust judge, which Luke tells later in the journey with the same lesson.
  - **Another meal with Pharisees.** [[Luke 14:1–24]], where Jesus again dines with Pharisees and lawyers and teaches them more gently.

