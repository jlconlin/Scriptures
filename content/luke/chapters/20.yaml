chapter: 20
title: The Things Which Be God’s
tagline: In the temple the rulers challenge Jesus’s authority, and He answers with the parable of the wicked husbandmen; then spies ask about tribute to Caesar, Sadducees about the resurrection, and Jesus asks how the Christ can be David’s son and David’s Lord.
when: 'In the temple at Jerusalem, “on one of those days” of teaching after the triumphal entry ([[Luke 20:1]]); in this site’s chronology, the last week of Jesus’s mortal ministry'

setting: |
  Luke 19 brought Jesus into Jerusalem. He rode down the Mount of Olives to the praise of His disciples, wept over the city, and drove the sellers out of the temple. Then He “taught daily in the temple,” while the chief priests, the scribes and the chief of the people looked for a way to destroy Him and found none, “for all the people were very attentive to hear him” ([[Luke 19:37–48]]). Chapter 20 is one of those days, an ordinary day of teaching as Luke tells it. The city and the temple were full of pilgrims come for the Passover, and they are the audience for everything that follows.

  The chapter is a series of challenges. The rulers question His authority, and He answers with a parable aimed at them. Then spies, and after them Sadducees, put questions meant to trap Him, and at the end Jesus asks a question of His own. Matthew and Mark tell the same exchanges ([[Matt. 21:23–46]]; [[Matt. 22:15–46]]; [[Mark 11:27–33]]; [[Mark 12:1–40]]). Luke has details of his own: the rulers’ fear of being stoned, the spies sent to deliver Jesus to the governor, and a fuller answer about “that world” and “the children of the resurrection” (verses 34–36). The teaching in the temple goes on into chapter 21, which opens with a poor widow casting in her two mites ([[Luke 21:1–4]]) just after Jesus has warned of scribes who devour widows’ houses.

thread: |
  **Luke 20 is a contest over authority in God’s own house, and every question put to Jesus turns back on the one who asked it.**

  The rulers open by demanding to know who gave Him authority. He answers with a question about John’s baptism that they dare not answer, and then with a parable in which tenants who never owned the vineyard kill the owner’s son to take the inheritance. The questions that follow each try to make Him choose a wrong master or a wrong world: Caesar or God; the marriages of this world, or no resurrection at all. He gives Caesar his coin and God what bears God’s image, and He tells the Sadducees that the God of Abraham is the God of the living.

  Then He asks the last question Himself. If David calls the Messiah “Lord,” the Messiah is more than David’s heir. The one whose authority they challenged is the beloved Son of the parable, the rejected stone, and David’s Lord. The chapter ends with a warning about men who use religious standing to take what belongs to widows.

sections:
  - range: 1-8
    heading: By what authority
    plain: |
      One day, while Jesus was teaching the people in the temple and preaching the gospel, the chief priests and the scribes came up to Him with the elders. “Tell us,” they said, “by what authority are you doing these things? Who gave you this authority?” He answered, “I will ask you a question too. Answer me: was John’s baptism from heaven, or from men?”

      They talked it over among themselves: “If we say, ‘From heaven,’ he will ask, ‘Then why didn’t you believe him?’ But if we say, ‘From men,’ all the people will stone us, because they are convinced that John was a prophet.” So they answered that they did not know where it came from. Jesus said to them, “Then neither will I tell you by what authority I do these things.”
  - range: 9-19
    heading: The wicked husbandmen
    plain: |
      Then He began to tell the people this parable. “A man planted a vineyard, leased it to tenant farmers, and went away to another country for a long time. At harvest time he sent a servant to the tenants to collect his share of the vineyard’s fruit, but the tenants beat him and sent him away with nothing. He sent another servant, and they beat him too, treated him shamefully and sent him away with nothing. He sent a third, and they wounded him and threw him out.

      “Then the owner of the vineyard said, ‘What shall I do? I will send my beloved son. Perhaps they will respect him.’ But when the tenants saw him, they talked it over: ‘This is the heir. Come, let’s kill him, and the inheritance will be ours.’ So they threw him out of the vineyard and killed him. What then will the owner of the vineyard do to them? He will come and destroy those tenants and give the vineyard to others.” When the people heard this, they said, “May it never be!”

      Jesus looked straight at them and said, “Then what does this scripture mean: ‘The stone the builders rejected has become the head of the corner’? Everyone who falls on that stone will be broken to pieces, and anyone it falls on will be crushed to dust.” The chief priests and the scribes wanted to seize Him that very hour, because they knew He had told this parable against them; but they were afraid of the people.
  - range: 20-26
    heading: Tribute to Cæsar
    plain: |
      So they watched Him closely and sent spies who pretended to be honest men, hoping to catch Him in something He said, so that they could hand Him over to the power and authority of the governor. They asked Him, “Teacher, we know that you speak and teach what is right. You show no favoritism, but you truly teach the way of God. Is it lawful for us to pay taxes to Caesar, or not?”

      He saw through their cunning and said to them, “Why are you testing me? Show me a denarius. Whose image and inscription does it have?” “Caesar’s,” they answered. He said to them, “Then give back to Caesar what belongs to Caesar, and to God what belongs to God.” They could not catch Him in His words in front of the people. Amazed at His answer, they fell silent.
  - range: 27-40
    heading: The Sadducees and the resurrection
    plain: |
      Then some Sadducees, who say there is no resurrection, came to Him with a question. “Teacher,” they said, “Moses wrote for us that if a man’s brother dies leaving a wife but no children, the man must marry the widow and raise up children for his brother. Now there were seven brothers. The first married and died childless. The second married her and died childless, and then the third, and so on through all seven: they left no children and died. Last of all the woman died too. So in the resurrection, whose wife will she be? All seven had her as wife.”

      Jesus said to them, “The people of this world marry and are given in marriage. But those who are counted worthy to attain that world and the resurrection from the dead neither marry nor are given in marriage. They can no longer die, for they are like the angels; and they are children of God, being children of the resurrection. And that the dead are raised, even Moses showed in the passage about the bush, where he calls the Lord ‘the God of Abraham, and the God of Isaac, and the God of Jacob.’ He is not the God of the dead but of the living, for all live to Him.”

      Some of the scribes answered, “Teacher, you have spoken well.” And after that no one dared to ask Him any more questions.
  - range: 41-44
    heading: David’s son and David’s Lord
    plain: |
      Then He said to them, “How can they say that the Christ is David’s son? David himself says in the book of Psalms, ‘The Lord said to my Lord, Sit at my right hand until I make your enemies your footstool.’ David calls Him Lord. How then is He his son?”
  - range: 45-47
    heading: Beware of the scribes
    plain: |
      With all the people listening, He said to His disciples, “Beware of the scribes. They like to walk around in long robes, and they love to be greeted in the marketplaces and to have the best seats in the synagogues and the places of honor at banquets. They devour widows’ houses, and for show they make long prayers. They will receive the greater condemnation.”

notes:
  - ref: 1
    phrase: the chief priests and the scribes came upon him with the elders
    kind: history
    title: The chief priests, the scribes and the elders
    body: |
      The three groups who confront Jesus were the main members of the Sanhedrin, the council that was both the highest Jewish court and the chief civil body under Roman rule. The chief priests included the high priest, former high priests and probably the heads of the leading priestly families; the scribes were experts in the law, important Pharisees among them; the elders represented the lay nobility. They are the same three groups Jesus named when He first foretold that He would be rejected ([[Luke 9:22]]). That they come together suggests they had met beforehand and agreed on what to do, and Luke’s verb for “came upon” means to come up suddenly and stand close, here, it seems, to interrupt Him and to intimidate Him.

      “These things” in verse 2 is most likely what He had just done in the temple, driving out those who sold there ([[Luke 19:45–46]]). The act shook the whole official circle, and the Sadducees among the priests took it as an attack on their rights.
    sources: [huntsman-monday, brown-testimony-luke, bd-sadducees]
  - ref: 4
    phrase: The baptism of John, was it from heaven, or of men?
    kind: christ
    title: A question about John that answers theirs
    body: |
      Jesus’s counter-question is not a dodge. Answering a question with a question was an accepted move in debate in His society, and Luke has shown Him doing it before ([[Luke 10:25–26]]). More important, John’s authority and His own stand or fall together. John was the forerunner who promised “one mightier than I” ([[Luke 3:16]]). If John’s baptism came from heaven, so did the authority of the one John announced; if it was “of men,” so is Jesus’s.

      The rulers’ huddle in verse 5 admits that they had not believed John. Rather than say so, or deny in public a prophet the people revered, they say they cannot tell. Jesus then refuses to answer them, in the very words of their question. But He does not leave it there. The parable that follows answers it before the whole crowd, and shows the questioners to be no rightful heirs of God’s authority.
    sources: [brown-testimony-luke]
  - ref: 6
    phrase: all the people will stone us
    kind: history
    title: All the people will stone us
    body: |
      Matthew and Mark say only that the rulers feared the people ([[Matt. 21:26]]; [[Mark 11:32]]); Luke gives the fear its vivid form. It was not an idle fear. Crowds in Jerusalem took up stones against Jesus Himself ([[John 8:59]]; [[John 10:31]]) and later stoned Stephen ([[Acts 7:58–59]]). John’s standing as a prophet had spread far beyond the Jordan, perhaps the more since his death as a martyr. Whether “all the people” means the city’s residents or the pilgrims at the feast, Luke does not say; either way, the rulers did not dare to deny John in their hearing.
    sources: [ellicott-luke, brown-testimony-luke]
  - ref: 9
    phrase: A certain man planted a vineyard, and let it forth to husbandmen
    kind: symbol
    title: The vineyard and its tenants
    body: |
      In the Old Testament the vineyard stands for the house of Israel, and the parable as Mark tells it, with its hedge, winepress and tower ([[Mark 12:1]]), recalls the song of the Lord’s vineyard in [[Isa. 5:1–7]]. Luke keeps only the planting. The figures are not hard to read: the owner is God, the servants He sends for His share of the harvest are the prophets, the beloved son is Jesus, and the tenants, who do not own the vineyard but are only responsible for its care, are the leaders of Israel, down to the very leaders now standing in front of Him.

      “Husbandmen” means farmers (the footnote), here tenants working someone else’s vines. The arrangement was familiar. Owners who lived far away often left their estates in the hands of local tenants, who could come to resent them. “Let it forth” is the language of a formal lease, with a share of the harvest due to the owner, so tenants who send the owner’s servants away empty are breaking an agreement, not just being rude.
    sources: [huntsman-monday, brown-testimony-luke, lds-scriptures]
  - ref: 13
    phrase: 'I will send my beloved son: it may be they will reverence him'
    kind: christ
    title: My beloved son
    body: |
      With the son, the parable stops being only about Israel’s past. “Beloved” is the word the Father spoke from heaven at Jesus’s baptism, “Thou art my beloved Son” ([[Luke 3:22]]), and here Jesus tells the story of His own death, days before it comes. The tenants’ reasoning, kill the heir and the inheritance is ours, implies that he is an only son.

      The owner’s “it may be they will reverence him” reads best as patience rather than doubt: after three servants beaten, shamed and wounded, He still hopes for the tenants and sends the one dearest to Him. And the order in verse 15, “they cast him out of the vineyard, and killed him,” points to where Jesus would die: outside the city, where the law required an execution to take place ([[Lev. 24:14]]; [[Heb. 13:12]]).
    sources: [brown-testimony-luke]
  - ref: 16
    phrase: God forbid
    kind: words
    title: God forbid
    body: |
      “God forbid” renders a Greek wish, *mē genoito*, “may it not be” (the footnote). Who said it? Possibly the people Jesus was teaching (verse 9), who grasped that the sentence on the tenants meant terrible consequences for someone and hoped it would not come. Probably the chief priests and scribes as well, since they “perceived that he had spoken this parable against them” (verse 19).

      Either way, the parable’s meaning was not hidden from them. Earlier Jesus told parables whose meaning was hidden from many ([[Luke 8:10]]); in these last days in the temple His words are pointed and plain, as if to shake His hearers awake while there is still time.
    sources: [brown-testimony-luke, lds-scriptures]
  - ref: 17
    phrase: The stone which the builders rejected, the same is become the head of the corner
    kind: christ
    title: The rejected stone
    body: |
      Jesus turns from the parable to [[Ps. 118:22]]. It was a pointed choice: days before, the crowd had hailed Him with a line of the same psalm, “Blessed be the King that cometh in the name of the Lord” ([[Luke 19:38]]; [[Ps. 118:26]]). Now He quotes the verse of that psalm that speaks of rejection. In the Joseph Smith Translation of Matthew’s account He says outright what the rulers understood: “I am the stone, and those wicked ones reject me” (JST Matt. 21:51). What the head of the corner is, and how Peter later applied the verse, are in the notes on [[Ps. 118:22]] and [[Ps. 118:23]].

      Jacob in the Book of Mormon read the stone the same way, as Christ, who is either a sure foundation or a stumbling block ([[Jacob 4:15–17]]). Those are the two outcomes Jesus names in the next verse.
    sources: [huntsman-monday, jst-matt-21, sc-knowhy-535]
  - ref: 18
    phrase: it will grind him to powder
    kind: words
    title: Broken, or ground to powder
    body: |
      The verse sets two fates side by side. One man falls on the stone and is broken; on another the stone falls and grinds him to powder. The second verb comes from the winnowing basket: it means first to winnow, to toss grain so that the wind carries off the chaff. The footnote takes it here in that sense, “scatter like chaff”; “to crush to pieces, grind to powder” is the King James sense and a standard rendering of this verse, though many interpreters refer it to scattering instead. On either sense the second fate is the worse: what is scattered or ground to dust cannot be put back together.

      The difference between the two may matter. A man who stumbles against the stone is hurt by his own fall, and the stone, Christ, stays where it is. One Latter-day Saint reading sees hope in that: what is broken can be reshaped, as a person can come to “a broken heart and a contrite spirit” ([[3 Ne. 9:20]]), while what is ground to powder cannot be rebuilt. It is a reading the two clauses allow, not one the verse spells out.
    sources: [lds-scriptures, thayer, strongs-greek, brown-testimony-luke]
  - ref: 20
    phrase: deliver him unto the power and authority of the governor
    kind: history
    title: To the power of the governor
    body: |
      Luke says plainly where the plot was going. The spies carried a commission from the rulers, secret but official, to pose as sincere inquirers. The aim was a charge that would make Pontius Pilate, the Roman prefect, put Jesus to death: a capital case, not a matter for prison. This is the first time Luke mentions “the governor.” A question about Roman taxes suited the plan, since an answer against the tribute could be reported to Rome.

      The spies failed (verse 26), but the rulers made the charge anyway. Before Pilate they accused Him of “forbidding to give tribute to Cæsar” ([[Luke 23:2]]), though His answer in verse 25 had told them to give Caesar his due. His opponents could find no fault in His reply, and still the rulers brought Him to His death.
    sources: [brown-testimony-luke, huntsman-tuesday]
  - ref: 24
    phrase: Whose image and superscription hath it?
    kind: history
    title: Caesar’s image on the coin
    body: |
      The “penny” is a denarius, the Roman coin that was a laborer’s usual pay for a day. The question was a real trap. Of all the signs of subjection to Rome, the tax paid to the emperor was the one Jews most resented. To say it was lawful was to look disloyal to God and to the nation; to say it was not was to preach resistance to Rome. The coin made it sharper still. The denarius of the day bore the head of the emperor Tiberius and the inscription “Tiberius Caesar Augustus, son of the deified Augustus, high priest,” which offended Jewish feeling about graven images and claimed for Rome’s ruler a divine and priestly standing that Jews would not grant.

      By asking them to produce the coin, Jesus made His questioners show that they carried and used Caesar’s money. Among the Jews, to put a ruler’s coins into circulation was to acknowledge his authority, so the nation, rulers and people, had already answered the question, however grudgingly.
    sources: [brown-testimony-luke, talmage-jesus-christ-31, huntsman-tuesday]
  - ref: 25
    phrase: Render therefore unto Cæsar the things which be Cæsar’s, and unto God the things which be God’s
    kind: scripture
    title: Render unto Cæsar, and unto God
    body: |
      “Render” means to give back, to pay what is due. The emperor minted the coin and in a sense still owned it, so returning it to him in tax was no betrayal of God; and the greater debt is owed to God, to whom everything created belongs. The image on the coin carries the lesson further: “Every human soul is stamped with the image and superscription of God,” and as Caesar’s coins go to Caesar, “so unto God should be given the souls that bear His image.”

      The Lord has used the same words in this dispensation. When He told the Saints to purchase the land of Zion, He said, “I, the Lord, render unto Cæsar the things which are Cæsar’s” ([[D&C 63:26–27]]); and He told them to “be subject to the powers that be, until he reigns whose right it is to reign” ([[D&C 58:22]]).
    sources: [huntsman-tuesday, brown-testimony-luke, talmage-jesus-christ-31, lds-scriptures]
  - ref: 27
    phrase: certain of the Sadducees, which deny that there is any resurrection
    kind: history
    title: The Sadducees’ riddle
    body: |
      This is the only time the Sadducees appear in Luke’s Gospel. They were a small, powerful party of the old high-priestly families, the Jewish aristocracy. They held to the letter of the law of Moses, rejected the authority of tradition, and did not accept the doctrine of immortality. They received only the five books of Moses as scripture, which is why their question begins “Moses wrote unto us.”

      The law they cite is levirate marriage, from the Latin *levir*, a husband’s brother ([[Deut. 25:5–10]]). When a man died childless, his brother was to take the widow and father a child who would count as the dead man’s, so that he would not lose his heir and his inheritance in Israel. The arrangement was temporary: the child belonged to the dead brother, and the living brother had no further claim on the widow. Seven brothers in a row makes the case absurd on purpose. The riddle is not really about marriage. It is meant to make the resurrection look ridiculous.
    sources: [brown-testimony-luke, bd-sadducees, huntsman-tuesday]
  - ref: 35
    phrase: accounted worthy to obtain that world
    kind: scripture
    title: Worthy to obtain that world
    body: |
      Luke alone gives this part of Jesus’s answer, and it raises the question a Latter-day Saint reader asks first: does Jesus deny that marriage lasts beyond death? His words draw a line between two groups. “The children of this world” marry and are given in marriage (verse 34); those “accounted worthy to obtain that world” do not. Marrying is something done in this world. Many scholars take the verse to mean that marriage does not last into the next life. The Latter-day Saint reading is narrower: the verse says that no marriages are made in the next world, not that no marriage exists there. The Sadducees themselves seem to have known a teaching that marriage continues after death, and built their riddle to mock it.

      On this reading the resurrection one must be “accounted worthy” of is a particular one. Everyone will be resurrected, so the worthiness points to the resurrection of the just. The Joseph Smith Translation supports that reading, since it makes the resurrection the way into the world one is counted worthy of: “accounted worthy to obtain that world, through resurrection from the dead” (JST Luke 20:35, in the footnote). Beyond that small change it leaves the passage as it is, and Jesus’s answer here is aimed at the resurrection, not at whether marriage is eternal. The Lord takes up that question in modern revelation (see the next note). What the verse does show is that marriage, eternal marriage above all, is an ordinance performed on earth: in temples for the living, and there on behalf of those who died without it.
    sources: [brown-testimony-luke, lds-scriptures]
  - ref: 36
    phrase: equal unto the angels
    kind: words
    title: Equal unto the angels, and children of God
    body: |
      Jesus gives two descriptions of those raised from the dead, and they are not the same. They are “equal unto the angels” in one respect: “Neither can they die any more.” But they are also something more: they “are the children of God, being the children of the resurrection.” An angel is a messenger, an agent sent on an errand; a child is an heir, and in law the two are never on the same footing. The Sadducees’ riddle turned on heirs and inheritance, and Jesus answers that those raised in the resurrection of the just are God’s own children, His heirs.

      In modern revelation the Lord answers the Sadducees’ riddle more fully, and He keeps the same line between servant and heir. Those whose marriages were not made by His word “are appointed angels in heaven, which angels are ministering servants,” and because they “did not abide my law,” they “remain separately and singly, without exaltation, in their saved condition, to all eternity” ([[D&C 132:16–17]]). They are raised and saved, and never die again, but they are the messengers of Jesus’s contrast, not the heirs.
    sources: [brown-testimony-luke, lds-scriptures]
  - ref: 37
    phrase: even Moses shewed at the bush
    kind: scripture
    title: The God of the living
    body: |
      The Sadducees appealed to Moses, so Jesus answers from Moses, the only part of scripture they accepted ([[Ex. 3:6]]). The argument rests on the name the Lord gave Himself at the bush. Long after Abraham, Isaac and Jacob had died, He still called Himself their God. The Sadducees honored that name and yet denied that the patriarchs would rise, as if the title held only for the years the patriarchs lived on earth. But a God of the living is not the God of men who have ceased to be. The patriarchs lived on in the world of spirits, and through Jesus’s own resurrection, days away, they would rise from death too.

      Luke alone adds “for all live unto him.” In bodily death the spirit still lives. The phrase may also carry more: “the living” can mean those who have God’s own life, eternal life, and not bare existence alone. Luke uses the same word of the risen Jesus, when the angels at the tomb ask, “Why seek ye the living among the dead?” ([[Luke 24:5]]); in Him that life would be shown in full.
    sources: [brown-testimony-luke, talmage-jesus-christ-31, huntsman-tuesday]
  - ref: 39
    phrase: Master, thou hast well said
    kind: history
    title: Master, thou hast well said
    body: |
      The scribes who praise this answer are not the ones who asked the question. The scribes, the experts in the law, included important Pharisees, and the Pharisees, unlike the Sadducees, believed in the resurrection of the body and in angels and spirits. Jesus had just defended their belief, and from the books of Moses that the Sadducees themselves accepted. Some of these scribes may have been genuinely open to Him; others may simply have been amazed at an answer that had escaped them. Either way, the questioning ends here: after this “they durst not ask him any question at all” (verse 40).
    sources: [huntsman-monday, bd-pharisees, brown-testimony-luke]
  - ref: 41
    phrase: How say they that Christ is David’s son?
    kind: christ
    title: David’s son and David’s Lord
    body: |
      Now Jesus asks the question. The common hope of the day was that the Messiah would be a son of David, a king of David’s line who would redeem Israel and restore its greatness. Jesus does not deny that, and Luke has already said He is David’s heir ([[Luke 1:32]]). But in [[Ps. 110:1]] David calls the Messiah “my Lord.” The puzzle opens if it is turned around: if the Messiah is David’s Lord, how is He also David’s son? Read this way, David understood that the Messiah was more than his descendant. He was already God’s chosen, seated at His right hand, long before His birth in the flesh. He is both, David’s son by birth and David’s Lord before David lived. The note on the psalm explains the two Hebrew words behind “The LORD said unto my Lord” ([[Ps. 110:1]]).
    sources: [huntsman-tuesday, brown-testimony-luke]
  - ref: 47
    phrase: devour widows’ houses
    kind: history
    title: Devouring widows’ houses
    body: |
      Most of what Jesus says about the scribes concerns show: the long robes, the greetings in the marketplace, the best seats in the synagogue and at banquets, the long prayers. This charge is worse, the only one here that is more than hypocrisy. Jesus does not say how the scribes devoured widows’ houses, and no one knows exactly. The law treated a family’s land as an inheritance from God, not to be bought up for gain, and the prophets had long condemned those who preyed on widows ([[Isa. 10:2]]).

      The next thing Luke tells is a poor widow giving all she had to the temple treasury ([[Luke 21:1–4]]), a woman whom the temple’s leaders should have been supporting.
    sources: [brown-testimony-luke, huntsman-tuesday]

christ: |
  Luke 20 shows Jesus as the one the rulers could not place: the beloved Son and heir whom the tenants kill ([[Luke 20:13–15]]), the stone the builders rejected that becomes the head of the corner ([[Luke 20:17]]), and David’s Lord ([[Luke 20:44]]). He tells the Sadducees that God is “not a God of the dead, but of the living” ([[Luke 20:38]]), and within days His own resurrection would overcome death for the patriarchs and for all.

  His answer about the tribute still holds for His disciples. They keep the laws of the land ([[D&C 58:21]]), and they give to God what bears His image, which is themselves.

explore: |
  - **The other tellings.** [[Matt. 21:23–46]] and [[Matt. 22:15–46]] set these exchanges among more parables; [[Mark 11:27–33]] and [[Mark 12:1–40]] tell them in Mark’s words.
  - **The psalms Jesus quoted.** The notes on [[Ps. 118:22–23]], the rejected stone, and on [[Ps. 110:1]], David’s Lord.
  - **Marriage and the resurrection.** The Lord answers the Sadducees’ question more fully in modern revelation: [[D&C 132:15–20]], with [[D&C 131:1–4]].
  - **The widow who comes next.** [[Luke 21:1–4]], right after the warning about widows’ houses.

