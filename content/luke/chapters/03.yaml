chapter: 3
title: The Word of God Came unto John
tagline: In a year Luke dates by emperor, governor and high priests, John prepares the Lord's way; Jesus is baptized and prays, the Father names His Son, and Luke traces Him back to Adam and to God.
when: 'The fifteenth year of Tiberius Caesar, which falls somewhere between about AD 27 and 29 ([[Luke 3:1]])'

setting: |
  Luke last showed John as a child who “was in the deserts till the day of his shewing unto Israel” ([[Luke 1:80]]), and Jesus as a boy of twelve in the temple ([[Luke 2:41–52]]). Chapter 3 is the day of John's showing.

  All four of the chapter's stories are told in other Gospels too: John's preaching, his imprisonment, the baptism of Jesus, and a genealogy (Matthew's is in [[Matt. 1:1–17]]). Luke's account has its own material in each. Only Luke dates the preaching by the rulers of the day, gives John's counsel to the crowds, the publicans and the soldiers (verses 10–14), tells of his imprisonment before the baptism, says that Jesus was praying, and sets the genealogy here, after the baptism, running upward to Adam.

  In Luke, John's ministry is more than a prelude to Jesus's. Jesus later looks back on it as the end of an era: “The law and the prophets were until John” ([[Luke 16:16]]; compare [[Luke 7:24–28]]). The Joseph Smith Translation of this chapter is long at verses 4–6 and 13, and adds smaller changes through the genealogy; the notes take them up where they answer a question.

thread: |
  The chapter begins with the powerful and ends with Adam. Its first verse names an emperor, a governor, three tetrarchs and two high priests, and then says that **the word of God came** to none of them but to John in the wilderness. Its last verse traces Jesus back past David and Abraham to “Adam, which was the son of God.” Between those two verses Luke places John and Jesus in public history, under rulers who can be named, and Jesus in the human family, by a line of descent.

  John's work is to prepare a way, and Luke quotes Isaiah far enough to say for whom: “all flesh shall see the salvation of God” (verses 4–6). The preparation is practical. Descent from Abraham will not do; fruit will (verses 7–9). And when the crowds, the tax collectors and the soldiers ask what they should do, the answers are about coats, food, ledgers and the abuse of power (verses 10–14). Then John points past himself to the One who will baptize with the Holy Ghost and with fire (verses 15–17), and Luke closes John's story with the prison (verses 19–20).

  The scene that follows belongs to Jesus. He is baptized among “all the people,” and while He prays the heaven opens, the Holy Ghost comes upon Him, and the Father speaks to Him: “Thou art my beloved Son” (verses 21–22). The genealogy then reinforces the voice. It begins with the Son “as was supposed” of Joseph and ends with the son of God, so that the One the Father has just named stands among all of Adam's children.

sections:
  - range: 1-6
    heading: The word of God comes to John
    plain: |
      In the fifteenth year of the emperor Tiberius, when Pontius Pilate governed Judea, Herod was tetrarch of Galilee, his brother Philip was tetrarch of Iturea and Trachonitis, and Lysanias was tetrarch of Abilene, and when Annas and Caiaphas were the high priests, the word of God came to John, the son of Zacharias, in the wilderness. He went through all the country along the Jordan, preaching baptism of repentance for the forgiveness of sins. This was what is written in the book of the prophet Isaiah: “A voice is calling out in the wilderness: Prepare the way of the Lord, make His paths straight. Every valley will be filled in, every mountain and hill made low; the crooked roads will be made straight and the rough ones smooth; and all people will see God's salvation.”
  - range: 7-14
    heading: Fruits worthy of repentance
    plain: |
      To the crowds who came out to be baptized John said: “You brood of snakes! Who warned you to run from the judgment that is coming? Then show by what you do that you have repented. Don't start telling yourselves, ‘Abraham is our father.’ I tell you, God can raise up children for Abraham out of these stones. The axe is already at the root of the trees; every tree that does not bear good fruit is cut down and thrown into the fire.”

      The people asked him, “Then what should we do?” He answered, “Whoever has two coats should share with the one who has none, and whoever has food should do the same.” Publicans also came to be baptized and asked, “Teacher, what should we do?” He told them, “Collect no more than you have been ordered to.” Soldiers asked him too, “And what about us?” He told them, “Do no violence to anyone, and don't extort money by false accusations; be content with your pay.”
  - range: 15-18
    heading: One mightier than I
    plain: |
      The people were waiting expectantly, and everyone was wondering whether John might be the Christ. John answered them all: “I baptize you with water, but One more powerful than I is coming, whose sandal strap I am not worthy to untie. He will baptize you with the Holy Ghost and with fire. His winnowing fork is in His hand to clear His threshing floor; He will gather the wheat into His barn, but the chaff He will burn with a fire that never goes out.” With many other appeals like these he preached the good news to the people.
  - range: 19-20
    heading: John shut up in prison
    plain: |
      But when John rebuked Herod the tetrarch over Herodias, his brother Philip's wife, and over all the other evil things Herod had done, Herod added this to all the rest: he locked John up in prison.
  - range: 21-22
    heading: The baptism of Jesus
    plain: |
      When all the people were being baptized, Jesus was baptized too. As He was praying, heaven opened, and the Holy Ghost came down upon Him in bodily form, like a dove. And a voice came from heaven: “You are my beloved Son; I am well pleased with You.”
  - range: 23-38
    heading: The son of Adam, the son of God
    plain: |
      Jesus was about thirty years old when He began His work. He was the son, as people supposed, of Joseph, the son of Heli. The line runs back from there through Zorobabel and Salathiel to Nathan, a son of David; through David, Jesse, Boaz and Judah to Jacob, Isaac and Abraham; and on through Shem, Noah, Methuselah, Enoch and Seth to Adam, who was the son of God.

notes:
  - ref: 1
    phrase: in the fifteenth year of the reign of Tiberius Cæsar
    kind: history
    title: Why Luke dates the call by emperor and tetrarchs
    body: |
      Luke opens the main story as the historians of his day opened theirs, by naming the rulers of every region the events would touch, from the emperor down to the high priests. Tiberius succeeded Augustus in AD 14, which puts his fifteenth year at about AD 29; but his reign can also be counted from AD 11, when he began to rule jointly with Augustus, and with the ways of reckoning in doubt the year can be given only as about AD 27–29.

      The names map the land. Pilate was the Roman prefect of Judea from AD 26 to 36. Two of the three tetrarchs ruled pieces of the kingdom of Herod the Great, divided among his sons at his death: “Herod” here is Antipas, who had Galilee and Perea and is the Herod of the rest of Luke ([[Luke 9:7]]; [[Luke 23:7–12]]); his half-brother Philip had the northeast. Judea had been the share of a third son, Archelaus, until Augustus deposed him; since then it had been governed by a Roman prefect under the province of Syria, which is why Luke names a Roman governor for it. The high priests come last (verse 2).

      Luke has done this before, with Zacharias “in the days of Herod” and the birth in the days of Caesar Augustus ([[Luke 1:5]]; [[Luke 2:1–2]]). The habit sets the gospel in public history: what follows happened under named rulers, in a year that can be counted.
    sources: [ellicott-luke, bd-pilate, bd-herod, brown-testimony-luke]
  - ref: 2
    phrase: the word of God came unto John the son of Zacharias in the wilderness
    kind: prophets
    title: The word came to John, not to the high priests
    body: |
      After seven powerful names, the word of God comes to none of them. It comes to a priest's son in the wilderness, and setting the high priests beside that notice seems purposeful: God's message goes not to the religious authorities in Jerusalem but far away, to the son of an obscure priest.

      “Annas and Caiaphas being the high priests” is itself a sign of the times. Only one man could serve as high priest at a time, but Herod, his son Archelaus and then the Roman governors appointed and deposed them regularly, and a deposed high priest kept his influence and could still be called “high priest” as a courtesy. Annas held the office from AD 6 to 15; Caiaphas, his son-in-law ([[John 18:13]]), held it from AD 18 to 36. Luke's phrase names the man in office beside his father-in-law, who had lost the office but not his influence.

      Restoration scripture explains why the word passed them by. John came to this ministry already ordained for it, at eight days old ([[D&C 84:28]]; see the note on [[Luke 1:59]]). Joseph Smith taught that John, not the priests of the temple, “was the only legal administrator in the affairs of the kingdom there was then on the earth, and holding the keys of power,” and that “the son of Zacharias wrested the keys, the kingdom, the power, the glory from the Jews, by the holy anointing and decree of heaven.” On his reading, the authority the high priests' office stood for had passed to the man in the wilderness.
    sources: [brown-testimony-luke, lds-scriptures, tpjs-2007-ch-6]
  - ref: 6
    phrase: And all flesh shall see the salvation of God
    kind: scripture
    title: All flesh shall see the salvation of God
    body: |
      Matthew and Mark quote only the first verse of [[Isa. 40:3–5]], the voice in the wilderness. Luke goes on two more verses, to the leveled road and its end: “all flesh shall see the salvation of God.” The image is of pioneers leveling a road for the march of a great king, and Luke's fuller quotation suggests that he saw the Baptist's whole ministry in it: the valleys were filled when penitent people were assured of pardon, the hills brought low when pride was rebuked, the crooked made straight when publicans learned to be honest (verses 10–14). The last line suits a Gospel generally thought to be written by a Greek for a largely Gentile audience, and marked throughout by the import of Jesus's work for all peoples.

      The Joseph Smith Translation makes that line the point of the passage. Between the voice and the leveled valleys it inserts five verses (JST Luke 3:4–11): He would come “to take away the sins of the world, and to bring salvation unto the heathen nations, to gather together those who are lost, who are of the sheepfold of Israel,” to “make possible the preaching of the gospel unto the Gentiles,” to bring to pass the resurrection and ascend on high, and at the last to judge. Isaiah's leveled landscape then becomes the sign of the day He comes in judgment: “For it is a day of power; yea, every valley shall be filled.” The insertion bridges the first and second comings of Christ, and it lays the foundation for a gospel that will reach those outside the house of Israel.
    sources: [ellicott-luke, huntsman-lukes-jesus, jst-luke-3, millet-jst-synoptic]
  - ref: 8
    phrase: We have Abraham to our father
    kind: history
    title: We have Abraham to our father
    body: |
      In Matthew, John aims his “generation of vipers” at Pharisees and Sadducees ([[Matt. 3:7]]); in Luke he says it to the whole multitude that came out to be baptized. What he attacks is a confidence that seems to have been common (compare [[John 8:33–39]]): that descent from Abraham, alone or with the confession of Israel's creed, was enough to bring every Jew into paradise.

      The Joseph Smith Translation spells the boast out: “Abraham is our father; we have kept the commandments of God, and none can inherit the promises but the children of Abraham” (JST Luke 3:13). The boast joins birth, obedience and an exclusive right to the promises. John's answer is fruit: God can make children for Abraham out of the stones at their feet, and the axe is already at the root (verse 9). He was rebuking those who “attempted to use lineage as a substitute for righteousness.”

      The same translation of Matthew's account names the boast John forbids: “think not to say within yourselves, We are the children of Abraham, and we only have power to bring seed unto our father Abraham” (JST Matthew 3:36). The stones answer it: God “can make covenant people of those not of Israel.”
    sources: [ellicott-matthew, lds-scriptures, bd-genealogy, jst-matt-3]
  - ref: 10
    phrase: What shall we do then?
    kind: history
    title: What shall we do then?
    body: |
      Only Luke records these questions and John's answers, and they show that his work was more than a call to repent: confession of sins was followed by guidance for the conscience. The answers are strikingly ordinary. The “fruits worthy of repentance” (verse 8) are a second coat given away and food of any kind shared. The answers treat selfishness as the root of the trouble, to be overcome not by religious feeling alone but by acts of unselfishness. King Benjamin asks the same of his people, that they “will administer of your substance unto him that standeth in need” ([[Mosiah 4:16]]), and the Lord warns anyone who will “impart not his portion … unto the poor and the needy” ([[D&C 104:18]]).

      The publicans make the point sharper. They bought the right to collect taxes or did the collecting, and they were so detested that a Jew who took up the work was excommunicated; many in Galilee worked for Herod rather than for Rome. Under that system the besetting temptation of every collector was to take more than was due, and that is exactly what John forbids (verse 13). He does not tell the publicans to quit, and the soldiers get the same kind of answer (verse 14): each is told how to do the work honestly, not to leave it. Publicans kept coming, to John and then to Jesus ([[Luke 7:29]]; [[Luke 15:1]]; [[Luke 19:2–8]]), and the New Testament often remarks how readily they received the gospel.
    sources: [ellicott-luke, lds-scriptures, bd-publicans]
  - ref: 13
    phrase: Exact no more than that which is appointed you
    kind: scripture
    title: The publicans and the treasury
    body: |
      The Joseph Smith Translation adds two verses before John's answer to the publicans, addressed to Theophilus, for whom Luke wrote: “For it is well known unto you, Theophilus, that after the manner of the Jews, and according to the custom of their law in receiving money into the treasury, that out of the abundance which was received, was appointed unto the poor, every man his portion.” Then: “And after this manner did the publicans also, wherefore John said unto them, Exact no more than that which is appointed you” (JST Luke 3:19–20).

      The addition is an explanation of Jewish custom, of the kind a Gentile reader like Theophilus ([[Luke 1:3]]) might need, and it gives “that which is appointed” a setting. In the treasury, out of what came in, a portion was “appointed” to each of the poor; “after this manner,” the added verse says, the publicans also worked by an appointed amount. The same word, “appointed,” sets each poor man's share and the publicans' tax: they were to take what the law appointed, and no more.
    sources: [jst-luke-3, millet-jst-synoptic]
  - ref: 14
    phrase: Do violence to no man, neither accuse any falsely
    kind: words
    title: The soldiers’ temptations
    body: |
      Luke does not say whose soldiers these were. The Greek does not say “the soldiers,” as of a known garrison, but describes them with a verb form, men on military service, which may picture troops passing by on campaign; they were probably not Romans, who were unlikely to come to John's preaching, and may have been troops of Herod Antipas. John tells them three things.

      The first two commands are about money more than about brutality. The word behind “do violence” was used of the violence irregular troops used to extort money or provisions. The word behind “accuse … falsely” means, in this verse, “to exact money wrongfully; to extort from, defraud” (the footnote gives “for extortion”), and it returns in Zacchaeus's promise to restore what he had taken “by false accusation” ([[Luke 19:8]]). Together the two forbid shaking people down, by threat or by trumped-up charges. The third command is about their pay. The word for “wages” meant properly the part of a soldier's support given as rations, and then the money paid in their place; John tells them to be content with it.
    sources: [ellicott-luke, thayer, lds-scriptures]
  - ref: 16
    phrase: he shall baptize you with the Holy Ghost and with fire
    kind: prophets
    title: Water, and the Holy Ghost and fire
    body: |
      John sets his baptism with water below the baptism “with the Holy Ghost and with fire” that the One coming after him will give. He says it because people were wondering whether he was the Christ (verse 15). In John's Gospel he says it outright to the delegation from Jerusalem: “I am not the Christ” ([[John 1:19–20]]).

      The two baptisms are not rivals but two halves of one. Joseph Smith taught: “The baptism of water, without the baptism of fire and the Holy Ghost attending it, is of no use; they are necessarily and inseparably connected.” Nephi names what the fire does: after repentance and baptism by water “then cometh a remission of your sins by fire and by the Holy Ghost” ([[2 Ne. 31:17]]). John gave the first; the second, he said, would come from the mightier One.
    sources: [tpjs-2007-ch-7, lds-scriptures]
  - ref: 20
    phrase: he shut up John in prison
    kind: history
    title: John in prison before the baptism
    body: |
      Luke finishes John's story before he tells Jesus's baptism, so that a reader meets John in prison in verse 20, just before Jesus is baptized in verse 21. The arrangement is deliberate: Luke chose to complete the account of John's ministry here rather than bring the imprisonment in later as an episode. It is probably not the order of events. In Matthew and Mark the imprisonment comes some time after the baptism ([[Matt. 14:3–12]]; [[Mark 6:17–29]]), and on this point the logic of the story favors their order. Mark also gives the reason in full: Herod Antipas had taken Herodias, the wife of his half-brother Philip, and John told him, “It is not lawful for thee to have thy brother’s wife” ([[Mark 6:18]]). Luke adds that John reproved him “for all the evils which Herod had done” (verse 19).

      With John's story closed first, Luke does not even say that John baptized Jesus, though he implies it; verse 21 says only that Jesus was “baptized,” in the passive. The Joseph Smith Translation supplies the link Luke leaves unstated: “Jesus also came unto John: and being baptized of him” (JST Luke 3:28).
    sources: [ellicott-luke, strathearn-gospels, bd-herod, brown-testimony-luke]
  - ref: 21
    phrase: and praying, the heaven was opened
    kind: christ
    title: Praying, the heaven was opened
    body: |
      Luke sets two details beside the opening of heaven. Jesus is baptized when “all the people” are: He does not stand apart from them but takes on what is required of everyone. Nephi gave the reason: “notwithstanding he being holy, he showeth unto the children of men that, according to the flesh he humbleth himself before the Father,” and so set “the example” for all who would enter by the same gate ([[2 Ne. 31:7–9]]).

      And He is praying. Luke's account of the baptism is the shortest of the three, yet only Luke adds that Jesus was praying when the Father bore witness to His Sonship, and he adds the same at the Transfiguration, where the voice from the cloud again names the Son after He has gone up to pray ([[Luke 9:28–29]]; [[Luke 9:35]]). In Luke, both times heaven declares who Jesus is, He is at prayer.
    sources: [ellicott-luke, lds-scriptures]
  - ref: 22
    phrase: the Holy Ghost descended in a bodily shape like a dove upon him
    kind: prophets
    title: In a bodily shape like a dove
    body: |
      Only Luke says “in a bodily shape,” and the phrase raises a question: did the Holy Ghost become a bird? Joseph Smith answered it directly. “The Holy Ghost is a personage, and is in the form of a personage.” He “cannot be transformed into a dove; but the sign of a dove was given to John to signify the truth of the deed.” The sign, he taught, “was instituted before the creation of the world, a witness for the Holy Ghost, and the devil cannot come in the sign of a dove.”

      Luke's “bodily shape,” then, describes what was seen, not a change in the Holy Ghost: the dove was the sign, given because it “is an emblem or token of truth and innocence.” Nephi, six centuries earlier, had seen this very scene in vision and described it twice in the same terms: “the Holy Ghost come down out of heaven and abide upon him in the form of a dove” ([[1 Ne. 11:27]]; [[2 Ne. 31:8]]).
    sources: [tpjs-2007-ch-6, brown-testimony-luke]
  - ref: 22
    phrase: Thou art my beloved Son; in thee I am well pleased
    kind: christ
    title: Thou art my beloved Son
    body: |
      In Luke, as in Mark, the Father speaks to Jesus: “Thou art my beloved Son.” Matthew has “This is my beloved Son” ([[Matt. 3:17]]). Matthew's form seems meant for all present; Luke's is addressed to the Son Himself. “Beloved” of a son means “only,” and the Father uses the title when He introduces His Son on special occasions: on the mount of transfiguration, to the Nephites and to Joseph Smith ([[Luke 9:35]]; [[3 Ne. 11:7]]; [[JS—H 1:17]]).

      Some manuscripts read instead, “Thou art my Son; this day have I begotten thee,” the words of [[Ps. 2:7]], the psalm of the king God sets on Zion. The change was likely made by scribes who matched Luke to the psalm, and it suggests that ancient readers heard the royal psalm in the Father's words. That opens the possibility that the declaration carries two meanings: Jesus is the literal Only Begotten of the Father, as Luke has already told ([[Luke 1:35]]), and He is the true King of Israel.
    sources: [brown-testimony-luke, sc-knowhy-865]
  - ref: 23
    phrase: began to be about thirty years of age
    kind: history
    title: About thirty years of age
    body: |
      This verse is the only place any Gospel gives Jesus's age when His ministry began, and Luke's “about” leaves the number approximate. Thirty had a meaning in the law. It was the age at which the Levites entered on their full work at the tabernacle ([[Num. 4:3]], the footnote's cross-reference), after a period of probation that began at twenty-five ([[Num. 8:24]]). No age was fixed for a priest or a prophet to begin, but thirty seems to have been taken as the age of full manhood, and it has been read as a sign that Jesus waited in patient humility until He reached it before beginning His public work.

      The Joseph Smith Translation adds a phrase after “thirty years of age”: “having lived with his father” (JST Luke 3:30). That implies that Joseph lived to see the beginning of Jesus's public ministry.
    sources: [ellicott-luke, lds-scriptures, brown-testimony-luke]
  - ref: 23
    phrase: '(as was supposed) the son of Joseph, which was the son of Heli'
    kind: history
    title: As was supposed, and the son of Heli
    body: |
      Luke writes “as was supposed” because he has already told how Jesus was conceived ([[Luke 1:34–35]]): Jesus was not Joseph's son by birth, though people took Him to be. The Joseph Smith Translation sharpens it: “as was supposed of the world” (JST Luke 3:30), the general opinion of those who knew the family.

      The next name raises the best-known problem of the two genealogies. Matthew names Joseph's father Jacob ([[Matt. 1:16]]); Luke names Heli. From David on, Matthew follows the kings through Solomon, while Luke follows another son, Nathan (verse 31), and nearly all the names between differ. The probable explanation is that the two follow different lines, Matthew “a legal descent” that includes adopted heirs, and Luke “a natural descent through actual parentage.” Older commentators offered other ways through: that Joseph was the son of one man by birth and of the other by adoption; or that Jacob and Heli were brothers, and when one died childless the other married his widow “to raise up seed unto his brother” (the custom of [[Deut. 25:5–6]]), so that Joseph was one man's son by birth and the other's by law; or that Luke gives Mary's line, with Jesus counted the heir of Heli, her father. That last view has had able defenders, but nothing in Luke's words points to it, since the Greek word for “son” is not attested as meaning “son-in-law.”

      The Joseph Smith Translation bears on the question. For “which was the son of Heli” it reads “who was from the loins of Heli” (JST Luke 3:30), making Heli Joseph's father by birth, while it leaves Matthew's “Jacob begat Joseph” as it stands. On one Latter-day Saint reading, the change fits only the explanation in which Matthew gives the legal descent from David, “those who would have been kings if the monarchy had continued,” and Luke the line by birth; how far Joseph Smith meant to settle the matter is not clear. Matthew 1's notes take up Matthew's side of it.
    sources: [bd-genealogy, ellicott-luke, brown-testimony-luke, lds-scriptures]
  - ref: 36
    phrase: Which was the son of Cainan, which was the son of Arphaxad
    kind: scripture
    title: The second Cainan
    body: |
      There are two Cainans in Luke's list. The first, in verse 37, is the son of Enos in [[Gen. 5:9]] and [[Moses 6:17]]. The second, in this verse, between Arphaxad and Sala, is not in the Hebrew text of Genesis, where Arphaxad is the father of Salah ([[Gen. 11:12]]; [[1 Chr. 1:18]]). He is in the Septuagint, the Greek translation of the Old Testament, which reads that Arphaxad “begot Cainan” and “Cainan lived a hundred and thirty years and begot Sala.” Luke's list agrees here with the Greek Genesis rather than the Hebrew.
    sources: [lxx-rahlfs, oshb-wlc]
  - ref: 38
    phrase: which was the son of Adam, which was the son of God
    kind: christ
    title: Adam, which was the son of God
    body: |
      Matthew's genealogy begins with Abraham and comes down to Jesus; Luke's begins with Jesus and climbs past Abraham to Adam “and to God,” fitting a Gospel written for the world in general. Its placement is part of its meaning. It follows straight on the voice that said “Thou art my beloved Son” (verse 22), and its last words, “the son of God,” bring the reader back to that voice: the genealogy reinforces what the Father has just proclaimed. At the same time it ties Jesus to every human being. Having stood in the Jordan with “all the people,” He is shown to be a son of Adam with them.

      The Joseph Smith Translation changes the last line: Adam, “who was formed of God, and the first man upon the earth” (JST Luke 3:45). On one Latter-day Saint reading, the change stresses that Adam owed his life to God's creation and was the first of the human race, and so lessens the biological link to God that Luke's wording implies for Adam, and through him for Jesus. In this chapter only one person is called God's Son by the Father's own voice.
    sources: [bd-genealogy, huntsman-lukes-jesus, brown-testimony-luke, lds-scriptures]

christ: |
  Luke's chapter moves from the voice in the wilderness to the voice from heaven. John prepares a road so that “all flesh shall see the salvation of God,” points past himself to the One who baptizes with the Holy Ghost and fire, and steps aside; then Jesus, praying after His baptism, hears the Father say, “Thou art my beloved Son,” and the genealogy shows that Son to be one of Adam's children, standing with all of them.

  Nephi read that baptism as the gate every disciple enters, Christ “having set the example” ([[2 Ne. 31:9]]). The preparation John asked for still takes ordinary forms: a coat shared, honest dealing, power not misused. And the water still looks to more than itself, to the remission of sins “by fire and by the Holy Ghost” that follows it ([[2 Ne. 31:17]]).

explore: |
  - **Nephi on the baptism of Jesus.** [[2 Ne. 31]], with the vision of it in [[1 Ne. 11:27]].
  - **John's ordination and mission.** [[D&C 84:26–28]], and John's own record of Jesus in [[D&C 93:6–17]].
  - **What Jesus said of John.** [[Luke 7:24–35]] and [[Luke 16:16]].
  - **The other telling.** Matthew's account of the preaching and the baptism, with John's attempt to refuse, in [[Matt. 3]]; Matthew's genealogy in [[Matt. 1:1–17]].

