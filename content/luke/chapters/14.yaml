chapter: 14
title: Come; for All Things Are Now Ready
tagline: At a Sabbath meal in the house of a leading Pharisee, Jesus heals a man with dropsy, tells the guests to take the lowest seat and the host to invite the poor, and gives the parable of the great supper; then, on the road, He tells the crowds to count the cost of following Him.
when: 'On the journey to Jerusalem ([[Luke 13:22]]); in this site’s chronology, the Perean and Judean ministry'

setting: |
  This is the third time Luke sets Jesus at a Pharisee’s table ([[Luke 7:36]]; [[Luke 11:37]]). The last meal ended in open conflict, and afterward the scribes and Pharisees kept looking for “something out of his mouth, that they might accuse him” ([[Luke 11:53–54]]). Now, somewhere on the road to Jerusalem, a leader of the Pharisees invites Jesus to the Sabbath meal, a meal customarily cooked the day before and eaten after the synagogue service. Lawyers and Pharisees are among the guests (verse 3), and they are watching Him.

  Everything through verse 24 happens at that table: a healing, two lessons on seating and guest lists, and a parable about a supper. At verse 25 Luke puts Jesus back on the road with crowds following, and the subject turns to what it costs to follow Him. The Joseph Smith Translation smooths the turn: “And when he had finished these sayings, he departed thence.”

  Every story in the chapter is told only by Luke. Matthew has a parable of a king’s wedding feast whose guests refuse to come ([[Matt. 22:1–14]]), but it is told in the temple at Jerusalem and ends very differently ([[Matt. 21:23]]; [[Matt. 22:11–14]]); the differences are large enough that Jesus may well have told a like story twice, in different settings (see the notes on [[Matt. 22:7]]). The saying on salt He also gave in the Sermon on the Mount ([[Matt. 5:13]]).

thread: |
  **At the table Jesus turns the guest list upside down; on the road He names the price of a seat.**

  At the Pharisee’s meal everyone is measuring rank: who sits nearest the host, who is invited and who can invite back. Jesus answers with a reversal. Take the lowest place, and let God do the exalting. Invite those who cannot repay you. Then He tells of a supper whose invited guests all beg off, so that the poor, the maimed, the halt and the blind are brought in, and then strangers from the roads and hedges, until the house is filled.

  The excuses are the hinge of the chapter. One man has bought land, another oxen, a third has married a wife: property, goods and a spouse, a person’s most prized earthly ties. When Jesus turns to the crowds in verse 25, He names a wife among the ties a disciple must put after Him, with father and mother, children and his own life (verse 26), and He ends with “all that he hath,” all his goods (verse 33). The guests at the supper let such things keep them away. A disciple counts that cost in advance, the way a builder does before he lays a foundation, and settles it.

sections:
  - range: 1-6
    heading: A healing at a Sabbath meal
    plain: |
      One Sabbath, Jesus went to eat in the house of one of the leaders of the Pharisees, and they were watching Him closely. There in front of Him was a man swollen with dropsy. Jesus spoke up and asked the lawyers and Pharisees, “Is it lawful to heal on the Sabbath, or not?” They said nothing. So He took hold of the man, healed him and sent him on his way. Then He said to them, “If one of you had an ass or an ox fall into a pit, wouldn’t you pull it out at once, even on the Sabbath day?” And they had no answer to that.
  - range: 7-14
    heading: The lowest seat, and the guests who cannot repay
    plain: |
      Jesus noticed how the guests were picking out the places of honor at the table, and He gave them a parable. “When someone invites you to a wedding feast, don’t take the place of honor. Someone more distinguished than you may have been invited, and the host who invited you both will come and say, ‘Give this man your place,’ and then, in shame, you will have to move down to the lowest place. Instead, when you are invited, go and sit in the lowest place, so that when your host comes he may say to you, ‘Friend, move up higher.’ Then you will be honored in front of everyone at the table with you. For everyone who exalts himself will be humbled, and whoever humbles himself will be exalted.”

      He said to the man who had invited Him, “When you give a lunch or a dinner, don’t invite your friends, your brothers, your relatives or your rich neighbors, because they may invite you back, and so you will be repaid. When you give a feast, invite the poor, the crippled, the lame and the blind. Then you will be blessed, because they cannot repay you; you will be repaid at the resurrection of the just.”
  - range: 15-24
    heading: The great supper
    plain: |
      When one of the guests at the table heard this, he said to Jesus, “Blessed is the one who will eat bread in the kingdom of God!” Jesus answered him, “A man was giving a great supper and invited many. At the time for the supper he sent his servant to tell those who had been invited, ‘Come, for everything is ready now.’ But one after another they all began to make excuses. The first said, ‘I have bought a field, and I have to go out and see it. Please excuse me.’ Another said, ‘I have bought five yoke of oxen, and I am going to try them out. Please excuse me.’ Another said, ‘I have married a wife, so I cannot come.’

      “The servant came back and reported this to his master. Then the master of the house was angry and told his servant, ‘Go out quickly into the streets and alleys of the town and bring in the poor, the crippled, the lame and the blind.’ The servant said, ‘Master, what you ordered has been done, and there is still room.’ Then the master told the servant, ‘Go out to the roads and the hedged paths and urge people to come in, so that my house will be full. For I tell you, not one of those men who were invited will taste my supper.’”
  - range: 25-35
    heading: Counting the cost
    plain: |
      Great crowds were traveling with Jesus, and He turned and said to them, “If anyone comes to me and does not hate his father and mother, his wife and children, his brothers and sisters, yes, and even his own life, he cannot be my disciple. Whoever does not carry his own cross and follow me cannot be my disciple.

      “Suppose one of you wants to build a tower. Won’t you first sit down and work out the cost, to see whether you have enough to finish it? Otherwise, when you have laid the foundation and cannot finish, everyone who sees it will start to make fun of you: ‘This man started to build and couldn’t finish.’ Or suppose a king is about to go to war against another king. Won’t he first sit down and consider whether with ten thousand men he can face the one coming against him with twenty thousand? If he can’t, he will send a delegation while the other is still far away and ask for terms of peace. In the same way, any of you who does not give up everything he has cannot be my disciple.

      “Salt is good. But if salt loses its taste, how can it be made salty again? It is no use for the soil or even for the manure pile; people throw it out. Whoever has ears to hear, let him hear.”

notes:
  - ref: 1
    phrase: they watched him
    kind: history
    title: They watched him
    body: |
      “Watched” warns the reader that the invitation may not be as friendly as it seems. The verb means to watch closely to see what someone is going to do, and it can carry a bad sense, to watch insidiously. Luke uses it of the scribes and Pharisees who watched to see whether Jesus would heal on the Sabbath ([[Luke 6:7]]) and of the spies sent to catch Him in His words ([[Luke 20:20]]). Here the Greek is emphatic: they themselves were carefully watching Him.

      After the last meal at a Pharisee’s table, the scribes and Pharisees had begun “laying wait for him, and seeking to catch something out of his mouth” ([[Luke 11:53–54]]). Set beside that, this invitation, more than the earlier ones ([[Luke 7:36]]; [[Luke 11:37]]), may have been less hospitality than another chance to watch Him. The watchers are the lawyers and Pharisees at the meal (verse 3), and Jesus sits down among them anyway.
    sources: [thayer, cambridge-luke, lds-scriptures]
  - ref: 2
    phrase: a certain man before him which had the dropsy
    kind: history
    title: The man with the dropsy
    body: |
      Dropsy is most likely edema, an excess of fluid in the body. By the rules of rabbinic law written down later, healing on the Sabbath was questionable where a case did not need immediate attention, and this man’s did not. If the guests were reclining at a U-shaped table, as was the custom, the man would have stood in the open middle, facing Jesus across it. Luke does not say how he came to be there. He may have come hoping to be healed, or his presence may have been arranged by the host or others to see whether Jesus would heal on the holy day. Nothing in the verse settles it.

      Verse 3 says that Jesus “answering spake,” though no one has said a word. Either He is answering the setup in front of Him, or He is answering what the guests were thinking. Then “he took him”: the verb means to take hold of, and pictures Jesus holding the man, His hands on him or His arms around him, as He heals him.
    sources: [brown-testimony-luke, talmage-jesus-christ-27]
  - ref: 5
    phrase: an ass or an ox
    kind: words
    title: An ass, or a son?
    body: |
      A reader of a modern translation will find “a son or an ox” here. Many of the best manuscripts read “son” (*huios*), and modern editions of the Greek print it; the Greek text behind the King James Version has “ass” (*onos*). “Son” is probably what Luke wrote. It is the stranger reading, and the ox and the ass are a familiar pair in the law ([[Ex. 20:17]]; [[Deut. 22:4]]), so a copyist could easily have turned “son” into “ass,” while nothing would tempt one to change “ass” to “son.” Read with “son,” the question is: a son, or even an ox.

      Either way it is the argument Jesus had already used for the bent woman, that any of them would loose his ox or his ass on the Sabbath ([[Luke 13:15]]). It leaves the lawyers and Pharisees nothing to say (verse 6).
    sources: [ellicott-luke, cambridge-luke, greek-nt]
  - ref: 7
    phrase: chose out the chief rooms
    kind: history
    title: The chief rooms
    body: |
      “Rooms” are places at the table, not rooms in a house. Guests reclined, and the places of honor were those nearest the host; the place farthest from him was for the guest who counted least. The guest of honor typically arrived last and was then placed next to the host, so a guest who claims a high place early may have to give it up to someone more distinguished (verses 8–9). Joseph Smith’s revision says Jesus already knew the habit: “he knew how they chose out the cheif rooms, and exalted themselves one above another” (spelling as in the manuscript).

      The advice itself is old. Proverbs gives the same counsel: “better it is that it be said unto thee, Come up hither; than that thou shouldest be put lower in the presence of the prince” ([[Prov. 25:7]]). Nor is Jesus teaching a cleverer way to climb. There is no hint that a guest can put on humility to be invited higher; the invitation in verse 10 is only a possibility.
    sources: [olson-final-trek, brown-testimony-luke, jsp-nt2]
  - ref: 11
    phrase: whosoever exalteth himself shall be abased
    kind: scripture
    title: God does the exalting
    body: |
      The advice on seating ends in a saying about who gives honor. In the parable, real honor does not come from the place a guest takes for himself but from what another bestows on him.

      Peter’s letter later echoes the saying almost word for word, with God named as the one who lifts: “God resisteth the proud, and giveth grace to the humble. Humble yourselves therefore under the mighty hand of God, that he may exalt you in due time” ([[1 Pet. 5:5–6]]). The risen Lord repeated it in this dispensation, to Saints who had been “cast out from the land of their inheritance” ([[D&C 101:1]]): “He that exalteth himself shall be abased, and he that abaseth himself shall be exalted” ([[D&C 101:42]]).
    sources: [olson-final-trek, ellicott-luke, lds-scriptures]
  - ref: 14
    phrase: thou shalt be recompensed at the resurrection of the just
    kind: words
    title: The resurrection of the just
    body: |
      Jesus raises the host’s eyes from the dinner party to the resurrection. The friends, kin and rich neighbors of verse 12 are the kind of guests already at this table, and a feast for them is repaid in kind, with an invitation back. Hospitality that is repaid on earth has, in that sense, already had its reward. The poor, the maimed, the lame and the blind cannot return the favor, so the host who invites them is repaid at the resurrection instead.

      At a Pharisee’s table the promise would land: the Pharisees confessed the resurrection, against the Sadducees who denied it ([[Acts 23:6–8]]), and here Jesus takes their doctrine as His own. But He names a particular resurrection, “of the just,” which may point to a resurrection of the righteous that comes first ([[1 Cor. 15:23]]). Modern revelation uses the same phrase: those “who have done good” come forth “in the resurrection of the just,” and those who have done evil “in the resurrection of the unjust” ([[D&C 76:17]]), and those who “shall have part in the first resurrection” are those who “come forth in the resurrection of the just” ([[D&C 76:64–65]]). In the Church’s teaching the righteous have precedence and come forth in the first resurrection, before the unrepentant.
    sources: [ellicott-luke, cambridge-luke, lds-scriptures, bd-resurrection]
  - ref: 15
    phrase: Blessed is he that shall eat bread in the kingdom of God
    kind: history
    title: Bread in the kingdom of God
    body: |
      The guest’s words point to a hope well known at the time: a great feast that, in Jewish tradition, would mark the coming age of the Messiah. Luke has Jesus speak of that feast Himself ([[Luke 13:28–29]]; [[Luke 22:30]]).

      Why the man says it here can be read two ways. He may be trying to ease an awkward moment, since Jesus’s advice could be heard as a rebuke of the host. Or he may be pushing back: his blessing on those who will eat in the kingdom can be heard as taking for granted that its table will winnow out the unworthy, and so will not include “the poor, the maimed, the lame, the blind.” Either way, Jesus answers with a story about who actually ends up eating.
    sources: [talmage-jesus-christ-27, brown-testimony-luke]
  - ref: 18
    phrase: they all with one consent began to make excuse
    kind: history
    title: The excuses
    body: |
      The guests had already been invited and had accepted; the servant’s “Come; for all things are now ready” is the second notice, sent on the day as custom required. That is what makes the refusals an insult. Nothing the men want to do is sinful. But the field could be inspected tomorrow, the oxen tried another day, and the bridegroom could leave his bride for the length of a supper he had promised to attend. None of them, it seems, wanted to come.

      The excuses may also be respectable ones. They come close to the reasons the law of Moses gave for excusing a man from war: a new house, a new vineyard, a betrothed wife ([[Deut. 20:5–7]]). If the parable alludes to those exemptions, Jesus is telling lawyers and Pharisees that excuses which pass under the old law will not pass when the Lord’s supper is ready.
    sources: [talmage-jesus-christ-27, brown-testimony-luke]
  - ref: 21
    phrase: bring in hither the poor, and the maimed, and the halt, and the blind
    kind: scripture
    title: The supper of the Lord
    body: |
      The list is the same one Jesus gave the host a few minutes before (verse 13), and those at the table could hardly miss the echo: the master of the parable does what Jesus has just told the Pharisee to do with his own guest list.

      Modern revelation tells of the same supper and the same order of guests, and its footnote points back to this parable ([[Luke 14:16–24]]). The Lord speaks of “a supper of the house of the Lord, well prepared, unto which all nations shall be invited. First, the rich and the learned, the wise and the noble; and after that cometh the day of my power; then shall the poor, the lame, and the blind, and the deaf, come in unto the marriage of the Lamb” ([[D&C 58:9–11]]).
    sources: [talmage-jesus-christ-27, lds-scriptures]
  - ref: 23
    phrase: compel them to come in
    kind: words
    title: Compel them to come in
    body: |
      “Compel” here need not mean force. The Greek verb can mean to constrain by force or threats, but just as well by persuasion and entreaty; the footnote gives “urge,” and in this verse the sense is urging strongly.

      One Latter-day Saint reading traces in the parable the gospel’s invitation through history. Israel, the covenant people, were the invited guests, who had long ago agreed to come; when the feast was ready, the Messenger sent by the Father stood in their midst, and they excused themselves. The invitation then went to the Gentiles, counted spiritually poor, maimed, halt and blind (verse 21), and at last to the strangers beyond the walls (verse 23), who would hesitate until “by gentle urging and effective assurance that they were really included among the bidden guests, they would feel themselves constrained or compelled to come.” Another reading draws the line at a different place: the streets and lanes of verse 21 are inside the town, so the poor brought in from them are still of the Jewish community, and only the roads and hedges outside the town in verse 23 reach those beyond it. Both readings end the same way, with the invitation going past the covenant people; they differ on whether the Gentiles first appear in verse 21 or in verse 23.
    sources: [thayer, talmage-jesus-christ-27, brown-testimony-luke]
  - ref: 26
    phrase: hate not his father, and mother
    kind: words
    title: Hate not his father
    body: |
      Jesus does not command hatred of one’s family. A man who indulges hatred is in need of repentance, not ready for discipleship; the precept is that duty to God comes before personal or family claims. The word can carry the sense of loving less, and Matthew’s form of the saying puts it that way: “He that loveth father or mother more than me is not worthy of me” ([[Matt. 10:37]]; see the note there). Biblical speech often puts a strong preference as love and hate, where a cooler speech would say only interest or indifference. Jacob “loved also Rachel more than Leah,” and the next verse calls Leah “hated” ([[Gen. 29:30–31]]), a verse interpreters have often read beside this one.

      So the hate is hate by comparison. Jesus states the principle in its boldest form so that it cannot be forgotten: when the nearest ties become obstacles to coming to Him, they must give way. “His own life also” explains the word further, and the Joseph Smith Translation (in the footnote) makes it plain: “or in other words, is afraid to lay down his life for my sake.” It also adds “or husband” to the list. A disciple must be willing to put parents, family, relatives and even his own life below his discipleship.
    sources: [talmage-jesus-christ-27, olson-final-trek, cambridge-luke, thayer, lds-scriptures]
  - ref: 27
    phrase: cannot be my disciple
    kind: scripture
    title: Settle this in your hearts
    body: |
      To carry one’s cross was the image of a condemned man carrying the crosspiece to his own execution, and for Luke’s reader it also points to the cross Jesus Himself would carry. Luke has already given the saying with “daily” ([[Luke 9:23]]; see the note there for the Joseph Smith Translation’s definition of taking up the cross).

      Here the Joseph Smith Translation adds a sentence after “cannot be my disciple”: “Wherefore, settle this in your hearts, that ye will do the things which I shall teach, and command you” (JST Luke 14:28, in the footnote). The addition can be read as recognizing that deciding to follow Him at all costs, and keeping to that decision, brings inward struggle, and it asks that the matter be settled in the heart. To be settled in this way is to yield the heart to God completely, and “there are precious blessings that come only from the complete yielding of one’s heart to God.”
    sources: [brown-testimony-luke, lds-scriptures, gibbons-settle-hearts]
  - ref: 28
    phrase: counteth the cost, whether he have sufficient to finish it
    kind: symbol
    title: A tower and a war
    body: |
      The tower seems to be not a watchtower in a vineyard but a costly private building, a tower-like house of several stories, the kind of project whose half-built foundation would be a public embarrassment. The weight falls less on the counting than on the finishing: “finish” comes three times in three verses. The Joseph Smith Translation says so outright after verse 30: “And this he said, signifying there should not any man follow him, unless he was able to continue.”

      The king adds urgency. An army is already marching toward him, so he cannot deliberate forever; he must decide, while the enemy is still far off, whether to fight or to ask for terms. Some, like Peter and his partners, left everything the moment they were called ([[Luke 5:10–11]]). Others need to sit down and think it through. Either way, the reckoning ends in verse 33, where “all that he hath” means literally all his goods, all his property.
    sources: [olson-final-trek, brown-testimony-luke, lds-scriptures]
  - ref: 34
    phrase: Salt is good
    kind: scripture
    title: Ye know not Moses
    body: |
      In the King James text the turn to salt comes abruptly. The Joseph Smith Translation gives the saying a setting (JST Luke 14:35–37, in the appendix). Some in the crowd come to Him: “Good Master, we have Moses and the prophets, and whosoever shall live by them, shall he not have life?” Jesus answers, “Ye know not Moses, neither the prophets; for if ye had known them, ye would have believed on me; for to this intent they were written. For I am sent that ye might have life. Therefore I will liken it unto salt which is good.”

      In the revision, then, the saying on salt is no longer abrupt: it follows Jesus’s reply to men who claimed life through Moses and the prophets without believing on the One of whom they wrote, and “Therefore I will liken it unto salt” makes it His answer to them. The addition’s phrase “Moses and the prophets” is a way of naming the Old Testament found only in Luke’s writings ([[Luke 16:29]]; [[Luke 24:27]]; [[Acts 26:22]]), so the addition fits his style. How salt can lose its savor at all is taken up in the note on [[Matt. 5:13]].
    sources: [jst-luke-14, brown-testimony-luke]
  - ref: 35
    phrase: It is neither fit for the land, nor yet for the dunghill
    kind: symbol
    title: Not even for the dunghill
    body: |
      Salt seems to have had a humbler use than seasoning food: mixed into the dunghill, it helped manure the ground and prepare it for the seed. Salt that has lost its savor is no good even for that. Nothing stronger than salt can restore its bite, and spoiled salt is fit only to be thrown out. Coming right after the sayings on the cost, the image is read as a warning against beginning and then falling away: Jesus “would have only genuine disciples, not enthusiasts of a day, ready to desert His cause when effort and sacrifice were most needed.”

      Modern revelation uses the same image for the Saints who had been driven from the land of Zion ([[D&C 103:1–2]]), who “were set to be a light unto the world, and to be the saviors of men; and inasmuch as they are not the saviors of men, they are as salt that has lost its savor” ([[D&C 103:9–10]]).
    sources: [ellicott-luke, cambridge-luke, talmage-jesus-christ-27, lds-scriptures]

christ: |
  At the end of the parable Jesus puts Himself inside His own story. The plural “you” of verse 24 turns the master’s words to everyone at the table, so that the master of the house speaks with Jesus’s own voice and “my supper” is His. The guests He would have at His supper are the ones no one else invites, and the invitation He sends is the servant’s: “Come; for all things are now ready” (verse 17).

  The chapter reaches a disciple in the excuses. Land, oxen and a new marriage are not sinful, yet they kept the guests from the supper, and a wife and “all that he hath” are among what Jesus asks a disciple to put after Him (verses 26 and 33). The Joseph Smith Translation asks that the choice be settled in the heart beforehand ([[Luke 14:27]], footnote), for “we cannot keep one foot in the Church and one foot in the world.”

