chapter: 14
title: Come; for All Things Are Now Ready
tagline: At a Sabbath meal in the house of a leading Pharisee, Jesus heals a man with dropsy, tells the guests to take the lowest seat and the host to invite the poor, and gives the parable of the great supper; then, on the road, He tells the crowds to count the cost of following Him.
when: 'On the journey to Jerusalem ([[Luke 13:22]]); in this site’s chronology, the Perean and Judean ministry'

setting: |
  This is the third time Luke sets Jesus at a Pharisee’s table ([[Luke 7:36]]; [[Luke 11:37]]). The last meal ended in open conflict, and afterward the scribes and Pharisees kept looking for “something out of his mouth, that they might accuse him” ([[Luke 11:53–54]]). Now, somewhere on the road to Jerusalem, a leader of the Pharisees invites Jesus to the Sabbath meal, a meal customarily cooked the day before and eaten after the synagogue service. Lawyers and Pharisees are among the guests (verse 3), and they are watching Him.

  Everything through verse 24 happens at that table: a healing, two lessons on seating and guest lists, and a parable about a supper. At verse 25 Luke puts Jesus back on the road with crowds following, and the subject turns to what it costs to follow Him. The Joseph Smith Translation smooths the turn: “And when he had finished these sayings, he departed thence.”

  Every story in the chapter is told only by Luke. Matthew has a parable of a king’s wedding feast whose guests refuse to come ([[Matt. 22:1–14]]), but it is set in the temple in the last week and ends very differently; the differences are large enough that Jesus may well have told a like story twice, in different settings (see the notes on [[Matt. 22:7]]). The saying on salt He also gave in the Sermon on the Mount ([[Matt. 5:13]]).

thread: |
  **At the table Jesus turns the guest list upside down; on the road He names the price of a seat.**

  At the Pharisee’s meal everyone is measuring rank: who sits nearest the host, who is invited and who can invite back. Jesus answers with a reversal. Take the lowest place, and let God do the exalting. Invite those who cannot repay you. Then He tells of a supper whose invited guests all beg off, so that the poor, the maimed, the halt and the blind fill the house in their place.

  The excuses are the hinge of the chapter. One man has bought land, another oxen, a third has married a wife: property, goods and a spouse, a person’s most prized earthly ties. When Jesus turns to the crowds in verse 25, He names a wife among the ties a disciple must put after Him, with father and mother, children and his own life (verse 26), and He ends with “all that he hath,” all his goods (verse 33). The guests at the supper let such things keep them away. A disciple counts that cost in advance, the way a builder does before he lays a foundation, and settles it.

sections:
  - range: 1-6
    heading: A healing at a Sabbath meal
    plain: |
      One Sabbath, Jesus went to eat in the house of one of the leaders of the Pharisees, and they were watching Him closely. There in front of Him was a man swollen with dropsy. Jesus spoke up and asked the lawyers and Pharisees, “Is it lawful to heal on the Sabbath, or not?” They said nothing. So He took hold of the man, healed him and sent him on his way. Then He said to them, “If one of you had an ass or an ox fall into a pit, wouldn’t you pull it out at once, even on the Sabbath day?” And they had no answer to that.
  - range: 7-14
    heading: The lowest seat, and the guests who cannot repay
    plain: |
      Jesus noticed how the guests were picking out the places of honor at the table, and He gave them a parable. “When someone invites you to a wedding feast, don’t take the place of honor. Someone more distinguished than you may have been invited, and the host who invited you both will come and say, ‘Give this man your place,’ and then, in shame, you will have to move down to the lowest place. Instead, when you are invited, go and sit in the lowest place, so that when your host comes he may say to you, ‘Friend, move up higher.’ Then you will be honored in front of everyone at the table with you. For everyone who exalts himself will be humbled, and whoever humbles himself will be exalted.”

      He said to the man who had invited Him, “When you give a lunch or a dinner, don’t invite your friends, your brothers, your relatives or your rich neighbors, because they may invite you back, and so you will be repaid. When you give a feast, invite the poor, the crippled, the lame and the blind. Then you will be blessed, because they cannot repay you; you will be repaid at the resurrection of the just.”
  - range: 15-24
    heading: The great supper
    plain: |
      When one of the guests at the table heard this, he said to Jesus, “Blessed is the one who will eat bread in the kingdom of God!” Jesus answered him, “A man was giving a great supper and invited many. At the time for the supper he sent his servant to tell those who had been invited, ‘Come, for everything is ready now.’ But one after another they all began to make excuses. The first said, ‘I have bought a field, and I have to go out and see it. Please excuse me.’ Another said, ‘I have bought five yoke of oxen, and I am going to try them out. Please excuse me.’ Another said, ‘I have just married, so I cannot come.’

      “The servant came back and reported this to his master. Then the master of the house was angry and told his servant, ‘Go out quickly into the streets and alleys of the town and bring in the poor, the crippled, the lame and the blind.’ The servant said, ‘Master, what you ordered has been done, and there is still room.’ Then the master told the servant, ‘Go out to the roads and the hedged paths and urge people to come in, so that my house will be full. For I tell you, not one of those men who were invited will taste my supper.’”
  - range: 25-35
    heading: Counting the cost
    plain: |
      Great crowds were traveling with Jesus, and He turned and said to them, “If anyone comes to me and does not hate his father and mother, his wife and children, his brothers and sisters, yes, and even his own life, he cannot be my disciple. Whoever does not carry his own cross and follow me cannot be my disciple.

      “Suppose one of you wants to build a tower. Won’t you first sit down and work out the cost, to see whether you have enough to finish it? Otherwise, when you have laid the foundation and cannot finish, everyone who sees it will start to make fun of you: ‘This man started to build and couldn’t finish.’ Or suppose a king is about to go to war against another king. Won’t he first sit down and consider whether with ten thousand men he can face the one coming against him with twenty thousand? If he can’t, he will send a delegation while the other is still far away and ask for terms of peace. In the same way, any of you who does not give up everything he has cannot be my disciple.

      “Salt is good. But if salt loses its taste, how can it be made salty again? It is no use for the soil or even for the manure pile; people throw it out. Whoever has ears to hear, let him hear.”

notes:
  - ref: 1
    phrase: they watched him
    kind: history
    title: They watched him
    body: |
      The invitation is not quite the friendly gesture it seems. The verb for “watched” carries the sense of hostile observation, and Luke uses it again of the scribes and Pharisees who watched to see whether Jesus would heal on the Sabbath ([[Luke 6:7]]) and of the spies sent to trap Him in His words ([[Luke 20:20]]). “They” are not His own followers but the lawyers and Pharisees at the meal (verse 3). Jesus accepts anyway, as He has twice before, and sits down among guests who are strangers to Him ([[Luke 7:36]]; [[Luke 11:37]]).

      This is one of several Sabbath healings in Luke, with the man with the withered hand ([[Luke 6:6–10]]) and the bent woman ([[Luke 13:10–17]]). Taken together, they show the same thing: God justifies the person who relieves suffering on the Sabbath, even when the relief counts as “work” by the rules of the day.
    sources: [brown-testimony-luke]
  - ref: 2
    phrase: a certain man before him which had the dropsy
    kind: history
    title: The man with the dropsy
    body: |
      Dropsy is most likely edema, an excess of fluid in the body. This man’s case did not need immediate attention, and by the rules later written down that is what made healing him on the Sabbath questionable. If the guests were reclining at a U-shaped table, as was the custom, the man stood in the open middle, facing Jesus across it. Luke does not say how he came to be there. He may have come hoping to be healed, or his presence may have been arranged by the host or others to see whether Jesus would heal on the holy day. Nothing in the verse settles it.

      Verse 3 says that Jesus “answering spake,” though no one has said a word. Either He is answering the setup in front of Him, or He is answering what the guests were thinking. Then “he took him”: the verb means to take hold of, and pictures Jesus holding the man, His hands on him or His arms around him, as He heals him. The Joseph Smith Translation makes it “he took the man.”
    sources: [brown-testimony-luke, talmage-jesus-christ-27]
  - ref: 5
    phrase: an ass or an ox
    kind: words
    title: An ass, or a son?
    body: |
      A reader of a modern translation will find “a son or an ox” here. The earliest manuscripts of Luke, P45 and P75, read “son,” and modern editions of the Greek follow them; the Greek text behind the King James Version has “ass.” “Son” makes the contrast more striking: a man’s own child set beside his ox. Later Jewish law makes no explicit allowance for such a rescue; it seems to have been done as a matter of custom or necessity.

      The question leaves the lawyers and Pharisees nothing to say (verse 6).
    sources: [brown-testimony-luke, greek-nt]
  - ref: 7
    phrase: chose out the chief rooms
    kind: history
    title: The chief rooms
    body: |
      “Rooms” are places at the table, not rooms in a house. Guests reclined, and the places of honor were those nearest the host; the place farthest from him was for the guest who counted least. The most honored guest customarily arrived last and was then given the place beside the host, so the early arrivals here are jostling for places someone more distinguished may yet claim. The Joseph Smith Translation says Jesus already knew the habit: “for he knew how they chose out the chief rooms and exalted themselves one above another.”

      The advice itself is old. Proverbs gives the same counsel: “better it is that it be said unto thee, Come up hither; than that thou shouldest be put lower in the presence of the prince” ([[Prov. 25:7]]). Nor is Jesus teaching a cleverer way to climb. There is no hint that a guest can put on humility to be invited higher; the invitation in verse 10 is only a possibility.
    sources: [olson-final-trek, brown-testimony-luke]
  - ref: 11
    phrase: whosoever exalteth himself shall be abased
    kind: scripture
    title: God does the exalting
    body: |
      The advice on seating becomes a statement about God. “Shall be abased” and “shall be exalted” are passive verbs with no one named as the actor, a way of speaking that leaves God as the one who does the abasing and the exalting. The same holds in verse 14, “thou shalt be recompensed.” The Joseph Smith Translation points the same way in verse 10, where it reads “honor of God” for “worship”: the honor that matters is not the regard of the other guests but God’s.

      The risen Lord repeated the saying in this dispensation, of Saints who had been “cast out from the land of their inheritance” ([[D&C 101:1]]): “He that exalteth himself shall be abased, and he that abaseth himself shall be exalted” ([[D&C 101:42]]), and, as here, followed it with a parable ([[D&C 101:43–62]]).
    sources: [brown-testimony-luke, lds-scriptures]
  - ref: 14
    phrase: thou shalt be recompensed at the resurrection of the just
    kind: words
    title: The resurrection of the just
    body: |
      Jesus raises the host’s eyes from the dinner party to the resurrection. An ordinary guest list is a kind of exchange: I invite you, you invite me back. The poor, the maimed, the lame and the blind cannot return the favor, and that is the point; the host who invites them waits for his return from God. Jesus’s list matches Isaiah’s fast: “bring the poor that are cast out to thy house” ([[Isa. 58:7]]).

      Pharisees believed in the resurrection, so the appeal would land at this table. But Jesus adds a qualifier. It is “the resurrection of the just,” and the just are those who do justly by His standards, not by the guests’.
    sources: [brown-testimony-luke]
  - ref: 15
    phrase: Blessed is he that shall eat bread in the kingdom of God
    kind: history
    title: Bread in the kingdom of God
    body: |
      The guest’s words point to a hope well known at the time: a great feast that, in Jewish tradition, would mark the coming age of the Messiah. Luke has Jesus speak of that feast Himself ([[Luke 13:28–29]]; [[Luke 22:30]]).

      Why the man says it here can be read two ways. He may be trying to ease an awkward moment, since Jesus’s advice to the host was taken as a rebuke. Or he may be pushing back: he seems to assume that the kingdom’s table will winnow out the unworthy and will not include “the poor, the maimed, the lame, the blind.” Either way, Jesus answers with a story about who actually ends up eating.
    sources: [talmage-jesus-christ-27, brown-testimony-luke]
  - ref: 18
    phrase: they all with one consent began to make excuse
    kind: history
    title: The excuses
    body: |
      The guests had already been invited and had accepted; the servant’s “Come; for all things are now ready” is the second notice, sent on the day as custom required. That is what makes the refusals an insult. Nothing the men want to do is sinful. But the field could be inspected tomorrow, the oxen tried another day, and the bridegroom could leave his bride for the length of a supper he had promised to attend. Plainly none of them wanted to come.

      The excuses are also respectable ones. They come close to the reasons the law of Moses gave for excusing a man from war: a new house, a new vineyard, a new wife ([[Deut. 20:5–7]]). On that reading, Jesus is telling a table of lawyers that excuses which pass under the old law will not pass when the Lord’s supper is ready.
    sources: [talmage-jesus-christ-27, brown-testimony-luke]
  - ref: 21
    phrase: bring in hither the poor, and the maimed, and the halt, and the blind
    kind: scripture
    title: The supper of the Lord
    body: |
      The list is the same one Jesus gave the host three verses earlier (verse 13): the master of the parable does what Jesus has just told the Pharisee to do, and gladly fills his house with the people society passed over.

      The guests first invited were people of means, a man who buys land and another who buys five yoke of oxen. In modern revelation the Lord speaks of “a supper of the house of the Lord, well prepared, unto which all nations shall be invited. First, the rich and the learned, the wise and the noble; and after that cometh the day of my power; then shall the poor, the lame, and the blind, and the deaf, come in unto the marriage of the Lamb” ([[D&C 58:9–11]]). The poor, the lame and the blind of the parable are the ones the Lord welcomes at that supper.
    sources: [brown-testimony-luke, lds-scriptures]
  - ref: 23
    phrase: compel them to come in
    kind: words
    title: Compel them to come in
    body: |
      “Compel” here need not mean force. The Greek verb can mean to constrain by force or threats, but just as well by persuasion and entreaty; the footnote gives “urge,” and in this verse the sense is urging strongly.

      Read as history, the parable traces the gospel’s invitation. Israel, the covenant people, were the invited guests, who had long ago agreed to come; when the feast was ready, the Messenger sent by the Father stood in their midst, and they excused themselves. The invitation then went to the Gentiles, counted spiritually poor, maimed, halt and blind, and at last to the strangers beyond the walls, who would hesitate until “by gentle urging and effective assurance that they were really included among the bidden guests, they would feel themselves constrained or compelled to come.” Another Latter-day Saint reading keeps the streets of verse 21 inside the town and finds those outside the Jewish community on the roads and hedges of verse 23.
    sources: [thayer, talmage-jesus-christ-27, brown-testimony-luke]
  - ref: 26
    phrase: hate not his father, and mother
    kind: words
    title: Hate not his father
    body: |
      Jesus does not command hatred of one’s family. He is speaking by hyperbole, overstating the case so that no one can miss or forget it, and “hate” here means turning against whatever pulls a person away from his first loyalty. Biblical speech often puts a strong preference as love and hate, where a cooler speech would say only interest or indifference. Jacob “loved also Rachel more than Leah,” and the next verse calls Leah “hated” ([[Gen. 29:30–31]]), a verse long read beside this one. The same saying elsewhere in Matthew reads, “He that loveth father or mother more than me is not worthy of me” ([[Matt. 10:37]]; see the note there).

      The Joseph Smith Translation makes two additions (in the footnote). It adds “or husband,” so that the saying speaks as directly to a married woman, who in that society joined her husband’s household, as to a man. And it explains “his own life also”: “or in other words, is afraid to lay down his life for my sake.” The test is not whether one loves family less but whether anything, one’s own life included, would be kept back from Him. Jesus is not souring family ties; He asks whether they should stand on more enduring ground than one’s tie to Him. In a life consecrated to Him, those ties become stronger and more meaningful.
    sources: [brown-testimony-luke, thayer, lds-scriptures]
  - ref: 27
    phrase: cannot be my disciple
    kind: scripture
    title: Settle this in your hearts
    body: |
      To carry one’s cross was the image of a condemned man carrying the crosspiece to his own execution, and for Luke’s reader it also points to the cross Jesus Himself would carry. Luke has already given the saying with “daily” ([[Luke 9:23]]; see the note there for the Joseph Smith Translation’s definition of taking up the cross).

      Here the Joseph Smith Translation adds a sentence after “cannot be my disciple”: “Wherefore, settle this in your hearts, that ye will do the things which I shall teach, and command you” (JST Luke 14:28, in the footnote). The addition admits that following Him at all costs is a decision that takes inward struggle, while it is made and after, and asks that it be settled in the heart. A heart so settled receives “precious blessings that come only from the complete yielding of one’s heart to God.”
    sources: [brown-testimony-luke, lds-scriptures, gibbons-settle-hearts]
  - ref: 28
    phrase: counteth the cost, whether he have sufficient to finish it
    kind: symbol
    title: A tower and a war
    body: |
      The tower is probably not a watchtower in a vineyard but a costly private building, a tower-like house of several stories, the kind of project whose half-built foundation would be a public embarrassment. The weight falls less on the counting than on the finishing: “finish” comes three times in three verses. The Joseph Smith Translation says so outright after verse 30: “And this he said, signifying there should not any man follow him, unless he was able to continue.”

      The king adds urgency. An army is already marching toward him, so he cannot deliberate forever; he must decide, while the enemy is still far off, whether to fight or to ask for terms. Some, like Peter and his partners, left everything the moment they were called ([[Luke 5:10–11]]). Others need to sit down and think it through. Either way, the reckoning ends in verse 33, where “all that he hath” means literally all his goods, all his property.
    sources: [olson-final-trek, brown-testimony-luke, lds-scriptures]
  - ref: 34
    phrase: Salt is good
    kind: scripture
    title: Ye know not Moses
    body: |
      In the King James text the turn to salt comes abruptly. The Joseph Smith Translation gives the saying a setting (JST Luke 14:35–37, in the appendix). Some in the crowd come to Him: “Good Master, we have Moses and the prophets, and whosoever shall live by them, shall he not have life?” Jesus answers, “Ye know not Moses, neither the prophets; for if ye had known them, ye would have believed on me; for to this intent they were written. For I am sent that ye might have life. Therefore I will liken it unto salt which is good.”

      The addition gives the saying on salt a new setting: it now follows Jesus’s reply to men who claimed life through Moses and the prophets without believing on the One of whom they wrote, and it bridges the sayings on discipleship and those on salt. Its phrase “Moses and the prophets” is Luke’s own way of naming the Old Testament ([[Luke 16:29]]; [[Luke 24:27]]). How salt can lose its savor at all is taken up in the note on [[Matt. 5:13]].
    sources: [jst-luke-14, brown-testimony-luke]
  - ref: 35
    phrase: It is neither fit for the land, nor yet for the dunghill
    kind: symbol
    title: Not even for the dunghill
    body: |
      Salt in small amounts was useful on the soil: sown onto the beds of certain plants it served as fertilizer, and it seems to have been scattered on manure piles before the manure went out to the fields, a practice known from Egypt. Salt that has lost its savor is no good even for that, and is thrown away. Coming right after the sayings on the cost, the salt pictures those who declare themselves disciples and then abandon their commitment because the cost is high.

      Modern revelation uses the same image for the Saints who had been driven from the land of Zion ([[D&C 103:1–2]]), who “were set to be a light unto the world, and to be the saviors of men; and inasmuch as they are not the saviors of men, they are as salt that has lost its savor” ([[D&C 103:9–10]]).
    sources: [brown-testimony-luke, lds-scriptures]

christ: |
  Jesus puts Himself inside His own stories. The God who exalts and abases in verse 11, who repays at the resurrection in verse 14, and who decides who will taste His supper in verse 24 is the One reclining at the Pharisee’s table, and the plural “you” of verse 24 makes the master of the house His own voice. The guests He would have at His supper are the ones no one else invites, and the invitation He sends is the servant’s: “Come; for all things are now ready” (verse 17).

  The chapter reaches a disciple in the excuses. Land, oxen and a new marriage are not sinful, yet they kept the guests from the supper, and a wife and “all that he hath” are among what Jesus asks a disciple to put after Him (verses 26 and 33). The Joseph Smith Translation asks that the choice be settled in the heart beforehand ([[Luke 14:27]], footnote), for “we cannot keep one foot in the Church and one foot in the world.”

explore: |
