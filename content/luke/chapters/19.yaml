chapter: 19
title: The Time of Thy Visitation
tagline: Jesus stays at the house of Zacchaeus, a chief publican of Jericho, tells the parable of the pounds, rides down the Mount of Olives to the praise of His disciples, weeps over Jerusalem, and clears the temple.
when: 'The end of the journey to Jerusalem: Jericho, the climb to the Mount of Olives, and the temple, about a week before the Passover'

setting: |
  The long journey that began when Jesus “steadfastly set his face to go to Jerusalem” ([[Luke 9:51]]) ends in this chapter. Jesus passes through Jericho, tells one more parable, and at verse 28 goes up the road to the city.

  Jericho lay a little under fifteen miles northeast of Jerusalem, in a valley below sea level, so the road from it climbs the whole way: Luke says Jesus went “ascending up to Jerusalem” (verse 28). It was an important town, and its trade in balsam and spices kept a customs office there. The crowd around Jesus was swollen with pilgrims going up for the Passover, about a week away.

  Zacchaeus and the parable of the pounds are told only by Luke. All four Gospels tell the entry into Jerusalem ([[Matt. 21:1–11]]; [[Mark 11:1–11]]; [[John 12:12–19]]), but only Luke has Jesus weep over the city as He comes in sight of it, a note of sorrow in the middle of the rejoicing. Matthew and Luke set the clearing of the temple on the day of the entry; Mark sets it the next morning ([[Mark 11:11–17]]). A parable much like the pounds, the talents, was told on another occasion ([[Matt. 25:14–30]]).

thread: |
  **Luke 19 is about a visit, and who recognizes it.**

  The chapter turns on how people receive their master. Zacchaeus climbs a tree to see Jesus, hears his name called, and receives Him “joyfully” into his house; the owners of the colt let it go when they hear that “the Lord hath need of him.” For them the visit is good news, and Jesus says so with the word He uses for the moments He brings: “This day is salvation come to this house.”

  Others do not receive Him. The parable that follows has a servant who hides what his lord gave him and citizens who say, “We will not have this man to reign over us.” Then the story stops being a parable. Jesus comes down the Mount of Olives to the praise of His disciples, and some Pharisees ask Him to silence them. He looks at the city and weeps, because it will not know “the time of thy visitation.” He comes to Jerusalem under a banner of praise, and within days its officials reject Him. The chapter ends with Him teaching in the temple every day while its leaders look for a way to kill Him.

sections:
  - range: 1-10
    heading: Zacchaeus
    plain: |
      Jesus came into Jericho and was passing through it. A man named Zacchaeus lived there, the chief of the tax collectors, and he was rich. He wanted to see who Jesus was, but he could not see over the crowd, because he was short. So he ran ahead and climbed a sycamore fig tree to see Him, because Jesus was going to pass that way.

      When Jesus reached the spot, He looked up and said, “Zacchaeus, hurry and come down, for today I must stay at your house.” He hurried down and welcomed Him with joy. Everyone who saw it began to grumble: “He has gone to be the guest of a sinner.”

      Zacchaeus stood up and said to the Lord, “Look, Lord, half of what I own I give to the poor, and if I have cheated anyone of anything, I pay him back four times as much.” Jesus said to him, “Today salvation has come to this house, because he too is a son of Abraham. For the Son of Man came to seek out and to save the lost.”
  - range: 11-27
    heading: The parable of the pounds
    plain: |
      While they were listening, Jesus went on to tell a parable, because He was near Jerusalem and they thought the kingdom of God was going to appear at once. He said: “A nobleman went to a distant country to be made king and then come back. He called ten of his servants, gave them ten pounds, one each, and told them, ‘Do business with this until I come back.’ But his citizens hated him and sent a delegation after him to say, ‘We do not want this man to rule over us.’

      “He came back with the kingship and had the servants he had given the money to called in, to find out what each had made by trading. The first came and said, ‘Lord, your pound has made ten pounds.’ ‘Well done, good servant,’ he said. ‘Because you have been faithful in a very small thing, take charge of ten cities.’ The second came and said, ‘Lord, your pound has made five.’ He said to him too, ‘You take charge of five cities.’

      “Another came and said, ‘Lord, here is your pound. I kept it wrapped up in a cloth, because I was afraid of you. You are a hard man: you take what you did not put in and reap what you did not sow.’ He answered, ‘I will judge you by your own words, you wicked servant. You knew, did you, that I am a hard man, taking what I did not put in and reaping what I did not sow? Then why did you not put my money in the bank, so that when I came I could have collected it with interest?’ And he said to those standing by, ‘Take the pound from him and give it to the man who has ten.’ (‘Lord,’ they said, ‘he already has ten.’) ‘I tell you, to everyone who has, more will be given; and from the one who has not, even what he has will be taken away. But as for those enemies of mine who did not want me to rule over them, bring them here and execute them in front of me.’”
  - range: 28-40
    heading: The King comes down the Mount of Olives
    plain: |
      After He said this, Jesus went on ahead, climbing the road up to Jerusalem. As He came near Bethphage and Bethany, at the hill called the Mount of Olives, He sent two of His disciples: “Go into the village ahead of you. As you enter it you will find a colt tied there that no one has ever ridden. Untie it and bring it here. If anyone asks you why you are untying it, say, ‘The Lord needs it.’” They went and found it just as He had told them. As they were untying the colt, its owners asked, “Why are you untying the colt?” They answered, “The Lord needs it.”

      They brought it to Jesus, threw their cloaks over the colt and set Him on it. As He rode, people spread their cloaks on the road. When He came near the place where the road goes down the Mount of Olives, the whole crowd of His disciples began to praise God joyfully and loudly for all the mighty works they had seen: “Blessed is the King who comes in the name of the Lord! Peace in heaven, and glory in the highest!” Some of the Pharisees in the crowd said to Him, “Teacher, rebuke your disciples.” He answered, “I tell you, if these kept quiet, the stones would cry out.”
  - range: 41-44
    heading: Jesus weeps over Jerusalem
    plain: |
      As He came closer and saw the city, He wept over it and said, “If only you had known, on this day of yours, what would bring you peace! But now it is hidden from your eyes. The days will come when your enemies will build a siege wall around you, surround you and close you in on every side. They will dash you to the ground, you and your children within you, and they will not leave one stone on another in you, because you did not recognize the time when God came to you.”
  - range: 45-48
    heading: The temple cleansed
    plain: |
      He went into the temple and began to drive out those who were selling there and those who were buying. “It is written,” He said to them, “‘My house is the house of prayer,’ but you have made it a robbers’ den.” Every day He taught in the temple. The chief priests, the scribes and the leading men of the people were looking for a way to kill Him, but they could not find any way to do it, because all the people hung on His words.

notes:
  - ref: 2
    phrase: the chief among the publicans
    kind: history
    title: Chief among the publicans
    body: |
      Zacchaeus was not an ordinary tax collector but the man over them. His title, *architelōnēs*, is found nowhere else in ancient literature, and it describes a supervisor: part of his income came from the collectors who worked under him in the towns around Jericho. Publicans bid for the right to collect the indirect taxes, the duties on purchases and leases, on behalf of Rome, and Jericho’s trade in balsam and spices made its customs office a rich post.

      That explains both halves of verse 2, “chief among the publicans, and he was rich,” and the crowd’s contempt. Publicans served Roman interests; they were detested, some judged them ritually unclean, and a Jew who took up the work was excommunicated. His name marked him as a Jew: Zacchaeus is a form of Zacharias, so he was one of their own working for the occupier, and at the top of the trade.
    sources: [brown-testimony-luke, bd-publicans, talmage-jesus-christ-29]
  - ref: 3
    phrase: he sought to see Jesus who he was
    kind: symbol
    title: To see Jesus who he was
    body: |
      The story of Zacchaeus is full of seeing. He seeks to see, cannot see, climbs to see; Jesus looks up and sees him; the crowd sees and murmurs. Luke has just told of a blind man on the road into Jericho who received his sight ([[Luke 18:35–43]]), and the two stories are best read together, as an account of spiritual sight, of seeing “who he was.” Luke gives no reason for Zacchaeus’s wish. It was likely more than curiosity: he may have heard enough of this teacher to be set thinking, and may have known that Jesus welcomed tax collectors such as Levi ([[Luke 5:27–29]]).

      What kept him from seeing was not only his height. “The press” is the crowd, and a crowd that disliked him seems not to have let him squeeze through. So the rich official ran ahead and climbed a tree. The “sycomore” is the sycamore fig, a tree common in the open places of New Testament Jericho, not the mulberry of [[Luke 17:6]].
    sources: [brown-testimony-luke, talmage-jesus-christ-29]
  - ref: 5
    phrase: to day I must abide at thy house
    kind: christ
    title: To day I must abide at thy house
    body: |
      Zacchaeus came to look; Jesus came to stay. “Must” (Greek *dei*) points to a purpose: Jesus had planned to bless this man and his household, and He calls him by name before Zacchaeus has said a word. “To day” is emphatic too. Luke uses it for the moments the Savior brings, from the angels’ “unto you is born this day” ([[Luke 2:11]]) and “This day is this scripture fulfilled” ([[Luke 4:21]]) to the promise on the cross, “To day shalt thou be with me in paradise” ([[Luke 23:43]]). Verse 9 answers verse 5 with the same word: “This day is salvation come to this house.”

      Zacchaeus “received him joyfully,” with the verb Luke used of Martha welcoming Jesus into her home ([[Luke 10:38]]), and in Luke joy goes with salvation and repentance. The visit may have been more than a meal, since the verb “abide” can also mean to lodge or spend the night.
    sources: [brown-testimony-luke]
  - ref: 7
    phrase: they all murmured
    kind: words
    title: They all murmured
    body: |
      The crowd is not shocked by a meal; it is shocked by whose house Jesus has chosen. All publicans were sinners in Jewish eyes, and the chief publican most of all. The verb for their murmuring recalls Israel murmuring in the wilderness, as the Pharisees’ did in [[Luke 15:2]] (see the note there), and here it it makes the Savior’s act look like an ordinary man’s poor judgment.
    sources: [talmage-jesus-christ-29, brown-testimony-luke]
  - ref: 8
    phrase: I restore him fourfold
    kind: history
    title: I restore him fourfold
    body: |
      Zacchaeus stands up to answer the crowd, as an accused man stands before a judge. His words recall other defenses in scripture, such as Samuel’s: “whom have I defrauded? … and I will restore it you” ([[1 Sam. 12:3]]). Half of his property goes to the poor, a deliberate contrast with the rich ruler of the chapter before, who went away sad because he was very rich ([[Luke 18:22–23]]). The despised man is generous; the respected man was not.

      The second promise goes beyond the law. Restitution under the law of Moses was in some cases fourfold or fivefold (“four sheep for a sheep,” [[Ex. 22:1]]; compare David’s judgment in [[2 Sam. 12:6]]), and in others the principal and a fifth more ([[Lev. 6:5]]). Zacchaeus takes the steepest rate for anything he finds he has taken wrongly. The Joseph Smith Translation reads “by unjust means” for “by false accusation,” which widens the promise: it covers any wrong he finds he has done, not only one someone has accused him of. These are “works meet for repentance,” in line with the law of restitution but far beyond what it required.
    sources: [brown-testimony-luke, talmage-jesus-christ-29, lds-scriptures]
  - ref: 9
    phrase: he also is a son of Abraham
    kind: words
    title: He also is a son of Abraham
    body: |
      Jesus speaks to the crowd as much as to Zacchaeus. They had written him off as a renegade; Jesus says he is a son of Abraham, a Jew of the covenant family, and, by his response, an honorable one. Salvation comes “to this house,” to the household and not the man alone. In Hebrew the word “salvation” is also a play on the name Jesus, which means salvation, so the sentence can be heard two ways: salvation has come to this house because Jesus has come into it.
    sources: [brown-testimony-luke]
  - ref: 10
    phrase: to seek and to save that which was lost
    kind: christ
    title: To seek and to save that which was lost
    body: |
      This sentence sums up the ministry Luke has told since Galilee, and it closes Jesus’s work away from Jerusalem. Its words echo Ezekiel’s prophecy against the shepherds of Israel, who fed themselves and not the flock. The Lord promised to come as shepherd Himself: “I will seek that which was lost, and bring again that which was driven away, and will bind up that which was broken” ([[Ezek. 34:16]]). Jesus says that the Son of Man has come to do it.

      It also gathers up Luke 15, where Jesus answered the complaint that He received sinners with the lost sheep, the lost coin and the lost son ([[Luke 15:1–32]]). Zacchaeus is those parables come true: one more lost sheep returned, one more treasure found, one more son back in his Father’s house.
    sources: [brown-testimony-luke, talmage-jesus-christ-29, lds-scriptures]
  - ref: 11
    phrase: they thought that the kingdom of God should immediately appear
    kind: history
    title: The kingdom of God should immediately appear
    body: |
      Luke says why Jesus told the parable: the crowd expected the kingdom of God to appear at once. Jesus was near Jerusalem with a crowd of pilgrims, and many expected Him to proclaim His kingship when He reached the city. The parable answers that expectation. The would-be king goes away to a far country, and he will surely return, but the kingdom is not set up in temporal power at once.

      The time between going and returning is the point of the story. That is when the servants show what they are: they are to work with what He left them until He comes back, and then give an account. The parable answers the crowd on the road and, beyond it, the disciples who would wait for His return.
    sources: [talmage-jesus-christ-29, brown-testimony-luke]
  - ref: 12
    phrase: A certain nobleman went into a far country to receive for himself a kingdom
    kind: history
    title: A nobleman in a far country
    body: |
      To Jesus’s hearers the story would likely have recalled a recent event. When Herod the Great died in 4 BC, his son Archelaus went to Rome to have his kingship confirmed by Augustus, and a Jewish embassy of fifty went after him to ask the emperor not to give it; the citizens of verse 14 send just such a “message.” Archelaus came back with less than a crown: the lesser title ethnarch, with the title of king promised only once he had shown he could rule. Jericho had reason to remember him, for he refurbished the palace there, and such incidents were still fresh in the minds of the people Jesus was speaking to.

      The likeness goes only so far: the similarities are few, and the parable is not about Archelaus. Christ is the nobleman. He would go away, be invested with the kingdom, and return to call His servants to account; and some of His own citizens would refuse to have Him reign over them.
    sources: [brown-testimony-luke, josephus-antiquities, talmage-jesus-christ-29]
  - ref: 13
    phrase: delivered them ten pounds
    kind: words
    title: Ten pounds
    body: |
      The “pound” is the mina, a sum of 100 drachmas, roughly three months’ wages. Each of the ten servants receives one. The sum is modest on purpose: the lord calls it “a very little” (verse 17), and the reward for it is out of all proportion.

      Readers often take this as Luke’s version of the parable of the talents ([[Matt. 25:14–30]]), and the two share much: a master away, servants entrusted with money, a lazy servant dismissed, the saying about those who have. But they differ in nearly every detail. In Luke every servant gets the same sum, the profits are tenfold and fivefold, the money is kept in a napkin rather than buried, the reward is cities rather than the master’s joy, and there are enemies who refuse the king. Those differences support reading them as two parables, alike but independent, which Jesus told on different occasions for different purposes.
    sources: [brown-testimony-luke]
  - ref: 17
    phrase: have thou authority over ten cities
    kind: symbol
    title: Authority over ten cities
    body: |
      A servant who turned one pound into ten is made governor of ten cities, a reward only a sovereign could give; the second servant, with the same capital and half the gain, receives five cities in proportion. When the extra pound is handed over in verse 24, it is nothing beside the cities. The disproportion is the point: faithfulness in a very little is rewarded beyond any return on the money.

      The reward is also more work. The master does not retire his good servant; he gives him a wider field of service. The faithful are given greater responsibility, not release from it, and what they do in this life leads to reward in the next.
    sources: [talmage-jesus-christ-29, brown-testimony-luke]
  - ref: 21
    phrase: thou art an austere man
    kind: words
    title: An austere man
    body: |
      “Austere” (Greek *austēros*) means harsh, exacting, strict. It is the third servant’s description of his lord, and he uses it as an excuse: he was afraid, so he did nothing. The description is very possibly his exaggeration. When the lord repeats it, he keeps the words in the servant’s mouth, “Thou knewest,” without granting that they are true. His point is that if the servant really believed his master would demand an account, that was all the more reason to do something with the pound.

      The servant did not even do the least. A napkin was a careless place to keep money; burying it, as in Matthew’s parable, was the safe way. “The bank” is literally the moneylenders’ table, where the pound would at least have earned interest. His fault is not a loss but an omission.
    sources: [brown-testimony-luke]
  - ref: 26
    phrase: unto every one which hath shall be given
    kind: words
    title: Unto every one which hath
    body: |
      The saying sounds as if it rewards the rich, but it is about use, not wealth. The servant who has ten gets more because he has used what he was given; the one who kept his pound in a cloth has shown he cannot be trusted with it, and loses even that. The Joseph Smith Translation makes this plain by replacing the flat verb “hath” with an active one: “… who occupieth, shall be given; and from him who occupieth not, even that he hath received shall be taken away from him” (JST Luke 19:25, in the footnote). It is the verb of the lord’s charge in verse 13, “Occupy till I come,” where “occupy” means to engage in business. What is kept is what is put to work.
    sources: [brown-testimony-luke, lds-scriptures]
  - ref: 27
    phrase: bring hither, and slay them before me
    kind: history
    title: Slay them before me
    body: |
      The parable’s harsh ending is a warning of judgment on those who refuse the King, told in the colors of a ruler the hearers may have had in mind. Before he left for Rome, Archelaus had sent his army against a crowd at the temple during a festival, and his horsemen killed three thousand; when he came back, he treated his subjects with great brutality.

      But the story is told of the Lord, and the ending is a warning, not a portrait of cruelty. The citizens are not punished for a debt; they are the ones who said, “We will not have this man to reign over us.” Their fate mirrors what awaits those who oppose the Lord’s work, and some of them Jesus would face in Jerusalem within days. When He returns in power, those who refused His reign will receive the punishment they deserve. The ending may be a picture of the King at last turning the tables on those who hate Him and seek His life, even though on the cross He would pray, “Father, forgive them” ([[Luke 23:34]]).
    sources: [josephus-antiquities, brown-testimony-luke, talmage-jesus-christ-29]
  - ref: 30
    phrase: a colt tied, whereon yet never man sat
    kind: symbol
    title: A colt whereon never man sat
    body: |
      Sending for a colt to ride into the city is a royal claim. Zechariah had foretold Jerusalem’s king coming “lowly, and riding upon an ass, and upon a colt the foal of an ass” ([[Zech. 9:9]]), and the Greek translation of that verse has him ride a “new” donkey, which may be why Mark and Luke say this colt had never been ridden. Israel’s kings had ridden this way before: Solomon rode David’s mule at the foot of the Mount of Olives to be anointed, while the people shouted “God save king Solomon” ([[1 Kgs. 1:33–39]]).

      Luke does not quote Zechariah, but he shows the King in the details. Jesus knows where the colt will be and what its owners will say, and He rides an animal no one has ever sat on, both of them marks of His power. The password, “The Lord hath need of him,” is a royal claim as well: for the moment, His need overrides the owners’ title, and they let the colt go.
    sources: [huntsman-palm-sunday, brown-testimony-luke, lds-scriptures]
  - ref: 38
    phrase: Blessed be the King that cometh in the name of the Lord
    kind: scripture
    title: Blessed be the King that cometh
    body: |
      The disciples’ cry comes from Psalm 118: “Blessed be he that cometh in the name of the LORD” ([[Ps. 118:26]]). Psalm 118 closed the Hallel, the psalms sung at Passover, and it seems first to have been sung in procession as worshippers approached the temple. A week before Passover, on the road up to the temple, the crowd sings it to Jesus and adds one word: “the King.”

      Luke’s version is his own. He has no “Hosanna” and no mention of David, which Matthew and Mark have ([[Matt. 21:9]]; [[Mark 11:9–10]]); his crowd’s praise rises instead to heaven: “peace in heaven, and glory in the highest.” By recording that praise and leaving out David, Luke seems to show that some in the crowd understood that Jesus was not to be an earthly king. The words also echo what Jesus said on the road, lamenting over Jerusalem: “Ye shall not see me, until the time come when ye shall say, Blessed is he that cometh in the name of the Lord” ([[Luke 13:35]]). Now His disciples say it, but the setting of that saying was judgment, and the city itself is about to refuse Him (verses 41–44).
    sources: [huntsman-palm-sunday, brown-testimony-luke]
  - ref: 40
    phrase: the stones would immediately cry out
    kind: symbol
    title: The stones would cry out
    body: |
      Some Pharisees in the crowd ask Jesus to quiet His disciples. They may not have been hostile; Luke has shown friendly Pharisees before ([[Luke 13:31]]). But Jesus refuses. If the disciples were silent, He says, the stones would cry out.

      The saying can be heard two ways: the stones would cry out in praise of their King if His people withheld theirs, or they would cry out in accusation against the silent disciples. The first reading says that even what seems lifeless knows of His presence and would praise Him if people would not; the second makes the disciples’ silence a fault that creation itself would rebuke. Modern revelation, too, bids the mountains “shout for joy” and the “solid rocks weep for joy” ([[D&C 128:23]]). The saying was also prophetic. When He died, the earth itself responded, with darkness at midday ([[Luke 23:44–45]]) and, in the Americas, with the rocks “rent in twain” ([[3 Ne. 8:5–23]]).
    sources: [brown-testimony-luke, lds-scriptures]
  - ref: 41
    phrase: he beheld the city, and wept over it
    kind: christ
    title: He wept over it
    body: |
      Only Luke tells that Jesus wept as the city came into view, and it changes the mood of the entry: the cheering crowd goes down the mountain with a King in tears. The place adds to it. David, fleeing his son Absalom, went up the ascent of the Mount of Olives weeping, barefoot and with his head covered ([[2 Sam. 15:30]]). Jesus’s acts mirror David’s in reverse: David left the city weeping and then sent for donkeys; Jesus takes a donkey on the mountain, rides toward the city, and weeps when He sees it.

      Scripture records only a few times that Jesus wept: here; on the way to Jerusalem in the Joseph Smith Translation of [[Luke 13:34]]; at the grave of Lazarus ([[John 11:35]]); and, after His resurrection, among the Nephites ([[3 Ne. 17:21–22]]). What He mourns is “the things which belong unto thy peace,” peace of heart and also peace with Rome. Both would be lost within a generation.
    sources: [huntsman-palm-sunday, brown-testimony-luke, lds-scriptures]
  - ref: 43
    phrase: cast a trench about thee
    kind: history
    title: A trench about thee
    body: |
      The “trench” is not a ditch. The Greek *charax* means a palisade or rampart that an army throws up around a city under siege, made of stakes with earth, stones and timber packed between them. That is what happened a generation later. In the Roman siege of Jerusalem, the general Titus had his soldiers build a wall around the whole city, thirty-nine furlongs long, with thirteen garrison posts, and they finished it in three days. Then his troops stormed the temple, took the city and leveled it.

      Jesus’s words in verses 43 and 44 describe that siege before it happened: the wall, the encirclement, the city and its children dashed to the ground, not one stone left on another. He would say more about it in the temple days later ([[Luke 21:20–24]]).
    sources: [thayer, josephus-war, brown-testimony-luke]
  - ref: 44
    phrase: the time of thy visitation
    kind: words
    title: The time of thy visitation
    body: |
      A “visitation” in scripture is a visit from God, and it can go either way. It can be a visit of mercy: “the dayspring from on high hath visited us,” Zacharias sang ([[Luke 1:78]]), and at Nain the people said, “God hath visited his people” ([[Luke 7:16]]). Or it can be a visit of reckoning: “what will ye do in the day of visitation?” ([[Isa. 10:3]]). Jerusalem’s tragedy is that the visit of mercy came, and the city did not recognize it. Jesus comes into the city under praise, and within days its officials reject Him; the visitation that could have brought peace becomes the day of reckoning in verses 43 and 44.
    sources: [brown-testimony-luke]
  - ref: 46
    phrase: ye have made it a den of thieves
    kind: scripture
    title: A den of thieves
    body: |
      Luke tells the clearing of the temple in two verses, with fewer details than the other Gospels, but its place says what it means: coming right after the entry, it is the King taking charge of His house. Jesus had cleared the temple once before, early in His ministry, and called it “my Father’s house” ([[John 2:16]]).

      His words join two prophets. “mine house shall be called an house of prayer” is from [[Isa. 56:7]], where the Lord speaks of His own house; Jesus, having now openly declared Himself the Christ, takes the words as His own and calls the temple “My house.” “A den of thieves” is from Jeremiah’s sermon at the temple gate, which warned worshippers who trusted in the words “The temple of the LORD” while they stole and oppressed ([[Jer. 7:4–11]]); Jeremiah went on to foretell the temple’s destruction, as Jesus just has. The “thieves” are not pickpockets. The Greek word means robbers or bandits, men guilty of serious crime, and a den is where robbers hide: those who managed the temple’s business were hiding behind its walls, carrying their guilt into the house of God.
    sources: [huntsman-monday, talmage-jesus-christ-30, brown-testimony-luke]
  - ref: 47
    phrase: the chief priests and the scribes and the chief of the people sought to destroy him
    kind: history
    title: The chief of the people
    body: |
      The opponents change here. The Pharisees are last named at verse 39 and fade from the story. In Jerusalem the opposition comes from the chief priests, the scribes, and “the chief of the people,” the city’s leading men, who were not necessarily priests. These are the men Luke names, and he says the people were on Jesus’s side: they “were very attentive to hear him,” or as the Greek has it, they hung on Him, and the leaders could find no way to act against Him.

      Jesus does not leave the temple after clearing it. He teaches there every day, making it His headquarters for the last days of His life; Luke’s notices set the pattern of teaching in the temple by day and leaving the city at night ([[Luke 21:37–38]]). All the teaching of the next chapter takes place there.
    sources: [brown-testimony-luke, huntsman-monday]

christ: |
  Jesus names His own mission in this chapter: “the Son of man is come to seek and to save that which was lost” (verse 10). He calls a despised man down from a tree by name, and He weeps over a city that is about to reject Him. The Redeemer who seeks the lost “suffered the pain of all men, that all men might repent and come unto him,” and “how great is his joy in the soul that repenteth!” ([[D&C 18:11]], [[D&C 18:13]]). The parable sets the other half beside it: the King has gone away and will return, and “it is required of the Lord, at the hand of every steward, to render an account of his stewardship, both in time and in eternity” ([[D&C 72:3]]). No one now is beyond His seeking, since He suffered for all that all might repent; and every disciple holds from Him a stewardship that will be accounted for.

explore: |
  - **The lost.** [[Luke 15]], the lost sheep, coin and son, and the shepherd who seeks the lost in [[Ezek. 34:11–16]].
  - **The talents.** [[Matt. 25:14–30]], a parable like the pounds, told on another occasion; see the notes there.
  - **Jerusalem’s fate.** [[Luke 13:34–35]] and [[Luke 21:20–24]]; the Lord’s fuller account is in [[JS—M 1]].
  - **The other tellings.** [[Matt. 21:1–17]], [[Mark 11:1–19]] and [[John 12:12–19]]; John’s earlier clearing of the temple, [[John 2:13–17]].
  - **Further reading.** “Palm Sunday: The True King Comes to Jerusalem,” in *Greater Love Hath No Man* (Religious Studies Center), reads the entry beside David, Solomon and Zechariah.

