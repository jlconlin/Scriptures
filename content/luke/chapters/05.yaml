chapter: 5
title: From Henceforth Thou Shalt Catch Men
tagline: Jesus fills Simon’s nets and calls the fishermen, touches and cleanses a leper, forgives and heals a paralyzed man let down through a roof, calls Levi the publican, and answers His critics with a bridegroom, a patch and new wine.
when: 'Early in Jesus’s ministry in Galilee, after His rejection at Nazareth and His first days in Capernaum ([[Luke 4:16–44]])'

setting: |
  Luke 4 left Jesus in Capernaum, where He cast out an unclean spirit in the synagogue and healed the mother of Simon’s wife in Simon’s own house ([[Luke 4:31–39]]), and then preaching in the synagogues of Galilee ([[Luke 4:44]]). Luke tells the call of the fishermen after those scenes; Mark tells it before them ([[Mark 1:16–31]]). So in Luke, when Jesus asks Simon to push his boat out, Simon already knows Him as a healer and has just heard Him teach, and that colors his answer in verse 5.

  The chapter opens a new stage. For a short time in chapter 4 Jesus worked alone; here He begins to gather a community. He calls the first four of those who will become the Twelve, Simon Peter and Andrew, James and John, and then a fifth, Levi. And here, for the first time, Luke names those who will oppose Him: Pharisees and teachers of the law, come from Galilee, Judaea and Jerusalem. Their resistance grows from this chapter until it meets Jesus in Jerusalem and leads to His death.

  Matthew and Mark tell all five of these stories ([[Matt. 4:18–22]]; [[Matt. 8:1–4]]; [[Matt. 9:1–17]]; [[Mark 1:16–20]]; [[Mark 1:40–2:22]]). Only Luke tells the great catch of fish with the call, and only Luke ends with the saying “The old is better.”

thread: |
  **Luke 5 shows Jesus beginning to gather a people, and those who answer His call are not always the ones anyone would expect.**

  The chapter opens with fishermen called from their boats and closes with a parable about new wine that cannot go into old wineskins. Side by side, the two point to the community Jesus now begins to form and to the newness of what He brings, which old religious ways cannot simply hold. Between them come the people He gathers. Simon falls at His knees and calls himself a sinful man. A leper, kept apart by the law, is touched and made clean. A paralyzed man hears that his sins are forgiven before he is told to walk. A tax collector leaves his booth and fills his house with publicans and sinners.

  Jesus gives the reason in one sentence: “I came not to call the righteous, but sinners to repentance” (verse 32). Others watching do not see what He sees; they find fault, and they begin to resist. The chapter’s last words belong to the man who has drunk the old wine and wants no other.

sections:
  - range: 1-11
    heading: The great catch and the call
    plain: |
      One day the crowd was pressing around Jesus to hear the word of God as He stood beside the lake of Gennesaret. He saw two boats pulled up on the shore; the fishermen had got out and were washing their nets. He got into one of them, Simon’s, and asked him to push out a little from the land. Then He sat down and taught the people from the boat.

      When He had finished speaking, He said to Simon, “Put out into deep water, and let down your nets for a catch.” Simon answered, “Master, we worked hard all night and caught nothing. But because you say so, I will let down the nets.” When they did, they caught so many fish that their nets began to tear. They signaled to their partners in the other boat to come and help, and they came and filled both boats so full that they began to sink.

      When Simon Peter saw it, he fell down at Jesus’s knees and said, “Go away from me, Lord, for I am a sinful man.” He and everyone with him were astonished at the catch they had taken, and so were James and John, the sons of Zebedee, Simon’s partners. Jesus said to Simon, “Do not be afraid. From now on you will catch people.” When they had brought their boats to land, they left everything and followed Him.
  - range: 12-16
    heading: A leper cleansed
    plain: |
      In one of the towns there was a man covered with leprosy. When he saw Jesus he fell on his face and begged Him, “Lord, if you are willing, you can make me clean.” Jesus reached out His hand and touched him, saying, “I am willing. Be clean.” At once the leprosy left him. Jesus ordered him to tell no one, but said, “Go and show yourself to the priest, and make the offering for your cleansing that Moses commanded, as a testimony to them.” But the news about Him spread all the more, and great crowds gathered to hear Him and to be healed of their illnesses. And He would withdraw to the wilderness and pray.
  - range: 17-26
    heading: The man let down through the roof
    plain: |
      One day as Jesus was teaching, Pharisees and teachers of the law were sitting there who had come from every town of Galilee and Judaea and from Jerusalem, and the power of the Lord was there for Him to heal. Some men came carrying a paralyzed man on a bed and tried to bring him in and lay him before Jesus. Finding no way in because of the crowd, they went up on the roof and let him down on his mat through the tiles into the middle of the room, in front of Jesus. When Jesus saw their faith, He said, “Man, your sins are forgiven you.”

      The scribes and Pharisees began to reason, “Who is this who speaks blasphemies? Who can forgive sins but God alone?” Jesus knew their thoughts and answered, “Why are you reasoning this way in your hearts? Which is easier, to say, ‘Your sins are forgiven you,’ or to say, ‘Get up and walk’? But so that you may know that the Son of Man has power on earth to forgive sins”—He said to the paralyzed man—“I tell you, get up, pick up your mat, and go home.” At once the man stood up in front of them, picked up what he had been lying on, and went home praising God. Everyone was amazed and praised God, and they were filled with awe, saying, “We have seen incredible things today.”
  - range: 27-32
    heading: Levi and his feast
    plain: |
      After this Jesus went out and saw a tax collector named Levi sitting at his tax booth, and He said to him, “Follow me.” Levi left everything, got up, and followed Him. Then Levi gave a great feast for Him in his own house, and a large crowd of tax collectors and others were at table with them. The Pharisees and their scribes complained to His disciples, “Why do you eat and drink with tax collectors and sinners?” Jesus answered them, “Those who are well do not need a doctor; the sick do. I have not come to call the righteous, but sinners to repentance.”
  - range: 33-39
    heading: The bridegroom, the patch and the wine
    plain: |
      They said to Him, “John’s disciples fast often and pray, and so do the Pharisees’ disciples, but yours eat and drink.” Jesus answered, “Can you make the wedding guests fast while the bridegroom is with them? But the days will come when the bridegroom will be taken away from them, and then, in those days, they will fast.”

      He told them a parable as well: “No one tears a piece from a new garment and sews it on an old one. If he does, he will have torn the new one, and the piece from the new will not match the old. And no one pours new wine into old wineskins. If he does, the new wine will burst the skins, the wine will be spilled, and the skins will be ruined. New wine must be put into new wineskins, and both are kept. And no one who has drunk old wine wants the new right away, for he says, ‘The old is better.’”

notes:
  - ref: 2
    phrase: were washing their nets
    kind: history
    title: The same call Matthew and Mark tell
    body: |
      Matthew and Mark tell a short scene by the shore: Jesus sees two pairs of brothers at work, says “Follow me, and I will make you fishers of men,” and they leave their nets ([[Matt. 4:18–22]]; [[Mark 1:16–20]]). Luke tells a fuller story, with a sermon from Simon’s boat and a catch that nearly sinks two boats, and neither of the others has it. Read with Luke’s record as the fuller one, the other two are briefer accounts of the same call, which leave out the catch and stress the calling.

      The details are not identical. In Mark, Simon and Andrew are casting a net and James and John are mending theirs. In Luke the fishermen have come in from a night’s work and are washing their nets, cleaning out the moss and floating debris before hanging them to dry. A casting net is not built like the deep-water and drag nets of a night’s fishing, so the two scenes do not match in every detail. What Luke gives is the morning after a night that caught nothing.
    sources: [talmage-jesus-christ-14, brown-testimony-luke]
  - ref: 5
    phrase: nevertheless at thy word I will let down the net
    kind: words
    title: Master, at thy word
    body: |
      Simon’s willingness to let down the net after a night that caught nothing is easier to understand when one remembers that he already knows who is asking. In Luke’s order Jesus had healed the mother of Simon’s wife in his own house ([[Luke 4:38–39]]), and Simon had just sat in the boat while He taught. He was no stranger to Jesus’s work: Simon “had already become identified with the Master’s work,” and his words have been taken to imply the earlier discipleship John records, when Andrew brought him to Jesus at the Jordan ([[John 1:35–42]]). So the fisherman states his objection, “we have toiled all the night, and have taken nothing,” and goes anyway, “at thy word.”

      The title he uses says the same. “Master” here is not *didaskalos*, “teacher,” the word the other Gospels use, but *epistatēs*, a word for an overseer or superintendent, the one in charge, such as workmen might use of their master. Only Luke has it, and only in addressing Jesus (5:5; 8:24, 45; 9:33, 49; 17:13). It is a title of respect for the one in charge; whether it stresses His authority more than His teaching is read both ways. After the catch Simon changes the word again. In verse 8 he says “Lord.”
    sources: [talmage-jesus-christ-14, ellicott-luke, thayer, lds-scriptures]
  - ref: 8
    phrase: Depart from me; for I am a sinful man, O Lord
    kind: christ
    title: A sinful man at Jesus’ knees
    body: |
      Simon is not confessing a particular sin. The word for “sinful” (*hamartōlos*) can describe scandalous sinners, as it does Levi’s guests in verse 30, but here it has a broader moral sense, close to humility. In a few chaotic minutes of watching the nets fill and wrestling the fish into the boats, Simon has gone from seeing a powerful, impressive teacher to seeing someone whose gifts are truly divine. His cry has been read as a change of heart and perception, and so as repentance, the first step in becoming a disciple. He does not yet understand fully who Jesus is. That comes later, when he says, “The Christ of God” ([[Luke 9:20]]).

      The same thing happened to Isaiah in the temple: “Woe is me! for I am undone; because I am a man of unclean lips” ([[Isa. 6:5]]). Recognizing that one is in contact with the divine brings with it a sharp sense of one’s own sinfulness. Simon asks Jesus to leave him. Jesus does not leave. “Fear not,” He says, and He gives the sinful man work to do.
    sources: [brown-testimony-luke, ellicott-luke]
  - ref: 10
    phrase: from henceforth thou shalt catch men
    kind: words
    title: Caught alive
    body: |
      The verb Jesus uses is not the usual word for fishing. *Zōgreō* means “to capture alive,” and in the New Testament it appears only here and in Paul’s letter to Timothy, where people caught in the devil’s snare are “taken captive” ([[2 Tim. 2:26]]). Peter’s work will reverse that captivity: “by teaching thou shalt win their souls for the kingdom of God.” The fish he had caught all his life went to their death; the people he would now draw in were drawn to life eternal.

      The figure may hint at something more. A fisherman lets down a net into water he cannot see through, and what comes up is not his choosing; one reading takes this to mean that those who answer the disciples’ message will not always be the ones they expect. The rest of the chapter bears that out: the scribes who should welcome forgiveness accuse Jesus of blasphemy (verse 21), and at Levi’s table it is the sick, not those who count themselves whole, who have the physician with them (verses 31–32).
    sources: [brown-testimony-luke, thayer, talmage-jesus-christ-14]
  - ref: 11
    phrase: they forsook all, and followed him
    kind: history
    title: Leaving the nets for good
    body: |
      “They forsook all” raises a question, because John tells of Andrew and Simon following Jesus at the Jordan well before this ([[John 1:35–42]]). It is improbable that the first disciples had stayed with Him without a break. Some of those later called to the apostleship were still working as fishermen while Jesus taught in their neighborhood. Now He calls them from that work, and they leave everything to follow Him.

      What they left was not small. The fisheries of the Sea of Galilee were “a great source of wealth” with “a large export trade.” Zebedee and his sons were partners with Simon in the business, and Zebedee kept hired servants ([[Mark 1:20]]), the mark of a family in fairly comfortable circumstances. One reading takes the catch itself as provision for the families these breadwinners were leaving, fish for the market at Capernaum and most of it for Taricheae down the shore, the town also called Magdala, whose name is linked to the Greek word for dried or smoked fish. The Lord has made that promise to the Twelve in this dispensation: “I will provide for their families” ([[D&C 118:3]]).
    sources: [talmage-jesus-christ-14, bd-galilee, bd-john, brown-testimony-luke, lds-scriptures]
  - ref: 12
    phrase: a man full of leprosy
    kind: history
    title: Full of leprosy
    body: |
      “Full of leprosy” is Luke’s own description; Matthew and Mark say only “a leper” ([[Matt. 8:2]]; [[Mark 1:40]]). It tells how far the disease had gone: this man “was far advanced in the disease.” Luke alone says too that he “fell on his face” before Jesus.

      Biblical “leprosy” is not one disease. The Bible uses the word for several kinds of skin disease, and even for patches of mildew on clothing and walls ([[Lev. 13:47–59]]). What mattered was the law. A leper was unclean and lived apart: “he shall dwell alone; without the camp shall his habitation be” ([[Lev. 13:46]]; see the note at [[Matt. 8:2]] for the rest of the law).
    sources: [ellicott-luke, talmage-jesus-christ-14, bd-leprosy, lds-scriptures]
  - ref: 13
    phrase: he put forth his hand, and touched him
    kind: christ
    title: He touched him
    body: |
      The law put every leper “out of the camp” ([[Num. 5:2]]), and Jesus crossed that distance with His hand. He laid it “upon the sufferer, unclean though he was, both ceremonially and physically,” and Mark adds that He was “moved with compassion” ([[Mark 1:41]]; see the note at [[Matt. 8:2]]). That raises a question of the law, since He has touched a man the law calls unclean. One reading answers that the One who controls disease and gave the law is not hampered by ritual uncleanness as others are.

      The healing gave back more than skin. The visit to the priest that follows (verse 14) was the way of “restoring an outcast leper to the society of the community from which he had been debarred.” Compassion of this kind runs through Luke’s portrait of Jesus, and Luke alone tells of the widow of Nain and of ten lepers cleansed at once ([[Luke 7:13–15]]; [[Luke 17:11–19]]).
    sources: [lds-scriptures, talmage-jesus-christ-14, brown-testimony-luke, huntsman-lukes-jesus]
  - ref: 14
    phrase: for a testimony unto them
    kind: history
    title: Shew thyself to the priest
    body: |
      Jesus sends the man to do exactly what the law required. A person healed of a skin disease was examined by a priest outside the camp and pronounced clean; then, after washing and a week’s wait, he brought his offerings on the eighth day ([[Lev. 14:1–32]]). The charge to “tell no man” can be read in that light: rather than go off to celebrate with friends and family, the man is to go straight to the priest for his clean bill of health. “For a testimony unto them” can be read the same way, with the priest’s declaration as the testimony to the people, without which the community would not receive the man as clean.

      The command also shows Jesus’s regard for the law of Moses. Luke has already shown Zacharias and Elisabeth, and Mary and Joseph, keeping it ([[Luke 1:6]]; [[Luke 2:22–24]]), and Jesus will later say that “it is easier for heaven and earth to pass, than one tittle of the law to fail” ([[Luke 16:17]]). He touched the man the law kept at a distance, and then sent him to do what the law asked.
    sources: [brown-testimony-luke, egt-mark]
  - ref: 16
    phrase: he withdrew himself into the wilderness, and prayed
    kind: christ
    title: Prayer, and the power to heal
    body: |
      Mark says that after this healing Jesus could no longer openly enter a town and stayed out in desert places because of the crowds ([[Mark 1:45]]). Luke has the crowds too (verse 15), and he adds what Jesus did out there: He prayed. Luke shows Jesus praying where the other Gospels do not, at His baptism, here, the night before He chose the Twelve, before Peter’s confession and on the mount of the Transfiguration ([[Luke 3:21]]; [[Luke 6:12]]; [[Luke 9:18]]; [[Luke 9:28–29]]), often at moments when great events were about to happen. In Luke’s telling, prayer was “the very lifeline between the Father and the Son.”

      The footnote sets beside this verse the morning He went out alone into a desert place after His first sabbath in Capernaum ([[Luke 4:42]]; Mark says He prayed there, [[Mark 1:35]]). That prayer showed that, “Messiah though He was, He was profoundly conscious of His dependence upon the Father, whose work He had come to do.” Luke’s next words have been read as the fruit of the prayer: “the power of the Lord was present to heal” (verse 17). The better manuscripts read “him” there rather than “them,” so that the sense is that the power of God was present for His work of healing.
    sources: [ellicott-luke, keller-mark-luke, lds-scriptures, talmage-jesus-christ-14, brown-testimony-luke]
  - ref: 17
    phrase: Pharisees and doctors of the law
    kind: history
    title: Pharisees and teachers of the law
    body: |
      Here, for the first time in his Gospel, Luke names the Pharisees. They were a religious party whose name means “separatists,” proud of their strict keeping of the law. The “doctors of the law” (*nomodidaskaloi*) were teachers and interpreters of the law, close kin to the scribes who appear in verse 21. The scribes’ work was to develop the law in detail and apply it to their own day, and so an oral law grew up beside the written one; as a rule they were Pharisees, and as a class they opposed the Lord “mainly because He disregarded the ‘traditions of the elders.’”

      That some had come from Judaea and Jerusalem matters. Jesus had already worked in Jerusalem at the Passover ([[John 2:13–25]]), and that earlier work may help explain the part these men now take. The official class had opposed Him before, and their presence in the house “boded further unfriendly criticism and possible obstruction.” In this scene they only sit, watch and reason in their hearts.
    sources: [lds-scriptures, bd-pharisees, thayer, bd-scribe, ellicott-luke, talmage-jesus-christ-14]
  - ref: 19
    phrase: let him down through the tiling
    kind: history
    title: Through the tiling
    body: |
      Mark says the bearers “uncovered the roof” and “broken it up” ([[Mark 2:4]]); Luke says they let the man down “through the tiling,” and his Greek word is for ceramic roof tiles. The difference has drawn attention because of what archaeology shows. Excavated houses at Capernaum had flat roofs of beams, reeds and dried mud, the kind Mark describes, and no first-century house there has produced a roof tile; in Roman Galilee such tiles turn up mostly on monumental buildings and upper-class houses in towns. On that evidence it has been concluded that Luke pictured the kind of house his urban Gentile readers knew. Others answer that tiled roofs are attested on Palestinian houses in the first century BC, so Luke’s word need not be an adaptation.

      The question is not settled, and Luke, unlike Mark, does not say the house was in Capernaum or name any town. The scene is the same either way. The men climbed up, as many houses had an outside stairway to the roof, opened it above Jesus, and lowered the man on his mat “into the midst before Jesus.”
    sources: [grey-peter-capernaum, brown-testimony-luke]
  - ref: 20
    phrase: Man, thy sins are forgiven thee
    kind: christ
    title: Their faith, and forgiveness first
    body: |
      “Their faith” is first the faith of the friends who carried the man and would not be stopped by a crowd or a roof. It is what drew out the miracle. But Jesus answers it in a way no one expected: the man was brought to be healed, and Jesus speaks first of his sins.

      The man may have been afraid; he may have known that his ailment came from his own wrongdoing, and he may have expected to hear nothing but condemnation. In his case there was, on one reading, “plainly a close connection between his past sins and his present affliction,” but that is no rule for every illness; of a man born blind Jesus said, “Neither hath this man sinned, nor his parents” ([[John 9:3]]). Jesus would also have known the words would provoke the critics sitting by, and one reading takes it that He said them on purpose, drew the objection out, and then answered it with power anyone could see.
    sources: [brown-testimony-luke, talmage-jesus-christ-14]
  - ref: 21
    phrase: Who can forgive sins, but God alone?
    kind: christ
    title: Blasphemy, unless He is God
    body: |
      The scribes are right that forgiving sins belongs to God. Blasphemy is contemptuous speech about God, or about what stands in a sacred relation to Him; at its core it is “claiming for human or demon power the prerogatives of God,” and to forgive sins is such a prerogative. Jesus was accused of blasphemy on several occasions for claiming that right, and those charges would have been true if He had not actually been all that He said He was (see the note at [[Mark 2:7]]). So their charge turns entirely on who Jesus is: if He were not all that He said He was, it would be true.

      These were men who “incessantly wrote and talked of the coming of the Messiah, yet rejected Him when He was there present.” Jesus answers their unspoken charge by doing in front of them what they said only God could do: before people of all classes He “openly asserted His divinity, and affirmed the same by a miraculous manifestation of power.”
    sources: [bd-blasphemy, talmage-jesus-christ-14]
  - ref: 23
    phrase: Whether is easier
    kind: scripture
    title: Does it require more power?
    body: |
      The Joseph Smith Translation states Jesus’s question in terms of power: “Does it require more power to forgive sins than to make the sick rise up and walk?” (JST Luke 5:23). Put that way, the question invites the answer that neither is beyond Him. One explanation, offered as a question rather than a ruling, is that, spoken with authority by Him, the two sayings “were of allied meaning”: He “claimed and possessed the right and the power to remit both physical and spiritual penalties, to heal the body of visible disease, and to purge the spirit of the no less real malady of sin.” Words of forgiveness could not be put to any outward test; the command to walk could. So the healing everyone saw stood as proof of the forgiveness no one could see (see the note at [[Mark 2:10]]).

      The word for “power” in verse 24 (*exousia*) is authority as well as power, here “the divine authority granted to Jesus as Messiah.” “The Son of man” appears there for the first time in Luke. It is the title Jesus uses of Himself and no one else uses of Him, and in this saying (in Mark’s telling, [[Mark 2:10]]) it probably carries the sense of honor and dignity, “as head and founder of the kingdom of God.” Latter-day revelation joins the title to the Father’s name: in the language of Adam, Man of Holiness is His name, “and the name of his Only Begotten is the Son of Man, even Jesus Christ” ([[Moses 6:57]]).
    sources: [lds-scriptures, talmage-jesus-christ-14, ellicott-matthew, thayer, bd-son-of-man]
  - ref: 26
    phrase: We have seen strange things to day
    kind: words
    title: Strange things
    body: |
      “Strange” here does not mean odd. The Greek *paradoxa* means, by its parts, things contrary to opinion: “unexpected, uncommon, incredible, wonderful,” things beyond expectation. The words are Luke’s own. Mark has “We never saw it on this fashion” ([[Mark 2:12]]), and Matthew says the multitudes “glorified God, which had given such power unto men” ([[Matt. 9:8]]); what all three share is that the people glorified God. They had heard Jesus forgive a man’s sins with a word and then watched him carry home the bed he had been lowered on, and their amazement was mingled with reverence for the God “of whose power they were witnesses.”
    sources: [thayer, ellicott-luke, lds-scriptures, talmage-jesus-christ-14]
  - ref: 27
    phrase: a publican, named Levi, sitting at the receipt of custom
    kind: history
    title: Levi at the toll booth
    body: |
      Levi was a customs officer. Publicans leased from the ruler the right to collect customs at a territorial border for an agreed sum and kept whatever they took beyond it, so their living depended on what they could get from travelers, and they were commonly considered corrupt. Levi’s post was a customs station east of Capernaum on the main road, near the border between the territories of Herod Antipas and Philip, and what he collected likely went to Antipas. He seems to have been one of the minor officials who sat at the booth, not a chief who hired others. Luke’s verb for “saw” is an intent one, “to gaze at, to observe,” and it has been read to mean that Jesus looked past a despised trade to the man’s character.

      Mark calls him “Levi the son of Alphæus” ([[Mark 2:14]]), and the Gospel of Matthew, telling the same call, names him Matthew ([[Matt. 9:9]]). The Church’s reference works take them as one man: Matthew was “known before his conversion as Levi,” a tax gatherer at Capernaum, and the Gospel of Matthew itself lists “Matthew the publican” among the Twelve ([[Matt. 10:3]]). The identification has been doubted, chiefly because a man called by two Semitic names would be rare.
    sources: [trotter-judea-province, brown-testimony-luke, bd-matthew]
  - ref: 30
    phrase: Why do ye eat and drink with publicans and sinners?
    kind: history
    title: Why the meal offended
    body: |
      Levi’s feast was a large one, and Jesus was its guest of honor, reclining at table with Levi’s friends, publicans like himself and others. For the Pharisees, eating together was a matter of holiness. Those who kept the ritual cleanness of the priests in their own homes let the holiness of the temple dwell at their tables, and publicans were specifically excluded from that fellowship. By eating with the ritually unclean, Jesus would also threaten the purity of any Pharisee who hosted Him.

      The critics “murmured” and put their question to the disciples, but Jesus answers for them, and in the next two verses He states His purpose.
    sources: [brown-testimony-luke, lane-hostility]
  - ref: 32
    phrase: I came not to call the righteous, but sinners to repentance
    kind: scripture
    title: Not the righteous, but sinners
    body: |
      On its face the saying should not have upset the Pharisees. They would have agreed that tax collectors and sinners were sick and needed a physician, and they could count themselves among the whole. The sting is in the irony: “the righteous” may well mean the critics themselves. Righteous, law-abiding people face the same challenge, to recognize that all sin. Where keeping the law becomes one’s justification before God, admitting a flaw is no longer an option. Whatever the irony, Jesus states His purpose plainly: He came to call people to repentance.

      The Book of Mormon has the same saying, in words of Christ revealed to Mormon, with its two halves reversed: “I came into the world not to call the righteous but sinners to repentance; the whole need no physician, but they that are sick” ([[Moro. 8:8]]). The Lord gave it in answer to Mormon’s question about baptizing little children and applied it at once: “wherefore, little children are whole.” Where questions have been raised about whether Jesus really said this, Latter-day Saint readers take its appearance in the Book of Mormon, in the Lord’s own voice, as a witness that He did.
    sources: [lane-hostility, brown-testimony-luke, lds-scriptures]
  - ref: 35
    phrase: the bridegroom shall be taken away from them
    kind: christ
    title: The bridegroom taken away
    body: |
      Jesus answers a question about fasting with a wedding. The question sets two groups of devout people, who “fast often, and make prayers,” against Jesus’s disciples, who eat and drink; Luke does not say who asked it, and Matthew says it was John’s disciples ([[Matt. 9:14]]). “The children of the bridechamber” are the wedding guests, and His question is phrased in Greek to expect the answer no: no one makes the guests fast while the bridegroom is at the feast. If, as Matthew says, John’s disciples asked, they would have remembered that their own teacher had called himself the bridegroom’s friend and told them plainly who the Bridegroom was ([[John 3:29]]).

      Then the image turns: “the days will come, when the bridegroom shall be taken away from them.” This may be the first recorded hint in Jesus’s public teaching of His coming death; His earlier words about the serpent lifted up were spoken to Nicodemus ([[John 3:14]]). The fast is postponed, not abolished. The days are coming when His disciples will fast, and the saying affirms its lasting value.
    sources: [brown-testimony-luke, talmage-jesus-christ-14, ellicott-matthew]
  - ref: 36
    phrase: No man putteth a piece of a new garment upon an old
    kind: symbol
    title: A patch cut from a new garment
    body: |
      Luke’s patch is stranger than Matthew’s or Mark’s. In theirs, a piece of new cloth sewn onto an old garment pulls away from it, “and the rent is made worse” ([[Mark 2:21]]). In Luke the patch is “taken out of the new” garment, and the folly is double: the new garment is ruined, and the piece does not match the old one anyway. Only Luke has that last clause, “agreeth not with the old,” and it sharpens the contrast between old and new. The Joseph Smith Translation leaves out “the piece that was taken out of the new” and reads “new cloth” for “new garment,” which brings the patch back toward Matthew’s and Mark’s new cloth; the clause about the misfit with the old remains.

      The wine makes the same point. The “bottles” were wineskins, and leather grows brittle with age; new wine, still fermenting and giving off gas, would burst an old skin, and both would be lost. What Jesus brought was not a repair of the old; His aim has been read as not to reform but to restore and to change. The gospel He taught was a new revelation, “no mere addendum, nor … a reenactment of past requirements”; it “embodied a new and an everlasting covenant.”
    sources: [ellicott-luke, brown-testimony-luke, talmage-jesus-christ-14]
  - ref: 39
    phrase: The old is better
    kind: words
    title: The old is better
    body: |
      This last saying describes rather than judges. It voices the view of the person who holds on to old ways and old beliefs and does not want to change. A man who has been drinking old wine does not want the new straightaway; the word for “better” (*chrēstoteros*) is “pleasanter” or “milder,” the taste he knows. The saying explains, gently, why Jesus’s critics resist Him: they are holding on to what they know, shrinking from the freedom He showed.

      Jesus does not say the old is better. He says that is what the drinker says.
    sources: [brown-testimony-luke, thayer, ellicott-luke]

christ: |
  Luke 5 shows Jesus Christ with power over the deep, over disease and over sin, and its height is the claim only God could make good: “the Son of man hath power upon earth to forgive sins” (verse 24). He came “not to call the righteous, but sinners to repentance,” and when a man fell at His knees confessing that he was sinful, He said “Fear not” and gave him work to do. A sense of one’s own unworthiness does not shut a disciple out of that call, for the Lord still says, “I, the Lord, forgive sins unto those who confess their sins before me and ask forgiveness” ([[D&C 64:7]]).

explore: |
  - **The other tellings.** [[Matt. 4:18–22]] and [[Mark 1:16–20]] for the call by the shore; [[Matt. 8:1–4]] and [[Mark 1:40–45]] for the leper; [[Matt. 9:1–17]] and [[Mark 2:1–22]] for the paralyzed man, Levi and the question about fasting, where Mark adds the four bearers who dig through the roof.
  - **The second great catch.** [[John 21:1–11]], where after the Resurrection the disciples fish all night and catch nothing until the risen Lord tells them where to cast the net.
  - **Forsaking all.** [[Luke 14:25–33]], the cost of discipleship, which the footnote to verse 11 sets beside “they forsook all.”

