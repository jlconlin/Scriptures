chapter: 2
title: The Birth of Jesus and the Boy in the Temple
tagline: Born under an emperor’s decree and laid in a manger, the child is announced to shepherds, recognized in the temple by Simeon and Anna, and found at twelve about His Father’s business.
when: 'The birth before the death of Herod the Great in the spring of 4 BC (if Jesus died in April AD 30, as one Latter-day Saint reckoning holds, in 5 BC or early 4 BC); the presentation at the end of the forty days the law set for a mother’s purification; the Passover visit when Jesus was twelve'

setting: |
  Luke 2 completes the infancy stories that began with Zacharias in the temple. Luke tells the birth from Mary’s side, as Matthew tells it from Joseph’s: the census, the journey from Nazareth to Bethlehem, and shepherds rather than wise men at the manger. He is the only Gospel writer who ties his story to the dates of world history, beginning with a decree of Caesar Augustus, emperor from 27 BC to AD 14.

  Except for the birth itself, which Matthew reports in a single verse ([[Matt. 1:25]]), everything in the chapter is Luke’s alone: the shepherds, the presentation in the temple with Simeon and Anna, and the boy of twelve among the teachers. Matthew’s wise men and the flight into Egypt ([[Matt. 2:1–23]]) have no place in Luke’s account.

  The chapter moves among three towns. Nazareth is the family’s home; Bethlehem is the town of David, where the birth takes place; and in Jerusalem what has happened is confirmed in the temple, first by Simeon and Anna and then by the boy Himself. Jerusalem will be the goal of Jesus’s long journey in the middle of the Gospel, and the place of His death.

thread: |
  Luke 2 is about **finding the child**, and about who is given to find Him. An emperor sets the world moving with a decree, and the decree brings Joseph and his betrothed wife to David’s town, where her firstborn is laid in a feeding trough. The contrast between Augustus’s splendor and the Son of God’s first bed is part of the message.

  Those sent to find Him are shepherds, told by an angel and given a sign to search by (verses 8–20). Forty days later, in the temple, the Spirit brings two witnesses to Him, Simeon and Anna, who recognize who the child is (verses 22–38). Twelve years on, His parents seek Him sorrowing for three days and find Him in the temple again (verses 41–50). Now He is no longer the one spoken about but the one speaking, and the first thing Luke shows of His work is teaching.

  The temple holds these stories together, as it has since Zacharias’s vision in chapter 1, and seeking and finding runs through all of them. The chapter ends quietly: the boy who astonished the teachers goes home, is subject to His parents, and grows.

sections:
  - range: 1-7
    heading: The birth in Bethlehem
    plain: |
      In those days Caesar Augustus issued a decree that the whole Roman world should be enrolled in a census. (This enrollment was first made when Quirinius was governor of Syria.) Everyone went to be registered, each to his own town. Joseph went up from Nazareth in Galilee to Judea, to Bethlehem, the town of David, because he belonged to David’s house and family. He went to be registered with Mary, who was betrothed to him and expecting a child. While they were there, the time came for her to give birth. She gave birth to her firstborn son, wrapped Him in swaddling bands, and laid Him in a manger, because there was no place for them in the lodging.
  - range: 8-20
    heading: The shepherds
    plain: |
      In the same region there were shepherds living out in the fields, keeping watch over their flock through the night. An angel of the Lord stood before them, and the glory of the Lord shone around them, and they were terrified. The angel said, “Do not be afraid. I bring you good news of great joy for all the people. Today in the city of David a Savior has been born for you, who is Christ the Lord. This will be the sign for you: you will find a baby wrapped in swaddling bands and lying in a manger.” Suddenly a great company of heaven’s host was with the angel, praising God and saying, “Glory to God in the highest, and on earth peace, and God’s good will among people.”

      When the angels had gone back into heaven, the shepherds said to one another, “Let us go to Bethlehem and see this thing the Lord has told us about.” They hurried off and found Mary and Joseph, and the baby lying in the manger. When they had seen Him, they spread the word they had been told about this child, and everyone who heard was amazed at what the shepherds said. But Mary treasured all these things and pondered them in her heart. The shepherds went back, glorifying and praising God for all they had heard and seen, just as they had been told.
  - range: 21-24
    heading: The name, and the presentation in the temple
    plain: |
      On the eighth day, when the child was circumcised, He was named Jesus, the name the angel had given before He was conceived. When the days of purification required by the law of Moses were complete, they brought Him up to Jerusalem to present Him to the Lord. (The law of the Lord says, “Every firstborn male shall be called holy to the Lord.”) They also offered the sacrifice the law prescribes: “a pair of turtledoves, or two young pigeons.”
  - range: 25-35
    heading: Simeon
    plain: |
      There was a man in Jerusalem named Simeon, righteous and devout, who was waiting for the comfort God had promised Israel, and the Holy Ghost was upon him. The Holy Ghost had revealed to him that he would not die before he had seen the Lord’s Messiah. Led by the Spirit, he came into the temple, and when the parents brought in the child Jesus to do for Him what the law required, Simeon took Him in his arms, praised God, and said: “Lord, now You let Your servant go in peace, as You promised, for my eyes have seen Your salvation, which You have prepared in the sight of all peoples: a light of revelation to the Gentiles, and the glory of Your people Israel.”

      Joseph and the child’s mother marveled at what was said about Him. Simeon blessed them and said to Mary, “This child is appointed for the fall and the rising again of many in Israel, and to be a sign that people will speak against (and a sword will pierce your own soul too), so that the thoughts of many hearts will be revealed.”
  - range: 36-38
    heading: Anna
    plain: |
      There was also a prophetess, Anna, daughter of Phanuel, of the tribe of Asher. She was very old. She had lived with her husband seven years after her marriage, and was a widow of about eighty-four years. She never left the temple, worshipping there with fasting and prayer night and day. She came up at that very moment, gave thanks to God, and spoke about the child to everyone who was waiting for the redemption of Jerusalem.
  - range: 39-40
    heading: The return to Nazareth
    plain: |
      When they had done everything the law of the Lord required, they returned to Galilee, to their own town of Nazareth. The child grew and became strong in spirit, filled with wisdom, and the grace of God was upon Him.
  - range: 41-52
    heading: The boy in the temple
    plain: |
      Every year His parents went to Jerusalem for the feast of Passover. When He was twelve, they went up as the feast required. When the days were over and they started home, the boy Jesus stayed behind in Jerusalem, and Joseph and His mother did not know it. Thinking He was somewhere in the traveling party, they went a day’s journey and then looked for Him among their relatives and friends. When they did not find Him, they went back to Jerusalem to look for Him.

      After three days they found Him in the temple, sitting among the teachers, listening to them and asking them questions. Everyone who heard Him was astonished at His understanding and His answers. When His parents saw Him, they were overwhelmed, and His mother said, “Son, why have You treated us like this? Your father and I have been searching for You in great distress.” He said to them, “Why were you searching for Me? Didn’t you know that I had to be about My Father’s affairs?” But they did not understand what He meant.

      He went down with them to Nazareth and was obedient to them, and His mother kept all these things in her heart. And Jesus grew in wisdom and in stature, and in favor with God and with people.

notes:
  - ref: 2
    phrase: this taxing was first made when Cyrenius was governor of Syria
    kind: history
    title: The census and Cyrenius
    body: |
      Luke dates the enrollment by the governor of Syria, and the difficulty is the governor. Cyrenius, in Latin Publius Sulpicius Quirinius, was legate of Syria in AD 6–7, and Josephus reports a census under him then, after Herod’s son Archelaus was deposed; it is “the taxing” Gamaliel recalls in [[Acts 5:37]]. But Matthew places the birth in the reign of Herod, who died in 4 BC. No other record of an earlier census survives, and on those grounds most scholars judge Luke’s note mistaken.

      Latter-day Saint scholarship offers two answers, neither proven. The Greek word translated “first” can also be read “earlier” or “before,” so that the line means this enrollment came earlier than the one made when Quirinius governed Syria; even scholars who doubt Luke grant that the Greek permits that reading. And Herod, who brought Roman ways into his kingdom, very likely took censuses of his own for taxes, through the village scribes who are attested in Palestine then, though no ancient writer mentions it. Luke may name Quirinius because his census, which stirred Jewish resistance against Rome, was the one people remembered. The question remains open; perhaps only new evidence will settle it.
    sources: [skinner-life-jesus, brown-testimony-luke]

  - ref: 4
    phrase: unto the city of David, which is called Bethlehem
    kind: scripture
    title: Bethlehem, in the land of Jerusalem
    body: |
      Joseph goes to Bethlehem because he is “of the house and lineage of David,” and Luke calls the town “the city of David,” here and in verse 11, though in the Old Testament that title belongs to Jerusalem ([[2 Sam. 5:7]]). Bethlehem was David’s home ([[1 Sam. 16:1]]) and the town Micah named for the coming ruler ([[Micah 5:2]]). Mary too was most likely of David’s line, with family from the same district; it was a region she knew, since she could readily find her cousin Elisabeth there ([[Luke 1:39–40]]).

      A reader of the Book of Mormon remembers that Alma said the Son of God “shall be born of Mary, at Jerusalem which is the land of our forefathers” ([[Alma 7:10]]). His full phrase points to the land rather than the city. In one of his letters to Pharaoh, a man named ʿAbdi-Ḫeba mentions “a town of the land of Jerusalem, Bit-Lahmi by name,” judged an almost certain reference to Bethlehem, and a seal impression of the seventh century BC from Bethlehem, found in Jerusalem, shows the town as one of the city’s satellite settlements. Bethlehem was evidently part of the land of Jerusalem in antiquity. Alma likely used the wider name because his hearers in the New World did not know the region round about Jerusalem.
    sources: [brown-testimony-luke, sc-knowhy-495, lds-scriptures]

  - ref: 5
    phrase: Mary his espoused wife
    kind: history
    title: Espoused, and traveling together
    body: |
      Luke still calls Mary Joseph’s “espoused wife,” his betrothed, on the road to Bethlehem, though Matthew says Joseph had already “took unto him his wife” ([[Matt. 1:24]]). Under the law of Moses a betrothed couple were already husband and wife, and unfaithfulness during the betrothal could be punished by death; but until the celebration that began their life together, a strict chastity was kept ([[Matt. 1:25]]). Luke’s word fits that: he never says their marriage had been consummated, yet they are close enough to travel together to a distant town, no doubt on foot and with others.

      Why Mary went at all is not certain. Women were exempt from such enrollments in Egypt but not in Syria, and she may have held or stood to inherit land near Bethlehem, as women in antiquity could.
    sources: [skinner-life-jesus, brown-testimony-luke]

  - ref: 7
    phrase: there was no room for them in the inn
    kind: words
    title: What the inn was
    body: |
      The Greek word behind “inn” is *katalyma*, which can mean an inn, a guest room, or simply a room. Luke uses it again for the “guestchamber” where Jesus eats the Last Supper ([[Luke 22:11]]), while the inn to which the good Samaritan brings the wounded man is another word, *pandocheion* ([[Luke 10:34]]). So the verse may mean the inn of tradition, a caravanserai that rented stalls to travelers with animals and rooms upstairs to those who could pay, or the guest room of a house, perhaps a relative’s, since Joseph’s family came from Bethlehem. On that second reading the couple arrived as late guests and the child was born where the animals were kept, on the lower floor of the house or in a cave. Justin Martyr, a Christian writer of the second century, places the birth in a cave near the village.

      The Joseph Smith Translation reads “inns,” and “there was none to give room for them,” which fits either picture; Luke does not say exactly where the birth took place. What he does make plain is the contrast. The decree that sent the couple to Bethlehem came from an emperor surrounded by splendor, and the Son of God was born to parents with no home of their own in the town.
    sources: [skinner-life-jesus, brown-testimony-luke, greek-nt, lds-scriptures]

  - ref: 8
    phrase: shepherds abiding in the field
    kind: history
    title: Why shepherds
    body: |
      That the news came first to shepherds ties the birth of the Son of God to humility. Shepherds stood on one of the lowest rungs of society and drew a certain disdain, hired herdsmen especially; a later rabbinic ruling, in the Mishnah of the second century, even counted them “sinners,” a judgment the angel’s visit calls into question.

      These may also have been no ordinary shepherds. Elder Bruce R. McConkie suggested that they were men who watched the flocks raised for the temple, sheep destined for the altar “in similitude of the eternal sacrifice of Him who that wondrous night lay in a stable.” It is an apostle’s suggestion, not something Luke says. Alma taught that the Messiah’s coming would be made known by angels to “just and holy men” ([[Alma 13:26]]), and the shepherds can be read as such witnesses.

      The night watch may also say something about the season. Sheep were kept in the fields from about Passover until the first rains, roughly April to October, so the scene suggests a birth in those months; shepherds guarding their flock through the night have also been read as pointing to the spring lambing season. That second reading is disputed, and Luke gives no date.
    sources: [brown-testimony-luke, mcconkie-special-witnesses]

  - ref: 11
    phrase: a Saviour, which is Christ the Lord
    kind: christ
    title: A Saviour, born this day
    body: |
      The angel gives the child three titles, and two of them Luke uses sparingly. *Saviour* (Greek *sōtēr*, deliverer) was often used of God in the Old Testament but is rare in the Gospels: twice in Luke, here and in Mary’s song, where she says it of God ([[Luke 1:47]]), and once in John ([[John 4:42]]). *Christ* means “anointed one,” as the Hebrew *Messiah* does. The angels and Simeon (verse 26) use it of the infant, but in Luke few call Jesus by it during His ministry, and He uses it of Himself only after His resurrection, both times joined to the necessity of His suffering ([[Luke 24:26]]; [[Luke 24:46]]).

      “This day” matters too. In Luke the word marks special moments that God brings about: “This day is this scripture fulfilled in your ears” at Nazareth ([[Luke 4:21]]), “This day is salvation come to this house” for Zacchaeus ([[Luke 19:9]]), and “To day shalt thou be with me in paradise” from the cross ([[Luke 23:43]]). The angel’s “this day” to the shepherds is the first of them in the Gospel.
    sources: [huntsman-lukes-jesus, brown-testimony-luke]

  - ref: 12
    phrase: this shall be a sign unto you
    kind: symbol
    title: A sign in a feeding trough
    body: |
      The sign was something no one would expect: a newborn lying in a cattle trough. In a village with no street addresses, where, as still in Middle Eastern villages, one found a family by asking, it told the shepherds they had found the right child, and it guided their search.

      Both details of the sign carry meaning. Swaddling clothes were not the rags of Nativity art but the narrow bands every well-cared-for infant was wrapped in, made for the purpose; one Latter-day Saint reading sees in them a foreshadowing of His binding up the broken, and of His burial. The manger was His first bed. It set His humble origin against the emperor of verse 1, and it foreshadowed the Son of man who “hath not where to lay his head” ([[Luke 9:58]]). The Greek Old Testament uses Luke’s word for it, *phatnē*, in [[Isa. 1:3]], “the ass his master’s crib: but Israel doth not know”; perhaps, when the shepherds come to the manger and go away bearing witness, Israel begins to know its God.
    sources: [brown-testimony-luke, south-clothing-textiles]

  - ref: 14
    phrase: on earth peace, good will toward men
    kind: words
    title: Whose good will?
    body: |
      The King James line has three parts: glory to God, peace on earth, good will toward men. It follows the Textus Receptus, the printed Greek text the King James translators used, which reads *eudokia*, “good will.” Some manuscripts older than that text read *eudokias*, one letter longer, and modern editions such as the SBL text print it: “peace among men of good will,” or, as the sense is, “among men with whom God is pleased.”

      Either way, the good will is God’s, not the good feeling of people for one another, and the preposition is better rendered “among men.” The angels praise God for His favor toward the world, shown in the child just born.
    sources: [brown-testimony-luke, greek-nt]

  - ref: 19
    phrase: Mary kept all these things, and pondered them in her heart
    kind: history
    title: What Mary kept
    body: |
      Where those who heard the shepherds “wondered” (verse 18), Mary “kept” and “pondered.” The Greek verb means to treasure up, to hold in memory so as to reach the deeper meaning of what has happened. Her “things” may be the whole of what she had lived through since the angel came, or the “sayings,” the shepherds’ report of what the angels told them; the Greek word can mean either.

      Luke says it again at the end of the chapter: “his mother kept all these sayings in her heart” (verse 51). There the treasured thing is the scene in the temple, which can be read as the first sign that the angel’s promise that her son would “reign over the house of Jacob for ever” ([[Luke 1:33]]) was coming true, and as a sign that His mission would be one of teaching, not of revolt or conquest.
    sources: [brown-testimony-luke]

  - ref: 22
    phrase: the days of her purification according to the law of Moses
    kind: history
    title: Purification and the firstborn
    body: |
      The law of Moses set two duties after the birth of a firstborn son, and Luke brings them together. A mother was unclean for seven days and then kept from holy things for thirty-three more, forty days in all; then she brought a lamb and a pigeon or turtledove to the priest, or, “if she be not able to bring a lamb,” two turtledoves or two young pigeons ([[Lev. 12:2–8]]). Mary’s offering in verse 24 is that offering of the poor, birds at about an eighth of a denarius each. She would have watched the sacrifice from the Court of the Women, the court where, as a man, Jesus would watch a poor widow give “all the living that she had” ([[Luke 21:4]]).

      The firstborn son also belonged to the Lord ([[Ex. 13:2]]) and was redeemed for five shekels ([[Num. 18:15–16]]). Luke names that law in verse 23, but the sacrifice he reports is the mother’s purification; “to do for him after the custom of the law” (verse 27) only hints at the redemption money.

      The best manuscripts read “their purification,” and even the printed Greek texts behind the King James tradition differ here: Stephanus’s edition of 1550 reads “their,” Scrivener’s of 1894 “her.” If “their” is right, readers differ over whom it includes, Mary and Joseph or Mary and the child; the likelier sense is that Joseph as well as Mary needed purification.
    sources: [lds-scriptures, brown-testimony-luke, greek-nt]

  - ref: 25
    phrase: waiting for the consolation of Israel
    kind: words
    title: The consolation of Israel
    body: |
      Simeon waited for “the consolation of Israel,” the comfort God had promised His people. The Greek noun, *paraklēsis*, is related to the word John uses for the Holy Ghost as “the Comforter” ([[John 14:26]]), and the Holy Ghost is with Simeon in every line: it “was upon him,” it revealed that he would see the Lord’s Christ, and it brought him into the temple (verses 25–27). Luke names the Spirit three times here, as he did three times in the story of Zacharias and Elisabeth in chapter 1.

      “Just” is better “righteous,” the word Luke used of Zacharias and Elisabeth ([[Luke 1:6]]). And the verb for “waiting” returns at the end of the Gospel for Joseph of Arimathea, who “waited for the kingdom of God” ([[Luke 23:51]]). Luke frames his record with two righteous men waiting, one who held the child in the temple and one who laid His body in the tomb.
    sources: [brown-testimony-luke, wilson-atonement-foretold]

  - ref: 32
    phrase: A light to lighten the Gentiles
    kind: scripture
    title: Isaiah’s light to the Gentiles
    body: |
      Simeon’s words come from Isaiah. “A light to lighten the Gentiles” recalls the Greek of [[Isa. 42:6]] and [[Isa. 49:6]], where the Lord makes His servant a light of the Gentiles, and “the glory of thy people Israel” recalls “Israel my glory” ([[Isa. 46:13]]). Those lines belong to Isaiah’s songs of the Lord’s servant ([[Isa. 42:1–4]]; [[Isa. 49:1–6]]; [[Isa. 50:4–9]]; [[Isa. 52:13–53:12]]), who would bring a reign of righteousness and bear away the sins of his people, both King and Messiah.

      The scope is the startling part. Simeon, speaking by the spirit of prophecy, saw that the child was Savior of Gentile and Jew alike, a hope far beyond that of those of his nation. Paul and Barnabas later take up Isaiah’s words for their own mission to the Gentiles ([[Acts 13:47]]).
    sources: [brown-testimony-luke, mcconkie-special-witnesses]

  - ref: 34
    phrase: a sign which shall be spoken against
    kind: christ
    title: The fall, the rising, and the sword
    body: |
      Simeon’s second prophecy is darker, and it looks to the cross. The child is “set,” appointed, for the fall and rising again of many. The falling recalls Isaiah’s “stone of stumbling,” over which many “shall stumble, and fall, and be broken” ([[Isa. 8:14–15]]), an image that returns in [[Luke 20:18]]. The word for “rising again,” *anastasis*, is the New Testament’s word for resurrection; Tyndale translated it so here, and the line can be read “the fall and resurrection of many in Israel.”

      A “sign which shall be spoken against” is a sign rejected and opposed. It looks to Isaiah’s servant, “despised and rejected of men” ([[Isa. 53:3]]), and it was fulfilled in His Passion, when the crowd demanded His crucifixion ([[Luke 23:23]]). The sword points to Mary’s own anguish. Spoken almost in passing, the words warned her that her Son’s future would bring her anguish, and she stood by His cross ([[John 19:25]]).
    sources: [brown-testimony-luke, wilson-atonement-foretold]

  - ref: 36
    phrase: Anna, a prophetess
    kind: history
    title: Anna the prophetess
    body: |
      Anna is the second witness in the temple, and Luke presents her as coming on her own. She arrives at the end of Simeon’s words, so she does not take her cue from him, and in calling her a prophetess Luke signals that the Spirit brought her. After her years in the temple she was very likely well known in Jerusalem, and her testimony reached all who “looked for redemption,” the faithful who awaited the Messiah. Luke’s title honors her: she stands with Deborah ([[Judg. 4:4]]), Huldah ([[2 Kgs. 22:14]]) and, later, Philip’s four daughters ([[Acts 21:9]]).

      Her name is a form of Hannah, and it ties her to the story of Hannah and Samuel that runs beneath these chapters: Mary’s song resembles Hannah’s ([[1 Sam. 2:1–10]]), and Luke’s summary of the growing Jesus echoes the young Samuel (see the note on verse 52). The echo does not make Anna a symbol; she is a real woman led by inspiration. Her age is not certain: Luke may mean that she was eighty-four, or that eighty-four years had passed since her husband died. Either way she was very old, and she stands for all the widows Luke will show, good women whose place in the world is always under threat ([[Luke 21:1–4]]).
    sources: [brown-testimony-luke, mcconkie-special-witnesses]

  - ref: 39
    phrase: they returned into Galilee, to their own city Nazareth
    kind: history
    title: From the temple to Nazareth
    body: |
      Luke goes straight from the temple to Nazareth. He says nothing of the wise men, Herod’s killing of the children, or the flight into Egypt, which Matthew tells ([[Matt. 2:1–23]]), and he does not say how long the family stayed in Judea; neither Gospel says how the two accounts fit together in time. Matthew’s stay in Egypt was probably brief, for Herod did not long survive the children he killed at Bethlehem.

      Whether Luke passed over those events on purpose does not change his point. Nazareth is “their own city,” where the angel came to Mary ([[Luke 1:26–27]]), and in returning to it Joseph and Mary could raise the child far from the halls of power in Jerusalem, out of sight of the hostile and the influential, who, as Matthew shows, sought the young child’s life.
    sources: [brown-testimony-luke, talmage-jesus-christ-9]

  - ref: 42
    phrase: when he was twelve years old
    kind: history
    title: Twelve years old
    body: |
      Twelve is not the age of a bar mitzvah, which became a regular rite of Jewish life only in the fifteenth century. The rabbinic sources, written later than Jesus’s day, set a boy’s duties in stages: the Mishnah did not oblige a child to attend the three great feasts, and a second-century teacher held that at thirteen a boy became responsible for the commandments. But a boy “twelve years old and one day” was held to his vows, an age at which his words meant something.

      The family’s yearly journey (verse 41) shows their faithfulness. Men were required to attend; women were exempt, especially while caring for small children, yet were expected at Passover if they were able, and Mary went.
    sources: [brown-testimony-luke]

  - ref: 44
    phrase: supposing him to have been in the company
    kind: history
    title: Lost for three days
    body: |
      Pilgrims traveled to and from the feasts together, for safety, and poor pilgrims went on foot; this company included the family’s “kinsfolk and acquaintance,” so a boy of twelve could easily be supposed among them for a day. If, as seems probable, Joseph and Mary missed Him at the end of the day’s walk, they would have walked back through most of the night to reach Jerusalem by morning, and then searched for Him in a city where people were found not by address but by asking. That may explain the edge in Mary’s question, “Son, why hast thou thus dealt with us?” (verse 48).

      “After three days” is not Luke’s phrase for the Resurrection, which is “the third day” ([[Luke 24:7]]); the length of the search seems to carry no hidden meaning.
    sources: [brown-testimony-luke]

  - ref: 46
    phrase: both hearing them, and asking them questions
    kind: scripture
    title: Who was asking whom?
    body: |
      In the King James verse the boy listens to the teachers and asks them questions; the Joseph Smith Translation reverses it: “they were hearing him, and asking him questions.” The teachers are the listeners, and Jesus is not the learner but the teacher, even at twelve. That fits the next verse, where all who heard Him “were astonished at his understanding and answers.”

      The Joseph Smith Translation says the same of His youth in Matthew: “he spake not as other men, neither could he be taught; for he needed not that any man should teach him” (JST Matt. 3:25). The boy among the doctors is the one Joseph Smith described: “When still a boy [Jesus Christ] had all the intelligence necessary to enable Him to rule and govern the kingdom of the Jews, and could reason with the wisest and most profound doctors of law and divinity.” Verse 52 adds the other half of the same truth: the boy who taught the teachers still grew.
    sources: [jst-luke-2, brown-testimony-luke, jst-matt-3, tpjs-2007-ch-3]

  - ref: 49
    phrase: about my Father’s business
    kind: words
    title: The things of my Father
    body: |
      Mary says “thy father and I”; Jesus answers with “my Father.” The Greek of His reply is shorter than the King James: literally “in the things of my Father,” which the translators filled out as “about my Father’s business,” meaning that He was now engaged in His Father’s affairs. It can also be read “in my Father’s house,” the place where He had spent those three days.

      His parents “understood not the saying” (verse 50), though angels had told them who He was. Perhaps Jesus had lived a normal childhood and was now stepping out of it to take up the work that was His to carry. The scene shows what that work would be: teaching. Years later He would come to the same temple, drive out those who had made it a den of thieves, and call it “My house” ([[Luke 19:46]]).
    sources: [brown-testimony-luke]

  - ref: 52
    phrase: Jesus increased in wisdom and stature
    kind: scripture
    title: From grace to grace
    body: |
      Luke closes the chapter as he closed the boyhood of John ([[Luke 1:80]]) and as the Old Testament describes the young Samuel, who “grew on, and was in favour” with the Lord and with men ([[1 Sam. 2:26]]); a line about the young David is near it too ([[1 Sam. 18:14]]). The echo sets the boy among Israel’s prophets, judges and kings. Verse 40 had already said that “the grace of God was upon him.”

      Restoration scripture says the same of the Son’s growth. John’s record in the Doctrine and Covenants testifies that the Son “received not of the fulness at first, but continued from grace to grace, until he received a fulness” ([[D&C 93:13]]), and that He was called the Son of God for that very reason ([[D&C 93:14]]); the footnote to this verse points there. The boy whose answers astonished the teachers (verses 46–47) still increased in wisdom, as the Son received grace for grace.
    sources: [brown-testimony-luke, lds-scriptures]

christ: |
  Luke 2 gives the child three names in one line, a Saviour, Christ, and the Lord (verse 11), and then shows people finding Him: shepherds by a sign, Simeon and Anna by the Spirit, and His parents after three days of searching, who find Him about His Father’s business. Simeon holds Him and says, “mine eyes have seen thy salvation” (verse 30). In Luke the one who finds Jesus finds salvation, from this chapter to the empty tomb ([[Luke 24:5–6]]).

  The same Jesus “increased in wisdom and stature” (verse 52) and “continued from grace to grace, until he received a fulness” ([[D&C 93:13]]). The Lord gave that record so that His disciples “may understand and know how to worship,” and He promised that those who keep His commandments “shall receive of his fulness” and “shall receive grace for grace” ([[D&C 93:19–20]]). Growth by degrees, the Son’s own way, is the way open to His disciples.

explore: |
  - **Isaiah’s servant.** [[Isa. 42:1–7]] and [[Isa. 49:1–6]], the songs behind Simeon’s words in verse 32.
  - **Hannah and Samuel.** [[1 Sam. 1:21–2:11]] and [[1 Sam. 2:26]], beside Anna and the boy in the temple.
  - **Grace for grace.** [[D&C 93:6–20]], John’s record of how the Son grew to a fulness.
  - **The other telling.** [[Matt. 2:1–23]], the wise men and Egypt, which Luke passes over.
  - **The Book of Mormon’s witness.** [[Alma 7:10]] and [[1 Ne. 11:13–21]], the birth foreseen.

