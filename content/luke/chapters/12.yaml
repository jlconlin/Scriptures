chapter: 12
title: Treasure in Heaven, and Servants Who Watch
tagline: Before a vast crowd Jesus warns His disciples against the leaven of hypocrisy and tells them whom to fear, answers a man’s quarrel over an inheritance with the parable of the rich fool, bids them consider the ravens and the lilies, and teaches the servants who watch for their master, the steward who must answer, and the fire He came to kindle.
when: 'On the journey to Jerusalem'

setting: |
  Luke 12 is one long occasion of teaching, and only Luke records it as one. It follows straight on from the meal at a Pharisee’s house, where Jesus pronounced woes on Pharisees and lawyers and “the scribes and the Pharisees began to urge him vehemently” ([[Luke 11:53]]); Luke opens “in the mean time,” with a crowd so large that people trampled one another. Jesus speaks first to His disciples while the crowd listens, answers a man from the crowd, turns back to the disciples, and at the end addresses the people (verses 1, 13, 22, 54).

  Many of these sayings are also in Matthew: the sparrows and confessing Christ before men in the charge to the Twelve ([[Matt. 10:26–33]]), the ravens, the lilies and treasure in heaven in the Sermon on the Mount ([[Matt. 6:19–34]]), and the thief and the two servants on the Mount of Olives ([[Matt. 24:42–51]]). Luke’s order and setting are different, and this site reads them as teachings Jesus gave on more than one occasion. Latter-day revelation supports the reading for the sayings about His coming: on the Mount of Olives the Lord spoke of what the disciples had “asked of me concerning the signs of my coming” ([[D&C 45:16]]), and the Joseph Smith Translation adds to this chapter a whole saying about the Lord coming “as a thief in the night” (JST Luke 12:44). The Translation’s additions here are long, above all in verses 9–10 and 37–48, and several notes below turn on them.

thread: |
  **The God who sees, and the servants who watch.** The first half of the chapter is held together by God’s reach into every part of a life. Nothing hidden stays hidden (verse 2); the God who can cast into hell also counts the sparrows and the hairs of the head (verses 5–7); He gives the right words in the hour of trial (verse 12), requires the rich man’s soul on the night he had planned for many years (verse 20), feeds the ravens and clothes the grass (verses 24–28). Running through it is the question of what to do with the goods of this world, which a man’s quarrel over an inheritance raises and “where your treasure is, there will your heart be also” (verse 34) answers.

  From verse 35 to the end the subject is readiness. Servants keep their lamps burning for a master who may come in any watch of the night; a steward set over the household must answer for how he used his trust. Then Jesus speaks of Himself, of a fire already kindled and a baptism He is pressed to complete, His own coming suffering, and of the division He will bring even into households (verses 49–53). Last He turns to the crowd: they can read the sky but not “this time” (verse 56).

sections:
  - range: 1-12
    heading: The leaven of the Pharisees, and whom to fear
    plain: |
      Meanwhile, when a vast crowd had gathered, so many that they were trampling one another, Jesus began to speak first to His disciples: “Be on your guard against the leaven of the Pharisees, which is hypocrisy. Nothing is covered up that will not be uncovered, and nothing hidden that will not be made known. So whatever you have said in the dark will be heard in the light, and what you have whispered in private rooms will be proclaimed from the housetops.

      “I tell you, my friends, do not be afraid of those who kill the body and after that can do nothing more. I will show you whom to fear: fear the One who, after the killing, has power to throw you into hell. Yes, I tell you, fear Him. Are not five sparrows sold for two small coins? Yet not one of them is forgotten before God. Even the hairs of your head are all counted. So do not be afraid; you are worth more than many sparrows.

      “I tell you, whoever acknowledges me before others, the Son of Man will acknowledge before the angels of God; but whoever denies me before others will be denied before the angels of God. Anyone who speaks a word against the Son of Man will be forgiven, but whoever blasphemes against the Holy Ghost will not be forgiven. When they bring you before synagogues, rulers and authorities, do not worry about how to defend yourselves or what to say, for the Holy Ghost will teach you in that very hour what you ought to say.”
  - range: 13-21
    heading: The rich fool
    plain: |
      Someone in the crowd said to Him, “Teacher, tell my brother to divide the inheritance with me.” Jesus said to him, “Man, who appointed me a judge or an arbiter over you?” Then He said to them, “Watch out, and guard yourselves against greed, for a person’s life does not consist in the abundance of his possessions.”

      And He told them a parable: “The land of a certain rich man produced a great harvest. He thought to himself, ‘What shall I do? I have nowhere to store my crops.’ Then he said, ‘This is what I will do: I will tear down my barns and build bigger ones, and there I will store all my grain and my goods. And I will say to myself, “You have plenty of goods laid up for many years. Take it easy; eat, drink and be merry.”’ But God said to him, ‘You fool! This very night your life will be demanded of you. Then who will get all you have prepared?’ So it is with anyone who stores up treasure for himself but is not rich toward God.”
  - range: 22-35
    heading: Ravens, lilies, and treasure in heaven
    plain: |
      Then He said to His disciples: “So I tell you, do not worry about your life, what you will eat, or about your body, what you will wear. Life is more than food, and the body more than clothing. Consider the ravens: they neither sow nor reap, they have no storeroom or barn, and yet God feeds them. How much more are you worth than birds! Which of you by worrying can add a single cubit to the length of his life? If you cannot do so small a thing, why worry about the rest?

      “Consider how the lilies grow. They do not labor or spin, yet I tell you, not even Solomon in all his splendor was dressed like one of these. If God so clothes the grass of the field, which is here today and tomorrow is thrown into the oven, how much more will He clothe you, you of little faith! Do not set your hearts on what you will eat or drink, and do not be anxious. The nations of the world run after all these things, and your Father knows that you need them. Instead, seek His kingdom, and these things will be given to you as well.

      “Do not be afraid, little flock, for your Father has chosen gladly to give you the kingdom. Sell your possessions and give to the poor. Provide yourselves purses that will not wear out, a treasure in heaven that will never fail, where no thief comes near and no moth destroys. For where your treasure is, there your heart will be also. Be dressed ready for service, and keep your lamps burning.”
  - range: 36-48
    heading: Servants who watch, and the steward who must answer
    plain: |
      “Be like servants waiting for their master to return from a wedding feast, so that when he comes and knocks they can open the door to him at once. Blessed are those servants whom the master finds watching when he comes. Truly I tell you, he will dress himself to serve, have them sit down to eat, and come and wait on them. Blessed are they if he comes in the second watch of the night, or in the third, and finds them ready. Understand this: if the owner of the house had known at what hour the thief was coming, he would have kept watch and not let his house be broken into. You too must be ready, because the Son of Man will come at an hour when you do not expect Him.”

      Peter asked, “Lord, are you telling this parable to us, or to everyone?” The Lord answered, “Who then is the faithful and sensible steward, whom the master will put in charge of his household to give them their share of food at the proper time? Blessed is that servant whom the master finds doing so when he returns. Truly I tell you, he will put him in charge of all his possessions. But suppose that servant says to himself, ‘My master is a long time in coming,’ and begins to beat the menservants and maidservants, and to eat and drink and get drunk. The master of that servant will come on a day when he does not expect him and at an hour he does not know. He will cut him in pieces and assign him a place with the unbelievers. The servant who knows his master’s will and does not get ready or do what his master wants will be beaten with many blows. But the one who does not know, and does things deserving punishment, will be beaten with few blows. From everyone who has been given much, much will be demanded; and from the one who has been entrusted with much, much more will be asked.”
  - range: 49-59
    heading: Fire on the earth, and the signs of this time
    plain: |
      “I have come to bring fire on the earth, and what more could I wish, if it is already kindled? But I have a baptism to undergo, and how distressed I am until it is completed! Do you think I came to bring peace on earth? No, I tell you, but division. From now on there will be five in one household divided, three against two and two against three. They will be divided, father against son and son against father, mother against daughter and daughter against mother, mother-in-law against daughter-in-law and daughter-in-law against mother-in-law.”

      He said to the crowd as well: “When you see a cloud rising in the west, you say at once, ‘A shower is coming,’ and so it does. And when the south wind blows, you say, ‘It will be hot,’ and so it is. Hypocrites! You know how to read the look of the earth and the sky. How is it that you do not know how to read this present time? Why do you not judge for yourselves what is right? As you go with your opponent to the magistrate, make every effort on the way to settle with him, or he may drag you off to the judge, and the judge hand you over to the officer, and the officer throw you into prison. I tell you, you will not get out until you have paid the very last small coin.”

notes:
  - ref: 1
    phrase: the leaven of the Pharisees, which is hypocrisy
    kind: symbol
    title: Leaven, hidden in the dough
    body: |
      Leaven works unseen, which makes it a fitting image for hypocrisy. It was sourdough kept back from an earlier batch and worked into fresh dough, where, hidden and silent, it made the whole lump rise and changed its character. Jesus’s next words follow from the image: “there is nothing covered, that shall not be revealed” (verse 2). The leaven the Pharisees keep out of sight will be exposed, and what is whispered in inner rooms will be shouted from the housetops.

      He says this “unto his disciples first of all.” The Greek can be read “above all, beware,” but the better reading is that He spoke first to the disciples, with the crowd overhearing, and turned to the crowd later (verses 13, 54). The meal at the Pharisee’s house had just ended in open hostility ([[Luke 11:53–54]]). For the same image on another occasion, see the note on [[Matt. 16:6]].
    sources: [brown-testimony-luke]
  - ref: 5
    phrase: 'Fear him, which after he hath killed hath power to cast into hell'
    kind: words
    title: Whom to fear
    body: |
      The one to fear is God (see the note on [[Matt. 10:28]]). Those who kill the body can do nothing more, but God has power after death to “cast into hell,” an allusion to the final judgment. The word for hell is *Gehenna*, the valley of Hinnom on the southern edge of Jerusalem, which had long been tied in the minds of Jerusalem’s people to burning and the fiery wrath of God, and still was in Jesus’s day.

      The warning sits between two reassurances. Jesus calls His hearers “my friends” (verse 4), an address of endearment He uses nowhere else in Luke. In John He gives the title to the apostles who do what He commands ([[John 15:14]]), and in latter-day revelation to His servants sent out “even as my friends in days when I was with them” ([[D&C 84:77]]); here it is probably meant above all for the Twelve. And right after the warning comes “Fear not” (verse 7): the God who can cast into hell is the God who does not forget a sparrow. Jesus Himself, soon to die at men’s hands, may be speaking of His own death as well: death does not end a person’s existence, and those who killed Him could do nothing more to Him after it.
    sources: [brown-testimony-luke, sc-knowhy-81]
  - ref: 10
    phrase: whosoever shall speak a word against the Son of man, it shall be forgiven him
    kind: scripture
    title: Why a word against the Son of man is forgiven
    body: |
      The Joseph Smith Translation explains why Jesus says this here. After “he who denieth me before men, shall be denied before the angels of God,” it adds: “Now his disciples knew that he said this, because they had spoken evil against him before the people; for they were afraid to confess him before men. And they reasoned among themselves, saying, He knoweth our hearts, and he speaketh to our condemnation, and we shall not be forgiven” (JST Luke 12:10–11). The next saying answers their fear: “Whosoever shall speak a word against the Son of man, and repenteth, it shall be forgiven him” (JST Luke 12:12). The two words “and repenteth” make the difference; forgiveness comes to the one who repents.

      The promise can be read forward into Luke’s own story. Peter would deny Jesus three times in the high priest’s house ([[Luke 22:55–60]]), the very denial before men that verse 9 warns of, and then he “wept bitterly” ([[Luke 22:62]]); the forgiveness promised here to the one who repents was open to him. The sin that is not forgiven is of another kind. Joseph Smith taught, in his April 1844 discourse as the *Times and Seasons* printed it, that a man who sins against the Holy Ghost “has got to say that the sun does not shine, while he sees it, he has got to deny Jesus Christ when the heavens were open to him”; the revelation describes such people as “having denied the Holy Spirit after having received it” ([[D&C 76:35]]). The note on [[Matt. 12:31]] goes further.
    sources: [jst-luke-12, brown-testimony-luke, jsp-discourse-1844-04-07, lds-scriptures]
  - ref: 12
    phrase: in the same hour
    kind: scripture
    title: Given in the hour it is needed
    body: |
      The help Jesus promises comes in the hour it is needed. The disciples would be brought before synagogues, where offenders could be beaten ([[Acts 22:19]]), and before magistrates and authorities who were most likely Gentiles. They are not to be anxious about their defense, because the Holy Ghost will teach them “in the same hour” what to say.

      The Lord gave the same promise again in latter-day revelation, and with it a charge for the time before the hour comes: “Neither take ye thought beforehand what ye shall say; but treasure up in your minds continually the words of life, and it shall be given you in the very hour that portion that shall be meted unto every man” ([[D&C 84:85]]).
    sources: [brown-testimony-luke, lds-scriptures]
  - ref: 14
    phrase: who made me a judge or a divider over you?
    kind: history
    title: Why Jesus would not divide the inheritance
    body: |
      The man is not asking for advice. “Speak to my brother” is an order, and he has already decided what the ruling should be. Jesus refuses, and the refusal teaches something about Him. Inheritance had its own laws and customs, already in place, and the dispute did not call for a heavenly ruling simply because the one asked was Jesus. He respected the law and custom of His society and the proper way of doing things, as He would again when asked about tribute to Caesar ([[Luke 20:21–25]]). The word “divider” is rare, found nowhere else in the New Testament.

      Instead of settling the quarrel, He went to its root, covetousness: “a man’s life consisteth not in the abundance of the things which he possesseth” (verse 15). The parable that follows takes up the covetousness behind the quarrel.
    sources: [brown-testimony-luke, olson-final-trek]
  - ref: 20
    phrase: Thou fool, this night thy soul shall be required of thee
    kind: words
    title: God calls him a fool
    body: |
      The verdict on the rich man comes from God Himself, and the word, *aphrōn*, is the opposite of the Greek word for wise or sensible: a harsh judgment of a man’s character and good sense. “Thy soul shall be required” is not passive in the Greek but reads “they shall require thy soul.” A plural with no stated subject was a way of speaking of what God does without naming Him.

      “Soul” here is the man’s life, the same word Jesus uses for “life” a few verses later (verses 22–23). He had promised his soul ease for “many years” (verse 19), as if it could be fed on stored goods; that same night it was asked back of him.
    sources: [brown-testimony-luke]
  - ref: 21
    phrase: is not rich toward God
    kind: words
    title: Not rich toward God
    body: |
      The man is not condemned for a good harvest or for storing it. Storing food was wise; his failure was that he made no preparation for his soul. His concern with himself may be why God calls him a fool: in verses 17–19 he says “I” and “my” eleven times, and he never acknowledges that it was “the ground” that brought forth plentifully (verse 16), nor the God who made the ground. He speaks as the owner of what he held only as a steward.

      Laying up treasure condemns a man when it is done for its own sake, without thought for the kingdom’s needs or for where the wealth came from. A few verses later Jesus says how a disciple becomes rich toward God: “Sell that ye have, and give alms; provide yourselves bags which wax not old, a treasure in the heavens that faileth not” (verse 33).
    sources: [olson-final-trek, brown-testimony-luke]
  - ref: 22
    phrase: Take no thought for your life, what ye shall eat
    kind: scripture
    title: Said again, in another setting
    body: |
      The sayings that follow, the ravens, the lilies, seeking the kingdom and treasure in heaven, are also in the Sermon on the Mount ([[Matt. 6:19–34]]), but in a different order and setting. Here Luke joins them to the parable of the rich fool with “Therefore” (verse 22), and Jesus carries on the parable’s themes as He tells His disciples to trust God for what they need. The reading this site follows is that Jesus gave similar teachings on different occasions, and the Lord used much the same language once more in latter-day revelation, again in a different order ([[D&C 84:81–84]]).

      Here He addresses the disciples, and His words look ahead to their full-time service, when they would depend on God for food and clothing, as He would later tell the Nephite Twelve ([[3 Ne. 13:25–34]]). The “cubit” added to “stature” (verse 25) is most likely added to a person’s length of life: the Greek word usually means age. See also the notes on [[Matt. 6:25]] and [[Matt. 6:27]].
    sources: [brown-testimony-luke, olson-final-trek]
  - ref: 24
    phrase: Consider the ravens
    kind: symbol
    title: Why ravens?
    body: |
      Where Matthew has “the fowls of the air” ([[Matt. 6:26]]), Luke has the raven, one of the most unclean birds under the law ([[Lev. 11:15]]; [[Deut. 14:14]]), a scavenger that lives on carrion. Yet “God feedeth them.” The Joseph Smith Translation sharpens the point by adding “nevertheless” before those words. If God feeds even the unclean bird, “how much more are ye better than the fowls?”

      The same choice runs through the passage: the small and lowly set against the great. Ravens, lilies and grass stand against the rich landowner and Solomon in all his glory, and the small things are the ones God is shown caring for.
    sources: [brown-testimony-luke]
  - ref: 33
    phrase: Sell that ye have, and give alms
    kind: history
    title: Must a disciple sell everything?
    body: |
      The command does not require every follower to live in poverty. Jesus accepted Martha’s hospitality in her own home ([[Luke 10:38–42]]), and from the cross He gave His mother into the care of the beloved disciple, who took her to his own home ([[John 19:25–27]]). The weight falls on giving: alms are given with no gift expected in return, which reversed the social customs of the day, and God, not the one who receives, repays the giver. A true disciple is generous.
    sources: [brown-testimony-luke]
  - ref: 35
    phrase: Let your loins be girded about, and your lights burning
    kind: symbol
    title: Loins girded, lights burning
    body: |
      To gird the loins, tucking a long robe into the belt to free the legs, was to get ready to move; Elijah “girded up his loins” before he ran ahead of Ahab ([[1 Kgs. 18:46]]). The picture may also recall the first Passover, which Israel ate “with your loins girded” ([[Ex. 12:11]]), ready to leave at a word.

      With “your lights burning” added, the servants of the next verse are dressed for work and keep their lamps lit through the night, so that they can open the door the moment their master knocks (verse 36).
    sources: [south-clothing-textiles, brown-testimony-luke]
  - ref: 37
    phrase: he shall gird himself, and make them to sit down to meat, and will come forth and serve them
    kind: christ
    title: The master who serves
    body: |
      A lord waiting on his servants reverses the order of master and servant, and the saying runs against the social conventions of its time. The master comes home in the night, girds himself as a servant would, seats his servants at his table, and serves them. The master can be read as a picture of the Savior, and Jesus says as much of Himself at the Last Supper: “I am among you as he that serveth” ([[Luke 22:27]]). The meal also looks forward to the messianic banquet, where the faithful will sit as the Lord’s guests.

      The Joseph Smith Translation gives the promise twice, repeating it in nearly the same words after the watches of the night: “For the Lord of those servants shall gird himself, and make them to sit down to meat, and will come forth and serve them” (JST Luke 12:43).
    sources: [brown-testimony-luke, jst-luke-12]
  - ref: 38
    phrase: if he shall come in the second watch, or come in the third watch
    kind: scripture
    title: The first, second and third watch
    body: |
      The night was divided into watches for sentry duty: the Romans counted four between six in the evening and six in the morning, the Jews three. Luke’s text names the second and the third. The Joseph Smith Translation adds a verse that names all three and makes them the Lord’s comings: “For, behold, he cometh in the first watch of the night, and he shall also come in the second watch, and again he shall come in the third watch. And verily I say unto you, He hath already come, as it is written of him” (JST Luke 12:41–42).

      The addition says that the Lord comes into the world more than once, and every coming is in the night, so the servants must be ready in every watch. The Translation then adds a saying of its own: “the coming of the Lord is as a thief in the night” (JST Luke 12:44). Paul uses the same picture of the thief, and so does the Lord in this dispensation ([[1 Thes. 5:2]]; [[D&C 106:4]]).
    sources: [jst-luke-12, brown-testimony-luke]
  - ref: 41
    phrase: speakest thou this parable unto us, or even to all?
    kind: scripture
    title: To us, or to all?
    body: |
      The Joseph Smith Translation gives the Lord’s answer to Peter outright: “I speak unto those whom the Lord shall make rulers over his household, to give his children their portion of meat in due season.” The disciples then ask, “Who then is that faithful and wise servant?” and He answers, “It is that servant who watcheth, to impart his portion of meat in due season” (JST Luke 12:49–51). These changes make the sayings that follow read as instruction for leaders.

      Read that way, each detail says something about a calling. The steward holds authority that comes from his master, not from himself. His work is to feed the household. “Shall make ruler” (verses 42, 44) suggests a formal installing in office. The evil servant shows what such authority becomes when it is used to dominate others: he beats the menservants and maidens and feeds himself (verse 45). Latter-day revelation names the same failure: “when we undertake to cover our sins, or to gratify our pride, our vain ambition, or to exercise control or dominion or compulsion upon the souls of the children of men, in any degree of unrighteousness, behold, the heavens withdraw themselves” ([[D&C 121:37]]). Yet what He says to leaders is meant for all.
    sources: [jst-luke-12, brown-testimony-luke]
  - ref: 47
    phrase: shall be beaten with many stripes
    kind: scripture
    title: Many stripes and few
    body: |
      Punishment is graded by what a servant knew. The one who knew his lord’s will and did not prepare receives many stripes, the one who did not know, few; one punishment does not fit all, and rewards are graded too, as the many mansions of [[John 14:2]] and the degrees of glory in [[D&C 76]] show. Restoration scripture goes further for those who sinned without knowing: Christ’s blood atones for those “who have died not knowing the will of God concerning them, or who have ignorantly sinned” ([[Mosiah 3:11]]).

      The verse’s last line turns the principle onto the stewards: “unto whomsoever much is given, of him shall be much required.” The verb behind “committed” means to entrust, here perhaps a trust given by ordination; the Lord put it the same way to the elders of this dispensation ([[D&C 82:3]]). The evil servant’s fate in verse 46, “cut him in sunder,” names an ancient punishment, cutting a man in two, but here it is likely figurative, since he is then given a portion with the unbelievers. The Joseph Smith Translation reads “will cut him down” (JST Luke 12:55).
    sources: [brown-testimony-luke, lds-scriptures, jst-luke-12]
  - ref: 49
    phrase: I am come to send fire on the earth; and what will I, if it be already kindled?
    kind: symbol
    title: Fire, already kindled
    body: |
      The fire has been read in more than one way: as judgment, as the strife that flares against those who accept Jesus’s message, and as a fire that cleanses; each names something His ministry brings. The Joseph Smith Translation favors judgment: it leads into the verse with men who “are not well pleased with the Lord’s doings” and adds “therefore,” so that the fire answers their ill will. John the Baptist had promised that the one coming after him would baptize “with fire” and burn the chaff ([[Luke 3:16–17]]). Read that way, Jesus’s question, “what will I, if it be already kindled?”, suggests that although the final judgment was still future, He was already sifting the hearts of those who heard Him.

      Verses 51–53 give the second reading in the closest of places, the household, in words that recall [[Micah 7:6]]: father against son, mother against daughter, as each responds to Him. The peace He brings is real ([[Luke 2:14]]), but it lies in the heart of the one who receives Him; it does not keep a family from dividing over Him. The note on [[Matt. 10:34]] treats a like saying given to the Twelve.
    sources: [olson-final-trek, brown-testimony-luke]
  - ref: 50
    phrase: I have a baptism to be baptized with; and how am I straitened till it be accomplished!
    kind: christ
    title: A baptism, and a Savior hard pressed
    body: |
      The baptism is the suffering ahead of Him, His Atonement and death, which no one else would have to face. This is one of the few verses that let a reader see the distress Jesus felt as He looked toward it (compare [[Mark 14:33–34]]; [[John 12:27]]). “Accomplished” is a word of completion, to bring a thing to its end. Benjamin’s angel had told how great His anguish would be: “blood cometh from every pore” ([[Mosiah 3:7]]).

      The contrast with the rich fool is direct. The landowner hoarded for years he did not have; Jesus walked on purpose toward His death, giving the Father all He had and was, His life and His will. On the same image of the baptism, see the note on [[Matt. 20:22]].
    sources: [brown-testimony-luke, olson-final-trek]
  - ref: 56
    phrase: how is it that ye do not discern this time?
    kind: symbol
    title: Reading the sky, missing the time
    body: |
      Every farmer knew the signs. A cloud rising in the west came in off the Mediterranean and meant rain, as Elijah’s servant saw a little cloud rise “out of the sea” ([[1 Kgs. 18:44]]); a south wind blew up from Arabia and brought searing heat. The crowd could read these, but not “this time.” The word is *kairos*, the critical moment of decision, and it stood in front of them in Jesus Himself.

      He calls them hypocrites, a word for actors playing a part, because their failure was not a lack of skill. They could read the weather well enough; they were choosing not to see His message and His presence.
    sources: [brown-testimony-luke]
  - ref: 58
    phrase: When thou goest with thine adversary to the magistrate
    kind: words
    title: Settle on the way
    body: |
      The scene seems to be a debtor walking to court with his creditor and making every effort (“give diligence”) to settle before they reach the magistrate. Once the judge hands him to the officer who keeps the debtors’ prison, there is no more room to bargain, and he stays until the last small coin is paid. The Joseph Smith Translation turns the opening into a question, “Why goest thou to thine adversary for a magistrate?”, which urges disciples to settle disputes outside the courts, as Paul would urge the Corinthians ([[1 Cor. 6:1–7]]).

      Coming after “why even of yourselves judge ye not what is right?” (verse 57), the human court also seems to be a thinly veiled picture of God’s final judgment, so the counsel reaches beyond lawsuits: the time to settle is while still on the way.
    sources: [brown-testimony-luke]

christ: |
  Luke 12 gives a picture of Jesus Christ in the master who, finding his servants watching, girds himself and serves them at his own table; at the Last Supper Jesus would say of Himself, “I am among you as he that serveth” ([[Luke 22:27]]). He speaks of His coming suffering as a baptism He is pressed to complete, and He promises His friends that the Holy Ghost will give them words in the hour they need them. The Lord renews that promise to those He sends in this dispensation, “it shall be given you in the very hour that portion that shall be meted unto every man” ([[D&C 84:85]]), and states for every disciple the rule that governs a stewardship: “of him unto whom much is given much is required” ([[D&C 82:3]]).

explore: |
  - **The same sayings on other occasions.** [[Matt. 10:26–33]]; [[Matt. 6:19–34]]; [[Matt. 24:42–51]]; [[Matt. 5:25–26]].
  - **The Lord’s charge to His friends in this dispensation.** [[D&C 84:77–85]].
  - **Knowledge and accountability.** [[Mosiah 3:11]]; [[2 Ne. 9:25–27]]; [[D&C 82:3]].
  - **Watching for His coming.** [[D&C 45:16–59]]; [[1 Thes. 5:1–6]]; [[D&C 106:4–5]].
  - *The Testimony of Luke* (BYU New Testament Commentary, 2015), chapter 12, reads the chapter’s stewards and servants as instruction for the Church’s leaders.

