chapter: 8
title: Take Heed Therefore How Ye Hear
tagline: Women He has healed travel with Jesus and the Twelve; He tells the parable of the sower and teaches how to hear; names as His family those who hear and do; stills a storm, frees a man from a legion of devils across the lake, heals a woman by a touch and raises the daughter of Jairus.
when: 'During Jesus’s ministry in Galilee, after the woman in Simon’s house ([[Luke 7:36–50]]); the order this site follows'

setting: |
  Luke 8 opens on the road. Jesus goes “throughout every city and village” of Galilee, and Luke names who goes with Him: the Twelve, chosen in chapter 6, and a company of women He had healed. Matthew and Mark mention the women of Galilee only at the end of their Gospels, at the cross and the tomb ([[Matt. 27:55–56]]; [[Mark 15:40–41]]). Luke introduces them here, near the start, and sets around them stories of particular women whose lives were changed by meeting Jesus: the widow of Nain and the woman who washed His feet in chapter 7 ([[Luke 7:11–17]]; [[Luke 7:36–50]]), and in this chapter His mother, a woman healed by a touch, and a girl of twelve.

  The stories of conflict fall away here, and none returns until a lawyer tests Jesus in [[Luke 10:25]]. In their place come a parable with its explanation and then four of Jesus’s mightiest works in a row: a storm stilled on the lake, a man freed from a legion of devils on the far shore, in Gentile country, a woman healed, and a dead girl raised.

  Matthew and Mark tell all of these except the women of verses 1–3 ([[Matt. 8:23–34]]; [[Matt. 9:18–26]]; [[Matt. 12:46–13:23]]; [[Mark 3:31–5:43]]). Luke places the visit of Jesus’s mother and brothers after the parable, where Mark has it before ([[Mark 3:31–35]]).

thread: |
  **Luke 8 is about hearing: the word of God goes out, and the chapter shows who hears it and obeys.**

  The parable of the sower sets the question. The same seed falls on four kinds of ground, and Jesus ends the story with a cry: “He that hath ears to hear, let him hear” (verse 8). His explanation is about hearers (verses 12–15); the saying about the lamp ends, “Take heed therefore how ye hear” (verse 18); and when His mother and brothers come, He names as His family “these which hear the word of God, and do it” (verse 21).

  Then the chapter turns from words to works, and the theme goes with it. On the lake the wind and the water hear His rebuke and obey, while the disciples, who should hear Him best, are afraid. On the far shore the devils obey Him, and the man they held becomes a hearer who goes home and tells. Fear runs under the storm and the Gadarene story alike, and faith is the answer to it: “Where is your faith?” (verse 25); “thy faith hath made thee whole” (verse 48); “Fear not: believe only” (verse 50). A chapter that opens with women He had healed closes with a woman and a girl restored, and Jesus shows Himself the Savior of all, men and women, Jews and Gentiles.

sections:
  - range: 1-3
    heading: The women who followed Jesus
    plain: |
      Soon afterward Jesus traveled from one town and village to the next, preaching and announcing the good news of the kingdom of God. The Twelve were with Him, and so were some women He had healed of evil spirits and illnesses: Mary, called Magdalene, from whom seven devils had gone out; Joanna, the wife of Chuza, the manager of Herod’s household; Susanna; and many other women, who provided for them out of their own means.
  - range: 4-18
    heading: The sower, and how to hear
    plain: |
      A great crowd gathered as people came to Him from town after town, and He told them a parable. “A farmer went out to sow his seed. As he scattered it, some fell along the path, where it was trampled and the birds ate it up. Some fell on rock, and when it came up it withered, because it had no moisture. Some fell among thorns, and the thorns grew up with it and choked it. And some fell on good soil, and grew, and produced a crop a hundred times what was sown.” When He had said this He called out, “Whoever has ears to hear, let him hear.”

      His disciples asked Him what the parable meant. He said, “To you it has been given to know the mysteries of the kingdom of God, but to others I speak in parables, so that seeing they may not see, and hearing they may not understand.

      “This is what the parable means. The seed is the word of God. The seed along the path stands for those who hear, and then the devil comes and takes the word out of their hearts, so that they will not believe and be saved. The seed on the rock stands for those who receive the word with joy when they hear it, but have no root; they believe for a while, and when temptation comes they fall away. The seed that fell among thorns stands for those who hear, but as they go on their way they are choked by the worries, riches and pleasures of this life, and their fruit never ripens. But the seed on good soil stands for those who hear the word with an honest and good heart, hold on to it, and patiently bear fruit.

      “No one lights a lamp and covers it with a jar or puts it under a bed. He puts it on a lampstand, so that those who come in can see the light. For nothing is hidden that will not be brought into the open, and nothing secret that will not be known and come to light. So pay attention to how you hear. Whoever has will be given more, and whoever does not have, even what he thinks he has will be taken from him.”
  - range: 19-21
    heading: His mother and His brethren
    plain: |
      Then His mother and His brothers came to Him, but they could not reach Him because of the crowd. Someone told Him, “Your mother and your brothers are standing outside, wanting to see you.” He answered, “My mother and my brothers are those who hear the word of God and do it.”
  - range: 22-25
    heading: The storm stilled
    plain: |
      One day Jesus got into a boat with His disciples and said, “Let us cross over to the other side of the lake.” So they set out. As they sailed He fell asleep. A windstorm swept down on the lake; the boat began to fill, and they were in danger. They came and woke Him, saying, “Master, Master, we are perishing!” He got up and rebuked the wind and the raging water; they stopped, and it was calm. He said to them, “Where is your faith?” Afraid and amazed, they said to one another, “Who then is this? He commands even the winds and the water, and they obey Him.”
  - range: 26-39
    heading: Legion, the man among the tombs
    plain: |
      They landed in the country of the Gadarenes, across the lake from Galilee. As Jesus stepped ashore, a man from the town met Him who had been possessed by devils for a long time. He wore no clothes and did not live in a house but among the tombs. When he saw Jesus he cried out, fell down before Him and shouted, “What have I to do with you, Jesus, Son of the Most High God? I beg you, do not torment me!” For Jesus had commanded the unclean spirit to come out of the man. Many times it had seized him; though he was kept bound with chains and shackles, he would break the bonds and be driven by the devil into the wilderness.

      Jesus asked him, “What is your name?” He said, “Legion,” because many devils had entered him. They kept begging Jesus not to order them to go into the abyss. A large herd of pigs was feeding there on the hillside, and the devils begged Him to let them enter the pigs, and He allowed it. The devils came out of the man and went into the pigs, and the herd rushed down the steep bank into the lake and drowned.

      When the herdsmen saw what had happened they ran off and reported it in the town and the countryside, and people came out to see. They came to Jesus and found the man from whom the devils had gone sitting at Jesus’s feet, dressed and in his right mind, and they were afraid. Those who had seen it told them how the possessed man had been healed. Then all the people of the region of the Gadarenes asked Jesus to leave them, because they were seized with great fear. So He got into the boat and went back.

      The man from whom the devils had gone begged to go with Him, but Jesus sent him away, saying, “Go back home and tell how much God has done for you.” So he went and told all over the town how much Jesus had done for him.
  - range: 40-56
    heading: Jairus’s daughter and the woman with an issue of blood
    plain: |
      When Jesus came back, the crowd welcomed Him, for they had all been waiting for Him. A man named Jairus, a leader of the synagogue, came and fell at Jesus’s feet and begged Him to come to his house, because his only daughter, about twelve years old, was dying. As Jesus went, the crowds pressed around Him.

      A woman was there who had suffered from bleeding for twelve years and had spent all she had on doctors, and no one could heal her. She came up behind Him and touched the border of His cloak, and at once her bleeding stopped. “Who touched me?” Jesus asked. When everyone denied it, Peter and those with him said, “Master, the crowds are pressing and crushing you, and you ask, ‘Who touched me?’” But Jesus said, “Someone touched me, for I know that power has gone out from me.” When the woman saw that she could not stay hidden, she came trembling and fell at His feet, and in front of all the people she told why she had touched Him and how she had been healed at once. He said to her, “Daughter, take heart. Your faith has made you well. Go in peace.”

      While He was still speaking, someone came from the synagogue leader’s house and said, “Your daughter is dead. Do not trouble the Master any longer.” Jesus heard it and said to Jairus, “Do not be afraid. Only believe, and she will be made well.” When He came to the house He let no one go in with Him except Peter, James and John, and the girl’s father and mother. Everyone was weeping and mourning for her, but He said, “Stop weeping. She is not dead but asleep.” They laughed at Him, knowing that she was dead. But He put them all out, took her by the hand and called, “Child, get up!” Her spirit returned, and she got up at once, and He told them to give her something to eat. Her parents were astonished, but He ordered them to tell no one what had happened.

notes:
  - ref: 1
    phrase: the twelve were with him
    kind: history
    title: The Twelve beside Him
    body: |
      Luke names the Twelve here as Jesus’s companions, and that is how their calling began. When He chose them, Jesus “ordained twelve, that they should be with him, and that he might send them forth to preach” ([[Mark 3:14]]), and the Joseph Smith Translation of this verse says it of them: “the twelve who were ordained of him, were with him.” Luke has not mentioned them since he listed them in chapter 6 ([[Luke 6:13–16]]), but they have been with Jesus all along, and now they go with Him from city to city to see the parable explained, the storm stilled, the man among the tombs healed and the dead girl raised.

      Being with Him is what their witness would rest on. After the Ascension, Peter asked that Judas’s place be filled from “these men which have companied with us all the time that the Lord Jesus went in and out among us, beginning from the baptism of John,” so that one might “be ordained to be a witness with us of his resurrection” ([[Acts 1:21–22]]). The journeys of this verse are part of that time.
    sources: [lds-scriptures, brown-testimony-luke]
  - ref: 2
    phrase: Mary called Magdalene, out of whom went seven devils
    kind: history
    title: Mary Magdalene and the seven devils
    body: |
      This is Mary Magdalene’s first appearance in Luke, and the only detail of her past the New Testament keeps ([[Mark 16:9]] says the same). She is the one woman named in all four Gospels. In nearly every list of the women she stands alone or first, which suggests she was a leader among them and in the early Church.

      “Seven devils” may say more about the healing than about how ill she had been. Seven in scripture often stands for completeness, so Luke may simply be saying that Christ healed her completely, whatever her affliction was.

      Nothing in the text makes her the “sinner” of the chapter before, the woman who washed Jesus’s feet in Simon’s house ([[Luke 7:37–50]]). Attempts to join the two fail on Luke’s own words: Mary was freed from devils, and being freed from devils is not the same as being forgiven of sins.
    sources: [olson-ministered, brown-testimony-luke]
  - ref: 3
    phrase: which ministered unto him of their substance
    kind: history
    title: Of their substance
    body: |
      Jesus and His traveling company depended on others for their meals and a place to sleep, and these women supported them out of their own means. “Substance” is their means, and the Greek word for “many others” is feminine: all who gave were women. Many early manuscripts read that they ministered “unto them,” to the whole company, and that is likely what Luke wrote. The verb (*diakoneō*) is the word for serving at table and seeing to meals, and the form Luke uses describes service given again and again.

      They must have had money of their own and freedom to spend it. Joanna, at least, was married, to a man close to power: Chuza was *epitropos*, the manager of the household of Herod Antipas, the ruler of Galilee. His title does not tell us his exact office, but he and his wife were people of means, and they may be how word of Jesus reached Herod’s court ([[Luke 9:7–9]]). For women to travel with a teacher and his male disciples was highly unusual in their society.

      Their service was not a passing episode. These same women follow Jesus to Jerusalem, stand at the cross, watch where He is buried, and come to the empty tomb ([[Luke 23:49]]; [[Luke 23:55–24:10]]).
    sources: [olson-ministered, brown-testimony-luke]
  - ref: 6
    phrase: because it lacked moisture
    kind: symbol
    title: The soils in Luke’s telling
    body: |
      The seed is the same everywhere it falls; what differs is the ground. A Galilean farmer scattered seed by the handful, and through the fields ran paths beaten hard by men and animals, where seed could not grow. Luke’s own details all sharpen the picture of the ground. Seed on the path is not only eaten by birds but “trodden down” (verse 5). Seed on the rock withers less because the soil is shallow, as in Matthew and Mark, than “because it lacked moisture”: the rain runs off the rock beneath a thin layer of earth, and the roots cannot reach deeper water. The thorns “sprang up with it” (verse 7), so apparently they were not there before the sowing: seed and thorns grew together in ground that had looked ready for planting.

      And Luke’s good ground gives only the largest yield, “an hundredfold” (verse 8), where Matthew and Mark also give sixty and thirty ([[Matt. 13:8]]; [[Mark 4:8]]). A hundredfold is an extraordinary harvest.
    sources: [talmage-jesus-christ-19, halverson-soils-souls]
  - ref: 10
    phrase: that seeing they might not see
    kind: scripture
    title: That seeing they might not see
    body: |
      Jesus’s words echo the Lord’s commission to Isaiah at his call: “Hear ye indeed, but understand not; and see ye indeed, but perceive not” ([[Isa. 6:9]]; the footnote gives the verse). Read alone, the “that” sounds as if Jesus told parables in order to keep people from understanding. Writing of the same occasion as Matthew tells it ([[Matt. 13:10–17]]), Joseph Smith placed the fault in the hearers: the multitude was condemned “because they were not willing to see with their eyes and hear with their ears; not because they could not and were not privileged to see, and hear.” Read that way, Jesus speaks in parables to those who choose not to respond.

      The parables can also be read as a mercy. Had Jesus taught plainly those not ready to obey, and had they rejected the truth with full understanding, justice would have condemned them; what they could not yet understand left mercy a claim on them.
    sources: [brown-testimony-luke, jsp-letter-elders-1835-12, talmage-jesus-christ-19]
  - ref: 13
    phrase: in time of temptation fall away
    kind: scripture
    title: The wayside and the rock
    body: |
      Luke’s explanation traces the steps the word is meant to take in a hearer: hear, believe, be saved. The devil takes the seed from the wayside hearers “lest they should believe and be saved” (verse 12), stopping the process as early as he can. The rocky ground goes a step further. These hearers receive the word “with joy” and believe, but only “for a while.” In Matthew and Mark what scorches them is tribulation and persecution “because of the word” ([[Matt. 13:21]]; [[Mark 4:17]]); in Luke it is “temptation.”

      The footnote sends the reader to Lehi’s dream, where a company of people set out on the path to the tree of life and then, in the mist of darkness, “wandered off and were lost” ([[1 Ne. 8:23]]). Those travelers have been set beside the rocky-ground hearers: they began well and did not last. Nephi was told what the mist meant: “the mists of darkness are the temptations of the devil” ([[1 Ne. 12:17]]).
    sources: [halverson-soils-souls, sc-knowhy-663]
  - ref: 14
    phrase: cares and riches and pleasures of this life
    kind: prophets
    title: Cares and riches and pleasures
    body: |
      On the thorny ground the seed sprouts and lives. Luke alone names the third thorn, “pleasures,” and alone says what the choked plant fails to do: it brings “no fruit to perfection,” that is, its fruit never ripens. The plant stays alive, but it only takes up ground.

      Cares, riches and pleasures are “the most subtle thorns to choke out the effect of the gospel word in our lives,” and a disciple can give in to “the pleasures of this life” in three ways: by addiction, which impairs agency; by trivial distractions, which draw attention from what is eternal; and by a sense of entitlement, which stops the growth that eternal life requires.
    sources: [halverson-soils-souls, oaks-parable-sower]
  - ref: 15
    phrase: bring forth fruit with patience
    kind: words
    title: Fruit with patience
    body: |
      The patience is not waiting quietly. The Greek word, *hypomonē*, is steadfast endurance: the quality of someone who keeps to his purpose and his faith through the greatest trials. In good ground the seed “sprang up” (verse 8), but the hundredfold comes only over time, “with patience.”

      The good hearers “keep” the word, that is, hold it tight, which is the picture in Lehi’s dream of those who pressed forward “continually holding fast to the rod of iron” until they reached the tree ([[1 Ne. 8:30]]). Read as a picture of hearers, the soils are not a permanent placement made by one decision: which ground a person is goes on being settled, an ongoing process.
    sources: [thayer, halverson-soils-souls, sc-knowhy-663]
  - ref: 18
    phrase: Take heed therefore how ye hear
    kind: words
    title: Take heed how ye hear
    body: |
      The warning turns the parable on its hearers. A lamp, the “candle” of verse 16, is lit to be set on a stand, and what is hidden will come to light (verses 16–17); so “take heed,” a Greek verb of seeing used here for turning the mind to a thing, how you hear.

      The saying that follows is about receiving, not possessions. The Lord gives the same rule in the Book of Mormon: “I will give unto the children of men line upon line, precept upon precept … and blessed are those who hearken unto my precepts, and lend an ear unto my counsel … for unto him that receiveth I will give more; and from them that shall say, We have enough, from them shall be taken away even that which they have” ([[2 Ne. 28:30]]). The Joseph Smith Translation of this verse uses the same word: “whosoever receiveth” and “whosoever receiveth not.” The one who has not loses even what he “seemeth to have,” better “that which he thinks he hath.” On this reading, knowledge he never put to use was never really his, and he will lose even that.
    sources: [thayer, lds-scriptures, brown-testimony-luke, ellicott-luke]
  - ref: 21
    phrase: these which hear the word of God, and do it
    kind: christ
    title: Those who hear and do
    body: |
      Jesus is not disowning His family. His “brethren” are His brothers, sons of Joseph and Mary born after Him, and He had sisters too ([[Matt. 13:55–56]]). He can be holding up His own household as an example, pointing to the home that formed Him, and also urging His brothers, who were slow to believe in Him ([[John 7:3–5]]), to accept His work. And Mary had shown what He meant from the day she answered the angel, “be it unto me according to thy word” ([[Luke 1:38]]); she was the pattern of one who hears the word of God and does it.

      In Luke the scene comes straight after the parable and the warning “take heed therefore how ye hear,” and Luke’s wording ties it to them. Matthew has “whosoever shall do the will of my Father” and Mark “the will of God” ([[Matt. 12:50]]; [[Mark 3:35]]); Luke has “hear the word of God, and do it,” the word that is the seed in verse 11. Those who hear and obey come into the honored relationships of mother and brother to Him.
    sources: [bd-brethren-of-the-lord, brown-testimony-luke, olson-ministered]
  - ref: 23
    phrase: they were filled with water
    kind: words
    title: Filled with fear
    body: |
      Sudden, violent storms can rise on the Sea of Galilee. The lake lies far below sea level in a bowl of steep hills, and cold air rushing down off them meets warm air rising from the water; Luke says the storm “came down.” The verb for “filled” is imperfect, “they began to be filled,” and “with water” is in italics, added by the King James translators, who pictured the waves breaking into the boat.

      The Joseph Smith Translation reads instead “they were filled with fear, and were in danger.” That change explains Jesus’s question when He has calmed the sea: “Where is your faith?” (verse 25). Beside Mark’s wording the question seems to ask why their faith did not work, why they were afraid, rather than whether they had any faith at all, as in Mark’s “how is it that ye have no faith?” ([[Mark 4:40]]). By now the disciples turn to Him almost by instinct, “Master, master, we perish”; on that reading, the question names the fear that kept their faith from working.
    sources: [hunter-tempest-raging, brown-testimony-luke, lds-scriptures]
  - ref: 25
    phrase: What manner of man is this!
    kind: christ
    title: What manner of man is this?
    body: |
      The Greek asks, more simply, “Who, then, is this?” The disciples have seen Him heal, and the word Luke uses for His rebuke of the wind (*epitimaō*) is the one used when He rebuked unclean spirits and a fever ([[Luke 4:35, 39, 41]]). Now the same rebuke reaches the wind and the water, and they obey.

      The answer is the one the Creation gives. The Lord of earth, air and sea spoke and was obeyed, as He had commanded the waters at the beginning, “Let there be a firmament in the midst of the waters” ([[Gen. 1:6]]). And the chapter makes a point of it: people may refuse to hear and obey, but the wind hears and obeys at once.
    sources: [brown-testimony-luke, talmage-jesus-christ-20]
  - ref: 26
    phrase: the country of the Gadarenes, which is over against Galilee
    kind: history
    title: Over against Galilee
    body: |
      “Over against Galilee” means across the lake from it, on the east shore, away from the province of Galilee on the west where Herod Antipas ruled. The town of Gadara itself lay some six miles southeast of the lake, too far inland for a herd to run from it into the water, so the scene must lie on the east edge of the lake, where the slopes below the heights of the Golan come down steeply to deep water; the likeliest place is near Gergesa. A town’s name could cover the region around it: Gadara, Gerasa and Gergesa were all towns of the region, so it could be called the land of the Gadarenes or of the Gergesenes (Matthew’s word, [[Matt. 8:28]]). The earliest manuscript of Luke, a papyrus called P75, reads “Gerasenes.”

      The territory of the Gergesenes was Gentile country: Jesus has crossed the lake to people outside Israel, and His power goes with Him.
    sources: [brown-testimony-luke, talmage-jesus-christ-20]
  - ref: 30
    phrase: 'Legion: because many devils were entered into him'
    kind: words
    title: Legion
    body: |
      “Legion” is a Latin word for a unit of the Roman army, up to about six thousand men at full strength. The name says that a great many devils held the man, and his answer suggests how completely: asked his own name, he gives theirs, as if he could no longer tell his own self from the spirits who possessed him. Luke shifts between “the unclean spirit” (verse 29) and the plural devils, as if one spoke for the many.

      The footnote points to [[D&C 29:36–37]]: a third part of the hosts of heaven turned away with the devil and were thrust down, and these spirits can take possession of human bodies. They also know who Jesus is. Through the man they cry out, “Jesus, thou Son of God most high” (verse 28). The devils recognized Him when the religious authorities would not.
    sources: [brown-testimony-luke, talmage-jesus-christ-20, keller-mark-luke]
  - ref: 31
    phrase: go out into the deep
    kind: words
    title: Into the deep
    body: |
      “The deep” is the abyss (*abyssos*, as the footnote glosses it). The word is the one the Greek Old Testament uses for the deep of the Creation, “darkness was upon the face of the deep” ([[Gen. 1:2]]): the immeasurable depth. In the New Testament it is the bottomless pit of Revelation, the place of dark powers where Satan is to be bound for a thousand years ([[Rev. 9:1–2]]; [[Rev. 20:1–3]]). In Mark the devils beg not to be sent “away out of the country” ([[Mark 5:10]]); Luke’s words, that they begged not to be sent into the deep, are “words of awful import.”

      The plea suggests that they know their end. The swine seem to give them only a brief respite; the Lord has said that the devil and his angels have “a place prepared for them from the beginning, which place is hell” ([[D&C 29:38]]). And the word joins this story to the storm before it. The One who has just commanded the raging water holds power over the deep as He did at the Creation.
    sources: [thayer, brown-testimony-luke, talmage-jesus-christ-20]
  - ref: 32
    phrase: And he suffered them
    kind: prophets
    title: Why the swine
    body: |
      The devils asked for the swine, and Jesus allowed it; the drowning of the herd was not His command. Why they wanted the pigs at all, Joseph Smith explained in 1841, as William Clayton recorded him: “The Devil has no body, and herein is his punishment. He is pleased when he can obtain the tabernacle of man and when cast out by the Savior he asked to go into the herd of swine showing that he would prefer a swines body to having none.” In the same teaching he said that “the great principle of happiness consists in having a body.”

      Why Jesus allowed a loss that would fall on the herd’s owners, the text does not say, and any answer is speculation. What it shows is the contrast. The herd that had been feeding quietly rushes headlong to its death; the man who had been uncontrollable sits clothed and calm at Jesus’s feet. Read that way, the act shows how much more a man’s well-being is worth than a herd’s.
    sources: [wjs-1841-01-05, talmage-jesus-christ-20, brown-testimony-luke]
  - ref: 37
    phrase: besought him to depart from them
    kind: history
    title: Depart from us
    body: |
      The townspeople came out and found the wild man sitting quietly at Jesus’s feet, clothed and in his right mind, and they were afraid. Luke does not say of what; the likeliest reading is that the man they had all feared was tamed, and now they feared the One who could do such a thing. Some of them may have come already angry, for the herd was surely a major source of income for many of them. But Luke’s word is fear, “great fear,” which can be read as the fear that sinful men feel in the presence of the Righteous, a dread of whom such power might touch next.

      They are better judged mercifully. In part heathen, they may have had only superstitious ideas of God, and their plea is not far from Simon Peter’s when the nets filled: “Depart from me; for I am a sinful man, O Lord” ([[Luke 5:8]]). Jesus does what they ask. He gets back into the boat.
    sources: [talmage-jesus-christ-20, brown-testimony-luke]
  - ref: 39
    phrase: how great things Jesus had done unto him
    kind: christ
    title: What God had done, what Jesus had done
    body: |
      The healed man asks to go with Jesus, and Jesus sends him home instead: “shew how great things God hath done unto thee.” The refusal is a commission. Jesus is leaving a region that has asked Him to go, and the man He leaves behind becomes a missionary, not only in his own town but through the ten cities of the Decapolis, where “all men did marvel” ([[Mark 5:20]]). Why he is told to tell, when others are told to say nothing, is taken up in the note on [[Mark 5:19]].

      Luke lets one change stand without comment. Jesus says “God”; the man goes and tells “how great things Jesus had done unto him.” The shift can be read as deliberate: Luke equates what Jesus does with what God does.
    sources: [talmage-jesus-christ-20, lds-scriptures, brown-testimony-luke]
  - ref: 43
    phrase: a woman having an issue of blood twelve years
    kind: history
    title: Twelve years unclean
    body: |
      Her illness cut her off as well as weakening her. Under the law of Moses a woman whose bleeding continued beyond its time “shall be unclean” for as long as it lasted ([[Lev. 15:25]]; the footnote gives the verse), and whatever she lay on or sat on, and whoever touched it, became unclean too ([[Lev. 15:26–27]]). Her bed, her dishes and the food she prepared were all tainted. Such a condition most likely meant that for twelve years her family no longer touched her and her friends drew away.

      So she comes “behind him” in a crowd, where by that rule anyone she touched became unclean. And her story is set inside the story of Jairus. Walking to his house beside Jesus, the father of a twelve-year-old girl sees faith shown by a woman who has been ill as long as his daughter has been alive, the faith he will soon be asked for himself (verse 50).
    sources: [lds-scriptures, olson-ministered]
  - ref: 44
    phrase: touched the border of his garment
    kind: words
    title: The border of His garment
    body: |
      The “border” (*kraspedon*) is probably one of the tassels that the law told Israelite men to wear on the four corners of the outer cloak, twisted wool with a cord of blue, “that ye may look upon it, and remember all the commandments of the Lord” ([[Num. 15:38–39]]). In New Testament times they hung from the four corners of the outer mantle.

      Her faith was sincere, though it may have been incomplete. She seems to have believed that healing lay in His person and even His clothing, without knowing yet that the power to heal was His own, given at His will. What Jesus does next answers that (verse 46).
    sources: [thayer, south-clothing-textiles, talmage-jesus-christ-20]
  - ref: 46
    phrase: virtue is gone out of me
    kind: christ
    title: Virtue is gone out of me
    body: |
      “Virtue” here means power: the Greek word is *dynamis*, usually translated “power,” as the footnote glosses it. Jesus felt it go from Him, and the moment has been read as showing that His healings cost Him something: an actual giving of His own strength to the one healed.

      He knew someone had touched Him, then, and He asked “Who touched me?” with a purpose, as a teacher asks a question he knows the answer to. He could have let the woman slip away healed. Instead He drew her out to confess her faith, which on this reading corrected whatever she had supposed about the cloak and confirmed that her faith was accepted; and He evidently wanted the neighbors who knew her condition to learn that she was healed. Her healing gave her back her place among her neighbors as well as her health.
    sources: [brown-testimony-luke, talmage-jesus-christ-20]
  - ref: 48
    phrase: thy faith hath made thee whole
    kind: words
    title: Thy faith hath saved thee
    body: |
      “Made thee whole” translates *sesōken*, from *sōzō*, “to save.” Here the verb has its sense of rescuing the sick, making them well and restoring their health, which is what happened to her body. The phrase can also be read as stronger and wider than the King James “made thee whole”: “your faith has saved you,” pointing to her salvation as the fruit of her faith. Luke uses the same phrase, *pistis sou sesōken se*, again and again when Jesus heals, and Jesus said it to the woman who washed His feet, where it reaches to spiritual healing: “Thy faith hath saved thee; go in peace” ([[Luke 7:50]]).

      And He calls her “Daughter.” The word ties her to the other daughter in the story, the girl at home (verses 42, 49): the woman who has lost twelve years and the girl who has lived twelve are both restored by Him. And “go in peace” can be heard as an assurance that her healing would last.
    sources: [thayer, brown-testimony-luke, huntsman-lukes-jesus, talmage-jesus-christ-20]
  - ref: 50
    phrase: 'Fear not: believe only'
    kind: christ
    title: 'Fear not: believe only'
    body: |
      The messenger brings the worst news and a counsel of despair: “Thy daughter is dead; trouble not the Master.” The message implies that those at the house believed Jesus could heal the sick, but not that He could raise the dead. The Joseph Smith Translation makes clear that Jesus answers not the messenger but Jairus himself.

      His answer has two parts, and each meets the moment. “Fear not” is what the angels said to Zacharias, to Mary and to the shepherds ([[Luke 1:13]]; [[Luke 1:30]]; [[Luke 2:10]]), each time just before God acted. “Believe only” answers the doubt in “trouble not the Master.” Jairus has just watched the woman healed in the crowd (see the note on verse 43); the Lord had more to teach him before He answered his plea. And the promise uses the same verb as the woman’s healing (*sōzō*), here in its sense of being made whole and rescued: “she shall be made whole.” The faith asked for is the parents’, for the girl is already beyond asking.
    sources: [brown-testimony-luke, olson-ministered]
  - ref: 51
    phrase: save Peter, and James, and John
    kind: history
    title: Peter, James and John
    body: |
      Jesus takes Peter, James and John apart from the rest of the Twelve to witness what the others do not see, as He will again on the mount and in Gethsemane. The same three, “the only earthly witnesses of the transfiguration of Christ,” had first been “chosen as witnesses of a special manifestation, that of the raising of the daughter of Jairus,” and later “the same three were the sole witnesses of our Lord’s night agony in Gethsemane.” In Luke’s own telling the next time is the mount, where He “took Peter and John and James, and went up into a mountain to pray” ([[Luke 9:28]]).

      Inside the house Jesus takes complete charge. Only the three and the girl’s parents go in, and when the mourners laugh He puts them all out (verse 54).
    sources: [talmage-jesus-christ-23, lds-scriptures]
  - ref: 52
    phrase: she is not dead, but sleepeth
    kind: words
    title: Not dead, but sleeping
    body: |
      The girl was dead, and everyone in the house knew it; that is why they laughed. To speak of death as sleep was common in the speech of the time, and the New Testament does it often ([[John 11:11–14]]; [[1 Thes. 4:14]]). His words told them that this sleep would be short. The mourners took Him with a literalness the words do not warrant, and the irony is Luke’s: they know she is dead, but they do not know that He has the power to treat death as sleep.
    sources: [talmage-jesus-christ-20, brown-testimony-luke]
  - ref: 55
    phrase: her spirit came again
    kind: christ
    title: Her spirit came again
    body: |
      Matthew and Mark say only that she arose ([[Matt. 9:25]]; [[Mark 5:42]]); Luke says her spirit came back. At death the girl’s spirit had left her body; Jesus calls it back, and she gets up. The words recall Elijah and the widow’s son, when “the soul of the child came into him again, and he revived” ([[1 Kgs. 17:22]]). The order to give her something to eat is a kindness, and in Luke perhaps a proof as well: for Luke, eating shows that one who was dead is truly alive, as it will when the risen Lord eats before His disciples ([[Luke 24:41–43]]).

      This is not resurrection. Her spirit and body were reunited to go on with an interrupted mortal life, and she would die again. Jesus Christ was the first to come forth from the tomb immortal. Still, a father who watched his only daughter die and then live again had seen something that prefigured the Savior’s own death and Resurrection.

      Then He tells the parents to tell no one, though He had sent the Gadarene home to tell everything (verse 39). Luke does not say why. The charge may reflect the mourners’ scorn: He leaves those who laughed to believe what they will.
    sources: [brown-testimony-luke, talmage-jesus-christ-20, olson-ministered]

christ: |
  Luke 8 shows Jesus Christ as the Lord whom wind and water, devils, disease and death all obey. He rebukes the storm as the One who commanded the waters at the Creation, sends a legion of spirits begging to be spared the abyss, gives His own power to a woman who touches the tassel of His cloak, and calls a dead girl’s spirit back to her body: creator and redeemer both. His word is the seed of the parable, and those who hear it “in an honest and good heart,” keep it and “bring forth fruit with patience” (verse 15) He counts as His own mother and brothers (verse 21). That fruit comes as Alma said it would, by “your faith, and your diligence, and patience, and long-suffering, waiting for the tree to bring forth fruit unto you” ([[Alma 32:43]]). The same word reaches a disciple now, and what this chapter asks of its hearers is what it asks still: an honest and good heart, a word kept over time, and faith in place of fear (verses 15, 25, 50).

explore: |
  - **The other tellings.** [[Matt. 13:1–23]] and [[Mark 4:1–25]] for the sower; [[Matt. 12:46–50]] and [[Mark 3:31–35]] for His mother and brothers; [[Matt. 8:23–34]] and [[Mark 4:35–5:20]] for the storm and the Gadarene; [[Matt. 9:18–26]] and [[Mark 5:21–43]] for Jairus and the woman, where Mark keeps Jesus’s Aramaic words to the girl.
  - **The sower and Lehi’s dream.** [[1 Ne. 8:21–33]], whose four companies of people the KnoWhy “How Does the Parable of the Sower Help Us Understand Lehi’s Vision of the Tree of Life?” sets beside the four soils, and [[Alma 32:28–43]], the seed planted in the heart.
  - **The soils today.** Elder Dallin H. Oaks’s conference talk “The Parable of the Sower” (April 2015) takes each kind of ground in turn as a way of receiving the word.
  - **The women at the end.** [[Luke 23:49]], [[Luke 23:55–56]] and [[Luke 24:10]], where the women who followed from Galilee watch at the cross and the tomb and bring the first news of the Resurrection.

