chapter: 17
title: Thy Faith Hath Made Thee Whole
tagline: Jesus warns against causing others to stumble, commands forgiveness without limit, answers the apostles’ plea for faith with a mustard seed and an unprofitable servant, heals ten lepers of whom one returns, and tells the Pharisees and His disciples how the kingdom comes.
when: 'On the journey to Jerusalem, passing through Samaria and Galilee ([[Luke 17:11]])'

setting: |
  Luke 17 is still on the road. Since [[Luke 9:51]] Jesus has been on a long, deliberately extended journey to Jerusalem, and verse 11 is one of Luke’s reminders of it. His disciples are His chief audience, as they have been since [[Luke 16:1]], though Pharisees mixed into the crowd may be listening too, and in verse 20 they put a question to Him.

  The sayings on offences and forgiveness carry on from the rich man who ignored the beggar at his gate ([[Luke 16:19–31]]). Several of the sayings resemble words in Matthew: offences and forgiveness in [[Matt. 18]], the days of Noah and the one taken in [[Matt. 24]]. The settings differ, and Luke’s may well be similar teachings given on a different occasion; the parallels below list both. The healing of the ten lepers, with a Samaritan the only one to come back, is Luke’s alone.

  The Joseph Smith Translation recasts verse 21 and expands the last verse into five (JST Luke 17:36–40), on the gathering of the saints and a new heaven and a new earth, words with no counterpart anywhere else in the Gospels.

thread: |
  **Luke 17 is about faith that acts on the Lord’s word and gives Him the glory.**

  The apostles hear what discipleship asks: never to make another stumble, and to forgive the same brother seven times in a day. They ask for more faith. Jesus does not give them more; He leads them to faith of a higher kind, faith as small as a seed that is obeyed, and a servant who does what he is told and claims no merit for it.

  The ten lepers then show that faith at work. All ten set out for the priests on His bare word and are cleansed on the road, and in that the healing answers the apostles’ request a second time. But only one, a Samaritan, turns back to give thanks, and only he hears “thy faith hath made thee whole.”

  The chapter ends on the kingdom. The Pharisees ask when it will come and miss that it stands among them in Jesus. To His disciples He speaks of the day of the Son of man, which will overtake people absorbed in ordinary life. Read with the Joseph Smith Translation, those He takes to Himself are those who, among other things, set this world’s goods aside and do not look back as Lot’s wife did.

sections:
  - range: 1-10
    heading: Offences, forgiveness and faith
    plain: |
      Jesus said to His disciples, “Things that make people stumble are bound to come, but woe to the one through whom they come! He would be better off thrown into the sea with a millstone around his neck than causing one of these little ones to stumble. Watch yourselves. If your brother wrongs you, rebuke him, and if he repents, forgive him. Even if he wrongs you seven times in a day, and seven times comes back to you saying, ‘I repent,’ you must forgive him.”

      The apostles said to the Lord, “Increase our faith.” The Lord said, “If you had faith as small as a mustard seed, you could say to this mulberry tree, ‘Be pulled up by the roots and planted in the sea,’ and it would obey you.

      “Suppose one of you has a servant plowing or looking after the cattle. When he comes in from the field, will you say to him, ‘Come at once and sit down to eat’? Won’t you say instead, ‘Get my supper ready, put on your apron and wait on me while I eat and drink; after that you can eat and drink’? Does he thank the servant for doing what he was told? I don’t think so. It is the same with you. When you have done everything you were commanded, say, ‘We are unworthy servants; we have only done our duty.’”
  - range: 11-19
    heading: Ten lepers
    plain: |
      On the way to Jerusalem, Jesus was passing through Samaria and Galilee. As He came into a village, ten men with leprosy met Him. They kept their distance and called out, “Jesus, Master, have mercy on us!” When He saw them He said, “Go and show yourselves to the priests.” And as they went, they were cleansed.

      One of them, when he saw that he was healed, came back praising God in a loud voice. He threw himself face down at Jesus’s feet and thanked Him, and he was a Samaritan. Jesus said, “Weren’t ten made clean? Where are the other nine? Was no one found to come back and give glory to God except this foreigner?” Then He said to him, “Get up and go your way. Your faith has made you whole.”
  - range: 20-37
    heading: The coming of the kingdom
    plain: |
      The Pharisees asked Him when the kingdom of God would come. He answered, “The kingdom of God does not come in a way you can watch for. No one will say, ‘Look, here it is!’ or ‘There it is!’ For the kingdom of God is already among you.”

      Then He said to the disciples, “The time is coming when you will long to see one of the days of the Son of man, and you will not see it. People will tell you, ‘Look, there he is!’ or ‘Here he is!’ Don’t go running after them. For as lightning flashes and lights up the sky from one end to the other, so will the Son of man be in His day. But first He must suffer many things and be rejected by this generation.

      “As it was in the days of Noah, so it will be in the days of the Son of man. People were eating and drinking, marrying and being given in marriage, right up to the day Noah went into the ark; then the flood came and destroyed them all. It was the same in the days of Lot. People were eating and drinking, buying and selling, planting and building. But the day Lot left Sodom, fire and sulfur rained down from heaven and destroyed them all. It will be just like that on the day the Son of man is revealed.

      “On that day, no one on the housetop with his belongings in the house should go down to get them, and no one in the field should go back for anything. Remember Lot’s wife! Whoever tries to keep his life will lose it, and whoever loses his life will preserve it. I tell you, on that night two people will be in one bed; one will be taken and the other left. Two women will be grinding grain together; one will be taken and the other left. Two men will be in the field; one will be taken and the other left.”

      They asked Him, “Where, Lord?” He answered, “Where the body is, there the eagles will gather.”

notes:
  - ref: 1
    phrase: It is impossible but that offences will come
    kind: words
    title: Offences will come
    body: |
      An “offence” here is not a hurt feeling but a stumbling block. The Greek *skandalon* means both a temptation and something that gives offense, and to “offend one of these little ones” (verse 2) is to cause another person to stumble or sin. Jesus is realistic: enticements that push people away from God will arise even within the kingdom. The woe falls on the one who causes them, and the offences He has in mind seem to be intentional, or nearly so, which is why the penalty He names is so severe (the millstone is explained in the note on [[Matt. 18:6]]). The “little ones” are apparently His followers, though the term may include children.
    sources: [brown-testimony-luke]
  - ref: 3
    phrase: rebuke him; and if he repent, forgive him
    kind: scripture
    title: Rebuke, then forgive
    body: |
      Jesus allows a rebuke, but the weight of these two verses falls on the one who forgives, not on the one who did the wrong. Modern revelation sets terms for the rebuke: it is to come “when moved upon by the Holy Ghost,” and be followed by “an increase of love toward him whom thou hast reproved, lest he esteem thee to be his enemy” ([[D&C 121:43]]). Nothing in Jesus’s words permits holding a grudge.

      “Seven times in a day” is not a quota to be counted off; the point is to forgive again and again. Luke’s verse ties the forgiving to the brother’s “I repent,” but the Lord’s word in this dispensation does not wait on the “I repent”: “if he trespass against thee and repent not the first time, nevertheless thou shalt forgive him” ([[D&C 98:41]]), for “of you it is required to forgive all men” ([[D&C 64:10]]).
    sources: [brown-testimony-luke, lds-scriptures]
  - ref: 5
    phrase: Increase our faith
    kind: history
    title: Increase our faith
    body: |
      The apostles’ request answers what Jesus has just asked of them. It follows His warnings against causing offence and His command to forgive without limit: read in that order, they saw how whole-souled a service was required of them, and asked for the faith to give it. Luke calls them “the apostles” here, the first time they appear as a body since Jesus sent them on their first mission in chapter 9 ([[Luke 9:1–6]]).

      Their words are literally “confer faith on us,” a request for more, as though faith were a quantity. Jesus’s answer does not give them more. It leads them to faith of a higher quality, in the mustard seed of verse 6 and the servant of verses 7–10.
    sources: [talmage-jesus-christ-27, brown-testimony-luke]
  - ref: 6
    phrase: this sycamine tree
    kind: symbol
    title: This sycamine tree
    body: |
      The sycamine is a tree with the form and leaves of a mulberry and fruit like a fig. Luke most likely means the mulberry or fig-mulberry, a tree known for its long roots, and “this” suggests that Jesus and His followers were standing beside one. The image is doubly impossible: a deep-rooted tree pulled up by a word, and then planted in the sea, where it could not survive. Faith no bigger than a mustard seed would do it.

      The last words, “it should obey you,” bring in obedience, and Jesus turns it at once on the apostles. Faith that can command a tree is tied to willing submission in the one who has it: the servant who does what he is commanded (verse 10), and not Lot’s wife, who disobeyed (verse 32).
    sources: [thayer, brown-testimony-luke]
  - ref: 8
    phrase: gird thyself, and serve me
    kind: christ
    title: The Master who became a servant
    body: |
      The illustration begins with the apostles as masters (“which of you, having a servant”) and ends with them as the servants (“so likewise ye,” verse 10), a complete reversal. A servant who came in from plowing or feeding the cattle still had to serve the meal; his day’s work was not over until his master had eaten.

      Jesus’s own life follows the same pattern from the other side. He came from a place where He is master, and now He toils as a servant ([[Philip. 2:6–7]]). Luke has already given the end of that story: the day will come when the master girds himself and serves his servants ([[Luke 12:37]]; see the note there).
    sources: [brown-testimony-luke]
  - ref: 10
    phrase: We are unprofitable servants
    kind: words
    title: Unprofitable servants
    body: |
      “Unprofitable” does not mean the disciples’ service is wasted. The Greek *achreios* usually means “worthless, unfit,” and here the servant says it of himself as a pious overstatement: he has done everything he was told, but that was only what he owed, and so he claims no merit. The Joseph Smith Translation sharpens the sense with three added words: “that which was no more than our duty” (JST Luke 17:10).

      King Benjamin says the same of everyone, and gives the reason. Even if we served God with our whole souls we would be unprofitable servants ([[Mosiah 2:21]]), because He blesses obedience at once, and so has already paid, while we remain in His debt forever ([[Mosiah 2:24]]). The key is the word *profit*: an increase in someone’s assets, status or benefits. Nothing any of us could do would add to God’s. That we are His children and that He loves us is not in doubt, but we cannot put Him in our debt.
    sources: [thayer, brown-testimony-luke, lund-divine-indebtedness, lds-scriptures]
  - ref: 11
    phrase: through the midst of Samaria and Galilee
    kind: history
    title: Through the midst of Samaria and Galilee
    body: |
      The phrase means “through the middle of” Samaria and Galilee, not along the line between them, and the order of the names is puzzling (the Joseph Smith Translation puts Galilee first). Some critics conclude that Luke did not know the country. But his geographical details in the earlier stories of Jesus’s ministry match the land precisely, so his later notices should not be dismissed. If Jesus was taking a meandering route through the border towns, the notice holds, for borders then were not as firm as maps suggest. Why the journey seems to double back is taken up in the setting of [[Luke 10]].
    sources: [brown-testimony-luke]
  - ref: 12
    phrase: which stood afar off
    kind: history
    title: Which stood afar off
    body: |
      The law required anyone with a lasting skin disease to live apart: “he shall dwell alone; without the camp shall his habitation be” ([[Lev. 13:46]]). (What biblical leprosy was is in the note on [[Luke 5:12]].) These ten probably came as near as the law allowed and stopped there. The leper of [[Luke 5:12]] came into the town; these men keep their distance. They were probably of mixed nationality, since verse 16 marks one of them as a Samaritan, and the disease they shared had made them companions in distress.
    sources: [lds-scriptures, talmage-jesus-christ-27, brown-testimony-luke]
  - ref: 13
    phrase: Jesus, Master, have mercy on us
    kind: words
    title: Jesus, Master, have mercy on us
    body: |
      “Master” here is not the usual word for a teacher. It is *epistatēs*, an overseer or one placed in charge, a word only Luke uses, and everywhere else in his Gospel it is what the disciples call Jesus ([[Luke 5:5]]; [[Luke 8:24]]; [[Luke 9:33]]). It has been explained as a title that acknowledges His authority rather than His teaching. To “lift up” the voice can mean simply to shout, but here, joined to a plea for mercy, it seems to carry the sense of prayer.

      What the ten ask for is mercy. Mercy, compassion and pity are words Luke uses often, and they shape his portrait of a compassionate Jesus; this healing is one of the instances of that compassion that only Luke records.
    sources: [thayer, brown-testimony-luke, huntsman-lukes-jesus]
  - ref: 14
    phrase: as they went, they were cleansed
    kind: christ
    title: As they went
    body: |
      Jesus says nothing about healing them. He only sends them, as the law of Moses required, to the priests, who alone could declare a leper clean (the law is explained in the note on [[Luke 5:14]]). To set out for the priests while still diseased was to act on His word before there was anything to show for it, and the healing came on the road. Their going ties act and faith together: it was the going, joined to their faith in His word (verse 19), that brought the cleansing.
    sources: [brown-testimony-luke]
  - ref: 18
    phrase: save this stranger
    kind: history
    title: This stranger
    body: |
      The tenth man is a “stranger,” *allogenēs*, “sprung from another race, a foreigner,” a word found in the Septuagint, the Greek Old Testament, but nowhere in secular Greek. Since he alone is marked as a Samaritan, some or all of the others were presumably Jews. The word may also recall the warning notices at the temple, which forbade Gentiles on pain of death to enter the holy area: the man those signs kept out is the one Jesus approves and welcomes.

      His turning back also recalls Naaman the Syrian, who after his cleansing “returned to the man of God” to confess the God of Israel ([[2 Kgs. 5:15]]). Jesus had pointed to Naaman at Nazareth, the one leper of Elisha’s day who was cleansed ([[Luke 4:27]]). For the apostles the scene would likely have been one more evidence that outsiders could be accepted, and could excel.
    sources: [thayer, brown-testimony-luke, talmage-jesus-christ-27]
  - ref: 19
    phrase: thy faith hath made thee whole
    kind: christ
    title: Cleansed, and made whole
    body: |
      All ten were cleansed, but only one is told he is made whole. The verb is *sōzō*, which means both to heal and to save, and its main sense here is likely “thy faith hath saved thee.” Read that way, the nine leave cleansed and the one leaves whole in every sense, physical and spiritual. The nine did as the Lord instructed and received the blessing promised; the story gives the fuller word, “made whole,” only to the one who sought Him out in gratitude.

      Modern revelation states the principle: “he who receiveth all things with thankfulness shall be made glorious” ([[D&C 78:19]]). President Thomas S. Monson drew the contrast from this story: “The expressed gratitude by one merited the Master’s blessing; the ingratitude shown by the nine, His disappointment.”
    sources: [brown-testimony-luke, lds-scriptures, monson-divine-gift-gratitude]
  - ref: 20
    phrase: The kingdom of God cometh not with observation
    kind: words
    title: Not with observation
    body: |
      “Observation” means watching for signs. The Greek phrase describes something that comes in a visible manner, so that it can be watched with the eyes, and Jesus says the kingdom does not come that way. The Pharisees’ question assumes the kingdom is still in the future. It will not announce itself by the signs and wonders its watchers expect, and in fact it is already present, and they have missed it.
    sources: [thayer, brown-testimony-luke]
  - ref: 21
    phrase: the kingdom of God is within you
    kind: words
    title: The kingdom of God is within you
    body: |
      Jesus is not telling the Pharisees that the kingdom is a state of the heart. The “you” is plural, and the Greek here most likely means “in the midst of you”; the sense “in your souls” is one the word allows but the context does not favor. Jesus nowhere says that the kingdom lives inside a person; He says that people live in the kingdom. Here the kingdom is among them because He is: His presence brings it.

      The Joseph Smith Translation reads the verse that way: “the kingdom of God has already come unto you” (JST Luke 17:21). The men asking when it would come were standing in front of it.
    sources: [lds-scriptures, thayer, brown-testimony-luke, jst-luke-17]
  - ref: 25
    phrase: But first must he suffer many things
    kind: christ
    title: But first must he suffer
    body: |
      Turning to His disciples, Jesus speaks of His coming in glory, and puts His suffering first. “Must” translates *dei*, the word of divine necessity, used of both His suffering and His ministry. This is one of several prophecies of His suffering in Luke ([[Luke 9:22]]; [[Luke 18:31–33]]), here tied to the title “Son of man.” His death is what sets His future work in motion.

      The days of longing in verse 22 hint that the coming will not be soon: a long delay will come first. When the Son of man does come, no one will have to search for Him. Like lightning across the sky it will not be hidden, so there is no need to follow anyone who says “see here; or, see there” (verse 23; the same warning is in the note on [[Matt. 24:27]]).
    sources: [brown-testimony-luke]
  - ref: 28
    phrase: they bought, they sold, they planted, they builded
    kind: history
    title: They bought, they sold
    body: |
      Nothing Jesus lists for the days of Noah and of Lot is a sin in itself. Eating, drinking, marrying, buying, selling, planting and building are ordinary life. Yet in the book of Moses, Noah’s hearers answer his preaching by pointing to just such things: “are we not eating and drinking, and marrying and giving in marriage?” ([[Moses 8:21]]). Activities like these colored only the surface of a society under which other ills festered. Jesus does not name the sins of Sodom, though His hearers knew them. To Lot’s day He adds what He left out of Noah’s, buying and selling, planting and building: possessions, and their power to draw attention away from what really matters.
    sources: [brown-testimony-luke, lds-scriptures]
  - ref: 32
    phrase: Remember Lot’s wife
    kind: scripture
    title: Remember Lot’s wife
    body: |
      Verse 31 can sound like advice for fleeing a city under attack, but the Joseph Smith Translation makes it “the disciple who” is on the housetop: Jesus is speaking of His followers, not of unbelievers. Lot’s wife looked back toward Sodom and became a pillar of salt ([[Gen. 19:26]]). Seen through Jesus’s words, she evidently yearned to go home for the things she loved, and that longing is what He criticizes. “Remember” asks for more than recall: it is an active remembering that shapes how one lives and worships.

      Elder Jeffrey R. Holland drew the lesson: “she looked back longingly. In short, her attachment to the past outweighed her confidence in the future.” Put in terms of faith, he said, she doubted that the Lord could give her something better than what she already had. Verse 33 says it as a paradox: the life one tries to keep is the present, self-centered life with its possessions, and keeping it is how it is lost. The Lord gave the warning again in this dispensation: “he that goeth, let him not look back lest sudden destruction shall come upon him” ([[D&C 133:15]]).
    sources: [brown-testimony-luke, holland-remember-lots-wife, lds-scriptures]
  - ref: 34
    phrase: the one shall be taken, and the other shall be left
    kind: words
    title: One taken, the other left
    body: |
      Read with the Joseph Smith Translation, “taken” means taken to safety. The verb *paralambanō* can mean to be taken into the kingdom away from harm, and that is most likely the sense here: the Lord takes the person to Himself. The Joseph Smith Translation says where. The disciples ask, “Where, Lord, shall they be taken?” and the answer is “the gathering of his saints; and of angels descending and gathering the remainder unto them; the one from the bed, the other from the grinding, and the other from the field” (JST Luke 17:36, 38). By that reading, those taken do not go to an ill judgment, as some have held.

      “Two” in verse 34 has no gender in the Greek, and the Joseph Smith Translation leaves out the King James “men.” Verse 36 is missing from the best manuscripts, and may have been added by a later copyist from [[Matt. 24:40]]; the Joseph Smith Translation keeps it.
    sources: [brown-testimony-luke, jst-luke-17]
  - ref: 37
    phrase: Wheresoever the body is, thither will the eagles be gathered together
    kind: symbol
    title: The body and the eagles
    body: |
      The disciples’ “Where, Lord?” gets a proverb, and most commentators read it grimly: the body is a corpse and the birds are vultures, chiefly because Matthew’s form of the saying uses the word for a carcass ([[Matt. 24:28]]; see the note there). Read that way, it is one more warning to those who are willfully unprepared. But Luke’s word, *sōma*, need not mean a dead body, and the Joseph Smith Translation paints a different scene: “whithersoever the saints are gathered, thither will the eagles be gathered together; or, thither will the remainder be gathered together” (JST Luke 17:37). The body is alive. It is those who have been taken.

      The translation then carries the answer past the gathering to what follows it, in words that appear nowhere else in the Gospels: “there shall be new heavens, and a new earth, wherein dwelleth righteousness,” the old earth vanishing like a worn-out garment and “the footstool” remaining “sanctified, cleansed from all sin” (JST Luke 17:39–40).
    sources: [brown-testimony-luke, jst-luke-17]

christ: |
  Luke 17 shows Jesus Christ as the Master who became a servant. He came from where He is master to toil as one who serves, and He is the Son of man who “must” first suffer and be rejected before He comes in glory. Wholeness is His to give: ten were cleansed, but He told the Samaritan leper who turned back to give thanks that his faith had made him whole.

  The same holds for a disciple now. The Lord requires His disciples to forgive all men ([[D&C 64:10]]), and the one who receives all things with thankfulness is made glorious ([[D&C 78:19]]).

explore: |
