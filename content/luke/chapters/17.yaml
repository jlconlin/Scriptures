chapter: 17
title: Thy Faith Hath Made Thee Whole
tagline: Jesus warns against causing others to stumble, commands forgiveness without limit, answers the apostles’ plea for faith with a mustard seed and an unprofitable servant, heals ten lepers of whom one returns, and tells the Pharisees and His disciples how the kingdom comes.
when: 'On the journey to Jerusalem, passing through Samaria and Galilee ([[Luke 17:11]])'

setting: |
  Luke 17 is still on the road. Since [[Luke 9:51]] Jesus has been on a long, deliberately extended journey to Jerusalem, and verse 11 is one of Luke’s reminders of it. His disciples are His chief audience, as they have been since [[Luke 16:1]], though Pharisees mixed into the crowd may be listening too, and in verse 20 they put a question to Him.

  The sayings on offences and forgiveness carry on from the rich man who ignored the beggar at his gate ([[Luke 16:19–31]]). Several of the sayings resemble words in Matthew: offences and forgiveness in [[Matt. 18]], the days of Noah and the one taken in [[Matt. 24]]. The settings differ, and Luke’s may well be similar teachings given on a different occasion; the parallels below list both. The healing of the ten lepers, with a Samaritan the only one to come back, is Luke’s alone.

  The Joseph Smith Translation recasts verse 21 and expands the last verse into five (JST Luke 17:36–40), on the gathering of the saints and a new heaven and a new earth.

thread: |
  **Luke 17 is about faith that acts on the Lord’s word and gives Him the glory.**

  The apostles hear what discipleship asks: never to make another stumble, and to forgive the same brother seven times in a day. They ask for more faith. Jesus answers by pointing them to faith as small as a seed that is obeyed, and to a servant who does what he is told and claims no merit for it.

  The ten lepers then show that faith at work. All ten set out for the priests on His bare word and are cleansed on the road, and in that the healing answers the apostles’ request a second time. But only one, a Samaritan, turns back to give thanks, and only he hears “thy faith hath made thee whole.”

  The chapter ends on the kingdom. The Pharisees ask when it will come and miss that it stands among them in Jesus. To His disciples He speaks of the day of the Son of man, which will overtake people absorbed in ordinary life. Those He takes to Himself are those who, among other things, set this world’s goods aside and do not look back as Lot’s wife did.

sections:
  - range: 1-10
    heading: Offences, forgiveness and faith
    plain: |
      Jesus said to His disciples, “Things that make people stumble are bound to come, but woe to the one through whom they come! He would be better off thrown into the sea with a millstone around his neck than causing one of these little ones to stumble. Watch yourselves. If your brother wrongs you, rebuke him, and if he repents, forgive him. Even if he wrongs you seven times in a day, and seven times comes back to you saying, ‘I repent,’ you must forgive him.”

      The apostles said to the Lord, “Increase our faith.” The Lord said, “If you had faith as small as a mustard seed, you could say to this mulberry tree, ‘Be pulled up by the roots and planted in the sea,’ and it would obey you.

      “Suppose one of you has a servant plowing or looking after the cattle. When he comes in from the field, will you say to him, ‘Come at once and sit down to eat’? Won’t you say instead, ‘Get my supper ready, put on your apron and wait on me while I eat and drink; after that you can eat and drink’? Does he thank the servant for doing what he was told? I don’t think so. It is the same with you. When you have done everything you were commanded, say, ‘We are unworthy servants; we have only done our duty.’”
  - range: 11-19
    heading: Ten lepers
    plain: |
      On the way to Jerusalem, Jesus was passing through Samaria and Galilee. As He came into a village, ten men with leprosy met Him. They kept their distance and called out, “Jesus, Master, have mercy on us!” When He saw them He said, “Go and show yourselves to the priests.” And as they went, they were cleansed.

      One of them, when he saw that he was healed, came back praising God in a loud voice. He threw himself face down at Jesus’s feet and thanked Him, and he was a Samaritan. Jesus said, “Weren’t ten made clean? Where are the other nine? Was no one found to come back and give glory to God except this foreigner?” Then He said to him, “Get up and go your way. Your faith has made you whole.”
  - range: 20-37
    heading: The coming of the kingdom
    plain: |
      The Pharisees asked Him when the kingdom of God would come. He answered, “The kingdom of God does not come in a way you can watch for. No one will say, ‘Look, here it is!’ or ‘There it is!’ For the kingdom of God is among you.”

      Then He said to the disciples, “The time is coming when you will long to see one of the days of the Son of man, and you will not see it. People will tell you, ‘Look, there he is!’ or ‘Here he is!’ Don’t go running after them. For as lightning flashes and lights up the sky from one end to the other, so will the Son of man be in His day. But first He must suffer many things and be rejected by this generation.

      “As it was in the days of Noah, so it will be in the days of the Son of man. People were eating and drinking, marrying and being given in marriage, right up to the day Noah went into the ark; then the flood came and destroyed them all. It was the same in the days of Lot. People were eating and drinking, buying and selling, planting and building. But the day Lot left Sodom, fire and sulfur rained down from heaven and destroyed them all. It will be just like that on the day the Son of man is revealed.

      “On that day, no one on the housetop with his belongings in the house should go down to get them, and no one in the field should go back for anything. Remember Lot’s wife! Whoever tries to keep his life will lose it, and whoever loses his life will preserve it. I tell you, on that night two people will be in one bed; one will be taken and the other left. Two women will be grinding grain together; one will be taken and the other left. Two men will be in the field; one will be taken and the other left.”

      They asked Him, “Where, Lord?” He answered, “Where the body is, there the eagles will gather.”

notes:
  - ref: 1
    phrase: It is impossible but that offences will come
    kind: words
    title: Offences will come
    body: |
      An “offence” here is not a hurt feeling but a stumbling block. The Greek *skandalon* is properly the trigger-stick of a trap, and so anything put in someone’s way that makes him stumble or fall; in the plural, as here, it means words or deeds that entice to sin. Jesus says such things are bound to come, and lays the woe on the one through whom they come.

      Coming straight after the rich man who feasted while Lazarus lay at his gate ([[Luke 16:19–31]]), the saying can be read as naming that kind of self-indulgent life as one of the offences. The “little ones” of verse 2 are then His disciples, who are made to stumble when they follow a bad example, or whose faith is shaken when they see the form of godliness without its power. (The millstone is explained in the note on [[Matt. 18:6]].)
    sources: [thayer, ellicott-luke]
  - ref: 3
    phrase: rebuke him; and if he repent, forgive him
    kind: scripture
    title: Rebuke, then forgive
    body: |
      “Take heed to yourselves” turns the warning back on the disciples. Having warned against causing others to stumble, Jesus checks in them a fault hardly less dangerous: sitting in hard, unforgiving judgment on other people’s sins. What He asks instead is a rebuke, an open and friendly reproof that aims to restore the brother and so leads toward forgiveness, not away from it. Modern revelation describes such reproof: it comes “when moved upon by the Holy Ghost,” and is followed by “an increase of love toward him whom thou hast reproved, lest he esteem thee to be his enemy” ([[D&C 121:43]]).

      “Seven times in a day” is not a lower standard than the “seventy times seven” of [[Matt. 18:22]]; both mean that no number of repeated offences may harden a disciple against the one who says “I repent.” Modern revelation gives the rule in Matthew’s words, forgiving the repentant enemy “until seventy times seven” ([[D&C 98:40]]), and it does not wait on the “I repent”: “if he trespass against thee and repent not the first time, nevertheless thou shalt forgive him” ([[D&C 98:41]]), for “of you it is required to forgive all men” ([[D&C 64:10]]).
    sources: [ellicott-luke, brown-testimony-luke, lds-scriptures]
  - ref: 5
    phrase: Increase our faith
    kind: history
    title: Increase our faith
    body: |
      The apostles’ request answers what Jesus has just asked of them. It follows His warnings against causing offence and His command to forgive without limit: read in that order, they saw how whole-souled a service was required of them, and asked for the faith to give it. Luke calls them “the apostles” here, the first time they appear as a body since Jesus sent them on their first mission in chapter 9 ([[Luke 9:1–6]]).

      The verb they use means to add to what one already has: they ask for more, as though faith were a quantity. Jesus’s answer does not give them more. It leads them to faith of a higher quality, in the mustard seed of verse 6 and the servant of verses 7–10.
    sources: [talmage-jesus-christ-27, thayer, brown-testimony-luke]
  - ref: 6
    phrase: this sycamine tree
    kind: symbol
    title: This sycamine tree
    body: |
      The sycamine is the mulberry, not the sycamore fig that Zacchaeus climbed ([[Luke 19:4]]). It was most likely the black mulberry, which grows upwards of thirty feet tall with a thick crown and rigid branches, so that moving one by any means would be a formidable task. Jesus pictures it pulled up by a word and planted in the sea. The saying recalls the mustard-seed faith that could move “this mountain” ([[Matt. 17:20]]), with the tree in the mountain’s place. Set side by side, the two sayings show how faith works: “by words, instead of by exerting his physical powers,” and with words “its mightiest works have been and will be performed.”

      The tree “should obey you,” and Jesus’s next words turn from what obeys faith to the obedience faith asks of the one who has it. The apostles’ faith, in one Latter-day Saint reading, “could best be gauged by obedience and untiring service,” which is the servant of verses 7–10.
    sources: [ball-plants-nt, ellicott-luke, lectures-on-faith-7, talmage-jesus-christ-27]
  - ref: 8
    phrase: gird thyself, and serve me
    kind: symbol
    title: Gird thyself, and serve me
    body: |
      A servant who came in from plowing or tending the flock had not finished his day. The master had a right to his time, and the master’s meal came first; the servant could not demand thanks or reward for doing what he had been engaged to do. So the apostles, who had given themselves wholly to their Master’s service, were not to hold back whatever the effort asked. The Greek word for “feeding cattle” is the one always used of a shepherd’s work, and both of the servant’s tasks, plowing and shepherding, may hint at the apostles’ own labor.

      “Gird thyself, and serve me” is the other side of an earlier promise in the same Gospel. There the master, finding his servants watching, “shall gird himself, and make them to sit down to meat, and will come forth and serve them” ([[Luke 12:37]]; see the note there). Here He tells them that He too asks a service of them first.
    sources: [talmage-jesus-christ-27, ellicott-luke, lds-scriptures]
  - ref: 10
    phrase: We are unprofitable servants
    kind: words
    title: Unprofitable servants
    body: |
      “Unprofitable” does not mean the disciples’ service is wasted. The Greek *achreios* usually means “worthless, unfit,” and here the servant says it of himself as a pious overstatement: he has done everything he was told, but that was only what he owed, and so he claims no merit. The Joseph Smith Translation sharpens the sense with three added words: “that which was no more than our duty” (JST Luke 17:10).

      King Benjamin says the same of everyone, and gives the reason. Even if we served God with our whole souls we would be unprofitable servants ([[Mosiah 2:21]]), because He blesses obedience at once, and so has already paid, while we remain in His debt forever ([[Mosiah 2:24]]).
    sources: [thayer, brown-testimony-luke, lds-scriptures]
  - ref: 11
    phrase: through the midst of Samaria and Galilee
    kind: history
    title: Through the midst of Samaria and Galilee
    body: |
      Luke’s mention of Samaria and Galilee places the healing on Jesus’s journey to Jerusalem. Luke names Jerusalem as Jesus’s destination from the start of the journey ([[Luke 9:51]]) and mentions it again and again along the way ([[Luke 13:22]]; [[Luke 18:31]]; [[Luke 19:11]]), but he does not trace a direct route: his account is a journey of discipleship more than an itinerary. Only Luke says the road led through Samaria, apparently the part of it bordering Galilee, and he says so because of the healing that follows, in which the one who returns is a Samaritan.

      That Jesus is in Samaria again, after being at Martha’s house, which is assumed to have been in Bethany near Jerusalem ([[Luke 10:38]]), suggests either that He went back and forth on His way to Jerusalem or that Luke did not set these events in the order they happened. The setting of [[Luke 10]] takes this up.
    sources: [olson-final-trek, ellicott-luke]
  - ref: 12
    phrase: which stood afar off
    kind: history
    title: Which stood afar off
    body: |
      The law required anyone with a lasting skin disease to live apart: “he shall dwell alone; without the camp shall his habitation be” ([[Lev. 13:46]]). (What biblical leprosy was is in the note on [[Luke 5:12]].) These ten probably came as near as the law allowed and stopped there. The leper of [[Luke 5:12]] came into the town; these men keep their distance. Since Jesus singles out the Samaritan as “this stranger” (verse 18), the others were presumably not Samaritans, so the group was probably of mixed nationality; the disease they shared had made them companions in distress.
    sources: [lds-scriptures, talmage-jesus-christ-27, brown-testimony-luke]
  - ref: 13
    phrase: Jesus, Master, have mercy on us
    kind: words
    title: Jesus, Master, have mercy on us
    body: |
      “Master” here is not the usual word for a teacher. It is *epistatēs*, an overseer or one placed in charge, a word only Luke uses, and everywhere else in his Gospel it is what the disciples call Jesus ([[Luke 5:5]]; [[Luke 8:24]]; [[Luke 9:33]]). It has been explained as a title that acknowledges His authority rather than His teaching. To “lift up” the voice can mean simply to shout, but here, joined to a plea for mercy, it seems to carry the sense of prayer.

      What the ten ask for is mercy. Mercy, compassion and pity are words Luke uses often, and they shape his portrait of a compassionate Jesus; this healing is one of the instances of that compassion that only Luke records.
    sources: [thayer, brown-testimony-luke, huntsman-lukes-jesus]
  - ref: 14
    phrase: as they went, they were cleansed
    kind: christ
    title: As they went
    body: |
      Jesus does not touch them or tell them they are healed. He sends them, still leprous, to the priests, for no one who had been a leper could lawfully return to the community until a priest pronounced him clean (the law is explained in the note on [[Luke 5:14]]). The command implied that they would be healed, but with no touch to serve as the means and pledge of healing, it was a test of their faith even more than the earlier cleansing had been, and obedience was the test. They did not have to reach Jerusalem; any priest in any town could inspect them. They set out on His word before there was anything to show for it, and the cleansing came on the road.
    sources: [talmage-jesus-christ-27, ellicott-luke]
  - ref: 18
    phrase: save this stranger
    kind: history
    title: This stranger
    body: |
      The tenth man is a “stranger,” *allogenēs*, “sprung from another race, a foreigner,” a word found in the Septuagint, the Greek Old Testament, but nowhere in secular Greek, and one that points to Gentiles. Since he alone is marked as a Samaritan, some or all of the others were presumably Jews. Because the word is the one for an outsider to Israel, it may also recall the warning notices at the temple, which forbade Gentiles on pain of death to enter the holy area; read that way, the kind of man those signs kept out is the one Jesus approves and welcomes.

      His turning back may also recall Naaman the Syrian, who after his cleansing “returned to the man of God” to confess the God of Israel ([[2 Kgs. 5:15]]). Jesus had pointed to Naaman at Nazareth, the one leper of Elisha’s day who was cleansed ([[Luke 4:27]]). For the apostles the scene would likely have been one more evidence that outsiders could be accepted, and could excel.
    sources: [thayer, brown-testimony-luke, talmage-jesus-christ-27]
  - ref: 19
    phrase: thy faith hath made thee whole
    kind: christ
    title: Cleansed, and made whole
    body: |
      All ten were cleansed, but only one is told he is made whole. The verb is *sōzō*, which means both to heal and to save, and its main sense here is likely “thy faith hath saved thee.” Read that way, the nine leave cleansed and the one leaves whole in every sense, physical and spiritual. The nine did as the Lord instructed and received the blessing promised; the story gives the fuller word, “made whole,” only to the one who sought Him out in gratitude.

      Modern revelation states the principle: “he who receiveth all things with thankfulness shall be made glorious” ([[D&C 78:19]]). The two responses met two different answers: “The expressed gratitude by one merited the Master’s blessing; the ingratitude shown by the nine, His disappointment.”
    sources: [brown-testimony-luke, lds-scriptures, monson-divine-gift-gratitude]
  - ref: 20
    phrase: The kingdom of God cometh not with observation
    kind: words
    title: Not with observation
    body: |
      “Observation” means careful, anxious watching, and the English word answers the Greek closely: the phrase describes something that comes in a visible manner, so that it can be watched with the eyes. Jesus says the kingdom does not come that way. The word fits the men who asked. Pharisees had “watched” Jesus before, with the verb from which this noun comes, hoping to find an accusation against Him ([[Luke 6:7]]; [[Luke 14:1]]), and others were looking for a sign from heaven to show that He was the promised King. Neither kind of watching would find the kingdom.
    sources: [thayer, ellicott-luke, lds-scriptures]
  - ref: 21
    phrase: the kingdom of God is within you
    kind: words
    title: The kingdom of God is within you
    body: |
      Jesus is not telling the Pharisees that the kingdom is a state of the heart. “Within” renders *entos*, an adverb of place, and the “you” is plural, which is why many translations read “among”: He is speaking to the Pharisees as a group, and the phrase is best taken as “in the midst of you.” “In your souls” is a sense the word allows but the context does not favor; Jesus nowhere says that the kingdom lives inside a person, but that people live in the kingdom. The kingdom was among them because He was: His presence brought it.

      The Joseph Smith Translation reads the verse that way: “the kingdom of God has already come unto you” (JST Luke 17:21).
    sources: [lds-scriptures, thayer, brown-testimony-luke, jst-luke-17]
  - ref: 25
    phrase: But first must he suffer many things
    kind: christ
    title: But first must he suffer
    body: |
      Into a discourse on His coming in glory, Jesus sets a prophecy of His suffering and death, and only Luke’s record places it here. Before the Son of man shines like lightning across the sky (verse 24), He “must” suffer and be rejected. In the New Testament *dei*, “must,” is used for a necessity set by God’s own purpose for the salvation of men, above all for what Christ was to undergo: His sufferings, death and resurrection. Luke records that necessity before this ([[Luke 9:22]]) and after it, on the way up to Jerusalem ([[Luke 18:31–33]]) and from the risen Lord Himself: “thus it behoved Christ to suffer, and to rise from the dead the third day” ([[Luke 24:46]]).

      The warning of verse 23 against those who say “see here; or, see there” is taken up in the note on [[Matt. 24:27]].
    sources: [thayer, ellicott-luke, lds-scriptures]
  - ref: 28
    phrase: they bought, they sold, they planted, they builded
    kind: history
    title: They bought, they sold
    body: |
      What Jesus lists for the days of Noah and of Lot is the business of ordinary life: eating, drinking, marrying, buying, selling, planting, building. The Greek tenses picture it going on, “they were buying, they were selling,” right up to the day the judgment came. To Lot’s day He adds buying and selling, planting and building, the marks of a more settled and advanced society than Noah’s.

      The book of Moses says what lay beneath the ordinary life of Noah’s day: “The earth was corrupt before God, and it was filled with violence” ([[Moses 8:28]]; [[Moses 8:29–30]]). It also says that in that day “Noah found grace in the eyes of the Lord” and “walked with God” ([[Moses 8:27]]), and one Latter-day Saint reading draws the lesson for the days before the Lord’s coming: however hard they prove, it will be possible to remain faithful.
    sources: [ellicott-luke, ogden-prophecies-jsm, lds-scriptures]
  - ref: 32
    phrase: Remember Lot’s wife
    kind: scripture
    title: Remember Lot’s wife
    body: |
      Verse 31 can sound like advice for fleeing a city under attack, but the Joseph Smith Translation makes it “the disciple who” is on the housetop: Jesus is speaking of His followers, not of unbelievers. Lot’s wife looked back toward Sodom and became a pillar of salt ([[Gen. 19:26]]), and Genesis does not say why. Set beside verse 31, her look back is best read as longing to go home for the things she loved, the longing Jesus warns against. Put in terms of faith, “she looked back longingly. In short, her attachment to the past outweighed her confidence in the future”: she doubted that the Lord could give her something better than what she already had. “Remember” asks for more than recall: it is an active remembering that shapes how one lives and worships.

      Verse 33 states the paradox behind the warning, read in this setting as the present, self-centered life with its possessions: the life one tries to keep is the life lost. The Lord gave the warning again in this dispensation: “he that goeth, let him not look back lest sudden destruction shall come upon him” ([[D&C 133:15]]).
    sources: [brown-testimony-luke, holland-remember-lots-wife, lds-scriptures]
  - ref: 34
    phrase: the one shall be taken, and the other shall be left
    kind: words
    title: One taken, the other left
    body: |
      The one “taken” is the one rescued from destruction. That is the likelier sense in Matthew’s form of the saying too ([[Matt. 24:40–41]]); Luke’s adds a pair in one bed, an even closer companionship than the field or the mill. The Joseph Smith Translation says where they are taken. The disciples ask, “Where, Lord, shall they be taken?” and the answer is “the gathering of his saints; and of angels descending and gathering the remainder unto them; the one from the bed, the other from the grinding, and the other from the field” (JST Luke 17:36, 38). Modern revelation says the same of the Saints alive at His coming: they “shall be quickened and be caught up to meet him” ([[D&C 88:96]]; see the note on [[JS—M 1:44]]).

      In verse 34 the Greek has only “two”; the word “men” is not in it. Verse 36, the two in the field, is in the Greek text behind the King James Version but not in the modern critical editions.
    sources: [ellicott-luke, jst-luke-17, ogden-prophecies-jsm, lds-scriptures, greek-nt]
  - ref: 37
    phrase: Wheresoever the body is, thither will the eagles be gathered together
    kind: symbol
    title: The body and the eagles
    body: |
      The disciples’ “Where, Lord?” gets a proverb, and taken alone it sounds grim. The Greek *sōma*, “body,” can mean a corpse, and the lexicon takes it so here; Matthew’s form of the saying has “carcase” ([[Matt. 24:28]]; see the note there). Read that way, the proverb answers that God’s judgments fall wherever they are needed, as surely as birds gather where a carcass lies.

      The Joseph Smith Translation gives the saying a different meaning: “whithersoever the saints are gathered, thither will the eagles be gathered together; or, thither will the remainder be gathered together” (JST Luke 17:37). The body is the gathered saints, and the eagles are, in the translation’s own gloss, “the remainder,” gathering to them (the note on [[JS—M 1:27]] reads Matthew’s saying the same way). The translation then carries the answer past the gathering to what follows it: “there shall be new heavens, and a new earth, wherein dwelleth righteousness,” the old earth vanishing like a worn-out garment and “the footstool” remaining “sanctified, cleansed from all sin” (JST Luke 17:39–40).
    sources: [thayer, ellicott-luke, lds-scriptures, jst-luke-17]

christ: |
  Luke 17 shows Jesus Christ as the Master who became a servant. He came from where He is master and took “upon him the form of a servant” ([[Philip. 2:7]]), and He is the Son of man who “must” first suffer and be rejected before He comes in glory. Wholeness is His to give: ten were cleansed, but He told the Samaritan leper who turned back to give thanks that his faith had made him whole.

  The same holds for a disciple now. The Lord requires His disciples to forgive all men ([[D&C 64:10]]), and the one who receives all things with thankfulness is made glorious ([[D&C 78:19]]).

