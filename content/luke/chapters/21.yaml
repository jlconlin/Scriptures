chapter: 21
title: Your Redemption Draweth Nigh
tagline: Jesus praises a poor widow’s two mites, foretells that the temple will be thrown down and Jerusalem surrounded by armies and trodden down until the times of the Gentiles are fulfilled, tells of the signs before His coming, and bids His disciples watch and pray.
when: 'In the temple at Jerusalem, in the last week of Jesus’s mortal ministry'

setting: |
  Luke 21 closes Jesus’s teaching in the temple, which began when He drove out the sellers and “taught daily in the temple” ([[Luke 19:47]]). It is the last week of His ministry, probably midweek. The chapter opens with a poor widow’s gift and ends with the crowds coming early to hear Him; between the two stands His long prophecy of what was coming on the temple, on Jerusalem and on the world.

  Matthew and Mark tell the same sermon ([[Matt. 24]]; [[Mark 13]]) and set it on the Mount of Olives. Luke names no place for it, and read alone his account could seem to go on in the temple; the other accounts and modern revelation make clear that the full discourse was given on the mount.

  Latter-day Saints have more than three accounts of this sermon. Joseph Smith revised all three in his translation of the Bible, changing Luke’s account less than the other two, and his revision of Matthew 24 is printed as [[JS—M 1]] in the Pearl of Great Price, where the site’s fullest commentary on the discourse stands. On 7 March 1831 the Lord Himself rehearsed the sermon in a revelation, “as I showed it unto my disciples as I stood before them in the flesh” ([[D&C 45:16]]); [[D&C 45:16–59]] is in large part another account of it. The notes below answer what is Luke’s own and point to those chapters for the rest.

thread: |
  **The disciples ask when; Jesus answers with two times, and with how to live in between.**

  The widow’s whole gift, given in a temple whose patrons gave from their abundance, leads straight to the prophecy that not one of the temple’s fine stones will be left on another. The disciples ask when, and what sign. Jesus first warns against anyone who says the end is at hand: wars, persecution and betrayal must come first, and “the end is not by and by” (verse 9). Then He gives the sign for Jerusalem, plainly: armies around the city. The city will fall, its people be scattered, and Jerusalem be trodden down “until the times of the Gentiles be fulfilled” (verse 24).

  Joseph Smith’s translation then marks a turn: the signs in the sun, moon and stars, and the Son of Man in a cloud, belong to “the generation in which the times of the Gentiles shall be fulfilled.” So the sermon ends not with a date but with a charge for the whole interval: endure, do not be weighed down, watch and pray, so as to stand before the Son of Man.

sections:
  - range: 1-4
    heading: The widow’s two mites
    plain: |
      Jesus looked up and saw the rich putting their gifts into the temple treasury. He also saw a poor widow put in two tiny coins. “I tell you truly,” He said, “this poor widow has put in more than all of them. They all gave out of their surplus into the offering chests, but she, out of her poverty, has put in everything she had to live on.”
  - range: 5-7
    heading: Not one stone left on another
    plain: |
      Some were talking about the temple, how it was adorned with beautiful stones and offerings. Jesus said, “As for these things you are looking at, the days will come when not one stone will be left on another; every one will be thrown down.” They asked Him, “Teacher, when will these things happen? And what will be the sign that they are about to take place?”
  - range: 8-19
    heading: Deceivers, wars and persecution
    plain: |
      He said, “Be careful that you are not deceived. Many will come in my name, saying, ‘I am the Christ,’ and, ‘The time is near.’ Do not follow them. When you hear of wars and uprisings, do not be terrified. These things must happen first, but the end will not come right away.” Then He told them, “Nation will rise against nation, and kingdom against kingdom. There will be great earthquakes, and famines and epidemics in many places, and fearful sights and great signs from heaven.

      “But before all this, they will seize you and persecute you. They will hand you over to synagogues and put you in prison, and you will be brought before kings and rulers because of my name. It will be your opportunity to bear witness. So make up your minds not to rehearse your defense beforehand, for I will give you words and wisdom that none of your opponents will be able to resist or contradict. You will be betrayed even by parents, brothers, relatives and friends, and they will put some of you to death. Everyone will hate you because of my name. But not a hair of your head will perish. By your endurance you will gain your souls.
  - range: 20-24
    heading: Jerusalem surrounded by armies
    plain: |
      “When you see Jerusalem surrounded by armies, then know that its desolation is near. Then those in Judea must flee to the mountains, those inside the city must get out, and those in the countryside must not go into it. For these are the days of vengeance, when everything that is written will be fulfilled. How dreadful it will be in those days for women who are pregnant or nursing! There will be great distress in the land and wrath against this people. They will fall by the sword and be taken as prisoners to all the nations, and Jerusalem will be trampled by the Gentiles until the times of the Gentiles are fulfilled.
  - range: 25-28
    heading: Signs, and the Son of Man in a cloud
    plain: |
      “There will be signs in the sun, moon and stars, and on earth nations will be in anguish and bewilderment at the roaring of the sea and the waves. People will faint from fear and from dread of what is coming on the world, for the powers of heaven will be shaken. Then they will see the Son of Man coming in a cloud with power and great glory. When these things begin to happen, stand up and lift your heads, because your redemption is drawing near.”
  - range: 29-33
    heading: The fig tree
    plain: |
      He told them a parable: “Look at the fig tree and all the trees. When they put out their leaves, you can see for yourselves that summer is near. In the same way, when you see these things happening, you know that the kingdom of God is near. I tell you truly, this generation will not pass away until everything has happened. Heaven and earth will pass away, but my words will never pass away.
  - range: 34-36
    heading: Watch and pray
    plain: |
      “Be on guard, so that your hearts are not weighed down with the aftermath of excess, with drunkenness and the worries of this life, and that day close on you suddenly like a trap. For it will come on everyone who lives on the face of the whole earth. So stay awake at all times, praying that you may be counted worthy to escape all that is about to happen, and to stand before the Son of Man.”
  - range: 37-38
    heading: Days in the temple, nights on the mount
    plain: |
      Each day Jesus taught in the temple, and each night He went out and stayed on the hill called the Mount of Olives. And all the people came early in the morning to the temple to hear Him.

notes:
  - ref: 1
    phrase: casting their gifts into the treasury
    kind: history
    title: The treasury
    body: |
      Luke’s “treasury” stood at the northern end of the Court of the Women, the easternmost court of the inner temple. Jesus had taught there before ([[John 8:20]]), and here He sits over against it and watches the people give ([[Mark 12:41]]). In His day it held thirteen chests with trumpet-shaped openings, each marked with an inscription; the note at [[Mark 12:42]] describes them. The rich men He saw were not giving in secret, as both scripture and the rabbis urged, and as He Himself had taught ([[Matt. 6:4]]).

      The building their gifts supported was still unfinished. Herod’s rebuilding went on all through Jesus’s earthly life, and the design was not complete until A.D. 64, six years before the Romans destroyed it (verse 6). One Latter-day Saint reading sees a frame in Luke’s placing of the scene: on that reading Mary brought the infant Jesus to this same court when she offered the sacrifice the law allowed the poor ([[Luke 2:22–24]]), and His teaching in the temple ends beside a poor widow in the same place, a quiet sign of His concern for those who live in poverty.
    sources: [bd-temple-of-herod, cambridge-luke, brown-testimony-luke]
  - ref: 4
    phrase: she of her penury hath cast in all the living that she had
    kind: words
    title: All the living that she had
    body: |
      Luke’s words measure the widow’s gift by what it left her. The rich gave “of their abundance,” out of what they could spare; she gave “of her penury,” out of her lack, and what she gave was her “living,” Greek *bios*, here not her life story but that by which her life was sustained. Luke’s word for “poor” in verse 2 describes someone needy, who had to work for a scanty living, but not a beggar.

      So Jesus counts her two coins “more than they all” by what was left behind, not by how much was given: a gift is weighed by its quality, not its quantity. The note at [[Mark 12:44]] says more about that measure. The Lord gave the same measure in this dispensation: “the Lord requireth the heart and a willing mind” ([[D&C 64:34]]).
    sources: [thayer, ellicott-luke, cambridge-luke, lds-scriptures]
  - ref: 5
    phrase: adorned with goodly stones and gifts
    kind: structure
    title: The widow and the adorned temple
    body: |
      The talk of the temple turns right after a widow’s two coins, and the verse counts gifts among the temple’s adornments. The “goodly stones” were its bevelled blocks, some of them, by ancient description, forty cubits long; the building also had monolithic columns and slabs of red and white marble. The “gifts” were sacred offerings hung on the building, among them the golden vine with its great clusters that Herod gave.

      Just before the widow, Jesus had warned against the scribes who “devour widows’ houses” ([[Luke 20:47]]). The priestly rulers of the day had amassed an enormous treasure, partly out of the contributions of the poor and confiscated property, even the houses of dependent widows. One Latter-day Saint reading of the same sequence in Mark goes further: the last sin that condemned Herod’s temple under its priestly leaders was arguably the exploitation of this woman, who gave all she had to a temple whose leaders should have been supporting her, as the law and the prophets required. Luke keeps the same order, and his next verse pronounces the temple’s end.
    sources: [cambridge-luke, talmage-jesus-christ-31, huntsman-tuesday]
  - ref: 6
    phrase: there shall not be left one stone upon another
    kind: history
    title: Not one stone
    body: |
      The prophecy was fulfilled in A.D. 70, when the Romans took Jerusalem. Their battering rams failed against the temple’s massive stones; fire set to the gates finally destroyed the sanctuary. For the Jewish people it was a watershed matched only by the fall of Solomon’s temple to Babylon in 587 B.C.

      In the Lord’s own account of the sermon the prophecy answers a confidence: “ye behold this temple which is in Jerusalem, which ye call the house of God, and your enemies say that this house shall never fall” ([[D&C 45:18]]), and then, “there shall not be left one stone upon another” ([[D&C 45:20]]). Matthew’s note at [[Matt. 24:2]] gives more on the fall.
    sources: [ludlow-first-jewish-revolt, brown-testimony-luke, lds-scriptures]
  - ref: 7
    phrase: what sign will there be when these things shall come to pass?
    kind: structure
    title: A question about the temple
    body: |
      In Luke the disciples ask only about the temple: when will “these things” be, and what sign will show they are about to happen? Matthew’s version adds a second question, about “the sign of thy coming, and of the end of the world” ([[Matt. 24:3]]); in one reading, that compound question shows the disciples understood the city’s fall would come apart from and before His coming, though they assumed the two would follow closely. Luke names neither the questioners nor the Mount of Olives; Mark gives both ([[Mark 13:3]]). Modern revelation shows that they had asked about His coming too: “As ye have asked of me concerning the signs of my coming” ([[D&C 45:16]]).

      Joseph Smith’s translation names the speakers, “the disciples asked him,” and words the question “what sign wilt thou shew” (in the manuscript; the Church’s edition does not print either change). It supplies Luke’s missing second question later, after verse 24, where the sermon turns (see the note on verse 25). The note at [[JS—M 1:4]] shows how the same translation takes Matthew’s two questions one after the other.
    sources: [talmage-jesus-christ-32, ellicott-luke, lds-scriptures, jsp-nt2, jst-luke-21]
  - ref: 8
    phrase: the time draweth near
    kind: words
    title: The time draweth near
    body: |
      In the King James wording, “the time draweth near” is part of what the deceivers say: they come claiming “I am Christ” and announcing that the decisive moment has come. *Kairos* here is the time when things are brought to a crisis, the epoch long waited for, so the sense is “the season has come near,” or “the crisis has approached.” Mark’s deceivers make only the first claim ([[Mark 13:6]]). Jesus answers the second in the next verse: these things must come first, “but the end is not by and by,” that is, not immediately, a warning against the same excitement about the end that Paul later had to calm among the Thessalonians.

      Joseph Smith’s translation moves the words to the front of the verse and gives them to Jesus: “The time draweth near, and therefore take heed that ye be not deceived.” It ends verse 9, “but this is not the end” (both in the manuscript, not in the Church’s edition). As at the turn of verse 25, the translation keeps Jesus’s words about the trials the disciples would see apart from His words about the end of the world.
    sources: [thayer, ellicott-luke, cambridge-luke, jsp-nt2, jackson-sign-thy-coming]
  - ref: 14
    phrase: not to meditate before what ye shall answer
    kind: words
    title: Not to rehearse a defense
    body: |
      To “meditate before” is not to ponder but to prepare beforehand, *promeletaō* (the footnote glosses it “practice, prepare”), and to “answer” is *apologeomai*, to make one’s defense against a charge. Jesus is telling men who will stand before synagogues, prisons, kings and rulers (verse 12) neither to be anxious over the form of their defense nor to work it up skilfully in advance. Luke’s word carries less anxiety than Mark’s “take no thought” ([[Mark 13:11]]); the note there explains that phrase.

      In place of the rehearsal stands a promise in the first person: “I will give you a mouth and wisdom, which all your adversaries shall not be able to gainsay nor resist” (verse 15). The Lord gave elders of this dispensation the same promise, with the preparation it assumes: “Neither take ye thought beforehand what ye shall say; but treasure up in your minds continually the words of life, and it shall be given you in the very hour that portion that shall be meted unto every man” ([[D&C 84:85]]).
    sources: [thayer, lds-scriptures, cambridge-luke, ellicott-luke]
  - ref: 18
    phrase: there shall not an hair of your head perish
    kind: words
    title: Not a hair, though some are put to death
    body: |
      Two verses earlier Jesus says “some of you shall they cause to be put to death” (verse 16), and Luke knew it had happened: Herod Agrippa killed James the brother of John with the sword ([[Acts 12:2]]). So the promise that “not an hair of your head” will perish cannot mean bodily safety. One reading takes it this way: nothing that happens to them will be outside the Lord’s care or beyond His purposes; as He said on another occasion, “the very hairs of your head are all numbered” ([[Luke 12:7]]). This form of the promise is only in Luke’s account of the sermon.
    sources: [ellicott-luke, brown-testimony-luke]
  - ref: 19
    phrase: In your patience possess ye your souls
    kind: words
    title: Gain your souls by endurance
    body: |
      “Patience” here is the Greek *hypomonē*, steadfast endurance, the quality of someone who is not turned from loyalty to the faith even by the greatest trials and sufferings. “Possess” is *ktaomai*, to acquire or win (the footnote gives “preserve, win mastery over”): by enduring, the disciples win their souls. The verse is Luke’s form of the promise in Matthew’s and Mark’s accounts, “he that shall endure unto the end, the same shall be saved” ([[Mark 13:13]]). Some of the best manuscripts make it a promise in Luke too: “By your endurance ye shall gain” your souls.
    sources: [thayer, ellicott-luke, lds-scriptures]
  - ref: 20
    phrase: Jerusalem compassed with armies
    kind: history
    title: Compassed with armies
    body: |
      Where Matthew and Mark have “the abomination of desolation” ([[Matt. 24:15]]; [[Mark 13:14]]), Luke has a plain military sign: armies around the city. The two name one warning, and Luke’s is “a specific sign that none could misunderstand.” It came true as Jesus said. Titus besieged Jerusalem for seven months with four legions, and the Romans ringed the city with a siege wall manned at every key point. As He came near the city He had wept over the same siege: “thine enemies shall cast a trench about thee” ([[Luke 19:43–44]]).

      The precision of the verse is one reason many scholars date Luke’s Gospel after A.D. 70, taking the wording to look back on the event. Whenever Luke wrote, the prophecy need not be his own: on the view that Jesus could foresee the future in detail, He had already foretold the siege in chapter 19, and the Lord’s own account of the sermon affirms the prophecy: “desolation shall come upon this generation as a thief in the night, and this people shall be destroyed and scattered among all nations” ([[D&C 45:19]]).

      The warning that follows (verse 21) turns the usual instinct around. People threatened by an invading army fled into the walled city; Jesus told His followers to get out of it. Early Christian tradition says they did, many of them settling at Pella, east of the Jordan, and survived the war. The note at [[JS—M 1:13]] weighs that tradition.
    sources: [brown-testimony-luke, talmage-jesus-christ-32, ludlow-first-jewish-revolt, lds-scriptures]
  - ref: 22
    phrase: these be the days of vengeance, that all things which are written may be fulfilled
    kind: words
    title: The days of vengeance
    body: |
      The word for “vengeance,” *ekdikēsis*, means punishment as well as revenge, and Paul uses it of the vengeance that belongs to God ([[Rom. 12:19]]). These days answer to the “great tribulation” of Matthew’s and Mark’s accounts ([[Matt. 24:21]]), and the word may look back to Jesus’s promise that God will “avenge his own elect” ([[Luke 18:7–8]]).

      Only Luke adds “that all things which are written may be fulfilled.” What was written were the warnings of the law and the prophets against Jerusalem, among them the curses for a broken covenant ([[Deut. 28:49–57]]) and Micah’s word to the city’s corrupt rulers: “Zion for your sake be plowed as a field, and Jerusalem shall become heaps” ([[Micah 3:12]]).
    sources: [thayer, ellicott-luke, cambridge-luke, lds-scriptures]
  - ref: 24
    phrase: until the times of the Gentiles be fulfilled
    kind: scripture
    title: The times of the Gentiles
    body: |
      The times of the Gentiles carry the prophecy far past A.D. 70; the whole of verse 24 is told only by Luke. The treading down of Jerusalem may have come in two stages: when Rome took the city, and after the second Jewish revolt (A.D. 131–35), when it became a Roman city, Aelia Capitolina, closed to Jews. For centuries afterward others than Jews held power in Jerusalem, until the Six-Day War of 1967; whether that change marks the fulfilling of “the times of the Gentiles” is an open question.

      Restoration scripture says what those times are. The word “Gentiles” in the Book of Mormon and the Doctrine and Covenants often means nations without the gospel, and the times of the Gentiles are the age when the gospel goes to them first. Most Jews of Jesus’s day rejected His message, and the apostles turned to the Gentiles; Paul wrote that “blindness in part is happened to Israel, until the fulness of the Gentiles be come in” ([[Rom. 11:25]]). In the Lord’s own account of the sermon, the scattered Jews “shall be gathered again; but they shall remain until the times of the Gentiles be fulfilled” ([[D&C 45:25]]). Then He describes that age: “when the times of the Gentiles is come in, a light shall break forth among them that sit in darkness, and it shall be the fulness of my gospel” ([[D&C 45:28]]), and “in that generation shall the times of the Gentiles be fulfilled” ([[D&C 45:30]]). Moroni told Joseph Smith in 1823 that “the fulness of the Gentiles was soon to come in” ([[JS—H 1:41]]). In Restoration scripture, then, the phrase that closes Jerusalem’s fall in Luke points to the latter days: the times of the Gentiles bring the fulness of the gospel to them, and they are fulfilled in the generation the Lord describes.
    sources: [brown-testimony-luke, gs-gentiles, lds-scriptures]
  - ref: 25
    phrase: there shall be signs in the sun, and in the moon, and in the stars
    kind: structure
    title: Where the sermon turns
    body: |
      In the King James text, verse 25 follows verse 24 with no break, and a reader could take the signs in the heavens as part of Jerusalem’s fall. Joseph Smith’s translation divides the sermon here. It adds: “Now these things he spake unto them, concerning the destruction of Jerusalem. And then his disciples asked him, saying, Master, tell us concerning thy coming?” Jesus’s answer begins, “In the generation in which the times of the Gentiles shall be fulfilled, there shall be signs in the sun, and in the moon, and in the stars” (JST Luke 21:24–25), and adds that “the earth also shall be troubled, and the waters of the great deep.”

      As in Matthew, then, Joseph Smith’s revision separates Jesus’s words about the early trials of the Jews from His words about the end of the world, and here a paragraph break and added text mark the line. The signs of verses 25–26 belong to a distant generation, the one in which the times of the Gentiles are fulfilled; the Second Coming and the signs before it were not imminent. Luke’s chapter, which asks only one question, gets its second question from the translation.
    sources: [jst-luke-21, jackson-sign-thy-coming, brown-testimony-luke]
  - ref: 28
    phrase: lift up your heads; for your redemption draweth nigh
    kind: christ
    title: Your redemption draweth nigh
    body: |
      The signs that make others faint with fear (verse 26) are, for the disciples, a reason to look up. “Redemption,” *apolytrōsis*, is a word Paul uses often ([[Rom. 3:24]]; [[Rom. 8:23]]); in the New Testament it is the deliverance brought about by the death of Christ, and “the day of redemption” is the last day, when that deliverance is complete ([[Eph. 4:30]]). Joseph Smith’s translation sets the verse before verse 27 and reads “the day of your redemption draweth nigh,” so that the signs lead straight to the coming of the Son of Man in a cloud.

      The Lord’s own account says what redemption the disciples were waiting for. He began the sermon, by that account, by naming their longing: “as ye have looked upon the long absence of your spirits from your bodies to be a bondage, I will show unto you how the day of redemption shall come” ([[D&C 45:17]]). Near its end He promised that if they had “slept in peace,” “your redemption shall be perfected” ([[D&C 45:46]]). In that account the redemption they waited for includes the end of that bondage. The Lord took up Luke’s words again for the Saints of this dispensation: “Lift up your hearts and be glad, your redemption draweth nigh” ([[D&C 35:26]]).
    sources: [thayer, ellicott-luke, jsp-nt2, lds-scriptures, frederick-nt-in-dc]
  - ref: 32
    phrase: This generation shall not pass away, till all be fulfilled
    kind: words
    title: Which generation
    body: |
      On the surface “this generation” means the people of Jesus’s own time, and the verse seems to promise that everything, His coming included, would happen within their lives. For the city it did: that generation had not passed when, forty years later, Jerusalem fell. Joseph Smith’s translation answers the rest with a clause in Luke’s own words, tying the verse to the turn at verse 25: “this generation, the generation when the times of the Gentiles be fulfilled, shall not pass away till all be fulfilled” (JST Luke 21:32). In the translation, the generation that sees all fulfilled is the one in which the times of the Gentiles are fulfilled, the distant generation of verse 25. The note at [[Matt. 24:34]] gives a reading of the two fulfillments, and the note at [[JS—M 1:34]] sets the translation of Matthew’s verse beside the two generations of [[D&C 45:21]] and [[D&C 45:30]].
    sources: [cambridge-luke, jst-luke-21]
  - ref: 34
    phrase: overcharged with surfeiting, and drunkenness, and cares of this life
    kind: words
    title: Weighed down
    body: |
      “Overcharged” means weighed down. The verb, *bareō*, is used of eyes heavy with sleep ([[Luke 9:32]]); here it is used of hearts. “Surfeiting,” *kraipalē*, is the giddiness and headache that follow drinking to excess (the footnote has “debauchery”), set beside “drunkenness,” and beside both stand the “cares of this life.” The warning fits the attention Luke’s record gives to Jesus’s teaching against sensuality and worldliness.

      The day comes “as a snare” (verse 35), like the trap that catches birds and beasts unawares: unexpectedly and suddenly. Joseph Smith’s translation turns the warning toward every later follower: “Let my disciples therefore take heed to themselves, lest at any time their hearts be over charged,” and that day “come upon them unawares” (in the manuscript; the Church’s edition does not print it).
    sources: [thayer, lds-scriptures, ellicott-luke, jsp-nt2]
  - ref: 36
    phrase: Watch ye therefore, and pray always
    kind: words
    title: Watch, pray, and stand
    body: |
      “Watch” here is *agrypneō*, to be sleepless, to keep awake, and so to be attentive and ready; the clause can be rendered “watch ye at all times, making supplication.” The risen Lord gave the Nephites the same charge, that they “must watch and pray always” ([[3 Ne. 18:15]]); the note at [[Mark 13:37]] gives the reason He gave them.

      To “stand before the Son of man” is the language used of the final judgment ([[2 Cor. 5:10]]). Joseph Smith’s translation opens the verse with “And what I say unto one, I say unto all,” much as [[Mark 13:37]] ends; it adds “and keep my commandments” after “pray always”; and it names the day the disciples will stand before Him: “when he shall come clothed in the glory of his Father.”
    sources: [thayer, cambridge-luke, sc-knowhy-344, ellicott-luke, jsp-nt2, lds-scriptures]
  - ref: 37
    phrase: abode in the mount that is called the mount of Olives
    kind: history
    title: Nights on the Mount of Olives
    body: |
      Luke sums up the week: days in the temple, nights outside the city. The verb for “abode,” *aulizomai*, means to pass the night, properly in the open air, to bivouac, and it suggests that most of those nights were spent not in a house but in the garden on the mount, the place Judas later knew to find Him, “for Jesus ofttimes resorted thither with his disciples” ([[John 18:2]]); Luke says He went there “as he was wont” ([[Luke 22:39]]). Jesus also stayed that week at Bethany, a village two miles from Jerusalem on the southeast slope of the mount ([[Matt. 21:17]]).

      The summary looks back over the days since His entry into the city. On one reading of the week, His public teaching in the temple ended with these days, and He spent the time that remained out of public view, perhaps with His disciples at Bethany, until the evening of the Last Supper.
    sources: [thayer, ellicott-luke, lds-scriptures, bd-bethany, cambridge-luke]

christ: |
  Luke 21 shows Jesus Christ seeing what no one else in the temple saw, a widow’s whole gift, and foreseeing what no one else could: the fall of the temple, the long times of the Gentiles, and His own coming “in a cloud with power and great glory” (verse 27). His words “shall not pass away” (verse 33), and the redemption He promises His disciples includes the end of “the long absence of your spirits from your bodies” ([[D&C 45:17]]).

  For the long interval He sets no date but a way to live. Endurance gains the soul (verse 19); a disciple who watches and prays is not caught by that day as by a snare (verses 34–36); and in the Lord’s latter-day account of the same sermon, “my disciples shall stand in holy places, and shall not be moved” ([[D&C 45:32]]).

explore: |
  - **The fullest account of the sermon.** [[JS—M 1]], Joseph Smith’s revision of Matthew 24, with the site’s commentary.
  - **The Lord’s own retelling.** [[D&C 45:16–59]], given in March 1831.
  - **Luke’s other words on the last days.** [[Luke 12:35–48]] and [[Luke 17:20–37]], warnings on the same theme that Jesus gave on earlier occasions.
  - **The translation of the three accounts.** “What Is the Sign of Thy Coming?”, a study of how Joseph Smith revised Matthew 24, Mark 13 and Luke 21.

