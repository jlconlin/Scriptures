chapter: 10
title: Go, and Do Thou Likewise
tagline: Jesus sends seventy more disciples ahead of Him two by two, rejoices when they return, answers a lawyer with the parable of the good Samaritan, and is welcomed by Martha while Mary sits at His feet.
when: 'On the journey to Jerusalem, after Jesus “steadfastly set his face to go” there ([[Luke 9:51]]); in this site’s chronology, the Perean and Judean ministry'

setting: |
  Luke 9 turned the story toward Jerusalem. Jesus “steadfastly set his face to go to Jerusalem” ([[Luke 9:51]]) and sent messengers ahead of Him, and the first Samaritan village they came to refused them lodging. James and John wanted to call down fire on it, and Jesus rebuked them ([[Luke 9:52–56]]). Chapter 10 opens on that road. The Seventy go “before his face,” the same word Luke used for Jesus setting His face toward the city, so their mission prepares the way of the journey itself.

  Most of the chapter is told only by Luke: the sending and return of the Seventy, the parable of the good Samaritan, and the visit to Martha and Mary. The woes on the Galilean towns and the prayer of thanksgiving are in Matthew too ([[Matt. 11:20–27]]), set in another place.

  Luke’s journey is not a road map. Martha and Mary lived in Bethany, near Jerusalem ([[John 11:1]]), yet seven chapters later Jesus is again passing between Samaria and Galilee ([[Luke 17:11]]). Either He went back and forth on the way, or Luke set some scenes out of their order. The parable and the visit to the sisters are out of place on the map, but they belong together, as the thread explains.

thread: |
  **Luke 10 turns the world upside down, and then shows what the two great commandments look like on the ground.**

  The first half is about real power in unlikely hands. Jesus sends out seventy ordinary men “as lambs among wolves,” and they come back saying the devils obeyed them; Jesus sees Satan fall. Yet He tells them not to rejoice in that power but in names written in heaven, and He thanks the Father for showing these things to “babes” rather than to the wise.

  The second half turns on a lawyer’s question. He knows the answer already: love God with all your heart, and your neighbor as yourself (verse 27). Luke then gives one story for each half of that answer. In the parable, the priest and the Levite, men with standing by birth, pass by, and a despised Samaritan shows what it is to love a neighbor. In Martha’s house, Mary sits at the Lord’s feet and shows what it is to love the Lord.

sections:
  - range: 1-16
    heading: The Seventy sent
    plain: |
      After this the Lord appointed seventy others and sent them ahead of Him in pairs into every town and place He was about to visit. He told them, “The harvest is great, but the workers are few. So ask the Lord of the harvest to send out workers into His harvest. Go. I am sending you out like lambs among wolves. Take no money bag, no traveler’s pack, no sandals, and don’t stop to greet anyone on the road.

      “Whatever house you enter, first say, ‘Peace be on this house.’ If someone there is a son of peace, your peace will rest on him; if not, it will come back to you. Stay in that same house, eating and drinking what they give you, for the worker deserves his wages. Don’t move from house to house. Whenever you enter a town and they welcome you, eat what is set before you. Heal the sick there and tell them, ‘The kingdom of God has come near to you.’

      “But whenever you enter a town and they do not welcome you, go out into its streets and say, ‘Even the dust of your town that clings to us we wipe off against you. But know this: the kingdom of God has come near.’ I tell you, it will be more bearable on that day for Sodom than for that town.

      “Woe to you, Chorazin! Woe to you, Bethsaida! If the miracles done in you had been done in Tyre and Sidon, they would have repented long ago, sitting in sackcloth and ashes. It will be more bearable for Tyre and Sidon at the judgment than for you. And you, Capernaum, lifted up to heaven, you will be brought down to hell. Whoever listens to you listens to me; whoever rejects you rejects me; and whoever rejects me rejects the One who sent me.”
  - range: 17-24
    heading: The Seventy return
    plain: |
      The seventy came back full of joy and said, “Lord, even the devils obey us in your name.” He answered, “I watched Satan fall from heaven like lightning. I have given you power to tread on snakes and scorpions and over all the power of the enemy, and nothing will harm you. Still, don’t rejoice that the spirits obey you; rejoice that your names are written in heaven.”

      In that hour Jesus rejoiced in the Spirit and said, “I thank you, Father, Lord of heaven and earth, that you have hidden these things from those who think themselves wise and learned and have shown them to little children. Yes, Father, for this pleased you. My Father has handed all things over to me. No one knows who the Son is except the Father, or who the Father is except the Son and anyone to whom the Son chooses to reveal Him.”

      Then He turned to His disciples and said privately, “Blessed are the eyes that see what you see. I tell you, many prophets and kings wanted to see what you see and did not see it, and to hear what you hear and did not hear it.”
  - range: 25-37
    heading: The good Samaritan
    plain: |
      Then an expert in the law stood up to test Him. “Teacher,” he said, “what must I do to inherit eternal life?” Jesus said, “What is written in the law? How do you read it?” He answered, “Love the Lord your God with all your heart, with all your soul, with all your strength and with all your mind; and love your neighbor as yourself.” “You have answered rightly,” Jesus said. “Do this and you will live.”

      But wanting to justify himself, the man asked, “And who is my neighbor?” Jesus took up the question: “A man was going down from Jerusalem to Jericho, and he fell into the hands of bandits. They stripped him, beat him and went off, leaving him half dead. A priest happened to be going down that road, and when he saw the man he passed by on the other side. So did a Levite: he came to the place, looked at him, and passed by on the other side. But a Samaritan on a journey came where the man was, and when he saw him he was moved with compassion. He went to him, poured oil and wine on his wounds and bandaged them, put him on his own animal, brought him to an inn and took care of him. The next day he took out two denarii and gave them to the innkeeper. ‘Look after him,’ he said, ‘and whatever more you spend, I will repay you when I come back.’

      “Which of these three, do you think, was a neighbor to the man who fell into the bandits’ hands?” The lawyer said, “The one who showed him mercy.” Jesus told him, “Go and do the same.”
  - range: 38-42
    heading: Martha and Mary
    plain: |
      As they went on their way, Jesus came to a village, and a woman named Martha welcomed Him into her house. She had a sister named Mary, who sat at the Lord’s feet listening to what He said. But Martha was distracted by all the work of serving. She came to Him and said, “Lord, don’t you care that my sister has left me to do the serving by myself? Tell her to help me.” The Lord answered her, “Martha, Martha, you are worried and upset about many things. But only one thing is needed. Mary has chosen the good part, and it will not be taken away from her.”

notes:
  - ref: 1
    phrase: other seventy also
    kind: history
    title: The other seventy
    body: |
      The Seventy are a second group of missionaries, sent after the Twelve ([[Luke 9:1–6]]) and given the same charge: to heal, to preach the kingdom, and, as their report in verse 17 shows, to cast out devils. Only Luke tells of them. The number has a long history in Israel. Seventy elders went up the mountain with Moses and saw the God of Israel at the covenant meal ([[Ex. 24:9–11]]), and seventy received the Spirit to share Moses’ burden ([[Num. 11:16]]). Seventy is also the count of the nations in the table of [[Gen. 10]], which points the mission outward, toward the Gentiles.

      A reader of a modern translation may find “seventy-two.” Some early manuscripts read that number, and the SBL edition of the Greek prints it. But the earliest manuscript of the verse, P75, reads seventy, as the King James does. Both numbers go back to the table of nations: the Hebrew text of Genesis 10 has seventy names and the Septuagint, the Greek translation, has seventy-two. The number seventy is judged original.

      In the latter days the Lord has again called Seventy, “to be especial witnesses unto the Gentiles and in all the world” ([[D&C 107:25]]), acting “under the direction of the Twelve” ([[D&C 107:34]]).
    sources: [brown-testimony-luke, greek-nt, lds-scriptures]
  - ref: 4
    phrase: salute no man by the way
    kind: words
    title: Salute no man by the way
    body: |
      Jesus is not telling His disciples to be rude. The command seems to be about urgency, and it has a precedent. When the Shunammite’s son lay dead, Elisha sent his servant Gehazi running with his staff: “if thou meet any man, salute him not; and if any salute thee, answer him not again” ([[2 Kgs. 4:29]]). The Seventy are on the same kind of errand. They are to be about the work of the kingdom, not stop to make or renew acquaintances along the way.

      The rest of the verse says the same thing about their baggage. No purse, no traveler’s bag, no spare sandals: they are to go as they are and trust the hospitality of the houses that receive them.
    sources: [brown-testimony-luke, lds-scriptures]
  - ref: 6
    phrase: the son of peace
    kind: words
    title: A son of peace
    body: |
      “Peace be to this house” sounds like an ordinary greeting, *shalom*, but from the Savior’s messengers it is more than a wish for someone’s well-being. It carries heavenly peace, and verse 6 treats it almost as a thing that can be handed over: it rests on the house, or it comes back to the one who gave it. The peace the Seventy carry can be bestowed and withdrawn.

      “A son of peace” is like Luke’s “children of light” ([[Luke 16:8]]) and “children of the resurrection” ([[Luke 20:36]]): a person who belongs to peace and is fit to receive it, and probably a standing God confers rather than a quality the host already has. Either way, the greeting itself sorts the houses. The words the disciples are told to say first reveal whether a son of peace is there, and so whether their peace stays.
    sources: [brown-testimony-luke]
  - ref: 7
    phrase: eating and drinking such things as they give
    kind: history
    title: Eat such things as they give
    body: |
      Jesus says twice that the Seventy should eat whatever their hosts set before them (verses 7 and 8), and He tells them to stay in the first house that receives them. The second instruction is plain: they are not to shop around for better lodging and so offend their first hosts. The Joseph Smith Translation says the same in other words: “in whatsoever house they receive you, remain” (JST Luke 10:7).

      The first instruction may mean more than good manners. One Latter-day Saint reading sees in the repetition Jesus setting aside the Jewish food laws for these missionaries, so that they can accept the hospitality of gentile hosts. The reading ties the Seventy’s mission to the Gentiles, as their latter-day calling does ([[D&C 107:25]]), though Luke does not say where they went. It is a reading, not a statement of the text.
    sources: [brown-testimony-luke]
  - ref: 11
    phrase: Even the very dust of your city, which cleaveth on us, we do wipe off against you
    kind: symbol
    title: The very dust of your city
    body: |
      Wiping off a town’s dust treats the dust as if it could stain. Some Jews regarded gentile ground as unclean, which gives the gesture its force. Jesus gives the Seventy the exact words to say and tells them to say them in the streets, so that the town sees it. The second half of the saying is their testimony, and it does not change with the welcome: “the kingdom of God is come nigh unto you,” whether the town receives it or not (verses 9 and 11).

      The same act was commanded in this dispensation, but differently. The early elders were to shake off the dust “not in their presence, lest thou provoke them, but in secret,” as “a testimony against them in the day of judgment” ([[D&C 60:15]]).
    sources: [brown-testimony-luke, lds-scriptures]
  - ref: 13
    phrase: Woe unto thee, Chorazin! woe unto thee, Bethsaida!
    kind: history
    title: Chorazin, Bethsaida and Capernaum
    body: |
      These are towns at the north end of the Sea of Galilee, and Capernaum was the town Jesus had made His home after His ministry began. Chorazin is a puzzle: it saw some of His mighty works, and not one of them is recorded. The Bethsaida He rebukes is probably not the fishermen’s village of Peter, Andrew and Philip but the new city Philip the Tetrarch built nearby as his capital, a largely pagan town.

      The woes turn on the word “tolerable.” Tyre and Sidon were the cities on which Isaiah pronounced God’s judgment ([[Isa. 23]]), and Sodom the symbol of a community that turned from God ([[Gen. 19:24–25]]). They never saw the mighty works that Chorazin and Bethsaida saw and did not repent of, and Jesus says their judgment will be lighter; the Joseph Smith Translation makes the time explicit in verse 12, “in the day of judgment.” Modern revelation uses the same word of those who never had the law: “it shall be tolerable for them” ([[D&C 45:54]]). Matthew sets these woes after Jesus’s tribute to John the Baptist ([[Matt. 11:20–24]]); Luke sets them in the charge to the Seventy, right after the words on a town that will not receive them (verses 10–12).
    sources: [bd-capernaum, bd-chorazin, bd-bethsaida, brown-testimony-luke, lds-scriptures]
  - ref: 18
    phrase: I beheld Satan as lightning fall from heaven
    kind: scripture
    title: Satan as lightning
    body: |
      Jesus answers the Seventy’s report with something He saw, and Latter-day Saint readers have taken it in two ways. Elder James E. Talmage read it as said of the premortal fall: the expulsion of “the rebellious son of the morning, after his defeat by Michael and the heavenly hosts.” That is the fall Joseph Smith and Sidney Rigdon saw in vision, when Lucifer, “a son of the morning,” who rebelled against the Son, “was thrust down from the presence of God and the Son” ([[D&C 76:25–27]]).

      Another reading takes the verb as describing what Jesus was watching while they worked: “I began to see Satan fall.” On that reading the Seventy’s mission shook Satan’s kingdom and toppled him, though not for good. Elder Talmage read the promise that follows, to tread on serpents and scorpions, as protection from harm in the path of duty and power over the evil spirits that serve the devil.
    sources: [lds-scriptures, talmage-jesus-christ-26, brown-testimony-luke]
  - ref: 20
    phrase: rejoice, because your names are written in heaven
    kind: symbol
    title: Names written in heaven
    body: |
      The Seventy came back rejoicing in power, and Jesus redirects their joy. The power was real; He has just confirmed it. But it was His, given for a mission. What He points them to instead is a place in heaven’s record. John saw the dead judged out of the books, among them “the book of life” ([[Rev. 20:12]]), and modern revelation speaks of a heavenly record of the faithful, whose names are written there with an account of their righteous deeds ([[D&C 128:7]]).
    sources: [bd-book-of-life, brown-testimony-luke]
  - ref: 21
    phrase: hid these things from the wise and prudent, and hast revealed them unto babes
    kind: words
    title: From them who think they are wise
    body: |
      Jesus is not thanking the Father for keeping the learned in ignorance. The Joseph Smith Translation makes the distinction plain: “from them who think they are wise and prudent” (JST Luke 10:22, in the footnote). What shuts a person out is not learning but the confidence that one already knows.

      The “babes” are the disciples in front of Him. Verses 23 and 24 say what was revealed to them: they see what prophets and kings longed to see. Knowing who Jesus is comes by revelation from the Father, not by a chance meeting or close observation, and these followers have walked with Him for months, loyal through a long time. The two together, the Father’s gift and their faithfulness, are what open their eyes.
    sources: [lds-scriptures, brown-testimony-luke]
  - ref: 22
    phrase: no man knoweth who the Son is, but the Father
    kind: christ
    title: The Son is the Father
    body: |
      The Joseph Smith Translation changes this verse boldly: “no man knoweth that the Son is the Father, and the Father is the Son,” and none knows it “but him to whom the Son will reveal it” (JST Luke 10:23). It does not make the Son and the Father one person. The first words of the verse stand unchanged, “All things are delivered to me of my Father,” and they set the terms: the Son has received everything from Another.

      The sense is probably divine investiture of authority. In all His dealings with the human family the Son represents the Father in power and authority: “the Father placed His name upon the Son,” and as far as “power, authority, and godship are concerned His words and acts were and are those of the Father.” None of this changes “the literal relationship of Father and Son.” That relationship has depths no follower can plumb on his own, and the verse ends by saying who opens them: the Son reveals it to whom He will.
    sources: [lds-scriptures, brown-testimony-luke, father-and-son-1916]
  - ref: 25
    phrase: a certain lawyer stood up, and tempted him
    kind: history
    title: A certain lawyer
    body: |
      A “lawyer” in the Gospels is not an advocate in court but a scribe, a student and teacher of the law of Moses (see the note on [[Luke 7:30]]). “Tempted” here means “tested”: the word can carry hostile intent, but this man seems at first only to be finding out whether a well-known teacher gives the right answer to an important question. He calls Jesus “Master,” which here means teacher, and he stands up to ask, perhaps a mark of respect, given grudgingly or not.

      His question is a lawyer’s too. To “inherit” is to receive what belongs to an heir, as land passes from parent to child, so “inherit eternal life” asks how one becomes heir to God’s own life. The tone changes in verse 29. Luke says the man was “willing to justify himself,” a condemning note: he seems to want to come out of the exchange upright in his own eyes.
    sources: [bd-lawyer, brown-testimony-luke]
  - ref: 27
    phrase: and thy neighbour as thyself
    kind: scripture
    title: Thy neighbour as thyself
    body: |
      The lawyer answers his own question with two commandments from different books: love of God from [[Deut. 6:5]] and love of neighbor from [[Lev. 19:18]]. Jesus accepts the answer at once. The trouble is the word “neighbour.” In Leviticus it stands beside “the children of thy people” ([[Lev. 19:18]]), and the lawyer most likely understood his neighbor as a fellow Jew, not a foreigner, and certainly not a Samaritan.

      In Matthew and Mark, Jesus Himself joins these two commandments, in Jerusalem, in answer to a different question ([[Matt. 22:34–40]]; [[Mark 12:28–34]]). The settings differ enough that they are best read as two occasions; Jesus taught the same truth more than once. Here the lawyer gives the answer and Jesus tells a story to show what it means. One Latter-day Saint reading holds that the parable answers both of the lawyer’s questions: not only “who is my neighbour?” but the first and larger one, what to do to inherit eternal life, because the story speaks of the plan of salvation (that reading is in the note on verse 33).
    sources: [brown-testimony-luke, welch-good-samaritan]
  - ref: 30
    phrase: went down from Jerusalem to Jericho, and fell among thieves
    kind: history
    title: The road down to Jericho
    body: |
      The road from Jerusalem to Jericho runs downhill: the Roman road ran down through the Wadi Qelt to New Testament Jericho. Much of Jesus’s audience had likely walked it on visits to the capital, and its dangers were well known to all. The “thieves” are not pickpockets; the word means violent robbers, bandits. A man traveling that road alone, against the custom of traveling in company, was taking a known risk.
    sources: [brown-testimony-luke, welch-good-samaritan]
  - ref: 31
    phrase: passed by on the other side
    kind: history
    title: Passed by on the other side
    body: |
      The parable gives no reason why the priest and the Levite do not help, and readers have offered several. The priest is going down from Jerusalem, likely home to Jericho after his week of service at the temple. He might have been in a hurry or afraid the bandits were still near. Prominent among the possible motives is ritual purity: the law forbade a priest to make himself unclean by touching a dead body, except for close family ([[Lev. 21:1–4]]), and a stripped, badly wounded man might have the look of death. The Levite comes nearer and looks, but he too goes on.

      The Joseph Smith Translation leaves no room for a respectable excuse. It adds that they “desired in their hearts that it might not be known that they had seen him” (JST Luke 10:33). Whatever rule they might have cited, the motive Jesus names is wanting not to be seen to have seen.
    sources: [brown-testimony-luke, welch-good-samaritan]
  - ref: 33
    phrase: a certain Samaritan
    kind: history
    title: A certain Samaritan
    body: |
      The Samaritans descended both from foreign colonists whom the kings of Assyria and Babylonia settled in the land and from Israelites who escaped the captivity, so that they were partly Israelite and partly gentile. When they were refused a share in rebuilding the temple, they became bitter opponents of the Jews and built a rival temple on Mount Gerizim. The antagonism was still sharp in Jesus’s day ([[John 4:9]]).

      That antagonism had just touched Jesus’s own company. A Samaritan village had refused them lodging, and two of His closest disciples had wanted to burn it ([[Luke 9:52–54]]). Now Jesus makes a Samaritan the hero of the story, and the lawyer, asked who was the neighbor, answers “He that shewed mercy on him,” as if he cannot bring himself to say the word “Samaritan.” John, at least, came to see Samaritans otherwise. He later preached in many Samaritan villages and gave the Holy Ghost to those baptized there ([[Acts 8:14–17, 25]]).
    sources: [bd-samaritans, olson-final-trek, brown-testimony-luke]
  - ref: 33
    phrase: he had compassion on him
    kind: christ
    title: The Samaritan as Christ
    body: |
      The earliest Christian readers saw Jesus Himself in the Samaritan. Irenaeus and Clement of Alexandria, in the second century, read him as Christ saving fallen humanity from the wounds of sin, and Origen said that reading came to him from “one of the elders.” Writers across the Christian world kept it for centuries. Chrysostom gave one reason the figure fits: as a Samaritan is not from Judea, so Christ is not of this world. The word for “had compassion” supports it. It means literally to be moved in one’s inward parts, and outside Jesus’s parables the New Testament uses it only of God’s or Christ’s mercy. Luke uses it of Jesus’s compassion for the widow of Nain ([[Luke 7:13]]), and, in another parable, of the father’s for the prodigal ([[Luke 15:20]]).

      Latter-day Saint scholars have taken the old reading further and read the parable as a type of the plan of salvation. The man goes down from Jerusalem, the holy city, to Jericho, the lowest city on earth, as Adam and Eve came down into mortality. Left “half dead,” he has suffered the first death but not the second. The Samaritan’s oil and wine were sound first aid, oil to soften a wound and wine to cleanse it, and the earliest interpreters also saw in the wine the blood of Christ. The inn is the Church, where the rescued are cared for until the rescuer returns. Some scholars reject reading the parable this way. Its Latter-day Saint advocates hold that it adds to the plain lesson of mercy without replacing it, and that the plain lesson stays the point: “Go, and do thou likewise.”
    sources: [welch-good-samaritan, sc-knowhy-667, brown-testimony-luke]
  - ref: 35
    phrase: whatsoever thou spendest more, when I come again, I will repay thee
    kind: symbol
    title: When I come again
    body: |
      The “two pence” are two denarii. One denarius was a laborer’s usual pay for a day, and would buy about twelve days’ care at an inn. The Samaritan leaves more besides: his word that he will cover whatever more is spent. The innkeeper takes it, which suggests the Samaritan was a regular on that road and known to keep his promises.

      The promise carries the allegory forward. The verb for “come again,” *epanerchomai*, appears in the New Testament only here and in [[Luke 19:15]], where the nobleman returns, having received the kingdom, to reckon with his servants. “Repay” is the verb Jesus uses elsewhere for God rewarding the righteous ([[Matt. 6:4]]; [[Matt. 16:27]]). Read this way, the innkeeper is the Lord’s servant left in charge of the wounded, and his labor will be rewarded when the Lord returns.
    sources: [brown-testimony-luke, sc-knowhy-667, thayer, welch-good-samaritan]
  - ref: 36
    phrase: Which now of these three, thinkest thou, was neighbour unto him
    kind: words
    title: Which was neighbour?
    body: |
      Jesus does not answer the lawyer’s question; He turns it around. The lawyer asked, “Who is my neighbour?”, a question about whom the law obliges him to love and, by implication, whom it does not. Jesus asks which of the three *was* a neighbor to the wounded man. Neighbor is no longer a category of people around me; it is what I become by showing mercy. The one I owe that mercy to may be anyone in need, and the one who showed it in the story was the man the lawyer’s own definition left out: a Samaritan who chose to love a Jew, perhaps the hardest person for him to love.
    sources: [brown-testimony-luke, olson-final-trek]
  - ref: 38
    phrase: a certain woman named Martha received him into her house
    kind: history
    title: Martha’s house
    body: |
      Luke does not name the village, but John does: Martha and her sister Mary lived in Bethany, near Jerusalem, with their brother Lazarus ([[John 11:1]]). This Mary is not Mary Magdalene. The Joseph Smith Translation reads “they entered,” keeping the disciples in the scene, and it confirms that the house was Martha’s own, which was not unusual for a woman in Palestine.

      After a Samaritan village closed its doors (9:53), here is a welcome. Being a good hostess was no small thing: in Jewish society a woman’s standing rested in part on how well she received her guests. That is the weight Martha is carrying when she comes to Jesus in verse 40.
    sources: [brown-testimony-luke, olson-final-trek]
  - ref: 39
    phrase: sat at Jesus’ feet, and heard his word
    kind: history
    title: At Jesus’ feet
    body: |
      To sit at someone’s feet was the posture of a pupil. Paul uses the same words of his training: he was brought up “at the feet of Gamaliel” ([[Acts 22:3]]). So Mary is not simply resting while her sister works; she has taken the place of a disciple, a place her society did not ordinarily give to women. That she can do it at all owes something to the setting. In a woman’s own house the usual nervousness about women and men together relaxed. Jesus does more than allow it: He defends her choice, and so encourages her learning against the norms of His day.
    sources: [brown-testimony-luke]
  - ref: 42
    phrase: one thing is needful
    kind: prophets
    title: One thing is needful
    body: |
      Martha is not wrong to serve; her meal is her gift to Him, an expression of her affection and loyalty. But the words Luke uses show what has gone wrong. She was “cumbered,” in Greek *kept being distracted*, pulled back again and again from the conversation to the work. Jesus says she is “careful and troubled,” and “careful” does not mean cautious: it means worried, divided and distracted in mind. Her name repeated, “Martha, Martha,” is gentle, not a rebuke barked at her for her complaint.

      What Mary has chosen is the one thing that will not be taken from her: time with the Lord, learning from Him. Elder Dallin H. Oaks used this scene to teach that the good things we can do far exceed the time we have, and some things are better than good. Jesus commended Martha, he said, but “learning the gospel from the Master Teacher was more ‘needful.’” Martha seems to have taken the words to heart. When Jesus came to Bethany after Lazarus died, it was Martha who went out on the road to meet Him, and to her He said, “I am the resurrection, and the life” ([[John 11:20–25]]).
    sources: [brown-testimony-luke, lds-scriptures, oaks-good-better-best]

christ: |
  The chapter shows Jesus Christ as the One whose name holds power over Satan, who alone reveals the Father, and, in the oldest Christian reading of His best-known parable, as the despised Samaritan who comes down the road where others pass by, binds the wounds of the fallen, and promises to come again. On the road to Jerusalem He did what the Samaritan did, stopping for each wounded person He met even as He walked toward His own death.

  The lawyer’s two commandments reach a disciple’s life in the same two stories. Love of neighbor is measured by mercy shown to whoever lies by the road, “Go, and do thou likewise” ([[Luke 10:37]]). Love of God begins where Mary sat: learning at the Savior’s feet is the one thing needful, and it comes before the good things that crowd it out.

explore: |
  - **The fullest Latter-day Saint reading of the parable.** John W. Welch, “The Good Samaritan: A Type and Shadow of the Plan of Salvation,” *BYU Studies* 38, no. 2, reads each detail with the early Christian writers and the Restoration.
  - **The same woes and prayer in Matthew.** [[Matt. 11:20–27]], set after Jesus’s tribute to John the Baptist.
  - **The Seventy in the latter days.** [[D&C 107:25–26, 34, 93–97]].
  - **Martha and Mary again.** [[John 11:1–44]] and [[John 12:1–3]].
  - **Divine investiture.** “The Father and the Son: A Doctrinal Exposition” (1916), on why the Son can be called Father.

