chapter: 7
title: Who Is This That Forgiveth Sins Also?
tagline: Jesus heals a centurion’s servant with a word, raises a widow’s only son at Nain, answers John the Baptist’s question from prison and bears witness of him, and forgives a woman who washes His feet in the house of Simon the Pharisee.
when: 'During Jesus’s ministry in Galilee, after the sermon on the plain ([[Luke 6:20–49]]); the order this site follows'

setting: |
  Luke 7 follows straight on from the sermon on the plain. Its first words close that sermon much as Matthew’s close the Sermon on the Mount ([[Matt. 7:28]]), though the Greek of the two sentences is quite different. Jesus comes back into Capernaum, and the chapter tells four stories. Matthew tells two of them: the centurion’s servant ([[Matt. 8:5–13]]) and John the Baptist’s question from prison, with Jesus’s witness of him ([[Matt. 11:2–19]]). The other two are Luke’s alone: the widow’s son raised at Nain, and the woman who washed Jesus’s feet in the house of Simon the Pharisee.

  John has been in prison since [[Luke 3:19–20]], shut up by Herod for rebuking him. His disciples still come to him, and what they tell him of Jesus prompts his question (verses 18–19).

  Raisings frame this chapter and the next: a servant brought back from the edge of death and a young man raised from his bier here, the daughter of Jairus in chapter 8 ([[Luke 8:41–56]]). The chapter also carries forward the opposition that has been gathering since Nazareth ([[Luke 4:28–29]]; [[Luke 5:21]]; [[Luke 6:11]]): the Pharisees and lawyers who refused John’s baptism, and a Pharisee host who doubts that his guest is a prophet at all.

thread: |
  **Luke 7 shows the powers Jesus announced at Nazareth at work, and asks who He is.** In the synagogue there He read that He was sent to heal and to set at liberty ([[Luke 4:18]]). Here He heals a servant ready to die, raises a widow’s only son, and forgives a woman whose sins are many: deliverance from sickness, from death and from sin, given freely. The one man He does not deliver is John, in Herod’s prison. To him Jesus sends word of His works instead of rescue, and His leaving John there, though He had the power to free him, can be read as showing that He had not come as a conquering, military Messiah.

  Around the works runs the question of who He is. The crowd at Nain calls Him “a great prophet” (verse 16), and the crowds in Luke keep to that title. John asks whether He is “he that should come” (verse 19). Simon decides He cannot be a prophet at all (verse 39), and Simon’s guests ask the chapter’s question outright: “Who is this that forgiveth sins also?” (verse 49). The faith the chapter praises belongs to a Gentile whose faith Jesus had not found in Israel (verse 9), to publicans baptized by John (verse 29), and to a woman known in the city as a sinner, whose faith saved her (verse 50).

sections:
  - range: 1-10
    heading: The centurion’s servant
    plain: |
      When Jesus had finished all He had to say to the people, He went into Capernaum. A centurion there had a servant he valued highly, who was sick and near death. Hearing about Jesus, the centurion sent some elders of the Jews to ask Him to come and heal his servant. They came to Jesus and pleaded with Him earnestly: “He deserves to have you do this for him, for he loves our nation, and he built our synagogue for us.”

      So Jesus went with them. He was not far from the house when the centurion sent friends to tell Him, “Lord, do not trouble yourself, for I am not worthy to have you come under my roof. That is why I did not think myself worthy to come to you either. Just say the word, and my servant will be healed. For I too am a man placed under authority, with soldiers under me. I say to one, ‘Go,’ and he goes; to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.”

      When Jesus heard this He admired him, and turning to the crowd that followed Him He said, “I tell you, not even in Israel have I found such great faith.” And when the messengers went back to the house, they found the servant well.
  - range: 11-17
    heading: The widow’s son at Nain
    plain: |
      The next day Jesus went to a town called Nain, and many of His disciples and a large crowd went with Him. As He came near the town gate, a dead man was being carried out, the only son of his mother, and she was a widow; a large crowd from the town was with her. When the Lord saw her, His heart went out to her, and He said, “Do not weep.” Then He went up and took hold of the bier, and the men carrying it stood still. He said, “Young man, I say to you, get up.” The dead man sat up and began to speak, and Jesus gave him back to his mother.

      Fear came over them all, and they praised God, saying, “A great prophet has appeared among us,” and “God has come to his people.” This report about Him spread through all Judea and all the surrounding country.
  - range: 18-35
    heading: John the Baptist’s question, and Jesus’s witness of him
    plain: |
      John’s disciples told him about all these things. So John called two of his disciples and sent them to Jesus to ask, “Are you the one who is to come, or should we look for someone else?” When the men reached Jesus they said, “John the Baptist has sent us to you to ask, ‘Are you the one who is to come, or should we look for someone else?’” In that very hour Jesus healed many people of their diseases and afflictions and of evil spirits, and to many who were blind He gave sight. Then He answered them, “Go and tell John what you have seen and heard: the blind see, the lame walk, lepers are made clean, the deaf hear, the dead are raised, and the poor have the gospel preached to them. And blessed is anyone who does not stumble because of me.”

      When John’s messengers had gone, Jesus began to speak to the crowds about John. “What did you go out into the wilderness to see? A reed swaying in the wind? What then did you go out to see? A man dressed in fine clothes? Those who dress in splendor and live in luxury are in kings’ palaces. What then did you go out to see? A prophet? Yes, I tell you, and much more than a prophet. This is the one of whom it is written, ‘I send my messenger ahead of you, who will prepare your way before you.’ I tell you, among those born of women there is no greater prophet than John the Baptist; yet the one who is least in the kingdom of God is greater than he.”

      All the people who heard Him, even the tax collectors, acknowledged that God was right, for they had been baptized with John’s baptism. But the Pharisees and the lawyers rejected God’s purpose for themselves, for they had not been baptized by him.

      “To what then shall I compare the people of this generation? What are they like? They are like children sitting in the marketplace and calling to one another, ‘We played the flute for you, and you did not dance; we sang a lament, and you did not weep.’ For John the Baptist came neither eating bread nor drinking wine, and you say, ‘He has a devil.’ The Son of Man has come eating and drinking, and you say, ‘Look, a glutton and a drunkard, a friend of tax collectors and sinners!’ But wisdom is proved right by all her children.”
  - range: 36-50
    heading: A woman anoints Jesus in the house of Simon the Pharisee
    plain: |
      One of the Pharisees invited Jesus to eat with him, and He went into the Pharisee’s house and took His place at the table. A woman of the town, known as a sinner, learned that Jesus was dining at the Pharisee’s house, and she came with an alabaster flask of perfumed oil. She stood behind Him at His feet, weeping, and began to wet His feet with her tears and wipe them with her hair; she kissed His feet and anointed them with the oil. When the Pharisee who had invited Him saw this, he said to himself, “If this man were a prophet, he would know who and what sort of woman this is who is touching him, for she is a sinner.”

      Jesus answered him, “Simon, I have something to say to you.” “Say it, Teacher,” he replied. “A moneylender had two debtors. One owed him five hundred denarii (a denarius was a laborer’s wage for a day), the other fifty. When neither of them could pay, he freely forgave them both. Now which of them will love him more?” Simon answered, “I suppose the one who was forgiven more.” “You have judged rightly,” Jesus said.

      Then, turning toward the woman, He said to Simon, “Do you see this woman? I came into your house; you gave me no water for my feet, but she has washed my feet with her tears and wiped them with her hair. You gave me no kiss, but from the time I came in she has not stopped kissing my feet. You did not anoint my head with oil, but she has anointed my feet with perfume. Therefore I tell you, her sins, which are many, are forgiven, for she loved much; but the one who is forgiven little loves little.” Then He said to her, “Your sins are forgiven.” Those at the table with Him began to say among themselves, “Who is this, who even forgives sins?” And He said to the woman, “Your faith has saved you; go in peace.”

notes:
  - ref: 2
    phrase: a certain centurion’s servant
    kind: history
    title: A centurion in Capernaum
    body: |
      A centurion was an officer over about a hundred soldiers, a “century,” and this one was a Gentile, as Jesus’s words in verse 9 show. Whose soldiers he commanded is less clear than the title suggests. He is often taken for an officer of Rome’s own forces. But Galilee in Jesus’s day belonged to Herod Antipas ([[Luke 3:1]]), and Roman units had no permanent presence there until after the Jewish revolts, so the centurion at Capernaum was more likely an officer in Herod’s forces who bore a title taken over from the Roman army.

      His servant was a slave (Greek *doulos*). The law of Moses set a time for a Hebrew slave to go free ([[Deut. 15:12–18]]), but no such law bound a Gentile master, and this one’s concern for a slave “dear unto him” and “ready to die” marks him as a humane man before the elders say a word in his favor.
    sources: [brown-testimony-luke, grey-peter-capernaum]
  - ref: 5
    phrase: he hath built us a synagogue
    kind: history
    title: He hath built us a synagogue
    body: |
      A Gentile paying for a synagogue is not as strange as it sounds: Gentile donors to synagogues are known in the towns of Asia Minor, and the centurion may have been a chief contributor rather than the builder of the whole. Some have suggested he was a “god-fearer,” a Gentile who worshipped Israel’s God, or even a convert, though that cannot be shown.

      Visitors to Capernaum today are shown the ruins of a great limestone synagogue, but it was built centuries later, around the fourth or fifth century. Whether it stands over a first-century synagogue of basalt, the one the centurion gave, is disputed: some take Luke’s reference to point to that earlier building, while others find a strong case against it, and nothing found in the ground shows a building given by a Gentile benefactor. Nor has any trace of Gentiles living in the village turned up. Matthew’s telling suggests tension between the centurion and his Jewish neighbors; Luke’s, through the elders’ praise, a mutual affection.
    sources: [brown-testimony-luke, grey-peter-capernaum]
  - ref: 6
    phrase: I am not worthy that thou shouldest enter under my roof
    kind: history
    title: Worthy, and not worthy
    body: |
      The elders tell Jesus the centurion is “worthy” (verse 4); the centurion sends word that he is “not worthy” (verse 6). The difference between how others saw him and how he saw himself shows the kind of man he was. He sent Jewish elders in the first place, it seems, because he judged that Jesus would listen more readily to His own people than to a Gentile, and the elders went out of respect for him. When Jesus set out for the house, he sent a second group, probably Gentile friends of his own, to stop Him. A Jew who entered a Gentile’s house, or even set foot on his property, would be made ritually unclean. The centurion was plainly aware of the difficulty and urged Jesus not to come in; Jesus, for His part, had already started toward the house.

      Matthew tells the story as though the centurion came in person ([[Matt. 8:5–8]]). There is no real contradiction: then as now, a man who has something done through others can be said to do it himself. By giving the centurion’s own words through his messengers, Luke lets his Gentile readers hear a Gentile’s hesitation in approaching the Savior.
    sources: [brown-testimony-luke, talmage-jesus-christ-18]
  - ref: 9
    phrase: I have not found so great faith, no, not in Israel
    kind: words
    title: So great faith
    body: |
      Jesus praises a faith that asked only for a word: “say in a word, and my servant shall be healed” (verse 7). The centurion was under the orders of officers above him and gave orders to soldiers below him, and he did not have to stand over them to see an order carried out; One with the power Jesus had could surely command and be obeyed from anywhere. The note on [[Matt. 8:9]] takes up that reasoning, and how Jesus could marvel at anything: when the man’s faith was set before Him, He dwelt on it, probably as a refreshing contrast to the unbelief He so often met. One Latter-day Saint reading takes the verb instead as “he admired him,” said aloud, with surprise and pleasure, to the crowd that followed.

      In Luke the faith stands out the more because the centurion never comes before Jesus at all. His request comes through the elders and his confession through friends, and the servant is healed without Jesus entering the house, just as the man believed (verse 10). Luke also lets the praise of this Gentile stand alone. He leaves out the warning Matthew sets after it, that many will come from the east and the west while the children of the kingdom are cast out ([[Matt. 8:11–12]]); Luke gives that saying in another setting, “they shall come from the east, and from the west, and from the north, and from the south” ([[Luke 13:29]]).
    sources: [talmage-jesus-christ-18, ellicott-luke, brown-testimony-luke, lds-scriptures]
  - ref: 11
    phrase: a city called Nain
    kind: history
    title: A city called Nain
    body: |
      Nain was a small farming village against the hill of Moreh, at the eastern edge of the Jezreel Valley, off the main roads and reached by a single road. It lay about thirty miles from Capernaum and some 1,300 feet higher: Capernaum sits about 600 feet below sea level on the shore of the lake, Nain about 700 feet above it. If Jesus came “the day after” the healing of the centurion’s servant, He probably had to set out very early, or even walk during the night, to meet the funeral as it came out of the gate. Some of the earliest manuscripts, among them the papyrus P75, read a vaguer “soon afterward,” and which reading Luke wrote is an open question.

      Either way, the meeting at the gate was probably not chance. Luke shows Jesus knowing what others do not ([[Luke 5:22]]), and He likely knew of the widow’s plight and walked the long road to reach her.
    sources: [wilson-widow-nain, brown-testimony-luke]
  - ref: 12
    phrase: the only son of his mother, and she was a widow
    kind: history
    title: The only son of his mother
    body: |
      Luke piles up the details of her loss. Her husband was dead, and now her only son, a “young man” (verse 14; Greek *neaniskos*, a man perhaps in his twenties). “Only son” is *monogenēs*, “only begotten,” which suggests she had no daughters either. Under the law of the day a widow did not inherit her husband’s estate; a married woman belonged to her husband’s family for her support, and when he died her care passed to her birthright son. With this son dead she may have had no one left to provide for her, and stark poverty lay ahead.
    sources: [brown-testimony-luke, wilson-widow-nain]
  - ref: 14
    phrase: he came and touched the bier
    kind: christ
    title: He came and touched the bier
    body: |
      No one asked Jesus for this miracle. Luke says only that “when the Lord saw her, he had compassion on her” (verse 13), and that compassion is the heart of the story; of the Gospels, only Luke records this instance of it. It is also the first time Luke himself calls Jesus “the Lord,” and the title fits the scene: here He is Lord over death.

      The touch made Jesus ritually unclean. He set the rule beside a greater need and chose the need, and, in one Latter-day Saint reading, the majesty of who He was overpowered the ritual stain. The Greek verb carries the sense of taking hold of or clinging, so the picture is likely of Jesus gripping the bier and bringing the procession to a halt. Then He speaks to the dead man, and gives the son back to his mother.
    sources: [brown-testimony-luke, huntsman-lukes-jesus]
  - ref: 16
    phrase: That a great prophet is risen up among us
    kind: scripture
    title: A great prophet is risen up among us
    body: |
      The crowd’s cry reaches back to Israel’s prophets. Elijah had raised the son of a widow at Zarephath ([[1 Kgs. 17:17–24]]); Elisha had raised the only son of the woman of Shunem ([[2 Kgs. 4:32–37]]), whose house stood on the far side of the same hill of Moreh from Nain. The people saw in Jesus a man who wielded God’s power as those prophets had, and called Him one.

      Their second cry goes further: “God hath visited his people.” In Jesus, God Himself had come among His people, as Zacharias prophesied when John was born ([[Luke 1:68]]). “Prophet,” though, is the title that sticks. Later the crowds compare Him with this prophet or that ([[Luke 9:7–8]], [[Luke 9:19]]), and on the day of the Resurrection two of His own disciples still call Him “a prophet mighty in deed and word” ([[Luke 24:19]]).
    sources: [seely-messiah, brown-testimony-luke, huntsman-lukes-jesus]
  - ref: 19
    phrase: Art thou he that should come?
    kind: history
    title: Art thou he that should come?
    body: |
      “He that should come” is in Greek “the coming one” (*ho erchomenos*), a phrase that hints at the messenger of [[Mal. 3:1]], a role Jesus fills only in part (in verse 27 He applies that passage to John), and also at the Messiah. So John is asking the largest question there is. In the Latter-day Saint reading, John sent his disciples to reassure their faith, not his own. Many scholars hear doubt in the question instead: a prisoner unsure, by now, of the mission of his kinsman.

      John had already borne witness of Jesus as “the Lamb of God” ([[John 1:29]]) and told his disciples that he must decrease and Jesus increase ([[John 3:30]]). And by the Joseph Smith Translation, when Jesus knew that John was cast into prison, “he sent angels, and, behold, they came and ministered unto him” (JST Matt. 4:11). A man so recently ministered to by angels was unlikely to need reassurance for himself. It was his disciples’ testimony that was in question, not John’s. That he sent two of them may rest on the law’s requirement of two witnesses ([[Deut. 19:15]]); they would see and hear Jesus for themselves.
    sources: [bd-john-the-baptist, brown-testimony-luke, benson-matthews-john-baptist, lds-scriptures]
  - ref: 22
    phrase: tell John what things ye have seen and heard
    kind: scripture
    title: Tell John what things ye have seen and heard
    body: |
      Jesus answers John’s question with works rather than a title. Luke alone says that “in that same hour” He cured many and gave sight to many who were blind (verse 21): instead of replying at once in words, He went on with His labor, and only then turned to the two messengers. What they carried back were the tokens by which the prophets had said the Messiah would be known, and John, who had preached from Isaiah himself, could hardly have missed them: the blind seeing and the deaf hearing ([[Isa. 29:18]]; [[Isa. 35:5]]), the gospel preached to the poor ([[Isa. 61:1]]), and the lame walking and the blind receiving their sight, as King Benjamin also foresaw ([[Mosiah 3:5]]). The note on [[Matt. 11:5]] takes up those prophecies where Matthew tells the scene.

      In Luke these are the works Jesus had claimed at Nazareth. There He read Isaiah 61 and declared it fulfilled ([[Luke 4:18–21]]), making Himself known as the Messiah, though not one who would deliver Israel from Rome: His ministry would heal the brokenhearted and the blind and conquer death and hell. The very miracles Isaiah named, which He did not do in unbelieving Nazareth, He did before John’s messengers. The blessing that follows (verse 23) is for anyone who does not stumble when the Messiah’s work does not match what he expected; “misunderstanding is the prelude to offense.”
    sources: [talmage-jesus-christ-18, sc-knowhy-656, brown-testimony-luke]
  - ref: 26
    phrase: much more than a prophet
    kind: history
    title: Much more than a prophet
    body: |
      Jesus Himself points to what set John above the prophets: he is the one of whom it is written, “Behold, I send my messenger before thy face” (verse 27, from [[Mal. 3:1]]). Other prophets had told of the Messiah’s coming; John had seen Him, had baptized Him, and had served Him as a body servant serves his master. Latter-day revelation adds that he was ordained to that calling by an angel when he was eight days old ([[D&C 84:28]]; see the note on [[Luke 1:59]]). His greatness “consisted of his unique privileges and the quality of his work.”

      The questions before it (verses 24–25) bring the crowd to that answer by naming what John was not: no reed bending in the wind, no courtier at ease. Luke’s wording of the second is sharper than Matthew’s, “gorgeously apparelled, and live delicately,” a picture of the display and luxury common in Herod’s house, whose prisoner John now was. The note on [[Matt. 11:7]] takes up the reed and the courtier, and the note on verse 28 gives Joseph Smith’s reasons why no prophet was greater.
    sources: [talmage-jesus-christ-18, lds-scriptures, bd-john-the-baptist, ellicott-luke]
  - ref: 28
    phrase: he that is least in the kingdom of God is greater than he
    kind: prophets
    title: He that is least in the kingdom of God
    body: |
      Joseph Smith asked how John could be counted the greatest of the prophets, and answered that it was not his miracles. John was given three things no one else had: the mission of “preparing the way before the face of the Lord”; the charge “to baptize the Son of Man”; and, at that time, he was “the only legal administrator in the affairs of the kingdom there was then on the earth, and holding the keys of power.”

      The second half of the verse, as Joseph Smith read it, is about Jesus Himself. Jesus was looked upon as the one with the least claim in God’s kingdom and the least right to be believed as a prophet, “as though He had said—‘He that is considered the least among you is greater than John—that is I myself.’” Some early Christian writers read the verse the same way, and the footnote’s [[D&C 50:26]] speaks of the Lord’s servant in the same paradox: “appointed to be the greatest, notwithstanding he is the least and the servant of all.” Many commentators take the verse instead to set John and his followers below Jesus’s disciples, not as persons but in their access to the kingdom’s blessings.
    sources: [tpjs-2007-ch-6, brown-testimony-luke]
  - ref: 30
    phrase: rejected the counsel of God against themselves
    kind: words
    title: Rejected the counsel of God against themselves
    body: |
      Verses 29–30 are Luke’s own comment, set between Jesus’s sayings: a word on how John’s preaching had divided the people. Ordinary people and even publicans “justified God,” that is, acknowledged that God was right, by accepting John’s baptism. The Pharisees and the lawyers refused it. The lawyers were experts in the law of Moses, scribes, a calling as old as Ezra, and the title appears more regularly in Luke than anywhere else.

      “The counsel of God” is His purpose and plan, the phrase used elsewhere in the New Testament for the plan of salvation ([[Acts 20:27]]). The Greek preposition behind “against” is better “for”: they set aside God’s purpose for their own lives. That is a strong condemnation, because accepting John’s baptism, a baptism of repentance, was the first step toward Christ ([[Luke 3:16]]); to refuse it was to refuse the step that led to Him.

      The verb for “justified” returns in verse 35, “wisdom is justified of all her children,” in the same sense of being acknowledged as right.
    sources: [ellicott-luke, brown-testimony-luke, lds-scriptures]
  - ref: 32
    phrase: We have piped unto you, and ye have not danced
    kind: symbol
    title: We have piped unto you
    body: |
      Jesus takes His picture from the town square, where children played among the stalls. One group wants to play wedding and pipes a dance tune, but the others will not dance; they switch to playing funeral and wail a lament, and still the others will not mourn. That is “this generation.” John came like the strict prophets of old, refusing bread and wine, and they said he had a devil; the Son of Man came eating and drinking like any other man, and they called Him a glutton and a friend of sinners. Whatever tune God’s messengers played, these hearers would not join in. The picture can also be turned the other way, with “this generation” as the children who call first one tune and then another, changing their minds only to find fault with both John and Jesus; either way, John and Jesus alike were refused.

      “Wisdom” in verse 35 is pictured almost as a person, as in [[Prov. 8:22–30]], with children who follow her lead. Whatever the critics say, her children know that she is right.
    sources: [talmage-jesus-christ-18, brown-testimony-luke]
  - ref: 37
    phrase: a woman in the city, which was a sinner
    kind: history
    title: A woman in the city, which was a sinner
    body: |
      Luke does not name her or say what her sins were. Simon, and many readers since, have taken her for a prostitute, but Luke never says so, and the words about her reputation are probably Simon’s view of her, which Luke borrows (verse 39).

      Nor is she either of the women she is often confused with. Mary of Bethany anointed Jesus at another meal, shortly before His betrayal ([[John 12:1–8]]), and to make the two one is wholly unfounded. Nor is she Mary Magdalene, who first appears in the next chapter (see the note on [[Luke 8:2]]).
    sources: [strathearn-simon-woman, brown-testimony-luke, talmage-jesus-christ-18]
  - ref: 38
    phrase: stood at his feet behind him
    kind: symbol
    title: Stood at his feet behind him
    body: |
      Guests at a formal banquet did not sit upright at the table but reclined on couches, and that is how the woman could stand behind Jesus at His feet. Once in the dining room she uncovered her head and hair, which in some parts of that culture was a shameful thing to do. To grasp or wash another’s feet was the lowest of postures, close to lying prostrate before him.

      Her three acts can be read as a picture of repentance: the washing as the cleansing a person passes through, the kissing as embracing a life free of sin, and the perfume as the sweetness of knowing one’s sins are forgiven for good. That is a devotional reading, not something Luke spells out.
    sources: [strathearn-simon-woman, brown-testimony-luke, calabro-nonverbal]
  - ref: 39
    phrase: This man, if he were a prophet
    kind: history
    title: If he were a prophet
    body: |
      Simon assumes that a prophet sees what is hidden, who a person really is, what others are thinking, and concludes that Jesus cannot be one: no prophet would let such a woman touch him. The irony is that Jesus proves Simon wrong on Simon’s own terms. He does not judge the woman; He answers the thoughts Simon “spake within himself” (verses 39–40).

      Simon calls Him “Master,” teacher, a title of modest respect that falls far short of who Jesus is. Yet Jesus calls him by name, and deals with him not as one of a party that opposed Him but as a man in need of His help.
    sources: [brown-testimony-luke, strathearn-simon-woman]
  - ref: 44
    phrase: Seest thou this woman?
    kind: history
    title: Seest thou this woman?
    body: |
      Jesus turns toward the woman but speaks to Simon, and lists the courtesies a host owed a guest. Washing a guest’s feet was a rite of hospitality, usually left to female servants; a house without them at least set out water so that the guest could wash his own ([[Gen. 18:4]]). A kiss was the customary greeting between friends. Simon had given neither, nor oil for His head. The woman made up every omission in her own unusual way: tears for water, her hair for a towel, kisses on His feet, perfume where oil was not even offered.

      The question “Seest thou this woman?” asks Simon to see her as Jesus sees her. He had invited Jesus into his house and then failed to treat Him with the respect He was owed. The Pharisees charged that Jesus ate with sinners, and they were right; but at this meal the one who failed in what he owed his guest was Simon, not the woman whose sins he had in mind.
    sources: [calabro-nonverbal, brown-testimony-luke, strathearn-simon-woman]
  - ref: 47
    phrase: for she loved much
    kind: words
    title: For she loved much
    body: |
      In the King James Version the verse can sound as though she was forgiven because she loved: love first, and forgiveness as its reward. The parable Jesus has just told runs the other way. The debtor forgiven more loves more (verses 41–43), so love is the result of forgiveness, not its price. The Greek allows the parable’s order. “Are forgiven” is a perfect tense, “have been forgiven,” a forgiveness already given; and the word translated “for” (*hoti*) can be read not as “because” but in a logical sense: her sins have been forgiven, as her great love shows. On this reading the forgiveness came first and the love after: she had already known the power of His forgiveness before she ever entered Simon’s house, and came to thank Him.

      The question need not be settled one way. Forgiveness comes in answer to signs, seen and unseen, that a person is seeking it, so her love can be read as one of those signs; and once given, forgiveness shows itself in the good that follows, so her love was also its fruit. In every case repentance is required, and forgiveness is God’s alone to give ([[Isa. 43:25]]). Jesus announces it first to Simon, the host (verse 47), and only then to the woman herself (verse 48).
    sources: [strathearn-simon-woman, brown-testimony-luke]
  - ref: 49
    phrase: Who is this that forgiveth sins also?
    kind: christ
    title: Who is this that forgiveth sins also?
    body: |
      The guests ask the question the whole chapter has been raising, and it is exactly the right one. The irony is that they ask it at the table of a host who has just decided that Jesus is not even a prophet (verse 39). The true answer, that He is the Messiah, would change everything for them if they would open themselves to it.

      Jesus’s words in verse 48 were also for them. “Thy sins are forgiven” told the woman again what she already knew, if she had been forgiven before she came, and declared it in public to Simon and his guests. Then He sends her out: “Thy faith hath saved thee; go in peace” (verse 50). Her trust that He would forgive her had apparently brought her, uninvited, into a dinner whose guests were likely all men; having received the power of the Atonement, she could now find peace with herself and with her God.
    sources: [brown-testimony-luke, strathearn-simon-woman]

christ: |
  Luke 7 shows Jesus Christ as the Deliverer He announced at Nazareth. He heals a servant with a word spoken at a distance, takes hold of a bier and gives a widow back her son, and declares a sinner forgiven: power over sickness, over death and over sin, the last of which Simon’s guests could only question (verse 49). The woman is the chapter’s picture of a disciple. In the parable of the two debtors (verses 41–43), love is the answer to forgiveness, as John wrote, “We love him, because he first loved us” ([[1 Jn. 4:19]]), and the One who forgave her sends her, and all who come to Him forgiven, back into the world in peace (verse 50).

explore: |
  - **The other tellings.** [[Matt. 8:5–13]] for the centurion, where Jesus adds that many will come from east and west to sit down in the kingdom; [[Matt. 11:2–19]] for John’s question and Jesus’s witness of him.
  - **The prophets who raised the dead.** [[1 Kgs. 17:17–24]], Elijah and the widow of Zarephath’s son, and [[2 Kgs. 4:18–37]], Elisha and the Shunammite’s son, beside the raising at Nain.
  - **Another anointing.** [[Matt. 26:6–13]], [[Mark 14:3–9]] and [[John 12:1–8]] tell of the anointing at Bethany shortly before the Crucifixion, a different woman at a different meal.
  - **Simon’s side of the story.** The article “Simon and the Woman Who Anointed Jesus’s Feet” (*Religious Educator*, 2004) reads the scene as much about the Savior reaching out to His host as about the woman.

