    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/23?lang=eng'
    quote: '“darkness”: Amos 8:9; Hel. 14:20.'
  - where: 'note 23:44 “Darkness at noon”'
    claim: 'Amos: the sun to go down at noon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/8?lang=eng'
    quote: 'I will cause the sun to go down at noon, and I will darken the earth in the clear day'
  - where: 'note 23:44 “Darkness at noon”'
    claim: 'Amos 8:9–10 belongs to the darkness of the day of the Lord, a precedent for this darkness'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'the gloom and darkness prophesied the wrath and judgment that would accompany “the day of the Lord” (see Zeph 1:15; Joel 2:2; 3:4; Amos 8:9‒10)'
  - where: 'note 23:44 “Darkness at noon”'
    claim: 'Samuel the Lamanite foretold darkness at His death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/hel/14?lang=eng'
    quote: 'in that day that he shall suffer death the sun shall be darkened and refuse to give his light unto you'
  - where: 'note 23:44 “Darkness at noon”'
    claim: 'The Book of Mormon and latter-day authorities suggest the darkness showed the Light of the World ebbing out'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'suggestions in the Book of Mormon (Helaman 14:20; 3 Nephi 8:1‒10:10) and by Latter-day authorities that this darkness represented that the life of Jesus, the Light of the World, was ebbing out'
  - where: 'note 23:46 “Into thy hands”'
    claim: 'Luke omits the cry of Psalm 22 that the other two report'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/23.htm'
    quote: 'We can only conjecturally account for the omission of the “ELI, ELI, LAMA SABACHTHANI,” so prominent in the other two reports'
  - where: 'note 23:46 “Into thy hands”'
    claim: 'These words speak not of abandonment but of trust, and are from the Psalms'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/23.htm'
    quote: 'those which seemed to them to speak, not of abandonment, but of an absolute and unshaken trust. It is remarkable that this, like the cry of apparent despair, is a quotation from the Psalms'
  - where: 'note 23:46 “Into thy hands”'
    claim: 'The loud cry and the words may be one act'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/23.htm'
    quote: 'Better. And Jesus cried with a loud voice, and said . . . The English text emphasises too strongly the distinctness of the act'
  - where: 'note 23:46 “Into thy hands”'
    claim: 'He voluntarily gave up His life'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'He bowed His head, and voluntarily gave up His life.'
  - where: 'note 23:46 “Into thy hands”'
    claim: 'Ekpneō: to breathe out, breathe one’s last'
    key: thayer
    url: 'https://biblehub.com/greek/1606.htm'
    quote: 'to breathe out, breathe out one''s life, breathe one''s last, expire: Mark 15:37, 39; Luke 23:46'
  - where: 'note 23:47 “A righteous man”'
    claim: 'Dikaios, on a Gentile’s lips of Christ, means innocent, guiltless (Matt. 27:19, 24; Luke 23:47)'
    key: thayer
    url: 'https://biblehub.com/greek/1342.htm'
    quote: 'the negative idea predominating: innocent, faultless, guiltless … thus used of Christ in the speech of Gentiles: Matthew 27:19, 24'
  - where: 'note 23:47 “A righteous man”'
    claim: 'Luke’s wording may give the exact measure of what the centurion meant'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/23.htm'
    quote: 'may, perhaps, have originated in a wish to express the exact measure, and not more, of the sense in which the centurion had used the seemingly higher words'
  - where: 'note 23:47 “A righteous man”'
    claim: 'The soldiers had never seen a man die of his own will, with a loud cry'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'They had probably witnessed many deaths on the cross, but never before had they seen a man apparently die of his own volition, and able to cry in a loud voice at the moment of dissolution.'
  - where: 'note 23:47 “A righteous man”'
    claim: 'With the earthquake, this moved the centurion to pray to God'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'This marvel, coupled with the earthquake and its attendant horrors, so impressed the centurion that he prayed to God'
  - where: 'note 23:47 “A righteous man”'
    claim: 'The crowd went home awed by the darkness and the manner of His death'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/23.htm'
    quote: 'now they went away awed, partly by the darkness, partly by the solemn majesty of that awful death.'
  - where: 'note 23:51 “Joseph of Arimathæa”'
    claim: 'The footnote glosses “counsellor” as a member of the Sanhedrin'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/23?lang=eng'
    quote: '“counsellor”: IE member of the Sanhedrin, senator.'
  - where: 'note 23:51 “Joseph of Arimathæa”'
    claim: 'He opposed his colleagues’ condemnation of Jesus, or at least did not vote with them'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'from which statement we infer that he was a Sanhedrist and had been opposed to the action of his colleagues in condemning Jesus to death, or at least had refrained from voting with the rest.'
  - where: 'note 23:51 “Joseph of Arimathæa”'
    claim: '“Counsel” covers the council’s plans from Caiaphas’s advice to the condemnation; “deed” the bargain with Judas and the delivery to Pilate'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/23.htm'
    quote: 'The first word includes all the earlier stages of the action of the Sanhedrin, from the counsel given by Caiaphas (John 11:49) to the final condemnation; the second, the unofficial acts, such as the compact with Judas, and the delivery to Pilate.'
  - where: 'note 23:51 “Joseph of Arimathæa”'
    claim: 'Joseph was wealthy; the other Gospels call him a disciple, John a secret one'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'a respected, wealthy member of the Sanhedrin named Joseph of Arimathea asked Pilate for permission to bury him. Described as one who “waited for the kingdom of God” in Luke, the other Gospels identify him as one of Jesus’s disciples'
  - where: 'note 23:51 “Joseph of Arimathæa”'
    claim: '“Waited for the kingdom of God” agrees with Mark'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/23.htm'
    quote: 'The description agrees in form with St. Mark, but not with St. Matthew or St. John.'
  - where: 'note 23:51 “Joseph of Arimathæa”'
    claim: 'Without him the body might have gone to the criminals’ common grave'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'But for some such divinely directed intervention, the body of Jesus might have been cast into the common grave of executed criminals.'
  - where: 'note 23:51 “Joseph of Arimathæa”'
    claim: 'The burial was made in haste because the Sabbath was near'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'Because of the nearness of the Sabbath the interment had to be made with haste'
