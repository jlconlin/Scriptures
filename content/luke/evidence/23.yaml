chapter: 23
claims:
  # ---- when, setting, thread
  - where: when
    claim: 'Jesus died about three, leaving little time before the Sabbath'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'Because Jesus dies about 3 o’clock (see the Note on 23:44–46), little time is available for preparing and burying his body.'
  - where: setting
    claim: 'Pilate was Roman prefect from AD 26 to 36'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'This person is Pontius Pilate, Roman Prefect (Latin praefectus) from AD 26 to 36'
  - where: setting
    claim: 'Pilate came to Jerusalem only occasionally, at the festivals'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'He visits Jerusalem only occasionally, during festivals.'
  - where: setting
    claim: 'The accusers reached Pilate perhaps about eight in the morning'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'The accusers arrive as a group with their prisoner at Pilate’s temporary residence perhaps about eight o’clock in the morning'
  - where: setting
    claim: 'Mark gives the basic order of the Roman trial; each of the others adds episodes; Luke adds Herod'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Mark’s account of Jesus’s trial before the Roman governor Pontius Pilate is supplemented by the other Synoptics, each of which adds episodes lacking in the Marcan original.'
  - where: setting
    claim: 'Luke omits the scourging'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'Luke omits any reference to the actual beating that Pilate’s soldiers administer to Jesus'
  - where: thread
    claim: 'The repeated verb “find” in the accusers’ and Pilate’s mouths highlights Jesus’s innocence'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'The repetition of the verb translated “to find” in the mouths of the accusers and Pilate (see 23:4, 14, 22), with vastly different results, highlights Jesus’ innocence in the eyes of Roman authority.'
  - where: thread
    claim: 'Under Roman justice Jesus stands guiltless; this is Luke’s point'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'Under the harsh glare of Roman justice, Jesus stands guiltless. Yes, even sinless. And this is Luke’s point.'
  - where: thread
    claim: 'Jesus is acknowledged as king at every turn, insincerely or without faith'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'Ironically, the title of this chapter could be “Kingship Misunderstood.” At every turn, Jesus is acknowledged to be king. But it is clear that those who speak of him in this way do so insincerely or without faith.'
  - where: thread
    claim: 'Even on the way to death and on the cross Jesus reaches out to others'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'But even as the battered and bruised Jesus stumbles weakly to his death and as he hangs on the cross, he is still reaching out to those who will listen.'
  # ---- section plains
  - where: section 1 plain
    claim: '“All Jewry” is “all Judea,” a place'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'Properly translated, the phrase should read “throughout all Judea,” a geographical reference rather than an ethnic one.'
  - where: section 1 plain
    claim: '“Thou sayest it”: it is as Pilate says'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'when Jesus says that it is as Pilate says, the governor surprisingly tells the chief priests and the gathered crowd that he found no grounds for legal action against him'
  - where: section 2 plain
    claim: '“Unto him” is “by him”; “instant” is urging'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/23?lang=eng'
    quote: '“instant”: GR urging.'
  - where: section 3 plain
    claim: 'Calvary means skull; vinegar is sour wine'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'Luke preserves the name Calvary (Greek kranion; in Latin calvaria), which means “skull,”'
  - where: section 3 plain
    claim: 'Vinegar is sour wine'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/23?lang=eng'
    quote: '“vinegar”: GR sour wine.'
  - where: section 5 plain
    claim: 'The sixth hour is noon; the ninth about three in the afternoon'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'The time is about three in the afternoon, normally the time of the evening sacrifice at the temple'
  - where: section 5 plain
    claim: '“Earth” can be “land”; “gave up the ghost” is expired'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/23?lang=eng'
    quote: '“earth”: GR earth, region, land, or country.'
  - where: section 6 plain
    claim: '“Counsellor” is a member of the Sanhedrin'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/23?lang=eng'
    quote: '“counsellor”: IE member of the Sanhedrin, senator.'
  # ---- notes
  - where: 'note 23:2 “Charges for a Roman ear”'
    claim: 'The authorities shifted from a religious to a political charge within the governor’s competence'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'suggesting that the Jewish authorities had shifted their strategy from a religious charge to a political accusation that would more clearly fall within the governor’s competence'
  - where: 'note 23:2 “Charges for a Roman ear”'
    claim: 'A Roman governor’s duties included keeping the peace and collecting taxes'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'had three main duties: maintaining the peace, defending the borders of the province, and collecting taxes'
  - where: 'note 23:2 “Charges for a Roman ear”'
    claim: 'The charges differ from the council’s findings; Luke exposes them as lies, especially on the tribute, which Jesus had answered (20:21–25)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'They differ completely from their findings in the hearing before the council (see 22:66–71). Luke thereby exposes their charges as creative lies'
  - where: 'note 23:2 “Charges for a Roman ear”'
    claim: 'The authorities knew His answer on the tribute and distorted it'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'Only a few days before, the authorities send “spies” who query Jesus specifically about paying taxes to Caesar (20:20–22). Even though they know Jesus’ answer, they distort it in the first of their specific charges against him.'
  - where: 'note 23:2 “Charges for a Roman ear”'
    claim: '“Thou sayest” here and in 22:70 does not deny the title, though He means it differently'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'Importantly, in neither case does he deny his status, although he understands the meaning of the terms “Son of God” and “King of the Jews” very differently.'
  - where: 'note 23:7 “Why Pilate sent Him to Herod”'
    claim: 'Herod Antipas, son of Herod the Great, tetrarch of Galilee'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'This man is Herod Antipas, a son of Herod the Great.'
  - where: 'note 23:7 “Why Pilate sent Him to Herod”'
    claim: 'Pilate sent Jesus to Antipas, in Jerusalem for Passover, presumably for a legal recommendation'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'presumably for a legal recommendation, given that the Herodians regularly served as advisors to the Romans on Jewish law and practice'
  - where: 'note 23:7 “Why Pilate sent Him to Herod”'
    claim: 'Pilate wanted to be rid of the problem, or learn whether Herod found Him guilty of a crime in his territory'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'Let’s send the prisoner to Herod Antipas, the tetrarch of Galilee, and get rid of this problem or, at least, learn whether he finds this Galilean innocent or guilty of some crime in his territory.'
  - where: 'note 23:7 “Why Pilate sent Him to Herod”'
    claim: 'They met for the first and only time; Herod had earlier sought His death (13:31)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'Yet they meet for the first and only time in Jerusalem.'
  - where: 'note 23:7 “Why Pilate sent Him to Herod”'
    claim: 'Two Roman representatives find Jesus innocent'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'Thus, Luke establishes Jesus’ innocence in the responses of two Roman officials.'
  - where: 'note 23:7 “Why Pilate sent Him to Herod”'
    claim: 'No ancient source gives the reason for the enmity between Pilate and Antipas'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'Neither Luke nor any other ancient source offers the reason for the frosty relationship between Pilate and Antipas.'
  - where: 'note 23:9 “He answered him nothing”'
    claim: 'Herod fits the sign seeker of 11:16, 29'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'Herod thus fits the stereotype of a sign seeker (see 11:16, 29–30).'
  - where: 'note 23:9 “He answered him nothing”'
    claim: 'The imperfect: Herod questions at length while Jesus is silent'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'stands in the imperfect tense, indicating that Herod asks questions for a long time, even while Jesus is silent'
  - where: 'note 23:9 “He answered him nothing”'
    claim: 'Jesus controls the interview by silence'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'Clearly, Jesus is in charge of this interview. He exercises his control by saying nothing'
  - where: 'note 23:9 “He answered him nothing”'
    claim: 'His silence before Herod is another fulfillment of Isaiah 53:7'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Jesus refuses to answer him, providing for Luke another fulfillment of Isaiah 53:7'
  - where: 'note 23:9 “He answered him nothing”'
    claim: 'The footnote to “answered” gives Mosiah 14:7 and 15:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/23?lang=eng'
    quote: '“answered”: Mosiah 14:7; 15:6.'
  - where: 'note 23:11 “A shining robe”'
    claim: 'Lampra means shining or radiant, possibly white'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'The word translated “gorgeous” (Greek lampra) means “shining” or “radiant,” possibly indicating that the garment is white in contrast to Jesus’ own clothing'
  - where: 'note 23:11 “A shining robe”'
    claim: 'Compare the purple robe in the other Gospels; modern scripture joins the radiant and purple images (D&C 133:46)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'wherein Jesus’ captors dress him in a purple robe in a mocking display of obeisance before royalty. Modern scripture brings the radiant and purple images together'
  - where: 'note 23:11 “A shining robe”'
    claim: 'The clean clothing perhaps indicated Antipas found Him innocent'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'perhaps replacing his earlier tattered apparel with clean clothing as an indication that Antipas has found him innocent of any of the charges'
  - where: 'note 23:18 “Barabbas”'
    claim: 'Verse 17 is missing from many important manuscripts including P75; the custom is affirmed in the other Gospels'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'This verse does not appear in many of the important New Testament manuscripts, including the earliest known copy of Luke’s Gospel, P75.'
  - where: 'note 23:18 “Barabbas”'
    claim: 'Whose custom the release was is unclear'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Whether this was Pilate’s own practice (Mark 15:6), possibly that of all Roman governors (Matt 27:15; Luke 23:17), or a Jewish custom that Pilate had adopted is unclear'
  - where: 'note 23:18 “Barabbas”'
    claim: 'Barabbas was guilty of what the leaders implied of Jesus'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'he was guilty of actual insurrection against Rome, the very thing that the Jewish leadership implied Jesus was fomenting by claiming that he was the Messiah'
  - where: 'note 23:18 “Barabbas”'
    claim: 'The name means “son of the father”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'The name Barabbas (“son of the father” or “son of Abba”)'
  - where: 'note 23:18 “Barabbas”'
    claim: 'Elder Holland on the irony of the name'
    key: holland-none-with-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/none-were-with-him?lang=eng'
    quote: 'So one godless “son of the father” was set free while a truly divine Son of His Heavenly Father moved on to crucifixion'
  - where: 'note 23:18 “Barabbas”'
    claim: 'Luke repeats Barabbas’s charge in 23:25 to contrast it with Jesus’s innocence'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'The double charge against the evidently guilty Barabbas, first noted in 23:19, contrasts sharply with Jesus’ innocence'
  - where: 'note 23:23 “Whose voices prevailed”'
    claim: 'The crowd may have been a claque of the chief priests’ retainers'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'the crowd might have consisted primarily of a large group of retainers and other supporters of the chief priests—what is called a claque'
  - where: 'note 23:23 “Whose voices prevailed”'
    claim: 'The crowd shares responsibility with Pilate'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'Thus, the crowd shares the responsibility with Pilate for executing Jesus.'
  - where: 'note 23:23 “Whose voices prevailed”'
    claim: 'Pilate shares the blame with the Jewish authorities'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'Thus the Roman Prefect Pilate shares the blame with the Jewish authorities for Jesus’ execution'
  - where: 'note 23:23 “Whose voices prevailed”'
    claim: 'At the cross Luke distinguishes the people, who did not take part, from the officials'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'Luke consciously draws a distinction between the general population who do not participate in bringing Jesus to his execution and the officials who do'
  - where: 'note 23:23 “Whose voices prevailed”'
    claim: 'Theologically Jesus needed to die; in a real way all are responsible'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Thus, in a very real way we are all responsible for the circumstances of that terrible day.'
  - where: 'note 23:26 “Bearing the cross after Jesus”'
    claim: 'Cyrene was the capital of Cyrenaica in North Africa, home to a Jewish community'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'Cyrene, by the way, is the capital city of the Roman province of Cyrenaica in North Africa (modern Libya) and becomes home to a community of Jews.'
  - where: 'note 23:26 “Bearing the cross after Jesus”'
    claim: 'Jesus probably carried only the crossbeam'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Jesus probably only carried the crossbeam itself'
  - where: 'note 23:26 “Bearing the cross after Jesus”'
    claim: 'Jesus was weakened by Gethsemane and the scourging'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'Jesus is weakened both by his extreme suffering in Gethsemane and, though Luke omits it, by the scourging that he undergoes'
  - where: 'note 23:26 “Bearing the cross after Jesus”'
    claim: 'Luke’s scene is a visual reminder of the sayings on bearing the cross (9:23; 14:27)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'Luke paints for readers a vivid visual reminder of those sayings in that a man, Simon, carries the cross while following the Savior.'
  - where: 'note 23:26 “Bearing the cross after Jesus”'
    claim: 'Simon became well known among the followers, perhaps a Christian'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'Because all of the Synoptics preserve Simon’s name, we can safely presume that he becomes well-known among Jesus’ followers, perhaps even a Christian'
  - where: 'note 23:31 “The green tree and the dry”'
    claim: 'D&C 135:6 uses the green tree and dry trees of the martyrs'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/135?lang=eng'
    quote: 'if the fire can scathe a green tree for the glory of God, how easy it will burn up the dry trees to purify the vineyard of corruption'
  - where: 'note 23:31 “The green tree and the dry”'
    claim: 'JST Luke 23:31–32 adds the scattering of Israel and the desolation of the Gentiles'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/23?lang=eng'
    quote: 'This he spake, signifying the scattering of Israel, and the desolation of the heathen, or in other words, the Gentiles.'
  - where: 'note 23:34 “Whom He asked the Father to forgive”'
    claim: 'JST Luke 23:35 adds “Meaning the soldiers who crucified him”'
    key: jst-luke-23
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/23?lang=eng'
    quote: 'Then said Jesus, Father, forgive them; for they know not what they do (Meaning the soldiers who crucified him,) and they parted his raiment and cast lots.'
  - where: 'note 23:34 “Whom He asked the Father to forgive”'
    claim: 'The forgiveness extends to the soldiers alone, not yet to the rulers'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'Hence, Jesus’ forgiveness extends to the soldiers alone, not yet to “the rulers” (23:35; compare Acts 3:14–19; 7:60).'
  - where: 'note 23:34 “Whom He asked the Father to forgive”'
    claim: 'Brown’s reading of Moses 7:38–39: the Savior can plead for those who repent in the next life; only He knows'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'Might Jesus’ accusers receive forgiveness? Only he knows. Scripture shows us a door'
  - where: 'note 23:34 “Whom He asked the Father to forgive”'
    claim: 'P75 and many manuscripts lack the saying; it fits Luke’s language and Stephen’s prayer seems to draw on it'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'But the saying fits Luke’s language. And Stephen’s prayer in Acts 7:60 seems to draw its inspiration from the words of Jesus reported here, thus buttressing its genuineness'
  - where: 'note 23:34 “Whom He asked the Father to forgive”'
    claim: 'Church leaders have also applied the prayer more widely, and most often to teach forgiveness'
    key: hilton-final-seven-statements
    url: 'https://rsc.byu.edu/vol-22-no-1-2021/teachings-church-leaders-christs-final-seven-statements'
    quote: 'Although this translation makes it clear that Christ refers to the soldiers, Church leaders have also used this statement from the cross to indicate that Christ asked his Father to forgive “the Jews,”'
  - where: 'note 23:34 “Whom He asked the Father to forgive”'
    claim: 'The most common use of the saying is to teach forgiveness'
    key: hilton-final-seven-statements
    url: 'https://rsc.byu.edu/vol-22-no-1-2021/teachings-church-leaders-christs-final-seven-statements'
    quote: 'Throughout our corpus, the most common reason that a speaker quoted this statement from the Savior was to teach the doctrine of forgiveness.'
  - where: 'note 23:34 “Whom He asked the Father to forgive”'
    claim: 'Elder Holland: as our advocate He still makes that plea'
    key: holland-peaceable-things
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1996/10/the-peaceable-things-of-the-kingdom?lang=eng'
    quote: 'As our advocate with the Father, He is still making that same plea today—in your behalf and in mine.'
  - where: 'note 23:35 “He saved others”'
    claim: 'Jesus is mocked three times on the cross; Luke gives the first sneer to the rulers'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Luke puts this sneer in the mouths of the rulers rather than the common people'
  - where: 'note 23:35 “He saved others”'
    claim: 'The rulers do not understand that He saves people according to their faith'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'a complete lack of understanding that he heals and saves people according to their faith'
  - where: 'note 23:35 “He saved others”'
    claim: 'The popular Messiah was more like Barabbas'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'In a word, the Messiah is thought to be more like Barabbas (see 23:18–19).'
  - where: 'note 23:35 “He saved others”'
    claim: '“If thou be” echoes the devil’s taunts'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'The taunt tastes like the devil’s earlier taunts, “If thou be the Son of God” (4:3, 9)'
  - where: 'note 23:35 “He saved others”'
    claim: 'He saves not from the cross but through it'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'But the salvation that Jesus offers is not to deliver the three of them from their crosses but through his own cross.'
  - where: 'note 23:43 “With me in paradise”'
