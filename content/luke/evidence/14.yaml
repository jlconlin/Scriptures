    quote: 'The story implies that invitations had been given sufficiently early to the chosen and prospective guests; then on the day of the feast a messenger was sent to notify them again, as was the custom of the time.'
  - where: 'note 14:18 “The excuses”'
    claim: 'Those who embrace the old law and its exemptions are excluded from His supper'
