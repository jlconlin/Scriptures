    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'the story forms part of his message that those who continue to embrace the old law, and find excuses or exemptions therein, will find themselves excluded from his supper or kingdom.'
