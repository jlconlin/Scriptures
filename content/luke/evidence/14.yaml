chapter: 14
claims:
  # ---- when, setting, thread
  - where: when
    claim: 'Talmage sets the meal and the sayings on the cost in the continuing Perean and Judean ministry'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'As had been in Galilee, so was it in Perea and Judea—great multitudes attended the Master whenever He appeared in public.'
  - where: setting
    claim: 'After the meal of chapter 11, scribes and Pharisees continued to look for grounds to accuse Him; the leader of the Pharisees implies they were organized hierarchically'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'Concerning Jesus’ ongoing contacts with Pharisees, even though he moves on to another town and the ramifications of the rancorous incident recorded in 11:37–54 fade, some scribes and Pharisees continue to pursue grounds “that they might accuse him” (11:54).'
  - where: setting
    claim: 'The Sabbath meal was customarily prepared the day before and eaten after the synagogue service'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'Customarily, this meal is prepared the day prior and eaten after the synagogue service.'
  - where: setting
    claim: 'At verse 25 Luke takes Jesus from the Sabbath gathering and puts Him on the road; the JST supplies a transition'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'Luke abruptly takes Jesus out of the Sabbath gathering and places him on the road. The Joseph Smith Translation, showing an awareness of the difficulty, offers a better transition to what follows: “And when he had finished these sayings, he departed thence” (JST 14:25'
  - where: setting
    claim: 'The differences between Luke’s supper and Matthew’s wedding feast may point to Jesus retelling the story in different settings'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'These same differences, however, may also point to Jesus’ independent retelling of a meaningful story in varying settings and ways, a view that most scholars will not accept. But the differences are striking enough that such a conclusion is not unreasonable.'
  - where: thread
    claim: 'The sayings on discipleship continue what Jesus taught at the Sabbath meal: humility and turning to the poor'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'But his words find compelling continuity with what he discusses at the Sabbath meal with his host and the other guests. For there he requires that they change how they see themselves relative to others, not seeking honors but seeking humility'
  - where: thread
    claim: 'The excuses concern property, goods and spouse'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'The excuses have to do with a person’s most prized earthly connections: to property (14:18), to goods (14:19) and to spouse (14:20).'
  - where: thread
    claim: 'The married man’s excuse foreshadows 14:26, that even a spouse may not come before the Lord'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'While this final excuse seems more legitimate than the others (see Deuteronomy 24:5), it foreshadowed the Savior’s teaching in Luke 14:26 that even one’s spouse should not take priority over the Lord.'
  # ---- section plains
  - where: section 2 plain
    claim: '“Chief rooms” are the places of honor at the table'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'he noticed that the other guests “chose out the chief rooms” (Luke 14:7), or places of honor.'
  - where: section 2 plain
    claim: '“Worship” in verse 10 means honor'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'The term translated “worship” (Greek doxa) means “honor” in this context'
  - where: section 3 plain
    claim: '“Compel” in verse 23 can mean to constrain by persuasion and entreaty'
    key: thayer
    url: 'https://biblehub.com/greek/315.htm'
    quote: 'to necessitate, compel, drive to, constrain, whether by force, threats, etc., or by persuasion, entreaties, etc., or by other means'
  # ---- notes
  - where: 'note 14:1 “They watched him”'
    claim: 'The verb “watched” carries the sense of hostile observation; “they” are the lawyers and Pharisees at the meal'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'the verb translated “watched” (Greek paratēreō) carries the sense of “hostile observation” (see 6:7; 20:20). Rather, the pronoun points to the “lawyers and Pharisees” invited to the meal (14:3)'
  - where: 'note 14:1 “They watched him”'
    claim: 'Jesus accepts an invitation from strangers, as in 7:36 and 11:37'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'Jesus accepts an invitation to join a group of guests who are strangers to him, presenting an obvious opportunity for him to interact with others (see 7:36; 11:37).'
  - where: 'note 14:1 “They watched him”'
    claim: 'The Sabbath stories together show that God justifies one who relieves suffering, even if it is “work” as later defined'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'It becomes clear from all of them that God justifies a person who finds a way to relieve suffering, even if it means that a person engages in “work” as it comes to be defined.'
  - where: 'note 14:2 “The man with the dropsy”'
    claim: 'Dropsy is most likely edema'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'dropsy: This condition is most likely edema, an excess of fluids in the body.'
  - where: 'note 14:2 “The man with the dropsy”'
    claim: 'At a triclinium table the man would stand inside the U and face Jesus; whether he was a guest is unclear'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'If Jesus is reclining at a triclinium table, as is the custom, the “man” evidently stands within the U-shaped table and faces Jesus across the table. Whether the man is among the invited guests remains unclear.'
  - where: 'note 14:2 “The man with the dropsy”'
    claim: 'The man may have come hoping for a blessing, or been placed there to tempt Jesus to heal on the Sabbath'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'he may have come with the hope of receiving a blessing, or possibly his presence had been planned by the host or others as a means of tempting Jesus to work a miracle on the holy day.'
  - where: 'note 14:2 “The man with the dropsy”'
    claim: '“Answering” when no one has spoken: either He answers the guests’ ploy or their thoughts'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'We conclude, therefore, that either the suffering man is a plant and Jesus is answering the guests’ act of trying to get him to break custom, or he is answering the guests’ thoughts.'
  - where: 'note 14:2 “The man with the dropsy”'
    claim: '“Took” means took hold of; the JST reads “he took the man”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'At base, it means “to take hold of” and thus conveys the image of Jesus holding the man as he heals him, that is, putting his hands on or wrapping his arms around the man.'
  - where: 'note 14:5 “An ass, or a son?”'
    claim: 'The earliest manuscripts, P45 and P75, read “a son or an ox”; later Jewish law did not specifically allow such a rescue'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'The earliest texts, P45 and P75, and other manuscripts read “a son or an ox,” a line which offers a more striking contrast in Jesus’ words. Later Jewish law does not specifically allow such a rescue operation as Jesus notes'
  - where: 'note 14:5 “An ass, or a son?”'
    claim: 'The SBL edition prints “son” (huios) where the Textus Receptus has “ass” (onos)'
    key: greek-nt
    url: 'https://biblehub.com/texts/luke/14-5.htm'
    quote: 'SBL Greek New Testament 2010 καὶ πρὸς αὐτοὺς εἶπεν· Τίνος ὑμῶν υἱὸς ἢ βοῦς εἰς φρέαρ πεσεῖται'
  - where: 'note 14:7 “The chief rooms”'
    claim: 'The most honored guests were seated closest to the head of the table'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'According to custom, the most honored guests were seated closest to the head of the table.'
  - where: 'note 14:7 “The chief rooms”'
    claim: 'The chief rooms are the places beside the host (Prov. 25:6–7); the lowest is farthest from him; guests recline'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'chief rooms: Jesus’ reference is to the places of honor at a meal, places adjacent to the host (see 20:46; Prov. 25:6–7).'
  - where: 'note 14:7 “The chief rooms”'
    claim: 'The JST says Jesus knew how they chose the chief rooms and exalted themselves one above another'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'According to an adjustment in the Joseph Smith Translation, Jesus is already well aware of how guests behave at dinner parties: “for he knew how they chose out the chief rooms and exalted themselves one above another” (JST 14:7).'
  - where: 'note 14:7 “The chief rooms”'
    claim: 'The guest of honor typically arrives last'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'Either he is not the guest of honor, who typically arrives last and is thereafter placed next to the host (see 14:8–9), or he arrives earlier than expected, which is more likely here.'
  - where: 'note 14:7 “The chief rooms”'
    claim: 'No sense that a person can feign humility to be moved up'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'We find no sense that a person can feign humility in order to receive an invitation to move up.'
  - where: 'note 14:11 “God does the exalting”'
    claim: 'The passive verbs mean God does the abasing and exalting'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'The passive voice of the verbs, “shall be abased” and “shall be exalted,” certifies that God will do the abasing and exalting'
  - where: 'note 14:11 “God does the exalting”'
    claim: 'The JST reads “honor of God” for “worship” in verse 10'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'The Joseph Smith Translation adjusts the term worship in a most interesting way, substituting the phrase “honor of God” (JST 14:10). The phrase seems to link honor among one’s acquaintances and honor from God'
  - where: 'note 14:11 “God does the exalting”'
    claim: 'The Risen Savior quotes 14:11 in D&C 101:42, introducing a parable'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'The fact that the Risen Savior later chooses to quote verse 14:11 to a modern audience, and also repeats it to introduce a parable, as he does in this chapter, underscores the significance of what Luke preserves for us (see D&C 101:42–43).'
  - where: 'note 14:11 “God does the exalting”'
    claim: 'D&C 101:42 repeats the saying'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng'
    quote: 'He that exalteth himself shall be abased, and he that abaseth himself shall be exalted.'
  - where: 'note 14:14 “The resurrection of the just”'
    claim: 'Pharisees believed in the resurrection; “of the just” narrows it to those who do justly by Jesus’ standards, including welcoming the poor; the passive points to God'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'Jesus’ pointer to the resurrection in the home of a Pharisee carries its own appeal because Pharisees believe in the resurrection. But by calling it “the resurrection of the just,” Jesus adds a qualifier that embraces only those who do justly by his standards'
  - where: 'note 14:14 “The resurrection of the just”'
    claim: 'The list matches Isaiah’s fast (Isa. 58:7)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'In his concern, Jesus lines up precisely with Isaiah’s words about a proper fast: “Is it not to deal thy bread to the hungry, and that thou bring the poor that are cast out to thy house?” (Isa. 58:7).'
  - where: 'note 14:14 “The resurrection of the just”'
    claim: 'The reward does not lie in a return invitation'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'The real payoff, as he affirms, does not lie in “a recompense” or a complementing invitation from a guest but comes “at the resurrection of the just” (14:14)'
  - where: 'note 14:15 “Bread in the kingdom of God”'
    claim: 'The guest’s remark alludes to the great festival of the Messianic age in Jewish tradition, and tried to relieve the embarrassment of a reproof'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'This bit of wholesome advice was construed as a reproof; and some one attempted to relieve the embarrassing situation by exclaiming: “Blessed is he that shall eat bread in the kingdom of God.” The remark was an allusion to the great festival, which according to Jewish traditionalism was to be a feature of signal importance in the Messianic dispensation.'
  - where: 'note 14:15 “Bread in the kingdom of God”'
    claim: 'The man seems to respond critically to the invitation of the poor, assuming the kingdom will not include them'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'The man apparently holds the view that entering “the kingdom of God” will winnow out the unworthy and thus will not include “the poor, and the maimed, and the halt” who, in contrast, will be included in Jesus’ kingdom'
  - where: 'note 14:18 “The excuses”'
    claim: 'A second notice on the day of the feast was the custom; the guests’ affairs were not sinful, but to annul an accepted engagement was an insult'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'The matters that engaged the time and attention of those who had been bidden, or as we would say, invited, to the feast, were not of themselves discreditable, far less sinful; but to arbitrarily allow personal affairs to annul an honorable engagement once accepted was to manifest discourtesy'
  - where: 'note 14:18 “The excuses”'
    claim: 'Plainly none of them wanted to come; each could have waited'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'he who had just purchased cattle could have waited a day to try them under the yoke; and the newly married man could have left his bride and his friends for the period of the supper that he had promised to attend. Plainly none of these people wanted to be present.'
  - where: 'note 14:18 “The excuses”'
    claim: 'The excuses resemble the exemptions from military service in Deut. 20:5–7, lawful under Moses but not in His kingdom'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'It may be significant that the reasons or excuses of the invited guests match rather closely the reasons for excusing a man from military service. Such reasons include a recently built home, a freshly planted vineyard, and his betrothal to a wife (see Deut. 20:5–7).'
  - where: 'note 14:18 “The excuses”'
    claim: 'Even though justifiable under the law of Moses, in His kingdom they will not be'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'But Jesus seems to be saying that, even though the excuses enumerated in the story are justifiable under the law of Moses, in his kingdom they will not be.'
  - where: 'note 14:21 “The supper of the Lord”'
    claim: 'The master gladly accepts the disfavored of society (D&C 58:11)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'Plainly, the master in the story gladly accepts into his company the disfavored people of society (see D&C 58:11).'
  - where: 'note 14:21 “The supper of the Lord”'
    claim: 'D&C 58: a supper of the house of the Lord to which all nations are invited; first the rich and learned; then the poor, lame, blind and deaf'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/58?lang=eng'
    quote: 'Yea, a supper of the house of the Lord, well prepared, unto which all nations shall be invited. First, the rich and the learned, the wise and the noble;'
  - where: 'note 14:23 “Compel them to come in”'
    claim: 'The verb means to constrain by force or by persuasion and entreaty; Luke 14:23 is listed'
    key: thayer
    url: 'https://biblehub.com/greek/315.htm'
    quote: 'to necessitate, compel, drive to, constrain, whether by force, threats, etc., or by persuasion, entreaties, etc., or by other means: τινα, 2 Corinthians 12:11 (by your behavior toward me)'
  - where: 'note 14:23 “Compel them to come in”'
    claim: 'Here the verb means urging strongly, not force'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'Although the verb (Greek anangkazō) frequently carries the sense of “to force,” here the meaning has to do with “urging strongly.”'
  - where: 'note 14:23 “Compel them to come in”'
    claim: 'Talmage’s explication: Israel the invited guests; the Gentiles the poor and maimed; the pagans beyond the walls, persuaded that they really were bidden'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'These, surprised at the unexpected summons, would hesitate, until by gentle urging and effective assurance that they were really included among the bidden guests, they would feel themselves constrained or compelled to come.'
  - where: 'note 14:23 “Compel them to come in”'
    claim: 'Talmage: Israel were the invited guests, the Messenger sent by the Father was in their midst; the invitation then carried to the Gentiles'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'The covenant people, Israel, were the specially invited guests. They had been bidden long enough aforetime, and by their own profession as the Lord’s own had agreed to be partakers of the feast.'
  - where: 'note 14:23 “Compel them to come in”'
    claim: 'Talmage: the Gentiles were looked upon as spiritually poor, maimed, halt and blind'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'Then the gladsome invitation was to be carried to the Gentiles, who were looked upon as spiritually poor, maimed, halt, and blind. And later, even the pagans beyond the walls, strangers in the gates of the holy city, would be bidden to the supper.'
  - where: 'note 14:23 “Compel them to come in”'
    claim: 'Brown: highways and hedges are outside the city, pointing to those outside the Jewish community'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'Jesus’ words point to areas outside the city, and hence potentially to people of mixed background, whereas those in 14:21 obviously come from areas within the town. On a metaphorical level, he is evidently pointing to those outside the Jewish community.'
  - where: 'note 14:26 “Hate not his father”'
    claim: 'Jesus speaks by hyperbole; “hate” means turning against whatever distracts from one’s primary loyalties'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'Here the Savior seems to take up his topic by hyperbole, that is, by overstating the case so that his point will be clear and memorable. Further, here the verb “to hate” (Greek miseō) has to do chiefly with turning against whatever distracts a person from his or her primary loyalties'
  - where: 'note 14:26 “Hate not his father”'
    claim: 'Jesus is not souring family ties; within a consecrated life family ties become stronger'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'In essence, Jesus is not souring family ties but simply framing the question whether those links should stand on more enduring ground than a person’s links to him.'
  - where: 'note 14:26 “Hate not his father”'
    claim: 'JST adds “or husband,” aiming the saying also at married women'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'Immediately at the end of this listing, the Joseph Smith Translation adds “or husband,” indicating that Jesus’ words are also, and substantially, aimed at married women'
  - where: 'note 14:26 “Hate not his father”'
    claim: 'JST Luke 14:26 reads “or husband” and “or in other words, is afraid to lay down his life for my sake”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/14?lang=eng'
    quote: 'or husband, yea and his own life also; or in other words, is afraid to lay down his life for my sake, he cannot be'
  - where: 'note 14:26 “Hate not his father”'
    claim: 'Thayer sets Luke 14:26 with Gen. 29:31 and others where “hate” has been read as loving less, and explains it as the strong idiom of love and hate where a cooler speech would say preference or disregard'
    key: thayer
    url: 'https://biblehub.com/greek/3404.htm'
    quote: 'Not a few interpreters have attributed to μισεῖν in Genesis 29:31 (cf. Genesis 29:30); Deuteronomy 21:15; Matthew 6:24; Luke 14:26; Luke 16:13; (John 12:25); Romans 9:13, the signification to love less, to postpone in love or esteem, to slight'
  - where: 'note 14:26 “Hate not his father”'
    claim: 'Thayer: Orientals feel and profess love and hate where others express only interest or indifference'
    key: thayer
    url: 'https://biblehub.com/greek/3404.htm'
    quote: 'the Orientals, in accordance with their greater excitability, are accustomed both to feel and to profess love and hate where we Occidentals, with our cooler temperament, feel and express nothing more than interest in, or disregard and indifference to a thing'
  - where: 'note 14:27 “Settle this in your hearts”'
    claim: 'JST Luke 14:27–28 adds “Wherefore, settle this in your hearts…”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/14?lang=eng'
    quote: 'Wherefore, settle this in your hearts, that ye will do the things which I shall teach, and command you.'
  - where: 'note 14:27 “Settle this in your hearts”'
    claim: 'The JST addition acknowledges the mental and emotional struggle of deciding to follow Him at all hazards'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'the Joseph Smith Translation adds words of Jesus that acknowledge the mental and emotional struggles that people will face both during and after they make the decision to follow the Savior at all hazards'
  - where: 'note 14:27 “Settle this in your hearts”'
    claim: 'Bearing the cross alluded to the condemned man carrying the crosspiece and to Jesus’ own death'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'Jesus’ allusions point, first, to the practice of a condemned person carrying the crosspiece on which he will be hung and, second, to his own death'
  - where: 'note 14:27 “Settle this in your hearts”'
    claim: 'Elder Gibbons on “settle this”: blessings come only from complete yielding of the heart to God'
    key: gibbons-settle-hearts
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2006/10/wherefore-settle-this-in-your-hearts?lang=eng'
    quote: 'I love that phrase “settle this.” Brothers and sisters, I pray that we are “settled.” There are precious blessings that come only from the complete yielding of one’s heart to God.'
  - where: 'note 14:28 “A tower and a war”'
    claim: 'The word “finish” appears three times; the emphasis is on meeting the requirements, not only anticipating them'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'While we often focus on the concept of “counting the cost” in this analogy, the Savior’s emphasis was not just on anticipating the requirements but also on meeting them. In fact, the word finish appears three times in the analogy.'
  - where: 'note 14:28 “A tower and a war”'
    claim: 'The tower is likely a private, costly, tower-like house of several stories'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'The word seems to point to a tower-like home of several stories.'
  - where: 'note 14:28 “A tower and a war”'
    claim: 'JST Luke 14:31: “signifying there should not any man follow him, unless he was able to continue”'
