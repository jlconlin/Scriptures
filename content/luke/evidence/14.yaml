    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/10?lang=eng'
    quote: 'He that loveth father or mother more than me is not worthy of me'
  - where: 'note 14:35 “Not even for the dunghill”'
    claim: 'Salt had a humbler use: mixed with the dunghill, it manured the ground and prepared it for seed'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/14.htm'
    quote: 'The use is obviously a lower and humbler one than the others. The salt serves, mingling with the dung-hill, to manure and prepare the ground for the reception of the seed.'
  - where: 'note 14:35 “Not even for the dunghill”'
    claim: 'Nothing stronger than salt can restore its pungency; spoiled salt is fit only for paths; the image is of the peril of falling away'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/14.htm'
    quote: 'There is nothing stronger than salt which can restore to it its lost pungency. Hence, if it have been spoilt by rain or exposure, it is only fit to be used for paths. The peril of backsliding, the worthlessness of the state produced by apostasy'
  - where: 'note 14:35 “Not even for the dunghill”'
