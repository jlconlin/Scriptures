    quote: 'The individual brings up the messianic banquet wherein the Messiah will host the righteous. Jesus himself refers to this event elsewhere (see the Notes on 4:3; 12:37; 13:28; 22:16–18, 30'
  - where: 'note 14:18 “The excuses”'
