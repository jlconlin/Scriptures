    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/14?lang=eng'
    quote: 'And this he said, signifying there should not any man follow him, unless he was able to continue; saying,'
  - where: 'note 14:28 “A tower and a war”'
    claim: 'Peter and his partners responded at once; others must reflect before committing'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'For some of Jesus’ followers, such as Peter and his partners, the response to Jesus’ call is instantaneous and complete, even though they do not know all the outcomes (see 5:10–11).'
  - where: 'note 14:28 “A tower and a war”'
    claim: 'The king facing an army must decide in time; the choice cannot wait long'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'the story about the king confronting an enemy army that far outnumbers his own, and the almost immediate need to resolve the conflict, bring forward the necessity of making a decision about discipleship in proper time'
  - where: 'note 14:28 “A tower and a war”'
