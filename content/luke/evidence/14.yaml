    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'If so, Jesus shows his concern by rising from his place at the table and coming around to meet the man who stands across the table from him (see the Note on 14:2). The Joseph Smith Translation strengthens this scenario by changing the expression to “he took the man” (JST 14:4).'
  - where: 'note 14:7 “The chief rooms”'
