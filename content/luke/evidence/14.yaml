    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/29?lang=eng'
    quote: 'And when the Lord saw that Leah was hated, he opened her womb: but Rachel was barren.'
  - where: 'note 14:26 “Hate not his father”'
    claim: 'Matt. 10:37 gives the saying as loving more'
