  # ---- rows added in the repair of 2026-11-22
  - where: 'note 14:1 “They watched him”'
    claim: 'The verb means to watch closely, in a bad sense to watch insidiously to see what someone will do; Thayer lists Luke 6:7, 14:1 and 20:20'
    key: thayer
    url: 'https://biblehub.com/greek/3906.htm'
    quote: 'τινα, one, to see what he is going to do (Xenophon, mem. 3, 14, 4); contextually in a bad sense, to watch insidiously, Luke 20:20'
  - where: 'note 14:1 “They watched him”'
    claim: 'The Greek is emphatic, they themselves were carefully watching; the invitation was more a plot than those of 7:36 and 11:37, part of the watching of 11:53–54 and 20:20'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/14.htm'
    quote: 'More emphatically in the original ‘and they themselves were carefully watching Him,’ comp. Luke 6:7. The invitation in fact even more than those in Luke 7:36, Luke 11:37 was a mere plot;—part of that elaborate espionage, and malignant heresy-hunting (Luke 11:53-54, Luke 20:20; Mark 12:13)'
  - where: 'note 14:5 “An ass, or a son?”'
    claim: 'Many of the best manuscripts read “son”; the familiar pairing of ox and ass (Ex. 20:17) would lead a copyist to write “ass” for “son,” and nothing would tempt a change the other way; the thought is that of Luke 13:15'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/14.htm'
    quote: 'Many of the best MSS., however, read, “Which of you shall have a son, or an ox . . .?” and, on the whole, this reading seems likely to be the true one. The familiar combination of the ox and the ass would naturally lead a transcriber to substitute ῠνος (ass) for ὑιός (son). There would be nothing to tempt any one to a change in the opposite direction.'
  - where: 'note 14:5 “An ass, or a son?”'
    claim: 'The line of thought is that of Luke 13:15; Ex. 20:17 pairs the ox and the ass'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/14.htm'
    quote: 'The line of thought is all but identical with that of Luke 13:15. Here, as there, the outward features of Jewish life are the same as they had been in Exodus 20:17, and Isaiah 1:3.'
  - where: 'note 14:5 “An ass, or a son?”'
    claim: 'The manuscripts read “a son or an ox,” which may be taken as “a son, nay even an ox”'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/14.htm'
    quote: 'The unquestionable reading if we are to follow the MSS. is ‘a son or an ox.’ The strangeness of the collocation (which however may be taken to imply ‘a son—nay even an ox’)'
  - where: 'note 14:11 “God does the exalting”'
    claim: 'The parable teaches that real honor is bestowed by another, not taken'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'This parable illustrates the idea that “real honor will come not from one’s self-seeking choices, but from what is bestowed on one by another.” … In contrast to the other guests, Jesus sought only the honor of God, and he did so with profound humility.'
  - where: 'note 14:11 “God does the exalting”'
    claim: 'Peter’s words in 1 Peter 5:5 echo this saying and show the impression it made on the disciples'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/14.htm'
    quote: 'The reproduction of the teaching in words which are almost an echo of these, in 1Peter 5:5, is interesting as showing the impression which it had made on the minds of the disciples.'
  - where: 'note 14:11 “God does the exalting”'
    claim: '1 Peter 5:5–6 names God as the one who exalts the humble'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-pet/5?lang=eng'
    quote: 'Humble yourselves therefore under the mighty hand of God, that he may exalt you in due time:'
  - where: 'note 14:11 “God does the exalting”'
    claim: 'The footnote to D&C 101:42 points back to Luke 14:11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng'
    quote: '“exalteth”: Obad. 1:3 (3–4); Luke 14:11; 2 Ne. 20:33; Hel. 4:12 (12–13).'
  - where: 'note 14:14 “The resurrection of the just”'
    claim: 'The friends and kin named were the guests present; a hospitality rewarded on earth was excluded from the reward of the resurrection of the just'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/14.htm'
    quote: 'The words were clearly chosen as including the classes of guests who were then present. Our Lord saw in that Sabbath feast nothing but an ostentatious hospitality, calculating on a return in kind. … The very fact that it met with its reward on earth excluded it, almost ipso facto, from the reward of the resurrection of the just.'
  - where: 'note 14:14 “The resurrection of the just”'
    claim: 'Jesus here accepted the Pharisees’ fundamental doctrine, as Paul did in Acts 23:6'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/14.htm'
    quote: 'On this point our Lord, while rebuking the pride and hypocrisy of the Pharisees, accepted the fundamental doctrine of their system, and so furnished a precedent for St. Paul’s conduct in Acts 23:6.'
  - where: 'note 14:14 “The resurrection of the just”'
    claim: 'The Pharisees confessed the resurrection, the Sadducees denied it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/23?lang=eng'
    quote: 'For the Sadducees say that there is no resurrection, neither angel, nor spirit: but the Pharisees confess both.'
  - where: 'note 14:14 “The resurrection of the just”'
    claim: 'The phrase possibly refers to a twofold resurrection (Luke 20:35; 1 Cor. 15:23)'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/14.htm'
    quote: 'By the phrase “the resurrection of the just,” our Lord possibly referred to the twofold resurrection, Luke 20:35; 1 Corinthians 15:23; 1 Thessalonians 4:16, &c. But the allusion may be more general, Acts 24:15.'
  - where: 'note 14:14 “The resurrection of the just”'
    claim: 'D&C 76:17: those who have done good come forth in the resurrection of the just'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/76?lang=eng'
    quote: 'And shall come forth; they who have done good, in the resurrection of the just; and they who have done evil, in the resurrection of the unjust.'
  - where: 'note 14:14 “The resurrection of the just”'
    claim: 'D&C 76:64–65: the first resurrection is the resurrection of the just'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/76?lang=eng'
    quote: 'These are they who shall have part in the first resurrection.'
  - where: 'note 14:14 “The resurrection of the just”'
    claim: 'The righteous come forth first, in the First Resurrection'
    key: bd-resurrection
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/resurrection?lang=eng'
    quote: 'Christ was first; the righteous have precedence over the wicked and come forth in the First Resurrection, whereas the unrepentant sinners come forth in the last resurrection (Rev. 20:5–13).'
  - where: 'note 14:21 “The supper of the Lord”'
    claim: 'The master’s command would have reminded the hearers of the counsel Jesus had given a few minutes before about whom a rich man should invite'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'His command to bring in the poor and the maimed, the halt and the blind from the city streets must have appealed to those who listened to our Lord’s recital as reminiscence of His counsel given a few minutes before, concerning the kind of guests a rich man could invite with profit to his soul.'
  - where: 'note 14:21 “The supper of the Lord”'
    claim: 'The footnote to D&C 58:11 points to the parable of Luke 14:16–24'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/58?lang=eng'
    quote: '“supper”: Luke 14:16 (16–24).'
  - where: 'note 14:26 “Hate not his father”'
    claim: 'Literal hatred of family is not a condition of discipleship; the precept is the preeminence of duty toward God over family claims'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'Literal hatred toward one’s family was not specified as a condition of discipleship; indeed a man who indulges hatred or any other evil passion is a subject for repentance and reformation. The preeminence of duty toward God over personal or family demands on the part of one who had assumed the obligations of a disciple was the precept.'
  - where: 'note 14:26 “Hate not his father”'
    claim: '“Hate not” can convey “love less” (compare Matt. 10:37)'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'The term “hate not” in Luke 14:26 is translated from a word that can also convey the sense of “love less” (compare Matthew 10:37).'
  - where: 'note 14:26 “Hate not his father”'
    claim: 'Disciples must put family and even their own life in subordination to discipleship'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'Thus, Jesus informed those who followed him that they must be willing “to put parents, family, relatives, even one’s own life, in subordination to discipleship.”'
  - where: 'note 14:26 “Hate not his father”'
    claim: '“Hate” is hate by comparison: when the nearest ties become obstacles to coming to Christ they must give way; Jesus stated principles in their boldest form so they would be impressed on the heart; “his own life also” further explains the word'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/14.htm'
    quote: 'when our nearest and dearest relationships prove to be positive obstacles in coming to Christ, then all natural affections must be flung aside … A reference to Matthew 10:37 will shew that ‘hate’ means hate by comparison. Our Lord purposely stated great principles in their boldest and even most paradoxical form'
  - where: 'note 14:26 “Hate not his father”'
    claim: '“His own life also” further explains the meaning of “hate”'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/14.htm'
    quote: 'yea, and his own life also] This further explains the meaning of the word ‘hate.’'
