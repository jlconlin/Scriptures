    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'The sweeping character of Jesus’ declaration lies in the literal meaning of this expression: “all his goods” or “all his property,”'
  - where: 'note 14:34 “Ye know not Moses”'
    claim: 'JST Luke 14:35–37 text'
    key: jst-luke-14
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/14?lang=eng'
    quote: 'Ye know not Moses, neither the prophets; for if ye had known them, ye would have believed on me; for to this intent they were written. For I am sent that ye might have life. Therefore I will liken it unto salt which is good;'
  - where: 'note 14:34 “Ye know not Moses”'
    claim: 'The JST’s questioners ask whether those who live by Moses and the prophets shall have life'
    key: jst-luke-14
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/14?lang=eng'
    quote: 'Then certain of them came to him, saying, Good Master, we have Moses and the prophets, and whosoever shall live by them, shall he not have life?'
  - where: 'note 14:34 “Ye know not Moses”'
    claim: 'The JST addition bridges the sayings on discipleship and on salt; “Moses and the prophets” is Luke’s own phrase'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'The addition bridges deftly between Jesus’ specifics about discipleship and those about salt.'
  - where: 'note 14:34 “Ye know not Moses”'
    claim: 'The portrait of the Old Testament as “Moses and the prophets” arises only in Luke, consistent with Luke’s style'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'The portrait of the Old Testament as “Moses and the prophets” arises only in Luke (see 16:29; 24:27; also Acts 26:22), making this JST addition consistent with Luke’s style.'
  - where: 'note 14:35 “Not even for the dunghill”'
    claim: 'Salt in proper portions fertilizes; too much renders ground sterile (Judg. 9:45)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'Salt, in proper portions and when sown onto the beds of certain plants, can act as a fertilizing agent and thus aids the growth and life of the plants.'
  - where: 'note 14:35 “Not even for the dunghill”'
    claim: 'Salt was apparently scattered on manure piles as fertilizer; known from Egypt, otherwise undocumented in Palestine'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'Jesus’ words capture an apparently common but otherwise undocumented practice—at least in Palestine, though it is known from Egypt—of scattering salt on manure piles as an aid to fertilizing'
  - where: 'note 14:35 “Not even for the dunghill”'
    claim: 'Many who declare themselves disciples will abandon their commitment because of the cost; they are as salt that has lost its savour'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'Jesus’ words expect that many will declare themselves as his disciples and then will abandon their commitment, or covenant, because of the high cost. Such persons are therefore as “salt [that] have lost his savour”'
  - where: 'note 14:35 “Not even for the dunghill”'
    claim: 'D&C 103:9–10 applies the image to Saints who are not saviors of men'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/103?lang=eng'
    quote: 'And inasmuch as they are not the saviors of men, they are as salt that has lost its savor, and is thenceforth good for nothing but to be cast out and trodden under foot of men.'
