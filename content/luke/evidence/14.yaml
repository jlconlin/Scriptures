    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-14-104'
    quote: 'As becomes clear from later rabbinic law, because Jesus’ actions do not intervene in a case that needs immediate or extraordinary attention, their legality is questionable.'
  - where: 'note 14:2 “The man with the dropsy”'
    claim: 'Jesus rises and comes around the table to the man'
