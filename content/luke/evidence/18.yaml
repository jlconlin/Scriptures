    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'it seems that the man is draping his words in flattery, effectively “cheapening a word that strictly applied only to God,”'
