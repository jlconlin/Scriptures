chapter: 18
claims:
  # ---- when, setting, thread
  - where: when
    claim: 'The chapter ends as Jesus nears Jericho'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/18?lang=eng'
    quote: 'And it came to pass, that as he was come nigh unto Jericho, a certain blind man sat by the way side begging'
  - where: when
    claim: 'The chapter’s events fall in the Perean and Judean ministry'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'Chapter 27: Continuation of the Perean and Judean Ministry'
  - where: setting
    claim: 'Luke’s journey is not a linear route but a journey of discipleship; he names Jerusalem along the way, including 18:31'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'he explicitly mentions the holy city numerous times during the trek (see Luke 9:53; 13:22, 34; 17:11; 18:31; 19:11). While Luke frequently reminds his readers of the ultimate destination of this journey, he does not depict the Savior traveling a direct linear course'
  - where: setting
    claim: 'Luke’s travel account is a journey of discipleship in which Jesus marks the path by word and deed'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'His account presents a journey of discipleship in which Jesus Christ marks the path by both word and deed.'
  - where: setting
    claim: 'Jericho is the journey’s last stop'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'Jesus’ journey from Galilee to Jerusalem involves one last stop, in Jericho, the town that he and his entourage are approaching. Luke identifies this town alone throughout the whole itinerary'
  - where: setting
    claim: 'The parable of the unjust judge answers the teaching on the end-time that begins with the Pharisees’ question at 17:20'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'the parable of the unjust judge forms the other side of the valley, opposite the side where we enter as Jesus responds to the question of the Pharisees about the coming of the kingdom of God, the one completing the other (see 17:20).'
  - where: setting
    claim: 'At the children, Luke’s narrative rejoins Matthew’s and Mark’s'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'At the opening of this story, Luke’s narrative rejoins that of Matthew and Mark'
  - where: thread
    claim: 'The chapter is a path into the kingdom (language of entry at 18:17, 25): prayer, humility, becoming as a child, giving up possessions, understanding His mission, seeing; the unifying road is discipleship'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'The language of entry stands in 18:17 and 18:25 … we enter the kingdom by pursuing pathways of prayer … of humility … of becoming as a child … of a willingness to give up all earthly possessions … of coming to understand Jesus’ true mission … and of seeing as we should see'
  - where: thread
    claim: 'The infants are powerless and dependent, the ruler able and influential'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'The contrast lies between a fully able person, whose life to this point illustrates his or her ability to make and follow through on decisions, and powerless infants, who are completely dependent on others.'
  - where: thread
    claim: 'The healed blind man follows Jesus glorifying God, as a disciple should'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'After the miracle that restores his sight, the man “followed him [Jesus], glorifying God,” just as a disciple should (18:43).'

  # ---- sections
  - where: section 1 plain
    claim: '“Avenge me” rendered as a plea for justice in a legal case'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'over time it comes to refer to a judicial process that involves deciding a legal case or bringing a person to judgment, the meaning in this passage.'
  - where: section 2 plain
    claim: '“With himself” rendered “by himself”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'The meaning of this prepositional phrase (Greek pros heauton) may mean that he stood by himself as he prayed'
  - where: section 2 plain
    claim: '“Possess” rendered “get”: the footnote glosses the Greek as acquire'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/18?lang=eng'
    quote: '12c “possess”: GR acquire, gain, or possess.'
  - where: section 3 plain
    claim: '“Infants” rendered “babies”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'The Greek noun brephos refers to a baby, and can also point to an unborn child.'

  # ---- notes
  - where: 'note 18:1 “Always to pray, and not to faint”'
    claim: 'ekkakeō: to fail in heart, faint, be weary'
    key: thayer
    url: 'https://biblehub.com/greek/1573.htm'
    quote: 'KJV: faint, be weary … 1. to be (bad or) weak … 2. (by implication) to fail (in heart)'
  - where: 'note 18:1 “Always to pray, and not to faint”'
    claim: 'One of the few parables introduced by a statement of its aim, 18:9 another'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/18.htm'
    quote: 'The latter of the two verbs is noticeable as being used in the New Testament by St. Luke and St. Paul only … The whole verse is remarkable as being one of the few instances (Luke 18:9 being another) in which a parable is introduced by a distinct statement as to its drift and aim.'
  - where: 'note 18:1 “Always to pray, and not to faint”'
    claim: 'Ellicott reads the cry day and night as looking to the coming trials of the elect, the world and its rulers against them'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/18.htm'
    quote: 'The words look to the coming trials and afflictions of the elect, which as yet the disciples knew not, or knew only in part. To see the world against them, and its rulers crushing them, to fight against overwhelming odds, this would tempt them to think that God was not with them'
  - where: 'note 18:1 “Always to pray, and not to faint”'
    claim: 'D&C 75:11, to elders sent to preach (footnote 1c)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/75?lang=eng'
    quote: 'Praying always that they faint not; and inasmuch as they do this, I will be with them even unto the end.'
  - where: 'note 18:2 “The parable given again in Missouri”'
    claim: 'D&C 101 given December 1833, after mobs had driven the Saints from Jackson County'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng'
    quote: 'Revelation given to Joseph Smith the Prophet, at Kirtland, Ohio, December 16 and 17, 1833. … Mobs had driven them from their homes in Jackson County'
  - where: 'note 18:2 “The parable given again in Missouri”'
    claim: 'The Lord likens the children of Zion to the parable, and quotes it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng'
    quote: 'Now, unto what shall I liken the children of Zion? I will liken them unto the parable of the woman and the unjust judge, for men ought always to pray and not to faint, which saith— There was in a city a judge which feared not God, neither regarded man.'
  - where: 'note 18:2 “The parable given again in Missouri”'
    claim: 'D&C 101:89'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng'
    quote: 'And if the president heed them not, then will the Lord arise and come forth out of his hiding place, and in his fury vex the nation;'
  - where: 'note 18:2 “The parable given again in Missouri”'
    claim: 'D&C 101:90: in his time He will cut off the unjust'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng'
    quote: 'And in his hot displeasure, and in his fierce anger, in his time, will cut off those wicked, unfaithful, and unjust stewards'
  - where: 'note 18:2 “The parable given again in Missouri”'
    claim: 'D&C 101:92: pray that their ears may be opened, that the Lord may be merciful to them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng'
    quote: 'Pray ye, therefore, that their ears may be opened unto your cries, that I may be merciful unto them, that these things may not come upon them.'
  - where: 'note 18:3 “Avenge me”'
    claim: 'ekdikeō: from vengeance to deciding a legal case; antidikos an opponent at law'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'The primary sense of the verb (Greek ekdikeō) has to do with vengeance. But over time it comes to refer to a judicial process that involves deciding a legal case or bringing a person to judgment, the meaning in this passage.'
  - where: 'note 18:3 “Avenge me”'
    claim: 'Adversary: opponent in a legal case; “came” imperfect, repeated'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'The simple sense of the term (Greek antidikos) has to do with an opponent in a legal case.'
  - where: 'note 18:3 “Avenge me”'
    claim: 'The imperfect of “came”: she comes again and again'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'The tense of the verb is imperfect, thus representing repeated action. The sense is that she comes to the judge again and again.'
  - where: 'note 18:3 “Avenge me”'
    claim: 'Whether the judge is a gentile or a Jew is debated and cannot be fully resolved'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'A debate goes on whether the person is a gentile judge8 or an unbelieving Jew.9 On the basis of what little Jesus says about the judge, the question cannot be fully resolved.'
  - where: 'note 18:3 “Avenge me”'
    claim: 'Widows had legal rights in the law, apparently pointing to a Jewish judge'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'the introduction of a widow into the parable apparently leads us to a Jewish judge because widows are guaranteed legal rights by strong language in the Old Testament (see Ex. 22:22–24; Deut. 24:17–18'
  - where: 'note 18:3 “Avenge me”'
    claim: 'The widow represents the most vulnerable, least noticed'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'She represents the most vulnerable, the least noticed persons in her society'
  - where: 'note 18:3 “Avenge me”'
    claim: 'Jesus does not give the reason for the delay; perhaps a wealthy, formidable opponent'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'Jesus does not specify the reason for the delay. … perhaps because the widow’s opponent is wealthy and formidable.'
  - where: 'note 18:3 “Avenge me”'
    claim: 'She has no sounder reasons; she simply persists'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'Does she have more sound reasons that favor her? Evidently not. She simply persists “by her continual coming.”'
  - where: 'note 18:3 “Avenge me”'
    claim: 'The judge’s reluctance may have been partly the difficulty of the case'
    key: sc-knowhy-662
    url: 'https://scripturecentral.org/knowhy/what-do-the-parables-of-the-importuning-friend-and-widow-teach-us-about-prayer'
    quote: 'the judge’s initial reluctance may have been partially due to the difficulty of the case, as laws regarding widows could be complex and potentially would “have involved many people, technical rules, and contested claims.”'
  - where: 'note 18:5 “She will wear me out”'
    claim: 'hypōpiazō: beat black and blue; Paul buffeting his body like a boxer (1 Cor. 9:27); metaphorically wear one out by entreaties, Luke 18:5'
    key: thayer
    url: 'https://biblehub.com/greek/5299.htm'
    quote: 'properly, to beat black and blue … like a boxer I buffet my body … 1 Corinthians 9:27; metaphorically … to give one intolerable annoyance (`beat one out'', ''wear one out''), by entreaties … Luke 18:5'
  - where: 'note 18:5 “She will wear me out”'
    claim: 'The pugilist’s blow that leaves a livid bruise, passed into common speech; a continuous shower of blows until the man gives in at any price'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/18.htm'
    quote: 'Literally, however, it expresses the act of the pugilist when he strikes a blow which leaves a livid bruise on his opponent’s face, and it would seem to have been transferred … from the arena to common life. … What is described here is the continuous shower of blows, each of which is short of a “knock-down,”'
  - where: 'note 18:5 “She will wear me out”'
    claim: '… so that he is glad to give over at any price'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/18.htm'
    quote: 'while their accumulative effect is, in the nearest equivalent of modern English, that the man is so “punished” that he is glad to give over at any price.'
  - where: 'note 18:6 “The Lord and the unjust judge”'
    claim: 'Jesus does not compare the judge to God; if a mortal will do good, God will do more'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'Plainly, Jesus does not intend to compare the judge, whom he later calls “unjust” (18:6), to God. Rather, the sense is that if a mortal person will do good, God will do all the more (see 6:31–34; 11:11–13).'
  - where: 'note 18:6 “The Lord and the unjust judge”'
    claim: 'The friend and the judge act out of self-interest; contrasted with the Father’s love and mercy in answering prayer'
    key: sc-knowhy-662
    url: 'https://scripturecentral.org/knowhy/what-do-the-parables-of-the-importuning-friend-and-widow-teach-us-about-prayer'
    quote: 'In both parables, the friend and the judge act mostly out of self-interest in hopes that the petitioner will stop bothering them at inconvenient times. Contrasted to these individuals … is the love and mercy of our Heavenly Father as He will respond to our sincere and earnest petitions'
  - where: 'note 18:6 “The Lord and the unjust judge”'
    claim: '“The Lord” (kyrios) virtually equates Jesus with Jehovah; His application carries divine authority'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'The title comes from Luke or his source (Greek kyrios) and, as in other cases, virtually equates Jesus with Jehovah … Thus, Jesus’ words of application for the parable, beginning here, carry divine authority.'
  - where: 'note 18:6 “The Lord and the unjust judge”'
    claim: 'Jesus twists the judge’s self-serving compliment into a charge'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'In the story, the judge’s self-evaluation is, “I fear not God, nor regard man” (18:4). But Jesus twists this self-serving compliment, hinting openly that the judge participates in the corruption of the world.'
  - where: 'note 18:8 “Will He find faith?”'
    claim: 'JST Luke 18:8 (footnote 8a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/18?lang=eng'
    quote: 'JST Luke 18:8 I tell you that he will come, and when he does come, he will avenge his saints speedily.'
  - where: 'note 18:8 “Will He find faith?”'
    claim: 'JST Luke 18:7 changes “them” at the end of the verse to “men” (footnote 7b)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/18?lang=eng'
    quote: '“them”: JST Luke 18:7 … men?'
  - where: 'note 18:8 “Will He find faith?”'
    claim: 'Peter’s teaching on the Lord’s long-suffering answers the cry of the elect'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/18.htm'
    quote: 'In St. Peter’s insistence on the “long-suffering” of God (2Peter 3:9), we have a proof that he had learnt the answer.'
  - where: 'note 18:8 “Will He find faith?”'
    claim: '2 Pet. 3:9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/2-pet/3?lang=eng'
    quote: 'The Lord is not slack concerning his promise, as some men count slackness; but is longsuffering to us-ward, not willing that any should perish, but that all should come to repentance.'
  - where: 'note 18:8 “Will He find faith?”'
    claim: 'The question implies that faith will be scarce when He comes'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/18.htm'
    quote: 'The question implies, it is obvious, an answer in the negative. When St. Luke wrote his Gospel, men were witnessing a primary, though partial, fulfilment of the prophecy. Iniquity was abounding, and the love of many was waxing cold. … so shall it be in that Advent itself.'
  - where: 'note 18:8 “Will He find faith?”'
    claim: 'An Apostle’s hope (“perhaps”): He will find faith among those who take His name'
    key: wirthlin-find-faith-2002
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2002/10/shall-he-find-faith-on-the-earth?lang=eng'
    quote: 'Perhaps as members of the Church trust with all their hearts, transform their hopes and beliefs into action, and seek to align themselves with the will of the Lord, the answer … will be a resounding “Yes, He will find faith. He will find faith among those who take upon themselves His name.'
  - where: 'note 18:9 “Pharisees and publicans”'
    claim: 'Pharisees: “separatists”; pride in strict observance; avoided things gentile; tendency to self-sufficiency and spiritual pride'
    key: bd-pharisees
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pharisees?lang=eng'
    quote: 'The name denotes separatists. They prided themselves on their strict observance of the law and on the care with which they avoided contact with things gentile. … to encourage self-sufficiency and spiritual pride.'
  - where: 'note 18:9 “Pharisees and publicans”'
    claim: 'The two religious extremes of Jewish society'
    key: hunter-pharisee-publican
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1984/04/the-pharisee-and-the-publican?lang=eng'
    quote: 'It is interesting that the Master selected a Pharisee and a publican as the actors in the story, representing the two religious extremes in Jewish society.'
  - where: 'note 18:9 “Pharisees and publicans”'
    claim: 'Publicans regarded like thieves and robbers; collectors for Rome seen as traitors to a foreign conqueror'
    key: hunter-pharisee-publican
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1984/04/the-pharisee-and-the-publican?lang=eng'
    quote: 'Their fellow countrymen had no higher regard for them than for thieves and robbers. … Jews who made such collections for the Romans were regarded as traitors and as despicable for selling their services to a foreign conqueror.'
  - where: 'note 18:9 “Pharisees and publicans”'
    claim: 'The parable was not intended for Pharisees or publicans expressly but for the self-righteous'
    key: hunter-pharisee-publican
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1984/04/the-pharisee-and-the-publican?lang=eng'
    quote: 'it was not intended for Pharisees or publicans expressly, but for the benefit of the self-righteous who lack the virtues of humility and who use self-righteousness as a claim to exaltation.'
  - where: 'note 18:11 “Prayed thus with himself”'
    claim: 'pros heauton may mean he stood by himself, apart from other worship'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'The meaning of this prepositional phrase (Greek pros heauton) may mean that he stood by himself as he prayed, perhaps separating himself from other worship activities.'
  - where: 'note 18:11 “Prayed thus with himself”'
    claim: 'Standing to pray in a place of worship was customary'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'Standing erect for prayer in a place of worship is customary'
  - where: 'note 18:11 “Prayed thus with himself”'
    claim: 'Both stood apart, for opposite reasons; the Pharisee asked nothing of God'
    key: hunter-pharisee-publican
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1984/04/the-pharisee-and-the-publican?lang=eng'
    quote: 'The Pharisee stood apart because he believed he was better than other men, whom he considered as common. The publican stood apart also, but it was because he felt himself unworthy. … The Pharisee asked nothing of God, but relied upon his own self-righteousness.'
  - where: 'note 18:11 “Prayed thus with himself”'
    claim: 'In form thanking God, his thoughts were on his own self-righteousness'
    key: hunter-pharisee-publican
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1984/04/the-pharisee-and-the-publican?lang=eng'
    quote: 'Though he was in form thanking God, his self-centered thoughts were on his own self-righteousness.'
  - where: 'note 18:11 “Prayed thus with himself”'
    claim: 'Day of Atonement the only fast ordered by the law; fasting a regular custom after the return (Luke 18:12)'
    key: bd-fasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/fasts?lang=eng'
    quote: 'The Day of Atonement appears to be the only fast ordered by the law. Other fasts were instituted during the exile (Zech. 7:3–5; 8:19); and after the return, fasting is shown to be a regular custom (Luke 5:33; 18:12).'
  - where: 'note 18:11 “Prayed thus with himself”'
    claim: 'Footnote 12c glosses “possess”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/18?lang=eng'
    quote: '12c “possess”: GR acquire, gain, or possess.'
  - where: 'note 18:11 “Prayed thus with himself”'
    claim: 'He pays a tenth of what he grows and of foods he purchases'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'The Pharisee seems to say that he pays a tenth not only of produce that he grows in his own garden but also of the foods that he purchases, illustrating the high standards of Pharisees'
  - where: 'note 18:11 “Prayed thus with himself”'
    claim: '“This publican”: the demonstrative likely derogatory'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'The demonstrative pronoun “this” likely carries a derogatory tone of voice'
  - where: 'note 18:13 “Be merciful to me, the sinner”'
    claim: 'hilaskomai: to render propitious, appease; passive aorist imperative “be propitious, be gracious, be merciful,” Luke 18:13'
    key: thayer
    url: 'https://biblehub.com/greek/2433.htm'
    quote: 'to render propitious to oneself, to appease, conciliate to oneself … In Biblical Greek used passively, to become propitious, be placated or appeased; in 1 aorist imperative ἱλάσθητι, be propitious, be gracious, be merciful'
  - where: 'note 18:13 “Be merciful to me, the sinner”'
    claim: '“The sinner,” a sinner without equal'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'The expression is “the sinner,” perhaps illustrating the man’s harsh judgment that he is a sinner without equal.'
  - where: 'note 18:13 “Be merciful to me, the sinner”'
    claim: 'Standing afar off seemingly in the Court of the Gentiles, drawing no attention'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'Jesus’ description seemingly puts him outside the restricted zone for Jews only, in the wide Court of the Gentiles, where his presence presumably does not draw undue attention from those who may know him.'
  - where: 'note 18:13 “Be merciful to me, the sinner”'
    claim: 'The publican felt the weight of his iniquities'
    key: hunter-pharisee-publican
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1984/04/the-pharisee-and-the-publican?lang=eng'
    quote: 'The tax collector standing afar off, feeling the weight of his iniquities pressing down upon him, and being conscious of his sins and unworthiness to stand before God'
  - where: 'note 18:13 “Be merciful to me, the sinner”'
    claim: 'The plea echoes Alma 36:18 and Alma 38:14'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'We hear echoes of the pleading by the blind man (see 18:38) and the plaintive cry of Alma: “O Jesus, thou Son of God, have mercy on me” (Alma 36:18; also Alma 38:14).'
  - where: 'note 18:13 “Be merciful to me, the sinner”'
    claim: 'The footnotes join the Pharisee’s prayer to Alma 31:16 and the publican’s to Alma 38:14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/18?lang=eng'
    quote: '11a “not”: Isa. 65:5; Alma 31:16 (14–18). … 13a “sinner”: Alma 38:14 (13–14).'
  - where: 'note 18:13 “Be merciful to me, the sinner”'
    claim: 'Alma 38:14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/38?lang=eng'
    quote: 'Do not say: O God, I thank thee that we are better than our brethren; but rather say: O Lord, forgive my unworthiness'
  - where: 'note 18:14 “Justified”'
    claim: 'dikaioō: God reckons us upright or stands us upright; we cannot do it ourselves'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'The term is the same that the Apostle Paul appeals to (Greek dikaioō), meaning that God reckons us as upright—when we are not—or, more vividly, stands us up so that we are upright before him … we are unable to perform this action on our own'
  - where: 'note 18:14 “Justified”'
    claim: 'Justified = absolved, forgiven, vindicated'
    key: hunter-pharisee-publican
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1984/04/the-pharisee-and-the-publican?lang=eng'
    quote: 'In other words, the Lord said he was absolved, forgiven, or vindicated.'
  - where: 'note 18:14 “Justified”'
    claim: 'In telling the parable Jesus sits as judge, declares the publican justified, and discloses His office as judge of all'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'By sitting as judge when rehearsing the parable, Jesus not only lifts up to view his current role as the judge of a person’s attitudes and direction of life but also discloses his eventual office as judge of all'
  - where: 'note 18:14 “Justified”'
    claim: 'The closing saying is almost the same as in the house of a chief Pharisee (14:11)'
    key: hunter-pharisee-publican
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1984/04/the-pharisee-and-the-publican?lang=eng'
    quote: 'These are almost the same words spoken by him in the house of one of the chief Pharisees. (See Luke 14:11.)'
  - where: 'note 18:14 “Justified”'
    claim: 'The one justified is the one who comes to God in humility'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'the person whom he judges to be justified or exonerated is the one who comes to God in humility'
  - where: 'note 18:15 “Infants, after the publican”'
    claim: 'Luke’s brephē are babes in arms'
    key: korth-reed-little-children
    url: 'https://rsc.byu.edu/household-god/become-little-children'
    quote: 'Uniquely, in another episode in which people bring “infants” to Jesus (Luke 18:15), the Lucan text uses the plural brephē, which refers to babes in arms.'
  - where: 'note 18:15 “Infants, after the publican”'
    claim: 'For Luke the touching is for securing blessings'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'For Luke, though he does not beam a light on Jesus’ acts of blessing, such touching is not merely for the sake of touching but is for securing blessings for the infants'
  - where: 'note 18:15 “Infants, after the publican”'
    claim: 'Humility in little children follows naturally the publican’s meekness; the disciples show a lack of humility'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'Humility’s further manifestation in little children follows naturally this story about a publican’s meekness. … the disciples inappropriately push their way to the fore and display their inner sense of authority, and therefore their lack of humility'
  - where: 'note 18:15 “Infants, after the publican”'
    claim: 'epitimaō a strong censure, often God’s prerogative; the disciples overstepped their authority'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'The Greek verb (imperfect tense of epitimaō) discloses a strong, drawn-out censure which, in scripture, is often the prerogative of God … Clearly, the disciples have stepped beyond their authority'
  - where: 'note 18:15 “Infants, after the publican”'
    claim: 'Jesus’ words address both parents and disciples; D&C 74:7 on children'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'These words of Jesus address not only parents, so that they are reassured about his concerns for little children, but also disciples who need correction.'
  - where: 'note 18:15 “Infants, after the publican”'
    claim: 'D&C 74:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/74?lang=eng'
    quote: 'But little children are holy, being sanctified through the atonement of Jesus Christ; and this is what the scriptures mean.'
  - where: 'note 18:18 “A ruler asks the lawyer’s question”'
    claim: 'Ruler: a presiding official in the local synagogue or possibly a Sanhedrist; love of worldly things his besetting weakness; the remedy not for all cases'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'Luke tells us that the young man was a ruler; this may mean that he was a presiding official in the local synagog or possibly a Sanhedrist. … Love of worldly things was this man’s besetting weakness; Jesus diagnosed his case and prescribed a suitable remedy. We are not warranted in saying that the same treatment would be best in all cases'
  - where: 'note 18:18 “A ruler asks the lawyer’s question”'
    claim: 'Matthew calls him young'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/19?lang=eng'
    quote: 'The young man saith unto him, All these things have I kept from my youth up: what lack I yet?'
  - where: 'note 18:18 “A ruler asks the lawyer’s question”'
    claim: 'Footnote 18a joins the question to Luke 10:25'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/18?lang=eng'
    quote: '18a “eternal life”: Luke 10:25.'
  - where: 'note 18:18 “A ruler asks the lawyer’s question”'
    claim: 'Asked in earnest, unlike the lawyer who tempted; “good” a polite compliment, not recognition of His Godship; no denial of sinlessness'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'The question was asked in earnestness; the questioner was in very different spirit from that of the lawyer who made a similar inquiry with the purpose of tempting the Master. … This remark was no denial of sinlessness on the Savior’s part; the young man had called Him “good” by way of polite compliment rather than in recognition of His Godship'
  - where: 'note 18:18 “A ruler asks the lawyer’s question”'
    claim: 'Willingness to place the kingdom above all possessions the one thing he lacked'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'Willingness to place the kingdom of God above all material possessions was the one thing he lacked.'
  - where: 'note 18:27 “Those who trust in riches”'
    claim: 'JST Luke 18:27'
    key: jst-luke-18
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/18?lang=eng'
    quote: 'And he said unto them, It is impossible for them who trust in riches, to enter into the kingdom of God; but he who forsaketh the things which are of this world, it is possible with God, that he should enter in.'
  - where: 'note 18:27 “Those who trust in riches”'
    claim: 'Wealth a temptation but no insuperable barrier; the ruler’s riches could have made possible rare service'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'while wealth is a means of temptation to which many succumb, it is no insuperable obstacle, no insurmountable barrier, in the way of entrance to the kingdom. Had the young ruler followed the advice called forth by his inquiry, his possession of riches would have made possible to him meritorious service such as few are able to render.'
  - where: 'note 18:31 “Written by the prophets”'
    claim: 'The prediction, in language of absolute plainness'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'Then He paused, called the Twelve about Him, and in language of absolute plainness, without metaphor or simile, He said: “Behold, we go up to Jerusalem, and all things that are written by the prophets concerning the Son of man shall be accomplished.'
  - where: 'note 18:31 “Written by the prophets”'
    claim: 'The reference to the prophecies is peculiar to Luke, connected with Luke 24:27, 44–45'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/18.htm'
    quote: 'The insertion of the reference to the prophecies of the Passion is, on the other hand, peculiar to him, and is, perhaps, connected with the prominence given to those prophecies in Luke 24:27; Luke 24:44-45.'
  - where: 'note 18:31 “Written by the prophets”'
    claim: 'Luke 24:44'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/24?lang=eng'
    quote: 'These are the words which I spake unto you, while I was yet with you, that all things must be fulfilled, which were written in the law of Moses, and in the prophets, and in the psalms, concerning me.'
  - where: 'note 18:31 “Written by the prophets”'
    claim: 'Footnote 31a points to Book of Mormon prophets'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/18?lang=eng'
    quote: '31a “written”: 1 Ne. 11:33; 2 Ne. 10:3; Mosiah 3:9 (9–10).'
  - where: 'note 18:31 “Written by the prophets”'
    claim: '1 Ne. 11:33'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/11?lang=eng'
    quote: 'And I, Nephi, saw that he was lifted up upon the cross and slain for the sins of the world.'
  - where: 'note 18:31 “Written by the prophets”'
    claim: 'Mosiah 3:9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/3?lang=eng'
    quote: 'and even after all this they shall consider him a man, and say that he hath a devil, and shall scourge him, and shall crucify him.'
  - where: 'note 18:31 “Written by the prophets”'
    claim: '“Hid”: veiled rather than hidden; occurs only here'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/18.htm'
    quote: 'The verb so rendered occurs here only in the New Testament. Its precise meaning is “covered” or “veiled,” rather than hidden.'
  - where: 'note 18:31 “Written by the prophets”'
    claim: 'They knew Him the Christ and could not see how He could be slain; they may have expected the proclamation of His kingship'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'They knew Him to be the Christ, the Son of the living God; and how could such a One be brought into subjection and be slain? … this they may have vaguely conceived to be the crisis for which they had been waiting, the open proclamation of His Messianic dignity, His enthronement as Lord and King.'
  - where: 'note 18:31 “Written by the prophets”'
    claim: 'Verse 34 Luke’s alone; perhaps (“as though”) explains their bewilderment and slowness to believe He had risen; heard but did not take in'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/18.htm'
    quote: 'The whole verse is peculiar to St. Luke … as explaining the subsequent bewilderment of the disciples, and their slowness to believe that their Lord had risen from the dead (Luke 24:11; Luke 24:21; Luke 24:25; Luke 24:38). They heard the words, but, as we say, did not “take in” their meaning.'
  - where: 'note 18:31 “Written by the prophets”'
    claim: 'John 12:16 (footnote 34a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/12?lang=eng'
    quote: 'These things understood not his disciples at the first: but when Jesus was glorified, then remembered they that these things were written of him'
  - where: 'note 18:38 “Jesus of Nazareth, Son of David”'
    claim: 'The cry and the title Son of David show he knew of Jesus, trusted His power to heal, and had faith in Him as the promised King'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'His appeal, and particularly his use of the title, Son of David, show that he knew of the great Teacher, had confidence in His power to heal and faith in Him as the promised King and Deliverer of Israel.'
  - where: 'note 18:38 “Jesus of Nazareth, Son of David”'
    claim: 'Those who went before: probably part of the crowd, not the disciples'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/18.htm'
    quote: '(39) They which went before—viz., those who were in advance of Jesus; probably, if we suppose Mark 10:32 to represent the usual order, not the disciples, but a portion of the crowd.'
  - where: 'note 18:38 “Jesus of Nazareth, Son of David”'
    claim: 'Mark: as He went out of Jericho'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/10?lang=eng'
    quote: 'And they came to Jericho: and as he went out of Jericho with his disciples and a great number of people, blind Bartimæus, the son of Timæus, sat by the highway side begging.'
  - where: 'note 18:38 “Jesus of Nazareth, Son of David”'
    claim: 'Matthew: two blind men'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/20?lang=eng'
    quote: 'And, behold, two blind men sitting by the way side, when they heard that Jesus passed by, cried out, saying, Have mercy on us, O Lord, thou Son of David.'
  - where: 'note 18:42 “Thy faith hath saved thee”'
    claim: 'sōzō: to make well, heal (Luke 7:50; 8:48; 17:19; 18:42), with spiritual healing also understood'
    key: thayer
    url: 'https://biblehub.com/greek/4982.htm'
    quote: 'to save a suffering one (from perishing), e. g. one suffering from disease, to make well, heal, restore to health: Matthew 9:22; Mark 5:34; Mark 10:52; Luke 7:50 (others understand this as including spiritual healing (see b. below)); Luke 8:48; Luke 17:19; Luke 18:42'
  - where: 'note 18:42 “Thy faith hath saved thee”'
    claim: 'The immediate reference is the restored sight; beyond it, salvation, of which the sight was type and earnest'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/18.htm'
    quote: 'the immediate reference being obviously to the restoration of the man’s sight … Beyond this, as in the use of the same formula in Luke 7:50, there lies in the word a reference to the salvation, the healthiness of spiritual vision, of which the restoration of bodily sight was at once the type and the earnest.'
  - where: 'note 18:42 “Thy faith hath saved thee”'
    claim: '“Followed” is ēkolouthei, the imperfect (Robinson V-IAI-3S in greek.mjs)'
    key: greek-nt
    url: 'https://biblehub.com/texts/luke/18-43.htm'
    quote: 'καὶ παραχρῆμα ἀνέβλεψεν, καὶ ἠκολούθει αὐτῷ δοξάζων τὸν θεόν.'
  - where: 'note 18:42 “Thy faith hath saved thee”'
    claim: 'The effect on the man and on the people is told only by Luke'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/18.htm'
    quote: 'The account of the effect of the miracle on the blind man himself, and on the people, is peculiar to St. Luke'
  - where: 'note 18:42 “Thy faith hath saved thee”'
    claim: 'Jesus fulfilled Isaiah 61 / Luke 4:18 by healing the blind, Luke 18:35–43'
    key: sc-knowhy-656
    url: 'https://scripturecentral.org/knowhy/why-does-jesus-announce-that-isaiah-611-2-is-fulfilled'
    quote: 'Jesus would fulfill all of Isaiah’s prophetic declarations: He taught the Gospel to all who would listen, especially among the poor (Luke 6:20; Matthew 5:3). He performed many miracles, including healing the blind (Luke 18:35–43).'
  - where: 'note 18:42 “Thy faith hath saved thee”'
    claim: 'Luke 4:18 “recovering of sight to the blind”'
    key: sc-knowhy-656
    url: 'https://scripturecentral.org/knowhy/why-does-jesus-announce-that-isaiah-611-2-is-fulfilled'
    quote: 'he hath sent me to heal the brokenhearted, to preach deliverance to the captives, and recovering of sight to the blind'

