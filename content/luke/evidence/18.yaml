    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'Jesus’ forceful protest does not amount to an admission of sin on his part but instead points to a long-standing doctrine in the Old Testament that God holds exclusive claim on goodness'
