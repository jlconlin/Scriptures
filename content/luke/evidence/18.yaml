    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'The question, asked earlier (see 10:25), brims with the naïve sense, even arrogance, that one or two tasks, performed quickly, will open the door to eternal life.'
