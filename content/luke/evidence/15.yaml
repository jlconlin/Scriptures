chapter: 15
claims:
  # ---- setting, thread
  - where: setting
    claim: 'The complaint about eating ties back to chapter 14’s meal and Jesus’s teaching that one shares one’s table with all'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-15-104'
    quote: 'The complaint about eating ties back to the prior chapter, wherein Jesus not only joins a group for a meal but also talks a good deal about meals, making the point that one shares one’s table with all (see 14:12–14, 21–23).'
  - where: setting
    claim: 'From chapter 13 to the middle of chapter 18 only small portions of Luke are paralleled in Matthew and Mark'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-15-104'
    quote: 'from the beginning of chapter 13 through the midpoint of chapter 18, a full five and one-half chapters, only small portions from Luke’s report are paralleled in those of Matthew and Mark.'
  - where: setting
    claim: 'Matthew 18:12–14 and Luke 15:3–7 are best read as similar stories told on different occasions'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-15-104'
    quote: 'For others, the parables are similar, but not similar enough to posit a common source.24 Instead, a person is justified in seeing Jesus telling similar stories on different occasions to make a fresh point.'
  - where: setting
    claim: 'Joseph Smith preached on the prodigal son on 29 January 1843 on the floor of the temple'
    key: ehat-cook-words-1843-01-29
    url: 'https://rsc.byu.edu/words-joseph-smith/29-january-1843-sunday-temple'
    quote: 'Sunday Jany 29 meeting on floor of the Temple Joseph Read the parable of the prodigal Son'
  - where: setting
    claim: 'The temple was unfinished'
    key: ehat-cook-words-1843-01-29
    url: 'https://rsc.byu.edu/words-joseph-smith/29-january-1843-sunday-temple'
    quote: 'The Mormons have not yet completed their great Temple, … they meet in the grove, or on the rough floor of the basement of the Temple, and then the prophet frequently preaches. On one of these occasions I heard him preach concerning the prodigal son.'
  - where: thread
    claim: 'The Pharisees’ complaint frames the point of the three stories, the recovery of the lost'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-15-104'
    quote: 'Beyond this, their complaint frames the point of the next three stories, recovery of the lost (see 15:7, 10, 32).'
  - where: thread
    claim: 'One from a hundred, one from ten, one from two: the value rises'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-15-104'
    quote: 'For Jesus begins with a parable that focuses on one lost from a hundred, then one out of ten, and finally one of two.73 In effect, the relative value rises the longer Jesus talks.'
  - where: thread
    claim: 'The younger son leaves willfully'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-15-104'
    quote: 'Jesus’ words both picture the willful behavior of this son and also draw onto the canvas the thin, dark lines of his older brother’s slow-burning resentment'
  - where: thread
    claim: 'Joseph Smith read the elder son as the murmuring Pharisees'
    key: ehat-cook-words-1843-01-29
    url: 'https://rsc.byu.edu/words-joseph-smith/29-january-1843-sunday-temple'
    quote: 'Eldest son, pharisees & saducees murmuring & complaining—because Jesus sat with publicans & sinners—father came out & entreated'
  - where: thread
    claim: 'The parable does not come to an end; the hearers complete it'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-15-104'
    quote: 'the parable does not bring the story to an end. Hence, Jesus allows his hearers to complete the narration in their own minds.'

  # ---- notes
  - where: 'note 15:2 “Sinners at His table”'
    claim: 'Publicans detested, excommunicated; many served Herod; readily received the gospel (Luke 15:1 among the references)'
    key: bd-publicans
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/publicans?lang=eng'
    quote: 'Both classes were detested by the Jews, and any Jew who undertook the work was excommunicated. Many of the tax-gatherers in Galilee would be in the service of Herod and not of Rome. There are many references in the New Testament to the readiness with which the publicans received the gospel'
  - where: 'note 15:2 “Sinners at His table”'
    claim: 'The footnote at 15:1 points to Mark 2:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/15?lang=eng'
    quote: '1a “publicans”: Mark 2:16 (15–16).'
  - where: 'note 15:2 “Sinners at His table”'
    claim: '“Publicans and sinners” a disparaging classing; the earlier Galilean complaint answered with the physician'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'The Pharisees in Galilee had intolerantly criticized Jesus … among the publicans and their associates, who were disparagingly classed together as “publicans and sinners.” He had replied to these uncharitable aspersions by saying that a physician is most needed by them that are sick'
  - where: 'note 15:2 “Sinners at His table”'
    claim: 'Jesus never defended their ways; physician and shepherd'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'do we find Jesus defending their alleged evil ways; His attitude toward these spiritually sick folk was that of a devoted physician: His concern over these strayed sheep was that of a loving shepherd'
  - where: 'note 15:2 “Sinners at His table”'
    claim: 'The murmurers may have been guests of 14:15, shocked that a stern teacher ate with the ungodly'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/15.htm'
    quote: 'we may well believe that the speakers were some of the guests of Luke 14:15. They had followed Him to see what He would do, and were at once startled and shocked to find the Teacher who had spoken so sternly to those who were professedly godly, not only talking to, but eating with'

  - where: 'note 15:3 “The question that drew out the parable”'
    claim: 'Joseph Smith: elders preach it with no rule of interpretation; his key is to ask what question drew out the answer'
    key: ehat-cook-words-1843-01-29
    url: 'https://rsc.byu.edu/words-joseph-smith/29-january-1843-sunday-temple'
    quote: 'Elders in this church preach.—no rule of interpretation.—what is the rule of interpretation? Just no interpretation at all. understood precisely as it read.—I have [a] Key by which I understand the scripture—I enquire what was the question which drew out the answer.—'
  - where: 'note 15:3 “The question that drew out the parable”'
    claim: 'The key word is the Pharisees’ murmur; not about nations or Abraham'
    key: ehat-cook-words-1843-01-29
    url: 'https://rsc.byu.edu/words-joseph-smith/29-january-1843-sunday-temple'
    quote: 'National. Abraham. &c as some suppose 1st place dig up the root—what drew out the saying out of Jesus? Pharisees & scribes murmurred! this man receives sinners & eatheth with them this is the key word.'
  - where: 'note 15:3 “The question that drew out the parable”'
    claim: 'Nothing about Ephraim or Abraham; the elder son is the murmuring Pharisees and Sadducees; when Jesus came they would not go in; where is the eldest son on a national reading?'
    key: ehat-cook-words-1843-01-29
    url: 'https://rsc.byu.edu/words-joseph-smith/29-january-1843-sunday-temple'
    quote: 'nothing about Ephraim Abraham—is not mentioned. … Eldest son, pharisees & saducees murmuring & complaining—because Jesus sat with publicans & sinners—father came out & entreated when John came baptized all. when Jesus come they were angry & would not go in.'
  - where: 'note 15:3 “The question that drew out the parable”'
    claim: '“If we interpret this to national, view where is the eldest son?”'
    key: ehat-cook-words-1843-01-29
    url: 'https://rsc.byu.edu/words-joseph-smith/29-january-1843-sunday-temple'
    quote: 'If we interpret this to national, view where is the eldest son?'
  - where: 'note 15:3 “The question that drew out the parable”'
    claim: 'If the Pharisees are in the sheepfold, Jesus has no mission to them; He was sent to look up the lost'
    key: ehat-cook-words-1843-01-29
    url: 'https://rsc.byu.edu/words-joseph-smith/29-january-1843-sunday-temple'
    quote: 'If you pharisees & saducees. are in the sheepfold. I have no mission for you sent to look up sheep that are lost'
  - where: 'note 15:3 “The question that drew out the parable”'
    claim: 'William Clayton’s diary: the parable did not refer to any nation but answered the remark'
    key: ehat-cook-words-1843-01-29
    url: 'https://rsc.byu.edu/words-joseph-smith/29-january-1843-sunday-temple'
    quote: 'Pres. Joseph Preached in the Temple on the Prodigal Son and showed that it did not refer to any nation, but was mearly an answer to the remark "he recieveth the sinners and eateth with them,"'
  - where: 'note 15:3 “The question that drew out the parable”'
    claim: 'The reports are notes kept by those who heard him (Franklin D. Richards, William Clayton, Willard Richards)'
    key: ehat-cook-words-1843-01-29
    url: 'https://rsc.byu.edu/words-joseph-smith/29-january-1843-sunday-temple'
    quote: 'The reports kept by Franklin D. Richards (except for the words enclosed in braces), William Clayton, and Willard Richards (personal diary) are here published for the first time.'

  - where: 'note 15:4 “Leaving the ninety and nine”'
    claim: 'The JST reading is in the Gospel Library footnote at 15:4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/15?lang=eng'
    quote: 'JST Luke 15:4 … and go into the wilderness after that which is lost …'
  - where: 'note 15:4 “Leaving the ninety and nine”'
    claim: 'In Matthew’s telling the shepherd goes alone into the mountains; the flock, Talmage cannot doubt, is left in safety'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'The shepherd is portrayed as leaving the ninety and nine, pastured or folded in safety we cannot doubt, while he goes alone into the mountains to seek the one that has strayed.'
  - where: 'note 15:4 “Leaving the ninety and nine”'
    claim: 'Primary application: love concentrating on one soul among the publicans and sinners'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/15.htm'
    quote: 'The primary application of that idea is clearly to be found in the immediate occasion of the parable, in the love which bids the Son of Man to concentrate His thoughts and energy and prayers on some one soul among those publicans and sinners'

  - where: 'note 15:6 “My sheep”'
    claim: 'The footnote at 15:4 points to Ezekiel 34:16 (11–12, 16)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/15?lang=eng'
    quote: '4b “lost”: Ezek. 34:16 (11–12, 16).'
  - where: 'note 15:6 “My sheep”'
    claim: 'In Ezekiel 34 shepherds and sheep symbolize the leaders and people of Israel'
    key: pike-shepherd
    url: 'https://rsc.byu.edu/celebrating-easter/jesus-great-shepherd-king'
    quote: 'These are followed by a series of prophecies about the future restoration of the house of Israel, including these statements in chapter 34 in which shepherds and sheep symbolize the leaders and people of Israel'
  - where: 'note 15:6 “My sheep”'
    claim: 'Apollumi of the lost sheep: Ezekiel 34’s flock, Israel neglected by its teachers'
    key: thayer
    url: 'https://biblehub.com/greek/622.htm'
    quote: 'Metaphorically, in accordance with the O. T. comparison of the people of Israel to a flock (Jeremiah 27:6 (); Ezekiel 34:4, 16), the Jews, neglected by their religious teachers, left to themselves'
  - where: 'note 15:6 “My sheep”'
    claim: 'Christ likened to a shepherd who seeks and saves the lost (Luke 19:10)'
    key: thayer
    url: 'https://biblehub.com/greek/622.htm'
    quote: 'and Christ, reclaiming them from wickedness, is likened to a shepherd and is said ζητεῖν καί σῴζειν τό ἀπολωλός: Luke 19:10'
  - where: 'note 15:6 “My sheep”'
    claim: 'The Lord as the solicitous Shepherd; the Pharisees put in the position of shepherds; both readings tenable'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'In the earlier part of the story, the Lord Himself appears as the solicitous Shepherd, and by plain implication His example is such as the theocratic leaders ought to emulate. Such a conception puts the Pharisees and scribes in the position of shepherds rather than of sheep. Both explications are tenable'
  - where: 'note 15:6 “My sheep”'
    claim: 'The shepherd thinks not of reprimand; lays it on his shoulders'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'The shepherd, on finding the sheep that was lost, thinks not at the time of reprimand or punishment; on the contrary, “when he hath found it, he layeth it on his shoulders, rejoicing.'

  - where: 'note 15:7 “Just persons, which need no repentance”'
    claim: 'A grave protest veiled as a concession against Pharisaic self-righteousness; the call to repent was to all'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/15.htm'
    quote: 'we cannot see in these words anything but a grave and indignant protest, veiled under the form of an apparent concession, against the self-righteousness of the Pharisees. His call to repent had been addressed to all.'
  - where: 'note 15:7 “Just persons, which need no repentance”'
    claim: 'All had sinned (Rom. 3:23; 1 John 1:8)'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/15.htm'
    quote: 'That all offended in many things; that for a man to say he had not sinned was a lying boast—this was the first postulate of every preacher of the gospel, whatever school of thought he might represent (Romans 3:23; James 3:2; 1John 1:8).'
  - where: 'note 15:7 “Just persons, which need no repentance”'
    claim: 'The Pharisees’ conviction that they were the just persons'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/15.htm'
    quote: 'It was reserved for the Pharisees to develop the thought into the conviction that they were the just persons who needed no repentance'
  - where: 'note 15:7 “Just persons, which need no repentance”'
    claim: 'Talmage: by self-estimation had strayed not; some hear just sarcasm'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'Were they the ninety and nine, who, by self-estimation had strayed not, being “just persons, which need no repentance?” Some readers say they catch this note of just sarcasm in the Master’s concluding words.'
  - where: 'note 15:7 “Just persons, which need no repentance”'
    claim: 'Talmage: the other reading puts the Pharisees as shepherds; both tenable'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'In the earlier part of the story, the Lord Himself appears as the solicitous Shepherd, and by plain implication His example is such as the theocratic leaders ought to emulate. Such a conception puts the Pharisees and scribes in the position of shepherds rather than of sheep. Both explications are tenable'
  - where: 'note 15:7 “Just persons, which need no repentance”'
    claim: 'Talmage: continued joy in the safe ninety and nine, new happiness at the return'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'In the safe-folded ninety and nine the shepherd had continued joy; but to him came a new accession of happiness, brighter and stronger because of his recent grief, when the lost was brought back to the fold.'

  - where: 'note 15:8 “The lost coin”'
    claim: 'The drachma was about a day’s pay; women wore such coins as a sign of marriage; perhaps a wedding gift'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-15-104'
    quote: 'This coin is the Greek drachma, the rough equivalent of the Roman denarius, and represents the pay for a full day’s work … One dimension that makes sense is the woman receives this coin from her husband at the time of their wedding. Women are known to have worn such coins in their scarves as an indicator of their marriage.'
  - where: 'note 15:8 “The lost coin”'
    claim: 'A clay lamp in a dark house that may have no windows'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-15-104'
    quote: 'She is lighting a wick that sticks out of a clay lamp … it will help her examine the corners of her dark home which may not have any windows'
  - where: 'note 15:8 “The lost coin”'
    claim: 'A poor woman with a dirt floor'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-15-104'
    quote: 'Jesus portrays a poor woman who, living in a home with a dirt floor, examines every surface for her valued coin.'
  - where: 'note 15:8 “The lost coin”'
    claim: 'Luke pairs the man and the woman, as he pairs men and women elsewhere'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-15-104'
    quote: 'But the fact that Luke pairs the two stories, a feature likely from his source, continues a visible, singular pattern of pushing women forward in companion stories throughout his Gospel'
  - where: 'note 15:8 “The lost coin”'
    claim: 'Talmage: the woman who lost the coin by lack of care as the Church; coins as souls in its care; the lost as souls neglected by ministers'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'The woman who by lack of care lost the precious piece may be taken to represent the theocracy of the time, and the Church as an institution in any dispensational period; then the pieces of silver, every one a genuine coin of the realm, bearing the image of the great King, are the souls committed to the care of the Church'
  - where: 'note 15:8 “The lost coin”'
    claim: 'The lost piece: souls neglected and lost sight of by the ministers'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'the lost piece symbolizes the souls that are neglected and, for a time at least, lost sight of, by the authorized ministers of the Gospel of Christ.'

  - where: 'note 15:12 “The portion that falleth to me”'
    claim: 'The firstborn’s double portion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/21?lang=eng'
    quote: 'But he shall acknowledge the son of the hated for the firstborn, by giving him a double portion of all that he hath'
  - where: 'note 15:12 “The portion that falleth to me”'
    claim: 'Elder two thirds, younger the rest; father and elder son tenants in common, the father still directing (15:31)'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/15.htm'
    quote: 'In the normal scale of distribution, the elder son would have as his portion two-thirds of the personal, and possibly also of the real, property, the younger the remainder. In the framework of the story, the father and the elder son become, as it were, tenants in common (Luke 15:31), the former still retaining the general direction of affairs.'
  - where: 'note 15:12 “The portion that falleth to me”'
    claim: 'He divided unto both sons; in harmony with the law at that time'
    key: jensen-two-sons
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/parable-two-sons'
    quote: 'Note that Luke said “he divided unto them”—both sons. To give both sons their inheritance was in harmony with the law at that time.'
  - where: 'note 15:12 “The portion that falleth to me”'
    claim: 'Talmage: the demand an unfilial desertion; family duties distasteful, home irksome, break all ties'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'The demand of the younger son for a portion of the patrimony, even during his father’s lifetime, is an instance of deliberate and unfilial desertion; the duties of family cooperation had grown distasteful to him, and the wholesome discipline of the home had become irksome. He was determined to break away from all home ties'

  - where: 'note 15:13 “Riotous living”'
    claim: 'Thayer: asōtōs, dissolutely, profligately; Luke 15:13 (A.V. riotous living)'
    key: thayer
    url: 'https://biblehub.com/greek/811.htm'
    quote: 'ἀσώτως, adverb (adjective ἄσωτος, on which see ἀσωτία), dissolutely, profligately: ζῆν (Josephus, Antiquities 12, 4, 8), Luke 15:13 (A. V. riotous living).'
  - where: 'note 15:13 “Riotous living”'
    claim: 'The expression does not specify wildness or wasteful luxury; news of harlots trickles back'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-15-104'
    quote: 'The expression does not specify whether the son is disorderly and wild, or wastefully squandering his inheritance on luxuries—either meaning fits.38 But news eventually trickles back home that he has “devoured [his father’s] living with harlots” (15:30).'
  - where: 'note 15:13 “Riotous living”'
    claim: '“Substance” is ousia as in 15:12; he squanders his father’s money, not just his own'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-15-104'
    quote: 'The noun for property is the same as in 15:12 (Greek ousia), even though the younger son has effectively turned his part of the estate into cash. … this son is shamelessly squandering his father’s money, not just his own'
  - where: 'note 15:13 “Riotous living”'
    claim: '“Prodigal” means wasteful, the least important element; it is the story of a lost son'
    key: holzapfel-jackson-least-last-lost
    url: 'https://rsc.byu.edu/save-lost/least-last-t-he-lost'
    quote: 'In English, tradition has imposed upon it the unfortunate title “Prodigal Son”—prodigal meaning “wasteful,” the least important element of the parable. It is really the story of a lost son'

  - where: 'note 15:15 “To feed swine”'
    claim: 'He works for a Gentile who owns pigs, unclean for Jews; no longer controls his destiny'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-15-104'
    quote: 'The younger son no longer controls his destiny, but submits to his need to survive by working for a Gentile who owns pigs, illustrating vividly how far he has fallen. Pigs, of course, are unclean for Jews (see Lev. 11:7; Deut. 14:8).'
  - where: 'note 15:15 “To feed swine”'
    claim: 'Husks: carob pods, food for animals and the poor'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-15-104'
    quote: 'The noun (Greek keration) literally means “little horn” and refers to carob pods that are a food staple for animals in the Mediterranean region, and even for poor people.'
  - where: 'note 15:15 “To feed swine”'
    claim: '“No man gave”: the famine left none able to help; his friendships did not last'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-15-104'
    quote: 'First, the “mighty famine” (15:14) affects everyone in the society to such a pitch that no one is able to render even a little help.40 Second, whatever friendships the young man forms in his new setting do not persist.'
  - where: 'note 15:15 “To feed swine”'
    claim: 'The swineherd’s fall sharpens the main theme: can such a one be accepted and forgiven?'
    key: jensen-two-sons
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/parable-two-sons'
    quote: 'To the Jews, swine were unclean. To fall that low could only illustrate with even greater power the main theme of the parable: can a swineherder—someone who occupies a base, vile, degrading position—be accepted, be forgiven'

  - where: 'note 15:17 “He came to himself”'
    claim: '“Came to himself” is the literal Greek; humbling imposed from outside, repentance begins with his own awakened consciousness'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-15-104'
    quote: 'This is the literal meaning of the Greek expression and points to the young man’s dawning realization of how he dishonors his father … though the humbling process is imposed by external factors (see Alma 32:12–16), his repentance begins in earnest'
  - where: 'note 15:17 “He came to himself”'
    claim: '“Against heaven, and before thee”: those affected by sin, from whom forgiveness must be sought'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-15-104'
    quote: 'These prepositional phrases set out Jesus’ viewpoint on those affected by a person’s sinful behavior and therefore those from whom that person must seek forgiveness'
  - where: 'note 15:17 “He came to himself”'
    claim: 'Elder Hales: he remembered who he was and desired the blessings of his father’s house'
    key: hales-coming-to-ourselves
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2012/04/coming-to-ourselves-the-sacrament-the-temple-and-sacrifice-in-service?lang=eng'
    quote: 'In the Savior’s words, “he came to himself.” He remembered who he was, realized what he had been missing, and began to desire the blessings freely available in his father’s house.'
  - where: christ
    claim: 'Elder Holland: we can come to ourselves but cannot save ourselves'
    key: holland-other-prodigal
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2002/04/the-other-prodigal?lang=eng'
    quote: 'When we are lost, we can “come to ourselves,” but we may not always be able to “find ourselves,” and, worlds without end, we cannot “save ourselves.” Only the Father and His Only Begotten Son can do that.'

  - where: 'note 15:20 “The father ran”'
    claim: '“A great way off” uses the same adverb as the “far country”; the son reverses his path'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-15-104'
    quote: 'The adverb that stands in this expression (Greek makran) also appears in 15:13, where it has to do with the substantial distance that the fellow travels to escape his father—“a far country.”'
  - where: 'note 15:20 “The father ran”'
    claim: 'Compassion plays out in action verbs; true compassion acts'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-15-104'
    quote: 'The father’s compassion plays out in the vivid action verbs that follow: “ran, and fell on . . . and kissed.” Jesus’ more-than-subtle point, made through the father, is that true compassion involves acting'
  - where: 'note 15:20 “The father ran”'
    claim: 'Falling on the neck recalls Joseph and Jacob (Gen. 46:29)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-15-104'
    quote: 'This act conjures up images of Joseph’s warm greeting for his younger brother Benjamin (see Gen. 45:14) and, even more vividly for Jesus’ audience, the greeting between Joseph and his father Jacob (see Gen. 46:29'
  - where: 'note 15:20 “The father ran”'
    claim: 'Talmage: the son did not ask to be a hired servant; the father’s joy too sacred to mar'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'It is noteworthy that in his contrite confession he did not ask to be accepted as a hired servant as he had resolved to do; the father’s joy was too sacred to be thus marred, he would please his father best by placing himself unreservedly at that father’s disposal.'
  - where: 'note 15:20 “The father ran”'
    claim: 'Talmage: overcome by undeserved affection'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'the loving parent embraced and kissed the wayward but now penitent boy, who, overcome by this undeserved affection, humbly acknowledged his error'
  - where: 'note 15:20 “The father ran”'
    claim: 'Elder Holland on the father running and kissing him'
    key: holland-other-prodigal
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2002/04/the-other-prodigal?lang=eng'
    quote: 'The tender image of this boy’s anxious, faithful father running to meet him and showering him with kisses is one of the most moving and compassionate scenes in all of holy writ. It tells every child of God, wayward or otherwise, how much God wants us back in the protection of His arms.'

  - where: 'note 15:22 “Robe, ring and shoes”'
    claim: 'Best robe reserved for special guests; ring dignity and family acceptance'
    key: jensen-two-sons
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/parable-two-sons'
    quote: '“Bring forth the best robe” (v. 22)—reserved for special guests, a very special honor.'
  - where: 'note 15:22 “Robe, ring and shoes”'
    claim: 'Ring: dignity, honor, family acceptance'
    key: jensen-two-sons
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/parable-two-sons'
    quote: '“Put a ring on his hand” (v. 22)—suggesting dignity, honor, and a recognition of family acceptance.'
  - where: 'note 15:22 “Robe, ring and shoes”'
    claim: 'Shoes: a son, not a slave; slaves went barefoot'
    key: jensen-two-sons
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/parable-two-sons'
    quote: '“Put . . . shoes on his feet” (v. 22)—indicating he was a son, not a slave. A mark of a slave was to go barefooted.'
  - where: 'note 15:22 “Robe, ring and shoes”'
    claim: 'Fatted calf reserved for special occasions'
    key: jensen-two-sons
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/parable-two-sons'
    quote: '“Bring hither the fatted calf, and kill it” (v. 23)—the one reserved for special occasions.'
  - where: 'note 15:22 “Robe, ring and shoes”'
    claim: 'The robing prepares him for the meal (Matt. 22:11–12)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-15-104'
    quote: 'And it seems evident that the robing of the son is a step in preparing him for the special meal (see 15:22; Matt. 22:11–12).'
  - where: 'note 15:22 “Robe, ring and shoes”'
    claim: 'Killing a young animal shows a man of means; it costs future productive power'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-15-104'
    quote: 'Drawing out a young animal from the herd for slaughter points to an owner of considerable means, for the loss of a young animal means a loss of future productive power that sustains the herd'

  - where: 'note 15:24 “Dead, and alive again”'
    claim: 'Spiritually, repentance is the passing from death of sin to life'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/15.htm'
    quote: 'Absence, alienation, the self-chosen shame, this had made the father think of the son as “dead.” … Spiritually, we are taught that repentance is nothing less than the passing from the death of sin to the life of righteousness'
  - where: 'note 15:24 “Dead, and alive again”'
    claim: 'Lost and found link this to the preceding parables, completing the trilogy'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/15.htm'
    quote: 'The “lost” and “found” appear as furnishing the link that connects this with the preceding parables, and makes the trilogy, as it were, complete.'
  - where: 'note 15:24 “Dead, and alive again”'
    claim: 'Talmage: the son once counted as dead, now alive'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'a feast was made ready, for was not the son, once counted as dead, now alive? Had not the lost been found again?'
  - where: 'note 15:24 “Dead, and alive again”'
    claim: 'Anazaō figuratively: restored to a correct life, Luke 15:24'
    key: thayer
    url: 'https://biblehub.com/greek/326.htm'
    quote: 'tropically, one is said ἀναζῆν who has been νεκρός in a tropical sense; α. to be restored to a correct life: of one who returns to a better moral state, Luke 15:24'
  - where: 'note 15:24 “Dead, and alive again”'
    claim: 'The brother had spent years in a state of spiritual death; the father says it to the elder son in 15:32'
    key: sc-knowhy-669
    url: 'https://scripturecentral.org/knowhy/how-does-the-parable-of-the-prodigal-son-teach-us-about-repentance'
    quote: 'urges him to look compassionately on his brother, who had spent years in a state of spiritual death: “For this thy brother was dead, and is alive again; and was lost, and is found” (Luke 15:32).'

  - where: 'note 15:28 “The other prodigal”'
    claim: 'The father left the festivity, which he did not have to do, and entreated his son'
    key: jensen-two-sons
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/parable-two-sons'
    quote: 'The fact that the father left the festivity, which he did not have to do, and entreated his son is evidence to me of the mercy and condescension of God the Father.'
  - where: 'note 15:28 “The other prodigal”'
    claim: '“Intreated” is imperfect: repeated, persistent pleading'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-15-104'
    quote: 'The tense of the verb—imperfect—points to the father’s repeated, persistent action.'
  - where: 'note 15:28 “The other prodigal”'
    claim: 'Holland: both sons were lost and needed to come home'
    key: holland-other-prodigal
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2002/04/the-other-prodigal?lang=eng'
    quote: 'the opening line of the Savior’s account reads, “A certain man had two sons”—and He might have added, “both of whom were lost and both of whom needed to come home.”'
  - where: 'note 15:28 “The other prodigal”'
    claim: 'Holland: angry that his parents are happy; every calf already his'
    key: holland-other-prodigal
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2002/04/the-other-prodigal?lang=eng'
    quote: 'This son is not so much angry that the other has come home as he is angry that his parents are so happy about it. … He forgets for a moment that every calf on the ranch is already his and so are all the robes in the closet and every ring in the drawer.'
  - where: 'note 15:28 “The other prodigal”'
    claim: 'Holland: he feels taken for granted and disenfranchised when neither is the case'
    key: holland-other-prodigal
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2002/04/the-other-prodigal?lang=eng'
    quote: 'He feels taken for granted by his father and disenfranchised by his brother, when neither is the case.'
  - where: 'note 15:28 “The other prodigal”'
    claim: 'Talmage: the Pharisees and scribes typified by the elder son; “this thy son” but never a brother; but the parable was not for them alone'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'They were typified by the elder son, laboriously attentive to routine, … all unwilling to welcome a repentant publican or a returned sinner. … such a one might be to the indulgent and forgiving Father, “this thy son,” but never to them, a brother.'
  - where: 'note 15:28 “The other prodigal”'
    claim: 'Talmage: the parable not for them alone, a living perennial'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'But the parable was not for them alone; it is a living perennial yielding the fruit of wholesome doctrine and soul-sustaining nourishment for all time.'

  - where: 'note 15:31 “All that I have is thine”'
    claim: 'The father answers both complaints; D&C 84:38 principle for the faithful'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-15-104'
    quote: 'This statement answers the second of the older son’s complaints that he has never received even a young goat for a party with friends … Beyond this, the principle is true that, to the faithful, “all that [the Savior’s] Father hath shall be given unto [them]” (D&C 84:38).'
  - where: 'note 15:31 “All that I have is thine”'
    claim: '“Thou art ever with me” answers the protest of hard work'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-15-104'
    quote: 'The son’s initial protest to his father that he works hard and faithfully must be addressed (see 15:29). And here the father reassures him of his status'
  - where: 'note 15:31 “All that I have is thine”'
    claim: '“Son” (teknon) is affectionate'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-15-104'
    quote: 'The word (Greek teknon) commonly conveys “an affectionate address to a son”'
  - where: 'note 15:31 “All that I have is thine”'
    claim: 'The father cannot reconfer an estate on the younger son; he no longer inherits'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-15-104'
    quote: 'No, in the sense that the father does not and cannot reconfer a portion of his estate on the younger son, unable to add reward to what he has already given. Of course, opportunity stands in front of this son to rebuild his life, but he is no longer eligible to inherit anything from his father.'
  - where: 'note 15:31 “All that I have is thine”'
    claim: 'Talmage: not to extol the prodigal’s repentance above the faithful brother; the devoted son was the heir'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'We are not justified in extolling the virtue of repentance on the part of the prodigal above the faithful, plodding service of his brother, who had remained at home, true to the duties required of him. The devoted son was the heir; the father did not disparage his worth, nor deny his deserts.'
  - where: 'note 15:31 “All that I have is thine”'
    claim: 'The footnote at 15:31 gives D&C 84:38'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/15?lang=eng'
    quote: '31b “all”: D&C 84:38.'

  - where: 'note 15:32 “This thy brother”'
    claim: '“This thy son” is emphatic and contemptuous; the father’s “this thy brother” restores the sibling tie'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-15-104'
    quote: 'The expression is emphatic both in English and in Greek, and bears a sense of contempt'
  - where: 'note 15:32 “This thy brother”'
    claim: 'The father’s words balance the older son’s, reestablishing the sibling connection'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-15-104'
    quote: 'The father’s words balance those of the older son, “this thy son” (15:30), thus reestablishing the sibling connection.'
  - where: 'note 15:32 “This thy brother”'
    claim: '“It was meet” is dei, necessity'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-15-104'
    quote: 'This impersonal verb is strong, denoting necessity: “it was necessary” (Greek dei). Hence, the father sets out the proper—and needed—response to the return of a wandering soul.'
  - where: 'note 15:32 “This thy brother”'
    claim: 'The parable leaves open whether the older son joins the party and whether the younger changes'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-15-104'
    quote: 'Does the older son finally join the party? … Further, does the younger son really change his behavior and turn his energies to building what he loses when he squanders his inheritance? The parable does not address such questions'
  - where: 'note 15:32 “This thy brother”'
    claim: 'Joseph Smith: the Pharisees, like the elder son, were angry and would not go in'
    key: ehat-cook-words-1843-01-29
    url: 'https://rsc.byu.edu/words-joseph-smith/29-january-1843-sunday-temple'
    quote: 'when Jesus come they were angry & would not go in.'

