  - where: 'note 6:32 “What thank have ye?”'
    claim: 'Thayer: charis means thanks, and in Luke 6:32–34 recompense, reward, where Matthew 5:46 uses misthos'
    key: thayer
    url: 'https://biblehub.com/greek/5485.htm'
    quote: 'equivalent to recompense, reward, Luke 6:32-34 (for which Matthew 5:46 usesμισθός).'
  - where: 'note 6:32 “What thank have ye?”'
    claim: 'Luke’s “thank” points to the expectation of gratitude, Matthew’s “reward” to a more concrete payment'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/6.htm'
    quote: 'St. Luke’s “what thank have ye” pointing to the expectation of gratitude in return for good offices, St. Matthew’s “what reward” to a more concrete and solid payment.'
  - where: 'note 6:32 “What thank have ye?”'
