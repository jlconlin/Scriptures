chapter: 6
claims:
  - where: setting
    claim: 'The two Sabbath controversies are told in all three Synoptic Gospels, back to back'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'it is notable that two striking accounts of Sabbath controversies are found in all three of the Synoptic Gospels and are given back-to-back.'
  - where: setting
    claim: 'Luke follows Mark’s order from the leper to the withered hand; the correspondence ends when Jesus goes into the mountain'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'Mark whose order of incidents matches that of Luke, starting with Jesus’ cleansing of the leper and continuing to the healing of the man with the withered hand (see 5:12–6:11; Mark 1:40–3:6). But then the correspondences end'
  - where: setting
    claim: 'Brown divides the sermon into three subjects: beatitudes and woes (20–26), love of enemies as imitation of the Father (27–38), treatment of others and the house (39–49)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'In the first, he deals with this world and its vicissitudes through a series of beatitudes and woes (see 6:20–26). In the second, he unveils his command to love enemies as an imitation of what the Father does (see 6:27–38).'
  - where: thread
    claim: 'In chapter 6 the opposition to Jesus becomes focused and public, after the healing of the withered hand'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'Chapter 6 raises to view a critical moment in the Savior’s ministry, the moment that the opposition to him becomes focused and public. It manifests itself in response to his healing of the man with the withered right hand.'
  - where: thread
    claim: 'Brown: Jesus does not ask what He does not do; in the night He is already praying for those “filled with madness,” as on the cross'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'the observation that Jesus does not ask his followers to do what he does not do implies boldly that, during the prior night, he is already praying for those from the synagogue who “were filled with madness,”'
  - where: 'section 3 plain'
    claim: '“Virtue” in 6:19 is the Greek word for power'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'virtue: The Greek term is the word for power (dynamis),65 the same term that appears in 8:46, which is also translated as virtue'
  - where: 'note 6:1 “Which Sabbath?”'
    claim: 'The best manuscripts read simply “on a Sabbath”; Luke’s point may be that Jesus is Lord of all Sabbaths'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'But the best manuscripts of Luke’s Gospel read simply “on a Sabbath day,” without forming a firm time frame. … Luke’s point may be to lift away from the specific, identifiable moments and thus hammer home the point that Jesus is the universal Lord of all Sabbaths'
  - where: 'note 6:1 “Which Sabbath?”'
    claim: 'Thayer: deuteroprōtos, “second-first,” seems to mean the second of the first sabbaths after Passover; its genuineness is questionable, lacking in Sinaiticus, Vaticanus and others'
    key: thayer
    url: 'https://biblehub.com/greek/1207.htm'
    quote: 'δευτερόπρωτος, δευτερόπρωτον, second-first … in Luke 6:1 seems to be, the second of the first sabbaths after the feast of the Passover … (But the genuineness of the word is questionable. It is lacking in א B L 1, 33, 69 and some other authorities.'
  - where: 'note 6:1 “Which Sabbath?”'
    claim: 'The SBL text reads “on a sabbath” without the word; the Textus Receptus has it'
    key: greek-nt
    url: 'https://biblehub.com/texts/luke/6-1.htm'
    quote: 'SBL Greek New Testament 2010 Ἐγένετο δὲ ἐν σαββάτῳ διαπορεύεσθαι αὐτὸν διὰ σπορίμων'
  - where: 'note 6:1 “Reaping and threshing on a Sabbath”'
    claim: 'Plucking grain on the Sabbath was a generally accepted violation, not a distinctively Pharisaic rule'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'The sense that reaping or plucking grain on the Sabbath would be a violation of Sabbath law “would not, in any way, be a distinctively Pharisaic rule,”[11] but rather would be a generally accepted sense of what was inappropriate on the Sabbath.'
  - where: 'note 6:1 “Reaping and threshing on a Sabbath”'
    claim: 'Deut. 23:25 lets a passer-by pluck by hand, but not as a Sabbath activity'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'There is a provision in the law that “if you enter your neighbor’s grainfield, you may pick kernels with your hands, but you must not put a sickle to their standing grain” (Deuteronomy 23:25 … This would not, however, have been seen as a permissible Sabbath activity.'
  - where: 'note 6:1 “Reaping and threshing on a Sabbath”'
    claim: 'Rubbing the grain counted as threshing and winnowing; the later Mishnah forbids these on the Sabbath'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'Those who object to the disciples rubbing the grains so that the husks fall away anticipate the ruling in the later Mishnah code wherein threshing and winnowing are forbidden on the Sabbath.'
  - where: 'note 6:1 “Reaping and threshing on a Sabbath”'
    claim: 'For Pharisees and most Jews picking and rubbing counted as harvesting, threshing and winnowing'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'they are picking and rubbing the grain heads on a Sabbath day, an important issue for Pharisees and even for most Jews. For them, these actions count as the physical labor needed to harvest, thresh, and winnow grain.'
  - where: 'note 6:5 “Lord of the Sabbath, and its maker”'
    claim: 'The David precedent does not speak to the Sabbath directly; Jesus invokes David’s kingly authority for the disciples'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'This response, found in all the Synoptic Gospels, does not speak to the Sabbath directly … David had the authority to partake of food that normally would have been off-limits, and that same kingly authority is being invoked by Jesus for the disciples'
  - where: 'note 6:5 “Lord of the Sabbath, and its maker”'
    claim: 'Luke has no comment between David and the Son of man saying; the focus is on His authority as Lord'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'Unlike Mark and Matthew, the Gospel of Luke includes no commentary between the comparison to David and the statement that “the Son of man is Lord also of the sabbath” (Luke 6:5).'
  - where: 'note 6:5 “Lord of the Sabbath, and its maker”'
    claim: 'JST Mark 2:27: the Son of man made the Sabbath, therefore He is its Lord'
    key: jst-mark-2
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-mark/2?lang=eng'
    quote: 'For the Son of man made the Sabbath day, therefore the Son of man is Lord also of the Sabbath.'
  - where: 'note 6:5 “Lord of the Sabbath, and its maker”'
    claim: 'The JST makes the Son of man the creator of the Sabbath, equating the title with divinity'
    key: lefevre-christology-jst
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/christology-joseph-smith-translation-gospel'
    quote: 'While declaring the enigmatic Son of man as the creator of the Sabbath, thus equating that title with divinity, the JST maintains the third-person nature of the pronouncement'
  - where: 'note 6:9 “A healing on trial”'
    claim: 'A withered right hand meant doing everything with the left, unclean hand, and likely exclusion from some temple ceremonies'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'This condition means that the man is a social outcast because he has to do everything with his left, unclean hand. … Hence, it is likely that by current custom the man cannot participate in certain ceremonies.'
  - where: 'note 6:9 “A healing on trial”'
    claim: 'Healed, the man is made whole physically, socially and religiously'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'Jesus makes him whole, solving all these difficulties. Hence, in a brief moment, he is healed physically, socially, and religiously.'
  - where: 'note 6:9 “A healing on trial”'
    claim: 'The healing was of a chronic condition, not saving life; Pharisees very likely held it forbidden'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'This act seems to have been viewed as helping someone with a chronic condition rather than as saving life on the Sabbath, the latter of which would have been unquestionably acceptable.'
  - where: 'note 6:9 “A healing on trial”'
    claim: 'Pharisees very likely held healing such ailments forbidden on the Sabbath (Lane quoting Doering)'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'it is very likely that Pharisees in the first century would have considered healing such ailments forbidden on the Sabbath, no matter how they were carried out in detail.'
  - where: 'note 6:9 “A healing on trial”'
    claim: 'Jesus turns the synagogue into a courtroom and produces the evidence that acts of mercy belong on the Sabbath'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'he turns the synagogue into a religious courtroom. Then he produces the evidence—the man’s hand made whole—that acts of mercy belong on the Sabbath.'
  - where: 'note 6:9 “A healing on trial”'
    claim: 'Anoia can mean folly, but here unthinking fury'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'madness: The term (Greek anoia) can mean “ignorance, folly,” but the sense rather depicts “unthinking fury” or “madness.”'
  - where: 'note 6:9 “A healing on trial”'
    claim: 'Luke’s opponents have been seen as more moderate, but they still sought an accusation and were furious'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'To be fair, however, the scribes and Pharisees as depicted in Luke were still seeking to find an accusation against Jesus before the healing (see v. 7), and after he healed the man'
  - where: 'note 6:12 “A night of prayer before the choosing”'
    claim: 'The all-night prayer underscores the importance of the event and continues Luke’s report of Jesus’s habit of prayer'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'Luke’s report of Jesus praying through the night underscores the importance of this particular event and, not surprisingly, continues his earlier insistence about Jesus’ habitual practice (see the Note on 5:16).'
  - where: 'note 6:12 “A night of prayer before the choosing”'
    claim: 'Brown: in the mountain Jesus prays about the Twelve and on behalf of His newly conspiring enemies'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'that dependency ceases when Luke follows Jesus into the mountain where he will pray about the Twelve and on behalf of his newly conspiring enemies.'
  - where: 'note 6:12 “A night of prayer before the choosing”'
    claim: 'Mountains are places of holy communion with God'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'went out into a mountain: Mountains, of course, are known as places of holy communion with God (see Ex. 3:1–4; 19:2–3, 16–20; 24:9–13; Isa. 2:2–3; 1 Ne. 11:1–6; etc.).'
  - where: 'note 6:13 “Named apostles”'
    claim: 'Apostle means one sent forth; the title Jesus gave the Twelve (Luke 6:13); special witnesses'
    key: bd-apostle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/apostle?lang=eng'
    quote: 'The word means “one sent forth.” It was the title Jesus gave (Luke 6:13) to the Twelve … The calling of an Apostle is to be a special witness of the name of Jesus Christ in all the world'
  - where: 'note 6:13 “Named apostles”'
    claim: 'Today twelve men with the same calling form the Quorum of the Twelve'
    key: bd-apostle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/apostle?lang=eng'
    quote: 'Today twelve men with this same divine calling and ordination constitute the Quorum of the Twelve Apostles in The Church of Jesus Christ of Latter-day Saints.'
  - where: 'note 6:13 “Named apostles”'
    claim: 'The naming comes from Jesus; Luke mentions apostles six times in the Gospel and twenty-eight in Acts, Matthew and Mark once each'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'The labeling comes from Jesus, no one else. … he mentions them six times in his Gospel and twenty-eight times in the book of Acts whereas Matthew and Mark each mention them once'
  - where: 'note 6:16 “Simon the Zealot and the two named Judas”'
    claim: 'Zelotes is the Greek of the Aramaic Kanan (Cananean); the Zealots resisted foreign rule'
    key: bd-zelotes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zelotes?lang=eng'
    quote: 'Matthew and Mark in their lists call him “the Cananean” (not Canaanite as in the KJV), which is formed from an Aramaic word (Kanan), of which Zelotes is the Greek and Zealot the English equivalent.'
  - where: 'note 6:16 “Simon the Zealot and the two named Judas”'
    claim: 'The Zealots were a party determined to resist Roman or foreign authority'
    key: bd-zelotes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zelotes?lang=eng'
    quote: 'The Zealots were a party among the Jews (so called from their zeal for the law) who were determined to resist Roman or any foreign authority in Palestine.'
  - where: 'note 6:16 “Simon the Zealot and the two named Judas”'
    claim: 'Judas “not Iscariot,” son or brother of James, probably Thaddaeus'
    key: bd-judas
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judas?lang=eng'
    quote: '“Not Iscariot,” one of the Twelve, also called Judas (son or brother) of James (Luke 6:16; John 14:22; Acts 1:13); probably the same as Lebbaeus or Thaddaeus (Matt. 10:3; Mark 3:18).'
  - where: 'note 6:16 “Simon the Zealot and the two named Judas”'
    claim: 'Iscariot means belonging to Kerioth; the only non-Galilean'
    key: bd-judas
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judas?lang=eng'
    quote: 'Iscariot, meaning “belonging to Kerioth” (Josh. 15:25) in the tribe of Judah, one of “the twelve,” and the only one who was not a Galilean.'
  - where: 'note 6:17 “A level place, and another sermon”'
    claim: 'The plain is Greek “level place”; it recalls Isaiah’s promise quoted in Luke 3:5; the likely spot is the plain of Gennesaret'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'the plain: The Greek expression (ho topos pedinos) means “level place.” … the description recalls clearly the promise of Isaiah that Luke quotes, when introducing the Baptist, that everything in God’s kingdom would be level and inviting and smooth'
  - where: 'note 6:17 “A level place, and another sermon”'
    claim: 'The descent and standing on the plain echo God’s descent on Sinai and Moses’s descent; a new law and a new people with twelve'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'Echoes of the Exodus sound across these verses, beginning of course with the Savior’s descent to the plain and then his standing upon it, just as God descends onto Sinai.'
  - where: 'note 6:17 “A level place, and another sermon”'
    claim: 'Some believe the two sermons are variants of one another'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/the-message-and-context-of-lukes-testimony'
    quote: 'A large number of passages that Matthew and Luke share arises in the Sermon on the Mount (see Matt. 5–7) and the Sermon on the Plain (see 6:20–49), sermons that some believe are variants of one another.'
  - where: 'note 6:17 “A level place, and another sermon”'
    claim: 'Brown: the two sermons tie to different locales about three miles apart'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/the-message-and-context-of-lukes-testimony'
    quote: 'In a word, the two sermons tie to different locales that lie three or so miles apart.'
  - where: 'note 6:17 “A level place, and another sermon”'
    claim: 'Brown: the content lacks basic links; Luke’s beatitudes comfort those who suffer reversals'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/the-message-and-context-of-lukes-testimony'
    quote: 'Concerning content, the two sermons lack basic links to each other. The beatitudes, for instance, are completely different and carry dissimilar messages.'
  - where: 'note 6:17 “A level place, and another sermon”'
    claim: 'The KnoWhy: two separate sermons, different occasions, audiences, places and purposes; simpler remarks to a mixed crowd'
    key: sc-knowhy-659
    url: 'https://scripturecentral.org/knowhy/how-can-we-build-our-foundations-on-a-rock'
    quote: 'these parables may well derive from two separate sermons delivered by Jesus on different occasions to varying audiences, in different locations, and for different purposes.'
  - where: 'note 6:17 “A level place, and another sermon”'
    claim: 'Talmage: Jesus spoke at length on the mountainside, then repeated parts to the multitude on the plain'
    key: talmage-jesus-christ-17
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-17?lang=eng'
    quote: 'Is it not probable that Jesus spoke at length on the mountain-side to the disciples then present, and from whom He had chosen the Twelve, and that after finishing His discourse to them He descended with them to the plain'
  - where: 'note 6:20 “The poor, and those who weep now”'
    claim: 'Brown: the destitute are ground down to humility and receptive to God; “poor in spirit” is narrower than Luke’s saying'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'The destitute situation of such people grinds them down so that they are truly humble and therefore receptive to divine influences, God being their only hope … Matthew preserves the formulation “poor in spirit” (Matt. 5:3), which is not as broad as the saying preserved by Luke.'
  - where: 'note 6:20 “The poor, and those who weep now”'
    claim: 'The poor have no free pass, as D&C 56:17–18 shows'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'In a related vein, those afflicted with poverty do not have a free pass—they are to avoid bad behavior and stand upright, as the Savior points out elsewhere'
  - where: 'note 6:20 “The poor, and those who weep now”'
    claim: 'D&C 56:18: blessed are the poor who are pure in heart'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/56?lang=eng'
    quote: 'But blessed are the poor who are pure in heart, whose hearts are broken, and whose spirits are contrite, for they shall see the kingdom of God coming in power and great glory unto their deliverance'
  - where: 'note 6:20 “The poor, and those who weep now”'
    claim: 'The kingdom reverses the customary order; those who suffer wrongfully will see their fate reversed; JST 6:23 “shall be great in heaven”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'Because Jesus’ kingdom brings a reversal of the customary order, which sees happiness and contentment arising mostly from wealth and influence, those who “endure grief, suffering wrongfully” in this life (1 Pet. 2:19), will experience a reversal of their earthly fate in the next life.'
  - where: 'note 6:24 “Woes, and comfort paid in full”'
    claim: 'Woe translates the Hebrew ’oy, a cry of pain or terror, with a sense of lament'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'This term appears only rarely in idiomatic Greek and seems to be a translation of the Hebrew ‘oy, a cry of pain because of affliction, or of terror because of looming misfortune. The word also carries a sense of lamentation.'
  - where: 'note 6:24 “Woes, and comfort paid in full”'
    claim: 'Brown: Jesus warns or laments over hearers who take their happy circumstances as a reward'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'It seems likely that, beginning with this verse, Jesus is warning, or even lamenting over, some of his hearers who take the happy circumstances in their lives too seriously, as if they are a reward of some sort.'
  - where: 'note 6:24 “Woes, and comfort paid in full”'
    claim: 'Apechō appears in receipts for full payment'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'ye have received your consolation: The Greek verb (apechō) appears in receipts for payment made, referring to full payment.89 Thus, ominously, those to whom Jesus points have received all that will come to them'
  - where: 'note 6:24 “Woes, and comfort paid in full”'
    claim: 'The KnoWhy: covenants set out blessings and cursings; Jesus followed that pattern in the Sermon on the Plain'
    key: sc-knowhy-35
    url: 'https://scripturecentral.org/knowhy/why-does-jacob-declare-so-many-woes'
    quote: 'Both blessings and cursings are also present in the covenant renewal at Mt. Ebal (see Deuteronomy 27–28).'
  - where: 'note 6:24 “Woes, and comfort paid in full”'
    claim: 'The Savior declared blessings and cursings in the Sermon on the Plain'
    key: sc-knowhy-35
    url: 'https://scripturecentral.org/knowhy/why-does-jacob-declare-so-many-woes'
    quote: 'The Savior also followed the pattern of declaring both blessings and cursings in his Sermon on the Plain (Luke 6:17-26).'
  - where: 'note 6:29 “Better than to revile again”'
    claim: 'JST Luke 6:29–30: better to offer the other than to revile again; better to suffer the enemy to take than to contend; the Father will bring that wicked one into judgment'
    key: jst-luke-6
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/6?lang=eng'
    quote: 'or, in other words, it is better to offer the other, than to revile again. … For it is better that thou suffer thine enemy to take these things, than to contend with him. Verily I say unto you, Your heavenly Father who seeth in secret, shall bring that wicked one into judgment.'
  - where: 'note 6:29 “Better than to revile again”'
    claim: 'The JST clarifies and interprets Jesus’s peaceful intent, with D&C 98:23–27'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'the Joseph Smith Translation adds, “or, in other words, it is better to offer the other [cheek], than to revile again,” a statement that both clarifies and interprets Jesus’ peaceful intent (JST 6:29; see D&C 98:23–27).'
  - where: 'note 6:29 “Better than to revile again”'
    claim: 'Brown: tuptō is a hard blow, not merely a slap'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'smiteth thee on the one cheek: The Greek verb tuptō points to a hard blow to the jaw with the fist, not merely a slap.'
  - where: 'note 6:29 “Better than to revile again”'
    claim: 'D&C 98:23: bear it patiently and revile not, and be rewarded'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/98?lang=eng'
    quote: 'if men will smite you, or your families, once, and ye bear it patiently and revile not against them, neither seek revenge, ye shall be rewarded;'
  - where: 'note 6:32 “What thank have ye?”'
    claim: 'Literally “What sort of gift is it to you?”; charis puts the emphasis on giving, not reciprocity; JST “what reward have you”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'The expression, repeated in the next two verses, is literally, “What sort of gift is it to you?” By bringing up the word for “gift” (Greek charis), Jesus lays emphasis not on reciprocity but on giving gifts, pure and simple'
  - where: 'note 6:32 “What thank have ye?”'
    claim: 'The JST reads “what reward have you” in 6:32 and 6:34, close to Matt. 5:46'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'the Joseph Smith Translation adjusts this expression to “what reward have you?” both here and in 6:34 (JST 6:33, 34), a change that brings the reading close to that of Matthew 5:46, “what reward have ye?”'
  - where: 'note 6:32 “What thank have ye?”'
    claim: 'Apelpizō usually means to despair; here to expect nothing in return'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'hoping for nothing again: The Greek verb apelpizō usually means “to despair” but here carries the sense “to expect nothing in return.”'
  - where: 'note 6:36 “Merciful, as your Father is”'
    claim: 'Luke’s “merciful” stands where Matthew has “perfect”; possibly two sermons, but the parallel suggests a link between mercy and becoming perfect'
    key: frederick-merciful
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/your-father-also-merciful'
    quote: 'While it is quite possible that Matthew and Luke are recording two different sermons delivered by Jesus on separate occasions, the similarity in both the language and the central location of each of the statements within their respective discourses suggests a possible link between the development of mercy and becoming “perfect.”'
  - where: 'note 6:36 “Merciful, as your Father is”'
    claim: 'To love enemies is to do what Jesus does: extend mercy where justice would dictate harsher punishment'
    key: frederick-merciful
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/your-father-also-merciful'
    quote: 'In issuing a command to “love your enemies” (Luke 6:27), Jesus is asking the disciples to do what he does: to extend love and mercy to those for whom justice would otherwise dictate a harsher punishment.'
  - where: 'note 6:36 “Merciful, as your Father is”'
    claim: 'Imitating the merciful Father is at the center of what Jesus teaches'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'Imitating the Father, who showers divine mercy on his people, lies at the center of what Jesus is trying to teach his hearers, as these words disclose.'
  - where: 'note 6:36 “Merciful, as your Father is”'
    claim: '“Children of the Highest” is almost a title; it echoes “Son of the Highest” (1:32) and implies close association with Father and Son (Mosiah 5:7)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'The language is almost formulaic, as if it highlights a celestial title of some sort that designates a special status beyond a person’s mere presence in heaven. This meaning adheres to the angel’s words to Mary about her child'
  - where: 'note 6:37 “Judge not, condemn not, forgive”'
    claim: 'Two kinds of judging: final, forbidden; intermediate, on righteous principles'
    key: oaks-judge-not
    url: 'https://www.churchofjesuschrist.org/study/ensign/1999/08/judge-not-and-judging?lang=eng'
    quote: 'There are two kinds of judging: final judgments, which we are forbidden to make, and intermediate judgments, which we are directed to make, but upon righteous principles.'
  - where: 'note 6:37 “Judge not, condemn not, forgive”'
    claim: 'Forgiveness is the companion principle; Elder Oaks quotes Luke 6:37 and D&C 64:10'
    key: oaks-judge-not
    url: 'https://www.churchofjesuschrist.org/study/ensign/1999/08/judge-not-and-judging?lang=eng'
    quote: 'Sixth, forgiveness is a companion principle to the commandment that in final judgments we judge not and in intermediate judgments we judge righteously. The Savior taught, “Judge not, and ye shall not be judged: condemn not, and ye shall not be condemned: forgive, and ye shall be forgiven” (Luke 6:37).'
  - where: 'note 6:37 “Judge not, condemn not, forgive”'
    claim: 'The Greek is an emphatic negation: they will absolutely not be judged'
    key: frederick-merciful
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/your-father-also-merciful'
    quote: 'Jesus is not merely predicting that the disciples will not be condemned or judged, he is stating that they will absolutely not be judged or condemned.'
  - where: 'note 6:37 “Judge not, condemn not, forgive”'
    claim: 'The Lord treats us as we treat others; “grace for grace” replaces “an eye for an eye”'
    key: frederick-merciful
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/your-father-also-merciful'
    quote: 'If we choose to judge and condemn others, holding grudges and withholding forgiveness, he will treat with a similar judgment. Yet if we offer our forgiveness and mercy to all, he will shower us with mercy and forgiveness as well.'
  - where: 'note 6:37 “Judge not, condemn not, forgive”'
    claim: 'The measure is of grain, pressed and shaken till it can hold no more'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/6.htm'
    quote: 'Good measure, pressed down.—The imagery clearly points to a measure of grain, so pressed and shaken that it could hold no more.'
  - where: 'note 6:37 “Judge not, condemn not, forgive”'
    claim: 'The bosom is the fold of the robe over the chest, used as a pocket'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/6.htm'
    quote: 'Into your bosom.—The large fold of an Eastern dress over the chest, often used as a pocket.'
  - where: 'note 6:40 “Fully trained, like the teacher”'
    claim: 'Katartizō means properly prepared, fully trained; not the word teleios'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'every one that is perfect: The sense of the verb (Greek katartizō) is “properly prepared, fully trained.”110 The spelling of this verb does not tie with the Greek adjective translated elsewhere as “perfect” (Greek teleios; see Matt. 5:48; Eph. 4:13; etc.).'
  - where: 'note 6:40 “Fully trained, like the teacher”'
    claim: 'Verse 40 is the linchpin between the blind guide and the beam; the disciple cannot become the master without addressing his own weaknesses'
    key: belnap-wise-man
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/wise-man-built-his-house-upon-rock'
    quote: 'the location of this verse in the middle of the sequence suggests that Jesus was teaching that the disciple, like the blind guide and the hypocrite, cannot become the master because of his inability to address his own weaknesses.'
  - where: 'note 6:40 “Fully trained, like the teacher”'
    claim: 'The disciple who acknowledges Jesus as master is to become like him (6:40, 46)'
    key: frederick-merciful
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/your-father-also-merciful'
    quote: 'If you choose discipleship and acknowledge him as your master, then it is your responsibility to become like him, for, as he had previously said, “every one that is perfect shall be as his master” (6:40).'
  - where: 'note 6:46 “Calling Him Lord”'
    claim: 'Brown: a disconnect between calling Him Lord in words and denying His lordship in actions'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'Jesus nods toward a potential disconnect within a follower who, in words, acknowledges that the Savior is “Lord, Lord” but, in actions, denies his lordship (see 13:25; D&C 41:5).'
  - where: 'note 6:46 “Calling Him Lord”'
    claim: 'Luke ties the trees to the heart: words come from inner intent'
    key: belnap-wise-man
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/wise-man-built-his-house-upon-rock'
    quote: 'Luke ties it back to man’s nature: “A good man out of the good treasure of his heart bringeth forth that which is good … With this insight, we are taught that words that one speaks are often the direct result of our inner intent.'
  - where: 'note 6:46 “Calling Him Lord”'
    claim: 'A rotten heart will not produce good works; Jesus expects righteous desires as well as actions'
    key: frederick-merciful
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/your-father-also-merciful'
    quote: 'A rotten tree will not produce good fruit, and a rotten heart will not produce good works. … for Jesus expects more than just righteous action: he expects righteous desires and attitudes as well.'
  - where: 'note 6:48 “Digging down to the rock”'
    claim: 'The KnoWhy: some must dig down to learn more; others look up to the rock'
    key: sc-knowhy-659
    url: 'https://scripturecentral.org/knowhy/how-can-we-build-our-foundations-on-a-rock'
    quote: 'Symbolically speaking, some audience members would first need to dig down to learn more, while others would simply need to look up to the rock of protection they had been provided.'
  - where: 'note 6:48 “Digging down to the rock”'
    claim: 'Those new to the path dig down, establishing a foundation of basic gospel knowledge and covenants centered in Christ'
    key: sc-knowhy-659
    url: 'https://scripturecentral.org/knowhy/how-can-we-build-our-foundations-on-a-rock'
    quote: 'Yet those who are new to the path or seeking to get back on it must dig down, working to establish a strong foundation of basic gospel knowledge and preliminary gospel covenants centered in Christ.'
  - where: 'note 6:48 “Digging down to the rock”'
    claim: 'Two Greek verbs give “digged deep”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'digged deep: Hellenistic-style homes in Palestine often featured a basement and stone walls with a tile roof.121 Two verbs stand together here that give the sense of digging deep (Greek skaptō and bathynō).'
  - where: 'note 6:48 “Digging down to the rock”'
    claim: 'The other builder has also come and heard; he is not called foolish'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'Jesus’ words imply that the person has come to him, as he notes in 6:47. The difference, of course, lies in the doing or not doing. Unlike his teaching in Matthew 7:26–27, Jesus does not call the unresponsive person “foolish”'
