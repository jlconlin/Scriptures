    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/israels-ancient-psalms'
    quote: 'seems to indicate that the word “poor” in the foregoing context had, by the second or first century BC, become “a synonym for hasid, ‘pious’ or ‘saintly’ in the best senses.'
