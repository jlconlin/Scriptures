chapter: 10
claims:
  # ---- setting, thread
  - where: setting
    claim: 'On the way, Samaritans refused Jesus hospitality and James and John wanted to call down fire; Jesus rebuked them'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'Some of the Samaritans, recognizing Jesus and his disciples as Jews, evidently deprived them of customary elements of hospitality, such as provisions and lodging. [20] In response, two of the leading disciples, James and John, sought permission to call down fire from heaven'
  - where: setting
    claim: 'Martha’s house was probably in Bethany near Jerusalem, while Luke 17:11 has Jesus in Samaria again: Luke’s order on the journey is not a route'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'These verses suggest that either Jesus traveled back and forth between certain points while eventually making his way to Jerusalem or that there are some discrepancies in Luke’s ordering of these events.'
  - where: setting
    claim: 'The Seventy go “before his face,” the word that ties their mission to Jesus setting His face toward Jerusalem (9:51)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'The word for “face” (Greek prosōpon) connects with Luke’s note that Jesus “set his face to go to Jerusalem” (9:51).'
  - where: setting
    claim: 'The parable and the story of the sisters are out of place geographically and chronologically, but fit together'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'Moreover, both the parable and the story are geographically out of place, and therefore they are out of place chronologically. But they fit together'
  - where: thread
    claim: 'The Seventy, ordinary men, carry real power; the priest and Levite, with authority by birth, lose moral authority while the despised Samaritan wins it; the old order is upset'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'Jesus portrays those who hold authority conferred on them by birth—the priest and Levite—as diminished in moral authority, whereas the despised one, the Samaritan, dramatically wins such authority through his actions'
  - where: thread
    claim: 'The parable shows what it is to love one’s neighbor, the story of Martha and Mary what it is to love the Lord'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'Because the parable illustrates what it means to love one’s neighbor and the account of Mary and Martha demonstrates what it means to love the Lord.'
  - where: thread
    claim: 'The Seventy are not to rejoice in their power but in their names written in heaven'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'Even so, although the Seventy possess genuine power from Jesus, they are not to rejoice in that power but that their “names are written in heaven” (10:20).'

  # ---- notes
  - where: 'note 10:1 “The other seventy”'
    claim: 'Some early manuscripts read seventy-two; the earliest, P75, reads seventy; the number comes from the table of nations in Genesis 10; seventy is original'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'Some early manuscripts of this verse record the number seventy-two, though the earliest, P75, reads seventy. This number derives from the list of names in the table of gentile nations in Genesis 10.'
  - where: 'note 10:1 “The other seventy”'
    claim: 'The Septuagint’s Genesis 10 has seventy-two names; Brown judges seventy original'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'the Septuagint version of Genesis 10 repeats seventy-two names rather than the seventy of the Hebrew text, adding names in Genesis 10:2 and 10:22. … But the number seventy is original.'
  - where: 'note 10:1 “The other seventy”'
    claim: 'The SBL edition of the Greek prints “seventy-two”'
    key: greek-nt
    url: 'https://biblehub.com/texts/luke/10-1.htm'
    quote: 'SBL Greek New Testament 2010 Μετὰ δὲ ταῦτα ἀνέδειξεν ὁ κύριος καὶ ἑτέρους ἑβδομήκοντα δύο'
  - where: 'note 10:1 “The other seventy”'
    claim: 'Moses’ seventy elders saw God at the covenant meal and received the Spirit to share Moses’ burden (Ex. 24:9–11; Num. 11:16, 24–25)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'For “seventy of the elders of Israel” ascend the holy mount with Moses and, in a covenant meal accompanied by a stunning vision of Jehovah, ratify the covenant that Moses receives (Ex. 24:9–11).'
  - where: 'note 10:1 “The other seventy”'
    claim: 'Jesus gives the Seventy the same charge as the Twelve: to heal, preach and cast out devils'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'In essence, Jesus gives to the Seventy the same charge that he does to the Twelve, that is, to heal and to preach (see 10:9) as well as to cast out devils'
  - where: 'note 10:1 “The other seventy”'
    claim: 'Going two by two is the pattern Mark gives for the Twelve and the modern revelation repeats (D&C 52:10)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'Jesus here establishes the proper pattern for service: sent by the Savior and going two by two. According to Mark, Jesus also sends the Twelve “by two and two,”'
  - where: 'note 10:1 “The other seventy”'
    claim: 'D&C 107:25 and 107:34: the Seventy are especial witnesses to the Gentiles and in all the world, under the direction of the Twelve'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/107?lang=eng'
    quote: 'The Seventy are also called to preach the gospel, and to be especial witnesses unto the Gentiles and in all the world'
  - where: 'note 10:4 “Salute no man by the way”'
    claim: 'The command rests on the urgency of the message, as with Elisha’s charge to Gehazi (2 Kgs. 4:29); they are not to stop for leisurely acquaintance'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'But the proper sense seems to rest on the urgency of the message that the Seventy will carry (compare 2 Kgs. 4:29). They are to be about the work of the kingdom and are not to stop and leisurely make or remake acquaintances.'
  - where: 'note 10:4 “Salute no man by the way”'
    claim: 'Purse, scrip and shoes: the message is “go as you are”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'In both cases, the message is, “Go as you are” (see the Note on 9:3).'
  - where: 'note 10:6 “A son of peace”'
    claim: 'The greeting is probably shalom, and from the Savior it carries heavenly peace'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'The word that Jesus speaks is probably shalom. But the sense is broader than a simple greeting or a hope for another’s well being. From the Savior, it carries the meaning of heavenly peace'
  - where: 'note 10:6 “A son of peace”'
    claim: '“A son of peace,” like “children of light,” points to a status conferred by God, not a quality the person already has'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'If this understanding is accurate, the designation “son of peace” refers to an acquired or conferred status in the eyes of God, not a quality that a person already possesses.'
  - where: 'note 10:6 “A son of peace”'
    claim: 'The peace the Seventy carry can be bestowed and withdrawn'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'The peace that the Seventy carry can be bestowed by them, and withdrawn, disclosing an extraordinary quality of this peace that comes only from the divine world.'
  - where: 'note 10:7 “Eat such things as they give”'
    claim: 'They are not to shop for better lodging; JST 10:7 reads “in whatsoever house they receive you, remain”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'They are not to shop around for better accommodations (see the Note on 9:4). The Joseph Smith Translation supports this view, changing the opening expression of this verse to read, “in whatsoever house they receive you, remain” (JST 10:7).'
  - where: 'note 10:7 “Eat such things as they give”'
    claim: 'Brown reads the twice-given instruction on food as Jesus suspending the food laws so the Seventy can accept gentile hospitality'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'Perhaps because Jesus knows that his disciples will naturally resist foods that do not accord with Jewish laws, he repeats the suspension of those laws so that the Seventy can accept the hospitality of gentile hosts (see 10:7).'
  - where: 'note 10:7 “Eat such things as they give”'
    claim: 'D&C 107:25 calls the Seventy especial witnesses to the Gentiles; Brown ties the Seventy’s mission to Gentiles'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'Apart from setting out Jesus’ interest in Gentiles by reporting his sending of the Seventy disciples among them (see D&C 107:25)'
  - where: 'note 10:11 “The very dust of your city”'
    claim: 'The Seventy are to wipe the dust off publicly, in the streets, unlike the private withdrawal asked of modern missionaries'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'here he instructs the Seventy to make their departure a public matter so that citizens will see their actions'
  - where: 'note 10:11 “The very dust of your city”'
    claim: 'Some Jews viewed gentile ground as unclean; the dust is treated as if it could stain'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'as if the dust possesses staining power (10:11; see Acts 13:51). In the case of gentile towns and territory, some Jews view their ground as unclean'
  - where: 'note 10:11 “The very dust of your city”'
    claim: 'D&C 60:15: shake off the dust not in their presence but in secret, as a testimony in the day of judgment'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/60?lang=eng'
    quote: 'And shake off the dust of thy feet against those who receive thee not, not in their presence, lest thou provoke them, but in secret; and wash thy feet, as a testimony against them in the day of judgment.'
  - where: 'note 10:11 “The very dust of your city”'
    claim: 'Even in rejection the message is the same: the kingdom has come near; the words are a testimony to repeat'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'Jesus hands to the Seventy the very words that he wants them to repeat, apparently without variation. The first part of the saying will draw attention to their action; the second part will consist of their testimony.'
  - where: 'note 10:13 “Chorazin, Bethsaida and Capernaum”'
    claim: 'Chorazin: mighty works were done there of which no record is preserved'
    key: bd-chorazin
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/chorazin?lang=eng'
    quote: 'A town north of the Sea of Galilee, in which some of our Lord’s mighty works were done (of which no record is preserved) and that was rebuked for its unbelief'
  - where: 'note 10:13 “Chorazin, Bethsaida and Capernaum”'
    claim: 'The Bethsaida denounced was probably Philip’s pagan capital, not the fishermen’s town'
    key: bd-bethsaida
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/bethsaida?lang=eng'
    quote: 'When Jesus denounced Bethsaida for its unbelief (Matt. 11:21; Luke 10:13), He probably referred to the pagan city (Philip’s capital), not to the older city, composed largely of fishermen settled on the shore of the lake.'
  - where: 'note 10:13 “Chorazin, Bethsaida and Capernaum”'
    claim: 'D&C 45:54 uses “tolerable” of those who knew no law'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'they that knew no law shall have part in the first resurrection; and it shall be tolerable for them.'
  - where: 'note 10:13 “Chorazin, Bethsaida and Capernaum”'
    claim: 'JST 10:12 reads “in the day of judgment”; Sodom is the symbol of communities that turn from God'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'The Joseph Smith Translation strengthens this sense by changing this expression to read: “in the day of judgment” (JST 10:12).'
  - where: 'note 10:18 “Satan as lightning”'
    claim: 'Talmage: said of the expulsion of the son of the morning after his defeat by Michael'
    key: talmage-jesus-christ-26
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-26?lang=eng'
    quote: 'This was said with reference to the expulsion of the rebellious son of the morning, after his defeat by Michael and the heavenly hosts.'
  - where: 'note 10:18 “Satan as lightning”'
    claim: 'D&C 76:25–27: Lucifer, who rebelled against the Son, was thrust down; “he is fallen”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/76?lang=eng'
    quote: 'who rebelled against the Only Begotten Son whom the Father loved and who was in the bosom of the Father, was thrust down from the presence of God and the Son,'
  - where: 'note 10:18 “Satan as lightning”'
    claim: 'The Seventy’s mission weakens Satan’s kingdom and topples him, though not permanently'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'The actions of the Seventy during their mission evidently weaken or shake the foundations of Satan’s kingdom, an entity that exists, thus toppling him, though not permanently'
  - where: 'note 10:18 “Satan as lightning”'
    claim: 'Brown renders “I began to see Satan fall”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: '“I began to see Satan fall from heaven like lightning.'
  - where: 'note 10:18 “Satan as lightning”'
    claim: 'Talmage: serpents and scorpions include immunity in the path of duty and power over wicked spirits'
    key: talmage-jesus-christ-26
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-26?lang=eng'
    quote: 'The promise that they should tread on serpents and scorpions included immunity from injury by venomous creatures if encountered in the path of duty and power to prevail over the wicked spirits that serve the devil'
  - where: 'note 10:20 “Names written in heaven”'
    claim: 'The book of life: a heavenly record is kept of the faithful, whose names are recorded (D&C 88:2; 128:7)'
    key: bd-book-of-life
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/book-of-life?lang=eng'
    quote: 'However, the scriptures indicate that a heavenly record is kept of the faithful, whose names are recorded, as well as an account of their righteous deeds (D&C 88:2; 128:7).'
  - where: 'note 10:20 “Names written in heaven”'
    claim: 'The Seventy are not to rejoice in their power but in their names written in heaven'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'Even so, although the Seventy possess genuine power from Jesus, they are not to rejoice in that power but that their “names are written in heaven” (10:20).'
  - where: 'note 10:21 “From them who think they are wise”'
    claim: 'JST Luke 10:22 reads “from them who think they are wise and prudent”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/10?lang=eng'
    quote: 'JST Luke 10:22 … from them who think they are wise and prudent …'
  - where: 'note 10:21 “From them who think they are wise”'
    claim: 'The disciples are the “babes”; knowing who Jesus is rests on revelation from the Father, joined to their long loyalty'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'In Jesus’ parlance, the disciples are the “babes” to whom hidden things are “revealed” (10:21). In a word, their eyes see.'
  - where: 'note 10:21 “From them who think they are wise”'
    claim: 'Grasping who Jesus is rests on revelation, not on chance meeting, and on loyalty over time'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'Plainly, it is a combination of their unflinching loyalty, unfurled over a length of time, and the disclosure of the Father that brings them to comprehend who he truly is.'
  - where: 'note 10:22 “The Son is the Father”'
    claim: 'JST Luke 10:23: “that the Son is the Father, and the Father is the Son, but him to whom the Son will reveal it”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/10?lang=eng'
    quote: 'JST Luke 10:23 … that the Son is the Father, and the Father is the Son, but him to whom the Son will reveal it.'
  - where: 'note 10:22 “The Son is the Father”'
    claim: 'The JST does not make the Son identical with the Father; the opening “all things are delivered to me of my Father” stands; the sense is Jesus as the Father by divine investiture of authority'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'The change takes the meaning in a completely different direction, identifying the Son as the Father, but not in the sense that the Son is identical with his father. For the opening of the verse remains the same and clarifies this point'
  - where: 'note 10:22 “The Son is the Father”'
    claim: 'The Son alone can reveal these depths of His nature'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'And no one knows this aspect of Jesus’ nature. “There are depths in the being of our Lord that his followers cannot plumb.” The Son alone can reveal such depths.'
  - where: 'note 10:22 “The Son is the Father”'
    claim: 'The 1916 exposition: Jesus is called Father by divine investiture; the Father placed His name on the Son; His words and acts are the Father’s'
    key: father-and-son-1916
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/04/the-father-and-the-son?lang=eng'
    quote: 'Thus the Father placed His name upon the Son; and Jesus Christ spoke and ministered in and through the Father’s name; and so far as power, authority, and godship are concerned His words and acts were and are those of the Father.'
  - where: 'note 10:22 “The Son is the Father”'
    claim: 'The exposition: this does not change the literal relationship of Father and Son'
    key: father-and-son-1916
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/04/the-father-and-the-son?lang=eng'
    quote: 'None of these considerations, however, can change in the least degree the solemn fact of the literal relationship of Father and Son between Elohim and Jesus Christ.'
  - where: 'note 10:25 “A certain lawyer”'
    claim: 'A lawyer was equivalent to a scribe, a student and teacher of the law and the traditions of the elders'
    key: bd-lawyer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/lawyer?lang=eng'
    quote: 'In the New Testament, equivalent to scribe, one who was by profession a student and teacher of the law, including the written law of the Pentateuch, and also “the traditions of the elders”'
  - where: 'note 10:25 “A certain lawyer”'
    claim: '“Tempted” (ekpeirazō) here means testing, not necessarily with sinister intent'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'The sense of the verb (Greek ekpeirazō) is that the lawyer is testing Jesus, but not with sinister intent, although the word can bear this meaning.'
  - where: 'note 10:25 “A certain lawyer”'
    claim: 'To inherit is to become a rightful heir; inheriting eternal life is becoming heir to God’s life'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'means becoming a rightful heir of a special quality of life, even God’s life'
  - where: 'note 10:25 “A certain lawyer”'
    claim: '“Willing to justify himself”: Luke’s note is condemnatory; the lawyer wants to show himself upright in his own eyes'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'Luke’s note is clearly condemnatory.'
  - where: 'note 10:27 “Thy neighbour as thyself”'
    claim: 'The lawyer joins Deut. 6:5 and Lev. 19:18; his idea of neighbor includes only fellow Jews'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'Thus, the lawyer skillfully brings together important commandments from different parts of the law. But his understanding of who a neighbor is includes only fellow Jews, not foreigners, and certainly not Samaritans.'
  - where: 'note 10:27 “Thy neighbour as thyself”'
    claim: 'The double command appears in other contexts in Matthew and Mark; Jesus often repeats himself rather than these being one event'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'Because this double command arises in different contexts in the other synoptic Gospels (see Matt. 22:34–40; Mark 12:28–34), it is tempting to see the origins of the accounts as the same'
  - where: 'note 10:27 “Thy neighbour as thyself”'
    claim: 'The parable answers both of the lawyer’s questions, eternal life and who is a neighbor'
    key: welch-good-samaritan
    url: 'https://byustudies.byu.edu/article/the-good-samaritan-a-type-and-shadow-of-the-plan-of-salvation'
    quote: 'People usually think of it as answering only the second, technical question, “Who is my neighbour?” But this story also addresses, even more deeply, the first and more important inquiry, “What shall I do to inherit eternal life?”'
  - where: 'note 10:30 “The road down to Jericho”'
    claim: 'Leaving Jerusalem is always going down; the Roman road ran down through the Wadi Qelt to New Testament Jericho'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'The Roman road from Jerusalem runs down through Wadi Qelt and brings travelers to the mouth of this canyon at New Testament Jericho'
  - where: 'note 10:30 “The road down to Jericho”'
    claim: 'The man travels alone on a dangerous road, against the custom of traveling with others'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'Part of the surprise of the story, and therefore its interest, grows out of this man and the others traveling alone on a dangerous road, acts that stand against the custom of traveling with others'
  - where: 'note 10:30 “The road down to Jericho”'
    claim: '“Thieves” (lēstēs) means violent robbers and bandits'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'The word (Greek lēstēs) points to those who commit violent crimes, such as robbers and bandits, rather than petty crimes'
  - where: 'note 10:30 “The road down to Jericho”'
    claim: 'The risks of this road were well known to all in Jesus’ day'
    key: welch-good-samaritan
    url: 'https://byustudies.byu.edu/article/the-good-samaritan-a-type-and-shadow-of-the-plan-of-salvation'
    quote: 'the person apparently feels that the journey is worth the obvious risks of such travel, which were well known to all people in Jesus’ day.'
  - where: 'note 10:31 “Passed by on the other side”'
    claim: 'The priest is likely going home toward Jericho after his week at the temple'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'The priest is evidently returning to his home, likely in Jericho where homes of priests are identified, following his semi-annual week of duties at the temple'
  - where: 'note 10:31 “Passed by on the other side”'
    claim: 'Possible motives: hurry, fear of bandits, ritual purity; the law forbids priests to touch the dead except close family (Lev. 21:1–4)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'For the Mosaic law forbids priests from such profaning acts, except if the dead person is a close family member (see Lev. 21:1–4). The situation with the Levite is more complex.'
  - where: 'note 10:31 “Passed by on the other side”'
    claim: 'The parable gives no reason why they do not help'
    key: welch-good-samaritan
    url: 'https://byustudies.byu.edu/article/the-good-samaritan-a-type-and-shadow-of-the-plan-of-salvation'
    quote: 'The parable gives no reason why they do not help.'
  - where: 'note 10:31 “Passed by on the other side”'
    claim: 'JST 10:33 adds “for they desired in their hearts that it might not be known that they had seen him”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'then augments the whole expression by inserting, “for they [the priest and Levite] desired in their hearts that it might not be known that they had seen him” (JST 10:33).'
  - where: 'note 10:31 “Passed by on the other side”'
    claim: 'The Levite comes and looks, closer than the priest, and then also passes by'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'The Levite is at least curious enough to examine, from a pace or two away, the injured man. But he refuses to touch him, possibly from fear of becoming ritually unclean by touching the dead.'
  - where: 'note 10:33 “A certain Samaritan”'
    claim: 'Samaritans were part Israelite, part gentile, with a rival temple on Gerizim, and bitter opponents of the Jews'
    key: bd-samaritans
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samaritans?lang=eng'
    quote: 'The population was therefore partly Israelite and partly gentile. … they became, as the books of Ezra and Nehemiah show, bitter opponents of the Jews, and started a rival temple of their own on Mount Gerizim.'
  - where: 'note 10:33 “A certain Samaritan”'
    claim: 'Some of Jesus’ closest followers had lately shown hostility to Samaritans on the road; John later preached in Samaritan villages (Acts 8:25)'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'particularly as we remember that some of Jesus’s closest followers had lately shown hostility toward Samaritans as they traveled with him on the way to Jerusalem.'
  - where: 'note 10:33 “A certain Samaritan”'
    claim: 'John later preached in many Samaritan villages and conferred the Holy Ghost there'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'we do know from the book of Acts that John later “preached the gospel in many villages of the Samaritans” and conferred the gift of the Holy Ghost upon those who were baptized (Acts 8:25; see also vv. 14−17).'
  - where: 'note 10:33 “A certain Samaritan”'
    claim: 'The lawyer seems unable to say the word “Samaritan”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'The lawyer seems not to want to say that the person who shows mercy in Jesus’ story is a Samaritan whom Jews of the day deeply despise. It is as if he is unable to utter the word “Samaritan.”'
  - where: 'note 10:33 “The Samaritan as Christ”'
    claim: 'Irenaeus and Clement in the second century saw the Samaritan as Christ saving the fallen victim; Origen said it came from one of the elders'
    key: welch-good-samaritan
    url: 'https://byustudies.byu.edu/article/the-good-samaritan-a-type-and-shadow-of-the-plan-of-salvation'
    quote: 'Writing in the second century a.d., Irenaeus16 and Clement of Alexandria17 both saw the Good Samaritan as symbolizing Christ himself saving the fallen victim from the wounds of sin. Origen, only a few years later, stated that this interpretation came down to him from “one of the elders,”'
  - where: 'note 10:33 “The Samaritan as Christ”'
    claim: 'Writers across the early Christian world maintained the allegorical reading'
    key: welch-good-samaritan
    url: 'https://byustudies.byu.edu/article/the-good-samaritan-a-type-and-shadow-of-the-plan-of-salvation'
    quote: 'Moreover, writers in all parts of the early Christian world fundamentally maintained this allegorical interpretation.'
  - where: 'note 10:33 “The Samaritan as Christ”'
    claim: 'Chrysostom: as a Samaritan is not from Judea, Christ is not of this world'
    key: welch-good-samaritan
    url: 'https://byustudies.byu.edu/article/the-good-samaritan-a-type-and-shadow-of-the-plan-of-salvation'
    quote: 'Chrysostom suggested that a Samaritan is a particularly apt representative of Christ because “as a Samaritan is not from Judea, so Christ is not of this world.”'
  - where: 'note 10:33 “The Samaritan as Christ”'
    claim: '“Had compassion” is literally moved in the bowels; the word is used in the New Testament of God’s or Christ’s mercy'
    key: welch-good-samaritan
    url: 'https://byustudies.byu.edu/article/the-good-samaritan-a-type-and-shadow-of-the-plan-of-salvation'
    quote: 'This Greek word is used elsewhere in the New Testament only in sentences that describe God’s or Christ’s emotions of mercy.'
  - where: 'note 10:33 “The Samaritan as Christ”'
    claim: 'Splanchnizomai stands behind Jesus raising the widow’s son (7:13) and the father of the prodigal (15:20)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'The verb (Greek splanchnizomai) undergirds Jesus’ raising of the widow’s only son (see 7:13), his feeding of the five thousand, though the verb does not appear in Luke’s story (see Matt. 14:14; Mark 6:34), and the father’s actions in Jesus’ parable of the prodigal son (see 15:20).'
  - where: 'note 10:33 “The Samaritan as Christ”'
    claim: 'In Latter-day Saint terms the parable can be read as a type of the plan of salvation; this adds to and does not replace the plain meaning'
    key: welch-good-samaritan
    url: 'https://byustudies.byu.edu/article/the-good-samaritan-a-type-and-shadow-of-the-plan-of-salvation'
    quote: 'In LDS terms, it may be seen even more expansively as a type and shadow of the eternal plan of salvation. This article explores and embraces the allegorical layer of signification and shows how a deeper level of meaning does not detract from the conventional understanding'
  - where: 'note 10:33 “The Samaritan as Christ”'
    claim: 'The traveler as Adam and humankind, going down from Jerusalem to Jericho like the Fall; the inn as the Church'
    key: sc-knowhy-667
    url: 'https://scripturecentral.org/knowhy/how-does-the-parable-of-the-good-samaritan-teach-us-about-the-plan-of-salvation'
    quote: 'Such a shift from an elevated place of glory (Jerusalem) to the lowest city on earth (Jericho) is a fitting analogy for the fall of Adam and Eve.'
  - where: 'note 10:33 “The Samaritan as Christ”'
    claim: 'Half dead: the first death suffered, the second still avertable (Welch’s Latter-day Saint reading)'
    key: welch-good-samaritan
    url: 'https://byustudies.byu.edu/article/the-good-samaritan-a-type-and-shadow-of-the-plan-of-salvation'
    quote: 'But the traveler is only half dead; the second death (permanent separation from God) can still be averted.'
  - where: 'note 10:33 “The Samaritan as Christ”'
    claim: 'Oil and wine as first aid: oil softens the wound, wine disinfects; allegorically, the oil of healing and ordinances and the blood of Christ'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'Olive oil, of course, possesses the property of keeping the tissue of a wound soft so that it heals more rapidly. Wine, with its alcohol content, acts as a mild disinfectant.'
  - where: 'note 10:33 “The Samaritan as Christ”'
    claim: 'The earliest Christian interpretation associates the wine with the blood of Christ'
    key: welch-good-samaritan
    url: 'https://byustudies.byu.edu/article/the-good-samaritan-a-type-and-shadow-of-the-plan-of-salvation'
    quote: 'The earliest Christian interpretation associates this wine with the blood of Christ, “the blood of David’s vine” (Clement), an idea with which Latter-day Saints would readily identify.'
  - where: 'note 10:33 “The Samaritan as Christ”'
    claim: 'Early Christians read the inn as the church'
    key: welch-good-samaritan
    url: 'https://byustudies.byu.edu/article/the-good-samaritan-a-type-and-shadow-of-the-plan-of-salvation'
    quote: 'Inn. For the early Christians this element readily symbolized “the church,” “the holy church,” or “the universal church” of God.'
  - where: 'note 10:33 “The Samaritan as Christ”'
    claim: 'Some scholars reject the allegorical approach; Brown judges Welch’s case compelling'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'Although some scholars flatly reject this approach,93 John W. Welch has made a compelling case that not only do early Church writers view the parable this way'
  - where: 'note 10:35 “When I come again”'
    claim: 'The two pence are denarii; a denarius was a day’s wage and would pay for about twelve days’ care'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'The Roman coin is a denarius. One denarius, the typical payment for one day’s work, though the amount varies and may be less in Palestine, will pay for about twelve days’ care in that era'
  - where: 'note 10:35 “When I come again”'
    claim: 'The Samaritan is evidently a regular customer whom the innkeeper trusts'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'Plainly, the Samaritan is a regular customer at the inn so that the innkeeper trusts his promise.'
  - where: 'note 10:35 “When I come again”'
    claim: 'The word for “come again” is otherwise used only in Luke 19:15, of the lord returning to judge'
    key: sc-knowhy-667
    url: 'https://scripturecentral.org/knowhy/how-does-the-parable-of-the-good-samaritan-teach-us-about-the-plan-of-salvation'
    quote: 'employing a somewhat unique word in the New Testament that is found only here and in Luke 19:15, referring to the time “when the Lord would return to judge the people.”'
  - where: 'note 10:35 “When I come again”'
    claim: 'Thayer lists epanerchomai (G1880) only at Luke 10:35 and 19:15'
    key: thayer
    url: 'https://biblehub.com/greek/1880.htm'
    quote: 'ἐπανέρχομαι; 2 aorist ἐπανηλθον; to return, come back again: Luke 10:35; Luke 19:15.'
  - where: 'note 10:35 “When I come again”'
    claim: '“Repay” (apodidomai) is also the word for God’s reward of the righteous; the innkeeper is assured of reward'
    key: welch-good-samaritan
    url: 'https://byustudies.byu.edu/article/the-good-samaritan-a-type-and-shadow-of-the-plan-of-salvation'
    quote: 'it is also the word used in Matthew 6:4, 18, speaking of God’s great rewards to the righteous (he “shall reward thee openly”), and in Matthew 16:27 (“he shall reward every man according to his works”)'
  - where: 'note 10:36 “Which was neighbour?”'
    claim: 'By asking who was neighbor to the man, Jesus expands the meaning of neighbor'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'By asking the question with this definition of the term “neighbor,” Jesus expands the meaning far beyond merely those who reside close to a person’s home or who form one’s circle of acquaintances.'
  - where: 'note 10:36 “Which was neighbour?”'
    claim: 'The Samaritan chose to love the person perhaps hardest for him to love'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'The unlikely protagonist of the story, a Samaritan, chose to show kindness to a Jew, whose nation despised and denigrated Samaritans. In other words, he chose to love a person who perhaps was the most difficult person for him to love.'
  - where: 'note 10:38 “Martha’s house”'
    claim: 'The sisters lived in Bethany in Judea (John 11:1); this Mary is not Mary Magdalene'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'The two women are known as sisters and as residents of Bethany in Judea (see John 11:1). This Mary is not Mary Magdalene who resides in Magdala of Galilee'
  - where: 'note 10:38 “Martha’s house”'
    claim: 'JST: “they entered”; Martha owns her own home'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'From the Joseph Smith Translation, a reader learns that Martha owns her own home, a not uncommon practice among women of Palestine,98 which agrees with the expanded version of Luke’s statement, “into her house”'
  - where: 'note 10:38 “Martha’s house”'
    claim: 'Martha’s welcome contrasts with the rejection on the journey (9:52–53)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'Even so, her act contrasts with the rejection that he experiences elsewhere on his journey (see 9:52–53).'
  - where: 'note 10:38 “Martha’s house”'
    claim: 'Hospitality mattered greatly; a woman’s honor depended partly on how she filled the role of hostess'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'Hospitality was very important in Jewish society, and a woman’s honor and reputation depended partly on how well she fulfilled cultural expectations regarding the role of hostess.'
  - where: 'note 10:39 “At Jesus’ feet”'
    claim: 'Sitting at someone’s feet is the posture of a disciple or pupil (Acts 22:3)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'The posture is that of an eager disciple or pupil (see 8:35; 17:16; Acts 22:3).'
  - where: 'note 10:39 “At Jesus’ feet”'
    claim: 'Against the norms of their society, Jesus encourages Mary’s learning'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'Against all norms in their society,2 Jesus overtly encourages her growing curiosity, her burgeoning spiritual yearnings.'
  - where: 'note 10:39 “At Jesus’ feet”'
    claim: 'Within her own house the society’s nervousness about women and men relaxes'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'The key turns on the observation that Martha hosts Jesus in “her house” (10:38). Within her home, much of her society’s nervousness over the contact between the sexes relaxes.'
  - where: 'note 10:42 “One thing is needful”'
    claim: '“Cumbered” (perispaō, imperfect passive) is “kept being distracted”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'Because the form of the verb is the imperfect passive, it carries the sense “kept being distracted,” as if Martha seeks to be a part of the conversation but is continually drawn back to prepare the meal.'
  - where: 'note 10:42 “One thing is needful”'
    claim: '“Careful” (merimnaō) means anxious, divided in mind'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'The verb translated “to be careful” (Greek merimnaō) carries an entirely different modern meaning from the King James translation, “to be anxious,” and “implies division and distraction of mind.”'
  - where: 'note 10:42 “One thing is needful”'
    claim: 'The footnote glosses “careful and troubled” as “worried”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/10?lang=eng'
    quote: '41a “careful and troubled”: GR worried.'
  - where: 'note 10:42 “One thing is needful”'
    claim: 'The repeated name shows a compassionate tone'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'Jesus’ repetition of Martha’s name underscores his compassionate tone in replying to her. He does not bark at her for her critical words.'
  - where: 'note 10:42 “One thing is needful”'
    claim: 'Oaks: Jesus commended Martha, but learning the gospel from the Master Teacher was more needful; some things are better than good'
    key: oaks-good-better-best
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2007/10/good-better-best?lang=eng'
    quote: 'It was praiseworthy for Martha to be “careful and troubled about many things” (v. 41), but learning the gospel from the Master Teacher was more “needful.”'
  - where: 'note 10:42 “One thing is needful”'
    claim: 'Martha later meets Jesus on the road and receives “I am the resurrection, and the life” (John 11:20, 25)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'it is Martha who hastens to meet him while he is still on the road. Mary remains in the house (see John 11:20). In one of the important revelatory scenes in the Gospel accounts, Jesus discloses himself to her'

  - where: 'note 10:6 “A son of peace”'
    claim: 'The first words reveal whether a son of peace is in the home and whether their peace rests on it'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'These words, perhaps unexpectedly, will reveal whether a “son of peace be” in that home and will establish whether or not the disciples let their “peace . . . rest upon” the home and its inhabitants (10:6).'
  - where: 'note 10:13 “Chorazin, Bethsaida and Capernaum”'
    claim: 'Capernaum was where the Lord lived after His ministry began, “his own city”'
    key: bd-capernaum
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/capernaum?lang=eng'
    quote: 'Here the Lord lived after the beginning of His ministry, so that Capernaum is called “his own city” (compare Matt. 9:1 with Mark 2:1).'
  - where: 'note 10:25 “A certain lawyer”'
    claim: 'Standing up may point to respect, whether grudgingly given or not'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'This act may point to the man’s respect for the Savior, whether grudgingly given or not.'
  - where: 'note 10:25 “A certain lawyer”'
    claim: '“Master” (didaskalos) means teacher'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'The meaning of the term (Greek didaskalos) is teacher, a term commonly applied to Jesus'
  - where: 'note 10:30 “The road down to Jericho”'
    claim: 'Virtually all in the audience knew this road from visits to the capital'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'it is reasonable to assume that virtually all in his audience know this road because they have walked it previously when visiting the capital city.'
  - where: 'note 10:31 “Passed by on the other side”'
    claim: 'The man stripped and severely wounded may have given the look of death'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'The man’s appearance, stripped and severely wounded, may give the look of death and thus lead to the inaction of the first passersby.'
  - where: 'note 10:38 “Martha’s house”'
    claim: 'Martha’s house was assumed to be in Bethany, near Jerusalem'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'In Luke 10:38, we read that he came to the house of Martha, which we assume was in Bethany, near Jerusalem (see John 11:1).'
  - where: 'note 10:42 “One thing is needful”'
    claim: 'Martha’s meal is her gift, an adornment of her affection and loyalty'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'Moreover, her meal constitutes her gift to the Savior; preparing the meal forms an adornment of her affection and loyalty to him.'
  - where: 'note 10:42 “One thing is needful”'
    claim: 'Martha appears to have taken Jesus’ words seriously'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'But, according to another account, she appears to have taken Jesus’ words seriously.'
  - where: 'note 10:42 “One thing is needful”'
    claim: 'Oaks: the good things we can do exceed the time available; some things are better than good'
    key: oaks-good-better-best
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2007/10/good-better-best?lang=eng'
    quote: 'The number of good things we can do far exceeds the time available to accomplish them. Some things are better than good'

  - where: 'note 10:22 “The Son is the Father”'
    claim: 'JST 10:23 reads “no man knoweth that the Son is the Father, and the Father is the Son”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: '“no man knoweth that the Son is the Father, and the Father is the Son” (JST 10:23)'
  - where: 'note 10:38 “Martha’s house”'
    claim: 'JST 10:39 changes the first words to “they entered”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'The Joseph Smith Translation, in keeping with the sense that Jesus is traveling with a large entourage of disciples, changes the first words to “they entered” (JST 10:39).'

  # ---- christ, explore
  - where: christ
    claim: 'Early Christians saw the Samaritan as Christ; the parable as a type of the plan of salvation'
    key: welch-good-samaritan
    url: 'https://byustudies.byu.edu/article/the-good-samaritan-a-type-and-shadow-of-the-plan-of-salvation'
    quote: 'According to this early Christian view, the narrative is to be read as an impressive allegory of the fall and redemption of mankind.'
  - where: christ
    claim: 'On the road to Jerusalem Jesus ministered to wounded souls as the Samaritan did'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'Jesus would minister to each wounded soul he encountered on the road to Jerusalem, thinking not of himself even as he drew closer to his own death.'
  - where: christ
    claim: 'Oaks: some things are better than good and should command priority'
    key: oaks-good-better-best
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2007/10/good-better-best?lang=eng'
    quote: 'Some things are better than good, and these are the things that should command priority attention in our lives.'
  - where: explore
    claim: 'Welch’s article reads the parable element by element as a type of the plan of salvation'
    key: welch-good-samaritan
    url: 'https://byustudies.byu.edu/article/the-good-samaritan-a-type-and-shadow-of-the-plan-of-salvation'
    quote: 'As I show below, each point included by Jesus in the story helps to place the Samaritan’s act of saving mercy in the broader context of the plan of salvation'
  - where: 'note 10:13 “Chorazin, Bethsaida and Capernaum”'
    claim: 'Jesus’ mention of Tyre and Sidon apparently ties back to Isaiah 23, where they receive God’s curse'
    key: brown-testimony-luke
