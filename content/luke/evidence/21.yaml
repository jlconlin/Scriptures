    quote: 'Therefore shall Zion for your sake be plowed as a field, and Jerusalem shall become heaps, and the mountain of the house as the high places of the forest.'
  - where: 'note 21:28 “Your redemption draweth nigh”'
    claim: 'Apolytrōsis: deliverance through Christ’s death; the “day of redemption” is the last day of consummate liberation (Eph. 4:30)'
    key: thayer
    url: 'https://biblehub.com/greek/629.htm'
    quote: 'everywhere in the N. T. metaphorically, viz. deliverance effected through the death of Christ from the retributive wrath of a holy God and the merited penalty of sin: Romans 3:24 … ἡμέρα ἀπολυτρώσεως, the last day, when consummate liberation is experienced'
  - where: 'note 21:28 “Your redemption draweth nigh”'
    claim: 'The word is characteristic of Paul (Rom. 3:24; 8:23)'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/21.htm'
    quote: 'Redemption.—The word, familiar as it is to us, is, in the special form here used, another of those characteristic of St. Paul’s phraseology (Romans 3:24; Romans 8:23; … In its primary meaning here it points to the complete deliverance of the disciples from Jewish persecutions in Palestine that followed on the destruction of Jerusalem.'
  - where: 'note 21:28 “Your redemption draweth nigh”'
    claim: 'The JST manuscript sets verse 28 before verse 27 and reads “the day of your redemption”'
    key: jsp-nt2
    url: 'https://www.josephsmithpapers.org/paper-summary/new-testament-revision-2/154'
    quote: 'And when these things begin to come to pass, then look up, and lift up your heads, for the day of your redemption draweth nigh. And then shall they see the son of 7 man coming in a cloud, with power and great glory.'
  - where: 'note 21:28 “Your redemption draweth nigh”'
