chapter: 21
claims:
  # ---- when, setting, thread
  - where: setting
    claim: 'The discourse falls in the last week of Jesus’s ministry'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'In the prior chapter, we listen to his teachings during the early days of his last week, probably on Monday, Tuesday, and early Wednesday. Then, likely on Wednesday afternoon, he draws his closest disciples into his confidence'
  - where: setting
    claim: 'The chapter begins with the widow and ends with crowds seeking Jesus; between is His vision of the future'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'The chapter begins with the gift of a poor widow and ends with crowds seeking his company (see 21:1–4, 37–38). In between he shines light on his grand eschatological vision (see 21:5–36).'
  - where: setting
    claim: 'Luke names no place for the sermon; that it was on the Mount of Olives is clear from Matthew, Mark, JS—M and D&C 45:48'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'Perhaps oddly, Luke does not record a location for this initial conversation and for the following sermon … That the full discussion takes place on the Mount of Olives becomes clear from Matthew 24:3, Mark 13:3, Joseph Smith—Matthew 1:4, and Doctrine and Covenants 45:48.'
  - where: setting
    claim: 'For Latter-day Saints there are seven versions of the sermon; the seventh is D&C 45:16–59, where the Lord says He showed it standing before His disciples'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'The seventh record of the sermon lies in Doctrine and Coveanants 45:16–59. … With these words, we learn the vivid detail that Jesus imparts in the sermon while standing before his disciples, as a distinguished teacher'
  - where: setting
    claim: 'The JST changes Luke 21 less than Mark 13 and Matthew 24'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'the Joseph Smith Translation completely freshens the reports of the sermon preserved by Mark and Matthew with a large number of changes that render their records largely the same; fewer adjustments appear in Luke 21.'
  - where: setting
    claim: 'D&C 45 was received on 7 March 1831 and is in large part a fourth narration of the Olivet Discourse'
    key: jackson-sign-thy-coming
    url: 'https://rsc.byu.edu/understanding-joseph-smiths-translation-bible/what-sign-thy-coming'
    quote: 'On March 7, 1831, during the time when Joseph Smith was translating Genesis with Sidney Rigdon as scribe, he received a revelation … now section 45 in the Doctrine and Covenants … is, in large part, a fourth narration of the Olivet Discourse.'
  - where: setting
    claim: 'Joseph Smith—Matthew is an extract from Joseph Smith’s translation of Matthew 24'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-m/1?lang=eng'
    quote: 'An extract from the translation of the Bible as revealed to Joseph Smith the Prophet in 1831: Matthew 23:39 and chapter 24.'
  - where: thread
    claim: 'The JST throughout Luke 21 makes Jesus Himself set out a long interval before His return'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'But the Joseph Smith Translation clarifies that Jesus himself, not his followers, sets out the dimensions of the long interval.'
  - where: thread
    claim: 'By the JST the disciples grasp that the Second Coming is detached in time from the destruction of Jerusalem'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'Plainly, as they sit together on the Mount of Olives, the disciples grasp that Jesus is disclosing a series of future scenes and that his Second Coming is detached, in time, from the destruction of Jerusalem.'

  # ---- section plains
  - where: section 1 plain
    claim: '“Unto the offerings of God” means into the offering chests'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'leads us to understand that Jesus speaks of the offering chests, with the meaning “into the offering chests”'
  - where: section 3 plain
    claim: '“Meditate before” is to prepare a speech beforehand; “answer” is to defend oneself'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'The main thrust of the verb (Greek promeletaō) has to do with practicing or preparing a speech or presentation beforehand'
  - where: section 3 plain
    claim: '“Possess ye your souls” is better “gain ye your lives,” by endurance'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/21.htm'
    quote: 'Better, By your endurance gain ye your lives. The verb, unless used in the perfect tense, always involves the idea of “acquiring” rather than “possessing,”'
  - where: section 7 plain
    claim: '“Surfeiting” is the aftermath of drinking, a hangover; “overcharged” is weighed down'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'The primary sense of this term (Greek kraipalē) is intoxication; but its meaning here is more like a hangover, the result of intoxication.'

  # ---- notes
  - where: 'note 21:1 “The treasury”'
    claim: 'The treasury was the Court of the Women, with thirteen shofar-shaped chests labeled for different funds, according to the Mishnah'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'According to the Mishnah, thirteen shofar-shaped chests sit inside the Court of the Women where people put their gifts. This courtyard must be “the treasury.” These chests carry labels such as “New Shekel dues,” “Gold for the Mercy-seat,” and “Freewill-offerings,”'
  - where: 'note 21:1 “The treasury”'
    claim: 'Passover brought many donors; gifts went in part to Herod’s renovation of the temple, begun 20–19 BC and continuing to AD 62–64'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'One of the purposes for such gifts is the ongoing renovation of the temple which Herod begins long before, in the winter of 20–19 BC. This renovation will continue through the prefecture of Albinus (AD 62–64).'
  - where: 'note 21:1 “The treasury”'
    claim: 'The infant Jesus was first brought to this place by His mother; there she paid for her firstborn and offered the sacrifice of the poor, framing His life with the poor widow'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'forms an inclusio of sorts, bringing to completion a theme that Luke introduces at the beginning of Jesus’ mortal life when his mother brings him to the temple, specifically to the Court of the Women or the treasury'
  - where: 'note 21:1 “The treasury”'
    claim: 'The poverty shared by Mary and the widow frames Jesus’s mortal life, for He has known such a life'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'This aspect of poverty, shared by the young Mary and the widow … frames virtually all of Jesus’ mortal life, imparting to his life and ministry a quiet assurance of his concern for those who experience poverty'
  - where: 'note 21:4 “All the living that she had”'
    claim: '“Living” (bios) here is her livelihood; she gives from her means of subsistence'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'The term translated “living” (Greek bios) generally has to do with one’s manner of living, but here it has to do with the widow’s livelihood. Hence, she dips deep into her means of subsistence to produce her gift, a true sacrifice.'
  - where: 'note 21:4 “All the living that she had”'
    claim: 'Jesus perceives the intents of people, which lets Him judge her gift'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'one of the strong themes of this Gospel is its insistence that, with divine ability, Jesus perceives the intents and personalities of people. This characteristic allows him to say what he says in the next verse'
  - where: 'note 21:4 “All the living that she had”'
    claim: 'The priests notice the gifts of the wealthy, not the widow’s; she is the true disciple, giving all'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'Her gift diminishes her ability to provide for herself in even the most basic ways … She is the true disciple, giving all.'
  - where: 'note 21:5 “The widow and the adorned temple”'
    claim: 'The widow’s story is set against the opulence of the temple and its contributors, whose worn piety will not save the temple'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'her story brings together a raw, untouched comparison between her situation and the gleaming opulence of both the temple and its contributors, the latter offering a practiced yet worn piety that will not save the temple from destruction.'
  - where: 'note 21:5 “The widow and the adorned temple”'
    claim: '“Widows’ houses” in 20:47 may be the catchword that brings the widow’s story here'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'Jesus’ mention of “widows’ houses” in the foregoing (20:47) may instead form a verbal bridge that brings the widow’s story here, pointing to a catchword association'
  - where: 'note 21:5 “The widow and the adorned temple”'
    claim: 'The verses bridge the condemnation of the scribes and the warning of the temple’s fall; Jesus indirectly condemns a temple culture that notices the gifts of the wealthy'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'yet he implicates them by condemning the temple culture that pays attention to gifts of the wealthy and barely acknowledges the gifts of the poor'
  - where: 'note 21:5 “The widow and the adorned temple”'
    claim: '“Gifts” adorning the temple are offerings; what feature they looked at is unclear'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: '5 And while certain men were speaking concerning the temple, that it was adorned with beautiful stones and offerings, he said'
  - where: 'note 21:6 “Not one stone”'
    claim: 'Battering rams failed against the stones; fire set to the gates led to the sanctuary’s destruction in AD 70'
    key: ludlow-first-jewish-revolt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/first-jewish-revolt-against-rome'
    quote: 'The Roman battering rams failed against the massive stones surrounding the temple. Fire was finally set to the temple gates, leading to the eventual destruction of the magnificent sanctuary in AD 70.'
  - where: 'note 21:6 “Not one stone”'
    claim: 'In D&C 45:18 Jesus says the disciples’ enemies held that the temple would never fall'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'Jesus says that the disciples’ “enemies say that this house [the temple] shall never fall” (D&C 45:18), a point of view echoed in the misrepresenting charge that Jesus claims he will rebuild the temple'
  - where: 'note 21:6 “Not one stone”'
    claim: 'The fall of temple and city was a watershed matched only by 587 BC'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'The fall of the temple and the city will form a watershed for the Jewish people matched only by the first fall of Jerusalem in 587 BC.'
  - where: 'note 21:7 “A question about the temple”'
    claim: 'The disciples ask about signs of the city’s destruction; the JST reads “what sign wilt thou show”; they wish to learn of His coming too, about which they had already asked (D&C 45:16)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'the disciples indicate their awareness of Jesus’ controlling mastery over events at the end-time when they ask, “what sign wilt thou show, when these things shall come to pass?” (JST 21:7; emphasis added).'
  - where: 'note 21:7 “A question about the temple”'
    claim: 'The JST changes “they asked” to “the disciples asked”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'Notably, the Joseph Smith Translation changes “they asked” to “the disciples asked,” clarifying who is interacting with the Savior (JST 21:7).'
  - where: 'note 21:7 “A question about the temple”'
    claim: 'The JST adds, after verse 24, the disciples’ question about His coming'
    key: jst-luke-21
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/21?lang=eng'
    quote: 'Now these things he spake unto them, concerning the destruction of Jerusalem. And then his disciples asked him, saying, Master, tell us concerning thy coming?'
  - where: 'note 21:8 “The time draweth near”'
    claim: 'In Luke the deceivers carry a double message, “I am Christ” and “the time draweth near”; kairos is a critical moment, used to create anxiety'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'The term for “time” (Greek kairos), meaning a critical moment, is intended in Luke’s report to create a climate of anxiety on the lips of false messiahs'
  - where: 'note 21:8 “The time draweth near”'
    claim: 'The JST moves the phrase to the start of the verse so that it is Jesus’s own: “The time draweth near, and therefore take heed that ye be not deceived”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'the Joseph Smith Translation moves this expression to the front of the verse so that it reads: “And he said, The time draweth near, and therefore take heed that ye be not deceived” (JST 21:8). Thus, in this modification, the declaration derives from Jesus and not from deceptive pretenders.'
  - where: 'note 21:8 “The time draweth near”'
    claim: '“Not by and by” is literally “not immediate”; JST 21:9 reads “this is not the end”; the end stands in the far distance'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'The JST reading carries a clearer, firmer sense that the events Jesus predicts do not herald the end-time. Instead, the end-time stands in the far distance, on a slow boil.'
  - where: 'note 21:8 “The time draweth near”'
    claim: '“Not by and by” literally means “not immediate”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'the end is not by and by: Literally, the expression means “the end is not immediate.”'
  - where: 'note 21:14 “Not to rehearse a defense”'
    claim: 'promeletaō: to meditate beforehand (Luke 21:14)'
    key: thayer
    url: 'https://biblehub.com/greek/4304.htm'
    quote: 'προμελετάω, προμελέτω; to meditate beforehand: Luke 21:14'
  - where: 'note 21:14 “Not to rehearse a defense”'
    claim: 'The verb is to practice or prepare a speech beforehand; “answer” (apologeomai) is to defend oneself'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'The Greek verb apologeomai bears the strong sense “to defend oneself,” not merely to respond to an accusation.'
  - where: 'note 21:14 “Not to rehearse a defense”'
    claim: '“Settle it in your hearts” is a conscious decision to trust His promise of timely inspiration'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'Jesus asks the Twelve to make a conscious decision to trust his promise of timely inspiration, a decision that allows them to face challenges with unshaken confidence'
  - where: 'note 21:14 “Not to rehearse a defense”'
    claim: 'Those who defend themselves for His name become His mouthpiece; D&C 84:85 among the parallels'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'Such persons, in that moment, literally become Jesus’ mouthpiece, speaking his words (see 4:22; Isa. 6:6–8; 51:16; 2 Ne. 8:16; Hel. 5:18; D&C 84:85; 100:5–6; 124:97; the Note on 12:12).'
  - where: 'note 21:18 “Not a hair, though some are put to death”'
    claim: 'A like promise in Matt. 10:30 and Luke 12:7; the promise in this form is only in Luke’s account'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/21.htm'
    quote: 'The promise does not meet us in this form in the parallel passages of the two other Gospels. A like promise meets us in Matthew 10:30, Luke 12:7.'
  - where: 'note 21:18 “Not a hair, though some are put to death”'
    claim: 'Luke knew of James’s execution by Agrippa (Acts 12:2), fulfilling 21:16'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'he certainly knows of the execution of James by King Agrippa (see 21:16—“some of you shall they cause to be put to death”; also Acts 12:2).'
  - where: 'note 21:18 “Not a hair, though some are put to death”'
    claim: 'The promise shows that He will not let events stray from His purposes'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'The promise also illustrates the Savior’s micromanaging of these particular matters. He will not let events stray from his purposes.'
  - where: 'note 21:19 “Gain your souls by endurance”'
    claim: 'hypomonē: steadfastness, endurance, of one unswerved from loyalty to faith by the greatest trials (Luke 21:19)'
    key: thayer
    url: 'https://biblehub.com/greek/5281.htm'
    quote: 'steadfastness, constancy, endurance … in the N. T. the characteristic of a man who is unswerved from his deliberate purpose and his loyalty to faith and piety by even the greatest trials and sufferings: Luke 8:15; Luke 21:19'
  - where: 'note 21:19 “Gain your souls by endurance”'
    claim: 'ktaomai: to acquire, get or procure for oneself'
    key: thayer
    url: 'https://biblehub.com/greek/2932.htm'
    quote: 'to acquire, get or prucure a thing for oneself'
  - where: 'note 21:19 “Gain your souls by endurance”'
    claim: 'Better “gain ye your lives”; answers Matthew’s and Mark’s “he that endureth to the end”; some manuscripts make it a promise'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/21.htm'
    quote: 'the command so understood answers to the promise, “He that endureth to the end, the same shall be saved,” in Matthew 23:13, Mark 13:13. Some of the best MSS., indeed, give this also as a promise, “By your endurance ye shall gain.”'
  - where: 'note 21:20 “Compassed with armies”'
    claim: 'Only Luke has the armies; Matthew and Mark have the abomination of desolation'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: '“ye shall see Jerusalem compassed with armies” (21:20; also 19:43). The other accounts omit this detail. Instead, they feature the “abomination of desolation” (Matt. 24:15; Mark 13:14)'
  - where: 'note 21:20 “Compassed with armies”'
    claim: 'Luke’s armies and Matthew’s abomination name one sign that none could misunderstand'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'or “when ye shall see Jerusalem compassed with armies” as Luke writes, “then know that the desolation thereof is nigh.” This was a specific sign that none could misunderstand.'
  - where: 'note 21:20 “Compassed with armies”'
    claim: 'The Romans surrounded the city with a siege wall manned at every key point'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'Events occur as Jesus foretells. The Romans surround the city with a siege wall which they man at every key point with squads of soldiers.'
  - where: 'note 21:20 “Compassed with armies”'
    claim: 'Titus besieged the city for seven months with four legions'
    key: ludlow-first-jewish-revolt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/first-jewish-revolt-against-rome'
    quote: 'In the midst of such revolutionary discombobulation, the Roman siege of Jerusalem continued under the leadership of Vespasian’s son Titus. During the seven-month siege by four Roman legions'
  - where: 'note 21:20 “Compassed with armies”'
    claim: 'Many scholars date Luke after AD 70 because of this verse; Brown answers that Jesus can predict the future'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/the-message-and-context-of-lukes-testimony'
    quote: 'the usual attempt to seize on Jesus’ language of 21:20 (“ye shall see Jerusalem compassed with armies”) falls flat because we know that Jesus can predict the future, even with high precision.'
  - where: 'note 21:20 “Compassed with armies”'
    claim: 'Jesus foretold a similar siege earlier (19:43–44), so the words need not be Luke’s'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'But on the view that Jesus does foresee future events in detail, it is not necessary to posit that this statement originates with Luke because, earlier, Jesus predicts a similar event (see the Notes on 19:43–44; also 23:28).'
  - where: 'note 21:20 “Compassed with armies”'
    claim: 'The first-hand account in D&C 45:19 affirms Jesus’s words for this scene'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'Significantly, the only first-hand account of this sermon affirms Jesus’ words for this scene. Quoting him, the report reads: “desolation shall come upon this generation as a thief in the night, and this people shall be destroyed and scattered among all nations” (D&C 45:19'
  - where: 'note 21:20 “Compassed with armies”'
    claim: 'Instead of retreating into the city, Christians fled, many to Pella, and survived'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'Rather than retreat into the city for safety, as thousands do when war breaks out with Rome late in AD 66 and again when Roman armies approach Jerusalem’s gates in AD 70, Christians flee northward, many of them settling in a gentile town, Pella'
  - where: 'note 21:20 “Compassed with armies”'
    claim: 'The customary response to an invading army is to flee into a city; Jesus warns against it'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'let not them . . . enter: The customary response of people to the threat of an invading army is to flee into a city for safety. Jesus warns'
  - where: 'note 21:22 “The days of vengeance”'
    claim: 'The vengeance is the Lord’s, the result of a legal process against wickedness (ekdikēsis)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'On one level, it is the Lord’s (see 1 Kgs. 9:6–9; Jer. 7:32–34; 19:6–9; Amos 4:2), an act that results from a legal process against wickedness in the city, one of the meanings of the Greek term ekdikēsis.'
  - where: 'note 21:22 “The days of vengeance”'
    claim: 'The destruction results from wickedness, and fulfills written prophecies about Jerusalem (Micah 3; Ezekiel 7; Zephaniah 1), and perhaps those given to the Nephites'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'Such a dire event results from wickedness (see 13:34; D&C 45:26–33). It is evident that prophecy will be fulfilled, but specifically prophecy that appears in written form (see Ezek. 7:5–15; 38:16–17; Micah 3:1–4, 12; Zeph. 1:12–13).'
  - where: 'note 21:22 “The days of vengeance”'
    claim: 'Jesus may also have in mind the prophecies given to the Nephites (2 Ne. 10:3–6; 25:14)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'Jesus, of course, knows the prophecies about Jerusalem’s duress given to the Nephites and others, which may also be in his mind when he speaks of “all things which are written” (see 2 Ne. 10:3–6; 25:14'
  - where: 'note 21:24 “The times of the Gentiles”'
    claim: 'All of 21:24 is unique to Luke’s report'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'All of 21:24 is unique to Luke’s report of the sermon, a graphic summary of the fate of Jerusalem’s citizens.'
  - where: 'note 21:24 “The times of the Gentiles”'
    claim: 'Jerusalem trodden down in two stages: AD 70 and after AD 131–35 as Aelia Capitolina; non-Jews held power until 1967'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'The second may come at the end of the second Jewish revolt (AD 131–35) which sees Jerusalem turned into a Roman city and renamed Aelia Capitolina—Jews are not allowed inside the city and surrounding territory. During the following centuries, people other than Jews hold power in Jerusalem, a situation that changes only with the six-day war in 1967.'
  - where: 'note 21:24 “The times of the Gentiles”'
    claim: 'Brown leaves open whether 1967 marks the fulfilling of the times of the Gentiles'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'The question is whether this is the era when “the times of the Gentiles” will “be fulfilled.”'
  - where: 'note 21:24 “The times of the Gentiles”'
    claim: 'Most Jews rejected the message, sending the Apostles to the Gentiles; after the Gentiles receive the gospel it goes to the Jews (Rom. 11:25; 1 Ne. 10:14; D&C 45:25, 30)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'In a word, most Jews of Jesus’ era reject his message, thus propelling the Apostles toward the Gentiles. After the Gentiles receive the gospel, it will go to the Jews (see 1 Ne. 10:14; also D&C 19:27; 20:9; 21:12; 45:25, 30).'
  - where: 'note 21:24 “The times of the Gentiles”'
    claim: 'In the Book of Mormon and D&C “Gentiles” often means nations without the gospel'
    key: gs-gentiles
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/gentiles?lang=eng'
    quote: 'sometimes nations that are without the gospel, even though there may be some Israelite blood among the people. This latter usage is especially characteristic of the word as used in the Book of Mormon and Doctrine and Covenants.'
  - where: 'note 21:24 “The times of the Gentiles”'
    claim: 'D&C 45:24–30 and JS—H 1:41 on the times and fulness of the Gentiles'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-h/1?lang=eng'
    quote: 'And he further stated that the fulness of the Gentiles was soon to come in.'
  - where: 'note 21:24 “The times of the Gentiles”'
    claim: 'D&C 45:28: when the times of the Gentiles come in, the fulness of the gospel breaks forth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'And when the times of the Gentiles is come in, a light shall break forth among them that sit in darkness, and it shall be the fulness of my gospel;'
  - where: 'note 21:25 “Where the sermon turns”'
    claim: 'JST Luke 21:24–25: the division, and “In the generation in which the times of the Gentiles shall be fulfilled, there shall be signs”'
    key: jst-luke-21
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/21?lang=eng'
    quote: 'And he answered them, and said, In the generation in which the times of the Gentiles shall be fulfilled, there shall be signs in the sun, and in the moon, and in the stars'
  - where: 'note 21:25 “Where the sermon turns”'
    claim: 'JST adds the earth and the great deep troubled'
    key: jst-luke-21
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/21?lang=eng'
    quote: 'The earth also shall be troubled, and the waters of the great deep;'
  - where: 'note 21:25 “Where the sermon turns”'
    claim: 'Joseph Smith revised Luke in the usual way and, as with Matthew, distinguished the early trials of the Jews from the end; a break and added text between 24 and 25 mark the line'
    key: jackson-sign-thy-coming
    url: 'https://rsc.byu.edu/understanding-joseph-smiths-translation-bible/what-sign-thy-coming'
    quote: 'As he had done with Matthew, he revised Luke in such a way that it makes a distinction between Jesus’s words about the early trials of the Jews and his words about the end of the world. A paragraph break and added text between verses 24 and 25 show the dividing line'
  - where: 'note 21:25 “Where the sermon turns”'
    claim: 'The signs will appear only in that distant generation; the Second Coming and its signs are not imminent'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'Those “signs” will appear only “in the generation in which the times of the Gentiles shall be fulfilled,” that is, in a distant day … In a word, Jesus’ Second Coming and the signs that precede it are not imminent.'
  - where: 'note 21:28 “Your redemption draweth nigh”'
    claim: 'apolytrōsis appears only here in the Gospels and bears the sense of being delivered; D&C 45:46 says redemption shall be perfected'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'The Greek term for “redemption” (apolytrōsis), appearing only here in the Gospels but frequently in Paul’s writings (see Rom. 3:24; 8:23; 1 Cor. 1:30; Eph. 1:7, 14; etc.), bears the sense of being delivered.'
  - where: 'note 21:28 “Your redemption draweth nigh”'
    claim: 'The JST moves verse 28 before verse 27 and reads “the day of your redemption,” tying the signs to His coming'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'Before this expression, the Joseph Smith Translation inserts all of verse 28 and adds three words; by doing so, it becomes apparent that Jesus cements the link between “signs” in heaven and earth … and the event they point to—his Second Coming'
  - where: 'note 21:28 “Your redemption draweth nigh”'
    claim: 'In D&C 45:45–46 Jesus anticipates the apostles’ death and resurrection before His coming'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'Plainly, Jesus here anticipates the death and resurrection of the Apostles as intervening events between this moment on the mount and his Second Coming (see D&C 45:45–46).'
  - where: 'note 21:28 “Your redemption draweth nigh”'
    claim: 'D&C 45:17: the day of redemption answers the long absence of spirits from bodies'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'For as ye have looked upon the long absence of your spirits from your bodies to be a bondage, I will show unto you how the day of redemption shall come, and also the restoration of the scattered Israel.'
  - where: 'note 21:32 “Which generation”'
    claim: 'On the surface “this generation” is Jesus’s own; the JST makes it a future generation'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'Thus, the generation to which Jesus points is not his own but a future generation.'
  - where: 'note 21:32 “Which generation”'
    claim: 'JST Luke 21:32 reading'
    key: jst-luke-21
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/21?lang=eng'
    quote: 'Verily I say unto you, this generation, the generation when the times of the Gentiles be fulfilled, shall not pass away till all be fulfilled.'
  - where: 'note 21:34 “Weighed down”'
    claim: '“Overcharged” (bareō, passive) is weighed down with bad habits and worldly desires'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'The meaning of the verb, in its passive form (Greek bareō), has to do with being weighed down, in this instance with bad personal habits and worldly desires.'
  - where: 'note 21:34 “Weighed down”'
    claim: 'kraipalē: the giddiness and headache of drinking to excess'
    key: thayer
    url: 'https://biblehub.com/greek/2897.htm'
    quote: 'Latincrapula (i. e. the giddiness and headache caused by drinking wine to excess): Luke 21:34 (A. V. surfeiting'
  - where: 'note 21:34 “Weighed down”'
    claim: 'A similar warning in 12:45–46, the servant whose lord delays'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'Jesus issues a similar warning to his disciples in the story about the chief servant who, because his lord delays his arrival, engages in all sorts of ill behavior'
  - where: 'note 21:34 “Weighed down”'
    claim: 'The snare (pagis) is a trap for birds and small animals; it rushes on all the earth'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'the sense of the Greek term pagis points to a trap or snare for birds and small animals.'
  - where: 'note 21:34 “Weighed down”'
    claim: 'JST 21:34 reads “Let my disciples therefore take heed to themselves” and “upon them”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'In the place of “take heed to yourselves,” the JST substitutes and expands to “Let my disciples therefore take heed to themselves,” changing the second person to the third person (JST 21:34).'
  - where: 'note 21:36 “Watch, pray, and stand”'
    claim: 'agrupneō: keeping oneself alert; only here in Luke; JST adds “And what I say unto one, I say unto all”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'The Joseph Smith Translation adds an entire line to the beginning of this verse, almost repeating Mark 13:37: “And what I say unto one, I say unto all” (JST 21:36). This addition fits with the universalizing of Jesus’ words'
  - where: 'note 21:36 “Watch, pray, and stand”'
    claim: '“Always” is en panti kairō, “at every important moment”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'Next, the words translated “always” basically mean “at every important moment” when pleading for divine help (Greek en panti kairō)'
  - where: 'note 21:36 “Watch, pray, and stand”'
    claim: 'To stand before the Son of Man is the scene of a court, with Jesus as judge'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'The scene is at home in a legal proceeding wherein the petitioner or the accused stands before a judge (Greek verb histēmi; see Matt. 25:32; 27:11; Rev. 20:12), hence portraying Jesus as judge of all.'
  - where: 'note 21:36 “Watch, pray, and stand”'
    claim: 'Some manuscripts read “have strength” instead of “accounted worthy”; both ideas are in modern scripture'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'According to the former reading, disciples escape because of worthiness. Both concepts, inner strength and worthiness, are at home in modern scripture (see D&C 109:38, 42, 45–46).'
  - where: 'note 21:36 “Watch, pray, and stand”'
    claim: 'Brown reads the commands, addressed to the Twelve, as including watching over and praying for others'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'Their stewardship will include watching over members of the church and praying for them as they face difficulties.'
  - where: 'note 21:36 “Watch, pray, and stand”'
    claim: 'JST 21:36 adds “and keep my commandments” and “when he shall come clothed in the glory of his Father” (footnotes)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/21?lang=eng'
    quote: 'JST Luke 21:36 … Son of man when he shall come clothed in the glory of his Father.'
  - where: 'note 21:37 “Nights on the Mount of Olives”'
    claim: 'Jesus and His disciples may have slept on the Mount of Olives; He also spent nights in Bethany, less than two miles away'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'This notation may mean that Jesus and his disciples sleep somewhere on the Mount of Olives (see John 8:1; Mark 11:19). But Jesus also spends nights in Bethany (see Matt. 21:17; 26:6; Mark 11:11; 14:3), which lies less than two miles distant on the southeast slope of the mountain'
  - where: 'note 21:37 “Nights on the Mount of Olives”'
    claim: 'Day and night may prepare for Judas’s going to the authorities in 22:3–6'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'Luke’s play on day and night, thus light and darkness, may form a prelude to the contrasts between the hope-filled experience of Passover (see 22:1) and the dark, dampening act of Judas (see 22:3).'
  - where: 'note 21:37 “Nights on the Mount of Olives”'
    claim: '“All the people” and “in the temple” repeat 19:47–48, binding chapters 20–21 as a unit; orthrizō is to rise early'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'These words repeat those found in 19:48, thus surrounding and binding Jesus’ teaching in chapters 20 and 21 into a literary whole'

  # ---- added
  - where: setting
    claim: 'References to “all the people” and “in the temple” (19:47–48; 20:1; 21:38) wrap Jesus’s last block of teaching'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'the references to “all the people” (see 19:48; 21:38) and to his activities “in the temple” (see 19:47; 20:1; 21:38).'
  - where: 'note 21:7 “A question about the temple”'
    claim: 'The disciples know enough from Jesus to ask for signs of the city’s fall (19:41–44); sēmeion here is a portent, not a proof'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'From Jesus the disciples know enough about the future to ask about events that will signify the looming destruction of the city (see 13:33–35; 19:41–44). … The term translated “sign” (Greek sēmeion) here points to an apocalyptic expectation or portent, not to a proof'
  - where: 'note 21:20 “Compassed with armies”'
    claim: 'Dating Luke in the 80s rests largely on reading Jesus’s predictions about Jerusalem as hindsight'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'Dating the composition of his Gospel and book of Acts in the 80s of the first century, a preferred estimate, rests in large measure on seeing some particulars of his record, especially those within Jesus’ predictions about Jerusalem’s future, as looking back'
  - where: 'note 21:20 “Compassed with armies”'
    claim: 'Judging that Jesus could not foresee the future in detail rests on an unsupported assumption'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'Any person’s judgment about Jesus’ inability to prophesy the future, in detail—any detail—rests squarely on that person’s unsupported assumption that no one, including Jesus, can predict what will occur.'
  - where: 'note 21:22 “The days of vengeance”'
    claim: 'The atrocities of one person against another in the city accomplish God’s vengeance'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'From the divine perspective, the atrocities by one person against another, say, Jew against Jew in the city, accomplishes God’s vengeance.'
  - where: 'note 21:24 “The times of the Gentiles”'
    claim: 'The gospel going first to the Gentiles is true of “the latter day” (3 Ne. 16:7)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'Importantly, this situation will be true of “the latter day” (3 Ne. 16:7; see 3 Ne. 16:4–15).'
  - where: 'note 21:36 “Watch, pray, and stand”'
    claim: 'The verb “to watch” (agrupneō) appears only here in Luke and means keeping oneself alert'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'This verb “to watch” appears only here in Luke’s record, and he may be influenced by its single occurrence in Mark’s account at 13:33 (Greek agrupneō). It has to do with always keeping oneself alert'
  - where: explore
    claim: 'Luke’s other prophecies (12:35–48; 17:20–37) are gathered with fresh prophecies into this discourse'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: 'we should see Jesus’ discourse on the Mount of Olives as one wherein he brings together sayings uttered on other occasions, along with fresh prophecies'

