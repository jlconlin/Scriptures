    quote: 'with goodly stones] bevelled blocks of stone, of which some are described as having been forty cubits long and ten high; double cloisters; monolithic columns; alternate slabs of red and white marble, &c. … and gifts] Rather, sacred offerings … the golden vine with its vast clusters given by Herod.'
  - where: 'note 21:5 “The widow and the adorned temple”'
    claim: 'The priestly rulers amassed treasure partly from the contributions of the poor and the houses of dependent widows'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'the priestly rulers had amassed an enormous treasure, of which the contributions of the poor, and the confiscation of property, including even the houses of dependent widows, formed a considerable proportion'
  - where: 'note 21:5 “The widow and the adorned temple”'
    claim: 'Reading of the sequence in Mark (parallel Luke 21:5–6): the final sin that condemned the temple was arguably the exploitation of the widow, whom its leaders should have supported'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Given that the last episode in Mark’s narrative was the widow’s offering, the final sin that condemned the Temple of Herod under its priestly leadership was arguably the exploitation of this poor woman, who gave all she had to the temple when the establishment instead should have been supporting her as the Mosaic law and prophets had enjoined.'
  - where: 'note 21:7 “A question about the temple”'
