    url: 'https://biblehub.com/greek/979.htm'
    quote: 'that by which life is sustained, resources, wealth (A. V. living): Mark 12:44; Luke 8:43 (WH omits; Tr marginal reading brackets the clause); Luke 15:12, 30; Luke 21:4'
  - where: 'note 21:4 “All the living that she had”'
    claim: 'Luke’s word for “poor” in verse 2 is his own, found nowhere else in the NT: needy, working for a scanty living, not a beggar'
