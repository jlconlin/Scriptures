  - where: 'note 21:22 “The days of vengeance”'
    claim: 'Ekdikēsis: vengeance, punishment (Luke 21:22; Rom. 12:19 from Deut. 32:35); to avenge the elect, Luke 18:7'
    key: thayer
    url: 'https://biblehub.com/greek/1557.htm'
    quote: 'a revenging; vengeance, punishment: Romans 12:19 and Hebrews 10:30 from Deuteronomy 32:35; 2 Corinthians 7:11; Luke 21:22; ποιεῖν τήν ἐκδίκησιν τίνος, to vindicate one from wrongs, accomplish the avenging of, Luke 18:7f'
