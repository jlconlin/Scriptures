  - where: 'note 21:8 “The time draweth near”'
    claim: 'Kairos: the time when things come to a crisis, the decisive epoch waited for (Luke 21:8)'
    key: thayer
    url: 'https://biblehub.com/greek/2540.htm'
    quote: 'ὁ καιρός alone, the time when things are brought to a crisis, the decisive epoch waited for: so of the time when the Messiah will visibly return from heaven, Mark 13:33; ὁ καιρός ἤγγικεν, Luke 21:8'
  - where: 'note 21:8 “The time draweth near”'
    claim: '“The time draweth near”: better, the season has come near; “by and by”: better, immediately'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/21.htm'
    quote: 'The time draweth near.—Better, the season has come near.'
  - where: 'note 21:8 “The time draweth near”'
    claim: '“The crisis has approached”; “not immediately is the end,” a warning against the excitement Paul discourages in 2 Thessalonians'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/21.htm'
    quote: 'the time draweth near] Rather, the crisis has approached. … but the end is not by and by] Rather, but not immediately is the end. … The words are most important as a warning against the same eschatological excitement which St Paul discourages in 2 Thess.'
  - where: 'note 21:8 “The time draweth near”'
    claim: 'The JST manuscript gives “The time draweth near” to Jesus and ends verse 9 “but this is not the end”'
    key: jsp-nt2
    url: 'https://www.josephsmithpapers.org/paper-summary/new-testament-revision-2/153'
    quote: 'And he said, The time draweth near, and therefore take heed that ye be not deceived; for many shall come in my name, saying, I am christ: Go ye not therefore after them. and when ye shall hear of wars and commotions, be not terefied; for these things must first come to pass; but this is not the end.'
  - where: 'note 21:8 “The time draweth near”'
    claim: 'Joseph Smith revised Luke 21 to distinguish the early trials of the Jews from the end of the world'
