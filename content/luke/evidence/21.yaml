    url: 'https://www.josephsmithpapers.org/paper-summary/new-testament-revision-2/155'
    quote: 'Let my disciples therefore take heed to themselves, lest at any time their hearts be over charged with surfeting, and drunkenness, and cares of this life, and that day come upon them unawares.'
  - where: 'note 21:36 “Watch, pray, and stand”'
    claim: 'Agrupneō: to be sleepless, keep awake; figuratively, attentive, ready (Luke 21:36)'
