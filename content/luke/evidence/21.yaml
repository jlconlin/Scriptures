    url: 'https://biblehub.com/commentaries/ellicott/luke/21.htm'
    quote: 'The whole passage, it may be noted, falls in with St. Luke’s characteristic tendency to record all portions of our Lord’s teaching that warned men against sensuality and worldliness.'
  - where: 'note 21:34 “Weighed down”'
