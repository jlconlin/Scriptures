    url: 'https://www.josephsmithpapers.org/paper-summary/new-testament-revision-2/155'
    quote: 'And what I say unto one, I say unto all, Watch ye therefore, and pray always, and keep my commandments, that ye may be counted worthy to escape all these things which shall come to pass'
  - where: 'note 21:37 “Nights on the Mount of Olives”'
    claim: 'Aulizomai: to lodge in the courtyard at night; to pass the night in the open air, bivouac; Luke 21:37'
    key: thayer
    url: 'https://biblehub.com/greek/835.htm'
    quote: '2. to pass the night in the open air, bivouac.'
  - where: 'note 21:37 “Nights on the Mount of Olives”'
    claim: 'The word was chosen to include the fact that most nights were spent not in a house but in the garden of Gethsemane (John 18:1–2)'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/21.htm'
    quote: 'It would seem to have been chosen by both Evangelists (it does not occur elsewhere in the New Testament) to include the fact, implied in all four and definitely stated by St. John, that most of the nights were spent not in a house, but in the garden, or orchard, of Gethsemane (John 18:1-2).'
  - where: 'note 21:37 “Nights on the Mount of Olives”'
    claim: 'The notice is retrospective; on this reading the temple teaching ended, and the remaining days before the Last Supper were spent in retirement, perhaps at Bethany'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/21.htm'
    quote: 'The notice is retrospective, applying to Palm Sunday, and the Monday and Tuesday in Passion Week. After Tuesday evening He never entered the Temple again. Wednesday and Thursday were spent in absolute and unrecorded retirement, perhaps with His disciples in the house at Bethany'
  - where: 'note 21:37 “Nights on the Mount of Olives”'
    claim: 'Bethany is two miles from Jerusalem on the southeast slope of Olivet; the Lord stayed there during Holy Week'
    key: bd-bethany
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/bethany?lang=eng'
    quote: 'Village two miles from Jerusalem, on the southeast slope of Olivet; the home of Lazarus, Mary, and Martha (John 11:1–46; 12:1) and of Simon (Mark 14:3); the village in which our Lord stayed during Holy Week (Matt. 21:17; Mark 11:11).'
  - where: 'note 21:37 “Nights on the Mount of Olives”'
    claim: 'John 18:2 and Luke 22:39: Jesus often resorted to the place, as He was wont'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/18?lang=eng'
    quote: 'And Judas also, which betrayed him, knew the place: for Jesus ofttimes resorted thither with his disciples.'
