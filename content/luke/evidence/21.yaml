    quote: 'St. Luke’s word for “poor” differs from St. Mark’s, and seems to have been carefully chosen to express the fact that the widow, though “needy,” and compelled to work for her scanty maintenance, was yet not a “beggar,” … It is not found elsewhere in the New Testament.'
