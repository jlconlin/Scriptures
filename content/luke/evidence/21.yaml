    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/21.htm'
    quote: 'But in our Lord’s day there were thirteen chests called Shopheroth, from their trumpet-shaped openings, adorned with various inscriptions. These rich men do not seem to have been observing the injunctions both sacred and Talmudic to give secretly, Matthew 6:4'
  - where: 'note 21:4 “All the living that she had”'
