    url: 'https://biblehub.com/commentaries/ellicott/luke/21.htm'
    quote: 'The words answer to the “great tribulation” of St. Matthew and St. Mark … The word “vengeance” may have been chosen, on this view, in allusive reference to the teaching of Luke 18:7-8. … The reference to the “things which are (better, have been) written,” is peculiar to St. Luke.'
