    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-21-104'
    quote: '“And when these things begin to come to pass, then look up and lift up your heads, for the day of your redemption draweth nigh” (JST 21:27; emphasis added).'
