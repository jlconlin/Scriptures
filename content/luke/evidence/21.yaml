    url: 'https://biblehub.com/commentaries/cambridge/luke/21.htm'
    quote: 'all things which are written] See Luke 19:42; Isaiah 29:2-4; Hosea 10:14-15; Deuteronomy 28:49-57; 1 Kings 9:6-9; Psalm 79:1-13; Micah 3:8-12.'
