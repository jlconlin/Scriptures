chapter: 7
claims:
  # ---- setting, thread, plain
  - where: setting
    claim: 'Luke’s words in 7:1 close the Sermon on the Plain, as Matthew 7:28 closes the Sermon on the Mount, but the Greek of the two clauses is very different'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'Luke’s expression closes Jesus’ Sermon on the Plain, much as that of Matthew closes the sermon on the mount: “when Jesus had ended these sayings” (Matt. 7:28). But in Greek, these two temporal clauses are very different'
  - where: setting
    claim: 'Raisings of the dead, or those near death, frame chapters 7 and 8'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'Memorable moments of the Savior raising the dead, or those near death, frame chapters 7 and 8 (see 7:1–10, 11–17; 8:41–42, 49–56).'
  - where: setting
    claim: 'The chapter adds to Luke’s sharpening sketch of rejection and opposition'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'augmenting Luke’s sharpening sketch of rejection and opposition that we find in earlier chapters (see 4:28–29; 5:21, 30–35; 6:2, 7–11).'
  - where: thread
    claim: 'Chapter 7 holds attention on the powers of deliverance Jesus heralded at Nazareth; He offers them freely except to John'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'By itself, chapter 7 holds our attention on the warming, liberating powers of deliverance, powers that Jesus has recently heralded in the Nazareth synagogue (see 4:18). These powers Jesus freely offers, except in one case: John the Baptist.'
  - where: thread
    claim: 'Not rescuing John shows He will not be a conquering, military Messiah'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'Jesus’ lack of action, even refusal, to mount a rescue of John from prison—and he possesses the power to do so (see Matt. 26:53)—underscores plainly his intention not to be a conquering, military Messiah.'
  - where: thread
    claim: 'The guests’ question “Who is this?” is right, but they ask it holding that He is not a prophet; the true answer is that He is the Messiah'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'The question is precisely right. But irony lies with those who ask the question owing to their evident view of Jesus—he is not a prophet (see 7:39). The true answer will make all the difference in the world for them'
  - where: thread
    claim: 'After Nain the people see Jesus as God’s prophet'
    key: huntsman-lukes-jesus
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
    quote: 'These activities are then seen by the people as the work of God’s chosen prophet. For instance, after the raising of the son of the widow of Nain, the people proclaim, “A great prophet is risen up among us'
  - where: 'section 1 plain'
    claim: 'Footnote: “instantly,” GR earnestly'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/7?lang=eng'
    quote: 'GR earnestly.'
  - where: 'section 3 plain'
    claim: '“Justified God”: acknowledged God’s righteousness by accepting John’s baptism'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'The sense is that Jesus’ hearers acknowledge God’s righteousness (Greek dikaioō) by accepting John’s mode of baptism.'
  - where: 'section 3 plain'
    claim: 'Footnote: “against” themselves, GR for'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/7?lang=eng'
    quote: 'GR for.'
  - where: 'section 4 plain'
    claim: 'Footnote: “box,” GR flask'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/7?lang=eng'
    quote: 'GR flask.'
  - where: 'section 4 plain'
    claim: 'Footnote: “pence,” GR denarii, a workman’s daily wage'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/7?lang=eng'
    quote: 'GR denarii; one denarius was a workman’s daily wage.'

  # ---- the centurion
  - where: 'note 7:2 “A centurion in Capernaum”'
    claim: 'He is also read as a Roman officer'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'A centurion is a Roman officer; further, this man is a Gentile, as 7:9 shows.'
  - where: 'note 7:2 “A centurion in Capernaum”'
    claim: 'A centurion typically commanded a hundred soldiers; this man is a Gentile, as 7:9 shows'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'A centurion is a Roman officer; further, this man is a Gentile, as 7:9 shows. He typically has charge of one hundred soldiers, a century.'
  - where: 'note 7:2 “A centurion in Capernaum”'
    claim: 'Roman units had no permanent presence in Galilee until after the Jewish revolts'
    key: grey-peter-capernaum
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/simon-peter-capernaum-archaeological-survey-first-century-village'
    quote: 'historical sources indicate that Roman military units had no permanent presence in Galilee until after the Jewish revolts'
  - where: 'note 7:2 “A centurion in Capernaum”'
    claim: 'The centurion must have been a Herodian officer with a title adopted from the Roman army'
    key: grey-peter-capernaum
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/simon-peter-capernaum-archaeological-survey-first-century-village'
    quote: 'Therefore, the “centurion” of the synoptic Gospels must have been a Herodian military officer who was given a title adopted from the Roman army.'
  - where: 'note 7:2 “A centurion in Capernaum”'
    claim: 'The servant is a slave (doulos); no mandated release for slaves of Gentiles; the centurion is humane'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'The term translated “servant” (Greek doulos) refers to a slave. For slaves of Gentiles, there is no mandated release as there is for slaves or servants of Jews (see Deut. 15:12–18).5 In this case, we sense that the centurion is a humane person'
  - where: 'note 7:5 “He hath built us a synagogue”'
    claim: 'Some hold the reference points to a first-century structure under the fourth-century building'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'The reference must point to the first-century structure that underlies the fourth-century building whose remains can be seen in Capernaum.'
  - where: 'note 7:5 “He hath built us a synagogue”'
    claim: 'Gentile contributors to synagogues are known in Asia Minor; the centurion may be a major contributor rather than sole sponsor'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'gentile contributors to synagogues in towns of Asia Minor are known.8 Similarly, the centurion may be a major contributor to this building in Capernaum rather than its sole sponsor.'
  - where: 'note 7:5 “He hath built us a synagogue”'
    claim: 'Some suggest he was a god-fearer or proselyte, which cannot be demonstrated'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'Some suggest that he may be a “god-fearer” or proselyte to Judaism. Although we cannot demonstrate these assertions, he may well embrace at least the noble characteristics of his Jewish neighbors.'
  - where: 'note 7:5 “He hath built us a synagogue”'
    claim: 'The visible limestone synagogue at Capernaum dates to about the fifth century; some claim an earlier basalt synagogue beneath'
    key: grey-peter-capernaum
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/simon-peter-capernaum-archaeological-survey-first-century-village'
    quote: 'Most scholars now agree that Capernaum’s monumental limestone synagogue was built around the fifth century,[133] but some claim that this building was built on an earlier basalt synagogue that stood on the site in the first century.'
  - where: 'note 7:5 “He hath built us a synagogue”'
    claim: 'There is a strong case against a first-century basalt synagogue at the site'
    key: grey-peter-capernaum
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/simon-peter-capernaum-archaeological-survey-first-century-village'
    quote: 'Together, these observations make a strong case against the proposal that a first-century basalt synagogue stood at the site.'
  - where: 'note 7:5 “He hath built us a synagogue”'
    claim: 'No positive evidence of a building given by a Gentile benefactor'
    key: grey-peter-capernaum
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/simon-peter-capernaum-archaeological-survey-first-century-village'
    quote: 'there is no positive evidence for this usage or for the building having been built by a Gentile benefactor such as the “centurion.”'
  - where: 'note 7:5 “He hath built us a synagogue”'
    claim: 'No archaeological trace of Gentiles at Capernaum'
    key: grey-peter-capernaum
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/simon-peter-capernaum-archaeological-survey-first-century-village'
    quote: 'Unfortunately, there is no archaeological trace of a Gentile presence at Capernaum—no pig bones, Greek inscriptions, or Roman art—leaving the impression that the village was entirely inhabited by conservative Jews.'
  - where: 'note 7:5 “He hath built us a synagogue”'
    claim: 'Matthew implies tension between the centurion and his neighbors, Luke mutual affection'
    key: grey-peter-capernaum
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/simon-peter-capernaum-archaeological-survey-first-century-village'
    quote: 'Matthew implies a high degree of tension between the “centurion” and his Jewish neighbors (see Matthew 8:5–13), whereas Luke claims that there was a mutual affection between him and the local elders (see Luke 7:1–5).'
  - where: 'note 7:6 “Worthy, and not worthy”'
    claim: 'The centurion judges Jesus will respond more sympathetically to fellow Jews; the elders respond out of respect for him'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'It appears the centurion judges Jesus will respond more sympathetically to the plea of his fellow Jews than to an appeal from a Gentile.'
  - where: 'note 7:6 “Worthy, and not worthy”'
    claim: 'The elders respond out of respect and esteem for the man'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'The Jewish elders evidently respond out of respect and esteem for the man (see 7:5).'
  - where: 'note 7:6 “Worthy, and not worthy”'
    claim: 'The friends of 7:6 are probably Gentiles, distinct from the elders'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'One suspects that these friends are Gentiles who enjoy fellowship with the centurion and spend time in his company. This group is to be distinguished from “the elders of the Jews” who come beforehand (see 7:3).'
  - where: 'note 7:6 “Worthy, and not worthy”'
    claim: 'Entering a Gentile’s home or setting foot on his property would bring ritual uncleanness'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'obliges Jesus to decide whether to enter a Gentile’s home, or even to set foot on his property, in order to bring healing to the servant, an act that will smear him with ritual uncleanness.'
  - where: 'note 7:6 “Worthy, and not worthy”'
    claim: 'The centurion knows the difficulty and urges Jesus not to come in'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'The centurion is plainly aware of the difficulty that Jesus, a Jew, faces when coming to his home. Here he shows his sensitivity about the dilemma and urges Jesus not to come inside.'
  - where: 'note 7:6 “Worthy, and not worthy”'
    claim: 'Luke gives his Gentile readers the centurion’s apprehension in approaching the Savior'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'By quoting the words of this Gentile, Luke expresses for his gentile readers the feelings of apprehension in approaching the Savior.'
  - where: 'note 7:6 “Worthy, and not worthy”'
    claim: 'Matthew has the centurion come in person, Luke the elders; no real discrepancy'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'There is here no real discrepancy. It was then allowable, as in our time it is, to speak of one who causes something to be done as doing that thing himself.'
  - where: 'note 7:9 “So great faith”'
    claim: 'The centurion reasoned from his own authority: under officers, obeyed by subordinates without attending; One with Jesus’s power could command and be obeyed'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'He himself was a man of authority, though under the direction of superior officers. To his subordinates he gave orders which were obeyed. He did not find it necessary to personally attend to the carrying out of his instructions. Surely One who had such power as Jesus possessed could command and be obeyed.'
  - where: 'note 7:9 “So great faith”'
    claim: 'How Jesus could marvel: He pondered the faith, probably as a refreshing contrast to the unbelief He met'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'when the fact of the centurion’s faith was brought to His attention, He pondered over it, and contemplated it, probably as a refreshing contrast to the absence of faith He so generally encountered.'
  - where: 'note 7:9 “So great faith”'
    claim: 'Luke leaves out the warning Matthew records about many from east and west and the exclusion of the children of the kingdom'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/7.htm'
    quote: 'It is, perhaps, characteristic of both the Evangelists that St. Luke omits the warning words which St. Matthew records as to the “many that shall come from the east and the west,” and the exclusion of the children of the kingdom.'
  - where: 'note 7:9 “So great faith”'
    claim: 'Luke gives the saying about coming from east and west in another setting (13:29)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/13?lang=eng'
    quote: 'And they shall come from the east, and from the west, and from the north, and from the south, and shall sit down in the kingdom of God.'
  - where: 'note 7:9 “So great faith”'
    claim: 'Brown’s reading: “marvelled” is better “admired him,” said with surprise and pleasure to those who followed'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'Does Jesus marvel within himself? Probably not. Instead, “he admired him.” We think of Jesus expressing surprise and pleasure to those “that followed him,”'

  # ---- Nain
  - where: 'note 7:11 “A city called Nain”'
    claim: 'Nain was a small farming village against Mount Moreh, off the beaten path, reached by one road'
    key: wilson-widow-nain
    url: 'https://rsc.byu.edu/learn-me/times-discouragement-remember-widow-nain'
    quote: 'Nain was a small farming village at Jesus’s time, nestled up against Mount Moreh, which defined the east side of the Jezreel Valley. The town itself was off the beaten path. Access to it was limited to a single road.'
  - where: 'note 7:11 “A city called Nain”'
    claim: 'Capernaum is 600 feet below sea level; Nain about thirty miles away at 700 feet above'
    key: wilson-widow-nain
    url: 'https://rsc.byu.edu/learn-me/times-discouragement-remember-widow-nain'
    quote: 'Capernaum is situated on the northern shore of the Sea of Galilee, at an elevation of 600 feet (183 m) below sea level. Nain is about thirty miles (forty-eight km) away from Capernaum at 700 feet (213 m) above sea level'
  - where: 'note 7:11 “A city called Nain”'
    claim: 'Jesus probably rose very early or walked in the night to meet the procession'
    key: wilson-widow-nain
    url: 'https://rsc.byu.edu/learn-me/times-discouragement-remember-widow-nain'
    quote: 'This means that Jesus probably had to arise very early or possibly even walk during the night in order to intercept the burial procession “the day after.”'
  - where: 'note 7:11 “A city called Nain”'
    claim: 'Some early manuscripts (P75) read “soon afterward”; whether to prefer it remains open'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'If the earliest papyrus manuscript, P75, and other early texts are to be trusted, they preserve a longer, less definite expression that means “soon afterward.”18 But whether this expression is to be preferred remains open to examination.'
  - where: 'note 7:11 “A city called Nain”'
    claim: 'Jesus probably knew the widow’s condition and walked the distance to meet the procession at the gate'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'it is probable that, with his divine powers that Luke features (see the Notes on 5:22; 11:17),21 Jesus knows the wretched condition of the widow and walks the long distance so that he can meet the funeral procession as it emerges from the gates of the town'
  - where: 'note 7:12 “The only son of his mother”'
    claim: '“Only son” is monogenēs, so no daughters; a widow did not inherit from her husband'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'There are no daughters because Luke calls the woman’s son “only begotten” (Greek monogenēs). Under current Israelite law, a widow does not inherit anything from her husband’s estate.'
  - where: 'note 7:12 “The only son of his mother”'
    claim: 'The son’s death brings her face to face with stark poverty; “young man” suggests his mid-twenties'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'the death of her son brings her face to face with stark poverty. This is especially so if (1) she is beyond her child-bearing years—Jesus calls her son a “young man” (7:14), a person presumably in his mid-twenties (Greek neaniskos)'
  - where: 'note 7:12 “The only son of his mother”'
    claim: 'A married woman’s care passed to her birthright son if her husband died; with him dead she was at the end of her means'
    key: wilson-widow-nain
    url: 'https://rsc.byu.edu/learn-me/times-discouragement-remember-widow-nain'
    quote: 'Upon marriage, a woman was assigned to her husband’s family for financial protection. If he died, then her care was delegated to her birthright son. Now that this widow’s birthright and only son was dead, she was at the end of her rope financially.'
  - where: 'note 7:14 “He came and touched the bier”'
    claim: 'Compassion is the heart of the account; Jesus acts without being asked'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'Luke’s words “he had compassion on her” (7:13) draw up the heart of the account. Notably, Jesus initiates the action, stepping toward the funeral procession without anyone requesting his aid.'
  - where: 'note 7:14 “He came and touched the bier”'
    claim: 'Luke alone adds Jesus’s compassion for the widow of Nain'
    key: huntsman-lukes-jesus
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
    quote: 'To these common Synoptic examples, however, Luke adds several others, such as Jesus’s having compassion at the plight of the widow of Nain (Luke 7:13–15) and the ten lepers (17:11–19).'
  - where: 'note 7:14 “He came and touched the bier”'
    claim: '“Lord” first appears from Luke’s hand in 7:13; there Jesus is lord over death'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'This title first appears from Luke’s hand in 7:13 and is repeated in many manuscripts of 7:19. In the first, Jesus is lord over death'
  - where: 'note 7:14 “He came and touched the bier”'
    claim: 'The touch renders Jesus unclean; a greater need exists; His majesty overpowers the ritual stain'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'The touch renders Jesus ritually unclean. But a greater need exists than remaining ritually clean, and he shows an example of setting aside one need for a higher.28 Moreover, the majesty of his person overpowers the ritual stain'
  - where: 'note 7:14 “He came and touched the bier”'
    claim: 'Haptomai means to take hold of; Jesus grasps the bier and stops it'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'The verb “to touch” (Greek haptomai) bears the sense “to take hold of” or “to cling.”29 Hence, we see in our mind’s eye Jesus grasping the bier firmly and stopping its movement.'
  - where: 'note 7:16 “A great prophet is risen up among us”'
    claim: 'Elijah raised the son of the widow of Zarephath; Jesus at Nain met a widow whose only son had died'
    key: seely-messiah
    url: 'https://rsc.byu.edu/approaching-holiness/jesus-messiah-prophet-priest-king'
    quote: 'During his ministry, Elijah confronted the priests of Baal, sealed the heavens, and raised the son of the widow of Zarephath. Similarly, when Jesus entered a small village called Nain, he was met by a widow whose only son had died.'
  - where: 'note 7:16 “A great prophet is risen up among us”'
    claim: 'The raising at Nain recalls Elisha’s raising of the Shunammite’s only son, whose home was on the other side of the hill of Moreh'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'the raising of the young man at Nain appears to recall Elisha’s raising of the only son of the Shunammite woman whose residence was on the backside of the hill of Moreh from Nain (see 2 Kgs. 4:32–37).'
  - where: 'note 7:16 “A great prophet is risen up among us”'
    claim: '“God hath visited his people”: God coming among His people in Jesus, linked to 1:68, 78'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'The notion that God comes among his people, here in the person of Jesus,33 links to the Shekinah, the experience of God descending into the midst of his people and remaining with them (see the Notes on 1:68, 78; and 6:17).'
  - where: 'note 7:16 “A great prophet is risen up among us”'
    claim: 'People compare Jesus with this or that prophet, and at the end His followers still call Him “a prophet mighty in deed”'
    key: huntsman-lukes-jesus
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
    quote: 'The people subsequently have different opinions of Jesus, comparing him with this or that prophet (Luke 9:7–8, 18–19), and as late as the day of the resurrection, some of his own followers are still considering him “a prophet mighty in deed and word before God and all the people” (Luke 24:19).'

  # ---- John's question
  - where: 'note 7:19 “Art thou he that should come?”'
    claim: 'The Church’s reading: John sent two disciples to reassure their faith; many have thought it showed doubt in John'
    key: bd-john-the-baptist
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/john-the-baptist?lang=eng'
    quote: 'While in prison, John sent two of his disciples to inquire of Jesus to reassure their faith. Many have thought this event reflected a lack of confidence in John’s own mind.'
  - where: 'note 7:19 “Art thou he that should come?”'
    claim: 'Many scholars read the question as John’s doubt'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'Many scholars understand this question as pointing up a substantial gap between John and Jesus. In their minds, the Baptist seems to be in doubt about the mission of his distant cousin'
  - where: 'note 7:19 “Art thou he that should come?”'
    claim: '“The one who comes” hints at Malachi 3:1’s messenger and at His messianic role'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'The expression “the one who comes,” as the Greek text reads (ho erchomenos), hints at the messenger of Malachi 3:1 (see 3:16; 7:27; Matt. 11:3), a role that Jesus fills in part, though he is not Elijah returned (see 9:18–21).42 It also hints at his messianic role.'
  - where: 'note 7:19 “Art thou he that should come?”'
    claim: 'Because angels ministered to John (JST Matt. 4:11), he is likely not seeking reassurance for himself but wants to expose his disciples to the Savior'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'But because Jesus sends angels to minister to him weeks earlier (see JST Matt. 4:11), he is likely not seeking clarity and reassurance for himself about Jesus as “the coming one.” Rather, it appears that he wants to expose his disciples to the Savior'
  - where: 'note 7:19 “Art thou he that should come?”'
    claim: 'JST Matthew 4:11: Jesus sent angels to minister to John in prison'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/4?lang=eng'
    quote: 'And now Jesus knew that John was cast into prison, and he sent angels, and, behold, they came and ministered unto him.'
  - where: 'note 7:19 “Art thou he that should come?”'
    claim: 'John had already testified of Jesus; it was the two disciples’ testimony in question'
    key: benson-matthews-john-baptist
    url: 'https://rsc.byu.edu/vol-10-no-2-2009/john-baptist-miracle-mission'
    quote: 'John had already borne testimony of Jesus as the Lamb of God and told his disciples that his own mission must decrease while Jesus’s must increase. It was not John’s testimony that was in question but the testimony of these two disciples.'
  - where: 'note 7:19 “Art thou he that should come?”'
    claim: 'Sending two may rest on the law of two witnesses'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'The Baptist’s act of sending two persons may rest on the requirement in the Mosaic law for at least two witnesses (see Deut. 19:15).'
  - where: 'note 7:22 “Tell John what things ye have seen and heard”'
    claim: 'Instead of an immediate reply in words, Jesus continued His labor, relieving many in that same hour, then turned to the two'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'instead of giving an immediate reply in words, He continued His labor, relieving in that same hour many who were afflicted by blindness or infirmities, or who were troubled by evil spirits. Then, turning to the two who had communicated the Baptist’s question'
  - where: 'note 7:22 “Tell John what things ye have seen and heard”'
    claim: 'John, who had cited Isaiah himself, could hardly fail to remember that by these tokens the Messiah should be known'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'the imprisoned prophet could scarcely have failed to remember the predictions of Isaiah, that by those very tokens of miracle and blessing should the Messiah be known'
  - where: 'note 7:22 “Tell John what things ye have seen and heard”'
    claim: 'Declaring Isaiah 61 fulfilled, Jesus declared Himself the Messiah, offering not deliverance from Rome but healing and victory over death and hell'
    key: sc-knowhy-656
    url: 'https://scripturecentral.org/knowhy/why-does-jesus-announce-that-isaiah-611-2-is-fulfilled'
    quote: 'By declaring that this passage had been fulfilled, Jesus effectively declared Himself to be that very Messiah. Far from offering deliverance from Roman occupation, however, Jesus would focus His ministry on healing the brokenhearted and the blind and on conquering death and hell.'
  - where: 'note 7:22 “Tell John what things ye have seen and heard”'
    claim: 'Jesus performed the miracles Isaiah named, but never in Nazareth, for lack of faith (its note 9 lists Luke 7:22 among them)'
    key: sc-knowhy-656
    url: 'https://scripturecentral.org/knowhy/why-does-jesus-announce-that-isaiah-611-2-is-fulfilled'
    quote: 'Ironically, Jesus would perform the very miracles spoken of by Isaiah—healing the blind and broken hearted, preaching the gospel to the poor, and many more—but never in Nazareth. He could do no such things there because of the people’s lack of faith.'
  - where: 'note 7:22 “Tell John what things ye have seen and heard”'
    claim: 'The blessing on those not offended: misunderstanding of the Messiah’s mission leads to offense'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: '“Blessed is he, whosoever shall not be offended in me,” said the Lord. Misunderstanding is the prelude to offense.'
  - where: 'note 7:22 “Tell John what things ye have seen and heard”'
    claim: 'Prophecies of the Messiah point to these healings: Isaiah 29:18; 35:5; 61:1 (LXX); Mosiah 3:5'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'prophecies about the Messiah’s merciful actions specifically point to this kind of healing, and we should therefore expect it (see Isa. 29:18; 35:5; 42:18; 43:8; LXX Isa. 61:1; Mosiah 3:5'
  - where: 'note 7:26 “Much more than a prophet”'
    claim: 'More than a prophet: other prophets foretold the Messiah; John saw Him, baptized Him and served Him as a body servant'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'They had found in John a prophet indeed, yea, more than a prophet; … Other prophets had told of the Messiah’s coming, but John had seen Him, had baptized Him, and had been to Jesus as a body servant to his master.'
  - where: 'note 7:26 “Much more than a prophet”'
    claim: 'No reed shaken by the wind; soft raiment in the king’s court, not in the wilderness or the dungeon where John lay'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'they had found him to be no reed, shaken by the wind, but a firm and unbending oak. They had not gone to see a man in fashionable attire; those who wore soft raiment were to be looked for in the court of the king, not in the wilderness, nor in the dungeon where John now lay.'
  - where: 'note 7:26 “Much more than a prophet”'
    claim: 'D&C 84:28: John ordained by an angel at eight days old to make straight the way of the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'was ordained by the angel of God at the time he was eight days old unto this power, to overthrow the kingdom of the Jews, and to make straight the way of the Lord before the face of his people, to prepare them for the coming of the Lord'
  - where: 'note 7:26 “Much more than a prophet”'
    claim: 'Jesus pointed out that John fulfilled Malachi 3:1; his greatness lay in his unique privileges and the quality of his work'
    key: bd-john-the-baptist
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/john-the-baptist?lang=eng'
    quote: 'Jesus also pointed out that John had fulfilled the prophecy of Mal. 3:1. … This greatness consisted of his unique privileges and the quality of his work.'
  - where: 'note 7:26 “Much more than a prophet”'
    claim: 'Luke’s “gorgeously apparelled, and live delicately” is more vivid than Matthew’s; such luxury was common in Herod’s house'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/7.htm'
    quote: 'The words are more vivid than those in St. Matthew (“they that wear soft clothing”), and bring out the idea of ostentatious display and extravagant excess of luxury, as well as effeminate self-indulgence. Such forms of selfishness were common among the house of Herod and their followers.'
  - where: 'note 7:28 “He that is least in the kingdom of God”'
    claim: 'Commentators read it of John’s followers’ access to blessings; early Christian authors and Joseph Smith read it of Jesus Himself, with D&C 50:26–28'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'Commentators regularly read Jesus’ comment as declaring the Baptist and his followers to be less than Jesus and his disciples, not as individuals, but in their direct access to God’s blessings.51 According to some early Christian authors, and to Joseph Smith, Jesus is referring to himself as the least in the kingdom (see D&C 50:26–28).'
  - where: 'note 7:28 “He that is least in the kingdom of God”'
    claim: 'D&C 50:26: the greatest, notwithstanding he is the least'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/50?lang=eng'
    quote: 'He that is ordained of God and sent forth, the same is appointed to be the greatest, notwithstanding he is the least and the servant of all.'
  - where: 'note 7:28 “He that is least in the kingdom of God”'
    claim: 'Joseph Smith: John’s greatness was not his miracles'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'How is it that John was considered one of the greatest of prophets? His miracles could not have constituted his greatness.'
  - where: 'note 7:28 “He that is least in the kingdom of God”'
    claim: 'First reason: entrusted with preparing the way before the Lord'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'He was entrusted with a divine mission of preparing the way before the face of the Lord. Whoever had such a trust committed to him before or since? No man.'
  - where: 'note 7:28 “He that is least in the kingdom of God”'
    claim: 'Second reason: to baptize the Son of Man'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'He was entrusted with the important mission, and it was required at his hands, to baptize the Son of Man.'
  - where: 'note 7:28 “He that is least in the kingdom of God”'
    claim: 'Third reason: the only legal administrator, holding the keys'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'John, at that time, was the only legal administrator in the affairs of the kingdom there was then on the earth, and holding the keys of power.'
  - where: 'note 7:28 “He that is least in the kingdom of God”'
    claim: '“He that is least” is Jesus Himself, looked upon as having the least claim'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'Jesus was looked upon as having the least claim in God’s kingdom, and [seemingly] was least entitled to their credulity as a prophet; as though He had said—‘He that is considered the least among you is greater than John—that is I myself.’'
  - where: 'note 7:30 “Rejected the counsel of God against themselves”'
    claim: 'Verses 29–30 are Luke’s own statement, interposed, on the two classes at opposite extremes'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/7.htm'
    quote: 'St. Luke interposing a statement, probably intended for his Gentile readers, as to the effect produced by the preaching of the Baptist on the two classes who stood at opposite extremes of the social and religious life of Judæa.'
  - where: 'note 7:30 “Rejected the counsel of God against themselves”'
    claim: '“Justified God”: acknowledged God’s righteousness by accepting John’s baptism'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'The sense is that Jesus’ hearers acknowledge God’s righteousness (Greek dikaioō) by accepting John’s mode of baptism.'
  - where: 'note 7:30 “Rejected the counsel of God against themselves”'
    claim: 'Lawyers, or scribes, have been experts in the law since Ezra'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'Lawyers, or scribes, have been experts in the Mosaic law since the days of Ezra.'
  - where: 'note 7:30 “Rejected the counsel of God against themselves”'
    claim: 'The title “lawyers” appears most in Luke'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'As a title, “lawyers” appears most regularly in Luke’s Gospel (see 10:25; 11:45, 46, 52; 14:3; also Matt. 22:35; Titus 3:13).'
  - where: 'note 7:30 “Rejected the counsel of God against themselves”'
    claim: '“The counsel of God” can be equated to the plan of salvation; a strong condemnation'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'These words carry a strong condemnation of those who choose to turn away from the divine message. Here and elsewhere, “the counsel of God” can be equated to the plan of salvation (see Acts 2:23; 4:28; 20:27; Heb. 6:17).'
  - where: 'note 7:30 “Rejected the counsel of God against themselves”'
    claim: 'Footnote: “against” themselves, GR for'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/7?lang=eng'
    quote: 'GR for.'
  - where: 'note 7:30 “Rejected the counsel of God against themselves”'
    claim: 'Accepting John’s baptism is a first step in coming to the Savior'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'As a later story illustrates, accepting this baptism from John, or his disciples, is a first step in coming to the Savior, as John himself affirms (see 3:16; Acts 19:1–6).'
  - where: 'note 7:30 “Rejected the counsel of God against themselves”'
    claim: 'The verb dikaioō in 7:35 means to be accepted as just, as in 7:29'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'One of the prominent meanings of the verb (Greek dikaioō) is “to be considered just” and, in this context, “to be accepted as just”61 (see the Notes on 7:29; 10:29; 18:14).'
  - where: 'note 7:32 “We have piped unto you”'
    claim: 'It is unclear whether this generation are the children who change their tune and turn critical, or those who refuse to respond'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'It is not clear whether “the men of this generation” (7:31) are like those who first “piped” and then “mourned,” effectively changing their attitudes to be critical'
  - where: 'note 7:32 “We have piped unto you”'
    claim: 'The generation is like fickle children at play: a mock wedding and a mock funeral, and the others will not join'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'Some wanted to enact the pageantry of a mock wedding, and though they piped the rest would not dance; then they changed to a funeral procession and essayed the part of mourners, but the others would not weep as the rules of the game required.'
  - where: 'note 7:32 “We have piped unto you”'
    claim: 'John came like the strict prophets of old; the Son of Man ate and drank as a normal man'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'John the Baptist had come amongst them like the eremitic prophets of old, as strict as any Nazarite, refusing to eat with the merry-makers or drink with the convivial'
  - where: 'note 7:32 “We have piped unto you”'
    claim: 'Children commonly played among the stalls of the marketplace'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'These lines offer a small window into the ordinary lives of children in Jesus’ society, telling readers that it is common for children to play among the stalls in a town’s marketplace'
  - where: 'note 7:32 “We have piped unto you”'
    claim: 'Wisdom appears almost as a divine person, as in Proverbs 8, with children who follow her; they know she is right'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'In this saying, whose origin is unknown, “wisdom” appears almost as a divine person, as in Proverbs 8:22–30, who possesses children, that is, those who will follow her lead.'

  # ---- Simon's house
  - where: 'note 7:37 “A woman in the city, which was a sinner”'
    claim: 'Many, including Simon, view her as a prostitute, but Luke never makes that label explicit'
    key: strathearn-simon-woman
    url: 'https://rsc.byu.edu/vol-5-no-3-2004/simon-woman-who-anointed-jesuss-feet'
    quote: 'This has led many, including Simon (see verse 39),to view her as a prostitute,[8] but it is important to note that Luke never makes that label explicit in his recounting of the story.'
  - where: 'note 7:37 “A woman in the city, which was a sinner”'
    claim: 'Luke’s silence on the details lets readers put in their own'
    key: strathearn-simon-woman
    url: 'https://rsc.byu.edu/vol-5-no-3-2004/simon-woman-who-anointed-jesuss-feet'
    quote: 'Luke’s silence on the specific details gives his readers another opportunity to insert the details from their own life pages.'
  - where: 'note 7:37 “A woman in the city, which was a sinner”'
    claim: 'The words about her reputation are Luke’s, likely borrowed from the host’s view'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'These words belong to Luke. He likely borrows the language about the woman’s reputation from the Pharisee host (see 7:39)'
  - where: 'note 7:37 “A woman in the city, which was a sinner”'
    claim: 'Identifying her with Mary of Bethany is wholly unfounded'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'By certain writers she has been represented as the Mary of Bethany who, shortly before Christ’s betrayal, anointed the head of Jesus with spikenard; but the assumption of identity is wholly unfounded'
  - where: 'note 7:37 “A woman in the city, which was a sinner”'
    claim: 'Identifying her with Mary Magdalene is equally wrong'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'Equally wrong is the attempt made by others to identify this repentant and forgiven sinner with Mary Magdalene, no period of whose life was marked by the sin of unchastity so far as the scriptures aver.'
  - where: 'note 7:38 “Stood at his feet behind him”'
    claim: 'Jesus was reclining on a couch, so she stood behind at His feet; it was a formal banquet'
    key: strathearn-simon-woman
    url: 'https://rsc.byu.edu/vol-5-no-3-2004/simon-woman-who-anointed-jesuss-feet'
    quote: 'Recognizing that Jesus was reclining on a couch helps us make better sense of the detail that the woman stood behind His feet when she began to wash them with her tears (see Luke 7:38). This point (along with the fact that there are others also at the meal) suggests that this was a formal banquet.'
  - where: 'note 7:38 “Stood at his feet behind him”'
    claim: 'Uncovering her head and hair may have caused unease, an act of shame in some parts of the culture'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'The host and guests may feel some unease because the woman has plainly uncovered her head and hair, an act of shame in some parts of their culture'
  - where: 'note 7:38 “Stood at his feet behind him”'
    claim: 'Grasping or washing another’s feet is a very low posture, like prostration'
    key: calabro-nonverbal
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/nonverbal-communication-new-testament'
    quote: 'The gestures of grasping another’s feet and washing another’s feet may be grouped together because they both involve a very low posture relative to the other person, being therefore similar to prostration'
  - where: 'note 7:38 “Stood at his feet behind him”'
    claim: 'Her washing, kissing and perfuming can represent cleansing, embracing a life free of sin, and knowing sins forgiven'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'her actions can represent the cleansing that a person goes through in the repentance process (washing), in the embracing of a life free of sin (kissing), and in the sweet, clean aroma of knowing that one’s sins are permanently forgiven (perfuming).'
  - where: 'note 7:39 “If he were a prophet”'
    claim: 'Simon’s view of a prophet: one who sees the unknown, such as people’s thoughts'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'This statement envisions a certain view of what a prophet is and the powers that a prophet possesses, understanding a prophet as one equipped with power to see the unknown and unknowable, such as people’s thoughts'
  - where: 'note 7:39 “If he were a prophet”'
    claim: 'Jesus shows He is a prophet by calling Simon to task for his thoughts'
    key: strathearn-simon-woman
    url: 'https://rsc.byu.edu/vol-5-no-3-2004/simon-woman-who-anointed-jesuss-feet'
    quote: 'The irony here is that Jesus chooses to show Simon that He is indeed a prophet, not by judging the woman’s outward actions but by calling Simon to task for his own thoughts.'
  - where: 'note 7:39 “If he were a prophet”'
    claim: 'Simon’s name is recorded; Jesus knows each person as an individual'
    key: strathearn-simon-woman
    url: 'https://rsc.byu.edu/vol-5-no-3-2004/simon-woman-who-anointed-jesuss-feet'
    quote: 'Unlike all the other Pharisees mentioned in the four Gospels, this particular Pharisee’s name is recorded. It is Simon. I believe this reminds the readers that Jesus knows each person as an individual'
  - where: 'note 7:39 “If he were a prophet”'
    claim: '“Master” is a title of modest respect that does not fully describe Jesus'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'Though a title of modest respect on the lips of Simon the Pharisee, it does not describe fully what and who Jesus is.'
  - where: 'note 7:44 “Seest thou this woman?”'
    claim: 'Washing guests’ feet was a hospitality rite, usually by female servants; otherwise water was provided'
    key: calabro-nonverbal
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/nonverbal-communication-new-testament'
    quote: 'In ancient Israel, the washing of the feet of guests was a hospitality rite generally delegated to female servants. If the household had no female servant, water would be provided for the guest to wash his or her own feet'
  - where: 'note 7:44 “Seest thou this woman?”'
    claim: 'The kiss is the customary greeting of friends'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'Jesus points to the customary greeting of friends.'
  - where: 'note 7:44 “Seest thou this woman?”'
    claim: 'Jesus lists the omitted customary acts; the woman fills them in unusual ways'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'Jesus begins his famous list of omitted yet customary acts that will illustrate how a person shows love for another. The woman fills those usual courtesies in unusual ways'
  - where: 'note 7:44 “Seest thou this woman?”'
    claim: '“Seest thou this woman?” invites Simon to see her as the Savior saw her'
    key: strathearn-simon-woman
    url: 'https://rsc.byu.edu/vol-5-no-3-2004/simon-woman-who-anointed-jesuss-feet'
    quote: 'Jesus’s question, “Seest thou this woman?” in verse 44, is an invitation for Simon to lift his sights and see the woman as the Savior saw her.'
  - where: 'note 7:44 “Seest thou this woman?”'
    claim: 'Simon neglected to treat his guest with respect; at this meal the one at fault was not the woman'
    key: strathearn-simon-woman
    url: 'https://rsc.byu.edu/vol-5-no-3-2004/simon-woman-who-anointed-jesuss-feet'
    quote: 'He had invited the Savior as a guest into his home but then had neglected to treat him with the respect He deserved. The Pharisees were correct when they charged that Jesus ate with sinners, but in this case, regardless of how Simon might have judged his personal worthiness, the sinner was not the woman.'
  - where: 'note 7:47 “For she loved much”'
    claim: 'The perfect tense can be “have been forgiven”'
    key: strathearn-simon-woman
    url: 'https://rsc.byu.edu/vol-5-no-3-2004/simon-woman-who-anointed-jesuss-feet'
    quote: 'The perfect tense of the Greek word afaontaican be translated as “have been forgiven”'
  - where: 'note 7:47 “For she loved much”'
    claim: 'The parable indicates love is the result of forgiveness; hoti can be logical or resultant'
    key: strathearn-simon-woman
    url: 'https://rsc.byu.edu/vol-5-no-3-2004/simon-woman-who-anointed-jesuss-feet'
    quote: 'Jesus’s use of the parable of the two debtors strongly indicates that the outpouring of love is the result of forgiveness rather than the catalyst for it. The important Greek word is the conjunction hoti that is here translated in a causal sense, “because.” However, it can also be translated in a logical or resultant sense'
  - where: 'note 7:47 “For she loved much”'
    claim: 'She had experienced forgiveness before entering Simon’s house'
    key: strathearn-simon-woman
    url: 'https://rsc.byu.edu/vol-5-no-3-2004/simon-woman-who-anointed-jesuss-feet'
    quote: 'This unnamed woman had experienced the power of that complete forgiveness before she ever entered Simon’s house.'
  - where: 'note 7:47 “For she loved much”'
    claim: 'The question need not be resolved one way; forgiveness springs from evidences that a person seeks it and shows in the good that results'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'But the question need not be resolved in favor of one view or the other. For forgiveness both springs from visible and invisible evidences that a person seeks it (see 6:37; 1 Ne. 7:20; D&C 31:5) and then manifests itself in the good that results'
  - where: 'note 7:47 “For she loved much”'
    claim: 'In all instances repentance is required and forgiveness is God’s alone to bestow'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'In all instances, repentance is required and forgiveness is God’s alone to bestow (see 5:24; Isa. 43:25; Jer. 33:8).'
  - where: 'note 7:47 “For she loved much”'
    claim: 'Jesus announces the forgiveness first to Simon, the host'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'It is important to note that Jesus does not announce the forgiveness of the woman’s sins to her. Instead, he announces the forgiveness to Simon, the host of the meal and owner of the home.'
  - where: 'note 7:49 “Who is this that forgiveth sins also?”'
    claim: 'The guests’ question is right; the irony is their view that He is not a prophet; the answer is that He is the Messiah'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'The true answer will make all the difference in the world for them if they will open themselves to that answer—he is the Messiah'
  - where: 'note 7:49 “Who is this that forgiveth sins also?”'
    claim: 'Her faith moved her to break social conventions and come uninvited to a dinner of men'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'At the base of this account lies the woman’s faith that, if she seeks the Savior’s forgiveness, she will receive it. That sense of trust apparently moves her forcefully enough to break social conventions and appear uninvited in the midst of a dinner party likely consisting of men only.'
  - where: 'note 7:49 “Who is this that forgiveth sins also?”'
    claim: 'The pronouncement of 7:48 restates what she knew and is a public declaration before Simon and his guests'
    key: strathearn-simon-woman
    url: 'https://rsc.byu.edu/vol-5-no-3-2004/simon-woman-who-anointed-jesuss-feet'
    quote: 'Jesus’s declaration to the woman in verse 48, “Thy sins are forgiven thee,” is a reiteration of what the woman already knew, but it is also a public declaration for Simon and his other guests at the banquet.'
  - where: 'note 7:49 “Who is this that forgiveth sins also?”'
    claim: '“Go in peace”: having received the Atonement’s power she can find peace'
    key: strathearn-simon-woman
    url: 'https://rsc.byu.edu/vol-5-no-3-2004/simon-woman-who-anointed-jesuss-feet'
    quote: 'Having received the power of the Atonement, she can finally find peace with herself, with her God, and, hopefully, with Simon and his other guests.'

