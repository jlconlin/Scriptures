chapter: 16
claims:
  # ---- setting, thread
  - where: setting
    claim: 'Money and property shape most of the chapter, as in chapter 15; the sayings in the middle warn against serving two masters, covetousness, depreciating the law and divorce, and there the JST adds to the setting'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'Money and property shape most of this chapter’s vessel,1 as in the prior chapter. … it is in these latter verses that the Prophet Joseph Smith adds significant details about the setting and direction of Jesus’ sayings.'
  - where: setting
    claim: 'The disciples are the main audience, with Pharisees listening at the edges; the notice of the Pharisees ties back to 15:2'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'These followers constitute Jesus’ main audience, not a general crowd of people nor even “the publicans and sinners” (15:1), although Pharisees are listening from the edges (see 16:14).'
  - where: setting
    claim: 'The disciples present probably included many believers besides the apostles, even some publicans'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'Addressing Himself more directly to the disciples present, who on this occasion probably comprized in addition to the apostles, many believers, including even some of the publicans, Jesus spake the Parable of the Unrighteous Steward.'
  - where: setting
    claim: 'Both stories open with “a certain rich man,” and wealth is a major element in each'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'a certain rich man: This expression is mirrored in 16:19. In these stories, Jesus features people whose means allow them to live more comfortably than many in his audience. In each case, their wealth stands as a major element in the story.'
  - where: thread
    claim: '“Ye cannot serve God and mammon” is the heart of the chapter: it points back to the steward and forward to the sayings and the rich man’s choice of mammon over God'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'Enshrined within these two brawny, negative statements stands the strong, beating heart of the chapter. … at the center of Jesus’ story of Lazarus, Dives, and Abraham dangles the issue of the rich man’s choices'
  - where: thread
    claim: 'The JST has Jesus tell the rich man story to the Pharisees: “I will liken you unto the rich man”'
    key: jst-luke-16
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/16?lang=eng'
    quote: 'Verily I say unto you, I will liken you unto the rich man.'
  - where: thread
    claim: 'The rich man chose to clothe and feed himself and avoid charity, choosing mammon over God'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'the rich man’s choices—to clothe and feed himself, and to avoid simple acts of charity that acknowledge God as the true owner of his abundant goods, thus choosing mammon over God (see 16:19–21).'

  # ---- notes
  - where: 'note 16:1 “A steward”'
    claim: 'The steward here is a free-born manager who oversees the rich man’s estate'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'Although the noun can refer to a slave or servant born in a household who has risen in responsibility,7 here the term bears the sense of a free-born treasurer who oversees the rich man’s estate.'
  - where: 'note 16:1 “A steward”'
    claim: 'The steward was the authorized agent of his employer, with what we would call power of attorney; he did not deny his guilt and was dismissed'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'The steward in the story was the duly authorized agent of his employer, holding what we would call the power-of-attorney to act in his master’s name. … The steward did not deny his guilt, and forthwith he received notice of dismissal.'
  - where: 'note 16:1 “A steward”'
    claim: '“Wasted” is the verb used of the prodigal son (15:13), a tie back to chapter 15; it connotes scattering'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'wasted: The verb is the same as that describing the prodigal son’s action (Greek diaskorpizō), thus forming an important tie back to Jesus’ words in chapter 15 (see 15:13). More than this, it connotes the act of scattering'
  - where: 'note 16:1 “A steward”'
    claim: '“Thou mayest be no longer steward” states the master’s final decision to dismiss him'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'Other commentators agree that the sense of the verb conveys the final decision of the master to dismiss the steward, as indicated in 16:3.'
  - where: 'note 16:1 “A steward”'
    claim: 'The steward is ashamed to beg not from remorse but because begging would show he had been caught and dismissed'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'The shame does not arise in the steward because of remorse for his irresponsible actions but because begging will show that he has been caught and dismissed.15'
  - where: 'note 16:6 “Write fifty”'
    claim: 'A hundred measures of oil is about 900 gallons; the measure (batos) is about 8.6 gallons'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'The amount of oil cannot be determined precisely, but it is approximately 900 gallons. The term translated “measures” (Greek batos) is actually a Hebrew measure which, according to Josephus, amounts to 72 sextarii or about 8.6 gallons per measure.'
  - where: 'note 16:6 “Write fifty”'
    claim: 'The wheat is measured in kors; the total exceeds 100 bushels'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'The measure is the Hebrew kor, a dry measure … By the best calculation, a kor is approximately 360 liters. At all events, the total amount exceeds 100 bushels.22'
  - where: 'note 16:6 “Write fifty”'
    claim: 'The steward had the debtors change their notes to show less debt, defrauding his employer, while still within his legal powers'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'he called his lord’s debtors and authorized them to change their bonds, bills of sale, or notes of hand, so as to show a greatly decreased indebtedness. Without doubt these acts were unrighteous; he defrauded his employer, and enriched the debtors'
  - where: 'note 16:6 “Write fifty”'
    claim: 'A promissory note stated the total owed with interest hidden in it, since Jewish law forbade interest'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'Typically, it does not specify the interest to be paid on the goods, but spells out the entire amount owed, including both interest and principal.18 Thus, under Jewish law, which specifically forbids the charging of interest … the amount of interest to be paid remains hidden'
  - where: 'note 16:6 “Write fifty”'
    claim: 'Fifty may be what the debtor really owed, the rest interest, though this cannot be firmly established'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'fifty: Evidently, this amount represents the quantity that the debtor really owes. The rest is interest, though this cannot be established firmly from other ancient sources.19'
  - where: 'note 16:8 “The lord commended the unjust steward”'
    claim: 'The “lord” in the story is the master, not Jesus; no metaphorical overlay makes him God'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'But on the lips of the steward, the word does not carry this sense because no metaphorical overlay lies here, such as the rich man representing God and the steward standing for the devil or some other detested personality.'
  - where: 'note 16:8 “The lord commended the unjust steward”'
    claim: '“Wisely” (phronimōs) means something like “shrewdly” here'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'wisely: The Greek adverb means something like “shrewdly” or “cunningly” in this context (phronimōs), although the adjective generally carries the more positive sense of “wise” in other passages'
  - where: 'note 16:8 “The lord commended the unjust steward”'
    claim: 'The lord calls the steward wise or clever, not good; his focused effort is worth emulating in eternal matters'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'But we must hold in mind that the lord does not call the steward good, but wise or clever. The distinction is significant because it allows a hearer to grasp that the steward’s efforts … are worth emulating by Jesus’ disciples when it comes to eternal matters.'
  - where: 'note 16:8 “The lord commended the unjust steward”'
    claim: 'Not the steward’s dishonesty but his prudence and foresight were commended; emulate the zeal, not the dishonesty'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'It was not the steward’s dishonesty that was extolled; his prudence and foresight were commended, however'
  - where: 'note 16:8 “The lord commended the unjust steward”'
    claim: 'Jesus contrasts the care and devotion of money-makers with the half-hearted ways of many who seek spiritual riches'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'Our Lord’s purpose was to show the contrast between the care, thoughtfulness, and devotion of men engaged in the money-making affairs of earth, and the half-hearted ways of many who are professedly striving after spiritual riches.'
  - where: 'note 16:8 “The lord commended the unjust steward”'
    claim: '“In their generation” limits the sphere where the children of this world are effective to this world'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'in their generation: Jesus places a limit on the sphere wherein “the children of the world” are and can be effective. Their activities, which bring them what the steward now seeks, a materially prosperous life, find a place in this world, not the next.'
  - where: 'note 16:8 “The lord commended the unjust steward”'
    claim: '“Children of light” is mirrored in the Dead Sea Scrolls (“sons of light”) and means those fully in the kingdom; in modern scripture it ties to readiness for “that day” (D&C 106:5)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'This expression, too, is mirrored in the Dead Sea Scrolls, most often translated as “the sons of light.” … points to those fully within the kingdom … Importantly, in modern scripture, this term ties to a person’s readiness at the end-time, at “that day” (D&C 106:5).'
  - where: 'note 16:9 “The mammon of unrighteousness”'
    claim: 'Mammon is an Aramaic word for wealth or property, here property gained for the wrong reasons'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'mammon: This Aramaic term means wealth or property, but in this context the word features property gained for the wrong reasons.30'
  - where: 'note 16:9 “The mammon of unrighteousness”'
    claim: 'The admonition is to use mammon in good works while it lasts, for it will fail and only its results endure; how much more may the devoted hope to be received into God’s mansions'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'Our Lord’s admonition was to utilize “mammon” in good works, while it lasted, for some day it shall fail, and only the results achieved through its use shall endure.'
  - where: 'note 16:9 “The mammon of unrighteousness”'
    claim: 'Earlier manuscripts read “when it fails,” meaning when mammon fails: at the end of life, or wealth’s inability to sustain righteous purposes'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'The reading from earlier manuscripts is “when it fails,” meaning “when the world of mammon fails,”31 pointing either to the end of a person’s life when property no longer matters or to wealth’s inability to sustain righteous purposes by itself.'
  - where: 'note 16:9 “The mammon of unrighteousness”'
    claim: 'The SBL edition reads ἐκλίπῃ (“it fails”); the Byzantine text reads ἐκλίπητε (“ye fail”)'
    key: greek-nt
    url: 'https://biblehub.com/texts/luke/16-9.htm'
    quote: 'καὶ ἐγὼ ὑμῖν λέγω, ἑαυτοῖς ποιήσατε φίλους ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας, ἵνα ὅταν ἐκλίπῃ δέξωνται ὑμᾶς εἰς τὰς αἰωνίους σκηνάς.'
  - where: 'note 16:9 “The mammon of unrighteousness”'
    claim: 'D&C 82:22 repeats the counsel as “make unto yourselves friends with the mammon of unrighteousness, and they will not destroy you” (the footnote at 16:9)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/82?lang=eng'
    quote: 'And now, verily I say unto you, and this is wisdom, make unto yourselves friends with the mammon of unrighteousness, and they will not destroy you.'
  - where: 'note 16:9 “The mammon of unrighteousness”'
    claim: 'D&C 82:22 reads “with” and “they will not destroy you,” stressing the proper use of the world’s goods and mammon as a protection of sorts'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'In an interesting twist, modern scripture substitutes the expression “they will not destroy you,” signaling that mammon can act as a protection of sorts (D&C 82:22).'
  - where: 'note 16:11 “The true riches”'
    claim: 'Worldly wealth does not belong to us but comes as a trust, testing how we value and use it'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'Jesus underscores the principle that worldly wealth does not belong to us but rather comes to us as a trust, in effect testing us in how we value and use it.35'
  - where: 'note 16:11 “The true riches”'
    claim: 'Eternal wealth belongs to God and is His to give, hinted by “who”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'Genuine, eternal wealth belongs to God and is his to give, as hinted by the Greek interrogative pronoun tis (“who”)'
  - where: 'note 16:11 “The true riches”'
    claim: 'Heavenly possessions depend on faithful management of what belongs to God, our own resources and those of others'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'our eventual acquisition of heavenly property or possessions depends at least in part on our management of what belongs to God, whether our own material resources, which really belong to him, or those of others that are donated for sacred purposes.'
  - where: 'note 16:11 “The true riches”'
    claim: 'If you cannot be trusted with mammon or another’s wealth, how with enduring riches; keep wealth a servant, not a master'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'If you have not learned wisdom and prudence in the use of “unrighteous mammon,” how can you be trusted with the more enduring riches? … Moreover, let not wealth become your master; keep it to its place as a servant'
  - where: 'note 16:14 “Who were covetous”'
    claim: '“Covetous” is philargyros, literally “fond of silver”; only here does the New Testament portray Pharisees so; it ties them to the steward'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'Although this adjective means “avaricious” or “fond of money,” literally “fond of silver” (Greek philargyros) … In the New Testament, only this passage portrays Pharisees in this manner … The term plainly ties these Pharisees to the unjust steward of the parable.'
  - where: 'note 16:14 “Who were covetous”'
    claim: '“Derided” means to turn up the nose; the verb returns at the crucifixion (23:35)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'Only Luke repeats this verb (Greek ekmyktērizō), with the meaning “to turn up the nose,” which underlines the Pharisees’ attitude. The verb also appears in the scene of Jesus’ crucifixion: “the rulers . . . derided him” (23:35).'
  - where: 'note 16:14 “Who were covetous”'
    claim: 'The Pharisees scoffed: what did this Galilean who owned nothing know about money; they justified themselves before men as outwardly honest'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'What did this Galilean, who owned nothing but the clothes He wore, know about money or the best way of administering wealth? … and yet so successfully could they justify themselves before men as to be outwardly honest and straightforward'
  - where: 'note 16:14 “Who were covetous”'
    claim: 'What is “highly esteemed” usually comes as possessions or power, linking verse 15 to covetousness'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'That “which is highly esteemed among men,” as Jesus declares, holds within it a link to a person’s “covetous” attitude (16:14). That is, what is “highly esteemed” usually comes in the form of possessions or power.'
  - where: 'note 16:16 “The law and the prophets were until John”'
    claim: 'JST 16:16–18: the Pharisees answer “We have the law, and the prophets” and refuse Jesus as ruler; He answers that the law and prophets testify of Him; “every man who seeketh truth presseth into it”'
    key: jst-luke-16
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/16?lang=eng'
    quote: 'And they said unto him, We have the law, and the prophets; but as for this man we will not receive him to be our ruler; for he maketh himself to be a judge over us.'
  - where: 'note 16:16 “The law and the prophets were until John”'
    claim: 'JST 16:17: Jesus answers that the law and the prophets testify of Him'
    key: jst-luke-16
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/16?lang=eng'
    quote: 'Then said Jesus unto them, The law and the prophets testify of me; yea, and all the prophets who have written, even until John, have foretold of these days.'
  - where: 'note 16:16 “The law and the prophets were until John”'
    claim: 'The JST adds “who seeketh truth” to “every man presseth into it”'
    key: jst-luke-16
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/16?lang=eng'
    quote: 'Since that time, the kingdom of God is preached, and every man who seeketh truth presseth into it.'
  - where: 'note 16:16 “The law and the prophets were until John”'
    claim: 'At “the law and the prophets” the JST begins a major overhaul of this verse and the next three; the Pharisees understand Jesus’ claims and reject Him'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'at this point in Luke’s record the Joseph Smith Translation begins a major overhaul of this verse and the next three. … Plainly, the Pharisees understand the force of Jesus’ prior teachings about himself but choose to reject him.'
  - where: 'note 16:16 “The law and the prophets were until John”'
    claim: '“Until John: since that time” divides time into two epochs, before and after Jesus and John'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'Indeed, time seems to be divided into two epochs, that before the arrival of Jesus and John the Baptist and that afterward, though discussion continues whether the Baptist belongs to the old era or the new.52'
  - where: 'note 16:16 “The law and the prophets were until John”'
    claim: '“Presseth into it” may mean entering with vigor or being forced; the JST inclines toward the vigor sense by adding three words'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'One sense is that all who choose to enter the kingdom must do so with vigor and firm intent; we cannot be casual. … The Joseph Smith Translation inclines toward the former interpretation by adding three words to Jesus’ saying'
  - where: 'note 16:17 “One tittle of the law”'
    claim: 'The tittle (keraia) is the small horn or hook that distinguishes one Hebrew letter from another'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'The reference features the parts of Hebrew letters that distinguish one letter from others of similar shape. The Greek term keraia points to a small horn or hook created as a copyist begins or finalizes the shape of a letter'
  - where: 'note 16:17 “One tittle of the law”'
    claim: 'JST 16:20: “why teach ye the law, and deny that which is written; and condemn him whom the Father hath sent to fulfill the law”'
    key: jst-luke-16
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/16?lang=eng'
    quote: 'And why teach ye the law, and deny that which is written; and condemn him whom the Father hath sent to fulfill the law, that ye might all be redeemed?'
  - where: 'note 16:17 “One tittle of the law”'
    claim: 'At the summit of the JST additions is Jesus’ affirmation that He fulfills the law; the Pharisees lack faith in the scriptures they teach and persecute His followers'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'At the pinnacle of Jesus’ sayings rises his affirmation of who he is—the one who fulfills the law so “that ye might all be redeemed” (JST 16:20). Besides rejecting him, according to the added words, these Pharisees lack faith in the scriptures that they teach'
  - where: 'note 16:17 “One tittle of the law”'
    claim: 'The Pharisees and scribes had tried to nullify the law by their additions and interpretations, as in divorce'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'yet those Pharisees and scribes had tried to nullify the law. In the matter of divorce, for example, they, by their unlawful additions and false interpretations, had condoned even the sin of adultery.'
  - where: 'note 16:17 “One tittle of the law”'
    claim: 'JST 16:21: they pervert the right way, persecute the meek, seek to destroy the kingdom by violence, and are adulterers'
    key: jst-luke-16
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/16?lang=eng'
    quote: 'And you pervert the right way; and the kingdom of heaven suffereth violence of you; and you persecute the meek; and in your violence you seek to destroy the kingdom; and ye take the children of the kingdom by force. Woe unto you, ye adulterers!'
  - where: 'note 16:17 “One tittle of the law”'
    claim: 'The JST’s characterization of these Pharisees is one of the most sweeping in scripture, equaled perhaps only in Mark 7:6–13'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'This surprising, condemnatory characterization of these Pharisees, from their disbelief in God to their early persecution of Jesus’ followers to their immoral behavior, is one of the most sweeping in scripture, perhaps equaled only in Mark 7:6–13.'
  - where: 'note 16:18 “Whosoever putteth away his wife”'
    claim: 'JST 16:21–23: Jesus calls them adulterers, they revile Him, and He continues with the divorce saying'
    key: jst-luke-16
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/16?lang=eng'
    quote: 'Woe unto you, ye adulterers! And they reviled him again, being angry for the saying, that they were adulterers. But he continued, saying, Whosoever putteth away his wife, and marrieth another, committeth adultery'
  - where: 'note 16:18 “Whosoever putteth away his wife”'
    claim: 'The saying aims at men who divorce their wives to take another, and protects women; Deut. 24:1–4 required a certificate; some teachers allowed divorce for any displeasure'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'Hence, Jesus’ judging words aim at men who divorce their wives with the intent to take another bride. One effect of Jesus’ words is to re-level the legal landscape for women by removing a man’s whim or wandering eye as a justifiable reason for divorce.'
  - where: 'note 16:18 “Whosoever putteth away his wife”'
    claim: 'The certificate of Deut. 24:1–4 protected a divorced woman from being accused of adultery in a second marriage'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'Early on, protections are set in place for women caught in a divorce, requiring the husband to give her a certificate so that she cannot be accused of adultery in a second marriage'
  - where: 'note 16:18 “Whosoever putteth away his wife”'
    claim: 'By Jesus’ day some teachers held a man could divorce his wife for any act that displeased him, even spoiling a dish'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'In his world, certain prominent Jewish teachers declare that a man can divorce his wife for almost any cause, including a mistake in cooking: “if she spoiled a dish for him.”'
  - where: 'note 16:18 “Whosoever putteth away his wife”'
    claim: 'Elder Oaks: the marriage required for exaltation does not contemplate divorce, but the Lord does not currently enforce the celestial standard'
    key: oaks-divorce
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2007/04/divorce?lang=eng'
    quote: 'The kind of marriage required for exaltation—eternal in duration and godlike in quality—does not contemplate divorce. … the Lord does not currently enforce the consequences of the celestial standard. He permits divorced persons to marry again without the stain of immorality specified in the higher law.'
  - where: 'note 16:19 “Clothed in purple and fine linen”'
    claim: 'Purple was costly, usually owned by royalty and aristocracy, from murex dye; fine linen (byssos) also points to wealth'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'Purple is a fabric color that few can afford, and is usually therefore in the possession of royalty and aristocracy because of the high cost of extracting the dye from murex snails that live in salt water.'
  - where: 'note 16:19 “Clothed in purple and fine linen”'
    claim: 'D&C 104:18 draws on this story: one who does not impart to the poor shall “lift up his eyes in hell, being in torment”'
    key: harper-rich-man-lazarus
    url: 'https://byustudies.byu.edu/article/the-rich-man-lazarus-and-doctrine-covenants-104-18'
    quote: 'This potent passage in Doctrine and Covenants 104 obviously draws on the New Testament story of Lazarus and the rich man in Luke 16:19–31, especially verse 23.'
  - where: 'note 16:19 “Clothed in purple and fine linen”'
    claim: 'The earliest manuscripts of D&C 104 read “with Dives”; the 1835 printing replaced it with “the wicked,” clarifying that wickedness, not riches per se, keeps them out'
    key: harper-rich-man-lazarus
    url: 'https://byustudies.byu.edu/article/the-rich-man-lazarus-and-doctrine-covenants-104-18'
    quote: 'When the Church first published this revelation as section 98 in the 1835 Doctrine and Covenants, the name “Dives” in the manuscript was replaced with the phrase “the wicked” in the printed version. This editorial change … clarified that although it may indeed be difficult for the rich to enter heaven (see Matthew 19:24), it is wickedness and not riches per se that will keep them out.'
  - where: 'note 16:19 “Clothed in purple and fine linen”'
    claim: 'Dives is Latin for “rich”; it became the rich man’s name in the Middle Ages'
    key: harper-rich-man-lazarus
    url: 'https://byustudies.byu.edu/article/the-rich-man-lazarus-and-doctrine-covenants-104-18'
    quote: 'Dives is the Latin word for rich, opulent, wealthy.3'
  - where: 'note 16:19 “Clothed in purple and fine linen”'
    claim: 'The rich man’s choice was to clothe and feed himself and avoid simple charity, choosing mammon over God'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'the rich man’s choices—to clothe and feed himself, and to avoid simple acts of charity that acknowledge God as the true owner of his abundant goods, thus choosing mammon over God (see 16:19–21).'
  - where: 'note 16:20 “A certain beggar named Lazarus”'
    claim: 'This is the only time Jesus names a person in a parable; Lazarus comes from Eleazar, “God has helped”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'Although this is the only instance of Jesus naming a person in one of his parables, irony may lie in naming the poor man and not naming the rich (see 16:19). The word derives from the common Hebrew name Eleazar which means “God has helped,”'
  - where: 'note 16:20 “A certain beggar named Lazarus”'
    claim: '“Was laid” implies he had to be carried, an invalid; the gate separates the two men as the gulf will later'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'The passive of the verb implies that the poor man needed assistance to move and was therefore an invalid. The gate … separates the two men of the story, just as the terms “afar off” and “great gulf” disclose an unbridgeable distance between them later on'
  - where: 'note 16:20 “A certain beggar named Lazarus”'
    claim: 'The scavenging dogs attend to his sores while the rich man does nothing'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'The man’s misery becomes all the more vivid when Jesus adds the detail that the local, scavenging dogs, likely full of ticks and sores themselves, pay attention to the beggar’s sores whereas the rich man does nothing to alleviate the man’s condition.'
  - where: 'note 16:20 “A certain beggar named Lazarus”'
    claim: 'The beggar had no companions but the dogs, which waited like him for the refuse from the table'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'the poor beggar at his gates had neither companions nor attendants except the dogs, which like himself waited for the refuse from the rich man’s table.'
  - where: 'note 16:22 “Abraham’s bosom”'
    claim: 'Angels bore Lazarus into Paradise, known in rabbinic figurative lore as Abraham’s bosom; no angelic escort is mentioned for the rich man'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'but angels bore his immortal spirit into Paradise, the resting place of the blessed and commonly known in the figurative lore of the rabbis as Abraham’s bosom. The rich man also died; his burial was doubtless an elaborate affair, but we read not of any angelic escort receiving his spirit.'
  - where: 'note 16:22 “Abraham’s bosom”'
    claim: 'Paradise is not the place of final glory, nor the rich man’s hell the final habitation'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'Paradise, or as the Jews like to designate that blessed abode, “Abraham’s bosom,” is not the place of final glory, any more than the hell to which the rich man’s spirit was consigned is the final habitation of the condemned.'
  - where: 'note 16:22 “Abraham’s bosom”'
    claim: 'The beggar is with Abraham himself, perhaps enfolded in his arms; “bosom” is also used of God and of heaven (Moses 7:30, 24)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'Clearly, the beggar is with Abraham himself, perhaps enfolded within his arms (see D&C 132:49). In this connection, “bosom” can point to both the physical and spiritual dimensions of God’s existence or character'
  - where: 'note 16:22 “Abraham’s bosom”'
    claim: 'Alma 40:12: the righteous are received into paradise, a state of rest and peace (the footnote at 16:22 gives Alma 40:11)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/40?lang=eng'
    quote: 'the spirits of those who are righteous are received into a state of happiness, which is called paradise, a state of rest, a state of peace, where they shall rest from all their troubles and from all care, and sorrow.'
  - where: 'note 16:23 “In hell he lift up his eyes”'
    claim: 'Hades and Abraham’s bosom are different places'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'Clearly, they are different places.'
  - where: 'note 16:23 “In hell he lift up his eyes”'
    claim: '“In hell” is “in Hades,” in the New Testament a place where disembodied spirits temporarily await resurrection and judgment; Alma 40:11–14 makes the same correction'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'In the New Testament era, this view is corrected to Hades as a place where the disembodied spirits temporarily await the resurrection and judgment … A similar correction appears in the Book of Mormon (see Alma 40:11–14).'
  - where: 'note 16:23 “In hell he lift up his eyes”'
    claim: 'Joseph Smith (Wilford Woodruff’s report): hell is a modern term from Hades and Sheol, whose true signification is a world of spirits'
    key: ehat-cook-words-1843-06-11
    url: 'https://rsc.byu.edu/words-joseph-smith/11-june-1843-sunday-morning-temple-stand'
    quote: 'what is hell, it is annother modern term it is taken from hades the greek, or shaole, the (hebrew) & the true signification is a world of spirits.'
  - where: 'note 16:23 “In hell he lift up his eyes”'
