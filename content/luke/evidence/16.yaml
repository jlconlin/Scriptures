    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'The gulf that exists in the next world is such that no one is able to cross it, including the gap between the righteous and wicked in the world of departed spirits before the resurrection.79 … (see D&C 29:29; 76:112; compare D&C 138:20–22, 29–32, 37).'
  - where: 'note 16:26 “A great gulf fixed”'
    claim: 'D&C 138 is Joseph F. Smith’s vision of October 1918; the Lord organized messengers from among the righteous to carry the gospel to the spirits in darkness'
