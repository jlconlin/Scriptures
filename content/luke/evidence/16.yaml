  - where: 'note 16:26 “A great gulf fixed”'
    claim: 'Spirits in prison who accept the gospel and the ordinances performed for them may leave prison and dwell in paradise'
    key: topics-spirit-world
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/spirit-world?lang=eng'
