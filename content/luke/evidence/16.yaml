  - where: 'note 16:31 “Though one rose from the dead”'
    claim: 'In the long view the words allude to Jesus’ resurrection'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'one rose from the dead: In the long view, the obvious allusion aims at Jesus’ resurrection (see the Note on 22:67). But the words also refer more closely to Lazarus’ own resurrection.'
  - where: 'note 16:31 “Though one rose from the dead”'
    claim: 'A change of heart comes from within, not from an external spectacle'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
