    key: ehat-cook-words-1843-06-11
    url: 'https://rsc.byu.edu/words-joseph-smith/11-june-1843-sunday-morning-temple-stand'
    quote: 'Hades shaole paradise, spirits in prision is all one it is a world of spirits, the righteous & the wicked all go to the same world of spirits'
  - where: 'note 16:23 “In hell he lift up his eyes”'
    claim: 'The report printed after Woodruff’s is in Wilford Woodruff’s diary'
    key: ehat-cook-words-1843-06-11
    url: 'https://rsc.byu.edu/words-joseph-smith/11-june-1843-sunday-morning-temple-stand'
    quote: 'Wilford Woodruff Diary'
  - where: 'note 16:23 “In hell he lift up his eyes”'
    claim: 'The discourse was given on 11 June 1843'
    key: ehat-cook-words-1843-06-11
    url: 'https://rsc.byu.edu/words-joseph-smith/11-june-1843-sunday-morning-temple-stand'
    quote: '11 June 1843 (Sunday Morning). Temple Stand'
  - where: 'note 16:23 “In hell he lift up his eyes”'
    claim: 'The parable is largely figurative, but Christ would not teach falsely even in parable; righteous and unrighteous dwell apart between death and resurrection'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'While as a practice it would be critically unfair to deduce doctrinal principles from parabolic incidents, we cannot admit that Christ would teach falsely even in parable; and therefore we accept as true the portrayal of conditions in the world of the disembodied.'
  - where: 'note 16:23 “In hell he lift up his eyes”'
    claim: 'The scene shows that the dead are conscious of themselves and exist as individuals'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'The scene clearly underscores the view that persons who die are both conscious of themselves and exist as individuals in the next life.'
  - where: 'note 16:23 “In hell he lift up his eyes”'
    claim: 'Nothing indicates the flame torments forever (D&C 19:10–12)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'I am tormented in this flame: Nothing indicates that the flame will continue tormenting forever (see D&C 19:10–12).'
  - where: 'note 16:23 “In hell he lift up his eyes”'
    claim: 'The rich man still thinks of Lazarus as somehow subservient'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'It seems plain that the rich man still thinks of Lazarus as somehow subservient.'
  - where: 'note 16:23 “In hell he lift up his eyes”'
    claim: 'The rich man’s character, used to taking charge, continues into the next life (Alma 41)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-16-104'
    quote: 'Plainly, the personal characteristics that he has cultivated in his mortal life accompany him into the hereafter, a teaching underscored elsewhere (see Alma 41:2–8, 11–15; 42:27–28).'
  - where: 'note 16:26 “A great gulf fixed”'
    claim: 'Between the abode of the righteous and that of the wicked a great gulf is fixed and passage is interdicted'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'for between the abode of the righteous where Lazarus rested and that of the wicked where he suffered “there is a great gulf fixed,” and passage between the two is interdicted.'
  - where: 'note 16:26 “A great gulf fixed”'
    claim: 'No one can cross the gulf, including the gap between righteous and wicked before the resurrection; compare D&C 138:20–22, 29–32, 37'
