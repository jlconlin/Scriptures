chapter: 8
claims:
  # ---- setting, thread
  - where: setting
    claim: 'Chapter 8 has no stories of conflict'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'Remarkably, no stories of conflict appear in chapter 8. Such accounts recede until “a certain lawyer” challenges Jesus about the meaning of one’s neighbor (see 10:25–37).'
  - where: setting
    claim: 'Matthew and Mark mention the Galilean women only at the end of their Gospels; Luke introduces them early'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'Matthew and Mark tell us of these women from Galilee, but not until the ends of their Gospels and without the detail of Jesus’ liberating acts, except the deliverance of Mary Magdalene'
  - where: setting
    claim: 'Around the notice of the women, Luke 7–8 tells stories of particular women changed by meeting the Savior'
    key: olson-ministered
    url: 'https://rsc.byu.edu/learn-me/they-ministered-unto-him-their-substance'
    quote: 'In Luke 7–8, in verses surrounding Luke’s brief description of these generous women from Galilee, he recounts the stories of specific women whose lives were forever changed through encounters with the Savior.'
  - where: setting
    claim: 'The crossing takes Jesus into Gentile territory'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'Further, Jesus steps onto gentile territory and, with no dimming of power, brings needed help to a man tormented by a legion of demons.'
  - where: thread
    claim: 'The sower introduces the chapter’s central teaching about hearing and obeying, carried through the family, the elements and illnesses'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'through the parable of the sower (see 8:4–15), introduces his central teaching about hearing and obeying, emphasizing this point when turning attention to his family (see 8:19–21), as well as to the elements and to illnesses that hear and obey him.'
  - where: thread
    claim: 'In the boat the wind hears and obeys'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'Now, in the boat, Jesus “rebuked the wind.” The wind hears. The wind obeys.'
  - where: thread
    claim: 'Fear underlies the storm and the demoniac; faith is its antidote'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'In the stories of the stilling of the storm and the healing of the demoniac, fear is the common undergirding element (see 8:25, 37). The antidote to this fear is faith'
  - where: thread
    claim: 'The chapter, opening and closing with women, affirms the Savior of all, men and women, Jews and Gentiles'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'Herein one of Luke’s purposes becomes clear: to affirm that the Savior is the Savior of all, whether men or women, whether Jews or Gentiles.'

  - where: setting
    claim: 'The chapter gives samples of Jesus’s most potent miracles'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'Instead, Luke offers to readers samples of Jesus’ most potent miracles and some of the best of his teaching, beginning with his watershed parable of the sower.'

  # ---- 8:1
  - where: 'note 8:1 “The Twelve beside Him”'
    claim: 'The Twelve are mentioned for the first time since 6:17'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'We hear of the Twelve for the first time since 6:17, but they are companions and witnesses of all that occurs in the meantime.'
  - where: 'note 8:1 “The Twelve beside Him”'
    claim: 'JST 8:1 adds that the Twelve were ordained of him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/8?lang=eng'
    quote: 'JST Luke 8:1 … and the twelve who were ordained of him, were with him,'
  - where: 'note 8:1 “The Twelve beside Him”'
    claim: 'The JST stresses that the Twelve had by now received ordination from Jesus Himself'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'concerning the Twelve the Joseph Smith Translation adds “who were ordained of him,” stressing that by this time they receive their ordination from Jesus himself (JST 8:1), perhaps along with others since the language is not limiting.'
  - where: 'note 8:1 “The Twelve beside Him”'
    claim: 'The Twelve and the women will be the chief witnesses of the Resurrection; Luke sets them in Galilee from the start'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'The Twelve, of course, along with the women mentioned in 8:2, will become the chief witnesses of Jesus’ Resurrection.'
  - where: 'note 8:1 “The Twelve beside Him”'
    claim: 'Luke affirms the Twelve are at Jesus’s side witnessing all the chapter’s acts'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'Amidst all these activities, Luke pointedly affirms that the Twelve are at Jesus’ side, witnessing all (see 8:1).'

  # ---- 8:2
  - where: 'note 8:2 “Mary Magdalene and the seven devils”'
    claim: 'Mary Magdalene is the only woman named in all four Gospels'
    key: olson-ministered
    url: 'https://rsc.byu.edu/learn-me/they-ministered-unto-him-their-substance'
    quote: 'Mary Magdalene, the only woman named in all four Gospels'
  - where: 'note 8:2 “Mary Magdalene and the seven devils”'
    claim: 'She is named alone or first in lists of women, suggesting she was a leader'
    key: olson-ministered
    url: 'https://rsc.byu.edu/learn-me/they-ministered-unto-him-their-substance'
    quote: 'The primacy of her name in these lists and the frequency of her mention suggest that Mary Magdalene was a leader among the women and the Christian movement.'
  - where: 'note 8:2 “Mary Magdalene and the seven devils”'
    claim: 'Seven connotes completeness; Luke may be saying she was completely healed'
    key: olson-ministered
    url: 'https://rsc.byu.edu/learn-me/they-ministered-unto-him-their-substance'
    quote: 'The number seven in scripture often connotes completeness and wholeness. In announcing Mary’s cure, Luke may simply be confirming that through the power of Christ, Mary was completely healed'
  - where: 'note 8:2 “Mary Magdalene and the seven devils”'
    claim: 'Tying her to the sinful woman of Luke 7 fails: freedom from demons is not freedom from sin'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'Attempts to tie her to the “sinner” woman of 7:37–50 fail because being freed from demons differs markedly from being freed from sin.'

  # ---- 8:3
  - where: 'note 8:3 “Of their substance”'
    claim: 'The company depended on others for food and lodging; the women supported Jesus from their own resources'
    key: olson-ministered
    url: 'https://rsc.byu.edu/learn-me/they-ministered-unto-him-their-substance'
    quote: 'Jesus and his itinerant company depended on the goodness of others to provide daily nourishment and a place to sleep. … “ministered unto him of their substance” (verse 3), meaning they supported him from their own resources.'
  - where: 'note 8:3 “Of their substance”'
    claim: '“Others” is feminine plural: all who ministered were women'
    key: olson-ministered
    url: 'https://rsc.byu.edu/learn-me/they-ministered-unto-him-their-substance'
    quote: 'In Greek, “others” in Luke 8:3 is a feminine plural, clarifying that all those who ministered unto Jesus of their substance were women.'
  - where: 'note 8:3 “Of their substance”'
    claim: 'Their commitment continued to the cross, the burial and the Resurrection'
    key: olson-ministered
    url: 'https://rsc.byu.edu/learn-me/they-ministered-unto-him-their-substance'
    quote: 'their commitment to the Savior was not episodic; these women continued to follow him to Jerusalem—to his crucifixion, his burial, and his resurrection.'
  - where: 'note 8:3 “Of their substance”'
    claim: 'Herod is Antipas; epitropos means manager; Chuza and Joanna a likely channel of news to Herod'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'the passage evidently points to Herod Antipas. The term translated “steward” (Greek epitropos) generally means manager.'
  - where: 'note 8:3 “Of their substance”'
    claim: 'Chuza and his wife likely the channel by which Herod learns of Jesus'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'But Chuza and his wife are presumably people of means and are therefore the channel through which Herod and his courtiers learn about Jesus (see 9:7–9).'
  - where: 'note 8:3 “Of their substance”'
    claim: 'Many early manuscripts read “unto them”; diakoneō means serving at table; the imperfect shows ongoing service'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'many early manuscripts feature the plural pronoun “unto them,” likely the original reading'
  - where: 'note 8:3 “Of their substance”'
    claim: 'diakoneō points to serving at table; the imperfect marks repeated, ongoing service'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'The verb translated “ministered” (Greek diakoneō) points to serving at table, but also taking charge of meals as women customarily do'
  - where: 'note 8:3 “Of their substance”'
    claim: 'Women traveling with Jesus and male disciples was highly unusual'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'The fact that these women associate with Jesus and his group of male disciples is highly unusual in their society and probably draws unwanted criticism, though unrecorded.'

  # ---- 8:6
  - where: 'note 8:6 “The soils in Luke’s telling”'
    claim: 'The seed was the same; the parable turns on the soil; paths hard-trodden through the fields'
    key: talmage-jesus-christ-19
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-19?lang=eng'
    quote: 'Observe that the prominent feature of the story is that of the prepared or unprepared condition of the soil. The seed was the same, whether it fell on good ground or bad'
  - where: 'note 8:6 “The soils in Luke’s telling”'
    claim: 'Pathways hard trodden ran through Galilean fields; seed there was crushed and trodden down'
    key: talmage-jesus-christ-19
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-19?lang=eng'
    quote: 'Running through the Galilean fields were pathways, hard trodden by feet of men and beasts. Though seed should fall on such tracts, it could not grow'
  - where: 'note 8:6 “The soils in Luke’s telling”'
    claim: 'Luke gives the cause of withering as lack of moisture: rain runs off the rock'
    key: halverson-soils-souls
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/soils-souls-parable-sower'
    quote: 'The lack of moisture results when such rain is wasted as runoff, unable to penetrate the rock beneath the scant layer of soil.'
  - where: 'note 8:6 “The soils in Luke’s telling”'
    claim: 'In Luke the thorns spring up with the seed: they were not there before'
    key: halverson-soils-souls
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/soils-souls-parable-sower'
    quote: 'According to Luke, the thorns spring up with the sprouting seed (see Luke 8:7). Apparently the thorns were not there previously; the seed and the thorns grow together in ground that was ready for planting.'
  - where: 'note 8:6 “The soils in Luke’s telling”'
    claim: 'Luke’s good ground bears an hundredfold, a miraculous harvest'
    key: halverson-soils-souls
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/soils-souls-parable-sower'
    quote: 'In fact, in some cases the harvest is miraculous: the seed in Luke’s version “bare fruit an hundredfold” (Luke 8:8).'

  # ---- 8:10
  - where: 'note 8:10 “That seeing they might not see”'
    claim: 'The words recall Isaiah’s call (Isa. 6:9–10)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'Jesus’ words recall directly God’s words to his people through the youthful Isaiah at the time of his call'
  - where: 'note 8:10 “That seeing they might not see”'
    claim: 'Parables are for those who choose not to respond'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'for those who choose not to respond to his teachings, he speaks in parables so “that seeing they might not see, and hearing they might not understand” (8:10)'
  - where: 'note 8:10 “That seeing they might not see”'
    claim: 'Joseph Smith: the multitude was condemned because unwilling, not unable, to see and hear'
    key: jsp-letter-elders-1835-12
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-elders-of-the-church-30-november-1-december-1835/1'
    quote: 'the condemnation which rested upon the multitude, which received not his saying, was because they were not willing to see with their eyes and hear with their ears; not because they could not and were not privileged to see, and hear'
  - where: 'note 8:10 “That seeing they might not see”'
    claim: 'The letter is commenting on the same discourse in Matthew 13: it quotes Matt. 13:16–17 just before'
    key: jsp-letter-elders-1835-12
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-elders-of-the-church-30-november-1-december-1835/1'
    quote: 'But what saith he to his disciples: Blessed are your eyes, for they see, and your ears, for they hear; for verily I say unto you, that many prophets and righteous men have desired to see those things which ye see'
  - where: 'note 8:10 “That seeing they might not see”'
    claim: 'Talmage: mercy in parables; rejecting truth with full understanding would bring condemnation'
    key: talmage-jesus-christ-19
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-19?lang=eng'
    quote: 'There is plainly shown an element of mercy in the parabolic mode of instruction … while had they rejected the truth with full understanding, stern Justice would surely demand their condemnation.'

  # ---- 8:13
  - where: 'note 8:13 “The wayside and the rock”'
    claim: 'The three accounts together outline hear, understand, believe, be saved; Satan interrupts as early as he can'
    key: halverson-soils-souls
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/soils-souls-parable-sower'
    quote: 'The combined details provided by the three synoptists outline the process of spiritual growth the word is meant to accomplish: hear, understand, believe, and be saved. With reason, therefore, the adversary seeks to disrupt this process, and the earlier the better.'
  - where: 'note 8:13 “The wayside and the rock”'
    claim: 'The rocky-ground hearers believe, but only for a while'
    key: halverson-soils-souls
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/soils-souls-parable-sower'
    quote: 'Unlike those by the wayside who refuse to hear, understand, and believe, those with stony ground “heareth the word” (Matthew 13:20), “receive it with gladness” (Mark 4:16), and “believe” (Luke 8:13).'
  - where: 'note 8:13 “The wayside and the rock”'
    claim: 'Luke alone names temptation as the heat that withers; the other accounts name tribulation, affliction and persecution'
    key: halverson-soils-souls
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/soils-souls-parable-sower'
    quote: 'The reasons that they wither are fourfold: “tribulation” (Matthew 13:21), “affliction” (Mark 4:17), “persecution” (Matthew 13:21; Mark 4:17), and “temptation” (Luke 8:13), each represented by the scorching heat of the sun.'
  - where: 'note 8:13 “The wayside and the rock”'
    claim: 'The rocky-ground group corresponds to those in Lehi’s dream who began on the path and were lost in the mist of darkness'
    key: sc-knowhy-663
    url: 'https://scripturecentral.org/knowhy/how-does-the-parable-of-the-sower-help-us-understand-lehis-vision-of-the-tree-of-life'
    quote: 'Lehi saw a group of people who initially accepted and began to follow the gospel path to eternal life but ultimately were blinded by the mist of darkness so that they “wandered off and were lost” (1 Nephi 8:23).'

  # ---- 8:14
  - where: 'note 8:14 “Cares and riches and pleasures”'
    claim: 'Elder Oaks: the most subtle thorns are the cares, riches and pleasures of this life'
    key: oaks-parable-sower
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2015/04/the-parable-of-the-sower?lang=eng'
    quote: 'The most subtle thorns to choke out the effect of the gospel word in our lives are the worldly forces that Jesus called the “cares and riches and pleasures of this life” (Luke 8:14).'
  - where: 'note 8:14 “Cares and riches and pleasures”'
    claim: 'Elder Oaks names three ways of surrendering to the pleasures of this life'
    key: oaks-parable-sower
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2015/04/the-parable-of-the-sower?lang=eng'
    quote: 'We surrender to the “pleasures of this life” (1) when we are addicted, which impairs God’s precious gift of agency; (2) when we are beguiled by trivial distractions, which draw us away from things of eternal importance; and (3) when we have an entitlement mentality'
  - where: 'note 8:14 “Cares and riches and pleasures”'
    claim: 'Luke’s plant brings no fruit to perfection; it stays alive but cumbers the ground'
    key: halverson-soils-souls
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/soils-souls-parable-sower'
    quote: 'Luke does mention fruit, but the plant he describes, in its depleted condition, could “bring no fruit to perfection” (Luke 8:14).'
  - where: 'note 8:14 “Cares and riches and pleasures”'
    claim: 'The choked plant remains alive but only cumbers the ground'
    key: halverson-soils-souls
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/soils-souls-parable-sower'
    quote: 'In either instance, the plant remains alive, but, as the Lord lamented in a later parable, only to cumber the ground (see Luke 13:7).'

  # ---- 8:15
  - where: 'note 8:15 “Fruit with patience”'
    claim: 'hypomonē: steadfastness, endurance, unswerved from purpose by trials (Luke 8:15)'
    key: thayer
    url: 'https://biblehub.com/greek/5281.htm'
    quote: 'steadfastness, constancy, endurance … in the N. T. the characteristic of a man who is unswerved from his deliberate purpose and his loyalty to faith and piety by even the greatest trials and sufferings: Luke 8:15'
  - where: 'note 8:15 “Fruit with patience”'
    claim: 'The plant springs up quickly but the hundredfold comes only with patience; good ground keeps the word'
    key: halverson-soils-souls
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/soils-souls-parable-sower'
    quote: 'whereas the plant “sprang up” (Luke 8:8) quickly, achieving the hundredfold harvest only comes “with patience” (Luke 8:15; see also James 5:7).'
  - where: 'note 8:15 “Fruit with patience”'
    claim: 'The soils are not a single permanent placement but an ongoing process'
    key: halverson-soils-souls
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/soils-souls-parable-sower'
    quote: 'This is not a single decision, resulting in our permanent placement amid the soils. Rather, it is an ongoing process'
  - where: 'note 8:15 “Fruit with patience”'
    claim: 'The good ground “keep” the word, that is, hold it tight, matching the rod of iron in Lehi’s dream'
    key: sc-knowhy-663
    url: 'https://scripturecentral.org/knowhy/how-does-the-parable-of-the-sower-help-us-understand-lehis-vision-of-the-tree-of-life'
    quote: 'this group is described as those who “keep” the word or “hold it tight.” This again corresponds to Lehi’s dream, in which some people “did press their way forward, continually holding fast to the rod of iron'

  # ---- 8:18
  - where: 'note 8:18 “Take heed how ye hear”'
    claim: 'The candle is a clay oil lamp'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'The term (Greek lychnos) means lamp, not candle'
  - where: 'note 8:18 “Take heed how ye hear”'
    claim: 'What is now hidden will become public knowledge'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'These words allude back to “the mysteries” which are kept secret (8:10) and are disclosed only to initiates. Here, the meaning seems to be that what is now secret and hidden from view will become public knowledge'
  - where: 'note 8:18 “Take heed how ye hear”'
    claim: '“Take heed” is blepō, the verb of seeing in 8:10 and 8:16, here of paying attention'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'The verb (Greek blepō) is the same as that translated “see” in 8:10 and 8:16, and has to do fundamentally with sight, though here it concerns the mental function of paying attention'
  - where: 'note 8:18 “Take heed how ye hear”'
    claim: 'The JST reads “receiveth”: what matters is what one is willing to receive'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'The Joseph Smith Translation underscores this observation: “whosoever receiveth . . . and whosoever receiveth not.” Thus, it is not a matter of what a person possesses after hearing Jesus’ words but what one is willing to receive from them'
  - where: 'note 8:18 “Take heed how ye hear”'
    claim: '“Seemeth” (dokeō) means think: self-deception'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'The verb rendered “to seem” (Greek dokeō) should be translated “to think.” The issue here is one of self-deception'

  # ---- 8:21
  - where: 'note 8:21 “Those who hear and do”'
    claim: 'The brethren of the Lord were children of Joseph and Mary born after Jesus'
    key: bd-brethren-of-the-lord
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/brethren-of-the-lord?lang=eng'
    quote: 'They were children of Joseph and Mary, born after Jesus’ birth. Matt. 13:56 shows that there were also sisters.'
  - where: 'note 8:21 “Those who hear and do”'
    claim: 'Jesus says followers take these relationships when they hear and do; it ties to the sower'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'the appearance of Jesus’ “mother and his brethren” leads him to say that followers will assume these honored relationships when they “hear the word of God, and do it” (8:19, 21).'
  - where: 'note 8:21 “Those who hear and do”'
    claim: 'Jesus holds up His family as examples, and encourages His slow brothers'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'On one level, Jesus is holding up his family members as examples, thus pointing to his home as the major nurturing influence on his youth'
  - where: 'note 8:21 “Those who hear and do”'
    claim: 'His brothers were slow to respond (John 7:3–5)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'he is encouraging them to accept his work because we possess indicators that his brothers are slow to respond to him (see John 7:3–5)'
  - where: 'note 8:21 “Those who hear and do”'
    claim: 'Mary exemplified hearing the word of God and doing it from the annunciation'
    key: olson-ministered
    url: 'https://rsc.byu.edu/learn-me/they-ministered-unto-him-their-substance'
    quote: 'Mary exemplified what the Lord meant by hearing the word of God and doing it from the time the angel appeared to her to announce that she would bear the Son of God.'

  # ---- 8:23
  - where: 'note 8:23 “Filled with fear”'
    claim: 'JST 8:23 reads filled with fear'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/8?lang=eng'
    quote: 'JST Luke 8:23 … and they were filled with fear, and were in danger.'
  - where: 'note 8:23 “Filled with fear”'
    claim: '“With water” is the translators’ italic addition; the verb is imperfect, “began to be filled”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'The tense of the verb is imperfect and is better rendered “they began to be filled.” In the minds of the translators, the whitecaps are fierce enough that they begin to splash into the boat, for they add the italicized phrase “with water.”'
  - where: 'note 8:23 “Filled with fear”'
    claim: 'Sudden violent storms come down on the lake from the surrounding hills'
    key: hunter-tempest-raging
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1984/10/master-the-tempest-is-raging?lang=eng'
    quote: 'The Sea of Galilee is quite low, about 680 feet below sea level, and the heat becomes quite great. The hills surrounding the water rise up very sharply and to considerable height.'
  - where: 'note 8:23 “Filled with fear”'
    claim: 'Cold air from the hills meets warm air from the lake: sudden violent storms'
    key: hunter-tempest-raging
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1984/10/master-the-tempest-is-raging?lang=eng'
    quote: 'The cold air rushing down from the hills meets the warm air rising from the lake in such a way that sudden and temporarily violent storms can occur'
  - where: 'note 8:23 “Filled with fear”'
    claim: 'By now the disciples turn to Him almost naturally'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'In this account of the stilling of the windstorm, the compelling element is that, by this time, almost naturally, Jesus’ disciples turn to him.'
  - where: 'note 8:23 “Filled with fear”'
    claim: '“Where is your faith?” asks why their faith is not effective, why they fear, as the JST confirms; Mark asks whether they have any'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'Jesus’ question asks in essence why the faith of the disciples is not effective, why they fear, as the Joseph Smith Translation verifies, whereas the form of the question in Mark 4:40 challenges whether they possess any faith'

  # ---- 8:25
  - where: 'note 8:25 “What manner of man is this?”'
    claim: 'Strictly the question is “So, who is this?”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'Strictly, the question is, “So, who is this?” This question frames the query of the ages'
  - where: 'note 8:25 “What manner of man is this?”'
    claim: 'The verb “rebuked” is the one used for unclean spirits and disease; now it reaches wind and water'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'The Greek verb epitimaō has appeared in stories of Jesus healing people from unclean spirits and diseases (see 4:35, 39, 41). The power of his rebuke now pushes forward in controlling natural elements such as wind and water.'
  - where: 'note 8:25 “What manner of man is this?”'
    claim: 'Even if people will not hear and obey, nature will'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'An allusion points back to the need for humans to obey Jesus’ words, as at the conclusion of the parable of the sower and in his meaning about who his mother and brothers are (see 8:8, 21). Even if people will not hear and obey, nature will'
  - where: 'note 8:25 “What manner of man is this?”'
    claim: 'Talmage: the Lord of earth, air and sea who commanded at the Creation'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'The Lord of earth, air, and sea spoke and was obeyed. He it was who, amidst the black chaos of creation’s earliest stages, had commanded with immediate effect'

  # ---- 8:26
  - where: 'note 8:26 “Over against Galilee”'
    claim: 'Gadara is six miles inland and cannot be the scene; the place must be on the east shore below the Golan; Gergesa the best candidate; P75 reads Gerasenes'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'The site of ancient Gadara lies in northwest Jordan (modern Umm Qeis), six miles southeast of the southern end of the Sea of Galilee.'
  - where: 'note 8:26 “Over against Galilee”'
    claim: '“Over against Galilee” points to the east side; Gergesa the best candidate, though P75 reads Gerasenes'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'Luke’s expression “over against Galilee” also points to the east side of the lake, opposite the province of Galilee that lies on the western side and where Herod Antipas is tetrarch (see 3:1).'
  - where: 'note 8:26 “Over against Galilee”'
    claim: 'Gadara cannot be the scene; the place is on a steep slope below the Golan where animals can run into deep water'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'we must think of a place along the east edge of the Sea of Galilee, on a steep slope below the towering bluffs of Gaulanitis, the modern Golan Heights. It is only here that animals can run directly down into deep water.'
  - where: 'note 8:26 “Over against Galilee”'
    claim: 'Gadara too far for the swine to run into the lake'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'From the description of the swine running down a slope into the water of the lake (see 8:33), this site cannot be where the action described in the next few verses takes place.'
  - where: 'note 8:26 “Over against Galilee”'
    claim: 'Gergesa best candidate; earliest text Gerasenes; Gentile territory; His power reaches beyond Jewish areas'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'The best candidate is Gergesa on the east shore of the lake, even though the earliest text reads “Gerasenes” (P75). Significantly, the territory of the Gergesenes stands in gentile territory.'
  - where: 'note 8:26 “Over against Galilee”'
    claim: 'A region, not a town; Gadara, Gerasa and Gergesa all in it'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'In that district of Perea there were at the time towns named respectively Gadara, Gerasa, and Gergesa; the region in general, therefore, could properly be called the land of the Gadarenes or of the Gergesenes.'
  - where: 'note 8:26 “Over against Galilee”'
    claim: 'Swine are forbidden animals to Jews'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'Besides a notation that would endear this story to Jewish hearers because swine are among the forbidden animals, the expression points out how ancients raised pigs—in herds.'

  # ---- 8:30
  - where: 'note 8:30 “Legion”'
    claim: 'Legion: a Latin word, a legion of up to six thousand men; many demons'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'The term (Greek legiōn, from Latin legio) denotes a legion of soldiers that, when fully mobilized, consists of up to six thousand men'
  - where: 'note 8:30 “Legion”'
    claim: 'The man could no longer distinguish his personality from the demons’'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'So complete was his possession by wicked spirits that he could no longer distinguish between his individual personality and theirs.'
  - where: 'note 8:30 “Legion”'
    claim: 'A third of the premortal spirits followed Satan and dwell on the earth; they can possess bodies'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'Other scripture holds that fully one-third of the premortal spirits follow Satan and turn from the Father, taking up residence on the earth (see D&C 29:36–37; 76:33). These spirits have power to possess the bodies of humans.'
  - where: 'note 8:30 “Legion”'
    claim: 'Luke shifts from the single unclean spirit to the plural, as if one spoke for many'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'In 8:31–33 the plural emerges, as if the single demonic spirit that possesses the body of the man is the spokesperson for others who are nearby.'
  - where: 'note 8:30 “Legion”'
    claim: 'The demons knew who Jesus was when the religious authorities did not'
    key: keller-mark-luke
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/mark-luke'
    quote: 'The minions of Satan recognized and knew who Jesus was, but the religious authorities did not.'

  # ---- 8:31
  - where: 'note 8:31 “Into the deep”'
    claim: 'abyssos: the Septuagint word for tehom, the immeasurable depth; used of the deep in Gen. 1:2'
    key: thayer
    url: 'https://biblehub.com/greek/12.htm'
    quote: 'in the Scriptures ἡ ἄβυσσος (the Sept. for תְּהום) namely, χώρα, the pit, the immeasurable depth, the abyss.'
  - where: 'note 8:31 “Into the deep”'
    claim: 'The abyss is the place of dark evil forces where Satan will be bound (Rev. 9; 20)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'This region is the well-known place of the departed dead (see Rom. 10:7) and of dark, evil forces (see Rev. 9:1–2, 11; 11:7; 17:8) where Satan will be bound for a thousand years (see Rev. 20:1, 3).'
  - where: 'note 8:31 “Into the deep”'
    claim: 'Luke ties Jesus’s power over the deep to the Creation (LXX Gen. 1:2 has abyssos)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'The term for “deep” (Greek abyssos) is the same that appears in LXX Genesis 1:2. Plainly, Luke connects Jesus’ powers over “the deep” with those manifested in the earth’s creation, effectively tying the Savior to both events.'
  - where: 'note 8:31 “Into the deep”'
    claim: 'The swine are only a temporary respite; their end is the place prepared (D&C 29:38)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'It seems that their escape from Jesus into the swine is only a temporary respite from their ultimate fate'
  - where: 'note 8:31 “Into the deep”'
    claim: 'Talmage calls Luke’s words “of awful import”'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'or as Luke records in words of awful import, “that he would not command them to go out into the deep.”'

  # ---- 8:32
  - where: 'note 8:32 “Why the swine”'
    claim: 'Joseph Smith, as reported by William Clayton: the devil has no body and would prefer a swine’s body to none'
    key: wjs-1841-01-05
    url: 'https://rsc.byu.edu/words-joseph-smith/5-january-1841-tuesday-old-homestead'
    quote: 'The Devil has no body, and herein is his punishment. He is pleased when he can obtain the tabernacle of man and when cast out by the Savior he asked to go into the herd of swine showing that he would prefer a swines body to having none.'
  - where: 'note 8:32 “Why the swine”'
    claim: 'Joseph Smith: the great principle of happiness is having a body'
    key: wjs-1841-01-05
    url: 'https://rsc.byu.edu/words-joseph-smith/5-january-1841-tuesday-old-homestead'
    quote: 'We came to this earth that we might have a body and present it pure before God in the Celestial Kingdom. The great principle of happiness consists in having a body.'
  - where: 'note 8:32 “Why the swine”'
    claim: 'The quiet herd becomes wild; the wild man becomes calm'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'Unexpectedly, the man becomes placid, peaceful, fully in control of himself. And Jesus is the instigator of the switch from quiet swine to unmanageable, from unruly man to clothed and calm.'
  - where: 'note 8:32 “Why the swine”'
    claim: 'The report is from William Clayton’s Private Book'
    key: wjs-1841-01-05
    url: 'https://rsc.byu.edu/words-joseph-smith/5-january-1841-tuesday-old-homestead'
    quote: 'Extracts from William Clayton''s Private Book'
  - where: 'note 8:32 “Why the swine”'
    claim: 'Why Jesus allowed the loss: any answer is speculation'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'Why does Jesus allow the loss to occur? After all, it is he who permits the demons to invade the bodies of the swine. And he surely must know what will result. So, why? In response, any answer is beset by speculation.'
  - where: 'note 8:32 “Why the swine”'
    claim: 'The act shows the value of human well-being over animals'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'In the end, the Savior’s act demonstrates the high value of human well-being in contrast to that of animals'
  - where: 'note 8:32 “Why the swine”'
    claim: 'The destruction was not by His command'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'in the destruction of the swine, which latter occurrence, however, was not in pursuance of His command.'

  # ---- 8:37
  - where: 'note 8:37 “Depart from us”'
    claim: 'The fear sinful men feel in the presence of the Righteous; the people partly heathen; compare Peter in Luke 5:8'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'It was the fear that sinful men feel in the presence of the Righteous. They were not prepared for other manifestations of divine power'
  - where: 'note 8:37 “Depart from us”'
    claim: 'Talmage likens it to Peter’s words at Luke 5:8 and asks the people be judged mercifully'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'We must judge the people mercifully, however, if at all. They were in part heathen, and had but superstitious conceptions of Deity. Their prayer that Jesus leave them brings to mind the ejaculation of Simon Peter'
  - where: 'note 8:37 “Depart from us”'
    claim: 'They found the man they had feared sitting quietly at Jesus’s feet, and were afraid of Him'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'all were astounded to behold the once wild man of whom they had all been afraid, now clothed, and restored to a normal state of mind, sitting quietly and reverently at the feet of Jesus. They were afraid of One who could work such wonders'
  - where: 'note 8:37 “Depart from us”'
    claim: 'They dreaded whom the power might affect'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'they dreaded to think who among them might be directly affected thereby should it be exerted.'
  - where: 'note 8:37 “Depart from us”'
    claim: 'The townspeople likely came angry at the loss of the herd, a major source of income'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'they come to him already full of anger and frustration over the loss of the herd of swine which surely represents a major source of income for many among them.'

  # ---- 8:39
  - where: 'note 8:39 “What God had done, what Jesus had done”'
    claim: 'Told to show what God had done, the man proclaims what Jesus had done; Luke equates the two'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'The Savior’s instruction to the man is to show what God has done for him. Here, the man proclaims what Jesus has done. By including this subtle but unmistakable shift, Luke equates Jesus’ doings with those of God.'
  - where: 'note 8:39 “What God had done, what Jesus had done”'
    claim: 'Sent home, the man becomes a witness among his own people, a hearer who obeys'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'Effectively, the man becomes a witness for Jesus among his own people. Moreover, and more to the point, the man becomes a willing hearer and, thereafter, willingly obeys.'
  - where: 'note 8:39 “What God had done, what Jesus had done”'
    claim: 'The visit succeeds: a witness left among the Gentiles prepares for the Seventy'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'his trip succeeds because he leaves a first-rank witness among them whose sad and tortured past is well known to all.'

  # ---- 8:43
  - where: 'note 8:43 “Twelve years unclean”'
    claim: 'Law: a woman with an issue beyond her time was unclean'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/15?lang=eng'
    quote: 'And if a woman have an issue of her blood many days out of the time of her separation, or if it run beyond the time of her separation; all the days of the issue of her uncleanness shall be as the days of her separation: she shall be unclean.'
  - where: 'note 8:43 “Twelve years unclean”'
    claim: 'She was ritually unclean and so was all she touched; family and friends likely withdrew'
    key: olson-ministered
    url: 'https://rsc.byu.edu/learn-me/they-ministered-unto-him-their-substance'
    quote: 'According to the law of Moses, such an illness rendered the woman ritually unclean and anything or anyone that she touched was subsequently rendered unclean (see Leviticus 15:25–31).'
  - where: 'note 8:43 “Twelve years unclean”'
    claim: 'Her bed, utensils and food tainted; family no longer touched her'
    key: olson-ministered
    url: 'https://rsc.byu.edu/learn-me/they-ministered-unto-him-their-substance'
    quote: 'Her bed, eating utensils, and food she prepared were tainted. Most likely, her family members no longer touched her, and her friends abandoned her long ago.'
  - where: 'note 8:43 “Twelve years unclean”'
    claim: 'Jairus saw a woman ill as long as his daughter had lived, with greater faith than his'
    key: olson-ministered
    url: 'https://rsc.byu.edu/learn-me/they-ministered-unto-him-their-substance'
    quote: 'Walking toward his home with Jesus, Jairus saw such faith exemplified in the form of a woman who had been ill for as long as his daughter had lived.'

  # ---- 8:44
  - where: 'note 8:44 “The border of His garment”'
    claim: 'kraspedon in the NT is the tsitsit, a tassel of twisted wool worn to remind of the law'
    key: thayer
    url: 'https://biblehub.com/greek/2899.htm'
    quote: 'in the N. T. for Hebrew צִיצִית, i. e. a little appendage hanging down from the edge of the mantle or cloak, made of twisted wool; a tassel, tuft'
  - where: 'note 8:44 “The border of His garment”'
    claim: 'Tassels on the four corners of the outer mantle in New Testament times'
    key: south-clothing-textiles
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/clothing-textiles-new-testament'
    quote: 'During New Testament times, this injunction was fulfilled by the addition of tassels (tzitzit) to the four corners of the himation, or outer mantle.'
  - where: 'note 8:44 “The border of His garment”'
    claim: 'Her faith thought the garment itself healed; the power was His, exercised at His will'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'She believed that the influence of Christ’s person, and even that attaching to His raiment, was a remedial agency, ample to cure her malady; but she did not realize that the power to heal was an inherent attribute to be exercised at His will'

  # ---- 8:46
