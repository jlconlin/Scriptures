    key: halverson-soils-souls
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/soils-souls-parable-sower'
    quote: 'Until then, the sower still goes forth to sow, hoping to find in us “faith, and . . . diligence, and patience, and long-suffering, waiting for the tree to bring forth fruit” (Alma 32:43).'
