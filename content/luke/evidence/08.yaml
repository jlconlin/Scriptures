    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'he evidently wants her neighbors, who know her condition, to learn that she is healed. Thus her healing includes an important social dimension of being allowed back into her society as well as physical and religious ones.'

  # ---- 8:48
  - where: 'note 8:48 “Thy faith hath saved thee”'
