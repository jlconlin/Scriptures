    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'A further element has to do with the word “daughter” (Greek thugatēr). It appears in this story and the story of the woman with the “issue of blood,” uniting them (see 8:48, 49).'
  - where: 'note 8:48 “Thy faith hath saved thee”'
    claim: 'He confirmed the healing as permanent'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'He confirmed the healing and let her depart with the comforting assurance that her recovery was permanent.'

  # ---- 8:50
  - where: 'note 8:50 “Fear not: believe only”'
    claim: 'The messenger shows no faith Jesus can raise the dead'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'The messenger and those he or she represents in Jairus’ home exhibit no faith that Jesus can raise the dead even if they know that he can heal the sick.'
  - where: 'note 8:50 “Fear not: believe only”'
    claim: 'JST 8:50: Jesus answers Jairus, not the messenger'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'The Joseph Smith Translation clarifies the historical situation that, when Jesus hears the news from the messenger, he responds not to him but to Jairus'
  - where: 'note 8:50 “Fear not: believe only”'
    claim: '“Fear not” echoes the angels to Zacharias, Mary and the shepherds; “believe only” answers the doubt in “trouble not the Master”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'The first words, “Fear not,” point back to the angel’s words addressed to Zacharias, Mary, and the shepherds just before important moments guided by divine powers (see 1:13, 30; 2:10).'
  - where: 'note 8:50 “Fear not: believe only”'
    claim: '“Believe only” answers the doubt in “trouble not the Master”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'The second part, “believe only,” contradicts the doubt lurking in the man’s words, “trouble not the Master” (8:49).'
  - where: 'note 8:50 “Fear not: believe only”'
    claim: 'Here sōzō means wholeness, rescue from affliction'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'But here the meaning has to do with wholeness or being rescued from affliction'
  - where: 'note 8:50 “Fear not: believe only”'
    claim: 'The faith is to come from the parents, since the girl has passed through death'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'Moreover, the faith is to come from the girl’s parents since she has already passed through death’s doors and therefore Jesus is not offering salvation.'
  - where: 'note 8:50 “Fear not: believe only”'
    claim: 'The Lord had more to teach Jairus before answering'
    key: olson-ministered
    url: 'https://rsc.byu.edu/learn-me/they-ministered-unto-him-their-substance'
    quote: 'The Lord had more to teach Jairus, however, before answering his request.'
  - where: 'note 8:50 “Fear not: believe only”'
    claim: 'Jairus had seen on the way a faith greater than his own'
    key: olson-ministered
    url: 'https://rsc.byu.edu/learn-me/they-ministered-unto-him-their-substance'
    quote: 'In the interim, Jairus witnessed someone with greater faith in the Savior’s power than he possessed at his first petition to Christ.'

  # ---- 8:51
  - where: 'note 8:51 “Peter, James and John”'
    claim: 'For the first time Jesus singles out these three as witnesses'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'The main point is that Jesus singles out these three Apostles for the first time to become witnesses to a special event that he creates and shapes.'
  - where: 'note 8:51 “Peter, James and John”'
    claim: 'The calm in the house is a teaching moment; Peter applies it raising Tabitha'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'It is the act of a clear-thinking leader who understands the connection between holy acts and calmness, creating an important teaching moment for his Apostles. Peter certainly grasps the lesson and applies it when he raises Tabitha from the dead in Joppa (see Acts 9:40).'

  # ---- 8:52
  - where: 'note 8:52 “Not dead, but sleeping”'
    claim: 'She was dead; “sleepeth” told her sleep would be short; speaking of death as sleep was common'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'That the daughter of Jairus was dead is placed beyond reasonable doubt by the scriptural record. Our Lord’s statement to the noisy mourners that “the damsel is not dead but sleepeth” told that her sleep was to be of short duration.'
  - where: 'note 8:52 “Not dead, but sleeping”'
    claim: 'Death as sleep was common speech'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'It was a rabbinical and common custom of the time to speak of death as a sleep, and those who laughed Jesus to scorn for His statement chose to construe His words in a sense of such literalism as the context scarcely warrants.'
  - where: 'note 8:52 “Not dead, but sleeping”'
    claim: 'Other NT passages call death a sleep'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'A similar sense lies in other New Testament passages that characterize death as a sleep (see John 11:11–14; Acts 13:36; 1 Cor. 11:30; 15:20, 51; 1 Thes. 4:14–15).'
  - where: 'note 8:52 “Not dead, but sleeping”'
    claim: 'Irony: they know she is dead but not that Jesus can treat death as sleep'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'Those gathered know that she is already dead, but they do not know that Jesus possesses the power to treat her death as if she is sleeping.'

  # ---- 8:55
  - where: 'note 8:55 “Her spirit came again”'
    claim: 'Her spirit, departed at death, is called back to her body; recalls Elijah'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'The expression affirms that Jairus’s daughter has passed away and that Jesus is calling her spirit, which in death departs from her body, back to her body.'
  - where: 'note 8:55 “Her spirit came again”'
    claim: 'The story recalls Elijah restoring a boy (1 Kgs. 17:21–22)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'This story, of course, recalls Elijah’s miracle of restoring a boy to life and his spirit returning (see 1 Kgs. 17:21–22).'
  - where: 'note 8:55 “Her spirit came again”'
    claim: 'Eating is proof the dead is alive again (24:41–43)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'For Luke, eating is proof that the formerly dead person is truly alive again (see 24:41–43)'
  - where: 'note 8:55 “Her spirit came again”'
    claim: 'Restoration to mortal life differs from resurrection; she had later to die'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'the miracle consisted in reuniting the spirit and the body in a continuation of the interrupted course of mortal existence. That the subject of each of these miracles had to subsequently die is certain.'
  - where: 'note 8:55 “Her spirit came again”'
    claim: 'Jesus Christ the first to rise immortal'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'Jesus Christ was the first of all men who have lived on earth to come forth from the tomb an immortalized Being'
  - where: 'note 8:55 “Her spirit came again”'
    claim: 'Jairus’s daughter dying and living again prefigured the Savior’s death and Resurrection'
    key: olson-ministered
    url: 'https://rsc.byu.edu/learn-me/they-ministered-unto-him-their-substance'
    quote: 'Through the power of the Atonement in experiences that prefigured the Savior’s own death and Resurrection, a woman—the widow of Nain—received her only son back to life, and a man—Jairus—witnessed his only daughter die and then live again.'
  - where: 'note 8:55 “Her spirit came again”'
    claim: 'The charge to tell no man may come from Mark, or from the mourners’ negative reaction'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'Moreover, Jesus’ command not to talk about what happens might go back to the excessively negative reaction of the mourners and a willingness to let them believe whatever they want to believe (see 8:53).'

  # ---- christ, explore
  - where: christ
    claim: 'Jesus is both creator and redeemer, lord of chaos and of deliverance'
