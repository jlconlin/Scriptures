    key: thayer
    url: 'https://biblehub.com/greek/4982.htm'
    quote: 'to save a suffering one (from perishing), e. g. one suffering from disease, to make well, heal, restore to health'
  - where: 'note 8:48 “Thy faith hath saved thee”'
