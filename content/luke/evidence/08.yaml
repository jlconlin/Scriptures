    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
    quote: 'Another instance in Luke where Jesus used the expression pistis sou sesōken se extends the concept to the idea of spiritual healing.'
  - where: 'note 8:48 “Thy faith hath saved thee”'
    claim: '“Daughter” unites this story with Jairus’s'
