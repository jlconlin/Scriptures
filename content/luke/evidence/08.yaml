    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
    quote: 'frequently when Jesus heals someone, Luke uses the same Greek phrase, pistis sou sesōken se, which the King James translation usually renders as “thy faith hath made thee'
