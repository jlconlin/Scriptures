chapter: 24
claims:
  - where: setting
    claim: 'Luke’s resurrection narrative is richer in detail than the other Synoptics and more effective in demonstrating a bodily resurrection'
    key: huntsman-lukes-jesus
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
    quote: 'Luke’s account of the resurrection is much richer in detail than the other Synoptics and is more effective in demonstrating the reality of an actual, bodily resurrection.'
  - where: setting
    claim: 'Brown: Luke learns of the morning’s events from one of the women while in Jerusalem with Paul'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'when in Jerusalem with the Apostle Paul, and staying in the city for at least two weeks (see Acts 21:15, 18, 26, 27; … Luke learns about these events from at least one of the women who earlier experiences them'
  - where: setting
    claim: 'Brown: Cleopas is the chief eyewitness source of the Emmaus account'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'At base, the story rests on eyewitness testimony, that of Cleopas and his companion. … Cleopas, a person known to other believers, … stands as the chief source for this account'
  - where: setting
    claim: 'Acts: Jesus seen by the apostles forty days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/1?lang=eng'
    quote: 'To whom also he shewed himself alive after his passion by many infallible proofs, being seen of them forty days, and speaking of the things pertaining to the kingdom of God:'
  - where: thread
    claim: 'One verb, dianoigō, for opened eyes (31), opened scriptures (32) and opened understanding (45); sight and understanding on one continuum; the Savior holds the keys to open'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The verb (Greek dianoigō) is the same that appears in 24:31 for the opening of the eyes and in 24:45 for the opening of the understanding … Hence, physical sight and spiritual understanding stand on the same continuum.'
  - where: thread
    claim: '“Must” (dei) is the divine necessity, returning in 24:26, 44, 46'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The verb translated “must” (Greek dei) underlines the divine need that is fulfilled in both Jesus’ ministry and his suffering (see 2:49; 4:43; 9:22; 13:33; 17:25; 22:37; 24:26, 44, 46'
  - where: thread
    claim: 'Luke’s story ends where it begins, in the temple'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'Luke’s story ends where it begins, in the temple (see 1:9).'
  - where: section 1 plain
    claim: '“Idle tales” rendered “nonsense” (lēros)'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'seeing their reports as “nonsense” (Greek, lēros; KJV, “idle tales”)'
  - where: section 1 plain
    claim: 'The women kept telling (imperfect)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The verb (Greek legō) stands in the imperfect tense, underlining the fact that, in the face of the Apostles’ skepticism, the women affirm again and again what they witness earlier.'
  - where: section 2 plain
    claim: '“Ought not” rendered “Was it not necessary?”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The verb in this passage is the Greek verb dei and the expression is to be rendered, “Was it not necessary?”'
  - where: section 2 plain
    claim: '“Reasoned” means to discuss and to dispute'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The Greek verb syzēteō carries the dual senses “to discuss” and, more strongly, “to dispute, to debate” (see 22:23).'
  - where: section 2 plain
    claim: 'The footnote glosses “fools” as “unwise” and gives the distance of Emmaus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/24?lang=eng'
    quote: '“fools”: GR unwise.'
  - where: section 3 plain
    claim: '“Endued” rendered “clothed”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The verb “to endue” (Greek endyō) means “to clothe, to put on,” … In Luke, the form of the verb is the middle voice with a passive sense, meaning “to be clothed.”'
  - where: section 4 plain
    claim: '“As far as to Bethany” means toward Bethany'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The sense is that they walk toward Bethany from the city (Greek preposition pros with the name Bethany in the accusative)'
  - where: 'note 24:1 “Bringing the spices which they had prepared”'
    claim: '“They” are the women of 23:49, 55–56, known since 8:2–3; their experience spans the ministry, a little less than the Twelve'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'it ties back to the last two verses in chapter 23, clearly centering on the women who become eyewitnesses (see 23:49, 55–56). … their experience with Jesus arcs across virtually all of Jesus’ ministry, only a little less than the experience of the Twelve'
  - where: 'note 24:1 “Bringing the spices which they had prepared”'
    claim: 'They came with spices and perhaps to mourn properly, not possible on Friday afternoon'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'Another motive may lie behind their early arrival: to mourn properly because the opportunity does not present itself on Friday afternoon'
  - where: 'note 24:1 “Bringing the spices which they had prepared”'
    claim: 'Entering the tomb made them unclean for seven days (Num. 19), which they knew'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'They certainly come to the tomb in the full knowledge that, by dressing the body of Jesus, they become unclean for seven days (see Num. 19:11–20). But that seems not to be foremost on their minds as they crowd into the small sepulcher'
  - where: 'note 24:4 “Two men … in shining garments”'
    claim: 'JST Luke 24:2 reads two angels standing by the sepulcher'
    key: jst-luke-24
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/24?lang=eng'
    quote: 'And they found the stone rolled away from the sepulcher, and two angels standing by it in shining garments.'
  - where: 'note 24:4 “Two men … in shining garments”'
    claim: 'Tombs small, one place to stand; women could not all bow inside, so the angels likely outside, as JST affirms'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'Generally they feature only one area where a person can stand upright. Further, not all the women can bow down inside such a small space (see 24:5). So the men are most likely standing outside the tomb, as JST 24:2 affirms'
  - where: 'note 24:4 “Two men … in shining garments”'
    claim: 'Two angels fulfil the requirement of two witnesses; JST changes Matthew and Mark to accord; angels form an inclusio with 1:11, 26; 2:9'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'thus fulfilling the requirement of at least two witnesses in life and death matters (see Deut. 17:6; 19:15). The Joseph Smith Translation consistently changes all references to accord with Luke’s account (see JST Matt. 28:2–4; JST Mark 16:3–4).'
  - where: 'note 24:4 “Two men … in shining garments”'
    claim: 'The angels tie back to the angel appearances early in the Gospel'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'the appearance of angels ties back to the appearances early in the Gospel (see 1:11, 26; 2:9), framing another literary inclusio'
  - where: 'note 24:5 “Why seek ye the living among the dead?”'
    claim: '“The living” as a title, the Living One, Jesus’ newly won role'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The term represents a new title, “The Living One,” underlining Jesus’ newly won role as the Living God, the one resurrected from death (see Deut. 5:26; Josh. 3:10; 1 Sam. 17:26; Ps. 42:2; 84:2; Jer. 10:10'
  - where: 'note 24:5 “Why seek ye the living among the dead?”'
    claim: '“Is risen” passive: the Father raised Him'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The verb (Greek egeirō) stands in the passive voice. … In the passive, the verb “points to the truth that the Father raised [the Savior]”'
  - where: 'note 24:5 “Why seek ye the living among the dead?”'
    claim: 'The question unique to Luke; the angels replace the Galilee message with the passion prediction, emphasizing fulfillment of prophecy'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'By replacing the news that Jesus will meet the disciples in Galilee with a reference to Jesus’s earlier passion prediction (Luke 24:6‒7; cf. Luke 9:22; 18:31–34), the angels instead emphasize how the resurrection is a fulfillment of prophecy.'
  - where: 'note 24:5 “Why seek ye the living among the dead?”'
    claim: '“Must” (dei) as divine need, recurring in 24:26, 44, 46'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The verb translated “must” (Greek dei) underlines the divine need that is fulfilled in both Jesus’ ministry and his suffering (see 2:49; 4:43; 9:22; 13:33; 17:25; 22:37; 24:26, 44, 46'
  - where: 'note 24:5 “Why seek ye the living among the dead?”'
    claim: 'The women were with the disciples in Galilee when He foretold His death (9:22, 44)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'Plainly, these women are traveling in the disciples’ company on at least one occasion in Galilee when Jesus utters a prediction of his suffering and death (see 9:22, 44; 24:6).'
  - where: 'note 24:11 “As idle tales”'
    claim: 'lēros, “nonsense”'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'While Luke records that the male disciples at that time do not believe the women, seeing their reports as “nonsense” (Greek, lēros; KJV, “idle tales”)'
  - where: 'note 24:11 “As idle tales”'
    claim: 'Imperfect of apisteō matches the women’s report: the more they affirm, the more the men dismiss; news from women they know'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'even though the news comes from women whom they know. The imperfect tense of the verb (Greek apisteō) matches that of the women’s report in 24:10: the more the women affirm the news, the more the men dismiss it.'
  - where: 'note 24:11 “As idle tales”'
    claim: 'Faust: the Resurrection was unprecedented; the raised died again, Jesus would never die again'
    key: faust-supernal-gift-atonement
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1988/10/the-supernal-gift-of-the-atonement?lang=eng'
    quote: 'In all human experience, this had never happened before. It was completely unprecedented. This was a different experience than the raising of Jairus’ daughter … the young man of Nain … or Lazarus … They all died again. Jesus, however, became a resurrected being. He would never die again.'
  - where: 'note 24:11 “As idle tales”'
    claim: 'Their eventual conversion makes their witness more credible'
    key: draper-he-has-risen
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/he-has-risen'
    quote: 'The writer of each Gospel affirms that the women’s combined testimony did not convince the men. … Thus their eventual conversion to the reality of the Resurrection makes their witness more credible.'
  - where: 'note 24:16 “Their eyes were holden”'
    claim: 'krateō, passive: sight restrained by God; imperfect, continual; contrast with the sudden opening in 24:31; JST “holden, or covered”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'At base, the Greek verb krateō means “to seize, to hold.” In the passive voice, it means that the sight of the disciples is being held or restrained by someone else, by God … the Joseph Smith Translation makes the passage read: “were holden, or covered” (JST 24:15'
  - where: 'note 24:16 “Their eyes were holden”'
    claim: 'The imperfect points to continual restraining while the three walk; contrasts with sudden opening'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The imperfect tense here points to a continual restraining of sight, as long as the three walk together. This sense contrasts with the simple past tense, in the passive, that indicates the sudden opening of their eyes in 24:31.'
  - where: 'note 24:16 “Their eyes were holden”'
    claim: 'KnoWhy reading: not ready to behold Him in full glory; saw Him as through a veil, as a mortal'
    key: sc-knowhy-677
    url: 'https://scripturecentral.org/knowhy/why-did-christ-appear-to-two-disciples-on-the-road-to-emmaus'
    quote: 'it appears that these two disciples were not yet ready to behold the resurrected Lord in His full glory, rather viewing Him as though through a veil, seeing Him as he had looked as a mortal man.'
  - where: 'note 24:18 “Cleopas and his companion”'
    claim: 'Cleopas probably named as source; may be Clopas, husband of Mary (John 19:25); companion could be his wife; Emmaus sites proposed west of Jerusalem; two witnesses'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'Because Cleopas may be the Greek form of Clopas, he may in fact have been the husband of one of the Marys at the foot of the cross (John 19:25; KJV, “Mary the wife of Cleophas”) … the second traveler could have been his wife'
  - where: 'note 24:18 “Cleopas and his companion”'
    claim: 'Emmaus identified with several sites west of the city; Cleopas probably named as the source'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'a town some seven miles from Jerusalem that scholars have identified with a number of modern sites to the west of the city including Qoloniya, Motza, Abu Ghosh, or el-Qubeibeh. … Cleopas is probably named because he was the source of this story for Luke'
  - where: 'note 24:18 “Cleopas and his companion”'
    claim: 'Two fulfil the Mosaic requirement of two witnesses; returning home after Passover'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'with the two of them returning home after being in Jerusalem for the Passover holiday. … having two people encounter, see, and speak with Jesus fulfills the Mosaic requirement of having two witnesses (Deut 19:15; see also 2 Nephi 11:3).'
  - where: 'note 24:18 “Cleopas and his companion”'
    claim: 'Not one of the eleven; Brown reads the two as men (24:22)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The second, unnamed person is not one of the eleven, who are all in Jerusalem (see 24:33). Most likely, the two travelers are men (see the Notes on 24:22, 24)'
  - where: 'note 24:18 “Cleopas and his companion”'
    claim: 'Luke universalizes the good news by appearing first to two average disciples'
    key: huntsman-lukes-jesus
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
    quote: 'he universalizes the good news of Jesus’s rising by appearing first not to the gathered eleven but to two “average” disciples on their way to Emmaus (Luke 24:13–32).'
  - where: 'note 24:21 “He which should have redeemed Israel”'
    claim: 'lytroumai here means rescuing Israel by military might, not ransom as in Titus 2:14 and 1 Pet. 1:18–19; widespread notion'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'Implicit in their words lies an incorrect, widespread notion that the Messiah is to carry out an expected deliverance … (Greek lytroumai) that here has to do with Jesus rescuing Israel as a people by military might rather than him paying a ransom for sins'
  - where: 'note 24:21 “He which should have redeemed Israel”'
    claim: 'These mistaken notions are why they identified Him only as a prophet'
    key: sc-knowhy-677
    url: 'https://scripturecentral.org/knowhy/why-did-christ-appear-to-two-disciples-on-the-road-to-emmaus'
    quote: 'Relying on these mistaken notions of who the Christ would be was undoubtedly a large part of why these disciples simply identified Him now as “a prophet mighty in word and deed.”'
  - where: 'note 24:21 “He which should have redeemed Israel”'
    claim: 'Their mistaken idea contributes to their sadness; Jesus’ words begin to correct it'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'Indeed, their mistaken idea about Jesus’ messiahship contributes to their evident sadness. … Jesus’ later words, of course, begin to correct their misunderstanding (see 24:25–27).'
  - where: 'note 24:26 “Ought not Christ to have suffered these things?”'
    claim: 'dei: “Was it not necessary?”, divine necessity'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The verb in this passage is the Greek verb dei and the expression is to be rendered, “Was it not necessary?” This term carries the sense of divine necessity'
  - where: 'note 24:26 “Ought not Christ to have suffered these things?”'
    claim: '“Christ” with the article is the risen Jesus’ self-designation; earlier “Son of man”; Cleopas recalls it'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'Here stands the Risen Jesus’ self-designation following his resurrection, with the definite article “the” not translated into English, bearing the sense “the Messiah,” “the Anointed One” … Cleopas, an eyewitness, recalls the Savior’s attribution of the title to himself.'
  - where: 'note 24:26 “Ought not Christ to have suffered these things?”'
    claim: 'Here Jesus first uses “Christ” of Himself, identifying His sufferings as God’s anointed as the source of His glory'
    key: huntsman-lukes-jesus
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
    quote: 'it is here that Jesus uses the title “Christ” of himself for the first time, identifying his sufferings as God’s anointed servant as the source of his glory (24:26).'
  - where: 'note 24:27 “Beginning at Moses and all the prophets”'
    claim: 'Law and Prophets; the third part with the Psalms may be assumed; Moses as prophet; other scripture (Jacob 7:11) has all prophets herald the Messiah'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'the Resurrected Jesus highlights the prophecies that arise in two parts of the Jewish scriptures, the Law and the Prophets … This third part may be assumed here … Other scripture lumps all prophetic voices together in heralding the Messiah (see JST John 3:18; 2 Ne. 25:19; Jacob 4:4; 7:11'
  - where: 'note 24:27 “Beginning at Moses and all the prophets”'
    claim: 'Jesus had previously taught from the scriptures about himself (4:17–21; 18:31)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'in previous settings, Jesus teaches disciples and others from the scriptures themselves about his ministry, Atonement, and Resurrection (see 4:17–21; 18:31; 20:17; 22:37'
  - where: 'note 24:27 “Beginning at Moses and all the prophets”'
    claim: '“Fools” (anoētos) a terribly uncomplimentary term, directed to all who misunderstand'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'In the parlance of the day, this kind of term (Greek anoētos) conveys a terribly uncomplimentary judgment … his unflattering term is directed to all who continue to misunderstand, not just to these two followers.'
  - where: 'note 24:27 “Beginning at Moses and all the prophets”'
    claim: 'Jesus taught them to recognize Him in the scriptures'
    key: sc-knowhy-677
    url: 'https://scripturecentral.org/knowhy/why-did-christ-appear-to-two-disciples-on-the-road-to-emmaus'
    quote: 'Jesus thereby corrected these false understandings and taught them how to properly recognize Him in the scriptures.'
  - where: 'note 24:28 “He made as though he would have gone further”'
    claim: 'No hint He is pretending; He intends to go on; their importuning leads Him to stop, probably at one of their homes'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'No hint lies in the text that the Savior is pretending to go on. Rather, he intends to keep going. It is the sincere importuning of the two disciples that leads him to stop (see 24:29), probably in the home of one of them'
  - where: 'note 24:30 “He took bread, and blessed it, and brake”'
    claim: 'Same verbs as 9:16 and 22:19; not the sacrament but sacramental in character'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The same sequence of verbs appears in the feeding of the five thousand and at the Last Supper (see the Notes on 9:16; 22:19). Although the Savior does not speak words that turn the meal into the sacrament, the meal becomes sacramental or holy in character because of who he is'
  - where: 'note 24:30 “He took bread, and blessed it, and brake”'
    claim: 'The bread engaged their senses: saw, heard, touched, presumably tasted'
    key: bowen-our-hands-have-handled
    url: 'https://interpreterfoundation.org/journal/our-hands-have-handled-ensuring-the-reassuring-doctrine-of-the-resurrection-in-the-lucan-and-johannine-writings'
    quote: 'Jesus performs four distinct, concrete actions involving the bread in front of Cleopas and his [Page 377]companion. These actions engaged their physical senses: they saw Jesus, heard his voice, touched the bread as he gave it to them, then presumably smelled and tasted it.'
  - where: 'note 24:30 “He took bread, and blessed it, and brake”'
    claim: 'Passive “opened”: the Savior opens their eyes; dianoigō in 24:31, 32, 45'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The passive voice of the verb “to open” (Greek dianoigō) points to the Savior as the one who opens their eyes'
  - where: 'note 24:30 “He took bread, and blessed it, and brake”'
    claim: 'One verb for eyes, scriptures and understanding; sight and understanding on one continuum'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The verb (Greek dianoigō) is the same that appears in 24:31 for the opening of the eyes and in 24:45 for the opening of the understanding … Hence, physical sight and spiritual understanding stand on the same continuum.'
  - where: 'note 24:32 “Did not our heart burn within us?”'
    claim: 'Periphrasis “was burning,” continuing while He spoke; recognized after; spiritual quickening; D&C 9:8; what investigators feel; JST “hearts”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The Joseph Smith Translation changes the singular “heart” to the plural “hearts.” The Greek verbs … form a periphrasis with the meaning “was burning,” underscoring the continuing nature of the disciples’ experience as long as the Savior is speaking.'
  - where: 'note 24:32 “Did not our heart burn within us?”'
    claim: 'A spiritual quickening recognized only afterward (D&C 9:8); also what investigators experience from missionaries'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The words point to a spiritual quickening that the two disciples recognize only after its occurrence (see … D&C 9:8). Very significantly, this description also refers to what new investigators will experience as they hear the message of missionaries.'
  - where: 'note 24:32 “Did not our heart burn within us?”'
    claim: 'D&C 9 was given to Oliver Cowdery'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/9?lang=eng'
    quote: 'Revelation given through Joseph Smith the Prophet to Oliver Cowdery, at Harmony, Pennsylvania, April 1829.'
  - where: 'note 24:34 “Hath appeared to Simon”'
    claim: 'The solo appearance to Peter makes him chief guarantor (1 Cor. 15:5); restored to full fellowship and to lead the church'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The reference is to the solo appearance of Jesus to Peter which makes him the chief guarantor of the resurrection (see 1 Cor. 15:5). More than this, after his earlier denial, Peter is completely revivified and restored to full fellowship with the Savior and is again raised to lead Jesus’ nascent church.'
  - where: 'note 24:34 “Hath appeared to Simon”'
    claim: '“Appeared” literally “was seen”: a direct physical encounter, not a vision'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'the passive form of the Greek verb horaō means more literally “was seen,” not “appeared,” … The appearance is not a vision like the one that comes to the Apostle Paul'
  - where: 'note 24:34 “Hath appeared to Simon”'
    claim: 'Verse 12 omitted by some manuscripts, kept by most including P75; omission from difficulty with John 20:3–7'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'Incidentally, this verse is omitted by some ancient manuscripts. But the vast majority preserve it, including the earliest, P75. The reason for the omission seems to be the difficulty of reconciling this verse with John 20:3–7'
  - where: 'note 24:34 “Hath appeared to Simon”'
    claim: 'Peter’s wondering appears to have occasioned his own encounter with the risen Lord'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'Peter’s “wondering to himself about what had happened” as he returned appears to have occasioned his own individual encounter with the Risen Lord (Luke 24:41; 1 Cor 15:5).'
  - where: 'note 24:39 “A spirit hath not flesh and bones”'
    claim: '“Spirit” near modern “ghost,” spirit of the deceased; dim lamplight'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The term “spirit” (Greek pneuma) in this case stands close to the modern meaning of “ghost.” This word in other contexts points to the spirit of a deceased person … Presumably, the light in the room is dim, coming only from small oil lamps'
  - where: 'note 24:39 “A spirit hath not flesh and bones”'
    claim: 'psēlaphaō unusual, touch to discover something unknown; nail marks may be implied (John 20:20, 25)'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'The verb here is somewhat unusual (Greek, psēlaphēsate; KJV, “handle”), conveying the idea of using the sense of touch to discover or find out something yet unknown … these tokens of his sacrificial death might be implied.'
  - where: 'note 24:39 “A spirit hath not flesh and bones”'
    claim: 'In negative terms the nature of a resurrected body; “flesh and blood” is mortality'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The Risen Jesus offers, in negative terms, the proper nature of a resurrected body, that is, it consists of flesh and bones and is not a disembodied spirit … The similar expression “flesh and blood” has to do strictly with mortality (see 1 Cor. 15:50'
  - where: 'note 24:39 “A spirit hath not flesh and bones”'
    claim: 'D&C 129 is Joseph Smith’s instruction and quotes Luke 24:39'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/129?lang=eng'
    quote: 'Instructions given by Joseph Smith the Prophet, at Nauvoo, Illinois, February 9, 1843, making known three grand keys by which the correct nature of ministering angels and spirits may be distinguished.'
  - where: 'note 24:39 “A spirit hath not flesh and bones”'
    claim: 'The footnote at 24:39 links “handle” to 3 Ne. 11:14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/24?lang=eng'
    quote: '“handle”: 3 Ne. 11:14 (12–15).'
  - where: 'note 24:43 “And did eat before them”'
    claim: 'He does not need food; eats as proof; all become eyewitnesses'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'It is not that in his resurrected state he needs food for sustenance but that he offers proof of his return to life. Everyone in the room now becomes an eyewitness of his tangible, resuscitated body'
  - where: 'note 24:43 “And did eat before them”'
    claim: 'The meal ensures no one can argue against the reality of the resurrected Jesus'
    key: bowen-our-hands-have-handled
    url: 'https://interpreterfoundation.org/journal/our-hands-have-handled-ensuring-the-reassuring-doctrine-of-the-resurrection-in-the-lucan-and-johannine-writings'
    quote: 'The concreteness of Jesus’s request and subsequent meal—“a piece of a broiled fish [and of an honeycomb]”22—ensures that nobody can walk away from this episode and coherently argue against the reality of the resurrected Jesus.'
  - where: 'note 24:43 “And did eat before them”'
    claim: 'Acts 10 recalls the eating; important for Greek Gentile converts liable to misunderstand the resurrection'
    key: bowen-our-hands-have-handled
    url: 'https://interpreterfoundation.org/journal/our-hands-have-handled-ensuring-the-reassuring-doctrine-of-the-resurrection-in-the-lucan-and-johannine-writings'
    quote: 'The testimony of these details would have been particularly important for future non-Jewish converts. Indeed, during the time of Luke’s writing of Luke-Acts, the polity of the church increasingly included Greek gentiles, whose cultural, religious, and intellectual backgrounds would make them susceptible to misunderstanding the resurrection'
  - where: 'note 24:43 “And did eat before them”'
    claim: '“And of an honeycomb” only in later manuscripts; perhaps a scribal addition, disputed'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'Only later manuscripts preserve this expression. The earlier and better texts omit it. Hence, it may be a late scribal addition, although this is disputed.'
  - where: 'note 24:44 “The law of Moses, the prophets, and the psalms”'
    claim: 'Threefold division Law, Prophets, Writings (psalms by synecdoche), still used by Jews'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'By using the threefold division of the scriptures as it was known in his day—the Teaching or Law (tôrâ), Prophets (nəḇîʾîm), and Writings (kəṯûḇîm; “psalms” by synecdoche) still used by our Jewish friends today'
  - where: 'note 24:44 “The law of Moses, the prophets, and the psalms”'
    claim: 'The division as it was coming to be known; Jesus imputes prophetic insight to all scripture'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The Risen Jesus’ words underscore the threefold division of scripture as it is coming to be known in his day … the Resurrected Jesus seems to impute prophetic insight to all of scripture'
  - where: 'note 24:44 “The law of Moses, the prophets, and the psalms”'
    claim: 'Luke preserves the broad outline of the forty-day teaching, beginning this night'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'it seems that here Luke also preserves the broad outline of the Lord’s teachings during the forty-day ministry which he sums up in a few words elsewhere … we gain a sense for what he teaches these beloved followers during the next six weeks, starting this night.'
  - where: 'note 24:47 “Among all nations, beginning at Jerusalem”'
    claim: '“Nations” (ethnos) also “Gentiles”; the commission is to every people'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The sweep of the Savior’s commission is stunning (see Matt. 28:19). The term translated “nations” also means “Gentiles” (Greek ethnos). In his mortal life, Jesus sends the Seventy among Gentiles in an initial effort to reach out to them'
  - where: 'note 24:47 “Among all nations, beginning at Jerusalem”'
    claim: 'The charge foreshadows the final charge before the ascension (Acts 1:8)'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'foreshadowing his final charge before his ascension (Acts 1:4‒5, 8), the scene closes with Jesus’s charging all present to be his witnesses.'
  - where: 'note 24:47 “Among all nations, beginning at Jerusalem”'
    claim: 'The apostles’ purpose: personal witnesses of the ministry and the corporeal resurrection'
    key: draper-he-has-risen
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/he-has-risen'
    quote: 'This passage reveals the Apostles’ purpose: to be personal witnesses to all of the Lord’s ministry and teachings, and most significantly, to the corporeal resurrection.'
  - where: 'note 24:49 “Endued with power from on high”'
    claim: 'The promise is the Holy Ghost, fulfilled at Pentecost; passive implies the Father as agent'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'This promised manifestation of the Holy Ghost in power, occurring at Pentecost (see Acts 2:1–42) … The passive in this case implies the Father as the agent who endows or clothes with power (see D&C 38:32, 38; 43:16; 95:8).'
  - where: 'note 24:49 “Endued with power from on high”'
    claim: 'D&C 95:9 refers back to this command to tarry at Jerusalem'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'This directive is so significant that the Lord refers in Doctrine and Covenants 95:9 to this former command when instructing Joseph Smith to remain in Kirtland, Ohio'
  - where: 'note 24:49 “Endued with power from on high”'
    claim: 'D&C 95:9: tarry, even as mine apostles at Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/95?lang=eng'
    quote: 'For this is the promise of the Father unto you; therefore I command you to tarry, even as mine apostles at Jerusalem.'
  - where: 'note 24:51 “Carried up into heaven”'
    claim: 'The Gospel’s conclusion limits the appearances to a single day; Acts gives forty days'
    key: sc-knowhy-678
    url: 'https://scripturecentral.org/knowhy/what-might-jesus-have-taught-his-apostles-for-forty-days'
    quote: 'Yet, the conclusion to Luke’s Gospel limits Jesus’s post-Resurrection appearances to just a single day (see Luke 24:13, 34, 36)'
  - where: 'note 24:51 “Carried up into heaven”'
    claim: 'Brown: not the ascension after forty days; different verbs; interim ascent; P75 preserves the phrase'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'Although a few manuscripts omit this expression, the earliest (P75) and all other early texts preserve it. Luke is not describing here the Savior’s ascension that occurs at the end of the forty days … This is an interim ascent.'
  - where: 'note 24:51 “Carried up into heaven”'
    claim: 'Toward Bethany places them on the Mount of Olives, perhaps near the later ascension'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'which places the group somewhere atop the Mount of Olives, perhaps near the place of his later ascension to which this scene seems to point (see Acts 1:9–12).'
  - where: 'note 24:51 “Carried up into heaven”'
    claim: 'About twenty-four hours after the resurrection; “while I was yet with you” marks the partition of mortal and heavenly ministry'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'When Jesus ascends this first time, about twenty-four hours after his resurrection, he effectively separates the era of his mortal ministry from his continuing ministry from heaven. His meaningful words, “while I was yet with you” (24:44), point to this partition'
  - where: 'note 24:51 “Carried up into heaven”'
    claim: 'Matthew and John leave Jesus with His followers; only Luke presents Him ascended, awaiting those who follow'
    key: huntsman-lukes-jesus
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
    quote: 'Thus while these two Gospels leave us with the image of Jesus still present with his followers, only Luke presents him as the Risen Lord ascended into heaven, where he awaits those who will follow him.'
  - where: 'note 24:53 “Continually in the temple”'
    claim: 'Ends where it begins, in the temple (1:9); in Acts in the temple and private dwellings (Acts 2:46)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'Luke’s story ends where it begins, in the temple (see 1:9). … Luke’s next record locates them regularly within the temple grounds and in private dwellings (see Acts 2:46; 3:1; 5:20–21, 42)'
  - where: 'note 24:53 “Continually in the temple”'
    claim: 'Worship of Jesus unprecedented in Luke; joy parallels angelic praise at the birth (2:10–14); heavens opened again to receive Him'
    key: huntsman-lukes-jesus
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
    quote: 'The image of people worshiping Jesus is unprecedented in the Gospel of Luke,[70] but the homage and great joy of the disciples here parallel the angelic praise of the promised Savior in the opening infancy narrative (Luke 2:10–14).'
  - where: 'note 24:53 “Continually in the temple”'
    claim: 'Heaven opened at the birth and opened again to receive Him'
    key: huntsman-lukes-jesus
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
    quote: 'Just as the windows of heaven were opened to welcome the birth of the newborn Son of God, they have opened again to receive him.'
  - where: 'note 24:53 “Continually in the temple”'
    claim: 'Luke 24 provides the certainty (asphaleia) promised in Luke 1:4'
    key: bowen-our-hands-have-handled
    url: 'https://interpreterfoundation.org/journal/our-hands-have-handled-ensuring-the-reassuring-doctrine-of-the-resurrection-in-the-lucan-and-johannine-writings'
    quote: 'Luke 24, more than any other single chapter in Luke’s writings, provides the crux of the asphaleia or “certainty”—the “surety”—that he promised at the beginning of the Gospel of Luke (Luke 1:4).'
  - where: 'note 24:53 “Continually in the temple”'
    claim: 'Luke’s hope that others will come to the same joy'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'Lying amidst these words is Luke’s hope that others will come to the same joy that he previously experiences when he is converted (see 1:4).'
  - where: christ
    claim: 'The Emmaus meal sacramental in character'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'Although the Savior does not speak words that turn the meal into the sacrament, the meal becomes sacramental or holy in character because of who he is'
  - where: christ
    claim: 'We too can meet Jesus in the scriptures and in ordinances, particularly the sacrament'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'the lesson of these “average disciples” for us today is clear: we too can meet Jesus in the scriptures and in the power of ordinances, particularly the sacrament, which recounts the salvific suffering and death of the Lord.'
  - where: explore
    claim: 'KnoWhy 677 on Emmaus: recognizing Christ in the scriptures'
    key: sc-knowhy-677
    url: 'https://scripturecentral.org/knowhy/why-did-christ-appear-to-two-disciples-on-the-road-to-emmaus'
    quote: 'Jesus thereby corrected these false understandings and taught them how to properly recognize Him in the scriptures.'
  - where: 'note 24:5 “Why seek ye the living among the dead?”'
    claim: '“Is risen” (ēgerthē) is passive, “he has been raised”'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'technically the form is passive, “he has been raised.” This may suggest that in the Synoptics Jesus, who had been crucified by men, has been raised by God'
  - where: 'note 24:49 “Endued with power from on high”'
    claim: 'endyō means “to clothe, to put on”; passive “to be clothed”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The verb “to endue” (Greek endyō) means “to clothe, to put on,” … In Luke, the form of the verb is the middle voice with a passive sense, meaning “to be clothed.”'
  - where: 'note 24:34 “Hath appeared to Simon”'
    claim: 'Peter’s wondering may have led to faith sufficient for the risen Lord to appear to him'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'We may reasonably presume that Peter’s “wondering” (24:12) leads him to exercise faith sufficient that the Risen Christ can appear to him.'
  - where: 'note 24:51 “Carried up into heaven”'
    claim: 'No angels attend the first ascension, unlike Acts 1:10–11'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'No such personages are present in the Lord’s first ascension.'
  - where: 'note 24:51 “Carried up into heaven”'
    claim: 'Jesus probably spends the night with the disciples and they leave the city in the morning'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The strong possibility exists that he spends the night with these gathered followers and that together they leave the city early in the morning.'
