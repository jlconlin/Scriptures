chapter: 3
claims:
  - where: when
    claim: 'The fifteenth year of Tiberius falls about AD 27–29'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'Because Tiberius comes to power in AD 14, after the death of Augustus on August 19, the year seems to be AD 29. But variant ways of reckoning calendrical matters tell us that we cannot be more certain than the general period AD 27–29.'
  - where: setting
    claim: 'Brown: Luke frames John’s ministry as a prelude to Jesus’s and as an ending of the Old Testament era'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'Luke carefully frames John’s ministry not only as a prelude to that of Jesus, as we shall see in the content of his preaching and in Jesus’ appeals to John’s activities (see 7:24–28, 33; 16:16; 20:4), but particularly as an ending of the Old Testament era'
  - where: thread
    claim: 'Brown: the chapter’s first and last verses tie John and Jesus to the Roman world and to Adam, so they are real people, not myth'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'by tying Jesus to humankind, specifically to Adam, in the genealogy that he records (see 3:38)—thus the first and last verses of this chapter—Luke places John and Jesus fully and physically within the human sphere of activity.'
  - where: 'note 3:1 “Why Luke dates the call by emperor and tetrarchs”'
    claim: 'The year is uncertain because Tiberius’s reign can be counted from his coregency (AD 11) or his sole rule (AD 14); Luke ties his story to world events'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'we cannot determine its beginning point, whether it is Tiberius’ coregency with Augustus, which begins, according to Velleius Paterculus, in AD 11, or whether it is Tiberius’ accession to sole power soon after the death of Augustus on the 19th of August, AD 14.'
  - where: 'note 3:1 “Why Luke dates the call by emperor and tetrarchs”'
    claim: 'Herod the Great’s kingdom was divided: Antipas had Galilee and Perea, Philip the northeast; Antipas is “Herod the tetrarch”; Abilene was Lysanias’s tetrarchy'
    key: bd-herod
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/herod?lang=eng'
    quote: 'His kingdom was then divided between three of his sons: Archelaus, who received Judea, Idumea, and Samaria; Antipas, who had Galilee and Perea; and Philip, who had the northeast districts of Palestine.'
  - where: 'note 3:2 “The word came to John, not to the high priests”'
    claim: 'Annas was Caiaphas’s father-in-law; only one could serve at a time; a deposed high priest kept the title by courtesy; dates of service'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'Only one person at a time can serve as high priest. But Herod, his son Archelaus, and the Roman governors who succeed them appoint and depose high priests with some regularity. A deposed high priest, of course, continues to assert influence and may be called “high priest” as a matter of courtesy.'
  - where: 'note 3:2 “The word came to John, not to the high priests”'
    claim: 'Brown: setting the high priests beside the revelation to John is purposeful; the word goes to the son of an obscure priest'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'Setting the names of the high priests next to the notice of the divine revelation to the Baptist seems purposeful, underscoring sharply that God’s communiqué does not go to respected religious authorities in Jerusalem, within the halls of power, but far away, to the son of an obscure priest.'
  - where: 'note 3:2 “The word came to John, not to the high priests”'
    claim: 'D&C 84:28: John was ordained at eight days old to overthrow the kingdom of the Jews and make straight the way of the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'was ordained by the angel of God at the time he was eight days old unto this power, to overthrow the kingdom of the Jews, and to make straight the way of the Lord before the face of his people'
  - where: 'note 3:2 “The word came to John, not to the high priests”'
    claim: 'Joseph Smith: John was the only legal administrator holding the keys, and wrested the keys from the Jews'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'John, at that time, was the only legal administrator in the affairs of the kingdom there was then on the earth, and holding the keys of power.'
  - where: 'note 3:2 “The word came to John, not to the high priests”'
    claim: 'Joseph Smith: the son of Zacharias wrested the keys from the Jews by heaven’s decree'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'The son of Zacharias wrested the keys, the kingdom, the power, the glory from the Jews, by the holy anointing and decree of heaven'
  - where: 'note 3:6 “All flesh shall see the salvation of God”'
    claim: 'JST Luke 3:4–11: Christ comes to bring salvation to Israel and the Gentiles, and will come again to judge'
    key: jst-luke-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/3?lang=eng'
    quote: 'Christ will come as prophesied to bring salvation to Israel and to the Gentiles. In the fulness of times, He will come again to judge the world.'
  - where: 'note 3:6 “All flesh shall see the salvation of God”'
    claim: 'JST Luke 3:5–6 wording: salvation to the heathen nations, gathering the lost of Israel, the gospel to the Gentiles'
    key: jst-luke-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/3?lang=eng'
    quote: 'to take away the sins of the world, and to bring salvation unto the heathen nations, to gather together those who are lost, who are of the sheepfold of Israel;'
  - where: 'note 3:6 “All flesh shall see the salvation of God”'
    claim: 'JST Luke 3:10: the leveling of valleys and mountains is in “a day of power”'
    key: jst-luke-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/3?lang=eng'
    quote: 'For it is a day of power; yea, every valley shall be filled, and every mountain and hill shall be brought low'
  - where: 'note 3:8 “We have Abraham to our father”'
    claim: 'JST Luke 3:13 (footnote): “we have kept the commandments of God, and none can inherit the promises but the children of Abraham”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/3?lang=eng'
    quote: 'Abraham is our father; we have kept the commandments of God, and none can inherit the promises but the children of Abraham'
  - where: 'note 3:8 “We have Abraham to our father”'
    claim: 'Bible Dictionary: John rebuked those who used lineage as a substitute for righteousness'
    key: bd-genealogy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genealogy?lang=eng'
    quote: 'John the Baptist rebuked those who put too much emphasis on ancestry and attempted to use lineage as a substitute for righteousness'
  - where: 'note 3:10 “What shall we do then?”'
    claim: 'Publicans farmed or collected taxes, were detested and excommunicated; many in Galilee served Herod; they readily received the gospel'
    key: bd-publicans
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/publicans?lang=eng'
    quote: 'Both classes were detested by the Jews, and any Jew who undertook the work was excommunicated. Many of the tax-gatherers in Galilee would be in the service of Herod and not of Rome.'
  - where: 'note 3:13 “The publicans and the treasury”'
    claim: 'JST Luke 3:19–20 text: the treasury custom for the poor; the publicans did likewise'
    key: jst-luke-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/3?lang=eng'
    quote: 'For it is well known unto you, Theophilus, that after the manner of the Jews, and according to the custom of their law in receiving money into the treasury, that out of the abundance which was received, was appointed unto the poor, every man his portion;'
  - where: 'note 3:13 “The publicans and the treasury”'
    claim: 'JST Luke 3:20 text'
    key: jst-luke-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/3?lang=eng'
    quote: 'And after this manner did the publicans also, wherefore John said unto them, Exact no more than that which is appointed you.'
  - where: 'note 3:14 “The soldiers’ temptations”'
    claim: 'Thayer: sykophanteō in Luke 3:14 means to exact money wrongfully, to extort'
    key: thayer
    url: 'https://biblehub.com/greek/4811.htm'
    quote: '2. to exact money wrongfully; to extort from, defraud: Luke 3:14 (here R. V. margin accuse wrongfully)'
  - where: 'note 3:16 “Water, and the Holy Ghost and fire”'
    claim: 'Joseph Smith: water baptism without the baptism of fire and the Holy Ghost is of no use'
    key: tpjs-2007-ch-7
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-7?lang=eng'
    quote: '“The baptism of water, without the baptism of fire and the Holy Ghost attending it, is of no use; they are necessarily and inseparably connected.”'
  - where: 'note 3:20 “John in prison before the baptism”'
    claim: 'Antipas took Herodias, the wife of his half-brother Philip; he was deposed in AD 39'
    key: bd-herod
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/herod?lang=eng'
    quote: 'He took as his wife Herodias, the wife of his half-brother Philip. He was deposed by the Emperor Caligula and banished to Lugdunum in Gaul, A.D. 39.'
  - where: 'note 3:20 “John in prison before the baptism”'
    claim: 'Brown: Luke tells the imprisonment first, then the baptism, and does not mention that John performed it'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'In fact, in the preserved texts, Luke does not even mention that John performs Jesus’ baptism, though he implies it. Joseph Smith sees the difficulty and, as we have noted, makes an adjustment'
  - where: 'note 3:20 “John in prison before the baptism”'
    claim: 'JST Luke 3:28 adds “Jesus also came unto John: and being baptized of him”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'The Joseph Smith Translation, however, makes visible the tie between Jesus and John that Luke’s text does not by adding six words: “Jesus also came unto John: and being baptized of him” (JST 3:28; emphasis added).'
  - where: 'note 3:22 “In a bodily shape like a dove”'
    claim: 'Brown: only Luke notes the bodily shape; the Holy Ghost does not appear as a bird; only Nephi elsewhere compares the Spirit to a dove'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'Only Luke notes the “bodily shape,” imputing physical characteristics to the Holy Ghost, though he does not appear as a bird.'
  - where: 'note 3:22 “In a bodily shape like a dove”'
    claim: 'Joseph Smith: the Holy Ghost is a personage, cannot be transformed into a dove; the sign of the dove given to John'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'The Holy Ghost cannot be transformed into a dove; but the sign of a dove was given to John to signify the truth of the deed, as the dove is an emblem or token of truth and innocence.'
  - where: 'note 3:22 “In a bodily shape like a dove”'
    claim: 'Joseph Smith: the sign of the dove instituted before the creation; the devil cannot come in it'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'The sign of the dove was instituted before the creation of the world, a witness for the Holy Ghost, and the devil cannot come in the sign of a dove. The Holy Ghost is a personage, and is in the form of a personage.'
  - where: 'note 3:22 “Thou art my beloved Son”'
    claim: 'Brown: “Thou art” addresses the Son directly, as in Mark; Matthew’s form seems intended for all present'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'The Father is addressing the Son directly and thus the words are intended for him alone, not bystanders. This form of the Father’s words agrees with that in Mark 1:11, whereas that in Matthew seems intended for all present'
  - where: 'note 3:22 “Thou art my beloved Son”'
    claim: 'Brown: “beloved” of a son means “only”; Western manuscripts add “This day have I begotten thee” from Psalm 2:7'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'When the term “beloved” is applied to a son or daughter, it means “only.”94 Interestingly, manuscripts from the Western textual family include the interesting addition, “This day have I begotten thee,” likely an addition resting on Psalm 2:7.'
  - where: 'note 3:22 “Thou art my beloved Son”'
    claim: 'KnoWhy #865: the scribal change shows ancient readers heard Psalm 2’s king; two meanings, literal Son and true king'
    key: sc-knowhy-865
    url: 'https://scripturecentral.org/knowhy/why-does-god-declare-jesus-to-be-his-son'
    quote: 'This presents the possibility that Jesus’ declaration of God’s son could have two meanings: Jesus is the literal only begotten son of God in the flesh, but He is also the true king of Israel.'
  - where: 'note 3:23 “About thirty years of age”'
    claim: 'Brown: only Luke dates the beginning of Jesus’s ministry'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'Luke’s note alone establishes the beginning of Jesus’ ministry. According to Numbers 4:3, when a descendant of Aaron reaches thirty years of age, all things being settled, he is then permitted to officiate at the temple'
  - where: 'note 3:23 “About thirty years of age”'
    claim: 'Brown: the JST adds “having lived with his father,” implying Joseph lived to the start of the ministry'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'the Joseph Smith Translation adds a brief phrase immediately after “thirty years of age” that radiates some light onto Jesus’ life just prior to his ministry, “having lived with his father,” implying that Joseph lives long enough to see the beginning of Jesus’ public ministry (JST 3:30).'
  - where: 'note 3:23 “As was supposed, and the son of Heli”'
    claim: 'Brown: Luke writes “as was supposed” because Jesus is not Joseph’s literal son; the JST reads “as was supposed of the world”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'Luke’s purpose in writing this expression grows out of his knowledge that Jesus is not the literal son of Joseph (see 1:35). The Joseph Smith Translation expands this parenthetical statement so that it reads “as was supposed of the world” (JST 3:30; emphasis added)'
  - where: 'note 3:23 “As was supposed, and the son of Heli”'
    claim: 'Bible Dictionary: probable explanation, Matthew a legal descent and Luke a natural descent'
    key: bd-genealogy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genealogy?lang=eng'
    quote: 'The probable explanation is that the descent may be traced through two different lines. Matthew gives a legal descent and includes several adopted children, such adoption carrying with it legal rights, while Luke gives a natural descent through actual parentage.'
  - where: 'note 3:23 “As was supposed, and the son of Heli”'
    claim: 'Brown: the theory that Luke gives Mary’s line has no support in the Greek “son” and is first attested in 1490'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'though no hint exists in Luke’s words that would expressly lead to this conclusion because the Greek word for “son” (huios) is never attested as meaning “son-in-law.”'
  - where: 'note 3:23 “As was supposed, and the son of Heli”'
    claim: 'Brown: the JST reads “who was from the loins of Heli,” making Heli Joseph’s biological father'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'In an unusual adjustment, the Joseph Smith Translation renders this expression “who was from the loins of Heli” (JST 3:30).'
  - where: 'note 3:23 “As was supposed, and the son of Heli”'
    claim: 'Brown: the third theory (Matthew the royal legal heirs, Luke the biological line) is the one the JST matches; how far Joseph Smith considered it is unclear'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'Of the three theories, the Joseph Smith Translation would match only the third, and chiefly because it holds that Heli is the biological father of Joseph. Other elements are open to question because it is not fully clear how deeply Joseph Smith thought about the matter'
  - where: 'note 3:23 “As was supposed, and the son of Heli”'
    claim: 'Brown: the third theory: Matthew lists the legal heirs of David, Luke the biological line'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'A third hypothesis holds that Matthew repeats the legal descent from David, that is, those who would have been kings if the monarchy had continued, and Luke preserves the biological line from which Jesus actually descends.'
  - where: 'note 3:23 “As was supposed, and the son of Heli”'
    claim: 'Brown: Matthew follows the kingly line through Solomon, Luke through Nathan'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'Matthew follows Jesus’ descent from David through the kingly line, beginning with Solomon, but Luke traces the Savior’s progenitors through Nathan, another son of David.'
  - where: 'note 3:36 “The second Cainan”'
    claim: 'The Septuagint of Genesis 11:12–13 has Cainan between Arphaxad and Sala'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/genesis/11.htm'
    quote: 'And Cainan lived a hundred and thirty years and begot Sala'
  - where: 'note 3:38 “Adam, which was the son of God”'
    claim: 'JST Luke 3:45 (footnote): “who was formed of God, and the first man upon the earth”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/3?lang=eng'
    quote: 'who was formed of God, and the first man upon the earth.'
  - where: 'note 3:38 “Adam, which was the son of God”'
    claim: 'Brown: the JST stresses Adam’s dependence on God’s creation and his place as first man, and lessens an implied biological link'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'Correspondingly, the emphasis in Luke’s text on Adam’s implied biological connection to God, and thus Jesus’ connection, is diminished in Joseph Smith’s rendition.'
  - where: 'note 3:38 “Adam, which was the son of God”'
    claim: 'Bible Dictionary: Luke’s genealogy ascends to Adam and to God, his Gospel being written for the world in general'
    key: bd-genealogy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genealogy?lang=eng'
    quote: 'while that in Luke 3:23–38 ascends from Jesus to Adam, and to God, this Gospel being written for the world in general.'
  - where: 'note 3:38 “Adam, which was the son of God”'
    claim: 'Huntsman: the Father’s proclamation at the baptism (3:22) is reinforced by the genealogy’s last entry (3:38)'
    key: huntsman-lukes-jesus
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
    quote: 'the surest source of this knowledge is from God himself, who proclaims Jesus his beloved Son at the baptism (Luke 3:22), a point which Luke reinforces with the final entry in Jesus’s genealogy (3:38).'
  - where: 'note 3:38 “Adam, which was the son of God”'
    claim: 'Brown: the genealogy to Adam shows Jesus fully within the human family'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'This continuum gains more prominence through the ensuing genealogy wherein Jesus is said to be a descendant of Adam (see 3:38). Luke seeks to make plain that Jesus stands fully within the human family'
  - where: 'note 3:1 “Why Luke dates the call by emperor and tetrarchs”'
    claim: 'Archelaus was deposed and Judea was governed by a prefect under Syria'
    key: bd-herod
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/herod?lang=eng'
    quote: 'After a reign of nine years Archelaus was deposed by Augustus, and Judea was attached to the Roman province of Syria, being governed by a prefect.'
  - where: 'note 3:2 “The word came to John, not to the high priests”'
    claim: 'Annas served AD 6–15; Caiaphas AD 18–36'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'Annas, who serves from AD 6 to 15, remains an influential figure after his deposition, seeing several of his sons and sons-in-law serve as high priest. Caiaphas holds the position from AD 18 to 36'
  - where: 'note 3:10 “What shall we do then?”'
    claim: 'Publicans readily received the gospel'
    key: bd-publicans
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/publicans?lang=eng'
    quote: 'There are many references in the New Testament to the readiness with which the publicans received the gospel'
  - where: 'note 3:10 “What shall we do then?”'
    claim: 'Publicans bought or farmed the taxes, or collected them'
    key: bd-publicans
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/publicans?lang=eng'
    quote: 'Men who bought or farmed the taxes under the Roman government were called publicani. The name is also used to describe those who actually collected the money'
  - where: 'note 3:21 “Praying, the heaven was opened”'
    claim: 'Nephi: though holy, Jesus humbled himself before the Father and set the example'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/31?lang=eng'
    quote: 'And again, it showeth unto the children of men the straitness of the path, and the narrowness of the gate, by which they should enter, he having set the example before them.'
  - where: 'note 3:22 “Thou art my beloved Son”'
    claim: 'KnoWhy #865: some scribes changed Luke 3:22 to match Psalm 2, showing readers connected it with kingship'
    key: sc-knowhy-865
    url: 'https://scripturecentral.org/knowhy/why-does-god-declare-jesus-to-be-his-son'
    quote: 'Scholars are sure ancient readers connected Luke 3:22 to the verse about kingship in Psalm 2 because some scribes accidentally changed the text of Luke to match Psalm 2.'
  - where: 'note 3:22 “Thou art my beloved Son”'
    claim: 'Brown: the Father uses “beloved son” when introducing His Son on special occasions (transfiguration, 3 Ne. 11:7, JS—H 1:17)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'This title always comes on the lips of the Father when he introduces his son on special occasions.'
  - where: 'note 3:23 “As was supposed, and the son of Heli”'
    claim: 'Bible Dictionary: Luke has more names than Matthew in both stretches, and nearly all differ'
    key: bd-genealogy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genealogy?lang=eng'
    quote: 'Luke gives 17 generations between Zerubbabel and Joseph, and Matthew only 9; moreover, nearly all the names are different.'
  - where: 'note 3:23 “As was supposed, and the son of Heli”'
    claim: 'Brown: the JST leaves Matthew’s “Jacob begat Joseph” to stand'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'In his inspired review of the New Testament Gospels, Joseph Smith allows Matthew’s language to stand: “Jacob begat Joseph the husband of Mary” (Matt. 1:16; JST Matt. 1:4).'
  - where: 'note 3:36 “The second Cainan”'
    claim: 'The Hebrew of Genesis 11:12 has Arphaxad beget Shelah (Salah), with no Cainan'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'שָֽׁלַח'
  - where: 'note 3:6 “All flesh shall see the salvation of God”'
    claim: 'JST Luke 3:6: to make possible the preaching of the gospel unto the Gentiles'
    key: jst-luke-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/3?lang=eng'
    quote: 'Yea, even the dispersed and afflicted; and also to prepare the way, and make possible the preaching of the gospel unto the Gentiles;'
  - where: 'note 3:14 “The soldiers’ temptations”'
    claim: 'The footnote at 3:14 glosses “falsely” from the Greek as “for extortion”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/3?lang=eng'
    quote: 'for extortion'
  - where: 'note 3:36 “The second Cainan”'
    claim: 'The Septuagint of Genesis 11:12: Arphaxad begot Cainan'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/genesis/11.htm'
    quote: 'And Arphaxad lived a hundred and thirty-five years, and begot Cainan.'
  - where: 'note 3:1 “Why Luke dates the call by emperor and tetrarchs”'
    claim: 'Ellicott: naming the rulers of every region follows the practice of regular historians'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/3.htm'
    quote: 'The opening of the main narrative is characteristic of St. Luke’s desire to follow in the footsteps of regular historians, and to name the rulers of any regions that were affected, directly or indirectly, by the events which he narrates.'
  - where: 'note 3:1 “Why Luke dates the call by emperor and tetrarchs”'
    claim: 'Ellicott: Tiberius succeeded Augustus in AD 14, giving AD 29'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/3.htm'
    quote: 'He had succeeded Augustus A.D. 14, so that we get the date A.D. 29 for the commencement of the Baptist’s ministry.'
  - where: 'note 3:1 “Why Luke dates the call by emperor and tetrarchs”'
    claim: 'Bible Dictionary: Pilate was Roman prefect in Judea AD 26–36'
    key: bd-pilate
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pilate?lang=eng'
    quote: 'Roman prefect in Judea, A.D. 26–36 (Luke 3:1).'
  - where: 'note 3:6 “All flesh shall see the salvation of God”'
    claim: 'Ellicott: Luke’s fuller citation suggests he saw the prophecy fulfilled in the Baptist’s ministry; the imagery is a road leveled for a king'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/3.htm'
    quote: 'The fuller citation by St. Luke, as compared with the other Gospels, is interesting, and suggests the thought that he was led to see in the manifold aspects of the Baptist’s ministry a fulfilment of this part of the prophecy.'
  - where: 'note 3:6 “All flesh shall see the salvation of God”'
    claim: 'Ellicott: valleys filled, hills brought low, crooked made straight in John’s ministry; pioneers leveling a road for a great king'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/3.htm'
    quote: 'the “crooked made straight” when Publicans learnt to be honest; the “rough places smooth” when soldiers were taught to do violence to no man. The imagery is, of course, taken from the work of pioneers levelling a road for the march of a great king.'
  - where: 'note 3:6 “All flesh shall see the salvation of God”'
    claim: 'Huntsman: Luke is generally assumed a Greek writing for a largely Gentile audience; his Gospel is marked by universalism'
    key: huntsman-lukes-jesus
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
    quote: 'Generally assumed to have been a Greek writing for a largely Gentile audience, this Gospel is characterized by both universalism—or the import of Jesus and his work for all peoples'
  - where: 'note 3:6 “All flesh shall see the salvation of God”'
    claim: 'Millet: the JST insertion (five verses) bridges the first and second comings and lays a foundation for the gospel reaching those outside Israel'
    key: millet-jst-synoptic
    url: 'https://rsc.byu.edu/joseph-smith-translation/jst-synoptic-gospels'
    quote: 'the Prophet adds five verses (175 words), which insertion not only provides a meaningful transition between verses 4 and 5 in the Authorized Version (and thus a doctrinal bridge between the first and second comings of the Christ), but also lays a foundation for the concept that the spread of the gospel will even encompass those outside of the house of Israel.'
  - where: 'note 3:8 “We have Abraham to our father”'
    claim: 'Ellicott: the boast seems to have been common (John 8:33–39), tied to the belief that descent, alone or with the creed, ensured admission into Paradise'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/3.htm'
    quote: 'The boast seems to have been common, as in John 8:33-39, and was connected with the belief that this alone, or taken together with the confession of the creed of Israel “the Lord our God is one Lord” (Deuteronomy 6:4), would be enough to ensure for every Jew an admission into Paradise.'
  - where: 'note 3:8 “We have Abraham to our father”'
    claim: 'JST Matthew 3:36: “we only have power to bring seed unto our father Abraham”'
    key: jst-matt-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/3?lang=eng'
    quote: 'And think not to say within yourselves, We are the children of Abraham, and we only have power to bring seed unto our father Abraham; for I say unto you that God is able of these stones to raise up children into Abraham.'
  - where: 'note 3:8 “We have Abraham to our father”'
    claim: 'The JST appendix summary: God can make covenant people of those not of Israel'
    key: jst-matt-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/3?lang=eng'
    quote: 'Those who rejected the message of John the Baptist rejected Christ. God can make covenant people of those not of Israel.'
  - where: 'note 3:10 “What shall we do then?”'
    claim: 'Ellicott: the questions are peculiar to Luke; John’s work was more than preaching repentance; confession followed by guidance for the conscience'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/3.htm'
    quote: 'The questions that follow are peculiar to St. Luke. They are interesting as showing that the work of the Baptist was not that of a mere preacher of repentance. Confession of sins followed naturally on the part of the penitents; that was followed, as naturally, by guidance for the conscience.'
  - where: 'note 3:10 “What shall we do then?”'
    claim: 'Ellicott: selfishness the root of evil, conquered by acts of unselfishness'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/3.htm'
    quote: 'Selfishness was the root of evil. It was to be conquered not by religious emotions only, but by acts of unselfishness.'
  - where: 'note 3:10 “What shall we do then?”'
    claim: 'Ellicott: “meat” is plural, all forms of food'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/3.htm'
    quote: 'The Greek noun is plural, and includes all forms of food.'
  - where: 'note 3:10 “What shall we do then?”'
    claim: 'Ellicott: under the farming system, over-collecting was the besetting temptation of collectors'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/3.htm'
    quote: 'Under the “farming” system of taxation adopted by the Roman empire, this was the besetting temptation of all collectors employed in it'
  - where: 'note 3:10 “What shall we do then?”'
    claim: 'The footnote on “coats” (3:11) gives Mosiah 4:16 and D&C 104:18'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/3?lang=eng'
    quote: 'Mosiah 4:16; D&C 104:18 (14–18).'
  - where: 'note 3:13 “The publicans and the treasury”'
    claim: 'The JST appendix summary: the poor cared for from the treasury; publicans take no more than appointed by law'
    key: jst-luke-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/3?lang=eng'
    quote: 'The poor are cared for from the treasury’s abundance. Publicans (tax collectors) should take no more than is appointed by law.'
  - where: 'note 3:13 “The publicans and the treasury”'
    claim: 'Millet: the JST of Luke adds cultural explanations for Gentiles less familiar with Jewish ways, as at JST Luke 3:19–20'
    key: millet-jst-synoptic
    url: 'https://rsc.byu.edu/joseph-smith-translation/jst-synoptic-gospels'
    quote: 'We find in the JST of Luke additional cultural explanations—insights which might be given to Gentiles perhaps less familiar with living patterns of the Jews.'
  - where: 'note 3:13 “The publicans and the treasury”'
    claim: 'Millet: Theophilus was a Gentile friend to whom Luke wrote'
    key: millet-jst-synoptic
    url: 'https://rsc.byu.edu/joseph-smith-translation/jst-synoptic-gospels'
    quote: 'Luke is writing specifically to a gentile friend, Theophilus (see Acts 1:1; JST Luke 3:19–20), but generally to a broad gentile audience.'
  - where: 'note 3:14 “The soldiers’ temptations”'
    claim: 'Ellicott: no article and a participle, “soldiers as they were marching”; probably Antipas’s troops; Roman soldiers unlikely'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/3.htm'
    quote: 'The Greek word has not the definite article, and is a participle. Better, and soldiers, as they were marching. The words probably point to the troops of Antipas'
  - where: 'note 3:14 “The soldiers’ temptations”'
    claim: 'Ellicott: Roman soldiers were not likely to come to John'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/3.htm'
    quote: 'Roman soldiers were not likely to have come to the Baptist’s preaching.'
  - where: 'note 3:14 “The soldiers’ temptations”'
    claim: 'Ellicott: the word for “do violence” was applied to irregular troops extorting money or provisions'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/3.htm'
    quote: 'was applied to the violence which was used by irregular troops to extort money or provisions.'
  - where: 'note 3:14 “The soldiers’ temptations”'
    claim: 'Ellicott: the word for “accuse falsely” recurs in Zacchaeus’s confession (19:8)'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/3.htm'
    quote: 'Neither accuse any falsely.—The word occurs again in the confession of Zacchæus (Luke 19:8).'
  - where: 'note 3:14 “The soldiers’ temptations”'
    claim: 'Thayer: opsōnion, properly rations given in place of pay and the money in which a soldier is paid (Luke 3:14)'
    key: thayer
    url: 'https://biblehub.com/greek/3800.htm'
    quote: 'properly, that part of a soldier''s support given in place of pay (i. e. rations) and the money in which he is paid'
  - where: 'note 3:20 “John in prison before the baptism”'
    claim: 'Ellicott: Luke deliberately completes the Baptist’s account here rather than bring in the imprisonment later'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/3.htm'
    quote: 'St. Luke’s anticipation of the close of the Baptist’s history supplies a curious instance of an arrangement which was obviously deliberate. It seemed to him better to complete the account of the Baptist’s ministry here than to bring in the account of the imprisonment as an episode later on.'
  - where: 'note 3:20 “John in prison before the baptism”'
    claim: 'Strathearn and Judd: in Mark and Matthew the imprisonment comes after the baptism; logic favors their chronology'
    key: strathearn-gospels
    url: 'https://rsc.byu.edu/vol-8-no-2-2007/distinctive-testimonies-four-gospels'
    quote: 'In Mark and Matthew, the imprisonment takes place some time after the baptism (Mark 6:17–29; Matthew 14:3–12). In this instance, logic favors the chronology presented by Mark and Matthew over that of Luke.'
  - where: 'note 3:21 “Praying, the heaven was opened”'
    claim: 'Ellicott: Luke’s baptism account is the shortest but adds that Jesus was praying, as at the Transfiguration, at the divine attestation of His Sonship'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/3.htm'
    quote: 'St. Luke’s account is the shortest of the three first Gospels, but it adds here, as afterwards in his report of the Transfiguration, the fact that our Lord was “praying” at the time of the divine attestation to His Sonship.'
  - where: 'note 3:21 “Praying, the heaven was opened”'
    claim: '2 Nephi 31:7: though holy, He humbled Himself before the Father according to the flesh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/31?lang=eng'
    quote: 'But notwithstanding he being holy, he showeth unto the children of men that, according to the flesh he humbleth himself before the Father'
  - where: 'note 3:23 “About thirty years of age”'
    claim: 'Ellicott: Levites entered on their full work at thirty after probation from twenty-five; no age fixed for priest or prophet; thirty the completeness of manhood; Jesus waited in patient humility'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/3.htm'
    quote: 'At this age the Levites entered on their full work (Numbers 4:23; Numbers 4:30; Numbers 4:35), a kind of probationary period beginning at twenty-five (Numbers 8:24)'
  - where: 'note 3:23 “About thirty years of age”'
    claim: 'Ellicott: thirty the age of complete manhood; Jesus waited in patient humility'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/3.htm'
    quote: 'No age was fixed for the beginning of the priesthood, nor of the prophet’s work; but it may fairly be inferred that thirty was looked on as the time when manhood reached its completeness, and we may therefore believe that our Lord waited in patient humility'
  - where: 'note 3:23 “About thirty years of age”'
    claim: 'The footnote on “thirty” gives Numbers 4:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/3?lang=eng'
    quote: 'Num. 4:3 (3, 47).'
  - where: 'note 3:23 “As was supposed, and the son of Heli”'
    claim: 'Ellicott: three explanations: adoption, a levirate marriage of a dead brother’s widow, or Mary’s line with Jesus the heir of Heli; Ellicott prefers the last'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/3.htm'
    quote: 'one of the two brothers may have died without issue, and the other married his widow to raise up seed unto his brother'
  - where: 'note 3:23 “As was supposed, and the son of Heli”'
    claim: 'Ellicott: the view that Luke gives Mary’s genealogy, with Jesus the heir of Heli, seems to him more probable'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/3.htm'
    quote: 'A third and, as it seems to the present writer, more probable view is, that we have here the genealogy, not of Joseph, but of Mary'
  - where: 'note 3:23 “As was supposed, and the son of Heli”'
    claim: 'Ellicott: the first explanation, Joseph the son of one by birth and of the other by adoption'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/3.htm'
    quote: '(a) Joseph may have been the son of Jacob by birth, and of Heli by adoption, or conversely.'
  - where: 'note 3:23 “As was supposed, and the son of Heli”'
    claim: 'Deuteronomy 25:5–6: the brother of a man who dies childless marries his widow, and the firstborn succeeds in the dead brother’s name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/25?lang=eng'
    quote: 'her husband’s brother shall go in unto her, and take her to him to wife'
