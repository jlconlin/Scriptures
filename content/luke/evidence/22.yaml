    url: 'https://biblehub.com/commentaries/ellicott/luke/22.htm'
    quote: 'St. Paul and St. Luke agree in placing the giving of the cup “after they had supped.”'
  - where: 'note 22:21 “The betrayer at the table”'
    claim: 'Luke places the betrayal after the institution, Matthew and Mark before; John leaves it open'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/22.htm'
    quote: 'St. Luke placing the mention of the Betrayal after, St. Matthew and St. Mark before, the institution of the memorial. St. John, who makes no mention of the institution, leaves the question open.'
  - where: 'note 22:21 “The betrayer at the table”'
    claim: 'Whether Judas partook cannot be said for certain; on Matthew’s and Mark’s order he probably did not'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/22.htm'
    quote: 'The date before us do not enable us to say with certainty whether Judas partook of the memorial; but, if we follow the first two Gospels, it would seem probable that he did not.'
  - where: 'note 22:21 “The betrayer at the table”'
    claim: 'Horizō: to mark out boundaries; to determine, decree; Luke 22:22 and Acts 2:23'
    key: thayer
    url: 'https://biblehub.com/greek/3724.htm'
    quote: 'passive ὡρισμένος, ''determinate,'' settled, Acts 2:23; τό ὡρισμένον, that which hath been determined, according to appointment, decree, Luke 22:22'
  - where: 'note 22:21 “The betrayer at the table”'
    claim: 'The word is characteristic of Luke, as at Acts 2:23'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/22.htm'
    quote: 'The word is eminently characteristic of St. Luke. (Comp. Acts 2:23; Acts 10:42; Acts 17:26; Acts 17:31.)'
  - where: 'note 22:21 “The betrayer at the table”'
