    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Restoration scripture and teaching both confirm the reliability of these verses and expand upon their significance.'
  - where: 'note 22:44 “As it were great drops of blood”'
    claim: 'The agony is read as the strain of an athlete or warrior before the contest'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Jesus was experiencing the kind of anxiety that an athlete experienced before a competition or a warrior before a conflict'
