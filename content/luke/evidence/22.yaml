    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'The apostles had to be prepared to meet a new order of things, new conditions and new exigencies; persecution awaited them, and they were soon to be bereft of the Master’s sustaining presence.'
  - where: 'note 22:36 “Buy a sword”'
    claim: 'Purse and scrip counsel prudence instead of the earlier simple trust'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/22.htm'
    quote: 'They would have seemed to counsel the prudence which provides for want, instead of a simple trust, as before, in the providence of God'
  - where: 'note 22:36 “Buy a sword”'
    claim: 'Matthew 26:52 shows the sword was not for His defense, nor likely for theirs as they preached'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/22.htm'
    quote: 'Our Lord’s words to Peter (Matthew 26:52) show that the disciples were not meant to use it in His defence. It is not likely that He would teach them to use it in their own, as they preached the gospel of the Kingdom.'
  - where: 'note 22:36 “Buy a sword”'
    claim: 'Isaiah 53’s righteous sufferer seems to have been in His mind all along as the one He had to fulfill'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/22.htm'
    quote: 'The distinct reference to the words of Isaiah 53:12 is remarkable as showing that the picture of the righteous sufferer in that chapter had all along been present, if we may so speak, to our Lord’s thoughts as that which He Himself had to realise.'
  - where: 'note 22:36 “Buy a sword”'
    claim: 'He was to be hurried to death as a malefactor among malefactors'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/22.htm'
    quote: 'hurried as a malefactor, with other malefactors, to the death of the rebel or the robber.'
  - where: 'note 22:36 “Buy a sword”'
    claim: 'His disciples would be regarded as devotees of an executed criminal'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'The Lord was soon to be numbered among the transgressors, as had been foreseen; and His disciples would be regarded as the devotees of an executed criminal.'
  - where: 'note 22:36 “Buy a sword”'
    claim: 'Some took the words literally; “It is enough” means “Enough of this”; no need of weapons, not for His defense'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'Jesus answered with curt finality, “It is enough,” or as we might say, “Enough of this.” He had not intimated any immediate need of weapons, and most assuredly not for His own defense.'
  - where: 'note 22:36 “Buy a sword”'
    claim: 'Some caught at the literal meaning'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'In the mention of purse, scrip, shoes, and sword, some of the brethren caught at the literal meaning'
  - where: 'note 22:36 “Buy a sword”'
    claim: 'They failed to grasp His meaning, but experience would teach them'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'Again they had failed to fathom His meaning; but experience would later teach them.'
  - where: 'note 22:42 “This cup”'
    claim: 'In 3 Nephi He first calls it the bitter cup; Alma used the phrase of the consequence of sin'
    key: sc-knowhy-341
    url: 'https://scripturecentral.org/knowhy/what-can-we-learn-from-the-saviors-first-words-at-bountiful'
    quote: 'It is here, speaking to the Nephites and Lamanites, however, that He first calls it the “bitter cup.” Alma had previously spoken of “a bitter cup” that the wicked have to drink as part of the consequence for sin (Alma 40:26).'
  - where: 'note 22:42 “This cup”'
    claim: 'He drank the consequences of sin for all, so the repentant need not'
    key: sc-knowhy-341
    url: 'https://scripturecentral.org/knowhy/what-can-we-learn-from-the-saviors-first-words-at-bountiful'
    quote: 'The Savior suffered the consequences of sin (drank the “bitter cup”) on behalf of all, so that those who repent may not have to drink of the bitter cup themselves.'
  - where: 'note 22:42 “This cup”'
    claim: 'Alma 40:26, the bitter cup of the wicked'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/40?lang=eng'
    quote: 'and they drink the dregs of a bitter cup.'
  - where: 'note 22:42 “This cup”'
    claim: 'The prayer echoes the Lord’s Prayer; the request is explicitly subject to “Thy will be done”'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/22.htm'
    quote: 'Here there is a more distinct echo of the prayer which He had taught His disciples.'
  - where: 'note 22:42 “This cup”'
    claim: 'The condition is explicit now, always implicit'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/22.htm'
    quote: 'that prayer was subject, now explicitly, as at all times implicitly, to the antecedent condition that it was in harmony with “Thy will be done.”'
  - where: 'note 22:53 “Your hour, and the power of darkness”'
    claim: 'Surrendering unresistingly, His question protested the night seizure'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'But, though surrendering Himself unresistingly, Jesus was not unmindful of His rights; and to the priestly officials, chief priests, captain of the temple guard, and elders of the people who were present, He voiced this interrogative protest against the illegal night seizure'
  - where: 'note 22:53 “Your hour, and the power of darkness”'
    claim: 'The words are Luke’s alone; the phrase meets Colossians 1:13 and the thought John 14:30'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/22.htm'
    quote: 'The words are peculiar to St. Luke in this connection, but they present a point of coincidence, (1) as regards the phrase, with St. Paul (Colossians 1:13); and (2) as regards the thought, with St. John (John 14:30).'
  - where: 'note 22:53 “Your hour, and the power of darkness”'
    claim: 'Calling the power darkness, He claims to be the Light'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/22.htm'
    quote: 'In identifying the power that worked through human instruments against Him with darkness, our Lord virtually claims to be Himself the Light (John 8:12).'
  - where: 'note 22:53 “Your hour, and the power of darkness”'
    claim: 'Colossians 1:13, delivered from the power of darkness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/col/1?lang=eng'
    quote: 'Who hath delivered us from the power of darkness, and hath translated us into the kingdom of his dear Son:'
  - where: 'note 22:70 “Ye say that I am”'
    claim: '“Thou hast said” meant “I am what thou hast said,” an avowal of divine parentage'
    key: talmage-jesus-christ-34
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-34?lang=eng'
    quote: 'This expression “Thou hast said” was equivalent to—I am what thou hast said. It was an unqualified avowal of divine parentage, and inherent Godship.'
  - where: 'note 22:70 “Ye say that I am”'
    claim: 'The answer is complete and implies the confession that He was what they asked'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/22.htm'
    quote: 'The answer is complete in itself; but it implies, as in the less ambiguous forms in St. Matthew and St. Mark, the confession that He actually was what they had asked Him.'
  - where: 'note 22:70 “Ye say that I am”'
    claim: 'Only Luke has the whole council ask'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/22.htm'
    quote: 'The question, as asked by the whole company of priests and elders, is given only by St. Luke. It apparently followed, as a spontaneous cry of indignant horror'
  - where: 'note 22:70 “Ye say that I am”'
    claim: 'The “I am” has something of its significance in John 8:58'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/22.htm'
    quote: 'The “I am” has something of the same significance as in John 7:24-25; John 8:58 (where see Notes).'
  - where: 'note 22:70 “Ye say that I am”'
    claim: 'The Greek ends with egō eimi'
    key: greek-nt
    url: 'https://biblehub.com/texts/luke/22-70.htm'
    quote: 'Ὑμεῖς λέγετε ὅτι ἐγώ εἰμι.'
  - where: 'note 22:70 “Ye say that I am”'
    claim: 'Verse 68 refers to the question about David’s Lord they could not answer'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/22.htm'
    quote: 'The first clearly refers to the question which He had so recently put to priests and scribes, whether the Christ was the son of David only, or also the Lord of David; and which they had been unable to answer'
  - where: 'note 22:70 “Ye say that I am”'
    claim: 'The footnote glosses “Hereafter” as from now on'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/22?lang=eng'
    quote: 'GR From now on'
  - where: 'note 22:70 “Ye say that I am”'
    claim: 'Luke has “shall be sitting,” not “ye shall see”: even in suffering He is glorified; the cross His throne'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/22.htm'
    quote: 'Not “ye shall see,” but simply “shall be sitting,” as though the dominant thought in St. Luke’s mind in reporting the words was that even in the agony and death that were so soon to come on Him, our Lord found Himself glorified (John 12:23). The Cross was-His Throne'
