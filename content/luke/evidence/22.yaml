    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/22.htm'
    quote: 'The cup was probably the first of the three cups of wine, or wine mingled with water, which Jewish custom had added to the ritual of the Passover. As being a distinct act from that of Luke 22:20'
  - where: 'note 22:17 “Two cups”'
