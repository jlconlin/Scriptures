    url: 'https://biblehub.com/commentaries/ellicott/luke/22.htm'
    quote: 'The Lord had actually on that very evening been among them, “as he that serveth,” girded, like a slave, with the linen towel, and washing the feet of the disciples.'
  - where: 'note 22:27 “As he that serveth”'
    claim: 'The footnote at verse 26 gives Mosiah 2:18'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/22?lang=eng'
