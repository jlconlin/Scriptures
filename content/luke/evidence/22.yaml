    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'The pronouncing of a blessing by the host upon a cup of wine, which was afterward passed round the table to each participant in turn, was the customary manner of beginning the Passover supper.'
  - where: 'note 22:17 “Two cups”'
    claim: 'Jesus appears to have kept the essentials of the Passover'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
