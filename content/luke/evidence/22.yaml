chapter: 22
claims:
  # ---- setting, thread
  - where: setting
    claim: 'In the devotional chronology the events of Jesus’s last evening fall on Thursday'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'The events of the last evening of Jesus’s life, which in our devotional chronology occurred on Thursday'
  - where: setting
    claim: 'Luke shortens the account at times to lessen the failings of the disciples and shows a more compassionate Jesus'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'with Luke shortening the account at times to lessen the failings of the disciples, even of Judas, and depicting a more compassionate Jesus'
  - where: setting
    claim: 'Luke 22:24–30 and 31–34 have short parallels in John 13'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Except for a few short parallels in Luke to material also found in John earlier during the Last Supper (cf. Luke 22:24‒30, 31‒34 with John 13:12‒20 and 36‒38)'
  - where: setting
    claim: 'As in 21:37, Jesus leaves the city for the Mount of Olives'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: '22:39 he came out: As in 21:37, Jesus exits the city.'
  - where: thread
    claim: 'Satan comes to Jerusalem himself, for Judas and for Jesus’s last hours'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'We can be certain that Satan comes to Jerusalem both to influence Judas (see the Notes on 22:3, 31) and for Jesus’ last hours (see 22:53—“this is your hour, and the power of darkness”).'
  - where: thread
    claim: 'Satan’s efforts reach beyond Judas to Peter, the Apostles and all who turn to the Savior'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'But his efforts involve more than snagging the heart of Judas (see 22:3). They involve attempts on Peter, the other Apostles, and all those who turn to the Savior'
  - where: thread
    claim: 'Judas is not in charge of events; Jesus is'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'But Judas is not in charge of events. Jesus is because he places himself in a spot where Judas and his party will surely find him'
  # ---- notes
  - where: 'note 22:3 “Then entered Satan into Judas”'
    claim: 'Luke and John point to Satanic influence where Mark speaks only of money'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'while Luke and John instead suggest that he was driven by Satanic influence'
  - where: 'note 22:3 “Then entered Satan into Judas”'
    claim: 'Satan comes himself rather than sending a lieutenant'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'when Satan knows that he is in a position to hurt the Savior, … he does not send one of his lieutenants to tend to business. He himself comes to Jerusalem'
  - where: 'note 22:3 “Then entered Satan into Judas”'
    claim: 'Satan’s enticement does not remove Judas’s guilt'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'Judas must feel a high degree of loyalty and love for the Savior. And for him to take the step of betrayal needs enticement from Satan. Even so, the Lord does not remove the guilt in the least'
  - where: 'note 22:3 “Then entered Satan into Judas”'
    claim: 'The Gospels use paradidōmi, hand over, not the technical word for betray'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'all the Gospels consistently use a term that means “hand over” (Greek, paradidōmi) rather than the technical term meaning “betray” (prodidōmi).'
  - where: 'note 22:3 “Then entered Satan into Judas”'
    claim: '“In the absence of the multitude” is the key to the agreement: an arrest away from the public gaze'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'In the minds of officials, this condition is the key feature in their agreement with Judas, that they can make an arrest away from the public gaze'
  - where: 'note 22:15 “With desire I have desired”'
    claim: 'The doubled expression likely reflects a Hebrew or Aramaic idiom'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'Many scholars see this expression as a translation from a Hebrew or Aramaic original, termed grammatically an infinitive absolute where the verb and its object derive from the same root.'
  - where: 'note 22:15 “With desire I have desired”'
    claim: 'Jesus first announces at the supper that His death is at hand'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'Jesus announces for the first time at the supper that his death is at hand'
  - where: 'note 22:15 “With desire I have desired”'
    claim: 'Luke 22:15 may suggest Jesus wanted to celebrate aspects of the Passover with His friends before His death, with or without a lamb; John has Passover begin the next evening'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: '“I have most earnestly desired to eat this Passover with you before I suffer” (Luke 22:15, authors’ translation), could well suggest that Jesus wanted to celebrate aspects of the Passover, with or without an actual lamb as its main course'
  - where: 'note 22:15 “With desire I have desired”'
    claim: 'John has Passover begin at sunset the day after the supper'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'John, however, maintains that Passover actually began at sunset the next day, following Jesus’s crucifixion'
  - where: 'note 22:16 “Until it be fulfilled”'
    claim: 'The Joseph Smith Translation of 22:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/22?lang=eng'
    quote: 'until it be fulfilled which is written in the prophets concerning me. Then I will partake with you, in the'
  - where: 'note 22:19 “This do in remembrance of me”'
    claim: 'Luke appears to draw on Paul’s account as well as Mark’s'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Luke, in addition to adding some unique material, appears to draw upon both Mark and Paul, with the latter borrowing possibly explained by the traditional ascription of the Gospel of Luke to a missionary companion of the apostle Paul.'
  - where: 'note 22:19 “This do in remembrance of me”'
    claim: '“Do” means repeating exactly what Jesus does: administering with authority and partaking with faith'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'Hence, Jesus’ command refers to both administering the sacrament with authority, exactly as he does, and partaking with faith'
  - where: 'note 22:19 “This do in remembrance of me”'
    claim: 'The JST of Matthew and Mark and 3 Nephi read “in remembrance of my body”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'the Joseph Smith Translation of Matthew and Mark (as well as the eyewitness account) repeats a fuller version of these words: “in remembrance of my body”'
  - where: 'note 22:19 “This do in remembrance of me”'
    claim: 'The text of 3 Nephi 18:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/18?lang=eng'
    quote: 'And this shall ye do in remembrance of my body, which I have shown unto you. And it shall be a testimony unto the Father that ye do always remember me.'
  - where: 'note 22:19 “This do in remembrance of me”'
    claim: 'Elder Holland: the sacramental prayers stress remembrance, always remembering Him that we may have His Spirit'
    key: holland-remembrance
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1995/10/this-do-in-remembrance-of-me?lang=eng'
    quote: 'What is stressed in both prayers is that all of this is done in remembrance of Christ. In so participating we witness that we will always remember Him, that we may always have His Spirit to be with us (see D&C 20:77, 79).'
  - where: 'note 22:20 “The new testament in my blood”'
    claim: 'Diathēkē was a will in classical Greek, but in the Septuagint it renders berit, covenant'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'In classical Greek the word “covenant” (Greek, diathēkē; KJV, “testament”) represented a legal document, a last will and final testament … but in the Septuagint it translated the Hebrew bərîṯ, a binding constitution or covenant between God and his people.'
  - where: 'note 22:20 “The new testament in my blood”'
    claim: 'A new covenant recalls Jeremiah 31:31–33'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Its being a “new” covenant connects Jesus’s sacrifice with the prophecy of Jeremiah that the Lord would make a new covenant to replace the one that they broke, one that would be written in their hearts (Jer 31:31‒33).'
  - where: 'note 22:20 “The new testament in my blood”'
    claim: 'The blood shed ties the cup to God’s earlier covenant and to Jesus’s sacrificial death'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Luke also includes the image of the shedding or pouring of Jesus’s blood from Mark and Matthew, which connects it with both God’s earlier covenant with his people and his own sacrificial death'
  - where: 'note 22:20 “The new testament in my blood”'
    claim: 'The new covenant gains its life from Jesus’s blood, not from animal sacrifice'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'the new covenant will gain its life from Jesus’ blood, not from the blood of animals sacrificed on the temple’s altar'
  - where: 'note 22:24 “Strife at the supper”'
    claim: 'Matthew and Mark report a similar dispute on another occasion; this one belongs to the Last Supper'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'Although Matthew and Mark report a similar dispute arising on a different occasion (see Matt. 20:20–28; Mark 10:35–45), this one seems genuinely to belong to the Last Supper.'
  - where: 'note 22:24 “Strife at the supper”'
    claim: 'The settings differ entirely; repeating a teaching in two settings is not unusual'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'For starters, the settings of the reports are entirely unlike one another. And the probability that Jesus chooses to make similar points in two separate settings is not unusual.'
  - where: 'note 22:24 “Strife at the supper”'
    claim: 'Luke does not bleach out the disciples’ differences'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'The bone-hard honesty of Luke’s narrative does not seek to bleach out differences that arise among Jesus’ closest disciples.'
  - where: 'note 22:24 “Strife at the supper”'
    claim: 'Luke does not recount the foot washing but preserves its associated teaching'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'While Luke does not directly recount the foot washing, it does preserve the associated teaching'
  - where: 'note 22:25 “Called benefactors”'
    claim: 'Euergetēs was a title of honor conferred on those who served their country and on princes'
    key: thayer
    url: 'https://biblehub.com/greek/2110.htm'
    quote: 'εὐεργέτης, Αὐεργέτου, ὁ, a benefactor (from Pindar and Herodotus down); it was also a title of honor, conferred on such as had done their country service, and upon princes'
  - where: 'note 22:29 “I appoint unto you a kingdom”'
    claim: 'Diatithēmi: to assign a thing to another as his possession, a kingdom at Luke 22:29; also to make a testament, or a covenant'
    key: thayer
    url: 'https://biblehub.com/greek/1303.htm'
    quote: 'hence, to assign a thing to another as his possession: τίνι βασιλείαν (to appoint), Luke 22:29.'
  - where: 'note 22:29 “I appoint unto you a kingdom”'
    claim: 'The verb also means to make a testament and to make a covenant'
    key: thayer
    url: 'https://biblehub.com/greek/1303.htm'
    quote: 'b. to dispose of by will, make a testament: Hebrews 9:16f'
  - where: 'note 22:29 “I appoint unto you a kingdom”'
    claim: 'D&C 29:12: the Twelve of Jerusalem will judge the whole house of Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/29?lang=eng'
    quote: 'mine apostles, the Twelve which were with me in my ministry at Jerusalem, shall stand at my right hand at the day of my coming in a pillar of fire'
  - where: 'note 22:29 “I appoint unto you a kingdom”'
    claim: 'Mormon 3:18–19: the twelve of Jerusalem judge the twelve tribes and the Nephite twelve'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/morm/3?lang=eng'
    quote: 'they shall be judged by the other twelve whom Jesus chose in the land of Jerusalem.'
  - where: 'note 22:31 “Sift you as wheat”'
    claim: 'The Joseph Smith Translation of 22:31'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/22?lang=eng'
    quote: 'JST Luke 22:31 … Satan hath desired you, that he may sift the children of the kingdom as wheat.'
  - where: 'note 22:32 “When thou art converted”'
    claim: 'Epistrepsas means to turn back again; it held out hope for Peter'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'the Greek epistrepsas literally means “to turn back again” and is rendered by the New Jerusalem Bible as “once you have recovered.” This may have held out particular hope for Peter when his faith did fail'
  - where: 'note 22:32 “When thou art converted”'
    claim: 'After his recovery Peter could be a greater strength to his brothers; Luke softens his reply'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'he could turn back again and, after his recovery, be a greater strength to his brothers.[16] Likewise, Luke softens Peter’s response.'
  - where: 'note 22:32 “When thou art converted”'
    claim: 'Peter would later go to prison and death in his own mission'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: '“Lord, I am ready to go with thee, both into prison, and to death,” acts of faith that Peter would in fact accomplish later in his own mission.'
  - where: 'note 22:32 “When thou art converted”'
    claim: 'One proposal: only after the Atonement could Peter fulfill the charge to strengthen his brethren'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'Only when Jesus’ atoning sacrifice had been completed did grace sufficient begin to flow, enabling Peter, and us, to be successful and valiant as disciples.'
  - where: 'note 22:32 “When thou art converted”'
    claim: 'The charge seems renewed on the shore of Galilee (John 21:15–17)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'Does Jesus restore and thereby continue this command to Peter on the shore of the Sea of Galilee? It seems so (see the Note on 22:62; John 21:15–17).'
  - where: 'note 22:42 “This cup”'
    claim: 'D&C 19:18: the Savior’s own words of the bitter cup'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/19?lang=eng'
    quote: 'and would that I might not drink the bitter cup, and shrink—'
  - where: 'note 22:42 “This cup”'
    claim: '3 Nephi 11:11: He drank the bitter cup the Father gave Him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/11?lang=eng'
    quote: 'I have drunk out of that bitter cup which the Father hath given me, and have glorified the Father in taking upon me the sins of the world'
  - where: 'note 22:43 “An angel strengthening him”'
    claim: 'Verses 43–44 are not in P75 or other important manuscripts, and many doubt them; a few manuscripts put them after Matthew 26:39'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'This verse and the next are not part of the earliest manuscript (P75) or other important manuscripts of Luke’s Gospel. Hence, many scholars doubt their authenticity.187 A few manuscripts place these verses after Matthew 26:39.'
  - where: 'note 22:43 “An angel strengthening him”'
    claim: 'Justin and Irenaeus refer to the bleeding; Tatian includes the angel; the two verses always stand together'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'In the case of Tatian, he includes the notice of the angel.212 Importantly, both verse 43 and verse 44 stand together in all the manuscripts that carry them.'
  - where: 'note 22:43 “An angel strengthening him”'
    claim: 'Early scribes hesitated to show Jesus needing an angel’s help, which may explain the omission'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'have demonstrated an early scribal hesitancy to portray Jesus as needing help from an angel and being fearful and hesitant to face his fate, possibly explaining why some copyists removed it.'
  - where: 'note 22:43 “An angel strengthening him”'
    claim: 'Wayment, as the KnoWhy quotes him: the verses may be original and omitted over doctrinal concerns; the KnoWhy: enough reason to accept them cautiously'
    key: sc-knowhy-520
    url: 'https://scripturecentral.org/knowhy/did-jesus-bleed-from-every-pore'
    quote: 'However, the evidence is strong enough to suggest that they may be original to Luke’s Gospel but were perhaps omitted over doctrinal concerns.'
  - where: 'note 22:43 “An angel strengthening him”'
    claim: 'The KnoWhy judges there is enough reason to accept the verses cautiously'
    key: sc-knowhy-520
    url: 'https://scripturecentral.org/knowhy/did-jesus-bleed-from-every-pore'
    quote: 'there are, however, enough reasons for one to cautiously accept their factual authenticity while still being aware of their questionable textual status.'
  - where: 'note 22:43 “An angel strengthening him”'
    claim: 'The angel parallels Moses and Elijah at the Transfiguration'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'the appearance of the angel is parallel to the appearance of Moses and Elijah, heavenly messengers who appear earlier at the Transfiguration and speak to Jesus about his coming death'
  - where: 'note 22:43 “An angel strengthening him”'
    claim: 'The angel’s identity is unknown; his coming shows that prayer brings help'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'The identity of the angel remains unknown. But the angel’s coming demonstrates the truth of Jesus’ instruction to the Apostles, that prayer will bring results'
  - where: 'note 22:43 “An angel strengthening him”'
    claim: 'Elder McConkie supposed the angel was Michael'
    key: mcconkie-gethsemane-1985
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1985/04/the-purifying-power-of-gethsemane?lang=eng'
    quote: 'We know that an angel came from the courts of glory to strengthen him in his ordeal, and we suppose it was mighty Michael, who foremost fell that mortal man might be.'
  - where: 'note 22:44 “As it were great drops of blood”'
    claim: 'Agōnia originally meant a contest or struggle'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'The expression being “in anguish” (Greek, en agōniai; KJV, “in an agony”) comes from a term that originally referred to a contest or struggle'
  - where: 'note 22:44 “As it were great drops of blood”'
    claim: 'Thrombos occurs only here in the New Testament and can mean a clot'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'The term translated “drops” (Greek thrombos) appears only here in the entire New Testament. The word can mean “clot” or “small amount of blood.”'
  - where: 'note 22:44 “As it were great drops of blood”'
    claim: 'Most read hōsei as a simile; a minority as actual bleeding'
    key: sc-knowhy-520
    url: 'https://scripturecentral.org/knowhy/did-jesus-bleed-from-every-pore'
    quote: 'Most New Testament scholars read hōsei in v. 44 as introducing a simile (Jesus was sweating so profusely it was as if he were bleeding), although a minority of scholars have argued for the passage describing actual haimatidrosis'
  - where: 'note 22:44 “As it were great drops of blood”'
    claim: 'Restoration scripture tips the scales toward authenticity and a real physical event'
    key: sc-knowhy-520
    url: 'https://scripturecentral.org/knowhy/did-jesus-bleed-from-every-pore'
    quote: 'Latter-day Saints, however, have additional scriptures that tip the scales in favor of these verses being authentic and also describing a real physiological phenomenon.'
  - where: 'note 22:44 “As it were great drops of blood”'
    claim: 'Mosiah 3 and D&C 19 do not explicitly say He sweat blood in Gethsemane'
    key: sc-knowhy-520
    url: 'https://scripturecentral.org/knowhy/did-jesus-bleed-from-every-pore'
    quote: 'neither the Book of Mormon nor the Doctrine and Covenants explicitly say Jesus would sweat blood in Gethsemane as appears to be portrayed in Luke.'
  - where: 'note 22:44 “As it were great drops of blood”'
    claim: 'The JST keeps “as it were”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/22?lang=eng'
    quote: 'JST Luke 22:44 … and he sweat as it were great drops of blood …'
  - where: 'note 22:44 “As it were great drops of blood”'
    claim: 'Mosiah 3:7, the angel’s words to Benjamin'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/3?lang=eng'
    quote: 'for behold, blood cometh from every pore, so great shall be his anguish for the wickedness and the abominations of his people.'
  - where: 'note 22:45 “Sleeping for sorrow”'
    claim: '“For sorrow” is “from grief”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'The prepositional phrase means “from sorrow” (Greek apo tēs lypēs).'
  - where: 'note 22:45 “Sleeping for sorrow”'
    claim: 'Luke records their sleeping only once, perhaps to minimize their failings'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Luke, perhaps to minimize the failings of these three, simplifies the account, only recording their falling asleep once (Luke 22:40, 45‒46).'
  - where: 'note 22:45 “Sleeping for sorrow”'
    claim: 'At the Transfiguration too the disciples were overwhelmed by sleep'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'in another scene in which Peter, James, and John are also present and are similarly overwhelmed by sleep (Luke 9:28‒32).'
  - where: 'note 22:48 “Betrayest thou the Son of man with a kiss?”'
    claim: 'The kiss inverts a disciple’s token of respect and devotion'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'seemingly supporting the standard view that this sign was the traitorous inversion of what was usually a token of respect and devotion from a disciple to a master.'
  - where: 'note 22:48 “Betrayest thou the Son of man with a kiss?”'
    claim: 'Luke does not say Judas actually kisses Him'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'It is not clear from Luke’s account whether Judas actually kisses Jesus; according to Matthew 26:49 and Mark 14:45, he does so. Luke may not want to picture Judas in intimate contact with Jesus at the moment of the betrayal.'
  - where: 'note 22:51 “He touched his ear, and healed him”'
    claim: 'Only Luke records the healing'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Only Luke, whose portrait of Jesus is always compassionate, notes that Jesus immediately healed the man.'
  - where: 'note 22:51 “He touched his ear, and healed him”'
    claim: '“Suffer ye thus far” is unclear; the healing shows He meant to end the fighting'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'The sense remains unclear. Jesus may be addressing his disciples, the more likely audience, or the soldiers.'
  - where: 'note 22:51 “He touched his ear, and healed him”'
    claim: 'The healing ends the swordplay'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'That Jesus wants to bring swordplay to an end can be seen in his act of healing the servant.'
  - where: 'note 22:51 “He touched his ear, and healed him”'
    claim: 'The healing shows His love for one who came against Him, as does His later prayer for those who crucify Him'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'The breadth and depth of Jesus’ love appears in this gracious, physical act toward a person who comes against him with hostile intent. Similarly, Jesus reaffirms his love toward his enemies in his later appeal to his Father to forgive those who crucify him'
  - where: 'note 22:61 “The Lord turned, and looked upon Peter”'
    claim: 'Only Luke has Jesus turn and look at Peter, being led by at that moment'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'the wrenching realization of what Peter has done is made all the more poignant in Luke’s account, where Jesus, who is being led by at that very moment, turns and looks at Peter (Luke 22:61).'
  - where: 'note 22:61 “The Lord turned, and looked upon Peter”'
    claim: 'Peter never denies his testimony that Jesus is the Christ'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'although significantly he never denies his testimony, gained earlier by revelation, that Jesus is the Christ.'
  - where: 'note 22:61 “The Lord turned, and looked upon Peter”'
    claim: 'In Luke the first denial is that he does not know Jesus, the last in Mark and Matthew'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'Peter’s denial at that time is that he does not know Jesus, which is the last denial in the other two versions (see Luke 22:57).'
  - where: 'note 22:61 “The Lord turned, and looked upon Peter”'
    claim: 'Luke’s third denial is the softest'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'is, in fact, the softest: it is simply that he does not know what the man is talking about'
  - where: 'note 22:61 “The Lord turned, and looked upon Peter”'
    claim: 'Jesus’s turning may recall the “turned back” of verse 32'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'his portrayal of Jesus turning and looking may recall Jesus’ prophecy to Peter that when he “had turned back” (epistrepsas; KJV, “art converted”) he was to strengthen his brethren (Luke 22:32).'
  - where: 'note 22:61 “The Lord turned, and looked upon Peter”'
    claim: 'Peter’s healing begins with repentance, initiated by Jesus’s look'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'Peter’s healing from his denials begins with his repentance, initiated by Jesus looking at him'
  - where: 'note 22:64 “Prophesy, who is it that smote thee?”'
    claim: 'The prophecy of the denial is fulfilled at the moment He is mocked as a false prophet'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'With Peter’s threefold renunciation, Jesus’ prophecy of his denial is fulfilled at the very moment when he is being accused of being a false prophet by the Sanhedrin in Mark and Matthew and by those who are mocking him in Luke.'
  - where: 'note 22:64 “Prophesy, who is it that smote thee?”'
    claim: 'Those who blindfold Him are themselves spiritually blind'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'With a twist of irony, those who blindfold Jesus are themselves spiritually blind.'
  - where: 'note 22:64 “Prophesy, who is it that smote thee?”'
    claim: 'For the mockers prophecy means seeing what cannot be seen by natural means'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'It appears that prophecy in this context has to do with seeing or sensing what one cannot see or sense by natural means'
  - where: 'note 22:66 “As soon as it was day”'
    claim: 'In Luke Jesus is held overnight with no hearing until morning'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Luke, on the other hand, has him taken and held at the sitting high priest’s house, where he is mocked and abused, but apparently just held for the night with no interrogation or hearing happening until the next morning'
  - where: 'note 22:66 “As soon as it was day”'
    claim: 'In Luke only Jesus stands as a witness'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'In Luke’s recounting, only Jesus stands as a witness while Matthew and Mark mention others'
  - where: christ
    claim: 'Elder Holland: the cup recalls His blood and His spiritual suffering, which began in Gethsemane'
    key: holland-remembrance
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1995/10/this-do-in-remembrance-of-me?lang=eng'
    quote: 'With a small cup of water we remember the shedding of Christ’s blood and the depth of His spiritual suffering, anguish which began in the Garden of Gethsemane.'
  - where: christ
    claim: 'Elder Holland: because Jesus walked the path alone, we do not have to'
    key: holland-none-with-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/none-were-with-him?lang=eng'
    quote: 'one of the great consolations of this Easter season is that because Jesus walked such a long, lonely path utterly alone, we do not have to do so.'
  - where: explore
    claim: 'Huntsman and Hatch’s “Thursday” treats the supper, Gethsemane and the arrest'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'On that night Jesus celebrated the Last Supper with disciples, went to the Garden of Gethsemane to pray and prepare for the ordeal that was to come'
  - where: explore
    claim: 'Huntsman’s study compares the four accounts of Peter’s denial'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'While the four accounts differ in detail and emphases, they teach the same basic points about Peter and his experience.'
  - where: 'note 22:16 “Until it be fulfilled”'
