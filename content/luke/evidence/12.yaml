    url: 'https://biblehub.com/commentaries/ellicott/luke/12.htm'
    quote: 'they did not discern the true import of the time, the season, the crisis in which they found themselves. It was “the time of their visitation” (see Note on Luke 19:44), and yet they knew it not.'
  - where: 'note 12:56 “Reading the sky, missing the time”'
    claim: 'Luke 19:44 as quoted'
