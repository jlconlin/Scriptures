  - where: 'note 12:38 “The first, second and third watch”'
    claim: 'The Jews kept three watches, with their hours; Luke 12:38 cited'
    key: bd-watches
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/watches?lang=eng'
    quote: 'The Jews, like the Babylonians and Greeks, divided the night into three watches, “the beginning of the watches,” sunset till 10 p.m. (Lam. 2:19); the “middle watch,” 10 p.m. till 2 a.m. (Judg. 7:19); and the “morning watch,” 2 a.m. till sunrise (Ex. 14:24; 1 Sam. 11:11; Luke 12:38).'
