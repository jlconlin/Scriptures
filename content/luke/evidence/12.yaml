chapter: 12
claims:
  - where: when
    claim: 'The occasion falls during the journey to Jerusalem'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'Later during his journey to Jerusalem, the Savior was surrounded by “an innumerable multitude of people” (Luke 12:1).'
  - where: setting
    claim: 'The teachings of chapter 12 are bracketed by the hostile exchange that ends chapter 11 and the news of 13:1–5'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'the teachings of the Savior that he gathers into chapter 12 are bracketed by the noisy exchange that ends chapter 11 (see 11:39–54) and the dual news of Pilate’s execution of some fellow Galileans and a terrible accident in Jerusalem (see 13:1–5).'
  - where: setting
    claim: 'Jesus turns from one audience to another, disciples (12:4, 22) and the crowd (12:13–14, 54)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'the observation that he turns from one audience to another, from disciples (see 12:4, 22) to members of the accompanying crowd (see 12:13–14, 54),32 suggests a vivid memory of the occasion'
  - where: setting
    claim: 'Matthew and Luke differ in order; it is an easy step to see Jesus giving similar teachings on different occasions'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'From this view, it is an easy step to surmise that Jesus gives similar teachings on different occasions, as the settings in each Gospel imply.'
  - where: setting
    claim: 'D&C 45:16 points to prior conversations about the signs of His coming; the JST supports His speaking of such things earlier'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'Jesus says to the Twelve: “As ye have asked of me concerning the signs of my coming,” a pointer to prior conversations about this topic (D&C 45:16).'
  - where: setting
    claim: 'The JST adds a long verse supporting the view that Jesus speaks of the last days earlier in His ministry'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'By adding a long and significant verse, for instance, the Joseph Smith Translation supports a view that Jesus speaks earlier in his ministry about such subjects'
  - where: setting
    claim: 'The JST’s additions in 12:41–57 (appendix) and 12:9–12'
    key: jst-luke-12
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/12?lang=eng'
    quote: '§ JST, Luke 12:41–57. Compare Luke 12:37–48 Jesus teaches that His servants must always be ready for His coming.'
  - where: thread
    claim: 'God’s influence in our lives binds the first half of the chapter (12:1–34), with the question how to view the goods of this world'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'the theme of God’s enwrapping influence in our lives binds unity into the first half of this chapter (see 12:1–34). … A second theme wraps itself around these verses, securing tightly the answer to the question, How do we view the goods of this world?'
  - where: thread
    claim: 'From 12:35 the stories focus on readiness to the end of the chapter'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'The first verse of this section (12:35) changes the focus of the Savior’s words and introduces a series of stories that focus on readiness and stretch to the end of the chapter (see 12:35–59).'
  - where: thread
    claim: 'In 12:49–59 Jesus raises His own suffering and death and the decision it demands'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'The Savior raises the warning of waxing warmth by kindling the looming prospect of his own suffering and death, and what this means for people’s decisions about him.'
  - where: 'section 3 plain'
    claim: '“Stature” in 12:25 usually means age; the sense is adding to one’s length of life'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: '12:25 stature: The term usually touches on a person’s age (Greek hēlikia).59'
  - where: 'note 12:1 “Leaven, hidden in the dough”'
    claim: 'Leaven is sourdough kept back and added to fresh dough, where hidden it raises and changes the dough'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'At base, this leaven consists of sourdough, a fermenting agent, kept aside until it is time to use a portion of it. Then it is added to fresh dough and, hidden within, it acts as a raising agent, changing the character of the dough.7'
  - where: 'note 12:1 “Leaven, hidden in the dough”'
    claim: 'Verse 2 links back to the hidden leaven of hypocrisy, which will be uncovered'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'But the stronger tie links back to the prior verse, that is, to the unseen and silent leaven or hypocrisy of the Pharisees that will surely be uncovered, no matter their efforts to hide it (see also D&C 1:3).'
  - where: 'note 12:1 “Leaven, hidden in the dough”'
    claim: '“First of all” better means Jesus spoke first to the disciples, with the crowd overhearing'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'The question is whether the adverb here (Greek prōton) ties to Jesus’ words to his disciples (“first he spoke to his disciples”), … or whether it goes with what follows (“above all, beware of the leaven”). The better solution points to Jesus first speaking with the disciples, with the crowd overhearing'
  - where: 'note 12:5 “Whom to fear”'
    claim: 'The one to fear is God, who has power to cast into hell; an allusion to the final judgment'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: '12:7 Fear not: In contrast to his warning to fear God who “hath power to cast into hell” (12:5), Jesus offers his glowing guarantee of God’s ultimate concern and love.'
  - where: 'note 12:5 “Whom to fear”'
    claim: '“Hath power to cast into hell” alludes to the final judgment'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'This warning is a strong signal that the main topic of Jesus’ words has to do with the end of time since it speaks of “him, which . . . hath power to cast into hell,” an allusion to the final judgment'
  - where: 'note 12:5 “Whom to fear”'
    claim: '“Hell” in 12:5 is Gehenna'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'fear the one who, after killing you, has power to throw you into Gehenna. Yes, I tell you, fear him.'
  - where: 'note 12:5 “Whom to fear”'
    claim: 'The valley of Hinnom (Gehenna) was associated with burning and the wrath of God, still in New Testament times'
    key: sc-knowhy-81
    url: 'https://scripturecentral.org/knowhy/why-do-the-scriptures-compare-hell-to-an-unquenchable-fire'
    quote: 'the valley of Hinnom (Gehenna) was associated with burning, destruction and the fiery wrath of God in the minds of the inhabitants of Jerusalem. This was clearly still the case in New Testament times.'
  - where: 'note 12:5 “Whom to fear”'
    claim: '“My friends” appears nowhere else in Luke; John and the D&C use it of apostles; here likely aimed at the Twelve'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'my friends: These words of endearment appear nowhere else in this Gospel … Only John preserves the warm greeting “my friends,” which Jesus extends specifically to the Apostles who “do whatsoever I command” (John 15:14). … may well be aimed particularly at the Twelve.'
  - where: 'note 12:5 “Whom to fear”'
    claim: 'Jesus does not fear those who will kill Him; death is not the end of existence'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'This instruction may well point to Jesus’ own looming death at the hands of others. He does not fear them because, as soon as he dies, they can exercise no more power over him … Death, in his view, does not bring an end to a person’s existence.'
  - where: 'note 12:5 “Whom to fear”'
    claim: 'The valley of Hinnom circles the southern edge of Jerusalem'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'in reference to the Valley of Hinnom that circles the southern edge of Jerusalem'
  - where: 'note 12:10 “Why a word against the Son of man is forgiven”'
    claim: 'JST 12:9 as quoted'
    key: jst-luke-12
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/12?lang=eng'
    quote: 'But he who denieth me before men, shall be denied before the angels of God.'
  - where: 'note 12:10 “Why a word against the Son of man is forgiven”'
    claim: 'JST: the disciples had spoken evil of Him from fear, and feared they would not be forgiven'
    key: jst-luke-12
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/12?lang=eng'
    quote: 'Now his disciples knew that he said this, because they had spoken evil against him before the people; for they were afraid to confess him before men. And they reasoned among themselves, saying, He knoweth our hearts, and he speaketh to our condemnation, and we shall not be forgiven.'
  - where: 'note 12:10 “Why a word against the Son of man is forgiven”'
    claim: 'JST 12:12 adds “and repenteth”'
    key: jst-luke-12
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/12?lang=eng'
    quote: 'Whosoever shall speak a word against the Son of man, and repenteth, it shall be forgiven him; but unto him who blasphemeth against the Holy Ghost, it shall not be forgiven him.'
  - where: 'note 12:10 “Why a word against the Son of man is forgiven”'
    claim: 'The saying answers the disciples’ fear; “and repenteth” makes forgiveness conditional on repentance'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'In a vivid sense, this brief addition makes all the difference. Forgiveness will come to one who “shall speak a word against the Son of man” only if that person repents.'
  - where: 'note 12:10 “Why a word against the Son of man is forgiven”'
    claim: 'The promise looks to Peter’s denial and his forgiveness'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'A person need look no further than Peter’s denial.34 In this account, three times Peter denies the Savior in strong language (see 22:55–60). Can Peter obtain forgiveness for such an act?'
  - where: 'note 12:10 “Why a word against the Son of man is forgiven”'
    claim: 'Joseph Smith on the sin against the Holy Ghost'
    key: jsp-discourse-1844-04-07
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-7-april-1844-as-published-in-times-and-seasons/5'
    quote: 'All sins shall be forgiven except the sin against the Holy Ghost: after a man has sinned against the Holy Ghost there is no repentance for him, he has got to say that the sun does not shine, while he sees it, he has got to deny Jesus Christ when the heavens were open to him'
  - where: 'note 12:10 “Why a word against the Son of man is forgiven”'
    claim: 'D&C 76:35 and Luke 22:55–60 as quoted and cited'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/76?lang=eng'
    quote: 'Having denied the Holy Spirit after having received it'
  - where: 'note 12:12 “Given in the hour it is needed”'
    claim: 'Synagogue justice included beatings (Acts 22:19); the magistrates and powers were most likely Gentiles'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'one New Testament passage highlights such justice, including beatings inside the buildings (see Acts 22:19 … magistrates, and powers: These officials are most likely Gentiles, although they could be Jewish (see 21:12).'
  - where: 'note 12:12 “Given in the hour it is needed”'
    claim: 'The help comes when it is needed, not long before and not after; D&C 84:85'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'Significantly, the proffered divine prop comes only when it is needed (see 21:14–15), not a long time beforehand, and certainly not afterward: “it shall be given you in the very hour” (D&C 84:85).'
  - where: 'note 12:12 “Given in the hour it is needed”'
    claim: 'D&C 84:85 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'Neither take ye thought beforehand what ye shall say; but treasure up in your minds continually the words of life, and it shall be given you in the very hour that portion that shall be meted unto every man.'
  - where: 'note 12:14 “Why Jesus would not divide the inheritance”'
    claim: 'The man demands a judgment in his favor; “speak” is imperative'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'The man who makes the request has already fallen into the grasp of greed and essentially demands that Jesus render a judgment on property that is in favor of the man against his brother. To this demand—the verb “to speak” is in the imperative (12:13)'
  - where: 'note 12:14 “Why Jesus would not divide the inheritance”'
    claim: 'Inheritance had established laws and customs needing no heavenly intervention; Jesus respects custom and law, as with tribute to Caesar'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'The laws and customs for such matters are already in place and do not require special intervention, a heavenly intervention in this case, because of who Jesus is. … Within Jesus’ response stands a firm respect for custom and law in his society, aspects that he will not overturn, as in the case of paying taxes to Caesar (see 20:21–25).'
  - where: 'note 12:14 “Why Jesus would not divide the inheritance”'
    claim: '“Divider” is a rare word found only here in the New Testament'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'In fact, “divider,” a rare word that appears only here in the New Testament (Greek meristēs), is unattested in ancient Jewish legal terminology except as the name of a Jewish sect.43'
  - where: 'note 12:14 “Why Jesus would not divide the inheritance”'
    claim: 'Instead of settling the dispute He addressed the root of the problem, covetousness'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'Instead of settling this dispute over temporal goods, the Savior addressed the root of the problem while warning the crowd: “Take heed, and beware of covetousness'
  - where: 'note 12:20 “God calls him a fool”'
    claim: '“Fool” (aphrōn) comes from God and is the opposite of phronimos, wise'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: '12:20 fool: Frighteningly, the term comes on the lips of God (Greek aphrōn) and stands opposite the word for wise or intelligent (Greek phronimos).54'
  - where: 'note 12:20 “God calls him a fool”'
    claim: '“Required” is active, “they shall require thy soul”; an indefinite plural pointing to God as actor'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'The expression is not in the passive voice and instead reads “they shall require thy soul,” … But grammatically the simple plural indicative can express the passive if the subject is indefinite, pointing to God as the one who acts.55'
  - where: 'note 12:20 “God calls him a fool”'
    claim: '“Soul” here means mortal life, as in 12:20, 22–23'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'In this last sense, it represents mortal life, as the next verse and others illustrate (see 12:20, 22–23).'
  - where: 'note 12:21 “Not rich toward God”'
    claim: 'The man uses I and my eleven times; he did not recognize the source of his riches; he was condemned not for storing but for failing to prepare spiritually'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'the rich man uses the first person singular pronouns I and my 11 times, revealing the man’s concern with self. … Ultimately the man was condemned not for the wise practice of storing temporal provisions, but for failing to prepare spiritually for the future.'
  - where: 'note 12:21 “Not rich toward God”'
    claim: 'He did not acknowledge that “the ground” brought forth'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'In no way did he acknowledge, as the Savior did, that it was “the ground” that “brought forth plentifully” (v. 16), nor did he thank the Lord for creating the earth in which his crops grew.'
  - where: 'note 12:21 “Not rich toward God”'
    claim: 'The landowner does not understand he is steward, not owner'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'Plainly, the landowner does not understand that he is the steward of the goods that have come to him, not their owner (see 12:15).'
  - where: 'note 12:21 “Not rich toward God”'
    claim: 'Laying up treasure condemns only when for its own sake, without regard to the kingdom or the source of wealth; secure wealth is in heaven (12:33)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'The act of laying up treasure for oneself does not bring condemnation unless it is undertaken for its own sake without the broader view of the needs of the kingdom and a recognition of the source of that wealth'
  - where: 'note 12:22 “Said again, in another setting”'
    claim: 'The order in Matthew and Luke differs; D&C 84:81–84 has the same words in a completely different order'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'This observation finds corroboration in seeing the close connections between Jesus’ words recorded in Matthew 6:19–21 and 6:25–34 and the Savior’s language in Doctrine and Covenants 84:81–84, but in a completely different order.'
  - where: 'note 12:22 “Said again, in another setting”'
    claim: 'Jesus turns to the disciples with lessons for their full-time service, as with the Nephite Twelve (3 Ne. 13:25–33)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'Jesus turns back to his disciples from “the company” (12:13), drawing up lessons for their future, full-time service and assuring them of God’s constant care in their activities, just as he will do among his Twelve in the New World (see 3 Ne. 13:25–33).'
  - where: 'note 12:22 “Said again, in another setting”'
    claim: '“Stature” usually means age; Jesus speaks of extending the length of life'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: '12:25 stature: The term usually touches on a person’s age (Greek hēlikia).59 … In the Greek meaning, Jesus draws attention to a person trying to extend the length of life merely by thinking about it.'
  - where: 'note 12:22 “Said again, in another setting”'
    claim: 'Jesus carries on the themes of the rich fool as He tells the disciples to trust God for temporal needs'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'The Savior continued the themes he addressed in the parable of the rich fool as he instructed his disciples to trust in God for their temporal needs (see Luke 12:22−34)'
  - where: 'note 12:24 “Why ravens?”'
    claim: 'The raven is among the most unclean birds, a scavenger; the JST adds “nevertheless” before “God feedeth them”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'Jesus nods toward one of the most unclean of birds—it is a scavenger and lives on carrion (see Lev. 11:15; Deut. 14:14). Yet, he affirms, “God feedeth them.” The addition of “nevertheless” before “God feedeth them” in the Joseph Smith Translation adds emphasis to the unclean status of ravens (see JST 12:26).'
  - where: 'note 12:24 “Why ravens?”'
    claim: 'Jesus features the small (ravens, lilies, grass) in contrast to the large (landowner, Solomon)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'Jesus’ expression continues his interest in featuring the small (ravens, lilies, grass) in contrast to the large and important (rich landowner, Solomon).'
  - where: 'note 12:33 “Must a disciple sell everything?”'
    claim: 'Jesus does not require penury; Martha’s home, His mother given to the beloved disciple'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'At issue is whether Jesus requires followers to adopt a life of penury and need. Clearly not. … he accepts of the hospitality of Martha in her home (see 10:38–42) and later commends his mother into the care of his beloved disciple who takes her to his own home'
  - where: 'note 12:33 “Must a disciple sell everything?”'
    claim: 'The gift expects no return, reversing social norms; God repays the giver'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'A second matter has to do with the disciple’s gift to others for which no reciprocal gift is expected in return, a full reversal of contemporary social norms. God will repay the giver, not the one who receives the gift. … “This he spake unto his disciples, saying . . .” (JST 12:36).'
  - where: 'note 12:35 “Loins girded, lights burning”'
    claim: 'To gird the loins was to tuck the tunic’s tail into the belt to move freely; Elijah before Ahab'
    key: south-clothing-textiles
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/clothing-textiles-new-testament'
    quote: 'when the prophet Elijah ran before King Ahab, he first “girded up his loins” (1 Kings 18:46), whereby he tucked the tail of his tunic inside his belt to be able to move easily without his clothing getting in the way. The concept of having loins girded, thus ready for movement and labor'
  - where: 'note 12:35 “Loins girded, lights burning”'
    claim: 'The readiness may reflect the command to be ready to depart at the Passover (Ex. 12:11)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'The sense of pressing preparedness may reflect the command to be ready to depart in the Passover celebration (see Ex. 12:11).81'
  - where: 'note 12:37 “The master who serves”'
    claim: 'A lord serving his servants runs against every convention; the follower sees the Savior as the one who serves (22:24–27); the messianic banquet'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'Of all of Jesus’ sayings, this one runs against every social convention. Who in his society has ever heard of a lord serving his servants? … the discerning follower will see the Savior in this story as the one who serves, as Jesus later will make abundantly clear (see 22:24–27'
  - where: 'note 12:37 “The master who serves”'
    claim: 'The meal points to the messianic banquet; the JST repeats the whole expression'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'Within these words, we detect a strong reference to the coming messianic banquet at which the faithful will sit as guests of the Lord … In fact, as a point of emphasis, the Joseph Smith Translation later repeats this entire expression (see JST 12:40, 43).'
  - where: 'note 12:37 “The master who serves”'
    claim: 'JST 12:43 repeats the promise'
    key: jst-luke-12
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/12?lang=eng'
    quote: 'For the Lord of those servants shall gird himself, and make them to sit down to meat, and will come forth and serve them.'
  - where: 'note 12:38 “The first, second and third watch”'
    claim: 'Romans kept four night watches between 6 p.m. and 6 a.m., Jews three; the JST notes three'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'Chiefly for military purposes, the night is divided into watches for sentry duty. Romans held to a system of four watches between 6 p.m. and 6 a.m. (see Mark 6:48) while Jews worked with a system of three.90'
  - where: 'note 12:38 “The first, second and third watch”'
    claim: 'The JST verse stresses Jesus’ multiple arrivals, implying readiness because events occur at night'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'a person finds an entire verse appended to 12:37 that stresses Jesus’ multiple arrivals in this world, implying strongly the need for readiness because events occur at night'
  - where: 'note 12:38 “The first, second and third watch”'
    claim: 'JST 12:41–42 and 12:44 as quoted'
    key: jst-luke-12
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/12?lang=eng'
    quote: 'For, behold, he cometh in the first watch of the night, and he shall also come in the second watch, and again he shall come in the third watch. And verily I say unto you, He hath already come, as it is written of him'
  - where: 'note 12:38 “The first, second and third watch”'
    claim: 'JST 12:44'
    key: jst-luke-12
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/12?lang=eng'
    quote: 'And now, verily I say these things unto you, that ye may know this, that the coming of the Lord is as a thief in the night.'
  - where: 'note 12:41 “To us, or to all?”'
    claim: 'JST 12:49–51: the Lord speaks to those He shall make rulers; the faithful servant is he who watches'
    key: jst-luke-12
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/12?lang=eng'
    quote: 'And the Lord said, I speak unto those whom the Lord shall make rulers over his household, to give his children their portion of meat in due season. And they said, Who then is that faithful and wise servant? And the Lord said unto them, It is that servant who watcheth, to impart his portion of meat in due season.'
  - where: 'note 12:41 “To us, or to all?”'
    claim: 'The JST changes place the sayings in the realm of leadership instruction'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'Taken as a whole, these changes place Jesus’ parable-like sayings clearly in the realm of leadership instruction.'
  - where: 'note 12:41 “To us, or to all?”'
    claim: '“Shall make ruler” brings forward a formal installing in office'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'the double and therefore emphatic verb form “shall make ruler” (12:42, 44) brings forward a formal installing in an office, or a setting apart for official functions.121'
  - where: 'note 12:41 “To us, or to all?”'
    claim: 'Stewards hold derived authority; they are to avoid dominating others (D&C 121:37)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'his representatives possess only derived authority from him, as the servants in the stories … as his representatives they are to avoid ill behavior in all its forms, especially that which seeks to dominate others'
  - where: 'note 12:41 “To us, or to all?”'
    claim: 'Jesus answers loudly enough for the crowd to hear; what He says is for all'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'Notably, in responding, Jesus enunciates both principles and approaching events to the Twelve loudly enough that all can hear because a large crowd hovers around them at this moment (see 12:1, 13, 54). What he says is for all.'
  - where: 'note 12:47 “Many stripes and few”'
    claim: 'Different degrees of punishment; rewards are likewise graded'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'we learn first and foremost that one punishment does not fit all; rather, “different degrees of punishment” hang in Jesus’ words.126 The mirror image logically extends to rewards as well—God grades the rewards that he hands to recipients'
  - where: 'note 12:47 “Many stripes and few”'
    claim: 'Mosiah 3:11: the Atonement covers those who sinned ignorantly'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'For those who sin in ignorance, the resulting punishment goes much lighter, “few stripes” (12:48). But this prospect does not exhaust the matter. Other scriptural sources point to an even lighter outcome.'
  - where: 'note 12:47 “Many stripes and few”'
    claim: 'Mosiah 3:11 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/3?lang=eng'
    quote: 'For behold, and also his blood atoneth for the sins of those who have fallen by the transgression of Adam, who have died not knowing the will of God concerning them, or who have ignorantly sinned.'
  - where: 'note 12:47 “Many stripes and few”'
    claim: 'The verb behind “committed” (paratithēmi, middle) means to entrust; D&C 82:3'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'The middle voice of the verb (Greek paratithēmi) bears the meaning “to entrust” by ordination, a much richer sense than simply “to give” (see 1 Tim. 6:20).120 With these words, Jesus draws out an important strand of his prior remarks, that of personal responsibility and accountability in his church and kingdom (see also D&C 82:3).'
  - where: 'note 12:47 “Many stripes and few”'
    claim: '“Cut him in sunder” is an ancient punishment, likely metaphorical here; JST “cut him down”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'The verb (Greek dichotomeō) points to an ancient punishment, and it means to cut or saw in half. Here the meaning is likely metaphorical because the servant undergoes further punishment'
  - where: 'note 12:47 “Many stripes and few”'
    claim: 'JST 12:55 “cut him down”'
    key: jst-luke-12
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/12?lang=eng'
    quote: 'The Lord of that servant will come in a day he looketh not for, and at an hour when he is not aware, and will cut him down, and will appoint him his portion with the unbelievers.'
  - where: 'note 12:49 “Fire, already kindled”'
    claim: 'Though the Final Judgment was future, Jesus was already sifting hearts; fire imagery of Luke 3'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'What does it mean that he had already kindled the fire of judgment? Evidently, Jesus was indicating that although the time of Final Judgment was yet in the future, he was already sifting the hearts of men (see “fire” imagery in Luke 3:4, 16–17; 9:54).'
  - where: 'note 12:49 “Fire, already kindled”'
    claim: 'The JST ties the fire to judgment on those “not well pleased with the Lord’s doings,” adding “therefore” (JST 12:58)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'the Joseph Smith translation supports the notion of judgment. For, at the beginning of this verse, the Prophet adds that certain men “are not well pleased with the Lord’s doings.” At this juncture, he inserts the term “therefore,”'
  - where: 'note 12:49 “Fire, already kindled”'
    claim: 'The fire is read as judgment, as strife against believers, or as cleansing; each points to Jesus’s ministry'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'Instead, the three other interpretations point to Jesus’ ministry: it brings judgment, persecution for believers, and cleansing.'
  - where: 'note 12:49 “Fire, already kindled”'
    claim: 'Another sense of the fire is strife kindled against believers (12:52–53)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'A second understanding has to do with the fire of strife that kindles against those who embrace Jesus’ message, as following verses specify (see 12:52–53; also 21:16).128'
  - where: 'note 12:49 “Fire, already kindled”'
    claim: 'His peace lies within a person’s heart; the household division echoes Micah 7:6'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'Though his coming brings peace (see 1:79; 2:14), such peace lies within a person’s heart (see 2:29; 7:50; 8:48).136'
  - where: 'note 12:49 “Fire, already kindled”'
    claim: 'The divisions in the home recall Micah 7:6'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'Jesus brings his hearers into the sacred spaces of the home and elaborates in almost frightening detail the deep divisions that will erupt among family members as they respond to him and his message (see 21:16; Micah 7:6'
  - where: 'note 12:50 “A baptism, and a Savior hard pressed”'
    claim: '“Straitened” means hard pressed or distressed; one of few verses showing Jesus’ inner anxiety at His coming suffering'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'This expression might be better rendered, “how hard pressed I am” or “how great is my distress.”132 Significantly, this verse reveals some of the inner anxiety that Jesus experiences at the prospect of his future suffering … Very few verses hint at this anxiety (see Matt. 20:22; 26:38; Mark 10:38; 14:33–34; John 12:27–28).'
  - where: 'note 12:50 “A baptism, and a Savior hard pressed”'
    claim: '“Accomplished” (teleō) means to complete, bring to perfection'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'be accomplished: The verb (Greek teleō) means “to complete, to bring to perfection,” with a sense of consecrated action'
  - where: 'note 12:50 “A baptism, and a Savior hard pressed”'
    claim: 'The baptism is His Atonement, which no one else has to face; bleeding from every pore (Mosiah 3:7)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'no one else has to face what he does, for it is his “baptism to be baptized with” (12:50)— … The price of suffering that he pays for all, bleeding from “every pore” (Mosiah 3:7; D&C 19:18; see the Note on 22:44)'
  - where: 'note 12:50 “A baptism, and a Savior hard pressed”'
    claim: 'Contrast with the rich fool: Jesus marched toward His death, giving God all He had'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'In direct contrast to the rich fool who hoarded the things of the world prior to his unsuspected death, Jesus purposefully marched toward his death, deliberately giving God all that he had and was—including his life and the fullest measure of his will'
  - where: 'note 12:56 “Reading the sky, missing the time”'
    claim: 'Clouds from the west bring rain from the Mediterranean (1 Kgs. 18:43)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'a cloud rise out of the west: Jesus notices what agrarian people notice—the signs of coming rain showers blowing in from the Mediterranean Sea that lies to the west (see 1 Kgs. 18:43).'
  - where: 'note 12:56 “Reading the sky, missing the time”'
    claim: 'The south wind from Arabia brings searing heat'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: '12:55 the south wind: This wind, which springs up in Arabia, can bring searing heat (see Jer. 4:11; 51:1–2).'
  - where: 'note 12:56 “Reading the sky, missing the time”'
    claim: '“Time” is kairos, the critical moment of decision'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'this time: In other contexts, the Greek term translated “time” (kairos) concerns the critical moment of decision or crisis, the sense that it bears here'
  - where: 'note 12:56 “Reading the sky, missing the time”'
    claim: '“Hypocrites” are actors; here a conscious ignoring of His message and presence'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'This most unkind title (Greek hypokritēs) has to do with actors who suppress their true character and take on another person’s character during a play. … Here, in Jesus’ mouth, the word points to a conscious ignoring of his message and presence.'
  - where: 'note 12:58 “Settle on the way”'
    claim: 'Debtor and creditor walk to the magistrate; the JST adds a question urging disputes settled out of court (1 Cor. 6:1–7)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'in an evident case of debtor and creditor, the debtor schemes to look for and then walk with the creditor so that he can make an attempt to settle the debt … effectively urging that followers settle disputes out of courtrooms: “Why goest thou to thine adversary for a magistrate . . . ?” (JST 12:67; also 1 Cor. 6:1–7).'
  - where: 'note 12:58 “Settle on the way”'
    claim: '“Give diligence” means take pains, make an effort'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'give diligence: At base, the expression (Greek dos ergasian) is likely a Latinism, da operam, and means to “take pains” or “make an effort,”'
  - where: 'note 12:58 “Settle on the way”'
    claim: 'The officer runs the debtors’ prison; once in his custody all options end'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'This person (Greek praktōr) is an official in a Roman court who is in charge of a debtor’s prison … When a person is placed in this officer’s custody, all options to negotiate or to make a plea come to an end'
  - where: 'note 12:58 “Settle on the way”'
    claim: 'Human judgment in 12:57–59 is a veiled pointer to God’s final judgment'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'Jesus’ turn to the topic of human judgment (see 12:57–59) seems to be a thinly veiled pointer to the final judgment of God'
  - where: christ
    claim: 'The master who serves is the Savior (Luke 22:24–27)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'the discerning follower will see the Savior in this story as the one who serves, as Jesus later will make abundantly clear (see 22:24–27'
  - where: christ
    claim: 'D&C 84:85 and 82:3 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/82?lang=eng'
    quote: 'For of him unto whom much is given much is required; and he who sins against the greater light shall receive the greater condemnation.'
  - where: explore
    claim: 'Brown’s commentary on Luke 12 treats God’s influence, wealth, and stewards'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'Luke quotes two stories from Jesus that feature stewards who respond completely differently to their assignments.'
