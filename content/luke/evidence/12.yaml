    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-26?lang=eng'
    quote: 'To a question interjected by Peter as to whether “this parable” was spoken to the Twelve only or to all, Jesus made no direct reply; the answer, however, was conveyed in the continuation of the allegory of contrast between faithful and wicked servants.'
  - where: 'note 12:41 “To us, or to all?”'
