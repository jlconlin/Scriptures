    url: 'https://biblehub.com/commentaries/ellicott/luke/12.htm'
    quote: 'The word rendered “heat” is probably used here as signifying the “burning wind,” the simoom, which, blowing over the desert, scorched and withered all that was green and fresh. (Comp. James 1:11, where it is rightly rendered “burning heat.”)'
  - where: 'note 12:56 “Reading the sky, missing the time”'
    claim: 'kairos in Luke 12:56: what time brings, the state of the times'
