    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/12?lang=eng'
    quote: 'And the Lord said, I speak unto those whom the Lord shall make rulers over his household, to give his children their portion of meat in due season. And they said, Who then is that faithful and wise servant? And the Lord said unto them, It is that servant who watcheth, to impart his portion of meat in due season.'
  - where: 'note 12:41 “To us, or to all?”'
    claim: 'Peter perhaps thought of the promise of 12:37: for all believers, or for those who forsook all?'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/12.htm'
    quote: 'it is natural to suppose that he dwelt, not so much on the last words of warning, as on the greatness of the promise which is held out in Luke 12:37. Was that to be the common blessing of all believers, or the special reward of those who had forsaken all?'
  - where: 'note 12:41 “To us, or to all?”'
