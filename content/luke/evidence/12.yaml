  - where: 'note 12:49 “Fire, already kindled”'
    claim: 'Though the Final Judgment was future, Jesus was already sifting hearts; fire imagery of Luke 3'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'What does it mean that he had already kindled the fire of judgment? Evidently, Jesus was indicating that although the time of Final Judgment was yet in the future, he was already sifting the hearts of men (see “fire” imagery in Luke 3:4, 16–17; 9:54).'
  - where: 'note 12:49 “Fire, already kindled”'
    claim: 'The fire is read as judgment, as strife against believers, or as cleansing; each points to Jesus’s ministry'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'Instead, the three other interpretations point to Jesus’ ministry: it brings judgment, persecution for believers, and cleansing.'
  - where: 'note 12:49 “Fire, already kindled”'
    claim: 'Another sense of the fire is strife kindled against believers (12:52–53)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'A second understanding has to do with the fire of strife that kindles against those who embrace Jesus’ message, as following verses specify (see 12:52–53; also 21:16).128'
  - where: 'note 12:49 “Fire, already kindled”'
    claim: 'His peace lies within a person’s heart; the household division echoes Micah 7:6'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'Though his coming brings peace (see 1:79; 2:14), such peace lies within a person’s heart (see 2:29; 7:50; 8:48).136'
  - where: 'note 12:49 “Fire, already kindled”'
    claim: 'The divisions in the home recall Micah 7:6'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'Jesus brings his hearers into the sacred spaces of the home and elaborates in almost frightening detail the deep divisions that will erupt among family members as they respond to him and his message (see 21:16; Micah 7:6'
  - where: 'note 12:50 “A baptism, and a Savior hard pressed”'
    claim: '“Straitened” means hard pressed or distressed; one of few verses showing Jesus’ inner anxiety at His coming suffering'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'This expression might be better rendered, “how hard pressed I am” or “how great is my distress.”132 Significantly, this verse reveals some of the inner anxiety that Jesus experiences at the prospect of his future suffering … Very few verses hint at this anxiety (see Matt. 20:22; 26:38; Mark 10:38; 14:33–34; John 12:27–28).'
  - where: 'note 12:50 “A baptism, and a Savior hard pressed”'
    claim: '“Accomplished” (teleō) means to complete, bring to perfection'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'be accomplished: The verb (Greek teleō) means “to complete, to bring to perfection,” with a sense of consecrated action'
  - where: 'note 12:50 “A baptism, and a Savior hard pressed”'
    claim: 'The baptism is His Atonement, which no one else has to face; bleeding from every pore (Mosiah 3:7)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'no one else has to face what he does, for it is his “baptism to be baptized with” (12:50)— … The price of suffering that he pays for all, bleeding from “every pore” (Mosiah 3:7; D&C 19:18; see the Note on 22:44)'
  - where: 'note 12:50 “A baptism, and a Savior hard pressed”'
    claim: 'Contrast with the rich fool: Jesus marched toward His death, giving God all He had'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'In direct contrast to the rich fool who hoarded the things of the world prior to his unsuspected death, Jesus purposefully marched toward his death, deliberately giving God all that he had and was—including his life and the fullest measure of his will'
  - where: 'note 12:56 “Reading the sky, missing the time”'
    claim: '“Heat” is probably the burning desert wind (compare James 1:11)'
