    url: 'https://biblehub.com/greek/2540.htm'
    quote: 'is equivalent to what time brings, the state of the times, the things and events of time: Luke 12:56'
  - where: 'note 12:56 “Reading the sky, missing the time”'
    claim: 'They did not discern the crisis; it was the time of their visitation (Luke 19:44)'
