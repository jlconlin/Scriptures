    quote: 'To those who, ever ready to interpret the signs of the weather yet remained willfully blind to the important developments of the times, He applied the caustic epithet, hypocrites!'
  - where: 'note 12:58 “Settle on the way”'
    claim: 'The verse opens “for”; the duty is to be reconciled with God before the consequences ensue'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/12.htm'
    quote: 'When thou goest] Rather, For as thou goest. Our translators omitted the “for” probably because they could not see the connexion. It seems however to be this. ‘For this is your clear duty,—to reconcile yourselves with God, as you would with one whom you had alienated, before the otherwise inevitable consequences ensue.’'
