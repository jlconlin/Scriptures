chapter: 12
claims:
  - where: when
    claim: 'The occasion falls during the journey to Jerusalem'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'Later during his journey to Jerusalem, the Savior was surrounded by “an innumerable multitude of people” (Luke 12:1).'
  - where: setting
    claim: 'The teachings of chapter 12 are bracketed by the hostile exchange that ends chapter 11 and the news of 13:1–5'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'the teachings of the Savior that he gathers into chapter 12 are bracketed by the noisy exchange that ends chapter 11 (see 11:39–54) and the dual news of Pilate’s execution of some fellow Galileans and a terrible accident in Jerusalem (see 13:1–5).'
  - where: setting
    claim: 'Jesus turns from one audience to another, disciples (12:4, 22) and the crowd (12:13–14, 54)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'the observation that he turns from one audience to another, from disciples (see 12:4, 22) to members of the accompanying crowd (see 12:13–14, 54),32 suggests a vivid memory of the occasion'
  - where: setting
    claim: 'Matthew and Luke differ in order; it is an easy step to see Jesus giving similar teachings on different occasions'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'From this view, it is an easy step to surmise that Jesus gives similar teachings on different occasions, as the settings in each Gospel imply.'
  - where: setting
    claim: 'D&C 45:16 points to prior conversations about the signs of His coming; the JST supports His speaking of such things earlier'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'Jesus says to the Twelve: “As ye have asked of me concerning the signs of my coming,” a pointer to prior conversations about this topic (D&C 45:16).'
  - where: setting
    claim: 'The JST adds a long verse supporting the view that Jesus speaks of the last days earlier in His ministry'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'By adding a long and significant verse, for instance, the Joseph Smith Translation supports a view that Jesus speaks earlier in his ministry about such subjects'
  - where: setting
    claim: 'The JST’s additions in 12:41–57 (appendix) and 12:9–12'
    key: jst-luke-12
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/12?lang=eng'
    quote: '§ JST, Luke 12:41–57. Compare Luke 12:37–48 Jesus teaches that His servants must always be ready for His coming.'
  - where: thread
    claim: 'God’s influence in our lives binds the first half of the chapter (12:1–34), with the question how to view the goods of this world'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'the theme of God’s enwrapping influence in our lives binds unity into the first half of this chapter (see 12:1–34). … A second theme wraps itself around these verses, securing tightly the answer to the question, How do we view the goods of this world?'
  - where: thread
    claim: 'From 12:35 the stories focus on readiness to the end of the chapter'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'The first verse of this section (12:35) changes the focus of the Savior’s words and introduces a series of stories that focus on readiness and stretch to the end of the chapter (see 12:35–59).'
  - where: thread
    claim: 'In 12:49–59 Jesus raises His own suffering and death and the decision it demands'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'The Savior raises the warning of waxing warmth by kindling the looming prospect of his own suffering and death, and what this means for people’s decisions about him.'
  - where: 'section 3 plain'
    claim: '“Stature” in 12:25 usually means age; the sense is adding to one’s length of life'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: '12:25 stature: The term usually touches on a person’s age (Greek hēlikia).59'
  - where: 'note 12:1 “The leaven of hypocrisy”'
    claim: 'Leaven, generally a lump of old dough, is as a rule a symbol of sin in the New Testament, Luke 12:1 among the instances'
    key: bd-leaven
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/leaven?lang=eng'
    quote: 'Anything that in cooking produces fermentation, a lump of old dough being generally used. … In the New Testament it was as a rule symbolic of sin (Matt. 16:6; Mark 8:15; Luke 12:1; 1 Cor. 5:7; Gal. 5:9)'
  - where: 'note 12:1 “The leaven of hypocrisy”'
    claim: 'Hypocrisy here is the simulation, conscious or unconscious, of a holiness not possessed; the worst does not know itself'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/12.htm'
    quote: 'Here, however, the leaven is more definitely specified as “hypocrisy”—i.e., unreality, the simulation, conscious or unconscious, of a holiness which we do not possess. … the worst hypocrisy was that which did not know itself to be hypocritical.'
  - where: 'note 12:1 “The leaven of hypocrisy”'
    claim: 'At the Pharisee’s table Jesus had criticized cleaning cups outside while the inside is left filthy'
    key: talmage-jesus-christ-26
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-26?lang=eng'
    quote: 'Jesus utilized the occasion by voicing a pungent criticism of Pharisaic externalism, which He likened to the cleansing of cups and platters on the outside, while the inside is left filthy.'
  - where: 'note 12:1 “The leaven of hypocrisy”'
    claim: 'The recent scene at the Pharisee’s table gave the warning its point'
    key: talmage-jesus-christ-26
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-26?lang=eng'
    quote: 'Jesus warned them of the leaven of the Pharisees, which He characterized as hypocrisy. The recent scene at the table of a Pharisee gave special significance to the warning.'
  - where: 'note 12:1 “The leaven of hypocrisy”'
    claim: 'Luke 11:39 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'Now do ye Pharisees make clean the outside of the cup and the platter; but your inward part is full of ravening and wickedness.'
  - where: 'note 12:1 “The leaven of hypocrisy”'
    claim: 'D&C 1:3 (the footnote at Luke 12:3) as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/1?lang=eng'
    quote: 'And the rebellious shall be pierced with much sorrow; for their iniquities shall be spoken upon the housetops, and their secret acts shall be revealed.'
  - where: 'note 12:5 “Whom to fear”'
    claim: 'The one to fear is God, who has power to cast into hell; an allusion to the final judgment'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: '12:7 Fear not: In contrast to his warning to fear God who “hath power to cast into hell” (12:5), Jesus offers his glowing guarantee of God’s ultimate concern and love.'
  - where: 'note 12:5 “Whom to fear”'
    claim: '“Hath power to cast into hell” alludes to the final judgment'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'This warning is a strong signal that the main topic of Jesus’ words has to do with the end of time since it speaks of “him, which . . . hath power to cast into hell,” an allusion to the final judgment'
  - where: 'note 12:5 “Whom to fear”'
    claim: '“Hell” in 12:5 is Gehenna'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'fear the one who, after killing you, has power to throw you into Gehenna. Yes, I tell you, fear him.'
  - where: 'note 12:5 “Whom to fear”'
    claim: 'The valley of Hinnom (Gehenna) was associated with burning and the wrath of God, still in New Testament times'
    key: sc-knowhy-81
    url: 'https://scripturecentral.org/knowhy/why-do-the-scriptures-compare-hell-to-an-unquenchable-fire'
    quote: 'the valley of Hinnom (Gehenna) was associated with burning, destruction and the fiery wrath of God in the minds of the inhabitants of Jerusalem. This was clearly still the case in New Testament times.'
  - where: 'note 12:5 “Whom to fear”'
    claim: '“My friends” appears nowhere else in Luke; John and the D&C use it of apostles; here likely aimed at the Twelve'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'my friends: These words of endearment appear nowhere else in this Gospel … Only John preserves the warm greeting “my friends,” which Jesus extends specifically to the Apostles who “do whatsoever I command” (John 15:14). … may well be aimed particularly at the Twelve.'
  - where: 'note 12:5 “Whom to fear”'
    claim: 'Jesus does not fear those who will kill Him; death is not the end of existence'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'This instruction may well point to Jesus’ own looming death at the hands of others. He does not fear them because, as soon as he dies, they can exercise no more power over him … Death, in his view, does not bring an end to a person’s existence.'
  - where: 'note 12:5 “Whom to fear”'
    claim: 'The valley of Hinnom circles the southern edge of Jerusalem'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'in reference to the Valley of Hinnom that circles the southern edge of Jerusalem'
  - where: 'note 12:10 “Why a word against the Son of man is forgiven”'
    claim: 'JST 12:9 as quoted'
    key: jst-luke-12
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/12?lang=eng'
    quote: 'But he who denieth me before men, shall be denied before the angels of God.'
  - where: 'note 12:10 “Why a word against the Son of man is forgiven”'
    claim: 'JST: the disciples had spoken evil of Him from fear, and feared they would not be forgiven'
    key: jst-luke-12
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/12?lang=eng'
    quote: 'Now his disciples knew that he said this, because they had spoken evil against him before the people; for they were afraid to confess him before men. And they reasoned among themselves, saying, He knoweth our hearts, and he speaketh to our condemnation, and we shall not be forgiven.'
  - where: 'note 12:10 “Why a word against the Son of man is forgiven”'
    claim: 'JST 12:12 adds “and repenteth”'
    key: jst-luke-12
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/12?lang=eng'
    quote: 'Whosoever shall speak a word against the Son of man, and repenteth, it shall be forgiven him; but unto him who blasphemeth against the Holy Ghost, it shall not be forgiven him.'
  - where: 'note 12:10 “Why a word against the Son of man is forgiven”'
    claim: 'The saying answers the disciples’ fear; “and repenteth” makes forgiveness conditional on repentance'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'In a vivid sense, this brief addition makes all the difference. Forgiveness will come to one who “shall speak a word against the Son of man” only if that person repents.'
  - where: 'note 12:10 “Why a word against the Son of man is forgiven”'
    claim: 'The promise looks to Peter’s denial and his forgiveness'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'A person need look no further than Peter’s denial.34 In this account, three times Peter denies the Savior in strong language (see 22:55–60). Can Peter obtain forgiveness for such an act?'
  - where: 'note 12:10 “Why a word against the Son of man is forgiven”'
    claim: 'Joseph Smith on the sin against the Holy Ghost'
    key: jsp-discourse-1844-04-07
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-7-april-1844-as-published-in-times-and-seasons/5'
    quote: 'All sins shall be forgiven except the sin against the Holy Ghost: after a man has sinned against the Holy Ghost there is no repentance for him, he has got to say that the sun does not shine, while he sees it, he has got to deny Jesus Christ when the heavens were open to him'
  - where: 'note 12:10 “Why a word against the Son of man is forgiven”'
    claim: 'D&C 76:35 and Luke 22:55–60 as quoted and cited'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/76?lang=eng'
    quote: 'Having denied the Holy Spirit after having received it'
  - where: 'note 12:12 “Given in the hour it is needed”'
    claim: 'The promise first given to the Twelve is extended to all whom the Lord calls His friends'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/12.htm'
    quote: 'What had been a special promise to the Twelve is now extended to all whom the Lord calls His friends.'
  - where: 'note 12:12 “Given in the hour it is needed”'
    claim: 'Moses protested that he was slow of speech (Ex. 4:10; the footnote at Luke 12:12 gives Ex. 4:12)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/4?lang=eng'
    quote: 'but I am slow of speech, and of a slow tongue.'
  - where: 'note 12:12 “Given in the hour it is needed”'
    claim: 'Ex. 4:12 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/4?lang=eng'
    quote: 'Now therefore go, and I will be with thy mouth, and teach thee what thou shalt say.'
  - where: 'note 12:12 “Given in the hour it is needed”'
    claim: 'D&C 24:6 (the footnote at Luke 12:12) as quoted, to Joseph Smith'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/24?lang=eng'
    quote: 'And it shall be given thee in the very moment what thou shalt speak and write, and they shall hear it, or I will send unto them a cursing instead of a blessing.'
  - where: 'note 12:12 “Given in the hour it is needed”'
    claim: 'D&C 100 was given to Joseph Smith and Sidney Rigdon while away from their families'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/100?lang=eng'
    quote: 'Revelation given to Joseph Smith the Prophet and Sidney Rigdon, at Perrysburg, New York, October 12, 1833. The two brethren, having been absent from their families for several days, felt some concern about them.'
  - where: 'note 12:12 “Given in the hour it is needed”'
    claim: 'D&C 100:6 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/100?lang=eng'
    quote: 'For it shall be given you in the very hour, yea, in the very moment, what ye shall say.'
  - where: 'note 12:12 “Given in the hour it is needed”'
    claim: 'D&C 84:85 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'Neither take ye thought beforehand what ye shall say; but treasure up in your minds continually the words of life, and it shall be given you in the very hour that portion that shall be meted unto every man.'
  - where: 'note 12:14 “Why Jesus would not divide the inheritance”'
    claim: 'The man demands a judgment in his favor; “speak” is imperative'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'The man who makes the request has already fallen into the grasp of greed and essentially demands that Jesus render a judgment on property that is in favor of the man against his brother. To this demand—the verb “to speak” is in the imperative (12:13)'
  - where: 'note 12:14 “Why Jesus would not divide the inheritance”'
    claim: 'Inheritance had established laws and customs needing no heavenly intervention; Jesus respects custom and law, as with tribute to Caesar'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'The laws and customs for such matters are already in place and do not require special intervention, a heavenly intervention in this case, because of who Jesus is. … Within Jesus’ response stands a firm respect for custom and law in his society, aspects that he will not overturn, as in the case of paying taxes to Caesar (see 20:21–25).'
  - where: 'note 12:14 “Why Jesus would not divide the inheritance”'
    claim: 'Instead of settling the dispute He addressed the root of the problem, covetousness'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'Instead of settling this dispute over temporal goods, the Savior addressed the root of the problem while warning the crowd: “Take heed, and beware of covetousness'
  - where: 'note 12:20 “God calls him a fool”'
    claim: 'aphrōn: without reason, senseless, acting rashly (Luke 12:20)'
    key: thayer
    url: 'https://biblehub.com/greek/878.htm'
    quote: 'properly, without reason ((εἴδωλα, Xenophon, mem. 1, 4, 4); of beasts, ibid. 1, 4, 14), senseless, foolish, stupid; without refection or intelligence, acting rashly: Luke 11:40; Luke 12:20'
  - where: 'note 12:20 “God calls him a fool”'
    claim: '“Required” is literally “they require thy soul of thee,” an impersonal idiom'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/12.htm'
    quote: 'Thy soul shall be required.—Literally, they require thy soul of thee. The idiom, as in Luke 12:48, and Luke 14:35, is impersonal, and does not require us to supply any definite nominative.'
  - where: 'note 12:20 “God calls him a fool”'
    claim: 'The verb means to demand back; the soul, entrusted by God for a time, is demanded back'
    key: thayer
    url: 'https://biblehub.com/greek/523.htm'
    quote: 'to ask back, demand back, exact something due … thy soul, intrusted to thee by God for a time, is demanded back, Luke 12:20'
  - where: 'note 12:20 “God calls him a fool”'
    claim: 'How God’s voice came to him is not told'
    key: talmage-jesus-christ-26
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-26?lang=eng'
    quote: 'Whether the voice of God came to him as a fearsome presentiment of impending death, or by angel messenger, or how otherwise, we are not informed'
  - where: 'note 12:20 “God calls him a fool”'
    claim: 'psychē means life in Luke 12:20, 22, 23'
    key: thayer
    url: 'https://biblehub.com/greek/5590.htm'
    quote: 'b. life: μέριμναν τῇ ψυχή, Matthew 6:25; Luke 12:22;'
  - where: 'note 12:20 “God calls him a fool”'
    claim: 'psychē means life in Luke 12:20, 23 (the same entry)'
    key: thayer
    url: 'https://biblehub.com/greek/5590.htm'
    quote: 'add, Matthew 6:25; Mark 3:4; Luke 6:9; Luke 12:20, 23'
  - where: 'note 12:20 “God calls him a fool”'
    claim: 'The rich man might have learned what Solomon did, the vanity of hoarding wealth for another'
    key: talmage-jesus-christ-26
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-26?lang=eng'
    quote: 'Had he been other than a fool he might have realized as Solomon had done, the vanity of hoarding wealth for another, and he perhaps of uncertain character, to possess.'
  - where: 'note 12:20 “God calls him a fool”'
    claim: 'Eccl. 2:18–19 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/2?lang=eng'
    quote: 'And who knoweth whether he shall be a wise man or a fool? yet shall he have rule over all my labour wherein I have laboured'
  - where: 'note 12:21 “Not rich toward God”'
    claim: 'The man uses I and my eleven times; he did not recognize the source of his riches; he was condemned not for storing but for failing to prepare spiritually'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'the rich man uses the first person singular pronouns I and my 11 times, revealing the man’s concern with self. … Ultimately the man was condemned not for the wise practice of storing temporal provisions, but for failing to prepare spiritually for the future.'
  - where: 'note 12:21 “Not rich toward God”'
    claim: 'He did not acknowledge that “the ground” brought forth'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'In no way did he acknowledge, as the Savior did, that it was “the ground” that “brought forth plentifully” (v. 16), nor did he thank the Lord for creating the earth in which his crops grew.'
  - where: 'note 12:21 “Not rich toward God”'
    claim: 'Not rich toward God, he lost both his earthly treasure and the treasure in the heavens of verse 33'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'Being “not rich toward God” (v. 21), the man was eventually deprived not only of the treasure he had temporarily accumulated on earth, but also of “a treasure in the heavens that faileth not” (v. 33).'
  - where: 'note 12:21 “Not rich toward God”'
    claim: 'The landowner does not understand he is steward, not owner'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'Plainly, the landowner does not understand that he is the steward of the goods that have come to him, not their owner (see 12:15).'
  - where: 'note 12:21 “Not rich toward God”'
    claim: 'Laying up treasure condemns only when for its own sake, without regard to the kingdom or the source of wealth'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'The act of laying up treasure for oneself does not bring condemnation unless it is undertaken for its own sake without the broader view of the needs of the kingdom and a recognition of the source of that wealth'
  - where: 'note 12:22 “Said again, in another setting”'
    claim: 'The order in Matthew and Luke differs; D&C 84:81–84 has the same words in a completely different order'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'This observation finds corroboration in seeing the close connections between Jesus’ words recorded in Matthew 6:19–21 and 6:25–34 and the Savior’s language in Doctrine and Covenants 84:81–84, but in a completely different order.'
  - where: 'note 12:22 “Said again, in another setting”'
    claim: 'Jesus turns to the disciples with lessons for their full-time service, as with the Nephite Twelve (3 Ne. 13:25–33)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: 'Jesus turns back to his disciples from “the company” (12:13), drawing up lessons for their future, full-time service and assuring them of God’s constant care in their activities, just as he will do among his Twelve in the New World (see 3 Ne. 13:25–33).'
  - where: 'note 12:22 “Said again, in another setting”'
    claim: '“Stature” usually means age; Jesus speaks of extending the length of life'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-12-104'
    quote: '12:25 stature: The term usually touches on a person’s age (Greek hēlikia).59 … In the Greek meaning, Jesus draws attention to a person trying to extend the length of life merely by thinking about it.'
  - where: 'note 12:22 “Said again, in another setting”'
    claim: 'Jesus carries on the themes of the rich fool as He tells the disciples to trust God for temporal needs'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'The Savior continued the themes he addressed in the parable of the rich fool as he instructed his disciples to trust in God for their temporal needs (see Luke 12:22−34)'
  - where: 'note 12:24 “Why ravens?”'
    claim: 'Luke’s “ravens” is more specific than Matthew’s “fowls”; perhaps a reference to Job 38:41'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/12.htm'
