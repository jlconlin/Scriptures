chapter: 20
claims:
  - where: setting
    claim: 'Jerusalem and the temple were full of Passover pilgrims, the audience for the debates'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Both days’ teachings took place in a Jerusalem and temple that were teeming with pilgrims who had come for the Passover festival. These crowds were the audience for the verbal sparring between the Jerusalem authorities and Jesus.'
  - where: setting
    claim: 'Luke presents the events as one of Jesus’s ordinary teaching days in Jerusalem'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-20-104'
    quote: 'Luke fixes the following events as if occurring on one of Jesus’ typical teaching days in Jerusalem.'
  - where: thread
    claim: 'The chapter is about authority and inheritance, from the challenge to Jesus’s authority to the warning about the scribes'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-20-104'
    quote: 'the scent from this chapter arises from the pressing issues of authority and inheritance that the Savior will meet in the capital city'
  - where: thread
    claim: 'The tenants do not own the vineyard; they are Israel’s leaders'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'This makes the tenants, who, importantly, do not own the vineyard but are only responsible for caring for it, the leaders of Israel throughout her history, up to and including the very Jerusalem leadership now opposing Jesus.'
  - where: 'note 20:1 “The chief priests, the scribes and the elders”'
    claim: 'Who the chief priests, scribes and elders were'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'the chief priests, who would have included the current high priest, earlier holders of that position, and perhaps the heads of the leading priestly families; the scribal experts on the law, including important Pharisees; and the elders of the people, who represented the lay nobility'
  - where: 'note 20:1 “The chief priests, the scribes and the elders”'
    claim: 'They made up the Sanhedrin, court and civil body; the same three groups as the first passion prediction'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'These were the main groups that made up the Sanhedrin, the council that not only served as the supreme Jewish law court but also the chief civil body under the Roman occupation. Significantly, these are the very three groups that Jesus mentioned in his first passion prediction'
  - where: 'note 20:1 “The chief priests, the scribes and the elders”'
    claim: '“Came upon” means to arrive and stand near; here to interrupt and intimidate'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-20-104'
    quote: 'The verb (Greek ephistēmi) bears the sense of standing nearby, often arriving suddenly (see 2:9, 38; 21:34; 24:4). In this passage, the officials stand near with the intent to interrupt and intimidate'
  - where: 'note 20:1 “The chief priests, the scribes and the elders”'
    claim: 'Their arriving together hints at a prior meeting on strategy'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-20-104'
    quote: 'the fact that representatives all appear at Jesus’ side at the same time hints at a prior meeting wherein they develop strategy about how to respond to this man from Nazareth'
  - where: 'note 20:1 “The chief priests, the scribes and the elders”'
    claim: '“These things” refers to the cleansing of the temple'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-20-104'
    quote: 'The reference has to be to Jesus’ action of cleansing the temple on the prior Sunday afternoon, an act that sends shudders throughout official circles.'
  - where: 'note 20:1 “The chief priests, the scribes and the elders”'
    claim: 'The Sadducees regarded the cleansing of the temple as an infringement of their rights'
    key: bd-sadducees
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sadducees?lang=eng'
    quote: 'Their opposition to our Lord was the result of His action in cleansing the temple, which they regarded as an infringement of their rights.'
  - where: 'note 20:4 “A question about John that answers theirs”'
    claim: 'Countering one question with another was the rulers’ own method'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'He availed Himself of a method very common among themselves—that of countering one question with another.'
  - where: 'note 20:4 “A question about John that answers theirs”'
    claim: 'If they granted John was from God, Jesus would ask why they had not accepted John’s testimony of Him'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'Should they answer that John’s baptism was of God, Jesus would probably demand of them why then they had not believed in the Baptist, and why they did not accept John’s testimony concerning Himself.'
  - where: 'note 20:4 “A question about John that answers theirs”'
    claim: 'The rulers weighed only what each answer would cost; no attempt to find the truth'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'They consulted among themselves as to what answer would best serve to extricate them from an embarrassing position; no mention is made of any attempt to ascertain the truth and reply accordingly'
  - where: 'note 20:4 “A question about John that answers theirs”'
    claim: 'Men who could not say whether John was a prophet could not judge Jesus’s authority'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/20.htm'
    quote: 'This was equivalent to the question—with which surely the teachers of Israel should at once have been provided with an answer—was the Baptist a prophet or a seducer? If they could not answer this question they were obviously incompetent to decide as to the authority by which He worked.'
  - where: 'note 20:4 “A question about John that answers theirs”'
    claim: 'JST Matthew 21:33: he that believed not John concerning me cannot believe me'
    key: jst-matt-21
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/21?lang=eng'
    quote: 'For he that believed not John concerning me, cannot believe me, except he first repent.'
  - where: 'note 20:6 “All the people will stone us”'
    claim: 'Luke gives the vivid form of the fear; the people of Jerusalem were ready to stone (John 8:59; 10:31; Acts 7:58–59)'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/20.htm'
    quote: 'St. Luke gives the more vivid utterance in place of the more general “we fear the people” in the other Gospels. As indicating the readiness of the people of Jerusalem to proceed to extremities of this kind, we may refer to their treatment of our Lord (John 8:59; John 10:31) and Stephen (Acts 7:58-59).'
  - where: 'note 20:6 “All the people will stone us”'
    claim: 'John’s influence reached beyond the Jordan, perhaps more as a martyr; “all the people” may be residents or pilgrims'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-20-104'
    quote: 'John’s influence reaches well beyond the areas of his ministry at and near the Jordan River … Perhaps his reputation grows because of his status as a martyr. It is not clear from Luke whether “all the people” includes mainly those residing in the capital city or chiefly those who are visiting Jerusalem for the feast'
  - where: 'note 20:9 “The vineyard and its tenants”'
    claim: 'The vineyard represented Israel; the hedge, wine trough and tower link it with Isaiah 5'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Testament prophecy represented, like fig or olive trees, the house of Israel (see Ps 80:8–11; Isa 5:1–7; 27:2–6; Jer 2:21; 12:10; Ezek 19:10–14; Hos 10:1). Some of its details—surrounding the vineyard with a protective wall or hedge, digging a wine trough, and building a watchtower—linked it particularly with the song of the Lord’s vineyard in Isaiah 5.'
  - where: 'note 20:9 “The vineyard and its tenants”'
    claim: 'Owner God, son Jesus, servants prophets, tenants the leaders'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Hence, the owner was God, the son is Jesus, and the previous servants were the prophets whom the Lord had sent to Israel. This makes the tenants, who, importantly, do not own the vineyard but are only responsible for caring for it, the leaders of Israel'
  - where: 'note 20:9 “The vineyard and its tenants”'
    claim: 'Luke abbreviates to the planting; Mark has the Isaiah 5 details'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-20-104'
    quote: 'Luke’s report of the parable abbreviates Jesus’ words to the simple act of planting, whereas Mark 12:1 bears the expanded version: planting a vineyard, setting a hedge, digging a wine press, and erecting a tower, all in accord with Isaiah 5:2.'
  - where: 'note 20:9 “The vineyard and its tenants”'
    claim: 'Behind the story may lie foreign owners who left estates to local tenants, who far from Judea often resented owners seen as standing for Rome'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-20-104'
    quote: 'In the background may be the rather common practice of foreign owners of property in ancient Palestine who manage affairs from afar and put the day-to-day care into the hands of local tenants. In areas distant particularly from Judea and the capital city, these tenants often come to bear ill will against the owners who are seen as representing the dominating Romans.'
  - where: 'note 20:9 “The vineyard and its tenants”'
    claim: '“Let it forth” is a formal legal agreement with a share of the harvest due the owner'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-20-104'
    quote: 'The verb (Greek ekdidōmi), when applied to human interactions, carries the sense of a formal legal agreement, “to give out,” in this case the renters agreeing to stipulations about the distribution of the harvest, with a certain portion going to the owner'
  - where: 'note 20:9 “The vineyard and its tenants”'
    claim: 'The footnote glosses husbandmen as farmers'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/20?lang=eng'
    quote: '9b “husbandmen”: GR farmers.'
  - where: 'note 20:13 “My beloved son”'
    claim: '“Beloved” is the Father’s word at the baptism and the Transfiguration; the owner is God and the son Jesus'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'the owner sends his son, who in Mark is his one, “well-beloved son” (Greek, agapēton). This is the very term used on two other occasions by the Father of Jesus, at his baptism and at the Transfiguration (Mark 1:11; 9:7). Hence, the owner was God, the son is Jesus'
  - where: 'note 20:13 “My beloved son”'
    claim: 'Jesus’s teaching about His own divine dignity grew more distinct as the end approached; “it may be” is “perhaps”; it marks the tenants’ free will and the enormity of the crime'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/20.htm'
    quote: 'Our Lord’s teaching respecting His own divine dignity advanced in distinctness as the end was approaching. it may be] Literally, “perhaps.” It occurs here alone in the N. T. … it (i) indicates their free will, and (ii) enhances their awful crime to represent it as having seemed all but inconceivable.'
  - where: 'note 20:13 “My beloved son”'
    claim: 'The doubt in “it may be” is peculiar to Luke'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/20.htm'
    quote: 'The doubt implied in the qualification is a feature peculiar to St. Luke’s report.'
  - where: 'note 20:13 “My beloved son”'
    claim: 'Cast out of the vineyard: not to be pressed, but a hint of the crucifixion outside the city'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/21.htm'
    quote: 'The minor touches of a parable are not always to be pressed in our interpretation of it; but we can hardly help seeing here a latent reference to the facts … (2) that He was crucified outside the Holy City, (John 19:20; Hebrews 13:12)'
  - where: 'note 20:16 “God forbid”'
    claim: 'The footnote glosses “God forbid” as “May it not be”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/20?lang=eng'
    quote: '16a “God forbid”: GR May it not be.'
  - where: 'note 20:16 “God forbid”'
    claim: 'God is not named in the Greek; a negative Amen; in the Gospels only here; Paul uses it often'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/20.htm'
    quote: 'it is worth remembering that the name of God does not appear in the original, and that the ejaculation is simply, as it were, a negative Amen, “So be it not.” Its insertion hero is peculiar to St. Luke, nor does it occur elsewhere in the Gospels. St. Paul uses it frequently'
  - where: 'note 20:16 “God forbid”'
    claim: 'Who said it is not told'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'We gather from Luke’s account that in contemplation of this awful penalty, “they,” whether priestly rulers or common people we are not told, exclaimed in despair, “God forbid!”'
  - where: 'note 20:16 “God forbid”'
    claim: 'One reading hears the groan of a people learning it was to be rejected'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/20.htm'
    quote: 'God forbid] Literally, “Might it not be!” Heb. Chalilah. In this utterance we hear the groan oi the Jewish people when the truth that they were indeed to be rejected burst upon them.'
  - where: 'note 20:17 “The rejected stone”'
    claim: 'Psalm 118 ties the parable to the triumphal entry, where the crowd used that psalm'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Both Mark and Matthew have Jesus end his parable with a reference to Psalm 118, creating a connection with the triumphal entry during which the crowds acclaimed Jesus with a line from that very psalm.'
  - where: 'note 20:17 “The rejected stone”'
    claim: 'JST Matthew: “I am the stone”'
    key: jst-matt-21
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/21?lang=eng'
    quote: 'Verily, I say unto you, I am the stone, and those wicked ones reject me.'
  - where: 'note 20:17 “The rejected stone”'
    claim: 'Jacob, like Peter, reads these passages of Christ as sure foundation or stumbling block; Luke 20:17–18 uses them so'
    key: sc-knowhy-535
    url: 'https://scripturecentral.org/knowhy/why-new-testament-words-and-phrases-are-in-the-book-of-mormon-part-6-why-do-similar-clusters'
    quote: 'it is evident that Jacob and Peter are using the same set of Old Testament passages, which they interpret as referring to Christ being either a sure foundation or a stumbling block. The New Testament use of these passages in this way occurs not only in 1 Peter, but also in Ephesians 2:20–21 , Romans 9:32–33 , Luke 20:17–18'
  - where: 'note 20:18 “Broken, or ground to powder”'
    claim: 'The footnote glosses “grind him to powder” as “scatter like chaff”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/20?lang=eng'
    quote: '18a “grind him to powder”: GR scatter like chaff.'
  - where: 'note 20:18 “Broken, or ground to powder”'
    claim: 'Likmaō: from the winnowing fan; to crush to pieces, grind to powder'
    key: thayer
    url: 'https://biblehub.com/greek/3039.htm'
    quote: '3. to crush to pieces, grind to powder: τινα, Matthew 21:44 (R G L brackets WH brackets); Luke 20:18'
  - where: 'note 20:18 “Broken, or ground to powder”'
    claim: 'The word comes from the winnowing fan; first sense to winnow'
    key: strongs-greek
    url: 'https://biblehub.com/greek/3039.htm'
    quote: 'From likmos, the equivalent of liknon (a winnowing fan or basket); to winnow, i.e. (by analogy), to triturate -- grind to powder.'
  - where: 'note 20:18 “Broken, or ground to powder”'
    claim: 'Many interpreters refer the examples of “crush” (Luke 20:18 among them) to the sense “scatter”'
    key: thayer
    url: 'https://biblehub.com/greek/3039.htm'
    quote: 'Many decline to follow the rendering of the Vulg. (conterere, comminuere), but refer the examples under this head to the preceding.'
  - where: 'note 20:18 “Broken, or ground to powder”'
    claim: 'Falling on the stone recalls Isaiah 8:14–15; “grind to powder” is literally “winnow,” with reference to the stone of Daniel 2:35'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/20.htm'
    quote: 'shall fall upon that stone] as the Jews did from the first, 1 Corinthians 1:23. See Isaiah 8:14-15. … it will grind him to powder] Literally, “it shall winnow him” (Jeremiah 31:10), with obvious reference to the great Image which ‘the stone cut without hands’ smote and broke to pieces'
  - where: 'note 20:18 “Broken, or ground to powder”'
    claim: 'The broken may in part recover through repentance; on the persistent the stone falls in judgment'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'To some that Stone would be a cause of stumbling; wo unto them, for thereby would they be broken, and only through repentance and works of righteousness could they even in part recover; but upon others, those who would persist in their opposition, the Stone would fall in judgment'
  - where: 'note 20:20 “To the power of the governor”'
    claim: 'Luke’s repeated verb “sent” marks the spies as carrying an official though secret commission'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-20-104'
    quote: 'By repeating the Greek verb apostellō, Luke emphasizes that the spies carry an official commission, though secret, from the authorities'
  - where: 'note 20:20 “To the power of the governor”'
    claim: 'They sought a capital charge before Pilate; first mention of the governor'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-20-104'
    quote: 'They seek a charge that will force Pontius Pilate, the Roman Prefect, to execute Jesus. The authorities are thinking all along of a capital case that will lead to Jesus’ death, not simply to imprisonment.'
  - where: 'note 20:20 “To the power of the governor”'
    claim: 'First mention of the governor, the prefect'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-20-104'
    quote: 'By the way, this is the first mention of “the governor,” that is, “the prefect” (Greek hēgemōn) who serves nominally under the Roman governor in Syria.'
  - where: 'note 20:20 “To the power of the governor”'
    claim: 'The tax question that follows shows the direction the plotters meant to take'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-20-104'
    quote: 'This note, followed by the question about taxes to be paid to Caesar and Rome (see 20:22), tells us the direction that the plotters want to carry matters'
  - where: 'note 20:20 “To the power of the governor”'
    claim: 'An answer against the tribute could be made a charge of advocating resistance to Rome'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'if he said it was not, the Herodians could claim that he was advocating resistance to Roman demands'
  - where: 'note 20:20 “To the power of the governor”'
    claim: 'Though no fault was found in his reply, the establishment convicted him anyway'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'although his opponents could find no civic or spiritual fault in his reply, the political and religious establishment would nonetheless convict him.'
  - where: 'note 20:24 “Caesar’s image on the coin”'
    claim: 'The penny is a denarius, a day’s pay'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-20-104'
    quote: 'The coin is a denarius, the typical pay for a day’s work, although the salary may be less in Palestine'
  - where: 'note 20:24 “Caesar’s image on the coin”'
    claim: 'The poll-tax was the most offensive sign of allegiance to Rome; using Rome’s coins acknowledged its authority'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'for of all acts attesting compulsory allegiance to Rome that of having to pay the poll-tax was most offensive to the Jews.'
  - where: 'note 20:24 “Caesar’s image on the coin”'
    claim: 'Circulating a sovereign’s coins acknowledged his authority; the nation had settled the question'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'the nation, both rulers and people, had settled it, however grudgingly, for they accepted and circulated among themselves the Roman coinage as a common medium of exchange; and it was a criterion of recognition among the Jews that to make current the coins of any sovereign was to acknowledge his royal authority.'
  - where: 'note 20:24 “Caesar’s image on the coin”'
    claim: 'Yes would look disloyal to God and nation; no would look like resistance to Rome'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'If he said that it was permissible to pay the tax, the Pharisees in the delegation could claim that he was betraying God or at least was disloyal to the Jewish nation; if he said it was not, the Herodians could claim that he was advocating resistance to Roman demands.'
  - where: 'note 20:24 “Caesar’s image on the coin”'
    claim: 'The denarius bore Tiberius’s image and an inscription claiming divine sonship and high priesthood'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'the denarius, or Roman coin, with which the tax was paid had both the image of the emperor Tiberius and the inscription “Tiberius Caesar Augustus, son of the deified Augustus, high priest,” which both offended Jewish sensibilities about graven images and claimed divine and priestly prerogatives for Roman rulers that Jews did not support.'
  - where: 'note 20:25 “Render unto Cæsar, and unto God”'
    claim: '“Render” is “give back”; Caesar minted and owned the coin; the greater obligation is to God, who owns all'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'By saying “give back” (Greek, apodote; KJV, “render”),[8] Jesus both acknowledged the civic role of the emperor, who minted, and in a sense still owned, the very coin under discussion, and proclaimed the greater obligation we have to God, since, in truth, all created things belong to him.'
  - where: 'note 20:25 “Render unto Cæsar, and unto God”'
    claim: '“Render” means to pay what is due'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-20-104'
    quote: 'the verb “to render” (Greek apodidōmi) means to pay what is due, in this case what is due to the government (see 10:35; D&C 63:26–27; 98:4).'
  - where: 'note 20:25 “Render unto Cæsar, and unto God”'
    claim: 'Every soul bears God’s image; give God the souls that bear it'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'Every human soul is stamped with the image and superscription of God, however blurred and indistinct the line may have become through the corrosion or attrition of sin; and as unto Cæsar should be rendered the coins upon which his effigy appeared, so unto God should be given the souls that bear His image.'
  - where: 'note 20:25 “Render unto Cæsar, and unto God”'
    claim: 'D&C 63:25–27: the Lord renders unto Caesar and commands the land of Zion purchased'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/63?lang=eng'
    quote: 'Nevertheless, I, the Lord, render unto Cæsar the things which are Cæsar’s. … Wherefore, I the Lord will that you should purchase the lands'
  - where: 'note 20:25 “Render unto Cæsar, and unto God”'
    claim: 'D&C 58:21–22: keep the laws of the land; be subject to the powers that be'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/58?lang=eng'
    quote: 'Wherefore, be subject to the powers that be, until he reigns whose right it is to reign, and subdues all enemies under his feet.'
  - where: 'note 20:27 “The Sadducees’ riddle”'
    claim: 'Only appearance of Sadducees in Luke; they accept only the five books of Moses'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-20-104'
    quote: 'In their only appearance in his Gospel, Luke correctly characterizes Sadducees as people who disdain belief in the resurrection (see Acts 23:8). In addition, they accept only the five books of Moses as scripture'
  - where: 'note 20:27 “The Sadducees’ riddle”'
    claim: 'Who the Sadducees were'
    key: bd-sadducees
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sadducees?lang=eng'
    quote: 'The party consisted of old high-priestly families who came to the front during the Maccabean war. They formed the Jewish aristocracy and were powerful, though quite small in numbers. In their treatment of religious questions they held to the letter of the Mosaic revelation and denied the authority of ancient tradition'
  - where: 'note 20:27 “The Sadducees’ riddle”'
    claim: 'They did not accept immortality'
    key: bd-sadducees
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sadducees?lang=eng'
    quote: 'they refused also to accept the doctrine of immortality as a necessary part of the Jewish faith.'
  - where: 'note 20:27 “The Sadducees’ riddle”'
    claim: 'Levirate from levir; temporary arrangement to father a child for the dead brother; meant to make resurrection look absurd'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Levirate marriage, a term that comes from the term for a husband’s brother (Latin, levir), was a practice established in the law whereby a dead man’s brother, or in this case, brothers, had the obligation of taking the deceased man’s widow in a temporary arrangement only'
  - where: 'note 20:27 “The Sadducees’ riddle”'
    claim: 'The child belonged to the dead brother'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'levirate marriages were only temporary arrangements to begin with—the child conceived “belonged to” the dead brother, and the living brother had no further conjugal rights after the child was born.'
  - where: 'note 20:27 “The Sadducees’ riddle”'
    claim: 'The question was about the resurrection, meant to make it look absurd'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Instead, they were trying to use an extreme example involving the practice of levirate marriage to demonstrate that believing in a resurrection was absurd.'
  - where: 'note 20:27 “The Sadducees’ riddle”'
    claim: 'The levirate law keeps a man from dying without an heir and inheritance'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-20-104'
    quote: 'The concept, called levirate law, stipulates that a man is not to die childless, thus losing for his unborn posterity an inheritance among God’s people, the Israelites'
  - where: 'note 20:35 “Worthy to obtain that world”'
    claim: 'The footnote gives the JST reading'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/20?lang=eng'
    quote: 'JST Luke 20:35 … that world, through resurrection from …'
  - where: 'note 20:35 “Worthy to obtain that world”'
    claim: 'Marital status must be settled before the resurrection under priesthood power to seal'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'In the resurrection there will be no marrying nor giving in marriage; for all questions of marital status must be settled before that time, under the authority of the Holy Priesthood, which holds the power to seal in marriage for both time and eternity.'
  - where: 'note 20:35 “Worthy to obtain that world”'
    claim: 'All but the first brother married her for mortal life only, to perpetuate the dead brother’s name'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'since all except the first had married her for the duration of mortal life only, and primarily for the purpose of perpetuating in mortality the name and family of the brother who first died'
  - where: 'note 20:35 “Worthy to obtain that world”'
    claim: 'Those who obtain that world are the true inheritors of the world to come; compare Luke 14:14'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/20.htm'
    quote: 'to obtain that world] i.e. the genuine inheritors of the future aeon beyond the grave, Luke 14:14; Php 3:11.'
  - where: 'note 20:35 “Worthy to obtain that world”'
    claim: 'The footnote on “marriage” points to D&C 132:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/20?lang=eng'
    quote: '35c “marriage”: D&C 132:16 (7–39).'
  - where: 'note 20:36 “Equal unto the angels, and children of God”'
    claim: 'D&C 132:16–17 on those appointed angels'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/132?lang=eng'
    quote: 'For these angels did not abide my law; therefore, they cannot be enlarged, but remain separately and singly, without exaltation, in their saved condition, to all eternity'
  - where: 'note 20:36 “Equal unto the angels, and children of God”'
    claim: 'Like the angels in immortality, superior in privileges; the word answers the Sadducees’ denial of angels (Acts 23:8)'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/20.htm'
    quote: 'equal unto the angels] Like the angels in being immortal, but superior to them in privileges (Hebrews 1:4; Hebrews 2:5-8). … In this one word our Lord refutes the Sadducean denial of the existence of angels, Acts 23:8'
  - where: 'note 20:36 “Equal unto the angels, and children of God”'
    claim: 'Being counted worthy of that resurrection proves them children of God'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/20.htm'
    quote: 'The fact that men were counted worthy to obtain that resurrection was a proof that they were “children of God,”'
  - where: 'note 20:36 “Equal unto the angels, and children of God”'
    claim: 'The footnote on “angels” points to D&C 131:2 and 132:17'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/20?lang=eng'
    quote: '36a “angels”: D&C 131:2 (1–4); 132:17 (5–17). TG Angels.'
  - where: 'note 20:37 “The God of the living”'
    claim: 'Jesus answers from the law of Moses, the only scripture the Sadducees accept'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-20-104'
    quote: 'Jesus appeals to a passage from the Mosaic law (see Ex. 3:6, 15), the only section of scripture that the Sadducees embrace'
  - where: 'note 20:37 “The God of the living”'
    claim: 'The Sadducees made the title valid only during the patriarchs’ mortal lives'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'yet they denied the possible resurrection of these patriarchs, and made the exalted title, under which the Lord had revealed Himself to Moses, valid only during the brief mortal existence of the progenitors of the Israelitish nation.'
  - where: 'note 20:37 “The God of the living”'
    claim: 'The patriarchs lived in the spirit world; Jesus’s resurrection would overcome death for them'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Not only did Abraham, Isaac, and Jacob continue to live in the spirit world (the Sadducees did not seem to believe in any kind of life after death), but through Jesus’s own resurrection he would overcome physical death for them and for us.'
  - where: 'note 20:37 “The God of the living”'
    claim: 'In bodily death souls still live'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-20-104'
    quote: 'Even in bodily death, human souls still live, as do those of animals (see D&C 77:2).81 All eras of our existence—premortal, mortal, postmortal—are infused with life.'
  - where: 'note 20:37 “The God of the living”'
    claim: '“The living” are those with eternal life, shown fully in the risen Jesus'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-20-104'
    quote: '“the living” (Greek participle zōn) are those filled with eternal life, God’s life, more than simple existence … More specifically, that life will be fully manifested in “the Living One,” the resurrected Jesus as he is later called (see the Note on 24:5).'
  - where: 'note 20:39 “Master, thou hast well said”'
    claim: 'The scribes included important Pharisees'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'the scribal experts on the law, including important Pharisees'
  - where: 'note 20:39 “Master, thou hast well said”'
    claim: 'Pharisees believed in resurrection, angels and spirits'
    key: bd-pharisees
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pharisees?lang=eng'
    quote: 'Their belief included the doctrine of immortality and resurrection of the body and the existence of angels and spirits.'
  - where: 'note 20:39 “Master, thou hast well said”'
    claim: 'These scribes may be open to Jesus, or amazed at an answer that had escaped them'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-20-104'
    quote: 'These persons appear to be quasi disciples who are open to Jesus’ views, perhaps touched in a way that will eventually lead them to his church. It is also possible that their compliment shows their amazement at Jesus’ reply'
  - where: 'note 20:41 “David’s son and David’s Lord”'
    claim: 'The Messiah was expected as a son of David who would redeem Israel'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Contemporary messianic expectations said that the Messiah would be a son of David, a future king of David’s line who would redeem Israel and restore her to greatness.'
  - where: 'note 20:41 “David’s son and David’s Lord”'
    claim: 'David understood the Messiah was more than his descendant, already at God’s right hand'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'David had understood that the Messiah was more than one of his descendants: he was already God’s chosen who sat at his right hand millennia before his birth in the flesh.'
  - where: 'note 20:41 “David’s son and David’s Lord”'
    claim: 'Recast the question: if the Messiah is David’s Lord, how is he David’s son? He is both'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-20-104'
    quote: 'He is both. A helpful way to recast Jesus’ question is, “If the Messiah is David’s Lord, how is he David’s son?” rather than “If the Messiah is David’s son, how is he David’s Lord?”'
  - where: 'note 20:47 “Devouring widows’ houses”'
    claim: 'The most damning charge; no one knows exactly; Mosaic law treated property as an inheritance from God; Micah'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-20-104'
    quote: 'These words form the most damning of Jesus’ criticisms. No one knows exactly what lies behind his concern because he does not say more. … Under law, no person is to speculate in real estate because such property is deemed an inheritance from God'
  - where: 'note 20:47 “Devouring widows’ houses”'
    claim: 'Prophetic complaints about mistreated widows; the only charge more than hypocrisy'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-20-104'
    quote: 'The mistreatment of widows is an old problem, as other prophetic complaints show (see Isa. 1:17, 23; 10:2; Jer. 7:6; Zech. 7:10; etc.)'
  - where: 'note 20:47 “Devouring widows’ houses”'
    claim: 'This charge is the only one more than hypocrisy'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-20-104'
    quote: 'Incidentally, this charge is the only one Jesus levels against the scribes that is more than hypocrisy'
  - where: 'note 20:47 “Devouring widows’ houses”'
    claim: 'The establishment should have supported the poor widow'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'the final sin that condemned the Temple of Herod under its priestly leadership was arguably the exploitation of this poor woman, who gave all she had to the temple when the establishment instead should have been supporting her'
  - where: christ
    claim: 'Jesus’s resurrection would overcome death for the patriarchs and for us'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'through Jesus’s own resurrection he would overcome physical death for them and for us.'
  - where: christ
    claim: 'Give God yourselves, the divine mintage'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'Render unto the world the stamped pieces that are made legally current by the insignia of worldly powers, and give unto God and His service, yourselves—the divine mintage of His eternal realm.'
  - where: christ
    claim: 'D&C 58:21: keep the laws of the land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/58?lang=eng'
    quote: 'Let no man break the laws of the land, for he that keepeth the laws of God hath no need to break the laws of the land.'
  - where: explore
    claim: 'The Savior addresses the Sadducees’ riddle in modern scripture (D&C 132:16–17)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-20-104'
    quote: 'The Sadducees’ riddle is so important that the Savior addresses it in modern scripture (see D&C 132:16–17).'
