chapter: 4
claims:
  - where: setting
    claim: 'The Nazareth reading is in many ways the programmatic passage of the whole Gospel'
    key: huntsman-lukes-jesus
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
    quote: 'In what is in many ways the programmatic passage of the entire Gospel … Jesus takes up the scroll in the synagogue in Nazareth and reads a version of Isaiah 61:1–2'
  - where: setting
    claim: 'Luke’s Nazareth story stands independent of Mark 6 and Matthew 13'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'Rather, we can more readily see Luke recording a story that stands independent of the other accounts in Mark 6 and Matthew 13.'
  - where: setting
    claim: 'Brown: Mark’s visit has disciples and is followed by the sending of the Twelve; unbelief there, fury in Luke'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'The two most compelling elements have to do with the absence of disciples and the reason for Jesus’ departure in Luke’s version.'
  - where: setting
    claim: 'Verse 23 implies Jesus had already been at work in Capernaum during the tour of 4:14–15'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'Verses 4:14–15 inform us that Jesus is active previously in Galilean towns. And from Jesus’ recapitulation of his hearers’ thoughts in this passage, Capernaum is reckoned among them.'
  - where: thread
    claim: 'Power and authority is a chief theme of the chapter, from the temptations to the Nazareth synagogue; word and deed'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'A second chief theme of this chapter focuses tightly on power and authority, a theme unveiled in both the devil’s temptations and Jesus’ experience in the Nazareth synagogue.'
  - where: thread
    claim: 'Jesus resolves the question of authority later, inside synagogues'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'Significantly—and this point is most important—Jesus resolves the question of who truly holds authority and power later, inside synagogues'
  - where: thread
    claim: 'In Luke the Spirit leads Jesus into the wilderness and empowers His deeds (4:1, 14, 18)'
    key: strathearn-gospels
    url: 'https://rsc.byu.edu/vol-8-no-2-2007/distinctive-testimonies-four-gospels'
    quote: 'The Spirit led Jesus into the wilderness to triumph over Satan (see Luke 4:1). The mighty deeds of the Savior are continually performed by the power of the Spirit (see Luke 4:14, 18).'
  - where: 'note 4:1 “Full of the Holy Ghost”'
    claim: 'Jesus carries the Holy Ghost only after baptism; the pattern for disciples (2 Ne. 31); the Holy Ghost undergirds His authority in 4:14, 18'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'We receive the Holy Ghost only after receiving baptism at the hand of one of God’s agents, and the Holy Ghost then accompanies us in our return to our normal lives.'
  - where: 'note 4:1 “Full of the Holy Ghost”'
    claim: 'Luke emphasizes that the work went forward by the power of the Spirit'
    key: strathearn-gospels
    url: 'https://rsc.byu.edu/vol-8-no-2-2007/distinctive-testimonies-four-gospels'
    quote: 'Luke further emphasizes the fact that the spreading of the message of the Savior was not left to chance but was the will of God carried out through the power of the Holy Spirit.'
  - where: 'note 4:2 “Tempted after the forty days”'
    claim: 'JST Luke 4:2: after forty days the devil came to tempt Him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/4?lang=eng'
    quote: 'JST Luke 4:2 And after forty days, the devil came unto him, to tempt him.'
  - where: 'note 4:2 “Tempted after the forty days”'
    claim: 'JST Luke 4:5: the Spirit takes Him up into the mountain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/4?lang=eng'
    quote: 'JST Luke 4:5 And the Spirit taketh him up into a high mountain, and he beheld all the kingdoms'
  - where: 'note 4:2 “Tempted after the forty days”'
    claim: 'JST Luke 4:9: the Spirit brought Him to Jerusalem; then the devil came'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/4?lang=eng'
    quote: 'JST Luke 4:9 And the Spirit brought him to Jerusalem, and set him on a pinnacle of the temple. And the devil came unto him, and said'
  - where: 'note 4:2 “Tempted after the forty days”'
    claim: 'The JST clarifies that the devil did not approach during the forty days; JST Matt. 4:1 “to be with God”; the Spirit, not the devil, carries Him'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'The substituted words clarify that the devil does not approach Jesus during the forty days, in contrast to Luke’s notation. … The expression “to be tempted of the devil” (Matt. 4:1) becomes “to be with God” (JST Matt. 4:1).'
  - where: 'note 4:2 “Tempted after the forty days”'
    claim: 'The forty days compare Jesus with Moses'
    key: huntsman-lukes-jesus
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
    quote: 'As does Matthew, Luke compares Jesus to the prophet Moses by including the forty-day period in the wilderness that precedes the temptation narrative (Luke 4:1–2; compare Matthew 4:1–2).'
  - where: 'note 4:6 “An authority the devil claimed”'
    claim: 'The kingdoms were not Satan’s to give'
    key: hunter-temptations
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1976/10/the-temptations-of-christ?lang=eng'
    quote: 'Though they were not his to give, Satan offered them all to Jesus—to him who had lived as a modest village carpenter.'
  - where: 'note 4:6 “An authority the devil claimed”'
    claim: 'Jesus acknowledges Satan’s counter realm (11:18); Moses refused to worship Satan, who lacked glory (Moses 1:12–15)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'Jesus’ later words plainly acknowledge Satan’s counter realm: “If Satan also be divided against himself, how shall his kingdom stand?” (11:18). That Satan sees his authority as worthy of devotion is apparent in his meeting with Moses'
  - where: 'note 4:6 “An authority the devil claimed”'
    claim: '“Power” in 4:6 is the word for authority; Jesus pushes the claim away with scripture and settles it later in synagogues'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'But rather than taking up the devil’s vacant claims and resolving them on the spot, Jesus simply pushes away the issues by quoting scripture: “it is written.”'
  - where: 'note 4:9 “The last temptation in Jerusalem”'
    claim: 'Matthew ends the temptations on the mountain, Luke at the temple; Luke emphasizes Jerusalem'
    key: strathearn-gospels
    url: 'https://rsc.byu.edu/vol-8-no-2-2007/distinctive-testimonies-four-gospels'
    quote: 'whereas Matthew concludes the Savior’s triumph over the temptations on a high mountain in the wilderness (see Matthew 4:8–10), Luke’s account culminates with the Savior at Herod’s Temple in Jerusalem (see Luke 4:9–12).'
  - where: 'note 4:9 “The last temptation in Jerusalem”'
    claim: 'The final temptation in Jerusalem anticipates the final trial of suffering and death there'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'For Luke, Jesus’ final temptation takes place in Jerusalem just as Jesus’ final trial of facing suffering and death will take place here.'
  - where: 'note 4:12 “Scripture against scripture”'
    claim: 'The “if” throws doubt on Jesus’s status with His Father'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'The demeaning challenge in these words is obvious, throwing doubt on Jesus’ status with his Father (see also 4:9).'
  - where: 'note 4:12 “Scripture against scripture”'
    claim: 'In the devil’s hands Psalm 91 passes as a prophecy of the Messiah’s announcement of Himself'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'This standard line introduces Psalm 91:11–12, a passage that, in the hands of the devil, passes as a prophecy about the Savior’s announcement of himself as Messiah.'
  - where: 'note 4:12 “Scripture against scripture”'
    claim: '“It is said” points to spoken words, the living voice of God; the law weighs more than the Psalms'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'He thus makes his point more vivid, as if he is drawing directly from the living, revealing voice of God, thus placing his answer on a higher level than the written and sung words of the Psalms'
  - where: 'note 4:16 “Standing to read, sitting to teach”'
    claim: 'The Sabbath service: fixed lesson, a lesson from the law and one from the prophets, a sermon; an attendant (4:20)'
    key: bd-synagogue
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/synagogue?lang=eng'
    quote: 'The Sabbath morning service was the most important in the week and included a fixed lesson (Num. 15:37–41; Deut. 6:4–9; 11:13–21) and two lessons for the day, one from the law and the other from the prophets. A sermon was generally preached'
  - where: 'note 4:16 “Standing to read, sitting to teach”'
    claim: 'The attendant'
    key: bd-synagogue
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/synagogue?lang=eng'
    quote: 'There was also an attendant who performed clerical duties (Luke 4:20).'
  - where: 'note 4:16 “Standing to read, sitting to teach”'
    claim: 'Standing to read and sitting to comment: scripture elevated above the comment on it; Luke is the first to note the custom'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'one elevates scripture to read from it because of its spiritual loftiness, and one sits to comment on it because a person’s views about it stand lower than its divine dignity.'
  - where: 'note 4:18 “Anointed: the Christ”'
    claim: 'Anointing identifies Him as Messiah or Christ; both words mean anointed one'
    key: huntsman-lukes-jesus
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
    quote: 'the reference to anointing in the Isaiah 61 passage that Jesus reads identifies him as Messiah or Christ, since the Hebrew māšîaḥ and the Greek christos both mean “anointed one.”'
  - where: 'note 4:18 “Anointed: the Christ”'
    claim: 'Jesus presented as chosen, authorized and sent to preach through a ministry to the poor, sick and marginalized'
    key: huntsman-lukes-jesus
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
    quote: 'he presents Jesus as the one especially chosen, authorized, and sent to preach the good news of the kingdom through a ministry to the poor, sick, and marginalized.'
  - where: 'note 4:18 “Anointed: the Christ”'
    claim: 'The words recall the baptism, where the Father sent the Holy Ghost; His authority comes from the Father'
    key: sc-knowhy-656
    url: 'https://scripturecentral.org/knowhy/why-does-jesus-announce-that-isaiah-611-2-is-fulfilled'
    quote: 'By doing so, Jesus proclaims where His authority originates early on in Luke’s Gospel: from the Father, who sent the Holy Ghost upon Jesus at His baptism and declared from heaven Jesus’s divine identity.'
  - where: 'note 4:18 “Anointed: the Christ”'
    claim: 'The passage was understood as messianic'
    key: sc-knowhy-656
    url: 'https://scripturecentral.org/knowhy/why-does-jesus-announce-that-isaiah-611-2-is-fulfilled'
    quote: 'these verses were clearly understood “to be a messianic prophecy, at least partially because the verse begins by saying that the speaker has been anointed (Messiah means ‘anointed one’).”'
  - where: 'note 4:18 “Anointed: the Christ”'
    claim: 'The quotation follows the Septuagint of Isaiah 61:1–2 with minor variations'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'Beginning with this line, the quotation comes from the Septuagint version of Isaiah 61:1–2, with a few minor variations, probably because Luke is quoting from memory.'
  - where: 'note 4:18 “Anointed: the Christ”'
    claim: '“To set at liberty them that are bruised” comes from Isaiah 58:6'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'The literal meaning is “to send forth the broken into freedom.” This line does not come from Isaiah 61 but from Isaiah 58:6.'
  - where: 'note 4:18 “Deliverance to the captives”'
    claim: '“Deliverance” (aphesis) usually means forgiveness in the New Testament, and embraces forgiveness offered to departed spirits'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'In the usual vocabulary of the New Testament, the noun rendered “deliverance” (Greek aphesis) usually means forgiveness (see 1:77; 3:3; 24:47). This sense lies just beneath this expression52 and, logically, embraces the forgiveness offered to departed spirits who will repent'
  - where: 'note 4:18 “Deliverance to the captives”'
    claim: 'The language is that of freeing from bondage; Isaiah is present when the Savior comes to the spirit world (D&C 138:42)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'Remarkably, the prophet Isaiah, who originally pens the lines that Jesus quotes, is present when the Savior comes to the spirit world to inaugurate the mission to recover souls (see D&C 138:42).'
  - where: 'note 4:18 “Deliverance to the captives”'
    claim: 'D&C 138:31, “the acceptable day of the Lord,” binds the phrase to the redemption proclaimed among the dead'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'A third meaning that appears in modern scripture binds a slightly different expression, “the acceptable day of the Lord,” to Jesus’ redeeming act, particularly as it is proclaimed among the dead (D&C 138:31).'
  - where: 'note 4:18 “Deliverance to the captives”'
    claim: 'Joseph F. Smith connected the spirit-world ministry to Isaiah 61; good news both in mortality and after'
    key: sc-knowhy-656
    url: 'https://scripturecentral.org/knowhy/why-does-jesus-announce-that-isaiah-611-2-is-fulfilled'
    quote: 'After Joseph F. Smith received his vision of that ministry, he connected the wonderful event to the prophecy recorded in Isaiah 61 (see Doctrine and Covenants 138:42).'
  - where: 'note 4:19 “Where He stopped reading”'
    claim: 'Isaiah 61:1–2 uses Jubilee imagery (Lev. 25); a Jubilee year had likely ended shortly before'
    key: sc-knowhy-656
    url: 'https://scripturecentral.org/knowhy/why-does-jesus-announce-that-isaiah-611-2-is-fulfilled'
    quote: 'Isaiah 61:1–2 deals with imagery relating to the Jubilee year, a time set apart in the law of Moses for debts to be forgiven and slaves to be set free (see Leviticus 25:8–24).'
  - where: 'note 4:19 “Where He stopped reading”'
    claim: 'A Jubilee year had likely ended shortly before Jesus began preaching'
    key: sc-knowhy-656
    url: 'https://scripturecentral.org/knowhy/why-does-jesus-announce-that-isaiah-611-2-is-fulfilled'
    quote: 'This passage may have had special significance for the people Jesus read it to that Sabbath because a Jubilee year had likely ended shortly before Jesus began preaching publicly.'
  - where: 'note 4:19 “Where He stopped reading”'
    claim: 'By stopping, Jesus separated the Messiah’s coming from the judgment of the last days'
    key: sc-knowhy-656
    url: 'https://scripturecentral.org/knowhy/why-does-jesus-announce-that-isaiah-611-2-is-fulfilled'
    quote: 'By ending His citation where He did, Jesus effectively separated the two aspects of Isaiah’s prophecy—who the Messiah would be and what the last days will be like when the Messiah comes in judgment.'
  - where: 'note 4:19 “Where He stopped reading”'
    claim: '“Acceptable” (dektos) anticipates “accepted” in 4:24'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'The term rendered “acceptable” (Greek dektos) has to do with what is acceptable to humans and anticipates the same term a few verses later that is rendered “accepted” (4:24).'
  - where: 'note 4:23 “Prove it here”'
    claim: 'The people of Nazareth thought Joseph Jesus’s father'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'Evidently, Jesus’ true origins have remained a family secret, for people of Nazareth think of Joseph as Jesus’ biological father.'
  - where: 'note 4:23 “Prove it here”'
    claim: '“Physician, heal thyself”: source unknown; likely “establish the proofs of your own claims”; disbelief (Matt. 13:58; Mark 6:6)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'A more attractive possibility may reside in the sense of, “Establish the proofs of your own claims” or “Show yourself really to be the person we hear about.” In this view, Jesus intimates a fundamental disbelief gnawing at his audience'
  - where: 'note 4:23 “Prove it here”'
    claim: 'Jesus would do the miracles Isaiah named, but not in Nazareth'
    key: sc-knowhy-656
    url: 'https://scripturecentral.org/knowhy/why-does-jesus-announce-that-isaiah-611-2-is-fulfilled'
    quote: 'Ironically, Jesus would perform the very miracles spoken of by Isaiah—healing the blind and broken hearted, preaching the gospel to the poor, and many more—but never in Nazareth.'
  - where: 'note 4:30 “Thrust out, and passing through”'
    claim: 'Those intending to execute took the accused outside the settlement (Lev. 24:14; Num. 15:35–36; 1 Kgs. 21:13)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'According to Leviticus 24:14, Numbers 15:35–36, and 1 Kings 21:13, those intending to execute a person for a crime are to take the accused outside of the settlement.'
  - where: 'note 4:30 “Thrust out, and passing through”'
    claim: 'The likely brow lies about a mile southeast; farther than a Sabbath day’s journey'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'the more natural “brow” lies to the southeast, approximately a mile from the middle of the old town. … To reach this “brow,” Jesus’ intended executioners have to travel more than a Sabbath day’s journey, a point of irony.'
  - where: 'note 4:30 “Thrust out, and passing through”'
    claim: 'Implicit: unusual power let Him slip away (John 8:59)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'Implicit in the account, it seems, is the notion that Jesus possesses unusual power that allows him to slip away (see John 8:59)'
  - where: 'note 4:30 “Thrust out, and passing through”'
    claim: 'Luke’s theme of rejection, which leads to the suffering servant and Jerusalem, starts with the expulsion from Nazareth'
    key: huntsman-lukes-jesus
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
    quote: 'Beginning with examples of his rejection, starting with his expulsion from Nazareth, it focuses with Jesus’s steadfast decision to go to Jerusalem, since “it cannot be that a prophet perish out of Jerusalem” (Luke 13:33–35).'
  - where: 'note 4:36 “With authority and power”'
    claim: 'The scribes taught by memorization and never on their own authority'
    key: bd-scribe
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/scribe?lang=eng'
    quote: 'Their method of teaching relied on memorization. … The scribes never taught on their own authority (contrast with this the Lord’s method, Matt. 7:29).'
  - where: 'note 4:41 “Why He silenced the devils”'
    claim: 'Jesus did not want demonic testimony to His messiahship'
    key: keller-mark-luke
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/mark-luke'
    quote: 'Jesus forbade the demons to proclaim who He was (see Mark 1:25, 34; 3:12), but that is understandable. He did not want demonic testimony to His messiahship.'
  - where: 'note 4:41 “Why He silenced the devils”'
    claim: 'The demons’ crying out injects chaos; Jesus brings order and quiet'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'the fact that the demons are “crying out” points to their efforts to inject chaotic commotion into his ministering activities. On this view, Jesus is controlling the scene, bringing order and quiet'
  - where: 'note 4:41 “Why He silenced the devils”'
    claim: 'In Luke there is no secret about His identity; He announced it at Nazareth'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'In addition, Jesus already announces publically who he is in Nazareth. In Luke’s recounting of events, there is no “secret” about the true identity of the Savior.'
  - where: 'note 4:41 “Why He silenced the devils”'
    claim: 'Apart from the devils (4:41), only Peter confesses Jesus as Christ in the ministry (9:20)'
    key: huntsman-lukes-jesus
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
    quote: 'Other than the testimony of devils (4:41), as in the other Synoptics, only Peter at Caesarea Philippi confesses that Jesus is “Christ” (9:20).'
  - where: 'note 4:43 “Sent to other cities”'
    claim: '“I must” (dei) expresses divine necessity, which characterizes His works and Atonement'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'Jesus expresses the divine necessity that lies in the Greek impersonal verb dei. This necessity will characterize his works and Atonement'
  - where: 'note 4:43 “Sent to other cities”'
    claim: '“Sent” points to a formal commissioning, as in 4:18'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'This expression points to an ordination, a formal commissioning. See the Notes on 3:2 and 4:18.'
  - where: 'note 4:43 “Sent to other cities”'
    claim: 'Healing was not His foremost purpose; proclaiming the kingdom was'
    key: keller-mark-luke
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/mark-luke'
    quote: 'Thus Jesus indicated that His healing ministry, with which all were so impressed, was really not His foremost purpose on earth. He had something more important to do, that is, proclaim the nearness of the kingdom of God'
  - where: christ
    claim: 'The Atonement heals broken hearts and breaks the chains of death and hell'
    key: sc-knowhy-656
    url: 'https://scripturecentral.org/knowhy/why-does-jesus-announce-that-isaiah-611-2-is-fulfilled'
    quote: 'Ultimately, Jesus would perform the consummate act of the Atonement, allowing our broken hearts to be healed and the chains of death and hell to be broken.'
  - where: christ
    claim: 'Disciples receive the Holy Ghost after baptism, as He did'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'If one holds up Jesus as the exemplar in receiving baptism (as in 2 Ne. 31:5–9), the point is inescapable.'
  - where: 'section 3 plain'
    claim: '“Deliverance” rendered “release”/forgiveness'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'In the usual vocabulary of the New Testament, the noun rendered “deliverance” (Greek aphesis) usually means forgiveness'
  - where: setting
    claim: 'Mark’s townspeople show quiet unbelief; Luke’s, complete fury'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'the debilitating but quiescent “unbelief” in townspeople of Mark’s report differs wholly from the complete fury that engulfs them in Luke’s'
  - where: setting
    claim: 'The miracles at the end of the chapter may fit the earlier preaching tour'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'we might view some of the miracles touched on briefly at the end of chapter 4, all evidently performed in Capernaum, as fitting naturally into the earlier preaching tour to which this verse alludes'
  - where: 'note 4:9 “The last temptation in Jerusalem”'
    claim: 'Luke begins with Gabriel and Zacharias in the temple'
    key: strathearn-gospels
    url: 'https://rsc.byu.edu/vol-8-no-2-2007/distinctive-testimonies-four-gospels'
    quote: 'While Zacharias was performing his priestly duties in the temple, the angel Gabriel appeared to him to announce that Zacharias and his wife would have a son in their old age (Luke 1:5–22).'
  - where: 'note 4:9 “The last temptation in Jerusalem”'
    claim: 'The other Gospels end in Galilee; Luke in Jerusalem'
    key: strathearn-gospels
    url: 'https://rsc.byu.edu/vol-8-no-2-2007/distinctive-testimonies-four-gospels'
    quote: 'Whereas the three other Gospels all narrate the final appearance of the Savior in Galilee (see Matthew 28:16; Mark 16:7; John 21:1), Luke concludes his Gospel in the city of Jerusalem (see Luke 24:49–53).'
  - where: 'note 4:12 “Scripture against scripture”'
    claim: 'The pattern follows the Father’s announcement at the baptism and the Son’s withstanding of the devil'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'a pattern that follows the blueprint of the Father’s announcement of Jesus’ identity at his baptism and the Son’s notable ability to withstand the devil’s enticements.'
  - where: 'note 4:12 “Scripture against scripture”'
    claim: 'The law trumps the Psalms, as the order in 24:44 shows'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'a passage taken from the law that trumps any passage from the Psalms, as the order of Jesus’ words about the divisions of scripture illustrates in 24:44'
  - where: 'note 4:12 “Scripture against scripture”'
    claim: 'Not to test the Lord into the spectacular; the road of humility; perhaps a command to tempt Him no more'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'The plain meaning is that one is not to tempt or test—the meaning of this term (Greek ekpeirazō)21—the Lord to do something that he would not otherwise do, such as to spend divine power on the frivolous or the spectacular.'
  - where: 'note 4:12 “Scripture against scripture”'
    claim: 'Perhaps a command to Satan to tempt Him no more'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'More pointedly, the Savior may well be commanding Satan to tempt him no more.'
  - where: 'note 4:12 “Scripture against scripture”'
    claim: 'Elder Hunter: the temptation to a dazzling feat that would bring crowds; faith precedes the miracle'
    key: hunter-temptations
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1976/10/the-temptations-of-christ?lang=eng'
    quote: 'the temptation to perform some dazzling feat, some astounding exploit which might bring crowds of amazed and attentive onlookers. … But faith is to precede the miracle; miracles are not to precede the faith.'
  - where: 'note 4:18 “Anointed: the Christ”'
    claim: 'Jesus fulfilled Isaiah’s declarations: the poor, the blind'
    key: sc-knowhy-656
    url: 'https://scripturecentral.org/knowhy/why-does-jesus-announce-that-isaiah-611-2-is-fulfilled'
    quote: 'Jesus would fulfill all of Isaiah’s prophetic declarations: He taught the Gospel to all who would listen, especially among the poor (Luke 6:20; Matthew 5:3). He performed many miracles, including healing the blind (Luke 18:35–43).'
  - where: 'note 4:18 “Anointed: the Christ”'
    claim: 'He may have added the Isaiah 58:6 line from memory'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'he may simply be adding the line from memory as one that points to the merciful, embracing reach of his impending ministry.'
  - where: 'note 4:18 “Deliverance to the captives”'
    claim: 'Footnote: “deliverance,” GR remission'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/4?lang=eng'
    quote: 'GR remission.'
  - where: 'note 4:18 “Deliverance to the captives”'
    claim: 'The words are the language of formal release from bondage or slavery'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'This sort of language points to formal acts of granting individuals their freedom from bondage or slavery, either by force or by agreement.'
  - where: 'note 4:19 “Where He stopped reading”'
    claim: 'The rest of Isaiah 61 treats the redemption of Zion and judgments on the wicked'
    key: sc-knowhy-656
    url: 'https://scripturecentral.org/knowhy/why-does-jesus-announce-that-isaiah-611-2-is-fulfilled'
    quote: 'The remainder of Isaiah 61 deals with the redemption and restoration of Zion and the Lord’s judgments against the wicked.'
  - where: 'note 4:19 “Where He stopped reading”'
    claim: 'Not deliverance from Rome, but healing and conquering death and hell'
    key: sc-knowhy-656
    url: 'https://scripturecentral.org/knowhy/why-does-jesus-announce-that-isaiah-611-2-is-fulfilled'
    quote: 'Far from offering deliverance from Roman occupation, however, Jesus would focus His ministry on healing the brokenhearted and the blind and on conquering death and hell.'
  - where: 'note 4:19 “Where He stopped reading”'
    claim: 'In the Jubilee lands returned to their owners'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'those in bondage for a debt are set free, and lands that have passed to others for a similar reason are restored to their original owners (see Lev. 25).'
  - where: 'note 4:23 “Prove it here”'
    claim: 'The source of the saying is unknown; “thyself” resists the sense of healing others'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'The source of this saying remains unknown, although scholars have identified similar sayings in ancient literatures.71 … But the singular pronoun “thyself” resists this understanding.'
  - where: 'note 4:30 “Thrust out, and passing through”'
    claim: 'Nazareth sits in a natural bowl; cliffs on the north edge'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'As in antiquity, Nazareth is situated in an elevated, natural bowl. Thus, the location of the brow of the hill is problematic. Cliffs overhang the town on the north edge'
  - where: 'note 4:36 “With authority and power”'
    claim: 'Footnote: “power,” GR authority'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/4?lang=eng'
    quote: 'GR authority.'
  - where: 'note 4:36 “With authority and power”'
    claim: 'The scribes aimed to reproduce accurately the words of the wise'
    key: bd-scribe
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/scribe?lang=eng'
    quote: 'Their aim was to reproduce and teach others to reproduce accurately the words of the wise'
  - where: 'note 4:41 “Why He silenced the devils”'
    claim: 'As He later banishes the mourners from Jairus’s house'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'as he later does when he banishes the noisy mourners from the house before raising Jairus’s daughter (see 8:51–55'
  - where: 'note 4:1 “Full of the Holy Ghost”'
    claim: 'Nephi: Jesus baptized, the Holy Ghost descended; His example; the Father gives the Holy Ghost to those baptized like Him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/31?lang=eng'
    quote: 'the Holy Ghost descended upon him in the form of a dove'
  - where: 'note 4:13 “Until an opportunity”'
    claim: '“For a season” can be rendered “until an opportunity”'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/4.htm'
    quote: 'for a season] Rather, until an opportunity, though the meaning comes to be the same (Acts 13:11).'
  - where: 'note 4:13 “Until an opportunity”'
    claim: 'The victory in the wilderness was not final; His temptations reached to Gethsemane'
    key: talmage-jesus-christ-10
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-10?lang=eng'
    quote: 'This victory over the devil and his wiles, this triumph over the cravings of the flesh, the harassing doubts of the mind, the suggested reaching out for fame and material wealth, were great but not final successes'
  - where: 'note 4:13 “Until an opportunity”'
    claim: 'Christ was not exempted from further assaults; temptation extended to Gethsemane'
    key: talmage-jesus-christ-10
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-10?lang=eng'
    quote: 'It is not to be supposed that Christ’s victorious emergence from the dark clouds of the three specified temptations exempted Him from further assaults by Satan … That His temptations extended even to the agony in Gethsemane will appear as we proceed with this study.'
  - where: 'note 4:13 “Until an opportunity”'
    claim: 'The season reaches to the hour of the power of darkness (22:53; John 14:30), when the devil tried Him with suffering as before with allurement'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/4.htm'
    quote: 'For a season.—Till a [convenient] season—i.e., till the close of the great work, the time of the power of darkness (Luke 22:53), when the prince of this world again came (John 14:30), and, trying then the power of suffering, as he had before tried the allurement of the world'
  - where: 'note 4:13 “Until an opportunity”'
    claim: 'The return points to Luke 22:3 and 22:53'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/4.htm'
    quote: 'See too Luke 22:3; Luke 22:53'
  - where: 'note 4:13 “Until an opportunity”'
    claim: 'Luke 22:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/22?lang=eng'
    quote: 'Then entered Satan into Judas surnamed Iscariot, being of the number of the twelve.'
  - where: 'note 4:13 “Until an opportunity”'
    claim: 'Luke 22:53'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/22?lang=eng'
    quote: 'but this is your hour, and the power of darkness.'
  - where: 'note 4:13 “Until an opportunity”'
    claim: 'John 14:30'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/14?lang=eng'
    quote: 'for the prince of this world cometh, and hath nothing in me.'
  - where: 'note 4:16 “Standing to read, sitting to teach”'
    claim: 'Jesus had sat in the synagogue as boy and man; now eligible as reader, He stood at the reading from the prophets'
    key: talmage-jesus-christ-13
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-13?lang=eng'
    quote: 'but now, as a recognized teacher of legal age He was eligible to take the reader’s place. On this occasion He stood up to read, when the service had reached the stage at which extracts from the prophetical books were to be read to the congregation.'
  - where: 'note 4:16 “Standing to read, sitting to teach”'
    claim: 'The reader who commented had to sit; when Jesus sat, the people knew He would expound'
    key: talmage-jesus-christ-13
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-13?lang=eng'
    quote: 'It was allowable for the reader in the service of the Jewish synagog to make comments in explanation of what had been read; but to do so he must sit. When Jesus took His seat the people knew that He was about to expound the text'
  - where: 'note 4:16 “Standing to read, sitting to teach”'
    claim: 'Sitting was the attitude for the sermon (Matt. 23:2)'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/4.htm'
    quote: 'sat down] The ordinary Jewish attitude for the sermon (Matthew 23:2).'
  - where: 'note 4:16 “Standing to read, sitting to teach”'
    claim: '“Opened” means unrolling; the prophets were on single rollers and the reader had to find the place'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/4.htm'
    quote: 'If anaptuxas is the true reading, it means ‘unrolling.’ … but the Megilloth of the Prophets, &c., were on single rollers, and the right place had to be found by the reader (Maphtir).'
  - where: 'note 4:16 “Standing to read, sitting to teach”'
    claim: '“Found” leaves open whether He chose the passage or it was the day’s reading'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/4.htm'
    quote: 'The word heure leaves it uncertain whether the ‘finding’ was what man calls ‘accidental,’ or whether it was the regular haphtarah of the day.'
  - where: 'note 4:16 “Standing to read, sitting to teach”'
    claim: 'Matt. 23:2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/23?lang=eng'
    quote: 'Saying, The scribes and the Pharisees sit in Moses’ seat:'
