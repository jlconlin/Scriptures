  - where: 'note 4:40 “At sunset, hands on every one”'
    claim: 'When the sun had set the Sabbath had passed'
    key: talmage-jesus-christ-13
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-13?lang=eng'
    quote: 'In the evening of the same day, when the sun had set, and therefore after the Sabbath had passed, the people flocked about Him, bringing their afflicted friends and kindred'
